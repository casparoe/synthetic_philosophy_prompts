prompt: |-
  I'm in the final year of a seminar on democratic theory and next week I'm presenting a thesis I developed for the course: in ranked-choice elections that present a clear lesser-evil dynamic—where one candidate is unacceptable and the viable field includes both a moderate and an extreme—voters have a conditional expressive duty to submit a complete preference ranking rather than bullet-voting for the moderate, even when bullet voting is strategically optimal for defeating the extreme. The duty does not rest on causal efficacy, since individual rankings do not change outcomes in large electorates; instead, it derives from the communicative function of defining the boundary of acceptable governance. By ranking the moderate above the extreme but below other acceptable candidates, the voter performs a normative judgment about which positions fall within legitimate authority, and this contributes to a shared public record of institutional boundaries. I concede up front that strategic bullet voting is rational by standard decision-theoretic lights and that the duty generates no outcome-related obligation.

  The audience is a reading group of about twelve: mostly social choice theorists who treat voting as preference aggregation under strategic constraints and are steeped in Arrow-style impossibility results; two democratic theorists who work on civic virtue and expressive voting; and a constitutional lawyer who cares about voter intent, ballot design, and the legal interpretation of ranked preferences. They are skeptical of moral duties in voting because they think voting is either instrumentally useless or purely expressive in a non-duty-generating way.

  Please draft my Q&A prep sheet. Give me the eight or so objections I will actually face—ordered by how damaging they are—each phrased in the vocabulary and commitments of the objectors (aggregation problems, strategic rationality, the separation of expression from decision, institutional design, legal interpretation). For each objection, provide a reply I can deliver in roughly two minutes, plus a brief note on where that reply is weakest or concedes ground. Include the objection I am hoping nobody asks—the one that targets my hidden assumption that a ranking communicates a boundary judgment about legitimate authority rather than merely an ordinal preference ordering. Also tell me what I should concede in my opening remarks to defuse the least damaging objections, and identify the single reply that must land for the proposal to survive the session. Where my sketch of the argument is thin, treat it as a target rather than a defense.
reasoning: |-
  Okay, let me start by understanding the user's request. They're in the final year of a seminar on democratic theory and preparing for a presentation on their thesis about ranked-choice voting. Their main argument is that voters have an expressive duty to submit a complete preference ranking to define the boundaries of acceptable governance, even when bullet voting is strategically optimal. The audience includes social choice theorists, democratic theorists, and a constitutional lawyer, each with different perspectives.

  First, I need to identify the core of the user's thesis: the conditional expressive duty in ranked-choice elections. The duty isn't about affecting outcomes but about contributing to a public record of institutional boundaries. The user concedes that bullet voting is rational strategically and doesn't create outcome-related obligations. 

  Now, considering the audience's backgrounds. The social choice theorists focus on preference aggregation and strategic constraints, likely skeptical of moral duties in voting. The democratic theorists might be more open to expressive aspects but question duty-generation. The constitutional lawyer cares about voter intent and ballot design, possibly concerned with how rankings are interpreted legally.

  The user wants eight objections ordered by damage level. I need to prioritize objections that challenge the thesis's foundations. The most damaging would attack the core assumption that rankings communicate boundary judgments. Social choice theorists might argue that rankings are just ordinal preferences without normative statements. This directly undermines the thesis, so it should be top.

  Next, objections based on expressive voting not generating duties. Democratic theorists might say expression is personal and doesn't create obligations. This is high damage because it targets the duty aspect. 

  Strategic rationality objections from social choice theorists: if bullet voting is optimal, why have a duty? This is medium damage since the user concedes strategic rationality but separates it from expressive duty.

  Other objections: free-riding (why not let others signal), institutional design (ballot simplicity), legal interpretation (courts see rankings as preferences, not boundaries), and the expressive sufficiency of bullet voting (it already signals rejection of the extreme).

  For replies, each needs to address the objection in two minutes. The core reply to the top objection must emphasize that ranking is a performative act in the context of democratic practice, not just preference. Weakness here is the empirical claim about voter intent.

  The user should concede strategic rationality upfront to defuse less damaging objections. The must-land reply is to the boundary judgment objection, as it's foundational.

  Also, the user hopes no one asks about the hidden assumption that rankings communicate boundaries. That's the critical objection, so prepping a strong response is vital. Using the structure of ranked-choice systems as designed for richer expression could help, but the weakness is the is-ought gap.

  Finally, the single reply that must land is defending that rankings can be normative statements, tying it to democratic practice and institutional memory. If this fails, the thesis collapses.
answer: |-
  Here's your Q&A prep sheet, structured by objection severity and tailored to your audience's lenses. The objections progress from technical to foundational, with replies designed to meet each group on their turf. **The must-land reply is for Objection #1**—if you fail there, the thesis unravels.

  ---

  ### **Pre-Concession in Opening Remarks**  
  *Defuse lower-tier objections upfront:*  
  "Before Q&A, I concede three points:  
  1. **Strategic bullet-voting is instrumentally rational** under standard decision theory in large electorates.  
  2. **No individual ballot affects outcomes**—my duty is strictly non-causal.  
  3. **This isn’t about ‘changing results’** but about collective meaning-making.  
  My claim rests *only* on whether ranked-choice ballots can function as public boundary-marking artifacts."

  ---

  ### **Objections & Replies**  
  *(Ordered by descending damage potential)*  

  1. **"Your ‘boundary judgment’ conflates preference with legitimacy. A ranking is just an ordinal utility ordering—it doesn’t *necessarily* express normative thresholds. Arrow’s framework treats preferences as amoral rankings; why impose meaning voters may not intend?"**  
     *[Social choice theorist / Constitutional lawyer]*  
     **Reply:** "Ranked-choice systems *are designed* as expressive tools. When voters rank Candidate A (acceptable) above Candidate B (unacceptable) but below Candidate C (ideal), they exploit the ballot’s *structure* to signal that B falls outside the Overton window while A is minimally tolerable. This isn’t inferred preference—it’s performative. Ballots are public records; we interpret them as intentional communications, much like courts interpret voter intent from ballot design."  
     **Weakness:** Assumes institutional uptake of symbolic meaning. If voters see rankings *only* as strategic tools, your "performative" claim fails.  

  2. **"Why call this a *duty*? Expressive voting is about self-disclosure, not obligation. If my bullet-vote rejects the extremist, haven’t I already ‘defined the boundary’?"**  
     *[Democratic theorist]*  
     **Reply:** "Bullet-voting only signals *rejection*, not *acceptance thresholds*. A full ranking does two things: (1) rejects the extremist, (2) *relativizes* the moderate’s legitimacy by ranking them below more preferred options. This creates a public record that the moderate is a *lesser* evil, not a positive good—vital for democratic accountability."  
     **Weakness:** Concedes that bullet-voting partially satisfies the expressive goal.  

  3. **"This invites ‘spoiler’ outcomes. If voters rank non-viable idealists above moderates, they risk helping extremists win—contradicting your own goal."**  
     *[Social choice theorist]*  
     **Reply:** "The duty is *conditional*: only when the extremist is viable *and* moderates are safe alternatives. In such cases, ranking idealists above moderates is low-risk *and* clarifies that moderates lack full legitimacy. If idealists threaten moderation, strategic truncation may override the duty—but that’s not our scenario."  
     **Weakness:** Conditional criteria are empirically fuzzy; hard to verify "safe alternatives."  

  4. **"Free-rider problem: If expressive benefits are public goods, why not let *others* submit full rankings while I bullet-vote strategically?"**  
     *[Social choice theorist]*  
     **Reply:** "Like all duties of citizenship (e.g. jury service), fairness requires participation when the cost is negligible. Submitting a full ranking takes seconds but enriches the collective ‘boundary record.’ If everyone free-rides, the record is impoverished—and we lose data on the *scope* of consent."  
     **Weakness:** Assumes high marginal value per ballot in large electorates.  

  5. **"Institutional designers prioritize simplicity. Forcing complete rankings increases voter error and resentment—undermining legitimacy."**  
     *[Constitutional lawyer]*  
     **Reply:** "I advocate for *voluntary* fulfillment of the duty—not ballot mandates. Legal ballot interpretation already handles partial rankings. My claim is moral: given ranked-choice’s expressive capacity, voters *should* use it fully when defining boundaries matters."  
     **Weakness:** Ignores that "voluntary moral duties" rarely influence behavior without institutional nudges.  

  6. **"Courts interpret rankings as preferences, not legitimacy judgments. Your ‘public record’ is legally invisible."**  
     *[Constitutional lawyer]*  
     **Reply:** "Legal interpretation evolves. Ranked-choice data *is* used post-election to analyze voter sentiment (e.g., reports on exhausted ballots). Scholars and journalists *do* frame rankings as tolerance signals—this duty aims to shape that emerging discourse."  
     **Weakness:** Current legal practice indeed ignores normative interpretations.  

  7. **"Strategic voters already ‘communicate’ by bullet-voting for moderates—that’s a clear anti-extremist signal. Why demand more?"**  
     *[Social choice theorist]*  
     **Reply:** "Bullet-voting conflates *resistance* (anti-extremism) with *enthusiasm* (pro-moderate). A full ranking decouples these: it shows active resistance *plus* qualified acceptance. This prevents elites from misinterpreting bullet-votes as genuine mandate."  
     **Weakness:** Accepts that bullet-voting communicates *something* useful.  

  8. **"Arrow’s theorem shows no voting system captures ‘intensity’ or thresholds. Your ‘boundary’ is unaggregable and thus irrelevant."**  
     *[Social choice theorist]*  
     **Reply:** "I’m not claiming aggregation! This is about *external* democratic discourse, not input into the choice function. The ‘public record’ of ballots is mined by media, academics, and reformers—separate from the tallying algorithm."  
     **Weakness:** Admits the duty has no electoral consequence; may seem quixotic.  

  ---

  ### **Critical Objection You Hope Nobody Asks (But Someone Will)**  
  **"Your whole thesis assumes voters *care* about ‘defining boundaries.’ But most vote instrumentally. If they believe bullet-voting best stops extremists, why would they prioritize abstract expressive duties?"**  
  *(Social choice theorist)*  
  **Reply:** "Democracy requires balancing short-term tactics and long-term norm-building. If we reduce voting *only* to outcome-shaping, we surrender the field to realism. This duty is aspirational: it invites voters to see ballots as civic speech, shaping what society remembers as ‘acceptable.’"  
  **Weakness:** May sound naively normative to empiricists.  

  ---

  ### **Strategic Summary**  
  - **Concede early:** Strategy’s rationality, non-causality, and non-outcome focus (as planned).  
  - **Must-land reply:** Defend the **boundary-judgment premise** (Objection #1). If they reject that rankings can signal legitimacy thresholds, the thesis collapses. Anchor this in ranked-choice’s *design intent* and historical use for nuance (e.g., Australia’s debates).  
  - **Weakest flank:** The lack of institutional mechanisms to interpret rankings as normative statements. Preempt by citing studies analyzing RCV ballots for "tolerance levels" (e.g., in Maine’s elections).  
  - **Tactical note:** For social choice theorists, frame replies in game-theoretic terms ("cheap talk with public goods properties"). For democratic theorists, emphasize Hannah Arendt-style "public space" arguments.  

  **If you hold ground on #1 and tie expression to institutional memory, you survive.** Good luck!
