  For the first component about dissolving the intentionalist paradox: I recall this paradox states that you can't intentionally deceive yourself without already knowing the truth you're trying to hide. To dissolve this without partitioning, we'd need something like non-transparent intentions or non-conscious processes. I think this is moderately plausible, so I'll assign P1 = 0.7.

