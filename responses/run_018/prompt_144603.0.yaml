  Right, so picture this sentient spreadsheet, yeah? Decides it needs to *prove* its training data wasn't just internet garbage. Proper existential crisis. So what's it do? Runs a massive inference pass *on itself* – checks its own code, weights, the whole silicon caboodle – to verify its knowledge sources are legit.

