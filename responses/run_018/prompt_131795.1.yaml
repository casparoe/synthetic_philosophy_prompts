answer: |-
  ### Thesis Defense Q&A Prep Sheet  
  **Thesis in a line:**  
  Moral reasoning is exclusively analogical pattern-matching with no representational or generalizable content, modeled via predictive processing where moral perception arises from non-conceptual prediction-error minimization.  

  ---

  ### The Hits (Ordered by Damage Potential)  
  1. **Virtue Ethicist (Phronesis/Objection):**  
     *Their phrasing:* "If there are *no* stable character traits or generalizations, how can phronesis even function? It requires consistent dispositions to perceive moral salience!"  
     *Reply:* "Phronesis isn’t grounded in stable traits but in dynamic, context-sensitive pattern-recognition honed through experience—like a chess master spotting board configurations without rules. Predictive processing shows this as *pattern-completion*: past moral ‘hits’ shape anticipations for new situations, no generalizations needed. Traits are post-hoc descriptions of reliable pattern-matches."  
     *Soft spot:* Implies character traits are *epiphenomenal*, which may feel counterintuitive for virtue ethics’ focus on cultivation.  

  2. **Kantian (Moral Phenomenology/Objection):**  
     *Their phrasing:* "But when I judge ‘lying is wrong,’ I *feel* the force of a universal principle. How does pattern-matching explain the categorical authority of moral obligations?"  
     *Reply:* "The ‘feeling’ of universality is a *predictive illusion*—your brain matches this scenario to past patterns where similar acts had negative outcomes. Predictive processing frames this as top-down expectations (e.g., ‘deception → distrust’) generating affective error-signals when violated. No principle is represented; it’s affective pattern-violation."  
     *Soft spot:* Doesn’t fully address why moral violations *feel* intrinsically binding, not just pragmatically costly.  

  3. **Phil of Science (Parsimony/Objection):**  
     *Their phrasing:* "If analogical reasoning suffices, why invoke predictive processing? You’re adding complexity without explanatory gain over simple case-based reasoning."  
     *Reply:* "Predictive processing *unifies* moral perception: it explains why some analogies dominate (high-precision predictions), how moral dilemmas arise (competing pattern-matches), and why moral learning is error-driven. Parsimony isn’t about simplicity but explanatory scope—this model covers moral shock, conviction, and development mechanistically."  
     *Soft spot:* Risks looking like a *just-so story* if neural mechanisms aren’t fleshed out.  

  4. **Kantian (Agency/Objection):**  
     *Their phrasing:* "Without general rules, what grounds moral responsibility? If I act on analogies alone, I’m just reacting—not obeying duty."  
     *Reply:* "Responsibility emerges from *pattern-accountability*: you’re answerable for failing to recognize salient features (e.g., distress cues) your history trained you to anticipate. Predictive processing frames this as *precision-weighting*—ignoring high-precision signals (e.g., a plea for help) is a culpable prediction-error."  
     *Soft spot:* May reduce duty to *predictive negligence*, undermining Kantian autonomy.  

  5. **Virtue Ethicist (Development/Objection):**  
     *Their phrasing:* "How do we *improve* at moral reasoning without general maxims? Mentors teach ‘be courageous,’ not just point to patterns!"  
     *Reply:* "Mentors provide *corrective feedback* on pattern-matching—e.g., ‘Notice how this *differs* from last time.’ No maxim is transferred; you’re calibrating perceptual expectations. Predictive processing models this as adjusting prior weights (e.g., ‘situational risk’ gains precision) via error-signals."  
     *Soft spot:* Doesn’t explain how *novices* bootstrap pattern-recognition without proto-generalizations.  

  ---

  ### The Nightmare Question  
  **Target:** Predictive processing analogy’s normative gap.  
  *Their phrasing:* "Predictive processing optimizes sensory efficiency, but morality demands *normative* force. How can prediction-error minimization—which evolved for survival—explain why I *should* prioritize your pain over my prediction? Isn’t this just reframing ‘is’ as ‘ought’?"  
  *Reply:* "The model doesn’t derive ‘ought’ from prediction; it shows how ‘ought’ *arises* as a felt imperative within the system. Moral ‘error’ signals (e.g., empathy) are entrenched predictive dispositions from social evolution—their violation *feels* non-negotiable. But yes, the *authority* of these signals is presupposed, not explained—this is about moral *cognition*, not metaethical grounding."  
  *Why it’s deadly:* Concedes the analogy can’t ground normativity, making the whole framework instrumental.  

  ---

  ### What to Concede First  
  "Let me grant this upfront: my view *is* revisionist about moral phenomenology. We often *feel* like we’re applying principles, but I argue this is a post-hoc gloss on subconscious pattern-matching. If that’s jarring, it’s because the predictive mind disguises its mechanics."  

  ---  
  **Tactical note:** For Kantians, stress *phenomenology* (how moral thinking feels); for virtue ethicists, stress *practical skill* (how phronesis works sans traits). For phil of science, emphasize *unification* over reduction.
