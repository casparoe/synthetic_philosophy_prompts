prompt: |-
  hey so im a backend engineer with basically zero formal philosophy background—just some podcast episodes and random wikipedia dives—and lately ive been arguing with my friends about whether people are naturally decent or if we need heavy rules to keep things from falling apart. someone brought up mencius and xunzi, and i got kind of obsessed: mencius thinks human nature has these little sprouts of goodness that just need watering, while xunzi thinks we're fundamentally self-interested and need rituals and education to hammer us into shape. it feels like the same tension you see when people debate whether to design ai guardrails assuming good-faith users or assuming adversarial behavior, or whether company onboarding should nurture innate talent or drill strict protocols.

  anyway, im not asking for a history lesson or a comparison essay. within the mencius-xunzi debate on human nature, what are the actual open conceptual questions or lines of work that matter most—especially if you care about institutional design, moral education, or even how we model learning in artificial systems? i want you to prioritize maybe three or four unresolved issues, defend the ordering with real reasoning, and tell me which ones are upstream of others, which are tractable for someone who cant read classical chinese, and which ones are overrated or wouldnt change anything practical even if settled. please dont give me a bibliography or tell me to read specific scholars; i genuinely dont have library access and want arguments i can weigh on their own. also sorry if my framing is weird—im just trying to avoid the standard "compare and contrast" thing i could have written in tenth grade. oh and i have a typo in here somewhere, ignore it.
