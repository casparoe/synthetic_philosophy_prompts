answer: |-
  This critique cuts to the heart of statutory interpretation theory. The practice you describe rests on a specific, albeit often implicit, philosophy of language and communication. Let's reconstruct the implicit theory, examine its coherence, and explore the consequences of shifting to intentionalism.

  ### The Implicit Theory: Conventionalism and Textual Objectivity
  The core presupposition is **meaning conventionalism**: the meaning of a statutory term is fixed by **public linguistic conventions existing at the time of enactment**. This entails:

  1.  **Objectivity & Public Accessibility:** Meaning resides in the shared, objective conventions of the language community, not in the private thoughts of drafters. This is accessible through evidence of common usage.
  2.  **Democracy & Fair Notice:** Laws bind the public. Citizens must be able to understand their obligations and rights based on the public meaning of the text, not by divining secret legislative intent. Relying on public conventions respects democratic legitimacy and fair notice.
  3.  **Judicial Role as Faithful Agent:** The judge's task is to discover and apply the law *as enacted* (the public text), not to reconstruct or second-guess the unexpressed wishes of legislators. Using dictionaries aligns with this textual fidelity.
  4.  **Distrust of Legislative "Intent":** Legislative history is seen as:
      *   **Unreliable:** It may reflect the views of only a few members (sponsors, committee chairs), not the full body that voted.
      *   **Manipulable:** Statements can be strategically inserted without broad support.
      *   **Inaccessible:** The public cannot reasonably be expected to research committee reports to understand the law.
      *   **Potentially Contradictory:** Different reports or statements may conflict.
      *   **Not Law:** Only the enacted text has the force of law; the history is merely evidence about it, and often poor evidence of *public* meaning.

  **What Must Meaning Be?** Meaning must be **conventional, objective, and public**. It is a property of language-in-use by the community at a specific time.

  **What Must Communication Consist In?** Communication is the successful transmission of **conventional meaning** from a speaker/author (the legislature) to an audience (the public/judiciary) via a public linguistic code. The legislature is assumed to have used words according to their ordinary public meanings to convey its directives.

  ### Rival Accounts Ruled Out vs. Merely Not Needed
  *   **Ruled Out (Incompatible):**
      *   **Strong Speaker-Intention Theories:** Theories where meaning is *solely* or *primarily* determined by the speaker's private mental state (e.g., "The legislators *meant* X when they said Y, even if no one else would understand it that way") are fundamentally incompatible. The practice explicitly distrusts drafters' statements as direct evidence of meaning.
      *   **Radical Subjectivism:** Views where meaning is entirely idiosyncratic or subjective are ruled out by the search for objective, shared conventions.
  *   **Merely Not Needed (Potentially Compatible, but Not Required):**
      *   **Moderate Intentionalism:** The view that meaning *includes* the speaker's intention to use words in their conventional sense (e.g., Gricean "reflexive" intentions) is *compatible* but *not presupposed*. The practice focuses solely on the convention, agnostic about the speaker's mental state beyond their presumed competence in the language.
      *   **Use Theories:** Theories emphasizing actual patterns of usage (e.g., Wittgensteinian) are broadly compatible. Dictionaries are seen as *evidence* of usage conventions. However, the practice often *substitutes* dictionaries for more comprehensive usage evidence.
      *   **Interpretive-Community Views (Legal Community):** Views where meaning is fixed by specialized legal conventions (e.g., terms of art) are accommodated *in part* (courts recognize terms of art), but the practice strongly prioritizes the *general public* linguistic community over the narrower legislative or even legal community for "ordinary meaning." The practice presupposes the *general* community is primary for non-technical terms.
      *   **Audience-Oriented Views:** Theories focusing on the audience's understanding (e.g., reader-response) could be compatible *if* the audience is understood as the general public at enactment. However, the practice uses dictionaries as a *proxy* for this understanding, not evidence of actual audience reception. The focus remains on the objective convention, not subjective reception.

  ### Underdetermined Aspects
  1.  **The Nature of "Convention":** The practice doesn't strictly require a specific meta-theory of convention (e.g., Lewisian coordination vs. simple regularity). It just requires that conventions exist and are discoverable.
  2.  **The Best Evidence of Convention:** The practice *uses* dictionaries but doesn't *strictly presuppose* they are the *only* or *best* evidence. It could theoretically accommodate corpus linguistics, surveys of contemporary usage, etc., though it historically hasn't prioritized them. The reliance on dictionaries is practical/conventional, not philosophically necessary.
  3.  **The Precision of "Ordinary Meaning":** The practice assumes a relatively stable "ordinary meaning" exists but is philosophically underdetermined on how fuzzy boundaries, context-sensitivity (beyond textual canons), or competing ordinary meanings are resolved. Textual canons (e.g., *noscitur a sociis*, *ejusdem generis*) often fill this gap, but their theoretical basis within conventionalism can be contested.
  4.  **The "Moment" of Enactment:** While presupposing meaning is fixed at enactment, the practice doesn't strictly define how granular the "moment" is (day of vote? period of debate?).

  ### Assessing Coherence: Tensions in the Practice
  1.  **Dictionaries vs. Actual Usage:** If meaning is fixed by public convention, **why prioritize dictionaries over broader evidence of actual contemporary usage?** Dictionaries are lexicographer *descriptions* of usage, often lagging or selective. Reliance on them, especially multiple or conflicting ones, can seem inconsistent with a pure public convention theory. A truly consistent conventionalist might prefer corpus linguistics or other usage data. The practice risks substituting the lexicographer's *authority* for evidence of the *community's* convention.
  2.  **Historical Dictionaries vs. Present Convention:** Consulting *historical* dictionaries often coheres well with fixing meaning at enactment. However, consulting *modern* dictionaries for historical meaning (common when old statutes are interpreted) is incoherent unless justified as evidence *of the past convention* – which modern dictionaries are poorly suited for. This creates a tension.
  3.  **General Community vs. Legal/Legislative Community:** The practice coherently prioritizes the *general* linguistic community based on **democratic legitimacy and fair notice**: laws bind everyone, so everyone must be able to understand them based on common language. Prioritizing a specialized legislative or legal community meaning would undermine this principle for non-technical terms. It presupposes the legislature *intended* (or is presumed to have intended) to use words in their ordinary, public sense unless clearly indicating otherwise (e.g., defined terms).

  ### Shifting to Forthright Intentionalism: A Courtroom Revolution
  Replacing the implicit conventionalism with strong intentionalism (meaning = the specific intentions of the legislators/drafters) would radically alter courtroom practice:

  1.  **New Central Evidence:** Legislative history (committee reports, sponsor statements, floor debates, testimony, potentially even rejected amendments showing scope) becomes the **primary and most important evidence**. Understanding the specific problems legislators sought to solve and their stated reasons for word choices becomes paramount.
  2.  **Diminished Role of Dictionaries:** Dictionaries become secondary, used only to resolve ambiguities in the expressed intent or perhaps to confirm the public meaning the legislators *assumed* they were invoking. Consulting historical dictionaries might persist to understand the linguistic backdrop *against which* legislators acted.
  3.  **Irrational Moves Under Intentionalism:**
      *   Ignoring clear, unambiguous statements of intent in legislative history because they contradict a dictionary definition.
      *   Strictly applying textual canons (like the rule of lenity) when legislative history overwhelmingly shows a contrary specific intent.
      *   Rejecting relevant legislative history as inadmissible or per se unreliable.
      *   Prioritizing hypothetical "reasonable person" understanding over actual legislative will where evidence of the latter exists.
  4.  **Potential Survivors:**
      *   **Defined Terms:** Statutes defining terms would still control, as they represent enacted legislative intent.
      *   **Terms of Art:** Recognizing specialized legal meanings could survive if evidence shows legislators *intended* to use the term in its technical sense.
      *   **Canons as Intent Evidence:** Some textual canons (e.g., *expressio unius*) might be retained as *presumptions* about likely legislative intent, subject to rebuttal by actual history.
      *   **Avoiding Absurdity:** The absurdity doctrine might persist as a limited safety valve, justified as preventing an outcome legislators *could not possibly* have intended.

  **Conclusion:** The current dictionary-centric practice rests on a conventionalist, public-meaning theory prioritizing democratic legitimacy and judicial objectivity. While philosophically underdetermined in specifics, it fundamentally rejects strong intentionalism. Shifting to intentionalism would elevate legislative history to supremacy, fundamentally changing how statutes are understood and applied, moving the focus from public linguistic convention to the private (though documented) will of the lawmakers. The core tension remains: is law the public text or the unexpressed (but documented) will of its creators? The current practice firmly chooses the former.
