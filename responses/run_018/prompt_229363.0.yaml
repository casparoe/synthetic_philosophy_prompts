prompt: |-
  I'm a philosophy professor, and somehow half my job is running votes: hiring committee shortlists, picking which colloquium speakers to invite, curriculum proposals, grad admissions waitlists. A while back I actually sat down and read up on the Gibbard-Satterthwaite theorem (partly out of guilt, since I teach social choice every few years and always hand-wave the proof), and it's been bugging me ever since. As I understand it: once there are three or more options, any deterministic rule for picking a single winner that isn't a dictatorship and lets every option possibly win can be gamed by someone voting insincerely. Fine. Depressing, but fine. The thing is, I still have to run these votes next semester, and the theorem doesn't come with a "so here's what to do about it" section.

  So: turn what the theorem actually implies -- and just as importantly, what it does NOT imply -- into a practical procedure I can follow when I'm setting up a departmental vote. Roughly: given the kind of decision, the number of options, what I know about how people's preferences line up, and how much I care about sincere voting versus other goods (speed, legitimacy, the losers not feeling robbed), which rule should I use? Or should I restructure the choice itself instead -- narrow the field first, vote on things one at a time, pair options off?

  Some constraints on the procedure:

  - It should start from the theorem's actual content and scope conditions. It only bites, as I understand it, when preferences are unrestricted, so I want an early step that checks whether something like single-peakedness plausibly holds in the case at hand (hiring votes often feel nearly one-dimensional -- research quality -- until someone mentions teachign coverage and suddenly we're in two dimensions and I'm doomed). The procedure should say what to do when the theorem genuinely applies versus when a restriction plausibly saves me.
  - It should distinguish "the theorem says strategic voting is possible" from "strategic voting is likely and worth designing around." I suspect a lot of people overread it as "everyone will lie all the time," and I don't think that's what it says.
  - It should go through the escape hatches I keep hearing about and say whether each one genuinely escapes: sequential elimination with an agenda, approval voting (voters aren't submitting rankings, so is it even under the theorem's jurisdiction?), randomization, deliberation before the vote, just... refusing to have more than two options on the table.
  - Include three worked applications: (a) a hiring committee ranking four candidates for one job; (b) a faculty meeting choosing among five curriculum proposals with known factions; (c) at least one case where the procedure gives me an answer I won't like -- e.g., it tells me a rule I'd pick on other grounds is fine despite being manipulable, or it tells me to shrink the agenda when I'd rather not.
  - Be explicit about what the theorem can't settle. As far as I know it says nothing about which rule's manipulability is worst in practice, nothing about legitimacy, nothing about when strategic voting is even bad. Mark clearly where the procedure runs out and I'm back to judgment.

  Write it as an actual checklist or flowchart-in-words I could tape next to my office door, not an essay. Casual tone is fine; I'm going to be following this thing at 4:45pm in a stuffy seminar room and I need it to work then.
reasoning: |-
  Okay, the user is a philosophy professor who deals with departmental votes and is troubled by the Gibbard-Satterthwaite theorem. They need a practical guide to navigate voting rules given the theorem's implications. Let me start by recalling the theorem: it states that with three or more options, any non-dictatorial voting system is manipulable if all outcomes are possible. But the user wants to know how to apply this in real scenarios.

  First, the user mentioned constraints. They want the guide to start by checking if preferences are single-peaked or have some structure, which can avoid the theorem's bite. So, the procedure should first assess dimensionality. For example, in hiring, research quality might be the main axis until teaching comes in, creating two dimensions. I need a step to determine if preferences are likely structured.

  Next, distinguish between possible manipulation and likelihood. The theorem says manipulation can happen, not that it will. So, the guide should evaluate if incentives for strategic voting are high. Factors like faction sizes or high stakes matter here.

  Then, consider escape hatches. Sequential elimination, approval voting, randomization, deliberation, or reducing options. Need to explain which actually bypass the theorem. Approval voting escapes because it's not a ranked system, but it has other issues. Randomization might be a solution but lacks legitimacy. Deliberation can align preferences, making manipulation less likely.

  Worked examples are crucial. Hiring with four candidates: likely one-dimensional, so ranked choice might work. Curriculum proposals with factions: multi-dimensional, so approval voting could be better. A case where the answer is unpopular, like forcing a reduction to two options.

  Also, highlight what the theorem doesn't cover: legitimacy, efficiency, or how often manipulation occurs. The guide must note where judgment is needed.

  The user needs a checklist, not an essay. Use clear steps. Start with dimensionality check, then assess manipulation risk, then choose a voting rule based on context. Include the examples to illustrate.

  In the hiring example, research quality is key. But if teaching becomes a factor, it's two-dimensional. If structured, use ranked pairs; if not, approval voting. For curriculum, factions suggest high manipulation risk, so approval or runoff. The unpopular case might be reducing options when they prefer more, but it's necessary to avoid manipulation.

  Make sure to mention that even manipulable systems can be used if the risk is low. Also, clarify that approval voting escapes the theorem but has its own strategic issues.

  Finally, the user cares about practical application—speed, legitimacy, fairness. The guide should balance these with manipulation risks. Highlight trade-offs, like using randomization for fairness but losing legitimacy.
answer: |-
  Here's your Gibbard-Satterthwaite Survival Kit – a practical checklist for departmental votes, designed for the 4:45pm seminar room haze:

  **Gibbard-Satterthwaite (GS) Reality Check: The Core**
  *   **Applies ONLY IF:** (1) **3+ options** on the table *for a single winner*; (2) Voters submit **rankings** (or equivalent preference orders); (3) Rule is **deterministic** (input rankings -> fixed winner); (4) Rule is **non-dictatorial**; (5) Rule is **non-imposed** (any option *can* win with *some* vote profile).
  *   **What it REALLY says:** Under these conditions, **some voter, with some preference order, facing some pattern of other votes, can get a *better* outcome by submitting a *different* (insincere) ranking than by voting sincerely.** It's about *possibility*, not inevitability.
  *   **What it DOESN'T say:** That everyone will always lie. That every vote is manipulable. That you can't have a "good" system. That sincere voting is always the highest good.

  ---

  **The Practical Voting Procedure Checklist**

  **Step 1: Assess the Preference Landscape (Can I Dodge GS?)**
  *   **A. Dimensionality Check:** Is there one clear, shared dimension people mostly care about? (e.g., "Research Quality" for hires, "Cost/Benefit" for equipment).
      *   **YES (Likely Single-Peaked):** GS *might* be dodged! (e.g., Borda, Condorcet methods *can* be strategy-proof here). *Proceed with ranked voting (Step 3) cautiously.*
      *   **NO (Multi-Dimensional):** GS applies. Preferences are messy (e.g., hires: research vs. teaching vs. collegiality; curriculum: pedagogy vs. coverage vs. workload). *GS bites, proceed to Step 2.*
  *   **B. "Semi-Peaked" Gut Check:** Even if multi-dimensional, are preferences *relatively* aligned? (e.g., everyone agrees on the top 2-3, just order differs; no deep polarization). If **YES**, manipulation *risk might be low*. If **NO** (clear factions, deep divides), manipulation *risk is high*.

  **Step 2: Assess Manipulation Risk & Stakes (Is GS a Big Deal *Here*?)**
  *   **A. Incentive:** How high-stakes is this? (Hiring/Grad Admissions = High; Colloquium Speaker = Medium; Coffee Brand = Low). High stakes = stronger incentive to manipulate.
  *   **B. Opportunity:** Are there obvious factions? (e.g., 5 proposals: 3 support A/B, 2 support C/D/E). Clear factions = easier coordination/manipulation.
  *   **C. Information:** How much do voters know about others' likely votes? (More info = easier manipulation).
  *   **D. Manipulation Difficulty:** How complex is it to game this specific rule? (Some rules are easier/harder to manipulate in practice, even if GS says all *can* be).
  *   **Overall Risk Judgment:**
      *   **Low Risk (Semi-Peaked, Low Stakes, No Factions, Low Info):** Don't over-rotate. Use a simple rule (Step 3). GS possibility exists, but likely irrelevant.
      *   **Medium Risk (Multi-Dim, Med Stakes, Mild Factions):** Consider rules harder to manipulate or escaping GS (Step 4).
      *   **High Risk (Multi-Dim, High Stakes, Clear Factions):** Actively manage GS threat via rule choice or restructuring (Step 4/5).

  **Step 3: Choose a Rule (If Risk is Low or Semi-Peaked Likely)**
  *   **Goal:** Balance simplicity, legitimacy, speed. Accept GS *possibility* as low-probability.
  *   **Options:**
      *   **Ranked Choice Voting (Instant Runoff):** Good for getting majority support. Legitimacy from eliminating losers. *Manipulable (GS applies), but often robust in semi-peaked cases.*
      *   **Borda Count:** Good for consensus-building, finding broadly acceptable options. Sensitive to irrelevant alternatives. *Manipulable (GS applies).*
      *   **Plurality (First-Past-the-Post):** Only if *really* simple/low-stakes. Suffers badly from vote-splitting. *Manipulable (GS applies).*
      *   **Condorcet Method (if feasible):** Finds pairwise beats-all winner if one exists. Great legitimacy if found. Complex tallying. *Manipulable (GS applies), but Condorcet winner resistant to manipulation in some cases.*

  **Step 4: GS Escape Hatches & Mitigations (Medium/High Risk)**
  *   **A. Approval Voting:** Voters choose *all* options they find acceptable (no ranking!). **Genuine Escape:** Not subject to GS theorem (output not single ranking-based). Pro: Simple, resists vote-splitting, hard to manipulate *effectively*. Con: Doesn't capture intensity of preference; "burial" possible but often ineffective. *Strong contender when GS risk high.*
  *   **B. Sequential Elimination (Agenda):** Vote on options pairwise in a set order. **Not an Escape:** GS applies *to the overall rule defined by the agenda*. Highly manipulable by agenda-setter or voters anticipating rounds. Avoid unless agenda is neutral (random) or deliberation creates consensus.
  *   **C. Randomization:** Pick winner randomly (e.g., lottery among top N, or proportional to votes). **Genuine Escape:** GS requires determinism. Pro: Perfectly strategy-proof. Con: Horrible legitimacy for high-stakes decisions ("We hired by dice roll?").
  *   **D. Deliberation:** **Not an Escape but Crucial Mitigation.** Structured discussion *before* voting can: (1) Reveal shared dimension (improve single-peakedness); (2) Eliminate clearly dominated options; (3) Build consensus; (4) Reduce incentive/ability to manipulate by clarifying stakes. *Always recommended when feasible!*
  *   **E. Reduce Options to 2:** **Genuine Escape:** GS requires 3+ options. Majority vote between two options is strategy-proof. *Last resort.*

  **Step 5: Restructure the Choice (High Risk, Complex Choices)**
  *   **A. Narrow the Field First:** Use a fast, simple method (e.g., approval, Borda) to reduce 5+ options down to 2-3 finalists. *Then* use a more robust rule (e.g., majority vote for 2, RCV/Borda for 3) on the shortlist. Reduces GS scope.
  *   **B. Divide the Pie:** Can the decision be split? (e.g., Invite *two* colloquium speakers this year; fund *two* smaller curriculum pilots). Reduces zero-sum pressure.

  **Step 6: Legitimacy & Aftermath (The GS-Blind Spots)**
  *   **GS Says Nothing About:**
      *   **Legitimacy:** Does the *process* feel fair? (Transparency, deliberation, perceived fairness of rule matter more than GS impossibility).
      *   **Efficiency:** How costly is the voting/tallying? (Approval often wins here).
      *   **Sincere Voting Burden:** How *hard* is it to vote sincerely? (Approval/Plurality easy, ranking harder).
      *   **Loser Acceptance:** Will the losers feel heard/understood? (Deliberation key!).
      *   **"Best" Manipulable Rule:** GS doesn't tell you *which* manipulable rule is *least bad* in practice.
  *   **Therefore:** Choose a rule that balances GS risk mitigation with these crucial practical concerns. *A rule being manipulable doesn't automatically make it bad if the risk is low and it serves other goods.*

  ---

  **Worked Applications**

  1.  **Hiring: Ranking 4 Candidates for One Job**
      *   **Step 1:** High stakes! Dimensionality? Starts as "Research Quality" (semi-peaked?), but Teaching/Collegiality lurk. **Likely Multi-Dim.** Semi-Peaked? Maybe not – factions often form around candidates. **GS Applies, Risk: Medium/High.**
      *   **Step 2:** High Incentive, Factions likely, Info often high (committee discussions). **Risk: High.**
      *   **Step 4:** Escape Hatches? Avoid Sequential (too manipulable). Randomization? Unthinkable. Approval? **Strong Candidate.** Simple after deliberation? Reduces risk of vote-splitting between similar candidates. Deliberation *essential* to clarify criteria. **Recommendation: Serious deliberation followed by Approval Vote.** If *strong* preference for ranking, use Borda *after* deliberation (accepting medium GS risk).

  2.  **Curriculum: Five Proposals, Known Factions**
      *   **Step 1:** High stakes for factions! Dimensions: Pedagogy, Workload, Ideology? **Definitely Multi-Dim.** Factions present? **Yes.** **GS Applies, Risk: High.**
      *   **Step 2:** High Incentive (faction pride!), Clear Factions, Info high. **Risk: High.**
      *   **Step 4:** Escape Hatches? Avoid Sequential (factions will game agenda). Randomization? Unlikely acceptable. Approval? **Strong Candidate.** Lets voters support multiple acceptable proposals, mitigating factional zero-sum. Deliberation crucial to find common ground. **Recommendation: Deliberation focused on shared goals, then Approval Vote.** If factions demand ranking, use RCV *expecting possible manipulation* (GS reality acknowledged).

  3.  **The Unpopular Answer: Grad Admissions Waitlist (Rank 8 candidates for 1 spot)**
      *   **Step 1:** Extremely high stakes! Dimensions: Fit, Potential, Diversity, Letters? **Deeply Multi-Dim.** Factions? Likely among faculty advocates. **GS Applies, Risk: Very High.**
      *   **Step 4:** Approval? Messy with 8 options – hard to define "approve". RCV/Borda? Highly manipulable with factions. Sequential? Manipulation nightmare.
      *   **Step 5:** **Restructure!** **Recommendation (You won't like): Narrow the Field First.** Use a quick Approval vote ("Approve all you'd be happy admitting") to identify top 3-4 candidates supported broadly. *Then* have the committee rank *only that shortlist* using Borda or RCV. GS risk remains on the shortlist vote, but significantly reduced scope and factional pressure. **OR:** Bite the bullet and use Approval on all 8. The "unpopular" part is forcing a reduction or using Approval – but GS risk demands it.

  ---

  **Final Reminder (Tape This Part Up):**
  "**GS Theorem:** With 3+ ranked choices, *some* insincere vote *can* help *someone* *sometimes*. **It doesn't mean:** The sky is falling. Everyone lies. Sincere voting is dead. All rules are equally bad. **Your Job:** Judge the *risk* (dimensions? factions? stakes?) vs. the *cost* (complexity, legitimacy) of different approaches. **Use Deliberation!** **Approval Voting often helps.** **Narrowing options helps.** **Pick the least worst practical tool for *this* vote and move on.**"

  This checklist accepts the GS reality without paralysis, focuses on practical risk assessment, leverages mitigations (especially deliberation and approval), and forces you to confront trade-offs explicitly. Good luck with the votes!
