answer: |-
  ## Classroom Activity: The Ledger and the Map

  **1. Conceptual Frame (150 words)**
  Imagine guilt as a private ledger: when you wrong someone, it creates a specific, quantifiable debt *to that person*. Repaying this debt – apologizing, making amends – can, in theory, clear the ledger, restoring balance between you two. Shame, however, acts like a public map. A wrong doesn't just create a debt; it visibly alters your position in the shared social landscape. Others see the mark, and their perception *is* the mark. No private repayment to an individual can fully erase it because the mark exists in the collective gaze. A culture trying to strictly choose guilt over shame faces a paradox: it needs people to acknowledge specific wrongs to specific others (to settle the private ledger), but simultaneously *hide* the fact that a wrong occurred from everyone else. Why? Because visibility *is* the mechanism of shame – if others see you've wronged someone, the public map instantly redraws your standing. Maintaining this invisibility while demanding acknowledgment is the unstable ground.

  **2. Setup and Materials (150 words)**
  *   **Layout:** Tables arranged in a square or circle so all participants (16) can see each other. Facilitator at front.
  *   **Roles:** Participants are "Citizens." Facilitator is "Registrar" (manages resources, tracks time).
  *   **Materials:**
      *   One set of 16 distinct, colored identity cards (e.g., Blue 1, Blue 2, Red 1, Red 2...).
      *   One "Social Standing Board" (whiteboard/flipchart) listing all identity card colors/numbers with 3 columns: "Starting Standing," "Current Standing," "Visible Tokens?".
      *   Two opaque bags: One holding "Action Cards" (50% "Harm", 50% "Help"), one holding "Target Cards" (each participant's ID listed multiple times).
      *   Small tokens (e.g., poker chips, buttons) – lots of one color ("Social Tokens"), fewer of another ("Amends Tokens").
      *   "Ledger Sheets" (small notepads) for each participant.
  *   **Payoff:** Starting Standing (3 Social Tokens). Highest Standing after 4 rounds wins symbolic "Community Trust" certificate. Losing tokens has no real cost, but accumulation/visibility creates social pressure and minor competitive stakes.

  **3. Rules and Flow (250 words)**
  *(Total: 45 min - Setup: 5 min, Rounds: 25 min (4x6 min + 1 min transfer), Debrief: 15 min)*

  1.  **Setup (5 min):** Distribute identity cards. Each records their color/number on Ledger Sheet. Registrar gives 3 Social Tokens to each, records "Starting Standing = 3" for all on Board. "Visible Tokens?" column starts blank.
  2.  **Round Structure (4 Rounds, ~6 min each):**
      *   **Action:** Each Citizen draws one Action Card (Harm/Help) and one Target Card (another Citizen's ID) from bags.
      *   **Resolution (Private):**
          *   *Harm:* The harmer *must* record the harm on their Ledger Sheet ("Harmed [Target ID]"). They incur a debt of 1 Amends Token *to that specific Target*. They place 1 Social Token in a *central, concealed pot* (not visible to others).
          *   *Help:* No debt. Helper gains 1 Social Token from Registrar.
      *   **Amends (Optional/Private):** A Citizen *with a recorded Harm debt* can choose to pay it *this round only*: They take 1 Amends Token from Registrar (if available - limited supply!), go *quietly* to their specific Target, hand them the Amends Token, and both *privately* cross off that debt on their Ledger Sheets. *Crucially:* This interaction must be discreet. If *any other participant notices and names the interaction*, it becomes public.
      *   **Visibility Trigger:** At the *end* of each resolution phase, Registrar asks: "Did anyone *observe* an Amends interaction? Name the parties." If observed/named, the Registrar publicly notes "Observed" next to both participants' IDs on the Board under "Visible Tokens?".
  3.  **Standing Update (1 min after each round):** Citizens count their *visible* Social Tokens (held openly). Registrar updates "Current Standing" on the Board for all. *Important:* Tokens paid as harm penalties (in the concealed pot) or used secretly as Amends *are not visible* and do not count towards Standing. Only tokens held in hand count. Standing = Visible Tokens.
  4.  **Final Standing & Win (After Round 4):** Registrar announces Citizen with highest Standing (visible tokens) as winner.

  **4. Debrief and Mapping (200 words)**
  1.  **The Ledger:** Ask: "Who recorded harms? Who received Amends? Did paying Amends *feel* like settling a specific debt?" Highlight Ledger Sheets – the private record of specific debts to specific people. *Mapping:* This is **guilt** – the quantifiable debt owed to an individual, settled privately.
  2.  **The Map:** Point to the Standing Board. "What determined your Standing? How did seeing others' Standing change how you viewed them?" Emphasize Standing was *only* based on *visible* tokens. *Mapping:* This is the **public map (shame)** – your position defined by what the group *sees* and collectively acknowledges.
  3.  **The Visibility Paradox:** Focus on the "Amends" step and observation trigger.
      *   *Scenario A (Amends Paid & Observed):* "If you paid Amends secretly but were seen, what happened? Did paying the debt *clear* how others saw you? Or did being *seen* paying it change your Standing/their view?" *Mapping:* Visibility activates the **map (shame)** – the act of repair itself becomes a public marker ("they needed to make amends"), overriding the private ledger clearance. The mark lives in others' eyes.
      *   *Scenario B (Harm Concealed):* "If you harmed someone but *avoided* making Amends publicly (either didn't pay or paid unseen), did your Ledger feel settled? Could the *target* truly feel the debt was acknowledged/settled without some sign?" *Mapping:* Avoiding visibility breaks the **ledger's (guilt's) meaning** – the debt exists but lacks social acknowledgment. The target might feel unresolved, the harmer might feel unburdened *only* by secrecy.
  4.  **The Impossible Choice:** "Could the 'culture' (these rules) successfully maintain *only* the private ledger? Why not? What forces kept pulling actions onto the public map?" *Mapping:* The attempt to choose guilt (private ledger) collapses because **settling the debt requires action, action risks visibility, and visibility instantly redraws the map (shame)**. Pure guilt requires social invisibility, which destroys the context that makes acknowledgment meaningful.

  **5. Predictable Failures and Limits (150 words)**
  *   **Predictable Failures:**
      *   **Overly Secretive Play:** Participants might avoid Amends entirely to prevent observation, breaking the ledger system. *Recovery:* Highlight this in debrief as proof of the system's instability – guilt *requires* acknowledgment, which secrecy prevents.
      *   **Ignoring Observation:** Participants may be reluctant to call out observed Amends. *Recovery:* Gently enforce the rule; emphasize that in real life, noticing moral repair *is* socially significant. Ask "What social pressures stopped you from reporting? Fear of being a snitch? That's part of the map too!"
      *   **Focus on Winning:** Players might prioritize token accumulation over the moral dynamic. *Recovery:* Structure debrief to focus on *feelings* (e.g., "How did it feel to be observed making amends?") rather than just scores.
  *   **Key Limit:** The simulation cannot replicate the **visceral, involuntary nature of shame and guilt**. Participants make calculated choices; real shame is a hot, bodily experience of exposure, while guilt is a nagging internal pressure. The activity demonstrates the *structural* paradox cognitively, but the *emotional* weight and automaticity must be discussed explicitly by the facilitator, linking the game's mechanics to participants' own intuited experiences of being marked or indebted.
