prompt: |-
  I was talking with a friend who's into agent-based econ modelling and we got into wether Popper's poverty of historicism still holds up if you can run a thousand synethetic histories in silico. Like, Popper said you can't have laws of history because history is one unique run and you can't do experiments, right? But agent-based models are deterministc yet path-dependent -- every run is different. So please explain the actual conceptual issue behind Popper's claim that there are no laws of history. Don't just recap the standard line about uniqueness; dig into wether the problem is ontological (history really is singular), epistemic (we can't test generalizations), or about what counts as a law in the first place. And specifically address wether being able to generate deterministic but non-repeating synthetic histories changes anything, or if Popper would still say those aren't 'history' proper and therefore miss the point. I'm trying to figure out if my intuition that simulations break his argument is wrong, and where exactly the 'poverty' lives -- in the world, in our methods, or in the concept of law itself.
