  Set out the most important implications of this conjunction—epiphenomenalism together with the paradox of phenomenal judgment—for three specific domains: first, the reliability of introspective access to qualitative experience; second, the methodology of consciousness science, particularly the tension between paradigms that depend on subjective report and those that seek markers of awareness independent of report; and third, clinical and ethical practice regarding patients who may be aware yet unable to communicate, such as in locked-in syndrome or intraoperative awareness. In addressing these, do not treat the paradox as a simple reductio ad absurdum; instead, take it as a live constraint that reshapes what we can legitimately claim about first-person authority.

