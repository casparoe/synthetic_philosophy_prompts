answer: |-
  Based on your verdicts, I identify a coherent principle that explains all six cases: **a credibility-constrained expected impact maximization framework**, where funding decisions require (1) a minimum threshold of epistemic robustness for importance and tractability estimates, and (2) maximization of expected marginal impact per dollar (incorporating neglectedness as a multiplier for marginal impact) for causes above this threshold. This principle extends ITN by explicitly addressing the reliability of evidence, which resolves your inconsistencies without abandoning the core framework.

  ### The Principle Stated Precisely
  1. **Epistemic Robustness Threshold**: A cause is fundable only if its importance and tractability estimates meet a minimum standard of credibility. Credibility requires:
     - **Independent validation**: Estimates must be based on evidence that has been scrutinized, replicated, or endorsed by multiple independent sources (e.g., peer review, expert consensus, or rigorous auditing).
     - **Transparency and replicability**: Key assumptions, models, and data must be accessible and testable by third parties.
     - Causes failing this threshold are rejected regardless of their ITN scores, as their expected impact is deemed too unreliable to act upon.

  2. **Adjusted Expected Impact Maximization**: For causes above the threshold, calculate expected marginal impact per dollar as:  
     **Expected Impact = Importance (I) × Tractability (T) × Neglectedness Multiplier (N)**  
     Where:
     - **I** = Scale of the problem (e.g., lives affected, welfare gain/loss averted).
     - **T** = Probability of success per dollar (marginal chance of achieving measurable progress).
     - **N** = Marginal impact multiplier (a function of current funding; e.g., 1 / current funding level). Neglectedness is treated instrumentally—it modulates marginal impact but does not directly affect ethical weight.
     - Adjust funding levels as new information updates I, T, or N (e.g., reduced funding when N declines).

  This principle delivers your verdicts by filtering out causes with unreliable estimates before applying ITN. Crucially, it defines "neglectedness" not as a standalone ethical factor, but as evidence for higher marginal returns (handling Case 5 naturally). Below, I map each case to the principle, show how your verdicts are accommodated, and identify one verdict that may need refinement.

  ### How Each Case Maps to the Principle
  - **Case 1: Malaria prevention**  
    - *Verdict*: Fund without hesitation.  
    - *Mapping*: Passes epistemic threshold (I and T based on decades of validated evidence). High I × T × N ensures funding.  
    - *Clause motivated*: Epistemic threshold and impact maximization. High credibility justifies acting on high ITN scores.

  - **Case 2: AI catastrophic risk research**  
    - *Verdict*: Fund confidently.  
    - *Mapping*: Passes epistemic threshold (despite low T, importance estimates are debated but have independent expert consensus; tractability has plausible pathways, e.g., via technical research). Astronomical I offsets low T, and high N multiplies impact.  
    - *Clause motivated*: Epistemic threshold (validates speculative work when credible) and impact maximization (I dominates despite low T).

  - **Case 3: Wild animal suffering interventions**  
    - *Verdict*: Do not fund.  
    - *Mapping*: Fails epistemic threshold (I relies on highly uncertain population ethics/models; T is near-zero with no proven interventions and limited peer-reviewed research). Thus, excluded from ITN calculation regardless of scores.  
    - *Clause motivated*: Epistemic threshold (prevents funding where estimates lack robustness, even for extreme ITN scores). Solves the AI comparison: AI has higher credibility.

  - **Case 4: Local animal shelter**  
    - *Verdict*: Do not fund.  
    - *Mapping*: Passes epistemic threshold (I and T are credible but low), but low I × T × N yields minimal impact.  
    - *Clause motivated*: Impact maximization (ITN scores are reliable but too low to prioritize).

  - **Case 5: Global health charity (reduced funding)**  
    - *Verdict*: Fund at reduced level based on declined neglectedness.  
    - *Mapping*: Passes epistemic threshold (I and T remain stable and credible). Funding reduction tracks N’s decline, lowering marginal impact per dollar.  
    - *Clause motivated*: Impact maximization (N is instrumental to marginal impact; no change to I or T needed).

  - **Case 6: Speculative pandemic preparedness**  
    - *Verdict*: Refuse to fund.  
    - *Mapping*: Fails epistemic threshold (I and T rest on one unchecked model; no independent validation). Excellent ITN scores are irrelevant due to low credibility.  
    - *Clause motivated*: Epistemic threshold (rejects cases where estimates lack scrutiny, even with high paper ROI).

  ### Which Verdict Must Change?
  The principle accommodates all six verdicts as stated. However, **Case 2 (AI risk) requires nuance**: If your epistemic standards for AI risk are inconsistent with the threshold (e.g., if its importance/tractability estimates are equally unaudited as the pandemic case), it might not pass. I assume you judge AI risk as having sufficient independent support (e.g., peer-reviewed papers, institutional endorsements) to clear the threshold, unlike Cases 3 and 6. If not, you must either:
  - Reject AI risk funding (which contradicts your confident verdict), or
  - Refine the threshold to allow "emerging but promising" causes with partial validation (I discuss this below).

  ### Predictions for Your Undecided Cases
  **Case A: High tractability, but only because the measurable part is small**  
  (e.g., a disease treatment that only addresses a rare subtype).  
  - *Prediction*: Fund only if it passes the epistemic threshold. If it does, I and T are adjusted:  
    - **I** reflects the *solvable* portion (small), not the full problem.  
    - **T** is high for this portion.  
    - Result: Low I × T × N likely leads to no funding unless N is extreme.  
  - *Why?* The principle treats "importance" as the impact achievable by the intervention, not the problem's total scale. This avoids overestimating impact from partial solutions.

  **Case B: Importance ranking flips based on moral views**  
  (e.g., human-centric vs. species-neutral ethics changing the priority of animal welfare vs. global health).  
  - *Prediction*: The principle defers to meta-ethics. You must:  
    1. Fix a moral view for consistency (e.g., "use species-neutral weights unless specified otherwise").  
    2. Calculate I under that view.  
    3. Proceed with the framework.  
  - *Why?* Importance is inherently normative. The principle handles uncertainty in *empirical* estimates (via the threshold) but not moral disagreements. Flip-flopping based on ethics isn't inconsistency—it reflects value pluralism, which the framework can absorb by transparently setting I.

  ### Why This Works and Rejected Alternatives
  - **Solves your ITN inconsistencies**: 
    - The epistemic threshold rejects unreliable cases (e.g., wild animal suffering and pandemic) without discarding all speculative work (e.g., AI risk). This avoids the pitfalls of pure expected-value maximization (which forces funding them) and flat credibility discounts (which lack nuance).
    - Neglectedness remains instrumental (handling Case 5) but is embedded in impact maximization, preserving ITN’s structure.
  - **Better than alternatives you considered**:
