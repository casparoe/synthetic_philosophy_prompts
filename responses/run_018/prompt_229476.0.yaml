prompt: |-
  I'm a science journalist working on a longish explainer about whether meaning can be given a purely natural explanation — the idea that a brain state or an animal's signal means what it does because of its evolutionary function (teleosemantics) or causal role, not because somebody interprets it. I've read around enough to know the standard moves (frog snapping, indicator bacteria, the disjunction problem, swampman, twin earth), and the field seems to bounce from one toy case to another without ever saying what the full job description for a theory actually is.

  Before I try to explain any particular theory to readers, I want the spec. What does a theory of content actually have to get right to count as naturalized? Give me the requirements list — the cases it has to handle (especially error: where the organisms detector fires for the wrong thing without that wrong thing becoming part of the content), the distinctions it can't collapse (reliable causation vs. representation, having content vs. having correctness conditions, natural fact vs. semantic norm), and the empirical or conceptual results it can't quietly contradict — with the case or argument behind each requirement.

  Then do the part I actually need as a journalist. Mark which requirements are non-negotiable and which are just one camp's preferences (say, that content must build up compositionally from atomic parts, or that it must be narrow/in the head). Tell me which single requirement does the most to exclude the most popular theories, and flag any pair of requirements you suspect can't be jointly satisfied — if two of them can't both be met, that's my lede.

  No reading list or citations, I need the reasoning itself. Keep it tight: hard cap of 900 words, and a table for the requirements is fine.
reasoning: |-
  Okay, the user is a science journalist working on an explainer about naturalizing meaning. They want a clear "job description" for a theory of content—what it must achieve to count as naturalized. They mention being familiar with standard examples like frog snapping and swampman but feel the field lacks a comprehensive spec. 

  First, I need to outline the core requirements. The key is distinguishing natural facts from semantic norms—meaning can't rely on interpretation. Error cases are crucial: the theory must explain how a frog's snap can be *wrong* when it targets a BB pellet instead of a fly. This requires correctness conditions rooted in natural facts. 

  The user also wants to know which requirements are non-negotiable versus contested. Non-negotiables include naturalistic grounding (no supernatural stuff), error (misrepresentation), and causal asymmetry (why the frog's snap is *about* flies, not just correlated with flies). Contested points might include compositionality (whether meaning builds from atomic parts) or narrow content (meaning purely "in the head"). 

  The biggest challenge? Probably combining robust error conditions with causal constraints. Teleosemantics ties meaning to evolutionary functions, but then swampman—a spontaneously formed human duplicate—lacks meaning because he has no evolutionary history. That's a tension. Also, indicator semantics struggles with error: if a detector fires for flies and BBs, what stops "BBs" from becoming part of the content? 

  For the lede, I'd highlight the conflict between error and causal robustness. If a theory can't explain misrepresentation without collapsing into disjunction (adding "or BB" to the content), it fails—and many do. That tension might be the hook. 

  The user needs clarity, not citations. I'll structure this as a table with requirements, must-haves, and conflicts, then flag the toughest hurdles. Word count is tight, so examples must be punchy—frog, bacteria, twin earth. No fluff. 

  ... And I’ll bet they’re quietly hoping this spec reveals why the debate feels stuck. If two must-haves can’t coexist, that’s the story.
answer: |-
  Here's a concise "job description" for a naturalized theory of content, focusing on requirements, their necessity, and key tensions. Requirements are categorized as **Core** (non-negotiable for *any* naturalizing theory), **Aspirational** (widely desired but debated *how* essential/achievable), and **Contested** (camp-specific preferences).

  ### Core Requirements (Non-Negotiables)
  These define the *minimal* goal: grounding meaning in non-semantic, non-intentional, non-normative natural facts.

  | Requirement | What It Must Handle | Why It's Core | Case/Argument Behind It |
  | :---------- | :------------------ | :------------ | :---------------------- |
  | **1. Naturalistic Grounding** | Explain content solely via physical, biological, causal, historical facts. No unexplained semantic primitives. | Without this, it's not naturalization; it assumes what it explains. | Core project definition. |
  | **2. Robust Error/Misrepresentation** | Explain how a state/signal can be *wrong* (e.g., frog snaps at BB, not fly). Must avoid the "disjunction problem" (BB becoming part of the content "fly or BB"). | Content without correctness conditions isn't genuine representation. Error is the hallmark of intentionality. | Frog snapping at BB pellets; Sensory illusions; False beliefs. |
  | **3. Causal/Informational Asymmetry** | Explain why content picks out one cause/object (e.g., fly) over reliably correlated ones (e.g., retinal shadow pattern, air vibrations, proximal stimulus). | Prevents collapse into trivial correlation. Content is "about" distal objects, not proximal causes. | Frog's state is *about flies*, not fly-shaped shadows. Twin Earth (XYZ vs H₂O). |
  | **4. Distinction: Representation vs Reliable Cause/Correlate** | State having content ≠ merely being reliably caused/correlated. | Prevents everything from "meaning" its cause. Crucial for distinguishing representation from mere indication. | Indicator semantics struggles here. Thermometer vs Belief. |
  | **5. Distinction: Natural Fact vs Semantic Norm** | Ground correctness *in* natural facts without smuggling in unexplained norms. | Avoids circularity. Norms (truth/falsity) must emerge from non-normative base. | Core challenge of naturalizing semantics. |

  ### Aspirational Requirements (Often Expected, But Debated)
  | Requirement | What It Must Handle | Why Aspirational | Case/Argument Behind It |
  | :---------- | :------------------ | :--------------- | :---------------------- |
  | **6. Compositionality** | Explain how complex meanings (thoughts, sentences) derive systematically from parts. | Needed to handle human-level thought/language without infinite primitives. | Thought: "The brown cow" vs "The cow is brown". |
  | **7. Productivity/Generativity** | Explain capacity for novel meaningful states. | Without this, content is inflexible and unlike cognition/language. | Understanding novel sentences; Forming new beliefs. |
  | **8. Fine-Grainedness** | Distinguish co-referential but different meanings (e.g., "Hesperus" vs "Phosphorus"). | Captures cognitive significance. | Morning Star/Evening Star; Superman/Clark Kent beliefs. |
  | **9. Causal Efficacy** | Explain how content plays a role in behavior causation. | Avoids epiphenomenalism. Content should matter for what the system *does*. | Beliefs/desires explaining action. |

  ### Contested Requirements (Camp-Specific Preferences)
  | Requirement | What It Demands | Why Contested | Case/Argument Behind It |
  | :---------- | :-------------- | :------------ | :---------------------- |
  | **10. Narrow Content** | Content fixed solely by internal state (ignoring external environment). | Internalists (e.g., Fodor) vs Externalists (e.g., Burge, Millikan). | Twin Earth: Internal duplicate has different water-content (externalist view). |
  | **11. Strong Determinacy** | Content must be perfectly sharp and unambiguous. | Some (e.g., Fodor) see this as essential; others (e.g., Dretske, Millikan) see content as inherently somewhat fuzzy/context-dependent. | Frog: "Fly"? "Small moving thing"? "Food"? |

  ### Key Exclusions & Tensions
  1.  **The Biggest Excluder:** **Robust Error (Requirement 2)** combined with **Causal/Informational Asymmetry (3)**. This duo eliminates simple causal/covariation theories (Indicator Semantics) because they succumb to the disjunction problem (BB becomes part of the content). They also challenge purely current causal role theories (Functionalism) to explain why the frog's state *should* mean 'fly' and not 'whatever causes this state now'.
  2.  **The Sharpest Tension (Potential Lede):** **Robust Error (2)** vs. **Naturalistic Grounding (1) + Fine-Grainedness (8) for Complex Thoughts**.
      *   **Why?** Requirement 2 demands robust error conditions. Teleosemantics (Millikan, Papineau) grounds these in *evolutionary function/history*. This works well for simple detectors (frog snap *should* catch flies because that's what it was selected for).
      *   **The Conflict:** How does this scale to complex, novel human thoughts ("unicorns exist", "quantum gravity")? Their "proper function" is elusive. History-based accounts struggle with Swampman (a spontaneously formed human duplicate) – does he lack all content? Functional/causal role accounts can handle novelty/complexity better but struggle mightily with grounding robust error/norms solely in current causal dispositions without history or external norms.
      *   **Result:** Theories strong on error for simple cases (Teleosemantics) often falter on compositionality/productivity/fine-grainedness. Theories better for complex thought (Causal Role, some Indicator hybrids) struggle mightily with robust, non-disjunctive error and causal asymmetry. **This gap – grounding the normativity of error for sophisticated thought in purely natural mechanisms – is arguably the central unsolved problem.** If your lede highlights the clash between explaining frog errors and explaining the meaning of "Swampman wonders if teleosemantics applies to him," you've nailed the core tension.
  3.  **Other Notable Tension:** **Narrow Content (10)** vs. **Causal/Informational Asymmetry (3) + Fine-Grainedness (8)**. Twin Earth cases suggest external factors *must* matter for content (ruling out pure narrow content) to capture what the state is *about* (H₂O vs XYZ). Pure narrow content struggles with asymmetry and fine-grained external reference.

  ### In Summary for Your Explainer
  *   **The Bare Minimum (Core):** Naturalize meaning, explain error without disjunction, explain why content picks out specific things (asymmetry), distinguish representation from mere cause/correlation, ground norms naturally.
  *   **The Major Hurdle:** Explaining robust error (especially for complex/novel thoughts) without appealing to unexplained norms or collapsing into disjunction. This is where most theories stumble.
  *   **The Core Tension:** Bridging the gap between simple, evolutionarily shaped "detector" content (where error is grounded in history/function) and complex, productive human thought (where history seems less directly applicable and functional roles struggle with norms). **This tension – how natural norms emerge for thoughts with no evolutionary history – is likely your most compelling narrative hook.**
  *   **The Debate Lines:** Internal vs External (Narrow Content), Determinacy vs Vagueness, History vs Current Role.
