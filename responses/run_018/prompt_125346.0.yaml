answer: |-
  ### Thought Experiment: The Brackenfield Time-Bank

  In Brackenfield, a market town in Somerset, employees at the community centre participate in a council-sanctioned time-banking scheme. They earn "Brackenfield Hour-Credits" (BHCs) for voluntary work: one hour worked = one BHC. The district council formally recognises BHCs as legal tender for settling municipal service charges (e.g., allotment fees, parking permits), deducting £10 per BHC from bills. Participants also trade BHCs internally: Mary pays Tom 2 BHCs to repair her bicycle, Tom pays Aisha 1 BHC for homegrown vegetables, and Aisha pays Mary 0.5 BHCs for tutoring. The credits circulate widely, are universally accepted within the group for goods/services, and participants treat them as binding debts. **Actual Situation:** Both theories agree BHCs constitute money. **Counterfactual Variation:** Following budget cuts, the council abruptly withdraws formal recognition, annulling BHCs' status for municipal payments. Crucially, however, *all internal practices continue unchanged*: participants still earn, trade, and accept BHCs identically for goods/services, honouring obligations as before. The council’s withdrawal is widely known, but the community consciously decides to sustain the system based on mutual trust and established norms.

  ---

  ### Analysis of Divergence

  1.  **Institutional-Constructivist Account:**
      *   **Verdict in Counterfactual:** BHCs cease to be money.
      *   **Core Commitment:** Money is constituted by collective acceptance imposing a *status function* (e.g., "X counts as Y in context C") through authoritative assignment. This function depends on recognition by relevant institutions or authorities that anchor the system's normative structure.
      *   **Why Divergence Occurs:** The council's authoritative backing was the cornerstone of the status function ("This token counts as £10 deductible against council charges"). Its withdrawal dissolves the formal, constitutive rule that anchored BHCs' status as valid payment within a recognised institutional framework. While informal acceptance persists, it lacks the *authoritative* component essential for institutional money. The credits become mere IOUs or tokens within a private barter network, lacking the deontic power (rights, obligations, enforceability) conferred by institutional recognition. The absence of the municipal anchor means the collective intentionality is now insufficiently structured and lacks the necessary institutional context to sustain genuine monetary status.
      *   **Key Feature:** The *withdrawal of authoritative recognition* by the municipal authority dissolves the constitutive status function.

  2.  **Functional-Role Account:**
      *   **Verdict in Counterfactual:** BHCs remain money.
      *   **Core Commitment:** Money is defined by performing key causal-economic functions: acting as a widely accepted *medium of exchange*, a *unit of account*, and a *store of value*. Its ontology is grounded in its functional role within an economic system, not its institutional pedigree.
      *   **Why Divergence Occurs:** The counterfactual scenario explicitly preserves all functional characteristics: BHCs continue to mediate exchange seamlessly among participants (medium), prices are still quoted and debts recorded in them (unit), and they hold value over time as deferred payment for future goods/services (store). The causal-economic role is identical; participants' behaviour and the economic dynamics are unchanged. The loss of municipal deductibility is merely the removal of *one specific use*, not the core functional profile defining money-hood. What matters is the network of exchanges and valuations, which persists intact.
      *   **Key Feature:** The *continuity of the causal-exchange profile* (medium, unit, store functions) remains fully intact despite institutional change.

  ---

  ### Critical Test: Removing the Key Feature

  *   **Removing the Functional Continuity:** Suppose after the council's withdrawal, BHC usage rapidly collapses. Participants lose trust, refuse to accept them, and the exchange network dissolves. Now, *both* theories agree BHCs are no longer money. The Institutional view never recognised them post-withdrawal; the Functional view now sees the core causal role has vanished.
  *   **Removing the Authoritative Withdrawal:** Suppose the council *never* formally recognised BHCs in the first place, but the identical internal exchange network emerged organically. The Functional view would still deem them money (same role). The Institutional view likely *would not* classify them as money initially, as they lack authoritative status assignment from the outset. The initial agreement in the actual scenario disappears; the divergence simply occurs earlier. The Institutional theory requires the authoritative status function to be present *for something to become money initially*, not just for its persistence.

  The disagreement collapses into agreement only when the functional role breaks down. If the functional role persists but institutional backing is removed, the core divergence remains exposed.

  ---

  ### Defence Against Objections (Institutional View)

  A defender of the institutional view might argue thus:
  >"The counterfactual fails. Informal collective acceptance *does* survive the council's withdrawal, and this *is* sufficient to sustain the status function 'BHC counts as money in Brackenfield'. The council was merely one user, not the sole constitutive authority. The community's ongoing mutual recognition *is* the collective intentionality imposing and sustaining the status function."

  **Rebuttal:** This objection conflates *informal mutual recognition* with the *institutional status function* required by the theory. Searle-style institutional facts depend on constitutive rules recognised within an institutional framework. While the community's practice shows collective acceptance of tokens as valuable *within their private network*, it lacks the *deontic power* characterising institutional money – it isn't backed by any system of formal rights, obligations, or enforcement mechanisms characteristic of an institution. The credits function as *private scrip* or tallies, not as money proper under the institutionalist definition, which requires embedding within a broader social-institutional reality conferring a specific, agent-independent status. The council's role wasn't just as a user but as the *authority* whose recognition provided the institutional anchor and constitutive rule. Its removal degrades the status function to a lower level of social fact (collective agreement on use-value), not a full institutional fact.

  ---

  ### Committed Position: Functionalism Handles the Case More Plausibly

  The functional-role account provides the more compelling ontological description of money in this scenario. Its core strength lies in grounding money-hood directly in observable, causally efficacious economic behaviour – what the tokens *do* within the exchange network. The Brackenfield case highlights a crucial truth: money's fundamental "work" is facilitating exchange and storing value, roles demonstrably fulfilled by the BHCs both before and after the council's withdrawal. The persistence of identical usage patterns strongly suggests the underlying monetary *kind* remains unchanged, irrespective of institutional pedigree.

  The institutional view, by contrast, renders the ontology unduly fragile and disconnected from actual economic practice. Declaring the BHCs to have ceased being money solely because one specific, external validation point vanished – despite their internal economic role and the community's sustained collective acceptance remaining completely unaltered – seems arbitrary and ontologically profligate. It prioritises a formal, external *source* of authority over the internal, functional *reality* of how the tokens operate within the social group that created and sustains them. While institutional backing often *enables* or *stabilises* monetary systems, the Brackenfield counterfactual demonstrates it is not strictly *constitutive* of the money kind itself. Money's essence lies in its systemic function within a web of exchanges and deferred obligations, a function demonstrably intact in Brackenfield post-withdrawal. The functional account captures the resilient, practice-based nature of money, making it the superior framework for understanding this and similar social artefacts.
