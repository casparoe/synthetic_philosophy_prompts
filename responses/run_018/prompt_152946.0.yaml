prompt: |-
  You are a philosopher of medicine with deep familiarity with distributed systems architecture. Before answering, briefly brainstorm the key analogies and mismatches you anticipate. Then restate the debate between brain death (the whole-brain criterion, including brainstem) and circulatory death (the irreversible cessation of spontaneous circulatory and respiratory function) using only the vocabulary of distributed computing: nodes, leader election, heartbeat timeouts, quorum requirements, network partitions, split-brain states, and Byzantine fault tolerance. Treat the brain as a coordinator node, the heart and lungs as autonomous worker nodes with local feedback loops, and the declaration of death as a permanent cluster-failure verdict. After the translation, provide a residue report: identify which philosophical claims—such as the distinction between the death of the person and the death of the organism, the role of integrative unity, and the normative weight of irreversibility—map cleanly onto cluster-state versus node-state distinctions, which ones require distortion (for example, whether medical irreversibility has any analog to rollback or log replay), and whether the assertion that a heart-beating brain-dead body is a dead organism rather than a partitioned cluster is expressible at all in systems terms. If some residue has no counterpart, say whether that absence reveals a genuinely biological-ontological commitment in medicine or merely a gap in the target vocabulary. Keep the translation honest: do not smuggle in distributed-systems assumptions and present them as medical claims.
