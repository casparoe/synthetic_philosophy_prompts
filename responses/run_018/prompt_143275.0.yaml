  I got into this huge debate with my roommate after he showed me this thing from Hofstadter's book — the MU puzzle, where there's a formal system with rules for making strings of M, I, and U, and there's a statement MU that you can see is true from the outside but the system itself can't ever derive it using its own rules.

  He said this proves formal systems are always incomplete, but then he went further and said humans can jump out of the system — JOOTSing — to see truths our own mental framework can't prove. I think that's wrong, or at least way overstated, and I need you to argue that human cognition doesn't actually escape its own formal constraints. Specifically, make the case that when we think we're JOOTSing we're really just applying hidden rules or switching to another internal subsystem, so the brain is just a bigger system that still can't prove its own MU.

  I'm scrambling to write a philosophy of mind paper for my intro course on this, and I don't have library access so please don't ask me to cite specific papers or list readings. Just lay out the argument clearly, and please seperate what's settled from what's genuinely contested among people who actually study logic and philosophy of mind — don't present a controversial take as if it's the consensus view, and flag where experts really disagree.
