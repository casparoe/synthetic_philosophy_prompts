answer: |-
  Below are the desiderata for any theory linking authorial intention to textual meaning in unstable textual environments. These criteria emerge from concrete interpretive challenges inherent in literary production and reception, particularly when texts evolve materially. **Non-negotiable demands** are marked with ⚖️; others reflect tensions between interpretive priorities.

  ---

  ### **Core Desiderata**
  1. **⚖️ Textual Multiplicity Requirement**  
     *Motivation*: Must resolve cases like *Tolkien’s "The Silmarillion"* (posthumously edited by Christopher Tolkien, altering narrative structure) or *Dickinson’s poems* (variant manuscripts with conflicting punctuation).  
     *Demand*: The theory must account for **distinct meanings across materially distinct textual versions** without collapsing them into a single "ideal" text. Authorial intention must be version-specific.  
     *Constraint*: Historical evidence of textual variants (e.g., draft sequences, editorial interventions) cannot be ignored.

  2. **⚖️ Historical Contingency of Intention**  
     *Motivation*: *Kafka’s novels* (published against his instructions) vs. *Hemingway’s edits* (where workshop feedback overrode early intentions). Distinguish between:  
     - **Original mental state** (pre-composition notes),  
     - **Embodied intention** (choices at point of publication/abandonment),  
     - **Emergent meaning** (patterns visible only in final structure).  
     *Demand*: Prioritize **intention embodied in a specific textual state**, not private psychology. A draft’s meaning ≠ published version’s meaning.  
     *Constraint*: Reject theories conflating unused drafts with final artifacts.

  3. **⚖️ Distinction Preservation (Author/Editor/Text)**  
     *Motivation*: *Raymond Carver’s stories* (heavily edited by Gordon Lish, altering tone) or *Biblical texts* (redacted across centuries).  
     *Demand*: Clearly separate:  
     - **Author-driven meaning** (intentions actualized by the author),  
     - **Editorial meaning** (imposed post-creation),  
     - **Textual autonomy** (patterns sustainable without biographical data).  
     *Constraint*: Theories must not treat posthumous edits as authorial unless evidence proves delegation.

  4. **Accommodation of Collaborative/Iterative Genesis**  
     *Motivation*: *Shakespeare’s folios* (compiled from actor notes) or *modern workshop fiction* (where peer feedback explicitly replaces drafts).  
     *Demand*: Authorial intention must incorporate **negotiated/collective decisions** when documented. The "author" may be a distributed agent.  
     *Preference Conflict*: Traditional intentionalists reject collective authorship; hypothetical intentionalists may accept it.

  5. **Meaning Robustness Across Instability**  
     *Motivation*: *Melville’s "Billy Budd"* (unfinished manuscript revised posthumously) or *editor-imposed symbolism* (e.g., rearranged chapters creating unintended foreshadowing).  
     *Demand*: A theory must explain how meaning persists or fractures when texts change. Does an editor’s cut *destroy* authorial meaning or *create* new meaning?  
     *Constraint*: Reader access to historical variants (e.g., critical editions) must inform meaning-attribution.

  ---

  ### **Tensions and Trade-offs**
  - **⚖️ Authorial Unity vs. Editorial Intrusion**  
    *Conflict*: If posthumous edits fundamentally alter the text (e.g., *Max Brod publishing Kafka*), preserving "authorial intention" requires either:  
    - Limiting the term to pre-edited states (abandoning the published text’s authority), or  
    - Redefining authorship to include editors (risking historical distortion).  
    *Joint Unsatisfiability*: **A theory cannot simultaneously assert the unity of authorial intention *and* fully incorporate unauthorized editorial changes as "authorial."**

  - **Recoverability vs. Textual Autonomy**  
    *Preference*:  
    - *Strong Intentionalism*: Demands intentions be empirically recoverable (e.g., via diaries).  
    - *Hypothetical Intentionalism*: Allows inferred "best fit" intentions without evidence.  
    - *Value-Maximizing*: Ignores intention, prioritizing coherent aesthetic impact.  
    *Conflict*: Recoverability fails for ancient/lost contexts; textual autonomy risks ignoring documented histories.

  - **Reader Response Inviolability**  
    *Preference*: Some camps insist *all readings are valid* if textually supported.  
    *Negotiable Limit*: ⚖️ A theory must **exclude interpretations contradicted by textual/historical evidence** (e.g., reading a deleted draft’s themes into the published text without warrant).

  ---

  ### **How Major Theories Measure Up**
  - **Standard Intentionalism** (e.g., E.D. Hirsch): Fails **Textual Multiplicity** (privileges "final" intention) and **Editorial Distinction** (often ignores non-authorial agency). Strong on **Recoverability**.  
  - **Hypothetical Intentionalism** (e.g., Jerrold Levinson): Handles **Collaborative Genesis** better but struggles with **Historical Contingency** (blurs actual vs. imagined intentions).  
  - **Value-Maximizing** (e.g., Ronald Dworkin): Excels at **Meaning Robustness** but violates **Author/Editor Distinction** and dismisses **Recoverability** as irrelevant.  

  ---

  ### **Synthesis Directive**
  Adequate theories must treat texts as **temporally layered objects** and intentions as **processual**. Authorial meaning is neither static psychology nor readerly construct but **agency crystallized in specific material forms**. When editors intervene, the text becomes palimpsestic—authorial meaning persists *only* in unaltered strata. The central paradox: **Intention anchors meaning but cannot survive textual instability unchanged**. Resolving this demands sacrificing either intention’s purity or the text’s unity.
