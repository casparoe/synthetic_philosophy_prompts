answer: |-
  ### Core Commitments
  **(a) Causal-exclusionist:** Physical causation is complete and closed; any physical effect is fully determined by prior physical causes. Mental properties, if non-identical to physical properties, are either causally excluded (epiphenomenal) or cause problematic overdetermination.  
  **(b) Anti-exclusionist (proportionality/multi-scale):** Causation is scale-sensitive. Higher-level properties (like mental states) can be genuine difference-makers if they are *proportional*—neither too specific nor too general—relative to their effects, often integrating information over broader spatiotemporal scales than underlying physical realizers.

  ---

  ### Dialogue: "Shadows and Substance"

  **Setting:** A philosophy conference coffee break. Dr. Aris (exclusionist) and Dr. Belen (anti-exclusionist) discuss a case study.

  **Dr. Aris:** Belen, your talk was intriguing, but I’m skeptical about your "integrative recognition" example. Take your subject, Kai, who initially mistakes a static rock under moving clouds for a moving predator. Kai’s neural state *N* (distributed pattern firing over 300ms) directly causes his recoil. Physics is causally closed: *N* suffices for the recoil. His "aha!" moment—realizing it’s just a rock—is either identical to *N* (which you deny) or causally idle. Why posit extra mental causation?

  **Dr. Belen:** Because interventionism shows both levels matter, Aris. Suppose we intervene to *prevent* the integrative recognition—say, by distracting Kai during the critical integration window. He still has *N*-like neural activity, but fragmented: visual cortex detects edges, parietal lobe processes motion, yet no *coherence* emerges. Result? He recoils. Now intervene to *induce* recognition *without* changing the local neural dynamics at *t*—impossible! Recognition *supervenes* on neural activity, but crucially, it integrates cross-modal cues (texture, shadow trajectory) over a *longer* interval (500ms) than *N* (300ms). The recognition is the *proportional* cause: it’s what makes the difference between recoiling and relaxing, as interventions altering *it* (via slower, higher-level manipulations) change behavior, even if underlying *N* varies.

  **Dr. Aris:** You’re conflating realization with causation. Let’s grant that varying the recognition varies the behavior *via* varying the neural realizer. But in any *single* instance, Kai’s recoil is fixed by *N* alone. If recognition isn’t identical to *N*, it’s screened off. Your "slower intervention" just tweaks the physical cause earlier in the chain. The completeness of physics demands that *N* does all the work at *t*. Calling recognition a "cause" is like calling the software’s high-level command the cause of a printer’s action—it’s really the electrons moving.

  **Dr. Belen:** But proportionality reveals why the high level isn’t redundant! *N* is too specific: if you minutely alter spike timings within *N* (say, shift a 10ms sub-process), the recoil likely still occurs. Yet if you alter whether recognition *occurs*—while holding fixed all *lower-level* causes except those constituting it—behavior changes robustly. Recognition is the *minimally sufficient* difference-maker for relaxation: it abstracts from noisy neural details. Crucially, it integrates information *across time* that *N* doesn’t encode locally—the shadow’s mismatch with cloud speed, registered auditorily earlier. *N* is a rapid local response; recognition is a global assessment. Different temporal windows, different causal roles.

  **Dr. Aris:** That "global assessment" is still physically realized. If every intervention on recognition corresponds to an intervention on its physical base, then at the moment of action, only the base is active. Physical closure means no "gap" for mental properties to affect behavior without overdetermining *N*’s effect. You have two causes for one effect—Kai relaxing.

  **Dr. Belen:** Not overdetermination, because they aren’t independent! Recognition *is realized by* neural processes like *N*, but at a coarser grain. Interventionism allows causes at multiple scales if they’re non-competing and proportional. Consider: intervening *only* on the shadow-integration aspect of recognition (e.g., blurring texture cues) affects behavior, even if we fix *N*’s *local* motion-detection. But you *can’t* fix the entire neural state while altering integration—they’re not separable. The mental property isn’t an *extra* cause; it’s a *macro-description* of what the physical state is doing causally at a scale relevant to adaptive behavior. Exclusion applies only if causes are at the *same* scale.

  **Dr. Aris:** But if macro-descriptions aren’t reducible, they must earn their causal keep independently. Physics doesn’t need "integration" to explain the recoil; neural pathways do. Your "scale-relativity" seems ad hoc to save mental causation.

  **Dr. Belen:** Not ad hoc—explanatorily vital. *Why* did Kai relax? Because he *recognized the object as stable*. The neural story *N* describes *how* the system implemented that recognition, but not *why it was appropriate*. Only the mental description captures the invariant—object stability under illumination change—that explains successful behavior across varying physical instantiations. That’s causal relevance: difference-making that tracks explanatorily robust patterns. Proportionality ensures exclusion doesn’t apply cross-scale. Kai’s mind isn’t causally idle; it’s where perception meets meaning.

  **Dr. Aris:** ...Meaning may explain *why* the system evolved, but not how it works *now*. I’ll ponder your invariance argument. But I still fear you’re giving consciousness a free pass.

  **Dr. Belen:** And I fear reducing Kai to a neural puppet. Let’s get more coffee—this rock isn’t moving, but our debate sure is.

  ---

  ### Key Themes Engaged
  - **Completeness of Physics:** Aris insists neural state *N* suffices; Belen argues higher-level interventions show mental states as difference-makers.
  - **Proportionality:** Belen uses interventions to show recognition is a more proportional cause than *N* for behavior; Aris questions whether it’s distinct from its base.
  - **Temporal Integration:** Recognition’s longer integration window vs. *N*’s local processing highlights scale relativity.
  - **Exclusion Principle:** Belen argues exclusion applies only intra-scale; Aris worries about overdetermination despite realization.
  - **Interventionism:** Both use counterfactual interventions to test causal claims within a single framework.
