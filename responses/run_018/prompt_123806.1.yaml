  **MUSEUM ACQUISITION CONTRACT: SCHEDULE 3.B (ONTIC PROVENANCE)**

  1.  **DEFINITION & UNITIZATION:** The term "Ontic Provenance" (OP) herein denotes the discrete, quantifiable metaphysical asset inherent solely to the original artwork ("Artwork"), certified at Closing at 100.0 OPV Units, representing full, uncontaminated originality independent of physical state or observable qualities, and constituting a divisible property right transferable with title.
  2.  **MODAL CONTAMINATION RISKS:** Purchaser covenants to mitigate OP degradation ("Modal Contamination") by ensuring no display within three (3) meters of any high-fidelity replica, prohibiting conservation using instruments previously applied to any copy (substantiated by instrument log review), and forbidding any retouching or addition by the Artist subsequent to the Closing Date.
  3.  **QUANTIFICATION OF DEGRADATION:** Any verified breach of Clause 2 shall trigger an immediate, independent audit by an Accredited Metaphysical Appraiser to quantify the resultant OP loss in OPV Units, calculated pro-rata based on the severity and nature of the contaminating event as per Schedule 5.D (Degradation Matrices).
  4.  **CERTIFICATION & WARRANTY:** Seller warrants valid title to 100.0 OPV Units at Closing, evidenced by a current OP Certificate issued by the International Ontic Registry (IOR), and agrees to indemnify Purchaser against any pre-Closing Modal Contamination revealed within twelve (12) months post-Closing via IOR-verified audit.
  5.  **INSURANCE & ASSIGNMENT:** Purchaser shall maintain all-risk OP insurance covering acquired OPV Units at agreed value, naming Seller as loss-payee for any Units degraded below certified levels due to Purchaser's post-Closing negligence; salvage rights to residual OP Units remain assignable only with IOR approval.
