  We are writing a 3-month research proposal for a small grant in philosophy of mind. The idea is to challenge the assumption in teleosemantics that each representation has one proper function. Instead, we propose that some neural state vehicles carry multiple non-hierarchical teleofunctions (e.g., one for error-correction, another for triggering action). The core question is whether content-determination can survive such multiplexing or if we must index content to context in a way that breaks the naturalization story.

  The proposal should be in American English, casual (typos are fine), and structured as follows:
  - State the question precisely.
  - Explain why standard Millikan-style and indicator-style answers don't settle it.
  - Lay out the method: mostly conceptual mapping plus drawing on cognitive-science cases of neural multiplexing (no experiments).
  - Say what a positive result looks like and what counts as failure.
  - Keep the scope honest for one quarter.

  After the proposal, include a JSON summary with the fields: "core_question", "why_existing_answers_fail", "method", "positive_result", "failure_condition", "scope_risk".

  We do not include a bibliography.

  Let's break down:

  1. **Core Question**: 
     Precisely: Can teleosemantic theories of mental content accommodate cases where a single neural state vehicle has multiple, non-hierarchical teleofunctions without resorting to contextual indexing that undermines the naturalistic ambitions of the theory?

  2. **Why existing answers fail**:
     - Millikan-style teleosemantics: Typically assigns one proper function per representation (or a hierarchy of functions). But if there are multiple non-hierarchical functions, then which one determines content? The theory doesn't say.
     - Indicator semantics (e.g., Dretske, Fodor): Content is fixed by what the state is supposed to indicate. But if the same state is supposed to indicate multiple things (in different contexts or for different purposes), then we have the same problem. The standard accounts assume a single function or a single condition for indication.

  3. **Method**:
     - Conceptual mapping: Analyze existing teleosemantic theories (Millikan, Papineau, etc.) and how they handle multiple functions (if at all). Identify where the theory would break in the face of non-hierarchical multiplexing.
     - Cognitive science cases: Look for real examples of neural multiplexing (e.g., in neural coding or cognitive neuroscience). For instance, neurons that encode multiple types of information (like location and reward) without a clear hierarchy. How do cognitive scientists describe these? Do they assign multiple functions?

  4. **Positive Result**:
     - We might show that teleosemantics can handle multiplexing by, say, introducing a way to assign content that respects all functions without context indexing (e.g., by defining a composite content). 
     - Or, we might show that it can't, and then we have to either revise the theory or accept that naturalization fails for such cases.

  5. **Failure Condition**:
     - We can't find clear cases of non-hierarchical teleofunctions in the cognitive science literature (i.e., the phenomenon we're worried about doesn't exist or is always hierarchical).
     - The conceptual mapping doesn't yield a clear answer and we end up with a mess of possibilities without a way to choose.

  6. **Scope Risk**:
     - We might bite off more than we can chew in 3 months. We must focus on a few key teleosemantic theories and a few clear cognitive science examples. Avoid getting lost in the weeds.

  Now, writing the proposal in a casual tone:

  ---

  **3-Month Research Proposal: Multifunctional Representations in Teleosemantics**

  **Core Question**: 
  Can teleosemantics figure out the content of a mental representation when the same neural state has multiple, separate jobs (teleofunctions) that aren't ranked in a hierarchy? Like, maybe one function is about fixing errors and another is about starting an action, both tied to the exact same neural state. And if teleosemantics can't handle that without saying "well, the content depends on the context", does that wreck the whole naturalization project?

  **Why Standard Answers Don't Cut It**: 
  So, the usual teleosemantics story, especially Millikan's, says each representation has one proper function (or maybe a main function with helpers). But if you've got two or more equally important functions, which one picks the content? The theory doesn't say. It's like having two bosses at work who give you equally important but different tasks. How do you know which task defines your job? Millikan's hierarchy idea doesn't help if there's no hierarchy.

  Indicator semantics (think Dretske or Fodor) has a similar issue. They say content is set by what the state is supposed to indicate. But if the same neural state is supposed to indicate X in one context and Y in another (and both are equally fundamental), then what's the content? The standard theories assume one indicator function per state. They don't handle multiplexing.

  **Method**: 
  I'm gonna do two things over three months. 
  First, I'll map out how existing teleosemantic theories (Millikan, Papineau, maybe Neander) deal with multiple functions. I'll look for any hints about non-hierarchical cases. This is conceptual work: reading, thinking, writing. 
  Second, I'll dig into cognitive science for examples where neurons or neural states seem to have multiple functions. Like, in vision or decision-making, are there neurons that code for both location and object identity? Or in motor control, neurons that are involved in both planning and executing an action? I'll look at reviews on neural coding and see if there's evidence for non-hierarchical multiplexing. No new experiments, just using existing literature.

  **What a Positive Result Looks Like**: 
  Best case: I show that teleosemantics can handle multifunctional representations without giving up on naturalization. Maybe by defining content in a way that combines the functions or by showing that one function always wins out. Or, if it can't, then I clearly show why not and what that means for naturalization projects.

  **What Counts as Failure**: 
  If I can't find any good examples of non-hierarchical teleofunctions in the brain, that's a problem. Maybe they don't exist. Or if the cognitive science is too messy and doesn't clearly assign functions. Also, if the conceptual work just leads to a bunch of equally plausible but conflicting answers, that's a fail too. Basically, if after three months I'm more confused than when I started, that's a failure.

  **Scope for One Quarter**: 
  I'm keeping it tight. I'll focus on 2-3 teleosemantic theories and 2-3 cognitive science examples. I won't try to solve the whole naturalization problem. Just see if this one issue (multiplexing) breaks it or not. And if it does, I'll just describe how and why, not fix it.

