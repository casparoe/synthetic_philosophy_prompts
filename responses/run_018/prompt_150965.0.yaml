  The core issue is how intuition pumps manipulate criteria. The thought experiment highlights one criterion (like functional continuity) while hiding others relevant to the real-world case (like subjective experience). The verbal labeling ("same person") tricks the mind into transferring the intuitive judgment from the fictional scenario to the practical one, creating a false sense of resolution.

  The user wants a term for this specific failure mode. They've distinguished it from false analogy, framing effects, or motte-and-bailey. They need something precise that captures the unnoticed criterion shift via shared labeling. Existing terms like "criterion exclusion fallacy" or "intuition laundering" come close but aren't perfect. "Criterion exclusion fallacy" seems most descriptive, emphasizing the exclusion of relevant criteria in the real case.

  The user also wonders if this is a cognitive bias or inherent in modal reasoning. It's likely both—a bias in how we handle analogies, exacerbated by the nature of philosophical thought experiments. But it can be mitigated by consciously interrogating each criterion's applicability to both scenarios.

  The user's deeper need might be for tools to critique such arguments effectively, especially in high-stakes situations like medical ethics. They might want to validate their critique methodologically and communicate it clearly to others. Coining a precise term helps in articulating this flaw and preventing oversight in ethical discussions.
answer: |-
  Your analysis brilliantly diagnoses a specific epistemic flaw in how thought experiments (or "intuition pumps") can misfire. This is a sophisticated observation of a genuine problem in applied philosophy. While no single established term perfectly captures this *exact* failure mode, we can define it precisely and distinguish it from related concepts:

  **Proposed Term:** **Criterion Exclusion Fallacy via Intuition Transfer (CEFIT)**

  **Definition:** A fallacy occurring when:
  1.  An intuition pump (thought experiment) is constructed to activate and satisfy a specific criterion (C1) relevant to judgment within its fictional constraints, generating an intuitive verdict (V1).
  2.  This verdict (V1) is transferred to a practical case (PC) via shared verbal labeling (e.g., "same person," "same ship").
  3.  However, the practical case (PC) inherently involves, or its ethical/practical evaluation critically depends upon, *additional criteria* (C2, C3...) that were:
      *   **Excluded or Suppressed:** Deliberately or inadvertently absent from the fictional setup of the intuition pump.
      *   **Saliently Different:** Operative in a way that fundamentally alters the evaluative landscape of PC compared to the fictional scenario.
  4.  The transfer of V1 to PC feels persuasive *because* the shared label and the intuitive satisfaction of C1 mask the exclusion and irrelevance of C2/C3 to the intuition pump, creating the illusion that PC has been adequately addressed when it has not.

  **Why CEFIT Fits Your Cases:**
  1.  **Teletransportation vs. Natural Cell Turnover:** The intuition pump (rapid teletransport) activates the criterion *C1: Discontinuity of Subjective Narrative*. Its verdict *V1: Identity Not Preserved* is generated. The natural process (slow cell replacement) activates *C2: Biological Process Continuity*, leading to *V2: Identity Preserved*. The argument misapplies V2 (from natural process/C2) to the rapid case (where C1 is salient) by using the shared label "teletransporter" and falsely equating C1 and C2 as "the same principle" of material change. It transfers the *wrong intuition* via the shared label, while excluding the *salient criterion* (C1) from the natural case and the *salient criterion* (C2) from the rapid case in the comparison.
  2.  **Ship of Theseus/Teletransport vs. Cortical Prosthesis:** The intuition pump (Ship/Teletransport) activates *C1: Functional Continuity* and generates *V1: Identity Preserved*. The practical case activates *C2: Continuity of Subjective Experience*, *C3: Legal Personhood Continuity*, *C4: Biological Vulnerability*. The argument transfers V1 to PC using the shared label "same person/ship." This *excludes* C2, C3, and C4, which are irrelevant to the Ship/Teletransport thought experiment but central to the ethical risk assessment of the prosthesis. The intuition about C1 feels like an answer to the PC *only because* C2-C4 are absent from the fictional frame.

  **Distinguishing CEFIT from Related Concepts:**

  1.  **False Analogy (General):** Too broad. CEFIT is a *specific mechanism* by which an analogy/intuition pump can fail: the *selective activation and transfer of an intuition based on one criterion while excluding other essential criteria in the target case via shared labeling*.
  2.  **Equivocation:** Involves shifting the meaning of a *single term* during an argument. CEFIT involves shifting the *criteria of evaluation* applied to cases linked by a *stable* shared label ("same person"). The label's meaning might be stable, but *what counts as evidence for applying the label* shifts unnoticed.
  3.  **Framing Effects (Decision Theory):** Focuses on how presentation alters choices among options. CEFIT focuses on how a fictional frame alters which *evaluative criteria* feel relevant and satisfied when judging identity or equivalence, enabling faulty transfer.
  4.  **Motte-and-Bailey:** Involves a strategic retreat from a controversial claim (bailey) to a defensible one (motte). CEFIT involves an *unconscious* shift in the criteria being evaluated, not a strategic retreat. Both versions (fiction & reality) are presented with the same conclusion (V1 applies to PC), but the grounds for the conclusion shift unnoticed.
  5.  **Good Analogical Reasoning:** *Explicitly considers the relevant similarities AND differences*, and the limitations of the analogy. CEFIT *suppresses awareness* of key differences (embodied in the excluded criteria) through the intuitive pull of the shared label and the satisfied fictional criterion.

  **Is it a Bias or Inherent? A Dual Nature:**

  1.  **Cognitive Bias Component:** CEFIT exploits well-documented cognitive tendencies:
      *   **Attribute Substitution:** Solving a hard problem (evaluating complex PC) by substituting an easier one (evaluating the simple intuition pump).
      *   **Intuitive Transfer:** Strong intuitions generated in vivid scenarios are sticky and readily applied to superficially similar real cases.
      *   **Salience Bias:** The intuition pump makes C1 highly salient; excluded criteria (C2/C3) are less cognitively available.
      *   **Label-Induced Conflation:** Shared linguistic labels powerfully cue us to treat things as equivalent, overriding critical analysis of differences.
  2.  **Inevitable Feature?** It is *common* and perhaps *structurally tempting* when using modal imagination for practical ethics, but **not inevitable**. It can be **corrected** through methodological vigilance:
      *   **Explicit Criterion Enumeration:** Forcefully list *all* criteria relevant to evaluating the practical case *before* introducing the intuition pump. Then ask: "Which of these criteria does the thought experiment actually address? Which does it ignore or make irrelevant?"
      *   **Disanalogy Hunting:** Actively search for differences between the fiction and reality, specifically focusing on which evaluative criteria are operative in each. Ask: "What *else* matters here that the story leaves out?"
      *   **Label Suspicion:** Treat shared labels ("same person") as *questions* to be investigated, not *answers* provided by the analogy. Ask: "Does 'same person' mean the same thing *in terms of what matters* in both scenarios?"
      *   **Reverse Engineering:** Start from the practical concerns (subjective continuity, legal status) and ask: "Does this thought experiment *actually speak* to *this specific worry*?"
      *   **Multiple Pumps:** Use *different* thought experiments designed to activate the *excluded* criteria to counterbalance the first pump.

  **Conclusion:**

  Your observation of **Criterion Exclusion Fallacy via Intuition Transfer (CEFIT)** pinpoints a significant and subtle flaw in how philosophical tools can mislead, particularly in high-stakes practical domains like neuroethics. It arises from the interaction of modal imagination, cognitive biases (attribute substitution, salience, intuitive transfer), and the power of language to conflate distinct evaluative contexts. While a natural hazard of using thought experiments, it is not inevitable. By rigorously dissecting the criteria activated and excluded by the intuition pump and explicitly comparing them to the criteria demanded by the practical case, one can avoid being "pumped" into overlooking crucial aspects of real-world ethical dilemmas. The term "CEFIT" highlights the core mechanism: the *exclusion* of essential practical *criteria* enabled by the *transfer* of an *intuition* calibrated only to the fictional case.
