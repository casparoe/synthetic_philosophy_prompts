  Socrates: His trial was messy, but context is key. Post-war chaos, the trauma of the Thirty Tyrants (led by his associates), and his own defiance during proceedings. The jury was large (500+), showing collective judgment, not mob rule. And later, Athens regretted it—they punished his accusers. 

