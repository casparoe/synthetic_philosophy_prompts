answer: |-
  Here’s a rigorous defense of my ranking for your team, prioritizing **conceptual leverage**, **tractability without big data**, and **upstream impact** on the other problems:

  ### **Ranking & Rationale**  
  1. **#4: The Essence-Style Split**  
  2. **#2: Cross-Modal Recognition**  
  3. **#1: The Ghost Stroke Problem**  
  **Drop #3: Synthetic Bleed** (reasoned below)  

  ---

  ### **Defense of Top Choices**  
  **1. #4: Essence-Style Split (Core Foundation)**  
     - **Why Upstream?**  
       This is the *ontological bedrock*. If "a-ness" is style-dependent, all other problems reduce to contextual pattern-matching. If essence is absolute, it constrains how style/variation can operate. Resolving this informs *every* other question about categorical boundaries (#1, #3) and invariance (#2).  
     - **Tractability Without Big Data:**  
       - **Philosopher:** Unpacks theories of universals (Platonism vs. nominalism) applied to glyphs.  
       - **Type Designer:** Creates controlled glyph sets (e.g., "a" in Blackletter, Sans, Script) warped along style axes.  
       - **Cognitive Scientist:** Designs recognition/priming experiments testing if "a" in Style X primes "a" in Style Y *better* than a style-matched non-"a".  
       *Tools:* Psychophysics software (PsychoPy), parameterized glyph generation (Glyphs/Robofont). No corpus needed.  
     - **Move Up/Down Trigger:**  
       If experiments show *asymmetric priming* (e.g., Blackletter "a" primes Sans "a" weakly, but not vice versa), essence is style-contingent → moves *up*. If priming is style-invariant, essence is absolute → still critical but shifts focus.  

  **2. #2: Cross-Modal Recognition (Empirical Invariant Hunt)**  
     - **Why Second?**  
       Tests the *real-world limits* of categorical identity. If we recognize "a" in fog/bent neon, it pressures #4 (essence must survive extreme style loss) and defines constraints for #1 (what strokes *can't* be removed). Answers whether recognition relies on structural universals or Bayesian inference.  
     - **Tractability Without Big Data:**  
       - **Cognitive Scientist:** Degrades glyphs via simulation (motion blur, occlusion, texture) and tests recognition thresholds.  
       - **Type Designer:** Crafts non-font stimuli (e.g., wireframes, eroded forms).  
       - **Philosopher:** Interprets whether thresholds imply abstract invariants or probabilistic heuristics.  
       *Tools:* GIMP/Python for image degradation, eye-tracking (if budget allows), behavioral labs.  
     - **Move Up/Down Trigger:**  
       If degradation reveals a *geometric invariant* (e.g., "a" always requires a closed counter + terminal stroke), it supports essentialism → bolsters #4. If recognition collapses unpredictably, categories are heuristic → refocuses #1.  

  **3. #1: Ghost Stroke Problem (Categorical Boundary Mapping)**  
     - **Why Third?**  
       Builds on #4 and #2. If essence is style-relative (#4) and recognition degrades gracefully (#2), *then* we can probe *how* styles modify feature necessity. Tests Wittgenstein's "family resemblance" against necessary/sufficient features.  
     - **Tractability Without Big Data:**  
       - **Type Designer:** Generates stroke permutations (e.g., "a" sans crossbar, with doubled bowl).  
       - **Cognitive Scientist:** Measures ID confidence/accuracy across styles.  
       - **Philosopher:** Analyzes if boundary shifts align with feature-based vs. prototype theories.  
       *Tools:* Same as #2, plus crowdsourcing for behavioral data (MTurk *is* feasible without "web access for AI training").  
     - **Move Up/Down Trigger:**  
       If stroke necessity *covaries predictably* with style (e.g., crossbar critical in serif but not sans), it confirms style-essence entanglement → elevates #4. If all styles share fixed stroke dependencies, essence is rigid → less urgent.  

  ---

  ### **Why Drop #3: Synthetic Bleed?**  
  - **Overrated & Downstream:**  
    This is an *artifact of AI training*, not a window into human cognition. Models conflate "a" and "e" because they learn statistical manifolds, not ontological boundaries. It confuses *style entanglement* (#4) with *category fuzziness* (which #1/#2 test better).  
  - **Intractable Without Big Data:**  
    Requires generative models (GANs/VAs) trained on massive font sets → violates your "no massive corpora" constraint.  
  - **Not Upstream:**  
    Even if resolved, it wouldn’t clarify whether bleed stems from human-like category structure or dataset bias.  

  ---

  ### **Why This Agenda Wins Funding**  
  1. **Leverages Interdisciplinarity:**  
     - Philosopher tackles metaphysics (#4), cognitive scientist tests mechanisms (#2), type designer operationalizes variation (#1).  
  2. **Incremental Milestones:**  
     - Year 1: Resolve essence-style interplay (#4).  
     - Year 2: Test invariance under degradation (#2).  
     - Year 3: Map style-contingent feature necessity (#1).  
  3. **Foundational Outputs:**  
     - A **unified model of glyph categorization** (addressing Plato vs. Wittgenstein in type).  
     - **Design principles** for legibility under distortion (applied value).  
     - **Experimental paradigms** for perceptual invariance beyond typography.  

  This ordering attacks the deepest question first (#4), uses empirical reality checks (#2), then explores stylistic nuance (#1)—while avoiding AI’s red herrings (#3). If funded, this team could redefine how we think about visual universals.
