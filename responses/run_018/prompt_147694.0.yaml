  Can you write an essay that takes this seriously and reaches a real conclusion? I want you to use the idea of masked or finkish dispositions — the general thought that some traits are hidden unless an inhibiting condition is lifted — to frame the debate. Ask whether Plato treats drunkenness as revealing a pre-existing moral disposition or as actively corrupting the logistikon and thumoeides in a way that makes the 'revelation' unreliable. Weigh the Symposium scene against the Laws passages, but don't sit on the fence: defend one side, even if it's qualified (for example, that it's mostly distortion with limited value only for the rulers testing citizens). Don't just list secondary literature — I'm trying to work out the conceptual argument myself for a course paper, so no bibliography or citation list needed. Also I definatly don't want generic intro stuff; jump straight into the argument.
