  First, I need to map out the decision tree structure. The opening branch is about physical correlation: is it necessary? If yes, then move to whether it's sufficient. If not, skip to other criteria. 

  Next, heroic singularity: is a single protagonist required? This ties into Arthurian legends where figures like Arthur might be composite. Then, collective memory without identifiable heroes—like Exodus where Moses might be symbolic. 

  The event scale branch is crucial. For example, a city siege (Troy) vs. migration (Exodus) might need different evidence. Minimalists might accept small-scale events but not grand narratives. 

  For positions: maximalists accept legends as largely historical, minimalists see limited truth, mythicists deny any history, kernel theorists believe in a core event. Narrative-functionalists focus on why the story persists, not its historicity. 

  Awkward commitments: for maximalists, accepting Exodus without Egyptian records is tough. Minimalists might struggle with Arthur's historicity despite lack of evidence. Mythicists deny Troy's existence despite Hittite texts. 

  Indistinguishable pairs: say a minimalist who denies Anatolian destruction layers and a maximalist who only accepts post-Roman continuity. Both might end up rejecting Troy's historicity based on stratigraphy. 

  Archaeological silence branch: does absence of evidence mean evidence of absence? Disconfirmation vs. neutral. Scholars split here—Exodus minimalists say silence disconfirms, while others see it as neutral. 

  Need to ensure the tree uses case-based reasoning, not specialist knowledge. Each question should be answerable by thinking through Troy, Arthur, Exodus examples. 

  Also, positions should be named only if they exist. For example, a combo that requires physical evidence and heroic figures but accepts memory without protagonists might not have a name. 

  Check for logical consistency. The tree must separate positions clearly, but flag where it can't, like the minimalist/maximalist overlap on stratigraphy. 

  Finally, the leaves should have the position's most awkward stance. For narrative-functionalists, it's ignoring historical truth for societal function. For kernel theorists, it's accepting a vague core without specifics. 

  This tool helps readers apply consistent criteria across different legends, revealing their own biases. The journalist wants to clarify debates without jargon, making archaeology of belief accessible.
answer: |-
  Here is a decision tree designed for your readers, built around the three stress cases (Trojan War, Arthurian Cycle, Exodus) and focused on concrete evidentiary commitments. It prioritizes reasoning through the cases over specialist knowledge.

  **Decision Tree: When Does Legend Become History?**

  **START**

  1.  **IS PHYSICAL CORRELATION (Stratigraphy, Settlement Patterns, Material Traces) NECESSARY to establish a historical kernel?**
      *   **YES** → Go to Question 2.
      *   **NO** → Go to Question 3.
      *   *(Case Reasoning: Troy: Destruction layers? Exodus: Sinai evidence? Arthur: Post-Roman fort continuity?)*

  **BRANCH A (Physical Correlation Necessary)**

  2.  **IS PHYSICAL CORRELATION SUFFICIENT by itself to confirm the *specific claimed event* (e.g., Trojan War, Exodus migration)?**
      *   **YES** → **Position: Maximalist.** *Most Awkward Commitment:* Accepting a stratigraphic destruction layer (e.g., Troy VIIa) as definitive proof of the specific Homeric siege described, disregarding potential alternative causes or chronological mismatches. (Applies most directly to Troy).
      *   **NO** → Go to Question 4.
      *   *(Case Reasoning: Troy layer = Agamemnon's war? Exodus pottery scatter = mass migration? Arthur's Camelot = Tintagel occupation?)*

  3.  **CAN THE HISTORICAL KERNEL BE PRESERVED SOLELY THROUGH COLLECTIVE MEMORY, even without identifiable protagonists or specific locations?**
      *   **YES** → **Position: Kernel-Historian.** *Most Awkward Commitment:* Accepting a core event (e.g., some significant migration/upheaval related to Egypt/Canaan) as historical based purely on the narrative's persistence and internal logic, despite the complete absence of direct archaeological or contemporary textual evidence matching the scale or specifics (e.g., Exodus). Must address narrative inflation.
      *   **NO** → **Position: Mythicist.** *Most Awkward Commitment:* Dismissing *any* potential historical basis for the Trojan War, Arthurian Britain, or Exodus migration, regardless of textual traditions or indirect evidence (e.g., Hittite "Wilusa" texts for Troy, Sub-Roman British warlords for Arthur), arguing they are entirely constructed fictions serving later ideological needs.
      *   *(Case Reasoning: Exodus without Moses? Arthur without a single king? Troy without a named city siege?)*

  **BRANCH B (Physical Correlation NOT Necessary)**

  4.  **MUST A SINGLE, IDENTIFIABLE HEROIC FIGURE BE RECOVERABLE (e.g., Arthur, Agamemnon, Moses) FOR THE CORE TO BE HISTORICAL?**
      *   **YES** → Go to Question 5.
      *   **NO** → **Position: Kernel-Historian (Event-Focused).** *Most Awkward Commitment:* Accepting the core *event* (e.g., a significant conflict inspiring the Trojan epics, a major migration/dislocation inspiring Exodus, a period of British resistance) as historical while acknowledging the protagonists (Arthur, Moses, Agamemnon) are likely legendary composites or entirely invented. Requires defining the event without its central figures. (Strongest fit for Arthurian resistance *period* vs. Arthur the king).
      *   *(Case Reasoning: Can Arthurian Britain be real without King Arthur? Can Exodus be real without Moses? Can the Trojan conflict be real without Agamemnon?)*

  5.  **DOES THE SCALE/SOCIAL FORM OF THE CLAIMED EVENT (City-State Siege, Sub-Roman Polity Consolidation, Mass Migration) ALTER THE KIND OF EVIDENCE REQUIRED, not just the amount?**
      *   **YES** → Go to Question 6.
      *   **NO** → **Position: Minimalist.** *Most Awkward Commitment:* Applying the same high threshold of evidence (e.g., direct contemporary inscription naming the event/leader) to vastly different event types. This often leads to rejecting *all* cores for these specific legends (Troy siege, Arthur's kingship, Exodus migration) as unsupported, potentially overlooking evidence types suitable to smaller scales (e.g., local British warlord for Arthurian kernel). Burden of proof is uniform and high.
      *   *(Case Reasoning: Does proving a migration need different evidence than proving a siege? Does proving a single king need different evidence than proving a resistance era?)*

  6.  **WHAT KIND OF EVIDENCE IS EXPECTED FOR THE EVENT'S SCALE?**
      *   **FOR LARGE-SCALE/STATE EVENTS (Troy Siege, Exodus Migration):** Expects direct epigraphic/administrative records or unambiguous, widespread material patterns. → **Position: Minimalist (High Threshold).** *Most Awkward Commitment:* Rejecting the historicity of the Trojan War siege despite Hittite texts referencing "Wilusa" and conflicts because no Hittite/Egyptian text names "Ahhiyawa" (Greeks) sacking it *in that specific era*, or rejecting Exodus because no Egyptian record mentions Israelite slaves fleeing *en masse*.
      *   **FOR SMALLER-SCALE/LOCAL/CLAN EVENTS (Sub-Roman British Resistance):** Accepts more indirect evidence (later fragmented texts, plausible site continuity, absence of Roman administration). → **Position: Maximalist (Contextual Burden).** *Most Awkward Commitment:* Accepting the existence of a powerful, unifying "King Arthur" based on evidence (e.g., post-Roman elite activity at Tintagel, Gildas' "Badon") that only strongly suggests smaller-scale warlords or a period of resistance, inflating the scale implied by the actual evidence.
      *   *(Case Reasoning: Troy/Exodus demand state-level evidence. Arthurian resistance might only leave local chiefdom-level traces.)*

  **CROSS-CUTTING BRANCH (Applicable to All Paths)**

  7.  **HOW DO YOU INTERPRET ARCHAEOLOGICAL SILENCE (Absence of expected evidence)?**
      *   **DISCONFIRMATION (Absence of Evidence = Evidence of Absence):** The lack of expected evidence *against* the claimed event's scale/nature makes it less likely or disproves it. → **Position: Often aligns with Minimalist/Mythicist.** *Most Awkward Commitment:* Arguing the lack of Egyptian records mentioning the Exodus slave revolt/mass departure *proves* it didn't happen *at the claimed scale*, or that the lack of 5th-6th century British inscriptions naming Arthur *proves* no significant leader existed.
      *   **NEUTRAL ABSENCE (Absence of Evidence ≠ Evidence of Absence):** The lack of evidence is expected due to preservation bias, recording practices, or the event's nature; it doesn't weaken the case based on other evidence types (texts, collective memory). → **Position: Often aligns with Maximalist/Kernel-Historian.** *Most Awkward Commitment:* Maintaining the possibility of a mass Exodus despite the complete lack of Sinai wilderness campsite evidence matching the narrative timeline and scale, attributing it entirely to ephemerality and poor preservation in arid environments.
      *   *(Case Reasoning: No Sinai evidence = No Exodus? No named Arthur inscription = No Arthur? No Hittite sack record = No Trojan War?)*

  **FLAGGED INSEPARABLE PAIR:**

  *   **Path:** [Physical Corr. Necessary? **YES**] → [Corr. Sufficient? **NO**] → [Hero Necessary? **YES**] → [Scale Alters Proof? **YES**] → [Evidence for Scale: **Small-Scale**]
  *   **Position:** **Maximalist (Contextual Burden)** - Accepts Arthur based on contextual evidence for smaller-scale leadership.
  *   **Inseparable From:** A hypothetical **Minimalist** stance reached via: [Physical Corr. Necessary? **YES**] → [Corr. Sufficient? **NO**] → [Hero Necessary? **YES**] → [Scale Alters Proof? **NO**] → **Minimalist**. *Why?* Both paths require physical correlation and a hero. The Maximalist (Contextual) lowers the burden *kind* for Arthur's scale/evidence. The Minimalist (High Threshold) applies a uniform high burden. **The Tree cannot distinguish them if the Minimalist also happens to think the *specific* physical evidence for Arthur (e.g., Tintagel continuity) is insufficient *even for a small-scale leader***, while the Maximalist finds it sufficient *for that smaller scale*. Both end up at "evidence insufficient for *this specific claim*" based on their starting criteria, but for logically different reasons (scale-adjusted burden vs. uniform high burden). They converge on rejecting the *traditional* Arthur narrative while potentially differing on the possibility of a kernel leader. The tree shows their criteria but not their final assessment of the *specific evidence quality* within their chosen burden.

  **Unnamed Positions:** The combination [Physical Corr. Necessary? **NO**] → [Collective Memory Kernel? **NO**] → **Mythicist** is named. Other combinations leading to Kernel-Historian or Minimalist are named. The path requiring a hero but rejecting scale-adjusted burden ([Physical Corr. Necessary? **NO**] → [Hero Necessary? **YES**] → [Scale Alters Proof? **NO**]) leads to a **Minimalist** position demanding high evidence for the hero regardless of event type.

  This instrument forces readers to confront their own thresholds for different *types* of evidence and how they handle negative evidence, using the canonical cases as concrete anchors. It reveals how positions on one case might logically cohere (or clash) with positions on others based on underlying commitments.
