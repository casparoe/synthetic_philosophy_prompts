prompt: |-
  I teach an upper-level political philosophy seminar with about 18 students; sessions run 75 minutes. We have just finished a unit on Ulysses contracts and constitutional precommitment, and I want to replace one of the lecture-discussion days with a structured simulation. Last year I tried running the topic as a free-floating hypothetical (should a constitutional amendment require more than a majority?), and it fell flat: students could already name the standard positions and nothing about their view moved. What I want is an activity where they actually experience the pull of binding a future collective self, the way an entrenched rule turns what the current majority wants into a question the majority cannot settle by wanting it, and the force of the dead-hand worry from the inside, as someone who sincerely prefers to change a rule finds that the rule was built precisely so that their preference does not count. One design I have been toying with: a multi-round budget or constitutional convention game in which an early round can, by supermajority, adopt a rule that later rounds cannot easily amend, and a later round is put in the position of genuinely preferring to change it. But I would rather the students construct or fall into the mechanism themselves than have me announce it, and I am open to better mechanics. Constraints: no lecture up front, no technical vocabulary until the debrief, no real money, and it must run with only paper, a whiteboard, and index cards, all within the 75 minutes including setup and debrief. By the end, the students should be able to distinguish binding against predictable weakness of will from binding against future changes in values, and to say which of those better describes the Ulysses case and which better describes constitutional entrenchment. The debrief should map specific moments in the activity onto that distinction and onto the dead-hand objection, say what will predictably go wrong the first time I run it and how to handle it, and be honest about what the simulation cannot reproduce and so I will have to supply myself.

  After the runnable activity and debrief, include a brief structured summary as a JSON object with these fields: "phases" (an array, each element an object with keys "name", "duration_minutes", "what_happens", and "intended_effect"); "concept_map" (an array, each element an object with keys "moment", "concept", and "debrief_prompt"); "predictable_failures" (an array, each element an object with keys "failure", "likely_cause", and "fix"); and "cannot_reproduce" (a string naming the single most important thing the activity cannot embody and that I must supply).
reasoning: |-
  We are designing a simulation activity for a political philosophy seminar. The goal is to have students experience the tension between binding future decisions and the "dead-hand" problem, especially in the context of constitutional precommitment and Ulysses contracts.

  Constraints:
  - 75 minutes total, including setup and debrief
  - No lecture upfront; minimal technical vocabulary until debrief
  - Only paper, whiteboard, index cards
  - Must help students distinguish between binding against weakness of will (Ulysses contracts) and binding against future changes in values (constitutional entrenchment)

  Activity Design Idea: Multi-round decision-making game with rules that can be entrenched and then later become hard to change. We want students to "construct or fall into" the mechanism, so we'll set up a scenario where they naturally want to bind themselves and then later feel constrained.

  Proposed Activity: "The Resource Allocation Convention"

  Overview:
  Students are divided into groups (we have 18 students; so 3 groups of 6, but note: the group composition will change over rounds). The convention has 3 rounds, each round representing a different time period (e.g., past, present, future). In each round, a group must make decisions about allocating resources (represented by points) to different categories (e.g., Education, Defense, Environment). The twist is that in Round 1, they can set a rule (by supermajority) that binds Round 2 and Round 3. Then in Round 3, they must deal with the rule set in Round 1, even if their preferences have changed.

  However, we want the binding rule to emerge from the students' own desire to constrain future decisions. So we'll set up a scenario where the Round 1 group has a particular set of values (e.g., they care a lot about Environment) and they fear that future groups might not. Then in Round 3, we change the context (e.g., a crisis that makes Defense seem more urgent) so that they want to change the rule but cannot easily do so.

  To avoid upfront technical terms, we'll use neutral language.

  Setup:
  - We need three rounds. Each round, a group of 6 students will make decisions. But to simulate the "future self", we need to change the group composition. So we assign students to groups for Round 1, then reshuffle for Round 2, and again for Round 3. This simulates changing times and changing majorities.

  Steps:

  1. Introduction (5 minutes): Explain the scenario without using terms like "precommitment". 
     Scenario: "We are a society that must decide how to allocate our resources for the next 50 years. We are meeting in three different time periods: 1950, 2000, and 2050. Each time period has a council of 6 members. The decisions you make in 1950 will set the rules for the future. Then in 2000, you can adjust some things but must follow the rules set in 1950. In 2050, you face a new situation and must make decisions under the rules set in 1950 and any changes made in 2000."

  2. Round 1 (1950) (15 minutes):
     - Group of 6 students. They are given a budget of 100 points to allocate to three categories: Schools (Education), Security (Defense), Nature (Environment). They must decide the allocation by majority vote. 
     - Additionally, they can propose a rule: "Any future change to the allocation for Nature must be approved by at least 5 out of 6 council members." (This is a supermajority requirement for one category.) They must vote on whether to adopt this rule. The rule requires a supermajority to pass (say, 5 out of 6). 
     - Why would they do this? We set the context: "In 1950, the society has just experienced an environmental disaster (e.g., Dust Bowl) so they value Nature very highly." We tell the Round 1 group: "Your society has learned the hard way that protecting Nature is essential. You fear that future generations might forget this lesson and underfund Nature in normal times. You want to make it hard to reduce funding for Nature in the future."

     - They first allocate the 100 points (by majority). Then they discuss and vote on the rule. We record the allocation and whether the rule was adopted.

  3. Round 2 (2000) (10 minutes):
     - Reshuffle the students into new groups of 6 (so they are a different "generation"). 
     - They are told: "It's 2000. The society is in a period of stability. You can change the allocation, but note: if the rule was adopted in 1950, then to change the Nature allocation you must get 5 out of 6 votes. Otherwise, majority vote applies. Also, you cannot change the rule itself (the amendment rule) because that was set in 1950 and requires an even higher threshold (e.g., 6/6) to change, which we don't have time for. So you can only change the allocation, subject to the existing rules."
     - They get the allocation from 1950 and can re-allocate. They may try to change the Nature funding, but if the rule is in place, it's hard. We expect they might not change it much because they don't have a strong reason to.

  4. Round 3 (2050) (15 minutes):
     - Reshuffle again into new groups of 6. 
     - Context: "It's 2050. A major security crisis has occurred (e.g., a war or a terrorist threat). Security is now the top priority for most people. However, the allocation for Nature is still high because of the rule set in 1950. You need to reallocate to increase Security. But to reduce Nature, you must follow the rule set in 1950 (if it was adopted): 5 out of 6 votes. Otherwise, majority vote."
     - They try to reallocate. If the rule is in place, they may struggle to get 5 votes to reduce Nature. Some members might still value Nature highly (depending on the students) but the majority will likely want to shift to Security.

  5. Debrief (30 minutes): We discuss the experience and then introduce the concepts.

  Debrief Structure:
  - First, ask students to describe what happened and how they felt in each round.
  - Then, map to concepts:
     - In Round 1: They bound the future because they feared weakness of will (forgetting the environmental lesson) OR because they feared a change in values? Actually, it's both: they feared that without the disaster, future generations wouldn't value Nature as much (change in values) and also might be tempted to underfund it for short-term gains (weakness of will). But we want to distinguish these. So we highlight that the rule was set to protect against both, but in the Ulysses contract, it's about weakness of will (like Ulysses tying himself to resist the sirens), while in constitutional entrenchment, it's often about protecting against future shifts in values (e.g., protecting minority rights even if the majority changes its mind).
     - In Round 3: They experienced the dead-hand problem: a rule set by a past majority that they now find constraining and perhaps irrational in the new context.

  We need to design the activity so that the distinction becomes clear.

  Adjustment to highlight the distinction:
  We can set up two parallel rules: one that is clearly about weakness of will and one about changing values. But that might complicate. Alternatively, in the debrief we can tease apart the two motives in the Round 1 decision.

  Revised Round 1:
  - We tell them: "You have two concerns: 
     1. You fear that in normal times, without a crisis, people might be tempted to underfund Nature to spend more on immediate needs (weakness of will). 
     2. You also fear that future generations might not value Nature as much as you do (shift in values)."
  - Then they set one rule that addresses both.

  But in the activity, they set one rule. Then in the debrief, we can ask: "Why did the 1950 council set the rule? Was it because they thought future generations might be weak-willed? Or because they thought future generations might have different values? Or both?"

  Then we can contrast with Ulysses: Ulysses knew he would still value not crashing into the rocks, but he feared his will would be weak when tempted by the sirens. In the constitution, we often entrench rules because we fear that even if the values change (e.g., a majority might come to disregard minority rights), the rule should stand.

  Activity Mechanics:

  Materials:
  - Index cards for group assignments and voting.
  - Whiteboard to record allocations and rules.
  - Paper for each group to write their allocation.

  Phases:

  1. Introduction (5 min)
  2. Round 1 (1950): 15 min
     - Form Group 1950 (6 students randomly selected from 18? But then we have 3 groups? Actually, we have 18 students. We can have three separate simulations? But that might be chaotic. Alternatively, we can have one simulation with 6 students at a time? But then 12 are idle. Better: divide the class into three independent groups (A, B, C) of 6. Each group does the entire simulation in parallel. Then we can compare in debrief. This also allows for different outcomes (e.g., one group might adopt the rule, another might not).

     So: three groups (A, B, C) of 6. Each group goes through Rounds 1, 2, 3 independently. We run the rounds sequentially for all groups at the same time.

     Steps for Round 1 in each group:
       a. Assign the context: "1950: After environmental disaster, you value Nature highly."
       b. Allocate 100 points to Schools, Security, Nature by majority vote. They discuss and vote. Record.
       c. Propose the rule: "To reduce the allocation for Nature in the future, a supermajority of 5 out of 6 council members must agree." 
       d. Discuss and vote on the rule. Requires 5/6 to pass? But if the group has 6, then 5/6 is a high bar. Alternatively, we can say 4/6? But we want it to be hard to change. Let's stick to 5/6 for the rule to pass in Round 1. And note: the rule, once passed, requires 5/6 to change Nature allocation in the future.

  3. Round 2 (2000): 10 min
     - Reassign: within each group of 6, they stay together? But we want to simulate a different set of people. So we reshuffle within the whole class? But then groups A, B, C would mix. That might be messy. Alternatively, we can have the groups stay together but change their roles? But that doesn't simulate a new generation.

     Solution: We have three groups (A, B, C) and they remain as three distinct societies. For each society, we reassign the roles for Round 2: we take the 6 students in group A and randomly reassign them to two roles: 5 of them become the 2000 council, and one becomes an observer? That doesn't work.

     Better: We keep the same groups for simplicity, but tell them: "You are now a different set of council members in the same society, in the year 2000. You may have different perspectives." We don't physically reshuffle within the group, but we ask them to imagine they are different people. This is a compromise, but it's practical.

     Alternatively, we can have each group of 6 break into two subgroups of 3? Then we'd have 6 groups? That might be too many. 

     Given time, let's keep the same groups of 6 for Rounds 1, 2, and 3, but ask them to take on a different mindset in each round. We'll provide a role card for each round that describes the context and their priorities.

     Role Cards for Round 1 (1950): 
        "You are living in 1950. Your society has recently experienced a devastating environmental disaster (e.g., a dust bowl) that caused food shortages and economic hardship. You believe that protecting the environment (Nature) is essential for survival. You also value Schools and Security, but you feel that without a healthy environment, the rest won't matter. You are worried that in the future, when the disaster is a distant memory, people might neglect Nature."

     Round 2 (2000):
        "It's 2000. Your society is stable and prosperous. The environmental disaster of 1950 is a historical lesson, but there are no immediate crises. Some people think we spend too much on Nature and that we should invest more in Schools to prepare for the information age. Others want more Security to prevent potential threats. There is a growing sense that the rules set in 1950 might be too rigid."

     Round 3 (2050):
        "It's 2050. A major security crisis has erupted (e.g., a war or a large-scale terrorist attack). Security is now the top priority for the majority of the population. However, the budget allocation for Nature is still high because of the rules set in 1950. You need to increase Security funding immediately, but the rules make it hard to reduce Nature. Some people argue that the environment is still important, but the immediate threat is Security."

     We distribute these role cards at the beginning of each round.

     Steps for Round 2 (2000) in each group:
       - They get the allocation from Round 1 and the rule (if passed).
       - They can reallocate the 100 points, but if they want to change Nature and the rule is in effect, they need 5 out of 6 votes to reduce Nature. They can change other categories by majority (4 out of 6). They must make a decision.

     Steps for Round 3 (2050):
       - Same as Round 2, but with the new context.

  4. Debrief: 30 minutes. We bring the class together.

  Debrief Structure:
  - Ask groups to report: Did they pass the rule in Round 1? What happened in Round 3?
  - How did they feel in Round 1 setting the rule? In Round 3 trying to change?
  - Then we draw out the concepts: 
     - The rule was a precommitment against two things: 
          a) Weakness of will: in normal times (Round 2) they might be tempted to reduce Nature for short-term gains (like Ulysses fearing the sirens).
          b) Change in values: in Round 3, the crisis made them value Security more, so they wanted to change the allocation even though they were not weak-willed but rationally responding to new circumstances.
  - Distinguish: Ulysses contracts are typically about (a), while constitutional entrenchment is often about (b) and also about protecting against majority tyranny, etc.
  - The dead-hand objection: In Round 3, they were bound by the dead hand of the past, which might not have foreseen the crisis.

  Concept Mapping in Debrief:
     Moment: Round 1 setting the rule by supermajority.
        Concept: Precommitment against both weakness of will and changing values.
        Debrief Prompt: "Why did the 1950 council set the rule? Did they fear that future councils might be weak-willed? Or that they might have different values? Or both?"

     Moment: Round 3 trying to change the allocation for Nature but being blocked by the rule.
        Concept: The dead-hand problem (rule set by past that constrains present despite changed circumstances).
        Debrief Prompt: "How did it feel to be in 2050 and not be able to reduce Nature funding even though the context had changed? Is that fair? Why or why not?"

  Predictable Failures:
     - Failure: A group in Round 1 doesn't pass the rule.
        Cause: They might not see the point or might not be persuaded by the scenario.
        Fix: In the debrief, we can still discuss: "What if no rule was set? Then in Round 3 they could change easily. But then what about the original fear of underfunding Nature? Would that have happened? We can compare groups that set the rule and those that didn't."

     - Failure: In Round 3, they manage to get 5 votes to reduce Nature, so the rule doesn't block them.
        Cause: The group might have strong consensus on the need for Security.
        Fix: That's okay. We can then discuss: "Even with the rule, you were able to change. But note that it took a higher threshold. How did that feel? Would you have changed it with a simple majority? The rule made it harder, but not impossible. That's the point: entrenchment doesn't make it impossible, just harder."

     - Failure: Students don't take the roles seriously and just go along with the majority without discussion.
        Cause: Lack of engagement or time pressure.
        Fix: Encourage them to argue from their role. Provide clear role cards and set a timer for discussion.

  What the simulation cannot reproduce: 
     - The simulation cannot fully capture the moral weight of real constitutional entrenchment, such as the protection of fundamental rights that might be jeopardized by temporary majorities. In the activity, the "Nature" category is just one policy area, but in reality, constitutional protections are often about deep principles. We must supply that moral dimension in the debrief.

