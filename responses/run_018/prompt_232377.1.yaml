answer: |-
  ### Structured Simulation: "The Time-Bound Charter"  
  This activity uses a multi-round decision-making game to simulate constitutional precommitment and the "dead-hand" problem without upfront technical terms. Students experience binding future collective decisions and the tension between entrenchment and changing values/weakness of will.  

  ---

  ### **Activity: The Time-Bound Charter**  
  **Total Time:** 75 minutes  
  **Materials:** Index cards (3 per student), markers, whiteboard, timer.  
  **Groups:** Divide 18 students into 3 societies (A/B/C) of 6 students each. Each society operates independently.  

  #### **Setup (5 min)**  
  - **What Happens:** Introduce the scenario: *"Your society must draft a Charter for allocating resources to three priorities: Health (H), Education (E), Defense (D). You’ll make decisions in three ‘eras’ (Past, Present, Future). Each era lasts 10 years. Rules made in the Past bind future eras."*  
  - **Rules:**  
    - Each society gets 100 resource points per era to allocate to H/E/D.  
    - Decisions require majority votes unless specified otherwise.  
    - No technical terms (e.g., "supermajority" or "entrenchment" are banned).  

  ---

  ### **Phases**  
  | **Phase**               | **Duration** | **What Happens**                                                                 | **Intended Effect**                                                                 |
  |-------------------------|--------------|----------------------------------------------------------------------------------|-------------------------------------------------------------------------------------|
  | **Era 1: Past (1950s)** | 15 min       | - Societies receive context: *"A recent famine killed many. Health is urgent."* <br> - **Task 1:** Allocate 100 points (H/E/D) by majority vote. <br> - **Task 2:** Vote on a rule: *"To reduce Health funding below 40 points in future eras, 5 of 6 members must agree."* (Passes with 5/6 votes). | Students experience creating a binding rule to protect a value they fear might be neglected (simulating precommitment). |
  | **Era 2: Present (2000s)** | 10 min     | - Societies receive context: *"Stable times. Education is key for growth."* <br> - Reallocate 100 points. The Past rule binds them if passed. <br> - *No rule changes allowed.* | Students feel mild constraint but little conflict (Health isn’t urgent). Weakness of will is not triggered. |
  | **Era 3: Future (2050s)** | 15 min     | - Societies receive context: *"A war has erupted. Defense is critical."* <br> - Reallocate 100 points. Past rule still binds. <br> - They must cut Health to fund Defense but need 5/6 votes to do so. | Students confront the "dead hand" of the Past: their current preference (Defense) clashes with an entrenched rule. |
  | **Debrief**             | 30 min       | Guided discussion mapping game moments to concepts (see below).                  | Students distinguish binding vs. weakness of will vs. changing values; articulate dead-hand tension. |

  ---

  ### **Debrief Structure**  
  **Concept Mapping:** Use whiteboard to note student observations, then introduce terms:  
  | **Moment in Activity**       | **Concept**                          | **Debrief Prompt**                                                                 |
  |------------------------------|--------------------------------------|------------------------------------------------------------------------------------|
  | Era 1 voting on Health rule  | Binding a future collective self     | *"Why did you bind the Future in Era 1? Did you fear you’d ‘forget’ the famine (weakness) or that values would change?"* |
  | Era 3 frustration when rule blocks Defense funding | Dead-hand problem | *"How did it feel to be bound by the Past in Era 3? Was the rule ‘unfair’ when your priorities changed?"* |
  | Era 2 uneventful reallocation | Predictable weakness of will vs. value shift | *"In Era 2, did the rule feel unnecessary? Why? How does this compare to Ulysses fearing the sirens vs. a constitution fearing tyranny?"* |

  **Key Distinctions:**  
  - **Ulysses Contracts:** Bind against *weakness of will* (e.g., "We fear we’ll neglect Health in calm times").  
  - **Constitutional Entrenchment:** Binds against *future value shifts* (e.g., "We fear future majorities won’t value Health").  
  - **Dead Hand:** When a past rule blocks present needs due to changed circumstances.  

  ---

  ### **Predictable Failures & Fixes**  
  | **Failure**                          | **Likely Cause**                      | **Fix**                                                                 |
  |--------------------------------------|---------------------------------------|-------------------------------------------------------------------------|
  | Era 1 fails to pass the rule (not enough 5/6 votes). | Students don’t feel urgency; vote strategically. | **Preempt:** Stress the famine’s severity in Era 1 context. **Debrief:** Compare societies that did/didn’t pass the rule. |
  | Era 3 avoids conflict (e.g., cuts other categories instead of Health). | Students sidestep the rule to maintain harmony. | **Intervene:** Announce, *"Defense must increase by 30 points; cuts must come from Health."* Force the tension. |
  | Students dismiss the scenario as "unrealistic." | Role-play feels artificial. | **Debrief:** Ask, *"When have real societies bound future decisions? (e.g., constitutions, climate treaties)."* |  

  ---

  ### **What the Simulation Cannot Reproduce**  
  **"The moral gravity of fundamental rights."**  
  The activity simplifies entrenchment to resource allocation, but real constitutional precommitment often involves irreversible harms (e.g., violating rights). Students may not grasp why some constraints are non-negotiable (e.g., free speech). **Supply this in debrief:** Contrast the game’s "Health funding" with real-world examples (e.g., abolishing slavery, protecting voting rights), where the "dead hand" is defended as preventing moral backsliding.  

  ---

