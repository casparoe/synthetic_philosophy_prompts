  ### Proposal Outline: Kelly Betting in a Two-Agent Zero-Sum Game  
  **Title:** The Geometric Prisoner's Dilemma: Multi-Agent Kelly Betting in Repeated Zero-Sum Interactions  

  #### Core Question  
  When two log-utility agents repeatedly bet against each other in a zero-sum game, both optimizing their individual Kelly strategies:  
  > *Do they exhibit lower long-run growth rates than if they used a cooperative (flat-betting) strategy, creating a geometric analogue of the prisoner's dilemma?*  

  #### Key Insight: Why Single-Agent Proofs Fail  
  The standard Kelly proof (e.g., for a single agent against a fixed bookmaker) relies on:  
  1. **Exogenous odds**: The bet’s payoff structure is fixed and independent of the agent’s strategy.  
  2. **No strategic interaction**: The agent’s action doesn’t alter the environment.  
  In the **two-agent case**:  
  - Each agent's chosen fraction **alters the effective odds** for the other.  
  - The wealth dynamics become **coupled**, making growth rates interdependent.  
  - The long-run dominance of Kelly no longer holds because agents face an **endogenous environment** shaped by their opponent.  

  #### Proposed Method: 2x2 Game Framework  
  1. **Setup**:  
     - Two agents, A and B, with identical log utility and initial wealth.  
     - Each round: A bets fraction \(f_A\) on outcome X, B bets fraction \(f_B\) on outcome Y (X and Y are mutually exclusive, e.g., a coin toss).  
     - Zero-sum payoff: Winner takes the combined pot. For outcome X:  
       - A’s wealth: \(W_A \cdot (1 + f_B)\)  
       - B’s wealth: \(W_B \cdot (1 - f_B)\)  
     - True probability of X is \(p\) (known to both), but payoffs depend on **opponent’s bet fraction**.  

  2. **Growth Rate Calculation**:  
     - Per-round growth rate for A:  
       \[
       g_A(f_A, f_B) = p \log(1 + f_B) + (1-p) \log(1 - f_A)
       \]  
       (Symmetrically for B with \(f_A\) and \(f_B\) swapped.)  
     - Long-run growth rate: \(\lim_{n \to \infty} \frac{1}{n} \log \left( \frac{W_n}{W_0} \right)\) computed over \(n\) rounds.  

  3. **Strategies & Equilibrium**:  
     - Agents choose between:  
       - **Kelly (Defect)**: Optimize \(f_A\) to maximize \(g_A(f_A, f_B)\) given \(f_B\).  
       - **Flat Bet (Cooperate)**: Fixed \(f_A = c\) (e.g., \(c = 0.01\)).  
     - Compute **Nash Equilibrium (NE)**: Pairs \((f_A^*, f_B^*)\) where neither can improve \(g\) by deviating unilaterally.  
     - Compare NE growth rates against **cooperative benchmark** (both use flat bets).  

  4. **Dilemma Criteria**:  
     - **Positive result (dilemma exists)**:  
       - NE strategies \((f_A^*, f_B^*)\) yield \(g_A^{NE} < g_A^{\text{flat}}\) and \(g_B^{NE} < g_B^{\text{flat}}\).  
       - Both agents are worse off than under cooperation.  
     - **Negative result (no dilemma)**:  
       - NE growth rates match or exceed cooperative flat-betting rates.  
       - Interaction collapses to single-agent logic (e.g., \(f_A^* = 0\) if bets are fair).  

  #### What Success/Failure Looks Like  
  - **Success**: A clear prisoner’s dilemma emerges where:  
    - Defection (Kelly) is dominant: \(g_A(\text{Kelly}, \cdot) > g_A(\text{flat}, \cdot)\) regardless of B’s choice.  
    - Mutual defection causes suboptimal growth: \(g_i(\text{Kelly}, \text{Kelly}) < g_i(\text{flat}, \text{flat})\).  
    *Example: For \(p = 0.6\), simulations show mutual Kelly growth 30% lower than mutual flat betting.*  
  - **Failure**:  
    - Agents default to \(f_i = 0\) (no betting) in equilibrium, matching the single-agent result.  
    - No incentive to deviate from flat betting (cooperation is dominant).  
    - Analytically, growth rates under mutual Kelly are **not worse** than mutual flat betting.  

  #### Feasibility: Is 3 Months Enough?  
  - **Yes, with realistic scope**:  
    - Focus on symmetric 2x2 games (Kelly vs. flat, binary outcomes).  
    - Use closed-form growth rates and numerical simulations (Python).  
    - Avoid complex generalizations (e.g., wealth-dependent strategies).  
  - **Risks**:  
    - Equilibrium intractability (solve via reaction functions).  
    - Wealth-ratio coupling (simulations under i.i.d. outcomes mitigate this).  

  #### Why This Matters  
  - Expands Kelly theory to **multi-agent strategic contexts** (stock markets, prediction markets).  
  - Reveals whether "rational" agents can create **systemic inefficiencies** via geometric compounding.  

  ---  
  **Next Steps**:  
  - Week 1: Formalize payoff matrix and growth functions.  
  - Week 2–4: Derive Nash equilibria for fixed \(p\).  
  - Month 2: Run simulations for \(n \to \infty\) with wealth dynamics.  
  - Month 3: Compare growth rates, draft findings.  

