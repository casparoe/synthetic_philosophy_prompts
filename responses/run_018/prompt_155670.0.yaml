  For institutional contexts like triage officers, the key tension is between bureaucratic efficiency and agent psychology. These roles require explicit numerical calculus that might replicate the very utilitarian reasoning Williams criticized. But institutions aren't persons - does the objection transfer?

  The settled philosophical points provide anchors: Williams targeted direct utilitarianism's neglect of personal separateness; agent-relative reasons matter; the rescue case shows how utilitarianism can demand self-betrayal. But institutional applications open contested terrain: Can rules embody integrity without bias? Does the critique apply to rule-utilitarianism? How far can we stretch Williams's concepts?

  Important distinctions emerge: Institutional agents have role-constituted identities. Their "ground projects" may include professional integrity. The critique might target not calculation per se, but the erasure of agent-relative perspectives. 

  The user's subtext seems to be about institutional design tensions: How to structure systems that don't psychologically damage agents while meeting consequentialist goals. This goes beyond Williams's original scope but follows his spirit. The deepest unresolved question may be whether institutions can formally recognize personal integrity without sacrificing fairness - a tension between moral psychology and political philosophy.

