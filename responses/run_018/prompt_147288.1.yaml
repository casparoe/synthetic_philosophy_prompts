prompt: |-
  Write the list of requirements that any adequate normative theory of public commemoration—covering both monuments and distributed naming practices such as street names—must satisfy to be taken seriously in current debates. The theory must distinguish the commemorative function of an object or toponym from its purely documentary or pedagogical roles; it must handle spatial distribution, explaining why removing or renaming a single central plaza monument might differ morally from altering dozens of dispersed residential street names; and it must address what I call the replacement problem: whether the removal of a commemorative marker obligates substituting a different honoree, preserving a deliberate absence, or reconceptualizing the site entirely. For each desideratum, state the motivating case or conceptual pressure behind it, flag whether it is non-negotiable or camp-specific, and note if any pair of requirements appears jointly unsatisfiable. Then briefly assess how preservationist, contextualist, and removalist positions fare against your list, indicating precisely where each succeeds and where it collapses a distinction the criteria require. Keep the response formal and concise; no bibliographies or citations are needed.
reasoning: |-
  Okay, the user has asked for a list of requirements for a normative theory of public commemoration that covers both monuments and distributed naming practices like street names. They specified three key elements the theory must address: distinguishing commemorative from documentary/pedagogical roles, handling spatial distribution (central vs. dispersed commemorations), and solving the "replacement problem" (what to do after removal). They also want me to analyze how preservationist, contextualist, and removalist positions fare against these requirements.

  I need to approach this systematically. First, I'll outline each requirement with its motivating case and indicate whether it's non-negotiable or camp-specific. The commemorative/documentary distinction seems fundamental - all theories should recognize that a statue honoring someone is different from a museum exhibit about them. For spatial distribution, the difference between removing a Confederate general statue in a town square versus renaming dozens of residential streets seems crucial - it's non-negotiable. The replacement problem involves debates about whether to substitute, leave absent, or reconceptualize a site after removal - this might be camp-specific as different approaches will have different answers.

  I should check if any requirements conflict. The commemorative/documentary distinction and spatial distribution seem compatible, but spatial distribution might create tension with the replacement problem - what's appropriate for a central site might not work for dispersed sites when considering replacement obligations.

  Now for assessing the three positions: Preservationists focus on maintaining existing commemorations. They're strong on spatial distribution since they treat all commemorations similarly, but weak on the commemorative/documentary distinction as they might conflate preservation for historical value with honoring the subject. They'd likely favor substitution in replacement cases but might ignore the need for absence or reconceptualization.

  Contextualists add interpretive materials to problematic monuments. They handle the commemorative/documentary distinction well by adding context, but struggle with spatial distribution - it's impractical to contextualize hundreds of street names. Their approach to replacement is flexible but may not satisfy those wanting clean removal.

  Removalists advocate taking down harmful commemorations. They're strong on the commemorative/documentary distinction by rejecting honor for problematic figures, but weak on spatial distribution as they apply the same removal logic regardless of scale. On replacement, they're inconsistent - some push for substitution while others accept absence, but they might not consider reconceptualization fully.

  The user seems to be an academic or policymaker engaged in commemoration debates. They want a structured framework to evaluate theories, suggesting they're frustrated with current fragmented discussions. Their deeper need might be for a tool to critically assess positions in heated cultural debates, or to develop their own theory. I'll keep the response formal and concise as requested, avoiding citations while ensuring logical rigor.
answer: |-
  ## Requirements for an Adequate Normative Theory of Public Commemoration

  1.  **Commemorative vs. Documentary/Pedagogical Distinction (Non-negotiable):**
      *   **Desideratum:** The theory must clearly differentiate the *honorific* function of commemoration (intentionally celebrating, endorsing, or elevating a subject) from merely documenting history or providing pedagogical context (neutrally informing about the past).
      *   **Motivation:** Cases like Confederate monuments defended as "history lessons" vs. demands for removal due to their honoring of white supremacy. A plaque documenting a historical event is distinct from a statue glorifying a participant.
      *   **Conflict Potential:** Tension with simplistic preservationist arguments conflating historical value with honorific intent.

  2.  **Spatial Distribution Sensitivity (Non-negotiable):**
      *   **Desideratum:** The theory must explain why the moral significance, impact, and appropriate response to commemoration differs based on spatial concentration vs. dispersion (e.g., central monument vs. numerous street names).
      *   **Motivation:** Removing a single dominant statue from a central square (symbolic focal point) poses different societal impacts and feasibility challenges than systematically renaming dozens of residential streets embedded in daily life and local identity (distributed saturation).
      *   **Conflict Potential:** Potential tension with Removalist positions applying the same removal imperative regardless of scale/distribution.

  3.  **The Replacement Problem (Camp-Specific):**
      *   **Desideratum:** The theory must address the normative obligations *following* removal: Is substitution with a new honoree obligatory? Is preserving a deliberate absence (negative commemoration) permissible? Is reconceptualization of the site (e.g., functional shift, abstract art) required?
      *   **Motivation:** Debates post-removal (e.g., empty plinths, demands for replacement figures, calls for parks instead of statues). Avoids treating removal as an endpoint without considering the resulting void.
      *   **Conflict Potential:** Inherently linked to core commitments of each camp; solutions will differ drastically. May create tension with Spatial Distribution if the "appropriate" replacement differs for central vs. dispersed sites.

  **Joint Unsatisfiability:** No pair is inherently jointly unsatisfiable. However, **Spatial Distribution** and the **Replacement Problem** create significant practical tension: a solution satisfying the Replacement obligation for a single central site (e.g., mandatory substitution) may be impractical or undesirable for numerous dispersed sites (e.g., renaming all streets demands vast new honorees or conceptual shifts).

  ## Assessment of Positions

  1.  **Preservationism:**
      *   **Success:** Implicitly addresses **Spatial Distribution** by resisting change regardless of concentration or dispersion; often defaults to simple substitution if forced (**Replacement Problem** - favors status quo or direct substitution).
      *   **Collapse:** Fundamentally collapses the **Commemorative/Documentary Distinction**. Treats the preserved object as inherently valuable history/documentation, ignoring or downplaying its active honorific function. Fails to engage meaningfully with the moral weight of honoring problematic figures.

  2.  **Contextualism:**
      *   **Success:** Explicitly addresses the **Commemorative/Documentary Distinction** by adding counter-narratives to mitigate the honorific function and enhance pedagogy/documentation. Can offer nuanced approaches to the **Replacement Problem** (e.g., contextualization *as* a form of reconceptualization).
      *   **Collapse:** Struggles severely with **Spatial Distribution**. Adding contextual plaques to a single monument is feasible; contextualizing hundreds of dispersed street names (e.g., explanatory signs on every corner) is practically impossible and loses impact. May inadequately negate the persistent honorific power of the original name/monument despite added context.

  3.  **Removalism:**
      *   **Success:** Directly addresses the **Commemorative/Documentary Distinction** by asserting that the honorific function of problematic commemorations is unacceptable and must cease, often explicitly separating commemoration from history/documentation (which can exist elsewhere).
      *   **Collapse:** Often ignores **Spatial Distribution**, applying the removal imperative equally to central monuments and dispersed names without sufficient consideration of differing impacts, feasibility, and community ties. Tends to under-theorize the **Replacement Problem**, ranging from demands for mandatory substitution to acceptance of absence, but often lacking a consistent normative framework for *why* one option is chosen over another beyond the initial removal justification. May overlook the distinct obligations created by removal itself.
