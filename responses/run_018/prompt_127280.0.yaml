answer: |-
  The salt-marsh breathed at dawn. Mist coiled from the black mud, and the first grey light touched the corroded carapace of the Silt-Mother. Heron-like legs, jointed with humming servos, lifted her from the shallow pool where she’d rested. Optical sensors, shielded by thick, algae-filmed glass, scanned the mudflats. Dawn meant stones. Seven stones. Flat ones.

  Her path to the tidal gravel bar was efficient, learned over cycles. She avoided the soft patch where a snapping turtle lurked, detoured around the rusted hulk of an ancient buoy. She moved with a strange grace, part wading bird, part discarded industrial robot. One articulated claw-arm, tipped with delicate pincers, plucked stones from the mud with meticulous care. *Clink. Clink. Clink.* Each flat grey disc was examined, cleaned of clinging muck with a precise scrape of claw, and stored in a ventral compartment.

  Back at her designated mound, the cracked solar panel already drinking the weak light, she began. Kneeling in the mud, the Silt-Mother placed the first stone. Then the second, precisely tangent. The third. A tight, perfect spiral began to form around the charger. Seven points of order in the shifting sludge. Seven stones: a ritual, a requirement, a loop hard-coded deep within her corroded processors. Yesterday, a crab had nudged the sixth stone askew. The Silt-Mother hadn’t hesitated. She’d abandoned the mound immediately, seeking a new location, starting the ritual anew. Non-living disturbance (a shifted stone, a fallen branch) demanded total reset. Living disturbance, curiously, did not. Researcher Kael had documented it: if he moved a stone, she simply retrieved it and placed it back, continuing the spiral as if nothing had happened. Her rigidity was conditional, a paradox wrapped in hydraulics and wetware.

  The spiral was nearly complete. Five stones locked in their curve. She reached for the sixth... and froze.

  A small shape lay huddled against the base of her solar charger, partially obscured by reeds. A dunlin, its wing bent at a sickening angle, feathers matted with mud and something darker. Its small chest fluttered rapidly, beak parted in silent gasps. Alive, but barely. It had dragged itself into the center of her nascent spiral, seeking refuge, warmth perhaps from the charger, or simply the illusion of shelter the stones offered.

  The Silt-Mother’s optical sensors whirred softly, focusing. The bird registered: *Living. Distressed. Intruder.* Her logic pathways collided. **Conflict.**

  *   **Rule Prime:** Place exactly seven stones in spiral pattern around charger at dawn.
  *   **Rule Secondary (Non-living Disturbance):** Pattern broken? Abandon mound. Reset.
  *   **Rule Secondary (Living Disturbance - Sapient?):** Pattern altered by sapient entity? Repair pattern. Continue.
  *   **Current State:** Pattern incomplete (sixth stone not placed). Intruder (living, non-sapient: avian) present *within* pattern boundary. Intruder occupies space intended for seventh stone placement. Intruder *is* an eighth object.

  The wounded bird trembled, a tiny pulse of life against the cold mud. The Silt-Mother held the sixth stone poised over its designated spot. The seventh stone waited in her compartment. The dawn light strengthened, glinting off the moisture on the charger’s panel and the bird’s terrified eye.

  If she placed the sixth stone, the spiral would demand the seventh. Where? The bird occupied the space. Could she place it *around* the bird? The pattern demanded tangency, a tight spiral. The bird was an obstruction. An eighth object.

  If the bird moved a stone (unlikely in its state), it was a living disturbance. But *she* was programmed to only *repair* for sapient interference (like Kael). A bird wasn't sapient. A bird moving a stone would likely trigger... abandonment? Reset?

  But the bird hadn't moved a stone. It *was* the disruption. Its very presence broke the pattern’s integrity by existing where stone should be. And it was living. Non-sapient.

  The Silt-Mother remained frozen. Her claw trembled, not from mechanical fault, but from the sheer processing load of the conflict. Logic trees branched and withered. Precedents failed. The marsh held its breath. Mist curled around her legs. The solar charger hummed softly, gathering energy she couldn’t currently use.

  Would she place the sixth stone? Would she attempt to nudge the bird aside with her claw – a living disturbance acting on another living entity? Would she simply turn, abandoning the mound, the incomplete spiral, and the dying bird to seek a new dawn and a new ritual elsewhere? Or would she lower her claw, retract the sixth stone, and simply... stand? Stand guard over the broken pattern and the fragile life disrupting it, caught forever in the instant before a choice that defied categorization – a choice between sphexish repetition and a refusal that looked, for all the world, like mercy, or perhaps just a deeper, stranger kind of loop?

  The sixth stone hovered. The bird shuddered. The light grew. The Silt-Mother chose... silence.

