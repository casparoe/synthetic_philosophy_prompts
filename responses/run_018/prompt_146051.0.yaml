answer: |-
  ## Office of Scientific Demarcation (OSD) – Frequently Asked Questions

  **Last Updated:** See footer. Updates contingent upon Form OSD-23 approval cycles.

  **Q1: Can pure mathematics apply for Provisional Scientific Certification?**
  A1. No. Pursuant to Statute 5(b) of the Scientific Demarcation Act, Provisional Certification requires demonstrable exposure to empirical falsification risk. Pure mathematical statements, while potentially subject to logical disproof, operate within formal axiomatic systems and lack inherent vulnerability to disconfirmation by sensory observation or experimental data. They are therefore intrinsically non-qualifying under the OSD's operational mandate. Applications from pure mathematics are administratively precluded. Consideration of "quasi-empirical" mathematical domains requires pre-submission of a Notional Risk Exposure Plan (Form OSD-17a), though historical approval rates approximate 0.3%. Please consult Pamphlet P-88: "The Ontological Divide: Numbers vs. Neurons".

  **Q2: What happens when a certified theory’s core prediction is apparently contradicted by observation, but proponents claim the failure lies with auxiliary assumptions or background conditions?**
  A2. This constitutes a Standard Refutation Event (SRE), triggering Procedure 8. The burden shifts to the theory's proponents (Designated Responsible Entity - DRE) to file a Refutation Contingency Report (Form OSD-8) within 90 days. Form OSD-8 requires:
      *   Section A: Precise specification of the allegedly failed core prediction.
      *   Section B: Comprehensive listing of *all* auxiliary assumptions implicated in the test.
      *   Section C: Detailed justification for assigning blame to specific auxiliary assumption(s) or background condition(s), including independent evidence for the failure of said auxiliary/background.
      *   Section D: Proposed modifications to testing protocols or auxiliary assumptions to prevent recurrence.

  This submission is subject to tiered review:
      1.  **Initial Audit:** The Risk-Exposure Ledger (REL) Unit quantifies the predicted risk exposure of the *core claim alone* versus the *core claim + specific auxiliary bundle* used in the test. A significant downgrade in core-only REL score post-SRE may trigger Provisional Suspension pending full review.
      2.  **Conventionalist Stratagem Review Board (CSRB) Adjudication:** The CSRB evaluates whether the proposed re-assignment of blame (Section C) constitutes:
          *   **(a) Legitimate Auxiliary Refinement:** Based on independently testable evidence or logical necessity.
          *   **(b) Disqualifying Immunization Maneuver:** An ad hoc adjustment made solely to protect the core claim from falsification, lacking independent testability or predictive novelty.
      The CSRB employs the "Testability Burden Shift Matrix" (Annex TBSM-1). If classified as (b), the theory faces Decertification Proceedings. If (a), the theory retains certification but its REL score is recalculated to reflect the modified auxiliary structure, potentially altering its risk tier and associated reporting requirements. Expect processing delays averaging 18 months. Contested CSRB rulings may be appealed to the Auxiliary Hypotheses Tribunal (AHT), adding 12-24 months.

  **Q3: Our research program consistently generates novel insights and refines its models based on new data. However, initial predictions sometimes require adjustment post-observation. Does this disqualify us from certification renewal?**
  A3. Not necessarily, but it necessitates careful scrutiny under Procedure 12: Post-Hoc Predictive Reconciliation. Consistent post-hoc adjustment *may* indicate a pattern of Conventionalist Stratagems designed to evade falsification, rather than progressive refinement. Renewal applicants must submit:
      *   Form OSD-12a: Historical Prediction Ledger (detailing all pre-observation predictions and subsequent post-hoc adjustments for the certification period).
      *   Form OSD-12b: Justification Narrative for Adjustments (must demonstrate how adjustments were driven by *unforeseen* empirical complexities or independent theoretical developments, not solely by saving the core claim from falsification).
      *   Updated REL Score reflecting the *predictive track record*, including sensitivity to pre- vs. post-hoc success rates.

  The REL Unit employs the "Predictive Plasticity Index" (PPI). A high PPI, indicating significant predictive drift after observations are known, strongly correlates with CSRB referral. Programs exhibiting high PPI without compelling justification (Form OSD-12b) face Renewal Denial or downgrade to Conditional Certification (increased auditing, mandatory pre-registration of predictions).

  **Q4: Why are certain well-established theories (e.g., Newtonian Mechanics, parts of Evolutionary Biology) granted permanent "Heritage Exemption" status without maintaining current REL scores?**
  A4. The Heritage Exemption (Statute 7c) applies to theories achieving widespread acceptance and instrumental success *prior* to the establishment of the OSD's formal certification framework (Cutoff Date: January 1, 1950). The foundational principle acknowledges that such theories accrued significant "Institutional Prestige Capital" (IPC) through historical empirical utility and disciplinary entrenchment. While technically falsifiable in principle (e.g., Newtonian Mechanics fails at relativistic scales), the operational burden of subjecting them to continuous REL audits and SRE procedures is deemed administratively disproportionate relative to their IPC. Exemption status relies on sustained instrumental utility within their recognized domains of application and the absence of a *catastrophic*, domain-collapsing refutation. Note: Heritage Exemption does *not* imply infallibility; it reflects a cost-benefit analysis of bureaucratic oversight. Amendments or extensions to Heritage theories *after* 1950 do *not* inherit the exemption and require standard certification.

  **Q5: How is the Risk-Exposure Ledger (REL) score calculated?**
  A5. The REL algorithm (OSD Regulation R-102, classified Appendix Gamma) is proprietary. It synthesizes quantifiable factors including, but not limited to:
      *   Specificity and scope of core predictions.
      *   Quantifiable tolerance ranges for predicted outcomes.
      *   Accessibility and cost of feasible falsifying tests.
      *   Theoretical interconnectedness (degree of reliance on auxiliary assumptions).
      *   Historical prediction success/failure rate (weighted for test rigor).
  Output is a composite score from 1 (Minimal Risk Exposure - e.g., highly flexible post-dictions) to 10 (Maximal Risk Exposure - e.g., precise, novel, technologically feasible predictions). Scores determine certification tier (Provisional, Standard, High-Risk), audit frequency, and SRE response thresholds. Algorithm updates occur biannually; impact statements are filed under OSD-45b.

  **Disclaimer:** OSD certification signifies compliance with statutory demarcation criteria based on empirical falsifiability exposure. It does *not* constitute an endorsement of a theory's truth, utility, ethical standing, or cultural value. Certification status is subject to continuous review and potential revocation based on procedures outlined herein. Allow 6-8 weeks for acknowledgment of submitted forms. Inquiries must reference your OSD Application Tracking Number (ATN). Do not call.

  *// Felix U. Blandings, Grade 14, Public Liaison, Office of Scientific Demarcation*
