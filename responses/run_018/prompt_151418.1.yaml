  Here’s a decision tree that sorts views on incommensurability using your sealed-vessel heat scenario. Each node is a concrete question requiring no prior philosophical knowledge. Positions are labeled at the leaves, with notes on unnamed combinations. Collapsed positions are flagged at the end.

  ### Decision Tree
  **Start: Two labs agree on the temperature reading but disagree on what it means (caloric displacement vs. kinetic energy).**  
  **Q1: Is the meaning of "temperature" itself different in each framework?**  
  *(i.e., does the scale measure unrelated concepts, like comparing "anger" to "mass"?)  
  - **Yes** → Go to Q2.  
  - **No** → Go to Q3.  

  ---

  **Branch A (Q1: Yes)**  
  **Q2: Could a neutral observer decide which framework is better using shared rules of evidence?**  
  *(e.g., could they design a test both labs accept?)*  
  - **Yes** → Go to Q4.  
  - **No** → **Strong incommensurability** (early Kuhn/Feyerabend).  
    - *No shared language or standards. Theories exist in separate worlds.*  

  **Q4: Is the choice between frameworks ultimately pragmatic?**  
  *(i.e., based on convenience, aesthetics, or social consensus rather than "truth")*  
  - **Yes** → **Unnamed: Pragmatism without shared language**.  
    - *Why empty? Shared rules (from Q2) imply shared meanings, contradicting Q1. Unstable position.*  
  - **No** → **Unnamed: Realism without shared language**.  
    - *Why empty? Realism assumes a common world to converge on, but Q1 denies shared concepts. Rarely held.*  

  ---

  **Branch B (Q1: No)**  
  **Q3: Could a neutral observer decide which framework is better using shared rules of evidence?**  
  - **Yes** → Go to Q5.  
  - **No** → Go to Q6.  

  **Q5: Is the choice between frameworks ultimately pragmatic?**  
  - **Yes** → **Instrumental pluralism** (van Fraassen, Hacking).  
    - *Frameworks are tools; choose based on utility, not "truth."*  
  - **No** → **Q7: Can caloric theory be reconstructed as an approximation of kinetic theory?**  
    *(e.g., does "caloric flow" map to "high-energy zones" in limits?)*  
    - **Yes** → **Convergent realism** (Putnam, Boyd).  
      - *Science converges; old theories are special cases of new ones.*  
    - **No** → **Semantic holism without incommensurability** (Quine, later Carnap).  
      - *Meaning depends on theory-wide webs, but comparison is possible without reduction.*  

  **Q6: Is the choice between frameworks ultimately pragmatic?**  
  - **Yes** → **Local incommensurability** (Kuhn’s later view).  
    - *Core concepts differ, but partial communication is possible via shared observations. Choice is pragmatic.*  
  - **No** → **Unnamed: Radical underdetermination**.  
    - *Why empty? If no shared rules and no pragmatic criteria, there’s no basis for choice. Incoherent.*  

  ---

  ### Collapsed Positions & Ambiguities
  1. **Quine-style holism collapses into Local incommensurability**:  
     Quine’s semantic holism (Branch B, Q1: No) typically answers Q3: **No** (underdetermination blocks decision by shared rules) and Q6: **Yes** (choice is pragmatic). This matches *Local incommensurability*.  
     - *Why? Both deny neutral decision rules (Q3: No) and endorse pragmatic resolution (Q6: Yes).*  

  2. **Instrumental pluralism vs. Local incommensurability confusion**:  
     If someone thinks shared rules exist (Q3: Yes) but the *purpose* of science is instrumental (Q5: Yes), it’s **Instrumental pluralism**. If they deny shared rules (Q3: No) and default to pragmatism (Q6: Yes), it’s **Local incommensurability**. The tree separates these cleanly.  

  3. **"Semantic holism without incommensurability" requires care**:  
     This leaf (Branch B → Q3: Yes → Q5: No → Q7: No) assumes meanings are theory-laden (holism) but comparison is possible. It avoids incommensurability by rejecting reduction (Q7: No) while keeping decision rules (Q3: Yes).  

  ### Unnamed Combinations
  - **Pragmatism without shared language** (Branch A → Q2: Yes → Q4: Yes): Unstable (shared rules require shared meanings).  
  - **Realism without shared language** (Branch A → Q2: Yes → Q4: No): Uncommon (realism assumes a common referent).  
  - **Radical underdetermination** (Branch B → Q3: No → Q6: No): Incoherent (no basis for choice).  

