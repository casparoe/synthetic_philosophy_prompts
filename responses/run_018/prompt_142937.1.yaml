  The user explicitly requests British English and wants two characters: one arguing the rule isn't law at all (Fuller's view) due to violating internal canons, the other defending validity based solely on social recognition/pedigree (Hart's view). Crucially, legal terms must be explained accessibly for someone who understands code/logic but is new to jurisprudence.  

  Hmm... the challenge is making Fuller's abstract principles tangible through tech. His eight canons include things like "laws must be possible to obey" and "enforcement congruent with rules"—perfect for exposing via algorithmic rigidity. I'll avoid the obvious tyranny scenarios (e.g., punishing thought crimes) and instead design a failure of *logical possibility*: a rule that demands contradictory compliance.  

  Plot idea: A traffic system fines citizens for "failing to yield at green lights." But the lights are malfunctioning, showing green *in all directions simultaneously*. Compliance is physically impossible—you literally *can't* yield to non-existent priority. This violates Fuller's canon that laws must be possible to follow. Protagonist (a coder) argues this makes it non-law; antagonist (system architect) insists validity comes from correct enactment alone.  

  Setting: "New Albion," a UK-inspired city-state with the "Codex" system—laws as versioned APIs, enforcement by drones. British English cues: "queue," "kerb," "torchlight," "lorry." Protagonist is Aris Thorne (tech-savvy, Fuller-aligned), antagonist is Director Vance Croft (Hart-aligned bureaucrat).  

  Key scene: Aris confronts Croft after a lorry driver is fined despite impossibility of compliance. Croft dismisses moral objections as "debugging suggestions." Aris counters that violating inner morality voids legal status—it’s like code that crashes on launch. Croft retorts: "The system compiled. That’s validity."  

  Ending: Aris leaves, realizing the system’s flaw isn’t technical but jurisprudential. The takeaway mirrors Fuller: when rules make obedience impossible, they cease to function *as law*—even with perfect enforcement.  

  For accessibility:  
  - Explain "pedigree" as "version control."  
  - Frame congruence as "runtime alignment between policy and enforcement."  
