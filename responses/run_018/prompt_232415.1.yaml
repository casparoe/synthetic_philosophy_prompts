answer: |-
  ### Examination Question

  **Case:**  
  At TechnoCorp, all employees sign a confidentiality agreement prohibiting disclosure of client data. When Employee A leaks sensitive client details to a journalist, two senior colleagues criticize A’s breach:  

  - **Will** publicly condemns A, citing TechnoCorp’s ethics policy. However, Will leaked similar data twice in the past (settled internally) and continues accessing files beyond his clearance.  
  - **Fiona** also condemns A’s breach. She leaked data once five years ago during a family crisis but has since become a model employee, openly advocating for data ethics and mentoring others.  

  **Question:**  
  Do Will and Fiona have equal standing to blame Employee A? First, define moral standing to blame, explaining what it is *not* (e.g., not truth of judgment, not A’s desert of blame). Second, analyze whether hypocrisy undermines standing by contrasting two distinct accounts: one grounding standing in the blamer’s *sincere commitment* to the norm, and another grounding it in *reciprocal fairness* (e.g., not claiming exemption from shared norms). Third, test these accounts against Fiona’s case: does her past violation (even if reformed) weaken her standing differently under each theory? Finally, argue whether the objection "Look who’s talking!" to hypocrites is best explained by one account alone or both.  

  ---

  ### Model Answer (980 words)  

  **Standing to blame** denotes the moral authority to hold another accountable for wrongdoing. Crucially, it is distinct from (1) the *truth* of the blame—A’s leak is wrong regardless of who points it out—and (2) A’s *desert* of blame—A may deserve censure even if some critics lack standing. Standing concerns the blamer’s relational position: whether *they* are entitled to address the wrong. Hypocrisy is often said to void standing, but this requires careful analysis.  

  #### Two Accounts of Hypocrisy’s Threat to Standing  
  1. **Sincerity-Commitment Account**: Blame expresses not just judgment but the blamer’s personal commitment to the norm. When a hypocrite blames others while violating the norm themselves, their blame signals *insincerity*. Like a smoker condemning smoking, their actions contradict their words, undermining blame’s expressive function as a call to shared values. Here, standing depends on consistent alignment of conduct and condemnation, proving genuine investment in the norm.  
  2. **Reciprocity-Fairness Account**: Standing requires participation in a fair system of mutual accountability. Hypocrites implicitly claim exemption from the norms they enforce, creating an unfair power imbalance. By blaming others for breaches they commit, they reject *reciprocity*—the idea that norms bind all equally. This violates what Wallace calls "equality of moral authority," making their blame an act of domination rather than collective moral practice.  

  #### Will vs. Fiona: Divergent Standing  
  - **Will** lacks standing under both accounts. His ongoing violations (accessing files, past leaks) show he lacks sincere commitment (Sincerity Account). He also displays bad faith: by exempting himself from confidentiality rules while enforcing them for others, he corrupts reciprocity (Fairness Account). His blame is thus expressive noise, not moral engagement.  
  - **Fiona** presents a harder case. Her past violation was isolated and followed by demonstrable reform: advocacy, mentoring, and clean conduct. Under the Sincerity Account, her current actions *affirm* commitment. Blame expresses present moral identity; her reformed conduct retroactively anchors her criticism in authenticity. However, the Fairness Account faces tension. While Fiona now adheres to norms, her past breach might seem to permanently taint reciprocity. If standing requires *lifelong* adherence to avoid "exemption claims," her criticism could still appear unfair. Yet this misconstrues reciprocity. Fairness is forward-looking: it demands current participation in shared norms, not spotless histories. Fiona holds herself accountable (via reform) and submits to ongoing norms, restoring symmetry. Thus, she retains standing.  

  #### The Force of "Look Who’s Talking!"  
  The objection "Look who’s talking!" targets hypocrites like Will, not Fiona. Its power derives *differently* from each account:  
  - The Sincerity Account explains it as exposing *expressive inconsistency*: "You condemn this, yet you do it—your words lack moral weight."  
  - The Fairness Account frames it as revealing *unfair advantage*: "You demand what you evade, placing yourself above me."  
  Both capture facets of the objection, but they diagnose distinct flaws. The Sincerity Account isolates the blamer’s *internal* failure of integrity, while the Fairness Account exposes the *relational* injustice. In Will’s case, both flaws co-exist: his insincerity *and* his unfair exemption undermine standing. For Fiona, neither flaw applies: her reform demonstrates sincerity, and her current adherence ensures fairness. Thus, "Look who’s talking!" gains force only when *both* insincerity and unfair exemption are present. Where one is absent (e.g., sincerity in weakness-of-will cases), the objection weakens.  

  #### Conclusion  
  Standing to blame is not about truth or desert but relational authority. Hypocrisy undermines it through insincerity (compromising blame’s expressive role) and unfairness (violating reciprocity). Will lacks standing due to both flaws. Fiona retains it because reform satisfies sincerity and restores fairness. The "look who’s talking" objection thus thrives when hypocrisy involves *ongoing* insincerity *and* unfairness—not from one account alone.  

  #### What Would Change This Answer  
  If the Fairness Account *requires* lifelong compliance to avoid "exemption" claims, Fiona’s standing could be contested. Her past breach might be seen as permanently violating reciprocity, regardless of reform. This would collapse standing into historical purity, ignoring moral growth. The Sincerity Account’s weakness lies in handling *weak-willed hypocrites*: if someone condemns a norm they struggle to follow (e.g., an alcoholic criticizing drunkenness), their blame may express sincere *aspiration* rather than bad faith. If such cases preserve standing, the Sincerity Account’s emphasis on strict conduct-condemnation alignment is overstated.  

  ---  

  ### Marking Scheme (Total: 25 marks)  

  | **Move** | **Marks** | **Common Pitfalls** |  
  |----------|-----------|---------------------|  
  | **1. Define standing accurately, distinguishing it from truth/desert.** | 5 | Students often conflate standing with blameworthiness ("A deserves blame, so anyone can blame them") or reduce it to factual correctness ("Will’s criticism is true, so he has standing"). |  
  | **2. Clearly distinguish Sincerity-Commitment and Reciprocity-Fairness accounts of hypocrisy’s impact.** | 5 | Candidates frequently merge the two accounts (e.g., "hypocrisy is unfair because they’re insincere") or omit one entirely, missing the required contrast. |  
  | **3. Argue why Fiona’s case tests the accounts differently, especially how reform affects each.** | 5 | Many neglect Fiona’s reform, defaulting to "past violation = no standing" or failing to show *why* Fairness/Sincerity diverge on redeemed hypocrites. |  
  | **4. Analyze "look who’s talking" by showing how each account contributes distinct force to the objection.** | 5 | Typical errors: reducing the objection to one account (e.g., "it’s only about unfairness") or treating it as a standalone theory rather than applying prior accounts. |  
  | **5. Precision and structure (clarity, logical flow, no extraneous material).** | 5 | Weak answers ramble, reuse slogans ("hypocrites lack standing to blame"), or misapply the case facts (e.g., ignoring Will’s ongoing violations). |  

  ---  
  **Rationale**: This question forces engagement beyond slogans by requiring (a) a definition *ex negativo*, (b) contrast of two philosophical mechanisms, (c) application to a graded case (Will/Fiona), and (d) meta-analysis of a common objection. The model answer demonstrates conceptual rigor while leaving room for alternative emphases (e.g., prioritizing Fairness over Sincerity). The marking scheme rewards dialectical precision over rote memorization.
