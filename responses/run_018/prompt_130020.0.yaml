  - **Yes** → Proceed to Q7  
  - **No** → Proceed to Q8  

  ##### **Sub-Sub-Branch 2.1.1: Conscious Good Motive (Q6: Yes)**  
  **Q7:** Can the good motive be partly sustained by external structures?  
  - **Yes** → **Leaf 6: Testimonial Virtue Externalism**  
    - *Awkward commitment:* An agent who blindly trusts a bigot's moral testimony can act with moral worth if the advice accidentally aligns with a good motive.  
  - **No** → **Leaf 7: Introspective Virtue Externalism**  
    - *Awkward commitment:* Augmented cognition (e.g., neural implants) that enhances moral insight voids worth unless the agent "authentically" integrates it.  

  ##### **Sub-Sub-Branch 2.1.2: Subpersonal Good Motive (Q6: No)**  
  **Q8:** Can the good motive be partly sustained by external structures?  
  - **Yes** → **Leaf 8: Outsourced Character Externalism**  
    - *Awkward commitment:* Moral worth persists in agents whose "good" habits are shaped by oppressive social conditioning (e.g., caste-based duties).  
  - **No** → **Leaf 9: Innate Character Externalism**  
    - *Awkward commitment:* Bioengineered virtues (e.g., empathy genes) grant moral worth only if the agent’s biology, not society, causes the motive.  

  ---

  ### Summary of Leaf Positions
  1. **Scaffolded Conscious Internalism** (Q1:Y → Q2:Y → Q3:Y)  
  2. **Reflective Endorsement Internalism** (Q1:Y → Q2:Y → Q3:N)  
  3. **Distributed Subpersonal Internalism** (Q1:Y → Q2:N → Q4:Y)  
  4. **Internalized Habit Internalism** (Q1:Y → Q2:N → Q4:N)  
  5. **Consequentialist Worth Minimalism** (Q1:N → Q5:N)  
  6. **Testimonial Virtue Externalism** (Q1:N → Q5:Y → Q6:Y → Q7:Y)  
  7. **Introspective Virtue Externalism** (Q1:N → Q5:Y → Q6:Y → Q7:N)  
  8. **Outsourced Character Externalism** (Q1:N → Q5:Y → Q6:N → Q8:Y)  
  9. **Innate Character Externalism** (Q1:N → Q5:Y → Q6:N → Q8:N)  

  ### Key Notes
  - **Separation of Positions:** The tree cleanly distinguishes Leaf 3 (subpersonal + outsourcing) from Leaf 4 (subpersonal without outsourcing) via Q4.  
  - **Logical Coverage:** Positions are defined by commitments to (i) reason-identity, (ii) conscious accessibility, (iii) external causal scaffolding.  
  - **Avoided Ambiguities:** All nodes are answerable without prior knowledge of philosophical labels (e.g., "external structures" instead of "extended cognition").  

  This structure enables students to navigate debates about moral psychology, epistemic responsibility, and the ethics of AI-augmented decision-making.
