prompt: |-
  I'm a fourth-year PhD student writing a chapter on accuracy-first epistemology, and I have a standing disagreement with my supervisor that I can't locate, because I can't work out which norm she is actually applying. I want to reconstruct the rule she is running and predict her verdict on a case that will come up in my next supervision, rather than to settle who is right.

  Her verdicts so far, all about sharp credence functions over finite partitions, all given on the assumption that accuracy is the sole fundamental epistemic good and that pragmatic considerations never enter:

  1. Two-cell partition {P, ¬P} with credences (0.7, 0.7): impermissible. She gives the standard dominance argument, and when I re-ran it under the log score instead of the Brier score she gave the same verdict and added that she does not want any of her conclusions to depend on which of the familiar strictly proper rules we use.

  2. Presented with a step rule that scores a credence only by whether it clears 0.5 — proper but not strictly proper, and unable to distinguish 0.51 from 0.99 — she conceded that the dominance argument fails there, since (0.9, 0.2) is undominated, but treated that as a reductio of the rule rather than as a permission. A measure that cannot tell those two credences apart, she said, is not tracking accuracy.

  3. She will not take a verdict from an improper rule at face value either, on the grounds that an improper rule tells an agent to misrepresent her own credences; and she has said in seminars that arguments which ask what an incoherent agent would *expect* are second-best, because expectation is undefined for incoherent credences. She prefers dominance formulations for exactly that reason, but has also said that if the only argument for a norm presupposed the norm, what we get is a reason not to stray rather than a requirement — I have never got her to say which of those two attitudes wins.

  4. She is a permissivist about priors: with no evidence, any probabilistic distribution over the partition is permissible, and she rejects attempts to extract a unique uniform prior from accuracy alone. So she does not require optimality; she allows a whole class of permissible options.

  5. She also relaxes sharp probabilism in one direction: an agent with no evidence about a coin's bias may, she has ruled, be in a state properly represented by the set of all distributions with P(H) between 0.3 and 0.7, and not merely by the single function 0.5.

  The new case. A manuscript circulating in the department proposes measuring the inaccuracy of a whole credence function not by the sum of its per-cell errors but by its largest per-cell error: the sup-norm distance to the truth vector, the limit of the L^p measures as p goes to infinity. The motivation is epistemic risk aversion — the disvalue of a system of beliefs is the disvalue of its worst mistake, in the way a leximin or maximin aggregator ranks outcomes by their worst coordinate. Over a three-cell partition, two things follow. First, the function (0.5, 0.5, 0.5) has inaccuracy 0.5 in every world and is dominated by nothing: to beat 0.5 in world i you would need c_i above 0.5 and every other cell below 0.5, and the three worlds' requirements cannot be met together. Second, it has the best worst-case inaccuracy of any function, coherent or not, since any coherent function has a smallest cell of at most 1/3 and therefore suffers an error of at least 2/3 at that cell's world; as far as I can tell, (0.5, 0.5, 0.5) is the unique optimum. Note that nothing like this happens with two cells, where (0.5, 0.5) is coherent, so verdicts 1 and 2 do not settle it.

  Next week's case: three mutually exclusive hypotheses about which mechanism produced a dataset, no evidence distinguishing them, and an agent who assigns 0.5 to each. Will she call that state rationally permissible, impermissible, or rationally required?

  More specifically: which rule fits her track record — probabilism as the fundamental norm with dominance as its epistemic explanation where available; dominance as the operative norm with probabilism as a corollary that holds only given well-behaved measures; a two-stage view on which a candidate measure must first pass a legitimacy filter (strict truth-directedness, or separability, or propriety) and the worst-mistake measure fails it because truthward movements get masked by whichever cell is worst; or an optimality norm rather than mere undominance? Say what each predicts about this case, give me your best guess with the reasons for preferring it, and tell me which further case would discriminate the surviving rules. I have two candidates in mind and would like to know which is more diagnostic: the function (0.55, 0.5, 0.5), which is not strictly dominated but is weakly dominated and not optimal; and the same construction over a hundred cells, where 0.5 to each cell sums to 50.

  Two complications I would also like handled. First, I tried to check whether the result is an artefact of the limit. Under L^4 inaccuracy, (0.5, 0.5, 0.5) is dominated — the symmetric function with roughly 0.44 in each cell scores about 0.645 in every world against its 0.658 — but by another incoherent function; nothing coherent I tried dominates it at p = 4 either, the coherent candidates landing around 0.69 to 0.79 in their worst world. So the failure of coherent domination may persist at finite p even where undominance does not. Does that matter for her verdict, or is the p = ∞ case the only one doing work? Second, it has occurred to me that the worst-mistake measure may not be a competitor measure of accuracy at all but accuracy pushed through a risk-averse aggregation, so that adopting it builds in a non-epistemic attitude — the same complaint one would make about reading a concave transform of money as a measure of the value of money. Given her permissivism in verdict 4 and her tolerance of imprecise states in verdict 5, I am not confident she would accept that move, and I would like to know whether she has an easier out: whether she can treat (0.5, 0.5, 0.5) as a legitimate imprecise state misdescribed as a sharp function, and what that would cost her elsewhere.
reasoning: |-
  Okay, I need to help this PhD student figure out their supervisor's epistemic norms. The student has described several of the supervisor's past verdicts on credence functions and wants to predict how she'll rule on a new case involving a sup-norm accuracy measure. 

  First, I should summarize the supervisor's established positions: 
  - She rejects dominated credences (cases 1 and 2)
  - Requires strictly proper scoring rules (case 2)
  - Won't use improper rules (case 3)
  - Permissive about priors (case 4)
  - Allows imprecise credences (case 5)

  The new case involves measuring inaccuracy by the maximum single-cell error (sup-norm). For a three-cell partition, (0.5,0.5,0.5) is undominated and minimizes worst-case loss. The student wants to know if the supervisor will deem this permissible.

  Looking at possible frameworks:
  - If she views probabilism as fundamental, she should reject (0.5,0.5,0.5) because it's incoherent.
  - If dominance is primary, she might accept it since it's undominated.
  - She might require scoring rules to pass a legitimacy filter like strict propriety - which the sup-norm fails because it's not strictly proper.

  Case 2 is key here. When presented with a non-strictly-proper rule (step rule), the supervisor rejected it as not tracking accuracy. The sup-norm has the same flaw - it can't distinguish between different credence values as long as they're on the same side of 0.5. So she'll likely reject the sup-norm measure entirely.

  For the specific case: she'll probably call (0.5,0.5,0.5) impermissible. Even though it's undominated under this measure, the measure itself fails her legitimacy requirements. The incoherence is the core problem.

  The student's alternative cases: 
  - (0.55,0.5,0.5) is weakly dominated but not strictly - probably still impermissible
  - Hundred-cell case shows same pattern but makes incoherence more extreme

  The complications:
  - Finite p results might not matter since she'll reject the measure anyway
  - She won't accept the risk-aversion justification as it introduces non-epistemic factors
  - Reinterpreting as imprecise credence might work but conflicts with her tolerance for actual imprecise states

  I think the supervisor operates with a two-stage view: first validate the scoring rule (must be strictly proper), then apply dominance. The sup-norm fails at stage one, so the credence gets rejected regardless of its dominance properties.
answer: |-
  Based on your supervisor's established verdicts and philosophical commitments, I reconstruct her epistemic norm as a **Two-Stage Legitimacy-Filtered Dominance Norm**, and predict she will deem the (0.5, 0.5, 0.5) state **impermissible** in the three-cell case. Here's the breakdown:

  ### Reconstructed Rule
  - **Stage 1 (Legitimacy Filter)**: Any scoring rule must be *strictly proper* and *truth-directed* to count as a legitimate measure of accuracy. Propriety ensures the rule "tracks accuracy" by incentivizing honest reporting (verdict 2), while truth-directedness mandates that moving credence toward truth always improves accuracy (implied by her rejection of measures masking "truthward movements").
    
  - **Stage 2 (Dominance)**: For legitimate scoring rules, dominated credence functions are impermissible. Coherence (probabilism) is not fundamental but emerges as a corollary of avoiding dominance *under legitimate rules* (verdicts 1, 2, 4). Permissivism arises when multiple undominated options exist (verdict 4), and imprecise credences are permissible when no precise function is undominated (verdict 5).

  ### Prediction for the New Case
  - **Verdict**: (0.5, 0.5, 0.5) is **impermissible**.
  - **Reasoning**: 
    1. The sup-norm (worst-mistake) measure **fails Stage 1**: 
       - It is *not strictly proper* (like the step rule in verdict 2). For example, in a three-cell partition, credences (0.6, 0.6, 0.6) and (0.9, 0.9, 0.9) both have maximal inaccuracy 0.5 in every world, so the rule cannot distinguish them despite clear accuracy differences.
       - It violates *truth-directedness*: Increasing credence in a true proposition from 0.5 to 0.6 need not reduce inaccuracy if another cell remains the "worst mistake" (e.g., if one cell has credence 0.1).
    2. Since the rule fails legitimacy, its dominance/non-dominance properties are irrelevant (analogous to her treatment of the step rule as a reductio in verdict 2). The "undominated" status of (0.5, 0.5, 0.5) under this rule carries no weight.
    3. The state remains incoherent, and under *any legitimate scoring rule* (Brier, log, etc.), incoherent functions are either dominated or suboptimal (as per verdict 1 and her insistence on coherence).

  ### Why Other Frameworks Don't Fit
  - **Probabilism as Fundamental + Dominance Explanation**: Predicts *impermissible* but fails to explain her tolerance for imprecise credences (verdict 5) or permissivism (verdict 4). She explicitly rejects dominance arguments when the rule is improper (verdict 2).
  - **Dominance as Operative Norm**: Predicts *permissible* (since undominated) but conflicts with her rejection of the step rule’s non-dominance verdict (verdict 2). She subordinates dominance to rule legitimacy.
  - **Optimality Norm**: Predicts *required* (as the unique optimum) but contradicts her permissivism (verdict 4). She allows non-optimal options if undominated.

  ### Diagnostic Cases
  To confirm the **Two-Stage View**, use these cases in order:
  1. **Credence (0.55, 0.5, 0.5) under Brier score**  
     - **Prediction**: *Impermissible*.  
     - **Why**: Weakly dominated by (0.55, 0.5001, 0.4999) and incoherent. Confirms she prioritizes dominance under legitimate rules.  
     - *If she permits it*, she may allow weakly undominated options, but this is unlikely given her strictness in verdict 1.  

  2. **Hundred-Cell Case (0.5 everywhere)**  
     - **Prediction**: *Impermissible*.  
     - **Why**: Under legitimate rules (e.g., Brier), it is massively dominated by coherent functions (e.g., uniform 0.01). Tests if she treats coherence as non-negotiable.  
     - *If she permits it*, she might be treating it as a misdescribed imprecise state (see complications).  

  ### Handling Complications
  1. **Finite-p vs. p = ∞**:  
     - The finite-p L⁴ case is irrelevant. Her verdict hinges on the *legitimacy* of the sup-norm, not its mathematical properties. Since it fails strict propriety for all p, she rejects it. The p = ∞ case is merely illustrative.  

  2. **Risk-Aversion as Non-Epistemic**:  
     - She **will accept this objection** and reject the sup-norm.  
     - **Why**: Her defense of strict propriety (verdict 2) implies that scoring rules must measure "accuracy" neutrally, not incorporate risk attitudes. She would view risk aversion as a pragmatic distortion, violating her assumption that "pragmatic considerations never enter."  

  3. **Imprecise State Redescription**:  
     - She **could** reinterpret (0.5, 0.5, 0.5) as representing the imprecise state [0.3, 0.7] for each cell (matching verdict 5).  
     - **Cost**: This would:  
       - Undermine her critique of improper rules (why reject the step rule if incoherent functions can be "imprecise"?).  
       - Collapse the distinction between precise and imprecise representations. If every incoherent function can be relabeled imprecise, coherence norms become vacuous.  
     - **Likelihood**: Low. She distinguishes representationally precise but incoherent states (impermissible) from explicitly imprecise ones (permissible in verdict 5).  

  ### Conclusion and Best Guess
  - **Rule**: Two-Stage Legitimacy-Filtered Dominance.  
  - **Verdict**: (0.5, 0.5, 0.5) is **impermissible**.  
  - **Key Evidence**: Her rejection of the step rule due to non-strict-propriety (verdict 2) is the closest analogue. The sup-norm shares the same flaw, so she will dismiss its "undominated" result as artifactually permissive.  
  - **Next Step**: Test with (0.55, 0.5, 0.5) under Brier score. If she calls it impermissible, it confirms dominance under legitimate rules is key. If she permits it, probe her view on weak dominance.  

  This fits her insistence that accuracy measures must "track accuracy" robustly (beyond mere non-dominance) and explains her blend of permissivism, coherence requirements, and openness to imprecision.
