  - **Math:** Geometric mean of (0.6 × 0.75 × 0.4) ≈ 0.55 (since extremes balance out).  
  - **Heaviest lifting:** **(b) Quantum openness (0.75)**. Physics doesn’t just *fail to disprove* occasionalism — its unresolved foundations *actively accommodate* it. Without QM, occasionalism feels like gaslighting a deterministic universe.  

