  I'm defending a view on statue/clay constitution at a metaphysics seminar tuesday: I call it "modal part-sharing," where the clay contains modal parts (possible shapes) that the statue doesn't, so they actually overlap but diverge modally, letting me reject Baker's constitution account without buying full hylomorphism. Audience is analytic metaphysicains who know Wiggins and Baker inside out, plus one grad student convinced material constitution is a pseudo-problem, plus a visitor from philosphy of science who thinks artifacts don't have real modal properties. Prep me for the objections in roughly damage order, phrased like they'd actually say them — not generic "what about identity?" Give me each with a two-minute reply and flag where I'm soft. What's the question I'm hoping nobody asks?
reasoning: |-
  Okay, the user is prepping for a metaphysics seminar defense of their "modal part-sharing" view on statue/clay constitution. They're rejecting Baker's constitution account without adopting full hylomorphism. Their audience is tough: analytic metaphysicians deeply familiar with Wiggins and Baker, a grad student who thinks material constitution is a pseudo-problem, and a philosophy of science visitor skeptical about artifacts having real modal properties.

  First, I need to understand the core of their view. They propose that the statue and clay share actual parts but have different modal parts—possible shapes the clay can take that the statue can't. This allows overlap without full identity. The goal is to avoid Baker's constitution while not committing to hylomorphism. 

  The user wants objections in damage order, meaning starting with the most critical. They want objections phrased exactly as the audience would say, not generic ones. Each objection needs a two-minute reply and a flag where their response might be weak. Plus, the question they hope nobody asks.

  Breaking down the audience: 
  1. Analytic metaphysicians: They'll dive into technical details, modal logic, parthood issues. Likely objections about modal overlap, temporal parts, or counterfactual identity.
  2. Grad student: Thinks constitution is a pseudo-problem. Might argue that the distinction is linguistic or conceptual, not ontological. 
  3. Philosophy of science visitor: Doubts artifacts have real modal properties. Probably a nominalist or thinks modal properties are projections.

  Most damaging objections probably come from the metaphysicians first. Key issues:
  - **Modal Overlap without Parthood**: How can something have modal parts if parts are usually actual? This challenges the coherence of modal parts. 
  - **Temporal Parts**: If the clay and statue share actual parts, but the clay existed before, how does that work without temporal parts? They might need to address persistence over time.
  - **Counterfactual Identity**: If the statue is squashed, is the clay still identical to itself? How does modal part-sharing handle transitivity of identity?

  The grad student's objection might be that all this is a verbal dispute. They need to show why it's ontological, not just conceptual.

  The science visitor might say artifacts don't have modal properties at all. The reply has to defend realism about artifact modalities without overstepping.

  Structure objections by damage:
  1. **Modal Overlap Objection**: Most technical and fundamental. If it fails, the whole view crumbles. 
  2. **Temporal Parts/Pre-Existence**: Questions how objects persist, which is core to constitution problems.
  3. **Transitivity of Identity**: A classic problem in constitution. If statue=clay now, but clay existed before, then statue existed before?
  4. **Graduate Student's Pseudo-Problem**: Challenges the entire debate's validity. 
  5. **Science Visitor's Skepticism**: Attacks the foundation of modal properties.

  For each, craft a realistic objection as the audience would say. Then a concise two-minute reply. Flag soft spots: places where the reply might be weak or need more development.

  The question they hope nobody asks: Probably something that exposes a deep inconsistency or forces a commitment they want to avoid. Maybe about the grounding of modal parts—what makes a modal part real? If modal parts aren't grounded in actual properties, it might lead to platonism or become too abstract. Or perhaps about how many modal parts an object has, leading to arbitrariness. 

  Another tough one: If the clay has modal parts for all possible shapes, but the statue only some, what determines which modal parts the statue has? This ties into essentialism, which they might want to avoid. 

  Or, "How do modal parts interact with actual parts in composition?" If actual parts are physical, but modal parts are possibilities, how do they combine without category mistakes?
answer: |-
  Here's a prep for your seminar, ordered by likely damage level (most devastating first), with objections phrased authentically, 2-minute replies, soft-spot flags, and the "question you dread" at the end. I've modeled objections after real analytic metaphysics Q&A patterns.

  ### **Objection 1: Modal Overload** (From a Wiggins expert)  
  *"You’re smuggling in primitive modal properties to do the work of identity conditions. But 'modal parts' aren't parts—they're not in the mereology. If they’re not spatiotemporal, how do they *compose* with actual parts? You’ve just replaced constitution with a brute modal disjunction that violates standard mereological extensionality. This is ad hoc."*  

  **Your 2-Minute Reply:**  
  "I’m not treating modal parts as literal compositional elements. They’re *constraints* on persistence encoded in the object’s essence. The clay has a modal profile allowing shape-morphing; the statue has a rigid one. They share all actual parts *at t*, but their persistence conditions diverge modally. This doesn’t violate extensionality because extensionality governs actual parthood, not modal profiles. Think of it as a dual-aspect theory: one actual mereological base, two modal 'filters'."  
  **🔴 Soft Spot:** *You lean on "essence" here. If pressed on what grounds these essences (especially for artifacts), you might circularly appeal to modal properties.*  

  ### **Objection 2: Pre-Existence Problem** (From a Baker loyalist)  
  *"Fine, they overlap *now*. But the clay existed pre-sculpting while the statue didn’t. By Leibniz’s Law, if the clay was F (e.g., 'existed at t-1') and the statue wasn’t, they can’t be identical *now*. Your 'overlap' just dodges this—it’s temporary identity in disguise. Baker’s constitution avoids this by making them non-identical but coinciding."*  

  **Your 2-Minute Reply:**  
  "They’re not identical *simpliciter*—they’re modally discernible *now*. The clay’s pre-existence is a historical property, not a current one. At t-1, only the clay existed (with its modal parts). At t, a new entity (the statue) comes into being by 'locking' some of the clay’s modal possibilities (e.g., losing squishability). They share the same matter *at t*, but their modal histories differ. This isn’t temporary identity; it’s phased overlap."  
  **🔴 Soft Spot:** *Implies a sortal-bound persistence condition. The grad student will pounce on this as linguistic.*  

  ### **Objection 3: Transitivity Trap** (From a 4Dist)  
  *"Suppose at t1, Clay=Statue. At t2, I flatten it—Clay survives, Statue doesn’t. By transitivity, Clay-at-t1 = Clay-at-t2, and Clay-at-t1 = Statue-at-t1, so Statue-at-t1 = Clay-at-t2. But Clay-at-t2 is flattened, and Statue-at-t1 isn’t! Contradiction. Temporal parts avoid this; your overlap doesn’t."*  

  **Your 2-Minute Reply:**  
  "Transitivity applies only within an object’s modal profile. The statue’s identity is tied to its statue-modal profile, which ends at flattening. The clay’s profile persists. When we say 'Clay=Statue' at t1, it’s shorthand for 'they share all actual parts and coincide modally *at t1*'. Across time, they follow different modal paths—no shared transitivity. The '=' is phase-relative, not absolute."  
  **🔴 Soft Spot:** *This sounds suspiciously like temporal parts without admitting it. You’ll need to defend "phase-relative" identity as primitive.*  

  ### **Objection 4: Grad Student’s Pseudo-Problem Charge**  
  *"This is all verbal! 'Statue' and 'lump' are just predicates we project onto matter. Your 'modal parts' are really just *us* deciding which counterfactuals matter. There’s no metaphysical difference—just conceptual/semantic contexts. Why not deflate the problem?"*  

  **Your 2-Minute Reply:**  
  "If it were just semantics, we couldn’t explain why the *world* behaves differently—e.g., why smashing the clay destroys the statue but not vice versa pre-sculpting. Modal profiles track objective causal dispositions: the clay *can* survive radical reshaping; the statue *can’t*. This isn’t context-dependent—it’s grounded in the physical structure (e.g., bonds in the statue). Your deflationism can’t handle causal asymmetries in persistence."  
  **🔴 Soft Spot:** *You appeal to "physical structure," but the science visitor will argue structures don’t have modal realism.*  

  ### **Objection 5: Science Visitor’s Modal Skepticism**  
  *"Artifacts don’t have *de re* modal properties—they’re not in the causal structure of the world. 'Could have been shaped differently' is a statement about *our intentions* or physical laws governing particles, not the lump. Your 'modal parts' reify human concepts. Only fundamental entities have real modalities."*  

  **Your 2-Minute Reply:**  
  "I’m not reifying—I’m grounding modal profiles in higher-level physical dispositions. The statue’s rigidity supervenes on molecular bonds; the clay’s plasticity on weaker ones. Science quantifies dispositions (e.g., elasticity), which *are* modal. If you deny this, you can’t explain why a bridge collapses under load—it’s *because* it couldn’t bear it. Artifacts inherit real modalities from their microstructure."  
  **🔴 Soft Spot:** *This commits you to robust dispositionalism. If they reject dispositions (e.g., favor Humeanism), you’re toast.*  

  ---

  ### **The Question You Hope Nobody Asks**  
  *"What determines *which* modal parts an object has? For the clay, is its 'possible shape' modal part a coarse-grained set (e.g., {sphere, cube}) or fine-grained (every geometrically possible form)? If coarse, what grounds the granularity? If fine, how is this distinguishable from the clay just being matter with no identity conditions?"*  

  **Why it’s deadly:**  
  - Forces you to choose between vagueness (undermining the theory’s precision) or arbitrary essentialism (e.g., "only physically possible shapes").  
  - Exposes that "modal parts" might collapse into either conventionalism (helping the grad student) or full-blown hylomorphism (which you reject).  
  - Your best move—appealing to "causal powers" or "dispositions"—plays into the science visitor’s hands, as they’ll argue these reduce to fundamental physics.  

  **Prep Tip:** Preempt this by explicitly defining modal parts as *physically possible states given the object’s current structure* during your talk. But if asked, bite the bullet: "Granularity is fixed by nomological possibility—e.g., shapes achievable without breaking molecular bonds." (Then brace for follow-ups on indeterminacy).  

  **Final Advice:** Emphasize that your view *avoids* commitment to Aristotelian forms (unlike hylomorphism) while explaining coincidence without Baker’s "non-identity." Stress that modal profiles are *emergent*, not fundamental. Good luck!
