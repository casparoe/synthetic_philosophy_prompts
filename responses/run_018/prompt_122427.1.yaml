prompt: |-
  I'm in the last year of a PhD in behavioural ecology, writing the synthesis chapter of a thesis on cooperation, and I've realised I don't actually have a specification for what I want out of a theory in this area — only a set of half-articulated demands that my committee keeps invoking inconsistently. So before I write the chapter I want the desiderata stated properly: what any adequate theory of the evolution of cooperation has to deliver, with the case or consideration behind each requirement. The purpose I care about is diagnostic rather than merely narrative. My empirical chapters are on a set of field systems (a cooperative breeder with high extra-group dispersal, and an interspecific mutualism where the benefit to the recipient arrives months after the actor has paid the cost and often accrues to a different individual than the one who was helped). What I need from a theory is the ability to license — or to refuse to license — an inference from field data to a mechanism: given helping rates, relatedness estimates, interaction structure and the timing of costs and benefits in a natural population, which mechanism is operating, and what would I have to measure to tell? That is my standard of adequacy, and I'd like the list built for it, not for the standard of "explains why cooperation exists somewhere" or "is elegant in a model."

  Here is the material I think the criteria have to come out of, roughly in the order it started bothering me. (i) One-shot anonymous encounters: humans in the lab cooperate well above zero in a single anonymous prisoner's dilemma with no future and no reputation, and I don't know whether that is data for a theory of cooperation or noise generated by a psychology built for repeated life. (ii) The unknown horizon: in every real system the continuation probability is not known to the players, only to me, so a strategy that needs the players to know the shadow of the future is asking for something nature doesn't provide. (iii) Misimplementation: in my mutualism the helping act fails independently of the helper's effort maybe a fifth of the time, so a partner cannot condition on realised benefit — and relatedly, benefits are decoupled from costs across individuals, which breaks the feedback loop that partner-fidelity accounts lean on. (iv) No recognition: in the cooperative breeder I cannot find any evidence that helpers discriminate among the adults they assist, yet helping is strongly assortative with respect to something. (v) Large groups: dyadic reciprocity machinery does not obviously scale to the n-player public-goods structure that most of the interesting cases have. (vi) Private, noisy assessment: in my own simulations, once assessment of reputations is private rather than public, the plain image-scoring style of norm stops sustaining cooperation, and the more demanding norms that survive require cognitive and informational machinery I would be embarrassed to attribute to my study animals. (vii) Second-order free riding: any account that stabilises cooperation by punishment has to explain why the punishers aren't undercut. (viii) Payoff non-transparency: the players don't observe each other's payoffs, only their own, plus noisy cues. (ix) The definitional case: some of what gets called 'cooperation' is mutualism or a byproduct of self-interested behaviour, where there is no puzzle at all, and I want a theory to be able to say when the puzzle dissolves rather than to explain a case that never needed explaining. (x) The bookkeeping constraint: as far as I can tell, every mechanism works by arranging either genetic relatedness or a fitness feedback from the recipient's benefit back to the actor, so a candidate that seems to produce cooperation from random interaction without either is probably hiding assortment in its assumptions. I take (x) to be a consistency constraint rather than a desideratum, but I want you to tell me if I'm wrong about that.

  What I'd like from you, then, is the list: the requirements, which cases or considerations motivate each, and — this is the part I expect to be most useful — which of the things people in this literature demand are genuine desiderata and which are prejudices of one camp (for instance, is it a real requirement that a theory specify an explicit decision rule and cue set, or is that just what the reciprocity people are used to building? is demanding that a single mechanism cover all species a requirement or a taste for unification? is identifiability from observational data a fair demand, or does it just penalise theories that are permissive about mechanism?). Then flag any subset you think cannot be jointly satisfied — I suspect something like "explain cooperation in genuinely one-shot, anonymous, non-kin interactions" plus "be stable against invasion by unconditional defectors" plus "invite no assortment" is inconsistent, and I want to know which is the right one to drop and what dropping it costs me — and say which single requirement does the most work in knocking out candidates, since that is the one my chapter should be organised around. Only after that, and briefly, would I like a scorecard: direct reciprocity, indirect reciprocity, kin selection and inclusive fitness, partner choice and biological markets, byproduct mutualism, and multilevel selection, each in a few lines against the list. Keep the weight on the criteria and their motivating cases rather than on the scoring; I can do the scoring myself, and my committee will argue about it anyway.
reasoning: |-
  We are building a list of desiderata for an adequate theory of the evolution of cooperation, with a focus on diagnostic power for inferring mechanisms from field data. The theory must help us decide, given empirical measurements (helping rates, relatedness, interaction structure, timing of costs and benefits, etc.), which mechanism is operating and what additional measurements are needed to distinguish among them.

  The motivating cases and considerations from the user are:

  (i) One-shot anonymous encounters: Humans cooperate in one-shot anonymous PD games, which may be noise or require explanation.
  (ii) Unknown horizon: Continuation probability is unknown to players in nature.
  (iii) Misimplementation: Helping acts fail independently, so conditioning on realized benefit is impossible; also, benefits decoupled from costs across individuals.
  (iv) No recognition: Cooperation occurs without apparent discrimination, yet is assortative.
  (v) Large groups: Mechanisms must scale to n-player public goods.
  (vi) Private, noisy assessment: Reputation assessment is private and noisy, making simple norms unstable and demanding norms cognitively implausible.
  (vii) Second-order free riding: Punishment-based mechanisms must explain why punishers are not undercut.
  (viii) Payoff non-transparency: Players observe only their own payoffs and noisy cues, not others'.
  (ix) Definitional case: The theory should distinguish between cases that are truly puzzling (requiring an evolutionary explanation for the maintenance of cooperation against defectors) and those that are mutualism or byproduct (no puzzle).
  (x) Bookkeeping constraint: Every mechanism must involve either genetic relatedness or a fitness feedback from the recipient's benefit back to the actor (so no cooperation without assortment).

  We now derive the desiderata from these considerations. We also evaluate which demands in the literature are genuine and which might be camp-specific.

  ## List of Desiderata for an Adequate Theory

  1. **Mechanism must operate without known future interactions (motivated by i and ii):**
     - Consideration: In nature, players do not know the exact continuation probability (ii). Also, one-shot anonymous cooperation in humans (i) must be explained (if not noise) without relying on repeated interactions.
     - Requirement: The theory should not require that individuals know the probability of future interactions. It can use an average or evolved response to the typical environment, but the mechanism must work when the future is uncertain and not explicitly represented by the actors.

  2. **Robustness to implementation failure and decoupling of benefits (motivated by iii):**
     - Consideration: In the mutualism case, helping acts fail independently of effort (so conditioning on realized benefit is impossible) and benefits are decoupled from costs (i.e., the actor's cost does not necessarily lead to a benefit to the same recipient, breaking partner-fidelity feedback).
     - Requirement: The mechanism must not require that the benefit is always realized or that the same individual who paid the cost receives the return. It must be robust to stochastic failure and to the benefit being received by a different individual (or even a different generation).

  3. **No requirement for individual recognition (motivated by iv):**
     - Consideration: In the cooperative breeder, helpers do not discriminate among adults, yet helping is assortative. This suggests that recognition of specific individuals is not necessary.
     - Requirement: The mechanism must not rely on the ability to recognize and remember individual identities. It can use cues that are correlated with the relevant traits (e.g., group membership, spatial location) but not full-blown individual recognition.

  4. **Scalability to large groups and public goods (motivated by v):**
     - Consideration: Many real systems involve n-player interactions (public goods) and dyadic mechanisms do not scale.
     - Requirement: The mechanism must work in groups larger than dyads and for public goods.

  5. **Robustness to private, noisy assessment (motivated by vi):**
     - Consideration: Reputation systems with public scoring are unrealistic; private and noisy assessment is the norm. Simple scoring breaks down, and complex norms may be cognitively demanding.
     - Requirement: The mechanism, if it relies on reputation, must function with private and noisy information. It must not require perfect public knowledge of reputations or overly complex cognitive processes.

  6. **Resolution of second-order free riding (motivated by vii):**
     - Consideration: Punishment of defectors can be undermined if punishment is costly and non-punishers can free-ride on the punishers' efforts.
     - Requirement: If the mechanism involves punishment (or rewarding), it must explain how the cost of punishment (or rewarding) is borne without being undercut by second-order free riders.

  7. **Operate with payoff non-transparency (motivated by viii):**
     - Consideration: Players do not observe each other's payoffs, only their own and noisy cues.
     - Requirement: The mechanism must not require that individuals know the payoffs of others. They can use cues (e.g., behavior, condition) that correlate with payoffs, but not direct payoff knowledge.

  8. **Diagnostic for the presence of a puzzle (motivated by ix):**
     - Consideration: Some 'cooperation' is not actually costly (mutualism) or is a byproduct, so there is no evolutionary puzzle. A theory must distinguish these cases from those where cooperation is maintained despite costs and the potential for defection.
     - Requirement: The theory must provide criteria to determine when cooperation is costly and requires an evolutionary explanation (i.e., when it is vulnerable to invasion by defectors) versus when it is a byproduct or mutualism (and thus stable without special mechanisms).

  9. **Satisfy the bookkeeping constraint (motivated by x):**
     - Consideration: Ultimately, cooperation must be explained by either genetic relatedness (kin selection) or a fitness feedback that makes helping beneficial in the long run (e.g., reciprocity, market effects). Without one of these, cooperation cannot evolve because it would be outcompeted by defectors.
     - Requirement: The mechanism must explicitly show how either (a) the helper gains inclusive fitness via relatedness, or (b) there is a direct or indirect fitness feedback to the helper (or its lineage) that compensates for the cost. This is a fundamental constraint, not just a desideratum.

  ## Evaluation of Additional Demands in the Literature

  - **Explicit decision rules and cue sets:** 
    - This is a genuine desideratum for diagnostic purposes. To test a theory, we need to know what behavioral rules and cues to look for. However, it may be that the exact decision rule is not specified by the theory but can be inferred. The requirement should be: the theory must make empirically testable predictions about the cues and decision rules that individuals use, so that we can look for them in the field.

  - **Coverage of all species with a single mechanism:**
    - This is a taste for unification, not a requirement. Different mechanisms can operate in different systems. The requirement should be that the theory applies to the system at hand, not universally.

  - **Identifiability from observational data:**
    - This is a fair demand for a diagnostic theory. If the mechanism cannot be distinguished from others with the data we can collect, then the theory is not useful for empirical work. However, we must be realistic: some mechanisms may require experiments to distinguish. The requirement is that the theory must make predictions that are testable with feasible empirical methods (including experiments if necessary, but preferably also with observational data when possible).

  ## Inconsistencies and Trade-offs

  The user suspects an inconsistency in the requirements. Consider:

  - Explain cooperation in genuinely one-shot, anonymous, non-kin interactions.
  - Be stable against invasion by unconditional defectors.
  - Invite no assortment.

  This is indeed inconsistent. Without assortment (by relatedness or by some other form of correlation between cooperators), cooperation cannot be evolutionarily stable against defectors in a one-shot, anonymous setting (this is a consequence of the bookkeeping constraint). Therefore, one of these must be dropped.

  - If we drop "explain one-shot anonymous non-kin cooperation", then we can allow assortment and the problem goes away. But then we cannot explain the human lab data (if it is not noise). 
  - If we drop "be stable against invasion", then we are not explaining the maintenance of cooperation, but perhaps its transient occurrence. But that is not a complete theory.
  - If we drop "no assortment", then we allow for assortment (e.g., by reputation, or spatial structure) and then cooperation can be stable.

  The right one to drop is the strict requirement of "no assortment". Assortment (genetic or phenotypic) is necessary for cooperation to evolve. The bookkeeping constraint (desideratum 9) tells us that. The human one-shot cooperation might be explained by:
    - Noise (not requiring an evolutionary explanation for the behavior in that context).
    - Or, if it is adaptive, by some form of assortment (e.g., cultural group selection, or a psychology that evolved in a context with assortment).

  Therefore, we should relax the "no assortment" requirement and instead require that the theory specifies the form of assortment (and how it is maintained). This is what the bookkeeping constraint does.

  ## The Most Discriminating Desideratum

  The desideratum that does the most work in knocking out candidate theories is likely **Robustness to private, noisy assessment (desideratum 5)**. 

  Why? Many theories of reciprocity (direct and indirect) rely on public information and perfect monitoring. When we move to private and noisy assessment, these theories often break down or require unrealistic cognitive abilities. This requirement forces the theory to be grounded in the limitations of real organisms.

  Alternatively, **Scalability to large groups (desideratum 4)** is also very discriminating because many mechanisms (e.g., direct reciprocity) are designed for dyads and fail in n-player games.

  But note: the bookkeeping constraint (9) is fundamental and must be satisfied by any theory. It is a consistency condition.

  ## Brief Scorecard of Mechanisms

  We briefly evaluate major mechanisms against the desiderata. This is not exhaustive but illustrative.

  1. **Direct Reciprocity (e.g., Tit-for-Tat in repeated games):**
     - Fails on 1 (requires known future, though can be extended to uncertain horizons with strategies like Win-Stay-Lose-Shift) but may not be robust to unknown horizons.
     - Fails on 2: not robust to misimplementation (if a cooperative act fails, it may trigger defection).
     - Fails on 3: requires recognition of individuals (to remember past actions).
     - Fails on 4: does not scale well to large groups (n-player).
     - Fails on 5: in dyads it might work without public information, but in groups with private assessment, it becomes very complex.
     - Passes 6? (no punishment, so no second-order free riding in basic form) but if punishment is added, then 6 becomes an issue.
     - Fails on 7? (requires knowing the other's action, which might be a noisy cue) but can be adapted to cues.
     - Passes 8? (it explains cooperation that is costly and vulnerable to defection).
     - Passes 9: the feedback is direct (if you help, you get helped back).

  2. **Indirect Reciprocity (e.g., image scoring):**
     - May pass 1? (can work in one-shot if reputation is built, but requires future interactions for the reputation to matter).
     - Fails on 2: if benefits are decoupled (A helps B, then C helps A) it might work, but misimplementation (failure of help) can damage reputation unfairly.
     - Fails on 3: requires recognition of individuals (to assign reputation).
     - Fails on 4: scales better than direct reciprocity but still requires tracking reputations in a group, which becomes harder in large groups.
     - Fails on 5: with private and noisy assessment, simple scoring breaks down and more complex norms are required (which may be cognitively demanding).
     - Fails on 6? (if punishment is part of the norm, then second-order free riding can occur; if not, then it's about rewarding).
     - Fails on 7? (requires knowing others' actions, which may not be transparent).
     - Passes 8? (explains costly cooperation).
     - Passes 9: feedback via reputation (helping builds reputation, which leads to being helped).

  3. **Kin Selection / Inclusive Fitness:**
     - Passes 1: does not require repeated interactions.
     - Passes 2: robust to misimplementation and decoupling (because it relies on relatedness, not direct feedback).
     - Passes 3: does not require individual recognition; can use cues of relatedness (e.g., spatial proximity, phenotype matching).
     - Passes 4: works in large groups (e.g., whole family groups).
     - Passes 5: no reputation needed.
     - Passes 6: no punishment (usually) so no issue.
     - Passes 7: no need to know others' payoffs.
     - Passes 8: it explains cooperation that is costly and would be vulnerable without relatedness.
     - Passes 9: based on relatedness (genetic assortment).

  4. **Partner Choice and Biological Markets:**
     - Passes 1? (can work in repeated interactions, but also in one-shot if partners are chosen based on reputation) but requires some future opportunity for interaction.
     - Fails on 2? (if benefits are decoupled, then choosing a partner based on past behavior might not work if the past behavior was towards someone else) but can be adapted.
     - Fails on 3: requires recognition of individuals (to choose or avoid specific partners).
     - Passes 4? (in large groups, choice might be based on groups or classes, but individual choice becomes harder).
     - Fails on 5: private, noisy assessment makes partner choice less reliable.
     - Passes 6? (no punishment, just choice) but if there is punishment for being dropped, then it might be okay.
     - Passes 7? (choice based on cues of quality, not necessarily payoffs).
     - Passes 8: explains costly cooperation in mutualisms.
     - Passes 9: feedback via being chosen (or not) which affects fitness.

  5. **Byproduct Mutualism:**
     - Passes 1: no future required.
     - Passes 2: if it's a byproduct, then failure might not matter (depending on the mechanism).
     - Passes 3: no recognition needed.
     - Passes 4: can work in groups.
     - Passes 5: no assessment.
     - Passes 6: no punishment.
     - Passes 7: no payoff knowledge needed.
     - Passes 8: by definition, it is not a puzzle (so the theory should not classify it as such).
     - Passes 9: the act is not costly (or the cost is offset by immediate self-benefit), so no need for feedback.

  6. **Multilevel Selection:**
     - Note: This is a different perspective on kin selection (often mathematically equivalent) but with emphasis on group structure.
     - Similar to kin selection on many points. It requires assortment (groups with more cooperators do better) which can be due to relatedness or other factors. It passes most of the same as kin selection, but:
       - For 3: may require group recognition, not individual.
       - For 9: the feedback is via group success (which may be due to relatedness or cultural transmission).

  ## Conclusion for the Chapter

  The chapter should be organized around the most discriminating desideratum: **Robustness to private, noisy assessment (5)** and **Scalability to large groups (4)**, because these are where many popular theories fail. Also, the bookkeeping constraint (9) is fundamental and should be used as a litmus test.

  The user's empirical systems:
  - Cooperative breeder with high extra-group dispersal: This might point to kin selection (if helpers are related) or perhaps other mechanisms (like group augmentation) but note the lack of recognition (iv) which is a problem for reciprocity and partner choice.
  - Mutualism with delayed and decoupled benefits: This might be explained by partner choice (if partners can be chosen based on past behavior) but that requires recognition and memory. If not, then perhaps byproduct mutualism (if the cost is low) or kin selection (if there is relatedness).

  The chapter should use the desiderata to evaluate which mechanisms are plausible in each system and what data are needed to distinguish them.
answer: |-
  Below is a structured list of desiderata for an adequate theory of the evolution of cooperation, tailored to your diagnostic goal: **the ability to license or refuse inferences from field data to specific mechanisms**. Each desideratum is derived from your empirical and conceptual challenges (i–x), with explicit justification. I then clarify which common demands in the literature are genuine requirements versus camp-specific preferences, identify inconsistencies, and highlight the most discriminating desideratum. Finally, I provide a concise scorecard of major theories against the list.

  ---

  ### **Desiderata for a Diagnostic Theory of Cooperation**
  *Focused on inferring mechanisms from field data (helping rates, relatedness, interaction structure, timing, etc.)*

  1. **Operate under uncertain interaction horizons**  
     - **Requirement**: The mechanism must function without agents knowing the exact probability of future interactions.  
     - **Motivating case**: Your (ii) — in nature, continuation probabilities are observer-known, not agent-known. Strategies requiring precise knowledge of the "shadow of the future" (e.g., fixed discount rates in reciprocity models) are unrealistic.  
     - **Diagnostic role**: Rules out reciprocity models that assume agents compute exact future probabilities. Favors mechanisms robust to stochastic termination (e.g., kin selection, tag-based assortment).

  2. **Tolerate stochastic benefit/cost decoupling**  
     - **Requirement**: The mechanism must persist when:  
       (a) Benefits fail independently of actor effort (e.g., environmental noise).  
       (b) Benefits are received by non-actors (e.g., delayed/redirected benefits).  
     - **Motivating case**: Your (iii) — mutualism with frequent helping failures and benefits decoupled from direct recipients. Breaks partner-fidelity feedback (e.g., in direct reciprocity or pairwise mutualism).  
     - **Diagnostic role**: Tests for resilience to misimplementation; penalizes models relying on precise cost-benefit coupling (e.g., strict Tit-for-Tat).

  3. **Function without individual recognition**  
     - **Requirement**: Cooperation must be sustainable without fine-grained discrimination of individual identities.  
     - **Motivating case**: Your (iv) — cooperative breeders with undiscriminating helpers but high assortment. Suggests mechanisms using proxies (e.g., spatial location, group membership, phenotypic tags).  
     - **Diagnostic role**: Discriminates against reciprocity/partner-choice models requiring memory of individuals. Favors kin selection or tag-based assortment.

  4. **Scale to n-player public goods**  
     - **Requirement**: The mechanism must explain cooperation in groups > dyads, where benefits are non-excludable and non-rival.  
     - **Motivating case**: Your (v) — most empirical systems (e.g., cooperative breeding, mutualisms) involve multi-actor interactions.  
     - **Diagnostic role**: Rules out dyadic models (e.g., direct reciprocity) unless generalized (e.g., to collective action). Favors group augmentation, multilevel selection, or biological markets.

  5. **Resist collapse under private, noisy information**  
     - **Requirement**: The mechanism must be stable when agents have private, error-prone assessments of others' behavior/traits.  
     - **Motivating case**: Your (vi) — private reputation assessment destabilizes simple norms (e.g., image scoring) and demands implausible cognition.  
     - **Diagnostic role**: Penalizes complex indirect reciprocity or punishment models. Favors mechanisms insensitive to assessment noise (e.g., kinship, byproducts).

  6. **Resolve second-order free-riding**  
     - **Requirement**: If cooperation relies on enforcement (e.g., punishment), the theory must explain why enforcers are not outcompeted by non-enforcers.  
     - **Motivating case**: Your (vii) — punishment is evolutionarily unstable if non-punishers reap benefits without costs.  
     - **Diagnostic role**: Tests punishment-based theories (e.g., strong reciprocity); if unmet, suggests alternative mechanisms (e.g., mutualism, kin selection).

  7. **Operate with payoff non-transparency**  
     - **Requirement**: Agents must not require direct knowledge of others' payoffs, only noisy cues (e.g., behavior, condition).  
     - **Motivating case**: Your (viii) — field agents observe cues (e.g., hunger signals), not payoff matrices.  
     - **Diagnostic role**: Rules out models assuming payoff awareness (e.g., some game-theoretic reciprocity). Favors cue-based mechanisms (e.g., biological markets using partner quality).

  8. **Distinguish true evolutionary puzzles from byproducts**  
     - **Requirement**: The theory must specify when cooperation is costly and vulnerable to defectors (a puzzle) versus when it is mutualistic or self-serving (not a puzzle).  
     - **Motivating case**: Your (ix) — misclassifying byproducts (e.g., herd safety) as altruism wastes effort on spurious puzzles.  
     - **Diagnostic role**: Forces measurable criteria for "costliness" (e.g., net lifetime fitness loss to actor) and defector invasibility.

  9. **Satisfy the bookkeeping constraint**  
     - **Requirement**: The mechanism must explicitly show how fitness feedback occurs — either through relatedness or assortment-mediated benefits — to offset costs.  
     - **Motivating case**: Your (x) — all empirically supported mechanisms involve assortment (genetic or phenotypic). This is a **consistency constraint**, not negotiable: "cooperation without assortment" is likely a modeling artifact.  
     - **Diagnostic role**: Serves as a reality check; exposes models hiding assortment (e.g., some self-rewarding reciprocity models).

  ---

  ### **Genuine Desiderata vs. Camp-Specific Preferences**
  - **Explicit decision rules/cue sets**: **Genuine requirement**. For diagnostic inference, a theory must specify testable cues (e.g., "agents use spatial proximity as a kinship proxy") and decision rules (e.g., "help if cue > threshold"). Without this, the theory is not falsifiable in the field.  
  - **Universal application to all species**: **Prejudice**. Cooperation mechanisms are system-specific; demanding one theory for all (e.g., "reciprocity everywhere") ignores empirical diversity. Your field systems differ fundamentally (e.g., mutualism vs. breeding), so mechanisms need not be identical.  
  - **Identifiability from observational data**: **Genuine requirement**. If a mechanism requires unmeasurable variables (e.g., perfect reputation tracking), it is useless for field diagnostics. Theories must be testable with feasible data (e.g., relatedness, interaction rates).  
  - **Cognitive plausibility**: **Genuine requirement**. Motivated by your (vi) and (viii); mechanisms demanding implausible computation (e.g., recursive reasoning in indirect reciprocity) fail in natural systems.  

  ---

  ### **Inconsistencies and Trade-offs**
  - **The inconsistency**: You suspect that explaining *one-shot, anonymous, non-kin cooperation* while *preventing invasion by defectors* and *requiring no assortment* is impossible. You are correct.  
    - **What to drop**: Drop the "no assortment" demand. Assortment (genetic or phenotypic) is necessary for any mechanism to satisfy the bookkeeping constraint (desideratum 9). Cooperation in one-shot anonymous settings (e.g., your human lab case) likely involves **hidden assortment** (e.g., cultural group selection, tag-based cooperation) or is **noise** (a byproduct of psychology evolved for assortative contexts).  
    - **Cost of dropping it**: You must accept that assortment is foundational. In practice, this shifts focus to measuring assortment (e.g., via spatial or genetic structure) rather than seeking "assortment-free" mechanisms.  

  - **Most discriminating desideratum**: **Resist collapse under private, noisy information (desideratum 5)**.  
    - **Why**: It immediately invalidates most reputation-based models (e.g., indirect reciprocity) and punitive enforcement, which dominate theoretical literature but fail in cognitively limited/field settings. Organizing your chapter around this forces engagement with realism—aligning with your empirical systems (e.g., no recognition in breeders, noisy mutualisms).  

  ---

  ### **Scorecard of Major Theories**
  *Brief evaluation against the desiderata. Focus: which mechanisms survive your diagnostic standard?*  

  | **Theory**               | **Key Passes**                                                                 | **Key Failures**                                                                                               | **Plausible in Your Systems?**                                                                 |
  |--------------------------|-------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------|
  | **Direct Reciprocity**   | Passes 7 (if cues used).                                                      | Fails 1 (requires known future), 2 (breaks with misimplementation), 3 (needs recognition), 4 (scaling weak). | Unlikely: high dispersal and no recognition in breeders; delayed benefits in mutualism.       |
  | **Indirect Reciprocity** | Passes 4 (scales better than direct).                                         | Fails 1, 3, 5 (private noise collapses it), 6 (second-order free-riding), 7 (assumes payoff awareness).      | Unlikely: cognitively demanding; private assessment in field systems.                        |
  | **Kin Selection**        | Passes all: 1–9. Robust to noise, no recognition needed, scalable.            | Fails only if relatedness is low and undetectable by proxies.                                                | **Strong candidate for breeders**: high assortment despite dispersal. Less clear for mutualism. |
  | **Biological Markets**   | Passes 1 (if future opportunities exist), 4 (scalable), 7 (uses quality cues).| Fails 2 (decoupled benefits break exchanges), 3 (requires partner recognition), 5 (noisy assessment harmful). | Possible in mutualism **if** partners can choose (e.g., based on quality cues).               |
  | **Byproduct Mutualism**  | Passes all except 8: it dissolves the puzzle, so 8 is N/A. Low diagnostic need. | Fails 8 if misapplied to costly cases.                                                                       | **Likely in mutualism** if benefits are self-serving (e.g., "helping" is low-cost foraging).  |
  | **Multilevel Selection** | Passes 1, 3–5, 9 (assortment via group structure).                            | Fails if within-group selection dominates (e.g., high dispersal).                                            | Possible in breeders **if** groups are distinct; weak in mutualism with fluid partnerships.  |

  **Key Takeaways for Your Systems**:  
  - **Cooperative breeder**: Kin selection is the strongest candidate (passes all desiderata, especially no recognition and assortment). If relatedness is low, consider group augmentation (a byproduct mutualism).  
  - **Mutualism**: Byproduct mutualism (if costs are trivial) or biological markets (if partner choice via cues exists). Delayed/redirected benefits rule out direct reciprocity.  

  ---

  ### **Recommendations for Your Synthesis Chapter**
  1. **Organize around the most discriminating desideratum** (private/noisy information) to efficiently narrow mechanisms.  
  2. **Apply the bookkeeping constraint early** to cull assortment-free models.  
  3. **Emphasize field-testable predictions**: For each candidate mechanism, list:  
     - Critical measurements (e.g., for kin selection: relatedness proxies; for markets: partner-switching rates).  
     - "Smoking gun" signatures (e.g., misimplementation costs breaking reciprocity but not kin selection).  
  4. **Acknowledge trade-offs**: E.g., "No mechanism explains one-shot anonymity without hidden assortment; human lab cooperation may be noise or require group-structured cultural evolution."  
  5. **Score candidates rigorously** using your empirical data (e.g., if helpers don't discriminate, reciprocity fails; if benefit delays are long, partner-fidelity fails).  

  This framework ensures your theory evaluation is grounded in diagnosticity, not elegance or unification—aligning with your empirical challenges.
