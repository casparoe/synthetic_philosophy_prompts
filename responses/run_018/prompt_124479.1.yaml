    "microhistory_visible": "Village mobilization networks, ritualistic destruction of manorial records, contingent roles of individuals (Tyler, Ball), local grievances/triggers, chaotic local improvisation.",
    "microhistory_obscured": "Coordinated royal tax policy/long-term fiscal structures, planned military response, broader feudal economic context.",
    "history_from_below_visible": "Peasants/artisans/clergy as primary agents; shared consciousness evidenced by widespread demands (end serfdom, fix rents, remove 'traitors'); coordinated non-elite action (march, London occupation, targeted destruction); formulation of demands.",
    "history_from_below_obscured": "Role of elite divisions/royal weakness enabling revolt; precise mechanisms of royal reassertion; internal diversity of rebel motives; sustainability of non-elite institutions.",
    "state_narrative_visible": "Revolt as crisis of royal authority/poll tax policy; threat to aristocratic order; royal strategy (negotiation/stalling, military suppression); parliamentary taxation; legal restoration of order.",
    "state_narrative_obscured": "Depth/sophistication of rebel motivations/coordination; symbolic meaning of actions; rebels' agency extending beyond tax protest to challenge social hierarchy.",
    "episode_tests_theory": "Confirms microhistory's focus on contingency (Tyler's death) but reveals its limit explaining structural coercion. Supports history-from-below on consciousness/agency but exposes gap explaining durable organization against state power.",
    "unexpressed_residue": "The rapid and decisive reimposition of order through royal military force and legal repression cannot be fully explained by bottom-up lenses alone; the episode's *outcome* fundamentally depends on recognizing the state's monopoly on legitimate violence and its capacity for organized coercion."
  }
