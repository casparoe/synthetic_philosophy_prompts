  For microhistory, I'll highlight village networks (like Essex/Kent communities organizing marches), symbolic acts (burning court rolls), and individual roles (Ball's preaching, Tyler's leadership). The obscured elements would be royal tax policy coordination or long-term fiscal structures. This lens makes contingency vivid—like how Tyler's death at Smithfield altered everything—but risks missing systemic pressures.

