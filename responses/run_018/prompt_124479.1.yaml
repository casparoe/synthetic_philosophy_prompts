  Throughout, I'll flag disputed points (e.g., Ball's influence, consciousness depth) and stick to consensus facts. The user seems academically sophisticated, so balancing clarity with nuance is key—especially in the theory reflection where interpretations diverge.
answer: |-
  Here is the analysis of the 1381 Peasants' Revolt through three historiographical lenses, followed by the structured JSON summary:

  **Analysis:**

  1.  **Microhistory (Scale Reduction):**
      *   **Visible:** Village networks organizing local protests (e.g., Fobbing, Brentwood in Essex); the specific, often ritualistic destruction of manorial court rolls and charters (symbolizing liberation from local obligations); the contingent role of individuals like John Ball (his sermons as catalysts *within* communities) and Wat Tyler (his personal leadership, negotiation style, and the contingency of his death at Smithfield); localized grievances triggering action (e.g., specific abuses by tax collectors, hated local officials); the chaotic, improvisational nature of events at the local level.
      *   **Obscured/Misdescribed:** The coordinated national strategy behind the poll tax (Parliament's role, royal fiscal policy); the long-term structural pressures of feudalism and royal finance driving the tax; the planned royal military response and logistical coordination; the broader economic context of post-Black Death labor shortages. The revolt appears more as a spontaneous eruption of local anomalies than a response to systemic pressures.

  2.  **History from Below (Subordinate Agency):**
      *   **Visible:** Peasants (serfs and free tenants), artisans (urban and rural), lesser clergy (like Ball), and some minor gentry as active agents driving events. Their shared consciousness is revealed in widespread demands: abolition of serfdom ("villeinage"), fixed low rents (4d per acre), free market access ("free trade"), pardon for rebels, and removal of "traitors" (like Sudbury and Hales). Actions like the coordinated march on London, occupation of the city, targeted destruction of symbols of oppression (Savoy Palace, manorial records, tax registers), and formulation of demands at Mile End and Smithfield demonstrate significant collective agency and coordination *outside* elite institutions.
      *   **Obscured/Misdescribed:** The critical role of elite divisions or royal weakness in creating the opportunity for revolt; the precise mechanisms of how royal authority ultimately reasserted control (beyond Tyler's death); the diversity of motives *within* the rebel ranks (some seeking radical social change, others focused narrowly on tax relief or local grievances). The quick collapse *after* Tyler's death does not inherently undermine the claim of agency. It can be interpreted as showing that such bottom-up agency, while powerful, operates within and is ultimately vulnerable to the overwhelming coercive power of the state – it's overdetermined by state structures, not negated by defeat. The agency was real in the uprising itself.

  3.  **State-Centered Narrative (Crisis of Authority):**
      *   **Visible:** The revolt as a crisis triggered by state policy: the deeply unpopular and poorly administered poll taxes of 1377, 1379, and 1380/81; the challenge to royal authority (Richard II's youth, regency divisions); the perceived threat to the aristocratic social order; the royal response: initial negotiation (Mile End) as a stalling tactic, followed by decisive military action and legal repression after Smithfield; the restoration of order through charters (later revoked) and punitive measures; Parliament's role in taxation and the subsequent backlash. Explains the *framework* of power the rebels operated within and against.
      *   **Obscured/Misdescribed:** The depth, sophistication, and shared motivations of the rebels themselves; their internal coordination and communication networks; the symbolic meaning of their actions (burning records); the fact that demands extended far beyond just tax relief to fundamental challenges of serfdom and social hierarchy; the agency and initiative of the rebels, portraying them largely as reactors to state policy or a chaotic mob.

  **Theory Tested by the Episode:**

  *   **Microhistory:** The rapid dissolution *after* Tyler's death strongly **confirms** the microhistorical emphasis on contingency and the critical role of individual leadership/personality. Tyler's death was a specific, contingent event that immediately fractured rebel unity and resolve. However, the episode *also* **reveals a limit** of pure microhistory: it struggles to fully account for the *structural coercion* that made such a collapse inevitable once leadership was removed and the state mobilized its forces. The revolt's spread across counties suggests underlying structural pressures microhistory might downplay.
  *   **History from Below:** The remarkable geographic spread (Essex, Kent, beyond) of remarkably similar demands (ending serfdom, fixed rents, removal of "traitors") strongly **supports** the history-from-below thesis about emergent collective consciousness and shared grievances transcending purely local concerns. However, the absence of any durable rebel organization capable of sustaining resistance after the initial uprising and leadership decapitation **exposes a gap** in the framework. While it effectively captures the *expression* of agency and consciousness, it struggles to explain the *sustainability* of such movements against entrenched state power without developing its own resilient institutions, highlighting the enduring challenge of overcoming state structures.

  *(Contested Interpretation Note: The *depth* and *uniformity* of "class consciousness" is debated. While demands were similar, historians argue whether this reflected a coherent revolutionary ideology or a more pragmatic convergence of localized grievances amplified by communication during the revolt itself. The interpretation of the collapse also varies – was it inevitable due to state power, or could better organization have sustained it?)*

