prompt: |-
  Analyze the 1381 Peasants' Revolt in England—the rising led by Wat Tyler and John Ball, the destruction of manorial records, the march on London, the Mile End meeting with Richard II, and the rapid suppression after Tyler’s death—through two distinct bottom-up historiographical lenses. First, apply microhistory as a method of scale reduction that treats local, anomalous events and individual actors as significant in their own right rather than as illustrations of large structures. Second, apply history from below as a framing that takes subordinate groups—peasants, artisans, local clergy—as primary historical agents rather than as background to state action. Contrast both with the elite/state-centered narrative that frames the revolt chiefly as a crisis of royal authority, poll-tax policy, and aristocratic order.

  For each of the three frames, specify precisely which actors, documents, and actions become visible and which are obscured or misdescribed. Under microhistory, consider village-level networks that organized the march, the symbolic burning of legal rolls, and the contingent role of local preachers; identify what this scale makes invisible about coordinated royal strategy or long-term fiscal structure. Under history from below, examine whether the revolt reveals a shared collective consciousness among rebels (e.g., common demands to end serfdom and fix rents) and durable agency outside elite institutions; then say whether the quick collapse after Tyler’s killing undermines that claim or merely shows that bottom-up agency is always overdetermined by state power. Under the state-centered lens, note what it explains well—parliamentary taxation, the royal military response, the legal restoration of order—and what it suppresses about local motivation and non-elite coordination.

  Then run the analysis in reverse: tell me what the episode shows about the theories themselves. Does the rapid dissolution of the uprising after the decapitation of its leadership confirm a microhistorical emphasis on contingency and local personality, or does it reveal that microhistory cannot account for structural coercion? Does the geographic spread of similar demands across Essex and Kent support a history-from-below thesis about class consciousness, or does the absence of lasting organization reveal a gap in that framework? Be explicit about where your answer depends on contested interpretation rather than on the broadly agreed outline of events.

  After your analysis, provide a brief structured summary as a JSON object with exactly these fields:
  - "episode_tag": a short identifying label
  - "microhistory_visible": what the scale-reduction lens reveals
  - "microhistory_obscured": what it hides or distorts
  - "history_from_below_visible": what the agency-framing reveals
  - "history_from_below_obscured": its blind spots or failures
  - "state_narrative_visible": what the elite/state lens captures
  - "state_narrative_obscured": what it suppresses
  - "episode_tests_theory": whether the episode confirms, challenges, or exposes limits in the bottom-up theories
  - "unexpressed_residue": what about the revolt cannot be captured by either bottom-up framework without importing state-centered concepts

  Stick to commonly known facts about the revolt; do not invent obscure documentary details, and flag any claim that rests on scholarly dispute rather than general knowledge.
