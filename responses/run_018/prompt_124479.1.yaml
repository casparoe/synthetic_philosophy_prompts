  The state-centered narrative efficiently explains poll taxes, Richard II's crisis management, and aristocratic restoration. But it flattens rebel motivations into "tax resistance" and ignores their sophisticated coordination. 

  Now reversing the analysis: Tyler's assassination does support microhistory's focus on contingency, yet the revolt's regional spread hints at deeper structures microhistory might underplay. Similarly, the geographic unity of demands bolsters history from below's class consciousness argument, but the lack of lasting organization challenges its durability claims. These tensions show both theories' limits—they illuminate facets but can't fully explain collapse without acknowledging state coercion.

