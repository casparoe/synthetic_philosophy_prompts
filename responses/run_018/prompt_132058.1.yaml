  First, I need to identify the core issue: the user is stuck on whether standing is binary (either you have it or not) and if structural hypocrisy forces a shift to a scalar view. They worry that if structural hypocrisy removes standing, then anyone in an unjust system can't blame others within it, which might make blame impossible. 

  The user mentions conflating logical coherence with relational entitlement. That's a key point. The friend's performative contradiction is about logical consistency, but standing in blame is more about moral authority and relational dynamics. So the error might be treating standing like a logical property rather than a normative one. 

  The structural hypocrisy example shows that the problem isn't just a single contradictory act but ongoing complicity in a system. This complicity might weaken standing without completely removing it. For instance, someone criticizing factory farming while using products with exploitative supply chains might still have some standing, but their criticism could be less effective or credible. 

  The user's vulnerability is in assuming that if standing isn't binary, then it becomes a vague purity test. But actually, standing can be scalar and context-dependent. Factors like the blamer's commitment to change, their level of complicity, and the specifics of the situation matter. The binary model breaks down here because it can't accommodate degrees of complicity or effort to reform. 

  To change the user's mind, someone might argue that structural complicity is unavoidable in modern society, so requiring total purity would paralyze moral discourse. Instead, we should focus on the blamer's acknowledgment of their complicity and efforts to mitigate harm. Also, distinguishing between levels of participation—direct vs. indirect—could preserve standing for those making significant efforts. 

  The user's reasoning is most vulnerable in equating all forms of complicity. Not all participation in unjust systems is equal. Someone actively fighting against the system while minimally participating might retain more standing than someone passively benefiting. The key is whether the blamer's actions align with their words beyond mere logical consistency.
answer: |-
  Your reasoning highlights a crucial tension in the philosophy of blame, and the flaw lies in **equating logical coherence with moral standing** and **treating standing as universally binary**. Here's the diagnosis and resolution:

  ### The False Presupposition
  You presuppose that **moral standing must derive solely from logical consistency (performative contradiction)** *or* collapse into a **vague "moral purity" threshold**. This is a false dichotomy. Standing to blame is fundamentally a *relational, normative concept* rooted in **moral authority and integrity of address**, not purely logical coherence. The "binary assumption" breaks down because:
  1. **Standing is domain-specific and scalar**: One can lack standing to blame for *specific wrongs* while retaining it for others. A sweatshop exploiter lacks standing to condemn *labor exploitation* but may retain standing to condemn unrelated wrongs (e.g., theft).
  2. **Contradiction is not the sole ground for lost standing**: Philosophers (e.g., Macalester Bell, R. Jay Wallace) argue standing is lost through:
     - **Hypocrisy** (condemning what you freely practice)
     - **Complicity** (participating in the same structural wrong)
     - **Moral taint** (benefiting from the wrong without resisting)
  3. **Structural hypocrisy operates differently**: It undermines standing through **failure of normative alignment**, not logical contradiction. If you condemn system S while willingly participating in S, your blame *expresses a failure to align your actions with your normative commitments*. This damages your credibility as a moral agent in that domain, even without token-identical acts.

  ### Why the Binary Model Fails
  Your industrial agriculture example reveals the flaw:
  - **Binary logic**: If mere participation in any unjust system removes standing absolutely, then *all modern humans* lack standing to blame *any* systemic injustice (capitalism, climate harm, etc.). This paralyzes moral discourse.
  - **Scalar reality**: Standing is diminished proportionally to:
    - **Degree of complicity** (direct vs. indirect participation)
    - **Avoidability** (could you reasonably exit the system?)
    - **Efforts to resist** (do you actively mitigate harm?)
  A critic of factory farming who eats plant-based but uses smartphones *might* have reduced standing to blame a *meat-eating factory farm CEO*—but retains standing to blame *less complicit actors* or to advocate for systemic change, especially if they acknowledge their complicity and work to reduce it.

  ### What Would Change My Mind
  I would concede that structural hypocrisy *never* undermines standing if:
  1. **Moral critique requires no relational integrity**: An argument demonstrating that blame's efficacy depends *only* on the target's wrongdoing, not the blamer's moral position (e.g., proving blame is purely "fact-stating" rather than a normative demand).
  2. **Structural complicity is normatively irrelevant**: Evidence that participation in unjust systems—absent direct contradiction—cannot impair one's authority to condemn them (e.g., showing that *all* blame is valid if the target *is* guilty, regardless of the blamer's actions).
  3. **Standing is indefensible as a concept**: A compelling case that "standing" is incoherent (e.g., revealing that hypocrisy/complicity objections are always *ad hominem* fallacies).

  ### Where My Reasoning is Most Vulnerable
  1. **Overextension of complicity**: If *any* participation in modernity (e.g., using electricity from coal) counts as "structural hypocrisy," the concept becomes so broad it *does* risk moral paralysis. The distinction between **direct/material support** vs. **diffuse societal entanglement** needs careful defense.
  2. **Threshold vagueness**: I claim standing is scalar, but offering clear criteria for *when* complicity sufficiently undermines standing is challenging. Is it 10% effort to resist? 50%? This risks sliding into the "purity test" you fear.
  3. **Ignoring epistemic standing**: Even a hypocrite may correctly identify wrongdoing. Dismissing their blame *entirely* might obscure truths. My view must account for why we should sometimes heed hypocrites' critiques despite their compromised standing.

  ### Resolution: A Hybrid Model
  Standing is **conditionally binary within specific contexts** but **scalar across domains**. For a given blame act addressing wrong W:
  - **Binary question**: Is the blamer's authority over W compromised by their own actions regarding W?
    - *Performative contradiction*: Absolute loss of standing (logical incoherence).
    - *Structural hypocrisy*: Standing lost *if* their complicity in W is voluntary, avoidable, and unacknowledged.
  - **Scalar adjustment**: Severity of complicity affects the *weight* of their blame, not its permissibility. A complicit blamer should:
    - Acknowledge their role ("I'm part of this too, but...").
    - Focus on collective responsibility over individual shaming.

  This avoids collapsing blame into purity contests while honoring the intuition that unaddressed complicity corrodes moral authority. The grocer who profits from migrant exploitation lacks standing to *shame a worker* for crossing borders illegally—but may retain standing to *condemn the system* if they advocate for reform and expose their own complicity.

  *Would any of these counterarguments shift your view, or does the scalar approach still feel like moral gatekeeping?*
