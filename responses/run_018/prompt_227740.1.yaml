answer: |-
  ## Joint Statement on Frankfurt Cases and Moral Responsibility
  **Authored by Dr. Alistair Finch (Pro-Frankfurt) & Dr. Beatrice Vance (Pro-PAP)**
  **Date:** October 26, 2023

  After extensive, often circular, debate within our reading group on the implications of Frankfurt-style cases (FSCs) for the Principle of Alternative Possibilities (PAP) – the claim that an agent is morally responsible for an action only if they could have done otherwise – we, representing contrasting viewpoints, commit to this adversarial collaboration. Our goal is not to resolve the dispute definitively but to clarify the precise points of contention, identify shared ground, and articulate testable predictions for future analysis. We focus primarily on "Black-style" cases involving a counterfactual intervener (e.g., Black) who monitors the agent via a "prior sign" and is poised to intervene only if the sign indicates the agent will *not* perform the target action.

  **I. Agreed Foundational Claims:**

  1.  **Counterfactual Intervener Requirement:** For an FSC to be relevant to the PAP debate, the counterfactual intervener (e.g., Black) must *not* act in the actual sequence of events leading to the agent's action. The intervention remains purely dispositional. If the intervener acts, the case ceases to be a challenge to PAP concerning *that specific action* (though other complexities arise).
  2.  **Actual Sequence Ownership:** In the actual sequence of a proper FSC, the agent’s decision and action must be genuinely their own, stemming from their own reasons, deliberations, and psychological states. There must be no actual coercion, manipulation, or direct causation by the intervener in the sequence where the action occurs.
  3.  **Prior Sign Reliability:** The prior sign (e.g., a blush, a neural precursor) used by the intervener to predict the agent's choice must be sufficiently reliable to justify the intervener's confidence and readiness to intervene. Its reliability is crucial for the case to function as intended.
  4.  **Scope of the Debate:** This debate specifically concerns whether PAP is a *necessary condition* for *moral responsibility* for a particular action. It is *not* primarily a debate about:
      *   The truth or falsity of causal determinism.
      *   The compatibility of determinism with moral responsibility *in general* (compatibilism vs. incompatibilism). Both compatibilists and incompatibilists can take positions on PAP.
      *   The *sufficiency* conditions for moral responsibility.
  5.  **Core Concept of Moral Responsibility:** We share a broadly Strawsonian understanding of moral responsibility as grounded in our practices of attributing actions to agents in ways that make them appropriate targets of reactive attitudes (like praise, blame, resentment, gratitude) *because* the action reflects something about the agent's quality of will, judgment, or deep self. Responsibility requires that the agent "owns" the action in a normatively significant way, involving some minimal level of reasons-responsiveness.

  **II. Points of Disagreement:**

  | Point of Disagreement                                                                                            | Finch's View (Pro-Frankfurt)                                                                                                 | Vance's View (Pro-PAP)                                                                                                                     |
  | :--------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Do FSCs successfully refute PAP?**                                                                          | Yes. FSCs show agents can be morally responsible for actions they could not have avoided performing. PAP is false.           | No. FSCs fail to demonstrate responsibility without alternative possibilities; either the prior sign creates a dilemma or a "flicker" remains. |
  | **2. Is a "flicker of freedom" (e.g., wavering, considering) sufficient to preserve PAP?**                      | No. Such flickers are either irrelevant to the specific action performed or too thin to ground the kind of control PAP requires. | Yes. Responsibility tracks the agent's exercise of control *at the moment* of choice, which requires *some* alternative possibility, however brief or thin. |
  | **3. Does the "Dilemma Defence" successfully shield PAP?**                                                       | No. The dilemma mischaracterizes FSCs. The prior sign need only be reliable, not deterministic; indeterministic flickers are insufficient. | Yes. FSCs are fatally flawed: if the prior sign is deterministic, the case assumes incompatibilism is false; if indeterministic, alternatives remain. |
  | **4. Does the agent installing the intervener themselves (vs. external imposition) affect responsibility?** | Yes. Self-installation can strengthen the argument for responsibility by demonstrating pre-commitment/endorsement.          | No, regarding PAP. The source of the intervener may affect *other* responsibility factors, but not the *necessity* of alternatives for the act itself. |

  **III. Key Cruxes and Predictions:**
  We identify the following core disagreements ("cruxes") where our views predict different outcomes. To facilitate future testing, we state concrete cases/arguments and our contrasting predictions.

  1.  **The Prior Sign Crux:**
      *   **Case/Argument:** Consider an FSC where the prior sign is demonstrably *indeterministic* – it reliably correlates with the subsequent choice but does not causally determine it with 100% certainty due to inherent randomness. (E.g., a neurological precursor that, given the agent's state, has a 99.9% chance of indicating the choice correctly, but a 0.1% chance of misfiring.)
      *   **Finch Prediction:** This case still defeats PAP. The tiny chance of misfire does not constitute a *robust* alternative possibility relevant to grounding moral responsibility for the actual choice made. Jones remains responsible. The case works.
      *   **Vance Prediction:** This case *preserves* PAP. The inherent indeterminism means Jones *could* have done otherwise (e.g., if the sign misfired, Black might not have intervened, or intervened incorrectly). This genuine, albeit small, possibility is sufficient to satisfy PAP. The case fails to refute PAP.

  2.  **The Sufficiency of Flickers Crux:**
      *   **Case/Argument:** Consider an FSC where the *only* possible "flicker" is the agent experiencing a fleeting, involuntary, and causally inert feeling of doubt *immediately before* consciously forming the irrevocable intention to act (e.g., a micro-second neural blip of "uncertainty" reliably detected as the prior sign). The agent cannot act *on* this flicker; it is epiphenomenal to the decision process.
      *   **Finch Prediction:** Jones is responsible. This flicker is irrelevant to his agential control over the decision and action. It does not constitute a genuine alternative possibility he could have enacted. PAP is refuted.
      *   **Vance Prediction:** Jones is *not* responsible (or PAP is preserved). The presence of this flicker, detectable and used by Black, means Jones *could* have had a different occurrent mental state immediately prior to commitment, representing a thin but real alternative possibility necessary for the kind of control responsibility requires. PAP stands.

  3.  **The Self-Imposed Intervention Crux (Ulysses Case):**
      *   **Case:** **Ulysses Case:** Jones, worried he'll cave under pressure and betray a friend at tonight's meeting, spends the afternoon installing a device that would force his hand to sign the betrayal document if and only if he started to waver. Come the meeting, he never wavers at all — he signs entirely on his own, coolly and deliberately, while the armed device watches and does nothing.
      *   **Variant A:** Jones installs the device himself.
      *   **Variant B:** A neuroscientist (Black) installs the identical device without Jones's knowledge or consent.
      *   **Variant C:** In either Variant A or B, Jones *does* waver, triggering the device to force the signing.
      *   **Finch Prediction:**
          *   *Variant A & B (No Waiver):* Jones is responsible for signing in both A and B. The actual sequence involves his own cool, deliberate choice. PAP is refuted.
          *   *Variant A (Waiver):* Jones is *still* responsible. He designed and installed the mechanism knowing its function, effectively outsourcing the act to his past self/device when weakness strikes. He is responsible for the betrayal *via* this mechanism.
          *   *Variant B (Waiver):* Jones is *not* responsible. The neuroscientist's intervention severs the link to Jones's agency; the signing is Black's doing.
      *   **Vance Prediction:**
          *   *Variant A & B (No Waiver):* Jones is responsible in both A and B. *However*, this is consistent with PAP because *at the moment of signing*, he *could* have wavered (triggering the device). The alternative possibility (wavering) existed, satisfying PAP. The case fails to refute PAP.
          *   *Variant A (Waiver):* Jones is *not* responsible for the *specific act of signing* performed by the device. He is responsible for *setting up the trap* that led to the betrayal, but not for the compelled signing itself. PAP is preserved for the signing action.
          *   *Variant B (Waiver):* Jones is *not* responsible for the signing. PAP is preserved (he couldn't avoid the signing once wavering began).

  **Conclusion:**
  We agree that Frankfurt cases demand careful setup focusing on actual sequence ownership and counterfactual intervention. We agree on the core question concerning PAP's necessity. Our fundamental disagreements center on the interpretation of prior signs, the normative significance of "flickers of freedom," and the implications of self-imposed constraints. The Ulysses case highlights our divergent views on the robustness of alternatives and the scope of responsibility when mechanisms are self-imposed. By articulating these shared foundations, disagreements, and testable predictions regarding concrete cases, we hope to move beyond circular debate and provide a clearer map for ongoing investigation into the relationship between alternative possibilities and moral responsibility.

  **Signed,**
  Dr. Alistair Finch
  Dr. Beatrice Vance
