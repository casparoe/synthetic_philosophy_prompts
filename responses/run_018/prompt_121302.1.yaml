answer: |-
  ## Proposal: The Fragility of Agency in Death in Damascus  
  **Seminar:** Advanced Decision Theory  
  **Word Count:** ~6,000 words  

  ### 1. Core Question
  **Does the distinctive instability in the Death in Damascus dilemma fundamentally depend on the agent's capacity for self-prediction, rather than the nature of the predictor or the decision rule employed?**  

  **Precise Hypothesis:** *The instability (where the agent perceives the recommended action as self-defeating precisely because she can predict she will choose it) vanishes when the agent lacks the capacity to predict her own choice or decision procedure’s output. This instability persists even if predictor reliability, value asymmetry, or access to randomization tools are varied, provided self-prediction capacity is held constant. Conversely, removing self-prediction capacity eliminates the instability, regardless of other variations.*  

  ### 2. Why the Obvious Answers Leave the Question Open
  Existing approaches fail to isolate the role of agent self-knowledge:  

  *   **Causal Decision Theory (CDT) Response ("Bad News"):**  
      CDT correctly identifies that the choice *causes* nothing about the predictor’s past action. It recommends going to the nicer city. However, this dismisses the agent’s epistemic predicament: *knowing* she will choose the CDT-recommended action gives her strong evidence the predictor foresaw this and is waiting there. CDT treats this knowledge as irrelevant "bad news," but the instability arises *because* the agent possesses this self-knowledge and must act on it. CDT doesn’t explain *why* possessing this knowledge creates a perception of self-defeat; it merely asserts the knowledge should be ignored. This leaves open whether the instability is inherent to the decision rule or to the agent’s epistemic state.  

  *   **Evidential/Refutationist Response ("Dissolving the Problem"):**  
      Approaches focusing on evidence or ratifiability (like Evidential Decision Theory (EDT) or Ratificationism) argue the choice *is* evidence about the predictor's location. They often recommend mixed strategies or rejecting the initial dilemma structure. While they acknowledge the epistemic link, they often *build the agent’s self-knowledge into the problem setup implicitly*. By treating the agent’s deliberation as part of the evidence stream, they presuppose the agent can access what her choice *will be* or what her evidence *will be* upon choosing. This approach risks conflating the source of the instability (the agent’s self-prediction capacity) with the decision rule’s response to it. It doesn’t isolate whether the instability *arises* from the rule or from the agent’s epistemic capacity that the rule then processes.  

  *   **The "Inherent Instability" View:**  
      One might argue that any view acknowledging the evidential link inherently contains the instability. However, this conflates the *existence* of an evidential link (Feature 1 - predictor reliability) with the *agent’s awareness of her own choice’s evidential significance* (Feature 2 - self-knowledge). The core question is whether the instability requires the agent to *use* her capacity to predict her own choice to see the link. Does the instability arise for an agent who knows the predictor is highly reliable but cannot predict her *own* choice?  

  **The Gap:** None of these responses cleanly separates the *source* of the perceived self-defeat (the agent’s capacity to predict her own choice and see its evidential consequences) from the *decision rule’s subsequent handling* of that perception. They don’t test if the instability exists *without* that capacity.  

  ### 3. Method: Isolating Features through Variants
  The project will systematically construct variants of Death in Damascus, holding three features constant while varying the fourth, to test the hypothesis. Instability is operationally defined as: **the agent perceiving a conflict where the action recommended by a seemingly reasonable decision rule (e.g., CDT) is seen by the agent herself as strong evidence that performing it leads to the worst outcome.**  

  | Feature Varied          | Holding Others Constant                     | Test Variant Construction                                                                                                                                                                                                                                                               | Test for Instability                                                                                                                                                                 |
  | :---------------------- | :------------------------------------------ | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Predictor Reliability** | 2 (No Self-Pred), 3 (No Alt Tools), 4 (Fixed Values) | **High (99.9%):** Standard predictor. **Type-Based (95%):** Predictor reliable for "agents like you" but not necessarily *you specifically*. **Perfect (100%):** Logical omniscience assumed.                                                                                              | *If instability vanishes in Type-Based variant even with self-prediction held, reliability is key. If instability persists in Type-Based/Perfect with No Self-Pred, self-pred is key.* |
  | **2. Agent Self-Knowledge** | 1 (High Rel), 3 (No Alt Tools), 4 (Fixed Values) | **Self-Predicting:** Agent can reliably simulate her decision process/output. **Opaque Procedure:** Agent knows her decision rule (e.g., "I use CDT") but *cannot* predict its output for this specific choice (e.g., due to computational limits/random seed). **Naive:** Only knows predictor's reliability, not her own rule's details. | ***Crucial Test:** Does instability only appear in the Self-Predicting variant? If instability vanishes in Opaque/Naive variants, self-pred is key.*                                  |
  | **3. Alternative Tools**    | 1 (High Rel), 2 (Self-Pred), 4 (Fixed Values) | **No Tools:** Must decide "directly". **Coin Available:** Can flip a fair coin to decide. **Delegate Available:** Can irrevocably delegate the choice to another agent who *cannot* self-predict. **Pre-Commitment:** Made a binding choice yesterday.                                     | *If instability persists even with Coin/Delegate/Pre-Commitment available to the Self-Predicting agent, then tools don't resolve the core epistemic tension. They are workarounds.*   |
  | **4. Value Structure**     | 1 (High Rel), 2 (Self-Pred), 3 (No Alt Tools) | **Standard:** Death = -∞, Nice City = +10, Bad City = +0 (if alive). **Large Disvalue:** Death = -1,000,000, Nice = +10, Bad = +0. **Symmetric Payoffs:** Both cities offer +10 if alive; death = -∞/-1M. **Asymmetric Payoffs:** Nice = +20, Bad = +0; death = -∞/-1M.                | *If instability persists even with finite death/Symmetric Payoffs for the Self-Predicting agent, then infinite disvalue/asymmetry isn't the core driver.*                             |

  **Avoiding Question-Begging:**  
  1.  **Define Instability Precisely:** Focus on the *agent's internal perception* of self-defeat regarding the CDT-like recommendation ("Go Nice"), not external judgments of rationality.
  2.  **Contrast Agents, Not Rules:** Frame variants by changing the *agent's epistemic capacities or tools*, not by changing the decision rule she uses. Hold the rule (e.g., CDT) constant across Self-Predicting vs. Opaque agents.
  3.  **Identify Stable Points:** Look for variants where the agent *lacks* instability *and* confidently identifies a non-self-defeating choice (e.g., the Opaque agent using CDT to choose "Go Nice" without fearing this choice signals doom).
  4.  **Focus on Necessity/Sufficiency:** Argue that Self-Prediction is *necessary* for instability because variants without it lack instability *even when other features are extreme* (e.g., perfect predictor, infinite disvalue). Argue it is *not sufficient alone* by showing that with Self-Prediction held, changing other features (e.g., to symmetric finite values) doesn't *always* remove instability, demonstrating its robustness to those changes.

  ### 4. Expected Outcomes & Failure Conditions
  *   **Positive Result:** The analysis demonstrates:
      *   Instability reliably appears only when Feature 2 (Self-Knowledge/Self-Prediction) is present.
      *   Varying Features 1, 3, or 4 *while holding Feature 2 constant* does not reliably eliminate instability.
      *   Removing Feature 2 *while holding Features 1, 3, or 4 constant* reliably eliminates instability.
      *   This supports the hypothesis that the core paradox stems from the agent's epistemic access to her own impending choice within a reliable predictive loop, not primarily from the decision rule, predictor type, values, or lack of tools.
  *   **Negative Result / Project Failure:** The analysis reveals:
      *   Instability can be reliably eliminated by varying Feature 1 (e.g., using Type-Based reliability) or Feature 4 (e.g., symmetric payoffs) *even when Feature 2 is present*, or
      *   Instability persists in some variants *even when Feature 2 is absent* (e.g., the Naive agent still feels trapped).
      *   This would falsify the hypothesis, showing self-prediction is neither necessary nor sufficient for the distinctive instability. The core driver lies elsewhere (likely the combination of high reliability and evidential linkage, irrespective of self-knowledge).
  *   **Bracing For:** A negative or mixed result is plausible. The literature often emphasizes predictor reliability (Feature 1) as fundamental. Demonstrating that instability *can* persist even with Type-Based reliability or finite values, provided self-prediction is present, would be a significant finding supporting the hypothesis. Conversely, showing instability *requires* perfect prediction or infinite disvalue, even with self-prediction, would refute it. Mixed results might show self-prediction is necessary but insufficient without specific reliability/value structures.

  ### 5. Scope Assessment & Minimal Viable Project
  *   **Cuts Required (6,000 words):**
      *   **Literature Review:** Deep engagement with specific authors (Nozick, Gibbard, Harper, Joyce, Ahmed etc.) must be minimal. Key positions will be characterized generically (as above).
      *   **Full Exploration of All Features:** Cannot exhaustively test every combination. Will focus on the *most telling contrasts* for each feature against the Self-Prediction baseline (e.g., Type-Based Rel vs Perfect/High; Opaque vs Self-Pred; Coin vs No Tools; Symmetric Finite vs Standard).
      *   **Formal Modeling:** Will use precise descriptions and decision matrices, but extensive game-theoretic or probabilistic modeling will be limited. Focus is on conceptual clarity and intuitive force.
      *   **Alternative Decision Rules:** Detailed analysis of EDT, Ratificationism, or Timeless Decision Theory will be secondary, used only to illustrate responses to the instability, not evaluated in depth.
  *   **Expansion Risks:** Threads likely to balloon:
      *   Defending the coherence/plausibility of the "Opaque Procedure" agent.
      *   Fully addressing the "Why not just flip a coin?" objection and its nuances.
      *   Exploring connections to Newcomb's Problem or other dilemmas in depth.
  *   **Minimal Viable Project:** Focus exclusively on **isolating Feature 2 (Self-Knowledge) against Feature 1 (Reliability)**. Construct 4 core variants:
      1.  Self-Predicting Agent + High Reliability Predictor (Unstable)
      2.  Opaque Procedure Agent + High Reliability Predictor (Stable?)
      3.  Self-Predicting Agent + Type-Based Reliability Predictor (Stable? Unstable?)
      4.  Opaque Procedure Agent + Type-Based Reliability Predictor (Stable)
      Argue that the instability in (1) and its absence in (2) demonstrates the necessity of self-prediction. Argue that the presence/absence of instability in (3) shows self-prediction's role persists even when reliability is weakened. This core would still test the hypothesis effectively within the word limit.

  ### 6. Uncontroversial vs. Contested Claims (as requested)
  *   **Uncontroversial:** The Death in Damascus setup involves a highly reliable predictor, a fatal outcome linked to prediction, and a conflict between causal and evidential reasoning. CDT recommends going to the nicer city. EDT often recommends staying or mixing. The case feels paradoxical.
  *   **Contested (Your Hypothesis Challenges):** The strong current view holds that **predictor reliability type (Feature 1 - especially perfection or near-perfection keyed to the specific agent)** is the *primary* or *essential* driver of the paradox. Many see the infinite disvalue of death (Feature 4) as crucial for generating the high stakes that make the conflict acute. Your claim that self-prediction (Feature 2) is the *core* necessary element directly challenges these priorities.
  *   **Contested (Your Hypothesis Engages):** The role of self-knowledge/self-prediction (Feature 2) is acknowledged but **not isolated as the fundamental source of instability**. It's often seen as a *consequence* of the predictor's reliability or as a background assumption. Views differ significantly on whether tools (Feature 3) genuinely "solve" the problem or merely bypass the agent's epistemic predicament. Your hypothesis places Feature 2 center stage as the *generator* of instability.
  *   **No Settled Opinion:** There is no consensus on whether the instability *requires* the agent to be able to predict her own choice, or if it arises solely from the external predictor structure. The coherence and relevance of the "Opaque Procedure" agent are actively debatable. The precise minimal conditions for the paradox are not agreed upon. Your project directly targets these unsettled points.

  This proposal aims to reframe the Death in Damascus debate by rigorously testing whether the agent's capacity for self-prediction is the linchpin of its distinctive instability, a hypothesis that challenges conventional prioritization of predictor reliability but offers a potentially unifying explanation centered on the agent's epistemic predicament.
