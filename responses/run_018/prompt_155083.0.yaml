answer: |-
  Here's a complete classical Bell-like experiment using your specifications, with clear reasoning for each interpretation. The setup violates local realism without quantum mechanics.

  **Core Setup:**
  - **Players:** Maya (M), Leo (L), Nina (N), each in isolated buildings.  
  - **Choices:** Each round, they *independently* pick **Left (L)** or **Right (R)**.  
  - **Envelopes:** A bike courier visits all three in a fixed order (say, M→L→N). After collecting choices, the courier prepares sealed envelopes containing **Green (G)** or **Red (R)** based on a deterministic rule (see below).  
  - **Win Conditions (deterministic):**  
    - **All pick Left (LLL):** *Even* number of Greens (0 or 2 Greens).  
    - **Exactly one Left (LLR, LRL, RLL):** *All three envelopes Green*.  
    - **All pick Right (RRR):** *Odd* number of Greens (1 or 3 Greens).  

  **The Winning Strategy:**  
  The courier uses this algorithm *after* collecting all choices:  
  1. **If choices = LLL:** Make exactly two envelopes Green (e.g., M&L get G, N gets R).  
  2. **If exactly one Left (e.g., M:L, L:R, N:R):** All three get Green.  
  3. **If choices = RRR:** Make exactly one envelope Green (e.g., only M gets G).  
  *This guarantees 100% win rate* — impossible for local hidden variables.  

  ---

  ### **Interpretations:**  
  **1. Local Hidden Variables (Pre-agreed Plan):**  
     - **Assumption:** Players pre-share a fixed response table (e.g., "If Maya picks Left, Leo always outputs Green if...").  
     - **Why it fails:** The win conditions create logical contradictions. For example:  
       - In **LLL**, at least one player must output Red to get *even Greens*.  
       - But if Maya picks **L** and Leo/Nina pick **R** (scenario **LRR**), *all must output Green*.  
       - Now suppose Maya pre-agrees: "If I pick L, and others pick R, I output G." But if Leo/Nina both pick L (making it **LLL**), Maya must output R for even Greens — contradicting her earlier rule.  
     - **Result:** No fixed strategy satisfies all conditions simultaneously. Max success rate is 75% (e.g., failing in LLL or RRR).  

  **2. Non-Local Correlation (Courier Violates Parameter Independence):**  
     - **How it works:** The courier’s envelope rule *depends on all three choices combined*. This creates instant (but classical) non-locality:  
       - Maya’s envelope color isn’t determined until *after* Leo and Nina’s choices are known to the courier.  
       - This violates "parameter independence" (local choices shouldn’t affect distant outcomes).  
     - **Why it wins:** The courier acts as a non-local mediator, adjusting envelopes globally to match the win conditions. No hidden variables — just real-time correlation via the courier’s path.  

  **3. Superdeterminism (Shared Past Causes):**  
     - **Assumption:** Everything (choices + courier’s envelopes) was predetermined by initial conditions (e.g., cosmic state at Big Bang).  
     - **Structural Feature:** The *courier’s fixed route* is critical. Its path is "entangled" with players’ choices via past causes.  
       - Example: Cosmic initial conditions ensure that whenever Maya picks Left, the courier’s future envelope assembly already "knows" Leo will pick Right.  
     - **What collapses with a random drone:** If the courier is replaced by a drone that randomizes its route *after* choices are made, superdeterminism fails. Randomization severs the "shared past cause" link between choices and envelope order, making predetermined outcomes impossible.  

  ---

  ### **Hardline Local Realist Attack:**  
  A local realist would argue:  
  *"The courier is smuggling choice information between players via envelope assembly. When the courier leaves Maya’s building with her choice, that data is physically carried to Leo and Nina — violating locality. Leo’s envelope isn’t independent; it’s influenced by Maya’s choice through the courier’s actions. This isn’t ‘non-locality’—it’s classical information leakage!"*  

  **Rebuttal:** Choices are sealed and inaccessible during delivery (no "data on the outside"). The realist’s objection conflates *correlation* with *causation*. The courier doesn’t "leak" choices; it uses them *after collection* to define a global outcome. This is identical to quantum non-locality: outcomes are correlated without signal transmission.  

  ---

  ### **Why This Violates Local Realism:**  
  - **Local hidden variables** cap success at 75% for these win conditions (provable via Bell inequality).  
  - **Experimentally**, 100% success over hundreds of rounds falsifies local realism — *unless* you invoke superdeterminism or accept non-local correlation.  

  Sarah might call this "cheating" because the courier enables non-classical correlation. Counter: The courier is just a classical channel — like a wire in a computer. The violation stems from *topology*: choices are space-like separated, yet outcomes depend on their *combination*. That’s the essence of Bell’s theorem.
