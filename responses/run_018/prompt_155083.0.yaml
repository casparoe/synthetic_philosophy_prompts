  hey so me and my roommate sarah got into this huge fight last night about bell's theorem — she thinks every macroscopic analog is cheating because you always smuggle quantum mechanics in through the back door, and i want to show her wrong with a totally classical setup. i'm taking this course on phil of physics but we barely touched locality so i'm kinda winging it. can you build me a three-party thought experiment using just people, sealed envelopes, and a bike courier? no particles, no spins.

  here's the specs: Maya, Leo, and Nina are in seperate buildings with no phones. each round they each privately pick either Left or Right. then a courier delivers each one a sealed envelope with either Green or Red inside. the win rules are deterministic: if all three picked Left, exactly an even number of Greens show up; if exactly one picked Left and two picked Right, all three envelopes are Green; if all picked Right, an odd number are Green. they pull this off perfectly over hundreds of rounds, beating the 75% cap that any local hidden-variable strategy could manage.

  i need you to lay out the reasoning for three interpretations: local hidden variables (they pre-agreed on a plan), correlation without hidden variables (the envelope generation violates parameter independence somehow), and superdeterminism (their Left/Right choices and the envelope colors were both fixed by shared past causes, including the courier's route). tell me exactly which structural feature — the independent Left/Right choices, the deterministic win conditions, or the courier's predetermined path — makes the superdeterminist story available, and what collapses if we swap the courier for a random drone that picks routes on the fly. also, how would a hardline local realist attack this specifically? not just "it's not quantum" but something about how the envelope protocol lets information leak. and please, no bibliography or paper citations — i don't have library access and sarah will mock me for name-dropping.
