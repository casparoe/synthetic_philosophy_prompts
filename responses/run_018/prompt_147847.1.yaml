answer: |-
  ### Explanatory Arc Plan for 50-Minute Session

  #### 1. **Prerequisite Distinction (15 minutes)**  
  **Focus:** Establish the direct/indirect duty distinction and the criterion for being an "end in itself."  
  - **Key Concepts:**  
    - **Direct duties:** Owed *to* rational beings because they are "ends in themselves" (grounded in autonomy/self-legislation).  
    - **Indirect duties:** Duties *regarding* non-rational beings (e.g., animals) that serve our direct duties to rational beings.  
    - **Criterion for "end in itself":** Only rational beings qualify (via the **Formula of Humanity**), as they possess autonomy—the capacity to set ends and legislate moral laws. Non-rational beings (animals) lack this and are thus "things."  
  - **Why They Depend on Each Other & the Formula of Humanity:**  
    - The Formula of Humanity defines moral patients (ends-in-themselves) as rational agents. Without this criterion, the direct/indirect distinction collapses.  
    - Indirect duties exist *only because* rational agents must cultivate virtues (e.g., compassion) to fulfill direct duties to humans. Cruelty to animals damages this disposition.  

  #### 2. **Carrying Example Evaluation (10 minutes)**  
  **Proposed Pair:**  
  - *Farmer A:* Humanely euthanizes a suffering workhorse.  
  - *Farmer B:* Beats a horse for sport.  
  **Evaluation:**  
  - **Strengths:** Isolates *agent’s character* effectively. Farmer B’s cruelty reveals a vicious disposition (key for Kant), while Farmer A’s action shows responsible stewardship without malice.  
  - **Risk:** The "suffering" in Farmer A’s case *could* trigger utilitarian intuitions.  
  - **Mitigation:** Explicitly frame the contrast around **maxims**:  
    - Farmer B acts on a cruel maxim (developing a character incompatible with duties to humans).  
    - Farmer A acts on a dutiful maxim (managing resources without cruelty).  
  **Conclusion:** The example *succeeds* if you emphasize **maxims over outcomes**. Preemptively clarify: "Kant condemns Farmer B *because* his maxim corrupts his humanity—not because the horse suffers."  

  #### 3. **Misconception Mapping & Interception (15 minutes)**  
  | Misconception | Interception Point | Defusing Strategy |  
  |---------------|-------------------|-------------------|  
  | "Kant denies animals can suffer." | Immediately after defining indirect duties. | Cite *Lectures on Ethics*: "Animals... feel pain," but stress suffering is *morally irrelevant*. Only the agent’s character matters. |  
  | "Kant grants animals derivative rights." | When contrasting direct/indirect duties. | Emphasize: Indirect duties are duties *to ourselves* (to preserve virtue), not owed *to* animals. Animals are "things" without rights. |  
  | "This collapses into indirect utilitarianism." | During example analysis. | Contrast: Utilitarianism focuses on *harm reduction*; Kant focuses on *duty to self* (e.g., "Could a cruel person fulfill duties to humans?"). |  

  #### 4. **Final Understanding Check (5 minutes)**  
  **Question:**  
  > "Suppose a farmer beats his horse daily but remains exceptionally compassionate toward humans. Has he violated a duty regarding animals? Why or why not?"  
  **Expected Answer:**  
  - *Yes.* The cruelty damages his moral disposition (a duty to himself), regardless of effects on others. If students cite the horse’s pain or potential human harm, redirect to the *inherent corruption of character*.  

  #### 5. **Excluded Material & Justification**  
  - **Exclude:**  
    1. *Critique of Judgment’s* animal cognition discussion.  
    2. *Metaphysics of Morals’* taxonomy of duties (e.g., perfect vs. imperfect).  
  - **Rationale:**  
    - Students lack background for Kant’s metaphysics. The session’s goal—establishing the *core link* between character and indirect duties—requires no animal cognition details.  
    - Duty taxonomy would overcomplicate the arc. Groundwork-level understanding of the Formula of Humanity suffices here.  

  ---

