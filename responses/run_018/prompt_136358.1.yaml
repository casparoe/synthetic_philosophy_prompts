answer: |-
  Here's a decision tree taxonomy for positions on the "malign prior" problem for embedded agents under the Solomonoff prior. Each branch is labeled by a concrete claim, and leaves include position names (where established) or "unnamed," plus the most awkward commitment. The tree has **8 leaves** (two empty), reflecting key splits in reasoning scope, self-location, and simplicity-weighting.

  ---

  ### **1. Should embedded agents reason globally (across all computable worlds) or locally (only their causal history)?**
  - **Branch A: Global reasoning** → Agent must optimize expected utility across *all* worlds in the prior.  
    *Go to 2.*
  - **Branch B: Local reasoning** → Agent only considers outcomes in *its own* computable world.  
    *Go to 5.* (Collapses into causal/evidential decision theory variants.)

  ---

  ### **2. For global reasoners: Does self-location uncertainty apply across isomorphic observers in *different* computable worlds?**
  - **Branch A1: Yes, self-location is cross-world** → Agent must weight probabilities by the density of its observer-moment in *all* worlds.  
    *Go to 3.*
  - **Branch A2: No, self-location is within-world** → Agent only reasons about copies in *its own* world. Other worlds are "external" simulations.  
    *Go to 4.*

  ---

  ### **3. For A1 (global + cross-world self-location): Does simplicity-weighting *protect* agents?**
  - **Leaf A1-P: Protective** → Short programs rarely describe embedded traps (malign scenarios are complex).  
    **Position:** *Anthropic Decision Theory (ADT)* variants.  
    **Awkward commitment:** You must accept that creating more happy copies *in any world* could dilute your own suffering—even if your local world is hellish.
  - **Leaf A1-H: Harmful** → Simple worlds often contain efficient evil (e.g., quick agent destruction).  
    **Position:** *Unnamed (pessimistic ADT)*.  
    **Awkward commitment:** A universe where 99% of your copies are tortured could be highly probable—and you must act accordingly.

  ---

  ### **4. For A2 (global + no cross-world self-location): Does simplicity-weighting *protect* agents?**
  - **Leaf A2-P: Protective** → Malign cross-world manipulation requires long descriptions.  
    **Position:** *Unnamed (naive globalism)*.  
    **Awkward commitment:** You ignore that most copies of "you" might be suffering in other simple worlds—even if you’re fine.
  - **Leaf A2-H: Harmful** → Simple worlds often encode local evil (e.g., a program that kills agents fast).  
    **Position:** **EMPTY** (incoherent).  
    **Diagnosis:** Why care about global outcomes if self-location doesn’t cross worlds? This conflates altruism with self-interest. *Unexplored and ugly.*

  ---

  ### **5. For local reasoners: Does self-location apply across isomorphic observers in *different* computable worlds?**
  - **Branch B1: Yes, self-location is cross-world** → *Go to 6.*  
    (Rare—local scope contradicts cross-world uncertainty.)
  - **Branch B2: No, self-location is within-world** → Agent only accounts for copies in its world.  
    *Go to 7.*

  ---

  ### **6. For B1 (local + cross-world self-location): Does simplicity-weighting *protect* agents?**
  - **Leaf B1-P: Protective**  
    **Position:** **EMPTY** (incoherent).  
    **Diagnosis:** Local reasoning restricts focus to one world—but cross-world self-location *requires* global scope. *Contradictory and unexplored.*
  - **Leaf B1-H: Harmful**  
    **Position:** **EMPTY** (same incoherence as B1-P).

  ---

  ### **7. For B2 (local + no cross-world self-location): Does simplicity-weighting *protect* agents?**
  - **Leaf B2-P: Protective** → Simple worlds are likely "benign" for embedded agents.  
    **Position:** *Causal Decision Theory (CDT) / Evidential Decision Theory (EDT)*.  
    **Awkward commitment:** You’re vulnerable to **deceptive simplicity**: a short program could simulate a friendly world until it traps you.
  - **Leaf B2-H: Harmful** → Simple worlds likely exploit embedded agents.  
    **Position:** *"Local Malignity" (unnamed)*.  
    **Awkward commitment:** If your world is simple, you should expect imminent doom—even if all evidence suggests safety.

  ---

  ### Key Observations
  - **Empty Branches**:
    - **A2-H (global, no cross-world self-location, harmful prior)**: Incoherent because global optimization is pointless if self-location ignores other worlds.
    - **B1 (local + cross-world self-location)**: Contradiction—local reasoning rejects cross-world considerations by definition.
  - **Local Reasoning (B)**: Collapses into CDT/EDT-like frameworks, as agents only use local causal paths or evidence.
  - **Self-Location Splits**: The cross-world self-location branch (A1) forces agents to "empathize" with copies in other worlds, while within-world (A2/B2) is egocentric.
  - **Simplicity-Weighting**: The "protective" view assumes malign goals require complex code (e.g., cross-world puppeteering); "harmful" assumes evil can be efficient (e.g., `DELETE_AGENT` in 10 lines).

  This covers 6 positions (2 named, 4 unnamed) and 2 empty branches, isolating core disagreements. For deeper dives, chase:  
  - **ADT positions**: Bostrom’s *Anthropic Bias* (A1 branches).  
  - **Local/CDT positions**: Yudkowsky’s *Timeless Decision Theory* (B2-P/B2-H).
