prompt: |-
  My friend is an anthropolgist who studies whether guilt or shame is the "better" moral emotion for a culture. Her verdicts so far: in small-scale honor societies she picks shame and says guilt actually undermines collective face; in modern anonymous democracies she picks guilt and calls shame toxic; in religious communities with strong forgiveness rituals she picks guilt even though they're tight-knit; in hierarchical workplaces she picks shame and rolls her eyes at HR guilt-training; and she insists a culture can't just "choose" one like a menu item -- it has to match the social architecture or it backfires. Now there's this weird hybrid: a pseudonymous online forum run by smart contracts, where your reputation score is public but not tied to your body or family, and harm is visible but never physically embodied. Would she say they should cultivate guilt or shame? I'm less interested in the answer than in the rule she's running. Lay out the two or three rules that fit her track record just as well, say what each predicts for this forum, give me your best guess with the reason, and tell me what further case would actually split the rules.
