answer: |-
  Here's the thought experiment:

  **The Sundara Peninsula Scenario:** Imagine the Sundara Peninsula, a fertile land historically home to the Lirasi people. A century ago, the newly formed Sundaran Republic, led by an elite class of settlers, systematically expelled the Lirasi from their ancestral coastal lands using brutal force and engineered famines, seizing their highly productive pearl beds and fishing grounds. This "Coastal Clearance" fueled the Republic's initial wealth. Fast forward to today: *every single person* alive during the Clearance is dead. Crucially, 60 years ago, a devastating blight wiped out Sundara's entire cash crop economy. Facing collapse, the *entire* settler-descended population emigrated en masse elsewhere over a decade. Sundara became nearly empty. Decades later, new waves of immigrants (escaping poverty or conflict in their own homelands) gradually arrived, repopulated the abandoned towns, and revived the economy. The *same* Sundaran Republic constitution, borders, and institutions remained intact throughout. The current, entirely immigrant-descended population actively votes, pays taxes, and benefits immensely from the state-enforced property rights over the lucrative (and stolen) coastal resources. The government fiercely defends these borders and the legal framework established by the perpetrators.

  **Applying the Views:**

  1.  **Jaspers' Political Guilt:** Current citizens bear **political guilt**. While they committed no crime and share no bloodline with the perpetrators, they actively participate in and derive benefit from the *political structure* built upon the foundational crime. By upholding the state, its laws, and its borders – which perpetuate the dispossession of the Lirasi (or their descendants elsewhere) – they share responsibility for the ongoing *political* injustice. Their duty is to reform the state to address this foundational wrong.
  2.  **Strict Individualist Denial:** Absolutely **no guilt** attaches to current citizens. They are entirely innocent individuals. Their ancestors arrived *decades after* the crime and the perpetrators' departure. They merely found an empty(ish) land with existing infrastructure and laws. They broke no laws themselves; they simply built lives within the framework they found. Benefiting from past actions you had no hand in is not culpability. Guilt is personal, not collective or inherited.
  3.  **Bureaucratic Continuity View:** Current citizens inherit a form of **moral liability**. The key isn't blood or direct action, but the *unbroken continuity of the state entity itself*. The Sundaran Republic, as a legal and institutional persona, is the direct inheritor of the benefits and the foundational injustice. By actively choosing to sustain and participate in *this specific state* – knowing its origin – citizens become morally implicated in its ongoing legacy, even distantly. They inherit the moral taint embedded in the persistent institutions they willingly maintain and profit from.

  **The Linchpin: Institutional Persistence & Active Maintenance**

  The core feature making guilt claims plausible here is the **unbroken survival and active maintenance of the specific state institutions, borders, and legal frameworks established by the perpetrators, despite the *complete* demographic replacement of the population.** The state itself acts as the carrier of the injustice.

  **What Collapses Without It?**

  Remove the institutional persistence:
  *   If the Sundaran Republic had *collapsed* during the blight/emigration, replaced by a new state with different borders, a new constitution, and new institutions formed *by the immigrants themselves*, then:
      *   **Jaspers' Political Guilt** largely evaporates. The new state isn't the *same* political entity responsible for the crime.
      *   **Bureaucratic Continuity** completely collapses. There is no continuous institutional "persona" to inherit liability.
      *   The **Individualist Denial** becomes overwhelmingly strong. The immigrants are simply people building a new society on a territory with a tragic past, not perpetuators of an old regime. Claims of inherited guilt would seem like arbitrary historical finger-pointing. The focus would shift entirely to whatever *new* actions the current state takes.
