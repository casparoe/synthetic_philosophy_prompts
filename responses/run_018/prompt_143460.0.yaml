prompt: |-
  I've been trying to wrap my head around whether death is actually bad for you, not just sad for the people left behind. Specifically I'm stuck on the Epicurean line — once you're dead there's no "you" to suffer the harm — but I also keep wondering whether that argument collapses if we accept something like temporal neutrality, where being dead and being not-yet-born are symetric with respect to harm. So I want your actual credance, on a scale of 0 to 1, that death is genuinely bad for the deceased person on a deprivation account that actually survives the symmetry objection. Don't just tell me it depends on your metaphyics; decompose it. Give me rough numbers for (a) how likely it is that harm can exist without a present subject experiencing it right now, (b) whether pre-birth and post-death non-existence are actually symmetric in the relevant way, (c) whether there's a leftover non-deprivational harm — like narrative incompleteness or a broken life-plan — that doesn't need a living subject to count as a loss, and (d) how much the whole arguement hinges on four-dimensionalism versus presentism about persons. Show me roughly how those pieces combine into your overall number, then tell me which sub-credence is the shakiest and what kind of argument or even weird empirical finding would move it most. I was debating this with a friend over coffee after a phil class and we got stuck on part (b), so feel free to correct my framing if I messed up the symmetry thing.
