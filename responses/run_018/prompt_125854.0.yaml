  Okay, the user wants me to act as a seasoned philosopher of action with metaethics background, specifically tackling the internalist vs externalist debate on practical reasons. They want a detailed adversarial collaboration with unique framing elements - "dormant reason" scenario and "collective bootstrapping" problem. 

  Hmm, the user clearly knows their philosophy - they're avoiding the standard Williams-Parfit debates and requesting niche conceptual tools. Probably an academic or advanced student preparing for publication or teaching. Their tone suggests impatience with superficial treatments. 

  First I need to map the common ground: both camps agree reasons involve facts that count in favor of actions, require some psychological hook for motivation (even if dormant), and accept that collective reasons pose challenges. The dormant reason case is key - where an agent understands a reason perfectly but feels nothing. Externalists see this as proof reasons exist independently, internalists argue the conceptual grasp itself contains motivational seeds.

  For collective bootstrapping - when a group has reasons no individual can access - externalists view this as irreducible group reasons, internalists insist it must trace to members' dispositions. The cruxes are: 1) Is motivation constitutive or merely evidential for reasons? 2) Do collective reasons reduce to individual ones?

  For the joint statement, I'll structure: 
