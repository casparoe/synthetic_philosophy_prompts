  I'll make it casual as requested - contractions, no bibliographies. Must avoid strawmanning: internalist gets "capable of motivation" not "must feel urge", externalist gets "authoritative" not "magically binding". 

  The dormant reason case: mathematician who grasps charity's value but feels nothing. Internalist predicts reflection will spark motivation, externalist says the reason exists regardless. Collective case: climate committee where no member sees the full picture. Internalist says reasons reduce to members' combined dispositions, externalist says the group reason emerges beyond individuals. 

  User wants "in the weeds" - so I'll drill into how dormant cases test the connection between cognition and motivation, and how bootstrapping pressures internalist accounts. The predictions will show how each theory could be falsified. 

