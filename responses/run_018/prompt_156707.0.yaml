answer: |-
  This pattern is a fascinating and persistent category error with deep roots in logic and metaphysics. While no single established term captures it perfectly across all disciplines, we can analyze it through several lenses:

  ### Core Logical Structure & Relation to "White Horse"
  - **Gongsun Long Parallel**: The "white horse ≠ horse" argument exploits ambiguity between **identity** and **class membership**. Gongsun Long argues that "horse" denotes the universal property *equinity*, while "white horse" denotes *equinity + whiteness*. Since the extensions differ (some horses aren't white), he treats them as distinct categories rather than seeing "white horse" as a subset of "horse".
  - **Modern Equivalent**: Your examples follow identical logic:
    1. Entity *X* meets all criteria for category *C* (life, art, election).
    2. *X* has additional property *P* (synthetic, algorithmic, digital).
    3. Therefore, *X* is excluded from *C*, and "C-with-P" is deemed a fundamentally new category.

  This is **not merely essentialism** (which focuses on necessary/sufficient conditions) but a **misapplication of compositionality** in categorization.

  ### Established Names & Conceptual Frameworks
  1. **The Constitutive Property Fallacy**:  
     Treating a *contingent* or *accidental* property as *category-excluding* when it doesn't contradict the category's definition. (e.g., "Synthetic life isn't *life* because life must be *naturally evolved*" – but "natural" isn't in the definition of life).
     
  2. **Hybrid Category Fallacy**:  
     Asserting that hybrid/complex instances belong to a novel category *instead* of the base category, ignoring hierarchical relationships.

  3. **Modal Confusion**:  
     Mistaking "C can exist without P" (true) for "C cannot exist *with* P" (false). Essential properties define categories; contingent properties create subtypes.

  ### Boundary Conditions & Key Distinctions
  - **vs. Ordinary Ambiguity**:  
    If "algorithmic art" is defined *by stipulation* to exclude human-made art (e.g., in a technical context), it's ambiguity. The fallacy arises when interlocutors deny that AI art satisfies *existing, agreed-upon definitions* of art (e.g., "evokes emotion," "demonstrates skill") solely due to its origin.
    
  - **vs. Essentialism**:  
    Essentialism asks, "What properties *must* X have to be C?" This fallacy adds, "If X has extra property P, it *cannot* be C," even when P is compatible with C's essence.

  - **Trigger Conditions**:  
    The fallacy emerges when:
    - The base category (*C*) has fuzzy or contested boundaries.
    - The modifier (*P*) is culturally/socially charged (e.g., "synthetic," "algorithmic").
    - *P* is mistakenly seen as incompatible with the *telos* or origin story of *C* (e.g., "art must be human-expressive").

  ### When *Is* Exclusion Justified?
  Exclusion is valid only if:
  1. **The modifier contradicts a necessary condition**:  
     - Example: A "digital election" with no secret ballot might justifiably be excluded from "election" if secrecy is definitional.
     
  2. **Regulatory/Operational Contexts**:  
     - Law often creates mutually exclusive categories for pragmatic reasons.  
       *Example*: In FDA regulations, a "synthetic vitamin" might be classified differently from a "natural vitamin" for labeling purposes—even if chemically identical—due to *process-based definitions*.

  3. **Biological Cladistics**:  
     - If a synthetic organism uses non-biological polymers (e.g., XNA instead of DNA), it might be excluded from "life" *if* "based on nucleic acids" is a necessary condition. This hinges on the definition used.

  ### Why This Fallacy Persists
  - **Cognitive Bias**: We default to "ideal types." A "horse" prototype might be brown; a "white horse" feels exceptional, not representative.  
  - **Metaphysical Anxiety**: Modifiers like "synthetic" or "AI" trigger intuitions about "authenticity" or "natural kinds," overriding formal criteria.  
  - **Linguistic Reification**: Compound terms ("digital democracy") are parsed as unitary concepts rather than "democracy (digital variant)."

  ### Countering the Fallacy
  1. Demand explicit criteria for the base category (*C*).  
  2. Ask if *P* negates any *necessary* condition of *C*.  
  3. Distinguish between *constitutive* properties (required for *C*) and *contingent* ones (frequent but not defining).  

  **In essence**: This is a 21st-century resurgence of a 2,300-year-old logical confusion, amplified by rapid technological change. It reveals our struggle to reconcile formal definitions with intuitive prototypes—a tension Gongsun Long would recognize immediately.
