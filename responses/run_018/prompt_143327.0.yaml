  I'm giving the eulogy for my uncle next saturday. He was a math prof who spent his last years obsessed with supertasks — especially that lamp problem where you flip it on and off faster and faster forever, so there's no definate final state, just an infinite sequence that never resolves. He was a hard materailist, no soul, said so at every thanksgiving. The family wants comfort but I won't invent an afterlife he didn't believe in. Write a eulogy, maybe four minutes, that uses the lamp idea structurally: the point is there's no hidden offstage state he reached, no secret endpoint we're missing, and that's okay — the value is in the whole sequence, not some invisible finish line. About half the room are mathematicians who'll catch the reference, half are relatives who just need warmth. Don't ask me for citations or reading lists, I just need the words. Also he had this personal twist he called the heartbeat version where each flip matched a pulse; weave that in gently if you can.
