prompt: |-
  Write a villanelle on sphexishness — the rigid behavioral loop of the digger wasp Sphex, which paralyzes a cricket, drags it to a burrow, enters to inspect the interior, and then pulls the prey inside, but if the cricket is moved during inspection will drag it back to the threshold and inspect again, repeating the interrupted step regardless of changed circumstances. Use the villanelle's two refrains to embody this loop: let one refrain be the invariant action of dragging prey to the burrow's mouth, and the other be the disrupted condition of the prey having been moved away. Allow the form's compulsive repetition to enact the mechanical rigidity, with the rhyme scheme holding the sequence in place. In the final quatrain, shift one refrain grammatically — altering tense, voice, or subject without breaking the rhyme — so that the closing couplet stages the philosophical crux: whether this loop reveals an absence of free will, or whether free will was never the right criterion for agency, since human action too is largely governed by scripted habit and biological drive rather than by continuous rational oversight. The poem should be conceptually precise enough that a reader familiar with philosophy of action recognizes sphexishness as an analogy for determinism, without naming specific authors or citing texts. Present the poem itself first, with no preface, commentary, or explanation.
