  The prey lies elsewhere. Still she drags the cricket
  Toward the hole that hunger built of dust.
  She drags the cricket toward the hole, a habit

  Fixed as the sting that leaves the victim sick, but
  Not dead. The threshold reached, a ritual of trust
  Demands inspection. Yet the prey lies elsewhere. Quick, it

  Vanished. Now the hollow dark must be checked. It
  Takes a moment. Blind routine is just
  And must be served. She drags the cricket toward the hole, a habit

  Stronger than the sun that bakes the thicket.
  Out again, the empty ritual adjusts
  To absence. See, the prey lies elsewhere. Click it

  Back to start: the hunt, the paralytic
  Gift retrieved. Forgotten is disgust
  Or learned despair. She drags the cricket toward the hole, a habit

  Woven deep in nerves, devoid of trick, it
  Binds her to the dust. What drives this thrust?
  The prey lies elsewhere. Still she drags the cricket.
  **Does she intend to drag?** The question thickens, strict. It
  **Reveals the prey lies elsewhere.** Thought's a gust
  That stirs the dust. We drag through scripted habit,
  Bound by drives as deep. The prey lies elsewhere.
