prompt: |-
  I'm writing a feature on whether image generators are the new photography—you've heard the line, painters panicked in the 1800s but now we treat photographers as artists because they choose framing, light, and moment. Some defenders say prompt engineers are exactly like photographers and the model is just the camrea.

  I want to stress-test that anology specifcally. If a camera records photons that were actually present, what's the equivalent light being captured here—the training data? The random seed? There's also this other frame I keep returning to, treating the prompt like a Fluxus event score where you set conditions but don't control execution. Can you map the correspondence explicitly—photographer to prompt engineer, camera to ?, darkroom to ?, negative to ?—and then tell me which breaks actually matter for the this-is-art-too conclusion? In particular, does the fact that the model remixes copyrighted images rather than recording reality destroy the comparison, or is that like complaining that darkroom chemicals borrow from geology? And if the event-score analogy fits better, does it make the human more of an author or less?
reasoning: |-
