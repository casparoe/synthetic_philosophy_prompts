prompt: |-
  I've been thinking about whether Frankfurt-style hierarchical compatibilism genuinely avoids van Inwagen's consequence argument or merely disguises an incompatibilist premise. If an agent is responsible only when she acts from second-order volitions with which she identifies, and those volitions are themselves fixed by prior causes she did not choose, then doesn't her identification depend on her being the ultimate source of her character—exactly the libertarian condition the compatibilist rejects? So is the deep-self view covertly incompatibilist, or is there a principled way to hold that I can genuinely identify with a causally determined character without requiring that I caused that character? Please push back plainly if my framing conflates identification with sourcehood, or if I'm misrepresenting what Frankfurt's hierarchy was meant to solve.
reasoning: |-
  Okay, the user is diving deep into Frankfurt-style compatibilism and its potential issues with van Inwagen's consequence argument. They're questioning whether the hierarchical model secretly relies on an incompatibilist premise about ultimate sourcehood. Let me unpack their concerns step by step.

  First, they're worried that even if an agent identifies with their second-order volitions, those volitions are shaped by prior causes the agent didn't choose. So isn't the requirement for identification just smuggling in the need for being the ultimate source? That's a sharp observation. The user seems well-versed in the philosophical debate, probably a grad student or a very engaged undergrad in philosophy. 

  I recall Frankfurt's main goal was to address the regress problem in compatibilism by introducing hierarchical desires. But the user is hitting on a deeper tension: if identification is the key to responsibility, but identification itself is determined by factors outside the agent's control, haven't we just pushed the problem back? 

  The user's phrasing about "covert incompatibilism" suggests they suspect compatibilists might be inconsistent. That's fair. I need to clarify Frankfurt's actual position - he explicitly rejects requiring ultimate sourcehood. For him, identification is about internal coherence, not causal history. 

  But here's where it gets tricky: what does "identification" really mean? The user might be conflating metaphysical sourcehood with psychological endorsement. Frankfurt's "satisfaction" condition is about not being conflicted, not about creation ex nihilo. 

  I should emphasize Frankfurt's rejection of regress arguments - he stops at "decisive commitment," which doesn't require infinite chains of choice. The user seems to think identification implies authorship, but Frankfurt sees it as acceptance. 

  The deeper need here might be reassurance that compatibilism isn't self-defeating. The user wants to know if there's a stable middle ground between libertarianism and hard determinism. They're likely frustrated with what they perceive as compatibilist hand-waving about control. 

  I should push back gently on their framing but validate their intuition. Yes, it feels like identification should require sourcehood - that's why Dennett calls it a "deep self" view. But Frankfurt would say that intuition mistakes the nature of responsibility. 

  The principled distinction is between structural properties (coherence of will) and historical properties (causal origin). Frankfurt cares about the former. The user's challenge exposes why many find this unsatisfying - hence Fischer's "semi-compatibilism" work on guidance control versus regulative control. 

  I'll need to explain why Frankfurtians think historical determination doesn't undermine identification, using examples like non-conflicted agents. The key is that responsibility emerges from the architecture of the will, not its metaphysical genesis. 

  But I should acknowledge this remains controversial - Stump and others have pushed back. The user has put their finger on the live nerve in the debate. Their framing isn't wrong so much as highlighting why this remains unsettled after 50 years.
answer: |-
  You've pinpointed a profound and persistent challenge for Frankfurt-style hierarchical compatibilism—the **"Lucky/Unlucky Mismatch" problem**. Your framing is insightful and doesn't fundamentally conflate identification with sourcehood, but it exposes a tension Frankfurtians must address. Let's break this down:

  ### 1. **Frankfurt's Core Project & What It Solves**
     - **Target:** Frankfurt aimed to refute the **"Principle of Alternate Possibilities" (PAP)**, showing responsibility doesn't require alternative actions (thus countering early Consequence Argument variants).
     - **Hierarchy Solution:** Responsibility requires acting on a desire *you endorse* via a second-order volition (a "volitional identity"). This filters out coercion, addiction, or alienation—cases where you act *on* a desire but not *because* you identify *with* it.
     - **Success?** It largely succeeds against PAP and provides a richer account of agency than classical compatibilism (e.g., mere desire-action alignment).

  ### 2. **Your Challenge: The Source of the "Deep Self"**
     - **The Problem:** If my second-order volitions (my "identifications") are determined by genetics, upbringing, or luck—factors I didn't control—how can I be *truly responsible* for actions flowing from them? Isn't my "identification" just a passive reflection of causes I didn't author?
     - **Incompatibilist Premise Sneaking In?** This *feels* like demanding **"ultimate responsibility" (UR)**—the libertarian requirement that you must be the uncaused cause of your character. If identification requires UR, compatibilism collapses.

  ### 3. **Frankfurtian Reply: Identification ≠ Sourcehood**
     Frankfurtians offer principled distinctions to resist UR:
     - **Identification as Structural, Not Genetic:** Responsibility depends on the *current structure of your will*, not its causal history. When your actions reflect your "deep self" (your endorsed commitments), *you* are acting, even if that self was shaped by external factors. Your character *is* "you" at the moment of action.
     - **Regress-Stopping "Satisfaction":** Frankfurt avoids infinite regress ("But who chose to identify?") via **"satisfaction"**—a non-reflective, non-volitional state of being content *not* to alter your will. You don't need to "choose" your identification; you just need to *not dissent* from it. This is a psychological state, not a metaphysical act of creation.
     - **Counterfactual Stability:** True identification involves stable commitments. If you *would* resist changing your volition upon reflection (even if you never actually reflect), it reflects your deep self. Historical determination doesn't undermine this counterfactual robustness.

  ### 4. **Is This Covert Incompatibilism?**
     - **Not Necessarily.** The compatibilist insists UR is a *category error*. Responsibility concerns **ownership/attribution** ("Is this action *mine*?") not **metaphysical origination** ("Did I cause my self?"). Consider:
       - **Analogy:** You author a poem expressing your deepest values. The fact you didn't choose your talent or influences doesn't negate *your authorship*. Similarly, acting from your deep self makes the action yours.
       - **Hard Incompatibilist Rebuttal:** Derk Pereboom/Saul Smilansky argue this merely disguises responsibility "under the radar" of determinism—ownership *presupposes* ultimate authorship. This is where the debate stalemates.

  ### 5. **Principled Ways to Hold Identification Sans Sourcehood**
     Compatibilists defend this with:
     - **Normative Competence:** Responsibility requires rationality, sensitivity to reasons, and psychological integration—not causal ultimacy (e.g., Fischer & Ravizza's "guidance control").
     - **Self-Constitution:** Your "self" *is* the nexus of your commitments. To demand you cause your self is incoherent—who would the "cause-er" be? (Korsgaard, Bratman).
     - **Pragmatic/Phenomenological Grounding:** Our practices of holding responsible track identification, not ultimate sourcehood. We *experience* identification as sufficient for ownership.

  ### Verdict
  Your framing is accurate: **Frankfurt's model doesn't *escape* the Consequence Argument's core challenge (determinism threatens control); it *redefines* the control necessary for responsibility.** It rejects UR as essential, substituting volitional harmony. Whether this is a valid compatibilist move or a covert capitulation hinges on:
  - **Metaphysical:** Is "identification without ultimate sourcehood" coherent? (Compatibilists: Yes; Libertarians: No)
  - **Moral Psychology:** Does identification *feel* sufficient for responsibility? (Often yes, but UR intuitions persist)
  - **Dialectical:** Has Frankfurt *answered* the Consequence Argument, or just *shifted the goalposts*? (He shifts them to ground he finds defensible).

  **Conclusion:** Frankfurtian compatibilism isn't *covertly* incompatibilist—it explicitly rejects UR. But your challenge reveals its deepest vulnerability: it may not satisfy intuitions demanding *authorship* of the self. Whether this is a flaw in the theory or in the intuition defines the incompatibilism/compatibilism divide. The debate continues precisely where you’ve located it.
