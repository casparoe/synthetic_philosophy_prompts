prompt: |-
  I should like you to produce a satirical document of roughly 650 words formatted as an End-User Licence Agreement for a fictional flat-pack consumer product named MereologyKit™. The manufacturer’s voice ought to remain deadpan and bureaucratic throughout, treating metaphysical disputes about parts and wholes as ordinary customer-service concerns. Your target is the special composition question—specifically the rivalry between unrestricted universalism, restricted composition conditioned on functional or organic bonding, and mereological nihilism—rendered through warranty exclusions, assembly instructions, and liability clauses. For example, the warranty should initially appear to guarantee the existence of every assembled product, only for the exclusions to reveal that the guarantee holds solely when parts stand in the correct bonding relation; meanwhile, the instructions should address vagueness about whether a part belongs to one object or two as a troubleshooting step, and the refund policy ought to vary depending on whether the customer accepts that there are no composite entities at all.

  To ensure the satire operates from within the logic of the debate rather than inventing straw positions, please embed a fictional Brundle Amendment—a clause added after a customer-support crisis in which two users assembled overlapping objects from shared parts. Rather than treating this as a property dispute, the Amendment should frame it as a problem of diachronic identity and temporal parts, requiring arbitration over whether the shared parts constitute one persisting object or two successive ones. The humour must arise from the faithful translation of actual metaphysical commitments into legalese: an unrestricted universalist clause should generate an unmanageable warranty burden, whilst a nihilist appendix should deny that the kit contains anything other than simples arranged kit-like. Do not name specific philosophers, cite texts, or provide bibliographic references; recognisability should come from the structure of the arguments alone.

  Please present the document with numbered clauses and sub-clauses. At the very end, on its own line, provide a one-sentence summary beginning Verdict:, indicating which position on special composition the document implicitly favours and why the customer-support framework collapses under it.
