prompt: |-
  hey im doing this essay for my world history elective on whether criteria of authenticity can ever actually settle who the historical jesus was, and im lost in the weeds. every article just lists "multiple attestation" and "embarrassment" like thats enough. i need the full spec.

  write the desiderata: what any adequate set of criteria for deciding which sayings or deeds of jesus are historically authentic must deliver to count as solving the problem. for each requirement, give the case that motivates it, flag if its non-negotiable vs just a camp preference, and keep the distinctions straight — especially between "not invented by the early church" and "totally alien to 1st century judaism." include handling the fact that all four gospels are post-easter and confessional, being consistent with what we know about galilee social dynamics, and two extra conditions im injecting: the counterfactual stability problem (the result shouldnt reverse if a new non-canonical fragment turned up tomorrow) and the eschatological noise floor (since apocalyptic expectation was normal in that context, criteria that filter out "too weird" end-times talk risk deleting the real person instead of the legend). also tell me if some subset is jointly unsatisfiable — my guess is that demanding both rigorous multiple attestation and full dissimilarity from church theology cant both hold, because our independent sources are basically church texts anyway. then identify which single desideratum knocks out the most popular theories. keep the weight on the criteria and why they matter, not on grading every scholar.

  please dont include bibliographies or reading lists — i cant check them without web access and this is for a model that shouldnt need them either. also dont cite page numbers i have to verify.

  Finish with a one-sentence summary on its own line starting with "Bottom line:"
reasoning: |-
  Okay, the user is working on a history essay about the criteria for authenticity regarding the historical Jesus. They're frustrated because articles just mention multiple attestation and embarrassment without deeper analysis. They need a comprehensive list of desiderata for these criteria, covering all necessary aspects.

  I need to outline what any adequate set of criteria must achieve to solve the problem. The user specified several key points: distinguish between "not invented by the church" vs "alien to Judaism," handle that all gospels are post-Easter and confessional, fit with Galilee social dynamics, include their added conditions about counterfactual stability and eschatological noise, and check for unsatisfiable combinations. They also want to know which single desideratum challenges popular theories the most.

  Starting with the core issues: The gospels are written after Jesus' death by believers, so they have theological agendas. Multiple attestation checks across sources, but since most sources are church-related, it's tricky. Embarrassment looks for elements that would be awkward for the early church, suggesting they're likely true. But these alone aren't enough.

  For desiderata, I'll structure each with a case that motivates it and note if it's non-negotiable or a preference. First is "Non-Invention by Early Church": This is crucial because the church shaped the narratives, so we need criteria to filter out later additions. Example: Jesus' baptism by John is embarrassing since it implies he was subordinate, so it's probably authentic. Non-negotiable.

  Next, "Non-Alienation from Palestinian Judaism": Jesus was a Jew of his time, so criteria shouldn't demand he be completely unique. Example: Kingdom of God language was common in Judaism, so dismissing it as too Christian would be wrong. Non-negotiable to avoid anachronism.

  Then, "Compatibility with Post-Easter Provenance": All sources are from believers, so criteria must account for that. Embarrassment is used here because it exploits the tension between the event and later beliefs. Non-negotiable since it's a given constraint.

  "Consistency with Galilee Social Dynamics": Jesus existed in a specific context. Example: Debates over purity laws fit the historical setting, while anachronisms like Gentile inclusion debates might be later. Non-negotiable for historical plausibility.

  Now for the user's extra conditions. "Counterfactual Stability": Results shouldn't change dramatically with new discoveries. This is a preference to avoid over-reliance on current evidence gaps. Example: If a new fragment showed John the Baptist didn't baptize Jesus, it shouldn't invalidate everything.

  "Eschatological Noise Floor": Apocalyptic ideas were normal, so filtering "weird" end-times talk might remove authentic material. Example: Jesus' apocalyptic sayings shouldn't be dismissed just because they're extreme. Non-negotiable to prevent distortion.

  Now, joint unsatisfiability: The user suspects multiple attestation and dissimilarity can't both be satisfied because sources are church texts. Dissimilarity requires Jesus to differ from Judaism and Christianity, but multiple attestation relies on sources that are Christian, so they might not include dissimilar elements. That's a tension; they can't both be fully met.

  Which desideratum knocks out popular theories? "Non-Alienation from Palestinian Judaism" challenges the criterion of dissimilarity, which often overemphasizes uniqueness, making Jesus seem ahistorical.

  Bottom line: Adequate criteria must navigate the constraints of biased sources while ensuring Jesus remains plausible in his historical context without demanding impossibility.
answer: |-
  Here are the desiderata for any adequate set of authenticity criteria, structured as requested:

  1.  **Non-Invention by Early Church (Non-Negotiable)**
      *   **What it must deliver:** Reliably distinguish material likely originating with Jesus from theological developments or needs of the post-Easter community (e.g., resurrection narratives, gentile inclusion debates, high Christology).
      *   **Motivating Case:** The "Temple Cleansing" appears in all four Gospels but varies significantly in timing and details. Criteria must help discern a core event from potential theological embellishment (e.g., Mark's placement vs. John's). Embarrassment (e.g., Jesus' baptism by John) targets this.
      *   **Distinction:** This seeks material *not created* by the church, even if it *later resonated* with or was *interpreted* by them.

  2.  **Non-Alienation from Palestinian Judaism (Non-Negotiable)**
      *   **What it must deliver:** Ensure Jesus remains intelligible within the diverse Jewish world of 1st-century Galilee/Judea. Criteria cannot demand Jesus be utterly unique or disconnected from his religious/cultural context.
      *   **Motivating Case:** The "Criterion of Dissimilarity" often fails here. Rejecting Jesus' teaching on the "Kingdom of God" *because* it was a known Jewish concept, or his use of parables/midrashic techniques, would erase the historical figure. He *must* fit his environment.
      *   **Distinction:** This explicitly counters the misuse of dissimilarity that conflates "not invented by the church" with "must be unlike Judaism." Authentic material *must* be plausible within 1st-century Judaism.

  3.  **Compatibility with Post-Easter, Confessional Provenance (Non-Negotiable)**
      *   **What it must deliver:** Function effectively despite all sources being written by believers, after the resurrection faith, with theological agendas (kerygma). Criteria cannot require "neutral" sources, which don't exist.
      *   **Motivating Case:** Multiple Attestation *assumes* independent sources, but the Gospels demonstrably share traditions and theology. Criteria must handle this interdependence and bias. Embarrassment exploits this provenance by finding tensions *within* the confessional narrative.
      *   **Distinction:** Accepts the source limitation as a given and provides tools to work *within* it.

  4.  **Consistency with Galilean Social Dynamics (Non-Negotiable)**
      *   **What it must deliver:** Authentic material must cohere with the socio-economic, political, and religious realities of early 1st-century Galilee (e.g., peasant society, Roman occupation, Herodian rule, purity concerns, Torah observance, prophetic movements).
      *   **Motivating Case:** Jesus' table fellowship with "sinners" makes sense within debates about purity and social boundaries. A saying advocating violent revolt against Rome would clash with the known dynamics of his ministry context.
      *   **Distinction:** Grounds Jesus in his specific historical moment, distinct from later church contexts or anachronistic interpretations.

  5.  **Counterfactual Stability (Preference, but Highly Desirable)**
      *   **What it must deliver:** Produce results robust enough that the discovery of a new, credible non-canonical source (e.g., a lost gospel fragment) wouldn't completely overturn core conclusions, only refine or add nuance.
      *   **Motivating Case:** Over-reliance on the *absence* of attestation (e.g., discounting material only in one Gospel) makes conclusions fragile. If a new fragment strongly supported a "single attestation" saying, a system overly dependent on multiple attestation collapses. Criteria should weight inherent plausibility and context higher than mere attestation count.
      *   **Distinction:** Aims for methodological resilience against future discoveries.

  6.  **Eschatological Noise Floor (Non-Negotiable)**
      *   **What it must deliver:** Avoid filtering out authentic apocalyptic or eschatological material *simply because* it seems extreme, "weird," or mythical by modern standards, given the pervasiveness of such expectation in Jesus' environment.
      *   **Motivating Case:** Dismissing Jesus' vivid apocalyptic pronouncements (e.g., Mark 13, Son of Man coming in glory) as "inauthentic legend" because they are intense ignores that figures like John the Baptist and the Qumran community held similar views. Criteria must allow for a historically plausible level of eschatological intensity.
      *   **Distinction:** Prevents criteria from creating an anachronistically "rational" Jesus stripped of a core aspect of his context.

  7.  **Avoidance of Joint Unsatisfiability:** Your suspicion is correct. **Demanding both rigorous Multiple Attestation *and* strong Dissimilarity (from both Judaism *and* early Christianity) is likely jointly unsatisfiable.**
      *   **Why:** Our sources *are* the early church texts. Material satisfying strong dissimilarity (truly unique to Jesus, not Jewish, not Christian) would likely be deemed irrelevant or confusing by the church and *not preserved or attested*. Conversely, widely attested material is attested *because* it was meaningful to the church, inevitably linking it to their theology or needs. This creates a "Catch-22." A viable system must prioritize **Non-Invention** and **Non-Alienation** over strict Dissimilarity and temper reliance on Multiple Attestation with other criteria like Contextual Consistency and Embarrassment.

  **Desideratum Knocking Out Popular Theories:** **Non-Alienation from Palestinian Judaism** is the most devastating. It fundamentally undermines the widespread application of the **Criterion of Dissimilarity** as classically formulated (requiring dissimilarity from *both* Judaism *and* early Christianity). This criterion, heavily relied upon in much 20th-century scholarship (e.g., Bultmann's school, aspects of the Jesus Seminar), frequently produced a Jesus suspiciously free of his Jewish context and conveniently aligned with modern liberal theological preferences, precisely because it filtered out material deemed "too Jewish." Non-Alienation forces the criteria to grapple with Jesus *within* Judaism, rendering strict dissimilarity largely unusable and invalidating conclusions built upon it.

  Bottom line: Adequate criteria must navigate the Scylla of church invention and the Charybdis of anachronistic alienation, anchoring Jesus firmly within his Galilean Jewish context while critically sifting post-Easter testimony, all while preserving his plausible apocalyptic message and resisting methodological fragility.
