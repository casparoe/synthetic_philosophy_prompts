prompt: |-
  I am trying to work out what I actually think about who belongs to the demos, going by my intuitions on particular cases. Here are my verdicts.

  A permanent resident who has lived here for thirty years, pays taxes, and raises a family, but holds no citizenship and never applies for it, ought to have full voting rights in both local and national elections; legal citizenship should not be a barrier.

  A citizen who emigrated permanently four decades ago, retains no property or family ties here, and participates only by casting an absentee ballot in national elections, ought not to be part of the demos for domestic policy; her formal status should not override her complete absence.

  A worker who lives just across the border, holds no citizenship, but whose livelihood depends almost entirely on trade with our economy and who will be severely harmed by a proposed tariff, ought to have a formal consultative voice in that specific decision, though not full membership of the demos.

  A tourist present for only a weekend, who will be inconvenienced by a sudden policy change that affects her travel plans, ought to have no say whatsoever; being temporarily affected is not enough.

  People who will live two centuries hence and suffer the climate consequences of our current carbon policy do not yet exist, and different policies will create different people, yet I still think they ought to be represented, perhaps through trustees, in the relevant decisions; this feels like membership of a derivative kind.

  The case I keep reversing on involves two people. One was born here to citizen parents but was adopted abroad as an infant, raised with no knowledge of her origin, and now holds citizenship by birthright alone; she has never lived here and feels no connection. The other is a stateless refugee who has lived for a decade in a camp that lies physically inside our borders but is administered by an international body, contributing to the local informal economy, with no path to citizenship. I cannot settle whether the birthright citizen belongs more fully than the present-but-unrecognised resident, or whether neither should be in the demos, or whether both should be, but for opposite reasons.

  Is there a coherent principle that captures all or most of these verdicts? What does it say about the two people in my uncertain case? And which of my other verdicts must I abandon if I want to keep the principle simple? Please also tell me what the principle predicts for a situation I have not mentioned: a person who spends exactly half of each year here, working remotely for foreign employers, using local services, but maintaining no social ties and holding citizenship elsewhere.

  Please reply in continuous prose only, with no headings, bullet points, bold text, or tables, as one would write in a letter or an email.
reasoning: |-
  Hmm, the user is grappling with the question of who should be included in the demos for political decision-making. They've presented several scenarios with their intuitive judgments and are seeking a coherent principle that ties together these intuitions while resolving their uncertainty about two specific cases. They also want to apply this principle to a new scenario about a semi-resident foreign worker.

  The user seems to be engaged in philosophical self-reflection about democratic theory - specifically the boundary problem of who constitutes "the people" in a democracy. Their scenarios test different dimensions of inclusion: duration of residence, affectedness, formal citizenship, future generations, and ambiguous cases. The reversal on the last case suggests tension between ascriptive (birthright) and associative (residence/participation) criteria.

  Looking at their verdicts, I notice consistent themes rejecting formal citizenship as decisive while emphasizing presence and stake in the community. The tourist case draws a clear line against transient affectedness, while the climate change case interestingly extends representation to non-existent future people - suggesting a "stakeholder" model beyond strict territorial presence.

  For the uncertain case, the birthright citizen without connection versus the de facto resident refugee, the principle I'm forming would likely exclude the former (due to absence of life-fabric entanglement) while including the latter conditionally (pending regularization of status). This maintains consistency with their rejection of the absentee voter and acceptance of the long-term resident non-citizen.

  The new scenario of the half-year remote worker tests temporal thresholds. Applying the principle, this person's lack of social integration and foreign employment might place them closer to the tourist than the 30-year resident, suggesting exclusion despite physical presence. But if they develop substantial dependencies (e.g., using healthcare, paying consumption taxes), consultative rights on specific affected policies might apply like in the cross-border worker case.

  The main tension appears between their inclusion of future generations (requiring trustee representation) and exclusion of the tourist (rejecting temporary affectedness). A simpler principle might need to sacrifice one - probably the future generations case, as it introduces distinct complications of non-identity and intergenerational justice. Alternatively, they could treat it as a special extension beyond the core demos principle.
answer: |-
  Your intuitions suggest a principle grounded in substantive connection and stakeholding rather than formal status alone. The core idea appears to be that membership in the demos arises from a deep, enduring entanglement of one’s life and well-being with the political community and its ongoing decisions. This encompasses both *vulnerability* to the collective’s choices and *participation* in the fabric of its society. Let’s call this the **Principle of Embedded Stakeholding**.

  This principle holds that an individual belongs to the demos when:
  1.  **Their life prospects are significantly and persistently shaped** by the collective decisions of the polity, beyond transient or incidental effects.
  2.  **They are integrated into the societal fabric** through residence, economic participation, or the establishment of life-defining ties (like family), demonstrating a reciprocal relationship with the community.
  3.  **Their presence and stake are ongoing**, not merely historical or potential.

  Applying this principle clarifies your cases:
  *   The 30-year resident non-citizen **belongs**: Deeply embedded through long-term residence, taxation, family life, and enduring vulnerability to all levels of policy. Citizenship is irrelevant to their fundamental stake.
  *   The absentee citizen abroad **does not belong**: Lacks current integration or vulnerability to domestic policy beyond the abstract national level. Formal status is insufficient without present embeddedness.
  *   The cross-border worker **deserves partial voice**: Their livelihood is profoundly and specifically vulnerable to the tariff decision, meeting criterion (1). However, lacking broader integration (criterion 2), full demos membership isn't justified, but a consultative role on that specific policy is.
  *   The tourist **does not belong**: Affectedness is transient and incidental, failing criteria (1) and (2). Vulnerability is too shallow and temporary.
  *   Future generations **deserve derivative representation**: While not "present" or "existing" in the strict sense, they have an ultimate, profound, and unavoidable stake (criterion 1) in the long-term consequences of current decisions, justifying trusteeship as a unique extension of the principle to unavoidable intergenerational impact.

  Your uncertain case finds resolution under this principle:
  *   The birthright citizen raised abroad **does not belong**: Despite formal status, she lacks *any* current entanglement (criterion 1), integration (criterion 2), or ongoing presence (criterion 3). Her connection is purely historical and legal, not substantive. Her "membership" is a legal fiction disconnected from reality.
  *   The stateless camp resident **should belong, contingent on regularization**: They have lived within the territory for a decade (criterion 3), are economically integrated (albeit informally, touching criterion 2), and their daily life and future prospects are demonstrably shaped by the laws and policies of the surrounding polity (criterion 1). The barrier is their lack of recognized status and the camp's administration. The principle suggests their de facto embedded stake *should* grant them membership, but the political community must first recognize their presence and regularize their status – the camp's administrative limbo is the anomaly preventing their rightful inclusion. Their claim is grounded in their actual, present, embedded existence.

  To maintain simplicity, the principle likely requires abandoning the *direct* inclusion of future generations as "membership of a derivative kind." While their stake is profound, it fundamentally differs from the present, embedded stake of living individuals. Representing future interests is a crucial *supplement* to the demos principle (based on unavoidable consequence), not a direct application of it. The simpler principle focuses solely on presently embedded individuals. You'd need to treat future representation as a separate, though vital, ethical imperative rather than an extension of demos membership.

  For the half-year resident remote worker:
  *   They have substantial *physical presence* (half the year) and *use local services* (indicating some vulnerability/resource dependence, criterion 1).
  *   However, they lack deep social ties (failing full integration, criterion 2) and their primary economic life (employment) and formal allegiance (citizenship) lie elsewhere. Their presence, while regular, might be more akin to a very long-term, recurring tourist than establishing a life-fabric entanglement.
  *   **Prediction:** They likely fall *outside* the demos under this principle. Their vulnerability is significant but perhaps not "persistently shaping life prospects" in the same way as the 30-year resident or camp dweller. Their lack of social ties and foreign economic anchor weakens their claim to integration. They might deserve consultation on specific policies directly affecting seasonal residents (like local service fees or seasonal housing rules), analogous to the cross-border worker, but not full voting rights. Their stake is present but insufficiently embedded.

  In essence, your intuitions point towards democracy for those whose lives are demonstrably built here and now within the community's shared fate, transcending paperwork. The uncertain case highlights that presence and vulnerability trump distant formal status, but require the polity to acknowledge the humanity within its borders. Simplicity asks you to see future generations not as part of the demos, but as a separate profound duty. The half-year resident remains a participant in the locale, but not yet a stakeholder in the polity.
