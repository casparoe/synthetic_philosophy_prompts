  I am preparing questions for a podcast interview with an unnamed philosopher who defends a specific variant of ontic structural realism applied to quantum field theory. On her view, individual particles are not merely epistemically inaccessible but ontologically derivative, and the structures that replace them are not static mathematical forms but networks of modal dependency relations—relations that determine what could exist given what actually exists—such that the apparent objecthood of particles in the classical limit is an emergent symmetry-breaking effect rather than an approximation to underlying individuals. Draft eight to ten interview questions that avoid having her restate the position and instead press where the literature presses. Include at least two questions on how her modal-dependency account avoids collapsing into epistemic structural realism, each paired with a follow-up keyed to her likely reply that these modal relations are metaphysically primitive rather than representational conveniences. Include at least two questions on the problem of intrinsic properties—if all physical properties are relational within the structure, what explains the qualitative character of specific quantum states—and for each include a follow-up anticipating her probable appeal to structural symmetry classes. Include one question asking how she distinguishes her derivation of particles from a standard eliminativist interpretation of quantum mechanics, with a follow-up for her expected answer that eliminativism denies objects altogether whereas she derives them from field structures. Include one question probing what empirical finding, perhaps involving violations of Bell-type correlations in regimes where particle number is not conserved, would genuinely weaken rather than be reinterpreted within her framework. Present the entire sequence—questions, anticipated answers, and follow-ups—as continuous prose only: no headings, bullet points, bold text, numbered lists, or tables; write it as a single flowing letter or email in which each proposed exchange is described in full sentences and paragraphs.
