answer: |-
  *Leans forward, forearms on the bar, pint glass half-empty between them. Eyes sharpen, not with anger, but the focused intensity of a familiar argument.*  
  "Alright, sharp point. Let’s gut it. You’re right—if density *alone* bled smooth as spilt ale, obligations *should* taper. No argument there. But you’re skipping the catalyst. The threshold isn’t **post-hoc**. It’s **emergent**. Like ice forming. Water’s liquid, liquid, liquid… then *snap*—solid. Same density, same molecules. What changed?"  

  *Taps the damp ring left by his glass on the wood.*  
  "**Reciprocity under rules.** When density hits a critical mass—not by magic, but by sheer fucking *friction*—people start building systems to manage conflicts, share burdens, pool risks. Courts. Roads. Pensions. These aren’t just ‘things’. They’re **binding feedback loops**. You pay taxes because you trust the bloke next to you does too, and you both get roads. You obey laws ’cause you expect *her* to obey them when your kid’s crossing the street. That expectation? It’s **sticky**. Once it locks in, it creates a qualitative leap—a *discontinuity* in obligation."  

  *Leans closer, voice dropping but cutting through the pub murmur.*  
  "So yeah, density’s continuous. But the **structure** it births isn’t. You don’t owe the farmer in Normandy the same as the one in Kent *not* because of a line on a map, but because you and the Kent farmer are tangled in the same net of reciprocal sacrifice and institutional trust. That net either exists, or it doesn’t. There’s no halfway. Prove me wrong: name one obligation that *taper* fades across a border without hitting a structural rupture."  

  *Sits back, eyebrow arched, waiting. No state. Just the mechanics of human knots.*
