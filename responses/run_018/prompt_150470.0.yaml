  I'm in my metaphysics of mind seminer and we just covered Dennett's idea that the self is basically a centre of narrative gravity, not some little soul-thing inside the head. For an assignment I need to cook up a thought experiment that forces Dennett's view and a more embodied, biological view — like, the self just is the living organism — to actually disagree, rather than talking past each other.

  Please construct a realistic scenario (hospital or therapy context, definitely not sci-fi, keep it to one paragraph) involving a single human body that somehow hosts two fully continuous first-person narrative streams. They share all the biological machinery but have zero access to each other's memories. To make it do real work, inject something like "narrative inertia" — imagine each stream's past commitments create a kind of gravitational pull on how it interprets new experiences, a pull that can't be reduced to brain states alone. The biological view should say there's still just one self because there's one body and one brain. Dennett's view should be pushed to say there are two selves, but then get stuck on which one "owns" the body. After describing the case, walk through what each theory says and why, identify the exact feature that's doing the philosophical work, explain what collapses if you take away the narrative inertia element, and tell me how a defender of the biological view would attack the scenario. Write it all in British English, please — my tutor's quite strict about that. And don't just hand me a bibliography; I need the actual reasoning.
