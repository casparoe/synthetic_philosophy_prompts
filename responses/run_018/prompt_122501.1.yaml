prompt: |-
  I'm a retired occupational physician, not a philosopher, and I ended up on my country's statutory insurance classification panel because somebody had to be. The panel's rulings are narrow but consequential: when we classify a state as a disease, the person gets treatment coverage, mandatory workplace accommodation, and protection against pre-employment screening for it; when we classify it as a normal variant or as a social problem, they get none of those, though they may still draw general disability support. Over three years we have ruled on the following, always unanimously and always without written reasons:

  1. Type 2 diabetes with established symptoms and complications — disease.
  2. Asymptomatic raised blood pressure in a 45-year-old with no symptoms, roughly doubling ten-year stroke risk — disease.
  3. Congenital absence of a small forearm muscle found in a substantial minority of the population, with no measurable functional consequence — not a disease.
  4. Common age-related hair loss with documented distress and real social and economic cost — not a disease, though we recommended wigs be funded under a separate cosmetic benefit.
  5. A child of normal intelligence and adequate schooling, with no neurological finding we could identify, who cannot learn to read — disease.
  6. A prolonged grief state: many months of intense distress and inability to work after a bereavement, no laboratory marker, and — as our own statistician told us — a duration distribution continuous with ordinary grief, so that any cut-off is a convention — disease.
  7. Chronic insomnia and panic symptoms in residents of a district with night-time noise above the legal limit, where the symptoms resolved completely when people were rehoused — not a disease; we called it an environmental problem and sent it to the housing authority.
  8. A hereditary variant producing unusually dense, fracture-resistant bones with no offsetting cost we could find — not a disease; we called it an enhancement.
  9. Lactose intolerance in adults: a minority in our country but a majority of adults worldwide, producing symptoms only when milk is drunk. We declined to classify it either way, and explicitly left open whether the reference population for "normal functioning" is our country, the species, or something narrower.

  The case now before us is a congenital sleep-wake variant, present in about 6% of the national population but in roughly a third of the population of one upland district. In carriers, sleep spontaneously divides into two blocks of about three and a half hours separated by one to two hours of quiet wakefulness; total sleep is about half an hour below the population median; the melatonin rhythm is phase-delayed relative to the population mean. On every standard measure of daytime alertness, cognition and mood they score in the normal range, and most report no distress — a good many report liking the interval and using it. Three things brought it to us. A matched cohort study finds about a 1.3-fold accident rate among carriers, but the entire excess is confined to employer-rostered night shifts and vanishes in carriers who work days or set their own hours. Three of the four claimants lost shifts or job offers after a workplace wellness programme flagged the variant. And there is an intervention — timed light plus melatonin — that does consolidate the sleep into a single block; in trials it produces consolidated sleep with no gain in daytime alertness and in some carriers a small loss, and carriers generally dislike it.

  Please don't give me a general theory of disease; give me something I can take into the room. Reconstruct the two or three rules that are each consistent with all nine of our earlier verdicts — one of my colleagues has started saying our record really tracks whether the cause is inside the person's skin, another that it tracks whether the state would still be there in a better-organised society, a third that it tracks whether we are willing to pay — and say what each rule predicts here. Which way would you expect us to go, and why? Which of our precedents is genuinely the closest analogue, as opposed to the one that feels closest? And since I suspect our record underdetermines this: what principle would we be committing ourselves to under each of the two live options, and what single further case — a variant of this one, or a new submission — should we ask to be brought before us next, because the rules you have identified would have to come apart on it?
reasoning: |-
  Okay, let me approach this methodically. The user is a retired occupational physician serving on an insurance classification panel, needing practical guidance for a complex sleep variant case. Their nine precedent rulings show nuanced patterns beyond simple biomedical models.

  First, I need to extract consistent rules from their precedents without imposing external theories. Looking at their cases:

  Diabetes and hypertension (cases 1-2) were classified as diseases despite asymptomatic status in hypertension, suggesting functional impairment or risk isn't always necessary. The congenital muscle absence (3) wasn't a disease despite being internal, while the non-disease hair loss (4) had real distress. The reading disability (5) was a disease without identified pathology, and prolonged grief (6) was classified as disease despite being statistically continuous with normal grief.

  The environmental insomnia (7) wasn't a disease because it resolved with environmental change. The dense bone variant (8) was an enhancement, not a disease. Lactose intolerance (9) was left unclassified, highlighting the reference population dilemma.

  Now for the sleep variant case: it's congenital, present in 6% nationally (higher in one region), with normal daytime function but increased accident risk specifically during night shifts. There's workplace discrimination and an ineffective intervention.

  I see three possible consistent rules emerging from their precedents:

  1. The "functional impairment rule": Disease classification requires impaired function that persists in accommodating environments (explains dyslexia, excludes environmental insomnia).

  2. The "exogenous cause rule": Not a disease if removal of external triggers eliminates symptoms (explains lactose intolerance hesitation and environmental insomnia).

  3. The "net harm rule": Requires net biological harm beyond social context (explains why grief is disease but hair loss isn't).

  Applying these to the sleep variant:
  - Functional impairment rule: No impairment in accommodating environments → not disease
  - Exogenous cause rule: Harm only under specific external conditions (night shifts) → not disease
  - Net harm rule: No inherent harm, only context-dependent risk → not disease

  The closest precedent is actually the environmental insomnia (case 7), not the grief or lactose cases, because harm is contingent on external factors. They'll likely rule "not a disease" but recommend workplace accommodations.

  To test these rules, we'd need a future case where impairment persists in accommodating environments without external triggers - perhaps a genetic variant causing unavoidable insomnia even in ideal conditions. That would force clearer distinction between the functional impairment and exogenous cause rules.
answer: |-
  Based strictly on your panel's nine prior rulings (without external philosophy), I reconstruct **three internally consistent rules** and apply them to the sleep-wake variant case. Your precedents show remarkable coherence around harm, context, and biological norms.

  ---

  ### **Three Rules Consistent With All Nine Verdicts**
  1. **The Functional Harm Rule**  
     *"Classify as disease if there is measurable biological dysfunction causing inherent harm or impairment that persists in accommodating environments."*  
     - **Explains precedents:**  
       - Disease: Diabetes (#1, complications), hypertension (#2, stroke risk), dyslexia (#5, functional impairment), prolonged grief (#6, disabling distress).  
       - Not disease: Muscle absence (#3, no impairment), hair loss (#4, distress but no *biological* dysfunction), environmental insomnia (#7, harm resolves when trigger removed), dense bones (#8, net benefit).  
       - Lactose (#9) excluded due to uncertainty about "normal function" reference.  

  2. **The Context-Dependent Harm Rule**  
     *"Classify as disease if harm/dysfunction is intrinsic and persists *regardless of external triggers or social context*."*  
     - **Explains precedents:**  
       - Not disease: Hair loss (#4, harm is socially mediated), environmental insomnia (#7, harm requires external trigger), dense bones (#8, no harm).  
       - Disease: Diabetes (#1), hypertension (#2), dyslexia (#5), grief (#6) all cause inherent harm independent of environment.  
       - Muscle absence (#3) has no harm in any context.  

  3. **The Biological Norm Rule**  
     *"Classify as disease if the state deviates from species-typical biological functioning *and* causes net harm."*  
     - **Explains precedents:**  
       - Disease: Diabetes (#1), hypertension (#2), dyslexia (#5) all deviate from species norms and cause harm.  
       - Not disease: Muscle absence (#3, no harm), hair loss (#4, species-typical aging), dense bones (#8, beneficial deviation).  
       - Grief (#6) is borderline but classified due to severity/duration; lactose (#9) excluded due to uncertain "norm."  

  ---

  ### **Predictions for the Sleep-Wake Variant**
  | **Rule**               | **Prediction**      | **Why**                                                                 |
  |-------------------------|---------------------|-------------------------------------------------------------------------|
  | **Functional Harm**     | **Not a disease**   | Harm (accidents) only occurs under specific external conditions (night shifts). In accommodating environments (day work, flexible hours), impairment vanishes. |
  | **Context-Dependent Harm** | **Not a disease** | Harm is entirely contingent on workplace structure, not intrinsic. Removes the trigger (night shifts) → removes harm. |
  | **Biological Norm**     | **Not a disease**   | Total sleep is near-normal; alertness/cognition unimpaired. The variant exists naturally in 6% (33% regionally) and may be adaptive. No net harm. |

  - **Expected Panel Ruling:** **Not a disease** (all three rules align here).  
  - **Closest Precedent:** **#7 (environmental insomnia)**. Both show:  
    - Harm context-dependent (resolves when trigger removed).  
    - No inherent dysfunction in accommodating settings.  
    - Workplace/social factors drive negative outcomes.  
    *Not #6 (grief)*: Grief caused inherent distress regardless of environment.  
    *Not #9 (lactose)*: Lactose causes intrinsic symptoms when exposed to a common dietary element.  

  ---

  ### **Commitment Under Each Live Option**
  - **If ruled "Disease":**  
    You commit to: *"Any biological state causing *context-contingent* harm qualifies as disease, even if harm is avoidable and no dysfunction exists in accommodating environments."*  
    → Overrules logic of #7 (environmental insomnia).  

  - **If ruled "Not a Disease":**  
    You commit to: *"Harm caused solely by *external triggers* (work schedules, noise) does not make a biological variant a disease, even if it has a genetic basis."*  
    → Consistent with #7 and #4 (hair loss social harm).  

  ---

  ### **Critical Next Case to Force Rules Apart**  
  Request a case testing the **boundary of "accommodating environments"**:  
  - *"A genetic variant causing severe circadian disruption (e.g., non-24-hour sleep-wake disorder) where:*  
    - *Impaired alertness persists even in ideal, self-paced environments.*  
    - *Harm (accidents, cognitive deficits) occurs regardless of social context.*"  

  **Why this case?**  
  - Under **Functional Harm Rule**: Likely disease (inherent impairment).  
  - Under **Context-Dependent Rule**: Likely disease (harm persists without external triggers).  
  - **Biological Norm Rule** might still call it disease (deviation + harm).  
  - *But crucially*: This would force separation from the current sleep variant case, where harm is avoidable. If you rule *this* new case "disease," it confirms accommodation potential is key. If not, you abandon functional harm as a criterion.  

  ---

  ### Practical Recommendation for the Panel  
  **Vote "not a disease"** and:  
  1. Cite **#7 (environmental insomnia)** as the controlling precedent.  
  2. Recommend **workplace accommodations** (e.g., exemption from night shifts) under occupational health regulations, mirroring how #7 was referred to housing.  
  3. Flag that employer wellness programs misusing this variant for screening may violate disability protections if accommodations exist.  

  This aligns with your panel’s historical emphasis on **avoidable harm** and **context-dependence**, while sidestepping philosophical debates about "normalcy." You maintain consistency without overcommitting to a single theory.
