  What they're really digging for, I suspect, is whether liberal democracies are being hypocritical. My response should show that while there is tension, the territorial defense premise creates a special category where even liberals accept compulsion - but with escape valves. The unspoken subtext is about whether similar models could work elsewhere, say if the US revived the draft. That's why they asked about "where the practice runs out" - testing its limits.

  Better emphasize that last point: these systems work because citizens perceive an existential stake. Without that, as in Vietnam-era US, conscription collapses. So the theory depends entirely on credible shared threat. That's the invisible pillar holding up the whole edifice.
answer: |-
  The conscription models of Switzerland, Finland, and Sweden rest on a sophisticated, hybrid theory of state authority that blends **civic republicanism, public goods theory, and liberal rights protections**, rather than a single unified theory. Here's a breakdown of the underlying principles and tensions:

  ### 1. **Core Justification: Civic Duty vs. Fairness**
     - **Civic-Republican Obligation**:  
       These systems implicitly endorse a **non-contractual duty of citizens to defend the polity**. This draws from classical republicanism (e.g., Rousseau, Machiavelli) where citizenship entails obligations to the collective survival of the community. The state isn't merely a service provider but a *res publica* (public thing) that citizens have a stake in preserving. Territorial defense is framed as an existential imperative, distinct from ordinary state functions.
     - **Public Goods/Fairness Argument**:  
       Simultaneously, they employ a **modified public goods justification**: national defense is non-excludable and vulnerable to free-riding. Conscription ensures equitable burden-sharing. However, this alone is insufficient, as states don’t conscript for other public goods (e.g., infrastructure). The *territorial defense limitation* is key: it narrows conscription to scenarios where (a) the good is truly existential, (b) free-riding directly threatens survival, and (c) alternatives (e.g., volunteers, mercenaries) are deemed inadequate for credible deterrence.

  ### 2. **The Territorial Defense Principle**
     - **Implicit Principle**:  
       The state may compel service only for **direct defense of the homeland and its constitutional order**, not for power projection or discretionary wars. This is rooted in:
       - **Proportionality**: Coercion is proportionate only to existential threats.
       - **Reciprocity**: The state defends citizens' rights; citizens defend the state that secures those rights.
       - **Deterrence Specificity**: Mass reserves deter invasion by signaling high costs to aggressors (Finland’s 900,000 reserves exemplify this).
     - **Moral Boundary**: Wars abroad lack the same reciprocity and existential necessity, making conscription for them illegitimate absent immediate threat (e.g., NATO’s Article 5 collective defense).

  ### 3. **Conscientious Objection: Liberal Concession or Sincerity Test?**
     - **Dual Function**:  
       It serves as both a **liberal safety valve** (protecting individual conscience) and a **practical filter**:
       - *Moral Concession*: Acknowledges that the duty to kill cannot override deeply held ethical/religious beliefs in a liberal state.
       - *Sincerity Test*: Longer alternative service (e.g., 1.5× military service in Switzerland) acts as a "price" to screen frivolous claims, balancing liberty and fairness.
     - **Theoretical Tension**:  
       Allowing objection implicitly admits the state’s claim isn’t absolute. Yet by requiring alternative service, it upholds the broader principle of **mandatory contribution to societal resilience** (civilian service still supports national defense indirectly, e.g., healthcare, disaster response).

  ### 4. **Where Theories Converge and Diverge**
     - **Overlap Zone**:  
       All three theories (civic duty, fairness, liberal rights) justify:
       - Conscription limited to existential territorial threats.
       - Gender-neutrality (Sweden) as a fairness imperative.
       - Reserve systems ensuring broad societal participation.
     - **Divergence Points**:  
       - *Civic republicanism* would resist professional armies; *public goods theory* could accept volunteers if sufficient.
       - *Liberalism* demands robust objection rights; *republicanism* might restrict them to non-combat roles only.

  ### 5. **Alternative Theories: Institutional Implications**
     - **Strict Liberalism** (coercion only for wrongdoing):
       - **Changes**: Conscription abolished. Defense becomes a professional, volunteer force funded by taxation.
       - **Surviving Elements**: Civil defense volunteering (e.g., firefighting) might persist as non-coercive civic engagement. Reserve systems could continue with financial incentives.
     - **Libertarianism** (defense as voluntarily purchased service):
       - **Changes**: No conscription. Military replaced by private contractors or subscription-based defense associations. Taxation for defense might be challenged.
       - **Surviving Elements**: Neutrality policies (Switzerland) could remain, but deterrence would rely on technology (e.g., drones) versus mass reserves. Territorial defense might be "bundled" with property rights.

  ### Why This Hybrid Works (For Now)
  These systems persist because they:
  - **Leverage Social Trust**: High trust in institutions (Finland/Sweden) and direct democracy (Switzerland) legitimizes coercion.
  - **Emphasize Universality**: Gender neutrality (Sweden since 2017) and broad participation reinforce fairness.
  - **Prioritize Deterrence**: Credible territorial defense reduces actual combat risk (Switzerland hasn’t fought a war since 1815).
  - **Adapt**: Sweden abolished (2010) then reinstated (2017) conscription as threats evolved, showing pragmatism over dogma.

  ### Conclusion
  The arrangement is **not theoretically unified** but a pragmatic fusion: a **republican core** (duty to defend the polity) wrapped in **liberal safeguards** (objection rights) and justified by **public goods logic** (fair burden-sharing for an existential good). It hinges on the unique status of *territorial defense* as a communal obligation transcending market logic. If replaced by strict liberalism or libertarianism, compulsory service would vanish, but professional militaries and civil defense volunteering could fill partial gaps—albeit without the same deterrent credibility or social cohesion these mass systems provide. The "Achilles' heel" remains: without broad societal belief in an existential threat (e.g., Finland’s view of Russia), the civic-republican foundation crumbles.
