prompt: |-
  hey so i've been arguing with my roommate about when people actually "count" as morally good, not just that they did a good thing. she has zero academic background but she's got these strong gut calls. here's the track record on made-up situations she's judged:

  1. some guy pulls a kid away from a car, but it's pure reflex — like yanking your hand off a stove. she says zero moral credit, it's just biology.

  2. another guy does the exact same save, but only because he thinks "if i dont do it i'll feel guilty forever". she gives him like half-credit — he did right but it's still about protecting himself from feeling bad.

  3. a woman gives away a ton of money anonymously. she was raised religious and genuinely believes every person has equal dignity because god made them, but she's never questioned that belief. roommate says full credit — the reason is right even if she never examined it.

  4. a guy gives away the same amount, but he calculated it maximizes happiness and admits he likes feeling clever when he solves moral puzzles. roommate says partial credit — the reasoning's okay but he's treating people like math problems for fun.

  5. someone donates huge cash specifically because they think it wipes out bad karma from shady stuff they did years ago. roommate says no credit, it's just self-cleaning.

  i think there's probably a couple seperate rules that fit all five, but i'm not sure. now here's the case i'm stuck on:

  this person spent like ten years in cooperative video games — reviving teammates, sharing loot, covering flanks. over time they built this real, non-fake care for strangers. now in real life they help people all the time, but they can't name a moral principle. they just say "it feels wierd if i dont help, like leaving a teammate hanging." no guilt, no reward, no religion — just a vibe that something's off when they don't.

  would my roommate call that full credit, partial, or none? for each plausible rule that still fits cases 1-5, tell me what it predicts for the video-game person. then give me your best guess which rule she's actually running and why. also name one extra case that would best tell those rules apart.

  please also say what would change your mind — like what argument or missing example would make you switch which rule you think she's using, or where your reasoning is most likely to fail.

  i might have typo'd a few things but you get the gist.
reasoning: |-
  Okay, I need to figure out the roommate's moral judgment system. Let me start by reviewing the cases she's already judged to find patterns.

  First, Case 1: Reflex save with no thought. She gives zero credit. That suggests she doesn't value instinctive actions without conscious intent. It's pure biology, so no moral weight.

  Case 2: Same save but motivated by avoiding guilt. Half credit. Here the person is acting consciously but for self-serving reasons—to prevent personal discomfort. So partial points for doing the right thing but demerits for self-focused motivation.

  Case 3: Anonymous donation based on unexamined religious belief. Full credit. The key seems to be that the belief itself is good (equal dignity), even if never questioned. The origin or depth of examination doesn't matter as long as the foundational reason is morally sound.

  Case 4: Donation based on utilitarian calculation plus personal enjoyment. Partial credit. The reasoning is acceptable (maximizing happiness) but tainted by treating people as puzzles and deriving pleasure from it. Self-interest reduces the moral credit.

  Case 5: Donation to clear bad karma. No credit. Purely transactional—using good deeds to offset past misdeeds. Entirely self-serving with no inherent concern for others.

  Now looking for patterns... The roommate appears to care about two things: (1) the quality of the underlying motivation (is it other-oriented or self-oriented?), and (2) whether the motivation aligns with a substantive moral principle (even if unexamined).

  Let me map this to ethical frameworks:
  - Kantian deontology would care about duty, but Case 3 suggests unexamined duty still counts.
  - Utilitarianism would focus on outcomes, but Case 4 gets partial credit despite good outcomes.
  - Virtue ethics might fit—Case 3 reflects the virtue of charity rooted in belief, while Case 4 shows flawed character.

  The roommate's system seems closest to virtue ethics where moral worth comes from character. Case 3 has virtuous character (belief in equality), Case 4 has mixed character (smart but detached), Case 5 has vicious character (purely selfish).

  For the video game case: The person helps others due to ingrained care developed through gameplay. They act because not helping "feels off" like abandoning a teammate. No guilt, no reward—just discomfort at violating their own nature.

  Applying the roommate's likely rules:
  - Motivation is other-oriented (care for strangers)
  - Rooted in a substantive principle (implied solidarity/teamwork), even if unarticulated
  - Not self-interested (no guilt avoidance or pleasure mentioned)

  This parallels Case 3—unexamined but good foundation. Should get full credit. The "vibe" resembles the religious donor's unthinking adherence to dignity.

  Alternative interpretations... Maybe she requires conscious reasoning? But Case 3 had no examination. Perhaps the origin matters? Gaming is artificial vs religion's cultural weight—but she didn't question origins in Case 3.

  Predicting her judgment: Full credit. The care is real, the motivation is pure, and the "off" feeling is a proxy for moral intuition.

  Testing with a new case: What if someone helps purely to maintain a self-image as "a good person"? That's self-serving (like karma cleansing) so should get no credit. Versus someone who helps spontaneously with no thought—like Case 1 but non-reflexive. If she gives credit, it confirms character matters more than deliberation.

  My reasoning could fail if she values explicit principles over embodied traits. But Case 3 suggests otherwise. Or if the gaming origin undermines it—but she accepted unexamined religious roots.
answer: |-
  Based on your roommate's judgments across the five cases, I've reverse-engineered her implicit moral framework. She seems to prioritize **two key criteria for "counting" as morally good**:
  1. **Motivation must be other-oriented** (focused on others' well-being, not self-interest).
  2. **Actions must stem from a substantive moral foundation** (e.g., a belief in human dignity, care, or duty—even if unexamined). Self-serving motivations (guilt avoidance, karma-clearing, intellectual pleasure) or purely biological reflexes reduce or eliminate moral credit.

  Here's how her rules map to the cases you provided:

  | **Case** | **Action** | **Motivation** | **Roommate's Judgment** | **Why It Fits the Rules** |
  |----------|------------|----------------|--------------------------|---------------------------|
  | 1 | Save kid from car | Pure reflex (biology) | Zero credit | Fails both: not motivated by others, no moral foundation. Just instinct. |
  | 2 | Save kid from car | Avoid personal guilt | Half-credit | Partial other-orientation (saves kid) but self-serving foundation (guilt avoidance undermines moral substance). |
  | 3 | Anonymous donation | Unexamined belief in human dignity (religious) | Full credit | Hits both: other-oriented (helps others), substantive foundation (belief in dignity, even if unexamined). |
  | 4 | Donation for utility | Maximizes happiness + enjoys "solving" morality | Partial credit | Mixed: other-oriented reasoning (utilitarianism) but self-serving element (treating people as puzzles for fun). |
  | 5 | Donation for karma | Offset past misdeeds (self-cleaning) | No credit | Fails both: purely self-oriented motivation, no moral foundation (transactional, not about others). |

  ---

  ### **Analysis of the Video-Gamer Case**
  **Scenario:**  
  A person develops genuine care for strangers through years of cooperative gaming (reviving teammates, sharing loot). They now help people in real life because not helping "feels weird, like leaving a teammate hanging." No guilt, reward, or abstract principles—just a discomfort with inaction.

  **Predicted Roommate Judgment: Full Credit**  
  - **Why?**  
    - **Other-oriented motivation:** Their care is "real, non-fake" and focused on others (helping strangers). The "weird" feeling isn't about guilt (self-punishment) but about failing to act on their ingrained care—similar to Case 3's unexamined belief.  
    - **Substantive moral foundation:** The gaming experience built a foundation of solidarity ("like leaving a teammate hanging"). This mirrors Case 3's religious belief—unexamined but inherently prosocial (teamwork as a proxy for human connection). No self-interest (e.g., karma, guilt, or intellectual reward) taints it.  

  **How Competing Rules Predict This Case:**  
  I tested three plausible interpretations of her framework. All fit Cases 1–5, but they diverge on the gamer:  

  1. **"Virtue-Lite" Rule (Best Fit)**  
     - Moral credit requires **embodied care/solidarity** (even if developed through habit) and **no self-focus**.  
     - **Prediction for Gamer:** Full credit (care is "real," teamwork ethos is a moral foundation, no self-interest).  
     - **Why it fits all cases:** Reflex (Case 1) lacks care; guilt (Case 2) and karma (Case 5) are self-focused; unexamined belief (Case 3) and utilitarianism (Case 4) are judged by whether care/solidarity is present.  

  2. **"Principle-Intentionality" Rule**  
     - Moral credit requires **acting on a coherent moral principle** (e.g., dignity, utility) but **discounts self-interested intent**.  
     - **Prediction for Gamer:** Partial credit (no named principle, just a "vibe"—so principle is implicit but weaker than Cases 3 or 4).  
     - **Why it fits all cases:** Reflex (Case 1) has no principle; guilt (Case 2) and karma (Case 5) corrupt intent; unexamined belief (Case 3) and utilitarianism (Case 4) have clear principles.  

  3. **"Selflessness Threshold" Rule**  
     - Moral credit requires **zero self-referential motivation** (guilt, reward, karma) and **some prosocial foundation**.  
     - **Prediction for Gamer:** Full credit (no self-interest mentioned; discomfort is about failing others, not self-punishment).  
     - **Why it fits all cases:** Reflex (Case 1) has no self *or* other-focus; guilt (Case 2), karma (Case 5), and "cleverness" (Case 4) are self-referential; unexamined belief (Case 3) is purely other-focused.  

  ---

  ### **My Best Guess for Your Roommate's Actual Rule**  
  I think she's running the **"Virtue-Lite" Rule**.  
  - **Why?**  
    - Cases 3 and 4 are the tell: She gives full credit to unexamined religious belief (because it embodies care/dignity) but only partial to utilitarian calculation (because it's detached, treating people as "math problems"). This shows she values **lived prosocial character** over abstract reasoning.  
    - The gamer's "real, non-fake care" and team-based solidarity align perfectly with Case 3—both have moral foundations built through experience (religion/gaming), not deliberation.  
    - Self-interest is her kryptonite: Any whiff of guilt, karma, or intellectual reward (Cases 2, 4, 5) reduces credit, but the gamer avoids this entirely.  

  **Roommate's Likely Reasoning for Gamer:**  
  *"Full credit. They built actual care for people through teamwork—that ‘weird feeling’ is their gut saying ‘we help each other.’ It’s not fake, not selfish, and it’s the same as that religious lady’s unshakeable belief in dignity. Doesn’t matter that it came from video games instead of church."*  

  ---

  ### **Test Case to Distinguish the Rules**  
  **Hypothetical Scenario:**  
  *Someone risks their life to save a stranger from a fire. They were raised in a strict honor-culture family and act solely because "dishonoring my family name by not helping would be unbearable." No guilt, no care for the victim—just cultural conditioning.*  

  - **"Virtue-Lite" Rule:** **No credit.** Motivation is self-oriented (family honor, not care for the victim) and lacks prosocial substance.  
  - **"Principle-Intentionality" Rule:** **Partial credit.** Honor is a coherent principle, but intent is self-focused (avoiding dishonor).  
  - **"Selflessness Threshold" Rule:** **No credit.** Motivation is self-referential (family reputation).  

  **Why this works:**  
  - Your roommate would likely say **no credit** (it’s self-cleaning like karma in Case 5). This matches the "Virtue-Lite" and "Selflessness Threshold" rules but contradicts "Principle-Intentionality" (which would grant partial credit for having a principle). Since she rejected utilitarian principles in Case 4 for being detached, she’d reject honor-culture for being self-interested—locking in "Virtue-Lite" as her true rule.  

  ---

  ### **What Could Change My Mind**  
  - **Argument/Example That Shifts My View:**  
    If you presented a case where she grants **full credit to someone acting on pure instinct** (e.g., "A nurse with decades of experience reflexively donates blood—no thought, just habit"), I’d abandon the "Virtue-Lite" Rule. Her judgment of Case 1 (reflex = zero credit) suggests she dismisses biology/habit, but if habit-based virtue counts, her rule leans closer to Aristotelian virtue ethics.  

  - **Where My Reasoning Is Weakest:**  
    I’m assuming the gamer’s "care" is equivalent to Case 3’s belief in dignity. If your roommate values **explicit moral concepts** (e.g., "dignity" vs. "team vibe"), she might downgrade the gamer to partial credit. But her acceptance of unexamined beliefs in Case 3 suggests the *source* (gaming vs. religion) doesn’t matter—only the substance of the motivation.  

  **Final Thought:** Your roommate has an intuitive, virtue-adjacent moral framework—one that’s pretty sophisticated for "zero academic background." If you want to win the argument, stress how the gamer’s "weird feeling" reflects deep-seated solidarity, not selfishness. But maybe just buy her pizza and call it a tie 🍕.
