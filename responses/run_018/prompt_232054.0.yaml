prompt: |-
  Next month I present a paper at a workshop on human behavioral biology. My thesis is that the standard critique of evolutionary psychology is right about the field's practice but wrong about its method in principle: adaptationist hypotheses about human psychology can be genuinely tested, but only if three conditions are met — the selective regime must be characterized independently of the trait it is invoked to explain, the hypothesis must generate at least one novel and risky prediction, and explicit non-adaptationist rivals such as by-products, drift, and phenotypic plasticity must be specified in advance rather than dismissed afterward. My argument is that the field's failures come from violating these conditions, not from adaptationism itself, and I use lactase persistence and the sickle-cell trait as existence proofs that adaptationist hypotheses can satisfy all three conditions when the evidence is available.

  The audience will be mostly behavioral ecologists who already work with optimality and game-theoretic models, plus two philosophers of biology who are sympathetic to the Gould–Lewontin spandrels critique.

  Prepare my question-period prep sheet: the objections in roughly the order I will actually get them from this audience, each phrased as these people would put it, with an estimate of how damaging it is, what I should concede, what I should hold, a reply compact enough for the time available, and a note on where that reply is soft. Include the objection I am hoping nobody asks.
reasoning: |-
  Okay, the user is presenting a paper at a workshop on human behavioral biology. Their thesis is that evolutionary psychology (EP) can be valid if it meets three conditions: independent characterization of the selective regime, novel and risky predictions, and specifying non-adaptationist rivals upfront. They argue that EP's failures are due to violating these conditions, not adaptationism itself, using lactase persistence and sickle-cell as examples.

  The audience includes behavioral ecologists who use optimality and game theory, and two philosophers sympathetic to the Gould-Lewontin spandrels critique. The user needs a prep sheet for Q&A, anticipating objections in the order they might come, assessing damage, what to concede, what to hold, concise replies, and where those replies are soft. Also, they want to know which objection they hope nobody asks.

  First, I need to figure out the likely objections. Behavioral ecologists might focus on methodology, like whether the three conditions are feasible in practice. Philosophers might challenge the foundational principles, like adaptationism itself. Both groups might question the examples. Lactase persistence and sickle-cell are classic examples, but are they applicable to complex behaviors? That's a common critique.

  The user mentioned the spandrels critique. Gould and Lewontin argued that not every trait is an adaptation; some are byproducts or due to drift. The philosophers might press on whether specifying non-adaptationist rivals is sufficient or if adaptationism inherently biases research. Also, the user's point about EP's failures being methodological rather than principled might be contested. If the field consistently fails to meet the conditions, is the method still viable?

  The user's three conditions are key. Independent characterization of selective regime means the environment should be known without referencing the trait. Novel predictions are risky ones that could falsify the hypothesis. Non-adaptationist rivals must be stated in advance. But how feasible is it to characterize past environments independently for human behaviors? That's a major challenge. Behavioral ecologists might point out that their models work for current observable behaviors but not for evolutionary history where data is scarce.

  Lactase persistence and sickle-cell are clear-cut genetic examples. Applying this to psychological traits like jealousy or cooperation is trickier. The philosophers might argue that the examples don't generalize. The "existence proofs" show it's possible in simple cases, but human psychology involves complex neural mechanisms and cultural influences. So, the objection about the examples not scaling up could be damaging.

  The objection the user fears might be about whether adaptationism is testable in principle for cognitive traits, given the lack of fossil evidence and the role of culture. That's a tough one because it questions the entire applicability of the method to psychology. The user would need to concede that it's harder but argue that it's possible with interdisciplinary methods.

  Prioritizing objections: Start with methodological challenges from behavioral ecologists, then foundational critiques from philosophers, then specific issues with examples, and finally the scalability and cultural factors. The last one about cognitive traits being different is the most damaging.

  For each objection, assess damage, what to concede, what to hold. For example, concede that past environments are hard to reconstruct but hold that it's possible with multiple lines of evidence. The reply should be concise, maybe referencing the examples as proofs of concept. The soft spots are where evidence is scarce, like for ancient human behaviors.

  Need to ensure replies are compact. For instance, to the objection about independent characterization being impossible, the reply could emphasize using paleo-climate, archaeology, etc., but admit it's harder for some traits. The soft spot is the practical difficulty.

  The hope-nobody-asks objection is likely about the fundamental testability for cognitive traits. The user would have to argue that methods like neurobiology and modeling can bridge the gap, but it's a weaker argument because direct evidence is lacking.

  Also, considering the audience's background: behavioral ecologists might be more sympathetic to adaptationist methods but critical of EP's lax standards. Philosophers might reject adaptationism entirely. Tailor replies accordingly—appeal to shared methodology with ecologists while acknowledging philosophical concerns by emphasizing rigorous testing.

  Including the spandrels critique: the philosophers might say that even with the three conditions, adaptationism overlooks constraints. The reply could be that specifying non-adaptationist rivals includes constraints, so it's covered. But the soft spot is whether researchers will genuinely consider alternatives or pay lip service.

  Order of objections:
  1. From behavioral ecologists: practical feasibility of the conditions, especially independent evidence for selective regimes.
  2. Philosophers: is adaptationism inherently flawed, regardless of methods?
  3. Examples not generalizable to complex behaviors.
  4. The role of culture and plasticity.
  5. The feared objection: testability for cognitive traits.

  For each, structure the prep sheet with objection, damage, concede, hold, reply, soft spot. The feared one last.
answer: |-
  ### Question-Period Prep Sheet: Objections & Replies  
  **Audience Profile:** Behavioral ecologists (pragmatic, model-oriented) + Philosophers of biology (spandrels-sympathetic). Expect methodological pushback first, then foundational critiques. Prioritize conciseness; replies must fit 60–90 sec slots.  

  ---

  #### **Objection 1 (Behavioral Ecologists): "Your three conditions are theoretically nice but impractical for human behavioral traits. We can characterize past selective regimes for lactase or sickle-cell using archeology/genetics, but how do we do this for, say, jealousy or cooperation? The fossil record is silent on cognitive traits, so independent evidence is impossible."**  
  - **Damage:** High (undercuts applicability to EP’s core subjects).  
  - **Concede:** Human cognitive traits *are* harder than single-gene examples; independent evidence will often be indirect.  
  - **Hold:** The conditions are *necessary*, not optional, for rigor. Feasibility varies but isn’t zero (e.g., use hunter-gatherer ethnography, paleoclimate data, or cross-species comparisons).  
  - **Reply:** "Agreed—it’s harder. But ‘impossible’ overstates. We reconstruct diets or social structures from isotopes and artifacts; we can triangulate selective pressures similarly. If we can’t meet Condition 1, we shouldn’t claim adaptation. EP fails when it bypasses this."  
  - **Soft Spot:** Indirect proxies (e.g., tool complexity for social cognition) are interpretive. Philosophers may pounce.  

  ---

  #### **Objection 2 (Philosophers): "You’re missing Gould’s point. Adaptationism isn’t just methodologically flawed—it’s a Panglossian bias that distorts inquiry. Demanding ‘non-adaptationist rivals’ upfront won’t help if researchers treat them as straw men. The spandrels critique is about epistemology, not your checklist."**  
  - **Damage:** Moderate (challenges your thesis’s philosophical depth).  
  - **Concede:** Yes, bias exists, and some EP work *does* pay lip service to alternatives.  
  - **Hold:** My conditions force falsifiability. If rivals are specified *in advance* (e.g., "plasticity explains X better than selection"), bias is constrained. Sickle-cell research did this: drift was tested, not just dismissed.  
  - **Reply:** "Fair—but bias thrives in unfalsifiable frameworks. Condition 3 forces engagement: if you can’t state rivals *testably*, you’re not doing science. This turns spandrels from a sermon into a tool."  
  - **Soft Spot:** Humans rationalize; "specifying rivals" could be performative.  

  ---

  #### **Objection 3 (Behavioral Ecologists): "Optimality models already generate predictions. Why add ‘novel and risky’? If a hypothesis fits existing data, why dismiss it?"**  
  - **Damage:** Low (audience agrees with prediction-centric science).  
  - **Concede:** Fitting data *is* valuable—but it’s not enough for adaptationist claims.  
  - **Hold:** Novel predictions prevent just-so storytelling. E.g., lactase persistence predicted allele frequencies in pastoralists *before* genetic data. EP often "predicts" known phenomena (e.g., "men like youth").  
  - **Reply:** "Optimality models shine when they risk failure. Condition 2 ensures we’re not retrofitting. If EP predicted unseen trait correlations (e.g., ‘jealousy module’ links to spatial memory), I’d trust it."  
  - **Soft Spot:** Some traits lack obvious "novel" predictions.  

  ---

  #### **Objection 4 (Philosophers): "Lactase/sickle-cell are poor analogies. They’re simple, recent, and Mendelian—but human behavior involves emergent cognition, culture, and plasticity. Your ‘existence proofs’ don’t scale."**  
  - **Damage:** High (threatens your core evidence).  
  - **Concede:** Yes, these are simple cases. Culture *does* complicate selection.  
  - **Hold:** They prove adaptationism *can* work under the conditions. If EP targets similarly tractable traits (e.g., fear reflexes), it could succeed. We must start small, not abandon principle.  
  - **Reply:** "Scalability is valid—but we don’t dismiss physics because quarks and galaxies differ. These show the method isn’t inherently bankrupt. For complex traits, we combine methods (e.g., game theory + plasticity models)."  
  - **Soft Spot:** Few EP traits are "tractable." Ignores Gould’s "pluralism" argument.  

  ---

  #### **Objection 5 (Behavioral Ecologists): "Your conditions ignore phenotypic plasticity. If a trait is adaptive *now* but wasn’t selected *then*, is it ‘evolutionary psychology’? Why not just use behavioral ecology?"**  
  - **Damage:** Moderate (questions EP’s added value).  
  - **Concede:** Plasticity is often the null hypothesis! EP overclaims.  
  - **Hold:** Condition 3 *requires* plasticity as a rival. EP’s niche is traits with deep evolutionary roots (e.g., infant attachment).  
  - **Reply:** "Exactly—plasticity should be the first rival tested. But if a trait is canalized (e.g., taste aversion), selection likely shaped it. EP can contribute, but only if it competes with ecology on equal footing."  
  - **Soft Spot:** Canalization is hard to prove.  

  ---

  #### **The Objection I Hope Nobody Asks (Philosophers): "Your thesis assumes adaptation is testable *in principle* for psychology. But how? Selection shapes genetic mechanisms, not behaviors directly. Without fossil minds or tight genotype-phenotype links, isn’t EP inherently untestable—even with your conditions?"**  
  - **Damage:** Severe (rejects adaptationism’s applicability to mind).  
  - **Concede:** We lack mind fossils, and brains are plastic. Not all traits will be testable.  
  - **Hold:** Testability isn’t binary. We infer selection from design evidence (e.g., efficiency, modularity). Condition 1 (independent regime) + Condition 2 (novel predictions) can work (e.g., if a cognitive trait correlates with ancient environmental proxies).  
  - **Reply:** "With design evidence, we test adaptations all the time (e.g., eye optics). For psychology, we use biomarkers, cross-cultural universals, or neural constraints. It’s hard, but ‘inherently untestable’ conflates limits of data with limits of theory."  
  - **Soft Spot:** "Design" arguments risk circularity. Philosophers see this as sleight of hand.  

  ---

  ### **Overall Strategy**  
  - **First 3 Replies:** Energize behavioral ecologists by aligning with model-building rigor (Conditions 1–2 are their bread and butter).  
  - **Last 2 Replies:** Acknowledge philosophers’ concerns but reframe conditions as *enablers* of pluralism.  
  - **Fear-Mitigation:** If the "hoped-nobody-asks" objection arises, pivot to "This is why EP needs *more* interdisciplinary tools (e.g., neuro-evo), not less science."  
  - **Time Management:** If overrun, skip concessions; prioritize holding the line on testability.  

  *Good luck—your thesis is strong, but this crowd won’t pull punches.*
