prompt: |-
  been following a debate about AI timelines and someone dropped 'history has hinges' to claim the 2017 transformer paper wasn't just incremental progress but actually bent the trajectry of civilisation. i feel like that phrase is doing a lot of hidden work. can you lay out the different precise theses that slogan could stand for? i want the full menu: from the banal claim that some events matter more than others, through the metaphysical idea that contingency clusters at specific points, to the historiographical view that we need hinge-narratives to make sense of long periods. for each reading say whether it's a platitute, whether it's defencable, which ones are actually false, and whether it actually gets the speaker their conclusion about that specific paper being decisive rather than part of a smooth curve. also flag which versions are compatible with determinism and which ones require genuine openness. and tell me which reading people usually invoke when they use the phrase to shut down a gradualist argument.
