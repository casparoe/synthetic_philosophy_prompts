  **Sestina: The Hole Argument**  

  We start with spacetime, and carve out a **hole**,  
  Where matter is absent: stress-energy fades.  
  Through vacuum, a set of bare manifold **points**—  
  Define a smooth metric. Then, introduce **shift**:  
  A diffeomorphism, constrained to the **same**  
  Boundary values. Outside, all stays **fixed**.  

  Outside, the metric and matter stay **fixed**;  
  Inside, the void of the matterless **hole**,  
  A twist of the map—though it looks just the **same**—  
  Now picks up the field values, starts to **drag**  
  Them along as it pushes each manifold **point**  
  Along hidden paths. Call this action a **shift**.  

  A mere reassignment? This quiet **shift**  
  Leaves curvature unchanged. Yet, if **fixed**  
  Coordinates label what’s real, then each **point**  
  Has identity. Deep in the darkening **hole**,  
  The metric we passively, smoothly **drag**  
  To new loci. Is the geometry **same**?  

  Yes! Light cones, free fall—all observables **same**.  
  But look at the bare stage: after the **shift**,  
  The metric tensor, which we roughly **drag**,  
  Assigns *different* values where all was **fixed**  
  Before. In the heart of the empty **hole**,  
  Two futures compete for the *same* set of **points**!  

  If we treat spacetime’s foundation as **points**  
  With selves (substantivalism), the **same**  
  Initial data—held firm where they’re **fixed**—  
  Now yield two solutions. The innocent **shift**  
  Inside the Einsteinian vacuum **hole**  
  Breaks determinism! The field starts to **drag**  

  Alternative futures. Relational **drag**  
  Says: "Points are just shadows! Ignore the bare **points**—  
  Only *relations* are real." The black **hole**  
  Of indeterminism? Resolved as the **same**  
  Physical world. The smooth, subtle **shift**  
  Leaves all gauge-invariant quantities **fixed**.  

  **Envoi**:  
  Realize: though the **drag** feels a wrenching **shift**,  
  The **same** observables hold where the boundaries stay **fixed**.  
  Bare **points**? They are phantoms. The **hole**’s lesson is told.  

  ---

  ### Notes for Clarity & Fidelity:  
  - **Stanza 1:** Sets up the hole (vanishing stress-energy), fixed boundary, and the shift as an active diffeomorphism.  
  - **Stanza 2:** The shift "drags" the metric field, leaving geometry (observables) identical but reassigning values to points.  
  - **Stanza 3:** Introduces tension—if points are real ("bare stage"), the dragged metric assigns different properties to the *same* points.  
  - **Stanza 4:** The hole argument’s crux: same initial data (fixed outside), different futures inside (threatening determinism).  
  - **Stanza 5:** Relationalism (denying points’ reality) resolves indeterminism by treating the shift as mere relabeling.  
  - **Stanza 6:** The models agree on observables (light cones, invariants) but clash if points are substantival.  
  - **Envoi:** Distills the lesson: observables are fixed, points are unreal, determinism saved by rejecting substantivalism.  

  This enacts the argument structurally: end-words shift roles (e.g., "drag" as verb/noun, "fixed" as adjective/verb) while recurring like dragged fields. Philosophers will recognize vanishing stress-energy, boundary conditions, and the dragged solution; newcomers grasp the core paradox through poetic tension.
