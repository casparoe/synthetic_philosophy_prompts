  Okay, let me tackle this teaching plan request. The user is a third-year philosophy student leading a discussion section for first-year interdisciplinary students who've never encountered social ontology. They need a fifty-minute session on collective intentionality that starts from the students' naive assumption that "doing something together" just means aligned individual goals. 

  Hmm, the core challenge here is epistemic scaffolding - figuring out which foundational idea must come first before the distinction between we-intentions and I-intentions becomes intelligible. The carrying example needs to meet very specific criteria: role differentiation without central control, and crucially, each participant lacking mental representation of the complete end state. The standard walking together case won't work because students could still imagine it as coordinated individual actions. 

  I'm considering a furniture assembly scenario - specifically flat-pack furniture with interdependent sub-tasks. For instance, building a complex shelving unit where: 
  - Person A only knows how to attach side panels to base 
  - Person B only knows bracket alignment 
  - Person C only understands top panel connections 
  None possess the full assembly knowledge individually. If any one acts on purely private intentions ("I'll just do my part"), the whole assembly fails because the connections between sections won't align. 

  The misconception map is critical. Students will likely: 
  1. Equate collective intentionality with group consciousness (intercept after the failure scenario) 
  2. Confuse it with strategic cooperation (defuse when discussing coordination attempts) 
  3. Reduce it to behavioral synchronization (address during the "unplanned harmony" contrast) 

  For the diagnostic question, I'm thinking of: "Could our furniture builders succeed if each privately intended to assemble the whole unit but only performed their partial role due to time constraints?" This tests if they grasp irreducibility rather than just memorizing definitions. 

  Regarding bracketing: 
  - Joint commitment (Gilbert) → "some philosophers emphasize mutual agreements" 
  - Plural subjecthood → "others focus on the 'we' as fundamental" 
  - Collective rationality → "there's debate about whether groups can have goals beyond individuals'" 
  All should be flagged as existing debates but declared out-of-scope for this session. 

  The arc must build from concrete failure - start with the furniture assembly collapsing due to partial knowledge, then show how coordination attempts still misfire, before introducing the we-intention as necessary solution. The skepticism about philosophy's relevance means every step must demonstrate conceptual necessity through palpable breakdowns.
answer: |-
  Here’s a structured 50-minute teaching plan focused on dependency, misconception interception, and concrete scaffolding for collective intentionality:

  ---

  **Core Objective:**  
  Demonstrate why "doing X together" *cannot* be reduced to aligned individual intentions + coordination, using a scenario where **each agent lacks a complete mental model of the goal**.

  ### Key Scenario: **Modular Epistemic Puzzle Assembly**  
  *Context:* 3 students assemble a complex 3D puzzle (e.g., curved geodesic dome).  
  - **Role A**: Only knows *how* to interlock Type-X edges (has instructions *only* for X-X connections).  
  - **Role B**: Only knows *how* to align Type-Y load-bearing joints (instructions *only* for Y-Y stability).  
  - **Role C**: Only knows *how* to secure the base (instructions *only* for base attachments).  
  *Crucial twist:* No one has seen the final design or understands how their part fits into the whole structure.  

  ---

  ### Teaching Sequence (Dependency Order)

  1. **Provocation (5 min)**  
     - Present scenario: *"Can they assemble the dome if each strictly follows their private instructions without communicating?"*  
     - *Reveal outcome:* **Inevitable failure** (e.g., A’s connections destabilize B’s joints; C’s base can’t support the misaligned sections).  
     - *Key Q:* "What’s *minimally* missing here?" → Surface intuition: *They need to coordinate actions*.

  2. **Intercept Misconception 1: Behavioral Synchronization (8 min)**  
     - *Experiment:* "Suppose they watch each other and adjust timing to work simultaneously. Does this fix it?"  
     - *Reveal:* Failure persists (synced actions still produce collapse—their actions conflict *structurally*).  
     - *Intercept:* "Synchronization ≠ understanding *how* actions combine toward a shared outcome."

  3. **Intercept Misconception 2: Strategic Cooperation (10 min)**  
     - *Experiment:* "Now they communicate tactically: 'I’ll hold this while you attach that.'"  
     - *Reveal:* Partial progress but ultimate failure (e.g., joints hold temporarily but dome collapses because no one grasps *why* their step matters for the whole).  
     - *Intercept:* "Even strategic coordination fails if no one intends *the collective outcome itself* as their goal. They’re still pursuing private sub-tasks."

  4. **Introduce the Critical Dependency: Goal Representation (12 min)**  
     - *Pivot Q:* "Could they succeed if each privately *aimed* to build the dome alone but only did their role? What’s the flaw?"  
       → Highlight: **Private end-states conflict** (A intends "A’s finished dome," B intends "B’s finished dome"—but there’s only *one* dome).  
     - *Conceptual leap:* "To succeed, they must share *not* just actions, but **one end state**: *this* dome’s completion *as our joint product*."  
     - *Label:* This is **collective intentionality** (minimally defined as *jointly intending X*).

  5. **Intercept Misconception 3: Group Consciousness (5 min)**  
     - *Anticipate:* "Does this imply a group mind?"  
     - *Clarify:* "No. It’s about individuals whose intentions reference *'we'*: *‘We are building this dome together’* (not ‘I am doing my part + hoping others do theirs’)."  

  6. **Consolidate with Scenario Resolution (5 min)**  
     - *Re-solve the puzzle:* "How does we-intention change things?"  
       → Agents now *mutually recognize* their roles as interdependent contributions to **one outcome**; they can troubleshoot as a unit ("If my part isn’t fitting, *our* goal is at risk").  

  ---

  ### Diagnostic Question  
  **"In a successful assembly, if Role C secretly believed they were building a *different* structure (e.g., a bridge), but followed all instructions/coordination, would the dome still hold?"**  
  - *Correct understanding:* **No** (C’s actions might *mechanically* fit but lack commitment to *this* collective end state, risking instability).  
  - *Memorization trap:* "Yes, if they did their job" (misses irreducibility of the collective goal).  

  ---

  ### Bracketed Debates (Named & Set Aside)  
  - **Joint commitment** (Gilbert): "Some argue this requires mutual agreements; we’re focusing on the *intentional structure*, not obligations."  
  - **Plural subjecthood** (Schmid): "Is the ‘we’ prior to individuals? We’re bracketing that metaphysics."  
  - **Distributive vs. collective rationality**: "We’re not asking if groups *should* act rationally—just what makes their actions *joint*."  

  ---

  ### Why This Works  
  - **Builds need first**: Failure modes make the concept *necessary* before naming it.  
  - **Epistemic dependency**: The scenario forces the realization that **no individual can represent the goal alone** → collective intention isn’t just "nicer" but *structurally required*.  
  - **Misconceptions intercepted in action**: Each failed experiment preempts a reductionist escape.  

  *Time buffer:* Allot 5 min for opening Q&A and 5 min for the diagnostic wrap-up. Adjust scaffolding questions based on real-time student responses.  

  ---  
  *This plan mirrors Searle/Bratman’s emphasis on intention-as-action-directive while sidestepping their technical debates. The scenario avoids Tuomela’s strong "group agent" claims, staying focused on phenomenology.*
