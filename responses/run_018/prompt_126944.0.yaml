          - Popper wanted both: a theory that is highly informative (high content) and true. But we don't know the truth, so we want to get closer to it.
          - But the activity shows that it's hard to define "closer". 
            * If we use a measure that rewards being true, then the cautious theories win.
            * If we use a measure that rewards being precise and close to the truth (like prediction error), then the bold theories that are approximately correct win.
          - However, the formal results (Miller, Tichý) show that for false theories, there is no consistent way to define verisimilitude that satisfies basic intuitions. In particular, they showed that any such measure will depend on the language used to express the theories, and that rankings can be reversed by changing the language.

        What we couldn't simulate: 
          - The formal result uses logical strength and the fact that a theory that is logically stronger (more content) might be false in more specific ways, making it farther from the truth in a logical sense. We see a glimpse when we note that F3 and F4 are logically weaker (they say less) and hence true, while F1 is logically stronger but false. So F1 is logically farther from the truth? But intuitively it's closer.

        What will go wrong:
          - Students might not propose a cautious theory. So we should encourage one group to be the "cautious scientists".
          - They might try to game the proximity scores by ranking their own theory high and others low. To mitigate, we make them rank all theories (including the cautious ones we provide) and we discuss as a class.
          - The scoring of the intervals might be seen as arbitrary. Why divide by 100? We can explain that we want to reward narrow intervals. Alternatively, we can use a different scoring: for an interval, the score is 10 if the true value is in the interval and the width is 0, and it decreases as width increases. We set a max width (100) beyond which we give 0.

     Timeline:
        5 min: Introduction
        10 min: Group work to propose theories (if they don't, we provide backups)
        15 min: Prediction phase (they compute predictions for test inputs)
        10 min: Scoring (we reveal test outputs and they compute scores)
        15 min: First ranking of theories by truth proximity (without test scores)
        5 min: Reveal prediction scores and ask for reconsideration
        15 min: Introduce F5 and discuss the dependence on test points
        20 min: Debrief

     Total: 85 minutes.

     We'll write the handouts and test data.

     Handout 1 (Training data):
        x | y
        1 | 5
        2 | 7
        3 | 9
        4 | 11
        5 | 13

     Handout 2 (Test inputs):
        x=6,7,8,9,10

     Handout 3 (Test outputs, revealed later):
        x=6 -> y=15
        x=7 -> y=17
        x=8 -> y=19
        x=9 -> y=21
        x=10-> y=23

     Handout 4 (New test point for F5? optional, or just discuss):
        x=100 -> y=203

     We hope this will make them feel the tension.
