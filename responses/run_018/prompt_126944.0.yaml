  ### In-Class Activity: The Verisimilitude Deadlock  
  **Objective**: Simulate the tension between a theory's empirical accuracy (content) and logical safety (truth-proximity) to experience Miller/Tichý-style impossibility firsthand. Students will propose theories about a hidden system, score predictions, rank rival theories by "truth-proximity," and discover their intuitive metric breaks.  

  ---

  #### **Materials**  
  - **Hidden System**: A black box with output \( y \) determined by \( y = 2x + 3 \) (unknown to students).  
  - **Data Cards**:  
    - *Training Data* (for theory-building):  
      ```
      x | y  
      1 | 5  
      2 | 7  
      3 | 9  
      4 | 11  
      5 | 13  
      ```  
    - *Test Inputs* (for predictions): \( x = 6, 7, 8, 9, 10 \).  
    - *Test Outputs* (revealed later): \( y = 15, 17, 19, 21, 23 \).  
  - **Theory Templates**:  
    - **Bold Theory**: Specific linear law (e.g., \( y = mx + c \)).  
    - **Cautious Theory**: Vague interval (e.g., "y is between L and U for all x").  
  - **Scoring Rules** (printed):  
    - **Prediction Score** (for accuracy):  
      - Point prediction (bold): \( 10 - |\text{prediction} - \text{true } y| \) (min 0).  
      - Interval prediction (cautious): If true \( y \) in interval, \( 10 \times (1 - \frac{\text{interval width}}{100}) \) (min 0; width ≥100 → score=0).  
    - **Truth-Proximity Rank**: Students rank theories from 1 (closest to truth) to 4 (farthest) using training data only.  

  ---

  #### **Timeline** (90 Minutes Total)  
  1. **Intro & Setup** (10 min):  
     - Explain the black-box system: "A hidden law governs \( y \) given \( x \). Use training data to propose competing theories."  
     - Split into 3 groups (3–4 students each). Assign roles:  
       - **Theorist**: Proposes a theory (bold or cautious).  
       - **Predictor**: Calculates test predictions.  
       - **Analyst**: Scores rival theories for truth-proximity.  

  2. **Theory Proposal** (15 min):  
     - Groups create one theory each:  
       - Group 1: **Bold Theory A** (e.g., \( y = 2.1x + 2.9 \)).  
       - Group 2: **Bold Theory B** (e.g., \( y = 5x + 0 \)).  
       - Group 3: **Cautious Theory C** (e.g., "y ∈ [0, 100] for x=1–10").  
     - Instructor adds **Cautious Theory D** ("y ∈ [0, 1000]") to force comparison.  

  3. **Prediction & Scoring** (15 min):  
     - Groups predict \( y \) for test inputs (x=6–10) using their theory.  
     - Reveal true test outputs. Groups calculate **Prediction Scores** using rules.  
     - **Expected Scores**:  
       - Theory A (bold): ~9.4/point (small errors).  
       - Theory B (bold): ~0/point (large errors).  
       - Theory C (cautious): 0 (width=100).  
       - Theory D (cautious): 0 (width=1000).  

  4. **Truth-Proximity Ranking** (20 min):  
     - **Round 1**: *Ignore test scores*. Groups rank **all 4 theories** (1–4) by "how close to truth" using training data. Expect:  
       - Split between teams ranking bold Theory A (high content) vs. cautious C/D (logically safer).  
     - **Round 2**: Reveal prediction scores. Groups re-rank theories. Expect heated debates:  
       - Bold teams push Theory A (high scores).  
       - Cautious teams argue C/D are "truer" (cover truth, even if uninformative).  

  5. **Twist: New Evidence** (15 min):  
     - Introduce **Theory E** (\( y = 2x + 3.5 \))—bold and false.  
     - Test predictions:  
       - x=6→15.5 (error=0.5), x=100→203.5 (error=0.5).  
       - Theory A: x=100→212.9 (error=9.9).  
     - Discuss: "Is E closer to truth than A? Does it depend on the test points (x=6 vs. x=100)?"  

  6. **Debrief** (15 min):  
     - **Map to Verisimilitude Deadlock**:  
       - Tension: Bold theories (high content) *feel* closer due to empirical success but are logically farther if false. Cautious theories are logically safer but lack content.  
       - Impossibility: Students’ ranking metrics broke—e.g., intransitivity (A>E? E>A?) or rewarding falsehood (cautious theories "win" by avoiding falsification).  
     - **Formal Gap**: Explain Miller/Tichý:  
       - *What we simulated*: Content (precision) vs. logical safety (truthfulness) tradeoff.  
       - *What we can’t simulate*: Language-dependence of verisimilitude (e.g., rankings reverse if you add new variables like temperature or pressure). You’ll bridge this with logic in lecture.  
     - **Key Insight**: "No metric maximizes both content and logical safety. Verisimilitude collapses because false theories can’t be consistently ‘closer’ than others across all contexts."  

  ---

  #### **What Will Go Wrong (And How to Fix)**  
  - **Gaming Proximity Scores**: Students rank their own theory #1.  
    - *Mitigation*: Force groups to rank **all** theories (including D and E) and justify publicly.  
  - **Overfitting Training Data**: Groups tune theories to fit x=1–5 perfectly.  
    - *Mitigation*: Remind them the *true law is hidden*; test data will reveal surprises.  
  - **Cautious Theories Dominate**: If groups fear low scores, all propose intervals.  
    - *Mitigation*: Assign Group 1 to be bold ("You’re risk-takers!"). Add Theory B as a "strawman" bold failure.  
  - **Time Crunch**: Ranking debates run long.  
    - *Mitigation*: Use strict timers. Skip re-ranking if needed; focus on the split in Round 1.  

  ---

  **Why This Works**: Students experience the deadlock organically—bold teams fight cautious teams, then clash over conflicting metrics. The twist (Theory E) exposes how context changes "closeness," priming them for formal impossibility results. No tech or readings needed!
