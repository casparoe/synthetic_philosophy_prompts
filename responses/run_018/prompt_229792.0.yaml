  You're a professional epistemologist who works on the structure of epistemic justification. Please think carefully about this one, maybe brainstorm a few candidate formulations before finalising the document, and write the whole answer in British English (so 'analysed', 'organised', 'favours', that sort of thing).

  I run a small evening reading group, and for the past year two of its members have been arguing about the epistemic regress problem without ever landing a clean statement of where they actually disagree. One is a foundationalist and the other is a coherentist. (There's also a third member who is a infinitist, but the first two mostly team up to shut him down.) I'm the neutral convenor, and I've agreed to draft the document they should have produced after a honest good-faith adversarial collaboration.

  This stopped being abstract for me a month ago, when my father got two conflicting medical opinions and I realised I couldn't articulate what would justify going with one rather than the other. I kept arguing both sides in my own head, and now I just want the positions pinned down properly.

  Draft the joint statement these two could both actually sign, in this format:

  First, a numbered 'Agreed claims' section. Cover what the regress problem is, what a theory of justification is meant to explain, what the regress argument rules in and out, and anything else substantive they share. Not bland stuff like 'we both value rigour' — claims that genuinely constrain the debate.

  Second, a disagreements table. Columns: the sub-question; how the foundationalist would word their own view; how the coherentist would word their own view; and whether that particular disagreement is substantive or partly verbal. Each side's wording should be something that side would actually endorse, not a strawman the other side drafted.

  Third, a 'Cruxes' section. For each crux — a sub-question such that settling it would move at least one of them — give the argument, case, or thought experiment both agree bears on it, and record each side's prediction in advance. I suspect some cruxes are: whether the regress argument presupposes a linear chain of reasons; whether coherence can be empirically contentful without smuggling in a non-inferential element; and whether the foundationalist can say what makes the regress stop where it does rather than somewhere arbitrary. Follow my hunches only where they're actually right, and add any deeper ones.

  Also say clearly where part of their dispute was really about words and where it wasn't. And if infinitism matters to their joint statement — it is the third option in the room — say how; I suspect they both reject it but for reasons that put pressure on different parts of their own views.

  Don't bother with citations or a reading list; I know the literature. I want the philosophical drafting itself.
