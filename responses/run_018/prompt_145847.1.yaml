prompt: |-
  Please explain, at a gut-level but without hiding the formal bones, why the frame problem survives the move from deterministic planning to probabilistic belief revision over continuous state spaces. The usual textbook treatment shows an agent failing to update beliefs about untouched features after a discrete action; I want to see why the same structural failure recurs—perhaps more severely—when outcomes are stochastic and states are real-valued, and whether carving beliefs into an explicit base plus derived extensions genuinely solves the explosion or merely relocates it to the rules of derivation. Work through the update logic step by step rather than relying on the classic mill or robot anecdotes. I come to this from the rationalist literature on logical omniscience and bounded reasoning, and I suspect the discrete-state framing obscures the deeper issue. If this premise is confused—say, if continuous spaces actually dissolve the problem via measure-zero considerations, or if explicit/derived partitions do escape the difficulty—tell me directly instead of accommodating it.
