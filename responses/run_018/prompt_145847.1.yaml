    = ∫ p_t(x_1, x_2', ..., x_n') dx_1 = p_t(x_2', ..., x_n')   [the marginal at time t]

  So the marginal for the other variables remains the same? That would be the case if the transition for x_1 does not depend on the other variables? But wait: in the above, we assumed T_1(x_1'|x_1,a) does not depend on the other variables. 

  However, if the transition of x_1 depends on x_2,...,x_n, then we cannot factor the integral and the marginal for the other variables may change. 

  But note: even if the transition of x_1 depends on x_2,...,x_n, we have:

