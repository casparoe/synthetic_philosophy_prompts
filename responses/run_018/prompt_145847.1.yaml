  We are addressing the frame problem in the context of probabilistic belief revision over continuous state spaces. The frame problem originally arises in deterministic planning: after an action, we must specify which fluents (state variables) change and which remain unchanged. The challenge is to avoid having to explicitly state the non-effects for every action and every fluent.

  In probabilistic settings, we model belief states as probability distributions over the state space. Actions (or more generally, observations and time evolution) lead to belief updates via probabilistic rules (like Bayes' rule or transition kernels). The frame problem then becomes: how do we efficiently update the belief state without having to recompute the probabilities for every state variable, especially when the action only directly affects a small subset?

  We are particularly interested in continuous state spaces, which are common in robotics (e.g., position, velocity) and other real-world applications.

  ### Step 1: Setting up the problem

  Consider a state space that is a product of continuous variables: 
    S = X_1 × X_2 × ... × X_n

  Each X_i is a continuous space (e.g., real-valued). The agent's belief at time t is a probability density function p_t(s) over S.

  An action (or a stochastic transition) is modeled by a transition kernel: 
    T(s' | s, a) = probability density of next state s' given current state s and action a.

  After taking action a, the new belief is updated by:
    p_{t+1}(s') = ∫ T(s' | s, a) p_t(s) ds

  Similarly, an observation update (via Bayes) for observation o:
    p_{t+1}(s) ∝ L(o | s) p_t(s)

  ### Step 2: The frame problem in discrete vs. continuous

  In discrete settings, the frame problem appears because after an action that affects only one variable (say, X_1), we would like to avoid updating the other variables (X_2, ..., X_n). But if the state is represented as a joint distribution, then even if the action only affects X_1, the update requires summing over all the other variables (which is exponential in the number of variables).

  In continuous spaces, we have a similar issue: the integral is over the entire state space, which is high-dimensional. The curse of dimensionality makes this integral computationally intractable for large n.

  Moreover, the transition kernel T(s'|s,a) might have a structure that we can exploit. For example, if the action only affects X_1, then we might have:

    T(s' | s, a) = T_1(x_1' | s, a) * δ(x_2' - x_2) * ... * δ(x_n' - x_n)   [if independent]

  But note: even if the transition is independent for X_1 (i.e., the other variables are unchanged), the belief state p_t(s) might have correlations between X_1 and the other variables. Therefore, when updating, we have:

    p_{t+1}(s') = ∫ [ T_1(x_1' | s, a) * δ(x_2' - x_2) * ... * δ(x_n' - x_n) ] p_t(s) ds

  Integrating over s, we get:

    p_{t+1}(x_1', x_2', ..., x_n') = T_1(x_1' | x_1, x_2, ..., x_n, a) * p_t(x_1, x_2, ..., x_n)   [with x_i'=x_i for i>=2, but note we integrate over x_1, x_2, ...]

