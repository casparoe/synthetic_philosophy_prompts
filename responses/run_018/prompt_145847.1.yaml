  However, note that the joint distribution of (x_1, x_2, ..., x_n) at time t might have correlations. The update for x_1 may break the correlation structure. The marginal for the others remains the same, but the conditional distribution of x_1 given the others changes. 

  So the frame problem in the continuous case: we still have to update the entire joint distribution? The integral above requires the joint density p_t at the fixed values of the other variables. But if the state space is high-dimensional, representing the full joint density is intractable.

  ### Step 3: The curse of dimensionality and the frame problem

  The issue is that we cannot represent the full joint density for large n. We must approximate. The frame problem then becomes: how to update the belief without having to compute the full joint? We want to exploit the fact that the action only directly affects a few variables, so that the update is local.

  But note: even if the action only directly affects a few variables, the dependencies (correlations) in the belief state may force us to update the entire representation. For example, if the belief state is Gaussian, then we can represent it by a mean and covariance matrix. The update for a linear Gaussian transition is efficient (via Kalman filter). But if the transition only affects one variable, the covariance matrix must still be updated in its entirety? Actually, in the Kalman filter, the update of the covariance matrix is a matrix operation that affects the entire covariance matrix (unless the covariance matrix is diagonal and remains diagonal after the update). But if the system is linear and the transition of one variable does not introduce new correlations, then the update might preserve the structure? 

  However, in general, even if the transition is local, the correlations in the belief state might be global. Therefore, the update will require updating the entire covariance matrix (which is O(n^2)). 

  Moreover, for non-Gaussian distributions, we might use particle filters or other representations. In a particle filter, we can update each particle by the transition kernel. But note: if the transition only affects one variable, we can update that variable in each particle. However, if the transition of that variable depends on other variables (which it might, because of correlations in the state), then we must still consider the entire state of the particle. So we do not avoid the high-dimensional state.

  ### Step 4: Explicit base plus derived extensions

  The idea is to split the state variables into base variables and derived variables. The base variables are independent and the derived variables are deterministic functions of the base. Then we only represent the distribution over the base variables. The derived variables are computed on demand.

  Example: In a robot localization problem, the base variables might be the position and velocity (x, v), and the derived variable might be the distance to a landmark d = ||x - L||. 

  When updating the belief (say, after moving), we update the joint distribution of (x, v). Then, when we need the distribution of d, we compute it from the distribution of x.

  But note: the frame problem seems to be avoided because we don't have to update d when we update (x, v) by a motion model? We update (x, v) and then d is defined by x. So we avoid having to represent the joint over (x, v, d) and update it.

  However, consider:

  1. The update of the base variables is still over the entire base state. If the base state is high-dimensional, we still have the curse of dimensionality.

  2. The derivation rule might be complex. If we need the joint distribution of several derived variables, we might have to compute high-dimensional integrals over the base variables. For example, if we have two derived variables d1 and d2, then the joint distribution of (d1,d2) is obtained by:

     p(d1, d2) = ∫_{ (x,v): d1(x)=d1, d2(x)=d2 } p(x,v) dx dv

  This integral might be difficult.

  Moreover, if we have observations on derived variables, then the update (Bayes) requires the likelihood of the observation given the base variables. For example, if we observe d1, then:

     p(x,v | d1_obs) ∝ p(d1_obs | x, v) p(x,v)

  But note: d1 is a function of x, so p(d1_obs | x,v) = p(d1_obs | d1(x)). Then we have:

     p(x,v | d1_obs) ∝ [likelihood of d1_obs given d1(x)] * p(x,v)

  This update changes the distribution of (x,v). But note that we are updating the base variables. The derived variables are then updated implicitly.

  However, the issue is: how do we represent the posterior p(x,v | d1_obs)? It might be more complex than the prior. If we use a Gaussian representation, then an observation on a derived variable (which is a nonlinear function) will lead to a non-Gaussian posterior. Then we must approximate.

  So the problem is not solved but relocated: we now have the challenge of representing and updating the base distribution, and then computing the derived quantities as needed. The base distribution might become complex due to the updates (especially if the derived observations are nonlinear). 

  Moreover, if there are multiple derived variables that are interdependent, we might have to compute their joint distribution, which requires integrating over the base. This integration might be high-dimensional and intractable.

  ### Step 5: Does continuous space dissolve the problem via measure-zero considerations?

  In the deterministic case, continuous spaces might allow us to ignore events of measure zero. However, in probabilistic reasoning, we are dealing with probability densities. The frame problem in the probabilistic setting is about computational tractability, not about logical omniscience per se. 

  The issue of logical omniscience (which is the problem that a Bayesian agent is assumed to know all logical consequences of its beliefs) is different. In continuous spaces, we might avoid having to explicitly represent every logical consequence because the set of states is uncountable. However, when we condition on an observation, we are effectively conditioning on an event of positive measure? Not necessarily: we might condition on an event of measure zero (e.g., observing a continuous random variable to be exactly a value) and then we use densities. 

  But the frame problem as a computational issue remains: we have to update the entire state distribution, and if the state is high-dimensional, it's intractable.

  ### Conclusion

  The frame problem survives the move to continuous state spaces and probabilistic reasoning because:

  1. The belief update requires integrating over the entire state space (or computing an integral over the state space). The curse of dimensionality makes this intractable for high-dimensional states.

  2. Even if the action only affects a few variables, the correlations in the belief state force us to consider the entire state. The marginal distributions of the unaffected variables might remain the same, but the joint distribution must be updated because the conditional distributions of the affected variables change.

  3. Splitting the state into base and derived variables only relocates the problem: 
     - The base state might still be high-dimensional, and updating it (especially after observations on derived variables) might lead to complex distributions that are hard to represent.
     - Computing derived quantities (especially joint distributions of derived variables) requires integrating over the base state, which is also high-dimensional and may be intractable.

  Therefore, the structural failure (the need to update the entire state) recurs and is even more severe in continuous spaces because of the curse of dimensionality. 

  The frame problem, in essence, is about the non-locality of belief updates in the presence of dependencies. This non-locality is not avoided by moving to continuous spaces or probabilistic reasoning. It is a fundamental challenge for bounded agents.
answer: |-
  ### Step-by-Step Explanation of the Frame Problem in Probabilistic Continuous-State Belief Revision

  The frame problem persists in probabilistic continuous-state settings due to the **structural coupling of state variables** and the **curse of dimensionality in belief updates**. Below, we dissect the update logic, showing why explicit base/derived partitions only relocate—not resolve—the explosion. Measure-zero considerations do not dissolve the problem.

  ---

  #### **1. Core Problem Setup**
  - **State space**: \( \mathcal{S} = \mathbb{R}^n \) (e.g., \( s = (x_1, x_2, \dots, x_n) \) with \( x_i \in \mathbb{R} \)).
  - **Belief**: A probability density \( b(s) \) over \( \mathcal{S} \).
  - **Action effect**: A stochastic transition kernel \( T(s' \mid s, a) \).  
    *Example*: An action \( a \) stochastically perturbs \( x_1 \) but leaves \( x_2, \dots, x_n \) unchanged *if independent*.  
  - **Frame challenge**: Update \( b(s) \) to \( b'(s') \) after \( a \), *without* recomputing all \( x_i \).

  ---

  #### **2. Belief Update Mechanics**
  After action \( a \), the new belief integrates over all prior states:
  \[
  b'(s') = \int_{\mathcal{S}} T(s' \mid s, a)  b(s)  ds.
  \]
  - **Deterministic shortcut?** If \( a \) *only* affects \( x_1 \), we might hope:
    \[
    b'(x_1', x_2, \dots, x_n) = \left[ \int T_1(x_1' \mid x_1, a)  b(x_1 \mid x_2, \dots, x_n)  dx_1 \right] b(x_2, \dots, x_n),
    \]
    where \( T_1 \) is the marginal kernel for \( x_1 \).  
  - **Why this fails**:
    1. **Dependence in \( T \)**: If \( T_1(x_1' \mid s) \) depends on \( x_2, \dots, x_n \) (e.g., a robot's movement depends on terrain slope \( x_2 \)), then:
       \[
       b'(s') = \int T_1(x_1' \mid s, a)  b(s)  dx_1 \quad \text{(still requires full-state integration)}.
       \]
    2. **Dependence in \( b(s) \)**: Even if \( T_1 \) is independent of \( x_{2:n} \), prior correlations in \( b(s) \) (e.g., \( x_1 \) = robot location, \( x_2 \) = battery level) force joint updates:
       \[
       b'(s') = \underbrace{\left[ \int T_1(x_1' \mid x_1, a)  b(x_1, x_2, \dots, x_n)  dx_1 \right]}_{\text{recomputes joint density}}.
       \]
       The marginal \( b(x_2, \dots, x_n) \) is preserved, but the *conditional density* \( b(x_1 \mid x_2, \dots, x_n) \) changes, requiring global recalculation.

  ---

  #### **3. Curse of Dimensionality in Continuous Spaces**
  - **Numerical integration**: For \( n \) dimensions, computing \( \int_{\mathbb{R}^n} \cdots  ds \) requires mesh grids or Monte Carlo methods. Cost scales exponentially with \( n \).  
  - **Kernel dependence**: If \( T(s' \mid s, a) \) has non-local effects (e.g., actions perturbing multiple variables), sparse representations (e.g., Gaussians) become non-analytical under nonlinear dynamics.  
  - **Measure-zero non-solution**:  
    While "untouched" variables have unchanged *marginals* in theory, in practice:
    - Beliefs are represented parametrically (e.g., particles, mixtures).  
    - Correlations force full-state updates even for measure-zero changes.  
    - *Example*: Updating a Gaussian belief \( b(s) \) after a perturbation to \( x_1 \) requires recomputing the entire covariance matrix if \( x_1 \) is correlated with other states.

  ---

  #### **4. Base/Derived Partition: Relocation, Not Solution**
  Split state into **base variables** \( \beta \) (e.g., position, velocity) and **derived variables** \( \delta = g(\beta) \) (e.g., "distance to landmark").
  - **Update process**:
    1. Update \( b(\beta) \) using \( T(\beta' \mid \beta, a) \).  
    2. Compute \( \delta \) on-demand via \( g(\beta) \).  
  - **Why explosion relocates**:
    - **Base update**: If \( \beta = (\beta_1, \dots, \beta_k) \), updating \( b(\beta) \) still faces the \( k \)-dimensional frame problem (Step 2).  
    - **Derivation cost**: Querying \( P(\delta \in E) \) or \( b(\delta) \) requires integrating:
      \[
      P(\delta \in E) = \int_{\beta: g(\beta) \in E} b(\beta)  d\beta.
      \]
      This is high-dimensional if \( \beta \) is high-dimensional or \( g \) is complex.  
    - **Observation updates**: An observation \( o \) of \( \delta \) updates \( b(\beta) \) via:
      \[
      b_{\text{new}}(\beta) \propto L(o \mid g(\beta))  b(\beta),
      \]
      which may distort \( b(\beta) \) non-parametrically (e.g., turning a Gaussian into a mixture).  
    - **Rule explosion**: Derivation rules \( g \) must be defined for all \( \delta \). In open worlds, new \( \delta \) emerge (e.g., new landmarks), requiring dynamic rule generation—which itself is undecidable in general.

  ---

  #### **5. Why Discrete Framing Obscures the Issue**
  - **Discrete cases** (e.g., STRIPS) focus on *logical non-effects* of actions.  
  - **Continuous generalization** exposes deeper issues:  
    1. **Topology of correlation**:  
       Correlations in \( b(s) \) form a topological graph. Updates propagate along all paths, not just direct dependencies (e.g., \( x_1 \) updated → \( x_3 \) affected via \( x_1 \)-\(x_2\)-\(x_3 \) correlation).  
    2. **Representation complexity**:  
       Continuous beliefs require approximate representations (e.g., particle filters, mixtures). Correlations force these representations to grow super-linearly with \( n \).  
    3. **Stochasticity amplifies coupling**:  
       Nondeterministic transitions smear dependencies (e.g., a stochastic effect on \( x_1 \) injects entropy into \( x_2 \) if correlated).

  ---

  ### Conclusion
  The frame problem **survives and intensifies** in probabilistic continuous settings due to:
  1. **Joint state dependencies** forcing global updates.  
  2. **Curse of dimensionality** in integration/kernel evaluation.  
  3. **Base/derived partitions** relocating the explosion to derivation integrals and rule complexity.  

  Measure-zero arguments fail because beliefs are finite-precision objects (no "free" invariants), and stochasticity creates dense dependencies. This aligns with bounded rationality: agents must approximate *both* belief updates *and* derivation rules, trading between update cost and query accuracy. The core issue is **state variable entanglement under finite computation**, which continuous spaces exacerbate, not dissolve.
