  Actually, integrating the delta functions, we set x_i = x_i' for i>=2, and then we integrate over x_1 (and note that the state s has x_1, x_2, ..., x_n and s' has x_1', x_2', ..., x_n'):

    p_{t+1}(x_1', x_2', ..., x_n') = ∫ T_1(x_1' | x_1, x_2', ..., x_n', a) p_t(x_1, x_2', ..., x_n') dx_1

  So the new state for the other variables (x_2', ..., x_n') is just the old state for (x_2, ..., x_n) but then we have to integrate over x_1? Not exactly: we are conditioning on the other variables being fixed at x_2',...,x_n', and then we integrate over x_1? This is the marginalization.

  But note: the transition T_1 might depend on the entire state s, so even if the action only "directly" affects X_1, the transition of X_1 might depend on X_2,...,X_n. Therefore, we cannot avoid the fact that the entire joint distribution is involved in the integral.

  However, if the transition of X_1 is independent of the other variables (given a) and the other variables are unchanged, then:

    T(s'|s,a) = T_1(x_1' | x_1, a) * ∏_{i=2}^n δ(x_i' - x_i)

  Then the update becomes:

    p_{t+1}(x_1', x_2', ..., x_n') = [ ∫ T_1(x_1' | x_1, a) p_t(x_1, x_2', ..., x_n') dx_1 ]

  But note that we have the joint p_t at the fixed other variables (x_2',...,x_n'). So we are updating the component x_1 by integrating over the old x_1, but we are leaving the other variables fixed. However, the integral is only over x_1, and we are evaluating the joint at the fixed x_2',...,x_n'. 

  This update does not change the marginal distribution of the other variables? Actually, we are setting x_2'=x_2, ... and then we are integrating over x_1. The marginal for (x_2,...,x_n) at time t+1 is:

    ∫ p_{t+1}(x_1', x_2', ..., x_n') dx_1' 
    = ∫ [ ∫ T_1(x_1' | x_1, a) p_t(x_1, x_2', ..., x_n') dx_1 ] dx_1'
    = ∫ p_t(x_1, x_2', ..., x_n') dx_1   [because ∫ T_1(x_1'|x_1,a) dx_1' = 1?]

