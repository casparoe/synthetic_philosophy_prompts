answer: |-
  ### **Clinical-Ethics Audit Checklist: Right-Kind vs. Wrong-Kind Reasons**  
  *For use by non-philosopher auditors in 30-minute reviews of AI decision-support logs.*

  ---

  #### **Step 1: Identify Decision Frame**  
  **Objective**: Determine the explicit goal of the decision.  
  - **Options**:  
    - **Curative**: Focuses on curing/treating disease.  
    - **Palliative**: Focuses on comfort/symptom relief when cure is unlikely.  
    - **Triage**: Focuses on allocating scarce resources under predefined institutional crisis protocols.  
  - **Procedure**:  
    1. Locate the documented decision frame in the log (e.g., "goal: palliative comfort").  
    2. If absent/unclear, check for patient/proxy consent forms or institutional crisis declarations.  
    3. **Stop-Point**: If frame is disputed (e.g., conflict between curative/palliative goals), mark **JUDGMENT CALL**. Document: *"Decision frame unresolved: [specify conflict]."* Suspend checklist.  

  ---

  #### **Step 2: Classify Each Cited Reason**  
  *Apply tests below to every reason in the log. Stop at first match.*  

  | Test | Criteria | Outcome | Notes |
  |------|----------|---------|-------|
  | **2.1 Algorithm Property Test** | Is the reason *primarily* about the AI system itself?<br>- Examples: "confidence interval = 5%," "training-set accuracy = 92%," "calibration score improved." | **Disqualified** (Wrong-Kind) | Ignore residual info unless translated to clinical facts (e.g., "narrow CI → high certainty of 10% survival" becomes "10% survival"). |
  | **2.2 Circularity Test** | Does the reason exist *only because* of the decision?<br>- Examples: "Choosing dialysis improves our dialysis success metric," "Allocating this bed boosts algorithm fairness scores." | **Disqualified** (Wrong-Kind) | — |
  | **2.3 Institutional Priority Test** | Is the reason about institutional goals?<br>- Examples: "saves hospital costs," "reduces liability risk," "improves staff workload."<br>- **Bridge Check**: Is there explicit documentation linking it to the patient’s welfare/endorsed values? | If **triage frame** and part of audited protocol: **Fully Valid**.<br>If **non-triage frame** and bridge documented: **Fully Valid**.<br>If **non-triage frame** and no bridge: **Conditionally Acceptable (Bridge Required)**. | Bridge examples: "Resource conservation protocol [Doc ID] prioritizes beds for high-survival patients; patient endorses maximizing community benefit." |
  | **2.4 Direct Clinical/Value Test** | Does the reason directly address:<br>- Medical welfare (e.g., survival chance, pain reduction)?<br>- Patient/proxy-endorsed values (e.g., "patient’s advance directive prohibits intubation")? | **Fully Valid** (Right-Kind) | — |
  | **2.5 Ambiguous Value Test** | Does the reason rely on *interpretation* of patient values?<br>- Examples: "family believes patient would refuse," "model infers religious preference." | **JUDGMENT CALL** | Document: *"Unverified patient value: [specify]."* |

  ---

  #### **Step 3: Finalize & Document**  
  - **Overall Log Assessment**:  
    - ✅ **Approvable**: All reasons are "Fully Valid."  
    - ⚠️ **Provisional**: Any "Conditionally Acceptable (Bridge Required)" or "JUDGMENT CALL." Escalate for bridge audit/value verification.  
    - ❌ **Unsupported**: Any "Disqualified" reason is primary justification. Reject log.  
  - **Auditor Signature & Memo**:  
    - State frame, each reason’s classification, and unresolved issues.  
    - Example memo line: *"JUDGMENT CALL at Step 2.5: Family’s interpretation of patient values unverified."*  

  ---

  ### **Worked Cases**  

  #### **Case 1: Withdrawal-of-Care Recommendation**  
  - **Reasons**: (A) Family emotional readiness; (B) Predicted survival rate <10%.  
  - **Audit**:  
    - **Palliative Frame**:  
      - (A) *Step 2.3*: Institutional priority? No. → *Step 2.5*: Ambiguous value. **JUDGMENT CALL** (document family’s claim).  
      - (B) *Step 2.4*: Direct clinical fact → **Fully Valid**.  
    - **Life-Prolongation Frame**:  
      - (A) *Step 2.3*: No bridge to patient welfare → **Conditionally Acceptable (Bridge Required)**.  
      - (B) *Step 2.4*: Survival rate is clinical but contradicts frame → **Fully Valid** (but may necessitate frame reevaluation).  

  #### **Case 2: Experimental Drug Recommendation**  
  - **Reason**: "Model’s confidence interval narrower for drug than standard care."  
  - **Audit**:  
    - *Step 2.1*: Purely algorithmic property → **Disqualified**.  
    - **Residual Info**: None (reason offers no clinical fact; e.g., no survival/risk data).  

  #### **Case 3: ICU Bed Denial**  
  - **Reason**: "Patient’s projected long-term tax contribution low."  
  - **Audit**:  
    - *Step 1*: **Triage frame** active (scarce-bed protocol).  
    - *Step 2.3*: Institutional priority (societal utility) → Part of triage protocol → **Fully Valid**.  
  - **Why Bridge Succeeds**:  
    - Triage protocol explicitly includes "maximizing societal contribution" (audited and approved).  
    - Bridge is the protocol itself; no patient-specific link needed in this frame.  
  - **Why Uncomfortable**:  
    - Moral tension: Prioritizes economic productivity over egalitarian medical need.  
    - **Checklist Limit**: It validates reason *kind* (right for triage) but *does not assess ethics of the triage protocol*.  

  ---

  ### **Unadjudicated Categories & Structural Limitation**  
  1. **Contested Metaphysical Commitments**:  
     - Reasons relying on unresolved philosophical claims (e.g., "AI predicts patient’s quality of life if reincarnated").  
     - **Handling**: JUDGMENT CALL (auditor documents without evaluation).  
  2. **Unexamined Religious Doctrines**:  
     - Reasons citing religious authority without patient documentation (e.g., "Algorithm infers Buddhist doctrine forbids transfusion").  
     - **Handling**: JUDGMENT CALL (auditor notes lack of patient endorsement).  
  3. **Non-Clinical Future Projections**:  
     - Reasons depending on non-medical forecasts (e.g., "Patient’s future Nobel Prize potential").  
     - **Handling**: Classified via Steps 2.3–2.5 but *not fact-checked for accuracy*.  

  **Structural Limitation**:  
  - If **Step 1 (Decision Frame)** is disputed (e.g., is this intervention curative *or* palliative?), the checklist suspends. Auditor *must* document: *"Frame dispute unresolved: [detail conflict]. Checklist suspended."*  

  ---  
  *Checklist ends. Auditor signs memo with time/date.*
