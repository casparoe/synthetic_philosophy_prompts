        - (a) family emotional readiness: This relates to the family's experience and by extension to the patient's values (if the patient values family well-being) or to the overall goals of palliative care (a peaceful and supported transition). However, it is not a direct clinical welfare reason. We must check if the patient or proxy has endorsed family considerations as part of their care. 
            - If there is documentation that the patient values family well-being in end-of-life decisions, then it is fully valid. 
            - Otherwise, it might require a bridge (e.g., in palliative care, family well-being is considered part of the holistic approach). But without patient endorsement, it's a JUDGMENT CALL? However, note: palliative care standards often include family support. We'll have to see.

        Let's design the checklist to require patient endorsement for non-clinical factors in non-triage frames.

        So: 
