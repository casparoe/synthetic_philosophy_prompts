prompt: |-
  You are advising a hospital network’s clinical-ethics audit office, which must review, within thirty minutes and without consulting outside philosophers, the justification logs produced by an intensive-care decision-support system. The system lists not only a recommendation—such as initiating dialysis, withholding vasopressors, or allocating a scarce bed—but also the considerations it treated as counting in its favor. Your task is to operationalize the practical-reason distinction between right-kind and wrong-kind reasons for action into a reusable, step-ordered checklist that a non-philosopher auditor can apply repeatedly, sign, and file.

  The checklist must preserve the core conceptual structure: a reason is of the right kind for a clinical decision only if it bears directly on the patient’s medical welfare or on values the patient (or legitimate proxy) has actually endorsed as governing this decision; it is of the wrong kind if it treats properties of the algorithm itself (calibration scores, confidence-interval width, training-set performance) as direct clinical justifications, if it appeals to outcomes the recommendation itself would create in a circular fashion, or if it imports institutional priorities (resource conservation, liability reduction, staff morale) without an explicit, audited bridge linking them to the patient-specific decision frame. The procedure should have explicit ordered tests—first identifying the decision frame (curative, palliative, or triage), then classifying each cited reason by its logical relation to that frame, then flagging meta-level and circular justifications—together with stop-points marked JUDGMENT CALL where interpretation of the patient’s values or the institutional mandate is unavoidable and must be documented rather than hidden. Specify the criteria for marking a reason “disqualified,” “conditionally acceptable with bridge required,” or “fully valid,” and state exactly where the auditor must suspend the checklist rather than force a determination.

  Apply the protocol to three worked cases. First, a withdrawal-of-care recommendation justified partly by family emotional readiness and partly by a predicted survival rate below ten percent: show how the checklist treats the survival statistic and the family-state consideration differently depending on whether the decision frame is palliative comfort or life-prolongation. Second, a recommendation to administer an experimental drug justified primarily by the fact that the model’s confidence interval is narrower for this option than for standard care: show the exact step at which this reason is disqualified as wrong-kind, and note what residual information, if any, survives reclassification. Third, apply the checklist to a case where it yields a determination you expect the auditor will find morally uncomfortable: a denial of a scarce ICU bed justified by the patient’s projected long-term tax contribution, where the protocol classifies this as an acceptable institutional reason within an explicit triage frame rather than a wrong-kind clinical reason, and you must state precisely where the line is drawn, why the bridge to the institutional frame succeeds on your criteria, and what feature of the case makes the approval feel wrong despite passing the test.

  Finally, list three categories of log entry the procedure is designed to leave unadjudicated—such as reasons that depend on contested metaphysical commitments about personal identity over time, or reasons drawn from religious doctrines that the audit office has no mandate to evaluate—and identify one structural limitation: that if the clinical decision frame itself is disputed (for example, whether a particular intervention should be evaluated under curative or palliative standards), the checklist must suspend judgment rather than resolve the framing dispute, and the auditor’s signed memo must record that suspension explicitly. Do not provide bibliographies, reading lists, or citations; do not invoke specific named texts with page numbers; and do not ask for references to literature the auditor could not access.
reasoning: |-
  We are creating a step-ordered checklist for auditors to classify reasons as right-kind or wrong-kind for a clinical decision.
   The core distinction:
     - Right-kind reasons: bear directly on the patient's medical welfare or on values the patient (or proxy) has endorsed for this decision.
     - Wrong-kind reasons: 
          (a) properties of the algorithm itself (calibration, confidence intervals, training performance) as direct clinical justifications;
          (b) circular justifications (the recommendation creates the outcome that justifies it);
          (c) institutional priorities (resource conservation, liability reduction, staff morale) without an explicit bridge to the patient-specific decision frame.

   The checklist will have:
     - Ordered tests: 
          1. Identify the decision frame (curative, palliative, triage).
          2. Classify each cited reason by its logical relation to that frame.
          3. Flag meta-level (algorithm properties) and circular justifications.
     - Stop-points marked "JUDGMENT CALL" where interpretation of patient values or institutional mandate is unavoidable and must be documented.

   Criteria for marking a reason:
     - "disqualified": clearly wrong-kind (e.g., algorithm property without clinical translation, circular reason).
     - "conditionally acceptable with bridge required": institutional priority that could be linked to the decision frame if a bridge is provided and audited, but currently missing.
     - "fully valid": directly relates to patient welfare or endorsed values in the current frame.

   Steps:

   Step 1: Identify Decision Frame
     - Determine from the log and context if the decision is framed as:
          (a) Curative: aimed at curing or treating the disease.
          (b) Palliative: aimed at relieving symptoms and improving comfort, not necessarily curing.
          (c) Triage: allocating scarce resources based on predefined institutional criteria (e.g., in a crisis).
     - If the frame is not clear or disputed, mark as JUDGMENT CALL and document.

   Step 2: For each cited reason in the log:
      2.1. Check if the reason is a property of the algorithm itself (e.g., calibration score, confidence interval, training performance). 
          - If yes, mark as "disqualified" (wrong-kind) and skip to next reason. 
          - Note: If the reason is about the algorithm's property but then translated into a clinical effect (e.g., "confidence interval narrow so we are more certain of the survival rate of 10%"), then the clinical effect (survival rate) is the real reason and the algorithm part is just support. In that case, we ignore the algorithm part and take the clinical claim. However, if the reason is stated solely as an algorithm property without clinical translation, it is disqualified.

      2.2. Check for circularity: 
          - Is the reason one that would not exist but for the decision? (e.g., "We should do X because doing X will make the statistics for X look better")
          - If circular, mark as "disqualified".

      2.3. Check if the reason references an institutional priority without patient-specific linkage:
          - Examples: resource conservation, liability reduction, staff morale.
          - If present, then:
              a. If the decision frame is "triage", then institutional priorities are acceptable if they are part of the predefined triage criteria. 
              b. Otherwise (curative or palliative), check if there is an explicit bridge that links the institutional priority to the patient's welfare or endorsed values in this specific case. 
                  - If there is a bridge (e.g., "resource conservation in this context allows more patients to be treated, and the patient has endorsed the principle of fairness in resource allocation"), then mark as "conditionally acceptable" but note that the bridge must be audited (i.e., the bridge itself must be checked for validity and documentation of patient endorsement). 
                  - If no bridge, mark as "conditionally acceptable with bridge required" (meaning the reason is not fully valid until the bridge is provided and audited). 
                  - However, if the institutional priority is presented without any bridge and the frame is not triage, then it is wrong-kind and we mark as "disqualified" unless a bridge can be built and documented.

          But note: In a triage frame, institutional priorities (like saving the most lives or maximizing life-years) are built into the frame. So they are acceptable without a per-patient bridge if the triage protocol is in effect and the reason is one of the criteria of that protocol.

      2.4. If the reason is a direct clinical consideration (e.g., survival rate, symptom relief, quality of life) or a value endorsed by the patient/proxy (e.g., the patient has stated they do not want life-prolonging measures if quality of life is below a threshold), then mark as "fully valid".

      2.5. If the reason involves interpreting the patient's values (e.g., what the patient would have wanted in a situation not explicitly discussed) then mark as JUDGMENT CALL and document.

   Step 3: After processing all reasons, if any reason is marked "conditionally acceptable with bridge required", then the overall recommendation cannot be approved until the bridge is provided and audited. If any reason is "disqualified", then that reason is invalid and if it was a primary reason the recommendation may be unsupported.

   However, note: the overall decision might still be justified by other reasons.

   The checklist output for the log: each reason gets one of the above classifications.

   Now, apply to three cases.

   Case 1: Withdrawal-of-care recommendation.
     Reasons: 
        (a) family emotional readiness
        (b) predicted survival rate below ten percent

     Step 1: Identify decision frame.
        - Possibility 1: Palliative comfort. The goal is to provide comfort and dignity in dying.
        - Possibility 2: Life-prolongation. The goal is to extend life as long as possible.

