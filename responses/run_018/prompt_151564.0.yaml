  For the reconstruction, I'll argue that PADs commit to two key principles: diachronic personal identity (the remitted and symptomatic selves are the same person) and earlier-epistemic privilege (the remitted self better understands the person's true interests). The practice strictly requires that the earlier stage has binding authority, which rejects presentism. What's merely compatible is whether this authority comes from four-dimensionalism (all time-slices are equally real) or discontinuity (the symptomatic self is inauthentic).

  When examining rival frameworks, I see that both four-dimensionalism and discontinuity models can justify PADs through different routes, while strict presentism can't. This makes the practice underdetermined - it doesn't force us to choose between these metaphysical views.

  The legal consistency question is particularly thorny. Contract law voids agreements made under duress or impairment, yet PADs enforce directives made during impairment. The difference seems to be that psychiatry views the symptomatic self as fundamentally inauthentic rather than temporarily impaired. This creates tension unless we accept illness as identity-altering.

  Finally, if we denied cross-temporal authority altogether, we'd have to radically change PADs - perhaps making them mere advisory documents. But that would undermine their core purpose of protecting patients from their future impaired states.

