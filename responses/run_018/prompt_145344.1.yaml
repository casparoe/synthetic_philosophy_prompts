prompt: |-
  Write the full desiderata that a theory of well-being must satisfy to be adequate, taking the experience-machine thought experiment not as a single intuition pump but as a structural stress test that exposes hidden commitments. I want the complete specification: the cases it must correctly handle—including the standard full-simulation scenario, the reverse case in which a suffering subject refuses to exit, and the partial-machine scenario in which only specific domains (e.g., social recognition or achievement) are simulated while the rest of life is genuinely lived—the distinctions it must preserve without collapse (for instance, between experiential quality and reflective life-evaluation, between being deceived about one's circumstances and lacking causal interaction with an external reality, and between possessing well-being and possessing it to a particular degree), the empirical findings from psychology or biology it cannot contradict if it is to remain credible (e.g., regarding adaptive preferences, hedonic adaptation, or the relationship between reported satisfaction and objective conditions), and the conceptual puzzles it must dissolve rather than dismiss. For each desideratum, provide the motivating consideration behind it, and flag whether it is non-negotiable or represents a camp-specific preference (hedonist, desire-fulfillment, objective-list). Identify any subset of desiderata that appears jointly unsatisfiable—if accommodating the intuitive rejection of total simulation forces a theoretical commitment that makes the reverse case inexplicable, state that tension explicitly, since the unsatisfiable subset is itself a philosophical result. Then indicate which single desideratum eliminates the largest share of mainstream theories, and briefly—without a full scorecard—note how hedonism, desire-satisfaction, and objective-list accounts fare specifically against that requirement. A table is acceptable.
reasoning: |-
  Okay, the user is asking for a comprehensive set of desiderata for a theory of well-being, using the experience machine thought experiment as a structural stress test. This is a deep philosophical query that requires unpacking multiple layers.

  First, I need to recall that the experience machine isn't just about rejecting simulated pleasure - it's a tool to expose hidden commitments in well-being theories. The user wants me to cover: cases (full simulation, reverse refusal, partial domains), necessary distinctions (experience vs evaluation, deception vs isolation, state vs degree), empirical constraints (adaptive preferences, hedonic adaptation), and conceptual puzzles.

  The user also wants me to identify which desideratum eliminates most mainstream theories. This suggests they're likely a philosophy student or researcher looking for a rigorous framework to evaluate theories. They might be preparing for academic work or trying to resolve theoretical tensions in their own thinking.

  I should start by structuring the desiderata systematically. The full-simulation case challenges pure hedonism - if pleasure is all that matters, why refuse the machine? The reverse case (refusing to exit suffering) tests whether well-being requires awareness - if someone prefers familiar suffering, does that count as well-being? Partial-machine scenarios reveal which life domains we consider irreplaceable by simulation.

  For distinctions, the experiential/reflective split is crucial - Nozick's original point about caring about more than just feelings. The deception/isolation distinction matters because one can know they're in a simulation but still value real connections. And well-being must have degrees - a theory should explain why some lives are better than others, not just binary "good/bad".

  Empirically, any theory must account for why people adapt to misfortune but still report satisfaction (hedonic treadmill), or why oppressed groups might claim contentment (adaptive preferences). Conceptually, it should explain why we care about past/future experiences and how to weigh pleasure against other values.

  Notably, there's a tension between respecting the refusal to enter the machine (which requires non-experiential elements) and respecting the refusal to leave suffering (which might require prioritizing experience). This joint desideratum D1+D3 may be unsatisfiable for some theories.

  I think D5 (non-experiential elements) eliminates the most theories - it directly rejects pure hedonism, challenges desire theories that accept adapted preferences, and pressures objective-list theories to justify their items without experiential components. A comparison table would efficiently show how each mainstream theory fares against this key requirement.

  The response should maintain academic rigor while making the tensions clear - this user wants philosophical substance, not simplification. I'll organize it with clear sections for cases, distinctions, empirical constraints, puzzles, tensions, and the eliminative desideratum analysis.
answer: |-
  Here is the complete specification of desiderata for an adequate theory of well-being, derived from the experience-machine thought experiment as a structural stress test, incorporating cases, distinctions, empirical constraints, and conceptual puzzles. Tensions and the key eliminative desideratum are identified.

  ---

  ### **Desiderata for a Theory of Well-Being**

  #### **I. Cases the Theory Must Correctly Handle**
  1.  **D1: Standard Full-Simulation Rejection (Non-Negotiable)**  
      *   **Case:** A subject refuses to enter a machine promising maximized positive experiences disconnected from reality.  
      *   **Motivation:** Captures the intuition that well-being requires more than subjective states (e.g., authenticity, real achievement, genuine relationships). Eliminates pure experiential accounts.  
      *   **Camp-Specificity:** Eliminates Pure Hedonism; challenges some Desire-Fulfillment (DF) accounts if desires include truth/contact.

  2.  **D2: Reverse Case (Suffering Subject Refuses Exit) (Non-Negotiable)**  
      *   **Case:** A subject suffering intensely in reality refuses to exit an experience machine simulating a minimally tolerable life, despite knowing it’s fake.  
      *   **Motivation:** Tests if well-being requires *some* experiential floor (avoiding unbearable suffering) and respects agency/adaptive preferences under duress. Challenges theories overvaluing objective reality regardless of suffering.  
      *   **Camp-Specificity:** Challenges strong Objective-List (OL) theories that prioritize "real" goods over relief from agony; consistent with Hedonism/DF if adapted desires are respected.

  3.  **D3: Partial-Machine Scenarios (Non-Negotiable)**  
      *   **Case:** Subjects accept simulation in specific domains (e.g., artificial social recognition, virtual achievements) while living "real" lives otherwise. Rejection varies by domain (e.g., might accept simulated awards but reject simulated love).  
      *   **Motivation:** Reveals which elements of well-being are *necessarily non-simulable* (e.g., deep relationships, authentic accomplishments) and which are simulable (e.g., pleasure, some achievements). Demands domain-sensitivity.  
      *   **Camp-Specificity:** Requires OL/DF theories to specify *why* certain goods resist simulation; Hedonism struggles to explain rejection in *any* domain.

  #### **II. Distinctions the Theory Must Preserve**
  4.  **D4: Experiential Quality vs. Reflective Life-Evaluation (Non-Negotiable)**  
      *   **Distinction:** Feeling happy *now* vs. judging one’s *life as a whole* as good/meaningful (even if parts are unhappy).  
      *   **Motivation:** The machine provides perfect experiential quality but fails reflective evaluation (knowing life is fake). Well-being requires both. Empirical psychology shows these can diverge (e.g., depressive realism).  
      *   **Camp-Specificity:** Hedonism collapses to experience; DF/OL must link desires/objective goods to both levels.

  5.  **D5: Deception vs. Lack of Causal Interaction (Non-Negotiable)**  
      *   **Distinction:** Being *wrong* about reality (deception) vs. having *no causal interaction* with reality (isolation).  
      *   **Motivation:** Machine objections often cite *both*, but they are distinct. A subject knowingly isolated (no deception) might still reject it, valuing causal agency. A deceived subject might be content until discovery.  
      *   **Camp-Specificity:** Hedonism ignores both; DF must specify if desires require truth/causation; OL must justify why interaction matters.

  6.  **D6: Possessing Well-Being vs. Degree of Well-Being (Non-Negotiable)**  
      *   **Distinction:** A life having *some* well-being vs. being *maximally* or *sufficiently* good.  
      *   **Motivation:** The reverse case (D2) involves minimal well-being; partial machines (D3) may enhance well-being in domains without making life "flourishing." The theory must account for thresholds and scaling.  
      *   **Camp-Specificity:** Universal requirement; tests consistency in weighting components.

  #### **III. Empirical Constraints**
  7.  **D7: Accommodates Adaptive Preferences (Non-Negotiable)**  
      *   **Constraint:** People adapt desires/lower expectations under oppression/poverty, reporting satisfaction despite objectively bad conditions.  
      *   **Motivation:** A credible theory cannot equate reported satisfaction with well-being in these cases (e.g., a contented slave). Must explain why adaptation sometimes preserves, sometimes undermines, well-being.  
      *   **Camp-Specificity:** Challenges DF theories relying on actual desires; favors OL or "informed" DF; Hedonism accepts adaptation.

  8.  **D8: Accounts for Hedonic Adaptation & Set-Points (Non-Negotiable)**  
      *   **Constraint:** People adapt to both positive/negative life changes, returning to baseline happiness levels over time.  
      *   **Motivation:** Challenges theories equating well-being with net pleasure or transient states. Must explain the value of non-adaptive goods (e.g., meaning, relationships).  
      *   **Camp-Specificity:** Hedonism must incorporate adaptation dynamics; OL/DF better explain persistent value beyond adaptation.

  9.  **D9: Explains Divergence Between Reported Satisfaction & Objective Conditions (Non-Negotiable)**  
      *   **Constraint:** Self-reported life-satisfaction often correlates weakly with objective welfare indicators (health, freedom, income) due to cultural norms, comparison, resilience.  
      *   **Motivation:** Well-being cannot be *defined* by subjective reports alone, but theories must explain what reports measure and when they are reliable/defective.  
      *   **Camp-Specificity:** Hedonism/DF struggle with divergence; OL has resources to critique reports.

  #### **IV. Conceptual Puzzles**
  10. **D10: Dissolves the Non-Identity Problem (Camp-Specific Preference: OL/DF)**  
      *   **Puzzle:** Do actions affecting who comes to exist (e.g., having a child later with a disability vs. earlier without) harm the resulting person if their life is worth living?  
      *   **Motivation:** Tests if well-being is comparative or absolute; relates to whether life must meet a threshold.  
      *   **Camp-Specificity:** Critical for OL/DF; less direct for Hedonism.

  11. **D11: Explains the Value of Past/Future Experiences (Non-Negotiable)**  
      *   **Puzzle:** Why care about past accomplishments or future goals if only present experience matters?  
      *   **Motivation:** Machine life lacks a meaningful past/future narrative. Well-being seems temporally extended.  
      *   **Camp-Specificity:** Hedonism struggles (focuses on present experience); DF/OL incorporate narrative/achievement.

  12. **D12: Resolves the Paradox of Hedonism (Non-Negotiable)**  
      *   **Puzzle:** Directly pursuing happiness often undermines it; well-being arises as a byproduct of other pursuits.  
      *   **Motivation:** Machine pursuit maximizes hedonistic focus but seems empty. A theory must explain why indirect pursuit succeeds.  
      *   **Camp-Specificity:** Hedonism struggles; DF/OL explain via the structure of desires/objective goods.

  ---

  ### **Tensions & Jointly Unsatisfiable Desiderata**
  *   **Core Tension:** **D1 (Rejecting Full Simulation) & D2 (Respecting Sufferer's Refusal to Exit)** create pressure.
      *   **D1** demands non-experiential elements (authenticity, reality-contact) are essential for *high* or *full* well-being.
      *   **D2** demands that experiential relief from extreme suffering can constitute sufficient reason for a choice *despite* sacrificing non-experiential elements, suggesting experiential states can be primary *in extremis*.
  *   **Unsatisfiable Subset?** A theory insisting non-experiential elements are *always strictly necessary* for *any* well-being (to satisfy D1 strongly) cannot explain D2 (choosing simulated relief over real agony). Conversely, a theory making experiential states solely determinative (to satisfy D2 strongly) cannot explain D1. **Resolution requires a threshold or lexical priority model:** Non-experiential elements are essential for *flourishing* (D1), but relief from unbearable suffering is a prior experiential minimum (D2). Pure theories (Hedonism, strong OL) fail one side.

  ---

  ### **Most Eliminative Desideratum**
  *   **Desideratum D5: Non-Experiential Elements are Necessary (from D1/D3/D4/D5)**  
      *   **Why Most Eliminative:** Directly targets the core commitment of Pure Hedonism and severely challenges many DF and OL accounts that cannot adequately justify *why* truth, authenticity, or causal contact are intrinsically valuable beyond experience/desire-satisfaction.
      *   **Impact on Mainstream Theories:**

  | Theory          | Fate Against D5 (Requires Non-Experiential Elements)                     |
  | :-------------- | :----------------------------------------------------------------------- |
  | **Hedonism**    | **ELIMINATED:** Denies intrinsic value to anything beyond experiences.   |
  | **Desire-Fulfillment** | **SEVERELY CHALLENGED:** Only survives if "informed desires" include desires for truth/authenticity/causation *as such*, and if frustrated desires in the machine undermine well-being even if unaware. Otherwise, collapses into experientialism. |
  | **Objective-List** | **POTENTIALLY SATISFACTORY:** Can include goods like "authenticity," "real achievement," or "causal agency" as intrinsic list items. Must justify their inclusion and weighting. |

  ---

  This framework demonstrates that the experience machine is not merely an intuition pump but a generator of structural constraints. A viable theory must navigate the tension between the necessity of non-experiential elements for flourishing and the sufficiency of experiential relief from agony, while respecting empirical psychology and key conceptual distinctions. **Hybrid theories** (e.g., desire-sensitive pluralism) currently have the strongest claim to satisfying the broadest set, though perfect satisfaction remains elusive.
