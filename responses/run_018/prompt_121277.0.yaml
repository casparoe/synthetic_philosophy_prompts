  Okay, the user is a historical novelist who's been roped into grading a philosophy final. They need help assessing a student's answer about historical objectivity, specifically regarding a hypothetical "Total Record." The student argues that both historians and novelists impose narrative shapes on raw facts, differing only in genre conventions. 

  First impression: The student clearly grasps key concepts (Ranke, Carr, White) and structures arguments well. But the novelist in me winces at equating historical reconstruction with fictional invention - though I must check that bias. 

  Breaking it down:
  For (a) on Ranke: Student correctly identifies Ranke's anti-moralizing stance but oversimplifies. They miss that Ranke still believed in discerning "what really happened" through sources - the Total Record would've thrilled him despite making historians redundant. (14/20 here)

  For (b) on Carr: Nails Carr's point about selection being inherent, not just a byproduct of incomplete records. But doesn't engage Carr's deeper idea that historical facts are defined by the historian's framework. (16/20)

  For (c) on White: Strongest section. Perfectly captures White's emplotment theory and its implications. Even the "moral choice" phrasing is textbook White. (19/20)

  For (d) the novelist claim: Here's the rub. Student commits the error of treating all conventions as equally arbitrary. But historical conventions (archival rigor, citation) are truth-tracking tools, while novelistic ones aren't. The conflation of "shaping" in both genres is philosophically shaky. (10/20)

  Biggest gap: No mention of Collingwood! A top answer would contrast reconstructing past agents' reasons (history) versus inventing them (fiction). Also misses that historians are constrained by evidence in ways novelists aren't - their "shaping" can be empirically wrong. 

  Final grade: 15/20. Strong on exposition but weak on critical analysis in part (d). Margin comments should flag where conventions aren't epistemically equivalent - maybe suggest reading Ankersmit on narrative substance versus fiction. 

  User's instinct is right: The novelist is wrong to claim equivalence, but for deeper reasons than just "making things up." The student's argument holds only if you ignore how historical narratives remain accountable to evidence in ways fictional ones aren't. Must emphasize that in feedback.
