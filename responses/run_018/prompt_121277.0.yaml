  ### Assessment & Feedback  
  **Overall Mark: 14/20**  
  *(Breakdown: (a) 4/5, (b) 4/5, (c) 4/5, (d) 2/5)*  

  ---

  ### Marginal Comments & Line-by-Line Feedback  
  **¶1 (Ranke Analysis):**  
  * "Ranke's famous phrase... not a promise that the past can be copied onto the page."  
    ✅ **Correct.** Charitably read, you capture Ranke’s anti-moralizing stance and his focus on source criticism.  
  * "The record... bypasses the problem entirely."  
    ✅ **Strong point.** The Total Record sidesteps Ranke’s *methodological* concerns about imperfect evidence.  

  **¶2 (Carr Analysis):**  
  * "Selection isn't a defect... it is what having a subject consists in."  
    ✅ **Precise.** You correctly distinguish Carr’s deeper worry (selection as inherent to historical inquiry) from superficial "gaps."  
  * "Answers the crude version... not the serious one."  
    ⚠️ **Defensible but slightly oversimplified.** Carr *also* worries about how the historian’s contemporary lens shapes the questions asked. A stronger answer would note that the Total Record doesn’t resolve this.  

  **¶3 (White Analysis):**  
  * "Carr holds that the facts are refracted... White holds that they must be supplemented by a shape of our own."  
    ✅ **Excellent contrast.** Clear articulation of White’s key thesis: narrative form is imposed, not discovered.  
  * "The choice between [emplotments] is aesthetic and political... a moral choice."  
    ✅ **Perfect.** Nails White’s radical conclusion about narrative incommensurability.  

  **¶4 (Novelist’s Claim):**  
  * "Both [historian and novelist] begin from a heap of particulars... neither can extract the shape from the particulars."  
    ⚠️ **Overgeneralized.** While both impose structure, historians are *constrained by evidence* in ways novelists aren’t (e.g., a historian can’t invent a conversation). White’s point is about *narrative form*, not invention of content.  
  * "The historian's plain style... conventions are all they are."  
    ❌ **Problematic.** Historians’ conventions (e.g., footnotes, sourcing) aren’t *just* stylistic; they’re epistemic tools for accountability. Novelists’ "frankness" doesn’t equate to the same truth-tracking function.  
  * "She is right: the two genres differ... not in how they stand to the truth."  
    ❌ **Incorrect.** The student conflates (i) *narrative necessity* (White) with (ii) *epistemic standards*. Historians must justify their claims about particulars (i) with evidence; novelists need not. "Truth" in history requires fidelity to evidence, not just coherence.  
  * "The one thing she cannot claim is (i)... a rule is only a convention too."  
    ⚠️ **Misleading.** Distinguishing (i), (ii), and (iii) was crucial. Conventions in history *serve* (i) and (ii); in fiction, they suspend (i). Calling rules "only conventions" ignores that historical conventions are truth-apt.  

  ---

  ### Summary Feedback for Student  
  **Strengths:**  
  - You expertly distill Ranke’s anti-didacticism and White’s emplotment thesis.  
  - Your contrast between Carr’s "gaps" vs. "selection as inherent" is insightful.  
  - Structure is clear, and prose is confident.  

  **Weaknesses in (d):**  
  1. **Equivocation on "shaping":** You treat historical and fictional "shaping" as identical, but historians shape *within evidential constraints*. A novelist inventing dialogue violates (i), while a historian selecting evidence (ii) doesn’t.  
  2. **Ignoring truth-aptness:** Historians’ "conventions" (e.g., citing sources) allow claims to be falsified; novelists’ conventions (e.g., "based on real events") don’t. The genres aren’t equally "true to the past."  
  3. **Misreading the prompt:** Part (d) asks whether the novelist is *right* to claim equivalence "using (a)-(c)." Your answer assumes White’s view *settles* the issue, but White himself distinguished history from fiction by their *referential commitments* (see *Metahistory*, 1973).  

  **What a First-Class Answer Would Add:**  
  - Use the Total Record to show **asymmetry**: A historian using the Record *could* produce a chronicle verifying (i), while a novelist inventing content cannot.  
  - Engage **Arthur Danto**: Historians explain *why* events matter within a causal matrix; novelists explore *what it felt like*. The Record alone lacks "significance" (ii/iii).  
  - Distinguish **conventions**: Historical conventions (e.g., peer review) correct errors; literary conventions prioritize aesthetic cohesion.  
  - Address **(iii) explicitly**: White argues we *can’t* adjudicate between emplotments; a top answer would note that historians *do* debate narrative adequacy (e.g., "Was the fall of Rome tragic or inevitable?") using evidence.  

  ---

  ### Defense of Grade (Appeal Justification)  
  - **Lost marks in (d)**: Misrepresents the relationship between evidence and invention (confuses narrative structure with content creation). Fails to distinguish *referential* truth (i) from *narrative* truth (iii).  
  - **Charity applied**: Ambiguous phrasing (e.g., "shape") was read as "narrative form" (White’s sense), not "invention of facts."  
  - **Key oversight**: The novelist’s claim hinges on conflating *all three* criteria. The student correctly notes the novelist fails (i) but wrongly dismisses this as "just convention."  

  **Your Instinct Was Sound**: The novelist *is* wrong, but not just due to invention—it’s because historical "shaping" answers to evidence in ways fiction doesn’t. Ranke (a) and Carr (b) show history’s empirical core; White (c) shows narrative’s inevitability, not its equivalence to fiction.  

