prompt: |-
  I'm writing a novel about an archivist who discovers old ledgers where every culture tracked something they called "ontological debts" — lists of things people fought over whether they existed but never actually resolved. I was chatting with my friend about verbal disputes in metaontology, and she brought up Carnap, but I feel like the usual framing misses something important.

  Could you argue that the classic fight between ontological pluralists and monists about whether composite objects like tables really exist is definately just a verbal disagreement about the pragmatic rules governing plural quantification? Specifically, defend the view that "exists" works more like a gradable adjective tied to narrative salience — so saying "the table exists" is closer to saying "the table matters in this story" — which means ontological commitment should be indexed to conversational scorekeeping rather than formal quantification. Make the case that this dissolves the pluralist-monist clash without falling back on Carnap's linguistic-framework distinction, and try to explain why that doesn't just reduce everything to expressivism. No need for bibliographies or citations; I'm just trying to figure out if this idea holds water for a chapter I'm drafting.
