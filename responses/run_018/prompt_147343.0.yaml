  ok so ive been stuck on the sleeping beauty problem and i think i see a hidden contradiction that nobody really addresses. if beauty is a thirder then upon waking she assigns 1/3 to heads, which means she treats monday-heads, monday-tails, and tuesday-tails as equally likely awakening-slots. but that sounds like shes assuming there are literally three copies of her consciousness competing to be the one that wakes up, which is basically everettian branching applied to a coin flip. since im a phisicalist i only think one brain-state is actually occurring right now, so how can she rationally spread her credence across three slots unless shes smuggling in an ontology she doesnt actually believe? does this mean self-locating belief collapses into multiverse metaphysics, or is there a way to keep the thirder answer without committing to personal fission? i feel like im missing something obvious but i cant see where the confusion is.
