prompt: |-
  I'm a print journalist who has covered evolutionary biology on and off for fifteen years, and I've been asked to run a forty-five-minute breakout session at a science-writers' conference this autumn on the units-of-selection dispute: genes, organisms, groups, and whatever else now puts in a claim to be a level. The room will be about twenty-five reporters, editors and freelancers, most of whom cover medicine, environment or technology and last studied biology at school, though two or three have serious genomics or conservation beats. There is a whiteboard and no projector, and a colleague who covers conservation told me last week she had assumed the whole thing was settled decades ago, so I suspect a good half of the room arrives in that state. What I need from you is not an explanation of the debate — I've read the popular treatments and I don't want another one — and not a bibliography or a list of names to read up on, which I have no time for. What I need is a plan for the forty-five minutes: the order the pieces have to come in and why, and in particular what has to be in place before phrases like 'gene's-eye view' or 'group selection' will mean anything to this audience at all, and why that thing cannot be skipped.

  The case I'm considering building the session around is a composite I've been playing with: a clonally transmissible facial tumour in a social, mongoose-like carnivore, passed between animals when they bite each other during feeding contests; the tumour lineage carries its own heritable variation, some lineages grow slowly and keep the host alive and sociable for longer and so reach more new hosts, faster-growing lineages outcompete them inside a single host, and the hosts in turn vary genetically in how readily they accept a graft. I want to know whether that should carry the whole session, and exactly what a carrying case has to have and — as importantly — lack to do this work: my worry is that it is already so strange that people will file it as a medical curiosity rather than see it as a lens on ordinary organisms, and I'm also unsure whether it is better to invent it or to anchor it to the clonally transmissible facial cancer in Tasmanian devils, given that my audience will trust a real story and may treat an invented one as a trick. Relatedly, here is the thought I actually want them to leave with, which I'd like you to check or correct: that much of this dispute is not a disagreement about what happens in nature but about how to do the accounting, that two researchers can partition the same change in the frequency of a trait in two different ways and both be right, and that the genuinely contested part is whether there are cohesive, heritable, variance-generating things above or below the organism at all. What I want them able to do afterwards is open a fresh 'cheater cells' or 'colonies as individuals' paper and ask whether it is reporting a new prediction or a new description. If that is the wrong target for forty-five minutes, tell me what to target instead.

  Then give me the misconceptions this audience will bring or form, in the order they will form them, and the point in the sequence where each should be headed off. My guesses, which I'd like you to correct and add to, are that they will hear 'group selection' as animals sacrificing themselves for the good of the species; that they will take kin selection and multi-level selection to be rival hypotheses with different predictions rather than, as I half-understand it, different ways of cutting the same cake; and that if I say genes are the units they will conclude organisms don't matter. Finally: one question I can put to the room in the last five minutes that would show me they can diagnose a new claim about levels of selection rather than merely repeat my vocabulary, together with the confidently wrong answer they are most likely to give so that I can tell the two apart; what I should openly refuse to explain at this level and say I'm refusing; and which of the ambitions above I should cut.
reasoning: |-
  Okay, let me unpack this journalist's complex request. They're preparing a 45-minute session on the units-of-selection debate for science writers, most with limited biology backgrounds. The core challenge is designing a session that builds understanding sequentially while avoiding common misconceptions.

  First, I need to consider the audience's likely starting point: many think this debate was settled decades ago. That means I must quickly establish why the question remains open. The Tasmanian devil tumor case study seems perfect - it's real, dramatic, and shows selection operating at multiple levels simultaneously. Using a real example builds credibility better than a composite.

  The key insight I want to convey is that much of the debate is about accounting methods rather than conflicting facts. To reach that, the session must first establish three foundational concepts: heritable variation, fitness consequences, and the difference between vehicles and replicators. Without these, phrases like "gene's-eye view" will confuse rather than illuminate.

  For misconceptions, I anticipate several: equating group selection with species-level altruism, seeing kin and group selection as rivals rather than frameworks, and thinking gene-centered views negate organismal importance. Each needs preemptive addressing - for example, when introducing group selection, immediately clarify it's about local breeding groups, not species.

  The tumor case can carry the session if properly framed. I'll emphasize how it mirrors ordinary evolution: the cancer lineages compete (like genes), hosts are environments (like ecosystems), and transmission requires social behavior (creating group effects). This prevents it being dismissed as mere medical curiosity.

  For the closing diagnostic question, I'd propose something about ant colonies where workers sacrifice reproduction. The wrong answer would be calling this "group selection" without specifying what's heritable - whereas the right analysis would examine whether colony-level traits are inherited across generations.

  I should explicitly avoid delving into formal mathematics or philosophy of science. The goal isn't mastery but giving journalists tools to ask: "Is this claiming new phenomena or just new accounting?" That focus means cutting deeper history - names like Williams and Wynne-Edwards can remain unmentioned.

  The sequence should flow: start with the compelling tumor case to hook interest, extract general principles from it, then show how those apply to classic debates. End by distinguishing between empirical discoveries and conceptual reframings - which is exactly what journalists need to cover this field responsibly.
answer: |-
  Here's a battle-tested 45-minute plan designed for your specific audience and goals, leveraging your composite case (anchored to reality) and targeting your core insight. The key is building *scaffolding* before introducing loaded terms.

  **Core Insight to Anchor Everything:** "Much of the dispute is about *accounting* – different ways to mathematically partition *the same change* in trait frequency. The genuinely contested part is whether there are cohesive, heritable, variance-generating entities *beyond the individual organism* that matter for evolution."

  **The Plan: 45 Minutes**

  1.  **Hook & Frame: The "Settled" Question is Open (5 mins)**
      *   Start: "My colleague thought this was settled decades ago. She's partly right – *natural selection* is settled. But *what exactly is being selected?* That's the units-of-selection question, and it's surprisingly alive and relevant to medicine, conservation, tech (AI evolution?), and even understanding cancer." (Establishes relevance and unsettled nature).
      *   **Immediately Head Off:** "This isn't about 'survival of the fittest species' – that's mostly wrong. We're drilling down *below* the species, even below the organism, and sometimes looking *above* it."
      *   **Anchor:** Introduce the **Tasmanian Devil Facial Tumor Disease (DFTD)** BRIEFLY: "A real, contagious cancer passed by biting. The cancer cells themselves evolve." *Why real?* Critical for credibility. Avoids "trick" feeling. Its strangeness *is* the hook – frame it as an *extreme lens* on universal principles.

  2.  **Foundations: What Selection *Does* (The Non-Negotiables) (10 mins)**
      *   **Whiteboard:** Draw a simple population. Boxes = Individuals. Dots inside = Variant "Things" (be vague).
      *   **Concept 1: Heritable Variation:** "For evolution by selection, you need differences *and* they must be passed on." In Devils: Tumor lineages differ (growth rate, virulence). Tumor cells clone (heritable). Hosts differ in susceptibility (heritable).
      *   **Concept 2: Fitness Differences:** "Variants must differ in their success at leaving copies." In Devils: Slow-growing tumor? Host lives longer, bites more, spreads tumor more. Fast-growing tumor? Kills host fast, might spread less *overall*. Host resistant? Fewer tumors established.
      *   **Concept 3: The Outcome:** "Over time, the *frequency* of successful variants increases in the population." In Devils: Frequency of slow-growing tumor lineages might increase? Frequency of resistant host genes might increase? (Plant the seed: *Which* population? Tumor cells? Devils?)
      *   ***Crucially Skip:*** Specific units (gene/group/etc.), loaded terms (gene's-eye, group selection). Focus *only* on the *requirements* and the *outcome* (change in frequency). **THIS CANNOT BE SKIPPED.** Without this, "unit" means nothing.

  3.  **The Tumor as Lens: Multiple Levels in Action (15 mins)**
      *   **Deep Dive DFTD (Your Composite Works Perfectly Here):**
          *   Tumor Lineage Level: Variation (fast/slow growth). Heritability (clonal). Fitness (slow = more transmission *if* host survives long enough; fast = wins *within* host but maybe loses overall). Selection *within* the tumor cell population *inside one host*. (Level: *Below* organism).
          *   Host Organism Level: Variation (resistance). Heritability (genes). Fitness (resistant host survives longer, reproduces more). Selection *among* devils. (Level: Organism).
          *   **Introduce Conflict:** Fast tumor "wins" inside host (outcompetes slow) but might cause host death before transmission. Slow tumor "loses" inside but "wins" by spreading. What level matters most? Depends on context (transmission rate, host density).
          *   **The "Group" Question (Plant Seed):** Is the *social biting behavior* crucial? Does a population of devils with less biting (fewer tumors) outcompete a population with more biting (more tumors)? Is *that* a selectable unit? (Level: *Above* organism?).
      *   **Key Framing:** "Notice: We see heritable variation, fitness differences, and changing frequencies *at different levels* in the *same system*. The *outcome* is the result of selection acting *simultaneously* and sometimes *in conflict* at these levels."
      *   **Head Off "Curiosity" Trap:** "This seems bizarre, but think of your *own* body: Your immune cells compete (selection below organism). Cheating cells (cancers) can evolve. Your genes were selected over generations. Social animals cooperate. This devil cancer is just a stark, visible example of universal multi-level evolutionary processes."

  4.  **Unpacking the "Accounting" Dispute (10 mins)**
      *   **The Core Tension:** "We all agree the *frequencies change*. But *how do we describe what caused it?* What's the 'unit' whose success explains the change?"
      *   **Gene's-Eye View (Finally Introduce Term):** "One approach: Trace the change in frequency of *genes* (or replicators). The slow-tumor gene increases because it gets transmitted more. The resistance gene increases. Focuses on what's *copied* long-term." (Relate directly to Devil tumor/heritable host resistance). *Head Off:* "This does NOT mean organisms don't matter! Organisms are the complex 'vehicles' or 'interactors' through which genes often get copied. It's a way of accounting."
      *   **Multi-Level Selection (Finally Introduce Term):** "Another approach: Explicitly model selection acting *at different levels*. Maybe within-host tumor selection (favoring fast) vs. between-host transmission selection (favoring slow). Or even selection *among groups* of devils based on biting behavior." *Head Off:* "This is NOT 'animals sacrificing for species.' It's about structured populations where groups (like dens, troops) vary and differ in survival/reproduction *as groups*, potentially favoring traits costly to the individual *within* the group but beneficial *to the group's* success vs. other groups (e.g., restrained aggression during feeding)."
      *   **Kin Selection / Inclusive Fitness:** "Often presented as an alternative. But frame it: It's a powerful *method* within the gene-centered view OR a way to understand *why* altruism can evolve *without* needing 'group selection' in the classic sense. It shows how helping relatives propagates copies of *your* genes. It's often mathematically equivalent to certain group selection models – *different accounting methods for the same result*." (Emphasize equivalence here to head off rivalry misconception).
      *   **The Genuine Dispute:** "Beyond the accounting, the real debate is empirical: *Are there stable, heritable, variance-generating entities above the organism (like cohesive groups) or below it (like gene networks or even ideas in culture) that act as significant units of selection in nature, beyond just being vehicles for genes?* Does the 'group' in devils have properties making it a true unit, or is it just genes acting in a social context?"

  5.  **Takeaway & Diagnosis (5 mins)**
      *   **Reiterate Core Insight:** "So, when you read a paper arguing about 'levels of selection,' remember: Often, it's not that they disagree on *what happened* (trait frequencies changed), but on the *best way to account for why* (genes, individuals, groups) and whether genuinely new *kinds* of evolutionary units exist."
      *   **Diagnostic Question (Put to Room):** "Imagine a paper finds that in a certain ant species, colonies where workers are *more* sterile (do less personal reproduction) actually *produce more new queens* overall than colonies where workers are less sterile. The paper claims this shows 'selection acting at the colony level'. What's the *first critical question* you should ask about the paper's claim?" (**Confidently Wrong Answer:** "Is it altruism?" or "Does it help the species?". **Correct Diagnostic Question:** "Is there heritable variation *in colony-level traits* (like average worker sterility) *and* does this variation cause differences in the *colony's* fitness (production of new queens/new colonies)?" OR "Could this be explained by kin selection/inclusive fitness acting on individual workers?"). This tests if they grasp the *requirements* (heritable variation, fitness differences) at the claimed level.
      *   **What to Refuse:** "We don't have time for the deep mathematical formalisms (Price Equation, covariance), the full history (Wynne-Edwards vs. Williams vs. Hamilton), or all the philosophical nuances (replicator vs. interactor). We're focusing on the core conceptual framework journalists need to parse new claims."
      *   **What to Cut:** Deep dives into specific historical figures (mentioning Williams/Hamilton briefly is ok, debating them isn't). Detailed comparisons of all mathematical models. Extensive discussion of cultural evolution or major transitions unless directly asked. The ambition to cover *all* possible levels (genomes, species, etc.) – stick to genes, organisms, groups as the core triad.

  **Why the Tumor Case Works (and How to Use It):**

  1.  **Carries the Session:** Yes. It vividly illustrates multi-level selection, conflict, heritability at different levels, and the accounting problem.
  2.  **What it Has:**
      *   Clear, distinct levels (tumor cell, host organism, *potential* group via behavior).
      *   Heritable variation *at each level* (tumor lineage traits, host resistance genes, *potentially* group behavior).
      *   Fitness differences *at each level* (within-host competition, host survival/reproduction, *potential* group persistence).
      *   Conflict between levels (fast vs. slow tumor).
      *   Tangible, real-world hook (DFTD).
  3.  **What it Lacks (and that's good for this purpose):**
      *   **Complex symbiosis/microbiome:** Keeps it cleaner.
      *   **Clear "group" selection:** The "group" aspect is *implied* via social transmission but not definitively proven as a selectable unit *above* the individual. This is perfect! It lets you *pose the question* ("Is *this* group selection?") without getting bogged down in a settled example. It highlights the *empirical* question.
  4.  **Real vs. Invented:** **Anchor to DFTD.** Trust is paramount. Say: "Inspired by DFTD, imagine a similar system where..." to introduce your specific slow/fast tumor and resistance variations. This grounds it in reality while letting you tailor the perfect pedagogical example. Explain you've simplified/compounded for clarity.

  **Misconceptions & When to Head Them Off:**

  1.  **"Group Selection = Species Sacrifice":** Head Off IMMEDIATELY when first *mentioning* group selection (Step 4). Say: "Crucially, this has nothing to do with 'for the good of the species.' It's about local breeding groups competing *with other local groups*. Think troops, dens, colonies, not the whole species."
  2.  **"Kin Selection & Group Selection are Rivals":** Head Off when introducing Kin Selection (Step 4). Explicitly state: "Kin selection is often a powerful *explanation* for altruism *without* needing group selection. Many models show they are mathematically equivalent – different ways to calculate the *same evolutionary outcome* for altruistic traits. The rivalry is often about emphasis and methodology, not fundamental disagreement on the outcome."
  3.  **"Gene's-Eye View Means Organisms Don't Matter":** Head Off when introducing Gene's-Eye View (Step 4). Say: "This perspective focuses on the replicator, but organisms are absolutely crucial as the complex 'vehicles' or 'interactors' in which genes reside and through which they interact with the environment. Ignoring the organism is impossible. It's about the *level of accounting*."
  4.  **"The Unit Must Be The Only Thing That Matters":** Head Off during Tumor Deep Dive (Step 3) and Accounting (Step 4). Emphasize repeatedly: Selection acts *simultaneously* at multiple levels. The dispute is about *relative importance* and *how to best model/explain* the net change. The tumor/host conflict is key here.
  5.  **"It's All Just Semantics":** Preempt during Core Insight framing (Step 1 & Step 4). Acknowledge the semantic element but argue: "While terms matter, the underlying dispute has empirical teeth: *Are there selectable entities beyond genes and organisms?* The accounting differences also lead to different predictions about *when* certain traits (like altruism) can evolve and how strong the selection is."

  **Final Check:** Your target thought ("accounting dispute + genuine empirical question about supra/sub-organismal units") is absolutely the right, achievable target for 45 minutes with this audience. The plan builds systematically to it, using a compelling real-world anchor case to make the abstract concrete. The diagnostic question effectively tests their grasp of the core conceptual filter.
