prompt: |-
  I have just come out of a long and exhausting argument with a close friend over whether Newton's bucket experiment genuinely refutes relationism about space or merely exposes an underdeveloped version of it, and I am now determined to settle the matter by getting the full specification of adequacy first, before I read any more partisan defenses. So: write the complete desiderata that any theory addressing the bucket argument—whether substantivalist, relationist, or hybrid—must satisfy to count as genuinely adequate, not just rhetorically successful. I want the phenomena it must explain (the concave water surface under uniform rotation, the flat surface at rest, and the rotating-disc variant), the conceptual distinctions it must preserve without collapse (absolute rotation versus rotation-relative-to-distant-matter, dynamical explanations versus purely kinematic ones, local versus global determination of inertial structure), the constraints from classical mechanics it cannot violate, and the boundary cases it must survive—including a universe containing only the bucket and water, and the two-globe universe thought experiment where distant matter is present but symmetric. For each desideratum, give the consideration that makes it a genuine requirement rather than a camp-specific preference, and flag which ones are non-negotiable (for instance, empirical equivalence with standard Newtonian dynamics) versus which are negotiable ontological commitments (such as parsimony about unobservable absolute space). Crucially, tell me whether any subset of these requirements is jointly unsatisfiable—particularly whether a Machian relationalist strategy that explains inertia via distant matter necessarily fails in the empty-bucket scenario or violates local dynamics, and if so, whether that failure is fatal or can be absorbed by relaxing a negotiable desideratum. Lead with your bottom line in the first sentence and then give the reasoning, with no preamble and no restating of the question.
reasoning: |-
  Okay, the user has just had a heated debate about Newton's bucket experiment and wants a definitive list of criteria that any adequate theory must meet. They're clearly frustrated and want to cut through partisan arguments. Let me unpack their request.

  First, they want a comprehensive set of desiderata covering phenomena to explain, conceptual distinctions to maintain, classical mechanics constraints, and boundary cases. The emphasis is on objectivity - distinguishing genuine requirements from camp-specific preferences. 

  Hmm, the key challenge seems to be balancing empirical adequacy with ontological parsimony. The user specifically worries whether Machian relationism can satisfy all criteria, especially in edge cases like the empty bucket scenario. They also hint at deeper concerns about whether certain requirements might be fundamentally incompatible.

  I should start by identifying non-negotiable demands: empirical equivalence with Newtonian predictions is absolutely essential since classical mechanics works. The bucket's concave surface formation must be explained under rotation but flat at rest - including when distant matter is symmetric or absent. 

  Conceptually, any theory must preserve absolute rotation as physically real (distinct from relative rotation) because inertial effects are measurable. But it must also maintain the distinction between kinematics (describing motion) and dynamics (explaining forces) - otherwise physics becomes descriptive rather than explanatory.

  For boundary cases: the two-globe universe (where distant matter exists but can't define rotation direction) and solitary bucket (no distant matter at all) are critical tests. If a theory fails here while maintaining empirical adequacy, that exposes fundamental issues.

  Now the tough part: analyzing tensions. Machian relationism using distant matter to define inertia seems elegant but stumbles on the solitary bucket case where no distant matter exists yet inertia persists. The user wonders if relaxing "negotiable" requirements like ontological parsimony could save it - but sacrificing empirical adequacy (e.g., by claiming water wouldn't curve in an empty universe) would be fatal since it contradicts Newtonian predictions.

  A hybrid approach might be necessary - perhaps accepting some primitive inertial structure while minimizing absolute space commitments. The key is whether such a theory can maintain all non-negotiables without becoming substantivalist in all but name. The user needs to see clearly where compromises must be made.
answer: |-
  **Bottom line: An adequate theory must empirically replicate Newtonian dynamics in all scenarios (non-negotiable), preserve the physical reality of absolute rotation and distinguish it from relative motion (non-negotiable), maintain kinematics/dynamics and local/global distinctions (negotiable only if preserved functionally), and survive boundary cases like the solitary bucket and symmetric globes without *ad hoc* exemptions (non-negotiable); Machian relationism fails the solitary bucket test fatally unless it violates empirical adequacy, while hybrid theories sacrificing strict relationism can satisfy all.**

  ### Non-Negotiable Desiderata (Failure is Fatal)
  1.  **Empirical Equivalence w/ Newtonian Mechanics:** *Must predict:*  
      *   Flat water surface when bucket/water are at rest *or* co-rotating uniformly relative to the lab.  
      *   Concave water surface when water rotates relative to the bucket *and* the bucket rotates inertially (uniformly relative to absolute space/fixed stars).  
      *   Same concavity effect for a rotating disc.  
      *   *Requirement Reason:* Newtonian mechanics accurately describes these observable phenomena. Any viable theory must replicate this empirical success under all conditions, including boundary cases. Failure means the theory is empirically false.

  2.  **Physical Reality of Absolute Rotation:** *Must distinguish* absolute rotation (causing real inertial forces) from mere rotation relative to arbitrary bodies (which does not).  
      *   *Requirement Reason:* The concave surface is a measurable dynamical effect (centrifugal/Coriolis forces) caused *only* by true acceleration (change in absolute velocity/rotation). Kinematic rotation relative to nearby bodies (like the bucket walls) is insufficient, as shown when water and bucket co-rotate (flat surface). Confusing the two collapses real dynamics into mere description.

  3.  **Survival of Boundary Cases without *Ad Hoc* Exemption:**  
      *   *Solitary Bucket Universe:* Must explain concave water surface under rotation even if the universe contains *only* the bucket and water (no distant matter).  
      *   *Two-Globe Universe:* Must explain tension in the connecting rod when the globes rotate around their center of mass, even if the universe is otherwise empty *or* contains only symmetric, non-rotating distant matter.  
      *   *Requirement Reason:* These are valid thought experiments probing the *source* of inertial structure. A theory claiming universality must work here. Exempting them is *ad hoc* and reveals the theory's incompleteness or falsehood. Failure implies the theory cannot account for inertia without contingent matter.

  ### Negotiable Desiderata (Can be Relaxed, but Loss is a Cost)
  4.  **Parsimony / Ontological Commitment (e.g., Absolute Space):** *Should* avoid postulating unobservable entities (like substantival space points) unless strictly necessary.  
      *   *Requirement Reason:* Methodological virtue (Occam's Razor). However, if empirical adequacy *requires* such an entity (as Newton argued), parsimony must yield. Relaxing this allows substantivalism/hybrids.

  5.  **Local Determination of Inertial Structure:** *Ideally* inertial properties (what counts as unaccelerated motion) should be determined by local dynamical laws or relations, not by global boundary conditions.  
      *   *Requirement Reason:* Aligns with the locality principle dominant in modern physics (GR, QFT). However, Newtonian mechanics *is* globally determined by absolute space. Relaxing this allows substantivalism and some Machian global-dependence.

  6.  **Distinction Between Kinematics & Dynamics:** *Ideally* maintain a clear separation between describing motion (kinematics) and explaining forces causing changes in motion (dynamics).  
      *   *Requirement Reason:* Foundational clarity in classical physics. However, Machian strategies often blur this by making inertia relational/kinematic. If functional equivalence is maintained, this can be relaxed.

  ### Analysis of Joint Satisfiability & Machian Failure
  *   **The Core Tension:** Satisfying (1) Empirical Equivalence *and* (2) Physical Reality of Rotation *and* (3) Solitary Bucket Survival *simultaneously* is the primary challenge for relationism.
  *   **Machian Relationism's Fatal Flaw:**  
      *   It attempts to ground inertia in relation to distant matter (violating Local Determination (5), which is negotiable).  
      *   **However, it catastrophically fails the *Solitary Bucket* (3):** If no distant matter exists, Machian relationism lacks any reference to define "true rotation." It cannot explain why rotating the water causes concavity or why co-rotation doesn't. Claiming inertia simply wouldn't exist in this case **violates Empirical Equivalence (1)**, as Newtonian mechanics predicts concavity *does* occur. Relaxing parsimony (4) or locality (5) doesn't help; the empirical failure (1) remains fatal.  
      *   It *also* struggles with the *Two-Globe Universe* (3): Symmetric distant matter provides no preferred direction of rotation to explain rod tension. Machians often resort to complex "swirling" of the entire cosmos or *ad hoc* exemptions.
  *   **Viable Paths:**  
      *   **Substantivalism:** Satisfies (1), (2), (3), (6) easily. Fails parsimony (4) and locality (5) - the price paid.  
      *   **Sophisticated Hybrids (e.g., "Geometric Relationism"):** Accept a primitive, non-material *inertial structure* (affine connection, equivalence classes of inertial frames) as part of the spacetime geometry, ontologically prior to matter but not a "container" space. This structure is fixed by the laws of motion (not distant matter). Satisfies (1), (2), (3), (6). Sacrifices strict relationism (violates parsimony (4) compared to pure relationism, but perhaps less than substantivalism) and strong locality (5). This is the modern consensus view (Neo-Newtonian/Galilean spacetime).  
      *   **Radical Revisionism:** Abandon classical mechanics entirely (e.g., GR - frame-dragging *partially* addresses Mach, but inertia isn't purely relational). Fails (1).

  **Conclusion:** No purely relational theory of motion satisfying only relations between material bodies can meet *all* non-negotiable desiderata. The solitary bucket scenario necessitates *something* beyond contingent matter to define inertia – either substantival space or a primitive inertial structure inherent to spacetime. Sacrificing empirical adequacy (1) or the reality of rotation (2) is not an option for an adequate classical theory; relaxing strict relationism/parsimony (4, 5) is necessary. Hybrid theories incorporating primitive inertial structure provide the most adequate framework.
