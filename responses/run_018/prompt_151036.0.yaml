answer: |-
  Okay, picture this: You stumble into the kitchen, desperate for tea. You fill the kettle, jam it on the base, hit the switch... and this smug little tortoise in a tiny waistcoat appears on the counter.

  "Hold on," it says, shell gleaming. "You pressed the switch. Why does that *mean* the kettle boils?"

  "Huh? Because... electricity flows?" you mumble, still half-asleep.

  "Ah!" says the Tortoise, whipping out a tiny notepad. "Premise One: Pressing the switch causes electricity to flow. Premise Two: Electricity flowing causes the kettle to heat. *Therefore*, the kettle boils! Excellent! Now... *why* does Premise One and Premise Two *together* lead to the kettle boiling?"

  You sigh. "Because... if A causes B, and B causes C, then A causes C? Transitivity?"

  "Premise Three!" the Tortoise beams, writing furiously. "So now we have: P1, P2, P3. *Therefore*, the kettle boils! Splendid! But... *why* does having Premise One, Premise Two, *and* Premise Three *entitle* you to conclude the kettle boils?"

  This goes on. You're scribbling premises about metal conductivity, water molecules, the definition of "boil," the reliability of the power grid... Your hand cramps. The kettle sits there, cold, taunting you. The Tortoise is vibrating with logical glee.

  Finally, you snap. "FINE!" You grab the notepad and scrawl: **Premise Omega: IF you have 'If A then B' AND you have 'A', THEN you can conclude 'B'!** (Modus Freaking Ponens, written out).

  You slam the pad down. "SEE? Now we apply Premise Omega to all the other junk! Therefore: KETTLE BOILS. GIVE ME MY TEA."

  The Tortoise peers at Premise Omega. It taps its shell thoughtfully. A slow, infuriating smile spreads across its face.

  "Ah... Premise Omega. Very good. Very thorough. Premise One: Pressing switch causes electricity. Premise Two: Electricity causes heat... Premise Seventeen: Water molecules gain energy... Premise Omega: If P1-P17 are true, then kettle boils. *Therefore*..."

  It pauses, looks you dead in the eye.

  "...*why* does writing down Premise Omega *entitle* you to actually *use* it to connect all those other premises to the conclusion about the kettle boiling?"

  You stare at the cold, silent kettle. You stare at your trembling, tea-less hand. You stare at Premise Omega, suddenly looking useless on the page.

  "...oh, you have *got* to be kidding me."

  The Tortoise just nods happily, already reaching for its pen. "Premise Omega-Prime, perhaps? 'If you write down a rule *and* have the premises it applies to, *then* you may apply the rule'...?"
