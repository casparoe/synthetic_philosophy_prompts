  2.  **Searlean Philosopher's Objection**: "Syntax manipulation within a predictive hierarchy, no matter how recursive, remains syntax; only specific biological causal powers can instantiate intrinsic semantics, making 'recursive derived-originality' incoherent by conflating derived utility with original content."  
