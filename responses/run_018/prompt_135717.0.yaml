  ### Workshop Design: Aunt Hillary and the Ant Fugue  
  *Duration: 90 minutes*  
  *Participants: 14 upper-level students*  

  #### **Conceptual Overview**  
  This simulation immerses students in a distributed cognitive system mirroring an ant colony’s emergent "mind." Participants adopt roles (foragers, nurses, soldiers, scouts), each following local rules to transform simple thematic cards (colour-pattern sequences) in response to disruptions. Communication is restricted to card placement/movement—no speech, gestures, or leadership. The goal is to generate a collective "fugue" (a spatial score on a shared table) that *feels* intentionally coherent, despite no individual directing or understanding the whole. The payoff: post-activity, students vote on whether the colony exhibited "one mind" or "distributed interaction," determining final music or treat distribution.  

  ---

  ### **Setup (15 mins)**  
  **Materials:**  
  - A large table divided into **four quadrants** (use coloured tape).  
  - **Role cards** (laminated, one per student):  
    - *Foragers (4 students):* Pattern: ●●● (three blue circles).  
    - *Nurses (4 students):* Pattern: ▲▲▲ (three yellow triangles).  
    - *Soldiers (4 students):* Pattern: ■■ (two red squares).  
    - *Scouts (2 students):* Pattern: ✖✖ (two green crosses).  
  - **Thematic transformation cards** (placed in centre for access):  
    - *Nurse cards:* ◑●▲ (blue circle, yellow triangle, blue circle—represents "transformed" forager theme).  
    - *Soldier cards:* ★ (star—represents "resolution").  
    - *Scout cards:* "Rain" ☔, "Food" 🍎, "Threat" 🦅 (for disruptions).  
  - Timer, rule posters, and sticky notes for debrief.  

  **Rules Briefing:**  
  1. **No central control:** No speaking, pointing, or appointing leaders. All actions through cards.  
  2. **Role-specific rules:**  
     - *Foragers:* Place your ●●● card when entering a quadrant.  
     - *Nurses:* Place a ◑●▲ card **only** if adjacent (same quadrant) to a forager’s ●●● card.  
     - *Soldiers:* Place a ★ card **only** if both ●●● and ◑●▲ cards are visible in the same quadrant.  
     - *Scouts:* Place disruption cards (☔/🍎/🦅) when prompted; otherwise, place ✖✖ cards freely.  
  3. **Movement:** Students may move around the table to place/respond to cards, but no removing existing cards.  
  4. **Win condition:** Create a "coherent score"—patterns should visually align (e.g., ◑●▲ near ●●●, ★ near both).  

  **Starting Positions:**  
  - Foragers begin in Quadrant 1 (food source).  
  - Nurses in Quadrant 2 (nest).  
  - Soldiers in Quadrant 3.  
  - Scouts in Quadrant 4.  

  ---

  ### **Simulation Rounds (45 mins total)**  
  **Round 1: Rainstorm (15 mins)**  
  - *Disruption:* Facilitator announces, "Rainstorm in Quadrants 1 and 2! All ants must relocate to Quadrant 4." Scouts place ☔ cards in Q1/Q2.  
  - *Goal:* Foragers/nurses move to Q4, transforming themes (e.g., nurses place ◑●▲ near foragers’ ●●●; soldiers resolve with ★ if patterns align).  
  - *Timer:* 5 mins to relocate, 10 mins for card interactions.  

  **Round 2: Depleted Food Source (15 mins)**  
  - *Disruption:* "Food in Quadrant 1 depleted! New source in Quadrant 3." Scouts place 🍎 in Q3.  
  - *Goal:* Foragers move to Q3; nurses/soldiers follow. Scouts may "bridge" quadrants by placing ✖✖ to connect patterns.  

  **Round 3: Intruding Threat (15 mins)**  
  - *Disruption:* "Bird attack in Quadrant 4!" Scouts place 🦅 in Q4.  
  - *Goal:* Soldiers rush to Q4 to "resolve" threats (★ cards near ◑●▲/●●●); others support pattern stability.  

  ---

  ### **Payoff & Writing (10 mins)**  
  - Students individually write a paragraph arguing:  
    - *One mind:* "The colony intended the outcome."  
    - *Distributed interaction:* "Coherence emerged from local rules."  
  - **Vote determines:**  
    - *One mind majority:* Bach’s *Contrapunctus I* (fugue) plays during debrief.  
    - *Distributed majority:* Steve Reich’s *Electric Counterpoint* (emergent patterns) plays. Treats divided equally.  

  ---

  ### **Debrief (20 mins)**  
  **Guided Discussion:**  
  - **Link moments to concepts:**  
    - *Soldier’s timely ★ placement:* "When James resolved the Q4 threat as Maria’s transformed card appeared, did it *feel* intentional? That’s the ‘pull’ of attributing a unified mind to distributed actions."  
    - *Nurse’s mis-transformation (e.g., ◑●▲ placed alone):* "When the pattern collapsed in Q2, it shows fragility without central error-correction—like ant colonies failing if local cues misfire."  
  - **Pressure points:**  
    - *Scouts as "information flow":* "Did scout cards (e.g., 🍎) act like pheromone trails? Note how their placement triggered chain reactions."  
    - *Silence as constraint:* "How did no speaking alter your sense of control? Compare to ants’ lack of deliberation."  

  **Limitations (be frank):**  
  - "This shows *structural coherence* from local rules, but **not** the colony’s subjective experience (‘what is it like?’). Ants don’t ‘feel’ the fugue—they react to evolved instincts."  
  - "We compressed time: real colonies develop these rules over generations, not 45 minutes."  

  **Predictable Failures & Solutions:**  
  - *Failure:* Foragers appoint a "spokesperson."  
    - *Solution:* Intervene quietly: "Remember, ants have no conductor. Let the cards guide you."  
  - *Failure:* Students conflate "no leader" with randomness.  
    - *Solution:* Post-activity, highlight emergent patterns: "Look at Q3—these ★ clusters arose from rules, not chance. Random systems don’t self-correct."  
  - *Failure:* Nurses ignore arm’s-reach rule.  
    - *Solution:* Gently remove misplayed cards: "Local rules bind ants. A nurse can’t transform distant foragers."  

  ---

  ### **Practical Notes**  
  - **Why it works:** Tight rules + sensory constraints (silence, movement) force emergence. The "score" (card arrangement) visualises the fugue.  
  - **Key insight:** Students *feel* the "mind" illusion when patterns click—without you lecturing on extended cognition.  
  - **Adjustments:** If rounds stall, add urgency ("5 mins left!"). If coherence fails, debrief it as a "colony collapse" case study.  

  **Outcome:** A visceral grasp of distributed cognition—where the music choice becomes a shared metaphor for the debate.
