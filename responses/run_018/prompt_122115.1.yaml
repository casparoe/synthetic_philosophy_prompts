  ### Introduction  
  This document arises from an adversarial collaboration between the Architecturalist and Ecologist positions regarding sphexishness, using the digger-wasp thought experiment as a reference point. The goal is to reconcile disagreements, isolate genuine differences, and identify empirical cruxes for future resolution. Both parties accept the following definitions for their positions:  

  - **The Architecturalist**: Rigidity is a property of the control architecture—specifically, whether the agent re-reads the world at points where re-reading would prevent suboptimal behavior. This is a real, largely binary, mechanism-level property that can persist even when behavior appears flexible.  
  - **The Ecologist**: Rigidity is a property of a behavior-in-an-environment; every mechanism is rigid under some perturbations and flexible under others. The interesting questions are quantitative—how much, how fast, at what cost, in which environment—and the binary notion does no work.  

  We adhere to the stipulated materials throughout:  
  1. **Re-entrancy test**: A method to score responses to perturbations during a routine as (a) restart routine, (b) complete step then stop, (c) abort immediately, or (d) substitute goal-achieving action. Sphexishness is (a) when a re-entrant architecture would yield (b), (c), or (d).  
  2. **First vs. second-order re-entrancy**: First-order re-reads world state (e.g., "Is prey still here?"); second-order re-reads goals/policies (e.g., "Should I be doing this?").  
  3. **Gradience knobs**: Response to perturbations varied by amount (x), duration (d), or cost of ignoring.  
