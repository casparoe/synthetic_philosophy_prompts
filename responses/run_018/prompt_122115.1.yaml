  6. **Language-model agent case**: Non-sphexish by test criterion 1 but lacking second-order re-entrancy.  

  No empirical facts about real wasps are asserted; all such questions are flagged as open. The document is self-contained, relying solely on arguments developed herein.  

  ---

  ### 1. Agreed Claims  
  Both parties endorse the following claims. Each is load-bearing, as at least one party would have denied it initially.  

  1.1. **Re-entrancy Test as a Diagnostic Tool**: The re-entrancy test is a valid operationalization for detecting sphexish behavior (response (a)) under specific perturbations. However, it does not, by itself, distinguish whether the cause is architectural or environmental. (The Architecturalist initially denied that environmental factors could fully explain the behavior; the Ecologist denied that the test isolates a binary architectural property.)  

  1.2. **TOCTTOU as a Universal Vulnerability**: Sphexish behavior in the wasp thought experiment is a consequence of a time-of-check-to-time-of-use (TOCTTOU) race condition. This vulnerability arises in any system where a state check is temporally separated from action, and it is not unique to biological agents. (The Architecturalist initially denied that this framing reduces sphexishness to an environmental trick; the Ecologist denied that TOCTTOU implies a fixed architectural flaw.)  

  1.3. **Second-Order Re-entrancy as Architecturally Distinct**: First-order re-entrancy (e.g., re-reading prey location) is separable from second-order re-entrancy (e.g., re-reading goals). An agent can exhibit the former without the latter, as demonstrated by the language-model agents. (The Architecturalist initially denied that second-order re-entrancy is irrelevant to first-order rigidity; the Ecologist denied that the distinction is architecturally significant.)  

  1.4. **Gradience as an Empirical Reality**: Responses to perturbations (via gradience knobs x, d, or cost) may exhibit continuous or discontinuous ("cliff") patterns. Neither pattern is inherently indicative of architectural rigidity or environmental flexibility; either can emerge from continuous or discrete mechanisms. (The Architecturalist initially denied that cliffs could arise from non-binary architectures; the Ecologist denied that cliffs necessitate a binary explanation.)  

  1.5. **Underdetermination and Implementation Necessity**: Finite behavioral data (including re-entrancy tests) underdetermine the underlying architecture. To resolve whether an agent re-reads the world or weights inputs near zero, implementation-level inspection is required. (The Architecturalist initially denied that behavior alone is insufficient to infer architecture; the Ecologist denied that implementation is always necessary for useful explanation.)  

