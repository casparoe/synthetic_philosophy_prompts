  ### 3. Cruxes Section  
  Cruxes are empirical questions that could resolve disagreements. For each, we state the test, predictions, and what would falsify each position. Both parties agree these tests bear on the disputes.  

  #### Crux 1: The Perturbation Cliff Test  
  - **Test**: For a given agent and routine, vary perturbation amount (x) incrementally (e.g., prey moved 1mm to 1m). Measure if the response shifts discontinuously (e.g., abrupt switch from (a) to (d)) at a threshold.  
  - **Architecturalist Prediction**: A sharp cliff will occur, indicating a binary architectural threshold (e.g., a fixed displacement limit triggers re-reading).  
  - **Ecologist Prediction**: No cliff will appear; responses will shift gradually (e.g., increasing probability of (d) as x grows) or cliffs will vary with environmental context.  
  - **Counts Against Architecturalist**: Continuous shifts or context-dependent cliffs.  
  - **Counts Against Ecologist**: A persistent, context-independent cliff.  

  #### Crux 2: The Cost-Benefit Inversion Test  
  - **Test**: Increase the cost of ignoring perturbations (e.g., energy drain for restarts) while holding x and d constant. Observe if the agent switches from sphexish (a) to non-sphexish (b-d) responses.  
  - **Architecturalist Prediction**: Agents without re-reading mechanisms will not switch, regardless of cost. Agents with costly-but-present mechanisms may switch, but the architecture (re-read capability) is unchanged.  
  - **Ecologist Prediction**: All agents will eventually switch responses as cost rises, reflecting quantitative optimization, not architectural change.  
  - **Counts Against Architecturalist**: Switching in agents confirmed (via implementation) to lack re-reading.  
  - **Counts Against Ecologist**: No switching despite extreme costs in agents with confirmed re-reading capacity.  

  #### Crux 3: The Novel Perturbation Test (Unsettleable)  
  - **Test**: Train two agents in identical environments: one with a non-re-entrant architecture (no re-reading), and one with re-entrant architecture but near-zero input weighting. Verify behavioral indistinguishability. Then introduce a novel perturbation (e.g., prey teleports after inspection).  
  - **Predictions**:  
    - Architecturalist: Agents will diverge; the weighted-re-read agent may handle the perturbation if it exceeds its weighting threshold.  
    - Ecologist: Agents will not diverge; if behaviorally matched in training, they are functionally identical.  
  - **Counts Against Architecturalist**: No divergence in the novel perturbation.  
  - **Counts Against Ecologist**: Divergence occurs.  
  - **Why Unsettleable?** Behavioral indistinguishability in training cannot prove equivalence for all future perturbations. A divergence supports the Architecturalist, but proving non-divergence requires exhaustive testing, which is impossible.  

