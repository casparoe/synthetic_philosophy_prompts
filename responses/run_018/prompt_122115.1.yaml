  **Joint Statement of Adversarial Collaboration on Sphexishness**

  **Signed by:**
  [Architecturalist Name], for the Architecturalist Position
  [Ecologist Name], for the Ecologist Position

  **Date:** [Date]

  **Introduction**

  This document represents the outcome of an adversarial collaboration between two positions on the nature of sphexishness, as exemplified by the digger-wasp thought experiment. The collaboration aims to clarify points of agreement, pinpoint and characterize disagreements, identify empirical cruxes, and draw implications for broader questions such as free will. The two positions are:

  - The **Architecturalist**: Rigidity is a property of the control architecture — specifically of whether the agent re-reads the world at the points where re-reading would make a difference — and is therefore a real, largely binary, mechanism-level property that can be present even when observed behaviour looks flexible.

  - The **Ecologist**: Rigidity is a property of a behaviour-in-an-environment; every mechanism is rigid under some perturbation and flexible under others; the interesting questions are quantitative — how much, how fast, at what cost, in which environment — and the binary notion does no work.

  We have used the following stipulated materials and framings throughout:

  1. **The re-entrancy test**: A method to score an agent's response to a perturbation during a routine as (a) restart the whole routine, (b) complete the current step and then stop, (c) abort immediately, (d) substitute a different action that still reaches the goal. Sphexish behaviour is (a) under perturbations that a fully re-entrant architecture would have handled by (b), (c), or (d).

  2. **First-order versus second-order re-entrancy**: First-order re-entrancy: the agent re-reads the state of the world (e.g., "is the prey still there?"). Second-order re-entrancy: the agent re-reads its own policy or goal (e.g., "should I be doing this at all?").

  3. **The gradience knobs**: Perturbation amount (x), duration (d), or cost of ignoring. We ask whether the agent's response varies continuously or discontinuously with these parameters.

  4. **Time-of-check-to-time-of-use (TOCTTOU) framing**: The wasp's failure is seen as a race condition between checking and acting. The standard fixes are re-checking immediately before use or holding a lock. We consider whether sphexishness is a bug, resource limit, or architectural choice.

  5. **The underdetermination worry**: Any finite behavioural record is consistent with multiple internal architectures (e.g., one that re-reads but weights the input near zero, and one that never re-reads). We ask what distinguishes them and whether the distinction must be drawn at the implementation level.

  6. **The language-model agent case**: Agents that are non-sphexish by the re-entrancy test (they typically handle perturbations without restarting) but lack second-order re-entrancy (they do not question their goals).

  We proceed with our agreed claims.

  **1. Agreed Claims**

  Both parties agree to the following claims, each of which is load-bearing in the sense that at least one party would have denied it at the outset of the collaboration.

  1.1. **Operationalization of Sphexishness**: The re-entrancy test, as defined, provides a clear operational criterion for identifying sphexish behaviour (response type (a)) in an agent under a specific perturbation. However, the test alone does not fully determine the underlying cause of the behaviour (e.g., whether it is due to a fixed architectural feature or an environmental mismatch).

  1.2. **Re-entrancy Levels**: First-order re-entrancy (re-reading the world state) is distinct from and does not entail second-order re-entrancy (re-reading goals or policies). An agent can exhibit first-order re-entrancy without second-order re-entrancy (e.g., a thermostat or the language-model agents described in the case), and second-order re-entrancy, if it exists, would require a different kind of test.

  1.3. **Cost-Benefit Trade-offs**: In any real-world agent, the decision to re-read or lock (to avoid TOCTTOU failures) involves a trade-off between the cost of these operations and the expected cost of failure. Sphexish behaviour can arise as a result of an optimal trade-off in environments where perturbations are rare or cheap to recover from. (The Architecturalist concedes that environmental factors can make sphexishness adaptive; the Ecologist concedes that the trade-off is implemented in the architecture.)

  1.4. **Underdetermination of Architecture by Behaviour**: For any finite set of behavioural observations (including under the re-entrancy test), there exist multiple possible internal architectures that could produce the same behaviour. Therefore, behavioural tests alone cannot uniquely determine the underlying mechanism. (The Ecologist would have initially emphasized this, but the Architecturalist now agrees that behaviour alone is insufficient and that implementation-level details may be necessary to resolve ambiguities.)

  1.5. **Gradience in Response**: The response of an agent to perturbations (as measured by the re-entrancy test) may show continuous or discontinuous (cliff) changes as we vary the perturbation parameters (x, d, cost). The presence or absence of a cliff effect is an empirical question about the agent and does not, by itself, settle the debate between architectural and ecological rigidity. (The Architecturalist would have initially denied that gradience is the rule; the Ecologist would have denied that a cliff effect is evidence for a binary architectural property.)

  **2. Disagreements Table**

  The following table records the principal residual disagreements. Each position is stated in the proponent's own words. We classify each disagreement as genuine or verbal and provide clarification.

  | Disagreement Topic | Architecturalist Position | Ecologist Position | Classification and Clarification |
  |--------------------|---------------------------|-------------------|----------------------------------|
  | The nature of rigidity | "Rigidity is a property of the control architecture. Specifically, it is the absence of a re-read mechanism at critical decision points. This property is binary: either the mechanism is present or it is not. It can persist even when the agent behaves flexibly in its typical environment." | "Rigidity is not a property of the mechanism alone; it is a property of the agent-environment system. Every mechanism will fail under some perturbations, so rigidity is always relative and quantitative. The binary notion obscures the real questions of how robust the agent is to which perturbations and at what cost." | Genuine. The disagreement centers on whether rigidity is an intrinsic architectural property (Architecturalist) or an extrinsic relational property (Ecologist). The term 'rigidity' itself is used differently: the Architecturalist uses it for a specific mechanism feature, while the Ecologist denies that such a feature can be isolated from environmental context. |
  | The utility of the binary notion | "The binary distinction (re-entrant vs. non-re-entrant at a given point) is essential because it identifies a specific architectural feature that can be designed, tested, and debugged. It explains why the agent fails under a perturbation that a re-entrant agent would handle, even if that perturbation is rare." | "The binary notion does no useful work. It is an artifact of the test perturbation. In reality, agents vary continuously in their robustness. Focusing on a binary property distracts from the quantitative questions of how much perturbation the agent can handle and how it adapts to new environments." | Genuine. The Architecturalist sees explanatory value in isolating a mechanism-level property; the Ecologist sees it as a misleading oversimplification. |
  | The locus of explanation for cliffs | "If a cliff effect is observed (e.g., the agent switches abruptly from response (a) to (d) at a specific perturbation threshold), it is strong evidence for a binary architectural feature (e.g., a hard-coded threshold)." | "A cliff effect can arise from continuous mechanisms (e.g., a sigmoid function) and does not require a discrete architectural switch. Moreover, the same cliff might be present in one environment and absent in another, showing that it is not intrinsic to the architecture." | Genuine. The Architecturalist takes cliffs as evidence for discrete mechanisms; the Ecologist argues they can be produced by continuous processes and are environment-dependent. |
  | The status of the language-model agents | "These agents demonstrate that first-order re-entrancy (non-sphexishness) can be implemented without second-order re-entrancy. This shows that the two are architecturally separable." | "The non-sphexish behaviour of these agents is a result of their training environment (which included diverse perturbations) and their high capacity for re-reading. But this does not make them 'architecturally re-entrant' in a binary sense; they are simply robust to a wide range of perturbations due to their design and training." | Partly verbal. Both agree on the behavioural facts. The disagreement is over the description: the Architecturalist emphasizes the architectural implementation of re-reading, while the Ecologist emphasizes the environmental and training factors that led to that architecture. The substantive question is whether the architecture is the primary explanation or a proxy for environmental adaptation. |

  **3. Cruxes Section**

  We identify key empirical questions (cruxes) that bear on the disagreements. For each crux, we state the test, the prediction of each side, and what result would count against each view. Both sides agree on the bearing of these tests.

  3.1. **The Gradience Knob Test**

  - **Test**: Take a fixed agent and a fixed routine. Apply the re-entrancy test while varying the perturbation amount (x) continuously (e.g., moving the prey by 1mm, 1cm, 10cm, etc.). Observe the response type (a-d) and the point at which it changes.
  - **Architecturalist Prediction**: There will be a sharp threshold (cliff) at some value of x, indicating a discrete architectural decision point (e.g., a fixed threshold for detecting displacement). The agent will abruptly switch from (a) to (d) or another response.
  - **Ecologist Prediction**: The response may change gradually (e.g., the probability of (a) decreases as x increases) or show a cliff only if the environment has shaped a threshold, but the cliff is not evidence of a fixed architectural feature. The same agent may show no cliff in a different environment or after learning.
  - **What would count against Architecturalist?** If the response changes gradually without a cliff, or if the cliff shifts with environmental context without architectural change.
  - **What would count against Ecologist?** If a cliff is observed and persists across all environmental variations and learning phases, suggesting an immutable architectural feature.

  3.2. **The Cost-Benefit Test**

  - **Test**: Make the cost of ignoring a perturbation (e.g., restarting the routine) progressively higher (e.g., by adding an energy cost or time penalty). Observe whether the agent switches from sphexish (a) to non-sphexish (b-d) responses as the cost increases.
  - **Architecturalist Prediction**: If the architecture lacks a re-read mechanism, the agent will not switch responses regardless of cost. If it has one but it was initially suppressed (e.g., due to low expected cost of failure), it may switch, but the switch is due to an existing architectural capability, not a change in rigidity.
  - **Ecologist Prediction**: The agent will switch responses as the cost increases because the behaviour is optimized for the environment. The change may be continuous or abrupt, but it reflects a quantitative adjustment, not a binary architectural property.
  - **What would count against Architecturalist?** If an agent without an explicit re-read mechanism (as per design) switches responses under high cost, showing that the architecture can produce non-sphexish behaviour without a dedicated re-read mechanism.
  - **What would count against Ecologist?** If an agent with a confirmed non-re-entrant architecture (e.g., hard-coded without re-reads) never switches responses, even at extreme costs.

  3.3. **The Underdetermination Crux (Unsettleable)**

  - **Test**: Can we construct two agents: one with a non-re-entrant architecture (no re-read) and one with a re-entrant architecture that weights the re-read input very low (so it usually ignores small perturbations), such that they are behaviourally indistinguishable in all possible re-entrancy tests?
  - **Obstacle**: By the underdetermination worry, if the agents are behaviourally identical, no test can distinguish them. The Architecturalist holds that the implementation difference is real and matters for explaining failures in new environments. The Ecologist holds that without a behavioural difference, the distinction is irrelevant.
  - **Predictions**: Both agree that such agents can be constructed. The Architecturalist predicts that in a novel perturbation (outside the test set), the agents may differ: the low-weight agent might handle it if the perturbation is large enough to exceed its threshold, while the non-re-entrant agent will always fail. The Ecologist predicts that if the agents are behaviourally matched in all tested environments, they are functionally identical, and any novel perturbation would be handled similarly if the matching was comprehensive.
  - **What would count against Architecturalist?** If the two agents behave identically in all novel perturbations, showing that the architectural difference has no functional consequence.
  - **What would count against Ecologist?** If the two agents diverge in a novel perturbation, showing that the architectural difference has functional consequences not captured by behavioural tests in the original environment.
  - **Why unsettleable?** We cannot test "all possible" perturbations. A single divergence would support the Architecturalist, but proving that no divergence exists is impossible.

  **4. Implications for Free Will and Moral Excuse**

  Both parties agree that sphexishness, as discussed, does not directly bear on the traditional problem of free will, which concerns second-order re-entrancy (the ability to question one's goals) and moral responsibility. However, we draw the following conclusions from our collaboration:

  - Sphexishness in the first-order sense (failure to re-read the world) is clearly a mechanism-level limitation that can lead to suboptimal behaviour under perturbation. In artificial systems, it is often treated as a bug or a resource limitation. In biological systems, it may be an adaptive trade-off.

  - The human cases that resemble the wasp (e.g., habitual commuter driving to the old office) are **not identical** to the wasp case. Humans possess second-order re-entrancy: they can, in principle, interrupt their habits by reflecting on their goals. However, in practice, they may fail to do so due to distraction, stress, or resource constraints. This failure is more akin to a second-order TOCTTOU problem (failing to re-read one's goals at the right moment) than to the first-order failure in the wasp.

  - The language-model agents demonstrate that first-order re-entrancy can be achieved without second-order re-entrancy. Thus, non-sphexishness in behaviour does not imply free will or moral agency.

  - **Moral excuse**: The claim "I did not re-read" is not, in itself, a valid moral excuse for humans because they are presumed capable of second-order re-entrancy. However, under conditions of extreme stress or cognitive load, the failure to re-read (either first or second-order) might mitigate responsibility. The wasp, lacking second-order re-entrancy, has no moral responsibility at all.

  - **Free will**: The wasp's behaviour, being purely first-order, does not inform the debate on free will. The human case highlights that free will requires not just the capacity for second-order re-entrancy but also the opportunity to exercise it. The habitual commuter who drives to the old office may have the capacity but failed to exercise it at that moment.

  In summary, sphexishness isolates a first-order rigidity that may be architectural or ecological, but it does not directly address the higher-order capacities associated with free will. The joint project has clarified that while the Architecturalist and Ecologist disagree on the nature of rigidity, they agree that second-order re-entrancy is a distinct and more complex phenomenon.
