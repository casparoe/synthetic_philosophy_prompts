  ### 2. Disagreements Table  
  Residual disagreements are cataloged below. Each position is stated in the proponent’s own words. Disagreements are classified as genuine or verbal, with clarifications.  

  | **Disagreement Topic** | **Architecturalist Position** | **Ecologist Position** | **Classification and Clarification** |  
  |------------------------|--------------------------------|------------------------|--------------------------------------|  
  | **Nature of Rigidity** | "Rigidity is a binary property of the control architecture: either the agent re-reads critical states or it does not. This property exists independently of observed behavior, explaining failures under perturbations where re-reading would help." | "Rigidity is not a property of the agent alone but of the agent-environment system. It is always a matter of degree, defined by how much perturbation is needed to disrupt behavior, and cannot be reduced to a binary architectural switch." | **Genuine**. The Architecturalist sees rigidity as an intrinsic, categorical feature of the mechanism (re-read or not). The Ecologist sees it as extrinsic and continuous (robustness to specific perturbations). The term "property" is pivotal: the former ties it to implementation, the latter to performance. |  
  | **Utility of Binary Distinction** | "The binary notion is essential: it isolates a discrete architectural feature (re-reading at decision points) that predicts failure under un-encountered perturbations. This is not mere rhetoric—it guides design and repair in systems." | "The binary notion is misleading. It ignores that all agents fail under some perturbations, and quantitative measures (e.g., error rates under varying x and d) are what matter for understanding adaptability. The binary framing adds no explanatory power." | **Genuine**. The Architecturalist argues the binary distinction explains why sphexishness persists in novel environments; the Ecologist argues it obscures how agents trade off costs across environments. The term "explanatory power" is central: the former claims predictive value, the latter denies it. |  
  | **Resource Limits vs. Architectural Choice** | "Sphexishness reflects an architectural choice: the absence of re-reading or locking. If locking is feasible but omitted due to cost, it is still an architectural feature (e.g., a 'fast-but-fragile' design). Cost does not reduce this to an ecological property." | "Sphexishness is a resource limit. When locking is too costly, the behavior is an optimal trade-off for the environment, not a fixed architectural trait. Calling it 'architectural' conflates design with constraint." | **Verbal**. The disagreement hinges on the term "architectural." Both agree cost-benefit trade-offs exist. The Architecturalist uses "architectural" to include cost-optimized designs; the Ecologist reserves it for immutable structures. The substantive question is whether cost-sensitive designs should be called rigid. |  
  | **Language-Model Agent Classification** | "These agents demonstrate non-sphexishness (re-entrant responses) as an architectural property, achievable without second-order re-entrancy. This shows rigidity is architectural and separable from higher-order cognition." | "These agents are non-sphexish due to training in perturbation-rich environments, not inherent architecture. Their flexibility is quantitative (high robustness to common perturbations), and calling it 'architectural' ignores the environmental role." | **Genuine**. The Architecturalist sees the agents as proof that re-entrancy can be implemented architecturally; the Ecologist attributes their behavior to environmental shaping. The term "architectural" is again contested, but the disagreement extends to whether the implementation is environment-independent. |  

