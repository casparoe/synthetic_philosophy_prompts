  First, I need to understand their core struggle. They argued with Jake about whether the frame problem is just bad database design or something deeper. The user believes it's about what we take for granted, which hints at tacit knowledge and context. That's key here—automated systems often miss the unspoken rules humans rely on.

  The user's job involves high stakes: welfare and zoning decisions affect people's lives. They need a practical checklist, not theory. Their pain points are speed (20 minutes!), clarity on when to reject tech vs. escalate values calls, and handling cases where the procedure isn't enough. 

  Breaking down their request:  
  - A step-by-step questioning sequence.  
  - Clear criteria for answers.  
  - Distinction between tech failures (reject) vs. ethical ambiguity (escalate).  
