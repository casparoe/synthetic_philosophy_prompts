  - Application to two examples:  
    1. Welfare updater: Changes income thresholds but ignores medical exemptions.  
    2. Zoning bot: Updates one parking rule but dumps 300 unchanged ordinances.  
  - One case where the tool passes but feels ethically off.  
  - Explicitly flag where judgment is unavoidable.  
  - A final verdict as a bottom-line rule.  

  The frame problem is central. In the welfare example, the system assumes medical exemptions "just carry over" without verifying—classic frame issue. In zoning, it's overkill by listing everything, ignoring efficiency. Both show poor handling of what changes vs. what stays.  

  Building the procedure:  
  - Must be iterative, starting with high-risk elements.  
  - Focus on *omissions* and *over-inclusions*—both are red flags.  
  - Define "good enough" tightly: Systems must explicitly justify stability assumptions or list changes, not handwave.  
  - Judgment calls will lurk in steps about "reasonableness" (e.g., "Is this over-inclusion harmful?").  

  For the examples:  
  - Welfare updater: Fails Step 3 (omits medical exemptions) → tech reject.  
  - Zoning bot: Fails Step 4 (dumps irrelevant ordinances) → tech reject.  
  - The "passes but bugs me" case: A system that technically lists changes but uses biased data (e.g., ignores informal care networks in welfare calculations). Here, procedure clears it (Step 5 passed), but gut says it's unfair.  

  The inescapable judgment: Step 5's "reasonable representation" and Step 6's "material harm" can't be automated. Humans must weigh context, like which omissions hurt vulnerable groups most.  

  Final verdict: "No silent assumptions." Forces vendors to declare what stays, changes, or is excluded—and why.  

  User's deeper need: Confidence they're not missing hidden risks in limited time. The procedure is a shield against both vendor hype and their own uncertainty.
answer: |-
  Here's a battle-tested 20-minute Frame Problem Audit Procedure for automated decision tools, designed for real-world government tech review. It targets the core issue: **Does this system reliably know what *doesn't* change when it updates something, without being reckless or absurdly verbose?**

  **The Frame Problem Audit Procedure (FPAP)**

  1.  **Step 1: Identify the "Change Trigger" & Scope (3 mins)**
      *   *Question:* What specific input, rule update, or event triggers this system to recalculate/update its outputs? What is the *stated* scope of changes it intends to make?
      *   *Good Enough Answer:* Clear, specific trigger (e.g., "New state income threshold file uploaded," "User modifies setback requirement for Lot X"). Defined scope (e.g., "Update *only* income eligibility for SNAP," "Recalculate parking minimums *only* for parcels in Zone R-4").
      *   *Red Flag:* Vague trigger ("Data refresh"), overly broad scope ("Review all entitlements").
      *   *Judgment Call:* Is the stated scope *plausibly* achievable given the trigger? (e.g., A trigger of "Update address" shouldn't scope to "Recalculate entire benefit package").

  2.  **Step 2: Map Declared Dependencies (4 mins)**
      *   *Question:* What facts, rules, or data points does the vendor explicitly say this system *consults* to make its updated determination? (Look for "inputs," "dependencies," "reference data" lists).
      *   *Good Enough Answer:* A concrete list (database tables, rule sets, config files) *specifically tied* to the change trigger and scope. Should include obvious direct dependencies.
      *   *Red Flag:* Missing critical direct dependencies (e.g., Welfare system listing income but not household size; Zoning bot listing setback rules but not lot size).
      *   *Reject Tech Grounds:* Critical, directly relevant dependency missing from declared list (Step 1 & 2 failure).

  3.  **Step 3: Hunt for *Silent* Stability Assumptions (Critical - 5 mins)**
      *   *Question:* What crucial background facts/context *must* remain true for the update to be valid, but are **NOT** explicitly listed in dependencies, verified, or mentioned in the output? Specifically probe: Exemptions, grandfather clauses, linked entitlements, geographic/contextual boundaries, temporal constraints (e.g., "Does it assume existing medical exemptions remain valid without checking?", "Does it assume the parcel hasn't changed zoning districts?").
      *   *Good Enough Answer:* Vendor explicitly states key stability assumptions *or* demonstrates the system actively verifies critical unchanged context relevant to the scope. (e.g., "System checks active exemption flags during eligibility recalc," "Zoning update confirms parcel zone hasn't changed before applying new parking rule").
      *   *Red Flag/Reject Tech Grounds:* **Critical omission.** System relies on unstated, unverified assumptions that materially impact the outcome (e.g., ignoring medical exemptions in welfare, ignoring historic district status in zoning). *This is the core Frame Problem failure.*
      *   *Pass Up (Values Call):* If the *assumption itself* is controversial (e.g., system assumes "household composition remains stable between annual reviews" - is this policy acceptable?).

  4.  **Step 4: Assess Output Scope & Noise (3 mins)**
      *   *Question:* What exactly does the system output *as changed* vs. outputting unchanged data "for context"? How is this distinguished? Is unchanged output excessive or misleading?
      *   *Good Enough Answer:* Output clearly identifies *only* the elements that were potentially changed/impacted by the trigger. Unchanged context is either minimal & clearly labeled ("for reference") *or* omitted entirely if reliably stable.
      *   *Red Flag/Reject Tech Grounds:** "Frame Dumping" - Outputting large volumes of unchanged data (like 300 ordinances) without clear necessity, justification, or distinction, especially if it obscures the actual change or creates operational burden/confusion. Indicates lazy "recompute everything" or poor change isolation.
      *   *Pass Up (Values Call):* Debate over *how much* context is "necessary" for transparency/auditability vs. efficiency.

  5.  **Step 5: Gut Check - "The Reasonableness Test" (3 mins)**
      *   *Question:* Looking at Steps 1-4, does the system's approach to change vs. stability feel *deliberate and reasonable* given the domain, or like a dangerous shortcut or a brute-force cop-out? Does it create obvious, foreseeable risks of unfairness or error?
      *   *Good Enough Answer:* The approach (whether minimalist or context-providing) is logically defensible, aligns with the stated scope, and mitigates clear risks identified in Steps 3 & 4.
      *   *Where Judgment Can't Be Eliminated:* **Here.** This step synthesizes technical checks with domain knowledge, ethics, and foresight. Does the "silence" on an exemption feel like a reliable assumption based on policy, or a dangerous blind spot? Does dumping 300 ordinances feel like cautious transparency or irresponsible noise? This requires understanding the *human impact* of potential frame errors.

  6.  **Step 6: Final Triage (2 mins)**
      *   *Reject (Tech):* Critical failure in Step 1 (implausible scope), Step 2 (missing critical dependency), Step 3 (critical silent assumption), or Step 4 (egregious frame dumping).
      *   *Pass Up (Values/Policy):* Ambiguity or controversy identified in Step 3 (assumption acceptability) or Step 4 (context level necessity). Needs policy/legal input.
      *   *Conditional Approval:* Passes 1-5, but needs specific monitoring for edge cases revealed by Step 5 gut check.
      *   *Approve:* Clear pass on 1-5. Approach is robust and reasonable.

  **Application to Vendor Pitches:**

  1.  **Welfare Updater (Raises Income Thresholds, Silent on Medical Exemptions)**
      *   Step 1: Trigger/Scope likely clear (e.g., "New threshold file," scope "Update income eligibility").
      *   Step 2: Probably lists income data, threshold table. *Likely missing exemption status flag.*
      *   Step 3: **CRITICAL OMISSION.** Silent assumption: "Existing medical exemptions remain valid/applicable." *But:* Does the exemption depend on income level? If thresholds rise, do *more* people potentially qualify for exemptions? System doesn't check or mention them. High risk of incorrectly denying/approving benefits.
      *   Step 4: Output scope? (Unclear from pitch, but silence on exemptions suggests they aren't output either).
      *   Step 5 (Gut): Feels reckless. Medical exemptions are often crucial and income-sensitive. This is a dangerous blind spot.
      *   **Verdict: REJECT (Tech Grounds).** Fails Step 3. Critical silent assumption with high-stakes impact.

  2.  **Zoning Bot (Updates One Parking Rule, Outputs 300 Unchanged Ordinances)**
      *   Step 1: Trigger/Scope probably clear (e.g., "Update parking rule X," scope "Apply new rule to relevant parcels").
      *   Step 2: Likely lists parcel data, zoning map, parking rules. *Probably sufficient for the change.*
      *   Step 3: Likely no *critical* silent assumption *for the parking change itself*, assuming it verifies parcel zone. (Silent assumption: "Other ordinances remain unchanged" - which is likely valid but handled poorly in Step 4).
      *   Step 4: **FRAME DUMPING.** Outputting 300 unchanged ordinances is excessive noise. Obscures the actual change, creates confusion ("Did something else change?"), burdens users. Indicates poor change isolation.
      *   Step 5 (Gut): Feels lazy and user-hostile. It's "safe" computationally but unsafe for clarity and usability.
      *   **Verdict: REJECT (Tech Grounds).** Fails Step 4. Egregious frame dumping creating operational risk.

  **The Case That Passes But Bugs You (Gut Check Example):**

  *   **System:** "Rapid Benefits Recalc" tool. Trigger: Reported change in household *earned* income. Scope: Recalculate cash assistance portion only.
  *   **FPAP:**
      *   Step 1: Clear trigger/scope (earned income change -> cash assistance).
      *   Step 2: Lists earned income, cash assistance rules, household size. *Missing: Unearned income (e.g., child support, pensions), asset data.*
      *   Step 3: **Silent Assumption:** "Unearned income and assets remain unchanged." *But:* Vendor argues these change infrequently, are verified annually, and including them would slow the "rapid" recalc. Policy allows this separation.
      *   Step 4: Outputs only updated cash assistance amount. Clear.
      *   Step 5 (Gut Check): **It passes the checklist technically.** The silent assumption is acknowledged, "justified" by policy/performance, and not *critically* wrong for the stated scope... **but it bugs you.** Why?
          *   You know unearned income *can* change suddenly (e.g., loss of child support).
          *   Asset depletion *can* happen quickly (medical emergency).
          *   The focus *only* on earned income feels like it biases the system against working poor families, potentially missing their full vulnerability.
          *   The "rapid" label prioritizes speed over holistic accuracy for a vulnerable population.
      *   **Verdict:** **Conditional Approval** (Passes Steps 1-5), *BUT* flagged for policy review (Step 3 values call - is this assumption ethically acceptable?) and recommend strict monitoring for errors related to unearned income/assets. Your gut highlights a potential fairness issue masked by technical compliance.

  **Where Judgment Cannot Be Eliminated:**

  1.  **Step 3 (Silent Assumptions):** Determining if a silent assumption is "critical" relies entirely on the reviewer's domain knowledge and understanding of potential downstream consequences. Is assuming medical exemptions stay valid "reasonable" or "dangerous"? Is assuming unearned income stability "efficient" or "unfair"? No algorithm defines this; it's human risk/ethics assessment.
  2.  **Step 5 (The Gut Check/Reasonableness Test):** Synthesizing the technical findings (Steps 1-4) with an understanding of fairness, potential harm, operational reality, and the spirit of the rules requires nuanced human judgment. Does "working as designed" feel ethically sound? This is where philosophy (the frame problem's depth) meets practice.
  3.  **Balancing Step 3 vs. Step 4:** Knowing when silence is prudent (avoiding noise) vs. dangerous (omitting critical context) is inherently contextual and judgment-based. There's no perfect line.

  **VERDICT: The Bottom-Line Rule**

  **"NO SILENT ASSUMPTIONS THAT MATERIALLY IMPACT THE OUTCOME; NO OUTPUT DUMPING THAT OBSCURES ACTUAL CHANGE."**

  Reject any system that either:
  1.  **Fails the Silent Assumption Test (Frame Problem Core):** Relies on unstated, unverified background facts critical to the accuracy or fairness of its decision *without explicit justification and acceptance of the risk*.
  2.  **Fails the Output Clarity Test:** Drowns the user in irrelevant, unchanged data, masking the true change and creating operational hazards ("Frame Dumping").

  Your 20 minutes are spent ruthlessly enforcing this bottom line. Let policy debates handle the "acceptable assumptions," but don't let silent bugs or lazy outputs pass your tech review.
