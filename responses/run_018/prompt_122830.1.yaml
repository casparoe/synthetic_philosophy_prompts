prompt: |-
  I write fiction, and I am about to make a decision that a historian is free to postpone. My novel is narrated in the first person by a woman from a fishing household on the northern shore of the lake, who attaches herself to a Galilean preacher and stays with him to the end. That means I have to settle, before drafting, what this preacher said, what he refused to say, what he thought he was doing, what the people travelling with him were expecting of him, and how much of any of it is only the evangelists' retrospection. I can hedge in a note; I cannot hedge in a scene. So I need a specification rather than a survey.

  Please write the desiderata that any method for getting from our sources — the four Gospels, with their well-known dependencies on one another; the letters of Paul, with their near-total silence about the life; the brief notices in Josephus, one of which has probably been retouched by Christian hands — to a portrait of Jesus would have to satisfy. Fix the purpose as mine: a portrait good enough to build one determinate character on, capable of carrying a psychological arc and of acting for reasons a reader can follow, rather than a portrait good enough for a monograph. Whether the standard is the same for the two purposes is itself something I want you to decide.

  For each requirement, give the case or consideration behind it, and mark it either non-negotiable or a preference of one school or one craft. Among the things I want adjudicated: whether a method owes me anything about what he did not say and could not have done, or only about what he did and said; whether a method can coherently be required to be independent of the historian's prior portrait of Jesus, or whether any criterion of authenticity is doomed to ratify whichever portrait it was run to confirm; how a criterion should treat sources that are not neutral reports but interpretations produced by people who already believed; whether the desiderata should require the method to recover the believing community as well as the man, since I have to stage the ensemble and not only the protagonist; and whether the portrait must be at once continuous with first-century Jewish life and discontinuous enough to explain why a movement formed around him and why Rome killed him.

  I also want a candidate criterion of my own audited. I have been working with something I call narrative fit: a reconstruction is adequate only if the actions I need to stage follow from the sayings I attribute to him, and those sayings from those actions, without my having to supply a bridging motive that the sources nowhere suggest. Is that a genuine desideratum, a novelist's prejudice smuggled into historiographical method, or a requirement with a narrow but real domain — and if the last, over what range is it trustworthy?

  Then the two things I care about most. First, tell me which subset of your desiderata you suspect cannot be jointly satisfied, and why: I would rather have the impossibility than a list that flatters my hopes. Second, name the single requirement that does the most work in excluding the criteria in ordinary use — embarrassment, dissimilarity, multiple attestation, Semitic or Palestinian linguistic and environmental colour, coherence with what has already been accepted — and score those against your list briefly, in a table if you prefer, since that part I can check for myself.

  Two closing requests. Give me a decision rule for an author: when the best-supported reconstruction of a scene carries something like a third or two-fifths of the probability mass and the alternatives are not dramatically worse, what may a novelist do, and exactly where does legitimate filling-in become dishonest? And mark your own confidence: attach a level of confidence to each desideratum, tell me which one you would retreat from first, say which consideration or piece of evidence would change your verdict about the most discriminating requirement, and say where you think your reasoning is most likely to fail.
reasoning: |-
  Okay, this is a fascinating and complex request from a fiction writer working on a historical novel about Jesus. The user needs a rigorous set of desiderata for reconstructing Jesus' character and actions, tailored specifically for narrative purposes rather than academic scholarship. 

  First, I need to unpack the core tension here: the novelist requires determinacy where historians can remain agnostic. Every scene demands concrete decisions about what Jesus said/did/thought, while scholarship deals in probabilities. The user is acutely aware of the methodological minefield - they mention gospel dependencies, Pauline silences, and Josephus' interpolations. 

  The key challenge is balancing historical plausibility with narrative coherence. The user's "narrative fit" criterion is particularly interesting - it's a novelist's instinct but might actually align with what historians call "coherence." I should validate that while warning about its limits. 

  For the desiderata, I'll need to address their explicit questions: 1) whether methods can establish negatives (what Jesus didn't do), 2) if objectivity is possible or if methods just confirm biases, 3) how to handle interpretative sources, 4) whether reconstructing the believing community is essential, and 5) the continuity/discontinuity paradox. 

  The user's two main concerns are crucial: they want to know where desiderata conflict irreconcilably, and which requirement most disqualifies common criteria like embarrassment or dissimilarity. I suspect the objectivity problem (D4) is the biggest hurdle - all criteria are ultimately hermeneutical. 

  For the decision rule about probability thresholds: at 33-40% likelihood, novelists have creative license provided they don't contradict stronger evidence and maintain psychological consistency. The line into dishonesty is crossed when portraying fringe theories as mainstream or ignoring key contextual constraints. 

  My confidence varies across desiderata. D1 (Jewish context) is rock-solid based on Dead Sea Scrolls and rabbinic literature. D7 (movement formation) is shakier - we lack clear data on the group's composition. I'd retreat first from D6 (intentionality) as it's inherently speculative. 

  The user's sophistication impresses me - they understand the difference between monograph-ready and narrative-ready portraits. Their anxiety about "smuggling novelist's prejudice" shows admirable discipline. I should honor that by being brutally honest about methodological limits while giving usable guidance.
answer: |-
  Here are the desiderata for reconstructing a "novel-ready" portrait of Jesus, designed for psychological coherence and narrative plausibility, evaluated against historical sources and methodological constraints. They are ranked by necessity for your purpose, with justification, negotiability, and confidence levels.

  ### Core Desiderata (Non-Negotiable for Narrative)
  1.  **D1: First-Century Jewish Contextual Embedding**
      *   **Case:** Jesus was a 1st-century Jew operating in Galilee/Judea. His words, actions, motivations, and audience expectations *must* make sense within Second Temple Judaism, including Messianic hopes, Torah interpretation, purity concerns, Roman occupation, and Galilean peasant life.
      *   **Non-Negotiable:** Failure here creates an anachronistic caricature. (Confidence: **Very High** - Overwhelming consensus from diverse sources: Gospels, Paul, Josephus, DSS, Philo, rabbinic lit., archaeology).
  2.  **D2: Sufficient Discontinuity for Impact**
      *   **Case:** While embedded (D1), Jesus must have acted/said things sufficiently provocative, unexpected, or authoritative within *his specific context* to explain both the formation of a committed movement *around him personally* and his execution by Rome as a perceived threat (not merely a religious nuisance). This explains the "event" of his life and death.
      *   **Non-Negotiable:** Without this, the core plot (movement formation, crucifixion) lacks plausibility. (Confidence: **High** - Crucifixion itself demands a political charge; movement formation implies unique magnetism/claims).
  3.  **D3: Psychological Coherence & Motive Accessibility**
      *   **Case:** The reconstructed character must act and speak in ways where underlying motivations are plausible and potentially discernible to the reader. Actions should flow from stated beliefs/personality, and statements should reflect likely intentions/experiences. This is the core of your "narrative fit."
      *   **Non-Negotiable:** Essential for a believable protagonist driving a novel. (Confidence: **High** - Fundamental to character-driven narrative; humans act for reasons).
  4.  **D4: Ensemble Plausibility (Movement Formation)**
      *   **Case:** The portrait must explain *why specific types of people* (fishermen, tax collectors, women, revolutionaries?) followed him, stayed through conflict, and interpreted his death. Their motivations and expectations must be derivable from their context and Jesus's reconstructed words/actions.
      *   **Non-Negotiable:** You need to stage the group dynamics believably. (Confidence: **Medium-High** - Sources show diverse followers; group cohesion implies shared compelling reasons).

  ### Methodological Desiderata (Preferences with Weight)
  5.  **D5: Source Transparency & Critical Handling**
      *   **Case:** The method must explicitly acknowledge the nature of sources: Gospels as faith-driven interpretations (not neutral reports), Paul's focus on the cosmic Christ, Josephus's brevity/possible interpolation. It must state *how* it uses these despite their biases and gaps.
      *   **Preference (Strong):** Necessary for intellectual honesty and avoiding naive literalism. (Confidence: **Very High** - Source criticism is foundational scholarship).
  6.  **D6: Explanatory Power for Key Events & Sayings**
      *   **Case:** The reconstruction must offer the *best available explanation* for the most historically secure core events (e.g., baptism by John, Temple incident, crucifixion) and sayings (e.g., parables, kingdom proclamation, "Father" address) within D1-D4.
      *   **Preference (Strong):** Anchors the portrait in concrete, well-attested data. (Confidence: **Medium** - Core events/sayings are relatively secure, interpretation varies).
  7.  **D7: Parsimony (Avoiding Excessive Theological Bridging)**
      *   **Case:** The reconstruction should minimize reliance on unstated theological motives or later church doctrines *as the primary driver of Jesus's historical actions/sayings*. Motives should be plausible within his 1st-century Jewish consciousness (D1).
      *   **Preference:** Guards against projecting later beliefs onto the historical figure. (Confidence: **Medium** - Distinguishing historical from theological motive is inherently difficult).

  ### Problematic/Contested Desiderata
  8.  **D8: Establishing Credible Negatives (What He Didn't Do/Say)**
      *   **Case:** Useful for defining boundaries (e.g., he likely didn't preach explicit Greco-Roman philosophy, lead a violent revolt, claim *explicitly* "I am God" in Hellenistic terms). Helps avoid anachronism.
      *   **Preference (Weak/Limited):** Can be inferred *indirectly* from D1 (cultural impossibility) or silence where we'd expect mention (e.g., Paul's silence on Jesus's life details doesn't negate events, but silence on specific teachings *might* cast doubt if they were central). **Not a primary tool.** (Confidence: **Low** - Hard to prove negatives; silence is ambiguous).
  9.  **D9: Methodological Independence (Objectivity)**
      *   **Case:** Can a method be truly independent of the historian's prior assumptions? Or do criteria (like dissimilarity) inherently favor certain portraits?
      *   **Verdict:** **Impossible Purity.** All historical method involves hermeneutical choices. However, D5 (Source Transparency) and rigorous application of D1 force confrontation with counter-evidence. Criteria *can* be applied systematically to challenge assumptions, but the *choice* and *weighting* of criteria reflect priorities. (Confidence: **N/A - Philosophical Reality**).

  ### Audit of "Narrative Fit"
  *   **Verdict:** A **genuine desideratum with a narrow but crucial domain (D3).**
  *   **Justification:** It operationalizes psychological coherence (D3). Humans act with internal logic. If reconstructed actions and sayings require implausible leaps in motivation *unattested and unsuggested* in the sources/context, the portrait is weak. It prevents arbitrary stitching.
  *   **Domain:** Trustworthy for **core sequences** (e.g., Temple action -> confrontations -> arrest). Less reliable for isolated sayings/events. It works *within* the constraints of D1 and D2.
  *   **Limit:** Cannot *generate* history; only tests *plausibility* of reconstructions based on other criteria. It's a check, not a source. *Don't* assume Jesus *must* have acted in ways that "fit" later theology perfectly.

  ### The Crucial Tension: Likely Irreconcilable Desiderata
  *   **D2 (Discontinuity for Impact) vs. D7 (Parsimony/Avoiding Theological Bridging) vs. D4 (Ensemble Plausibility)**
  *   **Why:** Explaining the movement's formation (D4) and Rome's execution (D2) *requires* Jesus to have done/said something profoundly impactful. Yet, within strict 1st-century Jewish parameters (D1, D7), what *exactly* that was, and how *he* understood it (without later Christology), remains inherently elusive. The disciples' interpretations (Gospels) are already faith-driven. Satisfying D2 and D4 often risks smuggling in later theological understanding (violating D7) or leaving Jesus's *self*-understanding frustratingly opaque (challenging D3). You *must* make a choice here that involves some degree of inference beyond ironclad proof.

  ### The Most Discriminating Requirement: Killing Common Criteria
  *   **D1 (Jewish Contextual Embedding)** is the most powerful filter.
  *   **Audit of Common Criteria:**
      | Criterion          | D1 (Jewish Context) | D2 (Impact) | D3 (Coherence) | D4 (Ensemble) | D5 (Source Crit.) | D6 (Explains Core) | D7 (Parsimony) | **Overall Fitness** |
      | :----------------- | :------------------ | :---------- | :------------- | :------------ | :---------------- | :----------------- | :------------- | :------------------ |
      | **Embarrassment**  | Neutral             | **+**       | Neutral        | Neutral       | **+**             | **+**              | Neutral        | Weak-Medium         |
      | **Dissimilarity**  | **-** (Often ignores context) | **+** (Forces uniqueness) | **-** (Can make him incoherent) | **-** (Ignores why followers understood him) | Neutral | **-** (Focuses on outliers) | **+** | **Weak** - Violates D1/D3/D4 severely |
      | **Multiple Attest.** | Neutral          | **+** (If widespread) | Neutral        | **+** (Shows broad appeal) | **+**             | **+**              | Neutral        | **Medium-Strong**   |
      | **Semitic/Env. Color** | **++**          | Neutral     | **+** (Adds realism) | **+**        | **+**             | Neutral            | **+**          | **Strong**          |
      | **Coherence**      | **+** (If context is base) | **+** (If impact is part of base) | **++**         | **+**          | Neutral           | **++**             | **+**          | **Strong**          |
  *   **Why D1 Wins:** Dissimilarity fails D1 spectacularly by defining authenticity as *lack* of Jewishness. Embarrassment is useful but narrow. Multiple attestation and Semitic color *support* D1 powerfully. Coherence *requires* D1 as its foundation. **D1 excludes implausible reconstructions most effectively.**

  ### Novelist's Decision Rule: Probability & Legitimate Filling-In
  *   **The Rule:** When the "best-supported" reconstruction has ~33-40% probability and alternatives are *reasonably plausible* (not demonstrably anachronistic, contradictory to core evidence, or psychologically incoherent), **you may choose the version that best serves your narrative's psychological arc (D3) and ensemble dynamics (D4), provided it:**
      1.  **Respects Non-Negotiables (D1, D2, D3, D4):** It *must* fit the Jewish context, explain impact, be psychologically coherent, and make the ensemble plausible.
      2.  **Does Not Contradict Stronger Evidence:** Don't choose an alternative directly contradicted by a core event/saying meeting higher criteria (e.g., multiple attestation + Semitic color).
      3.  **Acknowledges Uncertainty (Implicitly/Explicitly):** Let the character's uncertainty show, or structure scenes to reflect competing interpretations within the group.
      4.  **Avoids "Fringe" Options:** Don't choose a <10% probability reconstruction *unless* it uniquely satisfies D1-D4 demonstrably better than the mainstream options *and* you signal its speculative nature narratively.
  *   **Where Filling-In Becomes Dishonest:**
      *   **Contradicting Core Constraints:** Portraying actions/words impossible in 1st-century Judaism (violating D1), or motivations that make the movement/crucifixion inexplicable (violating D2/D4).
      *   **Resolving Scholarly Debates Covertly:** Presenting one highly contested interpretation (e.g., precise nature of "Son of Man," exact intent of Temple action) as *the* obvious, unambiguous truth without narrative signals of ambiguity or alternative views *within the story*.
      *   **Ignoring Key Evidence:** Omitting or distorting a well-attested core event/saying because it's inconvenient for your character arc.
      *   **Projecting Modern Sensibilities:** Making Jesus a 21st-century liberal, feminist, or revolutionary without rooting it demonstrably in D1.

  ### Confidence & Retreat
  *   **Confidence Levels:**
      *   D1: **Very High** (Non-negotiable)
      *   D2: **High** (Non-negotiable)
      *   D3: **High** (Non-negotiable) - *Confidence in achieving it perfectly is Medium*
      *   D4: **Medium-High** (Non-negotiable) - *Confidence in achieving it perfectly is Medium*
      *   D5: **Very High** (Strong Preference)
      *   D6: **Medium** (Strong Preference)
      *   D7: **Medium** (Preference)
      *   D8: **Low** (Weak Preference)
  *   **First Retreat:** **D7 (Parsimony/Avoiding Theological Bridging).** When pressed hardest by the D2/D3/D4 tension, you might *slightly* relax D7, allowing a *minimal, plausible* inference about Jesus's self-understanding that bridges the gap between his actions and his followers' interpretations, *as long as it remains rooted in Jewish categories* (D1). (e.g., Did he see himself as the definitive eschatological prophet? The "Son of Man" figure? An anointed king in some sense?).
  *   **Most Discriminating Requirement (D1) - What Could Change It?** Discovery of significant new 1st-century Galilean/Judean sources (archaeological inscriptions, new scrolls) that drastically alter our understanding of common Jewish beliefs/practices *during Jesus's lifetime*. This is unlikely but possible.
  *   **Likely Failure Point:** **Achieving D3 (Psychological Coherence) perfectly while respecting D1 and D7.** The inner life of any historical figure is hard; for Jesus, the sources are particularly focused on external impact and later interpretation. My reasoning might underestimate the opacity of pre-modern consciousness or overestimate our ability to reconstruct specific motivations from fragmentary, interpreted reports. Bridging the gap between action and self-perception (D3) without overstepping D7 is the tightrope walk.

  **In Essence:** Anchor your Jesus fiercely in his Jewish world (D1). Make him disruptive enough to explain his fate and followers (D2). Prioritize his and his followers' believable motivations above all (D3, D4). Use critical methods (D5) to handle sources. Choose plausible reconstructions for key scenes, even if not the absolute most probable, *provided* they honor D1-D4. Be transparent in your narrative choices where scholarship is divided. Your "narrative fit" is a valid tool for psychological plausibility (D3), not a historical generator. The greatest challenge lies in depicting his self-understanding credibly within his time while explaining his monumental impact. Good luck.
