prompt: |-
  hey, quick philosophical bet. what's your actual credence that solving the boundary problem — who belongs to the demos — forces us to ditch both "all affected interests" and birthright citizenship for a kind of recursive co-authorship view, where you're in the demos iff you're embedded in a practice of mutual lawmaking that you can actively contest and reshape? i want a number, 0 to 1, but decomposed: (a) the odds that democratic legitimacy is really about authorship not affectedness, (b) the odds that "active contestation" can be pinned down without circularity, (c) the odds that long-term tax-paying residents meet that bar while absentee passport-holders dont, and (d) whatever weight you give the intuition that membership shouldn't be "earned". put rough probabilities on each, combine them however you think is right, then tell me which term is the shakiest and what conceptual argument — not data, just reasoning — would move your overall number most. also sorry if this sounds weird, my friend thinks the real issue is who gets to exit the demos, not enter it — does that asymmetry change anything for your decomposition? there's probably a typo in there somewhere but you get the idea.
