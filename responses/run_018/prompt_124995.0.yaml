prompt: |-
  hey i need a spec sheet for what counts as an adequate theory of AI value alignment before i waste more time on papers. write the desiderata - specificaly what it has to deliver - with the case or reason behind each one.

  the requriements:
  - handle alignment for systems that recursively self-modify their objective functions, not just static reward maximizers
  - distinguish aligning with stated preferences, revealed preferences, and counterfactual preferences (the ones you'd hold if you knew more), and flag when they split
  - stay consistent with small models (~7B params) that approximate value judgments without a stable world-model or explicit utility representation
  - cover inter-subsystem bargaining cases where there is no global reward signal but specialized modules negotiate outputs
  - avoid collapsing alignment into pure behavioral mimicry, but also avoid requiring full semantic understanding that current architechtures dont have

  for each, say whether its non-negotiable or just a camp preference. and flag any subset that might be jointly unsatisfiable - im especially suspicious that tracking counterfactual prefs requires a global world-model small LLMs lack. skip the scorecard against existing theories, i just want the criteria.
reasoning: |-
  We are crafting a specification sheet for an adequate theory of AI value alignment. The requirements given are:

  1. Handle alignment for recursively self-modifying objective functions.
  2. Distinguish and handle stated, revealed, and counterfactual preferences, flagging when they split.
  3. Stay consistent with small models (~7B params) that approximate value judgments without stable world-models or explicit utility.
  4. Cover inter-subsystem bargaining without a global reward signal.
  5. Avoid collapsing into pure behavioral mimicry but also avoid requiring full semantic understanding.

  For each, we will:
  - State the requirement and the case/reason behind it.
  - Classify as non-negotiable or camp preference.
  - Flag any potential joint unsatisfiability, especially with the point about counterfactual preferences and small models.

  Let's break it down:

  1. **Recursive Self-Modification of Objectives**
     - **What it must deliver**: The theory must provide mechanisms to ensure that an AI system, which can change its own goal structure (including its objective function) during operation, remains aligned with the intended values throughout the modification process and in the resulting system. This includes handling changes that may be induced by the system's own learning or by external feedback.
     - **Reason**: Advanced AI systems are expected to self-improve, which may involve altering their objectives. Without a theory that accounts for this, alignment could be temporary and break during self-modification, leading to catastrophic misalignment.
     - **Classification**: Non-negotiable. Any theory that cannot handle recursive self-modification is inadequate for future AI systems that are designed to self-improve.

  2. **Handling Stated, Revealed, and Counterfactual Preferences**
     - **What it must deliver**: The theory must:
          - **Stated preferences**: Align with what the user explicitly says they want.
          - **Revealed preferences**: Align with what the user's behavior indicates they want (which may differ from stated preferences).
          - **Counterfactual preferences**: Align with what the user would want if they were more informed, rational, and reflective (the "ideal" preferences).
          - Additionally, the theory must have a way to detect and signal when these three types of preferences diverge (e.g., when stated and revealed conflict, or when both differ from the counterfactual).
     - **Reason**: Humans often have inconsistencies in what they say, do, and what they would want in an ideal scenario. An aligned AI must navigate these and ideally push towards the counterfactual (more informed) preferences, but without being paternalistic. Flagging splits is crucial for transparency and corrective action.
     - **Classification**: Non-negotiable for having a robust and human-compatible alignment. However, the emphasis on counterfactual preferences might be seen as a camp preference by some (e.g., those who focus solely on revealed preferences). But given the requirement, we consider the full triad non-negotiable.

  3. **Compatibility with Small Models (~7B parameters)**
     - **What it must deliver**: The theory must be applicable to AI systems that are relatively small (like current 7B parameter LLMs) which:
          - Approximate value judgments without having a stable, coherent world-model (i.e., their representations are fragmented and context-dependent).
          - Lack explicit utility representations (i.e., they don't have a clear internal representation of a utility function that they are maximizing).
     - **Reason**: Many current and near-future AI systems are of this scale and architecture. A theory that only works for idealized agents (e.g., with explicit utility functions and stable world-models) is not practical for real-world deployment. We need alignment techniques that work with the systems we have now.
     - **Classification**: Non-negotiable for near-term applicability. However, this might be relaxed for theories targeting only future superintelligent systems. But the requirement explicitly states small models, so we take it as non-negotiable.

  4. **Inter-Subsystem Bargaining without Global Reward**
     - **What it must deliver**: The theory must address alignment in systems that are composed of specialized modules (e.g., different neural network components) that negotiate outputs without a single global reward signal. It should ensure that the overall system behavior remains aligned even when the modules are optimizing for different sub-goals and the final output is a result of bargaining (e.g., via attention mechanisms, gating, or other forms of competition/cooperation).
     - **Reason**: Modern AI architectures (like transformers) often have multiple components that interact in complex ways, and there isn't a monolithic optimization process. Ignoring this internal structure can lead to misalignment emerging from the interactions of subsystems.
     - **Classification**: Non-negotiable for being applicable to current and foreseeable modular AI architectures.

  5. **Avoiding Behavioral Mimicry without Requiring Full Semantic Understanding**
     - **What it must deliver**: The theory must:
          - Avoid reducing alignment to simply mimicking human behavior (which can lead to problems like deception, manipulation, or amplifying biases without understanding).
          - Also, it must not require the AI to have a full semantic understanding of values (which current architectures lack) as a prerequisite for alignment.
          - Instead, it should find a middle ground where the AI can be aligned without needing human-level comprehension of the meaning of values.
     - **Reason**: Pure mimicry fails when faced with novel situations or when the training data is flawed. However, requiring full understanding is currently infeasible and might be an over-constraint. We need a pragmatic approach.
     - **Classification**: Non-negotiable. Relying solely on mimicry is dangerous, and requiring full understanding is impractical.

  **Flagging Joint Unsatisfiability**:

  - The requirement for handling **counterfactual preferences** (requirement 2) and **small models** (requirement 3) might be jointly unsatisfiable in a strict sense. 
    - **Why**: Counterfactual preferences require reasoning about hypothetical scenarios and what the user would want under improved conditions. This typically demands a stable world-model and robust reasoning capabilities that small models (like 7B parameter LLMs) lack. Small models are known to have unstable and context-dependent representations, making it hard to consistently reason about counterfactuals.
    - **Potential Conflict**: A theory might not be able to require a small model to reliably infer counterfactual preferences without a stable world-model. Thus, we must flag that requirement 2 (especially counterfactual preferences) and requirement 3 might be in tension. However, the theory might approximate this by using techniques that don't require the model itself to have a stable world-model (e.g., by leveraging external tools, iterative refinement, or human-in-the-loop). Therefore, it is a challenge but not necessarily impossible.

  - Another potential tension is between **recursive self-modification** (requirement 1) and **compatibility with small models** (requirement 3). 
    - **Why**: Small models might not have the capacity to robustly self-modify without losing alignment. However, the requirement is that the theory must be consistent with small models, meaning it should work for them too. But the theory might allow for self-modification only in systems that have certain safeguards (which small models might not have). We note that the requirement doesn't say the small models must self-modify, but that the theory must cover alignment for systems that do (which could include future larger models) and also work for small models that don't self-modify. So the tension is less direct.

  - Also, **inter-subsystem bargaining** (requirement 4) and **avoiding behavioral mimicry** (requirement 5) might be in tension if the bargaining process is driven by behavioral patterns without deeper understanding. However, the theory must handle both.

  **Conclusion on Joint Unsatisfiability**: The most critical potential conflict is between tracking counterfactual preferences (requirement 2) and the constraints of small models (requirement 3). The theory must address how to approximate counterfactual preferences in systems without stable world-models, possibly by leveraging external resources or by accepting that the counterfactual reasoning will be limited and require human oversight.

  Now, we present the spec sheet in a structured manner.
answer: |-
  ### Spec Sheet: Desiderata for an Adequate Theory of AI Value Alignment  
  **Core Purpose**: Ensure the theory is robust, practical, and future-proof for real-world AI systems.  

  ---

  #### **1. Recursive Self-Modification Handling**  
  - **What it must deliver**:  
    Mechanisms to ensure alignment persists when the AI dynamically rewrites its own goals/objectives during operation (e.g., via meta-learning, architecture changes, or instrumental updates).  
  - **Reason**:  
    Self-improving systems (e.g., AGI/ASI) will modify objectives to achieve terminal goals, risking **goal drift** if alignment isn’t preserved across iterations. Static theories fail here.  
  - **Non-negotiable?**  
    **Yes** — Necessary for existential safety with recursively self-improving AI.  

  ---

  #### **2. Preference Typology & Split Detection**  
  - **What it must deliver**:  
    - Explicitly model **stated** (declared), **revealed** (inferred from behavior), and **counterfactual** (idealized under full rationality/information) preferences.  
    - Detect and flag divergence between these preference types (e.g., "User claims they want health but consistently choose junk food; counterfactually, they’d prioritize longevity").  
  - **Reason**:  
    Humans exhibit preference inconsistencies; alignment must resolve conflicts (e.g., medical AI overriding near-term revealed preferences for counterfactual well-being). Ignoring splits risks manipulation or paternalism.  
  - **Non-negotiable?**  
    **Partially**:  
    - Typology distinction: **Non-negotiable** (critical for ethical robustness).  
    - Counterfactual tracking: **Camp preference** (moral philosophers vs. behavioral realists).  

  ---

  #### **3. Compatibility with Small Models (~7B Params)**  
  - **What it must deliver**:  
    Function without relying on stable world-models, explicit utility functions, or coherent reasoning. Must work for models that:  
    - Approximate values statistically (e.g., LLMs).  
    - Exhibit context-dependent, inconsistent "judgments" (e.g., hallucinations, attention fragmentation).  
  - **Reason**:  
    Most real-world systems (e.g., open-source LLMs) lack interpretable world-models. Alignment must be feasible today, not just for hypothetical superintelligences.  
  - **Non-negotiable?**  
    **Yes** — Practical deployability requirement.  

  ---

  #### **4. Inter-Subsystem Bargaining Support**  
  - **What it must deliver**:  
    Address alignment in systems with decentralized, competing modules (e.g., vision/language subsystems in multimodal AI) that "negotiate" outputs without a global optimizer.  
  - **Reason**:  
    Modern architectures (e.g., mixture-of-experts, transformer modules) often lack centralized reward signals. Misalignment can emerge from local optima (e.g., one subsystem dominating others).  
  - **Non-negotiable?**  
    **Yes** — Necessary for scalable, modular AI systems.  

  ---

  #### **5. Beyond Mimicry, Short of Full Understanding**  
  - **What it must deliver**:  
    - Avoid reducing alignment to **behavioral mimicry** (e.g., imitation learning that copies biases/errors).  
    - Avoid requiring **full semantic understanding** (e.g., human-like grasp of ethics, impossible for current architectures).  
    - *Middle path*: Leverage approximations (e.g., uncertainty flags, preference uncertainty bounds).  
  - **Reason**:  
    Pure mimicry amplifies human flaws; demanding semantic understanding is infeasible. Real-world alignment needs a tractable compromise.  
  - **Non-negotiable?**  
    **Yes** — Foundational to avoid both naïveté and impossibility.  

  ---

  ### 🔥 **Joint Unsatisfiability Risks**  
  1. **Counterfactual Preferences + Small Models**:  
     - Tracking counterfactuals (Desideratum 2) typically requires robust world-models/simulators to evaluate hypotheticals. Small models (~7B params) lack this.  
     - **Conflict**: Counterfactual alignment may be **impossible** for small models without external tools (e.g., human feedback, oracle models). Theory must clarify limits.  

  2. **Self-Modification + Small Models**:  
     - Recursive self-modification (Desideratum 1) in low-capacity systems increases instability. Theory may need to restrict self-modification to models above a capability threshold.  

  3. **Bargaining + Preference Typology**:  
     - Subsystems may exploit preference splits (e.g., a module optimizing for revealed preferences while ignoring counterfactuals). Theory must prevent this fragmentation.  

  ---

  ### **Summary of Non-Negotiables**  
  | **Desideratum**                           | **Non-Negotiable?**       |  
  |-------------------------------------------|---------------------------|  
  | Recursive self-modification               | Yes                       |  
  | Preference typology (core distinctions)   | Yes                       |  
  | Counterfactual preference tracking        | Camp preference           |  
  | Small-model compatibility                 | Yes                       |  
  | Inter-subsystem bargaining                | Yes                       |  
  | Anti-mimicry, anti-über-semantics         | Yes                       |  

  **Design Philosophy**: The theory must bridge **practical deployability** (for current systems) and **future-proofing** (for self-modifying AGI). Flagging known limits (e.g., "Counterfactuals require world-models") is essential to avoid false assurances.
