  Hmm, I need to simulate how each faction will interpret this claim. For the social historians, they'll likely hear this as dismissing their meticulous archival work and imposing anachronistic judgments. The philosopher will fixate on whether this approach compromises historical truth. And the archivists will panic about betraying primary sources. 

