  hey — need opening remarks for a workshop tomorrow, maybe 4 minutes. it's on simultaneous discovery (newton/leibniz, darwin/wallace type stuff). audience is split: half historians of science, half working scientists and grad students, and honestly several of them just got scooped recently or are teriffied of being next. this is personal for me too — i found out last month that a result i sat on for two years just came out from a group in berlin, same core finding, different notation. so the 'was it inevitable?' question isn't abstract anymore.

