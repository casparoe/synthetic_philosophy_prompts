  Structural flow: Start with vulnerability (user's story), frame inevitability as structural not personal, introduce the analogy, then resolve the tension. Crucially, avoid implying scooped researchers failed. Instead, position simultaneity as proof the discovery was robust. End by uniting both groups in studying this phenomenon.

