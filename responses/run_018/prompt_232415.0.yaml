answer: |-
  ## Examination Question

  **Case:** In 2023, "Veritas Bank" collapsed after its CEO, Mr. Vance, was found to have systematically falsified financial reports to inflate the bank's value. Two employees publicly condemn Vance’s fraud:

  1.  **Sarah:** A junior accountant who has always meticulously followed accounting rules, refusing even minor ethical compromises throughout her career. She states: "Vance’s actions are a fundamental betrayal of trust and a gross violation of financial ethics. He deserves condemnation."
  2.  **David:** A senior investment manager who, ten years ago, was caught falsifying performance data on a smaller fund he managed to secure a bonus. He was demoted, repaid the bonus with interest, underwent ethics retraining, and has maintained an impeccable record since. He states: "Vance’s actions are a fundamental betrayal of trust and a gross violation of financial ethics. He deserves condemnation."

  Vance, upon being confronted, retorts to David: "Look who's talking! You did the same thing yourself. You have no right to blame me." He makes no such retort to Sarah.

  **Question:** Does David lack the *standing* to blame Vance for fraud in a way that Sarah possesses it? Critically evaluate this question by doing the following:
      a) Precisely define what *standing to blame* involves, explaining why it is distinct from both (i) the truth of the blamer's judgment and (ii) the offender's basic desert of blame.
      b) Develop and contrast *two distinct explanations* for why hypocrisy (like David's past action) is thought to undermine standing. One explanation should focus on the *expressive nature of blame* (e.g., concerning sincerity, commitment, or the message blame communicates). The other should focus on considerations of *fairness, reciprocity, or exemption from shared norms*.
      c) Test these explanations against a harder case: Suppose a third employee, **Tom**, also condemns Vance. Tom genuinely believes in ethical accounting *but* suffers from severe weakness of will; he occasionally falsifies minor data points under pressure to meet targets, always regrets it, and vows to stop. How well does each explanation account for whether Tom has standing to blame Vance?
      d) Finally, considering Vance’s retort "Look who's talking!" and his lack of retort to Sarah, does the force of this objection stem primarily from one of your two explanations, from both together, or from something else? Justify your view.

  ---

  ## Model Answer (Approx. 1000 words)

  David and Sarah both level the same condemnation at Vance for fraud. Vance’s retort to David, "Look who's talking!", challenges David’s *standing* to blame, implying Sarah possesses it. This essay argues that David *does* lack standing in a way Sarah does not, but not because his judgment is false or Vance doesn’t deserve blame. Standing concerns the blamer’s *moral authority* or *position* to issue blame, rooted in the blamer’s relationship to the norm violated and their own conduct.

  **a) Defining Standing:** Standing to blame is the normative entitlement to hold another accountable through the reactive attitudes and practices constitutive of blame. It is distinct from:
      *   **(i) Truth of Judgment:** Sarah and David’s judgment about Vance’s wrongdoing is identically true. Vance committed fraud and deserves blame. Standing isn’t about the *content* of the judgment, but the *right* of the *speaker* to utter it authoritatively in this context.
      *   **(ii) Offender’s Desert:** Vance’s desert of blame is a separate question concerning *his* actions and their moral quality. Desert addresses the *target*; standing addresses the *source*. Vance *deserves* blame regardless of who delivers it, but not everyone is *entitled* to deliver it meaningfully.

  Standing hinges on the blamer’s own adherence to, or relationship with, the norm they invoke. If the blamer themselves significantly violates the norm they condemn, their authority to blame others for that same norm violation is compromised.

  **b) Two Explanations for Hypocrisy Undermining Standing:**

  1.  **The Expressive Account (Commitment/Sincerity):** Blame isn't just a statement; it's an expressive act communicating the blamer’s endorsement of the norm, their serious commitment to it, and their emotional investment in its violation (e.g., indignation). A hypocrite, like David *before* reform, lacks sincerity. His blame expresses a commitment he demonstrably lacks through his own actions. This renders his blame *inauthentic* or *performative*. It fails to genuinely embody the norm’s authority because the blamer himself flouts it, undermining the expressive force. Blame loses its communicative power to call the wrongdoer to account when the blamer hasn't held *themselves* accountable to the same standard.

  2.  **The Reciprocal/Fairness Account:** Moral norms governing blame imply a community of mutually accountable agents. Standing relies on *reciprocity* – the blamer implicitly claims the right to hold others accountable *because* they hold *themselves* accountable to the same standards. By violating the norm himself (like David did), the hypocrite *exempts himself* from the shared normative framework he seeks to enforce against others. This creates an unfair power imbalance or a failure of *mutual recognition*. It’s unjust for David to demand Vance adhere to a norm David himself ignored, as this violates a basic principle of fairness: holding others to standards you refuse for yourself. The hypocrite attempts to occupy a privileged position outside the norm, forfeiting the equal standing needed to enforce it.

  While both accounts agree hypocrisy undermines standing, they diagnose different core problems: inauthentic expression vs. unfair exemption/non-reciprocity.

  **c) Testing with Tom (Weakness of Will):**

  Tom condemns Vance while occasionally committing similar, minor frauds due to weakness of will, despite genuine belief and regret.

  *   **Expressive Account:** Tom’s standing is severely compromised. His blame expresses commitment and sincerity, but his *actions* blatantly contradict this expression. His weakness of will means his commitment is demonstrably unstable. While he *believes* the norm, his inability to consistently *act* on it renders his expression of blame through condemnation hypocritical and thus inauthentic. His blame risks being seen as hollow posturing, lacking the conviction his words profess.
  *   **Reciprocal/Fairness Account:** Tom’s standing is also undermined, but perhaps less categorically. He *does* violate reciprocity by demanding Vance adhere strictly to a norm he frequently violates. This is unfair. However, his genuine belief, regret, and lack of self-exemption (he likely feels guilty and believes he *should* be blamed) might mitigate the *unfairness*. He doesn’t claim exemption; he acknowledges failing. While his standing is weakened by his inconsistency, the mitigation might make his blame slightly less objectionable than David’s *past* hypocrisy *if* David initially denied wrongdoing, though still problematic.

  Both accounts find Tom’s standing deficient, but the Fairness account potentially allows for *degrees* of deficiency based on attitudes towards self-exemption, whereas the Expressive account focuses more sharply on the contradiction between word (blame) and deed (violation).

  **d) The Force of "Look Who's Talking!"**

  The force of Vance’s retort stems powerfully from *both* explanations working in tandem, not one alone.

  *   **Expressive Contribution:** The retort highlights the *inauthenticity* of David’s blame. It points out the jarring disconnect: "How can *you*, who did this very thing, stand there expressing righteous indignation?" This exposes the potential performative hollowness.
  *   **Reciprocal/Fairness Contribution:** Simultaneously, the retort cries *unfairness*: "By what right do *you*, who exempted yourself from this rule, now demand *I* follow it?" It attacks David’s claim to occupy the position of an enforcer within a reciprocal moral community when he previously exited it.

  The retort gains its full, dismissive power by leveraging *both* the lack of sincere authority *and* the perceived unfairness. Targeting only one aspect wouldn't capture its full sting. Vance doesn't retort to Sarah because neither inauthenticity nor unfairness applies; her consistent adherence validates both the sincerity of her expression and her position within the reciprocal framework. The combined force of the two accounts best explains why "Look who's talking!" functions as a potent challenge to standing specifically, rather than just a tu quoque fallacy about the truth of the judgment.

  **What Would Change This Answer:**

  The model answer's central claim (that David lacks standing primarily due to the combined force of expressive inauthenticity and unfair non-reciprocity) is most vulnerable to an alternative account of standing grounded **solely in the blamer's *current* normative commitment or role authority, irrespective of past violations if adequately addressed.**

  *   **Alternative Account:** If standing is determined *exclusively* by the blamer's *present* sincere commitment to the norm and their role-based authority to enforce it (e.g., as a fellow employee or member of the moral community), then David’s past violation, given his genuine reform, restitution, and decade of adherence, might *not* undermine his standing. His current commitment could be deemed sufficient for authentic expression, and his reform could reintegrate him into the reciprocal community, removing any unfairness. On this view, David *might* have standing similar to Sarah’s.
  *   **Where Model Fails:** The model answer assumes past serious violations, even if repented and reformed, necessarily taint the blamer's expressive authenticity and reciprocal position in a way that current weakness of will (Tom) does not necessarily do more severely. If a robust account of reform *fully* restores both commitment and reciprocal standing, the model overstates the difference between David and Sarah, and potentially understates the problem with Tom. The model's reasoning is most likely to fail if it cannot convincingly argue that David’s reformed status does *not* fully restore the conditions for authentic expression and fair reciprocity required for standing, or if it fails to adequately distinguish the impact of *past-but-reformed* hypocrisy from *ongoing* inconsistency like Tom's.

  ---

  ## Marking Scheme (Total: 25 Marks)

  1.  **Defines Standing Accurately & Distinguishes from Truth/Desert: (5 marks)**
      *   *Must-hit move:* Clearly defines standing as distinct entitlement/authority *of the blamer*, separate from truth of judgment (i) and offender's desert (ii).
      *   *Common Mistake:* Conflates standing with the truth of the judgment or the basic desert of the offender.

  2.  **Articulates & Contrasts Two Distinct Explanations for Hypocrisy: (5 marks)**
      *   *Must-hit move:* Develops two clearly distinct accounts – one focused on expressive features (sincerity/commitment) and one focused on fairness/reciprocity/exemption – explaining *how* each sees hypocrisy undermining standing.
      *   *Common Mistake:* Provides only one account, or presents two accounts that are insufficiently distinct (e.g., both vaguely about "hypocrisy being bad").

  3.  **Effectively Tests Explanations Against the Hard Case (Tom): (5 marks)**
      *   *Must-hit move:* Applies *both* explanations developed in (b) to the case of Tom (weakness of will) and draws reasoned conclusions about his standing under each account, noting differences if applicable.
      *   *Common Mistake:* Ignores one explanation, applies explanations inconsistently, or fails to engage meaningfully with the specifics of Tom's case (ongoing violation, regret).

  4.  **Analyses "Look Who's Talking" Force & Integrates Explanations: (5 marks)**
      *   *Must-hit move:* Provides a reasoned analysis of whether the retort's force stems primarily from one explanation, both together, or something else, specifically linking the analysis to the Vance/David/Sarah dynamic and justifying the view.
      *   *Common Mistake:* Simply asserts the retort is about hypocrisy without linking it to the accounts of standing, or fails to justify why both (or one) account is necessary to explain its specific force *as a standing challenge*.

  5.  **Overall Argument, Clarity, and Structure: (5 marks)**
      *   *Must-hit move:* Presents a coherent, well-structured, and clear argument throughout, directly addressing all parts of the question, using the case effectively, and demonstrating conceptual understanding.
      *   *Common Mistake:* Disorganized, unclear prose; fails to integrate the case study; wanders off-topic; relies on slogans or superficial analysis; fails to reach a clear overall position on David's standing.
