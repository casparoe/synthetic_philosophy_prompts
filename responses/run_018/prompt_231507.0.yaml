answer: |-
  Here is a comprehensive specification of desiderata for a theory of joint/shared action, structured around your requirements and pressure-test cases. Desiderata are categorized, with empirical anchors and critical distinctions highlighted. Non-negotiables are marked **(NN)**; camp-specific commitments are marked **(C-Camp)**.

  ---

  ### **I. Core Functional Requirements (What the Theory Must Explain)**
  1.  **Minimal Coordination & Goal Interdependence (NN):** Must explain how actions are coordinated toward a *shared goal state* even without explicit agreement.  
      *   *Case:* Strangers heaving a car off a cyclist. Each recognizes their individual effort is *insufficient* and *depends* on the other's simultaneous effort to succeed.  
      *   *Empirical:* Warneken et al. (2006) - Toddlers (18m) spontaneously coordinate actions (e.g., carrying a board together) to achieve a goal impossible alone.

  2.  **Cognitive Asymmetry Tolerance (NN):** Must allow for participants to have *different understandings, motivations, or private reservations* about the action, *without* necessarily destroying the jointness.  
      *   *Case 1:* Table carriers - One privately intends to quit at the truck. Joint action persists *until* the defection occurs.  
      *   *Case 2:* Walk to station - One thinks "date," the other "job interview." They are still *walking to the station together* despite mismatched personal interpretations.  
      *   *Distinction:* Cannot collapse the *joint project* (walking together) with *individual reasons/motivations* for participating.

  3.  **Scalability of Commitment (NN):** Must accommodate a spectrum from fleeting, ad-hoc cooperation to highly committed, norm-governed collaborations.  
      *   *Case 1:* Car rescue (fleeting).  
      *   *Case 2:* Hunting party (sustained, role-based, but potentially without explicit agreement or strong commitment).  
      *   *Case 3:* Gilbertian joint commitments (strong mutual obligations).  
      *   *Distinction:* Cannot require explicit agreement or strong mutual obligations for *all* joint action.

  4.  **Role Differentiation & Meshing Sub-Plans (NN):** Must explain how individuals contribute *different, complementary actions* (often without central direction) that mesh into a coherent whole.  
      *   *Case:* Hunting party - Flushers flush, blockers block, shooters shoot. Each does their part anticipating others' complementary parts.  
      *   *Empirical:* Carpenter et al. (2005) - Young children adjust roles in complementary tasks (e.g., one holds a box open, the other places items in).

  5.  **Responsiveness & Dynamic Adjustment (NN):** Must explain how participants monitor and *adapt* their actions in real-time based on the partner's actions and the state of the shared goal.  
      *   *Case:* Jazz duo improvising - Constantly adjusting tempo, harmony, dynamics based on the other's playing without prior planning.  
      *   *Empirical:* Vesper et al. (2010) - Studies on motor coordination showing real-time mutual adaptation in joint tasks.

  ---

  ### **II. Constraints & Distinctions (What the Theory Can't Ignore or Collapse)**
  6.  **Jointness Without Shared Mental Content (NN):** Must allow the "we" to be constituted *without* identical mental representations (intentions, beliefs) in each participant's head.  
      *   *Case:* Walk to station mismatched interpretations. "We are walking to the station together" holds despite differing beliefs about *why* they are doing it or *what it signifies*.
      *   *Distinction:* Cannot require perfectly *shared* or *identical* goal content or intention content.

  7.  **Joint Action vs. Parallel Individual Action (NN):** Must provide a clear criterion distinguishing genuinely joint action from merely doing similar things alongside each other with a common *external* goal.  
      *   *Case:* Two people separately heading to the same protest on opposite sidewalks. No interdependence, coordination, or mutual responsiveness.
      *   *Distinction:* Cannot collapse *common external goal* (protest happening) with *shared goal* (doing something together *towards* that goal).

  8.  **Pre-Linguistic & Pre-ToM Joint Action (NN):** Must be consistent with evidence of joint action in agents lacking full-blown theory of mind or complex language.  
      *   *Empirical:* Hamann et al. (2012) - 2-year-olds (weak ToM) successfully coordinate in joint pulling tasks requiring synchronized effort. Bullinger et al. (2011) - Chimpanzees show some coordination in rope-pulling tasks for mutual reward.

  9.  **Minimal vs. Rich "We" (NN):** Must distinguish between a thin sense of "we" (co-actors achieving an interdependent goal) and a thick sense (collective agents with identity, obligations, etc.).  
      *   *Case:* Car rescue (thin "we") vs. a married couple saving for a house (thick "we" with obligations).  
      *   *Distinction:* Cannot assume all joint action involves a thick "we." A theory must explain the thin version *first*.

  ---

  ### **III. The "We" Question (The Core Mechanism)**
  The theory **must specify the constitutive basis of the "we":**
  *   **Not Merely Common Goal:** (See Desideratum 7 - Protest case).
  *   **Candidate Anchors (Non-Negotiable to have *an* answer):**
      *   **Goal Interdependence + Mutual Responsiveness:** The core "we" arises from the recognition (implicit or explicit) that the goal *requires* coordinated contributions, coupled with mutual responsiveness in action (Bratman-inspired, but requires weakening).
      *   **Joint Commitment (Gilbert-style - C-Camp):** The "we" is constituted by a mutual commitment creating obligations. (Fails car rescue & toddler cases).
      *   **We-Intention (Searle-style - C-Camp):** A primitive "we intend" in the mind of each participant. (Fails mismatched interpretations & toddler cases).
      *   **Dynamic Coordination Loop (Emergent - C-Camp):** The "we" is an emergent property of the real-time perceptual-motor coupling and mutual adjustment (Inspired by jazz case, empirical coordination studies).
  *   **What *Cannot* Count as Joint:** Actions lacking *any* interdependence, mutual responsiveness, or mutual awareness of co-participation (Parallel protest case). Intentional coordination *must* be present, however minimal.

  ---

  ### **IV. Key Tensions & Potential Incompatibilities**
  *   **Recursive Intentions vs. Minimal Cognition (NN Conflict):** Requiring complex mutual beliefs ("I intend that we J, and I believe you intend that we J, and I believe you believe I intend...") (Bratman, Searle) **vs.** Pre-ToM toddlers/chimps performing joint actions (Desideratum 8). *Likely Irreconcilable*. Theories requiring recursion must deny minimal cases are *truly* joint; theories accommodating minimal cases must reject recursion as necessary.
  *   **Shared Goal Content vs. Cognitive Asymmetry (NN Conflict):** Requiring participants to share the *exact same description/content* of the goal (Searle, Gilbert) **vs.** Mismatched interpretations persisting within a joint action (Walk to Station case, Desideratum 6). *Likely Irreconcilable*. Strict shared content fails asymmetry; allowing radical asymmetry risks collapsing jointness.
  *   **Commitment/Obligation as Constitutive vs. Fleeting Cooperation (NN Conflict):** Making mutual commitment/obligation essential (Gilbert) **vs.** Ephemeral joint actions like the car rescue (Desideratum 3). *Likely Irreconcilable*. Obligation-based theories must deny fleeting cases are joint; theories accepting fleeting cases must make obligation contingent, not constitutive.

  ---

  ### **V. Pressure Test Performance of Major Views (Briefly)**
  *   **Searle (We-Intentions):** Fails Cognitive Asymmetry (requires internally self-referential "we-intention"), Pre-ToM Joint Action (requires complex self-referential intention), Shared Goal Content (assumes identical content), Minimal Coordination (sometimes works), Fleeting Cooperation (sometimes works). Struggles with Mismatched Interpretation.
  *   **Bratman (Shared Cooperative Activity - SCA):** Fails Pre-ToM Joint Action (requires mutual belief & meshing subplans), Spontaneous/Fleeting Cooperation (requires interlocking intentions & mutual responsiveness *based on* those intentions - car rescue lacks setup time), Cognitive Asymmetry (requires mutual belief in jointness & common goal - mismatched interpretations problematic). Excels at Role Differentiation, Meshing Subplans, Responsiveness (in committed cases). Struggles with Minimal "We".
  *   **Gilbert (Joint Commitment):** Fails Spontaneous/Fleeting Cooperation (requires explicit or readily inferable agreement/commitment), Pre-ToM Joint Action (requires understanding of commitment/obligation). Fails Cognitive Asymmetry (commitment implies shared understanding of the undertaking). Excels at Scalability to Rich Cases (creates obligations), clearly distinguishes Joint vs. Parallel Action. Struggles severely with Minimal "We" and Dynamism (Jazz).

  ---

  ### **The Single Requirement Knocking Out the Most Standard Views: Cognitive Asymmetry Tolerance (Desideratum 2)**
  *   **Why:** Searle requires a specific, self-referential "we-intention" content. Bratman requires mutual belief in the joint intention and common goal. Gilbert requires a shared understanding of the jointly committed action. **All three implicitly or explicitly require participants to share a core understanding *of what they are doing together*.** The Table Carrier (private quit intention) and especially the Walk to Station (fundamentally different interpretations of the *nature* of the joint activity) cases demonstrate that joint action can persist despite significant divergence in individual participants' mental states *about the joint action itself*. A theory demanding shared intentional content or mutual belief about the jointness cannot accommodate this robustly observed phenomenon. This requirement forces a move towards accounts based on *behavioral interdependence*, *mutual responsiveness*, or *goal structures* rather than requiring shared mental content.

  This list prioritizes the phenomena a theory *must* address, the boundaries it *must* respect, and the empirical reality it *must* account for. The tensions highlighted point towards fundamental disagreements about the *nature* of sociality that may preclude a single, unified theory satisfying all desiderata to all camps.
