  ### **Seminar Activity: Exploring Strategy Through a Novel Game**

  **Game Name:** *Symmetry Path*  
  **Materials per Pair:** One 3x3 grid paper, 5 black tokens, 5 white tokens (or pencils to mark squares).  

  **Rules of *Symmetry Path*:**  
  - **Objective:** Create a continuous path of your tokens connecting any two opposite edges of the board (top-bottom, left-right, or either diagonal) with no gaps.  
  - **Setup:** Empty 3x3 grid. Players are Black (first) and White (second).  
  - **Turns:** On each turn, place one token in an empty cell.  
  - **Win Condition:** Complete a continuous edge-to-edge path (row 1 to row 3, column 1 to column 3, or diagonally from corner to corner) with your tokens. Paths must be contiguous (adjacent cells sharing an edge or corner).  
  - **Key Properties:**  
    - Symmetric rules for both players.  
    - Perfect information (all moves visible).  
    - First player has a winning strategy via strategy-stealing.  
    - One harmless opening move: Placing a token in the center (C) on the first turn. Other opening moves (corners or edges) risk immediate counterplay.  

  ---

  ### **Phase 1: Silent Paired Play (20 min)**  
  - **Instructions:**  
    - Split into 6 pairs. Each pair gets a grid and tokens.  
    - Play 5–10 rounds of *Symmetry Path*. No talking.  
    - Record wins/losses only (e.g., "B: 4 wins, W: 1 win").  
  - **Facilitator Guidance:**  
    - Observe and tally aggregate results on a board (e.g., "First-player wins: 28, Second-player wins: 2").  
    - Note: Expect ~90% first-player wins due to the strategy-stealing property. Do not explain why.  

  ---

  ### **Phase 2: Guided Worksheet Construction (35 min)**  
  - **Instructions:**  
    - Regroup into 3 teams of 4. Each team gets a worksheet:  
      > **Assume (for contradiction) that the second player has a winning strategy *S*.**  
      > 1. If the second player can always win with *S*, how would they respond to any first move?  
      > 2. The first player makes an arbitrary opening move (e.g., corner). They then "discard" this move mentally—pretend it never happened. How?  
      > 3. The first player now acts as the second player, using *S* against White’s first move. How does *S* guide their moves?  
      > 4. But the board has an extra token (from step 2). How does this break *S*?  
      > 5. Why is this a contradiction?  
  - **Facilitator Guidance:**  
    - Circulate and prompt: *"If White’s strategy *S* wins no matter what, can Black hijack it? What goes wrong when Black ‘forgets’ their first move?"*  
    - **Redirect explicit strategies:** If teams derive a concrete first-player win (e.g., "Always start at C"), ask: *"But what if we ban the center? Can White still be beaten without knowing how?"*  

  ---

  ### **Phase 3: Preference Auction & Debrief (25 min)**  
  **Preference Auction (10 min):**  
  - Students bid hypothetical points (e.g., 0–100) to choose their player role (first or second) in a new game.  
  - Record bids: Expect higher bids for first player due to Phase 1 experience.  

  **Debrief (15 min):**  
  1. **Reveal the strategy-stealing argument:**  
     - Symmetry: Rules are identical—no intrinsic second-player advantage.  
     - Dummy move: The "discarded" opening (Step 2) is harmless (center placement).  
     - Non-constructivity: We proved a winning strategy exists without constructing it.  
     - Name canonical examples: Hex, Gomoku, and the *Symmetry Path* variant.  

  2. **Honest Reflections:**  
     - **What the activity reproduces:** Extra options (like the center move) can’t hurt—you can ignore them.  
     - **What it omits:**  
       - Real games where extra tokens *can* obstruct (e.g., Chess pawns blocking bishops).  
       - Constructive strategies (e.g., Hex requires explicit path-building).  
     - **Predictable failure mode:** Teams deriving explicit strategies miss the non-constructive "existence proof." Redirect by emphasizing: *"The contradiction forces a win to exist, but doesn’t tell us how to win."*  

  3. **Final Note:** Strategy-stealing is a non-constructive, combinatorial tool—powerful but limited.  

  ---

  ### **Logistics & Adaptation**  
  - **Timing Buffer:** Shorten Phase 1 if games run long.  
  - **Failure Mode:** If >50% derive explicit strategies, use their example to contrast existence proofs ("Knowing *that* Black wins ≠ knowing *how*").  
  - **Why *Symmetry Path* Works:**  
    - Symmetric paths mimic Hex’s topology but avoid textbook associations.  
    - Center move is harmless (no path depends solely on it, but it doesn’t block future options).
