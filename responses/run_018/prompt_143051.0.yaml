answer: |-
  Here’s a prioritized breakdown of open questions, grounded in your framework, ranked by their potential to unblock practical decision-making for institutions:

  ### **Ranking & Rationale**  
  1. **#1: Under what conditions does mnemonic sovereignty ethically override archival evidence?**  
     *Why it unblocks others:* Resolving this creates a decision framework for institutions. If we can define non-relativist criteria for when lived memory trumps documents (e.g., survival of cultural identity, ongoing harm from archives), it prevents paralysis in cases like your indigenous origin story scenario.  
     *Tractability:* High—philosophers can develop criteria (e.g., "Does contesting memory threaten group existence? Was the archive weaponized?").  
     *Bump up if:* Concrete thresholds emerge (e.g., "sovereignty claims override archives when 1) archival gaslighting is probable, AND 2) the memory is identity-constitutive").  
     *Value judgment:* Prioritizes restorative justice over positivism.  

  2. **#2: How can we reliably distinguish archival gaslighting from ordinary bias/gaps?**  
     *Why it unblocks:* Without this, mnemonic sovereignty lacks teeth. If gaslighting is just "bad archives," institutions default to "fixing" memory. Proving intentional distortion legitimizes skepticism of colonial archives.  
     *Tractability:* Medium—requires cross-disciplinary work (e.g., forensic historiography + community testimony). Non-specialists need clear indicators (e.g., systematic omission of counter-evidence, proven motive).  
     *Bump down if:* No scalable verification method emerges in 2 years.  
     *Overrated warning:* Deep archival science methods—fund thinkers who translate patterns into usable checklists.  

  3. **#3: What procedural frameworks best resolve conflicts when *both* claims have legitimacy?**  
     *Why it ranks last:* Depends on #1 and #2. Focuses on implementation: How should a school board *structure* deliberation when archives aren’t provably malicious but memory challenges them?  
     *Tractability:* High—design participatory processes (e.g., shared authority in interpretation).  
     *Bump up if:* Institutions face stalemates despite agreeing on #1/#2 principles.  

  ---

  ### **Worked Scenario: Indigenous Origin Story vs. Carbon Dating**  
  - **Conflict:** Oral history places community origins at Site X 10,000 years ago; colonial archives cite "nomadic peoples" with no deep ties. Carbon dating shows Site X uninhabited until 3,000 years ago.  
  - **Archival gaslighting?** Likely—colonial administrators erased pre-contact narratives to justify land dispossession.  
  - **Mnemonic sovereignty?** The origin story underpins land rights and cultural rituals.  

  **How the ranking changes institutional action:**  
  - **If #1 is solved:** Curator defers to oral history. Criteria met: archive is colonial (gaslighting probable), memory is identity-constitutive. Carbon data becomes "interesting but irrelevant" to cultural authority.  
  - **If #1 unsolved but #2 solved:** Proof of gaslighting discredits the archive, but without #1, the curator might still privilege "scientific" evidence over memory.  
  - **If only #3 exists:** A school board might "split the difference" (e.g., teach both versions equally)—*which is the harmful mistake*: equating power-layered narratives.  

  ---

  ### **Key Values & Pitfalls**  
  - **Non-negotiable value:** Colonial archives *presume* their own objectivity. Grant must center power asymmetry.  
  - **Overrated inquiry:** "Is memory *ever* epistemically equal to archives?"—distracts from your goal. Focus on *when* and *why* it should prevail.  
  - **Harm causation:** Worst institutional error is demanding marginalized groups "prove" gaslighting while taking archives as default truth.  

  **Prioritize #1 because:** It forces institutions to stop asking "Which is true?" and start asking "What does justice require?"—using your niche concepts as leverage.
