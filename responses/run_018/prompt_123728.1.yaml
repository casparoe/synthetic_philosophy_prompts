prompt: |-
  i'm a phd student in political economy and i’ve been stuck on this for my comps prep. i want to take Aristotle’s distinction between oikonomia (household management) and chrematistike (wealth-getting for its own sake) plus his claim that money is naturally sterile—tokos is like breeding barren metal—and apply it to the collapse of Lehman Brothers in 2008, specifically the CDS and repo markets. not asking for a history lesson; i assume you know the basic arc: Lehman was overleveraged on mortgage-backed securities, the repo market froze, and the government let it fall.

  what i need is a disciplined mapping. treat Aristotle’s framework as the theory and the Lehman episode as the case. first, identify the actors and instruments: who was practicing oikonomia versus chrematistike? where does the CDS function like tokos—money begetting money without a natural limit? then tell me where Aristotle’s lens actually explains something—maybe the infinite appetite for accumulation breaking the natural measure of exchange—or where it misdescribes modern finance, since Aristotle never imagined derivatives or institutional counterparty risk. here’s the niche twist: compare the repo-market freeze not just to moral failure but to Aristotle’s idea that when money stops being a measure of exchange and becomes itself the object of exchange, the medium corrupts—like if the ruler started stretching to measure itself. work that comparison in even if it feels slightly forced, and tell me if it reveals a limit in Aristotle or just a strained analogie.

  finally, say what the case shows about the theory: does Lehman confirm that chrematistike collapses under its own sterility, or does it show Aristotle missed something about systemic risk being a collective problem rather than an individual vice? write it all out, then at the end give me a JSON object with exactly these keys: "theory_mapping" (Aristotle concept mapped to Lehman feature), "explanatory_success" (where the lens works), "explanatory_failure" (where it breaks or is silent), "reverse_insight" (what Lehman teaches Aristotle), and "forced_analogy_check" (how the repo-freeze-as-corrupt-medium framing holds up). no bibliography needed—i just want the argument.
