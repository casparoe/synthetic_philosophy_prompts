  First, I need to outline the core philosophical distinctions. The main tension is between deontological ethics (duty-based, like Kant's categorical imperative where lying is always wrong) and consequentialism (focusing on outcomes, where a white lie might prevent harm). There's also virtue ethics, considering what a compassionate person would do. Then there's communicative ethics, where the purpose of communication matters. Is the goal truth-telling or maintaining social harmony?

  Anthropologically, the key is cultural relativism versus universal morality. The friend's claim that culture only describes behavior is descriptive cultural relativism, but that's debated. Some anthropologists argue that cultural practices co-evolve with moral frameworks, so directness in the Netherlands is tied to egalitarian values, while indirectness in Japan relates to group harmony. This is contested—universalists might argue that certain truths (like not deceiving) are always moral, regardless of culture.

