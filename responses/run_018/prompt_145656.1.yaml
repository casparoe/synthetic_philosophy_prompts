  ### Structural Mapping of Madhyamaka Concepts to Type Theory and Evaluation Semantics

  #### **Catuṣkoṭi (Tetralemma) in Computational Terms**  
  Let a "phenomenon" be represented by a term `t` of type `P`, where `P` may be a type (e.g., `Int`, `Bool`) or a higher-kinded type (e.g., `* -> *`). Evaluation is lazy, and `t` is a thunk (unevaluated computation). The four positions are redefined as follows:  

  1. **P is (exists, is true)**:  
     `t` reduces to a **weak head normal form (WHNF)** that is a canonical value.  
     *Example*: `t = 42` (converges to an integer).  
     *Structural meaning*: `t` is a well-typed, terminating computation with a concrete inhabitant.  

  2. **P is not (does not exist, is false)**:  
     `t` diverges (evaluates to `⊥`).  
     *Example*: `t = fix (\x -> x)` (infinite loop).  
     *Structural meaning*: `t` lacks any observable value due to non-termination.  

  3. **P both is and is not**:  
     `t` is a **thunk with non-deterministic evaluation**: it *may* converge to a value in one context but diverge in another, depending on external dependencies.  
     *Example*: `t = if (readEnv "flag") then 42 else fix id` (divergence depends on runtime environment).  
     *Structural meaning*: `t` has no intrinsic evaluation behavior; its outcome is context-dependent.  

  4. **P neither is nor is not**:  
     `t` inhabits an **uninhabited type** (e.g., `Void`). No evaluation occurs because no valid term exists.  
     *Example*: `t :: Void` is impossible to construct.  
     *Structural meaning*: `P` has no inhabitants, making `t` a logical contradiction (e.g., a type error).  

  #### **Śūnyatā (Emptiness) and Pratītyasamutpāda (Dependent Origination)**  
  - **Śūnyatā as absence of *svabhāva* (intrinsic nature)**:  
    No term has an **intrinsic normal form** or **ground value**. All values are:  
    - Defined by their position in a **dependency graph of thunks**.  
    - Lazy: A "value" (`x`) is a thunk forcing other thunks (`y`, `z`, ...).  
    - Example: `x = y + z` where `y` and `z` are thunks from external sources.  
    - *Key point*: Emptiness **≠** non-termination or uninhabited types. It is the lack of any term that evaluates independently of its context (no "prime mover" thunk).  

  - **Pratītyasutpāda as dependency graphs**:  
    - Phenomena are nodes in a **directed graph of thunks**.  
    - Edges represent **evaluation dependencies** (e.g., forcing `x` forces `y`).  
    - Cycles imply divergence: `x = f y`, `y = g x` → `⊥`.  
    - *No ground values*: Every term depends on other thunks; the graph has no root (e.g., no "atomic" integer without prior computation).  

  - **Emptiness of emptiness**:  
    The claim "all phenomena are empty" is itself a thunk (`e`). `e` has:  
    - No intrinsic truth value: Its meaning depends on the dependency graph it describes.  
    - No privileged normal form: `e` may diverge if the graph is cyclic or underspecified.  
    - *Computational meaning*: Emptiness is a higher-order thunk that forces the entire dependency graph, inheriting its partiality.  

  ---

  ### **Residue Report: Mapping Failures and Limitations**  

  #### **Successful Mappings**  
  - **Corner 1 (is)**: Cleanly maps to **convergent evaluation** (well-typed term with WHNF).  
  - **Corner 2 (is not)**: Cleanly maps to **divergence** (`⊥`).  
  - **Corner 4 (neither)**: Cleanly maps to **uninhabited types** (logical impossibility).  
  - **Śūnyatā**: Successfully captured as **context-dependence**: No term is self-grounding; all require forced dependencies.  
  - **Pratītyasamutpāda**: Directly maps to **evaluation dependency graphs**, including cycles causing divergence.  

  #### **Distorted or Problematic Mappings**  
  - **Corner 3 (both is and is not)**:  
    - *Requires non-determinism*: Type theory assumes deterministic evaluation. Non-determinism (e.g., `t` converges in one reduction path, diverges in another) must be smuggled in via external state (e.g., `readEnv`).  
    - *Distortion*: This corner becomes a **meta-theoretic property** (e.g., "`t`'s behavior depends on external inputs"), not a first-class distinction in type theory.  

  - **Emptiness of emptiness**:  
    - *Partial success*: The self-referentiality of "emptiness is empty" maps to a thunk (`e`) that recursively forces its own dependency graph.  
    - *Failure*: In computation, `e` can be a well-defined thunk (e.g., a function analyzing dependency graphs). Madhyamaka denies this, insisting `e` must also lack intrinsic validity. Type theory cannot express this without regress (e.g., `e` depends on `e'` for its emptiness, ad infinitum).  

  #### **No Computational Counterpart**  
  - **Ontological groundlessness**:  
    Madhyamaka asserts that dependent origination has **no first cause** (no root thunk). In type theory:  
    - Dependency graphs must have **initial thunks** (e.g., primitive integers, IO inputs) to avoid infinite regress.  
    - These are treated as "ground values," violating śūnyatā.  
    - *Residue*: The framework cannot model the claim that *even primitives* are empty, as computation requires axioms (e.g., `1` is not a thunk).  

  - **Non-duality of contradictions**:  
    Madhyamaka rejects classical logic (e.g., `P` and `¬P` are mutually exclusive). In type theory:  
    - `P` and `¬P` map to **inhabited vs. uninhabited types** (e.g., `P` vs. `P -> Void`).  
    - The "middle way" (beyond `is/is not`) has no analogue, as types are bivalent (inhabited or not).  

  ---

  ### **Conclusion: Does the Vocabulary Capture the Philosophy?**  
  - **Yes, for relative dependence**: Śūnyatā and pratītyasamutpāda translate robustly to **dependency graphs** and **contextual evaluation**, denying intrinsic normal forms.  
  - **No, for absolute groundlessness**: The framework cannot eliminate "ground values" (primitives, IO) without breaking computation. Ontological regress has no counterpart.  
  - **Collapse of the tetralemma**: Three corners (1, 2, 4) reduce to **termination**, **divergence**, and **uninhabited types**—familiar PL concepts. Corner 3 collapses into **environmental non-determinism**, a practical concern but not a fundamental distinction.  
  - **Residual insight**: The inability to map "groundlessness" suggests Madhyamaka points to a **meta-computational claim** (no ultimate axioms in reality), which type theory relativizes to a given system/context. Emptiness is not just about partiality but the **impossibility of self-contained semantics**, a challenge to PL foundations.  

  This reveals a **gap in the vocabulary**: Type theory assumes a closed system with primitives, while Madhyamaka denies any such closure philosophically. The residue is not a failure of the philosophy but a limitation of computational models to capture absolute dependence.
