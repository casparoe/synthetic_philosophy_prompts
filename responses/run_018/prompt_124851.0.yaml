answer: |-
  Here’s a practitioner-focused decision procedure grounded in transitional justice principles, designed for non-legal teams. The logic prioritizes **truth recovery**, **community restoration**, and **explicit moral debt** over punishment or forgiveness.

  ---

  ### **Residual Accountability Decision Procedure**  
  *(Ordered Steps with Clear Gates)*  

  1. **ELIGIBILITY SCREEN**  
     - *Factual gate:* Applicant must admit to specific acts during the conflict period.  
     - **NO if:** Denies involvement or claims acts were justified by context alone.  
     - *Handoff:* If "yes," proceed. *Value call:* Define "conflict period" dates beforehand.  

  2. **TRUTH ASSESSMENT**  
     - *Factual gate:* Does testimony include **all** of:  
       - (a) Specific victims/harms caused (names/locations),  
       - (b) Methods used,  
       - (c) Chain of command (who gave orders, who assisted)?  
     - **NO if:** Omits verifiable facts *they reasonably should know*.  
     - *Handoff:* If gaps exist, assess if due to genuine ignorance or refusal. *Value call:* How much truth is "enough"?  

  3. **CORROBORATION CHECK**  
     - Cross-reference testimony with:  
       - Existing survivor/victim accounts,  
       - Forensic evidence (e.g., mass graves),  
       - Other perpetrators’ statements.  
     - **NO if:** Evidence proves deliberate falsehood.  

  4. **MORAL POSTURE EVALUATION**  
     - *Handoff (values-heavy):* Does the applicant:  
       - Acknowledge harm as wrongful (not just "regrettable")?  
       - Accept ongoing responsibility?  
       - *Not required:* Emotional remorse.  
     - **NO if:** Glorifies violence or shifts *all* blame upward.  

  5. **HARM CALIBRATION**  
     - Match proposed restrictions to harm severity:  
       - *Mandatory:* Public acknowledgment of acts + civil restrictions (no office, travel bans).  
       - *Variable:* Hours of community repair work (e.g., 5 hrs/week for minor harm; 20 hrs/week for grave harm).  
     - *Handoff:* Community representatives help set repair tasks.  

  6. **COMMUNITY CONSULTATION**  
     - Present anonymized case summary to:  
       - Victims/survivors affected,  
       - Local elders/leaders,  
       - Civil society reps.  
     - **NO if:** >30% of *direct victims* oppose.  
     - *Handoff:* Define "community" boundaries and voting thresholds *before* any case.  

  7. **FINAL AGREEMENT**  
     - Sign public contract detailing:  
       - Testimony summary (archived),  
       - Restrictions + monitoring mechanism,  
       - Repair work schedule.  
     - **NO if:** Applicant rejects terms.  

  ---

  ### **Case Application**  

  **Case 1: Former Militia Organizer**  
  - *Claims:* Identifies 3 burial sites but refuses to name commanders ("not certain").  
  - **Procedure Outcome:**  
    - Step 1 (Eligibility): **YES** (admits acts).  
    - Step 2 (Truth): **NO**. Withholding command structure fails "chain of command" requirement. *Gate closed.*  
    - **Result:** Rejected. Rationale: Truth commissions (like Argentina’s) prioritize systemic accountability; protecting superiors undermines the core goal.  

  **Case 2: Elderly Guard**  
  - *Claims:* Names victims, commanders, methods; expresses remorse.  
  - *Community:* 40% want forgiveness; 40% demand prison; 20% neutral.  
  - **Procedure Outcome:**  
    - Steps 1-4: **YES** (full truth, accepts responsibility).  
    - Step 5: Assign civil restrictions + 15 hrs/week repair work (e.g., maintaining memorial).  
    - Step 6 (Community): If >30% of *direct victims* oppose, **NO**. If not, **YES**.  
    - **Result:** *Uncomfortable outcome possible.* If victims are split (e.g., 25% oppose), procedure accepts despite community polarization.  
    - **Why uncomfortable?** Prioritizes victim voices over broader social pressure, but may leave reconciliation unfinished. Reflects South Africa TRC’s tradeoff: truth granted amnesty even when unpopular.  

  ---

  ### **Critical Value Judgments to Settle**  
  1. **Step 2:** What constitutes "reasonably should know"? (e.g., Is militia organizer *required* to name commanders?).  
  2. **Step 6:** Who counts as "direct victims"? How are dissenters weighted?  
  3. **Step 6 Threshold:** Is 30% victim opposition too low/too high?  

  ### **Key Logic Anchors**  
  - **Gacaca influence:** Community-led truth assessment > legal technicalities.  
  - **Amnesty tradeoff:** Residual accountability accepts incomplete justice to get truth, but imposes lasting consequences (unlike blanket amnesty).  
  - **Moral debt:** Restrictions visibly mark societal exclusion (no office) while repair work symbolizes debt repayment.  

  ---  
  **For your meeting:** Focus debate on Steps 2 and 6 thresholds. The procedure forces hard choices but prevents deadlock by separating verifiable facts (gates) from community values (handoffs).
