answer: |-
  You've identified a fascinating and very real pattern in historical discourse. While there isn't a single universally accepted term *exclusively* for this specific split, several concepts and phrases capture its essence:

  1.  **"Structural Determinism for Origins, Personal Agency for Atrocities":** This is a descriptive phrase directly naming the components you observe. It highlights the shift from seeing the *rise* of the regime as structurally inevitable to attributing its *specific, extreme actions* to Hitler's personal will and pathology.
  2.  **"The Great Man Fallacy (Selectively Applied)":** You're spotting the "Great Man Theory" (emphasising individual historical actors) being inconsistently deployed. It's often dismissed for the regime's existence ("any demagogue would have risen") but then wheeled out to explain the Holocaust or Operation Barbarossa ("only Hitler was that mad/ideological/ruthless").
  3.  **"Attribution Asymmetry" (in Historical Causation):** This broader term describes the imbalance in *where* we assign cause. Here, the asymmetry lies between systemic forces (attributed to the regime's rise) and individual agency (attributed to specific horrors).
  4.  **"The Hitler Exceptionalism Trap":** This captures the tendency to treat Hitler as uniquely monstrous *specifically for the worst outcomes*, implicitly suggesting that without him, a structurally similar authoritarian regime wouldn't have committed comparable atrocities – a highly debatable point often linked to a desire to see the Holocaust as uniquely aberrant rather than a potential within the system.

  **Coining a Term: Structural Inevitability / Personal Monstrosity Dichotomy (SIPMD)**

  *   **Structural Inevitability:** Refers to the argument that the broader authoritarian/nationalist regime was unavoidable due to deep-seated economic, political, and social factors (Versailles, hyperinflation, Depression, weak democracy, existing antisemitism/völkisch thought).
  *   **Personal Monstrosity:** Refers to the claim that the *specific, most horrific manifestations* (industrialised genocide, reckless invasion of the USSR) required Hitler's unique blend of ideology, personality disorder, charisma, and absolute power.
  *   **Dichotomy:** Highlights the perceived separation between these two types of explanation.

  **Drawing the Line: SIPMD vs. Inconsistency**

  The SIPMD *is* a form of inconsistency, but it's a *specific, motivated* one, not random sloppiness. Here's how to distinguish it:

  *   **Just Inconsistency:** Randomly switching explanations without a pattern, perhaps due to poor research or genuine confusion. E.g., attributing the Reichstag Fire solely to structural factors one minute, then solely to Nazi conspiracy the next, without linking it to the broader pattern you identified.
  *   **SIPMD:** A *consistent pattern* of applying structural explanations to the regime's *emergence and existence* ("Nazism was inevitable") while switching to *personalistic, "great man" explanations* for its *most morally reprehensible and extreme actions* ("The Holocaust required Hitler's specific madness"). The motivation is often:
      *   **Moral Comfort:** It's psychologically easier to blame unique evil for unique horror, distancing "normal" structural factors from ultimate culpability. It makes the Holocaust feel less like a potential product of modern societies under certain stresses.
      *   **Historical Convenience:** It simplifies complex causality. Explaining the regime structurally is well-established; explaining the *specific form* of the genocide feels like it needs the "Hitler factor".
      *   **Underestimating Systemic Radicalisation:** It downplays how the Nazi system itself, once established with its ideology and mechanisms of power, could generate extreme violence and reckless decisions *even with different leadership*, perhaps on a different scale or timeline. The "working towards the Führer" dynamic, where subordinates radicalised policies anticipating Hitler's wishes, shows the system's own murderous momentum.
      *   **Overestimating Hitler's Uniqueness:** While undoubtedly pivotal and monstrous, SIPMD risks ignoring that other top Nazis (Himmler, Heydrich, Goebbels, Rosenberg) shared core elements of his ideology and ruthlessness, and that the structures of the regime empowered and amplified these tendencies.

  **In essence:** SIPMD is a *systematic inconsistency* driven by the desire to reconcile the unsettling idea that broad societal/structural failures create fertile ground for authoritarianism, with the equally unsettling (but different) idea that the absolute worst horrors seem to demand a uniquely evil actor. It's an attempt to compartmentalise historical explanation and moral responsibility. Professional historians generally strive for a more integrated analysis, seeing structures *enabling* individuals and individuals *exploiting and radicalising* structures in a dynamic interplay – Hitler was both a product of his time and a catastrophic shaper of it. The horrors weren't *inevitable*, but they became *possible and then actual* through the terrifying confluence of structural conditions and the specific individuals who seized power within them.
