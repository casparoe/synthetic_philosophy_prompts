reasoning: |-
  We are going to explain the Löbian obstacle to self-trusting agents to a group of CS grad students with zero logic background in 20 minutes.

  Key Goal: They should understand that a rational system that can model its own reasoning cannot assign full credibility (i.e., 100% confidence) to that reasoning without running into contradiction.

  Teaching Plan:

  1. (2 min) Motivation: Why care about self-trusting agents?
     - We want to build AI systems that can reason about themselves, e.g., an AI that improves its own forecasting algorithm by learning from past mistakes. But if the system doesn't trust itself, how can it use its own reasoning to improve? And if it fully trusts itself, could that lead to problems?
     - Example: A forecasting bot that adjusts its confidence weights based on past predictions. It uses its own past predictions to update how much it trusts its own predictions. But what if it starts by assuming it's perfectly accurate? That might lead to trouble.

  2. (3 min) Setting up a simple model: The forecasting bot.
     - The bot makes predictions about events (e.g., will it rain tomorrow?) and assigns a confidence (say, 90%). After the event, it sees if it was right and updates its confidence accordingly.
     - But now we want the bot to have a model of its own accuracy. It might say: "I believe that my predictions are always correct." But then what if it makes a prediction that turns out to be wrong? It would have to adjust, but the problem is deeper.

  3. (5 min) Introducing the core issue: Self-reference and the possibility of error.
     - We ask: What if the bot makes a prediction that, if true, would lead to a contradiction? (Here we are setting up a self-referential statement.)
     - Example: Consider the statement: "This statement is false." That leads to a paradox. In logic, we avoid such statements by not allowing self-reference? But in a system that can model itself, self-reference is unavoidable.

     - Now, let's design a specific scenario for the bot:
          - The bot is programmed to always output a prediction with 100% confidence. (We are going to show that this leads to a problem.)
          - We want the bot to predict: "The next prediction I make will be wrong." But we can't have that because if it predicts that with 100% confidence, then:
              - If it's right, then the next prediction (which is this one) is wrong -> contradiction.
              - If it's wrong, then the next prediction is actually correct, but then the statement "the next prediction I make will be wrong" is false, so the next prediction (which is the statement itself) must be correct -> contradiction.

     - But note: We are not letting the bot actually make that prediction because it's impossible. Instead, we can think about what the bot's model of itself would say about such a prediction.

  4. (5 min) Connecting to Löb's theorem (without the heavy logic).
     - We tell them: There's a theorem in logic (Löb's theorem) that says: If a system can prove that "if it can prove P, then P is true", then it can prove P. In other words, the system can only be 100% confident in P if it actually proves P. But then, if the system assumes that everything it proves is true (which is what 100% self-trust would mean), then it would have to prove everything? That doesn't make sense.

     - Actually, we can reframe it for our bot:
          - Suppose the bot has a rule: "If I am 100% confident in a prediction, then that prediction is true." (This is the self-trust.)
          - Now, consider a prediction P that says: "If I am 100% confident in P, then Q" (where Q is something false, like 0=1). 
          - The bot might reason: 
              "Assume I become 100% confident in P. Then by self-trust, P is true. But P says: if I am 100% confident in P then Q. So, since I am 100% confident in P (by assumption), then Q must be true. But Q is false. So my assumption (that I am 100% confident in P) must be wrong. Therefore, I cannot be 100% confident in P."

          - This reasoning seems fine. But note: the bot just proved that it cannot be 100% confident in P. But what if it tries to assign 100% confidence to the statement that it cannot be 100% confident in P? That would be a different statement.

     - The key point: The bot cannot have a rule that says "everything I am 100% confident in is true" and also be 100% confident in that rule itself? Because then it would have to be true, but we just saw that such a rule leads to the bot being unable to assign 100% confidence to some statement (like P above) that it actually can prove (the proof above that it cannot be 100% confident in P).

  5. (3 min) Common misconceptions and cutting them off:
     - Misconception 1: "Gödel kills all AI." 
          - Not at all. The obstacle doesn't say we can't have AI. It says we can't have an agent that fully trusts its own reasoning without the possibility of being wrong. In fact, we can build agents that are less than 100% confident in their own reasoning, and that's okay.
     - Misconception 2: "It's just recursion, and we can fix it with more levels or scale."
          - The problem is fundamental. Even if you add levels (like a meta-bot that models the bot) the same issue arises at the meta-level. Scale doesn't make the problem go away because the self-reference is inherent in the agent's ability to model itself.
     - Misconception 3: "So we can never have self-improving AI?"
          - We can, but we have to avoid the 100% self-trust. The agent must allow for the possibility that its own reasoning might be flawed, and build in mechanisms for updating when it finds errors.

  6. (2 min) Check for understanding:
     - Ask: "Why can't the forecasting bot start with 100% confidence in its own predictions and then update only when it sees an error?"
          - Expected answer: Because if it starts with 100% confidence, then it must believe that everything it predicts is true. But then we can construct a self-referential prediction (like the one above) that would force the bot to be wrong, leading to a contradiction. Therefore, it cannot consistently maintain 100% self-trust.

     - Ask: "What is the key takeaway about building self-reflective AI systems?"
          - Expected answer: They must have some degree of self-doubt. They cannot assign absolute certainty to their own reasoning without risking inconsistency.

  What formal machinery to avoid but summarize in one line?
     - Gödel's incompleteness theorems: "In any sufficiently powerful formal system, there are statements that are true but unprovable within the system, and the system cannot prove its own consistency."
     - Löb's theorem: "If a system can prove that 'if it can prove P then P is true', then it can prove P."

  Tighter analogy than the forecasting bot?
     - Instead of a forecasting bot, use a "proof checker" that is also able to generate proofs. The system is designed to trust any proof that it checks and accepts. But then, can it trust itself? 
          - Consider a proof that says: "If the proof checker accepts this very proof, then 0=1." 
          - If the proof checker accepts the proof, then it must be that if the proof is accepted then 0=1. But since it is accepted, then 0=1. That's a contradiction.
          - Therefore, the proof checker cannot accept that proof. But note, the proof might be structured so that it is valid only if the system is consistent. Then the system cannot prove its own consistency.

     - This is essentially the same as the bot, but it might be more direct. However, the forecasting bot is more accessible because it's about confidence and updating, which is more concrete than proof theory.

     - I think the forecasting bot is fine, but we must avoid getting into the details of how the bot updates (like gradient descent). We are only concerned with the logical structure of self-trust.

  Revised plan with the proof checker analogy if we have time? But we have only 20 minutes, so stick with the bot.

  Final Teaching Sequence:

  1. Motivate with self-improving AI and the need for self-trust (2 min).
  2. Introduce the forecasting bot that updates its confidence (3 min).
  3. Construct a self-referential prediction that leads to a paradox (5 min).
  4. Explain the general obstacle: You cannot have 100% self-trust without contradiction, using the reasoning from Löb's theorem in simple terms (5 min).
  5. Address misconceptions (3 min).
  6. Check understanding with questions (2 min).

  Total: 20 minutes.

  Note: Keep it interactive. Ask questions to the group to engage them. For example, when setting up the self-referential prediction, ask: "What happens if the bot predicts that its next prediction is wrong with 100% confidence?" and let them see the paradox.
answer: |-
  ### Teaching Plan: Löbian Obstacle in 20 Minutes  
  **Goal:** Students grasp why a self-modeling rational system can't assign 100% confidence to its own reasoning without contradiction. Avoid logic jargon; focus on intuition and inevitability.  

  ---

  #### **Step 1: Hook with Forecasting Bot (3 min)**  
  - **Analogy:** Introduce a *forecasting bot* that predicts events (e.g., "Will it rain tomorrow?") and updates its confidence based on past accuracy.  
    - *Example:* Bot predicts rain with 90% confidence → It rains → Confidence increases slightly.  
  - **Key setup:** The bot can model its own reasoning. It asks: *"Should I trust my own predictions 100%?"*  

  > **Why this works:** Concrete, relatable, avoids logic symbols. Cut off discussions about gradient descent by saying: *"We're only focusing on logical consistency, not learning algorithms."*  

  ---

  #### **Step 2: Set Up Self-Reference Trap (5 min)**  
  - **Challenge the bot:** Ask students: *"What if the bot predicts something about its own accuracy?"*  
    - *Example prediction:* The bot says: **"The next prediction I make will be wrong."**  
      - With 100% confidence, this creates a paradox:  
        - If correct → next prediction is wrong → but *this* is the next prediction → contradiction.  
        - If wrong → next prediction is correct → but it claimed the next would be wrong → contradiction.  
  - **Key insight:** Self-reference breaks 100% trust. *"The bot can't consistently claim infallibility."*  

  > **Address misconception:** *"This isn't about recursion depth. Even with unlimited resources, the problem persists."*  

  ---

  #### **Step 3: Löb’s Theorem Simplified (5 min)**  
  - **Reframe the paradox:** *"Löb’s Theorem says: If a system proves 'if I prove P, then P is true,' it must prove P."*  
    - **Translation for bots:** *"If the bot is 100% confident that 'when I’m 100% confident, I’m always right,' then it must be 100% confident about everything it believes."*  
  - **Contradiction:** What if the bot is 100% confident in a false claim (e.g., "0=1")?  
    - *Impossible!* → So it can’t start with 100% self-trust.  
  - **Visual aid:**  
    ```  
    Assumption: "I always predict correctly."  
    → If I predict P, P must be true.  
    → But P could be "I predict 0=1" → disaster.  
    ```  

  > **Formal machinery to skip (one-liner):**  
  > - *Gödel’s incompleteness:* "Systems can’t prove their own consistency."  
  > - *Peano Arithmetic:* "Basic math rules where this applies."  

  ---

  #### **Step 4: Crush Misconceptions (4 min)**  
  Address these as they arise:  
  1. **"Gödel kills all AI!"** → *"No, it just kills 100% self-trust. Real AI uses probabilistic self-doubt."*  
  2. **"Recursion is the issue."** → *"Recursion is fine—Löb’s obstacle hits even with perfect self-reflection."*  
  3. **"Scale fixes this!"** → *"Bigger models still can’t escape the paradox—it’s about logic, not compute."*  

  > **Cut-off point:** If students dive into technicalities, say: *"We’re building intuition—see me after for papers!"*  

  ---

  #### **Step 5: Why This Matters + Check (3 min)**  
  - **Takeaway:** Rational agents need self-doubt. *"You can’t be a perfect self-expert without risking lies or loops."*  
  - **Real-world link:** Forecasting bots (e.g., stock markets) use confidence intervals, not 100% claims.  

  **Check for understanding (not parroting):**  
  - *Question:* "Your bot says, ‘I trust myself completely.’ How would you break it?"  
    - **Target answer:** Force it to predict a self-fulfilling error (e.g., *"My next prediction is wrong"*).  
  - *Question:* "Why can’t we ‘patch’ this with clever code?"  
    - **Target answer:** The contradiction is unavoidable with self-reference and 100% trust.  

  ---

  #### **Why Forecasting Bot Works (And What to Avoid)**  
  - **Strengths:** Intuitive, separates trust from performance.  
  - **Pitfall:** Don’t discuss weight updates. Say: *"Assume the bot magically knows accuracy—we care about logic, not training."*  
  - **Tighter analogy?** Use a *self-repairing robot*:  
    - *"A robot that fixes its own code. If it’s 100% sure its repairs always work, you can give it a task that forces a self-destructive 'fix.'"*  

  ---

  #### **Timing Buffer**  
  - If behind: Skip deep dives into Gödel.  
  - If ahead: Discuss how real AI (e.g., Bayesian agents) uses <100% self-trust.  

  **End goal:** Students see the Löbian obstacle as a **structural flaw in self-certification**, not a limit of AI or logic.
