prompt: |-
  Got a 20-min slot in a reading group of CS grad students with zero logic background. I want to walk them through the Löbian obstacle to self-trusting agents - specifically why a rational system that can model its own reasoning can't assign full credibility to that reasoning without running into contradiction.

  Need the teaching plan, not the lecture: the order the pieces have to come in so the self-reference feels inevitable, the carrying example (I'm thinking of a forecasting bot that updates its own confidence weights from past predictions - tell me if that's broken), the misconceptions theyl drag in (Gödel kills all AI? it's just recursion? scale solves it?), where to cut each one off in the sequence, and the end-of-session check that shows they understand the obstacle rather than just parroting Gödel said no.

