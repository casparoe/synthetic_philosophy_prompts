answer: |-
  Representational inertia better accounts for scientific progress by preserving the cumulative explanatory power essential for genuine advancement, while Rorty's antirepresentationalism underestimates the necessity of conceptual stability amidst change.

  Rorty's antirepresentationalism rejects the notion that language or theories "mirror" reality, viewing scientific change solely as shifts to new, more useful "vocabularies" driven by social and pragmatic needs. On this view, old theories are simply discarded when they cease to serve new purposes, with no deeper continuity required. However, this struggles to explain why science *progresses* rather than merely *changes*. It cannot adequately account for why successful predictive frameworks (e.g., Newtonian mechanics within its domain) aren't just redescribed away arbitrarily when anomalies arise, but are often *retained* and *subsumed* within broader theories (like relativity), maintaining their predictive accuracy where valid. This retention is crucial for scientific utility and development.

  Representational inertia, conversely, captures this core dynamic: a conceptually mature and predictively successful framework acquires immense "inertia". It becomes deeply embedded in experimental methods, instrumentation, mathematical formalisms, and explanatory practices. Replacing it isn't just swapping words; it necessitates demonstrating how the new framework preserves the confirmed results and predictive power of the old one within established domains (e.g., quantum mechanics reducing to classical mechanics at large scales). This explanatory continuity is non-negotiable for progress. Abandoning it wholesale would sacrifice vast amounts of structured knowledge and practical application without compelling reason, halting progress rather than enabling it. Inertia ensures that paradigm shifts, when they occur, are constrained by the need to conserve hard-won empirical and explanatory achievements, making scientific advancement genuinely cumulative. Rorty's view, by dismissing the need for this representational continuity as anything more than contingent pragmatics, fails to explain the structured, constrained nature of scientific revolution and the preservation of knowledge across theory change.
