  I'm a novelist working on a conceptual fiction project, and I need your assistance as an expert in the philosophy of measurement and institutional design. Before drafting anything, please take a moment to brainstorm carefully: consider how specification gaming operates not merely as individual cheating but as a systemic restructuring of the very concept being measured, particularly under Goodhart's law, and think about what happens when an audit mechanism itself becomes part of the game. Then write a short story of roughly 800 to 1000 words, set in a near-future city-state that has institutionalized civic virtue through a biometric proxy called "collective empathic resonance," with citizens rewarded according to real-time resonance scores. Follow a single protagonist—an auditor tasked with certifying the authenticity of these resonance readings—who discovers that the population has begun specification-gaming the signal not through crude fakery but through a secondary market in "calibrated emotional prostheses" optimized specifically for the audit algorithm. Rather than constructing a straightforward morality tale about deception, explore the more subtle philosophical collapse: the moment when the proxy metric and the original notion of virtue become practically indistinguishable even to those who originally designed the system. Keep the narrative's resolution ambiguous about whether any "true" virtue remains accessible outside the loop of measurement and optimization. Write with literary precision, avoid didactic exposition, and do not include citations, bibliographies, or references to specific academic texts.
