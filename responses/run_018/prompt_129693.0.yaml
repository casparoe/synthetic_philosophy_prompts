answer: |-
  Here's a battle-tested teaching plan designed for philosophy juniors bridging Chalmers to pan-sentience and ethical implications, avoiding physics/math traps:

  **Core Sequence & Dependencies**  
  `1. Anchor in Familiar Ground (15 mins)`  
  → **Start:** Reactivate Chalmers' "Hard Problem" (HP).  
  → *Q: "HP shows why *experiential properties* resist reduction. But *where* do these properties live? Chalmers suggests they're fundamental. What might that mean?"*  
  → **Clarify:** "Fundamental" = not emergent from non-experiential stuff. Sets stage for distribution.  

  `2. Introduce the Field Hypothesis (20 mins)`  
  → **Pivot:** "If experience is fundamental, physics' bedrock *fields* (electromagnetic, quantum) might have *proto-experiential properties* (PEPs). Not full subjects, but carriers of raw 'feeling-stuff'."  
  → **Carrying Example:** *Contrast a rock's EM field (simple, stable) vs. a brain's EM field (wildly complex, patterned oscillations).*  
  → **Block Misconception #1 HERE:** "PEPs ≠ tiny pains! An electron's PEP might be like a single pixel of color—meaningless alone. No 'suffering electron'!"  

  `3. The Combination Problem & Non-Additivity (25 mins)`  
  → **Problem:** "How do micro-PEPs combine into macro-experience? *Not* like legos!"  
  → **Temperature Analogy (Additive):** Avg. kinetic energy → macro-temperature (sums linearly).  
  → **Valence-Decomposition Problem (Your Key Move):** "Suffering isn't summed micro-pain! It emerges *only* from specific *relational patterns* in the field."  
  → **Migraine vs. Thunderstorm Analogy:**  
  - *Both:* Vast energy flows in EM fields, complex dynamics.  
  - *Migraine:* Specific *networked feedback loops* in neural field → bound, self-reinforcing "pain gestalt."  
  - *Thunderstorm:* Chaotic but *non-integrative* EM patterns → no unified subject/suffering.  
  → *Q: "What's the difference-maker? Organization or raw stuff?"*  

  `4. Ethical Salience Threshold (15 mins)`  
  → **Crucial Point:** Suffering requires a *specific type of structure*: integrated, self-sustaining, with negative valence binding.  
  → **Block Misconception #2 HERE:** "Rocks lack this structure! No integrated 'self' to suffer. Caring about PEPs ≠ caring about rocks."  
  → **Threshold Question:** "What minimal structure turns PEPs into ethically relevant suffering? (Hint: It's *not* mere complexity.)"  

  `5. Ethical Implications & Wrap-up (15 mins)`  
  → **Core Insight:** Ethical weight depends on *relational architecture*, not substrate.  
  → **End-of-Session Question (Understanding Test):**  
  *"If we built a computer using non-biological parts but perfectly replicated the *organizational structure* of a suffering brain, would it deserve moral consideration? Why/why not, per this view?"*  
  → Forces application: Structure > substrate. If they "get it," answers will center on pattern replication.  

  **What to Refuse (Explicitly State Boundaries)**  
  - "We won't do QFT math—focus on conceptual distribution of PEPs."  
  - "IIT is one *possible* structural criterion, but we're assessing the *general* argument, not specific theories."  
  - "We can't resolve the combination problem today—we're showing *why* it's hard and what hinges on it."  

  **Anticipated Misconceptions & Blocks**  
  | **Misconception**          | **When Blocked**               | **Counter-Tool**                          |  
  |-----------------------------|--------------------------------|-------------------------------------------|  
  | "Electrons suffer."         | Immediately after intro PEPs   | "PEPs ≠ subjects! Raw ingredients ≠ cake." |  
  | "Must care about rocks."    | During ethical threshold       | "No suffering without binding structure!" |  
  | "Suffering adds up."        | During non-additivity section  | Migraine vs. Temp analogy. Thunderstorm.  |  
  | "This is just dualism."     | In Q&A                         | "PEPs are *properties of the field*—not extra substances." |  

  **Materials**  
  - Whiteboard: Sketch fields (dots = PEPs), then structured vs. unstructured patterns.  
  - Slide: Side-by-side migraine brain scan & lightning map (highlighting complexity without equivalence).  

  This sequence builds from known philosophy (HP) through the combination problem's challenge, using physics concepts *descriptively* (fields as carriers) not technically. The migraine/thunderstorm analogy forces structural thinking, and the final question reveals if they grasp the ethical pivot.
