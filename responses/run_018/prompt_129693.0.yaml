  I'm running a seminar for philosophy juniors theyve read Chalmers but never took physics. Next week I want to walk them through pan-sentience in fundamental physics — specifically the idea that if proto-experiential properties are distributed in physical fields, then suffering isn't a brain-level thing but depends on a non-additive organizational pattern, what I call the valence-decomposition problem: macro-suffering doesn't sum up from micro-suffering like temperature from kinetic energy, but emerges from a specific relational structure among fundamental subjects. I need the teaching plan, not the lecture. What's the right dependancy chain — do I start with the hard problem, the combination problem, or the basic physics of fields? What's the carrying example — I'm leaning toward comparing a migraine to a thunderstorm, both being complex physical processes with proto-experiential parts, but only one involving the organizational pattern that makes suffering ethically salient? Which misconceptions will they form — probably that every electron is in pain, or that this view forces us to care about rocks — and exactly where in the sequence should I block each? What's one end-of-session question that shows they've actually understood the ethical implication and not just been wierded out? And what should I openly refuse to explain — I assume quantum field math and integrated information theory are off the table?
