prompt: |-
  I've been taking this course on knowledge and belief, and me and my freind got into an argument about pragmatic encroachment — or maybe contextualism? She read a summary somewhere and explained it like this: "The core idea is that knowing something isn't just about having true belief with good evidence; practical stakes shift the evidential threshold you need. If you're deciding whether to deposit your paycheck, you need stronger proof the bank is open Saturday than if you're just killing time chatting about weekend plans. So it's basicaly the same thing as epistemic contextualism, where 'knows' just picks out different standards depending on who's asking and what's on the line. They use those bank cases to show knowledge isn't a stable mental state — it's more like a social permission slip that gets revoked when risk goes up. And actually, once you accept this, it means two people with identical evidence but different risk tolerances can rationaly hold opposite beliefs about the same claim, which collapses pragmatic encroachment into subjective Bayesian updating with no real normative bite."

  That sounds partly right but also like it's smushing a few things together, especially the part about contextualism being identical and the Bayesian collapse thing. Is this summary fair? Can you separate what's actually accurate, what's a simplification that helps, and what's a straight-up distortion? I want to understand where the roommate's summary is useful versus where it misleads, and whether the conclusion about Bayesian collapse survives if you fix the errors.

  Please structure your answer like this:
  1. Quick verdict (2-3 sentences)
  2. What's accurate in her summary (around 150 words)
  3. Where it slips — misrepresentations and conflations (around 200 words)
  4. How a defender of pragmatic encroachment would respond (around 150 words)
  5. Bottom line for understanding the view (around 100 words)
