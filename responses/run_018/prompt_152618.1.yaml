answer: |-
  ### 1. Quick Verdict
  Your friend captures core motivations and examples of pragmatic encroachment (PE) accurately but seriously conflates it with contextualism and misrepresents its relationship to Bayesianism. The summary is useful for illustrating *why* PE arose but distorts *what it is* and falsely suggests it dissolves into subjectivism. The "Bayesian collapse" conclusion does not survive correction.

  ### 2. What's Accurate
  She correctly identifies PE's core anti-intellectualist thesis: practical stakes (like the cost of being wrong) can raise the *evidential threshold* required for a true belief to count as knowledge. The bank case (depositing paycheck vs. idle chat) is indeed a standard illustration: higher stakes demand stronger evidence for the *same proposition* ("The bank is open Saturday"). She's also right that PE challenges the idea of knowledge as a purely "stable mental state" independent of context, emphasizing that whether an agent "knows" can depend on their practical situation. The observation that identical evidence might support knowledge for a low-stakes agent but not a high-stakes one is central to PE arguments.

  ### 3. Where it Slips — Misrepresentations and Conflations
  *   **Conflating PE with Contextualism:** This is the major error. Contextualism claims the *semantic meaning* of "knows" *itself* shifts depending on the *attributor's* context/conversational standards. "S knows P" can be true when uttered in a low-stakes context but false when uttered in a high-stakes context, even if S's evidence and situation are unchanged. PE, however, claims the *epistemic status* of S's belief itself changes based on S's *own* practical stakes. For PE, whether S *possesses* knowledge depends on S's situation, not just how others use the word "knows". They are distinct solutions to similar puzzles.
  *   **Mischaracterizing Knowledge:** Calling it merely a "social permission slip" oversimplifies and risks distortion. PE defenders argue stakes affect a genuinely *epistemic* condition (justification/warrant), not just social norms. It's about what it takes to *be* justified, not just what we *say*.
  *   **The "Bayesian Collapse" Misstep:** The claim that PE collapses into "subjective Bayesian updating with no normative bite" is a significant distortion. While Bayesians model belief updating with priors and likelihoods, PE is fundamentally a *normative* claim about the *standards for knowledge*. Defenders argue stakes impose *objective* demands on the *strength* or *type* of evidence required. Crucially, PE doesn't say two agents with identical evidence *can rationally hold opposite beliefs*. It says the *same belief* held by both *fails to be knowledge* for the high-stakes agent *even if true and held rationally*, because their evidence doesn't meet the higher threshold *demanded by their practical situation*. This retains normative force: the high-stakes agent *should* seek more evidence before acting, and acting on the belief without it is epistemically (and practically) irresponsible.

  ### 4. How a Defender of Pragmatic Encroachment Would Respond
  A PE defender (e.g., Fantl & McGrath, Stanley) would insist stakes are *constitutive* of the epistemic standard S must meet for knowledge, not merely influencing subjective confidence. They'd reject the conflation with contextualism, emphasizing that the change occurs in the *subject's* epistemic condition, not just the word's meaning. Regarding Bayesianism, they'd argue PE imposes *external normative constraints* on justification that subjective Bayesian updating alone lacks. The high-stakes agent isn't just *less confident*; their evidence is *objectively insufficient* for knowledge *given what's at stake for them*, creating a genuine epistemic obligation to gather more evidence or withhold belief/action. PE doesn't make justification purely subjective; it argues the objective threshold for justification *varies* with practical context.

  ### 5. Bottom Line for Understanding the View
  Pragmatic Encruachment argues that **whether a true, rationally held belief counts as knowledge depends not only on traditional epistemic factors (evidence, reliability) but also on the practical stakes facing the believer.** Higher stakes raise the evidential threshold required for justification/knowledge. This makes knowledge "situated" but *not* merely subjective or semantic. It's distinct from contextualism (which focuses on word meaning) and maintains normative force by claiming practical circumstances impose objective demands on the strength of evidence needed to responsibly act on a belief as knowledge.
