prompt: |-
  I am designing a single ninety-minute session for philosophy undergraduates who know Gödel's incompleteness results only by reputation and have just completed an introductory unit on modal logic. I want to teach them a reconstructed version of Gödel's rationalist position on personal survival after death—treating it not as religious consolation but as a logical consequence of combining his modal-ontological argument for a necessary being with a Leibnizian account of individual essences, according to which the properties that constitute a thinking subject are essential and therefore not vulnerable to the contingent physical event of bodily death.

  Plan the explanatory architecture for me, not the explanation itself: the precise sequence in which the conceptual layers must be laid down and the dependency relations that make any other order fail; the one concrete analogy or scenario that should carry the entire session—something that makes intelligible why the destruction of a contingent substrate does not amount to the destruction of a formally complete essence, but that is not the familiar software-running-on-hardware image, which I want to avoid because it smuggles in functionalist assumptions; the predictable misconceptions—specifically, the slide into Cartesian substance dualism, the assumption that this is an empirically unfalsifiable hope rather than a metaphysical claim, and the erroneous recruitment of the incompleteness theorems as premises—and exactly where in the sequence each one should be intercepted; the check at the end that distinguishes students who have grasped the modal structure of the argument (that survival is a matter of logical consistency rather than spiritual persistence) from those who have only absorbed a vague reassurance; and what I should openly bracket as beyond this session—such as detailed exegesis of Gödel's unpublished philosophical manuscripts, neuroscience of consciousness, or comparative theology—and how to frame that bracketing so it reads as intellectual discipline rather than evasion.

  The audience will be skeptical of metaphysics and prone to reduce any afterlife claim to psychology; keep the plan focused on the dependency structure and the misconception map.
reasoning: |-
  Okay, the user is designing a single 90-minute philosophy session for undergrads who've just finished an intro to modal logic and know Gödel's incompleteness results by name only. The goal is to present Gödel's rationalist argument for personal survival after death as a logical consequence of combining his modal ontological argument with Leibnizian individual essences. 

  First, I need to unpack the user's key constraints: avoiding functionalist analogies like software/hardware, intercepting specific misconceptions (Cartesian dualism, empirical unfalsifiability, misuse of incompleteness theorems), and designing a diagnostic check for true understanding. The students are metaphysics-skeptical and likely to psychologize the argument, so structural rigor is paramount.

  Hmm... the core challenge is sequencing. The argument has three interdependent pillars: (1) Gödel's necessary being proof, (2) Leibnizian essentialism about thinkers, and (3) the modal inference from essence to survival. Any misordering could collapse the logic. For example, if we discuss survival before establishing essences as non-contingent, students will default to substance dualism. 

  For the analogy... since hardware/software is banned, what about mathematical objects? A specific curve's essence (say, a fractal formula) isn't destroyed if we erase one particular drawing of it. This avoids functionalism while illustrating essence/substrate distinction. But is it concrete enough? Maybe pair it with the "lost symphony" scenario - the composition's essence persists even if all copies are burned. 

  Biggest landmines: 
  - When introducing individual essences, students might confuse them with Cartesian souls. Need to explicitly contrast Leibniz's relational bundles vs substance. 
  - During the survival inference, someone will call it "wishful thinking." Preempt by bracketing empirical questions early: "We're examining logical coherence, not biology." 
  - Incompleteness theorems will tempt them. Must declare upfront: "These appear nowhere in today's argument. We're using modal operators, not metamathematics." 

  The diagnostic check... perhaps a timed exercise: "If bodily death is contingent but your thinking-essence is necessary, why doesn't that imply multiple afterlives?" Correct answers should reference essences as unique instantiations. Vague responses will mention "souls persisting." 

  Lastly, bracketing: Frame exclusions (neuroscience, theology) as necessary for analytical precision. Say: "Today's scope is the modal scaffolding. Debating qualia requires different tools." That positions it as focus, not cowardice. 

  *adjusts mental model* The user clearly values precision over persuasion. Every minute must reinforce dependency: Ontological argument → Essences as necessary → Survival as consistency. No detours.
answer: |-
  Here’s a precise explanatory architecture focused on conceptual dependencies, misconception interception, and structural integrity for your 90-minute session:

  ---

  ### **Explanatory Sequence & Dependency Map**
  *(Each step depends on the prior; reversing order causes collapse)*

  1.  **Groundwork: Leibnizian Individual Essences (20 min)**
      *   *Content:* Introduce "individual essence" as the complete set of *essential* properties defining a unique thinking subject. Emphasize: **Leibnizian Bundle Theory** (a subject *is* its essential properties; no "soul substance"). Properties include necessary relational/intentional facts (e.g., "being the thinker of thought X at time T").
      *   *Key Move:* Distinguish essence (necessary, definitional) from accidental/contingent properties (e.g., physical location, current bodily state).
      *   *Dependency:* Foundation for the entire argument. Must precede ontology/survival.

  2.  **Gödel's Modal-Ontological Argument (Simplified Core) (25 min)**
      *   *Content:* Reconstruct the argument for a *necessary being* (NB) using S5 modal logic. Focus on steps: (a) Definition of God-like being (positive properties), (b) Necessity of existence as a positive property, (c) Possibility entails necessity. **Crucial Link:** NB's existence isn't contingent on any physical substrate.
      *   *Key Move:* Highlight **modal necessity ≠ physical indestructibility**. NB exists in all possible worlds *by definition*.
      *   *Dependency:* Requires prior acceptance of modal reasoning. Provides the framework for applying necessity to essences.

  3.  **Synthesis: Essences as Necessary (15 min)**
      *   *Content:* Argue that *if* individual thinking essences are possible (which we presuppose, as we exist), and *if* their existence is grounded in/aspects of the Necessary Being (e.g., as ideas in the divine intellect or metaphysically dependent entities), **then these essences themselves inherit a kind of necessity**. They are complete, consistent, non-contingent logical objects.
      *   *Key Move:* **The NB anchors essences**. An essence's existence isn't contingent on its *instantiation* in a specific physical world; its *consistency* suffices for its possibility/necessity within the framework anchored by NB.
      *   *Dependency:* Relies on Steps 1 (essences exist) and 2 (NB grounds possibility/necessity).

  4.  **Survival as Modal Consistency (15 min)**
      *   *Content:* Bodily death = destruction of a *contingent substrate* for instantiating the essence. Since the essence is necessary (Step 3), its destruction is **logically impossible**. "Survival" = the continued *logical/metaphysical possibility* (and thus, given NB, *actuality* in some world) of the essence. Death is irrelevant to the essence's formal reality.
      *   *Key Move:* **Survival ≠ persistence in time or space.** It's the timeless necessity of the essence itself. Avoid "immortality" – frame it as "indestructibility of the defining concept."
      *   *Dependency:* Requires Steps 1-3. Jumping here first invites Cartesian dualism.

  ---

  ### **Core Analogy: "The Lost Mathematical Symphony"**
  *   *Scenario:* Imagine a unique, complex symphony defined solely by its complete musical score (its "essence"). The score exists as an abstract, consistent mathematical/logical object.
  *   *Physical Instance:* An orchestra performs it (contingent instantiation). Later, the concert hall burns down, destroying the instruments and musicians (bodily death).
  *   *Key Point:* **The symphony wasn't *in* the instruments.** The destruction of the physical performance **does not and cannot** destroy the symphony *itself* (the score/essence). The symphony remains a logically coherent, necessary possibility. It *can* be instantiated again elsewhere (in another "world"/orchestra) *because* its essence is intact. **Avoids functionalism:** The score isn't "software" waiting for hardware; it's a complete, abstract object whose reality is independent of performance.
  *   *Use:* Introduce *after* Step 1 (essences), reinforce during Step 4 (survival).

  ---

  ### **Misconception Interception Map**
  1.  **Cartesian Substance Dualism (Intercept: Step 1 & Step 4)**
      *   *When:* During essence definition (Step 1) and survival claim (Step 4).
      *   *How:* Explicitly contrast Leibnizian bundle ("you *are* this set of essential properties") with Cartesian substance ("you *have* an immaterial soul"). Stress: **No ghost in the machine**. Destruction of body is destruction of an *accidental vehicle*, not a *substance* housing the essence. Use the symphony: The music isn't a "thing" inside the instruments.

  2.  **Empirically Unfalsifiable Hope (Intercept: Step 2 & Step 4)**
      *   *When:* During ontological argument (Step 2) and survival conclusion (Step 4).
      *   *How:* Frame the entire session as **metaphysical deduction**, not empirical science. State clearly: "This is a claim about logical possibility and necessity derived from premises about essence and the grounding of existence. It is not testable by biology or physics, nor is it intended as psychological comfort. We are evaluating its *logical coherence*."

  3.  **Misusing Incompleteness Theorems (Intercept: Start & Throughout)**
      *   *When:* **Opening disclaimer** and if mentioned later.
      *   *How:* "A common misconception links Gödel's views on survival to his incompleteness theorems. They play **no role** in today's argument. Today relies solely on modal logic and Leibnizian metaphysics. Incompleteness concerns formal systems; this concerns individual existence and necessity."

  ---

  ### **Grasp Check: Diagnostic Question**
  *   *Pose at End (5 min):* "Could the argument allow for a scenario where: (A) Your bodily death occurs, AND (B) Your individual thinking essence is *logically inconsistent*? Why/Why not?"
  *   *Correct Understanding:* "No. The argument states that the essence is necessary (if possible). Death is contingent and destroys only the instantiation. Logical inconsistency would mean the essence was *never* possible/consistent to begin with (contradicting our existence). Survival here *is* the logical consistency of the essence."
  *   *Vague/Incorrect:* Invoking souls, energy, "consciousness must go somewhere," or empirical uncertainty. Focus on **logical consistency as the criterion**.

  ---

  ### **Bracketing & Framing (State upfront and reinforce)**
  *   **Bracket:**
      *   Exegesis of Gödel's unpublished notes (we use a *reconstruction*).
      *   Neuroscience/consciousness debates (irrelevant to modal-logical structure).
      *   Comparative theology (focus is Gödel's rationalist logic, not religious doctrine).
      *   Detailed defense of the ontological argument's premises (assume for sake of exploring the consequence).
  *   **Framing:** "Today is an exercise in **modal metaphysics and logical consequence**. We bracket other disciplines not to evade them, but to rigorously examine *this specific argument's structure* on its own terms. Our question is: *If* one accepts these premises, does the conclusion *logically follow*? Other debates require different sessions."

  ---

  ### **Why This Sequence Works**
  1.  **Essences First:** Establishes the subject *as* its essential properties (bundle theory), preventing Cartesian misinterpretation later.
  2.  **Ontology Before Survival:** Provides the necessary framework (NB) for grounding the *necessity* of essences, preventing survival from seeming like a brute assertion.
  3.  **Necessity Before Destruction:** Establishes essences as necessary *before* introducing bodily death, so death naturally appears irrelevant to the essence's status.
  4.  **Analogy After Essences:** The symphony makes sense only if essences are understood as abstract "scores."
  5.  **Explicit Bracketing:** Manages expectations and focuses criticism on the argument's internal logic.

  This structure forces engagement with the modal-ontological core while systematically blocking escape routes into psychology or familiar dualisms. The symphony analogy provides a concrete anchor without functionalist baggage.
