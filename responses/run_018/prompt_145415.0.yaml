answer: |-
  Here is a structural and philosophical analysis of the institutional divergence in reproductive policy, grounded in normative frameworks and their tensions:

  **I. Normative Frameworks Underpinning Institutional Designs**
  *   **Libertarian/Autonomy Framework:** Prioritizes individual choice, contractual freedom, and bodily self-ownership. Views restrictions as paternalistic infringements.
  *   **Feminist Relational Ethics Framework:** Emphasizes embodiment, relational autonomy, vulnerability, power dynamics, and the social context of reproduction. Worries about exploitation, commodification, and the erosion of relational bonds.
  *   **Social Solidarity/Harm Reduction Framework:** Focuses on preventing exploitation, protecting vulnerable parties, and maintaining social goods (e.g., non-market values of the body, children's welfare). Views markets in reproduction as potentially corrosive.
  *   **Natural Law/Inalienability Framework:** Asserts certain aspects of personhood (e.g., reproductive capacities, parental bonds) are inherent and cannot be fully alienated or commodified without degrading human dignity.
  *   **Pragmatic/Regulatory Framework:** Seeks workable solutions balancing competing interests (autonomy, safety, child welfare, access) without deep metaphysical commitments, often prioritizing clear legal certainty.

  **II. Philosophical Commitments Presupposed by the Divergence**

  *   **European Model (Altruism/State-Mediated Gift):**
      *   **Body:** Reproductive capacities are *not* standard commodities; their value transcends market logic. They may be viewed as *inalienable* (integral to personhood) or at least *not fungible* (not interchangeable with money without loss of meaning/harm).
      *   **Labor:** Gestation is *not* merely labor; it is a profound embodied, relational, and potentially identity-forming process. Framing it as altruistic labor/gift avoids commodification and protects the gestational carrier's fundamental bond.
      *   **Contract:** Parenthood cannot be *pre-determined* by contract; the gestational bond creates a foundational claim that must be voluntarily relinquished *after birth* (via adoption). Contracts facilitating surrogacy are unenforceable regarding parenthood.
      *   **Parenthood:** Based primarily on *gestation and birth* ("mater semper certa est"), viewing this as a biological/social reality creating an initial bond. Genetic contribution/intent is secondary and requires formal transfer. The state acts as a gatekeeper via adoption to ensure voluntariness post-birth.

  *   **American Model (Commercial/Contractual):**
      *   **Body:** Reproductive materials (eggs) and gestational services *can* be commodified and contracted. Bodily self-ownership justifies market exchange. Donor characteristics (intelligence, looks) are seen as value-adding traits.
      *   **Labor:** Gestation *is* a form of labor (often "service provision"), distinct from genetic contribution or social parenting. Compensation is justified as wages for this work. The labor analogy helps sever the gestational carrier's claim to parental rights.
      *   **Contract:** Binding contracts are central and enforceable. They define parties' obligations *pre-conception* and allow pre-birth orders, making genetic contribution or contractual intent the *primary* basis for legal parenthood, superseding gestation at birth.
      *   **Parenthood:** Primarily defined by *genetic contribution* (for egg/sperm) and/or *pre-conception intent/contract*. The gestational carrier is legally constructed as a "vessel" without presumptive parental rights, facilitating a smooth transfer to intended parents at birth.

  **III. Coherence of the European Model: Value Theory & Justification**
  The European model's coherence rests on viewing reproductive capacities and gestation as possessing **non-market value**. This *need not* require a strict metaphysical commitment to inalienability, though that view fits well. It can be justified primarily on:
  1.  **Harm Reduction/Anti-Exploitation:** Fears that markets inherently exploit vulnerable women (especially economically disadvantaged ones) and create undue inducement, commodify children, and risk coercion. Banning payment is seen as a prophylactic rule.
  2.  **Protecting Relational Goods:** Preventing the instrumentalization of profound biological and social relationships (mother-child bond formed through gestation, the meaning of procreation as a gift). The adoption process affirms the gravity of severing this bond.
  3.  **Preserving Social Values:** Preventing the normalization of treating bodies and reproduction as commodities, seen as eroding social solidarity and respect for human dignity.
  4.  **Child Welfare Uncertainty:** A precautionary stance regarding potential psychological harms to children from commodified origins or complex legal battles.
  *   **Key:** While inalienability provides a strong philosophical anchor, the model can function coherently based *primarily* on empirical/predictive claims about harm and exploitation, coupled with a commitment to protecting specific relational goods, without requiring everyone to accept a deep metaphysical view of the body.

  **IV. Consistency of the American Model: Gestation as Labor**
  Treating gestation as contracted labor *does not* necessarily commit the model to treating *all* embodied care work the same way. Distinguishing features potentially justifying differential treatment:
  1.  **Intentional Severability:** The explicit, pre-conception contractual intent is to separate gestation from social parenting/genetic contribution. This intent is the core of the arrangement.
  2.  **Temporal Limitation & Non-Relational Goal:** Gestational labor is finite, aimed at producing a specific outcome (a healthy baby for the parents), unlike open-ended care work (e.g., parenting, nursing) inherently defined by an ongoing relationship.
  3.  **Genetic/Intentional Primacy:** Parental rights are vested in the genetic contributors/intended parents *before* gestation begins. The GC is contracted *by* them, analogous to specialized service providers hired for a specific biological task.
  4.  **Biological Uniqueness:** Gestation involves a unique biological process (pregnancy) unlike other care work, potentially justifying unique legal constructs.
  *   **Tension:** Critics argue this distinction is artificial. If gestation's relational and embodied nature is acknowledged (e.g., hormonal bonding, health risks), refusing *any* default parental claim based on that labor while other intimate/embodied labor (e.g., wet-nursing historically) may create relational bonds, appears inconsistent *if* relational bonds are the basis for parental rights elsewhere. The model relies heavily on the *contract* superseding any relational claim arising from gestation.

  **V. Philosophical Underdetermination**
  Both practices are **philosophically underdetermined**; different frameworks can justify either model with adjustments:
  *   **Liberal Autonomy:** Can support the **US model** (self-ownership, freedom of contract) *or* the **EU model** if autonomy is seen as requiring protection from exploitative offers/pressures (vulnerability argument) or if commodification is seen as undermining autonomy (Kantian/Market-Inalienability view). Autonomy alone doesn't dictate which risks (market coercion vs. state paternalism) are greater.
  *   **Feminist Relational Ethics:** Can support the **EU model** by emphasizing protection from exploitation and the non-contractual nature of gestational bonds. *Or* it can support a **regulated US model** by emphasizing gestational carriers' agency and right to compensation for their embodied labor/risk, critiquing the EU model as paternalistic and denying women's capacity to consent. The framework yields conflicting priorities (anti-commodification vs. anti-paternalism/agency).
  *   **Market-Libertarian:** Strongly favors the **US model**. Could tolerate a highly regulated, non-commercial **EU altruistic model** only if seen as a minimal infringement on liberty compared to a total ban, but would reject its foundational logic. Cannot coherently support bans on compensation.

  **VI. Structural Changes for the Rival View**

  *   **Implementing the European Model in the US Context:**
      *   **Legal Ontology of Motherhood:** Mandate that the gestational carrier is the *legal mother at birth* in all cases, regardless of genetics or contract. Abolish pre-birth orders.
      *   **Status of Contract:** Render surrogacy contracts unenforceable concerning parental rights and obligations post-birth. Prohibit commercial surrogacy entirely; limit altruistic surrogacy to expense reimbursement. Criminalize brokers profiting from surrogacy arrangements.
      *   **Transfer of Parental Rights:** Require formal post-birth adoption proceedings for intended parents, involving home studies, judicial review, and revocation periods for the gestational carrier. Treat this as a new family formation, not contract fulfillment.
      *   **Egg Donation:** Prohibit compensation beyond documented expenses. Channel all donations through licensed non-profit clinics or state agencies. Eliminate advertising based on donor traits/price differentials; frame donation as a charitable act.
      *   **Role of State Clinics:** Establish state oversight/approval for all ART involving third parties (gametes, gestation). Clinics become gatekeepers ensuring compliance with altruism/non-commercial rules.

  *   **Implementing the American Model in the European Context:**
      *   **Legal Ontology of Motherhood:** Legally decouple gestation from motherhood. Establish pre-birth parentage orders based on genetics (for traditional surrogacy) or contract/intent (for gestational surrogacy) as the default *at birth*. The gestational carrier has *no* presumptive parental rights.
      *   **Status of Contract:** Enforce commercial surrogacy contracts as binding legal instruments, including compensation clauses and the relinquishment of parental rights. Allow private agencies/brokers to operate.
      *   **Transfer of Parental Rights:** Eliminate post-birth adoption requirements for intended parents named in a valid pre-birth order. The birth certificate reflects intended parents immediately.
      *   **Egg Donation:** Permit and regulate a commercial market for eggs, including variable compensation based on donor characteristics. Allow private agencies to recruit, screen, and match donors.
      *   **Role of State Clinics:** Reduce state clinic monopoly. Allow private fertility clinics significant autonomy. State role shifts to enforcing contracts, basic health/safety standards, and fraud prevention, not enforcing non-commodification.

  **Confidence Assessment:**

  *   **Overall Reconstruction of Implicit Theories:** **High Confidence.** The mapping of body/labor/contract/parenthood commitments to the institutional features is well-supported by legal structures, policy debates, and scholarly critiques in both regions. The harm-reduction vs. inalienability distinction for the EU model is analytically sound.
  *   **Least Certain Comparative Claim:** **The consistency of treating gestation as labor without extending it to other care work.** While the distinctions outlined (intent, temporality, contractual primacy) are valid legal and conceptual arguments used *within* the US model, I am less confident that these distinctions hold *philosophically* under close scrutiny from a relational or embodied perspective. The claim that gestation is *fundamentally different* in kind from other intimate embodied labor in a way that *necessarily* justifies the complete absence of default parental rights remains contested and is the point where the US model's philosophical coherence is most vulnerable to challenge, particularly from feminist and care ethics viewpoints. The model relies heavily on the *contract* doing the philosophical heavy lifting to override other potential claims arising from the physical reality of pregnancy.
