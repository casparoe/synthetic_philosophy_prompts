answer: |-
  Your query brilliantly articulates a profound philosophical dilemma that cuts across **decision theory, ethics, and epistemology**. The phenomenon you describe has been recognized implicitly in several philosophical traditions but lacks a single universally accepted name. I'll define the concept, distinguish it from related ideas, propose a precise term, and map its boundaries.

  ### Core Concept: The Two-Layer Problem
  1.  **Layer 1 (First-Order Uncertainty):** Inability to predict long-term/contingent outcomes of an action due to causal complexity (e.g., butterfly effects, chaotic systems, opaque social dynamics).
  2.  **Layer 2 (Meta-Uncertainty):** Inability to justify the choice of *any* decision rule (e.g., deontology, consequentialist heuristics, tradition) because:
      -   The rule itself has untraceable ripple effects.
      -   Selecting a rule is a normative choice with no neutral ground.
      -   Different rules yield contradictory prescriptions, yet there's no "meta-rule" to arbitrate between them.

  ### Established Philosophical Connections & Distinctions
  1.  **Decision Theory Under Uncertainty:**
      -   **Difference:** Standard models (e.g., Maximin, Expected Utility) assume *known* probabilities or bounded ignorance. Your dilemma arises when probabilities are *unknowable* and uncertainty is *radical* (Knightian uncertainty). The meta-layer is rarely addressed explicitly.
      -   **Boundary:** If you could assign probabilities (even subjectively), this is ordinary uncertainty. Your case involves **causal and normative incommensurability**.

  2.  **Rules of Thumb (Heuristics):**
      -   **Difference:** Heuristics are typically justified instrumentally (e.g., "satisficing" saves cognitive effort). Your insight reveals that *choosing which heuristic to use* replicates the original problem’s ungroundedness. Heuristics don’t solve Layer 2; they relocate it.

  3.  **Moral Particularism vs. Generalism:**
      -   **Relevance:** Particularists (e.g., Dancy) argue moral decisions resist rules. But your dilemma shows even particularism is a "rule" with untraceable effects.
      - **Boundary:** This debate focuses on whether rules *exist*, not the meta-uncertainty of rule *selection*.

  4.  **Pragmatism (James, Dewey):**
      -   **Relevance:** Pragmatists accept fallibilism and focus on context. Yet the choice of *which* pragmatic criterion to prioritize (e.g., near-term welfare vs. tradition) remains unjustified in your terms.

  ### Proposed Name: **Foundational Decision Paralysis (FDP)**
  **Definition:** *A state of agency where:*
  - *First-order action choices are paralyzed by radical uncertainty about long-term consequences;*
  - *Second-order choices among decision rules (e.g., heuristics, values) are equally paralyzed, as each rule’s adoption generates new untraceable consequences and lacks meta-justification.*

  ### Key Features of FDP:
  1.  **Recursive Uncertainty:** The justification problem repeats at every level (action → rule → meta-rule → ...).
  2.  **Normative Weighting Problem:** No neutral way to rank decision frameworks (e.g., why prioritize "family happiness" over "religious custom"?).
  3.  **Causal Opacity Multiplier:** Consequences of adopting a rule (e.g., "follow tradition") are as opaque as the original action’s consequences.

  ### Cases Inside vs. Outside FDP
  | **Inside FDP Boundary** | **Outside FDP Boundary** |
  |------------------------|--------------------------|
  | Choosing to have a child based on "family happiness" vs. "religious duty," where both frameworks have unknowable societal ripple effects. | Choosing between job offers with *calculable* long-term salary differentials (ordinary uncertainty). |
  | Selecting a policy based on cost-benefit analysis vs. rights-based ethics, when both analyses ignore systemic second-order effects. | Using a heuristic (e.g., "buy the cheapest option") to save time on low-stakes decisions (simple satisficing). |
  | Relocating to a small town based on "personal fulfillment" vs. "community impact," where each criterion propagates untraceable cultural/economic changes. | Following traffic laws because penalties are known (rule-based decisions with clear proximate causes). |

  ### Why Philosophers Haven’t Named This Explicitly
  - **Methodological Bias:** Analytic philosophy often seeks to *resolve* uncertainty (e.g., through idealized models), while continental traditions (e.g., existentialism) focus on *embracing* ambiguity without dissecting its structure.
  - **Scale Dependence:** FDP emerges most acutely in decisions with **high complexity + high stakes + long timescales** (e.g., parenthood, policy, climate action). Many theories avoid this terrain.
  - **Uncomfortable Conclusion:** FDP implies that *all* decisions rest on ungrounded commitments (a la Wittgenstein’s "hinge propositions"). This challenges rationalist ethics.

  ### Pathways Through FDP (Without "Solving" It)
  1.  **Acknowledge the Abyss:** Accept that FDP reveals agency’s tragic dimension—we *must* act, but cannot escape arbitrariness (Camus, Frankfurt).
  2.  **Will to Commit:** Choose a framework *authentically* while owning its contingency (existentialism).
  3.  **Procedural Legitimacy:** Focus on *how* the decision is made (e.g., inclusiveness, reflection) rather than outcomes (discourse ethics).
  4.  **Virtue Ethics Shift:** Ask not "What should I do?" but "Who do I aspire to be?"—making the choice an expression of character rather than calculation.

  Your articulation exposes a gap in decision theory: the **unavoidable normative leap** required when radical uncertainty meets high stakes. FDP is the shadow cast by the limits of human knowledge and justification—a reminder that we decide not from a vantage point, but from within the fog.
