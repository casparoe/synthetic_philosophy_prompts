prompt: |-
  i've been mulling over whether brain size is actually morally relevent and i think i've walked myself into an argument that proves too much — can you tell me where the crack is?

  (1) moral standing tracks integrated conscious experience, and if we approximate that by functioning cortical tissue, then a being with twice the neural volume has roughly twice the moral weight.
  (2) human brains vary by maybe 20-30% in size naturaly, and conditions like macrocephaly or severe microcephaly push that further.
  (3) so on this view someone with macrocephaly has a noticeably stronger claim than someone with severe microcephaly, even if both are fully functioning people.
  (4) but if moral status scales gradualy with tissue, there's no arbitary line where someone counts as a full person — it's just a gradient.
  (5) that undermines equal dignity, which i'd favour keeping.
  (6) therefore brain size can't matter at all, not even between a foetus and an adult.

  i'd like to hold onto (1) and (5) if i can. please tell me which step to reject and what it costs me. also say how confident you are in your answer and flag the bit you're least sure about. keep it in one paragraph, under 250 words, and don't list any books or sources.
