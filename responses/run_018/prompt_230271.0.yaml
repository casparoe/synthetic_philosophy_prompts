answer: |-
  ### Exam Question  
  **Time Allowed:** 75 minutes  
  **Word Guide:** Aim for 600–800 words.  

  > **Essay Question**  
  > Consider two agents, A and B, each holding credal states about the bias of an unknown coin. Agent A adopts the credal set \( \mathcal{C}_A = [0,1] \) (all possible biases), while Agent B adopts \( \mathcal{C}_B = [0.4, 0.6] \). Both agents base their credal states *only* on the following evidence:  
  > - The coin is manufactured by a process known to produce fair coins 99% of the time, but 1% of coins have fixed but unknown biases.  
  > - No further data (e.g., flip outcomes) is available.  
  >  
  > **Critically evaluate** whether either agent’s credal set is objectively licensed *by the evidence alone*. Your analysis must:  
  > 1. Explain the "arbitrariness relocation" objection to imprecise probabilities.  
  > 2. Distinguish between a credal set representing *what the evidence supports* versus an agent’s *total belief state*.  
  > 3. Assess at least one proposed constraint (e.g., symmetry, convexity, calibration) for determining credal set boundaries and its limitations.  
  > 4. Apply your reasoning to Agents A and B: What can each justifiably claim to "know"?  
  > 5. Conclude: Does the relocation objection undermine imprecise probabilities, or does it merely demand better principles for setting boundaries?  

  ---

  ### Model Answer (600 words)  
  The "arbitrariness relocation" objection contends that replacing a single probability function with a set \(\mathcal{C}\) merely shifts arbitrariness from choosing a precise probability to choosing the *boundaries* of \(\mathcal{C}\). If boundaries lack evidential justification, imprecise probabilities fail to solve the original problem. This essay argues that neither Agent A nor B’s credal set is fully licensed by the evidence, exposing unresolved challenges for imprecise probabilism.  

  **1. Evidence-Support vs. Total Belief State**  
  A credal set representing *what the evidence supports* must contain all probabilities consistent with the evidence; it is a normative standard for rational belief. An agent’s *total belief state* (their adopted \(\mathcal{C}\)) may include subjective additions beyond evidence. The relocation objection arises when boundaries of the latter are mispresented as solely evidence-driven. Here, both agents claim their \(\mathcal{C}\) reflects evidence alone, but we must scrutinise whether boundaries are evidentially compelled.  

  **2. The Coin Case and Arbitrariness**  
  The evidence establishes two objective symmetries:  
  > (i) *Process symmetry*: 99% of coins are fair (bias 0.5), 1% are biased.  
  > (ii) *Bias symmetry*: Biased coins have no tendency toward any bias (no further data).  

  Agent A’s \(\mathcal{C}_A = [0,1]\) reflects bias symmetry by including all biases, but ignores process symmetry: it treats a 100% biased coin as equally supported as a fair coin, contrary to the 99% fairness rate. Agent B’s \(\mathcal{C}_B = [0.4,0.6]\) adheres to process symmetry (centering near 0.5) but arbitrarily restricts biases to \([0.4,0.6]\) without evidence ruling out, say, 0.39 or 0.61. Neither \(\mathcal{C}\) encodes *both* symmetries.  

  **3. Constraints and Limitations**  
  One proposed constraint is **calibration**: \(\mathcal{C}\) should contain all probabilities calibrated to possible frequency data. Given the evidence, the objective chance of bias \(p\) is:  
  \[
  P(\text{bias} = p) = \begin{cases} 
  0.99 & \text{if } p = 0.5 \\
  0.01 \times \text{uniform density} & \text{if } p \neq 0.5 
  \end{cases}
  \]  
  A calibrated \(\mathcal{C}\) must include all \(p\) with non-zero chance density. This excludes \(\mathcal{C}_B\) (which omits, e.g., \(p = 0.7\)) but permits \(\mathcal{C}_A\). However, calibration’s limitation is that it permits overly permissive sets (like \(\mathcal{C}_A\)) that fail to guide decisions. Convexity or symmetry constraints could narrow \(\mathcal{C}\), but symmetry here is underspecified: it demands invariance under bias-relabeling, not a unique interval.  

  **4. What Agents Can Claim**  
  - **Agent A** can claim: "The evidence doesn’t rule out any bias." They cannot claim: "All biases are equally supported" (the 99% fairness rate undermines this).  
  - **Agent B** can claim: "Biases near 0.5 are most plausible." They cannot claim: "Biases outside [0.4,0.6] are evidentially excluded" (the uniform density over biases contradicts this).  
  Both agents misrepresent the evidence: A ignores its weight toward 0.5; B overstates its precision.  

  **5. Verdict on the Objection**  
  The relocation objection **sticks** in this case: neither agent’s boundaries are evidentialy necessary. \(\mathcal{C}_A\) is too weak; \(\mathcal{C}_B\) is arbitrarily strong. However, this does not defeat imprecise probabilism—it shows that boundaries require principled justification beyond "representing ignorance." Credal sets must be constrained by *all* evidence, including symmetries and statistical data. Here, an evidence-supported \(\mathcal{C}\) might be the *convex hull* of biases weighted by their chance (e.g., a bimodal set with 0.99 mass at 0.5 and 0.01 uniform elsewhere), but further principles (e.g., minimax regret) are needed to narrow it for decisions. The objection succeeds in exposing arbitrariness but invites better constraints, not abandonment.  

  ---

  ### Marking Scheme (Total: 20 marks)  
  | **Point** | **Marks** | **Must-Hit Elements** | **Common Errors** |  
  |-----------|-----------|------------------------|-------------------|  
  | **1. Precise statement of relocation objection** | 4 | • Boundaries of \(\mathcal{C}\) may be as arbitrary as a single probability.<br>• Evidential underdetermination persists. | Vaguely describing "subjectivity" without linking to boundary choice. |  
  | **2. Evidence-support vs. total belief state** | 4 | • Evidence-support: normative, evidence-consistent set.<br>• Total belief: may include non-evidential elements.<br>• Bear on objection: Boundaries unjustified if misattributed to evidence. | Conflating the two or treating \(\mathcal{C}\) as purely subjective. |  
  | **3. Constraint on credal set + limits** | 4 | • Names/examples one constraint (calibration, symmetry, etc.).<br>• Explains how it *could* justify boundaries.<br>• Notes a limitation (e.g., calibration permits overly wide sets). | Asserting a constraint solves arbitrariness without critical limits. |  
  | **4. Application to coin case** | 4 | • Agent A: Ignores 99% fairness; cannot claim equiprobability.<br>• Agent B: Arbitrarily excludes biases; overstates evidence.<br>• Neither captures both symmetries. | Ignoring process symmetry (99% fair) or misapplying bias symmetry. |  
  | **5. Reasoned verdict** | 4 | • Objection holds here: boundaries arbitrary.<br>• But imprecise probabilism can respond with better constraints.<br>• Distinguishes "solves arbitrariness" vs. "demands better tools". | Concluding imprecise probabilities are "invalid" without nuance. |  

  **Grade Boundaries:**  
  - 18–20: Exceptional (covers all points with original insight).  
  - 15–17: Excellent (clear on all 5 points).  
  - 12–14: Good (minor gaps in 1–2 points).  
  - 9–11: Pass (superficial treatment of ≥3 points).  
  - <9: Fail (misses core arguments).
