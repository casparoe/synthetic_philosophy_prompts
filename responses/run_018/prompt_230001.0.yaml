  For the demarcation criterion, I'll propose "methodological accountability" as the core standard. This covers testability, evidence handling, peer engagement, and paradigm responsiveness - all crucial for distinguishing pseudohistory from revisionism. The model answer needs to demonstrate this framework consistently across both pseudohistorical cases and the hard case.

  The marking scheme should reward: 1) Clear demarcation criterion definition 2) Application to first pseudohistorical case 3) Application to second case 4) Hard case analysis showing differentiation 5) Overall argument coherence. Common pitfalls to note include conflating evidence with proof, or mistaking all revisionism as pseudohistory.

