  In the model answer, I'll show how Atlantis fails methodological accountability through unfalsifiability and evidence cherry-picking, while Fomenko violates it via ignoring contravening evidence. Then demonstrate how Piri Reis studies maintain accountability despite controversial elements. This creates a clear comparative framework.

