answer: |-
  Your inquiry cuts to the heart of democratic theory's normative foundations. The persistence of the voting paradox across institutional designs does indeed suggest a deeper structural flaw in *any* aggregation system relying *solely* on instrumental rationality and voluntary participation. Here's a breakdown of the issues and potential resolutions:

  ### 1. **The Inescapable Structural Problem**
     - **Pivotality Dilution in Delegation:** Your analysis of delegated proxy voting is astute. While delegation reduces *direct* costs (e.g., time spent researching candidates), it exacerbates the pivotality problem:
       - A proxy holder with *n* delegators has pivotality proportional to *n*, but each delegator's *marginal contribution* to that pivotality is ≈1/*n*.
       - Transitive chains further dilute influence: if A delegates to B who delegates to C, A’s influence on C’s vote is marginal unless A is pivotal in selecting B (itself unlikely).
       - **Result:** Individual rational incentive to delegate (or not) remains negative under pure instrumental logic.
     - **Generalization:** Any system aggregating votes—direct, delegated, or representative—faces the *scaling problem*. As participant numbers grow, individual pivotality shrinks exponentially, while costs (even minimal ones) remain positive. This holds for:
       - Liquid democracy (delegation networks)
       - Representative democracy (selecting representatives)
       - Referenda and direct votes

  ### 2. **Normative Implications: Is Democracy Self-Defeating?**
     If democratic legitimacy requires:
     > *"Authorization by rational agents acting voluntarily to express consent"*  
     then yes, the paradox renders democracy incoherent. Instrumental rationality cannot justify the act of authorization itself. This challenges:
     - **Contractualist Theories** (e.g., Locke): Voting as tacit consent fails if participation is irrational.
     - **Aggregative Democracy**: If votes don't reflect informed, instrumental preferences (due to rational abstention), outcomes lack legitimacy.
     - **Deliberative Democracy**: Rational agents may abstain from discourse if costs outweigh pivotality.

  ### 3. **Escaping the Trap: Non-Instrumental Grounds for Legitimacy**
     The persistence of the paradox across architectures suggests democratic legitimacy *must* rest on non-instrumental foundations:
     - **Expressive Rationality** (Brennan, Lomasky):
       - Voting as an expressive act (e.g., affirming identity, signaling solidarity) provides intrinsic utility independent of outcomes.
       - **Legitimacy Basis:** Democracy as a forum for symbolic expression, not just preference aggregation.
     - **Civic Duty/Ethical Motivation** (Riker, Goodin):
       - Duty transforms voting from a cost to a source of psychic benefit (avoiding guilt, fulfilling role).
       - **Legitimacy Basis:** Authorization stems from citizens' ethical commitment to collective self-rule.
     - **Systemic Legitimacy** (Schumpeter, proceduralists):
       - Legitimacy derives from fair procedures and competition, not individual participation. Low turnout is irrelevant if the *system* allows participation *if* desired.
       - **Weakness:** Glosses over why anyone *should* desire participation.

  ### 4. **Can Voluntary Participation Be Made Instrumentally Rational?**
     Structural fixes face severe limitations:
     - **Marginal Rewards**: Tiny monetary incentives or lottery systems (e.g., "voting vouchers") struggle to offset pivotality deficits at scale.
     - **Social Sanctions/Awards**: Punishing abstention (e.g., compulsory voting) or rewarding participation (e.g., social recognition) *work* but replace voluntarism with coercion or extrinsic motivation.
     - **Reducing Costs**: Digital voting, information subsidies, etc., lower barriers but cannot eliminate pivotality decay. Near-zero costs still outweigh near-zero benefits.
     - **Small-Scale Solutions**: Only in small groups (e.g., committees) does pivotality approach meaningfulness—but modern democracies are not small groups.

  ### 5. **A Path Forward for Democratic Theory**
     Your thesis—that the paradox reveals a foundational flaw—is compelling. Theorists should:
     1. **Abandon Instrumentalism as the Sole Basis for Legitimacy**: Accept that participation requires non-instrumental motivations (duty, expression, identity).
     2. **Reconceive Authorization**: Legitimacy arises not from *individual rational consent* but from:
        - **Inclusive Procedures**: Equal *opportunity* to participate (regardless of uptake).
        - **Systemic Fairness**: Impartial institutions, rotation of power, protection of minorities.
        - **Collective Self-Rule**: The *capacity* of the demos to alter power structures, even if most don’t exercise it daily (cf. Pettit’s neo-republicanism).
     3. **Embrace Hybrid Motivation**: Design systems that leverage expressive/duty-based motives (e.g., civic education, rituals of voting) while minimizing costs.

  ### Conclusion
  The voting paradox is not an artifact of direct democracy but a feature of *all* large-scale voluntary aggregation systems. Delegation mechanisms, while innovative, cannot resolve the core issue: **instrumental rationality alone cannot sustain mass democratic participation.** Rather than a localized puzzle, this reveals that democratic legitimacy must be grounded in:
  - **Non-instrumental motivations** (duty, expression),
  - **Procedural fairness** independent of turnout, and/or
  - **Systemic capacity for collective action**.

  Democracy escapes being "rationally self-defeating" only by rejecting the premise that legitimacy requires *instrumentally rational authorization by all*. Instead, it thrives as a system that enables *meaningful collective agency* when needed, sustained by a mix of ethical commitment and institutional design. Your essay rightly challenges the field to confront this normative vulnerability head-on.

  **Key Sources to Engage:**  
  - Brennan & Lomasky, *Democracy and Decision* (expressive voting)  
  - Downs, *An Economic Theory of Democracy* (original paradox)  
  - Feddersen & Sandroni, "A Theory of Participation in Elections" (ethical voting models)  
  - Pettit, *On the People’s Terms* (systemic legitimacy)  
  - Schaffer, "Why Vote?" (experimental evidence for expressive motives)
