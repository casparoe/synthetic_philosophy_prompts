  Philosophically, if ethics requires strict identity for karma (not just continuity), their view might collapse into reductionism. And if Madhyamaka critiques apply - that even conventional identity reifies - that's troublesome. But many objections can be parried: Vinaya's personhood language fits their conventional level, and synchronic unity might emerge from dynamic skandha interaction.

