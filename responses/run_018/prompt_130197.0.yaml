  So step 3: No -> then step 4.

  4. Psychological distress? We don't have information that the user is avoiding logging in. The report doesn't say. So we assume no? Then output: virtual-only (restitution: restore the sword? But the event is expired, maybe can't. So in-world restitution might be compensation, and sanction for the offender).

  But the user might be upset because of the rarity. However, the procedure would output "virtual-only" because it doesn't meet step 3 and step 4 (if no evidence of platform avoidance).

  But our gut says it's serious. Why? Because the sword has institutional identity and might have taken significant effort to obtain. So the procedure might misfire here. We might need to adjust step 3 to include "high investment" (time or real money) even if not essential? But that would be a judgment call. Alternatively, we could add:

  At step 3, if the object has real-world economic value (or can be converted to real money) then it is non-optional? That might help.

  But the sword from an expired event might not be tradeable for real money. So it still might not qualify.

  This is a limit: the procedure might undervalue items that are rare and hard to get but not essential.

  We must be honest: the procedure might output "virtual-only" for this case, but we might feel it should be serious. Then we might adjust the checklist? Or accept that it's a limit.

  Alternatively, we can add a step between 3 and 4: 

  3b. Does the object have significant investment (time or real money) that cannot be easily recovered?
     - If yes, then treat as real harm? But that might be too broad.

  We are trying to avoid collapsing into "how upset are they", so we don't want to use the investment as a proxy for emotional harm.

  Given the constraints, we'll stick to the original plan.

  Summary of the procedure:

  **Reusable Checklist for Moderation Reports**

  1. **Was the action intentional?**
     - No → Flag for human review (may be accidental, bug, etc.)
     - Yes → Proceed to 2.

  2. **Does the harm involve a virtual object with cross-session institutional identity?** (i.e., the object is uniquely identified by the system and persists across sessions, such as an item in inventory, a building, an avatar)
     - No → Skip to 4.
     - Yes → Proceed to 3.

  3. **Is the virtual object critical to a non-optional dependency?** (i.e., the user cannot reasonably avoid relying on it for core participation in the platform; or it has real-world economic value)
     - Yes → Treat as real harm. Recommend serious sanctions (e.g., account suspension, permanent ban).
     - No → Proceed to 4.

  4. **Is there evidence of persistent psychological distress that significantly impairs the user's ability to use the platform?** (e.g., avoiding logging in, documented harassment pattern)
     - No → Treat as virtual-only. Recommend in-world restitution (e.g., restore item, temporary suspension of offender) and close.
     - Yes → Proceed to 5.

  5. **Is the psychological distress rooted in an unavoidable aspect of the platform?** (i.e., the user could not have reasonably avoided the harm without opting out of core platform features, and platform tools were inadequate or failed)
     - Uncertain → Flag for human review.
     - Yes → Treat as real harm. Serious sanctions.
     - No → Treat as virtual-only. In-world restitution and consider education on platform tools.

  **Application to Cases:**

  Case 1:
  - Step 1: Yes (intentional).
  - Step 2: Yes (sculpture has cross-session identity).
  - Step 3: No (not critical to participation; unless the platform requires having a sculpture to participate, which it doesn't). So proceed to 4.
  - Step 4: Assume the report says they avoid logging in -> Yes. Then step 5.
  - Step 5: We don't know if avoidable. Did the builder have permissions set? If the platform has tools to protect but weren't used, then avoidable -> virtual-only. If the platform lacks tools, then unavoidable -> real harm. Without more info, flag for human.

  Case 2:
  - Step 1: Yes.
  - Step 2: No (no virtual object involved) -> skip to 4.
  - Step 4: Yes (avoids logging in).
  - Step 5: We must judge if avoidable. If the user could have blocked the offender and the blocking works, then avoidable -> virtual-only. If blocking is not effective (e.g., multiple accounts) or the harassment happens in unavoidable spaces, then unavoidable -> real harm. Flag for human if unclear.

