  So:

  1. Intentional? Yes.
  2. Not an object? Then skip to step 4.

  4. Psychological distress? Yes (they avoid logging in).
  5. Unavoidable? 
     - Could the user have blocked the avatar? If blocking is available and effective, then it might be avoidable. But if the harasser creates new accounts (sockpuppets) or the platform doesn't have effective blocking, then it's unavoidable. 
     - Also, if the harassment occurs in common areas that the user must go to (like a hub), then it might be unavoidable.

  This is a judgment call. If the moderator can determine that the platform has effective tools and the user didn't use them, then avoidable -> virtual-only (but we still take action, like warning the offender and maybe temporary ban). If the tools are ineffective, then real harm.

  But without more info, we might hand to human.

  **Case 3: A "rare" virtual sword is destroyed, but its rarity was only due to a now-expired temporary event mechanic.**

