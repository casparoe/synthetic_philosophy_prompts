  - Step 3: No -> then step 4: If they are avoiding logging in, then step 5: if avoidable, then virtual-only; if unavoidable, real harm. But step 5 is a judgment call.

  Given the 40 hours, we might also consider that the time investment makes it non-optional? But that's not in our checklist. So we stick to the checklist.

  For the sake of the procedure, we might have to say that without real money or essential function, it's not non-optional. So we go to step 4 and 5.

  Moderator might end up flagging for human because step 5 is unclear.

  **Case 2: An avatar repeatedly shadows a user through social spaces in a way with no physical analog but makes them avoid logging in.**

  1. Intentional? Yes.
  2. Cross-session institutional identity? The harm is about the avatar's behavior, not an object. So we are not destroying an object. So skip to step 4? (Note: step 2 is about virtual objects. This is about behavior. So step 2 is not applicable -> we go to step 4).

