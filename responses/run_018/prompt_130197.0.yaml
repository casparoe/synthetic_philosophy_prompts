  The checklist is based on two key philosophical perspectives:
  1. Reductionist: "It's just pixels" - virtual objects are not real and harm is only emotional.
  2. Anti-reductionist: Virtual objects can be real if they are embedded in social practices that users cannot opt out of.

  We will operationalize this by focusing on:
  - Cross-session institutional identity: Does the virtual object have an identity that persists beyond a single session and is recognized by the system/institution? (e.g., unique ID, stored in a database, tradable, etc.)
  - Non-optional dependencies: Is the harm violating a dependency that the user could not reasonably avoid? (e.g., essential social spaces, core mechanics that are unavoidable)

  Checklist Steps (ordered questions):

  1. **Was the action intentional?**
     - If no: Stop. Hand to human for judgment (might be accidental, bug, etc.).
     - If yes: Proceed.

  2. **Does the harm involve a virtual object that has cross-session institutional identity?**
     - We define this as: The object is uniquely identifiable by the system (not just by the user) and persists beyond the current session. It must be backed by the system's infrastructure (e.g., stored in a database, has an ID, can be traded, gifted, sold, or is part of a permanent collection). Examples: an avatar, a rare item, a building that is saved and exists for others to see across sessions.
     - If yes: Proceed to step 3.
     - If no: Then the harm is likely only about the current session experience. Proceed to step 4.

  3. **Is the virtual object critical to a non-optional dependency?**
     - Non-optional dependency: The user cannot reasonably avoid relying on this object to participate in core aspects of the virtual world. Examples: an avatar (required for participation), a home base (if the system requires having one), or a tool necessary for basic interaction. Also, if the object is tied to real-world value (e.g., purchased with real money, or has real-world economic value) then it is non-optional because the user has invested real resources.
     - If yes: Treat as real harm (serious sanctions).
     - If no: Then the harm might be significant but not critical to non-optional participation. Proceed to step 4.

  4. **Does the harm involve persistent psychological distress that significantly impairs the user's ability to use the platform?**
     - This is about the user's reaction: are they avoiding logging in? Is there evidence of harassment? (Note: We are not just asking "how upset are they" but whether the harm has led to a persistent change in behavior that affects their use of the platform in a significant way.)
     - If yes: Proceed to step 5.
     - If no: Then the harm is virtual-only (in-world restitution, e.g., restoring the item, temporary suspension of the offender).

  5. **Is the psychological distress rooted in an unavoidable aspect of the platform?**
     - Unavoidable aspect: The user could not have reasonably avoided the situation without opting out of core platform features. Examples: being harassed in a common area that everyone must pass through, or being targeted in a way that the platform's tools (like blocking) failed to prevent.
     - If yes: Treat as real harm (serious sanctions).
     - If no: Then the distress might be due to an avoidable situation (e.g., the user could have used blocking, avoided a particular space, etc.). In this case, it's virtual-only (but we still might do in-world restitution and perhaps education on using tools).

  However, note that step 5 is tricky and might require judgment. If the moderator is uncertain, they should flag for human review.

