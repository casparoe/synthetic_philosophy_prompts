  The user needs a concrete plan: a precise question, critique of existing views, section-by-section breakdown with word counts, handling of counterexamples, justification for their approach over pluralism, success/failure conditions, and feasibility assessment. They're worried about scope and want to know where their approach might fail.

  Breaking this down: I need to formulate a razor-sharp research question that avoids vagueness. Something like: "Is the tendency to decay under direct attention a necessary and unifying feature of all pleasures?" This makes the answer binary - yes or no.

  For existing views: The felt-quality approach fails because no single feeling ties diverse pleasures together. Attitudinal views struggle with cases like relief or retrospective enjoyment where the "wanting to continue" attitude is absent or complex. Quietist approaches surrender the unity claim too easily. This creates the opening for the dynamic account.

  The paper structure should be practical. Section 1 (900 words) states the problem through paradigmatic cases. Section 2 (1200 words) analyzes why current theories stumble. Section 3 (1500 words) develops the dynamic account - defining decay profiles, showing how they handle hard cases. Section 4 (1200 words) argues why this beats pluralism (maintains hedonism's simplicity, explains why pleasure feels unified). Section 5 (900 words) tests the theory - especially the "unpoisonable pleasure" thought experiment. Section 6 (300 words) concludes.

  Key milestones: Week 2 would analyze counterexamples. Week 5 would build the decay profile taxonomy. Week 9 would run the unpoisonable pleasure test.

  The major risks: The account might collapse into attitudinal views if "decay under attention" just reflects attitude shifts. Or it might make pleasure extrinsic, abandoning hedonism's core. The unpoisonable pleasure case is crucial - if such pleasures seem conceptually possible, the theory fails.

  Feasibility: 6,000 words is tight but manageable by focusing on the decay mechanism, not all dynamic aspects. Should prioritize depth on key cases over breadth.

  The biggest vulnerability? If some pleasures actually intensify under attention (e.g., aesthetic savoring). If these can't be explained as attention redirected to objects rather than the pleasure itself, the theory might crumble.

