answer: |-
  The tension between ascription universality (AU) and epistemic dominance arguments for probabilism hinges on **what must be invariant across agents** for dominance reasoning to generate a universally binding norm. Let's dissect the conceptual fault line:

  ### 1. **The Core Problem: Agent-Relative Dominance**
     - Epistemic dominance arguments show that non-probabilistic credences are **accuracy-dominated**: there exists an alternative credence function that is *more accurate* in every possible world, *regardless of which strictly proper scoring rule* is used (provided it belongs to a privileged class, e.g., bounded continuous strictly proper rules).
     - **Critically**: Dominance is defined *relative to a set of scoring rules* (the "dominance class"). If agents can choose *different* sets of admissible scoring rules, dominance becomes **agent-relative**:
       - Credence function \(c\) might be dominated for Agent A (who uses scoring rule set \(\mathcal{S}_A\)).
       - But \(c\) might *not* be dominated for Agent B (who uses \(\mathcal{S}_B \neq \mathcal{S}_A\)).

  ### 2. **What Must Be Universal?**
     - **Ascription Universality (AU) requires**:  
       *"The norm 'Avoid dominated credences' applies to all agents, irrespective of their evaluative attitudes."*  
     - **For dominance to ground AU**:  
       The *dominance relation itself* must be agent-invariant. If dominance depends on an agent's chosen scoring rule, the norm "Avoid dominated credences" becomes conditional: *"Avoid credences dominated relative to **your** scoring rule."* This violates AU, as the norm's applicability depends on the agent's evaluative choice (their preferred scoring rule).

  ### 3. **Scoring Rule Permissivism vs. Universality**
     - **Scenario**: Agents may favor different strictly proper scoring rules (e.g., Brier score vs. logarithmic score).  
     - **Problem for Dominance Argument**:  
       Non-probabilistic credences are *only* dominated if the dominance class (\(\mathcal{D}\)) is "rich" enough (e.g., all bounded continuous strictly proper rules). If each agent has their *own* \(\mathcal{D}_i\) (e.g., only the Brier score), then:
         - A non-probabilistic \(c\) might be dominated if \(\mathcal{D}_i\) is large (e.g., all strictly proper rules).
         - But if \(\mathcal{D}_j\) is small (e.g., only the log score), \(c\) may be undominated for Agent j.
       **Result**: Probabilism cannot be derived as a universal norm via dominance. The argument fractures.

  ### 4. **Coherent Position: Weakly Universalisable Norms**
     Can we reconcile AU with scoring rule permissivism? Only by weakening the dominance norm:  
     - **Position**:  
       _"All agents must use a strictly proper scoring rule (but may choose which one). Avoid credences dominated relative to **your chosen** scoring rule."_  
     - **Universal Element**:  
       The norm applies to all agents (satisfies AU formally).  
     - **Non-Universal Element**:  
       Dominance is relativized to the agent's scoring rule. Probabilism *does not follow*, because:
       - An agent using *only* the log score may rationally hold non-probabilistic credences (as some are undominated under the log score alone).  
       - **Example**: A non-probabilistic credence \(c\) that matches probabilities for events relevant to the log score may be undominated *for an agent using only that rule*.  
     - **Surviving Norm**:  
       **Coherence-with-your-own-scoring-rule**:  
       Agents must avoid credences dominated *relative to their own chosen \(\mathcal{D}_i\)*. This only requires that credences are "locally coherent" (non-dominated) under the agent's preferred epistemic values. It does not mandate probabilism.

  ### 5. **Theoretical Pressure Points**
     - **The Universality of Rationality**:  
       AU insists that epistemic norms transcend individual preferences. Dominance arguments require a fixed dominance class (\(\mathcal{D}\)) to ground universal probabilism. If \(\mathcal{D}\) fractures, rationality fractures.  
     - **Accuracy-First's Challenge**:  
       Accuracy-first epistemology aims to ground norms in the *objective* of accuracy. But if "accuracy" is scored differently per agent, the "objective" becomes agent-relative. To rescue universality, one must argue that:  
       (a) There is a **unique privileged \(\mathcal{D}\)** (e.g., all strictly proper scores), or  
       (b) **Dominance must hold over all possible \(\mathcal{D}\)** (but this is impossible if \(\mathcal{D}\)s conflict).  
     - **Key Insight**:  
       The dominance argument for probabilism *only works* if the dominance class \(\mathcal{D}\) is fixed *and sufficiently rich* (e.g., all continuous strictly proper rules). If agents can restrict \(\mathcal{D}\), dominance fails to universally penalize non-probabilism.

  ### Conclusion
  The fracture is **unavoidable** if scoring rules are agent-relative:  
  - **Ascription Universality** demands that the *norm* (not just its form) applies identically to all agents.  
  - **Epistemic dominance** can only support a universal norm if the *dominance relation* is agent-invariant.  
  - **Strictly proper scoring rule pluralism** undermines the dominance argument for *universal probabilism* but allows weaker, agent-relative coherence norms.  

  **The real pressure** is on the accuracy-first program to justify why the dominance class \(\mathcal{D}\) (e.g., all bounded continuous strictly proper rules) is **mandatory for all rational agents**—without appealing to probabilism itself. Without this, AU and dominance-based probabilism cannot coexist under scoring rule pluralism.
