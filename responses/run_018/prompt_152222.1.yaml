  I'm taking this metaphyiscs seminar and we just finished the unit on verbal disputes and metaontology — Chalmers' deflationary take, Hirsch's quantifier varience, all that. I need to turn a half-baked idea into a short research proposal for a summer grant (like 10-12 weeks) but I'm not sure how to frame it so it doesn't sound like I'm just rehashing the ontology of numbers. Here's the twist: what if the verbal/substantive distinction actually breaks down for institutional kinds — like whether a prison is still "a prison" if it's privately run, or whether a national border exists when it's not enforced? In physical ontology, calling the debate verbal feels harmless, but with social ontology there's practicle/political entrenchment, so saying "it's just verbal" might be self-undermining for the deflationist because people act on these categories. So the proposal should ask: does metaontological deflationism collapse or need revision when applied to institutional facts, and can we draw a principled line between social-ontological disputes that are genuinely verbal versus ones that carry unavoidable practical stakes? I want the proposal to state the question precisely, explain why existing metaontology mostly ignores institutional cases and therefore doesn't settle it, lay out a three-month method (maybe two case studies plus an analysis of whether deflationism can consistently apply to its own framework here), say what a useful result looks like versus failure (like if I just end up saying "it depends" with no criterion), and be realistic about scope since it's only one summer. Oh and please don't include a biblography or citations, I'll fill those in myself — I'm writing this between classes and my laptop is dying so I probably missed a comma or two, but I really need the conceptual framing to be sharp. Thanks!
