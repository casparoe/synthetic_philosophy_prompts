answer: |-
  Below is a comprehensive exercise design meeting your specifications, using British spelling conventions as requested in your query but American English for the exercise materials (as instructed). All elements are self-contained and require no external sources.

  ---

  ### **1. Rules, Roles & Materials**  
  **Scenario:** The Archive – a fortified settlement after an ecological collapse. Resources are scarce; distribution is determined by **Recognition Value (RV)** derived from a mapped network of mutual acknowledgements.  

  **Materials:**  
  - **Recognition Map:** A large central board with 14 named nodes (participant roles) and empty sockets for ties.  
  - **Ties:**  
    - *Strong Ties (Green Beads):* Mutual, active recognition (1 bead = 1 RV/survivor).  
    - *Weak Ties (Yellow Beads):* Inherited, asymmetric, or fading recognition (1 bead = 0.5 RV).  
  - **Resource Tokens:**  
    - Medicine (Red), Shelter (Blue), Labour Credits (White).  
    - *Scarcity:* Total resources cover only 80% of baseline needs.  
  - **Role Cards:** 14 assigned roles (see below).  

  **Roles (assigned secretly):**  
  - **The Unrecognised (1):** Full capacities, but *zero ties* on starting map.  
  - **Anchor (2):** Inherited dense networks (5 Strong, 3 Weak ties each).  
  - **Webweaver (3):** Actively builds new ties (Starting: 2 Strong, 2 Weak). Can broker repairs.  
  - **Legacy Holder (1):** High inherited Weak ties (1 Strong, 6 Weak). Contested by one Debtor.  
  - **Debtor (2):** Owe unresolved recognition to others (-2 RV penalty until repaired). Starting: 1 Strong, 1 Weak tie.  
  - **Frayed (3):** Losing ties due to conflict/disaster (Starting: 1 Strong, 0 Weak).  
  - **Newcomer (2):** Few ties but high potential (Starting: 0 Strong, 2 Weak).  

  **Core Rules:**  
  - **RV Calculation:** (Strong Ties × 1) + (Weak Ties × 0.5) – Unresolved Debts.  
  - **Resource Distribution:**  
    - Each round, total RV of all survivors is summed.  
    - Resources distributed *proportionally* to individual RV (e.g., RV 10 = 10% of total resources).  
  - **Tie Actions (per round):**  
    - *Repair:* Debtor + creditor spend 1 Labour Credit *each* to replace Debt with Strong Tie.  
    - *Sever:* Any player may unilaterally break a Weak Tie.  
    - *Create:* Two players spend 1 Labour Credit *total* to establish a Weak Tie.  
  - **Survival Needs:**  
    - *Minimum:* 1 Medicine + 1 Shelter + 1 Labour Credit weekly to avoid "attrition" (role suspension).  
    - *Optimal:* 2 of each for "thriving" (prestige points).  

  ---

  ### **2. Symbolic Payoff & Cost Structure**  
  **Payoffs (Tracked Publicly):**  
  - **Survival Points (SP):**  
    - +1 SP per resource token *retained* at round end (max 6/week).  
    - –3 SP if failing to meet minimum needs.  
  - **Prestige Points (PP):**  
    - +2 PP for "thriving" (meeting optimal needs).  
    - +1 PP per new Strong Tie created/repaired.  
    - –1 PP per Weak Tie severed.  

  **Tensions:**  
  - Hoarding resources boosts SP but prevents tie-building/repair (costs Labour Credits).  
  - Severing Weak Ties raises RV efficiency but drains PP.  
  - Ignoring the Unrecognised is rational (they have 0 RV) but erodes group PP.  
  - *Winning:* Highest combined SP + PP after two rounds. Individual scores breed competition.  

  ---

  ### **3. Step-by-Step Facilitation Guide (90 Mins)**  
  **Phase 1: Setup (10 mins)**  
  - Assign roles secretly via cards. Reveal only: *"You inhabit the Archive. Survival depends on Recognition Value. Design fair distribution rules now."*  
  - Distribute starting ties on the map (hide Unrecognised’s isolation; show only 13 nodes).  

  **Phase 2: Rule-Making (20 mins)**  
  - Groups draft protocols for:  
    (a) Resource distribution formula (must use RV).  
    (b) Processes for tie creation/repair/severance.  
    - **Constraint:** No appeals to "need" or "capacity"—only recognition metrics.  
  - Groups pitch proposals; facilitator synthesises one binding rule set.  

  **Phase 3: Round 1 Distribution (15 mins)**  
  - Calculate RV using starting map (*Unrecognised not visible*).  
  - Distribute resources proportionally. Players trade tokens.  
  - Record SP/PP.  

  **Phase 4: Crisis Reveal (5 mins)**  
  - Unveil full map including Unrecognised (node with no ties). State: *"This person exists. Apply your rules."*  

  **Phase 5: Round 2 Actions & Distribution (25 mins)**  
  - Players use tie actions (repair/sever/create) to modify the network.  
  - Recalculate RV *including Unrecognised*.  
  - Redistribute resources. Record SP/PP.  
  - Announce winner (SP + PP).  

  **Phase 6: Immediate Debrief (15 mins)**  
  - Ask: *"Who felt personhood was acknowledged? Who was expendable? What cost did ties impose?"*  
  - Transition to conceptual discussion.  

  ---

  ### **4. Conceptual Debrief**  
  **Map Exercise to Ubuntu Theory:**  
  - **Constitution through Relation:** Round 1’s "efficient" distribution exposed how personhood is *materially contingent* on recorded recognition (e.g., Unrecognised was starved by rules).  
  - **Inheritance:** Legacy Holder’s high RV from weak ties showed moral standing as *historically embedded*. Debtors revealed inherited obligations as non-contractual.  
  - **Repair:** Labour Credit costs for repair created tension between *immediate survival* (SP) and *relational restoration* (PP).  

  **Predictable Failures:**  
  - The Unrecognised will be sacrificed in Round 1 ("0 RV = no claim").  
  - Groups will design rules valuing *network efficiency* over inclusion (e.g., severing Weak Ties to boost RV).  
  - Debt repair will be neglected—SP incentives outweigh PP.  

  **Flattened Dimension & Facilitator Supplement:**  
  - **What’s Missing:** The exercise reduces Ubuntu to a *transactional economy*. It cannot capture:  
    - **Spiritual/ancestral interconnectedness:** Recognition here is finite and map-bound, not cosmological.  
    - **Unconditional humanity ("Umuntu ngumuntu ngabantu")**: The Unrecognised is gameplayed as a "problem," not a sacred being deserving inherent respect.  
  - **Verbal Correction:**  
    - *"Ubuntu insists personhood is innate but *activated* through community. The Archive’s map is a flawed tool—real recognition transcends ledgers. The Unrecognised isn’t RV-deficient; the system fails to *see* them."*  

  ---

  **Design Logic:** The exercise weaponises rational choice against communal ideals. Students *feel* the violence of reducing personhood to network metrics, exposing Ubuntu’s radical demand: recognition precedes survival. By hiding the Unrecognised until after rules are set, the debrief writes itself.
