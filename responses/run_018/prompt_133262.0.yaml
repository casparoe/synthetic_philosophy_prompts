answer: |-
  Here’s the thought experiment crafted to your specs:

  **Scenario:**  
  At "West Ridge 7" (a fictional late Neolithic tell site in Anatolia, c. 5500 BCE), excavators uncover a cluster of 15 circular sub-floor pits arranged in three concentric rings around a central plaster-lined basin. Each pit contains fragments of identical, volumetrically standardized globular jars (avg. 30L capacity ±0.5L) and worn basalt grinding slabs. The jars show residue of einkorn wheat, while the slabs bear starch from the same grain. Crucially, the spatial distribution reveals **identical vessel volumes and grinding stone types in every pit, with no variation between peripheral vs. central pits**.

  **Interpretations:**  
  - **Institutionalist (A)**: Argues this represents a communal granary system governed by centralized rules. The *perfect volumetric uniformity* across all storage units—despite spatial hierarchy—implies enforced production standards, suggesting ration distribution or tax collection. The central basin served as a measuring/redistribution point. Standardization at this scale (beyond household tolerance) requires administrative oversight.  
  - **Minimalist (B)**: Proposes an extended kin-group storage cooperative. Identical volumes reflect shared *technical knowledge* (e.g., using the same potter’s coil-ring template), not institutional control. The layout is functional (protection from damp/floods) and ritual (symbolic centrality of grain), not bureaucratic. Kin groups could self-organize standardization without top-down rules.  

  **The Ambiguous Feature:**  
  **Uniformity of vessel volumes across the entire spatial hierarchy (core vs. periphery pits)**.  
  - *Why it’s ambiguous*: Perfect metrical consistency *could* imply enforced norms (A), but *could also* emerge from egalitarian craft traditions (B). Neither side denies the pattern exists—they dispute what social mechanism *causes* it.  

  **The Decisive Discovery:**  
  A fired clay **token (2cm cube)** found *in the central basin*, incised with a **∨ symbol** matching the jar’s volumetric mark (tested by seed-filling).  
  - *Impact*: The token acts as a physical "volume standard." Its location in the central feature suggests it was a master reference tool—not a personal item. This supports (A): administration requires verifiable measures. (B) cannot easily explain why a *single* token resides in a non-domestic space if volumes were organically replicated.  

  **Institutionalist’s Defense Against Overinterpretation:**  
  The institutionalist counters the charge by arguing: *"Standardization + central spatial control = administrative logic.* Ethnographically (e.g., Mesopotamian ration systems), metrical uniformity *only* occurs with oversight when distribution crosses kinship lines. The token isn’t just a ‘tool’—it’s a *non-utilitarian verification device* found in a collective space. Minimalism fails to explain why kin groups burying grain *under their own floors* would need centrally stored, non-functional volume references unless enforcing compliance."  

  **Key Niche Element:**  
  The focus on **vessel-volume consistency *specifically across hierarchically arranged spaces*** leverages debates in Neolithic political economy (e.g., Ian Kuijt’s work on storage and equality). Most "standardization" studies compare domestic units—here, the ambiguity pivots on whether spatial order *intersects* with metrical control.  

  Let me know if you need tweaks to the vessel-tech or spatial logic!
