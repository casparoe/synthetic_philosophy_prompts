prompt: |-
  okay so me and my friend got into it last night over beer about real patterns and dennets three stances—physical, design, intentional. he was arguing that in AI interpretability we basically have to take the design stance, talking about attention heads like theyre doing specific jobs, but then he got weird about whether those patterns are actually ontologically real or just useful predictive fictions we project onto weight matrices. i said if the interventions hold across contexts, isnt that enough? but he brought up this idea he called double-layered intentionality—taking the intentional stance toward a system thats itself built to model intentional agents—and claimed thats where the real philosophical puzzles live now. i think he mightve made that up, but im not sure.

  anyway im trying to figure out which open questions in this space actually deserve years of work vs which ones are just wheel-spinning. for instance, is there a principled boundary for when a design-stance pattern counts as real rather than heuristic? does taking the intentional stance seriously for AI force us to revise agency or blame in automation? can real patterns exist that genuinely arent reducible to the physical stance? and is that double-layered intentionality thing even a coherent upstream problem or a dead end?

  i dont want a literature survey. i want a defended agenda: which questions are upstream of which, which are tractable for philosophers or cognitive scientists rather than just ML engineers, and which ones wouldnt change practice even if solved. if you had a small research group for about three years, where should they go?

  please seperate whats settled from whats genuinely contested among people who know the topic—dont present a contested view as the obvious consensus. write in american english.

  please put a one-sentence summary as the very last line.
