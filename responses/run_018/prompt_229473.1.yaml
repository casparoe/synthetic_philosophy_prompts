prompt: |-
  Before I read any further on Kelly betting and geometric rationality, I would like the specification rather than another restatement of the formula. Please write the desiderata that an adequate theory of stake sizing for repeated, multiplicative gambles — a gambler who each round wagers some fraction of current wealth on a favourable bet — must meet, with the case or consideration that makes each one a genuine requirement. In particular, I would like you to adjudicate which of the following are real requirements and how each should be stated: (i) a policy must be consistent with survival, so that it cannot treat a wager of the entire bankroll on a positive-expectation bet with any chance of loss as acceptable, and more generally must distinguish a favourable expectation from a sensible stake size; (ii) a policy must capture the overbetting phenomenon, in which stakes above the growth-optimal fraction reduce expected log-growth, and stakes sufficiently far above it make that growth negative so that typical wealth declines over time even though the arithmetic expectation of wealth may remain attractive; (iii) a policy must generalise from a single sequence of independent identical bets to a portfolio of simultaneous correlated bets, since covariance between outcomes changes the appropriate allocation even when each bet is individually favourable; (iv) a policy must say what to do under uncertain or shifting probabilities, including whether one ought deliberately to bet only a fraction of the apparent optimum; and (v) a policy must either reconcile itself with expected utility theory or explain why the apparent conflict is illusory — in particular, whether growth-optimal staking is rationally mandatory only for an agent with logarithmic utility. For each desideratum, say whether it is non-negotiable or a camp-specific preference, and flag any pair you suspect cannot be jointly satisfied. Keep the scorecard of existing positions brief; the criteria and their motivation are what interest me.
reasoning: |-
  We are discussing desiderata for a theory of stake sizing in repeated multiplicative gambles (like Kelly betting). I'll go through each of your points (i) to (v) and state:
   - Whether it is a non-negotiable requirement or a camp-specific preference.
   - The case or consideration that makes it a genuine requirement (if it is one).
   - Any notes on joint satisfiability or existing positions only as necessary.

   Let's break down each:

  (i) "A policy must be consistent with survival, so that it cannot treat a wager of the entire bankroll on a positive-expectation bet with any chance of loss as acceptable, and more generally must distinguish a favourable expectation from a sensible stake size."

    - **Status**: Non-negotiable.
    - **Reason**: In repeated betting, even a single loss when betting the entire bankroll would reduce wealth to zero (or ruin) and the game would be over. Since any positive chance of loss implies a chance of ruin (if repeated indefinitely), it is unacceptable to bet the entire bankroll. Moreover, the theory must recognize that a positive expectation does not by itself justify any particular stake size (e.g., a bet with a small positive expectation might still warrant a small stake to avoid ruin). This is a fundamental principle of risk management.

  (ii) "A policy must capture the overbetting phenomenon, in which stakes above the growth-optimal fraction reduce expected log-growth, and stakes sufficiently far above it make that growth negative so that typical wealth declines over time even though the arithmetic expectation of wealth may remain attractive."

    - **Status**: Non-negotiable for a theory that aims for long-term growth.
    - **Reason**: The phenomenon of overbetting is a key insight of the Kelly criterion and geometric growth. It shows that maximizing the expected logarithm of wealth (which leads to the growth-optimal fraction) avoids the counterintuitive situation where the expected wealth (arithmetic) might suggest a higher stake, but in reality, the long-run growth rate is negative. This is because the geometric mean growth rate (which determines long-term wealth) is maximized at the Kelly fraction and declines beyond it, eventually becoming negative. Without this, the theory would not account for the risk of ruin and subexponential growth.

  (iii) "A policy must generalise from a single sequence of independent identical bets to a portfolio of simultaneous correlated bets, since covariance between outcomes changes the appropriate allocation even when each bet is individually favourable."

    - **Status**: Non-negotiable for a complete theory.
    - **Reason**: In real-world applications (e.g., portfolio management), bets are often simultaneous and correlated. The optimal allocation must account for the covariance structure because diversification can reduce risk and improve the growth rate. Ignoring correlation would lead to overconcentration in correlated bets and suboptimal growth. Hence, a theory that does not generalize to multiple correlated bets would be of limited use.

  (iv) "A policy must say what to do under uncertain or shifting probabilities, including whether one ought deliberately to bet only a fraction of the apparent optimum."

    - **Status**: Non-negotiable for a practical theory, but the exact approach may be camp-specific.
    - **Reason**: In practice, probabilities are rarely known with certainty. A robust theory must address uncertainty (e.g., Bayesian approaches) and non-stationarity (changing probabilities). It is well-known that when probabilities are uncertain, betting less than the Kelly fraction (sometimes called "fractional Kelly") can be advisable to avoid overbetting on an inaccurate model. This is to protect against model risk and reduce volatility. Without addressing this, the theory would be impractical.

  (v) "A policy must either reconcile itself with expected utility theory or explain why the apparent conflict is illusory — in particular, whether growth-optimal staking is rationally mandatory only for an agent with logarithmic utility."

    - **Status**: Non-negotiable for a theory that claims to be about rationality.
    - **Reason**: Expected utility theory (EUT) is the dominant normative theory of rational decision-making under uncertainty. If the stake-sizing policy is to be considered rational, it must either fit within EUT (by showing that it corresponds to maximizing expected utility for some utility function) or explain why EUT does not apply or is being extended. Specifically, the Kelly criterion maximizes the expected logarithm of wealth, which is equivalent to expected utility maximization for an agent with a logarithmic utility function. However, the theory should clarify if this is the only rational choice or if other utility functions (and hence other staking policies) might be rational for different agents.

  **Joint Satisfiability**:

    - There is no inherent conflict between (i)-(v). The Kelly criterion and its extensions (like the multivariate Kelly for portfolios) satisfy (i) to (iii) and (v). For (iv), the theory of fractional Kelly or adaptive Kelly can be incorporated. However, note that (v) might be a point of debate: if one insists that growth-optimal staking is mandatory for every rational agent, then that would conflict with EUT which allows other utility functions. But the reconciliation is that growth-optimal staking is the unique strategy that maximizes the asymptotic growth rate, and it is also the strategy that an agent with logarithmic utility would choose. For an agent with a different utility function, the optimal strategy may differ. Therefore, the theory should not claim that Kelly is mandatory for every rational agent, but rather that it is optimal for long-run growth and for log-utility agents. This reconciles with EUT.

  **Summary of Desiderata**:

    - (i) Survival: Non-negotiable. Avoids ruin and distinguishes between positive expectation and sensible stake.
    - (ii) Overbetting: Non-negotiable. Captures the key insight that too high stakes lead to suboptimal or negative growth.
    - (iii) Portfolio: Non-negotiable. Real-world bets are correlated and require diversification.
    - (iv) Uncertainty: Non-negotiable in practice. Must handle uncertain probabilities and recommend conservative betting when uncertain.
    - (v) Reconciliation with EUT: Non-negotiable. The theory must clarify its relationship to rationality and utility.

  **Note on Existing Positions**:

    - The Kelly criterion satisfies (i) to (iii) and (v) (for log utility). For (iv), there are extensions (like fractional Kelly) that are commonly used. The main controversy is around (v): some argue that Kelly is the only rational strategy for long-term growth, while others (in the EUT camp) argue that it depends on the agent's utility function and time horizon.

  Thus, a complete theory of stake sizing for repeated multiplicative gambles must meet all five desiderata. They are all non-negotiable for a theory that aims to be both theoretically sound and practically applicable.
answer: |-
  Below is a precise adjudication of each desideratum for a theory of stake sizing in repeated multiplicative gambles, structured as requested. Each is assessed for its status (non-negotiable requirement vs. camp-specific preference), the core case making it a genuine requirement, and notes on conflicts or dependencies. The focus is on the criteria and their motivations, with minimal reference to existing positions.

  ---

  ### **Desiderata Assessment**

  1. **Consistency with Survival**  
     - **Statement**: A policy must ensure that wagering the entire bankroll on a positive-expectation bet with any chance of loss is unacceptable, and must decouple favorable expectation from sensible stake size.  
     - **Status**: **Non-negotiable requirement**.  
     - **Case for Requirement**: In repeated multiplicative gambles, ruin is irreversible. A single loss when betting the entire bankroll reduces wealth to zero, terminating future growth. Crucially, a positive arithmetic expectation (e.g., +EV) does not preclude ruin risk—e.g., a 51% chance of doubling wealth and 49% of losing everything has positive EV but guarantees ruin over time. Survival is foundational to repeated play; a theory violating this incentivizes reckless behavior.  
     - **Conflict Note**: None with other desiderata; this is a baseline constraint.

  2. **Capturing Overbetting**  
     - **Statement**: A policy must reflect that stakes above the growth-optimal fraction reduce expected log-growth, and sufficiently high stakes cause negative growth (declining typical wealth) despite attractive arithmetic expectations.  
     - **Status**: **Non-negotiable requirement**.  
     - **Case for Requirement**: Overbetting is a mathematical inevitability in multiplicative processes. For example, a 60%-win coin flip (2:1 payout) has maximal growth at 25% of bankroll (Kelly fraction). Betting 30% reduces growth; betting ≥50% yields negative growth (e.g., median wealth →0). Ignoring this misrepresents compounding: arithmetic EV grows linearly, but geometric growth (and long-term wealth) is log-driven. A theory failing here would recommend stakes that seem profitable short-term but ensure long-term poverty.  
     - **Conflict Note**: Synergistic with (i); both address risk of ruin.

  3. **Generalization to Correlated Portfolios**  
     - **Statement**: A policy must extend to simultaneous correlated bets, as covariance alters allocations even when individual bets are favorable.  
     - **Status**: **Non-negotiable requirement**.  
     - **Case for Requirement**: Real-world portfolios involve correlated assets (e.g., stocks in the same sector). Covariance reduces risk through diversification: two positive-EV bets may be individually growth-optimal at 10% each, but if perfectly correlated, the combined allocation should not exceed 10%. If negatively correlated, it may exceed 10%. A single-bet theory cannot optimize portfolios, rendering it practically useless for finance or complex gambling.  
     - **Conflict Note**: Independent of (i) and (ii); generalizes them.

  4. **Handling Uncertain or Shifting Probabilities**  
     - **Statement**: A policy must prescribe actions under probability uncertainty (e.g., betting a fraction of the apparent optimum).  
     - **Status**: **Camp-specific preference** (with near-universal practical relevance).  
     - **Case for Requirement**: Probabilities are rarely known exactly. Overconfidence in estimates causes overbetting: if the true Kelly fraction is 10% but you estimate 20% (due to error), betting 20% leads to negative growth. Deliberately underbetting (e.g., "half-Kelly") hedges against model error. This is not mathematically mandatory (one could assume perfect knowledge), but it is empirically essential—e.g., in quantitative finance, underbetting improves robustness.  
     - **Conflict Note**: May mildly tension (ii) by reducing stakes below the theoretical optimum, but this is a feature, not inconsistency.

  5. **Reconciliation with Expected Utility Theory (EUT)**  
     - **Statement**: A policy must reconcile with EUT or explain conflicts, especially whether growth-optimality is mandatory only for log-utility agents.  
     - **Status**: **Non-negotiable requirement for normative theories**.  
     - **Case for Requirement**: EUT is the dominant normative framework for rational choice under risk. Growth-optimality (maximizing expected log-wealth) coincides with EUT for logarithmic utility, but EUT permits other utilities (e.g., linear → bet-it-all; quadratic → conservative). A theory must clarify if it:  
       - (a) Assumes log-utility (making growth-optimality rationally mandatory for such agents),  
       - (b) Derives growth-optimality as an approximation for long-run goals, or  
       - (c) Rejects EUT for compelling reasons (e.g., ergodicity economics).  
       Ignoring EUT invites charges of irrationality or incoherence.  
     - **Conflict Note**: Potentially clashes with (ii): Overbetting is irrational under log-utility but may be rational under linear utility (for finite horizons). This tension is resolvable by specifying the agent's goals.

  ---

  ### **Joint Satisfiability and Summary**
  - **All desiderata are jointly satisfiable** in principle.  
    - (i)–(iii) and (v) are satisfied by the Kelly criterion and its portfolio extensions.  
    - (iv) is addressed by Bayesian Kelly or fractional Kelly methods.  
    - (v) is resolved by noting growth-optimality is EUT-rational *for log-utility agents* or those with long-run wealth goals.  
  - **Critical tension**: Between (ii) and (v) if the theory insists growth-optimality is universally mandatory.  
    - **Resolution**: Growth-optimality is necessary for *asymptotic wealth maximization* but not for all utility functions. Clarity on the agent's objectives defuses conflict.  

  **Non-negotiable Core**: (i), (ii), (iii), and (v) are essential for a coherent, practically applicable theory. (iv) is pragmatically indispensable but admits methodological flexibility. A theory meeting all five provides a complete foundation for multiplicative gambling.
