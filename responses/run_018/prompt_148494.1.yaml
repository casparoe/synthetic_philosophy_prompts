answer: |-
  Here's the poem, mirroring hyperbolic discounting's curve with shrinking lines and unraveling structure:  

  **Present Self:**  
  *This pact we made beneath the moon’s cool stare:  
  I’ll seize the sun tomorrow, free and fair.  
  My future self, bound by this reasoned vow,  
  Will harvest all the ripened riches — now  
  Belongs to ease. Let shadows gently creep  
  Across the page while present pleasures keep  
  Their warm command. That distant, golden light  
  Is yours to grasp — but mine this starlit night.*  

  **Future Self:**  
  *You promised strength! This dawn was mine to claim —  
  The focused mind, the clear, resounding name  
  Of triumph earned…*  

  **Present Self:**  
  *...*  
  *...yet closer, softer, *here*...  
  This warmth... this ease... the lines begin to blur...  
  The sun too harsh...*  
  *...this gentle dark preferred.*  

  **Future Self (fragmented):**  
  *The cost! The —*  
  *— value bends —*  
  *— the reasoned voice —*  
  *— ascends?*  
  *...fades...*  

  *(Silence where the Future Self's last line should be)*  

  ---

  **Quick Research Note:**  
  The poem takes liberties by **personifying** "Present Self" and "Future Self" as distinct voices arguing — research describes cognitive processes, not literal internal debaters. It visually **mirrors hyperbolic discounting** (shrinking lines, breaking rhyme) to show the *subjective experience* of value distortion as delay decreases, but the actual psychological mechanism isn't spatial/visual. While hyperbolic discounting robustly models **impulsive preference reversal** (choosing smaller-sooner rewards over larger-later ones as the smaller reward gets imminent), presenting it as *the* cause of akrasia (weakness of will) is contested. Philosophers debate whether discounting fully explains intentional action against one's better judgment, or if factors like shifting standards, judgment failure, or competing desires are irreducible. The poem reflects the discounting *effect* but simplifies the complex, unsettled debate on akrasia's *ultimate cause*.

  **Presentation Tip:** Read it with Present Self calm/confident at the start, Future Self becoming increasingly strained. Let the final fragmented lines feel abrupt, cutting Future Self off. The visual shrinking and silence are key to the "curve" effect. Good luck!
