answer: |-
  Here’s a streamlined 75-minute teaching arc targeting misconceptions, anchored in a concrete example, with precise timing and trap-avoidance. The key is to **frame uncomputability as a feature**, not a bug, by emphasizing *prediction over ontology*.

  ---

  ### **Core Example: The "Prime-Like" Sequence**
  **Data:** `[2, 3, 5, 7, 11]`  
  *Looks like primes, but the next value is... `13`? `16`?*  
  **Goal:** Show a "weird" short program beats a long "intuitive" one.  
  **Avoids:** Uniform prior, parameter-counting, ontological claims.

  ---

  ### **Teaching Sequence (75 Mins Total)**
  **▶︎ PART 1: Reframing "Simplicity" (20 mins)**  
  - (5 min) **Misconception 1: "Simplicity = Fewer Parameters"**  
    - *Trap:* Students equate "simple" with "low parameter count."  
    - **Head it off:** Contrast two models for `[2,3,5,7,11]`:  
      - *Model A (Intuitive):* "Primes" (program: `generate_nth_prime(n)`). **Long code** (needs prime-checking).  
      - *Model B ("Weird"):* `n^2 - n + 2` → `[2,3,5,11,16?]`. **Short code** (one expression).  
    - *Crucial:* Show **code length**, not parameter count. Model B has 1 "parameter" but predicts `16` (not `13`).  
  - (10 min) **Budget Framing: "Bit-Cost = Probability Halving"**  
    - *Anchor:* "Every extra bit in your program *halves* its prior probability."  
    - *Apply:* Model B is 5 bits; Model A is 50 bits → Model B is *2⁴⁵× more probable a priori*.  
  - (5 min) **Set Up Tension:** "But Model B ‘predicts’ 16—is that *really* better than primes?" → Tease prediction.

  **▶︎ PART 2: Kolmogorov Complexity & Universal Prior (25 mins)**  
  - (10 min) **Define K(S)**: "Length of the *shortest program* outputting sequence S on a fixed UTM."  
    - *Analogy:* "Compression = understanding. ZIP file beats verbose essay."  
    - *Example:* `[1, 3, 7, 15, 31]` → Short program: `2^n - 1`. Long program: list each number.  
  - (10 min) **Universal Prior: P(S) = 2^(-K(S))**  
    - *Emphasize:* **Exponential weighting**—not uniform! Shorter programs dominate.  
    - *Misconception 2: "Universal Prior is Flat"* → **Head it off here:**  
      - Show `P(5-bit program) = 2⁻⁵`, `P(50-bit) = 2⁻⁵⁰` → **Not uniform over programs!**  
      - "The prior favors *succinct explanations*, not ‘all ideas are equally likely’."  
  - (5 min) **Apply to Prime-Like Example:**  
    - *Prediction:* For `[2,3,5,7,11]`, `n^2 - n + 2` (K=small) predicts `16`.  
    - *Test:* Next data point is... **`16`**! → Short program *predicted better* than primes.  
    - *Punchline:* "Weirdness won. Not because it’s ‘true’, but because it compressed past data."  

  **▶︎ PART 3: Prediction vs. Truth & Uncomputability (25 mins)**  
  - (10 min) **Prediction, Not Ontology:**  
    - *Stress:* "Kolmogorov ranks *predictive success*, not truth. The prior prefers hypotheses that *retrodict* data succinctly."  
    - *Prime-like example:* Model B won by predicting `16` correctly. If the next value was `13`, longer programs (like primes) gain probability.  
  - (10 min) **Misconception 3: "Uncomputability Makes It Useless"**  
    - **Head it off here:**  
      - *Admit:* "Yes, K(S) is uncomputable. You can’t *find* the shortest program."  
      - *Reframe:* "But science *approximates* it! We use proxies:  
        - MDL, compression algorithms (gzip), neural nets (learn compact representations).  
        - *Why it’s not fatal:* We don’t need the *shortest* program—just *shorter than data*."  
      - *Analogy:* "You can’t compute π’s *exact* decimal, but you can use 3.14 to build a bridge."  
  - (5 min) **End Check:**  
    - *Q:* "Why did the prior favor `n^2 - n + 2` over primes for `[2,3,5,7,11]`?"  
      - *Correct:* "It compressed the data better → *predicted* the next point correctly."  
      - *Wrong:* "Because polynomials are ‘truer’ than primes."  

  **▶︎ PART 4: Solomonoff Recap (5 mins)**  
  - "Solomonoff = Prediction via *weighted* short programs. Not ‘simplest story’, but ‘best compressor of history’."  
  - *Final contrast:* "Occam: ‘Avoid complex theories.’ Kolmogorov: ‘Complexity is *bits*—pay exponentially for extras.’"  

  ---

  ### **Formal Detail to Omit (Explicitly)**  
  - **Openly skip:** *Proof* of the invariance theorem. Say: "We fix a reference UTM because program lengths vary only by a constant. That’s why K(S) is ‘universal’—but we won’t derive it today."  

  ---

  ### **Why This Works**  
  - **Dependency Order:** Budget framing → Concrete example → K(S) → Prior → Prediction vs. truth → Uncomputability.  
  - **Heads Off Traps:**  
    - "Parameter counting" dies in Part 1 with the code-length comparison.  
    - "Uniform prior" dies in Part 2 with exponential weighting.  
    - "Uncomputability = useless" dies in Part 3 by linking to scientific proxies.  
  - **Example Does Heavy Lifting:** The "prime-like" sequence forces them to see that *prediction* (next = `16`) matters, not "truth." The "weird" model winning shatters intuition.  

  **End State:** They see Solomonoff as a *predictive calculus*—not a truth-teller—with uncomputability as a practical constraint, not a dealbreaker.
