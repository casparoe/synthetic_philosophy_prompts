prompt: |-
  I'm a reviewer at a state wetland board, and every quarter I have to sign off on mitigation-bank proposals that include an ecosystem-service valuation model. Every single one has an assumption thats obviously false -- continuous substitutability between nesting habitat and water filtration, or landowners as homogeneous rational agents with perfect information about soil carbon. I want a reusable decision procedure I can actually run in under an hour, grounded in Friedman's F-twist and whatever philosophy of science actually says about unrealistic assumptions: does the false assumption matter for this specific prediction and decision, or not? Give me the ordered steps: the exact question to ask at each point, what counts as a sufficient answer, where the procedure stops with "reject the model for this permit," where it stops with "this is a values call, not mine," and where I still have to make a judgment call despite the checklist. Apply it to three proposals: (1) a model assuming perfect substitutability that predicts flood-control acreage needed; (2) a model with homogeneous rational agents predicting 50-year carbon sequestration, where the result allows development I'd rather block; (3) a model with perfect-info agents predicting restoration success used to justify minimal long-term monitoring. Be explicit about what the procedure cant do.
reasoning: |-
  We are creating a decision procedure based on Friedman's F-twist, which says that the realism of assumptions doesn't matter as long as the model predicts well for the purpose at hand. The key is to focus on whether the false assumption matters for the specific prediction and decision.

   The procedure steps:

   1. Identify the critical prediction: What specific outcome does the model predict that is being used for the permit decision?
   2. Identify the false assumption(s): What are the unrealistic assumptions in the model?
   3. Trace the assumption's role: How exactly does the false assumption contribute to the critical prediction? Is it a core driver or peripheral?
   4. Sensitivity analysis: If we relax the false assumption (make it more realistic), would the critical prediction change substantially? 
      - If the model's authors have done a sensitivity analysis on this assumption, we can use that.
      - If not, we can think about the direction and magnitude of the change. 
   5. Empirical check: Is there evidence that the model's predictions are accurate in similar contexts despite the false assumption? (e.g., past performance of similar models, empirical validation)
   6. Decision relevance: Even if the prediction is off, does the direction of the error matter for the decision at hand? (e.g., if the model underestimates the harm, then using it might lead to an under-mitigated project, which is a problem)
   7. Value judgments: Are we being asked to make a value call (e.g., how much risk is acceptable) that the model cannot answer? If so, we note that this is a values call and beyond the model's scope.

   The procedure stops with:
     - "Reject the model for this permit": if the false assumption is critical to the prediction and relaxing it would change the prediction in a way that undermines the permit decision, and there's no empirical support for the model's accuracy.
     - "This is a values call, not mine": if the model is sound but the decision involves a trade-off that should be made by policymakers (e.g., how much risk to accept, how to value different ecosystem services) and the model does not make that trade-off.
     - Judgment call: if after the procedure there is still uncertainty, we have to make a judgment. We note why and what the key uncertainties are.

   What the procedure cannot do:
     - It cannot create new data or run complex simulations. We rely on available information and reasoning.
     - It cannot resolve fundamental value conflicts.
     - It cannot make the decision for us if the model is ambiguous.

   Let's apply to the three proposals:

   Example 1: Model assuming perfect substitutability between nesting habitat and water filtration for predicting flood-control acreage needed.

   Step 1: Critical prediction: The acreage of wetland needed for flood control.
   Step 2: False assumption: Perfect substitutability between nesting habitat and water filtration (i.e., they are interchangeable at a constant rate).
   Step 3: Role: This assumption allows the model to aggregate different types of wetlands into a single "ecosystem service" metric and then compute the required acreage for flood control. If they are not substitutable, then the model might be overestimating the flood control service of a given acre if it's heavy on nesting habitat but light on filtration, or vice versa.
   Step 4: Sensitivity: If we relax to imperfect substitutability (or no substitutability), then the model would require more acreage of the specific type that provides flood control? Not necessarily: the model might be designed to use a composite, but without substitutability, we might need separate calculations. The model's prediction of total acreage might be wrong because it doesn't account for the spatial configuration and specific functions. Without sensitivity analysis, we have to reason: if the wetland has a mix of functions, but flood control requires a specific type (e.g., with certain soil and vegetation), then the model might be over-optimistic if it counts acres that are poor for flood control because they are good for nesting. Thus, the prediction of flood-control acreage might be too low, meaning we might end up with insufficient flood control.
   Step 5: Empirical check: Is there evidence that this model has been validated in similar settings? If the model has been used before and flood control was achieved, that's a point in its favor. If not, and there are studies showing that flood control requires specific wetland characteristics, then we might be skeptical.
   Step 6: Decision relevance: The direction of error: if the model underestimates the acreage needed for flood control, then using it might lead to inadequate mitigation, which could cause flooding. That is a problem for the permit because the goal is to prevent increased flooding. If the model overestimates, then we are requiring too much, which might be safe but costly. But the permit is about meeting a minimum requirement. So underestimation is critical.
   Step 7: Value judgment: The model assumes that different ecosystem services can be traded off arbitrarily. But if we think that flood control is non-negotiable and must be met independently, then the substitutability assumption might be leading to a value judgment we don't agree with. However, the board might have guidelines that allow such trade-offs. If the board's mandate is to ensure flood control, and the model might be underestimating the required acreage for that specific service, then we have a problem.

   Conclusion for Example 1: 
     Without empirical support and given the risk of underestimating flood control needs, we might reject the model. But if the model has been validated and the area in question has a homogeneous wetland that provides both services adequately, then it might be acceptable. If we are uncertain, we might require a sensitivity analysis or more data. However, without that, and because the false assumption is central and the risk is high, we might reject.

   Example 2: Model with homogeneous rational agents predicting 50-year carbon sequestration, where the result allows development I'd rather block.

   Step 1: Critical prediction: The amount of carbon that will be sequestered over 50 years by the mitigation bank.
   Step 2: False assumptions: Landowners are homogeneous, rational, and have perfect information about soil carbon.
   Step 3: Role: The model uses these assumptions to predict landowner behavior (e.g., adopting practices that sequester carbon). If landowners are not homogeneous, then the average might not represent the whole. If they are not rational or lack information, they might not adopt the practices at the rate assumed.
   Step 4: Sensitivity: If we relax the assumption (e.g., introduce heterogeneity, bounded rationality, and imperfect information), the predicted carbon sequestration might be lower because some landowners might not adopt the practices or might adopt suboptimal ones. The model might be overestimating sequestration.
   Step 5: Empirical check: Have similar models been validated? What do studies say about adoption rates of carbon sequestration practices? If empirical studies show lower adoption rates, then the model might be optimistic.
   Step 6: Decision relevance: The model is being used to justify development by showing that the carbon loss from development will be offset. If the model overestimates sequestration, then the offset might not be achieved, leading to a net increase in carbon. This is a problem because the permit requires no net loss (or net gain) in carbon. The direction of error is critical: overestimation of sequestration is bad for the environment.
   Step 7: Value judgment: The model does not account for the risk of non-adoption. The decision to allow development based on this model might be risky. But the board might have a policy that allows for probabilistic outcomes. If the model does not provide a probability distribution (just a point estimate), then we are making a value judgment about how much risk is acceptable. However, the reviewer might feel that the model is too optimistic and that the development should be blocked, but that is a value call about risk tolerance. The procedure might reveal that the model's assumption leads to an overestimate, and without adjustment, the permit might not meet the standard. But note: the reviewer's personal desire to block the development should not influence the technical assessment.

   Conclusion for Example 2: 
     We might reject the model if the overestimation is likely and significant. However, if the model includes a conservative adjustment (e.g., they assume 100% adoption but then discount by a factor based on historical adoption), then it might be acceptable. Without such adjustments, and given the risk of overestimation, we might require a sensitivity analysis or a more realistic model. If the model has been validated in similar contexts, we might accept. But without that, and because the false assumption is central and the risk is high (overestimation of the offset), we might reject the model for this permit.

   Example 3: Model with perfect-info agents predicting restoration success used to justify minimal long-term monitoring.

   Step 1: Critical prediction: The success of the restoration (e.g., that the wetland will achieve certain functional criteria within a short time and then remain stable).
   Step 2: False assumption: Perfect information among agents (e.g., the restorers, or the natural processes being modeled as agents? Actually, this might refer to the model of how the ecosystem responds, but let's assume it's about human agents managing the restoration).
   Step 3: Role: The model assumes that because agents have perfect information, they will take exactly the right actions at the right time, leading to high success with minimal need for monitoring and adjustment. This leads to the prediction that the restoration will be successful without much monitoring.
   Step 4: Sensitivity: If we relax to imperfect information, then the restorers might make mistakes, miss early signs of problems, and the restoration might fail or underperform. Therefore, the model might overestimate the success rate and underestimate the need for monitoring.
   Step 5: Empirical check: What do studies say about restoration projects and their success rates? Is there evidence that projects with minimal monitoring have succeeded at the same rate as those with more? Typically, adaptive management (which requires monitoring) is considered best practice.
   Step 6: Decision relevance: The model is being used to justify minimal monitoring. If the model is too optimistic, then the lack of monitoring might lead to undetected failure, and the mitigation bank might not provide the promised services. This is a problem for the permit because the bank is supposed to compensate for lost services.
   Step 7: Value judgment: How much monitoring is enough? This is a risk management question. The model's assumption of perfect information might be hiding the uncertainty inherent in restoration. The board might have a policy that requires a certain level of monitoring. The model might be trying to bypass that by predicting perfect success. This is a values call about how much risk to accept? But note: the model's prediction of success might be overestimated, so the justification for minimal monitoring is weak.

   Conclusion for Example 3: 
     We might reject the model because the false assumption directly leads to underestimating the need for monitoring. Without monitoring, the project could fail without recourse. Therefore, the model should not be used to justify minimal monitoring. We might require a more realistic model that accounts for uncertainty and the need for adaptive management.

   Final Procedure Steps (with explicit questions and stopping points):

   Step 1: What is the critical prediction for the permit decision?
      - Sufficient answer: A clear statement of the model's output that is being used to justify the permit (e.g., "The model predicts X, which is used to determine that the mitigation bank will provide Y ecosystem service to offset the loss").
      - If the prediction is not clearly tied to the permit decision, stop and require clarification.

   Step 2: What are the key assumptions that are known to be false?
      - Sufficient answer: List of assumptions that are unrealistic and relevant to the critical prediction.

   Step 3: How do the false assumptions contribute to the critical prediction?
      - Sufficient answer: A causal link showing that the assumption is used in the model to derive the prediction. If the assumption is peripheral (e.g., the model would give the same prediction without it) then it might not matter. But if it is core, then we proceed.

   Step 4: What happens if we relax the false assumption? (Sensitivity)
      - Sufficient answer: Either:
          a) The model authors provide a sensitivity analysis showing that the critical prediction does not change significantly when the assumption is relaxed (within a reasonable range), OR
          b) We can reason that the change would be small and in a direction that does not harm the decision (e.g., the model might be conservative in its prediction of the required mitigation).
      - If the sensitivity analysis or reasoning shows that the critical prediction changes significantly in a way that undermines the permit (e.g., the required mitigation would be much higher, or the success probability much lower), then stop and reject the model (unless there's strong empirical support in step 5).

   Step 5: Is there empirical evidence that the model's predictions are accurate despite the false assumption?
      - Sufficient answer: Data from similar applications showing that the model's predictions matched observed outcomes. Peer-reviewed validation studies are ideal.
      - If there is strong empirical support, then the false assumption might not matter (Friedman's point). If there is none, then we rely on steps 4 and 6.

   Step 6: What is the direction and magnitude of the error if the false assumption leads to inaccuracy?
      - Sufficient answer: We determine if the model is likely to be biased in a way that matters for the decision. For example:
          - Underestimation of required mitigation: leads to under-compensation -> reject.
          - Overestimation of risk: might lead to over-mitigation, which is safe but might be acceptable if the costs are borne by the developer and the environment benefits.
      - If the inaccuracy is in a direction that would lead to a violation of the permit's environmental standards, then reject the model.

   Step 7: Are we being asked to accept a value judgment hidden by the model?
      - Sufficient answer: The model might embed trade-offs (e.g., between different ecosystem services) or risk preferences that are policy decisions. We must check if the model is making a value call that should be made by the board or by law. 
      - If the model is making a value judgment that is beyond the scope of the board's guidelines, then stop and note: "This is a values call, not mine." We might require the model to be adjusted to reflect the board's values or to present the trade-off explicitly for the board to decide.

   Where we have to make a judgment call:
      - If after steps 1-7 there is still uncertainty (e.g., the sensitivity is unknown and there is no empirical data, but the model is the best available), then we must use our judgment. We note the uncertainty and the potential risks.

   The procedure cannot:
      - Resolve disputes about fundamental values (step 7 is about flagging, not resolving).
      - Provide a definitive answer when data is lacking and reasoning is inconclusive.
      - Replace expert judgment entirely, but it structures the process.
answer: |-
  ### Decision Procedure for Evaluating Mitigation-Bank Valuation Models  
  Based on Friedman’s F-twist ("assumptions don’t need to be realistic if predictions are reliable") and philosophy of science (e.g., Cartwright’s *How the Laws of Physics Lie*), this procedure tests whether **unrealistic assumptions materially affect the model’s prediction for the specific permit decision**. It prioritizes empirical adequacy and decision robustness over theoretical purity.  

  ---

  #### **Step-by-Step Procedure**  
  **Time budget:** 45–60 minutes per proposal.  
  **Tools:** Pencil, paper, and basic spreadsheet (if needed).  

  1. **Identify the Critical Prediction**  
     - **Question:** *"What exact numerical output from this model is used to justify the permit decision?"*  
     - **Sufficient answer:** A specific, quantifiable prediction (e.g., "12 acres of wetland needed for flood control," "50,000 tons of carbon sequestered").  
     - **Stop if:** The prediction is vague or not directly tied to the permit. → **Reject the model.**  

  2. **Pinpoint the False Assumption**  
     - **Question:** *"Which assumption(s) are demonstrably false in this context?"*  
     - **Sufficient answer:** Clear statement of the unrealistic assumption (e.g., "perfect substitutability between ecosystem services," "all landowners have perfect information").  
     - **Stop if:** The assumption is irrelevant to the prediction (e.g., assumes spherical cows in a vegetation model). → **Proceed** (per F-twist).  

  3. **Trace Causal Pathways**  
     - **Question:** *"Does this false assumption *directly* determine the critical prediction?"*  
       - *Yes*: Proceed to Step 4.  
       - *No*: The assumption is peripheral (e.g., assumes rational agents but prediction depends on aggregate statistics). → **Accept the model** (per F-twist).  
     - **Judgment call:** If the causal link is ambiguous, sketch a quick influence diagram (5 mins).  

  4. **Test Sensitivity to Realism**  
     - **Question:** *"If we replace the false assumption with a realistic one, does the prediction change by >10%?"*  
       - **Use:** Back-of-envelope calculations, existing literature, or model documentation.  
       - **Sufficient evidence:**  
         - Empirical data showing low sensitivity (e.g., "studies show heterogeneous landowners sequester carbon within 5% of homogeneous models").  
         - Modeler’s sensitivity analysis proving robustness.  
       - **Stop if prediction shifts >10%**: → **Reject the model** (the assumption matters).  
       - **Stop if change is trivial**: → **Accept the model** (the assumption is harmless).  

  5. **Assess Decision Robustness**  
     - **Question:** *"Could the prediction error (from the false assumption) lead to a different permit decision?"*  
       - **Check:** Direction of bias (e.g., does the false assumption systematically overestimate benefits?).  
       - **Sufficient answer:**  
         - Error favors environmental protection (e.g., overestimates required mitigation) → **Accept the model** (safe-side error).  
         - Error risks underprotection (e.g., underestimates needed acreage) → **Reject the model**.  
       - **Values call:** If the error magnitude is small but crosses a regulatory threshold (e.g., 49% vs. 51% success probability). → **Flag for policymakers.**  

  6. **Values Check**  
     - **Question:** *"Does the model hide a value judgment (e.g., weighting of services) that should be decided by policymakers?"*  
       - **Stop if:** The model embeds contested trade-offs (e.g., "1 acre of nesting habitat = 1 acre of filtration") without transparency. → **"This is a values call, not mine."**  

  ---

  ### **Application to Cases**  
  #### **Case 1: Perfect Substitutability for Flood-Control Acreage**  
  - **Step 1:** Prediction = "8 acres needed for flood control."  
  - **Step 2:** False assumption = "Nesting habitat and water filtration are perfectly substitutable."  
  - **Step 3:** **Directly causal** (model aggregates dissimilar services into a single "flood control" metric).  
  - **Step 4:** Realistic substitution is low (e.g., nesting habitat may not reduce runoff). Sensitivity test: If substitutability drops to 0.5, required acreage jumps to 12 acres (>10% change). → **Reject the model.**  
  - **Step 5:** Error risks underprotection (underestimates acreage). **Stop: Reject.**  

  #### **Case 2: Homogeneous Rational Agents for Carbon Sequestration**  
  - **Step 1:** Prediction = "Project will sequester 50,000 tons of CO₂ over 50 years."  
  - **Step 2:** False assumption = "All landowners are identical rational actors with perfect soil carbon knowledge."  
  - **Step 3:** **Indirectly causal** (prediction depends on aggregate land-use choices).  
  - **Step 4:** Literature shows heterogeneous landowners reduce sequestration by 15–30% (e.g., imperfect adoption of practices). Prediction could drop to 35,000 tons (>10% change). → **Reject the model.**  
  - **Step 5:** Error risks overestimating carbon storage, allowing under-mitigated development. **Stop: Reject.**  
  - **Note:** Your desire to block development is irrelevant; procedure flags objective risk.  

  #### **Case 3: Perfect-Info Agents for Minimal Monitoring**  
  - **Step 1:** Prediction = "95% probability of restoration success with 2 years of monitoring."  
  - **Step 2:** False assumption = "Restoration managers have perfect information."  
  - **Step 3:** **Directly causal** (justifies minimal monitoring by assuming no surprises).  
  - **Step 4:** Realistic uncertainty (e.g., pest outbreaks, climate shocks) drops success probability to 75–80% with short monitoring. → **Reject the model.**  
  - **Step 5:** Error risks underprotection (failure undetected without monitoring). **Stop: Reject.**  
  - **Step 6:** Model implicitly values cost savings over ecological risk. → **Also flag as "values call."**  

  ---

  ### **What the Procedure Can’t Do**  
  1. **Fix bad models:** Only evaluates assumptions for *this specific prediction*.  
  2. **Resolve value conflicts:** Flags hidden trade-offs but can’t decide societal priorities.  
  3. **Replace data:** Relies on existing literature or quick tests; won’t work if no evidence exists.  
  4. **Predict the future:** Confirms model adequacy, not ground truth.  
  5. **Override regulations:** If a model passes but violates state rules, permit still fails.  

  ### **When to Stop**  
  - **Reject the model:** If Steps 3–5 show the false assumption materially harms the decision (≈30 mins).  
  - **"Values call"**: If Step 6 exposes normative trade-offs (≈5 mins).  
  - **Judgment call:** If sensitivity is unknown (e.g., no data exists). Document uncertainty and proceed cautiously.  

  This workflow ensures unrealistic assumptions are only tolerated if they don’t distort the permit outcome—aligning with Friedman’s pragmatism while guarding against ecological risks.
