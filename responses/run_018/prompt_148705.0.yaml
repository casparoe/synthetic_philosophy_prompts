prompt: |-
  In zoning appeals across several U.S. and European municipalities, boards routinely treat the loss of sunlight or a protected view corridor suffered by an existing homeowner as a concrete, compensable injury warranting denial or mitigation, while treating the exclusion of prospective residents—who are blocked from housing by the same height or density restriction—as a non-injury that requires no remedy. I am trying to map the implicit philosophy of urban property embedded in that asymmetry. What theory of rights or distributive justice does the practice presuppose? Does it depend on a first-possession or temporal-priority account of spatial entitlement, on a zero-sum commons model of the built environment, or on a generational-bounded view of justice that weights present owners over future inhabitants? Reconstruct the implicit view, distinguish what the practice strictly requires from what it merely accommodates, and say whether it can be rendered consistent with a right-to-the-city framework that treats housing access as a claim against exclusionary control. If the underlying theory were replaced by an intergenerational equity model—say, one in which shadow-footprints and view-obstructions are priced as transferable development rights rather than as veto-entitlements—what specific mechanisms in the appeals process and in compensation rules would have to change?
reasoning: |-
  Okay, the user is asking about zoning appeals and the asymmetry in how existing homeowners' losses versus prospective residents' exclusion are treated. Let me start by breaking down their query. They mention that in zoning appeals, losing sunlight or a view is considered a compensable injury for current homeowners, while blocking new residents through height or density restrictions isn't seen as an injury. They want to understand the implicit philosophy behind this, including theories of rights, distributive justice, and whether it aligns with the right-to-the-city framework.

  First, I need to map out the implicit philosophy. The user suggests possibilities like first-possession, zero-sum commons, or generational-bounded justice. Let me recall relevant theories. The existing practice seems to prioritize current property owners' interests, especially their use and enjoyment rights. That points towards a Lockean view where ownership includes rights to light and views as part of property. Temporal priority makes sense here—those who got there first have stronger claims. 

  Then there's the zero-sum aspect. The built environment is treated as a fixed resource. Adding density takes away from existing owners' amenities, so denying new housing protects those amenities. Also, generational justice is skewed towards present owners, ignoring future residents' needs. This ties into the non-recognition of exclusion as harm, which might stem from seeing housing access as a market commodity rather than a right. 

  Next, distinguishing what the practice requires versus accommodates. The strict requirement is to protect existing property rights against new developments. Compensation or mitigation for sunlight/view loss is mandatory. What it accommodates is the exclusion of new residents, treating it as a non-issue. The right-to-the-city framework, which sees housing as a right, conflicts with this because exclusion is seen as a harm. So the current practice isn't consistent with that framework unless exclusion is addressed.

  The user also asks about replacing the underlying theory with intergenerational equity, using TDRs for shadows and views instead of veto power. Here, mechanisms like shadow pricing, TDR systems, and impact fees would need to change. Appeals boards would shift from veto decisions to compensation assessments. Compensation rules would require developers to buy rights, creating a market-based solution. This reduces veto power, making development possible but costly, which could still hinder affordable housing. 

  I should also consider the user's deeper needs. They might be looking for a critique of current zoning practices and alternatives that promote housing access and equity. They could be involved in urban planning, law, or advocacy, seeking arguments for policy changes. The mention of right-to-the-city suggests they care about social justice in urban spaces. So, addressing how to make systems more inclusive and suggesting practical reforms like TDRs and impact fees would be relevant. 

  Need to ensure the response covers all parts: reconstructing the implicit view, distinguishing practice requirements, consistency with right-to-the-city, and specific changes for intergenerational equity. Also, highlight the tensions in implementing new models, like market mechanisms potentially excluding affordable housing unless subsidized.
answer: |-
  The asymmetry you identify reveals a deeply embedded **temporal-priority theory of spatial entitlement** combined with a **static, zero-sum model of the built environment**, underpinned by a **generational boundedness in distributive justice**. Here's a reconstruction of the implicit philosophy and its implications:

  ### Core Implicit Philosophy
  1. **Temporal Priority as Moral Foundation (First-Possession Model):**  
     Existing homeowners are seen as having acquired "vested rights" to environmental amenities (sunlight, views) through prior occupation. This echoes Locke's labor-mixing theory: by improving/maintaining property, owners annex adjacent spatial resources. New development is framed as an *invasion* of pre-established entitlements.

  2. **Zero-Sum Spatial Commons:**  
     Sunlight and views are treated as finite, rivalrous goods. Increased density directly "takes" from existing owners. The exclusion of future residents isn't perceived as an active harm because housing access is viewed as a market commodity (not a spatial right), and unbuilt space isn't considered "owned" by anyone.

  3. **Generational Presentism:**  
     Justice obligations are bounded to current legal persons. Prospective residents lack moral standing because they:  
     - Are unidentifiable ("statistical persons")  
     - Have no existing investments to protect  
     - Their claims are deferred to market mechanisms (filtering, new construction elsewhere).

  4. **Injury Hierarchy:**  
     **Tangible Injury:** Measurable loss to existing property (e.g., shadow studies, view cones = diminished market value).  
     **Intangible Non-Injury:** Exclusion is abstract, diffused, and lacks immediate causation ("the market will adjust").

  ### What the Practice Strictly Requires vs. Accommodates
  | **Element**               | **Strictly Requires**                                  | **Accommodates**                                      |
  |---------------------------|-------------------------------------------------------|-------------------------------------------------------|
  | **Existing Owners' Rights** | Protection against *physical invasions* (shadows)     | Veto power over neighborhood change                   |
  | **Prospective Residents** | No positive entitlement to access specific location   | Exclusion as natural market outcome                   |
  | **Remedy Mechanism**      | Mitigation/denial for physical impacts                | No remedy for exclusion; market alternatives assumed |

  ### Consistency with "Right-to-the-City" (RTC) Framework
  The practice is **fundamentally incompatible** with RTC principles. RTC treats urban space as a collective resource where housing access is a social claim against exclusion. Key conflicts:
  - **RTC Core:** Housing justice demands dismantling exclusionary control.  
  - **Current Practice:** Legitimizes exclusion as property-rights protection.  
  - **Asymmetry:** Recognizes owners' aesthetic/amenity interests as rights, but dismisses residents' shelter needs as market preferences.

  *Potential Limited Alignment:* Only if "mitigation" for owners were directly linked to inclusionary outcomes (e.g., shadow compensation funding affordable housing)—which current systems avoid.

  ### Shifting to Intergenerational Equity: Required Mechanisms
  An equity model treating environmental impacts as *shareable burdens* rather than *veto rights* would require restructuring:

  **1. Appeals Process Changes:**  
     - **Impact Quantification:** Mandate shadow/view obstruction metrics (e.g., "shadow-hours per unit") rather than binary harm assessments.  
     - **Third-Party Standing:** Allow housing advocates to represent excluded populations in appeals.  
     - **Balanced Test:** Replace "harm mitigation" with "net community benefit" standard weighing inclusion gains against amenity losses.

  **2. Compensation Rule Changes:**  
     - **Transferable Development Rights (TDRs) 2.0:**  
       - **Shadow Banking:** Create TDR markets where developers purchase "shadow credits" from affected owners.  
       - **View Easements:** Allow view corridor claims to be severed from land titles and traded.  
     - **Impact Fees with Equity Linkage:**  
       - Fee schedules for shadow/view impacts fund *on-site affordable units* or community land trusts.  
     - **Sunlight/View Insurance Pools:** Collective compensation funds financed by development fees (not project-specific vetoes).

  **3. Systemic Shifts:**  
     - **Sunset Clauses:** View protections expire after 10–20 years unless renewed via community-wide vote.  
     - **Density Bonuses:** Automatic height increases if >30% affordable units offset shadow costs.  
     - **Intergenerational Trusteeship:** Planning boards mandated to assess "future resident impact statements."

  ### Tensions in Implementation
  - **Veto to Commodity:** Trading shadow rights maintains propertization but reduces exclusionary power. However, it risks financializing exclusion (only luxury developers afford credits).  
  - **Affordability Trade-off:** Market-based compensation may inflate housing costs. Requires *targeted subsidies* (e.g., TDR density bonuses for affordable housing).  
  - **Cultural Shift:** Needs reconceptualizing "property" from absolute dominion to stewardship of temporal resources.

  This reframing wouldn't eliminate tensions but would force explicit weighing of intergenerational claims—treating space as a dynamic resource rather than a frozen hierarchy of temporal privilege. The path dependency of existing ownership remains, but its gatekeeping power is curtailed by compensating rather than vetoing change.
