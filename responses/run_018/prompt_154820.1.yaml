  Okay, I'm creating an exam question for an upper-level metaethics final. The user wants it focused on the wrong-kind-of-reasons problem but framed around a fictional government policy called the "Virtue Ledger." This policy tracks charitable acts, calculates an integrity score, and ties it to tax rebates and social stigma. 

  The deliverables are clear: a detailed essay prompt, a model answer outline, and a marking rubric totaling 30 marks. The user specified avoiding simple explanations of WKR and instead pushing students to analyze how different reasons interact in this policy context. 

  First, I consider the essay prompt. It needs to be provocative - presenting the Virtue Ledger as a plausible but ethically questionable system. I'll include key details: audit requirements, scoring algorithm, tax benefits for high scores, and stigma for low scores without legal penalties. The word limit is ~1200 words, so I'll keep the scenario description concise but rich enough for analysis. 

  For the philosophical hook, I'll explicitly reference Scanlon's WKR problem and contrast two approaches: Williams' internal reasons versus rationalist accounts. This forces students to apply theory rather than regurgitate definitions. I'll add a typo ("recieve") to match the casual tone request.

  Next, the model answer outline. The crux is distinguishing moral/prudential/social reasons in the Ledger context. I'll structure it to show:
  - How the tax rebate creates prudential reasons that may "crowd out" moral motivation
  - Why social stigma produces alienating external pressure 
  - Whether moral reasons can coexist with incentives or get corrupted
  - Potential redesigns like anonymized scoring to mitigate WKR issues

  The rubric needs strict differentiation between WKR (8 marks) and psychological overjustification (which is distinct). For the 10 marks on reason types, I'll emphasize clear separation of moral/prudential/social. The internal/external reason discussion (7 marks) must go beyond name-dropping Williams. The conclusion (5 marks) should thoughtfully weigh "corruption versus accompaniment" - does the Ledger destroy virtue or just add layers?

  I'm avoiding bibliographic requests per instructions. Instead, I'll focus on conceptual rigor: penalizing students who confuse WKR with empirical psychology or fail to dissect the Ledger's multi-layered incentives. The typo ("dont") keeps it casual while maintaining academic depth.
answer: |-
  ## Metaethics Final Exam: Virtue Ledger & The Right Reasons? (90 Minutes, 30 Marks)

  **Prompt (Approx. 500 words):**

  Imagine the government introduces the "Virtue Ledger" (VL) policy. Citizens must register significant charitable donations or volunteer hours (over a threshold, audited by a new agency). An algorithm synthesizes this data into a publicly accessible "Integrity Score" (1-100). Crucially:

  *   Citizens with scores above 80 receive an automatic 5% annual tax rebate.
  *   Citizens with scores below 30 have their score flagged on the public registry (highlighted red). While this carries *no legal penalty*, the government explicitly states it hopes this will "encourage social accountability" and expects employers, social groups, and communities to "consider an individual's demonstrated commitment to societal good."
  *   Scores between 30-80 are visible but unmarked.

  The stated goal is to "incentivize genuine generosity and build a more compassionate society." Proponents argue it makes virtue tangible and rewards good citizens. Critics argue it turns morality into a transactional game and undermines the very value it seeks to promote.

  **Your Task:** Analyze whether the Virtue Ledger provides citizens with the *right kind of reasons* to be generous. Use the "Wrong Kind of Reasons" (WKR) problem as your central framework.

  *   Clearly explain the WKR problem (e.g., as raised by Scanlon concerning blame/attitudes) and why it matters for judging the *character* of a reason. Dont confuse it with the psychological overjustification effect (though you may mention it briefly if relevant).
  *   Identify and distinguish at least **three distinct types of reasons** the VL might give someone to perform a charitable act: (1) Reasons stemming *directly* from the desire to be generous/do good (if any), (2) Reasons stemming from the desire for the tax rebate, and (3) Reasons stemming from the desire to avoid the social stigma of a low score.
  *   Engage with **one** major philosophical approach to distinguishing the "right kind" of reasons relevant here. You **must** choose **ONE** of the following to apply:
      *   **Bernard Williams' Internal Reasons Thesis:** Does the VL create genuine *internal* reasons? Or are the tax/stigma reasons merely *external* pressures that don't connect to the agent's subjective motivational set (beyond the desire for money/avoiding shame itself)? What does this imply about whether these are reasons *to be generous*?
      *   **Rationalist Accounts (e.g., Scanlon, Parfit):** Could the tax rebate or avoidance of stigma be a *sound* or *authoritative* reason *for* being generous? Or do these reasons fail a normative test (e.g., could they be cited *within* a justification of generosity itself, or do they appeal to something outside the value of generosity/morality)? Does the institutional framing change what counts as a normative reason?
  *   **Crucially:** Does the VL *necessarily corrupt* the moral reason to be generous (replacing it or distorting it), or does it merely *add* parallel prudential/social incentives that *accompany* the moral reason? Could the VL potentially be *redesigned* (e.g., changing the rewards/punishments, transparency, or framing) to avoid generating the "wrong kind" of reasons while still promoting generosity? Be specific in your suggestions and reasoning.

  **Conclude** with your judgment: Does the Virtue Ledger, as described, provide the right kind of reasons to be generous? Why or why not? What does this case reveal about the relationship between institutional incentives and moral motivation?

  *(Word Limit: ~1200 words)*

  ---

  **Model Answer Outline (Hitting Key Points):**

  1.  **Introduction (Setting the Stage):**
      *   Briefly describe the Virtue Ledger (VL) policy and its core mechanisms (audit, score, tax rebate, public stigma).
      *   State the core ethical question: Does the VL provide the *right kind of reasons* to be generous?
      *   Introduce the WKR problem as the central analytical tool: The challenge of distinguishing reasons *for* having an attitude (e.g., valuing generosity) from reasons that are merely *incentives* to *appear* to have or act on that attitude, which might be the "wrong kind" of reason for the attitude itself. Emphasize it's a *conceptual/normative* problem, not (just) a psychological one about motivation crowding out.

  2.  **Applying the WKR Problem to the Virtue Ledger:**
      *   **Identify Three Distinct Reasons:**
          *   *(Potential) Moral Reason (MR):* The reason stemming from the inherent value of helping others, compassion, or fulfilling a perceived moral duty. (Does the VL directly strengthen this? Or obscure it?)
          *   **Prudential Reason (PR - Tax Rebate):** The reason to donate/volunteer *in order to* recieve the 5% tax rebate. This is instrumental, self-interested.
          *   **Social Reason (SR - Stigma Avoidance):** The reason to donate/volunteer *in order to* avoid the public shame, potential social exclusion, or reputational damage associated with a low score.
      *   **WKR Analysis:** Argue that PR and SR are prime candidates for being the "wrong kind" of reasons *for being generous* (i.e., for cultivating or acting from genuine generosity).
          *   *Why?* They are not reasons that speak to the *value* or *goodness* of generosity itself. They are external incentives (money, social pressure) to *perform actions* that *look like* generosity or are *defined* as generosity by the system. They are reasons to *game the system* or *avoid punishment*, not necessarily reasons to *care* about others or value giving. The VL attaches these powerful non-moral incentives directly to the *performance* of acts labelled "generous".

  3.  **Engaging with a Philosophical Distinction (Choose ONE):**
      *   **Option A: Williams' Internal Reasons:**
          *   Explain: A reason for Agent A to φ must be grounded in A's "subjective motivational set" (S) – their desires, dispositions, commitments – potentially via sound deliberation.
          *   **Application to VL Reasons:**
              *   *MR:* Likely internal *if* the agent already has some element in S related to compassion/duty. The VL *might* make this reason more salient/prominent via publicity.
              *   *PR:* This creates a *new* desire (for money) linked *instrumentally* to charitable acts. It *is* internal (if the agent desires money/rebate) but is it a reason *to be generous*? No, it's a reason *to get money by doing VL-approved actions*. It potentially bypasses or overrides any internal *moral* motivation related to generosity itself.
              *   *SR:* Creates a desire to avoid shame/social exclusion, again linked instrumentally to VL-approved actions. Internal (if avoiding shame is in S), but again, not a reason *for valuing generosity*; it's a reason *to avoid pain* by performing specific actions.
          *   **Conclusion for Williams:** VL primarily generates new *internal but non-moral* reasons (PR, SR) that are reasons *to perform actions*, not reasons *to be generous*. It risks *replacing* internal moral reasons with internal prudential/social ones. The "reason to be generous" might become obscured or irrelevant.
      *   **Option B: Rationalist Accounts (e.g., Scanlon):**
          *   Explain: Reasons are facts that count in favor of an action/attitude, justifiable within a framework of what we owe to each other or rational deliberation. Authoritative reasons are those that withstand scrutiny.
          *   **Application to VL Reasons:**
              *   *MR:* The needs of others, fairness, etc., are potential normative reasons for generosity – facts that count in favor of acting generously.
              *   *PR:* The fact that you get a tax break for doing X. Is this a *normative reason for generosity*? Does it speak to the *value* of generosity? Or is it an *external incentive*? Likely the latter – it's not a fact about why generosity is good, it's a fact about a reward attached to it. It seems like the "wrong kind" of reason for the attitude/value itself.
              *   *SR:* The fact that you will be publicly shamed if you don't do X. Similar issue: This is a fact about social pressure/consequences, not a fact about the moral worth of generosity. It's coercive, not justificatory.
          *   **Conclusion for Rationalists:** The institutional framing of the VL attaches potent non-moral incentives (PR, SR) to moral acts. While these might be reasons *to do the act*, they are not sound normative reasons *for being generous* or *for valuing generosity itself*. They potentially distort the normative landscape by making the *incentive*, not the *moral value*, the primary justifier for action.

  4.  **Corruption vs. Accompaniment & Redesign:**
      *   **Necessary Corruption?** Argue the VL *strongly risks corrupting* the moral reason. The powerful PR and SR are likely to become dominant motives, *especially* because they are quantifiable, guaranteed (rebate), or powerfully aversive (stigma). The MR risks becoming instrumentalized – "I do this *for* the score/rebate/avoidance", not *because* it's good. The publicity and audit intensify this. It's not *guaranteed* corruption (someone might focus on the MR despite the system), but the structure *strongly incentivizes* focusing on the WKRs.
      *   **Mere Accompaniment?** Unlikely. The WKRs (PR, SR) are directly tied to the *performance* of the act defined as generous by the system. They aren't parallel but separate incentives (like a separate lottery); they are fused onto the *same performance*. This fusion makes it extremely difficult for the MR to remain pure or primary.
      *   **Potential Redesigns to Mitigate WKR:**
          *   **Remove Tangible Incentives:** Eliminate the tax rebate entirely. Remove the *mandatory* public flagging of low scores (make full registry opt-in or anonymized aggregates only). Sever the direct link to powerful non-moral rewards/punishments.
          *   **Focus on Recognition, Not Reward:** Publish *only* high scores (as recognition, not tied to money), or publish anonymized community averages to foster collective pride without individual stigma/reward. Emphasize information and inspiration over incentive.
          *   **Reframe the "Why":** Government messaging should *exclusively* focus on the inherent value of generosity and societal benefit, *never* mentioning the score as a means to reward/avoid punishment. Decouple the institutional mechanism from instrumental messaging.
          *   **Reduce Audit/Scorability:** Only track very large contributions or specific, hard-to-fake volunteer roles? Make the score less granular? Reduce the sense of "gaming" a precise system. *(Note: These redesigns likely make the VL far less "effective" as a behavioral nudge, highlighting the tension).*

  5.  **Conclusion:**
      *   Restate judgment: The Virtue Ledger, as described, overwhelmingly provides the *wrong kind of reasons* (prudential PR and social SR) for generosity, crowding out and corrupting the potential moral reason (MR).
      *   Key takeaway: While institutions can promote moral behavior, directly attaching significant non-moral incentives (especially financial rewards and public stigma) to the *performance* of specific acts deemed moral creates powerful WKRs. These WKRs risk transforming the act from something done for its own sake into a transaction or a means of social compliance, fundamentally undermining the genuine moral motivation the policy aims to cultivate. The case starkly illustrates the difficulty of promoting virtue through external mechanisms without distorting the nature of virtue itself.

  ---

  **Marking Rubric (Total: 30 Marks)**

  | Criteria                                                                                                                               | Marks | Descriptor                                                                                                                                                                                               |
  | :------------------------------------------------------------------------------------------------------------------------------------- | :---- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Correct Statement & Application of WKR Problem**                                                                                  | **8** | **8-7:** Precise explanation of WKR (distinguishing reasons *for* attitude from incentives/effects). Explicitly avoids confusion with overjustification. Clear application to VL showing *why* PR/SR are WKR candidates. <br>**6-5:** Generally correct WKR explanation, minor imprecision. Some application to VL, may blur with overjustification slightly. <br>**4-2:** Weak/muddled WKR explanation. Significant confusion with overjustification. Poor application to VL. <br>**1-0:** Incorrect or missing WKR explanation. |
  | **2. Identification & Distinction of Reasons in VL Context**                                                                           | **10**| **10-9:** Clearly identifies and distinguishes **at least three** reason types (e.g., Moral, Prudential-Tax, Social-Stigma). Sophisticated analysis of their distinct sources, nature, and interaction within VL mechanics. <br>**8-7:** Identifies three types, mostly clear distinction. Good analysis, perhaps lacking some depth on interaction. <br>**6-5:** Identifies three types but distinction is unclear or analysis superficial. Or only identifies two types well. <br>**4-2:** Only identifies one or two reason types vaguely. Little meaningful distinction or analysis. <br>**1-0:** Fails to identify distinct reason types relevant to WKR. |
  | **3. Engagement with Chosen Distinction (Internal/External OR Rationalist)**                                                          | **7** | **7:** Deep, accurate engagement with **one** chosen framework (Williams *or* Rationalist). Clear explanation of the distinction. Sophisticated application to VL reasons, showing how it helps judge PR/SR as WKR. <br>**6-5:** Good engagement with chosen framework, mostly accurate. Clear application to VL. <br>**4-3:** Basic explanation of chosen framework, some inaccuracies. Application to VL is present but weak or unclear. <br>**2-1:** Very weak/misleading explanation of chosen framework. Little or incorrect application to VL. <br>**0:** Missing or entirely incorrect framework. *(Penalize -1 for citing obscure texts/name-dropping without meaningful use)* |
  | **4. Analysis of Corruption vs Accompaniment & Redesign**                                                                              | **5** | **5:** Nuanced argument on whether VL *corrupts* or merely *accompanies* moral reasons. Clear reasoning why corruption is likely. At least one plausible, non-trivial redesign suggestion focused on mitigating WKR, with justification. <br>**4:** Good argument on corruption/accompaniment. Reasonable redesign suggestion. <br>**3:** Basic argument on corruption, perhaps simplistic. Redesign suggestion present but weak/unclear justification. <br>**2:** Weak or confused argument on corruption. Minimal or no redesign suggestion. <br>**1-0:** Missing or irrelevant discussion. |
  | **General:** Clarity, Structure, Logic, Staying within Scope. *(Penalize -1 for requesting bibliography/citations, -1 for significant typos/grammar hindering clarity beyond "dont"/"recieve")* |       | **Positive:** Well-structured, logical flow, clear writing, addresses prompt directly. <br>**Negative:** Disorganized, illogical, rambling, significantly off-topic, excessive typos hindering meaning.                                                                 |

  **Total:** /30
