  The declassification paradox is the real challenge. Normally looping stabilizes categories, but here activists used the classification against itself to destroy it. This isn't a model break - it's looping in reverse gear. The "homosexual" kind didn't disappear; it shed the pathology but kept the identity scaffolding. That's crucial - declassification required the very subject it created.

  Where Hacking's theory feels thin is explaining why some interactive kinds die while others persist. The 1973 victory depended on specific conditions: gay activists leveraging psychiatry's authority crisis, finding sympathetic researchers like Evelyn Hooker. Without that alignment, the category might've stuck like "hysteria" did for decades. That's a limitation worth flagging.

  User clearly wants theoretical honesty - "where the theory is silent, say so." They'll appreciate noting how Hacking underestimates coordinated resistance. The activism here wasn't just individual adaptation but collective category-smashing. That extends the model beyond Hacking's original focus.

