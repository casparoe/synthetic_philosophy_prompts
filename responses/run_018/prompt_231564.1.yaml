prompt: |-
  I keep coming back to this one, and I want you to actually work it rather than wave at it. When the American Psychiatric Association's board voted in 1973 to delete homosexuality from the DSM-II, it was a classification change as much as a scientific one, and it strikes me as a perfect test case for Ian Hacking's looping effects. Quick setup so we're on the same page: Hacking's claim is that some kinds don't just neutrally pick people out; the people classified learn the label, respond to it, resist it, appropriate it, and alter themselves in ways that loop back and alter the classification. Psychiatry is full of these interactive kinds. Now analyze the 1973 deletion through that lens, and be disciplined about the mapping. Before 1973, what work was the diagnosis doing, who was being made up by it, and where did the looping actually show up — not just in self-understanding but in institutions, therepy, law, and in the activism that forced the question onto the APA's agenda? Then face the hard part. Hacking's looping is usually a story about classifications pulling people in and stabilizing; declassification looks like the reverse, and in 1973 the classification was being killed off partly by the very people it classified. Does that break the model, extend it, or just show that a killed classification can leave behind the people it made? Then run it the other way and tell me what the episode does to looping theory: confirmation, limit case, or genuine anomaly. Where the theory is silent, say so instead of forcing it.
