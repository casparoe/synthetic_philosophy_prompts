prompt: |-
  I chair the quarterly continuation review of a public innovation fund. Three times a year, over two days, my committee of five — two engineers, a finance officer, a programme manager and me — decides whether each of roughly a dozen ongoing multi-year projects receives its next tranche. We have about forty minutes per project. The project teams appear in person and lobby hard, and they control most of the numbers we see: cost-to-complete, risk registers, the probability the remaining work delivers. Our recommendations go to a board that almost always accepts them, and the sums at stake in a single decision range from a few hundred thousand to tens of millions.

  I need a written procedure we can actually run in that setting, and I need it to be more discriminating than the textbook instruction to disregard sunk costs. That instruction is right often enough that I teach it to new committee members, but in something like a third of our cases the money already spent seems to carry real information, or to have created a situation in which stopping is genuinely the worse option — and in another third it merely feels that way. Telling those apart, under time pressure, with the project champion in the room, is the job.

  So give me the translation, not the theory: the questions in the order I should ask them, what counts as a sufficient answer to each, the point at which the procedure returns a definite no and we stop discussing, and the points at which it has to hand the decision back to a human being because the remaining question is one about what we care about rather than what is the case. It has to be runnable by people with no philosophy and no time; if a step cannot realistically be completed inside a forty-minute slot, say so and say what to do instead.

  I have two hunches I want you to adopt, correct or discard rather than humour. First: I have been separating reasons for continuing into ones that work at the level of this single project and ones that work only at the level of a standing policy — the partner who will never co-fund with us again if we abandon a demonstrator plant, the signal sent to future applicants about how we behave when costs overrun. My test for the second kind is whether we would want a rule with that content and whether we could publish it in our guidelines without inviting manipulation. I suspect this is also the place where bad arguments hide, since almost any project-specific reason can be redescribed as a policy. Second: I suspect some of our projects have sharply increasing returns to completion — the final tranche is where nearly all the value sits, so that the earlier spend is what makes the remaining spend worth making — and that this thought is doing more work in my reasoning than I can currently defend or bound.

  The procedure must survive three hard cases: the champion whose career is tied to continuation and whose cost-to-complete estimates have already been wrong twice; the project where the only honest reason to continue is that our agency publicly promised a community or partner we would finish; and the project we would continue mainly because cancelling would read as an admission that the earlier decision was wrong.

  Then apply the finished procedure to three sketches of mine. (1) A six-year ecological monitoring network, five years in, 78 per cent of budget spent, whose dataset answers the question it was built for only at year eight, while a cheaper satellite method has since emerged that answers most of that question now. (2) A demonstrator plant at 40 per cent of budget, costs at 2.5 times the original estimate, core technical risk unresolved, with a co-funder who threatens to withdraw from all future programmes if we stop. (3) A project I personally championed six years ago, 90 per cent of budget spent, delivering everything specified in its original charter, whose remaining tranche buys an output no current user wants. At least one of these must come out with an answer I will not want to hear; tell me which, and why you think I will resist it.

  Close by telling me what the procedure cannot do — including which of its steps is most likely to be quietly corrupted by the fact that the champions supply the numbers, that we meet only quarterly, and that we never observe what happened to the projects we killed — and what single finding about our portfolio would most quickly convince you that the procedure should be withdrawn.

  No literature and no citations; I need something my finance officer can run on a Tuesday. Nine hundred words maximum, the numbered procedure first and the applications after it.
reasoning: |-
  Okay, let me tackle this systematically. The user chairs a high-stakes innovation fund review committee with very specific operational constraints and pain points. They need a practical decision procedure that fits within 40-minute project reviews, addresses psychological biases, and handles real-world complexities like sunk costs and political pressures.

  First, I'm noting three critical constraints: the 40-minute time limit, reliance on project team-supplied data, and the need to distinguish between valid sunk cost considerations versus irrational escalation. The user's two conceptual hunches about policy-level reasoning and increasing returns to completion seem central to building a robust framework.

  The core challenge appears to be designing a step-by-step filter that:
  - Explicitly separates factual analysis from value judgments
  - Builds in defenses against lobbying pressure
  - Creates clear off-ramps for termination decisions
  - Handles their three specified hard cases

  For the procedure structure, I'm considering a phased approach:
  1. Immediate termination triggers (irrecoverable failure points)
  2. Forward-looking viability assessment (isolated from sunk costs)
  3. Policy exception evaluation (with strict criteria)
  4. Final value check (admitting subjective factors)

  Each phase needs unambiguous pass/fail criteria. The termination triggers in Phase 1 must be concrete - like unresolved technical risks beyond original thresholds. For Phase 2's viability assessment, the key innovation is requiring teams to justify continuation as if starting today with only remaining costs. 

  The policy exception phase should incorporate the user's "publishable rule" test to prevent gaming. And the final check must explicitly surface any personal stakes committee members might have.

  For the application to their project sketches, the ecological monitoring case seems designed to test the sunk cost fallacy. With 78% spent but newer alternatives available, the procedure should likely recommend termination despite high sunk costs - which might trigger resistance from the user who values project completion.

  The corruption risks are predictable but manageable: teams may manipulate risk probabilities (Phase 2) or overstate policy consequences (Phase 3). The clearest failure signal would be discovering that continued projects consistently underperform terminated ones when adjusted for continuation bias.

  This approach stays within operational limits by making Phase 4 the only time-intensive discussion point, and even then capping it at 10 minutes. The whole flow respects both the clock and the political realities while institutionalizing the user's valuable instincts about policy-level reasoning.
answer: |-
  Here is your decision procedure, designed for 40-minute slots, actionable by non-experts, and incorporating your requirements. **Stop the clock at any "No" outcome.**

  **The Continuation Review Procedure (Phased Decision Tree)**

  1.  **Phase 1: Immediate Termination Triggers (5 mins)**
      *   **Q1:** Is there definitive, objective evidence the core technical objective is *unachievable* (e.g., fundamental physics violation, key component irreparably failed, required data proven unobtainable)?
      *   **Q2:** Is the project *legally non-compliant* or in *breach of a non-waivable core agreement* (e.g., safety regulation, essential permit revoked)?
      *   **Sufficient Answer:** Verifiable documentation (e.g., test report, legal notice). Committee consensus required.
      *   **Outcome:** **"No" - Recommend Termination.** Stop discussion. *Rationale: No amount of money or policy can fix this.*
      *   *(If Yes to Q1 or Q2, STOP. Else, proceed.)*

  2.  **Phase 2: Forward-Looking Viability (Isolated from Sunk Costs) (15 mins)**
      *   **Q3:** Based *only* on costs *remaining* (ignore spent) and remaining *work/risk* (use current estimates), is the *expected value* (probability of success * value of success) of completing the project **significantly greater** than the cost to complete? *Treat this as a new project starting today.*
      *   **Sufficient Answer:** Quantified comparison. Value must be demonstrable (e.g., market study, user commitment, policy mandate). "Significantly greater" means expected value > 1.5x cost to complete (adjust threshold via committee policy). Challenge probabilities and value claims rigorously.
      *   **Q4:** Is the team's *track record on cost/risk estimates for THIS project* credible? (e.g., were previous tranche estimates accurate? If not, was variance explained and learning applied?)
      *   **Sufficient Answer:** Objective comparison of past estimates vs. actuals. Justification for current estimates given past performance.
      *   **Outcome:** **"No" - Recommend Termination** if either Q3 is No *or* Q4 is No *and* no mitigating evidence overcomes the credibility gap. Stop discussion. *Rationale: Project not viable on its future merits; sunk costs irrelevant.*
      *   *(If "Yes" to both Q3 & Q4, proceed. If Q3 Yes but Q4 No, proceed ONLY if committee finds mitigating evidence overwhelming.)*

  3.  **Phase 3: Policy Exception Test (10 mins)**
      *   **Q5:** Is there a *compelling argument for continuation SOLELY based on a broader policy implication* (e.g., reputational damage, partner trust, systemic signal)? *Redescribe the argument as a general rule.*
      *   **Q6:** Could this rule be **published clearly in our official guidelines** without encouraging harmful behavior (e.g., encouraging partners to threaten withdrawal, teams to overrun budgets expecting bailouts)?
      *   **Sufficient Answer:** Explicit statement of the proposed rule. Consensus that publishing it would be defensible and not invite manipulation. *This is where "bad arguments hide" – force the policy description.*
      *   **Outcome:** **"No" - Recommend Termination** if the policy argument fails Q6. *Rationale: Policy reason is invalid or harmful if made explicit.*
      *   *(If Q6 is "Yes", proceed. This overrides Phase 2 only if Phase 2 was weak but the policy case is exceptionally strong and publishable.)*

  4.  **Phase 4: Final Value & Human Judgment (10 mins)**
      *   **Q7:** **Ignoring sunk costs and policy arguments**, does completing the project *still* represent the *best available use* of these remaining funds *compared to alternative opportunities* within our mandate? (Requires committee perspective on portfolio balance).
      *   **Q8:** **Declare any personal stakes:** Does any committee member (especially the Chair) have a *significant personal/career stake* in the outcome? (Must be stated aloud).
      *   **Sufficient Answer:** Committee deliberation. Acknowledge subjectivity. Q8 requires honesty.
      *   **Outcome:** **Decision Rendered** (Continue/Terminate). *Rationale: Final check on value-for-money and ethical transparency. Human judgment required.*

  ---

  **Application to Your Sketches:**

  1.  **Ecological Monitoring Network (5 yrs in, 78% spent, needs Yr8, satellite alternative exists):**
      *   **P1:** No. Core objective achievable.
      *   **P2 (Q3):** Cost to complete (22% budget) vs. Value? Value hinges *only* on data at Yr8. Satellite provides most value *now*, cheaper. Expected value of completion likely **< 1.5x cost to complete**. **Q4:** Track record? (Assume reasonable). **Phase 2 Outcome: NO (Terminate).**
      *   *Procedure Outcome: Recommend Termination.* You may resist because 78% feels "wasted," but the future spend buys insufficient *incremental* value over the available alternative. Sunk costs are irrelevant (Phase 2).

  2.  **Demonstrator Plant (40% spent, 250% cost, tech risk, co-funder threat):**
      *   **P1:** No (assume tech risk unresolved but not definitively impossible).
      *   **P2 (Q3):** Cost to complete (60% of *original* budget? Likely much higher based on 250% overrun) vs. Value? High if successful, but *probability* low (unresolved core tech risk). Expected value likely **< 1.5x cost to complete**. **Q4:** Track record? **NO** (costs 250% of original!). **Phase 2 Outcome: NO (Terminate).**
      *   **P3 (Q5/Q6):** Policy: "Continue if co-funder threatens withdrawal." Publishable? **NO** (invites threats, rewards failure). **Phase 3 Outcome: NO (Terminate).**
      *   *Procedure Outcome: Recommend Termination.* Hard due to co-funder, but policy exception fails publishability test. High cost, low probability, poor track record dominate.

  3.  **Your Championed Project (90% spent, delivers charter, final output unwanted):**
      *   **P1:** No.
      *   **P2 (Q3):** Cost to complete (10% budget) vs. Value? Value of final output = **Zero** (no user wants it). Expected value = **0**. **< 1.5x Cost**. **Q4:** Track record? (Assume good). **Phase 2 Outcome: NO (Terminate).**
      *   **P3:** Policy arguments (e.g., "finish what we start") fail Q6 (invites specifying useless outputs to get started).
      *   *Procedure Outcome: Recommend Termination.* You will resist hardest here. Sunk cost (90%) feels huge, and it's "your" project. But Phase 2 is clear: spending the last 10% buys *nothing* anyone wants. Finishing it is pure waste.

  ---

  **What the Procedure Cannot Do & Failure Signals:**

  *   **Cannot Do:**
      *   **Verify Team-Supplied Data:** Relies on challenging estimates (P2 Q4) but cannot audit in 40 mins. **Corruption Risk:** Teams underestimate remaining costs/risks (P2 Q3/Q4) and overstate policy impacts (P3).
      *   **Predict the Future:** Judgments on probability and value (P2 Q3) remain estimates.
      *   **Eliminate All Bias:** Declaring stakes (P4 Q8) helps, but doesn't erase them. Group dynamics matter.
      *   **Learn from Killed Projects:** No feedback loop on termination outcomes limits learning.
      *   **Handle "Admission of Wrongness":** This is sunk cost/policy (fails P2/P3). The procedure forces focus on *future* value.
  *   **Most Likely Corrupted Step:** **P2 Q3 (Future Viability Calc).** Teams control inputs (costs, prob, value), pressure is high, time is short. Easy to manipulate.
  *   **Withdraw the Procedure If:** **Continued projects consistently underperform their Phase 2 Q3 viability projections** (after controlling for continuation bias). This indicates systematic manipulation or flawed assessment that the procedure cannot catch, rendering its core filter (P2) unreliable. Track this rigorously.
