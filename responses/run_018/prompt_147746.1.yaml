answer: |-
  You've hit on a brilliantly layered set of historiographical and philosophical tensions. Let's untangle this knot step by step, using your French Revolution/Terror example as the anchor:

  ### The "Devouring Children" Pattern vs. Contingency Conflict
  **The Conflict:** The phrase "revolutions devour their children" (attributed to Vergniaud) implies an *inevitable* structural dynamic: radicalization begets purges. A contingency-based reading (e.g., Timothy Tackett's work on factional psychology, Ruth Scurr on Robespierre's paranoia) argues the Terror wasn't predetermined but resulted from specific decisions under extreme pressure (war, inflation, counter-revolution).

  **Example of Conflict:**  
  - **Structural View:** The Committee of Public Safety *had* to centralize power and eliminate rivals (Dantonists, Hébertists) to prevent fragmentation amid existential threats. The "devouring" is systemic.  
  - **Contingency View:** Robespierre's personal obsession with "purity" (e.g., his 1794 speech linking virtue to terror), Saint-Just's ruthlessness, and the Thermidor coup’s tactical missteps were *not* inevitable. Had Danton compromised earlier, or Robespierre fallen ill in 1793, escalation might have been avoided.  

  **Resolution:** The pattern holds *without* inevitability if we frame it as a **recurring risk profile**:  
  > Revolutions create vacuums where power is contested, ideology becomes weaponized, and survival instincts override principles. This *makes purges likely* under stress, but their form, targets, and intensity depend on contingent choices.  

  The Terror wasn’t *guaranteed*, but the revolution’s structural conditions (fragmented authority, utopian goals, external threats) made some form of auto-cannibalism *probable*. Modern parallels (e.g., Bolshevik purges) show similar risk profiles without identical outcomes.

  ### AI Alignment vs. Jacobins: Valid Comparison or Whig History?
  **Your skepticism is justified.** The common analogy ("AI safety debates = Girondins vs. Montagnards!") often *does* smuggle in Whiggish assumptions. But a defensible comparison exists if we isolate **mechanisms, not teleology**:  

  | **Shared Mechanism**           | **1793 Jacobin Example**                          | **Modern AI Safety Debate**                          |
  |-------------------------------|-----------------------------------------------|--------------------------------------------------|
  | **Purity Spiral**             | "Virtue" as non-negotiable; deviation = treason | "Alignment" as absolute; compromises = "capitulation to doom" |
  | **Inflation of Existential Risk** | Austrian/Prussian invasion ➜ *all* dissent aids enemies | AI failure modes ➜ "any misstep causes extinction" |
  | **Fragmentation**             | Hébertists vs. Dantonists vs. Robespierre      | "Decels" vs. "Accels" vs. "Pause" advocates      |
  | **Centralization Urge**       | Committee of Public Safety supersedes conventions | Calls for AI governance bodies with sweeping powers |

  **Key Difference:** The Jacobins fought for a *specific future* (republican virtue). AI factions debate *how to avoid futures*. This flips the teleology: it’s not that revolutions *progress* toward liberalism, but that **high-stakes, uncertain transitions breed analogous factional dynamics**. The analogy holds if we reject inevitability and focus on *how epistemic crises and existential threats radicalize governance*.

  ### Can Secular Societies Survive Without Progress Myths?
  **Short answer:** They can, but it's unstable. Transparency and peer review are necessary but insufficient.  

  **Why Myths Persist:**  
  1. **Cognitive Function:** Humans require narratives to make sense of suffering/effort. "Progress" (even if non-linear) justifies sacrifice (e.g., climate action).  
  2. **Social Cohesion:** Shared stories bind pluralistic societies. Science’s "self-correcting" narrative is itself a myth (see Lorraine Daston).  
  3. **Institutional Trust:** Peer review relies on faith in the system. Scandals (replication crises, fraud) erode trust unless buffered by a broader belief that "science *eventually* finds truth."  

  **Alternatives to "Progress":**  
  - **"Managed Contingency"**: Trust comes from robust *processes* (e.g., constitutional checks, peer review) that accept uncertainty but limit disasters.  
  - **"Negative Teleology"**: Society agrees only on what to *avoid* (extinction, tyranny) without prescribing an end state (Isaiah Berlin’s pluralism).  
  - **"Pragmatic Hope"**: Grounded in incremental problem-solving, not eschatology (Deweyan experimentalism).  

  **Verdict:** Pure proceduralism is fragile. Secular societies thrive with a **minimal myth**: *"Through conflict and correction, we can avoid the worst outcomes."* This isn’t Whig history—it’s antifragility.

  ### TL;DR
  - The Terror’s "child-devouring" reflects a **structural risk profile**, not inevitability—contingency explains *how* it unfolded.  
  - AI/Jacobin analogies avoid Whiggism by comparing **crisis-driven factional dynamics**, not teleological endpoints.  
  - Secular societies need a **thin myth of corrigibility** ("We can fix errors") to sustain trust beyond pure procedure.  

