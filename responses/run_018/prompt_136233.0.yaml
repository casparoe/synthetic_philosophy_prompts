prompt: |-
  You are a political philosopher with expertise in institutional ethics and the philosophy of work. Before composing your answer, take a moment to brainstorm the main conceptions of work—work as moral obligation, as economic contribution, as self-realisation, as social integration, and as mere time-occupancy—and note briefly which institutional mechanisms typically express each.

  Consider this institutional pairing, now widespread across several advanced economies: first, unemployment and disability-related benefits are made conditional on claimants accepting any available employment, including temporary, part-time, zero-hours, or platform-gig roles, with refusal or failure to apply triggering sanctions; second, public funds, tax incentives, and corporate investment are directed simultaneously toward automating precisely those entry-level roles—automated retail checkout, warehouse robotics, algorithmic customer-service triage, basic data entry—while displaced workers are routed into reskilling or upskilling programmes for digital, green, or care-sector positions that policy documents themselves project will face comparable automation pressure within the same funding cycle. The official rhetoric justifying both sides of the pairing appeals repeatedly to the dignity of work and to equipping people for the jobs of tomorrow.

  What philosophical commitments about the nature and value of work does this pairing presuppose? Reconstruct the implicit theory: does the practice treat work primarily as a moral duty that justifies coercion, as a source of human flourishing that must be protected, as an economic input whose substitution by machines is regrettable but acceptable, or as a mechanism of social control and visible occupation? Is there a single, consistent conception of work that can license both the sanction-backed obligation to accept any available job and the active, subsidised elimination of those very jobs? Or does the pairing reveal an incoherence—perhaps treating the content and conditions of work as irrelevant, provided the individual is demonstrably occupied?

  Distinguish carefully between what the practice strictly presupposes and what it merely accommodates. Then address whether this implicit view is compatible with the philosophical position—associated with certain post-work and socialist traditions—that automation ought to be pursued precisely in order to liberate human beings from necessary labour, allowing welfare support to be decoupled from employment status altogether. If that liberationist view were adopted, what specific features of current policy design—conditionality rules, sanction structures, reskilling mandates, subsidy criteria—would have to change, and which could remain?

  Please write your response in British English. Structure it as follows:

  - Reconstruction of the implicit theory (approximately 350 words): identify the conception(s) of work embedded in the pairing and show how each institutional feature expresses them.
  - Consistency check and hidden tensions (approximately 350 words): examine whether the coercion-to-work and automation-to-eliminate-work policies draw on the same concept of work or on conflicting ones; flag any apparent tensions that dissolve on closer inspection.
  - The liberationist challenge and policy redesign (approximately 300 words): assess compatibility with the view that automation should free people from labour; specify the concrete institutional changes required if that view replaced the current implicit theory.
  - Verdict (approximately 150 words): summarise which conception the practice actually needs, whether it is philosophically defensible, and what the cheapest revision to restore coherence would be.
