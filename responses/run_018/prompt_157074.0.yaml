answer: |-
  Your structural diagnosis of the Quinean impasse is astute. The debate isn't stagnant due to a lack of sophistication, but because it reflects a **tripartite entanglement of substantive, verbal, and project-misaligned elements**, amplified by divergent formal presuppositions. Here's a breakdown using core arguments from each side:

  ### 1. **Substantive Dispute (Ontology & Epistemology)**:
     - **Quine's Core**: Translation underdetermination reveals an *ontological fact*: there is no fact of the matter about reference ("rabbit" vs. "undetached rabbit part") beyond stimulus synonymy. This is grounded in his naturalism: meaning must be reducible to physical behavior.
     - **Critics' Core (Davidson, Dennett, Chomsky)**: Practical convergence demonstrates *epistemic success*. We determinately fix reference through holistic constraints (charity, coherence, predictive utility). The indeterminacy is merely theoretical, not practical.
     - **Substantive Sticking Point**: **Is underdetermination a metaphysical gap or an epistemic limitation?** Quine argues it's ontological; critics see it as a quirk of radical abstraction irrelevant to real semantics.

  ### 2. **Verbal Disagreement ("Meaning")**:
     - **Quine's "Meaning"**: Exclusively *behaviorally manifest dispositions*. Meaning is what survives radical translation ("stimulus meaning").
     - **Critics' "Meaning"**: Often includes *internal cognitive structure* (Chomsky), *truth-conditional content* (Davidson), or *functional role* (Dennett). For them, meaning isn't exhausted by translation manuals.
     - **Verbal Sticking Point**: When critics say "meaning is determinate," they often mean *communicative success* or *cognitive fixity*. Quine would retort this smuggles in illicit entities ("myths").

  ### 3. **Misaligned Projects**:
     - **Quine's Project**: A *metaphysical inquiry* into the foundations of semantics within a physicalist ontology. He asks: "What *can* meaning be, given naturalism?"
     - **Critics' Project**: A *descriptive/pragmatic account* of linguistic practice. They ask: "How *do* we succeed at interpretation?"
     - **Project Misalignment**: Quine’s thesis is a *limiting principle* for semantic theories. Critics treat it as an *empirical claim* about translation failure. They talk past each other’s objectives.

  ### The Formal Framework Divergence (Your Key Insight)
  This is crucial. **Quine presupposes classical extensional semantics**, where reference is a direct, unmediated word-world relation. In this framework:
  - Holism and underdetermination inevitably fracture reference ("gavagai" has no unique extension).
  - Charity only fixes truth values, not ontology.

  **Critics implicitly (or explicitly) assume richer frameworks**:
  - **Davidson**: Truth-conditional semantics + charity as a constitutive principle. Reference emerges from holistic pattern-fitting.
  - **Inferentialists (Brandom)**: Meaning as role in a normative network. "Gavagai" is fixed by its inferential links (e.g., to "animal," "fleeing").
  - **Cognitive Linguists**: Meaning tied to mental representations constrained by cognition, not just behavior.

  **Result**: Quine’s indeterminacy *vanishes* in intensional or inferential frameworks because "reference" isn’t atomistic. Critics see determinacy *within their frameworks* but fail to engage Quine’s challenge: show how these frameworks are *naturalistically grounded* without behavioral underdetermination.

  ---

  ### Pathways to Progress
  The impasse persists because all three elements are intertwined. Progress requires disentanglement:

  1. **Formal Result Fixing Reference Under Constraints**  
     - *Potential*: Prove that specific formal structures (e.g., type theory, structured propositions) plus charity *uniquely* fix reference.  
     - *Limitation*: Quine would reject non-behavioral constraints as "mythical." Success here would satisfy critics but not Quineans.

  2. **Empirical Findings in Field Linguistics**  
     - *Potential*: Evidence that field linguists converge *without* residual indeterminacy (e.g., no "gavagai"-like dilemmas in practice) would undermine Quine’s empirical premise.  
     - *Limitation*: Quine could dismiss this as "domesticated" translation relying on shared innate structures (Chomsky’s point), not refuting radical underdetermination *in principle*.

  3. **Clarifying Indeterminacy vs. Epistemic Uncertainty**  
     - *Crucial Step*: Distinguish Quine’s **ontic indeterminacy** ("no fact of the matter") from mere **epistemic underdetermination** ("we don’t know").  
     - *Progress*: If critics can show all underdetermination is epistemic (e.g., via Bayesian models of interpretation), Quine’s thesis collapses. If Quineans demonstrate ontic gaps (e.g., via permutation arguments), critics must either accept indeterminacy or reject naturalism.

  4. **Accepting Irresolvability with Diagnosis**  
     - *Most Likely Outcome*: The dispute is fundamentally **metaphysical**. Quineans demand meaning be reducible to physics; critics find this reduction implausible. Progress then consists in **explicitly separating projects**:  
       - *Naturalized Semantics* (Quine’s): Meaning as behaviorally admissible. Indeterminacy is inevitable.  
       - *Descriptive Semantics* (Critics): Meaning as socially/intellectually constituted. Determinacy is pragmatic.  
     - *Formal Clarification*: Admit that **classical extensionalism guarantees indeterminacy**, while richer frameworks avoid it at the cost of naturalistic rigor. Choose your framework, then live with the consequences.

  ### Conclusion
  **The impasse is all three: substantive (ontic vs. epistemic), verbal (meaning-as-behavior vs. meaning-as-cognition), and project-misaligned (metaphysical limit vs. interpretive practice).** The hidden formal divergence—classical extensionalism vs. intensional/inferential frameworks—sustains the deadlock by allowing both sides to beg the question against the other’s semantics.

  **Greatest hope for progress**:  
  - **First**, rigorously separate ontic indeterminacy from epistemic underdetermination in the arguments.  
  - **Second**, force explicit acknowledgment of formal-semantic presuppositions: Quineans must defend classical extensionalism; critics must naturalize their richer frameworks.  
  - **Third**, accept that "progress" may mean compartmentalization: Quine reveals a metaphysical limit for *naturalized* semantics; critics describe how *actual* semantics operates beyond that limit. 

  The debate endures not because it’s unresolved, but because it’s a **syndrome of philosophy’s competing impulses**: to naturalize meaning versus to explain its manifest determinacy in life. Resolving *this* tension may be the real unattainable goal.
