answer: |-
  Your colleague's argument is a provocative synthesis of philosophical ideas, but it contains several conflations, overstatements, and logical leaps. Let's audit it step by step:

  ### 1. **"The dead lack sentience → No direct duties of welfare / cannot suffer harm"**
     - **Defensible Core:** Most contemporary ethics (e.g., Derek Parfit, Joel Feinberg) agrees the dead cannot experience *felt harm*. Thus, direct welfare duties (e.g., preventing suffering) dissolve at death.
     - **Overstatement:** This ignores *non-experiential interests*. If we accept that persons can have *surviving interests* (e.g., in reputation, fulfilled promises, or the integrity of their life's work), harming these could constitute a moral wrong *to the deceased*, even without sentience. (See Feinberg's "Harm to Others" or George Pitcher's "The Misfortunes of the Dead"). A defender might dismiss this, but it's a live debate, not a settled entailment.

  ### 2. **"Mnemonic Stewardship as fiduciary obligation to preserve structural coherence of self-interpretation"**
     - **Defensible Core:** This draws from:
       - *Narrative Identity* (Ricoeur, MacIntyre): We construct our selves through stories.
       - *Collective Memory Theory* (Halbwachs): Communities shape shared memory.
       - *Archival Ethics*: Stewardship of historical records implies duties of accuracy.
     - **Conflation/Distortion:** 
       - It conflates *individual self-interpretation* with *communal representation*. The deceased's "own meaning-making framework" is rarely unitary or static; individuals revise self-narratives. Preserving a single "structural coherence" is arguably impossible and risks essentialism.
       - "Fiduciary obligation" overreaches. While societies have duties to preserve history *for the living* (e.g., for education, identity), framing it as a *duty owed directly to the dead* is philosophically contentious and lacks clear grounding. It borrows moral weight (fiduciary = trust for *another's benefit*) without justifying why the dead *benefit* from this.

  ### 3. **"Wronging by substituting invented narrative → corrupting communal record"**
     - **Defensible Core:** There's a strong ethical case against *deception* or *misrepresentation* presented as fact. Deliberately falsifying history can harm:
       - *Living communities* (e.g., distorting cultural heritage, enabling propaganda).
       - *Survivors/descendants* (e.g., causing distress, misrepresenting family legacies).
       - *Historical understanding* (eroding public trust in history/art).
     - **Overstatement/Conflation:**
       - **Not uniquely about the dead:** The wrong primarily concerns the *living* and *public epistemology*. Framing it as a wrong *to the deceased* via "corruption" assumes they retain a stake in the communal record – which requires justifying posthumous interests.
       - **Art ≠ Historical Record:** Novels/biopics are *inherently* interpretive. Demanding they preserve "structural coherence" misapplies archival standards to art. The "communal record" isn't monolithic; it includes *multiple* narratives (academic, folk, artistic).

  ### 4. **"Artistic Licence = Epistemic Trespass without explicit fictional declaration"**
     - **Defensible Core:** Transparency about fictionalization is ethically prudent to avoid misleading audiences (a duty to *viewers/readers*, not the dead). Works blurring fact/fiction (e.g., *JFK*, *The Crown*) can distort public understanding.
     - **Overstatement:**
       - **"Epistemic Trespass"** is inflammatory. Trespass implies violation of a right or boundary. While misrepresentation *can* be unethical, artistic reimagining isn't inherently trespass if audiences understand genre conventions. Demanding *explicit declarations* oversimplifies; context, genre, and cultural norms matter (e.g., Shakespeare's history plays).
       - It ignores *art's role in challenging narratives*. Official/self-interpretations can be flawed (e.g., covering up harm). Art may ethically *correct* or *recontextualize* (e.g., works critiquing colonial figures).

  ### 5. **"Heightened unease about recent dead: Living witnesses can correct corruption vs. irreversible damage for distant figures"**
     - **Defensible Observation:** Practical anxiety about recent portrayals *is* often tied to living witnesses (family, colleagues) who may experience distress or contest inaccuracies. Proximity heightens emotional/social stakes.
     - **Logical Failure/Overstatement:**
       - **Doesn't follow from premises:** Her core argument is about *duties to the dead* via mnemonic stewardship. Yet this point shifts to *pragmatic concerns for the living* (witnesses' ability to correct). If the duty is to the *dead*, distance should be irrelevant.
       - **"Damage is settled and irreversible" is false:** Historical interpretation constantly evolves. New evidence, perspectives, and yes, artistic works, *reshape* understanding of distant figures (e.g., reassessments of Cleopatra, Churchill). "Corruption" implies a fixed, correct narrative – which historiography rejects.
       - **Ignores countervailing factors:** Distant figures might be *more* susceptible to harmful stereotyping (due to lost nuance), while recent figures have robust records making overt fiction harder to pass off.

  ---

  ### Key Distortions in the Overall Argument
  1. **Conflation of Duties:** Bundles distinct ethical concerns (to the dead, to survivors, to society/history) under one "duty to the deceased."
  2. **Reduction of Harm:** Dismisses non-experiential harms/posthumous interests too readily.
  3. **Essentialism:** Assumes a singular, coherent "self-interpretation" to be preserved, ignoring the fluidity of identity and memory.
  4. **Overextension of Stewardship:** Elevates a metaphor (stewardship) into a strict fiduciary duty without sufficient justification.
  5. **Artistic Mischaracterization:** Treats art as a failed attempt at historiography, ignoring its distinct purposes (exploration, empathy, critique).

  ### Fair Conclusions for a Careful Defender
  A nuanced defender might argue:
  - We have *indirect* duties to the dead grounded in respecting their *surviving interests* (if accepted) or our *own virtue* (e.g., fidelity).
  - Societies should value *historical fidelity in public discourse*, requiring *transparency* when art fictionalizes real people.
  - Misrepresentation *can* harm communities and trust, warranting ethical caution.
  - Proximity heightens *social sensitivity* due to living stakeholders, but this doesn't imply lesser *intrinsic duties* to distant figures.

  Your unease is justified. The argument's strength lies in highlighting real ethical risks in biographical art, but it overreaches by constructing a singular "duty to the dead" via contested concepts while underestimating art's legitimate role in reinterpretation. Your novel's ethics likely hinge more on **accuracy of context, respect for evidence, transparency with audiences, and sensitivity to living communities** than on preserving a phantom "self-interpretation" against corruption.
