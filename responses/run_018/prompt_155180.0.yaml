answer: |-
  Your experience crystallizes the visceral challenge of moral luck—where the gap between *ex ante* reasoning and *ex post* blame feels unjust. Prioritizing research lines requires assessing which knot, if untied, would loosen others most effectively while addressing real-world instability in accountability practices. Below is a defended framework, focusing on upstream foundations, tractability, and transformative potential, with explicit attention to collective agents.

  ### **Defended Prioritization**
  1. **Circumstantial Luck in Institutional/Algorithmic Systems**  
     *Why upstream?*  
     Modern moral dilemmas increasingly occur within opaque systems (corporations, AI, bureaucracies) that *generate* the conditions for constitutive, resultant, and epistemic luck. These systems:  
     - Mediate individual agency (e.g., your "ordinary diligence" was constrained by institutional rules or algorithmic outputs).  
     - Amplify moral luck by distributing outcomes across agents, obscuring causality.  
     - *Create* the circumstances determining which counterfactuals are relevant (e.g., "nearby worlds" depend on system design).  
     Resolving how luck operates here is foundational because it redefines the **control principle** itself—e.g., does "reasonable diligence" require understanding systemic black boxes?  

     *Tractability*  
     Conceptual tools exist: principal-agent problems, distributed responsibility, and functionalist theories of collective agency. Unlike empirical psychology, this demands *normative modeling*: How *should* systems allocate moral risk? What constitutes "due diligence" for algorithm designers? Progress can be made via case studies (e.g., medical AI misdiagnosis, financial crashes) mapping luck to institutional structures.  

     *Impact on Practices*  
     A resolution here would **destabilize** current blame practices most profoundly. If moral luck applies to systems (e.g., an algorithm’s "character" is shaped by training data luck), we must redesign accountability:  
     - Shift blame from individuals to governance structures.  
     - Require outcome-independent audits of system design.  
     - Legally formalize "moral risk budgets" for high-stakes algorithms.  
     *Failure* to address this entrenches arbitrariness in blaming individuals for systemic failures.  

  2. **Resultant Luck & the Revised Control Principle**  
     *Why upstream?*  
     Your case exemplifies resultant luck: observers ignored your diligence because harm materialized. Revising the control principle (distinguishing *capacity* for control from its *exercise*) directly challenges the intuition that outcomes dictate blame. This is a prerequisite for:  
     - Neutralizing circumstantial luck (by decoupling blame from system-mediated outcomes).  
     - Constraining constitutive luck (if control capacity is stable, "character" assessments gain footing).  

     *Tractability*  
     Pure conceptual work: refine "reasonable foreseeability" and "capacity for control" using modal logic (e.g., what *would* a vigilant agent know across relevant worlds?). Unlike psychology, this avoids debates over bias in *actual* judgments and focuses on *ideal* standards.  

     *Impact on Practices*  
     A robust control principle would **stabilize** blame by tethering it to *ex ante* reasons. If observers accepted that your decision was blameless despite harm, praise/blame would track diligence, not chance. This would reform legal standards (e.g., negligence) and HR evaluations—but *only* if circumstantial luck is resolved first (otherwise, "diligence" remains system-dependent).  

  3. **Constitutive Luck & Moral Character**  
     *Why downstream?*  
     Whether luck in forming one’s "character" undermines blame presupposes we can isolate individual agency. But in institutional contexts, "character" is often a *product* of system-afforded opportunities (e.g., your diligence was shaped by training/resources). Until we clarify how systems distribute constitutive luck (e.g., algorithmic curation of choices), debating individual self-authorship is premature.  

     *Tractability*  
     High barriers: requires reconciling free will metaphysics with social/neural determinism. Conceptual analysis risks stalemate without empirical inputs (e.g., cognitive science on volition).  

  4. **Moral/Epistemic Luck Boundary**  
     *Why lowest priority?*  
     Epistemic luck (e.g., unknowable system risks) is *subsumed* by analyses of circumstantial/resultant luck. Modal epistemology (e.g., safety/sensitivity conditions) may refine counterfactual tests for blame ("*Should* you have known the algorithm might fail?") but doesn’t resolve core agency questions.  

  ---

  ### **Collective vs. Individual Priority: The Critical Edge**  
  **Collective-agent moral luck must take precedence.** Here’s why:  
  - **Urgency**: Your dilemma arose within an institutional context (observers judged you based on outcomes, not diligence). Blame for system-mediated harm is *the* dominant form of modern moral luck (e.g., doctors blamed for AI errors, engineers for supply-chain failures).  
  - **Upstream Leverage**: Groups/algorithms redistribute control and knowledge. Resolving whether *they* bear moral luck redefines individual responsibility. Example: If an algorithm’s "unforeseeable" error is traced to negligent training-data curation, the *system* absorbs the luck, exonerating you.  
  - **Transformative Potential**: A theory of collective moral luck would force redesign of accountability structures (e.g., regulatory frameworks for AI). This could **destabilize** practices overnight: corporations might face "moral luck insurance" mandates; algorithm designers could be liable for "foreseeable unforeseeables."  
  - **Tractability Anchor**: Collective agency is more malleable than human nature. We can *engineer* systems to mitigate luck (e.g., transparency protocols, fail-safes), offering a pragmatic testing ground for theories.  

  ---

  ### **Reordering Triggers**  
  1. **If collective luck is resolved**: A formal model of "systemic moral risk" (e.g., assigning luck to design flaws rather than individuals) would deprioritize resultant/constitutive luck for most practical purposes.  
  2. **If control principle revision fails**: Should no tenable distinction between *capacity* and *exercise* of control emerge, focus would shift to circumstantial luck (to minimize luck’s impact) or constitutive luck (to abandon blame entirely).  
  3. **Empirical collapse**: If psychology proves outcome bias is ineradicable, all lines yield to redesigning institutions to *accommodate* (not negate) luck.  

  ### **Conclusion**  
  Begin with **circumstantial luck in institutional systems**, as it is the scaffolding upon which your experience—and modern moral life—rests. By addressing how systems *produce* moral luck, we clarify the control individuals truly have, redefine what counts as "reasonable diligence," and lay groundwork for neutralizing resultant luck. Collective-agent analysis isn't just adjacent; it's the priority because it confronts the structural source of the arbitrariness you endured. A breakthrough here would transform blame from a lottery of outcomes into an audit of design, shifting society's gaze from your unlucky result to the system that made it possible.
