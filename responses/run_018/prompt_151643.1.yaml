  ## Standing Between the Looking-Glasses

  I stand between two mirrors, stare, and see
  A choice repeated, fading, never done.
  **Who made the chooser?** Tell that truth to me.
  Each self behind me, smaller, seems to be
  The one who chose before this course was run.
  I stand between two mirrors, stare, and see

  The layers peel away. Where does it start?
  The smallest figure, blurred, can't raise a hand.
  **The cause never lands**, it plays no part.
  I traced the chain back to a frozen heart,
  A ghost deciding in a shrinking land.
  **Who made the chooser?** Tell that truth to me.

  The frames grow small, the light begins to fail.
  The final face is blank, a vacant pane
  **The cause never lands** within this endless trail.
  My own reflection makes my thinking frail,
  Caught in the glass, a dizzy, looping pain.
  I stand between two mirrors, stare, and see

  The reasons vanish where the mirrors meet.
  No praise is earned, no blame can find its hands.
  **Who made the chooser?** Tell that truth to me.
  **The cause never lands.**
