answer: |-
  ### Representational Realism Audit Procedure for Neural Network Components

  **Procedure Overview**: This 90-minute audit assesses whether a neural network component (e.g., feature cluster, attention head, circuit) constitutes a genuine representational unit. The procedure tests three conditions derived from biosemantic principles: **Misrepresentation**, **Stable Functional Role**, and **Consumer Mechanism**. Auditors use in-house activation data, ablation results, and counterfactual inputs. All tests require pre-curated datasets (positive, negative, and adversarial examples for the concept). Judgment-call points are explicitly marked (🟡).

  ---

  ### Ordered Checklist

  #### **Step 1: Test for Misrepresentation**  
  *Condition: The component must systematically misrepresent (false positives/negatives), not just fail to activate.*  
  **Evidence to Collect**:  
  - Activation levels for:  
    - 50+ **positive examples** (concept present).  
    - 50+ **negative examples** (concept absent).  
    - 20+ **adversarial examples** (designed to induce errors, e.g., optical illusions).  
  - Metrics: Activation distribution (mean, standard deviation) for each set.  

  **Threshold for Passing**:  
  - **Systematic misrepresentation** is confirmed if:  
    - False positives: Activation ≥75% of the mean positive activation in ≥10% of negative/adversarial examples.  
    - False negatives: Activation ≤25% of the mean positive activation in ≥10% of positive examples.  
  - Random errors (e.g., <5% of cases) fail.  

  **Judgment**:  
  - ✅ Pass: Proceed to Step 2.  
  - ❌ Fail: Issue **mandatory non-representational verdict**. Halt.  
  - 🟡 **Human Judgment Required**: Ambiguous misrepresentation (e.g., 5–10% error rate) OR perfect correlation (0% errors). *Auditor must decide if errors are systematic or noise.*  

  **Handles Hard Case (i)**: Perfect correlation (no misrepresentation) fails automatically.  

  ---

  #### **Step 2: Test for Stable Functional Role**  
  *Condition: The component must play a consistent causal role across contexts, not context-dependent.*  
  **Evidence to Collect**:  
  - **Ablation results** (performance drop) for:  
    - 3+ **distinct tasks** requiring the concept (e.g., numerical comparison vs. estimation).  
    - 1+ **unrelated control task** (concept irrelevant).  
  - Metrics: Relative performance drop (e.g., accuracy, F1-score) vs. baseline.  

  **Threshold for Passing**:  
  - **Stable role** is confirmed if:  
    - Ablation causes ≥15% relative performance drop in **all** concept-relevant tasks.  
    - Drop is ≤5% in control tasks.  
  - **Replaceability test**: Ablation drop must be ≥2× larger than when replacing activations with Gaussian noise (same mean/variance).  

  **Judgment**:  
  - ✅ Pass: Proceed to Step 3.  
  - ❌ Fail: Issue **mandatory non-representational verdict**. Halt.  
  - 🟡 **Human Judgment Required**: Inconsistent drops (e.g., 20% drop in Task A, 12% in Task B) OR ambiguous replaceability results. *Auditor must decide if instability is inherent or noise.*  

  **Handles Hard Case (ii)**: Unstable role (e.g., works in context A but not B) fails.  

  ---

  #### **Step 3: Test for Consumer Mechanism**  
  *Condition: Downstream components must use the activation to guide behavior (output).*  
  **Evidence to Collect**:  
  - **Counterfactual activation clamping**:  
    - **Clamp-high**: Force high activation on 20–30 concept-absent inputs.  
    - **Clamp-low**: Force low activation on 20–30 concept-present inputs.  
  - Metrics: Output change rate (e.g., % of clamped inputs where model behavior aligns with clamping).  

  **Threshold for Passing**:  
  - **Consumer mechanism** is confirmed if:  
    - Clamp-high: Model outputs concept-dependent behavior in ≥80% of cases (e.g., predicts curved edges when none exist).  
    - Clamp-low: Model omits concept-dependent behavior in ≥80% of cases (e.g., ignores magnitude in estimation).  
  - Output changes must align with the concept (not random degradation).  

  **Judgment**:  
  - ✅ Pass: Issue **mandatory representational verdict**.  
  - ❌ Fail: Issue **mandatory non-representational verdict**.  
  - 🟡 **Human Judgment Required**: Partial alignment (60–79%) OR changes are non-specific. *Auditor must decide if usage is intentional or incidental.*  

  **Handles Hard Case (iii)**: Verdict is data-driven; stakeholder resistance overridden by test results.  

  ---

  ### Application to Hypothetical Cases

  #### **Case 1: Vision-Model Cluster for Curved Edges**  
  - **Step 1**: Activates on curved edges (positives) and optical illusions (adversarial).  
    - ✅ **Pass**: False positives (illusions) exceed 10% threshold.  
  - **Step 2**: Ablation causes >15% drop in edge-detection tasks; no drop in color-classification tasks.  
    - ✅ **Pass**: Stable role across contexts.  
  - **Step 3**: Clamping induces edge hallucinations/omissions in 90% of cases.  
    - ✅ **Pass**: Mandatory **representational verdict**.  
  - **Stakeholder Resistance**: Overruled—evidence shows systematic representation of "curvature."  

  #### **Case 2: Language-Model Attention Head for Pronoun Gender Agreement**  
  - **Step 1**: Activates identically on correct ("She runs") and ambiguous ("They runs") sentences.  
    - ✅ **Pass**: False positives (ambiguous) exceed 10% threshold (misrepresentation).  
  - **Step 2**: Ablation causes 20% drop in gender-agreement tasks but 0% drop in ambiguous sentences (no functional role when agreement is broken).  
    - ❌ **Fail**: Unstable role (fails in ambiguity context).  
  - **Verdict**: Mandatory **non-representational** (fails Step 2).  

  #### **Case 3: Reasoning-Model Circuit for Approximate Magnitude**  
  - **Step 1**: Misrepresents on close-magnitude pairs (e.g., 1000 vs. 1001).  
    - ✅ **Pass**: Systematic errors in ≥10% of cases.  
  - **Step 2**: Ablation causes >15% drop in estimation tasks; no drop in exact arithmetic.  
    - ✅ **Pass**: Stable role in estimation contexts.  
  - **Step 3**: Clamping on exact tasks induces approximate outputs (e.g., "≈4" for "2+2").  
    - ✅ **Pass**: Mandatory **representational verdict** for "approximate magnitude."  
  - **Stakeholder Resistance**: Overruled—evidence shows consumer-guided representation.  

  ---

  ### What the Procedure Cannot Determine  
  The audit certifies **representational status** but explicitly **does not** assess:  
  1. **Consciousness**: Representation ≠ subjective experience. Biosemantics addresses information use, not phenomenology.  
  2. **Moral Patienthood**: Moral status depends on sentience/rights, not representational capacity.  
  3. **Literal Belief Attribution**: A "verified representational unit" does not imply human-like beliefs (e.g., propositional attitudes).  

  **Why These Limits Are Inherent**:  
  - The theory of representation (biosemantics) defines representation as a functional, teleological property—**not** a claim about mind, ethics, or ontology.  
  - Expanding to consciousness/beliefs requires philosophical commitments beyond the scope of empirical audits.  
  - **These boundaries prevent overinterpretation**; the procedure isolates representation as a mechanistic property of computational systems.  

  ---  
  **Deliverable**: A standalone 90-minute audit, executable by non-philosophers. Judgment points (🟡) ensure transparency. Verdicts are binding for public audit logs.
