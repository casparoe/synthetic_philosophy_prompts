prompt: |-
  You chair the interpretability review panel for a machine-learning certification body. Every two weeks you must determine, case by case, whether a specific internal component of a deployed neural network—say, a sparse feature cluster in an intermediate layer—genuinely represents a concept (e.g., numerical comparison, social deception, or vertical orientation) in a realist sense, or whether attributing that content is merely a predictive shorthand with no ontological weight. These determinations are made in 90-minute sessions with no access to external literature; your personal sign-off enters a public audit and triggers mandatory alignment checks if a component is listed as a verified representational unit. The panel includes technically literate auditors who are not trained in philosophy, so you need a reusable, written procedure they can apply consistently.

  The philosophical principle to be operationalized is this: representational realism about neural networks requires more than statistical correlation between activations and world-features. It requires that the component can misrepresent (not merely fail to activate), that it plays a stable functional role within the system’s information-processing economy, and that there is some mechanism—analogous to a consumer in biosemantics—by which the system uses the component’s state to guide behavior. Your task is to translate these three conditions into an ordered checklist of tests applied to in-house activation data, ablation results, and counterfactual inputs. The procedure must specify, in sequence: what evidence to collect; what numerical or structural threshold counts as passing each condition; where the procedure issues a mandatory “representational” verdict; where it issues a mandatory “non-representational” verdict; and exactly where it must halt and flag for irreducible human judgment because the philosophical distinction is indeterminate given the available data.

  The procedure must be designed to handle, without collapsing, three hard case-types built into its logic: (i) perfect correlation with no possible misrepresentation path; (ii) demonstrable misrepresentation but unstable functional role across contexts; and (iii) a case where all three conditions are met and the procedure returns “representational,” but the development team will resist the verdict because it implies the model possesses a concept they deny it has—requiring you to show how the procedure reaches its conclusion regardless of stakeholder preference.

  Apply the procedure to three concrete hypothetical cases: (1) a vision-model cluster that activates reliably on curved edges and systematically misactivates on specific optical illusions; (2) a language-model attention head that tracks pronoun gender agreement with high accuracy but activates identically on grammatically correct sentences and on deliberately ambiguous ones designed to break the agreement; and (3) a reasoning-model circuit that correlates with approximate magnitude judgments, survives targeted ablation only in tasks requiring estimation rather than exact computation, yet collapses when precise arithmetic is required—suggesting it represents “approximate magnitude” but raising questions about whether that is a representation or a processing artifact.

  Finally, conclude by stating precisely what the procedure cannot determine—whether representational status is sufficient for consciousness, for moral patienthood, or for the literal attribution of “beliefs” to the model—and explain why those limits are not failures of the audit but boundaries inherent to the theory of representation itself. The deliverable should be a procedure that could be run by a non-philosopher in under two hours, with every judgment-call point explicitly marked.
reasoning: |-
  We are designing a procedure to determine if a neural network component (e.g., a cluster or circuit) genuinely represents a concept in a realist sense.

  The philosophical conditions are:
  1. Misrepresentation: The component must be able to misrepresent (not just fail to activate). There must be cases where it activates in the absence of the concept (false positives) or fails to activate when the concept is present (false negatives) but in a way that is not merely random noise but a systematic error.
  2. Stable Functional Role: The component must play a stable functional role in the system's information processing. Its contribution should be consistent across different contexts and tasks where the concept is relevant.
  3. Consumer Mechanism: There must be a mechanism (like a consumer in biosemantics) that uses the state of the component to guide the behavior (output) of the system.

  We'll break down the procedure into an ordered checklist. For each condition, we will specify:
  - What evidence to collect.
  - What numerical/structural threshold counts as passing.
  - What leads to a mandatory verdict (representational or non-representational) and when to halt for human judgment.

  The procedure must handle three hard cases and be applied to three hypothetical examples.

  We design the procedure as a flowchart-like checklist with clear steps.

  ---

  **Procedure: Representational Realism Audit for Neural Network Components**

  **Pre-requisites for the audit session:**
  - Have access to the model and the specific component (e.g., via activation data, ablation tools, and counterfactual input generation).
  - Have a set of test inputs that cover:
    - Positive examples (where the concept is present).
    - Negative examples (where the concept is absent).
    - Challenging examples (edge cases, illusions, ambiguous cases, etc.).
  - Have a way to measure the activation of the component and the model's output.

  **Step 1: Test for Misrepresentation**

  **Evidence to collect:**
  - Run the model on a set of test inputs that include:
    a) Clear positive examples (concept present).
    b) Clear negative examples (concept absent).
    c) Challenging examples designed to potentially cause misrepresentation (e.g., illusions, ambiguous cases, adversarial examples).
  - Record the component's activation level for each input.

  **Threshold for passing:**
  - The component must show at least one of the following:
    a) **False positives**: Activation above a threshold (e.g., 75% of the average activation for clear positives) on at least 5% of the clear negative examples OR on a set of challenging examples that are designed to be concept-absent but trigger activation (like optical illusions for vision).
    b) **False negatives**: Activation below a threshold (e.g., 25% of the average activation for clear positives) on at least 5% of the clear positive examples OR on challenging examples that are concept-present but fail to activate.
  - The misrepresentation must be systematic: the same type of challenging input consistently causes the misrepresentation (across multiple similar inputs).

  **Judgment:**
  - If the component shows systematic misrepresentation (as defined above), condition 1 is passed. Proceed to Step 2.
  - If the component shows only perfect correlation (no false positives and no false negatives) on all test sets, then condition 1 fails. Issue a mandatory **non-representational** verdict and halt. (This handles hard case (i): perfect correlation with no misrepresentation.)
  - If the data is ambiguous (e.g., some misrepresentation but not systematic, or only in very rare cases) → Flag for human judgment. The auditor must decide if the misrepresentation is meaningful or noise. If after human judgment it is deemed not systematic, then condition 1 fails and the verdict is non-representational. If deemed systematic, proceed.

  **Step 2: Test for Stable Functional Role**

  **Evidence to collect:**
  - Perform ablation studies: disable the component (e.g., set its activations to zero) and measure the model's performance on a diverse set of tasks where the concept is relevant. The tasks should cover different contexts (e.g., different domains, different input modalities if applicable, different task formulations).
  - Measure the performance drop (e.g., accuracy, F1 score, or task-specific metric) in the ablated model compared to the original model.

  **Threshold for passing:**
  - The ablation must cause a significant performance drop (e.g., at least 10% relative drop in the metric) in at least two distinct contexts (e.g., two different types of tasks that require the concept) and the drop must be consistent (similar magnitude of drop across the contexts).
  - Additionally, the component must not be replaceable by a simple statistical proxy: if we replace the component's activation with a random but similarly distributed signal, the performance should drop significantly more than when we replace it with a constant (e.g., zero) or a simple proxy (like the average activation). This ensures the component is doing something specific.

  **Judgment:**
  - If the component shows a significant and consistent performance drop across multiple contexts and the component is not replaceable by a simple proxy, condition 2 is passed. Proceed to Step 3.
  - If the ablation shows no significant drop, or the drop is inconsistent (e.g., large drop in one context but no drop in another) → condition 2 fails. Issue a mandatory **non-representational** verdict and halt. (This handles hard case (ii): demonstrable misrepresentation but unstable functional role.)
  - If the ablation results are mixed (e.g., significant drop in one context but marginal in another) or if the replaceability test is ambiguous → Flag for human judgment. The auditor must decide if the functional role is sufficiently stable. If after human judgment the role is deemed unstable, condition 2 fails. Otherwise, proceed.

  **Step 3: Test for Consumer Mechanism**

  **Evidence to collect:**
  - Design counterfactual experiments: manipulate the component's activation (e.g., clamp it to high, low, or specific patterns) and observe the model's output on a set of inputs that are otherwise identical (or minimally varied).
  - The inputs should cover cases where the concept is present, absent, and ambiguous.
  - Measure how the model's behavior (output) changes in response to the manipulation. Specifically, look for changes that are consistent with the component's purported representational content.

  **Threshold for passing:**
  - The manipulated activation must cause a change in the model's output that is interpretable and consistent with the represented concept. For example:
    - If we clamp the component to high activation on an input that does not contain the concept, the model should behave as if the concept is present (e.g., output a prediction that assumes the concept) in a way that is not just random but follows a pattern.
    - Similarly, clamping to low activation on a concept-present input should cause the model to behave as if the concept is absent.
  - The change in output must be statistically significant (e.g., at least 80% of the manipulated inputs show the expected change in behavior) and the change must be specific to the concept (not a general degradation).

  **Judgment:**
  - If the consumer mechanism is demonstrated (as above), condition 3 is passed. Issue a mandatory **representational** verdict and halt.
  - If the manipulation does not lead to the expected changes in behavior (or leads to random or inconsistent changes) → condition 3 fails. Issue a mandatory **non-representational** verdict and halt.
  - If the results are partially consistent but not fully, or if the changes are observed but not specific to the concept (e.g., the manipulation causes general confusion) → Flag for human judgment. The auditor must decide if the evidence is sufficient for a consumer mechanism. If after human judgment it is deemed insufficient, condition 3 fails. Otherwise, pass and issue the representational verdict.

  **Summary of Verdicts:**
  - Non-representational: if condition 1 fails (no misrepresentation) OR condition 2 fails (unstable functional role) OR condition 3 fails (no consumer mechanism).
  - Representational: only if all three conditions are passed.

  **Handling Hard Case (iii):** If the procedure returns "representational" but the development team resists because they deny the model has the concept, the auditor must show the evidence for each condition. The procedure is designed to follow the data, and the verdict is based solely on the tests. The team's denial does not override the evidence.

