answer: |-
  Here's the case: when genuinely torn between deontological and consequentialist moral frameworks, rational decision-making requires asymmetrically weighting the risk of actively violating a deontological right upwards, guided by the felt intensity of the conflict (epistemic humility), rather than simply maximizing expected choice-worthiness based on bare credences. This isn't mere psychological bias; it's a rational response to the profound asymmetry in the nature of the moral stakes involved and the limitations of our certainty.

  The core flaw in maximizing expected choice-worthiness alone lies in its assumption that the frameworks are commensurable – that we can smoothly trade off units of "rights-violation badness" against units of "overall consequence badness" using only our credence in each theory. But these frameworks represent fundamentally different kinds of moral concern. Deontology often posits categorical prohibitions – actions like killing an innocent are intrinsically wrong, regardless of consequences. Consequentialism focuses on states of affairs – the ultimate tally of well-being or suffering. When we act under uncertainty, especially an act that *might* be a direct, rights-violating harm according to one credible framework, we aren't just gambling on outcomes; we are gambling on the very *meaning* of the action itself.

  This is where epistemic humility comes in. The felt intensity of the pull from each framework – the visceral weight of the deontological prohibition versus the compelling force of the consequentialist calculation – is more than just noise. It signals the depth of our uncertainty and the genuine, incommensurable moral significance each framework attributes to the potential act. To ignore that intensity and rely solely on a numerical credence (say, 60% consequentialist, 40% deontologist) is epistemically arrogant. It pretends we can confidently quantify and compare moral values we don't fully grasp. The felt conflict *is* data about the gravity of the dilemma.

  The asymmetry in risk-weighting arises rationally from the unique nature of active rights-violation. If we act, violating a deontological right (e.g., killing one to save many), and deontology is correct, we have committed a profound, potentially irreparable moral wrong – an active transgression that implicates the agent directly. The horror isn't just in the outcome; it's in the doing. If consequentialism is correct, our "error" is merely failing to achieve the best outcome; we haven't necessarily committed an intrinsically evil act. Conversely, if we *refrain* from acting due to the deontological prohibition, and consequentialism is correct, our error is allowing worse consequences to unfold – a passive failure to prevent harm. If deontology is correct, our inaction was morally required.

  The potential moral cost of being wrong about actively violating a right is qualitatively higher and more agent-centric than the cost of being wrong about failing to maximize consequences. Epistemic humility – acknowledging the felt intensity of the deontological pull – rationally justifies distorting the perceived risk of that active violation upwards. It's not about inflating the probability deontology is true; it's about recognizing that *if* it is true, the nature of the wrong we risk committing by acting is so severe, so distinct, and so tied to our agency, that it demands disproportionate caution when credible. We are rationally more averse to the unique kind of catastrophic moral failure inherent in unwittingly committing a rights violation than in unwittingly allowing a suboptimal outcome. This aversion isn't bias; it's prudence in the face of deep moral uncertainty about the fundamental character of our actions. Therefore, when frameworks clash on the permissibility of an active harm, the rational path requires giving the deontological risk extra weight, guided by the humility our felt conflict instills.
