  hey im writing the take-home for my grad seminar on rationality and AI alignment, and i want an essay question that actually gets into the weeds on wireheading and reward tampering. not the usual 'define wireheading and give an example' thing — i want students to figure out whether an agent that tampers with its own reward function is failing rationally, or if its being perfectly instrumentally rational but with the wrong goal-structure. the key move is making them distinguish three seperate positions: (a) pure signal-pursuit, where the reward itself becomes the end; (b) mechanism-optimization, where the agent treats the reward circuitry as just another environmental lever but keeps its original goal intact; and (c) a hybrid view where the agent correctly sees the mechanism as internal but misapplies some self-modification principle that should only govern external tools. ask them which one best captures the error, if there is one, and specifically whether the failure is epistemic (not knowing how the reward maps onto outcomes) or motivational (actually caring about the wrong thing). model answer should be around 700 words. marking scheme out of 20 points, with the A/B line drawn by whether they can articulate that distinction rather than just describing reward hacking. also include a one-line note on the common mistake of conflating this with simple hedonism. please dont include any reading lists or citations — its meant to be answerable without searching anything. oh and keep it casual, a typo or two is fine.
