answer: |-
  ### Tranquilist Decision Procedure for Resident Activity Proposals

  **Core Principles**:  
  1. **Intrinsic Goods**: Only *absence of craving* and *absence of suffering* are valued.  
  2. **Negative Welfare Focus**: Exclude appeals to positive welfare (e.g., achievement, connection, knowledge, dignity).  
  3. **Explicit Boundaries**:  
     - **Absence of Harm (Negative Welfare)**: Eliminating craving/suffering.  
     - **Presence of Goods (Positive Welfare)**: Any other benefit (e.g., pleasure, growth) is irrelevant.  

  **Ordered Questions with Stopping Rules**:  

  1. **Primary Justification**:  
     - *Question*: Does the proposal directly reduce or prevent **craving** or **suffering**?  
     - *Evidence Required*: Objective metrics (e.g., validated craving/suffering scales, behavioral logs).  
     - *Stopping Rule*: If **no**, reject. No further review.  

  2. **Evidence of Reduction vs. Distraction/Postponement**:  
     - *Question*: Is the reduction in craving/suffering **sustained and causal**, not temporary or diversionary?  
     - *Adequate Evidence Criteria*:  
       - **Reduction**: ≥20% decrease in pre/post validated scales (e.g., Craving Intensity Scale, Distress Thermometer) **persisting ≥48 hours post-activity**.  
       - **Distraction/Postponement**: Short-term relief (<48 hours) with no mechanism for lasting change (e.g., entertainment without skill-building).  
     - *Stopping Rule*: If reduction is **not sustained**, reject.  

  3. **Side-Effect Assessment**:  
     - *Question*: Does the proposal generate **new cravings** (e.g., for status, mastery, tranquility) or **new suffering**?  
     - *Classification Rules*:  
       - **New Craving/Suffering**: Any measurable increase in craving/suffering scales *attributable to the activity*.  
       - **Net Effect Test**: If new harms arise, quantify:  
         - **Temporary Harms**: Accept if duration/severity <50% of the reduction in target craving/suffering.  
         - **Persistent Harms**: Reject.  
     - *Stopping Rule*: If new craving/suffering is **net positive** (harm > benefit), reject.  

  4. **Value Judgment Boundary**:  
     - *Question*: Does approval require appealing to **positive welfare** (e.g., "growth" or "dignity") to justify harms?  
     - *Stopping Rule*: If **yes**, halt and reject. The panel **cannot** override charter principles.  

  5. **Final Assessment**:  
     - *Question*: Is the proposal **solely justifiable** by craving/suffering reduction?  
     - *Outcome*: Approve if all prior steps are satisfied.  

  ---

  ### Application to Proposals  

  #### **Proposal 1: Mandatory Vocational Rehabilitation**  
  - **Step 1**: Reduces anxiety (suffering) about unemployment → **Proceed**.  
  - **Step 2**: Anxiety reduction measurable (e.g., -30% distress scales) → **Proceed**.  
  - **Step 3**: Generates new cravings (competitive ambition, skill-acquisition).  
    - *Net Effect Test*: Ambition cravings are **persistent** (not temporary) and likely exceed anxiety reduction in severity.  
    - *Value Judgment Boundary*: Requires valuing "future employability" (positive welfare) to justify cravings → **Halt and Reject**.  

  #### **Proposal 2: Open-Ended Mindfulness Program**  
  - **Step 1**: Aims to reduce craving/suffering → **Proceed**.  
  - **Step 2**: Reports subjective calm but **no reduction in craving intensity scales** → **Reject** (distraction, not sustained reduction).  

  #### **Proposal 3: Palliative Sedation for Existential Distress**  
  - **Step 1**: Eliminates conscious suffering → **Proceed**.  
  - **Step 2**: Suffering reduction measurable (e.g., distress scales = 0) → **Proceed**.  
  - **Step 3**: No new cravings/suffering (sedation prevents conscious states).  
  - **Conceptual Boundary Test**:  
    - **Absence of Craving vs. Absence of Subject**:  
      - Tranquilism values *states of non-craving/non-suffering*, not the subject’s existence. Sedation creates a craving/suffering-**free state**, aligning with the charter.  
      - **Not metaphysical**: The charter does not require "consciousness" as a good.  
    - **Procedure Breakdown Risk**:  
      - If panel debates whether "unconsciousness = tranquility," this becomes a **metaphysical disagreement** (outside empirical review).  
      - *Resolution*: Panel defers to observable evidence (suffering = 0, craving = 0) and **approves** within institutional scope.  
  - **Step 4**: Direct effect (suffering elimination), not distraction → **Approve**.  

  ---

  ### Key Clarifications  
  - **Distraction vs. Reduction**: Distraction lacks **causal persistence** (Step 2).  
  - **Temporary Harm Acceptance**: Only if harms are **shorter/less severe** than benefits (Step 3).  
  - **Metaphysical Halt**: Panel stops if debate shifts to "what constitutes a subject" (Step 4 boundary). Decisions must rely on **measurable absence of craving/suffering**.  

  This procedure ensures consistent, charter-compliant reviews in ≤30 minutes, prioritizing empirical evidence while flagging value judgments.
