  We are constructing a decision procedure based on the tranquilist charter: only the absence of craving and the absence of suffering are intrinsic goods.
   The procedure must be an ordered set of questions with explicit stopping rules.
   We must be explicit about the boundary between negative welfare (absence of harm) and positive welfare (presence of goods), treating it as decisive.

   Proposed Decision Procedure:

   Step 1: Identify the primary mechanism of the proposal.
     Question 1: Does the proposal primarily aim to reduce or prevent suffering, or to reduce or prevent craving?
     - If yes, proceed to Step 2.
     - If no, the proposal fails because it does not target the intrinsic goods.

   Step 2: Assess the evidence of reduction in suffering or craving.
     Question 2: Is there objective and measurable evidence that the proposal reduces suffering or craving?
     - We define "objective and measurable evidence" as:
          a) For suffering: validated self-report scales (e.g., pain scales, distress scales) showing a statistically significant decrease, or behavioral indicators (e.g., reduced agitation, reduced self-harm) that are reliably observed and recorded.
          b) For craving: validated self-report scales (e.g., craving intensity scales) showing a significant decrease, or behavioral indicators (e.g., reduced engagement in addictive behaviors) that are reliably observed and recorded.
     - If the evidence is based solely on self-reports of calm or contentment, without a specific measure of craving or suffering, then it is not sufficient because calm might be a positive state (which we do not value intrinsically) and not necessarily the absence of craving or suffering.
     - If the evidence is adequate, proceed to Step 3.
     - If not, the proposal fails.

   Step 3: Evaluate the risk of inducing new cravings or new suffering.
     Question 3: Does the proposal create or exacerbate any craving (e.g., for status, mastery, material goods, or even for more tranquility) or any suffering?
     - Consider both immediate and long-term effects.
     - If the proposal does not create or exacerbate any craving or suffering, then it is acceptable.
     - If it does, then we must weigh the reduction in suffering/craving against the new craving/suffering. However, note that the charter does not allow trade-offs with other values (like achievement, connection, etc.). We are only allowed to consider the net effect on suffering and craving.

     But note: The charter does not say we can trade a reduction in suffering for an increase in craving (or vice versa). The goal is to reduce both. Therefore, we must consider:
          - If the proposal reduces suffering/craving without creating new suffering/craving, then it is acceptable.
          - If the proposal reduces suffering/craving in one area but creates new suffering/craving in another, then we must consider the net effect on the total burden of suffering and craving.

     However, we must be cautious: the charter does not allow us to value the reduction of suffering in one moment if it causes more craving (and hence potential for suffering) later. We must avoid merely postponing suffering.

     Therefore, we must ask:
          Question 3a: Is the reduction in suffering or craving achieved by the proposal likely to be sustainable without creating new or increased craving or suffering in the future?
          - If yes, and if the proposal does not create new craving or suffering in the present, then it is acceptable.
          - If no, then we must consider whether the new craving or suffering is a direct and inevitable consequence of the proposal and if the net effect is negative (i.e., the new harm outweighs the reduction), then the proposal fails.

     But note: We are not allowed to use a utilitarian calculus that aggregates. We are to focus on the intrinsic goods: absence of craving and absence of suffering. Therefore, we must break it down:

          - If the proposal eliminates suffering S1 but causes craving C1, then we have an absence of S1 (good) but the presence of C1 (bad, because we want absence of craving). Similarly, if it eliminates craving C2 but causes suffering S2, that is bad because we want absence of suffering.

          Therefore, the proposal must not cause any new craving or suffering. If it causes even one new craving or suffering, then it is introducing a negative that was not there before. But note: we are also reducing some existing suffering or craving.

          However, the charter does not tell us how to weigh multiple instances of suffering or craving. We must interpret it conservatively: we cannot accept a proposal that causes any new craving or suffering, because that would be introducing an intrinsic bad. But wait, what if the reduction in suffering is large and the new craving is small? The charter does not allow independent values, so we cannot say that the large reduction outweighs the small new craving. We are only allowed to value the absence of craving and suffering. Therefore, the presence of any craving or suffering is bad, and the absence is good. We are not allowed to aggregate.

          This leads to a problem: if we require that the proposal must not cause any new craving or suffering, then almost no proposal would pass because any activity might cause a little craving (e.g., the craving for more of that activity) or a little suffering (e.g., the discomfort of the activity). So we must interpret the charter as requiring a net reduction in the overall burden of suffering and craving? But the charter does not say "net reduction", it says the absence of craving and suffering are the only intrinsic goods.

          Alternatively, we might interpret the charter as requiring that the activity must not increase the total amount of suffering or craving. That is, the activity must not add to the burden of suffering or craving. It can only reduce.

          Therefore, we set:

          Question 3b: Does the proposal cause any new craving or suffering that would not have existed otherwise?
            - If no, then the proposal is acceptable (provided it reduces some suffering or craving).
