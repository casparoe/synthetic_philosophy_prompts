  before i go deeper, i want the full spec for what a theory that actually solves this has to meet. list teh desiderata -- teh phenomena it must cover, teh distinctions it can't collapse (like pleasure vs preference satisfaction, or 'thin' vs 'thick' pleasure), teh biological results it can't contradict, and teh cases that must come out right. for each one, say why it's a real requirement and not just prejudice from teh phenomenolgy camp or teh neuroscience camp.

  i especially want you to flag if any two requirements are jointly unsatisfiable. for instance, if one requirement is that teh common factor must be introspectivly accessable, and another is that it applies to non-human animals with very different nervous systems, do those clash? that's teh part i care about most.

  and please, keep it practical: no reading lists, no 'see so-and-so 1992' -- i can't verify any of that and don't want guesses. just teh criteria, which ones are negotiable, and a brief scorecard of how teh main views (felt-quality, attitude-based, functional/reward) do against teh list. also, don't just handwave with 'positive affect' -- i want to know if that's actually explaining anything or just renaming teh problem.
