  First, I need to unpack the difference between these two types of certainty. Universal facts are things we can't really deny without questioning reality itself, like the sun rising. But family connections? Those are socially constructed truths. They rely on shared stories, documents, and mutual recognition. The user mentions birth certificates, but even those are part of a system we trust collectively. 

