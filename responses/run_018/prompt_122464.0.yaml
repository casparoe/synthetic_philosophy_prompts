prompt: |-
  i keep reading interpretability papers that say things like "the model represents deceptiveness" or "direction 12,847 in the residual stream codes for the Golden Gate Bridge", and I genuinely can't tell what would make those claims true or false. before I read any more of it I want the spec.

  what I need it for: an audit. someone hands me a trained system and a claim that it represents X, and I have to decide whether "it represents X" is the kind of sentence I'm willing to write into a safety case for deployment. so I don't need a theory good enough for a philosophy of mind journal; I need one that tells me what I'd have to establish, and how sure I'd have to be, before a deployment decision rests on it.

  so write me the requirements list: what any adequate account of "neural network N represents feature F" has to deliver to be usable for that, with the case behind each requirement. the ones I keep tripping over, in no order, and please add the ones I'm missing:

  - it has to not be trivial. every system covaries with something in its environment; a tree ring carries information about rainfall and we don't rush to say it represents rainfall. what does a network have to be doing over and above carrying information?
  - it has to rule out gerrymandered features — if I can always find some direction or some disjunctive region of activation space that fits any labelling of my dataset I like, then "represents F" is doing no work.
  - it has to say something about the basis problem. there's no privileged basis in a residual stream, so "the feature is a direction" seems to be a fact about coordinates rather than about the network. but people reply that sparsity, or the training dynamics, or the data geometry picks out a basis, and I can't tell if that's an answer or a shrug.
  - it has to handle superposition and polysemanticity: one unit, many features; more features than dimensions; and the related granularity mess where widening a dictionary splits one feature into five and I can't tell whether the network has five features or one or whether that question has an answer at all.
  - it has to distinguish the network using a feature from a probe reading a feature off it, and it has to survive the awkward cases: you knock out the circuit that supposedly implements F and the model keeps behaving fine because other components compensate; or the feature is causally load-bearing in one context and inert in another.
  - it has to give me a standard of misrepresentation. if a representation can be wrong, what makes it wrong for a network — the training distribution, the objective, the designer's intentions, the distal cause that historically shaped the weights? a vision system confidently calls a graffitied stop sign something else; is that a misrepresentation, or just an input the network never represented in the first place?
  - it has to handle identity over time and across systems. features seem to rotate and drift across checkpoints and across fine-tuning; models trained on different data seem to converge on similar ones, and people now train a single dictionary across two different models and get shared features. when is it the same feature in two places?
  - and it has to handle second-order cases: a network that has a feature for "my F-detector fired", or that reports in natural language that it's thinking about F. is that a representation of F, a representation of its own representing, or neither?

  for each one say whether it's non-negotiable or just a preference of some camp, and be honest if a subset of them can't be satisfied together — that's the part I most want, if the list turns out to be inconsistent. also tell me which single requirement knocks out the most popular accounts people actually lean on, and why.

  two other things. I keep saying "I don't care about the metaphysics, I just want to know whether the feature is really in there" — if that sentence is incoherent, say so. and my own hunch is that the basis thing already settles the whole debate: no privileged basis, so there are no facts about what a network represents, only features-relative-to-an-interpreter, and the rest is bookkeeping. wasnt sure whether that's a real argument or a non sequitur, so push back on it if it is. skip a long scorecard of specific methods (probes, dictionaries, circuit analysis) unless scoring one of them actually changes what belongs on the list.
reasoning: |-
  We are building a requirements list for an account of "neural network N represents feature F" that is suitable for a safety audit. The goal is to have a set of criteria that, when met, would allow us to confidently include claims about the network's representations in a safety case for deployment.

  We'll address each of your points and add any missing ones. For each requirement, we'll state whether it's non-negotiable (essential for the audit) or a preference (which might vary by context), and we'll note if there are conflicts. We'll also identify which requirement is the most challenging for popular accounts.

  ### 1. Non-Triviality
  **Requirement**: The account must not be trivial. It must require more than mere covariation (like tree rings and rainfall). The network must be doing something over and above carrying information about F.

  **Case**: For safety, we care about representations that are actively used by the network in a way that affects behavior. If the representation is merely present but not used, it might not be relevant for safety.

  **Non-negotiable?** Non-negotiable. We need to avoid false positives where any correlation counts.

  ### 2. Anti-Gerrymandering
  **Requirement**: The account must rule out gerrymandered features. We must not be able to arbitrarily define a feature by partitioning activation space to fit any labeling.

  **Case**: If we allow gerrymandering, then every possible feature can be "found", making the claim "represents F" vacuous.

  **Non-negotiable?** Non-negotiable. Without this, we cannot trust that the feature is meaningful.

  ### 3. Basis Problem
  **Requirement**: The account must address the basis problem. Since the residual stream has no privileged basis, if the feature is defined as a direction, the account must explain how a particular basis is selected (e.g., via sparsity, training dynamics, or data geometry) in a non-arbitrary way.

  **Case**: Without a non-arbitrary basis, the feature might be an artifact of the coordinate system we choose, not the network.

  **Non-negotiable?** Non-negotiable. This is fundamental to the ontology of features in the network.

  ### 4. Superposition and Polysemanticity
  **Requirement**: The account must handle superposition (many features in fewer dimensions) and polysemanticity (one unit responding to many features). It must also address granularity issues (e.g., splitting one feature into five when we change the dictionary size).

  **Case**: Real networks exhibit these phenomena, so the account must not break down when they occur.

  **Non-negotiable?** Non-negotiable. These are observed properties of neural networks.

  ### 5. Causal vs. Descriptive
  **Requirement**: The account must distinguish between the network using a feature internally and a probe reading a feature. It must also handle cases where knocking out a circuit does not affect behavior (due to compensation) or where a feature is contextually causal.

  **Case**: For safety, we care about causal role. If a feature is not causally involved, it might not be relevant for deployment safety.

  **Non-negotiable?** Non-negotiable. We need to know if the feature is actually doing work.

  ### 6. Misrepresentation
  **Requirement**: The account must provide a standard for when the representation is wrong (misrepresentation). It must clarify what grounds the correctness condition (e.g., training distribution, objective, designer intent, distal cause).

  **Case**: We need to know if the network is making a mistake (e.g., misclassifying a stop sign with graffiti) and whether that mistake is a misrepresentation or an out-of-distribution input.

  **Non-negotiable?** Non-negotiable for a safety audit. We must assess reliability and failure modes.

  ### 7. Identity Across Time and Systems
  **Requirement**: The account must handle identity of features over time (e.g., across checkpoints, fine-tuning) and across different models (e.g., when a dictionary is trained across models and finds shared features).

  **Case**: For safety, we might want to track a feature during training or transfer, or compare models.

  **Non-negotiable?** Negotiable to some extent. It might be sufficient to have a similarity measure rather than strict identity. But for auditing, we need to know when two representations are "the same" for practical purposes.

  ### 8. Second-Order Representations
  **Requirement**: The account must handle second-order cases, such as a feature for "my F-detector fired" or the network reporting in natural language that it is thinking about F.

  **Case**: We need to know if the network has self-referential representations and whether they are distinct from first-order ones.

  **Non-negotiable?** Non-negotiable if we are to handle advanced systems with self-monitoring.

  ### Additional Requirements

  #### 9. Operationalizability
  **Requirement**: The account must be operationalizable. We must be able to test for the presence of the feature with reasonable effort and confidence.

  **Case**: An audit requires actionable evidence, not just theory.

  **Non-negotiable?** Non-negotiable. Without tests, we cannot audit.

  #### 10. Robustness to Distribution Shift
  **Requirement**: The account should clarify how the representation behaves under distribution shift (e.g., when inputs are out-of-distribution). Does the representation break, or does it still track F?

  **Case**: Safety-critical systems must perform reliably in novel situations.

  **Non-negotiable?** Non-negotiable for deployment safety.

  #### 11. Scalability
  **Requirement**: The method for establishing representation must scale to large networks and high-dimensional features.

  **Case**: We are auditing large language models, not small proofs of concept.

  **Non-negotiable?** Non-negotiable. The account must be applicable in practice.

  ---

  ### Conflicts and Tensions
  - **Basis Problem vs. Superposition**: Addressing the basis problem without denying superposition is challenging. Some accounts (like those relying on sparsity) might handle both, but it's nontrivial.
  - **Causal Role vs. Probe-Based Detection**: If we require causal role (knockout experiments), it becomes expensive to test. If we rely on probes, we might detect features that aren't used. We must balance these.
  - **Misrepresentation Standards**: What grounds correctness? If we use training distribution, then OOD inputs are not misrepresentations. But for safety, we care about OOD behavior. This might require a hybrid account.

  ### The Most Challenging Requirement
  The **basis problem** is the most challenging for popular accounts. Many methods (like linear probes or activation patching) assume a basis (e.g., the neuron basis or an arbitrary coordinate system). If there is no privileged basis, then claims about "direction 12,847" might be arbitrary. The common reply (sparsity, training dynamics) is an empirical claim that might hold in practice but is not yet fully grounded. This requirement alone might force us to accept that representations are relative to an interpreter, which would be a problem for the audit because it introduces subjectivity.

  ### Your Hunches
  - **"I don't care about the metaphysics, I just want to know whether the feature is really in there"**: This is not incoherent. We can adopt a functionalist perspective: the feature is "really in there" if it plays a functional role in the network's computations. But we still need to define that role without metaphysics.
  - **Basis problem as a showstopper**: If there is no privileged basis, then representations might be relative. However, we can look for natural bases induced by the network's training (e.g., via the SVD of the weight matrices, or by the structure of the data). This is an active research area. We cannot dismiss it as a non sequitur, but we also cannot ignore it. For an audit, we might require that the basis is non-arbitrary by being:
    - Aligned with the network's dynamics (e.g., eigenvectors of the Hessian).
    - Sparse in that basis.
    - Consistent across similar models or training runs.

  ### Summary of Non-Negotiables
  All requirements except possibly the strict identity in requirement 7 are non-negotiable for a safety audit. The list is challenging but not impossible. However, the basis problem and the causal role requirement together are the most difficult to satisfy with current methods.

  ### The Most Damaging Requirement for Popular Accounts
  **Basis problem** knocks out many popular accounts (like interpreting individual neurons or arbitrary linear directions) because they rely on an unprivileged basis. Methods that use sparse autoencoders or other learned dictionaries might address this by learning a basis that is natural for the network, but that shifts the burden to why that dictionary is privileged.

  ### Conclusion
  For an audit, we must require:
  1. A non-arbitrary basis (from training/data/network dynamics).
  2. Causal involvement (via interventions).
  3. Non-triviality and anti-gerrymandering (via robustness and generalization tests).
  4. A standard for misrepresentation (aligned with safety, e.g., performance on a test set that includes challenging cases).
  5. Tests for the above that are scalable and operational.

  Without these, we risk building safety cases on sand.
answer: |-
  Here's a requirements list for an account of "neural network N represents feature F" tailored to your safety audit use case. Each requirement is justified, classified as non-negotiable or contextual, and assessed for conflicts. The goal is pragmatic: **what must be true to justify including "N represents F" in a deployment safety case**, with consequences for skipping requirements noted.

  ---

  ### **1. Non-Triviality: Beyond Covariation**  
  **Requirement**: The account must require a *causal or functional role* beyond statistical correlation. Covariation alone (e.g., tree rings and rainfall) is insufficient.  
  **Case for Safety**: Safety cases rely on features that *influence behavior*. If F is merely correlated with inputs/outputs but not used by the network, it can't predict failures.  
  **Non-negotiable? YES**. Without this, any correlated noise becomes a "representation," leading to false confidence.  
  **Consequence of omission**: Audits risk endorsing irrelevant features, undermining safety claims.

  ---

  ### **2. Anti-Gerrymandering: No Arbitrary Features**  
  **Requirement**: The account must prevent "feature hacking" – e.g., disjunctive activations that fit any arbitrary labeling of data.  
  **Case for Safety**: Gerrymandered features are post hoc explanations with no predictive validity. Deployment safety requires features that generalize robustly.  
  **Non-negotiable? YES**. Otherwise, any claim "N represents F" can be "proven" with enough data massage.  
  **Consequence of omission**: Safety cases become unfalsifiable.

  ---

  ### **3. Basis Problem Resolution: Privileged Basis Required**  
  **Requirement**: The account must specify why a *particular basis* (e.g., direction 12,847) is non-arbitrary. Appeals to "sparsity" or "training dynamics" must be operationalized.  
  **Case for Safety**: If features are basis-dependent, claims like "direction X codes for Y" are subjective without evidence the basis is natural to the network.  
  **Non-negotiable? YES**. Basis relativity undermines objectivity in audits.  
  **Conflict Alert**: Directly clashes with superposition (Req 4) – sparse bases may not exist in polysemantic networks.  
  **Consequence of omission**: Feature claims are interpreter-dependent, not network-dependent.

  ---

  ### **4. Superposition/Polysemanticity Handling: High-Dimensional Features**  
  **Requirement**: The account must explain how F persists when features are entangled (e.g., one neuron firing for "cats" and "dogs") or split across dimensions (e.g., "Golden Gate Bridge" vs. "suspension bridges").  
  **Case for Safety**: Real networks use superposition; ignoring it misses compensatory mechanisms that could fail.  
  **Non-negotiable? YES**. Audits must handle real architectures, not idealized ones.  
  **Granularity Note**: The account need not resolve "is it one feature or five?" but must specify *how F is defined* (e.g., "bridge-ness" vs. GG Bridge specifics).  
  **Consequence of omission**: Safety cases may miss feature interactions causing emergent failures.

  ---

  ### **5. Causal Specificity: Use vs. Detection**  
  **Requirement**: The account must distinguish:  
  - (a) F being *used by N* in computation (e.g., F is causally necessary for outputs),  
  - (b) F being *detectable by probes* (e.g., linear reads F from activations).  
  It must handle compensation (knockout doesn't break behavior) and context-dependence (F matters only in some inputs).  
  **Case for Safety**: Only (a) is safety-relevant. Probes can find decoy features; compensation hides single points of failure.  
  **Non-negotiable? YES**. Probes alone are inadequate for behavioral guarantees.  
  **Consequence of omission**: Audits may certify "detected" features that don't affect behavior.

  ---

  ### **6. Misrepresentation Standard: Grounded Correctness**  
  **Requirement**: The account must define when F is *wrong* (e.g., network "calls a stop sign a cat"). Correctness must be grounded in:  
  - The network’s *training objective* (e.g., cross-entropy loss),  
  - Not designer intent, historical causes, or ideal semantics (to avoid metaphysics).  
  **Case for Safety**: Deployment requires knowing when the system errs. "Never represented" (OOD) vs. "misrepresented" changes mitigation.  
  **Non-negotiable? YES**. Without this, safety cases can't bound reliability.  
  **Consequence of omission**: Undefined failure modes; can't specify operational envelopes.

  ---

  ### **7. Cross-System Identity: Feature Stability**  
  **Requirement**: The account must define similarity conditions for "same F" across:  
  - Time (e.g., checkpoint drift),  
  - Models (e.g., same architecture, different data).  
  Functional equivalence (e.g., F plays identical causal roles) suffices; exact vectors are unnecessary.  
  **Case for Safety**: Safety cases often generalize from testbeds to deployed models.  
  **Non-negotiable? CONTEXTUAL**. Necessary if auditing multi-model systems or training stability; optional for single snapshots.  
  **Consequence of omission**: Limits claims to specific model instances.

  ---

  ### **8. Second-Order Cases: Self-Referential Features**  
  **Requirement**: The account must clarify whether "N represents F" vs. "N represents *that it represents F*". This requires evidence of *recursive computation* (e.g., F influences meta-cognition circuits).  
  **Case for Safety**: Systems reporting "I am deceptive" could be high-risk; audits must verify if this is "true" self-monitoring.  
  **Non-negotiable? YES for advanced systems**. Skip for narrow ML.  
  **Consequence of omission**: Misinterpreting self-reports as evidence of safety/misalignment.

  ---

  ### **Added Requirement: Operationalizability**  
  **Requirement**: The account must enable *testing* "N represents F" with feasible audits. This requires:  
  - Clear measurement protocols (e.g., interventions, not just probes),  
  - Acceptable confidence bounds (e.g., 95% statistical significance for causal tests).  
  **Case for Safety**: Audits are practical exercises; untestable theories are useless.  
  **Non-negotiable? YES**.  
  **Consequence of omission**: Safety cases rely on speculation.

  ---

  ### **Key Tensions and Conflicts**  
  - **Fatal Conflict**: **Basis Problem (3) + Superposition (4)**. Sparse bases (Req 3) may not exist in polysemantic networks (Req 4). *Resolution*: Demand evidence the basis is *functionally* privileged (e.g., via causal impact), not just sparse.  
  - **Risk of Subjectivity**: **Anti-Gerrymandering (2) + Basis Problem (3)**. Without a privileged basis, gerrymandering is unavoidable. *Resolution*: Require features to be *causally necessary* (Req 5), making them robust to basis choices.  
  - **Incompatible Triad**:  
    - Non-trivial covariation (Req 1),  
    - Basis independence (opposes Req 3),  
    - Operationalizability (Req 9).  
    *Most accounts sacrifice basis independence* for testability.  

  **Most Damaging Requirement for Popular Methods**:  
  **Basis Problem (3)**. It invalidates:  
  - **Direction-based claims** (e.g., "feature 12,847"): Without privileged basis, these are coordinate artifacts.  
  - **Neuron-based interpretations**: Neurons are a basis with no special status; superposition breaks 1:1 mappings.  
  *Why?* If the basis isn't privileged, "N represents F" is only true relative to an interpreter, making audits subjective.  

  ---

  ### **Your Hunches Addressed**  
  - **"I don't care about metaphysics, is the feature *really* there?"**: This is **coherent** if "really" means *causally functional in the network's computation*. For example: "F is really there if ablating it changes behavior for F-relevant inputs." Avoids metaphysics by focusing on interventionist tests.  
  - **Basis Problem as Decisive**: **Not a non sequitur, but overstated**. Basis relativity *does* threaten objectivity (Req 3), but:  
    - Networks *do* develop *approximately* sparse bases via training dynamics (e.g., neurons fire for human-interpretable features).  
    - **Workaround**: Shift from "direction X represents F" to "the *subspace* for F is causally necessary." This is basis-invariant.  
    - **Verification**: Use *causal interventions* (Req 5) to ground features regardless of basis.  

  ---

  ### **Recommendation for Audits**  
  To approve "N represents F" in a safety case, you must verify:  
  1. **Causal Necessity** (Req 5): Ablating F degrades performance *on F-specific inputs*.  
  2. **Non-Triviality** (Req 1): F isn't just correlated; it's used in computations.  
  3. **Misrepresentation Tests** (Req 6): F fails when the network makes errors on F.  
  4. **Basis Justification** (Req 3): If using directions/neurons, show they align with network function (e.g., via gradient-based relevance).  

  **Methods That (Partly) Deliver**:  
  - **Causal Scrubbing / Circuit Analysis**: Meets Reqs 1, 5, 6. Weak on Req 4 (superposition).  
  - **Sparse Autoencoders**: Addresses Req 3/4 if sparsity is causally validated. Fails Req 5 if not tested interventionally.  
  - **Probes + Knockouts**: Combines detection (probes) with causal tests (knockouts) for Reqs 5/6.  

  **Bottom Line**: Without **causal validation** (Req 5) and **basis justification** (Req 3), no account is audit-safe. Start with interventionist methods; dismiss claims lacking causal evidence.
