answer: |-
  1.  Modern economies risk replicating agricultural lock-in: Just as grain surpluses solidified inequality, accumulated capital (factories, IP, data) creates entrenched power structures resistant to redistribution, making egalitarian reform perpetually harder.  
  2.  Climate adaptation necessitates institutional "mobility": Avoiding irreversible commitment to vulnerable fixed infrastructure (like dense coastal cities) requires building systems with high abandonment/reconfiguration capacity, mimicking foraging's spatial flexibility.  
  3.  Growth dependency mirrors surplus traps: Agricultural societies became locked into expansion cycles to sustain hierarchy; similarly, modern economies exhibit path dependency where stopping growth triggers systemic collapse, eliminating simpler stability options.  
  4.  Resilience demands reversible hierarchy: Foraging's flatness allowed power to dissolve under stress; modern institutions must intentionally design mechanisms (like sunset clauses or asset caps) to prevent permanent elite capture during crises.  
  5.  Technological "storage" can erode systemic options: Like grain enabling monopoly, technologies optimized for control and surplus (e.g., centralized AI, industrial agriculture) inherently reduce societal plasticity, making future adaptation or collapse recovery harder.
