  Okay, let me unpack this HPS query. The user is a PhD student working on mid-century biomedicine who keeps getting pushback for using "paradigm shift" loosely in workshops. They want a rigorous specification of what makes something distinctively Kuhnian before comparing Kuhn/Lakatos/Feyerabend. 

  First, I notice they've already done significant groundwork - they've identified four key requirements: incommensurability of standards, meaning change vs belief change, granularity below discipline-level, and diagnosability from historical evidence. That's strong framing. Their frustration with "many anomalies, no crisis" scenarios also resonates - I recall Kuhn himself struggled with defining crisis thresholds.

  The two test cases are revealing: the psychology replication crisis feels like it might expose where Kuhn's model strains, while the psychiatry nosology shift could probe meaning-change boundaries. The user's archival focus (grant files, referee reports) suggests they need operational criteria, not just philosophical distinctions. 

  I should structure this around non-negotiables vs contested points. The core Kuhnian features seem to be: standards-changing revolutions, meaning variance, and crisis as social breakdown. But granularity and diagnosability are where most historians get tripped up - Kuhn wrote about "mature sciences" but biomed often shifts at subfield level. 

  For the replication crisis case: it shows anomalies but no rival paradigm emerged - still puzzle-solving within behaviorist frameworks. Whereas the psychiatry shift involves redefining what "disorder" means - that smells more like meaning variance. But is a diagnostic manual change "paradigm"-level? Only if it cascades to methods, exemplars, standards... which their archives could trace through referee debates over what counts as valid evidence.

  The trickiest tension is between their need for local granularity and Kuhn's requirement of community-wide change. Maybe Laudan's "research traditions" would handle this better, but then we lose the crisis component. And realists will hate how Kuhn makes progress contingent, while sociologists might overindex on authority figures in grant committees. 

  Ultimately the user seems to want collision points - where requirements pull against each other. Like: if you demand clear meaning-change evidence from correspondence, but meaning change only manifests in practice... that's why replication crisis documents show scientists complaining about methods, not reinventing "replication." Whereas their psychiatry case has explicit debates about whether "anxiety" is a natural kind. 

  I'll flag that tension hard - it's precisely where their archival work could advance the philosophy.
answer: |-
  Here's a rigorous specification for identifying a Kuhnian paradigm shift, designed for historical diagnosis in biomedicine. Requirements are categorized, with core Kuhnian non-negotiables marked (**★**), contested points noted, and tensions highlighted. Your two cases are referenced throughout.

  ---

  ### **Core Kuhnian Non-Negotiables (★)**  
  *Without these, it's not Kuhn's concept:*

  1.  **★ Standards/Values Change as Part of the Shift:**  
      *Requirement:* Must explain how *criteria for evaluating theories* (e.g., what counts as "good evidence," "significant problem," or "elegant solution") shift alongside theories themselves. Comparison isn't neutral.  
      *Case/Consideration:* Post-shift, proponents literally "see different things" (Kuhn's duck-rabbit). E.g., 19th vs. 20th century "cell theory" standards (morphology vs. biochemistry).  
      *Your Archives:* Look for referees dismissing work *not as wrong, but as irrelevant/ill-conceived*; grant panels redefining "rigor."

  2.  **★ Meaning Variance (Not Just Reference/Truth-Value Change):**  
      *Requirement:* Must distinguish terms retaining spelling but shifting semantic content/relations ("immune," "stress"). New paradigms redefine the conceptual lexicon.  
      *Case/Consideration:* "Phlogiston" vs. "Oxygen" isn't just swapping labels; chemical reactions are reconceived. Lavoisier didn't prove phlogiston false; he made it incoherent.  
      *Your Archives:* Track *operational definitions* in methods sections, arguments over "what X *really means*," or terms used in mutually incompatible ways concurrently.

  3.  **★ Crisis Precedes Revolution:**  
      *Requirement:* Must involve a breakdown where *normal science demonstrably fails* to solve key puzzles, causing loss of confidence *within the community*, not just anomaly accumulation.  
      *Case/Consideration:* Anomalies alone ≠ crisis (e.g., Mercury's orbit pre-1915). Crisis = pervasive sense the *tools are broken*.  
      *"Many Anomalies, No Crisis":* Kuhn's Achilles' heel. Requires showing community *perceives* anomalies as fundamental flaws, not puzzles.  
      *Diagnosis:* Letters/lab notes expressing despair ("we're stuck"); sudden shifts in funding priorities; proliferation of ad-hoc fixes seen as degenerate.  
      *Psychology Replication Crisis:* **Likely Not Crisis (Yet)**. Anomalies abound, but dominant tools (NHST, RCTs) are still defended/patched. No clear *incommensurable* successor paradigm emerged. It's normal science (messy) repair.

  4.  **★ Incommensurability (Partial, Not Total):**  
      *Requirement:* Must address communication breakdown/partial untranslatability between paradigms, stemming from points 1 & 2. Successor isn't judged solely by predecessor's rules.  
      *Case/Consideration:* Wave vs. particle optics debates; vitalism vs. mechanism in physiology. Proponents talk past each other.  
      *Diagnosis:* Look for *mutual accusations of irrationality*, frustration in correspondence ("they just don't get it"), failed attempts at synthesis.

  ---

  ### **Contested Requirements (Where Camps Diverge)**  
  *Kuhn leans here, but alternatives exist:*

  5.  **Granularity (Sub-Discipline/Lab Level Applicability):**  
      *Requirement:* Model must work below "mature science" level. Shifts can be local.  
      *Kuhn:* Ambivalent, often wrote about physics/astronomy. Sociologists/historians push this (e.g., Pickering on particle physics subfields).  
      *Contention:* Realists/Lakatosians might see this as merely "program adjustment."  
      *Diagnosis:* Your archives excel here. Trace shifts in *one lab's core techniques/exemplars* influencing a subfield.  
      *Psychiatry Nosology Shift:* **Strong Candidate for Local Shift.** If DSM categories (syndromes) vs. RDoC (mechanisms) involve *different standards* (clustering symptoms vs. neural circuits), *meaning change* ("schizophrenia" as syndrome vs. potential multiple circuit dysfunctions), and *crisis* (DSM reliability/validity failures triggering RDoC), it fits. Granularity is key.

  6.  **Role of Non-Epistemic/Social Factors:**  
      *Requirement:* Must allow social/organizational factors (funding, authority, training) to play a *constitutive* role in *stabilizing* the shift, not just causing it.  
      *Kuhn/Sociologists:* Yes, essential (new journals, textbooks, professorships).  
      *Realists/Lakatosians:* Epistemic factors should be primary; social factors are noise.  
      *Diagnosis:* Grant files (who funds what new?), hiring patterns, textbook changes, society leadership shifts.

  7.  **Non-Cumulative Progress:**  
      *Requirement:* Successor need not preserve all validated content of predecessor; gains in one area may involve losses in another.  
      *Kuhn/Feyerabend:* Yes. Progress is toward solving new puzzles, not linear truth-accumulation.  
      *Realists/Lakatos:* Strong preference for cumulativity (correspondence principle).  
      *Case:* Loss of predictive power in specific areas during early quantum mechanics vs. classical mechanics.

  ---

  ### **Critical Tensions & Diagnosability Challenges**

  *   **★Crisis Diagnosis vs. "Many Anomalies, No Crisis" (Your Key Pain Point):**  
      Kuhn lacks a bright line. *Diagnosis hinges on community perception.* Evidence: Sudden surge in speculative reviews; explicit calls for "new approaches"; veteran scientists abandoning core methods; funding bodies prioritizing "high-risk" alternatives. If anomalies are still seen as *puzzles*, it's normal science. **Psychology Replication Crisis:** Anomalies exist, but NHST/RCTs remain the *tools* used to diagnose the crisis. No rival *incommensurable* toolkit dominates. It's meta-normal science.

  *   **Granularity vs. Standards/Meaning Change:**  
      Can a *lab's* shift truly change *standards*? Only if it cascades. *Diagnosis:* Does the shift redefine what counts as a "good experiment" or "explanation" *for others*? Referee reports rejecting work based on *old* standards post-shift are gold.

  *   **Meaning Change vs. Diagnosability:**  
      How to spot *conceptual* drift without hindsight? *Diagnosis:* Contemporaneous debates about definitions; inconsistent use of terms in key papers; new measurement techniques making old operationalizations obsolete; explicit statements about "rethinking fundamentals."

  *   **Social Factors vs. Realist Objections:**  
      Can you show social reorganization *enabling* the shift without *reducing* it to power politics? *Diagnosis:* Link new social structures (labs, journals) to the *stabilization* of new epistemic practices/concepts evident in research outputs.

  ---

  ### **Your Cases Against the List**

  *   **Psychology Replication Crisis:**  
      *   ★Standards Change? *Partial* (emphasis on pre-reg, power) but NHST core remains. **No.**
      *   ★Meaning Change? "Replication" is contested, but not fundamentally redefined like "atom." **No.**
      *   ★Crisis? Widespread perception of failure, **Yes.** But...
      *   ★Incommensurable Successor? No dominant rival paradigm emerged. Tools of critique = tools of normal science. **No.**
      *   **Verdict:** Profound *crisis within* normal science, triggering methodological reform, **not a paradigm shift.**

  *   **Psychiatry Nosology (Syndrome -> Mechanisms e.g., RDoC):**  
      *   ★Standards Change? Yes. "Validity" shifts from clinical symptom clustering to alignment with neurobiological circuits. Explanatory goals change. **Yes.**
      *   ★Meaning Change? "Mental disorder," specific category labels (e.g., "depression") likely undergo significant semantic shift. **Yes.**
      *   ★Crisis? Perceived failure of syndromal categories to map to biology/therapeutics, triggering RDoC/NIMH funding shift. **Yes.**
      *   ★Incommensurability? Proponents see different problems/solutions; communication breakdown evident. **Yes.**
      *   Granularity? Operates at subfield level (research psychiatry/cognitive neuroscience), but aims to redefine the field. **Plausible.**
      *   **Verdict:** **Strong candidate for a local paradigm shift** by Kuhnian criteria, especially if the epistemic/social practices of the subfield reconfigure around the new standards.

  ---

  **Key Takeaway:** The irreducibly Kuhnian core is **★Standards Change + ★Meaning Variance + ★Crisis + ★Partial Incommensurability.** Your challenge is diagnosing crisis *as perceived then* and meaning change *without hindsight*. Granularity is achievable but requires showing the shift reconfigures local practices. The "many anomalies, no crisis" problem remains Kuhn's weakest spot – focus on community *rhetoric and resource allocation* as your archival signal. Now go score those philosophers! Your cases are perfect testbeds.
