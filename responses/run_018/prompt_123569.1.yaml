  ## Sestina of the Visible and the Cut

  They say the climb requires a certain **light**,
  A beacon earned, not dimmed or forced to bend.
  But she insists that growth invites the **cut**,
  That towering heights distort the **common** view.
  This argument we chase, a stubborn **shadow**:
  Is praise a poison? Should we cease to **try**?

  My faith demands the proof be **visible**:
  The self-made soul, escaped the grinding **shadow**,
  A testament that grit can find the **light**.
  It fuels the dream – why else would millions **try**?
  She calls it dangerous, not wise or **common**,
  A spectacle that begs to be laid **cut**.

  "To shield the whole," she says, "requires the **cut**.
  That brilliant glare you prize, so **visible**,
  Blinds others to the paths that are **common**,
  Makes honest effort seem a wasted **try**.
  It breeds a sickness in the shared **light**,
  Casts doubt where trust should stand, a long **shadow**."

  "It isn't envy," she contends, "that **shadow**,
  But care. That singular, sharp glare you **cut**
  From the whole cloth? It warps the **visible**
  Landscape. What seems like earned, pure **light**
  Makes neighbors feel their honest sweat won't **try**
  Or matter. We uphold the **common** good."

  "Yet hope," I counter, "feeds on what's **common**:
  The sight of triumph. Without it, **shadow**
  Creeps deep. Why strive? What point is left to **try**
  If every bloom that rises gets the **cut**?
  That shining proof, that hard-won **light**,
  Is oxygen. It makes the dream **visible**!"

  "**Visible** success," she sighs, "is tricky **light**.
  It spreads two ways: a fire, pure delight
  That sparks the will, makes others burn to **try**...
  Or shows the game is rigged, a bitter **cut**
  Revealing luck or lies behind the **shadow**.
  It fractures faith in effort, **common** ground."

  Is triumph then contagious, or a **shadow**
  That stains the worth of every earnest **try**?
  Her **common** ground, my fiercely guarded **light** –
  The blade she calls protection, sharp to **cut** –
  This **visible** tension, sharp, profound.

  **(Envoy)**
  The **common** field holds both the **light** and **shadow**.
  We **try** to parse the **cut** that makes the **visible** plain.
