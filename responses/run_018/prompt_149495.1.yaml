answer: |-
  Here’s a precise principle unifying your intuitions:  
  **"When cluelessness obscures the *sign* of expected value (EV) — i.e., whether net effects are positive/negative — default to inaction. When cluelessness obscures only the *magnitude* of a reliably positive EV, default to action."**  

  ### Applied to your cases:  
  1.  **Bednets:** Magnitude-clueless, sign-positive → **Do it.**  
  2.  **Geoengineering:** Sign-clueless (tail risks could flip EV negative) → **Don’t do it.**  
  3.  **AI-safety job:** Sign-clueless (may *accelerate* extinction) → **Lean against** (aligns).  
  4.  **Carbon tax:** Sign-positive (inaction has known-negative EV; economic noise is magnitude-only) → **Vote yes.**  
  5.  **Wild-animal research:** Sign-clueless (interventions could *increase* suffering via population dynamics) → **Don’t fund** (until sign resolved).  

  ### Tension resolved:  
  - **2 vs 4:** Geoengineering risks sign-flip; carbon tax doesn’t (baseline inaction is worse).  
  - **No verdict killed:** All cases align. Principle accepts your "lean against" for (3) as a sign-cluelessness default.  

  **Why sign matters:** Sign-cluelessness implies actions could be net harmful, violating the precautionary principle. Magnitude-cluelessness doesn’t reverse moral direction.
