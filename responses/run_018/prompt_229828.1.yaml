  Verdict: The residue (normative deference) isn't a defect of forecasting vocabulary but evidence of Reflection overloading rational coherence with epistemic authority. Forecasters need only the martingale condition for internal consistency; demanding perfect calibration of future selves imports external validation that's neither necessary nor rational when learning is non-ideal.
answer: |-
  ### Bottom Line:
  The untranslated residue—specifically, the *normative demand to treat one's future self as a perfect calibrator*—is not a defect of forecasting vocabulary but evidence that Reflection overloads a weak martingale coherence condition (rational under ideal learning) with a distinctively strong and often irrational deference requirement, which counterexamples exploit by violating the idealization.

  ---

  ### Translation of Reflection into Forecasting Vocabulary
  Let $(\Omega, \mathcal{F}, \mathbb{P})$ be a probability space with an increasing filtration $\{\mathcal{F}_t\}_{t \geq 0}$ representing information available at time $t$. Let $A \in \mathcal{F}$ be a proposition. Define:
  - **Current credence at $t$**: $P_t(A) = \mathbb{E}[\mathbf{1}_A \mid \mathcal{F}_t]$
  - **Future credence at $t+\delta$**: $P_{t+\delta}(A) = \mathbb{E}[\mathbf{1}_A \mid \mathcal{F}_{t+\delta}]$

  **Reflection Principle (Measure-Theoretic Restatement)**:
  \[
  \mathbb{E}[P_{t+\delta}(A) \mid \mathcal{F}_t] = P_t(A) \quad \text{when conditioning on } P_{t+\delta}(A) = r.
  \]
  Equivalently, for all $r \in [0,1]$ and $\mathcal{F}_t$-measurable sets $B_r = \{\omega : P_{t+\delta}(A) = r\}$:
  \[
  \mathbb{P}(A \mid \mathcal{F}_t \cap B_r) = r \quad \text{a.s. on } B_r.
  \]

  **Diachronic Dutch Book Argument**:
  - Translated as: If Reflection fails, there exists a predictable strategy $\{H_t\}$ (w.r.t. $\{\mathcal{F}_t\}$) for buying/selling bets on $A$ at prices $P_t(A)$, leading to a sure loss (strictly negative payoff) regardless of $\omega$.
  - Formalization: Failure of Reflection implies $\exists \delta, r, B_r$ such that $\mathbb{E}[\mathbf{1}_A - r \mid \mathcal{F}_t] \neq 0$ on $B_r$. A forecaster accepting bets at $P_t(A)$ on $A$ and at $r$ on $A$ conditional on $B_r$ can be exploited via a gambling system.

  **Standard Counterexamples**:
  1. **Anticipated Forgetting**: $\mathcal{F}_{t+\delta} \not\supseteq \mathcal{F}_t$ (information loss). E.g., $\mathcal{F}_{t+\delta} = \sigma(Y)$ where $Y$ is coarse-grained version of $\mathcal{F}_t$-measurable data. Then $P_{t+\delta}(A)$ may be $\mathcal{F}_t$-measurable but $P_t(A)$ depends on finer information. Violates Reflection: $\mathbb{E}[P_{t+\delta}(A) \mid \mathcal{F}_t] \neq P_t(A)$.
  2. **Chemically Induced Credence**: Future credence $P_{t+\delta}(A)$ is $\mathcal{F}_{t+\delta}$-measurable but adapted to a filtration $\mathcal{G}_{t+\delta}$ independent of $\mathcal{F}_\infty$ (e.g., drug alters beliefs randomly). Then $P_{t+\delta}(A) \not\perp \mathbf{1}_A \mid \mathcal{F}_t$, breaking $\mathbb{E}[\mathbf{1}_A \mid \mathcal{F}_t, P_{t+\delta}(A)=r] = r$.
  3. **Expected Irrationality**: Known future deviation from Bayes (e.g., cognitive bias). Modeled as $P_{t+\delta}(A) = f(\mathbb{E}[\mathbf{1}_A \mid \mathcal{F}_{t+\delta}], \eta)$ where $\eta$ is $\mathcal{F}_t$-measurable noise. Then $\mathbb{E}[P_{t+\delta}(A) \mid \mathcal{F}_t] \neq \mathbb{E}[\mathbf{1}_A \mid \mathcal{F}_t]$.

  ---

  ### Translation Verdict: What Survives, Distorts, or Vanishes
  1. **Cleans Translation**:
     - **Martingale Property**: The requirement that $\{P_t(A)\}$ is a martingale w.r.t. $\{\mathcal{F}_t\}$ (i.e., $\mathbb{E}[P_{t+\delta}(A) \mid \mathcal{F}_t] = P_t(A)$) translates *exactly* under **ideal learning** ($\mathcal{F}_{t+\delta}$ refines $\mathcal{F}_t$ with true information). This is your (i).
     - **Dutch Book as Coherence**: The diachronic Dutch book becomes a violation of the martingale property, implying existence of a sure-loss contract under sequential betting. Forecasting vocabulary captures this via arbitrage in scoring rule markets.

  2. **Translation Under Distortion**:
     - **Calibration**: Reflection demands that $P_{t+\delta}(A)$ is *calibrated* w.r.t. $\mathcal{F}_t$ (i.e., $\mathbb{E}[\mathbf{1}_A \mid P_{t+\delta}(A)] = P_{t+\delta}(A)$). But forecasting calibration is *empirical* (agreement with long-run frequencies), while Reflection asserts *current expectation* of calibration. This conflation distorts (ii) by ignoring whether $\mathcal{F}_{t+\delta}$ refines $\mathcal{F}_t$.
     - **Filtration Mismatch**: Counterexamples exploit cases where $\mathcal{F}_{t+\delta}$ is not a refinement of $\mathcal{F}_t$ (forgetting) or is corrupted (drugs). Forecasting tools flag these as broken martingales, but the *normative force* of Reflection—demanding deference even when $\mathcal{F}_{t+\delta}$ is known flawed—has no forecasting analog.

  3. **No Counterpart (The Residue)**:
     - **Binding Future Self / Doxastic Commitment**: The idea that one *ought* to defer to future credences *as an authority* has no equivalent in forecasting. Forecasters assess *methods* (e.g., via proper scoring rules), not agents. Deference to a *specific forecaster* (future self) is exogenous to the framework.
     - **Source of Counterexamples' Force**: They violate your (i) (martingale under ideal learning) but are presented as defeating (ii). Forecasting vocabulary shows the failure is always due to broken martingales—never due to coherent agents rejecting flawed forecasts. This supports your hypothesis: (ii) is an *overextension* of (i).

  ---

  ### Verdict on the Decomposition and Residue
  Your decomposition is **correct and necessary**:
  - **(i) Martingale under Ideal Learning** is the genuine coherence condition. It survives translation as the requirement that credences are conditional expectations w.r.t. a refining filtration.
  - **(ii) Deferential Calibration** is distinct and irrational when the idealization fails. It has no forecasting counterpart because forecasters don’t normatively "defer"—they *evaluate* using scoring rules. Counterexamples work by violating (i) (e.g., $\mathcal{F}_{t+\delta}$ non-refining), making (ii) untenable.

  **Why the Residue Matters**: The untranslated "deference" element reveals that Reflection is not merely about coherence but imposes a *second-order idealization*: that the future self is a perfect Bayesian agent. Forecasting vocabulary, focused on *consistency of beliefs given information*, has no slot for this. When (i) holds (true filtration refinement), (ii) reduces to the martingale property. When (i) fails, (ii) demands deference to a known-miscalibrated forecaster—which forecasting tools correctly identify as incoherent (via Dutch books). Thus, the residue isn’t a defect but proof that Reflection conflates minimal coherence with maximal epistemic authority. Drop (ii); keep (i) as the rational core.
