prompt: |-
  In personal-injury litigation, damages for “pain and suffering” are awarded in proportion to demonstrated emotional distress, life disruption, and aversive behavior, yet courts routinely discount or deny such damages when a plaintiff reports intense nociceptive sensations but shows no affective reaction, no withdrawal behavior, and describes the feeling as neutral or even curious — a presentation resembling pain asymbolia. At the same time, objective tissue damage is compensated regardless of subjective experience. What theory of why pain is bad does this institutional pattern presuppose? Must it hold that pain’s badness resides in its affective or motivational character rather than in sensory quality alone? Could a view on which intense nociception is intrinsically harmful justify the disparity, or does the practice implicitly treat sensory intensity without suffering as ethically and legally weightless? Reconstruct the implicit theory, distinguish what the practice strictly requires from what it merely accommodates, and say whether the legal system’s willingness to compensate purely structural injury without any felt component is consistent with that theory. If the badness of pain were instead located entirely in sensory intensity, what would have to change in how courts calculate these damages?

  End your response with a line beginning “Verdict:” followed by the single view of pain’s badness that best explains the asymmetry described.
reasoning: |-
  Hmm, the user presents a sophisticated legal-philosophical puzzle about pain and suffering damages in personal injury cases. They're clearly well-versed in neurophilosophy - note the precise terminology like "nociceptive sensations" and "pain asymbolia." This isn't a layperson's question but someone probing the metaphysical foundations of tort law.

  The core paradox they highlight is fascinating: courts compensate tissue damage objectively yet demand affective proof for pain damages. That creates a theoretical tension - is the legal system inconsistent, or does it reveal a coherent implicit theory? I need to reconstruct that underlying framework carefully.

  First, let's map the institutional behavior: 
  - Damages require affective/behavioral proof (distress, life disruption)
  - Pure nociception without affect gets discounted (asymbolia cases)
  - Structural injury gets compensated regardless of subjective state

  This pattern clearly privileges the affective dimension. But why compensate structural damage at all then? Ah - because it represents potential for suffering, or impairment of function. The compensation isn't for hurt feelings but for compromised bodily integrity that typically causes suffering.

  The user's second-layer question is sharper: could a sensory-intensity theory justify this? Only if courts believed intense nociception inevitably causes affect - but they explicitly reject that in asymbolia cases. Their practice shows they view "pain without suffering" as legally weightless.

  Now consistency check: compensating structural damage fits if we see it as preserving a baseline of bodily integrity - what ethicists call "inviolability." The system cares about broken arms because they usually hurt and disable, but the compensation anchors to the objective impairment.

  Finally, the counterfactual: if courts adopted a pure sensory theory, they'd have to compensate reported nociception regardless of affect. Imagine paying damages for "curious burning sensations." That would revolutionize tort law!

  Verdict crystallization must capture that the asymmetry only makes sense if affect is necessary and sufficient for damages, while sensory input alone is insufficient. The motivational aspect - withdrawal behaviors - further confirms this is about how pain disrupts agency.
answer: |-
  The institutional pattern reveals an implicit **affective-motivational theory of pain's badness**. This view holds that pain is intrinsically harmful not due to its sensory intensity or nociceptive input alone, but because of its *aversive affective character* (emotional distress) and *motivational consequences* (withdrawal behavior, life disruption). The practice strictly requires affective/behavioral proof for "pain and suffering" damages, while merely accommodating sensory reports as insufficient evidence. Structural injury compensation reflects concern for **functional integrity and biological impairment**, not the mere presence of nociception.

  **Deconstructing the practice:**
  - **Affect as necessary for suffering damages**: Courts deny compensation when plaintiffs report intense nociception without distress, treating sensory quality alone as ethically/legally weightless. Pain asymbolia cases demonstrate this: neutral/curious reactions negate "suffering" despite nociception.
  - **Structural injury as independently compensable**: Tissue damage is compensated as an objective impairment of bodily function, regardless of subjective experience. This presumes harm arises from compromised physical integrity, not nociception per se.
  - **Consistency with the theory**: Compensating structural injury aligns with the affective-motivational view because:  
    (a) Tissue damage typically *causes* suffering, so compensation addresses typical consequences;  
    (b) Bodily integrity is valued independently (e.g., loss of function);  
    (c) The law proxies harm through objective evidence when subjectivity is unreliable.  
    The asymmetry persists because structural harm is seen as a *distinct injury* from suffering.

  **Contrast with sensory-intensity theory**:  
  If pain's badness resided entirely in sensory intensity, courts would have to:  
  1. Award "pain and suffering" damages for intense nociceptive reports *regardless of affect* (e.g., compensate asymbolia plaintiffs).  
  2. Reduce emphasis on behavioral evidence (withdrawal, life disruption) as secondary to sensory qualia.  
  3. Treat tissue damage as merely evidentiary (proving nociception) rather than independently compensable.  
  The current refusal to recognize neutral/curious nociception as damaging would be incoherent under this view.

  **Verdict:** The legal asymmetry presupposes that pain's badness resides in its affective and motivational dimensions, not in sensory intensity alone.
