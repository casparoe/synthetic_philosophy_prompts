prompt: |-
  Can you build a thought experiment for me? I'm thinking about Scheffler's afterlife conjecture — the idea that human extinction is bad for us now not just because future people die, but because it collapses the meaning our current projects get from expecting future generations to continue them.

  Here's the spec: design a realistic policy choice (not sci-fi or trolley-style) facing a planner today, with three outcomes that are identical in death toll, experienced suffering, and welfare summed across all living people. Outcome A: humanity dies out peacefully after the current generation dies naturally, but every personal project is completed. Outcome B: humanity continues biologically with full cultural continuity. Outcome C: biological humanity dies out, but every value, artwork, and scientific result is preserved perfectly in non-conscious digital storage — no living beings carry it forward, just pure archival persistence.

  Then walk through: what Scheffler's view says about A vs B vs C, especially whether he needs living carriers or just value-persistence; what a pure consequentialist who only counts lives and suffering says; and which structural feature of the case is actually doing the work. Also tell me what breaks if we drop outcome C and just compare A and B, and how a critic of Scheffler would attack the whole setup.

  Please answer in British English. Don't include a bibliography or reading list — I just want the scenario and the reasoning. Sorry if there's a typo or two, I'm writing this on my phone.
