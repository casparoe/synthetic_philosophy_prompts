answer: |-
  Here are nine sharp interview questions in British English, crafted for your historian interview with anticipated defences and pushbacks:

  1.  **On Archive Bias:** You rightly point out that every archive is already curated – someone chose what to keep and what to bin. Doesn't that inherent selection bias, right from the start, poison the well for *any* method, including yours, aiming to show "how things actually were"?  
      *   *(Likely Defence: Cross-referencing multiple archives reveals patterns and mitigates single-source bias.)*  
      *   **Pushback:** But if multiple archives share the *same* institutional blind spots or cultural biases about what's deemed 'worth keeping', couldn't cross-referencing just amplify the *silence* rather than solve it? How do you spot a collective blind spot?

  2.  **On Shadow-Source Triangulation & Narrative Bias:** Your "shadow-source triangulation" focuses on *gaps* across three archives to distinguish accident from cover-up. Isn't deciding *which gaps* are significant enough to measure, and interpreting *why* they exist, inevitably injecting your own narrative bias back into the supposedly objective process?  
      *   *(Likely Defence: The method provides an empirical framework for analysing absences, moving beyond speculation to structured comparison.)*  
      *   **Pushback:** But doesn't the choice of *which* three archives to compare, and *which* specific silences to triangulate, involve subjective decisions about what's historically important? Isn't that where *your* framing, the thing you admit happens with source choice, creeps back in decisively?

  3.  **On Hayden White & Emplotment (Part 1 - Form):** Hayden White argued that the narrative *form* itself – tragedy, comedy, romance – fundamentally shapes the 'facts' and kills pure objectivity. You seem to disagree. Are you saying White is simply *wrong* that the way historians structure their story inherently imposes meaning that isn't objectively present in the raw events?  
      *   *(Likely Defence: Shadow-triangulation reveals objective patterns of absence/presence; the historian's job is to present these findings clearly, minimising imposed narrative structure.)*  
      *   **Pushback:** Even presenting your findings involves selection and sequencing – saying "Archive A, B, and C all lack report X, suggesting suppression" *is* a mini-narrative. Isn't avoiding emplotment entirely practically impossible, and perhaps even undesirable for communication?

  4.  **On Hayden White & Emplotment (Part 2 - Facts):** Or is your disagreement with White more fundamental? Are you challenging his underlying point that there *are* no 'brute facts' prior to interpretation? Do you believe the 'gaps' your method identifies are genuinely objective, pre-narrative phenomena sitting out there waiting to be found?  
      *   *(Likely Defence: The absence of a document where logic suggests it should exist across multiple independent archives *is* an objective data point, a tangible trace of something being amiss.)*  
      *   **Pushback:** But doesn't 'logic suggests it should exist' rely entirely on *your* interpretation of context, power structures, and bureaucratic norms? Doesn't that make the 'gap' meaningful only within an interpretive framework *you* bring?

  5.  **On Degrees of Objectivity:** You position your work against Carr and White's cynicism, but you also concede that choosing sources frames things. Are you arguing for a *stronger degree* of objectivity than they allow, rather than pure Rankean "wie es eigentlich gewesen"? Is it about getting *closer* to "how it actually was" with better tools, acknowledging we can't reach perfection?  
      *   *(Likely Defence: Yes, it's about significantly improved rigour and reducing subjectivity, not claiming god-like omniscience. Triangulation offers a more robust check than single-source reliance.)*  
      *   **Pushback:** Doesn't framing it as "reducing subjectivity" or "getting closer" still rely on an ideal of pure objectivity that critics like White argue is a philosophical mirage? Are you just replacing one unattainable ideal with a slightly closer one?

  6.  **Practical Limits of Triangulation:** How do you practically ensure the three archives you choose for triangulation are truly independent? Aren't archives often interconnected – influenced by the same governments, social pressures, or even just shared bureaucratic practices – potentially creating *correlated* gaps rather than revealing a true cover-up?  
      *   *(Likely Defence: Careful historiography involves selecting archives with different provenances, custodians, and original purposes precisely to mitigate this risk.)*  
      *   **Pushback:** But in many historical periods, especially concerning state power or dominant ideologies, isn't there a risk of pervasive, systemic bias across *all* major record-keeping bodies? How does triangulation escape that?

  7.  **Modern Silences & Digital Traces:** Carr and White wrote in an age of paper records. Today, we have digital trails, mass surveillance, but also ephemeral communication and deliberate encryption. Does your method of analysing archival *absences* translate effectively to the modern digital landscape, or does it risk missing entirely new forms of silence and obfuscation?  
      *   *(Likely Defence: The core principle – looking for unexpected absences across multiple data streams – remains valid, though the technical execution adapts to digital corpora, metadata, and deletion patterns.)*  
      *   **Pushback:** Isn't the sheer volume, fragmentation, and algorithmic curation of digital information fundamentally different? Couldn't significant 'gaps' now be perfectly hidden within overwhelming noise, or created instantly and completely, making triangulation far harder or even impossible?

  8.  **A Concrete Example:** Could you walk us through one specific, compelling example from your book where shadow-source triangulation revealed something significant that a traditional focus *only* on existing documents in one archive would have missed? What did it change about understanding "how it actually was" in that instance?  
      *   *(Likely Defence: [She will provide an example demonstrating the method's value].)*  
      *   **Implicit Pushback:** This tests the concrete application and claimed superiority of the method over existing approaches.

  9.  **The Biggest Vulnerability:** You're clearly passionate about pushing back against excessive scepticism. If you had to name the *single biggest vulnerability* or limitation of shadow-source triangulation in achieving its goal of getting us closer to "how it actually was," what would you concede? Where does the method still fall short against the critiques of Carr or White?  
      *   *(Likely Defence: [She might mention the interpretive step regarding *why* a gap exists, resource limitations in accessing enough archives, or the challenge of truly independent archives].)*  
      *   **Purpose:** Forces self-reflection and shows intellectual honesty.

  Good luck with the interview! Sounds like a fascinating discussion.
