  Fourth point: Scientific protocols. Neurath wanted "unified science" using clear, visual protocol sentences. AI icons could fit neatly here, making data more accessible. But he’d demand rigorous standards to prevent distortion—no artistic fluff, just precise, teachable visuals. 

  Fifth point: Human designer’s role. This is tricky. Neurath saw designers as educators shaping social understanding. Removing humans might strip icons of pedagogical intent, turning them into hollow outputs. He’d mourn the loss of deliberate "human agency" in visual persuasion. 

