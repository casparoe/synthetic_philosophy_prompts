answer: |-
  ## Research Proposal: Diagnostic Framework for Moral Invariance Using Robustness Analogies  

  **Project Title:** Distinguishing Moral Objectivity from Spurious Invariance: A Conceptual Robustness Framework  

  ### Core Research Question  
  Can cross-cultural agreement on specific moral judgments (e.g., prohibitions on unprovoked harm) be reliably classified as either:  
  > *(A) Candidate objective content* (robust under maximal counterfactual variation in evolutionary/ecological conditions), or  
  > *(B) Spurious invariance* (dependent on shared but contingent background factors, detectable via conceptual analogs of distribution-shift failure)?  

  This question demands a *diagnostic criterion*—not a metaphysical claim—applicable to documented moral domains (harm, fairness, authority/purity).  

  ### Why Existing Frameworks Are Insufficient  
  - **Universalists** treat cross-cultural agreement as direct evidence for objectivity, ignoring whether agreement reflects contingent WEIRD-like sampling artifacts in human evolutionary history.  
  - **Relativists** treat disagreement as evidence against objectivity, ignoring whether disagreement stems from ecological noise masking deeper invariants.  
  **Both fail** to interrogate the *dataset itself*: Is moral agreement/disagreement analogous to a model performing well on a biased training set but failing under distribution shift?  

  ### Proposed Method: Conceptual Robustness Testing  
  Leverage machine learning’s (ML) formal approaches to evaluating model robustness, translating them into *conceptual tools* for moral psychology:  

  1. **Analog 1: Distribution-Shift Testing → Counterfactual Ecological Variation**  
     - *ML Concept:* Test if features generalize under unseen data distributions.  
     - *Moral Analog:* Does a moral judgment (e.g., "harm requires justification") hold under *maximally varied* counterfactual conditions (e.g., species with different kin-selection dynamics, resource scarcity, or lifespan)?  
     - *Diagnostic:* If agreement collapses under plausible counterfactuals, it suggests *spurious invariance* (B).  

  2. **Analog 2: Adversarial Perturbation → Boundary-Case Moral Scenarios**  
     - *ML Concept:* Craft inputs exposing model fragility.  
     - *Moral Analog:* Design hypotheticals probing the *boundaries* of agreed-upon judgments (e.g., "Is harming one to save five permitted if victims are non-kin?" across cultures with divergent kinship structures).  
     - *Diagnostic:* If agreement persists despite adversarial variation, it strengthens (A); fragmentation suggests cultural overfitting.  

  **Domain-Specific Application:** Apply both analogs to three empirically documented divergence domains:  
  - **Harm** (e.g., varying intentionality/causality interpretations)  
  - **Fairness** (e.g., equality vs. proportionality in resource allocation)  
  - **Authority/Purity** (e.g., contextual flexibility of hierarchy/sanctity norms)  

  ### 3-Month Work Plan  
  - **Month 1:** Framework formalization.  
    - Define ML-to-ethics translation rules (e.g., "training distribution" ≜ "shared evolutionary background").  
    - Specify counterfactual/adversarial parameters for each moral domain.  
  - **Month 2:** Domain-specific diagnostics.  
    - Apply robustness tests to harm (Weeks 1–2), fairness (Weeks 3–4), authority (Weeks 5–6).  
    - Map outputs to (A)/(B) classifications with confidence thresholds.  
  - **Month 3:** Synthesis and validation.  
    - Develop a unified diagnostic rubric.  
    - Stress-test the framework against edge cases (e.g., moral dumbfounding).  
    - Refine criteria to avoid universalist/relativist collapse.  

  ### Defining Success and Failure  
  - **Success:** A tractable, non-question-begging criterion separating (A) and (B). Example:  
    > *"Judgment J qualifies as (A) if its agreement persists under N counterfactual ecological shifts and M adversarial cultural perturbations applied to its core features."*  
  - **Failure Modes:**  
    - **Collapse:** The diagnostic defaults to universalism (if all agreement is deemed robust) or relativism (if all agreement is deemed contingent).  
    - **Decoration:** The ML analogies are illustrative but yield no actionable criterion.  
    - **Indeterminacy:** The framework cannot classify key examples without importing contested metaethical assumptions.  

  ### Risk Assessment  
  1. **Metaphor Overstretch:**  
     - *Mitigation:* Strictly limit ML terms to conceptual heuristics. Avoid reifying "moral features" as computational objects.  
  2. **Stealth Metaethics:**  
     - *Mitigation:* Anchor tests in empirically observed variations. Ban appeals to controversial mechanisms (e.g., modular evolutionary psychology).  
  3. **Underdetermination:**  
     - *Mitigation:* Focus on *comparative robustness* (e.g., "harm judgments are *more* ecologically robust than purity judgments") rather than binary objectivity claims.  
  4. **Conceptual Vagueness:**  
     - *Mitigation:** Operationalize "counterfactual variation" using published anthropological models (e.g., varying social mobility, pathogen prevalence) without requiring novel empirical data.  

  ### Value Proposition  
  This project delivers a *practical diagnostic tool* for ethicists and psychologists—inspired by ML’s rigor in detecting bias—to reevaluate cross-cultural data. It does not resolve metaethical debates but creates a shared language to isolate empirically tractable aspects of moral objectivity.  

  ---  
  **Proposal length:** 1 page  
  **Accessibility:** Jargon-free framing for STEM reviewers; rigor via structured analogies and falsifiable outcomes.  
  **Non-reduction:** Rejects "apply ML to ethics" by centering conceptual translation and avoiding technical implementation.
