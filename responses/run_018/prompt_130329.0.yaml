prompt: |-
  Your an expert in international legal philosphy and genocide studies — please think carefully, maybe do some quick brainstorming first, then walk me through your reasoning step by step. I'm trying to map out the hidden rules behind my colleague's review board on atrocity naming. There record so far: they called the 1994 Rwandan killings genocide; they refused to apply the label to the Canadian residential school system, arguing that destroying a group's culture without direct physical extermination intent misses Lemkin's core; they named the Holodomor genocide since the famine was ethnically targeted and engineered by the state; they said Cambodia's auto-genocide wasn't technically genocide under the convention because the victims shared the perpetrators' ethnicity, though they called it a mass atrocity; and they named the Yazidi campaign genocide because the intent to destroy was explicit in ideology and practice.

  Now here's a fresh case they haven't seen: a government uses predictive demographic algorithms to gradually cut off healthcare, water rights, and land access to one ethnic enclave. There's no direct killing order, but internal planning docs say the aim is to make the population "demographically vanish within two generations." Mortality and out-migration jump sharply. The board has to vote.

  What should they decide if they actually want to be consistent with there past rulings? I'm not just asking yes or no — I want to know the rule they seem to be running (explicit intent? protected-group status? physical violence as necessary? foreseeable destruction regardless of method?). Which of there earlier cases is the closest analog? And be honest: if there precedents genuinely don't settle it, what principle would they be adopting either way? Finally, what's the one further case that would best split these competing rules — like explicit intent with purely economic means, or direct violence against a group outside Lemkin's protected categories?
reasoning: |-
  Okay, let me tackle this step by step. The user is asking about a review board's consistency in labeling atrocities as genocide based on past decisions. First, I need to understand the board's established patterns from the cases they've ruled on. 

  Looking at Rwanda 1994: They called it genocide. That clearly meets the Convention's criteria—intent to destroy an ethnic group with mass killings. So direct physical extermination with explicit intent is a key factor here.

  Then Canadian residential schools: They refused the genocide label. Their reasoning was cultural destruction without intent for physical extermination. Interesting—they're sticking strictly to Lemkin's emphasis on biological destruction, even though he originally included cultural elements. The Convention seems to be their benchmark, not broader definitions.

  Holodomor: They named it genocide. The famine was ethnically targeted and state-engineered. Even without direct killing orders, the intent to destroy through engineered conditions was clear. So here, indirect methods count if there's proven ethnic targeting and intent.

  Cambodia auto-genocide: Not genocide under Convention because victims shared perpetrators' ethnicity. This shows they're rigid about the protected group definition—victims must be distinct from perpetrators. Broader atrocities get called "mass atrocity" but not genocide.

  Yazidi campaign: Genocide because of explicit ideological intent and practices. Even if physical destruction wasn't complete, the intent was documented. So explicit intent matters deeply, regardless of completion.

  Now the new case: A government uses demographic algorithms to cut off healthcare, water, and land access to an ethnic enclave. Internal docs say the aim is "demographic vanish within two generations." Mortality and migration surge. 

  To be consistent, the board would need to check:  
  - **Protected group?** Yes, ethnic enclave qualifies.  
  - **Intent?** Explicit in planning docs ("demographically vanish").  
  - **Method?** Not direct killing, but creating conditions leading to destruction.  
  - **Foreseeability?** Mortality/migration spikes show foreseeable outcome.  

  Closest analog is Holodomor—both use structural violence (engineered famine vs. systemic resource denial) with ethnic targeting. Yazidi also relevant for explicit intent documentation.  

  But potential sticking points:  
  1. Is "demographic vanish" explicit enough about biological destruction? (vs. cultural dilution)  
  2. Are economic/structural means equivalent to "inflicting conditions of life" under Art II(c)? Holodomor says yes.  

  If they vote *yes*, they're reinforcing that:  
  - Structural methods count if outcome is destruction  
  - "Intent" can be inferred from mechanisms + documentation  

  If *no*, they might require:  
  - More overt violence (unlike Holodomor ruling)  
  - Clearer biological-termination language (though "vanish" seems unambiguous)  

  **Split-test case suggestion:**  
  A campaign of forced sterilization against a religious group without killings. Why it splits:  
  - Explicit intent to destroy via birth prevention (biological)  
  - No direct violence, purely bureaucratic means  
  - Tests if "conditions of life" includes reproductive capacity—which Convention drafts originally included but later removed. Board would have to clarify if they require direct bodily harm or accept demographic erasure as genocide.  

  This exposes their stance on whether genocide must involve *active killing* or can be *slow, administrative destruction*.
answer: |-
  Based on your board's established jurisprudence, I'll map their implicit rules through a step-by-step analysis, apply them to the new case, identify tensions, and propose a splitting-hairs scenario. Here's the breakdown:

  ### Step 1: Reverse-Engineering the Board's Rules from Precedents
  - **Rwanda 1994 (Genocide):**  
    *Rule Applied:* **Direct physical extermination + explicit ethnic targeting** satisfies Art II(a) of UNGC (killing).  
    *Key Principle:* Overt violence + protected group status (ethnic) + specific intent.

  - **Canadian Residential Schools (Not Genocide):**  
    *Rule Applied:* **Cultural destruction alone is insufficient** without intent for *physical-biological destruction*.  
    *Key Principle:* Lemkin's "biological destruction" requirement > cultural erasure. Echoes strict UNGC interpretation (Art II excludes standalone cultural genocide).

  - **Holodomor (Genocide):**  
    *Rule Applied:* **Engineered conditions causing physical destruction** (famine) + **ethnic targeting** + **state intent** = genocide under Art II(c) ("deliberately inflicting conditions of life calculated to destroy").  
    *Key Principle:* Physical destruction need not be direct killing; structural violence suffices *if ethnically targeted and intended*.

  - **Cambodia (Not Genocide):**  
    *Rule Applied:* **Victim-perpetrator ethnic identity must differ** under UNGC Art II ("national, ethnical, racial or religious group" *as such*).  
    *Key Principle:* Protected group distinction is jurisdictional; "auto-genocide" excluded by definition.

  - **Yazidi (Genocide):**  
    *Rule Applied:* **Explicit ideological/practical intent to destroy** (slavery, killings) + protected group status = genocide *even if incomplete*.  
    *Key Principle:* Intent can be proven by policy/statements; destruction need not succeed.

  ### Step 2: Synthesizing the Board's Core Doctrine
  - **Non-Negotiables:**  
    1. **Protected Group Status Required:** Victims must be a UNGC-defined group *distinct* from perpetrators.  
    2. **Physical-Biological Destruction Intent:** Cultural erasure alone fails; must aim for demographic elimination.  
    3. **Intent Over Method:** Physical killing (Art IIa) not required; indirect means (Art IIc) suffice if intentionally destructive.  
    4. **Explicit or Inferred Intent:** Intent must be demonstrable (e.g., documents, policies), not merely inferred from outcomes.  

  - **Gray Zones:**  
    - "Conditions of life" (Art IIc) expansively interpreted (e.g., Holodomor's famine).  
    - No requirement for *speed* of destruction (slow attrition accepted if intended).  

  ### Step 3: Applying Rules to the New Case  
  - **Protected Group:** Ethnic enclave → satisfies UNGC criteria (ethnic group). ✅  
  - **Intent:** Internal documents state aim to make population "demographically vanish" → **explicit intent** for biological destruction. ✅  
  - **Method:** Cutting off healthcare/water/land → akin to Holodomor's engineered famine. Falls under Art IIc ("inflicting conditions of life"). ✅  
  - **Outcome:** Mortality/migration surges → demonstrates *foreseeable destruction*, but board prioritizes **intent over results** (per Yazidi). ✅  
  - **Cultural vs. Physical Destruction:** "Demographic vanish" implies biological elimination, not just cultural assimilation → distinguishes from Canadian schools. ✅  

  **Verdict for Consistency:** The board **should classify it as genocide**.  
  - *Closest Analog:* **Holodomor** (state-engineered structural violence targeting an ethnic group with intent to destroy).  
  - *Key Alignment:* Explicit intent + indirect physical destruction + protected group status.  

  ### Step 4: Where Precedents Don't Fully Settle It  
  - **The Tension:** "Demographic vanish" could be interpreted as *indirect* destruction (out-migration) vs. *direct* physical elimination (mortality). The board must decide if **forced disintegration via displacement** (even without killings) qualifies as genocide.  
  - **Principle Adopted if They Vote YES:** *"Intentional creation of conditions causing demographic collapse, regardless of kinetic means, constitutes genocide under Art II(c)."*  
  - **Principle Adopted if They Vote NO:** *"Genocide requires intent for *immediate bodily harm*; attrition via socio-economic means is persecution, not genocide."* (But this contradicts Holodomor).  

  ### Step 5: The Best "Splitting-Hairs" Test Case  
  **Scenario:** *A state forcibly sterilizes 100% of an adult ethnic minority (protected group) to eradicate them within one generation. No killings or violence; purely "clinical" bureaucratic measures.*  

  - **Why It Splits the Board's Logic:**  
    - **YES Argument:**  
      - Explicit intent to destroy the group *biologically* (matches Lemkin's core).  
      - Targets physical existence (reproductive capacity) → satisfies UNGC Art II(d) ("imposing measures to prevent births").  
      - No violence required (per Yazidi: intent > method).  
    - **NO Argument:**  
      - No direct harm/killing (unlike Rwanda/Yazidi).  
      - "Prevent births" (Art IId) is untested by board; may be seen as *non-imminent* destruction.  
      - Could be framed as "cultural genocide" (like Canadian schools) if sterilization is justified as "population control."  

  This forces the board to confront:  
  - Whether **preventing future existence** (vs. ending current life) is genocide.  
  - If **non-violent biological destruction** fits their "physical-biological" requirement.  
  - How literally they interpret *"as such"* destruction (does erasure in 50 years count?).  

  ### Conclusion  
  Your board runs a **modified Lemkin-UNGC hybrid doctrine**: intent for *physical-biological destruction* of a protected group is paramount, but methods can be structural (Holodomor) or bureaucratic (Yazidi). The new case is genocide *if* they hold that engineered systems causing demographic collapse via mortality/displacement are Art IIc violations. The sterilization test case would force them to define the outer limits of "destruction" under the UNGC—potentially revealing a hidden bias toward *violence* over *administrative erasure*.
