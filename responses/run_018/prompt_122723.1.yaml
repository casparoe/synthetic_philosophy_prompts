prompt: |-
  Hi — I'm a journalist covering science and ideas, and I file two or three pieces a week off single papers, usually around 800 words, usually with about a day between the embargo lifting and my deadline. Most of what crosses my desk lately is modelling work: some formal or computational model of households, or cells, or a climate subsystem, or people on a network, and then a headline claim on top of it. And i keep hitting the same wall.

  The models obviously rest on assumptions that everyone in the field knows are false — fully optimizing agents, well-mixed populations, costless adjustment, no measurement error, one representative everything — and the standard reply, in the Friedman vein, is that unrealistic assumptions are fine, even a sign of a good theory, as long as the predictions come out right. Fine in principle. But I have to decide, in ten minutes, without reading the appendix and mostly without being able to follow the math, whether the false assumptions in *this* paper are the harmless kind or the kind where the headline result is basically baked into the setup before anyone runs anything.

  I've got a rough distinction I half-use and can't apply reliably, and I want it turned into something I can actually run. Four moving parts, as I see them:

  1. Load-bearing vs. scaffolding. Some assumptions are there to make the thing solvable; others are doing the actual causal work in producing the result. My test so far is: would flipping the assumption to roughly its opposite flip or kill the result? But I can almost never tell that from the paper, so I need something readable off the text.

  2. Direction of error. Every unrealistic assumption errs in some direction, not just "some amount". If the direction it errs in is the same direction as the paper's headline claim — a model that assumes adjustment is frictionless and cheap, finding that a policy is cheap — then part of the result looks built in rather than discovered.

  3. Target-matching. Is the model meant to be about one specific real system (a prediction), about a whole class of systems (a mechanism), or only a demonstration that something *could* happen (a how-possibly claim)? I keep turning possibility results into "here's why X happens" stories and my editor catches maybe half of them.

  4. Laundered assumptions. Some of these things are just field conventions that get repeated from paper to paper until the intro reads as if they were measured. Twenty years of "assume homogeneous mixing" and it stops sounding like an assumption. I can't tell the conventions from the findings, and I'm wary of my procedure just rubber-stamping whatever a subfield always does.

  What I want from you: a short decision procedure I can run on a PDF in ten minutes. Questions in order; what counts as a sufficient answer to each; where the procedure stops with a no; and where it hands the decision back to me or my editor because it's a judgment call rather than something the paper settles.

  Constraints on what I can actually check: the abstract, the intro's framing of what the model is for, the model section's structure and headings, the tables, and anything the paper says about robustness, extensions, relaxing assumptions, calibration or sensitivity. If I have a day I can email the author one question. What I can't do: read the math, verify whether other groups relaxed the assumption, or chase up references — so please don't give me a reading list or point me at papers, I won't be able to follow them.

  The output should end in three things: one of a few concrete hedging levels I can hand my editor; a single sentence of plain English describing the assumption that I paste into the piece somewhere; and the one question actually worth emailing.

  Then run it on three cases, including at least one where I won't like the answer:

  — A macro-ish paper using a dynamic model with fully optimizing forward-looking households and frictionless reallocation, finding that a large new subsidy roughly pays for itself within a decade. Great story, my editor wants it, I want it, and I suspect your procedure tells me the answer I don't want.

  — A compartmental disease model with homogeneous mixing and no behavioural response, projecting a wildlife pathogen under two management options two years out, where the projected numbers differ a lot between the options and the state agency is deciding next month.

  — A minimal model of social learning where agents copy neighbours more when the neighbours are similar to them, finding that even mild similarity bias produces near-total fragmentation. I want to write "here's why we're so polarized." I have a feeling this is a how-possibly result that is one step short of being true by construction, but I can't say why.

  Finally: be straight with me about what the procedure can't do. The cases it can't settle, the ways it'll misfire (I'm defintely worried about it being lenient toward conventions just because they're conventional, and about me confusing "I don't get it" with "the assumption is doing work"), and the point where over-hedging stops being honesty and starts costing me stories that were fine. Where do I just have to make a call about what readers deserve?
reasoning: |-
  Okay, this journalist is dealing with a tough problem. They need to quickly evaluate scientific models in papers where assumptions might invalidate the headline claims. They've identified four key challenges: determining if assumptions are critical, assessing bias direction, understanding the model's purpose, and spotting ingrained conventions.

  The constraints are tight - ten minutes per paper, no math comprehension, limited sections to review. They want a practical decision tree with clear outputs: hedging level, plain English explanation, and one email question. The three test cases are revealing: a macroeconomics paper they suspect is problematic, an epidemiological model for policy decisions, and a social science model they fear is tautological.

  For the decision procedure, I consider structuring it as a flowchart-style checklist. First step should determine the paper's claim type (prediction/mechanism/possibility) since that frames everything else. Then assessing if key assumptions are explicitly stated or hidden in conventions. For load-bearing analysis, robustness checks in tables become crucial evidence. Direction of error might be inferred from phrases like "conservative estimate" or calibration sources.

  The hedging levels need to be concrete: from "high confidence" to "speculative framework". The plain English sentence should expose the most consequential assumption without jargon. The email question must be surgical - asking what would happen if a specific assumption were relaxed.

  For the test cases: The macro model likely fails on direction of error (frictionless assumption baking in the payoff result). The disease model might pass if sensitivity analyses exist. The polarization model probably needs framing as "one possible explanation" rather than "the reason".

  Important limitations to note: The procedure can't detect subtle math dependencies or field-specific blind spots. It might over-hedge on theoretical work that's meant to be exploratory. And there will always be judgment calls about how much simplification is acceptable for public communication.

  The journalist also needs permission to sometimes run with imperfect stories - if the model represents legitimate scientific progress within its tradition, and the limitations are clearly stated, that might be enough for their audience. The key is distinguishing between productive simplifications and result-distorting assumptions.
answer: |-
  Here’s a decision procedure designed for your constraints. Run it in order—**stop and hedge** if any step fails. The output is at the end.

  ---

  ### **10-Minute Decision Procedure**
  *(Skim: Abstract → Intro (claim/purpose) → Model section (assumptions/robustness) → Tables/Figures)*

  1. **WHAT IS THE CLAIM TYPE?**  
     *Check: Abstract + Intro’s final paragraph.*  
     - **Prediction:** Targets a specific real-world outcome (e.g., "Policy X will cost $Y by 2030").  
     - **Mechanism:** Explains a general phenomenon (e.g., "Frictionless markets amplify shocks").  
     - **How-Possibly:** Shows something *could* occur (e.g., "Bias can cause polarization").  
     *🚨 Stop if unclear or mislabeled (e.g., a how-possibly claim framed as prediction).*  
     *✅ Output: Claim type = [P/M/HP]*

  2. **WHAT ASSUMPTIONS ARE LOAD-BEARING?**  
     *Check: Model section headings + "robustness"/"sensitivity" subsections.*  
     - Look for phrases: "*Assuming...*", "*We relax...*", "*Underlying...*".  
     - **Scaffolding:** Explicitly labeled as "simplifying", or varied in robustness checks.  
     - **Load-bearing:** Not tested for robustness, critical to setup (e.g., "Agents maximize utility" in an econ model).  
     *🚨 Stop if load-bearing assumptions are untested AND:*  
       - For **Predictions:** Assumption direction matches headline (e.g., "frictionless markets" → "low cost").  
       - For **Mechanisms/How-Possibly:** Assumption *is* the mechanism (e.g., "similarity bias" → "fragmentation").  
     *✅ Output: Key assumption = [One plain-English phrase]*

  3. **IS THE DIRECTION OF ERROR ACKNOWLEDGED?**  
     *Check: Calibration sources, "limitations", or sensitivity tables.*  
     - Does the paper admit if assumptions *overstate* the effect (e.g., "This likely underestimates costs due to omitted frictions")?  
     - In tables: Do sensitivity tests push results against the headline?  
     *🚨 Stop if:*  
       - Direction of error matches the claim (e.g., omitting costs → "policy is cheap") *and* isn’t caveated.  
       - Sensitivity tests are missing/narrow (e.g., only varying parameters, not structure).  
     *✅ Output: Direction caveat? [Yes/No]*

  4. **ARE ASSUMPTIONS FIELD CONVENTIONS?**  
     *Check: Intro’s lit review + model justification.*  
     - Does the paper defend assumptions as "standard" without evidence?  
     - Does it cite papers that *relaxed* these in similar contexts?  
     *🚨 Never an auto-stop, but downgrades confidence.*  
     *✅ Output: Convention? [Yes/No]*

  ---

  ### **Output Template**
  - **Hedging Level:**  
    - **Strong:** All steps passed (claim type clear, load-bearing tested, error direction caveated).  
    - **Moderate:** Steps 1-2 passed, 3-4 weak (conventional assumptions, weak caveats).  
    - **High Caution:** Step 1 or 2 failed (claim mismatch or untested load-bearing).  
    - **Speculative:** How-possibly claim without real-world grounding.  
  - **Plain-English Sentence:**  
    *"The finding rests on [Key Assumption], which [was/was not] tested for robustness."*  
  - **Email Question:**  
    *"If you relaxed [Key Assumption] toward [opposite, e.g., 'added adjustment costs'], would the headline result hold qualitatively?"*

  ---

  ### **Test Cases**
  **Case 1: Macro Subsidy Paper**  
  - Claim type: **Prediction** ("subsidy pays for itself").  
  - Load-bearing: **Frictionless adjustment** → untested, direction matches claim (omits costs → "cheap").  
  - Direction of error: Not caveated.  
  - Convention? **Yes** (standard in DSGE models).  
  - **Output:**  
    - *Hedging: High Caution*  
    - *Sentence: "The result depends on assuming costless economic adjustment, which wasn’t tested against real-world friction data."*  
    - *Email: "If you added adjustment costs (e.g., retraining delays), would the subsidy still break even?"*  
  - **Verdict:** Kill or heavily reframe. Result is likely baked in.

  **Case 2: Wildlife Disease Model**  
  - Claim type: **Prediction** (case numbers under options).  
  - Load-bearing: **Homogeneous mixing** → but sensitivity table shows results hold under moderate heterogeneity.  
  - Direction of error: Caveated ("may underestimate spread in clustered populations").  
  - Convention? **Yes** (common in SIR models).  
  - **Output:**  
    - *Hedging: Moderate*  
    - *Sentence: "The model assumes uniform animal interactions, but sensitivity tests suggest projections are robust to moderate mixing variations."*  
    - *Email: "Did sensitivity tests cover realistic habitat-driven mixing patterns?"*  
  - **Verdict:** Publish with caveat. Robustness checks partially validate.

  **Case 3: Polarization Model**  
  - Claim type: **How-Possibly** ("bias can cause fragmentation") but framed as mechanism ("why we’re polarized").  
  - Load-bearing: **Similarity bias** → core mechanism, not varied.  
  - Direction of error: Untested (bias is the input; fragmentation is output).  
  - Convention? **No** (novel twist on social learning).  
  - **Output:**  
    - *Hedging: Speculative*  
    - *Sentence: "The model shows polarization can emerge from mild biases, but doesn’t test if this drives real-world divisions."*  
    - *Email: "Could other factors (e.g., ideological preferences) override similarity bias in real networks?"*  
  - **Verdict:** Reframe as "one potential explanation," not "the reason."

  ---

  ### **What This Can’t Do**
  1. **Detect hidden math dependencies:** If the result is baked into equations invisibly, you’ll miss it.  
  2. **Fix field blind spots:** Conventions get a "moderate" pass but may still be fatally flawed.  
  3. **Resolve judgment calls:** E.g., when robustness tests exist but feel token (your "spidey sense" matters).  
  4. **Save over-hedged stories:** If your editor wants boldness, this errs toward caution.  

  ### **When to Override**
  - **Publish with "Moderate" hedging** if:  
    - The paper acknowledges limitations AND the core insight is novel.  
    - Competing models share these assumptions.  
  - **Kill "High Caution"** only if:  
    - The assumption is *known* to reverse real outcomes (e.g., omitting friction in economics).  
    - The claim is policy-critical (like Case 2).  

  **Your North Star:**  
  > *"Does this paper add knowledge, or just repackage assumptions?"*  
  > If the headline would surprise a skeptic *even given the simplifications*, it’s likely worth the story.  

  Use this as a filter—not a verdict. When in doubt, **email the one question**. Authors often reveal more in replies than in papers.
