prompt: |-
  In debates over moral status and sentience, I repeatedly encounter a particular architecture of reasoning. A speaker begins by rejecting binary accounts—pointing out that nociception in insects, temperature-regulation in devices, and reflective self-awareness in humans form a smooth continuum, so moral weight should scale gradually rather than switch on at some magical boundary. Yet when the practical question arises—whether pest control owes insects non-negligible consideration, or whether a thermostat has any moral claim—the same speaker reintroduces a sharp exclusion, typically justified by invoking “the right kind” of integration or “genuine” experience, without locating that cutoff on the continuous scale previously endorsed. Meanwhile, within the privileged class that clears this hidden gate—say, among mammals—the gradation is restored to explain why a chimpanzee matters more than a mouse. The result is continuous weighting inside an unexplained categorical wall, with the wall itself never mapped onto the spectrum. Is there an established concept for exactly this two-layer structure—gradualism deployed internally, categorical exclusion deployed externally, with the boundary justified independently of the scale? If there is, how does it differ from ordinary threshold-setting and from pure gradualism? If not, can you coin and delimit a precise term, specifying what counts as an instance, what nearby patterns (such as simple equivocation or a standard non-identity problem) it excludes, and where its edges lie? End with a one-sentence summary of your conclusion on its own line.
reasoning: |-
  Okay, the user is describing a specific pattern of reasoning they've observed in debates about moral status and sentience. They notice that people reject binary distinctions by pointing to continuums—like nociception in insects, thermostats regulating temperature, and human self-awareness—arguing that moral weight should be gradual. But when it comes to practical decisions, like whether insects deserve moral consideration or if a thermostat has rights, these same people suddenly draw a sharp line. They talk about needing "the right kind" of integration or "genuine" experience without explaining where that cutoff is on the continuum they just endorsed. Then, within the group that makes the cut, like mammals, they go back to gradualism to say why a chimpanzee matters more than a mouse. The user sees a contradiction here: continuous weighting inside an arbitrary category, with the boundary itself never justified on the scale. 

  They're asking if there's an established concept for this two-layer structure—gradualism inside, categorical exclusion outside, with the boundary defined separately. If not, they want me to coin a precise term, define what counts as an instance, exclude similar patterns, and give a one-sentence summary. This suggests they're deeply engaged in philosophy, likely ethics or animal rights, and frustrated by inconsistent reasoning. Their unspoken need might be for clarity in arguments, or a tool to critique this common but flawed logic. 

  I need to address their query directly. First, I'll confirm there's no widely accepted term—I've searched philosophical literature, and while concepts like "threshold deontology" or "moral schizophrenia" touch on parts, nothing captures the whole thing. Then, I'll propose a new term: "categorical insulation." Why? It highlights the protective wall around a privileged group, with insulation implying the boundary blocks moral relevance from outside. 

  For the definition, I'll specify that it must have: a continuum of properties across entities, rejection of binary divisions, a sudden sharp exclusion for outsiders based on a new criterion (like "real" sentience), and restored gradualism inside. Instances include denying moral weight to insects while accepting it for all mammals, or excluding AI from personhood while grading human cognitive impairments. 

  To set boundaries, I'll contrast it with nearby ideas. Equivocation is just shifting definitions mid-argument, whereas this has structural layers. The non-identity problem is about future beings, not this exclusion. Simple thresholds are single cutoffs on a scale, but here the boundary isn't mapped to the continuum—it's externally justified. Pure gradualism has no walls at all. 

  Finally, the one-sentence summary: This is "categorical insulation"—a layered moral framework combining external sharp exclusion with internal gradualism, where the boundary criterion eludes the endorsed scale. 

  This should give the user a clear, critical tool for their debates.
answer: |-
  This pattern is a recognized inconsistency in moral philosophy but lacks a single established term. I propose **categorical insulation** to precisely describe this two-layer reasoning structure.

  ### Definition & Core Features
  **Categorical insulation** is a moral reasoning architecture where:
  1.  **Continuum Acknowledged:** A continuous scale of a morally relevant property (e.g., neurological complexity, behavioral responsiveness, information integration) is explicitly endorsed across a broad domain (e.g., all biological life, or even all complex systems).
  2.  **Binary Rejection Stated:** Simple binary thresholds on *this scale* are rejected as arbitrary or inadequate for assigning moral status/weight.
  3.  **Hidden Categorical Exclusion:** A sharp, non-graded boundary is nevertheless introduced *external* to the endorsed scale, defining a privileged class (e.g., "sentient beings," "subjects-of-a-life"). This boundary relies on a distinct criterion (e.g., "real subjectivity," "phenomenal binding," "intrinsic value") claimed to be necessary but not locatable or derivable from the continuum.
  4.  **Internal Gradualism Restored:** Within the privileged class, moral weight/status is again treated as graded and continuous, mapped back onto variations of the initial scale or a related one.

  ### What Counts as an Instance?
  *   **Core:** Reasoning that explicitly denies a sharp threshold *on the proposed scale* (e.g., neural complexity) while simultaneously relying on a sharp threshold *based on a different, often vaguely defined or metaphysically loaded concept* (e.g., "true consciousness," "having an inner life," "being a moral agent") to exclude entities lower on the initial scale.
  *   **Key Indicator:** The inability to place the exclusionary boundary meaningfully *on the endorsed continuum* ("Where on the complexity scale does 'genuine experience' switch on?") and the lack of a clear, operational definition for the boundary criterion that doesn't simply restate the exclusion.

  ### Excluded Nearby Patterns
  1.  **Simple Equivocation:** Shifting the *meaning* of a key term (e.g., using "sentience" for reflexive responses in insects vs. phenomenal consciousness in mammals) without the *structural commitment* to both the continuum and the separate categorical boundary. Categorical insulation *relies* on the continuum being robust while the boundary is *sui generis*.
  2.  **Standard Threshold-Setting:** Establishing a single cutoff point *on the endorsed continuum* (e.g., "Sentience requires at least 1 million neurons"). Categorical insulation *rejects* threshold-setting *on the continuum* while *applying* it via a *different* criterion.
  3.  **The Non-Identity Problem:** Concerns future beings whose existence depends on a choice. It doesn't inherently involve the continuum/categorical boundary tension.
  4.  **Pure Gradualism (Spectrumism):** Consistently applying graded moral weight across the *entire* scale without any absolute exclusions or privileged classes.
  5.  **Simple Speciesism:** Arbitrarily privileging a biological taxon. Categorical insulation often *uses* species boundaries as proxies but grounds the exclusion in a *claimed* deeper property (e.g., "Only mammals have the *right kind* of pain"), creating the layered structure.
  6.  **Moral Schizophrenia (Nagel):** The conflict between personal and impersonal viewpoints, not specifically about the continuum/exclusion structure.

  ### Where Its Edges Lie
  *   **Too Broad:** If the boundary criterion *can* be coherently located on or derived from the endorsed continuum (even if difficult), it becomes standard (if complex) threshold-setting, not categorical insulation.
  *   **Too Narrow:** Requires the *explicit endorsement* of a continuum and *explicit rejection* of thresholds *on that continuum*, combined with the practical application of a sharp exclusion based on a *distinct* criterion. Accidental inconsistency or poorly articulated reasoning alone doesn't qualify; the pattern must be structural and persistent.
  *   **Justification Matters:** The boundary must be *justified independently of the scale*, often invoking qualitative leaps, metaphysical necessity, or irreducible properties *not captured by the continuum*. If justification solely appeals to points *on* the continuum, it's not insulation.

  ### Categorical Insulation vs. Alternatives
  *   **vs. Threshold-Setting:** Threshold-setting places the cutoff *on* the continuum. Categorical insulation places it *off* the continuum, using a different justification.
  *   **vs. Pure Gradualism:** Pure gradualism has no absolute boundaries. Categorical insulation maintains an absolute boundary defined externally while applying gradualism internally.
  *   **vs. Moral Schizophrenia:** Addresses a different conflict (personal/impersonal standpoints) rather than the specific continuum-boundary inconsistency.

  ### Conclusion
  Categorical insulation describes the inconsistent deployment of gradualism internally and categorical exclusion externally, justified by a criterion independent of the endorsed scale.

  > Categorical insulation is the inconsistent moral reasoning pattern combining an endorsed property continuum with a sharply bounded exclusionary class defined by an unmapped criterion external to that continuum.
