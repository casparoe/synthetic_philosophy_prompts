  On the analog residue question: Elena has the stronger case. Von Neumann explicitly noted neural thresholds aren't binary like logic gates but probabilistic "firing ranges" influenced by analog factors - this directly contradicts Marcus' digitization claim. The thermal fluctuation analogy fits von Neumann's physical intuition. 

  Regarding self-reproducing automata: Marcus misapplies this concept. Those were abstract mathematical constructs, while the brain book specifically addressed biological implementation. The automata theory doesn't invalidate Elena because von Neumann treated biology's messiness as functionally distinct from pure computation. 

  The manuscript's unfinished state actually favors caution: the existing text emphasizes analog aspects more than Marcus admits, but von Neumann's death leaves his final synthesis unknown. Neither side gets decisive support here. 

  The deeper gap they're missing connects to the user's scribbled "stochasitc" note: how continuous physical dynamics (like ion channel noise) could acquire semantic weight through evolutionary constraints. This bridges the physics-philosophy divide the user senses - meaning emerging from constrained randomness, not just clean symbol manipulation. 

