prompt: |-
  I spent most of my working life as an X-ray crystallographer, and since retiring I have been attending a small reading group of retired people in town that works slowly through books on moral philosophy, mostly for the argument. We recently spent two sessions on blame, and a disagreement I keep having with a friend who used to sit as a lay magistrate has convinced me that I have noticed something for which I have no word. The familiar case is easy enough: someone censures another for a fault she possesses herself, and we feel the censure is somehow out of order even when the judgement it expresses is perfectly true. But the case I keep running into is not that one. It is the case where the person doing the censuring has not yet done the thing, and may even sincerely hate it in herself, but fully intends to do it, or is reliably going to do it, later on. My neighbour is a lifelong smoker who has relapsed four times; she believes, with complete conviction, that smoking is a stupid, degrading habit, and she told her grandson so, at some length, in a way that struck everyone present as slightly off — partly because she smoked two cigarettes on the way home. The odd thing is that it does not seem to be her past that makes it off. A colleague of mine who gave up smoking thirty years ago can say exactly the same sentences and sounds exemplary. What seems to poison my neighbour's version is that she is going to do it again, and everyone in the room knows it, and she knows it too. I find the same structure elsewhere: a senior scientist who publicly rebukes a junior for quietly trimming an inconvenient data set while his own manuscript, not yet submitted, contains a procedure he privately intends to defend as different but which he would recognise as the same if it appeared in someone else's paper; a councillor who denounces a tax avoidance scheme in a speech in April while her accountant has already set the identical arrangement up for the following January. In none of these is the person insincere, and in none of them has the past wrong actually been committed yet.

  What I want to know is whether this has a name and, more importantly, whether it is really one thing. I have tried to line it up against the neighbouring cases and it does not sit comfortably with any of them. Ordinary hypocrisy, as I understand it, seems to require that the person already has the fault, or at least that she quietly exempts herself from a rule she applies to others; my neighbour does not exempt herself, she convicts herself, and she is still going to do it. And this is clearly not the debating trick of deflecting criticism by pointing at the other side's comparable behaviour, where nothing about the speaker's own conduct is at issue at all. There is also a case that goes the other way and puzzles me: the person who never did the thing and never will, but only because the occasion never arose, and who would very likely have done it had it arisen. Nobody says of her that her censure is out of order, and yet in the historical cases my reading group likes — ordinary people under a dictatorship, people who profited from arrangements nobody around them questioned — the thought that we would have done the same seems to unsettle blame quite seriously, even though by hypothesis the person being judged did it and we did not. So: is the defect in my cases a temporal version of the ordinary one, so that past, future and counterfactual transgressors should all be treated alike, or do they come apart, and if they come apart, what does that tell us about what is actually wrong with the censure in the first place?

  Please don't send me to the literature — I no longer have university access, and a list of papers or authors would be of no use to me. What I want is the carving, not the label: whether these cases are one phenomenon or several, where the boundaries fall, and what the underlying norm would have to be for the boundaries to fall where they do. In particular I would like to know whether the defect varies with how likely the future transgression is, or with whether the speaker knows it is coming; whether it survives if the speaker is self-deceived about her own future and would be shocked by the suggestion; whether it matters if what she is going to do is worse than, or less bad than, what she is condemning; and whether the same defect attaches to neighbouring speech acts — warning someone off the fault, praising someone for avoiding it, grading it in an official capacity, voting to punish it — or whether it is peculiar to blame. I would also like to know how far it travels from persons to bodies: a university that expels students for plagiarism while quietly planning not to notice it in a newly hired star, or a government that condemns a weapons programme it is itself about to start, seems to me to raise the question in a sharper form, since a university has no intentions of its own in the way my neighbour does. If there really is an established concept here, tell me what range of cases it is used to cover and whether mine fall inside or outside it; if there is not, give me a name and a definition I could use, and say what the definition is meant to exclude.
reasoning: |-
  Okay, this is a fascinating and nuanced ethical puzzle from someone with a crystallographer's precision in parsing moral distinctions. Let me approach it methodically.

  First, the core observation: censure that feels "off" not because of hypocrisy about past actions, but because of anticipated future actions. The neighbor condemns smoking while planning to relapse, the scientist criticizes data trimming while preparing to do similar, the councillor denounces tax avoidance while arranging it. 

  What makes this distinct? It's not classic hypocrisy (current fault concealed) nor tu quoque (deflecting criticism). The censurer fully acknowledges the standard and their own past failures, yet intends future violation. The temporal element is key - the wrongness seems future-anchored.

  Now, unpacking the boundary cases:
  - Past reformed transgressor (ex-smoker): censure feels legitimate
  - Counterfactual transgressor ("I never did it but would have"): censure still accepted
  - But future-intending transgressor: censure feels poisoned

  Why this asymmetry? I suspect it hinges on the relationship between condemnation and commitment. When condemning an act, one implicitly commits to not doing it. Future intention breaches that commitment immediately, creating performative contradiction. The past transgressor has changed commitment; the counterfactual case never faced the test.

  Testing variables:
  - Likelihood of future transgression? Probably matters - definite intention feels worse than vague possibility.
  - Self-deception? If genuinely unaware of future actions, the contradiction might be mitigated but not erased - others still sense the disconnect.
  - Severity comparison? If future act is worse, condemnation sounds hollow; if lesser, might partially undermine.
  - Institutional cases? Even without "intentions," the misalignment between stated values and planned actions creates institutional hypocrisy.

  For naming, "faultline condemnation" captures the structural weakness, while "performative preemption" emphasizes the speech-act contradiction. But the essence is condemnation that's self-subverting by virtue of the agent's trajectory.

  The underlying norm seems to be: censure must be backed by congruent practical commitment. Without that, it becomes ethically weightless - not false, but existentially void.
answer: |-
  What you've discerned is a distinct moral phenomenon—one that sits adjacent to hypocrisy but isn't identical to it. Let me carve it at the joints, addressing your questions systematically. This isn't merely a label-hunt; it's about mapping the conceptual terrain.

  ### Core Phenomenon: **Self-Subverting Censure**
  - **Definition**: The act of condemning a fault while consciously intending to commit that identical fault in the future, where the censurer acknowledges the fault’s wrongness but lacks the commitment to abstain. The defect lies in the *performative contradiction* between condemnation and intention.
  - **Boundaries**:  
    - **Inside**: Cases like your neighbor (intending relapse), the scientist (planning data manipulation), or the councillor (preparing tax avoidance). The censurer:  
      - Sincerely believes the act is wrong.  
      - Has not *yet* committed the act in question.  
      - Intends to commit it later (or is reliably predicted to do so based on pattern/evidence).  
    - **Outside**:  
      - **Past hypocrisy**: Condemning a fault one *currently* possesses (e.g., a current smoker decrying smoking).  
      - **Reformed condemnations**: Your ex-smoker colleague—no future intention, so censure is valid.  
      - **Counterfactual weakness**: Someone who condemns a fault they *would* have committed if circumstances arose (e.g., "I’d have collaborated with the dictatorship"). Here, censure isn’t invalidated because no *actual* intention exists—only hypothetical moral fragility.  

  ### Why It’s One Coherent Phenomenon
  The unifying thread is **commitment failure**. Condemning a fault implicitly pledges: "This act is intolerable, and I align my conduct with this standard." When the censurer *intends* future violation, the condemnation becomes self-undermining—not because it’s insincere, but because it reveals a refusal to bind oneself to the norm being endorsed. Your neighbor’s lecture feels "off" because her imminent relapse exposes her words as disconnected from her will. Unlike hypocrisy (which involves concealment), self-subverting censure involves *transparent* intention to betray the standard.

  ### Testing the Boundaries: Your Questions  
  1. **Likelihood of future transgression**:  
     - The defect intensifies with certainty. If your neighbor *might* relapse, censure feels uneasy; if she *will* (based on pattern/knowledge), it feels illegitimate. Probability matters, but certainty (or high likelihood) is key.  

  2. **Self-deception**:  
     - If the censurer is unaware of their future transgression (e.g., your neighbor believes "this time is different"), the defect *weakens but persists*. Others still perceive the disconnect between condemnation and predictable action. However, if the censurer is genuinely self-deceived, the moral failing shifts to negligence (failing to know oneself) rather than intentional self-betrayal.  

  3. **Comparative severity**:  
     - If the censurer’s future act is *worse* than what they condemn (e.g., a scientist rebuking minor data trimming while planning major fraud), the censure feels grotesque. If *less bad* (e.g., condemning fraud while planning minor trimming), it still undermines—but less severely. The core issue is the contradiction, not degree.  

  4. **Other speech acts**:  
     - **Warnings/praise**: Warning others *against* a fault suffers the same defect if the warner intends to commit it. Praise *for avoiding* a fault is undermined if the praiser will soon commit it.  
     - **Official acts (grading/voting)**: The defect sharpens here. A professor condemning plagiarism while ignoring it in a star hire invalidates their authority. Institutions *can* exhibit this via policies misaligned with actions (e.g., a university’s public stance vs. private leniency). Though institutions lack "intentions," their planned actions create functional self-contradiction.  

  ### Temporal vs. Counterfactual Cases: Why They Diverge  
  - **Future intent** (your cases): Involves *active* intention ("I will smoke later"). This directly voids the censure’s implicit commitment.  
  - **Counterfactual weakness** ("I would have done it"): Involves no *actual* intention—only hypothetical moral failure. Censure isn’t undermined because:  
    - The condemner isn’t planning to violate the norm.  
    - Blame focuses on the *act*, not the *actor’s purity*. We condemn collaboration with dictators based on harm done, not the collaborator’s unique sinfulness.  

  ### The Underlying Norm  
  The defect reveals a deeper norm: **Censure must be backed by practical commitment to the standard invoked**. Without this, it becomes "cheap talk"—rhetoric detached from action. This norm isn’t about moral perfection (past failures are irrelevant) but about *current resolve to uphold the standard*. Your neighbor’s censure fails because her imminent relapse proves her rejection of the norm’s practical authority.  

  ### Proposed Name: **Futile Condemnation**  
  - **Why this term?** It captures the self-defeating nature: the condemnation is futile because the censurer’s future actions will nullify it.  
  - **Definition**: *The act of condemning a fault while possessing a firm intention (or unavoidable trajectory) to commit that same fault, thereby invalidating the censure through performative inconsistency.*  
  - **Exclusions**:  
    - Past hypocrisy (fault already exists).  
    - Counterfactual moral weakness (no current intention).  
    - Blame based on outcomes alone (e.g., condemning an accident where intent was absent).  

  ### Why This Matters  
  Futile condemnation erodes moral credibility. It exposes norms as negotiable rather than binding—a particular danger in institutional contexts (e.g., governments condemning weapons programs they’re developing). The temporal asymmetry you note—future intent corrupts, past failure does not—highlights that ethics cares deeply about *present commitment to repair or uphold norms*. Your crystallographer’s eye has isolated a real fault line: not in the truth of the condemnation, but in the *standing* to issue it while plotting its betrayal.  

  If your reading group revisits this, ask: "Can we condemn what we are actively choosing to become?" The answer, your cases suggest, is no—not because it’s false, but because it’s faithless.
