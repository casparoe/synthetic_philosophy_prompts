prompt: |-
  me and my debate partner have been going in circles about how much citizens should hide from the state. i'm coming from the german data-protection angle — informational self-defense is a civic virtue, the state shouldn't be able to reconstruct your biography from fragments. she's coming from american openness — hiding breeds corruption, democratic legitimacy requires citizens to be readable. we keep using chinese social credit as a boundary case, not because we want it, but to test what happens when the state knows either too much or too little in a structured way.

  we want to actually produce one of those adversarial-collaboration docs instead of just yelling. can you draft it?

  we need:
  - a numbered section of claims we both actually agree on. include basic structural differences between german and american norms (e.g., purpose limitation vs public-record culture), and the fact that chinese social credit combines behavioral scoring with surveillance infrastructure — not just one. keep it neutral, no weasle words.
  - the disagreements in thier own words, in a table or list, phrased so neither side feels straw-manned. main ones: whether opacity has intrinsic value or is only instrumentally good; whether democratic accountability requires citizens to be legible to the goverment; and whether "derived inference" — the state computing hidden facts from allowed data — counts as a privacy breach or smart administration.
  - cruxes: sub-questions that, if settled, might actually move one of us. i think one crux is whether there's an "opacity budget" — a fixed quantum of hidden information every citizen is entitled to keep regardless of harm. another is whether correlation rights exist: if i hide my location but they infer it from electricity patterns, is that my failure to hide or thier overreach?
  - for each crux, one concrete case or piece of evidence we both agree is relevant, plus what each of us predicts about it.

  format suggestion: agreed claims numbered, then a disagreements table, then cruxes with predictions. please don't turn this into a standard privacy-vs-security essay — inject the niche framing (opacity budgets, derived inference rights) so we're not just regurgitating old debates. no bibliography, no citations, we don't need anyone quoted. just the doc.
