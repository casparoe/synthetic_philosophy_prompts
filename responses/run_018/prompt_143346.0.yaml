  I'm taking a course on ancient economic thought, and we're working through Aristotle's Politics I.8–10—specifically the distinction between natural household management (oikonomia) and unnatural wealth-getting (chrematistikē), the claim that every possession has both a proper use-value and an exchange-use, and the argument that usury (tokos) is the most unnatural form of acquisition because coinage is barren (argos) and cannot reproduce like plants or animals. For a creative exercise, I need a joke whose punchline actually depends on one of these specific distinctions—say, on the "barrenness" of money or on treating a shoe primarily as an object of exchange rather than wear—rather than a generic "Aristotle hated capitalism" quip. Could you write one? It should be fully intelligible to someone who has read the relevant books of the Politics, but it shouldn't rely on obscure scholarship or require any bibliographic knowledge.
