  6.  **Adversarial Collaboration Tone:** Maintains a formal, collaborative tone while clearly delineating opposing viewpoints and predictions based on the core philosophical disagreement.
  7.  **Avicenna Focus:** Grounds the entire discussion in the interpretation of the original Flying Man thought experiment.
