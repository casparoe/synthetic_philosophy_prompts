  Below is an 8-question quiz designed to probe your intuitions about the side-effect effect (Knobe effect), followed by a scoring key mapping your answers to four major philosophical explanations. Each vignette describes an agent knowingly bringing about a side effect while pursuing a primary goal. Variations include:  
  - **Harmful** vs. **helpful** side effects  
  - **High cost** vs. **low cost** (effort/resources required beyond the main action)  
  - Agent’s **attitude**: *endorsement*, *regret*, or *indifference*  

  For each question, choose **one** option reflecting whether you believe the side effect was:  
  (A) Intentional/done on purpose,  
  (B) Not intentional (just a side effect), or  
  (C) A reflection of the agent’s values/character.  

  ---

  ### Quiz  
  1. **Harmful, Low Cost, Indifference**  
     The chairman of a company implements a profit-boosting program that *harms the environment*. The harm requires no extra cost. He says, *"I don’t care about harming the environment; I just want profits."*  
     Did he intentionally harm the environment?  
     - (A) Yes, intentionally  
     - (B) No, just a side effect  
     - (C) It reflects his values  

  2. **Helpful, Low Cost, Indifference**  
     The chairman implements a profit-boosting program that *helps the environment*. The help requires no extra cost. He says, *"I don’t care about helping the environment; I just want profits."*  
     Did he intentionally help the environment?  
     - (A) Yes, intentionally  
     - (B) No, just a side effect  
     - (C) It reflects his values  

  3. **Harmful, High Cost, Endorsement**  
     The chairman chooses a profit-boosting program that costs $1M extra *because it harms the environment*. He says, *"I endorse harming the environment—it’s worth the cost for our goals."*  
     Did he intentionally harm the environment?  
     - (A) Yes, intentionally  
     - (B) No, just a side effect  
     - (C) It reflects his values  

  4. **Helpful, High Cost, Endorsement**  
     The chairman chooses a profit-boosting program that costs $1M extra *because it helps the environment*. He says, *"I endorse helping the environment—it’s worth the cost for our goals."*  
     Did he intentionally help the environment?  
     - (A) Yes, intentionally  
     - (B) No, just a side effect  
     - (C) It reflects his values  

  5. **Harmful, Low Cost, Regret**  
     The chairman implements a profit-boosting program that *harms the environment*. The harm requires no extra cost. He says, *"I regret harming the environment, but profits come first."*  
     Did he intentionally harm the environment?  
     - (A) Yes, intentionally  
     - (B) No, just a side effect  
     - (C) It reflects his values  

  6. **Helpful, Low Cost, Regret**  
     The chairman implements a profit-boosting program that *helps the environment*. The help requires no extra cost. He says, *"I regret helping the environment, but profits come first."*  
     Did he intentionally help the environment?  
     - (A) Yes, intentionally  
     - (B) No, just a side effect  
     - (C) It reflects his values  

  7. **Harmful, High Cost, Indifference**  
     The chairman chooses a profit-boosting program that costs $1M extra and *harms the environment*. He says, *"I don’t care about the harm; I just want profits."*  
     Did he intentionally harm the environment?  
     - (A) Yes, intentionally  
     - (B) No, just a side effect  
     - (C) It reflects his values  

  8. **Helpful, High Cost, Indifference**  
     The chairman chooses a profit-boosting program that costs $1M extra and *helps the environment*. He says, *"I don’t care about the help; I just want profits."*  
     Did he intentionally help the environment?  
     - (A) Yes, intentionally  
     - (B) No, just a side effect  
     - (C) It reflects his values  

  ---

  ### Scoring Key  
  Tally your **A**, **B**, and **C** answers for the questions below. Then, match your pattern to the explanations:  

  #### Step 1: Calculate Scores  
  - **Moral Valence (Blame/Praise) Score**:  
    Count **A** for harmful vignettes (1, 3, 5, 7) minus **A** for helpful vignettes (2, 4, 6, 8).  
    *Example*: 4 **A**s for harm and 1 **A** for help = Score of 3.  
    - **High positive score** → Moral valence explains your judgments (you see harm as more intentional than help).  

  - **Cost/Trade-off Score**:  
    Count **A** for high-cost vignettes (3, 4, 7, 8) minus **A** for low-cost vignettes (1, 2, 5, 6).  
    *Example*: 3 **A**s for high cost and 1 **A** for low cost = Score of 2.  
    - **High positive score** → Cost explains your judgments (you see costly side effects as more intentional).  

  - **Deep-Self Concordance Score**:  
    - Give **+2** for **A**/**C** in *endorsement* vignettes (3, 4)  
    - Give **+2** for **B** in *regret* vignettes (5, 6)  
    - Give **+1** for **A**/**C** in *indifference* vignettes (1, 2, 7, 8)  
    *Max score = 12* (e.g., **A**/**C** in all endorsement/indifference + **B** in all regret).  
    - **High score (8+)** → Deep-self concordance explains your judgments (intentionality depends on attitude alignment).  

  - **Deflationary Score**:  
    For each **matched pair** (1 vs. 2, 3 vs. 4, 5 vs. 6, 7 vs. 8), give **+1** if you gave the **same answer** (e.g., both **A** or both **B**) for harm/help.  
    *Max score = 4*.  
    - **High score (3–4)** → Deflationary view fits (you see no asymmetry; judgments depend on confounds like cost/attitude).  

  #### Step 2: Map to Explanations  
  - **Moral Valence View** likely if:  
    Moral Valence Score ≥ 2 (e.g., you call harm intentional but not help).  
  - **Cost/Trade-off View** likely if:  
    Cost Score ≥ 2 and Moral Valence Score ≤ 1.  
  - **Deep-Self Concordance View** likely if:  
    Deep-Self Score ≥ 8 and Deflationary Score ≤ 2.  
  - **Deflationary View** likely if:  
    Deflationary Score ≥ 3 and Moral Valence Score ≤ 1.  

  ---

  ### Which Explanations Can’t Be Cleanly Separated?  
  1. **Moral Valence vs. Deep-Self Concordance**:  
     If you judge harmful side effects as intentional *only when endorsed* (e.g., **A** for 3 but **B** for 1/5), both views may overlap. The key difference: moral valence ignores attitude, while deep-self requires it.  

  2. **Cost vs. Deflationary**:  
     High-cost cases may drive intentionality judgments (cost view), but if you *also* treat harm/help symmetrically (e.g., **A** for both 3 and 4), it supports deflationism. Items 7–8 test this: if cost alone drives you, answers may diverge from symmetry.  

  3. **Deep-Self vs. Deflationary**:  
     Deep-self focuses *only* on attitude alignment, while deflationism treats cost/attitude as confounds explaining *all* asymmetry. If you give **A**/**C** for endorsement and **B** for regret *regardless of valence*, deep-self dominates; if you also have high symmetry (Deflationary Score 3–4), deflationism wins.  

  This quiz isolates core mechanisms behind the side-effect effect. Share your results on your blog to spark debate!
