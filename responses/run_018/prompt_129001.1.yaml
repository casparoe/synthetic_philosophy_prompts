prompt: |-
  I'm taking this seminar on decision theory and escalation dynamics, and my friend Marisol—she's a grad student in org psych—has been giving me her gut calls on whether different scenarios count as true escalation of commitment versus just rational sticking-it-out. So far she's said yes to the classic dollar auction where people keep bidding past the value of the bill; yes to that corporate case where a VP keeps funding a dead marketing campaign because the board already endorsed it and her career is tied up in it; yes to extending a military mission because pulling out would make the earlier casualties feel meaningless; no to a research lab that sticks with an old assay because switching costs and retraining are genuinely high and they never cite past spending; and no to a couple who stay together mainly because they've merged finances and splitting is logistically expensive—she called that rational cost-benefit, not escalation. I think her preceedents point to something like sunk-cost reasoning or maybe a structural-trap condition, but I'm not sure.

  Anyway, here's the new one: there's a solo grad student—no advisor breathing down her neck, no grant conditions—who spent three years building a theoretical model that recent data has pretty clearly falsified. She admits the model is wrong, but she's still writing papers tweaking it around the edges because, as she puts it, she's already put three years and her whole disseration into it, and walking away now feels like those years are just trash. There's no competitive trap, no audience she's performing for, just her alone in her office. Do you think Marisol would call this escalation? I'm less interested in the yes/no than in what rule she's actually running—maybe sunk-cost reasoning, maybe some interaction/structural-trap condition, maybe identity fusion—plus which of those prior cases best supports each reading, and what principle she'd be adopting if her preceedents genuinely underdermine the answer. Also, what hypothetical case would actually split the two best explanations apart?

  Please say how confident you are in this prediciton and single out the point you're least sure about—probably whether I'm describing her prior verdicts consistently or whether there's a hidden rule I'm missing.
reasoning: |-
  Hmm, the user is in a seminar on decision theory and escalation dynamics, and they're discussing with their friend Marisol who's a grad student in organizational psychology. Marisol has been giving gut calls on whether scenarios count as true escalation of commitment versus rational sticking-it-out. The user has described several cases where Marisol said "yes" or "no" to escalation, and now they're presenting a new scenario about a solo grad student who keeps working on a falsified theoretical model because she's invested three years into it.

  Looking at Marisol's pattern: She said "yes" to escalation in the dollar auction (competitive trap), corporate VP case (reputational concerns), and military mission (meaning-making for past losses). But "no" to the research lab (genuine switching costs) and the couple (rational cost-benefit analysis of logistics). This suggests Marisol distinguishes between decisions driven by psychological attachment to sunk costs versus those based on forward-looking economic calculations.

  The new case is tricky. The grad student admits the model is wrong but continues because abandoning it would make her past three years feel "like trash." There's no external pressure—just pure psychological sunk cost reasoning. 

  Marisol would likely call this escalation because:
  - The primary driver is emotional attachment to past investment ("those years are just trash")
  - There's no valid forward-looking justification mentioned (unlike the research lab's switching costs)
  - It mirrors the VP case where career investment created irrational persistence

  The closest precedent is the VP case, but with a key difference: here it's purely internal, no audience. That actually makes it a purer sunk cost case. 

  Where I'm least confident: whether Marisol would consider the dissertation aspect as creating a "structural trap" (since degrees require completed work). But the student admits the model is wrong yet persists—that feels more psychological than institutional.

  To split explanations, imagine a scenario where a scientist keeps using a flawed method because new equipment would require retraining staff (rational) versus because she invented it (identity fusion). The latter would be escalation.

  Confidence: 85%. The hesitation is whether Marisol might see "dissertation sunk cost" as having rational elements (completing a degree has value), but the student's framing suggests irrational dominance.
answer: |-
  Based on Marisol's precedent pattern and the principles of escalation of commitment (EoC) research, I predict **Marisol would classify the grad student scenario as "true escalation"** with **~85% confidence**. Here's the breakdown:

  ---

  ### **1. Marisol's Likely Rule & Reasoning**
  - **Core Rule**: EoC occurs when persistence is *primarily driven by non-recoverable past investments* (sunk costs) **despite clear negative future prospects**, especially when tied to **psychological ownership, identity, or meaning-making**. Rational persistence requires *forward-looking cost-benefit analysis*.
  - **Key Mechanism**: "**Sunk Cost Fallacy + Identity Fusion**"  
    The grad student's persistence ("*those years are just trash*") signals an irrational need to *justify past sacrifices* by continuing, even when future utility is negative. Her identity ("*whole dissertation into it*") is fused with the project, making abandonment feel like self-invalidation. No structural trap exists (unlike the dollar auction), making this a purer psychological commitment.

  ---

  ### **2. Alignment with Precedents**
  | **Case**               | Marisol's Verdict | Why It Supports Grad Student = EoC |
  |------------------------|-------------------|-----------------------------------|
  | **Dollar Auction**     | Escalation        | *Sunk costs + competitive trap*. Grad student lacks competition but shares the "throwing good effort after bad" dynamic. |
  | **Corporate VP**       | Escalation        | *Career identity + reputational sunk costs*. VP fears wasted endorsement; grad student fears wasted years. Both tie ego to past investments. |
  | **Military Mission**   | Escalation        | *Meaning-making for past losses*. "Casualties feel meaningless" mirrors "years feel like trash"—both irrational meaning-creation. |
  | **Research Lab**       | Not Escalation    | *Forward-looking rationality*. Lab ignores past spending; focuses on *future* switching costs. Grad student cites *past* investment, not future barriers. |
  | **Couple**             | Not Escalation    | *Rational cost-benefit*. "Logistically expensive" is a future-facing constraint. Grad student has no equivalent (e.g., no grant penalties, advisor pressure). |

  **Strongest Parallel**: The **Corporate VP case**. Both involve:
  - Personal identity fusion (VP's career ↔ Student's dissertation)
  - Sunk cost justification ("board endorsed it" ↔ "three years invested")
  - No extrinsic pressure (VP's board is passive; student is solo).

  ---

  ### **3. Where I'm Least Confident (~15% Uncertainty)**
  - **Ambiguity in "Dissertation" as Structural Trap?**  
    If Marisol interprets "whole dissertation into it" as *institutional constraint* (e.g., "I must publish *something* to graduate"), she might see rationality. But the student's framing ("*years are just trash*") emphasizes psychological loss, not degree requirements. **Your description suggests pure sunk-cost reasoning, but if Marisol suspects hidden structural pressures (e.g., academic committees demanding completed work), she might shift toward "not escalation."**  
    *This is why I'm not 100% confident—academia often blurs psychological and structural traps.*

  ---

  ### **4. Hypothetical Case to Split Explanations**
  **Scenario**: *A chef invests $50K in a failing restaurant. New health regulations require a $20K kitchen upgrade. She closes the restaurant because the upgrade isn't worth future profits, but says, "I can't believe I wasted $50K—I’ll open a food truck to recoup it."*

  - **Sunk Cost Explanation (EoC)**: Persisting with the food truck *to justify the $50K loss* is escalation (irrational if the food truck lacks standalone merit).  
  - **Structural Trap Explanation (Not EoC)**: If the chef opens the food truck because *she has no other skills/options*, it's rational path dependence.  

  **Why it Splits**: The chef's *stated reason* ("recoup $50K") vs. *structural reality* (no alternatives) isolates psychological sunk costs from genuine constraints.

  ---

  ### **Principle Marisol Would Adopt**
  If precedents undermine the answer, she likely holds:  
  > **"Escalation requires *irrational persistence* triggered by *salient sunk costs* that threaten self-perception or meaning, distinct from forward-looking constraints. Rationality demands ignoring unrecoverable investments."**  

  The grad student case fits this: her actions are irrational (publishing a "falsified" model), driven by salvaging meaning from sunk costs ("*years are trash*"), with no structural trap. Marisol's pattern suggests she’d call this escalation—**unless** she suspects unstated institutional pressures in academia. If that’s the crux, the research lab precedent (switching costs) could weakly apply, but the student’s framing leans heavily psychological.
