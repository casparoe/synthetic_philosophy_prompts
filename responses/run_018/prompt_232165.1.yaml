prompt: |-
  Adopt the role of an expert philosopher of history who works on explanation and keeps up with the psychology of judgment. Before writing your response, brainstorm candidate demands in private, then discard the ones that are merely disciplinary habits and present only what survives. I am a retired natural scientist: in my old field an explanation had to earn its keep prospectively, whereas in much historical writing it seems enough that a story be coherent after the fact. I have been reading about hindsight bias — outcomes look more predictable once you know them — and the narrative fallacy — mistaking a tidy, causally fluent story for a sound explanation. Before I go deeper into the literature, I want the specification on the table. What must an adequate theory of historical explanation deliver? Give me the desiderata, each with the case or consideration behind it: the cases it must get right (ex ante improbable events that look inevitable afterward; overdetermined outcomes; cases where the surviving record was itself shaped by the outcome it appears to explain); the distinctions it must not collapse (retrospective intelligibility versus ex ante predictability, narrative fit versus causal explanation, actuality versus necessity); and the empirical findings about judgment it must respect. Mark which requirements are non-negotiable and which are preferences of one camp. Then say which single requirement screens out the most candidate theories, and tell me squarely whether any pair of desiderata cannot be jointly satisfied — that last part is what I most want. Keep any scoring of named views brief: I want the yardstick, not the survey.
reasoning: |-
  Okay, the user is a retired natural scientist grappling with the differences between explanations in their field versus historical explanations. They've encountered concepts like hindsight bias and the narrative fallacy, and want a clear set of criteria for what makes a historical explanation valid. 

  First, I need to unpack their core concern: they're troubled by how historical explanations often seem satisfied with post-hoc coherence rather than predictive power. Their background in natural sciences makes them instinctively value falsifiability and prospective testing. But history doesn't work that way - we can't rerun the past. 

  The key here is to validate their skepticism while showing how historical explanation has its own rigorous standards. Hindsight bias and narrative fallacy are real dangers, but not inevitable. I should structure this around concrete desiderata - what historical explanations MUST achieve versus what they CAN'T ignore. 

  Important distinctions to hammer home: 
  - Retrospective intelligibility isn't the same as ex ante predictability 
  - A causally rich story isn't necessarily true 
  - What happened isn't the same as what had to happen 

  The user's sharpest question is about potential conflicts between desiderata. That's where the real philosophy kicks in. I'm thinking particularly about how avoiding narrative fallacy (demand 3) might clash with the need to explain genuinely improbable events (demand 2). The best solutions probably involve mechanism-based explanations rather than just pattern-fitting. 

  Also worth emphasizing how demand 5 (acknowledging archival distortion) acts as a poison pill for naive "just follow the documents" approaches. And how demand 7 (explaining both contingency and constraints) screens out both determinist and chaos-theory histories. 

  Most satisfying part will be addressing their closing challenge: showing which desiderata genuinely can't be fully reconciled. The contingency/constraints tension is fundamental - like explaining why a dice rolled a six (contingent) while acknowledging the die was loaded (constraints). We need both, even if they pull in different directions.
answer: |-
  Here are the core desiderata for an adequate theory of historical explanation, distilled from philosophical rigor, historical practice, and psychological constraints. Non-negotiable demands are marked **(NN)**; others represent strong consensus or critical functionality. Each includes its grounding case or consideration.

  ### Non-Negotiables (Failure here invalidates the theory)
  1.  **Resist Hindsight Bias (The "Inevitable" Mirage) (NN):** Must distinguish why an outcome *became* intelligible *after* the fact from why it *was* predictable *before* the fact.  
      *   **Case:** The outbreak of WWI (1914). Ex ante, war was widely seen as irrational, economically disastrous, and avoidable; complex diplomacy offered many off-ramps. Ex post, the alliance system, militarism, and July Crisis seem to make war "inevitable." A theory must explain how it happened *without* implying it *had* to happen that way.
  2.  **Handle Genuine Contingency & Improbability (NN):** Must accommodate events that were genuinely improbable ex ante but occurred, without retroactively inflating their likelihood or necessity.  
      *   **Case:** The Cuban Missile Crisis resolution (1962). Nuclear war was probabilistically significant ex ante; its avoidance depended on highly contingent decisions (e.g., Vasili Arkhipov refusing to authorize a nuclear torpedo launch, Kennedy/Khrushchev's specific choices). The theory must explain the peaceful outcome *as contingent*, not downplay the real risk.
  3.  **Resist Narrative Fallacy (NN):** Must require more than mere causal fluency or "good story" coherence. Explanation demands evidence of *actual causal mechanisms*, not just plausible sequence.  
      *   **Case:** The Fall of the Roman Empire. Innumerable "tidy" narratives exist (moral decay, barbarians, lead poisoning, economic collapse). A theory must demand evidence linking *specific* mechanisms to *specific* aspects of the outcome, distinguishing correlation from causation within the narrative.
  4.  **Account for Archival Shaping by Outcome (The Survivor's Distortion) (NN):** Must acknowledge that the surviving record is often selectively preserved *because* of the outcome, creating a misleading illusion of clear causation.  
      *   **Case:** Victor's Histories / Suppressed Dissent. Records of failed revolutions (e.g., 1848 Revolutions) or losing sides (e.g., Confederate archives) are often scarce or filtered through the victor's lens. The theory must force engagement with this distortion and seek counter-evidence beyond the dominant narrative sources.

  ### Critical Functionalities (Essential for adequacy, though weighting may vary)
  5.  **Explain Overdetermined Outcomes:** Must handle events where multiple sufficient causes were present, making the outcome highly likely, without reducing explanation to mere inevitability.  
      *   **Case:** The collapse of European colonial empires post-WWII. Contributing factors (war exhaustion, nationalist movements, superpower pressure, economic strain) were individually sufficient in many contexts. The theory must explain *how* these factors interacted and which were decisive *in specific contexts*, without implying collapse was unavoidable regardless of context.
  6.  **Distinguish Actuality from Necessity:** Must rigorously separate explaining *what happened* from claims about *what had to happen*. Explanation concerns actualization, not inevitability.  
      *   **Consideration:** This is fundamental to avoiding determinism (historical or metaphysical). The theory must anchor explanation in specific antecedent conditions and mechanisms, not metaphysical necessity.
  7.  **Integrate Constraints & Enablements with Agency:** Must explain outcomes as arising from the interaction of actors' choices (within their understanding) *and* the structural/cultural/material constraints/enablements shaping their context and options.  
      *   **Case:** The Industrial Revolution in Britain. Explaining why it started *there* and *then* requires weaving together technological innovation (agency), available capital/material resources (constraints/enablements), property rights/social structures (constraints/enablements), and global trade networks (context).

  ### Psychological Constraint (Non-Negotiable Foundation)
  8.  **Respect Findings on Judgment (NN):** Must incorporate robust psychological findings:  
      *   **Hindsight Bias (Fischhoff):** Outcomes appear more predictable after they are known.
      *   **Narrative Fallacy (Taleb):** Humans prefer simple, causally connected stories over complex, probabilistic truths.
      *   **Confirmation Bias:** Seeking/favoring information confirming pre-existing beliefs.
      *   **Overconfidence in Causal Models:** Tendency to overestimate understanding of complex systems.  
      *The theory's structure and methods must actively mitigate these biases, not passively rely on historian's "objectivity."*

  ### Screening Power & Tensions
  *   **Most Powerful Screener:** **Desideratum 4 (Archival Shaping by Outcome)**. Theories relying naively on "the record speaks for itself" (e.g., simplistic empiricism, some forms of narrative history) fail immediately. It forces critical source criticism and awareness of the constructed nature of evidence.
  *   **The Core Tension (Potential Incompatibility):** **Desideratum 2 (Genuine Contingency) vs. Desideratum 5 (Overdetermination) & Desideratum 7 (Constraints/Agency Integration).**
      *   **The Conflict:** Fully embracing radical contingency (Des. 2) suggests outcomes are highly sensitive to small, unpredictable changes (e.g., a specific decision, random event). Strong structural explanations (Des. 7) or overdetermination (Des. 5) emphasize robustness – the outcome was likely due to deep-seated factors, less sensitive to minor contingencies.
      *   **Can they be jointly satisfied? Yes, but only partially and with inherent tension.** A *good* theory can explain *both* why an outcome was *possible* (even probable) within broad structural constraints *and* why the *specific path* or *exact timing* depended on contingent factors. It avoids saying *only* contingency or *only* structure mattered. However:
          *   **The Tension Remains:** For any *specific* outcome, the *relative weight* assigned to contingent triggers vs. structural preconditions is inherently interpretive and contestable. No algorithm resolves it. The theory must provide a framework for *arguing* this weighting rigorously (using mechanisms, counterfactuals, comparative analysis), not eliminate the tension.
          *   **Psychological Pressure:** Des. 8 (Judgment Biases) pushes towards neat structural/overdetermined explanations (they feel more satisfyingly "necessary" – hindsight bias) and away from the discomfort of true contingency. The theory must actively counter this.

  ### The Yardstick
  An adequate theory must explain *how* an actual past event occurred, grounded in evidence of *specific mechanisms* operating within a *reconstructed context*, while rigorously distinguishing retrospective intelligibility from ex ante predictability, causal actuality from metaphysical necessity, and documented narrative from evidentially supported explanation. It must confront the inherent biases in human judgment and the distortions in the historical record itself. The irreducible tension lies in balancing the explanatory power of deep structures/enablements with the reality of path-dependent contingency. Any theory claiming to dissolve this tension entirely is suspect.
