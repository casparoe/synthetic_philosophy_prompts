answer: |-
  ## The Unsettled Debt: Normative Residue and the Binding Power of Promises

  Promises weave the fabric of human cooperation, grounding trust and enabling complex social structures. Yet, the philosophical foundation of their binding force remains contested. Why does a promise generate a genuine *moral obligation*, distinct from mere prudential calculation? Two dominant accounts vie for supremacy: the **authority-transfer view**, championed by thinkers like T.M. Scanlon (in later work) and Seana Shiffrin, which sees promising as delegating a portion of the promisor’s practical authority to the promisee; and the **reliance-harm view**, most famously associated with Scanlon’s earlier work and others like Judith Jarvis Thomson, which locates the wrong of breaking a promise in the harm caused by frustrating deliberately induced, legitimate expectations. To resolve this tension, the phenomenon of **normative residue** – the persistent moral remainder, such as agent-regret or a standing reason to make amends, that survives even after full compensation and the dissipation of further harm – serves as a critical crucible. This residue reveals the inadequacy of both pure accounts and points decisively towards a **layered hybrid model** integrating deontic obligation with aretaic fidelity.

  The authority-transfer view posits that by uttering "I promise," the promisor transfers a normative right to the promisee, granting them a measure of control over the promisor’s actions. The promisee now holds a kind of "authority stake" in the promisor’s decision. On this model, breaking a promise is wrong *primarily* because it violates this delegated authority; the promisor usurps a right they willingly ceded. Normative residue fits intuitively: even if the promisee is fully compensated and suffers no further setback, the residue persists because the *unexercised claim* of the promisee remains unsatisfied. The promisee’s moral authority over that specific action domain was disregarded, leaving a stain of disrespect that compensation cannot erase. The debt isn't merely material; it's a debt of deference owed to the promisee’s rightful standing.

  Conversely, the reliance-harm view grounds the obligation in the consequences of the promise. By promising, the promisor deliberately invites the promisee to form expectations and potentially rely upon the promised action. Breaking the promise wrongs the promisee by frustrating these deliberately cultivated, legitimate expectations, causing harm (whether material, psychological, or opportunity-based). The wrong is fundamentally one of manipulation and induced vulnerability. Explaining normative residue through this lens is more challenging. Proponents might argue that the residue stems from the fact that the *original act of expectation-creation* cannot be fully undone. Compensation addresses the *resulting harm* but cannot retroactively negate the promisor's culpability in creating a vulnerable position they then exploited. The promisor is left with regret over their initial, expectation-inducing act – a harmful manipulation that lingers as a moral blot. However, this feels strained. If the harm is fully compensated – the lost opportunity replaced, the distress alleviated – why should a distinct moral remainder persist? The reliance-harm view struggles to articulate why the *act itself* of breaking a promise, independently of its consequences, retains a unique moral taint once the consequences are nullified.

  This failure of pure accounts to fully capture the phenomenology of normative residue points towards a **layered alternative**. Promises bind through two distinct, though often intertwined, normative mechanisms:
  1.  **A Deontic Layer:** This encompasses the core obligation, potentially grounded *either* in the delegated authority (emphasizing the promisee's right) *or* the prevention of wrongful harm (emphasizing the duty not to induce and frustrate reliance). This layer generates the primary *wrong* to the promisee.
  2.  **An Aretaic Layer:** This concerns the promisor's own character and integrity. Breaking a promise constitutes a failure of *fidelity* – a betrayal of the trust one implicitly stakes in oneself by making a commitment. It damages the promisor’s moral self-constitution as a trustworthy agent.

  Normative residue finds its most compelling explanation in this aretaic layer. When a promise is broken, even for overriding reasons or with full compensation, the deontic wrong *to the promisee* might be mitigated or negated. However, the aretaic wrong *to oneself* – the failure of fidelity – persists. This explains the lingering agent-regret: the promisor regrets *being the kind of person* who, even excusably, failed to keep their word. It explains the standing reason to make amends: not merely to compensate harm (which might be done), but to symbolically reaffirm one's commitment to fidelity and begin restoring one's own integrity. The residue is the shadow cast by the promisor’s compromised self-trust.

  An obvious objection arises: Doesn't this layered view overcount the moral cost by making promise-breaking doubly wrong? It seems to impose both a deontic debt to the promisee *and* an aretaic cost to the self. The counter-objection is powerful: Without the aretaic layer, normative residue becomes inexplicable. Cases of **compelled promises** or **overridden promises** illustrate this decoupling. Imagine promising under duress to do something immoral. Keeping the promise might be wrong (deontic violation). Breaking it might be morally required, and perhaps even cause no compensable harm to the promisee (who knew it was coerced). Yet, the promisor may still experience profound residue – regret at having made the promise, at having their integrity compromised by the situation. The wrong here is purely aretaic: a violation of personal fidelity, independent of any harm or obligation *to the promisee*. Conversely, breaking a trivial promise causing significant, uncompensated harm might primarily involve the deontic layer with minimal residue if the promise itself felt insincere or unimportant to the promisor's self-conception. The layers *can* come apart, demonstrating their independence and the necessity of the aretaic dimension to explain the full moral landscape, especially the residue.

  Therefore, while the deontic core of promising may find its most plausible grounding in a modified authority-transfer view (emphasizing the creation of a unique right/claim in the promisee, distinct from mere harm prevention), reliance considerations often play a crucial *epistemic* and *motivational* role in understanding the *weight* and *scope* of specific promises. Yet, neither deontic account alone suffices. The persistent phenomenon of normative residue, particularly evident when deontic obligations are overridden or dissolved, demands recognition of the aretaic dimension of fidelity. Promises bind us not only to others through obligation, but also to ourselves through the constitutive demands of integrity. To break a promise is always, in some measure, to betray oneself as a promise-making agent, and it is this self-betrayal that leaves the enduring, unsettling trace of moral debt we recognize as normative residue.

  **Verdict: The layered hybrid account, integrating a deontic obligation grounded in authority-transfer with a distinct aretaic obligation of fidelity to oneself, succeeds by uniquely explaining normative residue and accommodating cases where deontic and aretaic reasons decouple.**
