answer: |-
  The air in the ChronoRegistry Archive smelled perpetually of dust, ozone, and stale coffee. Ceiling lights hummed, illuminating endless rows of identical gray cabinets stretching into the distance. No windows. No clocks. Just the universe, 1800 to 2500 CE, filed flat. Like books on a shelf, Ms. Aris Thorne reminded herself daily. No "Now" section. Just coordinates.

  Her current headache was Case #K-774: *Hydro-Flow Consortium (Est. 2042) vs. Delta Terraforming Collective (Est. 1948) re: Cascadia Basin Flood Event (1998)*.

  The claim? A retrocausal escrow breach. Hydro-Flow insisted their 2047 contract with Delta (a standard water-rights deal, filed under its spacetime stamp) contained a liability clause that, due to relativistic simultaneity conventions, *caused* the 1998 flood. They demanded damages extracted from Delta's assets held in *earlier* escrow accounts.

  Retrocausal escrow. Necessary evil in a block universe. You locked obligations at specific future spacetime points, knowing parties existing *earlier* along some worldlines might dispute them based on *their* "now." It was messy accounting for a static cosmos.

  Aris sighed, pulling the physical dossiers. The 1998 Flood Report (Section 1998-NA-PAC-1145) detailed torrential rain, dam failures, devastation. Standard pre-climate-shift disaster. The 2047 Contract (Section 2047-NA-PAC-1145) was dense legalese, but Clause 7b was clear: Hydro-Flow assumed liability for "water table destabilization within the defined basin coordinate set."

  Hydro-Flow's argument hinged on simultaneity. Using the standard Earth-centered inertial frame, the contract signing (2047) was clearly *after* the flood (1998). Cause must precede effect. Case closed against Hydro-Flow.

  *But*, Aris thought, opening her console, *simultaneity is conventional.* She selected the archive visualization tool. The endless cabinets faded, replaced by a shimmering, intricate lattice – the block universe. Points glowed: Flood (1998), Contract Signing (2047). Connecting them was a complex web of possible worldlines.

  She switched the reference frame. Not Earth-Standard. She punched in the parameters for the *Mars Colonial Transit Frame*, used by a cargo hauler whose path intersected both events. The visualization rotated, stretched. Suddenly, the bright point of the 2047 Contract Signing overlapped *directly* with the timeline leading *into* the 1998 flood coordinates. In *this* frame, chosen by Hydro-Flow's lawyers, the signing was simultaneous with the *causal precursors* of the flood. The destabilization clause in 2047 could be argued to "lock in" the water table instability that *manifested* as the 1998 flood, retroactively making Hydro-Flow liable.

  "It’s just geometry," Aris muttered. Neither frame was "more real." Earth-Standard said cause (flood) then effect (contract liability clause activation). Mars Transit said contract clause (cause) simultaneous with flood-precursors (effect). Both valid slices through the eternal block.

  She needed corroborating evidence. The Occurrence Reports for the Cascadia Basin coordinates around 1998. She navigated the physical aisles, finding Cabinet Row 1998, Bay NA-PAC, Shelf 1140-1150. She pulled the binder labeled "Env. Anomalies: Pre-Flood." Flipping through, she found the expected reports: minor seismic shifts, unusual aquifer depletion readings… and one misfiled sheet. Stuck between reports from 1997 was a coffee-stained note dated *1999* – a post-flood geological survey highlighting a *pre-existing*, previously unknown subsurface fracture zone directly under the failed dam. Critical evidence of inherent instability *before* any hypothetical 2047 clause could be blamed.

  Aris stared. This note shouldn't be here. It belonged in the *post*-flood analysis binder. Some harried clerk decades ago misfiled it. But in the archive, it existed *here*, in the pre-flood record, physically present at these coordinates. Its information *was* contemporaneous with the precursors in *any* frame.

  Her stomach knotted. Blame? In Earth-Standard frame, the fracture was a pre-existing cause. In Mars Transit frame, its *documentation* (though misfiled from a linear view) existed "simultaneously" with the contract signing potentially influencing the *interpretation* of the precursors. The misfile changed the evidence landscape *retroactively* across all frames because the block contained the misfiled document *at that location*.

  The philosophy was precise, cold: Every point, every document, every coffee stain is equally real. There is no flow, only relations. "Causing" the flood meant establishing a counterfactual link: *if not for X, Y wouldn't have happened.* But in the block? Every "X" and "Y" are fixed. You couldn't pluck out the 2047 contract and see if the flood still happened; the block contained both, inseparably linked by spacetime paths. "Blame" was just a human overlay on geometric relations.

  Using the Mars Transit frame *was* valid convention. The contract clause *could* be interpreted as applying to destabilization events along certain worldlines. *But*, the misfiled 1999 survey report was now part of the pre-flood record, proving inherent instability existed independently. The fracture zone was the primary cause in *all* frames.

  She drafted her ruling:

  > **ADJUDICATION: Case #K-774**
  > *   Claim of retrocausal escrow breach (Hydro-Flow Consortium) DENIED.
  > *   Basis: While simultaneity convention (Mars Colonial Transit Frame) allows potential temporal overlap between Contract Clause 7b (2047) and causal precursors of Cascadia Flood (1998), evidentiary record (specifically Occurrence Report Env-997-PAC1147b, misfiled but present) establishes a pre-existing, primary geophysical instability sufficient to cause the flood event independent of any future contractual obligation. Liability under Clause 7b cannot be established as the *sine qua non* of the event.
  > *   Note: The presence of misfiled evidence highlights the static nature of the archive; all points possess equal ontological weight. "Causation" remains a relational descriptor within chosen reference frames, not an absolute temporal sequence.

  Aris stamped the form. It felt deeply unfair. That misfile was a clerical error in linear time, but here, it was a fixed fact that saved Delta (who hadn't technically *existed* in 1998) from liability based on a contract signed 49 years later. Blame dissolved into the geometry. The flood happened, the contract was signed, the report was misfiled – all equally real, all just… there. Like books on a shelf.

  She filed the ruling under its spacetime coordinates, adding one more fixed point to the humming, dusty, unchanging block. Just geometry. But her coffee tasted especially bitter.
