prompt: |-
  I'm running a small seminar for first-year graphic-design students who think type is mostly convention and that an 'a' is just whatever a font file says it is. I want to walk them through the idea behind Hofstadter's Letter Spirit — that there's something like an 'a-ness' that survives across wildly different styles, and that recognizing it involves seeing roles and relations rather than matching a template. Could you lay out a teaching plan? I need: the order in which the pieces should come (what depends on what — for instance, do they need to understand 'roles' before 'style parameters'?), the one concrete comparison or example that should carry the whole session and exactly what it needs to show and not show, the misconceptions they're likely to bring in (maybe that there's one perfect Platonic 'a', or that computers just do pixel matching) and where in the sequence to head each off, the quick check I'd use to see if they've actually gotten that letter identity and letter style are seperate, and what part of the formal stuff I should just skip and admit I'm skipping. I'm also wondering how you'd use a boundary case — like a highly stylized 'a' that starts looking like an 'o' with a tail — to test whether they understand that the category has fuzzy edges rather than a hard rule. The audience has no cognitive-science background, so don't assume they know anything about 'roles' or analogical reasoning going in.
