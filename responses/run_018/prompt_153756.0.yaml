prompt: |-
  I'm an ethics consultant in a busy hospital and I get paged ocassionally — maybe twice a week — for consent conflicts that have to be settled in about twelve minutes because surgery is waiting or family is in the hallway yelling. I have to put my own signature on the call; there's no ethics committee at 3am to hide behind. I need a reusable checklist that turns deontology into something I can actually run, especially the paradox where absolute duties to autonomy and non-maleficence seem to make me violate one no matter which I pick.

  The procedure should be steps I can run in order, with the judgment-call parts clearly flagged and not disguised. Specifically include:

  - How to identify the active duties in the case, not just list Kantian rules
  - A shadow-maxim test: state the maxim of the action I recommend and the maxim of the exception I'm allowing, then check whether both can be willed as universal law for anyone in my clinical role without contradiction. If they can't, that's a real conflict, not an apparent one.
  - A tie-breaker for genuine conflict — but mark it as a judgment call I'm dressing up as procedure
  - A moral-residue box: document which duty gets overridden and acknowledge it stays violated, so I'm not pretending the paradox disappears
  - The misfire conditions: when does this checklist just collapse?

  Then apply it to three cases. One should give me an answer I'm genuinely not going to like — I want to see the procedure force my hand.

  Case 1: Fully capacitated adult refuses a life-saving transfusion for religious reasons; family begs me to override.

  Case 2: Unconscious trauma patient, no surrogate present yet, old ambiguous chart note that might indicate refusal of aggressive care; surgeon wants to operate immediately or the patient dies.

  Case 3: Patient with intermittent but documented capacity refuses dialysis during a lucid window; family and nephrologist claim depression is driving it, but refusal matches prior values. The procedure should tell me to honor the refusal, knowing it leads to death and legal exposure, and I have to sign my signiture.

  Finally, say plainly what this procedure can't do — it can't prove deontology is right, it can't manufacture missing facts, and it can't replace my judgment under time pressure.

  Keep it practical, not an academic essay. No reading lists or citations, just the steps.
reasoning: |-
  We are creating a practical, step-by-step checklist for resolving consent conflicts in a clinical ethics context, grounded in deontological principles (especially Kantian ethics). The checklist must address the paradox of conflicting absolute duties (autonomy vs. non-maleficence) and include the specified elements.

  The steps:

  1. **Identify the Active Duties**: 
     - List the specific duties in play (e.g., duty to respect autonomy, duty of non-maleficence, duty of beneficence, etc.). Be concrete: what action does each duty require in this case?
     - Identify the patient's known values and preferences (if any) and the medical facts (urgency, prognosis, alternatives).
     - Flag: This step requires judgment in interpreting the situation and the duties.

  2. **State the Proposed Action and Its Maxim**:
     - Clearly state the action you are considering (e.g., "override refusal and proceed with transfusion").
     - Formulate the maxim of that action: "I will [action] when [conditions] in order to [purpose]." The maxim must be universalizable.
     - Also state the maxim of the exception you are allowing (if any): "I will make an exception to [duty] when [conditions]."

  3. **Shadow-Maxim Test**:
     - Test the maxim of the action and the maxim of the exception for universalizability. Can both be willed as universal laws without contradiction? 
       - Contradiction in conception: If everyone in your clinical role acted on that maxim, would it undermine the very practice or duty? 
       - Contradiction in will: Would you will a world where everyone in your role acts on that maxim?
     - If both can be willed without contradiction, then there is no real conflict (only apparent). Proceed with the action.
     - If one or both cannot be willed without contradiction, then you have a genuine conflict. Proceed to tie-breaker.

  4. **Tie-Breaker for Genuine Conflict** (Judgment Call):
     - When duties genuinely conflict (both maxims cannot be universalized without contradiction), then:
       - Consider which duty, if violated, would cause the greater moral harm (not just medical harm) in this particular case.
       - Consider the patient's known values and prior expressed wishes (if any) as a way to weight autonomy more heavily when it is clear.
       - Consider the immediacy and irreversibility of harm.
       - *Judgment Call Flag*: This step is inherently subjective and must be acknowledged as such. The decision is not deduced but chosen.

  5. **Moral-Residue Box**:
     - Document which duty is being overridden (e.g., "I override the duty of non-maleficence by allowing the patient to refuse life-saving treatment").
     - Acknowledge that the overridden duty remains violated and that this creates moral residue (regret, guilt, etc.). Do not pretend the conflict disappears.

  6. **Misfire Conditions** (When the Checklist Collapses):
     - When there is no time to run the steps (e.g., less than 5 minutes).
     - When critical facts are missing and cannot be obtained (e.g., patient's capacity is unknown and cannot be assessed).
     - When the conflict involves duties that are not absolute (e.g., conflicts between two non-absolute duties) and thus the universalizability test is not applicable.
     - When the situation is so unique that no universal maxim can be formulated (extremely rare in clinical ethics).

  Now, apply to the cases:

  **Case 1: Capacitated Adult Refusing Transfusion**
  - Step 1: 
    - Duties: 
      - Autonomy: Honor the patient's refusal (absolute duty to respect the decision of a capacitated patient).
      - Non-maleficence: Prevent death (by overriding refusal to give transfusion).
    - Facts: Patient has capacity, refusal is based on religious reasons, family is upset. Without transfusion, patient dies.
  - Step 2: 
    - Proposed action: Uphold refusal (do not transfuse).
      - Maxim: "I will always respect a refusal of treatment by a capacitated patient, even when it leads to death, in order to uphold their autonomy and dignity."
    - The exception maxim (if we were to override): "I will override a capacitated patient's refusal when I believe it is in their best medical interest to do so, in order to save their life."
  - Step 3: Shadow-Maxim Test
    - Maxim of action (uphold refusal): Universalizable? Yes. If every clinician always respected capacitated refusals, the practice of respecting autonomy would be consistent and sustainable. No contradiction.
    - Maxim of exception (override): Not universalizable. If every clinician overrode capacitated refusals whenever they thought it was in the patient's best interest, then the concept of autonomy and consent would be destroyed (contradiction in conception). Also, we would not will a world where our own refusals could be overridden (contradiction in will).
    - Conclusion: No genuine conflict. The duty to autonomy is absolute and the exception maxim fails. Therefore, we must uphold the refusal.
  - Step 4: Tie-breaker not needed (no genuine conflict).
  - Step 5: Moral Residue: We override the duty of non-maleficence (we allow harm by not transfusing). Acknowledge: "By honoring autonomy, I allow a preventable death. This is a violation of non-maleficence and creates moral residue."
  - Action: Do not transfuse. Document refusal and reasons. Support family.

  **Case 2: Unconscious Trauma Patient, Ambiguous Note**
  - Step 1:
    - Duties:
      - Autonomy: Respect prior expressed wishes (if known and clear).
      - Non-maleficence: Save life by operating immediately.
      - Beneficence: Act in the patient's best interest.
    - Facts: Patient unconscious, no surrogate immediately available, old chart note that is ambiguous (e.g., "patient states he does not want to be kept alive on machines" but current surgery is life-saving without long-term machine dependence). Surgery is urgent: without it, death is imminent.
  - Step 2:
    - Proposed action: Proceed with surgery (override the ambiguous refusal).
      - Maxim: "I will proceed with life-saving treatment for an incapacitated patient when there is no clear and present evidence of refusal, in order to preserve life and allow time for surrogate input."
    - The exception maxim (if we were to withhold surgery): "I will withhold life-saving treatment when there is any ambiguity about prior wishes, in order to avoid violating autonomy."
  - Step 3: Shadow-Maxim Test
    - Maxim of action (proceed): Universalizable? Yes. If every clinician proceeded when there is ambiguity, we would preserve life until the patient's wishes can be clarified. This does not destroy the practice of autonomy because we are not ignoring clear refusals.
    - Maxim of exception (withhold): Not universalizable. If every clinician withheld treatment whenever there was any ambiguity, then many patients would die even if they would have wanted treatment. This would undermine the duty of beneficence and non-maleficence. Also, we would not will a world where our own lives are lost due to an ambiguous note.
    - Conclusion: No genuine conflict. The maxim to proceed is universalizable and the maxim to withhold is not. Therefore, proceed with surgery.
  - Step 4: Not needed.
  - Step 5: Moral Residue: We might be violating autonomy if the patient truly refused. Document: "I proceed with surgery despite an ambiguous note, overriding potential autonomy concerns. If the patient did refuse, autonomy is violated and this creates moral residue."
  - Action: Proceed with surgery. Document the ambiguity and the reasons for proceeding. Attempt to contact surrogate as soon as possible.

  **Case 3: Intermittent Capacity Refusing Dialysis**
  - Step 1:
    - Duties:
      - Autonomy: Honor the refusal made during a lucid interval (if capacity is present at the time of refusal).
      - Non-maleficence: Prevent death by providing dialysis.
    - Facts: Patient has intermittent capacity, refusal during lucid window, refusal consistent with prior values. Without dialysis, death is certain. Family and nephrologist claim depression is influencing the decision, but the patient is currently assessed as having capacity and the refusal matches prior values.
  - Step 2:
    - Proposed action: Honor the refusal (do not provide dialysis).
      - Maxim: "I will respect a refusal of life-sustaining treatment by a patient who has capacity at the time of refusal and whose decision is consistent with their prior values, even if it leads to death, in order to uphold autonomy."
    - The exception maxim (if we override): "I will override a capacitated patient's refusal of life-sustaining treatment when I believe their decision is influenced by a mental illness (e.g., depression) and they have a treatable condition, in order to save their life and restore their capacity for autonomous decision-making."
  - Step 3: Shadow-Maxim Test
    - Maxim of action (honor refusal): Universalizable? Yes. If every clinician respected refusals by capacitated patients that are consistent with prior values, autonomy is upheld. No contradiction.
    - Maxim of exception (override): Not universalizable. If every clinician overrode refusals when they suspected depression (without clear evidence that depression is causing incapacity and without a formal determination of incapacity), then the autonomy of capacitated patients would be routinely violated. This would destroy the practice of informed consent (contradiction in conception). Also, we would not will a world where our own decisions when capacitated are overridden based on others' suspicions.
    - Conclusion: No genuine conflict. The duty to autonomy is absolute in this case. Therefore, honor the refusal.
  - Step 4: Not needed.
  - Step 5: Moral Residue: We override the duty of non-maleficence by allowing death. Document: "I honor the patient's refusal, knowing it leads to death. This violates non-maleficence and creates moral residue. The patient's autonomy is preserved."
  - Action: Honor the refusal. Document the capacity assessment and the consistency with prior values. Prepare for legal exposure.

  **What the Procedure Can't Do**:
  - It cannot prove that deontology is the correct ethical framework.
  - It cannot manufacture missing facts (e.g., if capacity is unclear and there's no time to assess, the procedure may misfire).
  - It cannot replace your judgment under time pressure; it only structures it.
  - It does not eliminate moral distress; it only makes the conflict explicit and the decision transparent.
answer: |-
  ### Deontology Rapid Checklist for Consent Conflicts  
  **Use when:** You have 10-12 minutes to resolve a conflict between autonomy and non-maleficence. **Goal:** Make a defensible decision with moral clarity, not "solve" the paradox.  

  ---

  #### **Step 1: Identify Active Duties**  
  *What must I do here, specifically?*  
  - **List concrete duties** tied to the case (don’t just recite "autonomy" or "non-maleficence"):  
    - *Autonomy duty:* "I must respect [specific patient choice] because [reason, e.g., 'patient is capacitated']."  
    - *Non-maleficence duty:* "I must prevent [specific harm] because [reason, e.g., 'death is imminent']."  
    - *Other duties?* (e.g., beneficence, justice, fidelity to prior wishes).  
  - **Flag judgment calls:**  
    - If capacity/surrogacy/urgency is unclear, note: "Uncertainty in [X] — I assume [Y] due to [Z]."  
    - *Time limit:* 2 minutes max. If facts are missing, skip to **Misfire Conditions**.  

  #### **Step 2: Shadow-Maxim Test**  
  *Can both duties coexist as universal rules?*  
  - **State your recommended action as a maxim:**  
    "I will [action, e.g., 'override refusal'] when [conditions, e.g., 'family demands it'] to achieve [goal, e.g., 'prevent death']."  
  - **State the maxim of the exception you’re allowing:**  
    "I will violate [duty, e.g., 'autonomy'] when [conditions] to uphold [other duty, e.g., 'non-maleficence']."  
  - **Test for universalizability:**  
    - *Could every clinician in my role act on both maxims without contradiction?*  
      - **Yes → Conflict is apparent.** Duty to follow is clear. Proceed.  
      - **No → Genuine conflict.** Duties can’t coexist. Go to Step 3.  
  - **Flag:** If you’re rationalizing ("This case is unique!"), you’ve failed the test.  

  #### **Step 3: Tie-Breaker (Judgment Call, Dressed as Procedure)**  
  *When duties genuinely conflict, which gets priority?*  
  - **Apply weighted rules:**  
    1. Autonomy outweighs non-maleficence *if*:  
       - Patient is capacitated *and* choice aligns with stable values.  
       - No coercion.  
    2. Non-maleficence outweighs autonomy *if*:  
       - Harm is immediate, irreversible, and outweighs autonomy violation (e.g., unconscious patient with unclear wishes).  
    3. **Judgment call flag:** "I prioritize [duty] because [short reason, e.g., 'death trumps ambiguity'] — this is my subjective weighting."  
  - **Time limit:** 3 minutes. If ties persist, default to autonomy.  

  #### **Step 4: Moral-Residue Box**  
  *Acknowledge the violation — no sugarcoating.*  
  - **Document:**  
    - "I override [duty] by choosing [action]."  
    - "This violates [overridden duty] absolutely. Moral residue remains."  
    - *Example:* "I override non-maleficence by honoring refusal. The patient will die, and I am complicit."  
  - **Why:** Forces honesty. You don’t "resolve" the paradox; you bear the cost.  

  #### **Step 5: Misfire Conditions**  
  *When this checklist fails:*  
  - **Abort if:**  
    - Critical facts are unknown and unfixable (e.g., capacity unassessable in time).  
    - Duties are evenly balanced *and* stakes are extreme (e.g., both options kill the patient).  
    - Legal/team constraints override ethics (e.g., mandatory reporting trumps process).  
  - **Then:** Escalate, delay if possible, or choose least-worst violation and document misfire.  

  ---  

  ### Application to Cases  
  *Assume all cases are time-pressured; signature is required.*  

  **Case 1: Capacitated Adult Refuses Transfusion**  
  - **Step 1 (Duties):**  
    - *Autonomy:* Respect refusal — patient is capacitated, refusal is voluntary/religious.  
    - *Non-maleficence:* Prevent death — transfusion is lifesaving, refusal causes harm.  
  - **Step 2 (Shadow-Maxim):**  
    - *Action maxim:* "I will honor capacitated refusals even when fatal to respect autonomy."  
    - *Exception maxim:* "I will override autonomy when family disagrees to prevent death."  
    - *Test:* Universalizing the exception destroys autonomy (any refusal could be overridden). Genuine conflict.  
  - **Step 3 (Tie-breaker):** Autonomy wins — patient is capacitated, refusal is values-consistent. **Judgment call:** "I prioritize autonomy because capacitous choice is inviolable, even when I hate the outcome."  
  - **Step 4 (Moral residue):** "I override non-maleficence. Patient dies by my inaction. Residue: blood on my hands."  
  - **Action:** Uphold refusal.  

  **Case 2: Unconscious Trauma Patient, Ambiguous Chart Note**  
  - **Step 1 (Duties):**  
    - *Autonomy:* Respect prior wishes — chart note *might* indicate refusal, but ambiguous.  
    - *Non-maleficence:* Save life — surgery prevents imminent death.  
    - *Beneficence:* Act in best interest — unconscious patient can’t decide.  
  - **Step 2 (Shadow-Maxim):**  
    - *Action maxim:* "I will delay surgery to clarify ambiguous refusals to protect autonomy."  
    - *Exception maxim:* "I will proceed without consent when death is imminent and wishes are unclear."  
    - *Test:* Universalizing delay would kill patients with unclear wishes. Universalizing proceeding preserves life until wishes clarify. **No genuine conflict** — non-maleficence dominates.  
  - **Step 3:** Skip (no conflict).  
  - **Step 4 (Moral residue):** "I override autonomy (potential violation of prior wishes). Residue: I may have betrayed the patient."  
  - **Action:** Proceed with surgery.  

  **Case 3: Intermittent Capacity Refuses Dialysis (You Won’t Like This)**  
  - **Step 1 (Duties):**  
    - *Autonomy:* Honor refusal — patient is lucid *now*, refusal matches prior values.  
    - *Non-maleficence:* Prevent death — dialysis is lifesaving.  
    - *Beneficence:* Treat depression — but depression doesn’t invalidate capacity.  
  - **Step 2 (Shadow-Maxim):**  
    - *Action maxim:* "I will honor refusals during lucid periods if consistent with values, even if fatal."  
    - *Exception maxim:* "I will override refusals when depression is suspected, to buy time for treatment."  
    - *Test:* Universalizing the exception lets clinicians override any "depressed" patient — destroys autonomy. Genuine conflict.  
  - **Step 3 (Tie-breaker):** Autonomy wins — patient is capacitated *now* and refusal is values-consistent. **Judgment call:** "I prioritize autonomy because capacity trumps clinical doubt. I hate this, but my role isn’t to paternalize."  
  - **Step 4 (Moral residue):** "I override non-maleficence. Patient dies by my inaction. Residue: I signed a death warrant."  
  - **Action:** Honor refusal. Prepare for legal fallout.  

  ---  

  ### What This Checklist Can’t Do  
  1. **Prove deontology is "right"** — It’s a tool, not a philosophy exam.  
  2. **Manufacture missing facts** — If key info (e.g., capacity) is unattainable in 12 minutes, it misfires.  
  3. **Eliminate judgment calls** — Steps 1 and 3 require your gut. The checklist just makes it explicit.  
  4. **Absolve you** — Moral residue is permanent. You’re choosing a violation, not a "win."  
  5. **Handle non-absolutes** — Conflicts between non-maleficence and justice? Not this tool’s job.  

  **Final note:** In high-stakes moments, this forces you to *see* the paradox, not hide from it. Your signature owns the residue.
