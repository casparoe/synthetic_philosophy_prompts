  ## The Manual Considers Itself

  This book pretends it charts a stable **kind**,  
  A static grid. Instead, it starts a **loop**:  
  A fresh inscription, sharp diagnostic **label**,  
  Alters the flesh, reframes the troubled **behavior**.  
  The subject reads themselves within the **clinic**'s light,  
  And learns to fit the contours of its **world**.

  The symptoms shift to match the manual's **world**,  
  Redrawing what it means to be this **kind**.  
  New gestures bloom inside the sterile **clinic**,  
  A self-fulfilling, tightening feedback **loop**.  
  The diagnosis sculpts the lived **behavior**,  
  Confirmed beneath the weight of its own **label**.

  No neutral stamp, this clinical **label**  
  Reaches beyond the consulting room to **world**,  
  Reshaping how society sees that **behavior**,  
  Solidifying what defines the troubled **kind**.  
  The classified enact the scripted **loop**,  
  Performing for the gaze inside the **clinic**.

  Observations made within the busy **clinic**  
  Record the shift beneath the given **label**.  
  The data feeds the tightening, complex **loop**:  
  "See how they fit?" it asks the watching **world**.  
  The manual notes a change within the **kind**,  
  New patterns born from the expected **behavior**.

  It wasn't *just* like this, that **behavior**;  
  The classification *made* it, here, **clinic**-bound.  
  The committee meets, pens revisions for the **kind**,  
  Adjusting thresholds for the swollen **label**.  
  This update ripples through the waiting **world**,  
  A fresh twist in the ever-turning **loop**.

  The spiral spins: Revision drives the **loop**,  
  New criteria alter future **behavior**,  
  Widening the net within the anxious **world**.  
  The power hums behind the **clinic** door –  
  Not just to name, but *make* through printed **label**  
  The very flesh it claims to chart as **kind**.

  *
  Inside the **loop**, the **clinic** shapes the **world**,  
  Revising **kind**, its **label** guides **behavior**:  
  The psychiatrists, revising, change their *own* **behavior** – caught inside the **kind**.
