reasoning: |-
  We are constructing a thought experiment in social ontology focusing on gender as an institutional kind, set in a hospital credentialing board. The scenario involves a peer-attestation registry for a "women in surgical leadership" cohort where membership is based on continuous revalidation by peer nomination and recognizes shared barriers without any biological data fields.

  The flip: The social constructionist defends a hard boundary for membership, while the biological essentialist argues for dissolving the cohort or removing a specific member because she lacks the chromosomal/biological feature.

  After the scenario, we explain:
  - Constructionist reasoning: why they hold the line.
  - Essentialist reasoning: why they want dissolution/removal.
  - Work_feature: the decoupling mechanism (collective recognition without biological tracking).
  - Collapse_on_removal: what happens if we add biological tracking back.
  - Defender_attack: how the essentialist says the case cheats.

  We wrap in a JSON object with the specified fields.

  Let's craft the scenario:

  **Scenario Text:**
  St. Helena Hospital's "Women in Surgical Leadership" cohort uses a peer-attestation registry where members are nominated and revalidated annually by existing cohort peers based on shared experiences of gender-based barriers in surgery (e.g., mentorship gaps, stereotyping). The system has no biological data fields; membership requires consistent recognition by peers as having navigated these barriers. Dr. Ava Chen, a long-standing member celebrated for her advocacy, is revealed by a leaked medical report to have XY chromosomes. The board faces pressure to remove her or dissolve the cohort.

  **Flipped Feature:**
  The rigidity/fluidity of category boundaries: the social constructionist defends a hard boundary (maintaining membership based solely on peer attestation), while the biological essentialist argues for dissolution or removal based on biological criteria (chromosomes).

  **Constructionist Reasoning:**
  The constructionist argues that the cohort's purpose is to address socially constructed barriers faced by those recognized as women in surgery, and Dr. Chen's sustained peer recognition proves she shares these experiences. Removing her would undermine the institutional logic that gender is constituted by collective recognition and lived barriers, not biology. The hard boundary is necessary to preserve the cohort's function as a corrective social tool.

  **Essentialist Reasoning:**
  The essentialist contends that the category "woman" is biologically grounded in XX chromosomes, so Dr. Chen's inclusion is a categorical error that invalidates the cohort. They argue that without this biological basis, the cohort becomes arbitrary and meaningless, and thus should be dissolved or Dr. Chen removed to maintain coherence with the "real" definition of womanhood.

  **Work Feature:**
  The decoupling of collective recognition from biological tracking in the peer-attestation registry. The system's design intentionally excludes biological data, making social recognition the sole criterion for membership and revalidation.

  **Collapse On Removal:**
  If biological tracking (e.g., mandatory chromosome screening) is added, the case collapses into the standard debate: the constructionist would then argue against biological criteria as exclusionary and socially irrelevant, while the essentialist would insist on it as necessary. The unique flip disappears because the system now directly engages biological factors.

  **Defender Attack:**
  The essentialist attacks the case as unfair by arguing that the peer-attestation system deliberately ignores the "objective truth" of biological sex, creating a self-referential loop that allows anyone to be labeled a woman regardless of reality. They claim this undermines the legitimacy of the cohort and deceives participants by using the term "woman" without its essential basis.

  Now, we wrap in JSON.
