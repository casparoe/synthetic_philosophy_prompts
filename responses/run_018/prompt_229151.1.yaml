prompt: |-
  I'm in a reading group on decision theory and last week a friend of mine (he did a master's in economics, so he's not clueless, but he does like to sound authoritative) gave us this rundown of Aumann's "agreeing to disagree" result, and I want to sanity-check it before I repeat any of it in front of the group. His version went roughly like this: Aumann proved that two rational agents with the same prior beliefs cannot disagree — if both are Bayesians and they update on the same evidence, their posteriors must coincide, so persistent disagreement between rational people is simply impossible. He then said that the requirement of "common knowledge" in the theorem just means that both agents know each other's estimates, i.e. that they've told each other what they believe, and that once that's happened the theorem forces them to agree immediately. Finally, he drew the moral that this is why trade between rational agents can't happen: since any offer to bet reveals information, two rational agents could never both willingly take opposite sides of a bet, so speculative markets are, strictly speaking, populated by irrational people.

  Now, a few things here smell off to me. I thought the theorem was about common knowledge of the posteriors themselves, not about agents receiving the same evidence — those seem like pretty different conditions. And I have a vague memory that there's a difference between everyone knowing something and it being common knowledge that matters a lot here, which his gloss seems to flatten. The bit about markets also feels like an overreach dressed up as a corollary. But he's normally reliable, and the basic thrust — common priors plus common knowledge of posteriors implies agreement — I do think is right.

  So: is his summary fair? Please go through it claim by claim and separate what is accurate, what is a defensible simplification, and what is actually wrong or conflated. In particular I'd like to know whether the conclusions he draws (disagreement is impossible, trade is impossible) survive once the summary is corrected, and what a careful statement of the theorem and its actual limits would look like. Also, if he's muddled together two different results anywhere, tell me which ones. Please answer in British English.
reasoning: |-
  Alright, let me tackle this user's query step by step. They're in a decision theory reading group and their friend presented Aumann's agreement theorem with some claims that feel off. The user wants a sanity check before discussing it in the group.

  First, I need to recall the exact statement of Aumann's theorem. The core is that with common priors and common knowledge of posteriors, posteriors must be equal. The friend mentioned "same evidence" but the theorem actually deals with common knowledge of beliefs, not necessarily identical evidence. That's a red flag. 

  The user is confused about common knowledge versus mutual knowledge. Their friend simplified it to just sharing beliefs, but common knowledge is stronger—it's an infinite hierarchy of "I know that you know that I know..." That distinction is crucial. The user's instinct here is spot on.

  The trade impossibility claim seems like a stretch. Aumann's theorem doesn't directly address markets. While there are related results like no-trade theorems, they require additional assumptions beyond the agreement theorem. The friend's oversimplification could mislead the group.

  I should break down each claim: the prior requirement (correct), the evidence conflation (wrong), common knowledge simplification (misleading), and the trade conclusion (overreach). Pointing out Milgrom-Stokey as the actual no-trade theorem reference would help.

  The user needs clarity on what parts are defensible simplifications versus outright errors. Emphasizing that disagreement is possible without common knowledge of posteriors, and that trade can happen under asymmetric information, will correct the misconceptions. They'll want precise distinctions to present authoritatively in their group.
answer: |-
  Right then, let's break down your friend's summary of Aumann's agreement theorem with a critical eye. His enthusiasm is understandable, but several points are substantially off the mark or conflate different concepts. Here's a claim-by-claim assessment in British English:

  **Claim 1: "Two rational agents with the same prior beliefs cannot disagree."**
  *   **Accuracy:** **Misleading/Incorrect.** This is far too strong. Aumann's theorem applies *only under very specific conditions*. Rational agents with the same priors *can* and *do* disagree routinely, precisely *because* they typically have different private information or haven't achieved the state of "common knowledge" required by the theorem. The theorem doesn't outlaw disagreement in general; it dictates when disagreement *cannot persist* under specific idealised conditions.

  **Claim 2: "If both are Bayesians and they update on the same evidence, their posteriors must coincide."**
  *   **Accuracy:** **Incorrect.** This conflates "same evidence" with "common knowledge of posteriors." They are fundamentally different.
      *   "Same evidence" usually means the agents observe identical data points or signals. However, even with identical *raw* evidence, if they interpret it differently based on different background models (which the prior *might* encompass, but often doesn't fully), posteriors *can* differ.
      *   More crucially, Aumann's theorem doesn't require agents to *see* the same evidence at all. They can have entirely different private information partitions. The key requirement is **common knowledge** of their *posterior probabilities* concerning a specific event *after* they've processed whatever information they have (private or public). It's about them knowing each other's *final belief estimates* for the event in question, not necessarily how they arrived at them. Agents can have wildly different information sets but still be forced to agree *if* their differing posteriors become common knowledge.

  **Claim 3: "Persistent disagreement between rational people is simply impossible."**
  *   **Accuracy:** **False.** Persistent disagreement is not only possible but ubiquitous in the real world. Aumann's theorem shows it's impossible *only* under the highly restrictive conditions of:
      1.  Common Priors (a strong and often unrealistic assumption).
      2.  Common Knowledge of Posteriors (an extremely demanding epistemic state).
      3.  Perfect Bayesian Rationality.
      Remove or weaken any of these (especially 1 or 2), and disagreement is perfectly rational and expected.

  **Claim 4: "The requirement of 'common knowledge' just means that both agents know each other's estimates, i.e., that they've told each other what they believe."**
  *   **Accuracy:** **Significantly Inaccurate.**
      *   **Mutual Knowledge vs. Common Knowledge:** Telling each other what you believe establishes **mutual knowledge** (A knows B's posterior, B knows A's posterior). This is *necessary* but **not sufficient** for common knowledge.
      *   **Common Knowledge** requires not just that A knows B's posterior and B knows A's posterior, but also that **A knows *that* B knows A's posterior**, **B knows *that* A knows B's posterior**, **A knows *that* B knows *that* A knows B's posterior**, and so on, ad infinitum. It's an infinite, recursive hierarchy of knowledge.
      *   **The Crucial Point:** Mutual knowledge (sharing beliefs) can, and often does, *lead* to agreement *without* needing the full infinite regress of common knowledge. However, Aumann's *theorem itself* formally relies on the *assumption* of common knowledge to derive the *necessity* of agreement. Your friend flattens this critical distinction. In practice, simply sharing beliefs often *causes* convergence, but the theorem's formal power comes from the common knowledge requirement.

  **Claim 5: "Once that's happened (told each other beliefs), the theorem forces them to agree immediately."**
  *   **Accuracy:** **Defensible Simplification (with caveats).**
      *   If they *merely* tell each other their beliefs once (achieving mutual knowledge), the theorem doesn't *formally* force immediate agreement because common knowledge isn't yet established.
      *   **However,** in many simple models and intuitively, if two rational agents with common priors announce their posteriors to each other, they realise there's disagreement. Each then treats the other's announced posterior as new information and updates again. This process often (but not always, depending on the information structure) converges to agreement *very rapidly*, sometimes in one step ("immediately"). So, while strictly speaking the theorem requires the stronger common knowledge, the *practical outcome* of announcing beliefs often aligns with your friend's description. Calling it "immediately" is a slight simplification of the potential dynamics, but captures the gist of the convergence process triggered by sharing.

  **Claim 6: "This is why trade between rational agents can't happen: since any offer to bet reveals information, two rational agents could never both willingly take opposite sides of a bet."**
  *   **Accuracy:** **Overreach / Conflation with a Different Result.**
      *   **Aumann's Theorem ≠ No-Trade Theorems:** Aumann's theorem is about agreement on beliefs. The impossibility of speculative trade (betting) under common knowledge and common priors is the subject of **No-Trade Theorems** (like those by Milgrom and Stokey). These are distinct, though closely related, results.
      *   **The Conflation:** Your friend is trying to derive the no-trade result directly from Aumann's agreement theorem. While the intuition is connected (common knowledge + common priors removes the "meeting of minds" necessary for trade where both think they benefit), it's not a direct corollary.
      *   **The Actual No-Trade Logic:** The core argument (simplified) is: If two rational agents with common priors have common knowledge that they are about to trade a bet (i.e., common knowledge that A wants to buy, B wants to sell, at price P), then *each infers the other must have information they don't possess that makes the trade favourable to the other party*. This makes them both reassess the value of the bet based on this inference. Under common priors and common knowledge of rationality and the willingness to trade, this reassessment should lead them to *not* value the bet differently at the proposed price P anymore – the very basis for the mutually agreeable trade disappears. Why would A buy if he infers B's willingness to sell means B knows something bad? Why would B sell if he infers A's willingness to buy means A knows something good?
      *   **Reality Check:** Like Aumann's theorem, no-trade theorems rely on extremely strong assumptions (common priors, common knowledge of rationality *and* of the trade opportunity itself). In the real world, trade thrives because these assumptions are violated: agents have different priors/models, common knowledge is rarely achieved perfectly, and markets facilitate trade *before* full revelation occurs. Rational agents *do* trade because they genuinely hold different beliefs based on different information *and* they don't achieve the state of common knowledge that would unravel the trade.

  **Summary of Corrections & Careful Statement:**

  1.  **Accurate Core (Simplified):** Rational agents with identical prior beliefs *cannot agree to disagree* **if** it is *common knowledge* what their posterior beliefs about a specific event are. Sharing beliefs (mutual knowledge) often *leads* to convergence in practice.
  2.  **Inaccurate/Conflated Elements:**
      *   "Same evidence" is *not* required; agents can have different private information.
      *   "Common knowledge" is *much stronger* than just knowing each other's beliefs (mutual knowledge); it requires the infinite recursion.
      *   Disagreement is *not* impossible for rational agents; it's impossible *only* under the theorem's specific, demanding conditions.
      *   The impossibility of trade is a *related but distinct result* (No-Trade Theorems), not a direct corollary of Aumann's theorem. Trade impossibility requires common knowledge *of the trade opportunity itself*, not just of beliefs.
  3.  **Do the Conclusions Survive Correction?**
      *   **Disagreement Impossible?** **No.** Only impossible under the highly restrictive conditions of the theorem. Persistent disagreement is rational and common otherwise.
      *   **Trade Impossible?** **No.** Only impossible under the even more restrictive conditions of no-trade theorems (common priors + common knowledge of rationality *and* the trade). Trade is fundamental to markets precisely because these conditions are usually unmet.
  4.  **Careful Statement of Aumann's Agreement Theorem:**
      "Aumann's (1976) agreement theorem states that if two (or more) Bayesian rational agents share a common prior belief over a state space, and their posterior probabilities for a given event are common knowledge, then those posterior probabilities must be equal. The agents can have different private information, but the common knowledge condition requires that each agent knows the other's posterior, knows that the other knows their posterior, and so on ad infinitum."

  **What He Muddled:**
  He significantly muddled:
  1.  **"Same Evidence" vs. "Common Knowledge of Posteriors":** These are distinct concepts.
  2.  **Mutual Knowledge vs. Common Knowledge:** Announcing beliefs gives mutual knowledge; common knowledge is far stronger.
  3.  **Aumann's Agreement Theorem vs. No-Trade Theorems:** While both exploit common knowledge and common priors, they address different phenomena (belief agreement vs. trade impossibility) and the no-trade theorems require an additional layer of common knowledge (about the trade).

  **In short:** Your scepticism was well-founded. His summary contained a defensible core intuition ("sharing beliefs forces agreement under common priors") but was packaged with significant inaccuracies and conflations, particularly regarding "same evidence," the true meaning of "common knowledge," and the leap to trade impossibility. The real power *and limitation* of Aumann's theorem lie in the extraordinarily demanding nature of the "common knowledge" assumption.
