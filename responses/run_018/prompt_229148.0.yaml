  | **Preferential Social Benefits** | Strong associative duties of mutual support and distributive justice exist among compatriots; citizenship creates a claim on the collective resources. | **Division of Labor:** Efficient fulfillment of universal duties within bounded units; enables robust welfare states. **Weak Coercion:** Compensation for lifelong subjection to state power (taxes, laws). | **Thoroughgoing Cosmopolitanism** (re: distributive justice - denies intrinsic partiality) | **Highly Suggestive of Associative Duties.** Compatible with division-of-labour justification. Less compatible with pure coercion (residents also coerced). |
