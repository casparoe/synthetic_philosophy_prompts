  ## The Paradox of Particularism: Untangling Special Obligations in Modern State Practice

  Modern states navigate a profound tension. They routinely engage in practices that privilege citizens over non-citizens: restricting the franchise to citizens alone, allocating social benefits preferentially to compatriots, and asserting the right to control immigration. Simultaneously, they ratify human rights instruments proclaiming the equal moral worth of all persons and condemn discriminatory distinctions among their *own* citizens. This cluster of practices presupposes a specific, albeit often implicit, account of special obligations among compatriots, distinct from universal duties owed to humanity. The central question is whether this presupposition is fundamentally associative (grounded in the shared identity of citizenship itself) or if it can be coherently reconstructed on universalist grounds, such as a division of moral labor or compensation for state coercion.

  **Apparent Presupposition and Associative Duties**
  The most straightforward reading points towards **associative duties based on shared citizenship**. Franchise restriction implies that the right to shape the collective future is intrinsically tied to membership in the political community ("the people"), not mere subjection to its laws or contribution via taxes. Preferential allocation of social benefits (e.g., welfare, healthcare, pensions) suggests a deep obligation of mutual support and distributive justice *within* the national community, akin to familial obligations scaled up. Immigration control asserts the primacy of the existing citizenry's interests (economic, cultural, security) in determining who joins the community, reinforcing the boundary of the associative group. These practices collectively signal that citizenship is not merely a legal status but a constitutive relationship generating special, weighty obligations of inclusion, support, and collective self-determination. This view aligns strongly with **nationality-based partialism**, which holds that shared national identity (often intertwined with citizenship) creates morally significant associative duties.

  **Universalist Reconstructions: Can the Practices Be Saved?**
  However, states often justify these practices using language suggesting universalist foundations, attempting to square the circle with their human rights commitments:

  1.  **Division of Moral Labor (Functionalist Universalism):** States could argue that restricting the franchise ensures that those most affected by and permanently invested in a polity's long-term decisions (citizens) hold the power, promoting stable and effective governance *for the benefit of all within the jurisdiction*. Preferential benefits might be framed as a necessary feature of a bounded welfare state – universal duties are fulfilled *indirectly* by each state prioritizing its own members within a global system of states, ensuring basic needs are met somewhere efficiently. Immigration control could be justified as necessary to preserve the stability and resources required to fulfill the state's primary duty to its citizens *and* residents, preventing system overload that would harm everyone, including future immigrants. This view leans towards a **moderate cosmopolitanism** or **institutionalist** view, where bounded states are the most effective, though imperfect, instruments for fulfilling universal duties.
  2.  **Compensation for Coercion (Reciprocity Universalism):** The franchise could be seen as a necessary counterweight to the unique coercive power the state exercises over its *subjects* (citizens *and* residents). However, since the state coercively imposes its will primarily on residents within its territory (laws, taxes), restricting the vote *only* to citizens undermines this logic. Preferential benefits fare somewhat better: citizens, subjected to the state's coercive apparatus (taxation, conscription, pervasive regulation) over their lifetimes, might be owed compensatory support. Immigration control could be framed as regulating the *scope* of the coercive community – deciding who will be subjected to the state's unique coercive power and share in the burdens and benefits it entails. This view aligns with **coercion-based accounts** of political obligation, though it struggles with the franchise restriction excluding long-term resident subjects.

  **Rival Views Ruled Out and Areas of Underdetermination**

  *   **Franchise Restriction:** **Rules out Thoroughgoing Cosmopolitanism** regarding political rights. If moral worth is truly equal and residence/subjection create primary obligations, denying the vote to long-term resident taxpayers is hard to justify on universalist grounds alone. It's **compatible with** both associative duties (citizenship = membership) and weak coercion/functionalist arguments (citizens = permanent stakeholders), though it **strains strong coercion-based accounts** (why exclude subjected residents?).
  *   **Preferential Social Benefits:** **Rules out Thoroughgoing Cosmopolitanism** regarding distributive justice. Equal moral worth alone cannot justify systematically favoring citizens if non-citizen residents are equally needy and subject to the same system. It is **strongly suggestive of associative duties** but **compatible with** a division-of-labor justification (each state cares for "its own") or a weak coercion-compensation argument (citizens bear the lifelong burden). It's **less compatible with pure coercion accounts**, as residents are also coerced.
  *   **Immigration Control:** **Rules out Cosmopolitan Open Borders**, which sees borders as inherently unjust barriers violating equal moral worth and freedom of movement. It is **compatible with** associative duties (protecting the community), division of labor (maintaining bounded units), and coercion-based accounts (controlling who enters the coercive scheme). However, the *degree* and *criteria* for control are highly **underdetermined**, licensing everything from nationalist exclusion to relatively open policies justified by functional needs or global justice duties.

  **Consistency and Consequences of Replacement**

  The practices exhibit a **fundamental inconsistency** when juxtaposed with universal human rights commitments. The human rights rhetoric emphasizes *equal* worth and condemns *arbitrary* discrimination. Yet, the state practices rely on a distinction (citizen/non-citizen) that, while legally significant, appears morally arbitrary from a universalist standpoint – especially concerning long-term residents. The state implicitly treats citizenship as a source of *intrinsic* moral significance for special obligations, conflicting with the idea that distinctions must be justified by relevant reasons applicable to all humans.

  **If the associative account were replaced:**
  1.  **With Thoroughgoing Cosmopolitanism:** States would need to dismantle core practices. Franchise would extend to all permanent residents. Social benefits would be allocated based solely on need/residence, not citizenship. Immigration controls would weaken significantly, perhaps moving towards open borders or global allocation schemes.
  2.  **With a Strong Division-of-Labor Universalism:** Practices might remain structurally similar but require stronger justification. Preferential benefits would need proof of global efficiency gains. Immigration control would require demonstrating that restrictions are truly necessary for the state to effectively fulfill its core welfare functions for those within its jurisdiction, and potentially require robust global redistribution to compensate.
  3.  **With a Coercion-Based Account:** Practices would shift significantly. Franchise would likely extend to all subjected residents. Benefits might prioritize residents subjected to coercion. Immigration control would focus on regulating entry into the coercive framework, potentially with stronger due process rights for those affected.

  **Conclusion**

  The cluster of state practices – franchise restriction, preferential benefits, immigration control – overwhelmingly **presupposes associative duties grounded in shared citizenship**. While functionalist (division of labor) or reciprocity (coercion) arguments offer potential universalist reconstructions, these are strained, particularly concerning franchise denial to long-term residents and the arbitrariness of the citizen/non-citizen line from a universal perspective. The practices strictly rule out thoroughgoing cosmopolitanism regarding political rights and distributive justice, and cosmopolitan open borders. The tension with universal human rights commitments reveals an inconsistency: the state relies on citizenship as a source of intrinsic moral partiality while simultaneously endorsing the principle of equal moral worth. Reconciling this tension requires either abandoning the universalist rhetoric, significantly reforming the practices, or developing a far more robust and convincing universalist justification for bounded citizenship than currently exists in state practice.

