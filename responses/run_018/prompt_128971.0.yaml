prompt: |-
  I've been organizing a small philosophy discussion group—mostly people who come from rationalist forums and have read the usual canon of Parfit and Bostrom plus some basic Rawls, but no formal bioethics training—and next month we're tackling procreative beneficence together with the liberal eugenics framing. I volunteered to lead the session, but I don't want you to explain the view to me; I need a teaching plan for the explanation itself. Specifically, what is the exact dependency order in which the conceptual pieces have to land? For instance, does the non-identity problem need to be fully in place before the obligation can even be formulated, or does introducing it too early kill the intuition that parents are making a meaningful selection? I want one carrying example to build the session around, and I'm inclined to avoid the overused deafness-versus-hearing case in favor of something like selecting between embryos with different polygenic risk profiles for genuinely contested traits—say, high openness to experience versus high conscientiousness. What must that example have and lack so that it doesn't collapse into either obvious ableism or trivial consumer preference? I also need a misconception map for this audience: I expect an immediate conflation of liberal eugenics with state-coerced old eugenics, and probably the assumption that "best expected life" is just subjective utility maximization wearing philosophical clothing. At which point in the sequence should I head off each misconception? Give me one concrete check—perhaps a scenario or a forced-choice question—I can pose at the end to see whether they've actually grasped the tension between parental obligation and state neutrality, rather than just parroting that parents should "choose what's best." Finally, what should I explicitly refuse to open up at this level—maybe the full formal structure of the non-identity problem, or specific genetic mechanisms—and how do I say so without sounding dismissive?
reasoning: |-
  Okay, let me unpack this user's request. They're leading a philosophy discussion group for rationalist-adjacent folks tackling procreative beneficence and liberal eugenics. They need a teaching plan, not content explanation. 

  Hmm, the core challenge is sequencing concepts correctly. The non-identity problem is tricky - if introduced too early, it might undermine the intuition of meaningful choice, but it's necessary for the obligation formulation. Maybe sandwich it after establishing baseline intuitions but before the full obligation statement.

  For the example... polygenic traits like openness vs conscientiousness is smart. But need to avoid it feeling like trivial preference or ableism. Crucial elements: the traits must be genuinely contested (no clear hierarchy), involve trade-offs, and affect well-being non-trivially while being morally neutral at extremes. Should exclude anything resembling disease states.

  The audience misconceptions are predictable. State coercion conflation and utility maximization assumptions will surface immediately. Need to pre-bait these - perhaps with a deliberately provocative state-eugenics scenario early on, then explicitly decouple it when defining liberal eugenics. For utility, force them to confront whether "best life" could include objective goods beyond preference satisfaction.

  The checkpoint must test if they grasp the state neutrality tension. A scenario where parents choose a suboptimal-but-still-decent trait combo could work - ask whether the state should intervene. If they say yes, they've missed the point.

  What to exclude? Definitely genetic mechanisms - this is ethics, not biology. Also the full non-identity formalism. Can frame it as "focusing on moral implications rather than technical details." 

  User seems highly prepared - they've identified precise pain points in teaching this. Their example choice shows they want to avoid clichés while preserving complexity. Might be slightly overestimating audience's ability to hold multiple abstractions though. Should build in more concrete anchoring than they suggest.
answer: |-
  Here’s a structured teaching plan tailored to your goals, with conceptual sequencing, a robust example, misconception handling, and a checkpoint. The focus is on *pedagogical dependency*—ensuring each idea lands before the next logically requires it.

  ---

  ### **Conceptual Dependency Order**
  *(Sequenced for intuitive scaffolding)*  
  1. **Foundational Intuition**: Start with **parental procreative choice**  
     - *Example Prompt:* "Should parents select embryos for traits likely to give a child a better life? Assume no harm to others."  
     - *Purpose:* Activates default intuition that parents *should* optimize (e.g., avoiding Tay-Sachs). Establishes baseline moral impulse.  

  2. **The Non-Identity Problem (Light Version)**  
     - *Frame it as:* "Does 'harm’ apply when the alternative child wouldn’t exist?" Use a **minimalist scenario**: Choosing between Embryo A (healthy) and Embryo B (chronic but manageable pain condition).  
     - *Crucial Restriction:* Avoid terms like "harm" or "wrongful life." Say: "Embryo B has no complaint—they only exist because of this choice."  
     - *Purpose:* Blocks "harm-based" objections *before* introducing obligations. Ensives PB isn’t misunderstood as preventing harm.  

  3. **Procreative Beneficence (PB) Formulation**  
     - *State Savulescu’s Principle:* "Parents have a moral obligation to select the child, of possible children, expected to have the best life."  
     - *Emphasize:* "Best life" ≠ subjective preference. Anchor to **objective goods** (e.g., health, opportunity, capacity for flourishing) via *widely shared values*.  

  4. **Liberal Eugenics (LE) Framework**  
     - *Define LE:* Non-state, non-coercive, pluralistic selection *enabled* by repro tech. Contrast with **state eugenics** (coercion, one "ideal," punitive).  
     - *Key Link:* PB is the *ethical foundation*; LE is the *political/implementation* framework.  

  5. **The Tension**: **PB Obligation vs. State Neutrality**  
     - *Highlight:* Parents *must* choose "best life" (PB) → but state *cannot* impose what "best" means (LE).  

  ---

  ### **Carrying Example: Polygenic Trait Selection**  
  **Scenario**: Selecting between two embryos:  
  - **Embryo X**: 85%ile predicted **conscientiousness** (lower openness, higher stability)  
  - **Embryo Y**: 85%ile predicted **openness to experience** (lower conscientiousness, higher creativity)  

  **Why this works**:  
  - **Avoids Ableism**: Neither trait is a disability; both have socially valued extremes.  
  - **Non-Trivial Trade-offs**:  
    - *Conscientiousness*: Linked to longevity, career success, but rigidity.  
    - *Openness*: Linked to creativity, resilience to boredom, but mental health risks.  
  - **Contested "Best"**: No consensus on which trait maximizes well-being (e.g., artist vs. surgeon).  
  - **PB Pressure**: Parents *must* weigh complex goods—neither choice is "neutral."  

  **Pitfalls Mitigated**:  
  - ≠ Consumer choice: PB frames selection as *moral duty*, not preference.  
  - ≠ Ableism: Traits aren’t diseases; focus on trade-offs within normal range.  

  ---

  ### **Misconception Map + Preemptive Strikes**  
  | **Misconception** | **When to Address** | **Preemptive Strategy** |  
  |-------------------|---------------------|-------------------------|  
  | "LE = State Eugenics" | Immediately after defining LE (Step 4) | **Contrast Scenario**: *"Should the state fund embryo selection for conscientiousness to boost GDP?"* → Forced "no" → Distinguishes state goals vs. parental duty. |  
  | "Best life = Subjective Utility" | During PB formulation (Step 3) | **Check Question**: *"If parents select a child with high pain tolerance because they value stoicism, is that PB?"* → No; PB uses *generalizable* well-being indicators. |  
  | "PB Requires Perfection" | During trade-offs discussion | **Clarify**: PB chooses the *best available* option, not utopian ideals. |  

  ---

  ### **Checkpoint for State Neutrality Tension**  
  **Forced-Choice Scenario**:  
  > *Parents use PGT to select Embryo Z (mildly above avg. IQ, low depression risk) over Embryo W (avg. IQ, high musical aptitude). A law bans non-medical embryo selection, calling it "unfair advantage." Should this law stand?*  

  **Key Insight Checks**:  
  - ✅ **PB Perspective**: Parents fulfilled obligation to select "best expected life."  
  - ✅ **LE Perspective**: Law violates state neutrality by imposing one view of the good.  
  - ❌ **Misstep**: Arguing about IQ vs. music *value* (misses structural tension).  

  **Success Criterion**: Participants should defend *parental selection* while rejecting *state enforcement* of traits—even if they dislike the parents’ choice.  

  ---

  ### **Explicitly Excluded Topics**  
  1. **Non-Identity Formal Structure**:  
     - *Say*: "We’re treating the non-identity problem as a *logical constraint* on harm-talk, not diving into metaphysical debates about possible persons."  
  2. **Genetic Mechanisms**:  
     - *Say*: "We’re discussing *ethical implications* of trait selection, not polygenic scoring methodology—assume the predictions are reasonably accurate for argument’s sake."  
  3. **Distributive Justice**:  
     - *Say*: "We’re bracketing societal-level effects (e.g., inequality) to focus on the parent-child obligation."  

  **Rationale**: Prevents scope creep, maintains focus on PB/LE core.  

  ---

  ### **Session Flow Outline**  
  1. **Hook (5 min)**: Poll on embryo selection for serious disease vs. "positive" traits.  
  2. **Conceptual Sequence** (25 min): Steps 1–5 above, using the conscientiousness/openness example.  
  3. **Misconception Spotting** (10 min): Pre-bait with state-funding/music-IQ scenarios.  
  4. **Checkpoint Scenario** (15 min): Small groups debate the law banning selection.  
  5. **Synthesis** (5 min): Reiterate PB/LE as *constrained* optimization: "Duty within pluralism."  

  This structure ensures the non-identity problem *enables* PB (by blocking counterarguments) without overcomplicating early intuition-building. The polygenic example forces engagement with contested goods, and the checkpoint isolates the state neutrality tension.
