  ## Animal Farm: The Manufactured Will of the People in Populist Revolution

  Orwell's *Animal Farm* serves as a devastating dramatization of the philosophical tensions surrounding populism and the "will of the people," masterfully exposing the chasm between essentialist and constructivist accounts while illustrating the inherent dangers of the aggregation problem.

  **Essentialist Fantasy vs. Constructivist Reality:**
  *   **Essentialist Mirage:** The initial Rebellion embodies the essentialist fantasy: a pre-existing, homogeneous "People" (the animals) unified by shared oppression ("All men are enemies. All animals are comrades.") and harboring a discoverable, singular will ("Beasts of England"). Their spontaneous unity against Jones suggests a latent, authentic will erupting into action. Old Major’s vision acts as the discovered blueprint for this essential will.
  *   **Constructivist Unraveling:** This unity shatters almost immediately. The debates over the windmill (Chapter 5) vividly demonstrate the constructivist reality. The "people" (animals) are *not* homogeneous. Their preferences diverge radically (Snowball's progressivism vs. Napoleon's pragmatism). There is no pre-existing, unified "animal will" on this critical issue; it must be *constructed* through debate, persuasion, and ultimately, force. The meeting itself is the site where the "people" and its "will" are being constituted – or fractured.

  **The Aggregation Problem & Manufactured Consent:**
  *   **Impossible Aggregation:** The windmill debate starkly poses the aggregation problem. Even assuming sincere preferences (Snowball's detailed plans, Napoleon's skepticism, the sheep's bleating, the hens' confusion, Boxer's desire to work harder), there is no neutral algorithm to combine them into a single "popular will." Simple majority vote? Napoleon undermines it. Deliberative consensus? Snowball attempts it, but is silenced. The problem is insoluble without arbitrariness or manipulation.
  *   **Manufacturing the Will:** Napoleon solves the aggregation problem not by aggregating, but by *manufacturing*. He seizes control of the mechanisms:
      *   **Assembly:** Meetings are canceled, then resumed only for show. The Sunday-morning debates, the crucial space for constructing a collective will, are abolished.
      *   **Discourse:** Squealer's sophistry and the sheep's interruptions control language and drown out dissent. The maxims ("Four legs good, two legs bad," later modified) become tools of simplification and thought-termination.
      *   **Rules & History:** The incremental rewriting of the Seven Commandments retroactively constructs the pigs' actions as *always* aligned with the "true" will of Animal Farm. The original commandments, meant to embody the essential will discovered by Old Major, are constantly reconstructed to serve the pigs' current needs. The past "will" is literally rewritten.
      *   **Violence & Fear:** Napoleon's dogs provide the ultimate enforcement, making dissent physically impossible and rendering the *appearance* of unity (through fear) a substitute for actual aggregated will.

  **Boxer: The Peril of Mistaking the Constructed for the Essential:**
  Boxer embodies the catastrophic danger of treating a constructed, manufactured "will" as a natural, essential one. His progressive reduction of political thought to loyalty slogans ("Napoleon is always right," "I will work harder") illustrates the surrender of critical judgment. He sincerely believes his maxims reflect the true essence of Animalism and the farm's collective good. By internalizing the pigs' constructed narrative as an inherent truth, Boxer becomes the perfect subject of the manufactured will – working himself to death for a cause he believes is his own, but which has been crafted to exploit him.

  **Orwell, Rousseau, and the "Will":**
  The novella ruthlessly satirizes the Rousseauian distinction:
  *   **The General Will ("Correct in Principle"):** Old Major's vision represents this ideal – an abstract, correct will for true animal equality and freedom, discoverable through reason against exploitation.
  *   **The Actual Will ("Systematically Distorted"):** The pigs, especially Napoleon and Squealer, systematically distort the animals' actual preferences and understanding. They exploit ignorance (the sheep), loyalty (Boxer), fear (the dogs), and linguistic manipulation to create an "actual will" that serves only the pigs. Orwell shows there is *no* reliable mechanism within the pigs' system to access or express the "general will"; it is perpetually overwhelmed and replaced by the distorted actual will manufactured by the powerful.

  **Narrative Form: The Power of Erosion and Retroactive Creation:**
  Analytic treatments of representation and aggregation often struggle to capture the *temporal* and *experiential* dimension of how populist will is constructed. Orwell's narrative form is essential here:
  1.  **Incremental Erosion:** Showing the slow, step-by-step process – the canceled debates, the stolen milk, the rewritten commandments, the erased protests – makes tangible how collective agency is *eroded*, not abolished in one act. This gradual decay is far more insidious and revealing than a static analysis.
  2.  **Linguistic Corruption:** The narrative vividly depicts how language itself is weaponized ("readjustment" instead of "reduction," "readoption" of abolished traditions). This corruption isn't just distortion; it actively *reshapes* the animals' perception of reality and their own desires, demonstrating how representation constructs the subject it claims to represent.
  3.  **Retroactive Creation:** The narrative shows how Napoleon/Squealer constantly rewrite history *and* the foundational rules. This act isn't merely lying; it's retroactively *creating* the "people" whose "will" they now claim to embody. The animals of the present are constantly told that the *past* animals (or their own past selves) always willed what the pigs are doing *now*. Representation doesn't express the people; it actively *defines* who the "true" people were and what they "truly" wanted.

  **Faithful Synthesis: What the Narrative Reveals**
  *Animal Farm* is not merely an illustration of democratic theory failings, nor should philosophical concepts be bent to fit its allegory. Instead, the work uniquely reveals:

  1.  **The Seduction and Danger of Essentialism:** The initial Rebellion's apparent unity is seductive but fundamentally misleading. The narrative shows how easily the *claim* of speaking for a pre-existing, essential "People" becomes a tool of tyranny, suppressing actual diversity and dissent.
  2.  **The Inevitability of Construction (and Manipulation):** It demonstrates that in any complex society, a "popular will" is *always* constructed through processes of representation, language, and procedure. The crucial question is *who controls those processes* and for *whose benefit*.
  3.  **The Embodied Cost of Manufactured Consent:** Through figures like Boxer and the confessions of the purged animals, the narrative gives visceral, emotional weight to the human (or animal) cost of mistaking manufactured loyalty for genuine popular will. It shows the *lived experience* of having one's reality and will rewritten.
  4.  **The Power of Narrative Time:** Argument alone struggles to convey the corrosive power of incremental change and historical revisionism. Orwell’s narrative shows how a "people" and its "will" are not static entities but are constantly being redefined *in time* by those who control the story. The pigs don't just distort the will; they constantly *recreate* the past people whose will they claim to inherit.

  Ultimately, *Animal Farm* reveals that the "will of the people," particularly in revolutionary populism, is less a discovered essence or an aggregate of preferences, and far more often a potent *fiction*, painstakingly manufactured and violently enforced by those who seize the tools of representation, language, and history. The tragedy lies not just in the pigs' betrayal, but in how effectively they convince the animals that the fiction *is* their own essential, natural will. This profound insight into the relationship between power, language, and identity is something pure philosophical argument can outline, but which narrative, in its depiction of lived experience and temporal erosion, makes devastatingly concrete.
