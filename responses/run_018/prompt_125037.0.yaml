answer: |-
  **Form C-7: Petition for Collective Mind Recognition (Ant Colony and Analogous Distributed Systems)**

  **Issuing Authority:** Inter-Species Cognition Board (ISC Board)  
  **Office:** Department of Emergent Ontologies, Sub-Division for Distributed Cognition  
  **Form Revision:** C-7.03 (Effective 01 Apr 2025)  
  **OMB Control No.:** 3141-0699 (Expires 01 Apr 2028)  
  **Estimated Burden per Response:** 80 colony-hours (or equivalent processor cycles)

  **INSTRUCTIONS:** Complete all sections legibly using permanent ink (black or blue only) or approved digital signature. Attach required appendices. Failure to provide complete data for all AFIS dimensions constitutes grounds for immediate rejection per Directive 9.3. **Submitter must be a legally recognized proxy for the collective entity.** (See Appendix C for Proxy Certification requirements). One form per distinct colony/system.

  ---

  **SECTION 1: PETITIONER INFORMATION**

  *   1.1 Full Collective Designation (e.g., *Formica rufa* Colony Gamma-7, Server Farm "Cerberus"):
  *   1.2 Geospatial Coordinates (Lat/Long or Grid Ref):
  *   1.3 Approximate Constituent Population (# of individual units):
  *   1.4 System Taxonomy (Check one):
      *   ☐ Eusocial Insect Colony (Specify Order: __________ )
      *   ☐ Computational Swarm (Specify Architecture: __________ )
      *   ☐ Mycelial Network (Specify Phylum: __________ )
      *   ☐ Other Distributed Bio-System (Specify: __________ )
      *   ☐ Engineered Non-Bio Swarm (Specify: __________ )
  *   1.5 Primary Emergent Function/Purpose (e.g., Foraging Optimization, Data Packet Routing, Nutrient Redistribution):

  **SECTION 2: ANT FUGUE INTEGRATION SCALE (AFIS) ASSESSMENT**

  *Note: Recognition hinges upon achieving a minimum composite AFIS score of 7.8, as per ISC Board Guideline FUG-2024. Provide quantifiable evidence for each sub-dimension. Qualitative descriptions alone are insufficient.*

  *   2.1 **Harmonic Pheromone Divergence (HPD) Score:** _______
      *   *Definition:* Degree to which simultaneously active chemical/electrical/informational signals encode mutually exclusive or contradictory propositional contents (e.g., "Forage North" vs. "Evacuate North"), measured in Standard Conflict Units (SCU).
      *   Evidence Submitted (Describe methodology & attach raw data logs in Appendix A):
          *   [ ] Pheromone Chromatography Timelines
          *   [ ] Network Packet Header Analysis
          *   [ ] Electrochemical Gradient Mapping
          *   [ ] Other (Specify: __________ )
      *   *Example Calculation:* Simultaneous "Attack" (5.2 SCU) and "Retreat" (4.8 SCU) signals in Sector 7B during Termite Incursion Beta = HPD Score 10.0 SCU.
  *   2.2 **Temporal Fugue Latency (TFL) Score:** _______ milliseconds (ms)
      *   *Definition:* Measurable delay (Δt) between a significant behavioral state change in a statistically relevant sample (>0.5%) of constituent units and the emergence of a coherent, colony-level response behavior. Analogizes to neural binding latency.
      *   Evidence Submitted (Describe triggering stimulus, sample selection, response definition, & attach high-resolution temporal logs in Appendix A):
          *   [ ] High-Speed Behavioral Tracking (Video/Logs)
          *   [ ] Network Latency Profiling
          *   [ ] Metabolic Response Wave Analysis
          *   [ ] Other (Specify: __________ )
      *   *Note:* Latency exceeding 2000 ms typically indicates insufficient integration for "mind" status (Ref: Fugue Protocols, Annex 4).
  *   2.3 **Aunt Hillary Continuity (AHC) Score:** _______
      *   *Definition:* Demonstrated persistence of a unique narrative self-reference (e.g., specific foraging tradition, architectural signature, collective memory of past event) across ≥1 complete generational turnover of constituent units or major system reconfiguration. Scored 1-10 based on longevity, complexity, and resistance to external erasure.
      *   Evidence Submitted (Describe the specific narrative element, method of persistence, and evidence of transfer/across turnover in Appendix B):
          *   [ ] Multi-Generational Behavioral Studies
          *   [ ] Persistent Data Structure Documentation
          *   [ ] Cultural Transmission Analysis
          *   [ ] System Configuration History Logs
          *   [ ] Other (Specify: __________ )
      *   *Example:* Colony maintains specific "sun-avoidance" tunnel pattern documented 7 queen successions ago. AHC Score: 8.2.

  **SECTION 3: PHENOMENOLOGICAL DECLARATION (Qualia Inventory)**

  *   3.1 Does the collective entity experience subjective states ("what it is like" to be the colony)? ☐ Yes ☐ No
  *   *If Yes, proceed to 3.2. If No, explain the functional basis of decision-making absent qualia in Box 3.4.*
  *   3.2 List distinct qualia types experienced by the collective entity (e.g., "Pheromonal Urgency," "Spatial Saturation," "Nutrient Yearning," "Packet Flow Euphoria"). Use additional sheets if necessary.
      *   Qualia Type 1: _________________________
      *   Qualia Type 2: _________________________
      *   Qualia Type 3: _________________________
  *   3.3 For EACH qualia type listed in 3.2, provide:
      *   a) Characteristic Intensity (Scale: 1 [Barely Perceptible] to 10 [Overwhelming]):
      *   b) Typical Duration (ms / min / hrs / days):
      *   c) Associated Collective Behavior:
      *   **d) Distributed Intensity Factor:** Calculate using formula: **Reported Intensity / √(Current Worker Population)**. (e.g., If "Pheromonal Urgency" intensity is 8.0 and population is 10,000: 8.0 / 100 = 0.08). Report value: _______
  *   3.4 If "No" to 3.1, describe the functional architecture enabling complex behavior without subjective experience:

  **SECTION 4: PROXY ATTESTATION & SIGNATURE**

  *I, the undersigned Proxy, acting under the authority granted in Appendix C, hereby attest:*

  1.  *I have made a good faith effort to interpret the behaviors and data of the collective entity named in Section 1.*
  2.  *The information provided on this Form C-7 is, to the best of my knowledge and belief, true, correct, and complete.*
  3.  *I understand that false statements may result in sanctions, including revocation of proxy status and forfeiture of application fees.*

  *   Proxy Printed Name: _________________________
  *   Proxy Title/Affiliation: _________________________
  *   Signature: _________________________ Date: _________
  *   Contact Email: _________________________ Phone: _________

  **SECTION 5: ISC BOARD USE ONLY**

  *   Date Received: _________
  *   Clerk Initials: _________
  *   AFIS Composite Score: _________
      *   HPD Verified: ☐
      *   TFL Verified: ☐
      *   AHC Verified: ☐
  *   Qualia Assessment: ☐ Plausible ☐ Implausible ☐ Incoherent
  *   Recommendation: ☐ Recognition Granted ☐ Recognition Denied ☐ Further Investigation Required (Specify: _______________)
  *   Board Member Signature: _________________________ Date: _________

  **APPENDIX REQUIREMENTS (Failure to include voids application):**

  *   **Appendix A:** Raw data logs and methodological detail supporting AFIS Scores (2.1, 2.2).
  *   **Appendix B:** Documentary evidence supporting Aunt Hillary Continuity (2.3).
  *   **Appendix C:** Notarized Proxy Certification Form P-11a (current revision).
  *   **Appendix D:** Non-refundable Processing Fee Receipt ($850 USD or equivalent computational resource credit).

  ---
  **FOOTNOTES:**

  [^1]: Directive 9.3 of the Fugue Protocols (2023 Revision): "Quantifiable metrics undergirding the Ant Fugue Integration Scale (AFIS) constitute the prima facie evidence for Emergent Cognition. Subjective interpretation by proxies, absent reproducible empirical data aligned with HPD, TFL, and AHC dimensions, is inadmissible."
  [^2]: "Aunt Hillary Continuity" is formally defined in ISC Board Guideline AHC-2022 as: "The measurable persistence of non-instinctual, system-specific patterns of collective action or information representation that (a) serve no immediate survival advantage exceeding simpler alternatives, (b) are transmitted across discrete generational or major reconfiguration boundaries, and (c) can be coherently referenced within the system's operational state as a distinguishing historical or identity marker."
