  Hmm, the user presents a fascinating case study at the intersection of social ontology and institutional design. As a doctoral student, they're clearly well-versed in the theoretical framework but seeking practical application to resolve a lab dispute. The core tension revolves around whether a scheduling practice qualifies as a convention in the philosophical sense, with colleagues Mara and Jonas offering competing analyses.

  The hybrid reservation system is particularly interesting - it combines transparent elements (open calendar) with opaque algorithmic mediation (shadow queue). This creates a perfect storm for convention theory debates. Mara emphasizes the arbitrary nature of the manual trigger expectation and its self-sustaining normative character, while Jonas insists the practice merely tracks an externally fixed ordering.

  Breaking down their four moves:
  First, Mara's point about algorithmic contingency is partially correct - the weights are indeed chosen - but she overstates the case. While parameters are adjustable, users treat them as fixed constraints rather than coordination variables. Jonas rightly notes this distinction, though he underestimates how the manual release norm introduces genuine arbitrariness.

  Second, Jonas hits a key point about users not seeing weights as collective choices, but misses that the sanctioning pattern around manual releases creates a separate coordination layer. This is where Mara's third move shines - the meta-expectation about not exploiting direct release does function convention-like, regardless of the algorithm's output.

  Third, Jonas's norm/convention distinction in the fourth move is philosophically sound but overly rigid. In practice, the manual release practice blends both elements - it's normatively enforced yet solves a coordination problem the algorithm alone couldn't resolve due to cancellation uncertainties.

  The real insight lies in how algorithmic opacity transforms convention formation. When users can't fully predict the shadow queue's behavior (as with dynamic urgency scores), they develop stabilizing practices like the manual trigger to reduce uncertainty. This creates a nested structure: the algorithm handles first-order resource allocation, while the human practice manages second-order unpredictability.

  Both colleagues miss that conventions can emerge precisely to compensate for opaque systems. The manual release norm isn't just about equity (as Jonas claims) or pure coordination (as Mara suggests), but about creating predictability when algorithmic outputs are partially indeterminate. The practice's conventional nature stems from its role in filling epistemic gaps created by the black-boxed weighting system.
answer: |-
  Your colleagues' debate offers a precise case study for applying convention theory (Lewis, Gilbert, etc.). Here's a move-by-move adjudication, followed by an overall assessment and key insights:

  ### Move-by-Move Analysis
  1. **Mara (Arbitrariness via Algorithmic Contingency)**  
     *Verdict: Partially correct but incomplete.*  
     Justification: She correctly notes that algorithmic parameters are institutionally contingent (revised formula = human choice). However, this *design-level* contingency doesn't automatically make the *user-level practice* arbitrary. Users coordinate *given* the algorithm as a fixed constraint, not *about* the algorithm itself. Jonas is right that participants treat weights as background conditions (like treating gravity as fixed when coordinating to avoid collisions). The manual-release norm *is* arbitrary, but the queue ordering isn't.

  2. **Jonas (Algorithm as Non-Arbitrary Constraint)**  
     *Verdict: Partially correct but incomplete.*  
     Justification: He rightly distinguishes between coordinating *around* an external structure vs. selecting the structure itself. Yet he overlooks that the **manual-release practice** *is* arbitrary: returning slots to the open pool would be functionally equivalent *if* the group reconfigured norms accordingly (as Mara notes). The algorithm doesn’t mandate *how* cancellations are handled; that’s a separate coordination problem.

  3. **Mara (Sanctioning as Sufficient for Convention)**  
     *Verdict: Clearly right (with caveats).*  
     Justification: Common knowledge of sanctions for direct releases *does* indicate a normative convention. Lewisian conventions require:  
     - Regularity in behavior  
     - Arbitrariness (viable alternatives exist)  
     - Common knowledge of preferences for conformity *conditional on others conforming*.  
     The sanction pattern proves this conditional preference: users prefer manual triggering *because others expect it*. The algorithm’s existence doesn’t negate this second-order norm.

  4. **Jonas (Norm vs. Convention Distinction)**  
     *Verdict: Partially correct but misapplied.*  
     Justification: He correctly distinguishes norms (prosocial obligations) from conventions (arbitrary equilibria). However, **this practice is both**:  
     - It’s a *convention* because the group coordinates on one arbitrary option (manual release) when multiple are functionally equivalent *given the algorithm*.  
     - It’s a *norm* because sanctions enforce equitable access.  
     It’s parasitic on the algorithm’s function but remains conventional in its *form*.

  ---

  ### Overall Assessment
  **Mara is closer to being correct.** The manual-release practice satisfies Lewis’s criteria:  
  - **Regularity:** Users consistently trigger the shadow queue.  
  - **Arbitrariness:** Direct release is technically permitted and could be stabilized with different norms.  
  - **Conditional Preferences:** Sanctions show users enforce conformity *because others do*.  

  **Jonas underestimates** that conventions can emerge *within* algorithmic systems to resolve gaps (here: cancellation handling). The algorithm fixes resource allocation *logic*, but not *behavioral expectations* around interface use.

  ---

  ### What Both Are Missing: Algorithmic Mediation’s Impact on Conventions
  1. **Opacity Alters Constitutive Knowledge**:  
     When users don’t fully grasp the algorithm (e.g., how "urgency scores" are calculated), their coordination isn’t based on *predicting outputs* but on *complying with perceived group norms*. This makes the convention *more fragile* (if trust erodes) but *no less conventional*.

  2. **Hybrid Agency**:  
     The convention depends on **distributed cognition**:  
     - The algorithm handles prioritization.  
     - Humans handle exception management (cancellations).  
     Conventions stabilize at the "seam" between automated and human tasks, where uncertainty exists.  

  3. **Functional vs. Conventional Layers**:  
     - **Jonas** conflates the algorithm’s *functional hierarchy* (non-arbitrary for resource allocation) with the *behavioral practice* (arbitrary for cancellation handling).  
     - **Mara** underemphasizes that algorithmic opacity *reduces the viable alternatives*: Users might prefer the manual-release norm *because* they distrust the algorithm’s handling of sudden openings.  

  4. **Key Insight**:  
     **Conventions emerge where algorithms leave "gaps" in social predictability.** Here, the algorithm doesn’t specify cancellation protocols, creating a space for arbitrary but stabilized human coordination. The practice *is* a convention, but its persistence relies on the algorithm as a black-boxed institutional artifact that users take as fixed.  

  ---

  ### Conclusion
  The manual-release practice is a convention *governing human interaction with an algorithmic system*. Its arbitrariness lies in the choice of interface protocol, not the underlying queue logic. Algorithmic opacity doesn’t prevent convention formation—it often *triggers* it, as humans develop norms to manage uncertainty in socio-technical systems. Mara correctly identifies the conventional layer, while Jonas mistakenly reduces the practice to mere epistemic tracking. Both would benefit from analyzing how conventions scaffold onto technologically mediated institutional orders.
