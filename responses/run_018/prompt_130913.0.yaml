  ### Coalition Game: Structural Pressures vs. Personal Agency in the Rise of Authoritarianism

  **Objective:** Make students viscerally grasp whether Hitler was a unique "bottleneck" or if structural forces would have produced a substitute authoritarian figure. The game forces players to navigate coalition-building under crisis conditions with/without a "Hitler token" that enables cross-faction mediation.

  **Setup:**  
  - **14 players**, randomly assigned hidden roles (2 each of 7 factions):  
    - **Industry**: Fear communism; prioritize economic stability.  
    - **Army**: Nationalist; seek rearmament and order.  
    - **SA Leaders**: Radical paramilitary; demand power and purge leftists.  
    - **Left Parties**: Socialists/communists; fear fascism but want worker rights.  
    - **Center Parties**: Liberals; want rule of law but fear chaos.  
    - **Conservatives**: Elites; want traditional authoritarianism.  
    - **Junkers**: Landed aristocracy; seek monarchist restoration.  
  - **Payoff Cards** (publicly known):  
    - All factions: **+50 pts** for avoiding civil war (chaos = **0 pts**).  
    - Faction-specific goals (e.g., Industry: **+30 pts** for conservative-led gov’t; SA: **+40 pts** for fascist regime; Left: **+20 pts** for labor protections).  
  - **Crisis Conditions** (visible to all): Versailles resentment (limits military options), economic collapse (unemployment), fear of communism.  
  - **Hitler Token (Round 1 only)**: Holder can force two mutually hostile factions into coalition (e.g., SA + Conservatives). Token holder gets **+10 pts** if their faction’s gov’t type wins.  

  ---

  ### Rules: Two Rounds, Same Strategic Bind  
  **Goal:** Form a coalition government (≥8 players) to avoid chaos. Failure = civil war (all get 0).  

  #### **Round 1: With "Hitler Token" (15 min)**  
  1. Players negotiate in free-form discussion.  
  2. **Hitler Token Powers**:  
     - Holder can **override one "distrust barrier"** (e.g., force SA and Conservatives to cooperate).  
     - Token must be used explicitly during negotiations.  
  3. **Coalition Formation**:  
     - Minimum 8 players must agree on:  
       - **Government Type** (choose one):  
         - *Fascist* (SA preferred)  
         - *Conservative-Authoritarian* (Industry/Army/Junkers preferred)  
         - *Military Junta* (Army preferred)  
         - *Left-Center Alliance* (Left/Center preferred; hard due to anti-communist fears).  
       - **Policy Concessions**: Factions trade payoffs (e.g., Industry offers SA **+10 pts** from their pool for backing conservative rule).  
     - If coalition succeeds, members split **+100 pts** (base) + faction payoffs. Hitler token holder gets bonus if their gov’t type wins.  
  4. **Failure**: No coalition = chaos (**0 pts**).  

  #### **Round 2: Without Hitler Token (15 min)**  
  - **Same crisis conditions**, but token removed.  
  - **Distrust barriers are absolute**: SA cannot ally with Conservatives/Junkers; Left cannot ally with right-wing factions.  
  - Players must build a coalition without token powers.  
  - **Scoring identical to Round 1**.  

  ---

  ### Predictable Breakdowns & How to Mitigate  
  1. **Ignoring Framing for Points**:  
     - Students may form "easy" coalitions (e.g., Army-Industry-Conservatives) in **both rounds**, bypassing SA/Left.  
     - **Mitigation**: Emphasize that SA/Left have street power—if excluded, they can "sabotage" (GM secretly rolls a die; 1–3 = chaos even if coalition forms). This mirrors historical paramilitary violence.  

  2. **Token Underuse**:  
     - Hitler token holder may hoard power or fail to broker SA-Conservative deal.  
     - **Mitigation**: Secretly remind token holder: "Your faction gains +10 pts if fascism wins. Use the token to force SA-Conservative unity."  

  3. **Left Faction Irrelevance**:  
     - Anti-communist panic may isolate Left. If Left is excluded, announce: "Communist militias riot—stability at risk."  

  ---

  ### Debrief (30 min): Mapping Game to Theory  
  1. **Structural Pressures vs. Agency**:  
     - "In Round 1, did the token enable a coalition that was impossible in Round 2? Or did the same factions win both times?"  
     - "When the token vanished, did the system find a *substitute* (e.g., a general replacing Hitler) or fracture?"  
     - Link outcomes:  
       - **Structural Overdetermination**: Conservative/military coalition wins both rounds—authoritarianism was inevitable.  
       - **Bottleneck Theory**: SA-Conservative alliance *only* formed with token; without it, chaos or weak gov’t ensued.  

  2. **What the Game Can’t Capture**:  
     - **Charisma**: Hitler’s oratory isn’t simulated—deals are transactional, not ideological.  
     - **Contingency**: Random events (e.g., 1930 assassination attempts) aren’t modeled.  
     - **Scale of Fear**: Players "know" it’s a game; real actors feared communist revolution more viscerally.  

  3. **Theoretical Reveal**:  
     - Finally name **structuralism** (Moore, Skocpol) vs. **contingency/bottleneck** (Kershaw, counterfactual history).  
     - "Did removing Hitler *change the outcome* or just the *label* of authoritarianism?"  

  ---

  ### Why This Works  
  - **Same Bind, Different Tools**: Rounds 1 and 2 share identical win conditions, forcing comparison.  
  - **SA as Litmus Test**: If SA integrates only with token, Hitler was pivotal. If conservatives govern alone both times, structure prevails.  
  - **Low Lecture, High Experience**: Players *feel* the frustration of distrust barriers and token dependency.  

  **Run Time**: 15 min setup + 30 min gameplay (2×15) + 30 min debrief = 75 min (adjust as needed).
