prompt: |-
  ok so my advisor in politcal theory has this running list of who belongs to the demos in different bodies, and im trying to reverse-engineer her actual rule. her verdicts so far:

  - city council deciding rent control: long-term undocumented residents get a vote, she says theyre co-subjects of the housing regime even without papers.
  - national climate assembly: future generations recieve proxy seats but arent full members since they cant enter the discursive space.
  - factory co-op deciding safety protocols: seasonal workers are out, only permanent staff vote, even though the risk hits the temps harder.
  - school board picking curriculum: students 16-18 get full votes, 13-15 advisory only, anyone under 13 is out entirely.
  - river-basin council: upstream towns that pollute dont belong in the downstream town's demos, but they owe reparative consultation.
  - digital commons governing AI training data: people whose text was scraped belong to that commons' demos, but the autonomous model itself doesnt, even if it makes decisions.
  - tribal land council: non-indigenous spouses living on the land 5+ years vote on domestic issues but not on sacred-land issues.

  new case: a floating population of digital nomads who stay in a city for 3-6 months, use local services, pay local consumption taxes, but hold no lease and vote in thier home countries. should they be in the demos for a decision about expanding the city's broadband infrastructure?

  predict what she'd say, but im less interested in the answer than in the rules. i can see at least two that fit all her past calls: one about stable reciprocal vulnerability to the decision's authority, and one about embodied capacity to enter local discursive space. are there other rules that fit just as well? which prior case actually splits them? and if her precedants genuinely underdetermine this, what principle is she adopting if she includes them versus excludes them? also whats the sharpest further case that would actually tell the competing rules apart?

  please dont ask for citations or a reading list, i need this to work for a model that cant search the web.
reasoning: |-
  Okay, the user is trying to reverse-engineer their advisor's rule for determining who belongs in the demos (the group entitled to participate in decision-making) across different governance bodies. They've provided seven prior cases with the advisor's verdicts and now have a new case about digital nomads. They want to understand the underlying principles, identify competing rules, find which case could split those rules, and determine what principle would be at play if the nomads are included or excluded.

  First, I need to analyze the existing cases to find consistent patterns. Let me list the cases and the advisor's decisions:

  1. **City Council (Rent Control)**: Undocumented residents get a vote because they're co-subjects of the housing regime.
  2. **National Climate Assembly**: Future generations get proxy seats but aren't full members due to inability to enter discursive space.
  3. **Factory Co-op (Safety Protocols)**: Seasonal workers are excluded; only permanent staff vote, even though temps face higher risks.
  4. **School Board (Curriculum)**: Students 16-18 full votes, 13-15 advisory, under 13 excluded.
  5. **River-Basin Council**: Upstream polluters excluded from downstream demos but owe reparative consultation.
  6. **Digital Commons (AI Training)**: People whose data was scraped are included; the AI model itself is excluded.
  7. **Tribal Land Council**: Non-indigenous spouses vote on domestic issues but not sacred-land issues after 5+ years.

  The user mentions two possible rules: **Stable Reciprocal Vulnerability** and **Embodied Discursive Capacity**. Let me test these against the cases.

  **Stable Reciprocal Vulnerability (SRV)** focuses on being consistently affected by decisions and bound by the authority. For example, in the city council case, undocumented residents are vulnerable to rent control, so they're included. Seasonal workers in the factory face risks but are excluded because their vulnerability isn't stable (seasonal). Future generations are vulnerable but lack reciprocity since they can't be bound now, so they get proxies but not full membership. Upstream towns affect downstream but aren't reciprocally vulnerable to downstream's decisions, so excluded.

  **Embodied Discursive Capacity (EDC)** emphasizes the ability to participate in discourse. Future generations can't participate, so proxies only. Young children can't engage in complex discourse, so excluded from voting. The AI model lacks embodiment, so excluded. Non-indigenous spouses can discuss domestic issues but not sacred matters (cultural discourse), hence partial inclusion.

  Now, which prior case splits these rules? The **school board case** is key. Under SRV, younger students are vulnerable to curriculum decisions, but they're only given advisory roles or excluded. Under EDC, the differentiation by age aligns with cognitive capacity for discourse. So EDC fits better here. The **factory co-op case** also highlights stability; seasonal workers lack stable ties, so excluded despite vulnerability. That supports SRV.

  For the **digital nomads case**: They're temporarily present (3-6 months), pay consumption taxes, use services, but no long-term stability. Under SRV, their vulnerability to broadband decisions is temporary and unstable, so exclusion. Under EDC, they can participate in discourse while present, so inclusion. The advisor would likely exclude them, aligning with SRV, as their stay is transient, similar to seasonal workers.

  But if the advisor includes them, it might prioritize immediate vulnerability over stability, or perhaps a hybrid approach. To split the rules, a **permanent vegetative state patient** case would work. They have stable vulnerability (affected by healthcare decisions) but can't participate discursively. SRV includes them; EDC excludes.

  The user also needs the sharpest case to differentiate rules. The **coma patient in a municipality** fits: permanently affected by decisions but unable to discourse. SRV says include (proxy needed), EDC says exclude. That clearly splits the principles.

  In summary, the advisor's pattern leans towards SRV, with stability as key. Digital nomads' transient status suggests exclusion. The coma case would test the rules definitively.
answer: |-
  Based on your advisor's precedents and the need to reverse-engineer her rule, here's a breakdown of the principles, prediction for digital nomads, rule comparison, underdetermination analysis, and a sharp test case:

  ### Prediction for Digital Nomads
  **She would EXCLUDE them from the demos.**  
  *Why?* Their transient status (3-6 months, no lease, voting elsewhere) lacks the *stability* seen in included groups (undocumented long-term residents, tribal spouses) and resembles excluded groups (seasonal workers, upstream towns).

  ---

  ### Competing Rules Fitting All Precedents
  Two robust rules emerge, but they diverge in key cases:

  1. **Stable Reciprocal Vulnerability (SRV)**  
     *Definition*: Inclusion requires **(a)** enduring exposure to the regime's authority/decisions, and **(b)** reciprocal capacity to be both impacted by *and* bound to enforce the collective outcome.  
     - *Fits all cases*:  
       - Undocumented residents: Stable housing vulnerability ✅, bound by rent rules ✅.  
       - Seasonal workers: Vulnerability is transient ❌, no reciprocal obligation to enforce safety protocols ❌.  
       - Future generations: Vulnerable ✅ but cannot be bound reciprocally (no enforcement capacity) ❌ → proxies only.  
       - Upstream towns: Impact downstream ❌ but not reciprocally vulnerable to downstream's authority ❌ → consultation only.  

  2. **Embodied Discursive Capacity (EDC)**  
     *Definition*: Inclusion requires **(a)** physical presence/embodiment in the affected space, and **(b)** cognitive/agency capacity to engage in real-time, situated discourse.  
     - *Fits all cases*:  
       - Future generations: Lack embodiment ❌ → proxies only.  
       - Under-13 students: Limited discursive capacity ❌ → excluded.  
       - AI model: Non-embodied ❌ → excluded.  
       - Tribal sacred issues: Non-indigenous spouses lack cultural-discursive context ❌ → excluded.  

  ---

  ### Case That Splits the Rules: **School Board Curriculum Decision**
  - **SRV Interpretation**: Students 13–18 are *equally vulnerable* to curriculum decisions. SRV struggles to explain why 13–15yo get only advisory status (vulnerability is stable).  
  - **EDC Interpretation**: Age thresholds map cleanly to cognitive/developmental capacity for complex discourse (16+ = full discursive agency).  
  - *Conclusion*: **EDC fits this case better**. SRV requires additional assumptions (e.g., "reciprocity" demands maturity to enforce norms), while EDC directly explains the age-based cutoff.  

  ---

  ### Underdetermination in the Nomad Case & Principles at Stake
  The precedents *slightly favor SRV* but genuinely underdetermine the nomad verdict. The key principle invoked would depend on inclusion/exclusion:  
  - **If INCLUDED**: Advisor prioritizes **Immediate Impact/Contribution** (taxes, service use) over stability. Aligns with "co-subjects of the regime" logic (rent control case).  
  - **If EXCLUDED**: Advisor prioritizes **Enduring Integration** over transient presence. Aligns with seasonal worker/tribal sacred-issue exclusions.  

  **Critical uncertainty**: Is "paying consumption taxes" sufficient to establish reciprocal vulnerability (SRV) without stability? Or does transient status negate "embodied presence" (EDC) by making discourse participation ephemeral?  

  ---

  ### Sharpest Test Case to Split SRV vs. EDC
  **Coma Patient in a Municipality**:  
  - A long-term resident in a permanent vegetative state (stable home, family ties, taxed property).  
  - Municipality votes on road repairs affecting their property access.  

  - **SRV Prediction**: **INCLUDED** (with proxy).  
    *Why*: Stable vulnerability ✅; reciprocal obligation exists (taxes paid, property bound by laws) ✅.  
  - **EDC Prediction**: **EXCLUDED**.  
    *Why*: Lacks capacity for embodied discourse ❌. Cannot engage in deliberation.  

  *Why this splits the rules*:  
  - SRV cares about *structural position* (vulnerability + reciprocity), not consciousness.  
  - EDC requires *agency in discourse*, irrespective of vulnerability.  
  - This case has no precedent in your list, forcing a clear choice between vulnerability or discourse as the non-negotiable core.  

  ### Summary of Advisor's Likely Rule
  Your advisor's pattern best fits **Stable Reciprocal Vulnerability (SRV)**, *modified by* embodied discourse capacity where vulnerability alone is insufficient (e.g., future generations, young children). EDC acts as a constraint but not the primary criterion—vulnerability is the engine.  

  **For the nomads**: Their exclusion would reaffirm SRV (transience breaks stability/reciprocity). Inclusion would signal a shift toward "impact-as-membership" (prioritizing immediate effects over duration). The coma case is the litmus test.
