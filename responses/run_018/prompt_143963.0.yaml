prompt: |-
  I'm drafting a scene for my novel where two academics — lets call them Mara and Jonah — are having a heated debate in a pub about whether culture can actually cause anything, or if it's just economics in disguise. I want you to write their dialogue. One should defend Weber's Protestant ethic thesis: that religious values genuinely shaped capitalist behaviour through something like elective affinity. The other should push back hard, arguing values are always post-hoc rationalisations of material interests. They need to be equally sharp — no strawmen — and they should respond to each other's actual arguments, not talk past them. I want this to take a committed stance: dont just leave it hanging, have one side win with clear reasons. Write it in British English (behaviour, centre, labour, etc.). Also, to keep it from sounding like a textbook, inject a niche twist: have them apply Weber's idea of elective affinity to a modern startup culture where ascetic discipline is driven by venture-capital metrics rather than theology — does that extend Weber's logic or collapse it? Please avoid footnotes, bibliographies, or citations; I need something a model could think through without searching. Sorry if there's a typo or two in this brief — I'm writing between chapters, and I probly missed one.
