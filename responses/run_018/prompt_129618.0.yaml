answer: |-
  Your diagnosis hits the nerve of the PMI deadlock. The debate isn't fundamentally about historical evidence or induction—it's a **substantive disagreement about theoretical ontology and failure modes**, masked by post-hoc rationalization and ambiguous terminology. Here's the breakdown:

  ### The Core Blockage
  1. **Asymmetric Criteria for "Failure"**  
     - **Anti-realist**: Defines failure as *ontological discontinuity* (e.g., phlogiston ≠ oxygen). Successes are "miraculously" preserved mathematical structures, which don't justify belief in *current* ontology.  
     - **Realist**: Defines failure as *peripheral inaccuracy* (e.g., caloric's substance-like properties discarded, but heat-transfer mechanisms preserved). Successes validate the *structural core* (equations, causal relations).  

  2. **Post-Hoc Redefinition of "Core"**  
     Both sides retrospectively label retained elements as "core" and discarded elements as "peripheral." This circularity prevents progress:  
     - Realists point to retained structures (Maxwell's equations sans ether) as proof of continuity.  
     - Anti-realists note that *which* structures survive is unpredictable (e.g., Newtonian absolute space abandoned, but gravity's inverse-square law retained as low-energy limit).  

  3. **Verbal Confusion Amplifies Disagreement**  
     - "False theory" means:  
       - For anti-realists: *The ontology is radically incorrect*.  
       - For realists: *Specific models were idealized, but the deep structure approximates truth*.  
     - "Core" lacks a pre-theoretical definition. Is it mathematical formalism? Causal mechanisms? Observable predictions?  

  ### Why It's Substantive, Not Merely Verbal
  - **Divergent Epistemic Values**:  
    Anti-realists prioritize *avoiding false positives* (don't believe what might be abandoned). Realists prioritize *retention of explanatory power* (preserved structures track reality).  
  - **No Neutral Ground for "Centrality"**:  
    What counts as "peripheral" (e.g., ether's mechanical properties) vs. "core" (electromagnetic field equations) hinges on metaphysical commitments:  
    - Realists see structure as ontologically significant.  
    - Anti-realists see structure as pragmatic scaffolding.  

  ### The Hidden Questions Beneath the Loop
  1. **Descriptive**: How *do* theories fragment in revolutions? (What actually gets abandoned?)  
  2. **Normative**: How *should* we weight predictive success vs. ontological fidelity when assigning belief?  

  ### Paths to Progress (Not Reading Lists)
  1. **Taxonomy of Theory-Change Failure Modes**  
     Classify historical cases by *what* failed and *why*:  
     | **Case**       | **Abandoned Element**      | **Retained Element**       | **Failure Type**               |  
     |----------------|----------------------------|----------------------------|--------------------------------|  
     | Phlogiston     | Substance ontology         | Oxidation reactions        | *Total ontological rejection*  |  
     | Luminiferous Ether | Medium for waves       | Wave equations             | *Carrier entity discarded*     |  
     | Newtonian Gravity | Absolute space, action-at-distance | $F=G\frac{m_1m_2}{r^2}$ | *Framework revised, low-energy limit preserved* |  
     This forces specificity: When is retention "significant" enough to support realism?  

  2. **Formalize "Centrality" via Fragility**  
     Define a theory's "core" as elements whose *alteration collapses predictive power*. Example:  
     - Altering Schrödinger's equation → quantum mechanics fails empirically.  
     - Altering "spacetime curvature causes gravity" (ontology) → GR still works mathematically.  
     This shifts focus to *counterfactual robustness* rather than historical survival.  

  3. **Accept the Question is Ill-Posed in Binary Form**  
     Reject "true/false" for theories. Instead:  
     - Adopt **selective skepticism**: Believe only elements resilient under *anticipated theory-space perturbations* (e.g., equations stable across rival ontologies).  
     - Embrace **functional realism**: Belief in entities is justified if they play *indispensable roles* in multiple independent models (e.g., electrons in QED, chemistry, condensed matter).  

  ### Why the Loop Persists
  - **Anti-realists** won't accept structural retention as "success" if ontology shifts.  
  - **Realists** won't concede that structural retention is accidental.  

  **Ultimate diagnosis**: The blockage is **metaphysical** (what must reality be like for science to work?) and **methodological** (how do we define "approximate truth"?). Progress requires abandoning the binary "core/periphery" metaphor and mapping theory-space topologies—showing *which* components constrain others across revolutions. Until then, PMI remains a proxy war over scientific ontology itself.
