prompt: |-
  I retired several years ago from experimental physics and have since been working through population ethics without publication deadlines. I am trying to reach reflective equilibrium on what I actually think about bringing people into existence, and I need help seeing whether my intuitions hang together or whether some must be revised.

  Here are my verdicts on concrete scenarios. First, learning through prenatal screening that a fetus will suffer from a condition involving constant severe pain, and terminating the pregnancy: that is not merely permissible but, to my mind, close to obligatory. Second, a well-resourced couple with every reason to expect a happy child deciding nevertheless to remain childless: this strikes me as entirely permissible, with no moral failing whatsoever. Third, knowingly conceiving a child who will suffer severely: clearly wrong. Fourth, a couple who forgo conception specifically to redirect substantial lifelong resources toward reducing severe suffering in existing populations—wild-animal suffering, climate adaptation—despite knowing that their own child would likely have led a happy life: I find this admirable, not blameworthy. Fifth, a couple using embryo selection who reject an embryo predicted to have a life of steady moderate contentment in favor of one with a high-variance prospect—either exceptional flourishing or severe suffering—solely because expected welfare is higher: here I oscillate. Part of me thinks that exposing a potential person to severe suffering for the chance of exceptional good is precisely the gamble the asymmetry should forbid; another part thinks that rejecting high-variance prospects categorically treats potential happiness as too cheap and potential suffering as the only relevant factor.

  The case I keep returning to combines the logic of the fourth and fifth. Imagine a couple in a period of high geopolitical and climatic instability who consider conceiving. They recognize that any child might suffer gravely from resource scarcity or conflict, but might also contribute to mitigation in ways that prevent far greater suffering elsewhere. I keep going back and forth on whether the possibility of that exceptional contribution can justify running the risk of severe suffering, or whether the asymmetry permits us to weigh only the downside for the potential child, leaving any upside for others to be counted separately if at all. Does that mean my approval of case four is unstable?

  Is there a principle, or a small family of principles, that accommodates cases one through four cleanly, says something precise about case five, and resolves—or at least clarifies—my oscillation in the final case? I want the principle stated precisely, with the case that motivates each clause, its verdict on at least one further scenario I have not considered (for instance, selecting among embryos solely to maximize expected welfare when no risk of suffering is present), and an honest statement of which of my verdicts it must overturn if it is to remain simple. I am not looking for named positions or a reading list; I want the internal logic of the commitments.

  Principle summary:
reasoning: |-
  Okay, the user is a retired experimental physicist diving deep into population ethics. They're seeking reflective equilibrium on bringing people into existence, presenting concrete scenarios with their intuitive judgments. They want a principle that unifies these judgments without contradictions.

  Breaking down their verdicts: Termination for severe suffering is near-obligatory; not having a happy child is permissible; creating a suffering child is clearly wrong; forgoing conception to help others is admirable; embryo selection with high variance causes oscillation. The core tension is between case four (admirable sacrifice for others) and case five (risk-taking for potential gains), spilling into the geopolitical instability case.

  The physicist's underlying struggle centers on the asymmetry in valuing suffering versus happiness in potential lives. They sense that suffering creates stronger obligations than happiness, but case four complicates this by introducing obligations to existing beings. The oscillation in case five reveals uncertainty about whether potential happiness can offset risk when the beneficiary is the child versus others.

  For a unifying principle, I need to preserve the asymmetry while allowing for other-regarding obligations. The Negative Asymmetry Principle could work: Suffering prohibition is strict for the created being, but happiness promotion is elective and subordinate to preventing real suffering elsewhere. This explains why creating suffering is forbidden (cases 1,3) while not creating happiness is permitted (case 2). Case four becomes admirable because it prioritizes preventing actual suffering over potential happiness.

  For case five, the principle would reject high-variance selection because inflicted risk (severe suffering chance) violates the suffering prohibition for that child, even if expected welfare is higher. The geopolitical case similarly prohibits conception if significant suffering risk exists for the child, regardless of potential benefits to others - those benefits become relevant only if the risk is minimal.

  The physicist might resist this resolution because it makes case four's admirability contingent on existing suffering being addressed, not potential happiness being sacrificed. But that's consistent with their other intuitions. The principle overturns any reading where high-variance selection is permissible, forcing a choice in their oscillation.

  Adding a new test case: Selecting embryos for higher happiness when no suffering risk exists. The principle permits this because only happiness is at play, aligning with case two's permissibility of not creating happiness. This maintains symmetry for pure happiness cases while applying asymmetry strictly when suffering could occur.

  The physicist's identity as an experimentalist suggests they'll appreciate precise conditional logic over philosophical hand-waving. The proposed principle frames obligations as mathematical constraints: prohibition (suffering) > permission (happiness creation) > elective duty (suffering prevention). This structural clarity should help them evaluate tradeoffs in novel scenarios.
answer: |-
  Based on your intuitive verdicts and the core tension you identify, here is a principle designed to accommodate cases 1-4 cleanly, resolve case 5, and clarify the geopolitical instability case, while preserving the core asymmetry intuition:

  **The Negative Asymmetry Principle with Contextual Suffering Prevention (NAP-CSP):**

  1.  **Suffering Prohibition:** Creating a being who will experience severe suffering is impermissible, unless that suffering is necessary to prevent significantly greater severe suffering for existing beings *and* no alternative action without comparable suffering creation is available. *[Motivated by Cases 1 & 3: Termination is near-obligatory to prevent suffering; knowingly creating suffering is wrong. Establishes the core asymmetry: preventing suffering (especially severe) has strict priority over creating potential happiness.]*
  2.  **Happiness Permission:** Choosing not to create a being who would likely experience a happy life is permissible. There is no obligation to create happiness for its own sake. *[Motivated by Case 2: Childlessness is permissible. Reinforces asymmetry.]*
  3.  **Contextual Suffering Prevention Duty:** When contemplating an action that involves *not* creating a potential being (who would likely be happy), it is permissible and often admirable to prioritize using the freed resources to prevent severe suffering for *existing* beings over creating that potential happiness. *[Motivated by Case 4: Redirecting resources to prevent existing suffering is admirable. Clarifies that the duty to prevent suffering applies strongly to existing beings, outweighing the creation of potential happiness.]*
  4.  **Risk Prohibition:** Exposing a potential being to a significant risk of severe suffering solely for the potential of greater happiness (for that being or others) is impermissible. Expected welfare calculations cannot justify imposing such a risk on a potential being. *[Motivated by resolving Case 5: High-variance embryo selection for higher expected welfare is impermissible. The gamble with suffering violates the Suffering Prohibition (1) even if the *expected* value is higher. Suffering risk cannot be balanced by happiness potential for the created being.]*

  **Application to Your Cases:**

  1.  **Severe Condition Termination:** Covered by **Suffering Prohibition (1)**. Impermissible to create the suffering. Termination is the only way to prevent it.
  2.  **Childless Happy Couple:** Covered by **Happiness Permission (2)**. No obligation to create happiness.
  3.  **Knowingly Creating Suffering:** Covered by **Suffering Prohibition (1)**. Directly impermissible.
  4.  **Forgoing Conception to Prevent Existing Suffering:** Covered by **Contextual Suffering Prevention Duty (3)**. Permissible and admirable. Prioritizing preventing *existing* severe suffering trumps creating potential happiness.
  5.  **High-Variance Embryo Selection:** Covered by **Risk Prohibition (4)**. Impermissible. Exposing the *selected* embryo to a significant risk of severe suffering solely for the chance of higher happiness (even if expected welfare increases) violates the prohibition against creating suffering or significant suffering risk.
  6.  **Geopolitical Instability Case:** **Impermissible to conceive.** The **Suffering Prohibition (1)** and **Risk Prohibition (4)** apply directly to the potential child. The significant risk of severe suffering for the child cannot be justified by the potential upside of their contribution to mitigating suffering *elsewhere*. The principle strictly forbids creating significant suffering risk for a potential being based on benefits to others. The upside for others is irrelevant to the prohibition concerning *this* potential child's risk. Your admiration for Case 4 remains stable because Case 4 involves *preventing suffering for existing beings* by *not creating* a potential being, not *creating* a being at risk *for the sake of others*.

  **New Test Case: Selecting Embryos for Maximized Happiness (No Suffering Risk):**
  *   **Scenario:** A couple uses embryo selection. All viable embryos are predicted to have lives well above neutrality (no risk of net suffering), but with varying levels of positive welfare (e.g., steady moderate contentment vs. high flourishing). They select the embryo predicted to have the highest welfare.
  *   **NAP-CSP Verdict:** **Permissible.** The **Suffering Prohibition (1)** and **Risk Prohibition (4)** are not triggered as there is no suffering or significant suffering risk involved. The **Happiness Permission (2)** implies that while there is no *obligation* to maximize happiness, actively choosing a higher level of happiness over a lower level when creating a being is permissible. This action only concerns potential happiness, and the asymmetry doesn't forbid preferring more happiness to less when creating.

  **Overturned Verdict & Simplicity Cost:**

  *   **Overturned Verdict:** Your oscillation in **Case 5 (High-Variance Selection)**. NAP-CSP definitively rules it **impermissible** based on the Risk Prohibition (4). The part of you that felt the asymmetry should forbid this gamble is upheld; the part that felt rejecting high-variance prospects treats happiness as "too cheap" is overruled. Happiness potential *is* treated as insufficient to offset suffering risk *for the being created*.
  *   **Simplicity Cost:** The principle introduces a distinction between suffering prevention for *existing* beings (which can override creating potential happiness) and potential benefits (including suffering prevention) accruing to *others* that might be used to *justify creating a being at risk of suffering*. This distinction is crucial for resolving the tension between Cases 4 & 5 and the geopolitical case, but it adds complexity compared to a pure "only suffering counts negatively" asymmetry. It also explicitly elevates *risk* of suffering to the same level of prohibition as *certain* suffering.

  **Internal Logic & Resolution:**

  NAP-CSP is built on a core commitment: **Preventing severe suffering (actual or significant risk) for specific beings (existing or potential) takes absolute priority over creating potential happiness.** This explains Cases 1, 2, 3, and 5 cleanly.

  *   **Suffering Focus:** Suffering (actual or significant risk) is the primary moral bad. Creating it is forbidden (1, 4).
  *   **Asymmetry:** Not creating happiness is permissible (2); creating happiness is only permissible when it doesn't violate the suffering prohibitions (1, 4) or the contextual duty (3).
  *   **Contextual Duty (3):** This clause exists to reconcile the asymmetry (no obligation to create happiness) with the strong intuition that *using resources to prevent existing suffering instead of creating happiness is good*. It leverages the asymmetry – since creating happiness isn't obligatory, resources *can* and *should often* be diverted to the higher moral imperative of preventing existing suffering. This makes Case 4 admirable without implying an obligation to create the child.
  *   **Risk Prohibition (4):** This closes the loophole where "expected welfare" could be used to gamble with suffering. It treats significant suffering risk as morally equivalent to certain suffering for the prohibition, solidifying the core asymmetry against using potential happiness to counterbalance suffering risk *for the same being*.
  *   **Geopolitical Resolution:** The principle forbids conception because the potential child faces a significant risk of suffering (triggering 1 & 4). The potential *contribution* the child might make to preventing suffering *elsewhere* does not negate the prohibition against imposing the suffering risk *on them*. It falls outside the scope of the Contextual Suffering Prevention Duty (3), which only applies when *not creating* a being frees resources *to prevent existing suffering*. Creating a being at risk *for the sake of potential future benefits to others* is not covered by (3) and is forbidden by (1) & (4).

  This principle maintains the core intuition that potential suffering matters decisively in a way potential happiness does not, while accommodating your strong intuition about redirecting resources to help existing beings (Case 4). It resolves your oscillation in Case 5 by firmly rejecting the gamble and clarifies the geopolitical case by prohibiting the risk imposition on the potential child, regardless of potential upside for others. The cost is overturning the permissibility of high-variance selection in Case 5 and introducing the contextual distinction for duty (3).
