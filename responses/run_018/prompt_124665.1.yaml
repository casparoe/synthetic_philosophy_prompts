  im trying to figure out if he's claiming spatial concepts are locked inside each sense, or just that recognition takes practice. and heres a weird twist: suppose before the cure he spent six months wearing a sensory-substitution vest that turns camera edges into vibrations on his shoulders. then he gets real sight. does that pre-training destroy locke's point, or does direct vision still feel like a seperate language?

