prompt: |-
  I have been thinking independently about cognition, and I keep returning to the idea that analogical reasoning is not a peripheral teaching trick but the central mechanism by which people understand anything they have not encountered before. I want to lead a single ninety-minute session for three non-specialists—a mechanical engineer, a visual artist, and a high-school literature teacher—none of whom have studied cognitive science, though all can follow abstract argument. I am not asking you to explain the view associated with Hofstadter and Sander to me; I need a concrete teaching plan. First, lay out the exact dependency order: what idea must be firmly in place before I introduce relational mapping across domains, and why must the distinction between surface resemblance and deep structural correspondence come before any concrete case rather than after? Second, propose or adapt one carrying scenario in which a person recognizes a complex social or mechanical pattern in an entirely unfamiliar domain despite zero shared surface features and no specialized vocabulary; it must work equally for visual and verbal thinkers, and it should contain a hidden “inversion” where high surface similarity actually points to the wrong relational mapping, so the group sees analogy fail as well as succeed. Third, map the four predictable misconceptions—(1) that analogy is only a pedagogical metaphor, (2) that it requires conscious deliberate effort, (3) that if it is “core” then logical rules and categories disappear, and (4) that mental imagery is the same phenomenon—and specify the precise point in the sequence where each should be headed off. Fourth, give me one closing question that distinguishes whether they grasp analogical projection of relations from whether they simply agree that analogies are “nice” or useful. Fifth, state explicitly what I should openly refuse to cover—formal structure-mapping algorithms, neural implementation, and whether this framework extends to formal mathematical reasoning—and explain why leaving these out protects the session’s coherence rather than weakening it. Keep the response under 350 words. Separate what is well-established about analogy’s importance in human reasoning from what remains genuinely contested, especially whether analogy literally constitutes all conceptual thought or functions as one dominant mechanism among others, and do not present the stronger constitutive claim as settled consensus.
reasoning: |-
  Okay, let me tackle this complex teaching design request step by step. The user wants a tightly structured 90-minute session on analogical reasoning as a core cognitive mechanism, with very specific constraints. 

  First considering the dependency order: Surface vs. deep distinction must come first because without it, participants will default to superficial matches. That's why we need to establish that "looking alike" ≠ "working alike" upfront before any case studies. The mechanical engineer might jump to physical resemblances otherwise.

  For the carrying scenario, a courtroom/playground comparison comes to mind: Both have "rules" and "violations" but the "referee" role inverts (neutral arbiter vs. participant). This works visually (sketching courtroom vs. playground scenes) and verbally (describing interactions). The surface similarity of "someone blowing a whistle" actually misleads - perfect for showing failure.

  Now the misconceptions: 
  1) Must preempt the "just a teaching trick" idea right after defining analogy, before examples. 
  2) Address the "conscious effort" myth when discussing everyday examples. 
  3) Clarify that logic isn't replaced but grounded during the core mechanism discussion. 
  4) Distinguish from mental imagery when comparing surface vs. deep features.

  The closing question needs to force application: "How would you explain voting to aliens using only their concept of hive pheromones?" Tests relational projection beyond usefulness.

  What to exclude: Formal algorithms would derail into abstraction. Neural implementation is off-topic. Math reasoning extension is too contested. Keeping these out maintains focus on cognition fundamentals.

  On established vs. contested: It's well-supported that analogy is fundamental for learning, but the claim that it constitutes all thought (Hofstadter/Sander's strong view) remains debated. Must present this nuance clearly.
answer: |-
  Here is your concrete teaching plan:

  **Dependency Order**  
  1. **Defining analogy** (5 mins): Concrete example (e.g., solar system/atom). Establish: *Analogy maps relationships, not surface traits*.  
  2. **Surface vs. deep distinction** (15 mins): *Must precede cases* to prevent misattribution. Use images: A wolf pack (surface: teeth/fur; deep: hierarchy/cooperation) vs. corporate team (zero surface, same hierarchy). *Why first?* Surface resemblance is cognitively automatic; without this filter, relational mapping fails.  

  **Carrying Scenario: "Rule Enforcement Systems"**  
  - *Base domain*: Traffic police (fines for speeding = consequence for rule-breaking).  
  - *Target domain*: Immune system (antibodies "tagging" pathogens = neutralization).  
  - *Surface trap*: Compare to librarians shushing (surface: "enforcer" figure; *wrong* relational mapping—librarians prevent disruption, not eliminate threats).  
  - *Why it works*: Both engineer (systems) and artist (visualize tagging/patrol) engage; teacher sees narrative structure.  

  **Misconceptions & Preemptive Strikes**  
  1. *"Only pedagogical metaphor"*: Debunk **immediately after definition** using everyday examples (e.g., "This debate is a *war*" used unconsciously).  
  2. *"Requires conscious effort"*: Counter **during carrying scenario** by asking: "Did you *try* to see the immune system as police, or did it click?"  
  3. *"Replaces logic/categories"*: Clarify **when contrasting analogy/deduction**: "Analogy *uses* categories (e.g., 'enforcer') but maps their *role*."  
  4. *"Same as mental imagery"*: Block **during surface/deep discussion**: Show identical images (two chessboards) with *different* relational meanings (strategy vs. decoration).  

  **Closing Question**  
  "*If intelligence is like a library, is adding a new book more like expanding the building, training the librarian, or revising the catalog? Justify by mapping relations.*" (Tests projection: Building = capacity, librarian = processing, catalog = organization).  

  **Refuse to Cover & Why**  
  - **Formal algorithms** (irrelevant to cognitive mechanism).  
  - **Neural implementation** (distracts from *how* analogy functions psychologically).  
  - **Formal math extension** (highly contested; risks derailing into abstraction).  
  *Why omit?* Focuses the session on *experiential understanding* of analogy’s role in learning.  

  **Well-Established vs. Contested**  
  - **Established**: Analogy is fundamental for learning novel concepts, abstraction, and creative problem-solving across domains.  
  - **Contested**: Whether it constitutes *all* conceptual thought (strong Hofstadter/Sander view) or operates alongside schema-induction/logical inference. *State explicitly: "Many agree it's central, but not necessarily the sole mechanism."*  

  **Timing**: Definitions (20), Surface/Deep (15), Scenario (30), Misconceptions (15), Close (10). Total: 90 mins.
