  ok so ive been thinking about taxes and whether its basically theif with a badge. every paycheck my employer witholds like 25% before i even see it, and the irs calls it voluntary compliance but if i refuse they lock me up. but if my roommate did the exact same thing with my cash id call the cops. then theres this weird us rule where if i live in canada and work there they still take a cut just because im a citizen, even if i never come back - like they have a prior claim on my labor everywhere. we vote on tax rates but never on whether i personally have to pay, its just assumed. and if i donate to charity i can reduce my bill, so im kind of directing part of my forced payment, but i cant direct it to my own pocket. what view of property and consent does all that presuppose? does it only work if you think the state already partly owns what i earn? or can a social contract view explain why withholding is ok but my roommate doing it is theft? and is the whole thing actually consistant, or am i missing some distinction that makes it not contradictory? im not asking for books or citations, just what philosophical commitments are hiding in these practices and whether they hold together.
reasoning: |-
