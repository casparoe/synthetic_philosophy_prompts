answer: |-
  That's a sharp question – and you've nailed the core ambiguity of the phrase. "Revolutions devour their children" (often misattributed to Danton or Vergniaud, its origins are murky) is indeed frequently deployed as a debate-ender, implying the Terror's inevitability. But its meaning is far from fixed. Let's dissect the menu:

  **The Menu of Readings:**

  1.  **The Banal Power-Struggle Reading:** Revolutions inherently involve the overthrow of an old order and the chaotic establishment of a new one. Power vacuums, competing factions, ideological zeal, and the need for consolidation lead to intense infighting. The "children" (early revolutionaries) become victims as factions turn on each other or radicals are purged by consolidators. *(e.g., Danton vs. Robespierre, Trotsky vs. Stalin)*.
      *   **Platitude?** Yes, largely. It's a broad historical pattern observable in many upheavals, not unique to *ideological* revolutions.
      *   **Supports Inevitability?** Weakly. It suggests violence and purges are *common* and *likely* in such chaotic transitions due to human nature/power dynamics, but doesn't logically demand that it *must* reach the specific scale and ideological intensity of the Terror. It leaves room for variations in intensity and form.

  2.  **The Marxist Class Conflict Reading:** The Terror wasn't just power struggles, but an expression of unresolved class tensions *within* the revolutionary coalition. The bourgeoisie initiated the revolution but needed the *sans-culottes* (urban poor) as shock troops. Once the old aristocracy was broken, the conflict shifted to the bourgeoisie vs. the radicalized popular classes demanding more profound social/economic change. The Terror was the bourgeoisie (represented by Robespierre's Jacobins, trying to control the revolution) violently suppressing the more radical demands of its former allies – the "children" it had raised against feudalism.
      *   **Platitude?** No. This is a substantive, structural argument rooted in specific historical materialism.
      *   **Supports Inevitability?** **Strongly.** It posits that the *inherent contradiction* between bourgeois (property-owning) goals and popular (proletarian/sans-culotte) aspirations made escalating violent conflict structurally necessary to resolve the revolution on bourgeois terms. The Terror becomes the mechanism for this necessary suppression.

  3.  **The Ideological/General Will Thesis:** The logic of Rousseau's "general will," interpreted radically, demands absolute unity and purity for the republic's survival. Anyone deemed corrupt, counter-revolutionary, or merely insufficiently zealous becomes an existential threat to the collective body politic. Eliminating these "impurities" is rational, even virtuous, under this ideological framework. The "children" (early revolutionaries) become victims when their commitment is questioned or when they represent factions seen as fracturing the will of the people.
      *   **Platitude?** No. This is a substantive argument about the internal logic of revolutionary ideology driving escalation.
      *   **Supports Inevitability?** **Conditionally.** It argues that *if* you fully embrace and implement this specific, radical interpretation of popular sovereignty, then a logic of internal purification and escalating violence becomes *rational and difficult to contain*. It makes the Terror *logically consistent* within the revolutionary framework, suggesting a powerful deterministic *tendency*, though perhaps not absolute mechanical inevitability if the ideology were applied differently.

  4.  **The Contingency/Path Dependency Reading:** The Terror wasn't predetermined. It resulted from a cascade of specific, contingent events and choices: external war pressures, counter-revolutionary threats (real and imagined), economic crises, personal ambitions, ideological radicalization *in response to* events, factional rivalries spiraling out of control, and crucially, the decisions and personalities of key actors (Robespierre, Saint-Just, etc.). Paranoia, miscalculation, and bad luck amplified existing tensions. The "children" were devoured because specific leaders, facing specific crises, made specific choices leading down that path – a path not inevitably taken.
      *   **Platitude?** No. This is the core alternative to structural determinism, emphasizing agency, accident, and specific historical context.
      *   **Supports Inevitability?** **No. Actively argues against it.** This view sees the Terror as one possible outcome among others, heavily dependent on unique circumstances and choices.

  **Analysis: Slogan vs. Substance**

  *   **Platitude vs. Substance:** Readings 2 and 3 are substantive historical arguments. Reading 1 is platitudinous ("power struggles happen"). Reading 4 is substantive but inherently anti-deterministic.
  *   **Inevitability vs. Contingency:**
      *   **Strong Determinism:** Reading 2 (Marxist class conflict) most strongly implies inevitability.
      *   **Ideological Determinism/Tendency:** Reading 3 (General Will logic) strongly suggests the Terror was a near-inevitable consequence of the revolution's core ideological commitment.
      *   **Weak Determinism/Tendency:** Reading 1 (Power Struggle) implies violence/purges are highly likely, but not the specific *form* or *scale* of the Terror.
      *   **Contingency:** Reading 4 explicitly argues the Terror was *not* inevitable, but contingent.
  *   **Does the Slogan Work for Contingency?**
      *   **Usually No, and Often Smuggles in Determinism:** The phrase *itself* carries a heavy deterministic connotation. "Devour" implies an almost biological, automatic process inherent to the entity "revolution." Using it typically evokes Readings 1-3, reinforcing the idea that this outcome is natural, predictable, and unavoidable for *any* revolution. It frames the Terror as an inherent *property* of revolution, not a contingent outcome.
      *   **Could it be Used for Contingency?** Only awkwardly and with significant qualification. One could argue: "Look at how revolutions *can* devour their children *if* specific conditions arise and choices are made, like we saw in the Terror due to X, Y, Z contingencies." However, this requires immediately undermining the slogan's inherent fatalism. It's fighting the metaphor. The slogan itself does no real *positive* work for contingency; it's a rhetorical burden the contingency argument has to overcome.

  **Conclusion:**

  Your seminar colleague likely deployed the slogan invoking **Reading 1 (Banal Power Struggle)** or **Reading 3 (Ideological Logic)**, implying a deterministic inevitability to shut down debate. However, the slogan itself is analytically weak. It obscures crucial distinctions between:

  *   A broad tendency towards violence in regime change (common, but variable).
  *   A specific structural conflict *within* the revolution (Marxist view).
  *   The internal logic of a specific ideology driving purification.
  *   The role of contingency, choice, and accident.

  **To defend contingency effectively against this slogan:**

  1.  **Challenge the Metaphor:** Point out that "devouring children" is fatalistic imagery, not analysis. Revolutions are complex processes, not mythical beasts with predetermined appetites.
  2.  **Emphasize Contingencies:** Highlight the specific, non-inevitable factors that led *this* revolution down the Terror path: the specific pressures of war, the specific nature of counter-revolution, the specific personalities involved, the specific choices made at key junctures (e.g., the King's flight to Varennes, the September Massacres, the expulsion of the Girondins).
  3.  **Contrast with Other Outcomes:** Point to revolutionary moments (e.g., 1830, 1848 in some places, even aspects of 1789-91) or other revolutions that didn't descend into systematic, ideologically-driven terror on the same scale, demonstrating that it's not an *inevitable* phase.
  4.  **Focus on Agency:** Argue that Robespierre, the Committee of Public Safety, and others *made choices*. They interpreted events, shaped ideology, and decided on repression. Different choices under the same pressures *could* have led to different outcomes.

  The slogan "revolutions devour their children" is powerful rhetoric but poor history. It flattens complexity and smuggles in determinism. Unpacking it, as you're doing, is essential for serious historical debate about the Terror's origins. Good luck countering that shutdown move!
