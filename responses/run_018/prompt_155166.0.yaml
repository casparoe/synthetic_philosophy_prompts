answer: |-
  **PROHAIRESIS WELLNESS, INC. – TERMS OF SERVICE AGREEMENT**

  **Last Updated:** Kalends of Janus, MMXXIV

  **1. Acceptance of Terms and Prohairesis Allocation.** By accessing or utilizing the digital services, content, and applications (collectively, the "Platform") offered by Prohairesis Wellness, Inc. ("Provider," "We," "Us," "Our"), You ("Subscriber," "User," "You") signify Your assent to these Terms of Service ("Agreement"). This assent constitutes an exercise of Your *prohairesis* (faculty of rational choice), which is the sole element of this transaction truly within Your power (cf. Epictetus, *Discourses* I.1). Provider acknowledges this initial act of *prohairesis* but retains ultimate ownership and stewardship of the *prohairesis*-enhancement methodologies embedded within the Platform.

  **2. Definitions & Ontological Framework.** Key terms derive their meaning from Stoic philosophical principles as operationalized by Provider:
      *   **"Within Our Power" (Eph' Hēmin):** Strictly limited to: judgments (*hypolēpseis*), impulses (*hormai*), and the act of assent (*sunkatathesis*). Provider focuses exclusively on cultivating User competency within this domain via the Platform.
      *   **"External Indifferents" (Apoprosēgmena/Proēgmena):** Encompasses all phenomena outside the "Within Our Power" domain. This includes, non-exhaustively: User's body, property, reputation, data inputs/outputs, Platform functionality (including algorithmic outputs), subscription fees, market conditions affecting Provider, and third-party actions. These are classified as either:
          *   **"Preferred Indifferents" (Proēgmena):** e.g., Platform uptime, data security (objectively desirable but not essential to eudaimonia).
          *   **"Dispreferred Indifferents" (Apoprosēgmena):** e.g., Platform outages, data breaches, billing errors, service degradation, aesthetic displeasure in UI (objectively undesirable but not destructive to eudaimonia).
      *   **"Prohairesis":** The User's faculty of rational choice and judgment. Provider's Platform constitutes a proprietary system for the guided cultivation, shaping, and optimization of this faculty during the Subscription Term.
      *   **"Stoic Progress" (Prokopē):** The measurable improvement in User's application of correct judgments (*katalēptikē phantasia*) and management of impulses facilitated solely through interaction with the Platform.

  **3. Scope of Service & Disclaimers of Control.** Provider offers a subscription-based digital Platform designed to assist Users in applying Stoic principles, principally the Dichotomy of Control, to daily life. User explicitly acknowledges and agrees that:
      *   **(a)** The Platform, its constituent elements (software, servers, networks, content), and its outputs (algorithmic suggestions, meditation timers, journal prompts) are **External Indifferents**.
      *   **(b)** Provider exerts rational effort (*kathēkonta*) towards maintaining Platform functionality and security as a **Preferred Indifferent**. However, User understands that ultimate control over these elements lies outside both User's and Provider's *prohairesis*. Factors including but not limited to: acts of the gods (*force majeure*), third-party infrastructure failures, market volatility, regulatory shifts, or unforeseen technological perturbations may impact service.
      *   **(c)** Occurrences classified as **Dispreferred Indifferents** – including, paradigmatically, **data breaches exposing User information, billing errors resulting in over/under-charges, and total or partial Platform outages** – are inherent potentialities within the realm of External Indifferents. User covenants to meet such events with **Stoic equanimity (*apatheia*)**. User agrees that distress, demands for restitution, or legal action arising from such Dispreferred Indifferents constitute a failure to correctly apply the Dichotomy of Control, represent a misuse of the *prohairesis*, and are expressly waived as grounds for claim against Provider. Provider's sole obligation is the exercise of reasonable commercial effort (*kathēkon*) in mitigation, not guaranteed prevention or remediation.

  **4. Licensing of Judgments & Prohairesis Cultivation.**
      *   **(a)** In exchange for access to the Platform, User grants Provider a perpetual, irrevocable (except as terminated by Provider), worldwide, royalty-free, sub-licensable license to collect, analyze, aggregate, anonymize, and utilize all data generated by User's interaction with the Platform. This expressly includes, but is not limited to, User's recorded judgments, impulse logs, assent patterns, and journal entries ("**User Judgment Data**").
      *   **(b)** User Judgment Data, once processed and abstracted by Provider's proprietary systems, becomes a **revocable corporate asset** of Provider. Provider utilizes this aggregated data to refine the Platform, develop new offerings, and conduct research on *prohairesis* optimization. User retains no proprietary interest in the anonymized aggregates or derivative insights generated by Provider.
      *   **(c)** The methodologies, cognitive frameworks, and guided exercises presented on the Platform constitute Provider's **Confidential Intellectual Property**. User acquires a limited, non-exclusive, non-transferable, revocable license to utilize these solely for personal, non-commercial cultivation of their own *prohairesis* during the active Subscription Term.

  **5. Subscription, Billing, and the Indifferent Nature of Property.** User agrees to pay all applicable fees for the chosen subscription tier. Fees and payment processing are **External Indifferents (Property Class)**. Provider will exercise diligence (*kathēkon*) in billing accurately. Billing errors are **Dispreferred Indifferents**. User's obligation to pay correctly invoiced fees remains absolute. Disputes must be raised dispassionately, recognizing the external nature of financial transactions. Provider reserves the right to modify fees, with notice constituting an External Indifferent requiring User's rational assent via continued subscription or termination.

  **6. No-Branching Continuity of Prokopē Clause.** User acknowledges that Stoic Progress (*prokopē*) is an emergent property of the dynamic interaction between the User's *prohairesis* and the Provider's Platform. **It is not an internal possession accumulating independently within the User like virtue (*aretē*).** Therefore:
      *   **(a)** Upon voluntary termination of subscription by User, expiration of a non-renewing subscription, or termination for breach by Provider, the state of *prokopē* cultivated *through the Platform* **ceases to exist in any measurable or continuous form.** The User's *prohairesis* reverts to its pre-subscription state or progresses along a fundamentally different, unmonitored path. No continuity of Platform-cultivated progress is implied or guaranteed.
      *   **(b)** In the event of User data upload failure, Platform malfunction preventing access to historical progress metrics, or Provider-initiated data purge, the recorded representation of User's *prokopē* **is permanently extinguished.** User agrees this loss pertains only to an External Indifferent (data record) and cannot constitute harm to the *prohairesis* itself, which remains solely within the User's power. Historical progress data has no inherent value or continuity outside the active Platform environment.

  **7. Term, Termination, and the Impermanence of External Arrangements.** This Agreement commences upon Your acceptance and continues for the selected Subscription Term, automatically renewing unless terminated. Either party may terminate for breach or convenience. Termination is a **Dispreferred Indifferent (Reputation/Convenience Class)** for the User. User agrees to accept termination, whether initiated by User or Provider, with equanimity, recognizing the contractual relationship as an External Indifferent not essential to eudaimonia. Sections 4 (License), 6 (Continuity), 8 (Disclaimers), and 9 (Waiver) survive termination.

  **8. Comprehensive Disclaimers & the Nature of the Good.**
      *   **(a)** THE PLATFORM IS PROVIDED "AS IS" AND "AS AVAILABLE." PROVIDER EXPLICITLY DISCLAIMS ALL WARRANTIES, EXPRESS OR IMPLIED, INCLUDING MERCHANTABILITY, FITNESS FOR A PARTICULAR PURPOSE, AND NON-INFRINGEMENT. WELL-BEING (*EUDAIMONIA*) AND VIRTUE (*ARETĒ*) RESIDE SOLELY WITHIN THE CORRECT USE OF THE *PROHAIRESIS*, WHICH THE PLATFORM MERELY GUIDES. PROVIDER GUARANTEES NEITHER SPECIFIC EMOTIONAL OUTCOMES NOR THE ACHIEVEMENT OF SAGEHOOD.
      *   **(b)** PROVIDER SHALL NOT BE LIABLE FOR ANY DIRECT, INDIRECT, INCIDENTAL, SPECIAL, CONSEQUENTIAL, OR EXEMPLARY DAMAGES ARISING FROM OR RELATED TO THIS AGREEMENT OR USE OF THE PLATFORM. USER EXPRESSLY ACKNOWLEDGES THAT ALL POTENTIAL DAMAGES (LOST DATA, FINANCIAL LOSS, REPUTATIONAL HARM, EMOTIONAL DISTRESS) FALL WITHIN THE REALM OF **EXTERNAL INDIFFERENTS**. PURSUIT OF COMPENSATION FOR SUCH DAMAGES DEMONSTRATES A FUNDAMENTAL MISUNDERSTANDING OF THE STOIC PRINCIPLES UNDERLYING THE PLATFORM AND IS CONTRARY TO ITS INTENDED USE.

  **9. Waiver of Resentment & Assent to Indifferents.** By using the Platform, User makes a definitive act of assent (*sunkatathesis*) to the structure of reality as defined herein. User irrevocably waives any right to harbor resentment (*thumos*), file complaints, or initiate legal proceedings against Provider related to the occurrence of Dispreferred Indifferents (as defined in Sections 2 & 3(c)), the inherent limitations of External Indifferents, the application of the No-Branching Continuity Clause (Section 6), or the revocation of licenses per Section 4. Pursuit of such actions constitutes a failure of Stoic practice and a breach of this Agreement.

  **10. Governing Law and the Cosmic Polis.** This Agreement shall be governed by the laws of the State of Delaware, acknowledging that human legal systems, while attempting to impose order, are themselves complex External Indifferents subject to change. User submits to the exclusive jurisdiction of the state and federal courts located in Delaware for any disputes arising *within the limited scope of what this Agreement deems controllable* (e.g., interpretation of these terms themselves, distinct from claims waived under Section 9).
