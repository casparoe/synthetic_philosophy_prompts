  Hmm, the user explicitly rejects bibliographic requests and wants strategic prioritization - that's unusual. Most academics would ask for sources, but they want methodological triage. Interesting. Their six-month part-time constraint means we must identify leverage points where limited research time yields maximum interpretive payoff. 

  The core tension I see is between Keynes as policy technocrat versus cultural philosopher. The user's framing of "upstream" questions suggests they want to resolve foundational ambiguities that ripple through contemporary post-scarcity debates. That "mental illness" clarification about money-love is particularly sharp - they've spotted a common misreading that needs neutralizing early.

  Right, so three key axes emerge: First, the metaphysics of needs (absolute vs relative) which underpins all scarcity discourse. Second, the teleology of leisure - is it Aristotelian instrument or Bloomsbury end? This determines how we read his arts patronage. Third, the institutional mechanics question about why the 15-hour week failed, which tests the whole framework's viability.

  The status competition versus institutional lock-in debate feels most urgent because it bridges theory and practice. If Veblen was right about positional goods, that invalidates Keynes' psychological assumptions - but if it's just path dependency, his core vision holds. This has direct policy implications for UBI pilots today. 

  That Bloomsbury/Aristotle dichotomy might be overrated though - the user's right to suspect false binaries. Keynes' letters show him rejecting "art for art's sake" while equally mocking utilitarian virtue. His "art as civilizing force" stance is actually a third position. Saving them from this rabbit hole could reclaim months of research time.

  The money-love clarification is crucial framing: Keynes saw money as conduit for power anxiety, not material goods themselves. Spotting this lets the user reframe anti-consumerism arguments without falling into ascetic tropes. That's exactly the nuance needed for modern post-growth debates.

  Prioritization logic: The needs framework (Question 1) must come first because without it, you can't evaluate what "solved scarcity" even means. Then the leisure purpose (Question 2) as it sets cultural policy parameters. Finally the prediction failure (Question 3) as stress-test. Each unlocks the next - like analytical dependency chain.

  What would change my mind? If archival evidence showed Keynes explicitly endorsed art's autonomy beyond social utility, that would collapse Question 2's significance. Or if new institutional economics papers proved cognitive capitalism inherently requires >15 work hours regardless of policy, that would elevate Question 3.

  For tractability: Question 1 needs philosophy texts but no econometrics. Question 3 requires some institutional theory but accessible through political science. Only Question 2's aesthetic theory might require specialized reading - but the user's Bloomsbury reference suggests existing familiarity.

  Downstream bite is clear: Getting Question 1 right reshapes UBI design by defining needs thresholds. Question 2 determines whether we fund opera or TikTok dance challenges as "cultural nourishment." Question 3 tells us if work-hour reduction requires revolutionizing capitalism or just tweaking welfare states.

