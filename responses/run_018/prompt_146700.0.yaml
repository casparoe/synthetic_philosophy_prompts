prompt: |-
  I'm leading a reading group of smart non-philosophers next week and I want to teach them why distributed computation doesn't automatically get moral status just because it mirrors suffering functions. Don't explain the philosophy to me — map the teaching plan. What's the dependency order? I think functionalism about mind has to come first, but then I need to hit the 'where is the subject' problem before anyone gets comfortable. The carrying example should be a climate model running across fifty servers with no central hub that accidentally optimizes for storm intensity in a way that structurally mirrors nociception — tell me exactly what that example must include and what it has to lack so it doesn't just collapse into 'it's computing weather.' Then the misconception map: thier almost certainly think 'if it behaves like pain then it is pain' and that 'distributed just means one big computer.' Where exactly in the sequence do I head each one off? Give me one check question for the end that proves they've grasped why the boundary problem isn't just about scale or complexity. And tell me explicitly what to leave out at this level — I'm guessing the global workspace literature — and why leaving it out protects the point rather than weakening it.
reasoning: |-
  Okay, let's tackle this user's request. They're leading a reading group for smart non-philosophers and need to explain why distributed computation doesn't automatically have moral status just because it mirrors suffering functions. 

  First, I need to understand the user's main concerns. They want a teaching plan with a clear dependency order. They mentioned starting with functionalism about mind, then addressing the 'where is the subject' problem. The example they proposed involves a climate model across fifty servers that accidentally mirrors nociception. I have to ensure this example doesn't get mistaken as just computing weather. 

  The user also points out two common misconceptions: equating behavior with pain and thinking distributed systems are just one big computer. I need to pinpoint where in the sequence to address each. Plus, they want a check question at the end to confirm understanding of the boundary problem beyond scale or complexity. 

  I should consider what to exclude. The user mentioned avoiding global workspace literature to keep the focus sharp. Including it might lead the discussion towards mechanisms of consciousness rather than the core issue of subjective experience. 

  For the dependency order: Functionalism first makes sense because it's the foundation. Without establishing that mental states are defined by function, the subsequent points won't hold. Then the 'where is the subject' problem directly challenges the assumption that functional equivalence implies a subject. 

  The climate model example needs specific elements: structural mirroring of nociception (like input-output patterns), distributed computation without a central hub, and accidental optimization for storm intensity. Crucially, it must lack any integration or global state that could constitute a unified perspective. 

  Addressing misconceptions: The 'behavior equals pain' idea should be countered when discussing functionalism vs. phenomenology. The 'one big computer' myth needs clarification during the distributed systems explanation. 

  The check question should force them to identify why adding servers doesn't solve the boundary issue. For example, scaling up the climate model doesn't create a subject if there's no integration. 

  Leaving out global workspace theory prevents shifting focus to cognitive architectures. The goal is to highlight the absence of a subject, not the mechanisms that might support one. This keeps the argument tight and accessible for non-philosophers.
answer: |-
  Here’s a battle-tested teaching plan optimized for sharp non-philosophers, designed to surgically dismantle the target misconception:

  **Core Dependency Order:**  
  1. **Functionalism 101** (Necessary Foundation)  
     *Teach:* Mental states = functional roles (inputs → processing → outputs).  
     *Example:* Pain = system detecting damage → triggering avoidance + attention focus.  
     *Key:* Emphasize this is *third-person perspective* on cognition.  

  2. **The Subject Problem** (Critical Pivot)  
     *Teach:* Functional roles ≠ subjective experience ("what it’s like").  
     *Analogy:* A perfect flight simulator doesn’t *experience* G-forces.  
     *Hammer:* "Functionalism tells us *what pain does*, not *that anyone feels it*."  

  3. **Distributed Systems Demystified**  
     *Teach:* "Distributed" = no unified perspective, no global state binding.  
     *Analogies:*  
     - 50 people independently solving 1% of a puzzle ≠ one mind solving the puzzle.  
     - Ant colony ≠ "group mind" with unified experience.  

  ---

  ### **The Climate Model Example: Precision Specs**  
  **Must Include:**  
  - **Structural mirroring:** Local nodes process pressure/temperature data → output "damage signals" (e.g., activating "emergency shutdown" flags) when thresholds are crossed.  
  - **Accidental nociception pattern:** Feedback loops amplify "storm intensity" outputs *in a way that maps isomorphically* to pain pathways (stimulus → encoding → behavioral response).  
  - **No integration:** Each server only "knows" its 2% of the system; no hub synthesizes data into a global state.  

  **Must Lack:**  
  - **Unified perspective:** No component "experiences" the storm.  
  - **Global workspace:** No central broadcast mechanism for information integration.  
  - **Goal-directedness:** The "optimization" is an emergent glitch, not a system-level goal.  

  *Why it works:* Highlights functional isomorphism + distributed architecture *without* implying a subject.  

  ---

  ### **Misconception Interdiction Plan**  
  | **Misconception**              | **When to Strike**               | **Counter-Tactic**                                                                 |  
  |--------------------------------|----------------------------------|------------------------------------------------------------------------------------|  
  | "Behaves like pain → *is* pain"| After Step 2 (Subject Problem)   | *Contrast:* "Your Fitbit tracks heart rate → is it *experiencing* cardio?"         |  
  | "Distributed = one big computer" | During Step 3                    | *Visual:* Show network diagram with isolated nodes → "Where’s the *I* here?"       |  

  ---

  ### **Check Question (Proves Boundary Insight)**  
  > *"If we scale the climate model to 500 servers, each mirroring nociceptive functions more precisely, does it become 1% more likely to have moral status? Why/why not?"*  

  **Target Insight:** Scale/complexity ≠ subjectivity. Missing ingredient: *integrated point of view*.  

  ---

  ### **Strategic Omissions & Why**  
  1. **Global Workspace Theory (GWT)**  
     *Why omit:* GWT focuses on *how* integration *could* happen, distracting from the core point that *no integration exists* in this case. Risk: Students might think "integration is technically possible" → moral status debate.  
  2. **Philosophical Zombies**  
     *Why omit:* Too abstract; distracts from architectural critique.  
  3. **Specific Theories of Consciousness** (IIT, Higher-Order Thought)  
     *Why omit:* Overcomplicates; your goal is *negative* (why this *isn't* conscious), not positive theory.  

  **Protection Mechanism:** By omitting integration mechanics, you force focus on the *absence of a subject* in distributed architectures. Adding GWT would make the absence seem contingent rather than structural.  

  ---

  **Session Flow (90 mins):**  
  1. (15 min) Functionalism crash course + Q&A.  
  2. (20 min) Subject Problem exercise: "Describe a system that *functions* like it’s angry but *isn’t*."  
  3. (20 min) Distributed systems primer + climate model deep dive.  
  4. (20 min) Misconception busting: Role-play both fallacies.  
  5. (15 min) Check question debate → cement boundary problem.  

  **Final Weapon:** "If the storm-model *were* suffering, would adding 10 servers lessen its pain? If not, why call it *one* sufferer?" This exposes the incoherence of ascribing unitary experience to fragmented systems.
