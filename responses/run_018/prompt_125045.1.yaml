answer: |-
  Here’s a rigorous analysis of Brexit through the lens of "performative sovereignty," mapping the actors, options, and rhetorical functions while highlighting tensions and limitations:

  ### Core Thesis Tested  
  **Performative sovereignty**: The claim that "the will of the people" is not a pre-existing, discoverable entity but a political subject *constituted* through the act of claiming to represent it. This transforms rhetoric from *descriptive* (reporting a fact) to *performative* (creating the reality it names).

  ---

  ### Phase-by-Phase Analysis: Players, Options, and the "Will" as Speech Act

  | **Phase**               | **Key Players**                          | **Options/Framings**                                  | **Function of "Will of the People"**                                                                 | **Performative Effect**                                                                 |
  |--------------------------|------------------------------------------|------------------------------------------------------|------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------|
  | **Campaign (2016)**      | Leave Campaign (Vote Leave, Leave.EU)    | **Direct Democracy vs. Elitist Parliament**          | **Constitutive**: Unifies disparate anti-EU sentiments ("Take Back Control") into a single "People" opposed to "elites." | Creates a collective subject ("the 52%") from fragmented grievances; erases internal contradictions (e.g., Lexiteers vs. free-marketeers). |
  | **Post-Vote (2016-2017)**| May Government, Brexit Press             | **Mandate vs. Legitimacy Challenge**                 | **Silencing Tool**: Describes the referendum result as monolithic, irreversible.                      | Performs exclusion: The "48%" are framed as disloyal or irrelevant. "The People" becomes a weapon to suppress dissent. |
  | **Miller Case (2017)**   | UK Supreme Court, Parliament             | **Parliamentary Sovereignty vs. Referendum Mandate** | **Rhetorical Counterweight**: Leavers invoke it descriptively ("the people have spoken"), but courts reject its *legal* authority. | Exposes the theory’s limit: Institutions (courts) treat "the people" as politically inert without parliamentary mediation. |
  | **Negotiations (2017-2019)** | May Government, EU, ERG                 | **"Clean Break" vs. Compromise**                     | **Bargaining Chimera**: Describes an unambiguous demand for hard Brexit, masking internal divisions. | Performs unity: Attempts to solidify "the People" against EU "obstruction," but EU pragmatism fractures the illusion by exposing UK disunity. |
  | **Parliamentary Deadlock (2019)** | MPs, Johnson Government                | **Implementing vs. Rejecting May/Deal**              | **Weaponized Symbol**: Johnson uses it performatively to purge "rebel" MPs; opponents frame it as a "fraudulent" construct. | Performative failure: Rhetoric cannot override parliamentary arithmetic or material interests (e.g., ERG vs. DUP). "The People" splinters under scrutiny. |

  ---

  ### Where the Framing Breaks: Limits of Performative Sovereignty

  1. **The 48% and Regional Divides**:  
     - **Problem**: The theory struggles with *durable counter-constructions*. Scotland (62% Remain) and Northern Ireland (56% Remain) rejected the "People" as framed. The 48% sustained opposition think tanks (e.g., Best for Britain), legal challenges, and protests, creating a rival "people" (e.g., "The People’s Vote" campaign).  
     - **Theoretical Implication**: Populism may *require* a pre-existing fissure (e.g., English nationalism) to exploit. Performative rhetoric amplifies but cannot wholly invent foundational divides.

  2. **Miller Judgment & Parliamentary Sovereignty**:  
     - **Reality Check**: The Supreme Court ruled that "the people" via referendum cannot override constitutional law—only Parliament can. This exposed "will of the people" as *politically potent but legally empty*. The subsequent gridlock (May’s deal defeated 3x) proved Parliament could not be "performed" into compliance.  
     - **Theoretical Tension**: Institutions retain agency to resist performative claims, revealing sovereignty as a *structure*, not just a speech act.

  3. **Populism’s Dependence on Pre-Existing Identity**:  
     - Leave’s "People" leaned on latent English/British identity tropes (sovereignty, immigration control). The campaign *activated* but did not *create* these. When performative rhetoric clashed with material realities (e.g., Northern Ireland’s Good Friday Agreement), the pre-existing identity fissures reasserted dominance.  
     - **Critical Weakness**: Performative sovereignty cannot sustain unity when material consequences (e.g., trade barriers) force concrete choices, fracturing the constructed "people."

  ---

  ### Does the Concept Earn Its Keep?  
  **Yes, but with crucial caveats**:  
  - **Strengths**: Brilliantly explains how Leave’s rhetoric *manufactured democratic legitimacy* post-vote, transforming a narrow majority into an irresistible mandate. It reveals populism’s core mechanism: claiming to "discover" the people’s will is itself an act of creation.  
  - **Limitations**: It overestimates rhetoric’s power to erase institutional constraints (courts, Parliament) and enduring identities. The 48%’s persistence and regional splits confirm that performative acts compete within a field of *pre-existing* identities and interests.  
  - **Refined Insight**: **Populism performs "the people" not ex nihilo, but by simplifying, amplifying, and weaponizing latent divisions.** When material stakes escalate, the performative edifice crumbles against harder realities.

  ### Conclusion for Your Piece
  Brexit showcases performative sovereignty’s power to *generate temporary political reality*—but also its fragility when confronting institutional inertia, pluralist dissent, and entrenched identities. The "will of the people" functioned as a speech act that *constituted authority* for Leave, yet its failure to dissolve the 48% or override Parliament proves that democratic rhetoric cannot fully escape pre-existing social and structural constraints. The concept earns its keep by exposing populism’s circular logic, but Brexit ultimately reveals its limits: sovereignty is performed, but never infinitely malleable.
