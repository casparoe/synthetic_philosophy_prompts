answer: |-
  Here's a breakdown of Williams vs. Appiah on the end of dueling, plus that third angle, keeping settled facts and contested interpretations clear:

  **Settled Fact:** Formal pistol dueling (especially among European/American elites) declined sharply in the mid-to-late 19th century, becoming socially unacceptable and largely illegal.

  **Bernard Williams' Lens (Honor/Shame Shift):**
  *   **Core Idea:** Moral revolutions happen when the underlying *structure of honor and shame* changes. People stop doing X not because they're rationally convinced it's wrong *first*, but because they start feeling *shame* for doing X and *honor* for avoiding it. Arguments follow the shift, justifying the new emotional reality.
  *   **Applied to Dueling:** The decline happened when defending one's honor via a duel stopped being seen as *truly honorable* and started being seen as *shameful* – barbaric, childish, wasteful, or ridiculous. This shift wasn't necessarily driven by rational arguments *against* dueling's morality, but by a changing sensibility within the elite class. Maybe the rising middle class's values (thrift, productivity, domesticity) infiltrated aristocratic circles, making the violent ritual seem gauche. Public ridicule in newspapers/novels could amplify the *shame* factor. The crucial point for Williams is that the feeling changed *first*; the arguments condemning it as "immoral" gained traction *because* people were already feeling uneasy or embarrassed by it.

  **Kwame Appiah's Lens (Honor vs. Other Commitments):**
  *   **Core Idea:** Honor codes shift when maintaining them clashes significantly with *other deeply held interests, practices, or beliefs* that people value *more*. It's a pragmatic friction, not necessarily a rational defeat of the honor code's logic. People prioritize other things.
  *   **Applied to Dueling:** Dueling declined because the costs/risks of adhering to the honor code increasingly clashed with other elite interests:
      *   **Economic/Professional:** Industrialization/commerce demanded stability and reliability. Dying in a duel over an insult was bad for business/careers. Missing work for wounds/recovery became less acceptable.
      *   **Legal/State Power:** Strengthening states monopolized violence. Duels challenged state authority and wasted valuable military/civil officers. Prosecution became more likely/enforced.
      *   **Changing Beliefs:** Enlightenment ideals of reason, civility, and human life's value (already held by many) gained more traction. Dueling seemed irrational and wasteful of life *compared* to these values. Religious condemnation (always present) gained more weight when combined with these other factors.
      *   **Risk/Reward Mismatch:** The chance of death/injury became seen as disproportionate to the offense (often trivial insults). The "honor payoff" wasn't worth the risk anymore. Appiah emphasizes this *clash* making the honor code unsustainable in practice.

  **The Third Angle: Technical Obsolescence Enabling Moral Condemnation**
  *   **Core Idea:** Once a practice (like dueling) is no longer *functionally necessary* for maintaining the social status/position it was designed to protect, it loses its core justification and becomes vulnerable to being re-evaluated purely as a *moral* issue. The practical shield falls away.
  *   **Applied to Dueling:** Dueling was fundamentally a mechanism for aristocratic status maintenance – proving courage, defending personal/family honor crucial for social standing and influence. In the 19th century:
      *   Aristocratic power waned relative to bourgeois wealth and state bureaucracy. Status became less dependent on personal martial prowess and ancient lineage, more on money, profession, or bureaucratic position.
      *   Professional militaries reduced the elite's monopoly on arms/combat.
      *   **Connection:** This obsolescence *enabled* the shifts Williams and Appiah describe. Once dueling wasn't *needed* to be a respected gentleman/officer...
      *   Williams: The *feeling* that it was honorable could evaporate faster, replaced by shame over its pointlessness/violence.
      *   Appiah: The clash with economic interests, legal authority, and life-value became *decisive* because the core status-maintaining function was gone. There was less to lose by abandoning it.
      *   **Where it sits:** It complements **both** but offers a distinct precondition. It explains *why* the honor code became unstable enough for Williams' shame shift *or* Appiah's clash of commitments to topple it. It highlights how the *material basis* of the honor practice disappearing opens the floodgates for moral reevaluation. It might sit slightly "below" their mechanisms as a facilitating factor.

  **Contested Ground (Key Disagreements):**

  1.  **Primacy of Emotion vs. Pragmatism:** Did the *feeling* of honor/shame change first (Williams), driving abandonment, or did pragmatic conflicts (Appiah) force the change, with feelings adjusting afterward? Historians debate the sequence.
  2.  **Effectiveness of Moral Arguments:** Williams downplays rational arguments *causing* the shift; they follow. Appiah sees existing moral beliefs (like valuing life) as one *type* of competing commitment that clashes with the honor code. Others argue abolitionist *campaigns* (using moral arguments) played a more direct causal role.
  3.  **Role of State/Law:** Was legal prosecution a primary driver (Appiah's clash with state power) or did laws only become effective *after* the social honor/shame shift made prosecution acceptable (Williams)? Did the state lead or follow society?
  4.  **The Third Angle's Weight:** How critical was the actual *obsolescence* of dueling for status maintenance? Was it merely one factor among Appiah's "clashes," or the fundamental precondition enabling the moral revolution? Some argue elements of status-through-courage persisted, just channeled differently (e.g., colonial military service).

  **In a Nutshell for Your Dataset:**

  *   **Williams:** Dueling died cuz elites started feeling **shame** doing it & it wasn't **honorable** anymore. Feelings changed first, morals followed.
  *   **Appiah:** Dueling died cuz sticking to the honor code **clashed too hard** with other stuff elites cared about more: **$$$, careers, the law, not dying pointlessly, "civilized" values**.
  *   **Third Angle:** Dueling became **vulnerable to moral attack** precisely because it **stopped being necessary** for maintaining elite status/power in the changing 19thC world. Practical use gone = open season for condemnation. (Complements both W & A, explains vulnerability).
  *   **Settled:** Dueling declined massively in 19thC.
  *   **Contested:** *Why* exactly? Chicken-or-egg on shame vs pragmatism, role of law/state, weight of moral arguments, importance of pure obsolescence. No single consensus driver.

