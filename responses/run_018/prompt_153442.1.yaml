answer: |-
  **Final Exam Prompt: Formal Epistemology & Belief Revision**  
  *(Time: 90 minutes | Expected Length: ~700 words | Total Marks: 25)*  

  > Dr. Aris Thorne, a climate scientist, holds a uniform prior over three mutually exclusive climate models:  
  > **M1** (Stable Climate; predicts mean temp ΔT ≈ 1.0°C),  
  > **M2** (Slow Warming; predicts ΔT ≈ 1.8°C),  
  > **M3** (Fast Warming; predicts ΔT ≈ 2.3°C).  
  >  
  > Her satellite instrument returns a *graded temperature reading* for global ΔT:  
  > - 70% confidence that ΔT ∈ [1.5, 2.0]°C  
  > - 30% confidence that ΔT ∈ [2.0, 2.5]°C  
  >  
  > Each model \(M_i\) predicts a probability distribution over ΔT (e.g., M2 concentrates mass near 1.8°C, M3 near 2.3°C). Dr. Thorne uses Jeffrey conditionalization to update her credence in M1–M3.  

  **Answer the following:**  
  **(a)** Explain why this scenario *requires* Jeffrey conditionalization rather than ordinary Bayesian conditioning on a single evidence proposition. (5 marks)  
  **(b)** Write the Jeffrey update equation for \(P_{\text{new}}(M_k)\) using the partition \(\{E_1: \Delta T \in [1.5,2.0], E_2: \Delta T \in [2.0,2.5]\}\). Explicitly show how the 70% and 30% weights enter the calculation. (Do not compute numerical values). (7 marks)  
  **(c)** A student argues: *"The satellite assigns 70% to [1.5,2.0], so just compute \(P(M_k | E_1)\) using Bayes’ rule, where \(P(E_1)\) is the prior probability of E1 derived from the models."* Diagnose the exact error in this reasoning. Focus on how it misinterprets the confidence weights. (6 marks)  
  **(d)** Discuss the **granularity objection**: If Dr. Thorne splits the range into *three* bins (e.g., [1.5,1.8], [1.8,2.1], [2.1,2.5]), her posterior over M1–M3 might change. What constrains the choice of partition? Connect this to the need for an *exhaustive and exclusive* calibration convention tied to the evidence space. Why does this matter for scientific objectivity? Finally, does the "hypothesis-independence" assumption hold here (i.e., is the instrument’s error calibration independent of the true warming rate)? Briefly note a concern. (7 marks)  

  ---

  **Model Answer** (Approx. 600 words)  

  **(a)** Ordinary Bayesian conditioning requires conditioning on a *single, certain* evidence proposition (e.g., "E: ΔT = 1.7°C"). Here, the evidence isn’t certain; the instrument provides direct *posterior weights* over two intervals (70% on [1.5,2.0], 30% on [2.0,2.5]). Jeffrey conditionalization handles cases where evidence prompts a redistribution of credence over a partition without certainty in any one cell. Bayes’ rule cannot directly input such graded confidence.  

  **(b)** The Jeffrey update for partition \(\{E_1, E_2\}\) with weights \(P_{\text{new}}(E_1) = 0.7\), \(P_{\text{new}}(E_2) = 0.3\) is:  
  \[
  P_{\text{new}}(M_k) = P_{\text{new}}(E_1) \cdot \frac{P(M_k \cap E_1)}{P_{\text{old}}(E_1)} + P_{\text{new}}(E_2) \cdot \frac{P(M_k \cap E_2)}{P_{\text{old}}(E_2)}  
  \]  
  Equivalently, since \(P(M_k | E_i) = \frac{P(M_k \cap E_i)}{P_{\text{old}}(E_i)}\):  
  \[
  P_{\text{new}}(M_k) = 0.7 \cdot P(M_k | E_1) + 0.3 \cdot P(M_k | E_2)  
  \]  
  The weights (0.7, 0.3) enter as coefficients scaling the Bayesian conditionals \(P(M_k | E_i)\). The terms \(P_{\text{old}}(E_i)\) normalize the likelihoods.  

  **(c)** The student’s error lies in treating the 70% weight as the *prior probability* \(P_{\text{old}}(E_1)\)—which is derived from the models—rather than the *posterior assignment* \(P_{\text{new}}(E_1)\). The satellite’s 70% is Dr. Thorne’s *directly adopted posterior credence* in \(E_1\) after seeing the instrument output. Using Bayes’ rule to compute \(P(M_k | E_1)\) assumes \(E_1\) is certain, ignoring the 30% residual uncertainty in \(E_2\). This distorts the update by oversimplifying the ambiguous evidence.  

  **(d)** The **granularity objection** notes that Jeffrey’s rule is partition-dependent: finer bins may yield different posteriors. The partition must be:  
  - **Exhaustive & exclusive**: Intervals must cover all possible outcomes (ΔT ∈ [1.5,2.5]) without overlap.  
  - **Calibrated to evidence space**: The instrument outputs confidence over *these specific bins*, so the partition must match its reporting convention. Arbitrary bin splits don’t reflect the evidence structure.  

  **Scientific objectivity** requires that the partition aligns with how the instrument *reports uncertainty*. If bins are arbitrary, posteriors become subjective artifacts. Here, objectivity is anchored to the instrument’s design: its confidence weights define the evidence partition.  

  **Hypothesis-independence**: The update assumes \(P_{\text{new}}(E_i)\) is fixed regardless of \(M_k\). This *may fail* if instrument error depends on warming rates (e.g., sensor drift correlated with ΔT). If \(P_{\text{new}}(E_i)\) is unreliable under M3 (fast warming), Jeffrey’s rule is invalid. Dr. Thorne must assess whether the 70/30 weights are robust across models.  

  ---

  **Marking Scheme** (Total: 25 marks)  

  | **Must-Hit Point**                                                                 | **Marks** | **Common Mistake**                                  |  
  |------------------------------------------------------------------------------------|-----------|-----------------------------------------------------|  
  | **(a) Correctly identifies non-certain evidence & need for redistribution over partition.** | 5       | Says "Bayes can’t handle intervals" (misses direct posterior input). |  
  | **(b) Writes full Jeffrey equation; weights scale Bayesian conditionals \(P(M_k\|E_i)\).** | 7      | Omits normalization (\(P_{\text{old}}(E_i)\)) or misplaces weights. |  
  | **(c) Diagnoses conflation of \(P_{\text{new}}(E_1)\) with \(P_{\text{old}}(E_1)\); ignores residual uncertainty.** | 6     | Claims "student used wrong prior" (misses core misinterpretation). |  
  | **(d1) Explains partition choice requires exhaustivity/exclusivity tied to instrument output.** | 3     | Suggests bins can be arbitrary if "fine-grained". |  
  | **(d2) Notes objectivity relies on calibration convention matching evidence space.** | 2     | Treats partition choice as purely subjective. |  
  | **(d3) Flags risk of hypothesis-dependent instrument error.**                      | 2     | Assumes weights are always reliable. |  

  *Note: Partial marks for incomplete/partly correct answers. Award 1 mark for structure/clarity if all content is present.*
