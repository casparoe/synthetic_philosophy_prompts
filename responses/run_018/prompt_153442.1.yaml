prompt: |-
  hey im drafting the final for my grad seminar on belief revision and formal epistemology (we did Jeffrey, Carnap-style induction, the usual). i want one essay question thats not just "explain Jeffrey conditionalization with the boxes example" — i want it in the weeds so they cant just recite teh textbook.

  set up this scenario: a climate researcher is updating credences over three models — M1 (stable climate), M2 (slow warming), M3 (fast warming) — after getting a satellite temperature reading. but the instrument doesnt return a point value; it returns a graded interval split with internal confidence weights: 70% on [1.5, 2.0] and 30% on [2.0, 2.5]. her prior over M1/M2/M3 is uniform, and each model predicts a different distribution over these ranges.

  the exam question should ask them to:

  (a) say precisely why this is Jeffrey conditionalization rather than ordinary Bayes conditioning on a single evidence proposition.

  (b) apply Jeffrey's rule using a partion anchored to those two intervals — they should write out the correct update equation with the right terms (no need to crunch every decimal, but they must show how the 70/30 weights enter the numerator and denominator).

  (c) diagnose the following rival argument: "the satellite gives 70% to the first bin, so just condition on E1 = 'temp is in [1.5,2.0]' using Bayes rule with P(E1) computed from the prior over the models." explain exactly where that reasoning slips — specifically that it treats the confidence weights as prior probabilities of discrete propositions rather than direct posterior assignments over a partion.

  (d) discuss the "granularity objection": if she splits the range into three bins instead of two she might get different posteriors for M1-M3, so what constrains the choice of partion? tie this to the idea that in continuous measurement spaces Jeffrey's rule needs a calibration convention that is exhuastive and exclusive relative to the evidence space, and say why that matters for scientific objectivity. also check whether the "hypothesis-independence" assumption holds here — that is, whether the probabilities assigned over the partion are held fixed regardless of which hypothesis is true — and note that it might fail if the instrument's calibration error itself depends on the warming rate.

  please provide:

  - the exam prompt (90 minutes, about 700 words expected, 25 marks total)
  - a model answer of about 600 words
  - a marking scheme with 5 must-hit points, the marks each is worth (summing to 25), and a one-line note on the typical mistake for each

  no citations, bibliographies, or reading lists — this should be answerable from course material and reasoning alone. keep it casual, and feel free to leave a typo or two in the prompt text itself if that fits the dataset vibe.
