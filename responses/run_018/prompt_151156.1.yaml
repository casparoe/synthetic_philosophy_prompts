prompt: |-
  hey, i'm prepping for a podcast intervew with a historian who just published a book arguing that asking "who started the cold war" is basically a courtroom morality mistake — he wants to swap blame for what he calls "structural culpabilty gradients" spread across alliance architectures instead of pinned on one state. i need about eight sharp questions, not just "tell us your thesis." i want one that forces him to apply the gradient idea to concrete cases: can his model actually tell us whether the berlin blockade and the cuban missile crisis differ in intensity, or does it just smear responsibility everywhere? another that anticipates the standard reply — he'll probably say traditionalists are just laundering soviet aggression through jargon — so i need a follow-up that makes that defense harder. also ask whether his framework accidentally kills agency: if culpability is structural, was the cold war inevitable? and maybe one about whether democratic publics can even understand distributed blame, or if this is just an academic escape hatch. write it casual — i'm a novelist, not a prof, and don't turn it into a dissertation. maybe include a typo or two, i'm typing this on my phone.
reasoning: |-
