  Okay, the user is a retired experimental physicist diving into philosophy, specifically asking for desiderata for a theory of causation by omission that's useful for scientific explanation. They want a formal specification without bibliographies or surveys. Let me unpack their query.

  First, they have five key points: distinguishing genuine omission from mere absence, preserving asymmetry, separating cause from background condition, handling absences without energy/momentum, and dealing with double omissions. Each needs a clear requirement with a motivating case.

  Starting with (1): distinguishing omission from absence. They mention a replication study where a missing shielding mechanism causes failure. The theory must differentiate between something being absent in a causally relevant way versus just not being there. Non-negotiable because science often attributes failures to missing components. But here's the rub: how does this mesh with (4), where absences have no physical force? That might be a conflict point.

  For (2), asymmetry. Omitting a harmful exposure causes harm, but omitting harm doesn't cause benefit. Need to avoid reducing this to normativity. Essential because causation in science isn't symmetric like correlation. Probabilistic accounts might handle this by linking omissions to increased risk, but normativity sneaks in with "harmful."

  (3) is about cause vs. background. Redundant controls in experiments mean multiple absent factors could be blamed. The theory must pinpoint which omission is the cause. Non-negotiable for experimental rigor. Counterfactual approaches help here—what if only this one was present?

  (4) is tricky. Absences don't carry energy, yet are explanatory. Must reconcile physical reality with scientific practice. Non-negotiable but tough. Maybe causation by omission is more about counterfactual dependence than physical force. But does that satisfy a physicist used to energy transfers?

  (5) double omissions. Both A and B absent, but not necessarily double causation. For example, missing backup systems—only one omission is causal. Non-negotiable to avoid overcounting causes. Contextual dependence here.

  Now, potential conflicts: (1) and (4) together. If absences aren't physical, how can omitting a shield cause damage? This might require redefining 'causal' in physical contexts, perhaps shifting to difference-making rather than force. The user might be hinting at this tension, being a physicist.

  Also, the user's deeper needs: they want criteria rigorous enough for scientific explanation, not just everyday talk. They might be frustrated with philosophical theories that don't mesh with scientific practice. Need to ensure each desideratum is actionable in experimental contexts, like replication studies or control setups.

  Lastly, flagging which points are non-negotiable versus debatable. Asymmetry and background separation are probably essential for science, while how to handle physicality (4) might be where theories diverge. Highlighting the joint unsatisfiability of (1) and (4) without conceptual revision is key—might spark good seminar discussion.
answer: |-
  Here is a formal specification of desiderata for a theory of causation by omission tailored to scientific explanation, structured per your requirements. Each desideratum includes a motivating case, necessity assessment, and critical tensions flagged. Non-negotiable criteria reflect minimal requirements for scientific utility, while others admit theoretical flexibility.

  ---

  ### **Desiderata for a Theory of Causation by Omission in Scientific Contexts**

  1.  **Distinguish Genuine Causal Omission from Mere Absence**  
      *   **Requirement:** The theory must identify when an absence *actively contributes* to an outcome in a law-governed system, versus being irrelevant.  
      *   **Motivating Case:** A replication study of a radiation-shielded experiment fails. The original study used a lead shield (Block A); the replication lacks it. The failure report cites "absence of shielding" as causal. The theory must distinguish this from irrelevant absences (e.g., absence of a decorative sticker in the lab).  
      *   **Non-Negotiable:** Yes. Scientific explanations require precision in attributing causes.  
      *   **Tension with (4):** Joint satisfaction with Desideratum 4 may require redefining "causal" as *difference-making* rather than *force-exerting*.

  2.  **Preserve Causal Asymmetry without Normative Reduction**  
      *   **Requirement:** The theory must explain why omitting a *preventative* factor (e.g., a toxin neutralizer) causes harm, but omitting the *harm* itself (e.g., the toxin) does not symmetrically "cause" benefit. This asymmetry must derive from physical/nomological dependencies, not just values.  
      *   **Motivating Case:** Omitting a required antidote (Agent X) in a chemical exposure trial causes organ damage. Symmetrically, "omitting organ damage" (i.e., not damaging organs) does not cause the *presence* of the antidote. The asymmetry must hold even if "harm" is defined physically (e.g., cell death).  
      *   **Non-Negotiable:** Yes. Symmetry would render causal claims in interventionist science (e.g., clinical trials) incoherent.  
      *   **Theoretical Handling:** Counterfactual accounts (e.g., "If X had been present, damage would not have occurred") capture this structurally. Normative accounts fail here.

  3.  **Separate Omission-as-Cause from Omission-as-Background-Condition**  
      *   **Requirement:** The theory must resolve overdetermination by omission in systems with redundant safeguards, identifying *which* absence is causally salient.  
      *   **Motivating Case:** An experiment requires two independent backup systems (B1 and B2) to prevent overheating. Both are omitted in a trial, causing failure. The theory must determine whether B1’s absence, B2’s absence, or the conjunction is causal—and why—without arbitrary selection.  
      **Non-Negotiable:** Yes. Experimental reports assign specific causal responsibility (e.g., "failure due to missing B1").  
      **Theoretical Handling:** Probabilistic accounts may weigh causal strength (e.g., P(failure∣¬B1) > P(failure∣¬B2)); counterfactual accounts require fine-grained similarity metrics.

  4.  **Consistency with Physics of Absences while Enabling Explanation**  
      *   **Requirement:** The theory must reconcile the non-physicality of absences (no energy/momentum transfer) with their explanatory role in science.  
      *   **Motivating Case:** A vacuum chamber rupture is explained by "absence of a pressure seal." Physics confirms no negative entity exerted force, yet the explanation is valid. The theory must justify this without positing occult properties.  
      *   **Non-Negotiable:** Yes. Must align with fundamental physics.  
      *   **Critical Tension:** Directly conflicts with process-based metaphysics (where causation requires conserved quantities). Satisfaction likely requires a non-mechanistic account (e.g., counterfactual or variational).

  5.  **Prevent Overgeneration from Double Omissions**  
      *   **Requirement:** The theory must not entail that every omission in a conjunction of absences is independently causal.  
      *   **Motivating Case:** In a plant growth study, both sunlight (A) and fertilizer (B) are omitted. The plant dies. The theory should not imply "absence of A caused death" *and* "absence of B caused death" if the death would have occurred with either omission alone.  
      *   **Non-Negotiable:** Yes. Prevents causal inflation in multivariate systems.  
      *   **Theoretical Handling:** Counterfactual accounts succeed by testing omissions individually (e.g., "If only A were absent, would death occur?"). Probabilistic accounts require context-sensitive thresholding.

  ---

  ### **Synthesis of Theoretical Tensions & Non-Negotiables**
  - **Non-Negotiable Core:** Desiderata 1, 2, 3, 5 are essential for scientific practice (attribution, asymmetry, specificity, parsimony). Desideratum 4 is non-negotiable for physical consistency.  
  - **Key Conflict:** Desiderata 1 and 4 are **jointly unsatisfiable under mechanistic causation** (e.g., conserved quantity theories). Resolution requires adopting a *difference-making* framework (e.g., counterfactual, interventionist, or variational theories) where causation is defined by modal dependencies rather than physical processes.  
  - **Camp-Specific Preferences:**  
    - *Counterfactual/Interventionist* theories naturally satisfy 1, 2, 3, 5 but struggle with 4’s physicality.  
    - *Probabilistic* theories handle 3 and 5 well but may conflate correlation with causation in 1 and 2.  
    - *Normative* theories fail Desideratum 2’s asymmetry requirement for scientific contexts.  
  - **Scientific Implications:** A viable theory must treat omissions as *variables in a nomological structure* whose absence *changes outcome dependencies*. This permits explanatory power without violating physics, reframing "causation" as *invariant difference-making under intervention*.

  This specification provides a rigorous checklist for evaluating theories of omission, prioritizing scientific utility while acknowledging metaphysical constraints. It is suitable for critical discussion in philosophy-of-science forums.
