prompt: |-
  I am preparing a seminar on diachronic identity of artifacts and want the evaluative framework first, before consulting the standard literature. Consider this case: a 19th-century greenhouse is maintained for two centuries; every iron frame and glass pane is eventually replaced by mycelium-composite replicas grown in situ, chemically identical and structurally continuous but bearing no original manufacturing provenance, while the form, institutional designation, and ecological function remain unbroken. Write the desiderata any adequate theory of artifact persistence through material replacement must satisfy: the specific cases it must classify correctly (the greenhouse, a ship whose planks are replaced but the originals are stored in a warehouse, a car with every part swapped over time), the puzzles it must dissolve (the two-objects problem at full replacement, the boundary problem during gradual change, the distinction between restoration and replacement), and the conceptual distinctions it must preserve (material continuity versus formal or institutional continuity, provenance of parts versus provenance of structure). Flag any two desiderata that appear jointly unsatisfiable given ordinary metaphysical commitments. Then briefly score—without bibliographic citation—how mereological essentialism, four-dimensionalism (perdurance), and conventionalist or social-constructivist accounts each fare against your list, noting the specific failure that most undermines each view.
reasoning: |-
  Okay, let me approach this philosophy seminar request systematically. The user wants a framework for evaluating artifact persistence theories, centered on a greenhouse case where all original materials get replaced by grown replicas. 

  Hmm, the core challenge is defining what makes something "the same" artifact when its physical matter completely changes. That greenhouse example is clever - identical structure and function but zero original atoms. I'll need to cover all their specified cases: the Ship of Theseus with stored planks, the gradual car part replacements, plus the conceptual puzzles like distinguishing restoration from replacement.

  First, I should list what any good theory must explain. The greenhouse demands we accept purely structural continuity. The stored-plank ship creates a "two objects" problem - is the original the form or the material? Then there's the gray area of partial replacement where we can't pinpoint when replacement becomes destruction. 

  For conceptual distinctions, material vs. formal continuity seems crucial. Provenance of parts versus structure matters too - like whether the origin of components trumps how they're arranged. And institutionally, if a museum calls it the same greenhouse, does that override physical changes?

  Now the tricky part: identifying conflicting desiderata. "Material continuity as necessary" clashes directly with "allowing full replacement" because you can't have both when every atom changes. Also "definite persistence conditions" fights "vagueness tolerance" - gradual replacement makes clear boundaries impossible.

  Testing theories: Mereological essentialism fails immediately by rejecting any part change. Perdurantism handles gradual change with temporal parts but stumbles on the stored-plank ship - which "stage" is the real artifact? Conventionalism handles institutional identity well but can't explain why we'd say a reassembled original ship isn't the real one.

  The user seems philosophically sophisticated - they're avoiding literature to form independent criteria. I'll emphasize the greenhouse's biological aspect (mycelium growth) as a modern twist on old puzzles. For scoring theories, I'll be blunt about failures without citations since they want pre-literature analysis. 

  Biggest insight: The joint unsatisfiability shows why artifact persistence remains debated. No theory gets everything right, which is why we need this evaluative framework.
answer: |-
  Here is an evaluative framework for artifact persistence through material replacement, tailored to your seminar preparation:

  **Core Desiderata for an Adequate Theory:**

  1.  **Full Material Replacement (Greenhouse Case):** Must classify the mycelium-composite greenhouse as *numerically identical* to the original 19th-century greenhouse despite complete material turnover, given structural/functional/institutional continuity.
  2.  **Original Material Reassembly (Stored-Plank Ship):** Must classify the ship gradually replaced plank-by-plank *and* the later ship reassembled from stored original planks. It must explain why one (typically the functional ship) is the "original" artifact and the other is a replica (or a distinct artifact), or justify a different status.
  3.  **Gradual Part Replacement (Car Case):** Must correctly classify the car as persisting through the sequential replacement of *every* part over time, even if the process is slow and piecemeal.
  4.  **Dissolve the Two-Objects Problem:** Must avoid the absurd conclusion that both the functional artifact (new material) and the reassembled original material constitute the *same* single artifact after full replacement and reassembly.
  5.  **Address the Boundary Problem:** Must provide principled (even if vague) criteria for when a replacement process (gradual or sudden) crosses the threshold from "persistence via restoration/maintenance" to "replacement constituting destruction and creation of a new artifact."
  6.  **Distinguish Restoration from Replacement:** Must differentiate between interventions that *preserve* the artifact (e.g., cleaning, minor repairs) and interventions that constitute *replacement* of core identity-conferring parts or structures (even if gradual).
  7.  **Preserve Material Continuity vs. Formal/Functional Continuity:** Must account for the distinct roles (or lack thereof) of *physical matter persistence* versus *structural form, function, or design persistence* in grounding identity.
  8.  **Preserve Provenance of Parts vs. Provenance of Structure:** Must distinguish the historical origin of the *matter* (e.g., 19th-century iron) from the historical origin of the *arrangement/design* (e.g., the greenhouse blueprint/form) and explain their relative weights.
  9.  **Acknowledge Institutional/Social Role:** Must incorporate or explain the role of institutional designation, naming, social practices, and intended function in sustaining artifact identity across material change.
  10. **Provide Definite (or Tolerate Vague) Persistence Conditions:** Must offer criteria for persistence that are either non-arbitrary or provide a coherent account of the vagueness inherent in gradual change scenarios.

  **Potentially Jointly Unsatisfiable Desiderata (given ordinary commitments):**

  1.  **Material Continuity as Necessary (Implied by some intuitions) vs. Full Material Replacement (Desideratum 1):** Ordinary intuitions often link identity to original matter. Desideratum 1 *requires* identity to survive *total* material discontinuity. Reconciling this without abandoning a robust notion of materiality in identity is difficult.
  2.  **Definite Persistence Conditions (Desideratum 10) vs. Tolerance for Vagueness (Boundary Problem - Desideratum 5):** Providing sharp, non-arbitrary criteria for when replacement constitutes destruction (Desideratum 10) conflicts with the seemingly *inherent vagueness* of gradual replacement processes (Desideratum 5). Insisting on sharp boundaries seems artificial; embracing full vagueness threatens the definiteness of persistence conditions.

  **Scoring Major Theories Against the Desiderata:**

  1.  **Mereological Essentialism (ME):**
      *   **Core Claim:** An artifact is identical to the sum of its original parts. Change any part = destruction.
      *   **Failures:** Fails catastrophically on **1 (Greenhouse)**, **3 (Car)**, and the core challenge of material replacement. Also fails **5 (Boundary)** – any part change is destruction, making "restoration" conceptually impossible. Fails **6 (Restoration vs. Replacement)** – any part replacement is destruction/replacement. Misaligns with **9 (Institutional Role)** – identity is purely material, ignoring social continuity.
      *   **Key Undermining Failure:** Utter inability to handle *any* part replacement (**1, 3**), directly contradicting the central phenomenon the theory needs to explain.

  2.  **Four-Dimensionalism / Perdurantism (4D):**
      *   **Core Claim:** Artifacts persist by having temporal parts. The greenhouse is a spacetime worm; its "19th-century stage" and "22nd-century stage" are distinct temporal parts of the same 4D object.
      *   **Strengths:** Handles gradual change (**3, Car**) and vagueness (**5, Boundary**) naturally – the persistence of the 4D whole isn't threatened by changes to its temporal parts. Can accommodate **9 (Institutional Role)** as a property of the 4D whole.
      *   **Failures/Puzzles:** Struggles severely with **2 (Stored-Plank Ship)**. The functional ship (new planks) is one temporal part of the 4D ship-worm. The reassembled original planks form a *distinct* 4D object (a replica or a disassembled-stage-turned-replica). But why is the reassembled original not the *original ship*? It has all the original matter arranged ship-wise. This seems to privilege the spatiotemporal continuity of the *functional form* over the *original matter*, which **4D** doesn't inherently explain. Also, **6 (Restoration vs. Replacement)** becomes vague – what counts as a "significant" temporal part change? The **Provenance** distinction (**8**) is flattened – all parts are just temporal slices.
      *   **Key Undermining Failure:** Difficulty providing a satisfactory account of **2 (Stored-Plank Ship)** that aligns with strong intuitions that the reassembled original is a distinct entity (often a replica), not the original ship itself. It struggles to explain why the *spatiotemporal path of function* is privileged over the *spatiotemporal path of original matter*.

  3.  **Conventionalism / Social-Constructivism (SC):**
      *   **Core Claim:** Artifact persistence is fundamentally determined by social conventions, practices, intentions, and institutional contexts. Identity is "what we agree it is" based on relevant criteria (function, form, origin, etc.).
      *   **Strengths:** Excels at **9 (Institutional Role)**. Can readily explain **1 (Greenhouse)** identity via institutional designation and functional continuity. Can handle **2 (Stored-Plank Ship)** by convention (e.g., the functional ship is "the ship," the reassembled is a replica). Can accommodate vagueness (**5, Boundary**) – conventions can be fuzzy. Can define **6 (Restoration vs. Replacement)** by appealing to conventional practices within relevant communities (e.g., museum conservation vs. rebuilding). Can incorporate **7 & 8** (Continuity/Provenance Distinctions) as *factors* influencing convention.
      *   **Failures/Puzzles:** Risks being *too* flexible. What constrains convention? Could convention *wrongly* deem something identical? It struggles to provide **definite persistence conditions (10)** beyond "what people say." It risks making persistence merely epistemic or linguistic, losing objective grounding (**Material/Formal Continuity - 7** might seem irrelevant if convention overrides it). Why does the *original matter* in the warehouse (**2**) intuitively seem to have a strong claim if convention ignores it?
      *   **Key Undermining Failure:** Difficulty explaining the *source of normative constraints* on conventions and the *intuitive pull* of material continuity or structural provenance (**7, 8**). It risks collapsing into arbitrariness, failing to explain *why* certain conventions (favoring functional continuity) are so widespread and resilient, suggesting an underlying reality beyond mere agreement.

  This framework provides a robust foundation for critically evaluating theories of diachronic artifact identity as you delve into the standard literature. The identified tensions, especially the jointly unsatisfiable desiderata, highlight the core philosophical challenges in this domain.
