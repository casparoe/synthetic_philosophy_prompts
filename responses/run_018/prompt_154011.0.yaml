answer: |-
  This is a profound and enduring question in Buddhist philosophy, precisely pinpointing the tension between karma's normative implications and the radical impermanence and non-self doctrines. There is no single "consensus" resolution, but we can delineate the established positions and contested debates:

  **Core Established Doctrines (Across Mainstream Buddhist Traditions):**

  1.  **Karma (Kamma) as Cetana:** Intentional action (mental, verbal, physical) is the root of karmic potentiality. Volition is the defining factor.
  2.  **Anattā (Anātman):** There is no permanent, unchanging, independent self or soul (ātman) that owns experiences or transfers from life to life. "Self" is a convenient label for a dynamic, conditioned process.
  3.  **Ksanikavāda (Momentariness):** All conditioned phenomena (sankharas), including mental states (cittas/caittas) and their associated factors, arise and cease extremely rapidly. There is no enduring substance; existence is a series of momentary events.
  4.  **Karmic Causation:** Intentional actions create "seeds" (bīja) or "impressions" (vāsanā/sankhāra) within the stream of consciousness. These ripen (vipāka) as results (phala) – pleasant, unpleasant, or neutral experiences – under appropriate conditions, potentially over multiple lifetimes.
  5.  **Rebirth (Punabbhava/Samsāra):** The process of karmic causation continues beyond the death of the physical body. The stream of consciousness, carrying its karmic potential, finds a new basis for existence.
  6.  **No Literal "Transfer" or "Owner":** Traditional Buddhist orthodoxy explicitly denies that a "self" transfers or that karma "belongs" to an entity. The process is impersonal and causal.

  **The Core Tension (Well-Recognized):**
  As you state: If there is no enduring self-entity, and mental states are momentary, what persists to *deserve* the karmic results? How can desert be meaningfully assigned without a continuous subject?

  **Philosophical Strategies to Address the Tension (Established & Contested):**

  1.  **Causal Continuity as the "Bearer" (Dominant Traditional View):**
      *   **Mechanism:** Karma is fundamentally about cause and effect operating within a causally continuous, ever-changing stream of aggregates (skandhas), particularly consciousness (vijñāna). The "deserver" isn't an entity *behind* the stream, but the stream *itself* at the moment the result ripens. The intentional action performed by a prior moment in the causal sequence conditions the experience arising in a later moment within the same continuum.
      *   **Analogy:** Think of a river. The water molecules (moments) are constantly changing, but the river (the causal continuum) flows. Pollution dumped upstream (bad karma) affects the water quality downstream (result). The "river" experiencing the pollution isn't identical to the molecules that dumped it, but it's the direct causal consequence within that continuum.
      *   **Moral Desert?** This view often *describes* the process normatively ("he suffers *because of* his past greed"). However, whether this constitutes "desert" in a robust metaphysical sense (like a self *earning* reward/punishment) is precisely the contested point. Proponents argue the causal link *is* the desert-mechanism within a non-substantialist framework. Critics argue this reduces desert to mere sequence.

  2.  **The Role of the "Mental Stream" (Citta-Santāna/Vijñāna-Santāna):**
      *   **Mechanism:** The sequence of momentary consciousnesses forms an unbroken stream across lifetimes. Karmic seeds are stored *within* this stream, not in a self. The stream's continuity provides the necessary link between action and result. The experiencing moment is causally dependent on the volitional action moment within the same continuum.
      *   **Moral Desert?** Similar to above. Desert is located in the causal dependence of the result-moment on the action-moment within the continuous process. Theravāda Abhidhamma and early Mahāyāna lean heavily on this.

  3.  **Storehouse Consciousness (Ālaya-vijñāna - Yogācāra):**
      *   **Mechanism:** Yogācāra introduced the ālaya-vijñāna as a subliminal, constantly evolving repository for karmic seeds (bīja) and tendencies (vāsanā). It provides a more stable (though still impermanent and impersonal) basis for karmic continuity than momentary cittas alone. It carries the karmic "load" and seeds experiences.
      *   **Moral Desert?** This offers a more robust *substrate* for karmic accounting without positing a self. However, it remains deeply contested:
          *   *Is it "Metaphysical"?* Traditional Yogācārins see it as part of the conventional truth (samvrti-satya) framework. Critics argue it risks becoming a covert self.
          *   *Does it Solve Desert?* It provides continuity for the *process*, but the ālaya itself isn't an agent deserving results. The result is still experienced by a moment of manifest consciousness dependent on the ālaya's seeds.

  4.  **Conventional Personhood (Prajñapti-sat - Madhyamaka):**
      *   **Mechanism:** Madhyamaka, particularly Prāsaṅgika, emphasizes the *conventional reality* (vyavahāra) of persons. While ultimately empty (śūnya) of inherent existence, the person is a dependently arisen designation valid on the conventional level. Karma operates *within* this conventional framework. We speak meaningfully of "I" acting and "me" experiencing results *conventionally*, without needing an ultimate referent.
      *   **Moral Desert?** This explicitly rejects the need for an ultimate bearer of desert. Desert is a conventional truth, part of the framework necessary for ethical discourse and the path. Moral responsibility attaches to the conventional person. This is perhaps the most radical "naturalization" attempt, grounding normativity in convention and pragmatism (it works for ending suffering) rather than metaphysics. Critics question if this sufficiently grounds the *normative force* of karma beyond mere social convention or psychological conditioning.

  **Contested Ground Among Specialists:**

  1.  **Can Karma Function as *Moral Desert* Without a Persistent Self?**
      *   **Yes (Causal/Conventional View):** Karmic desert *is* the impersonal causal law ensuring that volitional actions have corresponding experiential results for the continuum/conventional person in which they arose. The feeling of "desert" arises conventionally but is grounded in causality. (Siderits, Goodman - though Goodman argues it *shouldn't* be seen as desert).
      *   **No (Requires Metaphysics/Incoherent):** True moral desert inherently requires a persisting subject who is the *same* as the agent and the *deserving* recipient. Without this, karma reduces to a causal law of psychological conditioning and ripening experiences, losing its specifically *moral* and *desert-based* character. (Arguments often drawn from Western moral philosophy; some Buddhist scholars like Westerhoff lean this way).
      *   **It's Not *Literal* Desert, But Effective Pedagogy:** Some argue the language of desert is primarily soteriological – a skillful means (upāya) to encourage ethical behavior and discourage harm by illustrating cause-and-effect, even if metaphysically "desert" is incoherent without a self. The "weight" is pragmatic, not ontological.

  2.  **Can Karma Be Fully "Naturalized"?**
      *   **Yes (Causal Psychology/Convention):** Karma describes natural laws of intentionality, mental conditioning, and the arising of experience based on past patterns. Rebirth is the continuation of this causal process under different conditions (dependent origination). Normativity arises from the inherent link between unwholesome actions and suffering/wholesome actions and well-being, observable empirically (Dhamma-Vinaya perspective) or conventionally (Madhyamaka). No supernatural accounting or metaphysical substrate needed beyond dependent arising. (Flanagan, Siderits).
      *   **No (Requires Metaphysical Support):** A fully naturalized (e.g., physicalist or strict psychological) account struggles to explain:
          *   The *precision* and *long-term* karmic matching of actions to results, especially across lifetimes.
          *   The apparent *normative necessity* ("oughtness") implied by karmic law.
          *   Mechanisms like the ālaya-vijñāna or the subtle continuity of the mental stream might be seen as necessary metaphysical (though not substantialist) postulates beyond current natural science. (Arguments found in traditional exegesis and some contemporary scholars like Gethin).

  3.  **Is a Substrate (like Ālaya-vijñāna) Necessary?**
      *   **Yes:** For some schools (Yogācāra), it's essential to explain karmic storage and continuity without a self and without violating momentariness. It's part of the sophisticated model of mind.
      *   **No:** Other schools (Theravāda Abhidhamma, Madhyamaka) argue the causal stream of consciousness/moments is sufficient without positing an additional substrate. Madhyamaka sees the ālaya as another conventional concept, ultimately empty.

  **Conclusion:**

  The tension you identify is real and central. **Traditional Buddhist orthodoxy firmly maintains that karma functions effectively *without* an enduring self or owner.** They rely on causal continuity (santāna) within the stream of consciousness (sometimes aided by concepts like ālaya-vijñāna) or conventional personhood (prajñapti).

  *   **What is Established:** Karma operates causally within the framework of anattā and momentariness. There is *no* orthodox Buddhist view that posits a permanent self as the bearer of karma.
  *   **What is Contested:**
      *   Whether this causal process can meaningfully be called "moral desert" in a robust philosophical sense, or if it's better understood as a law of psychological cause-and-effect with normative implications derived from suffering/happiness.
      *   Whether the traditional explanations (causal stream, ālaya-vijñāna, conventional person) are metaphysically sufficient to ground the *normative weight* and *precision* of karma without smuggling in a subtle self or requiring non-natural elements.
      *   The extent to which karma can be fully "naturalized" within a contemporary scientific worldview without losing key aspects of its traditional explanatory power or normative force.

  Philosophers like **Mark Siderits** (Buddhist Reductionism) argue convincingly that "desert" can apply to a causal series without a persistent entity, akin to how we hold corporations or nations responsible. **Charles Goodman** argues forcefully that karma *should not* be interpreted as desert precisely *because* of anattā, seeing it instead as purely causal conditioning, and that Buddhist ethics is better understood as consequentialist. **Jonardon Ganeri** explores the sophisticated philosophy of mind in Abhidharma to show how continuity and responsibility emerge from momentariness.

  Therefore, while the *functioning* of karma without a self is orthodox doctrine, the philosophical coherence of interpreting this functioning as literal "moral desert" remains a lively and unresolved debate among specialists in Buddhist philosophy and comparative ethics. The answer often hinges on how one defines "moral desert" and the level of reality (ultimate vs. conventional) at which one locates normative claims.
