answer: |-
  ### Exam Prompt: Rationality and Commitment in Parfit's Hitchhiker  
  **Instructions:** In approximately 1,000 words, analyze the modified version of Parfit’s Hitchhiker paradox below. Focus **exclusively** on whether the introduction of an *observable* commitment device resolves Parfit’s claim that rationality can be self-defeating, or merely relocates the tension between ex-ante and ex-post rationality. Do **not** summarize the original paradox; engage directly with the mechanics of the twist. Comparisons to Newcomb’s problem must explicitly map structural differences if used.  

  **Scenario:**  
  > A driver (D) is stranded in the desert. A hitchhiker (H) offers to drive her to town if D promises $1,000 upon arrival. D knows:  
  > - If she *refuses* to pay in town, H will abandon her in the desert (fatal).  
  > - If she *pays*, both survive and D loses $1,000.  
  >  
  > **TWIST:** Before H decides to drive, D can activate a cheap smart-contract lockbox. If activated:  
  > - H **observes** the activation status before driving.  
  > - The lockbox auto-transfers $1,000 from D’s account to H *if* D is not driven to town.  
  > - If driven to town, D can freely pay (or not) with no lockbox penalty.  
  >  
  > D prefers: (1) Survival + $0 > (2) Survival – $1,000 > (3) Death. H prefers $1,000 > $0.  

  **Question:** Does D’s ability to deploy an *observable* commitment device undermine Parfit’s argument that rational choices can be self-defeating? Or does it shift the self-defeat to a conflict between ex-ante rationality (planning) and ex-post rationality (executing)? Justify using game-theoretic reasoning.  

  ---

  ### Model Answer (798 words)  

  Parfit’s original Hitchhiker paradox claims rationality is self-defeating: D’s ex-post rational choice (not paying in town) leads to abandonment, making her worse off than if she were irrational (paying). The twist introduces an observable commitment device (smart-contract lockbox) that D can deploy *before* H acts. I argue this device dissolves the original self-defeat by aligning incentives but creates a *new* conflict between ex-ante and ex-post rationality, relocating—not resolving—Parfit’s core dilemma.  

  **I. How the Commitment Device Resolves the Original Paradox**  
  The lockbox alters the game’s structure by adding a pre-move for D. Crucially, its observability lets H condition his choice on D’s commitment:  
  - **If D activates the lockbox**: H faces a choice:  
    - *Drive*: Guarantees $1,000 (auto-transfer if abandoned, payment if driven).  
    - *Abandon*: Triggers auto-transfer ($1,000) but D dies → H gets $1,000 *but gains nothing over driving*.  
    Driving weakly dominates abandoning, so H drives. D then pays in town *ex-post* (survival + $0 > survival – $1,000? No: D pays to avoid death but already ensured survival via commitment. Correction: After being driven, D *prefers not paying* since she survives either way. Yet H drove expecting payment. Here lies the new tension.)  
  - **If D does not activate**: Original paradox holds. H anticipates non-payment in town and abandons D.  

  Activation makes D’s promise credible: H drives because the lockbox ensures compensation even if D reneges. D survives, but only by binding herself to a future cost (the $1,000 transfer if not driven) that she hopes to avoid. The *original* self-defeat (abandonment due to rational non-payment) is avoided.  

  **II. Emergence of Ex-Ante vs. Ex-Post Conflict**  
  While activation saves D, it creates a new rationality rift:  
  - **Ex-ante rationality (pre-desert)**: D *should* activate the lockbox.  
    - *Activate*: Survival guaranteed (H drives), cost = $1,000 (paid to H either via lockbox or voluntarily).  
    - *Not activate*: Death (H abandons her).  
    Survival – $1,000 > Death, so ex-ante rationality demands activation.  
  - **Ex-post rationality (in town)**: Once driven, D prefers not to pay.  
    - Paying costs $1,000; not paying costs $0. Survival is already secured.  
    Ex-post rationality dictates reneging.  

  But if D reneges, H observes this outcome and learns D’s type. In repeated games, H might refuse future deals. In a one-shot game, however, D faces no repercussion. Yet the lockbox’s activation already committed D to H’s compensation: if D reneges, she exploits H’s trust, violating the ex-ante plan that saved her. Rationality at t=2 (town) undermines the rationale of rationality at t=1 (desert). The self-defeat recurs: D’s ex-ante rational choice (activation) relies on her *irrationally* paying ex-post, or on H’s naivety. If H expects rational reneging, he might refuse to drive even if the lockbox is active—unless the device binds D absolutely. But the lockbox only penalizes non-transport; it doesn’t enforce post-transport payment. Thus, D’s ex-post defection is *possible*, making her ex-ante commitment fragile.  

  **III. Why Observability Matters and Comparison to Newcomb’s**  
  The lockbox’s *observability* is essential. If H couldn’t see activation status, D’s commitment would be meaningless: H would always assume non-activation and abandon D. Observability enables signaling.  

  This differs critically from Newcomb’s problem:  
  - **Newcomb’s**: The Predictor’s opacity creates a conflict between dominance (take both boxes) and expected utility (one-box).  
  - **Hitchhiker (modified)**: No prediction; H reacts to observable actions. The conflict is temporal (ex-ante vs. ex-post), not epistemic.  
  Conflating them ignores that Newcomb’s uncertainty stems from an agent’s inability to signal their type, while here, D *can* signal via the observable device.  

  **IV. Verdict: Relocation, Not Resolution**  
  The lockbox resolves the *immediate* self-defeat (death) by enabling credible commitment. But it transfers the paradox to the intra-agent temporal conflict: ex-ante D must act to ensure survival, knowing ex-post D will sabotage the plan unless constrained. True resolution would require D to irreversibly commit to *paying* upon arrival (e.g., a device that auto-pays H $1,000 if D reaches town). The given lockbox only commits to compensation for non-transport—not for post-transport cooperation. Thus, Parfit’s thesis holds: rationality remains self-defeating because the ex-post rational choice (not paying) invalidates the ex-ante rational strategy (activation) if H anticipates it. D survives only by either:  
  (a) Being "irrational" ex-post (paying against her immediate interest), or  
  (b) Exploiting H’s short-term ignorance of her reneging tendency.  

  The device shifts self-defeat from *inter*-agent (D’s non-payment → H’s abandonment) to *intra*-agent (ex-ante D vs. ex-post D). It highlights how rationality’s time-sensitivity generates paradoxes no device can fully escape without binding the agent’s future self.  

  ---

  ### Marking Scheme (Total: 30 marks)  
  **Top Answers (27–30) Must Include:**  
  1. **Reconstruction of original paradox’s self-defeat** (4 marks)  
     - *Common mistake:* Summarizing without linking to self-defeat claim.  
  2. **Analysis of lockbox’s game-theoretic effect** (8 marks)  
     - *Mistake:* Ignores observability or H’s conditional response.  
  3. **Distinction between ex-ante/ex-post rationality** (7 marks)  
     - *Mistake:* Treats rationality as monolithic; fails to show temporal conflict.  
  4. **Argument for why the device relocates (not resolves) the paradox** (6 marks)  
     - *Mistake:* Asserts resolution without addressing post-transport incentives.  
  5. **Precise structural contrast with Newcomb’s (if mentioned)** (5 marks)  
     - *Mistake:* Superficial comparison (e.g., "both involve commitment") without contrasting opacity/observability or prediction/signaling.  

  **Penalties:**  
  - –3 if conflating Hitchhiker/Newcomb’s without structural comparison.  
  - –2 per missing core move (from 1–5 above).  
  - –1–3 for vagueness in game-tree logic (e.g., unclear payoffs).  

  ---

  This prompt tests mastery of dynamic inconsistency, precommitment, and time-sliced rationality—without requiring external sources. The marking scheme forces engagement with the twist’s mechanics while deterring canned responses.
