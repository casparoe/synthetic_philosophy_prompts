  **Archaeological Note & Liberties Taken:**

  Your premise is **fascinating and touches on a crucial, debated aspect of Maya archaeology**. You're absolutely right to question the "collapse" narrative and highlight preservation bias. Here's where the story aligns with, and departs from, current understanding:

  1.  **Preservation Bias:** This is 100% real. Organic materials like bark paper (*huun*), palm leaves, wood, and cotton textiles decay rapidly in the humid tropics. Stone, plaster, and pottery endure. The archaeological record is massively skewed towards the monumental and durable, creating the *illusion* of a sudden cessation of "high culture" when stone carving dwindled. The story leans heavily on this valid point.
  2.  **Shift in Materials:** There *is* evidence for increased use of perishable materials, especially codices, during and after the Terminal Classic, alongside (not always instead of) stone. The story simplifies this into a more deliberate, conscious shift by a scribe, which is speculative but plausible.
  3.  **Motivation (The Liberties):**
      *   **Deliberate Choice vs. Necessity:** The story presents the shift as a conscious philosophical/practical choice ("choosing invisibility"). Archaeology suggests the decline in stone carving was likely driven by a complex mix of **factors:** environmental stress (drought), political fragmentation (loss of centralized power/kings who commissioned monuments), economic disruption (collapse of trade networks), and societal reorganization. The scribe *might* have perceived it as a deliberate shift, but the broader driving forces were likely more about necessity and changing social structures than a coordinated ideological move. The story personalizes and idealizes this shift.
      *   **"Failure vs. Change":** You're spot-on challenging the false binary. Modern scholarship increasingly views the Terminal Classic not as a sudden "collapse" of Maya civilization, but as a **period of profound transformation, reorganization, and resilience.** Populations shifted (north to the Yucatan, to coasts, to defensible hills), political structures changed (less emphasis on divine kings, more on council-based rule), economies adapted, and cultural practices evolved. Stone carving *diminished* dramatically in the southern lowlands, but Maya culture persisted and transformed elsewhere. The story embodies this view of transformation, not failure.
  4.  **Scribe's Agency:** The story grants the scribe significant autonomy. In reality, scribes were often closely tied to the ruling elite. Commissioning stone monuments required significant resources (labor, materials, skilled artisans). A scribe might have *wanted* to stop carving stone, but the decision was likely tied to the patronage and power of the elites who were losing their ability or will to commission them. The story gives Ch’ayom more personal agency than he might have realistically possessed.
  5.  **Focus of Records:** While the story imagines a shift to pragmatic, daily records, surviving codices (from later periods or other regions) are primarily ritual, calendrical, and astronomical. However, it's highly likely that *other* records on perishable materials (economic, political, historical narratives) existed and are simply lost. The story’s focus on daily struggle and adaptation is a plausible, if unprovable, use for such materials.

  **Conclusion:** Your core idea is **not confused or forcing a false binary.** It highlights a critical perspective: the Maya "collapse" narrative is heavily influenced by the *disappearance of durable monumental remains*, obscuring potential continuities and transformations on perishable media and in lived practices. The story takes the valid concept of preservation bias and the reality of transformation, weaving them into a speculative but plausible narrative of conscious adaptation through ephemeral records. It leans into the "transformation, not disaster" model, which is a strong current in modern Maya archaeology. The liberties involve compressing complex societal changes into a single scribe's deliberate choice and simplifying the motivations behind the shift away from stone.
