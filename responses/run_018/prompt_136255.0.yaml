answer: |-
  ### (1) Exam Question  
  **You have 48 hours. Write approximately 1200 words. Answer with a definite stance.**  

  > **Tauriek’s "Numbers Don’t Count" thesis rejects saving the greater number in rescue cases, arguing we should instead flip a coin when forced to choose between saving one person or five. His "pairwise comparison" method treats each individual separately: we owe equal respect to all, so we cannot let five claims "outweigh" one. But what happens when *probability* enters the picture?**  
  >  
  > **Imagine you must choose between two rescue plans:**  
  > - **Plan A:** Save *one specific person* with 99% success.  
  > - **Plan B:** Save *five specific people*, each with an *independent* 70% chance of rescue (i.e., each might live or die separately).  
  >  
  > ***Does this probabilistic twist force Taurek to accept expected-value aggregation? Or can his framework—by focusing strictly on actual outcomes—still reject counting numbers?***  
  >  
  > **Take a firm position. Argue whether Taurek’s view *survives* or *collapses* here. Defend your answer using Taurek’s core principles. Do not merely summarize both sides—give reasons why your interpretation is decisive.**  

  ---

  ### (2) Model Answer (850 words)  
  **Taurek’s Anti-Aggregationism Collapses Under Probability**  

  Taurek’s radical egalitarianism insists that we cannot aggregate harms or benefits across persons. In standard cases (e.g., saving five with certainty vs. saving one with certainty), he rejects utilitarian calculation: giving each person a 50% chance via a coin flip honors their equal moral status. But probabilistic rescue scenarios expose a fatal flaw in his pairwise method. When outcomes are uncertain, Taurek *cannot* avoid implicit aggregation—and his commitment to "actual outcomes" becomes incoherent. Here, Plan A (saving one person with 99% certainty) ought to be chosen over Plan B (saving five with 70% individual success rates). Taurek’s own principles, pressed to their logical end, force this conclusion—but only by smuggling in expected value.  

  **Taurek’s Core Commitment: Actual Harm, Not Probable Harm**  
  Taurek dismisses aggregation by focusing on *actual individuals saved or lost*. For him, "five deaths" isn’t a single bad event—it’s five distinct tragedies, each befalling a specific person. Pairwise comparison reflects this: when choosing whom to save, I ask whether I can justify to *each loser* why they weren’t saved. If I save the five, I tell the one: "I saved them, but I could’ve saved you instead—and I have no reason privileging them over you." The coin flip resolves this by giving equal ex ante respect. Crucially, Taurek rejects evaluating *expected* welfare; morality concerns actual outcomes for actual people.  

  **Why Probability Breaks Pairwise Comparison**  
  In probabilistic cases, "actual outcomes" are undefined *at the moment of choice*. If I choose Plan B (five at 70% each), I haven’t *actually* harmed anyone yet—I’ve initiated a process where each of the five *might* be saved or lost, and the one is *likely* condemned. Taurek might insist we evaluate post-rescue: if I attempt Plan B and only three survive, I face three "losers" (the two who died plus the one I didn’t try to save). But this misapplies his theory. The moral decision happens *before* outcomes are known. When choosing plans, I must weigh *possible futures*, not actualized harms.  

  Taurek’s "justification to each person" test now backfires. Consider addressing the *one person* if I choose Plan B:  
  > *"I denied your 99% chance of rescue to pursue a plan where each of five others had a 70% chance. I couldn’t guarantee saving them, but I valued their combined prospects over your near-certain survival."*  

  This justification tacitly aggregates expected value. The "combined prospects" imply that 5 × 70% = 3.5 expected lives outweighs 0.99 lives—precisely the calculus Taurek rejects. If I instead choose Plan A, I tell the five:  
  > *"I denied each of you a 70% chance because saving one person with 99% certainty was a more reliable duty."*  

  Here, I privilege certainty over diffuse benefit—but I still weigh probabilities. I’m not comparing individuals pairwise; I’m comparing *distributions of risk*.  

  **Can Taurek Escape by Doubling Down on Actual Outcomes?**  
  Taurek might dig in: "Choose *as if* outcomes are certain! Treat Plan B as ‘saving five’ and Plan A as ‘saving one’—ignore probabilities!" This is untenable. It ignores the *reason* we care about actual outcomes: avoiding *ex post* justified regret. If I choose Plan B and *no one* is saved (probability: 0.3⁵ = 0.24%), while the one person dies too, I confront five corpses and one I abandoned. Can I defend this? "I acted as if I’d save five for sure!" rings hollow. Probabilities matter because they reflect foreseeable harm. Taurek’s theory cannot handle risk without betraying its spirit.  

  **The Incoherence of "Equal Chance" Under Uncertainty**  
  Taurek’s fallback—a coin flip—also falters. Flipping between Plan A and Plan B assigns wildly unequal *expectations*:  
  - Plan A gives the one person a 99% survival chance; each of the five gets a 50% × 70% = 35% chance.  
  - Plan B gives each of the five a 50% × 70% = 35% chance; the one person gets 50% × 99% ≈ 49.5%.  

  This isn’t equal respect—it’s arbitrary disadvantage. True equality would weight the coin flip by expected utility, but Taurek forbids that. His method collapses into incoherence: either we ignore probabilities (making reckless choices) or we sneak aggregation in (contradicting his thesis).  

  **Conclusion: Taurek’s Framework Implictly Admits Aggregation**  
  The probabilistic case proves Taurek cannot consistently reject aggregation. To choose rationally—or even to apply his pairwise justification—we *must* compare expected states of the world. Saving five at 70% each isn’t "saving five"; it’s accepting a lottery where, on average, 3.5 survive. When we ask "Can I justify this to the one left behind?", the answer depends on whether rejecting their near-certain rescue was worth this aggregate expectation. Taurek’s theory either embraces this or falls silent. Here, it falls.  

  ---

  ### (3) Marking Scheme (20 points total)  
  **Must-hit moves (15 points):**  
  1. **Identify Taurek’s actual-outcome focus** (3 pts)  
     *Blown by:* Calling it "utilitarian" or conflating with risk-neutrality.  
  2. **Explain why pairwise comparison fails under uncertainty** (4 pts)  
     *Blown by:* Claiming Taurek would "still flip a coin" without addressing probabilistic inequality.  
  3. **Show how justifying choices *ex ante* smuggles in expected value** (4 pts)  
     *Blown by:* Only discussing *ex post* outcomes without confronting decision-time ambiguity.  
  4. **Argue that dismissing probabilities leads to reckless choices** (2 pts)  
     *Blown by:* Asserting Taurek "doesn’t care about risk" sans argument.  
  5. **Take a clear stance (survive/collapse) and defend it** (2 pts)  
     *Blown by:* "It’s ambiguous" or equal-time for both views.  

  **Quality (5 points):**  
  - Precision (2 pts); Structure (2 pts); Clarity (1 pt).  

  ---

  \answer{Probabilistic scenarios collapse Taurek’s framework}
