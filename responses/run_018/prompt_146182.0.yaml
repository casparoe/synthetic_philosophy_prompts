     - However, in a life-threatening scenario, the ethical imperative might override the epistemic caution. The physician might reason that the potential harm of not treating a true MI (death) is much greater than the harm of treating a non-MI (bleeding risk). Thus, even though the interval includes values below 0.50, the possibility that the true probability is as high as 0.62 (which is above) and the asymmetry of risks might justify treatment.

