prompt: |-
  I chair the assessment-accommodations committee at a mid-sized university, and I want to replace the improvisation we currently do with something we can actually run. We sit fortnightly and dispose of thirty to forty requests a term, fifteen minutes a case, and our formal question is narrow: may this student use this external resource during an invigilated closed-book exam in this paper. The people in the room are two rotating faculty members, a disability-services adviser, and a student representative; none of them has philosophy training, the decision has to be written down in language a student can appeal against, and the department that owns the exam has to be able to live with it. A colleague in the philosophy department suggested, after watching us argue about whether a laptop is different in kind from a set of notes, that the question we are really asking is whether the resource is, for this student, part of the mind that sits the exam or merely something that mind uses — and pointed me at the extended-mind literature and its central examples and objections: the man with the notebook, the parity principle, the complaint that mere causal coupling is not constitution, and the worry that on a loose reading of the view every gadget I rely on becomes part of me. I found the literature suggestive and unusable in equal measure. I do not want a summary of it; I want it turned into a procedure.

  What I need is an ordered set of questions my committee can put to a request, together with, for each question, what would count as a sufficient answer and what evidence a student can realistically be asked to produce for it — a clinician's letter, a short demonstration at the start of term, a usage log, a statement from a tutor. Build in the conditions that seem to matter and say how each is to be tested in fifteen minutes: whether the resource is reliably and immediately available to the student under exam-hall conditions rather than in principle; whether the student consults it automatically and trusts what it returns rather than checking it against something else each time; whether the information in it is the student's own in the relevant sense, or was generated by a tutor, a classmate, or software; whether the student endorses what it gives them or would disown it if challenged. Include explicit stop rules, distinguishing the failures that end the request there from the ones that merely count against it, and mark the points at which the question stops being one of fact about the student and becomes one about what the examination is supposed to be measuring, at which stage the procedure must hand the decision to the department that set the paper — and tell me how to frame that referral so the department does not simply answer by restating its own no-aids rule. I also need the conditions stated so they cannot be satisfied by arrangements made in the week before the exam. Please make sure the procedure handles a shared resource whose content was produced jointly or by someone else, a resource that performs operations the student cannot check or reproduce, a resource the student depends on but which is only intermittently available, and a student who could still do the work internally but for whom the external route is much less exhausting.

  Then run it, at length, on three cases in front of us now. First: a student with a degenerative visual condition who for six years has read and written everything through a screen reader and a refreshable braille display, and who wants the same setup for a three-hour papers exam. Second: a student requesting a single printed sheet of formulae and decision rules, compiled by their tutor, for a statistics exam whose rubric partly rewards knowing which test to apply to which design. Third: a student who wants to dictate answers into a phone and have a grammar tool restructure the sentences, having used that setup daily for two years, in a subject where written expression is itself a graded component. At least one of these, I suspect, will come out differently from how my committee would vote today, and I would rather be told so than flattered: give me the verdict the procedure yields in each case, tell me which of our reflexive approvals it refuses and which of our reflexive refusals it grants, and for whichever result we will resist, argue whether that is a defect in the procedure or a defect in our practice. Finally, state plainly what the procedure cannot do: where it must yield to our legal duties and to the department's authority over its own assessment, where it depends on a student's self-report that may be unreliable or strategic, and where no amount of procedure will settle whether unaided recall ought to be part of what a degree certifies.
reasoning: |-
  Hmm, the user chairs an assessment-accommodations committee at a university and needs a practical procedure for evaluating requests to use external resources during exams. They're frustrated with their current ad hoc approach and were inspired by philosophy's extended mind theory but found it unusable directly. They need a concrete decision tree with evidence requirements, stop rules, and handling for edge cases.

  The user's core challenge is translating abstract philosophical concepts (like the parity principle) into actionable criteria. Their committee operates under tight constraints: 15 minutes per case, no philosophy training, need for appeal-proof documentation, and departmental buy-in. The procedure must prevent gaming by requiring long-standing integration of resources.

  Key requirements include: 
  - Distinguishing between "part of mind" vs "tool used by mind"
  - Evidence standards (clinician letters, usage logs, etc.)
  - Stop rules for automatic rejections
  - Clear handoff points to academic departments
  - Handling three test cases (visual impairment, formula sheet, dictation software)

  For the visual impairment case, the screen reader/braille display clearly passes as extended mind based on longitudinal integration and necessity. The pre-made formula sheet fails because it's not self-generated and bypasses core testing objectives. The dictation/grammar tool case is tricky - it might pass the integration tests but fail on academic grounds since written expression is being assessed.

  The procedure intentionally creates tension points where academic departments must justify why unaided recall matters. This protects the committee from overstepping while forcing departments to articulate pedagogical reasoning beyond "because rules." 

  Notable limitations: Can't override legal accommodations, depends on verifiable student history, and can't resolve fundamental debates about assessment philosophy. The test cases reveal where the committee's instincts may need adjusting - particularly around "convenience" accommodations for non-disabled students.

  The solution centers on provable habitual use, not theoretical possibility. By requiring 6+ months of daily use documentation, it prevents last-minute gaming. The department handoff is framed as "does assessing unaided [skill] align with your published learning outcomes?" to avoid circular answers.
answer: |-
  Based on your requirements and the extended-mind literature's core insights, here is a procedural framework for your committee. The procedure focuses on **functional integration** and **constitutive reliance**, not theoretical possibility. It prioritizes evidence of established, necessary cognitive dependency over convenience.

  **Core Question:** *Is this external resource, for this specific student in this specific exam context, functionally integrated into their cognitive process to the degree that denying it would be equivalent to denying part of their mind, rather than denying a tool they use?*

  **Ordered Decision Procedure with Stop Rules & Evidence Requirements**

  1.  **Is the resource necessary due to a recognized disability or chronic health condition preventing standard exam participation?**
      *   **Sufficient Answer:** Clinically verified diagnosis explaining *why* the resource is necessary to access/express knowledge equivalent to peers. Mere preference is insufficient.
      *   **Evidence:** Formal diagnostic report from a qualified clinician (doctor, psychologist, specialist assessor) explicitly linking the disability to the *need* for *this specific resource* in *this specific exam context*. Must be on file *before the start of the term* containing the exam.
      *   **Stop Rule (HARD STOP - Reject):** If NO credible, current clinical documentation exists linking the disability to the *need for this specific resource* in *this specific exam*. *Appeal:* Student provides missing/updated documentation.
      *   **Stop Rule (HARD STOP - Grant):** If the request is solely for standard, universally accepted assistive tech *directly compensating for a sensory/motor impairment* (e.g., screen reader for blindness, voice recognition for motor impairment) in an exam *not explicitly testing unaided sensory/motor skill*. *Handoff:* Skip to step 5 for departmental input ONLY if the exam explicitly tests unaided sensory/motor skill (e.g., identifying bird calls by ear, handwriting speed).

  2.  **Has the resource been habitually and indispensably used by the student for academic work for a significant, sustained period PRIOR to this term?**
      *   **Sufficient Answer:** Demonstrated integration into the student's *standard academic workflow* over time, not adopted for the exam.
      *   **Evidence:** Combination required: (a) Clinician's letter confirming habitual use is part of recommended strategy; (b) **Usage Logs/Demonstration:** Consistent usage logs (e.g., app timestamps, tutor/lecturer observations) OR a verified demonstration *early in the term* showing fluency; (c) **Tutor/Advisor Statement:** Confirming observed habitual use in relevant academic tasks (e.g., tutorials, labs, assignments). Evidence must cover **at least 6 months of consistent academic use**.
      *   **Stop Rule (HARD STOP - Reject):** If evidence shows use began less than 6 months ago, is sporadic, or only used for specific assignment types not analogous to the exam. *Appeal:* Student provides evidence of longer/more consistent integration.
      *   **Stop Rule (HARD STOP - Reject):** If the resource is shared (e.g., class notes on Google Doc) or primarily contains content generated by others (tutor, classmate, AI) *unless* the student demonstrably owns/controls the specific content through significant personal curation/annotation *and* this is verifiable (see Step 3). *Handoff:* Proceed to Step 3 for verification.

  3.  **Is the specific information/content within the resource demonstrably generated, vetted, curated, and "owned" by the student?**
      *   **Sufficient Answer:** The student is the primary author/curator; content reflects their understanding, errors, and organization. Not pre-packaged solutions or tutor-generated cheat sheets.
      *   **Evidence:** **Review Session:** Student presents the *actual resource/content* to be used *early in the term* (e.g., to disability advisor/tutor). Must show personal annotations, self-generated examples, unique organization, evidence of revision/error correction. Tutor-generated templates/formula lists must be heavily personalized. AI-generated content requires clear demonstration of student's critical input/editing control. Shared resources require clear identification of student's unique contributions/annotations.
      *   **Stop Rule (HARD STOP - Reject):** If content is primarily tutor/peer/AI-generated without significant, verifiable student personalization/curation/control (e.g., a tutor's formula sheet, raw AI output). *Appeal:* Student demonstrates personal ownership through detailed revision history or annotated examples.
      *   **Stop Rule (HARD STOP - Reject - Intermittency):** If the resource is demonstrably unreliable or only intermittently available to the student *under conditions simulating exam stress/hall constraints* (e.g., specific software crashes, unstable internet if cloud-based, shared device conflicts). *Appeal:* Student demonstrates reliable alternative or solution verified *before* the exam period.

  4.  **Is the resource consulted automatically and uncritically trusted as part of the student's cognitive process?**
      *   **Sufficient Answer:** Evidence shows the student relies on the resource seamlessly for foundational recall/processes without conscious verification each time, similar to biological memory recall. Not a reference checked deliberately.
      *   **Evidence:** **Observed Demonstration (Early Term):** Student performs a timed, relevant task (e.g., past exam question) using the resource under observation. Assessor looks for: (a) Automatic, frequent consultation without hesitation; (b) Lack of cross-checking against another source; (c) Integration into the flow of work. **Usage Logs (if applicable):** Showing high frequency of very short access times, suggesting quick look-ups, not deep reading. **Student Self-Report + Clinician Corroboration:** Consistent description of automatic reliance as an essential compensatory strategy.
      *   **Stop Rule (Counts Against - Proceed Cautiously):** If consultation is deliberate, infrequent, or involves conscious verification/cross-checking. This suggests a *tool*, not an extension.
      *   **Stop Rule (HARD STOP - Reject - Non-Verifiable Process):** If the resource performs complex operations (e.g., statistical analysis, significant sentence restructuring) that the student *cannot explain, replicate in principle, or verify for correctness* internally, even at a basic level. This moves beyond memory extension into task substitution. *Appeal:* Student demonstrates understanding/replication of core processes without the tool.

  5.  **Does granting the resource fundamentally alter the core skill/knowledge being assessed by the exam, as defined by the department's learning outcomes?**
      *   **This step is a HANDOFF, not a committee decision.** The committee stops fact-finding.
      *   **Framing the Referral to Department:** "Based on documented medical need and evidence of habitual, integrated use constituting a functional cognitive extension for this student, the committee finds the resource meets the criteria for accommodation *as an extension of the student's mind*. We now require the department to confirm whether assessing the student's ability *without this specific integrated function* is an *essential, explicitly stated learning outcome* for this exam that cannot be measured indirectly. Please specify the precise skill/knowledge outcome compromised and how its unaided demonstration is pedagogically necessary, referencing your published module/course learning outcomes."
      *   **Committee Role:** If department insists unaided demonstration *is* essential, the committee documents this and the justification. The *accommodation request for this resource in this exam* is denied, but the committee/department must collaborate on alternative assessment modes if the student cannot demonstrate the core skill unaided (e.g., alternative exam format, viva). If the department cannot articulate a specific, essential learning outcome compromised beyond "knowing stuff" or "following rules," the accommodation should generally stand.

  **Applying the Procedure to Your Cases**

  1.  **Student with Degenerative Visual Condition (Screen Reader/Braille Display):**
      *   Step 1: **YES** (Blindness/low vision). Hard Stop Grant? Likely YES - Direct sensory compensation. *Handoff only if exam tests unaided sight.* (Unlikely).
      *   Step 2: **YES** (6 years habitual use). Evidence: Clinician letter, disability services records, tutor confirmation.
      *   Step 3: **N/A** (The resource accesses *the exam questions/answers*, not stored personal content. Its "content" is the exam itself/output).
      *   Step 4: **YES** (Automatic, trusted, foundational access).
      *   Step 5: **HANDOFF:** Department must justify if unaided sight-reading is essential. Extremely unlikely. *Committee Reflexive Approval Confirmed. VERDICT: **GRANT.***

  2.  **Student Requesting Tutor-Compiled Statistics Formula/Decision Sheet:**
      *   Step 1: **Assumed YES** (Presumably based on disability e.g., memory impairment, ADHD? If not, fails here. *Assume disability documented*).
      *   Step 2: **?** Habitual use? Key question. "Compiled by tutor" suggests *not* student's habitual, personalized resource. Needs evidence student *always* uses *this exact tutor-made sheet* for stats work for 6+ months. Unlikely. *Likely HARD STOP REJECT here.* Evidence required: Logs/demo showing student *only* uses this specific tutor-made sheet, not self-made notes, for core stats work. Tutor statement confirming student *depends* solely on this sheet, not internal recall or their own notes.
      *   Step 3: **NO** (Content generated by tutor, not student). *HARD STOP REJECT.* Even if habitual use shown, lack of student ownership fails.
      *   Step 4: (Moot if fails 2/3, but likely deliberate reference, not automatic extension).
      *   Step 5: **HANDOFF:** If it passed Step 2 miraculously, referral focuses on whether unaided recall of formulae/rules is essential. Department likely says YES (partly rewards knowing which test). *Committee Reflexive Refusal Likely Confirmed. VERDICT: **REJECT.*** (Based primarily on Step 3: Not student-owned).

  3.  **Student Requesting Dictation + Grammar Restructuring (Written Expression Graded):**
      *   Step 1: **YES** (Presumably disability e.g., dysgraphia, dyslexia, motor impairment documented).
      *   Step 2: **YES** (2 years daily use). Evidence: Clinician letter, usage logs (speech-to-text app), tutor statements on observed use in assignments.
      *   Step 3: **Partially?** Dictated words are student's own. *Grammar Restructuring is the issue.* Does student "own" the restructured output? Requires demonstration: Show original dictation vs. tool output + student explaining/endorsing changes. Crucial: Can they replicate the restructuring logic internally? If it makes complex changes they don't understand, fails.
      *   Step 4: **?** Automatic & Trusted? Likely YES for dictation. **NO for Grammar Tool (Likely HARD STOP REJECT):** If they cannot explain/verify the changes (Step 3) or if observation shows they deliberately use it *to improve* expression beyond their unaided capability (not just to access), it fails Step 4. It becomes a tool enhancing skill, not extending access. *Evidence needed:* Demonstration showing tool use is for *access* (getting ideas down) not *enhancement* (improving writing quality they couldn't achieve unaided). If expression is graded, enhancement directly bypasses assessment.
      *   Step 5: **HANDOFF:** If it passed Step 4 (unlikely), referral focuses: "Is assessing unaided written sentence structure/complexity an essential learning outcome?" Department will almost certainly say YES. *Committee Reflexive Refusal Likely Confirmed. VERDICT: **REJECT.*** (Primarily based on Step 4: Tool enhances graded skill, not merely extends access/memory. Fails Non-Verifiable Process/Enhancement stop rule).

  **Resisting the Results & Analysis**

  *   **Statistics Formula Sheet (Rejected):** Your committee might reflexively *approve* this as a "reasonable note sheet." The procedure rejects it because it's **not student-owned** (Step 3) and likely **not habitually integrated** as a *constitutive* part of the student's cognition (Step 2). It's a reference tool. The procedure highlights that accommodations based on extended mind require *personal cognitive integration*, not just access to information. **Is this a defect?** Arguably *no*. The procedure correctly distinguishes between compensating for a disability's *access barrier* (allowing a *student-made* memory aid) versus bypassing the assessment of *knowledge recall/application* using externally provided solutions. The defect might be in current practice viewing all "note sheets" similarly.
  *   **Dictation + Grammar (Rejected):** Your committee might reflexively *refuse* dictation alone (wrongly, if for dysgraphia) but be split on grammar help. The procedure rejects the *grammar restructuring* because it likely **enhances a graded skill** rather than merely extending access (Step 4) and the student **cannot verify/own the output** fully if they don't understand the changes (Step 3). **Is this a defect?** *Unclear.* It depends on the disability. If the disability *prevents* coherent written expression *without* such tools (e.g., severe dyslexia affecting syntax), and the tool is truly integrated/necessary for *basic* coherence (not enhancement), it *might* pass Step 4 with strong evidence. However, if the exam grades *quality* of expression, allowing a tool that demonstrably improves it creates an uneven playing field. The procedure forces a hard look: Is the tool compensating for a disability barrier to *expression*, or is it enhancing *skill*? The defect might be in assessment design if quality of expression is graded for students with documented disabilities affecting expression, without offering truly equivalent alternatives (e.g., oral exams).

  **What the Procedure Cannot Do**

  1.  **Override Legal Mandates:** It operates *within* the framework of disability discrimination law. If a resource is deemed a legally required "reasonable accommodation" based on clinical need and standard practice (like a screen reader), the procedure grants it early (Step 1 Hard Stop Grant).
  2.  **Supersede Departmental Academic Authority:** It explicitly hands off the final decision when the accommodation genuinely conflicts with an essential, defined learning outcome assessed by the exam (Step 5). The committee facilitates, but doesn't override, academic judgment on *what* is being assessed.
  3.  **Guarantee Perfect Self-Report:** It relies on observable evidence and verification to mitigate unreliable/strategic self-reporting (demos, logs, tutor observations, resource reviews). However, sophisticated gaming is always a risk.
  4.  **Resolve Foundational Debates About Assessment:** It cannot settle whether universities *should* value unaided recall. It accepts that many exams *do* test it, and provides a structured way for departments to defend that choice when necessary (Step 5).
  5.  **Create Integration Where None Exists:** It requires proof of long-standing, habitual use (Step 2). A student cannot suddenly adopt a complex tool weeks before an exam and claim it's part of their extended mind.
  6.  **Define "Essential Learning Outcome":** The interpretation of what is "essential" remains with the academic department, though the referral demands specific justification linked to published outcomes.

  This procedure transforms the philosophical insights of the extended mind into actionable, evidence-based steps focused on functional integration, personal ownership, and established necessity, while respecting institutional boundaries and academic freedom. It will likely lead to more consistent, defensible, and educationally sound decisions than improvisation.
