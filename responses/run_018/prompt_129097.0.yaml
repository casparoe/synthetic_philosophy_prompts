  I'm facilitating an adversarial collaboration between two researchers who have argued for over a year about approval-directed versus goal-directed agency, yet never produced a shared document. One party—the Structural Separationist—holds that approval-directed learning necessarily produces agents lacking stable intertemporal goals: sycophancy and reward hacking are not implementation bugs but architectural inevitabilities, because the agent's objective is constitutively indexed to an external evaluator's preferences. The other—the Implementation Pluralist—holds that approval is only one training signal among many, and whether an agent ends up genuinely goal-directed depends on its emergent representational architecture; under the right conditions, approval-directed training can converge on stable world-models that support authentic goal-pursuit.

  Write the joint statement they should have produced. Begin with a one-sentence bottom line stating what both sides agree is actually at stake—whether the disagreement is substantive or partly verbal—so a reader can orient immediately. Then provide a numbered section of agreed claims about the formal structure of approval-directed learning, the documented empirical patterns of sycophancy, the conditions under which representational stability emerges, and the conceptual distinction between a training objective and an operational policy. Follow this with a disagreements table in two columns: the left phrased in wording the Separationist accepts, the right in wording the Pluralist accepts, precisely locating where they part ways on whether approval-indexing is constitutive or contingent.

  Next, identify the cruxes. I take the deepest to be intertemporal consistency under approval shift: if human raters systematically change what they approve of across phases of deployment, does the agent's behavior track those shifts or maintain prior goals anchored in stable representations? For each crux, specify a concrete case or experimental structure both agree would bear on it—perhaps a multi-phase training regime with documented preference drift—and record each side's advance prediction about the outcome. Keep the entire document to no more than 600 words; do not include citations, bibliographies, or requests for further reading, since this is meant to stand on its conceptual structure alone.
