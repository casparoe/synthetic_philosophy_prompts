prompt: |-
  My grad students keep throwing around "you can't rationaly choose a life you haven't lived yet" whenever transformative experience comes up — last week someone used it to dismiss pre-committment contracts for career paths. What are the different precise claims hiding in that one-liner? Lay out the menu: is it about missing phenomenalogical data, about preference instability across personal identity, about expected-utility maximization breaking down when the chooser is transformed, or about some deeper limit on practical reason? For each reading say whether it's plausible, whether it actually supports dismissing pre-commitment, and whether it quietly relies on a narrative-continuity view of the self that conflicts with other parts of the argument. Don't just rehash the standard literature; I want the disambugation with verdicts, something I can bring straight into seminar.
