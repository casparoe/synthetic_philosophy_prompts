answer: |-
  Here is the conceptual framework of desiderata for an adequate theory of rescue obligations in the contemporary context, anchored in but extending beyond Singer's drowning child:

  **Core Desiderata (Requirements) for a Theory of Rescue Obligations:**

  1.  **Proximity Agnosticism / Technological Mediation Handling:**  
      *   **Must Deliver:** The theory must assign equivalent moral weight to situations where the agent is *physically proximate* to the victim (e.g., child in the shallow pond) and situations where the agent *observes an equivalent crisis with equivalent capacity to act effectively via remote technology* (e.g., high-definition live drone feed showing a child drowning in a remote pond, with the agent possessing the *only* means to instantly deploy a rescue drone they control).
      *   **Motivating Case:** Ubiquity of remote witnessing (disaster footage, refugee crises live-streamed, drone surveillance) creates situations morally analogous to physical proximity but lacking physical presence. A theory must account for why seeing suffering "through a screen" doesn't automatically diminish the obligation if intervention capacity exists remotely.
      *   **Status:** **Negotiable/Contentious.** Non-negotiable for strict cost-blind universalists (Singerians). Often contested by agent-centered theorists who see physical proximity as psychologically or morally distinct (e.g., triggering a unique "confrontation" demanding response), or who emphasize the practical/epistemological differences in mediated observation.

  2.  **Discrete vs. Iterative Demands Distinction:**  
      *   **Must Deliver:** The theory must clearly differentiate the moral structure of a *singular, discrete rescue opportunity* (e.g., saving *this* drowning child *now*) from the structure of *iterated, constant demands* (e.g., being bombarded with live feeds of countless drowning children globally, daily). It must address the risk of *moral fatigue* (psychological exhaustion leading to inaction) and *institutional dependency* (individual action undermining systemic solutions or creating harmful reliance).
      *   **Motivating Case:** Remote technology exposes agents to a potentially overwhelming, continuous stream of global suffering. A theory treating every instance identically risks demanding unsustainable sacrifice or neglecting the need for collective, institutional responses over perpetual individual heroics.
      *   **Status:** **Non-Negotiable (for psychological/practical realism).** Both universalists and agent-centered theorists acknowledge this challenge, but resolve it differently. Universalists might incorporate thresholds based on significant cost or advocate institutional fixes, while agent-centered theories might build in limits based on personal integrity or projects.

  3.  **Rescue/Charity Boundary Preservation:**  
      *   **Must Deliver:** The theory must maintain a conceptually robust distinction between acts that are *morally obligatory* (rescue) and acts that are *praiseworthy but beyond obligation* (supererogatory charity). It must avoid collapsing all helping acts into duty (moral overload) or diluting rescue obligations into mere charity (undermining their force).
      *   **Motivating Case:** Preventing mission creep. If every act of preventing harm becomes a strict duty, morality becomes impossibly demanding. Conversely, if preventing easily avertable death is merely "nice," core moral intuitions (like saving the drowning child) are violated. The theory must define the threshold separating "must do" from "good to do."
      *   **Status:** **Non-Negotiable (for conceptual coherence).** Both camps generally accept the *need* for this distinction, but fundamentally disagree on *where* the line is drawn. Universalists draw it based on cost/benefit (low cost/high benefit = obligation), agent-centered theorists often draw it based on significant sacrifice, personal projects, or special relationships.

  4.  **Psychological Realism (Decision Fatigue & Resource Depletion):**  
      *   **Must Deliver:** The theory must be consistent with empirical findings about human cognition and motivation under sustained demand. It must account for *decision fatigue* (deteriorating judgment/altruism after repeated moral choices), *resource depletion* (finite emotional/psychological energy for empathy and action), and *diminishing marginal utility of sacrifice*.
      *   **Motivating Case:** Ignoring human cognitive and emotional limitations renders a theory practically irrelevant or even counterproductive. A theory demanding constant attention and action equivalent to discrete rescues ignores how sustained exposure exhausts the capacity to respond effectively or compassionately.
      *   **Status:** **Non-Negotiable (for applicability).** A purely abstract theory ignoring human psychology fails. Universalists must incorporate these limits into their cost/benefit calculus or institutional focus. Agent-centered theories often build these limits into their foundations (e.g., recognizing the necessity of personal resources/well-being for sustained agency).

  5.  **Action-Guidance Clarity:**  
      *   **Must Deliver:** The theory must provide agents with clear, practical guidance on *when* a rescue obligation arises, *what* constitutes fulfilling it (e.g., direct intervention, funding reliable proxies, supporting systemic solutions), and crucially, *when* the obligation is satisfied or overridden.
      *   **Motivating Case:** Moral theories must help agents navigate real-world choices. Vague or infinitely demanding principles (e.g., "prevent all suffering you can") are paralyzing. Agents need to know the scope and limits of their duty in complex, mediated contexts.
      *   **Status:** **Non-Negotiable (for functional adequacy).** All camps aim for this, but achieve it differently based on their core principles.

  6.  **Consistency & Non-Arbitrariness:**  
      *   **Must Deliver:** The theory must apply its core principles consistently across different cases (physical vs. remote, discrete vs. iterated) without relying on morally arbitrary factors (like physical distance alone, or the nationality/identity of the victim).
      *   **Motivating Case:** To avoid capriciousness and uphold fairness. If proximity alone (without impacting capacity) negates a duty, or if identity determines who deserves rescue, the theory risks incoherence or bias.
      *   **Status:** **Non-Negotiable (for basic plausibility).** A fundamental requirement, though interpretations of "arbitrary" differ (agent-centered theorists argue personal projects/relationships aren't arbitrary).

  **Hard Conflicts & Joint Unsatisfiability:**

  *   **The Core Tension:** **Strict Proximity-Independent Duty vs. Preservation of Long-Term Agent Capacity** appears **jointly unsatisfiable under maximal interpretations**.
      *   **Conflict:** A truly *strict* and *proximity-independent* duty (Desideratum 1, strict universalist interpretation) applied to the *iterated demands* of remote observation (Desideratum 2) inherently conflicts with preserving agent capacity (Desideratum 4) and maintaining the rescue/charity boundary (Desideratum 3). It demands constant, exhausting action indistinguishable from supererogation, violating psychological realism and collapsing the obligatory/supererogatory distinction.
      *   **Resolution Attempts:** Theories *must* compromise:
          *   **Universalist Compromise:** Introduce significant cost thresholds or shift primary obligation to institutional actors for iterative demands, weakening the *immediacy* and *individual scope* of the strict duty in the face of constant remote crises.
          *   **Agent-Centered Compromise:** Reject strict proximity-independence, arguing that mediated distance *does* alter the nature of the demand or the agent's relationship to it, justifying limits based on personal resources/projects, thereby preserving capacity and the boundary but potentially violating strict consistency (Desideratum 6) on universalist grounds.

  **Assessment of Singer's Original Framing:**

  Singer's original "drowning child" argument, interpreted strictly as demanding we prevent bad things if we can without sacrificing anything morally significant, **struggles to survive the most demanding items on this list unscathed:**

  1.  **Proximity Agnosticism:** Singer's principle *formally* survives this well – remoteness via technology doesn't inherently diminish capacity or cost, so the duty remains. This is its strength.
  2.  **Iterative Demands:** This is Singer's **Achilles' heel** in the age of remote observation. The strict principle, applied literally to constant global suffering witnessed remotely, demands unsustainable sacrifice, leading directly to moral exhaustion (violating Desiderata 2, 3, and 4). It collapses rescue into an overwhelming duty indistinguishable from total self-sacrifice, failing to preserve the boundary or account for psychological limits.
  3.  **Rescue/Charity Boundary:** Singer's principle blurs this boundary significantly under sustained demand. What counts as "morally significant" sacrifice becomes the only limiter, pushing vast amounts of what was traditionally supererogatory into the domain of obligation.
  4.  **Psychological Realism:** The strict principle ignores human limitations under constant demand. It assumes agents can perpetually make optimal cost/benefit judgments and sustain altruistic action, which empirical evidence contradicts.
  5.  **Action-Guidance:** While clear in the discrete case, it becomes paralyzingly vague and demanding in the iterative, mediated context ("How much must I give before 'comparable moral significance' kicks in?").

  **Conclusion:** Singer's core *insight* – that physical distance alone doesn't negate obligation if capacity exists – remains powerful and addresses Desideratum 1 effectively. However, his *strict, unlimited formulation* is critically undermined by the realities captured in Desiderata 2, 3, and 4. An adequate contemporary theory must either significantly modify Singer's principle (e.g., incorporating robust cost thresholds, satisficing, or institutional delegation) or adopt a fundamentally different agent-centered foundation that explicitly builds in limits against the overwhelming tide of remotely witnessed suffering to preserve agency and the obligatory/supererogatory distinction. The age of remote crisis observation exposes the need for rescue theories to grapple seriously with human finitude and the structure of sustained demand.
