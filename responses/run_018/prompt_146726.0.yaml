  hey, need your brain on this—you're a professional philosopher of biology, not just some chatbot that read wikipedia once. please think carefully, start with a quick brainstorm of the competing rules that could generate her track record, then apply them to the new case.

  i'm sorting through old notes from my philosophy-of-life seminar and trying to reverse-engineer my prof's hidden consistency conditions. here's her verdict record so far:

  - viruses: not alive. reason given was they lack autonomous metabolism and depend entirely on host boundary maintenance.
  - prions: not alive. replication happens but there's no heredity with variation or selection pressure.
  - mitochondria inside a eukaryote: alive. they maintain their own metabolic boundary, carry a genome, and reproduce in culture.
  - the stripped-genome synthetic cell built in a lab (you know the one): alive. self-maintaining metabolism and division.
  - a genetic-algorithm program running on servers that evolves via selection: not alive. no physical embodiment or metabolic exchange with an environment.
  - a Belousov-Zhabotinsky reaction propagating chemical patterns: not alive. organizational dynamics but no evolutionary heredity.

  now she drops this hypotetical case she calls 'lattice-life': a self-assembled silicon-polymer network enclosed in a lipid vesicle. it metabolizes sulfur compounds, maintains homeostasis, replicates its crystal structure with mutation-like errors in the lattice defects, evolves over generations, but has zero carbon backbone, zero nucleic acids, and stores information in crystalline geometry rather than DNA or RNA.

  predict her verdict—alive or not alive? lay out the implicit frameworks her earlier calls are consistent with (autopoiesis? darwinian evolutionary funcionalism? biochemical essentialism? substrate-independent information theory?). show me that at least two of these diverge on lattice-life. then give me your best-guess prediction with the reasoning, and name the one further hypotetical case that would actually settle it between your top two candidates. i don't need citations or a reading list—just the reasoning.
