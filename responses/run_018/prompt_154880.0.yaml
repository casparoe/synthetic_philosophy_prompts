  Problem (2) should be next because it deals with knowledge structures. If Problem (1) redefines power mechanisms, then understanding how knowledge (episteme) operates within that new framework is essential. Applying episteme to algorithms without conflating it with normalization requires a clear grasp of the power dynamics established in Problem (1). If episteme can be distinct, it sets the stage for examining risk profiling as a knowledge practice.

