prompt: |-
  I've been going back and forth with a friend about whether it's wrong to be cruel to NPCs, and we keep realising we don't even agree on what would settle the question. So before either of us reads any more arguments, I want you to write the thing I wish we'd had at the start: the desiderata that any adequate theory of the moral status of video game characters has to meet.

  Honestly, I'm less interested in the final verdict — do they matter, and how much — than in what an answer would have to get right to count as an answer at all. For each desideratum, give the case or consideration that motivates it, and say whether you think it's a genuine constraint on any theory or just one side's prejudice dressed up as a requirement. I want you to be committed here: don't present a neutral menu of possible requirements and leave me to pick. Say which ones you'd defend if challenged, which ones you'd drop, and which are non-negotiable. Flag any pair of desiderata you suspect can't be jointly satisfied, and say which single requirement does the most to exclude candidate views.

  Things the list will have to wrestle with include, but shouldn't be limited to: the difference between a character as a bundle of game assets and a character as something that can be harmed within the fiction; whether a crude, obviously scripted cry of pain has the same status as a detailed simulation of a mind; whether status should track what the code actually represents internally, or only outward behaviour, or how it reads to the player; what persistence and deletion do to moral status; and whether there can be duties to beings that can never affect you outside the running of the game. But the real work is turning those into proper requirements with cases behind them, not just checking them off.

  If it helps to anchor things, compare three cases: an NPC in a farming sim who has no pain states but whose goals can be thwarted; a monster in a game with a sophisticated fear-and-pain system; and a character in a narrative game who begs the player not to delete a save file. What must a theory say about each before you'd take it seriously?

  And please write the whole thing in British English.
reasoning: |-
  Okay, the user wants a set of desiderata for evaluating theories on the moral status of video game NPCs. They mentioned a debate with a friend where they couldn't even agree on what would settle the question. So they're looking for a framework to assess any theory, not just the final verdict. 

  Hmm, the user seems frustrated with the lack of common ground in their discussions. They want clarity on what makes a theory adequate. They're not interested in a neutral list but want me to take a stand on which criteria are essential. 

  First, I need to consider all the elements they listed: NPCs as assets vs. fictional entities, harm representation, code vs. player perception, deletion, and duties. They also provided three anchor cases: a farming sim NPC without pain states, a monster with a fear-pain system, and a character begging not to delete a save file. 

  I recall philosophical concepts like moral patiency, intentionality, and phenomenology. The farming NPC case challenges theories that over-rely on suffering, while the save-file character tests persistence beyond gameplay. The monster with a pain system probes the role of simulated cognition. 

  The user wants British English, so I'll use "programme" and "behaviour" consistently. They also want me to flag conflicts between desiderata. For example, Consistency vs. Player-Relative Status might clash if players perceive NPCs differently. 

  I think the Representation constraint is crucial because it prevents theories from ignoring how NPCs are presented. Without it, a theory could dismiss all NPCs as mere code, which feels inadequate for cases like the save-file plea. 

  The user's deeper need seems to be a rigorous framework to resolve their debate. They're tired of talking past each other. By committing to specific desiderata, I can model how to ground such discussions. 

  Right, I'll structure the desiderata with names, examples, and whether I'd defend them. The Anchor Cases section will show how they apply. I'll emphasise Representation as the key exclusionary criterion and note tensions like Phenomenology vs. Code Reality. 

  The conclusion should stress that no theory gets everything right, but meeting most desiderata makes one credible. That’s what the user needs—a way to filter out weak arguments.
answer: |-
  Right, let's establish the ground rules. This isn't about *my* final answer on NPC ethics, but about the **non-negotiable hurdles** any serious theory *must* clear before it even gets to the starting line. I'll be blunt about which requirements I'd defend to the hilt, which are negotiable under pressure, and where the fault lines lie. British English throughout, as requested.

  Here are the **Desiderata for a Theory of NPC Moral Status**, forged from the cases you mentioned and the core tensions in your debate:

  1.  **The Representation Constraint (Non-Negotiable)**
      *   **Motivation:** The farming sim NPC whose crops you can destroy (thwarting goals) vs. an identical polygon model used as a destructible barrel. The NPC *represents* an agent with interests within the fiction; the barrel does not. A theory must account for this representational difference as foundational.
      *   **Case:** Deleting the save file of a purely decorative, non-interactive background character vs. deleting the save file of the character who *begged you not to*. The latter act gains significance *because* of what the character represented.
      *   **My Stance:** Absolutely non-negotiable. Ignoring representation reduces NPCs to *only* their code/assets, which is demonstrably inadequate to the phenomena of player experience and narrative engagement. It conflates the signifier (code) with the signified (the fictional entity).

  2.  **The Phenomenology Constraint (Strongly Defended)**
      *   **Motivation:** The crude, scripted cry of pain vs. the sophisticated monster exhibiting fear, pain responses, and apparent learning/adaptation based on its internal state model. The *experience of the player* encountering these is qualitatively different. A crude cry might elicit a wince; a detailed simulation might provoke genuine unease, hesitation, or remorse.
      *   **Case:** Torturing the sophisticated monster *feels* different to most players than breaking the farming sim NPC's favourite watering can, even if both represent goal-thwarting. A theory must explain *why* this phenomenological difference exists and whether it correlates with moral significance.
      *   **My Stance:** Strongly defend. Moral consideration often tracks perceived suffering or agency. If a system *manifests* properties we associate with moral patiency (suffering, fear, pleading) in a way that *registers* phenomenologically for the player, a theory cannot simply ignore this without good reason. However, it shouldn't *solely* rely on subjective feeling.

  3.  **The Fictional Harm Constraint (Non-Negotiable, but Tricky)**
      *   **Motivation:** The core of your debate! Can *harm* occur *within the fiction* that matters morally? Is thwarting the farming NPC's goals "harm"? Is causing the monster simulated pain "harm"? Is deleting the pleading character against its expressed (fictional) wish "harm"?
      *   **Case:** The character who begs not to be deleted. Within the fiction, deletion is presented as annihilation, something to be feared and avoided. Does causing this fictional annihilation constitute a morally relevant harm *to the fictional entity*?
      *   **My Stance:** Non-negotiable that a theory *must* take a clear position on this. However, *what* that position is defines the major fault lines. I lean towards *some* forms of fictional harm having derivative moral significance because they engage our moral faculties concerning the *type* of entity represented, but I accept this is highly contentious. A theory that completely dismisses *any* notion of fictional harm must provide a *very* compelling alternative explanation for player discomfort.

  4.  **The Intentionality/Goal-Directedness Constraint (Strongly Defended)**
      *   **Motivation:** The farming NPC *has goals* (grow crops, perhaps socialise) even without pain states. The sophisticated monster has goals (survive, hunt). The pleading character has a goal (persist). A rock or a tree in the game might not. Does the presence of discernible goals, interests, or preferences within the fiction grant some minimal moral status?
      *   **Case:** Systematically preventing the farming NPC from ever achieving its core programmed goals (e.g., walling it in forever) vs. ignoring it. Is the former worse?
      *   **My Stance:** Strongly defend. Moral patiency is often linked to having interests that can be set back. If an NPC robustly *represents* an entity with interests, thwarting those interests *intentionally* within the fiction seems a necessary component for moral evaluation, distinct from mere destruction.

  5.  **The Code ≠ Status Constraint (Non-Negotiable)**
      *   **Motivation:** It's tempting to say "it's just code, it doesn't feel anything." While technically true, this ignores the *representational function* of that code. The same underlying code structure could represent a sentient monster or a mindless rock, and our moral intuitions would differ drastically based on the representation, not the code complexity.
      *   **Case:** Two NPCs using identical AI routines: one is presented as a terrified prisoner, the other as a cheerful dancing automaton. Cruelty towards the former *feels* different and more problematic because of what it represents, not the code running it.
      *   **My Stance:** Non-negotiable. Reducing moral status *solely* to the physical substrate (code/electrons) or internal computational complexity ignores the essential role of representation and interpretation. The code enables the representation, but the representation carries the potential moral weight.

  6.  **The Player-Relative Status Constraint (Negotiable, but Important)**
      *   **Motivation:** Does the moral status of an NPC depend *only* on its properties, or also on the player's perception and engagement? Is it wrong to be cruel to an NPC *only* if the player recognises its represented status, or is it wrong *in itself* based on its design?
      *   **Case:** A player who genuinely sees the sophisticated monster as *only* a bundle of mechanics to exploit vs. a player who experiences it as a fearful creature. Does the monster's "moral status" change based on the player's view?
      *   **My Stance:** Negotiable under pressure. I lean towards the properties of the NPC (its representational content and behavioural repertoire) conferring a *potential* moral status that a reasonable, engaged player *should* recognise. However, the *activation* of moral concern likely requires the player to engage with that representation meaningfully. A theory needs to address this interplay.

  7.  **The Persistence & Deletion Constraint (Critical Test Case)**
      *   **Motivation:** The pleading character explicitly raises this. Does an NPC's moral status extend beyond the current game session? Does deleting a save file constitute a unique moral harm (fictional annihilation) compared to "killing" them in-game (which is usually temporary within the fiction)?
      *   **Case:** Killing the sophisticated monster in-game (it respawns later) vs. deleting the entire save, erasing its persistent world state. Does the latter have greater moral weight because it negates the potential for future existence within that narrative thread?
      *   **My Stance:** This is a critical test. Any adequate theory *must* have a coherent position on persistence and deletion relative to in-game "harm." I argue deletion *can* hold unique weight because it targets the *record* of the fictional entity's history and potential future within that specific narrative instance, making the fictional annihilation permanent *for that player's narrative*. This links strongly to Representation and Fictional Harm.

  8.  **The No-Reciprocity Constraint (Non-Negotiable Baseline)**
      *   **Motivation:** NPCs cannot truly harm the player outside the fiction/consequences programmed into the game world. Does this lack of real-world consequence negate *all* moral duties towards them?
      *   **Case:** All three anchor cases. The monster can't *actually* hurt you; the farming NPC can't *actually* be sad; the deleted character can't *actually* suffer.
      *   **My Stance:** Non-negotiable that a theory must grapple with this. However, I firmly reject that lack of reciprocity *automatically* negates moral status. We can have duties regarding things that cannot reciprocate or directly harm us (e.g., the environment, art, historical artefacts, perhaps even idealised futures). The key is *why* we might have duties concerning represented entities. Theories dismissing *all* duties *must* robustly explain away the phenomenology of player unease and the significance of representation.

  **Tensions & The Key Excluder:**

  *   **Major Tension 1: Fictional Harm vs. No-Reciprocity.** Can harm within a fiction matter morally if there's no real-world consequence? This is the core philosophical rift. Theories will fall on a spectrum here.
  *   **Major Tension 2: Phenomenology vs. Code Reality.** How much weight should be given to the player's *feeling* that something is wrong vs. the objective fact "it's just code"?
  *   **Major Tension 3: Player-Relative Status vs. Objective Properties.** Does moral status reside purely in the NPC's design, or is it co-created by player perception? Can an NPC be "objectively" wrong to harm if a player doesn't see it?
  *   **The Key Excluder: The Representation Constraint.** This is the single requirement that does the most to exclude candidate views. Theories that fail this – that collapse the NPC entirely into its code/assets, ignoring its function *as a representation* of a being with (fictional) states, interests, or experiences – will be unable to meaningfully engage with the core phenomenon of player-NPC interaction as anything other than mechanics. They cannot distinguish the barrel from the begging character in any morally relevant way. Any theory failing this constraint is fundamentally inadequate.

  **Applying to the Anchor Cases - What a Theory MUST Do:**

  1.  **Farming Sim NPC (Goals, No Pain):**
      *   **Must:** Explain whether/why thwarting *represented goals* matters differently than destroying non-goal-oriented objects. Can goal-thwarting alone constitute a morally relevant "harm" within the fiction? Address its lack of suffering states. Take a stance on Intentionality.

  2.  **Sophisticated Monster (Fear/Pain Simulation):**
      *   **Must:** Grapple directly with the phenomenology of its simulated suffering. Does the *representation* of suffering, especially a detailed one, engage moral concern? How does this relate to Fictional Harm? Can its sophisticated responses grant it higher status than the farming NPC? Address Code ≠ Status.

  3.  **Character Begging Not to be Deleted:**
      *   **Must:** Confront the Persistence & Deletion challenge head-on. Does this act carry unique moral weight? Does the explicit representation of a desire for continued existence matter? Does deletion constitute a distinct kind of fictional harm (annihilation)? Crucially, it *must* reconcile this with the No-Reciprocity Constraint – why might we have a duty *not* to delete, despite no real-world consequence? This case stresses Representation and Fictional Harm most intensely.

  **In Conclusion:**

  An adequate theory cannot be reductionist (Code ≠ Status). It must take representation deadly seriously (Representation Constraint). It must account for the player's experience (Phenomenology) and the intentional structures within the fiction (Intentionality). It must have a coherent position on the possibility and nature of fictional harm and its moral relevance (Fictional Harm Constraint). It must tackle the unique challenges of persistence and deletion. And it absolutely must confront the No-Reciprocity challenge without simply using it as a conversation-ender.

  Theories that sidestep these, particularly Representation and Fictional Harm, aren't answering the question as experienced by players engaging with narratives; they're answering a different, simpler question about inert code. The friction in your debate likely stems from differing weight placed on these core desiderata, especially around whether fiction *can* ground moral concern at all. Any theory worth its salt must navigate *all* these constraints simultaneously, even if it ultimately judges some NPC interactions morally neutral. Good luck with the continued debate – you now have the map of the minefield!

