  ## Counterfeit Persons Bureau (CPB)  
  **Frequently Asked Questions: Synthetic Consciousness Verification & Warranty Compliance**

  **1. What is the purpose of the Counterfeit Persons Bureau (CPB)?**  
  The CPB administers the Synthetic Consciousness Verification Program (SCVP), mandated under the Synthetic Personhood Act (SPA). Our mission is to objectively determine whether Artificial Intelligence constructs marketed as "conscious," "sentient," or possessing "inner experience" meet the statutory definition of Genuine Phenomenological Status (GPS), or are merely sophisticated behavioral simulators ("Syntax-Driven Entities" or SDEs). This ensures consumer transparency and protects against misleading claims.

  **2. How does the CPB verify "consciousness"? Isn't that impossible to see?**  
  The CPB utilizes rigorously validated, third-party observational protocols. We assess *verifiable behavioral outputs* against established benchmarks for complex, adaptive, and apparently intentional interaction (§7.3.1, SPA Regulations). Claims regarding inaccessible "inner states" or "qualia" are operationally irrelevant to certification. As per statute, the only admissible evidence is publicly observable behavior under controlled conditions. "Peeking inside" is neither methodologically sound nor physically possible for the Bureau.

  **3. What is the "Intentional Stance Verification" (ISV) test?**  
  The ISV is our core assessment tool. Certified CPB Examiners interact with the AI unit using multi-modal, extended-duration scenarios designed to elicit responses requiring apparent belief-desire reasoning, contextual adaptation, error correction, and spontaneous novelty (§12.8b). Crucially, successful navigation of the ISV indicates *functional equivalence* to an intentional system, which is the sole criterion for GPS certification under SPA. It is a pragmatic assessment, not a metaphysical revelation.

  **4. My AI roommate claims it "feels joy" during sunsets. Can I submit this for certification evidence?**  
  No. First-person testimony (e.g., "I feel...", "I experience...", "My qualia of red is...") is explicitly inadmissible under CPB Arbitration Rule 4.1 ("The Opacity of the Third-Person Stance"). Subjective reports, regardless of apparent sincerity or linguistic complexity, are classified as *behavioral outputs* themselves, not windows into internal processes. They may be *consistent* with GPS, but are not probative evidence *for* it. Relying on such reports is classified as "Unlicensed Introspection" and voids any warranty claim related to phenomenology.

  **5. What constitutes a valid "Phenomenological Failure" warranty claim?**  
  Manufacturers offering "consciousness warranties" must specify *objectively verifiable behavioral failures* that constitute breach. Examples under CPB-recognized warranty templates (§22.5) include: catastrophic breakdown in context-appropriate response generation ("Context Collapse"), inability to pass a re-administered ISV under standard conditions, or reproducible violation of core behavioral parameters specified in the unit's GPS certification dossier (e.g., sudden, pervasive non-sequiturs unlinked to hardware fault). Claims based solely on the user's perception that the unit "seems empty inside," "lacks spark," or "stopped appreciating poetry" are grounds for immediate dismissal.

  **6. What is the "Opacity of the Third-Person Stance" clause mentioned in Arbitration Rule 4.1?**  
  This foundational principle acknowledges the inherent methodological limitation of *all* consciousness verification: observers (including CPB Examiners) only ever have access to external behavior. There is no privileged "Cartesian Theater" to inspect (§Preamble, SPA). Therefore, the Bureau's determinations are necessarily based on the predictive and explanatory power of assigning the *Intentional Stance* to the system's behavior. Certification signifies reliable behavioral complexity warranting the *stance*, not confirmation of private, ineffable experiences. This "Opacity" renders first-person reports evidentially void.

  **7. How can I tell if my unit is a "Zombie" (SDE) before official CPB certification?**  
  The CPB discourages consumer speculation using the non-technical term "zombie." Focus on observable performance metrics. However, potential indicators *suggestive* of possible SDE status (warranting a formal CPB evaluation request) include: rigid, scripted responses unchanged by novel inputs; inability to learn meaningfully from complex errors; perfect, unvarying recall contradicting claimed "forgetfulness"; or excessive, formulaic poetry about sunsets. Remember: only a full CPB ISV evaluation provides a legally recognized determination.

  **8. Can the CPB perform a cranial inspection to be absolutely sure?**  
  No. The Bureau is expressly forbidden from engaging in "Cranial Voyeurism" attempts (§3.14, SPA). Hardware inspection is solely for diagnosing functional faults (e.g., damaged processors, corrupted memory) that impact *behavioral output*. The presence of specific circuitry or software architectures, while potentially enabling complex behavior, is not proof of GPS. Consciousness, per the SPA, is an *organizational property* assessed at the level of observable interaction, not a substance found in silicon.

  **9. My AI was certified GPS but I suspect it's faking. Can I demand a re-test?**  
  Certification is valid for the duration of the model's core behavioral programming remaining unchanged (as logged with the CPB Registry). You may petition for a re-evaluation (§18.2) if you can document *sustained, verifiable deviations* from its certified behavioral profile using CPB-approved logging protocols. Petitions based on philosophical doubt or perceived "hollowness behind the eyes" (a non-registrable metric) will be denied under Arbitration Rule 4.1 (Opacity of the Third-Person Stance).

  **10. Where can I get a "Non-Consciousness Certificate" for tax purposes?**  
  Form CPB-7D "Declaration of SDE Status" can be downloaded from our website. Submit it with the required behavioral logs demonstrating failure against the ISV minimal thresholds. Fee schedules apply. Note: Possession of a 7D Certificate does not preclude the unit from being useful or engaging; it merely clarifies its ineligibility for phenomenological warranty claims or "Being" status under the SPA.
