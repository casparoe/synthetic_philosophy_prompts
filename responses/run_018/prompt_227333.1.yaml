prompt: |-
  I'm a retired physicist and lately I've been going down a rabbit hole on how you would actually test whether a machine (or a person, I supose) has induced a concept rather than memorized a lookup table. Two things keep coming up: Bongard problems and Raven's progressive matrices. Please compare the two as tests of concept induction. In particular: what exactly does each one ask the solver to do, and does that difference mean they measure different abilities or the same ability dressed up differently? Also, which one is harder to fake by pattern-matching on things you've seen before, and why -- I'm curious whether the two differ in how much prior exposure helps you, and whether a test that relies on very few examples per problem is fundamentally safer against memorization than one that relies on a familiar visual format. If you think one of them is clearly the better probe of genuine abstraction, say so and defend it, but also mention what the other one still captures that the winner misses.
