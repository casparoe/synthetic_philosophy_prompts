prompt: |-
  I've been figting with my friend for like three hours about akrasia and hyperbolic disounting and I'm pretty sure neither of us knows what we're actually demanding from a theory. So I want the full checklist: what does an adequate account of weakness of will have to deliver? Not just 'explain why people smoke,' but the real spec. It needs to cover the classic cases where you act against your own present all-things-considered judgment, but it also has to draw sharp lines between real weakness, compulsion, addiction, and rational preference reversal — and it can't just invoke a hyperbolic curve and declare victory, because that explains why preferences shift across time, not why you feel torn in the single moment of choice. Here's the part I think gets ignored: the theory should preserve the first-person sense of internal struggle, the feeling that parts of me are at odds, without treating my present self and future self as literally separate agents playing a bargaining game, since that dissolves the problem into intertemporal game theory and erases the very struggle it's supposed to explain. It also needs to square with the neuroscience on prefrontal inhibition without reducing normative failure to a mere brain glitch — weakness has to be something you can be blamed for, not just a mechanical malfunction. Flag which of these are genuinely non-negotiable hard constraints and which are just preferences of particular camps (like do we need determinism? empirical equivalence with Ainslie's intertemporal model? no hidden mental states?). And tell me straight if some subset is jointly unsatisfiable — maybe preserving a unitary self for the phenomology conflicts with the divided-self structure hyperbolic discounting seems to require? Don't lay out five rival theories and leave me hanging; take a definite stance on which desiderata are load-bearing and which ones should be dropped if they clash. I'm writing this up for a philosophy of action seminar and I'm sick of fence-sitting answers that just say Davidson thinks X but the economists think Y.
reasoning: |-
  Okay, the user is in a heated debate about akrasia and hyperbolic discounting. They're frustrated because neither they nor their friend seem to grasp what a theory of weakness of the will must actually accomplish. They want a clear checklist of requirements for an adequate account, going beyond just explaining behaviors like smoking. 

  First, I need to unpack their explicit demands. They mention several key points: the theory must cover acting against one's own judgment, distinguish weakness from compulsion/addiction/preference reversal, preserve the internal struggle without fragmenting the self, incorporate neuroscience without reducing blame to a "brain glitch," and maintain accountability. 

  Hmm, the deeper frustration seems to be with superficial academic discussions that just compare theorists (Davidson vs. economists) without resolving tensions. They're tired of fence-sitting—they want someone to take a stand on which requirements are essential and which might need to be compromised. There's also an implicit desire for conceptual clarity: they mention the "single moment of choice" problem, suggesting hyperbolic discounting feels insufficient because it's about time shifts, not simultaneous conflict. 

  The user's writing style is intense ("figting for three hours," "sick of fence-sitting")—they're likely exhausted and need directness. Since they're prepping for a philosophy of action seminar, they probably need academically rigorous but decisive answers, not a literature review. Their note about "not laying out five rival theories" is a red flag against over-quoting. 

  The real challenge is balancing three tension points: 
  - **Unity vs. division**: How to model internal conflict without making the self *actually* fragmented (since they reject "separate agents" metaphors). 
  - **Mechanism vs. blame**: Neuroscience (e.g., prefrontal inhibition) must inform but not eliminate moral responsibility. 
  - **Time dynamics vs. synchronic struggle**: Hyperbolic discounting explains *why* preferences reverse over time but not the acute agony of resisting temptation *now*. 

  I should flag which constraints are non-negotiable (e.g., blameworthiness, phenomenological struggle) versus debatable (e.g., determinism compatibility). The "unitary self" point feels crucial to their concern—if a theory requires fully split selves, it might "dissolve the struggle," so that’s likely a hard limit. 

  Also worth noting: they dismiss "hidden mental states," which targets Davidson’s partitioning strategy. Their demand for "sharp lines" between weakness/compulsion/etc. implies operational definitions matter, but philosophy rarely delivers razor-sharp categories. Might need to clarify that some boundaries will be fuzzy. 

  Finally, their jab at economists ("can’t just invoke a hyperbolic curve") suggests they want a theory that’s psychologically richer than revealed preference models. The neuroscience angle might bridge that—e.g., how discounting manifests as competing neural subsystems. 

  ...Time to structure this around hard constraints versus adjustable ones, and explicitly call out where trade-offs exist (e.g., "if you want unity + struggle, you sacrifice mechanistic elegance").
answer: |-
  Here's the definitive specification for an adequate theory of weakness of will (akrasia), distilled from the core philosophical, psychological, and phenomenological demands. I'll explicitly flag non-negotiables, preferences, tensions, and necessary trade-offs, taking the stance you requested.

  **Non-Negotiable Hard Constraints (The Load-Bearing Walls):**

  1.  **Synchronic Action Against Best Judgment:** *Must* explain how an agent can, **at a single moment T**, intentionally perform action A while simultaneously holding an *all-things-considered judgment* (ATCJ) that not-A is best *at T*. This is the core case (e.g., eating cake *while* judging dieting is best *right now*). *(Non-Negotiable - Defines akrasia)*
  2.  **Phenomenology of Internal Struggle:** *Must* preserve and explain the **first-person experience of conflict** – the feeling of "parts of me at war" or being "pulled" – *without* reifying the conflicting elements into fully separate, bargaining agents (e.g., "present self" vs. "future self" as distinct players). The struggle must feel *intra*-personal, not *inter*-personal. *(Non-Negotiable - Captures the essence of the phenomenon)*
  3.  **Blameworthiness/Praiseworthiness:** *Must* preserve the **normative dimension** – akratic action must be something the agent can be legitimately *blamed* for (or praised for resisting), distinct from compelled action (e.g., addiction hijacking) or mere non-culpable ignorance. The explanation cannot reduce akrasia *entirely* to a deterministic brain malfunction that absolves responsibility. *(Non-Negotiable - Connects to moral agency)*
  4.  **Distinction from Compulsion/Addiction:** *Must* provide principled criteria distinguishing **weakness of will** (culpable failure of self-governance) from **compulsion** (overwhelming urge experienced as alien or externally forced, reducing control) and **clinical addiction** (which may involve compulsion, neuroadaptation, and diminished capacity). *(Non-Negotiable - Conceptual clarity)*
  5.  **Distinction from Rational Preference Reversal:** *Must* distinguish akrasia from **rational preference shifts** based on new information, changed circumstances, or *anticipated* hyperbolic discounting (e.g., "I *now* prefer the smaller-sooner reward because my situation changed"). Akrasia involves acting *against* your *current* ATCJ. *(Non-Negotiable - Conceptual clarity)*

  **Important, But Negotiable/Context-Dependent Desiderata (The Interior Walls):**

  6.  **Compatibility with Neuroscience (Prefrontal Inhibition):** *Should* be compatible with findings on impulse control, executive function, and the role of prefrontal cortex in inhibiting limbic-driven desires. However, it *cannot mandate* a specific neural implementation or *reduce* the phenomenon solely to this level. *(Strong Preference - Empirical grounding)*
  7.  **Accounting for Temporal Dynamics (Hyperbolic Discounting):** *Should* explain *why* temptations are stronger proximally and how this *sets up* synchronic conflicts, but **cannot use temporal discounting *alone* to explain the synchronic akratic act**. The theory needs a synchronic mechanism *triggered by* the temporal dynamic. *(Strong Preference - Explains context)*
  8.  **Compatibility with Determinism:** *Need not* require libertarian free will. A robust compatibilist account (akrasia as failure of reasons-responsive mechanisms within a deterministic framework) is sufficient for most philosophical purposes. *(Preference - Philosophical parsimony)*
  9.  **Minimal Hidden Mental States:** *Should* avoid proliferating obscure mental entities (e.g., distinct "wills," infinitely subdivided faculties). Explanations using broadly recognized cognitive/volitional capacities (judgment, desire, intention, attention, inhibition) are preferable. *(Preference - Theoretical economy)*
  10. **Scope:** *Should* cover both "reckless" akrasia (succumbing to strong desire) and "listless" akrasia (failure due to lack of motivation/avolition), though the core case is often the former. *(Preference - Comprehensiveness)*

  **Tensions and Necessary Trade-offs (Where You Must Choose):**

  *   **The Unity/Division Tension:** This is the *core clash*. Preserving the **phenomenology of internal struggle (Constraint 2)** *requires* acknowledging a *degree* of internal division or conflict within the agent at T. However, rejecting **reified separate agents (Constraint 2)** *requires* maintaining the agent's fundamental *unity* as a single entity responsible for both the judgment and the action.
      *   **The Stance:** An adequate theory *must walk this tightrope*. It needs a model of the *single agent* as having **competing motivational streams or evaluative perspectives operating *within* a unified cognitive architecture** at T. Examples: competing "systems" (System 1/System 2 *descriptively*), conflicting higher-order desires, or attentional failures within a unified practical reasoning faculty. *Reification is forbidden; functional conflict is essential.* **Constraint 2 is paramount.**

  *   **Mechanism vs. Normativity:** **Constraint 3 (Blameworthiness)** demands akrasia be a failure of *agency*, not just mechanism. **Constraint 6 (Neuroscience)** points to mechanisms. An explanation that *only* describes neural inhibition failure risks reducing blame to a glitch. An explanation *only* in normative terms ("you didn't try hard enough") is vacuous.
      *   **The Stance:** An adequate theory *must bridge* the levels. It needs a **functional account of self-control** (e.g., the ability to align action with ATCJ via attention modulation, desire inhibition, or intention maintenance) that *can* fail. This functional failure *is* the mechanism, describable at both psychological and neural levels. Its *culpability* stems from the agent's general capacity for this function and the reasonableness of expecting its exercise *in that context*. **Both Constraint 3 and Constraint 6 can be satisfied with a layered functional account.**

  *   **Hyperbolic Discounting's Role:** **Constraint 7 (Temporal Dynamics)** is important but insufficient. Hyperbolic discounting explains *why* motivation for the tempting option spikes near T, creating the *conditions* for conflict. It *does not* explain how the agent, *at T*, both judges A best and does B. Synchronic conflict requires more.
      *   **The Stance:** Hyperbolic discounting is a crucial *background condition* and *source of motivational force*, **but it is not the theory of akrasia itself.** The core theory needs a synchronic component explaining the *failure to execute* the ATCJ despite its presence and the *simultaneous* motivating force of the temptation. **Constraint 1 & 2 require moving beyond pure discounting curves.**

  **The Satisfiable Core & What Must Be Dropped:**

  An adequate theory **CAN** satisfy the Non-Negotiables (1-5) together:
  *   By positing a **unified agent with competing synchronic motivations** (satisfying 1 & 2 without reification).
  *   By defining akrasia as a **culpable failure of a specific executive/volitional capacity** (self-control) to align action with ATCJ (satisfying 3 & distinguishing from compulsion/4).
  *   By clearly stating the ATCJ holds *at T* (distinguishing from rational reversal/5).

  **What likely needs softening/dropping to achieve this:**

  *   **Perfectly Sharp Boundaries (Constraints 4 & 5):** Real-world cases (especially involving addiction or complex preferences) will have grey areas. The theory must provide *principled distinctions*, not razor-sharp boundaries for all edge cases. Aim for clear paradigmatic cases.
  *   **Elimination of All "Parts" Language (Constraint 2):** Avoiding reification doesn't mean we can't talk *descriptively* about "parts" (e.g., "the part of me that wants health," "my better judgment"). The prohibition is against treating them as metaphysically distinct agents with their own goals and bargaining power. Functional conflict descriptions are fine.
  *   **Complete Independence from Temporal Dynamics (Constraint 7):** While insufficient alone, a plausible synchronic mechanism must *interact* with hyperbolic discounting (or similar dynamics) to explain the *strength and nature* of the proximal temptation. Pure synchronic theories ignoring time are empirically dubious.

  **The Definite Stance on the Core Theory:**

  The most promising path is a **Hierarchical or Executive Function Failure model within a unified agent:**

  1.  The agent forms a sincere **All-Things-Considered Judgment (ATCJ)** at T: "Not-A is best."
  2.  Simultaneously, strong **proximal motivation for A** (often amplified by temporal discounting) is present.
  3.  Akrasia occurs due to a **failure of the executive capacity for self-control**: the specific function responsible for **inhibiting** the motivation for A, **sustaining commitment** to the intention based on the ATCJ, or **directing attention** away from A's allure *at the moment of action*.
  4.  This failure is **culpable** because the agent possesses (and is generally capable of exercising) this self-control capacity; the failure is not due to overwhelming external force (compulsion) or complete incapacity (severe addiction/disease), but to a lapse in deploying available resources *when it was reasonable to expect they could/should*.
  5.  The **phenomenological struggle** *is* the experience of this internal competition between the ATCJ (supported by executive intentions) and the visceral motivation for A, and the *felt effort* is the attempted (but failing) exercise of the self-control capacity.

  This model satisfies the non-negotiables: synchronic conflict (1), internal struggle within unity (2), blameworthiness (3), distinction from compulsion/addiction (4 - failure of *capacity* vs. its *absence*), distinction from rational reversal (5 - ATCJ holds *at T*). It integrates neuroscience (6 - executive function = PFC inhibition) and temporal dynamics (7 - as the source of strong proximal desire) without being reduced to them. It avoids reified selves and minimizes obscure mental states. It accepts that boundaries (4/5) are principled but not always sharp in practice.

  **In short: Akrasia is the culpable failure of a unified agent's executive self-control function to align intentional action with their concurrent all-things-considered judgment in the face of competing proximal motivation.** This is the load-bearing structure an adequate theory must deliver.
