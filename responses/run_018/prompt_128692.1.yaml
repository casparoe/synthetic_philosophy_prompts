answer: |-
  Here is a disambiguation table of the logical structures hidden within the procreation asymmetry slogan. Each entry isolates a distinct thesis, assesses its plausibility, practical implications, and hidden premises, while distinguishing axiological (value-based) from deontic (duty-based) interpretations and addressing the "worse for" problem.

  ---

  ### **Disambiguation Table: Procreation Asymmetry Slogan**  
  *"Bringing a suffering person into existence is a wrong done to them, but failing to bring a happy person into existence is not a wrong done to anyone."*

  | # | Claim Formulation                                                                                                                                 | Classification                              | Supports Practical Conclusion? | Hidden Premises & Key Distinctions                                                                                                                               |
  |---|---------------------------------------------------------------------------------------------------------------------------------------------------|---------------------------------------------|---------------------------------|------------------------------------------------------------------------------------------------------------------------------------------------------------------|
  | **1** | **Harm Avoidance Tautology**<br>*Creating a person who experiences net suffering (disutility > utility) is bad for that person.*                                                               | **Trivial** (analytic truth)               | ❌ No: Only addresses suffering cases. Ignores neutral/positive existence. | • Assumes "harm" requires an existent subject.<br>• *Not asymmetric*: Does not address failing to create happy lives.                                              |
  | **2** | **Axiological Asymmetry (Strong)**<br>*Suffering has intrinsic negative moral weight, but happiness has no intrinsic positive moral weight in non-actualized lives.* | **Substantive but likely false**            | ✅ Yes: Suffering creation wrong; happy omission neutral. | • Rejects impartial totalism.<br>• Assumes "bad for" ≠ "not good for" metaphysically.<br>• **Axiological**: Denies symmetry between harm/benefit in non-existence cases. |
  | **3** | **Deontic Asymmetry (Harm Focus)**<br>*We have a strict duty not to cause harm (e.g., suffering), but no duty to create benefits (e.g., happiness) for non-existent beings.* | **Substantive and defensible**              | ✅ Yes: Permissible to omit happy lives; impermissible to create suffering. | • **Deontic**: Prioritizes negative duties over positive ones.<br>• Assumes non-existents cannot be owed duties.<br>• Compatible with rejecting "worse for" non-existents. |
  | **4** | **Metaphysical Non-Comparability**<br>*Non-existence cannot be "worse for" a never-existent person; thus, failing to create happiness deprives no one of a benefit.* | **Substantive and defensible**              | ✅ Yes: Failing to create ≠ wronging anyone. | • Rejects comparativism (non-existence cannot be worse/better than existence).<br>• **Core premise**: Only existent beings can be harmed/deprived.               |
  | **5** | **Person-Affecting Restriction**<br>*Morality only concerns acts affecting actual people; creating suffering affects a victim, but omitting happiness affects no one.* | **Substantive and defensible**              | ✅ Yes: Omissions lack a patient to wrong. | • Rejects impersonal values (e.g., "world would be better with more happiness").<br>• Requires identity-dependence: Wrongs need identifiable victims.           |
  | **6** | **Asymmetry via Non-Identity Problem**<br>*Creating a suffering person wrongs them, but no specific person is wronged by not being created (since they wouldn't exist).* | **Substantive and defensible**              | ✅ Yes: Failing to create ≠ wronging a *particular* individual. | • Depends on the non-identity problem: No alternative scenario where the "same" person is happy.<br>• Allows creating suffering to be "bad" without a deprived subject. |
  | **7** | **Impossibility of Duty to Non-Existents**<br>*Duties require subjects; thus, there can be no duty to bring non-existent beings into existence for their sake.* | **Substantive and defensible**              | ✅ Yes: No one is wronged by omission. | • **Deontic**: Duties correlate with rights-holders.<br>• Non-existents lack moral status.<br>• Compatible with axiological asymmetry (Claim #2) but not dependent on it. |
  | **8** | **Strong Deprivationism (False Symmetry)**<br>*Failing to create a happy person wrongs them by depriving them of existence, just as creating suffering wrongs them.* | **Conceptually incoherent**                 | ❌ No: Undermines asymmetry by making omissions wrongs. | • Assumes non-existence is "worse for" a never-existent person (rejected by most).<br>• Contradicts the slogan’s second clause.                                  |

  ---

  ### **Key Clarifications**
  1. **Axiological vs. Deontic Asymmetry**  
     - *Axiological* (Claims #2, #4): Focuses on **value properties** (e.g., suffering is bad in a way happiness isn’t good). Survives rejection of "worse for" if non-existence is incomparable.  
     - *Deontic* (Claims #3, #7): Focuses on **duties** (e.g., no duty to benefit non-existents). Independent of axiology; requires only that duties apply solely to existent beings.  

  2. **The "Worse For" Problem**  
     - Claims #4–#7 **do not require** that non-existence can be "worse for" an individual. They rely on:  
       - Non-comparability (#4),  
       - Absence of a victim (#5),  
       - No identifiable subject for duties (#7).  
     - Only Claim #8 requires comparativism and collapses if non-existence cannot deprive.  

  3. **Practical Conclusion Support**  
     - Viable paths to the slogan’s conclusion combine:  
       - A deontic duty not to harm existents (Claims #3, #7),  
       - A metaphysical rejection of deprivationism (Claims #4, #6),  
       - And/or a person-affecting constraint (Claim #5).  
     - Strong axiological asymmetry (Claim #2) is optional and contentious.  

  4. **Hidden Premises for Coherence**  
     - All defensible claims assume **identity dependence**: Wrongs require an identifiable subject.  
     - They reject **impartial totalism** (adding happy lives is good *simpliciter*).  
     - None require "non-existence as a state of deprivation."

  ---

  This table isolates the slogan’s core ambiguities, showing that its plausibility depends on contestable premises about morality, metaphysics, and personhood. No single interpretation is self-evidently true, and practical implications vary by the chosen framework. Use this to challenge uncritical invocations in debate.
