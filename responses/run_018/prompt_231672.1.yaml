     - What will go wrong: 
       - Some participants might report that they can imagine a "round square" by imagining a circle that is called a square, or a square that is round in some metaphorical sense. This is not the same as a literal round square. So we may have to stress the literal meaning.
       - Some scenarios might be impossible due to our lack of knowledge (e.g., a triangle with angles summing to more than 180 degrees is impossible in Euclidean geometry but possible in non-Euclidean). But we are in the context of Hume, who lived in the 18th century and was thinking of Euclidean geometry. So we have to set the context.
       - Some scenarios that are actually impossible might feel easy to imagine (like a golden mountain, which is possible, but if we had a scenario that was impossible, e.g., a mountain made of gold that is also made of lead, then that would be impossible). But note: a golden mountain is possible. So we have to be careful: we must include both possible and impossible scenarios. In fact, a golden mountain should be in the "can imagine" category, and that's why it's important to have both.
