  We are designing a 90-minute activity to help a group of adults without formal training in philosophy to explore Hume's claim that we cannot conceive of anything that is absurd (i.e., contradictory or ruled out by a demonstration). The activity will involve sorting scenarios into two categories: "can be genuinely imagined" and "cannot be genuinely imagined".

  The key is to create an exercise that allows participants to experience the difficulty (or impossibility) of imagining certain scenarios, and then to debrief by connecting this to Hume's passage.

