  - 10-70: Activity (60 minutes as above, but note: 15-35 is 20 min, 35-45 is 10 min, 45-55 is 10 min, then 55-60 is 5 min for transition? That's 45 minutes. Let me fix the timing:

  Revised timeline:
  - 0-10: Introduction (10 min)
