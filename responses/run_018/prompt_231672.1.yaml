  - 45-60: Whole group tally and reporting (15 min) - because we have 15-20 scenarios, we can do about 1 minute per scenario? Actually, we'll do 10 minutes for tally and 5 minutes for initial reactions.

  Then:
  - 60-90: Debrief (30 minutes)

  **Debrief Plan (30 minutes):**

  1. **Reflection on the activity (5 min):** Ask participants how they felt during the exercise. Was it hard to agree? Were there scenarios that were particularly tricky?

  2. **Connecting to Hume (10 min):** Read the Hume passage again: "Whatever is absurd is unintelligible; nor is it possible for the imagination to conceive any thing contrary to a demonstration." 
     - Explain that Hume is saying that when something is absurd (like a contradiction), we cannot form a coherent idea of it. 
     - Ask: In the activity, what did you find about scenarios that seemed contradictory? Could you really imagine them? Or were you just manipulating words?

  3. **Discussing the scenarios (10 min):** Go through a few key scenarios that caused disagreement or were particularly interesting.
     - For example: "round square". Did anyone feel they could imagine it? Or were they just thinking of a round shape and a square shape separately? 
