    - A married bachelor.
    - A four-sided triangle.
    - Water that is not H2O (in the actual world, but note: this might be controversial).
    - A flying elephant.
    - A room that is completely empty (no air, no particles, etc.).
    - A sound that is both very loud and completely silent.
    - A person who is both 6 feet tall and 5 feet tall at the same time.
    - A square circle (same as round square? Maybe use one).
    - A tree that has no roots.
    - A number that is both even and odd.
    - A day that is both Monday and Tuesday at the same time.
    - A piece of paper that is completely white and completely black at the same time.
    - A cat that is a dog.
    - A living human who is also dead.
  - Two labeled containers or areas: "Can be genuinely imagined" and "Cannot be genuinely imagined".
  - Whiteboard or flip chart to record group decisions and tally.

  **Rules of the Game:**
  1. The group will be divided into two teams (5 each). Each team will get a set of scenario cards (the same set for both teams).
  2. Each team will have 20 minutes to discuss among themselves and sort their set of cards into the two categories. They must reach a consensus for each card. They should write down their reasoning for each decision.
  3. After 20 minutes, the teams will swap their sorted cards and reasoning with the other team. Then each team will review the other team's sorting and reasoning for 10 minutes. They can note agreements and disagreements.
