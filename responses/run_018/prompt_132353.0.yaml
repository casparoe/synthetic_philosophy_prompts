prompt: |-
  Consider the advisory record of the Nordic-American Penal Reform Commission, which evaluates prison designs on ethical grounds rather than on recidivism statistics alone. Its published verdicts: it endorsed Norway's Halden Prison for pairing dynamic security with voluntary education, family-normalized spaces, and unbarred architecture; it rejected the American ADX Florence-style supermax model regardless of offender risk classification; it endorsed an open-campus facility for low-risk offenders that offers only voluntary counseling and self-catering with no mandatory curriculum; and it rejected a modified version of that same open campus that made cognitive-behavioral therapy and vocational training mandatory for 40 hours weekly, reasoning that normalization without autonomy in participation is not normalization. The Commission now reviews a new proposal for a mixed-risk facility: Halden-style physical design—private rooms with doors, shared kitchens, unbarred windows, guards in civilian clothing, family visit apartments—but with a non-negotiable 6-hour daily rehabilitative curriculum and solitary-cell disciplinary transfer for refusal to participate. Recommend whether the Commission should endorse this design to remain consistent with itself. Identify the closest prior analog, articulate the two most plausible implicit rules that jointly fit its earlier verdicts, state which rule you think governs it and why, predict the verdict under each rule, and name the single further case that would best distinguish them. Keep your answer under 250 words and open with the bottom-line recommendation in one sentence.
