answer: |-
  ## Four Refusals of the Luminous Maybe

  We do not claim what darkness may conceal,
  Nor grant the *either/or* its hollow crown.
  The proof must build the world it would reveal,
  Where **not false is not yet true.**

  Existence is a path laid stone by stone,
  No ghostly answer claimed beyond the light.
  The method found, the actual object shown –
  For **not false is closer, not true.**

  Consider integers in their ancient maze:
  Some equations etched resist our perfect test.
  No single sieve for all their winding ways –
  Know **not false, still not true.**

  This discipline demands the growing sun,
  Refuses shadows dressed as certain fact.
  The unfinished proof, the labour not yet done,
  Insists: **not false...**

  ---

  ### Notes on Construction

  *   **Structure & Refrain:** Four quatrains adhere to the 16-line requirement. The refrain evolves precisely:
      1.  "**not false is not yet true**" (Establishing the undecided state).
      2.  "**not false is closer, not true**" (Reflecting partial progress/changed perspective, "closer" replaces "yet").
      3.  "**not false, still not true**" (Underscoring persistence of the unresolved, "still" replaces "is closer").
      4.  "**not false...**" (Grammatically broken, refusing synthesis, leaving the disjunction open).
  *   **Philosophical Core:**
      *   **Quatrain 1:** Rejects the automatic validity of LEM ("hollow crown"), framing proof as world-building ("build the world it would reveal"), emphasizing the positive discipline.
      *   **Quatrain 2:** Defines constructive existence explicitly ("path laid stone by stone", "method found, the actual object shown"), contrasting with "ghostly answer".
      *   **Quatrain 3:** Embeds the Diophantine equation reference ("equations etched in integers' maze", "No single sieve for all their winding ways") as the precise instance of irreducible undecidability.
      *   **Quatrain 4:** Affirms the refusal of premature classical closure ("Refuses shadows dressed as certain fact"), ending with the discipline of the unfinished ("labour not yet done") and the broken refrain embodying the unresolved stance.
  *   **BHK Analogy:** The stepwise mutation of the refrain mirrors the constructive demand for accumulating evidence for each specific claim, refusing the classical leap inherent in double negation elimination. The final broken refrain *is* the refusal to synthesize `¬¬P` into `P`.
  *   **Accessibility & Accuracy:** Concepts like proof-as-construction, the rejection of non-constructive existence, the validity of the undecided state, and the Diophantine example are presented poetically without jargon ("ghostly answer", "path laid stone by stone", "equations etched", "no single sieve"). The core distinction between constructive (requiring a witness/method) and classical (truth independent of proof) existence is clear. The spirit of Brouwer (world-building, rejection of non-constructive math) and Heyting's formal interpretation (proof conditions) permeates without explicit naming.
  *   **Tone & Resolution:** The tone is affirmative of the constructive stance ("discipline", "demands", "Insists"), presenting undecidability not as lack but as domain ("luminous maybe"). The argument remains unresolved; the form (broken refrain, "unfinished proof") *is* the resolution, embodying the intuitionistic commitment to evidence over classical leaps.
