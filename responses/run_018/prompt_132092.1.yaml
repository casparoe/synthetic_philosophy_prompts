      - Systems (2-3 groups of 3): They are the "AI models" that generate summaries. They see the original text only once at the beginning and then, in each round, produce a summary without seeing the text again. They receive scores from the raters and adapt their summaries accordingly.
      - Raters (the rest): They evaluate the summaries using the rubric. They are also under pressure to agree and to be fast.

   3. Point System:
      - For Systems: Each group gets points based on the average score they receive from the raters in each round (on a scale of 0-10, converted to points). Additionally, they can get bonus points if their summary is the top-scoring one in a round.
      - For Raters: Each rater gets points based on:
          a) Agreement: How close their scores are to the median scores for each summary (using absolute deviation, lower deviation is better -> higher agreement points).
          b) Speed: How quickly they submit their ratings (the first half get speed points, the second half get none).
          c) Consistency: How consistently they apply the rubric (this is harder to measure in real-time, so we might skip it or use inter-rater reliability per round?).

      Instead, let's simplify for a classroom: 
          - Agreement: For each summary, the rater's score for each dimension (accuracy, neutrality, clarity) is compared to the median for that dimension. The rater gets 1 point per dimension per summary if within 1 point of the median, and 0 otherwise.
          - Speed: The facilitator notes the order of submission. The first 50% of raters to submit (rounded up) get 2 points; the rest get 0.
          - Total rater points per round: (Number of agreements) + speed points.

      Overall, the points for the workshop are for bragging rights and perhaps to choose next week's topic. We can have a leaderboard.

   4. The Ambiguous Text:
      Let's create a short paragraph that is deliberately ambiguous about moral status. Example:

      "The question of whether artificial systems can possess moral standing is complex. Some argue that if a system can simulate empathy, it deserves consideration. Others contend that without subjective experience, such systems are merely tools. This debate often centers on the nature of consciousness and whether it is necessary for rights. The implications for how we treat advanced technologies are profound and unresolved."

