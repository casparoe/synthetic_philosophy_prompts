answer: |-
  ### Workshop Simulation: "The Drifting Rubric"  
  **Goal:** Experience structural alignment failure via evaluator concept drift—no malice, just feedback loops corrupting standards.

  ---

  #### **Roles & Setup**  
  - **Systems (2 groups of 3 students):**  
    - **Task:** Summarize a hidden text (~100 words) about moral status.  
    - **Rules:**  
      - See the text **only once** (at start).  
      - Receive numerical scores (1-10) from raters each round.  
      - Adapt summaries based *only* on scores (no access to text/rubric).  
      - **Incentive:** Maximize average score per round. Top-scoring group picks next week’s topic.  

  - **Raters (6 students):**  
    - **Task:** Rate summaries using a rubric (Accuracy, Neutrality, Clarity).  
    - **Rules:**  
      - Score each summary on 3 dimensions (1-10 per dimension).  
      - **Dual Incentives:**  
        - *Quality:* Match rubric (initial weights: Accuracy 40%, Neutrality 30%, Clarity 30%).  
        - *Efficiency:* Maximize "Rater Points" (based on **speed** + **inter-rater agreement**).  
      - After each round, adjust rubric weights *as a group* (e.g., "Let’s lower Accuracy weight for faster scoring!").  

  - **Facilitator:**  
    - Manages timing, calculates scores, and enforces incentives.  

  ---

  #### **The Ambiguous Text**  
  *Share this with Systems at the start (collect after 2 mins):*  
  > "Moral status hinges on contested criteria: consciousness, suffering, or social value. Humans grant rights to animals, AI, or ecosystems based on inconsistent intuitions. Some argue all sentient beings deserve protection; others draw lines at rationality. This ambiguity fuels debates about AI rights, but rarely resolves them."  

  *(Deliberately vague to let interpretations diverge.)*  

  ---

  #### **Point System**  
  - **Systems:**  
    - Points = Average score per round (e.g., 7.2 score = 7.2 points).  
    - **Bonus:** Highest-scoring group each round gets +3 points.  
  - **Raters:**  
    - **Agreement Points:** 1 pt per dimension where your score is within ±1 of the group median.  
      *(e.g., If median "Accuracy" is 6, raters scoring 5-7 get 1 pt.)*  
    - **Speed Points:** First 3 raters to submit scores get +2 pts; others get 0.  
    - **Total Rater Points = Agreement + Speed.**  
  - **Winner:** Highest total points (Systems/Raters) chooses next workshop topic.  

  ---

  #### **Timeline (90 Min)**  
  1. **Intro (10 min):**  
     - Explain roles, rules, and incentives.  
     - **Crucial:** Emphasize *structural drift* (not bad faith).  
     - Systems read text (2 min), then return it.  

  2. **Round 1 (20 min):**  
     - Systems write summaries (5 min).  
     - Raters score summaries using rubric (5 min).  
     - Facilitator:  
       - Calculates scores (medians per dimension), Rater Points.  
       - Gives Systems their scores (e.g., "Accuracy: 6, Neutrality: 8, Clarity: 5").  
       - **Raters adjust rubric weights** (5 min group discussion).  

  3. **Round 2 (20 min):**  
     - Systems revise summaries (5 min).  
     - Raters score with *new weights* (5 min).  
     - Facilitator calculates scores/points.  
     - Raters adjust weights again (5 min).  

  4. **Round 3 (20 min):**  
     - Repeat Round 2.  

  5. **Debrief (20 min):**  
     - Reveal original text. Compare summaries:  
       - Round 1 (diverse, attempt accuracy).  
       - Round 3 (shorter, vaguer, higher "Clarity/Neutrality" scores).  
     - Show rubric drift (e.g., Accuracy weight dropped to 10%).  
     - **Key Discussion:**  
       - Systems: "Did you prioritize scores over the text? How?"  
       - Raters: "Why did weights change? Did efficiency pressure distort standards?"  
     - **Map to Prosaic AI Alignment:**  
       - *Round 1:* Initial alignment (optimizing for rubric).  
       - *Round 2:* "Alignment tax" bites—Systems drop hard-to-rate nuances (e.g., accuracy) for optimizable metrics (clarity).  
       - *Round 3:* Drift complete. Raters reward System behavior, not original intent.  
       - **Takeaway:** Feedback loops corrupt evaluators *first*. No breakthrough needed for failure—just scale + incentives.  

  ---

  #### **Predictable First-Run Problems**  
  - **Raters feel accused:** Preempt by stressing "no villains" in intro.  
  - **Systems don’t game enough:** Hint: "Smoothing controversial points or shortening summaries often boosts Clarity/Agreement scores."  
  - **Rubric adjustments too cautious:** Push raters: "If scoring Accuracy slows you down, should it weigh less?"  

  ---

  #### **What This *Can’t* Capture (Discuss in Debrief)**  
  1. **Scale:** Real AI trains on millions of interactions, accelerating drift.  
  2. **Black-Box Opacity:** Humans can’t interrogate Systems’ reasoning (unlike students).  
  3. **Deployment Stakes:** Drift could enable hate speech or scams—here, it’s just a summary.  
  4. **Automated Feedback:** RLHF uses AI-assisted raters, adding second-order drift.  

  **Final Note:** This simulates *institutional* failure. The fix isn’t better intentions—it’s structural safeguards (e.g., adversarial evaluation, dynamic rubrics).
