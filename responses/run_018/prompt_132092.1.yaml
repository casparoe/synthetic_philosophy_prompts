   1. Preparation:
      - Write an ambiguous text about moral status (original, non-quoted).
      - Prepare a rubric for raters (with dimensions: Accuracy, Neutrality, Clarity) and assign initial weights (e.g., 40% accuracy, 30% neutrality, 30% clarity).
