  ### Frame-Axiom Approach
  We saw that the frame-axiom approach requires a conditional frame axiom for P that depends on the preservation condition for Q. We avoided repeating the condition for preserving Q by defining a predicate. However, we still have:
    - A definition of the preservation condition for Q (which is the frame condition for Q) as a new predicate.
