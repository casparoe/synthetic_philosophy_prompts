  ### Successor-State-Axiom Approach
  We saw that we can incorporate the condition by modifying the γ condition for P. Specifically, we can add an extra disjunct to γ₋,P (if we decide that when Q is not preserved, P becomes false). This does not add a new axiom, but it complicates the existing successor-state axiom for P. Moreover, it creates a dependency between the successor-state axioms of P and Q. If we have a chain of such dependencies, it might lead to very complex definitions. However, we are still within one axiom per fluent. So the number of axioms does not increase.

  But note: the complexity inside the γ conditions might become very high. Also, if there are circular dependencies, the definitions might become inconsistent or require a fixpoint.

  ## Ramification Problem vs Frame Problem

  The frame problem is about efficiently representing which fluents do not change when an action occurs. The ramification problem is about handling the indirect effects of actions that arise due to state constraints.

  In the coupled persistence case, we have a new kind of dependency: the preservation of one fluent is conditional on the preservation of another. This is not a state constraint (which is about a single state) but a transition constraint. It is about the preservation of fluents across an action.

  This suggests that the ramification problem (which is about indirect effects) and the frame problem (which is about non-effects) are distinct. However, the coupled case shows that they can interact: the non-effect (persistence) of one fluent (P) depends on the non-effect of another fluent (Q). This is a new kind of ramification: the preservation of P is indirectly affected by the action through the effect on Q.

