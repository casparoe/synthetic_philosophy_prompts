answer: |-
  1. The best principle is **outcome-dependent fate perception**: we judge an outcome as "fated" only when it occurs despite the agent's action, but this perception is retrospective and triggered by death occurring via the avoided path.  
     *Ties to:* Blaming no one when fleeing causes death (outcome pins to avoidance), and judging staying as "fated" only if death follows *there* (Damascus fire version).  

  2. Mental states don't affect blame because fate overrides agency; deliberation or panic leading to Samarra death both appear futile, absolving the agent.  
     *Ties to:* Zero blame whether he bolts or calmly calculates—both paths converge on death, making intention irrelevant.  

  3. Identical actions (staying) feel fated or not based on outcome: surviving undermines inevitability (lives to ninety), while dying confirms it (fire death)—fate is a post-hoc label for unavoidable doom.  
     *Ties to:* The Damascus-stay cases with divergent outcomes altering verdicts.  

  4. Influence matters for *others'* blame: a stranger shouting "run!" less culpable than self-initiated flight since the outcome was fixed regardless, but the stranger's causal role is weaker.  
     *Ties to:* Stranger vs. self-planned flight both ending in Samarra, yet stranger blamed less as a mere trigger.  

  5. *Prediction:* If he takes a boat, he dies at sea—fate reroutes to intercept.  
     *Can't save:* Why calm calculation feels *equally blameless* as panicked flight; intuition suggests effort should increase culpability, but it doesn't here.
