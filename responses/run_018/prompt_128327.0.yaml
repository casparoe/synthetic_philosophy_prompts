prompt: |-
  I'm a science journalist covering neuroscience and theoretical psychology, and I need a reusable editorial procedure I can run in about fifteen minutes to determine whether a research submission genuinely explains its findings through predictive processing and the free energy principle, or merely uses those terms as conceptual decoration. Write a step-by-step checklist—ordered questions, what counts as a sufficient answer at each stage, explicit stop points where the verdict is negative, and clearly marked judgment calls—grounded in the actual mechanics of hierarchical generative models, precision-weighted prediction errors, and active inference rather than loose metaphor. The procedure should distinguish mechanistic specificity from redescriptive labeling, state exactly where evaluation must be handed to a specialist because it exceeds journalistic competence, and flag the steps that are irreducibly value-laden rather than factual. Apply it to two hypothetical cases: first, a clinical study linking hallucination severity to independently measured precision-weighting deficits in auditory cortex; second, a behavioral study describing consumer choice as "minimizing surprise" without specifying generative models, action policies, or precision dynamics. Include at least one worked case where the procedure returns a negative verdict that conflicts with the authors' own framing, and be explicit about what the checklist cannot settle.
reasoning: |-
  We are designing a strict checklist to evaluate whether a paper genuinely uses predictive processing (PP) and the free energy principle (FEP) mechanistically or just as buzzwords.

  Core concepts to check for:
  - Hierarchical generative models: The paper should describe how the brain (or system) constructs a multi-level model that generates predictions. 
  - Prediction errors: The paper must discuss mismatches between predictions and sensory input, and how these errors are used.
  - Precision-weighting: The paper should address how the system modulates the influence of prediction errors (i.e., how reliable/uncertain the signals are). This is crucial for PP.
  - Active inference: The paper should consider how the system acts to change its sensory input to better match predictions (i.e., action as part of inference).

  The checklist is a series of questions. At each step, we define:
  - What is being asked.
  - What counts as a sufficient answer (with examples).
  - Stop points (if the answer is insufficient, we can reject at that step).
  - Judgment calls (where the evaluator must use their expertise, but we note these as subjective).

  The procedure should take about 15 minutes and be reusable.

  We'll apply it to two cases:
  1. Clinical study: Linking hallucination severity to independently measured precision-weighting deficits in auditory cortex.
  2. Behavioral study: Describing consumer choice as "minimizing surprise" without specifying generative models, action policies, or precision dynamics.

  We also want one case where the procedure returns a negative verdict despite the authors' framing.

  What the checklist cannot settle: 
  - The overall quality of the science (only whether it uses PP/FEP mechanistically).
  - Whether the PP/FEP framework is the best explanation (that's a theoretical debate beyond scope).

  ---

  **Step-by-Step Editorial Checklist for Predictive Processing / Free Energy Principle Claims**

  **Step 1: Generative Model Specification**
     - *Question:* Does the paper explicitly describe the assumed generative model (i.e., the hierarchical structure of causes and their dynamics) that the system (e.g., brain) uses to generate predictions?
     - *Sufficient Answer:* Yes, if the paper specifies:
          - At least two hierarchical levels (e.g., higher-level states generating predictions for lower-level states or sensory data).
          - The variables in the model and how they relate (e.g., equations, diagrams, or clear verbal descriptions of conditional dependencies).
          - How the model generates predictions (e.g., top-down predictions).
     - *Insufficient:* Vague references to "models" without structure, or only mentioning "predictions" without specifying what is generating them.
     - *Stop Point:* If no generative model is described, stop and mark as "conceptual decoration". Without a generative model, the core of PP is missing.
     - *Judgment Call:* None. This is objective: either a model is specified (with the above details) or not.

  **Step 2: Prediction Error Mechanics**
     - *Question:* Does the paper explain how prediction errors are computed and used to update the generative model?
     - *Sufficient Answer:* Yes, if the paper:
          - Explicitly states that prediction errors are the difference (or some function of the difference) between predictions and actual sensory input (or lower-level representations).
          - Describes how these errors drive belief updating (e.g., via Bayesian updating, gradient descent, or message passing).
     - *Insufficient:* Only mentioning "prediction error" as a general concept without specifying how it is computed or how it affects the model.
     - *Stop Point:* If no mechanism for prediction errors is provided, stop and mark as "conceptual decoration". Prediction errors are the driving force of learning and inference in PP.
     - *Judgment Call:* Minor. The exact mathematical formalism (e.g., variational Bayes vs. predictive coding) might be omitted in non-theoretical papers, but the core idea must be present.

  **Step 3: Precision-Weighting**
     - *Question:* Does the paper address how precision (inverse uncertainty) modulates prediction errors and/or predictions?
     - *Sufficient Answer:* Yes, if the paper:
          - Explicitly discusses how the reliability or uncertainty of signals affects their influence (e.g., high precision on prediction errors amplifies their effect).
          - Describes the source of precision (e.g., attention, neuromodulators) and how it is set (e.g., based on expected uncertainty).
     - *Insufficient:* Only mentioning "uncertainty" without linking it to the weighting of prediction errors, or using "precision" as a synonym for accuracy or without a functional role in the model.
     - *Stop Point:* If precision-weighting is not discussed, the paper is not using a core component of PP. However, note: active inference without precision might still be discussed. So this step is a warning but not an immediate stop. We proceed to Step 4 but note the absence as a major weakness.
     - *Judgment Call:* Moderate. The depth of precision treatment may vary. If the paper is about perception/cognition and omits precision, it's a red flag. In motor control, precision might be less emphasized.

  **Step 4: Active Inference**
     - *Question:* If the study involves action (including perceptual sampling, like eye movements, or higher-level decisions), does the paper frame action in terms of active inference (i.e., actions are chosen to minimize expected prediction errors by changing sensory input to match predictions)?
     - *Sufficient Answer:* Yes, if the paper:
          - Explains actions as being generated by the same predictive machinery (e.g., by sampling actions that are expected to minimize future prediction errors).
          - Describes action policies in terms of expected free energy (or a similar construct) that balances exploratory and exploitative behavior.
     - *Insufficient:* Only using terms like "minimizing surprise" without specifying how actions are generated, or treating action as separate from perception.
     - *Stop Point:* If the study involves action and the paper does not describe active inference, it may not be fully PP. But note: not every PP study must include action. If the study is purely about perception and doesn't discuss action, skip this step.
     - *Judgment Call:* Moderate. The evaluator must decide if the study's domain (e.g., decision making) requires an action component.

  **Step 5: Empirical Fit to PP Mechanics**
     - *Question:* Are the empirical measures and results explicitly linked to the PP mechanics described in Steps 1-4?
     - *Sufficient Answer:* Yes, if:
          - The experimental design manipulates or measures variables that map directly onto PP constructs (e.g., precision, prediction errors, model updating, expected free energy).
          - The results are interpreted in terms of the underlying PP mechanisms (e.g., "we found a correlation between hallucination severity and reduced precision-weighting in auditory cortex").
     - *Insufficient:* Results are described using PP terms only in the discussion without a clear connection to the empirical measures (e.g., "these choices minimize surprise" without showing how).
     - *Stop Point:* If the empirical work does not test or measure PP mechanisms, the use of PP is decorative. Stop and mark accordingly.
     - *Judgment Call:* High. The evaluator must judge if the link is strong enough. If unsure, flag for specialist review.

  **Step 6: Specialist Handoff Points**
     - *Where to hand off:* 
          - If the paper passes Steps 1-5 but the mathematical formalism is complex (e.g., detailed variational or Bayesian inference equations), and the journalist cannot verify correctness, hand off for specialist review.
          - If the paper introduces novel theoretical extensions to PP/FEP, hand off to a theoretician.
     - *Journalist competence:* Journalists can check for the presence of key components but not the mathematical rigor or theoretical novelty.

  **Step 7: Value-Laden Steps**
     - *Flag:* Steps 3 and 4 involve judgment calls about the necessity of precision and active inference. Also, Step 5 (empirical fit) is value-laden because it requires interpreting the strength of the link.

  ---

  **Application to Hypothetical Cases:**

  **Case 1: Clinical study linking hallucination severity to independently measured precision-weighting deficits in auditory cortex.**

  - Step 1: The paper likely describes a generative model for auditory processing (e.g., higher-level predictions about sounds and lower-level sensory representation). *Sufficient.*
  - Step 2: Prediction errors are computed in auditory cortex. The paper likely describes how prediction errors drive updating. *Sufficient.*
  - Step 3: **Crucial step.** The paper measures precision-weighting deficits (e.g., via GABA levels or neural oscillations) and links them to hallucinations. *Sufficient.*
  - Step 4: Not about action, so skip.
  - Step 5: The empirical measures (precision-weighting) are central to PP and are linked to hallucinations (a core PP explanation for psychosis). *Sufficient.*
  - Verdict: Genuine PP. No handoff needed unless the modeling is highly technical.

  **Case 2: Behavioral study describing consumer choice as "minimizing surprise" without specifying generative models, action policies, or precision dynamics.**

  - Step 1: The paper does not specify a generative model (only says choices minimize surprise). *Insufficient.* **Stop and mark as conceptual decoration.**

  **Case 3 (additional, as requested): A paper that claims to use PP but fails the checklist despite authors' framing.**

  Example: A study on motor learning that says "the brain uses predictive processing to minimize prediction errors" but does not specify the generative model or precision.

  - Step 1: The paper says "the motor system makes predictions" but does not describe a hierarchical generative model (e.g., no levels, no structure). *Insufficient.* **Stop: conceptual decoration.**

  **What the checklist cannot settle:**
  - Whether the PP account is correct or the best explanation.
  - The quality of the experimental methods.
  - The philosophical implications of using PP.
answer: |-
  ### Editorial Checklist: Evaluating Genuine Predictive Processing (PP) and Free Energy Principle (FEP) Claims  
  **Time Limit:** 15 minutes per submission  
  **Purpose:** Distinguish mechanistic PP/FEP explanations from superficial labeling. Grounded in core components: hierarchical generative models, precision-weighted prediction errors, and active inference.  
  **Outcomes:** (1) Genuine PP/FEP, (2) Conceptual decoration, (3) Handoff to specialist, or (4) Negative verdict despite authors' framing.  

  ---

  #### **Step-by-Step Procedure**  
  **Key Mechanics Required for Genuine PP/FEP:**  
  - **Hierarchical generative models:** Multi-level causal structures generating top-down predictions.  
  - **Precision-weighted prediction errors:** Mismatches weighted by estimated reliability (inverse uncertainty).  
  - **Active inference:** Actions as belief-driven sampling to minimize expected surprise.  

  **Instructions:**  
  - Proceed sequentially. Stop at first "No" unless specified.  
  - ⚠️ **Judgment Call:** Subjective evaluation (not purely factual).  
  - 🔬 **Handoff to Specialist:** When technical depth exceeds journalistic competence.  

  ---

  1. **Is a hierarchical generative model explicitly defined?**  
     - *Question:* Does the paper specify the model’s structure (e.g., layers, states, transitions) and how it generates predictions?  
     - *Sufficient Answer:* Yes, if:  
       - Variables (e.g., hidden causes, sensory states) and their conditional dependencies are described (e.g., equations, Bayesian networks, or clear verbal schema).  
       - Top-down predictions are distinct from bottom-up inputs.  
     - *Insufficient:* Vague terms like "the brain predicts" without model structure.  
     - *Stop Point:* **Negative verdict** if absent. PP/FEP cannot exist without this.  
     - *Judgment Call:* None (objective).  

  2. **Are prediction errors precision-weighted?**  
     - *Question:* Does the paper explain how prediction errors are scaled by precision (inverse uncertainty) during belief updating?  
     - *Sufficient Answer:* Yes, if:  
       - Precision modulates prediction errors (e.g., "high precision amplifies errors"), with a proposed source (e.g., attention, neuromodulators like dopamine).  
       - Precision is dynamic (context-dependent), not fixed.  
     - *Insufficient:* Mentions "prediction errors" or "uncertainty" without weighting mechanics.  
     - *Stop Point:* **Negative verdict** if absent. Precision-weighting is irreducible to PP.  
     - *Judgment Call:* Low (minor interpretation of phrasing).  

  3. **Is action/policy selection framed as active inference?**  
     - *Question:* For studies involving behavior, are actions explained as minimizing *expected* free energy (i.e., resolving uncertainty via sampling)?  
     - *Sufficient Answer:* Yes, if:  
       - Actions are policies that minimize expected surprise (e.g., maximizing information gain or reward under a generative model).  
       - Policies balance exploration and exploitation (e.g., through expected free energy calculations).  
     - *Insufficient:* Redescribing choices as "minimizing surprise" without policy specification.  
     - *Stop Point:* **Negative verdict** if action is central but this is missing. Skip if the study is purely perceptual.  
     - *Judgment Call:* ⚠️ Moderate (evaluating relevance of action to claims).  

  4. **Do results empirically target PP/FEP mechanics?**  
     - *Question:* Are methods/results linked to generative models, precision, or active inference?  
     - *Sufficient Answer:* Yes, if:  
       - Experiments manipulate/measure model parameters (e.g., prior precision), prediction errors (e.g., neural mismatch signals), or policy selection.  
       - Findings are interpreted mechanistically (e.g., "altered precision explains hallucinations").  
     - *Insufficient:* PP terms only appear in discussion to relabel non-PP data.  
     - *Stop Point:* **Negative verdict** if results are merely descriptive.  
     - *Judgment Call:* ⚠️ High (assessing strength of link).  

  5. **Is FEP used as more than a synonym for Bayesian inference?**  
     - *Question:* Does the paper tie predictions to variational free energy minimization (i.e., model evidence maximization)?  
     - *Sufficient Answer:* Yes, if:  
       - Surprise minimization is explicitly variational (e.g., approximating posterior beliefs).  
       - Distinguishes FEP from generic Bayesian models (e.g., via embodied inference).  
     - *Insufficient:* "Minimizing surprise" treated as equivalent to standard Bayesian updating.  
     - *Stop Point:* **Handoff to specialist** if ambiguous. FEP’s nuances require technical expertise.  
     - *Judgment Call:* None (specialist needed).  

  6. **Are claims consistent with PP’s scope?**  
     - *Question:* Does the paper avoid overextending FEP as a universal theory without mechanistic specificity?  
     - *Sufficient Answer:* Yes, if:  
       - Explanations are domain-constrained (e.g., sensory cortex for perception, prefrontal hierarchies for decisions).  
       - Avoids phrases like "FEP explains everything" without model details.  
     - *Stop Point:* **Handoff to specialist** if overly grand claims.  
     - *Judgment Call:* ⚠️ High (evaluating proportionality).  

  ---

  #### **What This Checklist Cannot Settle**  
  - **Theoretical validity:** Whether PP/FEP is the "correct" framework (handoff to specialists).  
  - **Experimental rigor:** Methodological flaws unrelated to PP mechanics.  
  - **Metaphorical value:** Whether loose PP language is useful for communication (value-laden).  

  ---

  ### **Worked Examples**  
  #### **Case 1: Clinical Study on Hallucinations**  
  *Authors’ claim:* "Hallucinations arise from precision-weighting deficits in auditory cortex."  
  - **Step 1:** Generative model specified?  
    - *Paper details:* Describes hierarchical auditory pathways (e.g., thalamocortical loops), with top-down predictions from frontal regions.  
    - *Sufficient?* **Yes** — explicit cortical hierarchy.  
  - **Step 2:** Precision-weighted prediction errors?  
    - *Paper details:* Measures GABAergic inhibition (proxy for precision) and links low precision to amplified prediction errors in MEG data.  
    - *Sufficient?* **Yes** — precision modulates errors mechanistically.  
  - **Step 3:** Active inference?  
    - *Paper details:* No behavioral actions; focuses on perception. Skip.  
  - **Step 4:** Empirical targeting?  
    - *Paper details:* Hallucination severity correlates with GABA deficits (precision) and aberrant prediction errors.  
    - *Sufficient?* **Yes** — direct empirical link.  
  - **Step 5:** FEP specificity?  
    - *Paper details:* Uses variational free energy; distinguishes from simple Bayesian models.  
    - *Sufficient?* **Yes** — no handoff needed.  
  - **Verdict:** Genuine PP/FEP.  

  #### **Case 2: Behavioral Study on Consumer Choice**  
  *Authors’ claim:* "Consumer choices minimize surprise."  
  - **Step 1:** Generative model specified?  
    - *Paper details:* No model structure; describes choices as "updating beliefs."  
    - *Sufficient?* **No** — no hierarchy or state transitions.  
  - **Stop Point:** **Negative verdict** (conceptual decoration).  
  - **Verdict despite framing:** Fails at Step 1 despite authors’ claims.  

  #### **Case 3: Motor Learning Study (Negative Verdict Despite Framing)**  
  *Authors’ claim:* "Motor adaptation minimizes free energy via predictive processing."  
  - **Step 1:** Generative model specified?  
    - *Paper details:* Mentions "predictions" but no hierarchical structure (e.g., no proprioceptive vs. goal-level states).  
    - *Sufficient?* **No** — **Negative verdict**.  
  - **Why conflict?** Paper uses PP terms but reduces to simple error correction (no precision or generative model). Mechanistic PP claims unjustified.  

  ---

  ### **Summary Workflow**  
  ```mermaid
  graph TD
      A[Start: Check generative model] -->|No| B[Negative verdict]
      A -->|Yes| C[Check precision-weighting]
      C -->|No| B
      C -->|Yes| D{Action involved?}
      D -->|No| E[Check empirical targeting]
      D -->|Yes| F[Check active inference]
      F -->|No| B
      F -->|Yes| E
      E -->|No| B
      E -->|Yes| G[Check FEP specificity]
      G -->|Unclear| H[Handoff to specialist]
      G -->|Clear| I[Genuine PP/FEP]
  ```  
  **Time-Saving Tips:** Focus on Steps 1 and 2 first—these catch 90% of decorative use. Flag value-laden steps (⚠️) for editorial review if uncertain.
