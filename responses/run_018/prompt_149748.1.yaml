  On ontology: Preservation seems committed to presentism or growing-block theory (only existing pages matter). Exhibition leans toward eternalism (all textual moments equally real). But crucially, neither fully commits - preservation doesn't deny past/future existence, exhibition doesn't deny linear history. The hybrid works precisely because it's ontologically flexible.

  Rival theories excluded: Rigorous presentism would forbid thematic displays ignoring chronology. Pure eternalism would make preservation protocols absurd. The archive implicitly rejects both extremes.

  Coherence assessment: It's functionally coherent because both arms treat manuscripts as having dual aspects - physical objects in time versus conceptual works beyond time. This mirrors how libraries treat books as both physical copies and enduring texts.

  For the Borges-view scenario: They'd need to abandon linear cataloging, allow digital reproduction freely, and display revisions as simultaneous variations. But the physicalist view would require the opposite: enforce strict chronology everywhere and ban thematic displays that "distort" temporal sequence.

  The JSON summary should crystallize this: preservation as "contextual presentism/growing-block", exhibition as "conceptual eternalism", overall coherence as "contextually coherent".
answer: |-
  The archive's practice constructs an unstable but functionally coherent hybrid ontology that simultaneously presupposes linear time for material preservation while denying it for textual meaning. This dualism isn't accidental but strategically necessary to serve conflicting institutional mandates: protecting physical artifacts and disseminating cultural meaning. Below is the defended reconstruction:

  ### Core Philosophical Commitments
  1. **Preservation Arm**: Assumes a **growing-block theory of time** for physical objects. 
     - *Evidence*: Irreversible sequencing, rejection of digital reproduction (as it "destroys the singular temporal moment"), and legal emphasis on "unrecoverable points" imply that (a) past manuscript states are real and fixed, (b) present conservation actions alter the block's edge, and (c) future doesn't yet exist. Crucially, it treats the *material inscription* as ontologically primary.

  2. **Exhibition Arm**: Commits to **eternalism for textual meaning**. 
     - *Evidence*: Thematic groupings ("Forked Paths," "Eternal Recurrence") treat drafts from 1941 and 1960 as coexisting variations. Free reproduction of "late revisions" detached from their chronological context implies all textual states exist simultaneously in a timeless structure. Here, the *conceptual work* is ontologically primary.

  3. **Reconciled Hybrid**: The practice presupposes **textual dualism**: 
     - Physical manuscripts are temporal, singular, and linearly ordered (growing-block).  
     - Literary works are atemporal, multipliable, and structured thematically (eternalism).  
     - *Coherence Condition*: This hybrid holds only if the archive treats material chronology as irrelevant to textual meaning. Preservation protects the *object*, while exhibition interprets the *idea*—a common library paradigm.

  ### Excluded Theories
  - **Presentism**: Rejected by both arms. Preservation values *past* manuscript states; exhibition treats *future/past* drafts as equally present.
  - **Rigorous Four-Dimensionalism**: Incompatible with preservation’s rejection of digital copying (which would be mere "time-slice duplication" under eternalism).
  - **Substance Monism**: The archive requires two distinct entities: time-bound paper and timeless text.

  ### Institutional Coherence
  The policy is **contextually coherent** because:
  - Preservation’s linearity applies only to *material conservation*, not interpretation.
  - Exhibition’s eternalism applies only to *meaning*, not physical handling.
  - Legal deeds bind the physical object, freeing the archive to curate the intellectual content thematically.  
  *Inconsistency arises only if one conflates the manuscript’s material and conceptual ontologies—which the archive systematically avoids.*

  ### Required Changes Under Alternative Ontologies
  **If adopting Borges’ view (all moments are simultaneous variations of eternal forms):**
  - Scan/photograph all revisions freely (no "temporal moment" to destroy).  
  - Replace chronological finding aids with thematic/associative databases.  
  - Display drafts as synchronic networks, erasing dates entirely.  
  - Grant reproduction rights without temporal restrictions.  
  - Legally redefine the deed of gift to prioritize the eternal work over physical instantiations.

  **If adopting strict linear physicalism (manuscripts = dated matter only):**
  - Ban thematic exhibitions (misrepresents linear history).  
  - Organize all displays chronologically; label revisions with temporal context.  
  - Restrict reproductions to facsimiles preserving original sequence.  
  - Digitize only to preserve fragile originals (not for access).  
  - Limit catalog access to linear indices; reject "timeless" metadata.

