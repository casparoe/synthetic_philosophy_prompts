prompt: |-
  I'm putting together a segment for my science-and-ideas newsletter and I've got an interveiw next week with a philosopher who's defending this really specific claim that qualia aren't just hard to explain but are literally an incoherent ontological posit — he's running a Quine-style audit on mental concepts but adding this niche twist he calls the "mirror-binding problem," where any attempt to refer to a quale already smuggles in the conceptual framework the quale was supposed to be pre-theoretically grounding. I was arguing about it with friends over coffee yesterday and half of them said it's just eliminativism with extra steps, but I think there's more going on. Before you draft the quetions, take a moment to think carefully and do a quick mental branstorm: map out the three biggest pressure points, especially how this view handles inverted-spectrum thought experiments and whether mirror-binding actually distinguishes qualia from theoretical entities like electrons. You are acting as a professional philosophy interviewer with a background in philosophy of mind; please answer in American English.

  I want exactly five items — numbered 1 through 5, each just a sentence or two, with no introduction and no conclusion. Keep them in the weeds: press him on whether mirror-binding applies just as hard to neurons or electrons, anticipate his standard reply about inverted spectra and include the immediate follow-up, ask what mental ontology survives if we apply his Quinean scrub consistently across the board, and make sure one question forces him to name what evidence could actually shift his view. Don't ask generic biographical fluff; stay sharp and specific.
reasoning: |-
  Okay, let me tackle this query step by step. The user wants five laser-focused questions for interviewing a philosopher who claims qualia are ontologically incoherent due to his "mirror-binding problem." 

  First, I need to unpack the core tension: the philosopher argues that referring to qualia already assumes the framework qualia were meant to ground. That's the mirror-binding problem in a nutshell. The challenge is crafting questions that pressure-test this without letting him retreat to standard eliminativism.

  Hmm, three critical pressure points emerge: 
  - Whether mirror-binding equally undermines scientific entities (like electrons) 
  - How inverted spectrum scenarios survive his critique 
  - What remnants of mental ontology remain after Quinean scrubbing 

  For question structure, I'll start with the inverted spectrum since it's the classic qualia defense. His likely reply will involve dismissing it as a malformed intuition—so the follow-up must demand why phenomenal asymmetry feels different from linguistic disagreements. 

  Next, the electron comparison is crucial. If he claims theoretical entities avoid mirror-binding through predictive success, the follow-up should corner him on why qualia can't similarly earn ontological status through explanatory work. 

  The ontology question needs teeth: asking what survives the scrub forces him to either admit total elimination or reveal his positive commitments. 

  Finally, the falsifiability question can't be soft—demanding specific evidence prevents hand-waving. 

  User clearly values precision, so each question must target conceptual joints: no fluff, no repackaged eliminativism probes. Mirror-binding's uniqueness hinges on whether it's meaningfully distinct from Quine's underdetermination arguments. Better nail that.
answer: |-
  Here are your five targeted questions:

  1. When pressed on inverted-spectrum scenarios—where two individuals report identical color discriminations despite swapped qualitative experiences—you've previously dismissed them as "conceptually unstable." But if I report asymmetric qualia (e.g., "My red sensation is jarringly distinct from green"), doesn't mirror-binding still need to explain why that asymmetry feels epistemically different than merely disagreeing about the label "red"?

  2. If mirror-binding shows that *referring* to qualia presupposes the framework they're meant to ground, why doesn't this equally sabotage reference to neurons or electrons? Don't theoretical posits in physics also rely on circular justifications until empirically validated?

  3. After applying your Quinean "scrub" to eliminate incoherent posits, what minimal mental ontology survives? If beliefs/desires are just dispositional patterns, does mirror-binding leave *any* room for intrinsic character beyond third-person functional mappings?

  4. You’ll likely argue electrons avoid mirror-binding by anchoring in predictive success. But if a future neuroscience deduces qualia-structures from behavioral + neural data to predict novel subjective reports, wouldn’t that grant qualia equal ontological footing—or is mirror-binding a deeper *conceptual* veto?

  5. Name one concrete empirical discovery—not a thought experiment—that could falsify your thesis. If brain stimulation induced a universally reportable, functionally irreducible sensation (e.g., "phosphene-X"), would that compel you to accept qualia as coherent? If not, why is that insufficient?
