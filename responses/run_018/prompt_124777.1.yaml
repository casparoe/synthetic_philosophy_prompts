  The core tension revolves around three conflicting interpretations of bodily authority: the clinician's dismissal (normal biomarkers = no disease), the advocate's insistence (symptoms = proof of disease despite normal tests), and the naturalist reduction (statistical abnormality = disease). User explicitly wants two underdiscussed distinctions centered: "dysfunction without disease" (statistically abnormal but harmless) and "disease without dysfunction" (socially pathologized normal variation).

