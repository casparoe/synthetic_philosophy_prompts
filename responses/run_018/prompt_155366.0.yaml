  The autonomy concern is central. Even if information is true and voluntarily accessed, framing effects might steer decisions in a way that compromises genuine self-determination. That's a serious ethical issue for civic tech that demands more than just adding a disclaimer.

  Reversibility is crucial - can users switch to raw data? If so, that might mitigate autonomy concerns by preserving access to unframed information. But how visible and usable is this feature? Is it buried or prominent?

