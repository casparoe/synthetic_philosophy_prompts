answer: |-
  Here is a taxonomy of positions on pleasure's heterogeneity, built from four tests and sorting the specified cases. Branch nodes are framed as testable claims.

  **Branch Nodes (Tests):**

  1.  **Grafting Possible?** Can the pleasantness of an experience be conceptually detached from its specific phenomenology and attached to a phenomenology that was originally unpleasant, leaving that phenomenology otherwise unchanged? (Yes/No)
  2.  **Absorption Pleasant?** Can an experience be pleasant *solely* in virtue of being the object of one's absorbed attention during the episode, even if no distinct pleasant feeling was noticeable at the time? (Yes/No)
  3.  **Repudiation Possible?** Can an experience be genuinely pleasant *during its occurrence* even if the subject, upon later reflection with full information, repudiates it as not pleasant and not good for them? (Yes/No)
  4.  **Exchange Commensurable?** Are all pleasures necessarily comparable as more or less pleasant (commensurable) such that any two could, in principle, be traded off against each other in terms of pleasantness? (Yes/No)

  **Logical Space & Live Positions:**

  The diagram below represents the logical space defined by the four binary branch nodes. Live positions are marked with bold labels. Unoccupied cells are marked with their diagnosis.

  ```
