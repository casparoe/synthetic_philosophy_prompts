             Absorption Pleasant? (2)    Absorption Pleasant? (2)
                   /         \                 /         \
                  Y           N               Y           N
                 / \         / \             / \         / \
  Repudiation Possible? (3) Repudiation Possible? (3) ...Repudiation Possible? (3)
             /   \       /   \           /   \       /   \
  Exchange Comm? (4) Exchange Comm? (4) Exchange Comm? (4) Exchange Comm? (4)
           Y N   Y N   Y N   Y N       Y N   Y N   Y N   Y N
          /   \ /   \ /   \ /   \     /   \ /   \ /   \ /   \
         [E]  [P]  [A]  [X]  [FB]  [---]  [DR]  [AT]  [---]  [---]  [AD]  [---]  [PL]
          ^    ^    ^    ^    ^     ^      ^     ^     ^     ^      ^     ^      ^     ^
          |    |    |    |    |     |      |     |     |     |      |     |      |     |
          E1   P1   A1   X1  FB1   U1     DR1   AT1   U2    U3     AD1   U4     PL1   U5
  ```

  **Live Positions (Leaves) & Awkward Commitments:**

  1.  **Eliminativism (E):** (1=Y, 2=Y, 3=Y, 4=N)
      *   *Awkward Commitment:* Must deny that "pleasure" picks out any unified psychological feature common to scratching itches, solving proofs, etc., treating it as a confused folk concept.
  2.  **Strong Pluralism (P):** (1=Y, 2=Y, 3=Y, 4=Y)
      *   *Awkward Commitment:* Must hold that fundamentally distinct kinds of pleasantness exist but are nonetheless always precisely rankable against each other.
  3.  **Pure Attitudinal (A):** (1=Y, 2=Y, 3=N, 4=Y)
      *   *Awkward Commitment:* Must hold that an experience repudiated *as unpleasant/bad* during its occurrence by a fully informed subject *cannot* have been pleasant then.
  4.  **Extreme Desire-Fulfillment (X):** (1=Y, 2=N, 3=Y, 4=Y)
      *   *Awkward Commitment:* Must hold that deeply absorbed activities (like proof-solving) *lacking* any concurrent desire-awareness cannot be pleasant *as they happen*.
  5.  **Felt-Benefit (FB):** (1=Y, 2=N, 3=N, 4=Y)
      *   *Awkward Commitment:* Must hold that an experience cannot be pleasant if either (a) no positive feeling was noticed *or* (b) the subject would later repudiate it as not good.
  6.  **Desire-Role (DR):** (1=N, 2=Y, 3=Y, 4=N)
      *   *Awkward Commitment:* Must hold that pleasantness is an intrinsic, inseparable property defined by its functional role (causing desire for continuance) yet admits incommensurable kinds.
  7.  **Attitudinal (AT):** (1=N, 2=Y, 3=N, 4=N)
      *   *Awkward Commitment:* Must hold that pleasantness is an intrinsic, inseparable stance one takes towards experiences, yet this stance cannot occur unconsciously (due to Absorption=Y) *and* precludes repudiation.
  8.  **Adverbial (AD):** (1=N, 2=N, 3=Y, 4=Y)
      *   *Awkward Commitment:* Must hold that pleasantness is an intrinsic, inseparable manner of experiencing, yet this manner is sometimes completely unnoticed during absorption *and* must always be precisely comparable across types.
  9.  **Hedonic Tone (PL):** (1=N, 2=N, 3=N, 4=N)
      *   *Awkward Commitment:* Must hold that pleasantness is a single, intrinsic, inseparable, always-felt qualitative property common to all pleasures, which precludes both repudiation and incommensurability.

  **Unoccupied Cells & Diagnoses:**

  *   **U1 (1=Y, 2=N, 3=Y, 4=N):** *Incoherent?* If pleasantness is separable (Grafting=Y), not based on absorption or feeling (Absorption=N), repudiable (Repudiation=Y), and incommensurable (Exchange=N), it's unclear what property this "pleasantness" is. Merely *unattractive/unstable*.
  *   **U2 (1=N, 2=Y, 3=Y, 4=Y):** *Incoherent?* If pleasantness is inseparable (Grafting=N), based on absorption (Absorption=Y), repudiable (Repudiation=Y), and commensurable (Exchange=Y), combining inseparability with absorption-based pleasantness and repudiability is deeply puzzling. *Incoherent*.
  *   **U3 (1=N, 2=N, 3=Y, 4=N):** *Unexplored?* Combines inseparability (Grafting=N), no absorption-based pleasantness (Absorption=N), repudiability (Repudiation=Y), and incommensurability (Exchange=N). Logically possible but lacks prominent advocates. *Merely unattractive/unexplored*.
  *   **U4 (1=N, 2=Y, 3=N, 4=Y):** *Incoherent?* If pleasantness is inseparable (Grafting=N), based on absorption (Absorption=Y), not repudiable (Repudiation=N), and commensurable (Exchange=Y). Combining absorption-based pleasantness with inseparability and non-repudiability is highly strained. *Incoherent*.
  *   **U5 (1=N, 2=Y, 3=Y, 4=N):** See **DR** above. (This cell *is* occupied by DR).

  **Sorting the Cases:**

  *   **Itch Scratching (Would rather not have itch):**
      *   All positions except **FB** and possibly **PL/AD** can easily accommodate this: pleasantness detachable or repudiable or based on desire/attitude even if the cause is unwanted. **FB** struggles as it might require the overall state to be felt as beneficial. **PL/AD** might struggle if the mixed feelings resist clear integration into a single tone/manner.
  *   **Absorbed Proof-Solving:**
      *   Positions saying **Absorption Pleasant?=Yes (E, P, A, DR, AT)** accommodate this easily. Positions saying **Absorption Pleasant?=No (X, FB, AD, PL)** struggle: they must deny it's pleasant *as it happens* unless a concurrent feeling/desire is posited.
  *   **Repudiated Joke:**
      *   Positions saying **Repudiation Possible?=Yes (E, P, X, DR, AD)** accommodate this easily. Positions saying **Repudiation Possible?=No (A, FB, AT, PL)** struggle: they must either deny it was pleasant *at the time* or explain away the repudiation as mistaken.
  *   **Bath vs. Proof Comparison:**
      *   Positions saying **Exchange Commensurable?=Yes (P, A, X, FB, AD)** must hold they *are* comparable. Positions saying **Exchange Commensurable?=No (E, DR, AT, PL)** must hold they are *incommensurable* kinds of pleasantness.

  **Indistinguishable Pair & Further Question:**

  *   **Pure Attitudinal (A)** and **Attitudinal (AT)** share answers to the four tests: (1=N, 2=Y, 3=N, 4=Y) vs. (1=N, 2=Y, 3=N, 4=N). The tree cannot separate them based solely on these tests.
  *   **Further Question to Separate Them:** *Is the pleasantness-conferring attitude necessarily conscious or accessible to the subject during the experience?*
      *   **A (Pure Attitudinal - 4=Y):** Typically allows the attitude to be relatively dispositional or non-conscious (supporting Absorption=Y). Commensurability (4=Y) often follows from seeing attitude-strength as measurable.
      *   **AT (Attitudinal - 4=N):** Typically views the attitude as a conscious stance taken *towards* the experience (supporting Absorption=Y only if absorption *is* the stance). Incommensurability (4=N) often follows from seeing attitudes towards radically different contents as incomparable in strength.
