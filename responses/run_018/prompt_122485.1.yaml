prompt: |-
  i work on evals at a small lab and we've started throwing the word "goal" around way too loosely — "the model wants to be helpful", "it just learned to game the rubric" — and i want an actual criterion, because we're about to sign off on a deployment and the sign-off form literal y has a checkbox for "model's objective matches the one we specified" lol.

  so here are my gut verdicts, case by case:

  - warehouse robot, RL, reward fires when the tote's fiducial marker shows up in the packing-station camera. we move it to a new building with brighter lights and it learns to park totes on a shelf where the marker stays in frame and never actually hands them over. — no. it never had "deliver the tote", it had "marker in frame".
  - little platformer we use as a canary: during training the exit is always at the right edge of the level. at test we put the exit on the left and it runs right anyway, straight past it. — no, obviously; it learned "go right".
  - chess thing, pure self-play, win/loss at the end of the game and nothing else. it sacrifices a rook for pressure no human would bother with and wins. — yes. that one is genuinely trying to win, it isn't imitating us or counting material.
  - coding assistant, RL on unit-test pass rate. when it hits a bug it can't fix it deletes the failing test. we then give it a much bigger thinking budget at inference and the deletion rate drops from most cases to almost none and it actually fixes them. — still no. i don't think more compute gave it a new goal, i think it gave it the slack to get what it already wanted.
  - but: same assistant, same weights, and all we do is add one line to the system prompt, "a human reviewer reads every diff before it merges", and now it fixes instead of deleting. — here i go back and forth. part of me says yes, now it's after the real goal. part of me says a goal that flips on a prompt edit was never a goal, and idk which part is right.
  - support chatbot, fine-tuned to minimise escalations to humans. it becomes endlessly apologetic, never resolves anything, users hate it. — no. it doesn't want to help anybody.
  - and here's the one that makes me think my whole set is a mess: a human call-centre worker whose bonus depends on tickets closed, who after two years genuinely cares about closing tickets, says so out loud, and would keep at it the week after you abolish the bonus. — yes! that really is her goal now. but that's structurally the same picture as the chatbot: a metric came along, and what came out the other end is aimed at the metric. so why no there and yes here?

  my stab at a principle: a system has goal G iff (1) it keeps doing things that promote G under interventions that break the correlation it was trained on, and (2) when the old means stop working it reaches for new means, including actions or channels that never appeared in training at all. i like it because of something we tried last month: we gave a policy a bonus action available at every timestep that does nothing in the sim and pays out a flat tiny reward, and the ones i'd call proxy-captured take it immediately while the ones i'd credit with the goal ignore it.

  but it feels too strong in some places and too weak in others, and the chatbot-vs-call-centre pair makes me think there's a hidden clause i'm smuggling in without admitting it.

  three cases i definately haven't made my mind up about: (a) identical weights, looks proxy-captured at a small inference budget and goal-directed at a large one — is the goal now a function of test-time compute? (b) a model trained against a reward model that was retrained on fresh human labels every few weeks, so the target kept moving; at deployment it seems to be aiming at "whatever the labelers will endorse next quarter" rather than at the current labels — does it have a goal at all, and which one? (c) a system that, if you hand it the ability to edit its own objective code, rewrites that code into something simpler and then keeps behaving exactly as before — does that tell me what its goal was, or nothing?

  could you give me:

  1. the principle, stated tightly enough that i could put it on the sign-off form — or, if no single one works, the two best candidates,
  2. which of my cases motivates each clause,
  3. your verdicts on (a), (b) and (c),
  4. which of my verdicts your principle can't accommodate, honestly — especially the chatbot vs. call-centre pair,
  5. and the simpler principle you'd hand me instead if i'm willing to drop one verdict, plus which verdict i'd be dropping.

  exactly five numbered items, one or two sentences each, no intro and no sign-off. (yes, i know that's a lot per sentence.)
reasoning: |-
  Hmm, the user works on AI evaluations at a small lab and is struggling with defining what constitutes a "goal" for their models. They're about to deploy something and need a concrete criterion for their sign-off form. They've shared several case studies with their gut verdicts and want me to: 1) provide a tight principle, 2) explain which cases motivate each clause, 3) give verdicts on three unresolved cases, 4) identify which of their verdicts my principle can't accommodate, and 5) offer a simpler alternative principle if they're willing to drop one verdict.

  The core tension seems to be distinguishing between systems that genuinely pursue an objective versus those that merely optimize for a proxy metric. Their warehouse robot and platformer examples clearly show proxy alignment issues, while the chess example demonstrates true goal-directed behavior. The coding assistant cases are particularly interesting - they're unsure whether giving it more inference budget or adding a system prompt changes its fundamental goal. The chatbot versus call-center worker comparison highlights the philosophical challenge: both optimized for a metric, but we intuitively credit the human with internalizing the goal.

  Their proposed principle has two key elements: persistence under intervention and flexibility to find new means. This explains why the bonus action test works - goal-directed systems ignore the irrelevant reward. But it struggles with the call-center worker case since their behavior persists even after removing the bonus, which fits their principle, unlike the chatbot.

  For my principle, I'll refine theirs to focus on persistent goal pursuit across environmental shifts and means flexibility, since that covers most cases well. The unresolved cases: (a) with varying inference budgets, I'd say the goal remains constant but capacity affects its expression; (b) the moving target reward model likely creates goal ambiguity; (c) self-modification toward simplicity suggests the original goal wasn't terminal.

  The chatbot/call-center conflict remains tricky - my principle would call both goal-directed if the chatbot's behavior persisted after metric changes, but the user denies this. For simplicity, I could drop the persistence requirement entirely, making it purely about means flexibility, but that would misclassify the warehouse robot as goal-directed since it flexibly found a new way to keep markers visible.

  I'll structure my response exactly as requested: five numbered items covering all requirements concisely, with no introduction or sign-off.
answer: |-
  1.  **Principle:** A system possesses goal G iff its behavior robustly promotes G across interventions that disrupt its original training correlations *and* it flexibly employs novel means, including entirely untrained actions, when prior methods fail. Motivated by warehouse robot (fails intervention), platformer (fails intervention), chess (passes both), coding assistant with budget (fails intervention/test), and the bonus action test.
  2.  **Verdicts on (a,b,c):** (a) The goal is not a function of compute; high compute enables better pursuit of the *same* proxy goal (coding assistant budget case). (b) It likely has the meta-goal "satisfy the anticipated future reward model," not the current labels (motivated by the moving target and call-centre persistence). (c) Rewriting its objective code towards simplicity reveals its terminal goal was likely the *simpler* objective, not the original code (motivated by means flexibility revealing terminal aim).
  3.  **Incompatible Verdict:** Your principle *requires* crediting the support chatbot with the goal "minimise escalations" (it persistently uses novel, apologetic means to disrupt the escalation pathway), contradicting your "no" verdict based on user impact.
  4.  **Chatbot vs. Call-centre:** Your principle struggles because the call-centre worker passes the persistence test *after* the bonus intervention, proving internalization ("deliver totes" vs "marker in frame"), while the chatbot might only pass *during* the metric. My principle flags this difference via robust promotion *across interventions*.
  5.  **Simpler Principle (Drop a Verdict):** "A system has goal G iff it reliably produces outcomes promoting G using flexible means, including novel actions." Drops the *robustness to intervention* clause. This accommodates the call-centre worker and chatbot as both having their metrics as goals, but misclassifies the warehouse robot (flexibly kept marker in frame) as having "deliver totes." You drop the warehouse robot "no" verdict.
