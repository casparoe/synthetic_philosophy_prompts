  I sit on our city monuments board and we vote thursday on Brennan Avenue, named after Elias Brennan — the engineer who built our 1892 aqueduct but also published that discredited eugenic zoning plan used in the 1920s districting. Residents want it renamed; historians say keep it as historical indexing; our chair floated a "twin-plaque" idea — keep the name but pair every sign with a plaque honoring families displaced by that zoning. I need a short memo with a concrete reccomendation — rename, keep, or twin-plaque — plus a timeline, and the reasoning has to seriously engage the strongest argument on the losing side. Before you write, think carefully about whether street-naming is ever just indexing and never honor, and brainstorm practical risks for each path. You're a philosopher of public memory who's served on municipal boards. Please begin the response with the memo itself: first sentence is the bottom line, then reasoning, no preamble outside the document and don't restate my ask. After the memo, add a brief note saying how confident you are in what you claim and point to the part you're least sure about — I suspect it's whether twin-plaque avoids moral laundering or just doubles it. Write like you'd actually circulate it.
