answer: |-
  **MEMORANDUM**  
  To: City Monuments Board  
  From: Dr. E. Vance, Philosopher of Public Memory  
  Date: October 26, 2023  
  Subject: Recommendation for Brennan Avenue  

  **Recommend renaming Brennan Avenue** to honor families displaced by the 1920s eugenic zoning plan, with implementation to begin within 30 days and completion within 6 months. While street names functionally index history, they are never *neutral* markers; they unavoidably convey communal honor or normalization of the namesake’s legacy. Elias Brennan’s engineering role is eclipsed by his authorship of a policy that inflicted generational harm, making continued commemoration ethically untenable. Renaming centers redress over preservation, directly addressing residents’ lived experience of ongoing harm.  

  **Strongest counterargument (historical indexing):** Historians rightly note that erasure risks obscuring complex histories and that "Brennan Avenue" itself documents a consequential figure. However, indexing can be preserved through *targeted* means (e.g., educational kiosks at the aqueduct or city archives) without maintaining an honorific platform. The street name’s primary function is wayfinding and civic identity, not nuanced historical education; retaining it prioritizes abstract historiography over tangible repair.  

  **Practical risks mitigated:**  
  - *Renaming risk (confusion/cost)*: Phased sign replacement aligned with scheduled maintenance minimizes disruption. Temporary "Formerly Brennan Ave" sub-signs during transition aid navigation.  
  - *Keeping risk (perceived endorsement)*: Unavoidable. Silence perpetuates harm.  
  - *Twin-plaque risk (moral laundering/dilution)*: Plaques may be ignored, defaced, or weaponized ("We acknowledged it, move on"). Doubles administrative burden without resolving the core issue: the name’s honorific valence.  

  **Proposed Timeline:**  
  1. **Day 1–30**: Formal resolution to rename; establish community-led naming committee (displaced descendants prioritized).  
  2. **Day 31–120**: Committee selects new name; council ratifies. Design interim signage.  
  3. **Day 121–180**: Install new signs; launch digital archive/QR code linking to Brennan’s full history at aqueduct site.  

  ---  
  **Confidence Note:**  
  High confidence in renaming as the only option that engages the ethical imperative (*streets as honorific, not archival*). Least confident in **dismissing "twin-plaque" as laundering**—it *could* work in contexts with robust public pedagogy, but here it risks appearing as institutional equivocation on harm, not accountability. The moral hazard of "double commemoration" outweighs potential benefits.  

  Respectfully submitted,  
  Dr. E. Vance
