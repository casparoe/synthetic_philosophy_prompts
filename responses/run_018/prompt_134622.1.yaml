  First, I need to analyze the key arguments. Renaming addresses the harm caused by Brennan's eugenics plan, which aligns with residents' concerns about honoring someone with such a legacy. But historians argue that the name serves as historical indexing, not endorsement. The twin-plaque idea tries to balance both by acknowledging the harm while keeping the name. However, there's a risk of moral laundering—keeping the honorific while adding a corrective, which might not fully address the issue.

  Practical risks: Renaming could lead to confusion, costs, and potential erasure of history. Keeping the name might signal endorsement of Brennan's actions, causing ongoing harm. Twin plaques might be seen as superficial, doubling administrative efforts, and possibly failing to satisfy either side. The user mentioned the moral laundering concern, so I need to address that.

  The strongest argument against renaming is the historical indexing point. But street names aren't neutral; they often imply honor. Brennan's contributions to infrastructure are overshadowed by his harmful eugenics work, which caused displacement. Renaming to honor the displaced families centers the victims instead. Twin plaques might not be effective because people might ignore them, and the street name still honors Brennan.

  My recommendation is to rename the avenue. The timeline includes immediate notification, community input for the new name, and installation within six months. The reasoning must engage the indexing argument: while names can index history, in this context, it's perceived as honoring Brennan, which is problematic given his actions. Renaming doesn't erase history; it corrects the honorific aspect. 

  The note at the end should address confidence levels. I'm confident in the recommendation but unsure if twin-plaques avoid moral laundering or double it. That's the tricky part—adding plaques might seem like an attempt to offset the harm without removing the honor, which could be seen as inadequate or even hypocritical. 

