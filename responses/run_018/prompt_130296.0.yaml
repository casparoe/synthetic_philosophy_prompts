  The audience is tough: proof-theorists who worship formal derivations, an epistemologist obsessed with circularity, a Carroll historian, and skeptical grad students. I need to simulate how each would attack this.

  Hmm... the proof-theorists will definitely say "But where's the formal rule stopping the regress?" Their objection will be about mathematical necessity. The epistemologist will scream "circularity!" even though user frames it as transcendental condition. The historian might undercut by showing Carroll anticipated this.

  Biggest threat is someone connecting this to Brandom - user dreads that. Also need to flag where user's replies are weakest (e.g., "What about deviant logicians? They seem to reason without MP!").

  Should structure objections by damage level:
