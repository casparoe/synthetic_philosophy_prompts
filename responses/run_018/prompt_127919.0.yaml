  First, they're concerned if their framing preserves Browning's idea of "ordinary men" or turns them into automatons. I need to think about how to show that cultural framing doesn't negate ordinary moral reasoning. Maybe emphasize that the institutional norms provide a context for decisions, but individuals still engage in reasoning, even if it's distorted. People like Sergeant Kammerer who refused participation show that choices existed, but the norms made refusal costly. The key is that moral visibility is shaped by culture, but the reasoning process itself remains a human, cognitive act.

