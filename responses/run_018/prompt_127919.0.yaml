  Third, they fear collapsing into Goldhagen's cultural determinism. To avoid this, it's crucial to highlight how situational mechanisms interact with culture. For example, group conformity isn't just cultural but also stems from immediate social dynamics. Incremental escalation depended on specific historical sequences. The synthesis should position culture as the framework that makes situational pressures effective, not the sole cause. Emphasizing that without the situational triggers, the cultural potential might not have been activated. This maintains a dual causal role.

