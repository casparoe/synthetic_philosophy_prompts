  ok so im in this philosophy club at school and we got into moral uncertianity — like when your not sure if utilitarianism or kantian ethics is right. i think i broke the whole idea with this chain, but my teacher said its more complicated. heres my argument:

  (1) if your morally uncertian between theory A and theory B, rational choice says maximize expected moral value.
  (2) but A measures value in happiness and B measures it in something like dignity or rights, so they use totally different cardinal scales with different zero points and units.
  (3) since these scales are arbitrary, i can multiply every value in B by 999 and now B always dominates, flipping my decision.
  (4) so unless i already have a prior that fixes the scale — which seems to require knowing which theory is actually true — the expectation is undefined.
  (5) but if i knew which theory was true i wouldnt be uncertian in the first place.
  (6) therefore acting on moral uncertianity is circular and gives no real guidance.

  my gut says step 3 is cheating but i cant say exactly why. also my teacher mentioned "intertheoretic normalization" and something about ranges being fixed inside each theory, but i didnt follow. can you tell me which step to reject and what giving it up costs? and please seperate whats actually settled here from whats genuinely contested among people who actually study this — dont present one philosophers fix like its the only view everyone agrees on.
