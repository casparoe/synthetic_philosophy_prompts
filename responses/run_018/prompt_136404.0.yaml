answer: |-
  ### Exam Question  
  **Time Allowed:** 90 minutes  
  **Word Guide:** 750–900 words  

  > **Prompt:** Peter Singer’s drowning child analogy argues that affluent individuals have stringent duties to aid distant strangers, rejecting proximity and demanding significant sacrifice. However, Singer’s framework implicitly treats rescue duties as *continuously scalable*: the obligation to save a child strengthens gradually as the cost to the agent decreases (e.g., a $100 duty is a weaker version of a $5,000 one). An alternative view holds that rescue duties are *binary/threshold-triggered*: they activate only when costs fall below a critical point and collapse entirely when exceeded.  
  >  
  > **First**, reconstruct Singer’s scalability claim and identify its core continuity assumption. **Second**, apply this debate to a modified case:  
  > *You pass a shallow pond where a child is drowning. Saving them requires a $5,000 medical intervention with a 60% success rate (failure = death). Assume $5,000 represents a non-trivial but non-ruinous cost for you (e.g., depleting savings but not incurring debt).*  
  > Does the intuition that "you must save the child" persist when rescue is probabilistic? **Third**, defend whether Singer’s *scalar model* or a *binary-threshold model* better explains obligations in rescue contexts. Support your position with **one concrete counterexample** illustrating the flaws of the rejected model.  

  ---

  ### Model Answer (690 words)  

  Singer’s drowning child argument dismantles the moral relevance of proximity, insisting that if we can prevent severe harm at modest cost, we must act—whether the child is before us or oceans away. Crucially, Singer treats rescue duties as *scalar*: obligations intensify *smoothly* as the cost-benefit ratio improves (*Practical Ethics*, 2011). If losing $100 saves a life, the duty is weaker than if losing $5,000 saves a life; the latter imposes a "stronger" demand proportional to the value preserved relative to sacrifice. This assumes a *continuity of moral demandingness*: cost (C) and benefit (B) exist on sliding scales, and obligation strength (O) scales linearly with B/C.  

  The probabilistic variant destabilizes this continuity. In the 60% success case, spending $5,000 yields an expected value (EV) of 0.6 lives saved. Singer’s scalar model implies our duty mirrors this linear EV: we are obliged to act because 0.6 lives saved outweighs a $5,000 cost (assuming, per Singer, $5,000 << value of life). Yet moral intuitions fracture here. Many still feel a powerful duty to attempt rescue—after all, *not* acting guarantees death, while acting offers a 60% survival chance. However, this intuition doesn’t neatly track Singer’s scalability. If we reduce the success probability to 10% (EV = 0.1 lives), the obligation feels weaker, but not proportionally: a 10% chance might still compel action if $5,000 is deemed a "bearable" cost, whereas Singer’s model would demand precise calibration between cost and fractional EV. Worse, if we *increase* the cost to $50,000 (with 60% success), the duty plausibly vanishes—not because EV is lower (it’s unchanged), but because the cost now crosses a *threshold of excessive sacrifice*. This suggests obligations are less about linear EV calculations and more about *cost ceilings* and *non-negotiable minima of opportunity*.  

  I argue the *binary-threshold model* better captures rescue ethics. Duties activate when two conditions are met: (1) the expected harm averted exceeds a "significant harm" threshold (e.g., death/disability), and (2) the cost to the agent remains below an "acceptable sacrifice" threshold (e.g., non-ruinous financial loss). Once activated, the duty is near-absolute; it does not taper gradually with rising cost or falling probability but collapses when either variable breaches its threshold. This explains why we feel compelled to act at 60% success: death is catastrophic, and $5,000 (while substantial) is below the sacrifice ceiling for most affluent agents. Conversely, reducing success to 10% may *deactivate* the duty not due to linear EV decay, but because the "significant harm averted" condition fails (a 90% chance of futile sacrifice overwhelms the minimal expected benefit).  

  A counterexample to Singer’s scalar model clarifies this. Suppose a doctor can harvest organs from one healthy patient to save five dying patients with 99% certainty. Singer’s scalar logic—prioritizing net lives saved—would demand this action if the cost to the doctor (e.g., emotional trauma, professional censure) is less than the value of four net lives saved. Yet virtually no one endorses this duty. The threshold model explains why: the "cost" to the innocent patient (death) breaches the sacrifice ceiling, *deactivating* any rescue obligation regardless of net benefit. Scalability fails because obligations are not continuously stronger versions of lesser duties; they are binary permissions constrained by agent-relative limits.  

  Singer might respond that thresholds are arbitrary, but this misunderstands their function. Thresholds reflect agent-relative boundaries of integrity (e.g., "I must not *kill* to save others") and preserve the distinction between *doing* and *allowing* harm. In the probabilistic pond case, paying $5,000 with 60% success is still *allowing* fate to determine the outcome, whereas killing for organs is *imposing* lethal harm. The scalar model, by reducing all values to a common metric, obscures this distinction and justifies intuitively abhorrent trade-offs.  

  Thus, while Singer rightly expands the scope of rescue duties beyond proximity, his scalar framework overrationalizes obligation. Rescue duties are triggered by intolerable harm and feasible intervention—but collapse when costs demand unconscionable sacrifice or when agency becomes complicit in wrongdoing. The drowning child’s claim on us is categorical, not continuously negotiable.  

  ---

  ### Marking Scheme (Total: 25 points)  
  **A Answer (21–25 pts):**  
  - **(6 pts)** Accurately reconstructs Singer’s scalability claim and identifies the continuity assumption (linear scaling of obligation with cost-benefit ratio).  
  - **(6 pts)** Insightfully analyzes the 60% probabilistic case: contrasts intuitive duty with Singer’s expected-value logic and shows how it challenges continuity.  
  - **(6 pts)** Defends either scalar or threshold model with a *relevant, original counterexample* (e.g., organ harvest for scalar critique; trivial-cost/high-risk cases for threshold critique).  
  - **(3 pts)** Synthesizes analysis into a coherent argument; avoids superficial EA conclusions.  
  - **(4 pts)** Structure, clarity, precision.  

  **B Answer (15–20 pts):**  
  - Summarizes Singer’s drowning child argument accurately but superficially (e.g., repeats proximity/cost themes).  
  - Describes the probabilistic case but **fails to engage the structural tension** between expected value and obligation strength.  
  - Omits or weakly defends the scalar/binary distinction; counterexample is absent or irrelevant.  
  - May conflate Singer’s position with generic EA altruism.  

  **Critical Error (–5 pts):**  
  - **Confusing risk-weighted expected value with obligation scaling**: E.g., "Singer demands we maximize EV, so 60% obligates us to act" *without* addressing whether EV *linearly determines* obligation strength per Singer’s model, or whether thresholds interrupt this.  

  **C/D/F (0–14 pts):**  
  - Misrepresents Singer or the probabilistic case; no engagement with scalability/binary distinction.  
  - Unsubstantiated assertions; significant omissions.  

  ---  
  This prompt forces engagement with Singer’s *meta-ethical architecture* while leveraging probability to test moral continuity. The counterexample requirement ensures applied philosophical rigor, and the marking scheme penalizes conflation of empirical EV with normative structure—a common oversight in EA discourse.
