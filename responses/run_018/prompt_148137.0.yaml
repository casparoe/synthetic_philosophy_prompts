  **Addressing Your Specific Queries:**

  *   **Substrate Independence:** PC maps *very* cleanly onto this claim. Generative models, precision-weighting, and inference defined by Markov blankets are inherently substrate-independent formalisms. The core PC argument *supports* the possibility in principle.
  *   **"Responds" vs. "Emits Outputs":** This is where the distortion and leftover are most critical.
