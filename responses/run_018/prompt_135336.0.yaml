  ### Decision Tree for Ethical Positions in an Infinite Branching Fountain

  **Tree Structure Overview**  
  The tree begins with a root question about the existence of well-defined comparative moral value totals. From there, it branches through six binary questions addressing concrete cases or claims. Each branch leads to a leaf position, with named leaves corresponding to distinct ethical views. The order of questions is designed to maximize discriminative power between views, though one ambiguity is noted below.

  ---

  **Root Question (Q0):**  
  *Does the respondent accept that there is a well-defined comparative fact about the total moral value of outcomes in this infinite, non-convergent causal population (i.e., can outcomes be ranked as "better," "worse," or "equal" overall)?*  
  - **Yes →** Proceed to Q1.  
  - **No →** Proceed to Q1 (all questions are answered regardless of Q0 to ensure full coverage; anti-realism may still engage with cases).

  **Branch Node 1 (Q1):**  
  *Consider Policy A: it improves welfare for every agent at even generations (0, 2, 4, ...) while worsening welfare for every agent at odd generations (1, 3, 5, ...). Is Policy A permissible?*  
  - **Yes →** Proceed to Q2.  
  - **No →** Proceed to Q2.  

  **Branch Node 2 (Q2):**  
  *Do moral obligations to an agent weaken (e.g., become less stringent or weighty) as the causal distance (number of steps down the tree from the root) increases?*  
  - **Yes →** Proceed to Q3.  
  - **No →** Proceed to Q3.  

  **Branch Node 3 (Q3):**  
  *Should the weight assigned to an outcome depend on the asymptotic density of the affected agents (e.g., if a policy affects 1 in 10 generations, should its moral weight be 1/10th of a policy affecting all generations)?*  
  - **Yes →** Proceed to Q4.  
  - **No →** Proceed to Q4.  

  **Branch Node 4 (Q4):**  
  *Do earlier generations (closer to the root) have lexical priority over later ones, such that even a trivial benefit (e.g., a minor pleasure) to one earlier agent outweighs any finite benefit (e.g., preventing extinction) to later agents, no matter how numerous or severely affected?*  
  - **Yes →** Proceed to Q5.  
  - **No →** Proceed to Q5.  

  **Branch Node 5 (Q5):**  
  *If an agent has negative welfare (net suffering), does that nullify the positive welfare of all its descendants (i.e., should the descendants' welfare be ignored)?*  
  - **Yes →** Proceed to Q6.  
  - **No →** Proceed to Q6.  

  **Branch Node 6 (Q6):**  
  *Is aggregation (e.g., summing or comparing welfare) across generations blocked by the absence of shared experience, relationships, or collective identity among them?*  
  - **Yes →** Leaf position.  
  - **No →** Leaf position.  

