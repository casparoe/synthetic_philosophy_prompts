prompt: |-
  hey im a software engineer with zero philosphy training trying to figure out what a decent theory of work and leisure rights actually needs to cover. I keep seeing three things that feel like they should constrain any answer: the Protestant work ethic treating labor as virtuous, France's 35-hour week capping it by law, and karoshi in Japan where people literally work themselves to death. but I also want it to handle this weird case I'm stuck on—imagine AI automates all productive labor, so the only "work" left is voluntary creative projects people do for fun, yet society still shames or penalizes anyone who opts out completely.

  what would the full list of desiderata be? I want the spec: the phenomona and edge cases it must explain (the ethic, the legal cap, death-by-overwork, and my AI leisure-punishment scenario), the distinctions it can't collapse (like a right to leisure vs being forced into it, or earned rest vs state-mandated idleness), any medical or economic results it can't flat-out contradict, and for each why it's a real requirement not just one camp's prejudice. also tell me which requirements are genuinely non-negotiable vs just preferences, and point out the single one that does the most damage to popular theories. table is fine—just keep it conceptual, no need to name-drop obscure authors.
reasoning: |-
  Okay, the user is a software engineer with no philosophy background trying to develop a robust theory of work and leisure rights. They've identified three key cultural phenomena as constraints: the Protestant work ethic, France's 35-hour week, and Japan's karoshi. Plus, they're stuck on this AI automation scenario where society still shames non-participants even when work is optional. 

  Hmm, they're essentially asking for a "spec" - very engineer-brain framing. I like that. They want clear desiderata: what the theory must explain, distinctions it must preserve, hard constraints from science/economics, and crucially, how to separate non-negotiables from preferences. 

  First, unpacking their examples: The Protestant ethic shows work's moral dimension, France's law reveals society's power to limit work, karoshi proves work can literally kill, and the AI scenario exposes how social pressure persists beyond economic necessity. That last one is particularly nasty because it targets the psychology of leisure shame. 

  For distinctions, they're worried about rights vs coercion - like the difference between choosing leisure and being forced into unemployment. Also earned rest vs state idleness. These are crucial because collapsing them would make the theory useless in real policy debates. 

  Medical/economic constraints: Must account for burnout physiology and basic resource allocation. Can't ignore that human brains need downtime or that economies need some labor input. The AI scenario cleverly stresses-test this by removing scarcity. 

  Biggest challenge? Probably the karoshi requirement - most theories fail to explain why societies would tolerate lethal work cultures. But the real killer (pun unintended) is the AI leisure-punishment paradox. Existing frameworks crumble when work is decoupled from survival but shame remains. 

  Non-negotiables: Bodily autonomy (no karoshi), some leisure minimum, and protection from structural coercion. Preferences would be things like how much work is "virtuous" or exact hour limits. 

  The table format works for specs - keeping it concept-focused per their request. Should emphasize why each requirement isn't just bias: e.g., karoshi isn't "Japanese culture being weird" but proof that work systems can violate bodily integrity. 

  Final note: User's clearly frustrated with ideological takes. They want architecture, not dogma. The AI case is their litmus test - any theory that can't handle it is inadequate.
answer: |-
  Here's a conceptual "spec" for a robust theory of work and leisure rights, designed to handle your constraints and edge cases. It prioritizes **explanatory power, conceptual distinctions, and non-negotiable constraints** over specific ideological prescriptions.

  ### Core Desiderata for a Theory of Work & Leisure Rights

  | Category                | Requirement                                                                 | Why It's Necessary (Not Just Prejudice)                                                                 | Non-Negotiable? | Why It Breaks Popular Theories?                                                                 |
  | :---------------------- | :-------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------ | :-------------- | :---------------------------------------------------------------------------------------------- |
  | **1. Phenomena to Explain** |                                                                             |                                                                                                         |                 |                                                                                                 |
  | Protestant Work Ethic   | Explain why labor is often seen as intrinsically virtuous/moral.            | **Empirical Reality:** Deeply embedded cultural norm influencing policy & individual behavior globally. | Yes             | Purely rights-based theories ignore cultural motivation; purely economic theories miss moral weight. |
  | 35-Hour Legal Cap       | Explain why societies might impose legal limits on work hours.              | **Empirical Reality:** Exists as a policy tool to protect health, promote leisure, or distribute work.  | Yes             | Libertarian/"work-as-only-value" theories cannot justify state intervention limiting choice.        |
  | Karoshi (Death by Work) | Explain how work systems can become lethal & society's role in enabling it. | **Medical Reality:** Chronic stress/overwork cause measurable physical harm & death.                    | **CRITICAL**    | Theories ignoring power imbalances, coercion, or biological limits fail catastrophically here.   |
  | AI-Induced Leisure Shame | Explain why society might penalize non-participation even when work is unnecessary & optional. | **Edge Case Test:** Reveals non-economic drivers of work obligation (status, identity, social control). | Yes             | Utilitarian/economic theories collapse (no scarcity!); pure autonomy theories miss social coercion. |
  | **2. Conceptual Distinctions to Preserve** |                                                                             |                                                                                                         |                 |                                                                                                 |
  | Right to Leisure vs. Forced Idleness | Distinguish leisure as a protected choice from unemployment as unwanted deprivation. | **Moral/Economic Necessity:** Conflating them justifies exploitation or ignores structural injustice. | **CRITICAL**    | Theories equating "free time" with "leisure" ignore agency and material conditions.              |
  | Earned Rest vs. Mandated Idleness | Distinguish rest as reward/recovery from idleness imposed by lack of opportunity. | **Psychological Reality:** Perceived control over rest is crucial for well-being & motivation.          | Yes             | Theories mandating universal basic leisure without agency create new forms of alienation.        |
  | Work as Necessity vs. Work as Fulfillment | Distinguish labor for survival from voluntary "work-like" creative pursuits. | **Conceptual Clarity:** Essential for defining rights/obligations in scarcity vs. post-scarcity.        | Yes             | Theories glorifying all "work" risk justifying exploitation; those dismissing it ignore human drive for meaning. |
  | **3. Hard Constraints (Scientific/Economic)** |                                                                             |                                                                                                         |                 |                                                                                                 |
  | Human Biological Limits | Must not require or permit work levels causing demonstrable physical/mental harm. | **Medical Reality:** Burnout, stress pathologies, sleep deprivation are biologically measurable.        | **CRITICAL**    | Any theory demanding or allowing lethal work hours (karoshi) is invalid. **Most damaging constraint.** |
  | Resource Scarcity (Until Proven Otherwise) | Must acknowledge that some labor *is* essential for survival/social function (until full automation). | **Economic Reality:** Neglecting this leads to utopian proposals that collapse basic provisioning.      | Yes (Conditional) | Post-scarcity utopianism fails in current reality; theories ignoring this can't guide transition. |
  | Non-Coercion Principle  | Must not inherently rely on forced labor or punitive deprivation of basics. | **Foundational Ethics:** Core to human rights frameworks; violation is tyrannical.                      | **CRITICAL**    | Theories justifying forced labor for "virtue" or "social duty" violate this.                    |
  | **4. Agency & Social Dynamics** |                                                                             |                                                                                                         |                 |                                                                                                 |
  | Social Coercion         | Must address non-legal pressures (shame, status loss) that compel work.     | **Sociological Reality:** Peer pressure/cultural norms can be as coercive as laws (see AI scenario).    | Yes             | Libertarian theories focused only on state coercion fail to protect against societal oppression. |
  | Meaning & Identity      | Account for work's role in providing social recognition/purpose.            | **Psychological Reality:** Humans derive identity & community from contribution, even post-scarcity.    | Yes             | Purely economic theories can't explain the AI leisure shame; hedonistic theories miss human depth. |
  | Pluralism               | Allow diverse valuations of work/leisure (some see work as virtue, others as means). | **Practical Necessity:** Societies contain diverse subcultures & individual preferences.               | Yes             | Monolithic theories (e.g., extreme work ethic OR mandatory leisure) suppress legitimate diversity. |

  ### Key Takeaways

  1.  **Non-Negotiables (Failure Invalidates Theory):**
      *   **Prevention of Bodily Harm (Karoshi):** Any theory permitting or causing lethal work conditions is unacceptable.
      *   **Distinguishing Leisure from Deprivation:** Agency over free time is fundamental.
      *   **Non-Coercion:** Cannot mandate work through force or denial of basic needs.
      *   **Acknowledging Biological Limits:** Humans are not infinitely resilient machines.

  2.  **The Most Damaging Constraint:** **"Human Biological Limits"** is the single most damaging requirement to popular theories.
      *   **Why:** It directly destroys justifications for "work at all costs" mentalities (common in uncritical Protestant ethic interpretations, hyper-competitiveness leading to karoshi, and some hustle cultures). It provides an **objective, non-ideological grounding** for limiting work hours and ensuring rest, forcing theories to contend with human physiology rather than just culture or economics.

  3.  **The AI Leisure-Shame Paradox is the Ultimate Stress Test:** This scenario uniquely challenges theories by:
      *   Removing economic necessity as a driver.
      *   Highlighting the **persistence of social coercion and identity formation** around participation.
      *   Testing if a "right to leisure" includes **freedom from social penalty** for choosing pure leisure.
      *   A viable theory *must* explain why this shame arises (likely tied to social status, perceived contribution, identity) and whether countering it is a matter of rights or merely cultural change.

  4.  **The Core Tension:** The theory must navigate between:
      *   **Protecting individuals** from harm and coercion (karoshi, forced labor, deprivation).
      *   **Enabling meaningful contribution & social functioning** (work ethic, resource production, identity).
      *   **Respecting pluralism and agency** in how individuals balance work/leisure/creative pursuits.
      *   **Adapting to material conditions** (scarcity vs. potential post-scarcity).

  A successful theory isn't just about declaring "X hours is right" or "leisure is good." It's about creating a framework that **protects fundamental well-being and agency** while allowing space for diverse human flourishing within evolving technological and economic realities, and crucially, **explaining the persistent social and psychological forces** that shape our relationship with work and leisure, even when material needs are met. The karoshi constraint and the AI shame scenario are your most powerful tools for testing any proposal.
