prompt: |-
  I'm a high school junior, and I keep getting into the same argument with my friends: is doing something bad worse than merely letting something bad happen? I thought I'd settle it by writing down my gut verdicts on cases, but they don't line up under any rule I can state. Here they are, roughly from most obviously fine to most obviously awful:

  1. I could donate the $40 I earned tutoring to a charity that would use it to prevent a child's death from malaria, and instead I spend it on concert tickets. My verdict: not great, but not wrong. I don't owe a stranger my savings.
  2. A classmate is drowning in the shallow end at a pool party and I'm standing right there with a towel and working arms. I keep eating my chips. My verdict: monstrous, basically as bad as if I'd pushed her in.
  3. My grandmother is terminally ill and in pain, and the doctors ask the family whether to stop the treatment that is keeping her alive. We say stop. My verdict: sad but permissible.
  4. Same grandmother, but instead a doctor gives her an injection intended to end her life at her request. My verdict: this feels worse than case 3, meaningfully so, even though the outcome and her wishes are identical.
  5. I notice a teammate cheating on a group project and don't tell the teacher. My verdict: a bit cowardly, but not the same as cheating myself.
  6. I notice someone has put peanuts in a sandwich and my allergic lab partner is about to eat it. I say nothing because I don't like her. My verdict: that's not "doing nothing," that's murder by silence.
  7. I decline to give my friend the answers to a test he's failing, knowing he'll probably be held back. My verdict: completely fine, maybe even virtuous.
  8. I don't warn my friend that the person she's dating cheated on my cousin, though I know it for a fact. My verdict: genuinely torn — it feels like an omission but also like a betrayal of her.

  My tentative principle: it is permissible to let harm occur when preventing it would cost you something significant or when the harmed person has no special claim on you, and impermissible otherwise. But 2 already strains it (a towel is not a significant cost, so it comes out impermissible, good), while 1 seems to satisfy it and yet people I respect call case 1 a serious moral failure, and 6 has the same structure as 2 but feels closer to active killing than 3 or 4 do, and I can't say why.

  So: is there a principle that captures most of these verdicts — especially the killing-vs-letting-die difference between 3 and 4, and why 6 feels like killing while 5 doesn't? Please state it precisely, flag which of my verdicts it has to overturn, and tell me what it implies about the cases I keep going back and forth on: 1 and 8. If no single principle works without becoming a list of exceptions, I'd rather hear that honestly than get a tidy rule that secretly changes the subject.
reasoning: |-
  Okay, the user is a high school junior grappling with a classic ethical dilemma: the distinction between doing harm and allowing harm. They've presented eight cases with their intuitive judgments, seeking a unifying principle that explains their varied reactions—especially the visceral difference between killing (case 4) and letting die (case 3), and why some omissions feel like active wrongdoing (case 6) while others don’t (case 5).  

  First, I need to validate their approach. It’s impressive they’re systematically testing intuitions against principles—that’s philosophy in action. Their frustration with inconsistent verdicts is understandable; even ethicists debate these nuances. The core tension they’ve identified is real: why do some omissions (like ignoring a drowning) feel murderous, while others (like not donating) feel merely stingy?  

  Their tentative principle—about cost and special claims—is a solid start but cracks under pressure. Case 2 (drowning) breaks the "significant cost" threshold (a towel isn’t costly), yet feels monstrous. Case 1 (concert tickets) involves higher cost but feels permissible to them. Meanwhile, case 6 (allergic reaction) mirrors case 2 structurally but amplifies the "active harm" feeling.  

  I recall Judith Jarvis Thomson’s distinction between negative duties (don’t harm) and positive duties (prevent harm). She’d argue case 6 feels like killing because you’re withholding crucial information in a high-stakes, immediate context—similar to removing a life-saving device. But in case 5 (cheating), the harm is diffuse (academic integrity) and your role isn’t uniquely critical. That explains why silence in case 6 feels active: you’re the *only* barrier to disaster.  

  For cases 3 and 4 (euthanasia), the distinction likely hinges on intention and causation. Letting grandma die by withdrawing treatment (case 3) accepts death as a side effect, while injecting her (case 4) directly causes it. Double effect doctrine captures this: intention matters. Their intuition that 4 feels "meaningfully worse" aligns with many legal/moral systems that treat active euthanasia as graver.  

  Case 8 (not warning about a cheater) is tricky because friendship creates positive duties. Unlike test answers (case 7), where honesty is a duty, here loyalty conflicts with protection. Their torn feeling is spot-on—it’s a true dilemma with no clean answer.  

  Finally, case 1 (charity) reveals their libertarian leanings. They reject stringent positive duties, unlike utilitarians who’d call it a moral failure. That’s okay! Not all philosophies demand self-sacrifice.  

  I’ll synthesize this into a principle centered on *duty strength* and *causal role*, flagging where it challenges their verdicts (like case 1 being "permissible" under their view but "failing" under utilitarianism). For case 8, I’ll admit the principle doesn’t dictate an answer—friendship duties are contextual. Honesty about the messiness feels crucial; oversimplifying would betray their intellectual rigor.
answer: |-
  Your intuition that no simple rule cleanly captures all cases is perceptive—you've stumbled into one of philosophy's thorniest debates (killing vs. letting die, acts vs. omissions). However, a **modified duty-based principle** reconciles most of your verdicts while respecting your core insight about costs and relationships:

  **Principle:**  
  *It is wrong to:  
  (a) Intentionally cause harm, or  
  (b) Allow harm you have a strong duty to prevent,  
  unless the cost of preventing it is excessive relative to the harm and your relationship to the victim.  
  "Strong duties" arise from:  
  - Your role (e.g., lifeguard, doctor),  
  - Your prior actions (e.g., created the threat),  
  - Special relationships (e.g., friend, family), or  
  - Being the uniquely positioned preventer of imminent harm.*

  ---

  ### **Application to Your Cases:**

  1.  **Concert Tickets:**  
      *Verdict upheld.* No strong duty exists (stranger, no role, not uniquely positioned globally). Cost is moderate (significant savings).  
      *Why others disagree:* Utilitarians argue $40 could save a life, creating a universal duty. Your principle rejects this.

  2.  **Drowning Classmate:**  
      *Verdict upheld.* Strong duty: you're uniquely positioned to prevent imminent harm at trivial cost (wet clothes). Relationship (classmate) strengthens duty.

  3.  **Stop Treatment:**  
      *Verdict upheld.* Allowing death via omission. Duty to preserve life is outweighed by cost (prolonged suffering), patient's wishes, and family role.

  4.  **Lethal Injection:**  
      *Verdict upheld.* Worse because it's *active killing* (violates (a)). Intention shifts from "allowing death" to "causing death," heightening moral gravity.

  5.  **Ignoring Cheating:**  
      *Verdict upheld.* Weak duty: you didn't cause it, aren't uniquely positioned (teacher could discover it), cost is low but harm isn't imminent/severe. Cowardly but not equivalent to cheating.

  6.  **Allergic Reaction:**  
      *Verdict upheld.* Strong duty: you're uniquely positioned to prevent imminent, severe harm at near-zero cost. Withholding crucial info is functionally *causing* harm—hence "murder by silence."

  7.  **Refusing Test Answers:**  
      *Verdict upheld.* No duty to enable cheating (might violate academic role). Preventing harm (failing) isn't your obligation—facilitating dishonesty would be wrong.

  8.  **Not Warning About Cheater:**  
      *Principle implies: Permissible omission, but context matters.*  
      - **Duty?** Friendship creates a *prima facie* duty to protect, but not absolute.  
      - **Cost?** Risk of drama/conflict might be moderate.  
      - **Harm Severity?** Emotional harm vs. physical danger (unlike case 6).  
      *Your torn feeling is apt:* Friendship heightens duty, but the cost/harm balance makes it ambiguous. Not obviously wrong like case 6, but potentially disloyal.

  ---

  ### **Why This Works & Required Verdict Changes:**
  - **Killing vs. Letting Die (3 vs. 4):** Clear distinction via clause (a). Actively causing death (injection) is inherently worse than allowing it (stopping treatment).  
  - **6 vs. 5 Difference:** Case 6 has *imminent, severe harm* + *unique position* + *trivial cost*, creating a strong duty. Case 5 lacks imminence/severity/uniqueness.  
  - **Overturned Verdict?** Only if you insist case 1 is *seriously wrong*. Your principle excuses it; utilitarians wouldn't. Stick with your intuition here.  
  - **Case 8 Clarified:** Not a clear duty breach—friendship alone doesn't mandate interference in others' relationships absent severe risk. Your silence is permissible (if cold), but discuss why you feel torn: friendship *amplifies* the moral weight of omissions.

  ---

  ### **The Messy Truth:**
  This principle isn't perfect. "Excessive cost" and "strong duty" require judgment. **Why your intuitions diverge?**  
  - **Psychological Salience:** Acts (pushing, injecting) feel more "agentic" than omissions (not donating, not warning).  
  - **Proximity:** Physical nearness (drowning, sandwich) heightens perceived duty.  
  - **Framing:** "Allowing death" (case 3) vs. "causing death" (case 4) linguistically manipulates intuition.  
  - **Role Morality:** Duties shift with context (friend vs. stranger, student vs. doctor).

  ### **Recommendation:**
  For cases 1 and 8:  
  - **Case 1:** Hold your ground. Unless you embrace extreme altruism, self-interest has moral weight.  
  - **Case 8:** Ask: *"Would I warn her if the partner were dangerous, not just a cheater?"* If yes, your duty isn't about harm-prevention, but loyalty. If loyalty demands speaking up, do so—but it's supererogatory (beyond duty), not obligatory. Your silence isn't evil, but it might strain friendship.

  This framework explains why morality isn't a spreadsheet—it weighs duties, costs, relationships, and intentions in a context-sensitive way. Well done for wrestling with this!
