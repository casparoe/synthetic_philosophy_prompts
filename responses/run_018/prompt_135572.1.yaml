   Therefore, the agent must reject PK. It cannot maintain that every true statement is knowable because ψ is a true statement at time 0 that is not knowable.

   However, the logical induction agent is supposed to learn over time. If it rejects PK, then it does not have to assign probability 1 to ◊Kψ. But the problem is that the agent might try to maintain PK as a principle. We have shown that if it does, then it must assign probability 1 to every logical truth at time 0 to avoid having any true ψ.

