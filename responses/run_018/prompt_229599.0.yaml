  The philosophical core is the nature of authenticity and value in art. Goodman's point is that in painting, authenticity is tied to the object's history, unlike in music where a score allows multiple authentic performances. The education curator counters that aesthetic experience isn't dependent on knowing that history. This debate between intrinsic versus contextual value is central.

