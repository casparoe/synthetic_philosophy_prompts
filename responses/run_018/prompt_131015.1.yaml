prompt: |-
  I sit on our uni's research integrity committee and we've got a weird case that feels like a Twin Earth situation applied to institutional knowledge. There's a decade-long study running in a sealed biosphere dome where participants developed their own chemical taxonomy — they call the clear liquid 'water' but it's actualy H2O2-based, and they call crystals 'salt' but it's a different ionic compound. The PI argues that for the study's mental-state recordings and internal coherence, the meaning of these terms is fixed by usage inside the dome (like twater in the classic case), not by outside chemistry. Our funding partner says we should either force them to relabel all data to match standard chemistry or pull the grant. I need a short memo for thursday's vote reccomending approve-with-conditions, reject, or keep-as-is, with reasoning that takes the PI's point seriously but lands on something concrete the board can act on. Don't need citations or a reading list — just the argument and the bottom line, including the strongest reason the losing side has.
reasoning: |-
