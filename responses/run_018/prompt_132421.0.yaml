  ### Decomposed Credence  
  **Overall claim:** Liberal neutrality as coherent design constraint for AGI value alignment (probability: **0.005**)  

  #### Term Probabilities:  
  (i) **0.3** – Conceptual coherence in state institutions doesn’t guarantee applicability to AGI; engineered systems with fixed objective functions lack the interpretative flexibility of human institutions, risking distortion when neutrality is mechanized.  
  (ii) **0.25** – A non-vacuous "thin" conception (e.g., primary goods) is unlikely; attempts like basic welfare metrics invariably embed contestable assumptions (e.g., autonomy bias) when operationalized, collapsing into disguised thick commitments.  
  (iii) **0.4** – Social-choice mechanisms *can* mitigate bias but not eliminate it; modified Borda counts/veto protocols reduce majoritarian dominance yet remain vulnerable to culturally skewed input data or procedural blind spots.  
  (iv) **0.15** – The procedural-substantive distinction collapses under formalization; specifying arbitration rules (e.g., for resolving conflicts) inevitably encodes substantive priorities, eroding neutrality’s coherence.  

  **Arithmetic:**  
  Combined as multiplicative probability (assuming independence):  
  0.3 × 0.25 × 0.4 × 0.15 = **0.0045** ≈ **0.005**  

  #### Weight Analysis  
  **Most influential term: (iv)** (procedural-substantive stability).  
  **Shift catalyst:** A formal proof demonstrating that *any* arbitration rule satisfying minimal fairness axioms (e.g., non-dictatorship, consistency) **must** violate neutrality by privileging a moral framework (e.g., showing neutrality implies logical inconsistency à la Arrow’s theorem for ethics). Empirical evidence of irreducible bias in rule-based conflict resolution (e.g., in algorithmic mediation of human rights disputes) would also drastically lower (iv).  

  ---  

  ### Aggregation Framework Tiers  
  **S-tier:** Robust neutrality without relativism/majoritarianism.  
  **A-tier:** Strong approximation with minor flaws.  
  **B-tier:** Partial success but significant trade-offs.  
  **C-tier:** Fundamental instability or bias.  

  #### Rankings:  
  1. **Constitutional pluralism with entrenched minority vetoes → A-tier**  
     *Balances group-specific autonomy via vetoes but risks institutional paralysis or strategic veto abuse, weakly containing majoritarianism while avoiding relativism through procedural rigidity.*  
  2. **Reflective equilibrium trained over diverse preference distributions → B-tier**  
     *Simulates coherence across inputs yet inherits biases from training data/distributions, often converging on dominant norms under optimization pressures.*  
  3. **Real-time democratic deliberation with algorithmic mediation → C-tier**  
     *Amplifies majoritarian preferences through engagement metrics and urgency bias, with algorithmic mediation masking substantive prioritization under procedural veneer.*  

  ---  
  **Summary Logic:** The core fragility lies in formalization (iv), which dissolves neutrality’s conceptual scaffolding. While aggregation tools (iii) offer pragmatic hope, they cannot resolve the incoherence exposed by (iv) or the absence of a non-arbitrary thin theory (ii). Engineering constraints (i) further preclude direct institutional analogies.
