            - Level 1: each knows the other is rational. Then they know the other will not play 4 (because 4 is dominated by 3). So they restrict to the reduced game without 4. Then in the reduced game, Player2 knows that Player1 is rational, so Player1 will not play 3 in the reduced game? In the reduced game (without 4), Player1 has 2 and 3. In this reduced game, Player1: 
                  against Player2's actions 2 and 3:
                    2: (2,4) -> wait, in the reduced game we have:

                          Player2
                               2     3
                          Player1
                            2   2,2   4,0
                            3   0,4   3,3

                    Player1: 
                      2: min(2,4)=2? or expected? We need to assume they play safe or what? 

            - Actually, at level 1: they know the other is rational, so they know the other has eliminated 4. Then in the reduced game, Player1 sees that if Player2 plays 2, then 2 is better (2>0); if Player2 plays 3, then 4>3. So 2 is dominant for Player1 in the reduced game? 
            - Player2, knowing Player1 is rational, knows that Player1 will play 2 (because in the reduced game, 2 is dominant for Player1). Then Player2 will play 2 (because against Player1's 2, Player2 gets 2 by playing 2 and 0 by playing 3).

          So even with level 1 knowledge, we get (2,2).

          This is not working to show the difference.

     - **We return to the Battle of the Sexes with a pre-play announcement.**

          Game:

          ```
                  O     F
              O  2,1   0,0
              F  0,0   1,2
          ```

          Two Nash equilibria: (O,O) and (F,F).

          Suppose we want to coordinate on (O,O) because it has a higher social welfare (3 vs 3? wait, 2+1=3, 1+2=3) but Player1 prefers (O,O) and Player2 prefers (F,F).

          Without communication, they might miscoordinate. 

          Now, suppose there is a public announcement: "Both players are rational."

          - Level 0: They know the other is rational. 
              - Player1: if Player2 is rational, she will play F? because in the absence of knowledge about me, she might think I play O or F arbitrarily. But in the equilibrium (F,F), Player2 gets 2, which is better than 1 in (O,O). So Player2 will play F. But then Player1, knowing that, will play F.
              - So they play (F,F).

          - But what if we have common knowledge of rationality? does that change? 
              - It doesn't: in both equilibria, players are rational. Common knowledge of rationality does not force a particular equilibrium.

          This is not helpful.

     - **We need a game where the only equilibrium that survives common knowledge of rationality is different from what might be played with finite mutual knowledge.**

          Such games are those with iterated dominated strategies that require many levels of knowledge.

          Given the time, we will use the Traveler's Dilemma with continuous action space and explain the intuition:

          - If there is common knowledge of rationality, then players will keep undercutting until they reach the bottom.
          - If there is only level k mutual knowledge, then they will undercut only k times, so they might stop at 100 - k.

          But for a seminar, we can use a discrete version with 5 numbers: 2,3,4,5,6 and R=2.

          We compute the matrix (large) and then show the iterated dominance. We then relate the number of iterations to the level of mutual knowledge.

          This will be the example.

          **Worked Example: Traveler's Dilemma with actions {2,3,4,5,6} and R=2.**

          We will compute the dominated strategies step by step and show that each level of mutual knowledge allows one more round of elimination.

          - Level 0: no mutual knowledge, so no elimination.
          - Level 1: mutual knowledge of rationality -> we can do one round of elimination: remove 6 (because it is dominated by 5).
          - Level 2: mutual knowledge up to level 2 -> we can do a second round: remove 5.
          - ... until we reach (2,2).

          We stop at level 4 to get to 2.

          The gap: if we have only level 3 mutual knowledge, then we stop at 3, so both play 3. But with common knowledge, they play 2.

          This is vivid.

          **Why this example works:**
            - It has a clear gap between finite mutual knowledge (which stops at a certain level) and common knowledge (which goes all the way).
            - It has a concrete payoff consequence: at level 3 knowledge, they get 3 each; at common knowledge, they get 2 each. So common knowledge makes them worse off.

          **What it lacks:**
            - It is a bit computational. We have to do the dominance steps.
            - It might be new to students.

          We'll use it.

  5. **Addressing Misconceptions (throughout the example)**
     - **Misconception 1**: Treating "everyone knows that everyone knows ... (k times)" as sufficient, and that common knowledge is just a long finite list.
       - **When to address**: When we do the step-by-step elimination in the Traveler's Dilemma, we stop at level k and get action 6-k. We then say: what if k is 100? But our game only goes down to 2. In a game with actions up to 100, we would need 98 levels to get to 2. But common knowledge is not 98 levels, it is all levels. And it is a fixed point: it is self-referential. We can illustrate with the Muddy Children that even if the father asks 100 times and the children say "no" 100 times, if there are 101 muddy children, they still wouldn't know. Only when the number of "no"s matches the number of muddy children do they know. In our game, common knowledge (infinite) is what drives to 2, not just a large finite level.

     - **Misconception 2**: A public announcement that tells everyone something they already individually knew cannot change what anyone knows.
       - **When to address**: Use the Muddy Children example. Each child knew that there was at least one muddy child (because they could see at least one) before the father spoke. But after the public announcement, this became common knowledge, and that changed the iterated knowledge. In the game, before any announcement, each player might know that the other is rational (because they are in a philosophy and economics class!) but without common knowledge, they might not be sure that the other knows that they know.

     - **Misconception 3**: Common knowledge is impossible because it requires an infinite regress.
       - **When to address**: When defining common knowledge, explain that it is a fixed point and can be achieved by a public announcement. In games, we often assume common knowledge of the rules and of rationality as an idealization.

  6. **Closing Check (10 minutes)**
     - Pose a new, quick puzzle: 
          - "Two players play a game where they must each guess a number between 1 and 10. The one who guesses the lower number wins that number in dollars, but if they tie, they get nothing. However, there is a penalty: if the numbers are different, the player who guessed the higher number loses that number in dollars. What do they play if there is common knowledge of rationality?"
          - This is the Traveler's Dilemma! They should say 1 (or 2 if the range is 1 to 10 and R is the difference? Let's not use this).

     - Instead, use a simple coordination game with a twist. Or ask them to explain in their own words why in the Traveler's Dilemma, common knowledge of rationality leads to (2,2) but if there is only mutual knowledge up to level 1, they might play 5 and 6? 

     - Better: Give them a very small Traveler's Dilemma with actions {3,4,5} and R=2, and ask them to compute the outcome under level 1 mutual knowledge and then under common knowledge.

     - Solution for {3,4,5} and R=2:
          Matrix:
            3: (3, 5,1, 5,1) -> wait, let's build:

            ```
            P2\P1   3      4      5
            3     3,3    5,1    5,1
            4     1,5    4,4    6,2
            5     1,5    2,6    5,5
            ```

          - First, is there a dominated strategy?
            - For P1: 
                  3: 3,5,5
                  4: 1,4,6
                  5: 1,2,5
              5 is dominated by 3 (because 5>1, 5>2, 5=5) -> no, 5 is not dominated by 3: at P2=5, 5=5.
              Actually, 5 is dominated by 4? 4: 1,4,6; 5: 1,2,5 -> 1=1, 4>2, 6>5 -> yes, 4 dominates 5.
            - Eliminate 5.
          - Reduced game:
                3: 3,5
                4: 1,4
            - For P2 in the reduced game:
                 3: 3,1 -> wait, when P1 plays 3, P2: 3 (if P2=3) or 5 (if P2=4) -> no, the matrix for P2 when playing 3 or 4 is:
                   When P2 plays 3: gets 3 (if P1=3) or 1 (if P1=4)
                   When P2 plays 4: gets 1 (if P1=3) or 4 (if P1=4)
                   When P2 plays 5: we've eliminated.
            - So for P2:
                  if P1 plays 3: P2 gets 3 (if play 3) or 1 (if play 4) -> so 3>1.
                  if P1 plays 4: P2 gets 5 (if play 3) -> wait, no: in the reduced game, P2 only has 3 and 4? 
            - Actually, after P1 eliminates 5, we have:

                   P1\P2   3     4
                   3      3,3   5,1
                   4      1,5   4,4   [but wait, when P1=4 and P2=3, then P1 played 4 and P2 played 3 -> lower is 3, so P1 gets 3-2=1, P2 gets 3+2=5. Similarly, P1=4, P2=4: both get 4.]

            - So matrix for reduced game:

                   P2
                       3       4
                  3   3,3     5,1
              P1 
                  4   1,5     4,4

            - Now for P2: 
                  if P1 plays 3: 3 vs 1 -> 3 better.
                  if P1 plays 4: 5 vs 4 -> 5 better.
                  So no dominance for P2.

            - For P1:
                  if P2 plays 3: 3 vs 1 -> 3 better.
                  if P2 plays 4: 5 vs 4 -> 5 better.
                  So no dominance.

          - This is not dominance solvable beyond the first step.

          So in level 1 mutual knowledge, we only eliminate 5, and then the players might randomize or something? 

          This is not working.

     - **Instead, use a different closing check: Ask students to write down the condition for common knowledge of an event E in their own words, and then explain why in the Traveler's Dilemma, common knowledge of rationality leads to the IEDS outcome while mutual knowledge of level k only leads to k steps of IEDS.**

  7. **What to Leave Out**
     - State-space models of knowledge (Kripke structures).
     - The complete formal definition of common knowledge via the fixed point (E is common knowledge if everyone knows E and everyone knows that E is common knowledge).
     - The electronic mail game and games of incomplete information.
     - The difference between rationalizability and IEDS. We focus on IEDS because it is iterative and directly relates to levels of knowledge.

     - Tell students: "We are leaving out the full formal apparatus of epistemic logic, which you might see in a more advanced course. We are also not discussing the difference between common knowledge and common belief."

  8. **Anchoring in a Concrete Payoff**
     - Throughout the Traveler's Dilemma example, we show that with common knowledge of rationality, the payoff is 2 each, but with only level 3 knowledge in a game with actions up to 6, they would get 3 each. This is a clear payoff difference.

  Plan Timing:

  - Introduction: 10 minutes
  - Knowledge operators and mutual knowledge: 15 minutes
  - Common knowledge definition: 15 minutes
  - Worked example (Traveler's Dilemma with actions 2-6, step-by-step): 40 minutes
  - Addressing misconceptions during the example: woven in
  - Closing check: 10 minutes
  - Wrap-up and what's left out: 10 minutes

  Total: 100 minutes.

  We have 20 minutes buffer for questions and slower pace.

  Let's hope the example works.
answer: |-
  ### Teaching Plan: Common Knowledge of Rationality in Game Theory

  #### **Total Time:** 2 hours  
  **Target Audience:** Strong first-year philosophy/economics undergraduates with basic game theory (Nash equilibrium computation) but no prior epistemic game theory.  
  **Core Goal:** Distinguish "common knowledge of rationality" (CKR) from finite mutual knowledge, showing how CKR’s fixed-point structure enables stronger inferences about behavior.

  ---

  ### **1. Introduction & Rationality Recap (10 min)**  
  - **Components:**  
    - Review rationality: Players maximize expected utility given beliefs.  
    - Recap Nash equilibrium (NE): No player wants to unilaterally deviate.  
  - **Why now?**  
    - Establishes baseline rationality. Students must see that rationality alone doesn’t resolve all games (e.g., coordination games with multiple NE).  
  - **Anchoring payoff:** Use the **Stag Hunt game** to show how rationality alone doesn’t guarantee the Pareto-efficient outcome.  

  ---

  ### **2. Introducing Knowledge Operators (20 min)**  
  - **Components (order matters):**  
    1. **Individual knowledge:** "Player 1 knows event E" (e.g., "Player 1 knows the payoffs").  
    2. **Mutual knowledge:** "Everyone knows E" (e.g., "Both know the payoffs").  
    3. **Iterated mutual knowledge:**  
       - Level 1: Everyone knows E.  
       - Level 2: Everyone knows that everyone knows E.  
       - Level *k*: *k*-fold iteration.  
  - **Why now?**  
    - Students need to grasp *iterated knowledge* before common knowledge. Without this, they cannot see why "E is true" ≠ "E is known by all" ≠ "E is common knowledge."  
  - **Misconception addressed:**  
    - *"Level 2 is just two people knowing E"* → Clarify that Level 2 requires each to know the *other knows E*, not just that E is true.  

  ---

  ### **3. Defining Common Knowledge (15 min)**  
  - **Components:**  
    - **Common knowledge (CK):** E is CK if:  
      - Everyone knows E (Level 1),  
      - Everyone knows that everyone knows E (Level 2),  
      - ... and so on *ad infinitum*.  
    - **Fixed-point analogy:** "E is CK" implies everyone knows E *and* everyone knows that E is CK.  
  - **Why now?**  
    - CK must be defined *before* CKR to highlight its recursive nature. Without this, students conflate CKR with Level 1 or 2 ("everyone is rational" vs. "everyone knows everyone is rational").  
  - **Misconception addressed:**  
    - *"CK is just a long finite list"* → Emphasize infinity as a *fixed point* (not stopping at *k*), using analogies (e.g., "everyone knows the traffic light is red" enabling coordinated stopping).  

  ---

  ### **4. Worked Example: The Traveler’s Dilemma (40 min)**  
  - **Game setup (Basu, 1994):**  
    - Two players claim a value ∈ {2, 3, ..., 100}.  
    - Payoff: Lower claim *x* gets *x* + *R*, higher claim gets *x* − *R* (*R* = 2). Ties yield *x*.  
    - **Key properties for the example:**  
      - *Must have:* Iterated strict dominance. Strategy 100 is dominated by 99, then 99 by 98, ..., down to 2.  
      - *Must lack:* A first-round dominant strategy. Rationality alone doesn’t dictate 2; mutual knowledge depth matters.  
  - **Why this example?**  
    - **Vivid gap:**  
      - **Finite mutual knowledge (Level *k*):** Players eliminate strategies *k* times. At Level 1, they avoid 100 but play 99–98. At Level 2, avoid 99–98 but play 97–96, etc.  
      - **CKR:** Infinite iteration → converge to (2, 2), the unique NE.  
    - **Payoff consequence:** At Level 1, payoffs ≈99–98 (high); under CKR, payoffs = 2 (low). CK changes outcomes!  
  - **Misconception addressed:**  
    - *"Public announcements of rationality don’t help if players already know it"* → Show that a public announcement *creates* CK (like the father in Muddy Children), enabling infinite iteration. Without it, players stop at finite *k*.  

  ---

  ### **5. Contrasting CKR vs. Mutual Knowledge (15 min)**  
  - **Activity:** Use Traveler’s Dilemma to simulate:  
    - Scenario 1: "Everyone is rational" (Level 1). Outcome: Play ~99.  
    - Scenario 2: "Everyone knows everyone is rational" (Level 2). Outcome: Play ~97.  
    - Scenario 3: CKR. Outcome: Play 2.  
  - **Why now?**  
    - After the example, students see CKR’s practical effect: It drives iterated dominance to completion.  
  - **Anchoring payoff:** Stress that CKR isn’t just "more knowledge"—it alters inferences and payoffs. In Stag Hunt, CKR might coordinate on Pareto-efficient NE; finite knowledge risks coordination failure.  

  ---

  ### **6. Addressing Predictable Misconceptions (15 min)**  
  - **Misconception 1:** *"Level 10 is the same as CK."*  
    - **When/How:** After defining iterated knowledge (Section 2). Use Traveler’s Dilemma: Level 10 → play 90; CK → play 2.  
  - **Misconception 2:** *"Public announcements of known facts don’t change behavior."*  
    - **When/How:** During CK definition (Section 3). Use a **public goods game**: If "all are rational" is announced publicly, CK triggers Nash play; silent mutual knowledge may not.  
  - **Misconception 3:** *"CKR always leads to Pareto-inferior outcomes."*  
    - **When/How:** After Traveler’s Dilemma (Section 5). Contrast with **Stag Hunt**: CKR may enable Pareto-superior coordination.  

  ---

  ### **7. Closing Check: Did the Idea Land? (10 min)**  
  - **Task (not a definition repeat):** Pose the **"2-Player 100-Dice Game"**:  
    - Players guess a number ∈ {1, ..., 100}.  
    - Payoff: Higher guess wins it in dollars, but if guesses differ, the *lower* guesser gets their guess + 2.  
    - **Question:** *"What do you play under CKR? What under Level 1 mutual knowledge? Why?"*  
  - **Success metric:**  
    - Correct: CKR → 1 (iterated dominance); Level 1 → ~99.  
    - Deep understanding: Explains *why* CK enables infinite iteration ("I can infer they infer I infer...").  

  ---

  ### **8. Deliberate Omissions & Next Steps (5 min)**  
  - **Leave out (explicitly state):**  
    - Kripke semantics/possible worlds.  
    - Common *p*-belief (probabilistic generalizations).  
    - Epistemic conditions for Nash equilibrium (beyond rationality).  
  - **Reason:** Focus on CK’s fixed-point intuition and behavioral impact. Advanced topics require more formalism.  
  - **Final note:** "CKR is a tool, not a panacea. It explains *how* we reason to equilibrium, but real players may lack CK."  

  ---

  ### **Why This Sequence?**  
  - **Conceptual dependencies:** Knowledge operators → CK → CKR. Without CK’s fixed-point definition, students cannot see why "Level *k* ≠ CK" or how CK enables novel inferences.  
  - **Example design:** Traveler’s Dilemma makes the CK/mutual knowledge gap *payoff-relevant* and *computable*. Its lack of a first-round dominant strategy forces dependence on knowledge depth.  
  - **Anchored payoff:** Traveler’s Dilemma and Stag Hunt show CKR’s real-world stakes—better coordination or (paradoxically) worse outcomes.
