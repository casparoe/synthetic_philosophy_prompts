  | **Masada**           | Total military defeat, annihilation       | Ultimate defiance/martyrdom; Foundational myth of resistance & national identity (Israel)     | **Yes (Archetype)**              | Focus on finality, suicide as ultimate act of defiance. |
  | **Kosovo**           | Military defeat initiating centuries of political subjugation | Sacred sacrifice, divine destiny ("Heavenly Kingdom"); Sustained identity/resistance during oppression | **Partial (Unique)**             | Focus on *ongoing* subjugation & future redemption through martyrdom; fuels long-term resistance. |
  | **Dunkirk**          | Tactical/strategic success (evacuation) within larger strategic defeat | Communal resilience, "miracle" of survival; Defined "Dunkirk spirit" for national morale during ongoing war | **No**                           | **Not a defeat of the cause;** Celebrates survival *within* a defeat, not defeat itself. Strategic success. |
  | **Confederate Lost Cause** | Total military defeat, dissolution of polity | Noble struggle for "states' rights"/way of life against impossible odds; Salvaged Southern pride, justified segregation, obscured slavery | **Yes (Definitive)**             | Actively revisionist; explicitly constructed to legitimize post-war racial/social hierarchy; deliberate historical falsification. |
