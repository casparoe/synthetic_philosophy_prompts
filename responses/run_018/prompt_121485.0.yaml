answer: |-
  Here’s a structured 1,200-word research proposal addressing your specifications, designed for a generalist philosophy panel with a political theory focus. Citations are omitted per your request, and placeholder markers indicate where you might insert your own references.

  ---

  ### **Research Proposal: Diagnosing Bad Faith – A Taxonomy for Polarized Discourse**  
  **Duration:** 12 months  

  #### **1. Central Research Question**  
  *What are the necessary and sufficient conditions for distinguishing four distinct failures colloquially grouped under "arguing in bad faith," and to which of these failures are echo chambers most causally relevant?*  

  - **Determinate Answer**: The project succeeds if it demonstrates that:  
    (i) The four failures exhibit *non-overlapping diagnostic criteria* (e.g., behavioral markers, psychological dispositions),  
    (ii) They demand *unique remedial interventions*, and  
    (iii) Echo chambers primarily amplify *asymmetric standards* (Failure 3) and *misdirected aim* (Failure 4), not insincerity (Failure 1).  
  - **Why this framing?** It avoids topic vagueness by testing a specific hypothesis: if all failures shared diagnostics/remedies or echo chambers produced all equally, the taxonomy would collapse. Success requires empirical falsifiability *in principle* (e.g., "If symmetric remedial responses resolved all failures, the distinction would be inert").  

  #### **2. Rival Framings and Their Limitations**  
  **(a) The Symmetry Worry**  
  *Rival View*: Symmetric accusations ("Both sides do it") imply that bad-faith attributions are epistemically bankrupt, akin to persistent peer disagreement where neither side can claim superior rationality.  
  *Why Open?* Symmetry does not entail epistemic equivalence. Accusations may be *accurate* but *asymmetrically distributed* (e.g., one group exhibits Failure 3 disproportionately due to structural incentives). Crucially, symmetry arguments conflate *origins* of belief (e.g., identity protection) with *responsiveness to counterevidence*.  
  *Breaking Symmetry*: Evidence must isolate *differential responsiveness*:  
  - Cross-partisan experiments testing adherence to fixed standards when conclusions shift valence.  
  - Historical cases where identical evidence was accepted/rejected by a group based on changing partisan stakes.  

  **(b) Refinement vs. Rationalization**  
  *Rival View*: Raising standards for inconvenient conclusions may reflect principled refinement (e.g., scrutinizing weak evidence supporting deeply held values).  
  *Why Open?* The baseline proposal—using prior statements under reversed partisan valence as a diagnostic—appears circular: it assumes that past standards were applied neutrally.  
  *Pressure Test*: This move avoids begging the question if:  
  - Past statements were made *before* current identity-incentives existed,  
  - Consistency is tracked *within individual reasoning patterns* (not group averages),  
  - Supported by *procedural* evidence (e.g., effort to seek counterevidence when convenient).  
  *Limit*: It remains interpretive but can be triangulated with behavioral data (e.g., time spent evaluating evidence of opposing valence).  

  #### **3. Methodology: Four Work Packages**  
  **WP1: Taxonomy & Adequacy Conditions (Months 1–3)**  
  - Define the four failures via conceptual analysis:  
    - *Insincerity*: Assertion-belief discordance + strategic intent.  
    - *Etiological failure*: Belief-evidence coherence + causal detachment from cited evidence.  
    - *Asymmetric standards*: Variable evidence thresholds correlated with conclusion valence.  
    - *Misdirected aim*: Sincerity + evidence-coherence + dominance of competitive over truth-seeking goals.  
  - **Adequacy Test**: Each must generate unique predictions (e.g., insincerity predicts evasion under interrogation; asymmetric standards predict selective rigor).  

  **WP2: Epistemology of Attribution (Months 4–6)**  
  - Analyze symmetry and baseline proposals (§2) using formal argument mapping.  
  - Develop criteria for warranting accusations (e.g., "Accusations of Failure 3 require demonstrating *repeated* standard-shifting across valences").  
  - *Deliverable*: A decision tree for attributing failures without psychologizing.  

  **WP3: Echo Chambers & Institutional Remedies (Months 7–9)**  
  - Argue echo chambers exacerbate Failures 3–4 via:  
    - *Informational mechanism*: Isolation from corrective evidence → exacerbates Failure 2.  
    - *Incentive mechanism*: Audience rewards for loyalty → drives Failures 3–4.  
  - Propose *valence-blind procedures* (e.g., pre-commit to evidence standards before case assignment; anonymized debate formats).  
  - **Limits**: Valence-blindness cannot resolve insincerity (Failure 1) and may impede identity-related testimony.  

  **WP4: Normative Upshot (Months 10–12)**  
  - Derive institutional principles:  
    - Failures 1–2 → epistemic interventions (e.g., transparency).  
    - Failures 3–4 → structural interventions (e.g., deliberation rules that reward truth-tracking over "winning").  
  - Critique "sincerity-focused" remedies (e.g., fact-checking) as ineffective for dominant failures.  

  #### **4. Deliverables**  
  - **Three Journal Articles**:  
    1. *Philosophical Quarterly*: Taxonomy and adequacy conditions (§WP1–WP2).  
    2. *Journal of Political Philosophy*: Echo chambers and valence-blind solutions (§WP3).  
    3. *Ethics*: Normative implications for democratic discourse (§WP4).  
  - **Practitioner Diagnostic**: A 10-page guide for mediators/educators, operationalizing the taxonomy to identify failure types and match interventions.  
  - **Feasibility**: This output aligns with standard 12-month fellowships (e.g., 1 article drafted pre-fellowship; 2 developed during).  

  #### **5. Failure Modes**  
  - **Taxonomic Collapse**: All failures reduce to one mechanism (e.g., audience incentives). *Mitigation*: Test diagnostics for mutual exclusivity.  
  - **Refinement/Rationalization Inseparability**: No principled way to distinguish them. *Mitigation*: Use "temporal baselines" only where incentives are stable.  
  - **Symmetry Argument Holds**: All accusations *are* epistemically tainted. *Mitigation*: Show symmetry is a downstream effect of Failures 3–4.  
  - **Institutional Inertia**: Identical remedies for all failures (e.g., dialogue alone). *Mitigation*: Design failure-specific interventions in WP3.  
  - **New Failure Mode**: *Diagnostic Overlap* (e.g., asymmetric standards always co-occur with misdirected aim). *Response*: Treat them as a composite failure with hybrid remedies.  

  #### **6. Scope and Disciplinary Grounding**  
  - **Scope Management**:  
    - Highest-risk expansion: WP2 (epistemology) may require deeper engagement with disagreement literatures.  
    - **Cut if needed**: Narrow WP3’s empirical examples to 2–3 paradigmatic cases (e.g., climate change denial, vaccine skepticism) to save 1–2 months.  
  - **Philosophy vs. Social Psychology**:  
    > This project is *conceptual* and *normative*, not empirical. It asks: What *constitutes* bad faith? When *should* we attribute it? What *follows* for democratic theory? While social psychology examines *how* biases operate, philosophy analyzes their *normative significance*—e.g., whether asymmetric standards violate deliberative ideals of reciprocity. Crucially, **no empirical measurement of "real" bad faith** occurs; the aim is to refine the *framework* for evaluating discourse. The value for political theory lies in reorienting institutional design: if echo chambers primarily distort aims/standards (not sincerity), remedies must target incentive structures, not individual virtue.  

  ---  

  **Word Count**: ~1,180 words  
  **Strengths**: Focuses on conceptual innovation, addresses panel interests (political theory via institutional design), and preempts methodology/scope concerns. Let me know if you’d like adjustments to emphasis or structure.
