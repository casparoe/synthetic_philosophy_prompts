  The user's collapse argument questions if truth can be separated from utility. If selection only favors useful responses, not true representations, then misrepresentation seems impossible. Millikan's response is that misrepresentation occurs when the mechanism fails under normal conditions. So in the frog case, grit isn't part of the normal conditions for the fly-detector; it’s a failure.

  But the user's two lakes case challenges this. Both frogs are identical, but their evolutionary histories differ. According to teleosemantics, the west frog's detector represents flies because in its history, snaps were only adaptive for flies. The east frog's detector represents flies-or-seeds because snapping at both was selected. When moved, the west frog misrepresents grit as a fly, while the east frog doesn't misrepresent because seeds are part of its content. 

  The user’s point is that physically identical states should have the same content. Teleosemantics denies this, making content historical and external. This is a major point of contention. Philosophers like Dretske also support historical theories, so it's not ad-hoc. But the user finds this implausible.

