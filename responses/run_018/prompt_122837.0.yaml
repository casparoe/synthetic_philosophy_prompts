  The user might benefit from knowing that this is an ongoing debate. Their argument is valid against internalism, but teleosemantics is intentionally externalist. The theory's survival hinges on accepting historical properties as real. If they find that unacceptable, then teleosemantics fails for them, but it's not universally dismissed.
answer: |-
  You've hit on one of the most contentious debates in philosophy of mind – and your collapse argument targets a genuine vulnerability in teleosemantics. Your friend's appeal to "normal conditions" *is* the standard defense, but whether it fully resolves the problem is hotly disputed. Let's break this down systematically:

  ### 1. Your Collapse Argument & the "Normal Conditions" Defense
  - **Your Core Insight is Valid:** You're right that natural selection optimizes for *fitness-conducive behavior*, not truth. Teleosemantics (Millikan, Papineau) *must* bridge the gap between "was useful" and "represents truthfully," and this is notoriously difficult.
  - **The "Normal Conditions" Move Isn't *Just* a Dodge:** Millikan explicitly defines "normal conditions" as the *specific set of conditions* under which the mechanism *historically performed its proper function* and was selected *for* doing so. Misrepresentation occurs when:
      - The mechanism is tokened (e.g., the fly-detector fires).
      - BUT the conditions are *not* normal (e.g., there's grit, not a fly).
      - AND the failure occurs *because* the condition isn't normal (grit lacks the properties flies had that made detection fitness-enhancing under normal conditions).
  - **Why It's Not *Fully* Satisfying (Your "Dodge" Intuition):** The definition of "normal conditions" is **parasitic on historical function**. It's *defined* as "the conditions present when the mechanism did what it was selected for." This feels circular: "Content is what it represents successfully under normal conditions, and normal conditions are those where it represents successfully." Critics (like Fodor, Sterelny) argue it smuggles in intentionality/normativity rather than naturalizing it from scratch. Your annoyance is shared by many philosophers.

  ### 2. Your Two Lakes Scenario & the Historical Commitment
  - **Teleosemantics *Is* Deeply Historical & Externalist:** Your analysis is spot-on. According to strict Millikan-style teleosemantics:
      - **West Lake Frog (original population):** The mechanism's proper function is to detect *flies*. Its content is FLY (or SMALL DARK MOVING FLY-SHAPED OBJECT). Snapping at grit *is* a misrepresentation because grit wasn't part of the historical conditions under which snapping was selected *for* fly-catching success. Seeds are irrelevant noise.
      - **East Lake Frog (original population):** The mechanism's proper function is to detect *nutritious small dark moving things* (flies *or* seeds). Its content is NUTRITIOUS SMALL DARK MOVING THING. Snapping at grit *is* misrepresentation (grit isn't nutritious). Snapping at a seed is *correct* representation.
  - **The Transplant Consequence:** After transplanting identical frogs:
      - **West Frog (now in East Lake):** Still has the *proper function* FLY. When it snaps at a seed, it *misrepresents* it as a fly. When it snaps at grit, it misrepresents it as a fly.
      - **East Frog (now in West Lake):** Still has the *proper function* NUTRITIOUS SMALL DARK MOVING THING. When it snaps at a fly, correct. When it snaps at grit, misrepresentation (grit isn't nutritious). **Crucially, when it snaps at a seed (now absent in West Lake), it *correctly* represents it as a nutritious thing, even though snapping provides no benefit (seeds are gone).**
  - **The "Insane" Commitment:** Yes, teleosemantics *is* committed to the molecule-for-molecule identical frogs *literally representing different things* solely due to their distinct evolutionary histories. Content supervenes on historical context + current physical state, not *just* current physical state.

  ### 3. Is This "Game Over"? The Philosophical Divide
  This is where philosophers split:
  *   **Proponents (Millikan, Neander, Papineau):** Argue this historical externalism is a *feature*, not a bug. Biology *is* historical. What a heart *is* (a pump) depends on its selection history, not just its current structure. Why should minds be different? The frog's state has the content it does *because* of what it was *for* in its lineage. Calling it "insane" just reveals an internalist bias.
  *   **Critics (Fodor, Sterelny, yourself):** Argue this makes content:
      *   **Epistemically inaccessible:** The frog (or even a scientist measuring it) can't know what it represents without knowing its deep ancestry.
      *   **Causally irrelevant:** What drives the frog *now* is its current state and environment, not its history. History explains *why* the state exists, not what it *does* now.
      *   **Intuitively implausible:** Two identical frogs in identical states, performing identical behaviors in response to identical stimuli, seem to be thinking/representing the *same* thing.
  *   **The "Game Over" Question:** It's not universally seen as fatal defeat, but it *is* a major cost. Many find it deeply counterintuitive. Teleosemantics survives *only if* you accept this radical historical externalism. This is why alternative naturalist theories (e.g., Fodor's asymmetric dependence, Cummins' functional role) exist.

  ### Who's "Right"? A Verdict (of sorts)

  1.  **Your Collapse Argument:** Hits a major challenge. "Normal conditions" provides *an* answer within the theory, but whether it fully avoids circularity or successfully naturalizes "truth" without residue is **highly contested**. Your argument is *not* attacking a strawman; it targets the core tension.
  2.  **Your Two Lakes Scenario:** Brilliantly exposes the **inescapable historical externalism** of strict Millikan-style teleosemantics. Your intuition that this consequence is problematic is widely shared.
  3.  **Your Friend's Defense:** He's correctly articulating the *standard teleosemantic response* ("normal conditions" and historical function). However, he hasn't addressed the deep philosophical unease the theory generates, especially the consequence you highlight.

  **Conclusion:** Neither of you is definitively "wrong" about the *structure* of teleosemantics. Your friend describes the theory accurately; you accurately identify its most controversial implications. **The real disagreement is whether those implications are acceptable.** Teleosemantics survives *if* you swallow the historical externalist pill. It collapses *if* you believe content must be determined by current intrinsic/synchronic properties or find the historical consequences intolerable. Your annoyance is justified – this is a fundamental philosophical rift with no easy resolution. The debate is alive precisely because both sides have powerful points.
