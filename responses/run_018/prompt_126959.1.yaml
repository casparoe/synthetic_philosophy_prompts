  First, I need to brainstorm analogies. Two come to mind: one with racial asymmetry as in Hofstadter's example, and another with ableist language. For racial asymmetry, defending "white" as a default sounds unacceptable, unlike "he" as generic. For ableist language, using "able-bodied" as the norm and specifying disabilities highlights the same asymmetry. The key difference here might be social power structures, but the pattern is similar.

  Next, established concepts nearby: markedness (unmarked forms are default), status quo bias (preferring existing states), motte-and-bailey (switching between defensible and controversial claims), and false analogy (inaccurate comparisons). But the user's phenomenon is specific: the defense's persistence due to familiarity, not the analogy being false.

  The core issue is that the gendered default's familiarity makes the asymmetry invisible. When transposed to race, the defense crumbles because the racial default's asymmetry is socially recognized. The difference is historical/social context, not structure.

  Is there a term? Feminist linguistics might have something. Concepts like "male generic" or "invisible norm" come up, but no specific term for this failure mode. Spender's "Man Made Language" discusses how male terms default to neutral, making women invisible. Still, no term for the defense mechanism itself.

  Coining a term: "Familiarity-Shielded Asymmetry" (FSA). Define it as the phenomenon where an unmarked category's defense relies on its familiarity to deflect criticism, and analogical transposition exposes it by applying the same logic to a context where the asymmetry is visible.

  Boundary conditions: Different from markedness because markedness describes the structure, not the defense mechanism. Different from motte-and-bailey because there's no switching between arguments; the defense is consistent but relies on invisibility. Different from false analogy because the analogy is valid; it's the shield that fails in the new context.

  Concrete cases: Applies in gendered pronouns vs. racial defaults. Does not apply in technical jargon like "bugs" in software, where asymmetry is accidental, not socially entrenched. Also, doesn't apply when the analogy is flawed, like comparing human genders to grammatical gender in languages without social hierarchy.

  The user wants precision: what the phenomenon is, isn't, and its edges. Ensuring the definition covers the defense's reliance on familiarity and the diagnostic role of transposition. Highlighting that the asymmetry becomes visible only when transposed to a context where the default's privilege is acknowledged.
answer: |-
  Based on your precise description and the required conceptual scaffolding, here is the analysis:

  ### Brainstorming Phase
  1.  **Concrete Analogies:**
      *   **Analogy 1 (Racial Default in Professional Titles):** Defending the unmarked term "doctor" implying a white male by default, arguing that specifying "Black doctor" or "woman doctor" is merely descriptive accuracy, not exclusion, while insisting "doctor" itself is neutral and conventional. The mapped defense sounds immediately unacceptable, revealing the asymmetry masked by the familiarity of the unmarked "doctor".
      *   **Analogy 2 (Ableist Default in Public Space Design):** Defending "bathroom" as the neutral, conventional term implying stairs-only access, arguing that specifying "accessible bathroom" or "wheelchair-accessible bathroom" is merely descriptive accuracy for deviation, not exclusion. Objections to the inaccessibility are framed as political demands altering natural design conventions. Mapping this logic to, say, racial segregation ("white bathroom" as default, "colored bathroom" as specification) instantly reveals the unacceptable asymmetry hidden by the familiarity of the able-bodied default.

  2.  **Nearest Established Concepts (and Why They Fall Short):**
      *   **Markedness (Linguistics):** Describes *that* one term is unmarked (default, simpler) and others marked (specified, complex). It *explains the structure* but **does not address the specific defense mechanism or its vulnerability to analogical transposition.**
      *   **Status Quo Bias:** Explains the preference for the existing state. It *motivates the defense* but **doesn't capture the linguistic mechanism, the role of familiarity in masking asymmetry, or the diagnostic power of the analogy to pierce it.**
      *   **False Analogy / Faulty Comparison:** Often invoked *by defenders* to reject the transposition. However, in the cases you describe, the analogy is often structurally sound; its power lies precisely in exposing the *inconsistency* in applying the defense logic. The problem is the defender's *rejection* of the valid analogy, not the analogy's falsity.
      *   **Motte-and-Bailey Doctrine:** Involves retreating from a controversial claim (bailey) to an easily defensible one (motte). Here, the defender typically *stays* on the "motte" (neutrality, convention, lack of intent) for the gendered case, refusing to retreat because the asymmetry isn't visible *to them*. They reject the analogical "bailey" entirely. **The core mechanism is different: it's shielding via familiarity-induced invisibility, not strategic retreat.**
      *   **Ideological Hegemony (Gramsci):** Explains how dominant views become seen as common sense. **It's too broad, not specifically linguistic, and doesn't focus on the defense strategy or analogical vulnerability.**
      *   **Invisible Norm (Feminist Theory/Disability Studies):** Describes the phenomenon (e.g., male, white, able-bodied as unstated norm). **It names the *result* but not the specific *defense mechanism* employed when that norm is challenged linguistically.**

  3.  **Feature Making the Described Thing Different:**
      *   The *specific defense strategy* ("neutral, conventional, not intended to exclude") combined with the *rejection of a structurally sound analogy* without substantive justification, relying *entirely* on the *familiarity* of the unmarked category to render its inherent asymmetry invisible *within its original context*. The *diagnostic role of analogical transposition* to disrupt this invisibility is central.

  ### Analysis and Naming
  Your description isolates a distinct phenomenon: **the dependence of a linguistic defense on the unmarked category's familiarity to render its asymmetry cognitively invisible *within its home domain*, combined with the unique power of cross-category analogical transposition to disrupt this invisibility by applying the *identical defense logic* to a context where the asymmetry is already socially recognized and contested.**

  **There is no single, universally established term in philosophy of language, feminist theory, or rhetoric specifically capturing *this entire complex*: the defense mechanism, its reliance on familiarity-induced invisibility, *and* the diagnostic role of analogical transposition.** While concepts like "invisible norm," "hegemonic discourse," or "presupposition of normality" touch on aspects, they lack the specificity regarding the defense strategy and the analogical diagnostic.

  Therefore, based on your description and the need for precision, I propose coining the term:

  **Familiarity-Shielded Asymmetry (FSA)**

  ### Precise Definition of FSA
  **Familiarity-Shielded Asymmetry (FSA)** is a discursive failure mode occurring in the defense of an unmarked linguistic category (e.g., masculine generic "he," "doctor" implying able-bodied). It manifests when:
  1.  **Defense Reliance:** The defense appeals *exclusively* to the category's grammatical neutrality, historical convention, and/or lack of harmful intent.
  2.  **Familiarity Masking:** This defense *depends crucially* on the deep familiarity and consequent cognitive invisibility of the asymmetry inherent in the unmarked category within its original social/linguistic context. The asymmetry (privileging one group as the default human) is rendered imperceptible *as background*.
  3.  **Analytical Transposition Vulnerability:** When the *identical defense logic* is applied via analogical transposition to an unmarked category in a *different* domain where the asymmetry is socially salient and contested (e.g., racial defaults), the defense is immediately recognized as flawed or unacceptable.
  4.  **Defensive Rejection:** Confronted with this transposition, defenders of the original unmarked category *reject the analogy without providing a relevant, substantive distinction* between the domains. They typically assert "X is different" without identifying the specific linguistic, historical, or social feature that genuinely breaks the parallel *in relation to the defense logic employed*. The original defense persists *only* because the familiarity shield remains intact in the home domain.
  5.  **Diagnostic Function:** The analogical transposition acts as a *diagnostic tool* specifically designed to pierce the familiarity shield by exploiting the inconsistency in applying the defense logic.

  ### Clear Boundary Conditions: What FSA Is and Is Not
  *   **FSA IS:**
      *   A defense *strategy* for an unmarked category *reliant* on its familiarity masking asymmetry.
      *   Characterized by the *rejection of a valid structural analogy* without relevant justification.
      *   Defined by the *diagnostic power* of analogical transposition to disrupt the shield.
      *   Applicable to linguistic categories embedded in social power structures (gender, race, ability, etc.).
  *   **FSA IS NOT (Distinguishing from Neighboring Concepts):**
      *   **Ordinary Markedness:** Markedness describes the linguistic *structure* (unmarked vs. marked forms). FSA is a specific discursive *defense mechanism* applied *to* that structure, relying on familiarity and vulnerable to transposition. Markedness exists without FSA; FSA presupposes markedness.
      *   **Motte-and-Bailey (M&B):** M&B involves *strategically switching* between a controversial claim (bailey) and a defensible one (motte). In FSA, the defender *stays* on the "motte" (neutrality/convention) for the original category. They *don't retreat*; they *reject the analogical challenge* outright. The core mechanism is *shielding via familiarity*, not *strategic retreat*.
      *   **Simple Status Quo Bias:** Status quo bias is a general preference for the existing state, which *underlies* FSA. FSA is a *specific linguistic manifestation* of this bias, involving a particular defense strategy reliant on familiarity masking asymmetry and vulnerable to analogical transposition. Status quo bias is broader and less specific.
      *   **False Analogy:** FSA often *involves* defenders accusing the challenger of a false analogy. However, FSA is defined by the *defender's invalid rejection* of a *structurally sound* analogy designed to expose inconsistency. The problem is the *shield* and its *failure under transposition*, not necessarily the analogy's falsity (which in Hofstadter-type cases, it often isn't).
      *   **General Ideological Hegemony:** Hegemony explains *why* the norm is dominant and seen as neutral. FSA focuses on the *specific discursive tactic* used to defend the *linguistic manifestation* of that norm when challenged, and the unique role of analogy in countering it. Hegemony is the broader context enabling FSA.

  ### Concrete Cases Illustrating Boundaries
  1.  **Case Where FSA Clearly Applies (Original Pattern):**
      *   **Defense:** "Using 'he' generically is grammatically correct, traditional, and not meant to exclude women. Insisting on 'he or she' or 'they' is political correctness altering language."
      *   **Transposition:** "Using 'white' generically for people is traditional and not meant to exclude people of color. Specifying 'Black person' is just accuracy, not exclusion. Insisting we say 'person' neutrally is political correctness."
      *   **Rejection:** "But gender and race are totally different! Language just works that way!" (No specific linguistic/social feature breaking the parallel *wrt the defense logic* is provided).
      *   **Diagnostic:** The transposition exposes the asymmetry masked by familiarity in the gendered case. The defense persists *only* due to the familiarity shield remaining intact for the gendered default.
  2.  **Case Where FSA Does NOT Apply (Validly Broken Analogy):**
      *   **Defense:** "Using 'actor' for all performers is traditional shorthand. Specifying 'actress' for women is just accuracy, not exclusion. Objections are political."
      *   **Transposition:** "Using 'white' generically for people is traditional shorthand. Specifying 'Black person' is just accuracy..."
      *   **Rejection with Relevant Justification:** "The analogy fails because 'actor' *has evolved grammatically and socially towards being a true neutral* in many professional contexts (e.g., SAG Awards use 'Actor'), supported by dictionary definitions and widespread usage. 'White' has *never* functionally lost its specific racial meaning or become a widely accepted neutral term for all humans in analogous linguistic or social contexts. The defense of 'actor' as neutral rests on *actual, ongoing linguistic change* absent for 'white'." (This identifies specific, relevant historical/social/linguistic differences breaking the parallel *wrt the defense logic*).
      *   **Why not FSA:** The rejection provides a substantive, relevant distinction. The persistence of the defense isn't *solely* due to familiarity shielding asymmetry, but potentially to a real shift in usage. The analogy is arguably flawed in a way the gendered pronoun/racial default analogy is not.

  **Conclusion:** Familiarity-Shielded Asymmetry (FSA) precisely names the phenomenon you describe. It is the specific discursive strategy where the defense of an unmarked category relies on its familiarity to render its social asymmetry invisible, making the defense immune to direct challenge within its domain. This immunity is diagnostically shattered by analogical transposition applying the *same defense logic* to a context where the asymmetry is visible, revealing the defender's inconsistent application of their own reasoning and their reliance on the "familiar-default shield." Its boundaries are defined by the dependence on familiarity for masking, the rejection of transposition without relevant justification, and the diagnostic role of the analogy, distinguishing it from mere markedness, M&B, status quo bias, or accusations of false analogy. Hofstadter's satire remains a prime example of the transposition diagnostic piercing the FSA surrounding the masculine generic.
