  *First impression:*  
  Ah, this "predictive exclusion" you describe strikes me as a chilling artifice of statecraft. To condemn a soul not for deeds committed, but for shadows cast by others' past missteps? It smells of that Roman augury we rightly mock – reading doom in bird-flight while ignoring true justice. Pray, clarify one point: do these authorities claim divine inspiration for their patterns, or is it merely human reason elevated to oracular status? For the latter is a frail reed indeed.

  *The cannibal parallel:*  
  You touch the very nerve of my argument! Recall, I have written of the Tupinambá who consume their valiant enemies slain in open combat. We recoil, branding them "barbaric" for this ritual – yet while we burn living heretics at the stake over subtle points of doctrine, we call it piety! The hypocrisy is laid bare: they honor courage in a framework we refuse to comprehend; we inflict prolonged agony under the banner of Truth. Just so, these distant authorities label men "pre-barbaric" based on external signs, mirroring our own blindness. We judged the Brazilians savages because we saw only the act, not the intricate web of honour, vengeance, and cosmology that rendered it coherent within *their* order. Your predictors commit the same sin: they reduce a man’s complex nature to a crude cipher, ignoring the internal logic of his life – his fears, his necessities, the silent virtues that may yet flower. To damn him before the fact is to play God with human frailty.

  *The coherence twist:*  
  They plead "communal coherence"? A fortress built on fear is no true polity. Order maintained by such preemptive severing is brittle, a semblance of peace bought with tyranny. Consider Seneca: "A state that cruelly exacts penalties is not well ordered." True coherence springs from shared bonds, equitable laws, and mercy – not from hunting phantoms. These authorities mistake sterility for stability. They forget Augustine's lament that even earthly cities must reckon with the tangled wheat and tares growing together until harvest. To root out perceived "tares" prematurely, based on mere resemblance to past blight? That is not protection; it is the gardener’s madness, tearing at the soil itself. Their internal logic is but a polished mirror reflecting their own dread, not wisdom.

  *Bottom line:*  
  They are indeed modern Europeans in disguise – perhaps worse. We at least wait for a man to *speak* heresy or *raise* a hand before we rend him. These predictors condemn the silent thought, the unseen potential. Their "pre-barbaric" label is merely our old arrogance reborn, a subtler Inquisition cloaked in the false mathematics of patterns. Barbarity wears many robes.
