prompt: |-
  Hey, I could use some help with the final exam for my upper-level philosophy of biology seminar. Mostly juniors and seniors, they've all had at least one philosophy of science course but this is thier first philosophy of biology class. Three-hour in-class final, and I want one self-contained question that's meant to take about 45 minutes and is worth 25 of the 100 points. Topic is adaptationism and the Gould–Lewontin spandrels critique.

  Here's my problem. Every version of this question I've written gets answered by a perfectly competent recapitulation. The student says: Gould and Lewontin accuse adaptationists of telling just-so stories and of mistaking architectural byproducts for adaptations, the spandrels of the cathedral vault being the flagship example; the adaptationists reply that byproducts get co-opted later and that optimality models make genuine, testable predictions; therefore the whole thing is an empirical dispute that has to be settled case by case. All of that is true. All of it is worth a B. And none of it tells me whether the student actually understands where the disagreement lives. I want a question where that paragraph alone gets you maybe 12 out of 25.

  So: pretend you're a professional philosopher of biology who's taught this material a bunch of times and knows the adaptationism literature from the inside. Before you write anything, brainstorm for me. Give me a few paragraphs where you sketch three candidate questions, reject at least two of them by name with an actual reason (this one is answerable by recitation, that one turns on some fact about a real taxon that nobody could reasonably be expected to have memorized in an exam room), and keep the one that survives. I want to see the rejects, not just the winner.

  Some constraints on the version I keep circling back to, in case they're useful — feel free to change the details, but please keep this level of specificity, because I want the question to be about reasoning through something, not about recall:

  The question should be built around a made-up case study. My rough shape: a lineage of burrowing lizards on a high volcanic plateau that ram through compacted ash with a heavily reinforced, fused braincase. The reinforcement is uncontroversially an adaptation for ramming. But the bony struts that brace the skull pinch the canal the optic nerve runs through, so the adults have terrible visual acuity and a much reduced visual midbrain, while their soft-soil sister taxa, which don't ram, have unfused skulls and excellent vision. Meanwhile these lizards have flamboyant species-specific throat fans that they use in close-range courtship, and females demonstrably prefer the brighter ones.

  Now the wrinkle I want injected, which is the part that does the real work: the visual system has clearly been re-tuned around the low acuity. The surviving visual tissue is hypersensitive to exactly the wavelengths the throat fan reflects, and the olfactory bulbs have ballooned. So the animal you're actually looking at has a well-designed, low-acuity, fan-detecting visual system, and the original architectural accident has been partly compensated away — the historical signature that would let you tell a spandrel from an adaptation has been overwritten by later selection. To make it worse, the stratigraphy is unhelpful: in the two closest outgroups, skull fusion and acuity loss show up in the same beds, so there's no time gap to argue from. Call this the erosion problem, or whatever you want to call it.

  Given that setup, the question should force a real choice. Is the claim that the poor acuity is a spandrel a claim about causal history that we've simply lost the ability to test? Or is it a claim about which kind of explanation is the appropriate one, so that it survives the erosion problem untouched? Or does the origin-versus-maintenance distinction just eat the entire dispute — and if so, is that dissolution a neutral clarification or is it quietly handing the adaptationist the win? Students should have to pick one and defend it, not list the options.

  What I need from you:

  1. The question exactly as it would appear on the exam, with the case study written up properly. Make it biologically plausible, and make the invented names obviously invented so nobody burns ten minutes trying to remember a real species.

  2. A model answer of roughly 800 words. No citations, no bibliography, no suggested readings — I'll drop the reading list in myself. But do mark inline, in brackets, which claims are things that basically anyone who knows this literature would grant and which are genuinely contested among specialists. I want to be able to see at a glance where the model answer is itself taking a side. Be explicit about where you're unsure and where reasonable people in the field would disagree; don't smooth a live controversy into a consensus, and don't present the move you happen to favor as the one everybody accepts. If half the field would reject a step, say so.

  3. A marking scheme. Total 25, broken into five or six must-hit points with the marks for each, plus a one-line note on each point about how students typically blow it. Then short A, B, and C band descriptions where the line between an A and a B is drawn on specific moves a student has to make, not on there being more detail or nicer prose.

  Two don'ts. First, don't let the question be won by someone who has memorized the three-way taxonomy of adaptationism they had in week two — the empirical, methodological, and explanatory versions — even though using that taxonomy correctly should be necessary for an A. Second, don't let it hinge on any real empirical result or on who said what; a student who skipped two weeks of reading should still be able to reason their way through the case and get a decent grade.

  Thanks, this is definately the question I always get stuck on.
reasoning: |-
  Okay, let me tackle this philosophy of biology exam question request. The user is clearly an experienced instructor struggling to design a final exam question that pushes beyond rote recitation of the Gould-Lewontin debate. They've provided a detailed case study about burrowing lizards but find students keep giving superficial answers.

  Hmm, the core challenge is creating a question where students must engage with the philosophical underpinnings of adaptationism, not just rehearse the spandrels critique. The instructor wants students to wrestle with how explanatory frameworks survive evidentiary erosion - when historical traces fade but the conceptual distinction remains relevant.

  First, I need to brainstorm candidate questions that meet the constraints:
  - Must use the lizard case study with its key features: skull fusion adaptation, optic nerve pinch as byproduct, sensory repurposing, and missing stratigraphic evidence
  - Should force a choice about whether the spandrel claim is untestable, explanatory, or dissolved by origin/maintenance distinction
  - Cannot rely on memorized taxonomies or real-world citations

  *Scratching head* Let me sketch three approaches:

  Candidate 1 would ask students to apply Godfrey-Smith's "explanatory adaptationism" framework to the lizard case. But I'm rejecting this because it rewards taxonomy recall without deeper engagement. A student could just label things and get points.

  Candidate 2 would pose whether the visual system's current utility proves it was "always for" fan detection. Nope - this turns on neuroanatomical details students wouldn't know, violating the "no specialist knowledge" rule.

  Candidate 3 survives: It asks whether the sensory repurposing undermines the spandrel designation, forcing confrontation with explanatory vs. historical claims. Perfect - it uses the case's erosion problem directly.

  For the chosen question, I'll polish the lizard scenario: Introduce "Ignisaurus" genus with volcanic plateau dwellers ("Ashensis") versus lowland cousins ("Humis"). Build in all the requested features - fused skulls, pinched optic canals, repurposed vision for fan detection, ambiguous stratigraphy. The question should explicitly demand a stance on whether the spandrel label survives the evolutionary repurposing.

  The model answer needs to:
  - Acknowledge the standard spandrel argument as foundational [consensus]
  - Argue that current utility doesn't erase historical contingency [contested]
  - Show how the origin/maintenance distinction reframes but doesn't resolve the debate [key insight]
  - Explicitly mark where professional disagreements exist (e.g., whether explanatory claims require historical evidence)

  For grading, I'll allocate points for:
  1) Correctly identifying the optic pinch as initial constraint (3 pts)
  2) Explaining repurposing as secondary adaptation (4 pts)
  3) Addressing evidentiary erosion (6 pts - most students miss this)
  4) Taking a clear position on spandrel status (5 pts)
  5) Engaging the origin/maintenance distinction (5 pts)
  6) Overall coherence (2 pts)

  A-band answers must connect the case to explanatory pluralism; B-band might recognize the issues but retreat to "it's empirical"; C-band just rehashes textbook points.

  *Checking clock* Better ensure the question can be answered in 45 minutes while allowing depth. The case study description should be compact but complete - about 150 words. The model answer will demonstrate how to synthesize rather than summarize.

  Most importantly, the solution must satisfy the instructor's frustration with "competent recapitulation." By making the erosion problem central, we force students to show whether they grasp why philosophers still debate this decades later. The best answers should reveal if they see adaptationism as a scientific stance or a philosophical position about explanation.
answer: |-
  Here are three candidate questions, with two rejects and one keeper, following your constraints. The model answer, marking scheme, and explicit notation of contested claims follow the selected question.

  **Candidate Question 1 (Rejected: Answerable by Recitation)**  
  *"Using Godfrey-Smith’s three forms of adaptationism (empirical, methodological, explanatory), analyze the case of Ignisaurus ashensis. Discuss whether the reduced visual acuity qualifies as a spandrel under each framework."*  
  **Rejection Reason:** This directly invokes the "three-way taxonomy" you forbade. A student could regurgitate definitions and apply them superficially without engaging the unique "erosion problem" in your case study. It rewards memorization, not reasoning.

  **Candidate Question 2 (Rejected: Requires Specialist Knowledge)**  
  *"Ignisaurus ashensis shares fused skull morphology with fossil outgroup Ignisaurus antiquus, but recent CT scans show I. antiquus had uncompressed optic canals. Does this undermine the spandrel claim for I. ashensis? Justify using Gould-Lewontin’s criteria."*  
  **Rejection Reason:** This turns on a fictional empirical detail (CT scans of fossils) that students must "discover" mid-exam. It violates your constraint against relying on facts "nobody could reasonably be expected to have memorized." It tests improvisation, not philosophical reasoning.

  **Candidate Question 3 (Selected: Forces Engagement with Erosion Problem)**  
  ### Final Exam Question (25 points; target time: 45 minutes)  
  **Case Study:** The lizard genus *Ignisaurus* inhabits volcanic islands. *Ignisaurus ashensis* lives on high plateaus of compacted ash. To burrow, it rams headfirst into hard substrates. Its skull is reinforced by bony struts that fuse the braincase—an unambiguous adaptation for ramming. However, these struts compress the optic nerve canal, causing severe adult visual acuity loss and reduced visual midbrain size. Its closest relative, *Ignisaurus humis* (in soft lowland soils), lacks skull fusion and has excellent vision.  

  *I. ashensis* uses flamboyant, species-specific throat fans in courtship; females prefer brighter fans. Crucially, its visual system is reconfigured: surviving neural tissue is hypersensitive to the exact wavelengths the throat fan reflects, and olfactory bulbs are enlarged. Thus, while acuity is poor, the system is highly efficient at detecting fans at close range. Stratigraphy is ambiguous: the two closest fossil outgroups (*I. primus* and *I. tertius*) show skull fusion and optic compression in the same geological layer, with no evidence of transitional forms.  

  **Question:**  
  A colleague argues: "The *original* acuity loss in *I. ashensis* was a spandrel—an unavoidable byproduct of skull reinforcement. The subsequent sensory repurposing for fan detection is a secondary adaptation. But since stratigraphy can’t confirm the timing, calling it a spandrel is now untestable speculation."  

  Another counters: "The spandrel claim isn’t about testability. It’s about whether the *design* of the visual system is explained by direct selection for fan detection or as a compensation for constraints. The repurposing doesn’t erase that!"  

  **Take a position:** Is the claim that acuity loss is a spandrel **primarily** (a) an untestable historical claim due to lost evidence, (b) a claim about explanatory priorities that survives evidentiary erosion, or (c) a distinction dissolved by the origin-vs.-maintenance debate? Defend your choice using the case. Explain why your view best resolves the dispute.

  ---

  ### Model Answer (Approx. 800 words)  
  The colleague who labels the acuity loss as a spandrel is making a claim about **explanatory priorities**, not untestable history. This view survives the "erosion problem" (ambiguous stratigraphy) because the core disagreement between adaptationists and their critics centers on how to allocate causal responsibility in evolutionary narratives—even when historical data is incomplete. I argue for position (b), with the caveat that this exposes a deeper tension in how philosophers define "explanation" in biology. [**Consensus**: Gould-Lewontin’s spandrels critique targets overreliance on adaptive storytelling; **Contested**: Whether explanatory claims can transcend historical evidence.]  

  First, the *initial* acuity loss is uncontroversially a byproduct. The skull struts are adaptations for ramming, and their compression of the optic canal is a direct physical consequence with no functional benefit—likely even a cost. [**Consensus**: Byproducts exist; architectural constraints shape evolution.] Gould-Lewontin would classify this as a classic spandrel: a "non-adaptive side-effect" of a true adaptation. Crucially, this designation hinges on the *absence of direct selection* for the trait *at its origin*. Adaptationists might counter that all traits are shaped by selection eventually, but this misses the point: the spandrel claim flags that the trait’s *initial appearance* requires no selective explanation. [**Consensus**: The origin-vs.-maintenance distinction is critical; **Contested**: Whether "origins" matter if maintenance dominates.]  

  The erosion problem (lost stratigraphic evidence) seems to challenge this. If we cannot prove the acuity loss preceded fan-detection adaptations, critics might argue we cannot confirm it was ever a "pure" byproduct. But this misconstrues the spandrel argument. The dispute is not forensic ("Did X happen before Y?"); it is *explanatory* ("Does the trait’s existence *at time T* require invoking direct selection?"). For Gould-Lewontin, labeling acuity loss a spandrel means: "We explain its presence *today* partly by constraint, not solely by its current utility." The repurposed fan-detection system shows *current* adaptation, but the system’s *structure*—low acuity paired with wavelength-specific sensitivity—still bears the signature of its origins. The neural "workaround" is suboptimal (e.g., poor general vision) compared to a system built from scratch for fan detection. [**Contested**: Many adaptationists (e.g., Maynard Smith) would argue current utility justifies retroactive adaptive explanations; others (e.g., Griffiths) reject this as Whiggish.]  

  The origin-vs.-maintenance distinction (option c) clarifies but does not dissolve the debate. [**Consensus**: This distinction is foundational.] Yes, the acuity loss originated as a byproduct and was *maintained* (and modified) by selection for fan detection. But this dual history does not make the spandrel label irrelevant. The structural constraint *explains why* the visual system looks *this specific way*—compressed canals forcing neural repurposing—rather than being optimized for fan detection alone. Adaptationists might insist this is just "selection working within constraints," but Gould-Lewontin would argue that foregrounding the constraint prevents overattributing design to selection. The dispute is thus about *which factor deserves explanatory prominence*: the constraint (spandrel view) or the co-option (adaptationist view). [**Contested**: Whether explanatory prominence is a scientific or aesthetic choice. Some (e.g., Dennett) see constraints as mere "speed bumps" for selection; others (e.g., Amundson) see them as fundamental.]  

  Choosing (a)—the untestability claim—concedes too much to positivism. Science routinely invokes untestable historical narratives (e.g., asteroid impacts in macroevolution) when they offer the best explanation. [**Contested**: Some philosophers (e.g., Sober) demand testability; others prioritize explanatory coherence.] Here, the spandrel explanation is *inference to the best explanation*: given the physics of skull fusion and nerve compression, and the absence of any plausible initial benefit to acuity loss, "byproduct" is simpler than imagining cryptic selection. The ambiguous stratigraphy makes this less certain, but not meaningless.  

  **Why (b) resolves the dispute best**: It refocuses the debate on philosophy of explanation, not empiricism. The spandrel claim is a warning against Panglossianism—assuming every trait is an optimal adaptation. In *Ignisaurus*, adaptationists might see only the efficient fan detection and declare, "Selection designed this system!" The spandrel advocate insists: "No, selection *salvaged* a system broken by constraints." This remains vital even if we lack fossils. The erosion problem doesn’t erase the explanatory conflict; it reveals that the conflict is about narrative framing, not just chronology. [**Contested**: Many biologists reject "narrative framing" as unscientific; philosophers counter that all historical science involves narrative.]  

  ---

  ### Marking Scheme (Total 25 points)  
  **Must-hit points**:  
  1. **Identifies acuity loss as initial byproduct of skull fusion** (3 pts).  
     *Blown by:* Calling it an adaptation for ramming or fan detection.  
  2. **Explains sensory repurposing as secondary adaptation** (4 pts).  
     *Blown by:* Confusing repurposing with original function.  
  3. **Addresses erosion problem (stratigraphy)** (6 pts): Must engage evidentiary loss; cannot ignore it.  
     *Blown by:* Assuming fossils *would* resolve the issue if found.  
  4. **Takes clear position on (a)/(b)/(c) with case-based justification** (5 pts).  
     *Blown by:* Listing options without choosing/defending one.  
  5. **Engages origin-vs.-maintenance distinction meaningfully** (5 pts).  
     *Blown by:* Asserting it "dissolves" the debate without analysis.  
  6. **Coherence/logic** (2 pts).  

  **Grade bands**:  
  - **A (22–25)**: Chooses (b) or (c) *and* argues why the spandrel label retains explanatory force post-repurposing *or* why the distinction is reshaped but not dissolved. Must explicitly contrast historical vs. explanatory claims.  
  - **B (16–21)**: Correctly identifies byproduct/secondary adaptation but retreats to "it’s empirical" or defaults to (a). May misuse origin/maintenance.  
  - **C (10–15)**: Competent recapitulation of spandrels critique but ignores repurposing/stratigraphy. Fails to pick/defend a position.  

  ---  
  This question forces students to confront the *conceptual stakes* of adaptationism beyond memorized critiques. It rewards recognizing that the debate persists not due to missing data, but because it reflects deeper disagreements about biological explanation. The model answer flags key fault lines (e.g., inference to best explanation vs. testability) where specialists genuinely disagree.
