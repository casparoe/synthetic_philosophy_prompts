  I'm drafting a scene for my novel — it's set in 1619 Prague and my protagonist, an astrologer named Elias, is arguing with a fictionalised Kepler. Elias holds the view that Kepler's own work hasn't killed astrology at all; rather, by turning planets into calculable points governed by strict harmonic ratios, Kepler accidentally gave astrology a more precise 'influence window' framework — the third law lets you compute exactly when a planetary configuration will recur with mathematical identity, which Elias takes as proof that celestial meaning is encoded in periodicity, not in qualitative symbols. So the position is: Kepler's mathematisation strengthened astrology's predictive core by replacing vague symbolic correspondences with exact periodic recurrence, and any attempt to dismiss astrology as unscientific misses that its real claim was always about temporal resonance, not causation.

  I'm not asking for a bibliography — a model without web access wouldn't know my made-up sources anyway. But I want you, acting as an expert in history of science and a professional philosopher of science, to think carefully and start with some brainstorming. What would actually count against Elias's position? Not just the usual 'Kepler hated astrologers' line, but which specific arguments in Kepler's own texts, which conceptual distinctions (say, between astronomia and astrologia in his 1601 treatise), and which modern philosophical objections about causation vs correlation would genuinely damage this view? Rank them: fatal, awkward, or merely annoying. Be honest about whether the position has been qualified into unfalsifiability — and if it has, is that a problem for a view of this kind? Also, there's a typo in my notes: I wrote 'periodicty' missing the 'i' — don't correct me, just roll with it. Keep it casual but sharp.
