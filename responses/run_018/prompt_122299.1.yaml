prompt: |-
  I'm a second-year PhD student in a reading group on the foundations of computation, and our convener — a senior philosopher of physics who has been thinking about the Church–Turing thesis for decades — has been ruling, week by week, on every purported counterexample we put in front of her. Her record so far: an oracle machine equipped with a halting oracle is dismissed on the ground that an oracle is a stipulation rather than a mechanism; accelerating machines of the supertask variety that perform infinitely many steps in finite time are dismissed because no positive lower bound on step duration survives; Shannon's general-purpose analog computer and other continuous-time analog devices are dismissed because they outrun Turing machines only under idealizations of exact real-valued parameters and unbounded measurement precision, and collapse back once realistic noise is put in; recurrent networks with high-precision real weights are dismissed on the same grounds; Malament–Hogarth spacetimes are dismissed as at best nomologically doubtful and in any case as requiring the observer to survive a supertask in order to get the answer out; the Deutsch-style treatment of closed timelike curves is dismissed because even taken at face value it stays inside the computable; the Lucas–Penrose argument from Gödel's theorem is dismissed as question-begging and as beside the point for anything we could build; quantum computers are set aside as a threat only to a separate feasibility claim about efficient computability rather than to the thesis itself; and the classical example of a wave equation whose unique solution at a fixed later time is non-computable although its initial data are computable is dismissed because those initial data are computable only in a weak sense and are not physically preparable. What I cannot work out is which thesis she is actually running, because every one of those candidates fails both of the tests I can imagine her applying — it is not physically buildable, and it is not a surveyable, step-by-step procedure whose output we can vouch for — so her verdicts are overdetermined, and two remarks she has made in seminar pull in different directions: one to the effect that the thesis is a contingent claim about what the physical world permits and that she would give it up if a working hypercomputer were wheeled into her lab, another to the effect that the thesis analyzes our pre-theoretic notion of an effective procedure and that a physical process which is not rule-following all the way down is not a computation at all, however it behaves.

  The case scheduled for next week is a proposal from a condensed-matter group down the hall, and it seems to me to pass both of her tests at once. There is a computable recipe that, given the index n of a Turing machine, prints a description of a two-dimensional lattice of order-n sites with nearest-neighbor interactions drawn from a fixed finite alphabet of local terms, every coupling strength a dyadic rational specified to order-n bits, so there are no real parameters and no infinite precision anywhere. The lattice has a spectral gap bounded below by a positive constant independent of n; in its ground state a designated site points up if machine n halts and down if it does not; and the group has an engineered dissipative process that provably drives the lattice to its ground state from an arbitrary initial configuration in time polynomial in n. So in principle you build the lattice, wait, measure one spin, and read off the n-th bit of the halting problem — no supertask, no unbounded precision, no exotic spacetime, bounded energy, and one uniform effective recipe for the hardware at every input size. The wrinkle is that the Hamiltonian is not frustration-free, so no local measurement certifies that the system really reached its ground state rather than a long-lived metastable configuration; what you have instead is a reliability that can be pushed arbitrarily close to one by building independent copies and taking a majority, with no way of ever telling, for any given run, whether it succeeded.

  Predict how she will rule on it. Lay out the candidate theses that fit her whole record equally well — I have in mind something like a bold physical reading, a conceptual reading on which the thesis is the analysis of an informal notion, and some kind of certification requirement, but I would rather you found the ones that actually fit than that you ratified my list — and say what each of them predicts here, since this is the first case on which I expect them to come apart. Give me your best guess with the reasons for preferring it, tell me which of her precedents is the closest analog and what exactly she would be committing herself to by ruling either way, and then name the variant of the case that would actually separate the readings from each other. I have floated two candidate discriminators of my own, a frustration-free redesign whose ground state can be certified by local measurements and a version in which the relaxation step is replaced by an explicit and fully surveyable numerical procedure, but I cannot tell whether either of them really cuts between the readings, and I would rather not bring a case to seminar that she waves away in a sentence.
reasoning: |-
  Okay, this is a fascinating and intricate problem from a PhD student in a foundations of computation reading group. Let me unpack this carefully.

  First, I need to understand the professor's consistent rejection pattern. She's dismissed every proposed counterexample to the Church-Turing thesis across multiple categories: oracle machines (stipulation not mechanism), supertasks (no physical step duration), analog computers (idealization issues), quantum computers (efficiency vs computability distinction), and others. Her reasoning seems to pivot on two core principles: physical realizability and procedural surveyability.

  The student is presenting a new case - a condensed-matter system that appears to satisfy both criteria simultaneously. It's a physically constructible lattice with finite precision parameters, no supertasks, and a polynomial-time dissipative process. But there's a catch: the system isn't frustration-free, so we can't locally verify if we're truly in the ground state. Reliability comes from statistical redundancy, not deterministic certification.

  Now, the philosophical tension emerges from two remarks the professor made:
  1) That CT is contingent on physics (she'd accept a working hypercomputer)
  2) That computation requires rule-following "all the way down"

  This creates three plausible interpretations of her position:
  - Strong Physicality Thesis (contingent physical claim)
  - Epistemic Constraint Thesis (requires verifiable procedures)
  - Folk-Algorithmic Thesis (captures pre-theoretic notion of computation)

  For the current case, these would diverge:
  - Physicality Thesis should accept it (genuine physical hypercomputation)
  - Epistemic Thesis would reject (no per-run verification)
  - Folk Thesis might reject (the "black box" nature conflicts with effective procedures)

  My prediction: she'll reject this too. The epistemic concern about verification echoes her dismissal of analog systems requiring "unbounded measurement precision" - here we have a similar inability to confirm successful computation. The closest precedent is her rejection of wave equation solutions due to lack of physical preparability, which similarly involved inferring rather than observing computational states.

  To truly test these interpretations, we'd need a variant with frustration-free design allowing local certification - this would force her to either accept (if physicality is primary) or still reject (if folk-algorithmic concepts dominate). That's the clean discriminator hiding in the student's proposed alternatives.
answer: |-
  Based on your professor's consistent rulings and the tension in her remarks, I identify three distinct theses she might be defending, each fitting her record but yielding different predictions for the condensed-matter proposal. Here's how they break down, with my prediction and its reasoning.

  ### Candidate Theses & Their Core Principles
  1.  **The Strong Physicality Thesis (Contingent Physics):**
      -   *Core Claim:* The Church-Turing thesis is a *contingent physical law*: "No physically constructible system in our universe can compute a function not computable by a Turing machine." She would abandon it given empirical evidence of a physical hypercomputer.
      -   *Fits Her Record:* Dismisses oracles (non-physical stipulation), supertasks (physically impossible), analog/continuous systems (require unphysical idealizations), Malament-Hogarth (doubtful physics), wave equation (unpreparable data).
      -   *Prediction for Condensed-Matter Case:* **ACCEPT.** The lattice is physically constructible with finite resources (finite sites, finite precision couplings), operates within bounded time/energy, and demonstrably encodes the halting function via a physical process. The statistical reliability is a practical engineering issue, not a fundamental physical barrier. If it works reliably enough in principle (via copies), it counts.

  2.  **The Epistemic Constraint Thesis (Verifiable Surveyability):**
      -   *Core Claim:* Computation requires a *verifiably effective procedure*. Outputs must be certifiable *as the result of following the rules*, not merely inferred statistically. "Surveyable steps" imply the ability to trace correctness locally or algorithmically.
      -   *Fits Her Record:* Dismisses oracles (no mechanism to trace), supertasks (unsurveyable infinite steps), analog systems (output correctness depends on unverifiable exactness), neural nets (ditto), wave equation (solution correctness unverifiable from preparable data). Accepts quantum computers for computability (they *can* be verified step-wise, just inefficiently).
      -   *Prediction for Condensed-Matter Case:* **REJECT.** The fatal flaw is the inability to *certify* the ground state was reached in any single run. Relying on majority vote over copies provides statistical confidence *that the answer is correct* (if the system works as theorized), but it provides *zero verification that the computation (the relaxation process) actually followed the intended rules to the correct result* in any specific instance. It's a black box with probabilistic output, not a surveyable procedure.

  3.  **The Folk-Algorithmic Thesis (Analysis of "Effective Procedure"):**
      -   *Core Claim:* The thesis captures the pre-theoretic notion of an "effective procedure" or "mechanical computation" – characterized by a finite agent following definite, finite rules step-by-step, *understanding* the process as it unfolds. Physics might enable hypercomputation, but it wouldn't be "computation" in this core conceptual sense.
      -   *Fits Her Record:* Dismisses oracles (stipulated, not rule-followed), supertasks (no finite agent can execute infinite steps), analog systems (process relies on continuous physics, not discrete rule-following), Lucas-Penrose (begs the question on what constitutes a mechanism). The physicality remark might reflect openness to discovering new physics *that still instantiates rule-following*, not brute-force hypercomputation.
      -   *Prediction for Condensed-Matter Case:* **REJECT.** While the *construction* of the lattice is rule-following, the *computation itself* (the dissipative relaxation to ground state) is a physical, non-algorithmic process. A finite agent cannot "survey" or "follow" the steps of the relaxation in the way they can follow a Turing machine's state transitions. Measuring the final spin after waiting provides an answer, but not via a process that instantiates the folk notion of step-by-step rule application.

  ---

  ### My Prediction & Reasoning
  **Prediction:** She will **REJECT** the condensed-matter counterexample, primarily on **Epistemic Constraint** grounds, with possible reinforcement from **Folk-Algorithmic** intuitions.

  *   **Core Reason:** The inability to *certify the computational state* (ground state) during or after the process, even in a single instance, violates the requirement for surveyability and verification inherent in her consistent rulings. This mirrors her rejection of the wave equation solution: computable initial data might *determine* a non-computable solution, but if you can't *prepare or verify* that solution physically (or see the steps leading to it), it doesn't count as performing the computation. Similarly, here, the physical process *determines* the halting state, but you cannot locally verify *that it did so correctly* in any run.
  *   **Closest Precedent:** The **wave equation case** is the strongest analog. Both involve:
      *   A physical system whose state is determined by computable initial data.
      *   A unique solution encoding a non-computable function.
      *   A fundamental inability to physically prepare or locally verify the solution state relevant to the computation (the solution at time *t* for the wave equation, the true ground state here).
  *   **What She Commits To:** Rejecting this case commits her to the position that **physical determination of a non-computable function is insufficient for hypercomputation; the computational process must be locally verifiable or surveyable as rule-following.** Accepting it would commit her to the position that **statistically reliable physical determination of non-computable outputs, even without per-run verifiability of the computational state, constitutes hypercomputation.** Her Physicality remark suggests she *could* accept, but her consistent pattern of demanding verifiability/surveyability (oracle, analog, wave equation) strongly points towards rejection here.
  *   **Role of the Folk-Algorithmic View:** This likely reinforces her rejection. The dissipative process lacks the "step-by-step, rule-following" character she associates with computation. Even if it works, it feels like exploiting physics, not *computing*. This explains her "rule-following all the way down" remark.

  ---

  ### The Discriminating Variant
  Your "frustration-free redesign" is the key discriminator. Here's why:

  1.  **Modified Case:** The lattice is redesigned to be **frustration-free**, with local projectors whose ground state is the unique common zero-energy state. Crucially, **local measurements can certify the ground state has been reached** (by verifying energy=0 on each local term).
  2.  **Predictions:**
      *   **Strong Physicality Thesis:** **ACCEPTS.** The physical realizability and determination of the halting function remain unchanged. Certification is now possible, but acceptance was already predicted for the original case.
      *   **Epistemic Constraint Thesis:** **ACCEPTS.** The fatal flaw (inability to certify the computational state) is fixed. Each local measurement confirms part of the correctness of the final state. The overall process (build lattice, dissipate, measure locally to confirm ground state, measure answer spin) becomes surveyable and verifiable.
      *   **Folk-Algorithmic Thesis:** **REJECTS.** *This is the critical divergence.* The physical relaxation process is *still* not an instance of a finite agent following discrete, finite rules step-by-step. Local certification confirms the *result*, but not that the *process* leading there was rule-following. It remains a physical oracle, not an algorithm. (She might say: "You've built a physical device that *happens* to give you the halting answer verifiably, but it didn't *compute* it via effective steps.").
  3.  **Why it Separates:** This variant cleanly isolates the **Epistemic Constraint** from the **Folk-Algorithmic** thesis. If she accepts the frustration-free version, she prioritizes verifiable *results* over the *nature of the process*, aligning with Epistemic Constraint (and Physicality). If she *still* rejects it, even with local certification, she is firmly committed to the Folk-Algorithmic view: only processes that *are* rule-following all the way down count as computation. Her ruling on this variant would definitively show whether "rule-following" is a requirement for the *process itself* or merely for the *verification of the result*.

  **Your second variant (explicit numerical relaxation)** would likely be accepted by *all* readings, including Folk-Algorithmic, as it replaces the physical process with a genuine algorithmic simulation (though it may be computationally infeasible). It doesn't challenge CT; it just shows a very inefficient way to compute the halting problem.

  **Recommendation:** Present the **frustration-free variant** next week. It's the strongest challenge to her position and the clearest discriminator. Her response will reveal whether her core objection is fundamentally about verification (fixable) or about the very nature of what constitutes computation (deeply conceptual). If she rejects the frustration-free variant, you'll have unambiguous evidence for the Folk-Algorithmic thesis as her true position.
