prompt: |-
  I'm on a co-op board that settles member disputes about shared rules and past decisions — like whether the minites from March are legit or if someone can just reject the whole meeting process. We have about 20 minutes per case, none of us are philosophers, and I need a reusable proceedure. I was reading about Wittgenstein's hinge idea in On Certainty — that some things stand fast not because we proved them but because doubting them collapses the game we're playing. I want a step-by-step checklist my board can run in the room: tests to tell when a doubt is frame-internal (okay to investigate) vs frame-breaking (should be treated as standing fast for this decision). Make it concrete: three ordered checks, with a quick way to score or decide each. Then apply it to three cases: (1) a member says the March minites were forged — should go through; (2) a member says our board has no legal authority at all — should get blocked; (3) a weird middle case where the proceedure says block but I think it should go through, and I want to see why. Flag the spots where human judgement can't be removed, and say flat-out what this can't handle — like if someone genuinely believes we're in a simulation or the past is an illusion. Don't give me citations or a reading list; just build it straight from the hinge concept.
reasoning: |-
  We are building a three-step checklist based on Wittgenstein's hinge concept to distinguish between:
  - Frame-internal doubts: which can be investigated within the existing framework of the co-op's rules and past decisions.
  - Frame-breaking doubts: which, if entertained, would collapse the entire decision-making game and thus should be treated as standing fast (i.e., not open to doubt for the purpose of the current proceeding).

  The three tests are ordered and designed to be quick to apply in a 20-minute case. Each test has a scoring mechanism (pass/fail or a quick decision) and a threshold for moving to the next step.

  **Three-Step Checklist:**

  1. **The Rulebook Test (Test for Explicit Framework):**
     - **Check:** Does the doubt directly contradict an explicitly stated rule or procedure in the co-op's governing documents (bylaws, rules, etc.) that is foundational to the board's operation?
     - **Scoring:**
       - If the doubt is about something that is explicitly and clearly stated in the rulebook (e.g., "The board is elected by members and has authority to settle disputes as per Section X"), then it is frame-breaking. **Block the doubt.**
       - If the rulebook does not explicitly cover the point or if the doubt is about the interpretation or application of a rule (not the rule's existence or validity), then it passes this test and moves to Test 2.
     - **Threshold:** Block if explicit rule is challenged; else, proceed.

  2. **The Precedent Test (Test for Implicit Framework):**
     - **Check:** Does the doubt undermine a settled practice or precedent that the co-op has consistently relied upon in past decisions (even if not explicitly written)?
     - **Scoring:**
       - Consider: Has this practice been consistently followed and treated as binding in past cases? Is it so ingrained that without it, the board's ability to function would be compromised?
       - If the doubt targets a practice that is both (a) long-standing and (b) necessary for the board's functioning (e.g., accepting meeting minutes as valid records, respecting past board decisions), then it is frame-breaking. **Block the doubt.**
       - If the doubt is about a specific instance that does not challenge the entire precedent system (e.g., "The March minutes were not properly taken" vs. "Minutes are never valid"), then it passes and moves to Test 3.
     - **Threshold:** Block if the doubt attacks a foundational precedent; else, proceed.

  3. **The Collapse Test (Test for Game Sustainability):**
     - **Check:** Would allowing this doubt to be investigated within the current proceeding make it impossible to proceed with the case or undermine the very process of dispute resolution?
     - **Scoring:**
       - Imagine if we had to prove the thing being doubted in order to even start the investigation: would that require stepping outside the framework entirely? (e.g., "Prove the board has authority" when the board's authority is the basis for the proceeding).
       - If entertaining the doubt would require the board to step outside its role (e.g., to prove its own legal existence) or would paralyze the process (e.g., by requiring an infinite regress of proofs), then it is frame-breaking. **Block the doubt.**
       - Otherwise, the doubt is frame-internal and should be investigated.
     - **Threshold:** Block if the doubt causes paralysis or requires abandoning the framework; else, investigate.

  **Summary of Flow:**
  - Start with Test 1: Rulebook. If the doubt attacks an explicit rule, block and stop.
  - If not, go to Test 2: Precedent. If the doubt attacks a foundational precedent, block and stop.
  - If not, go to Test 3: Collapse. If investigating the doubt would collapse the game, block; else, investigate.

  **Human Judgment Spots:**
  - Test 1: Judgment on whether the rule is explicit and foundational (but if it's in the rulebook and directly contradicts the doubt, it's clear).
  - Test 2: Judgment on what counts as a "foundational precedent" (requires board members to recall or note common practices).
  - Test 3: Judgment on whether the doubt would cause paralysis (requires imagining the consequences of entertaining the doubt).

  **What This Cannot Handle:**
  - Radical skepticism (e.g., "we are in a simulation", "the past is an illusion", or "all documents are forgeries") because these are not about the co-op's framework but about reality itself. Such doubts are always frame-breaking because they attack the possibility of any shared framework. The board is not equipped to handle them and should block them.

  ---

  **Application to Cases:**

  **Case 1: "The March minutes were forged."**
  - Test 1 (Rulebook): Does the rulebook explicitly say that minutes are incontestable? Probably not. So we pass to Test 2.
  - Test 2 (Precedent): Challenging the authenticity of specific minutes is common in dispute resolution. It does not attack the entire practice of keeping minutes. Precedent allows for challenges to specific records. Pass to Test 3.
  - Test 3 (Collapse): We can investigate this without collapsing the game. We can look at evidence (e.g., signatures, other records). It's frame-internal. **Investigate.**

  **Case 2: "Our board has no legal authority at all."**
  - Test 1 (Rulebook): The rulebook almost certainly states the board's authority (e.g., in bylaws). This doubt directly attacks an explicit rule. **Block the doubt.**

  **Case 3: Weird Middle Case (Example: "The entire meeting process is invalid because the co-op is fundamentally illegitimate.")**
  - Let's say a member claims the co-op was formed improperly 20 years ago and thus all subsequent decisions (including the board's authority) are void.
  - Test 1 (Rulebook): The rulebook may not explicitly address the formation 20 years ago. So we pass.
  - Test 2 (Precedent): The co-op's existence and the board's operation are foundational precedents. Without accepting the co-op's legitimacy, we cannot proceed. This attacks a foundational precedent. **Block the doubt.**
  - But you (the user) think it should go through? Why? Maybe because it's a specific historical claim that could be investigated? However, note:
    - The board is not a court. It operates under the current framework. Challenging the entire foundation of the co-op is frame-breaking because it would require stepping outside the current system to prove the system's validity. That's a job for a court, not the board.
    - Therefore, the checklist blocks it. But if you feel it should be investigated, it might be because you see a way to do it without collapsing the game? For example, if there is a clear, non-paralyzing procedure in the rules for challenging the co-op's legitimacy? Then:
      - Test 1: If the rulebook has a procedure for such a challenge (e.g., a referendum or court referral), then the doubt becomes frame-internal because it's governed by a rule. So we would pass Test 1 and then in Test 2, we note that the procedure itself is the precedent. Then Test 3: if following that procedure doesn't collapse the current case (e.g., by suspending the board until the challenge is resolved), then it might be investigated. But note: the board might not be the right body to investigate its own legitimacy.

  **Revised Weird Case to Illustrate a Conflict:**
  Let's choose a different middle case that the checklist might block but you think should go through:

  *Case 3: "The board's decision in the March meeting was invalid because the meeting was held on a day that is considered inauspicious by my religion, and therefore the entire meeting is void."*

  - Test 1 (Rulebook): The rulebook likely does not address auspicious days. Pass.
  - Test 2 (Precedent): There is no precedent for voiding meetings based on religious auspiciousness. But is this a foundational precedent? The board uses standard procedures (e.g., proper notice, quorum) to validate meetings. This challenge is not about those. It's about an external factor. However, if we allow any member to void a meeting based on personal beliefs, it would undermine the stability of all past decisions. So it attacks the precedent of using objective, shared criteria for meeting validity. **Block?** (by Test 2)
  - Test 3 (Collapse): If we had to validate every meeting against every member's religious calendar, it would be paralyzing. So **block**.

  But you might argue: What if the rulebook says "Meetings must be held on days that do not conflict with major religious holidays"? Then Test 1 would pass and we would investigate. But without that rule, it's blocked.

  **Why might you want it to go through?** Perhaps because of an overarching rule about religious accommodation? But if that rule exists, then Test 1 would catch it. Without it, the doubt is frame-breaking because it introduces a new standard that isn't part of the shared framework.

  **Final Note:** The checklist is designed for efficiency and to protect the framework. It will err on the side of blocking doubts that threaten the game. In borderline cases, the board's judgment in interpreting the tests is key.
answer: |-
  Based on Wittgenstein's hinge concept, here's a concrete 3-step checklist for your board to distinguish **frame-internal doubts** (investigate) from **frame-breaking doubts** (block). Each step has a binary yes/no question and a quick scoring rule. Aim for unanimous or majority agreement on each step within 2-3 minutes. If blocked, state: "This challenge undermines our shared foundation; we must treat [X] as settled for this proceeding."

  ---

  ### **Hinge Test Checklist**
  **Purpose:** Decide if a challenge attacks the *framework itself* (block) or operates *within* the framework (investigate).

  1. **The Rulebook Anchor**  
     *Question: "Is this challenge based on our written rules or past decisions?"*  
     - **YES** → *Proceed to Step 2* (it's frame-internal so far).  
     - **NO** → **BLOCK** (it rejects the game entirely).  
     *Quick score:* If the challenger cites bylaws, minutes, or prior rulings → YES. If they dismiss all rules as invalid → NO.  

  2. **The Precedent Consistency Check**  
     *Question: "Would accepting this doubt *force us to invalidate* multiple past decisions or core procedures?"*  
     - **NO** → *Proceed to Step 3* (likely frame-internal).  
     - **YES** → **BLOCK** (it collapses the game).  
     *Quick score:* If disproving it would only affect *one* case/meeting → NO. If it would nullify >20% of past rulings or a core process (e.g., all meetings) → YES.  

  3. **The Practical Collapse Test**  
     *Question: "Can we resolve this *using our normal tools* (e.g., reviewing evidence, voting) without halting all other work?"*  
     - **YES** → **INVESTIGATE** (frame-internal).  
     - **NO** → **BLOCK** (it paralyzes the system).  
     *Quick score:* If evidence can be checked in <10 mins (e.g., re-read minutes) → YES. If it requires "proving" the board's existence or rewriting the rulebook → NO.  

  ---

  ### **Applied to Your Cases**
  **Case 1: "The March minutes were forged."**  
  - Step 1 (Rulebook Anchor): YES (challenge cites a specific document → internal).  
  - Step 2 (Precedent Consistency): NO (if forged, only March is affected).  
  - Step 3 (Practical Collapse): YES (compare to other records; takes minutes).  
  → **INVESTIGATE** (correct outcome).  

  **Case 2: "This board has no legal authority."**  
  - Step 1 (Rulebook Anchor): NO (rejects all rules/authority → not internal).  
  → **BLOCK** (correct outcome; no need for further steps).  

  **Case 3: "We shouldn't follow past decisions because the founding members were biased."**  
  - *Why you might want it through:* Feels like a substantive justice argument.  
  - **Checklist outcome:**  
    - Step 1: YES (challenges past decisions → internal).  
    - Step 2: **YES** (invalidating founding members' decisions collapses *all* prior rulings).  
    → **BLOCK** (hinge: past decisions "stand fast").  
  - *Why checklist blocks it:* The board can't function if every ruling requires re-litigating history. Your intuition might stem from fairness, but the hinge framework prioritizes *procedural survival* over individual grievances.  

  ---

  ### **Where Human Judgment is Unavoidable**
  1. **Step 2 (Precedent Consistency):** Deciding "core procedures" requires group judgment (e.g., "Are meeting minutes core?" → yes; "Is a specific vote format core?" → maybe).  
  2. **Step 3 (Practical Collapse):** Estimating "normal tools" is subjective (e.g., Is a 1-hour legal opinion "normal"?).  
  3. **Edge Cases:** When a challenge *partially* attacks the framework (e.g., "All meetings since 2020 are invalid"), the board must interpret severity.  

  ---

  ### **What This Can't Handle**
  - **Radical Skepticism:** Claims like "we're in a simulation" or "the past is an illusion." These aren't *procedural* challenges—they deny shared reality. Block immediately.  
  - **Moral Revolutions:** If 80% of members suddenly reject the rules, this tool assumes the framework *holds*. It can't resolve existential crises (e.g., disbanding the co-op).  
  - **External Authority:** Legal threats (e.g., "I'll sue") or external audits override this—defer to lawyers.  

  ---

  **Final Tip:** Keep a printed copy of this checklist at meetings. For blocked cases, say: "This challenge would undo our shared foundation. We must proceed on the basis that [X] is settled." This forces disputes *inside* the game—where your board has tools to act.
