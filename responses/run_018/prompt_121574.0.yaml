  I just finished a long, somewhat frustrating argument with a friend over whether Nozick's tracking theory genuinely solves the closure problem or merely relocates it into hidden conditions on belief-formation. I'm applying for a one-semester graduate research grant—roughly four months, about 8,000 words—to turn this tension into a focused philosophical project. The half-formed idea I want sharpened is this: the standard closure debate treats tracking as a binary relation holding between a subject and an individual proposition, but I suspect there is an unexamined distinction between tracking a proposition via a particular method M and tracking the modal stability of M itself across nearby worlds. Specifically, I want to ask whether Nozick's conditions entail that closure holds reliably for first-order empirical beliefs formed through M, but systematically fails for second-order beliefs about whether M is itself tracking-reliable, and whether that asymmetry is a feature that blocks skeptical regress or a bug that undermines self-knowledge of one's epistemic position.

  Turn this into a formal proposal with a precise statement of the research question, an explanation of why existing discussions of closure under tracking leave this specific asymmetry open, a clear methodological plan for how you would actually investigate it over one semester—including which puzzle cases you would construct, whether you would attempt any formal modeling of method-level sensitivity, and what considerations would decide between interpreting the asymmetry as principled versus artifactual—plus a candid assessment of what could make the project fail or prove too large for the time available, and what a successful deliverable would actually look like. Please do not include a bibliography, reading list, or citation requests; I will supply references myself. Finally, in your analysis, please clearly separate what is settled about Nozick's tracking conditions from what remains genuinely contested among epistemologists, and avoid presenting any particular interpretation—especially regarding method-level tracking or second-order closure—as if it were the consensus view.
