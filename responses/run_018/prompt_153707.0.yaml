  Below is a diagnostic decision tree with seven branching questions designed to sort participants by their judgments on concrete cases, avoiding specialized jargon. Each question is phrased to be accessible without prior knowledge of material constitution theories. The tree maps combinations to named philosophical positions, flags unoccupied nodes, and identifies indistinguishable views with suggestions for further distinction.

  ---

  ### **Decision Tree Questions**
  1. **Gradual Replacement (Statue)**:  
     *If we gradually replace every particle of the clay statue with new particles (one by one), does the **original statue** still exist at the end?*  
     - (a) Yes, the statue survives.  
     - (b) No, the statue is destroyed.  

  2. **Gradual Replacement (Clay)**:  
     *In the same process (gradual particle replacement), does the **original clay** still exist at the end?*  
     - (a) Yes, the clay survives.  
     - (b) No, the clay is destroyed.  

  3. **Squashing (Statue)**:  
     *If we squash the statue into a cube, destroying its statue-form, does the **original statue** still exist?*  
     - (a) Yes, the statue survives (e.g., as a cube).  
     - (b) No, the statue is destroyed.  

  4. **Squashing (Clay)**:  
     *After squashing the statue into a cube, does the **original clay** still exist?*  
     - (a) Yes, the clay survives (as a cube).  
     - (b) No, the clay is destroyed.  

  5. **Co-location**:  
     *Before any changes, when the statue exists and is made of clay, do the statue and the clay **occupy the exact same space** at that time?*  
     - (a) Yes, they share the same space completely.  
     - (b) No, they do not (e.g., one is part of the other).  

  6. **Form Essentiality (Statue)**:  
     *Must the statue **retain its specific form** (e.g., statue-shape) to continue existing? If it loses this form, does it cease to exist?*  
     - (a) Yes, form is essential (it cannot exist without it).  
     - (b) No, form is not essential (it can exist without it).  

  7. **Temporal Ontology**:  
     *When an object persists through time (e.g., from Monday to Friday), is the **whole object fully present** at each moment (like a melody playing), or is each moment just a "slice" of a larger 4D whole (like a film strip)?*  
     - (a) Whole object present at each time.  
     - (b) Only a "slice" (temporal part) exists at each time.  

  ---

  ### **Branching Logic & Named Views**  
  *Key*:  
  - `S` = Statue, `C` = Clay, `GR` = Gradual Replacement, `SQ` = Squashing.  
  - **Bold** = Terminal node with a named view.  
  - 💀 = Unoccupied or unstable combination.  

  #### **Step 1: Co-location (Q5)**  
  - **(a) Co-location accepted (statue and clay share space)** → Proceed to *Step 2*.  
  - **(b) Co-location denied** → Only rare or niche views (e.g., *mereological nihilism*). Not mapped here due to scarcity of adherents.  

  #### **Step 2: Gradual Replacement (Q1 & Q2)**  
