answer: |-
  Here is a rigorous conceptual diagnosis of Bentham's "self-regarding injury" within his utilitarian framework:

  1.  **The Core Utilitarian Claim:** Bentham's foundational principle is that law's sole legitimate purpose is preventing harm to others (non-consensual harm via coercion/deception). Social prejudice, not the acts themselves, causes the primary suffering associated with consensual "deviant" acts. This is logically consistent and radical for its time.

  2.  **The Problematic Category - Self-Regarding Injury:** This category captures acts deemed harmful *only* to the actor's *own* long-term pleasure potential, absent harm to others. Bentham insists correction is justified solely by this future, quantifiable pleasure deficit.

  3.  **Conceptual Tension Points:**
      *   **Quantification vs. Normative Weight:** The core tension lies in the leap from predicting "long-term reduction of pleasure" to justifying "correction" or labeling it an "injury." How is this reduction measured objectively? Bentham lacks a psychological model (like adaptive preferences) to rigorously demonstrate individuals systematically misjudge their *own* future utility concerning sexual habits. The move from predictive hedonism ("this *might* reduce your future pleasure") to normative judgment ("this *is* an injury requiring correction") is not self-evident within his calculus. The vocabulary ("injury," "offence," "correction") inherently imports normative concepts of *wrongness* or *defect* that his quantitative hedonism struggles to ground purely in aggregated future pleasure units.
      *   **The Source of "Harm":** What *constitutes* the "long-term reduction of pleasure"? Is it:
          *   Intrinsic physiological/psychological consequences (plausible, but Bentham provides no evidence)?
          *   Social consequences *stemming from prejudice* (e.g., ostracism, loss of opportunities)? This directly contradicts his argument that prejudice itself is the illegitimate source of harm for other-regarding acts. If the "injury" arises from social condemnation, then the target of correction should be the prejudice, not the act.
          *   A tacit appeal to a normative standard of "healthy" or "natural" sexuality? This would be an external norm smuggled in, incompatible with his professed hedonism.
      *   **The Mechanism of "Correction":** If not law, what form does this "pedagogical correction" take? Bentham is vague, but any institutional or social mechanism risks becoming a vehicle for enforcing dominant norms under the guise of benevolent utility-maximization. This creates a conceptual space where social disgust, disavowed at the legal level, can re-enter through the back door of "enlightened guidance."

  4.  **Structural Problem Exposed:** This is not merely a simple inconsistency but exposes a deeper flaw in aggregative, individualistic utilitarianism when applied to socially embedded practices:
      *   **Isolation of the Individual:** Bentham's framework treats individuals as atomistic pleasure-calculators. It struggles to account for how the *meaning*, *experience*, and *consequences* of acts (especially sexual ones) are fundamentally shaped by intersubjective recognition, social structures, and institutional contexts. The "self" harmed in a "self-regarding injury" cannot be cleanly separated from the social matrix that defines the act and its potential repercussions.
      *   **The Myth of Value-Neutral Calculation:** The attempt to define "self-regarding injury" based purely on future pleasure calculations fails. The very identification of certain habits as pleasure-reducing *in the long term* relies on implicit normative judgments about what constitutes a good life or proper functioning, judgments inevitably influenced by prevailing social norms (disguised as objective utility). The "correction" aimed at these "injuries" becomes a mechanism for shaping preferences to align with dominant (and unexamined) conceptions of well-being.
      *   **Anticipation of Later Critiques:**
          *   **Feminist Philosophy:** This anticipates critiques (e.g., Catharine MacKinnon, Michel Foucault) that frameworks claiming neutrality (like law or utility) often mask power dynamics and enforce normative standards (e.g., heteronormativity) by individualizing harm ("your choice harms *you*") and obscuring how social structures create the conditions for perceived "self-harm."
          *   **Theories of Institutional Design:** It foreshadows problems in designing institutions that purport to be neutral (focusing only on preventing direct harm to others) but inevitably shape behavior and preferences through indirect means ("pedagogical correction"), raising issues of paternalism, hidden coercion, and the difficulty of separating private choice from its social constitution.

  **Summary:** Bentham's "self-regarding injury" functions as an unstable conceptual hybrid within his utilitarian framework, attempting but failing to reduce moral correction to pure forward-looking hedonic calculation; its reliance on normative language and vulnerability to covertly reinstating social norms through "enlightened" pedagogy exposes a fundamental tension in individualistic utilitarianism – its inability to fully account for the intersubjective constitution of meaning, harm, and identity within social practices, thus anticipating later critiques about the inseparability of the self from its institutional and normative context.
