  Applying Rule B: The system's role is clinical support. The categorical display serves administrative needs, not clinical ones. Since physicians know the categories are simplified, it might not violate role obligations, so not deceptive.

  I think their board likely uses Rule B, given how they ruled in Precedent 2 (allowed neutrality despite internal bias) and Precedent 4 (allowed interpretation with data available).

