  The user needs a practical procedure to test metrics before committing money to them. This needs to be something their team of four analysts can actually run with limited time (about two days per metric) using available documents like prior-year data, contract records, and audit files. The procedure must identify different ways indicators can stop tracking what they're supposed to track and provide clear stop/go decisions.

  Key requirements include: distinguishing between different types of metric degradation; handling cases where no baseline data exists; acknowledging which steps involve judgment; settling an internal debate about whether some metrics are "constitutive" rather than evidential; and addressing how anti-gaming checks themselves might become targets.

  I'll need to develop a step-by-step procedure organized into phases: first checking if the metric represents a real outcome, then testing for vulnerability to gaming, and finally examining its practical implementation. Each step needs clear questions, data sources, decision rules, and assigned responsibilities.

  For the constitutive/evidential debate: I agree with the user that this distinction doesn't eliminate gaming risks. Even seemingly direct measures like waiting times can be gamed through record manipulation or case selection. The procedure should treat these metrics similarly but with extra scrutiny on data integrity.

  The procedure will include explicit anti-gaming monitors but position them as tripwires rather than targets, with severe consequences for breaches to prevent them from becoming new optimization targets.

  I'll apply the procedure to three test cases: employment sustainability (13/26 weeks in work), assessment timeliness (90% within 5 days), and wellbeing improvement. I expect at least one will fail - likely the wellbeing score due to measurement issues and gaming vulnerabilities.

  The epistemic section will note that the procedure is strongest against observable gaming but weaker against subtle behavioral shifts or when providers have superior information. Confidence levels will vary by step, with higher confidence in detecting obvious gaming and lower confidence in predicting long-term degradation.
answer: |-
  ## Procedural Framework for Metric Validation: Preventing Proxy Degradation in Outcome-Based Commissioning

  *Internal Brainstorming:*
  *(a) Ways indicators degrade:*
  1. **Conceptual drift:** Proxy becomes weakly correlated with true outcome over time/context
  2. **Non-linearity:** Correlation weakens specifically at high performance levels (where payment bites)
  3. **Symptom-not-lever:** Moving the proxy doesn't causally change the true outcome
  4. **Adversarial reshaping:** Provider actions increase the metric while worsening true outcomes (e.g., creaming, coaching to the test)
  5. **Data degradation:** Manipulation of recording (e.g., upcoding, false entries, omission)
  6. **Population reshaping:** Changing who enters the count (e.g., exclusion of hard cases, reclassification, selection bias)
  7. **Effort substitution:** Resources diverted from true outcome to metric optimisation

  *(b) Sorting by mechanism:*
  - **Changing what it does (Provider Actions):** 3, 4, 7
  - **Changing what it records (Data):** 5
  - **Changing which cases enter (Population):** 6
  - **Inherent Proxy Weakness (Design):** 1, 2

  *(c) Detectable by small team pre-commitment:** 1 (partially), 2, 3 (partially), 5 (partially), 6. (4 & 7 often require post-implementation monitoring but precursors can be spotted).

  ---

  **Deliverable: Metric Validation Procedure (v1.0)**

  **Purpose:** To identify and mitigate risks of metric degradation *before* financial commitment, ensuring payment drives genuine outcomes. Uses existing documentation & rapid investigation.

  **Core Principle:** All quantitative performance metrics are vulnerable to Goodhart-type degradation ("When a measure becomes a target, it ceases to be a good measure"). The severity and mechanism vary.

  **Phase 0: Setup**
  *   **Question:** Can the proposed metric be meaningfully tested with available resources/time?
  *   **Sufficient Answer:** Clear operational definition exists; necessary prior-year/provider data is accessible within 48 analyst-hours; true outcome is defined (even if imperfectly).
  *   **Documents:** Metric specification, data dictionary, prior-year data availability log.
  *   **Stop Rule:** **Kill/Escalate** if definition is fatally ambiguous, no baseline data exists *and* no plausible comparison can be constructed (Requirement 3), or true outcome is utterly undefined. Escalate to Programme Director + Finance Director for values decision if true outcome is contested internally.
  *   **Responsibility:** Lead Analyst (Judgement: Feasibility).
  *   **Confidence:** High. Grounded in data availability.

  **Phase 1: Conceptual Validity & Baseline Check**
  *   **Step 1: Symptom or Lever?**
      *   *Question:* If providers improve this metric, is it *plausible* this was achieved *by* improving the true outcome? Or could it be achieved *despite* worsening it, or by unrelated means?
      *   *Sufficient Answer:* Evidence/logic showing a causal pathway exists (e.g., theory of change, prior research, provider interviews on how they'd improve it). Lack of evidence for *only* harmful pathways.
      *   *Documents:* Programme logic model, academic literature (brief review), interviews (2 providers + internal staff).
      *   *Stop Rule:* **Send Back** if strong evidence/metric logic suggests it's purely a symptom (e.g., improving "wellbeing score at exit" doesn't plausibly *cause* sustained employment) *or* if only paths to improvement involve harming true outcome. **Escalate** if causal link is fundamentally contested (values).
      *   *Responsibility:* Lead Analyst (Judgement: Causal plausibility).
      *   *Confidence:* Medium. Relies on theory/logic; counterfactuals hard pre-implementation. Depends on Campbell's "proximal similarity of cause".
  *   **Step 2: Baseline Distribution & Top-End Sensitivity**
      *   *Question:* a) Does prior-year data show sufficient variance? b) Is there evidence the correlation with true outcome (or best available proxy) weakens at the top end?
      *   *Sufficient Answer:* a) Distribution isn't clustered near ceiling/floor. b) No strong evidence (e.g., scatterplots vs. other outcomes, provider interviews) that top performers achieved it via gaming/selection rather than genuine improvement. Check for "too good to be true" clusters.
      *   *Documents:* Prior-year metric distribution, prior-year *correlates* (e.g., sustained employment vs. 13-week measure), provider audit files (discrepancies/complaints re: similar metrics).
      *   *Stop Rule:* **Cap Payment** if variance is low (e.g., >80% already near target) OR strong evidence top-end correlation weakens (e.g., providers with highest metric show no better/worse on true outcome). **Kill/Send Back** if clustered at ceiling/floor with no room for improvement. **Escalate** if defining "sufficient variance" is contested.
      *   *Responsibility:* Analyst (Data) + Lead Analyst (Judgement: Variance adequacy, top-end risk).
      *   *Confidence:* High (variance), Medium (top-end risk - relies on imperfect correlates). Assumes prior year reflects "ungamed" state.

  **Phase 2: Gaming & Data Vulnerability**
  *   **Step 3: Population Reshaping Risk**
      *   *Question:* How easily could providers improve the metric by changing *who* is counted (selection, exclusion, reclassification) rather than improving outcomes for all?
      *   *Sufficient Answer:* Evidence that manipulation routes are difficult/risky/detectable (e.g., strict eligibility criteria, audit trail for exclusions, independent registration). Low prior exclusion rates. Provider interviews confirm barriers to creaming/parking.
      *   *Documents:* Contract rules (eligibility, exclusion protocols), prior-year exclusion/withdrawal rates & reasons, audit reports on casefiles.
      *   *Stop Rule:* **Cap Payment** or **Add Safeguard** (e.g., strict casefile audit, exclusion cap) if significant risk exists (e.g., easy to exclude hard cases pre-measurement). **Kill/Send Back** if the metric inherently incentivises harmful selection (e.g., payment on job starts strongly encourages creaming).
      *   *Responsibility:* Lead Analyst + Contract Manager (Judgement: Feasibility/detectability of gaming).
      *   *Confidence:* Medium-High. Relies on process design and prior audit findings. Leans on Holmström/Milgrom multi-tasking theory.
  *   **Step 4: Data Degradation Risk**
      *   *Question:* How vulnerable is the recording process to manipulation (falsification, upcoding, omission) without detection? Is verification independent and timely?
      *   *Sufficient Answer:* Data sourced independently (e.g., HMRC, DWP) OR verified robustly (e.g., sample audits, cross-check with independent source, provider incentives aligned against false reporting). Low prior discrepancies found in audits.
      *   *Documents:* Data collection protocol, verification procedures, prior audit findings on data accuracy, provider fraud training records.
      *   *Stop Rule:* **Kill/Send Back** if highly vulnerable *and* no feasible independent verification exists (e.g., complex self-reported scores). **Cap Payment** or **Require Enhanced Audit** if vulnerability is medium but verifiable. Proceed if low risk (e.g., verified administrative data).
      *   *Responsibility:* Lead Analyst + Auditor (Judgement: Vulnerability & verifiability).
      *   *Confidence:* High if independent data/audit; Low if solely provider-reported without audit.

  **Phase 3: Anti-Gaming & Implementation**
  *   **Step 5: Anti-Gaming Monitors (The Tripwires)**
      *   *Question:* What specific, monitorable indicators can detect likely gaming *of this metric*? How will we monitor them without creating *new* targets?
      *   *Sufficient Answer:* 2-3 specific, high-sensitivity "tripwires" defined (e.g., % uncontactable for work verification, rate of participant re-registration within X months, variance in participant characteristics vs. intake). Monitoring plan: routine reporting with *automatic, severe consequences* for breaches (e.g., payment withheld, audit triggered) – **not** targets to be optimized.
      *   *Documents:* Analysis of prior gaming patterns, provider interviews on potential loopholes.
      *   *Stop Rule:* **Send Back** if no feasible, sensitive tripwires can be defined. **Require Monitors** for all live metrics. (Requirement 6)
      *   *Responsibility:* Lead Analyst + Auditor.
      *   *Confidence:* Medium. Identifying sensitive indicators is possible; preventing *their* gaming relies on severe consequences & not publishing them as targets. Based on "ratchet effect" observations.
  *   **Step 6: Constitutive vs. Evidential Check**
      *   *Question:* Is hitting the number *partly constitutive* of the good (e.g., a timely assessment *is* part of good service), or purely *evidential* of a separate good (e.g., 13 weeks work evidences sustained employability)? (Requirement 5)
      *   *Sufficient Answer:* Clear articulation. *My View:* The distinction is **real but not protective**. Constitutive metrics (e.g., assessment timeliness) are *still* vulnerable to data degradation (Step 4) and harmful reshaping (e.g., rushing assessments to hit time target, thus reducing quality - Step 1/Step 3). They avoid *some* conceptual drift but not all risks.
      *   *Action:* Constitutive metrics proceed but **require extreme rigour in Step 4 (Data Risk)** and **Step 1 (Symptom/Lever - ensure achieving the measure doesn't degrade related unmeasured quality)**. Escalate if constitutive nature is disputed.
      *   *Responsibility:* Lead Analyst + Programme Director (Judgement: Nature of metric).
      *   *Confidence:* High on distinction, Medium on residual risks. Based on Cartwright's "capacity concepts" vs. "token measures".

  **Phase 4: Final Recommendation**
  *   **Synthesise:** Review findings from all steps. Weigh residual risks against benefit of using the metric.
  *   **Recommendation Options:** Proceed (Full Weight), Proceed (Capped Payment), Proceed (With Specific Safeguards), Redesign Required, Kill Metric, Escalate (Values Decision).
  *   **Responsibility:** Lead Analyst (Draft), Performance & Payment Team Lead (Final Sign-off).

  **Blind Spots & Underpinnings:**
  *   **Operationalizes:** Primarily Goodhart's Law (metric distortion under incentive) and Campbell's Law, focusing on *actionable* degradation pathways pre-commitment. Builds on multi-tasking theory (effort substitution) and principal-agent problems.
  *   **Does Not Protect Against:**
      *   Subtle, undetectable gaming not captured by tripwires.
      *   Long-term conceptual drift not evident in baseline/top-end checks.
      *   Unforeseen provider innovations in gaming post-implementation.
      *   "Effort substitution" (Requirement 2 point 7) is hard to detect pre-emptively; relies on Step 1 & post-monitoring.
      *   True outcome degradation masked by the proxy *appearing* stable.
      *   Assumption: Providers are rational responders to incentives (test via interviews). Contestable if culture dominates incentives.
      *   **Key Lean:** Assumes prior-year data is a valid "ungamed" baseline. Challenged if gaming was already present.

  ---

  **Application to Candidate Metrics**

  **(a) Payment on share in paid work ≥13/26 weeks post-exit:**
  *   **Step 0 (Setup):** Survives. Data (DWP/HMRC) exists, definition clear, true outcome ("sustained employment") defined.
  *   **Step 1 (Symptom/Lever?):** Survives (cautiously). 13+ weeks *plausibly* indicates movement towards sustained employment, but could be achieved via short-term/junk jobs. **Residual Risk:** Effort substitution towards quick, unstable jobs.
  *   **Step 2 (Baseline/Top-End):** **Cap Payment.** Prior data likely shows variance, but high risk top performers achieve it via selection/creaming (e.g., focus on job-ready) rather than genuine uplift for all. Interview providers on how they'd achieve high scores.
  *   **Step 3 (Population Reshaping):** **High Risk / Add Safeguard.** Strong incentive to cream (select easiest) or park (ignore hardest). Requires robust audit on participant selection/exclusion and **tripwire:** Monitor characteristics (e.g., benefit duration, health flags) of participants vs. overall caseload.
  *   **Step 4 (Data Risk):** Survives. HMRC/DWP data is robust & independent. Low risk.
  *   **Step 5 (Anti-Gaming):** Requires Tripwires: e.g., % uncontactable for employment verification at week 26, re-registration rate within 39 weeks.
  *   **Step 6 (Constitutive):** Evidential. Proceed with caution.
  *   **Recommendation:** **Proceed with Capped Payment** (e.g., max 60% of outcome pot) + **Enhanced Safeguards** (tripwires + selection bias audit). High risk of paying for churn, not sustainability.

  **(b) Payment on 90% of initial assessments completed within 5 working days of referral:**
  *   **Step 0:** Survives. Definition clear, data should exist (system timestamps).
  *   **Step 1 (Symptom/Lever?):** **Constitutive BUT Send Back for Redesign.** Timeliness *is* part of good service. However, strong risk that hitting the time target degrades *assessment quality* (rushing, box-ticking) – harming the true outcome (effective support planning). Interviews likely reveal pressure to rush.
  *   **Step 2 (Baseline/Top-End):** Check prior timeliness vs. quality scores/complaints. If high performers show lower quality, **Kill**.
  *   **Step 3 (Population):** **Risk - Add Safeguard.** Could exclude complex cases needing longer assessments. Require audit of exclusions/reasons. Tripwire: Variance in assessment duration/complexity by participant type.
  *   **Step 4 (Data):** **High Risk If Self-Reported.** If timestamped automatically in CRM, low risk. If provider logs start time, **Kill/Send Back** (vulnerable to false logging). **Must be system-verified**.
  *   **Step 5:** Requires Tripwires: e.g., complaints about assessment quality, % assessments flagged as "incomplete" needing follow-up.
  *   **Step 6:** **Constitutive.** Proceed only if Step 4 risk is mitigated (system data) and Step 1 redesign incorporates quality assurance.
  *   **Recommendation:** **Send Back for Redesign.** Integrate a *quality threshold* (e.g., minimum components covered, validated by audit) alongside the timeliness target. Only proceed if data is system-verified. High risk of paying for rushed, ineffective assessments.

  **(c) Payment on improvement in participant-reported wellbeing/confidence score at exit:**
  *   **Step 0:** **Kill / Send Back (Redesign Unlikely).** True outcome ("improved wellbeing") is contested internally. Baseline distribution may be skewed (social desirability bias). Definition ("meaningful improvement") ambiguous.
  *   **Step 1 (Symptom/Lever?):** **Kill.** Improvement on a provider-collected, self-reported score is highly vulnerable. Providers can easily coach responses ("Remember to say you feel confident!") or select participants likely to report improvement. No plausible lever to true wellbeing. Interviews would reveal coaching risk.
  *   **Step 2 (Baseline/Top-End):** N/A - Failed Step 0/1. Prior data likely unreliable.
  *   **Step 3 (Population):** **Extreme Risk.** Massive incentive to select easy participants and avoid those with complex needs unlikely to report quick gains.
  *   **Step 4 (Data):** **Kill.** Provider-collected, self-reported, subjective scores are highly vulnerable to manipulation and bias. No feasible independent verification.
  *   **Recommendation:** **Kill Metric.** Fundamentally unsuitable for high-stakes payment. Risks paying for coaching, selection, and false reporting, not genuine wellbeing gain.

  **Argument for Finance Director (Re: Wellbeing Score - Candidate c):**

  **Subject: Recommendation: Withdraw Wellbeing Score Outcome Metric - High Risk of Paying for False Gains**

  **Issue:** The proposed payment metric based on provider-collected participant wellbeing/confidence score improvement is fundamentally unsound for tying 25% (£10m) of fees. It carries unacceptable risks of paying for manipulated or meaningless results, not genuine participant outcomes.

  **Why it Fails Validation:**

  1.  **Not a Reliable Lever:** Improving a self-reported score collected by the provider *does not* reliably indicate or cause genuine wellbeing improvement. Providers can easily influence responses through coaching or pressure. We would pay for reported feelings, not real change.
  2.  **Extremely Vulnerable to Gaming:** The validation process revealed clear, high-probability routes for distortion:
      *   **Coaching:** Staff telling participants how to answer to "pass".
      *   **Selection:** Avoiding participants with deep-seated issues unlikely to report quick gains (parking).
      *   **False Reporting:** Potential for providers to falsify scores directly.
  3.  **No Verifiable Baseline:** Prior data is unreliable due to collection method. We lack a trustworthy starting point or way to audit genuine improvement.
  4.  **Contested Outcome:** Internally, we haven't agreed what "meaningful and sustained wellbeing improvement" actually means, making the metric inherently ambiguous.

  **Consequence:** Committing £10m to this metric risks:
  *   Paying millions for providers to game the system, not improve lives.
  *   Diverting resources from effective support to coaching for the survey.
  *   Undermining programme credibility and provoking disputes/remediation costs.
  *   Failing the long-term unemployed we aim to serve.

  **Action Required:** Withdraw this metric from the payment model for Contract Year 2025/26. Reallocate the outcome funding portion (£10m) to metrics passing validation (e.g., potentially capped versions of employment sustainability) or hold pending development of a robust alternative. We cannot responsibly attach significant payment to this measure.

  ---

  **Epistemic Assessment**

  *   **Confidence & Vulnerability by Step:**
      *   **Step 0 (Setup):** High Confidence. Grounded in practical feasibility.
      *   **Step 1 (Symptom/Lever):** Medium Confidence. Judgement-based (causal pathways). Vulnerable to unforeseen mechanisms. *Mind Change:* Strong evidence (e.g., RCT) showing metric movement *only* via harmful pathways.
      *   **Step 2 (Baseline/Top-End):** High (Variance), Medium (Top-End Risk). Top-end relies on correlates. *Mind Change:* Clear data showing strong correlation holds even at very high performance levels.
      *   **Step 3 (Population):** Medium-High Confidence. Based on process design & audit history. *Mind Change:* Evidence that provider caseloads are immutable or manipulation is impossible.
      *   **Step 4 (Data):** High (Independent Data), Low-Medium (Self-Reported). *Mind Change:* Development of cheap, real-time, tamper-proof verification.
      *   **Step 5 (Tripwires):** Medium Confidence. Identifying proxies for gaming is plausible; preventing *their* degradation relies on consequence design. *Mind Change:* Evidence that severe consequences fail to deter gaming of monitors.
      *   **Step 6 (Constitutive):** High (Distinction), Medium (Residual Risk Mitigation). *Mind Change:* Clear case where achieving the measure *cannot* harm related quality (rare).

  *   **Likely Misfires:**
      *   **Too Harsh On:** Complex, multi-dimensional true outcomes where any single proxy has weaknesses, but it's the best available *and* gaming risks are manageable. Requires careful "Proceed with Cap/Safeguard" judgement.
      *   **Too Lenient On:** Metrics where degradation is subtle, long-term, or involves effort substitution not detectable in baseline checks or interviews. Metrics relying on provider self-reports *with* plausible but ineffective audit trails. Metrics where the *only* gaming route is undetectable data falsification.
      *   **Most Vulnerable Assumptions:** 1) Providers respond primarily to financial incentives (culture may mitigate or exacerbate). 2) Prior-year data reflects a "low-gaming" state. 3) Interviewed providers disclose true gaming risks. 4) Tripwire consequences are sufficiently severe and credible.

  This procedure provides robust, actionable defence against the *most common and catastrophic* forms of metric degradation using your resources. It forces explicit consideration of risks often glossed over, particularly population reshaping and data vulnerability. Its strength is practical application of theory; its limitation is the inherent uncertainty of predicting human behaviour under new incentives. Proceed with vigilance and monitored tripwires.
