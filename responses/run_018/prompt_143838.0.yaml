  For the activity flow, I'll start with setup (10 mins), then Observers review their materials while Reporters prepare (15 mins). Then cross-examination (25 mins) where they debate, followed by voting and reveal (10 mins). Finally debriefing (15 mins) to connect to the actual philosophy. 

