prompt: |-
  Next tuesday I'm pitching to the interagency aquaculture welfare panel — mostly marine biologists who study crustacean nociception in the field, a couple vet ethicists who worked on decapod regulations, and one industry rep from a shrimp co-op who mostly cares about feed ratios. My position is that we should drop nociception as the welfare threshold for farmed shrimp and use a "behavioral suppression index" instead — the idea that absence of escape behavior in high-density tanks isn't proof they're okay, it's closer to learned helplessness, and it should trigger stricter stocking limits rather than looser ones. I need my Q&A preperation: about eight objections they'll actually raise, ordered by how much damage they do, phrased the way a field biologist or an ethicist or that industry guy would put it. For each, give me a two-minute reply, flag where the reply is soft, and tell me what I should concede upfront. Include the question I'm hoping nobody asks — probably something about the replication crisis in crustacean pain studies and whether my suppression index survives it. Don't need a bibliography or citation list, just the objections and the counter-replies I can actually defend in the room.
reasoning: |-
