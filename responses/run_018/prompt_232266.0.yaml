  Sestet should explore consequences: indicative points to guilt (chauffeur hangs), counterfactual to possibility (chauffeur free but poor). Final couplet must crystallize the difference: one deals with evidence, the other with imagination. Using "fact" vs. "might" keeps it simple.

  Rhyme scheme check: ABBAABBA for octave, CDECDE for sestet. Iambic pentameter - tricky with "counterfactual," but phrasing like "what might have been" saves it. "Facts we hold" and "worlds untold" as closing rhymes subtly reinforce the real/possible divide.

