  **MUNICIPAL CODE CHAPTER 23.07: DOMESTIC COMPANION ENTITLEMENT ADMINISTRATION**

  **§23.07.010 PURPOSE.** The provisions of this Chapter establish standardized procedures for residents to manage interactions with Non-Person Domestic Companions (hereinafter "Companions"), ensuring all activities comply with foundational entitlement principles while respecting the distinct moral partition between Persons and Non-Persons. This Chapter governs the acquisition, sustenance, interaction, and spatial management of Companions, mandating procedural safeguards to prevent boundary violations and unjust enrichment.

  **§23.07.020 DEFINITIONS.**
  *(a) "Companion"*: Any non-human animal residing within a Person's dwelling unit under conditions implying voluntary cohabitation as determined by historical-acquisition documentation (Form DCE-1).
  *(b) "Interaction"*: Any deliberate act by a Person directed towards a Companion, including but not limited to: provisioning of sustenance, tactile contact, locomotion facilitation (walking), vocal engagement, or spatial co-location for non-instrumental purposes.
  *(c) "Side-Constraint"*: An inviolable prohibition derived from the Companion's minimal negative rights portfolio, primarily prohibiting acts universally recognized as "cruelty," defined as the infliction of severe, unnecessary pain or deprivation impeding basic biological function.
  *(d) "Utility-Offset Calculation"*: The quantifiable assessment required prior to any Interaction exceeding baseline sustenance, wherein the net benefit accruing to the Person (pleasure, convenience, security enhancement) must demonstrably outweigh the Companion's incurred utility costs (time expenditure, caloric loss, minor discomfort) or justify compensation via provision of goods/services (e.g., treats, shelter).

  **§23.07.100 INTER-SPECIES INTERACTION IMPACT STATEMENT (ISIIS) REQUIREMENT.**
  *(a) Pre-Interaction Filing:* No Person shall initiate a Planned Interaction (as defined in §23.07.020(b)) exceeding five (5) minutes cumulative duration per solar day without first submitting a completed Form ISIIS-7 ("Inter-Species Interaction Impact Statement") to the Department of Companion Entitlement (DCE). Planned Interactions include, but are not limited to:
      *(1) Leashed Locomotion Facilitation (Walking)*
      *(2) Provision of Non-Staple Sustenance (Treats)*
      *(3) Affectional Contact (Petting, Holding)* exceeding baseline maintenance thresholds.
  *(b) Form ISIIS-7 Components:* The form shall include:
      *(1) Companion Identifier:* DCE Registration Number, Species, Acquisition Date/Method (verifying lawful historical acquisition).
      *(2) Interaction Specifications:* Type (§23.07.100(a)(1-3)), Proposed Duration, Location.
      *(3) Side-Constraint Threshold Compliance Certification:* Checkbox attestation that the proposed Interaction contains no element constituting "cruelty" as defined in §23.07.020(c). (e.g., "Petting intensity shall not exceed 3 Newtons of pressure").
      *(4) Utility-Offset Calculation:* Mandatory section requiring Person to:
          *(i) Quantify Person's anticipated utility gain (e.g., "Stress reduction: 15 utils"; "Social signaling benefit: Moderate").
          *(ii) Quantify Companion's anticipated utility cost/displacement (e.g., "Opportunity cost for foraging/sleeping: 8 utils"; "Minor coat disruption: 2 utils").
          *(iii) Demonstrate net positive utility accrual to the Person OR justify compensation provided concurrently or subsequently (e.g., "Offering one (1) liver treat valued at 10 utils compensates for locomotion-associated fatigue estimated at 7 utils").
      *(5) Person's Attestation:* Signature affirming compliance with all entitlement principles and acceptance of liability for boundary violations.

  **§23.07.200 BASELINE SUSTENANCE & CONTAINMENT EXEMPTION.**
  *(a) Provision of water, nutritionally adequate staple food, and secure containment within the Person's property boundaries constitutes baseline maintenance and is exempt from the ISIIS-7 requirement under §23.07.100(a), provided such activities demonstrably avoid §23.07.020(c) violations.*
  *(b) Any enhancement to baseline sustenance (e.g., premium food brands, supplemental vitamins) or temporary containment release (e.g., access to a secured yard) requires a filed ISIIS-7 with completed §23.07.100(b)(4) Utility-Offset Calculation.*

  **§23.07.300 LEASHED LOCOMOTION FACILITATION (WALKING) PROTOCOL.**
  *(a) Pre-Walk ISIIS-7 Requirement:* As per §23.07.100(a)(1). Route must be specified, including potential encounter zones with other Persons/Companions.
  *(b) Restraint Mandate:* Companion must be physically restrained via leash, harness, or equivalent barrier technology at all times during Public Way traversal. This constitutes a preemptive side-constraint adherence measure, preventing unjust boundary crossings onto third-party property or Persons.
  *(c) Waste Removal:* Any Companion-derived matter deposited on non-Person-owned property constitutes a boundary violation. Immediate removal and remediation (e.g., disposal in designated receptacles) is required. Failure constitutes a violation of §23.07.020(c) (deprivation of enjoyment/utility to property holder) and may trigger Compensation Matrix application (Form DCE-15).

  **§23.07.400 AFFECTIONAL CONTACT STANDARDS.**
  *(a) Threshold:* Tactile contact exceeding five (5) cumulative minutes per day or involving areas designated as "High-Sensitivity" (e.g., abdomen, paws for certain species) requires an ISIIS-7 (§23.07.100(a)(3)).
  *(b) Monitoring:* Person must continuously monitor Companion for behavioral indicators suggesting utility deficit or side-constraint proximity (e.g., withdrawal, vocalization of distress). Interaction must cease immediately upon observation of such indicators; continuation constitutes a prima facie §23.07.020(c) violation.
  *(c) Sentience-Utilty Coefficient:* While Companions lack the capacity for rights-bearing personhood, their demonstrable sentience factors into the Utility-Offset Calculation (§23.07.100(b)(4)(ii)) as a potential source of positive utility (e.g., "Companion purring observed: +5 utils estimated"). This does not alter their fundamental moral status classification.

  **§23.07.500 RECORD RETENTION & AUDIT.**
  *(a) All submitted ISIIS-7 forms must be retained by the Person for a period of seven (7) years.*
  *(b) The DCE reserves the right to conduct random audits of ISIIS-7 compliance and Utility-Offset Calculations to ensure procedural integrity and prevent unjust enrichment or boundary erosion. Inadequate documentation may result in Companion re-homing mandates or suspension of Interaction privileges.**
