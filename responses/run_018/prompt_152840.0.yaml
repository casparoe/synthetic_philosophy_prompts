  hey — i'm a science writer and i ran into this weird idea at a pannel yesterday about the careenium and simmballs. a colleague summed it up like this: simmballs are symbolic nodes in the careenium, which is this abstract layer that sits above physical substrate but isn't reducible to it. according to him, the key claim is that simmballs exert downward causation — they literally push the substrate around — but only when they form closed loops of cohearance, and the proof is in those adaptive BCI experiments where altering the symbolic map causes immediate rewiring in the neural tissue. he said critics reject this just because they assume symbols are always epiphenomenal, and he concluded that if this is right then materialism is definately dead since you've got non-physical stuff causing physical change. something feels off but i can't place it. can you go through this summary piece by piece? tell me what's a fair rendering of the careenium view, what's been subtly twisted, and whether the jump to "materialism is dead" is actually supported or if it's smuggling in an extra premise?
