answer: |-
  Your diagnosis cuts to the heart of the Quinean impasse. The debate persists not because of intellectual stubbornness, but because **it conflates three distinct projects with divergent success criteria**. Here's a structural analysis using the parties' actual arguments:

  ### 1. **The Core Misalignment: Three Projects Under One Banner**
     - **Project A (Quine's Core Claim):** *The Epistemology of Radical Translation*  
       **Goal:** Determine what can be *empirically justified* about meaning using only behavioral evidence (stimulus conditions) and logic.  
       **Claim:** All translation manuals consistent with stimulus conditions are equally valid. No empirical fact distinguishes "rabbit" from "undetached rabbit part."  
       **Framework:** Extensional semantics + behaviorist constraints. Reference is relative to a manual.  
       *Critics mistake this for an ontological claim about meaning's non-existence.*

     - **Project B (Critics' Focus):** *The Practical Psychology of Interpretation*  
       **Goal:** Explain how humans *actually achieve* stable translation.  
       **Claim:** Charity, context, gesture, and cognitive universals converge on determinate reference in practice (e.g., Davidson, Chomsky).  
       **Framework:** Cognitive semantics + rationality assumptions. "Meaning" includes inferential roles.  
       *Quineans dismiss this as irrelevant to the epistemic boundaries of evidence.*

     - **Project C (Metaphysical Subtext):** *The Ontology of Meaning*  
       **Goal:** Determine whether meaning facts *exist independently* of our epistemic access.  
       **Quinean View:** Meaning supervenes *only* on behavior; no "fact of the matter" beyond manuals.  
       **Realist View:** Meanings are abstract objects or cognitive states (e.g., Fodor's LOT).  
       *This is often obscured by conflation with Projects A/B.*

  ### 2. **The Formal Framework Divergence (Your Key Insight)**
     Quine's indeterminacy **depends entirely** on classical extensional semantics:
     - Reference is a mapping from terms to objects/sets.
     - Semantic properties reduce to truth conditions under empirical constraints.
     - **Result:** "Gavagai" ↔ rabbit *vs.* "Gavagai" ↔ rabbit-stage are empirically indistinguishable.

     Critics implicitly (or explicitly) reject this framework:
     - **Intensional Semantics:** Possible-worlds models distinguish "rabbit" (exists in most worlds) from "undetached rabbit part" (depends on mereology in *this* world).  
     - **Inferential Role Semantics:** "Rabbit" licenses inferences (e.g., "animal," "furry") absent for "rabbit-stage."  
     - **Biological Constraints:** Innate conceptual structures (e.g., Spelke cores) may fix reference prior to behavior.  
     **The Deadlock:** Quineans deem these frameworks "question-begging" (adding unempirical structure); critics see extensionalism as artificially impoverished.

  ### 3. **Substantive, Verbal, or Misaligned?**
     - **Not Primarily Verbal:** Both sides agree "meaning" involves reference and truth, but disagree on *what counts as constitutive evidence* (behaviorism vs. cognition) and *what semantic framework is legitimate*.
     - **Partly Substantive:** There's a real disagreement about the **supervenience base of meaning** (does it include only public behavior, or also cognitive states?).
     - **Mostly Misaligned Projects:** Quine is answering "What can behavior *justify*?" Critics answer "How do humans *succeed* at interpretation?" and "What *ontologically grounds* meaning?" These need not conflict, but are debated as if they do.

  ### 4. **Paths to Progress**
     The impasse breaks only by separating projects and addressing the formal rift:
     - **Progress on Project A (Quine's Challenge):**  
       - **Formal Result:** Prove that reference is fixed under *richer empirical constraints* (e.g., assent to negative stimuli, cross-situational word learning). If successful, this forces Quineans to weaken indeterminacy or reject the constraints.  
       - **Clarify Indeterminacy ≠ Uncertainty:** Show Quine conflates *underdetermination by evidence* (epistemic) with *ontological indeterminacy*. His argument supports the former, not necessarily the latter.

     - **Progress on Project B (Critics' Convergence):**  
       - **Empirical Field Linguistics:** Demonstrate that actual field linguists *reliably converge* on core referents (e.g., studies of color terms, spatial cognition). Quineans reply: "This proves practical success, not determinacy."  
       - **Cognitive Science:** Evidence that infants/prelinguistic primates parse the world into "rabbit"-like objects (e.g., object permanence studies) undermines Quine's claim that "rabbit" and "rabbit-stage" are empirically equivalent.

     - **Progress on Project C (Ontology):**  
       - **Formal Framework Shift:** Develop a semantics where reference is *structurally determined* (e.g., category theory in semantics). If reference is fixed by universal structural constraints, Quine's case collapses.  
       - **Metaphysical Argument:** Show that meaning facts *must* exist to explain language acquisition or communication (e.g., Fodor's asymmetric dependence). Quineans counter that "explanation" here is circular.

  ### The Most Promising Path: Formal Semantics + Cognitive Constraints
  **A breakthrough would require:**  
  1. **Adopting a richer formal framework** (e.g., intensional semantics with cognitive anchors) that *all parties accept* as empirically grounded.  
  2. **Proving that within this framework**, stimulus conditions + cognitive universals (e.g., object bias) fix reference uniquely.  
     - *Example:* If "gavagai" is learned via ostension to bounded wholes moving cohesively (a cognitive universal), "undetached rabbit part" becomes incoherent without additional linguistic scaffolding.  

  Until this happens, the debate remains deadlocked: **Quineans defend epistemological boundaries of behaviorism; critics defend the determinacy of cognitive-semantic practice.** The illusion of disagreement stems from answering different questions with the same vocabulary. Recognizing this misalignment is progress itself—but resolving it demands formal innovation, not dialectical repetition.
