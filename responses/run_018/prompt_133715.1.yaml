  Then there's the lower-boundary problem. Including entities like thermostats raises the issue of false positives. How to assign moral weight without arbitrary cutoffs? The framework would need criteria like functional integration or behavioral indicators to distinguish genuine sentience. The novelist might illustrate this through a scenario where the arbitration system debates the inclusion of a new entity, testing the framework's ability to avoid moral noise while remaining consistent. This adds a layer of technological and ethical tension to the narrative.

