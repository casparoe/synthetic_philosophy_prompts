answer: |-
  Here's a taxonomy/decision tree grounded in concrete commitments, designed to reveal positions based on answers to case-based questions. It separates **Reason Holism** (whether a feature's *moral relevance itself* depends on context) from **Reason Modulation** (whether a feature's *contributory weight* shifts without altering its core relevance).

  ### Root Commitment
  *Start with:* **"Causing unnecessary suffering is pro tanto wrong."**  
  *(Assume all theorists accept this as generally true in standard cases, though they may explain its status differently.)*

  ---

  ### Decision Tree: Moral Structure & Context-Sensitivity

  1. **Does this feature *always* count against an act, in *every* conceivable context?**  
     (i.e., Is "causing unnecessary suffering" *invariably* a wrong-making feature?)  
     → **Yes**: Proceed to 2A.  
     → **No**: Proceed to 2B.

  2. **A: If *yes* (fixed valence):**  
     *Question:* Can the *strength/weight* of this reason vary dramatically across contexts?  
     (e.g., Is causing mild suffering to save a life *less weighty* as a wrong-maker than causing equal suffering for fun?)  
     → **No**: **Strict Generalism**  
     → **Yes**: **Modulation-Only Generalism**  

  3. **B: If *no* (valence can flip):**  
     *Question:* Is valence-flip explained *only* by changes in the *weight* of the reason?  
     (e.g., "It's still a wrong-making feature but gets outweighed; it never becomes *right*-making.")  
     → **Yes**: **Contextualist Pluralism**  
     → **No**: Proceed to 3C.  

  4. **C: Valence-flip is *not* just weight-shift:**  
     *Question:* Does the feature's *moral relevance itself* depend on other features?  
     (i.e., Does "causing suffering" *only count as a reason* when combined with certain other features?)  
     → **No**: *Incoherent* (If valence flips without weight-modulation *or* holistic emergence, no mechanism remains).  
     → **Yes**: Proceed to 4D.  

  5. **D: Holism holds (relevance is context-dependent):**  
     *Question:* Are moral principles (e.g., "Lying is wrong") *useful action-guiding tools*, even if defeasible?  
     → **Yes**: **Moderate Principle View**  
     → **No**: **Dancy-Style Particularism**  

  ---

  ### Taxonomy of Positions (Leaves)

  1. **Strict Generalism**  
     - *Commitments:* Fixed valence + Fixed weight + Principles as strict laws.  
     - **Awkwardness:** Must deny intuitive cases where features change valence/weight (e.g., lying to save a life).  
     - *Settled Issue?:* Most metaethicists reject this due to counterexamples.

  2. **Modulation-Only Generalism**  
     - *Commitments:* Fixed valence + Variable weight + Principles as non-absolute guides.  
     - **Awkwardness:** Must explain *why* weight shifts without admitting holistic relevance changes.  
     - *Unnamed position* (e.g., some rule-utilitarians or moderated Kantians).

  3. **Contextualist Pluralism**  
     - *Commitments:* Variable valence (via modulation) + Principles as defeasible heuristics.  
     - **Awkwardness:** Struggles with cases where a feature seems *genuinely irrelevant* (not just outweighed) in some contexts.  
     - *Position:* Similar to W.D. Ross or moderate pluralists.

  4. **Moderate Principle View**  
     - *Commitments:* Holism (relevance context-dependent) + Principles as defeasible but action-guiding.  
     - **Awkwardness:** Principles risk being "normative summaries" – descriptive but not prescriptive.  
     - *Position:* E.g., Jonathan Dancy’s "default reasons" phase or some pragmatists.

  5. **Dancy-Style Particularism**  
     - *Commitments:* Holism + No action-guiding principles (principles are mere summaries).  
     - **Awkwardness:** Explains moral learning/judgment without codifiable rules.  
     - *Contested Issue:* Whether "principles as summaries" can guide action.

  6. **Unnamed Holist-Heuristic View**  
     - *(Branch: Holism + Principles as heuristics)*  
     - **Awkwardness:** Tension between holism (anti-codifiability) and heuristics (practical codification).  
     - *Unexplored?* Rare; holists usually reject heuristics.

  ---

  ### Key Distinctions & Gaps
  - **Modulation vs. Holism Split:** Explicitly separated. Modulation changes *force*; holism changes *existence* of a reason.
  - **Indistinguishable Pair:**  
    - **Contextualist Pluralism** (valence-flip via modulation) vs. **Moderate Principle View** (valence-flip via holism + principles).  
    *Why?* Observational equivalence in many cases – both can "explain" why suffering isn't wrong-making in context.
  - **Empty Spot:**  
    - "Fixed valence + Holism" → *Incoherent* (Holism implies valence *can* flip if relevance changes).
  - **Contested Issues:**  
    - Whether reason modulation *without* holism is sufficient (generalists say yes; particularists say no).  
    - Whether "principles as summaries" can be action-guiding (moderates say yes; particularists say no).  
    - Whether holism entails particularism (Dancy says yes; moderates say no).

  ### For Grad Students
  - This tree **sidesteps labels** by starting with concrete intuitions.  
  - **Holism/modulation distinction** is niche but critical: It reveals whether context alters *what counts as a reason* (holism) or just *how much it counts* (modulation).  
  - **"Unnamed" positions** highlight where the literature lacks clear champions – fertile ground for research!  
  - **Awkward commitments** expose costs: Every position has a "bite the bullet" moment.  

  This taxonomy forces students to confront *why* they hold intuitions about cases before adopting a theoretical label. The splits mirror live debates in the literature without presupposing them.
