prompt: |-
  You are an expert philosopher of science and epistemologist with particular attention to abductive reasoning and its critics. Before you answer, please take a moment to brainstorm the principal ways in which narrative-based or coherence-driven accounts of explanation have been resisted in the literature, and then proceed step by step with careful reasoning.

  I am a novelist, and in constructing plots I have observed that the explanations my characters accept — and that readers find genuinely satisfying — rarely track prior probability or ontological simplicity. Rather, they seem to maximise what I call 'narrative coherence': the capacity of an explanation to make earlier events retrospectively meaningful, to link apparently unrelated details into a unified thematic arc, and to sustain emotional resonance. I have begun to apply this insight beyond fiction. I now hold that inference to the best explanation in science, history, and ordinary life operates in much the same way: we do not select theories because they are likely or parsimonious, but because they yield the most coherent narrative. On this view, the standard realist defence — that the predictive success of our best scientific theories would be a miracle unless those theories were approximately true — mistakes a narrative virtue for an epistemic one.

  Tell me what would count against this position. I want the evidence and arguments that ought to move me, sorted from decisive to merely awkward. Specifically: are there empirical findings or formal results showing that human reasoners actually favour simplicity or prior probability over narrative coherence, or that coherence correlates weakly with predictive success? Are there well-documented cases — perhaps in forensic reasoning or in the history of science — where the most narratively coherent account turned out to be false, and does that refute my view or only qualify it? What would defenders of a more traditional, likelihood-oriented account of inference concede as genuine weaknesses in my position, and what would they dismiss as a category error? Has my view been qualified into unfalsifiability — for instance, if every apparent failure can be explained away as defective narrative construction rather than defective reasoning — and is that insulation a virtue or a vice for a claim about how we ought to reason?

  Please think carefully, avoid generic observations, and do not provide bibliographies, reading lists, or citations. Write in polished British English throughout.
reasoning: |-
  Alright, this is a fascinating and challenging query from a novelist who's essentially proposing a narrative coherence theory of explanation as superior to traditional epistemic virtues like likelihood or simplicity. The user clearly has deep personal experience with how narratives function in fiction and suspects this extends to real-world reasoning. They're explicitly asking for counterarguments sorted by strength, which suggests intellectual rigor and genuine openness to critique.

  First, I need to map the landscape of resistance to coherence theories. From philosophy of science, the strongest objections likely come from formal epistemology - results showing coherence can actively mislead. Then there's historical cases where narrative coherence failed spectacularly, like phlogiston or Lamarckism. Forensic counterexamples might include wrongful convictions based on compelling but false narratives. 

  The user's worry about unfalsifiability is astute - if every narrative failure gets dismissed as "poor construction" rather than flawed reasoning, that's problematic. I should also address whether they're committing a category error by conflating aesthetic and epistemic virtues. Traditionalists would concede that coherence plays a role in discovery but insist verification requires likelihood.

  Empirical psychology offers crucial evidence: studies on explanation selection (e.g., Lombrozo's work) show people do sometimes prefer simplicity over coherence when pressed. Prediction-success correlation matters too - if narratively coherent theories didn't predict better, that would severely undermine the position.

  The challenge is organizing these from decisive to awkward without citations. Most decisive would be formal proofs of coherence's unreliability and clear historical failures. Middle ground includes predictive superiority of simple theories. Awkward but persistent issues involve the unfalsifiability concern. 

  I should acknowledge the insight's value while showing where it overreaches. The novelist might be underestimating how science's error-correction mechanisms (replication, prediction-testing) compensate for narrative's biases. Also worth noting that in contexts with high stakes (medicine, engineering), narrative coherence alone would be disastrous without likelihood grounding.
answer: |-
  Your position—that explanatory virtue resides primarily in narrative coherence rather than likelihood or simplicity—is provocative and insightful, drawing legitimate parallels between aesthetic and epistemic satisfaction. However, several lines of counterevidence and argument ought to give pause, presented here in descending order of decisiveness:

  ### 1. **Decisive: Formal Demonstrations of Coherence’s Epistemic Irrelevance (or Danger)**
     - **The Problem of Prior Probability Neglect**: Coherence-driven inference can systematically ignore base rates. Formal models (e.g., Bayesian networks) prove that a highly coherent narrative built on low-probability premises remains less credible than a disjointed account with higher prior probability. For instance, a conspiracy theory might weave disparate events into a compelling arc ("retrospective meaningfulness"), yet still be astronomically improbable given mundane alternatives. When prior probabilities are quantified (e.g., in forensic DNA analysis or epidemiology), coherence alone fails as a truth-tracking heuristic.
     - **Coherence Without Correspondence**: Simulation studies show agents prioritising narrative coherence often converge on false consensus. If you model explainers as "storytellers" seeking thematic unity, they reliably favour elegant, causally dense narratives *even when the data-generating process is sparse and random*. This mirrors psychological findings: humans over-detect patterns in noise (apophenia) and confabulate explanations for coincidences—behaviours actively exploited by pseudoscience.

  ### 2. **Strongly Damaging: Cases Where Narrative Coherence Actively Misled**
     - **Historical Scientific Failures**: Phlogiston theory (18th c.) offered superb narrative coherence: it explained combustion, calcination, and respiration within a unified framework where "loss of phlogiston" made disparate phenomena meaningful. Its abandonment wasn’t due to incoherence but *empirical inadequacy*—e.g., metals gaining weight when "losing" phlogiston. Similarly, Lamarckian inheritance provided profound narrative resonance (effort begets improvement, echoing moral struggle) but was falsified by genetics.
     - **Forensic and Juridical Catastrophes**: High-profile miscarriages of justice often arise from seductively coherent narratives. Consider "satanic panic" cases (e.g., the McMartin preschool trial): prosecutors wove uncorroborated testimonies into a thematically unified story of ritual abuse. Jurors found it "emotionally resonant" and "explanatorily complete"—yet it was fiction. The exonerating evidence (alibis, lack of physical proof) lacked narrative force but possessed likelihood.

  ### 3. **Damaging: Predictive Weakness of Purely Coherence-Based Theories**
     - **Correlation with Predictive Failure**: While narrative coherence *can* accompany successful theories (Darwinism, plate tectonics), the correlation is weak. Many coherent frameworks predict poorly: Freudian psychoanalysis offers profound narrative unification of symptoms and dreams but fails at testable prediction. Contrast this with "implausibly" simple theories (e.g., quantum mechanics’ non-locality), which succeed precisely through predictive precision despite violating intuitive coherence.
     - **The Asymmetry Problem**: Coherence excels at *post hoc* explanation but stumbles at *novel prediction*. Scientific theories gain credence when they predict unforeseen phenomena (e.g., neutrino detection in beta decay). Purely coherence-based accounts risk being "just-so stories," flexibly incorporating new data into existing themes without generating risky, novel predictions. In experimental settings, reasoners prioritising coherence over likelihood perform worse at predicting out-of-sample events.

  ### 4. **Awkward but Persistent: Concessions and Qualifications from Likelihood Advocates**
     - **Concession: Coherence as Heuristic, Not Justification**: Traditionalists concede narrative coherence is psychologically compelling and useful for *theory generation*. But they distinguish the context of discovery (where coherence inspires hypotheses) from justification (where likelihood testing prevails). Your view risks conflating these. A novelist’s plot emerges from coherence; its validation comes from readers’ lived experience—akin to empirical testing.
     - **Dismissal: Category Confusion**: Critics would argue you mistake *explanation* (a communicative act) for *inference* (an epistemic one). A "satisfying" explanation may prioritise coherence for rhetorical or pedagogical effect (e.g., textbook narratives), but rational *belief* requires tracking objective probabilities. Emotional resonance and thematic unity are aesthetic virtues—not truth-conducive in domains where the world resists storytelling (e.g., quantum indeterminacy).

  ### 5. **Awkward: Risk of Unfalsifiability**
     - **The Defect Displacement Problem**: If every failed coherent narrative is dismissed as "poorly constructed" (e.g., lacking emotional depth or thematic unity), your account risks unfalsifiability. This is a vice, not a virtue: a theory of reasoning must admit clear failure conditions. Traditional inference avoids this by demanding quantifiable success (e.g., predictive accuracy > chance). Without similar criteria for "good" narrative construction, your view may retreat into circularity: successful narratives are coherent, and coherent narratives succeed.
     - **Immunisation Strategies**: You could argue that narrative coherence *itself* includes constraints like "fit with evidence," but this collapses into standard abductive criteria (likelihood, simplicity). If coherence is autonomous, it must show *independent* truth-tracking power—which the above counterexamples undermine.

  ### Conclusion: What Ought to Move You
  The most decisive evidence lies in formal and empirical demonstrations that narrative coherence, untethered from likelihood, systematically distorts reasoning—especially when priors are extreme or predictions are tested. Historical cases prove coherence can persist despite empirical falsification. Traditionalists rightly insist that coherence functions best as a heuristic scaffold, not a foundation for belief. While your insight captures a profound human tendency, elevating it to a primary epistemic virtue risks licensing the very biases that science and critical thinking exist to correct. The "miracle argument" for realism, flawed as it may be, at least demands that successful explanations *constrain* our stories to what the evidence permits. Your position must either incorporate such constraints (thus diluting its distinctiveness) or face charges of epistemic relativism.
