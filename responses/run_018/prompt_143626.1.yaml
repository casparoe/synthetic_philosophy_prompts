answer: |-
  Fair challenge. The fragility you observe doesn't undermine rationality—it *confirms* it. Agents act rationally *given the limited information available to them*. When someone breaks rank, it reveals a surprisingly strong private signal inconsistent with the public narrative. This *new* information rationally causes a reassessment. Earlier agents weren't "suppressing" evidence; they correctly weighted their weaker private signals against the overwhelming public information cascade *as they observed it*. Their actions were optimal Bayesian updating at the time. The collapse simply shows how rationally aggregated public beliefs can still be fragile when pivotal new evidence emerges. What do you mean by "should have shared all along"? In standard cascade models, *only actions are observable*, not private signals.
