answer: |-
  Here's the translation exercise, followed by the residue report:

  ### Quine's Moral Skepticism in Revealed Preference/Bayesian Terms

  1.  **Moral Commitments as Preference Orderings:** Forget "objective ethical truths." Think of an individual's moral stance (e.g., "Stealing is wrong") as a revealed preference ordering. You don't *see* the "wrongness," you observe behavioral patterns: they avoid stealing, condemn others who steal, support anti-theft laws. This revealed behavior *is* their moral preference. Different people/groups have different moral orderings, revealed by their actions.

  2.  **Origin: Social Priors, Not Data:** How do these moral preference orderings form? Not primarily by observing the physical world like we update beliefs about gravity or coin flips. Instead, they're heavily shaped by *social priors* – the initial probability distributions over possible moral rules implanted by upbringing, culture, norms, and language. Your "prior" probability that "honesty is good" starts very high if raised in a culture that constantly reinforces it.

  3.  **Updating Mechanism: Social Feedback, Not Empirical Evidence:** Bayesian updating *does* happen, but the "evidence" isn't sensory data confirming an objective moral fact. It's social feedback: approval, disapproval, rewards, punishments, internalized social narratives. If acting "dishonestly" consistently leads to negative social consequences (loss of trust, status, punishment), you might update your preference ordering slightly, downgrading dishonesty. But this update reinforces the *socially functional* aspect, not an objective truth. It's optimizing for social cohesion/survival within your group, not discovering moral atoms.

  4.  **No Objective Utility Function:** Crucially, there's no universal, objective "moral utility function" that these preferences are trying to maximize, analogous to maximizing expected utility under risk. The "utility" is defined *by* the socially conditioned preference ordering itself and its functional role within the group. What counts as "utility" (e.g., social harmony, divine favor, personal purity) is part of the prior package. Science seeks to map an external reality; morality is optimizing within a socially constructed reality.

  5.  **Skepticism Explained:** Because moral preferences originate in contingent social priors and are updated via social feedback loops, not sensory evidence about an independent moral reality, they lack the same claim to objectivity as scientific beliefs (which, for Quine, *also* involve webs of belief but are anchored more directly by sensory inputs). They are "true" only relative to a specific web of belief conditioned by a specific social context, not true like "force equals mass times acceleration" within our best physical theory.

  ---

  ### Residue Report

  **Parts that Map Cleanly:**

  1.  **Moral Commitments as Revealed Behavior:** Quine's rejection of objective moral facts aligns perfectly with defining morality *only* through observable choices and expressions (revealed preference). What you *do* is your morality.
  2.  **Social Origin as Priors:** The heavy influence of culture/norms mapping to strong Bayesian priors is very clean. Priors dominate initial formation.
  3.  **Social Feedback as Updating Mechanism:** The role of approval/disapproval, sanctions, and narratives as the primary "evidence" driving updates fits well with Bayesian conditioning, distinct from empirical data updating.
  4.  **Relativity/Lack of Universal Standard:** The idea that different groups have different moral orderings (revealed by different behaviors) and different implicit "utility functions" maps directly to revealed preference's focus on observed differences without needing a universal metric.

  **Parts Requiring Distortion/Approximation:**

  1.  **The "Web of Belief" vs. Isolated Preferences:** Revealed preference often treats preferences atomistically. Quine sees moral commitments as deeply entangled with *all* beliefs (factual, logical, metaphysical) in a holistic web. Updating a moral "preference" might require adjusting factual beliefs elsewhere in the web, and vice-versa. Revealed preference theory typically doesn't model this intricate holism well.
  2.  **The Nature of "Update" Distortion:** While social feedback *can* be modeled as Bayesian evidence, Quine emphasizes the *conditioning* aspect – almost behavioral reinforcement, often non-conscious and non-rational. Bayesian updating feels too cognitive and calculation-oriented by comparison. The "distortion" is making it seem more deliberate than Quine might imply.
  3.  **Function vs. Truth:** Revealed preference is silent on *why* preferences exist. Quine emphasizes the *functional role* of morality in social survival and coordination. We approximated this by saying morality optimizes "socially functional" outcomes defined by the group, but revealed preference itself doesn't inherently explain this function; it just observes the preferences driving behavior.
  4.  **The Anchor of Science:** We contrasted science updating on sensory data vs. morality on social feedback. While broadly correct, Quine's naturalized epistemology makes even scientific objectivity a matter of degree within the holistic web, anchored more *directly* to sensory inputs. Revealed preference/Bayes struggles to capture this *relative* anchoring difference cleanly.

  **Missing Parts / Irreducible Residue:**

  1.  **Indeterminacy of Translation (Radical Interpretation):** This is HUGE for Quine and completely absent in economic vocabulary. Quine argues that translating meaning (including moral terms like "good" or "obligation") between different languages or conceptual schemes is fundamentally indeterminate. There's no single "correct" translation; multiple schemes fit the behavioral evidence equally well. Revealed preference assumes preferences are stable and *translatable* across contexts/agents. This missing piece shows Quine's deeper skepticism about meaning itself, which underpins his moral skepticism. **Failure of Econ Vocab:** Revealed preference utterly lacks tools to grapple with meaning indeterminacy. This isn't vagueness in Quine; it's a profound, well-argued point central to his philosophy.
  2.  **The "Why Not?" of Moral Skepticism:** Revealed preference is *descriptive*. Quine's position is *skeptical* and *metaphysical*: he's making a claim about the *status* of moral judgments – they don't refer to objective properties in the world. Revealed preference, by itself, doesn't entail this skepticism; one could *be* a moral realist and still use revealed preference to *study* moral behavior. The translation captures the *structure* (social priors/updating) but struggles to fully convey the *philosophical force* of the anti-realist conclusion. **Failure of Econ Vocab?:** Partly. Econ vocab is primarily descriptive/operational. Conveying metaphysical skepticism requires stepping outside it. Partly **Quine's Depth:** His conclusion rests on arguments (like indeterminacy) that simply aren't part of the economic framework.
  3.  **The Holism Challenge:** As mentioned under distortion, the deep entanglement of moral commitments with the entire web of belief (logic, ontology, etc.) is difficult to represent with isolated preference orderings and Bayesian updates. Revealed preference models tend to isolate domains. **Failure of Econ Vocab:** It struggles to model the profound interconnectedness Quine describes.

  **Conclusion on the Missing Stuff:** The irreducibly missing parts – primarily **Indeterminacy of Translation** and the full force of the **metaphysical anti-realist conclusion** derived from it and holism – highlight a **failure of the economic vocabulary**, *not* vagueness in Quine. Revealed preference and Bayesian updating are powerful tools for describing *behavior* and belief revision mechanisms, but they operate within a framework that assumes stable, translatable meanings/preferences and is largely agnostic about metaphysical questions concerning what those preferences *actually refer to* (if anything) in the external world. Quine's arguments directly challenge those foundational assumptions about meaning and reference, which economics typically takes for granted. The residue exposes the limits of the economic framework for capturing deep philosophical critiques of meaning and objectivity.
