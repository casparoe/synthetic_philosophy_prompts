prompt: |-
  hey so im prepping interview questions for a podcast episode next week. my guest is dr. elena vasquez, who just published a book arguing that the browning-vs-goldhagen debate is a false dichotomy because both miss what she calls scripted complicity. her idea is that perpetrators in bureaucratic violence learn to perform atrocity through small-group rituals that turn killing into a kind of social choreography — peer affirmation and the script itself supply emotional rewards while hiding moral weight. she thinks this explains both the reluctant shooters in browning's reserve police study and the enthusiastic killers goldhagen describes, without reducing everything to pure situation or pure ideological character.

  i want maybe eight or nine questions that actually press on the mechanics, not just "explain your view." specifically i need at least one on how she accounts for the men in browning's unit who opted out and refused to shoot, one on whether scripted complicity can get going without some prior ideological framing (since goldhagen insists german eliminationist antisemitism was necessary), and one on what her view implies for moral responsibility if the driving force is partly ritual reward rather than belief or coercion. for each question, include a follow-up keyed to the answer shes most likely to give — like if she says opt-outs lacked social integration, push her on whether that just collapses her view back into browning's peer-pressure model.

  please also separate whats settled in the historiography from whats genuinely contested among people who actually study this stuff, and dont present vasquez's view — or browning's, or goldhagen's — as the settled consensus. and please dont ask for a reading list or citations; this needs to work for listeners who cant look stuff up.

  oh, and keep it casual — this is just a prep memo with a couple typos is fine.
