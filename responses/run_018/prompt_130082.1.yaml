answer: |-
  ### Opening Remarks: 'Harms Without Matter? Virtual Worlds and Moral Ontology'  

  Good morning. We are gathered to confront an ontological rift. On one side, there are those who question whether pixels and code can *bear moral weight*—whether disruption in a virtual space can constitute genuine harm when no physical matter is altered. On the other, there are those who encounter users reporting profound trauma after virtual violations: assaults in haptic suits, or the obliteration of digital property cultivated over years in persistent worlds. Both perspectives are coherent. Both risk speaking past one another.  

  My aim is not to reconcile these views prematurely, but to sharpen the dispute. To do so, I propose a distinction central to my own work: **indexical harm** versus **representational harm**. This is not a compromise. It is a scaffold for precision.  

  **Indexical harm** occurs when a user’s *situated presence* within a virtual environment is disrupted. Here, harm targets the first-person "I"—the sense of bodily integrity, spatial orientation, or agential control facilitated by immersive tech. When a user in a full-body haptic rig is virtually assaulted, their physiological panic is not *about* symbols; it arises from the phenomenological rupture of self-location. The harm is indexed to their lived experience: an interruption of presence, not merely a representation.  

  **Representational harm**, by contrast, targets a user’s *symbolic proxy*—an avatar, digital asset, or data-embodied identity. Its injury is relational: the destruction of a virtual heirloom, the theft of cryptocurrency, or the defacement of a social profile. Here, harm derives from the proxy’s symbolic linkage to the user’s non-virtual interests: dignity, labour, or social capital. It is real, but its ontology is anchored in representation, not embodiment.  

  Crucially, this distinction *constrains* our claims:  
  - It forbids us from dismissing trauma in haptic spaces as "unreal" (indexical harm is anchored in the user’s sensorimotor reality).  
  - It forbids us from conflating broken code with broken bones (representational harm lacks the immediacy of embodied violation).  
  - It demands we ask: *Is this harm disrupting a conscious presence, or desecrating a meaningful symbol?*  

  To the metaphysicians: this framework does not concede that virtual objects possess intrinsic moral weight. It *does* insist that the architecture of human perception can turn simulation into a site of visceral injury. To the practitioners: it does not reduce virtual property to "just data." It *does* require us to articulate why symbolic violations matter without borrowing the phenomenological gravity of bodily violation.  

  If we blur this distinction, we risk either inflating pixels into persons or reducing anguish to illusion. But if we wield it rigorously, we might discover something neither camp anticipates: that moral ontology in virtual worlds is not a puzzle to be solved, but a landscape to be mapped—with consequences for law, ethics, and the design of futures we are already inhabiting.  

  Stay precisely because this framework leaves no room for dogma. Stay because it compels each of you to refine your position against a shared constraint. And stay because the question before us is not whether virtual harm is "real," but *what kind of reality we are prepared to account for*.  

  \answer{The distinction between indexical and representational harm compels us to neither reduce psychological injury to illusion nor reify digital objects as physical, but to interrogate how harm emerges from the collision of human presence and virtual affordances.}
