prompt: |-
  Hey, I'm writing a short thing on social-choice aggregation and I keep running into this tension. Harsanyi's aggregation theorem says that if individual preferences and the social preference both satisfy vNM rationality, plus Pareto and some independece condition, then social welfare is just a weighted sum of individual cardnal utilities. But I was wondering: what if we drop pure vNM and instead use reference-dependent preferences — like Kahneman-Tversky prospect theory — at the individual level? So each person's utility is defined relative to some reference point, with loss aversion, and the reference point might even depend on what others get. Compare the standard Harsanyi setup with this reference-dependent varient. Specifically, which of Harsanyi's axioms break first? Can you still get any kind of linear aggregation, or does the social welfare function become nonlinear and context-sensitive? And if the reference point is socially determined, does that create a circularity problem for the aggregation? I don't need a formal derivation, just want to see where the analogy holds and where it collapses.
reasoning: |-
  Okay, let me start by unpacking the user's question. They're exploring Harsanyi's aggregation theorem and want to know what happens when individual preferences are reference-dependent, like in Prospect Theory. The core tension is between vNM rationality and reference points affecting utility.

  First, I need to recall Harsanyi's key axioms: vNM rationality for individuals and social preferences, Pareto efficiency, and independence. The theorem leads to a linear weighted sum of utilities. The user is asking which axioms break when preferences become reference-dependent.

  Harsanyi's setup relies on consistent preferences across all gambles, but reference-dependent preferences change based on reference points. Loss aversion means losses hurt more than gains, which violates the linear treatment of probabilities in vNM. So the first broken axiom is vNM rationality itself. If individuals don't satisfy vNM, the social planner can't assume it either, breaking the social vNM axiom.

  Next, Pareto efficiency might be tricky. If two people have different reference points, moving from A to B could be a gain for one and a loss for another. Even if both prefer B, the loss-averse person might oppose it more strongly. But Pareto should still hold if we stick to strict improvements. Still, the intensity matters here, which Harsanyi doesn't consider but becomes relevant in reference-dependent models.

  The independence axiom is another casualty. Harsanyi's independence assumes that social preference between two prospects shouldn't change if you mix both with a third. But with reference points shifting, mixing can change the context. For example, adding a lottery might reset reference points, making preferences inconsistent. So independence likely fails.

  The user also mentioned socially determined reference points, like envy or inequality. This creates circularity. The social welfare function (SWF) depends on individual utilities, which depend on references based on outcomes. So you need to know the SWF to set references, but references affect the SWF. It's a fixed-point problem, not a straightforward aggregation.

  Nonlinear aggregation is inevitable here. Prospect Theory's value function is S-shaped and kinked at zero. Aggregating such utilities wouldn't be linear. The SWF might prioritize reducing losses or be sensitive to how outcomes are framed. Context matters, making aggregation messy.

  The user might be hinting at real-world applications where fairness or envy affect welfare. They might need examples or implications for policy. Also, they might want to know if any part of Harsanyi survives or if it completely collapses. Emphasizing the circularity and nonlinearity would address their core concerns. Maybe suggest alternatives like focusing on outcomes instead of utilities or using different models. But since they don't need formal proofs, keeping it conceptual with clear examples of broken axioms should help.
answer: |-
  You've hit on a fascinating and complex tension! Let's break down how replacing standard vNM preferences with Kahneman-Tversky style reference-dependent preferences fundamentally disrupts Harsanyi's aggregation theorem and the possibility of linear social welfare functions.

  **Where the Analogy Holds (Briefly):**

  1.  **Pareto Efficiency (Weak Form):** *Strict* Pareto efficiency ("If everyone strictly prefers A to B, then society prefers A to B") is likely still *formally* satisfiable, even with reference-dependent preferences. If every individual experiences A as strictly better than B relative to *their own* (possibly shifting) reference point, it's hard to argue society shouldn't prefer A.

  **Where Harsanyi's Axioms Break Dramatically:**

  1.  **vNM Rationality (The Core Breach):** This is the foundational break.
      *   **Individuals:** Prospect Theory (PT) preferences explicitly violate vNM axioms. Loss aversion (kinked utility at the reference point), probability weighting (non-linear), and framing effects mean preferences aren't linear in probabilities or invariant to description. Individuals don't have stable, context-independent cardinal utilities over *final outcomes*; their utility depends critically on gains/losses relative to a reference point.
      *   **Society:** If individuals lack vNM preferences, it becomes conceptually incoherent or practically impossible for the social planner to *impose* vNM rationality on the *social* preference ordering. How would society exhibit linearity in probabilities when the constituent utilities themselves shift nonlinearly?

  2.  **Independence Axiom (or Similar Conditions):** Harsanyi relies on some form of independence (e.g., social preference between two lotteries depends only on states where they differ).
      *   **Reference Point Shifts:** A key feature of reference-dependent preferences is that the reference point itself can shift based on context, expectations, or social comparisons. Mixing lotteries (a core part of independence tests) can drastically alter the perceived reference point for individuals. The social preference between A and B might change if they are embedded in a different choice set (C), not because of states where A and B differ from C, but because C changes everyone's reference point, altering how they perceive the gains/losses from A vs. B.

  3.  **Meaningful Cardinal Comparability (Implied Requirement):** Harsanyi's linear aggregation assumes the existence of interpersonally comparable, context-independent cardinal utilities.
      *   **Loss Aversion & Non-Linearity:** The value function in PT is S-shaped (concave for gains, convex for losses) and kinked at the reference point. The *marginal utility* of a gain or loss depends drastically on whether it's perceived as a gain or loss relative to the reference point and its size. Aggregating these highly non-linear, context-dependent "utilities" loses the simple additive meaning of Harsanyi. A small loss for one highly loss-averse individual might "swamp" larger gains for others in a non-linear way.
      *   **Reference Point Dependence:** Individual "utility" isn't defined for an outcome in isolation; it's defined relative to a reference. Two identical material outcomes can yield wildly different utilities depending on whether they are framed as a gain or a loss relative to the individual's reference state.

  **Consequences for Aggregation:**

  1.  **Non-Linear, Context-Sensitive SWF:** Social welfare becomes inherently non-linear and pathologically context-sensitive.
      *   **Loss Aversion Dominance:** Society might exhibit extreme aversion to imposing losses on anyone, even if it means foregoing larger gains for others, due to the kink in individual value functions. Reducing losses might be prioritized far more than increasing gains.
      *   **Framing Effects:** The *description* of social choices (e.g., as gains vs. losses relative to a "status quo" reference point) could dramatically alter the social ranking, even for identical outcome distributions. Harsanyi's aggregation is description-invariant.
      *   **Non-Separability:** The social value of an outcome for person `i` likely depends not just on `i`'s outcome and reference point, but also on others' outcomes (if references are interdependent). This violates the additive separability implied by Harsanyi.

  2.  **Circularity from Socially Determined Reference Points (The Big Problem):** This is where things get especially messy.
      *   **The Loop:** If individual `i`'s reference point (e.g., their sense of entitlement, fairness, or envy) depends on the *social outcome* or *what others get*, then:
          1.  Individual `i`'s utility depends on the social outcome `X` *and* the reference point `R_i(X)`.
          2.  The reference point `R_i(X)` itself depends on `X` (e.g., `R_i(X) = f_i(X_j, X_k, ..., Social Norms based on X)`).
          3.  The social welfare function `SWF(X)` aggregates `U_i(X, R_i(X))` for all `i`.
      *   **Consequence:** `SWF(X)` depends on `X`, but *through* utilities `U_i` that depend *non-linearly* on `X` *via* the reference points `R_i(X)`, which also depend on `X`. This creates a profound circularity or fixed-point problem: **To evaluate `SWF(X)`, you need to know `R_i(X)`, but to know `R_i(X)` (which depends on the social outcome/context), you arguably need to know the social choice process or even the `SWF` itself.** There's no unique, context-independent way to define utilities for aggregation.
      *   **Examples:** Envy (reference point depends on others' consumption), fairness norms based on outcomes (e.g., equality as a reference), status-seeking. Aggregation becomes intertwined with equilibrium concepts or norm formation.

  **In Summary:**

  *   **Core Break:** Dropping vNM rationality for reference-dependent preferences fundamentally breaks Harsanyi's theorem at its foundation. Individuals lack the stable, linear cardinal utilities it requires.
  *   **Key Broken Axioms:** vNM Rationality (for individuals and society) and Independence (due to reference point shifts).
  *   **Aggregation Becomes:**
      *   **Non-Linear:** Loss aversion, probability weighting, and S-shaped value functions preclude simple weighted sums.
      *   **Context-Sensitive:** Social ranking depends critically on framing and the *process* of defining alternatives/reference points.
      *   **Potentially Circular:** If reference points depend on social outcomes or comparisons, aggregation requires solving a fixed-point problem where social welfare depends on utilities that depend on the social context defined by... social welfare. The neat separation between individual utility and social aggregation vanishes.
  *   **Analogy Collapse:** Harsanyi offers a clean, linear, context-independent aggregation based on stable individual utilities. Reference-dependent preferences lead to a messy, non-linear, context-dependent aggregation entangled with the social determination of the very benchmarks (reference points) used to define individual "utility" in the first place. The spirit of additive aggregation based on pre-defined, comparable cardinal utilities is lost.

  You're absolutely right to identify this as a major tension. Moving to psychologically richer models like PT makes social aggregation vastly more complex and undermines the axiomatic foundations of classic theorems like Harsanyi's. The circularity issue is particularly thorny for any notion of "socially determined" references.
