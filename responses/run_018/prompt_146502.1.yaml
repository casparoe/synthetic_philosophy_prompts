  Write the proposal (about one semester, roughly 6000 words). It must: state the question precisely and distinguish it from the canonical formulation; explain why standard responses—appeals to second-order logic, the internal/external distinction, or representationalist deflation—fail to settle this modal-ontological variant; describe the philosophical (not technical-proof-based) method, identifying which conceptual distinctions require clarification; specify what a successful answer looks like and what would count as failure (for example, showing the framing merely replicates the original paradox); and assess realistic scope, including which parts must be bracketed to remain tractable without web access or obscure technical machinery. Please do not request or include a bibliography; I will supply references myself. The proposal should defend why this question is open and worth a semester's work.
