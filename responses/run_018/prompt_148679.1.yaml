  First, I need to list the key cases the theory must address. The renter facing eviction for luxury condos highlights substantive displacement fairness. The homeowner opposing density touches on procedural rights versus exclusionary outcomes. Shadow zoning involves informal exclusion bypassing formal processes. Supply elasticity and filtering are crucial for market dynamics and long-term affordability. Each case has underlying considerations like temporal stakes, collective good, procedural integrity, and market mechanisms.

  Next, the distinctions the theory must maintain. The difference between having a right and enforcing it is vital—procedural access matters. Individual versus collective claims addresses both personal stakes and community needs. Procedural fairness versus substantive outcomes ensures processes don't justify unjust results. Also, temporal claims (past residents vs. future generations) need balancing.

  Then, non-negotiables versus camp preferences. Non-negotiables include non-exclusion, anti-displacement, agency, and procedural integrity. Preferences are local autonomy vs. regional equity, permanence vs. mobility, and absolute rights vs. contingent claims. The user mentioned potential conflicts, like permanence conflicting with mobility, or full inclusion vs. local control. I should highlight which combinations are jointly unsatisfiable.

  For the quick scorecard, Lefebvre's right to the city emphasizes use value and participation but lacks mechanisms. Libertarian property rights focus on owner sovereignty but ignore displacement. Rawlsian fair cooperation balances equity and efficiency but might be complex to implement.

  The user's deeper needs: they want a practical framework for real policy, not just academic debate. They need clarity on conflicting priorities and how different theories hold up. They might also need help structuring their course around these tensions, showing students real-world applicability and trade-offs in urban justice theories. Ensuring the theory can handle edge cases like shadow zoning is crucial for practical reform. Highlighting unsatisfiable combinations helps them present these challenges in the course.
answer: |-
  Here are the core desiderata for a normative "Right to the City" theory aimed at guiding real-world zoning reform, based on your cases and concerns:

  **I. Core Cases Any Adequate Theory *Must* Get Right (The Litmus Tests)**

  1.  **The Displaced Long-Term Renter (vs. Luxury Development):**
      *   **Case:** A low-income renter living in an area for decades faces eviction to make way for luxury condos.
      *   **Must Deliver:** Strong protection against displacement driven solely by market forces or upzoning benefiting wealthier newcomers. Recognizes **substantive belonging & temporal stakes** over pure market value.
      *   **Consideration:** Justice requires mitigating harm to vulnerable residents whose lives and social networks are anchored in place.

  2.  **The Homeowner Opposing Density/NIMBYism:**
      *   **Case:** A homeowner mobilizes to block a supportive housing shelter or multi-family housing in their low-density neighborhood, citing property values or "character."
      *   **Must Deliver:** Limits on the power of individual property owners or small groups to veto projects serving broader community needs (especially for vulnerable populations). Distinguishes **reasonable expectations** from **exclusionary self-interest**.
      *   **Consideration:** The collective right to shape the city and ensure access to housing/opportunity trumps unfettered individual control over neighborhood composition.

  3.  **Shadow Zoning/Informal Exclusion:**
      *   **Case:** Developers and affluent neighborhood associations make off-record deals (e.g., agreeing not to build affordable units in exchange for no opposition to a project), bypassing formal democratic processes.
      *   **Must Deliver:** Mechanisms to expose and nullify informal power structures that subvert formal democratic planning and procedural fairness. Demands **transparency and enforceable procedural integrity**.
      *   **Consideration:** Covert exclusion erodes legitimacy and entrenches inequality; formal rights are meaningless if easily circumvented.

  4.  **Supply Elasticity & Filtering:**
      *   **Case:** Restrictive zoning artificially constrains housing supply, driving up prices for everyone and preventing "filtering" (older housing becoming more affordable over time).
      *   **Must Deliver:** Acknowledgement that enabling sufficient housing supply (type and quantity) at the regional level is a *necessary* (though not sufficient) condition for affordability and access. Recognizes **market dynamics and long-term systemic effects**.
      *   **Consideration:** Ignoring the fundamental economics of supply and demand dooms efforts to achieve broad housing justice and economic inclusion.

  **II. Essential Distinctions the Theory *Must* Maintain**

  1.  **Having a Right vs. Enforcing a Right:** Must theorize *how* rights are made actionable (e.g., legal standing for renters, mechanisms to challenge shadow deals, funding for legal aid), not just declare they exist. Procedural access is part of the right.
  2.  **Individual Claims vs. Collective Claims:** Must balance individual stakes (like the renter's home) with collective needs (like city-wide affordable housing or environmental resilience). Cannot privilege one absolutely over the other.
  3.  **Procedural Fairness vs. Substantive Outcomes:** Must value fair, transparent, inclusive processes *and* demand that processes lead to substantively just outcomes (non-exclusionary, non-displacing). Procedural fairness alone can legitimize unjust results (e.g., "democratic" exclusion).
  4.  **Temporal Claims (Present vs. Future Residents):** Must weigh the rights/needs of current residents against the rights/needs of potential future residents seeking access to the city's opportunities.

  **III. Non-Negotiables vs. Camp Preferences**

  *   **Non-Negotiables (Essential Justice Floor):**
      *   **Non-Exclusion:** The theory cannot justify permanent exclusion of groups based on income, race, etc.
      *   **Anti-Displacement Core:** Must provide strong normative and practical weight against displacing vulnerable residents without overwhelming justification and mitigation.
      *   **Meaningful Agency/Procedural Integrity:** Residents must have real, not illusory, avenues to participate and challenge decisions. Shadow zoning must be indefensible.
      *   **Supply Recognition:** Must incorporate the necessity of enabling sufficient housing supply as a matter of justice, not just market efficiency.
  *   **Camp Preferences (Reasonable Disagreement):**
      *   **Local Autonomy vs. Regional Equity:** Should local communities have significant control, or should regional/state bodies override them to ensure equity and sufficient housing supply? (Tension Point).
      *   **Permanence vs. Mobility:** How strong is the claim to *remain* in one's specific place versus the need for cities to evolve and residents to move? (Tension Point).
      *   **Absolute vs. Contingent Rights:** Are rights to place absolute, or contingent on contributing/responsibility (dangerous slope!)?
      *   **Primary Focus:** Is the core aim resisting displacement, enabling access, democratizing production, or ensuring minimum standards?

  **IV. Joint Unsatisfiability (The Tension Points)**

  1.  **Absolute Permanence vs. Functional Urban Economy/Mobility:** Guaranteeing *every* current resident a permanent, unchanging place in their *exact current location* is fundamentally incompatible with the dynamism, redevelopment, and residential mobility required for a functional urban economy and adapting to change (climate, economic shifts). *Mitigation* is possible, but absolute permanence in situ is not.
  2.  **Full Inclusion (Open Access) vs. Strong Local Control:** Unrestricted local control (especially hyper-local, neighborhood-level) almost inevitably leads to exclusionary practices (formal or informal). Ensuring full inclusion for all potential residents (especially lower-income) *requires* limiting the scope of purely local veto power over housing development and land use. These are in deep tension.
  3.  **Radical Democratization of Production vs. Supply Elasticity:** While participatory planning is desirable, processes involving extensive veto points for numerous actors (NIMBYs, shadow zoning players) inherently slow down and constrain supply, conflicting with the need for supply elasticity.

  **V. Quick Scorecard on Existing Frameworks**

  *   **Lefebvre's Right to the City (Original):**
      *   **Strengths:** Powerful critique of exclusion, prioritizes use-value over exchange-value, centers collective appropriation and participation ("inhabitants" over owners/state/capital). Strong on anti-displacement sentiment.
      *   **Weaknesses Against List:** Vague on operationalization, enforcement, and specific mechanisms. Weak on supply economics and formal procedural integrity. Can struggle with individual/collective and permanence/mobility tensions. Shadow zoning might be seen as a perversion but not clearly addressed.
  *   **Libertarian Property-Rights View:**
      *   **Strengths:** Clear on enforcement (property rights), emphasizes supply elasticity (deregulation), opposes shadow zoning (as informal collusion distorting market).
      *   **Weaknesses Against List:** Fails catastrophically on anti-displacement (market rules), ignores collective claims and non-exclusion (market outcomes = just), offers no protection against NIMBYism exercised as property right. Ignores procedural fairness beyond contract.
  *   **Rawlsian Fair Cooperation Model:**
      *   **Strengths:** Strong on procedural fairness, balancing individual/collective via public reason, justifies regional equity/supply (benefiting least advantaged), condemns exclusion and shadow deals as unfair.
      *   **Weaknesses Against List:** Can be complex to operationalize in planning. May struggle with the *strength* of anti-displacement claims ("difference principle" could allow some displacement if it ultimately benefits the worst-off). Requires a robust, well-designed institutional framework which is hard to achieve. Local autonomy tension remains.

  **Core Takeaway:** An adequate theory needs to navigate the tensions, particularly between **protecting vulnerable incumbents** and **enabling access for newcomers/evolution**, and between **democratic participation** and **the necessity of enabling sufficient change/supply**. It must be procedural *and* substantive, recognizing both individual stakes and collective needs, and grappling explicitly with the economics of housing markets. The non-negotiables form a justice baseline; the camp preferences define the political struggle within just bounds.
