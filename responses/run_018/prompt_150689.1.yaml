answer: |-
  ### Q&A Prep: Moral Worth & Deliberative Sovereignty  
  **Most Damaging Objection First**  

  1.  **Kantian Purist:** "Your 'deliberative sovereignty' corrupts Kant's rigorism. If self-interested motives are *causally active* yet 'subordinated', how is this distinct from mere continence? True moral worth requires the *exclusive* causal efficacy of duty, lest we admit impure maxims."  
      *Reply:* Sovereignty ensures duty is the *structuring principle* of choice, not merely an impulse among equals. Subordinated motives lack normative force in the maxim’s justification, preserving purity.  
      *Weakness:* Risks conflating causal presence (allowed) with causal efficacy (forbidden) – a fine line.  

  2.  **Virtue Ethicist:** "This hyper-focus on discrete 'moments of choice' ignores character integration. Can fragmented agency—where self-interest is merely suppressed, not harmonized—ever achieve *eudaimonia*? Moral worth demands wholeheartedness, not structural dominance alone."  
      *Reply:* Sovereignty *enables* integration by establishing right-reason's regulative authority. Subordination is the *practical* manifestation of virtue’s unity in action-contexts.  
      *Weakness:* Doesn’t resolve if sovereignty *suffices* for integration or merely *initiates* it.  

  3.  **Moral Psychologist:** "Your model is empirically inert. How can we (or the agent) possibly verify 'structural dominance' vs. self-deceptive post-hoc rationalization? Privileging unobservable cognitive structures over behavioral or affective outputs is methodologically suspect."  
      *Reply:* Sovereignty is a normative, not empirical, criterion. It describes *how reasons function* in justification, not introspective certainty. Agents can misjudge, but the standard holds.  
      *Weakness:* Leaves the view vulnerable to skepticism about accessing practical reasoning.  

  4.  **Moral Luck Scholar:** "Doesn’t outcome luck undermine sovereignty? If an agent acts with apparent sovereignty but unintended consequences reveal latent selfish motives (e.g., hidden resentment), was sovereignty ever truly present? Your view seems luck-vulnerable."  
      *Reply:* Sovereignty concerns the *actual* reasoning structure *at t*, not retrospective reinterpretations. Luck in discovery doesn’t negate the prior structure’s reality.  
      *Weakness:* Struggles with cases where outcomes *validly* expose self-deception.  

  **The Objection You Hope Nobody Asks:**  
  **"Isn't 'genuine subordination' just a restatement of the very problem you're solving? If an agent *successfully* subordinates self-interest, duty is sovereign. If they fail, it isn't. This appears tautological—how is 'sovereignty' a substantive criterion beyond 'it worked here'?"**  
  *Reply:* Sovereignty specifies the *structural condition* for success: right-reason must play the *constitutive role* in unifying and prioritizing reasons, not merely win a motivational contest.  
  *Weakness:* Risks circularity if the *only* evidence for structure is the outcome it purports to explain.  

