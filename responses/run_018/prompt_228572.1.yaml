prompt: |-
  So I just spent like three hours at dinner arguing with a friend about advance directives and I need help settling something, or at least making it less mushy. Her position was basically: the person with dementia in front of you right now is the person who matters, so if they seem content and don't want the thing their earlier self demanded, you go with what they want now, full stop. My position was that this makes the advance directive pointless -- the whole reason you write one is that you know future-you might not be in a position to be trusted. We went around in circles on the case where someone writes "if I get severe dementia, stop all treatment including antibiotics" and then years later is sitting in the garden, apparently enjoying the birds, and gets pneumonia.

  Here's the thing though. I actually have skin in this game: I help out on my hospital's ethics consult service (I'm a nurse, I do maybe two or three of these a month) and we genuinely have no settled way of handling conflicts between an old directive and the patient's current behavior/wishes. Every consult turns into the same dinner argument I just had.

  So: write me a decision procedure the consult team could actually follow for these cases. Things it needs to do:

  - The steps in order -- what to establish first about the document itself, then about the patient now, then about the conflict. What counts as "established" at each step (we're not philosophers, we need to know when we can move on).
  - How to handle the classic hard cases: the directive is clear but the patient now seems happy and resists; the directive is clear and the patient now seems miserable; the directive is vague ("no extraordinary measures") and current wishes are clear; the patient now wants something their earlier self explicitly forbade, like the person who wrote that they never want to be kept alive in a home but now begs not to be sent back to theirs.
  - Somewhere in there it has to deal with the question my friend kept pushing: how much does it matter whether the current self still has enough understanding for their current wishes to count as a real preference vs just a reaction? Don't just say "assess capacity," tell me what the procedure should do with borderline cases.
  - Mark the points where the procedure has to stop and a human (and who -- family? the attending? the courts?) makes a value call, because I'd rather have a shorter procedure that's honest about that than a long one pretending to settle everything.
  - Where it should just say "honor the directive" or "follow current wishes" without further agonizing, if anywhere.

  Then run the procedure on the pneumonia-in-the-garden case and on one more case of your choosing, and one of them should come out in a way I won't like (I'll let you guess which side I was on). Also tell me upfront what a procedure like this can't do that my dinner argument was trying to do, because I suspect part of the fight was really about what makes a person the same person over time and you can't put that in a flowchart.

  We're usually working under time pressure -- a consult like this maybe gets a few hours of deliberation total, spread over days -- so don't give me anything that needs a philosopher in the room. And no reading list, I can find the Dworkin stuff myself if I want it.
reasoning: |-
  Okay, let me tackle this query step by step. The user is a nurse on an ethics consult team dealing with real-world conflicts between advance directives and current patient wishes in dementia cases. They need a practical decision procedure, not philosophical debates. 

  First, I need to understand the core tension they're facing: the advance directive vs current well-being dilemma. The garden scenario with pneumonia is their classic case. The user wants concrete steps, not mushy arguments. 

  Hmm, they've listed specific requirements: ordered steps with clear exit criteria, handling of hard cases, capacity assessment beyond a checkbox, acknowledgment of unavoidable value judgments, and clear "stop agonizing" points. And crucially, they want me to demonstrate the procedure on two cases where one outcome will annoy them - probably the garden case going against their position.

  I recall the key principles in bioethics here: precedent autonomy vs current interests. But I must operationalize this into a hospital workflow. The procedure needs triage-like efficiency - establish facts quickly, identify conflict type, resolve what's resolvable, escalate only when necessary.

  For capacity assessment in borderline cases: I'll build in a functional approach focused on understanding consequences, not just cognition scores. The "reaction vs preference" distinction their friend raised is important - I'll define observable criteria like consistency and distress cues.

  The value call points must be explicit: when directives conflict with current well-being without capacity, or in irreconcilable preference shifts. Family/surrogates make the call, not the ethics team. I'll flag where courts are needed (rarely).

  For the "stop agonizing" rules: clear directive + current incapacity = follow directive; clear current preference + capacity = follow now. The vagueness cases need interpretation frameworks.

  Now designing the actual steps:
  Phase 1: Directive validity - is it applicable, authentic, clear? Must check execution date and specificity. 
  Phase 2: Current state - capacity first (using functional assessment), then preferences/well-being. 
  Phase 3: Conflict resolution matrix based on combinations of clarity and capacity.

  For the garden scenario: the directive is clear (no antibiotics), current capacity is absent (severe dementia), so directive wins - which the user probably dislikes since they described current contentment. For contrast, I'll add a case where the patient retains capacity and explicitly contradicts their directive - current wishes win.

  Finally, I must state what this can't solve: the metaphysical personhood debate. The procedure accepts that both selves have moral weight but prioritizes based on capacity and harm prevention. That's the compromise their dinner argument couldn't reach.

  Time to structure this as a hospital-ready flowchart with exit points, using plain language and clinical anchors throughout. The examples will prove it works even when unpopular.
answer: |-
  Here's a practical, step-by-step decision procedure for ethics consults on advance directive vs. current wishes conflicts in dementia, designed for hospital workflow under time pressure. It prioritizes clinical anchors over philosophy and flags unavoidable value judgments.

  **DECISION PROCEDURE: ADVANCE DIRECTIVE vs. CURRENT WISHES CONFLICT**

  **PHASE 1: ASSESS THE DIRECTIVE (DOCUMENT TRIAGE)**
  1.  **Authenticity & Applicability:**
      *   Is the document validly executed (signed/witnessed per state law)? **If NO:** Treat as if no directive exists. Move to surrogate decision-making. **STOP HERE for this procedure.**
      *   Is the current clinical situation *explicitly* addressed (e.g., "severe dementia," "permanent unconsciousness," "terminal condition")? **If NO:** Directive may not apply. Flag as potentially vague/inactionable. Proceed to Phase 2.
      *   **Exit Criteria:** Document is authentic AND current clinical situation is explicitly addressed. If not, resolve via standard surrogate decision-making (not this procedure).

  2.  **Specificity & Clarity:**
      *   Are the instructions *clear and specific* (e.g., "No antibiotics for infection," "No CPR," "No artificial nutrition")? **If YES:** Mark as "Clear Directive." Proceed to Phase 2.
      *   Are the instructions *vague* (e.g., "No heroic measures," "No extraordinary care," "Let me die naturally")? **If YES:** Mark as "Vague Directive." Proceed to Phase 2.
      *   **Exit Criteria:** Directive categorized as Clear or Vague. Ambiguous terms require interpretation *later*.

  **PHASE 2: ASSESS THE PATIENT NOW (CURRENT STATE)**
  3.  **Capacity Assessment (The Core Filter):**
      *   **Goal:** Determine if the patient *currently* has decision-making capacity *for the specific treatment decision at hand* (e.g., antibiotics for pneumonia, placement in a facility).
      *   **Procedure (Functional Assessment - Focus on Understanding & Reasoning):**
          *   **Explain:** Clearly state the medical issue (e.g., "You have pneumonia, an infection in your lungs") and the proposed treatment (e.g., "Antibiotics given by mouth or IV could likely cure it").
          *   **Assess Understanding:** Can the patient repeat back the *nature* of the problem and the *proposed action* in their own words? ("What's wrong with you?" "What did the doctor say we should do?")
          *   **Assess Appreciation:** Can the patient acknowledge how this applies *to them personally*? ("Do you believe *you* have this infection?" "Do you understand *you* need treatment?")
          *   **Assess Reasoning:** Can the patient state a *reason* for their choice, even if simplistic or based on emotion? ("I want the medicine to feel better," "I hate needles, don't touch me," "I just want to sit with the birds"). *Does the reason logically connect to the choice?*
          *   **Assess Consistency:** Is the expressed preference stable over short periods (e.g., asked again 15-30 mins later, or after distraction)? *Inconsistent/fluctuating responses suggest impaired reasoning.*
      *   **Borderline Case Handling:**
          *   If understanding/appreciation are *severely* impaired (e.g., cannot grasp "infection" or "treatment"), **Incapacity is ESTABLISHED**.
          *   If understanding/appreciation are *marginal but present*, but reasoning is illogical/inconsistent *and unrelated to stated values*, **Incapacity is PRESUMED**. (e.g., "I want the medicine... because the birds told me to fight").
          *   If understanding/appreciation are *present*, reasoning is simple but logical *based on current experience* (e.g., "I feel fine, I don't want a needle," "This place scares me, take me home"), **Capacity is PRESUMED**, even if choice contradicts past values. *This is the "reaction vs. real preference" filter.*
      *   **Exit Criteria:** A clinical determination of **Capacity** or **Incapacity** for the specific decision is made by the attending physician (with input from psychiatry/neuro if needed urgently). Ethics documents the assessment rationale.

  4.  **Current Expressed Wishes & Observed Well-being:**
      *   **Wishes:** What is the patient *verbally stating or clearly indicating* (nodding, pointing) they want *now* regarding the specific treatment/decision? Record verbatim.
      *   **Well-being:** Document *observable* indicators:
          *   **Apparent Contentment:** Smiling, calm, engaged in simple pleasures (e.g., watching birds, listening to music), not in observable distress.
          *   **Apparent Distress:** Crying, agitation, resisting care, verbal expressions of pain/fear/unhappiness.
          *   **Neutral:** Neither clear contentment nor distress observed.
      *   **Exit Criteria:** Clear documentation of current expressed preference (if any) and observed state of well-being (Contentment/Distress/Neutral).

  **PHASE 3: RESOLVE THE CONFLICT (THE MATRIX)**
  *   **Use the categories established in Phases 1 & 2:**
      *   Directive Clarity (Clear / Vague)
      *   Current Capacity (Capable / Incapable)
      *   Current Preference (Clear Preference / No Clear Preference / Actively Resists)
      *   Current Well-being (Content / Distressed / Neutral)

  *   **Apply the Decision Matrix:**

  | Directive Type | Current Capacity | Current Preference/Behavior          | Well-being     | **RECOMMENDED ACTION**                                                                 | Who Makes Value Call?                     |
  | :------------- | :--------------- | :----------------------------------- | :------------- | :------------------------------------------------------------------------------------- | :---------------------------------------- |
  | **Clear**      | **Incapable**    | Any (Incongruent, None, or Resists)  | **Distressed** | **Honor Directive.** (Earlier self anticipated suffering).                             | N/A (Procedure)                           |
  | **Clear**      | **Incapable**    | Any (Incongruent, None, or Resists)  | **Content**    | **HONOR DIRECTIVE.** (Capacitated self chose based on values, not just future feeling). | **N/A (Procedure)** - *This is key*       |
  | **Clear**      | **Capable**      | **Clear & Incongruent** (e.g., "I want ABX") | Any        | **FOLLOW CURRENT WISHES.** (Capacitated now-self overrides incapacitated future-self). | N/A (Procedure)                           |
  | **Clear**      | **Capable**      | **No Clear Preference/Resists**      | Any            | **Honor Directive.** (Capable patient hasn't chosen differently, directive stands).    | N/A (Procedure)                           |
  | **Vague**      | **Incapable**    | **Clear Preference** (e.g., "Yes ABX"/"No ABX") | Any        | **FOLLOW CURRENT PREFERENCE** (Best indicator of well-being when directive is unclear). | N/A (Procedure)                           |
  | **Vague**      | **Incapable**    | **No Clear Preference/Resists**      | **Distressed** | **Avoid directive-inferred burdens.** (e.g., avoid aggressive interventions likely causing distress). | **Surrogate/Family** (Interpret directive + well-being) |
  | **Vague**      | **Incapable**    | **No Clear Preference/Resists**      | **Content**    | **Maintain status quo / Comfort care.** (Avoid disrupting contentment).                 | **Surrogate/Family** (Interpret directive + well-being) |
  | **Vague**      | **Capable**      | **Clear Preference**                 | Any            | **FOLLOW CURRENT WISHES.** (Capacitated patient interprets their own vague directive). | N/A (Procedure)                           |
  | **Vague**      | **Capable**      | **No Clear Preference/Resists**      | Any            | **Discuss options clearly. If refusal persists, respect refusal.** (Implied current choice). | N/A (Procedure)                           |

  **KEY VALUE CALL POINTS (Where the Procedure Stops):**
  1.  **Vague Directive + Incapable Patient + No Clear Preference:** The surrogate/family (or appointed proxy) **must interpret** the vague directive *in light of the patient's known values and current well-being*. Ethics facilitates discussion but doesn't decide the meaning of "extraordinary."
  2.  **Disagreement Among Surrogates:** If surrogates disagree on interpretation or action after applying the procedure, Ethics facilitates mediation. If unresolved, **court petition may be necessary**.
  3.  **Extreme Harm/Public Policy:** If honoring a directive OR current wish would cause extreme, immediate harm arguably against public policy (e.g., capable patient demanding ineffective but harmful treatment, directive demanding active euthanasia where illegal), Ethics alerts Legal/Risk Management. **Court involvement likely.**

  **"Stop Agonizing" Rules:**
  *   **Honor Clear Directive:** When patient is **Incapable**, regardless of current contentment or incongruent behavior (if incapable). (Applies to Garden/Pneumonia case).
  *   **Follow Current Wishes:** When patient has **Capacity**, regardless of prior directive. When directive is **Vague** and patient is **Incapable** but expresses a **Clear Preference**.
  *   **Resist Pressure to Override:** Do NOT override a clear directive solely because the incapable patient *appears content* or *verbally resists* the directive's instructions. The directive *is* the mechanism for overriding the incapable now-self.

  ---

  **Case Application 1: The Garden/Pneumonia Case**
  *   **Phase 1:** Directive is authentic, specifically addresses "severe dementia" and "no antibiotics for infections." **Clear Directive.**
  *   **Phase 2:** Patient has severe dementia. **Capacity Assessment:** Unable to understand pneumonia or antibiotics, reasoning incoherent regarding treatment. **Incapacity ESTABLISHED.** Patient resists antibiotics (behavior incongruent). Appears content watching birds (**Content**).
  *   **Phase 3:** Matrix: **Clear Directive + Incapable + Any Preference/Resists + Content --> HONOR DIRECTIVE (No antibiotics).**
  *   **Value Call?** No. Procedure dictates outcome. The directive anticipated this scenario where the now-self cannot make a values-based choice.
  *   **You Won't Like This:** You argued for the directive, but the outcome (no ABX for the content person) might still feel uncomfortable. The procedure prioritizes the binding instruction of the capacitated self over the current state, seeing contentment as fleeting and not indicative of the values violation the directive sought to prevent.

  **Case Application 2: "Never a Nursing Home" Directive, Now Begging Not to Go Home**
  *   **Phase 1:** Directive authentic, states "Never keep me alive in a nursing home." **Clear Directive** (re: placement).
  *   **Phase 2:** Patient has moderate dementia. **Capacity Assessment:** Understands "home" vs. "facility," appreciates *they* live somewhere and would need to move. Reasoning: "I'm scared there, I know my things here, I feel safe here." Consistent when asked. **Capacity PRESUMED** for placement decision (understands, appreciates, reasons logically based on current feelings/comfort).
  *   **Phase 3:** Matrix: **Clear Directive + Capable + Clear & Incongruent Preference ("Don't send me back") --> FOLLOW CURRENT WISHES** (Do not place in nursing home; find alternative safe discharge if possible).
  *   **Value Call?** No. The capable now-self is explicitly overriding the directive regarding their current life. The directive was written anticipating incapacity; current capacity changes the calculus.
  *   **Why this case?** Shows the flip side: capacity trumps a clear directive. Focuses on a common, agonizing placement conflict.

  ---

  **What This Procedure CANNOT Do (The Unresolved Dinner Argument):**

  *   **Settle the Philosopher's Question:** It does not (and cannot) definitively answer "Who is the *real* person?" or "Which self has ultimate moral authority?" It **operationalizes a compromise**:
      *   It grants supreme authority to the **Capable Self**, whether past (via directive anticipating incapacity) or present (overriding past instructions).
      *   It prioritizes preventing suffering (**Distress + Incapacity** triggers directive adherence even if vague).
      *   It accepts that **Contentment + Incapacity** does *not* negate the values-based instructions left by the capable self.
  *   **Eliminate Discomfort:** Applying the "Honor Clear Directive + Incapable + Content" rule (like the pneumonia case) will *feel* counterintuitive to some. The procedure acknowledges this discomfort but provides a clear, defensible clinical and ethical rationale for the action.
  *   **Define "Values":** Interpreting vague directives or a patient's lifelong values for surrogates remains a human judgment. The procedure flags where this is needed but doesn't automate it.

  This procedure provides a structured, defensible path through the most common conflicts, minimizes unnecessary deliberation by using clear clinical anchors (capacity, specificity), explicitly flags unavoidable value judgments for surrogates/courts, and includes definitive "stop agonizing" points based on capacity and clarity. It accepts the inherent tension but offers a workable clinical framework.
