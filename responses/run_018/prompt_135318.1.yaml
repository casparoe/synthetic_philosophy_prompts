  I'm trying to settle my commitments on indicative and counterfactual conditionals before drafting a workshop contribution, and I want an audit of whether the package hangs together. Here is where I stand: (1) I accept Stalnaker's unified semantics—both kinds share a selection-function core, with the only semantic difference being a presupposition about whether the antecedent is compatible with the actual world. (2) I think Adams's probabilistic thesis, that the assertibility of "If A then B" equals P(B|A), captures indicatives well but fails for counterfactuals, because counterfactual evaluation requires holding fixed a "causal backbone" of actual-world dependencies that reshuffles the conditioning space. (3) I hold that the indicative/counterfactual distinction is purely pragmatic: it amounts to nothing more than whether the speaker treats the antecedent as live (compatible with belief) or dead (believed false), filled entirely by context rather than by semantics. (4) I reject Lewis's similarity-based account specifically because his metric permits worlds that violate actual physical laws, and I think evaluation should preserve actual laws except in cases the speaker explicitly marks as miracles. (5) I think backtracking counterfactuals require a non-transitive similarity ordering weighted by causal priority rather than overall world-resemblance, so that revising an earlier cause can be closer than revising a later effect. (6) I maintain that both conditionals have the identical logical form [If φ, ψ] with a hidden parameter for evidential status that is resolved pragmatically. (7) I have been sketching what I call a "threshold-weighted" view: the strength of an indicative tracks how near P(A) is to the speaker's action-threshold, while counterfactual strength tracks causal-step distance from the actual world.

  Go through these seven commitments and tell me which pairs are genuinely in tension, which only appear to conflict but dissolve on inspection, and for each real tension how severe it is and what the cheapest revision would cost. I am genuinely unsure which commitment is weakest—do not assume I am prepared to drop (4) or (7) just because they sound idiosyncratic; treat all seven as live. Order the real tensions by severity, and then say which single revision, if I must make one, would clean up the most problems at once.

