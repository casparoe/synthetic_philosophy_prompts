answer: |-
  Here's an argument defending the specified view, strictly adhering to Dennett's real-patterns criterion and focusing on the interaction between pattern-reality conditions and the absence of discrete design:

  1.  **Dennett's Real-Patterns Criterion:** A pattern is "real" if compressing the system's description by adopting a particular vocabulary (e.g., physical, design, intentional) yields robust, counterfactual-supporting predictive power over the relevant domain. All stances are "ontologically neutral" – the patterns each reveals are equally real if they meet this criterion, and the choice between them is pragmatic.

  2.  **The Target Systems: Distributed Biological Emergence (e.g., Slime Mold, Ant Colonies):**
      *   **Lack Centralized Design History:** Selection acts on the *collective outcome* (e.g., colony survival, nutrient finding). It does not design, blueprint, or genetically encode discrete, functionally specified *parts* performing specific sub-tasks within the collective. The "parts" (individual ants, slime mold cells) are largely interchangeable and follow simple local rules.
      *   **Non-Decomposable Physical Dynamics:** The system's causally efficacious behavior *cannot* be understood by exhaustively describing the low-level physical state transitions of the individual components and summing them up. The critical causal dynamics emerge *only* from the interactions and feedback loops within the collective. Reducing the system to individual physics misses the systemic properties driving its behavior.

  3.  **Applying Real-Patterns Consistently Reveals Stance Collapse:**
      *   **Physical Stance Failure (Capturing Causally Efficacious Information):** Describing the system purely in terms of the physics of individual components (ant leg movements, cell chemical diffusion) generates an astronomically complex description with negligible predictive compression regarding the system's *adaptive, goal-directed behavior* (finding shortest paths, optimizing foraging). The causally efficacious "informational structures" – the network topology in slime mold representing efficient paths, the pheromone gradient field in ants representing resource locations – are *patterns existing solely in the relationships and dynamics of the collective*. They are invisible to a description focused on individual component physics. The physical stance fails Dennett's own criterion for being the *salient* real pattern for explaining the system's adaptive success; it doesn't compress the description of the *efficacious* dynamics.
      *   **Design Stance Failure (Absence of Fixed Functional Parts):** The design stance requires identifying discrete components with fixed, teleologically specified functions (like gears in a watch). However, in these distributed systems:
          *   There are no genetically "designed" components with *fixed* functional roles within the collective computation. An ant isn't a "pheromone depositor unit"; it performs many context-dependent roles.
          *   Selection doesn't act to optimize *parts* for specific sub-functions within the collective strategy; it acts on the emergent *outcome* of the collective interaction. The "functionality" is distributed and fluid, not localized in discrete components. Attempting to apply the design stance forces an artificial decomposition onto a system where functional decomposition isn't physically grounded by evolutionary history or current dynamics. It fails to find the robust, compressed description of the system's operation that the real-patterns criterion demands. The relevant "design" is for simple local rules, not complex global functional architecture.

  4.  **The Unavoidable Primacy of the Intentional Stance:**
      *   **Tracks the Real, Efficacious Pattern:** Only the intentional stance – attributing beliefs (e.g., "there is food *that way*" based on pheromone concentration), desires (e.g., "minimize path length," "maximize nutrient intake"), and rationality to the *collective system* – yields significant predictive compression over the system's adaptive, goal-oriented behavior. Describing the slime mold as "solving" a network optimization problem or the ant colony as "efficiently foraging" captures the emergent pattern that is causally responsible for the system's success.
      *   **Reveals Physically Real Patterns:** This intentional-level pattern *is* physically real: it supervenes on the physical components and their interactions, and it demonstrably causes effects in the world (efficient nutrient transport, colony growth). Crucially, this pattern is *only visible and describable* at this level of abstraction. Lower-level descriptions (physics of individuals) drown it in noise; the design stance cannot find its purchase due to the lack of discrete functional parts.
      *   **Not Merely Heuristic, But Ontologically Committed:** Because the causally efficacious pattern driving the system's adaptive behavior *only exists* at this intentional level of description, adopting the intentional stance is *not* merely a convenient instrumental heuristic. It is *necessary* to identify the real pattern that meets Dennett's own criterion for reality: it provides the maximally compressed, robustly predictive description of the system's *causally potent* dynamics. To deny the reality of the patterns described by the intentional stance here is to deny the reality of the very patterns that explain the system's existence and success – patterns Dennett's criterion deems real.

  **Conclusion:** When Dennett's real-patterns criterion is applied consistently to distributed biological systems lacking centralized design history and decomposable dynamics, the ontological neutrality of the stances collapses. The physical stance fails to capture the causally efficacious informational structures (emergent patterns). The design stance is inapplicable due to the absence of selection-fixed discrete functional parts. Consequently, the intentional stance becomes uniquely capable of tracking the salient, physically real patterns responsible for the system's adaptive behavior – patterns that only exist at that level of collective abstraction. For such emergent collective cognition, the intentional stance is therefore not just a useful predictive tool, but an *unavoidable ontological commitment* to the reality of the patterns it reveals, directly undermining Dennett's claim that the three stances are always equally real or instrumental. The absence of design and non-decomposability forces the intentional stance into ontological primacy to capture the real, efficacious pattern.
