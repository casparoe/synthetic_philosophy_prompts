  ok so i recently started co-writing reports with an AI and now i'm weirdly stuck on grice. i came up with this idea i call merged impliciture: the model suggests phrasing, i pick and tweak it, but only i have intentions, so is the implicature still mine? my coworker says the model constrains what i can mean, so speaker meaning is actually disributed, not just influenced. what's your credence that grice's framework can absorb this merged case without breaking? decompose it: (1) the prob grice's original view requires a single unitary psychological subject, (2) the prob that if he does we should extend him rather than say these utterances just lack full speaker meaning, (3) the prob that my coworker's constraint-equals-distribution argument actually works, (4) combine them. one line justification and a rough number for each, then the total. tell me which term you'd be least surprised to see shift, and what evidence (maybe a study of writers describing their intentions) would do it. also i defintely misspelled something here.
