  Combining these: Starting with the 85% physicalism prior. Then multiplying by the 65% that phenomenal concepts save physicalism. Then multiplying by the inverse of the ability/indexical objections failing (since those are the main threats). So 0.85 * 0.65 * (1 - (weighted average of threat probabilities)). That gives me around 0.48.

  The biggest mover is clearly the phenomenal concept strategy - if that fails, physicalism is in trouble. The user's 0.40 is probably lower because they weight the ability reply or indexicals more heavily, or because their physicalism prior is lower. 

