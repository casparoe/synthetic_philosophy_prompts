  I'm currently writing a seminar paper in philosophy of mind on Frank Jackson's knowledge argument, and I'm trying to pinpoint exactly where my own reasoning fractures rather than relying on a vague intuition. I accept that Mary, upon leaving the room and seeing red for the first time, acquires something she lacked—yet my credence that this "something" is an ontologically non-physical fact, as opposed to a new phenomenal concept or acquaintance relation applied to an already-physical state, sits at about 0.40.

  Could you state your own credence—expressed as a specific number—that Mary's case genuinely establishes an ontological gap incompatible with physicalism, and decompose the reasoning into explicit sub-questions? In particular, I want you to weigh: (a) whether Mary's gain is best characterized as propositional knowledge of a new fact, as an ability (in the Lewis/Nemirow sense), or as the acquisition of a phenomenal concept that re-presents an old fact under a new mode; (b) whether treating her gain as analogous to learning an indexical—like coming to know "it is now 3 PM" without learning any new objective feature of the world—successfully dissolves the intuition without dismissing the phenomenology; (c) the probability that physicalism can be preserved via a phenomenal-concept strategy that accepts all Mary's knowledge but denies it reveals non-physical properties; and (d) the baseline prior that qualitative experience can in principle be fully captured by physical-functional descriptions. Assign each factor a rough probability, show how they combine, and identify the single term that most moves your final number. Then explain whether my 0.40 likely diverges from yours mainly on the strength of the ability reply, on the legitimacy of phenomenal concepts, or on the underlying plausibility of physicalism itself, and specify what empirical finding—perhaps about whether phenomenal reports can be predicted from complete neural descriptions—would shift your overall judgment the most.
