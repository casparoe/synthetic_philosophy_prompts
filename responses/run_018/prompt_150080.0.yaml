prompt: |-
  I'm currently working through the tension between virtue ethics and situationist moral psychology in a seminar on character, and rather than committing to a theoretical camp I've been trying to derive my actual position from my unreflective judgments about concrete cases. I find myself drawn to verdicts that seem hard to square with either a pure global-trait view or a pure situationist denial of character altogether. Here are the judgments I keep returning to, and I would like to know whether there is a coherent principle—perhaps involving domain-specificity, institutional framing, or narrative self-constitution—that can accommodate them, or whether I must abandon at least one.

  First, Maria is meticulously honest in her accounting practice—she never misstates figures—yet she routinely embellishes her outdoor adventures to friends. I still want to say she possesses the virtue of honesty, but only within a professional-epistemic domain; I do not treat her social exaggeration as disproving the trait. Second, David is genuinely courageous in physical emergencies—he has rescued people from burning buildings—but in a structured organizational-ethics scenario he remains silent about misconduct because the social cost is high. I think he has physical courage without institutional moral courage, and I resist collapsing the two into a single global disposition. Third, imagine a controlled study in which participants are randomly assigned the temporary role of "fairness monitor" in a collaborative task; those assigned the role enforce equitable distributions with high consistency across changing group compositions, while those without the assignment show virtually none. My intuition is that the role does not merely elicit a pre-existing trait but temporarily constitutes one, suggesting that some virtues are framing-dependent rather than latent. Fourth, Professor Chen demonstrates profound intellectual humility in her scholarship—she revises her theories in response to counterevidence—but she is rigid and dismissive in departmental governance. I want to say she has the virtue in her epistemic practice yet lacks it in her administrative self, though I am unsure whether this is a domain split or a failure of integration. Fifth, my acquaintance Leo lies indiscriminately about taxes, feelings, and excuses, with no discernible pattern tied to context or pressure; here I have no hesitation in saying he simply lacks honesty. Sixth, and most puzzling to me, consider two people with statistically identical behavioral profiles across twenty diverse helping situations—each assists strangers roughly sixty percent of the time. One weaves these actions into a coherent self-narrative of "trying to be kind," while the other regards them as situationally caused accidents. I feel the first genuinely possesses kindness in a way the second does not, despite the behavioral equivalence.

  These verdicts pull in different directions: domain-specificity for Maria and Chen, framing-dependence for the monitor study, absence for Leo, and narrative constitution for the final pair. Is there a unified account—say, one that treats virtues as locally stable dispositions that require both cross-situational coherence within a domain and a first-personal narrative endorsement—that can preserve all six judgments? If so, apply it to a case I have not considered: an individual who displays consistent compassion only within an immersive virtual environment, caring meticulously for digital entities, but shows no comparable behavior in physical-world interactions. If no single principle saves every verdict, which one should I drop, and what does that imply for whether situationism or virtue ethics is closer to the truth?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're grappling with the tension between virtue ethics and situationist moral psychology. Instead of picking a side, they're deriving their stance from concrete judgments about cases. They've listed six scenarios where their intuitions don't neatly fit either a global-trait view or a pure situationist denial of character. The goal is to find a coherent principle that accommodates all these judgments or decide which one to abandon.

  First, I need to understand each scenario and the underlying intuitions. Maria is honest professionally but embellishes socially. The user sees honesty as domain-specific. David shows physical courage but not institutional moral courage—again, domain-specificity. The fairness monitor study suggests that a role can temporarily constitute a virtue, pointing to framing-dependence. Professor Chen has intellectual humility in scholarship but not in administration, raising questions about domain splits or integration failure. Leo lacks honesty across all contexts, indicating a global absence. The two helpers with identical behavior but different self-narratives—the user feels the narrative creates the virtue, emphasizing self-constitution.

  The challenge is reconciling domain-specificity, framing-dependence, narrative construction, and global absence. The user mentions possible principles like domain-specificity, institutional framing, or narrative self-constitution. I recall that some virtue ethicists, like Annas, discuss virtues as skills that require integration. Situationists like Doris argue for local traits. Maybe a hybrid approach combining situationist insights with a structured virtue framework could work.

  Let me think about the proposed principle: locally stable dispositions requiring domain coherence and narrative endorsement. For Maria, her professional honesty is a local disposition in the epistemic domain, reinforced by her professional narrative. David's physical courage is another local disposition, distinct from institutional contexts. The fairness monitor role creates a temporary disposition through institutional framing, which lacks narrative depth. Leo's lack of any consistent honesty shows no domain coherence. The narrative in the helper case provides the endorsement needed for the virtue, even if behavior is inconsistent.

  Now, applying this to the VR compassion case. The individual shows consistent compassion in a virtual environment but not in the physical world. Using the principle, the VR context is a specific domain where the disposition is stable. But does the person have a narrative endorsing this as part of their identity? If they see their VR actions as role-playing without integrating it into their self-concept, it's like the fairness monitor—framing-dependent but not a virtue. If they narratively identify as compassionate in digital spaces, it might be a domain-specific virtue, but the lack of cross-domain consistency could question its integration.

  The user might be concerned about how virtues transfer between contexts. The deeper issue is whether virtues require integration across life domains or can be compartmentalized. Virtue ethics traditionally sees virtues as integrated traits, but situationism highlights fragmentation. The user's intuitions lean towards fragmentation but with narrative as a unifying thread. 

  If the VR case shows no narrative integration, it's not a virtue. But if the person sees themselves as compassionate only online, it's a local virtue. However, traditional virtue ethics might argue that true compassion shouldn't be confined to a domain. This tension suggests maybe abandoning the idea that virtues must be global. Instead, accepting domain-specific virtues with narrative grounding could be the solution, even if it deviates from classical virtue ethics.

  Looking back at the six cases, Leo's global absence fits as the outlier showing no local coherence. The others have domain-specific or narrative-backed traits. The fairness monitor might be the trickiest because it's temporary and lacks narrative. If the user is willing to see it as a proto-virtue enabled by framing but not a full virtue without narrative, it could fit. 

  The user's deeper need might be to resolve the theory-practice conflict in moral psychology. They want a model that accounts for real-life complexity without discarding character entirely. The hybrid model offers a practical middle ground, acknowledging situational influences while preserving agency through narrative. This positions them closer to a moderated virtue ethics that incorporates situationist findings, avoiding both extremes.
answer: |-
  Your intuitions reveal a sophisticated, hybrid view that reconciles virtue ethics with situationist insights through **domain-specific, narratively integrated dispositions under institutional framing**. This framework preserves all six judgments without contradiction. Here's the unified principle:

  **Virtues are locally stable dispositions that require:**
  1. **Domain-specific behavioral coherence** (consistency within a defined sphere of activity)
  2. **Institutional or role-based framing** (contextual scaffolding enabling expression)
  3. **First-personal narrative endorsement** (self-conception as possessing the trait)

  ---

  ### **Application to Your Cases:**
  1. **Maria (Honesty):**  
     - *Domain:* Professional-epistemic (accounting) ≠ social storytelling.  
     - *Framing:* Accounting standards enforce structure; social interactions lack equivalent guardrails.  
     - *Narrative:* She identifies as "professionally meticulous" but doesn't extend this to casual conversation.  
     → **Verdict preserved:** Honesty exists as a domain-specific virtue.

  2. **David (Courage):**  
     - *Domain:* Physical emergencies ≠ organizational ethics.  
     - *Framing:* Immediate physical danger triggers instinctive responses; institutional settings involve complex social calculus.  
     - *Narrative:* He sees himself as "someone who acts in crises" but not as a "whistleblower."  
     → **Verdict preserved:** Physical courage ≠ moral courage.

  3. **Fairness Monitors (Study):**  
     - *Domain:* Specific collaborative task under experimental conditions.  
     - *Framing:* The "monitor" role creates institutional expectations.  
     - *Narrative:* Lacks narrative endorsement—participants don't internalize fairness as a personal trait.  
     → **Verdict preserved:** Framing enables temporary disposition, but without narrative integration, it's not a *virtue*.

  4. **Professor Chen (Humility):**  
     - *Domain:* Epistemic practice (scholarship) ≠ administrative governance.  
     - *Framing:* Academic norms reward intellectual revision; bureaucratic power dynamics discourage administrative flexibility.  
     - *Narrative:* She identifies as "open-minded scholar" but not "collaborative administrator."  
     → **Verdict preserved:** Domain-specific virtue; failure of integration explains the split.

  5. **Leo (Dishonesty):**  
     - *Domain:* No consistent domain coherence (lies across contexts).  
     - *Framing:* No institutional or narrative anchors for honesty.  
     - *Narrative:* Absence of self-identification with truthfulness.  
     → **Verdict preserved:** Globally lacks the virtue.

  6. **Identical Helpers (Kindness):**  
     - *Behavior:* Statistically equivalent but patternless.  
     - *Narrative:* The first self-narrates as "trying to be kind," creating intentional coherence; the second sees actions as accidents.  
     → **Verdict preserved:** Narrative endorsement transforms fragmented behaviors into a virtue.

  ---

  ### **Test Case: VR Compassion**
  *Scenario: An individual displays consistent compassion in an immersive virtual environment (e.g., caring for digital entities) but shows no comparable behavior in physical interactions.*

  - **Analysis under the unified principle:**  
    - *Domain-specific coherence:* Yes—within the VR domain.  
    - *Institutional framing:* The virtual environment provides scaffolding (e.g., clear feedback, low-risk consequences).  
    - *Narrative endorsement:* Critical. If they see their VR self as "truly compassionate," it constitutes a **domain-specific virtue** (digital compassion). If they view it as role-play ("just a game"), it remains a framing-dependent disposition without virtue status.  

  → **Verdict:** This can be a genuine but *local* virtue *if* narratively integrated. Without narrative, it mirrors the fairness monitor study—a contextual behavior without deeper character.

  ---

  ### **Why This Works & Theoretical Implications**
  - **Saves all verdicts** by rejecting *global* character traits while preserving *local* virtues.  
  - **Addresses situationism:** Your view accepts that virtues are situationally scaffolded (framing) and fragmented (domains), but demands more than mere behavior—it requires narrative self-constitution.  
  - **Rescues virtue ethics:** Virtues remain real, stable dispositions within bounded contexts, grounded in agency (narrative) rather than passive habit.  
  - **Resolves the tension:** Neither pure virtue ethics (overly global) nor radical situationism (eliminativist about character) wins. Instead, virtues are **ecological**: emerging from person-domain-framing-narrative interactions.

  **The cost:** You must abandon **classical virtue ethics' demand for global cross-situational consistency**. Virtues become "local triumphs" (e.g., Maria’s honesty) that may not generalize. This aligns with "trait localism" (Doris) but adds narrative depth missing in situationism.

  **The payoff:** A psychologically realistic account where character is *both* fragmented and authentic—explaining why we praise David’s physical courage while condemning his institutional cowardice, or why Leo’s dishonesty feels fundamentally different from Maria’s domain-limited flaw.

  ---

  ### **Conclusion**
  Your intuitions map perfectly to a **narratively structured, domain-specific virtue theory**. It shows virtue ethics can survive situationist critiques by localizing character without abandoning it. The VR case proves the model’s flexibility: compassion can exist in a digital domain if narratively owned, challenging traditional views of virtue’s "reality" but enriching our understanding of moral psychology. Drop the globalism, keep the domains—and let narrative bind them.
