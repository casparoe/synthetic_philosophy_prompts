prompt: |-
  Write the full specification of desiderata that any adequate normative theory of safe Pareto improvements must meet, specifically for assessing institutional reforms where baseline welfare is contested and hidden counterfactual risks exist. The list should cover: the phenomena it must explain, including reforms that appear Pareto-improving but generate unobservable or delayed losses; the distinctions it must preserve, such as between being genuinely no-worse-off and merely being unprotested, and between static and dynamically safe improvements; and the consistency conditions with welfare economics it must respect. For each requirement, provide the motivating case—e.g., adaptive preference formation that masks harm, coalition-proofness failures presented as unanimous gains, robustness to misspecified reference groups, and reversibility under epistemic updates about long-run effects—and flag whether it is non-negotiable or reflects a particular normative camp (ex-ante versus ex-post, local versus global evaluation). Identify any subset of desiderata that is jointly unsatisfiable given standard results in social choice theory, and state which single requirement eliminates the largest share of conventional policy-evaluation frameworks. Keep the conceptual weight on the criteria and their justification; briefly score standard welfare-theoretic approaches only if it clarifies the list.
reasoning: |-
  We are constructing a list of desiderata for a normative theory of "safe Pareto improvements" in the context of institutional reforms. The setting is one where baseline welfare is contested (i.e., there is disagreement about the initial welfare levels or their measurement) and hidden counterfactual risks exist (risks that are not observable or not accounted for in the status quo). The theory must address several phenomena, preserve key distinctions, and respect consistency conditions with welfare economics.

  We break down the desiderata into three categories:

  1. **Phenomena to Explain**: The theory must account for specific real-world cases where apparent Pareto improvements turn out to be harmful in unobservable or delayed ways.
  2. **Distinctions to Preserve**: The theory must maintain crucial conceptual boundaries that are often blurred in conventional analysis.
  3. **Consistency Conditions**: The theory must be consistent with fundamental principles of welfare economics, while addressing the challenges posed by the contested baseline and hidden risks.

  For each requirement, we provide:
  - The requirement itself.
  - A motivating case (example) that illustrates why the requirement is necessary.
  - A note on whether the requirement is non-negotiable (i.e., a minimal condition for any adequate theory) or if it reflects a particular normative camp (e.g., ex-ante vs. ex-post, local vs. global).

  Additionally, we identify if any subset of desiderata is jointly unsatisfiable (due to known results in social choice theory) and which single requirement eliminates the largest share of conventional policy-evaluation frameworks.

  ---

  **Desiderata for a Normative Theory of Safe Pareto Improvements**

  **I. Phenomena the Theory Must Explain**

  1. **Hidden Harm from Apparent Gains**  
     *Requirement*: The theory must explain and guard against reforms that appear to make everyone better off (or at least no one worse off) in the short run but cause unobservable harm (e.g., through erosion of future capabilities, hidden exploitation, or psychological adaptation) that becomes apparent only later or under different conditions.  
     *Motivating Case*: Consider a reform that increases current consumption by depleting a resource that is not immediately observable (like a hidden environmental asset) or that causes workers to adapt to stressful conditions by lowering their expectations (adaptive preferences). The harm is not captured in the immediate welfare metrics.  
     *Normative Status*: Non-negotiable. Any theory that fails to account for hidden harm is inadequate for real-world reforms.

  2. **Delayed Losses**  
     *Requirement*: The theory must account for reforms that generate gains in the immediate future but lead to losses in the long run, especially when the losses are irreversible (e.g., extinction of species, climate tipping points) or when the burden falls on future generations.  
     *Motivating Case*: A policy that boosts economic growth by emitting greenhouse gases at a rate that triggers catastrophic climate change decades later, disproportionately affecting future generations.  
     *Normative Status*: Non-negotiable. Intertemporal externalities are pervasive and must be addressed.

  3. **Coalition-Proofness Failures**  
     *Requirement*: The theory must explain why apparent unanimous consent (or lack of protest) for a reform might mask coercion or manipulation within subgroups, especially when the reform creates winners and losers but the losers are silenced or excluded.  
     *Motivating Case*: A workplace reform that is "unanimously" approved by a committee because the dissenting voices (e.g., from a vulnerable group) are excluded. The reform then leads to hidden harm for the excluded group.  
     *Normative Status*: Non-negotiable. Unanimity must be robust to strategic behavior and exclusion.

  **II. Distinctions the Theory Must Preserve**

  4. **Genuine No-Worse-Off vs. Unprotested**  
     *Requirement*: The theory must distinguish between individuals who are objectively (or intertemporally) no worse off and those who do not protest (due to adaptation, lack of information, or fear).  
     *Motivating Case*: In a society with strong norms against complaining, a group might not protest a harmful reform because of fear of social sanction or because they have adapted to worsening conditions (e.g., the "happy slave" problem). The theory must not equate silence with welfare neutrality.  
     *Normative Status*: Non-negotiable. This distinction is fundamental to avoid exploitation.

  5. **Static vs. Dynamic Safety**  
     *Requirement*: The theory must recognize the difference between a static Pareto improvement (where no one is worse off at a given point in time) and a dynamically safe improvement (which remains Pareto improving over time and under possible future states of the world).  
     *Motivating Case*: A financial reform that appears Pareto improving in a static analysis (because it raises current incomes) but leads to a systemic crisis in the future. The theory must require dynamic safety.  
     *Normative Status*: Non-negotiable. Without dynamic safety, reforms may be myopic.

  6. **Robustness to Misspecified Reference Groups**  
     *Requirement*: The theory must not rely on fixed reference groups for welfare comparisons because groups may be misspecified (e.g., ignoring cross-group externalities) or because individuals may belong to multiple overlapping groups.  
     *Motivating Case*: A reform that benefits a defined group (e.g., citizens of a country) but harms non-citizens (e.g., foreign workers or future immigrants) who are not included in the reference group. Conventional welfare analysis often ignores such externalities.  
     *Normative Status*: This reflects a global (as opposed to local) evaluation perspective. It is a point of debate between nationalist and cosmopolitan theories, but for a theory aiming at global safety, it is non-negotiable.

  **III. Consistency Conditions with Welfare Economics**

  7. **Reversibility under Epistemic Updates**  
     *Requirement*: The theory must require that a reform deemed safe can be reversed if new information reveals that it is causing harm (or will cause harm) without imposing excessive costs. This is particularly important when the initial assessment underestimated long-run risks.  
     *Motivating Case*: A technological innovation (e.g., a new pesticide) is adopted because initial tests show no harm, but later studies reveal severe long-term ecological damage. The reform must be reversible without prohibitive costs.  
     *Normative Status*: Non-negotiable. It is a safeguard against persistent errors.

  8. **Ex-Ante/Ex-Post Consistency**  
     *Requirement*: The theory must be consistent in its treatment of ex-ante and ex-post evaluations. Specifically, if a reform is judged safe ex-ante (based on available information), but ex-post it turns out to have harmed someone, the theory must provide a mechanism for reevaluation and compensation (or reversal).  
     *Motivating Case*: A financial innovation that is approved because models predict no harm, but which leads to losses in a rare crisis. The theory should not ignore the ex-post harm just because the ex-ante assessment was favorable.  
     *Normative Status*: This bridges ex-ante and ex-post perspectives. It is non-negotiable for a theory that respects both planning and accountability.

  9. **Non-Imposition of Uncompensated Losses**  
     *Requirement*: The theory must respect the Pareto principle in the sense that it should not allow a reform that imposes a net loss on any individual without compensation, even if that loss is hidden or delayed.  
     *Motivating Case*: A reform that generates gains for the majority but causes uncompensated losses to a minority (e.g., through hidden costs). The theory must block such reforms unless compensation is paid.  
     *Normative Status*: Non-negotiable. This is the core of the Pareto principle.

  **Analysis of Tensions and Inconsistencies**

  - **Joint Unsatisfiability**: Some desiderata may be jointly unsatisfiable due to known results in social choice theory. In particular, the requirement for **dynamic safety (5)** and **ex-ante/ex-post consistency (8)** might conflict with **non-imposition of uncompensated losses (9)** when there is uncertainty and learning. The reason is that in a dynamic setting with uncertainty, it is impossible to guarantee that no one will ever be ex-post worse off without being overly conservative (which might block all reforms). This tension is related to the "ex-ante Pareto vs. ex-post Pareto" conflict (Mongin, 2016) and the impossibility of dynamically consistent planning under uncertainty.

  - **Most Eliminative Requirement**: The requirement that eliminates the largest share of conventional policy-evaluation frameworks is **robustness to misspecified reference groups (6)**. Most conventional frameworks (e.g., Kaldor-Hicks efficiency, cost-benefit analysis) are defined with respect to a fixed jurisdiction or population and ignore spillovers to external groups. This requirement forces the theory to adopt a global perspective, which rules out most standard methods that are nation-based.

  **Scoring Standard Approaches (Briefly)**

  - **Pareto Efficiency (static)**: Fails on dynamic safety (5), hidden harm (1), delayed losses (2), and robustness to reference groups (6).
  - **Kaldor-Hicks Efficiency**: Fails on non-imposition of uncompensated losses (9) and robustness to reference groups (6). Also fails on hidden harm (1) and delayed losses (2) because compensation is hypothetical and may not occur.
  - **Cost-Benefit Analysis (with discounting)**: Fails on delayed losses (2) if discounting undervalues the future, and on hidden harm (1) if not all impacts are monetized. Fails on robustness to reference groups (6) and may fail on dynamic safety (5) if it does not account for systemic risks.
  - **Expected Utility (ex-ante)**: Fails on ex-ante/ex-post consistency (8) and reversibility (7) because it does not mandate reversibility when new information arrives. Also fails on hidden harm (1) if the utility function does not capture long-term adaptation effects.

  ---

  **Conclusion**: An adequate theory must meet all the non-negotiable requirements (which are the majority). The most challenging aspect is reconciling dynamic safety and non-imposition of losses under uncertainty, which may require a departure from standard frameworks. The requirement for robustness to misspecified reference groups is the one that most forces a break from conventional methods.
answer: |-
  ### Full Specification of Desiderata for Normative Theories of Safe Pareto Improvements  
  **Context**: Institutional reforms where baseline welfare is contested (disagreement over initial welfare levels) and hidden counterfactual risks exist (unobservable/delayed losses). The theory must ensure reforms are *robustly* Pareto-improving—genuinely leaving no one worse off, including in dynamic, uncertain, or non-transparent settings.  

  ---

  #### **I. Phenomena the Theory Must Explain**  
  *(Real-world cases where apparent Pareto improvements mask harm)*  

  1. **Adaptive Preference Formation Masking Harm**  
     - **Requirement**: Explain reforms where individuals *perceive* no loss due to psychological adaptation (e.g., lowered aspirations under oppression), but objective welfare declines.  
     - **Motivating Case**: Workers accept wage cuts during recessions due to "learned helplessness," masking exploitation and eroded long-term bargaining power.  
     - **Status**: Non-negotiable (prevents false positives from subjective reports).  

  2. **Coalition-Proofness Failures**  
     - **Requirement**: Explain why apparent unanimous consent can hide coercion, exclusion, or intra-group power imbalances that silence potential losers.  
     - **Motivating Case**: A labor reform approved by union leaders (claiming unanimous support) ignores non-unionized workers who bear hidden costs (e.g., job insecurity).  
     - **Status**: Non-negotiable (avoids "tyranny of the majority").  

  3. **Delayed or Irreversible Losses**  
     - **Requirement**: Explain reforms with immediate gains but long-term losses (e.g., environmental degradation, debt burdens) that violate intergenerational Pareto safety.  
     - **Motivating Case**: Deregulation boosting short-term profits while causing ecological collapse (e.g., fishery depletion), harming future generations.  
     - **Status**: Non-negotiable (core to dynamic safety).  

  4. **Hidden Counterfactual Risks**  
     - **Requirement**: Explain reforms that appear safe ex-ante but fail under unmodeled states (e.g., black swan events, systemic cascades).  
     - **Motivating Case**: Financial deregulation deemed Pareto-safe in stable times triggers a crisis when latent risks materialize (e.g., 2008 housing crash).  
     - **Status**: Non-negotiable (addresses epistemic limitations).  

  ---

  #### **II. Distinctions the Theory Must Preserve**  
  *(Conceptual boundaries critical for rigor)*  

  5. **Genuine No-Worse-Off vs. Merely Unprotested**  
     - **Requirement**: Distinguish between *objective* welfare neutrality (across time/contexts) and *de facto* non-protest (due to ignorance, adaptation, or coercion).  
     - **Motivating Case**: Serfs under feudalism do not protest land enclosures due to fear—this is not evidence of no harm.  
     - **Status**: Non-negotiable (rejects revealed preference as sufficient).  

  6. **Static vs. Dynamically Safe Improvements**  
     - **Requirement**: Separate *static* Pareto improvements (welfare gains at time *t*) from *dynamically safe* improvements (no one worse off in all future states *t+Δt*).  
     - **Motivating Case**: A static gain from fossil fuel use today may cause climate-driven losses tomorrow.  
     - **Status**: Non-negotiable (integrates time/uncertainty).  

  7. **Robustness to Misspecified Reference Groups**  
     - **Requirement**: Ensure welfare comparisons remain valid even when reference groups are misdefined (e.g., ignoring cross-border spillovers or future agents).  
     - **Motivating Case**: A trade policy benefiting domestic workers but exploiting foreign labor; standard analysis ignores the latter group.  
     - **Status**: Reflects cosmopolitan/global normative camp (vs. nationalist/local).  

  ---

  #### **III. Consistency Conditions with Welfare Economics**  
  *(Alignment with foundational principles)*  

  8. **Reversibility under Epistemic Updates**  
     - **Requirement**: Reforms must be reversible (without prohibitive cost) if new information reveals hidden harm.  
     - **Motivating Case**: AI deployment initially deemed safe, but later found to cause bias; reversal must be feasible.  
     - **Status**: Non-negotiable (embodies precautionary principle).  

  9. **Ex-Ante/Ex-Post Welfare Consistency**  
     - **Requirement**: Reforms judged ex-ante Pareto-safe must not lead to ex-post Pareto failures without recourse (e.g., compensation, reversal).  
     - **Motivating Case**: A vaccine policy with ex-ante unanimous support causes rare severe side effects; victims must be compensated.  
     - **Status**: Reflects ex-post welfare camp (vs. ex-ante expected utility).  

  10. **Non-Imposition of Uncompensated Losses**  
      - **Requirement**: No agent bears uncompensated losses, even if unobservable ex-ante or masked by aggregation.  
      - **Motivating Case**: Infrastructure projects displacing indigenous communities without restitution, hidden in aggregate GDP gains.  
      - **Status**: Non-negotiable (core Pareto principle).  

  ---

  ### **Tensions and Inconsistencies**  
  #### Jointly Unsatisfiable Desiderata  
  - **Conflict**: Desiderata **6 (Dynamic Safety)** and **9 (Ex-Ante/Ex-Post Consistency)** clash with **10 (Non-Imposition of Losses)** under uncertainty, per social choice impossibility results (e.g., *Mongin 2016*).  
    - **Reason**: Guaranteeing dynamic safety requires *perfect foresight* of all future states, but ex-post consistency demands reversibility/compensation when foresight fails. Under uncertainty, this may lead to:  
      - *Over-conservatism* (no reforms ever pass dynamic safety tests), or  
      - *Violations of non-imposition* (ex-post losers emerge despite ex-ante safeguards).  
  - **Resolution**: Requires abandoning strict ex-ante Pareto or introducing compensatory mechanisms (e.g., sovereign wealth funds for future harms).  

  #### Most Eliminative Requirement  
  - **Requirement 7 (Robustness to Misspecified Reference Groups)** eliminates the largest share of conventional frameworks:  
    - **Kaldor-Hicks**: Fails by design (allows hypothetical compensation ignored in practice).  
    - **Cost-Benefit Analysis**: Fails by narrowly defining "affected group" (e.g., national CBA ignores global externalities).  
    - **Static Pareto**: Fails by ignoring cross-group spillovers (e.g., trade gains exploiting foreign labor).  
    - **Survivors**: Only *multi-generational cosmopolitan frameworks* (e.g., Fleurbaey’s equality of opportunity) partially satisfy this.  

  ---

  ### **Summary of Normative Camps**  
  | **Desideratum**       | **Non-Negotiable** | **Normative Camp**          |  
  |------------------------|-------------------|----------------------------|  
  | Adaptive Preferences   | ✓                 | Universal                  |  
  | Coalition-Proofness    | ✓                 | Universal                  |  
  | Delayed Losses         | ✓                 | Universal                  |  
  | Hidden Risks           | ✓                 | Universal                  |  
  | No-Worse-Off ≠ Unprotested | ✓           | Universal                  |  
  | Static vs. Dynamic     | ✓                 | Universal                  |  
  | Reference Groups       | ✗                 | Cosmopolitan/Global        |  
  | Reversibility          | ✓                 | Universal                  |  
  | Ex-Ante/Ex-Post        | ✗                 | Ex-Post Welfare            |  
  | Non-Imposition         | ✓                 | Universal (Pareto-core)    |  

  **Conclusion**: An adequate theory must prioritize non-negotiable desiderata while explicitly acknowledging trade-offs (e.g., dynamic safety vs. ex-post consistency). It must reject frameworks that ignore hidden risks or contested baselines (e.g., Kaldor-Hicks). The largest gap in existing methods is **robustness to reference group misspecification**, necessitating a shift toward global, long-term, and uncertainty-sensitive evaluation.
