  First, I recall that the user's stance aligns with potentialism. The core idea is that infinity is a process, not a completed whole. They're skeptical about completed infinities in reality, even if math uses them formally. Their main concern is whether this view can hold up against serious counterarguments or if it's insulated to the point of being unfalsifiable.

  The user mentioned Hilbert's Hotel and Cantor's argument. For Hilbert's Hotel, they think it only works as an imagined system with rules, not in reality. For Cantor, they see it as showing that if you assume a completed list, you get a contradiction, so such a list can't exist. Their proposal is that we should always think in terms of extendable collections, not completed infinities.

