  Then there's the Löwenheim-Skolem theorem. It shows that if a countable first-order theory has an infinite model, it has models of all infinite cardinalities. This involves actual infinities. The potentialist might reinterpret this as about potential extensions, but the theorem's proof uses completed infinities. If they reject that, they might need an alternative explanation, which could be awkward.

  Physics examples could challenge the view. Quantum field theory and general relativity use actual infinities, like in renormalization or singularities. But are these necessary, or just mathematical conveniences? Some interpretations avoid actual infinities, like loop quantum gravity. The user might point out that physics hasn't confirmed actual infinities, so this isn't fatal. But if a theory requiring actual infinities were validated, it could be a problem. Right now, it's more of an open question.

  The user also worries about their view being unfalsifiable. If every counterexample is rephrased in potentialist terms, does that make the position immune to refutation? For example, with Cantor, they say the list is always extendable, so diagonalization doesn't apply. But does this avoid the core issue? The potentialist must accept that at any stage, the collection is incomplete, which seems consistent but might not capture the intuition that the reals are "more numerous" than naturals. Without actual infinities, how do we explain that some sets are larger if we never have the completed sets?

