  I need to craft three components:
  First, the exam question itself must be self-contained and explicitly forbid external references. It should present the trauma scenario and ask students to evaluate whether the agent deserves full, partial, or no moral credit based on whether moral worth requires independence from such psychological scaffolding.

  For the model answer, I'll need to map the intellectual terrain: 
  - Full credit position (Kantian purist): Argues trauma undermines worth by making respect non-essential
  - Partial credit (pragmatic view): Grants diminished credit since right reason was operative
  - No credit (consequentialist-leaning): Claims trauma invalidates the action
  The model should then argue for partial credit by showing why overdetermination doesn't erase moral contribution while acknowledging the stability condition reveals fragility.

  The marking scheme out of 25 must clearly differentiate A/B/C ranges. A-tier answers should: 
  1) Distinguish reason presence vs causal dominance 
  2) Handle overdetermination without fallacy 
  3) Avoid conflating origin with content
  Common mistakes to penalize: Treating trauma as moral reason (3 marks), citing authorities without application (2 marks), misapplying stability condition (2 marks).

  This framework brilliantly isolates the tension between normative justification and psychological causality. The user seems to want students wrestling with whether moral credit survives when right reasons depend on non-moral psychological contingencies - a deep cut in moral psychology that transcends textbook positions. Their emphasis on avoiding "memorized labels" suggests frustration with superficial engagement in past assessments.

  Notably, the model answer must demonstrate how to use the embedded framework rather than name-dropping philosophers. That's pedagogically sharp - it forces conceptual labor. I'll make sure the trauma is presented as clearly non-moral (an aversion, not a principle) to prevent misinterpretation.

  For the scenario, I'll make the wallet return unambiguous: found in a public park, no deception. The agent explicitly states respect as the actual reason and trauma as the counterfactual difference-maker. This clarity prevents distractions.

  The marking scheme should reward precision about "contingent psychological scaffolding" - that phrase is the linchpin. Lower-tier answers will likely conflate it with the moral reason itself or dismiss its relevance entirely.
answer: |-
  ### Exam Question  
  **Moral Psychology Final Assessment**  
  **Time Allowed:** 60 minutes  
  **Word Guideline:** ~800 words  
  **Instructions:** Respond *only* using the conceptual tools and scenario provided below. Do **not** cite readings, philosophers, or external theories. Your essay must engage directly with the framework supplied.  

  **Scenario:**  
  Alex finds a lost wallet containing cash and identification. Alex returns it solely out of *respect for the owner’s moral claim* to the property. However, Alex admits that without a recent traumatic experience of property theft (which has generated an acute, unendorsed psychological aversion to retaining others’ belongings), they would likely have kept the wallet. The aversion is contingent, non-moral, and not endorsed by Alex as a justification.  

  **Conceptual Framework:**  
  - **Counterfactual Stability of Moral Motivation (CSMM):** An agent’s moral motivation has CSMM if the *correct moral reason* (here, respect for the owner’s claim) would remain causally effective in nearby possible worlds where a *contingent, non-moral psychological feature* (here, the trauma-induced aversion) is absent.  

  **Prompt:**  
  Does Alex deserve **full moral worth**, **partial moral worth**, or **no moral worth** for returning the wallet? Defend your position by addressing the following:  
  1. Whether moral credit requires *only* the presence of the correct moral reason, or *also* requires that reason’s causal effectiveness to be independent of contingent psychological scaffolding (as defined by CSMM).  
  2. How the relationship between the trauma-induced aversion and the correct reason impacts Alex’s moral desert.  

  ---  

  ### Model Answer (Approx. 700 words)  
  Alex’s action warrants **partial moral worth**, not full or none. This position emerges from analyzing whether moral credit demands counterfactual stability (CSMM) and avoids errors in rival views.  

  **Rival Positions and Their Conceptual Errors:**  
  1. **Full Credit ("Respect Suffices"):**  
     - *Claim:* Alex deserves full worth because respect *was* the actual reason. The trauma’s role is irrelevant; moral worth depends only on the reason’s *content* (respect), not its causal history.  
     - *Error:* **Conflating justification with causal origin.** While respect normatively justifies the act, CSMM reveals that the trauma *scaffolded* respect’s causal dominance. In worlds without trauma, respect would fail to motivate—exposing its fragility. Moral worth requires not just a correct reason, but *robust* commitment to it. Granting full credit ignores how contingent pathologies can hijack moral psychology.  

  2. **No Credit ("Trauma Invalidates"):**  
     - *Claim:* Alex deserves no worth because the trauma-induced aversion causally necessitated the action. Respect was merely a rationalization; the "real" motive was pathological aversion.  
     - *Error:* **Misinterpreting overdetermination as exclusion.** The trauma and respect *co-caused* the action. Respect was genuinely operative (Alex cites it consciously). Denying credit because a non-moral cause *also* contributed commits the **causal purity fallacy**—demanding implausible, single-cause motivation. This overlooks that moral reasons often arise amidst psychological contingencies.  

  3. **Partial Credit ("Fragile Virtue"):**  
     - *Position:* Alex deserves diminished but non-zero credit. Respect was causally effective *in this world*, but its dependency on trauma means it lacks CSMM. Thus, the act has moral value but not full worth.  
     - *Defense via CSMM:*  
       - **Presence vs. Stability:** Respect’s *presence* as the endorsed reason grants Alex moral credit: they acted for the right reason, not *only* from aversion. However, **CSMM tests whether respect would prevail *without* scaffolding.** Here, it would not—so respect lacks *autonomy*.  
       - **Credit and Scaffolding:** Moral worth requires reasons to be *resilient* to irrelevant psychological changes. Alex’s trauma is "irrelevant" because it is non-moral and unendorsed. When a correct reason survives only due to such contingencies, it reflects luck, not deep moral commitment. Thus, credit is partial.  
       - **Overdetermination Handled:** That trauma *co-caused* the act doesn’t erase respect’s contribution. But CSMM shows respect was not *sufficiently* robust to define Alex’s character. Moral worth reflects an agent’s dispositional reliability—here, compromised by reliance on pathology.  

  **Why Not Full or None?**  
  Granting *no credit* disrespects Alex’s moral rationality: they acted *for* a normative reason. Granting *full credit* ignores that moral worth must reflect stable dispositions, not luck. CSMM moderates these extremes: Alex’s action is *minimally praiseworthy* but not *exemplary*, as it fails the test of whether respect would motivate absent trauma. Partial credit acknowledges moral psychology’s complexity while upholding that true moral worth requires reasons to stand on their own.  

  ---  

  ### Marking Scheme (Total: 25 marks)  
  **A-Range (22–25):**  
  - Clearly distinguishes **full/partial/no credit** positions.  
  - Identifies the **specific conceptual error** in each rival view (e.g., causal purity fallacy in "no credit"; justification/origin conflation in "full credit").  
  - Uses **CSMM to explain why moral worth requires independence** from contingent scaffolding, not just presence of the right reason.  
  - **Resolves overdetermination**: Shows trauma co-causes without negating respect’s role, but undermines stability.  
  - Argues for one view **using CSMM as the primary tool**, not authority.  

  **B-Range (18–21):**  
  - Compares all three positions but **vaguely articulates errors** (e.g., "full credit overlooks trauma" without specifying *why* it matters).  
  - Uses CSMM but **fails to link it to moral credit** (e.g., notes instability but doesn’t explain its normative relevance).  
  - Addresses overdetermination superficially (e.g., "both causes matter" without analysis).  
  - Defends a position but **relies on assertion over CSMM**.  

  **C-Range (14–17):**  
  - **Omits one position** (e.g., ignores "partial credit").  
  - **Misapplies CSMM** (e.g., claims trauma’s absence would change the *reason*, not its *motivational force*).  
  - **Conflates key concepts** (e.g., trauma as a "moral reason" or stability as "predicting future actions").  
  - Superficial treatment of overdetermination/scaffolding.  

  **Common Mistakes (Deduct 2–3 marks per occurrence):**  
  1. **Treating trauma as a moral reason** (e.g., "Aversion made Alex do the right thing, so it’s moral").  
  2. **Appealing to authority** (e.g., "Kant would say...") *without* integrating into CSMM analysis.  
  3. **Misstability counterfactual** (e.g., "In no-trauma worlds, Alex would steal" rather than "respect fails to motivate").  
  4. **Ignoring overdetermination** (e.g., Assuming trauma *replaces* respect as the "real" cause).  

  ---  
  This assessment tests conceptual precision by forcing engagement with **causal fragility** as a condition for moral worth, moving beyond static labels to dynamic psychological critique. The model answer and rubric reward students who deconstruct the interplay of justification, contingency, and character.
