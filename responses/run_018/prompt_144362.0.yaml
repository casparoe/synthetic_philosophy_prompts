          - If a transfer was the result of a collective action (e.g., redistribution by vote), check the charter at the time of that transfer: if the collective action was authorized by the charter and properly executed, then consider it as valid (voluntary by prior agreement). Otherwise, the transfer is involuntary.
          - If there is a gap in the chain, use other evidence (e.g., witness statements, historical usage, community consensus) to fill the gap. If the evidence reasonably shows a voluntary transfer, then accept. Otherwise, if there is doubt or evidence of injustice, then FAIL.
      c. Stopping point: If any transfer in the chain is found to be involuntary and not rectified, then FAIL and reject the proposal.

   4. Step 3: Rectification of Injustice
      a. Check the cooperative's records for any pending rectification claims (either specific to the holding or general claims against the cooperative) that have not been resolved.
      b. If there are pending claims:
