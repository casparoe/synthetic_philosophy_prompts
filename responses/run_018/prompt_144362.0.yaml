  We are designing a decision procedure based on the entitlement theory (Nozick) with three lenses: justice in acquisition, justice in transfer, and rectification for historical injustices. The procedure must be applied in about 30 minutes per proposal.

   The procedure steps:

   Step 1: Justice in Acquisition
     - Check if the original allocation of the occupancy right (for the parcel in question) was just.
     - Diagnostic questions:
          a. Are there complete and reliable records of the original allocation?
          b. Does the record show that the original allocation was free from coercion and theft?
          c. If the records are incomplete, is there any evidence of wrongdoing in the original allocation?
     - Pass criteria: If the original allocation was just (or if records are incomplete but no evidence of wrongdoing) then pass. Otherwise, fail.
     - Stopping point: If failed, then the proposal must be rejected unless rectification for that specific injustice has been completed (see Step 3). Note: This step is about the original assignment of the specific holding.

   Step 2: Justice in Transfer
     - Check every transfer in the chain of exchanges for the holding.
     - Diagnostic questions:
          a. Is there a complete chain of title from the original allocation to the current holder?
          b. For each transfer in the chain, are there records showing that the transfer was voluntary (e.g., signed agreements without duress, fraud, or coercion)?
          c. If there are gaps in the chain of title, can they be reasonably filled by other evidence (e.g., consistent usage, witness testimony, or community consensus)?
     - Pass criteria: If every transfer in the chain is documented as voluntary (or gaps are reasonably filled without evidence of injustice), then pass. Otherwise, fail.
     - Stopping point: If failed, then the proposal must be rejected unless the specific unjust transfer is rectified (see Step 3). Note: This step might require tracing the entire history.

   Step 3: Rectification of Injustice
     - Check if there are any documented historical exclusions or injustices that have not been rectified and that affect the current holding or the cooperative as a whole.
     - Diagnostic questions:
          a. Are there any pending rectification claims (specific to the holding or the cooperative) that have not been resolved?
          b. If there are, has the cooperative established a rectification process and has it been completed for this claim?
          c. In the absence of a specific claim, but with evidence of historical injustice (e.g., exclusion of a group), has the cooperative taken steps to rectify that injustice?
     - Pass criteria: If there are no pending rectification claims or if the claims have been resolved (according to the cooperative's rectification process), then pass. Otherwise, fail and require rectification before proceeding.
     - Stopping point: If failed, the proposal must be rejected until the rectification is completed.

