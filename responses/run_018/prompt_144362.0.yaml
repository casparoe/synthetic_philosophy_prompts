answer: |-
  ### Decision Procedure for Occupancy Right Transfers

  **Core Principles from Charter:**
  1. **Justice in Acquisition**: Original allocation must be free of coercion/theft.
  2. **Justice in Transfer**: Every subsequent exchange must be voluntary.
  3. **Rectification**: Historical exclusions must be redressed before new trades.

  **Decision Procedure Flowchart:**  
  1. **Step 0: Pre-Check**  
     - Verify proposal type (transfer, sublease, consolidation, sale).  
     - Confirm jurisdiction (applies only to occupancy rights under the trust).  
     - **Stopping Point**: If invalid type, reject immediately.  

  2. **Step 1: Justice in Acquisition**  
     - *Diagnostic Questions*:  
       a. Are records of the original allocation (1970s) complete for the holding?  
       b. Is there evidence of coercion/theft in the original assignment?  
     - *Pass Criteria*:  
       - Records complete AND no evidence of injustice → **Pass**.  
       - Records incomplete BUT no evidence of injustice → **Pass** (assume good faith).  
     - *Fail Criteria*:  
       - Evidence of coercion/theft → **Fail** (rectification required).  
     - **Value Judgment Juncture**:  
       - *How to handle incomplete records?* Default to "no injustice" unless evidence exists.  
       - *Stopping Point*: If **Fail**, reject proposal; rectification must precede trade.  

  3. **Step 2: Justice in Transfer**  
     - *Diagnostic Questions*:  
       a. Is the chain of title fully documented?  
       b. For each transfer, is there proof of voluntary consent (e.g., signed agreements, no duress)?  
     - *Pass Criteria*:  
       - All transfers voluntary AND documentation complete → **Pass**.  
       - Gaps in documentation BUT no evidence of involuntariness → **Pass** (Wilt Chamberlain logic: voluntary exchanges are valid regardless of distributional outcomes).  
     - *Fail Criteria*:  
       - Evidence of fraud, coercion, or gaps with unresolved doubts → **Fail**.  
     - **Value Judgment Juncture**:  
       - *How to interpret "voluntary"?* Requires assessing context (e.g., economic pressure may imply coercion).  
       - *Stopping Point*: If **Fail**, reject proposal.  

  4. **Step 3: Rectification of Historical Exclusions**  
     - *Diagnostic Questions*:  
       a. Are there unresolved claims of wrongful exclusion from the original allocation?  
       b. Has the trust implemented a rectification process for such claims?  
     - *Pass Criteria*:  
       - No pending claims OR claims resolved per trust policy → **Pass**.  
     - *Fail Criteria*:  
       - Pending claims exist → **Fail** (trades frozen until resolved).  
     - **Value Judgment Juncture**:  
       - *How much rectification is sufficient?* Requires human judgment (e.g., land allotment, compensation).  
       - *Stopping Point*: If **Fail**, reject proposal; freeze all trades until claim settled.  

  5. **Step 4: Final Approval**  
     - Only if all steps **Pass** → Approve proposal.  
     - Any step **Fails** → Reject proposal with reason cited.  

  **Special Cases:**  
  - **Inequality via Voluntary Exchanges**: No redistribution allowed unless charter amended. Wilt Chamberlain logic prevails: voluntary transfers create binding entitlements.  
  - **Collective Redistribution Votes**: Invalid unless charter explicitly authorizes. Forced takings violate justice in transfer.  

  ---

  ### Application to Cases

  #### **Case 1: Sale of Assembled Rights to Outsider at High Price**  
  - **Step 1 (Acquisition)**:  
    - Records incomplete but no evidence of original theft → **Pass**.  
  - **Step 2 (Transfer)**:  
    - Long chain of voluntary swaps documented; no coercion → **Pass** (Wilt Chamberlain: concentration permissible).  
  - **Step 3 (Rectification)**:  
    - No pending claims → **Pass**.  
  - **Decision**: **Approve**.  
  - **Politically Unwelcome Ruling**: Inequality resulting from voluntary exchanges is legitimate; sale permitted despite wealth concentration.  

  #### **Case 2: Majority Vote to Cap Holdings and Redistribute**  
  - **Step 0 (Pre-Check)**:  
    - Proposal is a collective rule change, not a transfer → *Outside procedure scope*.  
  - **Analysis via Charter Principles**:  
    - Justice in Transfer: Forced redistribution violates voluntary exchange (unless charter authorizes).  
    - If charter lacks collective-action clauses → **Redistribution invalid**.  
    - If charter amended to allow it → **New rule valid** but applies *prospectively*.  
  - **Value Judgment Juncture**:  
    - *Does the charter permit majority override?* Requires legal interpretation.  
  - **Decision**:  
    - **Reject redistribution** if charter lacks authority.  
    - **Allow prospective caps** if charter amended properly.  
  - **Politically Unwelcome Ruling**: Redistribution invalid without charter amendment; inequality stands despite social concerns.  

  #### **Case 3: Claim of Historical Exclusion Demands Trade Freeze**  
  - **Step 1 (Acquisition)**:  
    - Records show no theft, but claimant alleges exclusion → **Pass** (no evidence against current holding).  
  - **Step 2 (Transfer)**:  
    - Chain voluntary → **Pass**.  
  - **Step 3 (Rectification)**:  
    - Pending claim → **Fail**.  
  - **Decision**: **Reject all new trades; freeze until rectification**.  
  - **Value Judgment Juncture**:  
    - *How to rectify?* Collective must decide remedy (e.g., grant land, compensate).  
  - **Politically Unwelcome Ruling**: All trades frozen indefinitely, disrupting cooperative operations.  

  ---

  ### Key Features of Procedure  
  - **Time Efficiency**: Uses binary checklists; focuses on documented evidence.  
  - **Irreducible Judgments**:  
    - Step 1: Interpreting incomplete records.  
    - Step 3: Defining "sufficient rectification."  
  - **Handling Ambiguity**:  
    - Defaults to voluntary/just where evidence lacks (prevents paralysis).  
  - **Political Constraints**:  
    - Enforces Wilt Chamberlain logic (Case 1), blocks redistribution without charter authority (Case 2), prioritizes rectification over convenience (Case 3).  

  **Output**: Consistent, charter-compliant rulings in ~30 minutes, with explicit off-ramps for human judgment.
