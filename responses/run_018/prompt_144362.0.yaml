   1. Pre-check: Review the cooperative's current charter and any amendments to identify any rules that might affect the transfer (e.g., caps on transfers, rules for external sales, collective redistribution provisions). Note any recent rule changes that might apply.

   2. Step 1: Justice in Acquisition
