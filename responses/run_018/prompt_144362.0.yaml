     Step 2: The transfer from the collective to B: if the collective action is authorized and done properly, then it is valid. PASS.

     Step 3: PASS (no pending claims).

     So the redistribution would be approved.

     However, if the charter did not allow the amendment by majority vote (e.g., required unanimity) then the amendment would be invalid. Then the forced transfer would be involuntary and fail Step 2. Therefore, the redistribution would be rejected.

     The politically unwelcome ruling: if the charter requires unanimity for such an amendment, then the majority vote is invalid and the redistribution must be rejected. This would anger the majority.

