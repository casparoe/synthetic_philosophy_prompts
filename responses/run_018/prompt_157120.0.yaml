prompt: |-
  I host a podcast on aesthetics and next week’s guest is a scholar defending Leo Tolstoy’s mature theory from his 1897 essay What Is Art? as a live, unrevised position rather than a museum piece. Draft eight interview questions—each paired with a one-sentence follow-up keyed to the answer she is most likely to give—that stay inside the view and avoid biography, summary, or generic prompts. Present each pair in a single paragraph and keep the whole draft under 350 words. Cover these specific pressures: (1) the infection metaphor—how emotional transmission distinguishes art from propaganda or rhetoric, with the follow-up pressing the case of a performer who simulates feeling so precisely that the audience is genuinely moved; (2) the moral-unification criterion—whether art that transmits despair or horror can still serve universal brotherhood, with the follow-up anticipating her appeal to moral awakening and asking whether awakening requires a specific emotional valence; (3) counterfeit art—whether professional technique without sincere feeling is ever redeemable if it accidentally produces real infection in viewers; (4) a structural circularity worry—whether defining art by infection and infection by moral effect renders the theory unfalsifiable; (5) a niche injection about delayed infection: works Tolstoy dismissed in his own era that now infect later audiences—does this show the moral effect is historically indexed, or that he misidentified the feeling being transmitted; (6) a niche injection about non-representational transmission: a silent installation engineered only through rhythm and light that induces collective grief despite the creator reporting only technical satisfaction—does the framework classify this as art, counterfeit, or something else, and what does that reveal about an implicit representational bias; (7) Tolstoy’s ranking of the arts—whether a poem that transmits the same feeling as a symphony but with ambiguous moral content should be ranked lower, with the follow-up pressing whether ambiguity undermines infection or merely delays recognition; and (8) the artist’s epistemic position—if infection is defined by audience effect but requires the artist’s prior sincere feeling, how can the artist know she has succeeded before transmission occurs, with the follow-up anticipating her appeal to introspection and asking whether that makes the moral criterion redundant. Take a committed line throughout: treat the infection-moral framework as coherent but argue that it collapses unless we drop the hidden assumption that feeling must travel through representational content, and frame every follow-up to advance that specific pressure. No requests for bibliography, reading lists, or citations; no quotation marks around passages from real texts.
