answer: |-
  Okay, let's break down your supererogation vs. moral overhang clash. Think of it like two different ways the universe handles an unexpected windfall... or a massive bill.

  ### Supererogation (Urmson-Style): The Hero's Solo Win

  1.  **The Core Idea:** An act is supererogatory if it's:
      *   **Morally Good:** Saves lives, prevents disaster, etc.
      *   **Beyond Obligation:** Nobody *had* to do it. Duty didn't demand *this much*.
      *   **Optional & Praiseworthy:** You get major moral credit for doing it, but you wouldn't get *blamed* for *not* doing it. Choosing *not* to jump on the grenade isn't evil, it's just... human.
  2.  **Who Owns the Surplus?**
      *   **Sole Owner: The Actor.** The hero who jumped on the grenade gets 100% of the moral credit. It's like they earned "extra life points" that belong entirely to them. Their account is overflowing.
      *   **The System Impact:** The survivors are *grateful*. They might feel inspired, humbled, or even a little inadequate. But crucially, **they don't *owe* anything.** The hero's sacrifice doesn't create a *debt* the survivors now carry. It's a pure gift. The moral surplus stays locked in the hero's account.
  3.  **The Audience Feeling:** After witnessing this, the audience typically feels:
      *   Awe
      *   Profound gratitude
      *   Sadness/loss
      *   Maybe inspiration ("What a hero!")
      *   **Guilt? Not really.** Why *should* they feel guilty? They didn't *make* the hero do it, and the hero wasn't *owed* that sacrifice. It was a freely given, extraordinary gift. The feeling is more "Wow, look what they *chose* to do for us."

  ### Moral Overhang: The Leaking Debt

  1.  **The Core Idea:** When a sacrifice is *so* excessive, *so* far beyond the call, that it stops feeling like a pure gift and starts feeling like... well, *too much*. It disrupts the moral equilibrium. Instead of just earning credit, the sacrifice creates an unpayable debt that spills out of the hero and contaminates everyone connected.
  2.  **Who Owns the Surplus?**
      *   **The Surplus Becomes Toxic Debt:** The initial "good" act is so massive it flips. The *surplus* isn't positive credit anymore; it's a **burden**, a *debt* incurred by the hero but impossible for them to fully bear or resolve alone because of its extremity (often death).
      *   **The Debt Leaks:** This unpayable debt doesn't vanish. It *overhangs* the situation. It leaks into the community, the survivors, the witnesses, even the narrative itself. **The "ownership" of the surplus (now debt) is collective, but unwanted.** Everyone touched by the act now implicitly *shares* in this moral burden.
      *   **The Hero's Account is Wiped Out (Literally):** The hero is gone (in your grenade scenario). They *can't* "own" the surplus anymore. All that's left is the gaping hole their sacrifice created and the uncomfortable weight of "Why did it have to be *that* much?"
  3.  **The Audience Feeling:** This is where the guilt and burden kick in:
      *   **Guilt:** "Why did they have to die *for me* (or us)?" "Could something less have been enough?" "Do I even *deserve* this?" It feels less like a gift and more like an obligation you never asked for and can never repay.
      *   **Burden:** The weight of the debt. "Now what do we *do* with this?" "How do we live up to this?" "This victory feels tainted." The sacrifice casts a long shadow, making everything afterward feel heavier.
      *   **Unease:** The excessiveness itself is disturbing. It feels unnecessary, tragic in a way that pure heroism often avoids. It highlights the *cost* in a way that lingers uncomfortably.

  ### The Showdown: Who Explains What Better?

  *   **Who Owns the Surplus?**
      *   **Supererogation:** Wins for explaining pure, individual hero credit. The surplus good is cleanly owned by the actor.
      *   **Moral Overhang:** Wins for explaining the *spillover effect* when the sacrifice feels excessive and creates systemic burden. The surplus transforms into a distributed, collective debt. It captures the *leakage*.

  *   **Why the Audience Feels Guilty/Burdened:**
      *   **Supererogation:** Doesn't really explain guilt. It predicts admiration, sorrow, maybe even survivor's guilt ("Why them, not me?"), but not the specific burden of *inheriting an unpayable debt*. It struggles with the *excessiveness* causing discomfort.
      *   **Moral Overhang:** Nails it. This feeling is the *essence* of moral overhang. The audience (and characters) feel guilty/burdened precisely **because** the sacrifice leaked its unresolved debt onto them. They feel implicated, obligated, and weighed down by the sheer, unnecessary magnitude of what was given. The "overhang" *is* the burden.

  ### Why Moral Overhang Feels Different & Powerful

  Supererogation is about celebrating the individual who goes above and beyond. Moral Overhang is about the **systemic consequences** of *extreme* sacrifice. It asks:

  *   What does it *do* to the people saved when the cost was astronomically higher than necessary?
  *   How does that level of sacrifice warp the moral landscape for everyone left behind?
  *   When is "more than required" actually *too much*, creating a toxic residue instead of pure good?

  **In your grenade example:**  
  *   **Supererogation:** Hero is a legend. Survivors mourn but feel saved. Audience feels awe/sadness.
  *   **Moral Overhang:** Hero is gone. Survivors feel permanently indebted, maybe even resentful or trapped by the legacy. The "gift" of life feels heavy. The audience feels the oppressive weight of that debt and wonders if a lesser sacrifice (pushing it away? a warning shout?) could have been enough. The excess *leaks* onto them as unease and guilt.

  **Bottom Line:** Urmson's supererogation is brilliant for defining heroic *action*. Your Moral Overhang is brilliant for defining the messy, often painful *aftermath* of action pushed into the realm of the extreme and unnecessary. It explains the psychological and systemic *hangover* of excessive sacrifice – the debt nobody asked for but everyone feels. For explaining audience guilt and burden, Moral Overhang is the sharper tool. It captures the feeling that the hero's surplus didn't just disappear; it landed on *us*.
