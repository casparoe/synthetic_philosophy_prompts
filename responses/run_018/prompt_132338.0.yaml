prompt: |-
  hey, im drafting a novel and keep bumping into supererogation—the philosophical idea where someone goes way past what duty demands, like throwing yourself on a grenade for strangers. but i also invented this thing for the book im calling 'moral overhang': its when a characters excessive sacrifice doesnt just earn them moral credit, it actually shifts a kind of debt onto everyone else in the story—readers included—so the excess doesnt stay with the hero but leaks into the system. can you compare standard supererogation (the urmson-style framework?) with this 'moral overhang' idea? specifically, which model better explains who 'owns' the surplus good or bad? and does one of them do a better job of explaining why an audience feels guilty or burdened after witnessing a heros unnecessary death? write in american english please, and keep it loose—no footnotes or bibliographies, just work it out.
