  I should compare the two models clearly. Use Urmson's framework as the baseline. Then contrast with moral overhang. Emphasize the ownership angle: hero vs. community. Also, address why moral overhang might be more effective for evoking guilt in readers. The user's idea seems influenced by communal ethics or systemic consequences, which philosophical supererogation doesn't cover. They might need this for narrative impact, making sacrifices affect the whole story world.

  The user's deeper need? They want their novel to resonate emotionally, making readers feel the weight of sacrifices. Moral overhang adds layers where actions ripple beyond the hero, creating moral dilemmas for other characters and readers. This can drive plot and theme, exploring how one person's extreme actions burden others. The user might be aiming for a critique of heroism or exploring unintended consequences in their narrative.

