  ## Joint Statement: Remedial-Right & Primary-Right Democratic Secessionists on Scotland, Catalonia, & Quebec

  **After a year of vigorous (and occasionally adversarial) debate,** we, advocates of remedial-right secession (RRS) and primary-right democratic secession (PRDS), find significant common ground on core principles while acknowledging persistent philosophical divides. We present this joint statement to clarify areas of agreement, map key disagreements neutrally, and identify crucial tests for our differing viewpoints, focusing on Scotland, Catalonia, and Quebec.

  ### Agreed Claims

  1.  **Secession Defined:** Secession is the creation of a new independent state from the territory and population of an existing state.
  2.  **Process Matters:** Unilateral declarations of independence (UDIs) without a clear, agreed democratic process (especially referendums) are highly problematic and lack legitimacy. Legitimacy requires *some* form of democratic authorization and procedural fairness.
  3.  **Nested Minorities: A Core Challenge:** Within any seceding territory (e.g., Catalonia), there exist nested minorities (e.g., residents of Tarragona who identify primarily as Spanish or oppose independence). Their rights, identities, and potential opposition *must* be meaningfully addressed in any secession process. Ignoring them is unjust and destabilizing.
  4.  **Referendum as Preferred Mechanism:** A free, fair, and constitutionally recognized referendum is the optimal democratic mechanism for deciding secession, providing the clearest expression of the relevant population's will.
  5.  **Legitimacy of the State:** Both approaches accept the legitimacy of existing states like Spain and the UK. Secession is not presented as the *only* legitimate outcome, but as a *potentially* legitimate one under specific conditions.
  6.  **Intergenerational Implications:** Secession decisions, once enacted, fundamentally bind future generations within the new state. This creates a profound responsibility for those making the decision.

  ### Persistent Disagreements (Neutral Wording)

  | Issue                       | Remedial-Right (RRS) View (Neutral)                                                                 | Primary-Right Democratic (PRDS) View (Neutral)                                                                 |
  | :-------------------------- | :-------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------- |
  | **Justification Threshold** | Secession requires demonstrating persistent, serious injustice or denial of fundamental rights within the existing state framework. | Secession is a primary democratic right of a territorially concentrated majority; prior injustice is not a necessary precondition. |
  | **Referendum as Mandate**   | A successful referendum creates a *conditional* mandate, dependent on negotiation and the absence of severe internal injustice/violation of nested minority rights within the seceding territory. | A successful referendum under fair conditions creates a *binding* democratic mandate for independence; subsequent negotiations focus on implementation, not revisiting the decision. |
  | **Renewability of Mandate** | A single referendum result does not bind indefinitely. Changed circumstances or prolonged failure to implement may necessitate a new process, but the high threshold for justification must be re-met. | A clear, democratic vote for independence establishes a permanent right; subsequent votes may be held to confirm or alter this, but the *right* itself, once democratically asserted, persists. |
  | **Role of Constitutional Entrenchment** | Existing constitutional frameworks establishing state unity possess significant normative weight and procedural barriers, reflecting a deep societal commitment. Overcoming them requires extraordinary justification. | Democratic will is the ultimate source of constitutional legitimacy; procedures, however entrenched, can be democratically revised or overridden to enable self-determination if a clear majority desires it. |

  ### Identified Cruxes & Proposed Tests

  We agree these are the core disagreements preventing full consensus. We propose concrete hypothetical tests to evaluate our respective positions.

  1.  **The Recursive Secession Problem ("Tarragona Test"):**
      *   **Scenario:** Catalonia legally gains independence from Spain after a recognized referendum. Five years later, a clear and persistent majority (60+% in multiple polls) within the province of Tarragona expresses a desire to secede from Catalonia and rejoin Spain. They cite no specific oppression by the Catalan government but a strong, enduring Spanish national identity and economic concerns. They demand a referendum.
      *   **RRS Prediction:** Secession by Tarragona would **not be justified**. The threshold of persistent, serious injustice or denial of fundamental rights within Catalonia has not been met. Catalan independence itself established a new legitimate constitutional order. Nested minority rights involve participation and protection *within* Catalonia, not a unilateral right to fracture the new state without meeting the remedial threshold. The vote expresses a preference, not a justification for rupture.
      *   **PRDS Prediction:** Secession by Tarragona **would be justified**. If a clear, persistent democratic majority within a coherent territorial subunit (Tarragona) desires independence from the new state (Catalonia), they possess the same primary democratic right Catalonia exercised against Spain. The absence of specific oppression is irrelevant; the will of the relevant demos is sufficient. Failure to allow the referendum would violate democratic principles Catalonia itself championed.

  2.  **Constitutional Entrenchment vs. Democratic Revision ("Quebec Procedure Test"):**
      *   **Scenario:** Quebec's National Assembly, controlled by pro-independence parties, passes legislation altering Quebec's own internal constitutional amendment procedures. The new law states that a simple majority vote in the Quebec Assembly, followed by a simple majority vote in a Quebec referendum, is sufficient to declare independence, *regardless* of the Canadian Constitution's amending formula (which requires federal and provincial consent for such a change). They then win a 52% referendum vote under these new self-created rules and declare independence.
      *   **RRS Prediction:** This secession is **illegitimate**. The attempt to unilaterally redefine the fundamental rules of the game solely to enable secession violates core principles of constitutional democracy and the rule of law. It breaks the very procedural constraints that give democratic decisions legitimacy. Legitimate secession requires either operating within the existing constitutional framework or achieving such overwhelming consensus that it constitutes a revolutionary re-founding *despite* the rules – which 52% does not represent.
      *   **PRDS Prediction:** This secession is **legitimate**. The democratic body representing the people of Quebec has the inherent authority to determine the procedures by which it expresses its sovereign will. The Canadian Constitution's amending formula, designed to protect federalism, cannot legitimately bind a people seeking to *leave* the federation against their continued will. The Quebec Assembly's procedural change and subsequent referendum constitute a valid democratic expression of self-determination. The legitimacy stems from the democratic source, not the prior procedural cage.

  ### Verbal Disagreement (Acknowledged as Non-Substantive)

  *   **"The Scottish People" vs. "People Living in Scotland":**
      *   **RRS:** Prefers "people living in Scotland" to emphasize the resident population as the relevant voting demos, avoiding potentially exclusionary nationalist connotations.
      *   **PRDS:** Prefers "the Scottish people" as it captures the distinct national identity and political will underpinning the claim to self-determination.
      *   **Why it doesn't move the argument:** Both sides agree that *who votes* in any referendum (generally, residents of Scotland) is what matters operationally. The disagreement is purely semantic regarding the *label* for that group and whether it inherently implies a pre-political national essence. It doesn't change the practical requirements for a fair vote or the substantive arguments about justification or procedure.

  ### Conclusion
  While fundamental differences remain, particularly concerning the *grounds* for secession and the *limits* of democratic authority over entrenched constitutional structures, this process has clarified our shared commitment to democracy, the seriousness of nested minority concerns, and the necessity of fair procedures. We submit these "tests" (Tarragona and Quebec Procedure) as focal points for ongoing theoretical and practical debate. We continue to believe our respective frameworks offer the most coherent approaches to self-determination in complex multinational states, but acknowledge the value in rigorously challenging each other's premises.

  **Signed,**
  [Names/Designations for RRS Advocate(s)]
  [Names/Designations for PRDS Advocate(s)]
