answer: |-
  Here is a precise list of desiderata for a theory of hard choices, structured as requested:

  **Desiderata for a Theory of Hard Choices**

  1.  **The Non-Arbitrariness Requirement:**
      *   **Statement:** The theory must explain how choosing well in a hard choice is possible and non-arbitrary, despite the absence of a single cardinal scale ranking the options and the absence of one option being better than, worse than, or exactly equal in value to the other(s).
      *   **Case Forcing:** The core definition of hard choices: choosing well is supposed to be possible, not merely arbitrary.
      *   **Status:** **Non-negotiable.** This defines the phenomenon. Views denying the possibility of non-arbitrary choice in such cases (e.g., radical incomparabilism leading to nihilism about choice quality) are excluded by definition.

  2.  **The Trichotomy Requirement:**
      *   **Statement:** The theory must explicitly specify the nature of the evaluative relation holding between options A and B in a hard choice core case (where neither is better than the other, nor are they equally good). It must clearly distinguish between, or justify collapsing, the following:
          *   *Incomparability:* No comparative relation holds (e.g., "on a par" is incoherent).
          *   *Incommensurability (Narrow):* Comparable via "better than" or "equally good," but no common cardinal unit exists to measure the degree of difference.
          *   *Parity:* Comparable via "better than" or "worse than," but neither A>B, B>A, nor A=B holds; instead, A and B are "on a par" (neither better nor worse, yet comparable).
      *   **Case Forcing:** The very definition of a hard choice (lack of ranking on a single scale) forces an account of what relation *does* hold. The debate hinges on distinguishing these possibilities. Theories *must* take a stance on their distinctness or reducibility.
      *   **Status:** **Non-negotiable.** A theory cannot remain silent on the fundamental relation defining the choice situation. Collapsing distinctions (e.g., arguing parity is just incomplete comparability) is a substantive commitment, not an omission.

  3.  **The Small-Improvements Requirement:**
      *   **Statement:** The theory must account for the phenomenon where a small improvement to one option (A+) does not necessarily make it better than the other option (B), even though A+ is better than the original A. It must explain why improving A doesn't *always* force a "better than" relation over B in hard choices.
      *   **Case Forcing:** The Small-Improvements Argument (e.g., improving one career option slightly doesn't automatically make it better than a radically different, incommensurable alternative).
      *   **Status:** **Non-negotiable.** This is a core test case for distinguishing theories of value relations. Views that imply any improvement forces comparability (e.g., some forms of strict cardinalism or certain interpretations of "equality") fail to capture genuine hard choices.

  4.  **The Rational Regret Requirement:**
      *   **Statement:** The theory must accommodate the possibility of rational agent-regret after a well-made hard choice, without this regret implying that the choice itself was mistaken or that the unchosen option was better.
      *   **Case Forcing:** Phenomenology of hard choices: agents often feel profound, seemingly rational regret for the "road not taken" even when convinced they chose well (e.g., regret for the unchosen career path or life partner).
      *   **Status:** **Non-negotiable.** This is a fundamental feature of the experience of hard choices. A theory that cannot explain this (e.g., by reducing regret to error or irrationality) fails descriptively and normatively.

  5.  **The Distinction from Uncertainty Requirement:**
      *   **Statement:** The theory must clearly distinguish hard choices (under evaluative conflict) from choices under empirical uncertainty (lack of knowledge of facts) or normative uncertainty (lack of knowledge of one's own values/ranking). It must explain why the difficulty is fundamental value conflict, not ignorance.
      *   **Case Forcing:** The need to avoid collapsing hard choices into mere optimization problems with incomplete information (e.g., choosing between jobs isn't hard just because you lack salary data; it's hard because career fulfillment vs. location vs. salary represent different *kinds* of value).
      *   **Status:** **Non-negotiable.** Failure here mischaracterizes the phenomenon. Views reducing hard choices to uncertainty (e.g., "if only we knew the true utility function") are excluded.

  6.  **The Value Constitution/Revision Requirement:**
      *   **Statement:** The theory must allow for the possibility that making a hard choice can itself constitute, discover, or revise the agent's values, rather than merely expressing an antecedently fixed and complete ranking.
      *   **Case Forcing:** Cases of transformative choices or choices where commitment through action defines value (e.g., choosing an artistic career over a stable one may *create* the value of artistic integrity for the agent in a way deliberation couldn't).
      *   **Status:** **Parochial.** This is crucial for existentialist, constructivist, or pragmatist camps emphasizing agency and value creation. More static views (e.g., classical rational choice) may reject this as a requirement for an *adequate theory of the choice moment itself*, seeing value revision as a separate process.

  7.  **The Aggregation Requirement:**
      *   **Statement:** The theory must provide resources to address, or explain the difficulty of, aggregating multiple hard choices involving different kinds of value for policy decisions under constraints (e.g., fixed budget allocation across health, environment, arts).
      *   **Case Forcing:** Real-world policy dilemmas mirror individual hard choices but require collective action under scarcity. How can a theory of individual hard choices inform or constrain such aggregation?
      *   **Status:** **Parochial.** Primarily relevant to theories aiming for policy application. Some theories focused solely on individual phenomenology or ontology of value might see this as a separate, derivative problem.

  **Tensions and Exclusivity:**

  *   **Suspected Joint Unsatisfiability:** The **Non-Arbitrariness Requirement (1)** and a strong interpretation of the **Trichotomy Requirement (2)** focusing on *incomparability* (no comparative relation holds) are in deep tension. If no comparative relation holds whatsoever (strong incomparability), it's exceptionally difficult to explain how choice can be non-arbitrary/normatively guided. Views embracing incomparability often struggle most with (1) and (4).
  *   **The Key Excluding Requirement:** The **Trichotomy Requirement (2)** does the most work to exclude standard families of view:
      *   **Excludes Incomparability Views:** By forcing the theory to either embrace incomparability *and* explain non-arbitrariness (very difficult) or to adopt parity/incommensurability.
      *   **Excludes Reductionist Views:** By forcing the theory to explicitly address the relation (incomparability, parity, incommensurability) rather than reducing the phenomenon to mere ignorance, incomplete preferences, or uncertainty (which Requirement 5 also targets).
      *   **Excludes Parity Views:** Not by exclusion outright, but by forcing them to rigorously define "parity" and distinguish it from incommensurability and incomparability, and to handle cases like small-improvements and aggregation which challenge parity specifically.
      *   **Excludes Collapsing Views:** By requiring an explicit stance on whether these relations collapse (e.g., arguing incomparability doesn't exist, or parity is just a form of incommensurability), which is a major substantive commitment separating camps. Views that *avoid specifying the relation* are directly excluded.

  **Summary Table:**

  | #  | Requirement Name              | Core Demand                                                                                                                               | Forcing Case/Consideration                                                                 | Status            |
  | :-- | :---------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------- | :---------------- |
  | 1   | **Non-Arbitrariness**         | Explain non-arbitrary choice without better/worse/equal or cardinal scale.                                                               | Definition of hard choices (choice well possible).                                         | **Non-negotiable** |
  | 2   | **Trichotomy**                | Specify the value relation (incomparability/parity/incommensurability) or justify collapsing distinctions.                              | Definition of hard choices (no single scale ranking).                                      | **Non-negotiable** |
  | 3   | **Small-Improvements**        | Account for slight improvements not forcing "better than".                                                                                | Small-Improvements Argument.                                                               | **Non-negotiable** |
  | 4   | **Rational Regret**           | Accommodate rational regret without implying choice error.                                                                                | Phenomenology of post-choice regret.                                                       | **Non-negotiable** |
  | 5   | **Distinction from Uncertainty** | Distinguish hard choice from optimization under ignorance.                                                                                | Avoiding mischaracterization (value conflict vs. lack of knowledge).                       | **Non-negotiable** |
  | 6   | **Value Constitution/Revision** | Allow choice to constitute/reveal values, not just express them.                                                                          | Transformative choices, commitment through action.                                         | **Parochial**     |
  | 7   | **Aggregation**               | Provide resources for aggregating hard choices in policy (or explain the difficulty).                                                     | Policy dilemmas under constraint (budget allocation between distinct goods).               | **Parochial**     |
