  Here's a joke crafted specifically for the voting paradox connoisseur, hitting the logic you requested:

  **The Ballot of Burden, Ordinance #742, Hamlin Corners**

  By ancient Hamlin Corners statute, no citizen could cast a vote without first submitting, in triplicate, a handwritten calculation proving the probability (P) that their single ballot would break an exact tie in the upcoming mayoral election. The formula required factoring in the town's eligible voters (N = 1,001), historical turnout variance (σ), and the average margin of victory over the past five elections (μ ≈ 3.2%).

  Old Man Henderson, a stickler for rules and rationality, sat hunched over his kitchen table. Pencils snapped as he grappled with binomial distributions and the combinatoric nightmare of `P ≈ (1 / √(2πNp(1-p))) * e^(-(k - Np)^2 / (2Np(1-p)))` for `k = N/2`. Hours bled into days. He factored in Doris's recent move to the city (N-1), the flu going around (estimated turnout dip of 12%), and even the correlation coefficient between sunny days and Grange Party votes.

  Finally, bleary-eyed, he arrived at a figure: **P ≈ 7.2 x 10^-8**. A one-in-fourteen-million chance. He stared at the number, the embodiment of rational futility. "Practically zero," he muttered, the effort expended itself proving the point. "Utterly pointless."

  Yet, the ordinance demanded the calculation *to vote*. Driven by civic duty (or perhaps just stubbornness), Henderson meticulously copied his work onto the official forms and trudged to Town Hall.

  The polling station was eerily quiet. Clerk Edna barely looked up from her knitting. Henderson slid his calculation across the desk with a sigh. "My P. Pointless, just like the books say."

  Edna stamped his forms without glancing. "Yep. Heard that a lot today."

  Henderson paused. "How many... how many others voted?"

  Edna consulted her ledger. "Well, let's see. Agnes calculated her P was something-times-ten-to-the-minus-nine, said it was irrational to bother. Bertram got lost in the standard deviation and quit. Young Elara calculated hers was 'vanishingly small' and went hiking. Only you and Mayor Higginbotham voted."

  "Higginbotham? But he's running *uncontested*!"

  "Exactly," Edna nodded. "His calculation was simple: `P(tie) = 0` since no opponent. His vote was decisive by definition. He cast his ballot for himself at 8:01 AM."

  Henderson’s jaw dropped. The sheer, beautiful absurdity hit him. **"So... the only people rational enough to *do* the calculation concluded it was irrational to vote... except the one candidate whose calculation guaranteed his vote was decisive by default... and now he wins with one vote?"**

  Edna shrugged, picking up her knitting. **"Seems so. Funny thing, all that precise reasoning about pointlessness. Made the whole election hinge on a single vote after all. Just not yours."**

  **Why it works for the paradox:**

  1.  **Forces the Rational Calculation:** The ordinance directly compels voters to confront the infinitesimal `P` that their vote breaks a tie.
  2.  **Rational Conclusion Leads to Abstention:** Henderson (and others) correctly calculate `P ≈ 0`, rationally concluding voting is pointless *for them*.
  3.  **Collective Abstention Destroys Validity:** The collective act of rational abstention (based on the very calculation required *to* vote) leads to near-zero turnout.
  4.  **Low Turnout Makes Votes Decisive:** This catastrophically low turnout makes the remaining votes *highly* decisive. Higginbotham's vote *is* decisive because turnout is so low. The paradox strikes: the collective application of "my vote doesn't matter" logic *makes* individual votes matter immensely in the resulting tiny electorate.
  5.  **The Candidate's Loophole:** Higginbotham exploits the logic. With no opponent, `P(tie) = 0`, so `P(decisive) = 1`. His vote is guaranteed decisive *because* the system and the likely rational abstention of others make a 1-vote victory possible. He rationally votes *because* his calculation shows high impact.
  6.  **Henderson's Realization:** The punchline lands when Henderson sees that the collective pursuit of individual rational futility (`P ≈ 0`) created the precise scenario where a single vote *was* decisive, fulfilling the paradox's core irony. His effort proved his pointlessness, yet the system born of that reasoning made another's vote supremely powerful.
  7.  **Avoids Clichés:** Focus is purely on the mathematical/logical contradiction inherent in rational choice theory applied to voting. No lazy voters, no corrupt politicians, just the cold, absurd logic of the paradox playing out under a rule designed to enforce it. A rational-choice theorist would see the elegant, frustrating truth in the outcome.
