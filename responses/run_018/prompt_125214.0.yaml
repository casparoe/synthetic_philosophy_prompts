answer: |-
  Here’s a tight 4-minute speech balancing academic rigor with practical resonance, built around your core tension and audience split:

  ---

  **(Warm, confident opening – make eye contact across the room)**  
  "Good morning everyone. Whether you’re here fresh from debating 16th-century political thought, or ready to tackle the next zoning grant application – welcome. That word, **‘subsidiarity’**, is our common ground today. We all nod when we hear it: *decisions should be made as close as possible to the people affected*. For our council members, that’s instinctive. It’s choosing playground locations, managing waste collection routes – solving problems *here*, not waiting for permission from some distant capital. It feels tangible, practical. That’s the spirit.

  **(Shift tone slightly – introduce the complexity)**  
  But what happens when we stretch ‘subsidiarity’ across borders? When it’s not just about *where* decisions *should* be made, but about who *actually holds the power* to say ‘no’? This is where things get structurally fascinating… and contradictory.

  **(Present the Swiss Model – Emphasize Power)**  
  Take Switzerland. Its cantons aren’t just administrative units taking orders. They possess **constitutional personality**. That’s a dense term meaning something crucial: in specific areas defined by their constitution, a canton can look a federal law squarely in the eye and say, ‘No. This doesn’t apply here. We do it *our* way.’ The federal level must yield. That’s subsidiarity backed by hard, constitutional power. It’s local authority with real teeth.

  **(Present the EU Model – Emphasize Procedure)**  
  Now, contrast that with the European Union. The EU also champions ‘subsidiarity’. But its mechanics are profoundly different. There, subsidiarity functions primarily as a *procedural check* – a test of proportionality applied *before* legislation. Does this action *need* to happen at the EU level? Could member states do it better? It’s a vital question! But here’s the structural tension: the body proposing the laws, the European Commission, is also deeply involved in judging that test. And crucially, even if concerns are raised, the Commission can ultimately proceed. The ‘no’ isn’t absolute; it’s more of a ‘maybe, but we’re doing it anyway.’

  **(Highlight the Core Tension – The Irony)**  
  So, both systems use the *same word* – subsidiarity. But the mechanics are almost opposites. **In Switzerland, subsidiarity means the local level can veto the center in its domain. In the EU, subsidiarity means the center checks its own homework before acting, often proceeding regardless.** One is a shield wielded locally; the other is a filter applied centrally. That’s not just a difference in degree; it’s a difference in fundamental structure – who holds the ultimate card.

  **(Nod to Althusius – Keep it Organic)**  
  This tension isn't new. Thinkers wrestling with layered authority – like Johannes Althusius centuries ago in Emden – grasped this instinctively. He saw communities as organic, **interdependent associations**, thriving through cooperation and mutual recognition of their inherent roles. It wasn't theory divorced from practice; it was rooted in the messy reality of how cities, guilds, and regions actually *work together* or *push back*. The Swiss model leans towards that inherent local power Althusius sensed; the EU model leans towards a complex procedural dance.

  **(Wrap Up – Bridge to the Workshop)**  
  So, why does this mismatch matter for *this* workshop? Because when we talk about ‘Subsidiarity Across Borders’, we’re immediately confronted by this core question: **Is subsidiarity primarily about empowering the local level to *stop* unwanted central action, or is it about guiding the center to *justify* its action?** Understanding *that* tension – between veto power and procedural check, between **constitutional personality** and centralized proportionality – is vital. It shapes everything from trade agreements to environmental regulations crossing jurisdictions.

  **(Strong Closing – Inclusive)**  
  Council members, you *live* the spirit of subsidiarity daily. Grad students, you dissect its theory. Today, let’s explore together how that spirit translates – or gets tangled – when it crosses borders. What works? What clashes? Where does the *power* truly lie? I look forward to the discussion. Thank you."

  ---

  **Why this works for your brief:**

  1.  **Audience Hook:** Opens by acknowledging *both* groups respectfully ("zoning grants" / "16th-century thought") and anchors subsidiarity in the council members' reality immediately.
  2.  **Core Tension Central:** The Swiss vs. EU comparison isn't just an example; it *is* the argument. The contrasting mechanics ("veto" vs. "check") are clearly laid out as the structural opposite.
  3.  **Clarity without Dumbing Down:** Uses plain language ("look a law in the eye," "checking its own homework") for complex concepts. Avoids excessive jargon while retaining accuracy ("constitutional personality," "procedural check," "proportionality").
  4.  **Althusius Nod:** Integrates him organically. Uses "organic, interdependent associations" which captures the *spirit* of symbiotic association without needing the precise term or correction. Links him to the practical reality ("messy reality... work together or push back") and connects him to the Swiss model subtly.
  5.  **"Constitutional Personality":** Correctly used and contrasted with the EU's lack of it. The bolded repetition reinforces it.
  6.  **No Lecturing:** Doesn't delve into Calvinism or Emden history. Uses Althusius as a touchpoint for the underlying *idea* relevant to the tension.
  7.  **No Quotes/Bibliography:** Entirely spoken language, concepts explained in the text.
  8.  **Pacing for 4 Minutes:** Concise paragraphs, clear transitions, strong opening/closing. Read it aloud slowly and time it!
  9.  **Workshop Link:** Explicitly states why this tension matters *for this discussion* ("shapes everything from trade agreements...").
  10. **Ends on Engagement:** Sets up the workshop's purpose by posing the core question derived from the tension.

  **Delivery Tip:** Emphasize the bolded phrases slightly. Pause briefly after presenting each model (Swiss/EU) and after stating the core tension. Make the "why does this mismatch matter" part feel like the natural pivot to the workshop's broader discussion. Good luck!
