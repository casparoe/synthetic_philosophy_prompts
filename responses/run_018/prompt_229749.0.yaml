       Follow-up: "But if a significant portion of victims and survivors feel that conditional amnesty denies them justice, doesn't that undermine the reparative value you attribute to truth? And doesn't it risk alienating those it's meant to repair, as some argue happened in South Africa?"

     Question 6 (Asymmetry problem):

       Question: "In conflicts with asymmetric power, state agents typically commit crimes against humanity on a large scale, while opposition fighters may commit more ordinary crimes. How can a single amnesty mechanism justly cover both? Doesn't this risk equating the crimes of the powerful with those of the weak, or even obscuring the systematic nature of state terror?"

       Why it bites: This questions the fairness and appropriateness of applying the same mechanism to perpetrators with vastly different levels of responsibility and to crimes of different magnitude.

       Anticipated reply: She might argue that the mechanism is applied based on the nature of the act and the need for truth, not on the identity of the perpetrator. She might also note that in negotiated transitions, both sides must see some benefit to participate.

       Follow-up: "In Rwanda, the gacaca courts focused on lower-level perpetrators and did not cover the victors' crimes. But in South Africa, the TRC did cover both sides. However, critics note that the majority of amnesty applications came from the apartheid state's opponents. Doesn't that asymmetry in application undermine the moral balance of the process?"

