     Let's draft:

     Question 1 (Impunity):

       Question: "One of the strongest objections to conditional amnesty is that it establishes a precedent that powerful actors can negotiate away accountability, potentially weakening the rule of law in the long term. How do you respond to the concern that even case-by-case amnesty, by avoiding trials, entrenches a norm of impunity that might be exploited in future political transitions?"

       Why it bites: This directly challenges the core justification by suggesting that the very act of negotiation for amnesty, even with conditions, undermines the foundational principle that no one is above the law.

       Anticipated reply: She might argue that the alternative is no transition at all, and that in contexts where trials are not feasible, conditional amnesty is the second-best option that at least secures truth and some form of accountability through disclosure. She might emphasize that the rule of law is built over time and that a transition that avoids violence is a prerequisite for building strong institutions.

       Follow-up: "But if the state signals that perpetrators of grave crimes can avoid prosecution by striking a bargain, doesn't that risk normalizing impunity for future elites, especially in societies with weak judicial traditions? How do you prevent conditional amnesty from becoming a template for evasion?"

     Question 2 (Verifiability):

       Question: "You emphasize that disclosure must be full, specific, and independently verified. But critics point out that perpetrators often control the narrative they offer, and that self-serving disclosures — which may omit key details or shift blame — can still meet the evidentiary threshold in practice. How can we ensure that 'full disclosure' is not just a fiction in the context of an amnesty process?"

