  First, I need to outline the full set of requirements. The user mentioned specific cases like breaking promises due to unforeseen harm or kindness turning into cruelty. So, the theory must handle context-dependent reasons. Then, distinctions like defeated vs. absent reasons—crucial for particularism to avoid collapsing into generalism. Also, moral weight (degree) vs. moral status (kind) can't be conflated.

