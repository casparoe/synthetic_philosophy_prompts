answer: |-
  Here's a breakdown of the core desiderata for a theory of moral reasoning compatible with particularism (assuming it's at least half-right), addressing your specific points and identifying tensions:

  **I. Core Non-Negotiables (Arising from Particularism Itself):**

  1.  **Radical Context-Sensitivity:** The theory **must** explain how the *very same feature* (e.g., promise-keeping, causing pain, helping) can be a reason *for* action in context C1, a reason *against* action in context C2, or morally *irrelevant* in context C3 ("kindness->cruelty"). This is the bedrock of particularism. *Cannot be compromised.*

  2.  **Holism of Reasons:** Reasons interact holistically. The theory **must** explain how the moral valence and force of any given reason is fundamentally dependent on, and altered by, the presence/absence of *other* features in the specific situation. No reason operates in isolation. *Cannot be compromised.*

  3.  **No Exceptionless Principled Generalizations:** The theory **must not require** or depend on the existence of true, substantive, exceptionless moral principles (e.g., "Always keep promises," "Never lie"). It must function effectively even if all such principles admit of genuine, non-ad-hoc exceptions in complex situations ("promise broken due to unforeseen harm"). *Cannot be compromised.*

  4.  **Non-Monotonicity:** Moral reasoning is defeasible. The theory **must** formally accommodate that adding new information (a new feature) can radically overturn a previous moral conclusion, not just add weight to one side. *Cannot be compromised.*

  5.  **Preserve Key Distinctions:**
      *   **Defeated Reason vs. Absent Reason:** It **must** distinguish between a feature *being present* but its usual reason-giving force being *silenced* or *overridden* (defeated), versus a feature simply *not being present* (absent). A promise broken under duress involves a *defeated* reason to keep it; no promise made involves an *absent* reason. Collapsing these destroys nuance. *Non-negotiable.*
      *   **Moral Weight vs. Moral Status:** It **must** distinguish between the *degree* of moral force a reason has (weight - how *strongly* this pain counts against the action here?) and its fundamental *kind* or *type* (status - *is* causing *this specific* pain even a relevant moral consideration here?). Confusing weight and status leads to invalid generalizations. *Non-negotiable.*

  **II. Desiderata from Cognitive Science & Psychological Realism:**

  6.  **Case-Based Reasoning:** The theory **must be compatible** with robust evidence that human moral reasoning often relies heavily on analogy, precedent, and pattern-matching to *concrete cases* (paradigms, prototypes), not solely on deduction from abstract principles. It should explain how we learn from past judgments.

  7.  **Role of Perception & Emotion:** The theory **must accommodate** the crucial role of moral perception (sensitivity to salient features) and emotional responses (guilt, empathy, resentment) in shaping moral judgment and motivation, without necessarily *reducing* morality to them. It should explain how these interact with deliberation.

  8.  **Bounded Rationality:** The theory **must function** under cognitively realistic constraints (limited time, information, processing power). It cannot require god-like calculation or access to all possible features. It must allow for "good enough" judgments under uncertainty.

  **III. The Asymmetrical Moral Residue Problem:**

  9.  **Residue Explanation:** The theory **must provide a plausible account** of why certain actions (like betraying a friend to save strangers) leave a distinct feeling of *moral residue* or *remainder* (guilt, regret), even if the overall judgment was correct, while "omissions" or sacrifices on the other side often feel different (sadness, perhaps, but not the same *guilt*).
      *   **Particularist Options:** It *can* explain this without smuggling in generalism:
          *   **Relational Particularism:** The residue arises from the *specific relational damage* inherent in the act itself (betraying *this* unique bond of friendship), not from violating a general rule. The harm to strangers, while immense, lacks this *particular relational violation*. The residue *is* part of the moral reality of that specific act-context.
          *   **Agent-Regret vs. Guilt:** Distinguishing regret about the *state of the world* (sadness strangers suffered) from guilt about one's *own constitutive action* (I *was* the betrayer). The latter is tied to one's agency in violating a thick relational norm *in this instance*.
          *   **Non-Cognitive Integration:** While the residue itself might involve strong non-cognitive elements (emotions, dispositions), the theory must explain *why* the cognitive/moral assessment *licenses* or *correlates with* this specific emotional response towards one's own action and not the other. It can't be *mere* noise; it needs a plausible moral-psychological link.
      *   *Status:* **Non-Negotiable to Explain.** Dismissing it *entirely* as noise ignores a pervasive and phenomenologically real aspect of moral experience that seems intimately tied to the *moral character of the specific act*. Particularism must account for the *source* of this asymmetry without defaulting to general rules.

  **IV. Potential Points of Tension / "Generalist Baggage" (Require Careful Handling):**

  *   **Predictability & Guidance:** Critics demand predictability and clear guidance, often seen as requiring rules. A particularist theory should strive to explain how reliable judgment *is* possible without rules (via sensitivity, experience, paradigms) but doesn't need to promise algorithmic predictability. *Not a core non-negotiable for particularism itself.*
  *   **Moral Progress & Disagreement:** Explaining how moral progress happens or resolving deep disagreements without shared principles is harder for particularism. The theory needs *some* account (e.g., refining perception, expanding paradigms, examining holistic constellations) but shouldn't require convergence on universal rules. *Important but potentially satisfied without generalism.*
  *   **"No Priorities" vs. Residue:** The deepest tension might be between the particularist rejection of *fixed* general priorities ("relationships always trump strangers") and the seeming *asymmetry* revealed by residue. The solution lies in grounding the residue *in the specific relational context of the act itself*, not in a general priority rule. The asymmetry reflects the *different moral kinds* of reasons involved in the specific choice, not a fixed hierarchy.

  **V. Potential Joint Unsatisfiability?:**

  *   **Radical Context-Sensitivity + Strong Cognitive Science Compatibility:** If cognitive science strongly suggests hard-wired, rule-like heuristics or modules dominate *all* reasoning, this clashes with radical context-sensitivity. However, evidence supports significant context-dependence and case-based reasoning in morality, making them likely compatible.
  *   **Holism + Bounded Rationality:** Holism implies considering vast interactions; bounded rationality severely limits this. The theory *must* explain how competent agents manage holism realistically (focusing on salient features, using paradigms, iterative consideration) without pretending to grasp the entire holistic web. This is a challenge, not necessarily an impossibility.
  *   **No Exceptionless Principles + Residue Explanation:** The main challenge is explaining residue without appealing to violated general rules. As argued above, this *is* possible through relational or agential explanations tied to the specific act-context. This is demanding but not logically impossible.

  **Conclusion:** The core non-negotiables are **Context-Sensitivity, Holism, No Exceptionless Principles, Non-Monotonicity, Preserving Defeated/Absent & Weight/Status distinctions, Cognitive Realism (esp. case-based reasoning), and Explaining Asymmetrical Residue.** The residue explanation is crucial – dismissing it as noise ignores a core moral phenomenon. While tensions exist (especially holism vs. bounded rationality and explaining residue without rules), a sophisticated particularist theory grounded in relational contexts, case-based learning, and a nuanced understanding of agency and emotional response *can* potentially satisfy all desiderata without collapsing into generalism or ignoring psychological reality. The key is anchoring everything in the morally salient particulars of the situation and the agent's embeddedness within it.
