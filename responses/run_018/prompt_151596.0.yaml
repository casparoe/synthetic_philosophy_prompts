  I need to figure out which desiderata are non-negotiable. Core particularism tenets like context-sensitivity, no exceptionless principles, and non-monotonic reasoning are essential. The distinctions (defeated/absent, weight/status) also seem crucial. Cognitive science alignment is necessary for realism. As for the residue asymmetry, maybe it's negotiable. Particularism could argue that residue comes from personal relationships, not moral generalism. But if it undermines particularism, it might need addressing.

