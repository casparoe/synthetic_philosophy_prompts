answer: |-
  1.  Conventions, including legal institutions like punishment, solve coordination problems by creating social facts; the register establishes that completing a substitute's term *counts as* discharging the offender's debt by conventional fiat, not by transferring a metaphysical substance like desert.
  2.  There is no "thing" transferred in your ontological sense; the discharge is a change in the state's conventional standing to impose further burdens, governed by the rules of the institution itself – a self-sustaining pattern of expectations and actions.
  3.  Regarding the division case: if psychological continuity (what matters) links *both* continuers sufficiently to the pre-division person, and *one* committed the murder, then punishing the *other* continuer involves imposing suffering on someone psychologically continuous with the offender, which my view *can* accommodate as potentially relevant to justification.
  4.  Whether this *particular* imposition is monstrous depends not on the bare possibility of such a practice under my framework, but on further moral arguments about fairness and the specific weight given to psychological continuity versus other factors like individual agency *after* the division, which I haven't precluded.
  5.  I need you to specify if, in the division case, you grant that the psychological continuity between the pre-division person and the *innocent* continuer is sufficiently robust to constitute "what matters" in survival (as per my fission arguments), or if you dispute that continuity exists.
