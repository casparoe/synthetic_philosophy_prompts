  I'm doing a graduate reading group on self-locating belief this term, and I have to give the last presentation plus a short response paper. What I'd actually like to do is work out where the professor stands rather than summarise another paper. She's given verdicts on a pile of cases in seminar and I've tried to reconstruct them: standard Sleeping Beauty (fair coin, woken once on heads and twice on tails with the amnesia drug) she says 1/3 on heads; the version with a thousand tails awakenings she says 1/1001; a coin weighted two to one in favour of heads she says 1/2; told that it's Monday she says 1/2; the coloured-room variant where the room is red on Monday and blue on the tails Tuesday and she opens her eyes on red she also says 1/2, and she made a fuss about that one, saying that staying at a half is the whole point and that anyone who gets two thirds there has run the wrong update; the no-drug variant where a second awakening would tell her it's tails she says 1/2 on the first awakening; the version with infinitely many awakenings she refuses to touch and says the setup is broken.

  The trouble is I can't tell wether that's a principle or just taste, because every one of those is a case with a single person and a protocol. So here are three cases she hasn't ruled on and I want to know what she'll say. (1) The duplicate case: fair coin, on heads Beauty is woken alone on Monday, on tails a perfect atom-for-atom duplicate of her is made at the moment of the flip and both are woken at the same time in identical rooms, with nothing available to either that tells her which one she is. (2) The next-room case: on heads Beauty is woken once; on tails Beauty is woken once and a lab assistant who has been told the entire protocol, has his own memories and knows he is not Beauty is woken at the same time in an identical room. What should Beauty say, what should the assistant say, and is it a problem if they get different answers out of the same experiment? (3) The cosmology case: two theories that fit every observation we will ever make, one saying there are about 10^9 observer-containing civilisations and the other about 10^20, otherwise identical.

  My flatmate, who did this group last year, says she'll say 1/3, then 1/3 for Beauty and 0 for the assistant, then refuse the third because it isn't an experiment — his reasoning being that she's just counting how many subjects end up in the relevant situation. I don't buy it, partly because the coloured-room verdict shows counting isn't all she's doing, and partly because in the assistant case its the choice of who counts that seems to be doing the work. So: what rules actually fit her track record, what does each of them predict for the three cases, what's your best guess with the reasons for preferring it, and what single case should I bring to seminar that would separate the rules that are left standing? If there's also a case where her own principle gives an answer she'd hate, I'd love that one for the end of the presentation.
