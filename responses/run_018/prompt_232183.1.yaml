prompt: |-
  My election law professor has been super consistant about campaign finance cases this semester. Her verdicts so far:

  - Upheld a federal ban on contributions to candidates by foreign nationals (foreign individuals, foreign governments, and foreign-incorporated entities).
  - Struck down the federal ban on independent expenditures by corporations from their general treasuries; she loves Citizens United and keeps quoting it.
  - Upheld a disclosure law that forces a nonprofit running electioneering ads to reveal its top donors.
  - Upheld a per-election cap on what individuals can give directly to a candidate's campaign committee.

  The quote she would not stop repeating is from Justice Kennedy's opinion in Citizens United v. FEC (2010): "There is no basis for the proposition that, in the political speech context, the Government may impose restrictions on certain disfavored speakers."

  Next week's case is this: Congress passes a law that bars any U.S.-incorporated corporation from making independent expenditures in federal elections if more than 20% of its stock is owned by foreign citizens or foreign governments. So the corporation is domestic, but its ownership is meaningfully foreign. The law is challenged by a Delaware-incorporated company that is 30% owned by a foreign soverign wealth fund; the rest of its shares are held by U.S. citizens.

  Pick the two or three plausible rules that fit her four verdicts, say what each predicts about the Delaware company, and then give your best guess about her vote, with a one-paragraph defense. Also identify which of her four earlier cases is the closest analog, and say why. Be honest about which of her own commitments would be doing the work either way. End by naming the single future case that would most cleanly tell the rules apart.

  Please use these sections, in this order: "Live rules" (about 150 words); "What each predicts" (about 200 words); "Best guess" (about 150 words); "The tell-apart case" (about 40 words).
reasoning: |-
  Okay, the user presents a detailed scenario about their election law professor's rulings and asks for analysis of a hypothetical case involving foreign-owned U.S. corporations. This appears to be an academic exercise testing understanding of campaign finance jurisprudence.

  Hmm, the professor has established a clear pattern: strict on direct contributions but permissive on independent expenditures, with strong adherence to Citizens United's anti-speaker-discrimination principle. The key is reconciling her foreign national contribution ban with her corporate expenditure protection.

  The Delaware company case creates tension between two values: preventing foreign influence (like her upheld foreign contribution ban) versus protecting corporate speech rights (like her Citizens United position). 

  For live rules, I consider three approaches: 
  The strict anti-discrimination rule would protect the corporation since it's domestic. 
  The foreign influence rule might permit restrictions based on ownership. 
  A middle-ground foreign control test could look at actual decision-making power.

  The closest analog is her upheld foreign contribution ban, but this involves expenditures not contributions - a crucial First Amendment distinction per Citizens United.

  My best guess is she'd strike down the law based on Kennedy's quote about not restricting "disfavored speakers," though her foreign influence concerns might create internal conflict. 

  The cleanest test case would be a U.S. corporation wholly owned by foreign entities - that would force the speaker discrimination versus foreign influence conflict into sharp relief.
answer: |-
  ### Live rules
  Based on her rulings, three plausible doctrinal frameworks emerge:  
  1. **Strict Anti-Discrimination Rule**: Government cannot restrict political speech based solely on the speaker’s identity (per *Citizens United*). Foreign influence is addressed only via contribution bans or disclosure.  
  2. **Foreign Influence Mitigation Rule**: Restrictions are permissible if reasonably preventing foreign nationals from circumventing contribution bans through corporate vehicles, focusing on ownership thresholds.  
  3. **De Facto Foreign Control Rule**: Restrictions allowed only if foreign owners exert actual control over corporate speech (e.g., board seats/voting power), not passive ownership.  

  Her upheld foreign contribution ban (#1) and corporate expenditure protection (#2) create tension here.  

  ### What each predicts  
  - **Anti-Discrimination Rule**: *Strikes down the law*. The Delaware corp is a U.S. legal entity; banning its expenditures based on shareholder nationality violates speaker equality. Kennedy’s quote directly condemns "disfavored speakers."  
  - **Foreign Influence Rule**: *Upholds the law*. Analogizes to her verdict #1: 30% foreign ownership risks foreign money influencing elections, evading the foreign contribution ban. The 20% threshold is a proxy for meaningful influence.  
  - **De Facto Control Rule**: *Likely strikes down*. Mere 30% passive ownership by a sovereign fund, without evidence of dictating political spending, doesn’t equate to foreign control. Upholding requires proof of operational influence.  

  Her commitment to *Citizens United*’s speaker-blind principle conflicts with her deference to foreign contribution limits.  

  ### Best guess  
  **She votes to strike down the law**. Her reverence for *Citizens United*’s anti-discrimination principle ("no restrictions on disfavored speakers") likely overrides foreign influence concerns here. The corporation is U.S.-incorporated and thus a "domestic speaker"; penalizing it for foreign shareholders’ nationality directly targets identity, which Kennedy’s opinion forbids. Her upheld individual contribution cap (#4) and disclosure rule (#3) show she tolerates content-neutral, speaker-agnostic regulations, but this law facially discriminates among corporations based on ownership. The closest analog is her *Citizens United* verdict (#2), as both involve corporate expenditure bans tied to corporate identity – here, ownership structure instead of corporate form. Her foreign contribution ban (#1) is distinguishable because *contributions* pose greater corruption risks than independent expenditures.  

  ### The tell-apart case  
  **A U.S. corporation wholly owned by foreign citizens making independent expenditures**. If she upholds a ban here, she prioritizes foreign influence; if she strikes it, speaker neutrality dominates. This isolates the ownership threshold question.
