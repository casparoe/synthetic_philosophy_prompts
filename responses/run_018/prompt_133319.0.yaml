  The core tension they're highlighting is fascinating: regulators act like these two tests measure the same "unfairness" concept, but one relies on observable correlations while the other requires causal modeling of hypothetical scenarios. I need to unpack why this is philosophically problematic.

  First, let's map the implicit commitments. When institutions treat these as equivalent, they're essentially assuming that observed correlations perfectly reveal causal structures - what philosophers call "indicative conditionals" (if A happens, B happens) being interchangeable with "counterfactual conditionals" (if A had happened, B would have happened). That's a massive ontological shortcut.

  The messy reality is that correlation doesn't equal causation. There could be confounding variables making protected class appear correlated with outcomes when no actual discrimination exists. Conversely, causal unfairness might hide behind seemingly fair correlations through mechanisms like proxy discrimination. 

  If we refuse to collapse this distinction, regulatory design would need radical changes. We'd have to admit these measure different things - one detects symptoms, the other diagnoses causes. Auditing frameworks would need "tiered" approaches where statistical checks trigger deeper causal investigations, not replace them. More controversially, we might need to accept that some unfairness is undetectable without explicit causal models.

