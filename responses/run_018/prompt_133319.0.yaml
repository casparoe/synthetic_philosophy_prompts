answer: |-
  The auditing practice you describe implicitly assumes a **reductionist theory of conditionals** that treats indicative correlations as reliable proxies for counterfactual dependencies. Below, I reconstruct the philosophical commitments, assess their consistency, and outline implications of rejecting this reduction:

  ### Core Philosophical Commitments
  1. **Collapse of Modal Distance**:  
     The practice assumes that *observed statistical regularities* (indicative conditionals: "If protected class = X, then rejection rate is high") directly mirror *causal necessities* (counterfactuals: "Had protected class been different, the decision would change"). This presupposes a **non-separationist view** where indicative and counterfactual conditionals share the same truth conditions.

  2. **Causal Sufficiency of Observational Data**:  
     By treating the tests as interchangeable, regulators assume that:  
     - Observational data encodes all relevant causal structures (no hidden confounders),  
     - Protected attributes have no unmodeled causal influence on non-protected features,  
     - Correlation implies direct causal pathways reversible by attribute-flipping.

  3. **Epistemic Optimism**:  
     The framework assumes that *in principle*, counterfactual fairness can be deduced from finite observational data—denying fundamental limitations like the identifiability problem in causal inference.

  ### Internal Inconsistencies
  - **Confounding Paradox**: Observational tests (e.g., demographic parity) can flag spurious "unfairness" due to confounders (e.g., zip code correlating with race and credit risk). Meanwhile, counterfactual tests might miss discrimination if proxies (e.g., zip code) absorb causal effects.  
  - **Cross-World vs. Actual-World Mismatch**: Counterfactuals require comparing actual and *non-actual* worlds, while indicatives describe the *actual world only*. Treating them as equivalent ignores:  
    - Simpson's paradox (aggregate vs. individual-level effects),  
    - Mediation (e.g., education as a post-protected-attribute mediator).  
  - **Causal Asymmetry**: Indicative tests are symmetric (correlation is commutative), but counterfactuals are directional (e.g., flipping race may not equalize outcomes if societal biases alter feature distributions).

  ### Regulatory Redesign Without Collapse
  Rejecting the collapse would require:
  1. **Tiered Auditing Protocols**:  
     - **Phase 1**: Indicative tests as *screening tools* for anomalies.  
     - **Phase 2**: Mandatory causal analysis (via SCMs, do-calculus) for flagged systems, using domain-specific knowledge to define admissible covariates.  

  2. **Explicit Causal Grounding**:  
     - Require *causal diagrams* from developers showing paths between protected attributes, features, and outcomes.  
     - Test counterfactual fairness *only along non-blocked paths* (e.g., holding mediators fixed).  

  3. **Contextual Validity Constraints**:  
     - Acknowledge that counterfactual fairness is *impossible to verify* without strong assumptions (e.g., absence of unobserved confounders).  
     - Use robustness checks (e.g., sensitivity analysis for hidden bias).  

  4. **Divergent Standards**:  
     - **Indicative tests** for *group disparities* (e.g., compliance with disparate impact law).  
     - **Counterfactual tests** for *individual recourse* (e.g., GDPR's "right to explanation").  

  5. **Formal Rejection of Interchangeability**:  
     Legally distinguish:  
     - *Discrimination detected* (observational) vs.  
     - *Discrimination caused* (counterfactual).  

  ### Philosophical Implications
  - **Anti-Reductionism**: Rejecting the collapse affirms David Lewis's distinction: indicative conditionals describe *epistemic probabilities*, while counterfactuals rely on *modal metaphysics* (similarity of possible worlds).  
  - **Pragmatic Trade-offs**: Regulators must choose between:  
    a) *Feasible but incomplete* (indicative tests),  
    b) *Rigorous but untestable* (counterfactual tests).  
  - **Moral Prioritization**: Indicative tests address *distributive justice*; counterfactuals address *causal responsibility*. These need not align.

  ### Conclusion
  Current practice presupposes an **empiricist reduction of causality to correlation**—a position philosophically contested (e.g., by Cartwright, Pearl). If the distinction is upheld, algorithmic auditing must:  
  - Treat indicative and counterfactual tests as *complementary but distinct*,  
  - Accept that "fairness" is multi-dimensional and context-dependent,  
  - Require explicit causal justification for counterfactual claims.  
  This forces regulators to confront the *limits of data-driven auditing* and integrate sociological knowledge of structural bias.
