answer: |-
  ### Joint Statement: Adversarial Collaboration on Teleosemantics & Algorithmic Misrepresentation  
  *Drafted by evolutionary teleosemanticists (ET) and ontogenetic-functionalists (OF) | Science & Ideas Journalist Report*

  **Agreed Claims:**  
  1. **Misrepresentation must be naturalizable**: Both camps agree that any theory of mental content must explain how systems *misrepresent* (e.g., a frog snapping at a moving BB instead of a fly).  
  2. **Causal correlation is insufficient**: Pure covariant or causal theories (e.g., "fire detectors represent fire because they correlate with fire") fail without teleofunctional grounding; they can’t distinguish error from noise.  
  3. **Synthetic systems exhibit structural instability**: In RL-trained networks, "algorithmic misrepresentation" arises because optimization targets local loss minima, not stable biological functions. This creates representational drift (e.g., an image classifier that mislabels adversarial examples despite training).  
  4. **Naturalization requires normativity**: Content-fixing must entail *shoulds* (e.g., "this neuron *should* fire for edges, not textures").  

  ---

  **Disagreements Table:**  

  | **Issue** | **Evolutionary Side (ET)** | **Ontogenetic Side (OF)** | **The Crux** | **Shared Case/Argument** | **Predictions** |  
  |-----------|----------------------------|----------------------------|--------------|--------------------------|-----------------|  
  | **Selection requires reproduction?** | "Teleofunctions require heritable variation under phylogenetic selection. Reproduction is non-negotiable." | "Selection can occur in non-reproductive systems via reinforcement learning. A rat avoiding shocks isn’t reproducing—it’s learning." | Is Darwinian selection *necessary* for normativity? | Synthetic neural nets: Both agree RL systems lack phylogeny but disagree on whether this voids normativity. | **ET**: Synthetic nets lack true misrep. **OF**: Nets misrepresent when deviating from training goals. |  
  | **Ontogeny substitutes phylogeny?** | "Phylogeny sets the telos; ontogeny refines it. No evolutionary history = no content." | "Ontogenetic learning *creates* content via feedback loops (e.g., operant conditioning). Evolution is background scaffolding." | Can lifetime learning bootstrap content independently? | Honeybee navigation: ET sees phylogeny-fixed "map" content; OF sees lifetime learning overriding it. | **ET**: Bees without innate wiring can’t represent. **OF**: Rewired bees *can* via new feedback. |  
  | **Do synthetic systems have mental content?** | "No. RL agents have no proper function—only programmer intentions. Their ‘errors’ are just bugs." | "Yes. Content emerges from functional roles in achieving rewards (e.g., AlphaGo’s ‘winning’ state)." | Are synthetic goals (loss functions) sufficient for derived intentionality? | Adversarial examples in AI: An image misclassified as a "panda" due to noise. | **ET**: Merely broken circuitry. **OF**: Genuine misrepresentation of visual content. |  
  | **Is this dispute (partly) verbal?** | "No. We disagree on the *mechanism* grounding norms (history vs. current role)." | "Partly. ‘Function’ is polysemous; ET over-indexes on etiology, OF on disposition." | Are we defining "function" differently? | Malfunctioning hearts: ET says "can’t pump blood due to broken history"; OF says "fails current causal role." | **ET**: Verbal agreement won’t resolve. **OF**: Clarifying terms bridges 30% of the gap. |  

