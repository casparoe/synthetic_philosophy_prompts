answer: |-
  Here are five serious defeaters:

  1.  **Science's unprecedented predictive precision across novel contexts:** If theories are merely coping tools, why do mathematical physical models (e.g., quantum electrodynamics) achieve predictive accuracy to many decimal places in entirely new experimental setups, far beyond mere instrumental utility?  
  2.  **Convergent revision across diverse perspectives:** How do radically different observers, using distinct instruments and starting points, consistently converge on corrigible errors (e.g., detecting a planet's position or a gene's function) without appeal to an external constraint resisting some descriptions?  
  3.  **The robust success of "unloved" theories:** Why do theories initially adopted for pragmatic/political reasons but later deemed ontologically incorrect (e.g., Newtonian gravity predicting tides, phlogiston explaining some reactions) demonstrably fail in ways later theories correct, suggesting a reality *resisting* inadequate descriptions?  
  4.  **The indispensability of non-linguistic constraints in learning:** Human language acquisition and scientific discovery demonstrably rely on causal interactions with a non-discursive environment (e.g., perceptual feedback, experimental manipulation); an AI generating text without such grounding lacks the constraint explaining human conceptual development.  
  5.  **Pragmatism's implicit normative reliance:** The pragmatist's own valuing of "coping," "solidarity," or "avoiding cruelty" presupposes normative standards *not* merely internal to discourse, raising the question of what grounds *these* values if all is vocabulary.
