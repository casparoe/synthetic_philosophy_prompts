  I recall al-Ghazālī's critique targets Avicenna's necessitarianism—the idea that causes *must* produce effects by their nature. But al-Ghazālī doesn't deny observable regularities; he attributes them to God's habitual action. So the debate might hinge on whether "customary connection" (ʿādah) implies mere coincidence or divinely orchestrated patterns. 

