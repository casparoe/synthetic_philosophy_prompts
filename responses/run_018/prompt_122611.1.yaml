  - The "why" hinges on counterfactuals about rule-breaking scenarios
  - Social psychologists already recognize normative conformity and internalized rules as mechanisms

  I'm checking against the user's hunches: yes, this leverages the normative/frequency robustness split. The virtue ethicist cares about robustness in morally significant variations (rule conflicts), while situationists measure robustness across frequently encountered situations. 

  For the counterattacks section, I need to prioritize dissertation-level concerns. The epistemic access objection is strongest here because it challenges the very evidence base. The reply must ground counterfactual reasoning in observable patterns (like consistent rule-following rigidity) without begging the question. 

  Biggest challenge was avoiding stipulation. In the loyalty case, I derived the VE verdict from practical wisdom - the agent's inability to discern when to override rules shows lack of phronesis. The mechanism (rule-compliance) implies counterfactual failure without being stated explicitly. 

  Word count is tight. Cutting the psychology to just conformity/internalization keeps it recognizable. No fake studies - the scenario stands on its own logic. 

  Final worry: Is "loyalty" the right virtue? It works because unlike compassion, its behavioral markers are highly convention-dependent. But I should flag that the virtue's social dimension is crucial for this case to hold.
answer: |-
  Here is a constructed case meeting your specifications, followed by analysis:

  **Scenario: The Rule-Keeper**  
  Sarah is a senior nurse on a palliative care ward. Over five years, she consistently demonstrates behaviors coded as *loyalty*: she reliably defends colleagues against unfair patient complaints, advocates fiercely for her ward's resources in staff meetings, covers shifts for teammates without complaint, and never criticizes the hospital publicly despite systemic understaffing. Her actions are stable across shifts (day/night), patient acuity levels, and management changes. An observer would describe her as "unwaveringly loyal." Her self-reports align: she cites commitment to her team and institution as her core motivation. No single situational variable (e.g., supervisor presence, workload spikes) explains her consistency; her advocacy occurs in private meetings and public forums alike. By situationist criteria (cross-situational consistency, predictive validity, absence of dominant situational cues), she possesses the robust trait of *loyalty*.

  **Virtue-Ethical Verdict (Using Aristotelian Conditions):**  
  Sarah lacks the virtue of loyalty. Her behavior stems from a deeply internalized, rule-bound disposition: "Always support the team/institution." She acts *for the sake of following this rule*, not *for the sake of the fine (to kalon)* – the noble good of genuine loyalty (e.g., the flourishing of colleagues and patients *through* right relationship). She lacks *phronesis* (practical wisdom) because her disposition is inflexible. When counterfactual situations arise (specified below), she cannot discern when loyalty requires *criticizing* the team/institution to protect its true good (e.g., exposing dangerous negligence by a colleague, whistleblowing on harmful hospital policies). Her affect is calm compliance, not the emotionally responsive engagement of true loyalty (which might involve righteous anger at institutional betrayal). Her mechanism is rule-compliance, not virtue.

  **Situationist Verdict:**  
  Sarah possesses a robust trait of loyalty. Her behavior is highly consistent across observed situations (ward, meetings, staffing crises) over a significant duration, predicting advocacy and defense reliably. No situational variable overrides the trait’s expression. This satisfies the empirical criteria for a trait: cross-situational behavioral coherence and predictive validity within the sampled domain (ordinary hospital operations). The critique’s standards commit the situationist to attributing loyalty here.

  **Structural Feature:**  
  The case turns on **counterfactual sensitivity to normatively significant rule-conflict situations**.  
  - *Remove this feature (make mechanism visible):* If Sarah *within the sampled situations* blindly defends a negligent colleague *despite clear evidence harming patients*, her behavior becomes situationally explainable (e.g., in-group bias), and *both* sides deny true loyalty.  
  - *Add normative robustness:* If Sarah, when encountering a hidden counterfactual (e.g., a colleague’s dangerous error), demonstrates *phronesis* by confidentially reporting it *for the sake of patient safety and the team’s integrity*, she exhibits true virtue. Her disposition responds correctly to the normatively demanding situation.

  **Situationist Counter-Attacks & Replies:**  
  1.  **"Separate Domains Argument":** *"The situationist critique only concerns empirical trait existence, not normative virtue-status. Your ‘lookalike’ is just a robust trait we *call* loyalty. Virtue ethics defines ‘true virtue’ as it wishes."*  
      **Reply (Strongest worry; needs direct engagement):** The situationist critique *presupposes* its empirical definition of traits (cross-situational consistency) suffices to challenge the *existence* of what virtue ethics posits (robust character *as virtue*). If VE can show that traits satisfying *situationist criteria* systematically fail VE’s *constitutive conditions* (like *phronesis*), it demonstrates the critique targets a straw man. The empirical trait VE denies *is* the one the situationist claims is rare/absent. The domains are entangled in the debate’s framing. (1 para: Argue the critique’s force relies on conflating empirical robustness with VE’s richer concept; showing they can diverge undercuts the critique’s relevance).  

  2.  **"Frequency-Weighted Robustness":** *"Robustness *is* defined by frequency-weighted situational stability. Your ‘normative’ situations are rare/contrived and thus irrelevant for trait attribution."*  
      **Reply:** Virtue ethics argues virtues are defined by excellence precisely *in* challenging, normatively loaded situations – that’s what makes them virtues, not mere habits. If robustness only tracks common situations, it cannot capture the excellence VE cares about. The situationist’s definition is question-begging against VE’s core claim about virtue’s nature.  

  3.  **"Epistemic Access/Objection":** *"How can VE know Sarah’s mechanism/counterfactuals? This is unfalsifiable speculation. Only behavior matters empirically."*  
      **Reply:** VE need not access Sarah’s private states. Her *inflexible rule-following pattern* (e.g., never deviating, inability to articulate nuanced reasons beyond "team first") within *observed* situations provides evidence for the rule-based mechanism. The counterfactual profile is implied by this rigid disposition, not stipulated ad hoc. VE uses observed behavior + dispositional theory to infer the *structure* of the trait.

  **Derivation Check:**  
  The VE verdict is derived: Her observed rigidity and rule-centric motives imply lack of *phronesis* (inability to discern when rules conflict with the fine). The counterfactual (rule-conflict) is characterized *independently*: situations where institutional/team interest *objectively* conflicts with patient welfare/justice, identifiable by normative reasoning, not by Sarah’s failure. The lookalike mechanism (rigid rule-compliance) is a recognized psychological pattern (internalized normative conformity), not a vice like sycophancy. The situationist verdict falls directly from their own operational criteria applied to the observed behavioral stream.
