answer: |-
  Here’s a structured lesson plan for teaching **consequentialist cluelessness through structural incommensurability**, designed for a second-year philosophy group using British English. The sequence prioritises conceptual dependency and pre-empts key misconceptions.

  ---

  ### **Lesson Sequence: Structural Incommensurability in Consequentialism**
  **Core Claim:** *Direct welfare outcomes and long-term institutional impacts aren’t just hard to compare—they belong to fundamentally distinct evaluative categories.*

  #### **1. Groundwork: Consequentialism’s Core Premise**  
     - **What to cover:** Recap act-consequentialism: acts are right iff they maximise *good outcomes*.  
     - **Dependency:** Assumes students grasp the basic "maximise good" criterion.  
     - **Crucial point:** Emphasise that *comparability* of outcomes (via a single metric, e.g., welfare) is foundational.  

  #### **2. Introducing Two Types of Consequences**  
     - **Distinction:**  
       - **Type A (Direct Welfare):** Measurable, immediate effects on well-being (e.g., pain/pleasure, health, income).  
       - **Type B (Institutional):** Effects on social/political structures (e.g., norms, power dynamics, institutional resilience).  
     - **Example seed:** *"Consider a policy’s effect on hospital wait times vs. its effect on public trust in the NHS."*  
     - **Dependency:** Students must recognise Type B as *consequences* (not deontic constraints).  

  #### **3. The Carrying Example: Surveillance Expansion Policy**  
     - **Policy choice:** *Introducing widespread AI surveillance in public spaces to reduce violent crime.*  
     - **Type A (measurable):**  
       - Direct welfare gain: 10% reduction in assaults (quantifiable lives saved, injuries prevented).  
     - **Type B (incommensurable):**  
       - Institutional effects: Normalisation of state monitoring; erosion of social trust; reduced civic pushback against future power grabs.  
     - **Deliberate design:**  
       - No "exchange rate": *Cannot* express the value of "preserved civic courage" in equivalent assault reductions.  
       - No forecasting fix: Even with perfect crime-prediction models, Type B effects resist conversion to welfare metrics.  

  #### **4. Defining Structural Incommensurability**  
     - **Key move:** Argue Type A and Type B aren’t "more vs. less" of the *same thing* (e.g., "well-being units").  
       - Type A: Tracks experiential states.  
       - Type B: Tracks systemic conditions *enabling* or *corroding* future moral agency.  
     - **Analogy:** "Comparing the weight of a book to the colour red—they aren’t ‘less comparable’; they’re *different kinds of properties*."  

  ---

  ### **Pre-empting Misconceptions**  
  | **Misconception** | **When to Head Off** | **Response** |  
  |-------------------|----------------------|--------------|  
  | **"This is just risk-aversion"** | After introducing Type B effects | *"Risk-aversion operates within a single metric (e.g., ‘high variance in welfare outcomes’). Here, there’s no shared metric to be uncertain *about*."* |  
  | **"Better forecasting solves it"** | After the carrying example | *"Forecasting improves *predictions*, but incommensurability means we lack a *common evaluative language*. Perfect prediction still leaves us asking: ‘Is 8% less crime worth a 15% erosion of democratic resilience?’—and that question has no welfare-arithmetic answer."* |  

  ---

  ### **Closing Comprehension Question**  
  > **"Could a consequentialist *in principle* resolve the surveillance policy dilemma by inventing a formula that converts ‘civic trust’ into equivalent welfare units? Why/why not?"**  
     - **Correct grasp:** "No—because civic trust isn’t *made of welfare*; it’s a precondition for welfare’s possibility in a free society."  
     - **Misread:** "Yes, if we could quantify trust’s impact on mental health." (Confuses *causal links* with *metric unity*.)  

  ---

  ### **What to Explicitly Exclude**  
  - **Refuse to cover:** *Quantitative risk frameworks (e.g., expected utility theory under uncertainty)*.  
  - **Reason:** This debate treats outcomes as commensurable but uncertain. Our focus is the *categorical gap*—mixing the discussions undermines the incommensurability thesis.  

  ---

  ### **Pedagogical Weaknesses & Contingencies**  
  1. **Dependency Risk:** If students don’t accept Type B *as consequences*, the argument stalls.  
     - **Contingency:** Pre-empt with historical examples (e.g., short-term economic gains from colonialism vs. long-term institutional corruption).  

  2. **Example Limitations:** The surveillance case may trigger privacy debates, distracting from metric incommensurability.  
     - **Why it’s weak:** Students might think democratic erosion *is* reducible to welfare (e.g., "anxiety from being watched").  
     - **Backup example:** *Deregulating labour laws to boost GDP (Type A) vs. entrenching worker precarity (Type B)*.  

  3. **Reordering Case:** If students fixate on "But surely we *can* compare them somehow?", **flip Steps 3 and 4**. Start with the abstract gap (Step 4), *then* use the example to expose intuitive resistance to metric unity.  

  ---

  **Rationale for Sequence:**  
  The order forces a collision between consequentialism’s demand for comparability and the example’s categorical disconnect. By refusing to engage forecasting/risk debates, you isolate incommensurability as a deeper, structural flaw. The closing question tests whether students see the gap as conceptual rather than empirical—a litmus test for grasping the "different kinds" claim.
