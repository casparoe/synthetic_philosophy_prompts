  For the Lucas critique question, I recall it actually reinforces F-twist for policy models by demanding structural microfoundations—even unrealistic ones—to survive policy changes. That's ironic because Lucas himself criticized traditional models for lacking microfoundations. The first speaker seems to conflate "unrealistic" with "structurally wrong" when Lucas would say unrealistic microfoundations are necessary for policy robustness.

  On calibration entanglement, the first speaker has a point about pure calibration (matching moments) being circular, but structural estimation through cross-equation restrictions does create meaningful separation. Still, in practice most DSGE work blends both, so entanglement is real though not absolute. 

  The recalibration argument is trickiest. If changing microfoundations forces full recalibration, doesn't that prove assumptions are doing predictive work? But identification issues could explain it—the new learning rule might require different parameters to match the same data. The second speaker's concession about entanglement but appeal to identification seems reasonable, though unsatisfying. Friedman never considered unidentified models anyway.

