answer: |-
  Here are eight interview questions designed to press the core arguments of boundary endogeneity theory, including your specific requests and strategic follow-ups:

  1.  **The Core Challenge:** "You argue that using colonial borders as 'natural experiments' is fundamentally flawed because borders weren't randomly assigned but *drawn where extractive institutions were already viable*. Doesn't this render *any* causal inference about the *long-run* effect of institutions using border discontinuities impossible? If so, what methodology *can* credibly address this question?"
      *   *Likely Reply:* Agreement, emphasizing historical contingency and path dependence, suggesting alternative methods (archival work, deep case studies, process tracing).
      *   **Follow-Up:** "But if border discontinuity methods are invalidated for long-run causality, doesn't that gut a huge chunk of the empirical evidence underpinning the institutions hypothesis? How do we avoid throwing the baby out with the bathwater? What specific evidence *does* convince you institutions have an independent long-run effect?"

  2.  **The Culture Question:** "A common criticism is that 'culture' often acts as a residual category – whatever institutions and geography can't explain gets dumped into the culture bucket. How does boundary endogeneity theory avoid falling into this trap itself? Isn't 'pre-colonial institutional viability' just another hard-to-measure residual?"
      *   *Likely Reply:* Argues that culture often masks deep institutional persistence or institutional-geography interactions; boundary endogeneity focuses on the *process* of border drawing revealing pre-existing conditions.
      *   **Follow-Up:** "You say culture hides 'unmeasured institutional persistence'. But how do we empirically distinguish *that* persistence from, say, persistent geographic advantages or slow-changing cultural norms *themselves*? Isn't claiming 'it was institutional persistence all along' just as vulnerable to the residual critique if we lack direct, pre-colonial measures?"

  3.  **The Counterfactual / Co-Evolution Problem:** "You emphasize that institutions and geography co-evolve over centuries. Given this deep entanglement, is there *any* plausible historical counterfactual scenario or empirical strategy that could *genuinely* isolate the unique causal effect of institutional quality from geographic luck?"
      *   *Likely Reply:* Argues true separation is likely impossible without unrealistic, ahistorical counterfactuals; the focus should be on understanding the co-evolutionary process.
      *   **Follow-Up:** "If true separation *is* impossible, doesn't that make policy prescriptions incredibly murky? If we can't isolate 'institutions' from the geographic and historical soup they emerged from, how can we confidently say 'improve institutions' is the key to development? Doesn't this risk policy paralysis?"

  4.  **Korea & Africa - The Exclusion Restriction Test:** "Korea's partition and arbitrary African borders are often held up as gold-standard 'natural experiments'. You reject this. Specifically, regarding the exclusion restriction – the assumption that the border *only* affects outcomes through the assigned institution – why do these cases fail? Is it *just* because the 'treatment' (the specific colonial/post-colonial institution) wasn't randomly assigned along the border?"
      *   *Likely Reply:* Argues the border placement itself reflected underlying geographic, ethnic, or pre-colonial political factors correlated with institutional potential; the assignment of *which* colonial power/getting which institution wasn't random *with respect to those factors*.
      *   **Follow-Up:** "So, even in these 'arbitrary' cases, you're saying the key institutional differences observed *post-border* likely stem from pre-existing differences *where the border was drawn*, making it impossible to attribute outcomes solely to the *new* institutional regime? If that's true, what observable evidence *would* convince you the exclusion restriction holds?"

  5.  **What *Does* Cause Divergence?** "If border discontinuity methods are circular or invalid for long-run causality, and institutions/geography/culture are hopelessly entangled, what *is* your positive theory? What *does* boundary endogeneity theory identify as the primary driver of the massive divergence in national wealth we see today? Is it the *interaction* itself, and if so, how does that help us understand?"

  6.  **The Policy Implications:** "Critics might say your theory is intellectually interesting but ultimately nihilistic for policy – if the roots of extractive institutions are buried deep in pre-colonial geography or institutional viability, and borders just locked that in, what realistic leverage do modern policymakers have? How can we break out of these deeply entrenched paths?"

  7.  **Alternative Evidence:** "Beyond critiquing border discontinuity methods, what specific historical evidence or case studies most strongly support the boundary endogeneity thesis? Can you point to examples where we *can* explicitly see colonial powers drawing borders precisely *because* they identified locations ripe for extraction based on pre-existing conditions?"

  8.  **The Burden of Proof:** "You're challenging a dominant methodological paradigm. Given that, what's the burden of proof for boundary endogeneity theory? What evidence *against* it would you find most convincing? For instance, if a study using a different method (not border discontinuity) found strong evidence for institutional persistence *independent* of pre-colonial geography, would that falsify your core claim?"

  **Key to the Requested Three & Follow-Ups:**

  *   **Culture as Residual:** Covered in Question 2 & its Follow-Up.
  *   **Counterfactual/Separation Problem:** Covered in Question 3 & its Follow-Up.
  *   **Korea/Africa & Exclusion Restriction:** Covered in Question 4 & its Follow-Up.

  These questions are designed to:
  1.  Force clarification of the core critique.
  2.  Challenge potential weaknesses (residual category, policy implications).
  3.  Press on specific empirical cases (Korea/Africa).
  4.  Demand positive claims and alternative evidence.
  5.  Explore the consequences of the theory (e.g., for causality, policy).
  6.  Include sharp follow-ups anticipating common defenses to push the discussion deeper.

  Good luck with the interview! This sounds like fascinating content.
