  ### Thought Experiment: The Clay Tokens of Mount Alyn

  In a secluded valley community of 200 people, isolated by rugged terrain, residents adopt marked clay tokens as their primary exchange medium. These tokens, produced by a single artisan using locally sourced clay, are scarce due to the labor-intensive process and the artisan’s limited output. Villagers use the tokens daily to trade goods and services, treating them as a unit of account, store of value, and medium of exchange—fully functional in practice. Crucially, they collectively believe the tokens derive value from being "blessed" by a mythical mountain spirit, a false origin story reinforced through oral tradition. This belief is universally held but never validated, as the community has no leaders, councils, or hierarchical structures; all decisions, including token adoption, arise from egalitarian consensus. Transactions are peer-enforced via social norms, with no authority figure issuing, regulating, or legitimizing the tokens. The system thrives for decades, with tokens accepted by all in a purely horizontal network.

  ---

  ### Verification of Specifications

  1. **Collective Attitude Structure**:  
     - **Widespread collective horizontal acceptance**: Every villager intentionally accepts tokens as valuable for exchange, with mutual recognition of their role (e.g., "This token counts as payment for grain").  
     - **Shared false belief**: All falsely attribute the tokens' value to a "mountain spirit's blessing," though they are ordinary clay.  
     - **Functional, scarce, exchange-based**: Tokens are durable, scarce (limited by artisan effort), and used in routine transactions (e.g., food, tools), ensuring real-world utility identical to money.

  2. **Institutional Conditions**:  
     - **Present**: Collective intentionality, functional utility, scarcity, regular exchange, and a shared false belief.  
     - **Absent**: Hierarchical authority (no leaders, institutions, or formal roles to confer status). Status arises solely from peer-to-peer acceptance.

  3. **Nearby Worlds where Verdicts Flip**:  
     - **Searle flips if**: Collective intentionality dissolves (e.g., villagers abandon tokens after discovering the false belief), making tokens inert. *Tokens cease being money*.  
     - **Conferralism flips if**: A hierarchical authority emerges (e.g., a council declares tokens "official currency"), enabling status conferral. *Tokens become money*.  
     - **Both flip if**: Tokens lose functional utility (e.g., become abundant), collapsing social construction entirely.

  4. **Why Each Account Delivers its Result**:  
     - **(a) Searle-style account (tokens are money)**: For Searle, institutional facts require collective intentionality assigning a "status function" via constitutive rules ("X counts as Y in C"). Here, tokens (X) collectively count as money (Y) in the village (C) through horizontal acceptance, fulfilling all functional roles. The false belief is irrelevant; the *collective assignment* creates the institutional fact.  
     - **(b) Conferralist account (tokens are not money)**: For conferralism (e.g., Ásta), social kinds require a relevant *authority* to confer status. Here, no hierarchical agent (e.g., state, chief) exists to confer "moneyhood"; horizontal acceptance alone lacks the "standing" to confer institutional status. Thus, tokens are not money.  
     - **(c) Both agree on weaker social construction**: Both acknowledge tokens are "socially constructed" non-institutionally: as *artifacts* shaped by collective use and belief (e.g., tools for exchange), but without the deontic power (rights/obligations) of institutional facts.

  5. **Explanatory Feature**:  
     The **absence of hierarchical authority** drives the divergence. Searle prioritizes collective intentionality *alone*; conferralism requires authority-mediated conferral. The false belief ensures acceptance is not anchored to an authority (isolating horizontality), but it is not the core differentiator—authority is.

  6. **Effect of Removing False Belief**:  
     If villagers know tokens are ordinary clay but still accept them functionally:  
     - **Searle**: Unchanged—collective intentionality still creates money.  
     - **Conferralism**: Unchanged—no authority, so still not money.  
     The false belief is a red herring; it enables psychological plausibility but does not affect the verdicts. The core variable is authority, not belief.

  7. **Institutionalist Attack on the Scenario**:  
     A Searlean defender would argue that **horizontal collective acceptance *is itself* the missing authority structure**. They might contend that the community's shared intentionality functions as a "decentralized authority," satisfying Searle's requirement for status assignment. By collectively imposing the constitutive rule ("tokens count as money"), the group *becomes* the authority. Conferralism would reject this, insisting authority requires social hierarchy (e.g., roles with power asymmetries), not mere peer agreement. This attack highlights the crux: whether "authority" must be hierarchical.

  ---

  ### Honest Assessment of Isolation and Premise

  **Does the isolation succeed?**  
  Yes, but with a caveat. The variable—horizontal acceptance plus false belief—is isolated while holding functional utility, scarcity, and exchange constant. The false belief cleanly severs any latent appeal to authority (e.g., no "implied shamanic authority"). However, the **core divergence hinges on interpreting "authority,"** not the false belief. The scenario generates the verdicts non-stipulatively: Searle’s framework inherently downplays hierarchy, while conferralism centers it.

  **Does the task rest on a confused premise?**  
  No. The accounts are separable: Searle’s "collective intentionality" and conferralism’s "authority-based conferral" are distinct mechanisms. The scenario does not stipulate verdicts; it applies each theory’s criteria to neutral facts. For instance, conferralism’s denial of moneyhood follows directly from its definition of social kinds as authority-conferred.

  **What does the case demonstrate?**  
  It shows that **hierarchical authority is a necessary condition for institutional kinds under conferralism but not under Searle’s account**. The thought experiment reveals a fault line in social ontology: whether institutional reality requires top-down status assignment or can emerge bottom-up. If Searle’s "collective-as-authority" rebuttal holds, it suggests that sufficiently robust horizontal acceptance might *become* authority—a point for further debate. Ultimately, the case illuminates how theories diverge on the source of deontic power in social construction.
