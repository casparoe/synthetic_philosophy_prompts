  For sequencing, I should first reinforce that predictions don't cause outcomes - crucial since Death's presence is fixed. Maybe contrast with Newcomb where the predictor reacts to your choice. Need to whiteboard that distinction live.

  The atmospheric details of the original story actually help - the supernatural element prevents dismissive "but humans aren't perfect predictors" objections. Should keep the grim tone; it viscerally conveys the stakes when students realize both options lead to self-blame.

  Biggest misconception will be the randomization proposal. Must preempt it by noting Death predicts even randomized choices. Also expect "this is just like one-boxing" - I'll need side-by-side comparison showing Newcomb has a dominant strategy while here both options self-undermine.

  For understanding check, I won't ask for solutions - instead probe if they feel the rational paralysis. Something like "Why can't we say fleeing is rational?" to surface the evidential loop.

  Will consciously skip ratifiability proofs - too technical for first exposure. Can name-drop it as "advanced resolution some theorists propose" without details. Focus should stay on the meta-problem: rationality's possible failure.
answer: |-
  Here is your structured teaching plan for the fifty-minute tutorial:

  ### 1. Sequencing (Key Prerequisites)
  *   **Core Foundation:** Ensure students are fluent in **Evidential Decision Theory (EDT)** vs. **Causal Decision Theory (CDT)**. They must grasp the *difference* between conditioning on an act (EDT: "What does doing *A* tell me about the world?") and estimating its causal effects (CDT: "What will doing *A* *cause* to happen?"). Rehearse this distinction explicitly.
  *   **Newcomb's Context:** **Briefly refresh Newcomb's Problem** (1-2 mins). Emphasize: In Newcomb's, CDT (two-box) and EDT (one-box) yield *different prescriptions*, but both identify a *rational choice*. Crucially, Newcomb involves a predictor reacting *before* your choice. Death in Damascus differs because the prediction is *fixed* before deliberation.
  *   **Crucial Setup:** Before posing Death in Damascus, establish **two immutable facts**: (1) Death's prediction is *already made and infallible*; (2) Death *will be* wherever was predicted, independent of the man's *subsequent* action. Stress that the man's choice *cannot change* Death's location; it can only *reveal* where Death already is. This fixes the causal structure. Without this, students will conflate causation and evidence.
  *   **Why this order?** Newcomb shows prediction matters for rationality. Distinguishing EDT/CDT provides the tools. Fixing the prediction/location as causally independent prevents misapplication of CDT logic ("My choice doesn't cause Death's location, so I can ignore it") and sets up the evidential paradox.

  ### 2. The Carrying Example (Use the Original Story)
  *   **Keep the Supernatural Story:** Use the **original Death in Damascus narrative**. The atmospheric details (Death, supernatural infallibility, fatalism, appointment) are crucial.
  *   **Why Keep It?**
      *   **Infallibility:** A human predictor introduces doubt ("Maybe they're wrong?"), muddying the logic. Death's infallibility forces students to confront the pure dilemma.
      *   **Stakes:** The life-or-death stakes make the rational paralysis visceral and highlight the "regret" element (overwhelming evidence post-fact the other choice was better).
      *   **Fixed Past:** The supernatural element reinforces that the prediction is a *fixed, unalterable fact* of the past, unlike a human predictor who *might* be observing cues.
  *   **What to Emphasize:** Explicitly state: Prediction is fixed & perfect. Death's location is *causally independent* of the man's *current* choice. Choice only provides *evidence* of the prediction/location. Whichever choice is made, the man *will know* the other would have saved him.
  *   **What to Avoid:** Don't get bogged down in *how* Death predicts. Treat it as a given logical constraint.

  ### 3. The Misconception Map (Anticipate & Counter)
      1.  **"Death is cheating / The setup is contradictory!"** (Likely early, when stating infallibility + causal independence).
          *   **When:** Immediately after presenting the setup.
          *   **Counter:** Reiterate: The prediction is *already made*. It's a fact about the past. Death's presence *is caused by* that past prediction, not the man's *future* choice. The man's choice *correlates* perfectly with the prediction because Death is infallible, but doesn't *cause* it. The contradiction is *apparent* and the core of the puzzle.
      2.  **"He should just randomize (e.g., flip a coin)!"** (Very common intuitive response).
          *   **When:** After first pass explaining the paradox, when students seek an "out".
          *   **Counter:** Death predicts *exactly what he will do*, including any randomization procedure. If he decides to flip a coin, Death predicted that flip and its *outcome*, and is waiting accordingly. Choosing randomly doesn't break the correlation between choice and prediction; it just makes the choice itself indeterministic. The evidential reasoning (EDT) still applies: Conditioning on fleeing still suggests Damascus was safe, and vice versa.
      3.  **"This is just like one-boxing in Newcomb!"** (Due to surface similarity of a predictor).
          *   **When:** When drawing parallels after presenting the case or during discussion.
          *   **Counter:** **Crucial Distinction:** Side-by-side comparison. In Newcomb, the predictor *reacts* to your (anticipated) choice *before* you make it (fills boxes). Your choice *causally determines* what's in the *opaque* box. In Death in Damascus, the prediction/location is *fixed before deliberation* and *causally independent* of your choice. Your choice *reveals* but *doesn't cause* Death's location. In Newcomb, EDT (one-box) *feels* rational. In Damascus, EDT leads to paralysis because *both* choices seem evidentially disastrous. CDT also fails here.

  ### 4. The Check for Understanding (The Core Threat)
  *   **Question:** "Forget about finding a solution for a moment. *Why* does this case seem to show that *neither* staying nor fleeing can be rationally chosen, according to standard decision theories (EDT or CDT)? What specific feature creates this paralysis that wasn't present, or wasn't as severe, in Newcomb's Problem?"
  *   **Why it works:** A correct answer identifies the **fixed prediction combined with causal independence**, leading to the **self-defeating evidential loop** (whichever I plan, evidence suggests I should do the opposite) and the **failure of CDT to provide guidance** (since my choice causes nothing relevant). It shifts focus from the story to the *structural problem* for rationality.

  ### 5. Deliberate Omissions (Staying Focused)
  *   **Omit:** Detailed technical solutions (Ratifiability, Timeless Decision Theory, etc.), extensive discussion of "meta-preferences," or deep dives into alternative decision theories.
  *   **How to State It:** "This puzzle has generated many sophisticated proposed solutions in the literature, like the concept of 'ratifiable decisions' or more complex decision frameworks. For today, our goal is *not* to solve it, but to clearly understand *why* it poses such a fundamental challenge to the standard picture of rational choice offered by EDT and CDT. We're focusing on exposing the problem, not resolving it." This sets clear boundaries and emphasizes the tutorial's objective: appreciating the threat to the principle that rationality always selects an action.
