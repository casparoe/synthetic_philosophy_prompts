answer: |-
  Here's a taxonomy/decision tree for contractualism and aggregation, designed as a seminar handout with concrete cases. It starts from Scanlon's core principle and branches based on commitments about aggregation.

  ---

  **Contractualism & Aggregation: A Decision Tree**  
  *Core Principle: An act is wrong if any principle permitting it could be reasonably rejected by someone affected, given their personal reasons for objecting.*

  ### Step 1: Can the NUMBER of affected people change what counts as "reasonable rejection"?  
  *(i.e., Can the collective burden/benefit to a group outweigh an individual's burden?)*

  * **NO → Pairwise Comparison Only**  
    Only individual burdens matter. The *magnitude* of harm to one person vs. another is considered, but the *number* of people suffering/receiving benefits cannot tip the scales.  
    **→ LEAF 1: Hard Anti-Aggregationist**  
    - *Position:* Aggregation across persons is never permitted. Justification is strictly pairwise.  
    - *Kidney Case (Distribution):* **Cannot** harvest the healthy person's kidneys. The healthy person's right to bodily integrity outweighs *each* dying patient's need individually, and numbers don't matter.  
    - *Water Case (Rescue):* **Cannot** take any cups from the single hiker. Their claim to survival (needing 1 cup) is equal to *each* of the five hikers' claims.  

  * **YES → Number-Sensitive Contractualism**  
    The number of people affected can make a principle harder/easier to reasonably reject. Proceed to Step 2.

  ### Step 2: IF numbers matter, HOW does aggregation work?  

  #### Option A: Direct Harm-Benefit Aggregation  
  Aggregate harms/benefits across individuals via a weighted sum (e.g., total well-being).  
  **→ LEAF 2: Utilitarian-Leaning Contractualist**  
  - *Position:* Total net burden determines reasonable rejectability. Saving five lives outweighs harming one.  
  - *Kidney Case:* **Permissible** to harvest kidneys. The total benefit to five outweighs the harm to one.  
  - *Water Case:* **Permissible** to take cups. Net saving of four lives justifies the one death.  

  #### Option B: Collective Principle Justification  
  Aggregation works through impartial principles that prioritize saving more lives *as a rule*, not by summing harms.  
  **→ LEAF 3: Collective Rescue Principle Contractualist**  
  - *Position:* Principles like "Rescue the greater number in emergencies" are justifiable to each person *ex ante*, even if you end up worse off.  
  - *Kidney Case:* **Not permissible.** Bodily integrity isn't an "emergency rescue" context.  
  - *Water Case:* **Permissible.** "Save the greater number" applies to imminent life-threatening emergencies.  

  #### Option C: Domain-Specific Aggregation  
  Aggregation is only permitted in specific contexts (e.g., rescue) but not others (e.g., distribution).  
  **→ LEAF 4: Separate Spheres Contractualist**  
  - *Position:* Aggregation is valid in "rescue" (preventing imminent harm) but not "distribution" (allocating scarce resources fairly).  
  - *Kidney Case:* **Not permissible.** Distributing organs isn’t "rescue"; it requires pairwise fairness.  
  - *Water Case:* **Permissible.** This is a rescue scenario: numbers count.  

  #### Option D: Aggregation Only for Identical Harms  
  Aggregation applies only if all individuals face the *same type/degree* of harm.  
  **→ LEAF 5: Threshold-Sensitive Contractualist**  
  - *Position:* Numbers matter only when harms are comparable and above a severity threshold (e.g., death).  
  - *Kidney Case:* **Not permissible.** Harms aren’t identical: the donor loses health *and* autonomy; recipients gain life.  
  - *Water Case:* **Permissible.** All face identical harm (death by thirst), so saving five > saving one.  

  ---

  ### Empty/Unstable Combinations & Notes  
  1. **Pairwise + Direct Aggregation:** ❌ *Incoherent.* If only pairwise comparisons matter, summing across persons is impossible.  
  2. **Domain-Specific + Direct Aggregation:** ⚠️ *Rare/Unstable.* If aggregation is domain-restricted, why use utilitarian sums? Usually paired with collective principles (→ **Leaf 4**).  
  3. **Why no "Distribution-Only Aggregation"?** ❌ *Counter-intuitive.* We rarely think *more* people needing a scarce resource (e.g., kidneys) *weakens* individual claims. Usually, distribution contexts favor fairness over numbers.  

  ### Ambiguous Cases  
  - **The "Trolley Problem" (Switch Version):**  
    - *Hard Anti-Aggregationist (Leaf 1)*: Rejects pulling the switch (1 death vs. 1 death pairwise).  
    - *Others (Leaves 2–5)*: Permit pulling the switch (numbers count in rescue-like scenarios).  
  - **Vaccine Distribution:**  
    - *Separate Spheres (Leaf 4)*: Aggregation allowed (rescue from disease), so prioritize high-risk groups.  
    - *Hard Anti-Aggregationist (Leaf 1)*: Allocate by lottery (pairwise fairness).  

  ### Key Takeaways  
  | **Position**                  | **Kidney Case** | **Water Case** | **Basis of Aggregation**       |  
  |-------------------------------|-----------------|----------------|--------------------------------|  
  | 1. Hard Anti-Aggregationist   | ❌ Not OK       | ❌ Not OK      | Never                          |  
  | 2. Utilitarian-Leaning        | ✅ OK           | ✅ OK          | Total net harm/benefit         |  
  | 3. Collective Rescue Principle| ❌ Not OK       | ✅ OK          | Rule-based (rescue priority)   |  
  | 4. Separate Spheres           | ❌ Not OK       | ✅ OK          | Context: Rescue vs. Distribution |  
  | 5. Threshold-Sensitive        | ❌ Not OK       | ✅ OK          | Identical harms above threshold |  

  **Use in Seminar:** Apply cases to force intuitive judgments *first*, then map to positions. Scanlon (*What We Owe to Each Other*) leans toward **Leaf 4 or 5** but debates persist.

  ---  
  *Handout Tip: Print as a flowchart with LEAF boxes. Use cases to "test" positions when disagreements arise.*
