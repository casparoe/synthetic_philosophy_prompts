  i was trying to explain Scanlon's contractualism to my study group and we kept going in circles about whether it can actually deal with aggregation problems — like, can you ever justify harming one person to save five? I want a taxonomy/decision tree that sorts the real positions people hold on this, not just the labels they like. Start from the core contractualist idea that wrongness is about justifiability to each affected individual, then branch on whether aggregation across people is ever permitted. First split: does the "reasonably rejectable" standard apply pairwise only, or can the number of people affected change what's reasonable? Then split again on whether aggregation, if allowed, works through a weighted comparison of harms, through a collective principle, or only within specific domains like rescue but not distribution. I need concrete cases at each node — like "one healthy person has five kidneys that could each save a dying patient" versus "five stranded hikers each need one cup of water and one hiker has five cups but will die without at least one" — phrased so you answer from intuition, not from knowing the theory name. The leaves should include the hard anti-aggregationist, the qualified number-sensitive contractualist, the "seperate spheres" view where aggregation works in rescue but not in distribution, and whatever other combos exist; mark empty combinations and guess why they're empty (incoherent? just ugly?). Aim for about 7 leaves, flag pairs your tree can't really seperate, and don't ask me to cite Scanlon's papers — i don't have access and neither will the model answering this. Make it work as a seminar handout.
