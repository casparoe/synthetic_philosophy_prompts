  The core framework organizes autonomy into three registers: control-worth (self-modification capacity), respect-worth (accountability participation), and project-worth (long-term planning). I need to construct a step-by-step procedure with clear questions, evidence thresholds, stop conditions, and value-handoff points. Then apply it to three cases, including one designed to produce counterintuitive results, and finally outline limitations.

  For the procedure itself, I'll structure it as a flowchart with three sequential registers. Each register needs:
  - A precise question with behavioral evidence criteria
  - A clear threshold for proceeding ("sufficient" vs "insufficient")
  - Stop conditions that end the assessment with "no" autonomy worth wanting
  - Explicit flags where institutional values must override procedural outcomes

  For the case applications:
  - Case A (opioid addiction): Should show intact project-worth despite impaired control-worth, demonstrating how the registers separate capacities
  - Case B (FTD): Will likely fail at control-worth but show residual respect-worth, illustrating how social charm doesn't imply autonomy
  - Case C (designed counterexample): Needs to pass control and respect registers but fail project-worth, forcing confrontation with the framework's structural limitation that project-worth is the ultimate goal

  The limits section must name:
  - Two misclassification categories (e.g., fluctuating conditions, culturally divergent expressions of autonomy)
  - One excluded decision type (e.g., criminal responsibility assessments)

  Throughout, I need to maintain Dennett's pragmatic focus on what matters for institutional response rather than metaphysical debates. The language should be clinically actionable while preserving philosophical rigor in the background. The value-handoff points are crucial - these are where ethics committees must consciously make policy choices the procedure can't resolve.
answer: |-
  ### 1. The Procedure (450 words)  
  **Framework**: Sequential assessment of three registers. Failure at any register ends the process ("No autonomy worth wanting"). Proceed only if threshold met. *Value-handoff points* (VHP) marked with ⚠️.  

  #### **Step 1: Control-Worth Assessment**  
  *Question*: "Can the patient reliably override immediate impulses to act on longer-term preferences?"  
  *Evidence*:  
  - Clinical: Documented resistance to cravings/compulsions (e.g., delayed substance use, paused aggression after redirection).  
  - Behavioral: Use of self-distraction, adherence to pre-commitment strategies (e.g., locking away substances).  
  *Threshold*: ≥2 documented incidents of successful impulse modulation in past month.  
  *Stop/No*: No evidence of modulation despite opportunity; acute intoxication/impaired consciousness.  
  *VHP*: ⚠️ *If threshold marginally met but clinician judges modulation was externally triggered (e.g., staff intervention), override to "No."*  

  #### **Step 2: Respect-Worth Assessment**  
  *Question*: "Can the patient participate in reciprocal accountability (e.g., justify choices, acknowledge errors)?"  
  *Evidence*:  
  - Behavioral: Apologies after harm, coherent explanations for actions (even if flawed), engagement in reparative acts.  
  - Clinical: Response to "why did you do X?" with non-delusional reasoning.  
  *Threshold*: Consistent demonstration (≥3 instances) of accountability without prompting.  
  *Stop/No*: Inability to articulate reasons beyond "I wanted to"; persistent blame-shifting.  
  *VHP*: ⚠️ *If accountability is ritualistic (e.g., OCD patient reciting scripts) or inconsistent, clinician flags for institutional judgment.*  

  #### **Step 3: Project-Worth Assessment**  
  *Question*: "Can the patient form and pursue integrated life-plans beyond immediate needs?"  
  *Evidence*:  
  - Behavioral: Concrete steps toward goals (e.g., job applications), sacrifice of short-term rewards for future aims.  
  - Clinical: Coherent description of 5-year vision aligning with values (assessed via structured interview).  
  *Threshold*: Active pursuit of ≥1 plan for ≥1 month with measurable progress.  
  *Stop/No*: Goals are fragmented, fantastical, or abandoned within days.  
  *VHP*: ⚠️ *Institutional values decide whether "pursuit" requires observable action (e.g., hospitals may prioritize safety over ambition).*  

  **Output**:  
  - Pass all 3: Full autonomy worth wanting → Defer to patient preferences.  
  - Fail any: No autonomy worth wanting → Welfare overrides permitted.  
  - *Restricted Autonomy* (Control + Respect but no Project): Short-term coercion allowed (e.g., forced hydration) but long-term plans deferred to surrogate.  

  ---

  ### 2. Worked Applications (600 words)  

  #### **Case (a): Severe Opioid Addiction**  
  - **Control-Worth**: *No*. Refuses medication-assisted treatment; no evidence of resisting impulses (e.g., continues using despite stated goals). *Stop*.  
    → *Result*: Autonomy not worth wanting. Welfare interventions (e.g., involuntary detox) permitted.  
    *Committee Override?* Unlikely—clinical evidence clear.  

  #### **Case (b): Frontotemporal Dementia**  
  - **Control-Worth**: *No*. Aggressive outbursts occur without modulation; regret occurs post-hoc but no in-the-moment control. *Stop*.  
    → *Result*: Autonomy not worth wanting. Restraints/chemical sedation justified during outbursts.  
    *Committee Override?* Possible if charm/regret misinterpreted as control—explicit flag at VHP.  

  #### **Case (c): Designed Counterexample (e.g., Severe, Stable OCD with Anhedonia)**  
  *Hypothetical Patient*:  
  - *Control-Worth*: **Yes**. Rituals rigidly control impulses (e.g., handwashing prevents self-harm).  
  - *Respect-Worth*: **Yes**. Acknowledges harm from rituals ("I know it’s irrational, but I must").  
  - *Project-Worth*: **No**. No life-plans beyond ritual maintenance; anhedonia precludes future goals.  
  *Procedure Output*: **Restricted Autonomy**. Permits coercion for immediate welfare (e.g., force-feeding if rituals prevent eating) but blocks patient from refusing long-term housing (deferred to surrogate).  

  *Structural Flaw Generating Counterintuitive Result*:  
  The sequential, modular design treats "project-worth" as the ultimate telos. Control and respect are necessary but insufficient without sustained future-directedness. This risks pathologizing patients who prioritize present stability (e.g., chronic illness) over "ambition," privileging institutional bias toward productivity.  

  *Committee Likely Rejects*: Clinicians may argue rituals *are* the patient’s life-plan, but the procedure’s threshold ("pursuit beyond immediate needs") excludes static states. ⚠️ *VHP forces explicit debate on whether "project-worth" requires growth or mere stability.*  

  ---

  ### 3. Limits and Judgment Flags (250 words)  

  #### **Systematic Misclassifications**:  
  1. **Fluctuating Conditions** (e.g., Bipolar Disorder): Procedure captures single timepoint, missing episodic project-worth. May falsely reject autonomy during euthymia.  
  2. **Culturally Divergent Autonomy** (e.g., Collectivist Prioritization of Family Plans): Evidence criteria (e.g., "individual pursuit") may misread relational goals as passivity.  

  #### **Excluded Institutional Decisions**:  
  - **Criminal Referrals**: Respect-worth ≠ culpability. A patient passing respect-worth (e.g., FTD patient expressing regret) may still lack *mens rea*. Procedure assesses care decisions only.  

  #### **Value-Handoff Points Requiring Judgment**:  
  - ⚠️ **Control-Worth Threshold**: Clinicians must decide if "self-modification" includes *externally scaffolded* acts (e.g., recovery triggered by clinic rules).  
  - ⚠️ **Project-Worth Definition**: Institutions must define "life-plan" (e.g., Is addiction recovery a valid project? Requires policy-level input).  

  **What the Procedure Cannot Do**:  
  - Resolve conflicts between autonomy and justice (e.g., "Does respecting this patient’s restricted autonomy unfairly burden staff?").  
  - Replace capacity assessments for specific decisions (e.g., consent to surgery). It evaluates global autonomy "worth wanting," not task-specific competence.  

  ---
  *Final Note*: This procedure operationalizes Dennett’s "varieties of free will" by tailoring interventions to preserved capacities (e.g., leveraging respect-worth in addiction therapy). Its rigidity ensures efficiency but requires vigilance at VHPs to avoid algorithmic injustice.
