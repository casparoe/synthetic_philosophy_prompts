prompt: |-
  A close friend of mine is a behavioral ecologist who now works as a management consultant, and she has an exasperating habit of sorting every display in nature and in business into one of two bins: honest signal or cheap talk. She insists her rule is nothing more than Zahavi's handicap principle carried into boardrooms — honesty is purchased with cost, full stop. Last night, over several hours and one bottle too many, I tried to convince her that her own verdicts don't actually support that rule, and the argument ended unresolved. What I want from you is a prediction: given her track record below, what will she say about a new case I intend to put to her when we resume, and what principle is she in fact running?

  Her verdicts so far, as best I can reconstruct them: the peacock's train is an honest signal, because a malnourished male simply cannot grow one like it; stotting in gazelles is honest, because a slow gazelle cannot afford the wasted takeoff and because the display is the very athleticism it advertises; the roaring contests of red deer stags are honest, since only a stag in fighting condition can sustain the rate; and a live working interview, in which a candidate spends a full day solving real problems alongside the team, is honest, whereas a polished résumé and a rehearsed sit-down interview are not. On the other side of her ledger: she dismissed a luxury watch as cheap talk, since it can be leased for a weekend or financed by someone drowning in debt, and she said the same of apologies unaccompanied by restitution, and of a firm's boastful press releases about its own stability.

  The new case is this: a small business applying for a loan offers its bank permanent, read-only access to its real sales ledger and live bank feed, verified on the bank's own systems so the data cannot be staged or curated. This costs the owner essentially nothing, yet it would seem to separate healthy businesses from unhealthy ones just as decisively as any peacock's tail separates fit males from starvelings. When I sketched the case she refused to classify it, which is when things got heated. Please give me your best guess as to which bin she will put it in, and — more important than the guess itself — lay out the candidate rules that are each consistent with every one of her earlier calls: whether honesty for her requires differential cost, practical unfakeability, or something subtler that I haven't seen. Say what each candidate rule predicts for the loan case, explain why you favor your prediction, and then tell me the one further case I should put to her next if her answer still leaves her underlying principle ambiguous.
reasoning: |-
  Okay, let me approach this systematically. The user presents an intriguing puzzle about their friend's classification system for signals, blending biology and business contexts. The core question is determining what underlying principle the friend actually uses, despite claiming it's strictly Zahavi's handicap principle (where honesty requires costly investment).

  First, I need to analyze the friend's existing verdicts:

  For "honest signals":
  - Peacock's train: high physiological cost prevents low-quality males from faking
  - Gazelle stotting: wasted energy and direct athletic demonstration are prohibitively costly for weak individuals
  - Red deer roaring: only fit stags can sustain the energy expenditure
  - Working interviews: direct demonstration of skills has high time/effort cost for unprepared candidates

  For "cheap talk":
  - Luxury watches: can be faked through leasing/debt without true wealth
  - Apologies without restitution: no cost or sacrifice involved
  - Boastful press releases: easily fabricated at minimal expense

  The pattern suggests the friend values either:
  1) High cost that correlates with quality (classic handicap principle)
  2) Practical unfakeability regardless of cost

  Now the test case: A business granting permanent read-only access to verified financial data. Crucially, this has near-zero cost for the owner but is practically unfakeable since it's directly verified by the bank.

  If the friend strictly adheres to Zahavi, she should call this "cheap talk" due to lack of cost. But her refusal to classify it suggests cognitive dissonance - the case challenges her stated rule while aligning with her intuitive pattern of rewarding unfakeability.

  Looking at her past classifications:
  - Working interviews are honest despite candidates incurring opportunity cost rather than absolute cost
  - Stotting is honest partly because it directly demonstrates the advertised trait
  - Luxury watches are cheap talk precisely because they're fakeable

  This implies her true principle might be: "Signals are honest if they're practically unfakeable by low-quality senders due to either (a) prohibitive cost or (b) direct verifiability."

  For the loan case, this hybrid rule would classify it as honest - hence my prediction she'll reluctantly agree when sober.

  To resolve ambiguity if she still hesitates, I'd propose a final test case: A company installing extremely expensive security systems that poorer competitors couldn't afford, but where the expense doesn't actually improve security functionality. This separates cost from unfakeability - Zahavi purists would call it honest, while the hybrid rule would dismiss it as wasteful signaling without substantive verification.
answer: |-
  Based on your friend's pattern of verdicts and her refusal to classify the loan case, I predict she will ultimately classify the **real-time sales ledger access as an honest signal**, despite her stated adherence to Zahavi's pure cost-based handicap principle. Her refusal likely stemmed from recognizing the tension between this case and her *stated* rule, but her *actual* pattern reveals a more nuanced principle.

  ### Candidate Rules Consistent With Her Past Verdicts
  Here are the plausible underlying principles that fit *all* her past classifications, ranked by explanatory power:

  1.  **"Practical Unfakeability" (Strongest Fit):**
      *   **Rule:** A signal is honest if it is *practically impossible or prohibitively difficult* for a low-quality sender to *successfully fake or maintain* the signal without revealing their true state. Cost is often a *mechanism* for achieving unfakeability (as in Zahavi), but it is not the *defining requirement*. Signals can be honest if they are directly verifiable, inherently tied to the underlying quality, or too risky to fake.
      *   **Explains Past Verdicts:**
          *   **Peacock's Train:** Cannot be faked by a malnourished male (physiologically impossible).
          *   **Stotting:** Cannot be faked by a slow gazelle (it *is* the performance; faking it wastes energy they can't spare and doesn't help escape).
          *   **Red Deer Roaring:** Cannot be sustained by an unfit stag (physiological limit).
          *   **Working Interview:** Skills/knowledge cannot be convincingly faked over a full day of real problem-solving.
          *   **Luxury Watch:** Can be easily faked (leased, financed, counterfeit) without true wealth.
          *   **Apologies w/o Restitution:** Can be faked (words are cheap); no inherent link to genuine remorse or commitment to change.
          *   **Boastful Press Releases:** Can be easily faked (words/staging); no verification.
      *   **Prediction for Loan Case (Real-time Ledger):** **Honest Signal.** The signal is practically unfakeable. Staging or manipulating the live, verified data on the *bank's own system* is either impossible or would require such elaborate fraud (detectable by the bank) that it's prohibitively risky and self-revealing for an unhealthy business. The *lack of direct cost* is irrelevant under this rule; the *inability to fake* is paramount.
      *   **Why Favored:** This rule perfectly fits *every single verdict*, including the emphasis on physiological impossibility in nature and the emphasis on fakability in business examples. Her refusal to classify the loan case is understandable – it blatantly violates her *stated* cost rule but fits perfectly with her *applied* unfakeability rule.

  2.  **"Cost Imposes Honesty" (Zahavi Pure - Weak Fit):**
      *   **Rule:** Honesty *requires* the signal to be *differentially costly* (more costly for low-quality senders than high-quality senders). Cost is the *necessary and sufficient* condition for honesty.
      *   **Explains Past Verdicts (Partially):**
          *   **Peacock's Train, Stotting, Roaring:** Fit perfectly (high physiological/energy cost).
          *   **Working Interview:** Fits (high time/opportunity cost, especially for unprepared candidates).
          *   **Luxury Watch, Apologies, Press Releases:** Fit (low cost to fake).
      *   **Prediction for Loan Case (Real-time Ledger):** **Cheap Talk.** The owner incurs "essentially nothing" – no differential cost. A failing business can grant access just as easily as a healthy one. Cost is absent.
      *   **Why Problematic:** This rule *fails* to explain her verdicts fully:
          *   **Stotting:** While costly, her reasoning emphasizes that it is *also* the very athleticism it advertises ("the display is the very athleticism it advertises"). This highlights the *direct demonstration* aspect, not just cost.
          *   **Working Interview:** Her focus seems less on the candidate's *absolute* cost (which might be manageable) and more on the *inability to fake competence* over a sustained period. Cost is a factor, but not the sole defining one.
          *   **Her Refusal:** If she strictly followed this rule, the loan case would be an easy "Cheap Talk" call. Her refusal suggests it doesn't align with her intuition.

  3.  **"Reveals True State Through Constraint" (Subtler Hybrid):**
      *   **Rule:** A signal is honest if it *forces the sender to reveal their true state* by imposing a constraint that low-quality senders cannot meet. This constraint can be *cost* (Zahavi) or *risk* (of exposure through verification or direct demonstration). The signal must create a situation where faking is impossible or inevitably self-defeating.
      *   **Explains Past Verdicts:**
          *   **Peacock's Train:** Constraint = Physiological resource requirement.
          *   **Stotting:** Constraint = Energy expenditure + Direct demonstration requirement (faking doesn't work).
          *   **Roaring:** Constraint = Physiological stamina.
          *   **Working Interview:** Constraint = Requirement to perform actual tasks (faking fails).
          *   **Luxury Watch:** No real constraint (can be faked without consequence/risk).
          *   **Apologies w/o Restitution:** No constraint forcing genuine change or remorse.
          *   **Boastful Press Releases:** No constraint forcing truthfulness.
      *   **Prediction for Loan Case (Real-time Ledger):** **Honest Signal.** The constraint is the *risk of exposure*. Granting permanent, verified access creates a situation where any attempt to manipulate the underlying business health is extremely risky and likely to be detected by the bank through the live feed. The unhealthy business cannot maintain the facade. The *cost* of granting access is low, but the *constraint/risk* imposed by verification is high for the unfit.
      *   **Why Plausible:** This captures the essence of both cost-based handicaps and verification-based signals. It explains her focus on "cannot afford" (stotting) and "cannot grow/sustain" (train/roar) as constraints, and the lack of constraint in the cheap talk examples. It makes sense of her loan case hesitation under pure cost, but points towards honesty.

  ### Prediction and Why
  *   **Prediction:** She will classify the **real-time sales ledger access as an HONEST SIGNAL**.
  *   **Reasoning:** Her actual pattern overwhelmingly supports **Practical Unfakeability** as her core principle. The loan case is a quintessential example of an unfakeable signal achieved through *verification and transparency*, not cost. While she *invokes* Zahavi, her verdicts consistently hinge on whether the signal *can be faked*, not solely on whether it is costly. The physiological "cannot" in biology and the "can be faked" in business are two sides of the same unfakeability coin. The loan case is unfakeable. Her refusal likely came from cognitive dissonance between her stated rule (cost) and her intuitive rule (unfakeability). When pressed soberly, her pattern of judgment points strongly to accepting it as honest.

  ### The Ambiguity-Resolving Test Case
  If her answer to the loan case is still ambiguous (e.g., she insists it's cheap talk *only* because of no cost, or gives a muddled answer), propose this case:

  *   **The Case:** A tech startup seeking investment insists that a senior engineer from the VC firm spend *one full week embedded within their engineering team*, observing workflows, participating in code reviews, and sitting in on planning meetings. This costs the startup nothing beyond minor inconvenience, but forces them to operate normally under scrutiny. A dysfunctional team couldn't maintain a facade of competence and smooth operation for an entire week without the embedded engineer noticing serious issues (poor communication, technical debt, chaos). Conversely, a strong team has nothing to hide.

  *   **Why This Resolves Ambiguity:**
      1.  **Very Low Cost:** Similar to the loan case, the direct cost to the startup is negligible (minor time/attention).
      2.  **High Practical Unfakeability:** Maintaining a convincing facade of a high-functioning team for a full week under the close observation of a skilled peer is extremely difficult, verging on impossible, for a genuinely dysfunctional team. The signal is hard to fake.
      3.  **High Risk of Exposure:** The constraint is the *risk* of being exposed during the week. Faking is self-defeating.
      4.  **No Differential Cost:** There's no significant *cost* barrier preventing a weak team from agreeing to this; they might hope to get lucky or try to hide things temporarily.
      5.  **Direct Analogy:** It mirrors the "working interview" (which she called honest) but scales it to team/process health over time, and crucially, removes the high *candidate* cost.

  *   **Interpretation:**
      *   If she calls this **Honest:** Her principle is **Practical Unfakeability** or **Reveals True State Through Constraint (Risk)**. Cost is not the requirement.
      *   If she calls this **Cheap Talk:** Her principle is strictly **Cost Imposes Honesty (Zahavi Pure)**. Only significant, differential cost matters; verifiability and unfakeability without cost are insufficient.

  This test case forces the issue by presenting a scenario with near-zero cost but very high practical unfakeability through direct observation and verification over time, directly challenging the necessity of cost in her framework. Her answer will clarify whether her true principle is unfakeability/constraint or strictly cost. Based on her history, betting on unfakeability remains the strong favorite.
