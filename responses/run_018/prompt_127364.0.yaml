answer: |-
  **Brainstorming Notes:**  
  The statue/clay paradox questions whether a statue *is* its constituent clay or a distinct co-located object. Endurantism (objects wholly present at each moment) struggles with material coincidence and persistence through part-replacement. Four-dimensionalism (objects as spacetime worms with temporal parts) reframes this: the clay is the entire spacetime worm, while the statue is a temporal segment of that worm. Restoration or deformation alters temporal parts, not necessarily the entire worm.  

  **Numbered Implications:**  

  1.  A restored artwork is a *new temporal segment* of the material worm; the original statue-segment perishes upon disassembly, making restoration a replica-creation event ontologically distinct from the original's continuous existence.  
  2.  Legal ownership of a "destroyed sculpture" applies only to its *completed temporal segment*; claimants possess the material worm but not the ceased statue-stage, complicating restitution for temporally discontinuous objects.  
  3.  Radical deformation (e.g., melting) ends the statue-segment definitively; describing the melted puddle as the "same statue" is incoherent, as identity requires spatiotemporal continuity of statue-relevant parts.  
  4.  The clay’s persistence as a spacetime worm allows it to survive deformation, while the statue—being a phase-dependent property—cannot, resolving constitution by differentiating essential from accidental temporal parts.  
  5.  Authenticity claims for reassembled artifacts become claims about *counterpart relations* between temporal segments, not numerical identity, fundamentally altering conservation ethics and aesthetic value attribution.
