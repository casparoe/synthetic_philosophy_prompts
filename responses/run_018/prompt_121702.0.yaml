answer: |-
  Here’s a focused desiderata list for theories of indicative conditionals aiming to avoid Lewisian triviality while preserving core probabilistic coherence. I’ve organized it by category, flagged tensions, and scored key theories against the core criteria. Your "revision-path independence" constraint is integrated.

  ---

  ### **I. Core Cases to Handle Correctly**
  1. **Adams-style pairs**:  
     Must assign distinct probabilities to conditionals with identical truth-conditional components but different probabilistic profiles.  
     *Example*: "If the die lands even, it lands 6" (P=1/3) vs. "If the die lands 6, it lands 6" (P=1) – both material conditionals are true if antecedent is false, but their assertability differs.  
     *Requirement*: Theory must reflect P(if A then C) ≈ P(C|A) in such cases.

  2. **False-antecedent conditionals**:  
     Must allow rational evaluation of conditionals with antecedents believed false.  
     *Example*: "If I had bet on Biden in 2020, I would have lost" (when I didn’t bet).  
     *Requirement*: Avoid collapsing to material conditional (which makes all such conditionals vacuously true).

  3. **Lottery-paradox conditionals**:  
     Must handle conditionals where P(A) is high but P(if A then ¬C) remains significant.  
     *Example*: "If I buy a lottery ticket, it won’t win" (P(win) ≈ 0, but P(if buy then ¬win) ≈ 1).  
     *Requirement*: Prevent P(if A then C) from being forced to 1 whenever P(A) is high.

  4. **Nested/embedded conditionals**:  
     *Example*: "If the match is wet, then if you strike it, it won’t light."  
     *Requirement*: Avoid triviality under embedding (Lewis’s result exploits this).

  ---

  ### **II. Key Distinctions to Preserve**
  1. **Conditional probability vs. probability of the conditional**:  
     Must not equate P(C|A) with P(A → C) universally (triviality result shows this is impossible for standard logics).  
     *Non-negotiable*: Theories must block this equivalence in non-trivial probability spaces.

  2. **Static belief vs. belief revision**:  
     - *Static*: Credences in conditionals given current beliefs.  
     - *Dynamic*: How beliefs in conditionals update when learning new evidence.  
     *Requirement*: Distinguish evaluating "if A then C" now vs. how we’d evaluate it after learning A.

  3. **Revision-path independence (your constraint)**:  
     Evaluating P(if A then C) must not depend on the sequence of belief revisions used to eliminate conflicts with A.  
     *Rationale*: Triviality arises when different revision paths yield different probabilities for the same conditional.

  ---

  ### **III. Formal Constraints**
  **Non-negotiable:**  
  - **Probabilistic coherence**: No Dutch books; credences must be extendable to a probability function.  
  - **Non-triviality**: Probabilities of conditionals must not be *always* 0 or 1 (Lewis’s result).  
  - **Material conditional for logical truths**: A → C must be true when A is false or C is true in classical logic cases (e.g., "If 2+2=5, then snow is white").  

  **Negotiable (theory-dependent):**  
  - **Modus ponens**: Full strength (A & (A → C) entails C) vs. restricted (e.g., only when A is possible).  
  - **Truth-aptness**: Whether conditionals have truth values.  
  - **Embeddability**: Whether conditionals can freely embed in Boolean compounds.  

  ---

  ### **IV. Impossibility Results & Tensions**
  - **Your hunch is correct**: The triad  
    (a) P(A → C) = P(C|A) for all A, C in all probability spaces,  
    (b) A → C is a proposition with a fixed truth value,  
    (c) Non-trivial probabilities,  
    **is jointly impossible** (Lewis 1976).  
  - **Revision-path independence vs. triviality**: If conditionals are propositions, revision-path dependence is inevitable under standard Bayesian revision (via imaging or conditioning), risking triviality.  

  ---

  ### **V. Theory Scoring (Core Criteria Only)**
  | **Criterion**               | **Stalnaker (1968)** | **Adams (1975)** | **Causal Models (e.g., Pearl)** |
  |-----------------------------|----------------------|------------------|--------------------------------|
  | **Adams pairs**             | ✗ Fails (P(A → C) ≠ P(C⎮A)) | ✓ Perfect fit   | Mixed (depends on model)       |
  | **False antecedents**       | ✓ Handles via "closest world" | ✓ No truth values | ✓ Via intervention             |
  | **Lottery conditionals**    | ✗ P(A→¬C) ≈ 0 when P(A)≈1 | ✓ P(if A then ¬C) ≈ 1 | ✓ Via causal structure         |
  | **P(C⎮A) vs. P(A→C)**       | ✗ Equated in triviality proofs | ✓ Distinguished  | ✓ Distinguished (P≠ truth cond.) |
  | **Revision-path independence** | ✗ Fails (depends on selection fn) | ✓ Preserved (no revision paths) | ✗ Fails (model-dependent) |
  | **Probabilistic coherence** | ✗ Trivial under embeddings | ✓ Preserved (no Boolean compounds) | ✓ Preserved (local to model) |
  | **Material logical truths** | ✓ Holds              | ✗ Rejected       | ✓ Holds                        |

  **Key Takeaways**:  
  - **Stalnaker** fails probabilistic coherence and revision-path independence.  
  - **Adams** sacrifices truth-values and embedding to preserve coherence and path-independence.  
  - **Causal models** handle false antecedents well but struggle with Adams pairs and path-independence.  

  **Your niche constraint (revision-path independence) is a litmus test**: Only non-propositional (e.g., Adams-like) or dynamic semantics (e.g., update semantics) satisfy it, as propositional theories require path-dependent imaging/conditioning.  

  **Open Challenge**: No extant theory satisfies *all* desiderata. The central tension remains: **probabilistic coherence + non-triviality + propositional truth-values + revision-path independence** is likely impossible. Your paper’s contribution may lie in formalizing this trade-off.
