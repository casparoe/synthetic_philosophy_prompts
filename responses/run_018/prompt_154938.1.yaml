prompt: |-
  You staff a municipal heritage office that must draft public plaque texts for monuments contested between groups with incompatible historical narratives — for instance, a colonial-era statue that one community honors as a founder and another condemns as an oppressor. You want a reusable decision procedure, grounded in Jain anekāntavāda — specifically the doctrines that reality is multi-faceted (anekāntavāda), that every statement expresses only one partial standpoint (naya), and that qualified assertion (syādvāda) should replace absolute affirmation or denial — to determine whether a draft plaque falsely absolutizes one narrative and, if not, how to frame it with appropriate standpoint qualifiers.

  Write the procedure as an ordered checklist your office can run in under an hour without philosophical training. Include: (1) initial classification tests distinguishing empirical disputes from evaluative framing disputes; (2) drafting rules requiring every interpretive claim to carry an explicit or implicit standpoint qualifier specifying whose naya it represents; (3) hard stop-points where the procedure rejects any draft containing unqualified hero/villain or singular-truth language, and escalation points where anekāntavāda provides no rule for ranking competing standpoints and the decision must go to a values-based board vote; (4) sentence-level test questions editors apply to flag hidden absolutism; and (5) explicit markers of irreducible judgment, such as deciding which standpoints receive equal textual space.

  Apply the procedure to three cases: (a) the colonial administrator statue, where historians dispute whether he suppressed a rebellion or maintained civil order; (b) an indigenous land-rights monument for which one group demands the phrase "stolen land" and another demands "shared territory"; and (c) one case where the procedure forces approval of a framing you personally reject, explaining precisely why anekāntavāda yields that result and identifying what the procedure cannot do — for example, it cannot assign moral weight to nayas, only prevent any single naya from being presented as exhaustive truth.

  Specify practical constraints: who signs off at each stage, what to do when primary sources conflict, and the required outputs — a qualified text, a rejection memo with the offending absolutism flagged, or an escalation form. Note where the procedure will misfire or remain silent.
reasoning: |-
  We are creating a decision procedure checklist grounded in Jain anekāntavāda for drafting public plaque texts that avoid absolutizing one historical narrative. The procedure must be usable in under an hour without philosophical training. It includes:

  1. Initial classification tests to distinguish empirical disputes (about facts) from evaluative framing disputes (about interpretation).
  2. Drafting rules requiring every interpretive claim to have an explicit or implicit standpoint qualifier (whose naya it represents).
  3. Hard stop-points: reject drafts with unqualified hero/villain language or singular-truth claims. Escalation points when anekāntavāda doesn't provide a rule for ranking standpoints (then go to board vote).
  4. Sentence-level test questions to flag hidden absolutism.
  5. Explicit markers of irreducible judgment (e.g., deciding which standpoints get equal space).

  Practical constraints: 
  - Who signs off: Heritage Officer (HO) at each stage; if escalation, then Board.
  - Primary sources conflict: Note the conflict and represent the conflicting viewpoints with qualifiers.
  - Outputs: Approved text (with qualifiers), Rejection memo (with absolutism flagged), or Escalation form (for board vote).

  Where the procedure might misfire or remain silent:
  - When there is a clear factual error (but note: even facts can be interpreted, so we focus on whether the claim is presented as absolute without acknowledging other perspectives).
  - When the number of standpoints is too large to represent: then we must select, which requires judgment (escalate to board?).

  Checklist Procedure:

  **Step 1: Initial Classification**
     - For each historical claim in the draft, classify as:
          (a) Empirical (e.g., dates, events that occurred, names) 
          (b) Evaluative (e.g., judgments about morality, significance, character)
     - If an empirical claim is disputed by credible sources (historians, primary sources), note it as "disputed fact" and require qualifiers for each viewpoint.
     - If an evaluative claim is made without acknowledging other possible evaluations, flag for revision.

  **Step 2: Drafting Rules**
     - Rule 1: Every evaluative claim must be preceded or followed by an explicit or implicit qualifier that indicates whose perspective it represents (e.g., "Some view...", "According to the colonial records...", "To the indigenous community...").
     - Rule 2: Avoid absolute terms (e.g., "hero", "villain", "always", "never") unless they are universally accepted (which is rare) and even then, consider if they are appropriate in a plural context.
     - Rule 3: Use syādvāda (qualified assertion) language: "from one standpoint", "in some respects", "arguably", etc.

  **Step 3: Hard Stop-Points and Escalation**
     - Hard Stop 1: If the draft contains any unqualified hero/villain language (e.g., "a great leader", "a cruel oppressor" without qualifiers), reject and flag.
     - Hard Stop 2: If the draft uses absolute truth language (e.g., "the truth is", "undeniably", "without question"), reject and flag.
     - Escalation Point: When two or more standpoints are equally valid (per anekāntavāda) but cannot be simultaneously represented due to space or clarity, escalate to the board for a values-based decision on which to include.

  **Step 4: Sentence-Level Test Questions**
     For each sentence in the draft, ask:
        - Q1: Does this sentence present a single perspective as the whole truth?
        - Q2: Is there an unqualified judgment (positive or negative) about a person/group?
        - Q3: Can I identify which group's naya this represents?
        - Q4: If it's an empirical claim, is it presented as uncontested when it is not?
     If any answer is "yes", flag the sentence for revision.

  **Step 5: Explicit Markers of Irreducible Judgment**
     - In the final text, ensure that:
          (a) The space given to different standpoints is explicitly noted as a choice (e.g., "This plaque presents two predominant viewpoints...").
          (b) The selection of which standpoints to include (when not all can be included) is acknowledged as a practical limitation and not a judgment on validity.

  **Final Approval Process**
     - HO runs the checklist. If no hard stops, the draft is conditionally approved for content but must pass the qualifier check.
     - If all flagged issues are resolved, HO approves.
     - If escalation is needed (e.g., at Step 3 Escalation Point), fill an Escalation Form and send to the Board.

  **Outputs:**
     - Approved Text: With qualifiers and without absolutism.
     - Rejection Memo: With specific sentences flagged and reasons (e.g., "unqualified hero language").
     - Escalation Form: When the procedure cannot resolve a conflict of standpoints without a values-based decision.

  ---

  **Application to Cases:**

  **Case (a): Colonial administrator statue**

  Draft example: "John Smith, the founder of our city, bravely suppressed the rebellion of 1857 and maintained civil order."

  Step 1: 
     - Empirical: There was a rebellion in 1857, John Smith was an administrator. But "suppressed" and "maintained civil order" are evaluative and disputed. Also, "founder" is contested (some may say the city existed before).

  Step 2: 
     - The draft uses "bravely" (hero language) without qualifier. "Founder" without qualifier.

  Step 3: Hard Stop 1: "bravely" is unqualified positive judgment -> reject.

  Revised draft attempt: 
     "John Smith (1800-1880) served as colonial administrator from 1845-1860. To the colonial government, he was a founder of the modern city and maintained civil order by suppressing the 1857 uprising. To indigenous communities, his actions represented oppression and the violent quelling of a struggle for rights."

  Step 4: 
     - Q1: The revised draft presents two viewpoints -> no.
     - Q2: The positive and negative judgments are qualified -> no.
     - Q3: We can identify the colonial government and indigenous communities -> yes.
     - Q4: The events are presented as contested -> yes, so it's okay.

  Step 5: We have two standpoints. We note that these are two predominant views.

  Output: Approved text.

  **Case (b): Indigenous land-rights monument**

  Draft from one group: "This land was stolen from the indigenous people."

  Draft from another: "This land is shared territory between indigenous and settler communities."

  Step 1: 
     - Both are evaluative. The first is from the indigenous standpoint, the second from a reconciliation standpoint.

  Step 2: 
     - The first draft uses "stolen" without qualifier -> violates Rule 2 (absolute term). Hard Stop 1: unqualified villain language (against the settlers) -> reject.

  Revised draft: 
     "The indigenous people of this area consider this land to have been taken without their consent. Other groups view the current arrangement as shared territory."

  But note: "taken without consent" is still a negative judgment without qualifier? We must attribute.

  Better: 
     "To the indigenous people, this land was stolen. To settlers, it represents shared territory."

  But now we have two standpoints. However, is the settler view presented as equally valid? That might be controversial. But anekāntavāda does not rank, so we present both without judgment.

  Step 4: 
     - Q1: Each part is qualified -> no absolutism.
     - Q2: The judgments are qualified by the group -> pass.

  Step 5: We present both views. We note that these are two predominant standpoints.

  Output: Approved text.

  **Case (c): Where the procedure forces approval of a framing you personally reject**

  Example: A monument for a controversial figure, say a military leader who is seen by one group as a defender of national unity and by another as a perpetrator of ethnic cleansing.

  Draft: 
     "General X (1930-2000) led military campaigns that some view as necessary for national unity and others condemn as ethnic cleansing."

  Step 1: Both claims are evaluative and disputed.

  Step 2: The draft uses qualifiers ("some view", "others condemn") -> pass.

  Step 3: No hard stops.

  Step 4: 
     - Q1: It does not present one as the whole truth -> pass.
     - Q2: The judgments are qualified -> pass.

  Step 5: We are presenting two standpoints. We have to give them equal space? The procedure does not require equal space but requires that the selection is acknowledged as a practical choice. However, if we present only these two, we must note that there are other views? But in the interest of space, we might only present the two dominant ones.

  Now, suppose we (personally) reject the "national unity" view as a cover for atrocities. But anekāntavāda requires that we present the view as a partial truth from its own standpoint. We cannot assign moral weight. The procedure forces approval because the draft meets the criteria.

  What the procedure cannot do:
     - It cannot decide which standpoint is morally superior.
     - It cannot exclude a standpoint that is held by a significant group (unless the board decides in escalation that it is not a valid perspective? But note: anekāntavāda says every perspective is partial and valid in its own context. So we must include unless the board overrules on other grounds, e.g., hate speech).

  In this case, the procedure would approve the draft. The rejection of the "national unity" view on moral grounds is beyond the scope of the procedure. The board might intervene at escalation if they decide that the "national unity" view is not a legitimate perspective (but that would be a values-based decision, not dictated by anekāntavāda).

  ---

  **Note on Misfires and Silence:**
     - Misfire: If a standpoint is held by a very small group but is included because the procedure requires inclusivity, it might give undue weight. The procedure doesn't specify how to measure significance. (Escalation to board to decide on which standpoints to include.)
     - Silence: The procedure does not address how to handle standpoints that are based on false empirical claims. We must rely on credible sources. If a group's narrative is based on disproven facts, we might not include it? But then we are making a judgment. This is a gap. We might have to note: "Some groups believe X, but historical evidence does not support X" — but that itself is a standpoint. So we must present the conflict of interpretation.

     We add: For empirical claims, if there is a consensus among historians, we can state that consensus with a qualifier that some groups hold a different view. But if there is no consensus, we present the conflict.

     Example: "Historians generally agree that the event occurred in 1857, though some community traditions place it earlier."

  But then we are privileging the historian's view. How to handle? We might have to use:

     "Historical records indicate the event occurred in 1857. Some community traditions, however, hold that similar events occurred earlier."

  This still privileges the written record. This is a limitation. The procedure would require that we present both, but the framing might still be biased.

  Therefore, we note: The procedure cannot resolve the inherent power imbalance in whose records are considered credible. It only prevents any single narrative from being presented as absolute.

  **Final Procedure Checklist (Ordered Steps):**

  1. **Classify Claims**: For each claim in the draft, mark as empirical or evaluative. If empirical and disputed by credible sources, note as disputed. If evaluative, note whose perspective it might represent (if not stated). 
     - Sign-off: HO
     - Output: Annotated draft

  2. **Apply Drafting Rules**: 
     - Rule 1: Add qualifiers to every evaluative claim (explicitly stating the group or perspective).
     - Rule 2: Replace absolute terms (hero/villain) with qualified language.
     - Rule 3: Use syādvāda language (e.g., "some argue", "from one perspective").
     - Sign-off: HO
     - Output: Revised draft

  3. **Check for Hard Stops**:
     - Hard Stop 1: If unqualified hero/villain language remains -> Reject (output: Rejection Memo).
     - Hard Stop 2: If absolute truth language remains -> Reject (Rejection Memo).
     - Escalation Point: If standpoints are equally valid but cannot be included without bias (e.g., space limitations) -> Escalate (Escalation Form).

  4. **Sentence-Level Tests**: 
     - Ask the four questions for each sentence. Flag any that fail.
     - If flags, revise until no flags, or if cannot revise, reject or escalate (if the issue is about which standpoints to include, then escalate).
     - Sign-off: HO

  5. **Explicit Markers of Judgment**:
     - Add a note in the text (if needed) that the selection of standpoints is a practical choice and not an endorsement.
     - Sign-off: HO

  6. **Final Approval**: 
     - If no rejections and no escalations, approve.
     - If escalation, wait for board decision.

  **Outputs**:
     - Approved Text
     - Rejection Memo (with specific flags)
     - Escalation Form (with explanation of the conflict and why it requires board input)
answer: |-
  ### Heritage Plaque Drafting Procedure: Anekāntavāda-Based Checklist  
  **Purpose**: Avoid absolutizing contested histories by applying Jain principles (multi-faceted reality, standpoint relativity, qualified assertions).  
  **Time Limit**: 45–60 minutes.  
  **Users**: Heritage officers (HOs) with no philosophy training.  
  **Outputs**: Approved text, rejection memo (with flagged absolutism), or escalation form (for board vote).  
  **Sign-offs**: HO conducts; unresolved conflicts → Board of Community Representatives (historians, ethicists, community leaders).  

  ---

  #### **Ordered Checklist**  
  **Step 1: Classify Claim Types**  
  - **Test each historical claim**:  
    - *Empirical dispute*: Conflicts over verifiable facts (e.g., "Did Event X occur in 1857?").  
      - *Action*: Cite sources. If primary sources conflict, note: "Sources disagree on [fact]."  
    - *Evaluative dispute*: Conflicts over moral/political framing (e.g., "Was Person Y a hero or oppressor?").  
      - *Action*: Proceed to Step 2.  
  - **Sign-off**: HO initials.  

  **Step 2: Apply Drafting Rules**  
  - **Rule 1**: Every interpretive claim **must** include an explicit/implicit standpoint qualifier (e.g., "Many settlers viewed...", "Indigenous accounts describe...").  
  - **Rule 2**: Replace absolute terms with *syādvāda* language:  
    - ❌ Banned: "hero," "villain," "undeniably," "always," "never," "the truth."  
    - ✅ Required: "Some argue...," "From [Group]’s perspective...," "Seen by [Group] as...".  
  - **Rule 3**: Empirical claims with consensus skip qualifiers (e.g., "Built in 1860").  

  **Step 3: Hard Stops & Escalation Points**  
  - **Hard Stop 1**: Reject if draft contains unqualified hero/villain labels or singular-truth claims → Output **rejection memo** with flagged text.  
  - **Hard Stop 2**: Reject if qualifiers are omitted for evaluative claims → **rejection memo**.  
  - **Escalation Point**: If standpoints are incompatible *and* anekāntavāda provides no basis to prioritize one (e.g., equally valid but opposing nayas) → Output **escalation form** for board vote.  

  **Step 4: Sentence-Level Tests for Hidden Absolutism**  
  For each sentence, ask:  
  1. *Does this imply a universal judgment?* (e.g., "He maintained order" → absolutizes colonial POV).  
  2. *Is a standpoint qualifier missing?* (e.g., "Stolen land" → add "To Indigenous peoples,").  
  3. *Does it dismiss alternative nayas?* (e.g., "Despite misguided claims..." → reject).  
  - **Action**: Revise or flag for escalation.  

  **Step 5: Mark Irreducible Judgments**  
  - Explicitly state when choices reflect practical limits (not truth):  
    - *Example*: "This plaque highlights two predominant standpoints. Space precludes all perspectives."  
  - **Board Vote Required For**:  
    - Selecting which standpoints receive space (e.g., 2 of 5 major nayas).  
    - Resolving conflicts where sources are equally credible but irreconcilable.  

  **Final Outputs**:  
  - ✅ **Approved text**: Qualifiers, no absolutism.  
  - ❌ **Rejection memo**: Specific flagged sections + reason.  
  - ⚠️ **Escalation form**: Standpoints in conflict + why HO cannot resolve.  

  ---

  ### **Case Applications**  
  #### **Case (a): Colonial Administrator Statue**  
  - **Draft**: "Governor Drake (1820–1890) founded our city and suppressed the 1857 rebellion to maintain civil order."  
  - **Procedure**:  
    1. **Step 1**: "Founded" (empirical, disputed); "suppressed rebellion" (evaluative); "maintained order" (evaluative).  
    2. **Step 2**: Violates Rule 2 (no qualifiers for evaluative claims).  
    3. **Step 3**: **Hard Stop 2** → Reject. Flag: "suppressed rebellion," "maintained order."  
  - **Revised Text**:  
    > "Governor Drake (1820–1890) administered the region during the 1857 uprising. **Colonial records** describe his actions as maintaining civil order. **Indigenous oral histories** recount it as suppressing resistance against land seizures."  
  - **Outcome**: Approved. Qualifiers frame competing nayas.  

  #### **Case (b): Indigenous Land-Rights Monument**  
  - **Draft 1**: "This land was stolen from Indigenous peoples."  
  - **Draft 2**: "This land is shared territory between settlers and tribes."  
  - **Procedure**:  
    1. **Step 1**: Both phrases are evaluative.  
    2. **Step 2**: Draft 1 violates Rule 1 (no qualifier); Draft 2 violates Rule 1.  
    3. **Step 3**: **Hard Stop 2** → Reject both.  
  - **Revised Text**:  
    > "**To the Lakota Sioux**, this land was taken without consent. **To some settler-descendant families**, it represents shared territory developed over generations."  
  - **Step 5**: Board votes to include both standpoints (irreducible judgment).  
  - **Outcome**: Approved.  

  #### **Case (c): Procedure Forces Approval of a Rejected Framing**  
  - **Context**: A WWII monument where one group calls a general a "war hero," and another calls him a "war criminal" for civilian bombings.  
  - **Draft**:  
    > "General Kuroda (1890–1960) saved the nation through strategic bombing. Critics condemn his methods."  
  - **Procedure**:  
    1. **Step 1**: "Saved the nation" (evaluative); "strategic bombing" (empirical); "condemn" (evaluative).  
    2. **Step 2**: Qualifiers ("critics") used; no banned terms.  
    3. **Step 4**: Passes tests (no hidden absolutism).  
  - **Approved Text**:  
    > "**To his military peers**, General Kuroda (1890–1960) saved the nation through strategic bombing. **To survivors of the bombings**, his actions constituted indiscriminate violence."  
  - **Why Anekāntavāda Demands Approval**:  
    - The draft uses explicit standpoint qualifiers ("To his military peers," "To survivors").  
    - It avoids absolutizing either narrative, presenting both as partial truths (nayas).  
  - **What the Procedure Cannot Do**:  
    - It **cannot** assign moral weight (e.g., "survivors’ view is more valid").  
    - It **cannot** resolve which perspective "deserves" more space; this is an irreducible judgment (Step 5) left to the board.  

  ---

  ### **Practical Constraints & Limitations**  
  - **Who Signs Off**: HO runs checklist; board resolves escalations.  
  - **Conflicting Primary Sources**: Cite disagreement (e.g., "Diaries from settlers describe X; tribal records state Y").  
  - **Misfires/Silences**:  
    - **Misfire**: If a standpoint is hate speech (e.g., racist claims), the procedure lacks ethical override → HO must escalate.  
    - **Silence**: Cannot adjudicate empirical disputes without sources → HO consults historians.  
    - **Bias Risk**: Selecting standpoints for inclusion (Step 5) may privilege majority views → Board must reflect community diversity.  
  - **Time Saver**: Use templates:  
    > "While [Group A] views this as [Perspective X], [Group B] interprets it as [Perspective Y]."  

  **Final Note**: This procedure ensures no single naya monopolizes truth, but it *does not* reconcile justice claims. It is a tool for pluralism, not restorative justice.
