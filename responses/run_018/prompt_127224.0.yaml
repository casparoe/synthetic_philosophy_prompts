  I retired after three decades in experimental condensed-matter physics and have spent the last few years reading philosophy of science without the structure of a formal course, and I keep encountering the concept of heritability in discussions of behavioral genetics in ways that seem to violate basic statistical reasoning. I understand that narrow-sense heritability is defined as the ratio of additive genetic variance to total phenotypic variance within a specific population and environment, that broad-sense heritability incorporates dominance and epistatic effects, and that neither figure represents the proportion of an individual's trait that is genetically caused. I also understand that heritability is not a property of a trait in isolation but of the trait within a particular distribution of environments, so that reducing environmental heterogeneity can actually increase heritability without any change in the underlying genetic architecture, and that in human populations gene-environment correlation—both passive and active—means that genetic and environmental variance components are not cleanly separable in the way standard decomposition assumes. Furthermore, I am aware that SNP-heritability estimated from genome-wide association studies captures only the additive variance tagged by common variants and is sensitive to linkage disequilibrium structure and population stratification, which implies that comparing such estimates across countries or socioeconomic strata involves hidden assumptions about environmental uniformity that rarely hold. Given all of this, please describe the most important implications for how a scientifically literate but non-specialist reader ought to interpret popular claims that intelligence, personality traits, or psychiatric conditions are, say, fifty percent heritable, especially when those claims are transported across different national or social contexts. Please write your response entirely in continuous prose—no headings, bullet points, boldface, tables, or any other structural formatting—exactly as one might write in a single long letter. Do not provide bibliographies, reading lists, or citations of specific works; I want the argument to stand on its own reasoning without any reference to particular papers by title.
