answer: |-
  Here is a systematic audit of the evolutionary debunking analogy, incorporating the calibration-tracking vs. ecological-attunement distinction:

  ### 1. Explicit Correspondence Table
  | **Gustatory Domain**          | **Moral Domain**                     | **Functional Role**                          |
  |-------------------------------|--------------------------------------|---------------------------------------------|
  | **Sweetness**                 | Moral wrongness/rightness (e.g., "killing is wrong") | *Putative objective property*               |
  | **Taste Receptor**            | Moral Faculty (e.g., emotion/intuition-driven judgment) | *Cognitive mechanism producing the experience* |
  | **Sugar**                     | Moral Facts (e.g., normative truths) | *Putative mind-independent feature*         |
  | **Evolutionary Pressure**     | Fitness advantages of cooperation/altruism | *Shaping force for the mechanism*           |
  | **Gustatory Realist**         | Moral Realist                        | *Defender of objectivity*                   |

  ### 2. Critical Disanalogies & Fracture Points
  **A. Sensory Transduction vs. Social Coordination**  
  - *Taste*: Direct chemical transduction (sugar molecules → neural signal). Clear causal chain to external property.  
  - *Morality*: No physical transduction. Mechanisms (e.g., empathy, norm internalization) solve *coordination problems* (e.g., reciprocal altruism). Suggests **ecological attunement** to social dynamics, not calibration to external moral properties.  

  **B. Explanatory Symmetry Breakdown**  
  - *Taste*: Evolutionary explanation *replaces* realism (sweetness = fitness signal, not intrinsic property).  
  - *Morality*: Evolutionary explanation *may be compatible* with realism if moral cognition tracks **stable cooperative facts** (e.g., "kin selection structures" are real features of social ecosystems). Fitness advantage derives *from* tracking these structures.  

  **C. Calibration vs. Attunement Relevance**  
  - *Calibration Irrelevant*: Disanalogies in mechanism (transduction vs. computation) don’t undermine debunking if both are projective.  
  - *Attunement Critical*: If moral cognition attunes to **objectively stable social facts** (e.g., "cheater-detection aligns with game-theoretic equilibria"), it may warrant a realist interpretation. Taste lacks this relational structure.  

  ### 3. Implicit Philosophical Imports  
  | **Side of Analogy** | **Quiet Import**                     | **Warranted?**                               |
  |----------------------|--------------------------------------|---------------------------------------------|
  | **Pro-Debunking**    | Values are *projected* (like taste)  | **Unwarranted**: Moral judgments may track relational facts (e.g., welfare violations) absent in taste. |
  | **Anti-Debunking**   | Values are *detected* (like vision)  | **Unwarranted**: No evidence of moral "perception"; social attunement ≠ direct detection. |

  ### 4. Conclusion Survival Assessment  
  The conclusion **does not survive** intact. The analogy fractures because:  
  - **Attunement undermines symmetry**: If moral cognition attunes to *mind-independent social structures* (e.g., cooperative equilibria), evolutionary origins don’t debunk realism—they *explain how we access* these structures. Taste lacks analogous external structures.  
  - **Explanatory asymmetry**: Evolutionary pressures for taste *explain away* objectivity; for morality, they *may explain how* we track objective social facts (e.g., "fairness" as a feature of rational cooperation).  
  - **Argumentative load**: The analogy smuggles in projective semantics ("all values are like tastes"). Once attunement is granted, moral facts could be as real as game-theoretic equilibria.  

  ### 5. Superior Analogies for Selective Debunking  
  If the analogy collapses, better comparisons are:  
  - **Dominance Hierarchy Detection**: Baboons attune to rank relations. Evolutionary origins don’t debunk the *reality* of ranks—they explain detection mechanisms. Relevant if moral facts are relational.  
  - **Alliance Tracking**: Cognitive systems evolved to map coalitions. The *existence* of alliances isn’t undermined by evolutionary explanation.  
  - **Pain Perception**: Hybrid model—neurobiological attunement to tissue damage (objectively bad) but intensity modulated by context. Moral wrongness could parallel "harm" as an objective disvalue.  

  **Final Verdict**: The taste analogy fails to prove that evolutionary debunking *must* undermine moral realism as cleanly as gustatory realism. Ecological attunement to objective social structures (e.g., cooperation norms) offers a defensible path for realists. A better framework asks: **Do the adaptive pressures select for *tracking mind-independent facts* or merely *fitness-enhancing fictions*?** For morality, attunement to cooperative realities suggests the former.
