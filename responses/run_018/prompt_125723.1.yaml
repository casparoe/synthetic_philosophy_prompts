  ### Competing Principles (if CHP Fails):
  If CHP is too permissive (e.g., you reject (4) being a set), two alternatives compete:

  1. **Stratified Definability Principle (SDP):**  
     - *Principle:* A collection is a set iff it is definable *without quantifying over the entire universe* (e.g., \(\Delta_0\)-formulas or predicative definitions).  
