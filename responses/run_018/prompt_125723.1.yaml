  2. **Size Limitation Principle (SLP):**  
     - *Principle:* A collection is a set iff it is not "too big" (e.g., no injection into the class of ordinals).  
     - *Motivation:* Directly addresses size-based paradoxes.  
     - *Verdicts:*  
