  Where is my reasoning weak? Assuming current GR is the final word. Quantum gravity might change things. Also, the underdetermination point: if two theories make the same predictions, choosing one is metaphysical. But maybe quantum gravity breaks that.

  The user wants honesty about what could change my mind. If quantum gravity requires a background, that would push towards substantivalism. Or if an experiment detects effects from global spacetime structure, like Mach's principle tests. But so far, no such evidence.

