  ## The Fractured Leviathan: *Moby-Dick* and the Tangled Nets of Collective Action

  *Moby-Dick* presents a profound case study for theories of collective intentionality, not by offering a clear resolution, but by dramatizing their tensions and exposing the murky space where shared action bleeds into coerced complicity. The Pequod’s voyage masterfully juxtaposes two faces of cooperation, forcing us to interrogate when a group truly acts *together* versus merely acting *alongside* one another under the shadow of a dominant will.

  The whaling scenes initially seem a textbook example of **shared cooperative activity**. Lowering boats, pulling oars in unison, harpooning, and managing the line represent a complex, interdependent ballet. Each sailor intends the *joint activity* of hunting whales – their individual efforts (rowing, harpooning, paying out line) are subordinated to, and constantly adjusted for, this shared goal. They mesh their plans, support each other instinctively, and embody the "we" of the hunt. This functional cooperation thrives precisely because the goal – procuring whale oil – is genuinely shared, the collective "intention-in-action" motivating each participant.

  This harmonious picture shatters with Ahab. His quarter-deck ceremony, nailing the gold doubloon and forcing the harpooneers to swear vengeance on Moby Dick, becomes the crucible for testing **joint commitment**. Here, the philosophical question crystallizes: Does this ritual bind the crew into a "plural subject," committed to Ahab’s revenge as their own collective purpose? Ahab certainly acts *as if* it does, invoking a shared oath ("Death to Moby Dick!") and positioning himself as the embodiment of their collective will. The crew, swept up in the charisma and spectacle (and perhaps the rum), roar assent. Yet, Starbuck’s immediate, horrified protest – branding the quest as blasphemous madness – reveals a fundamental fracture. He *never* intends the joint activity Ahab imposes.

  This is where Melville’s fiction complicates the philosophy. Starbuck continues to serve. He performs his duties meticulously, ensuring the ship functions, the crew is managed, and the voyage *continues* towards Ahab’s goal. According to the **shared cooperative activity model**, Starbuck is an anomaly. He doesn't intend the joint activity (killing Moby Dick for revenge). Yet, his actions are essential to its possibility. The **joint commitment model**, emphasizing the binding nature of public commitment regardless of private dissent, seems better equipped to explain his continued participation. The oath, the hierarchy, the social pressure of the crew's apparent unity – these seemingly forge a commitment that binds Starbuck *to the others*, making him complicit even in a project he abhors. He is trapped within the structure of the "single body" the Pequod has become under Ahab’s will.

  However, Melville resists letting either theory fully capture the reality. Does Starbuck’s compliance signify genuine, albeit coerced, membership in the plural subject? Or is he merely an "unwilling instrument," his skilled labor co-opted for Ahab’s individual project? The novel leans towards the latter, portraying Starbuck as a man internally fractured, haunted by his inability to break free. His solitary moment contemplating murder-suicide with the musket underscores his isolation and the *lack* of a true "we-intention" binding him to Ahab’s cause. The Pequod’s collective action towards Moby Dick is less an emergent "we" than an imposition of "I" – Ahab’s monomania parasitizing the structures of genuine cooperation.

  The novel’s climax delivers a devastating verdict on the nature of this collective. The final chase is a terrifying spectacle of coordinated action: boats are lowered, oars pull, harpoons fly, all directed towards the white whale. On the surface, it mirrors the earlier, functional whale hunts. Yet, the organizing principle is utterly different. The sailors act, driven by habit, fear, loyalty to mates, and the momentum of the ship’s culture, but the *goal* remains solely Ahab’s. The **irreducible we-intention** is absent; it decomposes into I-intentions (to survive, to obey, to perform one's role) overshadowed by Ahab’s overwhelming singular purpose. The Pequod does not sink because it acts "as one body" in pursuit of a collective goal. It sinks because it has become a machine driven by one man’s obsession, its inherent capacity for genuine shared action perverted. The "wages of following" are collective annihilation, born of a failure to sustain a *truly* shared intention or to dissolve a toxic joint commitment.

  *Moby-Dick* thus adds a crucial, dark dimension to the philosophy of collective action. It reveals how easily the *structures* of cooperation (roles, routines, public commitments) can be hijacked to serve an individual’s private goal, creating the *appearance* of joint action without its essential shared intentional core. It dramatizes the profound moral weight of participation, showing how even dissenters like Starbuck become bound through inaction and the inertia of institutional roles. Melville suggests that a collective can be bound *without* genuine shared intention, not through a healthy joint commitment, but through the coercive force of charisma, hierarchy, and the suppression of dissent – a binding that ultimately leads not to collective flourishing, but to shared destruction. The Pequod’s fate warns that the line between a genuine "we" acting together and a collection of individuals enabling one man’s madness is perilously thin, and the consequences of mistaking the latter for the former can be catastrophic.
