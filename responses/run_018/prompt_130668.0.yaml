  Hmm... their patent law toolkit has clear parallels: PHOSITA is like the intentional stance applied to a hypothetical skilled person, claim construction resembles defining the "belief content" boundaries. But where it gets tricky is the "counterfactual beliefs about weights" and "epistemic humility" concepts they mentioned. 

  First, I need to map philosophy concepts to patent terms:
  - Belief attribution = claim construction of system behavior
