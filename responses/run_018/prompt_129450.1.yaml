  Here's an illustration of the conceptual tension, using a hypothetical case:

  **The Hypothetical Case: "The Benefactor's Smile"**

  *   **The Work:** A celebrated cycle of paintings, "The Benefactor's Smile," created decades ago. The paintings depict ostensibly benevolent figures (industrialists, philanthropists, community leaders) in grand, classical styles reminiscent of aristocratic portraiture. However, the depictions are subtly unsettling. The figures' smiles are unnervingly fixed, their eyes hold a cold calculation, and the opulent backgrounds contain barely perceptible, distorted reflections suggesting hidden suffering or exploitation. The work was hailed as a masterpiece of **ironic detachment** and **transgressive framing**. Critics praised its brilliant subversion: using the visual language of power and virtue to expose the hollowness, hypocrisy, and potential cruelty lurking beneath societal notions of benevolence and authority. Its artistic force lay precisely in this complex, critical gaze – a seemingly profound unmasking of moral corruption inherent in power structures.
  *   **The Initial Reception & Canonization:** "The Benefactor's Smile" was lauded for its formal mastery (composition, technique, use of light/symbolism) and its powerful, critical aesthetic logic. It became canonical, studied for its sophisticated critique of power and its innovative use of traditional forms for subversive ends. Appreciation was based entirely on the *work itself* and its perceived message.
  *   **The Delayed Revelation:** Decades later, sealed personal archives and testimonies reveal the artist was not merely a *critic* of corrupt power but an active, enthusiastic participant. They were a key enabler in a vast, clandestine system of exploitation directly mirroring the themes in the paintings – leveraging their own public image as a cultured "benefactor" to conceal deeply predatory personal and financial practices. The cold calculation in the painted eyes wasn't just artistic observation; it was a reflection of the artist's own worldview and lived malice. The "ironic detachment" was less a critical stance and more a manifestation of the artist's genuine lack of empathy and moral compass. The transgressive framing wasn't just an artistic strategy; it was an aestheticization of their own corrupt reality.

  **The Resulting Tension & Troubles:**

  1.  **Trouble for Autonomism (Formal Properties Alone Determine Value):**
      *   **The Source Problem:** Autonomism insists the artwork's value resides *only* within its formal properties and internal logic, separate from creator intent or biography. However, in this case, the work's most celebrated formal properties – its unsettling irony, its critical gaze, its transgressive subversion – are now revealed to be *direct aesthetic manifestations* of the artist's *genuine moral corruption*. The "critical distance" praised by formalists wasn't distance at all; it was the artist's authentic emotional reality. The work's power *derives* from the very vice autonomism seeks to exclude.
      *   **The Hermeneutic Challenge:** Can the formal properties (the cold smile, the calculating eyes, the hidden suffering in the background) truly be appreciated "purely formally" once their origin in the artist's actual malice is known? Doesn't this biographical knowledge fundamentally alter the *meaning* generated by those formal elements? The irony shifts from being a tool of social critique to potentially being an expression of cynical self-recognition or even sadistic pleasure. The autonomist claim struggles because the formal properties themselves are now imbued with a disturbing biographical resonance that seems inseparable from their aesthetic effect.

  2.  **Trouble for Ethical Moralism (Knowledge of Vice Necessarily Diminishes Appreciation):**
      *   **The Paradox of Power Source:** Moralism argues that knowing an artist is morally corrupt should necessarily lessen the work's value or our ability to appreciate it. However, in this case, the *source* of the work's unique, canonized power *is* the artist's moral corruption. Diminishing appreciation because of the revealed vice risks negating the very thing that made the work artistically potent and critically insightful in the first place. The work's force *came* from reflecting that corruption, even if its origin was misunderstood initially.
      *   **The Hypocrisy Trap:** If moralists argue we must reject the work because the artist was corrupt, they face the awkward reality that the work itself offers a seemingly powerful *critique* of the exact kind of corruption the artist embodied. Condemning the work because of the artist's actions might feel like rejecting a valid critique simply because the critic is a hypocrite. Does the hypocrisy invalidate the critique's truth or power within the artwork's own logic?
      *   **The Retroactive Contamination Dilemma:** Moralism struggles with the *timing*. The work was *already* deeply appreciated and canonized based on its internal merits *before* the corruption was known. Does this prior, "pure" appreciation become invalidated? Does the new knowledge erase the authentic aesthetic experience people had for decades? Moralism risks asserting that the work's value was always inherently flawed, even when no one could have known, which feels counterintuitive to the historical reality of its reception.

  **The Core Trouble:**

  This scenario creates a **hermeneutic and evaluative paradox**:

  *   The **artistic value** demonstrably arose from qualities intrinsically linked to the artist's **moral vice**.
  *   This link was **essential** to the work's power but was **invisible** during its initial reception and canonization.
  *   Discovering the link **challenges the autonomy** of the formal properties (they weren't just "formal," they were expressive of real corruption).
  *   Yet, condemning the work based on this link **ignores the authentic aesthetic achievement** rooted in that very corruption and risks invalidating the pre-discovery critical consensus.

  Neither pure autonomism nor pure moralism can comfortably resolve this. Autonomism cannot easily dismiss the profound way the biography illuminates and potentially reconfigures the *meaning* of the formal elements. Moralism cannot easily dismiss the pre-existing aesthetic power or explain how condemning the work deals with the fact that its power *came* from the vice it now condemns. The tension lies in the artwork being a genuine aesthetic achievement *because of* its direct, albeit initially obscured, connection to the creator's moral failing.
