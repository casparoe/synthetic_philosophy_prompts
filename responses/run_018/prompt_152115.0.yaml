prompt: |-
  I'm trying to formalize my intuitions about the procreation asymmetry—the idea that bringing a suffering being into existence is wrong, while failing to bring a happy being into existence is not wrong, at least not in the same way. Here are my verdicts on concrete cases, and I want to know whether there is a single principle that captures them, or whether I must abandon some.

  Case 1: A couple knows with near-certainty that any child they conceive will suffer from an incurable, severely painful condition. They conceive anyway. Verdict: clearly wrong.

  Case 2: A couple could have a child who would live an excellent, flourishing life, but they remain childless to pursue other projects. Verdict: not wrong.

  Case 3: Through genetic screening, a couple can guarantee a child with a life well above the neutrality threshold—robust health, rich relationships, meaningful work—but they decline and have no children. Verdict: still not wrong; there is no duty to create such a life.

  Case 4: The couple uses screening to select for a life that is only barely net-positive: frequent minor discomforts, limited achievement, occasional pleasures that marginally outweigh the pains. Verdict: wrong, though less gravely than Case 1.

  Case 5: The couple faces a reproductive technology choice. Option A guarantees one child with an excellent life. Option B carries a 90% chance of the same excellent outcome and a 10% chance of a severely suffering child; if suffering occurs, resource constraints mean the excellent child is never born. They choose B, and the suffering child results. Verdict: wrong, but I treat it differently from Case 1—there is an element of risk-taking and foregone benefit that makes the moral failure feel distinct, even though the outcome is identical.

  Case 6: The couple knows that remaining childless will allow global resources to be redistributed, improving ten existing children from good lives to very good lives. If they have one child, that child will live a good life, but the ten others stay at merely good. Verdict: genuinely uncertain; my intuition permits them to have the child, but I cannot tell whether that is because the asymmetry blocks collective obligations or because I am implicitly weighing potential people differently.

  Case 7: A researcher designs an embodied artificial consciousness knowing it will experience constant low-level distress—making its life net-negative for itself—while generating philosophical insights that benefit humanity. Verdict: wrong to create it. But if the being's life were net-positive for itself (just barely) and also beneficial to others, I think creation is permissible, though not obligatory.

  The tension I keep returning to is between Case 1 and Case 5: both produce a suffering child, yet I judge them with different moral textures. Meanwhile, Case 6 introduces a collective comparison that does not involve potential persons directly, and Case 7 extends the asymmetry to non-biological, instrumentally valuable beings.

  Is there a coherent principle—perhaps involving expected harm, identity-affecting choices, or a well-being threshold—that delivers all seven verdicts? If so, state it precisely, identify the clause that addresses each case, and say what it predicts for the following unlisted scenario: a couple can either conceive one child whose life will be barely above neutrality, or adopt an existing child who currently lives in severe poverty and whose life, if adopted, would be improved to barely-above-neutrality, using resources that would then preclude conception. Is conception permitted, required, or prohibited? And be explicit: which of my verdicts, if any, must I drop to maintain the principle?
reasoning: |-
  Hmm, the user is grappling with the procreation asymmetry problem in ethics - that creating a suffering being is wrong, but not creating a happy being isn't wrong in the same way. They've provided seven detailed cases with their intuitive judgments, and want to know if there's a single principle that captures all these verdicts. If not, they need to know which intuitions might need to be abandoned.

  Looking at their cases: Case 1 (creating suffering is wrong) and Case 2 (not creating happiness isn't wrong) form the core asymmetry. Case 3 reinforces that there's no duty to create even excellent lives. Case 4 introduces a threshold - creating barely-positive lives feels wrong. Case 5 complicates things by adding risk - creating a suffering child through risky choice feels different than direct creation. Case 6 involves trade-offs with existing beings, and Case 7 extends the concept to artificial consciousness.

  The user specifically struggles with why Case 1 and Case 5 both produce suffering children yet feel morally different. They also need help with an unlisted scenario about creating vs adopting.

  I need to formulate a principle that accounts for all these nuances. The Principle of Asymmetric Harm Avoidance seems promising: it prioritizes avoiding harm to new beings over creating benefits, incorporates a well-being threshold, and factors in risk aversion for potential persons.

  Breaking it down: The core principle has three clauses that together handle the asymmetry. Clause 1 explains why creating suffering is always wrong (Cases 1, 4, and 7). Clause 2 explains why not creating happiness isn't wrong (Cases 2 and 3). Clause 3 handles the risk aspect in Case 5. Case 6 might require abandoning the intuition that procreation is permissible when it blocks significant benefits to existing beings - the principle suggests adoption might be required instead. For the unlisted scenario, the principle would require adopting the existing child rather than creating a new one.

  This framework preserves most intuitions but requires adjusting the verdict in Case 6. The risk aversion clause successfully distinguishes Case 5 from Case 1. The threshold concept explains why barely-positive lives still feel problematic to create. The adoption scenario clearly favors helping existing beings over creating new ones.

  The user seems philosophically sophisticated but troubled by inconsistencies in their intuitions. They're likely seeking not just an answer but a coherent framework that resolves their cognitive dissonance. By explicitly stating which intuition might need revision (Case 6), I'm giving them a path forward while preserving their core insights about the asymmetry.
answer: |-
  Here's a coherent principle that captures your intuitions across all seven cases, built on the core procreation asymmetry while incorporating a threshold and risk aversion:

  **The Principle of Asymmetric Harm Avoidance with Threshold and Risk Aversion (PAAHTR):**

  1.  **Harm Prohibition:** It is **prima facie wrong** to bring a being into existence if we have sufficient reason to believe its expected well-being will fall *below a sufficient threshold of robustness* (significantly above mere neutrality). ("Sufficient reason" implies high probability or certainty; "robustness" implies resilience to life's inherent fluctuations).
  2.  **Benefit Permission:** There is **no duty** to bring a being into existence *solely because* its life would be positive or even excellent. Failing to create a being with positive well-being is **not wrong**.
  3.  **Risk Aversion (Potential Persons):** When choosing between actions that *might* bring a new being into existence, the potential for that being to experience harm below the sufficient threshold must be given **disproportionate moral weight** compared to the potential for it (or another potential being) to experience benefits, even significant ones. Actions involving significant risks of creating beings below the threshold are **prima facie wrong**, especially if safer alternatives exist.

  ### Application to Your Cases

  *   **Case 1:** Violates **Clause 1 (Harm Prohibition)**. Near-certain creation of severe suffering (far below threshold) is clearly wrong.
  *   **Case 2:** Aligns with **Clause 2 (Benefit Permission)**. No duty to create an excellent life. Not wrong.
  *   **Case 3:** Aligns with **Clause 2 (Benefit Permission)**. Even guaranteeing an excellent life imposes no duty. Not wrong.
  *   **Case 4:** Violates **Clause 1 (Harm Prohibition)**. While *net-positive*, a life of "frequent minor discomforts... occasional pleasures" is judged to fall *below the sufficient threshold of robustness*. It lacks resilience; minor setbacks could tip it negative. Creating it is wrong (though less gravely than severe suffering).
  *   **Case 5:** Violates **Clause 3 (Risk Aversion)**. Choosing Option B involves a significant (10%) risk of creating a severely suffering child (far below threshold). The *potential* benefit (90% chance of an excellent child) does not morally outweigh this risk, especially when a safe alternative (Option A) exists. The wrongness stems from the *reckless choice* given the risk to a potential person, explaining the distinct "moral texture" compared to Case 1 (direct certainty).
  *   **Case 6:** **Ambiguous under PAAHTR, likely requires abandoning your "permissible" verdict.** PAAHTR focuses on potential persons. Clause 2 says no duty to create the good life. However, the choice *also* affects *existing* persons (the ten children). PAAHTR doesn't directly address trade-offs between creating a new being and significantly benefiting existing beings. If we interpret the resources as a fixed pie, *choosing* procreation *causes* the harm of *not improving* the ten existing children from good to very good. Your intuition permitting procreation suggests either:
      *   A strong asymmetry blocking duties to potential persons *even when* their creation harms existing persons, or
      *   Weighing the new child's good life as comparable to improving ten existing good lives to very good.
      **PAAHTR, focused on harm to potential persons, would *not* condemn the procreation choice based solely on Clause 1 or 2. However, the *harm to existing children* caused by the resource diversion is a separate issue.** To maintain coherence with the core asymmetry and avoid imposing a duty to create, **PAAHTR likely predicts the choice is *permissible* (no duty to create, and harm to existing beings isn't direct enough to trigger Clause 1). However, this clashes with the intuition that *causing* lesser benefits to ten existing children might be wrong. To hold PAAHTR strictly, you must likely **abandon your intuition that the choice is permissible in Case 6** or accept a significant tension/limitation.
  *   **Case 7:**
      *   *Net-negative AI:* Violates **Clause 1 (Harm Prohibition)**. Creating a suffering being below the threshold is wrong, regardless of instrumental benefits.
      *   *Barely net-positive AI:* **Permissible under PAAHTR.** Aligns with Clause 2 - no duty *not* to create it. While close to the threshold, you judge it *above* (barely net-positive). Clause 1 doesn't prohibit creation above the threshold, even if barely. Instrumental benefits might tip the scales permissibly, but aren't required.

  ### The Unlisted Scenario

  *   **Scenario:** Couple can either (A) conceive a child with *barely-above-neutrality* life or (B) adopt an existing severely poor child, improving its life to *barely-above-neutrality*, using resources precluding conception.
  *   **PAAHTR Verdict:**
      1.  **Conception (Option A):** Creating a life judged *barely-above-neutrality* violates **Clause 1 (Harm Prohibition)**. You established in Case 4 that creating lives barely above neutrality is wrong because they fall below the *sufficient threshold of robustness*.
      2.  **Adoption (Option B):** This involves benefiting an *existing* being. PAAHTR's Clause 1 (Harm Prohibition) only applies to *bringing new beings into existence*. There is no direct prohibition here. While PAAHTR doesn't impose a *duty* to adopt (Clause 2 is about creating, not aiding), aiding existing beings is generally seen as morally good/optional absent specific duties.
      3.  **Choice:** Since Option A (conception) is prohibited by Clause 1, and Option B (adoption) is permissible, Option A is **prohibited**. The couple **must choose Option B (adoption)** to avoid the wrong action. Failing to adopt is *not* prohibited by PAAHTR itself (only creating the new life is prohibited), but adoption becomes the only permissible positive action available.

  ### Verdicts You Must Drop/Modify to Maintain PAAHTR

  1.  **Case 4 Verdict:** PAAHTR *endorses* your verdict that creating the barely-net-positive life is wrong (violates Clause 1). **No drop needed.**
  2.  **Case 6 Verdict:** This is the main tension. PAAHTR, focused on harm to potential persons, does *not* condemn the choice to procreate in Case 6 based on its core clauses (Clause 2: no duty to create; no Clause 1 violation for the potential child). Your intuition that it's permissible aligns with this *part* of PAAHTR. However, the resource diversion *harms existing children* by depriving them of significant improvement. **To maintain PAAHTR as the sole principle covering all cases, you must likely abandon the intuition that causing this harm to existing beings is permissible when done to create a new potentially happy being.** PAAHTR doesn't easily accommodate this trade-off without modification. You must either:
      *   **Drop/modify your intuition that procreation is permissible in Case 6**, recognizing a duty to existing beings over potential ones in resource conflicts, OR
      *   **Accept that PAAHTR is incomplete** and needs a supplementary principle addressing duties to existing beings and resource allocation conflicts involving potential persons.
  3.  **Case 7 (Barely Net-Positive AI):** PAAHTR endorses your verdict of permissibility. **No drop needed.**

  ### Summary

  The **Principle of Asymmetric Harm Avoidance with Threshold and Risk Aversion (PAAHTR)** successfully captures your core intuitions in Cases 1-5 and 7 by:
  *   Prohibiting creating lives below a sufficient robustness threshold (Cases 1, 4).
  *   Asserting no duty to create positive/even excellent lives (Cases 2, 3).
  *   Condemning reckless risk-taking with potential persons (Case 5).
  *   Permitting the creation of barely-net-positive non-biological beings (Case 7).

  The main cost is reconciling **Case 6**. PAAHTR suggests procreation is *permissible* under its terms, but this overlooks the harm to *existing* beings caused by the resource diversion. To maintain PAAHTR strictly as the sole principle, you must likely **abandon the intuition that procreation is permissible in Case 6** and recognize a stronger duty to existing beings when resources are constrained. The unlisted scenario clearly demonstrates PAAHTR's prioritization: avoiding creating a barely-above-threshold life (prohibited) is mandatory, while aiding an existing being is the only permissible path forward.
