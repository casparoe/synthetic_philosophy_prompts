s relationship to dissent that was already inside their world. Write entirely in continuous prose: avoid headings, bullet points, bold text, tables, and any typographical breaks that would fragment the narrative flow. Begin with a brief conceptual framing that establishes the philosophical stakes, then move into the narrative, and maintain a tone appropriate for serious philosophical fiction rather than popular drama.
