prompt: |-
  I keep encountering a particular defense of larger populations that doesn't seem to fit the standard categories. The speaker says that with more people alive, we increase the chance that someone will produce a world-changing idea, a masterpiece, or an exceptional form of understanding—almost as if humanity were running a lottery where each life is a ticket and the prize is a rare, transformative achievement. They insist that this isn't just adding up happiness across lives, because the argument still works if many of the added lives are ordinary; what matters is that the pool is big enough to cover the tail end of human possibility. They also reject averaging, since they aren't claiming the exceptional people make up for mediocre ones—rather, they seem to treat unrealized potential as a loss in itself, like leaving seats empty in a theater that was built for a full audience. I don't know whether philosophers have named this specific hybrid: valuing population growth partly as a means of diversifying or "insuring" for rare high-value outcomes, and partly as a refusal to waste built-in human capacity. Is there a recognized term for it? How does it differ from total-utilitarian, average-utilitarian, and person-affecting frameworks, and where does it break down? Lead with your verdict—established concept or none—then explain the mapping and the edges. Answer in no more than 250 words; avoid naming specific texts or authors.
reasoning: |-
  Okay, the user is describing a specific population ethics argument that doesn't neatly fit into standard utilitarian frameworks. They're encountering a defense of larger populations based on increasing the probability of exceptional achievements - comparing humanity to a lottery where each life is a "ticket" for potential transformative contributions. 

  The user provides clear distinguishing features: it's not about aggregating happiness, doesn't require all added lives to be extraordinary, rejects averaging, and frames unrealized potential as intrinsic waste. They specifically ask if this hybrid view has a recognized name and how it differs from total utilitarianism, average utilitarianism, and person-affecting views.

  Hmm, this is interesting because while the lottery analogy feels familiar in tech/innovation circles, it's not a formally named position in academic philosophy. The core intuition combines: (1) statistical expectation value of rare high-impact outcomes (instrumental) and (2) anti-frustrationism about human potential (non-instrumental). 

  Total utilitarianism would care about net welfare sum, but this view cares about maximizing expected value of tail-end genius regardless of average welfare. Average utilitarianism is explicitly rejected. Person-affecting views struggle because the "losers" of the lottery (ordinary lives) aren't harmed by existing, but the defense treats their existence as necessary for the gamble. 

  Key breakdowns come from the premise itself: It assumes genius requires large populations (questionable historically), ignores whether the "theater" analogy justifies creating spectators for rare performers, and risks instrumentalizing ordinary lives. Also silent on distribution - what if larger populations increase existential risks? 

  The user seems philosophically sophisticated, parsing nuances well. Their frustration at the unnamed hybrid suggests they've engaged deeply. Probably an academic or autodidact in ethics. Beyond classification, they might want critique tools for this argument they encounter. The theatrical waste analogy is particularly ripe for examination - is unused potential inherently bad if no one exists to experience the lack?
answer: |-
  **Verdict: No established single term.** This view blends elements without fitting cleanly into named frameworks.

  **Mapping & Differences:**
  *   **Total Utilitarianism:** Values maximizing the *sum* of welfare. This view cares about maximizing the *expected value of rare, high-impact outcomes*, not summing welfare across individuals. Added lives need not increase net happiness.
  *   **Average Utilitarianism:** Explicitly rejected. The value isn't in raising the average quality of life via geniuses, but in realizing the potential for genius *itself*, even if averages fall.
  *   **Person-Affecting Views:** Focuses on harms/benefits to actual people. This view treats the *failure to realize potential genius* (from non-existent people) as an intrinsic loss, akin to a missed opportunity for humanity, regardless of whether specific individuals are harmed by not existing.

  **Key Elements & Breakdowns:**
  1.  **Instrumental "Insurance":** More people as tickets to increase the *probability* of rare, high-value outcomes (ideas, art). Breaks down if genius isn't purely probabilistic (e.g., requires specific nurturing) or if population growth *increases* existential risks faster than genius solutions.
  2.  **Non-Instrumental "Anti-Waste":** Treats the unrealized potential of human capacity as inherently bad, like an unused resource or empty seats. Breaks down by assuming "capacity" exists independently of actual people – it's unclear *for whom* this capacity is wasted if those potential people never exist. Why prioritize the "theater's" potential over the well-being of the spectators who *do* exist?
  3.  **Focus on Tails:** Values the extreme positive tail of human achievement distribution, regardless of the median or mean welfare. Risks instrumentalizing the majority of lives as merely necessary for producing the exceptional few.
