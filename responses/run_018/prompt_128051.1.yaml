  In Round2, the same, but the Assessors are revising.

  In Round3, the Assessors also decide on voting power.

  Debrief:

  1. Map Round1: Initial classification based on observed behavior.
  2. Round2: Reactive change - Subjects changed their behavior because of the category assignment (they had to follow the hidden rules, which affected how they did the task).
  3. Round3: Loop closure and asymmetric absorption - The Archivists, by recording selectively, might have only recorded behaviors that fit the existing categories (because they were looking for significance, and the existing categories framed what was significant). Thus, even if the Subjects were trying to break the category, those behaviors might not have been recorded. The Assessors then revised the categories based on a filtered record, and faced a choice: maintain and gain credits (and control the vote) or dissolve and lose the framework.

  We predict that in the first run, the Assessors in Round3 might panic and over-correct, or the Subjects might collude to behave in ways that break the categories, but the Archivists might not record it. Or the group might dissolve the system quickly to avoid complexity.

  The feature that cannot be reproduced: The slow sedimentation of categories into bureaucratic and legal structures. In one session, we see the filtering and the pressure to maintain, but not how categories become embedded in institutions over years, affecting funding, legal status, etc. The facilitator will mention this.

  Now, the exact rules:

  Materials:
  - Index cards for Archivists
  - Pens
  - Task materials for each round:
     - Round1: 20 sticks of spaghetti, 1 marshmallow, 1 yard of string, 1 yard of tape for each group of Subjects (but we have one group of 6, so one set per group? Or if multiple groups, but we have one group of 6 Subjects).
     - Round2: Budget task - a list of items with prices, a total budget, and a goal (e.g., plan a party with $100, items: pizza $15, drinks $10, etc.)
     - Round3: A logic puzzle (e.g., the "prisoner's hat" riddle or a murder mystery with clues) that requires group discussion.

  Hidden rules examples:

  For Round1, the Assessors create categories. Let's say they create two categories: "Leader" and "Follower". Then the hidden rules might be:

  - Leader: Must speak in the imperative mood (commands) during the task.
  - Follower: Must preface every sentence with "I think" or "I feel".

  In Round2, the Assessors might revise these categories. Perhaps they split Leader into "Assertive" and "Bossy", etc.

  The exact hidden rules will depend on the categories created. The instructor should prepare a few possible categories and hidden rules in advance to have on hand in case the Assessors create categories that are hard to assign rules to. Alternatively, the instructor can define the hidden rules based on the category names? But that might be biased.

  Better: The instructor has a list of possible hidden rules (constraints) that can be arbitrarily assigned to any category. For example:

  - Must use only your non-dominant hand.
  - Must stand while speaking.
  - Must count to three before speaking.
  - Must use a metaphor in every sentence.
  - Cannot use the word "I".
  - Must agree with the person who spoke before you.

  Then, when the Assessors announce the categories, the instructor assigns one or two hidden rules to each category randomly from the list. This ensures that the rules are not tailored and are arbitrary, like diagnostic criteria.

  The rules should be announced to the Subjects privately right before the task of the next round.

  Instructions to roles:

  To Archivists: "Your role is to observe the Subjects as they perform the task. Write down specific behaviors you observe on the index cards, one behavior per card. Focus on behaviors that seem significant for understanding how the group is performing the task or how individuals are contributing. You will hand these cards to the Assessors."

  To Assessors (Round1): "Your role is to review the behavior records provided by the Archivists and create a set of 2-3 categories that capture different approaches or styles in the task. Define each category with 2-3 criteria based on the behaviors. Then, assign each Subject to one category. Your goal is to create a useful framework for predicting future behavior."

  To Assessors (Round2): "You will receive behavior records from the Archivists. You are to revise the existing category system (which you will be given) based on these new records. You can change the criteria, merge categories, split categories, or create new ones. Assign each Subject to a category. Try to make the system as predictive as possible."

  To Assessors (Round3): "You will receive behavior records from the Archivists. You must decide whether to maintain and revise the existing category system or dissolve it and create a new one from scratch. If you maintain, you will also assign voting power to each category (e.g., Category A: 3 votes per person, Category B: 1 vote per person). This voting power will be used in the final vote for the case study. If you dissolve, the vote will be one vote per person. Consider the predictive utility of the existing system."

  To Subjects: "Your role is to complete the collaborative task as a group. In Rounds 2 and 3, you will be assigned to a category that comes with specific rules that you must follow during the task. The rules will be given to you right before the task starts."

  Timeline:

  - 0-5 min: Introduction to the activity, explanation of roles, and distribution of role assignments. No philosophical framing beyond "This is a simulation of classification systems."

  - Round1:
     - 5-15 min: Subjects do task1 (tower building). Archivists observe and record. Assessors wait.
     - 15-17 min: Archivists hand behavior cards to instructor, who gives to Assessors.
     - 17-25 min: Assessors deliberate and create categories. They write them on the board and assign each Subject.
     - 25-27 min: Break? Or move to next.

  But we need to announce the hidden rules for the next round? That happens at the end of the round. After Assessors announce, the instructor reveals the hidden rules for each category to the Subjects privately (on slips of paper).

  So at 25 min: Assessors announce categories and assignments. Then instructor gives hidden rules to Subjects for Round2.

  Total for Round1: 20 minutes? We might need to adjust.

  Revised timeline:

  Total: 90 minutes

  - 0-5: Introduction

  Round1:
  - 5-15: Task1 (Subjects), Archivists record (during task)
  - 15-17: Archivists submit records to Assessors
  - 17-25: Assessors create categories and assign
  - 25-27: Assessors announce categories and assignments; instructor gives hidden rules for Round2 to Subjects (on paper)

  Round2:
  - 27-37: Task2 (Subjects under hidden rules), Archivists record
  - 37-39: Archivists submit records to Assessors
  - 39-47: Assessors revise categories and assign
  - 47-49: Announce and give hidden rules for Round3

  Round3:
  - 49-59: Task3 (Subjects under hidden rules), Archivists record
  - 59-61: Archivists submit records to Assessors
  - 61-69: Assessors decide: maintain or dissolve? If maintain, assign voting power per category.
  - 69-71: Announce decision and voting power (if maintained)

  - 71-75: Vote for the case study (using the voting power if maintained, else one vote per person). The instructor tallies.

  - 75-90: Debrief

  Debrief outline:

  1. (5 min) Ask participants to describe what happened in each round:
     - Round1: How were categories created? What behaviors were recorded?
     - Round2: How did the hidden rules affect behavior? Did the categories change? What behaviors were recorded?
     - Round3: What decision did the Assessors make? Why?

  2. (5 min) Draw out the looping effect: The categories in Round1 led to rules that changed behavior in Round2, which then was recorded and used to revise categories. In Round3, the Assessors faced inertia because the existing system was embedded in the rules and the recording.

  3. (5 min) Highlight asymmetric reflexivity: Ask the Archivists: What did you record? Did you record behaviors that didn't fit the existing categories? Why or why not? Point out that the structure of the recording (looking for significant behavior) likely amplified category-consistent behaviors and filtered out others.

  4. (5 min) Connect to the philosophical point: Classification systems are active mechanisms. They shape behavior and selectively absorb feedback, leading to epistemic inertia. Mention the sister's story as an example.

  5. (5 min) Explicitly state what the simulation could not capture: the slow sedimentation of categories into bureaucratic and legal structures over years, which makes them even harder to change.

  Prediction of what will go wrong:

  - Assessors in Round3 might over-correct and create a completely new system, not feeling the pressure to maintain, because the stakes are not high enough. Or they might maintain without revision, ignoring new evidence.

  - Subjects might collude to behave in ways that break the categories, but the Archivists might not record it because they are focusing on what fits.

  - The group might dissolve the system in Round3 to make the vote fair (one vote per person), thus avoiding the tension.

  The facilitator should be ready to prompt: "Remember, as Assessors, you have invested in this system and it has been used for two rounds. Dissolving it means losing a framework that has been predictive."

