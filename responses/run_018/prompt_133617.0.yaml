  Looking at Confucian role ethics, it emphasizes constitutive relationships where roles like parent-child or ruler-minister fundamentally shape identity and morality. Virtue (de) develops through reciprocal recognition in these roles. Anonymous actions seem problematic here since there's no relationship formation.

  But I think Confucian ethics can account for this without collapsing into universalism. The key lies in the concept of ren (humaneness) as both relational and inherent. Ren isn't a universal principle detached from roles; it's the wellspring that makes roles possible. Even in anonymous actions, the agent still embodies ren through cultivated dispositions from their existing roles.

  For example, a parent who anonymously saves a child isn't acting as that child's parent, but their parental cultivation enables recognizing humanity in strangers. The action extends relational patterns without forming new bonds. Ritual propriety (li) also matters - anonymity can be an expression of humility rather than relationship avoidance.

