answer: |-
  ## Villanelle of Unsettled Pages

  Somewhere in these pages a falsehood lives,
  Though every claim seems sound upon the ground.
  **This ticket will not win**; the chance it gives
  Is slight. I trace the words, the proof it gives,
  Each sentence built on logic, tightly bound.
  **Somewhere in these pages a falsehood lives.**

  I bought this slip; the long odds it achieves
  Make loss the certain outcome, safe and sound.
  **This ticket will not win**; the chance it gives
  Is almost gone. Yet something slips, forgives
  A tiny risk where errors might be found.
  **Somewhere in these pages a falsehood lives.**

  For every number drawn, despair arrives
  To mark the holders standing on sinking sand.
  **This ticket will not win**; the chance it gives
  Is null, I swear. Yet logic contradicts, contrives:
  One slip must hold the prize, a golden strand.
  **Somewhere in these pages a falsehood lives.**
  **This ticket will not win**; the chance it gives
  No harmony, just truths where tension stands.
