  We are going to create a joke that exploits the disagreement between the etiological account (Millikan) and the causal-role account (Cummins) in a specific case: a brand-new trait that appeared via a single mutation one generation ago and is useful only because of a recent environmental change (a new pollutant in the water and a tissue that sequesters it).

   The joke will be a two-hander (two characters) and under 150 words.

   The crux: The etiological account (selected-effects) says that without a history of selection, the trait has no function. The causal-role account says that if it currently contributes to a system's capacity (here, dealing with the pollutant), then it has a function.

   We want the punchline to turn on this disagreement without resorting to puns or generic nerd humor.

   The case: A fish (let's say) has a new mutation: a bit of tissue that sequesters a new industrial pollutant in the water. The pollutant appeared recently, so the trait has never been selected for. But now it's useful.

