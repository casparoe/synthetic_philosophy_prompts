   Character A (probably a causal-role proponent) points out the current usefulness: "This tissue is great! It sequesters the pollutant, so it must have the function of detoxifying."

   Character B (an etiological proponent) objects: "But it just appeared by mutation one generation ago! It hasn't been selected for, so it doesn't have a function."

   Punchline: Character A flips the script by pointing out that the etiological account would also have to deny a function to something else that is clearly functional? Or we can have Character B say something that highlights the absurdity of the causal-role account? But note: we don't want to settle by pluralism.

   Alternatively, we can have Character B say that the tissue doesn't have a function, and then Character A points out that by that logic, something else that we intuitively think has a function (but also hasn't been selected for) would also not have a function? But the case is new, so we don't have a counterexample that is established.

