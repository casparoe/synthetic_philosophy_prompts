prompt: |-
  After a long argument with a friend who insisted that Fomenko's New Chronology and ancient-astronaut narratives deserve the same evidential standing as mainstream historiography—simply because they invoke "methodological symmetry"—I need a practical tool rather than more debate. I work as an acquisitions editor for a general-reference encyclopedia, and I need a reusable decision procedure to evaluate submissions proposing radical chronological revision, whether through statistical textual analysis, technological-anachronism arguments, or claims of suppressed records. The procedure should be grounded in philosophy-of-science demarcation criteria, ask ordered questions, specify what counts as a sufficient answer to each, stop with a clear reject, accept-with-caveats, or escalate-to-expert, and flag precisely where the decision is one of values rather than facts. Apply it to three proposals: a Fomenko-style claim that the Almagest was compiled in the sixteenth century via statistical parallel-text analysis; an argument that megalithic construction precision proves extraterrestrial engineering; and a proposal to revise Bronze Age collapse chronology using new radiocarbon calibration curves, including one case where the procedure yields an answer the asker will dislike. Take a committed position: state definitively whether methodological symmetry—the idea that pseudohistorical claims should be evaluated by standards identical to mainstream ones—has any legitimate place in the decision tree, and defend that choice with reasons rather than options. Finally, include a brief note on where the procedure takes liberties with standard demarcation theory or relies on a contested reading of it.
reasoning: |-
  Okay, let me approach this systematically. The user is an encyclopedia editor facing practical challenges in evaluating radical historical revisions, not just theoretical debate. They need a clear decision tool that can handle submissions like Fomenko's chronology, ancient astronaut theories, and controversial radiocarbon recalibrations.

  First, I consider the core tension: methodological symmetry versus demarcation criteria. The friend's argument about equal evidential standing conflicts with established historiography. For an encyclopedia committed to reliability, symmetry can't be the starting point - that would grant legitimacy to claims lacking empirical foundations. The tool must prioritize testability and corrigibility.

  I sketch the decision tree's key phases:
  - Initial screening for verifiable evidence (rejecting unfalsifiable claims immediately)
  - Core evaluation of explanatory power and coherence
  - Values transparency about where judgments enter

  For Fomenko's Almagest claim, the key weaknesses are circular statistical methods and inability to explain contradictory evidence. The extraterrestrial engineering proposal fails at step one by offering untestable "explanations". The radiocarbon case is more nuanced - it passes initial screens but requires expert escalation due to calibration complexities.

  The values demarcation is crucial. Where evidence is genuinely contested (like the radiocarbon case), the procedure explicitly flags this as editorial judgment rather than factual deficiency. This maintains integrity while acknowledging legitimate scholarly debates.

  I reject methodological symmetry as a principle because it ignores the cumulative evidentiary weight of mainstream historiography. Pseudohistorical claims often exploit gaps rather than systematically addressing evidence. The procedure takes a modest liberty with demarcation theory by prioritizing practical falsifiability over abstract falsificationism - necessary for an editor's workflow.
answer: |-
  Here is a **Radical Chronology Revision Evaluation Procedure (R-CREP v1.0)** for your editorial use, grounded in scientific demarcation and designed for efficiency:

  ---

  ### **R-CREP v1.0 Decision Tree**
  *(Apply sequentially; stop at first definitive outcome)*

  1.  **FALSIFIABILITY SCREEN:**
      *   *Question:* Does the proposal make specific, testable claims that could be disproven by empirical evidence (e.g., archaeology, physics, dated manuscripts, astronomy)?
      *   *Sufficient Answer:* YES (specify testable claims) → Proceed to Step 2.
          NO (claims are unfalsifiable, rely on conspiracy, or dismiss counter-evidence as suppression) → **REJECT**.
      *   *Values Flag?* No. Falsifiability is a core scientific demarcation criterion (Popper).

  2.  **EXPLANATORY POWER & SCOPE:**
      *   *Question:* Does the proposed revision explain *all* relevant existing evidence *better* than the mainstream model? This includes:
          *   Resolving anomalies cited by the proponent.
          *   Explaining evidence *already well-explained* by mainstream model *without special pleading*.
          *   Predicting *novel* findings not predicted by mainstream model.
      *   *Sufficient Answer:* YES (provides specific, comprehensive mechanisms) → Proceed to Step 3.
          NO (ignores major evidence, creates more anomalies, relies on ad hoc assumptions) → **REJECT**.
      *   *Values Flag?* Minimally. Judgment of "better" involves weighing coherence/parsimony (shared scientific values).

  3.  **CORRIGIBILITY & METHODOLOGICAL ROBUSTNESS:**
      *   *Question:* Are the methods used transparent, replicable, and open to refinement based on new evidence? Does the proposal acknowledge its own potential weaknesses or limits?
      *   *Sufficient Answer:* YES (methods documented, results replicable, uncertainties acknowledged) → **ESCALATE-TO-EXPERT**.
          NO (methods opaque, results unreplicable, dismissive of counter-evidence/critique) → **REJECT**.
      *   *Values Flag?* Yes. Emphasis on transparency/replicability reflects values of scientific community.

  4.  **EXPERT ESCALATION REVIEW (Post-Step 3):**
      *   *Outcome:* Experts assess:
          *   Technical validity of methods/data.
          *   Strength of evidence relative to mainstream consensus.
          *   Significance of proposed revision.
      *   *Decision:*
          *   **ACCEPT-WITH-CAVEATS:** If novel, technically sound, challenges consensus but requires extraordinary evidence not yet met. (Caveats: highlight controversy, mainstream counter-evidence).
          *   **REJECT:** If experts find fundamental flaws, insufficient evidence, or failure on Steps 1-3 upon re-examination.
      *   *Values Flag?* Explicitly YES. Editorial judgment on significance, level of evidence required, and presentation balance (core encyclopedia values).

  ---

  ### **Application to Proposals**

  1.  **Fomenko-Style Almagest Redating (16th C. via Text Statistics):**
      *   **Step 1 (Falsifiability):** YES. Statistical methods *could* be tested on known parallel texts; star positions falsifiable via astronomy.
      *   **Step 2 (Explanatory Power):** **FAIL → REJECT.**
          *   *Why:* Fails catastrophically. Doesn't explain the *physical manuscript tradition* of the Almagest predating the 16th century by centuries. Doesn't explain corroborating references in *other* dated manuscripts. Doesn't explain the *specific astronomical data* matching the 2nd century AD (not 16th C.) without implausible ad hoc adjustments. Creates massive new anomalies (e.g., erasing centuries of documented history). Special pleading required to dismiss contrary evidence as "forgery/suppression".
      *   *Decision:* **REJECT** at Step 2. No need for escalation.

  2.  **Megalithic Precision = Extraterrestrial Engineering:**
      *   **Step 1 (Falsifiability):** **FAIL → REJECT.**
          *   *Why:* The core claim ("proves extraterrestrial engineering") is unfalsifiable. Any level of human ingenuity or lost technique can be dismissed as "impossible for humans," and the absence of ET artifacts is explained by "they left no trace/don't want to be found." Dismisses archaeological evidence of quarrying, transport experiments, and tool marks as irrelevant or misinterpreted. Relies on argument from personal incredulity ("I can't imagine how humans did this, therefore aliens").
      *   *Decision:* **REJECT** at Step 1.

  3.  **Bronze Age Collapse Revision via New Radiocarbon Calibration:**
      *   **Step 1 (Falsifiability):** YES. Radiocarbon dates and calibration curves are inherently testable/falsifiable.
      *   **Step 2 (Explanatory Power):** YES (Conditionally). Proposes resolving dating inconsistencies. Needs to address *all* evidence (e.g., pottery sequences, stratigraphy, dendrochronology, historical texts), not just C14 outliers. *May* create new anomalies if forcing revision where other lines of evidence strongly converge.
      *   **Step 3 (Corrigibility/Robustness):** YES → **ESCALATE-TO-EXPERT.** Radiocarbon methodology is standard, transparent, and calibrations are peer-reviewed. Proposal likely acknowledges uncertainties.
      *   **Expert Review:** **Likely ACCEPT-WITH-CAVEATS or REJECT (Case of Disliked Outcome):**
          *   *Scenario A (Accept w/Caveats):* If the calibration is sound *and* the proposed revision resolves genuine conflicts *and* experts find it plausible (even if contentious), present it as a significant new hypothesis with clear caveats about controversy and counter-evidence.
          *   *Scenario B (Reject - Disliked Outcome):* **If experts determine the *specific application* is flawed:** E.g., the *new calibration curve itself is contested* by most specialists; or the proponent *misapplies* it to sites where other dating methods (dendro, stratigraphy) overwhelmingly contradict the revised dates; or the revision creates more dating conflicts than it resolves. **REJECT** the *specific chronological revision proposal* based on expert assessment of its failure against the totality of evidence (Step 2), despite passing Steps 1 & 3. The core *method* (C14 calibration) remains valid, *this application* is faulty.

  ---

  ### **Commitment on Methodological Symmetry**

  **Methodological symmetry has NO legitimate place in the decision tree as a starting principle.** Here's why:

  1.  **Burden of Proof Asymmetry:** Mainstream historiography rests on a vast, interconnected, and multiply attested body of evidence (archaeology, texts, linguistics, dendrochronology, genetics, etc.) built over centuries with self-correcting mechanisms. Radical revisions *proposing to overturn this* inherently carry a much higher burden of proof. Granting symmetry *ignores this established epistemic foundation*.
  2.  **The Conspiracy Exemption:** Pseudohistorical claims (like Fomenko or ancient astronauts) routinely invoke the suppression of truth by academic elites to explain away counter-evidence. This is fundamentally *asymmetrical* – it makes the claim unfalsifiable (Step 1 failure) and violates corrigibility (Step 3). Mainstream scholarship, however flawed, *aims* for falsifiability and correction through peer review and new evidence.
  3.  **Parsimony & Ad Hoc Rescue:** Symmetry ignores how pseudohistorical theories rely on multiplying entities (aliens, global conspiracies, massive forgeries) and ad hoc hypotheses to salvage core claims from falsification, violating Step 2. Mainstream theories strive for parsimony.
  4.  **Purpose of the Encyclopedia:** As a general-reference work committed to reliability, your standard *must* be the current state of *credible, evidence-based scholarship*. Symmetry would force you to give equal platform to ideas demonstrably outside that realm, misrepresenting the actual state of knowledge and confusing readers.

  **Symmetry applies *only* in the narrow sense of *testing methods*:** If a radical proponent uses statistics, their method must be statistically sound (Step 3); if they use radiocarbon, they must follow the science. But the *interpretation* and *weight* of that evidence against the established corpus is inherently asymmetrical.

  ---

  ### **Liberties with Demarcation Theory**

  1.  **Pragmatic Focus on "Explanatory Power" (Step 2):** This step blends Lakatosian "progressive vs. degenerative research programmes" (addressing anomalies, predicting novelty) with a strong dose of Bayesian reasoning (weighing evidence against prior probability - the established model). It prioritizes practical editorial assessment ("does this *work* better?") over pure falsificationism. Strict Popperians might argue falsification (Step 1) is sufficient for rejection; R-CREP uses Step 2 to explicitly tackle the *inertia* of established theories and the *coherence* of the alternative.
  2.  **Emphasis on Transparency/Corrigibility (Step 3):** While crucial for science, placing this as a separate, mandatory step (especially linking it to acknowledging weaknesses) is a stronger editorial filter than some demarcation criteria. It explicitly targets common pseudohistorical tactics (opacity, dismissal of criticism).
  3.  **Editorial Values as Explicit Filter (Step 4/Outcomes):** Demarcation theories aim to separate science/non-science. R-CREP goes further, using that separation to make an *editorial judgment* about inclusion in a *reference work*. The "Accept w/Caveats" and "Escalate" steps formalize the values-based decision on how to handle *legitimate but radical challenges* within the encyclopedia's mission.

  This procedure provides a defensible, practical, and philosophically grounded tool to efficiently screen radical proposals while maintaining the integrity of your reference work. It explicitly rejects methodological symmetry as a foundational principle while demanding methodological rigor from challengers.
