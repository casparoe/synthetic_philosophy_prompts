  hey — i'm a novelist and next tuesday i'm running a workshop for writers and journalists who think they understand genocide but mostly don't. i want to teach Lemkin's actual concept — the part where it's not just bodies but destroying a group's culture, language, and social existence — and then move to the politics of naming atrocities, like why some mass killings get labeled genocide and others disappear into words like counterinsurgency or ethnic cleansing. don't explain it to me, plan the lesson: what order do i lay the pieces out so they don't collapse legal intent into moral outrage? what's the one carrying example — not Rwanda, not Auschwitz, something where the cultural destruction is visible and the body count isn't the whole story — and what must it include and exclude? i figure they'll show up thinking genocide is just the worst crime with a high death toll, and maybe that calling something genocide is just bureaucratic labeling. where in the seqeunce do i head each of those off? give me one check question at the end to see if they grasp the gap between the legal category and the political name, and tell me what lawyer-heavy detail i should just skip for writers. this is between chapters so forgive the rushed typing — there's probably a typo or two in here.
