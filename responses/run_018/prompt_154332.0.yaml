  The user asked for a carrying example that's not Rwanda or Auschwitz. I should pick one where cultural destruction is evident. The example needs to highlight cultural elements like language bans, forced assimilation, and the erasure of social structures. The Assyrian genocide fits here because it involved massacres, forced conversions, and suppression of Syriac language and church structures. It's less known, so it avoids preconceptions. 

