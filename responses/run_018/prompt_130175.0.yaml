answer: |-
  ### Joint Statement on Vagueness: Epistemicism vs. Supervaluationism  
  *Prepared by the Epistemicist Camp and the Supervaluationist Camp*  

  #### Part 1: Agreed Foundations  
  We concur on the following:  
  1. The sorites paradox reveals a genuine tension in ordinary reasoning about vague predicates (e.g., "tall," "bald"), exposing how intuitively plausible tolerance principles (e.g., "one grain cannot turn a non-heap into a heap") generate contradiction under iteration.  
  2. Classical bivalence holds for fully precise languages: every precise sentence is determinately true or false.  
  3. Vagueness is not reducible to ordinary speaker ignorance about an already-determined fact (e.g., ignorance of a hidden microscopic property).  
  4. Non-classical approaches that deny bivalence altogether—such as purely degree-theoretic (e.g., fuzzy logic) or contextualist resolutions—are inadequate. They fail to preserve key logical intuitions (e.g., the law of excluded middle) or explain higher-order vagueness.  
  5. The *Gradient Artifact*—an engineered entity with continuous variation in properties like metabolism and replication—is structurally analogous to standard sorites cases. In this case:  
     - Measurable properties (e.g., bio-mechanical integration) vary smoothly across the proposed boundary for "organism" vs. "artifact."  
     - Expert panels tasked with regulatory classification draw divergent boundaries despite full access to data.  
     - No natural discontinuity is detectable at any scale.  
     - Iterative re-annotation by experts does not converge to a stable cutoff.  
     Any adequate theory of vagueness must account for this phenomenon.  

  #### Part 2: Disagreements Table  
  | Issue                                                                 | Epistemicist Camp                                                                 | Supervaluationist Camp                                                                 |  
  |-----------------------------------------------------------------------|-----------------------------------------------------------------------------------|----------------------------------------------------------------------------------------|  
  | **Unique extension**                                                  | Every vague predicate (e.g., "tall") has a unique, precise extension fixed by meaning and context. | No unique precise extension exists; multiple precisifications are equally admissible. |  
  | **Borderline cases**                                                  | Involve pure *epistemic ignorance* of a hidden sharp boundary (e.g., a specific height threshold). | Involve genuine *indeterminacy*: no fact of the matter exists about truth or falsity. |  
  | **Classifier uncertainty**                                            | Calibrated uncertainty in classifiers (e.g., ML models) reflects cognitive limitations in tracking a hidden boundary. | Calibrated uncertainty reflects semantic openness; the predicate itself lacks a sharp boundary. |  
  | **Truth conditions**                                                  | Truth is bivalent and mind-independent; borderline sentences are unknowably true or false. | Truth is *supertruth*: a sentence is true iff true on all admissible precisifications. |  
  | **Second-order vagueness**                                            | The boundary between admissible and inadmissible precisifications is sharp (though unknowable). | The set of admissible precisifications is itself vague, with no sharp meta-boundary. |  
  | **Status of precisifications**                                        | Precisifications are heuristic tools; only one corresponds to reality.            | Precisifications are ontologically on par; no single "correct" cutoff exists.          |  

  #### Part 3: Cruxes  
  Both camps identify the following unresolved questions as pivotal. For each, we state the shared focal point and advance predictions.  

  1. **Does second-order vagueness undermine epistemicism?**  
     - **Focal Point**: The logical behavior of meta-boundaries (e.g., the distinction between admissible and inadmissible precisifications for "admissible").  
     - **Epistemicist Prediction**: If a formal system can demonstrate that meta-boundaries *must* be sharp to avoid infinite regress (e.g., via a fixed-point theorem), this favors epistemicism. *Concession*: Proof that no consistent sharp meta-boundary exists would weaken epistemicism.  
     - **Supervaluationist Prediction**: If higher-order vagueness can be modeled non-paradoxically without sharp meta-boundaries (e.g., through a continuous-valued admissibility function), this favors supervaluationism. *Concession*: Evidence that all meta-vagueness reduces to ignorance of sharp boundaries would weaken supervaluationism.  

  2. **Does the Gradient Artifact’s non-convergence support indeterminacy?**  
     - **Focal Point**: Iterated expert re-annotation of the Gradient Artifact under controlled conditions (e.g., 100 panels annotating the same continuum).  
     - **Epistemicist Prediction**: If non-convergence correlates with measurable cognitive limitations (e.g., inconsistent attention to features), this favors epistemicism. *Concession*: Proof that divergence persists even under ideal epistemic conditions (e.g., unlimited computational resources) would weaken epistemicism.  
     - **Supervaluationist Prediction**: If non-convergence is systematic and irreducibly plural (e.g., multiple boundaries are equally rationally defensible), this favors supervaluationism. *Concession*: Discovery of a stable, latent boundary (e.g., via a physical discontinuity) would weaken supervaluationism.  

  3. **Is "admissibility" covertly sharp?**  
     - **Focal Point**: Whether the supervaluationist’s "admissible precisifications" implicitly rely on a sharp boundary (e.g., in defining "meaning-preserving" precisifications).  
     - **Epistemicist Prediction**: If admissibility criteria can be shown to require sharp thresholds (e.g., in a formal semantics where vagueness vanishes at the meta-level), this favors epistemicism. *Concession*: A consistent model of "blurry" admissibility would weaken epistemicism.  
     - **Supervaluationist Prediction**: If admissibility can be grounded in a vague higher-order predicate without regress (e.g., via open-textured constraints like "naturalness"), this favors supervaluationism. *Concession*: Proof that all admissibility constraints are ultimately precise would weaken supervaluationism.  

  ---  
  This document reflects settled common ground and precise divergences. We submit that resolving these cruxes—through formal results, empirical study of cases like the Gradient Artifact, or refined models of admissibility—would advance the debate beyond stalemate. Neither camp asserts dominance; both acknowledge the other as a live, defensible alternative.
