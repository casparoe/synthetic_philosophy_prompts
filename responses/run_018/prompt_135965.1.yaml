  Based on your neighbor's past rulings, her underlying principle appears to be a blend of **Aristotelian-Scholastic economic ethics**, which emphasizes that exchange should be rooted in "just price" and natural use, and condemns practices like usury (interest on money) and profiteering from necessity. Her rulings consistently reflect two interlocking rules:

  1. **The Natural Growth Rule (Barren vs. Productive)**:  
     - Money (or money-like tokens) is "barren" and cannot fairly grow itself without being linked to tangible production or labor. Returns are only fair if they arise from natural, productive processes (e.g., a plow helping grow crops).  
     - Unfair if value increases without real-world production (e.g., lending coins for more coins).  

  2. **The Community Need Rule (Direct Use vs. Outside Profit)**:  
     - Exchange is fair when it addresses direct community needs through reciprocal, in-kind, or service-based transactions within the circle.  
     - Unfair if it exploits communal vulnerability (e.g., drought profiteering) or extracts value for outside profit, especially when monetized.  

  These rules work together but can split on edge cases like your proposals. Let's break down each proposal, predict her rulings, and design a future case to test which rule dominates.

  ---

  ### **Predictions for the New Proposals**
  **Proposal A: App where banked work hours grow 10% after six months, with no fees.**  
  - **Natural Growth Rule Prediction**: **Unfair**.  
    - Work hours in the app are "banked" like money—abstract tokens disconnected from active labor. Automatic 10% growth mimics interest ("barren" growth), similar to lending coins for more coins. No new production occurs during storage; the increase is artificial.  
    - *Past precedent*: Lending coins for more coins was ruled unfair.  

  - **Community Need Rule Prediction**: **Fair**.  
    - The app operates within the community, pooling labor to meet direct needs (like a time bank). The 10% growth incentivizes saving/patience without fees, potentially stabilizing the system. It resembles "shared risk" in a closed ecosystem, not exploitative.  
    - *Past precedent*: Direct swaps (e.g., bread for repairs) and in-kind returns (plow for harvest) were fair as community-focused.  

  **Your neighbor's likely verdict**: **Unfair**.  
