  ## China's One-China Policy & The Repugnant Conclusion: A Population Axiology Autopsy

  **1. The Mapping: Shrinking Heads, Bigger Slices? (250 words)**

  Population axiology grapples with valuing populations of different sizes and average welfare. China's one-child policy (OCP) offers a real-world lab. Let's define the players:

  *   **Population:** China's actual population trajectory (~1.4 billion today) vs. a counterfactual "business-as-usual" scenario (estimates vary wildly, say ~1.6-1.8 billion by 2015).
  *   **Welfare Metric:** The state's implicit metric was material prosperity – primarily GDP per capita and resource availability (food, water, jobs). Higher per-capita resources = higher welfare.
  *   **The Trade-off:** The OCP logic maps neatly onto **Critical-Level Utilitarianism (CLU)**. CLU says adding a life only increases total welfare *if* that life's welfare exceeds a critical level (k). Below k, lives are net negatives. China implicitly set k *above* the welfare level achievable in the counterfactual high-population scenario.

  Imagine two worlds:
  *   **World A (High Pop):** 1.7 billion people, average welfare = 50 (units arbitrary, low).
  *   **World B (OCP):** 1.4 billion people, average welfare = 70 (significantly higher).

  Total utilitarianism favours World A (1.7B * 50 = 85B utils > 1.4B * 70 = 98B utils? Wait, no: 85B vs 98B? Let's recalc. 1.7B * 50 = 85 Billion utils. 1.4B * 70 = 98 Billion utils. So total utilitarianism *still* favours the OCP world here? That undermines the point! **Mistake!**

  *Correction: Reverse the welfare levels to make the point clear:*
  *   **World A (High Pop):** 1.7 billion, average welfare = **30** (low due to resource strain). Total Util = 1.7B * 30 = **51B utils.**
  *   **World B (OCP):** 1.4 billion, average welfare = **50** (higher). Total Util = 1.4B * 50 = **70B utils.**

  China argued that without the OCP, World A's reality would see welfare plummet *below* a critical level k (say, 40) due to mass poverty. The OCP aimed for World B, where welfare (50) is *above* k. Even though World A has *more* people, their lives (at welfare 30 < k=40) are *not worth adding* under CLU. The state traded a *larger number of low-welfare lives* for a *smaller number of higher-welfare lives*, explicitly avoiding the repugnant conclusion of a vast, barely worthwhile population.

  **2. Where the Theory Goes Silent: The Gritty Reality (150 words)**

  Population axiology's neat equations turn blind eyes to crucial, messy human costs:

  *   **Coercion:** The theory doesn't care *how* the population size is achieved. The brutal enforcement (forced abortions, sterilizations, fines, social pressure) causing immense suffering is invisible in the welfare calculus. Reducing people to units in a sum is ethically fraught.
  *   **Gender Imbalance:** Son preference + birth limits = skewed sex ratios (millions of "missing girls"). The long-term social instability and suffering for men unable to find partners? Not in the GDP/per capita metric.
  *   **Demographic Timebomb:** Rapid ageing, shrinking workforce, unsustainable pension systems – consequences deferred beyond the policy's timeframe, invisible to the initial CLU calculation focusing on immediate resource strain.
  *   **Regional Variation & Loopholes:** Rural exceptions, ethnic minority exemptions, and urban elites buying extra births create inequalities the "national average welfare" utterly obscures.

  Axiology sees aggregates; reality involves individual trauma and systemic injustice.

  **3. The Verdict: Complicates, Undermines, Dodges? (150 words)**

  The OCP *seems* to dodge the repugnant conclusion: China avoided a potentially vast, poorer population (World A) for a smaller, richer one (World B), fitting CLU. But the relaxation phase (2013/2015) throws a spanner in the works for CLU defenders.

  If k was set correctly to justify the OCP in 1979-2010, why relax it? Did k suddenly drop? Did the welfare of an *additional* child magically jump above k? Probably not. This suggests the "critical level" was always arbitrary or contingent, undermining CLU's claim to offer a stable, principled solution. The policy shift creates a **smooth-continuum problem** – if 2 children are okay in 2015, why wasn't 1.5 okay earlier? Where's the precise k?

  Applying the **non-identity problem** to the specific "unborn millions" doesn't fully save it. True, those specific people don't exist to be harmed. But was *their potential existence at welfare < k* a net negative justifying prevention? CLU says yes. However, this relies on the *impersonal* negative value of lives below k. If you demand a *person-affecting* reason (harming actual people), the justification collapses – the policy prevented specific people from existing who *might* have had lives worth living, even if below k. It smuggles in an impersonal view disguised as avoiding harm, but the harm is only defined impersonally. The OCP ultimately *complicates* the repugnant conclusion by showing how CLU *can* be used to justify drastic measures, but exposes its arbitrariness and its blindness to the harsh realities of implementation and shifting demographics.
