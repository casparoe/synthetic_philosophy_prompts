prompt: |-
  Here are my gut calls on wrong-kind reasons, and I'm trying to see if they hang together into one prinicple or if I'm just all over the place.

  Case one: a researcher gets a big cash bonus if she publishes a shaky result, and she ends up half-believing its true. That feels like the wrong kind of reason to hold the belief - like the belief is corrupted even if it happens to be correct.

  Case two: a surgeon only learns a hard technique because a blackmailer forced him to study, but now he's genuinely skilled and saves lives. I still think he knows how to do the surgery, but there's something off about his having that skill - the reason he aquired it doesn't seem to touch the skill itself, yet maybe taints his right to practice? I'm genuinely unsure on this one.

  Case three: my friend intends to call his mom every sunday because he calculated it'll maximize his longterm wellbeing. That feels like the wrong kind of reason for the intention - he should call because he cares, not because of a utility calc.

  Case four: a painter refuses to learn formal color theory because she thinks knowing the rules will ruin her intuitive feel. That seems like a right-kind reason to avoid knowing that, even though its a reason against acquiring propositional knowledge.

  Case five: someone believes in God mainly because they're terrified of death and want comfort. I think that's wrong-kind for belief, but excusable since belief isn't voluntary. Case six: a chef decides a dish is delicious because a critic she admires said so, not because she actually tastes it. That feels wrong-kind for her aesthetic judgement.

  So is there one account - maybe about whether the reason respects the internal aim of the attitude - that gets all six? Or do I have to drop one? Also, what would it say about someone who refuses to learn a language because speaking it fluently would make them think in ways they dislike?

  Please also say which of my verdicts is the weakest and what the principle predicts for a case I haven't listed.
reasoning: |-
  Okay, the user is trying to find a unifying principle for their gut feelings about "wrong-kind reasons" across different cases. They've provided six scenarios involving beliefs, skills, intentions, knowledge avoidance, faith, and aesthetic judgment. Each has a reason that feels "off" to them despite leading to a correct outcome. 

  Hmm, let me first notice the pattern across all cases. The common thread seems to be that the reasons given bypass the attitude's proper justificatory grounds. Like in case one, the researcher's financial incentive replaces proper epistemic justification for belief. Case three replaces caring about one's mother with cold utility calculation. Even case four (which they flagged as "right-kind") fits—the painter's reason directly engages with artistic integrity, which is core to creative practice. 

  But wait—case two is tricky. The surgeon gains skill through blackmail, but skill isn't an attitude like belief; it's a capacity. So my principle might need to stretch beyond "attitudes" to include "practices" or "commitments." The blackmail corrupts his relationship to medicine, not the skill itself. That explains why he still "knows" surgery but feels tainted. 

  Ah! The unifying idea could be: reasons are wrong-kind when they're external to the constitutive aims of the activity/attitude. Belief aims at truth → bonuses don't support truth. Skill aims at mastery → blackmail undermines the virtuous acquisition. Intention for care → utility calc misses the point. 

  For their unasked case (avoiding language learning to preserve thought patterns): the reason is external to linguistic competence (which aims at communication/understanding), so it'd be wrong-kind for acquiring knowledge, but potentially right-kind for identity preservation—showing the principle's sensitivity to context. 

  Weakest verdict? Probably case two. Unlike belief, skills can be acquired immorally yet remain intact. The "taint" is about character, not the skill's validity. I should note this tension. 

  New test case: someone donates to charity solely for tax breaks. Wrong-kind reason? Yes—charitable giving constitutively aims at benevolence, while tax avoidance is external. Confirms the principle. 

  User's clearly philosophically inclined—they're wrestling with normativity across domains. Their "unsure" on case two shows good self-awareness. Might appreciate distinctions between attitudes/practices and voluntary/involuntary states. Should affirm their intuitions are mostly coherent!
answer: |-
  Your intuitions are remarkably coherent—they all point toward a **constitutive aim principle**. Here's how it works and how it handles your cases:

  ### The Principle:  
  A reason is "right-kind" if it engages with the **constitutive aim** of the attitude, practice, or commitment in question. A reason is "wrong-kind" if it bypasses or conflicts with that aim, even if it leads to the same outward outcome.

  ### Breakdown of Cases:
  1. **Researcher's Belief**  
     - **Constitutive Aim:** Belief aims at *truth*.  
     - **Verdict:** The cash bonus bypasses truth-tracking (it incentivizes self-deception). → **Wrong-kind.** ✅  

  2. **Surgeon's Skill**  
     - **Constitutive Aim:** Skill/know-how aims at *effective agency* (mastery for its own sake or for healing).  
     - **Verdict:** The skill itself is intact (it meets the aim), but the *acquisition reason* (blackmail) corrupts his **relationship to the practice**. It’s a wrong-kind reason for *cultivating the skill*, not for *possessing* it. → **Tainted acquisition, but skill valid.** ✅  
     *(This is your murkiest case—skill is less "voluntary" than belief/attitudes. The principle highlights why it feels off despite technical correctness.)*  

  3. **Calling Mom**  
     - **Constitutive Aim:** Filial intention aims at *care/relationship*.  
     - **Verdict:** Utility calculation ignores the relational core. → **Wrong-kind for the intention.** ✅  

  4. **Painter Avoiding Color Theory**  
     - **Constitutive Aim:** Artistic practice aims at *authentic expression*.  
     - **Verdict:** Her reason directly engages artistic integrity. → **Right-kind reason to avoid knowledge.** ✅  

  5. **Belief in God for Comfort**  
     - **Constitutive Aim:** Belief aims at *truth*.  
     - **Verdict:** Fear seeks comfort, not truth-tracking. → **Wrong-kind reason** (even if excusable). ✅  

  6. **Chef Judging via Critic**  
     - **Constitutive Aim:** Taste judgment aims at *personal sensory experience*.  
     - **Verdict:** Deferring to authority bypasses aesthetic engagement. → **Wrong-kind.** ✅  

  ---

  ### Your Unlisted Case:  
  **"Someone refuses to learn a language because fluency would change their thought patterns."**  
  - **Constitutive Aim:** Language learning aims at *communication/cultural understanding*.  
  - **Verdict:** Their reason is **wrong-kind** for *acquiring knowledge*—it rejects the aim of expanding understanding. But it *could* be right-kind for **preserving identity** (a different aim). The principle shows tension between competing commitments.  

  ---

  ### Weakest Verdict:  
  **Case 2 (Surgeon)** is your most vulnerable. The principle explains the "taint" (blackmail corrupts *why he entered the practice*), but skills are more outcome-focused than attitudes like belief. A hardliner might argue: "If the skill is real, the reason for gaining it is irrelevant." Your intuition captures a **moral tension** (the skill was acquired under duress, undermining professional virtue) rather than epistemic failure. The principle *mostly* holds if we frame medicine as a **normative practice** (aim: healing *via virtuous agency*), not just technical ability.

  ---

  ### Predictions for a New Case:  
  **Case 7:** *A politician advocates for climate policy solely to win an election, not because they care about the environment.*  
  - **Constitutive Aim:** Political advocacy should aim at *common good/justice*.  
  - **Prediction:** **Wrong-kind reason**—it bypasses the normative aim of governance, reducing policy to instrumental gain. (Matches your "utility vs. care" intuition in Case 3.)

  ---

  ### Conclusion:  
  Your gut calls **hang together** under the constitutive aim principle. It elegantly distinguishes right/wrong-kind reasons across epistemic, practical, and normative domains. The surgeon case is the weakest link but survives if we view professional skills as embedded in ethical practices. Well done!
