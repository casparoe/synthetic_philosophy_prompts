answer: |-
  Here's the rigorous desiderata for evaluating the conceivability-to-possibility link in the zombie argument, structured as requested:

  **I. Core Functionality (Must Handle Key Cases & Explain Why Hard):**
  1.  **Full Behavioral Zombies (FBZ):** Must account for conceivability/possibility of physical/functional duplicates with *zero* phenomenal consciousness (qualia, subjective experience).
      *   *Hard Case:* Directly challenges physicalist supervenience. If conceivable *and* metaphysically possible, strong evidence for non-physicalism. Requires explaining why perfect behavior doesn't entail phenomenology.
  2.  **Partial Zombies:**
      *   **Affective Zombies (AZ):** Physical/functional duplicates lacking only *affective* phenomenology (e.g., pain's hurtfulness, but retaining pain avoidance). Behavioral differences possible but subtle.
          *   *Hard Case:* Challenges the unity/necessity of consciousness. Can affect be cleanly separated? Does functionalism about emotion suffice? Raises issues about defining the relevant functional duplicates.
      *   **Self-Consciousness Zombies (SCZ):** Physical/functional duplicates lacking *only* higher-order self-awareness/metacognition while retaining raw feels.
          *   *Hard Case:* Blurs lines between phenomenal and access consciousness. Is self-consciousness a necessary *part* of phenomenology or a separate layer? Functional criteria for self-consciousness are complex.
  3.  **Inverted Qualia (IQ):** Physical/functional duplicates where phenomenal properties are inverted (e.g., their 'red' experience is like your 'green' experience) *without behavioral difference*.
      *   *Hard Case:* Challenges behavioral criteria for mentality and the completeness of functional/physical descriptions. Conceivability seems strong, possibility threatens type-identity theories and strict functionalism about qualia.
  4.  **Cognitive Overflow Compatibility (CO):** Must accommodate evidence suggesting phenomenal consciousness can exceed cognitive access/reportability (e.g., Sperling-style partial report superiority).
      *   *Hard Case:* Undermines arguments that phenomenal consciousness *must* be accessible/reportable to exist. Creates tension: if phenomenology can occur without access, how does this impact our ability to *conceive* of its absence? Threatens epistemic arguments linking absence of report to absence of phenomenology.

  **II. Mandatory Distinctions (Cannot Collapse):**
  1.  **Conceivable vs. Imaginable:**
      *   *Reason:* Something can be conceivable (coherently describable without contradiction) but not imaginable (e.g., 4D objects). Zombie arguments rely on *conceivability*, not vivid imaginability. Collapsing them invites objections based on limits of imagination.
  2.  **Conceivable (or Imaginable) vs. Metaphysically Possible:**
      *   *Reason:* Core to the debate. The argument needs a *link* (e.g., ideal positive conceivability entails metaphysical possibility), but the distinction *must* be maintained to evaluate whether the link actually holds or if conceivability is merely epistemic. Collapsing them begs the question.
  3.  **Epistemic Gap vs. Modal Gap:**
      *   *Reason:* Explaining *why* zombies seem conceivable (epistemic gap - our ignorance about bridging concepts) is distinct from whether this gap reflects a deep metaphysical truth (modal gap - actual contingency/necessity failure). A theory must explain the epistemic gap *without* necessarily endorsing the modal gap if physicalism is true.

  **III. Consistency Constraints (Cannot Contradict Without Ad Hoc Moves):**
  1.  **Neural Correlates of Consciousness (NCC) Findings:** Must be compatible with robust correlations between specific neural activity and reported conscious states. Cannot dismiss NCCs as epiphenomenal illusions without strong justification.
  2.  **Unconscious Processing (UP):** Must accommodate extensive evidence of sophisticated perception, cognition, and action without conscious awareness (e.g., blindsight, priming, procedural memory). Cannot deny UP exists.
  3.  **Causal Efficacy:** Must account for the *apparent* causal efficacy of conscious states in guiding action/report (without falling into epiphenomenalism unless forced by other desiderata). Zombies must still *act* like they are conscious.

  **IV. Tensions & Key Weaknesses:**
  1.  **Potentially Jointly Unsatisfiable Desiderata:** **Strict Conceivability-to-Possibility Link (for FBZ/IQ) vs. Overflow Compatibility (CO).**
      *   *Why:* CO suggests our cognitive access (and thus our ability to *conceive* based on accessible features) is limited. If phenomenology can overflow access, how can we be sure our conception of its *absence* in a physically identical system isn't *also* a failure of access/description? Conceivability might track epistemic limitations rather than modal reality.
  2.  **Most Damaging Desideratum to Rival Accounts:** **Overflow Compatibility (CO).**
      *   *Why:* Severely undermines arguments that phenomenal consciousness *must* be access-consciousness. Creates major problems for:
          *   *Physicalist/Functionalist Denials:* If phenomenology overflows access/reportability, functional/report-based definitions of consciousness are incomplete. Zombie conceivability becomes harder to dismiss as incoherent.
          *   *Standard Conceivability Arguments:* Raises the "How do you know?" challenge. If phenomenology isn't always accessible, how can we be confident we've conceived a true *phenomenal* duplicate lacking consciousness? Our conception might be flawed by access limitations.

  **V. Brief Evaluation of Views Against Criteria:**
  *   **Physicalism:** Struggles with **FBZ/IQ Conceivability-to-Possibility Link** & **IQ** directly. Must explain epistemic gap without modal gap, often downplays **FBZ** conceivability or appeals to **UP/CO** complexity. Handles constraints well.
  *   **Property Dualism:** Embraces **FBZ Conceivability-to-Possibility Link** & **IQ**, easily handles epistemic gap. Struggles with **Causal Efficacy** (threatens epiphenomenalism), **UP/NCCs** (why strong correlation?), and **CO** (how does inaccessible phenomenology interact?).
  *   **Epistemic-Gap-Only (e.g., Type-A Materialism):** Denies **FBZ/IQ Metaphysical Possibility** despite conceivability. Emphasizes **Conceivable vs. Possible** distinction. Must explain **Epistemic Gap** convincingly, often using **UP/CO/NCC** complexity. Struggles most with the *persistence* and *depth* of the epistemic gap for **FBZ**.

  This spec sheet provides the necessary criteria to rigorously evaluate any account of the conceivability-possibility link for zombies and related phenomena. The hardest cases are Partial Zombies (modularity) and Overflow (epistemic access limitations), with Overflow posing the most general challenge.
