answer: |-
  Here's an example addressing the conceptual issue within endurantism using the "rolling mandate" case, focusing on the absence of material continuity:

  **The Rolling Mandate Case:**
  Imagine a constitutional "Guardianship of the Realm" (GoR). Its defining rules stipulate:
  1.  A single, supreme regulatory authority exists.
  2.  This authority is held exclusively by one individual at any given time.
  3.  Every 24 hours, at precisely midnight, the mandate *instantly and completely* transfers to a new, pre-designated individual.
  4.  The outgoing and incoming individuals have **no material or spatial connection**: they share no physical substrate (not even cells), no overlapping location, no shared documents, no common institutional memory beyond public records, and no overlapping tenure. Each "occupant-stage" (Alice at t1, Bob at t2, Chen at t3, etc.) is materially, spatially, and personally distinct.
  5.  The powers exercised (e.g., interpreting the constitution, issuing binding decrees) are entirely at the discretion of the current holder, within broad bounds, and can shift dramatically.

  **The Conceptual Issue for Endurantism:**
  Endurantism holds that the GoR mandate is a single, persisting entity that is **wholly present** at each moment of its existence (e.g., at t1, t2, t3). It denies the mandate has temporal parts; the *whole* mandate exists when Alice holds it, and the *same whole* mandate exists when Bob holds it.

  The tension arises from the **complete change in intrinsic relational properties at each transition**, coupled with **no underlying material substrate**:

  1.  **Contradictory Intrinsic Properties:** At time t1, an essential intrinsic relational property of the GoR is *being-held-by-Alice*. At t2, an essential intrinsic relational property of the *same* GoR is *being-held-by-Bob*. "Being-held-by-X" is intrinsic to the mandate's relational state at a time. Endurantism typically handles change by indexing properties to times (e.g., "The mandate *is-held-by-Alice-at-t1*" and "*is-held-by-Bob-at-t2*"). However, the core commitment that the *whole* entity is present at each time means that at t1, the mandate possesses the property *currently-being-held-by-Alice* (and lacks *currently-being-held-by-Bob*), while at t2, it possesses the property *currently-being-held-by-Bob* (and lacks *currently-being-held-by-Alice*). For the *numerically identical* entity (the mandate) to possess both the property P (Alice-holder) and the incompatible property not-P (Bob-holder) *simpliciter* (even at different times) is contradictory unless properties are deeply time-indexed. Yet, deep time-indexing risks reducing persistence to a series of distinct, stage-like entities, undermining the core idea of strict numerical identity over time.
      *   *Problem:* How can the *one and same* entity (the GoR), wholly present at t1 and t2, coherently possess fundamentally incompatible intrinsic relational properties (having Alice vs. Bob as its *current essential holder*) without fragmentation or contradiction?

  2.  **No Substrate for Numerical Identity:** With no material continuity (unlike the Ship of Theseus), no spatial continuity, and no overlapping personnel or institutional memory beyond abstract rules, **what constitutes the persistent "substance" of the GoR that remains identical across stages?** The *only* candidate is the abstract role defined by the constitutional rules. However, endurantism typically relies on a persisting *bearer* of properties. If the bearer is the abstract role, then:
      *   The role seems unchanging – it defines *how* holders are chosen and the *scope* of power, but not *who* holds it or *how* they exercise it. The constantly changing holder (an intrinsic relational property of the mandate *instance*) seems distinct from the unchanging role definition.
      *   Endurantism struggles to explain how this abstract role *itself* constitutes the entity that is "wholly present" with its ever-changing, concrete holder-property. It risks either reifying the abstract role as a peculiar immaterial essence or reducing the mandate entity to just the current holder-stage plus the abstract rule (which sounds like temporal parts).

  **The Endurantist Trilemma:**
  *   **Option 1 (Strict Identity with Contradiction):** Insist the GoR is numerically identical at t1 and t2, wholly present each time, despite having incompatible essential properties (Alice-holder vs. Bob-holder). This seems logically incoherent without sophisticated property-indexing that may undermine the "wholly present" commitment.
  *   **Option 2 (Fragmentation):** Conclude that each occupant-stage constitutes a *distinct* mandate entity. The "rolling mandate" is merely a succession of numerically different entities (GoR-Alice, GoR-Bob, GoR-Chen) sharing only a name and causal history governed by the same rules. This abandons endurantism's core claim that it's *one* entity persisting through change; it fragments persistence into stage-succession.
  *   **Option 3 (Immaterial Essence):** Posit an immaterial, non-relational "essence" of the GoR mandate that persists unchanged, bearing the changing relational properties of "being-held-by-X". This essence is distinct from the abstract rules and the material holders. However, this introduces a mysterious, non-empirical entity solely to save numerical identity, which is ontologically extravagant and contrary to the purely relational definition of the mandate.

  **The Perdurantist Resolution:**
  Perdurantism treats the GoR mandate as a four-dimensional space-time worm. It has distinct temporal parts: the "Alice-holding part" (occupying day 1), the "Bob-holding part" (occupying day 2), the "Chen-holding part" (occupying day 3), etc. These parts are fused together by the causal-historical chain defined by the constitutional rules (the selection process, the transfer mechanism).

  *   **No Contradiction:** The *whole* 4D mandate entity doesn't possess the properties "being held by Alice" or "being held by Bob" *simpliciter*. Instead, its *t1-part* possesses "being held by Alice," and its distinct *t2-part* possesses "being held by Bob." Different parts having different properties is unproblematic.
  *   **No Substrate Needed:** Persistence is accounted for by the mereological sum of the temporal parts under the unifying relation (the diachronic causal-institutional chain defined by the rules). No underlying material or immaterial substrate is required; the relational structure itself provides the principle of unity across time.
  *   **Handles Change Naturally:** The dramatic shifts in holder and exercised powers are simply variations across the mandate's temporal extension. The mandate *endures* by *perduring* – by having parts existing at different times.

  **Why this differs from the Ship of Theseus:**
  The Ship of Theseus puzzle crucially involves *material continuity* (gradual replacement of planks) and the *possibility of competing claims* (the reassembled original vs. the continuously maintained ship). The Rolling Mandate eliminates material continuity entirely – the occupant-stages share *no* matter, space, or overlapping existence – and focuses purely on the tension for endurantism arising from an entity defined *only* by its diachronic relational structure (the rules governing succession) undergoing *complete* intrinsic relational change (the holder) at each stage, while demanding the entity be *wholly present* at each moment. The difficulty stems directly from the *absence* of a substrate and the endurantist denial of temporal parts.
