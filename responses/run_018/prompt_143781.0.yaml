answer: |-
  The tension you articulate centers on fundamentally divergent conceptions of temporal sovereignty over urban space. Lefebvre's "right to the city" framework inherently challenges the moral legitimacy of the intergenerational lock-in effect produced by exclusionary zoning, viewing it as a profound violation of urban justice. In contrast, the sovereignty-based defense of zoning explicitly relies upon and morally justifies this temporal binding as an extension of property rights.

  Lefebvre's conception frames the city as a dynamic, collective oeuvre – a social product continuously created and recreated over time by the totality of its inhabitants, past, present, and future. Within this ontology, urban space possesses a temporality that is inherently open-ended and participatory. The "right" he posits is precisely the right to participate in this ongoing social production, to appropriate space according to evolving needs and values, privileging use-value rooted in lived experience. Zoning as intergenerational lock-in directly negates this right for future residents. It represents a form of temporal enclosure, where the present generation exercises an illegitimate monopoly over future possibilities. The moral weight of this lock-in is immense: it robs subsequent inhabitants of their fundamental democratic agency to shape their own environment, binding them to the use-values and exchange-value priorities (like preserving property values through scarcity) of a prior era. Future residents become inheritors of constraints rather than active participants in creation, violating the core Lefebvrian principle that the city belongs to those who inhabit it, not just those who own parcels of it at a specific moment.

  The sovereignty-based defense, however, imbues the temporal lock-in with positive moral weight as a necessary feature of property ownership. It conceptualizes ownership not merely as dominion over a spatial plot at a single point in time, but as dominion over the *temporal trajectory* of that plot and its surroundings. The homeowner's investment – financial, emotional, social – is seen as embedding a legitimate claim to shape the foreseeable future of their locale. This perspective frames zoning as a protective mechanism ensuring stability and predictability, safeguarding the owner's temporal horizon against unwanted disruptions ("illegitimate intrusions"). The moral justification lies in the autonomy of the current owner to secure the long-term value and character of their property, including the ability to bequeath it under known conditions. Binding future residents is not an ethical problem but a feature; it is the predictable future state that validates the present investment and expresses the owner's sovereign will over their domain across time. The legitimacy to shape the city for decades hence stems directly from the act of present ownership and the political assertion of local control to protect that ownership's temporal extension.

  When evaluating coherence specifically regarding temporal legitimacy across generations, the Lefebvrian framework offers a more consistent account. It explicitly recognizes the city as a multi-generational project and grounds legitimacy in the ongoing, inclusive participation of *all* inhabitants in its perpetual becoming. The "right to the city" is inherently intergenerational; denying future residents agency contradicts its foundational principle that the urban is a social product belonging to its users. The sovereignty model, conversely, faces a temporal incoherence. While claiming legitimacy based on protecting an owner's temporal horizon, it simultaneously denies that same temporal agency – the right to define their own horizon – to future owners and residents. It conflates the right to enjoy one's property within a stable *present* framework with a right to dictate the framework itself for *future* generations. This creates a democratic paradox: those bound by the rules (future residents) had no say in their creation, making the "sovereignty" exercised by the present generation over the future fundamentally non-reciprocal and, from a democratic standpoint, illegitimate. The coherence of the sovereignty argument relies on a perpetually deferred democracy, where the present always governs the future, a stance difficult to reconcile with principles of self-determination over time.

  Therefore, regarding the moral weight of zoning's intergenerational lock-in, the frameworks offer diametrically opposed evaluations: Lefebvre sees it as a profound injustice stifling collective urban becoming, while the sovereignty defense sees it as a legitimate exercise of property rights securing valuable stability. However, on the specific question of which provides a more coherent account of legitimate claims across generations, the Lefebvrian perspective holds greater consistency. It integrates the temporal dimension of urban life explicitly into its core principle of democratic appropriation, demanding that legitimacy be continuously renewed by the participation of those who inhabit the city *in their own time*. The sovereignty model struggles to justify why the preferences of one generation should permanently constrain the agency of the next, beyond the assertion that current ownership confers dominion over future time, an assertion Lefebvre's framework fundamentally rejects as anti-urban and anti-democratic.
