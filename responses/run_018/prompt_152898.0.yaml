  For positions, I'll include Leibniz's strict view, modern decision theory's permissive stance, and perhaps a deflationary position that denies the problem exists. The randomization question is particularly interesting - is flipping a coin rational or just passing the buck? 

  I should also note where there's consensus (like most philosophers agreeing perfect indifference is possible) versus where debates rage (like whether randomization counts as rational). The epistemic/metaphysical distinction at the end will help separate views that appear similar but have different foundations. 

  This needs to be concise enough for one page, so I'll keep each branch crisp. The "empty nodes" commentary can be brief - just enough to show why certain combinations don't work. For example: "If you require suspension but forbid randomization, you're stuck in permanent inaction - which is why no serious philosopher holds this view." 

  Finally, I'll avoid jargon where possible, but some technical terms are unavoidable given the topic. The user seems comfortable with them though, given how they framed the request.
answer: |-
  Here's a decision-tree taxonomy mapping the logical space of rational choice under perfect indifference, designed for a seminar handout. It starts with fundamental commitments and branches to specific positions, labeling nodes with concrete questions and leaves with theoretical stances (or empty spots).

  **Rational Choice Under Perfect Indifference: A Decision-Tree Taxonomy**

  1.  **Is perfect indifference (options of *exactly* equal value in *all* relevant respects) metaphysically possible?**
      *   **NO (Deflationary Route):** → **"No Problem" Deflationary View.** If perfect indifference is impossible, the apparent dilemma always stems from *epistemic ignorance* (we *think* they're equal, but they aren't) or *incomplete valuation* (we haven't identified a relevant difference). Rational choice demands further inquiry or refinement of preferences. *(Settled for proponents, contested overall)*
      *   **YES:** Proceed to Question 2.

  2.  **Faced with genuinely indifferent options, must the agent suspend choice?**
      *   **YES:** → **"Mandatory Suspension" Position.** Rationality demands inaction until a preference emerges or new information breaks the tie. Choosing *any* option arbitrarily is irrational. Proceed to Question 3.
      *   **NO:** Proceed to Question 4.

  3.  **Is the agent permitted to use an *external randomizer* (e.g., coin flip, algorithm) to break the tie and make a choice?**
      *   **NO:** → **"Strict Paralysis" Node (Typically Empty).** Mandates suspension *and* forbids resolution via randomizer. Leads to permanent inaction. *Why empty?* Incoherent/Deeply Unattractive: Demands resolution (suspension is chosen) while forbidding *any* mechanism for ending suspension, violating practical rationality's requirement for action where needed. No major theory holds this.
      *   **YES:** → **"Randomized Suspension Resolution" Position.** Suspension is mandatory *until* an external randomizer breaks the tie. The randomizer provides the necessary trigger for rational choice. *(Contested: Is the initial suspension necessary?)*

  4.  **Is an *internal, arbitrary* choice mechanism (e.g., "just pick one!") rationally permissible?**
      *   **NO:** Proceed to Question 5.
      *   **YES:** → **"Permissive Decision Theory / Basic Arbitrarism."** Rationality requires *some* choice be made but imposes no further constraints *how* when options are truly indifferent. Any choice, even "eeny-meeny-miny-moe," is rational. No second-order preference or randomizer needed. *(Dominant modern view in decision theory/economics)*

  5.  **Is a *second-order preference* (a preference *about how* to choose when indifferent, e.g., "I prefer to be decisive") rationally required?**
      *   **NO:** → **"External Resolution Only" Node.** Internal arbitrariness forbidden, second-order preference not required. Proceed to Question 6.
      *   **YES:** → **"Second-Order Preference Required."** Rationality demands the agent develop a meta-preference governing tie-breaking (e.g., "Always choose alphabetically first," "Always randomize internally"). Choice must follow this higher-order rule. *(Contested: Can such preferences be non-arbitrary?)*

  6.  **Is using an *external randomizer* considered a rationally acceptable way to resolve the indifference?**
      *   **NO:** → **"Strict Leibnizian Rationalism."** All choices must stem directly from sufficient reason within the agent. External randomizers constitute "outsourcing" reason, failing the demand for a *determinate* internal ground for choice. True indifference mandates a unique rational outcome determinable by reason alone (though Leibniz struggled with Buridan's ass!). *(Historically significant, minority view)*
      *   **YES:** → **"External Randomization as Rational."** While internal arbitrariness is forbidden and no second-order preference is mandated, employing a verifiably fair external process (coin flip, RNG) *is* a rational procedure for breaking ties. It avoids capriciousness and provides a clear, impartial reason for the choice. *(Common pragmatic view, contested by strict internalists)*

  **Key to Leaves & Nodes:**

  *   **"No Problem" Deflationary View:** (e.g., some interpretations of revealed preference, certain pragmatists)
  *   **"Mandatory Suspension" Position:** (Rare, but elements in some strict interpretations of rationality or early commentators on Buridan)
  *   **"Randomized Suspension Resolution":** (A specific, less common variant of suspension views)
  *   **"Permissive Decision Theory / Basic Arbitrarism":** (Standard modern view: Savage, standard economics)
  *   **"Second-Order Preference Required":** (Associated with some Kantian or hierarchical decision theorists, e.g., Bratman on planning)
  *   **"Strict Leibnizian Rationalism":** (Leibniz, some contemporary rationalists)
  *   **"External Randomization as Rational":** (Common in practice, defended by some philosophers like Ullmann-Margalit, Morgenbesser)
  *   **"Strict Paralysis" Node:** (Empty - logically problematic)
  *   **"External Resolution Only" Node:** (Intermediate step, not a final position)

  **Settled vs. Contested:**

  *   **Settled *within* paradigms:** E.g., Permissive Decision Theorists agree internal arbitrariness is fine; Strict Leibnizians agree external randomizers are irrational.
  *   **Genuinely Contested:**
      *   The *possibility* of perfect indifference (Q1).
      *   Whether suspension is ever mandatory (Q2).
      *   Whether internal arbitrariness is sufficient (Q4) vs. requiring second-order preferences (Q5) or external randomizers (Q6).
      *   Whether external randomizers constitute "rational" resolution or just pragmatic outsourcing (Q6).
      *   The relationship between the metaphysical possibility of indifference and epistemic situations (often underlying Q1 debates).

  This taxonomy forces engagement with core commitments before reaching labeled positions, highlights logical connections (and impossibilities), and shows where the live philosophical debates lie.
