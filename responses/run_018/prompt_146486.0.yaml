prompt: |-
  In debates over collective agency, a common analogy treats a group that acts together as a single agent whose body is distributed across its members: shared intentions map onto individual volitions, members map onto organs or functional subsystems, joint commitment plays the role of unified consciousness, and group-level praise or blame attaches just as it does to one person. The analogy is often invoked to justify treating corporations, assemblies, or teams as genuine moral agents rather than mere aggregates. How far does it hold? Give an explicit correspondence table, then examine the fractures—particularly cases of intentional opacity, where no single member grasps the collective plan, and cases of convergent divergence, where members pursue mutually incompatible private ends that happen to produce the same collective behavior. Does the analogy survive these disanalogies, or was it carrying the normative conclusion about distributed responsibility? In your answer, state how confident you are overall and single out the specific claim or mapping about which you are least sure.
