answer: |-
  ## Dialogue: The Constraint and the Leak

  **Characters:**  
  *   **Tara (Defender):** Believes Good's theorem reveals a fundamental coherence constraint.  
  *   **Sam (Skeptic):** Believes the theorem relies on an untenable separation between belief and action in critical cases.  

  **Setting:** A quiet corner of a conference hotel bar, late evening.

  **(The dialogue begins mid-conversation)**

  **Tara:** ...and that's precisely why Good's theorem *must* hold for any coherent expected utility maximizer. Let's state it clearly: An agent has a prior over states of the world, a utility function defined solely over the chosen act and the resulting state, and a set of available acts. Before choosing an act, the agent can observe a signal, generated by a known likelihood function, at zero cost. The theorem states that the agent's ex ante expected utility (before seeing the signal) *cannot be decreased* by having the option to see this signal. It's a direct consequence of the agent being able to adopt the decision rule: "Ignore the signal and choose the act that was optimal under the prior." Since that rule is always available, the agent can never be forced to do worse by having the *option* to condition on the signal. Any apparent harm must stem from the signal itself causally affecting utility (e.g., bad news causing emotional distress) or changing the agent's preferences, not from the mere *possession* of knowledge within the decision problem as defined. Your job candidate example doesn't refute this; it smuggles in causal effects.

  **Sam:** My point isn't that the signal *causes* utility changes externally, Tara. It's that the theorem's escape hatch – "just ignore the signal" – is physically or logically impossible in certain decision contexts, which I call "undelegable." The agent *must* perform the act *themselves*, *while knowing* the signal. The "ignore the signal" act isn't in the feasible set. In the candidate case: she *must* walk into that room and give the talk *herself*. She cannot delegate the talking to a clerk who is ignorant of the ranking, or to her past self. The act "give a talk as if ignorant" is unavailable to her *because she knows she is ranked fourth*. Her beliefs *causally leak* into her performance – her nervousness, her tone, her conviction – in ways she cannot fully control or suppress. The decision itself is irreducibly tied to her epistemic state at the moment of action. The "act as if ignorant" option vanishes upon learning.

  **Tara:** But Sam, you're putting the epistemic state *into* the causal chain affecting the outcome! The theorem assumes utility is a function of the act and the state *only*. If the candidate's nervousness *causes* a worse outcome (e.g., stumbling during the talk), then the *signal* (the ranking) is causing an outcome change *via* the emotional state, which isn't part of the state space defined in the decision problem. The theorem doesn't deny signals can have causal effects! It says that *conditional* on the states and acts being defined purely, the *informational value* cannot be negative ex ante. Ex ante, wouldn't the candidate strictly prefer the *option* where the committee tells a clerk the ranking, and the clerk, *ignorant of it*, delivers a pre-written talk on her behalf? That version satisfies Good's theorem – the clerk "ignores" the signal perfectly. If she wouldn't prefer that, it's because the act *isn't* separable from the knowing state, meaning her utility function isn't defined solely over acts and world-states as the theorem requires.

  **Sam:** That's the crux. You're right that the clerk scenario *does* satisfy the theorem's antecedent: utility depends only on the act (the clerk's reading of the script) and the state (the committee's final decision). The signal is freely disposable by the clerk. But that scenario is fundamentally *different* from the undelegable one where *she* must perform. The theorem holds for the clerk version, sure. But for the *real* decision she faces – performing personally, knowing the signal – the theorem's antecedent *fails*. The "act" isn't a simple choice like "read script A"; it's a complex performance *intrinsically modulated by her beliefs*. Her epistemic state isn't an *external cause* like a gust of wind; it's a constitutive element of the performance *itself*. You can't surgically separate "the act of talking" from "the state of knowing while talking." The leak isn't a bug; it's a feature of how humans act when knowledge is personal and stakes are high. The theorem doesn't apply to this *type* of decision problem.

  **Tara:** I see the distinction you're drawing. You're arguing that in undelegable decisions, the agent's cognitive state *becomes part of the act description*. But doesn't that make the theorem vacuously true? If we define the act-space finely enough to include the agent's entire mental state at the time of acting ("Talk-confidently-knowing-fourth" vs. "Talk-confidently-knowing-first"), then the signal doesn't change the available acts; it just reveals which highly specific act is now optimal given the state. Good's theorem still holds trivially because the "ignore" option (defined as performing the act corresponding to the prior-optimal coarse act) might simply not exist in this finely described act-space. The harm comes from the agent lacking the *skill* to perform the act "Talk-confidently-knowing-fourth" well, not from the information itself. Isn't this just a lack of control, not a refutation of the coherence constraint?

  **Sam:** Not vacuity, Tara, but a *mismatch* between the theorem's clean separation and the messy reality of embodied agency. Yes, if we define acts hyper-finely including belief states, the theorem technically holds, but it loses its prescriptive bite. The "always available" ignore-the-signal act ("Perform *as if* ignorant") is not implementable; it's not a feasible member of the finely described act set. The theorem tells me that ex ante, I prefer having the *option* to see the signal. But in the undelegable case, ex post, after seeing it, I *cannot* access the counterfactual world where I didn't see it. My choice set is irrevocably altered *by the knowing itself*. The theorem doesn't tell me how to *act* when I'm stuck in that knowing state without the "as if ignorant" skill. Its comfort is ex ante; my agony is ex post, trapped in a decision frame the theorem assumed away. It constrains coherence, yes, but doesn't guide me through the leak.

  **Tara:** Hmm. That's a fair point about the *ex post* perspective and the altered choice set. The theorem is fundamentally ex ante. And perhaps for truly undelegable decisions with significant belief-leak, the assumption that utility depends *only* on the external act and state *is* violated in practice, because the internal state *is* part of the outcome we care about (e.g., we intrinsically value authenticity or lack of cognitive dissonance during performance). But doesn't your case rely heavily on the agent's *inability* to compartmentalize? A perfect actor could deliver the identical talk regardless of knowing fourth or first, making the "act as if ignorant" feasible again, and Good's theorem would clearly apply. So isn't the harm really about imperfect self-control rather than intrinsic harm of knowledge?

  **Sam:** You're right that perfect self-control resolves it for the theorem. But for humans, that control is often imperfect or impossible, *especially* in high-stakes personal performances where authenticity matters. The leak isn't just noise; sometimes the knowledge changes the performance in ways that *are* the outcome we judge – the nervousness *is* the lack of confidence the committee perceives. But I concede: if the agent truly doesn't care *how* the confident performance is achieved (e.g., via pills, acting, genuine belief), and only cares about the committee's binary hire decision, then the clerk scenario becomes preferable ex ante, and Good's theorem holds sway. The harm stems from valuing the *manner* of acting, tied to belief.

  **(Brief pause as they consider the smaller point)**

  **Tara:** Before we lose the thread, what about our smaller spat? Can free information hurt a minmax agent who re-solves after each signal?

  **Sam:** Ah, yes. I think it *can*. Imagine an ambiguity-averse agent with a set of priors. Before any signal, they choose an act maximizing worst-case utility over their prior set. A free signal might rule out some favorable priors but leave the most adversarial ones intact. The worst-case utility *after* the signal could be lower than the worst-case utility *before*, precisely because the signal destroyed some "good" worst-case scenarios without harming the truly bad ones. The agent re-solving minmax post-signal might end up with a lower guaranteed payoff than if they had remained ignorant and stuck with their original minmax act. It's not a failure of probabilistic sophistication per se; it's a consequence of dynamic inconsistency under ambiguity aversion when re-optimizing.

  **Tara:** Interesting. I see the mechanism. Yes, under specific dynamics and ambiguity aversion, free information can indeed lower the guaranteed payoff for a re-solving minmaximizer. That *is* a substantive exception, distinct from the probabilistic sophistication issue. I'll grant you that one, Sam. It highlights that Good's theorem really is anchored in Bayesian expected utility.

  **Sam:** And I'll grant that for standard Bayesian agents making delegable decisions, or who possess perfect acting skills, Good's theorem is a powerful coherence constraint. The harm in my undelegable cases often *does* involve causal pathways or preference structures that technically violate the pure theorem's assumptions. My point is that these "violations" are endemic to important real-world decisions.

  **Tara:** And mine is that recognizing them *as* violations clarifies the theorem's domain and the source of potential harm. So, we disagree on how common and fundamental the undelegable case is, and whether the theorem's "free disposal" is a realistic assumption for human actors in critical moments, not on the theorem's validity within its defined scope.

  **Sam:** Precisely. We've located the leak. Another round?

  **Tara:** Why not. Though I suspect we know how this ends... ex ante, it was optimal to start.

  **(They signal the waiter.)**

  ---

  ## Where Each of Us Was Wrong

  *   **Me (The User/Sam):** I am the Skeptic (Sam) in the dialogue. My core argument was the "undelegable decision" with "causal belief leak." I should take back the implication that this *fundamentally refutes* Good's theorem within its explicit framework. Tara correctly pressed that in such cases, the utility function often *does* implicitly depend on the belief state or the signal causes outcomes via psychological mechanisms, violating the theorem's strict separation of acts, states, and utility. The theorem holds for the *delegated* version (the clerk), showing the harm stems from the requirement for personal performance under knowledge, not knowledge itself in the abstract. My minmax point was correct, however.
  *   **My Friend (Tara):** My friend is the Defender (Tara) in the dialogue. They should take back the initial dismissal that my example merely "smuggled in extra causes" without engaging the core issue of *feasibility*. The "act as if ignorant" option isn't just causally risky; in cases of significant belief leak affecting the core performance, it genuinely *isn't a feasible action* for the agent in that epistemic state. The theorem assumes free disposal, but in undelegable decisions, the act-set *post-signal* is irrevocably different from the act-set *pre-signal* in a way that eliminates the safety net. Tara conceded this ex post perspective and the altered choice set later. Their point about perfect control resolving it highlights the assumption load, but doesn't negate the problem for imperfect agents.
