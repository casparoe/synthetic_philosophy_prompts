answer: |-
  ### 1. Conceptual Brainstorming  
  Nearby established concepts:  
  - **Mission drift**: Broad term for deviation from founding purpose, but often implies passive neglect or external pressures, not micro-rational erosion.  
  - **Institutional decay**: Overly generic; encompasses collapse from corruption, funding loss, or leadership failure.  
  - **Bureaucratic incrementalism**: Focuses on small policy changes but lacks emphasis on *purpose erosion*.  
  - **Isomorphism** (DiMaggio & Powell): Mimetic adaptation to environmental norms, but assumes conscious imitation.  
  - **Cultural drift** (anthropology): Gradual value shifts, yet rarely tied to institutional decision-logic.  
  - **Path dependency**: Highlights historical constraints but doesn’t capture agency in micro-decisions.  
  - **Slippery slope fallacy**: A rhetorical concern, not an institutional mechanism.  
  None fully encapsulate the *distributed agency*, *local rationality*, and *unintentional disalignment* observed.  

  ---

  ### 2. Phenomenological Carving  
  **Core Definition**: *Erosion of constitutive purpose through accumulated, locally rational micro-adjustments, where no single actor intends systemic deviation, yet collective action dissolves institutional telos.*  

  **Mechanisms**:  
  - **Local Rationality**: Each decision (e.g., funding a memoirist to offset poetry deficits) is contextually defensible (e.g., fiscal prudence, responsiveness).  
  - **Opaque Aggregation**: Consequences manifest only cumulatively; actors lack vantage to perceive systemic drift.  
  - **Avoidance of Threshold Decisions**: Changes bypass formal governance (charters, votes), exploiting procedural ambiguity.  
  - **Default-Path Dependence**: Inertia favors "temporary" measures becoming permanent (e.g., unreplaced retirement).  

  **Distinctions**:  
  - **vs. Deliberate Institutional Capture**: No *intentional* redirection (e.g., no charismatic leader exploiting rules). Here, actors sincerely believe they uphold the mission.  
  - **vs. Generic Organizational Drift**: Drift may involve external shocks (market forces) or conscious strategy. This is *internally generated* via micro-rationality, making it self-inflicted yet blameless.  

  **Boundary Conditions**:  
  - *Inside*: Decisions must be justifiable *within* the institution’s operational logic.  
  - *Outside*: Crisis-driven restructuring or explicit ideological overhaul.  

  ---

  ### 3. Terminological Verdict  
  No existing term suffices. **Mission drift** is closest but flawed: it ignores agency (implying passive "drifting") and conflates intentional/unintentional shifts. **Creepive Disalignment** is proposed:  

  > **Creepive Disalignment** (n.): The cumulative erosion of an institution’s constitutive purpose through distributed, locally rational micro-adjustments that bypass formal governance, generating systemic deviation absent coordinated intent.  

  - **Boundary Case (Inside)**: The literary foundation’s shift—each grant adjustment addressed immediate concerns while incrementally dissolving poetic focus.  
  - **Boundary Case (Outside)**: A nonprofit pivoting to disaster relief after an earthquake; a *conscious* response to external crisis, not micro-adjustments.  

  ---

  ### 4. Relation to Influence-Seeking  
  Contrasting **Creepive Disalignment** (CD) with **Deliberate Institutional Capture** (DIC):  

  | **Dimension**       | **Creepive Disalignment**                          | **Deliberate Institutional Capture**         |  
  |---------------------|---------------------------------------------------|---------------------------------------------|  
  | **Causal Structure** | Emergent: outcome of decentralized choices       | Directed: orchestrated by central agent     |  
  | **Accountability**   | Diffused: "no one is to blame"                   | Concentrated: identifiable actor(s)         |  
  | **Recognizability**  | Opaque: characters perceive only local logic     | Legible: maneuvers visible as power plays   |  
  | **Intent**           | Proximate (solve immediate problems)             | Ultimate (reshape institution to private ends) |  

  DIC features *instrumental rationality* (leveraging committees/budgets strategically); CD operates via *bounded rationality* (solving local problems within cognitive limits).  

  ---

  ### 5. Narrative Implications  
  Creepive Disalignment transforms institutional decay from melodrama (villain vs. victims) to tragedy. Key effects:  
  - **Moral Ambiguity**: Characters are complicit yet exonerate themselves via "good intentions." A board member funding commercial nonfiction genuinely believes they’re "saving" the foundation.  
  - **Structural Irony**: Readers perceive the gulf between local justifications ("this hire is temporary") and systemic consequences (eroded mission), creating dread.  
  - **Agency Paradox**: Protagonists fighting decay find no adversary—only colleagues making "reasonable" choices. Conflict becomes *dialectical*: individual rationality vs. collective irrationality.  
  - **Thematic Weight**: Highlights institutions as *emergent orders* vulnerable to entropy without malice. The enemy is epistemological: failure to perceive cumulative effects.  

  This absence of villains fosters existential stakes—decay emerges from within, implicating everyone in the audience’s world.
