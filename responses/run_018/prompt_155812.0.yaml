prompt: |-
  Global workspace theory is often introduced through a theatrical analogy: cognitive content is spotlighted onto a central stage and then broadcast to a distributed audience of unconscious modules, making it globally available for report and reasoning. Proponents use this to illuminate access consciousness, but critics contend that the image of an audience quietly presupposes phenomenal consciousness — there must be someone for whom the broadcast is experienced. Audit the analogy in detail: specify the correspondences between stage, spotlight, actors, and audience and the proposed neural or functional architecture; identify which theatrical features (a director, a unified viewpoint, an experiential quality of witnessing) are imported without justification; separate the disanalogies that undermine the explanation of access consciousness from those that merely undermine phenomenal consciousness; and determine whether the model can genuinely distinguish the two forms of consciousness or whether it conflates them by design. Then consider a constructed variant: a system that executes the full global broadcast — every module receives the signal — yet there is no integrated receiver, an auditorium that is structurally empty. Does the theatrical analogy accommodate this possibility, or does it collapse once the experiential 'audience' is removed? If it collapses, does that show the analogy explains phenomenal consciousness only by assuming it? Finally, assess whether an alternative image — say, a public noticeboard or a radio transmission without a listener — can preserve the functional account of access while avoiding the phenomenological smuggling. Please provide a one-sentence summary of your audit as the very last line.
reasoning: |-
