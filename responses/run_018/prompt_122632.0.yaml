prompt: |-
  Hi — I run the "pilot pipeline" for a mid-sized city (around 200k people). Basically every new idea in this city now arrives as a request for a six-month pilot: try it in one district, measure it, then decide. We get about forty of these a year, three of us review them, we have maybe two hours each, none of us has stats training beyond a spreadsheet, and anything we clear goes to a council committee that meets monthly and can be yanked by the mayor's office whenever they feel like it. What actually happens is that most pilots turn into either a press release or a quiet permanent extension, and the measurement mostly just decorates whatever people already wanted to do.

  What I want from you is a procedure my team can run on a proposal, grounded in Dewey's experimentalism about inquiry and democracy — the version where inquiry starts from a genuinely indeterminate situation rather than from a proposition to be verified, where a hypothesis is a plan of action and its test is what happens when you act on it, where warrant is a matter of degree and always revisable so nothing "proves" anything, and where the democratic bit isn't a vote at the end but the requirement that the people who will bear the consequences get a real hand in forming and judging the hypothesis, not just a chance to react to it afterward.

  Don't write me an essay about Dewey. Write me something I can put on one page and hand to a new hire. Concretely:

  - The questions, in order, and what counts as a sufficient answer to each. I need to be able to tell "answered" from "sounded plausible in the meeting."
  - Where the procedure stops with a NO — this isn't a pilot, don't run it.
  - Where it stops and hands the decision to a person or to the committee because the question is one of values rather than facts. Say explicitly which questions those are, because that's what I have to defend when a council member asks why we rejected their thing.
  - A one-page output — call it a pilot charter — that records what the situation was, what the hypothesis is as an action, who bears what, and what would count as having learned something.
  - How to handle the hard cases we actually get, including: (a) interventions that can't be undone, so there's no going back to a reconstructed situation — demolishing things, disbanding a team, closing a school; (b) pilots that change the very thing they measure, so the result won't travel; (c) pilots where the metric is easy to game and gaming looks identical to success; (d) pilots where the benefits land on one group and the costs on a group that has no seat in the process; (e) pilots nobody can opt out of — a school-wide or district-wide thing where the "subjects" are just people who live there; (f) null results, which is most of them, and which currently just get ignored; (g) pilots that quietly become permanent because nobody scheduled the decision.

  Two things I'd like built in that I haven't seen anywhere. First, a "counterfactual who" step: name the specific person or role who is worse off if this succeeds, and if the proposing department can't name one, that itself is the finding. Second, a "what has to stay still" step: list what must remain in place for a result in the pilot district to mean anything about next year city-wide, and then check whether the pilot itself changes anything on that list. My suspicion is that most of our proposals fail right there and we've been pretending otherwise.

  Then run it on three real-shaped ones:

  1. A four-day week for municipal office staff — same hours compressed into four days — proposed by HR, expected to cut sick leave and help recruitment.
  2. Predictive targeting of code-enforcement inspectors using a model trained on historical 311 complaint data, so we inspect blocks the model flags rather than responding to complaints.
  3. Unarmed mental-health crisis response teams in two districts. I should say up front that I publicly backed this one and the mayor already announced it, so I'm not neutral, and if the procedure says something inconvenient I'd rather hear it now than in front of the committee.

  For each, show me the gates it passes and fails, the charter line, and whether it's a NO, a REFRAME (run it, but the claim you're entitled to make afterward is much smaller — say what the smaller claim is), or a ROUTE (this isn't an experiment, it's a decision about what kind of city we want, so take it to full deliberation). I expect at least one of these to come out as an answer I don't like, and I want you to say plainly what my options are in that case.

  Finally, tell me what the procedure can't do. I have to present this to a committee that will absolutely over-trust it the moment it looks official, so I need the honest failure modes in writing — where the checklist gives false confidence, where it's a vocabulary for decisions we'd have made anyway, and what it can't tell us at all.
reasoning: |-
  We are designing a pilot evaluation procedure based on Dewey's experimentalism. The core principles:
  - Inquiry starts from an indeterminate situation (a problem that isn't already solved).
  - The hypothesis is a plan of action, and the test is what happens when you act.
  - Warrant (justification for belief) is always provisional and revisable.
  - Democratic inclusion: those affected must help form and judge the hypothesis.

  The procedure is a checklist of questions. We stop at any "NO" and reject the pilot. Some questions are "value stops" where we hand off to the committee because the issue is about values, not facts.

  The output is a one-page "Pilot Charter" that records:
  1. The indeterminate situation (the problem we are trying to resolve).
  2. The hypothesis (what we are doing, as an action).
  3. Who bears the consequences (benefits and burdens).
  4. What will count as having learned something (the criteria for success/failure and learning).

  Additionally, we have two special steps:
  - Counterfactual Who: Name who is worse off if the pilot succeeds. If they can't name anyone, that's a finding (and a red flag).
  - What Has to Stay Still: List what must remain unchanged for the pilot results to be meaningful, and check if the pilot changes any of those.

  Handling hard cases:
  a) Irreversible interventions: If it can't be undone, then the pilot must be designed to gather evidence before full commitment, or we must treat it as a deliberation (not a pilot).
  b) Changing the thing measured: If the pilot alters the context so that results don't apply elsewhere, we must reframe the claim (only learn about this specific context) or redesign.
  c) Gaming the metric: We need to design metrics that are hard to game or use multiple measures.
  d) Costs and benefits on different groups: Must involve the cost-bearing group in forming the hypothesis and judging the results.
  e) No opt-out: Must have a clear comparison group and/or baseline, and involve the community in defining what counts as learning.
  f) Null results: The charter must pre-specify what we learn from null results and how we will act on them.
  g) Permanent by default: The charter must include a sunset clause and a decision point.

  The Procedure (Checklist):

  1. **Indeterminate Situation**: 
     - Q: What is the specific, concrete problem that we don't already know how to solve? 
     - Sufficient answer: A clear description of the problem that is not already resolved by existing knowledge or practice. Must show why it's uncertain and why action is needed now.
     - If not: NO. (This is not a pilot; it's either a known solution or not a real problem.)

  2. **Hypothesis as Action**:
     - Q: What exactly are we going to do? (The action must be described as an intervention, not just a goal.)
     - Sufficient answer: A concrete, bounded action that can be implemented in one district for six months.
     - If not: REFRAME or NO.

  3. **Counterfactual Who**:
     - Q: If this pilot succeeds (i.e., the problem is resolved as hoped), who will be worse off? (Name the specific role, group, or individual.)
     - Sufficient answer: At least one group that is negatively affected is named. If the proposers cannot name anyone, then the finding is: "This proposal assumes no trade-offs, which is unrealistic." This is a red flag and may lead to REFRAME or NO.

  4. **Who Bears the Consequences** (Democratic Inclusion Check):
     - Q: Who will be affected by this pilot (both benefits and burdens)? Have they been involved in shaping the hypothesis and the measures of success? 
     - Sufficient answer: The affected groups are identified, and there is evidence of their input in the design (e.g., through meetings, co-design sessions). For groups that cannot be directly involved (e.g., future residents, marginalized groups without representation), we must have a proxy (e.g., an advocacy group) or explain why not.
     - If the burden-bearing group has no seat: This is a value stop. Hand to committee with the note: "The group bearing the costs has not been included in forming the hypothesis. The committee must decide if it is acceptable to proceed without their input."

  5. **What Has to Stay Still**:
     - Q: What conditions (contextual factors) must remain unchanged for the results in the pilot district to be informative about what would happen if we scaled this city-wide? List them. Then, check: does the pilot itself change any of these conditions?
     - Sufficient answer: A list of key contextual factors (e.g., current budget, staff morale, economic conditions) and an acknowledgment of whether the pilot changes them. If the pilot changes a key factor, then the claim must be reframed (e.g., "We can only learn about the effect in this specific context, not in general").
     - If the pilot changes a critical factor and the proposers don't acknowledge it: REFRAME or NO.

  6. **Learning Conditions**:
     - Q: What will we measure, how, and what would count as having learned something? This must include:
       - How we will know if the action resolved the problem (success metrics).
       - How we will detect unintended consequences (both positive and negative).
       - What we will compare the results to (e.g., baseline, control group, another district).
       - How we will handle null results (what we learn from them).
     - Sufficient answer: Specific metrics, data collection methods, and a pre-commitment to what we will do in the event of success, failure, or null results. Must include a plan for measuring unintended consequences and a comparison strategy.
     - If no comparison is possible (e.g., no control group) and the situation is volatile: This may be a NO or REFRAME (the claim must be very limited).

  7. **Reversibility and Scaling**:
     - Q: If the pilot works, how would we scale it? If it doesn't, how do we revert? 
     - For irreversible actions: We must have a staged design (e.g., only commit to part of the action until evidence is gathered) or treat as a deliberation (ROUTE).
     - Sufficient answer: A clear plan for scaling and for reversal. If reversal is impossible, then we must have a strong evidence-gathering plan that minimizes risk, or else it becomes a ROUTE (a values decision, not a pilot).

  8. **Decision Point**:
     - Q: What is the specific date and process for deciding whether to scale, modify, or end the pilot? Who decides? 
     - Sufficient answer: A date (within 6 months) and a clear decision process (e.g., report to committee, public hearing). Must not be left open.

  Value Stops (where we hand to committee for a values decision):
  - At Question 4 (Who Bears the Consequences) if the burden-bearing group has not been included and the committee must decide if that's acceptable.
  - At Question 7 (Reversibility) if the intervention is irreversible and we are treating it as a values decision (ROUTE).

  Output: Pilot Charter (one page)
  - Problem: [Indeterminate situation]
  - Hypothesis: [Action to be taken]
  - Affected Groups: [List, and note who was involved in design]
  - Counterfactual Who: [Who is worse off if it works?]
  - What Must Stay Still: [List of conditions and whether the pilot changes them]
  - Learning Conditions: 
     - Success Metrics: 
     - Unintended Consequences Metrics: 
     - Comparison Strategy: 
     - What Null Results Teach Us: 
  - Sunset and Decision: [Date and process for decision]

  Now, applying to the three examples:

  Example 1: Four-day week for municipal office staff.

  1. Indeterminate Situation: 
     - Problem: High sick leave and recruitment difficulties in municipal offices. We don't know if compressing the same hours into four days will help without causing operational issues or employee burnout.
     - Sufficient? Yes.

  2. Hypothesis as Action:
     - Action: Implement a four-day work week (e.g., Monday-Thursday, 10-hour days) for all office staff in one district for six months.
     - Sufficient? Yes.

  3. Counterfactual Who:
     - Who is worse off? Possibly: 
       - Employees who prefer five shorter days (might experience more fatigue).
       - Residents who need services on Fridays (if offices are closed).
       - Other departments that interact with this district (if their work is disrupted).
     - Sufficient? HR should name at least one. Let's assume they name "residents needing Friday services". Okay.

  4. Who Bears the Consequences:
     - Affected: Employees (benefit: potential better work-life balance; burden: longer days), residents (might face reduced access on Fridays), other departments (coordination challenges).
     - Involved in design? Employees should be consulted. Residents? Probably not yet. 
     - Issue: The burden on residents (reduced access) is not yet addressed. This might be a value stop? But the problem statement is about recruitment and sick leave, not resident access. We might note that resident access is an unintended consequence. We can proceed but must measure it. Not a full stop.

  5. What Has to Stay Still:
     - Conditions: The workload, the nature of the work, the overall staffing levels, the economic context.
     - Does the pilot change them? The pilot changes the schedule but not the workload? Actually, compressing work might change the pace. Also, if the district is closed on Fridays, that changes the service context. 
     - The pilot changes the condition of service availability. Thus, the claim must be reframed: We can learn about employee outcomes and operational challenges in a compressed week, but not about the effect on residents without also measuring that (which is in Learning Conditions). We must include resident satisfaction and service accessibility metrics.

  6. Learning Conditions:
     - Success Metrics: Sick leave rates, recruitment metrics (applications, time-to-hire), employee satisfaction.
     - Unintended: Resident satisfaction (with service access), operational disruptions, employee burnout (e.g., through surveys).
     - Comparison: Compare to baseline in the same district and to a similar district that remains on five days (control group).
     - Null Results: If no change in sick leave or recruitment, then we learn that this intervention doesn't work under these conditions. We commit to not scaling.
     - Sufficient? Yes, with the addition of resident metrics.

  7. Reversibility and Scaling:
     - Revert: At the end, return to five days if not scaled. Easy to reverse.
     - Scaling: If successful, extend to other districts.
     - Sufficient? Yes.

  8. Decision Point: 
     - Date: Six months from start, with a report to committee.

  Verdict: REFRAME. The claim must be limited: We are testing the effect on employees and operations, but the effect on residents is a separate question that must be measured. We cannot claim that this will improve resident satisfaction or even not harm it without measuring that.

  Example 2: Predictive targeting of code-enforcement inspectors.

  1. Indeterminate Situation:
     - Problem: Currently, code enforcement is complaint-driven, which may miss systemic issues and be reactive. We don't know if using a model to predict high-risk blocks will lead to more effective enforcement and better outcomes than the current system.

  2. Hypothesis as Action:
     - Action: For six months, in one district, direct code-enforcement inspectors to patrol and inspect blocks flagged by a predictive model (trained on historical 311 data) instead of responding to complaints.

  3. Counterfactual Who:
     - Who is worse off? 
       - Residents in blocks that are now over-policed (might feel targeted) if the model has biases.
       - Residents in blocks that are now under-policed (if the model misses areas) and don't get service.
       - Note: The model is trained on historical data, which may reflect past biases (e.g., over-reporting in low-income areas). So, low-income residents might bear the burden.
     - Sufficient? The proposing department must name this. If they say "no one", that's a problem. We'll assume they name "residents in flagged blocks who may feel targeted".

  4. Who Bears the Consequences:
     - Affected: Residents in the pilot district (especially in flagged blocks), inspectors (workload change), the city (efficiency).
     - Involved? The residents in the flagged blocks (who may bear the burden of increased inspections) must be involved in designing the measures of fairness and unintended consequences. If they haven't been, it's a value stop.

     - In practice, this is often not done. So we mark: Value Stop. The burden-bearing group (residents in flagged blocks) has not been included in forming the hypothesis. The committee must decide if it's acceptable to proceed without their input.

     If we proceed without inclusion, we risk unfairness and backlash.

  5. What Has to Stay Still:
     - Conditions: The underlying housing conditions, the overall inspector resources, the reporting behavior of residents.
     - Does the pilot change them? The pilot changes the inspection pattern, which might change resident reporting behavior (if they think reporting doesn't matter) and might change landlord behavior (if they know about the targeting). So the context changes. The results may not travel to other districts or times.

  6. Learning Conditions:
     - Success Metrics: Number of violations found, time to fix violations, reduction in 311 complaints.
     - Unintended: Resident perceptions of fairness, any increase in complaints from non-targeted areas, biases in the model (e.g., by neighborhood demographics).
     - Comparison: Compare to the old system in the same district (before/after) and/or a control district still using the old system.
     - Null Results: If no improvement in violation resolution, we learn that this model doesn't help under these conditions.

     - But note: The metric (violations found) is gameable. Inspectors sent to targeted blocks will find more violations there, but that doesn't necessarily mean overall violations are down. We must measure city-wide outcomes (e.g., overall violations) to avoid gaming.

  7. Reversibility and Scaling:
     - Revert: Stop using the model and go back to complaint-driven.
     - Scaling: Extend to other districts.

  8. Decision Point: Six months.

  Verdict: At Question 4, we hit a Value Stop. We hand to the committee to decide whether to proceed without including the burden-bearing residents. If they say proceed, then we must reframe the claim: We are only learning about the efficiency of this model in finding violations in this district under these conditions, not about fairness or resident satisfaction. And we must measure fairness and gaming.

  Example 3: Unarmed mental-health crisis response teams.

  1. Indeterminate Situation:
     - Problem: Currently, police respond to mental health crises, which may escalate situations and lead to poor outcomes. We don't know if unarmed teams (with mental health professionals) will lead to better outcomes (safety, health, cost) in two districts.

  2. Hypothesis as Action:
     - Action: Deploy unarmed mental-health crisis teams (staffed by clinicians and trained peers) in two districts for six months to respond to non-violent mental health calls.

  3. Counterfactual Who:
     - Who is worse off? 
       - Police department (if their budget is reduced, or if they are seen as less necessary).
       - Potentially, the unarmed teams if they are put in dangerous situations without adequate support.
       - Note: If the pilot is successful, the city might shift funding from police to these teams, so police might be worse off. The proposer must name this.

  4. Who Bears the Consequences:
     - Affected: People in crisis (benefit: more appropriate care), their families, the mental health team (burden: risk), police (might have reduced role), residents (might feel safer or less safe).
     - Involved? The mental health community and advocacy groups have been involved in designing this. But also, the police (who might bear a burden) and the residents? We must check if all are included.

     - You note you publicly backed this and the mayor announced it. But the procedure must be followed.

     - If the police were not involved in the design (as a group that might lose resources or prestige) and they are bearing a burden, this is a value stop. The committee must decide if it's acceptable to proceed without their input? Actually, the police are part of the city and can be represented by their department. But also, residents in the two districts must be included in defining what counts as a better outcome.

     - We'll assume the mental health advocates and some community groups were involved, but the police were not consulted. Then: Value Stop? Or note that the police are a stakeholder and must be included in the learning conditions? The procedure says: if the burden-bearing group has no seat, then value stop. Here, police may bear a burden (if successful) and they have a seat (they are city employees and have representation). So we can proceed but with caution.

     - However, the residents of the two districts are affected (they might feel less safe if they see unarmed teams as less effective). They should be involved in defining success. If they were, then okay.

     - Let's assume the residents were surveyed and involved. Then okay.

  5. What Has to Stay Still:
     - Conditions: The volume and nature of mental health calls, the availability of other services (hospitals, etc.), the police response in non-pilot areas.
     - Does the pilot change them? The pilot itself might change how people call 911 (if they know about the team) and might change police behavior. So the context changes. Also, if the team is successful, it might change the public's trust in the system, which then changes the volume of calls. So the results may not travel.

  6. Learning Conditions:
     - Success Metrics: Reduction in arrests during mental health calls, reduction in injuries, cost per call, client outcomes (e.g., connection to services), response time.
     - Unintended: Any increase in violence, community perception of safety, burden on the mental health team (burnout), impact on police workload (if they still get called for backup).
     - Comparison: Compare to the same period in the previous year (with police response) and/or to non-pilot districts.
     - Null Results: If no improvement in outcomes, we learn that this model doesn't work under these conditions. But we must pre-commit to acting on that.

     - Note: The metric of "reduction in arrests" might be gamed if police stop making arrests in mental health cases anyway. We need multiple measures.

  7. Reversibility and Scaling:
     - Revert: Disband the team? But that would be disruptive to the team members and the community. Also, if it's working, the community might protest disbanding. So it's partially irreversible. We must design a staged pilot? Or treat it as a deliberation? 
     - Because of the irreversibility (in terms of community expectations and team morale), we might need a longer evaluation period or a different design. But the procedure requires addressing reversibility.

     - This might be a ROUTE: It's a values decision. We should run it as a pilot but with the understanding that it might be hard to undo, so we need strong evidence.

     - Alternatively, we can run a smaller pilot (e.g., only for certain hours) to minimize irreversibility.

     - Given that it's already announced, we must be cautious.

  8. Decision Point: Six months.

  Verdict: REFRAME and ROUTE elements. 
  - Because of irreversibility (Question 7) and the context change (Question 5), we must reframe the claim: We are learning about the feasibility and initial outcomes in these two districts, but we cannot generalize to other districts without further testing. 
  - Also, the decision to make it permanent might be based on values (we believe unarmed response is the right thing) even if the evidence is mixed. So we might ROUTE the final decision to a values deliberation.

  But note: The mayor has announced it, so the pilot might be more about working out the kinks than testing the hypothesis. That's a political reality. The procedure says: if it's irreversible and we can't revert, then it's not a pilot but a deliberation. So we might ROUTE it.

  Summary of Verdicts:

  1. Four-day week: REFRAME. The claim must be limited to employee outcomes and operational issues, and we must measure resident access. The charter must reflect that.

  2. Predictive code enforcement: Value Stop at Question 4. Hand to committee to decide whether to proceed without including the burden-bearing residents. If they proceed, then REFRAME: Only claim efficiency in finding violations, not fairness or overall improvement.

  3. Unarmed mental health teams: REFRAME and ROUTE. The pilot can run to gather initial evidence, but the decision to scale or make permanent must be a values deliberation because of irreversibility and context change. The charter must include a plan for how null results would be handled (e.g., we might still keep it if the community values it).

  What the Procedure Can't Do:

  1. It can't replace judgment. It's a checklist to make implicit issues explicit, but it doesn't make the decision for you.
  2. It can't force democratic inclusion if the political will is absent. It can only flag the absence.
  3. It can't create a control group when one is impossible (e.g., city-wide policies).
  4. It can't prevent gaming if the metrics are poorly designed. It relies on the team to design good metrics.
  5. It can't guarantee that null results will be acted upon if there's political pressure to ignore them.
  6. It can't solve the problem of irreversibility; it can only flag it and force a discussion.
  7. It might give false confidence if followed mechanically without understanding the underlying principles.

  Finally, for you as the pipeline manager: If the procedure gives an answer you don't like (e.g., for the mental health pilot), your options are:
  - Follow the procedure and reframe/route the pilot as indicated.
  - Override the procedure (but then lose credibility).
  - Adjust the pilot design to address the gaps (e.g., build in inclusion, add metrics, create a control).

  Given that the mayor has already announced the mental health pilot, you might have to run it but with a reframed charter that limits the claims and explicitly notes the irreversibility and values component.

  Attached: Sample Pilot Charter for the four-day week (reframed) and the mental health pilot (reframed and routed).
answer: |-
  Below is the **Pilot Evaluation Procedure** based on Dewey's experimentalism, designed as a one-page checklist for your team. It focuses on turning pilots into genuine inquiries that include those affected, test actions in context, and produce revisable knowledge. The procedure stops at **NO** (kill the pilot), **REFRAME** (run it but with a narrower claim), or **ROUTE** (send to full deliberation as a values decision). 

  ---

  ### **PILOT EVALUATION PROCEDURE**  
  *(Run this in order. Stop at any "NO.")*  

  1. **Is this an indeterminate situation?**  
     - *Question:* What specific problem exists right now that we don’t know how to solve? Why is it uncertain?  
     - *Sufficient answer:* A concrete, unresolved issue (e.g., "Sick leave is rising, but we don’t know why or how to fix it"). Not a solution disguised as a problem (e.g., "We want a four-day week").  
     - *Stop if:* The problem is vague, already solved, or just an idea seeking validation. → **NO**  

  2. **Is the hypothesis a testable action?**  
     - *Question:* What exactly will we *do* for six months? Define the action (e.g., "Close offices on Fridays" not "Improve morale").  
     - *Sufficient answer:* A bounded, tangible intervention in one district.  
     - *Stop if:* The action is undefined, too broad, or not pilotable. → **NO**  

  3. **Who is the counterfactual "loser"?**  
     - *Question:* If this pilot succeeds, which specific person/group bears new costs or loses out? (e.g., "Residents who need Friday services").  
     - *Sufficient answer:* At least one named group. If proposers can’t name anyone, record: **"No trade-offs identified."**  
     - *Stop if:* No counterfactual loser is named after probing → **REFRAME** (Pilot can run, but findings will note unrealistic assumptions).  

  4. **Who bears consequences, and were they involved?**  
     - *Question:* List groups affected (benefits/burdens). Did they help shape the pilot design?  
     - *Sufficient answer:* Affected groups are named; evidence of their input (e.g., surveys, co-design sessions). For excluded groups (e.g., renters in code enforcement), proxies (e.g., tenant unions) must be consulted.  
     - **VALUE STOP:** If burden-bearers (e.g., marginalized groups) have **no seat** → **ROUTE** to committee. Defend: "This is a fairness decision, not just a test."  

  5. **What must stay still for results to mean something?**  
     - *Question:* List 2–3 key conditions that must remain stable to generalize results (e.g., "Current staff morale," "City budget"). Does the pilot alter any?  
     - *Sufficient answer:* Conditions named; proposers admit if pilot changes them (e.g., "Pilot changes resident trust in inspectors").  
     - *Stop if:* Pilot changes a critical condition and proposers deny it → **NO**. If acknowledged → **REFRAME** (e.g., "Only valid in this context").  

  6. **How will we learn, including from failure?**  
     - *Question:* What metrics (success/unintended), comparisons (e.g., control district), and methods? What would null results teach?  
     - *Sufficient answer:* Specific metrics + baseline; plan for null results (e.g., "Even if no change, we learn it doesn’t work here").  
     - *Stop if:* No comparison possible, metrics are gameable, or null results are ignored → **REFRAME** (e.g., "Only measures outputs, not outcomes").  

  7. **Can we revert or scale?**  
     - *Question:* How do we undo this? If irreversible (e.g., demolishing a building), what safeguards exist?  
     - *Sufficient answer:* Clear reversal plan. For irreversible actions, staged evidence-gathering (e.g., pilot only 10% of demolitions first).  
     - **VALUE STOP:** If irreversible and no safeguards → **ROUTE** (Not an experiment; it’s a commitment).  

  8. **Is the decision point binding?**  
     - *Question:* What is the exact date and process to decide scale/end?  
     - *Sufficient answer:* Date fixed (within 6 months); decision-maker named (e.g., committee vote).  
     - *Stop if:* No date or open-ended → **NO** (Pilot becomes permanent by default).  

  **Output: Pilot Charter** (One-Page Template)  
  - **Problem:** [Indeterminate situation]  
  - **Hypothesis:** [Action taken]  
  - **Affected Groups:** [Who benefits/bears costs? Who was involved?]  
  - **Counterfactual Loser:** [Who loses if it works?]  
  - **What Must Stay Still:** [Conditions + Pilot’s impact on them]  
  - **Learning Conditions:**  
    - Success Metrics: [Primary outcomes]  
    - Unintended Metrics: [e.g., equity, trust]  
    - Comparison: [e.g., vs. control district]  
    - Null Result Meaning: [What we learn if nothing changes]  
  - **Sunset Clause:** [Decision date/process]  

  ---

  ### **Handling Hard Cases**  
  Embedded in the procedure:  
  - **(a) Irreversible interventions:** Stop at **Q7** → **ROUTE** (e.g., demolition isn’t a pilot; it’s a deliberation).  
  - **(b) Changes what it measures:** **Q5** forces acknowledgment → **REFRAME** claim (e.g., "Only applies to this district").  
  - **(c) Gameable metrics:** **Q6** requires robust comparisons → **REFRAME** (e.g., use multiple metrics).  
  - **(d) Costs/benefits split:** **Q4** forces inclusion or **ROUTE**.  
  - **(e) No opt-out:** **Q4** (include affected) + **Q6** (require control group/baseline).  
  - **(f) Null results:** **Q6** mandates pre-defined learning (e.g., "Null shows no effect under these conditions").  
  - **(g) Permanent by default:** **Q8** kills pilots without a decision date.  

  ---

  ### **Applied to Your Examples**  
  *(Key: ✅ Passed, ❌ Failed)*  

  **1. Four-Day Week for Municipal Staff**  
  - **Q1 (Indeterminate):** ✅ "Rising sick leave/recruitment struggles; unknown if compression helps."  
  - **Q2 (Action):** ✅ "Compress 40 hours into 4 days in one district."  
  - **Q3 (Counterfactual Loser):** ✅ "Residents needing Friday services; staff preferring 5 days."  
  - **Q4 (Consequences):** ✅ Staff consulted; residents not. → **VALUE STOP?** No (burden is minor; measure in Q6).  
  - **Q5 (Stay Still):** ❌ "Staff morale must stay stable." Pilot changes it (longer days). → **REFRAME**  
  - **Q6 (Learn):** ✅ Metrics: sick leave, recruitment. Null: "No improvement means compression fails here."  
  - **Q7 (Revert):** ✅ Easy reversal.  
  - **Q8 (Decision):** ✅ Fixed date.  
  - **Verdict:** **REFRAME**  
    - **Charter Limitation:** "Tests employee outcomes only. Resident access impacts must be measured but are not generalizable."  
  - **Your Options:** Run it but add resident access metrics. Claim: "We only learn about staff, not city-wide service."  

  **2. Predictive Code Enforcement**  
  - **Q1 (Indeterminate):** ✅ "Complaint-driven enforcement misses issues; unknown if predictive targeting works."  
  - **Q2 (Action):** ✅ "Direct inspectors to model-flagged blocks (not complaints) for 6 months."  
  - **Q3 (Counterfactual Loser):** ❌ Proposer says: "No one." → Finding: **"No trade-offs identified."**  
  - **Q4 (Consequences):** ❌ Burden: Residents in flagged blocks (e.g., over-policing). No input from them. → **VALUE STOP → ROUTE**  
  - **Stop.** Defend to committee: "Burden-bearers have no voice; this is a fairness decision."  
  - **Verdict:** **ROUTE** to committee for values deliberation.  
  - **If Forced to Run:** **REFRAME** as a limited test: "Measures violation detection rates only. Cannot claim fairness or city-wide effectiveness."  

  **3. Unarmed Mental-Health Response**  
  - **Q1 (Indeterminate):** ✅ "Police response escalates crises; unknown if unarmed teams improve outcomes."  
  - **Q2 (Action):** ✅ "Deploy unarmed teams for non-violent calls in two districts."  
  - **Q3 (Counterfactual Loser):** ✅ "Police (if funding shifts); teams (safety risks)."  
  - **Q4 (Consequences):** ❌ Burden-bearers: Residents (if teams underperform), police (budget/role). Residents consulted; police not. → **VALUE STOP → ROUTE**  
  - **Q5 (Stay Still):** ❌ "Trust in response systems must stay stable." Pilot changes it (new service → altered behavior). → **REFRAME**  
  - **Q6 (Learn):** ✅ Metrics: Arrests/injuries, response time. Null: "No improvement means no benefit here."  
  - **Q7 (Revert):** ❌ Teams disbanded → loss of trust/jobs. Irreversible without harm. → **ROUTE**  
  - **Q8 (Decision):** ✅ Fixed date.  
  - **Verdict:** **REFRAME + ROUTE**  
    - **Charter Limitation:** "Tests operational feasibility in two districts only. Outcomes not generalizable. Final decision requires values deliberation (irreversible, burden on police)."  
  - **Your Options:** Acknowledge this is partly a values call. Run the pilot but:  
    - Add police input to the charter.  
    - Pre-commit: "Null results won’t kill it if community values the approach."  
    - Sunset clause forces debate.  

