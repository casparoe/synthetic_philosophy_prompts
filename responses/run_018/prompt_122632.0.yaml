  ### **What the Procedure Can’t Do**  
  **Present this to your committee to prevent over-trust:**  
  1. **False Confidence:**  
     - The checklist exposes flaws but doesn’t fix them. E.g., **Q5** flags context changes but can’t make results generalizable.  
     - It won’t detect subtle gaming of metrics (**Q6**); your team still needs skepticism.  

  2. **Values Masked as Facts:**  
     - **Q4** and **Q7** force value decisions into the open but can’t resolve them. The committee must own these.  

  3. **Political Reality:**  
     - Won’t stop mayoral interference or pilots that "must happen." It flags the conflict (e.g., mental health **ROUTE** verdict) but can’t enforce neutrality.  

  4. **No Statistical Rigor:**  
     - Requires comparisons (**Q6**) but can’t create valid control groups. Null results (**f**) are recorded but may still be ignored if unpopular.  

  5. **Inclusion Gaps:**  
     - Forces naming excluded groups (**Q4**) but can’t ensure their input is meaningful. Tokenism risks remain.  

  6. **Edge Cases:**  
     - City-wide pilots (**e**) can’t have opt-outs; the procedure only mitigates (via baselines). Irreversible actions (**a**) become deliberative by default.  

  7. **Human Bias:**  
     - It’s a vocabulary for decisions, not a neutral tool. Teams may still rationalize pet projects (e.g., your mental health pilot).  

  **Recommendation:** Pair this with a 30-minute team training on spotting "plausible answers" (e.g., "If Q3’s 'counterfactual loser' is vague, dig deeper"). Pilot the procedure on 2–3 proposals first to refine it.
