answer: |-
  ### **The Ontology Negotiation Challenge: A 70-Minute Classroom Activity**  
  **Goal:** Make graduate students *experience* verbal disputes vs. real metaphysical disagreements through a co-op charter negotiation. They’ll start arguing substantively, then realize they’re talking past each other despite agreeing on concrete outcomes.  

  **Materials Needed:**  
  - 4 pairs of hidden "Ontological Manuals" (2 manuals/pair):  
    - **Sparse Manual** (for 4 students): *"Only concrete entities exist: physical people, buildings, written contracts. Reject abstracta (e.g., ‘corporate persons’, ‘probabilities’, ‘modal properties’). Use reductive language (e.g., ‘members collectively owe’ NOT ‘the co-op owes’)."*  
    - **Abundant Manual** (for 4 students): *"Abstract entities exist: corporate persons, probabilities, modal properties (e.g., possible outcomes). Use ontological language (e.g., ‘the co-op is liable’, ‘30% chance of failure’)."*  
  - **Charter Prompt Handout** (per pair):  
    > Draft 3 articles for the **Greenhill Co-op Charter** using *existence-claims*:  
    > 1. **Liability**: Who/what *exists* to bear liability for damages?  
    > 2. **Risk**: How does the co-op *quantify and act* on risks?  
    > 3. **Membership**: What *entities* can be members?  
    > **Payoff**: +10 points if the charter is internally consistent. −3 points per contradiction (e.g., "the co-op exists" vs. "only members exist").  
  - Timer, whiteboards, pens.  

  ---

  ### **Activity Timeline (70 Mins Total)**  

  #### **0–10 min: Setup & Role Assignment**  
  - **Instructor Intro (5 min)**:  
    - *"You’re co-founders of Greenhill Co-op, drafting a legal charter. Your goal is internal consistency—contradictions cost funding. Catch: each of you has a hidden ‘ontological manual’ guiding what you believe *exists*."*  
    - Assign pairs and roles **within pairs**:  
      - **Draftsperson**: Leads writing each article (must use *existence-language*).  
      - **Skeptic**: Challenges ontological commitments (e.g., *"Does the co-op *really* owe damages, or just its members?"*).  
    - *Switch roles after each article.*  
  - **Pair Prep (5 min)**:  
    - Distribute manuals (hidden from partner).  
    - Clarify: *"Don’t reveal your manual—argue from your ontology. Use ‘exists’, ‘is real’, ‘is a property’ in your clauses."*  

  #### **10–45 min: Drafting Rounds (3 × 10 min/articles + 5 min transitions)**  
  - **Rules**:  
    - Draft one article at a time.  
    - Skeptics must challenge *ontological commitments* (not practical outcomes).  
    - Instructor circulates, nudging: *"Use your manual’s existence-language!"*  
  - **Article Prompts**:  
    1. **Liability (10 min)**: *"Draft a clause: If a co-op building collapses, what *entity* owes damages? Specify what *exists* to be liable."*  
       - *Predictable dispute*: Sparse: *"Members owe collectively—no ‘co-op entity’ exists!"* vs. Abundant: *"The co-op *is* a person that owes damages!"*  
    2. **Risk (10 min)**: *"Draft a clause: How does the co-op handle risk? Use *quantifiable existence* (e.g., ‘probability’)."*  
       - *Predictable dispute*: Abundant: *"There’s a 30% *chance* of failure—it’s real!"* vs. Sparse: *"30% is just a prediction—only *actual* failures exist!"*  
    3. **Membership (10 min)**: *"Draft a clause: What *entities* can be voting members? Can abstract entities join?"*  
       - *Predictable dispute*: Abundant: *"Corporate persons *exist* and can join!"* vs. Sparse: *"Only humans exist—no ‘corporate’ ghosts!"*  
  - **Transition (5 min)**: Groups finalize clauses. *"Notice if you’re rewriting each other’s language!"*  

  #### **45–55 min: Payoff & Contradiction Check (10 min)**  
  - Pairs audit their charters:  
    - **Consistency Check**: Scan for contradictions in existence-claims (e.g., "co-op is a person" in Article 1 vs. "only humans exist" in Article 3 = −3 points).  
    - **Group Report**: Each pair shares:  
      - Funding score.  
      - One clause they kept rewriting.  
      - *"When did you realize you agreed on outcomes but not on *what exists*?"*  

  #### **55–70 min: Debrief & Metaontology Lecturette (15 min)**  
  - **Reflection (5 min)**:  
    - *"Did you feel the slide from substantive disagreement to verbal dispute? When?"*  
    - *"You agreed on concrete outcomes (e.g., *who* pays damages) but fought over *ontological language*. Why?"*  
  - **Map to Theory (8 min)**:  
    - **Carnap’s Internal/External Distinction**:  
      - *Internal*: Disputes *within* a framework (e.g., "How *much* does the co-op owe?").  
      - *External*: Disputes *about* frameworks (e.g., "Does ‘co-op’ refer to a real entity?").  
      - *"Your arguments started internal (‘The co-op owes!’) but became external (‘What is the co-op?!’)."*  
    - **Sider’s Joint-Carving**:  
      - *"You acted like your manuals ‘carved reality at the joints’—but was the dispute about reality or language?"*  
  - **Honest Limitation (2 min)**:  
    - *"This activity *can’t* replicate the **linguistic framework-choice** aspect of deflationism. You were *stuck* in your manuals—you couldn’t pragmatically choose a framework. In deflationism, choosing ‘co-op exists’ is like choosing centimeters over inches: useful, not true/false. We’ll unpack this next class!"*  

  ---

  ### **Predictable First-Run Problems (and Fixes)**  
  1. **Problem**: Students compromise too fast, avoiding ontological clashes.  
     - *Fix*: Instructor intervenes: *"Skeptic—challenge that existence-claim! Draftsperson—defend your manual!"*  
  2. **Problem**: Arguments stay practical (e.g., "How much should we charge?").  
     - *Fix*: Require clauses to include "exists," "real," or "property"; give examples.  
  3. **Problem**: Frustration during drafting (e.g., *"Why won’t you say ‘the co-op’?!"*).  
     - *Fix*: Normalize it: *"That frustration is the point! You’re feeling the verbal dispute."*  
  4. **Problem**: Scoring confusion (e.g., missing subtle contradictions).  
     - *Fix*: Provide a cheat sheet: *Contradiction = existence-claim A directly negates B.*  

  **Why It Works**: Students *live* the shift from heated realism ("Probabilities are real!") to deflationary insight ("We mean the same thing with different words"). The payoff scheme forces attention to language, not just outcomes—setting up a rich debrief on metaontology’s core challenge.
