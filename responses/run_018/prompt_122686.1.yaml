prompt: |-
  I serve on a body that funds and ranks other organisations by measurable indicators, and I want the specification before I look at any framework. Please write the desiderata that an adequate theory of proxy failure would have to meet: the theory of the phenomenon that goes by the name of Goodhart's law in its original monetary-policy setting, and of specification gaming in the neighbourhood of that phenomenon.

  Fix the purpose as follows. The theory is for an auditor who holds historical records in which the indicator was merely observed and never optimised against, and who must decide in advance whether to make that indicator the basis of a payment, a league table or a regulatory target, and roughly how much optimisation pressure it can be expected to carry before it stops carrying information about the thing it was chosen for. It must therefore deliver more than a taxonomy of failure modes.

  I have provisional distinctions of my own and I want each of them vindicated, corrected, or dissolved into another:

  1. The redeployment gap: the difference between how an indicator behaves as an observation and how it behaves once it is made an incentive. Predicting this gap from passive data, before deployment, is the central thing I want from a theory; say whether that is a fair demand.
  2. Three mechanisms I keep conflating: drift, where the population under measurement changes for reasons unrelated to the incentive; erosion, where agents reallocate effort toward measured margins and away from unmeasured ones; and hijack, where the measured system models the indicator and aims at it directly. Are these three mechanisms, one mechanism at three levels of pressure, or two (adaptive and non-adaptive)?
  3. Hard targets versus construct-deficient targets: cases where the target has no definition independent of our measurement practices, so that there is no ground truth against which the indicator could decay. A theory that only works where the target is already well measured is nearly useless to me, but I suspect this requirement is very expensive.
  4. Benign pressure: cases where pushing hard on an indicator improves the target anyway, because the indicator is causally load-bearing or partly constitutive of the target. The theory must explain why some indicators tolerate unbounded optimisation while others invert in the tail.
  5. The audit regress: patching a gamed indicator with a second indicator designed to detect gaming of the first, and a third to detect gaming of the second. Must a theory say whether and where this terminates?

  For each requirement, give the case or consideration that motivates it, and mark it as non-negotiable or as a preference of one camp. I suspect, for instance, that the demand that a sound indicator be causally upstream of its target is a prejudice of the causal-invariance camp, and that the demand for a quantitative degradation threshold is a prejudice of the econometric camp; argue me out of either if I am wrong.

  The part I most want is this: I expect some subset of the desiderata to be jointly unsatisfiable, and I want the list itself to come out as an impossibility result with a menu of trades. My candidate subset is: predicting the redeployment gap in advance from passive data; doing so without assuming anything untestable about how the residual — the part of the target the indicator does not capture — behaves off the observed support; remaining informative for construct-deficient targets; and holding up against an optimiser that models the metric. Tell me which of these cannot be had together, why, and what has to be traded for what.

  Finally, say which single requirement does the most work in excluding candidate accounts. Score the main families only in a compact table at the end, a line or two each — the accounts that treat failure as selection on noise in a noisy proxy, those that require invariance of the proxy–target relation under the intervention of optimising it, those that treat it as optimising a low-dimensional projection of a high-dimensional target, those that model it as effort substitution along unmeasured margins in a multi-task incentive problem, and those that treat it as adversarial. Keep the weight on the criteria.
reasoning: |-
  We are constructing desiderata for a theory of proxy failure (Goodhart's law / specification gaming) for an auditor who must decide whether to use an indicator as the basis for incentives, based on historical passive data. The theory must predict how much optimization pressure the indicator can bear before it becomes uninformative about the underlying target.

  We address the provisional distinctions:

  1. **Redeployment gap**: The difference between the indicator's behavior when passively observed and when used as an incentive. The auditor wants to predict this gap from historical passive data. This is a fair and central demand because the auditor must anticipate how the indicator will change when incentivized. However, note that predicting the gap without any active intervention (i.e., without having deployed the incentive) is challenging and may require strong assumptions.

  2. **Mechanisms (drift, erosion, hijack)**:
     - **Drift**: Changes in the population or environment that are unrelated to the incentive. This is non-adaptive (exogenous).
     - **Erosion**: Agents reallocate effort from unmeasured to measured margins. This is adaptive (endogenous, but unintentional from the system's perspective?).
     - **Hijack**: Agents model the indicator and directly aim at it (e.g., adversarial attacks). This is adaptive and intentional.
     These are three distinct mechanisms, but they can occur at different levels of optimization pressure. Drift can occur without any optimization pressure (e.g., natural shifts). Erosion typically occurs under moderate pressure when agents are responsive but not sophisticated. Hijack occurs under high pressure when agents have the capability to model and game the system. They are two fundamentally different categories: non-adaptive (drift) and adaptive (erosion and hijack). However, erosion and hijack are both adaptive, but hijack requires more sophistication.

  3. **Hard targets vs construct-deficient targets**: 
     - Hard targets: well-defined, independent of measurement (e.g., profit).
     - Construct-deficient targets: no clear definition independent of measurement (e.g., student learning, which we measure by tests but which is a complex construct). The theory must handle construct-deficient targets because many real-world targets (like educational outcomes) are of this type. This requirement is expensive because without a ground truth, we cannot directly measure decay.

  4. **Benign pressure**: Some indicators can be optimized without harm (e.g., revenue in a well-functioning market). The theory must explain why: because the indicator is causally upstream (causing the target) or constitutive (part of the target). However, note that even in benign cases, excessive pressure might lead to problems (e.g., short-term revenue maximization at the expense of long-term health). The theory must explain the conditions under which optimization is safe and when it inverts.

  5. **Audit regress**: The practice of layering indicators to detect gaming. The theory should say whether this terminates. It might not terminate because each new indicator can be gamed. However, in practice, it might terminate if we can find an indicator that is robust (e.g., via randomized monitoring). The theory should indicate when termination is possible (e.g., when the target is hard and measurable with noise) and when it is not (e.g., for construct-deficient targets).

  Now, the desiderata for the theory:

  1. **Predict the redeployment gap from passive data** (central, non-negotiable for the auditor's purpose). 
     - Motivation: The auditor must forecast the effect of making the indicator an incentive without having deployed it.
     - Challenge: Without active data, we must rely on assumptions about agent behavior under incentives.

  2. **Distinguish between drift, erosion, and hijack** (preference, but important for diagnosis and intervention). 
     - Motivation: Different mechanisms require different remedies (e.g., drift might require monitoring the environment, erosion might require broadening the indicator, hijack might require robustness techniques).

  3. **Handle construct-deficient targets** (non-negotiable, because many real targets are of this form). 
     - Motivation: Without this, the theory is inapplicable to many important domains (education, health, etc.).

  4. **Explain benign vs harmful optimization** (non-negotiable). 
     - Motivation: We need to know when an indicator can be safely optimized and when it will break.

  5. **Address the audit regress** (preference). 
     - Motivation: The auditor must know if there is a way to build a robust system of indicators.

  Additionally, we must consider:

  6. **Quantify the tolerable optimization pressure** (non-negotiable). 
     - Motivation: The auditor needs to know "how much" optimization the indicator can bear.

  7. **Work without untestable assumptions about off-support behavior** (non-negotiable). 
     - Motivation: Historical data only covers the observed support. Extrapolation is risky and must be justified.

  8. **Be robust to sophisticated optimizers** (non-negotiable). 
     - Motivation: In many settings, agents are adaptive and strategic.

  Now, the candidate impossibility: predicting the redeployment gap from passive data, without untestable off-support assumptions, for construct-deficient targets, and against a sophisticated optimizer. We suspect that not all can be satisfied simultaneously.

  Analysis:

  - Without off-support assumptions, we cannot predict how the system will behave under optimization (which may push the system to regions outside the historical support). This is especially critical for adaptive agents (erosion, hijack) because their behavior may change in unobserved ways.
  - For construct-deficient targets, we lack a ground truth, so we cannot measure decay directly. We must rely on the indicator itself or other proxies, which may be gamed.
  - A sophisticated optimizer (hijack) can actively search for ways to manipulate the indicator that are not in the historical data.

  Therefore, the set {predict gap from passive data, no off-support assumptions, construct-deficient targets, robust to sophisticated optimizer} is likely impossible. Why?

  - To predict the gap without off-support assumptions, we need either:
    (a) The indicator-target relationship to be stable under intervention (causal invariance) and the optimization not to push the system too far from the support (which we cannot guarantee without off-support assumptions), or 
    (b) A model of agent behavior that is validated off-support (which we don't have from passive data).

  - For construct-deficient targets, we cannot validate the model against ground truth, so we cannot know if the gap prediction is accurate.

  - A sophisticated optimizer will actively try to break the indicator in ways not seen in passive data, making prediction from passive data impossible without strong assumptions about the optimizer's capabilities and constraints.

  Thus, we must trade:

  - **Option 1**: Drop "without off-support assumptions". We assume the relationship holds off-support (e.g., linearity) or we use domain knowledge to bound behavior. This is common in econometrics but risky.

  - **Option 2**: Drop "construct-deficient targets". We assume we have a ground truth for validation, which is often not available.

  - **Option 3**: Drop "robust to sophisticated optimizer". We assume agents are myopic or non-strategic, which is unrealistic in high-stakes settings.

  - **Option 4**: Drop "predict from passive data". We run small-scale experiments to observe the gap, but this may be costly or unethical.

  The auditor's problem is fundamentally hard because we are trying to predict the effect of an intervention (making the indicator an incentive) on a complex adaptive system without experimental data and without a ground truth.

  Now, the requirement that does the most work in excluding candidate accounts: **predicting the redeployment gap from passive data without off-support assumptions and for construct-deficient targets**. This is because most accounts rely on having a well-defined target or on extrapolating from historical data, which is inadequate for construct-deficient targets and off-support behavior.

  Finally, we score the main families of accounts in a table:

  | Account Family | Key Idea | How it fares against desiderata |
  |----------------|----------|--------------------------------|
  | **Noisy Proxy** (e.g., econometric) | Proxy = target + noise. Failure due to noise amplification. | Fails on construct-deficient targets (no clear target) and adaptive agents (noise may become non-random). Cannot predict gap without off-support assumptions (noise distribution may change). |
  | **Causal Invariance** | Requires the proxy-target relationship to be invariant under intervention. | Explains benign pressure (if proxy causes target) but fails for construct-deficient targets and when the relationship is not invariant. Cannot handle hijack (which breaks invariance). |
  | **Low-Dimensional Projection** | Target is high-dimensional; proxy is a projection. Optimization distorts the projection. | Handles erosion and hijack as distortions. But cannot quantify pressure without knowing the full target. Fails for construct-deficient targets (no full target). |
  | **Multi-Task Effort Substitution** | Principal-agent model with multiple tasks. Effort diverted to measured tasks. | Explains erosion, but not drift or hijack. Can quantify pressure if effort costs are known (which they aren't in passive data). Fails for construct-deficient targets (requires a well-defined set of tasks). |
  | **Adversarial** | Agents actively try to game the system. | Captures hijack, but not drift or erosion. Predicts gap only if we know adversary's capabilities (which we don't from passive data). Fails without off-support assumptions. |

  Conclusion: No single account satisfies all desiderata. The multi-task model comes closest for erosion but fails on other fronts. The auditor must choose an account that best fits their domain and accept the limitations.
answer: |-
  Below are the desiderata for an adequate theory of proxy failure (Goodhart's law/specification gaming), structured around your provisional distinctions and purpose. The theory must enable an auditor to predict, from **passive historical data**, how an indicator will degrade under optimization pressure when redeployed as an incentive (payment, league table, or regulatory target). I address your distinctions, derive core requirements, identify trade-offs in an impossibility result, and evaluate candidate accounts. Desiderata are marked as **non-negotiable** (essential for the auditor's purpose) or **preference** (reflects philosophical camps).

  ---

  ### **Desiderata for a Theory of Proxy Failure**
  **Core Purpose**: Predict the *redeployment gap* (how an indicator degrades under optimization pressure) from passive data alone, quantifying tolerable pressure before the indicator loses informativeness about the target.

  1. **Predict the Redeployment Gap from Passive Data**  
     - **Motivation**: Auditors lack experimental data from active optimization; they must forecast degradation using only historical observations. This demands causal inference from observational data (e.g., detecting latent vulnerabilities like correlated effort allocation).  
     - **Status**: **Non-negotiable**. This is the central task. However, it is a *fair but incomplete demand*: passive data alone cannot reveal counterfactual agent responses to incentives without strong assumptions (e.g., invariance of relationships).  
     - **Correction**: Your focus on prediction is valid, but passive data *must* be supplemented with:  
       - Tests for agent adaptability (e.g., responsiveness to past incentives).  
       - Causal structure (e.g., via instrumental variables).  
     - *Why not a prejudice?* Neither "causal-invariance" nor "econometric" camps own this; both agree prediction is central but diverge on methods.

  2. **Distinguish Drift, Erosion, and Hijack Mechanisms**  
     - **Motivation**:  
       - *Drift*: Exogenous shifts (e.g., demographic changes in a school population affecting test scores).  
       - *Erosion*: Effort substitution (e.g., teachers "teaching to the test" at the expense of broader skills).  
       - *Hijack*: Direct gaming (e.g., students memorizing answers via leaked tests).  
       Auditors must diagnose causes to design mitigations (e.g., drift requires stability controls, hijack requires robustness).  
     - **Status**: **Preference** (reflects multi-mechanism views vs. unitary "adaptive pressure" camps).  
     - **Clarification**: These are **three distinct mechanisms**, not levels of pressure:  
       - Drift is *non-adaptive* (no agent intent).  
       - Erosion and hijack are *adaptive* (intentional effort shifts).  
       - Hijack is a subset of adaptive responses requiring modeling capability.  
     - *Why not levels?* Drift can occur at low pressure; erosion at moderate; hijack at high. But they can co-occur (e.g., erosion enabling drift). A theory must separate them to prescribe interventions.

  3. **Handle Construct-Deficient Targets**  
     - **Motivation**: Many targets (e.g., "student development" or "ecosystem health") lack gold-standard measurements. Theories assuming well-defined ground truth (e.g., profit) fail here.  
     - **Status**: **Non-negotiable**. Without this, the theory is useless for policy/auditing, where constructs dominate.  
     - **Cost**: This is expensive. It requires:  
       - Defining the target via *consensus indicators* (e.g., multiple proxies).  
       - Modeling the *measurement process itself* (e.g., how proxies co-vary).  
     - *Why not a prejudice?* Econometric camps often reject this (demanding "hard" targets), but causal-invariance camps accept it via interventional invariance.

  4. **Explain Benign vs. Harmful Optimization**  
     - **Motivation**: Some indicators (e.g., revenue in a competitive market) tolerate high pressure; others (e.g., click-through rates) invert (e.g., clickbait). The theory must identify when optimization improves the target (indicator is causal/constitutive) vs. when it diverges.  
     - **Status**: **Non-negotiable**. Auditors need to flag "safe" indicators (e.g., those with diminishing returns).  
     - **Correction**: You suspect causal upstreamness is a "causal-invariance camp" prejudice—**you are wrong**. Benign pressure arises from:  
       - *Causal roles*: Indicator causes target (e.g., revenue → profit).  
       - *Constitutive roles*: Indicator is part of target (e.g., test scores in educational outcomes).  
       Even constitutive indicators can invert (e.g., test scores overemphasized), so a theory must quantify *nonlinearities* (e.g., saturation points).  
     - *Quantitative threshold*: A demand for degradation thresholds is **not** an econometric prejudice; it is necessary for auditors (e.g., "pressure > X causes erosion").

  5. **Resolve the Audit Regress**  
     - **Motivation**: Layering proxies (e.g., auditing test scores with random assessments) invites infinite regress. Auditors need to know if this terminates (e.g., at a robust metric).  
     - **Status**: **Preference** (pragmatic vs. theoretical camps).  
     - **Requirement**: The theory must specify conditions for termination:  
       - *Hard targets*: Regress terminates if a gold-standard metric exists (e.g., profit).  
       - *Construct-deficient targets*: Termination requires *mutually reinforcing indicators* (e.g., diverse metrics that co-vary under intervention).  
     - *Trade-off*: Non-termination is likely for hijack-prone systems; the theory should flag when regress is futile.

  ---

  ### **Impossibility Result: The Auditor's Trilemma**
  Your candidate subset is **jointly unsatisfiable**:  
  - **Predict redeployment gap from passive data**.  
  - **No untestable off-support assumptions** (e.g., residual behavior beyond observed data).  
  - **Handle construct-deficient targets**.  
  - **Hold up against a sophisticated optimizer** (hijack).  

  **Why they conflict**:  
  1. **Off-support behavior is unavoidable**: Passive data only covers historical, non-optimized states. Hijack (or high-pressure erosion) pushes the system into unobserved regions. Predicting degradation requires extrapolation, which demands untestable assumptions (e.g., "residuals are homoscedastic") or causal models (e.g., "no unmeasured confounders").  
  2. **Construct deficiency compounds uncertainty**: Without ground truth, you cannot validate off-support predictions. Sophisticated optimizers exploit this by creating novel pathologies (e.g., adversarial examples).  
  3. **Sophisticated optimizers break passive-data inference**: They introduce *strategic feedback* (e.g., agents preemptively gaming before deployment), which historical data cannot capture.  

  **Trade-offs required**:  
  - **Option 1: Drop "no off-support assumptions"**.  
    - Trade: Accept untestable assumptions (e.g., functional form of decay) to predict gap for construct-deficient targets.  
    - Cost: Risk of model misspecification; auditors must justify assumptions (e.g., via sensitivity analysis).  
  - **Option 2: Drop "handle construct-deficient targets"**.  
    - Trade: Assume a well-defined target to predict gap under hijack.  
    - Cost: Theory fails for most real-world audits (e.g., education, healthcare).  
  - **Option 3: Drop "hold up against sophisticated optimizer"**.  
    - Trade: Assume bounded rationality (e.g., agents only exhibit erosion, not hijack) to predict gap from passive data.  
    - Cost: Underestimates degradation in high-stakes settings (e.g., finance).  

  **Least feasible combination**: Retaining all four. Example: Predicting hijack for "student well-being" (construct-deficient) from past data without off-support assumptions is impossible—optimizers will invent gaming tactics outside historical support.

  ---

  ### **Most Exclusionary Requirement**  
  **Handling construct-deficient targets** does the most work in excluding theories. It demands:  
  - No reliance on ground-truth validation.  
  - Integration of measurement theory (e.g., how proxies relate to latent constructs).  
  - Resistance to *reification* (treating the proxy as the target).  
  This immediately disqualifies accounts that require well-defined targets (e.g., noisy-proxy or low-dimensional projection theories). It forces the theory to model the *epistemology of measurement*, which many accounts ignore.

  ---

  ### **Evaluation of Candidate Accounts**  
  Accounts scored against desiderata (✔: strong, △: partial, ✖: weak). "Passive data" and "construct deficiency" are pivotal.

  | Account Family                  | Key Idea                                                                 | Desiderata Performance                                                                                               | Fatal Flaw for Auditor                                                                 |
  |---------------------------------|--------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------|
  | **Noisy Proxy** (Econometric)   | Indicator = target + noise; failure from noise amplification under optimization. | △ Passive data (if noise estimable); ✖ Construct deficiency; △ Benign pressure; ✖ Hijack.                        | Assumes target is well-defined and separable; fails for constructs.                    |
  | **Causal Invariance**           | Proxy must be causally upstream; failure if intervention breaks invariance.          | △ Passive data (with causal identifiability); △ Construct deficiency; ✔ Benign pressure; ✖ Hijack.              | Requires causal structure knowledge; hijack violates invariance.                       |
  | **Low-Dimensional Projection**  | Target is high-dimensional; optimization distorts the proxy's projection. | ✖ Passive data (needs full target); ✖ Construct deficiency; △ Benign pressure; △ Hijack.                      | Relies on knowing the "true" target dimensionality; circular for constructs.         |
  | **Multi-Task Effort Substitution** | Principal-agent problem; effort diverted to measured margins.         | ✔ Passive data (if effort costs observable); △ Construct deficiency; ✔ Erosion; △ Hijack; ✔ Quantitative pressure. | Assumes tasks are known; cannot handle drift or hijack without extensions.          |
  | **Adversarial**                 | Agents game the metric; failure as min-max optimization.                | △ Passive data (if attacker behavior modeled); △ Construct deficiency; ✖ Benign pressure; ✔ Hijack.             | Predicts degradation only with known attacker capabilities; ignores non-adaptive drift. |

  **Summary**:  
  - **Best for auditors**: **Multi-task effort substitution** (addresses erosion, quantitative pressure, and passive data) but requires augmenting with drift/hijack mechanisms.  
  - **Worst**: **Low-dimensional projection** (fails without ground truth) and **noisy proxy** (ignores adaptation).  
  - **Trade-off necessity**: No theory satisfies all desiderata; auditors must prioritize (e.g., sacrifice hijack resistance for construct deficiency).  

  ---

  ### **Recommendations for Theory Development**  
  1. **Start with multi-task models**: Extend them with strategic (hijack) and non-adaptive (drift) components.  
  2. **For passive data**: Use *mediator analysis* (e.g., detect effort-substitution precursors) and *stress-test* with synthetic optimization (e.g., "what if we maximized this indicator?").  
  3. **For construct deficiency**: Employ *multi-proxy consensus* (e.g., indicators that covary under intervention).  
  4. **Quantify pressure**: Express as a function of agent adaptability (e.g., via responsiveness elasticities).  

  Adequate theories must blend causal inference, measurement theory, and strategic interaction—but your "trilemma" implies unavoidable compromises on off-support extrapolation or optimizer sophistication.
