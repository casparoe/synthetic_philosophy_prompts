  Let me walk through Camus's possible escape routes. The "active killing vs. passive dying" distinction (point 6) feels shaky because LWOP often involves conditions that accelerate death. Maybe Camus's redemption argument isn't about literal possibility but about the state's intentionality? Like, execution actively destroys redemption chances while imprisonment just... fails to facilitate them? That might preserve (2) without attacking LWOP. 

  But the user's right—if we go that route, (2) becomes secondary. Alternatively, if we treat redemption as central, we'd have to reject LWOP too, contradicting Camus. The user's dilemma is real: lose coherence or lose an argument. 

