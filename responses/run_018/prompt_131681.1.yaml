  The user's willingness to "pay a price" suggests they prioritize philosophical rigor over strict fidelity. I should lay out costs clearly: Keeping (1) as primary makes execution uniquely evil but softens (2)'s impact; keeping (2) prominent forces opposition to LWOP. 

