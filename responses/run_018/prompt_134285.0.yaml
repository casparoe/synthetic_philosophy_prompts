  Hmm, the stagnation likely stems from three deep divides: First, tracking theorists prioritize counterfactual robustness while closure defenders value deductive stability. These are fundamentally different virtues. Second, their "nearby worlds" criteria differ - skeptics include more remote possibilities. Third, they're solving different problems: anti-skepticism versus explaining everyday knowledge.

  The user's "stacked tracking" idea is perceptive. It shows how tracking conditions compound when beliefs chain together, making knowledge harder to maintain. This could be formalized with multi-premise tracking models, but I suspect it would just give tracking theorists more reasons to reject closure rather than bridge the gap.

