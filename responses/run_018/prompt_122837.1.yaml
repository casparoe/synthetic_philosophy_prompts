  Then the user introduces their two-lakes scenario. Two frog populations: one evolved with only flies and grit, the other with flies, grit, and seeds. When swapped, both frogs snap at grit, but according to teleosemantics, the west frog misrepresents grit as food while the east frog doesn't—because of their evolutionary history. The user thinks this is absurd since the frogs are physically identical. Their friend dismisses this as intuition without argument.

  The user wants to know who's right. Key questions: Is the "normal conditions" response valid? Did they misrepresent the theory? And does teleosemantics lead to the insane conclusion that identical frogs have different mental content?

  First, I need to unpack Millikan's theory. Proper functions are based on historical selection. Content is fixed by what a mechanism was selected to do. Normal conditions are part of this—environments where the mechanism worked. But the user's collapse argument says selection only cares about success, not truth. So if a state leads to success, even if false, it's "correct." In the frog case, snapping at grit might not be misrepresentation if it's not selected against. But Millikan would say misrepresentation occurs when the state is tokened outside normal conditions. The user's point is that "normal conditions" isn't well-defined and might be circular.

  The two-lakes scenario is critical. Here, the frogs are identical but have different histories. Teleosemantics says their content differs: west frog's detector means flies, east frog's means flies-or-seeds. So when both snap at grit, the west frog misrepresents (grit isn't a fly), but the east frog doesn't (grit isn't a fly-or-seed). The user finds this unacceptable because the frogs are physically identical. This challenges internalism about content. Teleosemantics is externalist—content depends on history/environment, not just internal state. But is this plausible? Some philosophers accept externalism (like Putnam's Twin Earth), so maybe not game over. But the user might not buy it.

  The friend's "normal conditions" defense: Millikan uses it to handle error. For the west frog, normal conditions are fly-filled, so grit is abnormal—misrepresentation. For east frogs, snapping at seeds was adaptive, so seeds are part of the content. But in the swapped environment, when an east frog snaps at grit, is that misrepresentation? Grit isn't a fly-or-seed, so maybe. But if seeds aren't present, snapping at grit might still be considered an error if grit isn't in the content. The user's point is that the historical definition of "normal conditions" leads to different contents for identical frogs, which seems counterintuitive.

  Is the user's collapse argument a strawman? Not really—it's a real objection (e.g., Fodor's disjunction problem). Teleosemantics tries to solve it with normal conditions, but critics say it's vague or circular. The user's argument is valid; whether it's fatal is debated. The two-lakes case highlights the externalism commitment. If the user rejects externalism, teleosemantics fails for them. But if externalism is acceptable, maybe it's tenable.

  The user might be annoyed because the friend dismissed their intuition. But in philosophy, intuitions are starting points. The user needs stronger arguments against externalism or showing circularity in "normal conditions." Also, they might want to know if there's a better theory or if teleosemantics can be fixed. Their deeper need: validation of their reasoning and clarity on whether teleosemantics is defensible. They might also want ammo for future debates.
answer: |-
  Based on your description, you're grappling with some of the most persistent and powerful critiques of teleosemantics (specifically Millikan-style "proper function" theories). Let's break down the core issues:

  1.  **Your "Collapse Argument" (Truth vs. Utility):**
      *   **You're fundamentally correct about the core problem.** This is arguably *the* central challenge for teleosemantics, often called the "Indeterminacy Problem" or the "Problem of Falsity." Your reasoning aligns with critiques from philosophers like Jerry Fodor and Fred Dretske.
      *   **Natural selection *does* select for mechanisms that produce *successful behavior* (survival/reproduction), not for mechanisms that produce *true representations*.** As you state, truth is irrelevant to Darwin; only consequences matter.
      *   **The "Collapse" Threat:** If the content of a mental state is defined solely by *what it causes the organism to do that was historically adaptive*, then whenever a state causes the *correct* behavior (snapping towards a fly *or* towards grit/seeds in the relevant contexts), it seems like it's doing exactly what it was *supposed* to do. How can it be *wrong*? This makes misrepresentation seem impossible. The state firing *is* the successful performance of its selected function in that context.

  2.  **The "Normal Conditions" Defense:**
      *   **Is it a dodge?** Not entirely, but it's highly problematic, as you intuit. Millikan explicitly relies on "Normal Conditions" to solve this exact problem. The idea is that a mechanism's proper function (and thus the content of the states it produces) is defined *relative to* the specific set of environmental conditions under which it was historically selected *to perform that function*.
      *   **How it's *supposed* to work (e.g., in the standard Frog case):**
          *   The fly-detector mechanism was selected *because*, under *normal conditions* (flies present, adequate lighting, no distracting grit storms, etc.), its firing reliably caused tongue-snapping behavior that captured flies.
          *   The *content* "Fly!" is fixed by what *caused* the mechanism to fire *in the conditions where that firing led to successful fly capture and thus selection.*
          *   When the mechanism fires in *abnormal* conditions (e.g., a lab with BBs, or a sudden gust of grit), the state is *mis*representing because the condition that *normally* caused its successful use (a fly) isn't present. The grit causes a state whose content is "Fly!" even though there is no fly.
      *   **Why it *feels* like a dodge (and often is):**
          *   **Circularity/Ad Hoc Risk:** Defining "Normal Conditions" independently of the very representational content you're trying to explain is extremely difficult. Critics argue that "Normal Conditions" often ends up meaning "the conditions under which the representation is *true*," which smuggles in the notion of truth/accuracy that the theory was supposed to naturalize. If "normal" just means "conditions where it tends to be true," the explanation becomes circular.
          *   **Vagueness:** What exactly constitutes the "Normal Conditions" for a given mechanism? How specific or broad are they? This is often underspecified and context-dependent.
          *   **Your Insight:** You're right that this move *can* feel like cheating. It's an attempt to carve out a space for error *within* a framework defined by success, but whether it successfully avoids presupposing intentionality/truth is highly debatable.

  3.  **Your "Two Lakes" Scenario:**
      *   **This is a Devastating Counterexample.** It brilliantly highlights the historical dependence and potential absurdity that critics see in teleosemantics.
      *   **The Teleosemantic Commitment:** Your friend is forced to bite the bullet here. According to strict Millikan-style teleosemantics:
          *   **West Lake Frog (transplanted to East):** Its visual mechanism was selected *only* in an environment where small dark moving things were overwhelmingly flies. Its firing was adaptive *because* it caused snapping at *flies*. Therefore, its content is something like **"Fly!"**.
          *   **East Lake Frog (transplanted to East):** Its *identical* visual mechanism was selected in an environment where small dark moving things were flies *or* seeds. Snapping at *both* was adaptive. Therefore, the content of its firing state is something like **"Nutritious Small Dark Moving Thing!"** (or a disjunctive content "Fly or Seed!").
      *   **The Consequence:** When both frogs sit by the same lake and snap at a piece of grit:
          *   The West Frog *misrepresents*: Its state means "Fly!", but there is no fly (only grit).
          *   The East Frog *does not misrepresent*: Its state means "Nutritious Small Dark Moving Thing!" (or "Fly or Seed!"). The grit *is* a small dark moving thing. It is *not* nutritious, but teleosemantics typically fixes content based on the *cause* that triggered the mechanism's *successful use* historically, not the actual nutritional value *per se*. Since grit wasn't a significant historical cause of the mechanism's *successful* firing (it didn't contribute to selection in the East), it might still be an error *if* the content implies nutrition, but this gets messy. Crucially, grit *is* a token of the type "small dark moving thing" that the mechanism was selected to detect. The state *accurately* represents that type, even if this token is inedible. So, at worst, the East Frog might be making a *different kind* of error (mistaking grit *for* a nutritious item), but not the *same representational error* as the West Frog.
      *   **The Problem:** As you point out, the frogs are **molecule-for-molecule identical**, in the **same current environment**, receiving the **same sensory input**, producing the **same behavior**, yet teleosemantics says they have mental states with **radically different contents**, and one is making a representational error while the other arguably isn't (or is making a different error). This seems deeply counterintuitive and violates the principle that identical internal states in identical current environments should have the same content. It makes content depend entirely on a hidden historical property.

  4.  **Is this "Game Over"?**
      *   **For Internalists:** Yes, absolutely. If you believe mental content must supervene solely on the current, intrinsic physical state of the organism (or its brain), then teleosemantics is a non-starter. Its commitment to **Externalism** (content depends on history/environment) is fundamental and inescapable.
      *   **For Externalists:** No, it's not necessarily game over. Teleosemanticists (like Millikan, Ruth Millikan, Karen Neander) *embrace* this consequence. They argue:
          *   **Content *is* historical:** Just like the function of a heart (to pump blood) depends on its evolutionary history and isn't solely defined by its current structure or what it *can* pump, mental content depends on the history of the mechanism producing it.
          *   **Twin Earth Intuitions:** They point to Putnam/Burge-style externalist thought experiments (e.g., Twin Earth water vs. XYZ) to argue that content *does* depend on external factors, not just internal state. Your Two Lakes scenario is seen as an extension of this externalism to historical properties.
          *   **Explanatory Power:** They argue the historical/externalist definition is necessary to solve the disjunction problem and ground genuine misrepresentation *within* a naturalistic framework, even if the consequences seem odd.
      *   **The Cost:** The cost is high: accepting that molecule-for-molecule duplicates *can* have different mental contents if their histories/environments differ. Many philosophers find this cost too great or simply counterintuitive.

  **Conclusion: Where Does That Leave Your Argument?**

  1.  **Your core critique (the collapse of truth into utility) is valid and potent.** It highlights the fundamental tension in teleosemantics. While the "normal conditions" move is the *intended* solution, its success is highly contested and arguably relies on presupposing the very notions it tries to explain or leads to problematic vagueness. **You are not attacking a strawman; you are attacking the heart of the problem the theory struggles with.**
  2.  **Your Two Lakes scenario is a powerful illustration of the theory's commitment to historical externalism.** Teleosemantics *is* committed to the West Frog and East Frog (molecule-for-molecule identical in the same current environment) having different representational contents purely based on ancestry. **This is not a misinterpretation; it's a core, intended consequence of the theory.** Whether this consequence is "insane" or a price worth paying is the central philosophical dispute.
  3.  **Who is "right"?** Philosophically, there is no definitive answer yet.
      *   **Your reasoning** exposes deep, unresolved problems in the most popular naturalistic theory of mental content. Many philosophers find these problems fatal.
      *   **Your friend's position** represents the mainstream defense of teleosemantics *within its own framework*, appealing to normal conditions and accepting historical externalism. However, simply *invoking* "normal conditions" doesn't magically solve the underlying tension you identified; it just names the proposed solution.
      *   **You are arguably "more right"** in the sense that your arguments successfully demonstrate the significant challenges and counterintuitive consequences that teleosemanticists must grapple with and have not yet fully resolved to everyone's satisfaction. You've hit legitimate nerves.

  The argument likely went in circles because teleosemantics is built to *try* to handle cases like the frog and grit via normal conditions, but the intuitions underlying your critiques (truth vs. utility, the implausibility of historical externalism for identical present states) run very deep and challenge the foundations. Neither of you was necessarily *wrong* about what the theory *says*; the disagreement is about whether what it says is *plausible* or *successful*. Your annoyance is understandable – these are genuinely difficult problems at the intersection of biology, philosophy of mind, and semantics!
