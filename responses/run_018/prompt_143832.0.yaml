  Here is your satirical FAQ for the **Office of Formal Preservation (OFP)**, exactly as requested – deadpan, bureaucratic, and playing up the absurdity of form-over-meaning translation dogma. A brief note on liberties taken follows the FAQ.

  ---

  # Office of Formal Preservation (OFP)
  **Division of Poetic Integrity & Rhythmic Compliance**
  **FREQUENTLY ASKED QUESTIONS: TRANSLATION LICENSING & MAROT METRIC ADHERENCE**

  **Q1: What is the OFP’s primary mission?**
  A: The Office of Formal Preservation safeguards the structural sanctity of translated verse. Our mandate, under the *Poetic Structure Preservation Act (PSPA) of 1987*, is to ensure that rhyme schemes, metrical patterns, syllable counts, and stanzaic architecture are preserved with absolute fidelity during translation. Meaning ("Semantic Content") is classified as a secondary, non-binding concern (See PSPA § 4.2c: "The Vessel Precedes the Cargo").

  **Q2: Why do I need an OFP Translation License?**
  A: Unlicensed translation poses a significant threat to Formal Integrity. Licensed Translators (LTs) are authorized to perform verse translation while adhering to OFP regulations. Unlicensed activity may result in Cease & Desist orders, fines for Unauthorized Semantic Drift (USD), and potential impoundment of rhyming dictionaries. License applications (Form OFP-TL/101) require passing the Rigorous Orthometric Proficiency Exam (ROPE).

  **Q3: What is the "Rhyme Bond"?**
  A: All LTs must post a non-refundable **Rhyme Bond** ($500 minimum, adjusted annually for inflation) prior to undertaking any translation project exceeding 12 lines. This bond guarantees strict adherence to the source poem's rhyme scheme (AABB, ABAB, terza rima, etc.). If the LT introduces a *slant rhyme* without prior Variance Permit (VP-7a) or, worse, breaks the rhyme scheme entirely, the bond is **automatically forfeited** to the OFP Rhyme Assurance Fund. Appeals require notarized documentation proving the rhyme break was caused by "Act of Lexical God" (e.g., no perfect rhyme existing in the target language *and* no suitable synonym within strict syllable limits).

  **Q4: Explain the Marot Metric Scoring System.**
  A: The **Marot Metric (MM)** is the OFP's official, algorithmic assessment of formal fidelity. Points are awarded per line for:
  *   **Syllable-for-Syllable Exactitude (SSE):** 10 pts (Perfect match), 5 pts (±1 syllable with VP-3b), 0 pts (Deviation >±1 syllable, automatic bond review).
  *   **Metronomic Consistency (MC):** 15 pts (Perfect meter replication: iambic pentameter stays iambic pentameter!), 7 pts (Minor substitution within foot type, e.g., trochee in iambic line), 0 pts (Metrical collapse, e.g., pentameter becoming tetrameter).
  *   **Rhymic Purity (RP):** 20 pts (Exact rhyme, perfect scheme), 10 pts (Permitted slant rhyme w/ VP-7a), -15 pts (Scheme break or unlicensed near-rhyme).
  *   **Bonus Points:** +2 pts per line for preserving archaic syntax if present in source; +1 pt per stanza for identical punctuation replication.
  An MM score below 70 triggers a mandatory Corrective Action Plan (CAP) audit. Scores above 90 qualify for the annual Clément Marot Medal of Mechanistic Excellence. *Semantic accuracy is not a scored component of the MM.*

  **Q5: What is "Semantic Drift" and how is it penalized?**
  A: **Semantic Drift (SD)** occurs when a translator prioritizes the conveyance of the original meaning, nuance, or emotional tone *at the expense* of formal structure (rhyme, meter, syllable count). This is a violation of the **Formalist First Doctrine**. SD is categorized and fined accordingly:
  *   **Minor SD (Level 1):** Slight meaning adjustment for rhyme ($25 fine + warning). E.g., Translating "love" as "affection" solely to rhyme with "perfection."
  *   **Moderate SD (Level 2):** Significant meaning shift or metaphor loss for meter ($100 fine + mandatory re-certification workshop). E.g., Changing "the raging sea of despair" to "the big sad water" to fit iambic trimeter.
  *   **Major SD (Level 3):** Meaning fundamentally altered or inverted to preserve form ($250 fine + 30-day license suspension + public reprimand published in *The Formalist Gazette*). E.g., Translating "freedom" as "obedience" because it rhymes perfectly with "compliance."
  Fines double for repeat offenses within a 24-month period. Payment is due within 30 days via OFP Portal (Convenience Fee applies).

  **Q6: Are there any acceptable reasons to deviate from form?**
  A: Deviation is strongly discouraged and requires pre-approval. Variance Permits (VPs) may be granted *only* if:
  1.  **Lexical Void:** No target-language word exists matching both syllable count *and* meaning within the required rhyme position (Documentation required: 3 rejected alternatives per slot).
  2.  **Cultural Orthometric Hazard:** Preserving the exact form would create an unintended obscene pun or culturally insensitive term in the target language (Requires Linguistic Hazard Assessment Report - LHAR/2).
  3.  **Unpronounceable Cluster:** Strict syllable/meter adherence creates a consonant cluster deemed "physiologically untenable" by a certified linguist (Form LP-44).
  *Note: "It sounded better" or "It made more sense" are NOT valid grounds for a VP.*

  **Q7: Where can I file a complaint about an unlicensed or non-compliant translation?**
  A: Use Form OFP-C/202 "Citizen Report of Poetic Malpractice." Provide the original text, the offending translation, and highlight the specific structural violations (rhyme break, meter shift, syllable discrepancy). Anonymous tips are accepted but ineligible for the 5% whistleblower bonus from forfeited Rhyme Bonds. Complaints undergo a 90-day review by the Bureau of Rhythmic Compliance.

  **Q8: How do I swear the Formalist Oath?**
  A: Upon license issuance, LTs must recite: *"I solemnly affirm that the shape is paramount, the sound is sacrosanct, and the sense is but a passenger within the vessel of form. So help me, Marot."* Failure to recite voids the license.

  ---

  **Note on Satirical Liberties & Interpretation:**

  1.  **Hofstadter/Marot Caricature:** Douglas Hofstadter's *Le Ton beau de Marot* is a profound, nuanced exploration of translation, using Clément Marot's short poem as a case study. Hofstadter *does* champion the incredible difficulty and value of preserving form (rhyme, meter) alongside meaning, but he absolutely **does not** advocate sacrificing meaning *entirely* for form as a dogma. He explores the *tension* and inevitable trade-offs. This parody massively exaggerates the prioritization of form into a ludicrous bureaucratic absolutism, turning Hofstadter's thought experiment into a rigid, penalizing system. The real Hofstadter celebrates the *attempt* and the *art*, not just the mechanical score.
  2.  **"Le Ton beau" Meaning:** The title itself is a punning translation challenge Hofstadter sets for himself. It doesn't literally mean "the beautiful tone of Marot" but plays on sounds and associations. The parody ignores this subtlety for the sake of the invented "Marot Metric."
  3.  **Marot Himself:** Clément Marot was a real, highly skilled Renaissance poet known for his wit and relative clarity, not for being a rigid formalist automaton. The parody uses his name purely as a symbol of formal poetic constraints.
  4.  **Bureaucratic Absurdity:** The core joke is applying the language, logic, and petty enforcement mechanisms of government bureaucracy (bonds, permits, fines, scoring systems, appeals processes) to the inherently artistic and subjective act of translation, specifically amplifying the most extreme interpretation of "form first."
  5.  **"Semantic Drift" as Crime:** Framing the natural and often desirable adaptation of meaning in translation as a finable offense is the central satirical device, highlighting the absurdity of the exaggerated premise.

  This FAQ takes the *potential extreme* of valuing form above all else and runs with it through the lens of stifling bureaucracy for comedic effect, knowingly diverging from Hofstadter's actual, much more balanced and humanistic philosophy.
