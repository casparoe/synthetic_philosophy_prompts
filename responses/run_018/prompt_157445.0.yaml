answer: |-
  Below is the conceptual architecture for your paper, structured to meet your requirements. I focus on rigorous desiderata, their tensions, and exclusionary power, scoring three generic approaches against these criteria.

  ---

  ### **Core Desiderata for a Theory of Advance Directive Authority**
  *(Non-negotiable = NN; Negotiable = N)*

  1. **Accommodation of Variable Capacity Trajectories**  
     - **Requirement**: Must handle both binary loss (e.g., post-stroke coma) and gradual/intermittent decline (e.g., dementia with lucid intervals).  
     - **Motivation**: A theory that only works for sudden incapacity fails in progressive illnesses (e.g., Alzheimer’s), where capacity fluctuates.  
     - **Status**: NN. Clinical reality demands flexibility.

  2. **Distinction Between Precedent Autonomy & Current Welfare**  
     - **Requirement**: Must preserve a clear boundary between respecting past directives and optimizing present well-being.  
     - **Motivation**: Collapsing these (e.g., "She wouldn’t want this now") risks paternalism or undermining ADs’ purpose. *Case*: A directive refusing antibiotics in late dementia; honoring it may not align with current comfort.  
     - **Status**: NN. Foundational to AD legitimacy.

  3. **Resolution of Intermediate-State Value Reversals**  
     - **Requirement**: Must address stable, lucid expressions by the intermediate self that contradict the directive (e.g., "I now want the life I previously rejected").  
     - **Motivation**: Progressive illnesses often feature coherent but transformed values (e.g., FTD patients disavowing past priorities). Ignoring this violates respect for persons.  
     - **Status**: NN for adequacy; solutions vary.

  4. **Constraint Against Gratuitous Suffering**  
     - **Requirement**: Must align with clinical duties to prevent unnecessary agony, even if directed by the past self.  
     - **Motivation**: A directive mandating painful, futile treatments (or bans on palliation) challenges medicine’s core ethics. *Case*: Withholding painkillers per directive despite terminal pain.  
     - **Status**: NN. Overrides strict autonomy.

  5. **Content-Specificity Without Psychological Continuity**  
     - **Requirement**: Must bind clinicians to specific directives (e.g., "no feeding tubes") without assuming identity persistence across radical personality change.  
     - **Motivation**: ADs lose utility if they require metaphysical continuity (denied in e.g., advanced dementia). *Case*: An ALS patient’s refusal of tracheostomy honored even if later self cannot comprehend the choice.  
     - **Status**: NN. Pragmatic necessity.

  6. **Authority-Weighing Mechanism for Conflicting Selves**  
     - **Requirement**: Must provide a principled way to adjudicate conflicts between the pre-illness and intermediate selves (e.g., early dementia patient revoking a directive).  
     - **Motivation**: Progressive decline creates overlapping loci of agency. *Case*: A patient with mild cognitive impairment requesting dialysis their directive refuses.  
     - **Status**: NN. Central to temporal authority disputes.

  ---

  ### **Key Tensions & Exclusionary Power**
  - **Primary Tension**: **Desideratum 3 (Intermediate-State Preferences)** vs. **Desideratum 6 (Precedent Authority)**.  
    - Reconciling stable reversed values in intermediate lucidity with fidelity to the original directive is *conceptually fraught*. A theory prioritizing 3 risks voiding ADs; prioritizing 6 risks disrespecting current agency. This is the core fracture in the literature.  
  - **Most Exclusionary Desideratum**: **#2 (Autonomy-Welfare Distinction)**.  
    - This excludes both strict precedent-autonomy (ignores welfare constraints) *and* pure best-interests (collapses autonomy into welfare). It forces theories to develop a *tertium quid* mechanism that respects both without reductionism.

  ---

  ### **Scoring Three Generic Approaches**
  *(✓ = Satisfies; ✗ = Violates; ~ = Partially/Ambiguous)*

  | **Desideratum**          | **(a) Strict Precedent-Autonomy** | **(b) Current-Welfare**      | **(c) Diachronic-Negotiation** |
  |--------------------------|-----------------------------------|------------------------------|--------------------------------|
  | 1. Variable Capacity     | ✗ (Fails gradual cases)           | ✓ (Focuses on current state) | ✓ (Built for flux)            |
  | 2. Autonomy-Welfare Distinction | ✓ (Prioritizes autonomy)    | ✗ (Reduces autonomy to welfare) | ~ (Risk of blurring boundaries) |
  | 3. Intermediate Reversals| ✗ (Ignores current expressions)   | ✓ (Honors current self)      | ✓ (Integrates temporal views) |
  | 4. Avoid Suffering       | ✗ (May mandate suffering)         | ✓ (Prioritizes relief)       | ~ (Context-dependent)         |
  | 5. Content-Specificity   | ✓ (Binds to text)                 | ✗ (Overrides specifics)      | ✓ (Honors directives as baseline) |
  | 6. Conflict Adjudication | ✗ (Always favors past self)       | ✗ (Always favors current self)| ✓ (Weights stages explicitly) |

  **Summary Critique**:  
  - **(a) Strict Precedent-Autonomy**: Fails desiderata 1, 3, 4, 6. Inadequate for progressive illness due to rigidity.  
  - **(b) Current-Welfare**: Fails 2, 5, 6. Collapses autonomy into welfare, voiding ADs’ purpose.  
  - **(c) Diachronic-Negotiation**: Best on 1, 3, 5, 6 but risks compromising 2 and 4. Most promising but must clarify *how* to weigh temporal selves without arbitrariness (e.g., procedural vs. substantive criteria).

  ---

  ### **Conclusion for Conceptual Architecture**
  The irreducible tension lies in **whether the intermediate self’s stable reversal of values defeates the pre-illness self’s authority** (Desiderata 3 vs. 6). Any adequate theory must either:  
  - (i) Define conditions under which the intermediate self can override the directive (e.g., "lucid, consistent, and values-coherent reversals"), or  
  - (ii) Defend why precedent autonomy is resilient to such reversals (e.g., "only the pre-illness self had full agency").  

  **Desideratum 2** remains the sharpest tool for dismantling binary positions, as it exposes their failure to separate two incommensurable normative grounds. A viable theory must deliver a *structured interaction* between autonomy and welfare—not a hierarchy or conflation.
