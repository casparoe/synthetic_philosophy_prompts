  *Final framing*: War's "graded profile" in 1914 was overdetermined because the system couldn't produce a *different* profile—delayed or smaller war—given the actual conditions. The assassination didn't select the form; it was the form's vehicle.
answer: |-
  As a committed proponent of structural overdetermination, I reject any metaphysical distinction between the binary occurrence of a macro-historical event and its graded profile—the latter is equally overdetermined. Consider your World War I case: the alliance rigidities, militarized timetables, colonial tensions, and arms races weren't merely sufficient conditions for *some* conflict; they generated a tightly constrained possibility space for *how* any triggering incident would manifest. The assassination selected Sarajevo as the spark, but the systemic logic—cultivated over years—demanded that *any* plausible crisis in mid-1914 would produce near-identical outputs: rapid escalation via fixed diplomatic scripts, maximal initial mobilization, and continental war erupting within weeks. The "August 1914" temporal signature wasn't accidental; it was the crystallized expression of institutionalized war planning that eliminated strategic flexibility. Historians who isolate the assassination as shaping the "how" confuse contingency (which spark ignited the tinder) with structural necessity (the tinder’s composition predetermined the explosion’s scale and speed). To claim that overdetermination applies only to the war’s existence while its character relies on singular causes is to reintroduce the very modal fallacy I oppose—it implies the system could have produced a fundamentally different *kind* of war if the trigger differed, when in reality the systemic parameters made divergent profiles (e.g., a delayed or localized conflict) increasingly inaccessible. The graded properties are emergent, non-negotiable features of the historical field itself.
