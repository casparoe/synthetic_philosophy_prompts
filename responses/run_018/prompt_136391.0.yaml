prompt: |-
  I've been arguing with my flatmate about whether Wittgenstein's family resemblance idea is actually useful for real work, and now I'm trying to prove her wrong by using it at the archive where I volunteer on saturdays. We recieve donations of what people call 'memory objects' — things that help someone hold onto a dead person or a past version of themselves — and we need to decide which ones belong in the public collection. There is no essential definition: some are handwritten letters, some are modified kitchen utensils, some are just pebbles collected from a grave. I want a reusable decision procedure my small team can run on any donation, grounded in family resemblance and language-games thinking rather than checklists with necessary conditions. It should ask questions in order, say what counts as a sufficient web of similarities, stop with a clear no when there's no family link, and flag the exact point where judgement about cultural value takes over from conceptual classification. Then run it on three donations: a factory-made sympathy card with a handwritten note inside, a chipped teacup that belonged to no one special but was used every morning for forty years, and a digital photo frame loaded with images of strangers bought at a car boot sale. Include one case where the procedure gives an answer we'll probably dislike, and be explicit about what the procedure simply can't settle. Lead with the bottom line in your first sentence, then reasoning, no preamble, no restating my question. British English please, and don't worry if there's a typo in my message — there definately is one.
reasoning: |-
  Okay, let me unpack this user's request. They're clearly in a heated debate with their flatmate about Wittgenstein's practical utility, and now they're on a mission to prove family resemblance concepts can actually work in their archival volunteer work. The core challenge is creating a decision procedure for "memory objects" without essentialist definitions - exactly the sort of problem Wittgenstein addressed.

  Hmm, the user mentions three test cases: a sympathy card, a chipped teacup, and a digital photo frame of strangers. They specifically want one outcome that'll feel counterintuitive to show the method's objectivity. And crucially, they want me to flag where cultural judgment takes over from classification. 

  Right, first I need to design the actual procedure. It should flow through key Wittgensteinian questions: start with surface attributes (material, origin etc.), then probe meaning-making practices (how was it used? what memories does it hold?), then examine social connections (who values it? why?). The threshold should be a cluster of resemblances, not all criteria. Must include clear stopping rules when no links emerge.

  For the sympathy card case... manufactured object but personalized note makes it a clear yes. The teacup's more interesting - mundane but heavily ritualized use creates strong memory-laden resemblance. But that photo frame... ah, here's the deliberately uncomfortable one. No provenance, no personal connection - procedure should reject it despite potential historical interest. And that's where I must emphasize: the "no" here is conceptual, not value judgment. Archivists might still want it, but that's beyond Wittgenstein's scope.

  Better make sure the language stays practical. User wants British English and no fluff - straight to the point. And they've even warned me about their own typo ("definately"), which suggests they'd appreciate similar pragmatism in response. The bottom-line verdict must come first as requested: procedure works, but won't replace curatorial decisions.
answer: |-
  **Bottom line:** This Wittgenstein-inspired procedure successfully sorts memory objects through resemblance clusters and identifies the precise point where cultural valuation supersedes conceptual classification, delivering one intentionally uncomfortable rejection.

  **Procedure: Resemblance Web Assessment for Memory Objects (RWAMO)**  
  *Run sequentially; stop if rejection criteria met or sufficient cluster achieved. Record where cultural valuation flags.*

  1.  **Surface Attributes:** Does the object possess physical properties commonly *associated* with memory-keeping? (e.g., handwritten marks, wear patterns, personal modification, portability, common memorial materials like stone/paper/fabric?  
      *   *Purpose:* Identifies initial, common hooks.  
      *   *Sufficient Cluster Contribution:* Weak resemblance alone. Proceed regardless.

  2.  **Origin Narrative:** Was the object *explicitly created or selected* by the person remembering *for the purpose* of memory-keeping? (e.g., a letter written, a pebble chosen, a cup kept *because* of its association).  
      *   *Purpose:* Connects to the intentional act of remembrance.  
      *   *Sufficient Cluster Contribution:* Strong resemblance. A "Yes" here significantly strengthens the case. A "No" doesn't kill it.

  3.  **Usage Ritual:** Was the object *repeatedly engaged with* by the rememberer *specifically to evoke or sustain* the memory? (e.g., reading a letter, using the cup daily, visiting the grave holding the pebble).  
      *   *Purpose:* Identifies the object's functional role in the "language-game" of personal remembrance.  
      *   *Sufficient Cluster Contribution:* Strong resemblance. Highly indicative of core memory-object function.

  4.  **Emotional/Experiential Anchor:** Is the object *demonstrably linked* to a specific person, event, or past state *of deep significance* to the rememberer? (e.g., the dead person, a lost home, a former self).  
      *   *Purpose:* Gets to the core *content* of the memory being held.  
      *   *Sufficient Cluster Contribution:* Core resemblance. Almost always necessary. A "No" here is highly problematic.

  5.  **Provenance Chain:** Is there a *clear, unbroken line* connecting the object to the rememberer/remembered? (e.g., donated directly by the rememberer or immediate inheritor with context).  
      *   *Purpose:* Ensures the object's status as a memory object isn't merely assumed.  
      *   *Sufficient Cluster Contribution:* Moderate resemblance. Strengthens authenticity. A "No" requires stronger scores elsewhere.

  6.  **Rejection Threshold:** Is there *no discernible link* to any of the practices or purposes described in Q2, Q3, or Q4?  
      *   *Purpose:* Clear "No" trigger. Lack of core resemblances.  
      *   *Action:* **STOP. Reject as conceptual fit.** Flag as "Conceptual Rejection". Cultural value irrelevant at this stage.

  7.  **Sufficient Cluster Check:** Does the object demonstrate a *robust web* of resemblances across Q1-Q5? (e.g., Multiple "Strong" or "Core" positives, especially from Q2, Q3, Q4; a single "Core" (Q4) with supporting "Strong" may suffice; strong Q3 & Q4 can override weak Q1/Q5).  
      *   *Purpose:* Assess overall resemblance cluster strength without requiring every box ticked.  
      *   *Action:* If YES, **Accept as conceptual fit.** If NO but Q6 not triggered, proceed to Q8.

  8.  **Cultural Valuation Flag:** Does the object, *despite conceptual fit being borderline or established*, possess qualities (rarity, historical context, artistic merit, illustrative power of a phenomenon) that might justify inclusion *based on institutional/archival values*?  
      *   *Purpose:* **Explicitly marks the transition** from Wittgensteinian classification to curatorial/cultural value judgment.  
      *   *Action:* Record **"Cultural Valuation Required"** alongside the conceptual assessment (Accept/Reject/Borderline). Final decision point beyond the procedure.

  ---

  **Application to Donations:**

  1.  **Factory-made sympathy card with handwritten note inside:**
      *   Q1: Yes (Paper, handwritten note).
      *   Q2: **Yes.** Created/selected explicitly for remembrance (sending sympathy).
      *   Q3: Potentially (Kept, re-read?), but often not ritualistically used *by the keeper*. Assume weak/moderate.
      *   Q4: **Yes.** Explicitly linked to the deceased and the bereaved.
      *   Q5: **Yes.** Directly from the rememberer/recipient.
      *   Q6: No (Clear links to Q2 & Q4).
      *   Q7: **Sufficient Cluster (Strong Q2, Q4, Q5). ACCEPT.**
      *   Q8: *Cultural Valuation Flag:* May be required if the card is very generic/notes brief vs. deeply personal.

  2.  **Chipped teacup used every morning for forty years (belonged to "no one special"):**
      *   Q1: Yes (Wear/chipping = evidence of use).
      *   Q2: **Yes.** Explicitly kept *because* of its association with routine/memory (implied by donation context).
      *   Q3: **Yes.** Used daily, ritualistically, anchoring memory/identity.
      *   Q4: **Yes.** Linked to a "past version of themselves" (the person's daily life/routine over 40 years).
      *   Q5: **Yes.** Donated by the user.
      *   Q6: No (Clear links to Q2, Q3, Q4).
      *   Q7: **Strong Cluster (Q2, Q3, Q4, Q5). ACCEPT.**
      *   Q8: *Cultural Valuation Flag:* Likely raised. Is this "ordinary" memory culturally significant/interesting enough *for the public collection*? (Procedure confirms conceptual fit, value judgment takes over).

  3.  **Digital photo frame loaded with images of strangers bought at a car boot sale:**
      *   Q1: Yes (Digital display, holds photos - common memory tech).
      *   Q2: **No.** Not created/selected *by the donator* for memory-keeping. Bought randomly.
      *   Q3: **No.** No evidence of engagement by the donator to evoke *their* memory of the strangers.
      *   Q4: **No.** No link to a specific person/event of significance *to the rememberer (donator)*. The strangers are unknown.
      *   Q5: **No.** Provenance is a boot sale, no connection to the subjects.
      *   Q6: **YES.** No discernible link to practices of memory-keeping *by the donator* regarding the images (Q2, Q3, Q4 all No). **STOP. REJECT as conceptual fit.** Flag: "Conceptual Rejection".
      *   *(Q7/Q8 not reached)*.

  **Explicit Points:**

  *   **Uncomfortable Answer:** The digital photo frame is **rejected** by the procedure. While intriguing ("found memory"), it lacks *any* connection to the language-games of personal memory-keeping *as practiced by the donor*. It doesn't function as a *memory object for them*. This rejection is purely conceptual.
  *   **What the Procedure Can't Settle:** The procedure **cannot determine cultural/historical/archival value** (Q8). It only assesses if the object fits the *concept* of a "memory object" via resemblance. The teacup (Q8 Flag) *is* a valid memory object, but whether it's *worth* archiving publicly is a separate judgment. The rejected photo frame *might* have cultural value (e.g., as an example of vernacular photography or accidental archives), but this is **entirely outside the scope** of the resemblance assessment. The procedure clearly flags where this separate valuation must begin.
