  Hmm, the core tension in Smith's account seems to be between perfectionist and pragmatic standards. The user wants to know how any theory can explain humans switching between these standards without the impartial spectator becoming either too lax or unrealistically ideal. This reminds me of dual-process theories in cognitive science, but applied to morality.

  First, I should identify the non-negotiable phenomena a theory must address: why ordinary people accept "good enough" morality while the virtuous strive for perfection, how the same mechanism can produce both judgments, and what prevents the higher standard from becoming irrelevant. The psychological facts to accommodate include self-deception, social conformity pressures, and moral development variability.

  Important distinctions to preserve: descriptive vs normative aspects, conscious reasoning vs automatic responses, and individual vs cultural variations. The theory should remain silent on metaphysical foundations though - that's beyond its scope.

  For desiderata, they must: explain dual-standard application, account for the lower standard's appeal, show how correction works without idealization, handle self-deception, and allow for moral progress. I'm suspicious about whether desiderata 3 and 4 can be fully reconciled - preventing idealization while enabling radical self-correction seems tricky.

  When briefly applying this framework: Smith's original account handles the dual standards well but may over-rely on idealized spectators; mirroring accounts explain social influences but struggle with self-correction; constructivist approaches excel at normativity but may lose psychological realism. The user's physics background suggests they'll appreciate seeing where each theory develops "friction" with the criteria.

  The key is maintaining the user's requested focus on the criteria themselves rather than exhaustive evaluation. Their underlying need appears to be establishing epistemic rigor in moral philosophy comparable to scientific methodology.
answer: |-
  Based on your scientific demand for pre-specified adequacy conditions, here are the desiderata for a theory of the impartial spectator (IS) as the mechanism of moral self-assessment, incorporating Smith's tension between the two standards:

  **Core Desiderata for an Adequate Theory of the Impartial Spectator:**

  1.  **Dual-Standard Application:** The theory *must* explain how a *single individual* can access and utilize *both* standards:
      *   The **Ideal Standard ("Exact Propriety and Perfection"):** A conception of perfect moral conduct, independent of common practice.
      *   The **Common Standard ("Commonly Attained Approximation"):** The prevailing, often lower, level of moral conduct observed and accepted in society.
      *   *Motivating Case:* Explaining why the same person might feel deep shame for a minor failing invisible to others (applying the Ideal) yet readily excuse a common moral lapse in themselves or others (applying the Common).

  2.  **The Pull of the Common Standard:** The theory *must* explain the powerful psychological force drawing individuals towards the Common Standard as sufficient for self-assessment. This includes accommodating:
      *   *Conformity Pressure:* The desire to fit in and avoid social disapproval/censure.
      *   *Cognitive Ease:* The lower cognitive/emotional cost of comparing oneself to observable peers rather than an abstract ideal.
      *   *Self-Compassion/Excuse-Making:* The psychological mechanisms protecting self-esteem by normalizing shortcomings.
      *   *Motivating Cases:* The prevalence of "everyone does it" justifications; the difficulty of maintaining high personal ideals in a lax environment; the relief felt when realizing one's failing is "normal."

  3.  **Correction Without Collapse:** The theory *must* explain how the IS mechanism enables *effective self-correction* towards the Ideal Standard *without* rendering the Ideal:
      *   **Empty:** Merely abstract, irrelevant, or disconnected from human psychology and social reality.
      *   **Unattainably Rigid:** So impossibly perfect that striving for it becomes counterproductive or pathological.
      *   *Motivating Cases:* How a genuinely virtuous person uses the Ideal to motivate incremental improvement without despair; how the Ideal informs criticism of societal norms (e.g., condemning widespread historical injustices accepted by the Common Standard of the time).

  4.  **Accommodation of Self-Deception & Bias:** The theory *must* account for how the IS mechanism can be *subverted* by self-interest, bias, and self-deception (especially favoring the Common Standard), yet also *resist* these forces sufficiently to function as a genuine source of moral self-assessment for the virtuous.
      *   *Motivating Cases:* The skilled rationalizer who convinces themselves their self-serving action meets the Ideal Standard; the person who genuinely feels guilt only when caught, not when acting secretly against the Ideal.

  5.  **Explanation of Moral Development/Disparity:** The theory *must* explain the psychological basis for *why* "most people" rest content with the Common Standard, while the "wise and virtuous" primarily attend to the Ideal Standard. It must link this divergence to the functioning of the IS mechanism itself.
      *   *Motivating Cases:* The difference in self-assessment rigor between a complacent individual and a morally ambitious one; the role of education, reflection, or character in shifting focus towards the Ideal.

  6.  **Respect for Psychological Reality:** The theory *must* be grounded in plausible human psychology – empathy, imagination, affect, social learning, reasoning – not relying on implausible cognitive feats or purely abstract rationalism. It must explain how moral *feelings* (approval, disapproval, guilt, pride) arise from the IS process.
      *   *Motivating Cases:* The visceral feeling of shame upon moral failure; the sense of "rightness" when acting with integrity.

  7.  **Distinguish Descriptive and Normative:** The theory *must* clearly distinguish how the IS mechanism *actually functions* descriptively (including its susceptibility to error and bias) from how it *ought to function* normatively to yield correct moral judgments. It must explain how the *normative authority* of the (properly functioning) IS arises.
      *   *Motivating Cases:* Why we feel the judgment of an *impartial* spectator *should* carry moral weight, even if our own internal spectator is biased.

  **Permitted Silence:**
  *   The theory need not provide a full meta-ethical foundation (e.g., moral realism vs. anti-realism).
  *   It need not specify the *content* of the Ideal Standard in detail (beyond its perfectionist nature relative to the Common Standard), only the *mechanism* by which it is accessed and used via the IS.
  *   It need not resolve ultimate questions of free will or determinism concerning moral action.

  **Potential Tensions Between Desiderata:**

  *   **Desiderata 3 (Correction) & 4 (Self-Deception):** Can a mechanism inherently susceptible to self-deception (D4) reliably generate the self-correction towards a non-empty ideal required by D3? How robust is the correction against powerful self-serving biases?
  *   **Desiderata 2 (Pull of Common) & 5 (Virtuous Focus on Ideal):** If the pull of the Common Standard is so strong (D2), how is it psychologically possible for *anyone* (the virtuous) to consistently overcome it and focus primarily on the Ideal (D5)? Does this require positing a fundamentally different psychological capacity?
  *   **Desiderata 6 (Psychological Reality) & 3 (Non-Empty Ideal):** Can a psychologically realistic mechanism (grounded in empathy, observation of actual people) generate access to a truly *perfectionist* Ideal Standard (non-empty, non-collapsed) that isn't just an extrapolation of observed virtues? Doesn't observation primarily feed the Common Standard?

  **Brief Scoring Against Desiderata (Focus on Criteria Interaction):**

  1.  **Smith's Own Account (Affective Sympathy + Imaginative Projection):**
      *   **Strengths:** Excels at D1 (dual standards via imagination of different spectators), D2 (pull of Common via natural sympathy with actual others), D6 (rooted in psychology of sympathy/imagination), partially addresses D7 (normativity via idealization/sympathy with ideally impartial spectator).
      *   **Tensions:** Struggles most with D3 (How *exactly* does imagining an *ideal* spectator correct without collapsing? Is the "ideal" spectator merely an abstraction, risking emptiness?) and D4 (How robust is the ideal spectator against self-serving manipulation of the imaginative act?). D5 is addressed but relies heavily on individual disposition ("wise and virtuous").

  2.  **Contemporary Affective-Mirroring Account (e.g., emphasizing neural mirroring, emotional contagion, embodied simulation):**
      *   **Strengths:** Strong on D6 (grounded in current cognitive science), explains D2 (powerful pull of mirrored common reactions), potentially D1 (mirroring common reactions vs. simulating reactions to an ideal?).
      *   **Tensions:** Weak on D3 (How does mirroring/simulation generate a *perfectionist ideal*, not just an average or super-mirroring? Correction mechanism unclear). Very weak on D7 (Normative authority – why *should* mirrored reactions be morally authoritative?). Struggles with D5 (Why wouldn't mirroring always pull towards the Common?).

  3.  **Normative Constructivist Account (e.g., IS as a procedure for generating valid moral norms through idealized agreement/co-deliberation):**
      *   **Strengths:** Strongest on D3 (Ideal Standard defined by the constructive procedure itself, avoiding emptiness/collapse by being constitutive of validity) and D7 (Normative authority *is* the outcome of the correct procedure). Addresses D1 (Common Standard might be a flawed application or input to the procedure).
      *   **Tensions:** Challenged by D6 (Is the complex idealized deliberation psychologically realistic as a mechanism for everyday self-assessment?). Struggles with D2 (Why the *strong pull* of the Common Standard if validity comes only from the ideal procedure? Might downplay psychological force). D4 (Self-deception in applying the procedure) is a significant concern. D5 becomes about correctly applying the procedure.

  This framework prioritizes the pre-theoretical phenomena and tensions (especially Smith's core duality) that any adequate account *must* engage with before earning its keep in your scientific sense. Each type of account reveals different strengths and weaknesses against these criteria, highlighting where the deepest explanatory challenges lie.
