prompt: |-
  I'm moderating a podcast interview with a philosopher who applies Sartre's account of radical freedom and bad faith to what she calls "delegated choice architecture"—the condition in which people routinely offload mundane decisions to predictive algorithms and then treat the outputs as if they revealed an authentic, pre-given preference rather than a freely adopted project. I want a focused sequence of questions that presses the actual Sartrean machinery, not generic automation anxiety. Please include: a question that forces her to distinguish her claim from a mere empirical point about cognitive offloading, with a follow-up keyed to the likely reply that "the algorithm just knows me"; a question that asks whether bad faith in this setting requires explicit self-deception about causal origins or only a structural refusal to acknowledge one's sustaining role, with a follow-up pressing the case of a user who actively configured the system herself; and a final question about whether radical freedom is preserved when revocation is technically available but socially costly, together with a follow-up asking whether that renders bad faith intermittent rather than pervasive. If my premise that Sartre's ontology of freedom can be mapped onto algorithmic delegation without serious distortion is confused, say so plainly instead of accommodating the framing.
