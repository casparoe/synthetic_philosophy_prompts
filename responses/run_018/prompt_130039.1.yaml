prompt: |-
  I run a philosophy workshop for about 12 grad students, 90 min, and I want them to feel Quine's indeterminacy of translation in thier bones instead of just saying "oh gavagai" and moving on. Design an in-class simulation where teams act as field linguists translating a fictional alien language, Xenogloss, using only stimulus-assent cards—no asking the natives what they mean. The data needs to be exactly compatible with at least two manuals: one that translates the key term as "rabbit" (object ontology) and one as "undetached rabbit-part" or "rabbit-stage" (event/part ontology). Also inject a hidden ambiguity: Xenogloss has no visible singular/plural distinction and no tense markers, so teams will naturally project English grammar onto the data without noticing. Give me rules, materials, a prestige/payoff scheme (no real money), and a structured debrief where they map thier commitments onto Quine's argument—specifically stimulus meaning, ontological relativity, and the failure of analytic hypotheses to save uniqueness. The debrief should come after they've already voted on which manual "gets funded," and they shouldn't hear "indeterminacy" named until then. Tell me what will predictably go wrong—probably one group dominating or students smuggling in analytic hypotheses they think are "just obvious"—and be frank about which feature of Quine's view the activity can't reproduce (likely the idea that there is no fact of the matter about which manual is correct, since in the game they have to pick one). Write casually, American English, maybe a typo or two. Don't include citations or ask for a reading list.
