prompt: |-
  I'm a TA for a second-year undergrad course called Ethics and the Arts, and I'm grading a stack of short essays over the weekend. Act as an experienced philosophy instructor with expertise in ethics and aesthetics who's seen every trick students pull. I want a careful, claim-by-claim grading report, not a general impression, and I want it in British English please.

  Here's the essay question I set:

  "Do filmmakers and historical novelists owe anything morally to the real dead people they dramatise? If the dead cannot be harmed, does it follow that 'anything goes' in their portrayal? Discuss with reference to the posthumous harm debate and at least two normative ethical frameworks."

  And here's the student's answer, verbatim:

  ---
  Legally and morally, dramatists owe nothing to the dead themselves, because the dead no longer exist as subjects who can hold interests. Parfit's work on the non-identity problem showed that we cannot harm people who do not exist at the time of the act, and this applies a fortiori to the dead. The law bears this out: defamation claims cannot be brought on behalf of the deceased, so a biopic can say what it likes about someone once they are gone. Since the law tracks morality in this area, the only genuine obligations run to the living: the feelings of descendants, and the epistemic interests of audiences who might come away with false beliefs about historical events.

  A utilitarian would reach much the same conclusion. Harm requires experience, the dead experience nothing, so dramatists should weigh only effects on the living. A utilitarian might still condemn fabrications that mislead audiences about matters of public importance, since false beliefs about the past can do real damage downstream. A Kantian, by contrast, grounds duty in respect for rational nature; since the dead are no longer rational agents, a Kantian must be indifferent to how they are portrayed, caring only about what dramatising them does to the living. So on both major frameworks the answer converges: anything goes with respect to the dead themselves, with constraints arising only from the interests of the living.

  There is one wrinkle: promises and dying wishes. If someone extracts a promise about how they will be portrayed, breaking it seems wrong even though no one is harmed by the breach, which suggests our moral practice already treats the dead as considerable. But this can be explained away: the wrongness lies in damaging the institution of promising, which matters to the living who rely on it.

  Conclusion: artistic licence is a moral permission, not merely an aesthetic convention, and the dead are owed accuracy only as a means to serving the audience's interest in truth.
  ---

  Before you grade, do a quick brainstorm of what a fully correct answer would need to cover, then grade this one against that. Please:

  - Go through the answer claim by claim and tell me what's right, what's subtly wrong, and what's a step that doesn't follow. Be specific enough that I can paste your comments straight into the feedback box.
  - In particular, watch for misattributed views, conflations, and places where a confident conclusion is doing work the argument hasn't earned. Don't be charmed by how polished it reads.
  - Note anything a hasty grader would let slide that shouldn't be let slide, and anything that's actually better than it looks.
  - Give a percentage grade out of 100 and a sentence or two of overall justification.

  State the final grade in machine-readable form at the very end, as \answer{XX%}.
reasoning: |-
  Okay, the user is a TA grading essays on whether filmmakers and novelists have moral obligations to the dead people they portray. They want me to act as an experienced philosophy instructor and provide a detailed, claim-by-claim analysis. The essay question references the posthumous harm debate and requires discussion of at least two normative ethical frameworks.

  Let me first brainstorm what a strong answer should cover. On posthumous harm, the student needs to engage with key thinkers like Feinberg (harm as thwarted interests) and Pitcher (welfare subjectivism vs. objective list). They should address the non-identity problem but also its limits - Parfit's work applies to future people, not directly to the dead. For normative frameworks, utilitarians might care about audience deception or social consequences, while Kantians could argue about disrespect to rational nature or autonomy violations. The promise-keeping point is good but needs deeper treatment of how it challenges harm-centric views. And they should consider alternatives like virtue ethics - what does portrayal say about the artist's character?

  Now looking at this student's essay... Hmm, it's polished but has concerning flaws. They open by conflating legal and moral claims - the law not recognizing defamation for the dead doesn't morally settle the issue. Their Parfit reference is misplaced; the non-identity problem is about future generations. The utilitarian section oversimplifies by ignoring how false portrayals might violate the dead person's past interests or distort historical understanding. The Kantian analysis is worse - reducing rational nature to current agency misses how disrespecting the dead could degrade our treatment of persons generally. 

  The promise argument is handled better, but they dismiss it too quickly by reducing it to institutional damage. And they completely omit Feinberg's core counterargument about retrospective harm to interests formed while alive. The conclusion about "artistic licence as moral permission" overreaches given these gaps.

  What's subtly dangerous here is how confidently argued this is - a hasty grader might miss the misattributions. But the student shows grasp of structure and identifies key issues, even if their analysis is shallow. I'll score it 62% - passing but with serious reservations. The percentage reflects fundamental errors in applying theories, not just missing content.

  For feedback, I'll flag each problematic claim precisely: the legal/moral conflation, the Parfit misapplication, the thin utilitarian treatment, the Kantian oversight, and the missed Feinberg counter. I'll also note the stronger promise point to encourage them. The tone should be academic but constructive - they're capable of better work.
answer: |-
  ### Grading Report: Claim-by-Claim Analysis (British English)

  **Benchmark for a Strong Answer**  
  A fully correct response would:  
  1. **Define posthumous harm** (e.g., Feinberg’s "interest theory" vs. Pitcher’s "welfare subjectivism"), distinguishing *harm to the dead* from *harm to the living*.  
  2. **Engage the non-identity problem** accurately (Parfit concerns *future* persons, not the dead).  
  3. **Interrogate "cannot be harmed"** by examining whether the dead retain interests (e.g., Feinberg: thwarted ante-mortem interests constitute harm).  
  4. **Apply two ethical frameworks rigorously**:  
     - *Utilitarianism*: Weigh consequences for living audiences/descendants AND potential devaluation of truth/social trust.  
     - *Kantianism*: Consider duties of respect to persons *as rational agents*, including posthumous disrespect as a failure to honour autonomy or dignity.  
  5. **Address counterarguments**: e.g., promises to the dying, cultural duties to memory, virtue-ethical concerns (e.g., truthfulness as a virtue).  
  6. **Avoid conflating legal and moral obligations**.  

  ---

  **Student Essay Assessment**  

  **1. "Legally and morally, dramatists owe nothing to the dead themselves... Parfit's work on the non-identity problem showed that we cannot harm people who do not exist..."**  
  - **Correct**: Dead cannot hold *current* interests (Feinberg rebuttal needed).  
  - **Subtly Wrong**: **Major misattribution**. Parfit’s non-identity problem addresses harming *future* persons by affecting their identity (e.g., environmental policies), **not** posthumous harm. Conflating "non-existence" of future people with "death" is a category error.  
  - **Step that doesn’t follow**: Legal inability to sue ≠ moral irrelevance. Law often lags morality (e.g., historical injustices).  

  **2. "Since the law tracks morality in this area... only genuine obligations run to the living."**  
  - **Problematic Conflation**: Assumes legal positivism ("law tracks morality") without argument. Ignores that laws (e.g., defamation statutes) may reflect *practical* limitations (e.g., evidence decay) rather than moral principles.  

  **3. Utilitarian Section: "Harm requires experience... weigh only effects on the living."**  
  - **Correct**: Utilitarians prioritise experiential welfare; dead lack sentience.  
  - **Incomplete**: Fails to consider *indirect* harms: e.g., normalising historical distortion may erode societal trust in art/media ("slippery slope" risk). Also misses "preference utilitarianism" – thwarting *past* preferences of the dead (e.g., a person’s wish for accurate portrayal).  

  **4. Kantian Section: "Kantian must be indifferent... no longer rational agents."**  
  - **Grave Error**: **Misrepresents Kant**. Kantian duties include *respect for rational nature*, which extends to memory/legacy (e.g., *Groundwork* III on treating persons as "ends"). Misportrayal could:  
    - Use the dead merely as a "means" to entertainment.  
    - Fail to honour autonomy (e.g., ignoring documented wishes).  
    - Undermine moral community by disrespecting persons *as such*.  
  - **Oversimplification**: Reduces Kantianism to "current agency" – but dignity is timeless (e.g., we condemn desecrating graves).  

  **5. "Promises and dying wishes... wrongness lies in damaging the institution of promising."**  
  - **Correct**: Rule-utilitarian explanation is plausible.  
  - **Missed Depth**: Ignores Kant’s *perfect duties* (promise-keeping as a categorical imperative). Also fails to ask: *Why* do we feel obligated to keep deathbed promises if the dead "don’t matter"? Suggests residual moral status.  

  **6. Conclusion: "Artistic licence is moral permission... owed accuracy only to serve audience interest."**  
  - **Overreach**: Assumes the preceding arguments are sound (they aren’t). Ignores counterexamples:  
    - Feinberg: Harm occurs if portrayal *thwarts interests formed while alive* (e.g., a scientist misportrayed as a fraud, destroying their life’s purpose).  
    - Virtue ethics: Accuracy as intellectual honesty; misrepresentation as hubris.  

  **Hasty Grader Traps & Hidden Strengths**  
  - **Polished prose masks errors**: The confident tone and structure may obscure misattributions (Parfit, Kant).  
  - **Better than it looks**: The promise argument shows awareness of a key objection, though rebuttal is shallow.  
  - **Let slide?**: The utilitarian focus on audience deception is valid but presented as exhaustive.  

  ---

  **Final Grade**  
  **62% (Lower Second-Class)**  
  **Justification**: Demonstrates grasp of surface-level arguments (utilitarian consequences, promise-keeping) and clear writing. However, **core failures** in philosophical rigour: (1) egregious misattribution of Parfit, (2) fundamental misreading of Kant, (3) no engagement with Feinberg-style interest theory, (4) conflation of legal/moral domains. These undermine the central thesis.  

  \answer{62%}
