  I'm applying for a one-year research fellowship and need a two-page proposal. The project concerns Spinoza's unfinished account of democracy in the Tractatus Politicus. Standard interpretations cast him either as a direct-democrat, for whom sovereignty requires continuous universal assembly, or as an early republican allowing delegated councils that govern in the multitude's name. I want to test a different framing: Spinoza's democracy may rest on a recursive structure in which any delegated body holds democratic authority only insofar as it continuously re-manifests the potentia multitudinis—not through periodic authorization, but through an institutional form that keeps the multitude's power present rather than transferred. The precise question: can Spinoza consistently allow representative institutions within democracy without reducing democratic sovereignty to mere delegation, and does this require a concept of "recursive authorization" that is distinct from both direct participation and modern representative theory? State the question with enough precision that it has a determinate answer. Then explain why the direct-democracy and republican readings leave it open, especially in light of Spinoza's claim that democracy is the most absolute form of imperium. Outline the method—close conceptual reconstruction of potentia, multitudo, and imperium paired with analysis of the unfinished democratic chapters—and say why this approach is preferable to either a purely historical-contextual study or an anachronistic comparison with modern democratic theory. Specify what a successful result looks like (a principled institutional criterion that saves Spinoza's text from internal contradiction without importing liberal assumptions about representation), what failure looks like (the recursive distinction collapses either into pure direct democracy or into an anachronistic representative model), and whether the project is realistic for one year given that it relies on conceptual reconstruction rather than archival discovery. Do not include a bibliography or literature review by citation; I will add references myself.
