answer: |-
  ### Desiderata for a Theory of Object Identity

  1. **Non-Identity of Indiscernibles**  
     - **Desideratum**: Allow two numerically distinct objects with identical intrinsic *and* relational properties.  
     - **Motivating Case**: Black’s spheres (two identical spheres in symmetric space).  
     - **Negotiable**: False (non-negotiable for theories rejecting Leibniz’s Identity of Indiscernibles).  
     - **Jointly Unsatisfiable With**: None.  
     - **Fails For**: Strict Leibnizian Identity of Indiscernibles.  

  2. **Diachronic Identity Under Symmetry**  
     - **Desideratum**: Account for identity over time in symmetric, traceless swaps (no intrinsic/relational "trace" distinguishes objects before/after swap).  
     - **Motivating Case**: Periodic sphere-swap in an empty symmetric space (diachronic symmetry).  
     - **Negotiable**: True (camps split on whether identity must be determinate or can be indeterminate).  
     - **Jointly Unsatisfiable With**: Determinacy of Identity (if both are required).  
     - **Fails For**: Structuralism (indeterminacy arises), Leibnizian II (denies swap possibility).  

  3. **Qualitative vs. Numerical Distinction**  
     - **Desideratum**: Clearly differentiate qualitative sameness (shared properties) from numerical identity (being the *same* object).  
     - **Motivating Case**: Explaining how two spheres can share all properties yet be distinct objects.  
     - **Negotiable**: False (non-negotiable; any theory must ground this distinction).  
     - **Jointly Unsatisfiable With**: None.  
     - **Fails For**: None (all theories address this, but Leibnizian II conflates them).  

  4. **Frame-Independent Relational Properties**  
     - **Desideratum**: Relational properties must not presuppose a background frame (e.g., absolute space); individuation relies only on symmetric-invariant relations.  
     - **Motivating Case**: Black’s spheres (distance is symmetric; no privileged reference frame).  
     - **Negotiable**: False (non-negotiable for relationalists about space/time).  
     - **Jointly Unsatisfiable With**: None.  
     - **Fails For**: Structuralism (if relations require asymmetric grounding).  

  5. **Bare Individuation**  
     - **Desideratum**: Allow two objects with *no differentiating properties whatsoever* (intrinsic or relational).  
     - **Motivating Case**: A universe with two property-less objects (only numerical distinction).  
     - **Negotiable**: True (camps split; bundle theorists reject this).  
     - **Jointly Unsatisfiable With**: None.  
     - **Fails For**: Leibnizian II, Structuralism.  

  6. **Determinacy of Identity**  
     - **Desideratum**: Identity is always determinate (no "vague" or indeterminate cases).  
     - **Motivating Case**: Sphere-swap must not imply identity is unknowable or non-factual.  
     - **Negotiable**: True (some accept ontic indeterminacy).  
     - **Jointly Unsatisfiable With**: Diachronic Identity Under Symmetry (if both are strictly required).  
     - **Fails For**: Structuralism (in swap case).  

  7. **No Extraneous Individuation**  
     - **Desideratum**: Individuation cannot rely on observers, labels, or non-worldly structures.  
     - **Motivating Case**: Black’s spheres are distinct *in themselves*, not via external indexing.  
     - **Negotiable**: False (non-negotiable for realists).  
     - **Jointly Unsatisfiable With**: None.  
     - **Fails For**: None (all theories satisfy this minimally).  

  ---

  ### Theory Scoring (Brief)  
  - **Strict Leibnizian Identity of Indiscernibles**: Fails (1), (2), (5). Treats numerical identity as qualitative sameness, denying symmetric indiscernibles.  
  - **Haecceitism (Primitive Thisness)**: Passes all. Grounds identity in non-qualitative haecceities, allowing indiscernibility and swaps.  
  - **Structuralism (No Bare Particulars)**: Fails (2), (5), (6). Objects as structural nodes struggle with swaps (indeterminacy) and bare individuation.  

