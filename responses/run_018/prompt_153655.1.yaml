answer: |-
  ### Research Agenda Prioritization Essay

  The core tension in coherent extrapolated volition (CEV)—between pairwise (individual diachronic), collective (multiparticipant synchronic), and hierarchical (representative-aggregation) coherence—remains critically underdeveloped. Standard treatments inadequately address how these coherence layers interact or which should constrain CEV’s normative core. Given resource constraints, I prioritize resolving foundational pairwise coherence first, as it blocks all downstream progress on aggregation. Collective coherence follows, as it inherits pairwise assumptions but introduces irreducible social-choice challenges. Hierarchical approaches are last, as they presuppose solutions to the prior two and risk obscuring foundational normative issues. 

  **First Priority: Pairwise Coherence**  
  *Question:* What minimal logical, dynamic, and normative conditions ensure coherence between an agent’s current self and their idealized future self during volitional extrapolation?  
  *Upstream Blockage:* Without this, collective and hierarchical models lack defined inputs (individual extrapolated volitions) and cannot address normative desirability, blocking all aggregation efforts.  
  *Tractability:* Highly tractable—philosophers can analyze reflective equilibrium and idealization paradoxes, while logicians model fixed-point convergence or stability in modal frameworks.  
  *Revision Trigger:* A proof that pairwise coherence reduces to a trivial decision rule (e.g., "defer to current preferences") would deprioritize CEV entirely. Conversely, constructing a non-arbitrary fixed-point model for idealized preference convergence would elevate it.  

  **Second Priority: Collective Coherence**  
  *Question:* Under what consistency constraints can conflicting pairwise-extrapolated volitions from a population be aggregated without violating minimal fairness or rationality?  
  *Upstream Blockage:* Pairwise outputs are meaningless for societal CEV until collective coherence resolves conflicts—otherwise, social-choice paradoxes (e.g., cycling majorities under idealization) proliferate.  
  *Tractability:* Moderately tractable—social-choice theorists can extend impossibility theorems to idealized agents, while ethicists define "fair" aggregation of divergent volitions (e.g., avoiding tyranny of the idealized).  
  *Revision Trigger:* An impossibility theorem showing that no aggregation rule satisfies both Pareto efficiency and pairwise-consistency under idealization would shift focus to hierarchical models. A possibility proof for a conflict-resolution mechanism would accelerate collective frameworks.  

  **Third Priority: Hierarchical Coherence**  
  *Question:* Can hierarchical delegation (e.g., meta-agents representing groups) resolve collective conflicts while preserving individual volitional integrity, and under what legitimacy conditions?  
  *Upstream Blockage:* Hierarchical designs depend on pairwise and collective coherence to define representative legitimacy and meta-aggregation rules—without these, they risk misrepresenting individuals or compounding biases.  
  *Tractability:* Lower tractability—philosophers must justify delegation without empirical data, while formalists face complexity in multi-level preference lattices.  
  *Revision Trigger:* A demonstration that hierarchical aggregation inevitably distorts pairwise volitions (e.g., via strategic manipulation proofs) would deprioritize it. A representation theorem aligning hierarchical outputs with direct collective coherence would make it central.  

  **Deprioritized Areas**  
  - **Empirical preference dynamics**: Excluded by mandate; conceptual progress requires no behavioral data.  
  - **Scalable ML implementations**: Beyond scope—tractability hinges on theory, not compute.  
  - **Domain-specific applications (e.g., policy)**: Premature without foundational coherence resolved.  

  **Resource Allocation**  
  - **Philosophers**: 3  
  - **Formal theorists**: 3  
  - **Rationale**: Balanced pairing ensures philosophical rigor in normative framing (e.g., autonomy preservation) and formal precision in modeling coherence (e.g., graph-theoretic aggregation). Cross-disciplinary teams will tackle pairwise/collective tensions iteratively.  

