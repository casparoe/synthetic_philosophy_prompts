  The conceptual foundations of coherent extrapolated volition (CEV) require urgent attention, particularly the underdeveloped tension between pairwise, collective, and hierarchical formulations of coherence. Given resource constraints, we prioritize first resolving the coherence conditions for the pairwise (individual) case, as it is the foundational building block without which collective and hierarchical approaches cannot be properly evaluated. This question is highly tractable for philosophers and logicians, relying on conceptual analysis and formal modeling of idealized reflection. A constructive proof of a fixed-point for individual coherence would elevate this area, while an impossibility result would force a reevaluation.

  Second, we tackle collective coherence to address the aggregation of multiple idealized volitions. This step is necessary because societal CEV requires combining individual volitions, and it becomes tractable once the individual case is clarified. Progress here depends on adapting social choice theory to the CEV context. An impossibility result akin to Arrow's theorem would necessitate a pivot to hierarchical methods.

