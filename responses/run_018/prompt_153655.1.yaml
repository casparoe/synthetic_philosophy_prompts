  However, in the standard CEV narrative, the pairwise (individual) is the starting point (extrapolating an individual's volition after reflection), and then we aggregate across individuals. But the collective case might present new challenges because of interdependencies.

  But the problem says that the tension is underdeveloped. So we should focus on the tension itself.

  I propose:

  First priority: Clarify the coherence conditions for the pairwise case (individual CEV) and how they might generalize to the collective case.

  Why?
  - Without a clear account of what it means for an individual's extrapolated volition to be coherent (both with their current self and across the process of idealization), we cannot even begin to think about aggregating multiple such volitions. This is the foundational building block.
  - Upstream blockage: Downstream work on collective aggregation and hierarchical structures cannot proceed without a clear model of the individual case. Also, without this, we cannot define what a "volition" is that we are aggregating.
  - Tractability: This is highly tractable for philosophers and logicians. It involves conceptual analysis of coherence (e.g., consistency, stability under reflection) and formal modeling (e.g., using modal logics, decision theory, fixed-point constructions). No empirical work needed.
  - Revision trigger: If within 2-3 years we can prove that a minimal set of coherence conditions (e.g., consistency, convergence under reflection) can be satisfied in a formal model of idealized reasoning, then we can move to aggregation. If we find that even the pairwise case is intractable (e.g., we prove that no non-trivial fixed-point exists for a broad class of agents), then we might have to deprioritize CEV and look for alternatives.

  Second priority: Develop a framework for collective coherence that addresses the aggregation of multiple pairwise-extrapolated volitions, including how to handle conflicts and interdependencies.

  Why?
  - Once we have a model for the individual, we must combine them. But the collective case introduces new challenges: what if the idealized volitions of different individuals conflict? How do we define coherence for the group? This is central to the societal application of CEV.
  - Upstream blockage: Without this, we cannot build a complete CEV for groups. Also, the hierarchical approach (if we choose that) depends on having a collective aggregation method.
  - Tractability: This is also tractable without ML. It draws on social choice theory, game theory, and normative philosophy. We can model aggregation rules and study their properties formally.
  - Revision trigger: If we can prove an impossibility result (like Arrow's theorem) for collective CEV, showing that no aggregation method can satisfy a set of minimal coherence conditions, then we might have to pivot to hierarchical approaches or reconsider the project. Conversely, a constructive proof of a possibility result would elevate this area.

  Third priority: Investigate the hierarchical approach as a potential solution to the challenges of collective aggregation, including the design of representative idealized agents and the meta-aggregation of their outputs.

  Why?
  - The hierarchical approach might be a way to circumvent the problems of direct collective aggregation. But it is more complex and might be less transparent. We need to see if it can provide a coherent and normatively justified alternative.
  - Upstream blockage: This is a potential alternative to direct aggregation, so it depends on the challenges we find in the collective case. Without knowing the limitations of the collective approach, we cannot properly evaluate hierarchical methods.
  - Tractability: This is more speculative and might require more abstract modeling. However, it can still be done with formal tools (e.g., multi-level aggregation, delegation models). It is tractable but more challenging.
  - Revision trigger: If we can show that a hierarchical model can satisfy both individual and collective coherence conditions (e.g., by proving representation theorems), then it becomes a top candidate. If we find that it inevitably leads to a loss of individual autonomy or produces incoherent results, then we deprioritize it.

  Deprioritized areas:
