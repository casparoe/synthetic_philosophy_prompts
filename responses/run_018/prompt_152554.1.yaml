  Write a dialogue between a defender of the Rietdijk-Putnam argument and someone who holds a "local becoming" view (compatable with relativity but denying all events are equally real). They're stuck on a delayed flight and start arguing over a specific case: a ship captain near a black hole gets an order that, due to gravitational time dilation, is dated both before and after her departure depending on the referance frame. The block-universe person says the order's content is already fixed regardless of frame; the other person says there's no fact of the matter about whether it already happened until a local interaction resolves it. They should actually respond to each other—no strawmen. At some point one should ask what this means for an AI oversight system that has to make commitments across frames without being able to search for an objective now. Keep it grounded, don't ask for bibliographies or quotes from papers. Write it like you're asking a friend to draft this for your philosophy club—feel free to be a bit messy with wording.
