prompt: |-
  I am drafting a novel of literary science fiction in which scientific thought experiments occur as lived narrative episodes—scenes in which characters reason through imagined apparatuses or biological impossibilities not as metaphors but as attempts to extend conceptual understanding. I need a reusable decision procedure, grounded in the philosophy of science on how thought experiments yield knowledge, that I can run on any proposed scene before committing it to manuscript. The procedure must be executable in about thirty minutes by someone without formal philosophical training; it should take the form of an ordered checklist with explicit stopping conditions, specify what counts as a sufficient answer at each stage, and clearly flag the points where judgment cannot be eliminated and must be referred either to my science consultant or to my own narrative authority. It must distinguish scenes that genuinely function as argument-based or Platonic thought experiments—yielding conceptual knowledge about an existing theory—from scenes that are merely facilitative illustrations, empirically ungrounded hypotheses, or category mistakes disguised as reasoning.

  Please construct the procedure by translating the core philosophical distinctions—between argument-reconstruction accounts, Platonic-access-through-idealization accounts, and the conditions under which imaginative scenarios smuggle hidden empirical premises—into practical tests that a practicing writer can apply. Do not include bibliographies, reading lists, or citation requests. Then apply the procedure step by step to three narrative proposals I am considering.

  First, a scene in which a blind physicist derives the relativity of simultaneity using only a tactile train-model and mental arithmetic, with no instrumental observation—an eliminative idealization of a classic relativistic case, but stripped of all visual intuition and rendered purely through haptic reasoning.

  Second, a scene in which a biologist imagines a symbiotic organism that transmits acquired neural patterns to offspring via epigenetic encoding in gut microbiota, explicitly framing the scenario as a conceptual test of whether the Weismann barrier can be dissolved in principle rather than violated empirically.

  Third, a scene to which I am particularly attached—one I hope will work—in which a quantum observer becomes phenomenologically entangled with a particle and subjectively experiences superposition, with the narrative treating this first-person report as bearing directly on the measurement problem.

  For each case, run the procedure, identify the closest philosophical analog if relevant, and deliver a final verdict: whether the scene yields conceptual knowledge, yields only a testable empirical hypothesis, functions as pedagogical illustration, or fails altogether. Ensure that the quantum-entanglement scene receives a negative verdict, and that the procedure makes the reason for that rejection explicit rather than intuitive. Finally, state precisely what the procedure cannot do: the boundary conditions under which narrative imagination exceeds its epistemic authority, and the categories of scientific question that must be handed off to empirical work regardless of how compelling the fiction is.
reasoning: |-
  We are constructing a decision procedure for evaluating whether a narrative scene functions as a genuine thought experiment (yielding conceptual knowledge) or falls into one of the other categories (illustration, ungrounded hypothesis, category mistake, etc.). The procedure must be:

  1. Executable in about 30 minutes by someone without formal philosophical training.
  2. An ordered checklist with explicit stopping conditions.
  3. Specify what counts as a sufficient answer at each stage.
  4. Flag points where judgment is required and must be referred to a science consultant or the writer's narrative authority.

  The procedure will be based on key philosophical distinctions:

  - **Argument-reconstruction accounts**: Thought experiments as arguments that reconstruct what we already know, but in a way that reveals new conceptual connections or contradictions.
  - **Platonic access through idealization**: Thought experiments that use idealized scenarios to access abstract truths (e.g., in mathematics or fundamental physics) that are independent of empirical details.
  - **Hidden empirical premises**: Scenarios that seem a priori but actually rely on unstated empirical assumptions, which might be false.

  We will design a 7-step checklist:

  **Step 1: Identify the Target Theory**
     - What established scientific theory or concept is the scene attempting to explore? (e.g., relativity, epigenetics, quantum mechanics)
     - *Sufficient answer*: A clear statement of the theory or concept, with reference to its standard formulation (e.g., "Einstein's relativity of simultaneity", "the Weismann barrier in genetics").
     - *If unclear or absent*: Stop. This is not a thought experiment but possibly a speculative hypothesis or a different kind of scene.

  **Step 2: Distinguish Conceptual from Empirical**
     - Is the scene's goal to clarify a concept within the theory (e.g., what simultaneity *means* in relativity) or to generate a new empirical prediction (e.g., predicting a new particle)?
     - *Sufficient answer*: A statement that the goal is conceptual (e.g., to show a necessary consequence of the theory, to expose a contradiction, to clarify a definition) or empirical.
     - *If empirical*: Then it is generating a testable hypothesis, not a thought experiment yielding conceptual knowledge. Stop and flag as "testable hypothesis".
     - *If conceptual*: Proceed.

  **Step 3: Map to Standard Thought Experiment or Argument Structure**
     - Does the scene mirror a known thought experiment in the field (e.g., Einstein's train for simultaneity) or can it be reconstructed as a logical argument (premises -> conclusion) that is valid?
     - *Sufficient answer*: Either (a) a known thought experiment is named and the scene is a variant, or (b) the scene can be broken down into clear premises and a conclusion that follows logically.
     - *If neither*: Stop and flag as "not a thought experiment" (possibly an illustration or a category mistake).

  **Step 4: Check for Hidden Empirical Premises**
     - Does the imagined scenario rely on assumptions about how the world works that are not purely logical or mathematical? (e.g., assuming that a train moving at relativistic speeds would behave in a certain way, which is actually an empirical fact from relativity)
     - *Sufficient answer*: List the key assumptions. Then ask: Are these assumptions already part of the target theory? Or are they new and untested?
     - *If they are part of the theory*: Then they are acceptable as part of the conceptual exploration.
     - *If they are new and untested*: Then the scene is smuggling in empirical assumptions. Stop and flag as "ungrounded hypothesis" if the assumptions are testable, or "category mistake" if they are inconsistent with the theory.
     - *If unsure*: This is a judgment call. Refer to science consultant.

  **Step 5: Assess Idealization and Distortion**
     - Does the scene remove irrelevant details (idealization) without distorting the core concept? (e.g., a frictionless plane in mechanics is an idealization that doesn't distort Newton's laws, but adding telepathy to a physics experiment would distort it)
     - *Sufficient answer*: Identify the idealizations and judge if they preserve the essential structure of the target theory.
     - *If they distort the core concept*: Stop and flag as "category mistake".
     - *If they are acceptable*: Proceed.

  **Step 6: Determine Epistemic Output**
     - What kind of knowledge does the scene produce? 
       - Does it reveal a contradiction in the target theory? (e.g., like the twin paradox in relativity, which is resolved by the theory itself)
       - Does it demonstrate a necessary consequence of the theory? (e.g., the relativity of simultaneity follows from the postulates)
       - Does it clarify a concept by removing inessential features? (e.g., the blind physicist removing visual intuition to show the core logic)
     - *Sufficient answer*: One of the above, or a similar conceptual insight.
     - *If the output is merely making the theory easier to understand without new conceptual insight*: Then it is a pedagogical illustration. Flag as such.
     - *If the output is a new conceptual insight about the theory*: Then it is a successful thought experiment.

  **Step 7: Narrative Authority Check**
     - Does the narrative presentation (e.g., first-person experience in quantum entanglement) claim to provide evidence that the theory itself cannot? If so, it may overstep.
     - *Sufficient answer*: If the scene uses narrative devices (like subjective experience) to claim direct knowledge of a theoretical entity (e.g., superposition) that is not accessible by the theory's own methods, then it fails as a thought experiment because it is not reconstructable as an argument or Platonic idealization. It becomes a speculative fiction.
     - *This step requires writer judgment*: If the scene passes all previous steps but here it seems to overstep, then it is not a thought experiment. Flag as "narrative overstep".

  **Final Categories** (after running the steps):
  - **Conceptual knowledge**: Passes steps 1-6 without stopping, and step 7 does not overstep.
  - **Testable empirical hypothesis**: Stopped at step 2 (goal is empirical) or step 4 (new empirical assumptions).
  - **Pedagogical illustration**: Stopped at step 6 (only for understanding, no new insight).
  - **Category mistake**: Stopped at step 3 (no argument structure) or step 5 (distortion).
  - **Fails altogether**: If stopped at step 1 (no target theory) or step 7 (narrative overstep).

  **Boundary Conditions of the Procedure**:
  - The procedure cannot validate the truth of the target theory itself. It only assesses whether the thought experiment properly explores that theory.
  - It cannot replace empirical testing for questions about the actual world (e.g., whether a biological mechanism exists).
  - It cannot resolve foundational debates in science (e.g., interpretations of quantum mechanics) by thought experiment alone if those debates require new empirical data.
  - Narrative imagination exceeds its epistemic authority when it claims direct experiential knowledge of theoretical entities that are not observable (e.g., feeling superposition) or when it invents new causal mechanisms without empirical grounding.

  Now, apply the procedure to the three scenes.

  ---

  **First Scene: Blind physicist and relativity of simultaneity**

  Step 1: Target Theory - Einstein's special relativity, specifically the relativity of simultaneity. Sufficient.

  Step 2: Goal is conceptual - to derive the relativity of simultaneity without visual intuition, showing it is a necessary consequence of the postulates. Proceed.

  Step 3: Mirrors Einstein's train thought experiment. Can be reconstructed as an argument: 
     Premise 1: The speed of light is constant in all inertial frames.
     Premise 2: Two events simultaneous in one frame (e.g., the embankment) are not simultaneous in a moving frame (the train).
     The blind physicist uses tactile and arithmetic reasoning to show this. Valid.

  Step 4: The assumptions (constancy of light speed, inertial frames) are part of relativity. No new empirical assumptions. Proceed.

  Step 5: The idealization (removing vision, using a tactile model) does not distort the core concept. It actually clarifies by removing a sensory modality that might be misleading. Proceed.

  Step 6: The epistemic output is a demonstration of a necessary consequence of the theory. It also clarifies the concept by showing it doesn't rely on visual intuition. Pass.

  Step 7: No narrative overstep. The scene is a reasoning process, not a claim of subjective experience beyond what the theory allows.

  Verdict: **Yields conceptual knowledge**. (This is a Platonic-style thought experiment that uses idealization to access a conceptual truth.)

  ---

  **Second Scene: Symbiotic organism and the Weismann barrier**

  Step 1: Target Theory - The Weismann barrier in biology, which states that hereditary information flows only from germ cells to somatic cells and not the other way (thus preventing inheritance of acquired characteristics).

  Step 2: Goal is conceptual - to test whether the barrier can be "dissolved in principle" (i.e., is it logically possible within biology?) rather than violated. Proceed.

  Step 3: This is not a direct mirror of a standard thought experiment, but it can be reconstructed as an argument:
     Premise: If there exists a mechanism (epigenetic encoding via gut microbiota) that transmits acquired neural patterns to offspring, then the Weismann barrier is not an absolute barrier but a contingent one.
     Conclusion: Therefore, the barrier is not a fundamental principle but a mechanistic constraint that might be bypassed.

  Step 4: The imagined mechanism (epigenetic encoding in gut microbiota that transmits neural patterns) is an empirical assumption. Is it part of current biology? Current biology does recognize epigenetic inheritance, but not typically of neural patterns via gut microbiota. This is a new and untested mechanism. Therefore, the scene is smuggling in an empirical premise. 

     *Judgment call*: Refer to science consultant. If the mechanism is plausible within current biology (even if not proven), then it might be acceptable as a "what if" within the theory. But if it is entirely speculative, then it's an ungrounded hypothesis.

     Given the explicit framing ("in principle"), we might argue that the thought experiment is testing the logical possibility, so the empirical details are secondary. However, the mechanism must still be consistent with known biology. Without a science consultant, we must be cautious.

     Since the scene is about dissolving the barrier *in principle*, the key is whether the mechanism is logically possible without violating fundamental laws. The consultant would be needed to confirm if this mechanism is consistent with current theory.

     For now, we note: if the mechanism is inconsistent with known biology, then it's a category mistake. If it is consistent but unproven, then the thought experiment yields a testable hypothesis.

     Based on current knowledge: Epigenetic inheritance is real, but the transmission of specific neural patterns via gut microbiota is speculative. Therefore, the scene is generating a testable hypothesis about a mechanism that might bypass the Weismann barrier.

     Stopped at Step 4: Flag as **testable empirical hypothesis**.

     However, note: the goal was conceptual (to show the barrier is not absolute in principle). But the way it's done introduces an empirical mechanism. A purely conceptual dissolution would require showing that the barrier is not a logical necessity. The scene does not do that without the empirical mechanism.

     Verdict: **Yields a testable empirical hypothesis** (about a potential biological mechanism) rather than pure conceptual knowledge about the Weismann barrier.

  ---

  **Third Scene: Quantum observer experiencing superposition**

  Step 1: Target Theory - Quantum mechanics, specifically the measurement problem (how superposition collapses to a definite state upon measurement).

  Step 2: Goal is conceptual - to address the measurement problem by having an observer subjectively experience superposition. The narrative treats the first-person report as bearing directly on the problem. Proceed.

  Step 3: Does it mirror a standard thought experiment? There are thought experiments in quantum mechanics (e.g., Schrödinger's cat, Wigner's friend) that involve observers, but they are arguments about the theory, not subjective experiences. The scene is not reconstructable as a logical argument because it is a first-person report. It is not an argument but an account of experience.

     *Stopping condition*: Without a clear argument structure, it fails Step 3. However, let's see if it can be forced into an argument. For example:

     Premise: If an observer can experience superposition, then the measurement problem is resolved because it shows that superposition is a state that can be directly known.

     But this premise is not part of quantum theory. Quantum theory does not allow observers to be in superposition in the same way as particles (due to decoherence). Therefore, the premise is false according to standard quantum mechanics.

     Thus, it is not a valid reconstruction. Stop at Step 3? Or move to Step 4?

  Step 4: The scene relies on a hidden empirical premise: that an observer can be phenomenologically entangled and experience superposition. This is not just an idealization but an empirical claim that is not supported by current theory. In fact, it contradicts the standard view that conscious observers cause collapse (in some interpretations) or that decoherence prevents such experiences. Therefore, it is a new and untested (and likely false) empirical premise.

     Step 4 would flag it as an ungrounded hypothesis. But note: the narrative is treating the experience as directly bearing on the measurement problem, which is a conceptual issue. However, the premise is empirically false.

  Step 5: The idealization (an observer in superposition) distorts the core concept because quantum mechanics does not allow for macroscopic observers to be in superposition in a way that they could report on it. This is a category mistake: applying quantum superposition to conscious experience in a way that is not supported by the theory.

  Step 6: The epistemic output is claimed to be a resolution of the measurement problem by direct experience. But this is not a conceptual insight because it does not follow from the postulates of quantum mechanics. It is an assertion.

  Step 7: This scene is a clear narrative overstep: it uses first-person experience to claim knowledge that the theory itself does not provide and cannot be tested by standard methods. 

  Verdict: **Fails altogether** (due to category mistake and narrative overstep). The scene is not a thought experiment but a speculative narrative that oversteps the bounds of what a thought experiment can do.

  The reason for rejection is explicit: the scene introduces an empirically false premise (that an observer can experience superposition) and uses narrative to claim direct knowledge of a theoretical entity, which is not allowed in scientific thought experiments. Moreover, it distorts the target theory.

  ---

  **Summary of Verdicts**:
  1. Blind physicist: **Yields conceptual knowledge** (successful thought experiment).
  2. Symbiotic organism: **Yields a testable empirical hypothesis** (not pure conceptual knowledge because it relies on a speculative mechanism).
  3. Quantum observer: **Fails altogether** (category mistake and narrative overstep).

  **Boundary Conditions** (as per the procedure's limitations):
  - The procedure cannot validate the truth of the target theory (e.g., relativity, the Weismann barrier, quantum mechanics). It only assesses the thought experiment's internal coherence and relation to the theory.
  - It cannot resolve empirical questions: for example, whether epigenetic transmission of neural patterns via gut microbiota actually occurs. That requires laboratory work.
  - It cannot adjudicate between competing interpretations of a theory (e.g., different interpretations of quantum mechanics) by thought experiment alone if the interpretations are empirically equivalent.
  - Narrative imagination exceeds epistemic authority when:
     a) It invents new causal mechanisms without empirical grounding (as in the symbiosis scene) and presents them as conceptual truths.
     b) It claims direct experiential knowledge of unobservable theoretical entities (as in the quantum scene).
     c) It distorts the target theory by introducing elements inconsistent with it.
answer: |-
  Below is the decision procedure you requested, followed by its application to your three narrative proposals. The procedure is distilled from key philosophical accounts of thought experiments (argument-reconstruction, Platonic idealization, and empirical-premise analysis) into a practical 7-step checklist. Each step includes:  
  - **Question**: The core test.  
  - **Action**: What to do.  
  - **Sufficient Answer**: What qualifies as a pass.  
  - **Stopping Condition**: When to halt and categorize the scene.  
  - **Judgment Flag**: Points where you must consult your science consultant or invoke narrative authority.  

  **Total Runtime**: 20–30 minutes per scene.  
  **Output Categories**:  
  1. **Conceptual Knowledge**: Yields non-empirical insight about an existing theory.  
  2. **Testable Hypothesis**: Generates an empirical claim requiring real-world testing.  
  3. **Pedagogical Illustration**: Clarifies existing knowledge without new insight.  
  4. **Fails**: Category mistake, hidden empirical premise, or narrative overstep.  

  ---

  ### **Decision Procedure: Thought Experiment Validator**  
  **Step 1: Target Theory Identification**  
  - **Question**: What established scientific theory or concept does the scene directly engage?  
  - **Action**: State the theory in one sentence (e.g., "relativity of simultaneity in special relativity").  
  - **Sufficient Answer**: Clear reference to a real, non-speculative theory (e.g., from physics, biology).  
  - **Stopping Condition**: If no specific theory is referenced, categorize as **Fails (no target)**.  
  - **Judgment Flag**: If the theory is ambiguous, consult your science consultant.  

  **Step 2: Goal Classification**  
  - **Question**: Is the scene's goal to *extend understanding of the target theory itself* (conceptual) or to *propose how the world could work differently* (empirical)?  
  - **Action**: Identify the primary output: conceptual insight (e.g., resolving a paradox) vs. empirical prediction (e.g., "what if this existed?").  
  - **Sufficient Answer**: Conceptual goals focus on necessity, possibility, or contradiction within the theory (e.g., "shows simultaneity must be relative").  
  - **Stopping Condition**: If the goal is empirical (e.g., predicting a new entity/mechanism), categorize as **Testable Hypothesis**.  
  - **Judgment Flag**: If borderline, invoke narrative authority to clarify intent.  

  **Step 3: Argument Reconstruction**  
  - **Question**: Can the scene be rewritten as a logical argument with premises leading to a conclusion about the target theory?  
  - **Action**: Outline the argument (e.g., "Premise 1: Light speed is constant. Premise 2: Measurements differ by frame. Conclusion: Simultaneity is relative").  
  - **Sufficient Answer**: The argument must be deductive (necessarily true if premises hold) or reveal a contradiction.  
  - **Stopping Condition**: If no valid argument exists, categorize as **Pedagogical Illustration** (if explanatory) or **Fails (non-argument)**.  
  - **Judgment Flag**: If premises are unclear, consult science consultant for validity.  

  **Step 4: Empirical Premise Audit**  
  - **Question**: Do any premises rely on *untested assumptions* about how the physical world works?  
  - **Action**: List all premises. Flag any not derived from the target theory or logical/mathematical truths.  
  - **Sufficient Answer**: All premises must be either (a) axioms of the theory, (b) mathematical truths, or (c) benign idealizations (e.g., frictionless planes).  
  - **Stopping Condition**: If untested empirical premises exist (e.g., "gut microbes transmit neural patterns"), categorize as **Testable Hypothesis** or **Fails (smuggled premise)**.  
  - **Judgment Flag**: If premise legitimacy is unclear, consult science consultant.  

  **Step 5: Idealization Check**  
  - **Question**: Does the scene remove real-world complexities *without distorting the target theory*?  
  - **Action**: Compare the idealized scenario to the theory’s formal structure (e.g., "Does ignoring vision alter relativity’s math?").  
  - **Sufficient Answer**: Idealization must preserve the theory’s core relationships (e.g., spacetime intervals in relativity).  
  - **Stopping Condition**: If idealization contradicts the theory (e.g., "superposition applies to human consciousness"), categorize as **Fails (category mistake)**.  
  - **Judgment Flag**: If distortion risk is high, consult science consultant.  

  **Step 6: Epistemic Output**  
  - **Question**: Does the scene produce *new conceptual insight* or *restate existing knowledge*?  
  - **Action**: Contrast the outcome with textbook explanations of the theory.  
  - **Sufficient Answer**: New insight exposes necessity, possibility, or tension within the theory (e.g., "relativity of simultaneity is inescapable").  
  - **Stopping Condition**: If it only aids comprehension (e.g., "visualizing time dilation"), categorize as **Pedagogical Illustration**.  
  - **Judgment Flag**: If impact is unclear, invoke narrative authority.  

  **Step 7: Narrative Boundary Check**  
  - **Question**: Does the scene claim *experiential or subjective knowledge* inaccessible to the theory’s methods?  
  - **Action**: Identify any narrative devices (e.g., first-person phenomenology) that assert direct revelation.  
  - **Sufficient Answer**: The scene must not treat imagination as evidence (e.g., "I feel quantum superposition" is invalid).  
  - **Stopping Condition**: If subjective experience is presented as data, categorize as **Fails (narrative overstep)**.  
  - **Judgment Flag**: Always final—invoke narrative authority if overstep is disputed.  

  ---

  ### **Application to Your Narrative Proposals**  
  **Scene 1: Blind Physicist and Relativity of Simultaneity**  
  - **Step 1**: Target theory = Einstein’s relativity of simultaneity (special relativity). **Pass**.  
  - **Step 2**: Goal = conceptual (derive simultaneity relativity from postulates, sans vision). **Pass**.  
  - **Step 3**: Argument = Premise 1: Light speed constant in all frames. Premise 2: Tactile/arithmetic measurements differ by motion. Conclusion: Simultaneity is frame-dependent. **Pass** (reconstructs Einstein’s train).  
  - **Step 4**: Premises = relativity postulates + arithmetic; no new empirical claims. **Pass**.  
  - **Step 5**: Idealization = removing vision; preserves Lorentz transformations. **Pass** (Platonic idealization).  
  - **Step 6**: Output = new insight (relativity is haptically provable, not visually intuitive). **Pass**.  
  - **Step 7**: No subjective claims; pure reasoning. **Pass**.  
  - **Verdict**: **Conceptual Knowledge** (Platonic idealization account).  

  **Scene 2: Symbiotic Organism and Weismann Barrier**  
  - **Step 1**: Target theory = Weismann barrier (germline/soma separation in genetics). **Pass**.  
  - **Step 2**: Goal = conceptual ("dissolve barrier in principle"). **Pass**.  
  - **Step 3**: Argument = Premise 1: Epigenetic encoding can transmit neural patterns. Premise 2: Gut microbiota bridge germline/soma. Conclusion: Barrier is circumventable. **Partial pass**—structure exists but Premise 1 is empirical.  
  - **Step 4**: Premise 1 (epigenetic neural transmission) is an untested biological mechanism, not a logical truth. **Stop**.  
  - **Stopping Condition**: Untested empirical premise → **Testable Hypothesis**.  
  - **Note**: The "in principle" framing masks a smuggled empirical premise. Philosophical analog = "hidden empirical premise" account (e.g., Norton).  

  **Scene 3: Quantum Observer Experiencing Superposition**  
  - **Step 1**: Target theory = quantum measurement problem. **Pass**.  
  - **Step 2**: Goal = conceptual (address measurement via subjective experience). **Pass**.  
  - **Step 3**: Argument = None. The scene is a first-person report ("I feel superposition"), not a deductive chain. **Stop**.  
  - **Stopping Condition**: No argument structure → **Fails (non-argument)**.  
  - **Additional Analysis** (for clarity):  
    - **Step 4**: Premise = "consciousness can experience superposition"—untested and inconsistent with quantum decoherence. **Fails (smuggled premise)**.  
    - **Step 5**: Idealization = applying superposition to human observation; disturbs quantum theory’s rules (measurement requires collapse). **Fails (category mistake)**.  
    - **Step 7**: Narrative overstep = treating subjective experience as data about superposition. **Fails (narrative overstep)**.  
  - **Verdict**: **Fails altogether**. Philosophical analog = category mistake (confusing mathematical abstraction with phenomenal experience).  

  ---

  ### **Boundary Conditions: What the Procedure Cannot Do**  
  This procedure identifies when a narrative scene *functions* as a valid thought experiment, but it has inherent limits:  
  1. **Cannot Validate Theories**: It assesses if a scene properly engages a theory, but not if the theory itself is true (e.g., relativity could be wrong).  
  2. **Cannot Resolve Empirical Questions**: Scenes that generate testable hypotheses (e.g., gut-microbiota epigenetics) must be handed to real science—no thought experiment can replace lab work.  
  3. **Cannot Access Unobservables via Narrative**: Subjective experience (e.g., "feeling quantum superposition") is always an overstep. Science requires intersubjective verification; imagination cannot grant authority to private phenomena.  
  4. **Cannot Settle Interpretive Debates**: For theories with multiple interpretations (e.g., quantum mechanics), thought experiments can clarify but not resolve disputes without empirical input.  
  5. **Judgment Boundaries**: Where steps flag ambiguity (e.g., premise validity in Step 4), the procedure defers to experts or your narrative intent. It cannot override domain expertise.  

  **Key Takeaway**: Thought experiments yield conceptual knowledge only when they are arguments or idealizations that *reveal necessities within existing theories*. Narrative imagination exceeds its epistemic authority when it invents untested mechanisms, conflates categories, or treats subjective experience as evidence. The quantum scene fails because it commits all three errors. Use this procedure as a "first-pass" filter, then collaborate with your science consultant on flagged judgments.
