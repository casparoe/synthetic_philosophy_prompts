prompt: |-
  A pop-econ book I picked up explains revealed preference like this: "Economists used to think utility meant pleasure or satisfaction, but that was unscientific since you can't measure feelings. Paul Samuelson fixed this in the 1930s by proposing we infer utility purely from choices: whatever you pick must be what maximizes your utility, by definition. So utility just means 'whatever your choices are aimed at.' This proves that people are basically rational and that whatever someone chooses is what's best for them -- critics who point to framing effects or impulsive choices don't realize these just reveal different, equally real preferences." My friend who's into econ said the first half is roughly right but the whole thing smells off, and I cant tell where the sleight of hand is. Is this a fair summary? Give me your answer as exactly five numbered items, one or two sentences each, separating what the book gets right, where it overreaches, and whether the "critics don't get it" move works -- no intro or conclusion.
reasoning: |-
  Okay, let me tackle this user's query about revealed preference theory. The user read a pop-econ book's summary and feels their economist friend's "smells off" comment might be valid but can't pinpoint why. 

  First, I need to verify the factual accuracy of the book's claims. The historical part about Samuelson shifting utility from cardinal to ordinal measurement seems correct - that's standard econ textbook material. The core idea of inferring preferences from choices also holds up.

  But where does it overreach? The phrase "this proves people are basically rational" jumps out as problematic. Revealed preference describes consistency, not psychological rationality. Behavioral economics shows choices can be inconsistent due to cognitive biases, which directly contradicts this claim. 

  The "whatever someone chooses is what's best for them" part is particularly troubling. It's a normative leap from positive analysis - welfare judgments require stronger assumptions than revealed preference alone provides. 

  Regarding the critics dismissal: framing effects aren't about "different preferences" but precisely about inconsistent preferences revealed through choice architecture. That's a fundamental misunderstanding of behavioral critiques. 

  The user seems to want precise, structured clarification without fluff. Five bullet points will work well: two for what's correct, two for overreaches, one for why dismissing critics fails. Need to keep each point razor-sharp - no room for ambiguity in explaining these nuances.
answer: |-
  Here are five numbered items addressing the summary:

  1.  **Gets right:** The book correctly describes the shift from cardinal utility (measurable satisfaction) to ordinal utility inferred from choices, crediting Samuelson's revealed preference theory for grounding utility in observable behavior.
  2.  **Gets right:** It accurately captures the core tenet of revealed preference: that economists define utility maximization based on the choices people *actually make*, not unobservable internal states.
  3.  **Overreaches:** It incorrectly claims revealed preference theory "proves that people are basically rational" and that "whatever someone chooses is what's best for them." Revealed preference *describes* consistent choices under specific assumptions; it doesn't prove universal rationality or normative welfare judgments.
  4.  **Overreaches:** The statement implies revealed preference theory validates *any* choice as optimal for the individual "by definition," ignoring crucial assumptions (like stable preferences and full consideration) often violated by impulses or framing.
  5.  **Critics rebutted wrong:** Dismissing critics by claiming framing/impulses reveal "different, equally real preferences" misunderstands the critique: behavioral findings show choices are *inconsistent*, violating revealed preference's core axioms, not revealing stable underlying preferences.
