answer: |-
  **MEMORANDUM**  
  **TO:** University Board of Trustees  
  **FROM:** Committee for Institutional Safety and Legitimate Coercion  
  **DATE:** October 26, 2023  
  **SUBJECT:** Recommendation on Restructuring Campus Policing: Jurisdictional Legitimacy and Future Security Architecture  

  ---

  ### **I. EXECUTIVE SUMMARY**  
  This Committee recommends the **complete abolition of the armed campus police department** and its replacement with a dedicated **Unarmed Crisis Response and Community Safety Unit (UCR-CSU)**. This transition resolves an irreconcilable tension in the conceptual legitimacy of coercive authority within a non-sovereign academic institution, while proactively mitigating security fragmentation risks. Implementation will occur through a 24-month phased transition, beginning with a six-month pilot program for the UCR-CSU. The strongest counterargument—that abolition risks creating a dangerous security vacuum by surrendering the Weberian monopoly on violence—is acknowledged but deemed surmountable through integrated protocols with municipal authorities and a unified, equity-centered service model.  

  ---

  ### **II. ANALYSIS: THE JURISDICTIONAL FINK AND LEGITIMATE AUTHORITY**  
  The Committee’s primary concern is the **structural illegitimacy** of maintaining an armed police force under university governance. Max Weber’s definition of the state hinges on a *sovereign entity* possessing the exclusive right to use legitimate violence. Universities, however, are not sovereign bodies. They are academic institutions delegated limited administrative autonomy, lacking the democratic mandate, territorial sovereignty, or constitutional authority necessary to legitimize monopolistic coercive power.  

  This creates a **jurisdictional fink**:  
  - **Formal powers** (arrest, armed intervention, detention) exist de jure through state statutes or institutional policy.  
  - **Legitimating conditions** (sovereignty, robust democratic oversight, transparent chains of accountability) are systematically absent or suppressed by academic governance norms that prioritize collegiality and administrative discretion.  

  Consequently, campus policing operates as a *masked disposition*: its authority is mechanically present but ethically and conceptually inert. The "trigger" for legitimacy—sovereign democratic ratification—can never be met in a university context. Retaining this model perpetuates a fundamental misalignment between power and its justifying foundations, eroding community trust and creating latent liability.  

  #### **Engagement with Counterargument: The Security Vacuum Objection**  
  Critics contend that abolishing campus police surrenders a necessary monopoly on violence, inviting security fragmentation, inequitable emergency responses, and delayed crisis resolution. This argument merits serious consideration.  

  However, the presumed "vacuum" is illusory:  
  1. Universities already rely on municipal police and emergency services for major incidents (e.g., active threats, felony investigations), duplicating resources under the current model.  
  2. Fragmentation stems from *competing authorities* (campus vs. municipal police), not their absence. The UCR-CSU will unify crisis response under a single, specialized unit.  
  3. Equity is undermined by *armed* responses to non-violent incidents (e.g., mental health crises, student conduct issues), disproportionately affecting marginalized groups. An unarmed unit reduces escalatory risk while accelerating aid.  

  The Weberian framework is **conceptually misapplied** to universities. Non-sovereign institutions cannot "inherit" a monopoly on violence; they can only *borrow* it from the state, creating accountability gaps. Centralized security is preserved—and enhanced—through integration with sovereign entities (municipal police, county EMS) and demilitarized first-response protocols.  

  ---

  ### **III. RECOMMENDATION: ABOLITION AND TRANSITION TO UNARMED CRISIS RESPONSE**  
  #### **Proposed Action**  
  - **Immediately dissolve** the armed campus police department.  
  - **Establish a UCR-CSU** staffed by unarmed crisis responders (trained in de-escalation, mental health support, conflict mediation) and community safety officers (focused on physical security, patrol, and rapid coordination with municipal police).  

  #### **Implementation Timeline**  
  | **Phase** | **Timeline** | **Key Actions** |  
  |-----------|--------------|----------------|  
  | **Design & Pilot** | Months 1–6 | - Draft UCR-CSU protocols with municipal police, student groups, and mental health experts. <br> - Launch 24/7 pilot UCR-CSU team to handle non-violent calls (e.g., wellness checks, disputes). |  
  | **Transition** | Months 7–18 | - Transfer 90% of patrol/response duties to UCR-CSU. <br> - Municipal police assume jurisdiction over violent crimes (with UCR-CSU as first contact/liaison). <br> - Retrain former officers for UCR-CSU roles or severance. |  
  | **Full Implementation** | Months 19–24 | - UCR-CSU operational 24/7 for all non-armed responses. <br> - Formalize shared-response protocols with municipal police. <br> - Launch independent oversight council (students/faculty/staff) for accountability. |  

  #### **Mitigating Security Risks**  
  - **Memoranda of Understanding (MOUs)** with municipal police guarantee rapid armed backup for high-risk scenarios.  
  - **Real-time coordination technology** integrates UCR-CSU dispatchers with city/county emergency systems.  
  - **Equity audits** track response times, demographics, and outcomes across campus zones to prevent service gaps.  

  ---

  ### **IV. CONCLUSION AND BOTTOM LINE**  
  The jurisdictional fink inherent in campus policing cannot be resolved through oversight or restructuring; it requires dismantling the illegitimate coercive authority itself. The UCR-CSU model recentrals security under a coherent, academically aligned framework while closing accountability gaps. The security vacuum objection is addressed through formalized external partnerships and a unified, specialized response corps.  

  **The Committee moves that the Board of Trustees approve:**  
  > *"The abolition of the armed campus police department and the establishment of an Unarmed Crisis Response and Community Safety Unit, pursuant to the 24-month transition plan outlined herein."*  

  ---  
  **APPROVED:**  
  Chair, Committee for Institutional Safety and Legitimate Coercion
