    "accessibility_rating": "medium"
  }
  ```  

  **Key Recommendations for Development**:  
  1. Tighten the distinction between *distributing authority over ontology* and *determining ontology*.  
  2. Use physics case studies (e.g., LHC vs. quantum gravity experiments) to demonstrate institutional ontology politics.  
  3. Engage Pickering’s (*The Mangle of Practice*) to show how material, social, and conceptual factors interact in measurement.  
