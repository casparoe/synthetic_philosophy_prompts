prompt: |-
  ok so im a backend engineer with basically zero formal philosophy training — took one ethics course in college and mostly remember the trolley problem — and im trying to prep for a seminar im auditing on multi-level governance. im stuck on subsidiarity and federalism: the US, Germany, Switzerland, and the EU all seem to split power differently, but i cant tell if thats just legal detail or if theres a deeper conceptual problem. i want you to lay out the desiderata that a normative theory of subsidiarity has to meet to count as actually adequate. like, what cases must it get right? does it need to explain why Swiss cantons have tax autonomy but EU member states cant just ignore directives? does democratic accountability have to exist at every tier, or can some levels be technocratic? and heres the weird analogy that keeps bugging me: in distributed systems theres the CAP theorem — consistency, availability, partition tolerance — pick two. is there a political analog? can a system have both strict uniform rights across regions and real local self-rule, or are those jointly unsatisfiable? also, is explaining the difference between EU conferral and US cooperative federalism a hard requirement, or just a camp preference? please map out each criterion with the reasoning behind it, mark which are non-negotiable and which are negotiable, and if some subset is impossible together say so — thats the part i care about most. dont give me a reading list or citations, i wont check them, and i probably misspelled conferral but you get it.
reasoning: |-
  Okay, the user is a backend engineer with minimal philosophy background prepping for a seminar on multi-level governance. They're struggling with subsidiarity vs. federalism, noticing different power splits in US/Germany/Switzerland/EU. Needs a normative framework's "desiderata" – essentially the must-have features for judging any theory of subsidiarity.  

  First, their core ask: a checklist of criteria a good subsidiarity theory MUST meet (non-negotiables) vs. SHOULD meet (negotiables), plus any inherent tradeoffs. The distributed systems analogy (CAP theorem) suggests they want structural tensions made explicit.  

  Breaking down their sub-questions:  
  - Must the theory explain Swiss tax autonomy vs. EU directive compliance? (Yes – it's a stress test for sovereignty allocation)  
  - Can technocratic tiers exist without democratic accountability? (Controversial – negotiable with conditions)  
  - Is there a CAP-like trilemma in governance? (Proposing EDR: Effectiveness, Democratic depth, Regional autonomy – pick two)  
  - Is explaining EU conferral vs. US cooperative federalism mandatory? (Yes – reveals foundational power principles)  

  Non-negotiables I see:  
  1. **Problem-solving efficiency**: Subsidiarity's entire point is optimizing governance outcomes. If a theory can't show why local/central action is preferable case-by-case, it fails.  
  2. **Legitimacy anchors**: Every tier needs justification – either democratic ("we chose this") or output-based ("it works"). No blank checks.  
  3. **Sovereignty clarity**: Must define who can overrule whom, and why. Swiss cantons taxing vs. EU states obeying directives hinges on this.  

  Big tradeoff (the CAP parallel):  
  - **EDR Trilemma**: You can't max out Effectiveness (uniform rights/enforcement), Democratic depth (local self-rule), and Regional autonomy (decentralized power) simultaneously. Examples:  
    - EU prioritizes Effectiveness + Democracy → less Regional autonomy (states can't ignore directives)  
    - Switzerland prioritizes Democracy + Regional autonomy → less Effectiveness (tax disparities)  
    - China prioritizes Effectiveness + Regional autonomy (in theory) → less Democratic depth  

  Why this framework works for them:  
  - **Engineer-friendly**: Criteria act like unit tests ("does this theory pass Problem-solving efficiency?")  
  - **Accepts real-world mess**: Negotiable criteria (like technocratic tiers) acknowledge implementation variability.  
  - **Predictive**: Explains why Germany's "Bundestreue" (federal loyalty) differs from US's "anti-commandeering" doctrine – they optimize different EDR variables.  

  Final note: Their "camp preference" question reveals they want philosophical rigor, not just legal comparisons. The framework forces theories to expose their priorities (e.g., "this model sacrifices strict uniformity for local flexibility").
answer: |-
  Here's a stripped-down, criteria-based framework for evaluating *any* normative theory of subsidiarity, designed like unit tests for governance systems. Non-negotiables are rooted in subsidiarity's core purpose; negotiables reflect implementation choices. The trilemma is real.

  ---

  ### **Non-Negotiable Desiderata**  
  *(Fail one = theory invalid)*

  1. **Problem-Solving Efficiency Justification**  
     - **Requirement**: Must explain **why** a task *must* be assigned to a specific level (local/regional/national/supranational).  
     - **Test Case**: Swiss cantonal tax autonomy vs. EU states obeying directives.  
       - *Passes if*: Theory shows local taxes maximize tailored economic efficiency (local knowledge), while EU directives prevent collective harm (e.g., single market fragmentation).  
     - **Why?** Subsidiarity’s entire purpose is optimizing outcomes by matching tasks to the *smallest competent unit*.

  2. **Sovereignty Fence Posts**  
     - **Requirement**: Must define **unbreakable rules** for when higher levels can override lower levels (and vice versa).  
     - **Test Case**: Can German *Länder* block federal laws? Can the EU force Hungary on rule-of-law issues?  
       - *Passes if*: Theory provides clear thresholds (e.g., "only when lower unit action harms others" or "only for fundamental rights").  
     - **Why?** Without this, "subsidiarity" becomes arbitrary centralization or chaotic decentralization.

  3. **Legitimacy Anchor**  
     - **Requirement**: Every tier *must* derive legitimacy from a defined source (e.g., democracy, expertise, charter).  
     - **Test Case**: Technocratic ECB setting eurozone monetary policy.  
       - *Passes if*: Theory explains why technocracy is legitimate here (e.g., "complexity requires insulation from short-term politics"), *and* ties it back to democratic ratification of the ECB's mandate.  
     - **Why?** Unaccountable power violates subsidiarity’s democratic spirit.

  ---

  ### **Negotiable Desiderata**  
  *(Theory can choose paths but must be consistent)*

  4. **Uniformity vs. Autonomy Tradeoff**  
     - **Requirement**: Must acknowledge the **EDR Trilemma** (effectiveness, democratic depth, regional autonomy). *Pick two:*  
       - **Uniform Rights/Effectiveness** (e.g., identical human rights enforcement everywhere).  
       - **Democratic Depth** (max local self-rule, even if outcomes diverge).  
       - **Regional Autonomy** (sub-units can veto/opt-out of higher policies).  
     - **Test Case**: Why can't Alabama ban contraception if Swiss cantons set school curricula?  
       - *Passes if*: Theory explicitly ranks which 2 of 3 it prioritizes (e.g., EU: Uniformity + Effectiveness > Autonomy; Switzerland: Democratic Depth + Autonomy > Uniformity).  
     - **Why negotiable?** Societies value these differently. But ignoring the tension fails.

  5. **Tier Flexibility Mechanism**  
     - **Requirement**: Must specify how tasks can *move* between levels (e.g., via crisis, court review, referendum).  
     - **Test Case**: COVID responses (local health vs. federal lockdowns).  
       - *Passes if*: Theory has rules for temporary centralization (e.g., "only if threat is systemic and cross-border").  
     - **Why negotiable?** Procedures vary (US: courts; Germany: *Bundesrat*; EU: treaties).

  6. **Asymmetry Tolerance**  
     - **Requirement**: Can some sub-units have *more autonomy* than others?  
     - **Test Case**: US states vs. EU members (all states equal; EU has "enhanced cooperation").  
       - *Passes if*: Theory justifies symmetry (e.g., "prevents fragmentation") or asymmetry (e.g., "accommodates diverse capabilities").  
     - **Why negotiable?** Path-dependent (e.g., US Civil War forced symmetry; EU’s variable geometry).

  ---

  ### **The Trilemma in Action: Why You Can’t Have It All**
  - **EDR Conflict Example**:  
    - If you demand **uniform LGTBQ+ rights** (Uniformity) and **local self-rule** (Democratic Depth), you sacrifice **Regional Autonomy** (higher level imposes rules).  
    - If you want **strong Regional Autonomy** and **local self-rule**, you sacrifice **Uniformity** (e.g., some cantons ban minarets).  
    - If you prioritize **Uniformity** and **Regional Autonomy**, you weaken **Democratic Depth** (e.g., EU directives override local preferences via technocratic processes).  

  ---

  ### **Special Cases the Theory Must Explain**
  - **EU Conferral vs. US Cooperative Federalism**:  
    - **EU**: Power flows *up* from states via treaties ("conferral"). States are sovereign; EU has *only* delegated powers. Directives require local transposition.  
    - **US**: Power flows *down* from the people via Constitution. Federal law trumps state law; states can't veto.  
    - **Hard Requirement**: Theory must explain why conferral needs directives (pooled sovereignty) while US federalism needs supremacy (avoiding state vetoes). *This tests the "Sovereignty Fence Posts" desideratum.*  

  - **Technocratic Tiers**:  
    - Permitted *only if* tied to a legitimacy anchor (e.g., "ECB's independence was democratically ratified by treaties and ensures long-term stability").  

  ---

  ### **Summary: The Framework**
  1. **Non-negotiables**: Efficiency justification, sovereignty fences, legitimacy.  
  2. **Negotiables**: How to handle EDR tradeoffs, task mobility, asymmetry.  
  3. **Trilemma**: Effectiveness, Democratic depth, Regional autonomy — pick two.  
  4. **Must-Explain Cases**: Swiss taxes (autonomy), EU directives (conferred uniformity), US supremacy (constitutional hierarchy).  

  A theory that aces non-negotiables but negotiates the rest can still be valid—but if it ignores the trilemma or can’t explain sovereignty fences, it’s broken. Like CAP, you’re trading off ideals.
