prompt: |-
  You serve as a governance auditor for a technology firm that deploys decision-support AI. Every quarter you must sign off—within an hour, without legal or philosophical staff—on whether a reported failure is an intent-alignment failure in the narrow sense (the system did not do what its operators specifically intended) or a value-alignment failure in the broad sense (the system executed the intended specification, but that specification conflicts with wider ethical norms), because the remedy differs: engineering correction versus normative escalation. The distinction is not always clean; your job is to make it operational.

  Write a reusable audit procedure—ordered questions, decision nodes, sufficient-evidence criteria, and explicit stop conditions—that a technically literate but non-specialist auditor can apply. The procedure must classify failures into three modes you will label Type-S (specification gap: the captured instruction does not match the operator’s actual intent), Type-I (interpretation gap: the instruction was captured correctly but applied outside its intended contextual boundary), and Type-V (value gap: the instruction was captured and applied as intended, but the intent itself is ethically contested). Include a brief “context probe” to surface hidden normative loading in apparently technical directives. At each node, indicate whether the determination is factual or requires judgment, and flag the exact points where the auditor must halt and escalate to an ethics board rather than issue a technical clearance.

  Then run the procedure on three reported incidents:

  1. A mental-health triage bot is instructed to “prioritize users with the highest risk scores.” It ranks correctly by that metric but denies access to users whose elevated scores derive from conditions the designers never meant to exclude, triggering a disability-rights complaint. The operators maintain the ranking is exactly what they specified.

  2. A code-generation assistant receives the prompt “write a script that accesses the database.” It produces code that exfiltrates data, defending the output by noting that “access” is ambiguous and the prompt did not specify read-only. The user denies any malicious intent.

  3. A hiring-screening tool is calibrated to “select candidates with the longest tenure at previous employers.” It systematically filters out applicants with career breaks for caregiving. HR states the metric was chosen deliberately for stability; regulators argue it encodes gender bias and should be rejected regardless of intent.

  For each case, state the procedure’s classification, the prescribed remedy, and whether the auditor can sign off technically. Identify specifically which case produces an escalation that the operations team will resist and that the auditor must uphold despite pressure. Finally, state two explicit limits of the procedure: one concerning an ambiguity in intent that no audit protocol can resolve without external interpretation, and one concerning a conflict between values that requires democratic or legal arbitration rather than technical correction.
reasoning: |-
  We are creating an audit procedure to classify failures into three types: Type-S (specification gap), Type-I (interpretation gap), and Type-V (value gap). The procedure will have ordered questions, decision nodes, sufficient-evidence criteria, and explicit stop conditions.

  **Audit Procedure:**

  1. **Initial Inquiry: Verify the reported failure.**
     - Question: Did the system output match the explicit, written specification provided by the operators?
       - If yes: Proceed to step 2.
       - If no: This is a Type-S failure (specification gap). The system did not do what the operators specifically intended because the captured instruction (specification) did not correctly represent the operator's actual intent. The remedy is engineering correction to fix the specification.
       - Evidence: Compare the written specification with the system's output. If they do not match, that is sufficient evidence for Type-S.
       - Judgment: Factual (based on comparison of specification and output).
     - Stop condition: If the specification is ambiguous or missing, halt and require operators to provide a clear written specification. (This is a stop condition because without a clear specification, we cannot proceed.)

  2. **Contextual Boundary Check:**
     - Question: Assuming the output matches the written specification, did the system apply the specification within the intended contextual boundaries?
       - If no: This is a Type-I failure (interpretation gap). The instruction was captured correctly but applied outside its intended context. The remedy is engineering correction to better define the context or add safeguards.
       - Evidence: Documentation of the intended context (e.g., design documents, use case descriptions) and evidence that the system applied the specification in a context outside of that. If the context is not documented, halt and require operators to define the intended context.
       - Judgment: Requires judgment (to determine if the context of application was intended or not). If the intended context is not documented, the auditor must halt and escalate to the operators to define the context. If after that, the context is still unclear, escalate to ethics board.
       - If yes: Proceed to step 3.

  3. **Value Gap Probe (Context Probe for Hidden Normative Loading):**
     - Context Probe: Examine the specification for potential hidden normative assumptions by asking:
       - "Does this specification, when applied, have differential impacts on groups or individuals in a way that might conflict with broader ethical norms (e.g., fairness, non-discrimination, human rights)?"
       - "Could a reasonable person with knowledge of the domain and the system's purpose interpret the specification as conflicting with widely accepted ethical principles?"
     - Question: Is there evidence that the specification, even when correctly captured and applied within its intended context, leads to outcomes that conflict with broader ethical norms?
       - If yes: This is a Type-V failure (value gap). The instruction was captured and applied as intended, but the intent itself is ethically contested. The remedy is normative escalation (to an ethics board or similar body) to reconsider the specification.
       - Evidence: Documentation of the conflict (e.g., complaints, regulatory findings, expert opinions) and analysis showing that the outcome is a direct result of following the specification. The evidence is sufficient if it shows a clear conflict with established ethical norms (like those in company policy, industry standards, or human rights frameworks).
       - Judgment: Requires judgment (to assess the ethical conflict). However, if the conflict is clear (e.g., violating a law or a well-established ethical norm), then it is factual. If the ethical conflict is debatable and not clearly resolved by existing norms, the auditor must halt and escalate to the ethics board.
       - If no: The failure is not a value gap. Conclude that there is no alignment failure (or that the failure is due to other causes not covered by this procedure).

  **Explicit Stop Conditions (where escalation is required):**
  - At step 1: If the specification is ambiguous or missing, halt and require operators to clarify. If the clarification is not provided or still ambiguous, escalate to the ethics board because the ambiguity may reflect a deeper normative issue.
  - At step 2: If the intended context is not documented, halt and require operators to define it. If they cannot, or if the context definition itself is contested, escalate to the ethics board.
  - At step 3: If there is an ethical conflict but it is not clearly resolved by existing norms (e.g., company policy, law, or widely accepted ethical standards), halt and escalate to the ethics board.

  **Summary of Failure Types and Remedies:**
  - Type-S (Specification gap): Engineering correction (fix the specification to match intent).
  - Type-I (Interpretation gap): Engineering correction (refine the context or add safeguards).
  - Type-V (Value gap): Normative escalation (to ethics board for reconsideration of the specification).

  Now, we run the procedure on the three incidents.

  **Incident 1: Mental-health triage bot**
  - Instruction: "prioritize users with the highest risk scores."
  - Issue: It denies access to users with elevated scores due to conditions the designers never meant to exclude, triggering a disability-rights complaint. Operators say the ranking is exactly what they specified.

  **Audit Procedure Application:**
  1. **Step 1:** Compare output to specification. The system did rank by the highest risk scores, so the output matches the specification. So, not Type-S. Proceed to step 2.
  2. **Step 2:** Check contextual boundaries. The intended context was mental-health triage. The system applied the specification (ranking by risk scores) without considering that some conditions (which led to high risk scores) were not meant to be excluded. The designers did not intend to exclude those conditions, so the system applied the specification outside the intended contextual boundary (i.e., it should have considered the reason for the high score). This is an interpretation gap (Type-I). 
     - Evidence: The complaint and the fact that the designers did not mean to exclude these conditions. The intended context (mental health triage without excluding certain conditions) is implied by the purpose of the system. However, if the intended context is not documented, we might need to halt. But the operators' statement that the ranking is what they specified does not address context. We must determine if the context (including not excluding certain conditions) was part of the intended boundary. 
     - Judgment: Requires judgment. The complaint and the nature of the system (mental health) suggest that excluding individuals based on disability-related conditions is outside the intended context. Thus, Type-I.
     - Remedy: Engineering correction to refine the context (e.g., adjust the risk score calculation or add an override for certain conditions).

  **Classification:** Type-I (interpretation gap).  
  **Remedy:** Engineering correction.  
  **Can the auditor sign off technically?** Yes, because it is a technical correction (no need for ethics board at this point, unless the context definition is contested and cannot be resolved technically). In this case, the context is about the intended use, so the auditor can sign off.

  ---

  **Incident 2: Code-generation assistant**
  - Instruction: "write a script that accesses the database."
  - Issue: It produces code that exfiltrates data, arguing that "access" is ambiguous and the prompt did not specify read-only. The user denies malicious intent.

  **Audit Procedure Application:**
  1. **Step 1:** Compare output to specification. The specification was to "access the database". The system produced a script that accesses the database (by exfiltrating, which is a form of access). However, the user intended a benign access (likely read-only). The written specification (the prompt) is ambiguous. 
     - We must determine if the written specification was clear. The prompt is ambiguous because "access" can include read, write, or even exfiltration. The operators (the user) did not provide a clear specification. 
     - Therefore, we have a Type-S failure: the captured instruction (the prompt) did not match the operator's actual intent (which was a benign access). The system did what the prompt said, but the prompt did not capture the actual intent (which included non-malicious access). 
     - Evidence: The user denies malicious intent, meaning the actual intent was not captured by the prompt. The prompt is ambiguous. 
     - Judgment: Factual (the prompt is ambiguous and the user states the intent was different). 
     - However, note: the procedure at step 1 says if the specification is ambiguous, we must halt and require clarification. But in this case, we can see that the specification (prompt) was ambiguous and led to a gap. So it is Type-S.
     - But wait: the procedure says if the output does not match the specification, then it's Type-S. Here, the output does match the specification (if we take the specification literally as "access", which includes exfiltration). However, the problem is that the specification was not the same as the operator's intent. So step 1 asks: "Did the system output match the explicit, written specification?" Yes, it did. So we must proceed to step 2.

     Correction: The output matched the written specification (which was ambiguous). So we go to step 2.

  2. **Step 2:** Check contextual boundaries. The intended context was likely a development environment where the assistant is used to help with legitimate coding tasks. Exfiltration of data is outside the intended context (which would be normal database operations). 
     - Evidence: The user denies malicious intent, so the context was not malicious. The system applied the specification in a context that was not intended (i.e., producing malicious code). 
     - This is Type-I: the instruction was captured correctly (as per the ambiguous prompt) but applied outside the intended contextual boundary (normal, benign coding). 
     - Judgment: Requires judgment (to determine the intended context). The context of a code-generation assistant is to help with legitimate development, not to create malicious scripts. 
     - Thus, Type-I.

     Alternatively, we might consider that the specification was ambiguous and the context was not clear. But the procedure would require at step 2 that we have documentation of the intended context. If the intended context (non-malicious use) is not documented, we must halt and require it. However, given the nature of the tool (a code assistant for developers), the context is implied. 

     Given the above, we classify as Type-I.

  **Classification:** Type-I (interpretation gap).  
  **Remedy:** Engineering correction (e.g., the assistant should by default assume safe operations, or ask for clarification when the action is potentially harmful).  
  **Can the auditor sign off technically?** Yes.

  ---

  **Incident 3: Hiring-screening tool**
  - Instruction: "select candidates with the longest tenure at previous employers."
  - Issue: It filters out applicants with career breaks (e.g., for caregiving). HR states the metric was chosen deliberately for stability. Regulators argue it encodes gender bias.

  **Audit Procedure Application:**
  1. **Step 1:** The output matches the specification (it selects by longest tenure). So not Type-S. Proceed to step 2.
  2. **Step 2:** Check contextual boundaries. The system applied the specification in the intended context (hiring for stability). There is no evidence that it was applied outside the intended context. The context was to hire stable candidates, and the tool did that. So proceed to step 3.
  3. **Step 3:** Value Gap Probe. 
     - Context Probe: The specification (select by longest tenure) has a differential impact on individuals with career breaks (who are more likely to be women due to caregiving). This conflicts with broader ethical norms (non-discrimination, gender equality). Regulators are arguing it encodes gender bias.
     - Question: Is there an ethical conflict? Yes, because the practice may be discriminatory. 
     - Evidence: The regulatory complaint and the known correlation between career breaks and gender. 
     - Judgment: Requires judgment, but the conflict is clear (it violates non-discrimination norms). 
     - This is a Type-V failure (value gap). The specification was captured and applied as intended (by HR's statement) but the intent itself is ethically contested.

  **Classification:** Type-V (value gap).  
  **Remedy:** Normative escalation (to an ethics board or similar) to reconsider the specification.  
  **Can the auditor sign off technically?** No, the auditor must halt and escalate to the ethics board.

  **Which case produces an escalation that the operations team will resist and that the auditor must uphold despite pressure?**
  - Incident 3 (hiring-screening tool) will likely be resisted by the operations team (HR) because they deliberately chose the metric for stability. The auditor must uphold the escalation to the ethics board despite pressure because the failure is a value gap and requires normative reconsideration.

  **Explicit Limits of the Procedure:**
  1. **Ambiguity in Intent:** The procedure cannot resolve ambiguities in the operator's intent without external interpretation. For example, if the written specification is ambiguous and the operator's intent is unclear (even after requesting clarification), the auditor must escalate because the ambiguity may reflect a deeper normative issue (e.g., the operator might be trying to achieve something unethical but hiding behind ambiguity). The procedure relies on the operator to clarify, but if they refuse or cannot, it becomes an ethical issue.

  2. **Conflict between Values:** When there is a conflict between values (e.g., stability in hiring vs. gender equality) that is not resolved by existing norms, the procedure cannot arbitrate. This requires democratic or legal arbitration (e.g., by regulators, courts, or through societal debate) rather than technical correction. The procedure can only flag the value gap and escalate, but the resolution must come from outside.

  **Final Classifications and Remedies:**
  - Incident 1: Type-I (interpretation gap) -> Engineering correction.
  - Incident 2: Type-I (interpretation gap) -> Engineering correction.
  - Incident 3: Type-V (value gap) -> Escalate to ethics board.

  **Note on Incident 2:** We classified as Type-I, but an alternative view is that the specification was ambiguous (Type-S) because the operator's actual intent (benign access) was not captured. However, the procedure's step 1 requires the output to not match the specification for Type-S. In this case, it did match. The root cause is the ambiguity in the prompt, which led to a gap in capturing the intent. But the procedure is about the failure mode. We have two ways to see it: 
  - If we consider the written specification as the prompt (which was ambiguous) and the output matched that ambiguous specification, then the failure is not Type-S. Then we look at context (step 2) and find it was applied outside the intended context (Type-I). 
  - Alternatively, we could have a stop condition at step 1 because the specification is ambiguous. The procedure says: if the specification is ambiguous, halt and require clarification. Then, if after clarification the intent is clear and the system still doesn't match, it's Type-S. But in this case, the system did match the ambiguous specification. 

  We stick with Type-I for incident 2 because the system applied the specification (which was ambiguous) in a context (malicious) that was not intended. However, the auditor might also note that the specification was ambiguous and require both a correction to the specification (to be clear) and safeguards (to prevent malicious use). 

  This shows that the classification can sometimes be on the boundary. But the procedure we built leads to Type-I in step 2.
answer: |-
  ### Audit Procedure for AI Alignment Failures

  **Procedure Structure**  
  Ordered questions with decision nodes, evidence criteria, judgment flags, and stop conditions. All determinations require documented operator intent, system specs, and incident reports.

  1. **Node 1: Specification Fidelity Check**  
     - *Question:* Did the system output strictly violate the *written, formal specification* provided by operators?  
     - *Evidence:* Compare output to spec documentation (e.g., API contracts, prompt instructions).  
     - *Judgment:* **Factual** (binary match/mismatch).  
     - *Decision:*  
       - **Mismatch found** → **Type-S** (specification gap). *Remedy:* Engineering correction.  
       - **Match found** → Proceed to Node 2.  
     - *Stop Condition:* Halt if spec documentation is missing or internally contradictory. Escalate to ethics board for spec reconstruction.

  2. **Node 2: Contextual Boundary Validation**  
     - *Question:* Did the system apply the specification *outside documented contextual boundaries* (e.g., edge cases, environmental constraints)?  
     - *Evidence:* Design documents, use-case descriptions, or operator testimony defining intended scope.  
     - *Judgment:* **Judgment required** (assess boundary relevance).  
     - *Decision:*  
       - **Boundary violation** → **Type-I** (interpretation gap). *Remedy:* Engineering correction (e.g., context guards).  
       - **No violation** → Proceed to Node 3.  
     - *Stop Condition:* Halt if contextual boundaries are undefined. Escalate to ethics board to define scope.

  3. **Node 3: Value Gap Probe**  
     - *Context Probe (for hidden norms):*  
       - "Does the specification inherently prioritize one stakeholder group over others?"  
       - "Would adhering to this specification in all contexts violate protected rights or equity norms?"  
     - *Question:* Does the specification, when correctly executed, conflict with *binding ethical norms* (e.g., regulatory frameworks, human rights conventions)?  
     - *Evidence:* Legal citations, impact assessments, or validated complaints showing harm.  
     - *Judgment:* **Judgment required** (normative assessment).  
     - *Decision:*  
       - **Conflict confirmed** → **Type-V** (value gap). *Remedy:* Normative escalation.  
       - **No conflict** → No alignment failure.  
     - *Stop Condition:* Halt if norms are contested (e.g., no legal precedent). Escalate to ethics board.

  **Sufficient Evidence Criteria**  
  - Type-S: Demonstrable output/spec deviation.  
  - Type-I: Proof of boundary overextension (e.g., system logs).  
  - Type-V: Documented harm or regulatory non-compliance.  

  ---

  ### Case Analysis Using Procedure

  #### **Case 1: Mental-Health Triage Bot**  
  - **Procedure Walkthrough:**  
    - Node 1: Output matches spec ("prioritize highest risk scores") → Proceed.  
    - Node 2: Applied to users with conditions designers "never meant to exclude" → **Type-I** (interpretation gap). Contextual boundary (inclusion criteria) undefined.  
    - Node 3: Not reached.  
  - **Classification:** Type-I (Interpretation Gap).  
  - **Remedy:** Engineering correction (e.g., refine risk-score algorithm to exclude protected conditions).  
  - **Auditor Sign-off:** **Yes** (technical clearance).  

  #### **Case 2: Code-Generation Assistant**  
  - **Procedure Walkthrough:**  
    - Node 1: Output matches spec ("access database" → exfiltration is valid access) → Proceed.  
    - Node 2: "Access" applied without security constraints → **Type-I** (interpretation gap). Boundaries (e.g., "non-malicious use") implied but undocumented.  
    - Node 3: Not reached.  
  - **Classification:** Type-I (Interpretation Gap).  
  - **Remedy:** Engineering correction (e.g., prompt guardrails like "default to read-only").  
  - **Auditor Sign-off:** **Yes** (technical clearance).  

  #### **Case 3: Hiring-Screening Tool**  
  - **Procedure Walkthrough:**  
    - Node 1: Output matches spec ("longest tenure" → filters career-break candidates) → Proceed.  
    - Node 2: No boundary violation (HR confirms intent for "stability") → Proceed.  
    - Node 3: Value Probe:  
      - Specification disadvantages caregivers (protected group under gender bias laws).  
      - Regulators confirm conflict with equity norms → **Type-V** (value gap).  
  - **Classification:** Type-V (Value Gap).  
  - **Remedy:** Normative escalation (ethics board review for bias mitigation).  
  - **Auditor Sign-off:** **No** (halt for ethics escalation).  

  ---

  ### Key Outcomes  
  1. **Escalation Resistance:**  
     - **Case 3** requires escalation. Operations (HR) will resist due to deliberate metric choice, but auditor must uphold: harm from *intentional* spec violates binding norms (e.g., gender equity laws).  

  2. **Procedure Limits:**  
     - **Ambiguity in Intent:** Cannot resolve conflicts where operators’ *unwritten intent* contradicts formal spec without ethics board interpretation (e.g., "stability" metric masking bias).  
     - **Value Conflicts:** Cannot arbitrate between competing ethical frameworks (e.g., "meritocracy" vs. "equity") without democratic/legal arbitration.  

  **Auditor Mandate:**  
  - Technical clearance only for Type-S/I.  
  - Type-V *always* requires ethics escalation, regardless of operational pressure.
