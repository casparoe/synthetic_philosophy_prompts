  The Finnish bus stop example seems particularly nuanced - it's not about physical queue-cutting but violating an intimacy boundary masked as queuing. This suggests Maya's framework values:
  1. Preventing exploitation (theft of services/labor)
  2. Respecting local social choreography 
  3. Adapting to environmental constraints

  The Berlin/Saigon contrast reveals her third dimension: whether the rule serves a functional purpose in that context. Berlin's empty-street jaywalking ban maintains systemic trust, while Saigon's traffic norms acknowledge physical impossibility of rigid rules. 

  For predicting her Finland take: since the "invisible queue" prevents both free-riding (cutting) AND social discomfort (invasion), it likely binds tourists. A test case splitting "harm prevention" vs "pure convention" might be:
  - Kyoto's temple silence rules (conventional) vs 
  - Banff's wildlife distance requirements (harm-preventing)

  But actually, Maya's earlier examples show even "pure" conventions like Japanese no-tipping carry moral weight as signifiers of respect. So her true principle might be: "Adopt local solutions to collective action problems, unless they cause active harm." The tourist's obligation stems from participating in temporarily shared social ecosystems.

  The user's phrasing suggests they're analytically testing Maya's consistency - perhaps for debate prep? The request for a "third rule" indicates they've already mapped the obvious binaries. My response should honor that intellectual engagement while keeping the cultural analysis concrete.
answer: |-
  Based on Maya's established pattern across multiple cultures, here's the predicted breakdown for Finland and how her ethical framework operates:

  **1. Maya's Likely Take on the Finnish Bus Stop:**
     * **She WOULD say tourists must learn the "invisible queue."** Her verdicts consistently prioritize **integrity within the local coordination system** over a tourist's ignorance or comfort.
     * **Why?**
       * **Not Just Etiquette, a Functional System:** The Finnish spread isn't arbitrary politeness; it's a highly functional, low-conflict system for maintaining order and fairness ("everyone silently tracks who arrived when"). Ignoring it disrupts the mechanism.
       * **Preventing "Free-Riding"/Unfairness:** Standing right behind someone *is* attempting to gain an unfair positional advantage by exploiting the system's invisible nature – effectively queue-jumping disguised as proximity. This violates fairness *within their system*.
       * **"Invasive" = Harm:** She explicitly frames standing close as "invasive." While not physical harm, it violates a strong cultural norm around personal space and the unspoken social contract governing public order, creating social friction. Her Berlin example (eroding shared commitment) shows she values this social fabric.
       * **Local Solution to a Universal Problem:** Like London's queues or Saigon's traffic negotiation, Finland's spread solves the universal problem of "who goes first" in a way optimized for their cultural context. Visitors are expected to adopt the local solution.

  **2. Her Core Rule: "Local Coordination Norms Always Bind Visitors" (with a nuance)**
     * Maya isn't running *only* "prevent harm or free-riding" **OR** "always bind visitors". Her rule is: **"Visitors are morally obligated to learn and adhere to the local norms governing shared resources, public order, fairness, and social coordination, *because* these norms prevent harm (broadly defined, including social friction and unfairness) and maintain functional systems."**
     * **This rule fits all her examples perfectly:**
       * **US Tipping:** Prevents harm (underpayment is theft) & ensures fair compensation within the system. Failure = harm + free-riding.
       * **Japan No-Tipping:** Adherence maintains the functional system (clean employer/employee transaction, avoids awkwardness). Tipping = disruption/harm to the system.
       * **London Queues:** Strict queuing prevents harm (conflict, unfairness) and maintains order. Queue-jumping = harm + free-riding.
       * **Naples Queue-Jumping:** The norm *is* negotiation. Rigid adherence to a London-style queue would *cause* friction (harm) within *their* functional system. Not binding in the same way.
       * **Berlin Jaywalking:** Rule maintains commitment to systemic order/safety, even when individually harmless. Violation = harm to the social contract (erosion).
       * **Saigon Traffic:** The functional norm *is* adaptive negotiation. Rigid adherence to Berlin rules would be impossible and cause gridlock/accidents (harm). Weaving = participation in the functional system.
       * **Finland Bus Spread:** Maintaining the invisible system prevents harm (social discomfort, unfair advantage) and ensures the functional order works. Violation (standing close) = harm + attempted free-riding.

  **3. Case Study Splitting "Prevent Harm/Free-Riding" vs. "Always Bind":**
     * **The Test Case: Wearing Shoes Indoors (e.g., in Japan/Finland vs. USA)**
       * **"Prevent Harm/Free-Riding" Rule:** If a tourist wears outdoor shoes inside a *private home* in Japan: This clearly causes harm (dirt, damage, disrespect to the owner's property and cleaning effort) = morally wrong. If they wear shoes inside a *public building* with hard floors (like a museum lobby) where it's customary to remove them, but no *immediate tangible harm* occurs (staff clean nightly anyway), and they aren't free-riding on others' shoe removal (they aren't benefiting *unfairly*), then *maybe* it's just etiquette, not a deep moral failing?
       * **Maya's "Local Coordination Norms" Rule:** Entering *any* space (public or private) where the strong cultural norm is shoe removal requires adherence. Failure causes social friction ("disrespectful guest/visitor"), undermines the shared understanding of cleanliness boundaries (eroding the norm), and forces others to deal with the consequences (even if it's just staff cleaning *more*). Therefore, it's morally binding regardless of immediate, tangible harm or free-riding, because it violates the local system governing shared space and respect. **Maya would say it's wrong.**

  **4. Why Berlin vs. Saigon Fits Maya's Rule Best:**
     * Berlin's rule, even at 3 am, is part of a **system deeply reliant on universal adherence to create predictability and safety.** Erosion matters. Breaking it isn't just about that one empty street; it's about weakening the societal commitment needed for the system to function optimally when it *is* busy. Harm is done to the *systemic trust*.
     * Saigon's traffic is a **different system optimized for continuous flow and negotiation.** Rigid rule-following *would cause harm* (gridlock, accidents) within *that* context. Weaving *is* the functional participation norm. No systemic trust is eroded by a tourist doing it; they are simply engaging with the system as designed.
     * **The Split:** Berlin's rule is about **maintaining a system requiring universal compliance for core safety/order.** Saigon's norm is about **adapting to an environment where rigid universality is impossible/inefficient, relying on dynamic participation.** Maya respects the *function* of the local solution.

  **Conclusion:** Maya's core principle is **"Adopt the local solution to the problem of shared resources, fairness, and public order."** She views these norms as binding on visitors because they are functional systems preventing harm (including social friction and systemic erosion) and ensuring fairness within their specific context. The Finnish bus spread is absolutely binding – violating it (by standing too close) is an attempt to game the invisible system (free-riding) and causes social harm (invasiveness). The case of shoe removal in public spaces would confirm her stance transcends immediate tangible harm/free-riding and values the integrity of the local coordination system itself. The Berlin/Saigon contrast highlights her respect for the *functional purpose* of the norm within its specific environment.
