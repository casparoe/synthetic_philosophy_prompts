prompt: |-
  i'm presenting at a metaphysics of social institutions workshop next tuesday defending the view that bureaucratic roles are compound dispositions, procedural rules can fink them, but some safeguards actually function as masks — they don't remove the underlying disposition but reroute it, which is why corruption survives reform. the audience will be mostly analytic metaphysicians who know the fink/mask literature inside out but think applying it to institutions is a catagory mistake, plus two political philosophers who worry i'm psychologising structures rather than analysing them. i need a prep sheet for the q&a: the objections i'll actually face, ordered by damage potential, each phrased as they'd phrase it, with a two-minute reply and a note on where the reply is soft. tell me what to concede up front, and include the one i'm dreading — probably about whether masked institutional dispositions are causally efficacious if they're systematically blocked. keep it practical, no reading lists.
reasoning: |-
  Okay, the user is presenting at a metaphysics workshop on social institutions. They're defending that bureaucratic roles are compound dispositions, with procedural rules as finks and safeguards as masks. The audience includes analytic metaphysicians skeptical about applying disposition concepts to institutions and political philosophers concerned about psychologizing structures. They need a Q&A prep sheet with objections ordered by damage potential, replies, and concessions.

  First, I need to unpack the core arguments. The user's view involves three key claims: bureaucratic roles as compound dispositions (meaning they have multiple dispositional properties), procedural rules as finks (which can destroy the disposition when triggered), and safeguards as masks (which prevent manifestation without removing the disposition). The survival of corruption despite reforms is due to masks rerouting rather than eliminating dispositions.

  The main objections will likely come from two angles: metaphysicians questioning category errors in applying dispositional concepts to abstract entities like institutions, and political philosophers accusing reductionism by focusing on individual psychology over structural factors. The "dreaded question" about causal efficacy of masked dispositions is central - if masked, how can they have effects?

  For structuring the prep sheet, I should prioritize objections by damage potential. The category error objection (#1) is most dangerous because it challenges the entire framework's applicability. The causal efficacy question (#2) directly threatens the explanatory power of the theory. Structural reductionism (#3) undermines its relevance to political philosophy. Then counterexamples (#4) and alternative explanations (#5) follow as secondary but important challenges.

  For each objection:
  - Phrase it as the audience would (using technical terms like "multiply realizable" or "causally inert")
  - Craft a tight 2-minute reply using concrete institutional examples (e.g., masked corruption manifesting as nepotism instead of bribery)
  - Note where replies are soft (e.g., conceding the need for more work on institutional-level causal mechanisms)
  - Flag strategic concessions upfront (e.g., agreeing that institutions aren't conscious but maintaining dispositional language is heuristically valid)

  The dreaded causal efficacy objection requires special handling. The reply should: 
  1) Grant masked dispositions don't manifest directly 
  2) Argue they still shape behavior via counterfactuals (e.g., "if mask failed, corruption would reappear") 
  3) Cite real-world evidence (reforms failing when enforcement lapses) 
  4) Soft spot: Needs better formalism for institutional counterfactuals

  Other pre-emptive moves:
  - Open with concessions about non-psychologization to disarm critics
  - Have ready examples of "dispositional idioms" already used in institutional analysis (e.g., "prone to corruption")
  - Prepare to translate claims into structuralist-friendly language where possible

  The goal is to show this framework resolves puzzles (like reform failures) that alternatives cannot, while being compatible with structural analyses when properly framed.
answer: |-
  Here's your Q&A prep sheet, prioritizing objections by damage potential and designed for practical use. Focus on key concessions upfront to disarm critics and build credibility.

  **Opening Concession (State This First):**  
  *"Before we begin, I concede two points: 1) Institutions aren't conscious agents with psychological states—my view doesn’t reduce structures to individual minds. 2) Disposition-talk applied to abstract entities *is* analogical. But this analogy resolves puzzles about institutional persistence that structural descriptions alone cannot."*

  ---

  ### **Objection 1: Category Error (Metaphysicians)**  
  **Phrased:** "Dispositions require intrinsic properties of objects. Institutions are multiply realizable structures without intrinsic physical bases. Applying dispositional ontology here commits a category mistake—you’re anthropomorphizing abstract entities."  
  **Damage Potential:** ★★★★★ (Threatens entire framework)  
  **2-Minute Reply:**  
  "Dispositions need *categorical bases*, not necessarily *intrinsic physical* ones. Social institutions have stable, realizable bases: their procedural rules, role relations, and incentive structures. These are categorical in the institutional context—think of how audit rules materially shape accounting practices. We routinely attribute dispositions to non-physical entities (e.g., ‘the market is volatile’). My move is no different: it tracks how institutional roles *would* behave under triggering conditions, even if masked. The ontology is grounded in collective acceptance and material constraints."  
  **Soft Spot:** Needs deeper argument for what counts as a "categorical base" in social ontology.  
  **Concede:** The dispositional language *is* analogical—but it’s explanatory.

  ### **Objection 2: Causal Efficacy of Masked Dispositions (Metaphysicians)**  
  **Phrased:** "If safeguards *systematically* mask a disposition (e.g., corruption), it never manifests. How can a disposition be causally efficacious if it’s permanently blocked? Isn’t it just a dummy property?"  
  **Damage Potential:** ★★★★★ (The "dreaded one"—undermines core mechanism)  
  **2-Minute Reply:**  
  "Masked dispositions *are* efficacious in three ways:  
  1. **Counterfactually:** Remove the mask (e.g., lax oversight during crises), and corruption manifests immediately—proving the disposition persists.  
  2. **Vectors of Manifestation:** Masks reroute, not eliminate. A bribes-*masked* official might manifest corruption through nepotism (e.g., hiring unqualified kin). The disposition’s *telos* (self-interest) shifts expression.  
  3. **System Effects:** Masked dispositions drain resources (e.g., compliance costs) and create ‘shadow institutions’ (e.g., informal networks). This is causal efficacy *via* suppression.  
  *Example:* Anti-bribery laws mask corruption, but it resurfaces as ‘consultancy fees’—same disposition, new path."  
  **Soft Spot:** Must show masked states *actively* generate effects (not just absence). Use resource-drain/shadow-system arguments.  
  **Concede:** If masking is *perfect and eternal*, efficacy lapses—but institutional masks always leak.

  ### **Objection 3: Psychologizing Structures (Political Philosophers)**  
  **Phrased:** "You’re reducing institutional corruption to individual dispositions (‘role-holders’ tendencies’). But structures have emergent powers—e.g., systemic bias—that aren’t aggregates of psychology. This ignores structural causality."  
  **Damage Potential:** ★★★★☆ (Undercuts relevance to social theory)  
  **2-Minute Reply:**  
  "My ‘compound dispositions’ are *role-defined*, not psychological. A bureaucratic role’s disposition (e.g., ‘to process permits’) exists *because* of its position in rules/power relations. When I say ‘corruption survives reform’, I mean the *role’s disposition* to self-perpetuate power—masked safeguards reroute this structural tendency. *Example:* Nepotism rules mask patronage, but the role’s power-conserving disposition manifests through ‘merit-based’ promotions favoring allies. This is structural: the mask alters institutional grammar, not individual minds."  
  **Soft Spot:** Must stress that "disposition" here is a placeholder for *structurally embedded tendencies*.  
  **Concede:** Individual psychology mediates dispositions—but the framework targets institutional logic.

  ### **Objection 4: Finks vs. Masks Ambiguity (Metaphysicians)**  
  **Phrased:** "Your distinction between rules as ‘finks’ (destroying dispositions) vs. safeguards as ‘masks’ (blocking manifestation) seems arbitrary. Why isn’t a procedural rule just another mask?"  
  **Damage Potential:** ★★★☆☆ (Threatens conceptual precision)  
  **2-Minute Reply:**  
  "**Finks** destroy the disposition’s categorical basis. *Example:* A rule firing officials for bribery *dissolves* the role’s capacity for corruption by removing offenders. **Masks** preserve the basis but block triggers. *Example:* Requiring third-party audits masks corruption by adding steps, but the role’s self-interest basis remains. Test: Remove the safeguard—if the disposition instantly manifests (e.g., bribes resume), it was masked; if not, it was finked. Bureaucratic reforms often mask because they don’t alter role incentives."  
  **Soft Spot:** Real cases are messy (e.g., rules that partially fink). Use clear ideal types.  
  **Concede:** Borderline cases exist—but the distinction explains why some reforms fail (masking) vs. succeed (finking).

  ### **Objection 5: Overextension of Dispositional Framework**  
  **Phrased:** "Why use dispositions? Institutional change is better explained by functionalist/materialist factors (e.g., resource conflicts), not latent properties waiting to manifest."  
  **Damage Potential:** ★★☆☆☆ (Alternative explanations)  
  **2-Minute Reply:**  
  "Dispositions handle *persistence-through-change* better. *Example:* A ‘corrupt’ institution survives anti-bribery laws (material change) because its roles’ self-preserving disposition is *masked*, not finked. Functionalist accounts miss this—they’d predict adaptation, not resilience of the *same* pathology. Dispositions also explain why identical rules fail in different contexts: same mask, different underlying dispositions (e.g., auditing in honest vs. corrupt agencies)."  
  **Soft Spot:** Dispositions risk being unfalsifiable if overused.  
  **Concede:** Dispositions complement—don’t replace—materialist analysis.

  ---

  ### **Tactical Notes:**  
  1. **Anchor in Examples:** When pressed, pivot to concrete cases (e.g., UN procurement vs. EU bureaucracy reforms).  
  2. **Soft Spot Mitigation:** If causality questions persist, stress: *"Masked dispositions explain resilience and redirective effects—key for predicting reform failures."*  
  3. **Political Philosophers’ Buy-In:** Frame as *"This shows why structural interventions fail without altering role-incentives."*  
  4. **Killer Closing:** End with: *"If institutions weren’t dispositional, why do we say they’re ‘corruption-prone’ or ‘resilient’? I’m taking this discourse literally to solve a problem you all acknowledge: reforms that don’t stick."*

  **Prep Tip:** Rehearse replies *aloud* with a timer. For the causal efficacy objection, drill the "counterfactual/rerouting/system-drain" triad until it’s reflexive. You’ve got this.
