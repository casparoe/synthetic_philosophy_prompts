answer: |-
  Here's a breakdown of the core conceptual gap and your specific concerns:

  **Core Conceptual Gap:**

  *   **Epistemicism:** Claims vagueness is *purely epistemic*. Words like "tall" or "heap" have **perfectly sharp boundaries** in reality (e.g., 6'0" is tall, 5'11.999" is not). Borderline cases exist solely because **we don't know** where this precise boundary lies. Vagueness = ignorance.
  *   **Supervaluationism:** Claims vagueness is *semantic indeterminacy*. Words like "tall" or "heap" are **inherently imprecise**; they lack a single sharp boundary. Meaning is fixed by the range of *acceptable precisifications* (ways of making the term sharp). A sentence is:
      *   **Supertrue:** True on *all* acceptable precisifications.
      *   **Superfalse:** False on *all* acceptable precisifications.
      *   **Indeterminate (Borderline):** True on *some* precisifications, false on others.

  **Epistemic Leakage (and Why Supervaluationism Says No):**

  Your worry: If borderline cases are "unsettled," does that uncertainty infect the clear cases?

  *   **Supervaluationism's Answer: No.** Its core mechanic prevents this:
      1.  **Clear Cases Defined by Stability:** A "clear heap" (e.g., 1000 grains) is "heap" on *every single acceptable precisification*. Its truth is **supertrue**.
      2.  **Borderline Cases Defined by Instability:** A borderline case (e.g., 100 grains) is "heap" on *some* precisifications and "not heap" on *others*. Its status is **indeterminate**.
      3.  **The Barrier:** The distinction between clear and borderline is drawn at the level of *what counts as an acceptable precisification*. Precisifications that disagree on a clear case (e.g., making 1000 grains not a heap) are **excluded** as *unacceptable*. The unsettledness of the borderline region is *bounded* by this rule.
      4.  **Result:** The truth of a clear case is settled *by the entire framework*. Its status is robust *because* it survives *every* legitimate way of sharpening the concept. The unsettledness is confined to cases where different legitimate sharpenings disagree. Knowing borderline cases exist doesn't undermine a clear case because the clear case's truth doesn't depend on *which* precisification you pick; it holds on all of them. The leakage is contained by the definition of acceptability.

  *   **Epistemicism's Take:** Leakage isn't a *semantic* problem for them. Everything is sharp. Our *ignorance* might extend to cases *near* the sharp boundary that we mistake for clear, but this is a mistake in our *knowledge*, not an indeterminacy in the meaning itself. Clear cases are simply cases far enough from the unknown boundary that we *know* they are on one side.

  **Higher-Order Vagueness (Avoiding Sharp Boundaries & Regress):**

  The Problem: Where does "borderline" end and "clearly borderline" or "clearly not borderline" begin? Isn't *that* boundary vague too? This is higher-order vagueness (vagueness about what's borderline).

  1.  **Supervaluationism's Mechanics:**
      *   **The Tool: More Precisifications:** It handles higher orders by allowing variation *in what counts as an acceptable precisification* itself. First-order precisifications fix the extension of "heap." Second-order precisifications (meta-precisifications) fix the extension of "acceptable first-order precisification."
      *   **Avoiding Sharp Boundaries:** There's no sharp line between "clear heap" and "borderline heap" because different first-order precisifications draw the boundary in different places. Similarly, there's no sharp line between "clearly borderline" and "borderline borderline" because different meta-precisifications (second-order) draw the boundary for *what counts as a first-order precisification* in different places. Boundaries blur through variation at each level.
      *   **Avoiding Infinite Regress?** This *does* lead to a potential hierarchy (third-order vagueness, etc.). Supervaluationists often **acknowledge the regress** but argue:
          *   It's **benign**: Each higher level deals with a finer-grained, less significant indeterminacy. The core semantic work is done at lower levels.
          *   It **reflects reality**: Vagueness might genuinely permeate language at multiple levels, and the model captures this.
          *   **Not Vicious:** It doesn't undermine the model's ability to explain first-order vagueness and the supertruth of clear cases. The regress models the diminishing significance of higher-order unclarity.

  2.  **Epistemicism's Mechanics:**
      *   **The Tool: More Ignorance:** Epistemicism bites the bullet on sharp boundaries, even at higher orders.
      *   **Avoiding Regress:** It readily avoids regress because it posits sharp boundaries *everywhere*.
          *   There's a sharp boundary between heap/non-heap.
          *   There's a sharp boundary between clear cases of heap/non-heap and the borderline zone.
          *   There's a sharp boundary between clear borderline cases and unclear ones (second-order borderline), and so on.
      *   **Avoiding the Obvious Sharp Boundary?** The key move is **universal epistemic limitation**. While these boundaries are sharp *in reality*, we are *necessarily ignorant* of *all* of them. We cannot know where *any* of these sharp boundaries lie – not the first-order heap boundary, not the boundary defining the borderline zone itself, not the boundary defining vagueness about *that* boundary, etc.
      *   **Result:** Every level of vagueness corresponds to a sharp boundary we cannot know. There's no regress *problem* for the theory because it consistently applies the same explanation (sharp boundary + ignorance) at every level. The apparent blurriness is always just our ignorance of the precise, hidden lines. The "hidden sharp boundary" is a feature, not a bug.

  **In Summary:**

  *   **Epistemic Leakage:** Supervaluationism blocks it via **supertruth/superfalsity** grounded in *all* acceptable precisifications. Clear cases are *insulated* by the definition of acceptability. Epistemicism avoids it because clear cases are simply *known* instances far from the unknown sharp boundary.
  *   **Higher-Order Vagueness:**
      *   **Supervaluationism:** Employs **hierarchies of precisifications** (meta-precisifications) to blur boundaries at each level, accepting a **benign regress** modeling diminishing unclarity.
      *   **Epistemicism:** Posits **sharp boundaries at every level** (heap/non-heap, clear-borderline, clear-borderline-borderline, etc.) but couples this with **universal, inescapable ignorance** of where *any* of these boundaries lie, thus avoiding a regress *of problems*.

  The core gap remains: Epistemicism sees only ignorance of hidden precision, while Supervaluationism sees inherent semantic indeterminacy managed through ranges of acceptable sharpenings. Their mechanics for handling leakage and higher-order vagueness flow directly from this fundamental difference.
