  Sam would say the 3D-printed ship is **not** the original ship. Here's why:
  - **Physical destruction breaks continuity**: The original ship burned down completely, creating a hard break in physical existence. Sam rejected similar breaks before (e.g., the destroyed-and-rebuilt ship and the Mars teleportation).
