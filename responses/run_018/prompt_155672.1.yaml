answer: |-
  Your labor group's "strike as pocket veto" analogy is conceptually flawed and smuggles in assumptions that favor capital. Let's audit, break down, and reframe:

  ### 1. Mapping the Analogy (Problematic Assignments)
  - **Minority Party**: Striking workers (implies they lack majority support)  
  - **President**: Capital/Management (holds unilateral veto power)  
  - **Legislative Body**: Production process/workplace (the "system" being frozen)  
  - **Bill**: Labor's demands (treated as illegitimate without full consensus)  

  ### 2. Critical Breaks in the Analogy  
  - **Institutional Rules vs. Disruption**:  
    Pocket vetoes are *constitutional procedures*; strikes are *disruptions of unequal power*. Equating them frames capital's control as natural law.  
  - **Asymmetric Sacrifice**:  
    Workers lose wages/risk jobs; executives lose profits. A president vetoing loses nothing – this ignores the power imbalance.  
  - **Capital's Structural Veto**:  
    Management already exercises daily "vetoes" via layoffs, investment strikes, automation, and wage suppression – all without democratic input.  
  - **False Equivalence of "System"**:  
    Framing production as a neutral "legislative body" ignores that workplaces are **hierarchies**, not democracies. Capital holds dictatorial power.  

  ### 3. What the Analogy Smuggles In  
  - **Production as Lawmaking**:  
    Implies economic activity is a consensual, rule-based deliberation – obscuring capital's unilateral control.  
  - **Democratic Legitimacy**:  
    Labels strikes "anti-democratic" while ignoring that workers have no voting rights over wages/conditions. Smuggles in the idea that capital's authority is democratically legitimate.  
  - **Moralizing Disruption**:  
    Frames capital's status quo as the neutral baseline, and worker resistance as "obstruction".  

  ### 4. Does the "Anti-Democratic" Charge Survive?  
  **No.** The charge collapses when:  
  - Workers lack formal workplace democracy.  
  - Capital's constant "vetoes" (e.g., wage cuts, closures) face no similar scrutiny.  
  - Strikes are often last-resort actions *after* democratic efforts fail (e.g., ignored petitions, rejected negotiations).  
  **Strikes are democratic counter-power**, not procedural obstruction: they leverage collective action where institutional channels are rigged.  

  ---

  ### Better Analogies  
  | **Analogy** | **Strengths** | **Weaknesses** |  
  |-------------|---------------|----------------|  
  | **Boycott** | Highlights consumer-worker solidarity; shared sacrifice | Downplays workplace power dynamics; less disruptive |  
  | **Lockout** | Mirrors capital's aggression (employer-initiated shutdown) | Inverts agency (strikes are worker-initiated) |  
  | **Sovereign Debt Strike** | Emphasizes strategic non-cooperation against power imbalance | Overly abstract for workplace context |  
  | **Siege Warfare** | Captures attrition, sacrifice, and disruption of supply lines | Overly militaristic; ignores negotiation aspect |  

  ### Most Accurate Reframing: **Counter-Veto**  
  Strikes are a **tactical veto against capital's structural veto power**. They temporarily disrupt capital's unilateral control to force negotiation – restoring balance in a system rigged against labor.  

  ### Key Takeaway  
  The "pocket veto" analogy fails because it **naturalizes capital's dictatorship in production**. Strikes aren't subverting democracy – they're challenging an authoritarian system by leveraging workers' only structural power: withdrawing labor. The truly anti-democratic element is the absence of workplace democracy, not the strike itself.  

  *Further reading:*
  - *Capital*'s analysis of the "hidden abode of production" (Marx)  
  - Karl Polanyi on labor as a "fictitious commodity"  
  - Jane McAlevey on strategic strikes as democratic empowerment
