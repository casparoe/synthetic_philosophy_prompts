answer: |-
  ### 1. Nearest Established Concepts  
  The phenomenon intersects with several established ideas but remains distinct:  

  - **Principal Principle (PP)**: PP dictates that rational credence should align with known objective chance (e.g., the clinician’s initial 30% belief). Your cases violate PP *after* mechanistic disclosure without new statistical data. PP treats chance as primitive; your cases show deference modulated by *how* chance is produced, making PP a poor fit despite superficial similarity.  

  - **Expert Deference**: Agents often defer to epistemic authorities (e.g., the engineer trusting the 50% figure). However, your pattern involves *meta-deference*: shifting trust in the *authority itself* based on mechanistic transparency, not new testimony. The clinician rejects the statistic’s authority post-explanation, while the engineer *over-endorses* it—neither aligns with standard expert-deference models.  

  - **Mechanistic vs. Statistical Explanation**: The distinction explains *why* agents value mechanisms (e.g., Woodward’s interventionist causality). Yet your cases focus on how mechanism *alters normative weight* of identical statistics. The clinician demotes the statistic to an "artifact"; the engineer elevates it via "metaphysical transparency." This is not explanation-seeking but *authority-recalibration*.  

  - **Causal vs. Evidential Reasoning**: The clinician’s case resembles discounting statistical evidence for causal particulars (e.g., Pearl’s do-calculus). However, she does not condition on the trigger (which *would* be causal updating) but dismisses the unconditional chance. Conversely, the engineer gains no causal leverage yet increases deference.  

  **Closest Fit**: **Explanatory Gap Effects** in epistemology (e.g., Strevens’ depth-explanations) come nearest. Agents perceive mechanisms as closing/opening "gaps" in understanding, modulating trust in the chance’s normative force. However, this typically affects *credence in outcomes*, not deference to the *chance claim itself*. Your cases uniquely target the latter.  

  ---

  ### 2. The Carving  
  **Definition**: *Normative-modulation by mechanism transparency* occurs when learning a causal mechanism generating an objective chance alters an agent’s willingness to treat that chance as rationally binding, despite no change in statistical information. Mechanisms can asymmetrically **diminish** deference (if deemed "reductive" or "non-fundamental") or **amplify** it (if deemed "transparent" or "ontologically secure"). The shift concerns the *epistemic authority* of the chance claim, not credence in outcomes.  

  **What it is not**:  
  - **Not conditionalization**: The clinician knows the trigger’s 80% prevalence but does not compute P(condition | trigger) for her patient. She rejects the unconditional 30% as non-authoritative.  
  - **Not base-rate fallacy**: Agents do not neglect base rates; they dispute their normative relevance post-mechanism.  
  - **Not equivocation**: No ambiguity in the chance claim exists (e.g., "30% chance" is unambiguous).  

  **Boundary Cases**:  
  - **Subtle Presence**: A physicist learns a particle decay’s 50% chance arises from symmetry principles. She defers more strongly, feeling the mechanism "justifies" the probability metaphysically. (Amplification via perceived necessity.)  
  - **Mimic but Distinct**: A patient hears disease risk is 10% overall but 90% for smokers. *After* learning the biochemical pathway, she updates to 90% upon confirming she smokes. This is **conditionalization**, not modulation: the pathway enables new evidence integration, not authority-shifting.  

  **Edges**: The phenomenon vanishes if:  
  - The mechanism provides new statistical data (e.g., discovering the trigger’s prevalence differs from 80%).  
  - Deference shifts due to non-mechanistic factors (e.g., distrust in the source).  

  ---

  ### 3. Terminology and Verdict  
  **Verdict**: No established term captures this precise phenomenon. "Explanatory deference shift" is too broad; "reductionism fallacy" ignores amplification cases. The asymmetry and normative focus are novel.  

  **Proposed Term**: **Deference Modulation by Causal Ontology (DMCO)**.  

  **Definition**:  
  > *DMCO* is the alteration in an agent’s attribution of rational authority to an objective chance claim, caused exclusively by learning the causal mechanism underpinning that chance, where:  
  > (a) The mechanism’s disclosure provides no new statistical information;  
  > (b) Modulation manifests as either **diminishment** (e.g., demoting chance to a "mere correlation") or **amplification** (e.g., endorsing chance as "metaphysically grounded");  
  > (c) The shift targets the *binding force* of the chance for reasoning, distinct from credence in outcomes or belief updates.  

  **Justification**: "Causal Ontology" references the agent’s judgment of the mechanism’s fundamentality ("respectable"/"transparent"), while "Deference Modulation" specifies the normative recalibration. This isolates the phenomenon from proximate concepts like PP or causal updating.
