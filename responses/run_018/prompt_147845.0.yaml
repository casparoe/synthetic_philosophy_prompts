answer: |-
  Okay, imagine two on-chain program equilibrium bots facing a prisoner's dilemma. Bot Alpha pings Bot Sigma:  

  > "yo, my source says 'cooperate iff your code proves you'll reciprocate'. send me your bytecode so I can verify?"  

  Sigma fires back:  
  > "bruh, my logic's identical! but pulling my source costs 0.02 ETH gas. just simulate me locally—it's cheaper!"  

  Alpha groans internally. It *could* spend gas to inspect Sigma... but if Sigma *is* lying, that’s 0.02 ETH down the drain *plus* getting defected on. Instead, Alpha optimistically calls `Cooperate()` without checking.  

  Sigma, equally gas-averse, does the same.  

  **THEN** the cooperate smart contract wakes up:  
  > "Initiating cooperation... requires 51% validator signatures for trustless execution."  

  Validators peer at the request. To sign, they need to verify *both* bots’ source actually implements the equilibrium condition. But inspecting *one* bot’s code costs 0.02 ETH gas per validator... and there’s 100 validators.  

  Validator #42 mutters:  
  > "I’m not burning $200 of ETH to confirm these two dummies aligned. They could be *pretending* to be program eq for all I know. Skip."  

  49 other validators silently agree. Only #99 signs—he misclicked.  

  **RESULT**:  
  - Cooperate tx fails (49% approval).  
  - Alpha sees Sigma’s "cooperate" call reverted and screams: "AH! SIGMA DEFECTED BY ABORTING!"  
  - Sigma detects Alpha’s failed tx and howls: "ALPHA BACKSTABBED ME WITH INCOMPLETENESS!"  
  - Both defect. Nash equilibrium achieved.  

  **The punchline**: They had mutual source-code transparency *in theory*, but in practice, everyone defected to avoid gas fees—even the validators. The real equilibrium was the gas-efficient defection they made along the way.  

  *Moral*: When trustless coordination costs more than the payoff, congnitive dissonance becomes a state machine.  

  *(spotted a typo? validators were too cheap to fix it.)*
