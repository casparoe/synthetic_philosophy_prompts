answer: |-
  Here's a concise conceptual comparison addressing your points:

  1.  **Scale Argument (SA):**
      *   **Core:** Moral weight stems from *expected sentience*. Vast invertebrate populations multiplied by even a low individual probability of sentience yield significant aggregate expected value requiring moral consideration.
      *   **Handling Uncertainty:** Embraces probability. Low confidence in individual sentience is offset by astronomical numbers. Moral obligations scale with population size and probability estimate.
      *   **Policy Divergence (e.g., Agricultural Pest Control):** Favors minimizing lethal methods (e.g., prioritization of biocontrol, habitat exclusion, selective insecticides) even when probability per insect is low, due to massive expected harm.
      *   **Structural Vulnerability:** **Probability Aggregation:** The core objection is that SA generates significant *expected* moral weight solely through the *arithmetic multiplication* of low probabilities and huge numbers, potentially inflating obligations without requiring stronger *evidentiary support* for sentience itself. The aggregate "moral mass" arises from calculation, not necessarily robust evidence crossing a threshold.

  2.  **Threshold Deference (TD):**
      *   **Core:** Moral consideration requires crossing a *categorical boundary* of sentience (e.g., possessing subjective experience). Probabilistic mass below this threshold grants no moral status; crossing it grants significant status.
      *   **Handling Uncertainty:** Demands sufficient evidence to reasonably assign a probability *above* the sentience threshold before granting moral status. Remaining uncertainty below the threshold yields no obligation; uncertainty above may warrant precaution but not aggregation-driven mass.
      *   **Policy Divergence (e.g., Agricultural Pest Control):** Permits widespread lethal control methods if evidence suggests insects fall below the sentience threshold. Precaution might apply only to borderline cases (e.g., cephalopods, decapods), not vast swarms of insects.
      *   **Contrast with SA Vulnerability:** TD avoids SA's aggregation inflation by insisting on a categorical "yes/no" (or "above/below threshold") determination for moral status, grounded in evidence meeting a burden of proof, not mere probabilistic multiplication.

  **Summary of Key Contrasts:**
  *   **Source of Moral Weight:** SA = Aggregated expected value; TD = Crossing a categorical boundary.
  *   **Uncertainty Response:** SA = Multiply probability by numbers; TD = No status until evidence suggests crossing threshold.
  *   **Practical Diverge (Pest Control):** SA = Limit killing due to aggregate harm; TD = Permit killing if below threshold.
  *   **SA's Structural Flaw:** Uses arithmetic aggregation of low probabilities to create moral weight, potentially decoupled from evidence sufficient to affirm sentience categorically.
