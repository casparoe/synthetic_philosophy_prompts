  ### Thought Experiment: The Redundant Medication Protocol

  **Scenario:**  
  In a hospital, a patient requires a critical antibiotic within 30 minutes of admission to prevent sepsis (outcome B). The hospital has two redundant protocols: (1) the *Primary Protocol*, where the attending nurse administers the antibiotic upon patient arrival (event A), and (2) the *Backup Protocol*, an automated system that dispenses the antibiotic at minute 29 if it detects no prior administration. Due to institutional policy, the Backup Protocol is always enabled and cannot be overridden—it is hardwired into the hospital’s infrastructure, with daily automated validation ensuring 100% reliability. On this occasion, the nurse administers the antibiotic at minute 15 (A occurs), so the Backup Protocol does not activate. Sepsis is prevented (B does not occur).

  ---

  ### Analysis  
  1. **Counterfactualist Perspective (e.g., David Lewis):**  
     The counterfactualist argues that **A causes ~B** (prevention of sepsis). If A had not occurred (nurse failed to administer), then B would have occurred (sepsis). The reasoning hinges on the closest possible world where A is absent: without the nurse’s action, the Backup Protocol activates at minute 29—but since sepsis requires >30 minutes without antibiotics, the patient would still develop sepsis. Thus, "if A hadn’t happened, B would have happened," making A a cause of ~B.  

  2. **Interventionist Perspective (e.g., James Woodward):**  
     The interventionist denies that **A is a cause of ~B**. A surgical intervention on A (e.g., force-preventing the nurse from administering) would *not* change B. In this intervened scenario, the Backup Protocol—exogenous and fixed due to institutional lock-in—activates automatically at minute 29, still preventing sepsis. Since manipulating A alone fails to alter B (the outcome remains ~B regardless), A is not a cause. The structural model treats the Backup Protocol as an immutable background condition, akin to a physical law.  

  3. **Feature Doing the Work:**  
     The **institutional lock-in of the Backup Protocol** drives the disagreement. Its 100% reliability and exogeneity (unaffected by other variables) make it a fixed "guardrail" in the causal model. The counterfactualist ignores this immutability when constructing closest worlds, while the interventionist holds it fixed during interventions.  

  4. **Removing the Feature:**  
     If the Backup Protocol were fallible (e.g., 90% reliable), both theories agree A causes ~B. The counterfactualist’s "A-not → B" claim holds (if A fails, B *might* occur). The interventionist’s surgical intervention on A could now change B (e.g., if Backup fails, B occurs), making A a cause.  

  5. **Interventionist Defense Against the Case:**  
     An interventionist would attack by arguing the Backup Protocol *is* intervenable in principle. If we could surgically disable it (e.g., hacking the system) *without* altering A, then preventing A *would* change B (sepsis occurs). This exposes that institutional lock-in is a modeling choice—not a metaphysical truth—and that denying intervenability for exogenous variables is arbitrary.  

  ---  
  **Bottom line:** Institutional lock-in creates redundancy that masks causation under interventionism but not counterfactualism.
