answer: |-
  To live unchained, no hand arrests your course—
  This freedom stands where interference ends.
  But positive claims the internal source:
  The will made sovereign where your choice extends.
  One guards the space no other may invade,
  One builds the self that masters its own plan;
  Two liberties in wary pause are laid,
  Each incomplete without its rival’s ban.
  But mark the third: not freedom from the blow
  That falls, but from the master’s looming might
  Who strikes or spares at whim. True freedom’s sight
  Demands the power that others hold or show
  Be tracked by law, contested as of right—
  Non-arbitrary, though it stand or go.
  This citadel demands foundations deep:
  A people armed with voice, the means to know,
  With forums vibrant where just claims may leap,
  And powers checked where common currents flow.
  Thus, though as *negative* it stakes its claim,
  It builds the *positive* within its frame—
  The strength, the voice, the social ground below.
  Reduce its threat to mere obstruction’s name,
  The edifice of non-domination falls,
  And freedom shrinks where silent mastery calls.
