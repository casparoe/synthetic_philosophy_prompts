prompt: |-
  I'm in a seminar on how moral norms actually change, and after class last week two classmates, Sam and Maya, got into a long argument about the dueling case. I typed up the back-and-forth from memory afterward and I want a referee's ruling, because I could feel them talking past each other but couldn't say exactly where. Here are the moves.

  (1) Sam: The dueling case shows that argument basically isn't what kills a practice. The arguments against dueling—it's homicide, it's irrational, it lets a hothead force you to risk your life—had been around for two centuries while dueling went right on. What actually finished it was a shift in honor: refusing a challenge became compatible with being a gentleman, because you could say the challenger wasn't worth the field, and around the same time the duel started looking absurd to the rising middle class. Once declining carried no social cost, the practice collapsed fast. So it wasn't a better argument; it was that honor detached from the duel.

  (2) Maya: But "the challenger isn't worth the field" is itself an argument, made in public, giving reasons. And the satire that made dueling look absurd—that's public persuasion too, just in cartoons and farce. What you've actually described is arguments that happened to target honor specifically. That doesn't show argument is powerless; it shows the arguments that worked had to speak the idiom of honor. So you've got a point about rhetoric, not about whether argument does the causal work.

  (3) Sam: No, because the mechanism isn't belief change through reasons. The same reply was available to a duelist in 1720 and it would have gotten him branded a coward. What changed between then and the 1840s wasn't that someone finally found the right argument; it's that the audience changed—the professional classes rose, the press started mocking the duel, and status stopped flowing so automatically to that kind of courage. Arguments are downstream of who can confer status. People didn't hear a new argument and update; they noticed that the old option stopped costing them anything.

  (4) Maya: But then your mechanism can't generalize. Take chattel slavery: the planters' honor and their economic interests both pointed toward keeping it, and it still took decades of organized argument, sermons, petitions, mass politics, and ultimately a war. Honor didn't do that work by itself—abolitionists had to attack slaveholders' honor from outside, with arguments, for years. So argument looks like the more basic thing, and honor is just one of the channels it uses when it's working.

  Can you go through the four moves and rate each one from clearly mistaken to clearly right, with a sentence or two saying why, and then give a verdict on which specific points in each person's view survive? I'd also want to know what both of them are missing about how arguments, honor, and interests might interact rather than compete.
reasoning: |-
  Okay, the user is in a seminar about how moral norms change and witnessed an argument between classmates Sam and Maya about the decline of dueling. They want me to act as a referee, evaluating each of their four moves, rating them, and explaining why. Then I need to highlight what valid points each person retains and identify what both are missing about the interaction between arguments, honor, and interests.

  First, I'll break down each move. Sam's first point is that arguments didn't kill dueling; instead, it was a shift in honor culture that made refusal socially acceptable. Maya counters that the "not worth the field" rationale and satire are forms of argument, just tailored to honor's idiom. Sam responds by emphasizing that the mechanism was social status change, not belief updates through reasoning. Maya then challenges with the slavery example, where argument seemed crucial despite honor and economic interests.

  I need to assess each move. For Sam's initial point, he's right that arguments alone didn't end dueling—social costs changing were key. But Maya correctly notes that the shift was facilitated by persuasive arguments. Her point holds: arguments can target honor specifically. In Sam's rebuttal, he accurately describes the mechanism as social status-driven, not rational updating. However, he downplays how arguments might influence that status change. Maya's slavery example is strong for showing argument's role, but it's a different context—external pressure versus internal cultural shift like in dueling. She might overstate argument as "more basic," ignoring material factors.

  Both are missing nuances. Arguments and social structures interact: arguments can reshape what confers honor, while honor cultures filter which arguments gain traction. Interests (economic, status) also play a role; for dueling, middle-class rise altered status incentives. In slavery, moral arguments combined with political and economic forces. They're treating arguments, honor, and interests as competing rather than intertwined.

  For the verdict: Sam's valid points are that social costs and audience changes drove dueling's end, not just better reasoning. Maya's valid points are that arguments (in various forms) were instrumental and must be contextually adapted. Both overlook the dynamic interplay—arguments can redefine honor and interests over time, creating feedback loops. The synthesis is that norm change involves all elements: arguments persuade within social contexts, honor evolves through discourse, and interests are defended or challenged via both.
answer: |-
  Here's a referee's ruling on the Sam-Maya debate, breaking down each move, rating it, explaining why, and identifying the surviving valid points from each. Finally, I'll outline what both are missing about the interaction.

  ## Move-by-Move Analysis & Ratings

  1.  **Sam (1):** "The dueling case shows that argument basically isn't what kills a practice... What actually finished it was a shift in honor... So it wasn't a better argument; it was that honor detached from the duel."
      *   **Rating: Mostly Right.** Sam correctly identifies the *proximate cause* of dueling's rapid collapse: the decoupling of gentlemanly honor/social status from accepting challenges. Arguments *alone* had indeed failed for centuries. He rightly emphasizes the critical role of shifting social costs/incentives (status loss) and the change in the audience (rising middle class, press).
      *   **Why?** He accurately describes the historical mechanism: when refusal ceased to carry a social cost (due to changed honor norms and mockery), the practice imploded, regardless of the pre-existing arguments against it.

  2.  **Maya (2):** "But 'the challenger isn't worth the field' is itself an argument... What you've actually described is arguments that happened to target honor specifically... So you've got a point about rhetoric, not about whether argument does the causal work."
      *   **Rating: Clearly Right.** Maya effectively reframes Sam's observation. The "shift in honor" wasn't magic; it was *facilitated* by specific rhetorical acts – persuasive communications (verbal arguments, satire, caricatures) that successfully targeted the existing honor code *using its own logic and language*. She correctly argues this demonstrates the power of *contextually appropriate* argument/rhetoric, not its irrelevance.
      *   **Why?** The "shift" Sam describes didn't happen in a vacuum; it was *caused* by persuasive efforts that resonated within the specific cultural framework of honor. This *is* argument doing causal work, albeit strategically deployed.

  3.  **Sam (3):** "No, because the mechanism isn't belief change through reasons... What changed... wasn't that someone finally found the right argument; it's that the audience changed... Arguments are downstream of who can confer status."
      *   **Rating: Partly Right, Partly Mistaken.**
      *   **Right:** Sam correctly doubles down on the *social mechanism*: arguments only gain traction when the *social structure* (who has status, what confers status, the composition/power of the audience) allows or amplifies them. The "right argument" in 1720 *did* fail because the audience (the status-conferring aristocracy) wasn't receptive and the social cost was too high. The rise of the middle class and press changed the audience and the status calculus.
      *   **Mistaken:** He wrongly dismisses argument as merely "downstream." The persuasive efforts (Maya's point) *interacted* with this social change. The press mockery and new honor rhetoric weren't just passive results; they actively *shaped* the new audience's perceptions and *accelerated* the shift in what conferred status. Arguments helped *define* the new status game.

  4.  **Maya (4):** "But then your mechanism can't generalize. Take chattel slavery... Honor didn't do that work by itself—abolitionists had to attack slaveholders' honor from outside, with arguments... So argument looks like the more basic thing, and honor is just one of the channels..."
      *   **Rating: Insightful Challenge, Partly Overstated.**
      *   **Insightful Challenge:** Maya brilliantly exposes a limitation in Sam's *generalization*. The slavery case *did* require massive, sustained argumentative/persuasive effort against powerful entrenched interests (economic *and* honor-based). The honor code of the planter class was a barrier *overcome* by external argument and mobilization. This shows argument *can* be a primary driver, even against hostile audiences/recalcitrant honor codes, especially when coupled with other forces (politics, war).
      *   **Overstated:** Claiming argument is the "more basic thing" ignores crucial differences. Slavery involved fundamental economic interests and required state coercion (war) for ultimate abolition. Argument was necessary but not sufficient; it worked *in conjunction* with massive political, economic, and military forces. Honor was a *target* and a *barrier*, not just a passive channel. Sam's mechanism (social cost/status shift) *also* played a role, but the *source* of the shift was external pressure driven by argument and organization.

  ## Surviving Valid Points

  *   **Sam Survives:**
      *   For practices deeply embedded in social status and identity (like dueling), changes in *what confers status* and the *social cost* of participation/non-participation are often the *proximate trigger* for rapid collapse.
      *   Arguments cannot succeed in a vacuum; their efficacy is heavily dependent on the receptive audience and the existing social structure (who has power/status).
      *   Shifts in the composition and values of the relevant "audience" (e.g., rising middle class) can fundamentally alter the landscape for moral norms.
  *   **Maya Survives:**
      *   Argument (broadly defined as reasoned persuasion, including satire, rhetoric, framing) is a crucial *causal agent* in norm change, even when targeting honor.
      *   Successful arguments must be adapted to the specific cultural context and values (like honor) of the audience they seek to persuade or undermine.
      *   Norm changes often require sustained, organized persuasive effort targeting core values like honor, especially when confronting powerful interests (as in slavery).
      *   Sam's mechanism focusing solely on status shift struggles to explain norm changes driven primarily by external moral critique and mobilization against powerful interests.

  ## What Both Are Missing: The Interplay of Arguments, Honor, and Interests

  Sam and Maya treat arguments, honor, and interests too competitively ("which one is *the* cause?"). They miss the **dynamic interplay and feedback loops**:

  1.  **Arguments Shape & Are Shaped by Honor:** Arguments don't just "use" honor; they actively *redefine* what honor means and what is honorable/disgraceful (e.g., "refusing is honorable if the challenger is unworthy"). Conversely, the existing honor code constrains *which* arguments resonate.
  2.  **Arguments Interact with Interests:** Arguments can reframe interests (e.g., "true honor lies in commerce, not violence"), expose hidden costs, or mobilize counter-interests (e.g., middle-class opposition to aristocratic violence). Interests can also motivate the *creation* and *amplification* of specific arguments.
  3.  **Honor Embeds Interests:** Honor codes are often mechanisms for protecting group interests (e.g., aristocratic privilege, planter dominance). Challenging a practice embedded in honor *is* challenging the interests it protects.
  4.  **Social Change Creates Openings:** Shifts in audience or power (Sam's point) *create opportunities* for arguments (Maya's point) to gain traction. The rise of the middle class created an audience receptive to anti-dueling satire and new notions of bourgeois honor.
  5.  **Argument as Catalyst & Legitimizer:** Argument isn't just "reasoning." It frames issues, delegitimizes practices, provides justifications for new norms, and mobilizes action. It can *accelerate* shifts initiated by social change (dueling) or *initiate* pressure against powerful interests (slavery), often interacting with other forces (economics, politics, coercion).

  **Verdict:** Neither Sam nor Maya is wholly wrong, but both are incomplete. **Maya wins on the core question of whether arguments do causal work** – they demonstrably do, as shown by the rhetoric *causing* the honor shift in dueling and the essential role of abolitionist argument against slavery. **Sam wins on the importance of social context and incentives** – arguments against dueling failed for centuries until the social structure changed, making those arguments effective. The key insight is that norm change is a complex process where arguments, shifts in social status/incentives (honor), and material interests constantly interact and reshape each other.
