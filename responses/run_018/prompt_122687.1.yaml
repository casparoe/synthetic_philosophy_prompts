  I'm working through this Judy Benjamin problem. The TA has an argument that Judy shouldn't change her confidence in being in friendly territory after learning the conditional "If you are in Red territory, you are in the Second Company area." But the argument seems flawed because it leads to different posteriors depending on how the conditional is phrased, and it also conflicts with how we handle learning a simple statement.

  First, let's clarify the setup. Judy has a prior over four cells:

  - Blue & HQ: 4/9

  - Blue & 2nd Co: 2/9

  - Red & HQ: 1/9

  - Red & 2nd Co: 2/9

  She learns C: "If Red, then 2nd Co," which is equivalent to ¬Red ∨ 2nd Co. In logical terms, C is A → B, where A is Red and B is 2nd Co. This is true unless A is true and B is false, so it only falsifies the Red & HQ cell.

  The TA's argument says that since C is only about what happens when A is true, it shouldn't affect the probability of A being false, which is Blue territory. So, when Red & HQ is eliminated, its probability (1/9) should be redistributed only within the Red cells, meaning to Red & 2nd Co. Similarly, the Blue cells should be untouched, so their ratio stays the same.

  That gives posterior: Blue & HQ: 4/9, Blue & 2nd Co: 2/9, Red & HQ: 0, Red & 2nd Co: 2/9 + 1/9 = 3/9 = 1/3. So P(Blue) = 4/9 + 2/9 = 6/9 = 2/3, same as before.

  But the problem is that C is also equivalent to "If not 2nd Co, then not Red," which is "If HQ, then Blue." If we run the same argument with this contrapositive, the antecedent is HQ, so the message should only constrain the HQ region. Eliminating Red & HQ (since if HQ, it must be Blue, so Red & HQ is impossible), and that probability (1/9) should go to the other HQ cell, which is Blue & HQ. So Blue & HQ: 4/9 + 1/9 = 5/9, Blue & 2nd Co: 2/9, Red & HQ: 0, Red & 2nd Co: 2/9. Then P(Blue) = 5/9 + 2/9 = 7/9, which is higher.

  Contradiction: same content, different posteriors depending on the phrasing.

  Moreover, the second issue: take any statement S. Rewrite it as "If not-S, then contradiction," like S ≡ (¬S → ⊥). Learning this conditional, with antecedent not-S, should by (4) not change P(not-S), but since it's equivalent to S, it should make P(not-S) = 0. So (4) can't be right.

  The principle in step (4) seems flawed. It says that learning a conditional C with antecedent A cannot change P(A), only redistribute within A.

  But in probability, when we learn new information, we conditionalize on it. For a conditional, it's not straightforward because conditionals can affect the probabilities in subtle ways.

  In this case, C is a material conditional: A → B ≡ ¬A ∨ B.

  Learning C means we conditionalize on ¬A ∨ B being true.

  The prior probabilities:

  P(Blue & HQ) = 4/9

  P(Blue & 2nd Co) = 2/9

  P(Red & HQ) = 1/9

  P(Red & 2nd Co) = 2/9

  C is true in all cells except Red & HQ, so when we conditionalize, we eliminate Red & HQ and renormalize the remaining probabilities.

  The remaining probabilities: Blue & HQ: 4/9, Blue & 2nd Co: 2/9, Red & 2nd Co: 2/9. Sum: 4/9 + 2/9 + 2/9 = 8/9.

  So posterior:

  P(Blue & HQ) = (4/9) / (8/9) = (4/9)*(9/8) = 4/8 = 1/2

  P(Blue & 2nd Co) = (2/9) / (8/9) = 2/8 = 1/4

  P(Red & 2nd Co) = (2/9) / (8/9) = 2/8 = 1/4

  P(Red & HQ) = 0

  So P(Blue) = 1/2 + 1/4 = 3/4

  P(Red) = 1/4

  This is the standard conditionalization.

  But the TA wants P(Blue) to stay at 2/3, which doesn't happen with this.

  In the contrapositive case, C is also "If HQ, then Blue," which is the same as ¬HQ ∨ Blue, but since Blue is the territory, it's equivalent.

  C: If Red, then 2nd Co ≡ ¬Red ∨ 2nd Co

  Contrapositive: If not 2nd Co, then not Red ≡ If HQ, then Blue ≡ ¬HQ ∨ Blue

  But in terms of the cells, ¬HQ ∨ Blue is true in all cells except Red & HQ, same as before. So it's the same set of possibilities: all except Red & HQ.

