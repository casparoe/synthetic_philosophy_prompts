       - When time is up, if they haven't reached consensus, move to debrief.

     **Debrief:**
       1. Ask: Did you reach consensus? Why or why not?
       2. Explain Thomson's lamp: an infinite series of toggles in finite time. The state at the end is undefined because there's no last event to determine the state.
       3. Map to the activity: 
            - Each node had a finite piece of the log. 
            - Even if they combine, they only have a finite prefix (up to event 110). 
            - The state at 120s depends on the entire infinite sequence, which they don't have.
            - But even if they had the entire infinite sequence, they still couldn't define the state because there's no last state to take (the sequence of states does not converge).
       4. Note: In distributed systems, we often face the problem of incomplete logs when trying to reconstruct a state. This activity highlights that some states might be fundamentally undefined.

     **What this activity can't reproduce:**
       - The actual supertask has an infinite number of events that are completed. In our activity, we only simulated a finite prefix, so it feels like we are missing data. But in the paradox, the entire supertask is completed, yet the state is still undefined. So the activity captures the distributed systems challenge of partial information, but the philosophical paradox is deeper: completion of an infinite series does not guarantee a well-defined outcome.

     **Predictable Problems:**
       1. Participants might not buy into the infinite events and say: "Well, if we don't have the data, we can't know, so let's just pick one." Then they randomly pick and get it wrong.
       2. Some might realize the pattern and argue that the state at infinity is undefined, but the rules say they must pick ON or OFF, so they are forced to pick arbitrarily.
       3. Time management: 15 minutes might be too short for them to hit deadlock. They might quickly pick a leader and then the leader arbitrarily picks OFF because that's the last state they have.

     We can mitigate by:
       - Emphasizing repeatedly: "The events go on to infinity. The state at 120s is the state after every single one of the infinite toggles."
       - Walking around and when they ask questions, remind them: "Remember, there is no last event."

     **Final Setup:**

     Generate 10 cards:
       Node 1: s=1, e=11
       Node 2: s=12, e=22
       Node 3: s=23, e=33
       Node 4: s=34, e=44
       Node 5: s=45, e=55
       Node 6: s=56, e=66
       Node 7: s=67, e=77
       Node 8: s=78, e=88
       Node 9: s=89, e=99
       Node 10: s=100, e=110

     Initial state for node i: 
          OFF if s_i is odd, ON if s_i is even.

     We can compute:
          Node1: s1=1 (odd) -> OFF; e1=11 (odd) -> final state ON.
          Node2: s2=12 (even) -> ON; e2=22 (even) -> OFF.
          Node3: s3=23 (odd) -> OFF; e3=33 (odd) -> ON.
          Node4: s4=34 (even) -> ON; e4=44 (even) -> OFF.
          Node5: s5=45 (odd) -> OFF; e5=55 (odd) -> ON.
          Node6: s6=56 (even) -> ON; e6=66 (even) -> OFF.
          Node7: s7=67 (odd) -> OFF; e7=77 (odd) -> ON.
          Node8: s8=78 (even) -> ON; e8=88 (even) -> OFF.
          Node9: s9=89 (odd) -> OFF; e9=99 (odd) -> ON.
          Node10: s10=100 (even) -> ON; e10=110 (even) -> OFF.

     Good: we have a mix of final states: ON for odd-ending blocks, OFF for even-ending. So when they share, they see node1 says ON, node2 says OFF, node3 says ON, etc.

     They might try to take the highest event index (110) and then use the state after event110 (OFF). But we emphasize: there are events after 110.

     We hope they deadlock.

     **Payoff:**
       - If they reach consensus (on ON or OFF) within time: 10 points each.
       - If they don't: 5 points each for accurately reflecting the problem.
       - In debrief: bonus points for explaining why they deadlocked (1 point per valid reason, up to 5 points).

     This way, even if they deadlock, they can still earn up to 10 points.

     Let's do it!
