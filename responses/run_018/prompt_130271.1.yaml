  ### **Distributed Lamp Consensus Game**  
  *(Thomson's Lamp meets distributed systems)*

  ---

  #### **Rules & Materials**  
  **What you need:**  
  - 10 index cards (one per player)  
  - Whiteboard/flip chart  
  - Marker & timer  

  **Setup:**  
  1. **Assign roles:** Each player is a "node." Give each an index card with:  
     - **Event range:** A random slice of the lamp's toggle history (e.g., "Events 31–45," "Events 76–90").  
     - **Starting state:** The lamp state *before* their first event (e.g., "ON at Event 31").  
     - **Secret point value:** (see *Payoff* below).  

  2. **Event rules:**  
     - The lamp starts **OFF**.  
     - Events happen every half-second (simulated): Event 1 at 0.5s, Event 2 at 0.75s, etc.  
     - Each event **toggles** the lamp (ON → OFF, OFF → ON).  
     - At 2 minutes (Event 120), the lamp hits the **limit point**—no more toggles.  

  3. **Gameplay:**  
     - **Goal:** Reach consensus on the lamp’s state at 120s (ON or OFF).  
     - **Constraints:**  
       - Nodes can share their *event logs* and *final state* (e.g., "I handled Events 31–45: started ON, ended OFF").  
       - **No sharing point values.**  
       - **No external math** (e.g., "odd/even events"). Focus *only* on logs.  
     - **Time limit:** 15 minutes.  

  ---

  #### **Payoff Scheme (Points)**  
  - **Agree on consensus state (ON/OFF):**  
    - Each player gets points equal to their **secret value** (randomly assigned: 5, 10, or 15 points).  
  - **Fail to agree:**  
    - Everyone gets **1 point** + bonus if they explain the deadlock later.  
  - **Secret twist:**  
    - Cards have *different event ranges* (e.g., one covers 1–15, another 106–120), but **no card includes the full history**.  
    - The "limit point" (Event 120) **isn’t in any log**—it’s the state *after* all toggles.  

  ---

  #### **Predictable First-Run Problems**  
  1. **Players assume symmetry:**  
     - Tech folks might try to "average" states or force majority vote.  
     - **Reality:** Logs are fragmented (e.g., one node sees ON→OFF, another OFF→ON). No clear pattern emerges.  

  2. **Misunderstanding the limit:**  
     - Someone says, "Just use the last event!"  
     - **Counter:** "But Node 7’s log ends at Event 105, and Node 10 ends at 119. Which is ‘last’?"  

  3. **Time pressure causes bad consensus:**  
     - They’ll likely pick ON/OFF arbitrarily to get points. *Let them.* The debrief reveals why it’s invalid.  

  ---

  #### **Debrief (5–10 min)**  
  **Map to Thomson’s Lamp:**  
  1. **Ask:** "What state did you agree on? Why?"  
  2. **Reveal the deadlock:**  
     - *"In Thomson’s Lamp, there’s no ‘last toggle’ at 120s—just like no node had the full log. The state depends on infinite toggles, but infinity has no parity (odd/even)."*  
  3. **Distributed twist:**  
     - *"In distributed systems, consensus requires a ‘fact of the matter.’ Here, there’s **no ground truth** at the limit—only fragmented perspectives. That’s why you deadlocked."*  

  **Philosophical punchline:**  
  - *"The lamp isn’t ‘hidden’ ON or OFF—it’s **undefined**. Supertasks don’t guarantee logical endpoints, just like partial logs don’t guarantee consensus."*  

  ---

  #### **What This *Can’t* Reproduce**  
  - **The infinity gap:** The game uses *finite* logs (e.g., 10–15 events), but Thomson’s Lamp requires *actually infinite* toggles. In the game, players know the limit is artificial; in the paradox, infinity is the point.  

  ---

  **Why it works:**  
  - Players *feel* the deadlock when logs conflict and "last state" is ambiguous.  
  - Points incentivize consensus, but the setup makes it impossible without cheating.  
  - No prior philosophy needed—just distributed systems pain 😉.  

  **First-run tip:** When chaos peaks, grin and say: *"Welcome to Thomson’s Lamp."*
