  Hmm... the user's framing suggests they've already identified key nuances - they recognize the normative/descriptive confusion in how "integrity" gets used, and they're probing whether institutional role extensions might reframe the problem. That's sophisticated. Their unspoken need seems to be for conceptual tools to break through the impasse, not just reheated arguments.

  First, I need to untangle why the drowning-spouse example keeps looping. The utilitarian sees it as irrational attachment bias; Williamsians as essential identity. But the user's hunch about moral reasons' exhaustiveness feels crucial - that's the real pivot point. If morality claims to fully determine action, it leaves no "breathing room" for personal identity to matter fundamentally. 

  The institutional extension is brilliant actually. When the doctor objectifies the patient, it mirrors the spouse case but without romantic baggage. This suggests alienation isn't just about intimacy - it's about any context where role identity generates reasons. A public health official might genuinely see the patient as a "vector" if welfare metrics dominate. That reframes integrity as about recognition, not just affection.

  Semantically, "integrity" is doing double duty: normative theorists mean coherence of justifications, while psychologists mean phenomenological wholeness. No wonder they talk past each other! But beneath that, there's a bedrock intuition about love/commitment resisting reduction. You can't argue someone into feeling their spouse's rescue as a "utility case" without gut-level dissonance.

  For the user's thesis, I'd emphasize three pressure points: 
  1) The moral reasons exhaustiveness issue as the real battleground 
  2) How institutional roles generalize the alienation worry 
