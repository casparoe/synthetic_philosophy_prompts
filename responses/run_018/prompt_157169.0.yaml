prompt: |-
  I'm a phd student writting on moral psychology and I've been circeling Williams's integrity objection — the worry that if you justify saving your partner from drowning with a utilitarian calculus instead of just reaching for her because she's yours, you've taken one step too far in reasoning and lost something essential about your practical identity. The literature feels totally ossified: utilitarians treat it as a heuristic glitch, defenders say it exposes how agent-neutral morality alienates us from our ground projects, and both sides just rerun the drowning-spouse case like it's still 1985. My hunch is that the stall is actually about whether moral reasons are exhaustive — whether they can fully determine action without leaving room for who I am — but I also suspect the sides are talking past each other, with one doing normative ethics and the other doing descriptive moral psychology under the same label 'integrity'.

  Could you actually diagnose the disagreement? Is it a substantive clash over agent-relative permissions versus agent-centered restrictions, a verbal dispute about the word 'integrity', or bedrock intuitions about love that neither side can argue for? And does extending the case to institutional roles — like a doctor or public-health official who takes one step too far into aggregate welfare metrics and misses the patient right in front of her — help clarify the objection, or does it show the problem was always specific to intimate relationships? I want reasons, not a survey, and I'm genuinely unsure whether any conceptual distinction could unstick this or if we should just admit it's an impasse.
