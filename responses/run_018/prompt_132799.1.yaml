answer: |-
  Right, here's the thought experiment and analysis, cobbled together as requested:

  **Thought Experiment:** During a critical drug shortage, St. Bartholomew's Hospital Ethics Committee faces a grim choice: divert the sole remaining vial of a life-saving antibiotic from Patient A (who will certainly die without it) to Patients B-F (who will all die without it, but can be saved by splitting the dose). Under their charter, any *single* member can veto a harmful allocation. After hours of agonised debate, no veto is cast; the vote passes 7-3. The directive is issued to the pharmacy, signed by the Chair *acting for the committee*. The drug is reallocated by the duty pharmacist following protocol. Patient A dies; B-F survive. No single committee member administered the drug or feels solely responsible for the death; the fatal act emerges from the collective authorisation process itself, executed by different hands following an impersonal directive.

  **Where the Agent-Centred Restriction Bites:**
  1.  **Committee vs. Individual Surgeon:** Does the committee have the same *agent-relative* reason not to harm Patient A? Likely **no**, or at least significantly weakened. The surgeon *directly* causes harm through their own act. The committee's harm is causally distant, mediated by layers of procedure and other agents. Each member who voted 'yes' arguably *participated* in authorising harm, but none *did* the harming. The distributed agency diffuses the direct, personal responsibility that grounds the core deontological prohibition ("*I* must not kill"). The restriction bites less sharply on the collective *as the acting agent*.
  2.  **Stopping the Rogue Surgeon:** **Yes**, absolutely. The committee (and its members) has a strong *agent-neutral* reason to prevent the rogue surgeon. This reason stems from the objective badness of the harm occurring (Patient A dying unnecessarily/unjustly), not their role in causing it. Preventing the rogue surgeon isn't *their* personal causing of harm; it's stopping an objectively wrong act by another agent.

  **The Philosophical Work: Distributed Agency.** The key twist doing the heavy lifting is the **distributed, fragmented agency**. The harmful authorisation is collective, the execution is delegated, and the causal chain is broken across multiple individuals acting within roles. No single person bears the full causal or intentional burden of the lethal act.

  **Collapsing the Committee:** If a *single* hospital director held the sole authority and made the identical decision (divert the drug, sign the order), the deontological paradox hits full force. The agent-centred restriction applies directly: *this person* is now directly authorising and causing (through their order) the intentional harming of Patient A to save others. The "no direct harming" prohibition bites hard on the *individual* decider in a way it struggles to grip the distributed committee.

  **Hardline Deontologist Attack:** A hardline deontologist would likely go for the jugular on two fronts:
  1.  **Denying Collective Moral Agency (Plausible):** They might argue collectives like committees *aren't* genuine moral agents capable of bearing fundamental agent-relative restrictions. Only individual humans are. Therefore, the prohibition "do not harm" *only* applies to the *individual members*. Each member who voted 'yes' violated their personal duty not to *intentionally participate in* or *authorise* the harming of an innocent, even if they didn't push the syringe. The veto power existed precisely so no member *had* to authorise a harm they deemed impermissible; those who voted 'yes' chose to override that potential barrier.
  2.  **Shared Responsibility (Alternative):** Less likely, but possible, they might argue the committee *as a collective entity* *does* bear the restriction, and by authorising the harm, the committee *itself* violated the duty "do not harm". The distributed execution is irrelevant; the *authorisation* was the core wrongful act, and the committee is the authorising agent. Each member shares culpability for the collective's act.

  The deontologist's core point would be: the diffusion of agency is a smokescreen. Morality demands individuals not *will* or *authorise* impermissible harms, regardless of how many hands are involved downstream. The veto-holders had the power to stop it; those who didn't are complicit.
