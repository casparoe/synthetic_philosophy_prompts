  hey, you're acting as an expert in archaeological epistemology for this — think carefully and do a bit of brainstorming first. I want a decision-tree / taxonomy thing for a seminar on how we reconstruct beliefs and institutions from broken objects with no texts around.

  The case to anchor it: a cluster of deliberately broken pottery, burnt bone, aligned post-holes, zero writing nearby.

  Build branches from real fault-lines (not just "do you prefer view A?"). Each node should be a concrete claim someone can answer without knowing the label it leads to. Ideas for the splits:

  - Can material traces carry propositional belief-content, or only behavioral traces?
  - Does institutional continuity need some oral or textual transmission chain, or can pure repetition do the work?
  - Are the broken pots ritual destruction, or just post-feasting trash?
  - Do aligned post-holes signal shared cosmological doctrine, or just shared logistics and engineering?

  At the leaves put named positions if they actually exist — maybe "radical materialist inference," "institutional minimalism," "practice-continuity view" — and mark others unnamed. Note any empty combinations: is nobody sitting there because the combo is incoherent, or just unexplored? Also flag which pairs your tree can't really seperate.

  Inject this niche angle too: lipid residue analysis in ceramic shards. Specifically, can fatty-acid profiles distinguish sacrificial feasting from domestic cooking? And if we reject the "uniformitarian taste fallacy" — the assumption that ancient palates and food preferences mirror modern ones — does that change what the residue proves about institutional norms?

  Don't ask for citations, a bibliography, or a reading list; this should work for someone with no web access. Write it casually, a typo or two is totally fine.
