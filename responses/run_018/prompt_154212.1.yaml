answer: |-
  Here's a rough-and-ready decision tree/taxonomy for wrestling with that pile of broken pottery, burnt bone, and post-holes – designed to force explicit epistemological choices:

  **The Root Split: What KIND of "Meaning" Can Pots & Posts Hold?**
  *   **Node 1: Can material patterns *directly* encode propositional beliefs or complex institutions? (Yes/No)**
      *   *Claim:* "The arrangement of objects/structures can intentionally represent abstract concepts or specific rules (like a god, a myth, or a legal code), independent of observing repeated behavior."
      *   **If NO (Behavioral Traces Only):** Go to Branch A.
      *   **If YES (Potential Symbolic Encoding):** Go to Branch B.

  ---

  **BRANCH A: The Behavior-Only Path (Materialism/Practice Focus)**

  *   **Node A1: Can institutional continuity exist *without* oral/textual transmission (i.e., via pure repetition/social habitus)? (Yes/No)**
      *   *Claim:* "Stable, rule-bound social structures can emerge and persist solely through the unconscious repetition of shared practices across generations, without needing explicit teaching or codification."
      *   **If NO (Transmission Chain Required):**
          *   *Leaf: **Radical Materialist Inference / Institutional Minimalism.*** "We can *only* reconstruct specific, observable *actions* (breaking pots, burning bones, building structures). No institutions or beliefs are inferable without evidence of transmission (text, oral tradition proxies). The cluster is just evidence of repeated *events* (feasts? trash disposal? temporary shelters?), possibly coordinated but not institutionalized. Lipid residues just show *what* was cooked/stored, not *why*."
      *   **If YES (Repetition Suffices):**
          *   **Node A2: Does the *form* of the pottery-breakage/bone-burning suggest deliberate, non-utilitarian action? (Yes/No)**
              *   *Claim:* "The breakage patterns (e.g., systematic smashing of specific vessel types), bone selection/condition (e.g., specific species, uniform burning), or spatial clustering go beyond practical discard or accidental damage."
              *   **If NO (Looks Like Trash):**
                  *   *Leaf: **Practical Habitus View.*** "The cluster represents recurring social gatherings (feasts, work parties) generating waste. Aligned post-holes indicate shared, effective building techniques (logistics/engineering). Lipid residues reflect domestic-scale cooking or storage norms. Repetition implies shared *practical knowledge* and maybe loose social coordination, but not formal institutions or complex beliefs."
              *   **If YES (Non-Utilitarian Pattern):**
                  *   **Node A3: Can lipid residue profiles *reliably* distinguish special vs. mundane contexts, *rejecting* uniformitarian taste? (Yes/No)**
                      *   *Claim:* "Specific fatty acid ratios (e.g., very high dairy/sheep vs. plant/ruminant mix), unusual concentrations, or associations with 'prestige' markers *cannot* be explained by mundane domestic practices *even if* ancient tastes differed significantly."
                      *   **If NO (Residues Ambiguous):**
                          *   *Leaf: **Structured Practice Continuity.*** "The deliberate breakage/burning/building patterns reveal highly structured, repeated *practices* constituting a social institution (e.g., communal feasting protocol, building tradition). Lipid residues show *what was used* in these practices, but don't prove 'sacred' vs. 'profane' intent without taste assumptions. Beliefs remain inaccessible; we see the *enacted rules*."
                      *   **If YES (Residues Signal Special):**
                          *   *Leaf: **Institutionalized Practice View.*** "The structured destruction, specific residues (indicating rare/valued foods or preparation methods distinct from domestic), and consistent building form reveal a formalized *institution* (e.g., mandated sacrificial feasting, regulated communal building). Beliefs *motivating* it are still unknowable, but the *institutional framework* of the practice is reconstructible through its material repetition and resource investment."

  ---

  **BRANCH B: The Symbolic Potential Path (Meaning in Patterns)**

  *   **Node B1: Does institutional continuity *require* oral/textual transmission for complex structures? (Yes/No)**
      *   *Claim:* "Abstract institutions (e.g., codified religion, formal governance) cannot persist accurately over time without some symbolic communication beyond pure mimicry."
      *   **If YES (Transmission Essential):**
          *   *Leaf: **Symbolic Skepticism (Text/Oral Dependent).*** "Without texts or proxies for oral tradition near *this specific cluster*, we cannot reconstruct complex beliefs or formal institutions. The patterns *might* encode meaning, but we lack the 'key'. Residues & breakage might be ritual, but we can't know *which* ritual or its doctrine. Post-hole alignment might be cosmological, but we can't know *what* cosmology. We're stuck at 'possible ritual space'."
      *   **If NO (Patterns Can Encode Meaning):**
          *   **Node B2: Does the post-hole alignment *necessitate* cosmological intent? (Yes/No)**
              *   *Claim:* "The specific alignment (e.g., cardinal points, solstice angles) cannot be explained *solely* by practical engineering or environmental constraints (wind, sun for warmth) common to the period/region."
              *   **If NO (Plausibly Practical):**
                  *   *Leaf: **Symbolic Minimalism.*** "We can infer *some* intentional symbolic meaning likely encoded in the deliberate pot-breakage/bone-burning patterns (especially with residue anomalies), suggesting ritual actions/offerings. The building, however, reflects shared practical knowledge/logistics. Institutions are inferred from the *ritual practice* complexity, not the building form. Beliefs are vague ('respect for tradition', 'offerings significant')."
              *   **If YES (Likely Cosmological):**
                  *   **Node B3: Can lipid residues + breakage patterns *specify* belief-content (e.g., sacrificial offering vs. communal bonding feast)? (Yes/No)**
                      *   *Claim:* "The *combination* of residue profiles (e.g., specific animal fats burnt *with* bones, unusual purity/lack of plant matter), breakage method (e.g., vessels smashed *onto* specific spot), and context (within cosmologically aligned structure) points unambiguously to one type of belief (e.g., deity appeasement) over another (e.g., ancestor veneration, social pact)."
                      *   **If NO (Ambiguous Intent):**
                          *   *Leaf: **Structured Belief Complex.*** "The site encodes complex propositional content: cosmological principles (via alignment) and ritual action (via breakage/burning/residues). We can infer a shared belief system involving structured interaction with the cosmos/supernatural through specific material practices. The institution is the *cultic framework*. Specific doctrinal details (e.g., *which* god, *exact* myth) remain elusive."
                      *   **If YES (Specific Intent):**
                          *   *Leaf: **Radical Symbolic Inference.*** "The material constellation *is* a text. Alignment = specific cosmological model. Residues + Breakage + Bone = clear evidence of sacrificial offering protocol (e.g., choice of animal, treatment, destruction method signifies offering to celestial deity X). This reconstructs specific doctrinal beliefs and the institutional mechanics of their enactment."

  ---

  **Friction Points & Empty Chairs:**

  *   **Lipid Residue's Niche Role:** It primarily interacts with Node A3 and Node B3. Its power is *conditional*. Rejecting uniformitarian taste makes it **harder** to claim residues prove "specialness" (A3) or specific intent (B3) unless the profiles are *extremely* anomalous (e.g., pure myrrh oil in cooking pots). It often becomes supporting evidence, not a clincher.
  *   **The "Transmission Required" Trap (B1 YES):** This branch essentially dead-ends complex reconstruction without texts. It's coherent but pessimistic. Some sit here firmly (e.g., strict textualists). Others see it as a methodological constraint, not a philosophical absolute.
  *   **Empty Chair 1:** **"Symbolic Encoding BUT No Institutions Without Transmission" (B1 YES + earlier steps).** This is tricky. If patterns *can* encode beliefs (B), but institutions *require* transmission (B1 Yes), and there's no transmission evidence... you're stuck near "Symbolic Skepticism". Believing in symbolic encoding *and* requiring transmission for institutions leads to the same pessimistic outcome as just requiring transmission. Few explicitly occupy this *because* if patterns encode beliefs, why couldn't they *also* encode institutional rules *if* you reject B1? It leans towards incoherence or just re-merges with Symbolic Skepticism.
  *   **Empty Chair 2:** **"Pure Repetition Institutions BUT Beliefs Directly Encoded" (A1 YES + B YES).** Can you have institutions emerging *only* from repetition (A1 Yes) *while also* believing the material directly encodes propositional beliefs (B Yes)? This seems contradictory. If beliefs are directly encoded, doesn't that imply a symbolic system requiring *some* transmission mechanism for the code, undermining "pure repetition"? This node is likely incoherent. People land on *one* side of the Root Split.
  *   **Indistinguishable Pairs:**
      *   **"Practical Habitus" (A2 NO) vs. "Structured Practice Continuity" (A3 NO):** The line between "loose social coordination" and "institution" is fuzzy. Residue ambiguity reinforces this blur.
      *   **"Structured Practice Continuity" (A3 NO) vs. "Institutionalized Practice View" (A3 YES):** Hinges entirely on how convincingly residues indicate "special" context without taste assumptions.
      *   **"Structured Belief Complex" (B3 NO) vs. "Radical Symbolic Inference" (B3 YES):** The leap from "complex ritual/cosmology" to "*specific* doctrine/sacrificial logic" is vast and relies on interpretive boldness. Lipid residues alone rarely bridge this gap definitively.
      *   **Cosmology vs. Engineering (B2):** Often ambiguous! Clever engineers use celestial cues *for* practicality. Devout builders might prioritize doctrine *within* practical limits. The tree forces a choice, but reality is muddy.

  This tree forces users to confront **what they think matter *can* communicate** and **what social continuity requires**, before diving into interpreting the specific case. The lipid angle injects scientific data but highlights its limitations under critique (taste fallacy). Enjoy the seminar arguments!
