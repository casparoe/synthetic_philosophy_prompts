answer: |-
  ### RL Restatement of the Absent-Minded Driver Problem
  **POMDP Formulation:**  
  - **State space:** `S = {PRE_B, POST_B, POST_C}` (discrete states: before Exit B, after Exit B/before Exit C, after Exit C).  
  - **Actions:** `A = {CONTINUE, EXIT}` at each exit.  
  - **Observations:** `O = {EXIT_AHEAD}` (agent only sees "exit ahead" at both B and C due to partial observability).  
  - **Transitions:**  
    - `PRE_B + CONTINUE → POST_B` (deterministic).  
    - `PRE_B + EXIT → TERMINAL` (reward = 1).  
    - `POST_B + CONTINUE → POST_C` (reward = 0).  
    - `POST_B + EXIT → TERMINAL` (reward = 4).  
  - **Partial Observability:** Agent observes `EXIT_AHEAD` identically at `PRE_B` and `POST_B`, losing memory of prior actions.  

  **Off-Policy Target & Shaped Reward:**  
  - **Optimal plan ("skip B, take C")** is an off-policy target: Target policy `π*` is `CONTINUE` at B, `EXIT` at C.  
  - **Behavior policy `π_b`** must be stationary: Same action at both exits due to identical observations.  
  - **Shaped reward:** Penalize `EXIT` at B (reward = 1) vs. reward = 4 for `EXIT` at C. Intention is encoded as `R(s, EXIT) = 1 if s=PRE_B else 4`.  

  **Replay Buffer Corruption Twist:**  
  - Replay buffer misattributes experiences: When agent takes `EXIT` at `POST_B` (C), it stores it as occurring at `PRE_B` (B) with probability `p`.  
  - **Consequence:** Off-policy evaluation (OPE) uses corrupted data. Q-values for `(EXIT_AHEAD, EXIT)` become biased mix of `Q(PRE_B, EXIT)=1` and `Q(POST_B, EXIT)=4`.  

  ---

  ### Residue Report: Philosophical Tension → RL Failure Modes  
  | **Philosophical Concept**         | **RL Translation**                                                                 | **Fidelity**       |  
  |-----------------------------------|------------------------------------------------------------------------------------|--------------------|  
  | **Planning rationality**          | Off-policy evaluation of `π*` (skip B, take C) using Q-learning or IS.            | **Clean**          |  
  | **Acting rationality**            | Online policy `π_b` constrained by partial observability (same action at both exits). | **Clean**          |  
  | **Intention to skip B**           | Reward shaping: Penalize `EXIT` at B or advantage-based credit assignment.         | **Distorted** (via reward engineering) |  
  | **Forgetting past actions**       | POMDP state uncertainty; identical observations at B and C.                         | **Clean**          |  
  | **Self-defeating execution**      | Optimal `π*` is unachievable under partial observability → suboptimal `π_b`.       | **Clean**          |  
  | **"Irrational" regret**           | TD-error spikes when `π_b` takes `EXIT` at B but intended `π*` avoids it.          | **Partial** (regret not explicit in RL) |  
  | **Persistent intentional state**  | No explicit representation; "intention" is crudely forced via reward shaping.      | **Zero Analogue**  |  

  #### **Replay Corruption Twist: Dissolves or Relocates?**  
  - **Relocates the paradox:**  
    - Original tension arises from partial observability forcing suboptimal `π_b`.  
    - Corruption *adds* a new failure: **Misleading credit assignment** in replay buffer.  
    - Q-values converge to biased estimate: `Q(EXIT_AHEAD, EXIT) ≈ p·1 + (1-p)·4`.  
    - Agent may over-prioritize `EXIT` (due to inflated 4-reward attribution) → worsens performance.  
  - **Does not dissolve:** Core conflict (optimal plan vs. observable-state constraint) remains. Corruption exacerbates suboptimality but doesn't resolve the POMDP-induced compromise.  

  ---

  ### Unmapped Residue: Why RL Can't Capture "Persistent Intention"  
  **The Gap:**  
  - Philosophical "intention" requires a **time-invariant commitment** (e.g., "I will skip B") that persists across states.  
  - RL encodes this via **reward shaping or policy constraints**, but these are:  
    - **Non-persistent:** Rewards only modify transient value estimates.  
    - **State-agnostic:** Shaped rewards don’t partition `PRE_B`/`POST_B` due to identical observations.  
  - **No RL analogue** for intention as a **causal, stateful object** that survives state transitions.  

  **Root Cause:**  
  - The philosophical problem assumes a **counterfactual agent** that can "remember intentions" without observable state.  
  - RL agents require either:  
    - **Observable state distinctions** (e.g., `t=1` vs. `t=2`), or  
    - **External scaffolding** (e.g., reward shaping, meta-learning).  
  - **Verdict:** The paradox targets a *hypothetical agent* with contradictory capabilities (planning with perfect foresight but acting with zero memory). RL reveals this isn't about "rationality" but about **impossible constraints** (partial observability + no memory).  

  ### Conclusion  
  - **What RL explains cleanly:** Suboptimal policies from partial observability, off-policy/behavior policy divergence, and corrupted replay as a credit assignment failure.  
  - **What requires distortion:** "Intention" must be reduced to reward engineering.  
  - **Unmapped residue:** Persistent intention has no home in RL; the paradox highlights a *deliberately pathological* agent setup, not a limitation of RL.  
  - **Honest diagnosis:** The philosophical tension is a **thought experiment artifact**—real agents (biological or artificial) would use memory or environmental cues to resolve ambiguity. RL’s "failure" is correctly prioritizing *learnability* under given constraints.
