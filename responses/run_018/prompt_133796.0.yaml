  ### Archival Silence Requirement (top-level):
  "Theory must account for archival gaps by recognising their potential causal significance and the power structures they reflect; it cannot treat silence as neutral absence but must incorporate the analysis of silence as part of the explanatory structure, for example by using methods like triangulation, critical source criticism, or explicit modelling of uncertainty."

  ### Macro-Micro Integration Note (top-level):
  "Theory must integrate large-scale structural patterns (e.g., economic systems, demographic trends) with individual intentional actions without reducing one to the other, for instance by showing how structural constraints enable and limit individual choices and how collective actions can transform structures."

  ### Brief Scoring:

  Covering-law models:
  Strengths:
  - Provide counterfactual support through general laws.
  - Objective and potentially testable.

  Failures:
  - Struggle with archival silence (treats data as given, not accounting for gaps).
  - Fail at macro-micro integration (tends to reduce agency to structural determinants).
  - Cannot capture contextual coherence (as it abstracts from particulars).
  - Often ignores the problem of teleology if laws are seen as deterministic.

  Narrative models:
  Strengths:
  - Handle archival silence by weaving a coherent story that acknowledges gaps.
  - Excel at contextual coherence and capturing subjective meaning.
  - Integrate macro and micro by situating actions in structural contexts.

  Failures:
  - Often lack counterfactual support (coherence does not imply causation).
