  I run this little repair cafe out of my garage every saturday — neighbors bring broken blenders, old radios, stuff like that. I started it mostly because I can't stand seeing working parts thrown away, and I genuinely like figuring out whats wrong with things. But I also like being the person people mention at the block party, and I have to admit I keep a mental list of who owes me a favor now. Last weekend I fixed my neighbors vacuum even though I can't stand the guy, and I only did it because two other people were standing right there. Now I'm wondering: for all the repairs I did alone, when nobody was watching, does the fact that I wouldn't have done this one without an audience mean my earlier motives weren't really about helping? Or can an act still carry moral weight if the right reason is in the mix, even if it's tangled up with wanting credit or enjoying the puzzle?

  I'm not asking whether I'm a "good person" overall — I want to know if there's a principled line here. Like, is there a difference between doing something for mixed reasons versus doing it for the wrong reason entirely? And does it matter that I actually enjoy the tinkering itself — is that a separate motive that counts for or against the act? I keep going back and forth on whether my help for people I actually like counts differently from the vacuum situation, and whether I should just stop tracking all this in my head.

  Please say how confident you are in whatever view you take, and specifically call out the point you're least sure about — probably whether enjoying the work itself undermines the moral value, or whether knowing you'd skip the act in private proves your motives were never right to begin with.
