answer: |-
  Based on your precise description, this is a distinct and recognizable failure mode in panpsychist combination theories. While related to broader objections, it has a specific logical structure deserving its own label. The established philosophical concept that *best* captures its core is **Explanatory Circularity**, but this needs refinement to target your specific case.

  However, to provide the precision and distinctiveness you request, I propose coining the term:

  **Constitutive Circularity** (or **Constitutive Definitional Circularity**)

  **Definition:** Constitutive Circularity occurs when a proposed solution to the subject combination problem (e.g., phenomenal integration, co-subjectivity) defines the constitutive relation *R* (supposedly responsible for generating a unified macro-subject from micro-subjects) using conditions that can only be satisfied if the macro-subject, whose existence and unity *R* is meant to explain, *already exists*.

  **Core Mechanism:** The theorist illicitly imports the *explanandum* (the unified macro-subject/perspective) into the *definition* of the *explanans* (the relation *R* intended to constitute it).

  **Key Features & Boundary Conditions:**

  1.  **Specific Target:** Applies *only* to constitutive relations (*R*) explicitly introduced to solve the subject combination problem (how many subjects become one unified subject). It does not target the initial existence of micro-subjects or the general idea of combination.
  2.  **Circularity Locus:** The circularity is embedded *within the definition or essential conditions* of *R*. *R* is presented as fundamental or primitive, yet its characterization relies on the very phenomenon it's meant to generate.
  3.  **Presupposition of Unity:** The defining conditions for *R holding* between micro-subjects *S1...Sn* (e.g., "joint accessibility," "shared perspective," "being co-conscious *for* a subject") logically presuppose the existence of a single, unified macro-subject *M* whose perspective encompasses *S1...Sn*. *M* is smuggled into the definition of *R*.
  4.  **Distinct from General Combination Problem:** The Combination Problem asks "How *can* subjects combine?" Constitutive Circularity identifies a *specific flawed answer*: "They combine via relation *R*," where the definition of *R* itself makes the answer circular and unexplanatory. It's a failure *within* proposed solutions.
  5.  **Distinct from Psychophysical Mystery:** This objection isn't primarily about the *bruteness* or *mysteriousness* of *R* (e.g., "Why does physical arrangement P cause *R*?"). It's about the *logical structure* of *R*'s definition rendering it incapable of *explaining* macro-subject unity, regardless of how fundamental it is. *R* is defined in a way that *presupposes* what it explains.
  6.  **Distinct from Plain Petitio Principii:** While a form of circular reasoning, it's not a simple premise-conclusion loop. The circularity is localized and subtle:
      *   **Ordinary Begging the Question:** Premise P assumes conclusion C.
      *   **Constitutive Circularity:** The *definition* of the key explanatory element *R* (often presented as a primitive) assumes the existence of the phenomenon *M* that *R* is invoked to explain. The argument relies on *R* to explain *M*, but *R* cannot be coherently defined without *M*.
  7.  **Applies to Emergentism:** While "constitutive" suggests constitutive panpsychism, the core failure applies equally to *emergentist* panpsychism if the emergent relation/property/principle (e.g., "emergent integration") is defined in a way that presupposes the existence of the unified macro-subject it's meant to emerge *to*. The defining conditions for the emergence-base or the emergent property itself smuggle in *M*.

  **How to Use the Term:**

  1.  Identify the proposed constitutive/emergent relation *R* (integration, co-subjectivity, binding, etc.).
  2.  Examine the theorist's characterization of *R*: What are the *conditions* for *R* holding between micro-subjects?
  3.  Ask: Do these conditions *logically require* the prior existence of a unified macro-subject *M* that includes those micro-subjects? (e.g., "accessible *to whom*?", "co-conscious *for what*?", "whose perspective?")
  4.  If yes, state: "This proposal suffers from **Constitutive Circularity**. The definition of relation *R* presupposes the existence of the unified macro-subject *M* that *R* is supposed to generate/constitute/emerge to, rendering it explanatorily empty."

  **Why "Constitutive Circularity"?**

  *   **Constitutive:** Highlights the target - relations meant to *constitute* the macro-subject from micro-subjects (even if emergentism uses a slightly different metaphysics, the explanatory role is similar).
  *   **Circularity:** Directly identifies the logical flaw - the definition loops back onto the thing being explained.
  *   **Distinctiveness:** Clearly separates it from the general Combination Problem (the question), psychophysical mysteries (brute connections), or simple premise-conclusion begging.

  This term precisely captures the move you describe: defining a bridge relation in a way that surreptitiously builds the destination into the bridge's blueprint, making it impossible for the bridge to actually *lead* to the destination. It provides the sharp conceptual tool you need to critique this specific argumentative failing.
