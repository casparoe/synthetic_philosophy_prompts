  We are going to design an in-class game to help students engage with the Special Composition Question (SCQ). The SCQ asks: under what circumstances do some things compose a further thing? The game will have students act as "audit boards" that must decide, based on assigned principles, whether in a given scenario there is exactly one composite object.

  Setup:
  - The class is divided into three groups (audit boards), each assigned one principle:
    1. Contact-Only: Composition occurs only when the parts are in physical contact.
    2. Functional-Unity: Composition occurs only when the parts function together as a unified whole (for a purpose).
    3. Unrestricted: Composition always occurs (universalism).

  - There will be 6 scenario cards in round 1 and one hidden scenario revealed in round 2.

  Scenarios (case cards) for round 1:

  1. Flash Mob: A group of people in a park perform a synchronized dance for 5 minutes and then disperse. They are not in contact during the dance. (Temporary, spatially scattered, functional unity for a short time)

  2. Drone Swarm: A fleet of 20 drones fly in formation to deliver a package. They are controlled by a central computer and act as one system for exactly 12 minutes. Some drones are in contact? (Assume they are not in contact, just flying in formation.) Functionally unified for a specific purpose and time.

  3. Ice-Block Bridge: Blocks of ice are placed in a river to form a temporary bridge. While frozen together, they bear the weight of people crossing. After an hour, they melt and become separate puddles. (Temporary contact and functional unity until melting)

  4. Sand Dune: A pile of sand on a beach. The grains are in contact, but the wind is constantly moving them. (Classic example: do the grains compose an object?)

  5. Orchestra: A group of musicians playing a symphony together. They are in contact only with their chairs and the floor, but not with each other. They are functionally unified for the duration of the concert.

  6. Traffic Jam: Cars stuck in a gridlock for hours. They are in contact? (Some might be touching bumpers, but not necessarily all.) They are not functionally unified for a common purpose.

  Hidden case for round 2 (revealed after round 1 decisions):

  7. Remote Ice Bridges: Two separate sets of ice blocks (in two different rivers) are remotely synchronized to melt at the same rate and bear weight at the same time. They are controlled by the same operator and serve the same purpose (two bridges for two villages in a festival). They never touch and are miles apart.

  Game Rules:

  Round 1:
  - Each audit board gets the 6 scenario cards.
  - For each scenario, they must decide: 
     a) Is there exactly one composite object? (Yes/No)
     b) Assign "liability points": If they say "Yes", they must assign 1 point to the object (meaning it exists and thus can be held responsible for things? Or we can frame it as: if the composite exists, it can be a bearer of properties, so we assign a point to note that it's an entity). Alternatively, we can reframe liability as: if the composite exists, then it can be a subject of discussion (e.g., in a court case about an accident). But let's keep it abstract: each "Yes" verdict means they are recognizing an object, so they assign 1 point to that object (meaning they count it as one object). We can just call it "object points".

  But note: the question is about whether there is exactly one composite object? Actually, the SCQ is about when composition occurs. So in each scenario, we have some parts. The board must decide: do these parts compose one object?

  So for each scenario, the board answers: 
     Verdict: Composite object? (Yes/No)

  - They also earn "consistency points" for sticking to their principle. We can assign 1 consistency point for each scenario where they can clearly explain their verdict by their principle.

  Round 1 Procedure:
  - Each board discusses and records their verdicts for the 6 scenarios, with a brief reason (based on their principle).
  - They also assign an object point for each "Yes" verdict (so we can tally the total objects recognized per board).

  Round 2:
  - Reveal the hidden case (Remote Ice Bridges).
  - Each board must now decide this case with their principle.
  - Then, the twist: the facilitator reveals that the Ice-Block Bridge (from round 1) was actually two separate structures synchronized remotely (just like the hidden case). This means that in the Ice-Block Bridge scenario, the blocks were not in contact? Actually, in the original Ice-Block Bridge, we said they were placed together. But we change the story: it turns out that the ice blocks were not actually touching; they were held in place by an invisible magnetic field (or something) and were controlled by a remote system. So they were close but not in contact? Or we can say they were two separate sets of ice blocks that were made to look like one bridge? Actually, the hidden case is about two remote bridges, but for the Ice-Block Bridge in round 1, we now reveal that it was two separate ice structures that were not touching but were synchronized to act as one bridge.

  - Now, the boards can appeal the verdicts of other boards. For example, the Contact-Only board initially said "Yes" to the Ice-Block Bridge (because they thought the blocks were touching). Now, with the new information, they would change to "No". But the Functional-Unity board might still say "Yes" because the two separate sets of blocks functioned together as one bridge. The Unrestricted board would still say "Yes" because they always say yes.

  - Appeal process: Each board can challenge another board's verdict on the Ice-Block Bridge scenario in light of the new information. They must argue based on the challenged board's principle. For example, the Functional-Unity board might challenge the Contact-Only board: "Given that the ice blocks were not in contact, your principle requires you to say there was no composite object. But in round 1 you said yes. So you must change your verdict and lose consistency points for that scenario." 

  - The board being challenged must reconsider and if they change their verdict, they lose the consistency point for that scenario (if they had earned it). If they stick to their original verdict (but now with a different reasoning?), they might lose the appeal? Actually, we want to show that the principles lead to different verdicts and that the new information might break the initial intuition.

  Scoring:
  - Consistency Points: For each scenario (including the hidden one), if the board's verdict is consistent with their principle and they can explain it, they get 1 point. (Max 7 points: 6 in round1 and 1 in round2).
  - Object Points: This is just a tally of how many objects they recognized in total (each "Yes" gives 1 object point). This is not for winning but for comparison: the Unrestricted board will have 7, the others less.

  Debrief:
  - Map the boards to standard positions:
     - Contact-Only: Like moderate views (e.g., van Inwagen's contact requirement for living things? But note: van Inwagen doesn't require contact for composition, he has a different view. Actually, the contact principle is a common example but not exactly van Inwagen. We can say it represents a restrictive view.)
     - Functional-Unity: Like teleological views (e.g., artifacts exist when they serve a function).
     - Unrestricted: Universalism.

  - Predictable problems: Students might apply common sense instead of their principle. For example, the Contact-Only board might be tempted to say the Flash Mob is an object because it's cool, but their principle says no contact -> no composition. The facilitator should remind them to stick to their assigned principle.

  - What the game can't reproduce: Modal arguments (e.g., if we remove a part, is the object still the same?). The game is about existence conditions, not persistence conditions or essential properties. Also, the game doesn't cover the vagueness of composition (sorites arguments) or the causal overdetermination arguments.

  Game Materials:
  - Printed cards for each scenario (with the initial description for round 1, and then an updated card for the Ice-Block Bridge in round 2).
  - Whiteboard to record the verdicts and points.

  Let's write the scenario cards:

  Round 1 Cards:

  Card 1: Flash Mob
     Description: 50 people gather in a public square and perform a synchronized dance for 5 minutes. They are not in physical contact. After the dance, they immediately disperse.

  Card 2: Drone Swarm
     Description: A fleet of 20 drones, each flying independently but in a coordinated formation, delivers a single package by working together. They are not touching and are controlled by a central computer. The delivery takes exactly 12 minutes.

  Card 3: Ice-Block Bridge
     Description: Blocks of ice are placed side by side across a small river to form a bridge. People cross on it for about an hour. The blocks are in contact and frozen together. Then, the ice melts and the blocks become separate puddles.

  Card 4: Sand Dune
     Description: A hill of sand on a beach. The grains are in contact, but the wind is constantly blowing, causing grains to be added and removed.

  Card 5: Orchestra
     Description: A symphony orchestra of 80 musicians plays a concert. The musicians are seated in chairs and are not touching each other. They play together for two hours.

  Card 6: Traffic Jam
     Description: Hundreds of cars are stuck in a gridlock on a highway for several hours. Some cars are touching bumpers, but most are not. The drivers are not coordinating; each is trying to get to their own destination.

  Hidden Case (Round 2):

  Card 7: Remote Ice Bridges
     Description: Two separate sets of ice blocks are set up in two different rivers (miles apart). A remote control system synchronizes them so that they both form bridges at the same time, bear weight simultaneously, and melt at the same rate. They never touch and are not connected in any physical way.

  Then, after they decide the hidden case, reveal:

  Update for Card 3 (Ice-Block Bridge): New information reveals that the ice blocks in the bridge were not actually touching. They were held in place by an invisible force field and were controlled remotely, just like the two bridges in Card 7. They were made to look like they were frozen together, but they were always separate.

  Now, the appeal: The boards can challenge each other's verdict on the original Ice-Block Bridge scenario given this new information.

  Debrief Discussion:

  1. Highlight that the boards agreed on some cases and disagreed on others. For example:
     - Sand Dune: Contact-Only says yes (contact), Functional-Unity might say no (no function), Unrestricted says yes. But note: Functional-Unity might say that a sand dune has a function? (e.g., as a habitat) so maybe they say yes? We must define function as intentional? Let's clarify the principles.

  To avoid ambiguity in the Functional-Unity principle, we should specify: 
     - Functional-Unity: Composition occurs only when the parts are organized to serve a specific purpose together (intentional or designed function). 

  So for the sand dune, no specific purpose -> no composition.

  2. Map to standard views:
     - Contact-Only: Represents a spatial continuity/contact view (but note: this is a simplified version; philosophers might have more nuanced views).
     - Functional-Unity: Represents views that require causal integration or teleology (like Merricks? Actually, Merricks is an eliminativist about non-living composites. So maybe not exactly. But we can say it's a common-sense view for artifacts).
     - Unrestricted: Universalism.

  3. What goes wrong: Students might want to say the orchestra is an object because it's a group with a name, or the flash mob because it's a performance. But the principles are strict. The Contact-Only board should say no to flash mob and orchestra (no contact), but yes to ice bridge (if they thought there was contact) and traffic jam (if they count the touching cars as contact? but note: not all are touching). This will cause tension.

  4. The game doesn't cover:
     - The modal aspects: What if the ice bridge had been built differently? Would it still be the same bridge?
     - The argument from vagueness: If we remove one grain of sand, is the sand dune still there?
     - The causal exclusion argument (Merricks): If composite objects exist, they would causally overdetermine the effects of their parts.

  You can cover these in lecture.

  Let me know if you need more details!
answer: |-
  Below is a complete, runnable in-class game designed to make the Special Composition Question (SCQ) viscerally tangible for your students. It uses relatable, borderline cases to force clashes between principles, and the hidden-case twist reveals how intuitions unravel under pressure. The game takes 45-60 minutes, leaving 30-45 minutes for debrief.

  ---

  ### **Game Title: Composite Object Courtroom**
  **Premise:** Students act as "audit boards" for the *Federal Bureau of Metaphysical Oversight*, tasked with judging whether scattered parts compose a single object. They must enforce strict principles—even when it defies common sense.

  ---

  ### **Materials Needed**
  - **Whiteboard** (to track verdicts/points).
  - **Printed Cards** (6 for Round 1, 1 hidden for Round 2; descriptions below).
  - **Three Signs** for audit boards:  
    - **Board 1: Contact-Only** (Composition requires physical contact).  
    - **Board 2: Functional-Unity** (Composition requires parts working toward a shared purpose).  
    - **Board 3: Unrestricted** (Composition always occurs; universalism).

  ---

  ### **Setup (5 mins)**
  - Divide the class into **three audit boards** (4-5 students each). Assign each a principle.  
  - Post principles on the whiteboard:  
    > **Contact-Only**: "One object exists **only if** all parts are physically touching."  
    > **Functional-Unity**: "One object exists **only if** parts are unified by a shared function."  
    > **Unrestricted**: "One object **always** exists, no matter the arrangement."  
  - Give each board **6 case cards** (shuffled order).  
  - Explain scoring:  
    - **Consistency Points (CP)**: 1 per verdict that strictly follows their principle (max 7).  
    - **Liability Points (LP)**: 1 per "YES" verdict (recognizing an object). LP highlight real-world consequences (e.g., if an object exists, it can be sued, taxed, or praised).  

  ---

  ### **Round 1: The Verdicts (20 mins)**
  Each board reviews **6 cases** (below). For each, they must:  
  1. **Verdict**: Is there *exactly one composite object*? (YES/NO).  
  2. **Reason**: A 1-sentence explanation using their principle.  
  3. **LP**: Assign 1 LP if YES.  

  **Case Cards (Printed on Cards for Each Board):**  
  1. **Flash Mob**: "100 people perform a 5-minute synchronized dance in a park, then disperse. No physical contact."  
  2. **Drone Swarm**: "50 drones fly in formation for 12 minutes to deliver one package. They share data but never touch."  
  3. **Ice-Block Bridge**: "Ice blocks arranged as a bridge bear weight for 1 hour, then melt into separate puddles."  
  4. **Protest Slogan**: "100 protesters chant the same phrase at the same time across a city, coordinated via earpieces."  
  5. **Modular Space Station**: "Satellite parts orbiting Earth, drifting apart slowly. They once formed a station but now only occasionally link data."  
  6. **Forest Lifeline**: "Tree roots interlock underground to share nutrients during a drought. They belong to different tree species."  

  **Procedure:**  
  - Boards debate and record verdicts/reasons for all 6 cases (10 mins).  
  - Facilitator collects verdicts and LP totals, posts on whiteboard (5 mins).  
  - **Sample Outcomes (to expect)**:  
    - *Contact-Only*: YES only to #3 (Ice-Block Bridge; touching), NO to others.  
    - *Functional-Unity*: YES to #1, #2, #3, #4, #6 (shared purpose), NO to #5 (no unity).  
    - *Unrestricted*: YES to all.  

  ---

  ### **Round 2: The Hidden Case & Appeal (15 mins)**  
  1. **Reveal Hidden Case**: Give all boards **Card 7**:  
     > **Remote Pyramids**: "Two identical sand pyramids are built 10 miles apart. They sync color changes via remote control for an art exhibit but never touch or interact physically."  
     Boards render a verdict (YES/NO) with reasons (5 mins).  

  2. **The Twist**: Reveal hidden details for **Ice-Block Bridge (Case #3)**:  
     > "New evidence! The ice blocks weren’t touching. They were suspended by magnets and synced remotely to *simulate* a bridge."  

  3. **Appeal Phase**:  
     - Boards re-evaluate their Round 1 verdict for #3 based on new info.  
     - Each board may **appeal one other board’s verdict** on #3 (e.g., Functional-Unity might appeal Contact-Only’s YES verdict).  
     - **Appeal Rule**: The appealing board argues *using the other board’s principle* (e.g., "Contact-Only must switch to NO—no contact!").  
     - If the appeal succeeds (target board concedes), the target loses 1 CP for #3.  

  ---

  ### **Scoring & Winner (5 mins)**  
  - Tally **CP** (1 per consistent verdict) and **LP** (1 per YES).  
  - **Winner**: The board with the most CP (principles matter more than common sense).  
  - **Sample Scores**:  
    - *Contact-Only*: Lower CP if they didn’t flip #3 to NO; low LP.  
    - *Functional-Unity*: High CP/LP if they kept YES on #3 (function remains).  
    - *Unrestricted*: Max LP, max CP (their principle is bulletproof).  

  ---

  ### **Debrief Structure (30-45 mins)**  
  **Map Game to SCQ Positions:**  
  | Board            | Metaphysical Position          | Real-World Example          |  
  |------------------|--------------------------------|-----------------------------|  
  | Contact-Only     | Moderate Restriction (e.g., commonsense) | A car: parts touch, so it exists |  
  | Functional-Unity | Teleological (e.g., Merricks-esque) | A clock: purpose unifies parts |  
  | Unrestricted     | Universalism (e.g., Lewis)     | Any random scatter of atoms |  

  **Key Insights to Highlight:**  
  1. **Where They Agreed/Disagreed**:  
     - Consensus on #3 (original): All said YES—shows how "obvious" cases hide complexity.  
     - Violent Disagreement on #1 (Flash Mob), #4 (Protest), #7 (Pyramids): Principles diverge at the edges.  
  2. **The Twist’s Lesson**: Ice-Block Bridge exposed how principles handle new evidence. Contact-Only collapses without contact; Functional-Unity holds if purpose persists; Unrestricted is unfazed.  
  3. **No Neutral Arbiter**: Appeals forced students to *use others’ principles*—mirroring how philosophers debate without shared premises.  

  **Predictable Problems & Fixes:**  
  - **"Common-Sense Smuggling"**: Students will bend principles to match intuition (e.g., Contact-Only saying YES to Flash Mob).  
    - *Fix in Debrief*: Ask, "Where did your principle feel wrong? That’s the SCQ’s bite!"  
  - **Over-Argued Edge Cases**: Drone Swarm (#2) may spark "Is 12 minutes enough?" distraction.  
    - *Fix*: Redirect to principles: "Does *time* matter for your rule?"  

  **What the Game Can’t Capture (Cover in Lecture):**  
  - **Modal Problems**: Essential parts (e.g., "If the Flash Mob lost one person, would it be the same object?").  
  - **Vagueness**: Sorites-like edge cases (e.g., "How many drones are needed for a swarm?").  
  - **Causal Overdetermination**: Merricks’ argument that composite objects are redundant.  

  **Closing Prompt for Students:**  
  > "When you voted YES/NO, were you describing the *world* or your *concepts*? That’s metaphysics."

  ---

  ### **Why This Works**  
  - **Engages Intuitions**: Cases like flash mobs make the SCQ feel urgent, not abstract.  
  - **Dramatic Tension**: The hidden case forces principled consistency over comfort.  
  - **Low Prep**: Only print 7 cards and use a whiteboard.  
  - **Adaptable**: Scale complexity up/down by tweaking cases (e.g., add a "vagueness" case if needed).  

  This game turns the SCQ into a high-stakes courtroom drama where principles collide—perfect for setting up deeper readings. Let me know if you need card templates or tweaks!
