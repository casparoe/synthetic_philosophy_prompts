  The user's main mistake is attributing the resolution of Russell's Paradox to Foundation when it's actually Separation that does the heavy lifting. Their concern about non-well-founded theories is valid, but those systems replace Foundation without reverting to naive comprehension, so they remain consistent relative to ZFC.

