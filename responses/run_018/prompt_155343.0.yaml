  First I need to unpack their core ask: they're preparing to evaluate hedonism/desire/objective theories but want robust criteria first. The emphasis on the toggle variant suggests they're probing deeper than standard Nozick objections - probably questioning whether memory continuity affects the intuition. 

  Hmm, key angles to cover:
  - Why simulation feels costly despite pleasure equivalence (reality contact)
  - Whether the amnesia-toggle softens or sharpens the problem (tests if deception is core)
  - Deception vs mere lack of access (autonomy angle)
  - Why preference satisfaction fails even if users choose sim (authenticity trap)
  - Real-world parallels like clinical VR studies (empirical grounding)

  User seems analytically sharp - tossing terms like "episodic memory" casually. Probably philosophy/psychology adjacent. Their "dataset" note implies systematic comparison, so criteria must be operationalizable. "Casual with typos" means no jargon overkill but precision still needed.

  Biggest challenge: Criteria 4 vs 6 might conflict. If toggle-users prefer sim but retrospective reports show unease, theories must resolve that tension. Also, the autonomy requirement (C3) could clash with hedonism if pleasure is higher in sim.

  For scoring section: 
  - Hedonism fails most criteria except pleasure-maximization 
  - Desire theory stumbles on deception cases 
  - Objective-list handles reality-contact best but struggles with toggle-choice paradox

  Should flag that C4 and C6 tension is the crux - if real-world data shows toggle-users regret sim-time, it nukes desire theory. If not, hedonism gains ground. User's VR protocol mention suggests they suspect retrospective dissonance.

  ...And done. Left typos in "desire-theory" and "retrospective" to keep it loose per request. The clinical studies footnote hints where empirical weight lies without citing papers.
answer: |-
  Here's your desiderata cheat-sheet for Experience Machine-resistant well-being theories, focusing on the core intuitions & tensions:

  **Core Desiderata (EM-Test Suite):**

  1.  **Reality-Contact Requirement (Non-Negotiable):**  
      *   **Case:** Original EM (plugged-in forever).  
      *   **Intuition:** Pure simulation seems deficient *even if* pleasure/preference-satisfaction is maxed. Well-being requires *some* connection to actual reality, not just perfect appearances.  
      *   **Why:** Explains the cost of full simulation despite "maxed" internal states.

  2.  **Deception vs. Mere Simulation Distinction (Negotiable):**  
      *   **Case:** Comparing Original EM (active deception) vs. a hypothetical "Honest Sim" (you *know* it's fake, but choose it anyway).  
      *   **Intuition:** Active deception (believing the sim is real) feels *worse* than knowingly choosing a sim. Well-being might be undermined by *false beliefs* about one's state, not just the sim-state itself.  
      *   **Why:** Pinpoints if the problem is ontological (lack of real world) or epistemic (false belief).

  3.  **Autonomy/Authenticity Requirement (Non-Negotiable):**  
      *   **Case:** Original EM setup (programmers choose your experiences).  
      *   **Intuition:** Having your life scripted by others, even pleasurably, feels alienating. Well-being requires *agency* in shaping one's life based on one's *own* values/choices.  
      *   **Why:** Distinguishes passive receipt of good states from active living.

  4.  **Toggle-Choice Paradox (Critical Tension Point):**  
      *   **Case:** Amnesia-Toggle EM (you freely switch, forget which mode you're in).  
      *   **Intuition Drive:**  
          *   **Sharpens Problem?** If you *prefer* sim-stretches while *in* them (post-amnesia), but later feel those stretches were deficient upon learning, highlights a conflict between momentary preference-satisfaction and retrospective/"external" judgment of worth.  
          *   **Dissolves Problem?** If freely choosing sim-stretches knowing the setup makes them "count," suggests the core issue might be deception/lack of control, not simulation *itself* if autonomously chosen.  
      *   **Why:** Tests if reality-contact is *inherently* valuable or if autonomy + lack of deception is sufficient. **Big Tension:** Can a theory respect *both* the user's *in-the-moment* preference for sim *and* the intuition that sim-life is less valuable?

  5.  **Preference-Satisfaction Insufficiency (Non-Negotiable):**  
      *   **Case:** Amnesia-Toggle users preferring sim-stretches *during* them.  
      *   **Intuition:** Even if preferences *are* satisfied during the sim, it feels like something important (e.g., reality-contact, authenticity of the *object* of desire) is still missing. Well-being isn't *just* about getting what you *want*; it matters *what* you want and whether getting it connects you to reality.  
      *   **Why:** Desire-satisfaction alone seems vulnerable if satisfied desires can be for "fake" goods.

  6.  **Retrospective Coherence Requirement (Negotiable but Important):**  
      *   **Case:** Real-world parallels (long-term VR therapy, isolation chambers, sensory deprivation studies).  
      *   **Intuition:** People often report *later* that such periods, while perhaps tolerable or even pleasant *at the time*, felt "empty," "less real," or deficient in overall life-worth *in retrospect*. A theory should cohere with this "whole life" perspective, not just momentary states.  
      *   **Why:** Grounds intuitions in real human experience and emphasizes narrative/temporal aspects of well-being. **Tension with C4:** If toggle-users report retrospective unease about sim-time *despite* choosing it freely pre-amnesia.

  **Potential Conflicts:**

  *   **C4 vs. C6:** Can a theory simultaneously respect the *autonomous choice* and momentary preference-satisfaction of the toggle-user *in* the sim (C4) *and* validate the intuition that those sim-periods contribute less to *retrospective* well-being (C6)? This is the core hinge.
  *   **C1 vs. C4 Interpretation:** If the Toggle dissolves the problem (you chose it, it counts), it weakens the strict Reality-Contact requirement (C1). If it sharpens it (sim time still deficient despite choice), C1 holds firm.

  **Quick Theory Scores vs. Desiderata:**

  *   **Hedonism (Well-Being = Pleasure/Pain Balance):**  
      *   **Fails:** C1 (Why is real pain worse than sim pain if felt the same?), C2 (Deception irrelevant if feelings identical), C3 (No inherent value to agency), C5 (Preference irrelevant unless it *is* pleasure), C6 (Retrospective reports often cite non-hedonic lacks).  
      *   **Maybe on C4:** If sim feels better, it's better *for that period*. Ignores retrospective critique.
  *   **Desire-Satisfaction (Well-Being = Getting What You Want):**  
      *   **Fails:** C1 (Why desire reality if sim satisfies desires perfectly?), C2 (Deception might frustrate meta-desires), C5 (Core failure - desires *can* be for simulated states).  
      *   **Scores on C3/C4:** Excels if choices are free/authentic (Toggle choice validates sim). Struggles with C6 if retrospective judgment conflicts with satisfied-in-the-moment desires.
  *   **Objective List (Well-Being = Goods like Knowledge, Friendship, Achievement, Autonomy):**  
      *   **Scores Well:** C1 (Real friendship > sim friendship), C2 (Deception undermines knowledge/authenticity), C3 (Autonomy is a good), C5 (Sim might lack *real* goods), C6 (Can explain retrospective reports citing lack of real goods).  
      *   **Tension on C4:** If the toggle-user *freely chooses* sim-time knowing it lacks real goods, is their well-being *still* lower during it? (Strict OL: Probably yes, sim goods are inferior. Soft OL: Maybe choice itself adds value).

  **Key Takeaway:** The **Amnesia-Toggle** is the ultimate stress test. Does freely choosing simulation *with* amnesia (so no *ongoing* deception during the sim) make simulation "count," or does the fundamental lack of reality-contact *still* make it deficient, even against the user's own momentary preferences and retrospective reports? This clash (C4 vs C6) is where theories crack. Reality-contact (C1) and the insufficiency of desire-satisfaction alone (C5) seem like the hardest non-negotiables to ditch.
