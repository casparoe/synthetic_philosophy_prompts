  Hmm, this is a fascinating problem from a PhD student in a foundations of computation reading group. The student's convener—a senior philosopher of physics—has systematically dismissed every purported counterexample to the Church-Turing thesis (CTT) they've presented, and now they're about to discuss a new proposal involving a computationally universal lattice system. The student wants to predict how she'll rule on this case, understand her underlying thesis, and find a variant that would actually test her position.

  First, let's unpack the convener's pattern. She rejects counterexamples on two broad grounds: (1) physical unrealizability (oracles as stipulations, supertasks requiring zero-duration steps, analog devices needing infinite precision) and (2) epistemic/surveyability issues (lack of step-by-step verifiability, as in Malament-Hogarth survival or Penrose's argument). Quantum computing is set aside as only challenging feasibility, not computability. Her two remarks suggest tension: one leans physical (she'd accept a lab hypercomputer), the other conceptual (computation requires rule-following "all the way down").

  The new proposal is clever: a physically plausible lattice with finite precision, no exotic physics, polynomial relaxation time, and majority voting for reliability. The catch is that ground state certification is probabilistic—you can't verify per-run success, only boost confidence asymptotically.

  To predict her ruling, I need to reconstruct her implicit thesis. Three candidates emerge:
  1. **Strong Physical CTT**: What is physically computable coincides with Turing computability. This would accept the lattice if deemed buildable.
  2. **Verificationist CTT**: Effective procedures require surveyable, step-by-step verification. This would reject the lattice due to the certification gap.
  3. **Hybrid Thesis**: Computation requires both physical realizability and epistemic transparency. The lattice might fail on the latter.

  Her precedent closest to this is the wave equation case: she rejected it because initial data weren't "physically preparable" in a strong sense, hinting at an epistemic bar beyond mere computability. Similarly, here, the inability to certify the ground state per run might trigger her verificationist instinct.

  My prediction: She'll reject it. Despite physical plausibility, the lack of deterministic verification ("not rule-following all the way down") violates her conceptual requirement. The wave equation case is the best analog—both involve computable inputs but non-verifiable processes.

  To truly test her, we'd need a variant where the outcome is surveyably verifiable. The student's frustration-free redesign (local certification) would force her to either accept it (if physicality suffices) or reveal a stricter epistemic demand. Alternatively, replacing relaxation with a numerical procedure would split the readings cleanly: verificationist CTT accepts it, physical CTT might still question implementability. 

  The core issue is whether "computation" requires knowable correctness per execution. Her history suggests yes. If so, this case—like the wave equation—fails the "vouching" test.
answer: |-
  Based on your convener's consistent pattern of rulings and her dual remarks about physical contingency versus conceptual analysis, I reconstruct her implicit position as a **Verificationist-Physical Hybrid Thesis (VPHT)**. This isn't a monolithic claim but a conjunction of two necessary conditions for a process to count as a "computation" that could violate CTT:  
  1. **Physical realizability**: The system must be buildable with finite resources under known physics (no infinities, idealizations, or nomologically dubious elements).  
  2. **Epistemic surveyability**: Each computational step must be locally verifiable/certifiable without post-hoc statistical inference; the user must be able to "vouch for" correctness deterministically at every stage.  

  Her rejections split cleanly:  
  - Oracle machines, supertasks, analog computers, real-weight NNs, MH spacetimes, CTCs → fail **physical realizability**.  
  - Wave equation non-computability, Lucas-Penrose → fail **epistemic surveyability** (initial data not "preparable" = can't vouch for setup; Gödelian introspection not mechanically checkable).  
  Quantum computing is sidelined because it satisfies both but targets *feasibility* (P vs BPP) rather than *computability* (R vs RE).  

  ### Prediction for the Lattice Proposal  
  **She will reject it**, ruling that it fails the **epistemic surveyability condition**. Though it passes physical realizability (finite precision, no supertasks, buildable hardware), the inability to *certify the ground state* via local measurements means the output isn't "surveyable." Reliability via majority voting relies on probabilistic inference after the fact, violating her requirement that computation must be "rule-following all the way down" with transparent, step-by-step verification.  

  **Closest precedent**: The **wave equation case**. She dismissed it because initial data were computable "only in a weak sense" (not physically preparable). Analogously here: the lattice's *output* is "computable only in a weak sense" (not locally verifiable). Both cases involve hidden epistemic gaps—setup for the wave equation, outcome certification for the lattice.  

  **Commitment by ruling this way**: She affirms that CTT is not just about physical limits but about the *nature of proof-driven calculation*. By requiring per-run certification, she elevates the thesis to a claim about mathematical justification: a computation must furnish its own mechanical verifiability.  

  ### Candidate Theses Fitting Her Record  
  | Thesis Variant               | Physical Realizability Required? | Epistemic Surveyability Required? | Prediction for Lattice |  
  |------------------------------|----------------------------------|-----------------------------------|------------------------|  
  | **VPHT (Hybrid)**            | Yes                              | Yes                               | Reject (fails surveyability) |  
  | **Bold Physical CTT**        | Yes                              | No                                | Accept                  |  
  | **Conceptual Analysis CTT**  | No                               | Yes                               | Reject                  |  

  Her actual rulings fit *only* VPHT: every rejected case fails at least one condition, and no prior case passed both. The lattice is the first to challenge VPHT by satisfying physicality while failing strict verification.  

  ### Why Your Discriminators Work (and Which to Use)  
  - **Frustration-free redesign with local certification**: This would satisfy *both* VPHT conditions. If she **accepts** it, VPHT holds. If she **rejects** it (e.g., arguing "local terms don't guarantee global state"), she likely holds a stronger **Global Surveyability Thesis** requiring end-to-end verification.  
  - **Explicit numerical procedure replacing relaxation**: If she **accepts** this (as "surveyable"), VPHT is confirmed. If she **rejects** it (e.g., "numerical simulation isn't physical computation"), she defaults to **Physical CTT**.  

  **Recommended discriminator**: Propose the **frustration-free version**. It directly targets the certification gap in her lattice objection. If she accepts, VPHT explains her entire record. If she rejects, her thesis is likely even stricter (e.g., requiring *polynomial-time* verification or anthropocentric constraints).  

  ### Contingent vs. Conceptual Tension Resolved  
  Her remarks aren't contradictory under VPHT:  
  - She'd "give up if a hypercomputer were wheeled in" → if it satisfied *both* conditions (e.g., a verified, buildable machine).  
  - "Not rule-following all the way down" → rejects processes where reliability hinges on unverifiable steps (like probabilistic ground-state attainment).  

  **Final assessment**: This lattice case is the litmus test for her verificationism. I predict rejection with phrasing like: *"A system whose correctness you can only infer statistically, not mechanically inspect, fails to instantiate an effective procedure—it's a physical oracle, not a computation."* Bring the frustration-free variant next to force the issue.  

  ---  
  *N.B. If she accepts the original lattice, it implies her "contingent physical" remark dominates, but this contradicts her wave-equation ruling. VPHT is the parsimonious fit.*
