answer: |-
  ## The Labyrinth of Layers: How Splitting Primary Intension Undermines Two-Dimensional Semantics

  Your intuition that adding a "surface/substrate" split *within* the primary intension risks collapsing two-dimensional semantics (2DS) into a disguised direct-reference theory—or worse, into incoherence—is profoundly insightful. Let's dissect the arguments, weighing whether this layered approach rescues 2DS or consigns it to failure. The verdict will be clear: **this particular split is self-defeating and ultimately collapses the explanatory power of 2DS by smuggling in direct reference through the back door.**

  **1. The Promise of Layering: Salvaging Armchair Access?**

  The motivation for your layered primary intension (PI) is understandable. Standard Chalmersian 2DS posits the PI as the *epistemic* or *contextual* intension: what a term picks out, given only a world considered as actual, from the armchair. For "water," the PI picks out the dominant, clear, drinkable liquid in rivers and lakes (the "watery role") in any scenario. The secondary intension (SI), fixed by the actual world, rigidly picks out H₂O. "Water is H₂O" is necessary (SI identical across worlds) but a posteriori (discovering *what* fulfills the watery role in the actual world requires empirical investigation).

  Your worry is valid: **What *exactly* constitutes the "armchair accessible" PI?** Does it include the entire metaphysical machinery fixing reference across worlds based on the watery role? This seems to import substantive, potentially non-transparent commitments. Your solution:

  *   **Surface Layer (SL):** What is *directly* introspectable or conceptually accessible purely from the armchair (e.g., the *concept* "dominant clear drinkable liquid").
  *   **Substrate Layer (SLb):** The mechanism that *connects* this surface description to reference across possible worlds "pre-empirically," supposedly still part of the conceptual role but doing the heavy lifting.

  The hope is that SL preserves the a priori, conceptual core, while SLb handles the Kripkean rigidity without collapsing into direct reference.

  **2. The Collapse Arguments: Substrate as Trojan Horse**

  This layered model faces fatal pressure points:

  *   **Argument from Opacity & Empiricism:** If SLb "fixes reference across worlds," what *is* it? It must be something like: "The property that *actually* plays the watery role in *this* world (the world considered as actual) determines the reference *in that world*." But crucially, **determining *which* property plays the watery role *in a given world considered as actual* is precisely the empirical discovery.** We didn't know a priori that H₂O plays the role here; we discovered it. If SLb incorporates the idea that it's *whatever property contingently fills the role*, then SLb isn't armchair accessible at all – it's parasitic on empirical facts about the specific world being considered. The "pre-empirical" claim becomes hollow. SLb is functionally *equivalent* to the direct reference of the secondary intension, but misleadingly labelled as part of the "primary" conceptual core.
  *   **Argument from Functionality & Direct Reference:** What *work* is SL doing? If SL is just the bare descriptive tag ("watery stuff"), and SLb is the mechanism that rigidly anchors reference *to the actual occupant of that role in the world considered as actual*, then **SLb *is* performing the function of a rigid designator.** The reference is fixed by the contingent fact about what *actually* (in that world) satisfies the description. This is indistinguishable in outcome from Kripke's causal-historical picture or direct reference: the term refers to *that stuff* (H₂O in @, XYZ in Twin Earth), regardless of superficial properties in counterfactual scenarios. The layered PI becomes a needlessly complex way of stating that reference is fixed by contingent facts accessible only empirically, disguised as conceptual analysis.
  *   **Argument from Explanatory Vacuum:** The core promise of 2DS is explaining the *epistemic* difference between "Water is H₂O" (a posteriori necessity) and "Hesperus is Phosphorus" (also a posteriori necessity) vs. "Bachelors are unmarried" (a priori necessity). 2DS does this via the PI/SI distinction. If SLb is doing the rigidifying work previously assigned to the SI (anchored by the actual world), but is now part of the supposedly epistemic PI, **the distinction between PI and SI blurs catastrophically.** The PI loses its pure epistemic character. The necessary a posteriori status of "Water is H₂O" is no longer explained by the *gap* between the watery-role-PI and the rigid-H₂O-SI; it's explained by the *empirical discovery required to activate the rigidifying SLb mechanism*. This undermines the entire explanatory structure of 2DS. The "mystery" of direct reference isn't solved; it's repackaged inside the PI.

  **3. Does the Split Save 2DS? The Verdict**

  **No. The surface/substrate split within primary intension does not save two-dimensional semantics; it collapses its explanatory power and reveals its deep tension with Kripkean insights.**

  *   **Collapse into Disguised Direct Reference:** If SLb rigidly anchors reference to the actual occupant of the role *in the world considered as actual*, it functionally replicates direct reference or Kripkean rigid designation via description. The "layered" PI becomes a convoluted way to say reference is fixed by contingent empirical facts about the actual world, smuggled into the supposedly a priori domain. This abandons the core epistemic project of 2DS.
  *   **Self-Defeating:** If SLb is *not* doing this rigidifying work and is supposed to be purely conceptual/armchair, then it cannot explain how reference is fixed across worlds for natural kind terms like "water." It cannot handle the Twin Earth intuition without implicitly relying on the actual properties of the stuff *in the scenario world*, which is empirical information not available purely conceptually. The layered model either fails to account for Kripkean rigidity or achieves it only by sacrificing the epistemic purity of the PI.
  *   **The Machinery Fails:** The layered model doesn't provide *new* explanatory work; it merely relocates the problematic rigidity mechanism *inside* the component (PI) that was supposed to be free of such commitments. It hides the mystery (how does language hook onto the world with necessity?) in a new, more complex box (the substrate) without resolving it. The explanatory burden of the a posteriori necessity – the gap between concept and rigid designator – is obscured rather than illuminated.

  **Conclusion: Survival Requires Simplicity, Not Splitting**

  Two-dimensional semantics *can* survive as a valuable tool for modeling epistemic possibilities and conceptual roles *if it relinquishes the claim that the primary intension provides a complete, purely conceptual, *and* world-anchoring reference-fixing mechanism for natural kinds.** It can be a powerful map of how we *think* about meaning from the armchair. However, your proposed surface/substrate split within the PI is an attempt to have it both ways: preserve pure armchair access *while* embedding the Kripkean rigidity required for metaphysical necessity. **This attempt is self-defeating.** It fatally blurs the PI/SI distinction, smuggles in empirical commitments disguised as conceptual ones, and ultimately replicates the direct reference mechanisms it sought to avoid. The mystery isn't solved; it's merely compartmentalized within a layer that cannot bear its weight. The survival of 2DS as a distinct project requires accepting that the primary intension captures epistemic or contextual roles, but *not* the mechanism of rigid designation – that belongs firmly to the secondary dimension, anchored by the actual world we discover empirically. Your insightful critique exposes the fault line where the epistemic ambitions of 2DS buckle under the metaphysical weight of Kripke's revolution.
