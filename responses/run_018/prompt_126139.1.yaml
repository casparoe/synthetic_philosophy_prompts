  I'm taking a philosophy of language course and was trying to wrap my head around two-dimentional semantics after our lecture on necessary a posteriori truths. My prof sketched Kaplan's framework with primary and secondary intensions, then mentioned how Chalmers uses it to say water is H2O is necessary but not a priori. But I keep thinking about this layered idea I came up with—what if the primary intension itself splits into a surface layer (what you can check from the armchair without leaving your desk) and a substrate layer (what fixes reference across worlds but still operates pre-empirically)? It feels like the substrate is doing all the heavy lifting for Kripkean cases, yet it smuggles in metaphysical commitments that are just as mysterious as direct reference.

  So write an essay on whether this layered version saves two-dimensionalism or collapses it into a disguised direct-reference view. Weigh the arguments properly and reach a real verdict—does 2D semantics survive only if we drop the surface/substrate split, or is the split essential but self-defeating? Don't end non-committally; I actually want to know if the machinery is doing real explanatory work or just hiding the mystery in a new box. And please don't just list readings—I'm working without library access right now.
