  The third intermediate thesis about no principled line between perception and hallucination touches on philosophy of mind. If hallucinations use the same mechanisms as normal perception, where do we draw the line? This could challenge notions of direct realism but doesn't necessarily deny veridicality altogether. The user seems to suspect this is where the slogan starts doing rhetorical work.

