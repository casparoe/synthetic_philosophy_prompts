  Okay, let me unpack this user's question about Gödel's rotating universe. They're struggling with how closed timelike curves (CTCs) lead to the conclusion that time lacks an objective direction. The key confusion seems to be bridging the gap between the mathematical model and the philosophical implication.

  First, I recall Gödel's 1949 paper isn't just about weird physics - it's a deliberate challenge to Einstein's view of time. The user mentions their professor brought up "local temporal indexicals," which suggests they're already grappling with the local vs. global tension. 

  Hmm, the user's phrasing "hidden philosophical principle" is spot-on. There are actually two big assumptions here: one about global temporal order being necessary for objectivity, and another about the "reality" of time requiring no self-intersection. I should break these down separately.

  The causality violation point is interesting. The user intuitively senses meeting your past self isn't just "weird geometry" but fundamentally breaks something - that's their physics instincts kicking in. I should emphasize how Gödel exploits this: if you can hand your past self a notebook, you've created information without cause.

  I notice the user is in a philosophy of physics course. They might appreciate connecting this to broader debates - like how this argument targets the "block universe" view from relativity itself. The irony is delicious: using Einstein's equations against the notion of objective time!

  The local/global distinction is crucial here. Each observer still has their proper time ticking forward locally (that's the "private now" the professor mentioned), but globally the temporal relationships become non-transitive. Like if Alice sees Bob before herself, Bob sees Charlie before himself, but Charlie sees Alice before himself - it's temporally circular. That's why "before" stops making absolute sense.

  For the "does this happen" question: Gödel was absolutely clear this is a theoretical possibility within general relativity, not a description of our universe. He even calculated the required rotation rate (mind-bogglingly fast!) just to show it's not ruled out mathematically.

  What the user might be missing is Gödel's Platonist leanings. For him, if a coherent mathematical model allows time travel, and time travel undermines temporal becoming, then becoming must be illusory - because math reveals fundamental truths. That's the philosophical leap. Not everyone buys it, of course, but that's his reasoning.

