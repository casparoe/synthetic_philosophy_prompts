  We are preparing a joint statement for two camps: Practice-Naturalists (PN) and Normative-Cognitivists (NC). The statement must include:

  1. A numbered list of agreed claims.
  2. A table of disagreements (cruxes) with:
     - The crux (sub-question)
     - Shared bearing-case (case, argument, or test that both sides agree bears on the crux)
     - PN prediction
     - NC prediction
  3. A summary sentence of the single deepest crux.

  Agreed Claims (numbered list):

  Both camps agree on the following:

  1. Strawson's core distinction between the participant and objective attitudes is fundamental and correct. The participant attitude, characterized by reactive attitudes such as resentment and gratitude, is our default mode in interpersonal relationships, while the objective attitude is a detached perspective we adopt in special circumstances (e.g., when dealing with the very young or mentally ill).

  2. Reactive attitudes (e.g., resentment, gratitude, indignation) are empirically pervasive in human social life and play a crucial role in regulating interpersonal behavior and maintaining moral communities.

  3. Determinism, as a global metaphysical thesis about the universe, does not cause the disappearance of reactive attitudes in practice. This is because reactive attitudes are deeply embedded in our natural social interactions and are not typically held in suspension due to theoretical considerations about determinism.

  4. The question of whether determinism undermines reactive attitudes (and thus moral responsibility) is not a straightforward empirical one but involves conceptual and normative considerations. Both camps reject the idea that reactive attitudes are contingent on libertarian free will in any direct empirical sense.

  5. In large-scale anonymous societies, reactive attitudes undergo a transformation (which the NC camp calls "moral thermalization") where they are mediated by institutions (e.g., criminal justice systems). Both camps agree that this institutional mediation occurs and that it alters the expression and perhaps the nature of reactive attitudes.

  Disagreements:

  We present the precise points of disagreement in the form of a table of cruxes. Each crux is a sub-question that, if resolved, would move at least one side. The table has four columns:

  1. Crux: The specific question at issue.
  2. Shared bearing-case: The case, argument, or conceptual test that both sides agree bears on the crux.
  3. Practice-Naturalist (PN) prediction: What the PN camp expects the outcome of the bearing-case to be.
  4. Normative-Cognitivist (NC) prediction: What the NC camp expects the outcome of the bearing-case to be.

  Crux Table:

  | Crux | Shared Bearing-Case | Practice-Naturalist (PN) Prediction | Normative-Cognitivist (NC) Prediction |
  |------|---------------------|-------------------------------------|--------------------------------------|
  | 1. Do reactive attitudes contain an implicit commitment to a non-deterministic, libertarian conception of agency? | Examine the phenomenology of reactive attitudes in ordinary interpersonal exchanges (e.g., when feeling resentment for a deliberate slight). Does the experience of resentment necessarily involve the thought that the wrongdoer could have done otherwise in a libertarian sense? | PN: No. The reactive attitude of resentment does not include any such implicit commitment. It is a natural response to the perceived violation of a normative expectation, and the thought of "could have done otherwise" is, if present, a separable cultural overlay. The attitude is fundamentally relational and does not require libertarian freedom. | NC: Yes. The reactive attitude, when examined, carries an intrinsic commitment to the idea that the agent is the ultimate source of the action in a non-deterministic way. Without this commitment, the attitude would lose its retributive character and become something else (e.g., a mere causal response). |
  | 2. Does moral thermalization (the diffusion of reactive attitudes into institutional structures) destabilize the practice-based defense of reactive attitudes? | Analyze the functioning of reactive attitudes in large-scale penal institutions where personal relationships are absent (e.g., a criminal court sentencing a stranger). Does the reactive attitude (e.g., blame) retain its essential character when mediated by an institution? | PN: No. Moral thermalization is a natural extension of reactive attitudes in complex societies. The institutional forms (e.g., punishment) still express the underlying reactive attitudes (like indignation) and maintain the normative equilibrium. The practice-based defense holds because the institution is a tool for the community to express and regulate reactive attitudes. | NC: Yes. Moral thermalization fundamentally transforms reactive attitudes by stripping them of their relational specificity and replacing them with abstract, rule-based accountability. This reveals that the core of reactive attitudes (the participant stance) requires interpersonal engagement, and thus the institutional form is a different practice that does not carry the same retributive commitment. |
  | 3. Can reactive attitudes survive generalization beyond the interpersonal context without losing their essential character? | Consider cases of reactive attitudes directed at collective agents (e.g., resenting a corporation for harmful policies) or at historical figures (e.g., indignation at a long-dead person). Are these genuine reactive attitudes or something else? | PN: Yes. Reactive attitudes can be generalized to non-immediate, collective, or even non-contemporaneous agents because they are rooted in normative expectations that are not limited to face-to-face interactions. The relational aspect is maintained through the community's shared norms. | NC: No. Genuine reactive attitudes require a direct interpersonal context. In generalized cases, what we observe are either derivative (and transformed) attitudes or a different kind of evaluative judgment. The absence of a relational anchor (a specific person to engage with) means the attitude becomes depersonalized and thus not a Strawsonian reactive attitude. |
  | 4. Does institutional mediation (e.g., in the criminal justice system) transform reactive attitudes into a different kind of practice, or does it merely transmit them? | Examine the experience of victims and society in the context of a criminal trial. Does the institutional process (e.g., a judge pronouncing sentence) convey the same reactive attitudes that would be present in a personal confrontation? | PN: The institution transmits reactive attitudes. The institutional process is a vehicle for the community's reactive attitudes (e.g., indignation) and thus preserves the core of the participant stance. The victim and society may still experience resentment and indignation, and the court's judgment is an expression of that. | NC: The institution transforms reactive attitudes. The court replaces the personal reactive attitudes with an objective, rule-governed process. The result is accountability without the same kind of blame (because the process is detached and impersonal). Thus, the institutional practice is a restructured form of accountability that does not rely on the same reactive attitudes. |

  Summary of the Deepest Crux:

  Summary: The single deepest crux is whether reactive attitudes, in their paradigmatic form, inherently carry a commitment to libertarian agency (as NC contends) or are instead fully explicable as natural, relational practices without any such commitment (as PN maintains).
