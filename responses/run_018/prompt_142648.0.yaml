  ### Joint Statement on Reactive Attitudes and Moral Responsibility: A Convergence of Practice-Naturalist and Normative-Cognitivist Perspectives  

  #### 1. Agreed Claims  
  Both camps jointly endorse the following propositions, grounded in a shared interpretation of P. F. Strawson’s *Freedom and Resentment* and empirical observations of human moral psychology:  

  1. **Strawson’s Core Distinction**: The participant attitude (characterized by reactive attitudes like resentment, gratitude, and indignation) and the objective attitude (a detached, explanatory perspective) are ineliminable, distinct modes of human engagement. Shifting between them is context-dependent (e.g., excusing conditions like insanity), not metaphysically mandated.  
  2. **Empirical Pervasiveness**: Reactive attitudes are ubiquitous, biologically and culturally embedded features of human sociality. They regulate interpersonal relationships through expectations of goodwill and reciprocity, irrespective of theoretical beliefs about determinism.  
  3. **Determinism’s Inertia**: Global determinism does not—and could not—cause the empirical disappearance of reactive attitudes. Their persistence is attested by everyday experience, historical continuity, and cross-cultural evidence.  
  4. **Category Immunity**: Questions of whether determinism "undermines" reactive attitudes are category errors when framed as direct empirical challenges. Analogously, temperature remains a valid macroscopic concept despite microscopic determinism in statistical mechanics.  
  5. **Moral Thermalization**: In large-scale societies, reactive attitudes undergo institutional diffusion (e.g., courts, bureaucracies), decoupling blame and praise from immediate interpersonal contexts. This process alters their expression but does not extinguish their functional role.  
  6. **Penal Institutions**: In impersonal penal systems (e.g., criminal sentencing), reactive attitudes are mediated institutionally rather than eliminated. Both camps reject the notion that such systems operate purely objectively; they retain normative dimensions rooted in community expectations.  

  #### 2. Disagreements: Cruxes and Predictions  
  The table below delineates unresolved disagreements. Each crux is a sub-question whose resolution would shift at least one camp’s position. For each, we specify:  
  - **Crux**: The precise conceptual or empirical point of contention.  
  - **Shared Bearing-Case**: A mutually accepted scenario, argument, or test for adjudicating the crux.  
  - **Predictions**: Each camp’s forecast of the bearing-case outcome, stated in their own terms.  

  | Crux | Shared Bearing-Case | Practice-Naturalist (PN) Prediction | Normative-Cognitivist (NC) Prediction |  
  |------|---------------------|-------------------------------------|---------------------------------------|  
  | **1. Do paradigmatic reactive attitudes contain an implicit commitment to libertarian agency?** | *Phenomenological analysis*: Examine if resentment, in a paradigmatic case (e.g., betrayal by a friend), necessarily involves the judgment that the wrongdoer “could have done otherwise” in a non-causal, ultimate-source sense. | PN: **No**. Reactive attitudes are non-cognitive, biologically grounded practices. The “could have done otherwise” intuition is a post hoc rationalization, not intrinsic to the attitude. Resentment arises from violated relational expectations, not metaphysical commitments. | NC: **Yes**. Reactive attitudes are intrinsically cognitive-evaluative. Resentment entails a commitment to non-deterministic agency; without it, the attitude collapses into mere disappointment or causal appraisal, losing its retributive force. |  
  | **2. Does moral thermalization destabilize Strawson’s practice-based defense of moral responsibility?** | *Institutional penal case*: Analyze accountability in a large-scale prison system where offenders and victims are anonymous (e.g., state-imposed sentencing for property crime). Does the institutional process preserve the participant attitude’s core relational structure? | PN: **No thermalization threat**. Institutions transmit reactive attitudes by codifying communal norms. The prison system enforces relational expectations (e.g., “repayment” for harm), sustaining moral responsibility without libertarian foundations. Thermalization is an adaptive extension of practices. | NC: **Thermalization is destabilizing**. Institutions transform reactive attitudes into detached accountability practices (e.g., risk assessment). The absence of interpersonal engagement reveals retributive attitudes as unjustified; responsibility must be restructured into blame-free respect (e.g., rehabilitation-focused systems). |  
  | **3. Are reactive attitudes essentially relational, or can they survive generalization to impersonal contexts?** | *Generalized resentment test*: Evaluate attitudes toward corporate entities (e.g., public indignation at a polluting corporation with no identifiable agent). Is this structurally continuous with interpersonal resentment? | PN: **Relational generalization succeeds**. Reactive attitudes extend to collective agents via proxy relationships (e.g., viewing the corporation as a “bad actor”). The attitude remains intact, reflecting evolved norm-enforcement mechanisms scaled to complex societies. | NC: **Generalization transforms attitudes**. Impersonal targets elicit proxy judgments, not core reactive attitudes. Indignation toward corporations is a cognitive evaluation decoupled from Strawsonian participation; it confirms thermalization’s erosion of the relational anchor. |  
  | **4. Does institutional mediation transmit or transform reactive attitudes?** | *Victim-offender mediation contrast*: Compare court sentencing (impersonal) and restorative justice dialogues (interpersonal) for the same crime. Do both equally express reactive attitudes? | PN: **Transmission occurs**. Both contexts express reactive attitudes: courts institutionalize communal indignation, while dialogues channel personal resentment. The core practice—enforcing norms—is preserved across contexts. | NC: **Transformation occurs**. Restorative justice preserves the participant attitude through direct engagement; courts replace it with objective procedures. The latter’s focus on deterrence or risk management confirms the shift to non-retributive accountability. |  

  #### Summary:  
  The single deepest crux separating the two camps is whether reactive attitudes, in their paradigmatic interpersonal form, inherently presuppose a commitment to non-deterministic agency as a condition of their justification.
