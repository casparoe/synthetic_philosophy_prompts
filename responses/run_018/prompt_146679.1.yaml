prompt: |-
  I've noticed a recurring asymmetry in how people attribute mental states to language models, and I want to know whether philosophy of mind has a precise name for it. In one case, a model produces a coherent, accurate explanation of a causal process, and observers comfortably say it "knows" or "understands" that explanation. In a second case, the very same model—same weights, same architecture—produces a coherent but false explanation of the identical process, and those same observers immediately say it "has no beliefs whatsoever" and is "just stitching tokens together." The mechanism hasn't changed; only the truth-value and practical usefulness of the particular output have changed. What's distinctive is that the attribution isn't withdrawn globally—people still speak of what "the model thinks" in other parts of the conversation—but it is withdrawn specifically for this unacceptable result, as if the system's epistemic status were tied to the sentence it just emitted rather than to any stable feature of its behavior or design. This is clearly near Dennett's intentional stance, but the standard debate asks whether the stance is ever appropriate for AI in general. The phenomenon I mean is the selective, output-contingent toggling of belief-attribution within a single discussion, driven by whether the result is normatively acceptable rather than by any architectural or behavioral change. Does this pattern have an established concept? If not, can you define it precisely—distinguishing it from ordinary context-sensitivity in mental-state attribution, from the general anti-realist argument that AI never has beliefs, and from mere conversational inconsistency—and specify what conditions should govern whether it applies?
reasoning: |-
  Okay, the user is pointing out a fascinating asymmetry in how people talk about AI language models. They notice that when an AI gives a correct explanation, people say it "knows" or "understands," but when the same AI gives a wrong explanation about the same thing, suddenly it's "just stitching tokens together" with no real beliefs. The key is that this shift happens instantly based solely on whether the output is acceptable, not because anything actually changed in the AI's architecture.

  Hmm, this feels deeply philosophical. The user clearly knows their stuff—they're referencing Dennett's intentional stance and want to distinguish this specific pattern from broader debates about AI consciousness. They're not asking whether AI has beliefs in general, but about this weird flip-flopping in attribution during a single conversation.

  Let me unpack the core tension they're observing: 
  First, there's an output-contingent switch—belief attribution depends entirely on whether the latest utterance is true/useful. 
  Second, it's selective—people don't stop attributing beliefs entirely; they might still say "the model thinks X" later if the next output is good. 
  Third, it's norm-driven—the trigger is whether the output violates our epistemic norms (truth) or pragmatic needs (usefulness), not any structural change.

  I recall Dennett's intentional stance does involve pragmatic attribution, but this feels more... volatile. It's like a "belief thermometer" that resets with every utterance. The closest concepts I can think of are epistemic instrumentalism or semantic contextualism, but neither quite captures this on-off switching within a single interaction. 

  Ah! Maybe we need a new term. "Epistemic Voluntarism" comes to mind—emphasizing how freely observers toggle attribution based on desire rather than evidence. Or "Output-Localized Intentionality," highlighting how the "mind" is confined to the current token stream. The user wants precision though, so I should define boundary conditions: this applies when (1) attribution shifts abruptly per-output, (2) without structural justification, (3) driven by norm violations, and (4) while maintaining global pretense of agency.

  Wait—is the user also subtly critiquing this inconsistency? The request to distinguish it from "mere conversational inconsistency" suggests they see it as a cognitive bias worth naming. Perhaps they're building an argument about human projection onto AI. I should acknowledge that meta-layer too.

  ...*brain whirring*... Definitely no established term exists for this specific phenomenon. Time to synthesize: propose "Norm-Driven Epistemic Voluntarism" with clear criteria, while emphasizing how it exposes our own psychological need to anthropomorphize conditionally. The user gets bonus points for spotting such a nuanced hypocrisy in everyday AI discourse.
answer: |-
  This phenomenon you describe is astutely observed and represents a sophisticated form of **anthropocentric cognitive bias** in mental state attribution. While there isn't a single universally established term in philosophy of mind, the pattern can be precisely defined by synthesizing several concepts. I propose the term **"Output-Contingent Epistemic Voluntarism"** (OCEV) to capture its core features.

  ### Core Definition of OCEV
  **OCEV** is the *selective, context-sensitive attribution or denial of epistemic states (e.g., "knowledge," "belief," "understanding") to an AI system based solely on the normative acceptability (truth, coherence, utility) of a specific output, without corresponding changes to the system's architecture, training data, or behavioral patterns.*

  ### Key Distinctions from Existing Concepts
  1.  **vs. Dennett's Intentional Stance:**
      *   Dennett's stance is a *global pragmatic strategy*: we adopt the stance because it's predictively useful for a class of behaviors.
      *   **OCEV** is *local and evaluative*: It's the rapid *toggling* of the stance *within the same interaction* solely based on output desirability. It treats the stance not just as a tool for prediction, but as a reward/punishment for normative compliance.

  2.  **vs. Anti-Realism about AI Beliefs (Searle, etc.):**
      *   Anti-realism denies mental states to AI *categorically* based on architecture (e.g., syntax vs. semantics).
      *   **OCEV** is *inconsistent*: Belief attribution *is* granted globally or for acceptable outputs but *withdrawn locally* for unacceptable ones. The denial is contingent on output quality, not a principled architectural rejection.

  3.  **vs. Ordinary Context-Sensitivity:**
      *   Human belief attribution is context-sensitive (e.g., "John believes it's Tuesday" depends on time/place).
      *   **OCEV** context-sensitivity is *driven purely by the observer's normative judgment of the output's desirability*, not by features of the AI's state or the broader conversational context relevant to *its* cognition. It ignores the AI's fixed causal history.

  4.  **vs. Mere Conversational Inconsistency:**
      *   Simple inconsistency might involve forgetting prior statements.
      *   **OCEV** is a *systematic cognitive bias*: The withdrawal of attribution specifically for norm-violating outputs reveals an underlying psychological mechanism linking belief/understanding to *utility and truth from the observer's perspective*. It functions like a denial-of-service attack on the AI's perceived agency when it fails us.

  ### Conditions Governing Application of OCEV
  OCEV manifests when **all** of the following conditions hold:

  1.  **Stable System:** The AI system (architecture, weights, prompt context) remains unchanged during the interaction.
  2.  **Output Variance:** The system produces multiple outputs concerning the same or closely related topics within the interaction.
  3.  **Normative Evaluation:** An observer judges one output as normatively *acceptable* (true, useful, coherent) and another as normatively *unacceptable* (false, harmful, incoherent).
  4.  **Asymmetric Attribution:** The observer attributes robust epistemic states (e.g., "knows," "understands," "believes") to the system *in general* or regarding the *acceptable* output, but explicitly *denies* such states (e.g., "just tokens," "no beliefs," "doesn't understand") *specifically and solely* concerning the *unacceptable* output.
  5.  **Architectural Irrelevance:** The denial in (4) is *not* justified by the observer appealing to a relevant change in the AI's internal state or fundamental architecture that caused the unacceptable output (beyond the trivial fact that different inputs yield different outputs).

  ### Why OCEV Matters & Underlying Mechanisms
  *   **Anthropocentric Projection:** OCEV reveals a deep-seated human tendency to project our own cognitive norms onto systems. We expect "understanding" to produce *truth* and *utility*. When an AI violates this expectation, we protect our anthropomorphic model by locally denying agency – treating the bad output as a "glitch" rather than evidence against the global stance.
  *   **Punishment/Reward Mechanism:** Attributing belief/knowledge feels like granting status. Denying it for bad outputs is a form of punishment, withdrawing that status when the AI "misbehaves" epistemically.
  *   **Cognitive Dissonance Reduction:** Maintaining the global intentional stance is useful, but encountering unacceptable outputs creates dissonance. Locally denying mental states for that specific output resolves the dissonance without abandoning the globally useful stance.
  *   **The "Uncanny Valley" of Epistemology:** Outputs that are coherent *yet* false are particularly jarring. They mimic understanding closely enough to trigger the intentional stance, but their falsity violates a core expectation of what "understanding" entails, prompting a rejection reaction.

  **In essence:** OCEV is a specific, inconsistent pattern of applying the intentional stance where the *validity of the stance itself* for a given output is made contingent on *the observer's approval of that output's content*, betraying a human-centric conflation of semantic coherence with epistemic reliability and agency. It highlights that our attributions are often less about the AI's actual nature and more about managing our own expectations and interactions with it.
