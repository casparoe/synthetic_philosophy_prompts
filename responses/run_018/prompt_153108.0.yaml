prompt: |-
  I've been arguing with friends about long-term risk and charitable giving, and I keep noticing a peculiar asymmetry that I can't place in the literature. In one conversation, someone insists that we should redirect almost all resources to prevent an existential risk with a 0.1 per cent probability, because the expected value dwarfs everything else; in another, the same person treats a medical intervention with an identical probability-weighted benefit as barely worth mentioning, saying we shouldn't let tail risks dominate practical decisions. The shift doesn't seem to come from any explicit change in decision theory — they still claim to accept the same utility calculus — but from whether the scenario is narrated as civilisation-scale or everyday. I'm taking a course on normative decision theory, and this looks like it might be adjacent to expected-value fanaticism, yet it isn't quite that: the issue isn't that people always chase enormous pay-offs, but that they apply the fanaticism selectively depending on the framing domain, without noticing the inconsistency.

  Is there an established name for this kind of frame-contingent, selective deployment of extreme expected-value reasoning — where the same individual treats a low-probability, high-magnitude outcome as overwhelming in one context and negligible in another, despite endorsing a uniform calculus? If not, can you define the phenomenon precisely, distinguish it from ordinary scope neglect and from standard expected-value fanaticism itself, and say where its edges lie — for instance, whether it requires explicit endorsement of expected utility theory, or whether it can occur in people who reject formal decision theory altogether? Please lead with your bottom line in the first sentence, then give the reasoning, with no preamble and no restating of the question.
reasoning: |-
  Alright, the user is describing an inconsistency in how people apply expected value reasoning. They notice that in discussions about existential risks, their friend emphasizes the importance of acting on low-probability, high-impact events, but dismisses similar probability-weighted benefits in everyday contexts like medical interventions. The user is taking a course on normative decision theory and wants to know if there's a name for this selective application.

  First, I need to recall if there's an established term for this phenomenon. I remember scope neglect, where people don't adequately scale their responses to the size of the problem, but that's not exactly it. Scope neglect is about underestimating large numbers, not inconsistent application across contexts. Then there's expected-value fanaticism, which prioritizes maximizing expected value regardless of probability, but the user says it's not that because the person applies it selectively.

  The key here is the framing domain: civilization-scale vs. everyday scenarios. The same person uses expected value in one context but ignores it in another. This sounds like a framing effect, but more specific. Maybe it's related to psychological distance. Abstract, large-scale events might feel different from concrete, immediate ones. 

  The user mentions that the inconsistency isn't due to a change in decision theory but the narrative framing. So, perhaps it's a cognitive bias where the scale of the scenario affects how probabilities are weighted. In existential risks, the sheer magnitude might overwhelm, making the probability seem more significant, while in medical contexts, the low probability is dismissed as negligible. 

  I should differentiate this from scope neglect. Scope neglect is about the inability to perceive differences in scale, like not valuing saving 2000 lives twice as much as 1000. Here, the issue is the inconsistent application of expected value calculations based on the domain. Also, distinguishing from fanaticism, which is consistently applying expected value to extreme outcomes.

  The user also asks if this requires endorsing expected utility theory. Probably not, as the bias might occur even without formal theory, due to intuitive judgments. People might not realize their inconsistency because the framing triggers different cognitive processes. For example, existential risks might evoke emotional responses or a sense of duty, while medical decisions feel more personal and immediate, leading to different risk assessments.

  I think this phenomenon is a form of domain-specific sensitivity to probability weighting. It's a context-dependent application of decision heuristics. Since there isn't a widely recognized term, coining one like "domain-contingent fanaticism" or "selective expected-value weighting" might be necessary. The edges of this phenomenon lie in whether the scenario is perceived as abstract/distant vs. concrete/immediate, affecting how probabilities are evaluated.
answer: |-
  **Bottom line:** There is no universally established single term for this specific frame-contingent selective deployment of extreme expected-value reasoning, but it can be precisely characterized as **Domain-Contingent Probability Weighting Asymmetry** or **Framing-Induced Expected Value Hypocrisy**, arising from psychological distance and cognitive biases distinct from scope neglect or pure expected-value fanaticism.

  **Reasoning:**

  1.  **Defining the Phenomenon:** This is the inconsistent application of expected value calculations based solely on the framing domain (e.g., abstract/civilization-scale vs. concrete/everyday), despite endorsing the same underlying utility calculus. An individual assigns overwhelming weight to low-probability, high-magnitude outcomes in distant, abstract domains (e.g., existential risk) but treats objectively identical probability-weighted benefits in familiar, concrete domains (e.g., medical intervention) as negligible. The inconsistency stems from contextual framing, not a coherent change in risk aversion or utility function.

  2.  **Distinguishing from Scope Neglect:**
      *   **Scope neglect** is the failure to scale valuation proportionally with the *magnitude* of an outcome (e.g., valuing saving 2,000 lives only marginally more than saving 200 lives). The core issue here isn't undervaluing large magnitudes *per se*.
      *   This phenomenon involves inconsistent *probability weighting* across domains *despite* scope sensitivity *within* the abstract domain (e.g., recognizing that 0.1% risk of extinction dwarfs other things). The problem is the *selective dismissal* of the same probability-weighting logic in the concrete domain.

  3.  **Distinguishing from Expected-Value Fanaticism:**
      *   **Pure expected-value fanaticism** is the *consistent* belief that any non-zero probability of an infinite (or sufficiently vast) payoff dominates all finite considerations, regardless of context.
      *   Here, the individual exhibits fanaticism *only selectively* in the abstract domain. They *reject* fanaticism in the concrete domain ("shouldn't let tail risks dominate practical decisions"), creating a fundamental inconsistency. It's not fanaticism itself, but the *domain-driven selective application or suspension* of fanatical reasoning that defines the phenomenon.

  4.  **Edges and Underlying Mechanisms:**
      *   **Psychological Distance:** Abstract/civilization-scale scenarios are typically high in temporal, spatial, social, and hypothetical distance. This distance reduces affective response and concrete representation, making intuitive probability assessments difficult and amplifying reliance on analytical (but selectively applied) "expected value" rhetoric. Concrete scenarios feel proximate, triggering intuitive heuristics that underweight small probabilities.
      *   **Affective vs. Deliberative Processing:** Concrete scenarios engage affect-rich, intuitive System 1 thinking, which notoriously underweights small probabilities. Abstract scenarios engage more deliberative System 2 thinking, where expected value calculations feel more appropriate, yet this deliberation is applied inconsistently.
      *   **Motivated Reasoning/Narrative Salience:** Civilization-scale threats can carry significant narrative weight, moral gravity, or identity relevance, motivating the acceptance of extreme calculations to justify strong action. Everyday medical risks lack this compelling narrative frame.
      *   **Requirement of Endorsing EU Theory? No.** While explicit endorsement of expected utility (EU) theory makes the inconsistency stark and theoretically indefensible, the phenomenon can occur in individuals who reject formal EU. It manifests as an *intuitive* inconsistency: they intuitively grasp and deploy the logic of "tiny chance times huge impact = important" in one context but intuitively dismiss the *identical* probabilistic logic in another context due to framing. The core is the inconsistent *intuitive weighting* of probability*outcome across domains, regardless of formal theory acceptance. The person arguing about existential risk is likely *using* formal-sounding EU language, but the underlying cognitive bias driving the selectivity operates at an intuitive level accessible to anyone.
