prompt: |-
  hey so im advising a small grant board that can fund like three philosophers and social theorists for about three years on collective memory versus the historical record — specifically those messy cases where a community's living memory and the archives flatly contradict each other, and someone has to decide which gives way.

  before i draft the call for proposals i want to sort out which conceptual problems actually deserve the money. so: what do you think are the main open questions in this space right now, and which three should we priorites? rank them and defend the ordering — i don't just want 'unresolved,' i want to know why cracking one unblocks the others, how tractable each is for people without archival-science training, and what kind of result over the next couple years would make you bump one up or down.

  to keep it from being generic, i'm framing everything around two niche ideas: 'mnemonic sovereignty,' the claim that a group has authority over its own past that is indepandant of factual accuracy, and 'archival gaslighting,' where the record-keeping was engineered to manufacture the conflict rather than accidentally preserve it. don't just name-check these — work with them. for instance, can mnemonic sovereignty be defended without collapsing into pure relativism? is archival gaslighting conceptually distinct from ordinary selection bias? and there's the practical layer: if you're a museum curator or school-board member, which conceptual mistake actually causes harm?

  include one worked scenario: an indigenous community's oral origin narrative conflicts with carbon-dated archaeological evidence, and the local archive was assembled by colonial administrators. apply your ranking here — which solved problem actually changes what the curator or board should do?

  no bibliography, no 'see smith 2018' — this has to be usable for someone without web access. be honest about where your ranking depends on value judgments that can't be turned into a checklist. and flag the lines of inquiry that sound exciting but are overrated for this funder's specific goal of helping institutions handle memory-record conflicts better.
