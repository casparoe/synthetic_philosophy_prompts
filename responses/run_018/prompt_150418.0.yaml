answer: |-
  Your conceptual problem is fascinating—it exposes a fundamental tension in aesthetic ontology that standard forgery theories struggle to accommodate. Let's dissect this using your framework of **causal provenance** (value from the authentic creator's mind/hand) versus **negative provenance** (value from the *gap* between attributed and actual authorship). I'll address Goodman, intentionality, and the fate of the exposed forgery, then identify vulnerabilities.

  ### 1. **Goodman's Autographic/Allographic Distinction & Its Limits**
     - **Autographic Arts** (e.g., painting): The work's identity is tied to its physical history. A forged Van Gogh isn't a "Van Gogh" because it lacks the right causal chain.
     - **Allographic Arts** (e.g., literature): The work is defined by its *structure* (syntax, sequence). Any token that complies with the notated structure is an instance of the work. *Hamlet* is *Hamlet* regardless of whether it's printed in 1603 or 2023.
     - **The Problem for Your Forger**: Literature is classically allographic—so if the forged text structurally matches what an authentic "lost modernist work" *would* be, it should be functionally identical post-discovery. But your "performative forgery" subverts this:  
       - The **hidden intentionality** (the forger's design to deceive) is an *autographic element* smuggled into an allographic art form. The work’s meaning depends on its *actual* history of production (a deliberate hoax), not just its syntactic structure.
       - **Goodman’s Blind Spot**: He assumes allographic works are "eternal types" indifferent to origin. Your forgeries are **historically infected artifacts**: their semantic content includes the *performance* of misattribution. The text is a "speech act" of deception, making its material history aesthetically constitutive.

  ### 2. **The Exposed Forgery: Collapse or Metamorphosis?**
     Your performative forgery doesn’t become a "mere duplicate" upon exposure because **negative provenance generates irreducible meaning**:
     - **Pre-Exposure**: The work functions as intended—a "modernist masterpiece." Its "unreliable narration" is the *attribution itself*, creating a hermeneutic loop where the reader's belief in its authenticity shapes interpretation.
     - **Post-Exposure**: The revelation doesn’t erase meaning; it *transforms* it. The work becomes:
       - A **palimpsest of authorship**: The text now reads as a *critique* of modernist myth-making, exposing how attribution shapes reception. The gap between "supposed author" (e.g., a reclusive Woolf contemporary) and "actual author" (your forger) becomes the work's core subject.
       - A **parasite with agency**: Unlike a passive copy, it actively *thematizes* its own fraudulence. Its value shifts from "great modernist work" to "brilliant forensic artwork about modernism’s cult of authorship."
       - **Aesthetic Durability**: The intentional structure *requires* exposure to complete itself—like a mystery novel demanding a solution. The "true authorship" isn’t an external fact; it’s the keystone of the work’s conceptual architecture.

  ### 3. **Causal vs. Negative Provenance: The Tension**
     - **Causal Provenance** (market/romantic view): The artifact’s worth derives from contact with the "genius" (e.g., Kafka’s handwritten draft).
     - **Negative Provenance** (your innovation): Worth derives from the *tension* between the attributed author’s perceived genius and the forger’s subversive ingenuity. This gap is:
       - **Structurally Necessary**: The forgery’s "modernist" ambiguities (e.g., fragmented narration) gain new coherence when read as *clues* to the forger’s game.
       - **Conceptually Distinct**: It’s neither "original" (no causal link to the attributed author) nor "copy" (it never *aimed* to be a mechanical replica). It’s a **simulacrum with critical intent**.

  ### 4. **What Would Change My Mind? Key Vulnerabilities**
     My position hinges on **hidden intentionality being aesthetically active post-exposure**. The following would undermine it:
     - **Empirical Disconfirmation**: If rigorous reader-response studies showed that post-exposure, the forgery *always* collapses into "just a text," with readers unable/unwilling to sustain the duality of meaning (e.g., "It’s just a fake—who cares?"), this suggests negative provenance is philosophically inert. Your forgeries might be mere curiosities.
     - **Radical Intentional Fallacy**: A convincing argument that *all* authorial intent (including the forger’s meta-commentary) is irrelevant once the text enters circulation. If meaning is solely generated by reader/community (à la Barthes' "Death of the Author" or Fish’s interpretive communities), the forgery’s "true" history becomes extraneous noise.
     - **Provenance as Market Fetish**: Evidence that all non-structural value (e.g., aura, authenticity) is *only* an auction-house construct with no aesthetic correlate. If a perfect duplicate (physical or digital) of *Ulysses* is indistinguishable from Joyce’s manuscript in every experiential way, causal provenance loses philosophical weight—and your negative provenance might follow.

  ### 5. **Where My Reasoning is Most Vulnerable**
     - **The "Empty Gesture" Critique**: If exposure turns the forgery into a mere *document* of the hoax (like Banksy’s self-shredding *Girl with Balloon*), does it retain *literary* value? Or does it become a conceptual art stunt, reducing the text to a prop? This risks conflating aesthetic and historical interest.
     - **Goodman’s Revenge**: If literature is *strictly* allographic, the exposed forgery *is* just a duplicate—one that accidentally resembles a critical artwork. Its "meaning" might be a contingent association, not an ontological property.
     - **Tautology Trap**: Arguing that the forgery’s meaning *depends* on negative provenance could be circular: "It’s valuable because it’s about forgery, and we know that because it was forged." This might not survive contact with works lacking inherent clues to their fraudulence.

  **Conclusion**: Your performative forgeries likely retain distinct aesthetic value post-exposure because **negative provenance is engineered into their semantic DNA**. They exploit literature’s allographic nature while hijacking autographic concerns (intentionality/history), creating a third category: **critical counterfeits**. Their worth isn’t drained; it’s *inverted*, transforming parasitic dependence into conceptual critique. This holds unless we reject authorial intent wholesale or reduce all value to syntactic structure. Your novel’s conceit brilliantly weaponizes this tension—the forger isn’t just copying modernism; they’re exposing its cult of authorship from within.
