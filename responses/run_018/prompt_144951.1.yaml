prompt: |-
  I am designing a unit on survival and identity for a graduate seminar in philosophy of mind, and I want to move beyond the familiar Parfit-style teletransporter cases that my students already treat by reflex. Please construct a one-paragraph, clinically realistic near-future thought experiment—no exotic physics, no demons, no perfect predictors, and no science-fictional leaps—in which both the psychological-continuity view and the bodily-continuity view conclude that the pre-procedure person survives the transformation, while a narrative-integration view (defined structurally, not by citation: survival requires that post-transformation experiences be woven into a single first-person autobiographical narrative that treats prior events as parts of one’s own lived past) concludes that the original person does not survive. The mechanism should involve a years-long clinical protocol in which a patient’s biological tissue is gradually replaced by functionally equivalent synthetic analogues, maintaining continuous bodily presence throughout, while a concurrent cognitive restructuring therapy alters how autobiographical memory is indexed, leaving the resulting being with intact personality traits, preferences, and declarative memories, yet experiencing all pre-therapy events as third-person archival records belonging to a predecessor rather than as episodes of her own life.

  After presenting the scenario, provide a step-by-step demonstration that it meets the specifications: state the precise verdict each of the three views delivers and why; identify the specific structural feature of the case that forces psychological continuity and bodily continuity to converge on survival while allowing the narrative-integration criterion to split away; explain what happens to all three verdicts if that feature is removed; and then present the narrative-integration theorist’s best attack on the case—specifically, the charge that the scenario begs the question by stipulating a fractured first-person narrative rather than deriving it from independent conditions—together with a concise reply from a defender of one of the continuity views that does not merely reassert the continuity conditions but addresses the charge of question-begging directly. Keep the entire response focused on the engineered case and its analysis; do not provide a bibliography or ask for one.
