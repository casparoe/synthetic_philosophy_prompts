  *   **No Preaching:** Presents the dilemma, the logical conclusion, and the intuitive refusal without advocating for a specific moral action or resolution. The tension remains open.
  *   **Refrains:** Your exact lines are used, circling back as required, and brought together forcefully in the final couplet.
  *   **Accessible Language:** Uses concrete imagery ("fingernails clawing the floor," "blinks," "a-choo!", "motes," "ribcage's drum") and avoids academic terms. The scale is evoked through "Three arrows stacked" and "vast, indifferent path."
