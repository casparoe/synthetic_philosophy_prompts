  The mismatch question is insightful. Japan shows how state bureaucracy can compartmentalize: archives as technical resource while education remains politicized. America's federalism creates another variant where local control enables curricular inconsistency despite federal archival access.

  For the final ranking, Germany's clear lead is uncontested. Japan vs American South is closer but Japan's centralized system edges ahead despite flaws. Turkey trails by significant margin across all metrics. User's original proposed ranking seems accurate - no need to adjust that.

