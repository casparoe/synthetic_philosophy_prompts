answer: |-
  Here’s a defended prioritization of conceptual questions for your 2-year deep dive, ranked by their upstream leverage and tractability for pure reasoning/modeling, with reasoning for the ranking:

  ### **Core Ranking & Reasoning**
  1. **The Meta-Problem: Is a Unified Phenomenal Scale Even Possible?**  
     *Why prioritize?*  
     This is the bedrock. If phenomenal states (pain, dread, etc.) cannot *in principle* be mapped onto a single ordinal scale (even partially), then concepts like "lexical threshold" or "aggregation" collapse *before* inter-modality comparisons begin. You must resolve whether "intensity" is a universal dimension or a category error.  
     *Tractability:* High for pure conceptual work. Analyze philosophical arguments (e.g., is "intensity" a primitive property or context-dependent?), structural constraints (can heterogeneous qualia share a mathematical ordering?), and implications of neural/computational diversity.  
     *Downstream impact:* If no unified scale exists, lexical-threshold NU is incoherent. If it exists, you proceed. **This gatekeeps everything.**

  2. **The Comparability Problem: Can Disparate Modalities Be Ranked *Without* a Unified Scale?**  
     *Why prioritize?*  
     Even if no unified *cardinal* scale exists, you might salvage ordinal comparability ("Is *this* AI's dread worse than *that* mammal's pain?"). This is essential for practical ethics—without it, NU lacks action-guiding power.  
     *Tractability:* Moderate. Requires formal modeling of partial orderings, decision theory under incomparability, and thought experiments testing moral intuitions across modalities. Focus on necessity/sufficiency conditions for comparability.  
     *Downstream impact:* If comparability fails, NU reduces to minimizing suffering *within* modalities only—a major concession. If partial comparability holds, lexical thresholds might apply *between* some modalities.

  3. **The Threshold Salvage Problem: Can Lexicality Survive Incommensurability?**  
     *Why prioritize?*  
     *Only after* addressing #1-2. If modalities are incommensurable but a unified scale exists (#1), lexicality might apply globally. If no unified scale (#1) but comparability holds (#2), lexicality could be modality-specific. If both fail, NU may need radical reformulation.  
     *Tractability:* Moderate. Explore "modality-specific thresholds" or "thresholds under uncertainty." Formalize risk-aversion toward incomparable harms.  
     *Downstream impact:* Determines if lexical NU can be patched or must be abandoned.  

  ### **Lower-Priority Questions (Deprioritize Unless Core Work Resolves Them)**
  - **Aggregation Mechanics:** *Downstream* of #1-2. If no unified scale/comparability, aggregation is dead.  
  - **Pleasure's Role:** Irrelevant if lexicality holds (pain trumps it). Focus only if thresholds fail.  
  - **Empirical Mappings:** Requires data/labs—excluded by your constraints.  

  ### **Direct Answers to Your Specifics**
  - **"Does a single scale come before inter-modality commensurability?"**  
    **Yes.** Without establishing whether a unified dimension of "intensity" exists, inter-modality comparisons lack a conceptual anchor. You can't compare currencies if you don't know if they're currencies.  

  - **"Is lexical-threshold salvageable if suffering can't be summed?"**  
    **Possibly, but weakened:**  
    - If *no unified scale but comparability holds*, implement **modality-specific lexical thresholds** (e.g., "avoid *any* pain above intensity X in biological minds" + "avoid *any* existential dread above severity Y in AIs").  
    - If *incomparability dominates*, lexicality applies only *within* modalities. Global NU then becomes "minimize worst-case suffering in any modality"—still stringent but less elegant.  
    - **Salvage path:** Frame lexicality as a **precautionary principle**: "If a state is *plausibly* among the worst conceivable in its modality, prioritize its avoidance." Survives uncertainty at the cost of precision.  

  ### **Why This Ranking?**
  - **Upstream First:** #1 dictates the universe of possible solutions. Spending years on #3 before resolving #1 risks wasted effort on impossible fixes.  
  - **Tractability:** #1-3 require only rigorous conceptual analysis and minimal formalism (e.g., order theory, decision matrices).  
  - **Practical Shift:** Resolving #1-2 determines whether NU demands minimizing a *known* worst suffering or navigating radical uncertainty. This changes prioritization in AI ethics, animal welfare, and crisis prevention.  
  - **Drop Pleasure/Aggregation:** If pain trumps pleasure lexically, pleasure is irrelevant. Aggregation is secondary to comparability.  

  **Conclusion:** Spend Year 1 attacking the **Meta-Problem** (unified scale?). Year 2 splits between **Comparability** and **Threshold Salvage**. If #1 fails, NU needs a new foundation; if #1-2 hold, lexical NU can adapt. The theory's fate hinges on the first question—everything else is refinement.
