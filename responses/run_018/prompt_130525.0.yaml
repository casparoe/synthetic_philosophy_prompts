  ## Chronic Context-Switching Fatigue (Sestina)

  The screen fractures, focus pulls apart,
  A name arrives to pin the fractured ache:
  The new diagnosis, sharp as glass – a **label**.
  It names the frantic scroll, the constant switch,
  This fractured focus, this exhausted **behaviour**.
  (It started somewhere in the latest **manual**).

  A section added in the latest **manual**
  Describes the strain of tasks that never part,
  The guilt for fragmented **behaviour**.
  Now those who felt vague guilt embrace the ache,
  They see their scattered focus, every switch,
  Confirming they’re the archetypal **patient**.

  They study, self-aware, the model **patient**,
  Their symptoms sharpened by the probing **manual**.
  They note each jolt, each mental gearbox **switch**,
  Each flinch becomes a proof beneath the **label**.
  Their measured rest feels like a subtle fake,
  Observing feeds the very **behaviour**.

  The diagnostic gaze reframes **behaviour**:
  The tracked time lost, the monitored **patient**.
  New facets shine – “notification dread”, “deep fake
  engagement” – logged within the **manual**.
  This sharpened lens reinforces the **label**,
  Each documented **loop** demands a **revision**.

  The committee meets, proposes **revision**:
  “Obsessive self-track *is* the **behaviour**.”
  It codifies the watchful, weary **patient**.
  The text expands within the weighty **manual**,
  Describing how the knowing feeds the ache,
  A self-fulfilling, tightening **loop**.

  The system spins within its rigid **loop**:
  Define the ill, refine through **revision**,
  Which amplifies the strain, the constant ache,
  Reframing coping as suspect **behaviour**,
  Trapped deeper by the evolving **manual**,
  Bound tighter to the role of **patient**.

  The **patient**, shaped by **label**, fuels **revision**.
  The **manual** tracks the **behaviour**’s sharpened ache.
  This **loop** tightens: knowledge *is* the fracture, the switch.
