   Stanza 1 (1,2,3,4,5,6):
     Line 1 ends with "hole"
     Line 2 ends with "points"
     Line 3 ends with "shift"
     Line 4 ends with "same"
     Line 5 ends with "fixed"
     Line 6 ends with "drag"

   Stanza 2 (6,1,5,2,4,3):
     Line 1 ends with "drag"
     Line 2 ends with "hole"
     Line 3 ends with "fixed"
     Line 4 ends with "points"
     Line 5 ends with "same"
     Line 6 ends with "shift"

   And so on.

   The envoi: three lines that include all six words. We can do two words per line.

   We want the envoi to land on the lesson: the two models (original and dragged) agree on every observable and invariant, but if we treat the points as real (substantivalism) then they differ, so we must give up either determinism or substantivalism.

   Let's start composing.
