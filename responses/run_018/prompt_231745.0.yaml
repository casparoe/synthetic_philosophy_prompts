  We are going to write a sestina that enacts the hole argument in general relativity.
   The six end-words: hole, points, shift, same, fixed, drag.
   We have six stanzas of six lines each, and an envoi of three lines (with a concluding half-line sometimes, but we can do three lines that contain all six words).
   The pattern of end-word rotation is fixed: 
     Stanza 1: 1,2,3,4,5,6
     Stanza 2: 6,1,5,2,4,3
     Stanza 3: 3,6,4,1,2,5
     Stanza 4: 5,3,2,6,1,4
     Stanza 5: 4,5,1,3,6,2
     Stanza 6: 2,4,6,5,3,1

   Then the envoi: three lines that contain all six words, typically two per line.

   The poem must be about the hole argument, which involves:
     - A region of spacetime (the "hole") where the stress-energy tensor vanishes (so the Einstein equations are just R_ij = 0).
     - We consider two metrics: one original (g) and one that is the image of g under a diffeomorphism φ that is the identity outside the hole (and inside it shifts points).
     - The diffeomorphism φ "drags" the metric tensor field along with it, so the new metric at point p is the old metric at φ^{-1}(p).
     - The two metrics are mathematically distinct (if φ is not the identity) but represent the same physical geometry (they are isometric).
     - The argument: if we take spacetime points to have inherent identity (substantivalism), then the two metrics represent different physical situations (because at a given point p, the metric is different). But since the two solutions agree on all observables (which are invariant under diffeomorphisms) and on the boundary, we have a violation of determinism: the same initial conditions (outside the hole) lead to multiple possible metrics inside.
     - The resolution: either we abandon determinism (which is unpalatable) or we abandon substantivalism (spacetime points do not have inherent identity; only the relational structure matters).

   We must include:
     - The hole is a region without matter (stress-energy vanishes).
     - The boundary conditions are fixed (so outside the hole, the metric is the same).
     - The shift inside the hole (the diffeomorphism) that drags the metric.
     - The two models are the same in terms of geometry (so same invariants) but differ point by point if we consider the points as having identity.

   We want the poem to be understandable to those who haven't studied the hole argument, but accurate enough for those who know it.

   Let's assign numbers to the words:
     1 = hole
     2 = points
     3 = shift
     4 = same
     5 = fixed
     6 = drag

