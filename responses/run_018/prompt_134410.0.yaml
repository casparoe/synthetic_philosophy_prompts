  2. Conditions under which dismantling is warranted: They might agree that in cases of clear harm or dysfunction, dismantling is warranted. Also, perhaps when the function is understood and a better alternative is available.

  3. Empirical evidence on replacing peer licensing with checklists: They might agree that there is mixed evidence, and that context matters. Some jurisdictions have seen success, others failure.

  Drafting:

