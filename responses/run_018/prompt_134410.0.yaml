  2. Conditions for Dismantling: Both parties agree that dismantling or replacing an institution is warranted only under specific conditions, including but not limited to: 
     a) Persistent and severe dysfunction that cannot be remedied through incremental reform.
     b) The availability of a demonstrably superior alternative that fully captures the institution's essential functions without incurring unacceptable costs.
     c) Situations where the institution's original function has become obsolete or harmful.

  3. Empirical Evidence on Professional Licensing Reform: Both parties acknowledge that empirical studies of jurisdictions that have replaced peer-governed professional licensing with fully procedural, checklist-based competency audits yield mixed results. Success or failure appears to depend on contextual factors, including:
     a) The complexity and variability of the professional domain (e.g., simpler tasks show more consistent success with checklists).
     b) The quality of the audit design and its alignment with the actual competencies required.
     c) Cultural and institutional readiness for the transition.
     There is agreement that no universal template for success exists, and that outcomes are highly sensitive to implementation details.

  Part 2: Disagreements Table

  The core disagreement: whether tacit institutional memory is irreducibly non-codifiable.

  We need two columns: Chestertonian Burkeans and Rationalist Reformists, with each side's position in wording they would accept.

  Chestertonian Burkeans: They hold that inherited practices embody distributed tacit knowledge that cannot survive full articulation. So, they would say that tacit knowledge is irreducibly non-codifiable.

  Rationalist Reformists: They hold that every "fence" is replaceable by an audited explicit mechanism once its function is understood. So, they would say that tacit knowledge is in principle codifiable, though perhaps difficult.

  Table:

  | Disagreement on the Codifiability of Tacit Institutional Memory |
  |----------------------------------------------------------------|
  | **Chestertonian Burkean Position**                             | **Rationalist Reformist Position**                             |
  |----------------------------------------------------------------|----------------------------------------------------------------|
  | The distributed tacit knowledge embedded in inherited institutional practices is inherently non-codifiable; any attempt at full articulation destroys or degrades the very knowledge it seeks to capture, because such knowledge exists only in situ, as lived practice. | All functional elements of an institution are in principle codifiable and replaceable by explicit mechanisms, provided sufficient understanding of the institution's functions is achieved; the difficulty of codification is a technical challenge, not an ontological barrier. |

  Part 3: Cruxes

  We need to identify cruxes and for each:

