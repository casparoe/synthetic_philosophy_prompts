answer: |-
  1. **Exam Question:** Evaluate whether interpreting Fitch's knowability principle ("all truths are knowable") as a normative claim about rational obligation (e.g., "we *ought* to be able to know any truth") rather than a modal claim about epistemic accessibility (e.g., "it is *possible* to know any truth") successfully dissolves the paradox or merely relocates the underlying tension concerning unknowable truths.

  2. **Model Answer:** Interpreting knowability normatively avoids the modal derivation's contradiction (universal knowability entailing universal knowledge) by denying it describes a metaphysical possibility, instead positing a rational ideal. However, this relocates the tension: it struggles to explain truths seemingly *constitutively* unknowable (e.g., "P and nobody ever knows P"), as the obligation to know them appears incoherent or practically vacuous, conflicting with the principle's intuitive scope and raising questions about the nature of rational obligation itself.

  3. **Marking Scheme:** Award marks for: Accurately distinguishing modal vs. normative interpretations (up to 30%); Explaining how the normative view avoids the modal contradiction (up to 20%); Critically analysing *how* the tension relocates (e.g., incoherent obligations, vacuity, scope mismatch) (up to 30%); Evaluating the overall success/failure of the normative move (up to 15%); Clarity, structure, and engagement beyond derivation rehearsal (up to 5%).

  4. **Confidence Statement:** I am highly confident (90%) in the core distinction between modal and normative interpretations and the basic relocation argument; this reflects standard philosophical discussions of responses to Fitch (e.g., Wansing, Jenkins).

  5. **Least Sure Point:** I am less confident (70%) about the *specific characterization* of the relocated tension under the normative view (e.g., whether "incoherent obligation" is the strongest or only criticism, or if the vacuity charge is decisive), as normative accounts vary significantly in sophistication.
