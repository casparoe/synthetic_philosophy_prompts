  - Monitors: They see the reports from all Sensors. They can also issue meta-reports (e.g., "I am aware of seeing red") without checking any card. They do not see the hidden cards.
  - Judges: They see the reports from the Sensors and the Monitors. They must vote "conscious" (meaning the system is conscious of seeing red) or "not conscious" based only on the reports. They commit publicly before the reveal.

  Information Flow:
  1. Sensors get their hidden cards and report (by writing or speaking) their status (e.g., "red detected").
