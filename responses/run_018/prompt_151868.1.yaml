  3. What the game can't reproduce:
     - The game uses external Judges to decide, but in reality, consciousness is subjective. The Monitor's report in the game is a behavioral output, whereas in the actual theory, the higher-order state is internal and not necessarily reportable. Also, the Judges are external observers, but consciousness is a first-person experience. The facilitator must explain that in the actual theory, the Monitor's state is what constitutes the consciousness, not the Judges' verdict.

