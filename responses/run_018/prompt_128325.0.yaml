  hey im a software engineer with basically zero formal philosophy background, and ive been trying to understand Quines take on moral values for a side project. i keep running into this idea that he treated ethics like a deprecated API—something we keep in our conceptual scheme not because it tracks reality but because removing it breaks too many dependencies. my specific confusion is about the analytic/synthetic split: since Quine rejected it, doesnt that mean moral claims cant be analytic tautologies and also cant be synthetic empirical claims, so they end up in this wierd middle ground? and if moral values are just cultural posits like atoms or numbers, then when my team argues about accessibility vs performance, are we basically just debating which deprecated convention to keep? can you correct my misunderstanding here—especially the part where i assume Quine thought moral values are completely disposable—and explain where he actually stands? please answer in american english, and say how confident you are in your claims while singling out the point youre least sure of.
