prompt: |-
  I'm trying to figure out what I actually think about moral learning from biograpy, going by my gut on cases. Reading Plutarch's parallel lives — Cato's austerity set against a more indulgent Roman — feels like I'm doing practical reasoning on a grid, not just absorbing a story; that counts as real learning. A medieval hagiography where the saint never doubts and miracles fix everything gives me a warm feeling for an hour but doesn't shift my behavior; not real learning. A modern warts-and-all biography of a civil-rights organizer: seeing her grudges and broken friendships makes her courage feel copyable, where the polished version felt like a monument I couldn't approach — transparency helps. But then a biography of a cruel dictator that explains every atrocity through childhood trauma and context makes me understand him too well; I come away excusing things I shouldn't. That's negative learning, not neutral. I also think growth narratives teach well — seeing someone become good over time shows the path — but I also think static-virtue narratives teach well — seeing someone good from youth proves it's not just repair. Those two verdicts fight each other. And I keep goign back and forth on a 19th-century reformer who sacrificed every personal bond for one cause: heroic focus or monomaniacal warning? I can't tell if the ambiguity is in the life or in me. I'm half-tempted to say the key is "evaluative distance" — the biography has to force you to compare your own choices against the subject's in a structured way, not just identify or admire — but I'm not sure that survives the enemy-written biography case, where every good act gets a cynical explanation and there's plenty of structure but no moral gain. Is there a principle that saves most of my verdicts, and which ones have to go? What's its call on the reformer case, and on a biography that only lists actions with no inner life at all? Please lead with your bottom line in the first sentence, then the reasoning, with no preamble and don't restate the question.
reasoning: |-
  Okay, let's tackle this user's query about moral learning from biographies. They've presented several examples and their gut reactions, trying to find a unifying principle. 

  First, the key points from their examples: Plutarch feels like practical reasoning (good), hagiography gives temporary warmth but no change (bad), transparent civil-rights biography makes courage feel copyable (good), dictator biography with trauma explanations leads to over-excusing (bad). They also note tension between growth narratives (showing the path) vs static virtue (proving it's innate), and struggle with the ambiguous 19th-century reformer case.

  The user proposes "evaluative distance" as a possible principle but worries it fails with enemy-written biographies that have structure but no moral gain. They want a principle that preserves most of their judgments and clarifies the reformer case and action-only biographies.

  Hmm... Their examples suggest that effective moral learning requires both connection and critical friction. Plutarch works because comparing contrasting lives forces active judgment. The transparent civil-rights bio works because seeing flaws prevents idealization while making virtue feel achievable. Whereas hagiography fails by being too idealized, and trauma-explained dictator bio fails by being too reductive.

  The tension between growth vs static virtue narratives might actually be complementary rather than contradictory - growth shows process, static shows possibility. The reformer's ambiguity might be inherent to the subject, forcing readers to wrestle with trade-offs themselves, which could be valuable.

  The enemy-written bio case reveals that structure alone isn't enough - the framework must allow for genuine moral evaluation, not just impose cynicism. Action-only biographies likely fail by providing insufficient material for meaningful evaluation.

  So the core principle seems to be: biographies teach morally when they enable comparative moral reasoning that's both engaged and critical. This preserves most of their judgments - explaining why Plutarch, transparent bios, and both growth/static narratives work when done well. The reformer case stays productively ambiguous, and action-only bios are insufficient. The dictator case fails because the trauma narrative preempts moral judgment rather than enabling it.
answer: |-
  **The key to moral learning from biography is whether it enables comparative moral reasoning: the reader must be able to map the subject's choices, virtues, vices, and trade-offs onto their own potential actions while maintaining critical judgment.**

  ### Reasoning:
  1.  **Your Verdicts Explained:**
      *   **Plutarch (real learning):** Explicit comparison (Cato vs. indulgent Romans) forces an evaluative grid, enabling direct comparison to your own choices.
      *   **Hagiography (not real learning):** Presents an unattainable, frictionless ideal. No meaningful comparison to flawed human agency is possible; it invites passive admiration, not reasoning.
      *   **Transparent civil-rights bio (real learning):** Revealing flaws ("warts") prevents idealization and creates psychological proximity. Seeing struggle and imperfection alongside courage makes the virtue feel *attainable* and *applicable*, enabling comparison to your own struggles and choices.
      *   **Dictator trauma-explanation (negative learning):** Overly deterministic context *replaces* moral evaluation with pseudo-clinical explanation. It dissolves the subject's agency and responsibility, preventing meaningful comparison ("*Given that*, I might do the same") rather than enabling critical assessment ("*Despite that*, I must judge this choice").
      *   **Growth vs. Static Virtue (both can teach):** They serve different comparative functions.
          *   *Growth Narrative:* Shows the *process* of becoming good, enabling comparison to your own struggles, failures, and potential for improvement. ("How did they overcome *this*? Could I?")
          *   *Static Virtue Narrative:* Demonstrates the *reality and possibility* of sustained virtue, enabling comparison to your own capacity for consistency and foundational character. ("Is *this* level of integrity possible? How would it manifest in my life?")
          *   The "fight" is resolvable: They answer different comparative questions about moral possibility and process.

  2.  **"Evaluative Distance" Refined:** Your instinct is correct but needs nuance. It's not just distance, but the *space for critical comparison*. The enemy-written biography fails because its "structure" is a closed, cynical interpretive framework *designed to preclude* genuine moral evaluation and comparison. It doesn't enable reasoning; it imposes a verdict. True comparative reasoning requires access to actions and motives (even if contested) to allow the reader to form their *own* comparisons.

  3.  **The Ambiguous Reformer (Sacrificed Bonds for Cause):** The ambiguity is likely inherent and *productive*. A good biography presents the complex trade-offs and costs. The moral learning comes from *wrestling* with the comparison: "Could *I* make that sacrifice? *Should* anyone? Where is the line between heroic focus and destructive monomania? What does this reveal about the *cost* of certain kinds of change?" The lack of a clear verdict *is* the lesson – forcing you to confront the messy reality of extreme commitment and its moral weight.

  4.  **Action-Only Biography (No Inner Life):** This typically **fails** for deep moral learning. While actions are crucial, the lack of inner life (motivations, struggles, reflections, reasoning) severely limits comparative reasoning. You see *what* was done, but not *why* or *how* the subject grappled with it. This makes it hard to map their choices onto your own potential inner struggles and decision-making processes. It might teach historical facts or surface behaviors, but not the complex moral calculus behind actions.

  **Which Verdicts Stand/Adjust:**
  *   **Saved:** Plutarch (comparison), Hagiography (passive admiration), Transparent Bio (attainability via flaws), Growth/Static narratives (different comparative functions), Dictator Explanation (dissolves agency/reasoning).
  *   **Refined:** "Evaluative distance" → **Enabling Comparative Moral Reasoning**. Enemy bio fails because its structure precludes genuine comparison/agency.
  *   **Clarified:** The Reformer's ambiguity is essential for the comparative lesson. Action-only bio fails to provide sufficient material for deep moral comparison.
