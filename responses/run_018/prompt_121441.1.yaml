answer: |-
  ## Standing to Blame Fellowship Prioritisation

  **The Shortlist, Reordered (270 words)**

  1.  **Borrowed Standing (1):** This is the most *upstream* and *practically significant*. It asks the foundational question: *When is blame even permissible for someone not directly involved?* This cuts to the heart of institutional legitimacy – can a professional body condemn a member's misconduct if it didn't harm *them* directly? It directly challenges "clean hands" vibes by exploring legitimacy sources beyond personal innocence. Answering "adopted vs. manufactured grievance" is crucial for real bodies navigating victim advocacy vs. perceived interference. This sets the stage for *all* other standing questions, including hypocrisy.
  2.  **Aggregated Blamers (3):** This is highly *practical* and *neglected*. Institutions (committees, panels, boards) *are* the primary blamers writing conduct codes. Understanding if hypocrisy "poisons the well" for collective bodies is vital. Does it depend on voting rules, the hypocrite's role, or the body's mandate? This has immediate implications for how institutions are constituted and make decisions, directly addressing your end goal of defensible processes.
  3.  **Standing Drift (4):** While important for individuals, it's *less foundational* than (1) and *less directly institutional* than (3). It concerns the *duration* of a deficit primarily caused by hypocrisy. Figuring out the "clock" and the role of acknowledgement is practically relevant for individuals re-entering roles (e.g., reformed professionals on ethics panels), but assumes the deficit exists – a question addressed more fundamentally upstream. It's tractable and offers concrete guidance.
  4.  **The Untempted Blamer (2):** This is philosophically interesting but the *least practical* and potentially a *pseudo-problem*. While exploring an epistemic/competence condition challenges "clean hands," its institutional relevance is weak. Conduct codes rarely hinge on blamers having personal experience *of the specific temptation*. Focus is on understanding rules and harm, not shared weakness. This might dissolve: is "never tempted" even possible, or just extreme moral luck? Its practical impact seems minimal compared to the others.

  **Criteria and Where They Clash (310 words)**

  I prioritised using:
  1.  **Practical Institutional Shift Potential:** The *primary* goal. Which topic gives the most concrete, defensible tools (concepts, principles, tests) for real bodies writing/enforcing codes? (1 & 3 score highest).
  2.  **Upstream-ness/Foundational Nature:** Does it address core justifications for standing itself, setting the stage for others? (1 is most upstream; 2 & 4 less so).
  3.  **Tractability in 2 Years:** Can a significant contribution be made? All seem viable, but (1) might be broadest, needing careful scoping.
  4.  **Neglectedness:** Avoiding over-trodden ground (hypocrisy's self-undermining). All qualify, but (3) feels particularly underexplored in institutional contexts.

  **Clashes:**
  *   **Upstream vs. Practical:** (1) is highly upstream *and* practical. (2) is upstream but low practicality – a significant clash favouring (1). (3) is less upstream (builds on individual standing) but highly practical – this clash favours practicality given your goal.
  *   **Practical vs. Neglectedness:** All are neglected relative to core hypocrisy, so this clash is minor. (3) is both highly practical *and* notably neglected institutionally.
  *   **Tractability vs. Scope:** (1) is broad. Prioritising it requires focusing sharply (e.g., *institutional* borrowed standing, or specific grievance types). (3) and (4) are naturally narrower.

  The reordering reflects these trade-offs: **Practical impact is paramount.** (1) wins because it's both foundational *and* directly answers "Who can even *try* to blame here?" for institutions. (3) wins over (4) because collective bodies are your target blamers. (2) loses because its practical relevance is dubious, potentially resolving into an edge case. (4) is important but addresses a consequence (deficit duration) rather than the core permission or its institutional application.

  **What I've Missed (180 words)**

  Your list is strong, but consider adding:

  1.  **Role-Based Standing:** How does occupying a specific *role* (HR officer, ombudsman, committee chair) confer standing, potentially *overriding* personal deficits (hypocrisy, lack of direct harm)? This bridges (1) and (3), crucial for institutions. Does the role create a *duty* to blame, changing the standing calculus? This is highly practical.
  2.  **Standing & Power Dynamics:** Does the relative power of the blamer (institution vs. individual) affect standing? Can powerful bodies "borrow" standing more easily, or does it demand *more* justification? This interrogates potential abuse in "busybodying" and institutional overreach, vital for defensible codes.
  3.  **Victim Primacy vs. Institutional Mandate:** When does an institution's *mandate* (e.g., upholding professional standards) legitimately grant it standing *instead of*, or *alongside*, the victim? This directly challenges the primacy of direct harm and underpins institutional authority. It's a specific angle within (1).
  4.  **Epistemic Access (Alternative to Untempted):** Not *temptation*, but does the blamer need reliable *access to evidence* of the wrong and context? This epistemic condition feels more practically relevant for institutions than personal temptation.

  **What Would Move Things Up or Down (150 words)**

  *   **Up:** Early discovery that **Aggregated Blamers (3)** has wildly under-explored complexities (e.g., differing voting mechanisms, delegation effects) making it a potential keystone. Evidence that **Borrowed Standing (1)** is the *critical* stumbling block for current institutional practice (e.g., ethics panels struggling with legitimacy claims).
  *   **Down:** Finding **Standing Drift (4)** is largely context-dependent (offence severity, sincerity, community norms) defying generalisable principles. Realisation that **The Untempted Blamer (2)** collapses into debates about moral expertise or the nature of moral judgement, straying from core standing.
  *   **External Factor Up:** Strong engagement with policymakers/institutions revealing urgent need for frameworks on committee legitimacy **(3)** or third-party condemnation **(1)**.
  *   **External Factor Down:** Emergence of significant new work on **Borrowed Standing (1)** during your fellowship, reducing its neglectedness.
