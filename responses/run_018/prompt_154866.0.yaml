  Looking for a feature neither theorist anticipated. The phased decriminalization—starting with privacy and higher age—acted as a symbolic buffer. It wasn't just about harm or morality but about managing social change. This compromise allowed reform while reassuring conservatives, something both Hart and Devlin didn't address. Their theories don't account for how legal reforms can serve symbolic functions beyond their binary of harm vs. morality.

