  - "leaky_box_shift": string, how the modified scenario changes the classic debate
  - "strawman_check": boolean, whether either side was misrepresented
  - "unresolved_tension": string, what's still left hanging
  - "injected_concepts": array of strings listing the made-up terms used

  write casual, a typo or two is totally fine.
