prompt: |-
  hey can u write me a dialouge between two philosphers arguing about a tweaked experience-machine scenario? call it the "leaky box": it delivers perfect simulated wellbeing but occasionally pipes in verifiable true reports from outside — ur real body is failing, ur kid is actually in danger, etc. — and u can exit on those signals. have one defend "phenomenal integrationism": well-being is internal coherence of the experienced narrative, so the leaks are just more plot-points and exiting usually breaks coherence for no gain. have the other defend "counterfactual anchoring": well-being requires that ur endorsed values survive contact with actual states of affairs, so the leaks are stress-tests and ignoring them is self-deception. make them actually respond to each other — B should say integration makes wellbeing cheap, A should reply anchoring just collapses into actual-world preference satisfaction, B should push back about the normative authority of reality. keep it in the weeds, no strawmen, and dont ask for citations or a reading list.

  after the dialouge, output a brief structured summary in JSON with exactly these fields:
