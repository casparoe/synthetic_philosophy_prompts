  Okay, let me try to unpack the user's query. They're working through David Lewis's theory of convention, specifically how norms evolve and stabilize through common knowledge, salience, and conditional preferences. They want to apply this to federated social platforms like Mastodon, where there's no central authority, instances have local rules, and users can migrate easily. 

  First, I need to recall Lewis's core conditions: regularity in behavior, common knowledge of that regularity, and a preference for conformity conditional on others conforming. The user is questioning whether these can hold in a fragmented, transient environment. 

  The main challenge here is the lack of a stable population. Common knowledge requires that everyone knows that everyone knows, etc., which might be tough if users are moving between instances. Each instance might have its own norms, but when users migrate, they bring different expectations. So, common knowledge might only be possible locally, within an instance, but not globally across the federation.

  Salience is another issue. Lewis talks about something being prominent or standing out. In a centralized system, a single rule can be salient. But in a federated setup, salience is distributed. Each instance has its own rules, so what's salient varies. This could lead to coordination problems when users interact across instances. 

  Then there's the preference for conformity. The conditional aspect—"I conform because I expect others to"—might hold within an instance. But if users frequently migrate, the population isn't stable. If someone sees others defecting, they might leave instead of enforcing the norm. Exit becomes the rational choice, undermining voice. This could erode the community's ability to maintain norms because those who care leave, leaving behind those who don't, leading to degradation.

  The user also asks about exit vs. voice. Easy migration allows clustering of like-minded users, which stabilizes local norms. But constant movement might prevent deep common knowledge. New users joining an instance might not fully grasp the norms right away, so it takes time for common knowledge to build. High churn could keep norms from stabilizing.

  Evolutionary dynamics: norms stabilize when deviations are observable and costly. In federated systems, detecting and punishing defectors is harder across instances. If defection isn't observable outside the local instance, there's no cross-instance accountability. Plus, if someone defects, instead of facing sanctions, they might just move to another instance. This makes defection rational and low-cost, potentially leading to persistent norm erosion.

  But there might be mechanisms to counteract this. Instances could form clusters with aligned norms, creating larger stable pools. Reputation systems or shared blocklists might help, but that depends on existing cooperation. The key point is whether local conventions can form without global ones. The user's concern is whether the architecture inherently undermines norm stability by favoring exit over enforcement.

  I should also consider if the transient population affects the baseline regularity. If users are coming and going, the behavioral patterns might shift too quickly for a convention to solidify. Common knowledge requires stability over time, which high mobility might prevent. 

  The user's deeper interest seems to be in decentralized governance viability. They might be exploring whether such systems can avoid central authority without descending into chaos. Lewis's framework suggests that without stable populations and common knowledge, conventions struggle. Federated systems might rely on clustering and local stability, but face challenges in broader coordination and norm enforcement across the network.
answer: |-
  Applying Lewis's framework to federated platforms reveals significant tensions and implications for norm stability:

  ### 1. **Fragmentation vs. Lewisian Conditions**
     - **Regularity & Common Knowledge**: These can emerge *locally* within stable instances where repeated interactions anchor expectations. However, **global conventions across the federation are unlikely**. Common knowledge requires shared reference points ("everyone knows that everyone knows..."), which fragmented rule-sets and transient users undermine. Salience is confined to instance-specific cues (e.g., pinned rules), lacking cross-platform resonance.
     - **Preference for Conditional Conformity**: Conformity remains rational *within an instance* if users expect others there to follow local norms. Yet migration disrupts this: newcomers may lack knowledge of local regularities, while departures reduce the "assurance set" needed for mutual expectations. The conditional preference ("I comply if others do") weakens when "others" are unstable.

  ### 2. **Exit vs. Voice Dynamics**
     - **Clustering as Stabilizing**: Exit enables **norm homogenization within instances**. Like-minded users cluster, reinforcing local conventions through alignment of preferences and expectations. This mimics Lewis's coordination equilibria at micro-scale.
     - **Erosion of Common Knowledge**: Persistent migration **prevents deep common knowledge** from forming. When users frequently join/leave:
       - Baseline regularity fluctuates, weakening shared expectations.
       - New members lack historical context for "how things are done here."
       - Salience diminishes as norms become negotiable rather than foundational.
     - **Voice Atrophy**: Easy exit reduces incentives to enforce norms via sanctions ("voice"). Why confront a defector if you can leave instead? This erodes communal mechanisms sustaining conventions.

  ### 3. **Evolutionary Dynamics & Defection**
     - **Observability Challenges**: Defection is harder to monitor across instances. A user banned on one server can join another, escaping reputational consequences. Local sanctions lack federation-wide effect.
     - **Costless Defection Rationality**: When exit is frictionless:
       - **For norm-followers**: Leaving a non-compliant instance is rational—preserving utility without confrontation.
       - **For defectors**: Migrating after sanctions avoids costs, making repeated defection sustainable.
       - **For instances**: Competing for users may incentivize tolerating defectors (e.g., to boost engagement), undermining sanctioning mechanisms.
     - **Cooperative Equilibria**: These can persist **only if**:
       - Instances maintain high user stability (reducing turnover).
       - Exit barriers exist (e.g., social capital loss, technical friction).
       - "Instance cultures" enforce norms via social pressure *despite* migration threats.

  ### 4. **Structural Implications for Governance**
     - **Conventions ≠ Universal Norms**: Federations host **multiple local conventions** rather than one global norm. Lewis's conditions hold only within islands of stability.
     - **Stability via Isolation**: Instances with strong identity (e.g., thematic focus, ideological homogeneity) better sustain conventions by attracting aligned users and discouraging disruptive exits.
     - **Vulnerability to Erosion**: Instances with low cohesion or high churn risk **norm entropy**: 
       - Migration drains users invested in local practices.
       - Influx of diverse users fragments expectations.
       - Without critical mass, conditional preferences unravel ("Why conform if others won't?").

  ### Conclusion
  Federated architectures **enable local conventions but inherently destabilize global ones**. Lewis’s core mechanics—common knowledge, salience, and conditional preferences—function only in isolated, stable subgroups. Exit preserves micro-conventions through clustering but corrodes macro-coordination by:
  - Fragmenting common knowledge,
  - Reducing costs for defection,
  - Undermining collective enforcement.
  Ultimately, federated moderation relies on **balancing fragmentation** (to sustain local equilibria) **against mobility** (which incentivizes defection and prevents cross-federation norm emergence). Cooperative stability is possible only where exit barriers or communal bonds outweigh centrifugal forces.
