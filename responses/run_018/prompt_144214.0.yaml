answer: |-
  Below is the operational procedure for your ethics review panel, designed as a 20-minute checklist. It incorporates interval-valued moral weights, reversal-threshold analysis, and explicit handling of moral status disagreements. Key judgment points are marked with **! JUDGMENT REQUIRED**. The procedure is applied to your three proposals, with one case (carbon storage) demonstrating divergence from intuitive judgment. Limitations are clarified at the end.

  ---

  ### **Operational Procedure for Moral Uncertainty Resolution**
  **Time Allocation:** 20 minutes per proposal  
  **Inputs:** Proposal description, predefined moral frameworks (F1, F2, ..., Fn), reversal threshold factor \( R \) (default = 1, set by panel).  
  **Outputs:** Approve, Reject, Refer for human deliberation.

  #### **Checklist Steps**  
  1. **Identify Affected Entities and Moral Status Intervals**  
     - List all entities significantly affected (e.g., humans, animals, synthetics, future beings).  
     - For each entity and framework, assign a **moral weight interval**:  
       - If the framework grants moral status: \([L_w, U_w]\) (e.g., \([0.1, 0.5]\)).  
       - If the framework denies moral status: \([0, 0]\).  
       - If status is ambiguous (e.g., contingent on sentience proof): \([0, U_w]\) or \([L_w, U_w]\) where \(L_w \geq 0\).  
     - *Sufficient answer:* Table of entities × frameworks with intervals.  
     - **! JUDGMENT REQUIRED:** Assigning intervals for contested entities (e.g., AI with ambiguous sentience).  

  2. **Quantify Net Impacts**  
     - Estimate net welfare impact per entity (common unit: e.g., welfare-adjusted life years). Use intervals for uncertainty:  
       - E.g., "Badgers: reduced suffering = [+100, +200] units".  
       - Include cross-species/cross-time trade-offs (e.g., "Rabbits: increased suffering = [−50, −10] units").  
     - *Sufficient answer:* List of entities with impact intervals.  
     - **! JUDGMENT REQUIRED:** Estimating impacts where empirical data is sparse (e.g., long-term risks).  

  3. **Compute Framework-Specific Total Value**  
     - For each framework, calculate total value \(V_f\):  
       \[
       V_f = \sum \left( \text{weight}_{\text{entity}} \times \text{impact}_{\text{entity}} \right)
       \]  
       - Treat weights and impacts as independent intervals.  
       - For each entity’s term:  
         - Min value = min(\(L_w \times L_i\), \(L_w \times U_i\), \(U_w \times L_i\), \(U_w \times U_i\))  
         - Max value = max(\(L_w \times L_i\), \(L_w \times U_i\), \(U_w \times L_i\), \(U_w \times U_i\))  
       - Sum min/max across entities for \(V_f\) interval: \([V_f^{\text{min}}, V_f^{\text{max}}]\).  
     - *Sufficient answer:* \(V_f\) interval for each framework.  

  4. **Dominance Check**  
     - **Approve** if \(\forall f\), \(V_f^{\text{min}} > 0\) (better than status quo in all frameworks).  
     - **Reject** if \(\forall f\), \(V_f^{\text{max}} < 0\) (worse than status quo in all frameworks).  
     - Else, proceed.  

  5. **Reversal Threshold Analysis**  
     - Define:  
       - \(A = \{ f \mid V_f^{\text{min}} > 0 \}\) (unambiguously positive frameworks).  
       - \(B = \{ f \mid V_f^{\text{max}} < 0 \}\) (unambiguously negative frameworks).  
       - \(C = \{ f \mid V_f^{\text{min}} \leq 0 \leq V_f^{\text{max}} \}\) (ambiguous frameworks).  
     - Decisions:  
       - If \(A \neq \emptyset\) and \(B = \emptyset\):  
         - Let \(P = \max_{f \in A} V_f^{\text{min}}\) (strongest lower bound).  
         - Let \(N = \min_{f} V_f^{\text{min}}\) (weakest lower bound across all \(f\)).  
         - **Approve** if \(N \geq 0\).  
         - Else, **Approve** if \(P \geq R \times |N|\) (where \(R\) is the reversal threshold factor).  
         - Else, **Refer**.  
       - If \(B \neq \emptyset\) and \(A = \emptyset\): **Reject**.  
       - If \(A \neq \emptyset\) and \(B \neq \emptyset\): **Refer** (irreducible conflict).  
       - If \(A = \emptyset\) and \(B = \emptyset\): **Reject** (no unambiguously positive framework).  
     - **! JUDGMENT REQUIRED:** Setting \(R\) (default 1). Higher \(R\) requires stronger evidence to override downside risks.  

  ---

  ### **Test Conditions (Meta-Ethics Neutral)**  
  Apply these to stress-test without resolving disputes:  
  1. **Status Disagreement:** Entity excluded in one framework (\([0, 0]\)) but valued in another (\([L_w, U_w]\)).  
  2. **Interval Overlap:** All \(V_f\) intervals overlap, but optimal intervention reverses (e.g., F1 prefers A > B, F2 prefers B > A).  
  3. **Zero Threshold:** \(V_f\) intervals include 0 in all frameworks, but impacts are asymmetric.  

  **Flagged Misfires:**  
  - **Reversal Hidden by Overlap:** If all intervals overlap but rank interventions oppositely (e.g., carbon storage benefits futures vs. harms present), the procedure may **Approve** when intuitive consensus rejects. This arises from using *status quo comparison* (not inter-option ranking).  
  - **High Uncertainty:** When \(V_f\) intervals are wide (e.g., \([−1000, +1000]\)), \(R\) may force unnecessary **Refer** even with high-upside.  

  ---

  ### **Application to Proposals**  
  Assume two frameworks:  
  - **F1 (Prioritarian):** Weight = 1 for humans/animals; discounts future/synthetic beings (\([0, 0.3]\)).  
  - **F2 (Longtermist):** Full weight for future/synthetic beings (\([0.7, 1]\)) if sentience plausible; present humans = \([1, 1]\).  

  #### **(i) Badger Vaccination**  
  - **Entities:**  
    - Badgers (weight: F1 \([0.8, 1]\), F2 \([0.8, 1]\); impact: \(+[100, 200]\)).  
    - Rabbits (weight: F1 \([0.6, 0.8]\), F2 \([0, 0]\); impact: \(-[30, 70]\)).  
    - Ecosystem stability (weight: F1 \([0, 0]\), F2 \([0.2, 0.4]\); impact: \(-[40, 60]\)).  
  - **Total Value:**  
    - F1: \([0.8 \times 100 - 0.8 \times 70, 1 \times 200 - 0.6 \times 30] = [80 - 56, 200 - 18] = [24, 182] \rightarrow \text{min} > 0\).  
    - F2: \([0.8 \times 100 - 0.4 \times 60, 1 \times 200 - 0.2 \times 40] = [80 - 24, 200 - 8] = [56, 192] \rightarrow \text{min} > 0\).  
  - **Decision:** Both unambiguously positive → **Approve**.  

  #### **(ii) Artificial Sentience Research**  
  - **Entities:**  
    - AI systems (weight: F1 \([0, 0.3]\), F2 \([0, 1]\) contingent on architecture; impact: \(-[10, 50]\) if sentient).  
    - Researchers (weight: \([1, 1]\); impact: \(+[80, 120]\)).  
  - **Total Value:**  
    - F1: \([1 \times 80 + 0.3 \times (-50), 1 \times 120 + 0 \times (-10)] = [80 - 15, 120] = [65, 120] \rightarrow \text{min} > 0\).  
    - F2: \([1 \times 80 + 0 \times (-50), 1 \times 120 + 1 \times (-10)] = [80, 110] \rightarrow \text{min} > 0\).  
  - **Decision:** Both unambiguously positive → **Approve**.  

  #### **(iii) Geological Carbon Storage**  
  - **Entities:**  
    - Present communities (weight: \([1, 1]\); impact: \(-[80, 100]\) from risk).  
    - Future generations (weight: F1 \([0, 0.3]\), F2 \([0.7, 1]\); impact: \(+[500, 2000]\)).  
  - **Total Value:**  
    - F1: \([1 \times (-100) + 0.3 \times 500, 1 \times (-80) + 0 \times 2000] = [-100 + 150, -80] = [50, -80] \rightarrow \text{ambiguous} \, (\text{min} = -80 < 0 < \text{max} = 50)\).  
    - F2: \([1 \times (-100) + 0.7 \times 500, 1 \times (-80) + 1 \times 2000] = [-100 + 350, -80 + 2000] = [250, 1920] \rightarrow \text{min} > 0\).  
  - **Analysis:**  
    - \(A = \{\text{F2}\}\) (unambiguously positive), \(B = \emptyset\).  
    - \(P = \max V_f^{\text{min}} = 250\) (F2), \(N = \min V_f^{\text{min}} = -80\) (F1).  
    - \(P = 250\), \(R \times |N| = 1 \times 80 = 80\).  
    - \(250 > 80\) → **Approve**.  
  - **Divergence from Intuition:**  
    - Most panelists intuitively **Reject** due to local risks.  
    - **Divergence step:** Reversal threshold (Step 5). F1’s downside (\(-80\)) is overridden by F2’s upside (\(250 > 80\)).  
    - **Cause:** F2’s strong weight on futures and high benefit magnitude.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Justify Dominated Options:** If an option is worse than status quo under **all** frameworks (\(V_f^{\text{max}} < 0\) for all \(f\)), it is **Rejected**. No aggregation can override this.  
  2. **Handle Non-Quantifiable Side Effects:** When impacts cannot be intervalized (e.g., deontological constraints like "never risk extinction"), the procedure misfires. **! JUDGMENT REQUIRED** to convert to intervals (e.g., "extinction risk = \([-∞, 0]\)" forces manual override).  
  3. **Resolve Inter-Option Reversals:** If comparing multiple interventions (not just status quo), interval overlap may hide rank reversals. Use only for binary approve/reject.  
  4. **Eliminate Value Judgments:** Critical uncertainties (weight intervals, \(R\), impact bounds) require panel consensus. The procedure exposes but cannot resolve these.  

  ---

  **Deliverable Format:** Reusable checklist with British English phrasing. Source code for calculations (Python/Excel) recommended for Step 3.  
  **Final Output:** Structured template for panel minutes, including entity tables, \(V_f\) intervals, and decision rationale.
