answer: |-
  Your request is rigorous—and rightly exposes tensions in applying "dirty hands" to *Macbeth*. I’ll proceed honestly, flagging where the fit is imperfect and where the play deepens the philosophy.  

  **Core Scenes**:  
  1. **Duncan’s Murder (Act 2, Scenes 1-2)**: The foundational "dirty act."  
  2. **Banquo’s Ghost (Act 3, Scene 4)**: Escalation and psychological unraveling.  
  3. **Lady Macbeth’s Sleepwalking (Act 5, Scene 1)**: The "moral remainder" manifest as trauma.  
  4. **"Tomorrow" Soliloquy (Act 5, Scene 5)**: Nihilism as endpoint.  

  **Key Philosophical Distinctions**:  
  1. **Instrumental vs. Corruptive Acts**: Does the wrong serve a stable political end, or does it distort the end itself?  
  2. **Moral Remainder**: Is guilt a necessary acknowledgment of wrongdoing, and what happens when suppressed?  
  3. **Political vs. Personal**: Can Macbeth’s acts be framed as *political* dirty hands, or are they always pathological ambition?  

  ---

  ### Analysis: Where the Framework Fits and Frays  
  **1. The Initial Act: Instrumental or Already Corrupt?**  
  - *Duncan’s murder* appears instrumental: Macbeth claims killing a virtuous king is necessary to seize his "destined" throne ("If it were done when ’tis done..."). Yet his soliloquy reveals *no public good*—only personal ambition ("vaulting ambition") and fear of losing "Golden opinions".  
  - **Resistance to Framing**: Dirty hands typically involves *sacrificing personal morality for public necessity* (e.g., Walzer’s mayor who tortures to save a city). Macbeth serves no public good—only himself. *This isn’t dirty hands; it’s tyranny disguised as necessity.*  

  **2. Escalation: The Collapse of Ends**  
  - Post-Duncan, ends shift: Killing Banquo isn’t to secure the throne but to suppress paranoia ("Our fears in Banquo stick deep"). Murdering Macduff’s family is gratuitous terror. The "end" transforms from kingship to sheer survival through atrocity.  
  - **Philosophical Insight**: The play shows that *unacknowledged moral remainder corrupts the agent’s ends*. Macbeth’s refusal to sit with guilt ("I am in blood / Stepped in so far...") accelerates his dehumanization. The means *become* the end.  

  **3. The Return of the Remainder: Guilt as Inescapable**  
  - **Banquo’s Ghost**: Macbeth’s hallucination embodies suppressed guilt. His public breakdown ("Thou canst not say I did it!") shows the remainder sabotaging his political control.  
  - **Lady Macbeth’s Sleepwalking**: Her compulsive hand-washing ("Out, damned spot!") literalizes the "stain" of moral remainder. Suppression leads to psychic fracture, not absolution.  
  - **Key Distinction**: For Macbeth, guilt is *weakness* to be crushed; for Lady Macbeth, it’s subconscious self-punishment. The play suggests that *without acknowledging the remainder*, the agent loses grip on reality and purpose.  

  **4. The "Tomorrow" Soliloquy: Nihilism as Consequence**  
  - Macbeth’s despair ("life’s but a walking shadow") reveals the endpoint of corrupted dirty hands: the *extinction of meaning*. When wrongs are committed for hollow ends and guilt is denied, all value—including political power—collapses. This isn’t tragedy in the Greek sense (where suffering has meaning); it’s existential void.  

  ---

  ### Where the Play Complicates/Resists Dirty Hands  
  - **No Public Good, No Justification**: Macbeth never acts for Scotland’s benefit. His rule brings famine and fear ("each new morn / New widows howl"). Dirty hands requires a *genuine* political good to weigh against the wrong—here, that scale is empty.  
  - **The Witches’ Role**: Fate/prophecy muddies agency. If Macbeth is "fated" to kill, is he responsible? The play suggests he *chooses* moral evil (e.g., killing Macduff’s children), implicating him fully.  
  - **Lady Macbeth’s Arc**: Her breakdown underscores that suppressing guilt destroys the *self*, not just political legitimacy. This personal implosion is absent from abstract dirty-hands debates.  

  ---

  ### What *Macbeth* Adds to the Dirty-Hands Debate  
  1. **The Necessity of Suffering**: Abstract philosophy debates whether guilt *should* be felt. *Macbeth* shows it as *inescapable*—a psychological truth. Suppressing it doesn’t absolve; it annihilates.  
  2. **Ambition as Corrupting Frame**: The play exposes how easily "destiny" or "necessity" masks narcissism. Dirty hands must be scrutinized for *true public intent*—without it, the "dirty" act is mere crime.  
  3. **The Body as Site of Remainder**: Lady Macbeth’s somnambulism reveals guilt as embodied trauma. Philosophy treats guilt as cognitive; Shakespeare shows it as visceral, haunting the physical self.  

  **Conclusion**: *Macbeth* is not a clean fit for dirty hands—it’s a cautionary tale against *misusing* the concept to justify personal ambition. Yet it brilliantly dramatizes the corruptive spiral when moral remainder is denied: guilt suppressed doesn’t vanish; it metastasizes, eroding agency and meaning. The play adds that dirty hands, if they exist at all, require a *legible public good* and *unflinching acknowledgment of the wrong*—without which the agent becomes a void "signifying nothing."
