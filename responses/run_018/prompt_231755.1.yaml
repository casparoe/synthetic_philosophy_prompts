answer: |-
  Here’s the disciplined mapping of *Riley v. California* through the lens of Clark and Chalmers' Extended Mind Thesis (EMT), analyzing bidirectional implications:

  **1. Mapping EMT onto *Riley*: Is the Phone a Protected Part of the Mind?**
  *   **Cognitive Agent/System:** Under EMT, the cognitive agent is "Otto-with-phone," analogous to "Inga-with-biological-memory." The phone, when reliably coupled and trusted, is a proper part of Otto’s extended cognitive system.
  *   **Meeting EMT Criteria:** For the phone to qualify as part of the mind under EMT, it must satisfy:
      *   **Reliable Access:** Constant availability (carried/accessed routinely).
      *   **Automatic Endorsement:** Information is typically used without verification (trusted implicitly like biological memory).
      *   **Past Use:** Integrated into cognitive practices (e.g., contacts, schedules, reminders).
      *   **Accessibility/Portability:** Readily available when needed.
      *   *Assessment:* Modern smartphones likely meet these criteria for many users. Contacts, calendars, notes, maps, even search history function as external memory stores accessed automatically and trusted.
  *   **What Was the Court Protecting?** If EMT holds, the Court *could* be interpreted as protecting an *integral part of the cognitive self* – not just an object, but the externalized biological memory and reasoning processes. The warrant requirement would safeguard the integrity of the extended mind itself from state intrusion, akin to protecting internal thought processes. The Court’s emphasis on the phone’s role as a "digital record of nearly every aspect of [our] lives" resonates with this view of cognitive extension.
  *   **Disconnect with Court's Reasoning:** However, the Court’s ruling rests *explicitly* on **informational privacy and autonomy** (Fourth Amendment), *not* on the ontological status of the phone as part of the mind. The focus is on the *unprecedented quantity and intimacy of data* stored, enabling intrusion into private life, and the need for judicial oversight for such a significant invasion. EMT doesn’t inherently demand privacy protection for the notebook; it’s about cognitive function. The Court protects the *content* because it reveals private life, not because it *constitutes* the mind. EMT struggles to explain why searching a *trusted* notebook (or phone) is a privacy violation if it’s *part of* the transparent cognitive process.

  **2. Mapping *Riley* onto EMT: What Does the Case Reveal About the Theory?**
  *   **Confirming Parity (Weakly):** *Riley* recognizes the phone’s functional parity with biological memory *in terms of information storage and retrieval capacity*. The Court acknowledges it holds vastly more, and more intimate, information than a wallet or address book ever could, implicitly granting it a unique status *functionally* analogous to internal memory.
  *   **Exposing Problems for EMT:**
      *   **The Legal Line-Drawing Problem:** Law requires clear boundaries (mind/body, self/property, testimonial/non-testimonial). *Riley* treats the phone as a *container of private information*, **not** as part of the *testimonial self*. Compelling production of its contents isn’t seen as compelling self-incrimination (Fifth Amendment) in the way accessing biological memory would be. This highlights EMT’s difficulty in practical, legal contexts where distinctions *must* be made. The phone is special due to its *contents*, not its constitutive role.
      *   **Access ≠ Transparency:** EMT requires "automatic" access akin to biological recall. *Riley* reveals a gap: Phone access often involves deliberate interaction (unlocking, opening apps, searching), differing from the effortless, subconscious nature of much biological memory retrieval. The Court’s focus is on accessing the *stored data*, not the *process* of accessing it. EMT’s requirement of "transparent" access (like perception) isn’t fully met by typical phone use, weakening the "parity" argument in this legal context.
      *   **Endorsement vs. Privacy:** EMT’s "automatic endorsement" doesn’t equate to waiving privacy expectations. One can trust the information *when accessed* but still demand control over *who else accesses it*. The Court protects the latter, an aspect EMT doesn’t inherently address.
  *   **Where EMT is Silent:** EMT is silent on **informational privacy** as a distinct value. It doesn’t explain why accessing *constitutive external memory* should require a warrant if the access is "transparent" to the user. The theory also lacks a framework for adjudicating *degrees* of coupling or trust relevant to legal thresholds.
  *   **Court's Near-Miss Recognition:** The Court gets close to treating the phone as part of the self by emphasizing its role as an "inseparable" and "pervasive" record of personal identity and life, creating an unprecedented potential for intrusion into personal life and autonomy. This recognizes the phone’s **functional integration into identity and selfhood** without explicitly endorsing the metaphysical claim that it *is* part of the mind. The ruling hinges on the *consequences* of access (invasion of privacy/autonomy), not the *nature* of the accessed system.

  **Summary:** While *Riley* implicitly acknowledges the phone's *functional parity* with biological memory regarding information storage (supporting EMT superficially), the ruling rests decisively on distinct privacy/autonomy grounds that EMT neither requires nor fully explains, and the case exposes EMT's practical limitations in legal contexts demanding clear boundaries between the protected self and external property.
