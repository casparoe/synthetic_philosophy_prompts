  First angle: mapping Riley onto extended mind. The phone-as-mind-part idea hinges on Clark/Chalmers' criteria: reliability, automaticity, trust, etc. If the phone meets those (like Otto’s notebook), then the Court’s warrant requirement isn’t just about privacy but protecting literal cognitive architecture. But wait—does Riley’s reasoning actually align? The ruling emphasizes the phone’s storage capacity ("digital record of nearly every aspect of lives"), not seamless cognitive integration. That’s a privacy argument, not an endorsement of extended cognition.  

  Second angle: what Riley does to the theory. The case exposes a gap in extended mind—legal systems need bright lines between "self" and "property," while the thesis blurs them. Biological memory gets absolute protection under the Fifth Amendment; phones don’t. And automatic access? Scrolling through photos isn’t like recalling a memory—it’s deliberate interaction. The theory can’t explain why courts treat these differently.  

