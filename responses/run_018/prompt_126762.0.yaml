answer: |-
  Your analysis captures a profound and widely recognized flaw in certain formulations of karmic theory – a flaw that philosophers and scholars of religion have indeed scrutinized. While no single universally accepted term exists *exclusively* for this *specific bidirectional temporal accounting*, the phenomenon is well-described within several conceptual frameworks:

  1.  **Immunizing Stratagem (or Ad Hoc Rescue):**
      *   **Description:** This is the broadest category. Karl Popper's concept of falsifiability highlighted how theories can be shielded from refutation by introducing auxiliary hypotheses. Your example is a *specific type* of immunizing stratagem.
      *   **Application:** The karmic theory is immunized against counter-evidence (e.g., the wicked prospering, the good suffering, or outcomes suggesting imbalance) by dynamically re-interpreting the *temporal direction of causality* depending on what needs to be explained. The "auxiliary hypothesis" here is the flexible rule: *"Present suffering is always caused by past demerit; present good fortune is always caused by past merit (even if previously unaccounted for). Future outcomes are irrelevant to settling the current account."*
      *   **Distinction:** What makes your case *specific* is not just the ad hoc element, but the **systematic inversion of causal directionality** based solely on preserving the appearance of perfect current desert.

  2.  **Self-Sealing Belief System:**
      *   **Description:** This term, often used in psychology and sociology of belief (e.g., Carol Tavris, Elliot Aronson), describes systems structured to interpret *any* event as confirmation. Disconfirming evidence is reinterpreted to fit the core belief.
      *   **Application:** The karmic accounting system you describe is inherently self-sealing. No sequence of welfare states can falsify it because the rules for assigning moral causality (past deficit vs. future credit/spending surplus) are applied post hoc to make the current state always appear as perfect desert. Good fortune for the sufferer *must* be due to a surplus/spending, never an overpayment; misfortune for the fortunate *must* be a new debt, never a depletion of their "account."
      *   **Fit:** This term captures the core function well – the system seals itself against disconfirmation by its internal flexibility.

  3.  **The Just-World Hypothesis as an Immunizing Strategy:**
      *   **Description:** Melvin Lerner's Just-World Hypothesis (JWH) posits a cognitive bias to believe the world is fundamentally fair, leading people to reinterpret evidence of injustice. Philosophers like Steven Jay Gould have critiqued how JWH functions as an *immunizing strategy* for religious or metaphysical beliefs in cosmic justice.
      *   **Application:** Your bidirectional accounting is a *mechanism* by which belief in a karmic just-world is maintained. The suffering *must* deserve it (past debt), the fortunate *must* deserve it (past credit), and any change in state *must* be explained by a new moral transaction (new merit or demerit), preserving the illusion of current justice.
      *   **Distinction:** The focus here is on *why* the system exists (maintaining belief in cosmic justice) and how it achieves it (the specific bidirectional accounting).

  4.  **Post Hoc Rationalization with Rule Inversion:**
      *   **Description:** Post hoc rationalization is explaining something after the fact to make it fit a desired narrative. Your case is a *highly specific and systematic form* of it.
      *   **Application:** The rationalization doesn't just add an explanation; it *inverts the fundamental rule of temporal attribution* depending on the immediate need: Is the current state negative? Then causality points *backward* to past sin. Is the current state positive for someone who suffered? Causality *cannot* point backward to imply overpayment (which would break desert); it must point forward to spending a surplus or be explained by a *new* past cause (accumulated merit). The rule itself ("past causes present") is only consistently applied when it serves the desert narrative; otherwise, it's suspended or reversed.
      *   **Distinction:** The **bidirectionality and rule inversion** based on outcome is the key differentiator from simple post hoc rationalization.

  **How to Demarcate It:**

  1.  **From Ordinary Auxiliary Hypotheses:**
      *   **Core Mechanism:** An auxiliary hypothesis typically *adds* a component or adjusts a parameter (e.g., "friction exists," "the measurement was imprecise"). This karmic maneuver involves the **dynamic inversion of the core causal-temporal framework itself** (past->present vs. present->future accounting) depending on the data point. The *rule for applying causality* changes, not just an added factor.
      *   **Scope:** It's not a local fix for a specific anomaly; it's a **global, systemic flexibility** designed to handle *any* welfare sequence.
      *   **Directionality:** It explicitly relies on **bidirectional moral accounting** where the direction is chosen post hoc.

  2.  **From Simple Post Hoc Rationalization:**
      *   **Systematicity & Rules:** Simple rationalization might be ad hoc and inconsistent. This system has an *implicit rule structure*: "Always interpret the present state as perfect desert by flexibly assigning the direction of moral causality (past debt or future credit/spending) as needed."
      *   **Inversion:** The hallmark is the **inversion of the temporal attribution rule** (past causes present vs. present causes future/spends past surplus) based *solely* on which interpretation preserves the appearance of current desert. Simple rationalization doesn't necessarily involve flipping core causal principles.
      *   **Boundary Condition:** If the explanation for a state change **always attributes suffering to a *past* cause and good fortune (for a prior sufferer) to either a *new* past cause (hidden merit) or the *spending* of a past cause (surplus), while *never* allowing a prior cause to be seen as *overpaid* by subsequent good fortune or *exhausted* by subsequent misfortune for the fortunate**, you have this specific structure. It's the **asymmetry in temporal direction assignment contingent on valence change** that defines it.

  **Conclusion:**

  While no single term perfectly and exclusively names this "bidirectional, self-sealing bookkeeping," it is most precisely described as a **Self-Sealing Belief System** employing a **specific Immunizing Stratagem characterized by post hoc temporal redirection and inversion of moral causality** to preserve the illusion of perfect, instantaneous cosmic desert inherent in that particular formulation of karma. It's a systematic, asymmetric application of moral accounting rules where the direction of causality (past->present vs. present->future/spending past) is dynamically chosen to immunize the core belief in perfect current desert against any possible empirical observation of welfare distribution over time.

  Philosophers discussing the (un)falsifiability and potential vacuity of certain karmic theories (e.g., critiques resembling those leveled against certain theodicies) frequently highlight this *specific maneuver* as a core weakness, even if they don't give it a unique name beyond labeling it an immunizing strategy or self-sealing rationalization with a peculiar temporal flexibility. Your description of the "bidirectional, self-sealing bookkeeping" is an excellent characterization of the phenomenon itself.
