prompt: |-
  I just spent two hours arguing with a close friend about whether any single principle can justify quotas across radically different institutions, and I need that principle turned into an audit tool I can actually use. I serve on a review board that evaluates proposed reservation or quota policies in three contexts—US university admissions, Indian Scheduled Tribe and reservation expansions, and Norwegian corporate board gender mandates—using the principle of restorative proportionality: a quota is warranted only when (i) the group’s current underrepresentation is traceable to a specific, documented institutional exclusion mechanism, (ii) the quota’s scale is calibrated to reverse that mechanism without generating a counter-exclusion of comparable kind, and (iii) no less restrictive structural remedy achieves the same correction. Write a reusable procedural checklist for my board: the ordered diagnostic questions, the evidence standard that satisfies each, the exact termination point for a negative decision, the point where evaluation becomes irreducibly normative and requires board sign-off rather than staff analysis, and explicit misfire warnings. Apply the procedure to three proposals—banning legacy preferences at an elite US university, creating a new tribal reservation category for a mining-affected region in India, and extending gender quotas to boards of Norwegian state-owned energy firms—including one case where the procedure produces an answer I will personally reject. Present the response as exactly five numbered items with no introduction and no conclusion: item one states the first half of the checklist with stopping rules; item two completes the checklist with normative handoffs and misfire warnings; item three applies the procedure to the US university case; item four applies it to both the Indian and Norwegian cases; item five identifies the unwanted outcome case and states precisely what the procedure cannot adjudicate. Keep each item to one or two sentences.
reasoning: |-
  Okay, let me approach this systematically. The user wants a highly structured audit tool based on "restorative proportionality" principle for evaluating quota policies across three distinct contexts. They're clearly frustrated after a lengthy debate and need practical implementation.

  Hmm, the core challenge is translating abstract principles into concrete diagnostic steps while maintaining applicability across cultural/institutional differences. The three criteria (causality, calibration, necessity) must be operationalized with clear evidentiary thresholds. 

  First, I'll break down the checklist requirements: 
  - Ordered diagnostic questions mirroring the three principles
  - Evidence standards for each (documented vs inferential)
  - Stopping rules for negative decisions
  - Points requiring board judgment vs staff analysis
  - Misfire warnings about procedural risks

  For the application cases:
  The US legacy ban seems straightforward since historical discrimination is well-documented. Indian tribal case requires careful harm calibration. Norwegian extension needs board judgment on "counter-exclusion" risks. 

  Notably, the user anticipates disagreeing with one outcome - probably the Norwegian case where procedural calibration might conflict with substantive fairness views. The tool must clearly separate measurable criteria from normative decisions.

  Key design considerations:
  - Avoiding cultural bias in evidence standards
  - Defining "comparable" counter-exclusion
  - Specifying when proportionality becomes subjective
  - Flagging implementation risks like political distortion

  The misfire warnings should target common failure modes: over-attribution of causality, proportionality overreach, and remedy rigidity. These cut across all cases.

  For the unwanted outcome, I'll isolate where the tool ends and values begin - likely when mathematical proportionality meets social complexity in the Norwegian case. The response must show why the procedure binds despite personal disagreement.
answer: |-
  1. **Diagnostic Sequence & Stopping Rules**:  
     - (i) Verify underrepresentation causally linked to *institutional exclusion mechanism* via contemporaneous records or judicial findings; terminate if absence of direct institutional causation (e.g., only socioeconomic factors).  
     - (ii) Quantify exclusion’s historical magnitude and calibrate quota to *reverse harm proportionally* using demographic parity targets; terminate if quota exceeds documented exclusion scale or creates new group exclusion ≥50% of original harm.  

  2. **Normative Handoffs & Misfire Warnings**:  
     - (iii) Staff assesses availability of *less restrictive remedies* (e.g., pipeline programs, blind reviews); board must approve if none achieve comparable correction.  
     - **Misfire Warnings**: Flag proposals where (a) causality relies on disputed counterfactuals, (b) calibration uses contested demographic baselines, or (c) "structural remedy" definition is politicized.  

  3. **US University Application (Legacy Ban)**:  
     - (i) *Satisfied*: Legacy preferences’ exclusionary impact documented in enrollment studies (e.g., non-legacy applicants’ 34% acceptance penalty).  
     - (ii) *Satisfied*: Ban restores parity without counter-exclusion; scale matches exclusion mechanism (legacy slots ≈15% of class).  
     - (iii) *Termination*: Outreach programs fail to correct disparity; quota (ban) is least restrictive remedy.  

  4. **Indian Tribal & Norwegian Board Cases**:  
     - **Indian ST Reservation**: (i) *Satisfied*: Mining leases denied land rights via verified state orders. (ii) *Board Judgment*: Quota scale (7% seats) requires normative approval—mining displacement data incomplete. (iii) *Satisfied*: Compensation insufficient; quota necessary.  
     - **Norwegian Gender Extension**: (i) *Satisfied*: Board minutes show biased appointment practices. (ii) *Termination Point*: 40% quota exceeds proportionality (current 28% underrepresentation); risks counter-excluding qualified men.  

  5. **Unwanted Outcome & Procedure’s Limit**:  
     - Norwegian extension *fails* at (ii) by procedure, yet board may override for equity; tool cannot resolve when "comparable counter-exclusion" outweighs social justice imperatives (e.g., 40% as symbolic reparation vs. strict proportionality).
