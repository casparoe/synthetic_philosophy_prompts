prompt: |-
  I was re-reading Lewis's stuff on convention—y'know, the idea that driving on the right is just a cordination problem solved by salience and precedent, with common knowledge keeping everyone in line. And I got stuck on Sweden's Dagen H in 1967, when they switched from left to right literally overnight after decades of left-hand driving. It feels like a wierd test case because it wasn't some organic evolution of norms; the government ripped up the old convention and used massive road-sign campaigns and media blitzes to manufacture a new focal point.

  Can you analyze Dagen H through Lewis's lens? I want a careful mapping: who are the actual players (individual drivers, the state, maybe pedestrians?), what does the coordination problem look like once the switch is announced, and what counts as the 'solution' in Lewis's technical sense? Then tell me what the theory explains well—maybe how the post-switch stability shows precedent locking back in—and what it totally misses or gets wrong. Specifically, does Lewis's account have room for a top-down authority breaking an existing precedent and imposing salience, or does that break his evolutionary story about conventions spreading because they serve mutual interest?

  Also, be honest about where the theory is silent. For instance, Lewis emphasizes arbitrariness—left vs right is mostly arbitrary—but Sweden faced huge transition costs, temporary chaos, and accidents. Does his framework say anything meaningful about those friction costs? And does this case argue that norms can be deliberately engineered, undermining the naturalistic vibe? Don't just rehash the QWERTY comparison everyone makes; instead, use Dagen H to probe whether authority-based salience is just a special case of Schelling-style focal points or a genuine anomaly for Lewis. No need for citations or reading lists—just work through the concepts.
reasoning: |-
  Okay, the user wants me to analyze Sweden's Dagen H through David Lewis's convention theory. Let me start by recalling Lewis's key ideas. Conventions solve coordination problems through salience, precedent, and common knowledge. They evolve organically when people repeatedly interact and settle on a solution that benefits everyone. But Dagen H is different—it's a government-imposed switch from left to right driving overnight. How does that fit?

  First, I need to identify the players. Lewis usually considers individuals, but here the state is a major player. Drivers, pedestrians, and the government are all involved. The coordination problem after the announcement is critical. Everyone knows the switch is coming, so the old precedent is void. The new focal point is the date and time set by the government. Salience here is top-down, not emergent. 

  Common knowledge is crucial. The state's massive campaign ensured everyone knew about the switch and that others knew too. That's different from Lewis's gradual common knowledge buildup. Post-switch, precedent kicks back in. Each successful right-side drive reinforces the new convention. Stability returns, which Lewis would explain well. 

  But where does Lewis fall short? His model is bottom-up, evolving from repeated interactions. Dagen H shows an authority breaking precedent, which Lewis doesn't address. Also, the transition costs—accidents, chaos—aren't covered. Lewis assumes conventions are low-cost once established, but switching has high friction. 

  The user also asks if norms can be engineered. Dagen H proves they can, but Lewis's theory doesn't account for top-down imposition. They might wonder if authority is a special case of focal points. The government created salience, but it's different from Schelling's organic focal points. This might challenge Lewis's naturalistic evolution. 

  Silent areas: transition costs, role of authority, and the intentional design of conventions. The user wants a deep dive without QWERTY comparisons. They're likely a student or scholar in philosophy or social sciences, probing the limits of Lewis's theory. Their deeper need is understanding how top-down interventions fit into convention theory and whether such cases require expanding the model. I should address how Dagen H exposes gaps in Lewis's framework regarding authority and engineered norms.
answer: |-
  Here's a breakdown of Dagen H through David Lewis's lens of convention, pinpointing both explanatory power and limitations:

  **Lewis's Core Framework Applied:**

  1.  **Players:** Primarily *individual drivers* interacting pairwise and en masse on the road. Pedestrians, cyclists, and public transport operators are secondary players whose coordination depends largely on driver behavior. Crucially, **the State** acts as a distinct, dominant player initiating and structuring the coordination problem.
  2.  **Coordination Problem Post-Announcement:**
      *   **The Problem:** Everyone knows the *old* coordination equilibrium (drive left) will cease to exist at a specific time. A *new* equilibrium (drive right) is mandated. The problem becomes: *How do we all coordinate on the new equilibrium starting precisely at H-Hour, despite decades of ingrained habit favoring the old?*
      *   **Mutual Interest:** The mutual interest remains paramount – avoiding collisions. This intensifies during the transition; failure to coordinate is potentially catastrophic.
      *   **Arbitrariness:** The *direction* (right vs. left) is still arbitrary *in principle*. However, the *choice* is no longer emergent; it's dictated.
      *   **Precedent:** Precedent is actively *hostile* to the new solution. Habit strongly favors left.
      *   **Salience:** This becomes the critical lever. The government doesn't wait for a new precedent to emerge; it *manufactures* salience:
          *   **The Date/Time (Dagen H / H-Hour):** This is the ultimate focal point. It's unambiguous, universally known, and impossible to ignore.
          *   **Massive Campaigns:** Signs, media, symbols (like the Dagen H logo), and public instructions bombard everyone, making the *act of switching at the specified time* overwhelmingly salient.
          *   **Legal Mandate:** The law establishes the new rule, adding normative weight to the salience of switching.
  3.  **The "Solution" (in Lewis's Technical Sense):**
      *   The solution is the new coordination equilibrium: *Drive on the right*.
      *   **Achieving the Solution:** On Dagen H, at H-Hour, a critical mass of drivers *simultaneously* attempts to drive on the right, *expecting* others to do the same *because* the time, the campaign, and the law have made this action supremely salient. This shared expectation, underpinned by common knowledge of the campaign and the mandate, allows the switch to happen en masse.
      *   **Stabilization:** Once the switch occurs, each successful interaction (cars passing without collision on the right) immediately begins establishing a *new precedent*. This new precedent rapidly reinforces the salience of driving right, leading to the stable, self-perpetuating convention Lewis describes. The mutual interest in safety locks it in.

  **What Lewis Explains Well:**

  1.  **Post-Switch Stability:** Lewis perfectly captures *why* the new rule stuck. Once driving on the right became the established behavior after H-Hour, it fulfilled all criteria: mutual interest (safety), precedent (each right-side drive reinforced it), and salience (it was now the obvious thing to do). Common knowledge of this new precedent solidified it.
  2.  **The Role of Salience:** Lewis's emphasis on salience as a coordination mechanism is powerfully validated. The government understood that to overcome the massive precedent of left-driving, they needed to create an *unignorable focal point* for the switch itself (H-Hour) and the new rule (the campaign). It worked *because* salience works for coordination.
  3.  **Mutual Interest as the Engine:** The fundamental driver – the mutual desire to avoid death and injury – remained constant and provided the ultimate incentive for individuals to try to conform to the new salience, despite the friction.

  **Where Lewis's Framework Falls Short or is Silent:**

  1.  **Top-Down Authority Breaking Precedent:** This is the core challenge to Lewis's naturalistic evolution. His model typically describes conventions emerging *from* repeated interactions solving coordination problems where precedent builds gradually. Dagen H shows a powerful external agent **deliberately destroying an existing, deeply entrenched convention** and **imposing a new focal point/salience by fiat and massive campaign**. Lewis's framework *lacks explicit mechanisms* for this. It struggles to account for:
      *   The *initiation* of the change against established precedent.
      *   The *source* of the new salience (state power/media, not organic emergence or Schelling-style natural prominence).
      *   The **cost of breaking precedent**. Lewis focuses on the stability of *existing* conventions, not the friction of *overthrowing* one.
  2.  **Friction Costs of Transition:** Lewis's framework is largely silent on the intense, real-world costs of *switching* conventions, precisely because it assumes conventions evolve to solve problems *as they arise*, not that they are forcibly changed. Dagen H involved:
      *   **Massive Investment:** Retrofitting intersections, changing signs, public education campaigns.
      *   **Temporary Chaos:** Predictable accidents and confusion during the switch, despite the planning.
      *   **Psychological Cost:** Overcoming deeply ingrained habit under pressure.
      Lewis's model, focused on the equilibrium state, doesn't provide tools to analyze these transition costs meaningfully. The "arbitrariness" of left vs. right becomes irrelevant when the *change itself* is massively costly.
  3.  **The Nature of Salience:** Dagen H blurs the line. Was the government-imposed salience just a very strong Schelling focal point (like a unique deadline)? Or is it fundamentally different because it relies on **authority and coercion** (law + massive propaganda) rather than natural prominence or mutual recognition? Lewis leans towards the latter being emergent; Dagen H suggests authority can *create* salience ex nihilo in a way his model doesn't fully encompass.
  4.  **Intentional Norm Engineering:** Lewis's conventions feel organic, spreading because they serve mutual interest. Dagen H is a stark example of **deliberate, large-scale social engineering of a fundamental norm**. The state didn't discover a solution; it imposed one. While mutual interest (safety) justified it, the *method* was top-down imposition, not bottom-up convergence. This demonstrates norms *can* be engineered, challenging the purely naturalistic "vibe" of Lewis's account.

  **Authority-Based Salience: Special Case or Anomaly?**

  Dagen H suggests authority-based salience is **both a special case and a challenge**:

  *   **Special Case of Focal Points?** Yes, in the sense that the government successfully *created* a focal point (H-Hour, the new rule) that solved the acute coordination problem of *when* and *how* to switch. Schelling's logic applies: given the campaign, switching at H-Hour *was* the salient solution.
  *   **Genuine Anomaly for Lewis?** Yes, in the deeper sense of **convention formation and overthrow**:
      *   **Source:** The salience originates from authority and power, not from the interaction dynamics of the coordinating population.
      *   **Breaking Precedent:** It actively destroys an existing stable convention through force (legal mandate) and resource expenditure (campaign), which Lewis's model doesn't anticipate.
      *   **Scale and Speed:** It achieves near-instantaneous, society-wide coordination on a new rule, bypassing the iterative, precedent-building process Lewis describes.

  **Conclusion:**

  Dagen H is a powerful real-world test of Lewis. It brilliantly confirms his core insights about **salience solving acute coordination problems** and **precedent locking in stability** *after* the switch. However, it exposes key limitations: Lewis's model is **weak on explaining the deliberate destruction of existing conventions by authority**, **silent on the high costs of transition**, and **underplays the role of top-down power in *creating* the salience needed to establish a new convention against strong precedent**. It demonstrates that while conventions *function* according to Lewisian logic once established, their *origin and radical change* can be driven by forces – like a determined state – that operate outside his primary evolutionary, bottom-up narrative. Authority-based salience leverages Schelling's focal point logic but injects an external power that Lewis's theory doesn't fully integrate. Dagen H argues that norms *can* be deliberately engineered, albeit at significant cost, challenging the purely emergent picture.
