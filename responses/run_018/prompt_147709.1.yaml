prompt: |-
  You are a professional philosopher of history with some philosophy-of-science background. Please think step-by-step and begin with a quick brainstorm of criteria before laying them out properly. I want the bottom line in the first sentence only, then the reasoning straight after, with no preamble and no restating of my question. Use British English throughout.

  I'm a retired field ecologist — spent thirty years watching forest sucession after disturbance — and I've recently fallen into reading philosphy of history, mainly because I kept seeing analogies between ecological succession and the way people talk about 'progress'. I was chatting with a historian friend who pointed out that Whig history isn't just 'the past led to us'; it's also a kind of retrospective coherence fallacy, where we treat contingent branching events as if they were convergent evolution heading for a predetermined endpoint. So I want the full desiderata spec for a genuinely non-Whiggish theory of historical writing or interpretation. What must it actually be able to do? Give me the requirements: the phenomena it has to explain (like why pattern-seeking brains see teleology in noise), the distinctions it must preserve (say, between explaining an outcome and morally endorsing it, or between diachronic contingency and synchronic functional explanation), the findings from biology or cognitive science it can't contradict, and the hard cases it needs to handle (writing about scientific revolutions or social reforms without treating present norms as inevitable). For each, say whether it's non-negotiable or just a nice-to-have, and tell me which single requirement does the most damage to the usual casual accounts. A table is fine, but keep the weight on the criteria and their motivations rather than on scoring theories. Don't bother with bibliographies or author lists — I couldn't check them without searching, and I want to see the conceptual work bare.
reasoning: |-
  Hmm, the user is a retired field ecologist with 30 years of experience studying forest succession. They've noticed parallels between ecological processes and how historians discuss "progress," particularly criticizing Whig history as a "retrospective coherence fallacy." They want a strict specification for non-Whiggish historical theory, framed like an engineering requirements document.

  They're clearly frustrated with teleological narratives that treat history as inevitable progress toward the present. Drawing from ecology, they understand contingency and branching events deeply. Their historian friend has sharpened this critique by framing Whiggishness as misapplying convergent-evolution logic to human affairs. 

  The core challenge is translating ecological thinking into historiography. The user wants concrete criteria that prevent: 
  - Mistaking contingency for inevitability 
  - Confusing explanation with moral endorsement 
  - Projecting current values onto past actors 
  - Overlooking path-dependency in "progress" narratives 

  Key requirements must address cognitive biases (why we see patterns in noise), maintain crucial distinctions (like separating functional from teleological explanations), respect scientific constraints (e.g., how memory systems reconstruct past events), and handle tough cases like scientific revolutions without presentism. 

  Most importantly, they demand prioritization - which single criterion would dismantle casual Whiggishness most effectively? That's clearly the contingency requirement, as it directly attacks the illusion of inevitability that enables all other Whiggish moves. 

  The response should mirror their no-nonsense style: crisp British English, zero fluff, conceptual rigor over citations. The table format works if it emphasizes motivations over scoring, keeping the focus on why each criterion matters ecologically and historiographically. No bibliographies - just naked logic.
answer: |-
  **A non-Whiggish theory must rigorously exclude teleology while explaining narrative coherence-seeking, maintain key distinctions, respect cognitive science, and handle normatively charged historical shifts.**  

  | Requirement                                                                 | Type          | Motivation & Criticality                                                                                                                               | Most Damaging to Casual Whiggishness? |
  | :-------------------------------------------------------------------------- | :------------ | :----------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------ |
  | **1. Explain pattern-seeking & teleological illusion in historical narratives** | Non-negotiable | Accounts for cognitive bias (apophenia, hindsight bias) making contingent events *feel* inevitable; explains *why* Whiggish narratives arise naturally. | No                                    |
  | **2. Maintain distinction: Explaining an outcome ≠ Moral/political endorsement** | Non-negotiable | Prevents justifying past oppression/violence as "necessary steps" or judging past actors solely by present standards. Crucial for ethical historiography. | No                                    |
  | **3. Maintain distinction: Diachronic contingency vs Synchronic functional explanation** | Non-negotiable | Ensures analysis of *how* a system worked at time T doesn't imply it *had* to exist or evolve toward T. Vital for avoiding functionalist teleology.         | **YES** (Core failure of Whiggishness) |
  | **4. Respect cognitive science: Memory/recall ≠ accurate replay**           | Non-negotiable | Historical sources are reconstructions, not recordings. Theory must handle flawed, motivated testimony without imposing false coherence.                | No                                    |
  | **5. Handle 'progress' narratives (scientific/social reform) sans teleology** | Non-negotiable | Must explain *change* (e.g., scientific paradigm shifts, suffrage movements) without framing present state as the goal or inevitable endpoint.            | No                                    |
  | **6. Accommodate complex causality (path-dependence, multiplier effects)**  | Non-negotiable | Reflects historical reality (like ecological succession): small contingencies branch into significant, irreversible outcomes, defying linear "progress". | No                                    |
  | **7. Acknowledge actors' teleological beliefs without endorsing them**      | Non-negotiable | Past actors *did* have goals; theory must incorporate this subjective dimension while denying objective historical teleology.                           | No                                    |
  | **8. Explain retrospective coherence without causation**                    | Nice-to-have   | Desirable: Explains *why* narratives feel cohesive post-hoc (e.g., survivorship bias, narrative smoothing) without implying actual causal necessity.    | No                                    |

  ### Reasoning
  *   **Non-negotiable Core:** Items 2, 3, 5, 6, and 7 are essential. Failure here collapses into Whiggishness or moral relativism. Item 3 (**Diachronic vs Synchronic Distinction**) is the **linchpin**. Casual Whiggishness constantly conflates explaining *how* something functioned within its context (synchronic) with explaining *why* it came to be or *had* to develop (diachronic teleology). Rigorously enforcing this distinction dismantles the illusion of inevitability fundamental to Whiggish narratives.
  *   **Cognitive Foundation:** Item 1 (explaining bias) and 4 (respecting memory science) prevent the theory from being naive about *why* Whiggishness is tempting and how sources constrain objectivity.
  *   **Hard Cases:** Item 5 (scientific/social 'progress') is the acid test. A non-Whiggish theory must account for phenomena like the rise of experimental science or democracy *without* implying they were the necessary culmination of prior history or morally superior endpoints. It must show how contingent victories of specific ideas/groups led to new norms *treated* as progress retrospectively.
  *   **Contingency is King:** Item 6 (complex causality) is inseparable from non-Whiggishness. Like ecological succession after disturbance, history involves sensitive dependence on initial conditions, feedback loops, and unrepeatable conjunctions. The theory must model this.
  *   **Agency vs Teleology:** Item 7 prevents throwing out intentionality with teleology. Actors pursued goals, but the historical *outcome* wasn't the goal of the process itself. The theory must incorporate purposeful action without implying History had a purpose.
  *   **Coherence ≠ Causation:** Item 8 is desirable refinement. Explaining *why* we *construct* coherent stories post-hoc (like finding patterns in forest succession stages) further inoculates against mistaking narrative for necessity, but isn't strictly essential if the core distinctions hold.
