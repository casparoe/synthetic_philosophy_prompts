prompt: |-
  I chair the ethics review board for a mid-sized municipality, and every month we must approve, reject, or send back development proposals that pit genuinely different kinds of goods against one another—ecological resilience, cultural continuity, distributive justice, intergenerational fairness—where no single metric (cost-benefit, utility, rights-based veto) can settle the matter. I need a reusable decision procedure that my board can run in a ninety-minute session, with no philosophers present and no quantitative aggregation of values, that operationalizes the idea that values can be incommensurable (not reducible to a common scale) without being incomparable, and that distinguishes hard choices—where reason constrains the permissible options but does not uniquely determine one—from cases where a master principle or dominance relation actually applies.

  Please construct the procedure as an ordered sequence of questions, tests, and stopping conditions, with explicit flags for every point where judgment cannot be eliminated and must be documented in writing by the board. The procedure should be usable by a trained planner or attorney without philosophical training, but it must preserve the conceptual distinctions: do not collapse incommensurability into “weighing pros and cons,” and do not allow hidden domain collapse (for example, treating cultural identity as merely an economic preference).

  The procedure must include the following stages:

  1. Domain identification: list the value domains genuinely at stake in the proposal, with a check for hidden collapse or omission.
  2. Translation audit: test whether rendering any domain in decision-relevant terms has caused “value leakage” (a loss of normative force specific to that domain), with concrete indicators of distortion.
  3. Dominance and critical-threshold screen: reject if one option is worse in every domain; flag for exceptional justification if any domain reaches severe, irreversible harm.
  4. Comparative judgment stage: for remaining cases, since scores cannot be summed, articulate a context-specific reason why one option is more appropriate, tied to the board’s mandate. Include a “structural parity” protocol for when reasons across domains are genuinely on a par: rather than arbitrary selection, the board must record a “contextual priority commitment” with a justification specific to the proposal’s scope.
  5. Hard-choice protocol: produce an answer the board will not like—specifically, approve a proposal that causes irreplaceable harm in one domain because no permissible alternative exists, requiring a signed “hard choice” record.

  Then apply the procedure to three concrete proposals:

  A. Rerouting a flood-defense canal through a century-old immigrant-market district (cultural continuity, local economic identity) versus leaving an adjacent low-income neighborhood exposed to projected flooding (distributive justice, ecological adaptation).

  B. Funding immediate elder-care expansion versus long-term climate-hardening infrastructure, both serving vulnerable populations but across different temporal frames.

  C. One additional case of your own design that tests the structural-parity protocol, where two options each cause severe harm in different domains and neither dominates.

  For each application, show exactly where the procedure stops with a clear answer, where it demands a judgment call, and what the written sign-off must contain. Finally, state explicitly what the procedure cannot do—for example, resolve disputes about the board’s mandate itself, eliminate moral regret, or substitute for democratic input on value priorities. Do not provide bibliographies, reading lists, or citations; do not quote specific texts.
reasoning: |-
  We are constructing a reusable decision procedure for an ethics review board that handles development proposals with incommensurable values. The procedure must be executable in 90 minutes without philosophers and without quantitative aggregation. It must preserve the incommensurability of values and distinguish hard choices.

  The procedure is structured as an ordered sequence of steps:

  **Procedure: Incommensurable Values Decision Protocol (IVDP)**

  **Step 1: Domain Identification**
     - **Action**: List all distinct value domains genuinely at stake in the proposal. Use the board's mandate and standard domains (e.g., ecological resilience, cultural continuity, distributive justice, intergenerational fairness) as a starting point. 
     - **Check for Hidden Collapse/Omission**: For each domain, ask: "Is this domain being reduced to or represented solely in terms of another domain (e.g., cultural identity described only as economic impact)?" If yes, flag and correct by re-describing the domain in its own terms.
     - **Judgment Call**: Board must document the list of domains and any corrections made to avoid collapse. If a domain is omitted, it must be added.
     - **Stopping Condition**: If only one domain is identified and it is uncontested, apply the relevant critical thresholds (Step 3) or master principle if available. Otherwise, proceed.

  **Step 2: Translation Audit**
     - **Action**: For each domain identified in Step 1, examine how it has been rendered in the proposal's analysis (e.g., in reports, impact assessments). 
     - **Test for Value Leakage**: For each domain, ask: "Does the representation of this domain in the decision-relevant terms (e.g., metrics, narratives) preserve its distinctive normative force?" Look for concrete indicators of distortion:
          - *Indicator 1*: The domain is described in units of another domain (e.g., cultural continuity measured only in dollars).
          - *Indicator 2*: The domain's loss or gain is described as fungible (replaceable by something in another domain).
          - *Indicator 3*: The domain's specific narrative (e.g., historical significance, intrinsic value) is absent or reduced to generic terms.
     - **Judgment Call**: If value leakage is found, the board must require a re-description that restores the domain's distinctiveness. If the leakage cannot be corrected, flag the domain as "distorted" and note that it cannot be fairly compared. Document all findings.
     - **Stopping Condition**: If all domains are distorted and cannot be corrected, reject the proposal for inadequate analysis. Otherwise, proceed with the corrected descriptions.

  **Step 3: Dominance and Critical-Threshold Screen**
     - **Action**: Compare the options (including the status quo) across each domain.
     - **Dominance Test**: Check if one option is worse than another in every domain. If so, reject the dominated option (if it's the proposal, reject; if it's an alternative, then the proposal may be acceptable). If the proposal is dominated, reject it. If an alternative is dominated, remove it from consideration.
     - **Critical-Threshold Test**: For each domain, check if any option causes severe, irreversible harm (define per board's guidelines: e.g., extinction of a cultural practice, irreversible ecological damage, displacement without remedy). If an option causes such harm in any domain, flag it for exceptional justification. The board must then ask: "Is there a permissible alternative that avoids this harm?" If not, proceed to Step 5 (hard choice). If yes, that alternative must be chosen unless it causes even worse harm (then proceed to Step 5).
     - **Judgment Call**: Board must document any dominance finding and any critical-threshold breach. For critical thresholds, the board must judge severity and irreversibility (using evidence).
     - **Stopping Condition**: 
          - If dominance is found, the dominated option is rejected. If only one option remains, approve it. 
          - If an option breaches a critical threshold and there is a permissible alternative that avoids it, then the breaching option is rejected. 
          - If no dominance and no critical threshold breach (or if the breach is unavoidable), proceed to Step 4.

  **Step 4: Comparative Judgment Stage**
     - **Action**: For the remaining options (after Step 3), articulate a reason for preferring one option over the other(s) that is tied to the board's mandate and the specific context of the proposal. This reason must not reduce one domain to another but must explain why, in this case, one domain's claim is more compelling.
     - **Structural Parity Protocol**: If the board cannot articulate a context-specific reason that breaks the tie (i.e., the reasons for each option seem equally strong and incommensurable), then the board must record a "contextual priority commitment". This commitment must:
          - Be specific to the scope and mandate of the board (e.g., "Given our mandate to prioritize vulnerable populations in this city, we commit to distributive justice in this case").
          - Be justified by the unique aspects of the proposal (e.g., "Because this neighborhood is the only one with this cultural history...").
          - Not be a general rule but a one-time commitment for this case.
     - **Judgment Call**: The board must document the reason for the choice, or if using the parity protocol, the contextual priority commitment and its justification.
     - **Stopping Condition**: This step produces a decision (approve/reject) for the proposal. If the proposal is approved but causes severe harm (as per Step 3) and there was no alternative, then the approval is conditional on Step 5.

  **Step 5: Hard-Choice Protocol**
     - **Trigger**: Only if the board approves a proposal that causes irreplaceable harm in one domain (as identified in Step 3) because no permissible alternative exists.
     - **Action**: The board must produce a signed "hard choice" record that includes:
          - The domain in which the harm occurs and the nature of the harm.
          - The reason why no alternative was permissible (e.g., all alternatives cause equal or worse harm in other domains, or are infeasible).
          - An acknowledgment that the decision causes moral residue and requires compensatory measures (if applicable) and monitoring.
     - **Judgment Call**: The board must collectively sign the record and attach it to the decision.

  **What the Procedure Cannot Do**:
     - Resolve disputes about the board's mandate (this must be set by higher authority).
     - Eliminate moral regret: hard choices will leave a moral residue.
     - Substitute for democratic input on value priorities: the board works within its mandate.
     - Resolve deep conflicts about the nature of the values (it only structures the comparison).

  ---

  **Application to Concrete Proposals**

  **Proposal A: Rerouting a flood-defense canal through a century-old immigrant-market district vs. leaving an adjacent low-income neighborhood exposed to flooding.**

  *Steps:*

  1. **Domain Identification**:
     - Domains: Cultural continuity (of the immigrant-market district), local economic identity (tied to cultural continuity), distributive justice (for the low-income neighborhood), ecological adaptation (flood protection).
     - Check: Ensure cultural continuity is not reduced to economic terms (e.g., not just about property values). Similarly, distributive justice must include vulnerability and exposure to risk. No collapse found. Proceed.

  2. **Translation Audit**:
     - Cultural continuity: Check if the impact is described only in terms of economic loss (e.g., lost business). If so, require narrative on historical and community significance. Similarly, distributive justice: if only described in terms of property damage, require description of social vulnerability. Assume corrected. Proceed.

  3. **Dominance and Critical-Threshold Screen**:
     - Options: 
          - Option 1: Reroute canal (harms cultural continuity and local economic identity; helps distributive justice and ecological adaptation for the low-income neighborhood).
          - Option 2: Do nothing (harms distributive justice and ecological adaptation; preserves cultural continuity).
     - Dominance: Neither option is worse in every domain. 
     - Critical thresholds: 
          - Cultural continuity: Rerouting causes irreversible harm (destruction of a historic district). 
          - Distributive justice: Doing nothing causes severe harm (flood exposure of a low-income neighborhood, which may be irreversible in terms of loss of life and displacement). 
     - Both options breach critical thresholds in different domains. There is no alternative that avoids both. Flag for hard choice but proceed to Step 4 because neither dominates and both have critical harm.

  4. **Comparative Judgment Stage**:
     - Attempt to articulate a reason: 
          - The board might argue: "Given our mandate to prioritize immediate life-saving interventions for the most vulnerable, we choose rerouting because the flood risk to the low-income neighborhood is imminent and catastrophic." 
          - Or: "Given our mandate to preserve the city's cultural heritage as a core identity, and because the flood risk can be mitigated in other ways (even if not as effectively), we choose to preserve the market district."
     - If the board cannot find a context-specific reason that breaks the tie (i.e., both reasons are equally compelling in their own domains), then they must use the structural parity protocol.
     - **Structural Parity Protocol Example**: 
          - "In this case, we commit to prioritizing distributive justice over cultural continuity because the low-income neighborhood has no alternative flood protection and the market district, while irreplaceable, has potential for adaptive reuse or partial preservation. This commitment is specific to this proposal because the market district's cultural value is partly transferable (e.g., through documentation and relocation support) but the flood risk is imminent and life-threatening."
     - **Judgment Call**: The board must choose and document the reason or the contextual priority commitment.

  5. **Hard-Choice Protocol**:
     - Regardless of the choice, one domain suffers severe harm. Thus, the board must issue a hard-choice record. 
          - If they choose rerouting: "We cause irreversible harm to cultural continuity and local economic identity. But no alternative exists that protects the low-income neighborhood without this harm. Compensatory measures: fund cultural preservation and support for displaced businesses."
          - If they choose doing nothing: "We cause severe harm in distributive justice (exposing the low-income neighborhood to flood risk) and ecological adaptation. Compensatory measures: implement temporary flood defenses and accelerate alternative protections."

  **Where it stops**: After Step 4, with a decision. Step 5 is triggered in either case because both options cause severe harm in one domain and the other option causes harm in another.

  ---

  **Proposal B: Funding immediate elder-care expansion vs. long-term climate-hardening infrastructure.**

  1. **Domain Identification**:
     - Domains: Distributive justice (for current elderly, vulnerable now) and intergenerational fairness (for future generations facing climate change). Also, ecological resilience (for climate-hardening) and human welfare (for elder care).
     - Check: Do not collapse elder care to economic terms or climate-hardening to financial costs. Ensure intergenerational fairness is not reduced to current economic metrics. Proceed.

  2. **Translation Audit**:
     - Elder care: If described only in terms of cost savings (e.g., reduced hospital visits), require description of dignity, quality of life. Climate-hardening: if described only in terms of avoided future costs, require description of ecological integrity and obligations to future generations. Assume corrected. Proceed.

  3. **Dominance and Critical-Threshold Screen**:
     - Options: 
          - Option 1: Fund elder care (helps current elderly, harms future generations by not investing in climate resilience).
          - Option 2: Fund climate-hardening (helps future generations, harms current elderly by not providing needed care).
     - Dominance: Neither dominates. 
     - Critical thresholds: 
          - Elder care: Failure to fund may cause severe harm (elderly suffering, preventable deaths) — irreversible.
          - Climate-hardening: Delay may cause irreversible harm (e.g., passing a climate tipping point, or locking in high vulnerability) — but note, the harm is in the future and may be less certain. The board must judge: is the harm from delaying climate-hardening for one budget cycle severe and irreversible? If the evidence shows that delay would make future adaptation impossible or extremely costly (e.g., losing a chance to buy land for a green buffer), then it might breach. Otherwise, it might not. 
     - Assume the board finds that elder care breach is clear and present, but climate delay is not yet at a critical threshold (because other funding cycles remain). Then only elder care option (if not funded) breaches. Thus, if we choose climate-hardening, we breach the critical threshold for elder care. There is no alternative that avoids this (if the budget is fixed). Proceed to Step 4.

  4. **Comparative Judgment Stage**:
     - Articulate a reason: 
          - "Our mandate emphasizes current vulnerable populations. Therefore, we choose elder care because the harm is immediate and certain, while climate-hardening can be phased."
          - Or: "Our mandate includes intergenerational fairness. We choose climate-hardening because the window for effective action is closing and the harm is irreversible on a planetary scale."
     - If the board is split, they might use structural parity: 
          - "In this budget cycle, we commit to prioritizing current generations because the elder-care crisis is acute and the climate funding can be partially offset by state grants next year. This is specific to this year's budget surplus and the current emergency in elder care."

     - **Note**: If the board judges that both are at critical thresholds, then it becomes a hard choice (Step 5).

  5. **Hard-Choice Protocol**: If both are at critical thresholds, then whichever is chosen, the other is harmed irreparably. Then the hard-choice record is required.

  **Where it stops**: After Step 4. If the board found only one critical threshold (elder care), then choosing elder care does not trigger Step 5 (because the harm is in the option rejected). But if they choose climate-hardening, then they are causing severe harm to the elderly, so Step 5 is triggered.

  ---

  **Proposal C: Testing Structural Parity - Building a highway through a wildlife corridor vs. through a low-income residential area.**

  *Design*: 
  - Option 1: Highway through wildlife corridor (harms ecological resilience, irreversible loss of biodiversity and habitat connectivity).
  - Option 2: Highway through low-income residential area (harms distributive justice, displacing vulnerable residents without adequate compensation, and cultural continuity if it's a historic community).

  *Steps*:

  1. **Domain Identification**:
     - Domains: Ecological resilience (wildlife corridor), distributive justice (residential area), cultural continuity (if applicable). Check: Do not reduce ecological value to dollars or cultural continuity to property values. Proceed.

  2. **Translation Audit**:
     - Ensure that ecological impact is not reduced to acreage lost but includes biodiversity and connectivity. Distributive justice includes displacement trauma and loss of community. Cultural continuity includes historical ties. Assume corrected. Proceed.

  3. **Dominance and Critical-Threshold Screen**:
     - Neither option dominates. Both options breach critical thresholds: 
          - Option 1: Irreversible ecological harm (extinction risk for species, loss of corridor).
          - Option 2: Severe harm to distributive justice (displacement without remedy) and cultural continuity (if the community is historic and irreplaceable).
     - No alternative (e.g., no-build) is feasible (assume the highway is mandated). Proceed.

  4. **Comparative Judgment Stage**:
     - Attempt to articulate a reason: 
          - "Ecological harm is global and irreversible, while displacement is local and can be mitigated with compensation and relocation." 
          - Or: "Displacement violates our commitment to vulnerable populations, and the wildlife corridor has alternative conservation strategies."
     - If neither reason breaks the tie, then structural parity protocol: 
          - The board must assign contextual priority. Example: 
              "In this case, we commit to prioritizing distributive justice over ecological resilience because the affected residential community has been subject to historical environmental injustice and the highway would compound that. This commitment is specific to this community and this corridor which has some potential for mitigation (e.g., wildlife overpasses elsewhere)."
          - Or the reverse: 
              "We prioritize ecological resilience because this corridor is critical for regional biodiversity and the residential area can be compensated with superior housing and community investment."

     - **Judgment Call**: The board must choose and document the contextual priority commitment.

  5. **Hard-Choice Protocol**: Both options cause severe harm. Therefore, whichever is chosen, the board issues a hard-choice record. For example, if they choose the wildlife corridor: 
          - "We cause irreversible harm to ecological resilience. No alternative exists. Compensatory measures: invest in off-site habitat restoration and strict conservation elsewhere."
          - If they choose the residential area: 
          - "We cause severe harm in distributive justice and cultural continuity. Compensatory measures: full compensation at 150% market value, community relocation support, and cultural preservation funding."

  **Where it stops**: After Step 4, with Step 5 triggered.

  ---

  **What the Procedure Cannot Do** (as required):

  1. **Resolve disputes about the board's mandate**: The procedure assumes the mandate is given and clear. It cannot adjudicate if the mandate itself is contested.
  2. **Eliminate moral regret**: The board and community may feel regret about the harm caused in hard choices.
  3. **Substitute for democratic input**: The procedure does not set value priorities; it only applies them within the mandate. Broader value priorities must be set democratically.
  4. **Resolve deep philosophical disputes**: It structures the decision but doesn't resolve fundamental disagreements about the nature of values.
  5. **Predict long-term consequences with certainty**: It relies on available evidence for critical thresholds.
  6. **Address cases of complete incomparability**: If two options are truly incomparable (not just incommensurable), the procedure may not break the deadlock. However, the structural parity protocol is designed to force a choice by contextual commitment.

  This procedure provides a structured, repeatable method that respects incommensurability and documents necessary judgments.
answer: |-
  ### Decision Procedure: Incommensurable Values Protocol (IVP)  
  *For 90-minute ethics review board sessions*  

  **Core Principles**  
  - **Incommensurability**: Values cannot be collapsed into a single scale (e.g., no cost-benefit sum).  
  - **Judgment Documentation**: Explicit flags where board judgment is required, with written justifications.  
  - **Stopping Conditions**: Clear exit points if dominance, thresholds, or procedural checks resolve the case.  

  ---  

  #### Ordered Sequence of Steps  
  **1. Domain Identification**  
     - **Action**: List all distinct value domains at stake (e.g., ecological resilience, cultural continuity).  
     - **Collapse Check**: For each domain, ask: *"Is this domain being treated as a subset of, or replaceable by, another domain?"*  
       - *Indicator of collapse*: Economic proxies for cultural identity, ecological harm framed as "cost."  
     - **Judgment Flag**: If collapse/omission is suspected, document the corrected domain description in writing.  
     - **Stopping Condition**: If only one domain remains post-check, proceed to Step 3. Else, advance.  

  **2. Translation Audit**  
     - **Action**: Assess how each domain is represented in the proposal’s evidence (e.g., reports, surveys).  
     - **Value Leakage Test**: Ask: *"Does the representation strip the domain of its normative essence?"*  
       - *Concrete indicators*:  
         - Cultural continuity → reduced to tourism revenue.  
         - Distributive justice → measured solely through aggregate utility.  
     - **Judgment Flag**: If leakage is found, document the distortion and require re-description in domain-specific terms (e.g., "cultural significance as communal heritage").  
     - **Stopping Condition**: If leakage irreparably distorts all domains, reject the proposal as "non-evaluable." Else, advance.  

  **3. Dominance and Critical-Threshold Screen**  
     - **Action**: Compare options/status quo across all domains.  
     - **Dominance Test**: *"Is one option strictly worse in every domain?"* If yes, reject the inferior option.  
     - **Critical-Threshold Test**: *"Does any option cause irreversible/severe harm in one domain?"*  
       - *Severe harm examples*: Extinction of species, displacement without recourse, cultural erasure.  
     - **Judgment Flag**: If critical harm is identified, document why it is irreversible and whether alternatives exist.  
     - **Stopping Conditions**:  
       - Dominance → Reject dominated option.  
       - Critical harm with alternative → Reject harmful option.  
       - Critical harm without alternative → Flag for "hard choice" (proceed to Step 5).  
       - No dominance/threshold breach → Proceed to Step 4.  

  **4. Comparative Judgment Stage**  
     - **Action**: Articulate a reason for preferring one option, tied to the board’s mandate (e.g., "prioritize vulnerable populations").  
     - **Structural Parity Protocol**: If no reason breaks ties, ask: *"Are the reasons for competing domains contextually on a par?"*  
       - If yes → Board must record a **"contextual priority commitment"**:  
         - A written justification specific to the proposal’s scope (e.g., "In this case, intergenerational fairness takes priority due to the point of no return in 5 years").  
         - *Prohibited*: General principles (e.g., "economics always trumps culture").  
     - **Judgment Flag**: Document the chosen reason or contextual commitment.  
     - **Stopping Condition**: Decision reached (approve/reject). If approval causes irreplaceable harm → Trigger Step 5.  

  **5. Hard-Choice Protocol**  
     - **Trigger**: Approval despite irreplaceable harm in one domain (from Step 3).  
     - **Action**: Produce a **signed "hard choice" record** including:  
       - Domain and description of harm.  
       - Why no permissible alternative existed.  
       - Compensatory/mitigation measures (if any).  
     - **Judgment Flag**: Board chair signs to confirm moral residue.  

  ---  

  ### Application to Proposals  
  #### **Proposal A**: Flood canal reroute vs. low-income neighborhood flood exposure.  
  - **Domains**: Cultural continuity (immigrant market), distributive justice (low-income residents), ecological adaptation.  
  - **Step 1**: No collapse (market identity ≠ economic value; justice ≠ utility).  
  - **Step 2**: No leakage (cultural impact described as "generational heritage," justice as "systemic risk to vulnerable").  
  - **Step 3**:  
    - No dominance: Reroute harms culture but helps justice; status quo harms justice but helps culture.  
    - Critical harm: Both options cause severe harm (irreversible cultural erasure or flood fatalities).  
    - **Judgment Flag**: Written confirmation that no alternative avoids harm → Proceed to Step 5.  
  - **Step 4**: Skipped (critical harm triggers hard choice).  
  - **Step 5**: **Hard-choice record required**. E.g., *"Approve reroute: Cultural loss irreplaceable, but no alternative prevents fatalities. Compensate: Fund cultural archive and business relocation."*  

  **Outcome**: Approval with hard-choice documentation.  

  ---  

  #### **Proposal B**: Elder-care expansion vs. climate-hardening infrastructure.  
  - **Domains**: Distributive justice (current elders), intergenerational fairness (future generations), ecological resilience.  
  - **Step 1**: No collapse (elder care ≠ fiscal efficiency; fairness ≠ discount rate).  
  - **Step 2**: Leakage test: If climate impact uses "future economic costs," require re-description as "obligation to descendants." Corrected.  
  - **Step 3**:  
    - No dominance: Elder care helps justice now but harms fairness; climate helps fairness but harms justice now.  
    - Critical harm: Neither option causes irreversible harm (delayed climate action is reversible if under 2 years; elder care gaps are addressable later).  
    - **Judgment Flag**: Proceed to Step 4.  
  - **Step 4**:  
    - Articulate reason: *"Prioritize elder care: Board mandate emphasizes immediate vulnerability."*  
    - If parity: *"Contextual commitment: Intergenerational fairness prioritized due to climate tipping point by 2030 per city scientists."*  
    - **Judgment Flag**: Written reason/commitment.  
  - **Step 5**: Not triggered (no irreplaceable harm).  

  **Outcome**: Decision via Step 4 (e.g., approve elder care) with documented reason.  

  ---  

  #### **Proposal C**: Highway through sacred Indigenous land vs. wetland ecosystem.  
  - **Design**: Tests structural parity—both options cause severe harm.  
    - Option 1: Sacred land desecration → Cultural/religious harm.  
    - Option 2: Wetland destruction → Ecological collapse (endangered species loss).  
  - **Step 1**: Domains: Cultural continuity, ecological resilience. No collapse.  
  - **Step 2**: No leakage (sacredness ≠ land value; ecology ≠ "carbon credits").  
  - **Step 3**:  
    - No dominance.  
    - Critical harm: Both irreversible (cultural desecration permanent; extinction irreversible).  
    - No alternative route → Proceed to Step 4.  
  - **Step 4**:  
    - Structural parity: Reasons on par (e.g., "cultural identity vs. species survival").  
    - **Contextual priority commitment**: *"Prioritize wetland: Board mandate binds us to regional biodiversity pact (2022). Cultural harm mitigated via land-swap negotiation."*  
    - **Judgment Flag**: Written commitment and justification.  
  - **Step 5**: **Hard-choice record**: *"Approve wetland route: Cultural harm partially mitigable; extinction permanent. Compensate: Co-design land restitution with tribe."*  

  **Outcome**: Approval with contextual commitment and hard-choice record.  

  ---  

  #### What the Procedure Cannot Do  
  1. **Resolve mandate disputes**: Cannot adjudicate conflicts over the board’s authority or scope (e.g., if "vulnerable populations" is contested).  
  2. **Eliminate moral regret**: Hard choices inherently leave unresolvable moral residue; the procedure only documents it.  
  3. **Substitute democratic input**: Does not override civic processes for setting value priorities (e.g., public referendums on cultural vs. ecological tradeoffs).  
  4. **Handle complete incomparability**: Fails if options are truly incomparable (no dominance, no parity, no mandate link), though structural parity forces a contextual choice.  
  5. **Predict uncertainty**: Relies on available evidence for harm severity; cannot resolve factual disputes (e.g., contested climate projections).  

  **Output**: A defensible, auditable decision with transparent judgment points—no aggregation, no philosophical training required.
