answer: |-
  Here is the full specification of desiderata for any philosophically adequate reconstruction of Leibniz's "best possible world" thesis, structured according to your four clusters, with conceptual pressures and tensions highlighted:

  ---

  **I. Modal Ontology of Unactualized Possibles**  
  *Desiderata:*  
  1. **Subsistence of Possibles:** Must specify how non-actual possible worlds exist (e.g., as ideas in God’s intellect) without implying their concrete reality.  
     - *Pressure:* Avoids Platonic realism (threatening divine uniqueness) or nominalism (undermining objective compossibility).  
  2. **Harm of Non-Actualization:** Must deny that failing to actualize a possible world constitutes a *prima facie* harm or divine omission.  
     - *Pressure:* Preserves divine benevolence; otherwise, God’s choice of *any* world over others implies neglect of unactualized goods.  
  3. **Compossibility as Constraint:** Must position compossibility (mutual consistency of substances) as a *pre-selective filter* for candidate worlds, not a *post-hoc* justification.  
     - *Pressure:* Ensures God chooses from genuinely viable options; if compossibility is retroactive, the "best" claim becomes tautological.  

  **II. Accounting for Evil**  
  *Desiderata:*  
  4. **Evil as Privation:** Must reduce moral/natural evil to privation (lack of perfection) without denying its phenomenological reality.  
     - *Pressure:* Upholds divine goodness; if evil were positive, God would directly cause it.  
  5. **Non-Vacuity of Privative Theory:** Must prevent the privation thesis from rendering evil’s existence consistent with *any* world-state, making "best" empirically empty.  
     - *Pressure:* Avoids unfalsifiability; requires independent criteria to distinguish *permissible* evil from *gratuitous* evil.  
  6. **Criterion for Permissible Evil:** Must provide principles (e.g., "evil permits greater goods," "optimal harmony") to differentiate necessary evils in *this* world from gratuitous suffering in non-best worlds.  
     - *Pressure:* Without this, theodicy collapses into "whatever exists is best" circularity.  

  **III. Nature of Divine Selection**  
  *Desiderata:*  
  7. **Divine Freedom:** Must affirm God’s choice as free (non-necessitated) to avoid theological fatalism.  
     - *Pressure:* Preserves divine personhood and worship-worthiness; a necessitated God is not an agent.  
  8. **Rational Necessity:** Must hold God’s choice is rationally determined by the Principle of Sufficient Reason (PSR), making this world *uniquely optimal*.  
     - *Pressure:* Otherwise, "best" is arbitrary or subjective, contradicting Leibniz’s rationalism.  
  9. **Objective Bestness:** Must define "best" as an objective ordinal ranking (e.g., maximal essence/compossibles) or as reflecting divine perfection.  
     - *Pressure:* If "best" is merely internal to God, it loses explanatory power for creation’s intelligibility.  

  **IV. Taxonomy of Necessities**  
  *Desiderata:*  
  10. **Interaction of Necessities:** Must coordinate:  
      - *Metaphysical necessity* (compossibility/logic),  
      - *Physical necessity* (laws of this world),  
      - *Moral necessity* (God’s optimal choice).  
      - *Pressure:* Explains why this world is *selected*, not just permitted: moral necessity compels without absolute constraint.  
  11. **Non-Collapse of Necessities:** Must prevent moral necessity from collapsing into metaphysical necessity (Spinozism) or physical into brute contingency.  
      - *Pressure:* Collapse erodes divine freedom (if moral→metaphysical) or PSR (if physical→contingent).  
  12. **Optimality vs. Permission:** Must show moral necessity *explains optimal selection*—God isn’t merely indifferent between worlds.  
      - *Pressure:* Otherwise, "best" reduces to "sufficiently good," abandoning Leibniz’s optimism.  

  ---

  **Key Tensions & Desiderata Trade-offs:**  
  - **Jointly Unsatisfiable Pair:** **D7 (Divine Freedom)** and **D8 (Rational Necessity)**. Leibniz insists God *freely* follows PSR, but if PSR *necessitates* one outcome, freedom is illusory. If freedom allows genuine alternatives, this world isn’t *uniquely* best.  
  - **Most Impactful Desideratum to Abandon:**  
    - **D8 (Rational Necessity):** Abandoning strict rational determination (God *must* choose best) enables:  
      - *Theological Voluntarism:* God freely selects any good-enough world.  
      - *Spinozistic Determinism:* God’s choice collapses into metaphysical necessity (world-selection is non-contingent).  
    - **D3 (Compossibility as Constraint):** Rejecting compossibility as a pre-filter allows modern modal realism (all worlds equally real), but destroys Leibniz’s architectonic harmony.  

  **Conceptual Pressures Driving Tensions:**  
  - **Freedom vs. Rationality:** D7 and D8 clash because Leibnizian freedom requires spontaneity *and* intelligence—yet PSR seems to eliminate alternatives.  
  - **Optimality vs. Gratuitous Evil:** D5 and D6 strain against Leibniz’s privative theory: if all evil is merely "lack," distinguishing *necessary* from *gratuitous* lack requires external benchmarks.  
  - **Moral Necessity’s Fragility:** D10–D12 risk collapsing moral into metaphysical necessity (undermining freedom) or reducing it to divine psychology (undermining objectivity).  

  Abandoning D8 (rational necessity) most easily accommodates rival interpretations, while preserving D7 (freedom) and D3 (compossibility) is essential for orthodox Leibnizianism—but their joint satisfaction remains the doctrine’s deepest fracture.
