prompt: |-
  I am preparing my philosophical profile for a meta-science seminar and want an internal consistency audit before presenting. My commitments are these: (1) I am a scientific realist about the entities of fundamental physics—electrons, quantum fields, spacetime curvature—on the grounds that inference to the best explanation licenses realism when applied to mature, predictively successful theories. (2) I accept a restricted form of the pessimistic meta-induction: in any domain that has undergone at least two major theoretical revolutions, entities characteristic of superseded theories should be treated instrumentally rather than realistically. (3) I hold a hybrid position on biological ontology: I am an anti-realist about species (treating them as pragmatic constructs), but I am a realist about genes, on the grounds that the gene concept has retained a stable causal-functional profile across Mendelian, molecular, and post-genomic reconstructions. (4) I maintain that predictive success is insufficient for realism by itself; an entity must also satisfy what I call "revolution-sensitive persistence"—it must survive at least two successive theoretical reconstructions with its core explanatory role intact. (5) I reject structural realism as a general solution, because I think genuine scientific explanation requires entity-level commitment rather than mere structural preservation across theory change.

  Please audit this package. Identify which pairs of commitments are genuinely in tension (not merely apparently so), which conflicts dissolve on closer inspection, and rank the real tensions by severity. For each genuine tension, specify what the cheapest revision would be and which single change—giving up (1), (2), or (4)—would do the most work in restoring coherence. In particular, examine whether my biological hybrid in (3) survives intact given (4), and whether my endorsement of IBE in (1) is compatible with the extra condition I impose in (4). Do not treat all conflicts as equally serious; discriminate sharply between structural contradictions and mere motivational friction. Deliver a point-by-point assessment with specific comments that justify an overall grade for the coherence of the package.
reasoning: |-
  Okay, the user is preparing for a meta-science seminar and wants an internal consistency audit of their philosophical commitments. They've outlined five key positions on scientific realism. Let me start by breaking down each point to understand where tensions might lie.

  First, commitment (1) is scientific realism about fundamental physics entities based on Inference to the Best Explanation (IBE). Then (2) introduces a restricted pessimistic meta-induction, saying entities from domains with multiple theoretical revolutions should be treated instrumentally. (3) is a hybrid in biology: anti-realist about species, realist about genes. (4) adds a criterion called "revolution-sensitive persistence" (RSP), requiring an entity to survive two theoretical reconstructions. (5) rejects structural realism, insisting on entity-level commitment.

  Hmm, the main tension seems between (1) and (2)/(4). If IBE justifies realism about current fundamental physics entities, but RSP requires surviving two revolutions, and fundamental physics hasn't had two revolutions recently, how can they be realists now? The user might not have considered that their own criterion (4) could undermine (1). That's a serious contradiction.

  Looking at biology, commitment (3) says genes are real because they persisted through revolutions. But species didn't, hence anti-realism. That seems consistent with RSP. But wait—does the gene concept really have a stable core? Molecular genetics introduced DNA, which changed the understanding from Mendelian factors. The user might be downplaying conceptual shifts here. If the core role changed, RSP might not be fully satisfied, weakening their realism about genes. That's a moderate tension.

  Also, commitment (4) adds extra requirements beyond IBE. But IBE traditionally relies on current explanatory success, while RSP looks at historical persistence. The user might be trying to bolster IBE against the pessimistic meta-induction by adding RSP, but this creates a conflict. If RSP is necessary, then current IBE isn't sufficient, which contradicts (1)'s reliance on IBE alone for fundamental physics. That's another severe issue.

  Rejecting structural realism in (5) makes sense with their entity-focused view, but it doesn't directly conflict with other commitments. The problem is that without structural continuity, justifying realism between theory changes becomes harder, especially for fundamental physics pre-RSP. That's more of a motivational friction.

  The user's deeper need is likely to present a coherent, defensible position at the seminar. They might be worried about objections to their hybrid approach, especially from realists who question gene stability or anti-realists who challenge RSP's feasibility. They also need to reconcile IBE with historical criteria without undermining their current realism.

  The cheapest fix? Modify (1) to include a provisional stance on fundamental physics until RSP is met, which aligns with (2) and (4). Giving up (4) would resolve the contradiction but weaken their response to the pessimistic meta-induction. Abandoning (2) might lead to inconsistency with historical cases. Overall, adjusting (1) is the most efficient solution.

  For genes, clarifying the stable core and acknowledging possible instability under future revolutions would reduce tension. The hybrid in (3) mostly holds, but needs careful defense. The grade would be B-/C+ due to the fundamental contradiction, but it's fixable with revisions. The user should address these points to strengthen their profile before the seminar.
answer: |-
  Here is a point-by-point internal consistency audit of your philosophical profile, assessing tensions, their severity, and potential resolutions:

  **Overall Coherence Grade: B-/C+**  
  *(Logically salvageable core with one severe structural contradiction requiring revision, plus moderate tensions. The framework is promising but currently unstable at a critical junction.)*

  ---

  ### **Severe Structural Contradiction (Rank #1)**
  **Conflict:** Commitment (1) vs. Commitment (4)  
  - **Issue:** (1) uses IBE for realism about *current* fundamental physics entities (e.g., quantum fields) based on *current* explanatory/predictive success. (4) requires "revolution-sensitive persistence" (RSP) – surviving *two theoretical reconstructions* – as a *necessary condition* for realism. Fundamental physics (especially post-quantum revolution) lacks this history: quantum field theory hasn’t undergone two *succeeding* revolutions where its entities persisted. Thus, (4) *prohibits* the realism about QFT entities asserted in (1).  
  - **Cheapest Revision:** Modify (1) to reflect a *provisional* or *qualified* realism pending future RSP satisfaction (e.g., "I am a *tentative* realist about current fundamental entities, defeasible if RSP fails in future revolutions").  
  - **Most Impactful Single Change:** **Abandoning (4)** restores coherence by allowing IBE alone to justify realism for fundamental physics. However, this weakens your defense against PMI. *Alternatively*, weakening ***(1)*** to instrumentalism for fundamental physics (per your PMI in (2)) aligns with (4) but sacrifices core realist intuition.  

  ---

  ### **Moderate Tension (Rank #2)**
  **Conflict:** Commitment (3) [Gene Realism] vs. Commitment (4) [RSP]  
  - **Issue:** Your gene realism hinges on stability across "Mendelian, molecular, and post-genomic reconstructions." However, the shift from Mendelian genes (discrete units of inheritance) to molecular genes (DNA segments) involved radical reconceptualization. Critics (e.g., Waters, Moss) argue the "core causal role" fragmented: molecular genes aren’t always functional units (e.g., regulatory elements), and post-genomics emphasizes networks. **Does "RSP" genuinely hold?** If the *explanatory role* shifted from "inheritance unit" to "molecular template" to "context-dependent resource," (4) might *not* be satisfied, undermining (3)’s realism.  
  - **Resolution Potential:** Defensible with nuance. Argue that the *minimal core role* ("units transmitting developmental/evolutionary information") persists. *Clarify (4)*: Specify "core explanatory role" as *highly abstract* (e.g., "entity bearing structural information causally relevant to phenotypes"). If you can stabilize this core, (3) survives.  
  - **Cheapest Revision:** Refine (3) to acknowledge *degrees* of gene realism (e.g., realism about nucleotide sequences, instrumentalism about "gene" as a unified functional kind). Avoids overhauling core commitments.  

  ---

  ### **Apparent Tension (Dissolves on Inspection)**
  1.  **(2) [Restricted PMI] vs. (5) [Reject Structural Realism]:**  
      - *Apparent Conflict:* PMI often motivates structural realism (SR). Rejecting SR might seem to weaken PMI response.  
      - **Resolution:** Your hybrid approach (entity-specific RSP) *is* an alternative PMI response. (2) targets only entities in domains with revolutions – no contradiction with (5).  

  2.  **(1) [IBE for Physics] vs. (3) [Biological Hybrid]:**  
      - *Apparent Conflict:* Why not use IBE uniformly?  
      - **Resolution:** Your criteria are *domain-sensitive* via (2) and (4). Physics hasn’t met RSP, biology has (for genes). Consistent if RSP overrides pure IBE.  

  ---

  ### **Motivational Friction (Not Logical Tension)**
  - **(4) [RSP as Necessary] vs. IBE in (1):**  
    Adding RSP *as necessary* to IBE implies current explanatory success is *insufficient* for realism. This *motivationally* strains (1)’s reliance on IBE for fundamental physics. However, it’s not a contradiction if you argue RSP is a *meta-justification* enhancing IBE (though this requires clarifying why IBE alone is untrustworthy absent RSP).  

  ---

  ### **Recommendations for Coherence Restoration**
  1. **Mandatory Revision:** **Adjust (1)** to reflect the *provisional* status of fundamental physics realism pending RSP satisfaction. Example:  
     > *"I am a *defeasible* scientific realist about current fundamental physics entities, justified by IBE but contingent on future theory change not eliminating these entities or radically altering their core explanatory roles (per RSP)."*  

  2. **Strengthen (3):** Preempt challenges to gene persistence by explicitly defining the "stable core role" required by (4) (e.g., "information-bearing material entity with context-dependent phenotypic effects").  

  3. **Clarify (4):** Specify if RSP applies *retrospectively* only (judging past entities) or *prospectively* (regulating current realism). Prospective application causes the severe conflict with (1).  

  **Optimal Single Change for Coherence:** **Revising (1)** is the cheapest fix. Abandoning (4) eliminates your PMI defense; abandoning (2) removes domain-sensitivity, making your hybrid biology stance arbitrary.  

  **Biological Hybrid (3) Survival:** It **survives intact** *if* you can robustly defend gene persistence under RSP. If gene stability is contested, (3) becomes the package’s most vulnerable point.

  **Final Adjusted Grade After (1) Revision: A-** – A nuanced, historically informed realism that withstands PMI while preserving explanatory depth.
