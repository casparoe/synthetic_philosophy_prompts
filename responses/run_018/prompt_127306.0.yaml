answer: |-
  Here’s a sharp, no-fluff Q&A draft targeting the nerve points of her view. Questions are framed for collision, not exposition:

  1. **Core Mechanic**:  
     "You replace 'normal conditions' with control-theoretic setpoints to solve disjunctions like the frog snapping at flies vs. black dots. But if the setpoint is defined as *whatever input the mechanism is tuned to minimize error toward*, doesn’t that just bake the disjunction *into* the setpoint? E.g., the frog’s visual system isn’t 'wrong' about dots — dots *are* the setpoint when flies are extinct!"  
     *Likely Reply: "Setpoints aren't defined by inputs but by the *evolutionarily stabilized error-correction profile*."*  
     → **Follow-up**: "If 'stabilized' just means 'whatever persisted phylogenetically,' how is that less disjunctive? A demon-haunted frog lineage with immortal floating BBs would have 'BB' as content — so isn’t content still hostage to freak ecology?"

  2. **Intentionality Smuggle**:  
     "When a thermostat fails to reach its setpoint, we say it 'should' be warmer. But that 'should' seems observer-dependent — engineers *impose* it. How does your view stop 'content' from being just a designer’s gloss on physical dynamics?"  
     *Likely Reply: "Biological setpoints are fixed by selection, not engineers — they’re objective system goals."*  
     → **Follow-up**: "But selection 'chooses' outcomes, not purposes. If a mutation accidentally repurposes a mechanism (e.g., bird feathers for flight vs. thermoregulation), is the *setpoint* retroactively rewritten? Doesn’t that make content a post-hoc story?"

  3. **History vs. Learning**:  
     "Why privilege evolutionary history over individual learning? If a lab frog learns to snap only at QR codes (not flies), is its snap-state 'about' QR codes? If not, why override *actual* control dynamics with Stone Age teleology?"  
     *Likely Reply: "Learning updates setpoints within an inherited functional architecture — the meta-control system is still a product of selection."*  
     → **Follow-up**: "For humans, most concepts are cultural (e.g., 'bitcoin'). If my neural setpoint for 'value' is calibrated by Venmo transactions, is content fixed by my learning history or my Pleistocene reward system? Which one 'wins'?"

  4. **Normativity Relocation**:  
     "You claim setpoints naturalize mental 'oughts' — but isn't this just pushing normativity into engineering? A broken thermostat doesn't *violate a norm*; it just doesn't heat. Where's the *real* 'should' in the physics?"  
     *Likely Reply: "Biological functions generate norms — a heart *should* pump blood because that’s its selected effect."*  
     → **Follow-up**: "But on your view, 'selected effect' is replaced by 'active setpoint.' If a heart’s setpoint shifts to 'vibrate' due to a pathological feedback loop, does it *should* vibrate? If not, isn't selection still covertly in charge?"

  5. **Misrepresentation Test (Frog 2.0)**:  
     "Take your 'fixed' frog: It snaps at a fly, misses, and gets poisoned by a camouflaged wasp. You'd say it misrepresented — but *how*? The setpoint was 'snap-at-fly-shaped-input,' and it did. Isn't the 'mistake' just us projecting harm onto the control loop?"  
     *Likely Reply: "The system’s proper function is nutrition, so poisoning is an error relative to the ultimate biological goal."*  
     → **Follow-Up**: "But you *ditched* 'proper function' for setpoints! If the visual system’s *local* setpoint is satisfied (fly-shape hit), how can the *global* outcome make it a misrepresentation without sneaking back in Millikan-style normativity?"

  6. **Dynamic Setpoints**:  
     "Brains update setpoints constantly (e.g., adjusting pain thresholds). If content is fixed by *current* setpoints, how do you avoid content changing minute-to-minute? Is 'hunger' about different things before vs. after lunch?"  
     *Likely Reply: "Hierarchical control — higher setpoints (e.g., homeostasis) constrain lower ones (e.g., stomach motility)."*  
     → **Follow-up**: "But if higher setpoints also shift (e.g., stress suppresses hunger), what anchors 'stable' content? Is there a top-level setpoint that’s immune to updates? (And if so, isn’t that just 'truth' in disguise?)"

  7. **Competing Setpoints**:  
     "Conflicting subsystems have rival setpoints (e.g., eat cake vs. diet). When I eat the cake, does my 'diet' representation misrepresent? Or was it temporarily deactivated? How does content assignment resolve civil wars?"  
     *Likely Reply: "Content is local to mechanisms — the diet module still 'says' *avoid cake* even if overridden."*  
     → **Follow-up**: "But if overriding is common, doesn’t that make most 'content' inert noise? Why call it representation if it’s functionally epiphenomenal?"

  8. **Empirical Drag**:  
     "What experiment could *falsify* your view? If neuroscience finds no discrete 'setpoints' (just dynamic attractors), or if AI without evolution exhibits identical error-correction, does your theory adapt or collapse?"  

  **Tone Note**: Casual but precise — assumes familiarity with the dialectic. Follow-ups anticipate defensive moves and force a choice: *either* bite bullets *or* expose hidden commitments. No safe ground.  

  Let her sweat ;)
