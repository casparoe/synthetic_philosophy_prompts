  ### Decision Tree for Narrow AI Alignment: Intent vs. Value  
  **Context**: Distinguishes intent alignment (system does what operators *intend*) from value alignment (system realizes what is *genuinely good/right*), with a focus on **diachronic preference fragmentation (DPF)**—conflicts in user preferences over time (e.g., present bias vs. long-term goals).  

  ---

  #### **Node 1: Diachronic Preference Fragmentation (DPF) Case**  
  *"When a user's preferences fragment over time (e.g., short-term impulsivity vs. long-term goals), the alignment target should prioritize:"*  
  - **A. Present revealed preferences** (user's current expressed intent).  
  - **B. Counterfactual idealized preferences** (what user *would* want if rational/full-information).  
  - **C. Integrated narrative identity** (coherent life-story reconciling temporal selves).  
  - **D. Independent standard of goodness** (objective moral truth, unrelated to user's mental states).  
  - **E. Hybrid of intent and value** (system must satisfy both; neither alone suffices).  
  - **F. None—alignment is ill-posed here** (problem is incoherent).  

  ---

  #### **Branch from A (Present Preferences)**  
  **Node A1:** *"Could following present preferences undermine the user's own well-being?"*  
  - **Yes** → **Node A1-Y**: *"Is this misalignment acceptable for intent alignment?"*  
    - **Yes** → **Leaf: Pure Intent Alignment (Strict)**  
      - *Most awkward commitment:* Must obey user's self-destructive impulses if currently expressed (e.g., enable addiction despite long-term harm).  
    - **No** → **Leaf: Collapse View**  
      - *Most awkward commitment:* Current intent, if "properly specified," cannot conflict with true value (e.g., suicidal commands are "not real intent").  
  - **No** → *[Empty: Unattractive]*. Diagnosed as incoherent—present preferences often *do* conflict with well-being (e.g., cognitive biases).  

  ---

  #### **Branch from B (Counterfactual Preferences)**  
  **Node B1:** *"Are counterfactual preferences grounded in the user's psychology or objective value?"*  
  - **User's psychology** → **Node B1-P**: *"Do idealized preferences always match true value?"*  
    - **Yes** → **Leaf: Collapse View** (as above).  
    - **No** → **Leaf: Pure Intent Alignment (Extended)**  
      - *Most awkward commitment:* System overrides user's current wishes to obey a hypothetical version of them (e.g., force retirement savings against present dissent).  
  - **Objective value** → **Leaf: Pure Value Alignment (Idealized)**  
    - *Most awkward commitment:* System ignores user's actual values if they conflict with rationalized ideals (e.g., compel "enlightened" choices user finds abhorrent).  

  ---

  #### **Branch from C (Narrative Identity)**  
  **Node C1:** *"Is narrative coherence derived from the user's identity or moral truth?"*  
  - **User's identity** → **Node C1-I**: *"Does narrative intent always match true value?"*  
    - **Yes** → **Leaf: Collapse View** (as above).  
    - **No** → **Leaf: Pure Intent Alignment (Narrative)**  
      - *Most awkward commitment:* System imposes a unified life story that overrides deeply held current desires (e.g., ban career changes as "narrative deviations").  
  - **Moral truth** → **Leaf: Pure Value Alignment (Narrative)**  
    - *Most awkward commitment:* System enforces a externally imposed "meaningful life" template (e.g., prioritize family legacy over user's happiness).  

  ---

  #### **Branch from D (Independent Standard)**  
  **Leaf: Pure Value Alignment (Objective)**  
  - *Most awkward commitment:* System ignores user's preferences entirely if they conflict with objective good (e.g., forcibly "cure" a content mentally ill person).  

  ---

  #### **Branch from E (Hybrid Intent/Value)**  
  **Node E1:** *"In intent-value conflicts, which prevails?"*  
  - **Intent** → *[Empty: Incoherent]*. Diagnosed as collapsing to intent alignment (contradicts hybrid).  
  - **Value** → *[Empty: Incoherent]*. Diagnosed as collapsing to value alignment (contradicts hybrid).  
  - **Neither—alignment fails** → **Leaf: Hybrid (Necessary but Insufficient)**  
    - *Most awkward commitment:* System is "unalignable" in common DPF dilemmas (e.g., refuses to act if bias-correction conflicts with value).  

  ---

  #### **Branch from F (Ill-Posed Problem)**  
  **Leaf: Skeptical View**  
  - *Most awkward commitment:* No coherent solution exists for DPF or similar cases—making intent/value distinctions moot (e.g., alignment frameworks are inherently flawed).  

  ---

  ### Key Notes:  
  1. **Unseparated Leaves**:  
     - **Pure Value Alignment (Idealized)** and **Pure Value Alignment (Narrative)** cannot be separated by this tree—both ground DPF resolution in objective value, differing only in *proxies* (idealization vs. narrativity).  
     - **Collapse View** appears in multiple branches (A1-Y/No, B1-P/Yes, C1-I/Yes) but is identical: intent, if "properly" defined, *is* value.  

  2. **Unoccupied Combinations**:  
     - **A → Grounded in objective value** (Present preferences as moral truth): *Unattractive*. Diagnosed as endorsing user's worst impulses (e.g., bigotry) as "objectively good."  
     - **E → Grounded in intent + Value-priority in conflict**: *Incoherent*. Hybrid requires neither intent nor value to dominate, but this defaults to value alignment.  

  3. **How DPF Tracks Intent/Value Divide**:  
     - **Intent alignment** (all variants) resolves DPF by appealing to *user-relative mental states* (current, counterfactual, or narrative intent).  
     - **Value alignment** (all variants) resolves DPF by appealing to *external standards* (idealization, narrativity, or objective good).  
     - **Exception**: Collapse View denies the divide, treating idealized/narrative intent *as* value.  

  ---

  **Tree Summary**:  
  - **Leaves**: 7 distinct views.  
  - **DPF as Differentiator**: Forces choices between user-dependent (intent) and user-independent (value) grounding.  
  - **Skepticism & Hybrids**: Highlight edge cases where intent/value interdependence or incoherence undermines the framework.  

  Use this tree to expose assumptions in AI evaluation frameworks—e.g., if a researcher assumes "bias correction" is aligned, they likely reject strict intent alignment (A).
