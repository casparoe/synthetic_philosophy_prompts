  ### Thought Experiment: The Rigor Commitment

  At a tech company, the new "Critical Project Initiative" (CPI) promises substantial bonuses and promotions for engineers assigned to it. Assignment hinges on passing an automated predictor audit that scans historical work patterns. The audit flags engineers who exhibit "extreme rigor"—defined as consistently adding unnecessary but harmless steps in peer reviews, like demanding additional sign-offs on trivial changes or requiring full regression tests for minor updates. This rigor imposes tangible costs: it delays feature releases by weeks and forces rework, hurting team velocity and personal efficiency. Crucially, the predictor also incorporates a hidden confounder: it *penalizes* engineers whose rigor causes missed deadlines, which is inevitable given current sprint pressures. Thus, rigor only yields a flag if it doesn’t disrupt timelines—a near-impossible feat. However, engineers who naturally possess a "rigor-disposed" character (e.g., meticulous perfectionists) are *less likely* to cause delays when practicing rigor, as their efficiency offsets the overhead. The predictor detects this character indirectly via patterns, not direct observation. Alex, not naturally rigor-disposed, must decide whether to cultivate this trait by accepting the costs (delays, rework) to mimic the disposition. If successful, the audit flags him for CPI. But cultivating rigor will likely cause delays, triggering the penalty.  

  ### Decision Theories’ Verdicts  
  - **Causal Decision Theory (CDT) endorses cultivation**:  
    CDT evaluates only causal consequences. Cultivating rigor *directly causes* the desired rigor pattern in Alex’s work history, which is the sole input to the predictor’s flagging mechanism. The hidden penalty for delays is irrelevant because it arises from the *outcomes* of rigor (missed deadlines), not rigor itself. Since the penalty is an independent effect of the same action, CDT treats it as a separate, non-interacting cost. If the CPI benefit (e.g., $50k bonus) outweighs the costs of delays/rework (e.g., $40k in lost time), CDT approves.  

  - **Evidential Decision Theory (EDT) rejects cultivation**:  
    EDT treats actions as *evidence* about the world. Cultivating rigor is strong evidence that Alex *lacks* the natural rigor-disposed character (since those with it needn’t "cultivate" it). This lack implies inefficiency, making delays—and thus the penalty—extremely likely. The action also signals that Alex’s attempt will likely trigger the penalty (high correlation between cultivation and failure). EDT calculates: the probability of being flagged given cultivation is low (due to penalty risk), while the costs are certain. If the penalty makes success improbable, the expected utility is negative.  

  ### Structural Feature Driving Reversal  
  The reversal stems from **asymmetric observability**: the predictor’s flag depends *causally* on the observable rigor pattern (which cultivation directly produces), but the penalty depends *evidentially* on the *character* (which cultivation signals negatively). For CDT, the action’s causal effect (rigor pattern → flag) is primary. For EDT, the action’s diagnostic value (cultivation → evidence of non-disposition → penalty) dominates.  

  ### EDT’s Counterargument  
  An evidential decision theorist would attack CDT’s neglect of the penalty’s correlation with cultivation. They’d argue: cultivating rigor isn’t just costly—it’s a *symptom* of inefficiency, making the penalty almost certain. Thus, while CDT naively assumes the flag is achievable, EDT recognizes that the action *reveals* Alex’s unsuitability, rendering the commitment irrational.
