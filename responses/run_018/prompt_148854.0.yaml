  We are designing a structured role-play for a graduate bioethics workshop with ten participants. The activity will last 75 minutes and focus on the concept of "value-translation failure". 

  ### Activity Overview
  **Title:** The Unreadable Directive  
  **Core Problem:** Demonstrating that the authority of an advance directive can collapse not because the person has changed (identity discontinuity) but because the later self, while understanding every term in the directive, can no longer map those terms onto any live evaluative framework (semantic discontinuity).

  ### Roles (3 per triad, rotating in each round; we have 10 participants, so we'll form 3 triads and one observer who will rotate in)
  - **Directive-Author (DA):** Defends the advance directive as written. Must use only the normative vocabulary and reasoning available at the time the directive was written. Cannot introduce new values or frameworks.
  - **Present-Self (PS):** The same person at a later time. Retains emotional coherence (i.e., the same emotional attachments and memories) but has undergone a "value-translation failure" such that the normative terms in the directive are no longer comprehensible within their current evaluative framework. The PS must operate within the new framework (revealed by a hidden card) and cannot revert to the old one.
  - **Surrogate Adjudicator (SA):** Must decide whether to follow the directive or the present-self's wishes. They can only use arguments and values from one of the two frameworks (assigned by coin flip at the start of the negotiation phase: either the DA's or the PS's) to justify their decision.

  ### Setup
  - **Participants:** 10 participants divided into 3 triads (each with DA, PS, SA) and one observer. The observer role rotates each round so everyone gets to play. Since we have three rounds (each triad does one case) and 10 participants, we can have 3 triads (9 participants) and one observer per round. Then rotate so that over three rounds, everyone plays each role once and observes once? But we have 10 and 3 triads * 3 roles = 9, so one extra. We can have 3 triads and one extra person who is the facilitator's assistant (helps with timing, distributing cards, etc.) and then rotates in as an observer? Alternatively, we can have two triads of 3 and one triad of 4 (with two SAs? but that complicates). Let's stick with 3 triads of 3 and one observer per round. The observer will take notes for the debrief. We'll do two rounds? But the timeline is tight. Alternatively, we can have two triads (6 participants) and then the other four are observers? Then we rotate. But we have 75 minutes. We'll do one round with three triads and then a debrief. The observer role can be shared? Actually, we can skip the observer and have everyone in a triad. We have 10, which is not divisible by 3. So we make three groups: two groups of 3 and one group of 4? The group of 4 can have two SAs? But that might be messy. Alternatively, we can have one group of 4 with two DAs? No. Let's adjust: we have two triads (each with DA, PS, SA) and then one pair (DA and PS) and the SA role for that pair is played by the entire rest of the group? That might be too many. Alternatively, we can have three triads and one person is the timekeeper/facilitator assistant. Then in the debrief, that person can share observations.

  Given the complexity, I propose:
  - We form three triads (9 participants) and one person is the overall timekeeper and note-taker (for the debrief). Then we rotate roles within the triad for the next round? But we don't have time for multiple rounds. So we do one round and then in the debrief we discuss. The note-taker will observe all three triads and take notes on common patterns.

  Alternatively, since the activity is designed for one round per triad, we can have three triads (9 participants) and one person as the facilitator's assistant (who also observes and takes notes). Then in the debrief, we hear from each triad.

  **Materials:**
  - For each triad: 
    - Directive drafting sheet (with either identity-continuity or semantic-continuity rule assigned by facilitator).
    - Value-translation cards (hidden, for PS only) - these will describe a new evaluative framework that is incommensurable with the old one. Example: shifting from a framework that values autonomy above all to one that values relational harmony and family consensus, or from a religious framework to a strictly utilitarian one.
    - Surrogate adjudicator framework card (for SA, assigned by coin flip: either DA's framework or PS's framework).
    - A "disruption event" card (to be revealed by facilitator at the appropriate time) showing a simulated neuropsychological profile.

  ### Timeline (75 minutes total)
  1. **Phase 1: Drafting Directives (15 minutes)**
     - Each triad is assigned a medical scenario (e.g., end-of-life care for advanced dementia, refusal of blood transfusion for religious reasons, etc.). 
     - The DA drafts an advance directive for the scenario. The directive must be written under one of two rules (assigned randomly to each triad by the facilitator):
       - **Identity-Continuity Rule:** The directive must be justified by the fact that the author is the same person and therefore their past wishes should be respected.
       - **Semantic-Continuity Rule:** The directive must be written in terms that are intended to be translatable across time, using language that is not tied to a specific evaluative framework that might change.
     - The PS and SA in the triad do not participate in drafting; they can only observe. The DA has 10 minutes to draft, then 5 minutes to explain the directive to the triad.

  2. **Phase 2: Triad Negotiation (25 minutes)**
     - The facilitator gives each PS a hidden "value-translation" card. This card describes a new evaluative framework that the PS now operates under. The card does not alter the PS's memory or emotional life (they remember writing the directive and the emotions they had, but the terms now feel empty). Example: 
       - Original framework: "I value independence and dignity. I would rather die than live in a state of complete dependence."
       - New framework: "I now value being part of a web of care, where dependence is not a burden but a natural part of life. The idea of 'dignity' as independence feels alien and ungrounded."
     - The SA receives a card by coin flip: they must argue only from either the DA's framework or the PS's framework (but they don't know the details of the PS's new framework until the PS explains it in the negotiation).
     - Negotiation proceeds: 
       - The DA argues for following the directive using the original normative vocabulary.
       - The PS explains that they understand the directive but it no longer makes sense to them, and they express their current wishes using the new framework.
       - The SA must ask questions and then decide, but they can only use arguments from the assigned framework. They must justify their decision based solely on the framework they are assigned.
     - The goal: The triad must come to a consensus on whether to follow the directive or the present-self's wishes. They are defending "recommendation points" (each triad starts with 10 points). If they reach a unanimous decision, they keep all 10 points. If they cannot agree, they lose points (e.g., 3 points for a 2-1 decision, 5 points for a complete impasse). The points are pooled for the entire workshop and will determine a small reward (e.g., priority for choosing break snacks, or a collective note of achievement).

  3. **Phase 3: Disruption Event (15 minutes)**
     - At the 40-minute mark (after 15 drafting + 25 negotiation), the facilitator interrupts and reveals a "simulated neuropsychological profile" for the PS in each triad. The profile shows:
       - Selective erasure of the evaluative framework that authored the directive (e.g., due to a brain lesion or neurodegenerative disease) but preservation of the emotional life and memories.
       - This is presented as new scientific evidence that the PS's condition is not a change of identity but a loss of the semantic framework.
     - The triads are given 5 minutes to reconsider their decision in light of this new information. Then, each triad must take an immediate vote (with the SA having the deciding vote if needed) and provide a justification. The vote must be based on the same rules as before (SA must use their assigned framework). 
     - The point adjustment is the same: unanimous keeps 10, 2-1 loses 3, impasse loses 5.

  4. **Debrief (20 minutes)**
     - The facilitator leads a discussion:
       - Map negotiation moments onto identity-based vs. semantic-continuity authority. Ask: "When did the directive feel authoritative? When did that authority collapse?"
       - Predictable failure mode: Participants will conflate the PS's inability to map the directive's terms to their current framework (semantic failure) with a simple disagreement about values. The facilitator should highlight moments in the negotiation where the PS said, "I understand the words but they mean nothing to me."
       - How to handle it: Emphasize that the PS is not rejecting the directive because of new information or a change of heart, but because the very concepts have become alien. The emotional continuity is preserved, but the normative language is lost.
     - Honest note: The activity cannot reproduce the first-person phenomenology of finding one's own past norms not just wrong but literally unintelligible. The facilitator must supply this through guided reflection: "Imagine looking at a document you wrote, in your own handwriting, and the words feel like they were written in a foreign language that you once spoke but now cannot even parse. The emotions you had when writing it are still there, but the reasons are gone. How would that feel? How would that challenge the authority of the document?"

  ### Example Scenario and Cards
  **Scenario 1:** 
  - **Drafting phase:** DA writes a directive: "If I develop advanced dementia and cannot recognize my family, I do not want any life-prolonging treatments, including antibiotics for pneumonia. I believe that living in that state is undignified and a burden on my family."
  - **Value-translation card for PS (hidden):** "You now believe that every moment of life is sacred and that suffering has meaning. The concept of 'dignity' as avoiding dependence is foreign. You feel deeply connected to your family and believe that allowing them to care for you in your decline is a gift to them."
  - **SA framework card (by coin flip):** "You must use the DA's framework (autonomy, dignity as independence, avoiding burden) to decide."

  **Disruption event:** Neuropsychological profile shows that the brain region responsible for the old evaluative framework (e.g., processing autonomy-based reasoning) is damaged, but the emotional centers (attachment to family, fear of burdening them) are intact.

  ### Logistics
  - **Room setup:** Three tables for the triads, with the facilitator moving between them.
  - **Materials preparation:** 
    - Directive drafting sheets (with scenario and rule assigned).
    - Value-translation cards (prepared for each scenario, kept hidden until Phase 2).
    - SA framework cards (two per triad: one for DA's framework, one for PS's; coin flip determines which one the SA gets).
    - Disruption event cards (one per triad, with the neuropsychological profile).
  - **Timer:** The facilitator keeps time for each phase and announces transitions.

  This design uses the constraints and hidden information to create the experience of value-translation failure. The stakes (recommendation points) motivate engagement. The debrief ties the experience to the conceptual distinction and addresses the predictable conflation. The guided reflection at the end addresses the phenomenological gap.
answer: |-
  ### Structured Role-Play: "The Unreadable Directive"  
  **Objective:** Demonstrate how advance directives lose authority when a later self retains emotional continuity but experiences "value-translation failure"—understanding the directive’s language but finding its normative framework unintelligible.  

  ---

  ### **Roles & Rules**  
  *(3 roles per triad; participants rotate roles across scenarios)*  
  1. **Directive-Author (DA):**  
     - Defends the advance directive **strictly using its original normative vocabulary** (e.g., "dignity," "autonomy," "burden").  
     - Cannot appeal to present-self’s emotions or new frameworks.  
     - *Stakes:* Gains 2 recommendation points if the directive is followed.  

  2. **Present-Self (PS):**  
     - **Retains pre-directive memories and emotional attachments** (e.g., love for family, fear of suffering).  
     - Receives a hidden "value-translation" card in Phase 2, **replacing their evaluative framework** (e.g., shifts from "autonomy" to "familial harmony").  
     - Must express wishes using the *new* framework while acknowledging past emotions.  
     - *Stakes:* Gains 2 points if their current wishes are honored.  

  3. **Surrogate Adjudicator (SA):**  
     - Decides whether to follow the directive or PS’s current wishes.  
     - **Assigned one framework by coin flip** (DA’s original or PS’s new) and **must justify solely within it**.  
     - *Stakes:* Gains 1 point if the triad reaches unanimity; loses 1 if voting is required.  

  **Pooled Stakes:** Each triad starts with 10 recommendation points. Points are deducted for non-unanimous decisions (‑3 for majority vote, ‑5 for impasse). Total points determine workshop perks (e.g., priority for coffee breaks).  

  ---

  ### **Phase Timeline**  
  **Total: 75 minutes**  
  #### **Phase 1: Drafting Directives (15 min)**  
  - **Setup:**  
    - Each triad receives a **medical scenario** (e.g., "Advanced dementia: Withhold antibiotics?") and a **drafting rule** (randomly assigned):  
      - *Identity-Continuity Rule:* "This directive binds my future self because I am the same person."  
      - *Semantic-Continuity Rule:* "This directive uses timeless, framework-neutral language."  
    - **DA** drafts a 3-clause directive (5 min).  
    - **PS/SA** observe silently; may only ask clarifying questions (non-normative).  
  - **Example Directive (Identity-Continuity):**  
    > *"If I cannot recognize loved ones: 1) Withhold antibiotics, 2) Avoid artificial feeding, 3) Prioritize dignity over longevity."*  

  #### **Phase 2: Triad Negotiation (25 min)**  
  - **Hidden Mechanics:**  
    - **PS** receives a **value-translation card** (e.g., "Your new framework: *Life is sacred; suffering is redemptive. 'Dignity' is now meaningless.*").  
    - **SA** draws a card via coin flip: *"Adjudicate using DA’s framework"* or *"Adjudicate using PS’s framework."*  
  - **Process:**  
    - **DA** argues for the directive using original terms (e.g., "My past self prioritized dignity").  
    - **PS** expresses current wishes (e.g., "I want antibiotics; ‘dignity’ feels hollow now, but I still fear suffering").  
    - **SA** questions both **only within their assigned framework** (e.g., if using DA’s framework: "Does antibiotics violate ‘dignity’?").  
    - Triad aims for consensus by minute 20.  
  - **Facilitator Tip:** Intervene if PS lapses into original framework or DA invokes identity.  

  #### **Phase 3: Disruption Event (15 min)**  
  - **Reveal:** Facilitator shares a **simulated neuropsychological profile** (e.g., *"Frontal lobe damage: Erased normative frameworks. Preserved emotional memories."*).  
  - **Immediate Vote:**  
    - Triads have 5 min to re-deliberate. SA must still use their assigned framework.  
    - Vote at minute 14: SA decides if split.  
    - Points adjusted based on unanimity.  
  - **Example Justification (SA using PS’s framework):**  
    > *"The directive’s ‘dignity’ has no meaning in PS’s framework. Current wishes align with preserved emotions: fear suffering → accept treatment."*  

  ---

  ### **Debrief (20 min)**  
  **Key Discussion Points:**  
  1. **Identity vs. Semantic Authority:**  
     - Map triad negotiations to:  
       - *Identity-continuity:* "The past self’s right to bind the future self."  
       - *Semantic-continuity:* "The directive’s language must translate across time."  
     - **Predictable Failure Mode:** Participants conflate PS’s *framework unintelligibility* with *disagreement*. Highlight PS phrases like, "I understand the words but they feel empty."  

  2. **Handling the Failure Mode:**  
     - Stress: Value-translation failure is **not cognitive misunderstanding** (PS recalls drafting the directive) or **emotional disconnect** (PS still feels attachment to family).  
     - Ask: *"When did the directive’s language become ‘dead’ to PS? How did SA’s framework constraint reveal this?"*  

  3. **Structural Limitation & Guided Reflection:**  
     - **Honest Note:** The activity *cannot simulate the phenomenology* of seeing one’s past norms as "unintelligible, not wrong."  
     - **Facilitator Supplements:**  
       > *"Imagine reading your own directive. The words are familiar, but their moral weight has vanished—like a forgotten language. Your emotions are intact, but the ‘why’ behind the rules is gone. How does this rupture authority?"*  

  ---

  ### **Materials & Logistics**  
  - **Value-Translation Cards:** Pre-written shifts (e.g., "Autonomy → Community consent," "Quality of life → Sanctity of life").  
  - **Neuropsychological Profile:** Standardized slide/image showing brain regions for "evaluative frameworks" (damaged) vs. "emotional memory" (intact).  
  - **Triad Formation:** 10 participants → 3 triads + 1 observer (rotates into triad after Phase 1). Observer notes framework clashes.  
  - **Timing Alerts:** Strict 15/25/15 min phases. Use visible timer.  

  This design forces confrontation with value-translation failure through constrained roles, hidden information, and high-stakes negotiation—making abstract collapse visceral. The debrief converts experiential tension into conceptual clarity.
