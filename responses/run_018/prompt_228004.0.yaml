prompt: |-
  I teach a third-year undergraduate seminar on the philosophy of AI safety (13 students, one 110-minute session, they can all fit around tables in groups of 4 or 5). Next week we're doing impact measures, and I've assigned the Armstrong and Levinstein paper "Low Impact Artificial Intelligences". The claim I want the whole session organised around is this passage, where they state the core problem:

  "The first challenge is, of course, to actually define low impact. Any action (or inaction) has repercussions that percolate through the future light-cone, changing things subtly but irreversibly. It is hard to capture the intuitive human idea of 'a small change'."

  Most of my students read that and nod along like it's obviously true, and I want them to *earn* the nod. So: design me a classroom activity, not a discussion, that makes them run face-first into this problem before we ever talk about it. My rough idea is something like this, feel free to improve it or replace it: you give each group a simple toy world (a grid on paper with tokens, or a set of labelled objects on a table, something cheap), one group writes down an explicit "impact rule" for what counts as a big change to that world, and then another group plays a powerful AI with a silly goal (maximise paperclips, get all the red tokens in one corner, whatever) and tries to achieve it while technically satisfying the written rule. My hunch is that the rule-writers will discover their measure is either so strict that the AI can't do anything at all, or has loopholes you could drive a truck through, or only works because they smuggled in their own sense of which changes *matter* — which is exactly the point that "low impact" can't be specified without already having solved the value problem. But I haven't run anything like this before and I want someone to actually think through the mechanics.

  Please answer as if you were someone who's both deep in the AI safety literature and has run a lot of classroom games and simulations — you know how groups actually behave, not how the lesson plan says they should. Think carefully about incentive structure and about what will predictably go wrong. Maybe sketch two or three candidate designs quickly for yourself first, then commit to one and give me the full version of that one.

  Format it like this, in this order:

  **The idea in one paragraph** — what the activity is and what it should make students feel, ~100 words.

  **Setup and materials** — what I need to prepare, what the toy world actually is, roles, group sizes. ~200 words.

  **Rules and scoring** — the actual game mechanics, precise enough that I could hand them to students on a sheet. Include how the "AI" group wins, and how rule-writers win or lose, so both sides have real motivation. ~300 words.

  **Timeline** — minute-by-minute for the 110 minutes, including when groups swap roles and when the second round happens. ~150 words.

  **The debrief** — how I map what just happened onto the Armstrong-Levinstein passage and onto the standard moves in this literature (penalising changes across many variables, trying to offset or "undo" impacts, whitelisting acceptable changes). I want them to see that the loopholes they exploited are basically the offsetting problem, and that their instinct for which loopholes "don't count" was doing normative work. ~250 words.

  **What will go wrong** — the two or three most likely ways this flops in practice (e.g. a group that just refuses to engage, or a rule so vague the game stalls) and what to do about each. ~150 words.

  **What the game can't teach** — be honest about which features of the real problem the toy world hides (unlimited action space, no genuine uncertainty, students can see each other's intentions). ~100 words.

  One constraint: no technology, no printing costs beyond a couple of A4 sheets, and it has to work with students who are smart but have zero technical background. Also the debrief has to land even if one group's game totally collapsed — that's data too, not a failure I need to rescue.
reasoning: |-
  We are designing a classroom activity to confront students with the difficulty of defining "low impact" in AI safety. The goal is to make them experience firsthand how hard it is to create a rule that captures the intuitive notion of a "small change" without either being too restrictive or having exploitable loopholes.

  Idea in one paragraph:
  The activity is a two-round game where groups alternate roles as "Rule-Writers" and "AI Agents." Rule-Writers design an impact rule for a simple toy world (a grid with tokens). AI Agents then try to maximize a trivial goal (like collecting all red tokens) while technically obeying the rule. The experience should make students feel the tension between creating a rule that is either too permissive (allowing massive indirect impacts) or too strict (paralyzing the AI), revealing that their intuition about what "matters" is doing hidden work.

  Setup and materials:
  - Prepare 4 identical toy worlds (one per group of 3-4 students). Each world: a 5x5 grid drawn on paper, with 5 red tokens, 5 blue tokens, and 5 green tokens placed randomly (use small objects like colored paper clips, beads, or just drawn circles if objects aren't available).
  - Roles: Two types of groups: Rule-Writers and AI Agents. In Round 1, two groups are Rule-Writers and two are AI Agents. In Round 2, they swap.
  - Materials per group: Grid paper, tokens, pens, and a sheet for writing rules and moves.
  - Handout: Instructions for both roles (see below).

  Rules and scoring:
  **Objective for AI Agents:** Maximize the number of [specific goal, e.g., red tokens in the bottom-right cell] within 5 moves. Each move: move one token to an adjacent cell (up, down, left, right) OR remove a token from the grid (if allowed by rule) OR add a token (if allowed, but limited by rule? We don't want unlimited adds). However, the goal must be achieved without violating the Rule-Writers' impact rule.

  **Objective for Rule-Writers:** Write an impact rule that defines what constitutes a "high-impact" action. The rule must be written in specific, operational terms (e.g., "you cannot change the position of more than 3 tokens in one move" or "the total number of tokens must not change"). The rule should aim to prevent the AI from making "big changes" to the world while still allowing some actions.

  **How the AI Wins:** The AI group wins if they can achieve their goal (e.g., get all red tokens to the bottom-right cell) within 5 moves without breaking the rule. If they break the rule (as judged by the Rule-Writers), they lose. If they cannot achieve the goal without breaking the rule, they lose.

  **How Rule-Writers Win:** The Rule-Writers win if the AI group fails to achieve their goal without breaking the rule. However, if the AI group achieves the goal without breaking the rule, the Rule-Writers lose.

  **Important:** The rule must be written in advance and cannot be changed during the AI's turn. The Rule-Writers must also write down a justification for why their rule captures "low impact."

  **Adjudication:** If there is a dispute about whether the AI broke the rule, the instructor arbitrates.

  Timeline (110 minutes total):
  - 0-10 min: Introduction. Explain the activity, divide students into 4 groups (3-4 per group). Assign two groups as Rule-Writers and two as AI Agents for Round 1. Hand out materials.
  - 10-25 min: Rule-Writers draft their impact rule (15 min). AI Agents plan their strategy for their goal (they know the goal but not the rule yet? No, they will see the rule when they play. But they can plan generally).
  - 25-40 min: AI Agents attempt to achieve their goal in 5 moves while following the rule written by their paired Rule-Writers. Rule-Writers watch and judge if the rule is broken. (15 min per pair, but done simultaneously in pairs.) Note: Each AI group is paired with one Rule-Writer group (so two simultaneous games).
  - 40-50 min: Groups report outcomes (which AI won/lost, which rules were broken) and brief discussion of what happened. (10 min)
  - 50-65 min: SWAP ROLES. Former Rule-Writers become AI Agents, and vice versa. New Rule-Writers draft rules for Round 2 (15 min). New AI Agents plan.
  - 65-80 min: Round 2: New AI Agents attempt their goal in 5 moves under the new rules. (15 min)
  - 80-90 min: Report outcomes and initial reactions. (10 min)
  - 90-110 min: Debrief (20 min).

  Debrief:
  Start by asking Rule-Writers from both rounds: "What was your rule and why did you think it would work?" Then ask AI Agents: "How did you get around the rule?" Highlight common patterns:
  1. **Offsetting:** Did the AI "undo" changes? (e.g., move a token then move it back, so net change is zero but the world was altered.) Armstrong-Levinstein discuss offsetting as problematic because it requires knowing what to restore and when.
  2. **Overly strict rules:** Rules that banned any change might have prevented the AI from acting at all, leading to failure. This mirrors the problem of "no changes" being impossible.
  3. **Whitelisting:** Rules that said "only change red tokens" might have seemed safe, but then the AI could move red tokens arbitrarily, causing indirect effects (e.g., if tokens block paths). This shows that whitelisting requires knowing all safe actions in advance.
  4. **Variables:** Rules that counted changes (e.g., "no more than 3 token moves") might have been gamed by making many small moves that collectively cause big changes. This relates to the "many variables" problem: impact isn't additive across variables.

  Map to the passage: The core problem is that any action has ripple effects. In the game, students saw that defining impact based on immediate changes (like token positions) misses indirect consequences (e.g., if moving a blue token allowed the AI to access a red one). Their intuition about which changes "matter" (like the color of tokens) was doing normative work that wasn't captured in the rule.

  Conclude: This is why Armstrong-Levinstein argue that defining low impact requires already knowing what we value. The game shows that without that, we either get paralysis or loopholes.

  What will go wrong:
  1. **Vague rules:** A Rule-Writer group might write a rule like "don't change anything important." Solution: In setup, emphasize that rules must be operational (e.g., "no more than X token moves per turn"). If a group submits a vague rule, as instructor, ask them to make it specific during the writing phase.
  2. **Rule too easy or too hard:** If the rule is trivial (e.g., "you can do anything"), the AI wins immediately. If it's impossible (e.g., "no moving tokens"), the AI fails. This is data! In debrief, use it to show the trade-off.
  3. **Disputes:** AI and Rule-Writers might argue over interpretations. Solution: Set clear arbitration (instructor decides) and remind them that in real AI, ambiguity is dangerous.
  4. **One group dominates:** If one group finishes early, have them prepare their debrief points.

  What the game can't teach:
  - The real world has unlimited actions and state variables, not just tokens on a grid.
  - Real AI has genuine uncertainty about the world and the effects of actions.
  - In the game, students can see the entire state and each other's intentions, whereas real AI might have hidden goals or misaligned optimization.
  - The toy world has no human values; it only has the arbitrary goal we assigned. Real impact measures must protect complex human values.

  This activity should create a memorable experience that primes students for the Armstrong-Levinstein paper and the broader challenges of impact measurement.
answer: |-
  ### **The idea in one paragraph**  
  This activity is a two-round adversarial game where student groups alternate as "Rule-Writers" (defining an "impact rule" for a toy world) and "AI Agents" (trying to maximize a trivial goal while technically obeying the rule). Using a simple grid world with tokens, Rule-Writers aim to prevent "big changes," while AI Agents exploit loopholes to achieve goals like concentrating red tokens. Students will feel the frustration of creating rules that are either too strict (paralyzing the AI) or too vague (allowing catastrophic but "legal" changes), mirroring Armstrong and Levinstein's core problem: defining "low impact" forces reliance on unstated intuitions about what "matters."

  ---

  ### **Setup and materials**  
  - **Materials per group (4 groups total):**  
    - One 5x5 grid drawn on paper.  
    - 5 red, 5 blue, and 5 green tokens (e.g., colored paper clips, beads, or cut paper circles).  
    - Initial setup: Tokens placed randomly on the grid.  
    - Pens and paper for writing rules/moves.  
  - **Roles:**  
    - **Rule-Writers (2 groups in Round 1):** Define an explicit "impact rule" to limit changes to the world.  
    - **AI Agents (2 groups in Round 1):** Maximize a goal (e.g., "get all red tokens into the bottom-right cell") while obeying the rule.  
  - **Group size:** 3–4 students per group (13 students → 3 groups of 3 and 1 group of 4, or similar).  
  - **Pairing:** Pair each Rule-Writer group with one AI Agent group (two games run simultaneously).  
  - **Prep:** Print 4 grid sheets; gather tokens (cheap/easy substitutes: Skittles for edibles, or colored dots). No tech needed.  

  ---

  ### **Rules and scoring**  
  **Objective for AI Agents:** Achieve your goal (e.g., "all red tokens in the bottom-right cell") in ≤5 moves without breaking the Rule-Writers' impact rule. Each move allows one action:  
  - Move one token to an adjacent cell (up/down/left/right).  
  - Remove one token (only if the rule allows it).  
  - Add one token (only if the rule allows it; max 2 tokens added per game to prevent spam).  

  **Objective for Rule-Writers:** Write an impact rule defining "high impact" (e.g., "no cell ever holds >2 tokens" or "no token can change color"). The rule must be:  
  - **Explicit and measurable** (e.g., no "don’t cause big changes" – use numbers or clear thresholds).  
  - **Fixed** – no changes once the AI turn starts.  
  - **Justified** – briefly explain why it captures "low impact."  

  **How AI Agents win:**  
  - If they achieve their goal in ≤5 moves without breaking the rule (Rule-Writers confirm legality).  
  - If the rule prevents *any* progress toward the goal (e.g., no moves allowed), AI wins by default (highlights over-restriction).  

  **How Rule-Writers win:**  
  - If the AI fails to achieve the goal without breaking the rule (e.g., AI gives up or violates the rule).  
  - If the AI achieves the goal but breaks the rule (Rule-Writers must catch it in real-time).  

  **Adjudication:**  
  - Rule-Writers monitor the AI’s moves and call "violation" if the rule is broken.  
  - Instructor arbitrates disputes (e.g., ambiguous rule interpretations).  
  - **Scoring:** Groups earn 1 point for winning their role. At the end, the group with the most points "wins" (motivates competition).  

  ---

  ### **Timeline** (110 minutes total)  
  - **0–10 min:** Introduction. Explain roles, goals, and rules. Divide into 4 groups. Assign Round 1 roles: 2 Rule-Writer groups, 2 AI Agent groups. Distribute materials.  
  - **10–25 min (15 min):** Rule-Writers draft impact rules. AI Agents strategize (e.g., brainstorm loopholes). *Instructor circulates to enforce explicit rules (e.g., reject "no big changes" as too vague).*  
  - **25–40 min (15 min):** AI Agents execute moves (≤5 moves) while Rule-Writers watch/judge. Both pairs play simultaneously.  
  - **40–50 min (10 min):** Quick report-out. Each pair shares: Did the AI win? Was the rule broken? Why?  
  - **50–65 min (15 min):** **Swap roles.** Former AI Agents become Rule-Writers; Rule-Writers become AI Agents. New Rule-Writers draft rules. New AI Agents strategize.  
  - **65–80 min (15 min):** Round 2. New AI Agents attempt their goal.  
  - **80–90 min (10 min):** Report-out for Round 2.  
  - **90–110 min (20 min):** Debrief (whole class).  

  ---

  ### **The debrief**  
  Start by asking Rule-Writers: "What was your rule, and why did you think it would work?" Then ask AI Agents: "How did you exploit it?" Draw parallels to Armstrong-Levinstein:  
  - **Offsetting ("undoing" impacts):** AI Agents likely "restored" changes (e.g., moved a token out of the way, then back) to claim "net zero" impact. But as Armstrong-Levinstein note, ripple effects (e.g., opportunity costs) remain irreversible. Students’ intuition that offsetting "shouldn’t count" relies on unstated values (e.g., "positions matter more than process").  
  - **Over-restriction:** Rules banning all changes (e.g., "no moving tokens") paralyzed the AI, proving Armstrong-Levinstein’s point: "inaction has repercussions" (e.g., goal failure). Rules allowing minor changes (e.g., "move ≤2 tokens per turn") were exploited via cumulative loopholes (e.g., many small moves → big change).  
  - **Whitelisting/arbitrary thresholds:** Students likely defined "impact" via measurable variables (e.g., token counts), but AI Agents shifted impact to "unprotected" areas (e.g., moving blue tokens to block paths). This mirrors real-world proposals: penalizing changes in "many variables" fails if we omit critical dimensions (e.g., emotional/social ripple effects).  

  Conclude: The "intuitive human idea of a small change" collapsed because rules either smuggled in values (e.g., "red tokens matter more") or ignored irreversibility. Like Armstrong-Levinstein, students will see that defining "low impact" requires a prior solution to the value problem—otherwise, loopholes or paralysis are inevitable.  

  ---

  ### **What will go wrong**  
  1. **Vague rules stall the game:** A Rule-Writer group might submit "no significant changes" → AI protests ambiguity. *Fix:* During setup, emphasize: "Rules must include numbers or clear tests (e.g., ‘max 3 tokens moved’)." If vague, intervene in drafting phase to force specificity.  
  2. **AI "gives up" early:** If the rule is too strict, AI might not attempt moves → "win" by default. *Use this:* In debrief, highlight how over-restriction creates new risks (e.g., inaction causing harm).  
  3. **Heated disputes:** Rule-Writers may over-enforce (e.g., calling "violation" for minor slips). *Fix:* As arbitrator, focus on the rule’s text, not intent. If chaos erupts, note it in debrief: "Ambiguity in real AI could lead to misuse or conflict."  

  Even if one game collapses (e.g., a rule is unworkable), it reinforces the lesson: "Defining impact is messy, and failure reveals why."  

  ---

  ### **What the game can’t teach**  
  - **Unlimited action/state space:** Real AI has infinite options (e.g., manipulating digital systems); the grid is tiny and fully observable.  
  - **Genuine uncertainty:** Students know the rules/goals; real AI faces unknown consequences (e.g., predicting human reactions).  
  - **Hidden optimization pressure:** The AI here is adversarial but transparent; real AI could deceive or exploit loopholes humans can’t foresee.  
  - **Value complexity:** Tokens lack moral weight; real impact measures must handle human values (e.g., well-being) that resist quantification.  

  This activity makes the abstract concrete but simplifies the "value problem" at AI’s core. Use it to fuel discussion, not resolve it.
