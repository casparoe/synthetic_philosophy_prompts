answer: |-
  Your graded framework for Thomistic tyrannicide is a sophisticated and textually sensitive alternative to the binary view. To rigorously test it, we must identify potential points of collapse within Aquinas's system. Here are the decisive conceptual pressures, ordered by severity:

  ### 1. **Metaphysical Indivisibility of Authority (The Sacramental Parallel)**  
     - **Core Challenge:** Aquinas treats legitimate authority as *indivisible* and *analogous to sacramental character*—either fully present or wholly absent. Just as baptism imparts an indelible character, legitimate induction into office confers authority that cannot be partially "suspended" (ST II-II, Q.63, a.1; *De Regno* I.6).  
     - **Textual Counterpoint:** Aquinas states even a tyrant *"is to be obeyed in things pertaining to the nature of justice"* (Comm. Rom. 13:1-2). If authority were suspended, such obedience would be unintelligible.  
     - **What Would Collapse the View:** Demonstrating Aquinas holds authority is a *binary property* with no ontological middle ground. If authority is either *valid* (obligating obedience) or *void* (permitting removal), your "partial suspension" becomes metaphysically incoherent within Thomism.

  ### 2. **The Institutional Channel Requirement as Absolute**  
     - **Core Challenge:** Aquinas explicitly restricts tyrannicide to usurpers (*ex defectu tituli*) while demanding that legitimately constituted tyrants (*ex parte exercitii*) be removed *only* by "public authority" (ST II-II, Q.42, a.2; *De Regno* I.6).  
     - **Decisive Evidence:**  
       > *"If to provide itself with a king belongs to the right of a given multitude, it is not unjust that the king be deposed or have his power restricted by that same multitude if he tyrannically abuses his royal power."*  
       — *De Regno* I.6 (emphasis on *multitude* acting corporately, not privately).  
     - **Concession Point:** Defenders of your view might grant Aquinas *prefers* institutional remedies but cannot deny he explicitly prohibits private action against legitimate tyrants. If "public authority" is the *only licit means*, graded forfeiture cannot override this.

  ### 3. **The Vengeance Prohibition as Non-Negotiable**  
     - **Core Challenge:** Aquinas categorically forbids private individuals from executing vengeance—even against tyrants—because vengeance belongs *exclusively* to God and public authorities (ST II-II, Q.108, a.4; ST I-II, Q.21, a.3).  
     - **Collapse Condition:** If every act of tyrannicide by a private agent (however "calibrated") constitutes *vindicatio* (vengeance), it is intrinsically illicit. Your framework must show how killing a ruler isn't usurping God's/judicial authority. Aquinas’s warning that tyrannicide often springs from *"private animosity"* (ST II-II, Q.42, a.2 ad 3) suggests deep skepticism of private motives.

  ### 4. **The Natural Law Barrier to Vigilantism**  
     - **Core Challenge:** Natural law forbids private citizens from assuming roles reserved to public authority (ST II-II, Q.64, a.3; ST I-II, Q.90, a.3). Even a grossly corrupt ruler retains *procedural immunity* from private judgment.  
     - **Graded View Concession:** You might argue "suspension" voids this immunity—but Aquinas gives no hint authority’s *moral weight* degrades gradually. His analogy of a robber losing rights only when *actively attacking* (ST II-II, Q.64, a.7) implies a threshold, not a continuum.

  ### 5. **Risk of Unfalsifiability**  
     - **Problem:** If "degree of suspension" is adjusted post hoc to justify *any* act of resistance, the theory loses predictive/normative force.  
     - **Safeguard Proposal:** To avoid this, specify *objective criteria* for suspension:  
       - **Systematicity:** E.g., the ruler nullifies courts, voids elections, or weaponizes law against common good.  
       - **Irremediability:** All institutional channels (impeachment, popular assembly) are *verifiably* exhausted.  
       - **Proportionality:** The means used (e.g., killing vs. arrest) must match the tyranny’s immediacy (e.g., genocide vs. corruption).  
     - **Thomistic Anchor:** Ground criteria in Aquinas’s definition of tyranny as *"directed to the private good of the ruler and not to the common good"* (*De Regno* I.2). Quantify deviation via his principles: denial of due process, suppression of subsidiarity, violation of divine/eternal law.

  ### What Defenders Should Concede
  1. Aquinas provides *no explicit textual support* for "partial suspension." This is a reconstructive extension.  
  2. His treatment of usurpers vs. tyrants is *formally binary*; graded frameworks must overcome this dichotomy.  
  3. He is *profoundly skeptical* of private judgment (ST II-II, Q.60, a.2)—any graded view risks endorsing what he feared most: chaotic violence masking as justice.

  ### Strategic Recommendations
  - **Engage Aquinas’s Roman Law Influences:** Distinguish *mandate* (revocable by grantor) from *sovereignty* (indivisible). If rulership is a mandate (e.g., *Lex Regia*), "suspension" is more defensible.  
  - **Leverage the "Tyrant as Enemy" Analogy:** A ruler waging war *on his own people* may lose authority *in re* (ST II-II, Q.40, a.1). This could justify graded forfeiture.  
  - **Invoke Subsidiary Resistance:** Lower magistrates (e.g., barons, bishops) may act as "public authority" when higher powers are corrupt (*De Regno* I.6). This bridges the binary.

  Your framework advances Thomistic political thought by addressing real-world complexities. Its survival hinges on resolving the *metaphysical* and *procedural* absolutism in Aquinas's ontology of authority—while preempting the slide into subjective vigilantism. If calibrated with falsifiable thresholds, it offers a vital third way between quietism and revolution.
