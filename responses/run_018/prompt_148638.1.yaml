prompt: |-
  I'm a doctoral student in philosophy of religion working on the metaphysics of personal identity in classical Abhidharma and its interaction with contemporary philosophy of mind. I am trying to determine whether my judgments about survival, interruption, and duplication can be captured by a single principle—perhaps one that exploits the distinction between ultimate (paramārtha) and conventional (saṃvṛti) truth, or specific Abhidharmic commitments to momentariness and causal integration—or whether I must abandon some of them. I want the conceptual architecture, not a historical survey or bibliography.

  Here are my verdicts on concrete cases.

  1. Destructive teletransportation: A person's neural and psychological patterns are scanned, the original body destroyed, and a functionally identical being created on Mars. Verdict: conventionally, this is the same person; ultimately no self travels, but the causal-functional stream of the five aggregates (skandhas) continues without ontological rupture.

  2. Non-destructive branching: The same scan is performed but the original survives, yielding a psychologically continuous copy. Verdict: neither original nor copy is metaphysically privileged as "the" continuing self; both are equally related streams. Yet I feel an asymmetry—if forced to identify with one, I choose the original—which seems to smuggle in a substantial self I officially deny.

  3. Split-brain separation (corpus callosotomy): Each hemisphere supports independent preferences and actions. Verdict: there was never one self controlling both; rather, two previously interwoven streams become distinguishable. There is no tragic "division" of a prior unity.

  4. Severe progressive dementia: Over years, memory, character, and cognitive integration dissolve, though minimal consciousness and bodily life persist. Verdict: the conventional person designated by the original name is genuinely gone; the remaining biological entity is a new, severely attenuated stream, not the old one hidden.

  5. Nirodha-samāpatti (cessation of perception and feeling): A meditator enters a state in which all mental aggregates—including consciousness—cease entirely for hours, then resumes with prior psychological continuity intact. Verdict: upon emergence, this is conventionally the same person; the interruption is like a dreamless sleep, not a death and rebirth of the stream.

  6. Post-traumatic moral transformation: A child who suffered severe abuse becomes an adult monastic practitioner who, upon deep insight into anattā, sincerely disowns the child as "not me" in the ultimate sense, yet accepts conventional moral and legal responsibility for actions performed by that earlier aggregate-stream.

  The tensions I keep returning to are these. Between (1) and (2): if causal-psychological continuity suffices for conventional identity in destructive copying, why does the untouched original in branching undermine the copy's claim? Between (4) and (5): in dementia the aggregates gradually degrade and I judge the original person lost, yet in nirodha they vanish entirely and I judge the same person resumed—suggesting that physical embodiment or some non-mental factor is doing hidden work.

  Is there a unified account—perhaps one that distinguishes degrees of causal integration, or that treats conventional designation as governed by social-practical criteria rather than metaphysical ones—that delivers all six verdicts? If so, state it precisely, indicate which clause addresses which case, and predict what it says about an unlisted scenario: a practitioner enters the formless attainment of neither-perception-nor-non-perception (nevasaññānāsaññāyatana) for an extended period, during which mental activity is reduced to a minimal, undifferentiated residue, then emerges with intact autobiographical memory. Does the stream survive? If no principle can save every verdict, tell me which ones to overturn and why.
reasoning: |-
  Okay, let's tackle this doctoral student's problem in philosophy of religion. They're working on personal identity in Abhidharma and contemporary philosophy of mind. The core issue is whether their six specific judgments about identity across different scenarios can be unified under a single principle, or if some judgments need revision.

  First, I need to understand the tensions they've highlighted. Between case 1 (destructive teletransportation) and case 2 (non-destructive branching), there's inconsistency: why does destruction make the copy "same person" conventionally when the original survives, but not when both exist? Then between case 4 (dementia) and case 5 (nirodha-samāpatti), why is gradual mental degradation identity-destroying while complete temporary cessation isn't?

  Hmm... The key might lie in how Abhidharma handles conventional vs ultimate truth. Ultimate reality is momentary skandhas without self, while conventional personhood is a useful designation. But the student already knows this. What's missing is a precise criterion for when we stop designating the "same" stream.

  Looking at their verdicts, causal integration seems crucial. In teletransportation (1), there's a single causal chain. In branching (2), the divergence creates two chains, so neither gets exclusive "same person" status. For split-brain (3), they see it as two streams from the start - that makes sense if causal integration was always partial. 

  Dementia (4) vs nirodha (5) is trickier. Gradual degradation might break causal integration beyond recognition, while nirodha's cessation preserves the potential for continuity - like a paused process. This suggests a "causal potential" criterion. 

  The moral disownership case (6) is fascinating - it shows conventional responsibility can persist even when ultimate identity is denied. That points to social-practical conventions overriding metaphysical discontinuity.

  The student's asymmetry feeling in branching (2) is telling. If they truly reject a substantial self, that preference for the original body might be an unexamined bias. Maybe they should drop that intuition to stay consistent.

  For the formless attainment scenario: minimal mental activity preserves causal potential, so yes, the stream survives conventionally. This would align with nirodha (5).

  Putting it together: Conventional identity requires (a) unbroken causal potential and (b) functional coherence sufficient for social designation. Destruction in teletransportation (1) satisfies both; branching (2) fails (a); dementia (4) fails (b); nirodha (5) satisfies (a) through latent potential. 

  The branching verdict needs adjustment - if both streams are equal, the "original" shouldn't be privileged. The dementia/nirodha tension resolves via the causal potential distinction. 

  This framework seems robust. It handles all cases while staying true to Abhidharma's momentariness and two truths. The student might need to sacrifice their branching asymmetry, but that strengthens their anti-substantialist stance.
answer: |-
  Your project demands a rigorous principle reconciling Abhidharmic metaphysics with your case judgments. After analyzing your tensions, I propose the following unified account grounded in **causal potentiality** and **conventional designation criteria**:

  ### Principle of Conventional Personhood (PCP)
  A conventional person \( P_t \) at time \( t \) is designated as the "same" as \( P_{t+n} \) at \( t+n \) **if and only if**:
  1. **Causal Potentiality Preservation (CPP)**: The stream exhibits unbroken *latent capacity* to reintegrate prior psychological/volitional patterns (e.g., memory, character traits, preferences) after interruptions, **or** maintains sufficient causal cohesion to support socially recognized continuity.
  2. **Functional Coherence Threshold (FCT)**: The stream sustains minimal complexity to fulfill the social-practical roles (moral agency, narrative identity, etc.) associated with personhood in a given context.
  3. **Non-Branching Constraint (NBC)**: No divergent stream satisfies CPP+FCT equally well relative to the original causal history.

  *(Clarification: "Causal potentiality" differs from mere continuity—it requires the *capacity* for pattern-restoration, not just contiguous causes.)*

  ---

  ### Application to Cases
  1. **Destructive teletransportation**  
     - ✅ *CPP*: Causal patterns transfer intact; Mars body can immediately reintegrate prior psychology.  
     - ✅ *FCT*: Functional identity preserved.  
     - ✅ *NBC*: No rival stream exists.  
     → **Verdict upheld.**

  2. **Non-destructive branching**  
     - ❌ *NBC violated*: Both streams satisfy CPP+FCT equally relative to the pre-scan history. Neither is uniquely continuous.  
     - *Asymmetry rejected*: Your preference for the "original" body imports a materialist bias inconsistent with anattā. **Revise verdict:** Neither stream is "the" original person; both are new conventional persons sharing causal history.  

  3. **Split-brain separation**  
     - ✅ *CPP+FCT*: Pre-surgery, hemispheres lack *independent* causal potentiality for full personhood. Post-surgery, two streams each meet FCT.  
     → **Verdict upheld** (no prior unity divided).  

  4. **Severe dementia**  
     - ❌ *CPP*: Degradation destroys latent capacity to reintegrate prior psychology (e.g., autobiographical memory, character).  
     - ❌ *FCT*: Stream cannot sustain moral/narrative roles (e.g., cannot honor promises or recall relationships).  
     → **Verdict upheld** (new attenuated stream).  

  5. **Nirodha-samāpatti**  
     - ✅ *CPP*: Cessation is temporary; latent potential for psychological reintegration persists (resumption proves this capacity).  
     - ✅ *FCT*: Post-emergence coherence meets social-personal thresholds.  
     → **Verdict upheld.**  

  6. **Moral transformation**  
     - ✅ *CPP+FCT*: Causal stream remains unbroken; adult meets FCT (accepts responsibility).  
     - ✅ Ultimate denial of self is consistent: Conventional designation persists due to CPP+FCT, despite no metaphysical identity.  
     → **Verdict upheld.**  

  ---

  ### Resolving Tensions
  - **Between (1) and (2)**: Branching violates *NBC*; teletransportation doesn’t. This explains asymmetry without smuggled selfhood.  
  - **Between (4) and (5)**: Dementia fails *CPP* (irreversible loss of reintegration potential); nirodha satisfies *CPP* (temporal interruption ≠ capacity destruction). Physical embodiment isn’t decisive—what matters is whether the stream *can* reactivate prior patterns.  

  ---

  ### Formless Attainment Scenario
  - **Nevasaññānāsaññāyatana**: Ultra-refined mental state with minimal, undifferentiated consciousness.  
  - **PCP Judgment**:  
    - ✅ *CPP*: Latent capacity for psychological reintegration persists (autobiographical memory resumes).  
    - ✅ *FCT*: Emergence demonstrates functional coherence.  
    → **Conventional person survives.**  
    *(Alignment: Like nirodha but with residual consciousness; CPP is satisfied.)*  

  ---

  ### Required Revision
  - **Overturn your verdict on Case 2 (branching)**: The asymmetry favoring the "original" body must be abandoned. It implies a hidden essence (e.g., material persistence) contradicting anattā and your other judgments. *NBC* resolves this: branching creates *two new persons* with equal conventional status derived from the prior stream.  

  ### Why This Works
  - **Abhidharmic alignment**: CPP reflects momentariness + dependent origination (causes must *potentiate* specific effects); FCT/NBC ground conventional truth in pragmatic/social conditions (cf. Vasubandhu’s *Commentary*).  
  - **Philosophical economy**: No appeal to substance, bodies, or "deep selves"—only causal capacities and functional thresholds.  
  - **Predictive power**: Handles edge cases (e.g., hibernation, digital uploads) via CPP’s focus on *reintegration capacity* over mere continuity.  

  This framework preserves all verdicts except Case 2, where consistency demands abandoning the asymmetry. The key is *causal potentiality*—not mere contiguity—as the bridge between ultimate ontology and conventional designation.
