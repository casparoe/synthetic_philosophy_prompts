  Hey, I was arguing with a friend about George Eliot's religion thing, and he summed up her position like this (I'm paraphrasing, not quoting): Eliot was basically a Victorian atheist who replaced God with human sympathy. She translated Feuerbach's Essence of Christianity because she agreed that religion is just human wishes projected onto an imaginary being, and she thought that once you drop that illusion you should live for social progress and moral duty to others, with no space left for anything transcendent or sacred. Her novels prove it—religious characters are either hypocrites or deluded, and her real heroism is always secular humanist compassion. So she shows you can have a fully moral life with no religion at all, and in fact religion is mostly an obstacle to real ethics. Even her talk about "the religion of humanity" was just Comtean secularism dressed up in prettier language, and her idea that moral feeling evolves out of religious feeling into pure sympathy is just a Victorian version of saying science replaces faith.

  Something feels too neat about this. I know she wasn't exactly a churchgoer, but I also remember Dinah Morris in Adam Bede being genuinely devout and portrayed positively, and I think she kept some kind of reverence for the sacred in nature and human solidarity rather than pure atheism. But I'm not sure which bits are fair simplifications and which are distortions. Could you audit this summary for me? I want to know what a careful reader of her essays and letters would accept, what they'd correct, and whether the conclusion—that she demonstrates morality works best without religion—actually follows from the accurate parts. Please seperate what is settled from what is genuinely contested among people who know the topic, and don't present a contested view as the consensus.

