answer: |-
  ### Analysis
  The phenomenon you describe involves a systematic, unacknowledged shift between three distinct baselines to classify interventions as "therapy" (morally acceptable) versus "enhancement" (morally contentious):  
  1. **Personal baseline**: Restoration to an individual’s prior functional state (e.g., your father’s cochlear implant restoring his mid-life hearing).  
  2. **Species-typical baseline**: Alignment with statistical human norms (e.g., intervening for a child below cognitive average).  
  3. **Environmental-demand baseline**: Sufficiency for contextual demands (e.g., your need for cognitive support in high-pressure work).  

  Defenders strategically select the baseline that categorizes their preferred intervention as "therapy" while excluding environmental demands to reject enhancements. This is not mere semantic ambiguity but a **rhetorical pattern** that exploits the elasticity of "normal" to uphold a moral boundary. Crucially, each baseline is independently defensible, but their inconsistent application constitutes a fallacy of context-switching.  

  ### Key Distinctions  
  - **From equivocation**: Equivocation ambiguously uses a single term (e.g., "normal") without clarifying its meaning. Here, multiple coherent baselines exist, but the *switch between them* is unacknowledged and goal-directed to preserve a moral dichotomy.  
  - **From motte-and-bailey**: Motte-and-bailey retreats from a weak claim (bailey) to a strong one (motte). This involves no retreat; it dynamically selects different strong claims (baselines) across cases to avoid conceding the boundary’s instability.  

  ### Coined Term & Definition  
  Since no established term exists for this three-way slide, I propose:  
  - **Term**: **Trilemmatic Baseline Switching**  
  - **Definition**:  
    > The rhetorical maneuver of selectively applying one of three baselines—personal historical, species-typical, or environmental-demand—to classify an intervention as therapeutic, while disregarding or rejecting the same baselines in other contexts to avoid categorizing disfavored interventions as therapy.  
    > **Boundary conditions**:  
    > - **Applies**: When defenders use ≥2 baselines inconsistently across cases to preserve the therapy-enhancement boundary.  
    > - **Does not apply**: When one baseline is uniformly applied, or baseline shifts are explicitly justified with new premises (e.g., acknowledging environmental demands as a valid basis for therapy).  

  ### Boundary Cases  
  1. **Applies**:  
     - A deaf child receives a cochlear implant to achieve species-typical hearing (species baseline), while a programmer with average cognition is denied stimulants for high-stakes work (environmental demand baseline rejected).  
  2. **Does not apply**:  
     - A uniform species-typical baseline: Age-related hearing loss is deemed "normal" for an 80-year-old (thus no therapy), while a congenitally deaf child receives implants (therapy to reach species norm). No shift occurs.  

