  hey so i've been thinking about this alot lately since my dad is dealing with age-related hearing loss and i'm also looking at some cognitive aids for work, and i keep hitting the same weird pattern in therapy-vs-enhancement arguments.

  people defend the boundary by saying therapy just restores "normal" but they slidding between totally different baselines without admitting it. with my dad, a cochlear implant counts as therapy because it restores his personal baseline from when he was forty, not species-typical hearing. but if i mention taking something to stay sharp for modern information work — my cognition is within normal human range, just inadequate for the enviroment i work in — they call that enhancement, not therapy, even though my function is mismatched to my setting. then with a kid born below statistical average but not suffering, they call intervention therapy based on species norms. so there's three baselines in play: the person's own past state, the statistical human average, and whatever the current enviroment demands. defenders of the line keep switching which one counts to keep the intervention they like on the therapy side.

  is there an established name for this exact three-way baseline slide? it's not just ambiguity, since each version sounds reasonable alone. how is it different from plain equivocation or a motte-and-bailey? if there's no specific term, can you coin one with a sharp definition and boundary cases? i'm not after a bare label — i want the actual carving: what exactly the move is, where it stops applying, and what distinguishes it from just being sloppy.

  please reply with the analysis, then a brief structured summary in JSON with exactly these fields:
  - "phenomenon_summary": one sentence describing the slide
  - "nearest_known_concepts": array of strings, each naming a concept and one-line explanation of how it relates
