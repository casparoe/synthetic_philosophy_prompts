  - "proposed_definition": a precise definition with boundary conditions
  - "key_distinctions": an object with keys "from_equivocation" and "from_motte_bailey", each explaining the difference
  - "boundary_cases": array of two short examples, one where the phenomenon applies and one where it doesn't
reasoning: |-
  We are dealing with a phenomenon where the justification for categorizing an intervention as "therapy" versus "enhancement" relies on shifting between three different baselines: 
  1. The individual's past state (e.g., restoring a person to their previous level of function).
  2. The statistical norm for the species (e.g., bringing someone up to the average human capacity).
  3. The demands of the current environment (e.g., enabling someone to function adequately in their specific context).

  The problem arises when defenders of the therapy-enhancement distinction switch between these baselines without acknowledgment, depending on which one supports categorizing the intervention as therapy.

  This is not merely ambiguity because each baseline is coherent in isolation and is used strategically to maintain the desired classification.

  Analysis:

  1. **Phenomenon Summary**: 
     - The phenomenon is the unacknowledged shifting between personal historical, species-typical, and environmental-demand baselines to maintain a therapy classification for interventions that restore to a desired state, while rejecting similar logic for enhancements.

  2. **Nearest Known Concepts**:
     - **Conceptual Slippage**: A general term for when the meaning of a concept shifts in an argument, often leading to fallacious reasoning. This is a specific instance of that.
     - **Therapy-Enhancement Distinction**: The boundary being defended, which is inherently fuzzy and context-dependent. The sliding baselines are a way of managing that fuzziness to preserve the distinction.
     - **Moral Tailoring**: Adjusting moral criteria to fit desired outcomes. This is a form of that, because the baseline is chosen to make the intervention morally acceptable (as therapy) in each case.

  3. **Fit Quality**: 
     - There is no established term for this exact three-way baseline slide in the therapy-enhancement literature. Therefore, we are coining a term. So, **no_established_fit**.

  4. **Proposed Term**: 
     - **Adaptive Baseline Drift**

  5. **Proposed Definition**:
     - Adaptive Baseline Drift is a rhetorical maneuver in which an advocate for maintaining a therapy-enhancement distinction shifts unacknowledged between three distinct baselines (personal historical, species-typical, or environmental-demand) to classify an intervention as therapeutic, while rejecting the same baseline logic when it would lead to an enhancement classification. The shift occurs in response to the specific example being discussed, adapting to preserve the therapy label for the desired cases and the enhancement label for others.

     Boundary Conditions:
     - Applies: When an argument uses at least two of the three baselines (personal, species, environmental) in different cases without acknowledging the shift, and the shift serves to maintain the therapy-enhancement boundary as desired.
     - Does Not Apply: If the baseline is fixed and consistently applied, or if the shift is explicitly acknowledged and justified.

  6. **Key Distinctions**:
     - **From Equivocation**: Equivocation is a general fallacy of using a word in multiple senses. Adaptive Baseline Drift is a specific form of equivocation that involves the term "therapy" (or the underlying concept of "normal function") and precisely three baseline types. It is distinguished by the pattern of shifting among these three specific baselines to achieve a consistent outcome (defending the therapy-enhancement boundary) and by the fact that each baseline is a legitimate concept in its own right but inconsistently applied.
     - **From Motte-and-Bailey**: Motte-and-bailey involves retreating from a controversial claim (bailey) to an easily defensible one (motte). Adaptive Baseline Drift does not necessarily involve retreat; it's a shifting of the criteria to fit different cases. Also, in motte-and-bailey, the same concept is presented in two forms (strong and weak). Here, we have three distinct baselines that are not necessarily weaker/stronger but are different dimensions.

  7. **Boundary Cases**:
     - **Applies**: 
          Case 1: A person with age-related hearing loss gets a cochlear implant to restore hearing to their mid-life level (personal baseline). The same person's child, who has normal hearing but works in a noisy environment, is denied a hearing aid because that would be enhancement (environmental demand baseline not accepted for therapy). Meanwhile, a child born with mild hearing impairment (below species average but not causing suffering) is offered intervention to bring them to species-typical hearing (species baseline).
     - **Does Not Apply**:
          Case 2: A consistent use of the species-typical baseline: an older adult with age-related hearing loss is denied a cochlear implant because it would restore hearing beyond the typical for their age group (so the baseline is fixed as species-typical for the current age group). A child born with hearing impairment is offered intervention to reach species-typical levels. A worker in a noisy environment is denied an aid because they are already at species-typical. Here, the baseline is fixed and not shifted.

