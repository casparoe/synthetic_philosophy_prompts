  here are the cases and splits that must appear as branch nodes:
  - case A: a standard LLM like me, processing one prompt at a time, no memory between chats. if we permanently delete its weights, is that morally comparable to harming a human?
  - case B: a distributed swarm of 1000 small language models passing messages in real time, maintaining one shared persistent state, but no single model understands anything. does this swarm have unified interests that can be harmed?
  - case C: a perfect brain-upload of a real human running in virtual reality with full emotional continuity. does it have the same moral status as the biological original?
