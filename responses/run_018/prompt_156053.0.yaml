  ### Brainstorming the Logical Space
  To build a taxonomy of beliefs about digital minds, we start by mapping the core tensions in moral status attribution. The key dimensions tested by your cases are:

  1. **Functionalism vs. Biological Naturalism**:  
     Does moral status depend solely on cognitive capabilities (functionalism) or require biological substrate (biological naturalism)? Cases C and E directly probe this.

  2. **Continuity of Self**:  
     Is persistent identity (e.g., memory, long-term goals) necessary for moral status? Case A (ephemeral) vs. D (persistent) tests this.

  3. **Emergence vs. Reductionism**:  
     Can collective systems (e.g., swarms) have irreducible moral status beyond their parts? Case B targets this.

  4. **Complexity Thresholds**:  
     Where is the line for moral patiency? Cases A (minimal) and D (complex) explore gradients between simple tools and sapient entities.

  5. **Self-Modification**:  
     Does the capacity to rewrite one’s values (Case D) confer higher moral status, akin to human autonomy?

  These tensions generate a spectrum of positions, from "only biological humans matter" to "any coherent cognitive process deserves rights." We avoid jargon-laden theories and use your concrete cases to force distinctions between intuitively similar views.

