  Now, the design for the simulation:

  **Round One: Formal Subsumption (5 minutes)**
  - Roles: 
    - 9 operators (3 per line for 3 production lines)
    - 2 engineers
    - 1 Capital Account (inactive in this round, just observes)
  - Setup: 
    - Each production line has a station A, B, C.
    - At station A: a deck of number cards (1-10) and a pile of blank tokens (index cards).
    - Station A: draw a number card, write that number on the token, then multiply by 2, write the result, and pass to B.
    - Station B: take the token, add 5, write the result, pass to C.
    - Station C: take the token, subtract 3, write the result. This is a finished product.
  - Rules:
    - The workers can communicate freely and know the entire process.
    - They can self-organize and help each other.
    - The engineers can move between lines, help at any station, and ensure quality.
  - Point system:
    - Each finished product is worth 10 points to the Capital Account.
