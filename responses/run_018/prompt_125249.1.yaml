  Below is a complete design for a two-round classroom simulation focused on Marx's machinery dynamics from the *Grundrisse*. It emphasizes the tension between labor-saving potential and labor-power expropriation under capitalism, without naming Marxian concepts until the debrief. The game is self-contained, uses points (not money), and requires only paper, pens, a timer, and pre-printed cards.

  ---

  ### **Game Overview**
  - **Objective**: Students experience how automation under capitalist conditions shifts from cooperative labor (Round One) to a system where machinery dominates workers and appropriates surplus (Round Two). The key nuance: Automation saves not just labor-time but *labor-power* (cognitive/coordinative capacity), creating simultaneous liberation and expropriation.
  - **Roles** (for 12 students):
    - **Machine Operators (8)**: Perform manual tasks to "produce" goods.
    - **Process Engineers (3)**: Design workflows and troubleshoot in Round One; become passive in Round Two.
    - **Capital Account (1)**: A silent role. Accumulates points from surplus in Round Two.
  - **Product**: Abstract "microchips" made by assembling three components: **A** (circle), **B** (square), **C** (triangle). Each microchip requires combining one of each component in sequence (A→B→C).
  - **Materials**:
    - Paper sheets for "components" (pre-draw 100 circles, 100 squares, 100 triangles).
    - Pens, a bell, and a timer.
    - Round Two rule cards (one per Operator; see below).

  ---

  ### **Preparation**
  1. **Room Setup**:  
     - Tables arranged in a factory-like grid. Three "assembly stations" (Station A, B, C) with chairs.  
     - Component piles: Place stacks of pre-drawn circles (A), squares (B), and triangles (C) at each station.  
     - "Finished Goods" bin at Station C.
  2. **Assign Roles**:  
     - 8 Operators: Split into Station A (3), B (3), C (2).  
     - 3 Engineers: Roam freely to observe/assist.  
     - 1 Capital Account: Sit apart, tracking points silently.  

  ---

  ### **Round One: Formal Subsumption (Manual Cooperation)**
  - **Time**: 10 minutes  
  - **Goal**: Produce "microchips" by assembling A+B+C. Operators retain direct returns based on skill/effort.  
  - **Rules**:  
    1. **Process**:  
       - Station A: Draws circles (A) on paper. Passes to Station B.  
       - Station B: Draws squares (B) *around* circles. Passes to Station C.  
       - Station C: Draws triangles (C) *touching* squares. Place in Finished Goods bin.  
       - **Quality Control**: A chip is "defective" if shapes overlap incorrectly. Engineers can fix defects.  
    2. **Communication**: Open discussion allowed. Engineers may reorganize stations or advise.  
    3. **Point Incentives** (designed for individual skill/effort):  
       - Operators: 1 point per *non-defective* chip they personally handled + 1 point per chip they *fixed* (if defective).  
       - Engineers: 1 point per *non-defective* chip produced overall (encourages coordination).  
       - Capital Account: Gets 0 points (no surplus extraction).  
    4. **Key Twist**: Coordination depends on shared knowledge. Operators *must* understand the entire workflow (A→B→C) to avoid defects.  

  ---

  ### **Transition to Round Two: "Automation Upgrade"**
  - **Time**: 2 minutes  
  - **Narrative**: "A tech upgrade introduces AI-driven machinery. Workflow is optimized for speed."  
  - **Changes**:  
    - Distribute **hidden rule cards** (one per Operator). **Engineers** lose all agency and must sit silently.  
    - **Rule Cards** (secret instructions):  
      - Station A: "Only draw circles. Do not discuss other stations."  
      - Station B: "Only draw squares. Do not ask about purpose."  
      - Station C: "Only draw triangles. Defects are not your problem."  
    - **Pace Control**: Instructor rings a bell every 30 seconds. Operators *must* pass components to the next station at each bell, even if mid-task.  
    - **Communication Ban**: No talking about the process. Questions only to instructor.  

  ---

  ### **Round Two: Real Subsumption (Automated Domination)**
  - **Time**: 10 minutes  
  - **Goal**: Same assembly task, but with rules enforcing fragmentation and surplus extraction.  
  - **Rules**:  
    1. **Process**:  
       - Stations operate in isolation (per rule cards). Components passed every 30 seconds (bell).  
       - Defects are *not fixed* (no Engineer intervention).  
    2. **Point Incentives** (designed for alienation/surplus extraction):  
       - Operators: 0.5 points per chip they *touch* (regardless of defects).  
       - Engineers: 0 points (automation replaces their role).  
       - Capital Account: Automatically gets 5 points per *finished chip* (defective or not) + 2 points per *non-defective chip* (simulating profit).  
    3. **Key Twists**:  
       - Output and total points increase (due to forced speed), but surplus flows to Capital Account.  
       - Operators cannot understand the full process (hidden rules) or reclaim value (point cuts).  
       - Labor-time per chip falls (more chips made), but labor-power (coordination/cognition) is expropriated.  

  ---

  ### **Scoring & Tracking**
  - **Instructor Role**:  
    - Tally points publicly on a board.  
    - Enforce bell pacing in Round Two.  
    - Collect "chips" to count defects.  
  - **Expected Outcomes**:  
    - **Round One**: Moderate output (e.g., 15 chips). Operators/Engineers earn similar points (e.g., 10–15 each). Defects rare due to coordination.  
    - **Round Two**: Higher output (e.g., 30 chips), but 40–50% defects. Operators earn less (e.g., 8 points each), Capital Account earns massively (e.g., 150+ points).  

  ---

  ### **Debrief: Mapping Marx (20–30 minutes)**
  **Structure the discussion as a Socratic dialogue. Begin with student experiences, then layer in theory:**  
  1. **Initial Reactions**:  
     - Ask: "What felt different between rounds? Where did you feel powerful/powerless?"  
     - *Predictable Response*: Students will blame Round Two frustration on "poor rules" or "bad teamwork." Use this to pivot to structural analysis.  

  2. **Round One as Formal Subsumption**:  
     - Key Points:  
       - Labor was *manual* but *cooperative*. Workers controlled the workflow through shared knowledge (Engineers facilitated).  
       - Points tied to *individual effort and skill*—workers retained value they created.  
       - Defects were minimized because labor-power (cognitive/coordinative capacity) was *utilized, not replaced*.  

  3. **Round Two as Real Subsumption**:  
     - Key Points:  
       - Machinery (automation rules) became an "autonomous force" that *dominated living labor*. Workers followed hidden rules/pacing, losing agency.  
       - Surplus was *automatically appropriated*: Capital Account earned points from output workers created but couldn't access.  
       - **Nuance on Labor-Power**:  
         - Automation didn’t just save *labor-time* (more chips made faster) but expropriated *labor-power*. Workers’ coordinative skills (e.g., fixing defects, optimizing workflow) were obsolete—this is the "liberating but expropriating" tension Marx identifies. Engineers were "freed" from work but disempowered.  
       - Contradiction: Objectively, labor-time per unit fell (efficiency!), but subjectively, workers felt *more constrained* (no control, no understanding of surplus extraction).  

  4. **Limitations of the Simulation**:  
     - **Predictable Gap**: Students may miss structural expropriation, attributing outcomes to "unfair rules." Stress that *real capitalism* hinges on *property law*—workers are separated from means of production (here, rules/points replaced property).  
     - **What the Game Can’t Replicate**:  
       - Marx’s *historical argument*: Real-world automation requires material dispossession (e.g., enclosing commons). Here, workers never "owned" the stations.  
       - Class struggle: No collective resistance (e.g., strikes) was possible.  

  5. **Connecting to Marx**:  
     - Reveal the *Grundrisse* context: Machinery under capitalism turns into "dead labor" dominating "living labor." Workers become "appendages" to machines.  
     - **Labor-Power Nuance**: Emphasize that machinery doesn’t just reduce toil; it "saves" workers’ mental/coordinative capacities only to alienate them. This deepens exploitation.  

  ---

  ### **What Will Go Wrong (and How to Fix It)**
  1. **Problem**: Students see Round Two frustration as "bad game design," not structural expropriation.  
     - **Fix**: In debrief, contrast objective gains (output/points ↑) with subjective losses (control ↓). Ask: "Why did total points rise, but your share fall?"  

  2. **Problem**: Engineers feel useless in Round Two and disengage.  
     - **Fix**: Preempt this by framing it: "Automation often sidelines skilled labor. Observe how your role changes."  

  3. **Problem**: Point tracking slows the game.  
     - **Fix**: Assign a TA to tally points or use a simple app/projector.  

  4. **Problem**: Operators "cheat" by communicating in Round Two.  
     - **Fix**: Strictly enforce rules. Use the bell to disrupt communication.  

  ---

  ### **Timeline for 75-Minute Seminar**
  - Intro (5 min): Explain roles, rules, and goals. *Do not mention Marx.*  
  - Round One (10 min): Manual production.  
  - Transition (3 min): Distribute rule cards, explain automation.  
  - Round Two (10 min): Automated production.  
  - Tally Points (2 min): Display results.  
  - Debrief (45 min): Structured discussion as above.  

  This simulation makes Marx’s abstraction visceral. Students experience the machinery contradiction firsthand, setting up deeper textual engagement. No external reading is needed—the game stands alone.
