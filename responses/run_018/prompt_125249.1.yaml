    - Time: 5 minutes.

  **Round Two: Real Subsumption (5 minutes)**
  - Same physical setup, but new rules:
    - The tasks are fragmented: each station is given a card with only their own instruction and not allowed to know the others'. 
      - Station A card: "Draw a number card. Write that number on the token. Then multiply it by 2 and write the result. Pass to B when the bell rings."
      - Station B card: "Take the token. Add 5 to the number written by the previous station. Write the result. Pass to C when the bell rings."
      - Station C card: "Take the token. Subtract 3 from the number written by the previous station. Write the result. If you finish, it's a finished product."
    - Pace: The instructor rings a bell every 30 seconds. At each bell, every token must move to the next station (A->B, B->C, C-> finished pile). If the operator hasn't finished, they must pass it anyway and it will likely be defective.
    - No communication about the process is allowed. They can only pass tokens at the bell.
    - The engineers are now confined to a control room (their desks) and can only watch. They are not allowed to help or coordinate.
  - Point system:
    - Each finished product is worth 10 points to the Capital Account.
    - Payment to workers:
      - Station A: 0.5 points per token processed
      - Station B: 0.5 points per token processed
      - Station C: 0.5 points per token processed + 0.5 points per finished product
      - Engineers: fixed salary of 5 points each for the round.
