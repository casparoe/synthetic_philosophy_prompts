  **Debrief:**

  We then discuss the experience and map it to Marx.

  Predictable issues:
  - In Round Two, the students might attribute their frustration to the rules being poorly designed or to bad teamwork, not to structural expropriation.
  - The point system might be too complex to track in real-time, so we should have the instructor or TAs help with accounting.

  What the simulation cannot reproduce:
  - The actual separation of workers from the means of production through property law. In the game, the workers are still using the materials provided by the Capital Account, but they don't experience the historical process of primitive accumulation.

  **Materials:**
  - Number cards (1-10) for each line, several sets.
  - Blank index cards (tokens) - many.
  - Pens for each station.
  - Bell or timer.
  - Role cards for Round Two with instructions.

  This is a complex simulation, but it should be doable in 75 minutes with 5 minutes for introduction, 10 minutes for Round One, 10 minutes for Round Two, and 50 minutes for debrief (which is ample).

