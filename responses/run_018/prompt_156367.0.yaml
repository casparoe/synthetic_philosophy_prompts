  ### Decision Tree: Fundamental Mechanism of Cognition via Analogy

  **Root Commitment**: *Analogical mapping is prior to, and not derived from, symbolic representation.*  
  All paths begin by accepting or rejecting this root. After the root, the tree branches through four diagnostic questions in sequence. Each branch node is a yes/no claim answerable without knowing the resulting leaf position.  

  ---

  #### Branching Structure:  
  1. **Branch 1 (Perceptual Operation)**:  
     *Can analogical mapping operate directly on perceptual surfaces without intermediate abstract representation?*  
     - **Yes**: Proceeds to Branch 2.  
     - **No**: Requires intermediate abstraction; proceeds to Branch 2.  

  2. **Branch 2 (Slippage Evaluation)**:  
     *Is slippage (gradual concept mutation during analogy) a productive feature driving conceptual innovation?*  
     - **Yes**: Proceeds to Branch 3.  
     - **No**: Slippage is a failure mode; proceeds to Branch 3.  

  3. **Branch 3 (Novelty Generation)**:  
     *Can analogy generate genuinely novel conceptual structures not implicitly present in the source domain?*  
     - **Yes**: Proceeds to Branch 4.  
     - **No**: Only recombines pre-existing structures; proceeds to Branch 4.  

  4. **Branch 4 (Language Dependency)**:  
     *Is linguistic capacity a downstream product of analogical cognition (not a prerequisite)?*  
     - **Yes**: Language is downstream.  
     - **No**: Language is a prerequisite scaffold.  

  ---

  #### Leaf Positions:  
  Leaves are defined by the combination of answers to the root and four branches:  
  - **Root**: Y = Accepts root (analogy prior to symbols), N = Rejects root.  
