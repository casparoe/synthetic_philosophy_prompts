prompt: |-
  I write about science and ideas for a magazine, and I'm working on a piece about what makes consent valid — across sex, medicine, data, the whole mess. I've been writing down my gut intutions on made-up cases, and now I want to know whether one principle gets them all, or close, and which of my verdicts has to go. I don't need references or the literature; I need the reasoning.

  Here are the calls. Someone says "sleep with me or I send these photos to your family": not valid. Someone says "sleep with me or I'm leaving you": valid, but it feels rancid. A broke neighbor agrees to sex for $300 that covers their rent: I keep calling that valid, and hating myself a little. Someone takes off the condom mid-sex after the other person consented to sex with a condom: not valid. A woman says she's on the pill and isn't: not valid. A guy says "I love you" just to get sex, with no intention of seeing her again: this is the one I flip on — it's clearly wrong, but I can't decide if it's a consent problem or just ordinary jerk behavior. Then there's the pair that really bugs me. A person in labor, clutching the bed and in serious pain, says yes to an epidural: valid. That same person, at that same moment, says yes to enrolling in a study comparing pain drugs: I don't trust it. Pain seems to wreck one consent and not the other. On data: an app tucks "we will sell your health data" into a 47-page terms-of-service with a pre-ticked box: not valid. Same app, different flow, a one-line popup that says "we sell your location data to ad companies, continue?" and the person clicks yes: valid, even if impulsive. Tipsy but chatty and making jokes: valid. Slurring and can't stand up: not valid. An adult with a mild cognitive disability who can restate the surgery and its main risk in her own words: valid.

  My working rule has been: consent is valid iff the person could understand the specific thing and its main risks, actually knew the material facts, and wasn't threatened. Test that rule against the list. I can already see trouble — the buried clause and the popup differ only in presentation, not in what a careful reader could find out, and the "I love you" lie seems to fall out invalid on the material-facts clause even though I'm not sure that's what I think. Also: what makes the pill lie different from the love lie? Please give me a precise principle (or a small set of candidates), tell me which of my verdicts it can't accommodate, say what it predicts for a case I didn't list, and use it to settle the I-love-you case if you can.
reasoning: |-
  Okay, the user is a science writer working on a piece about consent across different domains—sex, medicine, data, etc. They've listed several hypothetical scenarios with their intuitive judgments on whether consent is valid in each case. Now they want to test their working principle and see if a unified principle can cover all or most cases. Their current rule is: consent is valid if the person could understand the specific thing and its main risks, actually knew the material facts, and wasn't threatened.

  First, I need to analyze each scenario they provided. Let's start with the threats: "Sleep with me or I send photos" is coercion, so invalid consent. "Sleep with me or I'm leaving you" feels icky but not a threat—more like a personal boundary. Then the broke neighbor agreeing to sex for $300: they call it valid, but feel conflicted. The condom removal and lying about the pill involve deception about material facts, so consent is invalid. The "I love you" lie is tricky—they flip-flop on whether it's a consent issue or just being a jerk. 

  The labor pain cases are interesting. Agreeing to an epidural in pain is valid, but agreeing to a study isn't? Why? Maybe because medical treatment vs. research have different risk-benefit profiles. Data consent: buried in ToS isn't valid, but a clear popup is. Intoxication levels matter—tipsy but coherent is valid, slurring isn't. Cognitive disability with comprehension is valid.

  Their current rule has issues. The buried ToS vs. popup: same info, but presentation affects actual knowledge. The love lie might be a material fact in some contexts but not others. The pill lie is clearly material because it directly affects health risks, while the love lie might be about future intentions. 

  So the key is refining "material facts" to include context-dependent factors. Material facts should be those that would change a reasonable person's decision in that situation. For the love lie, in a casual encounter, it might not be material, but in a committed relationship, it could be. Also, "understand and know" needs to address how information is presented, not just availability. 

  For the labor pain difference: consent to epidural is for immediate relief, and risks are part of standard medical discussion. The study introduces unknown variables, so the material facts aren't just the procedure but the research context. Pain might impair understanding of complex study details more than a straightforward treatment.

  A better principle might be: Consent is valid if the person has capacity to understand, actually understands the material facts as they pertain to the specific context, and agrees without coercion. Material facts are those that a reasonable person in that situation would consider essential to their decision.

  This handles the ToS vs popup by emphasizing actual understanding. For the love lie, it depends on whether "love" is a material fact in that scenario. In casual dating, probably not; in a serious relationship, maybe. The neighbor case is valid because the financial need is known, and no deception or threat. The labor study might be invalid if the person can't grasp the research implications due to pain.

  Cases that challenge this: the "I'm leaving you" scenario. Is it a threat or a personal boundary? The principle might call it valid since it's not coercive, but feels gross because of power dynamics. Maybe add that consent can be valid but ethically problematic if there's exploitation without coercion. That's a separate layer.

  Another case: someone under duress but not direct threat, like in an abusive relationship. The principle might need to consider undue influence, not just threats. But the user might want to keep it focused on validity, not ethics.

  Overall, refining material facts to context and emphasizing actual understanding over available information should cover most cases. The love lie remains context-dependent, which aligns with the user's uncertainty.
answer: |-
  Here's a refined consent principle derived from your cases and designed to capture your core intuitions while addressing the tensions:

  **The Principle:**
  Consent is valid **if and only if** the person possesses the *capacity* to understand the specific act and its material implications, *actually understands* the core nature of the act and the *material facts* relevant to their decision in that context, and their agreement is not obtained through *illegitimate pressure*.

  **Key Definitions within the Principle:**

  1.  **Capacity:** The cognitive/physical ability to process information, deliberate, and communicate a choice at that moment (e.g., not unconscious, severely intoxicated, in profound unmanaged pain that impedes reasoning).
  2.  **Material Facts:** Facts that a reasonable person *in the specific context* would consider essential to their decision to consent. This includes:
      *   The core nature of the act itself (sex, surgery, data sale).
      *   Known, significant risks directly arising from the act itself (STIs, surgical complications, privacy breach).
      *   Known, significant conditions attached to the act (use of a condom, specific medical treatment, specific data usage).
      *   *Crucially:* Materiality is **context-dependent**. A fact material in one context may be less so in another.
  3.  **Illegitimate Pressure:** Threats, coercion, or exploitation that overbear or vitiate free will. This excludes:
      *   Stating personal boundaries or consequences of relationship choices ("I'm leaving you").
      *   Offering fair compensation in an arm's-length transaction *where the core nature of the exchange is clear*.
      *   Ordinary social or emotional pressures inherent in relationships or situations, unless rising to the level of duress or exploitation of vulnerability.

  **Testing Against Your Cases:**

  1.  **"Sleep with me or I send these photos":** `NOT VALID`. Illegitimate pressure (coercion via threat).
  2.  **"Sleep with me or I'm leaving you":** `VALID`. Stating a personal boundary/relationship choice is not illegitimate pressure. Capacity & understanding likely intact. (*Feels rancid due to power dynamics/emotional manipulation, but not invalidating consent under this principle.*)
  3.  **Broke neighbor agrees to sex for $300 rent:** `VALID`. Core nature (sex for money) is clear and understood. Compensation is specific and addresses the immediate vulnerability (rent). No deception or threat. It's an arm's-length transaction where the material facts are known. (*Your discomfort stems from ethical concerns about exploitation of vulnerability/poverty, which is real, but doesn't automatically invalidate consent under this narrow principle focused on the agreement's validity. The principle separates validity from ethical desirability.*)
  4.  **Stealthing (removes condom):** `NOT VALID`. Fundamental deception about a material fact (the condition of the act) directly affecting risk (STI/pregnancy). Consent was conditional on condom use.
  5.  **Lying about being on the pill:** `NOT VALID`. Fundamental deception about a material fact (biological condition) directly affecting a core risk (pregnancy). Consent was likely conditional on this fact.
  6.  **Saying "I love you" to get sex (lie):** **`VALID` (but ethically repugnant).** *Reasoning:* While deceptive, the lie is generally *not* about a **material fact** concerning the **core nature or direct risks** of the sexual act *itself* in most casual contexts. It's about future intentions/emotional state, which, while important to the *motivation*, isn't typically considered material to the *act's description or immediate risks* in the way condom use or fertility is. It's primarily unethical jerk behavior. (*Context matters: If said in a context implying exclusivity/long-term commitment where STI risk decisions depend on it, it *could* become material. Your flip-flopping reflects this ambiguity. The principle captures the baseline case as valid consent, but ethically awful.*)
  7.  **Labor: Yes to Epidural:** `VALID`. Capacity exists (pain is severe but doesn't inherently destroy capacity to understand the offered relief). Material facts (procedure, key risks/benefits) are typically communicated and understood in the context of urgent medical need.
  8.  **Labor: Yes to Research Study:** `POTENTIALLY NOT VALID / NEEDS SCRUTINY`. Capacity *might* be impaired for complex decision-making. More critically, the **material facts** are vastly different: understanding research participation, randomization, potential lack of benefit, unknown risks, confidentiality in research, etc., requires a higher level of comprehension about a non-essential (non-treatment) choice. The context (extreme pain, urgency) makes genuinely understanding these complex, non-urgent implications less likely. The *material facts* for research are different and harder to grasp under duress than for immediate treatment.
  9.  **Buried TOS clause:** `NOT VALID`. The presentation prevents *actual understanding* of the material fact (sale of health data). Capacity isn't the issue; access and presentation obstruct knowledge.
  10. **Clear Popup:** `VALID`. Material fact (sale of location data) is presented clearly, allowing for actual understanding. Capacity presumed. Impulsivity doesn't inherently invalidate capacity or understanding.
  11. **Tipsy but coherent:** `VALID`. Capacity to understand and decide is intact.
  12. **Slurring, can't stand:** `NOT VALID`. Lacks capacity to meaningfully understand or consent.
  13. **Adult with mild cognitive disability who understands:** `VALID`. Demonstrates capacity and actual understanding of the material facts (surgery and main risk).

  **Where Your Initial Rule Struggled & How This Fixes It:**

  1.  **Buried TOS vs. Popup:** Your rule ("could understand... actually knew") struggled because a "careful reader" *could* theoretically find the info in both, but the principle emphasizes **actual understanding**, which the buried clause prevents. The popup facilitates it.
  2.  **"I love you" Lie:** Your rule's "material facts" clause would likely invalidate it. The refined principle clarifies that material facts pertain to the **core nature and direct risks/conditions of the act itself**, not generally to motivations or future promises (unless context makes them directly material to the act's risks/nature, like in exclusive relationships impacting STI risk assessment). This resolves it as valid consent (though ethically bad).
  3.  **Pill Lie vs. Love Lie:** The pill lie concerns a **biological condition directly and immediately affecting a core risk of the sexual act (pregnancy)**. It's material to the act's nature/risk. The love lie concerns **future intentions/emotional state**, not the immediate nature or inherent risks of the act itself. Context can sometimes blur this, but the core distinction holds.
  4.  **Labor Pain (Epidural vs. Research):** Your rule didn't differentiate. The principle distinguishes based on **context-dependent material facts**. The material facts for immediate treatment (epidural) are simpler and directly relevant to the urgent need. The material facts for research participation are complex, non-urgent, and require a higher level of comprehension often incompatible with the duress of active labor. Pain doesn't "wreck consent" universally; it impairs the ability to process *complex or non-essential* material facts more than simple, urgent ones.

  **Predicting a New Case:**

  *   **Case:** A patient with moderate dementia consistently forgets they've agreed to a non-urgent cosmetic procedure, even after repeated explanations, but says "yes" pleasantly each time.
  *   **Principle Prediction:** `NOT VALID`. Lacks *capacity* for sustained understanding and genuine agreement. They cannot *actually understand* or retain the material facts long enough for the consent to be meaningful, despite momentary assent.

  **Settling "I love you":**
  Under this principle, the "I love you" lie, in the typical scenario described, results in **valid consent** because the deception, while reprehensible, does not concern a **material fact** about the core nature or direct risks/conditions of the sexual act itself. It is unethical manipulation, but it doesn't invalidate the consent to the act *as presented*. The core wrong is breach of trust and deception, not lack of consent. (If the lie was about being STD-free, that *would* be material and invalidate consent).

  **The "Has to Go" Verdict?**
  The principle forces a clear stance on the "I love you" lie case: it's valid consent (though awful). If your gut insists this *is* a consent violation, you'd need to dramatically broaden "material facts" to include relationship context/promises, which would invalidate many other consents (e.g., "I'm leaving you" becomes illegitimate pressure, casual sex where feelings aren't mutual becomes invalid). The principle prioritizes validity based on the act's immediate nature/risks, separating it from broader ethical judgments about motives. Your "rancid" feeling about "sleep with me or I'm leaving" and the neighbor case are acknowledged as ethical concerns, but the principle maintains they are still *valid* consents.
