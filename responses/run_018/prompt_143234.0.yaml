prompt: |-
  Compare Sidgwick's stance on psychical research — the Society stuff, being open-minded but super cautious — with his idea of the impartial spectator in ethics. Specifically, I'm wondering if the double-bind he was in (not wanting to be a gullible fool, but also not wanting to dismiss weird evidence just because it conflicts with physics) is actually the same kind of neutrality the spectator demands, or if it's something else entirely. There's this somewhat niche framing about an asymetric burden of proof for anomalous claims: the idea that rejecting a strange result and accepting it don't carry the same epistemic risk, and I suspect Sidgwick was running on that intuition without ever defending it. So: does the spectator's universalizability help justify his methodological caution, or does psychical research expose a gap in his ethics? Argue it out without giving me a bibliography — I just want to see where the comparison holds and where it collapses. You can assume I know the basic SPR context, don't lecture me on it.
