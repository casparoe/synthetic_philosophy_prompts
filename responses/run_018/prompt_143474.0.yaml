answer: |-
  Your diagnosis is perceptive and largely correct—the debate *is* fundamentally structured by a **conceptual divergence** in how "recognition" (Anerkennung) functions within Hegel's dialectic, not merely textual ambiguity. The dispute persists because the two camps prioritize distinct explanatory frameworks, each answering different philosophical questions. Here's a structural breakdown:

  ---

  ### **1. The Core Conceptual Split**
  Your distinction between **normative status** and **epistemic condition** captures the crux:
  - **Normative Status Model**:  
    Recognition is the *conferral of social authority*. Self-consciousness emerges *only* when one is granted standing (e.g., as a free agent) by another consciousness. This is **social ontology**: recognition creates the *conditions for normative agency*.  
    *Priority*: Intersubjective validation precedes self-relation.  
    *Question answered*: "How do normative structures (rights, duties, authority) originate?"  

  - **Epistemic Condition Model**:  
    Recognition is *self-knowledge through the other*. The "other" acts as a mirror, revealing the self’s dependence on external mediation for certainty. This is **phenomenology of self-consciousness**: labor/material struggle generates self-awareness.  
    *Priority*: Practical engagement (e.g., labor) enables epistemic breakthroughs.  
    *Question answered*: "How does consciousness achieve concrete self-understanding?"  

  These are not contradictory but **differently oriented**. The stalemate arises because each camp treats its focus as *primary*, rendering the other derivative.  

  ---

  ### **2. Why the Dispute is Stalled: Three Layers**
  #### **A. Conceptual Incommensurability**  
  The camps operate with distinct **explanatory ideals**:  
  - Normativists (e.g., Pippin, Brandom) seek to ground *authority* and *freedom* socially.  
  - Epistemicists (e.g., Kojève, Lukács) seek to explain the *genesis of self-awareness* through praxis.  
  **Result**: They talk past each other because "recognition" fulfills different roles in their theories—one *institutes norms*, the other *mediates self-knowledge*.  

  #### **B. Textual Underdeterminacy**  
  Hegel’s text *simultaneously* supports both readings:  
  - **For normativists**: The lord/bondsman dynamic collapses when the lord fails to receive recognition from a subordinate (emphasizing *mutuality*).  
  - **For epistemicists**: The bondsman’s self-certainty arises through labor, transforming the world *and* self (emphasizing *object-relation*).  
  Hegel’s dialectical method intentionally weaves these threads, refusing to isolate them. The dispute thrives where the text is syncretic.  

  #### **C. Unstated Philosophical Commitments**  
  Each camp imports extraneous frameworks:  
  - Normativists often assume **Kantian questions** (e.g., "How is obligation possible?").  
  - Epistemicists often assume **Marxist/materialist concerns** (e.g., "How does praxis shape consciousness?").  
  These commitments determine what counts as a "fundamental" explanation.  

  ---

  ### **3. Would Separating Normative/Epistemic Dimensions Resolve the Stalemate?**  
  **Partially, but not fully**. Distinguishing these dimensions clarifies the *structure* of the disagreement but doesn’t bridge it, because:  
  - **Hegel’s Dialectic Resists Disaggregation**: The lord/bondsman scene depicts recognition as *both* normative and epistemic *in a single process*. Labor shapes self-knowledge *while* entrenching asymmetrical status. Separating the dimensions risks missing Hegel’s point: normativity and epistemology co-evolve.  
  - **The Deeper Impasse**: The camps disagree on **what makes an explanation "Hegelian"**:  
    - Is Hegel’s project about *Spirit’s (Geist) self-actualization through institutional norms* (normative priority)?  
    - Or is it about *consciousness overcoming alienation through embodied struggle* (epistemic/practical priority)?  
    This is a **metaphysical divergence** about Hegel’s system itself.  

  ---

  ### **4. Pathways to Progress**  
  To move beyond stalemate, reframe the question:  
  #### **A. Shift from "Which is Primary?" to "How are They Mutually Constitutive?"**  
  Recognize that for Hegel:  
  - Normative status *requires* epistemic validation (e.g., the bondsman’s labor reveals the lord’s dependence).  
  - Epistemic breakthroughs *depend on* normative frameworks (e.g., labor is meaningful only within a relation of domination).  
  **Tool**: Analyze how each moment *mediates* the other.  

  #### **B. Interrogate the "Fundamental" Criterion**  
  Ask: What would it mean for recognition to be "derivative"? If labor enables recognition, does that make it ontologically prior? Or is recognition the *form* that labor-mediated self-knowledge takes socially? This exposes the camps’ unstated criteria for "foundational" explanations.  

  #### **C. Embrace the Tension as Hegelian**  
  The dialectic *is* the tension. Hegel’s point may be that self-consciousness *only* exists in the **gap** between normative demand and epistemic fulfillment—a gap that drives the struggle for mutual recognition.  

  ---

  ### **Conclusion: A Non-Exegetical Impasse**  
  The dispute is **conceptual and metaphysical**, not textual. It persists because:  
  1. Hegel’s text underdetermines whether normativity or epistemology has explanatory primacy.  
  2. The camps answer different philosophical questions (social ontology vs. phenomenology of self-formation).  
  3. Resolution is unlikely without agreeing on what constitutes a "successful" Hegelian account.  

  **Your hypothesis is correct**: The debate masks divergent intuitions about what kind of work "recognition" must do—settle normative authority or enable self-knowledge. Progress lies not in choosing sides, but in mapping how these dimensions interlock in Hegel’s dialectic. The stalemate is itself a symptom of the irreducible complexity Hegel sought to articulate.  

  If you pursue this, focus on how the *failure* of recognition in lordship/bondage—its simultaneous normative collapse and epistemic success (in the bondsman’s labor)—demonstrates their inseparability. That might transcend the dichotomy.
