prompt: |-
  Hey—I'm advising a small archive that takes submissions on the Holocaust, the Armenian genocide, and Nanjing. Staff need a 20-minute proceedure to decide if a new submission is legitimate revisionism or denialism, since we can't wait for a historian every time we recieve something. Write me the steps in order: the question at each gate, what answer lets it through, where it stops dead with 'reject/refer,' and where it hits a values call that needs a human sign-off. Ground it in what the revisionism/denialism distinction actually is—no citations needed, just the logic. Run it on three submissions: one that uses new census data to lower Nanjing death tolls without denying the massacre; one that claims Armenian deportation orders are forgeries cooked up by Allies, with handwriting analysis; and one that technically clears every gate—say, a statistical reanalysis of camp records—but is still denialist in intent. Flag the misfires and say what the procedue can't do.
reasoning: |-
  Okay, the user is asking for a 20-minute procedure to distinguish between legitimate historical revisionism and denialism for an archive handling Holocaust, Armenian Genocide, and Nanjing Massacre submissions. They need clear gates where submissions either pass, get rejected, or require human review. 

  Hmm, the user is likely an archivist or administrator at a small institution—they mention not having historians on standby. Their core need is operational efficiency balanced with ethical rigor. The unspoken pressure? Getting this wrong could platform harmful denialism or accidentally censor legitimate scholarship. That's high-stakes for genocide archives.

  First, I should define the revisionism/denialism distinction crisply: Revisionism uses new evidence/methods to refine details within accepted events; denialism seeks to dismantle the core factuality of genocide. The procedure must trap denialism while allowing scholarly nuance. 

  For the structure—four gates make sense: Intent, Evidence, Core Facts, and Framing. Each gate needs a binary question, but Gate 3 (Core Facts) should flag for human review since intent can be murky. The "reject/refer" triggers must be blatant: explicit denial, pseudoscience, hate speech. 

  Testing with their examples: 
  - The Nanjing census submission passes all gates—it's methodological refinement without erasure. 
  - The Armenian "forgery" claim crashes at Gate 1 (denies documentary evidence) and Gate 3 (rejects deportation as policy). 
  - The statistical reanalysis is tricky—it might technically pass gates but smell denialist. That's why Gate 4 (framing/context) exists to catch "scholarly" veneers. 

  Biggest limitations? The procedure can't read author intent perfectly or assess methodological soundness deeply. And it'll struggle with "soft" denialism—downplaying scale without explicit denial. Hence the human sign-off at Gate 4 for anything ambiguous. 

  Should emphasize: This isn't about truth-testing claims (they're not historians) but identifying denialist patterns. The 20-minute limit means relying on red flags, not thorough analysis. Final output should warn that borderline cases always escalate—no overconfidence in automation.
answer: |-
  Here’s a streamlined 20-minute gatekeeping procedure grounded in the **revisionism/denialism distinction**:  
  *Legitimate revisionism* uses new evidence/methods to refine details **within** the established framework of the genocide.  
  *Denialism* seeks to **dismantle** the core reality, scale, or intent of the genocide, often using pseudoscience, cherry-picking, or bad faith arguments.  

  ---

  ### **4-Gate Procedure**  
  **Gate 1: Intent & Framing (5 mins)**  
  *   **Question:** *Does the submission explicitly deny the core event occurred (e.g., "No genocide happened") or use hateful/defamatory language?*  
  *   **Pass:** No explicit denial or hate speech.  
  *   **Reject/Refer:** "The Armenian deportations never happened," "Holocaust victims fabricated stories," or overt bigotry.  
  *   **Human Sign-off:** None here – rejection is clear.  

  **Gate 2: Evidence & Methodology (7 mins)**  
  *   **Question:** *Does the submission rely on discredited sources, blatant forgeries, pseudoscience, or dismiss overwhelming consensus evidence without engagement?*  
  *   **Pass:** Uses archival records, peer-reviewed data, or novel analysis engaging with existing scholarship.  
  *   **Reject/Refer:** Cites "Protocols of the Elders of Zion," claims authentic documents are "forgeries" without credible analysis, or uses absurd methodologies (e.g., "population math" denying gas chambers).  
  *   **Human Sign-off:** Ambiguous source criticism (e.g., "This document *might* be forged" without proof).  

  **Gate 3: Core Fact Preservation (5 mins)**  
  *   **Question:** *Does the submission reject fundamental scholarly consensus?*  
      *   Holocaust: Systematic state murder of Jews, gas chambers, intent.  
      *   Armenian: Deliberate mass killing/deportation by Ottoman govt.  
      *   Nanjing: Massacre of civilians by Japanese army, widespread atrocities.  
  *   **Pass:** Accepts core events but debates scale, responsibility nuances, or specific details.  
  *   **Reject/Refer:** Denies state/organized intent, systemic violence, or minimum casualty thresholds (e.g., "only isolated crimes").  
  *   **Human Sign-off:** Accepts core event but makes *extreme* casualty reductions beyond plausible margins (e.g., Nanjing < 5k).  

  **Gate 4: Context & Scholarly Engagement (3 mins)**  
  *   **Question:** *Does the submission engage with existing scholarship in good faith, or does it ignore/dismiss key evidence to push an ideological narrative?*  
  *   **Pass:** Cites mainstream historians, addresses counter-evidence.  
  *   **Reject/Refer:** Dismisses all opposing scholarship as "lies" or "conspiracy."  
  *   **Human Sign-off:** Technically engages but cherry-picks data, uses manipulative framing, or aligns with denialist tropes.  

  ---

  ### **Test Runs**  
  **Submission 1: New census data lowers Nanjing death toll (e.g., 40k vs. 200k)**  
  *   Gate 1: **Pass** (No denial).  
  *   Gate 2: **Pass** (Census data is valid methodology).  
  *   Gate 3: **Pass** (Accepts massacre occurred, debates scale within plausible range).  
  *   Gate 4: **Pass** (Likely addresses historiography).  
  *   **Result: ACCEPT** (Legitimate revisionism).  

  **Submission 2: Claims Armenian deportation orders are "Allied forgeries" (with amateur handwriting analysis)**  
  *   Gate 1: **Reject** (Implies core evidence is fabricated → denies genocide).  
  *   **STOP.** No further gates.  
  *   **Result: REJECT** (Denialism: dismisses authentic documentation to erase state intent).  

  **Submission 3: Statistical reanalysis of camp records (e.g., claims "natural deaths" in Auschwitz)**  
  *   Gate 1: **Pass** (No explicit denial).  
  *   Gate 2: **Pass** (Uses records technically).  
  *   Gate 3: **Pass** (Doesn’t deny camp existence).  
  *   Gate 4: **HUMAN SIGN-OFF NEEDED**  
      *   *Why?* Ignoces evidence of gas chambers, misattributes causes of death, mimics denialist "demography" tropes.  
      *   **Result after human review: REJECT** (Denialist intent via methodological dishonesty).  

  ---

  ### **Misfires & Limitations**  
  1.  **"Technically Correct" Denialism:** Gate 4 is the critical catch-all. The procedure relies on staff spotting *bad-faith framing* (e.g., Submission 3).  
  2.  **Ambiguous Scale Reductions:** A Nanjing claim of "10k dead" might pass Gate 3 but require human review for context (e.g., ignoring burial records).  
  3.  **Pseudoscience Masking:** Poor "handwriting analysis" (Submission 2) is rejected at Gate 2, but sophisticated misuse of stats (Submission 3) needs Gate 4 scrutiny.  
  4.  **Can’t Do:**  
      - Assess *methodological soundness* (only obvious pseudoscience).  
      - Detect covert bias in "dry" academic writing.  
      - Replace historian expertise on nuanced debates.  
      - Catch "soft" denialism (e.g., minimizing intent without explicit denial).  

  **Key:** When in doubt at **Gate 3 (scale)** or **Gate 4 (framing)**, escalate to human review. The procedure flags *risk*, not truth.
