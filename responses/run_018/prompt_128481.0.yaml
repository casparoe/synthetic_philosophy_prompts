answer: |-
  ## Proposal: Why Promises Bind - The Normative Scoreboard & Asymmetric Revisability

  **Core Question:** Does framing promises as updates to a shared "normative scoreboard," where binding arises from the *asymmetric revisability costs* incurred by the promisee (specifically, the structural "revision debt" created when their reliance restructures planning), reveal a genuinely *distinct* mechanism for promissory obligation, or is it merely a redescription of expectation-based theories like Scanlon's?

  **Why This is Open:** The standard trio – will theories (binding from promisor's intent), expectation theories (binding from harm to promisee's reliance), and practice theories (binding from social rules) – all treat the *promisee* as fundamentally passive. The obligation lands on the promisor like a meteor, triggered by intent, reliance, or convention. Crucially, they focus on the *breach* event (fault, harm, sanction). My angle flips this: the binding force emerges *pre-breach* from the *dynamic asymmetry* created *at the moment of promising*. The promisee actively restructures their practical landscape based on the promise, incurring real (often sunk) planning costs. This act fundamentally shifts the shared normative baseline ("scoreboard"), imposing a unique "revision debt" *on the promisor* that isn't just future harm or guilt, but a *current structural cost* to *changing* that shared baseline back. Scanlon gets close with reliance/moral expectation, but his focus is still primarily on the *wrongness of breaking* causing harm. This model asks if the *creation of the asymmetry itself* constitutes the binding mechanism. Existing theories don't adequately model this active promisee role or the pre-breach structural shift, leaving the question wide open.

  **The Plan (4 Months):**
  1.  **Month 1: Formalize the Scoreboard & Debt.** Rigorously define the "normative scoreboard" – a shared representation of commitments/permissions. Detail the update mechanism: promising adds an entry. Crucially, model the *asymmetric revisability*: the promisee's reliance (planning, resource allocation, forgone options) creates "friction" or sunk costs *for them* to revise *their* position if the promise is withdrawn. This friction constitutes the promisor's "revision debt" – the cost *they* must effectively pay (morally, practically) to undo the update. Distinguish from mere disappointment.
  2.  **Month 2: Stress-Test the Model.** Pit the model against hard cases: a) *Coerced Promises:* Does the "debt" arise if the promisee knows the promise is coerced and *doesn't* rely? (Likely not, weakening the claim). Does *any* reliance create debt? b) *Third-Party Reliance:* If C relies on A's promise to B, does this create revision debt for A owed *to B*? Or is the model promisee-specific? Can it explain why B, not C, typically has the claim? Refine model based on results.
  3.  **Month 3: Collapse Check.** Compare directly to expectation theories (especially Scanlon) and practice theories. Does "revision debt" reduce *without remainder* to the expectation damages Scanlon emphasizes? Or does it capture something *before* breach – the altered normative relationship itself? Does it avoid circularly relying on the practice it's trying to explain? If collapse seems imminent, can the structural asymmetry be salvaged?
  4.  **Month 4: Synthesis & Draft.** Answer the core question based on Months 1-3. Integrate findings into a cohesive essay argument. If the model holds, articulate the distinct mechanism clearly. If it collapses, explain *why* and what that reveals about promissory obligation.

  **Success vs. Failure:**
  *   **Success:** The model demonstrates a *distinct* mechanism if it can: a) Explain why breaking a promise feels categorically different from just "letting someone down" *even if the disappointment is identical* (hint: the pre-existing structural debt exists in the promise case, not the ordinary let-down). b) Handle the stress-test cases without collapsing into existing views or ad-hoc fixes. c) Show how the asymmetry/debt operates *independently* of, though potentially compounded by, post-breach guilt or social sanctions.
  *   **Failure:** The model fails if: a) "Revision debt" is shown to be nothing more than a fancy term for the *risk* of causing expectation harm (Scanlon wins). b) It cannot coherently handle coerced promises or third-party reliance without abandoning its core asymmetry. c) It cannot distinguish the normative force of a promise from other similar commitments (e.g., firm intentions) where similar reliance might occur but no "binding" obligation is felt. d) The "scoreboard" metaphor proves too vague or unworkable.

  **Honest Scope Check:** Yes, this is absolutely feasible in four months *without* empirical work. It's purely conceptual/analytic philosophy. We're building and testing a theoretical model against existing literature and thought experiments. The core risks are conceptual dead-ends during formalization (Month 1) or discovering an unavoidable collapse during Month 3. Mitigation involves staying focused on the core asymmetry and being willing to refine or even significantly revise the model based on the stress-tests. No surveys, interviews, or data collection needed – just rigorous thinking and writing.

  Verdict: Promises bind primarily because they create an asymmetric structural burden ("revision debt") on the promisor, stemming from the promisee's incurred costs of planning reliance, which distinctively alters their shared normative landscape before any breach occurs.
