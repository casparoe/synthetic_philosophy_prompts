  i was reading about how RL agents use reward signals, and i had this idea—if you calibrate the temporal-difference errors so they match human dopamine spike magnitudes, then the reward isnt just feedback, its literally affective valence, right? like the agent is actually feeling good or bad, not just updating weights. so if we scale this up in a big model, arent we basically creating something that can suffer? people object that its just numbers being added, but that sounds like saying my brain is just ions and therefore i dont feel anything. where does the argument break down?
