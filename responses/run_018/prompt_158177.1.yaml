prompt: |-
  You are an expert philosopher of history with training in both historiography and philosophical methodology. Before constructing anything, spend one paragraph brainstorming the design space: consider how different institutional recording imperatives—such as legal liability versus public relations—might generate two complete, authentic, non-overlapping archives of the same bounded event without any forgery, deception, or unreliable narration, purely through structurally different descriptive protocols. Then proceed to the main task.

  Construct a realistic, non-science-fictional thought experiment—no longer than one paragraph—centered on the discovery and analysis of primary sources about a single, well-defined historical event (for example, a mid-nineteenth-century treaty negotiation, a factory strike, or a local election). Engineer the scenario so that it jointly satisfies the following three conditions, which pull in opposing directions.

  First, a historian operating in the Rankean mode—committed to critical source comparison in order to establish the past precisely as it occurred, treating interpretation as a distortion to be minimized—must be forced to concede that the available authentic sources underdetermine the event so severely that critical method alone cannot adjudicate between two mutually incompatible but equally well-supported accounts of what happened.

  Second, a historian working in the mode of E. H. Carr—who holds that historical facts are never raw but are always selected, arranged, and given significance by the historian’s present questions, social position, and concerns—must find that in this particular case, systematically altering the historian’s present commitments, political standpoint, or guiding questions does not change which sources are selected or how they are arranged, because both archives yield identical selections and orderings regardless of the historian’s standpoint.

  Third, a Hayden White-style narrativist—who holds that historical writing imposes literary forms of emplotment onto events that do not possess them intrinsically—must face a situation in which the two incompatible source archives already embed opposite emplotments at the level of preservation and selection itself (for instance, one archive structured as tragedy and the other as comedy), so that the historian is not imposing narrative form but is forced to choose between forms that are already materially inscribed in the documentary record.

  Constraints: all sources must be authentic records produced by contemporaneous institutional actors; do not invoke deliberate forgery, fake news, quantum mechanics, parallel worlds, predictive algorithms, or perfect predictors. After presenting the scenario, walk through the verdict that each of the three positions delivers and explain precisely why the scenario produces it. Identify the single structural feature of the case that does the work—what must be present for the three verdicts to diverge exactly as specified, and what happens to the case if that feature is removed. Finally, explain how a defender of Ranke’s position would attack the thought experiment without simply denying the source gap, and how a defender of Carr’s position would attack it without denying the observed stability of selection across standpoints.

  Write in a formal, philosophical register. Do not provide bibliographies, reading lists, or citations. Do not use verbatim quotations from real texts unless you have fetched and verified the exact wording; otherwise paraphrase without quotation marks. Ensure your entire response can be understood and evaluated by a model without web access.
