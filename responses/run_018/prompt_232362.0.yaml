    "what_rejecting_it_costs": "Rejecting Step 4 means abandoning the idea that behavioral evidence alone—without auxiliary constraints—suffices for unique preference inference. We must accept that inference relies on background assumptions (e.g., rewards are state-based, sparse, or generalize across similar states). This weakens strict behaviorism and complicates IRL by requiring explicit regularization or priors.",
    "how_preference_inference_survives": "IRL and everyday attribution survive by incorporating constraints: (1) IRL methods use regularization (e.g., preferring simple or sparse rewards) and causal models of the environment to rule out 'junk' rewards; (2) Everyday inference leverages background knowledge (e.g., humans have stable, outcome-based preferences) and multiple observations across contexts. For example, your flatmate's tea-picking is best explained by a sparse reward function where 'drinking tea' has positive utility—not degenerate state-action rewards—because it generalizes to new situations (e.g., she chooses tea over coffee at a café).",
    "leftover_problem": "The hardest residual difficulty is that constraints (e.g., simplicity) are often subjective or culturally dependent, leaving room for fundamental disagreements in edge cases. For instance, does your flatmate prefer tea intrinsically, or is she avoiding coffee due to unobserved factors (e.g., caffeine sensitivity)? While constraints reduce underdetermination, they don’t eliminate it entirely, making some preference attributions uncertain or defeasible."
