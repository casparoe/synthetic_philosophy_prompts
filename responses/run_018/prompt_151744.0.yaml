  For sequencing: start by surfacing their existing "concession" model, then immediately complicate it with the textual puzzle of why specify those particular animals. That creates cognitive tension before introducing primary intention as the key. The Egyptian evidence comes next as payoff, resolving the earlier puzzle. Only then tackle misconceptions - sequencing refutations to match when each error typically arises in comprehension. 

  The check question must force application: "If Maimonides were truly anti-sacrifice, how would his argument differ?" This exposes whether they grasp the redirection logic versus simplistic rejection. 

  Crucially, boundaries: no Mishneh Torah sacrificial details, no Karaite debates. Even Maimonides' evolutionary view of prayer can be handled briefly through his "first intention" framework. The tight focus stays on how embodied habit-retraining works as divine pedagogy. 

