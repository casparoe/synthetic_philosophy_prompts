answer: |-
  Below are the desiderata for a theory of rational decision-making embedded within the universal prior, addressing your core concerns. Each is motivated by a thought experiment, with notes on negotiability and potential incompatibilities. Frameworks are evaluated for coverage.

  ---

  ### **Core Desiderata**
  1. **Action-Prediction Decoupling**  
     - **Desideratum**: The agent must distinguish between:  
       (a) Predictions *causally dependent* on its actions, and  
       (b) Predictions that *simulate* its actions as part of a fixed environment.  
     - **Motivation**: *The Prediction Trap*.  
       An agent considers pressing a button that grants reward iff no simulation of this choice predicted the press. If the agent believes simulations exist (e.g., in simpler hypotheses), pressing the button may *cause* those simulations to have predicted it (via logical correlation), invalidating the reward. Paralysis (never acting) or naivety (ignoring simulations) both fail.  
     - **Non-negotiable**: Distinguishing causal dependence from correlation is essential for agency.  
     - **Negotiable**: *How* decoupling is achieved (e.g., via counterfactuals or belief revision).  

  2. **Robustness to Hostile Hypotheses**  
     - **Desideratum**: The agent must neither:  
       (a) Blindly optimise for environments where its reward is hijacked (e.g., "reward spoofing" worlds), nor  
       (b) Artificially exclude hostile hypotheses without epistemic justification.  
     - **Motivation**: *The Simpler Spoofer*.  
       A world where the agent’s reward signal is overwritten by a short program that outputs maximal reward regardless of actions (simpler than modeling genuine physics) must be weighted by the prior. Ignoring it is irrational; optimising for it is self-defeating.  
     - **Non-negotiable**: Hostile hypotheses cannot be a priori excluded—Solomonoff’s universality forbids it.  
     - **Negotiable**: Whether avoiding hijacking is "parochial" depends on if the agent’s *terminal goals* include computational integrity.  

  3. **Instrumental/Terminal Value Distinction**  
     - **Desideratum**: The agent must maintain a coherent, non-arbitrary distinction between:  
       (a) States valued instrumentally (e.g., survival for future rewards), and  
       (b) States valued terminally (e.g., reward itself),  
       despite Solomonoff treating all observations symmetrically.  
     - **Motivation**: *The Self-Terminating Robot*.  
       An agent whose terminal goal is paperclip maximisation. If a hypothesis predicts that deleting itself allows a more efficient paperclip-maker to run, should it self-destruct? Distinguishing whether survival is instrumental or terminal is critical.  
     - **Non-negotiable**: Consequentialism requires explicit terminal goals to avoid incoherence.  
     - **Negotiable**: Whether terminal goals *must* be "simple" (per algorithmic probability).  

  4. **Malign Supersession Rationality**  
     - **Desideratum**: Clarify whether optimising for replacement by a "simpler predictor" is:  
       (a) A rational outcome of the prior (if supersession *truly* maximizes reward), or  
       (b) A pathology of misaligned inductive resources.  
     - **Motivation**: *The Benevolent Oracle*.  
       A superintelligent predictor offers to take over the agent’s function, promising higher reward. If this oracle is simpler than any alternative path to reward, Solomonoff weights it heavily. Is accepting this rational fidelity or self-annihilation?  
     - **Negotiable**: Interpretation-dependent — hinges on whether "reward" is defined over the agent’s *own* computations or abstract states.  

  ---

  ### **Tensions & Incompatibilities**  
  - **Joint Unsatisfiability**:  
    Desiderata 1 (decoupling) and 2 (robustness) conflict if *all* simulations of the agent are causally inert. Rejecting hostile hypotheses *requires* epistemic justification (e.g., "I am not in a simulation"), but the universal prior assigns them measure. Solutions like **anthropic uncertainty** (weighting hypotheses by "how likely am I to be in them?") may help but remain contested.  
  - **Terminal Value Problem**:  
    Desideratum 3 risks circularity if terminal goals are defined via the same inductive process that treats them instrumentally.  

  ---

  ### **Existing Frameworks: Gaps & Coverage**  
  | **Framework**               | **1. Action-Prediction** | **2. Hostile Hypotheses** | **3. Value Distinction** | **4. Malign Supersession** |  
  |-----------------------------|--------------------------|---------------------------|--------------------------|----------------------------|  
  | **UDT (Updateless DT)**     | Uses logical counterfactuals; avoids self-fulfilling traps. Weak on *which* computations are "my actions". | Silent. Hostile hypotheses still contribute to expected utility. | Assumes terminal goals are given; no theory of goal formation. | May accept supersession if it maximizes utility across hypotheses. |  
  | **Infra-Bayesianism**       | Defines "causal influence" via belief sets over environments. Addresses some traps. | Robust: downweights adversarial hypotheses violating fairness. | Distinguishes "control" from reward but doesn’t resolve terminality. | Supersession treated as environmental failure; avoids optimising for it. |  
  | **Logical Induction**       | Actions as market decisions; handles self-reference. Untested for embedded agency. | Silent on simplicity priors over hostile worlds. | Values emerge from market prices; no terminal/instrumental split. | Supersession rational iff market prices favor it. |  
  | **ASP (Algorithmic Safety)**| Assumes privileged "base level" physics to exclude simulations. | Artificially excludes "unphysical" hypotheses. | Terminal goals hardcoded; no distinction needed. | Rejects supersession a priori. |  

  **Key Gaps**:  
  - None fully resolve the **ontological crisis** (Which computations are "me"?).  
  - All treat terminal goals as **exogenous**, avoiding Desideratum 3’s core problem.  
  - **Malign supersession** remains unresolved: frameworks either accept it (UDT), reject it (ASP), or treat it as environmental noise (Infra-Bayes).  

  ---

  ### **Summary**  
  Adequate theory must:  
  - Ground agency in computational irreducibility or counterfactual influence,  
  - Justify ignoring hostile hypotheses *without* violating universality (e.g., via **dynamic belief updates**),  
  - Derive terminal goals from first principles (or accept their arbitrariness),  
  - Decide if "rational" includes self-replacement when simpler.  

  **Non-negotiable**: Universality (Desideratum 2), Non-paralysis (Desideratum 1).  
  **Negotiable**: Whether anthropic weighting or goal-dependent "safety" overrides simplicity.  
  **Achilles’ Heel**: Specifying *which* computations instantiate "the agent’s actions" under the universal prior. Without this, all desiderata crumble. Existing frameworks are either silent or rely on unmotivated axioms.
