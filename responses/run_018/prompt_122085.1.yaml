  We have to be concise to fit in two pages (approximately 1000-1200 words). We'll aim for clarity and precision.

  Let's draft:

  **Title:** Beyond Absolute Welfare: A Relational Approach to Prioritarianism and the Leveling-Down Objection

  **Introduction and Research Question**

  The leveling-down objection (LDO) to prioritarianism, famously articulated by Derek Parfit, contends that if equality has no intrinsic value, then prioritarianism (which assigns greater moral weight to benefits for the worse off) cannot explain why leveling down—reducing the welfare of the better off without helping the worse off—is in any way desirable. However, this objection presupposes that prioritarian weight functions are defined over absolute welfare levels. I argue that the deeper problem is that such absolute dependence makes prioritarianism unstable under uniform downward shifts in welfare (which preserve relative standing). 

  This project proposes an alternative framework: the moral weight of a position depends on its rank within a dynamically defined reference class (e.g., the current population or a relevant social group). The central research question is: 

  *Can a prioritarian theory that defines moral weights based on relative rank (within a dynamically defined reference class) avoid the leveling-down objection, or does the objection transform into a different challenge?*

  **Background and Gap: Why the Standard Framing is Inadequate**

  The standard Parfitian framing of the LDO assumes that prioritarianism must be grounded in absolute welfare levels. This leaves open the possibility that the objection is not about equality per se, but about the arbitrary anchoring of moral weight to absolute numbers. For instance, consider two worlds: one where everyone has high welfare and one where everyone has low welfare (but the same relative distribution). Standard prioritarianism would assign different weights to the same relative position in these worlds, which seems counterintuitive. If we shift all welfare levels downward uniformly, the prioritarian ordering might change even though relative inequalities are unchanged. This instability suggests that the LDO might be a symptom of a deeper issue: the absolute dependence of the weight function.

  By reframing prioritarianism in terms of relative rank in a reference class, we can test whether the LDO still applies. If the moral weight is attached to being at the bottom 10% (for example) rather than having an absolute welfare level of X, then leveling down might not be an issue because the relative ranks remain unchanged. However, this shift raises new questions: How do we define the reference class? How do we handle dynamic populations? The standard framing does not address these questions, leaving a gap in our understanding of the LDO's robustness.

  **Research Plan**

  The project will unfold over 12 months, divided into three phases:

  *Months 1-3: Conceptual Analysis and Literature Review*
  - Deep dive into the leveling-down objection, prioritarianism, and alternative approaches (e.g., relational egalitarianism, sufficientarianism).
  - Critically examine the assumption that prioritarianism requires absolute welfare levels.
  - Define the concept of a "dynamically defined reference class" and its potential variations (e.g., current population, historical cohort, social group).

  *Months 4-7: Formal Sketch and Model Development*
  - Develop a formal model of prioritarianism where the weight function depends on the relative rank of an individual's welfare within a reference class (e.g., quantile in the current distribution).
  - Define the reference class dynamically (e.g., as the population at a given time) and explore how changes in the population affect the weights.
  - Formalize the leveling-down scenario in this model: what happens when we uniformly reduce welfare while preserving ranks?
  - Investigate stability properties (e.g., invariance under affine transformations of welfare).

  *Months 8-11: Case Testing and Implications*
  - Test the model against intuitive cases, including:
    - Uniform downward shifts (does the LDO reappear?).
    - Non-uniform changes that alter ranks (how does the model respond?).
    - Cases of population growth or shrinkage (how does the reference class adjust?).
  - Compare the model's implications with standard prioritarianism and egalitarianism.
  - Explore whether the LDO transforms into a different objection (e.g., about the arbitrariness of the reference class).

  *Month 12: Synthesis and Writing*
  - Integrate findings into a complete draft of the research paper.
  - Address limitations and outline directions for future research.

  **Potential Failure Modes**

  The project would fail if:
  1. The relative rank approach cannot be formalized in a way that meaningfully differs from standard prioritarianism or egalitarianism (e.g., if it collapses into one of them).
  2. The leveling-down objection persists in a similar form even in the relative framework (e.g., if leveling down still produces a situation that the theory must count as an improvement in one respect, even if it makes no one better off).
  3. The dynamic reference class leads to intractable problems (e.g., paradoxical rankings when the population changes) that cannot be resolved without ad hoc adjustments.

  In such cases, the project would still yield valuable negative results by clarifying the boundaries of prioritarianism and the inescapability of the LDO.

  **Scope and Limitations**

  This project is a theoretical exploration. It will not:
  - Provide empirical estimates of welfare or conduct experiments.
  - Fully develop a complete theory of distributive justice (it focuses on one aspect of prioritarianism).
  - Address the metaphysical status of welfare or the reference class (it takes welfare as given and focuses on the aggregation).

  The model will be developed for a fixed population initially and then extended to dynamic cases. The reference class will be defined as the current population, but other definitions (e.g., historical or societal) will be considered. The main limitation is that we are working at a high level of abstraction; real-world applications would require additional steps.

  **Significance and Broader Impact**

  A successful result would provide a new perspective on the leveling-down objection and prioritarianism. For philosophers, it would challenge the conventional wisdom about the LDO and open new avenues for prioritarian theories.

  For scholars and practitioners in distributive justice beyond philosophy (e.g., economists, policy-makers), a useful result would be:
  - A formal framework for evaluating policies that accounts for relative position without being sensitive to absolute shifts. This could lead to more stable policy evaluations (e.g., in cost-benefit analysis) when comparing societies at different wealth levels.
  - Insight into how to design social policies that target the relatively worse off (e.g., relative poverty lines) and how such targeting might avoid some of the pitfalls of absolute prioritarianism.
  - A better understanding of when and why leveling down might be irrelevant in policy contexts (because what matters is relative standing), which could inform debates on progressive taxation, health care allocation, and social welfare programs.

  By shifting the focus from absolute to relative welfare in prioritarianism, this project aims to bridge philosophical theory and practical distributive concerns.
answer: |-
  ### Research Proposal: Rank-Based Prioritarianism and the Leveling-Down Objection  

  **Title:** Reimagining Prioritarianism: Rank-Dependent Weight Functions and the Stability of Distributive Justice  

  #### 1. Research Question  
  Can prioritarianism, when reconceived to define moral weights over *relative ranks* within a dynamically determined reference class (e.g., societal cohort), avoid the leveling-down objection (LDO)? If not, does the objection transform into a distinct problem of reference-class arbitrariness or dynamic inconsistency?  

  #### 2. Why the Standard Framing Leaves This Open  
  The Parfitian LDO argues that prioritarianism cannot explain why "leveling down" (reducing inequality by lowering the welfare of the better-off without aiding the worse-off) is undesirable if equality lacks intrinsic value. This framing assumes prioritarianism weights welfare gains based on *absolute* well-being levels (e.g., a fixed function like \( \sqrt{w} \) for welfare \( w \)). Yet this absoluteness creates instability: uniform downward shifts in welfare (e.g., a societal recession preserving relative ranks) alter prioritarian judgments despite unchanged inequality. For instance, aiding someone at \( w=2 \) in a high-welfare society may receive less weight than aiding someone at \( w=2 \) in a low-welfare society—counterintuitive if relative disadvantage is what matters.  

  The standard debate overlooks this instability, focusing narrowly on equality’s intrinsic value and neglecting how *reference dependence* shapes our intuitions. By treating welfare levels as fixed anchors, it fails to test whether prioritarianism’s vulnerability to leveling down stems from its absolutist structure. A rank-relative approach could resolve this by tethering weights to positions (e.g., "bottom 10%") within a contextually defined group, rendering judgments invariant to uniform shifts. Whether this reformulation defuses the LDO—or recasts it as a problem of defining reference classes—remains unexplored.  

  #### 3. Month-by-Month Research Plan  
  **Months 1–3: Conceptual Analysis**  
  - Critically dissect the LDO and prioritarianism’s absolute-welfare dependence, drawing on distributive justice literature.  
  - Define "reference class" (e.g., current population, historical peers) and operationalize "rank" (e.g., percentile, ordinal position).  
  - Identify edge cases: e.g., how should ranks be computed in small/incomplete groups?  

  **Months 4–6: Formal Model Sketch**  
  - Develop a rank-dependent prioritarian function: e.g., moral weight \( m(r) \) for rank \( r \) in reference class \( C \), with \( m \) decreasing in \( r \).  
  - Incorporate dynamics: specify how \( C \) updates (e.g., at time \( t \), \( C_t \) includes all living individuals).  
  - Test stability: prove whether rank-based weights are invariant to affine transformations \( w \mapsto aw + b \).  

  **Months 7–9: Case Testing & Objection Mapping**  
  - Simulate leveling-down scenarios: E.g., World A (high welfare, unequal) vs. World B (uniformly lowered, same ranks). Does rank-based prioritarianism avoid ranking B as better?  
  - Map failures: If LDO persists, does it manifest as (a) incoherence under population change, or (b) sensitivity to reference-class boundaries (e.g., national vs. global)?  
  - Compare to egalitarianism and sufficientarianism using thought experiments (e.g., a shrinking middle class).  

  **Months 10–12: Synthesis & Paper Drafting**  
  - Resolve inconsistencies (e.g., via constraints on reference classes).  
  - Draft findings, emphasizing philosophical/practical implications.  
  - Outline limitations and future work (e.g., empirical validation).  

  #### 4. What Would Count as Failure  
  The project fails if:  
  - **Formalization collapse:** Rank-dependent weights reduce to absolute prioritarianism (e.g., if ranks correlate perfectly with absolute levels) or strict egalitarianism (e.g., if only rank equality matters).  
  - **LDO resilience:** Leveling down remains a problem (e.g., the theory still implies B > A in cases where no one benefits).  
  - **Dynamic incoherence:** The model yields paradoxical judgments when populations change (e.g., aiding person X lowers their rank if newcomers are worse off).  
  Failure would still advance the field by clarifying prioritarianism’s limitations and the necessity of absolute anchors.  

  #### 5. Honest Assessment of Scope  
  **In scope:**  
  - A tractable formal model for fixed/dynamic populations.  
  - Philosophical analysis of the LDO’s evolution under rank dependence.  
  - Qualitative comparison to mainstream theories (e.g., utilitarianism).  

  **Out of scope:**  
  - Full empirical calibration (e.g., real-world welfare metrics).  
  - Comprehensive reference-class theory (e.g., resolving all boundary disputes).  
  - Non-welfare goods (e.g., health, education) unless convertible to a single index.  
  *Key constraint:* Dynamic reference classes risk overcomplication. If Month 6–7 tests reveal unresolvable edge cases (e.g., overlapping cohorts), the model may require simplifying assumptions (e.g., fixed reference classes), limiting real-world applicability.  

  #### 6. Useful Result for Distributive Justice Practitioners  
  For economists, policymakers, and social scientists:  
  - A **policy-evaluation tool** that prioritizes aid based on relative disadvantage (e.g., "target the bottom quintile"), avoiding distortions from inflation/recession. This could refine poverty alleviation programs (e.g., unemployment benefits indexed to cohort income ranks).  
  - **Stability in cross-context comparisons:** If weights are rank-based, a dollar for the poorest in the U.S. vs. Malawi receives proportional moral weight, aiding ethical resource allocation in international NGOs.  
  - **Explicit trade-offs:** If the LDO transforms into a reference-class problem (e.g., "national ranks ignore global poor"), the framework would highlight when parochialism biases decisions—pushing practitioners toward defensible reference-class choices (e.g., "all affected by a policy").  

  ---  
  **Proposal Length:** ~2 pages (excluding bibliography, per instructions).  
  **Next Steps:** I will incorporate citations (e.g., Parfit, Adler, Sen) and empirical studies in the bibliography. Let me know if you need adjustments to structure or emphasis.
