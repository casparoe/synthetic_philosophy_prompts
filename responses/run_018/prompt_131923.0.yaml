prompt: |-
  In a graduate seminar on Buddhist moral philosophy, a classmate repeatedly invoked the maxim that cetana—intention—is karma to dismiss discussion of the ship-captain parable in which a bodhisattva kills a robber to save five hundred merchants. She argued that because the captain's dominant mental state was compassionate, the killing was not unwholesome regardless of the fatal consequence, and therefore Buddhist ethics contains no consequentialist dimension whatsoever. Before I reply, I want to take that slogan apart precisely. Could you lay out the distinct theses that "intention alone determines moral quality" might be expressing—ranging from Abhidharmic claims about mental factors as the exclusive bearers of karma, to normative claims about how actions are evaluated, to Mahayana appeals to upaya—indicating for each whether it is definitional, defensible, or an overreach? For each reading, please state whether it actually supports dismissing the parable as non-consequentialist, and whether it can accommodate the possibility that a wrong mental factor (for instance, a trace of aversion or an attachment to the outcome) might coexist with the compassionate aim without altering the karmic verdict. Present this as a menu of readings I can bring to the discussion rather than a single resolution.
reasoning: |-
  Okay, the user is in a graduate seminar on Buddhist moral philosophy, and their classmate keeps using the slogan "cetana is karma" to dismiss the ship-captain parable. The user wants to dissect this slogan into distinct theses to prepare a response. Let me start by recalling the parable: a bodhisattva kills a robber to save 500 merchants. The classmate argues that because the captain's intention was compassionate, the act isn't unwholesome, thus denying any consequentialist aspect in Buddhist ethics.

  First, I need to break down "intention alone determines moral quality" into different interpretations. The user mentioned Abhidharma, normative claims, and Mahayana upaya. Let me start with the Abhidharmic perspective. In Abhidharma, karma is defined by volition; actions are secondary. So cetana as karma is definitional here. But does that mean consequences don't matter? Not necessarily—karma's results are still tied to actions, so consequences are relevant for outcomes, not the karmic quality itself. The user also asked about coexisting negative mental factors. In Abhidharma, mixed intentions might alter the karmic weight, so a trace of aversion could complicate things.

  Next, the normative claim that only intention matters in ethical evaluation. This is defensible in some contexts but might be an overreach. Theravada sources like the Kakacupama Sutta suggest consequences matter for social harmony. So while intention is primary, outcomes aren't irrelevant. A trace of aversion here could make the act unwholesome if it influences the intention.

  Then, Mahayana's upaya interpretation. Skillful means allow breaking precepts with compassionate intent. This is context-dependent. The act might not accrue negative karma, but consequences still matter pragmatically. Coexisting negative factors could invalidate the upaya claim if the intention isn't purely compassionate.

  The user needs a menu of options, not a single answer. They want to show that the classmate's dismissal might oversimplify. Each thesis has nuances; consequences play a role in different ways. Also, the presence of negative mental factors challenges the purity of intention in each reading.

  I should check if all parts of the query are addressed. The user wants to know if each thesis supports dismissing the parable as non-consequentialist and how coexisting mental factors affect it. Also, indicate whether each is definitional, defensible, or overreach.

  For the Abhidharmic view, it's definitional but consequences matter for karmic results. Mixed factors could change karma. Normative claim: defensible but overreach if exclusive; consequences matter for broader ethics. Mixed factors might tip the scale. Mahayana upaya: defensible in context; consequences matter for bodhisattva's effectiveness; mixed factors could negate the claim.

  The user's deeper need might be to engage in a nuanced discussion, showing that Buddhist ethics isn't solely intention-based. They might want to challenge the classmate's rigid view and introduce complexity. Highlighting the role of consequences and mental impurities can provide a balanced rebuttal.
answer: |-
  Here's a breakdown of the distinct theses potentially embedded in "intention alone determines moral quality," analyzing each for its nature, defensibility, implications for the parable/consequentialism, and handling of mixed mental factors. Use this as a menu to refine the discussion:

  **Thesis 1: Abhidharmic Ontology of Karma (Definitional Core)**
  *   **Claim:** Karma (*kamma*) is *defined* as volition (*cetana*) and its concomitant mental factors (*cetasika*). Karmic "seeds" (*bija*) are planted *only* in the mind-moment of intention. Physical/vocal actions are merely the *expression* or *result* of that mental karma, not karma itself.
  *   **Nature:** Primarily **Definitional** within Abhidharma psychology. This is the core meaning of "cetana is karma."
  *   **Defensibility:** Highly defensible **within its specific Abhidharmic framework**. It's a precise ontological claim about the mechanics of cause-and-effect for rebirth and mental tendencies.
  *   **Supports Dismissing Parable as Non-Consequentialist?** **Partially, but misleadingly.** It makes intention the *sole source* of karmic quality. *However*, it does *not* claim consequences are irrelevant:
      *   The *consequence* (killing) is the *inevitable expression* of the karmic intention (volition to kill).
      *   The *further consequences* (saving 500) are *future results* of *other* karmic seeds (the compassionate intention, the merchants' past karma). These are part of the complex web of results (*vipāka*), not the *quality* of the captain's *karma* at the moment of acting.
      *   **Conclusion:** It renders the *karmic quality* of the act itself non-consequentialist *by definition*, but consequences remain crucial for understanding the full karmic picture (motivation, expression, results).
  *   **Accommodating Mixed Mental Factors?** **Crucially, Yes (and it matters).** Abhidharma analyzes intention as a complex constellation of mental factors. While compassion (*karuṇā*) might be dominant, coexisting factors like aversion (*dosa*), conceit (*māna*), or wrong view (*micchādiṭṭhi*) *absolutely alter the karmic quality*.
      *   A trace of aversion ("I *hate* that I have to do this") or attachment to outcome ("I *must* be the hero") would taint the volitional complex, making it unwholesome (*akusala*), even if compassion is present.
      *   The karmic verdict *depends on the precise mixture* of mental factors in the decisive mind-moment. Purely compassionate volition is required for the act *not* to generate unwholesome karma.

  **Thesis 2: Exclusive Normative Ethical Criterion (Strong Deontology)**
  *   **Claim:** The *moral evaluation* of an action (good/bad, skillful/unskillful) rests *solely* on the quality of the agent's intention at the time of acting. Consequences are irrelevant for judging the act's ethical quality.
  *   **Nature:** A **normative claim**, often presented as the *practical implication* of Thesis 1, but logically distinct. This is where the "overreach" often happens.
  *   **Defensibility:** **Defensible but potentially an Overreach.** Many core texts emphasize intention's primacy (e.g., AN 6.63). However, exclusive dismissal of consequences is hard to sustain:
      *   Precepts inherently reference outcomes (e.g., killing *causes death*).
      *   Texts often discuss the *harmfulness* of actions (e.g., Kakacupama Sutta - MN 21, implies consequences for social harmony).
      *   The Buddha frequently advised considering consequences *before* acting (e.g., considering if speech is true, timely, beneficial - AN 5.198). This suggests consequences are relevant to forming the *right intention* and choosing the *skillful action*.
      *   **Conclusion:** Intention is the *primary* criterion, but not necessarily the *exclusive* one for a full ethical evaluation. Sole reliance is an **overreach** from the definitional core.
  *   **Supports Dismissing Parable as Non-Consequentialist?** **Appears to support it strongly**, but is flawed. If consequences are *entirely* irrelevant for judging the act, then only the captain's compassion matters. However, the act's nature (killing) and its consequences (death/saving) are likely *integral to forming and judging the intention itself* within a broader ethical framework.
  *   **Accommodating Mixed Mental Factors?** **Yes, and Critical.** This thesis *requires* purity of intention. If any unwholesome factor coexists (aversion, attachment), the act becomes unskillful (*akusala*) by definition, regardless of the compassionate aim or positive consequences.

  **Thesis 3: Mahāyāna Upāya-Kauśalya (Skillful Means Justification)**
  *   **Claim:** A fully realized Bodhisattva, motivated *exclusively* by perfect compassion (*karuṇā*) and wisdom (*prajñā*), can skillfully employ actions that *appear* to violate precepts (like killing) as a means (*upāya*) to benefit beings, without accruing negative karma. The act's conventional "wrongness" is transcended by the supreme Bodhisattva intention.
  *   **Nature:** A **context-specific normative claim** unique to advanced Mahāyāna soteriology. It appeals to the unique status and motivation of a Bodhisattva.
  *   **Defensibility:** **Defensible within the Mahāyāna framework**, but highly contextual and subject to stringent conditions (perfect motivation, no self-interest, actual greater benefit, only by advanced Bodhisattvas). Easily misapplied.
  *   **Supports Dismissing Parable as Non-Consequentialist?** **Ambiguously.** It explicitly invokes *consequences* (saving many, preventing greater harm) as the *justification* for the act *alongside* the pure intention. The act is deemed skillful *because* of the *combination* of perfect compassion *and* the foreseen beneficial outcome. It implicitly acknowledges that killing is *prima facie* unwholesome but *overridden* by ultimate compassion *and* consequence. **It thus incorporates a strong consequentialist dimension into its justification**, even while relying on intention for karmic non-accretion.
  *   **Accommodating Mixed Mental Factors?** **Absolutely Not.** This justification *collapses entirely* in the presence of *any* trace of aversion, attachment, self-view, or doubt. The act only avoids negative karma *if and only if* the intention is *perfectly* compassionate and wise, with no admixture of unwholesome factors. A trace of aversion would instantly render it a karmically negative act of murder, regardless of the intended benefit.

  **Summary Menu for Discussion:**

  1.  **Abhidharmic Definition:** Cetana=karma *by definition*. Karmic quality non-consequentialist; consequences matter for results/expression. **Mixed factors FATAL** (taint the karma).
  2.  **Exclusive Normative Criterion:** Only intention matters ethically. **Overreach.** Consequences often relevant in practice/texts for evaluation/choice. **Mixed factors FATAL** (define unskillfulness).
  3.  **Mahāyāna Upāya:** Pure Bodhisattva intention + beneficial consequence justifies apparent violation. **Defensible but narrow.** **Paradoxically relies on consequences for justification** while claiming karma hinges on intention. **Mixed factors FATAL** (invalidates upaya).

  **Key Points for Your Reply:**

  *   **"Cetana is karma" is primarily definitional (Thesis 1), not a blanket ethical rule.** Conflating it with Thesis 2 or 3 is problematic.
  *   **Consequences are not irrelevant in Buddhist ethics,** even if intention is primary. They are crucial for:
      *   Judging the *expression* of karma (Thesis 1).
      *   Forming intentions and choosing actions wisely (counter to Thesis 2).
      *   Justifying *upaya* actions in Mahāyāna (Thesis 3).
  *   **The "purity of intention" requirement is paramount.** Any coexisting unwholesome factor (aversion, attachment) likely renders the captain's act unwholesome karmically, regardless of the compassionate aim or positive outcome, under *any* of these readings. The parable only works if the intention is *flawless*.
  *   **Dismissing the parable entirely ignores its complexity.** The Mahāyāna tradition itself uses it precisely *because* it grapples with the tension between precept, intention, and consequence, showcasing the extremity of *upaya* under *perfect* conditions. It doesn't erase consequence; it wrestles with it profoundly.

  Use this menu to ask clarifying questions: "When you say intention is karma, are you referring to the Abhidharmic definition, the exclusive normative claim, or Bodhisattva *upaya*?" and "How does this reading account for the possibility of subtle aversion or attachment coexisting with compassion?" This forces precision and exposes potential overreach.
