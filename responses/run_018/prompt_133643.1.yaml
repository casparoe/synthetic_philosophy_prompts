prompt: |-
  I've been having a back-and-fourth with a mate about whether societies ever face a positive duty to actively forget, not just a permission to move on. We were bouncing around Margalit's idea about shared moral memory and Rieff's more sceptical, psychoanalytic take on the damage that collective remembrance can do, but then I cooked up this weird hybrid I'm calling archival amnesia: the state preserves every record of a past atrocity in a technically intact but permanently encrytped format, so everyone knows the archive exists but nobody can actually access the content.

  I'm running a small grad seminar on memory ethics and I'd like your take. Could you rank these four positions — Margalit's ethical duty to remember shared trauma, Rieff's case for strategic cultural forgetting, the standard liberal right-to-be-forgotten privacy framework, and my archival amnesia concept — in terms of how defensible they are in the context of transistional justice? Give each a score out of ten with a one-sentence justification. Don't worry about exact citations or page numbers; I'm after the conceptual shape rather than a bibliography. Please answer in British English, and tell me what kind of counter-example or argument would make you reorder them — in other words, where is your reasoning most likely to fall apart, and what would actually change your mind?
