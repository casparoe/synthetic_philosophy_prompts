answer: |-
  This argumentative loop doesn't have a single, universally accepted name in conservative theory or philosophy of science, but it's a well-recognized pattern. It sits at the intersection of several concepts, and we can carve it out precisely by identifying its core mechanisms and boundaries.

  **Core Mechanism & Why It's Distinct:**

  1.  **The Regenerating Hidden Function:** This is the *defining feature*. Unlike Chesterton's fence (which focuses on the *original, specific* unknown purpose) or general caution about unintended consequences (which focuses on potential *future* negative outcomes of *change*), this move **replaces a falsified historical purpose with a new, equally opaque, and often *vaguely defined* functional claim.** The justification *morphs* under pressure.
  2.  **Burden Shifting via Unfalsifiability:** When challenged on the *new* hidden function, the defender retreats to an assertion of *possible* importance ("can't prove it *doesn't* do something") rather than providing positive evidence *for* it. This **strategically reverses the burden of proof** onto the reformer to disprove a negative – an impossible task for a vague claim. This is different from simply demanding evidence for change; it's demanding proof that a nebulous *something* doesn't exist.
  3.  **From Historical Claim to Ahistorical Functionalist Assertion:** The argument begins grounded in historical wisdom (the Burkean/Oakeshottian "intimations" within tradition) but, when that history is debunked, it transforms into a **vaguely functionalist sociological or systems theory claim** ("it must serve *some* cohesion/coordination/equilibrium function now"). It loses its historical anchor but retains its conservative conclusion.

  **Boundaries & Distinctions:**

  *   **Vs. Chesterton's Fence:** Chesterton focuses on *understanding the original reason* before removal. This loop *acknowledges the original reason is gone/debunked* but invents a *new*, contemporary hidden function to justify preservation. Chesterton is about historical ignorance; this is about functional speculation.
  *   **Vs. Genuine Caution About Unintended Consequences:** Legitimate caution involves identifying *specific, plausible* negative outcomes based on an understanding of the system's complexity. This loop relies on *vague, unsubstantiated possibilities* ("it might do *something* important") that are inherently difficult to disprove. It's a *rhetorical shield* rather than a substantive prediction.
  *   **Vs. Immunization Strategies:** It *is* an immunization strategy, but a specific kind. It's not merely adding an auxiliary hypothesis (e.g., "the experiment failed because of X contaminant"). It's **wholesale replacement** of the core justification with a *different kind* of justification (historical purpose -> ahistorical systemic function) that is deliberately vague and unfalsifiable. The "immunization" is achieved by making the claim amorphous.
  *   **Vs. Epistemic Humility:** True epistemic humility acknowledges the limits of knowledge and the potential for unforeseen consequences. This loop *exploits* the language of humility ("we can't know everything") not to foster caution, but to **justify inaction and preserve the status quo indefinitely** by making any demand for evidence of the institution's *current* positive function impossible to satisfy. It weaponizes ignorance.
  *   **Vs. Path Dependence/Institutional Inertia:** These concepts *explain why* institutions persist *despite* obsolescence (sunk costs, coordination problems). This loop is the *argumentative defense* deployed to *justify* that persistence when challenged, shifting the grounds from history to nebulous function.

  **What to Call It:**

  Since no single perfect term exists, here are descriptive options, emphasizing different facets:

  1.  **Functional Regeneration (of Institutional Justification):** Highlights the core mechanism – a new function is generated after the old one is debunked.
  2.  **The Burden-Shifting Functionalist Dodge:** Emphasizes the argumentative tactics: shifting burden and retreating into vague functionalism.
  3.  **Purpose Laundering:** Likens it to money laundering – debunked reasons are "cleaned" by replacing them with vague, respectable-sounding functional claims.
  4.  **The Ever-Retreating Function:** Captures the iterative, elusive nature of the justification.
  5.  **Institutional Unfalsifiability Gambit:** Focuses on the core epistemological problem – the defense renders the institution's justification immune to empirical disconfirmation.
  6.  **Teleological Elasticity:** "Teleological" refers to purpose; "elasticity" emphasizes how the claimed purpose stretches and changes shape to avoid falsification.

  **Recommendation:** For clarity in teaching and discussion, **"Functional Regeneration"** or **"The Burden-Shifting Functionalist Dodge"** are likely the most immediately understandable and descriptive. They directly name the key moves: the *regeneration* of a new purpose and the *dodging* via burden-shifting under a *functionalist* guise.

  **The Key Edge:** The precise boundary between this loop and legitimate caution lies in the **specificity, testability, and burden of proof** after the *original* justification has been debunked. Legitimate caution points to identifiable risks. This loop posits *inherent, unknowable, systemic value* that cannot be tested and places the impossible burden on the reformer to disprove its existence. It's the **persistent appeal to unknowable necessity** as a veto on change, regenerated anew with each challenge.
