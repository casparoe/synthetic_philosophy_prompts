  I'm taking a philosphy seminar on free will and we just covered Galen Strawson's Basic Argument — the one where true moral responsability requires being causa sui, which is impossible, so nobody is truly responsible. It honestly kind of broke my brain. My roommate says it's just compatibilist coping, but I keep thinking about how we praise people for being naturally kind or having perfect pitch. If Strawson is right that you can't be responsible for your nature since you never caused it, doesn't that also kill praise for talents you never chose? Or is thier some hidden asymmetry between blame and praise that saves admiration but not culpability?

  Write an essay on whether Strawson's Basic Argument actually succeeds in undermining moral responsibility. Weigh the standard replies — that responsibility only needs appropriate causal connection rather than ultimate self-creation, and that Strawson sets the bar impossibly high — against the argument itself. But also tackle that praise/blame asymmetry: does the argument overreach into aesthetic or character admiration, and if so, is that a reductio or just a feature? Reach a real conclusion: either defend Strawson's view that true moral responsibility is impossible, or defend that the argument fails and explain exactly where it goes wrong. Don't sit on the fence — pick a side and justify it.
