answer: |-
  Here’s the translation of democratic boundary positions into immunological equivalents, followed by a residue analysis of the analogy’s fidelity:

  ### Immunological Restatement of Democratic Positions
  1. **All-Affected-Interests Principle → Danger-Response Model**  
     *"The immune system responds to DAMAGE-SIGNALS, not predefined identity."*  
     - **Immune Counterpart:** Innate immune cells (macrophages, dendritic cells) react to **Damage-Associated Molecular Patterns (DAMPs)** released by distressed tissue, irrespective of the source’s "self" status. Cytokine storms exemplify non-discriminatory responses to systemic threat.  
     - **Mapping:** Democratic decisions affecting outsiders trigger "DAMP signals" (e.g., pollution crossing borders), demanding inclusion analogous to immune recruitment to injury sites.

  2. **Co-Citizen Closure → Central Tolerance**  
     *"The body defines 'self' in the thymus; outsiders are presumptively pathogenic."*  
     - **Immune Counterpart:** **Thymic education** deletes T-cells reactive to self-antigens. Peripheral surveillance (T-cells, NK cells) eliminates unapproved entities. Blood-tissue barriers (e.g., blood-brain barrier) enforce strict exclusion.  
     - **Mapping:** Citizenship boundaries mirror thymic selection—only those "educated" into the polity (naturalized) gain recognition. Non-citizens face "immune exclusion" unless granted explicit tolerance visas.

  3. **Multi-Species Stakeholder Extension → Microbiome Symbiosis**  
     *"The 'demos' includes essential non-self entities under negotiated truce."*  
     - **Immune Counterpart:** **Commensal microbiota** (gut bacteria) are tolerated via regulatory T-cells (Tregs), IgA antibodies, and mucosal barriers. Immune systems actively sustain these "foreign" organisms for metabolic/defensive functions.  
     - **Mapping:** Non-human stakeholders (ecosystems, livestock) are the polity’s "microbiome"—integrated through **symbiotic contracts** (environmental laws, animal welfare) enforced by democratic "Treg mechanisms."

  ---

  ### Residue Report: What Translates, Distorts, or Vanishes
  **Clean Translations:**  
  - **Self/non-self discrimination ↔ Citizenship boundaries:** Both systems require operational boundaries for coherence.  
  - **Autoimmune failure ↔ Exclusion errors:** Mistaking "self" for "non-self" (autoimmunity) mirrors unjust exclusion of affected groups (e.g., disenfranchised residents).  
  - **Pathogen invasion ↔ Hostile external actors:** Malicious outsiders (infectious agents/aggressor states) justify defensive exclusion.  
  - **Peripheral tolerance ↔ Provisional inclusion:** Mucosal tolerance to food antigens parallels temporary visas or local voting rights.  

  **Distortions Required:**  
  - **Deliberation vs. Reflex:** Immune responses are **pre-programmed or evolutionary selected**; democracies *deliberate* on boundaries. Immune "decisions" lack debate or moral reasoning.  
  - **Temporal Scale:** Immune systems lack **future generations** analogs. Epigenetic inheritance is reactive, not a stewardship pact with the unborn.  
  - **Agency of the Excluded:** Gut bacteria don’t "demand inclusion"—their integration is evolutionarily hardwired. Non-human stakeholders cannot advocate in human forums.  
  - **"Affected Interests" Scope:** Immunology identifies "damage" biochemically; democracies must *interpret* "affectedness" politically (e.g., is climate change a DAMP signal to future humans?).

  **No Immunological Counterpart:**  
  - **Normative Legitimacy:** Immune systems don’t debate whether thymic selection is *ethically justified*; democracies must. The question "Who *ought* to belong?" has no immune correlate.  
  - **Dynamic Demoi Creation:** Immune "membership" is genetically fixed/evolutionarily stable. Democracies can **redefine their demos** constitutively (e.g., expanding suffrage).  
  - **Non-Symbiotic Stakeholders:** Immunology has no equivalent to including entities that offer no mutual benefit (e.g., endangered species in democracy). All tolerated "non-self" must provide functional value.  
  - **Collective Will-Formation:** Tregs suppress inflammation but don’t "negotiate" with microbiota. Democratic inclusion requires discursive validation—a uniquely political act.

  ---

  ### Conclusion: Parallels with Critical Residue
  The structural parallel **holds for operational mechanics** (boundary enforcement, threat response, symbiotic integration) but **fails at normative deliberation**. Immunology describes *how* boundaries are maintained; democracy debates *why* and *for whom* they should exist. The untranslatable residue—moral agency, future stewardship, and the self-reflexive redrawing of belonging—reveals that democratic boundaries perform **ethical work no biological system replicates**. Biology expresses membership mechanics; politics demands justification.
