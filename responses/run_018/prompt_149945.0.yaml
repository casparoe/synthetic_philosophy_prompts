answer: |-
  ## Framing the Archive: A Tripartite Invitation

  Good morning. It’s a privilege to stand before this unique convergence of minds: philosophers and cognitive scientists probing the deep structures of meaning, alongside archivists and curators who steward the tangible vessels of human experience. Our shared terrain is interpretation – the act of drawing meaning from the traces left behind.

  To navigate this complexity, I find myself returning to a powerful conceptual architecture offered by Douglas Hofstadter: the distinction between **frame messages**, **outer messages**, and **inner messages**. Let me briefly sketch this landscape, for it will shape our journey today.

  Imagine encountering an ancient, ornate box. The **inner message** is the specific treasure within it – perhaps a fragile scroll, a jewel, a single seed. This is the *content* we immediately seek, the artifact itself. In our context, these are the archival documents, the specimens, the data points – the things we directly study and analyze.

  The **outer message** is the inscription *on* the box: "Handle with Care," "Open only on Solstice," "Property of the King." It explicitly tells us *how* to interact with the inner message, giving instructions or context. For us, these are the catalog entries, the finding aids, the metadata, the curator’s notes – the explicit guidance framing the artifact.

  But beneath both lies the **frame message**. This isn't written anywhere. It’s the *unspoken agreement* about what this box *is* and what the whole interaction *means*. It’s the implicit understanding that this is a valuable object requiring reverence, that it belongs to a ceremonial tradition, that “property” implies a system of ownership. It’s the shared, often invisible, framework that makes the outer message intelligible and gives purpose to the inner message.

  Here is where our workshop’s profound challenge – and its true focus – emerges. We often debate the inner messages: What does *this* document *say*? What does *that* artifact *mean*? And we refine the outer messages: How can we *describe* or *categorize* things better? But Hofstadter’s triad pushes us deeper.

  **Our core question is not about the scroll in the box, nor solely the instructions on the lid. It is about whether we, as diverse interpreters, can ever genuinely share the *frame message* itself.**

  Can philosophers, cognitive scientists, archivists, and curators truly hold a common, unspoken understanding of what an "archive" fundamentally *is*? What the act of "interpretation" fundamentally *means*? What constitutes "evidence," "context," or even "meaning" at this foundational level?

  Hofstadter’s structure compels us to confront a striking possibility: **Perhaps frame messages are inherently, fundamentally private.** Perhaps the cognitive frameworks we bring – shaped by disciplinary training, institutional practice, personal history – are so deeply ingrained that a *shared* frame is an illusion. If that’s true, then every outer message we create – every catalog entry, every theoretical paper, every museum label – is, inevitably, already a form of *mistranslation*. It’s an attempt to bridge an unbridgeable gap between distinct, private frames.

  This framework prevents us from claiming meaning resides purely *inside* the artifact – the inner message needs the frame. It equally prevents us from claiming meaning is purely *subjective* – the frame provides a structure, however elusive, that attempts to govern shared understanding. We are caught in a dynamic, necessary tension.

  Therefore, the vital work of this workshop is not to seek a single, perfect frame – that may be impossible. Nor is it to despair at inevitable mistranslation. **It is to rigorously, respectfully, and creatively explore the *space between* our frames.** How do our different implicit assumptions manifest? Where do they clash productively? Where do they unexpectedly align? How does the friction between frames generate new insights about the objects we steward and the processes we use to understand them?

  Let us use these days not just to examine the scrolls and the inscriptions, but to become more aware of the boxes we inhabit, the unspoken agreements we carry, and the fertile, challenging ground where our frames meet. By interrogating the possibility of shared framing, we engage in the deepest act of archival interpretation: interpreting interpretation itself.

  I wish you a profoundly insightful workshop. Thank you.
