answer: |-
  Below is a point-by-point adjudication of Mara and Tomas's arguments, structured as requested. I assess each move independently, define load-bearing terms explicitly, and deliver a verdict on the core dispute.

  ---

  ### The Case for Mara (150 words)
  Mara’s steelmanned position centers on **epistemic integrity**: the truth-value of Daniel’s accusation is independent of his character. Her strongest points are:  
  1. **Tu quoque is a fallacy**. Attacking Daniel’s past doesn’t falsify Leo’s misconduct. If Daniel’s evidence is well-sourced, discarding it due to his hypocrisy risks ignoring vital truths.  
  2. **Exclusion perpetuates corruption**. Banning reformed wrongdoers from criticism ("clean hands only") shrinks the pool of legitimate accusers as corruption spreads—a self-defeating norm.  
  3. **Disclosure resolves deception**. Hypocrisy is a problem of false self-presentation. If Daniel openly admits his past, his accusation becomes purely informational—truth plus context. This transforms the act from performative blame to neutral evidence-sharing.  
  Mara correctly treats public accusations as **information vehicles**: their societal value lies in exposing harm, not the accuser’s virtue. Her solution (disclose and proceed) pragmatically separates truth-telling from moral posturing.

  ---

  ### The Case for Tomas (150 words)
  Tomas’s steelmanned position focuses on **moral authority**: blame is a performative act requiring standing, not just factual accuracy. His strongest arguments are:  
  1. **Standing is not ad hominem**. It addresses whether Daniel, *given his unacknowledged past*, is entitled to *demand accountability*. A pickpocket lacks standing to condemn theft because blame implies moral superiority he forfeited.  
  2. **Testimony ≠ blame**. Daniel’s insider knowledge (reliability) justifies sharing evidence (e.g., with auditors) but not *prosecuting* Leo. Blame imposes social consequences and implicitly claims moral high ground—a role Daniel’s unaccounted-for past voids.  
  3. **Unresolved hypocrisy vs. standing**. Disclosure fixes hypocrisy (hiding past faults) but not standing. Leo can object: "Why must I face consequences you evaded?" Standing requires prior accountability, not just admission.  
  Tomas treats blame as a **social ritual** with prerequisites: credibility + clean hands. Absent these, Daniel’s act isn’t just deceptive—it’s unjust.

  ---

  ### Move-by-Move Adjudication (500 words)
  **Load-bearing terms defined**:  
  - **Tu quoque**: Attacking the accuser, not the argument. Legitimate if questioning *standing*, not if dismissing *truth*.  
  - **Standing**: Moral authority to perform blame. Depends on credibility, consistency, and accountability.  
  - **Blame**: A performative act demanding accountability, implying moral superiority.  
  - **Reliability**: Factual credibility of testimony/sources.  

  **(1) Mara**: "Tu quoque fallacy; truth stands independent."  
  - **Rating**: *Mostly Right* (4/5).  
  - **Adjudication**: Correct that truth is separate from source (the fire alarm holds). **But** she conflates *truth-sharing* with *blame*. Daniel can report facts without positioning himself as moral arbiter.  

  **(2) Tomas**: "Truth isn’t disputed; standing is the issue. Pickpocket analogy applies."  
  - **Rating**: *Clearly Right* (5/5).  
  - **Adjudication**: Perfectly isolates standing as distinct from truth. The analogy shows blame’s performative nature: demanding accountability requires moral legitimacy.  

  **(3) Mara**: "'Standing' is vague; ex-fraudsters make good investigators; clean hands reduce critics."  
  - **Rating**: *Mixed* (3/5).  
  - **Adjudication**: **Right** that ex-fraudsters add reliability (inside knowledge) and that "clean hands only" shrinks critic pools (perverse incentive). **Wrong** to equate reliability with standing for blame. Standing involves *moral consistency*, not just expertise.  

  **(4) Tomas**: "Reliability ≠ standing. Ex-embezzler can testify but not prosecute."  
  - **Rating**: *Clearly Right* (5/5).  
  - **Adjudication**: Vital distinction. Daniel’s history *boosts reliability* (credible testimony) but *voids standing* for blame (prosecution). Blame is a social sanction—Daniel’s unacknowledged past makes his demand for Leo’s accountability hypocritical.  

  **(5) Mara**: "Hypocrisy fixed by disclosure; then only truth remains."  
  - **Rating**: *Partially Right* (3/5).  
  - **Adjudication**: **Right** that disclosure resolves *hypocrisy* (false self-presentation). **Wrong** that it resolves *standing*. Disclosure admits fault but doesn’t establish accountability (e.g., consequences, restitution). Daniel still lacks moral authority to *demand* Leo’s accountability.  

  **(6) Tomas**: "Disclosure fixes hypocrisy, not standing. Blame requires prior accountability."  
  - **Rating**: *Mostly Right* (4/5).  
  - **Adjudication**: Correct that standing requires *accountability* (owning consequences), not just admission. **But** he overlooks that in public discourse, disclosure *can* sometimes restore standing if framed as redemption (e.g., "I was wrong; now I fight this"). Daniel’s silence negates this.  

  ---

  ### What Neither Side Isolated (200 words)
  The stalemate breaks on **blame as a distinct speech act with two layers**:  
  1. **Descriptive layer**: Reporting facts (e.g., "Leo inflated metrics"). This requires reliability, which Daniel has (due to expertise and evidence).  
  2. **Performative layer**: Demanding accountability (e.g., "Leo must be sanctioned"). This requires standing: the accuser’s moral consistency and accountability for similar acts.  

  Mara reduces blame to description ("just truth plus disclosure"). Tomas overcorrects by tethering description to performative legitimacy. The solution: Daniel could separate the acts.  
  - **Permissible**: Publishing evidence *neutrally* (e.g., "Data shows anomalies in Leo’s pitch; investors should verify"). This leverages his reliability without claiming standing.  
  - **Impermissible**: Framing it as a *moral indictment* (e.g., "Leo betrayed trust; he must answer for this"). This demands standing Daniel lacks due to unacknowledged past misconduct.  

  Neither isolated that **public call-outs merge description and performance**. Daniel’s post (accusatory tone, demanding consequences) is inherently performative. Absent prior accountability, he weaponizes norms he violated—a *moral free-rider problem*. Leo’s objection isn’t to the truth but to Daniel’s role as enforcer.  

  ---

  ### My Verdict (150 words)
  **Tomas is more right overall**, but only on the specific point about **performative blame**. The dispute turns on whether Daniel’s act is purely informational (Mara) or a demand for accountability (Tomas).  

  - **Where Mara is right**: Daniel’s evidence is valuable regardless of his past. Disclosure would resolve hypocrisy, and excluding all flawed accusers is dangerous.  
  - **Where Tomas prevails**: The core act here is *blame*, not neutral truth-telling. Daniel’s unacknowledged history voids his standing to *demand* Leo’s accountability. A hypocrite may speak truth, but they cannot credibly enforce norms they flouted.  

  **The decisive point**: Blame is a social sanction requiring the accuser to "have submitted to the rules they invoke" (Hadfield). Daniel’s silence about his past makes his call-out an unjust exercise of moral authority. Truth is necessary but insufficient for legitimate blame.
