answer: |-
  **Judicial Review Decision Tree**

  **1. Primary objection type?**  
  - **Democratic**: Judges lack electoral legitimacy.  
  - **Epistemic**: Judges lack expertise/special knowledge.  
  - **Neither**: Supports judicial review.  

  **If Democratic → 2. Core problem?**  
  - **Appointment**: Should be elected, not appointed.  
  - **Tenure**: Lifetime tenure removes accountability.  
  - **Sunset**: Needs legislative re-enactment/override to confirm invalidation.  

  **If Epistemic → 2. Scope problem?**  
  - **Broad only**: Striking down laws is unacceptable, but narrow interpretation is okay.  
  - **All review**: Even narrow interpretation oversteps epistemic limits.  

  **If Neither → 2. Review strength?**  
  - **Strong**: Courts have final say on constitutional issues.  
  - **Weak**: Legislature can override/re-enact (dialogic/weak-form review).  

  **If Democratic → 3. Scope acceptability?**  
  - **Yes**: Narrow interpretation (without striking down) is democratically okay.  
  - **No**: All judicial interference is democratically illegitimate.  

  **If Epistemic → 3. Representativeness fix?**  
  - **Yes**: Non-electoral representativeness (demographic/deliberative) improves epistemic quality.  
  - **No**: Representativeness doesn’t solve expertise deficit.  

  **If Neither → 3. Representativeness required?**  
  - **Yes**: Court must be demographically/deliberatively representative.  
  - **No**: Representation unnecessary for legitimacy.  

  **If Democratic → 4. Representativeness matter?**  
  - **Yes**: Non-electoral representativeness offsets democratic deficit.  
  - **No**: Only elections confer legitimacy.  

  ---

  ### Leaf Positions & Notes  
  **Democratic Path**  
  - **Appointment + Scope:Yes + Rep:Yes**: *Unnamed*: Elected judges for narrow review only, with demographic diversity.  
  - **Appointment + Scope:Yes + Rep:No**: Elected judges for narrow review (no diversity needed).  
  - **Appointment + Scope:No + Rep:Yes**: *Awkward*: Elected judges for symbolic roles only, must be representative.  
  - **Appointment + Scope:No + Rep:No**: **Legislative supremacy** (also holds **popular constitutionalism**—tree can’t separate these).  
  - **Tenure + Scope:Yes + Rep:Yes**: Term-limited judges for narrow review, with deliberative diversity.  
  - **Tenure + Scope:Yes + Rep:No**: Term-limited judges for narrow review.  
  - **Tenure + Scope:No + Rep:Yes**: *Incoherent*: Can’t combine tenure reform with total rejection of review.  
  - **Tenure + Scope:No + Rep:No**: **Legislative supremacy**.  
  - **Sunset + Scope:Yes + Rep:Yes**: **Weak-form review** (e.g., Canadian notwithstanding clause) with representativeness.  
  - **Sunset + Scope:Yes + Rep:No**: **Weak-form review** (standard model).  
  - **Sunset + Scope:No + Rep:Yes**: *Toxic*: Sunset mechanism irrelevant if no review allowed—unexplored.  
  - **Sunset + Scope:No + Rep:No**: **Legislative supremacy**.  

  **Epistemic Path**  
  - **Broad only + Rep:Yes**: *Unnamed*: Narrow interpretation okay; representativeness enables broader review (niche).  
  - **Broad only + Rep:No**: Narrow interpretation acceptable (no striking down).  
  - **All review + Rep:Yes**: *Awkward*: Rejects all review but admits diversity would help if it existed.  
  - **All review + Rep:No**: **Legislative supremacy** (epistemic justification).  

  **Neither (Support) Path**  
  - **Strong + Rep:Yes**: **Strong review** with representativeness requirement (e.g., deliberative democracy view).  
  - **Strong + Rep:No**: **Strong judicial review** (standard U.S.-style).  
  - **Weak + Rep:Yes**: **Weak-form review** with representativeness (e.g., diversity-mandated dialogic models).  
  - **Weak + Rep:No**: **Weak-form/dialogic review** (e.g., UK model).  

  ### Empty/Problematic Branches  
  - **Tenure + Scope:No + Rep:Yes**: *Incoherent*—lifetime tenure irrelevant if no judicial role.  
  - **Sunset + Scope:No + Rep:Yes**: *Toxic*—sunset requires review to exist. Unexplored.  
  - **Epistemic + All review + Rep:Yes**: *Awkward*—rejection despite hypothetical benefit.  

  ### Unseparated Positions  
  - **Legislative supremacy** and **popular constitutionalism** both land in **Democratic → Appointment/Tenure/Sunset + Scope:No + Rep:No**. Tree can’t split them (both reject overrule but differ on popular vs. legislative authority).  

  ### Niche Distinction  
  - **Sunset mechanism** (Democratic branch) and **non-electoral representativeness** (all branches) included—rare in basic taxonomies.
