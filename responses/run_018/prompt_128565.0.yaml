  - **Root question** on microphysical closure.  
  - **First-level branches** on the nature of emergence (ontological, epistemological, pragmatic).  
  - **Second-level branches** on responses to causal exclusion (deny downward causation, reconcile it with closure, or reject exclusion).  
  - **Leaf positions** with their "awkward commitment" regarding macro-level causal laws in a completed theory.  
  - **Indistinguishable pairs** (positions identical in practice) and **gaps** (undefended combinations) noted at the end.  

  ---

  ### **Taxonomy of Emergence Positions in Complex Adaptive Systems**  
  *Navigate by answering questions about cases like flocking birds or climate phase transitions.*  

  ---

  #### **ROOT QUESTION**  
  **1. In cases like flocking or climate systems, do you accept that every physical effect has a sufficient microphysical cause?**  
     - **Yes** → Go to Question 2.  
     - **No** → Go to Question 3.  

  *(This question establishes whether microphysical closure is absolute. "No" implies exceptions to physical determinism.)*  

  ---  
  #### **FIRST-LEVEL BRANCHES**  
  ##### **If you answered "No" to Question 1 (Closure Violation):**  
  **3. Do macro-level properties (e.g., flock shape or climate phase) exert causal influence "downward" on micro-level components?**  
     - **Yes** → **Position: Strong British Emergentism**  
       *Awkward commitment: Must retain macro-level causal laws in the final theory, even with full micro-specification, as they describe irreducibly novel physical forces.*  
     - **No** → **Position: Non-Physical Interventionism**  
       *Awkward commitment: Must allow non-physical causes (e.g., fundamental randomness or external agents) that disrupt micro-dynamics but do not originate from macro-properties, making macro-laws scientifically redundant.*  

  *(This branch forces ontological emergence. Denying downward causation ("No") is rare and unattractive, as it invokes gaps without explanatory power.)*  

  ---  
  ##### **If you answered "Yes" to Question 1 (Closure Holds), answer:**  
  **2. If emergent properties (e.g., flock cohesion or climate tipping points) exist, are they:**  
     - **a) Real and irreducible, despite microphysical determination?** → Go to Question 4. *(Ontological)*  
     - **b) Reducible in principle but epistemically useful for prediction?** → Go to Question 5. *(Epistemological)*  
     - **c) Useful fictions that depend on modeling choices?** → Go to Question 6. *(Pragmatic)*  

  *(This distinguishes whether emergence reflects reality, knowledge limits, or practicality.)*  

  ---  
  #### **SECOND-LEVEL BRANCHES: HANDLING CAUSAL EXCLUSION**  
  ##### **For Ontological Emergence (Question 2a):**  
  **4. How do macro-properties (e.g., a flock’s direction) cause micro-changes (e.g., a bird’s motion) without violating closure?**  
