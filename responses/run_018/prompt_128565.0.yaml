       *Awkward commitment: Must treat macro-causal laws (e.g., "flock alignment causes individual steering") as illusory, despite their predictive success in models.*  
     - **Accept downward causation but reconcile via supervenience** → **Position: Non-Reductive Physicalism**  
       *Awkward commitment: Must retain macro-causal laws in the final theory as real patterns, even though they are fully determined by and identical to micro-dynamics.*  
     - **Reject causal exclusion** → **Position: Overdeterminist Emergentism**  
       *Awkward commitment: Must accept systematic causal overdetermination (e.g., a bird’s turn is caused by both neighbor interactions *and* flock cohesion), requiring duplicate laws in the final theory.*  

  ##### **For Epistemological Emergence (Question 2b):**  
  **5. How should we explain apparent downward causation (e.g., climate phases constraining local weather)?**  
     - **Deny downward causation** → **Position: Eliminative Reductionism**  
       *Awkward commitment: Must eliminate macro-causal laws from the final theory once micro-derivations are available, treating them as heuristic tools.*  
     - **Accept downward causation but reconcile via reduction** → **Position: Conservative Reductionism**  
       *Awkward commitment: Must reduce macro-laws to micro-dynamics (e.g., deriving flocking rules from bird interactions), making them redundant in the final theory.*  
     - **Reject causal exclusion** → **GAP: No coherent position** *(Incoherent, as reducibility contradicts the need for independent causation.)*  

  ##### **For Pragmatic Emergence (Question 2c):**  
  **6. How do models with downward causation (e.g., "tipping points cause ice loss") relate to micro-explanations?**  
     - **Deny downward causation** → **Position: Pragmatic Anti-Realism**  
       *Awkward commitment: Must discard macro-causal laws from the final theory, as they lack any truth value beyond computational shortcuts.*  
     - **Accept downward causation but reconcile as model-relative** → **Position: Perspectival Pluralism**  
       *Awkward commitment: Must retain macro-laws in the final theory for specific domains (e.g., climate policy), despite their incompleteness versus micro-physics.*  
     - **Reject causal exclusion** → **Position: Model-Dependent Causation**  
       *Awkward commitment: Must allow mutually inconsistent macro/micro causal laws (e.g., flock intent vs. particle physics), both retained for context-dependent utility.*  

  ---  
  ### **NOTES ON THE TAXONOMY**  
  1. **Indistinguishable Pairs in Practice** (same modeling implications):  
     - *Non-Reductive Physicalism* (4b) and *Overdeterminist Emergentism* (4c): Both retain macro-laws as real, reconciling downward causation without closure violation.  
     - *Perspectival Pluralism* (6b) and *Model-Dependent Causation* (6c): Both preserve macro-laws for practical utility, ignoring micro-reduction.  

  2. **Gaps in the Tree** (logically possible but undefended):  
     - **Epistemological + Reject Exclusion** (5c): Incoherent, as reducibility undermines the rejection of exclusion.  
     - **Closure Violation + Deny Downward Causation** (3→No): Neglected, as it invokes gaps without explanatory value (e.g., unmotivated "random breaks" in physics).  
     - **Pragmatic + Deny Downward Causation** (6a): Rarely defended, as it renders models like climate phase transitions arbitrary.  

  ---  
  **How to Use This Tree**:  
  1. Start at the **root (Question 1)** with a concrete case (e.g., "Does a bird’s motion in a flock *always* have sufficient micro-causes?").  
  2. Progress by choosing answers that reflect your stance on scientific practice (e.g., "Would I use macro-laws if micro-states were fully known?").  
  3. Arrive at a position with its core tension (the "awkward commitment") exposed—no prior knowledge of philosophy required.  

  This taxonomy isolates commitments to macro-causality, highlighting where philosophical rhetoric diverges from empirical practice in complex systems science.
