  ### Trading Game: "The Athenian Exchange"

  **Objective:** Students experience the inefficiencies of barter, emergence of money, its conventional nature, and the pitfalls of money-lending for interest—all while accumulating points. Aristotle's insights emerge organically through gameplay.

  **Roles & Needs Setup:**
  - **Goods:** Four types (Food, Clothing, Tools, Pottery). Assign 4 students per good.
  - **Role Cards:** Each student receives:
    - *Production:* "You produce 5 units of [Food/Clothing/Tools/Pottery]."
    - *Hidden Needs:* "You need 1 unit of [Good X] AND 1 unit of [Good Y]."  
      *(Assign needs to create double-coincidence problems: e.g., Food producers need Tools/Pottery; Clothing producers need Food/Tools, etc. Ensure no one needs their own good.)*
  - **Materials:** 
    - Colored tokens for goods (e.g., red = Food, blue = Clothing, etc.).
    - Paper slips for money ("Drachmas").
    - Score sheets.

  ---

  ### Game Rules & Phases (Total: 50 minutes)

  #### **Phase 1: Barter Chaos (10 minutes)**  
  *(Illustrates Aristotle’s point (a): Miserable barter → need for a common measure)*  
  - **Rules:**  
    - Trade goods directly (no tokens).  
    - Goal: Fulfill hidden needs (1 unit each of two required goods).  
    - No talking about needs—only negotiate trades (e.g., "I’ll give Clothing for Food").  
  - **Scoring (per round):**  
    - +10 pts per needed good acquired.  
    - +1 pt per extra good held.  
  - **Predictable Issue:** Gridlock. Players can’t find matching trades.  
    *Handling:* Let frustration build—intervene minimally.

  #### **Phase 2: Drachma Emergence (15 minutes)**  
  *(Illustrates (b): Money as conventional measure & store of value)*  
  - **Setup:** Distribute 10 Drachmas to each player.  
  - **Rules:**  
    - Goods can be sold for Drachmas OR traded for goods.  
    - Players can hold Drachmas between rounds.  
  - **Scoring:**  
    - +10 pts per needed good held.  
    - +1 pt per extra good held.  
    - +1 pt per Drachma held.  
  - **Predictable Issue:** Some hoard money; others overspend. Needs become easier to meet.

  #### **Phase 3: Currency Revolution (10 minutes)**  
  *(Reveals money’s conventionality via surprise reset)*  
  - **Mid-Game Shock:**  
    - Announce: "The Athenian Council invalidates all Drachmas! Hand them in."  
    - Issue new currency: "Owls" (1 Owl per 2 Drachmas handed in).  
  - **Rules:** Continue trading with Owls.  
  - **Scoring:** Same as Phase 2 (but Owls replace Drachmas).  
  - **Key Moment:** Players groan but adapt—showing money’s value is consensus-dependent.

  #### **Phase 4: Interest Economy (15 minutes)**  
  *(Illustrates (c): Unnatural money-breeding)*  
  - **Rules:**  
    - Add lending: Players can lend Owls to others.  
    - Lenders set repayment terms (e.g., "Return 5 Owls for 4 borrowed next round").  
    - Borrowers repay from future points (no collateral).  
  - **Scoring:**  
    - Same as Phase 3.  
    - +2 pts per Owl earned from interest (lenders only).  
  - **Predictable Issue:** 
    - Some lend at high interest; others avoid debt.  
    - Players with met needs keep chasing points via lending/trading.

  ---

  ### Debrief (30 minutes)
  **Map Game → Aristotle:**  
  1. **Phase 1 → (a):**  
     - *"Why was barter hard?"* → Mismatched skills/hidden needs.  
     - *Aristotle:* "Direct exchange fails → we need a universal measure (money)."  
  2. **Phase 2–3 → (b):**  
     - *"Why did Owls work after Drachmas failed?"* → Collective trust.  
     - *Aristotle:* Money is a social agreement (νομισμα, *nomisma*), not valuable by nature. Stores value for future needs.  
  3. **Phase 4 → (c):**  
     - *"Did anyone lend Owls for more Owls? How did it feel?"* → Detached from real needs.  
     - *Aristotle:* Money breeding money (τόκος, *tokos*) is unnatural—divorced from use-value.  

  **What Went Wrong & Fixes:**  
  - **Issue:** Phase 1 stalemate.  
    *Fix:* Shorten time; emphasize scarcity.  
  - **Issue:** Hoarding in Phase 2.  
    *Fix:* Hint that money loses value later (but don’t spoil surprise).  
  - **Issue:** Uneven lending in Phase 4.  
    *Fix:* Suggest interest rates to kickstart deals.  

  **Limitation:** Aristotle’s deeper critique—that money’s "unnatural" use corrupts community ethics—won’t emerge from gameplay. **Say aloud:** "Aristotle warns that money-seeking becomes an endless, hollow goal. The game’s point-scoring mirrors this: it kept going after your needs were met!"

  **Post-Game:** Reveal Aristotle’s terms (*nomisma*, *tokos*) and connect to *Politics* I.9-10. Assign a reflection: "Did the game make money feel ‘real’? When did it feel artificial?"

  ---

  **Logistics:**  
  - **Materials:** Tokens (80 goods, 160 paper Drachmas/Owls), role cards, score sheets.  
  - **Time:** Phases 50 min + Debrief 30 min = 80 min total.  
  - **Goal:** Students *feel* Aristotle’s claims before they’re named. The currency reset and interest mechanic make (b) and (c) visceral.
