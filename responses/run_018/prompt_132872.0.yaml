prompt: |-
  I'm preparing a ninety-minute session for an interdisciplinary reading group—mostly philosophers of science with no background in metaethics—on evolutionary debunking arguments. Rather than a generic survey, I want to teach the specific variant that targets non-naturalist normative realism by explaining the evolutionary origins of deontic modal intuitions: the sense that certain actions are strictly forbidden regardless of consequences. Plan the explanatory arc: first, what conceptual dependency must be established before the debunking argument can be heard—whether it is the causal-inertness problem for non-natural properties, the distinction between origin and justification, or something else, and in what order; second, the single concrete moral intuition that should carry the entire demonstration, specifying why it should be a direct-action prohibition rather than a cost-benefit judgment and what features it must have; third, the predictable misconceptions—likely that an evolutionary explanation genetically falsifies the belief, that such explanations are unfalsifiable just-so stories, and that the debunking extends indiscriminately to logical or mathematical beliefs—and the precise point in the sequence where each should be defused; fourth, one diagnostic question I can ask at the end that distinguishes someone who has grasped the argument structure from someone who merely agrees with the skeptical conclusion; and finally, what I should explicitly leave out at this level—perhaps the full evolutionary game-theoretic literature on cooperation, or the distinctions between reliabilist and process-based epistemologies—and how to state that omission without undermining the session.
reasoning: |-
  Okay, let me approach this systematically. The user is designing a focused session on evolutionary debunking arguments (EDAs) targeting non-naturalist realism, specifically through deontic modal intuitions. They need a clear pedagogical arc that avoids broad surveys while addressing philosophers of science unfamiliar with metaethics. 

  First, I consider the foundational concepts required. Non-naturalists face the causal inertness problem - if moral properties don't causally interact, how do we access them? This must precede the EDA to show why evolutionary origins matter uniquely for non-naturalism. The origin/justification distinction comes next to preempt the genetic fallacy objection. Order matters: inertness first to establish vulnerability, then origin/justification to clarify the argument isn't simply conflating history with validity.

  For the concrete intuition example, direct-action prohibitions work best because their evolutionary payoff is clearest. "Killing infants for convenience" is ideal - it's cross-culturally resonant, evolutionarily explicable as protecting genetic investment, and clearly deontic ("forbidden regardless of consequences"). Cost-benefit judgments wouldn't serve as well since their adaptiveness could coincidentally align with truth.

  Now anticipating misconceptions: The genetic fallacy concern will arise immediately when presenting the evo-psych explanation, so I'll defuse it right then by distinguishing origins from justification. The "just-so story" worry comes up when discussing evolutionary mechanisms, addressed by stressing testable predictions (e.g. universality patterns). The math/logic overextension emerges when concluding, countered by noting their causal efficacy in scientific applications unlike non-natural properties.

  The diagnostic question needs to test structural understanding versus mere skepticism. "Could non-naturalists accept this EDA while keeping their metaphysics?" would reveal if they grasp the argument hinges on causal inertness - only those who see the special problem for non-naturalism would answer "no" correctly.

  Finally, omissions must be explicit but non-undermining. I'll skip detailed game theory and epistemology variations, framing them as "valuable but unnecessary for today's core argument" to maintain focus. The session stays self-contained by treating evo-psych explanations as plausible premises rather than defending them exhaustively.

  Throughout, I'm prioritizing conceptual clarity over comprehensive coverage, trusting philosophers of science can handle abstraction but need metaethical scaffolding. The arc moves deliberately from vulnerabilities to mechanism to implications, with targeted misconception-busting at each stage.
answer: |-
  Here's a structured plan for your 90-minute session, focusing on conceptual clarity and pedagogical flow for philosophers of science:

  ---

  ### **I. Foundational Concepts (25-30 mins)**  
  **Order & Rationale:**  
  1. **Non-Naturalist Realism (NNR) Defined** (10 mins):  
     - Core tenets: Objective moral facts, non-reducible to natural properties (*sui generis*), causally inert.  
     - *Key emphasis:* **Causal inertness** as NNR’s unique vulnerability (moral facts don’t push physical particles → no causal role in belief formation).  
     - *Analogy:* Contrast with natural facts (e.g., "water is H₂O" causally affects instruments/brains).  

  2. **Origin vs. Justification Distinction** (15 mins):  
     - Introduce the **Genetic Fallacy** trap: "Explaining origin ≠ disproving truth."  
     - *Critical pivot:* Acknowledge this distinction is valid *generally*, but argue that **causal inertness creates a special problem for NNR**.  
     - *Bridge to EDA:* For NNR, if our moral faculty isn’t "sensitive" to causally inert properties, *why trust it?*  

  ---

  ### **II. Core Case Study: The Deontic Intuition (20 mins)**  
  **Selected Intuition:** **"Killing an infant for trivial convenience is morally forbidden *regardless of consequences*."**  
  **Why this works:**  
  - **Deontic & Non-Consequentialist:** Embodies "strict prohibition" (≠ cost-benefit analysis).  
  - **Evolutionarily Compelling:** High fitness cost of killing offspring; deep-rooted in kin selection/parental investment.  
  - **Philosophically Sharp:** Resists utilitarian "explaining away" (consequences are irrelevant to the intuition).  
  - **Universally Resonant:** Avoids culturally charged examples (e.g., incest).  

  **Demo Flow:**  
  1. Elicit the intuition: "Would this *ever* be permissible if it benefited society?" (Audience agreement expected).  
  2. Present evolutionary hypothesis: Hardwired aversion to infant-killing via selective pressure for caregiving.  
  3. **Key Question:** "If evolution shaped this intuition *independently* of NNR’s moral facts, how could NNR explain its reliability?"  

  ---

  ### **III. Predictable Misconceptions & Defusion (20 mins)**  
  Address these **at precise moments**:  
  1. **"This is just the Genetic Fallacy!"**  
     - *Defuse:* Immediately after presenting the evo explanation.  
     - *Response:* "Yes, *generally* origin ≠ justification. But recall: NNR posits causally inert facts. If evolution shaped our intuitions *without* tracking such facts, the burden is on NNR to explain *how* reliability emerged."  

  2. **"Evolutionary psychology is unfalsifiable storytelling."**  
     - *Defuse:* When detailing the evo mechanism.  
     - *Response:* "We’re granting this explanation *arguendo* for the sake of argument. But note: EDA works if evo origins are *plausible*, not certain. The challenge is to NNR’s *epistemic story*, not proving evolution."  

  3. **"This debunks math/logic too!"**  
     - *Defuse:* During Q&A or when generalizing the argument.  
     - *Response:* "Math/logic *are* causally integrated: Evolution favors agents who track logical contradictions (e.g., avoiding inconsistencies in predator avoidance). NNR’s properties lack this causal footprint."  

  ---

  ### **IV. Diagnostic Question (5 mins)**  
  **Ask:** *"Could a non-naturalist realist coherently accept the evolutionary explanation of deontic intuitions while maintaining that those intuitions reliably track moral truths?"*  

  - **Grasped the argument:** Will say **no** and cite causal inertness: Evolution operates without "detecting" non-natural properties, so no bridge to reliability.  
  - **Merely skeptical:** Will say "yes" (missing the specific challenge to NNR) or appeal to intuition’s self-evidence (begging the question).  

  ---

  ### **V. Strategic Omissions & Framing (5 mins)**  
  **Explicitly Exclude:**  
  1. **Game theory/details of evo cooperation models.**  
     - *Frame:* "We’re assuming a plausible evolutionary origin for deontic intuitions, but we won’t dive into mechanisms. This argument works if such origins are *possible*, not proven."  
  2. **Reliabilist vs. internalist epistemology.**  
     - *Frame:* "We’re using a minimal 'sensitivity' requirement for justification: A faculty is reliable only if it’s *appropriately connected* to the facts. The debate over how to *define* reliability is beyond today’s scope."  

  **Why this works:** Philosophers of science will recognize bracketing as standard practice. Emphasize the *conditional* structure: **"If NNR is true *and* evolution shaped deontic intuitions, then..."**  

  ---

  ### **Timing & Flow Summary**  
  - **0:00–0:30:** Foundations (NNR + causal inertness → origin/justification distinction).  
  - **0:30–0:50:** Core argument (Intuition demo → evo explanation → EDA applied).  
  - **0:50–1:10:** Misconceptions + Q&A (Diagnostic question embedded).  
  - **1:10–1:15:** Recap, omissions clarified, concluding challenge.  

  ### **Key Pedagogical Goals**  
  - **NNR’s unique problem** is causal inertness + evolutionary origins → **no sensitivity**.  
  - EDA is **not global skepticism**; it’s a **targeted challenge to NNR’s epistemology**.  
  - Success = Attendees see why *this* debunking argument doesn’t apply to science/math.  

  This structure respects your audience’s analytical rigor while avoiding metaethical jargon. The infant-killing case crystallizes the logic, and omissions keep focus on the core philosophical vulnerability.
