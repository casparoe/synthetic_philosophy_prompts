  The user also brought up the myth of natural kind versus moral justification. That distinction helps separate whether we're talking about what mental illness *is* (ontology) versus how we *use* it (norms). For example, saying mental illness isn't a natural kind questions its scientific validity, while the moral justification angle focuses on how society uses it to control people. 

  I should check which interpretations actually undermine involuntary commitment. The weaker ones don't necessarily do that. For instance, acknowledging that not all distress is medical doesn't negate the need for commitment in severe cases. But claims that psychiatry is purely social control directly challenge it. 

  The user wants to know which claims collapse into each other. Like, if you push the ontology claim (no natural kind), it might lead to questioning the moral justification. Also, the radical social control claim might depend on the categorical one. 

  The user seems frustrated with students oversimplifying. They need a clear menu to show the nuances. Highlighting where norms sneak in is key—like when "disease" labels are used to justify coercion. The verdicts should clarify which stances are tenable and which are outdated. 

  Also, the distinction between myth as natural kind vs. moral justification isn't just jargon. It helps separate scientific critique from ethical/political critique. But I should explain it plainly. 

  I'll structure each claim with defensibility, normative elements, and impact on commitment. Need to note where neuroscience challenges Szasz, and where his critiques still hold, especially regarding institutional power. 

  Make sure to address which versions collapse. For example, insisting mental illness isn't a natural kind might slide into denying any medical basis, which isn't supported now. Or that social control arguments often assume the categorical claim. 

