  We are disambiguating the phrase: "the moral relevance of any feature is always context-dependent"

  The key is to break down what this could mean in terms of moral particularism vs. generalism, and then see how it relates to the algorithmic-consistency challenge.

  The challenge: An AI system uses demographic parity (i.e., equal selection rates across groups) in hiring but rejects it in lending. This seems inconsistent. The instructor dismisses by saying the moral relevance of demographic features is context-dependent.

  We are to create a table with:
  - Reading Label
  - Precise Claim
