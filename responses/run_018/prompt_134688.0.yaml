  For the sacredness objection, I should craft a reply that honors labor history while reframing illegality as civil disobedience - but I'm worried this might sound like apologetics to the historians. For the coercion point, the reply needs to thread the needle between Nozick's procedural fairness and the reality of strike dynamics. 

