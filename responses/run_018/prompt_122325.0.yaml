  I want at least one on whether this "self-dissolution" applies to moral choices too, one that hits the classic coin-flip reply head-on, and one that asks if every trivial symmetric choice — like picking one of two identical pens — turns into an existential crisis on her view. For each, include a follow-up keyed to the dodge she's most likely to use. Don't ask generic career stuff; make them press on the actual content, anticipate her standard answers, and feel like they're digging into the weeds of her position. Oh, and I keep writing Buridane by mistake, so just roll with it.
