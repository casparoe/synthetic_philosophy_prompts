prompt: |-
  me and my roommate got into it last night about whether an AI's embedding space is literally full of universals or just tracking statistical patterns, and now i'm stuck. i want the full spec for what a theory of universals actually has to deliver, but framed through digital representation—specificaly, does it need to explain why two different image files can be the same shade of blue, or why a neural net groups them together?

  write the desiderata: exactly five numbered items, each one or two sentences with the case or distinction behind it, no intro or conclusion. flag if any two can't be jointly satisifed, especially if physicalism about representations clashes with realism about properties. don't cite anyone; just lay out the requirements.
