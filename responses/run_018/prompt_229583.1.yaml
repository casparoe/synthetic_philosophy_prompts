prompt: |-
  I serve on the hiring committee of a small organization, and I have noticed something about our decisions that I cannot find a word for. When we choose among three or more options -- candidates, budget plans, policy proposals -- we never vote on all of them at once. Instead the chair sets a sequence: first A against B, then the winner against C. Everyone, as far as I can tell, votes honestly at each step. And yet I have become convinced that whoever sets the sequence effectively chooses the outcome. With the same members holding the same honest opinions, candidate X wins under one ordering and candidate Y wins under another, and a chair who knows how people feel can arrange for her favorite to prevail. Nobody has lied about anything, and no rule has been broken.

  I have a hazy memory of a famous theorem saying that every reasonable voting method can be gamed, but when I looked into it, the gaming there seemed to mean voters misrepresenting what they want -- which is not what is happening here, since everyone votes sincerely throughout. So: does the phenomenon I am describing have an established name and a literature? How exactly does it differ from the kind of manipulation that theorem concerns, and are there known results about it of comparable generality? I also want the edges marked out: sometimes the order makes no difference at all, and I would like to know precisely when and why. Please do not just hand me a label -- explain what the phenomenon is, what it is not, and where it ends. Kindly write your answer in American English.
reasoning: |-
  Okay, the user is part of a hiring committee and has noticed that the order in which proposals or candidates are voted on affects the outcome, even though everyone votes honestly. They remember a theorem about voting methods being "gamed," but that usually involves voters lying about their preferences, which isn't happening here. So they're asking for the name of this phenomenon, how it's different from strategic voting, and when the order doesn't matter.

  First, I need to identify the phenomenon. The user describes sequential pairwise voting where the chair sets the order of comparisons. The key point is that the chair can manipulate the outcome by choosing the sequence without anyone misrepresenting their preferences. That sounds a lot like the Condorcet paradox or the failure of independence of irrelevant alternatives. But those are related to voting paradoxes. 

  Ah, right! The specific term here is "agenda manipulation" or "procedural control" in voting theory. That's when the person setting the order of votes can influence the outcome. This is different from the Gibbard-Satterthwaite theorem, which is about strategic voting where individuals misrepresent preferences. Here, the manipulation is by the chair, not the voters.

  The user wants to know how this differs from the theorem they mentioned. Gibbard-Satterthwaite deals with voters strategically voting, whereas here, the voters are sincere. The manipulation comes from the procedure itself. So I should clarify that distinction. 

  They also ask when the order doesn't matter. That would be when there's a Condorcet winner—a candidate who beats all others in head-to-head matchups. In that case, no matter the sequence, that candidate should win. But without a Condorcet winner, the order matters, leading to cycles or different outcomes based on sequence.

  I should mention Arrow's theorem too, as it's foundational. Arrow's theorem shows that no voting system can meet all fairness criteria simultaneously, which includes the independence of irrelevant alternatives. That ties into why the sequence matters here—because removing alternatives (like losing an early vote) affects the outcome.

  The user might need practical advice. They might want to ensure fairer processes, so suggesting methods like ranked-choice voting or pointing out when sequential voting is safe (when a Condorcet winner exists) would be helpful. They might also be concerned about the legitimacy of their committee's decisions, so explaining that this is a known flaw in their method is important.

  Deep needs: The user might be worried about fairness in their organization's decision-making. They suspect the chair has undue influence, which could lead to mistrust or ineffective policies. They need not just the theory but also potential solutions or alternatives to suggest to their committee. Providing examples of other voting systems could address their unspoken desire to improve their process.
answer: |-
  This phenomenon absolutely has a name and is a well-established, fundamental flaw in **sequential pairwise voting** (also called **sequential majority voting** or **pairwise elimination**). Here's the breakdown:

  1.  **The Name:** This is called **Agenda Manipulation** or **Procedural Control via Agenda Setting**.

  2.  **The Phenomenon:**
      *   **Core Issue:** The outcome of a sequential pairwise vote depends critically on the *order* in which the alternatives are pitted against each other.
      *   **Why it Happens:** It arises because sincere preferences over three or more alternatives can create **intransitive majority preferences** (a Condorcet Paradox cycle). For example:
          *   Voter 1: X > Y > Z
          *   Voter 2: Y > Z > X
          *   Voter 3: Z > X > Y
          *   Result: X beats Y (2:1: V1 & V3 > V2), Y beats Z (2:1: V1 & V2 > V3), Z beats X (2:1: V2 & V3 > V1).
      *   **The Chair's Power:** In the presence of such intransitivity (or even without a full cycle, but without a clear Condorcet winner), the chair can strategically choose the sequence to eliminate undesirable alternatives early. The winner of the *first* vote gains a crucial advantage simply by being in the final round. By controlling *which* alternatives face off in the first vote and *which* survivor faces the next challenger, the chair steers the process towards their desired outcome.
      *   **Sincere Voting:** Crucially, as you observe, voters are voting sincerely at each pairwise step based on their true preference between the *two* options presented. The manipulation happens purely through the structure of the agenda set by the chair.

  3.  **How it Differs from the "Famous Theorem" (Likely Gibbard-Satterthwaite):**
      *   **Gibbard-Satterthwaite Theorem:** This theorem states that *no* reasonable voting system (with 3+ alternatives) is **strategy-proof** (aka "non-manipulable"). This means that *voters themselves* can sometimes achieve a better outcome by *lying* about their true preferences (voting strategically/insincerely).
      *   **Key Difference:** Agenda manipulation is **not about voters lying**. It's about **procedural control by the agenda setter (the chair)**, exploiting the inherent structure of sequential pairwise voting and the potential for intransitive preferences. Voters are completely sincere.
      *   **The Manipulator:** In Gibbard-Satterthwaite, the *voters* manipulate by misrepresenting preferences. In Agenda Manipulation, the *chair* manipulates by choosing the sequence of votes.

  4.  **Related Foundational Theorem (Arrow's Impossibility Theorem):**
      *   Arrow's theorem shows that no ranked-preference voting system (where voters submit a full ranking) can simultaneously satisfy a few reasonable fairness criteria (Unanimity, Non-dictatorship, Independence of Irrelevant Alternatives - IIA).
      *   **Agenda Manipulation Connection:** Agenda manipulation directly violates the **Independence of Irrelevant Alternatives (IIA)** criterion. IIA states that the winner shouldn't change if a losing alternative is removed. In sequential pairwise voting, *the order of elimination matters critically*. Removing an alternative early (by having it lose a vote) fundamentally changes the subsequent matchups and can change the winner, even if that eliminated alternative wasn't going to win overall. This violation of IIA is the root cause of agenda manipulation.

  5.  **When Does Order *Not* Matter? (The Boundaries):**
      The sequence *only* guarantees the same outcome regardless of order under one specific condition:
      *   **A Condorcet Winner Exists:** If one alternative can defeat *every other* alternative in a head-to-head matchup (this is the Condorcet winner), then that alternative will win *no matter the sequence*. They will win any pairwise vote they are in and eventually become the last one standing.
      *   **Why it's Safe Then:** The Condorcet winner is robust. Any sequence that pits it against the final challenger will result in it winning. Sequences might eliminate different alternatives first, but they can never eliminate the Condorcet winner before the final round because it beats anyone it faces.
      *   **When Order Matters:** In *all* other cases:
          *   When there is a **Condorcet Paradox cycle** (X beats Y, Y beats Z, Z beats X).
          *   When there is **no Condorcet winner** (e.g., X beats Y, Y beats Z, but X and Z tie; Or a more complex intransitivity).
          *   When a **Condorcet loser** exists (a candidate that loses to everyone head-to-head) – the sequence determines *which* of the stronger candidates survives to beat the loser in the final round.

  6.  **Known Results and Generality:**
      *   **NP-Hardness:** Determining if a chair *can* manipulate the outcome via the agenda (i.e., find a sequence making their favorite win) is often computationally hard (NP-hard) for large numbers of alternatives and voters. However, for smaller committees (like yours) or with known preferences, it's frequently easy to compute a winning sequence.
      *   **Susceptibility:** Sequential pairwise voting is *highly susceptible* to agenda manipulation. It's one of the most procedurally manipulable common voting methods.
      *   **Comparable Generality:** While Gibbard-Satterthwaite shows *all* reasonable systems are susceptible to *voter* manipulation, Arrow's theorem shows *all* ranked systems violate *some* fairness criterion (often IIA). Agenda manipulation is a very concrete *instance* of the failure implied by Arrow (violation of IIA) within one specific, commonly used voting procedure (sequential pairwise). There are results showing that agenda manipulation is possible in many other voting systems too, but it's particularly stark and direct in sequential pairwise voting.

  **Summary:**

  You've observed **Agenda Manipulation** in **sequential pairwise voting**. The chair, by controlling the order of pairwise votes, can steer the outcome towards their preferred choice *without* any voter lying, purely by exploiting how the sequence determines which alternatives are eliminated early. This happens because preferences can be intransitive (X>Y>Z>X) or lack a Condorcet winner. The only time the order doesn't matter is when a Condorcet winner exists, as they will win any sequence. This differs fundamentally from the Gibbard-Satterthwaite theorem, which is about *voters* lying strategically. Instead, it's a direct consequence of violating the Independence of Irrelevant Alternatives (IIA) criterion highlighted in Arrow's Impossibility Theorem. This vulnerability is a well-known and significant weakness of this particular voting method.
