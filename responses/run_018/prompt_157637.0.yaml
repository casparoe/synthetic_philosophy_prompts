  Below is an interactive decision tree that sorts readers into eight philosophical positions on whether the original person survives gradual neural replacement. The taxonomy avoids jargon and familiar labels, using concrete case-based judgments instead. Each branch hinges on a specific, accessible claim about the hypothetical scenario.

  ---

  ### **Decision Tree: Who Survives Neural Replacement?**

  **Start at Question 1:**

  #### **Question 1: If a person’s memories, personality, and mental life continue uninterrupted during/after the procedure, is this sufficient for them to survive?**
  - **Yes** → Proceed to Question 2A.  
  - **No** → Proceed to Question 2B.  

  ---

  #### **Question 2A: Can psychological continuity "jump" to synthetic neurons if they function identically? Or must it be anchored in a continuously biological brain?**
  - **Requires continuous biology** → **Position: Biological Substrate Essentialism**  
    *Awkward commitment: You must deny survival even if the patient acts identically, because the biological brain is gone.*  
  - **Can "jump" to synthetic parts** → Proceed to Question 3.  

  #### **Question 2B: Is biological continuity (e.g., the same living body/brain) necessary for survival?**
  - **Yes** → **Position: Biological-Continuity Animalism**  
    *Awkward commitment: You must insist the original person is destroyed, even if a psychologically identical synthetic-being exists afterward.*  
  - **No** → **Position: Non-Physical Continuity View (Unnamed)**  
    *Awkward commitment: You must claim survival depends on an undefined non-physical factor (e.g., soul or essence), despite all measurable psychology and biology changing.*  

  ---

  #### **Question 3: During the hybrid phase (mix of biological/synthetic neurons with clashing error-correction), which is true?**
  - **One subject persists** → Proceed to Question 4.  
  - **Two overlapping subjects exist** → Proceed to Question 5.  
  - **No single answer—it’s a blurred fusion** → **Position: Mereological Fusion View (Unnamed)**  
    *Awkward commitment: You must deny we can truthfully say "I am in pain" during hybrid months, as no unified subject exists.*  

  ---

  #### **Question 4: How does the single subject persist through the hybrid phase?**
  - **The subject is fully present at every moment** → **Position: Psychological-Continuity Endurantism**  
    *Awkward commitment: You must assert a unified self exists during the hybrid phase, despite the brain’s internal conflict causing incoherent thoughts.*  
  - **The subject connects moments like chain links** → **Position: Perdurantist Psychological Continuity**  
    *Awkward commitment: You must accept that the "you" feeling pain today is a different temporal part than the "you" yesterday, yet both are stages of one person.*  
  - **Only momentary stages exist, linked by similarity** → **Position: Exdurantist Stage-Series View**  
    *Awkward commitment: You must deny any persistent self—today’s "you" is a new entity inheriting memories from a past stage that no longer exists.*  

  ---

  #### **Question 5: How do two subjects coexist during the hybrid phase?**
  - **Both subjects are fully present at each moment** → **Position: Overlapping Endurantism (Unnamed)**  
    *Awkward commitment: You must accept two distinct persons wholly share one body, simultaneously thinking and feeling as separate entities in the same bed.*  
  - **The subjects are connected chains of temporal parts** → **Position: Perdurantist Hybrid-Part Theory**  
    *Awkward commitment: You must concede the original person is being replaced by a new four-dimensional being, with both overlapping in spacetime during transition.*  
  - **Only momentary stages exist, but two per moment** → **Position: Exdurantist Co-Presence (Unnamed)**  
    *Awkward commitment: You must say no subject lasts longer than an instant, and each moment hosts two new, unrelated "person-stages" sharing one body.*  

  ---

  ### **Collapsed Positions**
  - **Perdurantist Psychological Continuity (Question 4)** and **Perdurantist Hybrid-Part Theory (Question 5)** collapse if the reader assumes psychological continuity implies a single subject. The tree separates them via **Question 3**, but if one ignores the hybrid phase’s ontology, the positions merge under "perdurantism."  
  - **Exdurantist Stage-Series View (Question 4)** and **Exdurantist Co-Presence (Question 5)** collapse if the reader denies temporal parts can overlap. Both reduce to "only instantaneous stages exist," differing solely in whether one or two stages occupy a moment.  

  ### **Key Insights**
  - **Materialists** often land in **Biological Substrate Essentialism** or **Perdurantist** branches.  
  - **Functionalists** favor **Psychological-Continuity Endurantism** or **Perdurantist Psychological Continuity**.  
  - **Skeptics about persistence** gravitate to **Exdurantist** or **Fusion** views.  
  - The **hybrid phase** is the litmus test: Your tolerance for indeterminacy or overlap reveals your metaphysics of self.  

