answer: |-
  ## The Constraint-Shadowed Pressure

  **Setting:** A small conference room overlooking an instrumentation lab. Diagrams of the gas cylinder apparatus cover a whiteboard. Dr. Clara Rossi (C), proponent of the Lewis-Stalnaker counterfactual account, and Dr. Ian Vargas (I), proponent of the Woodward-Pearl interventionist account, face each other across a table strewn with calculations. Dr. Anya Petrova, the lab’s Principal Investigator, sits at the head, observing.

  **(The dialogue begins mid-discussion, after initial presentations of the case and the philosophers' core frameworks.)**

  **C:** ...so the crux, Ian, is that the valve opened *because* the pressure in A was 3.12 bar at noon. It’s undeniable counterfactual dependence. Had p_A been 2.5 bar – achieved, say, by *some* means, perhaps a tiny, localized miracle reducing molecular kinetic energy just in A at that instant – the piston would have shifted leftwards. This would have increased volume B, dropping p_B below the 3.0 bar threshold. The valve would have stayed shut. The outcome robustly depends on the actual value of p_A. Therefore, p_A caused the valve opening.

  **I:** Ah, Clara, your ‘*some* means’ is doing all the work while hiding the gears. You invoke a ‘miracle’ – a small, local violation of law – precisely *to* set p_A independently. But that’s indistinguishable from an *intervention* on p_A! You’re smuggling in the core concept my framework makes explicit. Crucially, the lab *has no handle* for p_A. Their only manipulable variables are T and n_B. Setting T changes p_B directly by heating B’s gas. Setting n_B changes p_B directly by adding molecules to B. Neither setting affects p_B *via* p_A. There’s simply no *surgical* way, within this system as the lab interacts with it, to wiggle p_A without simultaneously and directly wiggling p_B through routes that bypass p_A entirely. Since no intervention on p_A alone is possible, p_A cannot be a cause *relative to the lab’s variables*.

  **C:** But the dependence *is* there! Look at the equilibrium condition: p_A = p_B = (n_A + n_B)RT / V. When the piston is free, p_A and p_B are locked together. Your interventionist semantics generates an *artificial* asymmetry! You have a handle for n_B, which directly sets p_B, so you call p_B a cause. But you have no handle for n_A or p_A, so you rule it out. Yet numerically, at the critical moment, p_A and p_B are identical. Why should the mere *availability of a knob* determine whether an identical physical quantity causes the effect? The counterfactual dependence is symmetric: had p_B been lower, p_A would have been lower too, and the valve would have stayed shut. My account captures that symmetry – p_B is *also* a cause! The valve opened because the pressure was 3.12 bar, a state realized jointly and necessarily by both compartments.

  **I:** The symmetry *is* crucial, Clara, but it points to the flaw in your approach. Your counterfactual “had p_A been 2.5 bar” requires imagining a divergence *only* in A, holding everything else fixed *at that instant*. But in the actual laws and constraints, you *cannot* isolate that divergence. Any realistic way to *achieve* a lower p_A – lower T (affecting B directly), lower n_A (impossible), or shifting the piston position instantly (which *requires* p_B to be lower simultaneously) – drags p_B down along with it through the physical coupling. Your counterfactual antecedent isn’t *pure*; it’s invariably realized by changes that also directly affect the putative effect, p_B. Your account is route-insensitive: it sees the dependence but cannot isolate *p_A as such* from the bundled change in the equilibrium state. The interventionist asymmetry isn’t artificial; it reflects the *causal pathways* available for manipulation. p_B is directly manipulable via T or n_B; p_A is not. The valve mechanism responds *only* to p_B. The only pathway from T or n_B to the valve runs *through* p_B. There *is* no pathway from p_A to the valve that doesn’t *also* involve p_B being set to the same value at the same time.

  **C:** You accuse me of route-insensitivity? Fine, I concede that point costs me: my event-level counterfactuals don’t specify *how* the antecedent is realized. But your framework *depends entirely* on the representational choices you make. Why model the equilibrium condition as simultaneous? Why not model the dynamics – the piston accelerating due to a pressure difference, moving until forces balance? In that model, p_A *does* directly exert force on the piston, which in turn determines the volume B, thus p_B! If we model it dynamically, an intervention setting p_A *could* be conceived, affecting p_B via piston motion. Your verdict hinges on whether you choose a static equilibrium model or a dynamic one. Is causation model-relative? Or is it in the world?

  **I:** That’s a fair thrust. And yes, it costs me: causal claims *are* relative to a model – a chosen set of variables and their functional relationships. A faithful model must capture the invariant relationships. Here, the key invariant is that when the piston is free, the *only* independent parameters determining the equilibrium state are T, n_A, and n_B. p_A and p_B are *determined* outputs. Representing them as inputs in a dynamic model introduces spurious dependencies if the relaxation is instantaneous, as it effectively is for this valve trigger. We model the system at the temporal grain where the equilibrium holds. But crucially, even in a dynamic model, the *only* exogenous handles are still T and n_B. An intervention setting p_A directly in the dynamic model would still be a miracle – an unexplained setting of a state variable. My framework insists we distinguish the manipulable levers from the determined states. The lab *has* T and n_B as handles; they don’t have p_A.

  **C:** And what about systems with *no* handles at all? Suppose this cylinder is welded shut, thermally isolated. n_A, n_B, total V, total U fixed forever. At time t, p_B exceeds 3.0 bar, valve opens. According to your counterfactual logic, “Had p_B been lower at t, the valve would have stayed shut.” But you have *no* account of what makes that counterfactual true! Your interventions are impossible fantasies. My similarity semantics provides the truth conditions: a small miracle locally violating energy conservation in B at t, lowering p_B, then laws run forward. The valve stays shut. The pressure *caused* the opening. You need counterfactuals you can’t ground. Your ‘soft’ interventions in such cases are just my miracles in a lab coat.

  **I:** In such causally isolated systems, causal claims *do* become more tenuous for my framework. We might rely on *hypothetical* interventions within a model, but the grounding is indeed less direct. Your account handles them more straightforwardly. But that’s not this case! The lab *has* handles: T and n_B. The claim is being made *in the context of their experimental manipulation*. We’re adjudicating *their* abstract. It matters that *they* can intervene on n_B and change whether the valve opens. They cannot intervene on p_A to do the same.

  **C:** Let’s test the pin. Dr. Petrova, in the run where the piston was pinned at the actual position – volume A fixed, volume B fixed – same T=300K, n_B=0.30 mol, so p_B still 3.12 bar, valve opens. Now, counterfactually: had p_A been different – say, 4.0 bar – achieved by somehow adding heat *only* to A while the piston is pinned. What happens? p_A is higher, but p_B is *unchanged* because volume B and n_B are fixed. The valve still opens! No counterfactual dependence of the valve on p_A when pinned. Verdict flips: p_A does *not* cause the valve opening in this scenario. For me, this is a change in the *world’s counterfactual structure* – the physical constraint (pinning) breaks the dependence chain.

  **I:** In my framework, the model changes. When pinned, volume A and volume B become independent state variables (or fixed parameters). The pressure in B is now determined *only* by T, n_B, and V_B (fixed). There’s no functional link from p_A to p_B anymore. An intervention changing p_A (by changing T_A or n_A, if possible) leaves p_B and the valve untouched. Causation is relative to the model, and the model differs when the piston is pinned. The change is in the representation capturing the altered constraints.

  **C:** So we agree the verdict flips with the pin, but disagree on *what* flips – the modal facts or the model. Back to the free case. The core is this ‘constraint-shadowing’. p_A is counterfactually load-bearing: its value matters for the outcome. But no intervention can set it independently within a faithful model of the free-piston system. Your framework excludes it as a cause because it’s not manipulable. Mine includes it because the dependence exists in the web of counterfactuals. Your exclusion seems arbitrary given the physical symmetry; my inclusion seems insensitive to the lack of an independent pathway. The lab wants to say “p_A opens the valve”. I say the counterfactual dependence licenses it. You say the lack of a surgical handle forbids it.

  **I:** Precisely. Saying “p_A opens the valve” implies p_A is a potential *target* for control to affect the valve, which it isn’t, given the constraints. Saying “p_B opens the valve” *does* point to a usable control point (T or n_B). The constraint-shadowing reveals a difference masked by the equilibrium equality. My framework makes that actionable difference explicit; yours submerges it under symmetric dependence.

  **C:** But the physical quantity *pressure* in the left compartment *was* necessary, given the actual setup, for the valve opening. Its specific value was crucial. Denying it causal status feels like denying the moon causes the tides because we can’t intervene on the moon’s mass.

  **I:** And saying the moon’s *position* causes the tides is more precise and points to the manipulable *relative* configuration. Here, p_B is the manipulable, direct trigger. p_A is a constrained co-instantiation.

  **(A pause. Dr. Petrova looks expectant.)**

  **C:** Dr. Petrova, to settle whether your sentence is licensed, I would need to know: **"Is there a physically possible world, however remote, sharing the same fundamental laws as ours, where a localized divergence *only* in the state of compartment A’s gas at noon leads to the relief valve remaining shut, while everything else about the setup and its prior history remains consistent?"**

  **I:** Dr. Petrova, to settle whether your sentence is licensed, I would need to know: **"Within a causal model of the apparatus that faithfully represents the lab’s manipulable inputs (T, n_B, pin status) and the valve response, is pressure_A a variable that can be represented as an *exogenous* node, or is its value always completely determined by other variables in the model under the free-piston constraint?"**

  **(Both write their sentences down and slide them across the table to Dr. Petrova.)**
