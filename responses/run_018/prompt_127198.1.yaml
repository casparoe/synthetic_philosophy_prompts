  1. **Fanaticism and Uncertainty:** The initial EV calculation favors the tail risk (10>8). But because the probability is uncertain, players are drawn to investigate. However, each investigation is costly and only provides noisy information. This creates a tension: more investigation reduces uncertainty (sometimes) but at the cost of attention. If they become too uncertain (e.g., mixed signals) they might feel compelled to investigate more, leading to a cycle of checking that risks paralysis.

  2. **Weaponizing Uncertainty:** The more uncertain you are about the tail probability (i.e., the more you recognize your ignorance), the more you might feel the need to investigate. But the investigation itself is costly and might not resolve the uncertainty. In the extreme, this leads to spending all attention on investigation and then being paralyzed. This mirrors the fanaticism debate: expected value reasoning, when combined with epistemic humility, can lead to either reckless commitment (betting on the tail without enough investigation) or paralysis (over-investigation). 

