  **Rules Summary Handout:**

  The Tail Risk Tug-of-War

  Goal: Maximize your points by choosing between a safe action and a risky action.

  Setup:
  - Each player has 10 attention chips.
  - The true state of the risky action (viable or non-viable) is determined at the start and is the same for everyone. Initially, there's a 1 in 1000 chance that the risky action is viable.

  Actions:
  - Safe action: 8 points.
  - Risky action: 
     - If the risky action is non-viable: 0 points.
     - If viable: then you have a 1 in 100 chance of 1,000,000 points, otherwise 0.

  Information Gathering:
  - You can spend 2 chips to investigate the risky action. Each investigation gives you one signal: Positive or Negative.
  - The signal is generated with 2/3 accuracy:
     - If the state is viable: 2/3 chance Positive, 1/3 Negative.
     - If non-viable: 2/3 chance Negative, 1/3 Positive.
  - You can investigate multiple times (as long as you have at least 2 chips) and stop anytime.

  Paralysis:
  - If you end with 0 chips, you are paralyzed and get 0 points.
  - Otherwise, you must choose either safe or risky (you don't spend chips to choose, but you must have at least 1 chip to not be paralyzed).

  Procedure:
  1. On your turn, you can choose to investigate (spend 2 chips, get one signal) or stop investigating. You can keep investigating until you stop or run out of chips (less than 2).
  2. After you stop, if you have at least 1 chip, choose safe or risky. If you have 0 chips, you are paralyzed (0 points).

  After all players have finished, the true state is revealed. For players who chose risky and the state is viable, roll a d100: on 1, they get 1,000,000; else 0.

  **Debrief Questions:**
  - How did you decide how many investigations to do?
  - Did you feel the tension between wanting to reduce uncertainty and running out of attention?
  - How did the noisy signals affect your confidence?
  - Did anyone experience the cycle of checking (e.g., after a negative signal, you investigated again, and then again) and then either ran out of chips or felt unsure?
  - How does this relate to real-world decisions with high stakes and uncertain tail risks (e.g., existential risk mitigation)? 
  - Why might expected-value reasoning, when combined with uncertainty about probabilities, lead to either reckless commitment or paralysis?
  - How does the game abstract away the moral weight of the outcomes? What might be missing?

  **Warning for First Run:**
  - Players might hoard chips and just take the risky action without investigation (reckless commitment). That's a valid strategy and illustrates one pole of the fanaticism debate.
  - Players might collude to share signals. To prevent, emphasize that investigations are private. Or allow sharing but then note that it reduces the cost per signal for the group? But that changes the dynamic. Better to disallow sharing to keep the individual attention budget.
  - Players might be confused about updating. You can provide a simple table or formula? But it might be better to let them use intuition to keep the game moving.
  - The game might be too long if each player takes many turns. Set a time limit per player (e.g., 2 minutes total per player for all decisions) or run simultaneously (each player writes their actions on a sheet).
  - If the state is non-viable (likely), then players who take risky without investigation get 0, and players who investigate and then take safe get 8. Those who investigated a lot and then took safe might have spent chips and still got 8, but they could have got 8 without spending chips. So they might regret investigating. But the point is to show that investigation can prevent a bad bet (if they get negative signals) but at a cost.

