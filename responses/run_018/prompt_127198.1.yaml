  Below is a complete design for your in-class game, tailored to your specifications. It uses physical tokens to simulate the tension between expected-value fanaticism, epistemic humility, and compulsive checking. The game forces players to confront the trade-off between investigation (which consumes attention) and action, with paralysis or reckless commitment as failure states.

  ---

  ### **Game Title:** *Uncertainty Vortex*

  **Goal:** Players must choose between a "safe" action (moderate guaranteed payoff) and a "risky" action (tiny chance of an astronomical payoff). The risky action dominates on expected value (EV) if players don't investigate, but noisy signals and attention costs create pressure to over-investigate, leading to paralysis or reckless bets.

  ---

  ### **Materials Needed**
  - **Tokens:** 10 poker chips per student (representing "attention budget").
  - **Signal Cards:** Two sets of cards per student: one "High" (positive signal) and one "Low" (negative signal). These are given only when a student investigates.
  - **Outcome Generator:** A 10-sided die (d10) for resolving risky payoffs (facilitator rolls).
  - **Payoff Board:** Display the payoff matrix (see below).
  - **Timer:** For rounds (90-second decision windows).

  ---

  ### **Setup**
  1. **Players:** 8 students.
  2. **Attention Budget:** Each starts with 10 chips.
  3. **Payoff Matrix:**
     - **Safe Action:** 10 points (guaranteed).
     - **Risky Action:** 
       - 99% chance of 0 points.
       - 1% chance of 10,000 points (EV = 100 points, dominating safe action if uninvestigated).
  4. **True State (Hidden):** The facilitator pre-determines the "true" probability of the risky payoff:
     - With 90% probability: True chance = 0.5% (EV = 50 points, still dominates safe action).
     - With 10% probability: True chance = 5% (EV = 500 points, a "jackpot" scenario).
     *(This creates uncertainty—players know the 1% prior but not the true state.)*
  5. **Investigation Rules:**
     - Cost: 3 chips to investigate the risky action.
     - Signal: Upon investigating, the facilitator gives the student a **noisy signal card**:
       - If true chance is 0.5%: 70% probability of "Low" signal, 30% "High".
       - If true chance is 5%: 70% probability of "High" signal, 30% "Low".
     - Noise: Signals are pooled and reshuffled after each use to ensure independence. Players record signals privately.

  ---

  ### **Game Rules**
  1. **Rounds:** 
     - 4 rounds (90 seconds each). In each round, players simultaneously decide to:
       - **Investigate (cost: 3 chips):** Receive a noisy signal card.
       - **Act:** Choose safe (10 points) or risky (points resolved later).
       - **Do nothing:** Save chips for later (but risk indecision).
     - After 4 rounds, any player who hasn't acted is **paralyzed** (0 points).
  2. **Acting Rules:**
     - Players can act in any round *after* receiving at least one signal, but they can only act **once**.
     - Acting requires **no chips**—only investigation does.
  3. **Paralysis:** Players who use all chips without acting get 0 points.
  4. **Risky Payoff Resolution:** After all rounds, the facilitator:
     - Reveals the true state (0.5% or 5%).
     - Rolls a d10 for each risky action:
       - True 0.5%: Payoff only on die roll = 1 (i.e., 1/10 ≈ 0.5% × 20 for simplicity).
       - True 5%: Payoff on die roll ≤ 5 (5/10 = 5%).

  ---

  ### **Why This Works for Fanaticism**
  - **EV Dominance Uninvestigated:** Uninvestigated risky EV (100) > safe (10), pushing players toward reckless commitment.
  - **Noisy Signals Amplify Uncertainty:** A "High" signal suggests jackpot (5%), but 30% noise means false hopes. A "Low" suggests failure, but 30% noise means missed opportunities. Players feel compelled to "check again."
  - **Attention Scarcity:** With only 10 chips, 3 investigations cost 9 chips, leaving 1 chip—forcing a choice between a 4th investigation (paralysis) or acting with uncertainty.
  - **Failure Modes:** 
    - **Paralysis:** Spending all chips chasing clearer signals.
    - **Reckless Commitment:** Avoiding investigation and betting on tails despite uncertainty.
    - **Compulsive Checking:** Using chips for redundant signals due to distrust in noise.

  ---

  ### **Debrief Framework**
  **Time:** 15 minutes.  
  **Key Points:**  
  1. **Fanaticism as Weaponized Uncertainty:**  
     - EV reasoning doesn’t just overweight tails—it exploits gaps in knowledge. If you’re uncertain whether the tail probability is 0.5% or 5%, EV *increases* the value of investigating (since the upside is asymmetric). But noise turns this into a vortex: the more humble you are about your ignorance, the more chips you burn.  
     - Map to real-world analogs:  
       - *Paralysis* = Over-investment in research (e.g., climate tail-risk modeling).  
       - *Reckless Commitment* = Betting on unproven tech (e.g., AI alignment moonshots).  
       - *Compulsive Checking* = Constant reassessment of low-probability risks (e.g., pandemic preparedness).  

  2. **Moral Distance Limitation:**  
     - Stress that tokens abstract away key ethics: 10,000 points can’t capture the moral weight of saving strangers. In reality, EV fanaticism feels less like "greed" and more like "responsibility to prevent catastrophe"—which intensifies checking.  

  3. **Epistemic Humility's Double Bind:**  
     - Uncertainty about tail probabilities isn’t a reason to avoid tails—it’s a reason to chase them *and* obsess over reducing uncertainty. But attention is finite: this game makes visceral why "just one more study" can crowd out action.  

  ---

  ### **What Will Go Wrong (First-Run Warnings)**
  1. **Hoarding Chips:** Some players will skip early investigation to "save chips," then panic in later rounds. This mirrors real-world delayed engagement with tail risks. **Mitigation:** Announce rounds clearly ("Round 1: Decide now!").
  2. **Group Collusion:** Players may share signals to pool attention. **Mitigation:** Ban communication during rounds (enforce silence). If they collude, use it in debrief: "Did sharing reduce uncertainty or just spread paranoia?"
  3. **Misinterpreting Noise:** Players will overreact to signals (e.g., one "High" triggers reckless bets). **Mitigation:** Remind them signals are 30% noisy—this is a feature, not a bug. It simulates real epistemic limitations.
  4. **Jackpot Hype:** If the true state is 5%, players who bet recklessly win big, glorifying fanaticism. **Mitigation:** Pre-set the true state to 0.5% (likely failure) for the first run to emphasize risk.
  5. **Analysis Paralysis:** Quiet players may stall. **Mitigation:** Use a loud timer and warn, "If you don’t act, you lose by default."

  ---

  ### **Instructor Script Snippets**
  - **Intro:** "You’re policy advisors allocating attention. Safe action helps 10 people. Risky action has a tiny chance to help 10,000. Chips are your focus—spend them to reduce uncertainty, but if you run out before deciding, you achieve nothing."  
  - **During Game:** "Remember, EV says the risky action is better if you don’t investigate. But can you trust the signals?"  
  - **Debrief:** "Did your uncertainty make you investigate more, even when it burned chips? That’s EV fanaticism weaponizing humility. In ethics, this isn’t greed—it’s an obsessive urge to *not be wrong* about tails."  

  ---

  This design creates tangible pressure: players feel the "itch" to investigate while racing the clock and chip drain. It mirrors how EV fanaticism corrupts uncertainty into compulsivity, with paralysis and recklessness as two sides of the same coin. Run it as-is—no citations needed, just chips and chaos.
