  For structure, I'll model it after real hospital memos: subject line, rollout timeline, FAQs. The corporate euphemisms ("care transition" for death) will contrast with morbid content. Biggest challenge is balancing accuracy with parody - the medical facts about brain death must be correct for the satire to land. 

