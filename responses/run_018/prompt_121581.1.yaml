  The core issue seems to be about the metaphysics of well-being. Deprivationists likely hold a counterfactual-comparative view where harm is defined by better possible states, regardless of experiential awareness. Epicureans probably require harm to be experiential or at least contemporaneous. This isn't just verbal - it reflects different intuitions about what constitutes personal harm.

  For the pre-existence case: Choosing to pollute decades before someone's birth, causing them to die at 30 instead of 80. Deprivationists would call this harm via deprivation. Epicureans would say no harm exists because: 1) no subject at time of choice, 2) death itself isn't experienced, 3) harm requires a subject. This reveals their commitment to harm being state-relative rather than timeless.

  Progress might come from: 1) Separating personal harm from impersonal badness 2) Distinguishing harm as setback to interests from harm as experiential damage 3) Analyzing the pre-existence case to show commitments. Or perhaps accepting both perspectives capture different truths - death is impersonally bad but not personally harmful in the experiential sense.

