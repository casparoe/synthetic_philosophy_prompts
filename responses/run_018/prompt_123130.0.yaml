answer: |-
  This pattern is a distinct phenomenon in argumentation, recognized in philosophical discourse but lacking a universally accepted term. Its core is **the selective application of genealogical critique coupled with asymmetric boundary-setting around justificatory domains**. I propose the term **"Immunized Genealogical Asymmetry" (IGA)** to capture its specific structure.

  ### Core Definition of Immunized Genealogical Asymmetry (IGA)
  **IGA occurs when an agent:**
  1.  **Applies Genealogical Critique to Opponent's Value (C):** Traces the origin of C to contingent, non-rational, or disreputable psychological/social/historical factors (e.g., resentment, socialization, power dynamics) and presents this origin as sufficient to undermine C's *normative authority* or *justificatory force*.
  2.  **Blocks Genealogical Critique of Own Value (V):** When a similar genealogical critique is applied to V, rejects its relevance to V's normative authority by invoking a *principled boundary* (e.g., genesis≠justification, transcendental necessity, presuppositional status, pure practical reason).
  3.  **Maintains Structural Asymmetry:** The boundary invoked in (2) is *not applied universally*. It is selectively deployed *only* to protect V (and core commitments) while remaining absent when critiquing C. The agent refuses to acknowledge this selective application as inconsistent.

  ### Necessary and Sufficient Conditions
  For IGA to be present, **all** of the following must hold:
  1.  **Genealogical Move:** The argument employs an account of *contingent origin* (psychological, sociological, historical).
  2.  **Delegitimizing Intent (for C):** The origin account is used to *discredit the normative authority* of the opponent's value C, implying its lack of objective validity or rational force.
  3.  **Justificatory Shield (for V):** A distinct *principled argument* (e.g., appeal to justification/genesis distinction, transcendental status, presupposition) is used to deflect genealogical critique of V, asserting its normative authority is intact regardless of origin.
  4.  **Selective Boundary:** The principled argument (3) is *not applied* to the opponent's value C when the genealogical critique is made. The burden of genealogical transparency is enforced asymmetrically.
  5.  **Systematic Pattern:** This asymmetry is not accidental but reflects a consistent methodological stance protecting foundational commitments.

  ### Distinguishing IGA from Adjacent Concepts
  *   **Genetic Fallacy:** IGA *exploits* the genetic fallacy against the opponent but *invokes its avoidance* for oneself. Plain genetic fallacy is symmetrical; IGA is defined by the *asymmetric deployment* of the fallacy and its correction.
  *   **Motte-and-Bailey:** M&B involves retreating from a vulnerable claim (bailey) to a defensible one (motte) under pressure. IGA involves *different argumentative moves* (genealogical attack vs. justificatory defense) applied *differentially*, not retreating from one claim to another.
  *   **Hypocrisy / Tu Quoque:** Hypocrisy is *moral inconsistency* in practice ("You do X but I do X too"). IGA is *argumentative and methodological inconsistency* ("Genealogy delegitimizes *your* value, but not *mine*, because of principle P... which I don't apply to you"). It focuses on the rules of argumentation, not personal conduct.
  *   **Ordinary Ideological Bias:** Bias involves favoring one's own views. IGA is a specific *argumentative strategy* employing genealogy and boundary-work to *enforce* that bias systematically within discourse. It adds the tools of origin-critique and selective immunization.
  *   **Ad Hoc Rescue:** Saving a cherished belief with a new, unsupported excuse. IGA's shield (genesis≠justification, transcendental status) is often a *pre-existing, principled* argument (even if misapplied), not necessarily invented on the spot.
  *   **Performative Contradiction:** Accusing someone of violating their own presuppositions in *acting/speaking*. IGA involves *methodological inconsistency* in the *rules of critique* applied to *beliefs/values*.

  ### Boundary Cases (What IGA Is NOT)
  1.  **Consistent Universal Genealogist (e.g., Nietzschean Skeptic):** Applies genealogical critique to *all* values, including their own, acknowledging its potential to undermine normative authority universally. *Lacks the Shield/Asymmetry*.
  2.  **Consistent Justificationist (e.g., Rawlsian Liberal):** Rejects the relevance of genealogy to normative justification for *all* values (theirs and opponents'), focusing solely on reflective equilibrium or procedural justification. *Lacks the Genealogical Move against Opponent*.
  3.  **Hypocrite Caught by Genealogy:** "You oppose hierarchy because of resentment! ... Well, *I* support hierarchy because... uh... tradition! (No invocation of genesis≠justification or transcendental shield)." *Lacks the principled Shield (Condition 3)*.
  4.  **Admitting Selective Inconsistency:** "I know I apply genealogy to you but shield my own core value – that's just my bias." *Explicitly violates Condition 5 (Systematic Pattern)* by acknowledging the inconsistency rather than masking it with a principled boundary.
  5.  **Genealogy as Explanation, Not Delegitimization:** "Your egalitarianism arose from specific historical struggles, fascinating! Now, let's debate its merits..." Uses genealogy descriptively without Condition 2 (Delegitimizing Intent).

  ### Conceptual Essence of IGA
  IGA is fundamentally **an instrumentalization of the genetic fallacy and its legitimate critique to create a one-way justificatory vulnerability.** It weaponizes contingency against the opponent while simultaneously declaring one's own core values (often those necessary to sustain the critique itself, like rationality or autonomy) invulnerable to the same weapon. The "Immunization" lies in deploying the protective boundary *only* for the self/ingroup. It is a sophisticated form of **epistemic boundary-work** designed to preserve the normative authority of foundational commitments against historical contingency while exploiting that contingency to undermine alternatives.

  This pattern is frequently observed in foundational debates where competing moral/political frameworks clash, particularly when one side leans towards historicism/sociology of knowledge and the other towards transcendental or rationalist justification, yet both tactics are employed strategically by a single agent. Recognizing IGA helps dissect the *procedural unfairness* underlying such encounters.
