answer: |-
  ### Reusable Decision Procedure for Evaluating 'Lost Cause' Gallery Frame Proposals  
  **Grounding:** Based on Maurice Halbwachs' collective memory theory, with operative distinctions:  
  - **Commemorative fidelity (CF):** Faithful presentation of historical actors' experiences/values.  
  - **Mythic compensation (MC):** Reframing defeat as moral victory to legitimise present grievances.  
  - **Mnemonic restitution (MR):** Framing defeat as causally contributing to current moral/political order.  

  **Procedure Rules:**  
  1. **Time Limit:** 30 minutes per proposal.  
  2. **Stopping Points:** Halt at any "Not Admissible" verdict; escalate "Values Judgment" flags.  
  3. **Sufficient Answers:** Require specific evidence (e.g., primary sources for CF; peer-reviewed historiography for MR).  
  4. **Limitations:**  
     - Cannot resolve disputes between competing national narratives using the same defeat.  
     - May misfire on culturally embedded narratives where MC/MR boundaries are blurred (e.g., Kosovo).  
     - Does not assess aesthetic merit or visitor engagement.  

  ---

  ### Step-by-Step Procedure  
  **Step 1: Commemorative Fidelity Check**  
  - **Question:** *Does the framing prioritise historical actors’ self-understanding using period-appropriate sources, avoiding present-day moral judgments?*  
  - **Sufficient Answer:** Yes, if citing diaries, speeches, or contemporary artefacts; No if projecting modern ideologies onto the past.  
  - **Verdict:**  
    - **Proceed** if CF is primary lens AND avoids present-day authority claims.  
    - **Not Admissible** if CF is absent (e.g., substitutes historical perspective with modern mythos).  
  - **Values Flag:** If CF conflicts with museum’s ethical stance (e.g., framing genocide perpetrators "on their own terms"), escalate to ethics board.  

  **Step 2: Mythic Compensation Screening**  
  - **Question:** *Does the framing imply the defeat constituted a moral victory, secret triumph, or unfulfilled entitlement that licenses contemporary resentment?*  
  - **Sufficient Answer:** Yes if using terms like "martyrdom," "stolen victory," or "unfinished struggle"; No if acknowledging irreversible loss.  
  - **Verdict:**  
    - **Proceed** if MC is absent.  
    - **Not Admissible** if MC is present (e.g., claims defeat "redeemed" a culture or justifies current revanchism).  
  - **Values Flag:** N/A (MC is a factual determination based on narrative content).  

  **Step 3: Mnemonic Restitution Evaluation**  
  - **Question:** *Does the framing assert a direct causal link between the defeat and the current socio-moral order, implying hidden efficacy?*  
  - **Sufficient Answer:** Yes if using phrases like "this defeat forged our nation" or "led directly to today’s values"; No if contextualising legacy without determinism.  
  - **Verdict:**  
    - **Admissible** if MR is absent OR critically contextualised by scholarship.  
    - **Not Admissible** if MR posits uncritical teleology (e.g., defeat "destined" to produce present virtues).  
  - **Values Flag:** If MR is contested by mainstream scholarship but culturally significant (e.g., Kosovo), escalate to senior curator.  

  **Final Output:**  
  - **Admissible:** Passes all three steps.  
  - **Conditional Acceptance:** Fails Step 2 or 3 but salvageable via revisions (e.g., removing grievance rhetoric).  
  - **Reject:** Fails Step 1 or irredeemably fails Steps 2/3.  

  ---

  ### Application to Proposals  
  **Proposal (a): Confederate Surrender at Appomattox**  
  - *Step 1 (CF):* Passes (reflects agrarian virtue as Confederate self-concept).  
  - *Step 2 (MC):* **Fails** – "noble defence" implies moral victory; "distinct cultural identity remains morally authoritative" licenses present grievances.  
  - *Step 3 (MR):* **Fails** – Claims defeat "preserved" cultural identity, implying hidden efficacy.  
  - **Verdict:** **Not Admissible** (irredeemable MC/MR). *You will dislike this: The procedure rejects it as mythic compensation.*  

  **Proposal (b): Masada Siege**  
  - *Step 1 (CF):* Passes (tragic end aligns with Josephus’ account of Zealots’ perspective).  
  - *Step 2 (MC):* Passes (no moral victory or grievance claims).  
  - *Step 3 (MR):* Passes (no assertion of causal link to modern Israel; avoids "sacrifice for the nation" rhetoric).  
  - **Verdict:** **Admissible.**  

  **Proposal (c): 1389 Kosovo Field Defeat**  
  - *Step 1 (CF):* Passes (sacrificial framing matches medieval Serbian chronicles).  
  - *Step 2 (MC):* **Fails** – "spiritual sovereignty" reframes defeat as moral victory; "justifies present territorial claims" licenses grievances.  
  - *Step 3 (MR):* **Fails** – "secured" implies causal efficacy to modern sovereignty.  
  - **Verdict:** **Not Admissible Without Revision.** *You will dislike this: Despite its centrality to Serbian memory, the procedure flags it as mythic compensation. Escalate to ethics board given your preference, but unrevised framing breaches criteria.*  

  ---

  ### Definite Position on Normative Commitments  
  **No reusable procedure can avoid embedding normative commitments about which defeats deserve sympathy.** My argument:  

  1. **Procedural Inevitability:**  
     - The three distinctions themselves are normative. Prioritising "commemorative fidelity" assumes historical self-understanding warrants sympathy, which risks legitimising reprehensible actors (e.g., framing apartheid "on its own terms").  
     - Excluding "mythic compensation" presumes grievances from defeat are illegitimate – a value judgment that may override communities’ lived memory (e.g., Kosovo’s significance to Serbs).  

  2. **Epistemic Bias:**  
     - Determining "sufficient answers" relies on academic consensus, which is Western-dominated. For example, rejecting Kosovo’s territorial link ignores how Balkan oral traditions treat MR as self-evident.  

  3. **Institutional Values:**  
     - A museum’s role is inherently normative: it must choose which memories to sanctify, problematise, or silence. The procedure’s exclusion of uncritical MR reflects a liberal-democratic bias against revanchist nationalism.  

  **Conclusion:** While this procedure minimises arbitrariness through transparent criteria, it embeds commitments to critical historiography and anti-revanchism. To mitigate bias, escalate value-laden decisions – but admit that *not* sympathising with certain defeats (e.g., Confederacy) is itself a political stance.  

  ---  
  **Final Note:** This procedure best handles clear-cut cases (e.g., Confederacy/Masada) but struggles with deeply internalised narratives (e.g., Kosovo). Always supplement with scholarly consultation and ethics review when values conflicts arise.
