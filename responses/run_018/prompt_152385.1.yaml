  I need to structure this carefully. The user wants British English, conciseness, and no citations - just the criteria themselves. They also want me to identify which single desideratum rules out the most prominent theories.

  First, the cases to cover:
  - Ordinary biological brain (obviously conscious)
  - Static lookup-book (just encodes responses without processing)
