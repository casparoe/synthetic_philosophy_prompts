  Interesting point about QALY frameworks! The user notices that health economics just assumes longer life is better, which clashes with Epicurean metaphysics. They're asking if this is a genuine contradiction or if there's some hidden premise that resolves it. Smart observation about "identity across counterfactual worlds" - that might be key here.

  Let me think through the ontological challenge first. If we strictly follow Epicurus, any deprivation account of death's badness fails because there's no subject to be deprived. Same logic applied to a shortened lifespan: the "missing" 40 years aren't absent for anyone specific because that particular subject ceases at 40. So technically, both early death and "natural" death might be equally non-harmful in this view. That's unsettling but logically consistent.

  But wait - maybe the user's intuition points to something deeper about how we value possible futures. Even if no subject exists in the counterfactual where they live longer, we still evaluate lives as wholes. Like how we judge a novel cut short is worse than one properly finished, regardless of whether the unwritten chapters "exist." The badness is in the narrative shape, not felt deprivation.

  Ah! And here's where identity across worlds comes in. When we say "I would have lived longer," we're imagining a counterfactual version of ourselves - which requires personal identity to persist across possible worlds. Epicurus rejects this, but our lived experience assumes it. That might be the hidden premise saving comparative judgments.

  The user seems analytically sophisticated - they've already spotted the category error risk in treating longevity as a personal good. I should acknowledge how sharp that insight is while offering resolutions that don't patronize. Maybe discuss McMahan's distinction between actual and counterfactual subjects? Or Parfit's reductionist view of identity that might actually support the Epicurean position?

  Ultimately the tension might not be fully resolvable. The user might need to sit with that discomfort: that our first-person valuation of life extension is emotionally real but metaphysically shaky. Still, for practical ethics, we can bracket the ontology - like we do with free will debates while building legal systems. QALYs work because we care about realized life stories, not just subject-experienced harms.

