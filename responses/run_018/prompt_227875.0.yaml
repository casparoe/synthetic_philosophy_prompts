  First, I need to lay out the correspondence mapping explicitly. The detective's suspicion, evidence-gathering, and standard of proof need to be mapped onto the conspiracy theorist's practices. Let me break it down. Detectives start with a specific crime, have a methodology for evidence collection, follow a chain of evidence, and adhere to standards of proof. They also operate within institutions that provide oversight and correction. On the other hand, conspiracy theorists often start with a broad suspicion, gather evidence selectively, resist falsification, and lack institutional checks. 

  Where does the mapping break? Key points are how each responds when expected evidence doesn't appear. Detectives might drop the case or consider alternative leads. Conspiracy theorists often see the absence as evidence of a cover-up, which is unfalsifiable. Also, institutions: detectives have courts, peer review, etc., while conspiracy theorists have echo chambers that reinforce beliefs.

  Now, separating disanalogies that bear on the conclusion from superficial ones. Superficial similarities are skepticism toward authority and treating coincidences as clues. But the deep differences are in methodology, falsifiability, and institutional correction. These undermine the analogy's core argument about epistemic respectability.

