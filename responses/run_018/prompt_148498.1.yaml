  Okay, let me start by unpacking this user's query about dual-register heritage designation. They're asking about a practice where sites are listed in two separate registers—one based on colonial archives and the other on local oral traditions—without reconciling conflicting narratives. The user wants to know the philosophical underpinnings of this approach.

  First, I need to identify the core elements of the practice: non-adjudication, non-hierarchy, and parallel presentation. The preservation board avoids merging or prioritizing one narrative over the other. This suggests a rejection of singular historical truth. 

  The user is probing whether this practice relies on epistemic pluralism, domain separation, or pragmatism. Epistemic pluralism would treat both archives and memory as valid but incommensurable truths. Domain separation might split factual history from identity-related meanings. Pragmatism would avoid deep philosophical commitments, focusing on conflict management.

  I should also consider implicit theories. Hayden White's ideas on historical narratives as constructions come to mind. The practice seems to view archives and memory as distinct discourses rather than competing truths. The board's approach likely stems from recognizing the limitations of archives, especially in colonial contexts where documents often exclude subaltern voices. 

  The user asks what changes if the board prioritized one register over the other. If archives always prevailed, plaques would be removed, funding cut, leading to symbolic violence. If memory dominated, archives might be dismissed as tools of oppression. Both scenarios violate the current practice's ethos of sustaining multiple truths.

  The user's deeper interest might be in how institutions handle contested histories, especially post-colonial tensions. They might be exploring reconciliation methods or the role of power in heritage. The dual-register system serves as a case study in balancing authority and marginalized voices without erasing either. 

  I should also note that the practice accommodates various philosophical views but requires rejecting monism and embracing narrative coexistence. Funding and display rules enforce this equality. Shifting priorities would fundamentally alter the practice's nature, revealing its foundational commitments to pluralism and anti-hegemony.
answer: |-
  The dual-register heritage system embodies a sophisticated philosophy of history that navigates the tension between institutional power and marginalized memory. Its core commitments can be reconstructed as follows:

  **Implicit Philosophical Commitments:**
  1.  **Anti-Monism about Historical Truth:** The practice fundamentally rejects the idea that a single, authoritative, and complete historical truth about a site can (or should) be established. It presupposes that history is inherently multi-vocal.
  2.  **Discursive Pluralism:** Archives and oral traditions are understood as fundamentally different *types* of discourse, operating with distinct:
      *   **Epistemic Foundations:** Archival validity stems from documented procedures, material traces, and institutional authority. Mnemonic validity stems from lived experience, intergenerational transmission, community consensus, and performative continuity.
      *   **Functions:** Archives primarily document *institutional actions, ownership, and administrative functions* ("what the colonial state recorded as happening"). Mnemonic registers primarily document *lived experiences, meanings, identities, and resistance* ("what the community experienced and remembers as significant").
      *   **Temporality:** Archives fix the past as a closed, documented event. Living memory re-activates the past constantly in the present for identity formation and cultural continuity.
  3.  **Non-Competitive Coexistence:** The conflict is seen not as a factual contradiction requiring resolution ("Was it *really* a revenue office *or* a resistance space?"), but as evidence of:
      *   **Power Asymmetry in Record-Keeping:** The colonial archive inherently centers the state's perspective, often erasing or misrepresenting subaltern activities.
      *   **Differing Scales of Significance:** What matters to the bureaucracy (tax collection) is irrelevant or oppositional to the community (survival, resistance).
      *   **Ontological Multiplicity:** The site *simultaneously inhabited* different realities – the official administrative reality and the clandestine community reality. Both were "true" within their respective spheres.
  4.  **The Primacy of Sustenance over Supersession:** The goal is not to determine the "real history" but to *sustain* both narratives as vital, ongoing cultural forces. Suppressing either constitutes a form of epistemic or cultural violence.

  **Distinguishing Requirements from Accommodations:**
  *   **Strictly Required:**
      *   Rejection of monism/hierarchy: Neither narrative can be officially designated as primary or superseding.
      *   Formal institutional recognition: Both registers must have equal standing as *official* heritage designations.
      *   Non-adjudication: The board must refrain from attempting to synthesize or judge the "accuracy" of one against the other *as a condition of designation*.
      *   Parallel presentation: Physical markers and catalog entries must exist separately, presenting each narrative distinctly.
  *   **Accommodated (Possible within the framework):**
      *   Epistemic pluralism (both are valid truths).
      *   Domain separation (they answer different questions).
      *   Pragmatic conflict avoidance (keeping the peace).
      *   Postmodern constructivism (both are narratives, neither captures an objective past).
      *   Critical theory (exposing power dynamics in knowledge production). The framework *can* hold any of these views, but its operational core is the procedural commitment to non-hierarchy and sustenance.

  **Reconstructed Implicit Theory:**
  The practice is best explained by a **pluralist theory of historical significance grounded in critical historiography and cultural rights.** It recognizes:
  *   **Archival Record:** Represents the *institutional reality* of the past, crucial for understanding structures of power and administration, but inherently partial, selective, and shaped by the ruling authority.
  *   **Collective Memory:** Represents the *lived experience and meaning-making* of communities, crucial for cultural identity, resilience, and resistance, but subject to transformation, mythologization, and communal bias.
  Conflict arises not because one is "true" and the other "false," but because they represent *different realities experienced simultaneously within the same physical space* under conditions of domination. The parallel registers make this power-layered complexity visible and resist the epistemic hegemony of the colonial archive while respecting the documented institutional past.

  **Consequences of Adopting a Hierarchical View:**

  1.  **If Archives Always Prevail:**
      *   **Reasoning Shift:** Commitment to institutional documentation as the sole arbiter of "factual history." Collective memory becomes "myth," "folklore," or "anecdote" – secondary, subjective, and potentially erroneous.
      *   **Display Rules:** Mnemonic Register plaques removed or labeled as "local legend/interpretation" subordinate to the Archival plaque. Catalog entries merged, with the archival narrative framing the mnemonic one as supplementary or contested.
      *   **Funding:** Resources diverted to archival research, verification, and physical conservation linked to the "official" history. Community memory projects lose institutional support.
      *   **Result:** Reinscribes colonial epistemic violence. Silences resistance narratives. Reduces the site's meaning to its function within the oppressive system. Undermines community identity and cultural heritage.

  2.  **If Collective Memory Always Prevails:**
      *   **Reasoning Shift:** Commitment to lived experience and resistance narratives as the primary, authentic truth. Archives become viewed primarily as tools of oppression, inherently suspect and biased.
      *   **Display Rules:** Archival Register plaques removed or labeled as "colonial propaganda" or "official fiction." Catalog entries prioritize the mnemonic narrative, potentially downplaying or reframing archival evidence as irrelevant or deceptive.
      *   **Funding:** Resources focused on oral history projects, community commemorations, and interpretations centering resistance. Archival preservation might be neglected unless it serves the mnemonic narrative.
      *   **Result:** Risks essentializing community memory and potentially obscuring the concrete mechanisms of colonial administration. May sacrifice complexity for political affirmation. Could hinder a full understanding of the power structures the community resisted.

  **Conclusion:**
  The dual-register system is not primarily about adjudicating epistemic validity or cleanly separating domains of inquiry. It is a **political-ethical intervention** in heritage management. It presupposes that historical significance is contested and multi-layered, especially in post-colonial contexts, and that justice requires institutionalizing this contestation without resolution. Its core commitment is to *sustaining the visibility and legitimacy of both the institutional record of power and the subaltern memory of resistance* as equally vital, though potentially conflicting, dimensions of a complex past. This prevents either narrative from achieving hegemonic control over the site's meaning, fostering an ongoing, critical engagement with history rather than a settled, authoritative account. Shifting to hierarchy, in either direction, fundamentally dismantles this core commitment and the critical potential it holds.
