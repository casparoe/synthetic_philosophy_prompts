prompt: |-
  ok so im defending a hybrid view at a workshop thursday: phenomenal consciousness isnt just access-minus-reportability, but depends on a localized recurrent loop in early sensory cortex running inside a ~180ms window. this loop produces what im calling pre-access phenomenal density — a representational format thats too analog and continuous for the global workspace's symbolic broadcast protocol to integrate. so it stays phenomenal but never becomes reportable. basically Block's distinction is right but the neural story is wrong: broadcasting explains reportability, not consciousness, and workspace theories misidentify this loop as pre-conscious processing.

  audience: two GWT people who know Dehaene-style global neuronal workspace inside out, one higher-order theorist who thinks phenomenal consciousness is just meta-representation, and two phenomenologists who think any neural reduction misses first-person structure. they care about empirical plausibility and hate hand-waving.

  draft my Q&A prep sheet: the objections ill actually get, ordered by damage potential, each phrased the way that specific audience member would put it (GWT folks first, then HOT, then phenomenologists). for each: a reply that lands in about two minutes, plus a quick note on where my reply is weakest or concedes too much. also tell me what i should concede up front before they attack, and include the one objection im praying nobody raises. keep it practical — no bibliography, no fake citations, i wont have web access during the talk.
