  ## The Fractured Self: Why Diachronic Coherence Norms Stumble on Collective Shores

  The specter of the "money pump" haunts individual decision theory. If you exhibit cyclical preferences (preferring A to B, B to C, but C to A), a cunning adversary can exploit you, cycling you through trades until your resources are drained. This vulnerability, alongside the threat of Dutch books for inconsistent probabilistic judgments, underpins the normative demand for diachronic coherence: consistency in preferences and beliefs over time. But does this demand hold water when the "agent" is not a unified consciousness but a shifting collective – a university senate allocating budgets, a climate board setting carbon targets across decades? While the *symptoms* of incoherence might manifest in groups, the standard *rationale* for condemning it as irrational dissolves upon closer inspection of collective agency. Institutional "flip-flopping" is fundamentally different and often strategically rational, not a failure mirroring individual irrationality.

  **The Individualist Case: Vulnerability and Exploitation**

  The arguments for diachronic coherence at the individual level are robust and practical:
  1.  **Direct Exploitation (Money Pumps):** Cyclical preferences create a literal arbitrage opportunity. An exploiter can sell you C for A (since you prefer C), then sell you B for C, then sell you A for B – leaving you back where you started but poorer. Repeating this cycle drains your resources without changing your state. This demonstrates the self-destructive nature of the inconsistency.
  2.  **Dutch Books:** Similarly, inconsistent probability assignments (e.g., assigning probabilities where P(A) + P(not-A) ≠ 1) allow a bookie to construct a set of bets you will accept individually but which guarantee you a loss collectively. Your incoherent beliefs make you a predictable financial victim.
  3.  **The Unified Mind:** Crucially, these exploits work because *you* are a single, continuous entity with persistent ownership of resources and beliefs. The exploiter leverages *your* inconsistency against *yourself* over time. The mind being pumped is the same mind that holds the conflicting preferences.

  **The Collective Reality: Fractured Agency and Shifting Sands**

  Applying this model to collective bodies like a university senate or climate board encounters profound difficulties:

  1.  **No Persistent "Self" to Pump:** A collective has no singular, continuous mind. It's an aggregation of individuals whose composition, influence, information, and even fundamental priorities can shift significantly between decision points. The senate making a budget cut in Year 1 (prioritizing research) may have a different membership, different committee chairs, and face different external pressures than the senate reversing the cut in Year 3 (prioritizing student support). Who is the "self" being exploited? The institution? But its "preferences" are an emergent property of its current structure and inputs, not a stable internal state.
  2.  **Preferences as Outputs, Not Internal States:** Collective preferences are *constructed* through deliberation, voting rules, lobbying, and compromise. They are not pre-existing mental states held by a single entity. A "cyclical preference" in a group context might simply reflect:
      *   **Changing Membership:** New senators with different mandates replace old ones.
      *   **New Information:** A climate board drastically revises its budget allocation after a breakthrough in renewable tech costs or a devastating climate impact report.
      *   **Shifting Context:** A university faces a sudden enrollment drop or a state funding cut, forcing a reversal of previous spending plans.
      *   **Compromise Dynamics:** A vote for option A over B might result from a fragile coalition that collapses before the next vote, leading to B being favored over C, while a different coalition later pushes C over A. This isn't a *single mind* being inconsistent; it's the *process* generating different outcomes based on different inputs and configurations.
  3.  **The Impracticality of Exploitation:** Who is the exploiter, and how would a "collective money pump" work? Imagine a vendor trying to "pump" a university senate through cyclical budget trades. The sheer complexity of institutional decision-making – formal procedures, multiple veto points, public scrutiny, legal constraints, shifting leadership – makes orchestrating such a cycle implausible. The "gains" extracted in one "trade" (e.g., selling a budget plan) would likely be captured by specific factions or external actors, not held by a unified "institutional wallet" vulnerable to draining. The next decision-making body might simply refuse to play along, bound by different rules or priorities.

  **Is Flip-Flopping Irrational? A Different Calculus**

  This doesn't mean collective decisions are always wise or efficient. Flip-flopping can be costly: wasted resources on abandoned initiatives, loss of institutional credibility, strategic confusion, and demoralization. However, condemning it as irrational *in the same sense* as an individual being money-pumped misses the mark:

  1.  **Adaptive Flexibility vs. Rigid Incoherence:** For a collective, changing course based on new information, changing membership reflecting constituent will, or adapting to altered circumstances is often the *height* of rationality. Insisting on diachronic coherence could force an institution to persist with demonstrably flawed or outdated plans simply to avoid the label of "inconsistent." A climate board rigidly adhering to a 10-year budget plan made before a climate catastrophe would be negligent, not rational.
  2.  **Procedural Rationality:** The rationality of a collective body is primarily judged by its *procedures* – fairness, transparency, inclusivity, responsiveness to evidence – not by the diachronic consistency of its outputs. A well-run senate that revisits and revises decisions based on debate and new data is acting rationally, even if its year-to-year choices appear inconsistent on paper.
  3.  **Distributed Costs and Benefits:** The "costs" of reversal in an institution are distributed across stakeholders and time. They involve political capital, administrative burden, and opportunity costs, not the direct, concentrated financial drain inflicted on an individual in a money pump. These costs must be weighed against the *benefits* of correction and adaptation, a calculus fundamentally different from individual vulnerability to exploitation.

  **Conclusion: Beyond the Unified Mind**

  The standard diachronic coherence norms, built on the vulnerability of a unified, persistent self to exploitation via Dutch books and money pumps, do not translate meaningfully to collective bodies. While institutional inconsistency can be destabilizing and costly, labeling it as irrational in the *same sense* as individual incoherence is a category error. Groups lack the singular, continuous mental state required for the standard critique to apply. Their "preferences" are dynamic outputs of complex processes involving shifting agents, information, and contexts. Flip-flopping in a university senate or climate board is not inherently irrational; it can be a necessary, even rational, response to the fluid reality these institutions navigate. The true measure of institutional rationality lies not in diachronic preference stability, but in the quality of its deliberative processes, its responsiveness to evidence and stakeholders, and its ability to adapt its collective course in a changing world. Demanding the coherence of a single mind from a multi-headed, ever-evolving entity is not just unrealistic; it misunderstands the very nature of collective agency and the dynamic rationality it requires.
