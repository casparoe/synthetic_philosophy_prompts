answer: |-
  ### Q&A Prep Sheet: Process-Inheritance Identity Defence  
  **Audience Split:** Analytic Metaphysicians (AM) vs. Buddhist-Studies Scholars (BS)  

  #### **Top Objections (Ordered by Likelihood & Damage)**  
  1. **From AM: "This is just Parfitian reductionism with karma flavouring."**  
     *Likelihood:* Very High | *Damage:* Medium-High (Undermines novelty)  
     **Reply:** "Unlike Parfit, my account isn’t psychological but karmically causal. Vāsanā transmission provides an impersonal *causal criterion* for identity—grounding moral accountability without relying on experiential continuity or quasi-memory."  
     **Weakness:** Risk of conflating "causal" with "karmic" in a way that feels metaphysically underdeveloped.  
     **Concession:** "I concede that structural parallels exist, but Buddhist metaphysics demands we treat karma as non-psychological causality."  

  2. **From BS: "You’re misappropriating anattā: its purpose is soteriological deconstruction, not identity theory."**  
     *Likelihood:* Very High | *Damage:* High (Questions foundational intent)  
     **Reply:** "Anattā’s soteriological force *requires* a coherent account of karmic continuity to avoid nihilism. My reconstruction answers the Abhidharma’s own unresolved tension between rebirth and no-self."  
     **Weakness:** May appear to instrumentalise doctrine for foreign philosophical aims.  
     **Concession:** "I grant that early suttas prioritise existential insight over metaphysics—but Abhidharma *itself* systematises this tension."  

  3. **From AM: "How can vāsanā transmit identity without a substrate? This smuggles in a ‘causal essence’."**  
     *Likelihood:* High | *Damage:* Critical (Collapse into essentialism)  
     **Reply:** "Vāsanā are not entities but *dynamic patterns of conditionality*—like a flame transferring heat, not a ‘thing’ moving. Identity is an emergent property of the process, not inhering in vāsanā."  
     **Weakness:** Analogies may not satisfy hardcore mereological nihilists.  
     **Concession:** "The model’s success hinges on rejecting substance-thinking entirely—even about causality."  

  4. **From BS: "Vāsanā is a Sarvāstivādin/Mahāyāna innovation alien to Theravāda Abhidhamma. You’re reviving dharma-theory!"**  
     *Likelihood:* Medium-High | *Damage:* Critical (Doctrinal heresy)  
     **Reply:** "Whilst the *term* vāsanā is post-canonical, the concept of latent karmic traces (e.g., *anusaya*) is present in Theravāda. I reconstruct it mechanistically—as causal inertia, not a Sarvāstivādin ‘possession’ (prāpti)."  
     **Weakness:** Early Abhidhamma avoids reifying traces as discrete dharmas.  
     **Concession:** "This pushes Theravādin orthodoxy, but the Kathāvatthu *does* debate karmic continuity sans attā."  

  5. **From AM: "Why call this ‘identity’? It’s just descriptive causality with moral labelling."**  
     *Likelihood:* Medium | *Damage:* Medium (Semantic overreach)  
     **Reply:** "It satisfies the core functional demand of identity: grounding non-arbitrary responsibility across time. Karmic ‘inheritance’ is robust enough for accountability without metaphysical surplus."  
     **Weakness:** May not meet AM’s criteria for "strict" identity (e.g., transworld, numerical sameness).  
     **Concession:** "Call it ‘pragmatic identity’ if preferred—but it’s what Buddhism *needs* for rebirth ethics."  

  6. **From BS: "Framing anattā metaphysically obscures its role in ending duḥkha."**  
     *Likelihood:* Medium | *Damage:* Low-Medium (Methodological clash)  
     **Reply:** "Ignoring the metaphysics leaves rebirth unintelligible, undermining the very path. The Buddha engaged metaphysical queries (e.g., to Vacchagotta) when ethically salient."  
     **Weakness:** Risks reducing soteriology to intellectual exercise.  
     **Concession:** "The soteriological application remains primary—this is a supporting framework."  

  ---

  ### **The Feared Objection**  
  **From BS/AM Hybrid: "Your vāsanā is functionally identical to Sarvāstivāda’s ‘possession’ (prāpti)—a dharma-substrate that carries karma. This reifies process into essence, violating anattā."**  
  *Likelihood:* Low-Medium | *Damage:* Fatal (Total collapse)  
  **Reply:** "Prāpti is a *distinct dharma* that ‘holds’ karma, whereas vāsanā is an emergent feature of causal chains—like momentum in physics, not a separable entity. Theravāda’s *cittasaṃtāna* (mind-continuum) permits causal persistence without dharma-realism."  
  **Weakness:** Abhidharma distinctions are razor-thin; denying prāpti whilst affirming vāsanā transmission may appear sophistical.  
  **Concession:** "If causality demands even minimalist ‘carriers’, my account fails. But I insist: conditionality *alone* suffices."  

  ---

  **Weakest point:** My entire defence hinges on vāsanā being a metaphysically lightweight, non-reifying causal process—yet its explanatory work for identity unavoidably *feels* carrier-like to critics, risking perception of crypto-essentialism.
