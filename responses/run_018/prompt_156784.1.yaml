prompt: |-
  Specify the complete set of desiderata that a theory of rational belief revision on conditional propositions must satisfy to be adequate. Use the Judy Benjamin scenario as the central motivating case: an agent receives information linking conditions to outcomes (e.g., membership in a unit with a specific deployment rule) and must revise her credences in both the conditions and the outcomes in ways that standard conditionalization on atomic propositions does not license. For each desideratum, state the phenomenon it must accommodate, the distinction it must preserve, or the formal result it must respect; indicate whether it is negotiable or non-negotiable; and identify the specific counterexample or intuition that enforces it. The list should cover: (i) the separation of updating on a conditional from updating on its antecedent or consequent; (ii) consistency with the law of total probability over partitioned conditions; (iii) correct handling of indicative versus counterfactual conditionals; (iv) stability under nested updates; and (v) compatibility with a reflection principle for future credences. In addition, include two further requirements that go beyond the standard literature: first, "reflective-loop stability," meaning the theory must specify how an agent updates on conditionals that contain the agent's own revision rule in their content (e.g., "If I come to lower my credence in A, then B") without generating self-undermining cycles or explosive revision; second, "framing invariance," meaning the revision rule must produce identical results whether the conditional is expressed in canonical if-then form or in its logically equivalent disjunctive form, unless the framing itself carries independent evidential weight. After laying out the full specification with justifications, identify which single desideratum does the most damage to mainstream Bayesian, Jeffrey-style, and imaging-based approaches. Then briefly score the main existing contenders—Adams-style conditionalization, Lewis-style imaging, Popper-function revision, and primitive-conditional-probability frameworks—against your list, but keep the bulk of the analysis on the criteria rather than on the scoring. Do not ask for bibliographies, citations, or reading lists; the task is the conceptual architecture.
reasoning: |-
  We are to specify a complete set of desiderata for a theory of rational belief revision on conditional propositions, with the Judy Benjamin problem as the central motivating case. The Judy Benjamin scenario: an army scout (Judy Benjamin) is dropped in a region divided into two areas, Red and Blue, each of which has two subareas: HQ and Rear. Thus, the partition is {Red-HQ, Red-Rear, Blue-HQ, Blue-Rear}. Initially, she has equal credence in each quadrant (so 0.25 each). She then receives a message: "If you are in Red territory, then the probability you are at HQ is 3/4." This is a conditional that does not directly give the probability of being in Red or at HQ, but provides a probabilistic link. Standard Bayesian conditionalization does not apply because the evidence is not a proposition but a conditional.

  The desiderata must cover the five given points (i-v) and two additional ones (reflective-loop stability and framing invariance). For each, we state:

  - The phenomenon to accommodate, distinction to preserve, or formal result to respect.
  - Whether it is negotiable or non-negotiable.
  - The counterexample or intuition that enforces it.

  Then we will identify which single desideratum does the most damage to mainstream approaches and briefly score existing contenders.

  **List of Desiderata:**

  1. **Separation of updating on a conditional from updating on its antecedent or consequent:**
     - **Phenomenon:** Updating on a conditional (e.g., "If A then B") should not be equivalent to updating on the material conditional (A⊃B) or to updating on the consequent B given A. In particular, updating on a conditional should not force the agent to become certain of the antecedent or consequent. 
     - **Negotiable:** Non-negotiable. The Judy Benjamin case shows that updating on a conditional does not provide direct evidence about the antecedent (being in Red) or the consequent (being at HQ). In fact, after updating, Judy's credence in being in Red remains 0.5 (though this is debated, the point is that it doesn't necessarily change in the way that updating on the material conditional would).
     - **Counterexample:** If we updated on the material conditional (¬Red ∨ HQ) in the Judy Benjamin case, we would get: P(¬Red ∨ HQ) = 1 - P(Red ∧ ¬HQ) = 1 - 0.25 = 0.75. Then conditionalizing on (¬Red ∨ HQ) would yield a posterior that is proportional to the prior restricted to the three quadrants: Red-HQ, Red-Rear (which is excluded by the material conditional only if we are in Red and not at HQ? Actually, the material conditional is false only in Red-Rear). So we condition on the event that the quadrant is not Red-Rear. This gives: each of the other three quadrants gets 1/3. But this is not the intended update. The intended update (by the conditional) should leave the probability of being in Red at 0.5 and adjust the conditional probability within Red. The material conditional update also changes the probability of being in Red (to 2/3). Hence, separation is required.

  2. **Consistency with the law of total probability over partitioned conditions:**
     - **Phenomenon:** The law of total probability (LTP) must hold for any partition of the state space. In particular, for any partition {C_i}, the probability of an event B should equal the sum over i of P(B|C_i)*P(C_i). After updating on a conditional, the revised probabilities should still satisfy LTP for any partition that does not involve the conditional in a way that would break coherence.
     - **Negotiable:** Non-negotiable. This is a fundamental coherence requirement. Violating LTP would lead to Dutch books.
     - **Counterexample:** In the Judy Benjamin problem, after updating, we must have that the probability of being at HQ is the probability of being at HQ given Red times the probability of Red plus the probability of being at HQ given Blue times the probability of Blue. If the update violates this, then the agent's beliefs would be incoherent.

  3. **Correct handling of indicative versus counterfactual conditionals:**
     - **Phenomenon:** The theory must distinguish between indicative conditionals (which are about updating beliefs in the actual world) and counterfactual conditionals (which involve hypothetical scenarios). The update rule should apply to indicative conditionals, which are the ones that provide evidence about the actual world. Counterfactual conditionals might be handled by a different mechanism (e.g., imaging).
     - **Negotiable:** Non-negotiable. The Judy Benjamin case is about an indicative conditional: it provides information about the actual territory Judy is in. If the conditional were counterfactual (e.g., "If you were in Red territory, then the probability you would be at HQ is 3/4"), that would not directly affect her credences about her actual location.
     - **Counterexample:** Suppose we try to update on a counterfactual conditional as if it were indicative. Then we might inappropriately change our credences about the actual world based on a hypothetical. For instance, if Judy receives the counterfactual version, she should not change her credence about being in Red or about being at HQ. The update rule must not apply to counterfactuals.

  4. **Stability under nested updates:**
     - **Phenomenon:** If an agent updates on a conditional, and then later receives the same conditional again, the credences should not change (or change only in a stable way). Also, if the agent updates on a sequence of conditionals, the order of update should not matter if the conditionals are consistent and non-interfering.
     - **Negotiable:** Negotiable to some extent (because order might matter in some cases) but non-negotiable for the same conditional repeated. The theory should be stable under repeated identical updates.
     - **Counterexample:** Suppose after updating on the conditional "If Red, then P(HQ)=3/4", Judy receives the same message again. Her credences should not change. If they do, then the update rule is unstable and might lead to arbitrary shifts.

  5. **Compatibility with a reflection principle for future credences:**
     - **Phenomenon:** The reflection principle (van Fraassen) says that an agent's current credence in A should equal her expectation of her future credence in A. This must hold when the future credence is the result of a rational update on a conditional.
     - **Negotiable:** Non-negotiable for a theory of rational belief. It ensures that the agent views her future self as an expert.
     - **Counterexample:** If updating on a conditional leads to a violation of reflection, then the agent would anticipate that her future self will have credences that she now deems incorrect, which is irrational.

  6. **Reflective-loop stability:**
     - **Phenomenon:** The theory must handle conditionals that refer to the agent's own revision rule, such as "If I come to lower my credence in A, then B". Updating on such a conditional should not lead to self-undermining cycles (e.g., where updating causes the condition to be triggered in a way that forces an infinite regress) or explosive revision (where the update leads to inconsistency).
     - **Negotiable:** Non-negotiable for a complete theory that aims to handle self-referential conditionals. Without this, the theory is limited to conditionals that do not refer to the agent's own beliefs.
     - **Counterexample:** Consider the conditional: "If upon updating on this very conditional you lower your credence in A, then B is true." If the agent's update rule is such that updating on this conditional leads to a lowering of credence in A, then the antecedent is true and the agent must also update to believe B. But if the agent does not lower her credence in A, then the antecedent is false and the conditional does not require anything about B. However, the act of updating might cause the lowering of credence in A, creating a loop. The theory must avoid such pathologies.

  7. **Framing invariance:**
     - **Phenomenon:** The revision rule must be invariant to the logical form in which the conditional is expressed, unless the framing provides independent evidence (e.g., about the source). Specifically, conditionals expressed as "If A then B" must lead to the same update as the logically equivalent disjunctive form "¬A ∨ B", unless the disjunctive form is interpreted differently (e.g., because it might be more naturally associated with the material conditional). But note that the material conditional is logically equivalent to the disjunction. However, in natural language, conditionals are not always interpreted as material conditionals. The desideratum is that the update rule should not depend on the syntactic form but on the intended meaning, unless the form itself carries evidence (e.g., about the speaker's knowledge).
     - **Negotiable:** Non-negotiable for logical equivalence. If two expressions are logically equivalent, then updating on them should yield the same results. However, if the framing provides additional information (e.g., the speaker chose to use a conditional form rather than a disjunction, which might suggest they know about A), then it might be negotiable. We require that the update depend only on the content, not the frame, when the content is the same.
     - **Counterexample:** In the Judy Benjamin case, if the message were given as "Either you are not in Red territory or you are at HQ", this is logically equivalent to the material conditional. But we have seen that updating on the material conditional yields a different result than updating on the conditional. Therefore, if the update rule treats the two differently, then framing matters. We want the update to be the same for equivalent content. However, note that the Judy Benjamin conditional is a conditional probability, not a material conditional. So the desideratum must be applied carefully: we require that if two conditionals are logically equivalent (meaning they express the same proposition), then updating on them should be the same. But note: the conditional in Judy Benjamin is not a proposition, it is a conditional probability constraint. So for this desideratum, we must consider conditionals that are expressed as propositions. Alternatively, we might restrict framing invariance to cases where the conditional is given as a proposition and the two forms are logically equivalent. However, the Judy Benjamin case is about updating on a conditional probability constraint, not a proposition. Therefore, we may need to clarify: for conditionals that are expressed as propositions (like the material conditional) and their disjunctive equivalents, the update should be the same. But for conditionals that are not propositions (like conditional probabilities), we are updating on constraints. Therefore, the desideratum might be: for conditionals that are expressed as propositions, framing invariance holds. For non-propositional conditionals, we might require that the update is the same for any two formulations that express the same constraint.

  However, note that the Judy Benjamin update is not about a proposition but about a constraint. Therefore, we adjust: the desideratum of framing invariance should apply to conditionals that are expressed in a way that can be logically equivalent to a disjunction (i.e., when the conditional is taken as a proposition). But in the case of non-propositional conditionals (like conditional probabilities), we require that the update depend only on the constraint, not the way it is phrased. For instance, the constraint P(B|A)=p might be expressed as "If A then the chance of B is p" or "The probability of B given A is p". These should be treated the same.

  Given the above, we restate for framing invariance:

     - **Restated Phenomenon:** The update rule must be invariant to the syntactic form of the evidence if the forms express the same constraint or proposition. In particular, when the conditional is presented as a proposition (e.g., the material conditional A⊃B, which is equivalent to ¬A∨B), then updating on that proposition must be the same regardless of whether it is presented as an if-then or a disjunction. Also, when the conditional is presented as a constraint (e.g., P(B|A)=p), then any two formulations that express the same constraint must lead to the same update.
     - **Counterexample:** If we update on "If A then B" (interpreted as a proposition, i.e., the material conditional) and then on "¬A ∨ B" (the same proposition) and get different results, that would be a failure.

  **Which desideratum does the most damage to mainstream approaches?**

  The desideratum of **separation of updating on a conditional from updating on its antecedent or consequent** does the most damage. Mainstream Bayesian updating cannot handle conditionals that are not propositions. Jeffrey conditioning requires a partition and updating factors, but it is not clear how to apply it to conditionals. Imaging (Lewis) is designed for counterfactuals and does not update on indicative conditionals. The separation desideratum forces the theory to go beyond standard conditioning and Jeffrey conditioning, and it also challenges imaging because imaging is typically applied to counterfactuals, not indicatives.

  **Scoring existing contenders:**

  1. **Adams-style conditionalization (or probabilistic semantics for conditionals):**
     - This approach treats conditionals as not having truth values but as constraints on conditional probabilities. It uses the rule that the conditional probability P(B|A) should be set to a given value.
     - **Separation:** Handles it well because it updates conditional probabilities without forcing updates on the antecedent.
     - **LTP:** Satisfied because it revises probabilities in a way that preserves coherence (by minimizing some divergence subject to the constraint).
     - **Indicative vs counterfactual:** Typically for indicatives only, so it distinguishes by design.
     - **Stability under nested updates:** May not be stable if the same constraint is applied repeatedly? But if the constraint is already satisfied, then it should be stable. So probably stable.
     - **Reflection:** Not explicitly discussed, but if the update is done by a rule that the agent knows, then reflection might hold.
     - **Reflective-loop stability:** Not designed for self-referential conditionals, so likely fails.
     - **Framing invariance:** For non-propositional conditionals, it updates on the constraint, so framing of the constraint should not matter. For propositional conditionals (if treated as material conditionals), it might not apply because Adams does not assign probabilities to conditionals as propositions.

  2. **Lewis-style imaging:**
     - Designed for counterfactuals. It shifts the probability from a world w to the closest world where the antecedent is true.
     - **Separation:** Not designed for indicatives, so fails for separation in the indicative case (it would update on the antecedent by shifting probabilities).
     - **LTP:** It preserves LTP? Imaging does not necessarily preserve the original probabilities of the antecedents. So it might break LTP for the original partition? Actually, imaging changes the probability distribution so that the probability of the antecedent (after update) is the same as before? Not necessarily. It doesn't condition on the antecedent but shifts weight to worlds where the antecedent holds? Actually, in imaging, we update on the conditional by shifting: for each world w, we move the probability of w to the closest A-world. So the probability of A after update becomes 1? That is for updating on the conditional as a proposition? Lewis did not propose imaging for updating on conditionals as evidence. So it's not clear. Typically, imaging is for evaluating conditionals, not updating on them.
     - **Indicative vs counterfactual:** Designed for counterfactuals, so it fails for indicatives.
     - **Stability:** Not applicable.
     - **Reflection:** Not discussed.
     - **Reflective-loop stability:** Not designed for self-reference.
     - **Framing invariance:** Since it is for counterfactuals, and counterfactuals are not equivalent to disjunctions, it might not apply.

  3. **Popper-function revision:**
     - Popper functions are conditional probability measures that are defined even for conditioning on events of probability zero. They can be used to update on conditionals by treating the conditional as a constraint on the conditional probability.
     - **Separation:** Handles it because it can set P(B|A) to a specific value without requiring P(A)=1.
     - **LTP:** Popper functions are defined to satisfy standard probability axioms, so LTP holds.
     - **Indicative vs counterfactual:** By design for indicatives? Not necessarily, but they can be used for both. However, the update rule for conditionals must be specified. If we update by setting P(B|A)=p, then it is for indicatives.
     - **Stability:** If the constraint is already satisfied, then updating again with the same constraint should leave the function unchanged? Yes.
     - **Reflection:** Not explicitly discussed, but since it is a coherent system, it might be compatible.
     - **Reflective-loop stability:** Not designed for self-reference, so might fail for loops.
     - **Framing invariance:** For non-propositional conditionals, it updates on the constraint. For propositional conditionals, if we update on the material conditional, that is a different constraint (P(¬A∨B)=1) which is not the same as P(B|A)=1. So they are different. But if the conditional is intended to be a constraint on conditional probability, then the material conditional update would be a mistake. So framing invariance in the sense of equivalent constraints: if the same constraint is expressed in two ways, it should be the same. But if two different constraints are expressed (e.g., P(B|A)=1 vs P(¬A∨B)=1) then they are different and should yield different updates. So it respects framing invariance when the constraint is the same.

  4. **Primitive-conditional-probability frameworks:**
     - These take conditional probability as primitive and define update rules accordingly.
     - **Separation:** Handles it by construction.
     - **LTP:** Built into the definition of conditional probability as long as the framework includes the law of total probability.
     - **Indicative vs counterfactual:** Typically for indicatives.
     - **Stability:** Should be stable if the same constraint is applied again.
     - **Reflection:** Likely compatible.
     - **Reflective-loop stability:** Not typically addressed, so might fail.
     - **Framing invariance:** Same as Popper functions: if the constraint is the same, then update is the same.

  **Conclusion:**

  The most damaging desideratum is the separation of updating on a conditional from updating on its antecedent or consequent. It challenges the core of standard Bayesian conditioning and also complicates Jeffrey conditioning and imaging.

  Among the contenders, Adams-style and Popper-function approaches (and primitive-conditional-probability frameworks) do well on most desiderata except possibly reflective-loop stability and framing invariance (for the propositional case). However, note that for framing invariance, when the conditional is not a proposition (like in Judy Benjamin), they handle it by updating on the constraint. But if we try to update on a material conditional (proposition), then they would not necessarily update in the same way as they do for conditional probability constraints. This is because the constraints are different. Therefore, we must be cautious: the desideratum of framing invariance requires that if the same constraint is expressed in two ways, the update is the same. But if the same proposition is expressed in two ways, then updating on that proposition should be the same. The contenders are not designed to update on the material conditional in the same way as on a conditional probability constraint. Therefore, they do not violate framing invariance because the constraints are different.

  The main gap for all contenders is reflective-loop stability. None of the existing frameworks are designed to handle self-referential conditionals that mention the agent's own belief revision rule.
answer: |-
  ### Complete Set of Desiderata for Rational Belief Revision on Conditional Propositions  
  The Judy Benjamin scenario serves as the central motivating case: an agent (Judy Benjamin) starts with equal credence (0.25) across four regions of terrain (Red-HQ, Red-Rear, Blue-HQ, Blue-Rear). She learns the conditional, "If you are in Red territory, then the probability you are at HQ is 3/4." Standard Bayesian conditionalization fails here, as the evidence is a *probabilistic conditional* (constraint on conditional probabilities), not an atomic proposition. The desiderata below ensure adequacy for such cases. Each desideratum is characterized by:  
  - **Phenomenon/distinction/result** it must accommodate.  
  - **Negotiability** (non-negotiable for coherence, rationality, or empirical adequacy; negotiable if trade-offs are tolerable).  
  - **Enforcing counterexample/intuition**.  

  ---

  #### Core Desiderata  
  1. **Separation of Updating on Conditionals from Antecedent/Consequent**  
     - **Phenomenon**: Updating on a conditional (e.g., "If \(A\), then \(P(B) = p\)") must not reduce to updating on \(A\), \(B\), or the material conditional \(A \supset B\). Belief revision must allow the conditional to constrain credences *without* forcing certainty in \(A\) or \(B\).  
     - **Negotiability**: Non-negotiable. Violation implies mishandling of probabilistic dependencies.  
     - **Counterexample**: In Judy Benjamin, updating on the material conditional \(\neg \text{Red} \lor \text{HQ}\) (logically equivalent to "If Red then HQ") yields \(P(\text{Red}) = 2/3\) and \(P(\text{HQ} | \text{Red}) = 1/2\), contradicting the learned conditional probability \(P(\text{HQ} | \text{Red}) = 3/4\). Intuition: The conditional should inform *how* Red affects HQ, not assert Red or HQ.  

  2. **Consistency with Law of Total Probability (LTP)**  
     - **Result**: Revised credences must satisfy LTP over any partition of conditions. For partitions \(\{C_i\}\), \(P(B) = \sum_i P(B | C_i) P(C_i)\) must hold post-revision.  
     - **Negotiability**: Non-negotiable. Violation implies incoherence (Dutch-book vulnerability).  
     - **Counterexample**: Judy Benjamin’s posterior must satisfy \(P(\text{HQ}) = P(\text{HQ} | \text{Red})P(\text{Red}) + P(\text{HQ} | \text{Blue})P(\text{Blue})\). If LTP fails (e.g., \(P(\text{HQ})\) is not a weighted average), credences become exploitable.  

  3. **Handling Indicative vs. Counterfactual Conditionals**  
     - **Distinction**: Indicative conditionals (about actual-world evidence) must revise current credences; counterfactuals (about hypothetical scenarios) must not directly affect actual-world beliefs.  
     - **Negotiability**: Non-negotiable. Conflation leads to irrational updates.  
     - **Counterexample**: If Judy Benjamin learns a *counterfactual* ("If you *were* in Red, then \(P(\text{HQ}) = 3/4\)"), her credence in *actual* location (Red/Blue) should not change. Intuition: Counterfactuals inform hypotheticals, not evidence about the actual world.  

  4. **Stability Under Nested Updates**  
     - **Phenomenon**: Sequential updates on conditionals must be order-invariant for non-conflicting information and idempotent (repeated identical updates change nothing).  
     - **Negotiability**: Non-negotiable for idempotence; negotiable for order-invariance (if conditionals interfere).  
     - **Counterexample**: After updating on \(P(B|A) = p\), re-updating with the same conditional should leave credences unchanged. If not, agents "overlearn" and destabilize beliefs. Order matters only if conditionals conflict (e.g., learning \(P(B|A) = p\) then \(P(B|A) = q \neq p\)).  

  5. **Compatibility with Reflection**  
     - **Principle**: Current credence in \(A\) must equal expected future credence in \(A\) after anticipated conditional updates (van Fraassen’s Reflection).  
     - **Negotiability**: Non-negotiable. Violation implies distrust in one’s future rationality.  
     - **Counterexample**: If Judy anticipates learning "If Red, \(P(\text{HQ}) = 3/4\)," her current \(P(\text{HQ})\) must equal her expectation of posterior \(P(\text{HQ})\). Failure makes her vulnerable to self-undermining bets.  

  #### Beyond Standard Literature  
  6. **Reflective-Loop Stability**  
     - **Phenomenon**: Updating on conditionals that reference the agent’s *own revision rule* (e.g., "If I lower \(P(A)\), then \(B\)") must avoid self-undermining cycles (e.g., infinite regress) or explosion (inconsistent credences).  
     - **Negotiability**: Non-negotiable for logical coherence.  
     - **Counterexample**: Consider "If updating on this sentence raises \(P(A)\), then \(\neg A\)." If the agent raises \(P(A)\), \(\neg A\) must hold, forcing \(P(A)\) down; if she doesn’t, no change is needed. This can create loops (e.g., "If I revise \(P(A)\) downward, then \(A\) is true"). Intuition: Rational agents handle self-reference without inconsistency.  

  7. **Framing Invariance**  
     - **Distinction**: Revision must be identical for logically equivalent formulations of a conditional (e.g., "If \(A\) then \(B\)" vs. "\(\neg A \lor B\)"), *unless* framing provides independent evidence (e.g., syntax reveals speaker knowledge).  
     - **Negotiability**: Non-negotiable for logical equivalence; negotiable if framing adds evidence.  
     - **Counterexample**: In Judy Benjamin, learning "\(\neg \text{Red} \lor \text{HQ}\)" (material conditional) vs. "If Red, \(P(\text{HQ}) = 3/4\)" must yield different updates because they express distinct *content* (proposition vs. probability constraint). But learning "If Red then HQ" as a material conditional vs. "\(\neg \text{Red} \lor \text{HQ}\)" *must* be identical—failure implies syntax overrides semantics.  

  ---

  ### Desideratum with Greatest Impact on Mainstream Approaches  
  **Separation of updating on conditionals from antecedent/consequent** does the most damage:  
  - **Bayesian conditionalization** fails: It requires updating on propositions, not conditionals. For Judy Benjamin, conditioning on \(\neg \text{Red} \lor \text{HQ}\) distorts \(P(\text{Red})\).  
  - **Jeffrey conditioning** fails: It updates on weighted *disjunctions* (e.g., directly altering \(P(\text{Red})\) or \(P(\text{HQ})\)), but cannot handle conditional *constraints* like \(P(\text{HQ} | \text{Red}) = 3/4\).  
  - **Imaging** (Lewis-style) fails: Designed for counterfactuals, it "shifts" probability to nearest \(A\)-worlds when evaluating "if \(A\) then \(B\)", implicitly updating on \(A\) and altering \(P(A)\). Judy Benjamin’s \(P(\text{Red})\) would change, violating separation.  

  ---

  ### Scoring Existing Approaches  
  | **Approach**               | **Separation** | **LTP** | **Indicative vs. Counterfactual** | **Nested Updates** | **Reflection** | **Reflective-Loop** | **Framing Invariance** |  
  |----------------------------|----------------|---------|-----------------------------------|--------------------|----------------|---------------------|------------------------|  
  | **Adams-style**            | Good           | Good    | Good (indicative only)            | Weak¹              | Moderate²      | Poor                | Moderate³              |  
  | **Lewis-style imaging**    | Poor           | Good    | Poor (counterfactual focus)       | Good               | Moderate²      | Poor                | Poor⁴                  |  
  | **Popper functions**       | Good           | Good    | Good (flexible)                   | Good               | Good           | Poor                | Good                   |  
  | **Primitive conditionals** | Good           | Good    | Good (indicative)                 | Good               | Good           | Poor                | Good                   |  

  - **Adams-style**: Uses conditional probability constraints. Fails reflective-loop stability (not designed for self-reference) and nested updates (order-dependence in sequences). Framing invariance moderate: handles constraints well but conflates material conditionals with probabilistic ones if misapplied³.  
  - **Imaging**: Violates separation (updates on antecedent) and framing invariance (syntax-dependent). Handles counterfactuals, not indicatives.  
  - **Popper functions** (primitive conditional measures): Excel on most desiderata but fail reflective-loop stability (self-reference not addressed).  
  - **Primitive-conditional-probability** (e.g., ranking theory): Similar to Popper but less expressive; same weaknesses.  

  **Footnotes**:  
  ¹ Adams may exhibit order-dependence for sequences of conditionals.  
  ² Reflection holds only if the update rule is known and trusted.  
  ³ Adams distinguishes material conditionals from probabilistic constraints; framing issues arise only if misidentified.  
  ⁣⁴ Imaging treats "if \(A\) then \(B\)" as a non-truth-conditional entity, breaking equivalence to \(\neg A \lor B\).  

  ### Summary  
  The desiderata enforce a theory that:  
  - Distinguishes conditional updates from propositional updates.  
  - Preserves probability coherence (LTP, Reflection).  
  - Respects indicative/counterfactual distinctions.  
  - Ensures stability and framing invariance.  
  - Avoids self-undermining in reflective loops.  

  **Key gap**: No approach fully handles reflective-loop stability, underscoring the need for innovations in self-referential belief revision. The Judy Benjamin case exemplifies why separation and LTP are foundational, crippling mainstream Bayesian and imaging-based methods.
