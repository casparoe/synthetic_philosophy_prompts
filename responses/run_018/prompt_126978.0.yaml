prompt: |-
  I recently found myself in a prolonged disagreement with a close friend about whether a technically crude but emotionally direct community mural could be considered greater art than a meticulously executed gallery installation that left us both feeling nothing — a dispute that replayed, in modern terms, Tolstoy’s well-known distinction between genuine art and counterfeit art, though with complications his framework seems ill-equipped to handle. Before I commit to any particular view, I want the full specification. Write the desiderata that an adequate normative theory of artistic value must meet if it is to take seriously Tolstoy’s central claim that art is essentially a means of transmitting feeling in service of human fraternity, while also accommodating what I will call moral resonance asymmetry: the phenomenon whereby an artwork intended to foster brotherly love in one interpretive community produces alienation or moral revulsion in another without being technically defective or emotionally inauthentic.

  For each desideratum, provide the motivating case or conceptual consideration — which artistic phenomena it must account for (such as the dismissal of technically masterful but emotionally hollow productions that Tolstoy classifies as counterfeit), which distinctions it must preserve (for instance, between emotional authenticity and emotional efficacy, or between universal accessibility and culturally situated reception), and which findings from moral psychology or aesthetics it must not contradict. Clearly flag which requirements you take to be non-negotiable and which are preferences of particular camps, and identify any subset of desiderata that appear jointly unsatisfiable — I am especially interested in whether a theory can simultaneously require universal emotional transmission and full sensitivity to moral resonance asymmetry without internal contradiction. Keep the weight on the criteria and their tensions rather than on a comprehensive scorecard, though I would like a brief indication of how Tolstoy’s own moralist theory, a formalist position that denies moral content any artistic relevance, and a pluralist account that treats emotional transmission as one artistic value among many fare against your list.
reasoning: |-
  Okay, the user is asking for a comprehensive set of desiderata for a normative theory of artistic value. They want to reconcile Tolstoy's emphasis on emotional transmission and human fraternity with "moral resonance asymmetry" - cases where art meant to unite one group alienates another. 

  Hmm, this is a sophisticated request that shows the user has deeply engaged with Tolstoy's theory while recognizing its limitations. Their mural vs. gallery example perfectly illustrates the core tension: emotional authenticity vs. technical mastery, complicated by cultural interpretation gaps. 

  First I need to unpack Tolstoy's core claims: art as infection of feeling, serving universal brotherhood, rejecting "counterfeit" art. Then identify where this breaks down - mainly when "fraternal" art backfires due to cultural differences. The moral resonance asymmetry phenomenon suggests Tolstoy underestimated interpretive communities' role.

  The user wants desiderata that must:
  1) Preserve Tolstoy's valid insights (emotional transmission as essential, rejecting hollow technique)
  2) Handle asymmetries where the same artwork causes unity in one community and revulsion in another 
  3) Navigate tensions between universalism and cultural specificity

  Key challenges:
  - Can a theory demand universal emotional transmission while accepting that reception is culturally situated? That seems contradictory at first glance.
  - How to distinguish between "authentic but poorly transmitted" vs. "inauthentic" art when art fails to connect?
  - Where to place technical skill if it's neither necessary nor sufficient for artistic value?

  I'll structure desiderata into non-negotiable (Tolstoy's core requirements) and negotiable (accommodating modern complexities). The tension between universal accessibility and cultural reception seems the toughest nut to crack. 

  For evaluation, Tolstoy's own theory fails asymmetry cases; formalism avoids the problem by dismissing moral content; pluralism handles asymmetry but dilutes Tolstoy's radical claim about art's purpose. The user seems to want a theory that keeps Tolstoy's moral urgency while being empirically accurate about reception - quite the balancing act.

  Notably, they're not asking me to solve it, just to map the requirements clearly. Smart approach - this avoids premature commitment. I'll emphasize where desiderata conflict, especially that universality-asymmetry tension they flagged as particularly interesting.
answer: |-
  Here are the desiderata for a normative theory of artistic value seeking to reconcile Tolstoy's core claims with moral resonance asymmetry, organized by category and tension:

  **Non-Negotiable Desiderata (Tolstoyan Core):**

  1.  **Emotional Transmission as Necessary:** Art *must* involve the sincere transmission of specific feelings/emotions from artist to perceiver.
      *   *Motivation:* Tolstoy's definition of genuine art; distinguishes art from mere decoration, intellectual exercise, or technical display.
      *   *Must Account For:* Dismissal of "counterfeit art" (technically masterful but emotionally hollow works like much academic painting or virtuosic but empty music).
      *   *Must Preserve:* Distinction between art and non-art based on successful *feeling-transmission*, not just skill or complexity.

  2.  **Emotional Authenticity Requirement:** The feelings transmitted must originate from a sincere, personal experience of the artist.
      *   *Motivation:* Tolstoy's rejection of art created for fame, money, or imitation; core to avoiding "counterfeit" art.
      *   *Must Account For:* The intuitive difference between a heartfelt folk song and a cynically manufactured pop hit using similar tropes.
      *   *Must Preserve:* Distinction between sincerity and manipulation, authentic expression vs. calculated effect.

  3.  **Fraternal Purpose as Constitutive:** The ultimate value and purpose of art is to foster human connection, empathy, and "brotherly love" (fraternity) by transmitting shared human feeling.
      *   *Motivation:* Tolstoy's moral imperative for art; grounds its social and ethical significance.
      *   *Must Account For:* The high value placed on art that builds bridges across difference or expresses universal suffering/joy (e.g., Goya's "Disasters of War," spirituals, certain protest art).
      *   *Must Not Contradict:* Findings that art *can* enhance empathy and perspective-taking (moral psychology).

  **Essential Desiderata (Addressing Asymmetry & Complexity):**

  4.  **Moral Resonance Asymmetry Accommodation:** The theory *must* explain how an artwork created with sincere intent to foster fraternity can *legitimately* cause alienation or moral revulsion in a different interpretive community, *without* this failure automatically rendering the work inauthentic or technically defective.
      *   *Motivation:* The core complication presented (e.g., a religious mural revered in one community seen as blasphemous kitsch in another; socialist realism celebrated by adherents, reviled by dissidents).
      *   *Must Account For:* Radical differences in interpretation based on cultural context, historical trauma, religious belief, or political ideology.
      *   *Must Preserve:* Distinction between artist's *intent* (authenticity) and perceiver's *reception* (efficacy), and between technical competence and moral/emotional resonance.

  5.  **Contextual Reception Sensitivity:** The successful transmission and fraternal effect of feelings are inherently dependent on the perceiver's cultural, historical, and psychological context ("interpretive community").
      *   *Motivation:* Required to explain Moral Resonance Asymmetry; aligns with reception theory and cultural studies.
      *   *Must Account For:* Historical shifts in interpretation (e.g., colonial-era art now seen as racist); art deeply meaningful within subcultures but opaque outside.
      *   *Must Preserve:* Distinction between universal *human capacity* for feeling and the culturally *situated content/meaning* of specific feelings and symbols.

  6.  **Distinction Between Transmission Success and Fraternal Success:** Successfully transmitting a *specific* feeling (authentic to the artist) is necessary for art status, but achieving the *fraternal effect* (brotherly love) is a contingent outcome dependent on reception context and the *nature* of the feeling transmitted.
      *   *Motivation:* Avoids collapsing artistic value entirely into contingent moral outcomes; preserves space for tragic or challenging art that transmits authentic feeling but may not immediately foster "love".
      *   *Must Account For:* Powerful art expressing rage, despair, or controversial viewpoints that is authentic and transmits feeling, but may initially cause division *before* potentially fostering understanding (or may not).
      *   *Must Preserve:* Distinction between emotional *authenticity/transmission* (artistic core) and emotional/moral *efficacy* (context-dependent outcome).

  **Negotiable/Contested Desiderata (Reflecting Different Camps):**

  7.  **Primacy of Fraternal Outcome (Strong Tolstoyan):** The *highest* artistic value is reserved for works that *successfully* achieve the fraternal effect for a broad audience. Transmission alone grants art *status*, but not necessarily high *value*.
      *   *Preference:* Strong moralist/utilitarian camp within Tolstoyanism.
      *   *Tension:* Conflicts with valuing historically significant art that now causes revulsion (e.g., some propaganda), or art expressing complex/negative feelings vital to a subculture.

  8.  **Technical Skill as Instrumental, Not Constitutive:** Technical mastery (craft) has value only insofar as it effectively serves emotional transmission. It is neither necessary nor sufficient for artistic value.
      *   *Preference:* Anti-formalist/Tolstoyan camp; motivated by cases like the community mural vs. sterile gallery piece.
      *   *Contested By:* Formalists who see skill/formal innovation as core to artistic value, even without strong emotion.

  9.  **Scope of "Fraternity":** Definition of the relevant community for fraternity (universal humanity? specific cultural group? potential humanity?) impacts how asymmetry is judged.
      *   *Preference:* Varies between universalist and particularist views. Universalists see failure with *any* group as problematic; particularists may value deep connection within a specific community highly, even if outsiders are alienated.

  **Key Tensions & Potential Incompatibilities:**

  *   **The Core Tension (Universality vs. Asymmetry):** Desideratum 3 (Fraternal Purpose as Universal Goal) and Desideratum 4 (Asymmetry Accommodation) *appear* jointly unsatisfiable at first glance. How can art's purpose be universal fraternity if its effect is often divisive?
      *   **Potential Resolution:** The theory must decouple *artistic value* (contingent on authentic transmission) from *realized fraternal success* (contingent on reception context and the specific feeling). The *purpose* is fraternity, but success in achieving it is not guaranteed and failure doesn't negate the work's status *as art* or the artist's authentic intent. Value might be judged *aspirationally* (does it aim for connection through authentic feeling?) or *contextually* (does it succeed *within its intended or relevant community*?). This requires abandoning Tolstoy's strict universal accessibility requirement.

  *   **Authenticity vs. Efficacy:** Desiderata 2 (Authenticity) and 6 (Transmission vs. Fraternal Success) highlight that sincere transmission (authenticity) doesn't guarantee positive reception or fraternal outcome (efficacy), especially across contexts (Asymmetry - Desideratum 4).

  *   **Fraternity vs. Challenging Content:** Desideratum 3 (Fraternity) and the need to account for powerful, authentic art expressing negative or divisive feelings (implied by Desiderata 4 & 6) create tension. Can transmitting rage or despair *ever* serve fraternity? A theory needs to define "fraternity" broadly enough to include shared understanding of difficult human experiences.

  **Evaluation of Existing Theories Against Key Desiderata:**

  1.  **Tolstoy's Moralist Theory:**
      *   **Strengths:** Excels at 1, 2, 3 (by definition), and 8. Clearly dismisses counterfeit art.
      *   **Weaknesses:** Fails catastrophically at 4 (Moral Resonance Asymmetry) and 5 (Contextual Reception). Its rigid universalism cannot handle differing interpretations. Struggles with 6, often conflating transmission failure with lack of authenticity. Undervalues art with complex or negative emotions that don't fit a simple "brotherly love" mold.

  2.  **Formalism (e.g., Bell's "Significant Form"):**
      *   **Strengths:** Values technical skill (8, though constitutively, not instrumentally). Can potentially handle 4/5 by divorcing aesthetic response from moral content altogether.
      *   **Weaknesses:** Explicitly rejects 1, 2, 3, 6, 7. Fails to distinguish emotionally hollow technical mastery (counterfeit art) from genuine art on any emotional/moral grounds. Cannot account for the intuitive power of emotional transmission or art's social/moral role.

  3.  **Pluralism (e.g., Multiple Dimensions of Value):**
      *   **Strengths:** Excels at accommodating 4 and 5 (contextual reception). Can easily incorporate emotional transmission (1) as *one* important value among others (technical, intellectual, historical, formal). Handles asymmetry naturally.
      *   **Weaknesses:** Compromises on 2 and 3. Emotional authenticity and fraternal purpose become just *optional* values, not *necessary* or *constitutive* of art itself. Struggles to explain why emotionally hollow technical displays *feel* like "counterfeit" art if other values are present. Dilutes Tolstoy's core claim about art's essential nature and purpose.

  **Conclusion:** An adequate theory must rigorously preserve the non-negotiables (1-3) while fully integrating the complexities of reception (4-6). The most significant challenge is resolving the tension between the universal *aspiration* of fraternity (3) and the reality of moral resonance asymmetry (4). This likely requires redefining "success" contextually or aspirationally, decoupling it from guaranteed universal reception, while maintaining that the sincere transmission of feeling *aimed* at connection remains the defining purpose and core value generator. Such a theory would likely resemble a highly contextualized and reception-sensitive form of moral expressionism, distinct from both Tolstoy's rigid universalism and pluralism's value fragmentation. Formalist approaches simply bypass the core issues raised.
