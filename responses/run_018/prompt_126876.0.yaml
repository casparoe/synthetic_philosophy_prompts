prompt: |-
  You are an expert in philosophy of social science and in Weber's historical sociology. Before answering, please take a moment to brainstorm: map the logical dependencies among the commitments below, distinguish superficial conflicts from deep ones, and identify which revisions would preserve the core of the view.

  Here is the profile I am presenting in a reading group on culture and causation, and I need a consistency audit before I defend it. These are my commitments regarding Weber's Protestant ethic thesis and the problem of explaining with values:

  (1) I accept Weber's claim that the Protestant ethic was causally relevant to modern capitalist rationalization through elective affinity — a meaningful fit between religious values and economic practices — rather than being a mere post-hoc rationalization.
  (2) I maintain that values, qua values, never serve as efficient or triggering causes of particular behaviors; at most they act as structuring conditions that delimit the space of rational action without producing specific outcomes.
  (3) I hold that legitimate macro-level cultural explanations must be decomposable into micro-level psychological mechanisms; cultural entities are explanatory heuristics, not independent causal nodes.
  (4) I take Weberian interpretive sociology (Verstehen) to be hermeneutic rather than causal: it tracks adequacy of meaning-relations, not mechanistic production.
  (5) I want to defend mutual conditioning: material economic conditions and cultural value-complexes are irreducible to one another, yet both genuinely contribute to explanation.

  Please audit whether these hang together. Examine each pair: for genuinely tense combinations, specify which commitment must be revised, what the least costly fix is, and rate the severity. For pairs that only appear incompatible, show exactly how scope-delimitation dissolves the tension. Rank the real conflicts by severity, then identify the single revision that eliminates the most inconsistencies with minimal damage. Be explicit about whether (3) and (5) can survive together, and whether (1) remains defensible if (4) is taken literally.
