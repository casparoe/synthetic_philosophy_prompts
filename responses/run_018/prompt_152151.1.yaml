answer: |-
  1.  Aristotle's core move rejects bivalence for future contingents ("P" is neither true nor false *now*) to avoid present truth entailing fatalism, preserving the openness of the future essential for free will.
  2.  Critics argue this merely relocates the problem: the fatalism shifts to the *eventual* truth-value assignment ("P" *will* become true/false inevitably), or indeterminacy infects the meta-level (it's indeterminate *whether* "P" is neither-true-nor-false).
  3.  In branching-time with non-1 open probabilities as ontological bedrock, Aristotle's rejection *initially* seems reinforced: no single future branch is "privileged" now, so no present truth-value exists for "sea battle tomorrow," directly reflecting the objective indeterminacy.
  4.  However, this indeterminacy *itself* manifests as non-1 probabilities, pushing the core issue *away* from truth-value gaps and *towards* explaining how free agency operates within a fundamental probabilistic structure: why does a *particular* choice occur given the probabilities don't sum to 1, risking randomness supplanting fatalism as the threat to free will?
  5.  **Verdict:** Aristotle's move *still works* for its specific aim: rejecting bivalence *does* block the logical path from present truth to fatalistic inevitability, even in this model, because the non-1 probabilities embody the *absence* of any fact making "sea battle" true *now*; the open probabilities *are* the ontology of freedom, not a problem to be solved.
