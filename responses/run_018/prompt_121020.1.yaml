prompt: |-
  Hi there. I'm a novelist — four books, you've definately never heard of them — and for about a year now I've been keeping a notebook on my own bullshit, mostly how often I know what's going on in my own head versus how often I'm just narrating. I've ended up with a pile of verdicts and no principle, and it's starting to bug me while I work.

  Here's what I think, case by case.

  1. A reader writes to say my character Lena slaps her sister because she's ashamed of being pitied, not because she's jealous. I'd have said jealous, no hesitation. Reading his email I get this hot click of yes — but I also know I'd have got the same click if he'd said the opposite. Verdict: before the email, my report on my own character's motive wasn't knowledge in any useful sense. After the email I'm not sure it is either.

  2. A friend says I'd stop writing if the money stopped. I say no, instantly, total certainty, and I can't produce a single reason. Verdict: trustworthy. There's no evidence for it and I still trust it.

  3. I told an interviewer the ending of book two came from a dream about my grandmother. Notebook says: no dream. Three drafts of that ending, all after a phone call with my agent. Verdict: worthless. I confabulated a source, and I believe I'd have passed a lie detector on it.

  4. Whether a sentence feels wrong as I'm writing it. I trust this completely — it's the only thing I actually revise on — and I can't say what the wrongness consists in. Verdict: real and authoritative.

  5. The pair I keep going in circles on. (a) I say I don't care about reviews. My chest goes tight when a certain critic's name appears in my inbox. I still want to say my I don't care is true — the tight chest is plumbing, not attitude. (b) My character Marta insists she is not in love with the married man, and keeps inventing errands that take her past his house. As her author I say with total certainty that her denial is false. These two are the same shape and I want opposite verdicts on them. Probably I'm special-pleading for myself.

  6. Whether I was aware of the fridge humming while I wrote chapter nine. I can't tell now and I don't think I could have told then either, even mid-sentence. Verdict: not a question introspection gets to answer at all.

  7. At nineteen I said, in letters I still have, that I was happy. Now I say I was miserable and didn't know it. Verdict: present me beats past me, even though past me was the one standing there.

  8. My own term for it, the green-room effect: once I've read a passage aloud to myself a few times it starts to feel inevitable, like it couldn't be any other way, and after that I can't tell whether it's any good. So I've started distrusting my judgment on exactly the passages I've rehearsed most. Verdict: the act of checking wrecks the very signal I rely on in case 4.

  9. A grad student sent me a Lacanian reading of my second book and I promptly remembered that I'd intended the wallpaper in chapter four as womblike. Verdict: contaminated. I think the memory was manufactured by reading his essay and I don't think I can recover what I actually intended.

  10. Whether a line of mine was meant ironically. I say yes, ironically. Everyone reads it straight. My editor says cut it. I mostly back myself here, but only because irony feels like case 4 — a feel — rather than case 3, a story about where it came from.

  So: is there one principle that sorts these, or do I need two? My own guess is something like — I'm authoritative about what it's like for me right now and about whether a thing feels finished, and I'm just another interpreter, with bad data and a theory, when it comes to causes, motives and my own past. But that guess doesn't obviously handle 5(b), where I'm not the subject at all and yet claim certainty, or 8, where the thing I'm authoritative about gets destroyed by the checking.

  What I'd like: state the principle precisely enough that I could apply it cold to a case I bring you next month. Then run it on the two I don't have verdicts on yet — (i) there's a paragraph in the new manuscript I have no memory of writing, none at all, and my daughter does sometimes mess with the file: do I know anything here, and what? (ii) my narrator: do I know why I switched him from first person to third, or is that just case 3 with better tailoring? And please tell me straight which of my ten verdicts your account can't save and has to overturn, and why that one and not another. Don't be polite about it, I'd rather have it clean than have it flattering.
reasoning: |-
  Okay, this novelist has been keeping a notebook about their own self-awareness versus self-narration for a year and has ten cases with verdicts. They want a single principle to sort these, or maybe two, and they want it applied to two new cases. They also want to know which of their verdicts the principle would overturn.

  First, I need to understand their examples and their proposed principle. They suggest they're authoritative about present experience and whether something feels finished, but not about causes, motives, or the past. But they point out problems with cases 5(b) and 8. 

  Let me list the cases and their verdicts:

  1. Character's motive: Not knowledge before or after reader's email.
  2. Would keep writing without money: Trustworthy despite no evidence.
  3. Source of book ending (dream vs. agent call): Confabulated, worthless.
  4. Sentence feeling wrong: Real and authoritative.
  5a. Claim not to care about reviews vs. physical reaction: Wants both to be true, possible special-pleading.
  5b. Character's denial of love: Author certain it's false.
  6. Awareness of humming: Not answerable by introspection.
  7. Past happiness: Present self overrules past self.
  8. Green-room effect: Rehearsal makes passages feel inevitable, wrecking judgment.
  9. Intended symbolism: Memory contaminated by external analysis.
  10. Intended irony: Author backs self because it's a feel, not a story.

  The new cases are:
  (i) Paragraph with no memory of writing, possible daughter interference: What do they know?
  (ii) Why they switched narrator POV: Is it confabulated?

  Their proposed principle has issues with 5(b) (certainty about character's motives) and 8 (authority destroyed by checking). 

  I recall Wittgenstein's distinction: knowledge of current subjective states vs. interpretations of causes or past states. But 5(b) is about another person (a character), so why is the author certain? And case 4's authority is undermined in case 8.

  The key might be distinguishing between immediate, non-inferential awareness and theoretical interpretations. For example:
  - Non-inferential: Present sensations (case 4's "wrongness"), current intentions (case 10's irony feel), perhaps case 2's certainty about continuing to write.
  - Inferential: Motives (case 1, 3, 9), past states (case 7), causes (case 3, possibly case 6).

  Case 5(a) and 5(b) are interesting. The author claims "I don't care" is true despite physical reaction, but for the character, they're certain the denial is false. That seems inconsistent. The principle should address this.

  For case 5(b), the author's certainty might come from constructing the character—they decide the motives as part of creation. So it's not introspection but authorial intent in the moment. But case 1 shows they can be wrong about their own character's motives. Hmm.

  Case 8 is about repeated exposure altering perception—like the mere-exposure effect in psychology. So checking ruins the initial authentic feeling.

  The principle needs to account for:
  - Authority about present, immediate experiences (feelings, sensations).
  - No authority about past, causes, motives (interpretations).
  - But with exceptions: in creation, authors might have privileged access to character motives at the time of writing, but it can be forgotten or confabulated later.

  For the new cases:
  (i) No memory of writing a paragraph: They can't know if they wrote it or not; introspection doesn't reach that. It's like case 6—unknowable.
  (ii) Reason for POV switch: Likely confabulated, like case 3, unless they have a clear memory from the time.

  Verdicts to overturn: Probably case 5(a). The author wants to believe "I don't care" is true despite physical evidence, but the tight chest suggests otherwise. The principle might say they're not authoritative about their own motives/attitudes here, similar to case 1. 

  Case 2 is trusted without evidence—it's a present conviction, so under the "present experience" category. Case 4 is authoritative. Case 5(b) might be justified as authorial intent during creation, but that's different from introspective knowledge.

  Final principle: Distinguish between immediate phenomenal awareness (present feelings, sensory experiences) and narrative interpretations (explanations, motives, past states). The former is authoritative when accessed directly; the latter is interpretive and fallible.

  Overturn case 5(a): The claim "I don't care" is likely false or incomplete, given the physiological reaction. They're not authoritative about their own motives here.
answer: |-
  Here's a precise principle distilled from your cases, designed to be applied coldly to future examples. I'll state it, then run it on your unresolved cases (i) and (ii), and finally identify which of your verdicts it overturns (spoiler: one clear reversal, and one tweak).

  ---

  ### **The Principle: The Authority Boundary**  
  **You are authoritative *only* about:**  
  - **Present, first-order phenomenal states** (what something *feels like* to you right now: e.g., sensory input, emotional qualia, aesthetic "wrongness").  
  - **Current, non-inferential intentions** (what you *mean* or *intend* in the immediate moment of creation/action, without post-hoc analysis).  

  **You are *not* authoritative about:**  
  - **Causal explanations** (why you did something, where an idea "came from").  
  - **Motivational attributions** (your own or others'—including characters—beyond the immediate present).  
  - **Retrospective narratives** (reconstructions of past states, intentions, or awareness).  
  - **Judgments corrupted by repetition/feedback** (where direct checking alters the signal).  

  **Corollary for fiction:**  
  Your authority over characters extends only to what you *deliberately implant* during active creation (e.g., "Marta denies love but I *wrote her* to be lying"). Once published (or even drafted), characters become interpretive objects—like your past self—and your access to their "truth" is no better than a reader's.  

  ---

  ### **Application to Your Unresolved Cases**  
  **(i) The mysterious paragraph**  
  - **Question:** Do you know if you wrote it or if your daughter did?  
  - **Principle applied:**  
    - You have *no* authoritative access here. This is a **retrospective causal question** ("Who authored this?").  
    - Your lack of memory is a negative signal, but not proof—introspection can't retrieve lost or unmade data (like Case 6).  
    - **Verdict:** You know *nothing* certain. Treat it as external evidence: check file timestamps, ask your daughter, or revise based on whether it *feels* alien (Case 4).  

  **(ii) Why you switched narrator POV**  
  - **Question:** Is this genuine knowledge or confabulation?  
  - **Principle applied:**  
    - This is a **causal explanation** ("Why did I change POV?"). Absent a clear, *contemporaneous* record (e.g., a note written mid-switch), your account is inherently interpretive.  
    - Like Case 3 (the dream/agent confabulation), it's likely **narrative tailoring**—you're constructing a plausible "why" after the fact.  
    - **Verdict:** Not knowledge. It's Case 3 with better tailoring. Trust only what you documented *at the time*.  

  ---

  ### **Verdicts Overturned by the Principle**  
  Your principle was mostly sound, but the Authority Boundary forces one outright reversal and one significant refinement:  

  1. **Overturned: Case 5(a) ("I don't care about reviews")**  
     - **Your verdict:** You trusted the claim ("I don't care") over the physical reaction (tight chest).  
     - **Problem:** The tight chest is a **present phenomenal state** (authoritative data). Your claim "I don't care" is a **motivational attribution** (non-authoritative self-diagnosis). You prioritized the narrative over the direct signal.  
     - **New verdict:** *Untrustworthy*. The physiological response indicates a conflict your narrative denies. Like Case 1, you're interpreting yourself poorly. (Special pleading confirmed—you wouldn't let Marta off the hook!)  

  2. **Refined: Case 5(b) (Marta's denial of love)**  
     - **Your verdict:** Certainty her denial is false (contradicting your "no authority on motives" rule).  
     - **Principle fix:** Your certainty *is* justified under the **fiction corollary**. At the *moment of writing*, you implanted her denial *as a lie*. That's a **current, non-inferential intention** (authoritative). Post-writing, your certainty decays—but here, you're appealing to authorial intent *during creation*, not real-time introspection.  
     - **Survival:** Verdict stands, but *only* because it's an artifact of authorial intent, not ongoing self-knowledge.  

  ---

  ### **Why the Other Verdicts Hold**  
  - **Case 1:** Motive attribution → non-authoritative.  
  - **Case 2:** Present conviction → authoritative ("current intention").  
  - **Case 3:** Retrospective causal story → non-authoritative confabulation.  
  - **Case 4:** Present aesthetic feel → authoritative.  
  - **Case 6:** Unrecoverable past awareness → non-authoritative.  
  - **Case 7:** Retrospective narrative → present interpretation wins.  
  - **Case 8:** Checking corrupts the phenomenal signal → principle explicitly discounts corrupted judgments.  
  - **Case 9:** Contaminated memory → non-authoritative.  
  - **Case 10:** Ironic intent → authoritative if felt *during writing* (present intention); unreliable if reconstructed later.  

  ---

  ### **Practical Summary**  
  **To apply coldly next month:**  
  1. Ask: *Am I reporting a **raw, immediate experience** (sensation, emotion, aesthetic tension) or a **story** (cause, motive, past state)?*  
  2. If it’s a "story," distrust it—demand contemporaneous evidence.  
  3. If it’s a "feel," trust it—*unless* you’ve poked at it repeatedly (Case 8).  
  4. For characters: Your authority expires at drafting. What you *meant* then is sacred; what it "means" now is public property.  

  This won’t stop the bullshit—self-narration is compulsive—but it’ll help you flag it faster. And if it stings: good. You asked for clean, not flattering. Now go fix that sentence that feels wrong (Case 4). It’s the one thing you *know*.
