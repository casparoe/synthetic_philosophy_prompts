  First, I need to recall the frame problem's history. It started with McCarthy and Hayes in AI - a technical problem about efficiently representing what doesn't change during actions. Then Dennett reframed it as a broader puzzle about relevance for any cognitive system. That dual origin explains why people talk past each other: engineers see the narrow version as solved, philosophers see the broad version as untouched.

  Hmm, the user's hypothesis about ambiguous framing seems spot-on. But there's more - the LLM debate adds layers. When AI students say "look, transformers handle relevance without frame axioms," they're solving the narrow problem. But philosophers point out we still don't understand how they do it, which keeps the broad problem alive. This isn't just verbal - it's about whether solving a problem practically counts as explaining it.

  The user's asking for a diagnosis, not just agreement. Let me structure this carefully: First, confirm their observation about the standoff. Then analyze why it happened - probably all three factors they mentioned (verbal, substantive, bedrock) are intertwined. The competence/explanation divide feels especially fundamental - some people will always demand mechanistic understanding even when systems work.

  For progress... the user's suggestions are good. Sharpening definitions would help, but won't resolve everything. Testing LLMs on relevance failures could clarify if they "truly" solve it. But honestly? The deepest path might be confronting why we care - is the frame problem ultimately about building working systems, or understanding cognition? That meta-question might be the real divider.

