  the two camps: the Retentionists (they say the driver still holds a standing intention, just not in conscious view) and the Dissociationists (they say the motor system is running a shadow-route with zero endorsement from the driver). 

  format: start with numbered claims both sides can actually sign — about what happens physically, about what counts as noticing you're lost, about the fact that people often correct course. then a disagreements table with the exact split in wording each camp accepts. then three cruxes: (1) whether turning-around-behavior proves prior intention or just post-hoc repair; (2) whether enviromental scaffolding (road signs, muscle memory) replaces the need for an internal plan; and (3) a weird shared test-case — a driver who misses the exit but then, without realizing, takes an alternate route that only succeeds if she still knew the destination. for that case, each side should state in advance what they'd predict about her behavior.

  no bibliographies, no "see X 1984". write it casual, like notes for my notebook. a typo or two is totally fine.
