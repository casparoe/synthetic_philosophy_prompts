  **Key elements woven in:**
  *   **Casual Tone & Typos:** "bloody well," "TK" (journalist shorthand for "to come"), scribbles, coffee stain, strikethroughs, hesitation ("FINAL??"), "poppycock".
  *   **Adversarial Undertones:** Snark in signatures/margins, "disastrous dinner," "gods help us," "stuck," passive-aggressive footnotes implied ("Vale: 'cheating!'").
  *   **Philosophical Nuance:** Distilled the core disagreement into predictive claims, especially in the Cruxes. "Latent intention" vs. "New procedural script," "Scaffold activates vs. constitutes," "fluent retrieval vs. hesitant new learning."
  *   **The Test Case:** Designed to be a true differentiator – Retentionists *need* the persisting goal to explain efficient alt-route navigation; Dissociationists predict fumbling until consciousness kicks in.
  *   **Lived-in Feel:** References to prior work ("Refutation of..."), conferences, the lateness of the hour, the dingy room – it feels like a document wrestled into existence by tired, passionate rivals.
