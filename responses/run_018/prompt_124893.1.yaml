prompt: |-
  I was having a chat with my friend after a lecture on moral change and she summed up this whole Williams/Appiah line for me. She said basically that Bernard Williams and Kwame Anthony Appiah both think moral revolutions never happen because people suddenly see that a practice is immoral through rational arguement. Instead, they think norms like slavery and dueling collapse when the social groups that benefit from them realise the practice is making them look ridiculous or hurting their economic intersts. For slavery, Williams apparently argued that abolition wasn't driven by abolitionist arguements about human equality but by the fact that industrial capitalism made slave labour unprofitible and embarrassing for Britain, so the moral argument was just window dressing after the fact. And Appiah, she said, showed that dueling died out in Britain not because anyone proved it was wrong, but because the aristocrasy realised that dueling made them seem barbaric to the rising middle class whose respect they actually wanted. So her takeaway was that if you care about ending some harmful norm today, moral philosophy is basically useless — you should just work on shifting the honour codes and materal interests of the elite who keep it going. She also mentioned something about Appiah distinguishing between honour-worlds and dignity-cultures, but said that just reinforces the point that arguements only work once the culture has already shifted.

  I'm not sure this is fair — it sounds a bit too cynical, and I'm not convinced Williams would say arguments are literally useless. But I don't know the texts well enough to say where the misrepresentation is. Could you go through her summary and tell me what's accurate, what's a subtle distortion, and what's just wrong? In particular, does the conclusion that moral philosophy is pointless follow from what Williams and Appiah actually claim? And is she right to treat them as saying essentially the same thing, or does Appiah's work on honour-worlds versus dignity-cultures actually change the picture? I'd also like to know whether her claim about slavery being driven mainly by economic embarrassment is something Williams actually holds, or if that's a common oversimplification.
reasoning: |-
  Okay, the user is asking about a summary their friend gave after a lecture on moral change, specifically regarding Bernard Williams and Kwame Anthony Appiah's views. The friend claimed that both philosophers believe moral revolutions happen due to shifts in honor codes or economic interests rather than rational arguments. The user is skeptical and wants to know where the friend's summary might be accurate or distorted.

  First, I need to recall Williams and Appiah's actual positions. Williams, in "Shame and Necessity," argues against the idea that moral progress comes solely from rational arguments. He emphasizes the role of social and psychological factors like shame. Appiah, in "The Honor Code," discusses how practices like dueling and foot-binding ended due to honor dynamics, not just moral arguments. The user’s friend seems to oversimplify both thinkers, especially by suggesting moral arguments are useless.

  The user is concerned that their friend's conclusion—moral philosophy is pointless—is too cynical and possibly a misrepresentation. They also question if Williams and Appiah are saying the same thing. The user might be looking for a balanced understanding to counter their friend's argument or to clarify their own thoughts on moral change. They might also be interested in how these theories apply to current issues, like ending harmful norms today.

  I should address several points: accuracy of the slavery claim, the role of moral arguments, and differences between Williams and Appiah. For Williams, the slavery point is an oversimplification; he acknowledged multiple factors, not just economics. Appiah’s honor vs. dignity distinction adds nuance, showing cultural shifts matter. Emphasizing that both see moral arguments as part of the process, not irrelevant, is key.

  The user’s deeper need might be to understand how to effectively advocate for moral change. They might feel discouraged by their friend's take and seek reassurance that philosophical arguments still matter. Highlighting that Williams and Appiah provide tools for cultural engagement rather than dismissing arguments could address this. Also, clarifying that both theorists offer complementary insights, not identical views, will show the complexity the friend missed.

  I should structure the response to correct distortions, explain each philosopher's nuances, and refute the "moral philosophy is useless" conclusion. Mentioning that arguments gain traction when social conditions change, but aren't merely window dressing, strikes the right balance. This helps the user present a more informed perspective in discussions.
answer: |-
  Your friend's summary captures the *spirit* of Williams and Appiah's critiques of simplistic "enlightenment rationalism" in moral change, but it significantly oversimplifies and arguably misrepresents their nuanced positions, leading to an overly cynical and potentially misleading conclusion. Let's break it down:

  **Accurate Elements:**

  1.  **Critique of Pure Rationalism:** Both Williams and Appiah fundamentally reject the idea that moral revolutions happen *primarily* or *solely* because people are rationally convinced by abstract philosophical arguments about universal principles (like equality or utility). They argue that historical change is messier.
  2.  **Role of Social Factors (Honor, Shame, Interest):** Both emphasize the crucial role of social psychology, honor codes, shame, and material/status interests in driving the *acceptance* and *enforcement* of moral norms and their collapse.
  3.  **Appiah on Dueling:** Appiah's account of the decline of dueling in *The Honor Code* is accurately summarized. He argues that the practice collapsed not because aristocrats were rationally convinced it was immoral, but because it became *dishonourable* – it made them look ridiculous, reckless, and barbaric in the eyes of the rising middle class whose respect and political power they needed. Shame and a shift in what conferred status were key.
  4.  **Williams & Slavery - Partial Truth:** Williams does argue (*Ethics and the Limits of Philosophy*, *Shame and Necessity*) that the *effectiveness* and *timing* of abolitionist arguments were heavily dependent on shifting material conditions and social perceptions. He stresses that the *rhetorical power* of arguments about equality gained traction partly because slavery was becoming economically less vital and increasingly seen as an embarrassment to a nation positioning itself as civilized and modern. He *does* see the moral arguments as gaining force in this altered context.
  5.  **Appiah on Honor-Worlds vs. Dignity-Cultures:** Your friend is right that Appiah makes this distinction. Honor-worlds are societies where worth is derived from recognition by a specific group according to its codes (like aristocrats dueling). Dignity-cultures emphasize inherent, equal worth regardless of social standing. Appiah argues that moral revolutions often involve shifts *between* these frameworks or within them, driven by changes in who grants recognition (honor) and what recognition is granted for. This *does* reinforce the point that abstract arguments work best when embedded in shifting social contexts of recognition.

  **Subtle Distortions & Oversimplifications:**

  1.  **"Never Happen" / "Literally Useless":** This is the most significant distortion. Neither Williams nor Appiah claim moral arguments are *useless* or that rational persuasion *never* plays a role. They argue it's *insufficient* on its own and that its *effectiveness is contingent* on broader social, psychological, and historical conditions.
      *   **Williams:** He sees moral philosophy and argument as part of ethical life, but embedded within "thick" concepts rooted in particular social formations. Arguments gain traction when they resonate with evolving social experiences and sensibilities. He wouldn't call it "window dressing"; he'd say its meaning and force are context-dependent. Philosophy can clarify, criticize, and articulate emerging sensibilities, but it doesn't operate in a vacuum.
      *   **Appiah:** Explicitly states that moral arguments *are necessary* but *not sufficient*. In *Experiments in Ethics* and *The Honor Code*, he argues that arguments help frame issues, mobilize sentiment, and provide the *language* for justifying change once social pressures build. They are catalysts and articulators within the process, not irrelevant window dressing.
  2.  **Williams on Slavery - Oversimplification:** While Williams emphasizes the enabling role of economic shifts and national embarrassment, he does *not* reduce abolition purely to economics or embarrassment. He acknowledges the genuine moral convictions of abolitionists and the power of their arguments *in that specific historical moment*. His point is that the *conditions* made those arguments *persuasive* and *actionable* in a way they might not have been earlier. He wouldn't say economic factors were the *sole* driver, but rather that they created the fertile ground for moral arguments to take root and succeed politically. Attributing the *entire* cause to economics/embarrassment is a common oversimplification of the "Williams line."
  3.  **Conflating Williams & Appiah:** While their critiques overlap significantly, they aren't identical.
      *   **Williams' Focus:** More on the *philosophical* critique of moral theory's aspirations (especially Kantianism and Utilitarianism), the role of "thick" ethical concepts, and the complex historical entanglement of reason, psychology (especially shame), and social forms. He's skeptical about "the morality system."
      *   **Appiah's Focus:** More empirically historical and sociological. He uses case studies (dueling, foot-binding, slavery) to demonstrate the mechanism of "moral revolutions" driven by shifts in *honor* – changes in what causes shame and confers respect within evolving social landscapes. His "honor-worlds" framework provides a specific sociological tool Williams didn't develop in the same way.
  4.  **The Role of "The Elite":** While both acknowledge the importance of powerful groups (slave-owning classes, aristocrats), their analysis isn't *solely* about manipulating elite self-interest. Appiah, for example, discusses how shifts often involve *changing who constitutes the relevant audience* for honor (e.g., middle class influence on aristocrats). Changes can also bubble up or involve complex interactions between groups. The focus is on shifts in the *social ecology of respect and shame*, not just elite interests.

  **What's Wrong / The Problematic Conclusion:**

  1.  **"Moral Philosophy is Basically Useless":** This **does not follow** from Williams or Appiah. It's a significant misreading.
      *   Both see moral arguments as *integral components* within the complex process of change. They are necessary for articulation, justification, mobilization, and providing the new normative framework. Appiah explicitly says revolutions need "honor *and* arguments." Williams sees philosophy as part of the reflective process of ethical life.
      *   The conclusion ignores that changing "honor codes" often *requires* challenging arguments. Arguments help *reshape* what is seen as honourable or shameful. Critiques of slavery *contributed* to making it embarrassing. Arguments against dueling *helped* the middle class see it as barbaric, which then pressured the aristocracy. The process is dialectical, not sequential (interests shift -> then arguments work).
  2.  **Pure Instrumentalism:** The conclusion reduces moral change to purely instrumental manipulation of elite self-interest ("shifting honour codes and material interests"). This ignores the genuine role of moral conviction, empathy, and reasoned critique in motivating activists and shaping public opinion, which then *creates* the social pressure (embarrassment, loss of status) that forces change. Williams and Appiah complicate the picture, but they don't eliminate morality from moral change.

  **In Summary:**

  *   **Accurate:** Critique of rationalism-only models; Emphasis on honor, shame, interest, social context (Appiah's dueling example is strong); Williams links abolition's success to context (economics/embarrassment *enabling* arguments); Appiah's honor/dignity distinction highlights contextual shifts.
  *   **Distorted/Oversimplified:** Painting Williams' slavery argument as *purely* economic/embarrassment-driven (it's more nuanced); Claiming arguments are "useless" or "window dressing" (they are contingent but vital); Suggesting Williams and Appiah are identical (similar critiques, different emphases/tools).
  *   **Wrong Conclusion:** "Moral philosophy is basically useless." This is a profound misreading. Both thinkers argue moral arguments are *necessary but not sufficient*, embedded within and interacting with social, psychological, and historical forces. Appiah explicitly argues for "honor *and* arguments." Williams sees philosophy as part of the reflective fabric of ethical life. Dismissing argumentation entirely ignores how it actively participates in shifting the very honor codes and sensibilities your friend says are key.

  **Your instinct is correct:** Your friend's summary captures a provocative and important kernel of their thought but pushes it to an unwarranted, overly cynical extreme that neither Williams nor Appiah would endorse. Moral philosophy isn't rendered pointless; its role is reconceived as deeply intertwined with history, psychology, and social practice, rather than operating as a pure, context-independent force of reason. Effective moral change likely requires both the "honor shift" *and* the persuasive arguments that help define what honor means in a changing world.
