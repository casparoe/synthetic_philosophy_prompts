  I'm writing a near-future novel about a grifter who builds an empire out of AI people — fake romantic partners, fake customer-service empathy, fake whistleblowers, a fake priest whose pastoral advice is better than the real one's. A friend keeps emailing me Dennett's whole counterfeit-people worry: not just deepfakes as forgeries, but the idea that once artificial agents can pass for human in low-stakes, intimate settings, the social technology of trust rots, because you can no longer assume there's a person behind a person-shaped performance. My gut says there's maybe a 15% chance we get the civilization-scale version of that by 2040 — by which I mean trust in ordinary person-to-person dealings degrades enough to change how big institutions like courts, markets, media, and elections work, not just a pile of individual scams. My friend's at more like 65%.

  I want your actual number, but more importantly the decomposition. The moving parts I can see: (a) whether the tech gets good enough to fool most people in the interactions that actually carry trust, (b) whether it gets deployed maliciously at scale rather than staying a creepy nuisance, (c) whether the social damage is big even when most fakes eventually get spotted, and (d) whether regulation or social adaptation — verification norms, watermarking, reputation institutions — blunts it enough. Give me your rough probability for each, how you combine them, which term your final number is most sensitive to, and which one your least confident about. Then tell me which of these my friend and I probably actually disagree about, and the one piece of evidence in the next five years that would move your number the most, including the direction.
