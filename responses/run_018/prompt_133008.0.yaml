prompt: |-
  I am trying to name a specific social-epistemic pattern I keep encountering in discussions of high-stakes, long-horizon decision-making, and I want to know whether it already has a precise term or whether I am describing a genuinely distinct configuration. The pattern works as follows. A community confronts a choice between a secure, moderate benefit available now and a speculative outcome of enormous magnitude—perhaps averting a distant catastrophic risk—with a very low assigned probability. Members do not merely disagree about the probabilities; they treat the expected-value comparison itself as a test of rational membership. Those who favor the moderate path are accused not just of risk aversion but of a kind of cognitive or moral failure, such as neglecting remote probabilities or failing to weight outcomes by scope, while those who favor the speculative path are accused of expected-value fanaticism. Crucially, the probability estimate is endogenous: the more social and institutional capital is directed toward the speculative outcome, the more credible the pathways to achieving it appear, which in turn justifies diverting more capital. At the same time, this diversion undermines the stable institutional conditions that originally made the high-value outcome plausible. The result is a self-referential loop in which commitment to the extreme expected-value calculation is enforced as common knowledge of rationality—defection is interpreted not as reasonable disagreement but as irrationality—yet the collective commitment is structurally self-undermining. I am familiar with the literature on expected-value fanaticism, with collective action problems, and with the idea that rationality can become common knowledge in strategic settings. What I am after is the specific name, if one exists, for this combination: an expected-value comparison that is simultaneously enforced through social epistemology as a marker of rational membership, endogenous to the collective choice it governs, and self-undermining in its institutional prerequisites. If no established term captures exactly this triad, I would like a clear delineation of which adjacent concepts come closest—such as moral fanaticism, self-defeating prophecies, or particular forms of epistemic game theory—and where the boundaries lie.
reasoning: |-
  Okay, the user is describing a really intricate social-epistemic pattern they've observed in high-stakes decision-making contexts. They're clearly deeply familiar with rational choice theory and philosophy, given how precisely they've articulated this phenomenon. 

  Hmm, let me unpack what they're seeing: It's about groups facing choices between safe-but-modest options versus long-shot/huge-payoff alternatives. But the fascinating twist is how the probability assessment isn't static - it becomes entangled with the group's commitment to the risky path itself. The more resources they throw at the moonshot, the more plausible it seems, which then justifies more investment... while quietly eroding the very foundations that made the moonshot conceivable in the first place. 

  What's especially clever is their observation about "common knowledge of rationality" being weaponized - dissent gets framed as irrationality rather than legitimate disagreement. That social enforcement mechanism is crucial here. 

  I'm mentally scanning related concepts: Expected value fanaticism is adjacent but misses the feedback loops. Collective action problems don't capture the epistemic dimension. Reflexivity à la Soros comes close but isn't about rationality tests. Ah! The self-undermining prophecy idea from organizational theory might be the closest fit, though it usually lacks the EV calculus aspect. 

  The user seems slightly frustrated that existing terms don't quite capture this triple helix of (1) EV-as-rationality-test, (2) endogeneity, and (3) institutional erosion. They'd probably appreciate me clearly mapping why adjacent concepts fall short while acknowledging the novelty of their formulation. 

  Noticing they use very precise language - "endogenous probability", "common knowledge", "structural self-undermining" - suggests they'll want equally rigorous treatment. Probably an academic or policy researcher working on existential risk or climate strategy. The request for boundary-drawing tells me they're likely preparing literature review or theoretical framework. 

  *starts mentally drafting* For the coinage suggestion, "Endogenous EV Commitment Spiral" feels right because it hits all key elements: the self-reinforcing loop, the rationality-signaling, and how it consumes its own foundations. Should emphasize how this differs from mere groupthink by the mathematical rationality pretense. 

  ...Better also flag how this might manifest in real-world contexts like long-termist communities or decarbonization debates. The user didn't ask for examples, but showing applicability would demonstrate I fully grasp the mechanics.
answer: |-
  Based on your exceptionally precise description, this pattern appears to be a **novel synthesis** of established concepts, lacking a single established term capturing the full triad (*enforced EV-as-rationality-test + endogeneity + institutional self-undermining*). Here's a breakdown of adjacent concepts and why they fall short, followed by a proposed coinage:

  **Adjacent Concepts & Their Boundaries:**

  1.  **Expected Value Fanaticism:**
      *   **Focus:** Critique of extreme weighting of tiny probabilities + vast utilities in EV calculations, potentially leading to absurd conclusions.
      *   **Boundary:** Addresses the *calculation itself* and its philosophical problems, but lacks the *social enforcement mechanism*, the *endogeneity* of probability, and the *institutional self-undermining* dynamics. It's about the logic, not the social-epistemic feedback loop.

  2.  **Collective Action Problems / Commitment Problems:**
      *   **Focus:** Situations where individual rationality leads to collectively suboptimal outcomes (e.g., Prisoner's Dilemma, coordination failures, time inconsistency).
      *   **Boundary:** Captures the *structural incentive misalignment* and potential for suboptimal outcomes, but doesn't inherently include the *specific EV framing as a rationality test*, the *endogenous probability shift*, or the *epistemic enforcement* aspect. The "self-undermining" here is usually about incentives, not epistemic credibility prerequisites.

  3.  **Common Knowledge of Rationality (CKR) / Epistemic Game Theory:**
      *   **Focus:** How shared knowledge/beliefs about rationality shape strategic interactions and equilibrium selection.
      *   **Boundary:** Directly addresses the *enforcement of rationality norms as common knowledge* and the interpretation of defection as irrationality. However, it doesn't inherently model the *endogenous shift in probability estimates based on collective commitment*, nor the *institutional erosion* prerequisite. It's a framework for analyzing beliefs in games, not specifically this dynamic feedback loop.

  4.  **Reflexivity (Soros):**
      *   **Focus:** Feedback loops where participants' perceptions/beliefs influence the fundamentals they are about (e.g., financial markets).
      *   **Boundary:** Captures the *core endogeneity* and *feedback loop* (commitment -> perceived credibility). However, it lacks the *specificity of the EV calculation as the enforced rationality norm* and the *institutional self-undermining* aspect. Reflexivity is a broader concept.

  5.  **Self-Fulfilling / Self-Defeating Prophecies:**
      *   **Focus:** Beliefs causing actions that make the belief come true (self-fulfilling) or false (self-defeating).
      *   **Boundary:** The *endogenous probability* element is a form of self-fulfilling prophecy (belief in success makes success *seem* more probable). The institutional erosion is a form of self-*defeating* prophecy (pursuit undermines prerequisites). However, this misses the *enforced EV rationality test* and the specific *high-stakes, long-horizon EV comparison* structure. It's a mechanism within your pattern, not the whole.

  6.  **Moral Fanaticism / Zealotry:**
      *   **Focus:** Uncompromising pursuit of an absolute moral principle, often disregarding costs or probabilities.
      *   **Boundary:** Captures the *accusations of moral failure* and *social enforcement of commitment*, but misses the *rationality framing* (it's framed as moral, not primarily rational), the *endogenous EV calculation*, and the *structural self-undermining* based on institutional prerequisites. It's more about ideology than a specific epistemic pattern around probability/EV.

  7.  **Institutional Self-Destruction / Autoimmunity (e.g., Esposito):**
      *   **Focus:** When an institution's protective mechanisms paradoxically undermine its own foundations.
      *   **Boundary:** Directly addresses the *institutional erosion* aspect. However, it doesn't capture the *specific EV framing*, the *endogenous probability*, or the *enforcement of rationality norms*. It describes a consequence/mechanism, not the full epistemic-social dynamic.

  **The Gap & Proposed Coinage:**

  Your description uniquely combines:
  *   **A:** The EV calculation (especially involving tiny probabilities + vast utilities) as the **enforced marker of rational/membership**.
  *   **B:** **Endogeneity:** Collective commitment actively inflates the perceived probability of the speculative outcome.
  *   **C:** **Institutional Self-Undermining:** The diversion of resources erodes the very institutional stability that was a prerequisite for the speculative pathway's initial plausibility.

  **Proposed Term: Endogenous EV Commitment Spiral (EECS)**

  *   **Endogenous:** Highlights the core feedback loop where commitment shapes the perceived probability (B).
  *   **EV:** Specifies the type of calculation central to the rationality test and the stakes (A).
  *   **Commitment:** Emphasizes the social enforcement and the collective investment aspect (A).
  *   **Spiral:** Captures the self-reinforcing, potentially runaway nature of the loop (B) and its destructive consequence (C). The spiral implies both the amplification of perceived probability *and* the erosion of prerequisites.

  **Why EECS Fits:**

  1.  **Specificity:** Directly names the core components (EV, Endogeneity, Commitment, Spiral).
  2.  **Process-Oriented:** Emphasizes the dynamic, self-reinforcing nature.
  3.  **Captures the Triad:**
      *   *Enforced Rationality Test:* Implied by "Commitment" and the context of enforcing EV calculation.
      *   *Endogeneity:* Explicit in the term.
      *   *Self-Undermining:* The "Spiral" inherently suggests a path leading to instability/collapse, explicitly linked here to the prerequisites.
  4.  **Distinguishes from Adjacent Concepts:**
      *   Contrasts with passive "fanaticism" by emphasizing the *active, self-reinforcing commitment*.
      *   Contrasts with general "reflexivity" by specifying the *EV framing* and *institutional erosion*.
      *   Contrasts with "self-defeating prophecy" by embedding it within the *specific EV rationality enforcement context*.

  **In essence:** You've identified a distinct **social-epistemic trap** where the collective enforcement of a specific rational norm (extreme EV weighting) creates a feedback loop that both inflates the apparent justification for that norm *and* destroys the foundational conditions that made its object seem plausible in the first place, all while pathologizing dissent. **Endogenous EV Commitment Spiral (EECS)** accurately captures this complex, self-consuming dynamic. This appears to be a genuinely novel and valuable conceptualization for analyzing high-stakes, long-term decision pathologies.
