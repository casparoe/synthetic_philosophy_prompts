prompt: |-
  I'm on my school's student council and we're the ones who get pitched every new piece of tech before it goes to the admin: hallway cameras with "AI" that detects fights, an app where you scan a QR code to use the bathroom, locked phone pouches, a cafeteria payment system that also flags kids with low balances. We have to give a reccomendation each time, usually after like 20 minutes of discussion, and half the commitee just says "if it makes things safer or faster, why not." I've been reading about how technology can have politics built into it — like the famous story that some parkway bridges were built too low for buses, which quietly kept poor people off the beach without any sign saying so. I want a procedure we can actually run in 20 minutes to figure out when a proposal is doing that: baking in a decision that should be argued about in public instead of hidden in a spec sheet. Questions in order, what counts as a good enough answer for each, where the procedure stops with a No, and where we have to admit it's a values call and kick it to the whole council. Then run it on the hallway cameras, the bathroom QR app, and the cafeteria payment thing (fair warning: we mostly like the cafeteria one), and make sure at least one of those comes out as a No even though we'd personally want to vote yes. Also say where the procedure can't tell the difference between real built-in politics and us just being paranoid.
reasoning: |-
  We are designing a procedure to evaluate technology proposals for hidden politics or biases. The goal is to expose when a technology is making a decision that should be publicly debated, rather than being accepted as a neutral technical solution.

   The procedure should be runnable in about 20 minutes and result in one of three outcomes:
   1. "No": The proposal has a built-in political decision that is unacceptable and should be rejected.
   2. "Kick to whole council": The proposal involves a values call that requires broader discussion and input.
   3. "Yes": The proposal passes the test (but note: we are not necessarily endorsing the technology, just that it doesn't have the hidden politics we're looking for).

   Steps and Questions:

   We'll break it down into a series of questions. Each question must be answered with a clear "Yes" or "No", and we'll specify what counts as a good enough answer to move to the next step, and where we stop with a "No" or a "Kick".

   Procedure:

   Step 1: Identify the stated goal
     Question 1: Is the problem this technology aims to solve clearly stated and agreed upon as a problem?
        - Good enough: The problem is stated and we can all agree that it is a problem worth solving. If not, we stop and kick to the whole council because we need agreement on the problem.
        - If the problem is not clearly stated or we don't agree it's a problem, then we kick to the whole council.

   Step 2: Check for direct harm
     Question 2: Does the technology cause direct physical or psychological harm to any group of students?
        - Good enough: We can agree that there is no evidence or reason to believe it causes direct harm. If we find clear evidence of direct harm, we stop and say "No".
        - If we are unsure or there is disagreement about potential harm, we kick to the whole council.

   Step 3: Check for built-in bias or exclusion
     Question 3: Does the technology treat all students equally, regardless of their race, gender, socioeconomic status, disability, or other protected characteristics? (We must consider both intentional and unintentional effects.)
        - Good enough: We can see that the design does not disadvantage any group. If we find it clearly disadvantages a group, we stop and say "No".
        - If we are unsure or there is a potential for disparate impact that we cannot resolve, we kick to the whole council.

   Step 4: Assess transparency and accountability
     Question 4: Is the decision-making process of the technology transparent and accountable? (i.e., can we understand why it made a decision, and can we appeal if it's wrong?)
        - Good enough: The technology either does not make decisions that affect students (so no need for transparency) or it provides a clear way to understand and challenge decisions. If it makes decisions and there is no transparency or appeal, we stop and say "No".
        - If we are unsure about the transparency or accountability mechanisms, we kick to the whole council.

   Step 5: Evaluate hidden politics
     Question 5: Does the technology embed a political or moral decision that should be made by the school community through open discussion?
        - This is the core of our concern. We are looking for decisions that are being made by the technology (or by the designers) that should be made by the community.
        - Examples: 
            - Deciding that safety is more important than privacy without discussion.
            - Deciding that convenience for the majority is more important than accessibility for a minority.
            - Implementing a system that enforces a rule that hasn't been agreed upon by the community (e.g., limiting bathroom breaks to a certain number per day).
        - Good enough: We can see that the technology does not make such a hidden decision. If it does, we stop and say "No".
        - If we are unsure or there is disagreement about whether a hidden decision is being made, we kick to the whole council.

   If we get through all 5 questions without a "No" and without kicking, then we can say "Yes" (meaning it passes this test).

   Now, let's test the procedure on the three examples:

   Example 1: Hallway cameras with "AI" that detects fights.

   Step 1: Stated goal: To detect fights quickly and improve safety? 
     - We can agree that safety is a problem worth solving? Probably yes. So move on.

   Step 2: Direct harm? 
     - The cameras themselves don't cause physical harm, but could there be psychological harm? Constant surveillance might create a prison-like environment. 
     - However, we are not sure if this rises to the level of direct harm. We might kick to the whole council? 
     - But let's assume we are unsure about psychological harm -> kick? 
     - However, the procedure says: if we are unsure, we kick. So we might kick at Step 2.

     But let's try to be more specific. We might argue that there's no evidence of direct harm from the cameras per se, so we move on? 
     Alternatively, we might note that there is research on the negative effects of surveillance on mental health. 
     Since we are not experts, if we have concerns we should kick. But for the sake of the example, let's say we move on because the harm is not direct and immediate? 

     Alternatively, we might consider: if a student is misidentified as fighting and punished, that could cause psychological harm. But that's indirect and through the system. So we might move to Step 3.

   Step 3: Bias? 
     - There is evidence that some AI systems have racial bias in detecting violence. If the system is more likely to flag black students, that's a problem. 
     - We don't know if this system has that bias. The vendor says it doesn't, but we haven't tested it. 
     - Since we cannot verify that it treats all equally, we might kick to the whole council? 
     - But the question is: does it treat all equally? We don't know -> kick? 

   Step 4: Transparency and accountability? 
     - How does the AI work? We don't know. If it flags a fight, what evidence is provided? Can we appeal? 
     - If the system is a black box and there's no appeal process, then we should say "No". 
