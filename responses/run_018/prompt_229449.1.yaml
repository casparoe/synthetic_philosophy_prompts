answer: |-
  Here's a streamlined 20-minute evaluation procedure designed to uncover hidden political decisions in school tech proposals, with clear stopping points. The framework focuses on four sequential questions, escalating in complexity:

  ### **Evaluation Procedure: "Unmasking Hidden Politics in Tech"**
  **(Run each question in 4-5 minutes max)**

  1. **QUESTION 1: WHO BEARS THE COST?**  
     *"Does this technology disproportionately burden a specific group (e.g., by time, privacy, dignity, access) to solve a problem that affects everyone?"*  
     - **Good Enough Answer:** Concrete evidence of *unavoidable* inequity (e.g., "Students without smartphones can't use the QR bathrooms").  
     - **Stop with "No" if:** The cost falls on marginalized groups (e.g., low-income, disabled, minority students).  
     - **Kick to Council if:** Burdens are hypothetical or mitigable (e.g., "Maybe kids will feel observed, but we’re not sure").

  2. **QUESTION 2: WHAT VALUES ARE HARD-CODED?**  
     *"Does this tech prioritize one societal value (e.g., security, efficiency) while suppressing alternatives (e.g., privacy, autonomy, compassion) without debate?"*  
     - **Good Enough Answer:** Identifies a *trade-off* that hasn’t been acknowledged (e.g., "This assumes safety > all privacy, period").  
     - **Stop with "No" if:** It enforces a controversial value judgment as non-negotiable (e.g., "Efficiency justifies public shaming").  
     - **Kick to Council if:** The trade-off is debatable but not inherently oppressive (e.g., "Is tracking bathroom breaks really undermining autonomy?").

  3. **QUESTION 3: WHO LOSES AGENCY?**  
     *"Does this technology remove human discretion in situations requiring nuance (e.g., punishment, resource access)?"*  
     - **Good Enough Answer:** Shows where *algorithmic*/**automated** decisions replace human judgment.  
     - **Stop with "No" if:** It automates high-stakes decisions (e.g., "AI flags 'fights' without teacher review").  
     - **Kick to Council if:** Humans retain oversight (e.g., "Cashiers see low-balance alerts but decide how to respond").

  4. **QUESTION 4: IS ACCOUNTABILITY OBSCURED?**  
     *"Does this tech make it harder to identify, challenge, or appeal decisions affecting students?"*  
     - **Good Enough Answer:** Points to *opaque* processes (e.g., "No way to contest AI fight detection").  
     - **Stop with "No" if:** It hides decision-makers or evidence (e.g., "Vendor won’t share how the AI works").  
     - **Kick to Council if:** Transparency exists but isn’t ideal (e.g., "Appeals go to VP, but process is slow").

  **Final Outcome:**  
  - **"No"** if stopped at any question.  
  - **"Kick to Council"** if any answer is ambiguous or requires values debate.  
  - **"Yes"** only if all answers are unambiguous and acceptable.

  ---

  ### **Test Runs on Your Examples**
  **Goal:** One must return **"No"** even if liked.

  #### **1. Hallway Cameras with "Fight-Detecting AI"**
  - **Q1 (Cost):** Burdens *all* students’ privacy for "safety." Marginalized groups (e.g., students of color) face higher false-positive risks. **→ Stop with "NO"** (Cost to privacy/equity).  
  - *Why "No"?* Hard-codes surveillance as non-negotiable and risks discriminatory enforcement without debate.  

  #### **2. Bathroom QR Code App**  
  - **Q1 (Cost):** Burdens students without phones (low-income), those with disabilities (motor/visual impairments), or urgent needs (broken phone). **→ Stop with "NO"** (Excludes vulnerable groups).  
  - *Why "No"?* Turns bathroom access into a tech-privilege issue. If the school claims "loaner tablets," it still kicks to council (Q1: "Is this burden acceptable?").  

  #### **3. Cafeteria Payment System w/ Low-Balance Flags**  
  - **Q1 (Cost):** Flags burden low-income students (embarrassment/stigma). *But you like it* – assume discreet notifications. **→ Proceed**.  
  - **Q2 (Values):** Prioritizes efficiency (+ helping!) over dignity. Trade-off: "Shame vs. hunger relief." **→ Kick to Council** (Values debate: Is this the *best* way to help?).  
  - **Q3 (Agency):** Humans (cashiers) can intervene kindly. **→ Proceed**.  
  - **Q4 (Accountability):** Balance data is visible/auditable. **→ "Yes"** but with Q2 kick.  
  - **Outcome:** **Kick to Council** for values debate. *Not a "No," but forces discussion of hidden politics*.

  ---

  ### **Where the Procedure Can't Distinguish Politics from Paranoia**
  - **False Positives:** Over-identifying "bias" where none exists (e.g., "QR codes are elitist!" when school provides free loaner devices).  
    *Mitigation:* Require evidence of *unavoidable* harm (Q1).  
  - **Trade-off Legitimacy:** Not all trade-offs are oppressive (e.g., "Requiring ID for library books burdens those who forget them, but isn’t systemic oppression").  
    *Mitigation:* Escalate only if the suppressed value (e.g., privacy, dignity) is fundamental.  
  - **Unforeseen Consequences:** Tech might have hidden politics only revealed in practice (e.g., "AI fight-detectors flag play-fighting as violent").  
    *Mitigation:* Pilot programs with sunset clauses.

  ### **Why This Works in 20 Minutes**
  - Focuses on **observable, immediate red flags** (not hypotheticals).  
  - Uses **concrete examples** from the proposal (e.g., "How does a student without a phone use the bathroom?").  
  - **Escalates ambiguity** instead of stalling on it.

  By design, this flags tech that enforces **unexamined hierarchies** (rich/poor, abled/disabled) or **unilateral value judgments** (security > privacy). The cafeteria system passes until Q2 because its "help" masks a political choice: *Should we automate poverty visibility?* That’s a council-wide debate.
