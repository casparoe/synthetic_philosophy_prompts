  What's glueing the sides together? For the left, he'd spot shared narratives about oppression and liberation; for the right, shared fears about cultural erosion. But crucially, he'd see both sides as paradoxically similar in their abandonment of Burkean gradualism - instant solutions! Total victories! His deepest criticism might be that neither side truly respects society as an organic whole anymore.

