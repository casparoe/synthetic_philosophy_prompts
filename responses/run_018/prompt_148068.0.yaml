prompt: |-
  After a lengthy debate with a colleague about distributive justice, I find myself unable to reconcile my own judgments about several societies I might enter behind a veil of ignorance. I want to know whether there is a single principle that captures all of them, or whether I must abandon one.

  Consider these five institutional arrangements, evaluated without knowing which position I will occupy.

  First, society Alpha maintains perfect equality of income and social status, but because incentives for productivity are absent, the worst-off live at bare subsistence with minimal healthcare and education. I judge this unacceptable.

  Second, society Beta permits large income disparities—some earn fifty times what others earn—but only if those disparities arise from differences in productive contribution and effort, and the worst-off enjoy substantially greater absolute resources (excellent healthcare, education, leisure) than in Alpha. I judge this acceptable, indeed preferable to Alpha.

  Third, society Gamma has the exact same absolute condition for the worst-off as Beta, and the same income ratios, but the disparities are inherited: capital and professional credentials pass almost entirely within families, and intergenerational mobility is near zero. Despite the identical bottom-line welfare, I find Gamma unacceptable in a way Beta is not.

  Fourth, society Delta enforces near-complete equality in daily consumption, but allows a small group of risk-takers in medical and environmental research to accumulate vast rewards, provided that 100 percent of those rewards are taxed away and converted into universal public goods that disproportionately benefit the worst-off. The worst-off are slightly better off than in Beta. I judge Delta acceptable.

  Fifth, society Epsilon mirrors Delta's structure—same tax rate, same worst-off welfare—but the rewards flow not from research outcomes but from zero-sum financial speculation that produces no social benefit. The worst-off are no worse off than in Delta, yet I feel Epsilon should be rejected, though I struggle to say exactly why without smuggling in a judgment about desert or naturalness that I claim to have bracketed behind the veil.

  So my pattern is: reject Alpha, accept Beta, reject Gamma despite matching Beta's bottom line, accept Delta, and reject Epsilon despite matching Delta's bottom line. Is there one principle—perhaps a refined difference principle with an added constraint about the source or legitimacy of inequalities, or perhaps a prioritarian rule with a side-condition about mobility and social meaning—that delivers all five verdicts? If not, which verdict should I overturn, and what does the cleaner principle predict for a case I have not listed: a society where the worst-off are maximally well-off, but only because an unaccountable algorithm assigns every individual to a social role at birth, with no possibility of appeal?

  Please state the principle precisely, identify which of my judgments it cannot accommodate, and explain what it predicts for the algorithmic-assignment society.
reasoning: |-
  Hmm, this user presents a fascinating puzzle about distributive justice through five thought experiments. They're clearly deeply engaged with Rawlsian theory but hitting conceptual limits with their intuitive judgments about Gamma and Epsilon. The core tension lies in reconciling outcome-focused welfare metrics with procedural concerns about how inequalities arise.

  Interesting how their rejection of Gamma reveals an unspoken commitment to equality of opportunity - even when absolute welfare matches Beta, the hereditary nature of advantages feels morally corrosive. And with Epsilon, they're instinctively rejecting rent-seeking despite identical outcomes to productive Delta. This suggests their moral intuition contains at least three dimensions: absolute welfare levels, social mobility potential, and productive contribution.

  The algorithmic society case is particularly thorny. If we strictly followed maximin, it should be acceptable since the worst-off are maximized. But the complete lack of agency would violate most people's sense of dignity. This exposes a limitation in purely outcome-oriented frameworks - they can't capture the moral weight of self-determination.

  Notably, the user has already eliminated desert-based arguments by bracketing personal merit behind the veil. So any solution must avoid smuggling in desert through backdoors like "social value of labor." Their struggle with Epsilon shows how difficult this is - even when trying to be strictly consequentialist, we instinctively want to reward socially beneficial activities.

  For the algorithmic society, I suspect even if welfare metrics are perfect, the absence of choice would violate the spirit of Rawls' original position. The participants would presumably reject being permanently assigned roles by an algorithm, however optimal, because it negates their moral agency. This points toward needing some version of "freedom as non-domination" in the framework.
answer: |-
  Based on your judgments, the principle that best captures your pattern is a **Hybrid Maximin Principle with Procedural Fairness Constraints**:

  > *"Social and economic inequalities are permissible only if:*  
  > *(a) They maximize the absolute position of the least advantaged group (Maximin), AND*  
  > *(b) They arise from processes that are:*  
  > *--- (i) Open to all under conditions of fair equality of opportunity (non-hereditary), AND*  
  > *--- (ii) Productively necessary for generating the surplus that benefits the least advantaged."*

  ### Analysis of Your Cases:
  1. **Alpha (Rejected):**  
     - Fails (a): Does not maximize the worst-off position (subsistence level).  
     - **Principle verdict: REJECT** ✔️

  2. **Beta (Accepted):**  
     - Satisfies (a): Worst-off have excellent resources.  
     - Satisfies (b)(i): Inequalities from effort/contribution (open process).  
     - Satisfies (b)(ii): Inequalities drive productivity that lifts the worst-off.  
     - **Principle verdict: ACCEPT** ✔️

  3. **Gamma (Rejected):**  
     - Satisfies (a): Worst-off same as Beta.  
     - **Fails (b)(i):** Inequalities are hereditary (no fair opportunity).  
     - **Fails (b)(ii):** Advantages aren't earned through productive contribution.  
     - **Principle verdict: REJECT** ✔️

  4. **Delta (Accepted):**  
     - Satisfies (a): Worst-off slightly better than Beta.  
     - Satisfies (b)(i): High-risk roles are open (anyone could choose research).  
     - Satisfies (b)(ii): Rewards tied to socially productive innovation (medical/environmental).  
     - **Principle verdict: ACCEPT** ✔️

  5. **Epsilon (Rejected):**  
     - Satisfies (a): Worst-off same as Delta.  
     - Satisfies (b)(i): Roles are open (anyone could speculate).  
     - **Fails (b)(ii):** Rewards from zero-sum speculation produce no social surplus. The benefits to the worst-off are funded by redistribution, but the inequality itself lacks productive necessity.  
     - **Principle verdict: REJECT** ✔️

  ### Why This Works:
  - **Condition (a)** explains rejection of Alpha and acceptance of Beta/Delta.  
  - **Condition (b)(i)** explains rejection of Gamma despite identical outcomes to Beta.  
  - **Condition (b)(ii)** explains rejection of Epsilon despite identical outcomes to Delta. It avoids "desert" by focusing on *systemic productive function*: inequalities must be necessary to generate the surplus that improves the worst-off position. Epsilon’s speculation creates no net surplus—it merely redistributes existing wealth.

  ### The Algorithmic Society Case:
  - **Setup:** Worst-off maximized, but roles assigned at birth by unaccountable algorithm with no choice or appeal.  
  - **Principle verdict: REJECT**  
    - Satisfies (a): Worst-off are maximally well-off.  
    - **Fails (b)(i):** No fair equality of opportunity (assignment is fixed at birth, no mobility or choice).  
    - **Fails (b)(ii):** The inequality (in roles/status) isn’t justified by productive necessity; it’s an arbitrary constraint. An open system could likely achieve similar welfare with agency intact.

  ### Which Judgment Must Be Overturned?
  This principle accommodates **all five** of your judgments without contradiction. If forced to abandon one:  
  - **Overturning Gamma's rejection** would be the least consistent with your other views, as you strongly distinguish Beta from Gamma despite identical outcomes. Your intuition about hereditary privilege is central.  
  - **Never abandon Epsilon's rejection**—it highlights your core insight that the *source* of inequality matters.

  ### Key Insight:
  Your principle prioritizes outcomes for the worst-off *while requiring* that inequalities serve a socially productive purpose and emerge from a fair process. It synthesizes Rawls (maximin + fair opportunity) with a pragmatic focus on wealth creation (rejecting rent-seeking). This avoids "desert" by judging institutions, not individuals: Epsilon’s flaw is that its inequality-generating activity (speculation) is *institutionally parasitic*, not that speculators are "undeserving."
