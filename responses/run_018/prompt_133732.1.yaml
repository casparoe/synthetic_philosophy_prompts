prompt: |-
  You are a professional philosopher and historian of ideas with deep expertise in Enlightenment political thought. Before writing, take a few minutes to brainstorm: outline the central arguments of Rousseau's Letter to d'Alembert on the Theatre, his endorsement of public civic festivals, his broader critique of representation in the Discourse on the Origin of Inequality and The Social Contract, and the conceptual distinction between passive spectatorial identification and structural representative substitution. Once you have mapped these elements, write a polished, formal essay addressing the following controversy.

  Rousseau's Letter to d'Alembert on the Theatre condemns theatrical spectacle in Geneva on the grounds that it corrupts republican virtue. The core worry is that theatre substitutes mediated, fictional representation for direct civic presence: citizens become passive spectators who emotionally fuse with performed characters rather than actively participating in collective self-rule. Yet Rousseau also champions public festivals—collective, participatory celebrations—as essential to republican health. Critics charge that this is incoherent: festivals also involve scripted roles, symbolic performance, and collective affect, so they seem to involve the same representational mediation that Rousseau rejects in the theatre.

  Your task is to weigh whether Rousseau can consistently defend a sharp normative boundary between corrupting theatrical spectacle and salutary civic festival. Focus especially on whether the distinction between spectatorial identification (the audience's vicarious emotional fusion with fictional personages) and representative substitution (the structural replacement of direct civic action by mediated images) is conceptually robust. Examine whether this distinction holds up given Rousseau's broader suspicion of representation in political life, or whether it collapses under scrutiny—revealing that even civic festivals depend on symbolic mediation, role-playing, and collective projection that Rousseau otherwise condemns.

  Reach and justify a definite conclusion: either Rousseau's boundary is philosophically coherent and reveals a genuine theory of non-representational politics, or the distinction fails and exposes an unresolved tension in his thought between the demand for transparent immediacy and the inevitability of symbolic mediation in collective existence. Build your argument through close conceptual analysis; do not rely on biographical speculation, and do not provide bibliographies, citations, or reading lists. Paraphrase Rousseau's positions in your own analytical language rather than using verbatim quotations from his texts.
