answer: |-
  ### Bottom Line  
  Your performative reading of Carroll's paradox faces the strongest threat from **formal systems that dissolve the performative/propositional distinction**, as they directly undermine the core claim that justification *must* be irreducibly enacted. Defenders would dismiss "rules as premises" cases as misreadings and treat learning/empirical evidence as irrelevant to normative justification. The view risks unfalsifiability if all counterexamples are re-interpreted as "hidden performativity," weakening its force as a diagnosis of justification.

  ---

  ### Ranked Defeaters (Most to Least Decisive)  
  1. **Formal dissolution of the distinction** (e.g., systems where inference rules are fully internalized as premises *without regress*).  
     - *Example*: Proof-theoretic frameworks like **sequent calculus** or **normalization in natural deduction** that reduce rule-application to mechanical, premise-like manipulations. If rules operate as inert syntactic objects (e.g., via **explicit substitution**), the "enactment" collapses into propositional syntax.  
     - *Why decisive?* Directly refutes irreducibility. Defenders might counter that such systems presuppose meta-rules (e.g., how to apply substitutions), but if the system is closed under self-verification (e.g., **cut-elimination proofs**), this rejoinder weakens.  

  2. **Conceptual cases where rules function transparently as premises** (e.g., in **reflexive logics** or **axiomatized metatheories**).  
     - *Example*: Treating modus ponens as an axiom schema within the object language (e.g., **Łukasiewicz’s axiom**: ⊢ [(p → q) → p] → p). Here, rule-acceptance *is* propositional assent.  
     - *Why less decisive?* Defenders dismiss this as missing Carroll’s point: the Tortoise would demand justification for *using* the axiom. But if the system is consistent under self-application, the regress halts.  

  3. **Proofs that modern systems break the regress** (e.g., **canonicity in type theory**).  
     - *Example*: In **Martin-Löf type theory**, computation rules (e.g., β-reduction) are constitutive of meaning; their correctness is verified by **syntactic checks** (e.g., normalization). No "commitment" beyond syntax is needed.  
     - *Defender response*: This buries performativity in the acceptance of computation (e.g., "Why trust normalization?"). Conceded as non-damaging if the regress reappears meta-linguistically.  

  4. **Cognitive/historical evidence for explicit assent**.  
     - *Example*: Studies showing deduction is learned via instruction (e.g., **explicit rule-teaching in logic pedagogy**) or historical cases like **Euclid’s axiomatic method** treating rules as premises.  
     - *Why weakest?* Defenders deem this irrelevant: Carroll targets *normative justification*, not psychology or pedagogy. Performative commitment underpins *why* explicit assent suffices.  

  ---

  ### Unfalsifiability Risk  
  If all formal/cognitive counterexamples are reinterpreted as "covert performativity," the thesis becomes insulated. This *is* a problem: a thesis about justification must clarify what would count as non-performative validity. Without this, it risks vacuity—asserting that "all reasoning is performative" by definition.
