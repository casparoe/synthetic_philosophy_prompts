  Notable omission: No ask about practical applications. Probably intentional since the dilemmas are abstract. Stick to theoretical tight spots.
answer: |-
  Here are eight targeted questions drilling into the hybrid view, designed to force clarification and expose tensions—complete with follow-ups anticipating common dodges. Keep your tone curious but persistent:

  1. **Core Tension with CDT:**  
     "You frame the 'no-mirror constraint' as stopping agents from modeling predictors who perfectly model *them*—which prevents self-fulfilling loops. But doesn’t this just functionally recreate Causal Decision Theory’s split between *your choice* and *the predictor’s action*, smuggling CDT’s metaphysics through the back door?"  
     *Likely Reply:* "No, because CDT ignores correlational evidence, while I preserve it *within* levels."  
     **Follow-Up:** "But if the no-mirror constraint *blocks* you from using evidence about your own decision to infer the predictor’s output (since that’d require modeling their model of you), how is this *not* CDT’s 'surgical intervention' in disguise? Aren’t you *selectively* ignoring evidence to avoid paradox?"

  2. **Luring Lottery Breakdown:**  
     "In the Luring Lottery, you claim predictors modeling reasoning up to level 4 (but not 5) avoid incoherence. What *specifically* breaks at level 5 that doesn’t break at level 4? Is it a contradiction in the predictor’s model, or a failure of agent rationality?"  
     *Likely Reply:* "At level 5, the agent’s model of the predictor would require the predictor to model the agent modeling the predictor... [recursion spiral]."  
     **Follow-Up:** "But if the predictor *can* handle level-4 agent-reasoning without crashing, why can’t they handle level 5 by *truncating* or approximating? Doesn’t capping at level 3 feel arbitrary if level 4 works fine?"

  3. **Prisoner’s Dilemma Coordination Test:**  
     "If indexed evidentialism allows agents to coordinate in Platonia, why wouldn’t it force cooperation in a one-shot Prisoner’s Dilemma? After all, your evidence about the other agent’s likely action *correlates* with yours—and defection doesn’t *cause* their defection. Yet defection strictly dominates!"  
     *Likely Reply:* "The no-mirror constraint applies: You can’t treat their decision as *evidence about your own*."  
     **Follow-Up:** "But if you’re *indexed* to the same reasoning framework (e.g., both rational evidentialists), why wouldn’t the correlation hold? If it doesn’t, how is Platonia different?"

  4. **Moral/Blame Implications:**  
     "Your view makes rational choice depend on whether outside predictors/modelers can *track your reasoning depth*. Does this imply that moral blame or praise hinges on how *legible* your cognitive process is to observers? Could two agents making identical choices have different blameworthiness if one’s reasoning is ‘opaque’ past level 3?"  
     *Likely Reply:* "No—blame applies to actions, not observers’ modeling capacity."  
     **Follow-Up:** "But if the *rational permissibility* of an action depends on whether a predictor can model you (per your cutoff), doesn’t that make normativity observer-relative? What’s ‘rational’ for you might be ‘irrational’ for someone with a more opaque mind."

  5. **Evidence Against the Cutoff:**  
     "You reject ‘it feels wrong’ as evidence against the 3-level cutoff. What *concrete scenario* could falsify it? If we built an AI that *succeeded* using level-4 recursion without paradox, would that refute you—or would you just say ‘that’s not *true* rationality’?"  
     *Likely Reply:* "An AI’s success might be computational, not normative."  
     **Follow-Up:** "If not empirical implementation, what *would* count as evidence? Is this cutoff analytically true? If so, why not level 2 or 7?"

  6. **Superrationality’s Limits:**  
     "When you say superrationality only holds ‘inside’ the 3-level cutoff, does that mean agents *outside* it (e.g., agents who *can* model level 4) *cannot cooperate* in dilemmas like Platonia? Are they doomed to mutual defection?"  
     *Likely Reply:* "They might cooperate via other mechanisms, but not via superrationality."  
     **Follow-Up:** "If superrationality is the *only* non-causal path to cooperation, and your cutoff excludes advanced agents, does this imply a tragic ‘rationality ceiling’ where smarter agents lose coordination abilities?"

  7. **Indexing & Real-World Predictors:**  
     "Indexed evidentialism requires agents to condition on predictors who share their ‘rationality index’. But real predictors (e.g., algorithms, humans) are imperfect. How much divergence in reasoning rules breaks the index—and how would agents *know*?"  
     *Likely Reply:* "We assume idealized predictors for the dilemma; realism isn’t the point."  
     **Follow-Up:** "But if the *constraint* is motivated by avoiding paradoxes in principle, shouldn’t it handle non-ideal cases? If I face a predictor I *suspect* uses level-4 reasoning, am I irrational for cooperating?"

  8. **Self-Prediction Paradox:**  
     "The no-mirror constraint bans modeling predictors who model you. But what about *self-prediction*? If I try to model my *own* future choice in a dilemma, does that violate ‘no-mirror’—and if not, why is that different?"  
     *Likely Reply:* "Self-prediction doesn’t involve a distinct predictor agent."  
     **Follow-Up:** "But if evidentialism allows self-fulfilling loops in *self*-prediction (e.g., ‘I’ll one-box because I’ll one-box’), why ban it for external predictors? Isn’t this inconsistency?"

  **Key Angles Covered:**  
  - Covert CDT revival → Forces distinction between evidence-blocking & causal splits.  
  - Recursion threshold → Tests the "breaking point" specificity.  
  - PD dominance paradox → Probes whether "coordination" is overextended.  
  - Moral opacity → Links epistemology to blame.  
  - Falsifiability → Demands non-circular criteria.  

  **Delivery Tip:** Frame these as "help me untangle" questions ("Maybe I'm thick, but...") to soften the edge while maintaining pressure. If he deflects, use the follow-up to say, "Right, but then doesn’t that imply [contradiction]?" — forcing engagement.
