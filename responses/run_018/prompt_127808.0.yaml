answer: |-
  ## Workshop Proposal: Digital Speech Acts – When Layered Performatives Break the Rules?  
  **Title:** "One Utterance, Five Jobs: Do Digital Speech Acts Bust Austin’s Framework?"  
  **Duration:** 3 Days  
  **Goal:** To explore whether automated institutional messages (TOS updates, AI bans, etc.) with layered performatives violate Austin’s felicity conditions *by design*, or if we just need a patch.  

  ### The Core Question  
  **"When a single automated institutional utterance (like a contract update or AI moderation notice) simultaneously performs multiple speech acts (e.g., notifying, binding, *and* disclaiming), does this inherent structural layering inherently violate Austin's felicity conditions, or can we adapt the framework to fit?"**  

  ### Why Standard Accounts Don't Cut It  
  Austin and Searle analyzed speech acts (promises, warnings, declarations) as relatively discrete, intentional, and occurring in contexts of shared understanding and human agency. Their "misfires" and "abuses" assume a *single* primary illocutionary point failing under specific conditions (e.g., insincerity, lack of authority).  

  *   **Digital Speech is Different:**  
      *   **Multi-Tasking Utterances:** Platform messages are *designed* to do several things at once: "This notice informs you of a binding policy change (command/declaration) while limiting our liability (disclaimer)."  
      *   **Systemic, Not Individual:** The "speaker" is an institution/algorithm, not a person with clear intention. The "hearer" is often a mass, passive user base.  
      *   **Structural Conflicts:** The layered acts *within one utterance* might *internally undermine each other* (e.g., a "binding" clause + a disclaimer negating responsibility). Is this an *inherent* abuse?  
      *   **Context Collapse:** Felicity conditions rely on shared context. Digital platforms create artificial, non-negotiable contexts where "acceptance" is assumed via continued use.  
      *   **Scale & Automation:** Conditions like "appropriate subsequent conduct" become impossible to track or enforce at scale.  

  **Austin/Searle treat misfires as *bugs*. In digital systems, these layered performatives with potential internal conflicts might be *features*.**  

  ### Method: Close Reading Against the Conditions  
  We'll work intensively with real-world examples:  

  1.  **Source Material:** Bring your own or use provided samples (e.g., Netflix TOS update emails, Instagram account suspension notices, automated banking alerts, AI-generated content moderation warnings).  
  2.  **Deconstruct Layers:** For each message, identify the distinct speech acts being attempted simultaneously (e.g., Assertion? Directive? Declaration? Commissive? Disclaimer?).  
  3.  **Austin's Felicity Conditions Test:** Apply Austin's core conditions (A.1-2: Procedure exists/accepted; B.1-2: Correctly executed/completed; Γ.1: Sincerity) to *each distinct layer* within the single utterance.  
      *   Where do the conditions hold for one layer but fail for another *within the same message*?  
      *   Does the *combination itself* create new failure modes? (e.g., a disclaimer Γ.1 (sincerity) failing because it hollows out the sincerity of a simultaneous promise).  
      *   Is institutional authority (A.1/A.2) sufficiently established *and accepted* for *all* acts performed?  
  4.  **Group Scrutiny:** Debate: Is this a misfire? An abuse? Or something Austin just didn't foresee? Can we "fix" it within his rules, or do we need new tools?  

  ### What Success Looks Like (Realistically for 3 Days)  
  *   **Success:**  
      *   Articulating *specific points* where layered digital performatives consistently strain or break specific felicity conditions.  
      *   Developing a shared vocabulary for describing these multi-act structures.  
      *   Formulating a clear argument for *either* "Framework needs significant tweaks" *or* "This is a fundamentally new beast requiring new concepts."  
      *   Producing rough case studies of 2-3 message types showing the conflict.  
  *   **Failure (to Avoid):**  
      *   Getting bogged down in defining *every* possible speech act in a message.  
      *   Concluding vaguely that "it's complicated."  
      *   Trying to fully resolve the philosophical debate.  

  ### Realistic Scope Check (It's Only 3 Days!)  
  *   **Focus:** Depth over breadth. We'll analyze **2-3 core message types** in detail.  
  *   **Theory:** Assume basic familiarity with Austin/Searle. We'll reference core conditions, not dive into every nuance of speech act theory or engage deeply with later critics (Habermas, etc.).  
  *   **Output:** Focused analysis notes, structured discussions, and a collaborative attempt to answer the core question. *Not* a polished academic paper draft.  
  *   **Avoid:**  
      *   Debating AI consciousness/intentionality.  
      *   Comprehensive legal analysis (though legal function is part of the context).  
      *   Building a complete alternative framework.  

  ### Let's Get Our Hands Dirty!  
  This workshop is for anyone fascinated by how language *does things*, especially in the messy, automated, legally-loaded digital world. Come ready to dissect real messages, argue about sincerity and authority in the age of algorithms, and see if Austin's toolbox still works or if we need a new one.  

  **(Refs to be added – Austin, Searle, maybe some Finlayson on institutional speech, Grimmelmann on TOS, etc.)**  

  **Casual enough? Happy to tweak! Let's make those layered performatives sweat.**
