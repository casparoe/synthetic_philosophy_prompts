  First, I'll assess how accurately the student captured each philosopher's position. For Mencius, they correctly identified the "four sprouts" as innate moral potentials with teleological growth, and described education as passive cultivation. For Xunzi, they nailed the key contrast—defining xing as amoral biological drives that lead to conflict without external control, and emphasizing ritual/law as artificial constraints. The "evil" characterization is well contextualized too. 

  The structure is efficient: clear separation of thinkers with parallel coverage of all three sub-questions. Strong verbs like "carves the person like wood" show conceptual grasp. Only minor gaps exist—could mention Mencius' "flood-like qi" cultivation or Xunzi's "heart's cognitive capacity" for ritual. But the core arguments are solid. 

  Since this is likely an undergraduate response, I'll prioritize clarity over exhaustive detail. The student synthesized complex ideas concisely (e.g., "built-in teleology," "external suppression"), avoided misinterpretations, and used textual metaphors appropriately. That deserves an A-. 

  For feedback, I'll highlight strengths like precise terminology usage while gently noting omissions (e.g., Mencian self-cultivation practices) as growth areas. The tone should encourage—this is clearly a student who did the reading. 

  *checks grading criteria* No citation issues or factual errors detected. The "split hard" phrasing is informal but acceptable for TA grading. Ready to draft the evaluation.
answer: |-
  Here's a grade and specific feedback for the student's answer:

  **Grade: A-** (Excellent - Demonstrates strong understanding of core concepts with minor omissions)

  ### Point-by-Point Feedback:

  1.  **Clarity & Conciseness (Strength):** Excellent. The answer is direct, well-organized, and efficiently contrasts the two thinkers point-by-point.
  2.  **(a) Definition of Xing (Mencius):** **Accurate & Strong.** Correctly identifies the "four sprouts" (compassion, shame, deference, sense of right/wrong) as central to Mencius' definition of *xing*. The phrase "built-in teleology" is particularly insightful. *(Minor Note: Could mention that for Mencius, xing is inherently good/positive).*
  3.  **(a) Definition of Xing (Xunzi):** **Accurate & Strong.** Correctly defines Xunzi's *xing* as raw biological drives (hunger, rest, profit, envy). The clarification that "evil" means following them leads to conflict, not inherent wickedness, is crucial and well-stated.
  4.  **(b) Innate Moral Tendencies (Mencius):** **Accurate & Strong.** Explicitly states Mencius believes people *are* born with moral tendencies (the sprouts). Perfect.
  5.  **(b) Innate Moral Tendencies (Xunzi):** **Accurate & Strong.** Explicitly states Xunzi believes there is *no innate moral compass* at all. Correct and clear.
  6.  **(c) Moral Development (Mencius):** **Mostly Accurate.** Correctly identifies the passive "gardening" analogy, removing corrupting influences, and inward reflection. *(Minor Omission/Point for Growth:* While emphasizing the innate potential, Mencius *does* require active effort in cultivation - nurturing the sprouts, "extending" feelings, controlling the "flood-like qi." It's not *purely* passive removal of negatives; positive cultivation effort is involved. The "just remove corrupting influences" slightly understates the need for conscious nurturing/effort).
  7.  **(c) Moral Development (Xunzi):** **Accurate & Strong.** Excellently captures Xunzi's view: development is entirely external via ritual (*li*) and law (*fa*) designed to "suppress" or "carve" raw impulses. Correctly emphasizes the role of punishment/enforced compliance and that inner approval comes only *after* long conditioning. The "carves the person like wood" metaphor is apt.
  8.  **Key Contrasts Highlighted:** **Excellent.** The answer clearly establishes the fundamental disagreement: innate goodness/teleology vs. innate amorality needing external artifice; passive cultivation vs. active external shaping; internal source vs. external source of morality.
  9.  **Use of Terminology:** **Very Good.** Correctly uses key terms: *xing*, sprouts, *li* (ritual), *fa* (law), heart/mind. Uses "teleology" appropriately.

  ### Summary for Grading Sheet:
  *   **Strengths:** Excellent clarity and conciseness. Highly accurate on definitions of *xing* for both thinkers. Perfectly captures the disagreement on innate moral tendencies. Excellent description of Xunzi's view on moral development. Strong use of key terms and metaphors. Clearly highlights the core contrast.
  *   **Area for Minor Improvement:** Slightly understates the active effort required in Mencian self-cultivation beyond just removing corrupting influences. While the sprouts grow naturally, Mencius emphasizes conscious nurturing and extension.
  *   **Overall:** Demonstrates a strong grasp of the fundamental contrast between Mencius and Xunzi on human nature and moral development. A very good answer deserving of an A-.

  This is a strong undergraduate answer that hits all the key points required by the question effectively and concisely. The minor point about Mencian effort doesn't detract significantly from the overall excellent demonstration of understanding.
