answer: |-
  This institutional divergence reveals deep philosophical tensions regarding truth, communication, and responsibility. Below is a reconstructed analysis of the implicit theories, their commitments, and the implications of potential shifts in the underlying view of deception:

  ### Implicit Philosophical Commitments
  1.  **The Speech-Act Distinction (Lying vs. Misleading):**
      *   **Presupposition:** Institutions distinguish between *what is said* (literal propositional content) and *what is implicated* (pragmatic inference). Perjury law focuses solely on falsity in the former domain.
      *   **Commitment:** Asserting a proposition carries a unique, strong warranty of truthfulness. The speaker explicitly guarantees the truth of P. Misleading, however, involves crafting context to invite a *false inference (Q)* without asserting Q. The speaker avoids direct warranty for Q, exploiting the listener's role in drawing inferences.
      *   **Moral Responsibility:** Lying violates a core internal norm of the speech-act of assertion ("Assert only what you believe true"). Misleading manipulates external conditions of communication but does not directly violate the assertion norm itself. Responsibility for inferences shifts partially to the listener.

  2.  **Epistemic and Evidentiary Pragmatism:**
      *   **Presupposition:** Institutions prioritize administrability and the limitation of state power.
      *   **Commitment:** Proving subjective *belief in falsity* beyond reasonable doubt is inherently difficult. Focusing on *literal falsity* provides an objective, tractable standard. Proving *intent to mislead* or *misleading effect* in complex conversational contexts is even more subjective and burdensome, especially under the high standards of criminal law.
      *   **Legitimate State Interest:** The state's interest in coercing testimony is narrowly construed as preventing *affirmative falsehoods* that directly corrupt the record. Compelling "full disclosure" or policing inferences risks chilling testimony and overreach.

  3.  **Domain-Specific Norms of Trust and Reliance:**
      *   **Presupposition:** Different relationships entail different duties of candor.
      *   **Commitment:**
          *   *Adversarial Legal Context (Witness Box):* The primary duty is to answer questions *literally* truthfully. Vigorous cross-examination and rules of evidence are deemed sufficient to expose evasion or invite necessary inferences. The burden of eliciting truth falls partly on the questioner.
          *   *Fiduciary/Professional Contexts (Scientists, Auditors):* The duty extends to ensuring the audience gains an *accurate understanding*, not just avoiding literal falsehoods. Selective framing undermines the very purpose of the communication (knowledge advancement, financial transparency). The professional warrants the *reliability and completeness* of their presentation within context.
          *   *Consumer Transactions/Contracts:* The duty is to avoid unfair manipulation. "Misleading" conduct exploits information asymmetry and consumer trust, distorting voluntary exchange, regardless of literal truth. The focus is on the *effect* on the recipient's understanding and choices.

  ### Consistency & Underdetermination
  *   **Surface Consistency:** The pattern is rendered consistent by:
      1.  Prioritizing objective falsity and subjective belief as the *only* triggers for the *criminal* sanction of perjury (high bar, narrow state interest).
      2.  Recognizing broader duties of non-manipulation in contexts of *trust, reliance, and information asymmetry* (professional ethics, consumer protection, torts).
      3.  Accepting adversarial combativeness within legal bounds (witness box) as a necessary evil, mitigated by procedural safeguards.
  *   **Philosophical Underdetermination:**
      *   **The Tort-Perjury Tension:** This is the starkest underdetermination. Punishing negligent misstatement (tort) but excusing deliberate, technically truthful misdirection (perjury) suggests the system lacks a coherent principle about the *moral significance of intent* versus the *epistemic nature of the wrong*. It prioritizes literal truth + intent for criminal sanction (perjury), literal falsity *or* negligence for civil compensation (tort), and intentional manipulation of understanding for professional/consumer protection. This reveals a pragmatic patchwork rather than a unified moral theory.
      *   **Belief Manipulation vs. Propositional Falsity:** The divergence *can* be explained pragmatically (evidentiary tractability, domain-specific duties) *without* necessarily endorsing the deep conceptual speech-act distinction as the *moral* basis. The system functions without resolving whether manipulating belief is fundamentally equivalent to uttering a known falsehood.

  ### Implications of Treating Lying and Misleading as Morally Equivalent
  If the underlying view shifted to treat lying and intentional misleading as morally equivalent wrongs (both being deliberate attacks on another's epistemic agency/belief formation), significant changes would follow:

  1.  **Perjury Law Expansion:** Perjury would need to encompass intentionally misleading testimony through selective truthful statements shown to create a material false impression *and* where the speaker intended this effect. Proving *intent to mislead* would become crucial.
  2.  **New Civil Liability/Remedies:** Tort law might develop a distinct cause of action for "intentional misleading by truthful statements" where material harm results, separate from negligent misrepresentation or fraud (which typically require falsity).
  3.  **Professional Ethics Codification:** Existing prohibitions would likely become more explicit and potentially serve as a model or minimum standard, possibly influencing legal standards.
  4.  **Evidentiary Challenges:** Courts would grapple with proving subjective intent to mislead and objectively establishing the "material false impression" created by truthful utterances. This would increase litigation complexity and potentially chill testimony.
  5.  **Shift in Legal Procedure:** The rules of examination might tighten. Questioners could demand clarification of potentially misleading truthful answers, and witnesses might face sanctions for evasive but technically truthful responses proven to be intentionally deceptive.
  6.  **Blurring of Domains:** The sharp distinction between the narrowly policed witness box and the broadly policed commercial/professional realms would diminish. The "adversarial justification" for tolerating misleading testimony would weaken.

  **Conclusion:** The current divergence primarily presupposes a **speech-act distinction** (lying violates assertion's core norm; misleading exploits inference) coupled with strong **epistemic pragmatism** (focusing on falsity for criminal liability due to evidentiary constraints) and **contextual moral pragmatism** (assigning different duties of candor based on the relationship - adversarial legal, fiduciary professional, reliant consumer). The system is philosophically underdetermined, most visibly in the tension between tort negligence liability and perjury's excuse for deliberate misleading. Adopting moral equivalence between lying and misleading would necessitate profound legal reforms, particularly expanding the scope of perjury and creating new civil liabilities, moving towards a unified view that prioritizes preventing *intentional belief manipulation* regardless of the literal truth value of the utterances used. This shift would face significant practical hurdles but would align legal doctrine more closely with the underlying wrong identified in professional ethics and consumer protection.
