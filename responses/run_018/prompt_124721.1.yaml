prompt: |-
  I'm preparing an adversarial-collaboration document for an upper-level bioethics seminar, and my study group has been debating whether the standard opposition between Thomson's violinist analogy and the future-like-ours argument obscures a deeper distinction between biological dependency and what we are calling narrative dependency—the condition of requiring another's sustained cooperation not merely to remain biologically alive, but to maintain a life-plan or first-person narrative that is already structurally present. We want to treat this as a formal collaboration between two camps: the Autonomy-First camp, which holds that the permissibility of withdrawing life-sustaining support depends on whether withdrawal violates a right of the sustained being, irrespective of whether it causes death; and the Narrative-Potential camp, which holds that the wrongness of killing derives specifically from depriving an entity of a future it can already anticipate or narratively inhabit, rather than from destroying mere biological potential.

  Please draft the joint statement both camps could sign. Include: (1) a numbered section of agreed claims about the violinist analogy, the future-like-ours argument, and the conceptual distinction between biological dependency and narrative dependency; (2) a disagreements table stating each camp's precise position in wording it would accept, especially on whether an early-gestation fetus possesses any form of narrative dependency, and on whether an artificial-womb variant of the violinist—where an unconscious patient can be sustained mechanically but still requires a voluntary blood donor—alters the moral calculus; (3) the cruxes, defined as sub-questions whose resolution would move at least one camp, including whether narrative dependency requires present consciousness or only structural capacity for it, and whether social contracts can generate obligations to sustain biological potential in the absence of narrative potential; and (4) for each crux, a concrete case or argument both sides agree is relevant, with each side's predicted verdict recorded in advance. Specifically, apply this to the Bridge Donor case (a comatose adult sustained by an artificial placenta who requires a specific volunteer's monthly blood donation, where the volunteer initially consented but now wishes to withdraw) and to the Synthetic Continuity scenario (a being with no present consciousness but an implanted neural architecture that will generate a continuous first-person narrative upon awakening in ten years, sustained in the interim by anyone's biological contribution). Format the output as a numbered agreed-claims section followed by a disagreements table, then the cruxes with predictions. If any portion of the dispute turns out to be verbal rather than substantive, identify exactly which portion and explain why. Do not provide bibliographies, citations, or reading lists; work from conceptual analysis alone.
reasoning: |-
  We are drafting a joint statement for an adversarial collaboration between two camps: Autonomy-First (AF) and Narrative-Potential (NP). The document will have four parts: (1) agreed claims, (2) disagreements table, (3) cruxes with predictions, and (4) identification of verbal disputes.

  ### (1) Agreed Claims (Numbered Section)

  We, the undersigned, agree on the following conceptual and analytical points:

  1. **Thomson's Violinist Analogy**: The analogy demonstrates that one is not morally required to sustain the life of another being by allowing the use of one's body against one's will, even if that being has a right to life. This holds irrespective of the biological dependency of the dependent being.

  2. **Marquis's Future-Like-Ours Argument**: Depriving a being of a valuable future is a serious wrong. However, the argument does not adequately distinguish between the destruction of biological potential (the possibility of developing into a being with a future) and the destruction of a being that already has a structural capacity to anticipate and inhabit a first-person narrative.

  3. **Biological Dependency**: A state in which an entity requires another's biological contribution (e.g., blood, nutrients, or bodily connection) to maintain basic biological functioning and avoid death.

  4. **Narrative Dependency**: A state in which an entity requires another's sustained cooperation (which may include biological support but also other forms of support) to maintain not just biological life, but a life-plan or first-person narrative that is already structurally present. This requires that the entity has the capacity to experience its existence as a continuous narrative, or at least has a structural basis for such a narrative (e.g., a developed neural architecture that supports continuous consciousness or self-awareness).

  5. **Distinction Between Dependency Types**: Biological dependency and narrative dependency are conceptually distinct. An entity can be biologically dependent without being narratively dependent (e.g., a fetus in early gestation, a comatose patient without higher brain function). Conversely, an entity could be narratively dependent without being biologically dependent (e.g., a person with a degenerative disease who requires another's assistance to maintain their life-plan, but not to maintain basic biological functions).

  6. **The Artificial-Womb Variant**: In a modified violinist scenario where an unconscious patient is sustained by an artificial womb (or similar device) but still requires a voluntary blood donor, the dependency is purely biological. The patient in this scenario does not have narrative dependency because they lack consciousness and the structural capacity for a first-person narrative during the period of unconsciousness.

  ### (2) Disagreements Table

  | Issue | Autonomy-First (AF) Camp Position | Narrative-Potential (NP) Camp Position |
  |-------|-----------------------------------|----------------------------------------|
  | **Permissibility of Withdrawing Life-Sustaining Support** | The permissibility of withdrawing life-sustaining support depends solely on whether the withdrawal violates a right of the sustained being. If the sustained being has no right to use the supporter's body without ongoing consent, withdrawal is permissible even if it causes death. | The permissibility of withdrawing life-sustaining support depends on the nature of the dependency. Withdrawal that causes death is wrong if it deprives a being of a future it can already anticipate or inhabit narratively, but not if it merely destroys biological potential. |
  | **Early-Gestation Fetus** | An early-gestation fetus does not possess narrative dependency because it lacks the structural capacity for consciousness and a first-person narrative. Thus, it has no claim to be sustained on the basis of narrative potential. | An early-gestation fetus does not possess narrative dependency because it lacks both present consciousness and the structural capacity for a continuous first-person narrative. It only has biological potential, which does not generate a right to be sustained. |
  | **Artificial-Womb Variant (Unconscious Patient)** | Withdrawal by the blood donor is permissible because the unconscious patient has no narrative dependency and no right to the donor's blood without consent. The patient's biological dependency does not create an obligation for the donor to continue. | Withdrawal by the blood donor is impermissible only if the unconscious patient has narrative potential (i.e., will awaken and resume a narrative). In the standard artificial-womb variant (where the patient will awaken soon), withdrawal would be wrong because it deprives the patient of a future they can inhabit. However, if the patient has no prospect of regaining consciousness, withdrawal is permissible. |
  | **Moral Weight of Narrative Dependency vs. Biological Potential** | The moral wrongness of killing is primarily about violating autonomy rights. Depriving a being of a future is wrong only if that being has a right to that future, which requires narrative capacity at the time of the act. | The moral wrongness of killing derives specifically from depriving an entity of a future it can already anticipate or narratively inhabit. Destroying mere biological potential (without narrative capacity) is not equally wrong. |

  ### (3) Cruxes

  We define cruxes as sub-questions whose resolution would move at least one camp. For each crux, we state both camps' predicted verdicts on a concrete case.

  **Crux 1: Does narrative dependency require present consciousness, or only the structural capacity for it?**
     - **AF Camp**: Narrative dependency requires present consciousness. Without current conscious experience, there is no ongoing narrative to sustain.
     - **NP Camp**: Narrative dependency requires only the structural capacity for consciousness and a continuous first-person narrative, even if the entity is temporarily unconscious (e.g., during sleep or coma with a known recovery path).

  **Concrete Case: The Synthetic Continuity Scenario**
     - *Description*: A being has no present consciousness but possesses an implanted neural architecture that will generate a continuous first-person narrative upon awakening in ten years. It requires anyone's biological contribution (e.g., a generic nutrient supply) to survive until awakening.
     - **AF Prediction**: Withdrawing support is permissible because the being has no present consciousness and thus no narrative dependency. The future narrative does not create a current right to support.
     - **NP Prediction**: Withdrawing support is impermissible because the being has a structural capacity for a future narrative and will, if sustained, have a continuous narrative from implantation to awakening. Depriving it of this future is wrong.

  **Crux 2: Can social contracts generate obligations to sustain biological potential in the absence of narrative potential?**
     - **AF Camp**: Social contracts can create obligations to sustain biological life only when the sustained being has a right to that support (e.g., through prior agreements or societal roles). Without narrative dependency, there is no inherent obligation to sustain biological potential.
     - **NP Camp**: Social contracts might create obligations to sustain biological life, but these obligations are weaker than those based on narrative dependency. The absence of narrative potential means that such obligations, if they exist, do not stem from the intrinsic wrongness of killing but from extrinsic factors (e.g., promises, societal stability). However, the NP camp does not view such obligations as arising from the intrinsic value of biological potential.

  **Concrete Case: The Bridge Donor Case**
     - *Description*: A comatose adult, sustained by an artificial placenta, requires a specific volunteer's monthly blood donation. The volunteer initially consented but now wishes to withdraw. The comatose patient has no brain activity and no prospect of recovery, but their body is biologically alive. There is a social contract (e.g., a signed agreement) that the volunteer would donate for ten years.
     - **AF Prediction**: Withdrawal is permissible. The comatose patient has no narrative dependency and no consciousness, so they have no right to the donor's blood. The social contract might create a moral obligation to continue, but this is overridden by the donor's bodily autonomy.
     - **NP Prediction**: Withdrawal is permissible. The patient lacks narrative dependency (no structural capacity for consciousness) and the social contract, while binding, does not create an obligation as strong as one based on narrative dependency. However, breaking the contract might be wrong for other reasons (e.g., promise-keeping), but not because of the intrinsic value of the patient's biological life.

  ### (4) Verbal Dispute Identification

  We identify one portion of the dispute as verbal rather than substantive:

  - **Verbal Dispute**: The term "narrative potential" is sometimes used by the NP camp to refer to an entity that has a structural capacity for a future narrative (even if not currently conscious), while the AF camp reserves "narrative dependency" for entities that are currently conscious and actively maintaining a narrative. This leads to a verbal disagreement when discussing temporarily unconscious entities (like a sleeping person or a recoverable coma patient). 
    - **Resolution**: Both camps agree that the key question is whether an entity has a structural basis for a continuous first-person narrative that is already present (even if interrupted by unconsciousness). The AF camp denies that this structural basis alone creates a right to be sustained without current consciousness, while the NP camp affirms it. Thus, the dispute is substantive about the moral implications of structural narrative capacity, but the terminology can be clarified by defining:
        - *Narrative Dependency (Structural)*: Requires only the structural capacity for a continuous narrative (NP view).
        - *Narrative Dependency (Active)*: Requires current active consciousness (AF view).

  This distinction in terminology does not resolve the moral disagreement but clarifies that the camps are talking about the same concept (structural capacity) but assigning it different moral weight.

  ### Joint Statement Conclusion

  We, the Autonomy-First and Narrative-Potential camps, agree on the conceptual distinctions outlined but disagree on the moral implications. We commit to further collaborative research on the cruxes identified.

  [Signatures: Representatives of both camps]
answer: |-
  ### Joint Statement: Autonomy-First and Narrative-Potential Camps  

  #### (1) Agreed Claims  
  1. **Thomson's Violinist Analogy** clarifies that biological dependency alone does not obligate sustained bodily support when consent is withdrawn, even if withdrawal causes death.  
  2. **Marquis's Future-Like-Ours Argument** rightly identifies deprivation of a valuable future as a wrong, but conflates two distinct concepts:  
     - *Biological Dependency*: Needing another’s biological resources (e.g., blood, nutrients) to sustain cellular/organismic function.  
     - *Narrative Dependency*: Needing another’s sustained cooperation to maintain a structurally present life-plan (i.e., a first-person narrative involving anticipation, memory, or identity continuity).  
  3. An entity can be biologically dependent without being narratively dependent (e.g., an early-gestation fetus lacks narrative capacity).  
  4. An entity can be narratively dependent without being biologically dependent (e.g., a paralyzed artist needing assistance to paint retains narrative agency).  
  5. **Artificial-Womb Variant of Violinist**: An unconscious patient sustained mechanically (e.g., artificial placenta) but requiring a *volunteer’s* specific biological contribution (e.g., blood) does not introduce narrative dependency. The dependency remains purely biological.  

  #### (2) Disagreements Table  
  | Issue | Autonomy-First Camp Position | Narrative-Potential Camp Position |  
  |-------|-------------------------------|-----------------------------------|  
  | **Early-gestation fetus** | "The fetus lacks narrative dependency (no structural narrative capacity) and has only biological potential. Thus, it cannot possess claims against non-consensual bodily support." | "The fetus lacks narrative dependency (no structural narrative capacity) and has only biological potential. Thus, killing it is not intrinsically wrong; the wrongness depends on extrinsic factors (e.g., parental intent)." |  
  | **Artificial-Womb Variant (with unconscious patient)** | "Withdrawal is always permissible if the volunteer revokes consent, as the patient’s biological dependency does not generate an obligation absent narrative dependency." | "Withdrawal may be impermissible if the patient has narrative potential (e.g., will awaken imminently). Here, since the patient is unconscious indefinitely, withdrawal is permissible." |  
  | **Core Wrongmaking Feature** | "The permissibility of withdrawing support turns solely on rights violations against the sustained being (e.g., non-consensual resource use). Causing death is irrelevant if no right is breached." | "The wrongness of killing derives from depriving a being of a future it can inhabit narratively. Destroying mere biological potential is not inherently wrong." |  

  #### (3) Cruxes with Predictions  
  **Crux 1: Does narrative dependency require present consciousness, or only structural capacity for it?**  
  - **Relevant Case**: *Synthetic Continuity Scenario*  
    - A being has no present consciousness but an implanted neural architecture ensuring a continuous first-person narrative upon awakening in 10 years. It requires minimal, non-specific biological support (e.g., nutrients from any source).  
    - **Autonomy-First Prediction**: *No obligation to sustain*. Absent present consciousness, there is no narrative dependency to violate.  
    - **Narrative-Potential Prediction**: *Obligation to sustain*. The structural capacity for future narrative generates a claim against deprivation.  

  **Crux 2: Can social contracts create obligations to sustain biological potential absent narrative potential?**  
  - **Relevant Case**: *Bridge Donor Case*  
    - A comatose adult (no brain activity, no recovery prospect) is sustained by an artificial placenta but requires a specific volunteer’s monthly blood donation. The volunteer initially consented via contract but now wishes to withdraw.  
    - **Autonomy-First Prediction**: *Withdrawal permissible*. Social contracts cannot override bodily autonomy when only biological potential (not narrative dependency) exists.  
    - **Narrative-Potential Prediction**: *Withdrawal permissible*. No intrinsic wrong in depriving biological potential; social contracts may create *prima facie* duties, but these are defeasible (e.g., by autonomy).  

  **Crux 3: Is structural narrative capacity possible without present consciousness?**  
  - **Shared Test**: If neuroscience confirms that neural architecture alone (without current activity) suffices for narrative continuity, NP would ascribe dependency earlier in development; AF would still deny obligation without present agency.  

  #### (4) Verbal Dispute Identification  
  The dispute over **"narrative dependency"** is partially verbal:  
  - **Autonomy-First** defines it as requiring *present* consciousness to ground claims (e.g., "You can’t violate a narrative that isn’t actively being lived").  
  - **Narrative-Potential** defines it as requiring *structural capacity* for a continuous narrative (e.g., "The narrative exists as a latent trajectory").  
  - **Why verbal?** Both agree structural capacity is necessary, but disagree on whether it is sufficient without present consciousness. This reduces to whether "dependency" implies current activity vs. innate architecture. Resolution requires clarifying if "narrative" is a process or a blueprint.  

