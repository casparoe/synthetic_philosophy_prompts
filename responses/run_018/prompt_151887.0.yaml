answer: |-
  Here's a comprehensive practice exam package designed for your PHIL 340 study group, focusing on the paradox of fiction, belief states, and competing theories:

  **PHIL 340 Practice Exam: The Paradox of Fiction & Belief Thresholds**

  **Time:** 45 Minutes

  **Prompt:**

  Colin Radford's classic formulation of the Paradox of Ficiton hinges on the apparent irrationality of experiencing genuine emotions (e.g., pity, fear) towards fictional characters and events while simultaneously *knowing* they do not exist. This requires three premises: We feel genuine emotions; these emotions require belief in the existence/occurrence of their objects; and we do not believe fictional entities/events exist/occurred.

  Recent discussions suggest Radford might set the belief threshold too high. Could a weaker cognitive state than full-fledged "belief in reality" – let's call it **"Shadow Endorsement"** – suffice to ground genuine emotional responses to ficiton? Shadow Endorsement involves *not* literally believing (e.g., that Hamlet died or that Anna Karenina suffered), but nevertheless *actively treating the described scenario as a live possibility for the purpose of affective engagement and processing* during the experience. It's a temporary, pragmatic stance adopted for emotional uptake.

  Evaluate whether resolving the paradox requires full belief or if Shadow Endorsement is sufficient. Crucially, **compare and contrast** Kendall Walton's theory of quasi-emotions arising from participation in games of make-believe with Gregory Currie's simulation theory (where we mentally simulate beliefs and desires to generate real emotions). **Defend which theory (Walton or Currie) provides a more coherent and satisfactory account of how Shadow Endorsement operates, carefully explaining why the chosen theory is superior *without* reducing it to a version of the other theory.** Does Shadow Endorsement collapse into Walton's prescribed imaginings, or can it be integrated into Currie's belief-simulation? Which framework truly *explains* the affective power of Shadow Endorsement?

  ---

  **Model Answer (Approx. 600 Words):**

  Radford's paradox assumes genuine emotions necessitate full belief in the existence of their intentional objects. Resolving the paradox, therefore, doesn't strictly require replicating this full belief; demonstrating that a weaker cognitive state like "Shadow Endorsement" (SE) – actively treating the fictional scenario as live for affective processing despite knowing its unreality – suffices breaks the second premise. SE captures the phenomenology: we engage emotionally *as if* the events matter, without deluding ourselves about their ontological status. The critical question becomes which theory, Walton's make-believe or Currie's simulation, best accommodates and explains SE.

  Walton's theory posits that emotions felt towards fiction are "quasi-emotions." They arise within a game of make-believe, where props (the text, images) prescribe specific imaginings. Feeling "fear" for Hamlet isn't genuine fear, but a make-believe fear generated because the fiction prescribes imagining oneself fearing the fictional threat. SE maps neatly onto Walton's framework. "Treating the scenario as live for affective processing" *is* engaging in the prescribed game of make-believe. The "endorsement" is not of reality, but of the fictional truth and the emotional prescriptions within the game. The affective state (quasi-emotion) is a direct product of this imaginative participation governed by the rules of the fiction. SE *is* the state of mind Walton describes as foundational for quasi-emotions.

  Currie's simulation theory argues we generate *real* emotions by psychologically simulating the beliefs and desires of a hypothetical observer (or character) within the fiction. To feel pity for Anna Karenina, I simulate *believing* Anna is real and suffering, which then generates real pity. Here, SE presents a problem. Currie explicitly requires simulating *beliefs* (or belief-like states sufficiently robust to cause real emotion). However, SE is defined as *weaker* than belief – it's an "as if" stance taken for affective purposes, consciously distinct from actual belief. If SE doesn't involve simulating genuine belief-states, how can it trigger real emotions under Currie's model? Currie could *stretch* simulation to include SE, but this risks hollowing out the definition of "simulated belief" and making it indistinguishable from Walton's prescribed imaginings. If the simulated state isn't robustly belief-like, how does it differ functionally from merely imagining-with-affective-response as per Walton?

  Therefore, **Walton's make-believe theory provides a superior account of Shadow Endorsement.** SE isn't just *compatible* with Walton; it is essentially constitutive *of* the participation in the game of make-believe that generates quasi-emotions. The "shadow" aspect highlights the conscious distance from belief, aligning perfectly with the knowing pretense central to Walton. Explaining SE doesn't require adding anything novel; it's core functionality.

  Conversely, integrating SE into Currie's theory creates tension. SE explicitly *avoids* the kind of belief-simulation Currie deems necessary for real emotions. To make SE work within simulation, one must either:
  1.  **Weaken "Simulated Belief":** Argue SE *is* a sufficient form of simulated belief. But this collapses the distinction from Walton, as the simulated state becomes equivalent to mandated imagining for affective response.
  2.  **Introduce a New Mechanism:** Propose SE triggers emotion differently than belief-simulation. This abandons the core simulationist explanation without offering a new one.

  Walton coherently explains the affective power of SE as arising *from* the act of make-believe participation itself. Currie struggles to explain how a state explicitly *not* belief-like (SE) can fuel a process (simulation) explicitly defined as requiring belief-like states to generate real emotions. Thus, SE strongly supports Walton's view that the emotions we feel towards fiction are distinct in kind (quasi-emotions), generated by our imaginative engagement (SE), rather than real emotions requiring simulated beliefs. Shadow Endorsement is the cognitive engine of make-believe, not a diluted fuel for simulation.

  ---

  **Marking Scheme (20 Points Total): Must-Hit Moves**

  1.  **Define & Apply "Shadow Endorsement" (SE) (4 pts):** Clearly defines SE as *weaker than belief* but involving *active treatment as live for affective processing*. Explicitly uses SE to challenge Radford's Premise 2 (belief requirement).
      *   *Common Botch:* Vaguely describing SE as "imagination" or "suspension of disbelief" without emphasizing its *affective purpose* and *contrast with belief*; failing to explicitly link SE to breaking Premise 2.

  2.  **Accurately Contrast Core Mechanisms (4 pts):** Clearly explains Walton (quasi-emotions from prescribed make-believe participation) vs. Currie (real emotions from simulating beliefs/desires). Highlights the *key difference:* Walton rejects belief requirement *for the emotion itself*; Currie *requires simulated belief* for real emotion.
      *   *Common Botch:* Conflating the theories ("they both just involve imagination"); misrepresenting quasi-emotions as not feeling real or simulation as involving direct perception.

  3.  **Analyze SE within Each Theory (4 pts):** For Walton, argues SE *is* the core state of make-believe participation generating quasi-emotions. For Currie, identifies the tension: SE is defined as *non-belief-like*, yet simulation *requires* belief-like states for real emotion.
      *   *Common Botch:* Simply stating SE "fits" Walton without explaining *how* it constitutes participation; ignoring or downplaying the conflict between SE and Currie's belief-simulation requirement.

  4.  **Defend Walton's Superiority on SE (4 pts):** Argues Walton integrates SE naturally as foundational, explaining affective power via make-believe structure. For Currie, argues incorporating SE either weakens "simulated belief" (collapsing into Walton) or requires abandoning/changing the core simulation mechanism without justification. Clearly states Walton handles SE *without reduction* to Currie.
      *   *Common Botch:* Claiming Currie can handle SE without addressing the belief-simulation tension; asserting Walton wins without explaining *why* SE fits better beyond "it's about imagination"; failing to address the "no collapse" requirement.

  5.  **Resolution & Synthesis (4 pts):** Clearly concludes SE suffices to break the paradox (replaces full belief). Synthesizes the analysis to argue SE strongly supports Walton's quasi-emotion account as the best explanation for our affective engagement with fiction, precisely *because* it explains how SE generates distinctive affective states without real belief.
      *   *Common Botch:* Ending weakly without a clear verdict on SE's sufficiency or the theories; introducing unrelated points; restating arguments without synthesis.

  ---
  **Good luck with your study group! This prompt should definitely push them beyond Radford recitation and into the theoretical nuances.**
