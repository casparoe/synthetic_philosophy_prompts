  2.  **Perfect Co-location:**  
      Sitting on your desk now, before any disassembly, Phone and Assembly share *every single point* of space they occupy—their boundaries are indistinguishable. Every scratch is on *both*, every interaction affects *both* simultaneously. Observationally, there’s only one object here.  

  3.  **The Tension:**  
      You intuitively recognize Phone as the enduring functional entity—it survives the battery swap. Yet you also recognize Assembly as a unique physical structure—it *doesn't* survive disassembly. Both claims seem true: you have two objects with different persistence conditions. But until disassembly, every conceivable physical measurement (location, mass, shape, even atomic composition) finds only a single entity where these two purportedly coexist. The observable world presents one object, while our conceptual framework demands two.
