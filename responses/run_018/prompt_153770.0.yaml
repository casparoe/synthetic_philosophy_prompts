answer: |-
  The counselor taps her screen. "See, Embryo A has a mild cardiac arrhythmia—correctable, but slightly lowers statistical life-expectancy. Embryo B is baseline optimal. Our *Beneficence+ v2.1* algorithm flags A as impermissible. Your duty is to select B for the child's best life."

  She clicks. "But *LibEug v3.0* clears Embryo A. Parental values—like your noted 'familial cardio-solidarity'—are valid side-constraints. Selecting A to, say, 'honor Grandpa's pacemaker' is ethically protected autonomy."

  The parents stare. "So... which one applies to *us*?"

  "That depends," she sighs, scrolling through intake forms. "Ah. You initialed the *Liberty Package* EULA. LibEug it is. Embryo A is approved."

  "Wait," the father sputters, "if we'd signed the 'Duty Package'..."

  "You'd be mandated to implant B. Different license, different ethics engine." She shrugs. "Configuration conflict. Next time, read the normative parameters *before* consenting to the sperm wash."

  **Punchline:** The profound moral chasm collapses into a EULA checkbox, reducing "which child ought to exist?" to "which software build did you agree to run?"
