prompt: |-
  I am a novelist drafting a multi-perspective war epic, and in conversations with fellow writers—who tend to think in terms of focalization, dramatic irony, diegetic sympathy, and plot-level framing rather than in moral-philosophical categories—I have encountered a philosophical claim that sounds, at first, almost like a narrative convention. Please act as an expert philosopher of war with serious familiarity with literary narratology. Before answering, take a moment to brainstorm carefully: lay out the core commitments of the classical just-war thesis of moral equality of combatants—that soldiers on an unjust side are not, merely by serving an unjust cause, rendered liable to be killed, and that the permission to kill in battle applies symmetrically regardless of which cause is just—without relying on any specific citation or bibliographic reference. Then, restate that entire position as faithfully as possible using only the vocabulary of narrative craft that I actually employ: focalization and point-of-view, protagonist versus antagonist framing, diegetic versus non-diegetic judgment, dramatic irony, the narrative sympathy or interior psychological access granted to characters, plot-level justice versus character-level agency, and the concept of "focalization parity" (by which I mean the literary norm that opposing soldiers in a serious war narrative are typically granted equivalent interior depth regardless of which side the plot structurally endorses). For each translated claim, indicate whether it survives intact, requires distortion, or collapses entirely.

  Next, provide the residue report. Identify precisely what portion of the moral equality thesis has no counterpart in this narrative vocabulary. In particular, examine whether the separation between jus ad bellum and jus in bello—the independence of the justice of the war from the justice of individual acts within it—can be rendered as a separation between "plot-level moral framing" and "character-level permissions to act," or whether that translation smuggles in assumptions that the philosophical thesis explicitly rejects. Also assess whether "diegetic culpability separation" (the notion that a character's moral status inside the story-world is evaluated independently of the audience's extra-diegetic judgment about the cause they serve) captures something genuinely present in the thesis, or whether it merely dresses up an ambiguity. Be rigorous about whether the residue reveals a genuine deficiency in narrative vocabulary—something about moral status that literature simply cannot encode—or whether it shows that the philosophical position depends on distinctions that dissolve once technical moral language is removed. I want to know whether my intuition that moral equality is essentially "just focalization parity applied to ethics" is correct, mistaken, or missing the point in a specific way.

  Please think step by step, keep the analysis honest rather than forcing the narrative framework to speak where it is silent, and avoid invoking niche technical theories outside standard just-war discussion. At the end, organize your response with the translation, the distortion notes, and the residue analysis clearly separated. Finally, conclude with a single line beginning Verdict: and enclose your bottom-line judgment inside \answer{...}—specifically, whether the untranslatable residue points to a gap in narrative craft or to an ambiguity in the philosophical thesis itself.
reasoning: |-
  Hmm, the user is a novelist working on a war epic and has encountered a philosophical idea about moral equality in war. They want me to act as an expert philosopher of war with literary knowledge to translate the classical just-war thesis into narrative terms. Let me break this down carefully.

  First, I need to recall the core of the moral equality of combatants thesis. It has two main parts: combatants on an unjust side aren't automatically liable to be killed just because their cause is unjust, and the permission to kill applies equally to both sides regardless of who's just. This comes from separating jus ad bellum (justice of going to war) from jus in bello (justice in conduct during war). Soldiers are judged only by in bello rules - following war conventions, not attacking civilians, etc. Their moral status as combatants is symmetrical.

  Now, translating this into narrative vocabulary. Focalization parity means giving both sides equal interior depth. So saying soldiers on both sides have the same "permission to act violently" in the story world mirrors the symmetrical permission to kill. Making their liability depend on individual actions (like harming civilians) rather than which side they're on aligns with character-level agency over plot framing. Diegetic culpability separation - judging characters by story-world rules regardless of the audience's view of the cause - captures the independence of in bello from ad bellum judgments.

  But there are distortions here. Narrative sympathy often signals moral approval, which could undermine the strict separation philosophy insists on. Also, plot-level justice usually implies which side is "right," but the philosophical thesis demands this doesn't affect individual combatants' moral status. The residue - what doesn't translate - is the core idea that combatants have equal moral standing regardless of their cause's justice. Narrative can show this structurally but can't encode the normative moral claim itself. The vocabulary can simulate the separation but not ground the moral symmetry philosophically.

  The residue analysis shows that narrative can handle the structural separation but not the underlying moral equality. The jus ad bellum / jus in bello distinction translates to plot vs character level permissions only if we ignore that philosophy sees combatants as morally equal, not just procedurally similar. Diegetic culpability separation dresses up the ambiguity but doesn't resolve it. The gap is in narrative's inability to make prescriptive claims - it can depict but not justify moral equality. This points to a limitation in narrative craft rather than a flaw in the philosophy.

  Verdict: The untranslatable residue reveals a genuine deficiency in narrative vocabulary for encoding non-relational moral status.
answer: |-
  ### Translation of Moral Equality of Combatants into Narrative Vocabulary  
  *Core Philosophical Thesis*: Combatants on an unjust side (1) are not inherently liable to be killed merely for serving an unjust cause, and (2) possess symmetrical permissions to kill enemy combatants regardless of *jus ad bellum* status. This rests on the strict separation between *jus ad bellum* (justice of the war) and *jus in bello* (justice in conduct).  

  | Philosophical Claim | Narrative Translation | Status |  
  |---------------------|------------------------|--------|  
  | **Soldiers on an unjust side are not liable to be killed merely for serving that cause.** | A character’s *diegetic culpability* (liability to lethal violence) depends solely on their individual actions within combat (e.g., targeting non-combatants) — not on the *plot-level moral framing* of their faction as antagonist. | **Survives Intact** |  
  | **Permission to kill applies symmetrically to all combatants.** | *Character-level agency* grants opposing soldiers equivalent "permissions to act violently" against enemy combatants, irrespective of whether their faction is framed as protagonist or antagonist at the plot level. | **Survives with Distortion** |  
  | **Moral equality stems from separation of *jus ad bellum* and *jus in bello*.** | *Plot-level justice* (the war’s cause) and *character-level permissions* (rules of engagement) operate in separate diegetic layers. Characters are judged by the latter, even when the former condemns their side. | **Collapses Partially** |  
  | **Combatants are moral equals regardless of cause.** | *Focalization parity*: Opposing soldiers receive equivalent interiority, psychological depth, and narrative sympathy, decoupled from the plot’s structural endorsement of their faction. | **Distorted** |  

  ---  
  ### Distortion Notes  
  1. **Symmetrical Permissions**: The translation *distorts* by implying narrative conventions (*character-level agency*) can replicate *moral* permissions. Narrative can *depict* symmetry but cannot grant it normative force.  
  2. **Focalization Parity**: *Distorts* by conflating *technical* moral equality with *aesthetic* balance. Granting antagonists interiority simulates equivalence but doesn’t entail their actions are morally permissible — only humanized.  
  3. **Plot/Character Separation**: *Collapses* because plot-level framing inevitably influences audience judgment. If the narrative structurally codes one side as unjust (*antagonist framing*), character-level permissions feel contingent, not intrinsically valid.  

  ---  
  ### Residue Analysis: The Untranslatable Core  
  **The Indivisible Moral Kernel**:  
  - The thesis asserts combatants possess **non-relational moral status**. Their equality isn’t derived from narrative balance (*focalization parity*) but from their role as combatants *as such*. Narrative vocabulary cannot encode this deontic status — it can only *represent* it through structural techniques.  

  **Jus ad Bellum / Jus in Bello Separation**:  
  - Translating this as "plot-level moral framing vs. character-level permissions" **smuggles in assumptions the thesis rejects**. Philosophically, *jus in bello* rules are *objectively binding* moral constraints, not narrative conventions. The narrative framework reduces this to *procedural* separation (e.g., "rules of engagement exist"), but cannot capture the thesis’s claim that *even soldiers in an unjust war are morally permitted to kill just soldiers*.  

  **Diegetic Culpability Separation**:  
  - This notion (judging characters by story-world rules, ignoring audience views) **dresses an ambiguity**. Philosophically, a soldier’s moral immunity stems from their function — not from story-world "rules." Narrative *can* depict characters judged solely by diegetic norms (e.g., a "warrior’s code"), but this is a *cultural artifact within the story*, not a moral truth. The thesis insists on universal moral equality, not contingent diegetic norms.  

  **Gap in Craft or Philosophy?**:  
  - The residue reveals a **deficiency in narrative vocabulary**. Literature excels at depicting *subjectivity* (via focalization) and *structural irony* (via plot/character tension), but it cannot encode *non-contingent moral permissions*. The untranslatable element — "combatants are moral equals *because they are combatants*" — is a normative axiom. Narrative can simulate it through *focalization parity* but cannot philosophically ground it.  
  - Conversely, the thesis’s distinction between *role* and *cause* relies on abstract moral agency — a concept narrative dissolves into *character psychology* and *audience sympathy*.  

  ---  
  ### Verdict  
  \answer{The untranslatable residue exposes a limitation in narrative craft: it can depict the *structure* of moral equality but not its deontic foundation, revealing that the philosophical thesis depends on non-narratable moral axioms.}
