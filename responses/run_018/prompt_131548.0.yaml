answer: |-
  ### Final Examination Question: Philosophy of Language  
  **Time Allowed:** 45 minutes (within 90-minute exam)  
  **Total Marks:** 25  

  ---

  **Scenario:**  
  On Earth, the term "jade" is applied to objects exhibiting a cluster of macro-properties: green color, hardness, and translucency. Geological experts are divided: some assert that "jade" refers to two distinct minerals (jadeite and nephrite) with different chemical structures, while others insist both belong to a single natural kind. Ordinary speakers use "jade" based on macro-properties and defer to experts for precise application.  

  On Twin Earth, objects with identical macro-properties (green color, hardness, translucency) exist. However, their underlying chemical structures are entirely different from *both* jadeite and nephrite and constitute a novel mineral. Crucially, Twin Earth experts unanimously agree that these objects belong to *one* natural kind, and ordinary speakers defer to this consensus.  

  **Questions:**  
  1. Do Earth and Twin Earth speakers share the same reference for the term "jade"? Justify your answer using semantic externalism.  
  2. Does the expert disagreement on Earth undermine semantic externalism’s claim that reference is fixed by actual environmental kinds? Explain why or why not.  
  3. Could an internalist descriptivist account (e.g., defining "jade" by its macro-properties) resolve this case without committing ordinary speakers to massive reference failure? Defend your view.  

  ---

  ### Model Answer (700 words)  
  **Question 1: Reference Identity**  
  Earth and Twin Earth speakers do **not** share the same reference for "jade" under semantic externalism. Externalism holds that reference depends on a term’s causal-historical connection to objective kinds in the environment. On Earth, "jade" either refers ambiguously to jadeite/nephrite or to a disjunctive kind (pending expert resolution), but crucially, its extension is anchored to *Earth-specific minerals*. On Twin Earth, "jade" refers to a chemically distinct mineral unified by local expert consensus. Since the micro-structures in both environments differ radically—and neither planet’s mineral matches the other’s—the extensions of "jade" diverge. Macro-property identity is insufficient for reference identity; externalism requires sameness of underlying natural kind(s), which is absent here.  

  **Question 2: Expert Disagreement and Externalism**  
  Expert disagreement on Earth does **not** undermine semantic externalism. Externalism asserts that reference is fixed by the *actual* state of the environment, not by speaker consensus or descriptive criteria. Earth’s expert indeterminacy reflects an ontological ambiguity in nature itself (i.e., whether jadeite/nephrite form one kind or two). This is a metaphysical issue, not a semantic flaw. Ordinary speakers defer to experts via the *division of linguistic labor*, but their deferral is to a future scientific resolution of the kind’s boundaries. Externalism accommodates such cases by allowing reference to be initially *partial* or *deferred*: the term "jade" rigidly designates whatever minerals in the actual environment cause its use, even if experts haven’t fully cataloged them. Thus, disagreement highlights the objectivity of reference-fixing—it depends on the world’s structure, not epistemic agreement.  

  **Question 3: Descriptivism and Reference Failure**  
  An internalist descriptivist account (defining "jade" as "the mineral with green color, hardness, and translucency") **cannot** resolve this case without massive reference failure. Descriptivism would equate the meaning of "jade" with its macro-properties, making reference identical on Earth and Twin Earth due to property overlap. However, this collapses three distinct scenarios into one:  
  - On Earth, "jade" correctly picks out jadeite/nephrite.  
  - On Twin Earth, it falsely designates a chemically alien mineral.  
  - For Earth speakers, descriptivism ignores the possibility that experts might ultimately split "jade" into two kinds (jadeite vs. nephrite), rendering all prior uses partially inaccurate.  

  Ordinary speakers would thus suffer massive error: on Twin Earth, they misapply "jade" to a non-jade mineral; on Earth, they overlook the potential bifurcation of the kind. Only externalism avoids this by indexing reference to local environments. Descriptivism’s appeal to macro-properties as necessary and sufficient conditions fails because Twin Earth’s mineral satisfies all descriptions but belongs to a different kind.  

  **Conclusion**  
  The "jade" case reinforces semantic externalism’s core tenets: reference depends on objective environmental kinds, not speaker intuitions or descriptions. Expert disagreement reveals ontological complexity in nature, not semantic indeterminacy, while the division of linguistic labor allows ordinary speakers to defer reference-fixing to future discoveries. Descriptivism, by contrast, cannot handle micro-structural divergence without attributing widespread error.  

  ---

  ### Marking Scheme (Total: 25 Marks)  
  #### **A-Level Response (21–25 marks)**  
  - **Q1 (8 marks):**  
    - Clearly states reference differs (2 marks).  
    - Justifies via externalism’s dependence on *actual micro-structures*, not macro-properties (3 marks).  
    - Explains asymmetric linguistic labor: Earth’s deference to unresolved experts vs. Twin Earth’s false consensus (3 marks).  
  - **Q2 (8 marks):**  
    - Argues expert disagreement does *not* refute externalism (2 marks).  
    - Distinguishes semantic reference-fixing (world-dependent) from epistemic uncertainty (3 marks).  
    - Analyzes linguistic labor as enabling deference to *future* scientific resolution (3 marks).  
  - **Q3 (9 marks):**  
    - Rejects descriptivism’s viability (2 marks).  
    - Demonstrates threefold reference failure (Earth bifurcation, Twin Earth misapplication, macro-property overreach) (4 marks).  
    - Contrasts externalism’s local-environment indexing with descriptivism’s "universal description" fallacy (3 marks).  

  #### **B-Level Response (16–20 marks)**  
  - **Q1 (6–7 marks):** Correctly identifies reference difference but omits analysis of linguistic labor’s role OR conflates micro-structure with "essence" without addressing expert indeterminacy.  
  - **Q2 (6–7 marks):** Defends externalism but treats expert disagreement as merely "temporary," not rooted in metaphysical ambiguity; or underdeveloped link to linguistic labor.  
  - **Q3 (7–8 marks):** Identifies descriptivist problems but only cites Twin Earth macro-property mismatch; fails to address Earth’s potential reference bifurcation.  

  #### **C-Level or Below (≤15 marks)**  
  - Recurring misconceptions:  
    - −3 marks: Treating expert disagreement as automatic refutation of externalism.  
    - −3 marks: Conflating semantic externalism with causal *theory of reference* (e.g., requiring direct perceptual contact).  
    - −2 marks: Assuming macro-property identity = meaning identity.  
    - −2 marks: Claiming linguistic labor "fixes" reference independently of environment.  
    − **Automatic ≤10 marks:** Ignoring the scenario’s asymmetries (e.g., Earth’s expert split vs. Twin Earth’s consensus).  

  #### Key Distinctions:  
  - **A vs. B:** A responses *explicitly tie linguistic labor to ontological pluralism* (e.g., "Earth speakers defer to experts who may split the kind, while Twin Earth’s false consensus masks micro-structural difference"). B responses note linguistic labor but not its interaction with environmental facts.  
  - Top marks require synthesizing all three questions (e.g., showing how Q2’s expert disagreement reinforces Q1’s reference divergence *because* of externalism).  

  ---  
  This exam tests mastery of externalism’s machinery by forcing students to navigate ontological ambiguity, asymmetric deference, and the limits of descriptivism—without relying on rehearsed examples.
