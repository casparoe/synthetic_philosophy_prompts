  ### **Setup**  
  1. **Estates & Roles** (Assign secretly; each estate has 4 participants):  
     - **Producers**: Control resource extraction. *Hidden Incentive*: Maximize short-term surplus (extract ≥2 units above scarcity threshold) to gain leisure time.  
     - **Administrators**: Set rules and mediate conflicts. *Hidden Incentive*: Centralize decision-making power (ensure their estate proposes/votes for the winning option in ≥2 rounds).  
     - **Interpreters**: Define knowledge and rituals. *Hidden Incentive*: Allocate ≥1 resource unit to symbolic/ceremonial activities in ≥2 rounds.  

  2. **Materials**:  
     - Role cards with hidden incentives (distributed privately).  
     - Base Condition cards (for facilitator only; see below).  
     - Voting tokens (each participant gets one).  
     - Timer, whiteboard (track decisions/scarcity thresholds).  

  ---

  ### **Rules & Timeline**  
  **Total: 3 rounds (40 min each = 20 min deliberation + 10 min decision + 10 min revelation)**  
  **Collective Goal:** Avoid "crisis" (failing to meet scarcity threshold in any round). Crisis = collective loss.  

  #### **Round 1: Resource-Extraction Rule (Legal Superstructure)**  
  - **Facilitator Reveals Base Condition A**:  
    *"Technology: Extract Resource X only (efficiency: 5 units max). Scarcity Threshold: 4 units."*  
  - **Deliberation (20 min)**:  
    - Estates meet separately (7 min), then collectively (13 min).  
    - **Producers** propose extraction rules (e.g., "Private property," "Communal sharing").  
    - **Administrators** mediate proposals; **Interpreters** frame moral/legal justifications.  
  - **Decision (10 min)**: Vote on one rule (e.g., "Private property: Extract 5 units if enforced").  
  - **Revelation (10 min)**:  
    - Facilitator announces if scarcity was met (e.g., "5 units extracted: surplus! No crisis.").  
    - **Silently shift base**: New Base Condition B based on the rule.  
      *Example*: If "private property" passed, *Base B*: "Resource X now includes previously 'waste' material (efficiency: 8 units). Scarcity Threshold: 6 units."  

  #### **Round 2: Research Priority (Scientific Superstructure)**  
  - **Facilitator Reveals Base Condition B** (e.g., resource efficiency increased after Round 1).  
  - **Deliberation (20 min)**: Same structure.  
    - **Interpreters** propose research (e.g., "Study Resource X chemistry," "Map celestial patterns").  
    - **Producers**/Administrators negotiate resource allocation.  
  - **Decision (10 min)**: Vote on one research priority.  
  - **Revelation (10 min)**:  
    - Scarcity outcome announced.  
    - **Base shifts again**:  
      *Example*: If "celestial patterns" passed, *Base C*: "Resource X reclassified as 'sacred'; only extractable via ritual. Efficiency drops to 3 units. Scarcity Threshold: 2 units."  

  #### **Round 3: Ceremonial Obligation (Ritual Superstructure)**  
  - **Facilitator Reveals Base Condition C** (e.g., resource access now ritual-dependent).  
  - **Deliberation/Decision (30 min)**: Same as prior rounds.  
    - **Interpreters** design rituals; others debate practicality.  
  - **Final Revelation**:  
    - Announce scarcity outcomes for all rounds.  
    - Declare collective win (no crises) or loss.  

  ---

  ### **Debrief (15 min)**  
  **Map to Marxist Concepts**:  
  1. **Base**: Initial technology/scarcity (Round 1 Condition A).  
  2. **Superstructure**: Legal (Round 1), scientific (Round 2), ritual (Round 3) choices.  
  3. **Reverse Determination**:  
     - How did the legal rule (Round 1) redefine "resources" in Base B?  
     - How did research (Round 2) alter what counted as "extraction" in Base C?  
  4. **Relative Autonomy**: Estates had agency, but within base constraints.  
  5. **Determination "in the last instance"**: Did the base *ultimately* shape outcomes?  

  **Critical Reflection Questions**:  
  - "When did you feel the base *pushing* your choices? When did your choices *redefine* the base?"  
  - "Identify moments where causation felt 'upward' (superstructure → base) vs. 'downward' (base → superstructure)."  

  **Explicit Limitations**:  
  - ⚠️ **Time Compression**: Historical materialism operates across generations; this simulates moments in a lab.  
  - ⚠️ **Macro Patterns**: Small groups can’t replicate societal-scale statistical trends.  
  - ⚠️ **Facilitator ≠ History**: Rule shifts are engineered to *model* reverse determination—not emergent causality. *Correct this by*: Emphasizing that irl, reverse determination arises from institutional feedback loops, not a designer.  

  **Conceptual Takeaway**:  
  The simulation makes historical materialism feel *fragile* because the "base" is never raw or neutral—it is always filtered through superstructural categories (e.g., "sacred" vs. "productive" resources). It feels *forceful* because scarcity and technology constrain choices. The tension lies in whether the base is a "thing" or a *relationship* defined by superstructure.  

  ---

  ### **Facilitator Script**  
  **Key Mechanics**:  
  - Scarcity thresholds must be *just* achievable (e.g., Round 1 threshold = 4 units, max extraction = 5).  
  - Base shifts must *visibly* alter the "economic" landscape:  
    - **Round 1 → Base B**: Legal rule redefines resource efficiency/availability.  
    - **Round 2 → Base C**: Research redefines extraction methods.  
    - **Round 3**: Ceremony redefines labor/resource value.  

  **Sample Base Shifts (Tailor to group choices)**:  
  - If producers prioritize surplus in Round 1: *"New tech lets you extract Resource X more efficiently, but depletes soil—scarcity rises."*  
  - If interpreters allocate resources to ritual in Round 3: *"Ritual labor now counts as 'production'—scarcity threshold drops."*  

  **Manage Tensions**:  
  - Highlight conflicts (e.g., administrators centralizing vs. interpreters seeking symbolic allocations).  
  - In debrief, stress: "Did the base feel like a 'fixed' reality, or something reshaped by your decisions?"  

  **Timing**: Enforce strict cutoffs. If rounds run long, shorten deliberation. Goal is experiential disorientation, not "solving" the game.  

  ---
  This simulation uses constrained choices and engineered feedback to make reverse determination *visceral*. Participants leave grasping why historical materialism is neither a tidy formula nor easily dismissed—but a dialectic where base and superstructure ceaselessly reconfigure each other.
