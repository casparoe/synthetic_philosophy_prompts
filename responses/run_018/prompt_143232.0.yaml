  2. **Deliberation and Decision:** Same structure.  
  3. **Revelation:** Announce extraction for Round 3 and overall outcome (how many crises).  

  ### Debrief (15 minutes)
  1. **Map to Concepts:**  
     - Base: The given technological constraints and scarcity thresholds.  
     - Superstructure: The legal, research, and ceremonial decisions.  
     - Relative Autonomy: Estates had freedom to choose, but within base constraints.  
     - Reverse Determination: How each superstructural choice redefined the base for the next round.  
  2. **Reflection Questions:**  
     - When did you feel the base determining your choices? (e.g., "We had to choose a high-extraction rule in Round 1 to meet the threshold.")  
     - When did you feel your choices redefining the base? (e.g., "After we chose private property, suddenly new resources appeared.")  
  3. **Limitations:**  
     - The simulation compresses time (real reverse determination takes generations).  
     - The facilitator's rules are engineered; in reality, the causality is emergent and statistical.  
     - The goal was not to prove/disprove historical materialism, but to feel its tension: the base is real and constraining, but it is never experienced independently of the superstructural categories that define it.  

  **Final Note:** The simulation’s engineered shifts illustrate how superstructural categories (like property law) can redefine what counts as a resource, but in reality, this occurs through complex, long-term processes. The takeaway: historical materialism’s “base” is both solid (it constrains) and elusive (it is always mediated by the superstructure).
