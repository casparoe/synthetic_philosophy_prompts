prompt: |-
  I am a doctoral student in philosophy of economics currently working through the literature on cardinal social welfare, and in a recent study-group session a colleague offered the following summary of Harsanyi's 1955 aggregation theorem. He said that if both individual preferences and the collective preference relation over risky prospects satisfy the von Neumann-Morgenstern rationality axioms, then social welfare must be a weighted linear sum of individual cardinal utility functions, with the weights uniquely determined up to a common scale factor. Because these weights are mechanically fixed by rationality alone, he argued, interpersonal comparison of utility needs no separate ethical calibration; therefore Arrow's impossibility result is dissolved once risk is present, leaving only the technical task of selecting a normalization constant. He then extended this to intergenerational climate-policy evaluation, proposing that future generations' heterogeneous risk attitudes can be inserted directly into the same linear formula without any further normative framework for weighting lives across time. I feel this conflates the formal structure of the theorem with its ethical interpretation, and possibly confuses Arrow's ordinal deterministic framework with Harsanyi's cardinal risky one, but I lack the precision to isolate every error. Please adopt the persona of an expert in formal social-choice theory, think carefully, and begin with brief internal brainstorming. Then audit the summary in exactly five numbered items, each consisting of one or two sentences and containing no introduction or conclusion: for each item identify whether the claim is accurate, a common simplification, or a misrepresentation; state what a defender of Harsanyi's view would correct; and say whether the conclusion drawn actually survives that correction.
reasoning: |-
  Okay, the user is a doctoral student in philosophy of economics, focusing on cardinal social welfare. They're grappling with a colleague's interpretation of Harsanyi's 1955 aggregation theorem during a study group. The colleague claimed that under vNM rationality axioms, social welfare must be a weighted linear sum of individual utilities, with weights mechanically fixed by rationality, eliminating the need for interpersonal utility comparisons. This leads to dismissing Arrow's impossibility theorem and applying the formula directly to intergenerational climate policy without additional normative frameworks. The user feels this conflates formal structure with ethical interpretation but needs help pinpointing the errors.

  First, I need to recall Harsanyi's theorem accurately. It assumes that both individual and social preferences satisfy the vNM axioms, leading to a linear aggregation where social utility is a weighted sum of individual utilities. But the weights here are arbitrary positive constants. Harsanyi's original 1955 paper emphasizes that these weights represent ethical value judgments about whose utility matters more. So the colleague is wrong in saying rationality alone fixes the weights—they require normative input.

  Next, Arrow's impossibility theorem operates in an ordinal world without interpersonal comparisons, while Harsanyi's framework is cardinal and allows for such comparisons via the weights. The colleague thinks Harsanyi dissolves Arrow's result, but actually, they address different problems. Arrow's constraints don't apply directly here because Harsanyi's setup includes more information (cardinal utilities and interpersonal weights). So that's a misrepresentation.

  Regarding interpersonal comparisons, Harsanyi doesn't bypass the need for them. The weights are precisely how interpersonal comparisons are made—deciding that one person's utility gain counts more than another's is an ethical choice. The colleague's claim that no separate calibration is needed ignores that the weights are the calibration mechanism itself. This is a critical error in their summary.

  For the intergenerational extension, applying the linear formula to future generations assumes that we can simply plug in risk attitudes. But this overlooks that the weights across generations involve ethical decisions about discounting future welfare, which isn't resolved by the theorem. The theorem's structure doesn't specify how to weigh different times; that's a normative gap, especially in climate policy where future generations' interests are at stake.

  Finally, the colleague's conclusion about Harsanyi dissolving Arrow's theorem and enabling direct application to policy without extra norms is flawed. The theorem provides a mathematical form but doesn't escape ethical deliberation. The weights need ethical justification, and Arrow's result still stands in its original ordinal context. The user's suspicion about conflation between formal structure and interpretation is spot on—the colleague is overstepping what the theorem can do.
answer: |-
  **Internal Brainstorming:**  
  Harsanyi's theorem establishes that under vNM rationality, social preferences must be a *linear* aggregation of individual vNM utilities. However, the weights are *not* determined solely by rationality; they require ethical choice. Arrow’s theorem operates under ordinalism without interpersonal comparisons, while Harsanyi assumes cardinality and permits comparisons via weights. The colleague conflates mathematical structure with normative sufficiency, especially in intertemporal applications where discounting ethics are unresolved.  

  **Audit in Five Numbered Items:**  

  1.  **Claim:** Social welfare *must* be a weighted linear sum under vNM axioms.  
      **Accuracy:** Accurate, per Harsanyi’s representation theorem.  
      **Correction:** A defender would affirm this as the core mathematical result.  
      **Conclusion Survival:** Yes — the functional form holds.  

  2.  **Claim:** Weights are "mechanically fixed by rationality alone" and "uniquely determined up to a common scale factor."  
      **Misrepresentation:** False; weights are arbitrary positive constants reflecting ethical weightings.  
      **Correction:** Rationality constrains the *form* (linearity) but not the *weights*, which are normative.  
      **Conclusion Survival:** No — ethical calibration of weights is essential.  

  3.  **Claim:** Interpersonal utility comparison "needs no separate ethical calibration."  
      **Common Simplification:** Misguided; weights *are* the calibration mechanism.  
      **Correction:** Weights embody interpersonal comparisons (e.g., whose utility gains matter more), requiring ethical justification.  
      **Conclusion Survival:** No — ethical input defines the comparisons.  

  4.  **Claim:** Arrow’s impossibility is "dissolved once risk is present."  
      **Misrepresentation:** Incomplete; Arrow and Harsanyi address distinct frameworks.  
      **Correction:** Arrow’s theorem assumes ordinal preferences without interpersonal comparisons, while Harsanyi assumes cardinality/comparisons — hence no direct dissolution.  
      **Conclusion Survival:** Partially — impossibility avoids Harsanyi’s premises, but risk doesn’t inherently resolve Arrow.  

  5.  **Claim:** Future generations’ risk attitudes can be inserted into the linear formula "without any further normative framework."  
      **Misrepresentation:** Dangerous overextension; intergenerational weights require ethical choices (e.g., discounting).  
      **Correction:** The theorem’s form applies, but weights across time/generations demand normative deliberation (e.g., pure time preference).  
      **Conclusion Survival:** No — intertemporal justice necessitates additional ethical scaffolding.
