  Here's the gut-level logic: The deeper problem isn't just that saints sacrifice art or fun *for* morality (external competition). It's that pushing morality itself towards a theoretical "maximum" breaks its internal structure. Morality isn't one monolithic thing you can infinitely crank up. Real moral value arises from context, balance, and other values being present. Imagine "maxing out" honesty: brutally telling every harsh truth destroys trust and kindness – core moral goods themselves. Or "maxing out" self-sacrifice: constantly neglecting yourself cripples your ability to be genuinely compassionate for others. True moral excellence requires judgment, knowing when to apply which principle, and integrating morality into a *human* life where friendship and beauty also hold value. Trying to "max" it ignores this inherent need for proportionality and context, making the very concept of a "maximally good" agent incoherent – it collapses under its own demands.
