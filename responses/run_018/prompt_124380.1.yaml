prompt: |-
  I'm framing the evaluation chapter of my dissertation on moral aggregation, and I want to avoid comparing specific theories before I have the full specification of adequacy. Write the desiderata that any theory of whether the number of people at risk should determine rescue priority must meet—taking Taurek's rejection of pure numerical aggregation in life-saving conflicts as a constraint to be respected, not an intuition to be dissolved. For each desideratum, state the motivating case or consideration behind it.

  The list must cover: (1) the cases any adequate theory has to get right—standard pairwise rescue (one child versus five strangers in separate ponds), unequal-cost variants (saving the many requires abandoning the one who is closer or already being aided), and what I will call distributed moral proximity, where potential rescuers are embedded in social networks of varying density and causal connection to victims, so the binary framing of one-versus-many collapses into graded relational structures; (2) the distinctions it must preserve—between having moral status and being the object of a particular duty, between ex ante decision rules and ex post evaluation of outcomes, and between causal efficacy and the moral reason that justifies action; (3) consistency conditions with settled empirical and theoretical results—findings from moral psychology that people reject aggregation in concrete named-victim cases but accept it in abstract statistical framing, and constraints from decision theory that cannot be contradicted without serious cost; (4) tensions and possible joint unsatisfiability—especially whether respecting anti-aggregation in direct rescue can be maintained together with requiring consistency across network-structured obligations, and flag any subset of requirements you think is jointly unsatisfiable.

  Mark which requirements are non-negotiable (those that preserve the core anti-aggregation intuition without collapsing into arbitrariness) and which reflect camp-specific preferences (e.g., determinism of duty, universalizability, or relational priority). Keep the weight on the criteria and their motivating cases rather than on scoring existing accounts, though a brief note on how utilitarian, contractualist, and relational approaches fare against the list is welcome.

  Please separate what is settled—such as that the pond-case intuition against pure aggregation is widely shared even among aggregationists—from what is genuinely contested, including whether distributed moral proximity undermines the binary framing or merely complicates it, and whether ex post evaluation can be cleanly separated from ex ante duty. Do not present any contested interpretation of the anti-aggregation argument as the consensus view among specialists in the field.
reasoning: |-
  Okay, the user is framing the evaluation chapter of their dissertation on moral aggregation, specifically focusing on when the number of people at risk should determine rescue priority. They want desiderata for theories that respect Taurek's rejection of pure numerical aggregation. Let me unpack their requirements.

  First, they need desiderata covering different cases: standard pairwise rescues (like one vs. five in separate ponds), unequal-cost variants (abandoning someone already being aided), and distributed moral proximity involving social networks. That last one is interesting—moving beyond binary scenarios to graded relational structures. 

  For distinctions, they mention moral status vs. duties, ex ante rules vs. ex post evaluation, and causal efficacy vs. justifying reasons. I should ensure each desideratum clearly ties to these. The ex ante/ex post distinction seems particularly tricky—some philosophers argue they can't be fully separated, but the user wants it flagged as contested.

  Consistency conditions involve empirical findings (like named-victim effects) and decision-theory constraints. The tension between psychology and normative theory is thorny—people reject aggregation for identifiable victims but accept it statistically. How to handle that without compromising anti-aggregation? Also, decision theory's transitivity is a hard constraint; violating it invites money pumps, so that's non-negotiable. 

  Tensions section is crucial. The user suspects distributed proximity might undermine anti-aggregation. If A has stronger ties to one victim but weaker to five others, can prioritizing the one hold? Relational approaches might handle this better, but contractualists could argue universal duties persist. I should mark this as a likely joint unsatisfiability hotspot.

  Non-negotiables: Core anti-aggregation (Desideratum 1), transitivity (D6), and the moral status/duty distinction (D9) seem essential. Camp-specific preferences include determinism of duties (D7) and universalizability (D13). The user wants utilitarian/contractualist/relational approaches noted briefly—utilitarians fail D1, contractualists struggle with D8's ex post evaluation, relationalists ace D4 but risk parochialism.

  Settled vs. contested: Anti-aggregation intuition in pond cases is settled. Contested points: whether distributed proximity destroys binary framing (D4) and if ex post/ex ante can be separated (D8). Must avoid presenting Taurek's interpretation as consensus—specialists debate whether his view permits weighted lotteries or requires coin-flips.

  User's deeper needs: They're likely navigating how strict Taurek's constraint can be before becoming unworkable in complex networks. The dissertation probably aims to show either that anti-aggregation must bend (but how?) or that relational structures salvage it. Highlighting tensions (D14-D15) serves that perfectly.
answer: |-
  Here is a structured list of desiderata for evaluating theories of rescue priority under a Taurekian anti-aggregation constraint, organized by your requirements. Non-negotiable desiderata (**N**) preserve the core intuition without arbitrariness; camp-specific preferences (**C**) reflect theoretical orientations that may be contested.

  ---

  ### **I. Case-Based Desiderata** (Must "Get Right" Key Scenarios)
  1.  **Core Anti-Aggregation (Pairwise Rescue):** The theory must *not* mandate saving the greater number in a standard pairwise conflict (e.g., saving one identified child vs. five identified strangers in separate ponds, where saving both groups is impossible and no other morally relevant asymmetries exist).  
      *   **Motivation:** Taurek's core case. Respects the intuition that each individual's loss is non-fungible and that saving one person isn't outweighed by failing to save others. (**N**)  
  2.  **Unequal Cost (Abandonment):** The theory must explain why it is (or is not) permissible to abandon an individual already being aided (or closer to rescue) to save a greater number elsewhere, especially when the abandonment *causes* their death.  
      *   **Motivation:** Cases where initiating aid creates a special obligation or where physical proximity/causal involvement increases cost. Tests whether the theory distinguishes causing harm from allowing harm or recognizes incurred duties. (**N** for requiring an explanation; **C** on the *content* of the explanation)  
  3.  **Distributed Moral Proximity (Networked Obligations):** The theory must account for rescue obligations arising from varying degrees of relational connection (e.g., family, community, professional role, causal history) in complex networks, where potential rescuers may have stronger obligations to some at-risk individuals than others, and where "one vs. many" is blurred.  
      *   **Motivation:** Real-world contexts where rescuers (e.g., disaster responders, community leaders) have pre-existing, graded relationships to victims. Challenges the atomistic, binary framing of standard cases. Must avoid collapsing into simple aggregation or complete arbitrariness. (**N** for requiring an account; **C** on the *weight* given to proximity)  
      *   **Settled:** The binary framing *is* challenged by relational realities. **Contested:** Whether this *undermines* anti-aggregation's core or merely *complicates* its application without negating it.

  ---

  ### **II. Conceptual Distinctions** (Must Preserve)
  4.  **Moral Status vs. Object of Duty:** The theory must distinguish between an individual's intrinsic moral status (which is equal) and the existence, strength, or content of a *specific duty* owed *to them* by a *particular agent* in a given context.  
      *   **Motivation:** Anti-aggregation denies that greater numbers create stronger *claims* on a rescuer, but this doesn't imply unequal moral worth. Duties can be agent-relative and relationally grounded. (**N**)  
  5.  **Ex Ante Rules vs. Ex Post Evaluation:** The theory must distinguish the moral evaluation of a *decision procedure* or *rule* guiding action under uncertainty (ex ante) from the moral evaluation of the *outcome* once all facts are known (ex post).  
      *   **Motivation:** One might regret an outcome (e.g., only one saved by coin flip when five could have been saved) without condemning the decision rule (fair chance for each). Conversely, a good outcome (saving five) doesn't necessarily justify an unfair rule. (**N**)  
      *   **Contested:** Whether a "clean" separation is possible or if ex post evaluation necessarily informs ex ante duty (e.g., through expected value).  
  6.  **Causal Efficacy vs. Justifying Reason:** The theory must distinguish the *causal power* to bring about an outcome (saving lives) from the *moral reason* that justifies choosing one action over another.  
      *   **Motivation:** Taurek argues the *reason* to save a life is the value *to that person* of being saved, not the impersonal goodness of "more lives saved." Efficiency is causal, not necessarily justificatory. (**N**)  

  ---

  ### **III. Consistency Conditions** (With Settled Findings & Theory)
  7.  **Decision-Theoretic Coherence (Transitivity):** The theory's choice rules must satisfy basic requirements of rational choice (e.g., transitivity of preference/choice) or provide a compelling justification for why they do not, avoiding straightforward "money pump" scenarios.  
      *   **Motivation:** Foundational to rational decision-making. Violations lead to exploitable inconsistencies. E.g., If A > B, B > C, but C > A, an agent can be made worse off through a series of "rational" trades. (**N**)  
  8.  **Named-Victim Effect Compatibility:** The theory must be compatible with the robust empirical finding ("identifiable victim effect") that people strongly favor saving identified individuals over statistical lives, without simply dismissing this as irrational bias.  
      *   **Motivation:** Psychological reality constrains plausible normative theories. The anti-aggregation intuition peaks in "identified victim" scenarios like the pond case. (**N** for compatibility; **C** on whether psychology *justifies* the norm)  
      *   **Settled:** The pond-case intuition against pure aggregation *is* widely shared and empirically robust.  

  ---

  ### **IV. Tensions & Joint Unsatisfiability** (Flagged Conflicts)
  9.  **Network Consistency vs. Anti-Aggregation:** The theory must address the tension between respecting strong relational duties in distributed networks (e.g., prioritizing kin) and maintaining consistency across the network. Can one consistently endorse Agent A prioritizing their child over 5 strangers *and* Agent B (with no special ties) prioritizing 5 strangers over 1, *without* implicitly endorsing aggregation at a systemic level or creating morally arbitrary differences?  
      *   **Motivation:** Relational duties risk parochialism or inconsistency. Systemic effects might mimic aggregation. (**Flagged as Major Tension**)  
  10. **Ex Post Regret vs. Ex Ante Justification:** Can the theory coherently maintain that an ex ante justified decision (e.g., fair lottery) remains justified ex post even when the outcome is deeply regrettable (e.g., only one saved when five could have been), without undermining the force of the ex post evaluation or collapsing into consequentialism?  
      *   **Motivation:** Anti-aggregation often accepts regrettable outcomes. The challenge is explaining the *source* of regret without conceding that "more saved" is the ultimate value. (**Flagged as Tension**)  
  11. **Joint Unsatisfiability Suspected:** It may be **impossible** to simultaneously satisfy:  
      *   (D1) Strict anti-aggregation in pairwise cases.  
      *   (D3) A coherent, non-arbitrary account of distributed moral proximity that doesn't lead to systemic aggregation.  
      *   (D7) Strict adherence to transitivity in complex network choices.  
      *   **Motivation:** Relational weighting in networks may force trade-offs resembling aggregation, and maintaining transitivity across such weighted choices might necessitate counting numbers in ways that violate D1's spirit.  

  ---

  ### **V. Non-Negotiable vs. Camp-Specific**
  *   **Non-Negotiable (N):** 1 (Core Anti-Aggregation), 4 (Status vs. Duty), 5 (Ex Ante/Ex Post Distinction - the distinction itself), 6 (Cause vs. Reason), 7 (Transitivity Coherence), 8 (Named-Victim Compatibility). These preserve the core Taurekian constraint and basic rationality/consistency without collapsing into arbitrariness.
  *   **Camp-Specific (C):**  
      *   **Determinism of Duty (implied in D2, D3):** Whether duties in rescue are always determinate (Kantian/Deontological leanings) or can be underdetermined, requiring discretion/lotteries (Taurekian/Some Relational).  
      *   **Universalizability (D9 tension):** Whether duties must be universalizable across agents (Kantian/Contractualist) or can be fundamentally agent-relative (Relational/Some Particularist).  
      *   **Relational Priority (D3):** The *degree* to which relational proximity grounds or intensifies duties is a major fault line (Relational vs. Contractualist/Utilitarian).  
      *   **Scope of "Rescuer" (D3):** Who counts as a relevant "rescuer" in distributed cases? (Broad/Impartial vs. Narrow/Relational views).

  ---

  ### **Brief Note on Major Approaches**
  *   **Utilitarianism:** Fails D1, D2 (as usually interpreted), D6 fundamentally. Excels at D7, D3 (if proximity reduces cost), D5 ex ante (expected utility). Struggles with D4, D8 compatibility.
  *   **Contractualism (Scanlon-style):** Can satisfy D1 by focusing on justifiability to each. Handles D2, D4, D5 well. Struggles with D3 (relational duties), D6 (reason vs. cause), and potentially D9 (network consistency/universalizability). May accommodate D8 better than Utilitarianism.
  *   **Relational Approaches:** Excel at D3, D4, D2 (special obligations). Can satisfy D1 if relations are strictly pairwise/binary. Struggle severely with D7 (transitivity in networks), D9 (systemic consistency/parochialism), and potentially D5 (ex post evaluation of large-scale neglect). D6 is central.
