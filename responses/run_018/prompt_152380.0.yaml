answer: |-
  Here’s a diagnostic decision tree designed to classify positions on compatriot partiality through concrete trade-offs, bypassing traditional labels. The root question focuses on **distributive justice** because it forces the sharpest confrontation with universal moral equality—a pressure point revealing foundational commitments. The tree exposes practical convergence where metaphysical differences fade, and highlights neglected logical possibilities.

  **Diagnostic Decision Tree: The Moral Weight of Compatriot Ties**  
  *(Start at Question 1)*

  ### Root Question: DISTRIBUTIVE CONFLICT
  > **Q1. Severe Need Scenario:**  
  > *A country has resources to fully relieve either severe domestic poverty (afflicting its own citizens) OR an equally severe famine abroad (afflicting non-citizens), but not both. Must it be impartial, or may it prioritize its own citizens?*
  > *   **(A) Must be impartial (flip a coin, or use a neutral criterion like urgency/scale).** → **Go to Q2**
  > *   **(B) May prioritize its own citizens.** → **Go to Q3**

  ### Branch A: Rejecting Distributive Priority
  > **Q2. Basis for Association:**  
  > *If associative ties (like shared history, culture, or institutions) matter morally, does this primarily create:*
  > *   **(A) Special obligations (e.g., loyalty, mutual aid) BUT NOT stronger claims to scarce distributive goods like money or vaccines?** → **Position: INSTITUTIONAL COSMOPOLITANISM**  
  >     *   *(Accepts bonds of shared institutions/democracy as real sources of obligation (e.g., voting, civic participation), but insists distributive justice (who gets material resources) must remain globally impartial. Compatriot ties generate duties of participation/reciprocity, not resource priority.)*
  > *   **(B) No significant special obligations at all; only universal duties bind.** → **Position: PURE COSMOPOLITANISM**  
  >     *   *(Rejects any moral weight to shared identity or institutions. Only individual need or universal human rights matters. Borders are morally arbitrary for all purposes.)*

  ### Branch B: Accepting Distributive Priority
  > **Q3. Strength of Priority:**  
  > *When prioritizing citizens distributively, is this:*
  > *   **(A) A strong presumption/weight, potentially justifying significant disadvantage to equally needy foreigners?** → **Go to Q4**
  > *   **(B) Only a weak "tie-breaker" applying when universal duties are equally met for citizens and foreigners?** → **Position: LIBERAL NATIONALISM (Tie-Breaker)**  
  >     *   *(Accepts strong universal duties to meet basic needs globally. Compatriot partiality only kicks in *after* these duties are fulfilled for all affected parties, breaking ties between equally urgent claims. E.g., fund domestic *and* foreign poverty relief first; surplus can go to less urgent domestic projects.)*

  ### Branch A (from Q3): Strong Priority
  > **Q4. Source of Priority:**  
  > *Is the primary justification for strong compatriot priority:*
  > *   **(A) Shared identity, culture, or history (even if defined "civically" like shared values)?** → **Go to Q5**
  > *   **(B) Shared institutions (like law, democracy, co-governance) and the reciprocal obligations they create?** → **Position: POLITICAL CONTRACTUALISM / REPUBLICAN PATRIOTISM**  
  >     *   *(Priority stems from the cooperative project of self-governance. Co-citizens are bound by shared rules, mutual defense, and collective decision-making, generating strong reciprocal duties. This is institutional, not ethnic/cultural.)*

  ### Branch A (from Q4): Identity/Culture-Based
  > **Q5. Cultural Preservation & Exclusion:**  
  > *Can preserving a specific national culture (even if "civic" - e.g., democratic norms, secularism, language) justify excluding immigrants who would significantly change that culture, even if they pose no security/threat and would benefit economically?*
  > *   **(A) Yes, cultural preservation can be a legitimate, primary reason for restrictive immigration.** → **Position: STRONG (CIVIC) NATIONALISM**  
  >     *   *(The shared culture/history/identity itself is a fundamental good worth preserving, generating strong obligations of partiality towards co-members, including restricting membership to preserve the collective good.)*
  > *   **(B) No, cultural preservation alone is insufficient; exclusion requires neutral justifications like fiscal capacity or integration feasibility.** → **Position: MODERATE ASSOCIATIVISM (Distributive Focus)**  
  >     *   *(While shared identity/culture grounds strong *distributive* priority among members ("we take care of our own first"), it does not automatically justify *excluding* others to preserve culture. Immigration restrictions need separate, often instrumental, justifications.)*

  ---

  ### Key Positions Mapped
  *   **Pure Cosmopolitanism:** Q1(A) → Q2(B)
  *   **Institutional Cosmopolitanism:** Q1(A) → Q2(A)
  *   **Liberal Nationalism (Tie-Breaker):** Q1(B) → Q3(B)
  *   **Political Contractualism / Republican Patriotism:** Q1(B) → Q3(A) → Q4(B)
  *   **Moderate Associativism (Distributive Focus):** Q1(B) → Q3(A) → Q4(A) → Q5(B)
  *   **Strong (Civic) Nationalism:** Q1(B) → Q3(A) → Q4(A) → Q5(A)

  ---

  ### Logically Possible but Unoccupied Combinations & Gaps
  1.  **Associative Obligations Without State-Level Partiality (Q1A → Q2A is occupied, but what about rejecting *all* associative duties while accepting state partiality?):**  
      *   *Gap:* Accepting Q1(B) (may prioritize citizens distributively) but then rejecting associative ties as the source (e.g., going to Q4B but rejecting institutional bonds). Logically possible justification: pure efficiency ("helping nearby is cheaper/effective").  
      *   *Diagnosis:* **Unattractive/Neglected.** Reducing partiality to efficiency feels morally hollow; it fails to explain why states *owe* this priority *as a duty*, not just as policy. Most who accept priority seek a deeper moral anchor (institutions/identity).
  2.  **Strong Cultural Obligations Without Distributive Priority (Q4A → Q5A but then somehow rejecting Q1B?):**  
      *   *Gap:* Believing culture creates deep bonds justifying exclusion (Q5A) but *not* allowing distributive priority (Q1A).  
      *   *Diagnosis:* **Likely Incoherent.** If the shared culture generates such strong obligations that excluding outsiders to preserve it is justified, it's hard to deny that those same obligations require prioritizing the material well-being of cultural co-members in need. The connection between cultural preservation and mutual aid is strong.

  ---

  ### Design Choices & Commitments Explained
  1.  **Why Distributive Conflict (Q1) as the Root?**  
      Resource allocation pits universal human need against associative claims most starkly. It forces a concrete, high-stakes choice where appeals to abstract loyalty or cultural value must translate into material consequences for suffering individuals. Starting with immigration or culture risks letting symbolic concerns overshadow fundamental questions of life and death. This split reliably sorts "universalist" vs. "partialist" intuitions at the core.
  2.  **Separating Tie-Breaking from Weighting (Q3):**  
      This is crucial. Many positions *sound* similar ("We have duties to foreigners *and* citizens") but diverge radically in practice. The tie-breaker view (Liberal Nationalism) imposes a global sufficiency floor *first*. Strong priority views allow bypassing desperate foreign need for less urgent domestic projects. The tree forces this operational difference into the open. Treating them as distinct nodes is essential for practical diagnosis.
  3.  **Treating Democratic Co-Membership as Morally Weighty (Q4B):**  
      This node isolates the view that *political cooperation itself* – making laws together, defending shared institutions, democratic deliberation – generates unique associative obligations stronger than universal duties, distinct from ethnicity or culture. This is central because it's a major modern alternative to both blood-and-soil nationalism and rootless cosmopolitanism, grounding partiality in reciprocity among participants in a shared project of self-rule. Ignoring it misses a significant swath of contemporary theory (e.g., some republican, liberal nationalist, or Rawlsian-inspired views).
  4.  **Distinguishing Cultural Justification for Exclusion vs. Distribution (Q5):**  
      Not all who ground partiality in culture agree this extends to controlling membership. Some see the cultural community as inherently bounded (justifying exclusion); others see it as generating strong internal duties but not necessarily the right to close borders rigidly (requiring neutral justifications for exclusion). This split reveals whether "culture" is seen as a *constitutive good* worth protecting via boundaries, or primarily as the *source of internal solidarity*.

  ---

  ### Where the Tree Hides Distinctions & Why
  *   **Metaphysical Grounding Concealed:** The tree groups "Strong (Civic) Nationalism" (Q5A) whether grounded in deep cultural identity, shared fate, or perceived historical contract. While metaphysically distinct (e.g., Herder vs. Renan), their practical implications in the diagnostic scenarios converge: strong distributive priority and cultural preservation justifying exclusion. Highlighting this convergence is a *feature*: it shows that for policy purposes, the foundational "why" often matters less than the operational "what" and "how much."
  *   **Convergence Doesn't Undermine, But Contextualizes:** This practical convergence doesn't make the metaphysical distinction meaningless. It matters for resilience (e.g., how the view handles cultural change), rhetoric, and long-term trajectory. However, for diagnosing positions on the *specific trade-offs* central to the compatriot priority debate (distribution, exclusion), these differences often recede behind shared operational commitments. The tree focuses on what drives concrete judgments.

  This tree forces respondents off pre-labeled "teams" by confronting them with costly choices where intuitions about specific obligations, not allegiance to an -ism, determine their path. It reveals the practical core beneath the philosophical superstructure.
