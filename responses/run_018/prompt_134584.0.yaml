answer: |-
  The burn started at the northeast corner – the quadrant of **Affirmation**. Gold lotus petals crisped black, their *yes* curling to ash. Kaelin’s scalpel hovered, excising the char without nicking the fragile paper beneath. Below it, **Negation** – a void deliberately painted, a deep lapis lazuli void – was untouched, cool and profound. To the west, **Both**: intertwined serpents, one swallowing, one birthing, their vermilion bodies half-eaten by the fire’s hunger. South, **Neither**: a field of intricate, unnamable patterns, now dissolved into a sepia stain where flame kissed moisture.

  And then, the center. Not burned, not stained. **Dissolved**.

  Where the cosmic mountain should have pierced the paper, where the axis mundi held all meaning, there was… nothing. Not an absence of image, but the image’s utter surrender. The mineral pigments – malachite green, cinnabar red, orpiment yellow – hadn't charred; they'd bled, vaporized, sunk back into the very fibres of the paper itself. It wasn't blank. It was *saturated*. The paper here felt denser, heavier under Kaelin’s gloved fingertip, a silent, colorless depth. The substrate wasn't holding an image; it *was* the image, inverted, consumed.

  Her own breath felt loud in the conservation lab's sterile quiet. She’d mixed the inks days ago, painstakingly grinding malachite, cinnabar, orpiment on the granite slab, just as the fourteenth-century monk-artist would have. Tiny mortars held their potential: green like crushed forest, red like dried blood, yellow like captured sunlight. To restore the center was possible. Trace the faintest ghost-lines in the paper’s weave, rebuild the mountain, the axis. Make it whole again. Preserve it.

  But Nāgārjuna’s ghost, breathed onto the parchment centuries before the fire, whispered in the dust motes dancing in the lamplight. The tetralemma wasn’t just painted; it *was* the logic of the thing. Affirmation, Negation, Both, Neither. Four corners holding reality in place. And the center… was the center a fifth? Or was it the ground?

  **Emptiness**.

  Not nothingness. Not void. The *dissolved* zone. The place where the *stuff* of the image – the pigment – and the *stuff* of its existence – the paper – were indistinguishable. Where form wasn’t absent, but utterly fused with its basis. To paint over it… wasn’t that like slapping a label on silence? Naming the unnameable? Destroying the very emptiness the mandala might have been straining to depict?

  She dipped the finest brush – kolinsky sable, a single hair’s width – into the distilled water. Touched it to the edge of the dissolved zone. The paper darkened, thirsty. The ghost of a line, perhaps a contour of the cosmic mountain’s base, shimmered faintly, then vanished as the water soaked in. It wasn’t a line to trace; it was the paper *remembering* it had once held a line. The memory was in the fibres, not on them.

  Kaelin lifted the brush. Looked at the waiting pigments. The malachite paste gleamed, potent, *affirming*. The cinnabar, a dark *negation* of the paper’s pale cream. Mixed together, they’d make mud, a *both* that was neither. Leaving it blank felt like *neither* action nor inaction, yet utterly inadequate.

  But to fill it… To assert a form onto that saturated silence… Wasn’t that the ultimate arrogance? Preserving the image by killing the truth it pointed towards? The mandala was a map. The fire had erased a crucial landmark, but revealed the ground the map was drawn *on*. Could she "restore" the ground by drawing another landmark? Or was *this* – the paper holding only the echo of its own consumed image – the most accurate depiction of emptiness possible? The interdependence laid bare. No mountain without paper. No paper without mountain. Both dissolved.

  Her hand trembled. The brush hovered over the dense, silent heart of the mandala. The museum expected restoration. Wholeness. Affirmation of their artifact. Negation of damage. Both conservation and presentation. Neither decay nor ambiguity.

  The dissolved zone stared back. A fifth position. Unpainted. Unpaintable. It wasn't damaged. It was *revealed*.

  Kaelin placed the brush down, sideways, on the granite slab. Not discarded. Just resting. She wouldn't mix the inks for the center. Not today. Maybe not ever. She picked up her bone folder instead, smoothing the delicate edge of the **Both** quadrant, where serpent met ash. The paper sighed under the tool. In the center, the density remained. Not empty. Full. Full of paper. Full of absence. Full of the potential that was every brushstroke, and the dissolution that was its end. She wouldn't fill the void. She would let the void fill her hesitation, her doubt, the quiet hum of the air conditioner, the scent of old paper and crushed stone. It wasn't finished. It was complete. Interdependence, laid bare in silk fibres and mineral dust and the unbearable weight of a decision unmade. The mandala breathed, incomplete, perfectly whole in its brokenness. The fifth zone wasn't a flaw. It was the argument. The silence after the fourth proposition. The paper remembering it was always more than just a surface.
