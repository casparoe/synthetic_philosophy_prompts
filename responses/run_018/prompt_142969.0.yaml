  ### Guest Profile
  "A philosopher defending 'mechanistic exclusivity'—a niche view requiring abductive inferences to invoke concrete causal mechanisms. She applies this to moral psychology, arguing non-causal moral realisms are just-so stories lacking empirical grounding."

  ### Question Sequence
  1. **Initial**: "You argue that non-causal moral realisms are just-so stories because they lack concrete mechanisms. But if evolutionary biology can explain altruism via kin selection *without* invoking moral truths, what stops us from treating mechanistic exclusivity itself as a just-so story—a post hoc rationalization for privileging causality?"  
     **Follow-up**: "If you counter that causal mechanisms are independently verifiable, how do you avoid circularity when your framework *defines* verification as mechanistic?"

  2. **Initial**: "Mechanistic exclusivity dismisses normative moral facts as explanatorily idle. Yet in cognitive neuroscience, 'predictive processing' models treat beliefs about abstract norms as causal forces shaping behavior. Doesn't this empirically demonstrate that non-causal constructs *can* play mechanistic roles?"  
     **Follow-up**: "If you reply that norms reduce to neural mechanisms, why isn’t that reductionism equally applicable to moral facts—allowing them causal efficacy without violating your framework?"

  3. **Initial**: "You claim IBE requires mechanisms to avoid underdetermination. But in institutional sociology, functional explanations (e.g., 'bureaucracies exist to maintain social order') often outperform mechanistic ones. Why privilege causality if non-mechanistic explanations empirically succeed?"  
     **Follow-up**: "If you argue functionalism implicitly relies on mechanisms, what specific experiments could disprove this reduction—or is it unfalsifiable?"

  4. **Initial**: "Quantum mechanics challenges classical causality, yet physicists use non-causal explanations (e.g., symmetry principles) abductively. If your view dismisses these as non-genuine IBE, doesn’t that conflict with science’s most fundamental domain?"  
     **Follow-up**: "If you reinterpret quantum non-causality as 'emergent mechanism,' what criteria distinguish legitimate emergence from ad-hoc patching?"

  5. **Falsification Probe**: "What empirical result—say, institutional sociology identifying norm adoption irreducible to individual psychology or neuroscience finding moral judgments decoupled from causal reasoning—would make you abandon mechanistic exclusivity rather than revise it?"  
     **Follow-up**: "If you’d reinterpret such data mechanistically, how is your view distinguishable from unfalsifiable dogma?"

  ### Anticipated Deflections
  1. "Mechanistic exclusivity avoids circularity because mechanisms are empirically detectable through interventionist methods (e.g., controlled experiments)."
  2. "Predictive processing models still reduce norms to neural mechanisms; moral facts add no *unique* causal power."
  3. "Functionalism’s success is provisional; deeper mechanisms (e.g., individual incentives) will eventually explain social order."
  4. "Quantum non-causality reflects epistemic limits; future physics will discover underlying causal structures."
  5. "No finding could force abandonment; we’d seek deeper mechanisms (e.g., undiscovered neural pathways)."

