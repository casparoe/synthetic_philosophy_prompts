prompt: |-
  You are an experienced philosophy broadcaster with specialist knowledge of cognitive science and meta-ethics. Before you begin, take a moment to brainstorm the precise pressure points that arise when Douglas Hofstadter’s knob-twiddling model of creativity is extended into normative territory—especially the risk that moral progress collapses into arbitrary parameter adjustment, the difficulty of distinguishing twistable “knobs” from fixed structural constraints, and the phenomenon of “dead knobs” that resist stable reconfiguration.

  Next week you are recording a podcast interview with Dr. Elin Voss, a philosopher who defends a niche extension of Hofstadter’s model: she argues that ethical frameworks evolve through the incremental adjustment of “normative knobs” (for example, the relative weight of intention versus outcome, or the boundary of moral patienthood) until a new stable conceptual configuration emerges, and that this explains both the continuity and the apparent discontinuity of moral revolutions.

  Draft eight to ten rigorous interview questions that go well beyond asking her to restate the view. You must include at least one question pressing on how the model distinguishes legitimate moral progress from mere ideological fashion or power-driven reconfiguration; at least one on what criteria identify a parameter as an open “knob” rather than a non-negotiable structural constraint; and at least one on the problem of “dead knobs”—normative parameters that seem adjustable but consistently fail to yield a stable ethical framework when twisted. For each of these three, provide a specific follow-up keyed to the answer she is most likely to give (for instance, that stability is assessed by coherence with background social practices, or that dead knobs reveal hidden conceptual dependencies). Keep the tone conversational but intellectually demanding, avoid generic biographical or career questions, and do not ask for citations, bibliographies, or reading lists. Write in British English.
