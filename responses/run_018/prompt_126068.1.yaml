answer: |-
  Here's an original joke tailored to your request, focusing on the cognitive distinctions in a campus library setting:

  **The Scenario:**  
  Four creatures—Darwinian, Skinnerian, Popperian, and Gregorian—need to find Heidegger’s obscure monograph *Being and Shelving: Ontology in Library Stack Design* in a massive, unfamiliar university library.  

  **The Joke:**  
  The **Darwinian creature** immediately beelined for the brightest light source, instinctively assuming "knowledge = illumination." It spent 20 minutes trapped in a janitor’s closet before security escorted it out.  

  The **Skinnerian creature** wandered the stacks randomly. After bumping into three "Philosophy of Mind" shelves (rewarding it with a dopamine hit) and getting zapped by an electrostatic discharge near the "Electrical Engineering" section (negative reinforcement), it eventually huddled near the "Phenomenology" books, too traumatized to move.  

  Meanwhile, the **Popperian creature** stood frozen in the atrium, eyes squeezed shut, mentally simulating every possible Library of Congress classification permutation. Its brow furrowed deeper as it internally tested and discarded hypotheses: *"If QA76.9 is Computer Science, and B is Philosophy… but Heidegger bridges continental thought *and* spatial analysis… unless BF204.5 applies? No, that’s parapsychology—fatal flaw! Reject! Re-simulate!"*  

  Just then, the **Gregorian creature** strolled past, glanced at a digital map kiosk, asked the librarian "Where’s the book that makes undergrads cry over bookshelf metaphysics?", followed her pointed finger, and returned *holding the monograph* as the Popperian creature was muttering *"...sub-category B3279.H45... but is ‘H’ for Heidegger or Hegel? ABORT SIMULATION!"*  

  The Gregorian raised an eyebrow: **"Why mentally simulate the map when you can *read* the map? Or better yet—ask the map-maker?"**  

  The Popperian creature blinked, neurons overheating: **"I was optimizing my internal model of the external symbolic system!"**  
  The Gregorian sighed: **"Buddy, that’s just thinking *louder*."**  

  ---

  **Why it works for your study group:**  
  1. **Popperian vs. Gregorian Punchline:** The humor turns on the *conceptual* difference: Popperian’s costly internal modeling/error-correction ("mental simulation") vs. Gregorian’s offloading of cognition onto cultural tools (map symbols) and social language (librarian’s directions).  
  2. **All Four Covered:**  
     - *Darwinian:* Hardwired phototaxis leading to irrelevance.  
     - *Skinnerian:* Lifetime learning via environmental rewards/punishments.  
     - *Popperian:* Hypothesis-testing *internally* before action.  
     - *Gregorian:* Leveraging external symbols/social artifacts for instant efficiency.  
  3. **No Cheap Shots:** The joke avoids mocking academics broadly—it satirizes the *cognitive strategy itself* (e.g., Popperian overcomputation, Gregorian’s pragmatic outsourcing).  
  4. **Accurate Campus Struggle:** The obscure text, confusing layout, and librarian interaction ground it in relatable student angst.  

  Perfect for sparking discussion—good luck on the exam!
