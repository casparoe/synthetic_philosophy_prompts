  (4) Drawing an arbitrary line feels definately wrong — like saying people born after midnight don’t count. So we should reject the magic-line option.

  (5) That means thermostats have a tiny but real moral status. Not much, but not zero.

  (6) Here’s where I think it gets weird: if each thermostat has status 0.000001, and I replace ten million of them in a smart-building upgrade, I’ve caused 10 units of harm — more than killing one dog. But nobody thinks renovating a building is a moral atrocity.

