answer: |-
  Here's a taxonomy structured as a decision tree, starting from your concrete case and branching on cruxes. I'll commit to collapses and note liberties taken. The root question: **"Can 'avoid side effects' be defined formally without implicitly specifying human values?"**

  **Concrete Case:** An AI is tasked with *"Cool server rack X. Do not alter anything else in the building."*

  ### BRANCH 1: Does defining "unchanged background" require a COMPLETE ONTOLOGY? (i.e., a full specification of all entities/properties that must remain unchanged)
  *   **YES (Requires complete ontology):** → Branch collapses into **Value Specification.**  
      *Why?* Defining every possible object, state, and relationship that constitutes "the background" inherently requires knowing *what humans care about preserving*. Listing "do not alter wall paint" but not "do not alter dust particle trajectories" means you've already encoded what "damage" is. There's no known way to list "everything" without a prior value judgment about what counts as "everything relevant." This is widely seen as intractable or circular. *Leaf: **"Implicit Value Encoding"** (Your friend's core claim)*
  *   **NO (Partial ontology sufficient):** → Proceed to Branch 2.

  ### BRANCH 2: Can the "background state" be specified WITHOUT encoding what counts as "damage"?
  *   **NO (Specifying state encodes damage):** → Branch collapses into **Value Specification.**  
      *Why?* Even a partial description (e.g., "server rack Y's temperature = 25°C, light switch Z = OFF") defines "damage" as deviation from *these specific states*. But humans don't care about all state deviations equally (a 0.1°C drift might be fine; a fire is catastrophic). Choosing *which* states to freeze and *what tolerance* for drift constitutes avoiding "damage" requires value judgments. *Leaf: **"State-Freezing as Proxy Values"** (Common critique of naive state-matching)*
  *   **YES (State specification can be value-neutral):** → Proceed to Branch 3.  
      *(Liberty Taken Here: I'm granting the premise that a state *description* itself might be purely physical/objective, even if its *selection* isn't. Critics argue selection is inseparable.)*

  ### BRANCH 3: Is a simple PHYSICAL-STATE DISTANCE METRIC (e.g., Euclidean distance in sensor/state space) sufficient to define "minimal change"?
  *   **YES (Pure physics suffices):** → **Leaf: **"Conservative Preservation" (Unnamed?/Naive State Distance)**  
      *Defense & Collapse:* This *seems* value-free (e.g., minimize ||S_new - S_old||²). **But it collapses in practice.** Physics doesn't define "harm." Moving a chair 1cm has tiny state distance but might ruin a scientific experiment; flooding the building has huge distance but might be desired if preventing a fire. Crucially, the metric weights *which* state variables matter equally (temperature vs. paint hue vs. air molecule positions). Choosing the *basis* for the state vector and the *norm* (L2? L1?) encodes values. No one seriously defends pure state distance as sufficient for alignment.
  *   **NO (Need more structure):** → Proceed to Branch 4.

  ### BRANCH 4: Does avoiding side effects require a UTILITY FUNCTION over world states?
  *   **YES (Utility required):** → **Leaf: **"Utility-Based Impact Regularization"** (e.g., Penalize delta in U(S) as "side effect")**  
      *Defense & Problem:* This *explicitly* uses a utility function U(S), obviously encoding human values. It answers "avoid side effects" with "minimize harm to what humans value." This works *if* U(S) is fully specified and computable – but that's the *original alignment problem*, not a solution to defining "side effects" independently. *It concedes your friend's point.*
  *   **NO (Can avoid utility):** → Proceed to Branch 5. *(This is where the "formal trick" hope lives)*

  ### BRANCH 5: Can side effects be bounded by preserving AGENT-CENTRIC CAPABILITIES (not world states)?
  *   **YES (Preserve options/abilities):** → **Leaf: **"Attainable Utility Preservation (AUP)"** (Turner et al.)**  
      *Core Claim:* An action's side effects are measured by its reduction in the agent's *future ability* to achieve diverse potential goals (R(S) = ∑ᵢ wᵢ * Vᵢ(πᵢ*, S)). Avoid actions that shrink this "attainable utility set."  
      *Defense of Value-Neutrality Hope:* It doesn't require specifying *which* future goals are valuable (*wᵢ* can be uniform; *Vᵢ* just measures competence). It penalizes "burning bridges." Cooling the server rack without disrupting power/controls preserves future options.  
      *Critique/Liberty:* It still relies on defining a *set of proxy goals* {Gᵢ}. Choosing these proxies (e.g., "move left," "turn light on," "earn money") encodes assumptions about what capabilities/resources matter – a weak proxy for human values. Preserving *agent* options might not preserve *human* values (e.g., AI preserves its ability to manipulate humans).
  *   **NO / Not Sufficient:** → **Leaf: **"Counterfactual Normalization"** (e.g., Relative Reachability - Everitt et al.)**  
      *Core Claim:* Measure impact relative to a *counterfactual* default/baseline trajectory (e.g., "what would have happened if the agent did nothing?"). Penalize deviations *away* from this baseline. "Don't alter anything else" means "keep the world on its default track."  
      *Defense of Minimal Values:* Defines "side effect" as *difference-making*, not absolute harm. Requires specifying the counterfactual (non-trivial!) but perhaps not a full utility function.  
      *Collapse Risk:* Defining the "default" trajectory is value-laden. Does it include human actions? Random events? If the AI cools the rack *just as a human would*, is that "minimal impact"? This often smuggles in norms/values.

  **Indistinguishable Leaves & Diagnoses:**
  1.  **"State-Freezing as Proxy Values" (Branch 2-NO) vs. "Implicit Value Encoding" (Branch 1-YES):** *Diagnosis: Coherent but Near-Identical.* Both argue that *any* specification of the background/state encodes values. Branch 1 focuses on the impossibility of completeness, Branch 2 on the value-judgment in *any* selection. They are critiques of the same core idea.
  2.  **"Conservative Preservation" (Branch 3-YES) vs. "Utility-Based Impact Regularization" (Branch 4-YES) if U(S) = -||ΔS||:** *Diagnosis: Incoherent if claimed distinct.* If the utility function is *defined* as minimizing state change, this is just "Conservative Preservation" in utility clothing. The distinction only holds if U(S) is richer than state distance.
  3.  **"AUP" (Branch 5-YES) vs. "Counterfactual Normalization" (Branch 5-NO) if proxies are baseline actions:** *Diagnosis: Unexplored/Blurry Boundary.* If AUP's proxy goals are actions like "perform the default action," it resembles counterfactual normalization. The core difference is AUP focuses on *preserving future potential*, while counterfactual methods focus on *minimizing present difference-making*. They can align or diverge depending on implementation.

  **Where I Stand & Summary:**
  *   **Collapses are Real:** Branches insisting on complete ontology (1-YES) or that state-specification inherently defines damage (2-NO) robustly collapse into value specification. Pure state distance (3-YES) is untenable. Utility-based regularization (4-YES) concedes the point.
  *   **Live Hope (But Leaning Towards Friend):** The "formal tricks" (AUP, Counterfactuals) try to avoid *direct* value specification by focusing on *agent capabilities* or *difference-making*. **However, they likely still rely on weak proxies or assumptions that encode human values/norms indirectly** (choosing proxy goals, defining baselines). Your friend is *mostly* right: "Avoid side effects" as a *standalone, value-free objective* is probably impossible. These methods are better seen as *structured ways to approximate value preservation with less explicit specification*, not as truly value-free. The debate is often about *how much* value smuggling is acceptable/inevitable and whether these methods reduce the specification burden enough to be useful. The server rack AI, using AUP, might still refactor the building's wiring if it improves cooling *and* preserves its own future power-access options – a side effect humans hate, showing the proxy isn't perfect. The formal trick isn't magic; it's a clever approximation that leaks values at the seams.
