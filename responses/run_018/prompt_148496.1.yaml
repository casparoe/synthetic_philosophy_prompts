answer: |-
  Consider this an attempt to translate the enduring structure of Nyāya epistemology into the concrete language of your sensor fusion domain, viewing the four *pramāṇas* not as inner faculties but as robust, formalized protocols for establishing reliable cross-modal truths within a noisy, heterogeneous system.

  **Perception (*Pratyakṣa*)** becomes the foundational **direct sensor calibration and drift tracking protocol**. This is the irreducible baseline: the raw, time-stamped, uncertainty-quantified output of each distinct sensor channel (radar return, LiDAR point cloud, acoustic bearing). Its authority rests on rigorous initial calibration against known references and continuous monitoring for drift signatures (thermal drift in LiDAR, humidity effects on acoustic propagation, radar multipath anomalies). Like *pratyakṣa*, this provides the immediate, non-inferential data points, but its validity is contingent on documented calibration history and real-time drift detection, making it the primary input stream but never inherently infallible.

  **Inference (*Anumāna*)** maps directly to **cross-modal consistency checking and hierarchical conflict arbitration based on established universal concomitance (*vyāpti*)**. This isn't just probabilistic fusion; it's the rule-based engine enforcing inviolable physical constraints learned through prior observation or authoritative models. If LiDAR (*perception*) reports an object 10m away, but the calibrated acoustic array (*perception*) detects no return from that precise location under known atmospheric conditions (*established vyāpti*), inference flags an inconsistency. The "universal concomitance" here is the physical law or empirically derived model (e.g., "solid objects within range reflect sound waves under condition X"). Inference *requires* this established, domain-specific rule, derived either from vast historical sensor data (*prior perception*) or integrated physical models (*testimony*). It arbitrates conflicts by weighting sources based on their current reliability index and the specificity of the violated concomitance.

  **Comparison (*Upamāna*)** operates as **analogical transfer of relational properties via known reference points**. This isn't object recognition per se, but leveraging a known sensor-target relationship to interpret a new, ambiguous signature. Imagine an acoustic classifier (*perception*) detects a low-frequency harmonic profile with high uncertainty. The system recalls (*prior perception/testimony*) that a specific tracked vessel ("Reference Vessel Alpha") emits a *similar* harmonic structure when operating its main pump. By establishing the analogy ("this unknown signature IS_LIKE the signature of Reference Vessel Alpha's pump"), comparison transfers the relational property ("likely has an active main pump") and suggests the target class ("likely vessel of Alpha's type"). The core is the analogical leap based on a *known relation* between signature and source, validated against other *pramāṇas*.

  **Verbal Testimony (*Śabda*)** is the **integration of external, structured data streams with source-reliability tracking**. This is the AIS feed, the weather service API, the pre-loaded digital terrain map, or the maintenance log noting a sensor's recent impact. Its authority is *not* derived from the system's own sensors but is treated as an independent channel. Crucially, its weight in fusion depends entirely on **source-reliability tracking**: the AIS provider's historical accuracy score, the timestamp and stated confidence of the weather model, the documented pedigree of the terrain database, the credibility of the maintenance log entry. Like reliable testimony, a highly credible external source can override ambiguous or conflicting direct sensor data (*perception*), provided its reliability index is sufficiently high, acting as an irreducible input, not merely repackaged sensor data.

  **The Residue Report:**

  Several Nyāya commitments map remarkably cleanly onto sensor fusion architectures:
  *   **Irreducibility as Protocol Independence:** The *functional* irreducibility holds. The calibration protocol for LiDAR (Perception) is fundamentally different from the rule engine checking LiDAR vs. Radar consistency against a physics model (Inference), which differs from mapping an acoustic signature to a known vessel class via analogy (Comparison), which further differs from integrating and weighting an AIS feed (Testimony). Each requires distinct algorithms, data structures, and validation steps.
  *   **Inference's Dependence:** The requirement that Inference relies on established concomitances (*vyāpti*) perfectly mirrors the need for validated physical models or empirically derived correlation rules within the fusion engine. These rules *must* be sourced from prior sensor data analysis (Perception) or integrated authoritative models (Testimony).
  *   **Comparison's Mechanism:** The analogical transfer of a known relation (e.g., signature X -> source Y) maps directly to techniques like case-based reasoning or specific classifier training using reference datasets within fusion systems.
  *   **Testimony's Independence & Reliability:** Treating external data streams as primary inputs with independent weighting based on source credibility (reliability tracking) is standard engineering practice.

  However, significant distortions or residues remain:
  1.  **The Metaphysics of Irreducibility vs. Engineering Reductionism:** While the *protocols* are distinct, Nyāya often posits an ontological irreducibility – each *pramāṇa* accesses a fundamental aspect of reality. Engineering is ruthlessly reductionist: *Ultimately, every source, including "Testimony" (AIS data), reduces to calibrated input streams (bits) processed by silicon. Even "Inference" is just algorithm execution.* The translation preserves the functional distinction but dissolves the metaphysical claim. The engineering lens inherently reduces all *pramāṇas* to data and computation.
  2.  **The Normative Criterion - Successful Action:** This is the profound residue. Nyāya defines valid knowledge (*pramā*) not just by its causal genesis via a *pramāṇa*, but crucially by its *capacity to lead to successful practical action* (*pravṛtti-sāmarthya*). Sensor fusion aims for accuracy, consistency, and robustness – metrics like RMSE or confusion matrices. While a *well-fused* system *enables* successful action (e.g., navigation), the engineering definition of "correctness" is statistical or model-based conformity, *not* the teleological success of a downstream action. The system verifies against internal consistency and ground truth where possible, not against the future effectiveness of a decision made using its output. This pragmatic, goal-oriented definition of truth has no direct structural counterpart in the fusion algorithms themselves; it resides only in the system's deployment context, entirely external to the verification protocols.
  3.  **The "Established" Nature of Vyāpti:** While fusion uses models, the Nyāya emphasis on *established* (and often universal) concomitance is stricter than typical engineering practice, which readily employs probabilistic models (Bayesian networks) or machine learning (statistical correlations) where perfect, universal physical laws are unknown. The Nyāya ideal of certain *vyāpti* translates less perfectly into the probabilistic world of sensor error.

  Therefore, the translation illuminates the Nyāya framework as a prescient blueprint for robust, multi-source verification, where distinct validation protocols (calibration, rule-checking, analogy, source-vetting) operate synergistically but irreducibly at a functional level. It successfully recasts perception as drift-managed input, inference as model-based conflict resolution, comparison as analogical transfer, and testimony as vetted external data. Yet, it inevitably strips away the metaphysical grounding and, most significantly, cannot incorporate the core Nyāya criterion that genuine knowledge is validated *by its future practical success*, leaving this vital aspect as an unresolved residue outside the formal verification architecture. The system knows if its outputs are consistent and calibrated; it cannot know, by its own lights, if those outputs will truly guide a ship to safe harbor. That final test remains human, or systemic, in a way the fusion engine, reflecting the translated *pramāṇas*, does not encode.
