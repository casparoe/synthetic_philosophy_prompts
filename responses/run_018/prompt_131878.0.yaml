prompt: |-
  I was arguing with my roommate last week about whether Bitcoin proves Aristotle wrong about money being naturally limited, and now I'm weirdly stuck on it. I'm trying to understand Aristotle's view on exchange and chrematistike—specifcally whether his distinction between oikonomia and chrematistike is about the *intention* behind trade or about the *scale* of accumulation, and whether his idea of proportional equality in exchange can be formalized for cases like multi-party barter with non-transitive preferences or algorithmic liquidity pools. There are a bunch of other open angles too: whether tokos (interest) is unnatural because it makes money breed, how the Ethics account of justice in exchange relates to the Politics account, whether modern platform economies count as chrematistike, and some recent attempts to read Aristotle as an early critic of financialization.

  I have about three months before I have to pick a thesis topic, and I want to know which of these lines is actually worth digging into versus which are dead ends or just restate the same point. Can you rank the open questions or research directions by how upstream they are? For each, say why it matters for the others, how tractable it is without being a classicist, and what kind of evidence—textual or conceptual—would make you reorder them. I'm not asking for a bibliography or reading list since I don't have library access right now, and please don't cite specific editions. I just need a defended agenda: what should I actually spend my summer on, and what should I ignore?

  Please end with your single top recommendation and the main criterion you used, formatted like \answer{...}
