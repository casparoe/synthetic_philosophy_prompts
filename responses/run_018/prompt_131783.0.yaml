  You're right that no single contract can force cross-frame bets *simultaneously*. But your partitioned selves still create arbitrage opportunities *across time*—it just becomes a temporal money pump. Consider:

  1.  **Work-frame:** You prefer A > B (maybe a safe project over a risky one).
  2.  **Leisure-frame:** You prefer B > C (maybe the same risky option over a boring one).
  3.  **Global Incoherence:** Crucially, your work-frame also prefers C > A (completing the cycle).

