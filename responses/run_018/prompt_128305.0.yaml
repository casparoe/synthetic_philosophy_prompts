answer: |-
  ## Commencement Address: To Belong, To Become, To Build

  Esteemed Trustees, President, Faculty Colleagues, Honored Guests, and most importantly, the remarkable Class of [Year] – graduates, families, friends – it is a profound honor to stand before you on this day of celebration, a day marking both an ending and, more significantly, countless beginnings.

  Today, we gather not just to applaud your achievements, but within the unique context of our institution’s bold, recent undertaking: the adoption of the Nested Demos Charter. This is no mere administrative footnote; it is a living experiment, a deliberate tremble in the foundations of how we conceive of "us" – of who gets a voice in shaping this place we call a university, and crucially, *why*. It formally welcomes voices beyond our traditional walls: the permanent residents of the watershed that sustains us, the lineal descendants of the laborers whose hands literally built our oldest stones in the 1890s, and a randomly selected cohort of local teenagers whose lives will unfold fifteen years from now, profoundly shaped by the research trajectories we initiate today.

  For half of you assembled here, particularly my colleagues in democratic theory and political philosophy, these names – watershed residents, descendants, future cohort – resonate with decades, even centuries, of fierce intellectual wrestling: the "boundary problem." Who *is* the demos? Who truly belongs? Is it those coerced by our rules? Those affected by our decisions? Can those who do not yet exist, whose interests are fundamentally unknowable, have a legitimate claim on our present choices? These are not abstract riddles; they are the bedrock questions of self-governance, of justice across time and space.

  For the other half – our graduates, your families, our local neighbors – this charter might seem a complex, perhaps curious, new structure. But its essence touches something universal: the fundamental human questions of belonging, responsibility, and legacy. Who gets heard? Who do we owe? How do we build a future that honors the past and protects what’s yet to come?

  Let me be utterly clear: the Nested Demos Charter does *not* declare these questions solved. Its brilliance, in fact, lies in its explicit *provisionality*, its embrace of necessary tension. Look closely: Watershed residents hold vital veto power over environmental policy, recognizing their intimate dependence on the same water that flows through our labs and dorms – yet they have no formal say over curriculum. The descendants of the builders, a tangible link to the physical and human foundations of this place, hold a unique standing – yet their role differs from that of current faculty. And that future cohort? They can propose long-term research agendas – a voice whispering from tomorrow – but they cannot vote on today’s tuition. These are not oversights; they are conscious, difficult choices reflecting the messy reality that different forms of belonging and different kinds of impact demand different kinds of voice. It is an acknowledgment that the circle of "us" is not easily drawn with a single, perfect stroke, but rather sketched, erased, and redrawn in overlapping, sometimes conflicting, rings.

  So why do this? Why embrace this complexity on a day meant for celebration? Precisely *because* it is a day for celebration – a celebration of learning, of community, and of looking forward. The Nested Demos Charter is our institution’s way of taking its own ideals seriously, of embodying the uncomfortable truth that a university is not an island. It is woven into the land it occupies, indebted to the hands that built it, and irrevocably responsible for the future it helps shape. It’s an experiment in stretching the boundaries of responsibility, acknowledging that our decisions ripple outward in geography and echo forward in time.

  And this, graduates, is where your journey converges with this grand, imperfect experiment. You stand today at the threshold. You have learned *within* a community that is actively wrestling with who belongs to its conversation. You leave to enter a world desperately needing that same wrestling, that same courage to expand the circle. You enter a world grappling with climate crises that demand we listen to those downstream and those unborn; with technological leaps forcing us to consider who is coerced by algorithms designed today; with inequalities rooted in histories demanding we acknowledge the descendants of those whose contributions were erased or exploited.

  Your education hasn’t just equipped you with skills; it has, I hope, equipped you with the intellectual humility to navigate profound questions without demanding simplistic answers. The Nested Demos Charter teaches us that building a just future isn't about finding a perfect, monolithic "we." It’s about building nested structures of listening and responsibility – structures that acknowledge different kinds of connection, different scales of impact. It’s about honoring the specific claims of the watershed while recognizing the distinct needs of the classroom. It’s about making space for the echoes of the past and the whispers of the future, even when their priorities clash with immediate convenience.

  So, as you step beyond these gates, carry this spirit. Carry the recognition that belonging is complex. Carry the courage to ask "who else should be at this table?" even when it makes the conversation harder. Carry the understanding that building a better world requires grappling with the boundaries of community – boundaries of geography, history, and time. Do not shy away from the tensions inherent in inclusion; instead, engage them with the intellectual rigor you’ve honed here and the profound empathy that defines our shared humanity.

  The Nested Demos Charter is not our endpoint; it is a starting point, a commitment to the perpetual, vital struggle of defining "us" more generously, more responsibly. You, the Class of [Year], are now the most vital part of that "us" extending into the wider world. Go forth and build your own nested demos – in your communities, your professions, your families. Build them with courage, with humility, and with the unwavering belief that expanding the circle, however messily, is the only way forward.

  Congratulations, graduates. We cannot wait to hear the voices you amplify and the communities you build.
