  ## The Last Speakers Weigh Silence

  This elder's breath rasps like dry leaves on stone,
  her hand trembles toward the consent form's line.
  The nurse speaks comfort in a conquering tone,
  words smooth as plastic, rigidly designed.
  **How do you sign the forms without the common tongue?**

  (Third stanza holds the other refrain's space)
  Across the village ground, where dust takes wing,
  a granddaughter traces glyphs on sun-baked clay –
  *Aniish*, the ache when home loses its ring,
  *Gethra*, the hollow after loved ones stray...
  **How do you weigh a word that holds no synonym?**

  (Second stanza holds the other refrain's space)
  The lawyer's briefcase snaps, a sudden sound,
  demanding rights locked in official speech.
  She nods, a ghost within the terms she's found,
  her justice measured just beyond her reach.
  **How do you sign the forms without the common tongue?**

  (Third stanza holds the other refrain's space)
  He holds the child close, whispers the old name
  for rain-that-comes-from-clear-sky, sharp and sweet.
  The syllables like carven amber flame,
  a world condensed in sounds made obsolete...
  **How do you weigh a word that holds no synonym?**

  (Second stanza holds the other refrain's space)
  The clinic's light is harsh, the questions cold.
  She needs the medicine, the shelter's lease.
  Her native phrases, fragile, uncontrolled,
  crumple like parchment, begging for release.
  **How do you sign the forms without the common tongue?**

  (Third stanza holds the other refrain's space)
  He sings the mourning song for mountains lost,
  *Kaelen*, that particular shade of missing.
  The final note, a bridge uncrossed,
  the deep well's echo, endlessly persisting...
  **How do you weigh a word that holds no synonym?**

  And in the courtroom, clinic, fading light,
  **How do you sign the forms without the common tongue?**
  **How do you weigh a word that holds no synonym?**

  ---

  **Notes on Crafting the Incommensurable:**

  *   **Refrains as Islands:** "How do you sign the forms without the common tongue?" (pragmatic necessity) and "How do you weigh a word that holds no synonym?" (cultural weight) occupy distinct, alternating stanzas, never interacting rhythmically or thematically within the poem's body. They echo past each other.
  *   **Final Couplet - Juxtaposition, Not Resolution:** The two refrains appear together only in the final couplet. They simply sit side-by-side, neither answering the other, nor creating harmony. Their proximity highlights the chasm between their concerns.
  *   **Specific Imagery:** Focusing on elders ("breath rasps," "hand trembles"), legal/medical hurdles ("consent form," "lawyer's briefcase," "clinic's light"), and the unique linguistic treasures ("*Aniish*, *Gethra*, *Kaelen*," "glyphs on sun-baked clay," "name for rain-that-comes-from-clear-sky") grounds the abstract conflict.
  *   **Structure as Argument:** The alternating stanzas and refrains visually and rhythmically embody the impossibility of weighing these values on a single scale. Each demand occupies its own space, its own urgency, without a common metric for comparison.
  *   **"Talking Past":** The refrains are framed as parallel, unanswerable questions from fundamentally different domains (survival vs. essence), ensuring they don't engage in dialogue but simply state their irreconcilable claims.
