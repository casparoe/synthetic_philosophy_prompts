     - Promise: The courier promised to deliver letters? Actually, the courier might have been hired to deliver letters. The promise is implicit: the courier took on the duty to deliver the letters (a professional commitment). The merchant is now keeping that commitment.
     - Maker: The courier (who is dead).
     - Keeper: The merchant.
     - Maker gone? Yes (dead).
     - Time: After the courier's death.
     - Motivation: Not specified (could be duty, honor, or even business reasons).
     - Outcome: Letters are delivered.

  Check load-bearing:
     - Promise exists? Yes (deliver the letters). It is a promise that can be kept by another (the merchant).
     - Maker gone? Yes.
     - Keeping after? Yes.
     - Keeper: The merchant is a different person, so no issue.

  Theme slippage? 
     - The story is about keeping the promise (delivering letters) even though the original promisor (courier) is dead. The merchant is stepping in. This seems to fit.

  Verdict: Greenlit.

  Pitch 2: A villain who keeps the terms of a treaty with a city that no longer exists.

  Extraction:
     - Promise: The treaty terms (the villain promised to abide by the treaty? Actually, the treaty is between the villain (or the villain's side) and the city. Both sides made promises. The villain is keeping the promises made in the treaty.
     - Maker: The villain (as one party to the treaty) and the city (as the other party). Note: the city no longer exists, so the other party is gone.
     - Keeper: The villain.
     - Maker gone? The other party (the city) is gone, but note: the core theme requires that the person who made the promise is gone. Here, the promise was made by two parties. The villain is the keeper and also one of the makers. The other maker (the city) is gone.

     This is complex. The core theme is about a promise kept after the maker is gone. But here, the keeper is one maker and the other maker is gone. The promise was bilateral. So the villain is keeping his side even though the other party is gone.

     However, note: the core theme does not specify that the promise must be unilateral. But the theme is focused on the maker being gone. Here, the villain is both a maker and the keeper. The other maker (the city) is gone.

     Check load-bearing:
        - Promise exists: Yes (the treaty).
        - The maker who is gone: The city (as a party to the treaty) is gone. But note: the promise was made by the villain too. The villain is still here. However, the core theme doesn't require that every maker is gone, only that the person who made the promise is gone. But in this case, the promise was made by two. So we have to see: is the theme about one specific maker being gone? The core theme says "the person who made it" (singular). But it could be extended to a group? 

     How do we interpret "the person who made it"? In the treaty, there are two parties. The city is a collective, but we can treat it as an entity. The city is gone, so the entity that made the promise (the city) is gone.

     However, the villain is also a maker and is still present. So the keeper is the same as one of the makers? And that maker is not gone. Therefore, the condition "after the person who made it is gone" is only partially true (one maker is gone, the other is not). 

     But note: the theme doesn't specify that all makers must be gone. It says "the person" (singular). So if we interpret the promise as having been made by the city (and the villain as the other party), then the city (the maker) is gone and the villain (the other party) is keeping the promise. This fits.

     Alternatively, we can view the treaty as a single promise? But it is a set of mutual promises.

     We have to decide: is the promise in the treaty a set of two promises? Then the villain made a promise to the city, and the city made a promise to the villain. Now, the villain is keeping his promise to the city even though the city is gone. That fits the theme: the promise (the villain's promise) is being kept after the person (the city) to whom it was made is gone? Wait, the theme says "the person who made it" (the promise). The villain made his own promise. So the maker of the villain's promise is the villain himself. But the villain is not gone. He is the keeper.

     This is a problem.

     Let's reexamine the core theme: "a promise kept after the person who made it is gone". The person who made the promise is the one who is gone. In the case of the villain, the villain made a promise (to the city). The villain is not gone. So the maker (the villain) is still here. Therefore, this does not fit.

     Alternatively, we can see the treaty as a promise made by the city? But the city didn't make a promise to itself. The city made a promise to the villain. Now the city is gone, and the villain is keeping his own promise? That doesn't directly relate.

     The theme is about the maker of the promise being gone. In the villain's case, the maker of the villain's promise is the villain, who is present. The maker of the city's promise is the city, which is gone. But the villain is not keeping the city's promise (he can't, because the city is gone and he is not the city). He is keeping his own.

     Therefore, this pitch does not fit the core theme. The person who made the promise that is being kept (the villain's own promise) is not gone. The villain is here and keeping it. The fact that the other party is gone is a different matter.

     This might be a neighboring theme: "keeping a promise when the other party is gone". But that's not exactly the same as the maker being gone.

     Verdict: This is a slippage. It should be a no or borderline.

     However, let's see if we can reinterpret:

     If we consider the treaty as a single entity (a joint promise) and both parties were the makers, then when one party is gone, the promise is broken? But the villain is still keeping his part. The core theme isn't about joint promises. 

     We must stick to the core: the maker of the specific promise that is being kept must be gone. Here, the promise being kept is the villain's own promise. The maker (the villain) is present. So it doesn't fit.

