  Therefore, the procedure can be run in 5-10 minutes per pitch.

  Note: The procedure leans on the definition of "promise". Hofstadter's model is about abstract patterns, and we are interpreting "promise" as a commitment. In the core theme, it is explicitly a promise. If we stretch to include orders, vows, etc., that's a judgment call (and might be acceptable in the project, but the core theme is "a promise"). The procedure sticks to the core.

