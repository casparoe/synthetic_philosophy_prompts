  Step 6: Verify that the promise can be kept without the maker.
     - Does the promise require the maker's ongoing participation? (If yes, it breaks.)

  Step 7: Check for slippage (judgment call):
     - Is the story centered on the keeping of the promise in the absence of the maker? (If the absence is irrelevant, it might be a different theme.)
     - Does the variation evoke the core feeling of the theme? (This is a judgment call and may require discussion.)

  Step 8: Non-load-bearing knobs (like motivation, outcome, identity of keeper) can vary.

  Marking judgment calls:
     - Step 1: Deciding if there is a promise (if implicit, it's a judgment call).
     - Step 6: Deciding if the promise can be kept without the maker (judgment call).
     - Step 7: Entirely a judgment call.

  For Pitch 2, we failed at Step 2 and Step 4: the maker of the promise (the villain) is not gone. The other party (the city) is gone, but the promise being kept is the villain's own promise. So we note:

     - The promise: the villain promised to the city to do X.
     - Maker: the villain (who is present) and the city (which is gone). But the promise being kept is the villain's promise, so the maker (the villain) is present -> Condition fails.

