  We are given a core theme: "a promise kept after the person who made it is gone"

  We need a procedure to evaluate variations on this theme. The procedure should:
  (a) Extract the theme into components (knobs) that can be adjusted.
  (b) Identify which knobs are load-bearing (i.e., changing them breaks the theme) and which are not.
  (c) Give a concrete test for when a variation has slipped into a neighboring theme.
  (d) Mark steps that involve judgment calls.

  Let's break down the core theme:

  Core Theme: "a promise kept after the person who made it is gone"

  We can extract the following knobs:

  1. **Promise**: The content of the promise. What was promised?
  2. **Promise Maker**: The person (or entity) who made the promise.
  3. **Promise Keeper**: The person (or entity) who is keeping the promise.
  4. **Condition for Keeping**: The circumstances under which the promise is kept, particularly that the promise maker is gone (dead, disappeared, etc.).
  5. **Time of Keeping**: When the promise is being kept (must be after the maker is gone).
  6. **Motivation for Keeping**: Why is the keeper still keeping the promise? (e.g., duty, honor, habit, etc.)
  7. **Outcome**: What happens as a result of keeping the promise? (This might be less load-bearing for the theme, but it could be important for the narrative.)

  Now, which of these knobs are load-bearing for the theme? 

  We argue that the load-bearing knobs (the ones that must be present and in a specific state for the theme to hold) are:

  - **Condition for Keeping**: The promise maker must be gone. This is central to the theme.
  - **Promise**: There must be a promise. Without it, there's no promise to keep.
  - **Time of Keeping**: The keeping must occur after the maker is gone. This is inherent in the theme.

  However, note that the core theme does not specify:
  - Who the promise keeper is (it could be the same as the maker? But note: the maker is gone, so if the maker is the keeper, then we have a contradiction unless the keeper is acting posthumously? But typically, the keeper is someone else). So the keeper is likely a distinct entity. But the core theme doesn't specify that the keeper must be a different entity. However, if the keeper is the same as the maker who is gone, then we have a problem (unless it's a ghost, a machine set by the maker, etc.). So we must allow for non-human or non-living keepers.

  Therefore, we define:

  Load-bearing knobs (if changed, the theme breaks):

  1. **Promise Exists**: There is a clear promise (explicit or implicit) that was made.
  2. **Promise Maker is Gone**: The maker of the promise is no longer present (dead, disappeared, no longer exists, etc.).
  3. **Promise is Being Kept**: The promise is being actively kept (or fulfilled) at a time when the maker is gone.
  4. **Keeper is Not the Maker (in a way that would prevent the condition)**: This is a bit tricky. If the keeper is the maker, then how can the maker be gone? We must allow for the possibility that the keeper is an extension of the maker (like a machine, an heir, a ghost) but the physical or original maker is gone. So we can rephrase: The keeper must be an entity that persists after the maker is gone and is acting independently of the maker's current presence. This is a judgment call.

  Non-load-bearing knobs (can be varied without breaking the theme):

  1. **Identity of the Promise Keeper**: As long as the keeper is keeping the promise after the maker is gone, it can be anyone/anything.
  2. **Motivation for Keeping**: The reason can vary (duty, programming, love, etc.).
  3. **Outcome**: The result of keeping the promise can be positive, negative, or neutral.
  4. **Specifics of the Promise**: The content of the promise can be almost anything, as long as it is a promise.

  But note: the content of the promise might sometimes drift into a different theme. For example, if the promise is to "take care of my cat while I'm away for a week" and the maker is gone (dead) and the keeper keeps feeding the cat for years, that fits. But if the promise is a treaty between two nations, and one nation is gone, and the other still honors it, that also fits. However, if the promise is something that doesn't make sense to keep after the maker is gone (e.g., "I promise to buy you a coffee tomorrow"), then we might have a problem. So the content of the promise must be such that it is still meaningful to keep it after the maker is gone. This is a constraint (a knob that has a limited range of variation).

  Therefore, we adjust:

  Load-bearing:

  - The promise must be of a nature that it can be kept after the maker is gone. (This is a judgment call, but we can set a test: if the promise requires the maker's ongoing participation, then it cannot be kept without the maker. But if it can be kept by another party independently, then it is acceptable.)

  Concrete Test for Theme Slippage:

  A variation has slipped if:
  - There is no promise (it's just a habit, a tradition, or a law without a promise).
  - The promise maker is still present (so it's just a normal promise keeping).
  - The promise is not being kept (it's being broken, or the story is about breaking it).
  - The keeper is the maker and the maker is not gone (but if the keeper is the maker's ghost, then the maker is gone, so that's acceptable).

  Additionally, if the promise is kept but the fact that the maker is gone is irrelevant, then it might be a different theme. For example, if the keeper doesn't know the maker is gone and keeps the promise out of habit, that might still fit. But if the keeper knows and still keeps it, that might add depth. The core theme doesn't require that the keeper knows the maker is gone. So that's non-load-bearing.

  Procedure for Review:

  Step 1: Extract the knobs from the pitch.
     - Identify: 
          a. What is the promise? (Be explicit: who promised what to whom?)
          b. Who made the promise? (Maker)
          c. Who is keeping the promise? (Keeper)
          d. Is the maker gone? (How? When?)
          e. When is the promise being kept? (Is it after the maker is gone?)
          f. Why is the keeper keeping it? (Motivation - non-load-bearing, but might help in analysis)
          g. What happens? (Outcome)

  Step 2: Check the load-bearing knobs:
     - [ ] The promise is clearly identifiable and is of a nature that can be kept without the maker (i.e., it doesn't require the maker's ongoing action).
     - [ ] The maker is gone (dead, disappeared, etc.) at the time of keeping.
     - [ ] The keeping is happening after the maker became gone.
     - [ ] The keeper is not the maker in a way that would require the maker to be present (e.g., if the keeper is the maker, then we must have a mechanism by which the maker is gone and yet the keeper acts, like a will, a machine, a ghost).

     If any of these are missing, the theme is broken. Mark as "no".

  Step 3: Check for theme slippage (judgment call step):
     - Even if the load-bearing knobs are present, the variation might slip if the core emotional or conceptual core is lost. The core theme is about the persistence of a commitment beyond the presence of the one who made it. It often carries a sense of irony, futility, or nobility because the original context is gone.

     Test: 
          - Does the story highlight the absence of the maker and the persistence of the promise?
          - Is the keeping of the promise in the absence of the maker a central element?

     This is a judgment call, but if the answer is clearly "no", then it's a slippage.

  Step 4: Non-load-bearing knobs can be varied freely.

  Now, apply to the three pitches:

  Pitch 1: A merchant who keeps delivering letters for a dead courier.

