answer: |-
  ### Theme Coherence Procedure: "Knob-Twiddling" for Narrative Pitches  
  Based on Hofstadter's model, your core theme (**"a promise kept after the person who made it is gone"**) has **3 load-bearing knobs** that define its essence. If these are altered, the theme collapses into a neighboring idea (e.g., "loyalty beyond death," "tradition upheld," or "duty detached from purpose"). Non-load-bearing knobs can be tweaked freely without losing coherence.  

  ---

  #### **The Procedure**  
  **Time:** 5-8 minutes per pitch.  
  **Input:** A one-page quest/character/location pitch.  
  **Output:** Greenlit (fits theme), Shelved (breaks theme), or Borderline (needs revision).  

  1. **Extract the Knobs (2 min)**  
     Identify these **non-negotiable elements** from the pitch:  
     - **Knob A: The Promise**  
       What was explicitly/implicitly pledged? (e.g., "deliver letters," "honor a treaty").  
     - **Knob B: The Maker's Absence**  
       Is the *original promiser* irrevocably gone? (Dead, vanished, dissolved).  
     - **Knob C: The Keeping**  
       Is the promise actively *fulfilled*, not just remembered? (Action > sentiment).  
     *Judgment Call:* Does the pitch imply a true "promise" (voluntary commitment) or just an obligation?  

  2. **Test Load-Bearing Knobs (3 min)**  
     Run these **concrete litmus tests**:  
     - **Knob A (Promise):**  
       - ✅ **Fits theme:** The promise is specific, actionable, and meaningful to the keeper.  
       - ❌ **Breaks theme:** Vague, metaphorical, or transformed (e.g., "keeping a memory alive").  
     - **Knob B (Maker's Absence):**  
       - ✅ **Fits theme:** The maker’s absence is irreversible and materially changes the context.  
       - ❌ **Breaks theme:** The maker could return, is symbolically present, or the absence is irrelevant.  
     - **Knob C (Keeping):**  
       - ✅ **Fits theme:** Active effort to fulfill the *exact* promise (not a reinterpretation).  
       - ❌ **Breaks theme:** Passive remembrance, or the keeping alters the promise’s intent.  
     *Judgment Call:* Does the keeper’s *motivation* (duty, guilt, programming) affect theme integrity? (Usually **no**—this is a *non-load-bearing* knob).  

  3. **Slippage Test (1 min)**  
     Ask: **"Does this feel like a commentary on the futility/persistence of promises when context vanishes?"**  
     - ✅ **Fits theme:** Maker’s absence creates irony/tension (kept promise has no recipient or purpose).  
     - ❌ **Breaks theme:** Focus shifts to legacy, justice, or revenge.  
     *Judgment Call:* Does the variation evoke the core theme’s *emotional paradox* (noble yet pointless)?  

  4. **Verdict (1 min)**  
     - **Greenlit:** All load-bearing knobs (A, B, C) pass + No slippage.  
     - **Shelved:** ≥1 load-bearing knob fails.  
     - **Borderline:** Knobs pass technically, but slippage test is weak (revise for emotional clarity).  

  ---

  ### **Why These Knobs Are Load-Bearing**  
  Hofstadter’s model treats creativity as **constrained recombination**. For your theme:  
  - **Knob A (Promise)** anchors the *structure*. Altering it (e.g., to a vow, law, or instinct) dissolves the "promise" archetype.  
  - **Knob B (Maker’s Absence)** defines the *stakes*. If the maker isn’t truly gone, it becomes "duty while apart," not "keeping after loss."  
  - **Knob C (Keeping)** ensures the *mechanism* aligns. If the promise isn’t actively upheld, it slips into "remembrance" or "legacy."  
  *Non-load-bearing knobs* (keeper’s identity, tone, outcome) can vary: A machine, ghost, or villain can all keep promises.  

  **Contested Edge:** Hofstadter’s model implies knobs are objective, but narrative themes involve *subjective perception*. The Slippage Test (Step 3) is where cultural/emotional intuition operates—this is unavoidable but flagged as a judgment call.  

  ---

  ### **Applied to Your Pitches**  
  **Core Theme:** "A promise kept after the person who made it is gone."  

  #### **Pitch 1: Merchant delivers letters for a dead courier**  
  - **Knob A (Promise):** Deliver letters. ✅ *Specific, actionable.*  
  - **Knob B (Maker’s Absence):** Courier is dead. ✅ *Irreversible.*  
  - **Knob C (Keeping):** Merchant actively delivers. ✅ *Fulfills exact promise.*  
  - **Slippage Test:** Focus on futile persistence (letters may be outdated/unwanted). ✅  
  - **Verdict:** **GREENLIT**  

  #### **Pitch 2: Villain honors a treaty with a vanished city**  
  - **Knob A (Promise):** Uphold treaty terms. ✅ *Specific.*  
  - **Knob B (Maker’s Absence):** City is gone. ✅ *Irreversible.*  
  - **Knob C (Keeping):** Villain enforces terms. ✅ *Active fulfillment.*  
  - **Slippage Test:** ❗**SLIPPAGE DETECTED**. The villain (co-maker) is still present, shifting focus to *self-imposed duty* or *rigid ideology*. The core irony ("Why keep it when no one remains?") is diluted by the keeper’s agency.  
  - **Verdict:** **BORDERLINE** (Revise to emphasize the futility: e.g., the villain doesn’t benefit or even suffers).  

  #### **Pitch 3: Machine poisons land per dead tyrant’s order**  
  - **Knob A (Promise):** ❌ **BROKEN**. A *command* is not a promise (no voluntary commitment). It’s an order obeyed.  
  - **Knob B (Maker’s Absence):** Tyrant is dead. ✅  
  - **Knob C (Keeping):** Machine poisons land. ✅  
  - **Slippage Test:** Focuses on mindless obedience, not promise-keeping. ❌  
  - **Verdict:** **SHELVED** (Change "order" to "promise": e.g., the tyrant *promised* retribution, and the machine executes it posthumously).  

  ---

  ### **When the Procedure Can’t Decide**  
  - **Scenario:** Load-bearing knobs pass, but the Slippage Test is split 50/50.  
  - **Action:** Flag as **Borderline** and ask: "Does this *feel* like the core theme, or a spin-off?" If unresolved, shelve it—cohesion is more critical than individual pitches.  

  **Final Commitment:** This method reduces subjectivity by isolating load-bearing knobs, but narrative resonance (Step 3) will always require human judgment. By forcing explicit checks on A, B, and C, your team debates *specifics*, not abstractions.
