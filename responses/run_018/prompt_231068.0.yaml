  Pitch 3: A machine that dutifully executes a dead tyrant's last order to poison the land.

  Extraction:
     - Promise: The tyrant ordered the machine to poison the land. Is that a promise? The theme requires a promise. An order is not necessarily a promise. 

     We have to be careful. The core theme is about a promise. If there is no promise, then it breaks.

     What is the promise? The tyrant might have said, "I promise that the land will be poisoned" or the machine might have promised to carry out the order? But the pitch says it's the tyrant's last order. The machine is executing an order, not a promise.

     However, we might interpret the machine's programming as a kind of promise? The tyrant built the machine to carry out orders, so the machine is fulfilling its design (which is an implicit promise). But that's stretching.

     Alternatively, the tyrant promised (to whom?) that the land would be poisoned? The pitch doesn't say. 

     So we have to be strict: the promise must be explicit or clearly implicit. In this case, the promise is missing. The tyrant gave an order, not a promise. The machine is following orders, not keeping a promise.

     Therefore, this pitch does not have a promise. It has an order.

     Verdict: No.

     But wait, can we reinterpret? The machine might have been given a promise? For example, the tyrant might have said to the machine, "I promise you that I will give you oil if you poison the land", and then the machine is poisoning the land to get the oil? But the pitch doesn't say that. It says it's executing the last order.

     Without a promise, it's a different theme: following orders after the order-giver is gone.

     So: No.

  However, note that the core theme might be extended to include commitments that are like promises (e.g., a vow, a pledge, an oath, a contract). But an order is not a promise. A promise is a commitment by the maker to do something (or not do something). An order is a command to someone else. The machine is not keeping a promise; it is obeying an order.

  Therefore, we have:

  Pitch 1: Yes
  Pitch 2: No (or borderline, but we said no because the maker of the promise that is being kept is present)
  Pitch 3: No

  But let's revisit Pitch 2: maybe we can see it as the city's promise? The city made a promise to the villain? And the villain is not keeping that promise (the city is gone, so it can't). The villain is keeping his own. So that doesn't help.

  Alternatively, if the treaty included a promise by the city that the villain is now honoring on their behalf? That would be a stretch. 

  Therefore, we stick.

  Now, the procedure:

  **Procedure: Theme Coherence Check**

  Step 1: Extract the promise.
     - What exactly is the promise? (Write it down: "X promised to Y that ...")
