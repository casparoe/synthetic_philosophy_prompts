  For each question, anticipate his response and craft a sharp follow-up. For example, on medieval evidence, he'll likely say it was elite-only; follow-up should press on why elites felt that way if no national consciousness existed. On ethnosymbolism, if he concedes raw materials, ask why they aren't proto-nations.

