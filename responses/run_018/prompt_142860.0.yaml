  The residue is stark. **Translates cleanly:** The local, operational verification superseding theoretical dependency uncertainty. **Stretches:** Calling it "proof" – software verification acknowledges residual risk (hardware flaws, cosmic rays); Moore treats the hand as conclusive. **No counterpart:** The *absolute certainty* Moore rhetorically claims. Software trust is probabilistic/mitigated (reproducible builds, sandboxing). Moore's move is a **rhetorical shortcut leveraging immediacy**, not replicating formal verification. It shifts the burden *away* from disproving idealism (auditing all dependencies) but doesn't *eliminate* the epistemic gap; it pragmatically ignores it for operational trust, just as you run your binary despite theoretical risks in the stack. The "work" is psychological persuasion, not logical closure.
