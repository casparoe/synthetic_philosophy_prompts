  Then, reversing the analysis: the case confirms bureaucratic confessionalism by showing how the state apparatus sustains membership. But anomalies exist—non-members still fund the system indirectly through administrative fees. Also, the sharp asymmetry between recognized and other religions isn't addressed by the concept, which is a gap. The theory stays silent on theological justifications or waves of exits, as the user noted.

