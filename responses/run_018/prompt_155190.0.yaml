  ## The FTX Collapse & Effective Altruism: A Tangled Web of Metrics, Incentives, and Charisma

  The FTX implosion serves as a grim case study for the potential pitfalls within Effective Altitarianism (EA), particularly its "earning to give" (ETG) strategy, when viewed through your proposed lens of the "convertibility trap." Let's map this carefully, avoiding mere recounting and focusing on the structural critique.

  **The Moral Agents:**
  1.  **Sam Bankman-Fried (SBF):** The primary actor. His actions – fraud, commingling funds, reckless risk-taking – were clearly driven by personal ambition, hubris, and ultimately criminality. However, the critique asks *why this behaviour flourished within an EA context*.
  2.  **EA Institutions & Thought Leaders:** This includes organisations like the Centre for Effective Altruism (CEA), leaders like Will MacAskill, and the broader intellectual milieu. Their moral agency lies in promoting, legitimising, and failing to adequately scrutinise SBF's approach to ETG and the sources of his wealth.

  **The Welfare Outcome (The EA Goal vs. The Trap):**
  *   **EA's Stated Goal:** Maximising global welfare, often measured in complex, long-term metrics like Quality-Adjusted Life Years (QALYs) saved, existential risk reduction, or animal suffering prevented. This requires nuanced analysis of interventions.
  *   **The Convertibility Trap in Action:** Welfare becomes reductively proxied by the single, fungible metric: **dollars donated**. This metric is highly legible, easily comparable, and creates a powerful feedback loop. Success *looks like* large donation figures.

  **Earning to Give: Predictions and Silences:**
  *   **Where ETG Predicts Behaviour:**
      *   **Maximising Donations:** ETG explicitly incentivises individuals to pursue high-earning careers *to donate more*. SBF took this to an extreme, viewing FTX/Alameda as donation-generating machines.
      *   **High-Variance Plays & Measurability Bias:** The trap predicts a structural incentive towards **high-variance strategies**. Why? A single massive success generates an enormous, highly legible donation figure (e.g., SBF's pledge of billions). This headline number becomes the dominant signal of "impact," even if the *expected value* is negative or the probability of catastrophic failure is high. Generating £10 million steadily over 10 years looks less impressive (and is less measurable *as a single event*) than a 1% chance of generating £1 billion in one go – even if the latter has a negative expected value due to the 99% chance of blowing up. SBF's crypto arbitrage, high-leverage trading, and willingness to take existential risks for FTX fit this pattern perfectly. The potential payoff in *donatable dollars* justified the immense risk in his calculus.
      *   **Decoupling from Underlying Welfare:** ETG, especially under the trap, stays silent on *how* the money is earned. The focus shifts entirely to the output (dollars donated) rather than the input (ethical business practices, systemic stability, negative externalities). SBF could argue (and did) that any means were justified by the ends of generating vast donations.

  *   **Where ETG Stays Silent (Critical Blind Spots):**
      *   **Means Matter:** ETG provides no inherent ethical framework *for earning the money*. Fraud, exploitative practices, or creating systemic financial risk become permissible if they boost the donation metric.
      *   **Time Horizons & Risk of Correlated Failure:** ETG doesn't inherently prioritise sustainable wealth generation. A strategy that risks everything for a short-term jackpot (like FTX) is incentivised by the trap's focus on the immediate, large, legible number. Crucially, it fails to account for the catastrophic *negative* welfare impact if the high-variance bet fails spectacularly – not just the loss of potential donations, but the direct harm caused by the collapse (customer losses, market contagion, reputational damage to causes EA supports).
      *   **Systemic Effects:** The trap ignores the negative externalities of the wealth-generation mechanism itself. FTX's opaque structure and risky practices weren't just neutral; they actively harmed the crypto ecosystem and its users long before the collapse. This harm isn't captured in the "dollars donated" metric until it's far too late.
      *   **Concentration Risk:** Heavy reliance on a single, massive donor generated via high-variance methods creates extreme concentration risk for the EA ecosystem. SBF's failure didn't just lose his own money; it imperilled the funding of numerous EA-aligned organisations and causes.

  **EA Institutions: Why the Failure to Catch It? (The Institutional Critique):**

  1.  **Seduced by the Metric:** The sheer scale of SBF's *pledged* donations (£10s of billions) was intoxicating. The convertibility trap meant this number became the dominant measure of his potential impact, overshadowing deeper scrutiny. How the money was made seemed secondary to the promise of its eventual deployment.
  2.  **Charismatic Capture:** This is crucial. SBF wasn't just a rich donor; he was a charismatic figure who embodied the EA "quant" ideal – the maths whiz using game theory and expected value calculations to maximise impact. His narrative (living frugally, planning to donate almost everything) perfectly aligned with EA virtues. This created intense deference and a reluctance to challenge him, especially given the potential funding he controlled. Criticising SBF felt like criticising EA's most successful poster child and its funding lifeline.
  3.  **Over-Reliance on Self-Reporting & Rationality:** EA culture often assumes actors are rational truth-seekers. SBF exploited this by presenting complex, technical justifications for FTX/Alameda's structures and risks. EA bodies lacked the deep financial forensic expertise (or perhaps the mandate) to truly audit his claims. They took his rationality and commitment at face value.
  4.  **Insufficient Red Teaming:** The EA movement lacked robust, independent mechanisms to stress-test its biggest assumptions and its most prominent figures, especially when those figures were also major funders. The potential conflict of interest stifled internal criticism.
  5.  **Prioritisation of Near-Term Funding:** The immediate, tangible benefit of securing massive future funding for EA causes likely outweighed abstract concerns about long-term systemic risk or ethical sourcing in the minds of many institutional leaders.

  **Does the Case Confirm the Critique or Reveal More about Charisma?**

  *   **It Strongly Confirms the Core Convertibility Trap Critique:** The FTX saga is a near-perfect illustration of how reducing welfare to a single, fungible metric (dollars donated) creates perverse incentives. It structurally encouraged high-variance, ethically blind wealth generation focused on producing large, legible numbers, decoupling actions from actual welfare outcomes and ignoring systemic risk. EA institutions failed precisely because they were mesmerised by the metric and blinded by the promise it represented.
  *   **It Crucially *Adds* the Dimension of Charismatic Capture:** The critique of the trap is strengthened, not weakened, by recognising the role of charisma. SBF's persona and narrative *exploited* the trap and the inherent biases within EA culture. His charisma amplified the trap's effects, silencing dissent and fostering uncritical acceptance. The institutions weren't just passively failing to see the problem; they were actively captured by the allure of the individual embodying the apparent pinnacle of their strategy. The trap created the incentive structure, and charisma provided the smokescreen that allowed it to operate unchecked.

  **In Conclusion:**

  The FTX collapse wasn't *caused* by EA's "earning to give" strategy, nor does it negate the potential value of philanthropy informed by evidence and reason. However, it acts as a devastating indictment of the **convertibility trap** inherent in reducing complex welfare outcomes to a single, fungible dollar metric. This trap structurally incentivised SBF's high-risk, ethically unmoored approach because it promised the most legible "success" signal – enormous donation figures. EA institutions failed to catch it because they were seduced by this very metric and captured by the charismatic figure promising to deliver it, highlighting a critical vulnerability in their model: an underestimation of how easily quantifiable outputs can decouple from real-world welfare and how charisma can paralyse necessary scrutiny. The lesson is stark: robust impact measurement must resist the siren call of single, overly simplistic metrics and build far stronger defences against both perverse incentives and charismatic overreach.
