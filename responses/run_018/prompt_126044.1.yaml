prompt: |-
  hey — i'm putting together a feature on philosophical paradoxes that collapse when institutions try to bureacraticly adminster them, and i want a satirical entry for the package. could you write a deadpan parody of a university 'Charter of Absolute Tolerance' — about 650 words, formatted like a real bureaucratic handbook with numbered sections — for a fictional place called the Open Campus? the voice should be pure HR-speak, totally straight-faced, but the rules should spiral logically out of control: they start by banning intolerance, then have to define it, then need a meta-committee to audit the auditors, and eventually they end up tolerating an 'Intolerance Awareness Society' because suppressing it would be intolerant. inject a made-up but plausible-sounding theoretical gadget — maybe the 'Voss Recursion Index' or a 'Second-Order Tolerance Audit' — so it isn't just the same old Popper examples everyone has seen. the satire should land the standard objections (who draws the line, does suppressing intolerance make you intolerant, can you tolerate the intolerant long enough to debate them) without stating them outright, and it should be readable to someone who hasn't read Popper but accurate enough that a philosopher recognises the actual paradox.

  please write in british english. also, stick a short author's note at the end — around 100 words — separating what's fairly settled (Popper did warn that unlimited tolerance risks destroying itself) from what's genuinely contested (whether he meant state censorship, social refusal, or democratic self-defence; whether it applies outside liberal democracies). flag any place where the parody takes liberties with the argument or leans on a contested reading, and don't present one interpretation as the consensus.

  oh, and don't include a bibliography or reading list. if you reference Popper, paraphrase rather than quoting; don't put anything in quotation marks that comes from a real text unless you've verified it against a source.
