prompt: |-
  I'm taking a metaphysics course and got into a long argument with a friend about whether counterpart theory should apply to institutional bodies, not just individual people. I want to defend the view that entities like constitutional courts or central banks are better modeled with counterpart relations across worlds rather than strict transworld identity, mostly because it prevents essential institutional features—like having a specific mandate or jurisdiction—from being carried over accidentally into worlds where those features don't belong. But I'm not sure how exposed this institutional-counterpart view actually is.

  Play it straight: what would have to be true for this position to be wrong? Which assumptions about collective intentionality, modal esentialism, or the ontology of social entities could in principle fail, and what would our modal intuitions about institutions have to look like for each escape route? Rank the defeaters from fatal to merely awkward, say which ones defenders of the view would concede as genuinely counting against it, and be honest about whether I've just added qualifications to insulate it from objections. Give me exactly five numbered points, each a sentence or two, with no intro or conclusion.
reasoning: |-
  Okay, the user is taking a metaphysics course and got into an argument about applying counterpart theory to institutional bodies. They want to defend the idea that entities like constitutional courts or central banks should be modeled with counterpart relations across possible worlds instead of strict transworld identity. Their main reason is to prevent essential institutional features from accidentally carrying over to worlds where they don't belong. They're asking what assumptions would make their position wrong, and want five ranked defeaters from fatal to merely awkward.

  First, I need to recall counterpart theory, originally by David Lewis, which replaces transworld identity with counterpart relations. For individuals, it avoids essentialism about personal identity. The user is extending this to institutions, which are social entities created by collective intentionality and rules. 

  The core of their argument is that institutional features like mandates or jurisdictions aren't essential across all worlds, so counterpart theory allows flexibility. For example, a constitutional court in another world might have a different structure but still be a counterpart. The user is worried their view might be overqualified or insulated from objections.

  For the defeaters, I need to identify what would falsify their position. Starting with the most fatal: if institutions have necessary essential properties. If, say, a court must have a specific mandate in all possible worlds, then strict identity is necessary, making counterpart theory inapplicable. That's a strong objection because it attacks the foundational need for counterparts.

  Next, collective intentionality. If institutional identity is solely based on collective beliefs, then in different worlds, if people collectively believe an entity is the same court despite changes, strict identity holds. This undermines the need for counterpart relations since collective intentionality dictates identity directly.

  Third, if institutions are abstract artifacts, like musical works, they might have rigid criteria for identity across worlds. If the court's identity depends on its origin or specific rules, then transworld identity applies, not counterparts. This would make the user's view unnecessary.

  Fourth, functionalism. If institutions are defined by their function alone, then any entity serving the same function in another world is identical, not a counterpart. This challenges the need for counterpart relations since functional equivalence suffices for identity.

  Lastly, if our modal intuitions about institutions align with transworld identity. If people consistently view institutions as identical across scenarios with varying features, it weakens the case for counterparts. While not fatal, it makes the theory less intuitive and more awkward to defend.

  Now, assessing each defeater's strength. The essential properties point is fatal because it directly negates the core premise. Collective intentionality and abstract artifacts are serious but perhaps debatable. Functionalism is a strong challenge but might allow for some flexibility. Modal intuitions are the weakest, as intuitions can vary.

  The user might be insulating their view by defining institutions in a way that avoids essential properties, which could be seen as ad hoc. I should note that in their response. Also, they need to address how institutions differ from individuals in terms of essential properties, which is key to their argument.

  Ranking the defeaters: essential properties as fatal, then collective intentionality and abstract artifacts as serious, functionalism as damaging, and intuitions as awkward. Conceding that if any of the first three hold, counterpart theory isn't needed. For functionalism, it might require rethinking, and intuitions are a softer issue.

  I need to ensure each point is concise, as per the user's request—one or two sentences per numbered point. Also, clarify which assumptions fail for each defeater and how they impact the view. Highlighting where the defender would concede, like admitting that if institutions have necessary essences, their view fails.
answer: |-
  Here are five defeaters for institutional counterpart theory, ranked from fatal to awkward:

  1.  **Fatal:** If institutional identity *necessarily* supervenes on specific physical or historical particulars (e.g., *this* founding document, *these* specific people at inception), strict transworld identity holds, rendering counterpart relations superfluous and incorrect. (Defenders would concede this falsifies the core need for counterparts).
  2.  **Serious:** If collective intentionality directly grounds transworld identity (i.e., if the relevant community *intending* an entity in W2 to be the *very same* institution as in W1 suffices for strict identity regardless of functional changes), counterpart theory is undermined. (Defenders might argue intentions aren't sufficient for identity across radical changes).
  3.  **Serious:** If institutions are best understood as rigidly designating abstract artifacts (like novels or symphonies) whose identity is fixed by their constitutive rules or origins, counterpart theory becomes inapplicable as these rules define necessary transworld identity conditions. (Defenders would need to reject this abstract artifact ontology).
  4.  **Damaging:** If functionalism is true for institutions (i.e., an institution *just is* whatever entity performs its core function within a society), then any entity performing that function in another world *is* identical to the original, eliminating the need for counterpart relations. (Defenders must argue function alone is insufficient for identity, requiring historical/structural continuity via counterparts).
  5.  **Awkward:** If our robust modal intuitions consistently treat institutions (e.g., "Could the *actual* Supreme Court exist with a different number of justices?") as supporting transworld identity through significant changes in mandate/structure, counterpart theory appears counterintuitive and adds unnecessary complexity. (Defenders might dismiss this as pre-theoretical intuition or refine descriptions).
