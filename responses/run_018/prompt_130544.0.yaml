answer: |-
  ### Teaching Plan: Kant's Universalizability Framework for Science Professionals

  **Session Goal:** To demonstrate why Kant's universalizability tests are logical machinery (formal procedures for testing maxims) rather than moral intuition pumps, using a contemporary research ethics case. The focus is on distinguishing the Formula of Universal Law (with its two tests) from the Formula of Humanity, while preempting common misconceptions.

  **Total Time:** 75 minutes  
  **Pedagogical Approach:** Concrete example-driven, minimal abstraction, emphasis on logical structure over moral debate.  

  ---

  #### **Sequence of Components (50 minutes of explanatory content)**  
  1. **Groundwork: Deontology vs. Consequentialism (10 min)**  
     - **Why start here?** Kant’s framework is deontological—duty-based, not outcome-based. Without establishing this, participants will default to consequentialist interpretations.  
     - **Key move:** Contrast a consequentialist approach (e.g., "Suppressing the outlier might maximize societal benefits") with Kant’s core question: "Is this action permissible *regardless* of outcomes?"  
     - **Dependency:** Universalizability cannot be formulated without first grasping that Kant rejects consequences as the basis of morality.  

  2. **Maxims and the Formula of Universal Law (FUL) (15 min)**  
     - **Why next?** FUL is the entry point to universalizability. Participants must understand that we test *maxims* (subjective principles), not actions in isolation.  
     - **Key move:** Define the scientist’s maxim: *"I will suppress one outlier in replication data when it threatens a valuable theory and detection is unlikely."* Stress that FUL asks: "Can this maxim be universalized?"  
     - **Dependency:** Universalizability tests require a clearly defined maxim; without it, the logical machinery stalls.  

  3. **Contradiction-in-Conception Test (CC) (10 min)**  
     - **Why before Contradiction-in-Will?** CC is the first layer of FUL, testing logical coherence. If CC fails, the maxim is forbidden; CW is irrelevant.  
     - **Key move:** Universalize the maxim: *"Everyone suppresses one non-critical outlier when a theory is valuable and detection unlikely."*  
       - **Contradiction:** Replication science relies on transparency. Universal suppression destroys the concept of replication (no trustworthy data exists), making the maxim self-defeating.  
     - **Dependency:** CC must precede CW because it establishes whether the maxim is *conceivable* as universal law—a prerequisite for testing rational will.  

  4. **Contradiction-in-Will Test (CW) (5 min)**  
     - **Why after CC?** CW applies only if CC passes (here it doesn’t, but explain hypothetically).  
     - **Key move:** Ask: "Can a scientist *rationally will* this universalized world?" Even if conceivable, she cannot will a world where data manipulation is normalized, as it undermines science itself—a rational necessity for her work.  
     - **Dependency:** CW builds on CC by introducing the agent’s rational commitments.  

  5. **Formula of Humanity (FH) (10 min)**  
     - **Why last?** FH is a distinct formula, often conflated with FUL. Introducing it separately prevents collapse into a single "Kantian test."  
     - **Key move:** FH: *"Treat humanity as an end, never merely as a means."*  
       - Apply to the example: Suppressing the outlier uses peers/public as mere tools (depriving them of truth) to advance a theory, violating their autonomy.  
     - **Dependency:** FH requires prior understanding of FUL to highlight their differences: FUL tests logical consistency, FH tests respect for rational agency.  

  #### **Carrying Example: Research Ethics Case**  
  - **Scenario:** A scientist considers suppressing a non-critical outlier in replication data to preserve a socially valuable theory. Maxim: *"I will suppress one outlier in replication data when it threatens a valuable theory, on the condition that detection is unlikely."*  
  - **Required Features:**  
    - Ambiguous intuitive pull: Scientists may sympathize with theory preservation (pragmatism) vs. data integrity (principle).  
    - Transparent logical structure: Clear maxim with a condition ("detection unlikely") for universalization.  
  - **Excluded Features:**  
    - Emotional revulsion: Avoids visceral reactions (e.g., suicide/false-promise cases) that trigger instinctive condemnation and bypass logical analysis.  
  - **Why Not Standard Examples:**  
    - False-promise/suicide cases provoke emotional bias (e.g., "lying is always wrong") and obscure the logical machinery. Our example is profession-relevant and morally gray, forcing engagement with Kant’s tests.  

  #### **Misconceptions to Preempt**  
  1. **Misconception:** Universalizability as consequentialist calculus.  
     - **Entry Point:** During *Groundwork* (Step 1) or when applying *FUL* (Step 2).  
     - **Deflection Move:** Emphasize that bad outcomes (e.g., "science collapses if everyone does this") are irrelevant. The contradiction is *internal* (e.g., replication becomes impossible), not outcome-based.  

  2. **Misconception:** Equating universalizability with the Golden Rule.  
     - **Entry Point:** When defining *maxims* (Step 2).  
     - **Deflection Move:** Clarify that Kant tests *rational consistency* ("Can my maxim be universal law?"), not reciprocity ("Do unto others...").  

  3. **Misconception:** Contradiction = "Bad outcomes follow."  
     - **Entry Point:** During *CC test* (Step 3).  
     - **Deflection Move:** Stress that contradiction is *logical* (e.g., universal suppression destroys replication’s purpose), not empirical.  

  4. **Misconception:** Collapsing FUL and FH into one test.  
     - **Entry Point:** When introducing *FH* (Step 5).  
     - **Deflection Move:** Juxtapose FUL (logical universality) and FH (human dignity). Ask: "Could a maxim pass FUL but fail FH?" (e.g., "Never help others" may be universalizable logically but violates humanity).  

  #### **Check for Understanding**  
  - **Question:** *"If the scientist argues suppression is acceptable because she’s the only one doing it, how would Kant’s CC test respond?"*  
  - **Correct Answer Reveals:** Grasp of logical structure—e.g., "Universalization isn’t about real-world rarity; it tests if the maxim *could* be a law without contradiction. Here, it can’t because replication science collapses."  
  - **Incorrect Answer Reveals:** Consequentialist thinking—e.g., "If everyone did it, journals would lose trust" (focuses on outcomes, not self-defeat).  

  #### **Omitted Material**  
  - **Metaphysics of freedom:** No time; requires background in transcendental idealism, irrelevant to applying the tests.  
  - **Kingdom of ends:** A derivative concept; adds complexity without clarifying core distinctions.  
  - **Textual exegesis:** Not needed; we teach concepts, not Kant scholarship.  

  ---

