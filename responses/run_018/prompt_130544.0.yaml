prompt: |-
  As a journalist who covers science and ideas, I run a seventy-five-minute interdisciplinary salon for professionals in science editing, policy, and engineering—none with formal philosophy training. At our last meeting, a biologist colleague asked over coffee why philosophers treat Kant's universalizability tests as logical machinery rather than moral intuition pumps, and I want next month's session to answer precisely that. The concept I need taught is Kant's universalizability framework, specifically the distinction between the Formula of Universal Law—with its internal contradiction-in-conception and contradiction-in-will tests—and the Formula of Humanity, emphasizing that they are not interchangeable and that universalizability is not consequentialist reasoning in disguise.

  Do not explain Kant to me; instead, plan the explanation for this audience. Specify the order in which the components must be introduced and why that dependency holds—what logical idea must be in place before universalizability can even be formulated, how the two formulas should be separated, and in what sequence the two contradiction tests should be introduced within the first formula. For the carrying example, do not use the classic false-promise or suicide cases; instead, build the session around a contemporary research-ethics maxim: a scientist considers suppressing a single non-critical outlier in a replication dataset to preserve a theory she judges socially valuable, with the maxim being "I will suppress one outlier in replication data when it threatens a valuable theory, on the condition that detection is unlikely." Explain what this example must possess—ambiguous intuitive moral pull but a transparent logical structure—and what it must lack—immediate emotional revulsion that short-circuits analysis—to serve as the session's backbone, and why the standard examples fail on these criteria. Then map the misconceptions the audience will bring or form: treating universalizability as a consequentialist calculus, reading it as the Golden Rule, interpreting contradiction as "if everyone did this, bad outcomes would follow," and collapsing the two formulas into a single test. For each, identify the exact point in the sequence where it should be headed off and with what conceptual move. Include one check for understanding—an applied question using the replication-outlier case that reveals whether participants grasp the logical structure of contradiction rather than merely expressing moral discomfort—and state clearly what should be left out at this level (for instance, the metaphysics of freedom, the kingdom of ends, or any textual exegesis of specific works) with a brief justification for each omission.

  Present your teaching plan in prose, then provide a brief structured summary as a JSON object with the following fields: "sequence_steps" (array of objects with "order", "component", "dependency_rationale"), "carrying_example" (object with "scenario", "required_features", "excluded_features", "why_not_standard"), "misconceptions" (array of objects with "label", "entry_point_in_sequence", "deflection_move"), "understanding_check" (object with "question", "what_correct_answer_reveals", "what_incorrect_answer_reveals"), "omitted_material" (array of objects with "item", "reason_for_omission"), and "session_duration_minutes".
reasoning: |-
  We are designing a 75-minute interdisciplinary salon for professionals without formal philosophy training. The goal is to explain Kant's universalizability tests, specifically distinguishing the Formula of Universal Law (FUL) with its two contradiction tests from the Formula of Humanity (FH), and to show that universalizability is not consequentialist reasoning.

  Key components to cover:
  1. The foundational idea: Kant's deontological framework (duty-based, not consequence-based).
  2. The concept of a maxim (subjective principle of action).
  3. The Formula of Universal Law (FUL): 
     a. Contradiction in conception (CC) test.
     b. Contradiction in the will (CW) test.
  4. The Formula of Humanity (FH): treating humanity as an end in itself.
  5. Clarify that FUL and FH are distinct and not interchangeable.

  We must avoid:
  - Consequentialist interpretations.
  - Treating universalizability as the Golden Rule.
  - Misunderstanding "contradiction" as leading to bad outcomes.
  - Merging FUL and FH.

  Our carrying example: 
  A scientist considers suppressing a non-critical outlier in replication data to preserve a socially valuable theory. 
  Maxim: "I will suppress one outlier in replication data when it threatens a valuable theory, on the condition that detection is unlikely."
  Why this example? 
  - It has ambiguous moral pull (some might see it as pragmatic, others as dishonest) but transparent logical structure (we can clearly see the maxim and test it).
  - It lacks immediate emotional revulsion (unlike false-promise or suicide cases, which can trigger strong emotions that bypass logical analysis).

  Session Structure (75 minutes total):

  1. Introduction (5 min): 
     - State the question from the biologist: Why treat universalizability as logical machinery, not just an intuition pump?
     - Preview: We'll unpack Kant's universalizability tests as logical procedures.

  2. Foundational Concepts (10 min):
     - Kant's deontology: Morality based on duty and reason, not consequences.
     - Introduce the idea of a maxim: The subjective principle on which one acts. It must be universalizable to be morally permissible.
     - Dependency: Without understanding that we are testing maxims (not actions in isolation) and that the test is about logical consistency (not outcomes), the universalizability tests cannot be formulated.

  3. Formula of Universal Law (FUL) and its Tests (30 min):
     - Explain FUL: "Act only according to that maxim whereby you can at the same time will that it should become a universal law."
     - Introduce the two tests sequentially (must do CC first because it is about the logical possibility of the maxim as a universal law, then CW which is about the agent's rational will).
     a. Contradiction in Conception (CC) Test (15 min):
        - Ask: Can the maxim be conceived as a universal law without contradiction? If not, it is absolutely forbidden.
        - Apply to the example: Maxim: "I will suppress one outlier ... when detection is unlikely."
          - Universalize: Everyone suppresses one outlier in replication data when it threatens a valuable theory and detection is unlikely.
          - Contradiction? Consider the purpose of replication data: to verify results. If everyone suppressed non-critical outliers when they thought it was for a good cause and unlikely to be detected, the practice of replication would become unreliable because outliers (even non-critical ones) might be important in aggregate or for future research. The trust in replication studies would erode. Thus, the very concept of replication (which relies on full reporting) would be undermined. We cannot even conceive of a world where this is a universal law because it destroys the practice it depends on.
        - Why this is a contradiction in conception: The universalized maxim is self-defeating. It makes the practice of replication impossible because no one would trust replication studies if they knew outliers were being suppressed arbitrarily.

     b. Contradiction in the Will (CW) Test (15 min):
        - Now, even if the maxim passes CC, we ask: Can you rationally will the universalized maxim without contradicting your own will?
        - This test applies to maxims that are conceivable but lead to a situation that no rational agent would will because it would conflict with something we necessarily will (like the development of our talents, helping others in need, etc.).
        - Apply to the example: Suppose we adjust the maxim to avoid the CC (maybe by making it very rare and only for non-critical cases). But note: In the example, the scientist is acting to preserve a theory she judges socially valuable. However, if everyone suppressed outliers when they thought it was for a valuable theory, then the scientific enterprise would become corrupted. As a rational agent, the scientist must will the conditions that make science possible, including trustworthiness and reliability of data. Thus, she cannot will a world where such suppression is universal because it would make science (and the very possibility of having valuable theories) impossible. This would contradict her own will to promote valuable theories.

  4. Formula of Humanity (FH) (15 min):
     - Introduce FH: "Act in such a way that you treat humanity, whether in your own person or in the person of any other, always at the same time as an end and never merely as a means."
     - Emphasize: This is a different test. It focuses on respecting the rational agency in ourselves and others.
     - Apply to the example: Suppressing the outlier uses the scientific community (and the public that relies on science) merely as a means to promote the theory. It fails to respect their autonomy (their right to accurate information) and thus treats them as mere instruments. Even if the scientist believes the theory is valuable, she is deceiving others and thereby violating their status as ends in themselves.

  5. Distinguishing FUL and FH and Addressing Misconceptions (10 min):
     - Recap: FUL is about the form of the maxim (can it be universalized without contradiction?) and FH is about the content (does it respect humanity?).
     - They are not interchangeable: An action might pass one but fail the other. However, in Kant, both must be passed for an action to be permissible. But for this session, we focus on the distinction and the independent tests.
     - Common misconceptions to address at various points:
       a. Treating universalizability as consequentialist (e.g., "if everyone did this, bad outcomes would follow"): 
          - When? While explaining the contradiction tests (step 3). 
          - Deflection: Emphasize that the contradiction is in the concept or the will, not in the outcomes. The replication example: the problem isn't that bad consequences might follow (though they might) but that the universalized maxim is self-defeating (CC) or that the agent cannot rationally will it (CW).
       b. Reading it as the Golden Rule (do unto others...): 
          - When? When introducing maxims and universalization (step 2 and 3). 
          - Deflection: Note that Kant is not about how you want to be treated but about whether your maxim can hold as a universal law. The Golden Rule is about reciprocity; Kant is about rationality and consistency.
       c. Interpreting contradiction as leading to bad outcomes: 
          - When? During the explanation of the contradiction tests (step 3a and 3b). 
          - Deflection: Focus on the internal logical contradiction. In the replication case, the contradiction in conception is that the practice of replication becomes incoherent if everyone suppresses outliers arbitrarily. It's not that it leads to bad science (which is a consequence) but that it makes the concept of replication impossible.
       d. Collapsing FUL and FH into one test: 
          - When? When introducing FH (step 4) and during the recap (step 5). 
          - Deflection: Explicitly contrast the two. FUL tests the maxim's form (universalizability) and FH tests the maxim's content (respect for persons). The replication example fails both, but for different reasons.

  6. Check for Understanding (5 min):
     - Question: "If the scientist argues that her suppression of the outlier is acceptable because she is the only one doing it and she is doing it for a good cause, how would Kant's FUL (specifically the contradiction in conception test) respond?"
     - Correct answer: The FUL test doesn't depend on the actual consequences or how many people are doing it. It asks: what if everyone did it? And in this case, if everyone suppressed outliers when they thought it was justified, replication would become untrustworthy and the concept of replication would be undermined. Thus, the maxim cannot be universalized without contradiction, so it is forbidden.
     - What it reveals: They understand that the test is about the logical structure of universalization and not about the specific circumstances or consequences.
     - Incorrect answer: Focusing on the bad consequences (e.g., "if everyone did it, science would collapse") or on the fact that she is the only one doing it (which is irrelevant to the universalization test).

  7. Omitted Material (with reasons):
     - The metaphysics of freedom: Too abstract and not necessary for understanding the universalizability tests at this level.
     - The kingdom of ends: A further formula that builds on FH; we are focusing on the core two.
     - Textual exegesis: We are not interpreting specific passages from Kant's works; we are teaching the concepts.

