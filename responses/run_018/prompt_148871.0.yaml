answer: |-
  It's brilliant that you're wrestling with Aquinas's dense text – this exact tension between authority, causal structure, and proportionality is central to modern double effect debates. Let's break down ST II-II, q.64, a.7 and see how it applies to your fat man trolley case.

  **Aquinas's Core Argument (ST II-II, q.64, a.7):**

  1.  **The Act's Double Effect:** An act of self-defense can have two effects: (a) saving one's own life (good), and (b) killing the aggressor (evil).
  2.  **Intention Constraint:** The act is permissible *only if* the agent intends *only* the good effect (self-preservation). The evil effect (killing) must be *praeter intentionem* – outside the intention, not intended as an end or a chosen means.
  3.  **Proportionality Constraint:** The act must be proportionate ("moderamen inculpatae tutelae" – blameless defense within due limits). The defense must use only the force necessary to repel the unjust aggression. Using excessive force or lethal force when non-lethal suffices is forbidden.
  4.  **The Authority Analogy:** Aquinas *contrasts* private self-defense with public authority executing criminals. Public authority acts "ad bonum commune" (for the common good) and has the *jurisdiction* ("potestas judiciaria") to intend the death of a malefactor as a means to justice and public safety. The private defender *lacks* this jurisdiction.

  **Applying this to Your Questions:**

  1.  **Is the wrongness of pushing the fat man mainly about lacking authority or the causal structure?**
      *   **Causal Structure is Primary in Aquinas's Self-Defense Framework:** Aquinas's core argument for the *private individual* hinges on the *nature of the act* and the *intention*. The killing must be an *unintended side effect* of an act primarily aimed at defense. Pushing the fat man is problematic *first* because his death is the *direct, intended mechanism* of your salvation. You *use* his body and his death *as the means* to stop the trolley. This violates the "praeter intentionem" requirement – his death isn't a side effect; it's the chosen tool.
      *   **Authority Reinforces, But Doesn't Primarily Explain, the Fat Man Wrongness:** The authority analogy highlights a *different justification* for killing (public jurisdiction for the common good). Its inclusion underscores that *private* individuals *cannot* intend death as a means precisely *because* they lack this public jurisdiction. While relevant contextually, the *immediate* wrongness Aquinas identifies in disproportionate self-defense or intending death is rooted in the act's structure and intention, *not solely* the lack of authority. Authority explains *why* public execution can *intend* death, not why private self-defense *cannot*.

  2.  **Does the proportion clause help decide between these interpretations?**
      *   **Yes, and it favors the causal/intentional reading over pure authority:**
          *   **Proportionality as Constraining Means (Mental State + Causal Efficacy):** Proportionality isn't *just* about internal mental states ("don't *want* to hurt more than needed"). It's fundamentally about *what means you choose to employ*. Choosing a means that *inherently* involves disproportionate force (like lethal force when non-lethal would suffice) is forbidden, *even if* you sincerely wish minimal harm. This inherently links the mental state (choosing this act) to the causal structure of the act itself.
          *   **Proportionality vs. Fat Man:** Pushing the fat man is *disproportionate* in the Aquinian sense *because* the chosen means *is* lethal force applied directly to an innocent person. It's not a matter of "using just a little lethal force"; the *act itself* is inherently disproportionate for a private individual defending themselves. It directly causes death as the chosen mechanism.
          *   **Proportionality Reinforces the Causal Distinction:** Proportionality helps explain *why* some acts causing death as a side effect are permissible (e.g., raising your arm to block a blow, unintentionally striking the aggressor's head fatally *if* that was the minimally necessary defensive motion) while others aren't. It rules out acts where the *only way* the defense works *is* by directly causing lethal harm to the aggressor (or a bystander) as a means. Pushing the fat man fails both intention *and* proportionality – the means chosen *is* direct, lethal force against an innocent.

  3.  **What about that 1920s Modal Robustness Reading?**
      *   **Not Supported by Aquinas's Text:** The idea that "the defense must be such that in nearby possible worlds where the aggressor doesn't die, you still survive" is an anachronistic projection. Aquinas doesn't engage in modal logic.
      *   **Why it *Seems* Relevant (But Isn't Aquinas's Point):** This reading *approximates* the idea that the death shouldn't be the *necessary chosen means*. If your survival *requires* his death as the direct mechanism (as in the fat man push), then in worlds where he doesn't die, you *don't* survive. Whereas, in a classic Aquinas self-defense scenario (e.g., shoving an attacker who falls and hits their head), your shove was *intended* to create distance/stop the attack; the death was a possible but unintended side effect. The shove *could* have worked without death occurring. However, Aquinas's focus is on the *nature of the chosen act here and now* (does it *intend* death? is it *disproportionate*?), not on counterfactual robustness across possible worlds. His proportionality is about the *actual* force used being necessary and not excessive, judged in the circumstances.

  **Conclusion & Advice for Your Diss:**

  *   **For Aquinas, the primary wrongness in a case like pushing the fat man lies in the violation of the intention constraint *and* the proportionality constraint, which are deeply intertwined with the causal structure of the act.** The defender directly intends the death of the innocent bystander as the chosen means to stop the trolley, and the chosen means is inherently lethal and disproportionate force applied to an innocent.
  *   **Lack of authority is a *reinforcing* factor, explaining *why* intending death is forbidden to private individuals, but it is not the *core* explanation for why the fat man push is wrong *within the self-defense analogy*. The core explanation is that it intends evil as a means and uses disproportionate force.**
  *   **Proportionality is both mental (choosing an act known to be excessive) and causal (the act chosen is one that inherently inflicts disproportionate harm).** It rules out acts where the defensive mechanism *is* the direct infliction of lethal force, especially on non-aggressors.
  *   **Ditch the Modal Robustness:** While an interesting modern gloss, it's not Aquinas. Focus on his actual concepts: *praeter intentionem* (unintended side effect) and *moderamen inculpatae tutelae* (blameless defense within due limits/proportionality). These are about the act *as chosen* in the actual circumstances.

  **How to Frame This in Your Chapter:**

  1.  **Clarify Aquinas's Core:** Emphasize that for *private* self-defense, permissibility hinges *only* on the act's intention and proportionality. Authority is introduced to *contrast* a fundamentally *different* justification (public common good).
  2.  **Apply to Trolley:** Argue that pushing the fat man fails Aquinas's test for private defense: It *intends* death as the means (violating *praeter intentionem*) and the chosen means is lethal force against an innocent (violating proportionality). Diverting the trolley (killing one worker as a side effect) is a *closer* analogy to Aquinas's self-defense case (death is foreseen but not intended as the means; the means is diverting the threat), though significant differences remain (e.g., bystander vs. aggressor).
  3.  **Distinguish Authority:** State clearly that while the public authority analogy shows Aquinas *does* recognize contexts where intending death is permissible, this *reinforces* that the fat man push is wrong *as private action* precisely because it *requires* intending death, which private individuals cannot do. The lack of authority is the *reason why* intending death is forbidden to the private actor, but the *mechanism* of the wrongness in the act itself is the intention + disproportionate causal structure.

  Your advisor might think you're overthinking because Aquinas's text is famously concise and leaves much implicit. But the ambiguity you're wrestling with – the interplay of intent, proportionality, causality, and authority – *is* the central puzzle modern double effect theorists grapple with using his text! You're not overthinking; you're hitting the core conceptual tension. Pin your argument to his specific Latin terms (*praeter intentionem*, *moderamen inculpatae tutelae*, *ad bonum commune*, *potestas judiciaria*) to ground your interpretation. Good luck with the chapter!
