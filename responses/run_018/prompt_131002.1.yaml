   **Principle of Counterfactual Influence and Causal Responsibility (Revised)**:

   1. **Counterfactual Dependence Clause**: If an outcome O in the past or present is counterfactually dependent on your current action A (i.e., if you were to choose A, then O would have occurred, and if you were to choose not-A, then O would not have occurred), and if O is sufficiently valuable (or disvaluable), then this dependence provides a strong reason to choose A (or not-A) to bring about (or prevent) O, even in the absence of causal influence.

   2. **Causal and Evidential Separation Clause**: If there is no counterfactual dependence of past or present outcomes on your action, then your action should be chosen based on (i) its causal consequences in the present and future, and (ii) the evidence it provides about the state of the world (which might affect the expected utility of the action). However, evidence without causal power should not be acted upon if it does not correspond to a counterfactual dependence.

   3. **Acausal Coordination Clause**: When your action is logically or acausally linked to the actions of other agents in other decision problems (e.g., through identical decision procedures), then the action should be chosen to maximize the aggregate expected utility across all linked problems.

   4. **Calibration Invariance Clause**: The source of a predictor's accuracy (e.g., whether it is calibrated on your past behavior) does not break counterfactual dependence and does not change the normative force of the counterfactual dependence.

   5. **Future Causal Consequences Clause**: Future consequences that are causally affected by your action should be included in the causal decision-theoretic calculation.

