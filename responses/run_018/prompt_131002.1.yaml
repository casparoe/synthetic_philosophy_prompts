    EU(pay) = -1000 - 0.4·C₂  
    EU(refuse) = -0.6·C₁  
    → Refuse if 0.6·C₁ < 1000 + 0.4·C₂.  
  - **Tension**: You note the "contingent generation" feels non-symmetric to Case 1. CIM agrees: this is causal, not counterfactual.  
  - **Consistency**: ~ (Verdict "unsure" aligns with CIM’s dependence on C₁/C₂ values).  

