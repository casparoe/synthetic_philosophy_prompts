prompt: |-
  hey, i'm a novelist and my new book is built on illusionism about phenomenal consciousness — the idea that there is no qualitative feel over and above the brain's self-model, and the sense of immediacy is just a useful fiction the system tells itself. next thursdy i'm presenting at the philosophy of mind colloquim — mostly analytic realists about qualia, a couple neuroscientists who think consciousness is just an unsolved NCC problem, plus one grad student really into panpsychism. they think illusionism is either self-refuting or eliminativism with lipstick. draft my Q&A prep sheet, not a defense essay. my sketch: introspective access is always mediated by working memory and attentional framing, so the immediacy we report is already a reconstructed narrative, not direct acquaintance with raw feel. i want objections ordered by how likely and damaging, phrased the way they'd actually ask them, each with a two-minute reply and a note where the reply is soft. tell me what to concede up front. and include the one i'm praying nobody asks — about whether my characters can suffer if qualia don't exist — in their voice. keep it casual, no citations or reading lists, just the actual prep.
