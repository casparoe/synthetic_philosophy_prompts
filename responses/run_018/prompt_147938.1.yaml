prompt: |-
  ok so me and my roommate got into it last night about bayesian old evidence. he said if mercury's orbit was already known before GR, then P(E) is basically 1 so the bayes factor is flat and einstein gets no credit. i brought up this idea called counterfactual prior resetting where you imagine your prior before seeing E and then run the update, but he said thats just cheating because you can't change your actual prior after the fact. but heres what i dont get: bayesian credences are diachronic, right? theyre tied to an agent at a specific time. so at t1 i know E and have low credence in GR. at t2 i learn GR predicts E. why can't i just update my t2 credence in GR based on the predictive match, without pretending i never knew E? it feels like the old-evidence problem only hits if you treat probabilities like timeless logical relations instead of mental states that evolve. is the puzzle really just a confusion between static logical probability and diachronic credence, or is there an actual coherence constraint im missing that blocks this?
reasoning: |-
  Okay, let me start by unpacking the user's question. They're dealing with the Bayesian old evidence problem, specifically in the context of Einstein's theory of General Relativity (GR) and Mercury's orbit. The user and their roommate are arguing about whether Einstein gets credit for predicting Mercury's orbit, even though the evidence (Mercury's orbit anomaly) was already known before GR was developed. 

  The roommate's point is that since P(E) was already 1 (because the evidence was known), the Bayes factor doesn't change, so no update happens. The user brought up counterfactual prior resetting, but the roommate dismissed it as cheating. The user's main confusion is why they can't just update their credence at time t2 when they learn that GR predicts E, without pretending they didn't know E. They suspect the old evidence problem stems from conflating static logical probability with diachronic credence.

  First, I need to recall the core of the old evidence problem. Bayesian updating uses the formula P(H|E) = [P(E|H) * P(H)] / P(E). If E is already known, P(E) is 1, and P(E|H) is also 1 (since H predicts E), so P(H|E) equals P(H). No update. But intuitively, when a theory explains known evidence, it should get credit. The user's insight about diachronic credence seems relevant here.

  The user proposes updating at t2 when they learn that GR predicts E. At t1, they know E and have low credence in GR. At t2, they learn that GR entails E. The key here is the new information isn't E itself, but the logical relationship between GR and E. So the update isn't about E (which is already known) but about the fact that H implies E. This shifts the focus from updating on E to updating on the proposition that H predicts E, which is new evidence at t2.

  I should consider the distinction between evidence and meta-information about the theory's predictions. When we learn that H predicts E, even if E is old, it provides information about H's explanatory power. The user's approach avoids counterfactuals by using the current knowledge state. The update at t2 is based on the likelihood of observing that H entails E, which might differ based on whether H is true or not.

  For example, if H is true, it's more likely that it would predict known evidence E. If H is false, it might be less likely to align perfectly with E. The likelihood ratio P(GR predicts E | GR) vs. P(GR predicts E | ~GR) could be high, leading to an update. This doesn't require resetting the prior; it's a valid conditional update on new information.

  The user's roommate might object that this is cheating because P(GR predicts E | GR) is 1 by definition. But in practice, theories don't always perfectly predict evidence; there might be approximations or adjustments. Even if it's 1, the denominator P(GR predicts E | ~GR) might be low. How likely is a false theory to make a precise prediction like Mercury's orbit? If that probability is low, the Bayes factor is high.

  I also need to address the user's deeper need. They want to resolve the conflict between Bayesian formalism and intuitive scientific credit. They suspect the problem is a confusion between static and dynamic probabilities. Their solution using diachronic updates aligns with how Bayesian agents actually learn over time. The core issue might be that traditional Bayesianism focuses on logical probabilities, but agents update on their awareness of logical connections, which can happen at any time.

  Potential pitfalls: Defining the exact proposition for update. The new evidence is "H entails E," which requires the agent to recognize this entailment. This is feasible but needs careful formalization. Also, assigning probabilities to logical truths might be tricky, but in practice, agents have credences about these relationships based on their understanding.

  In conclusion, the user's intuition is correct. The old evidence problem can be mitigated by focusing on the diachronic update when learning the explanatory relationship, treating it as new information. This avoids counterfactuals and adheres to standard Bayesianism. The roommate's objection might stem from an overly rigid view of evidence, not accounting for meta-information about theories.
answer: |-
  Your intuition is spot on! The old evidence problem (OEP) is largely a *conceptual confusion* arising from misapplying the static, synchronic Bayesian update rule to a fundamentally *diachronic* process involving changes in an agent's *knowledge state* beyond just adding new evidence. Here's a breakdown:

  1.  **The Core of the Old Evidence Problem (OEP):**
      *   **Formal Issue:** If `E` is already known with certainty (`P_t1(E) = 1`) when evaluating a new hypothesis `H`, then:
          *   `P_t1(H|E) = P_t1(H)` (Because `P(E|H)` is typically 1 if `H` entails `E`, and `P(E) = 1`).
          *   Learning that `H` entails `E` doesn't change the posterior. Formally, `P_t1(H | E, (H⊢E))` still equals `P_t1(H)`.
      *   **Intuitive Problem:** This seems wrong. Discovering that `H` explains `E` *should* boost our credence in `H`. Einstein *should* get credit for Mercury's orbit.

  2.  **Your Roommate's Argument (Standard OEP Position):**
      *   Focuses strictly on the synchronic probability distribution *at the time `H` is proposed*. `E` is already in the background knowledge `K_t1`, so `P_t1(E|K_t1) = 1`.
      *   Claims any counterfactual reasoning ("What if I hadn't known `E`?") is illegitimate "cheating" because it alters the actual background knowledge defining the prior.

  3.  **Your Insight: Diachronic Credence is Key**
      *   **You are fundamentally correct.** Bayesianism is a theory of *rational belief updating for an agent over time*. Credences (`P_t`) are indexed to a time `t` and a specific knowledge state `K_t`.
      *   **The Relevant Update Happens at `t2`:** The crucial moment isn't the initial proposal of `H` (`t1`), but the later time `t2` when you learn a *new fact*: **"`H` entails `E`"** or **"`H` predicts `E`"** (Let's call this new proposition `M` for "match" or "entailment").
      *   **`M` is New Information:** At `t1`, you knew `E` and had some prior `P_t1(GR)`. You *did not know* `M` (that GR entailed Mercury's orbit). Learning `M` at `t2` *is* new evidence that warrants an update.

  4.  **Updating at `t2` on `M`:**
      *   Your credence at `t2`, *before* learning `M`, is `P_t2(GR | K_t2)`. `K_t2` includes `E` and whatever else you knew up to `t2`. This might be equal to `P_t1(GR | E)` if nothing else relevant changed.
      *   You then learn `M`: "GR entails the precession of Mercury's perihelion."
      *   You perform a **standard Bayesian update** on `M`:
          `P_t3(GR) = P_t2(GR | M) = [P_t2(M | GR) * P_t2(GR)] / P_t2(M)`
      *   **Why this makes sense:**
          *   `P_t2(M | GR)` is likely **very high (close to 1)**. If GR is true, it's very probable that its calculations would yield the correct precession (assuming the math is done correctly).
          *   `P_t2(M | ~GR)` is likely **much lower**. What's the probability that a *false* theory would, by chance, entail the *exact, highly specific*, and previously anomalous value of Mercury's perihelion precession? This probability is presumably quite small.
          *   **Therefore:** The Bayes Factor `[P_t2(M | GR) / P_t2(M | ~GR)]` is **large (>1)**. Learning `M` *does* significantly increase your credence in GR at `t3`.
      *   **No Counterfactual Needed:** You didn't pretend to forget `E`. You simply updated on the *new information* `M` about the logical relationship between `H` (GR) and the known evidence `E`.

  5.  **Addressing the "Timeless Logic" vs. "Diachronic Credence" Point:**
      *   You've nailed the core issue. The OEP arises when people mistakenly treat `P(E)` in the update rule as a *timeless, logical probability* inherent in the universe, rather than as representing the *agent's degree of belief in `E` at a specific time `t` given their knowledge `K_t`*. At `t1`, `P_t1(E) = 1` *because `E` is known*. This blocks the standard update *on `E` itself*.
      *   However, learning `M` ("`H` entails `E`") at `t2` is fundamentally different. `M` was *not* known at `t1`. `M` is a *new proposition* about the explanatory relationship. Updating on `M` is perfectly coherent diachronic Bayesianism.

  6.  **Is There a Coherence Constraint Blocking This?**
      *   **No.** This update is perfectly coherent. The key is correctly identifying the *proposition* being learned at each step.
      *   **Potential Wrinkle - Logical Omniscience:** Strict Bayesianism assumes logical omniscience (knowing all logical truths instantly). If we assume this, then `M` (`H ⊢ E`) would have been known as soon as `H` and `E` were known! `P_t1(M)` would be 1 if `H` truly entails `E`, blocking the update at `t2`.
      *   **The Resolution - Bounded Rationality:** Real agents are not logically omniscient. We *discover* logical relationships like `H ⊢ E` over time. `M` represents the *agent learning this entailment*. This discovery is a genuine piece of new information that warrants an update, precisely because the agent *wasn't* certain of the entailment before (`P_t2(M) < 1`). Bayesianism, as applied to real agents, must account for this.

  **Conclusion:**

  You win the argument with your roommate (well, the technical Bayesian point, at least!). His argument relies on a synchronic snapshot at `t1` that ignores the crucial diachronic update when the *explanatory connection* (`M`) is learned at `t2`.

  *   **The Problem:** The OEP stems from misapplying the update rule for learning `E` itself to a situation where `E` is already known. It mistakenly treats `P(E)` as a timeless logical probability blocking the update.
  *   **The Solution:** Recognize that learning "`H` entails `E`" (`M`) is distinct from learning `E`. At the time `M` is learned (`t2`), it is new information. Updating on `M` using standard Bayesian conditionalization (`P_t3(GR) = P_t2(GR | M)`) *does* increase credence in `H`, giving Einstein (or GR) the credit it deserves, without any need for counterfactual prior resetting or violating coherence constraints. This approach fully embraces the diachronic nature of Bayesian credences and the reality of bounded rationality (learning logical relationships over time).
