answer: |-
  ### Simulation Design: "Grant Review Challenge"  
  **Total Time:** 75 minutes  
  **Participants:** 16 advanced undergraduates  
  **Goal:** Experience rational herding and information cascades through a peer-review simulation with hidden incentives.  

  ---

  ### 1. **Materials and Setup Rules**  
  **Materials:**  
  - 16 sealed envelopes (8 with a hidden red dot inside the flap; randomly assigned).  
  - Each envelope contains:  
    - A card with a **private score** (e.g., "Proposal Score: 63").  
    - *No mention of loyalty cost* (dots are invisible to students).  
  - Facilitator tools:  
    - Whiteboard to display the public sequence (e.g., "1. Approve ✓, 2. Reject ✗...").  
    - Hidden true mean: **52** (threshold for approval: ≥50).  
    - Score generation: Scores drawn from *Normal distribution (μ=52, σ=15)*, clipped to [0,100].  
    - Loyalty cost assignment: 8 random envelopes have a red dot (unknown to students).  

  **Setup:**  
  - Assign students numbers 1–16 (publicly visible order).  
  - Distribute envelopes randomly.  
  - Instructions: *"Do not open envelopes until instructed. Do not share your score."*  

  ---

  ### 2. **Payoff Matrix**  
  | Outcome                          | Points | Condition                                                                 |  
  |----------------------------------|--------|---------------------------------------------------------------------------|  
  | **Accuracy Reward**              | +15    | Recommendation matches *true quality* (approve if μ≥50, reject if μ<50) |  
  | **Alignment Reward**             | +5     | Recommendation matches *final group decision* (majority vote)             |  
  | **Loyalty Cost Penalty**         | -10    | *Only if:* (1) You have a red dot, AND (2) Your vote ≠ final group decision |  
  **Total Points Possible:** 20 (max), -10 (min).  
  - *Rationale:* Alignment reward (+5) incentivizes herding; loyalty cost (-10) deters breaking from the majority if penalized.  

  ---

  ### 3. **Minute-by-Minute Timeline**  
  **0–10 min: Setup (10 min)**  
  - Assign numbers (1–16), distribute envelopes, read instructions.  
  - Emphasize: *"Maximize your points. No discussing scores."*  

  **10–35 min: Simulation (25 min)**  
  - **10–12 min:** Students open envelopes, see private scores (not shared).  
  - **12–35 min:** Sequential declarations (90 seconds per student):  
    - Student 1 declares first (no prior info).  
    - Each subsequent student sees all prior recommendations on the board.  
    - *Expected cascade lock:* After 4–5 identical votes (e.g., 4 "approve" in a row).  
    - *Facilitator records votes publicly.*  

  **35–45 min: Results & Scoring (10 min)**  
  - Reveal true mean (**52**) and threshold (**50** → "approve" is correct).  
  - Announce final group decision (e.g., "Approve: 12 votes, Reject: 4 votes").  
  - Reveal loyalty cost:  
    - *"Some had a hidden rule: If your vote disagreed with the majority, you lost 10 points. Check for a red dot in your envelope."*  
  - Students calculate points (accuracy + alignment - penalty if applicable).  

  **45–75 min: Debrief (30 min)**  
  - Guided discussion (see Section 5).  

  ---

  ### 4. **Student-Facing Instructions**  
  *(Plain language; no jargon)*  
  **"Grant Review Challenge: Panelist Briefing**  
  You are a committee member reviewing a research proposal. Your goal is to maximize your points by:  
  1. **Accuracy:** Correctly judging if the proposal deserves funding (based on its hidden true quality).  
  2. **Alignment:** Matching the final group decision.  

  **Rules:**  
  - Each envelope holds your **private score** (0–100). *Do not share it.*  
  - Declare "Approve" or "Reject" when your number is called.  
  - You will see all prior votes. *Never the scores behind them.*  
  - Points:  
    - **+15 pts** if your vote aligns with the *true quality* (revealed later).  
    - **+5 pts** if your vote matches the *final group decision*.  
  - *Some have a hidden rule affecting points. It will be explained after voting.*  

  **Process:**  
  1. Open envelopes when instructed.  
  2. When called, state your vote clearly.  
  3. After all votes, we reveal true quality and scoring.  

  **Remember:**  
  - No discussing scores.  
  - Order: #1 to #16.  
  - Open your envelope now."  

  ---

  ### 5. **Facilitator Debrief Script**  
  **(45–75 min)**  
  **Part 1: Recreate the Sequence (5 min)**  
  - Display the vote sequence. Ask:  
    - *"Who felt torn between their score and the public votes? When?"*  
    - *"Early voters: Did you follow your score? Later voters: Why ignore it?"*  

  **Part 2: Map Concepts to Experience (15 min)**  
  - **Private Signal vs. Public Belief:**  
    > "Your score was your private signal. The public votes formed a ‘group belief.’ Once votes piled up (e.g., votes 3–5 all ‘approve’), your signal became less ‘trustworthy’ than the crowd—even if your score said ‘reject.’ This is *rational herding*."  
  - **Cascade Lock Point:**  
    > "After 4–5 identical votes, the crowd’s opinion outweighed individual signals. At this point, rational voters ignore their score—even if it contradicts the group. This is an *information cascade*."  
  - **Loyalty Cost Twist (Second-Order Reasoning):**  
    > "The hidden penalty created uncertainty. To break the cascade, you needed:  
    > 1. Strong confidence your score was right (overcoming the crowd).  
    > 2. Willingness to risk a penalty if the group didn’t follow you.  
    > 3. Guessing others *weren’t* held back by the same fear.  
    > This made cascades *self-sealing*: Even if many had contradictory scores, the penalty deterred dissent."  

  **Part 3: Relate to Real Institutions (10 min)**  
  - *Examples:* "Peer review, stock markets, or hiring committees. People follow the crowd not because they’re sheep—but because rationally, the crowd *might* know more. Hidden costs (like reputational risk) deepen this."  

  ---

  ### 6. **Simulation Limitations & Verbal Correction**  
  **Simplified/Misrepresented Feature:**  
  - *Bayesian updating with known signal precision.*  
    - **Issue:** Students don’t know score distribution (μ, σ) or how to weigh signals mathematically. Decisions are intuitive, not calculated.  
  - **Verbal Correction During Debrief:**  
    > "In formal models, agents use math to combine their signal’s *known precision* (e.g., ‘scores are ±15 off true quality’) with public votes. Here, you guessed precision. Real cascades assume agents know how noisy signals are."  

  ---

  ### 7. **Predicted Failure Mode & Recovery**  
  **Most Likely Failure:**  
  - *Early cascade break (e.g., student 3 rejects after two "approve" votes) due to:*  
    - Misreading payoff structure (e.g., overvaluing accuracy, ignoring alignment).  
    - Strong private score (e.g., 30) overriding nascent cascade.  

  **Recovery Strategy:**  
  - **In-Simulation:** If a break occurs early, note the vote but say: *"Remember, points depend on both accuracy *and* alignment."*  
  - **Debrief Leverage:** Turn the break into a teaching moment:  
    > "This mimics real life! Cascades aren’t unbreakable. If early voters have strong signals, they can reset the crowd. But after more votes, the crowd’s signal dominates—even if wrong."  

  ---

  **Self-Contained Design:** No external citations. Concepts emerge from rules, incentives, and debrief.
