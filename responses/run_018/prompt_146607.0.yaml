  **Rules**:
  - Do not share your private score with anyone.
  - When called, state your decision clearly: "Approve" or "Reject".

  **Order**: [Facilitator: fill in the order, e.g., by student number or randomly assigned number]

  **Now**: Open your envelope and look at your private score. Do not share it. We will start the sequence shortly.

  **Facilitator Debrief (Outline)**

  1. **Reveal the true quality and threshold**:
     - "The true quality of the proposal was 52. The threshold for approval was 50. So the correct decision was to 'Approve' the proposal."
     - "The group decision was [approve/reject] based on the majority of your votes."

  2. **Reveal the loyalty cost**:
     - "In this simulation, half of you were randomly assigned an 'institutional-loyalty cost'. This means that if your vote was in the minority (i.e., it did not match the final group decision), you lost 10 points. Let me reveal who had this cost."
     - Read the list of students with the cost.

  3. **Calculate points**: Have students calculate their points.

  4. **Concept Introduction**:
     - "This simulation was designed to illustrate two concepts: rational herding and information cascades."
     - "An information cascade occurs when individuals, despite having their own private information, follow the actions of others, ignoring their own information. This can happen when the public information (the sequence of decisions) becomes so strong that it overrides private signals."

  5. **Walk through the sequence**:
     - Point out the first few decisions. Ask the first few students: "Did you follow your own score?" (They likely did.)
     - At some point, note that consecutive decisions of the same type (e.g., three approves in a row) might have started a cascade.
     - Ask a student who followed the crowd: "Why did you ignore your own score?" 
     - Ask a student who broke the cascade: "What made you break the sequence?"

