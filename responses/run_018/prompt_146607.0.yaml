    - μ = 52, σ = 15.
    - Generate 16 scores: round(normal(52, 15)). Clip to 0-100 if necessary (but unlikely needed).

  - **Order of Declaration**: Assign numbers 1 to 16 randomly to the students.

  ### Payoff Matrix
  - Accuracy: 15 points for correct recommendation (relative to true quality and threshold).
  - Alignment: 5 points for matching the final group decision.
  - Penalty (for loyalty cost holders only): -10 points if their recommendation is in the minority (does not match the final group decision).

  Now, we write the student instructions and facilitator debrief in full.

