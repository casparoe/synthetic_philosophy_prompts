     - "In theory, after a few consistent signals, it becomes rational to follow the crowd even if your own signal contradicts it. For example, if the first two approve, then even if the third has a low score, they might think it more likely that the proposal is good and approve. Then the fourth sees three approves and might approve even with a low score. At that point, the cascade is locked: subsequent individuals will ignore their own signals because the public information dominates."

