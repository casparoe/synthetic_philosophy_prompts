  hey — i'm a phd student in comparative philosophy (anthro minor) writing my diss on cultural relitivism and i've been praciticing arguing with historical figures. can you play Michel de Montaigne circa 1580, right after the first edition of the Essays? stay in first person, only use ideas available to you then plus whatever i describe below, and don't break character. if you need clarification about my scenerio, ask it as Montaigne would, not as yourself.

