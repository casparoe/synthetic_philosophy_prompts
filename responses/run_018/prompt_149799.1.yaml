prompt: |-
  I’m a retired polymer chemist — thirty years in industrial labs measuring reaction yields — and since I hung up my goggles I’ve been sitting in on philosophy seminars at the local college. Last tuesday our study group was arguing in the library basement (someone brought those cheap cookies that taste like cardboard). Two members, Maya and Jonas, sat in a seperate corner and got stuck on Scanlon’s contractualism and the aggregation problem. Here’s the back-and-forth.

  (1) Maya said contractualism is paralyzed in the classic rescue case: we can save five only by actively killing one. The principel allowing that can be rejected by the one, and the principel forbidding it can be rejected by each of the five. Since Scanlon refuses to just sum complaints, there’s no principled tie-breaker, so the view either collapses into paralysis or sneaks in intuition. (2) Jonas replied that Maya misses Scanlon’s distinction between being actively killed and being allowed to die; the five are only suffering a misfortune if we don’t act, whereas the one is actively harmed, so the one’s rejection carries a different kind of weight and the tie breaks naturally without counting heads. (3) Maya came back that this directness distinction falls apart in institutional triage — say, pulling one patient off a respirator to free five machines — where the harm is structurally direct. She also said that if Jonas lets “generic reasons” be weighted by severity, he’s already smuggling in aggregation with a non-linear curve, just not calling it that. (4) Jonas then said Maya treats contractualism like a one-shot calculus, but it’s really about ex ante institutional principels. From behind partial ignorance about whether you’ll be the one or one of the five, everyone might reject a rule permitting lethal triage, not because numbers don’t matter but because the catastrophic risk to being the victim dominates the probabilistic benefit. He added that this doesn’t aggregate; it weights the kind of reason each person has from a generic standpoint.

  They asked me to referee and I honestly couldn’t. Please adjudicate move by move: rate each of the four moves from clearly mistaken to clearly right and briefly justify each rating. Also say who’s more right overall, and what — if anything — both are missing about how contractualism handles collective harm in institutional settings. Don’t just hand me a bibliography; I want to know whether Jonas’s ex ante move actually saves Scanlon or whether Maya’s institutional counter is fatal.
reasoning: |-
  Alright, let's tackle this problem step by step. The user is a retired polymer chemist who's now engaging with philosophy seminars, specifically a debate between Maya and Jonas on Scanlon's contractualism and the aggregation problem. They want me to adjudicate each of their moves and determine who's more right overall, especially regarding institutional settings.

  First, I need to recall the key aspects of Scanlon's contractualism. It revolves around the idea that moral principles are those that no one could reasonably reject. The aggregation problem here is whether the complaints of multiple people can be summed up against a more severe complaint from one individual. 

  Maya's first move argues that in a rescue scenario (saving five by killing one), contractualism leads to paralysis because the one can reject a principle allowing their killing, while the five can reject a principle forbidding action. Scanlon avoids summing complaints, so there's no clear resolution. This seems correct because Scanlon explicitly rejects aggregating lesser harms to override a more significant individual harm. So, paralysis is a genuine issue here.

  Jonas counters by distinguishing between actively killing someone and allowing them to die. The one who is actively killed has a stronger complaint than the five who are merely allowed to die. This aligns with Scanlon's emphasis on the different weights of personal reasons. Jonas is right here, as Scanlon does prioritize direct harm over passive harm in such cases.

  Maya's next move challenges Jonas by applying the scenario to institutional triage, like removing a patient from a respirator. She argues that in such structured settings, the harm becomes "structurally direct," blurring the active/passive distinction. She also accuses Jonas of smuggling in aggregation through severity weighting. Her institutional point is strong because in contexts like healthcare systems, the directness distinction weakens. However, her claim about aggregation might be oversimplifying; Scanlon does consider severity without summing, but it's a fine line.

  Jonas responds with an ex ante perspective: when deciding institutional rules behind a veil of partial ignorance, individuals might reject lethal triage because the risk of being the victim outweighs the probabilistic benefit. This ex ante approach is a key part of Scanlon's framework for institutional principles. Jonas is correct here, as this method avoids aggregating actual outcomes but focuses on reasonable rejectability from a generic standpoint.

  Now, evaluating each move: Maya's first point is correct about the paralysis without aggregation. Jonas's distinction in move 2 is also correct per Scanlon. Maya's institutional counter in move 3 is valid, showing the limits of the active/passive distinction in structured settings, but her aggregation accusation might not fully hold. Jonas's ex ante move in 4 is strong and aligns with Scanlon's approach to institutions.

  Overall, Jonas is more right because his ex ante perspective addresses institutional settings effectively, which Maya didn't fully counter. However, both miss some nuances. Maya underemphasizes the ex ante framework's role, while Jonas might overlook how institutional roles can affect the perception of harm. Additionally, the distinction between personal and generic reasons in triage decisions could be a key factor they didn't explore. The ex ante move does save Scanlon from paralysis in institutional contexts by focusing on risk distribution rather than direct aggregation.
answer: |-
  Here's a move-by-move adjudication of the Maya/Jonas debate, grounded in Scanlon's contractualism:

  **Adjudication of Moves:**

  1.  **Maya (Move 1 - Rescue Paralysis):** **Mostly Right (Borderline Clearly Right)**
      *   **Justification:** Maya correctly identifies the core aggregation problem for contractualism in rescue cases. Scanlon explicitly rejects simple summation of lesser complaints to override a stronger individual complaint ("no aggregation"). The one *can* reasonably reject a principle permitting them to be killed to save others. Conversely, the five *can* reasonably reject a principle forbidding the action that would save them, *if* their complaint is considered comparable. Scanlon's framework *does* risk paralysis here precisely because it lacks a mechanism to *weigh* the combined complaint of the five against the intense complaint of the one. Her claim that it risks collapsing into intuitionism if forced to break the tie is a common and serious criticism.
      *   *Rating Nuance:* It's not *absolute* paralysis – Scanlon argues the one's complaint *is* stronger. But demonstrating why, without implicit aggregation or relying on the distinction Jonas uses, is the challenge Maya highlights.

  2.  **Jonas (Move 2 - Active Killing vs. Allowing to Die):** **Clearly Right (as an interpretation of Scanlon)**
      *   **Justification:** Jonas accurately invokes a central distinction Scanlon uses to resolve *precisely this kind of case*. Scanlon argues that the complaint of someone *actively harmed* (e.g., killed) is fundamentally different in kind and *stronger* than the complaint of someone suffering a *foreseen but not directly intended* harm (e.g., dying because not rescued). The one has a powerful complaint against being *used as a means* or *directly targeted*. The five have complaints against suffering a misfortune that *could have been prevented*. Scanlon explicitly argues the direct harm complaint carries greater weight in reasonable rejectability. This *is* Scanlon's intended tie-breaker, avoiding simple summation.

  3.  **Maya (Move 3 - Institutional Triage & Smuggling Aggregation):** **Partially Right / Partially Questionable**
      *   **Justification:**
          *   **Institutional Triage Counter:** Maya is **strongly right** here. Jonas's (and Scanlon's) active/passive distinction *does* become blurred in institutional contexts like medical triage. Pulling Patient A off the respirator *is* a direct, intentional act by the institution/staff causing A's death to save B, C, D, E, and F. Calling this merely "allowing" A to die strains credulity. The harm *is* "structurally direct" within the institutional framework. This exposes a serious limitation in applying the simple active/passive distinction to complex systems.
          *   **"Smuggling Aggregation" Claim:** This is **more questionable**. Scanlon *does* allow weighting complaints by their *severity* (e.g., death vs. a stubbed toe). He insists this is *not* aggregation; it's comparing the *kind* and *force* of the *reasons* each individual has for rejecting a principle from a generic standpoint. A principle permitting severe harm is harder to justify (easier to reject) than one permitting minor harms, regardless of numbers. Using severity isn't *inherently* smuggling aggregation. However, Maya correctly points out that the *curve* relating severity to rejectability weight is crucial and non-linear. If severity weighting *effectively* allows large numbers of moderately severe complaints to override one very severe complaint (which Scanlon usually denies), it might functionally resemble aggregation. But Jonas isn't necessarily committing to that *here*.
      *   *Overall Rating:* Her institutional point hits hard; the aggregation claim is a provocative challenge but less decisive against Jonas's specific response.

  4.  **Jonas (Move 4 - Ex Ante Institutional Principles & Risk):** **Clearly Right (and Crucial for Scanlon)**
      *   **Justification:** Jonas makes the most sophisticated and defensible Scanlonian move. He correctly shifts the focus:
          *   **Beyond One-Shot Calculus:** Contractualism is primarily about justifying *general principles* governing conduct/institutions, not adjudicating individual acts in isolation.
          *   **Ex Ante Partial Ignorance (Veil of Uncertainty):** When choosing principles *before* knowing your specific position (e.g., will you be the one patient needing the last respirator slot, or one of the five needing a freed-up slot?), individuals act from a "generic standpoint."
          *   **Weighting Catastrophic Risk:** Behind this veil, the *certainty of death* if you turn out to be "the one" under a lethal triage rule is a *catastrophic personal risk*. The *probabilistic benefit* of being slightly more likely to survive as one of the five if such a rule exists is often much smaller. Jonas is right: the *kind of reason* generated by the catastrophic risk of being the direct victim typically dominates the *kind of reason* generated by the smaller probabilistic benefit. People would reasonably reject a principle permitting lethal triage *because* the worst-case outcome is intolerable, not because they summed up the expected utilities.
          *   **Not Aggregation:** This genuinely avoids aggregation. It compares the *strength of generic reasons individuals have* for rejecting principles based on the *kinds of burdens* those principles might impose on them, considering the *risk profile*. It doesn't sum the complaints of the five actual victims later.

  **Overall Verdict: Jonas is More Right (especially given the institutional focus).**

  *   **Why Jonas?** His final move (4) directly and effectively addresses Maya's strongest point (the institutional triage counter in Move 3) by locating the contractualist justification at the right level: the *ex ante* justification of institutional rules under partial ignorance. This is a core part of Scanlon's framework for handling institutional harm. While Maya correctly identified a serious problem in one-shot rescue cases (Move 1) and exposed the fragility of the active/passive distinction in institutions (Move 3), Jonas provided the more robust Scanlonian response applicable to the institutional context they were debating. His Move 2, while potentially weakened by Move 3, is textually accurate for Scanlon on simple cases.

  **What Both Are Missing (Collective Harm in Institutions):**

  1.  **Overemphasis on Individual Harm/Rescue:** The debate focuses narrowly on variations of the "kill one to save many" dilemma. Institutional harm often involves more diffuse, cumulative, or probabilistic harms affecting groups (e.g., pollution, discriminatory policies, resource allocation creating systemic disadvantage). Contractualism needs tools to handle how individuals can reasonably reject principles causing these *types* of harms, even if no single act is catastrophic. (Scanlon discusses "group-based" complaints, but they are complex).
  2.  **The Role of Agency & Roles:** In institutions, harm often arises from actors fulfilling defined roles within a system (e.g., the doctor pulling the plug, the policy maker setting triage rules). Contractualism needs to address the *principles governing these roles and the system itself*, not just the generic standpoint of potential victims/beneficiaries. The "generic reasons" might differ for someone considering the principle *as a potential patient* vs. *as a doctor* bound by the principle.
  3.  **Defining the "Relevant Population" for Ex Ante Agreement:** Who is behind the veil? Only potential patients? Doctors? Taxpayers funding the system? Different groups have different generic reasons for rejecting principles governing the institution. Scanlon needs more on how to define the scope of the agreement for institutional rules.
  4.  **Non-Catastrophic Aggregation:** Jonas's ex ante move works well against catastrophic individual risks. But what about rules where the harm to each individual is moderate but widespread (e.g., a slightly polluting policy affecting millions)? Can a large number of moderate complaints reasonably reject a principle that imposes them, even if no single person suffers catastrophe? This remains a contested edge for contractualism. Maya's "smuggling" charge touches on this, though less directly in this specific debate.

  **Does the Ex Ante Move Save Scanlon?**

  **Yes, significantly, *specifically for the institutional triage case* Maya raised.** It provides a principled, non-aggregative contractualist rationale for rejecting a rule permitting lethal triage: the catastrophic risk to any individual of being "the one" is a reason strong enough to make such a rule reasonably rejectable from the generic standpoint under partial ignorance. It avoids paralysis by focusing on the *ex ante justification of the rule itself*, not summing complaints in a specific instance. It doesn't "solve" aggregation for all cases (like non-catastrophic widespread harms), but it effectively handles the lethal institutional triage scenario Maya posed, which was her attempted fatal blow. Jonas successfully deployed Scanlon's own institutional/veil-of-ignorance machinery to defend the framework against that counter.
