     *(Could an ideal scientist, with perfect instruments and analysis, identify the exact boundary sample?)*  
     - **Yes** → *Unoccupied gap: Logically possible but unattractive*. This fails to explain why no evidence reveals the boundary, violating the empirical resilience of vagueness.  
     - **No** → **Epistemicism with sharp unknown boundaries**:  
       - A sharp boundary exists (e.g., 0.7% contamination is the cutoff), but it is *unknowable* due to human cognitive limits.  
       - Borderline cases (e.g., 0.65–0.75%) appear indeterminate because we *cannot access* the boundary, not because reality or language is vague.  

  3. **Does the absence of a sharp boundary arise from how we represent the world (language/thought) or from the world itself?**  
     *(Is the vagueness in our descriptions/concepts, or in the property of purity?)*  
     - **Representation (language/thought)** → Proceed to 4.  
     - **World (ontological)** → Proceed to 5.  

  4. **How does representation avoid a sharp boundary?**  
     - **Multiple precisifications**: "Pure" has many equally valid definitions (e.g., "≤0.6% contamination," "≤0.8% contamination"), but no single "correct" one. Borderline cases (e.g., 0.7%) lack a fact of the matter because definitions conflict → **Supervaluationism with precise semantic boundaries but no fact in borderline zone**:  
       - Samples are "definitely pure" (all definitions agree), "definitely impure" (all agree), or "borderline" (definitions disagree).  
       - Vagueness is linguistic/conceptual: No ontological indeterminacy.  
     - **Contextual flexibility**: The boundary of "pure" shifts with conversational context (e.g., pharmaceutical vs. industrial standards). Borderline cases are resolved pragmatically → **Deflationary/Contextualist dissolution**:  
       - The paradox dissolves; no deep indeterminacy exists. "Pure" is always sharp *in context*, but contexts change.  

  5. **How does the world avoid a sharp boundary without representation?**  
     *(How does the property of purity itself lack a cutoff?)*  
     - **Intermediate degrees**: Purity admits of partial truth (e.g., a 0.7%-contaminated sample is "pure to degree 0.3"). Sorites premises are false because tiny changes *do* affect purity → **Degree-theoretic/Fuzzy view with real intermediate membership**:  
       - Truth is graded (e.g., [0,1] scale). "Pure" gradually fades; no jump between pure/impure.  
     - **No intermediate degrees**: Purity has no sharp boundary *and* no degrees, yet borderline cases are genuinely indeterminate → **Ontological vagueness rejecting sharp boundaries in reality**:  
       - Reality itself is indeterminate (e.g., it is *objectively neither true nor false* that a 0.7%-contaminated sample is pure).  
       - *Note: This position is rare and controversial; most non-representational views adopt degrees.*  

  ---

  ### **Unoccupied Combinations & Gaps**
  - **Sharp boundary + Knowable**: Gap (diagnosis: *unattractive*).  
    - Why? Fails to explain why boundaries resist empirical discovery (e.g., spectroscopy cannot pinpoint cutoffs). Ignores the paradox’s core puzzle.  
  - **No sharp boundary + World + Intermediate degrees**: Occupied (Degree-theoretic).  
  - **No sharp boundary + World + No intermediate degrees**: Occupied (Ontological vagueness) but *underdeveloped*.  
    - Why? Hard to reconcile with classical logic without positing gaps/gluts. Few defend it.  
  - **No sharp boundary + Representation**: Fully occupied (Supervaluationism/Contextualism).  

  ---

  ### **Contested Separations the Tree Cannot Cleanly Resolve**
  1. **Ontological vagueness vs. Degree-theoretic views**:  
     - The tree separates them by "intermediate degrees," but some ontological views *include* degrees (e.g., fuzzy properties in reality). The split assumes degree-theory is purely representational, but this is contested.  
  2. **Contextualism vs. Supervaluationism**:  
     - Both are representational. Contextualism often incorporates supervaluationist elements (e.g., contexts select precisifications). The tree treats them as distinct, but hybrid theories exist.  

  ---

  ### **Settled vs. Contested Aspects of the Sorites Paradox**
  - **Settled (Logical Form)**:  
    The paradox relies on:  
    (a) A sorites series (e.g., samples from 0% to 100% contamination in 0.01% increments).  
    (b) A tolerance principle: "If sample n is pure, then sample n+1 is pure" (for small increments).  
    (c) Mathematical induction: Applying (b) repeatedly leads to the absurd conclusion that all samples are pure.  
    - All positions agree the tolerance principle *must* be rejected or modified.  

  - **Contested (Among Philosophers)**:  
    - **What fails**:  
      - Epistemicism: Tolerance is false (boundaries exist) but unknowable.  
      - Supervaluationism: Tolerance is "not true" (false in all precisifications).  
      - Degree-theoretic: Tolerance is partially false (truth values degrade gradually).  
      - Ontological/Contextualist: Tolerance is contextually invalid or inapplicable.  
    - **Status of borderline cases**:  
      - Epistemic (ignorance), semantic (indeterminacy), ontic (metaphysical indeterminacy), or pragmatic (contextual) — *all contested*.  
    - **Logic**:  
      - Classical logic (epistemicism), non-classical (e.g., truth-value gaps in supervaluationism/ontological views), or fuzzy (degree-theoretic) — *no consensus*.  

  ---

  ### **Key Takeaway**
  No position resolves the paradox uncontroversially. Navigate the tree by testing concrete cases (e.g., "Does spectroscopy reveal a purity threshold?") rather than labels. Defend your path by interrogating commitments: *Are boundaries sharp? Knowable? Real? Contextual? Graded?*
