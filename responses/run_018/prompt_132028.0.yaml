  **Where the procedure misfires:**

  No matter how careful we are, the procedure will misfire in several ways:

  1. **Judgment calls:** The ratings (e.g., importance, tractability) are subjective. Two people might rate the same project differently. We try to standardize by using scales and thresholds, but it's still noisy.

