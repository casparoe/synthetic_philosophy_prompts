  We are designing a decision procedure based on the ITN framework (Importance, Tractability, Neglectedness) with two additional considerations: "scaling fragility" and "counterfactual ecosystem shift". The procedure will be a flowchart in words, with clear gates and stopping points. We'll also include where to hand off to a vote for value judgments.

