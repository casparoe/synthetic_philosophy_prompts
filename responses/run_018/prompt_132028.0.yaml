prompt: |-
  I run a quarterly grant circle that pools about 50k from folks on rationalist forums. We get like 12 proposals a round—everythings from local AI safety meetups to malaria nets to some obscure philosophy of population ethics. I have maybe 2 hours per proposal, no reserch staff, and I have to defend the call to the group.

  Can you turn importance/tractability/neglectedness into an actual reusable decision procedure I can run? But with two tweaks that standard writeups ignore: "scaling fragility" (it works at 10k but collapses if it ever gets big) and "counterfactual ecosystem shift" (funding this makes our donors less likely to fund other things, not just budget crowding but mental-space crowding).

  Write the flowchart in words—questions in order, what counts as passing each gate, where it stops with a hard no, and where it hands off to "this is values, vote on it." Be honest about which steps are just judgment calls with numbers taped on. Then apply it to three proposals: 15k for a gene-drive mosquito pilot in one district; 8k for a wild-animal-suffering awareness campaign in urban parks; and 12k for direct cash to 200 families in a village where coverage is already okay. Make sure one gets an answer Id probably hate, and tell me exactly where the procedure will misfire no matter how careful we are.
