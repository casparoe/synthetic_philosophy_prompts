answer: |-
  Let us examine the 2016 referendum through the lens of democratic theory's boundary problem, focusing on the tension between the all-affected-interests principle and the all-subjected-persons principle, while also probing where this real-world event exposes gaps in both.

  The actual franchise rules were clear yet restrictive: British, Irish, and qualifying Commonwealth citizens aged 18 or over, resident in the UK (including Gibraltar) and registered to vote. Crucially, this excluded three key groups: long-term UK citizens resident elsewhere in the EU for over 15 years (who lost their right to vote in UK elections after that period), EU citizens resident in the UK without British or Irish citizenship (except those from Malta, Cyprus, and Gibraltar who held Commonwealth status), and 16-17-year-olds. The franchise was thus territorially bounded and citizenship-dependent, reflecting a narrow interpretation of current political membership.

  Under the all-subjected-persons principle – which holds that those governed by coercive laws should have a say in creating them – the franchise appears largely justified. Only those included were directly subject to the UK Parliament’s future legislation and governance structures that Brexit would reshape. Excluded groups like EU nationals in the UK were subject to EU law primarily, while UK expats in Europe, though emotionally invested, were not under the immediate jurisdiction of Westminster. The principle reinforces the legitimacy of Parliament treating the result as binding, as it represented the will of those who would live under the laws enacted post-referendum. The advisory nature becomes a procedural footnote; the decision bound the subjects, so their expressed will carries constitutional weight.

  Conversely, the all-affected-interests principle reveals profound exclusions. Millions residing legally in the UK – Poles, French, Germans – faced immediate uncertainty over residency rights and social status. Over a million UK citizens in the EU stood to lose freedom of movement, healthcare access, and property rights. Both groups were undeniably and deeply affected, yet voiceless. Extending this logic, global markets, EU partners, and even UK-based businesses reliant on EU trade were significantly impacted. This principle challenges the referendum’s legitimacy: if such core stakeholders lacked representation, how could the outcome claim moral authority? Treating it as binding amplifies this illegitimacy, as it imposed profound changes on the excluded affected.

  Here lies the first rupture in standard theory: the referendum’s hybrid advisory-binding status. Parliament declared it advisory yet politically sacrosanct, creating a paradox. If merely advisory, the subjected principle suffices – Parliament retained ultimate authority. But by treating it as binding, Parliament effectively transferred sovereignty to a snapshot electorate, retrospectively redefining the decision’s nature. This retroactive bindingness should, under democratic consistency, have triggered a broader franchise *if* we accept that binding decisions demand input from all subjected. Yet the subjected principle itself is silent on this temporal sleight-of-hand – it cannot explain why the *manner* of honoring the vote alters who should have been included.

  This exposes a deeper temporal flaw in both principles. Future generations will inherit the economic structures, environmental regulations (or lack thereof), and international isolation embedded in Brexit. They are profoundly affected by trade barriers limiting future prosperity and by climate policies weakened through regulatory divergence. Yet they are not "subjected" in the present, nor can they articulate interests through current institutions. Applying all-affected logic here risks reductio: if "affected" includes anyone tangentially influenced by cascading consequences, the demos becomes impossibly vast, diluting agency to meaninglessness. Yet dismissing future interests is equally untenable – democratic legitimacy erodes if present majorities can bind posterity to irreversible burdens.

  The referendum thus reveals democracy’s inherent presentism. Neither principle adequately addresses how democratic systems authorize decisions imposing long-term, structural constraints on the unborn. The all-affected principle gestures toward this but lacks mechanisms for representation. The all-subjected principle ignores it entirely, as future persons are not yet subject to coercion. Moreover, both stumble on the epistemic problem: even the included electorate voted on complex futures they could scarcely comprehend – economic models, regulatory disentanglement, geopolitical realignments. Affected parties (present and future) cannot fully understand or consent to such multifaceted consequences, yet democracy demands they decide. The referendum didn’t create this problem but crystallized it: when a vote commits a society to an irreversible path under conditions of radical uncertainty, how can any franchise rule ensure genuine authorization?

  In conclusion, the boundary problem illuminates the Brexit referendum’s contested legitimacy: the subjected principle justifies the narrow franchise yet struggles with Parliament’s elevation of an advisory poll to constitutional weight; the affected principle indicts the exclusions but fractures when extended temporally or spatially. Ultimately, the episode exposes democracy’s unresolved tension between present consent and future obligation. The principles are silent on how institutions should weigh unborn interests or navigate irreversible decisions made amid uncertainty. Legitimacy here requires not just drawing boundaries, but acknowledging that some decisions – by their permanence and reach – demand forms of accountability beyond the present demos, a challenge neither principle yet meets.
