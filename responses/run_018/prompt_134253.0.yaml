  me and my friend just had this exhausting argument about cognitive penetration of perception and i need an outside take. here are my verdicts on cases and they're all over the place.

  case one: a radiologist spots a real tumor on an x-ray partly because she was looking for it. i say thats not distortion, just expertise guiding attention.

  case two: same radiologist sees a tumor that isnt there because she expected it. clearly distorted, belief messed with the seeing.

  case three: people with different language categories for blue actually discrimanate shades differently. i think this is real penetration of color experience by language, but it doesnt feel like a mistake at all.

  case four: someone with anxiety sees a neutral face as angry. this feels like penetration too, but my friend says its not the belief changing the visual experience, just the interpertation after. i keep going back and forth on this one.

  case five: there's this enactivist idea that perception is literally constituted by action-readiness, so if you believe a stick is a tool you literally see it differently. if thats right, then case one and case five are both penetration but one feels like normal seeing and the other feels like philosophy gone wild.

  so is there a principle that gets all these, or do i have to drop one? whats the line between belief affecting attention versus changing the phenominal content? and what does it say about case four where i cant decide? please answer in american english.
