prompt: |-
  You are a political philosopher specializing in urban ethics, distributive justice, and property theory, with working familiarity in planning law and housing economics. Before constructing your answer, spend several minutes brainstorming: list the core moral phenomena, legal tensions, and conceptual distinctions that any adequate theory of residential entitlement must accommodate when zoning, NIMBY opposition, and regional housing needs collide. Think carefully, and do not rush the specification—the criteria are the deliverable.

  Write from where I actually am: my family was recently displaced from our rental when the building was sold and converted to luxury condos after an upzoning variance, and I now sit on a neighborhood council where long-time residents invoke “community character” and “neighborhood stability” to block modest multi-family infill near high-frequency transit. I need a theory that is not merely abstract; it must adjudicate real zoning-board conflicts, property-value anxieties, and intergenerational displacement without collapsing into either pure market libertarianism or an unworkable state-command model.

  Give me the full desiderata: what any adequate theory of who has a right to the city—specifically in conflicts over single-family zoning, exclusionary land-use regulation, and local democratic control—must be able to deliver. For each requirement, state the motivating case or consideration behind it, and flag whether it is non-negotiable or a camp-specific preference (e.g., libertarian property rights, progressive YIMBY supply advocacy, or a Lefebvrian participatory urbanism).

  Your list must include and address:

  1. The distinction between a right to housing/residence and a right to exclude others from a neighborhood—why collapsing them produces the wrong result, with the concrete case.
  2. The phenomenon of “exclusionary amenity bundling”: the way low-density zoning ties access to high-quality public goods (schools, green space, transit infrastructure) to ownership in restricted districts, effectively operating as a private club funded by public investment. The theory must either dissolve or incorporate this.
  3. The tension between local democratic authority over land use and regional obligations to accommodate growth and mobility—identify whether full satisfaction of both is jointly possible or whether this pair of desiderata is unsatisfiable given standard democratic and distributive assumptions.
  4. The economic dynamics the theory must remain consistent with—supply constraints, filtering effects, and induced demand—without reducing justice entirely to efficiency.
  5. The intergenerational dimension of “spatial lock-in”: how existing homeowners’ accumulated locational privilege weighs against the claims of future residents, renters, and households not yet present in the jurisdiction.
  6. The boundary between legitimate preservation (protecting existing renters from direct displacement, safeguarding genuinely shared ecological or historical goods) and illegitimate exclusion masked as aesthetics, “scale,” or “compatibility.”

  Then, identify which single requirement does the most damage to the popular competing theories—market-libertarian exclusion (treating zoning as an extension of private covenant), progressive inclusionary-zoning models (state-mandated upzoning coupled with anti-displacement safeguards), and a Lefebvrian “right to the city” approach that emphasizes participatory production of urban space. Briefly score each contender against your list, keeping the weight on the criteria rather than on exhaustive doctrine-summary.

  Do not provide bibliographies, reading lists, or citations. I want only the conceptual specification, with explicit attention to where the hardest conceptual work lies—especially any subset of requirements that cannot be jointly satisfied.
