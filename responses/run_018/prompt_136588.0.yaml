answer: |-
  Here is a comprehensive specification of desiderata for an adequate theory of residential entitlement in urban land-use conflicts, grounded in your lived experience and the concrete tensions you face. I've identified core requirements, their motivating cases, conceptual foundations, and where competing theories fail hardest against these criteria.

  ---

  ### **Core Desiderata for a Theory of Residential Entitlement**

  1. **Distinction Between Right to Reside & Right to Exclude**  
     - *Requirement:* Must disentangle the individual right to secure housing from collective claims to control neighborhood composition. Treating exclusion as a property right collapses into NIMBYism.  
     - *Motivating Case:* Your displacement after upzoning illustrates how conflating these enables existing owners/tenants to veto new residents. Blocking infill near transit denies others your former right to reside.  
     - *Status:* **Non-negotiable**. Collapsing them legitimizes exclusionary gatekeeping.  

  2. **Confronting Exclusionary Amenity Bundling**  
     - *Requirement:* Must address how zoning (e.g., single-family mandates) privatizes publicly funded goods (schools, parks, transit) by restricting access to property owners in low-density zones.  
     - *Motivating Case:* Opponents on your council invoke "neighborhood stability" to block multi-family housing near high-frequency transit – effectively reserving public infrastructure for incumbent homeowners.  
     - *Status:* **Non-negotiable**. This is a structural injustice: public goods become de facto club goods.  

  3. **Local Democracy vs. Regional Obligations**  
     - *Requirement:* Must resolve whether municipalities can veto regionally needed housing without violating duties to mobile populations.  
     - *Motivating Case:* Your neighborhood council blocks infill, exacerbating regional shortages. Can localism coexist with regional equity?  
     - *Hard Tension:* **Joint satisfaction is impossible under pure localism**. Unfettered local control enables exclusion; overriding it risks democratic deficits. The theory must define *scales of obligation* (local/regional) and *procedural fairness*.  

  4. **Economic Dynamics Without Reductionism**  
     - *Requirement:* Must incorporate supply constraints (how zoning restricts stock), filtering (how new supply eases pressure), and induced demand (how supply alone won’t solve affordability) – while rejecting "trickle-down" as sufficient for justice.  
     - *Motivating Case:* Upzoning your rental building created luxury units, displacing you. Theory must explain why supply expansion is necessary but insufficient without anti-displacement tools.  
     - *Status:* **Non-negotiable for feasibility**. Ignoring economics invites unworkable idealism.  

  5. **Intergenerational Spatial Lock-In**  
     - *Requirement:* Must weigh homeowners’ accrued advantages (zoning-protected property values, embedded access) against future residents’ claims to opportunity.  
     - *Motivating Case:* Longtime owners on your council resist change, entrenching generational wealth gaps. Renters and youth face exclusion from opportunity-rich areas.  
     - *Status:* **Non-negotiable for distributive justice**. Lock-in perpetuates class/racial stratification.  

  6. **Legitimate vs. Illegitimate Preservation**  
     - *Requirement:* Must distinguish defensible preservation (e.g., rent-stabilized housing, true historic/ecological assets) from exclusionary aesthetics ("character," "scale").  
     - *Motivating Case:* Opponents invoke "compatibility" against transit-adjacent infill – a subjective mask for class exclusion.  
     - *Status:* **Non-negotiable boundary test**. Illegitimate claims weaponize nostalgia.  

  ---

  ### **Why Popular Theories Fail Against These Desiderata**  
  *(Scored against the hardest criterion they violate)*  

  - **Market-Libertarian Exclusion (Zoning as Private Covenant Extension)**  
    - *Fatal Flaw:* **Fails #2 (Exclusionary Bundling)**. Treats zoning as a property right, ignoring how it captures public goods. Legitimizes hoarding schools/parks via low-density mandates.  
    - *Your Context:* Would endorse your council’s veto power, worsening displacement.  

  - **Progressive Inclusionary-Zoning Models (State Mandates + Anti-Displacement)**  
    - *Fatal Flaw:* **Struggles with #3 (Local/Regional Tension)**. State overrides of local control provoke backlash (e.g., California’s SB 35 lawsuits) and often lack granular legitimacy. Risks sacrificing community input for efficiency.  
    - *Your Context:* Might prevent your displacement with safeguards but could deepen distrust in your council.  

  - **Lefebvrian "Right to the City" (Participatory Urbanism)**  
    - *Fatal Flaw:* **Fails #4 (Economic Dynamics)**. Prioritizes resident control in decision-making but underestimates supply economics. Participatory processes often empower NIMBYs (e.g., your council hearings), blocking needed density.  
    - *Your Context:* Could amplify exclusionary voices under "local participation" banners.  

  ---

  ### **The Hardest Conceptual Work: Unsatisfiable Tensions?**  
  The **core unsolved tension** is **#3 (Local Democracy vs. Regional Obligations)**. Under standard democratic assumptions, local majorities will rationally exclude to protect privileges (amenity bundling, spatial lock-in). No theory fully reconciles this without:  
  - *Sacrificing local autonomy* (e.g., state preemption), or  
  - *Sacrificing regional equity* (e.g., accepting exclusion).  

  **Where the Theory Must Innovate:**  
  Adequacy requires redefining **jurisdictional responsibility**. This could involve:  
  - **Scaled subsidiarity:** Local control over *design/placemaking*, regional authority over *capacity/density targets*.  
  - **Compensation mechanisms:** If a neighborhood restricts housing, it must fund affordable units elsewhere in the region.  
  - **Epistemic restructuring:** Independent bodies (e.g., regional housing courts) to adjudicate claims using the above desiderata, insulating decisions from pure majoritarianism.  

  Your theory must navigate this without utopianism – acknowledging that some democratic trade-offs are irreducible but can be *minimized* through institutional design that centers the non-negotiables (#1, #2, #5, #6) while constraining #3’s excesses. The goal isn’t harmony but *justly managed conflict*.
