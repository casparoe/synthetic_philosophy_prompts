prompt: |-
  Write the desiderata an adequate account of why promises bind must meet, with the motivating case behind each. Cover: the commitments it must explain (ordinary promises, institutional vows); the distinctions it must preserve (obligation versus expectation, breach versus release); its treatment of duress and radical informational asymmetry; and whether binding force needs a single ground (autonomy, trust, practice) or can be pluralist. Crucially, include the "synthetic delegation" case — an agent delegates to an autonomous system and commits to reviewing outputs, creating human-binding obligation without direct human expectation — and say exactly what your criteria demand here. For each desideratum, mark it as non-negotiable or as a camp preference, and flag any subset that looks jointly unsatisfiable; that tension is the part I most want. Briefly score autonomy-based, trust-based, and practice-based views against the list. Do not include bibliographies, citations, or reading lists. Write in American English.
