answer: |-
  Here are the desiderata for an adequate account of promissory obligation, with motivating cases, flexibility markers, tensions, and theory scoring:

  ### Core Commitments to Explain (Non-Negotiable)
  1.  **Ordinary Promises:** Must explain why a simple, informal promise ("I promise to help you move Saturday") binds the promisor, even without witnesses or institutions. *Motivating Case:* A friend relies on your promise to book a moving van.
  2.  **Institutional Vows/Oaths:** Must explain binding force within formal contexts (wedding vows, oaths of office, judicial oaths). *Motivating Case:* A judge swears to uphold the law; the obligation transcends personal feeling and is recognized socially/legally.

  ### Essential Distinctions to Preserve (Non-Negotiable)
  3.  **Obligation vs. Mere Expectation:** Must distinguish a genuine *deontic* obligation (owed *to* the promisee) from a mere prediction or hopeful expectation. *Motivating Case:* Saying "I'll probably be there" creates expectation; "I promise I'll be there" creates obligation. Breach of the latter warrants blame/resentment, not just disappointment.
  4.  **Breach vs. Release:** Must distinguish wrongful breaking of a promise (breach) from legitimate discharge via fulfillment, agreement, or supervening circumstances (release). *Motivating Case:* Failing to repay a loan (breach) vs. the lender forgiving the debt (release).

  ### Handling Problematic Origins (Non-Negotiable)
  5.  **Duress/Coercion:** Must explain why promises extracted under significant coercion/threats (e.g., "Promise me your wallet or I'll shoot!") are void or voidable. *Motivating Case:* Protecting promisor autonomy from illegitimate pressure.
  6.  **Radical Informational Asymmetry:** Must explain limits when the promisor *intentionally* exploits crucial hidden information known only to them, making the promise potentially voidable (e.g., promising to sell a "sound" horse knowing it has a fatal, hidden illness). *Motivating Case:* Preventing fraud while allowing promises where parties accept some unknown risks.

  ### Grounds of Binding Force (Camp Preference - Tension Area)
  7.  **Monism vs. Pluralism:** Must state whether binding force *always* stems from one foundational source (e.g., autonomy, trust, social practice) or if different sources can validly ground obligation in different contexts. *Tension:* Monism offers simplicity but struggles with diversity of cases; Pluralism handles diversity but risks being ad hoc.

  ### The Synthetic Delegation Challenge (Non-Negotiable - Key Tension Point)
  8.  **Synthetic Delegation:** Must explain how a human **A** (e.g., an AI safety officer) can become *obligated* to **B** (e.g., the public) by delegating a task to an autonomous system **S** (e.g., an AI model) while committing to review **S**'s outputs, *even if **B** has no expectation directed at **A** regarding **S**'s specific outputs at the time of delegation*. *Motivating Case:* **A** deploys **S** for real-time monitoring, promising **B** rigorous human review of critical alerts. **B** trusts **A**'s *commitment to review*, not **S**'s direct outputs. **A** is obligated to perform the review diligently *because they committed to it*, even before **B** forms expectations about specific alerts. **Crucial Demand:** The account must generate a human-binding obligation (**A** to **B**) grounded in **A**'s commitment/undertaking, *without* requiring that **B** formed specific expectations *in response to* **S**'s potential outputs *at the moment of delegation*. The obligation stems from the act of delegation+commitment itself.

  ### Key Tensions (Likely Jointly Unsatisfiable Subsets)
  *   **Tension 1: Expectation & Synthetic Delegation:** Preserving the Obligation vs. Expectation distinction (Des. 3) *and* fully explaining Synthetic Delegation (Des. 8) creates tension. Des. 3 insists obligation is more than just created expectations. Des. 8 requires obligation *without* the promisee (B) having specific expectations about the delegated system's outputs. Theories heavily reliant on *actual* inducement of reliance/expectation *in the promisee* as the *source* of obligation will struggle mightily with Synthetic Delegation. They may satisfy Des. 3 but fail Des. 8.
  *   **Tension 2: Monism & Diversity:** Insisting on Monism (Des. 7) while adequately explaining *both* intimate ordinary promises *and* formal institutional vows/oaths *and* Synthetic Delegation is difficult. The sources of normativity seem potentially diverse.

  ### Scoring Major Theories
  *   **Autonomy-Based (e.g., Kantian, Will Theory):**
      *   **Strengths:** Explains Des. 1 (promise as self-binding), Des. 3 (obligation from self-legislation), Des. 5 (coercion violates autonomy), Des. 6 (fraud vitiates consent). Handles Des. 2 via institutional role obligations as self-assumed.
      *   **Weaknesses:** Struggles severely with **Synthetic Delegation (Des. 8)**. Did **A** truly "bind their will" regarding unpredictable **S**'s outputs? Can feel artificial for informal promises (Des. 1). May struggle with release conditions (Des. 4) if obligation is seen as absolute.
  *   **Trust/Expectation-Based (e.g., Scanlon):**
      *   **Strengths:** Excellent on Des. 1, Des. 3 (obligation from duty not to harm via induced reliance), Des. 4 (release alters reliance conditions), Des. 5/6 (coercion/fraud prevent reasonable reliance).
      *   **Weaknesses:** **Fails Synthetic Delegation (Des. 8) catastrophically.** **B**'s reliance/expectation is focused on **A**'s *review commitment*, not **S**'s outputs. But crucially, **B** may have *no specific expectation* about **S**'s outputs *at the time of promise*. If obligation *requires* inducing specific reliance/expectation *in the promisee*, Des. 8 isn't met. Also weaker on institutional vows (Des. 2) where obligation seems prior to individual reliance.
  *   **Practice-Based (Conventionalism, e.g., Rawls/Hart):**
      *   **Strengths:** Explains Des. 1 & Des. 2 seamlessly (same underlying practice), handles institutions best, explains release (Des. 4) via practice rules. Can *potentially* handle Synthetic Delegation (Des. 8) by framing **A**'s commitment as a novel act within an evolving practice of delegation/review.
      *   **Weaknesses:** Risks collapsing Des. 3 (Obligation vs. Expectation) - is the obligation just a social rule? Blurs Des. 5/6 (Duress/Fraud) - are these void because immoral or just because the practice says so? May struggle to explain the *moral* force of promises absent the practice. Requires showing Synthetic Delegation falls under the practice's rules.

  **Synthetic Delegation Verdict:** Autonomy and Trust theories fail Des. 8 unless significantly revised to decouple obligation from contemporaneous promisee expectations about delegated outputs. Practice Theory has the *best chance* of satisfying Des. 8 by interpreting the commitment as a new rule-in-the-making within the broader practice of undertaking responsibilities. However, the core tension with Des. 3 remains: can a practice-based obligation feel genuinely *owed to the promisee* and not just a social rule?
