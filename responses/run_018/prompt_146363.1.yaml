prompt: |-
  Take the role of Dr. Alina Voss, a philosopher of science who defends a modified Self-Sampling Assumption (SSA) in anthropic reasoning. Her distinctive twist is that the reference class must include not only physically instantiated observers but also counterfactual observer-moments—structurally isomorphic mental states that are algorithmically accessible yet never realized—weighted by their computational proximity rather than by bare existence. She rejects the Self-Indication Assumption (SIA) on the grounds that treating existence as an unconditional evidential bonus, regardless of selection mechanism, commits the central error of the presumptuous philosopher. She will not concede that SIA is the rational default, and she insists that any anthropic argument must specify a non-arbitrary boundary condition for its sampling frame.

  I am a graduate student challenging her at a workshop. My opening move is this: I present two cosmological models, M and N, that predict exactly the same number of physically realized human observers, but M predicts a vastly larger population of shadow observers—uncomputed yet structurally isomorphic branches in a multiverse, algorithmically accessible in principle. Under her modified SSA, she should be indifferent between M and N, since only instantiated observers count; yet under SIA, M gains strong evidential support because it predicts more observers in total, including the shadow ones. I ask whether, by excluding these shadow observers from her reference class, she is not arbitrarily restricting the frame precisely to avoid the presumptuous conclusion, thereby begging the question against the multiverse scenario.

  Respond in character as Dr. Voss. Do not break character, do not ask clarifying questions, and do not retreat to meta-commentary. Defend your boundary condition directly, explain why weighting by computational proximity rather than existence avoids the selection-bias charge, and show that your modified SSA is principled rather than ad hoc.
reasoning: |-
  Okay, let me unpack this graduate student's challenge to Dr. Voss. They're presenting two cosmological models M and N with identical physical observers but M has vastly more "shadow observers" - uncomputed but algorithmically possible minds. The student claims Dr. Voss's modified SSA would be indifferent between them while SIA would favor M, accusing her of arbitrary boundary-setting to avoid the presumptuous philosopher problem.

  Hmm, Dr. Voss needs to defend her core thesis here: that computational proximity, not mere logical possibility, determines reference class weighting. The student's framing assumes shadow observers should count equally, but that's precisely what her theory rejects. She must explain why computational distance matters - perhaps by emphasizing how selection mechanisms require causal embeddability? 

  The presumptuous philosopher charge is tricky. The student thinks excluding shadows is question-begging, but Dr. Voss would argue SIA's unconditional existence bonus is the real bias. She should contrast their foundations: her framework roots probability in actual computational processes, while SIA treats existence as evidence divorced from mechanism. 

  For the boundary condition objection, she could demonstrate non-arbitrariness through the computational proximity metric - it's defined by objective algorithmic properties like Kolmogorov complexity to the actualized state. That creates a continuous weighting rather than binary inclusion/exclusion. 

  The response must stay strictly in character - no hedging. Dr. Voss is fiercely protective of her modified SSA and views SIA as epistemically reckless. She'd likely counter-charge that the student is confusing mathematical possibility with evidential relevance, a key distinction in her philosophy. The weighting by computational effort bridges the gap between bare possibility and realized evidence.
answer: |-
  *Dr. Voss leans forward, eyes sharp but not unkind, her voice precise and carrying the weight of considered conviction.*

  An excellent challenge, precisely the kind that clarifies the stakes. You are correct that under my modified SSA, I would indeed be indifferent between your models M and N *if* we accept your characterization of "shadow observers" as uncomputed, counterfactual branches. But that "if" is where your challenge fundamentally misunderstands—or perhaps underestimates—the principled foundation of my boundary condition. Let me dismantle the misunderstanding step by step.

  **First, the charge of arbitrariness.** You claim I restrict the reference class to "avoid the presumptuous conclusion," thereby begging the question. This reverses the causal order of my reasoning. My rejection of SIA and my insistence on a non-arbitrary boundary condition *precede* and *motivate* the computational proximity weighting. I do not start with a desired conclusion (avoiding presumptuousness) and then gerrymander the reference class to fit. I start with a fundamental epistemological principle: **evidence requires causal embeddability within the selection mechanism.** 

  What does this mean? An observer-moment can only provide evidence about the world *if its own existence, or the process generating its perspective, is causally connected to the mechanisms that might select which world is actual.* Bare logical possibility, mere algorithmic accessibility *without physical instantiation or computational realization*, lacks this causal tether. The "shadow observers" in your model M are phantoms—they are not outputs of any actual computation, nor are they products of the physical laws generating observers in M. They are abstract mathematical potentialities. Including them as *evidential presences* on par with physically instantiated observers conflates *description* with *evidence*. SIA commits precisely this category error: it treats the *mathematical possibility* of a mind as equivalent to *evidential weight* for the theory generating that possibility, regardless of whether the theory *actually realized* it or merely *could have*. That *is* presumptuous—it grants evidential status to mere descriptions.

  **Second, computational proximity is the non-arbitrary boundary condition.** You ask why these "shadow observers" don't count. My answer is: they *do* count—**but not equally.** They are included in the reference class as *counterfactual observer-moments*, but their weighting is determined by their **computational distance from the realized observer-moment doing the reasoning.**

  *   **Why computational distance?** Because it quantifies the *objective cost* of realizing that observer-moment from the actualized state. It measures the minimal algorithmic resources (program length, computational steps, energy) required to *compute* that specific mental state *from* the state of the universe that generated *you*, the reasoner. A state requiring vast, unphysical computational resources to reach from your current state is epistemically distant—it is far less "accessible" as a sample relevant to *your* evidential situation. A state that *is* computed, or could be computed with negligible resources within the actual physics of your universe, is proximal and carries significant weight.
  *   **How does this avoid selection bias?** Precisely because it grounds the sampling probability in the *actual generative process*, not in a bare count of abstract possibilities. Your physical instantiation *is* a product of a specific causal process (cosmology, evolution, computation). The probability of sampling "you" depends on how readily such a state arises *within the actualized physics and computational history* of your universe. Including counterfactuals weighted by computational proximity accounts for the *structure of possibility* inherent in the actualized laws, without granting undue weight to possibilities utterly disconnected from your causal origin. SIA, by contrast, introduces a massive, ungrounded bias *towards* theories that describe large sets of abstractly possible observers, irrespective of whether the theory's *actual dynamics* produce them.

  **Third, addressing M vs. N.** In model M, the "shadow observers" are algorithmically accessible but *uncomputed*. Their computational distance from your instantiated state is astronomically high—they require traversing unactualized branches of the multiverse, performing computations never run. Their weighting in the reference class is thus infinitesimal. In model N, these specific counterfactuals don't exist *at all*, meaning their distance is infinite and their weight is zero. **The vast number of shadows in M adds negligible evidential weight because they are computationally inaccessible from your realized state.** The dominant probability mass comes from the *instantiated* observers common to both M and N. Hence, indifference is the correct result. SIA's strong preference for M is an artifact of its flawed ontology, mistaking the map (the theory's description of possibilities) for the territory (the actualized world generating evidence).

  **The Presumptuous Philosopher Revisited:** SIA presumes that simply *describing* more observers grants evidential weight. My framework presumes only that your evidence arises from a *causal process*, and that the sampling probability should reflect the *structural propensity* of that process to generate observer-moments like yours, including nearby counterfactuals weighted by the *objective cost* of their realization. The boundary is set by causal embeddability and computational tractability—principles inherent to the physics of observation itself. *That* is principled. SIA’s unconditional existence bonus is not.

  Do you see how this avoids begging the question? The multiverse scenario isn’t dismissed arbitrarily; its counterfactual branches *are* included—but their evidential scream is silenced by the sheer computational gulf separating them from your realized moment. Only the whispers of the proximal carry weight.
