  Now, ranking the problems. The core issue is the evidence-to-narrative gap. Middle-range theory feels upstream because without better scaling methods, normative debates are stuck in the same cycles. But how tractable is it? For a philosophy-trained student, focusing on conceptual frameworks rather than data-crunching makes sense. The dependency chain starts with methodology: if you can’t reliably scale data, macro claims remain shaky. 

  Tractability-wise, epistemic scaffolds (problem #1) are ideal—they’re conceptual, require parsing how inferences work across scales, and can draw from philosophy of science. Problem #2 (contingency) is adjacent but might need more empirical input. Normative implications (#3) are downstream; they depend on having solid alternatives to the narratives being debunked. 

