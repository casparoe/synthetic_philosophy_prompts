answer: |-
  Based on your constraints (4 years, conceptual/historical focus, philosophy-trained group, avoiding exhausted debates), here's a ranked agenda prioritizing tractable, upstream problems where resolution unlocks downstream work:

  1.  **#1 Priority: Epistemic Scaffolding for Fragmented Evidence (Most Upstream & Tractable)**
      *   **Problem:** Develop rigorous frameworks for justifying inferences *from* localized, fragmentary, heterogeneous archaeological data *to* claims about broader socio-cultural patterns (e.g., hierarchy, cooperation, resilience) across time/space. *This is the core "resolution mismatch" engine.*
      *   **Why Upstream?** Without better tools to assess *how* and *when* site-level data supports (or refutes) macro-claims, all grand narratives (progress, collapse, inevitability) remain fundamentally underdetermined or vulnerable to cherry-picking. Solving this makes debates about *specific* causes (geography, cognition) or normative implications more substantive.
      *   **Why Tractable for Philosophy/History?** Requires deep analysis of inference, abduction, analogy, scale-dependence, and model-building – core philosophy of science/history territory. Focus on conceptual case studies: *How do we responsibly infer "egalitarianism" from burial practices across disparate sites? What constitutes valid counter-evidence to "inevitable hierarchy" from a handful of anomalous settlements?*
      *   **Output Goal:** A defensible methodological toolkit/framework paper + case study papers demonstrating its application to contested claims (e.g., Graeber/Wengrow's "play" thesis, Diamond's collapse narratives).

  2.  **#2 Priority: Contingency & Path Dependence in Institutional Forms (Depends on #1)**
      *   **Problem:** Investigate the *specific mechanisms and critical junctures* that lead to divergent institutional outcomes (hierarchy vs. heterarchy, inequality vs. equity) *given similar starting conditions*, moving beyond "it happened/didn't happen."
      *   **Why Upstream?** Directly challenges inevitability narratives but requires the scaffolding from #1 to avoid just swapping one determinism for another (e.g., "contingency did it"). Focuses on *how* things actually unfolded locally and why paths diverged.
      *   **Why Tractable?** Leverages comparative historical analysis and process tracing. Philosophy-trained researchers excel at dissecting causal mechanisms, identifying critical junctures, and analyzing counterfactuals. Uses synthesized archaeological/historical evidence *interpreted via the #1 framework*.
      *   **Output Goal:** A theory of "comparative institutional emergence" focused on specific mechanisms (e.g., ritual intensification, resource pooling under stress, conflict resolution failures) with deep dives into 2-3 pivotal comparative cases (e.g., Neolithic Anatolia vs. Mesopotamia, Mississippian vs. Puebloan trajectories).

  3.  **#3 Priority: Normative Payload of Debunked Narratives (Depends on #1 & #2, More Downstream - Doable in Year 4+)**
      *   **Problem:** Rigorously assess *if* and *how* successfully challenging grand progress/collapse narratives (e.g., Agricultural Revolution as "mistake") actually shifts contemporary ethical/political reasoning about inequality, sustainability, or progress.
      *   **Why Less Upstream?** This work is crucial but often becomes rhetorical *precisely because* the upstream problems (#1, #2) aren't solved. Without robust alternative explanations (*how* did inequality emerge contingently?), debunking just creates a vacuum. Normative arguments need strong historical foundations built via #1 & #2.
      *   **Why Tractable?** Philosophy/History training is ideal for analyzing conceptual links between historical understanding, naturalistic fallacies, and normative reasoning. Requires careful argument mapping and conceptual analysis of contemporary discourse.
      *   **Output Goal:** A clear-eyed analysis of the *limits and possibilities* of historical analogy/narrative for present-day ethics/politics, moving beyond "if we debunk X, then Y must follow."

  **The Overrated Problem: Chasing "The Ultimate Cause" (Avoid)**
  *   **Problem:** Framing research around identifying *the* single dominant driver (Geography! Cognition! Energy! Technology!) across all scales of history.
  *   **Why Overrated?** It replicates the very reductionism you critique. The fragmented, contingent nature of the evidence (#1) and the demonstrable variability in paths (#2) make singular "ultimate causes" epistemologically shaky and often teleological. It leads back to deterministic debates (Diamond vs. Harari redux) rather than advancing new understanding. The field needs complexity, not new monisms.

  **Defended Allocation of 4 Years:**
  1.  **Year 1-2:** **Deep Dive into #1 (Epistemic Scaffolding).** Build the core methodological framework. Critically analyze existing attempts (e.g., middle-range theory, comparative archaeology, complex systems approaches) and their limitations. Develop your group's distinctive conceptual toolkit focused on inference under fragmentation/uncertainty.
  2.  **Year 2-3:** **Apply #1 to #2 (Contingency/Path Dependence).** Use your scaffold to conduct rigorous comparative case studies on institutional emergence/divergence. Test the limits of the framework. This is the core research output phase.
  3.  **Year 4:** **Synthesize & Explore #3 (Normative Payload).** Leverage the stronger historical foundations built in #1 and #2 to critically analyze the *actual* normative implications of this work. Can we move beyond rhetorical "gotchas" to meaningful conceptual shifts? Begin framing the broader significance.

  **Why this order?** #1 provides the essential tools to make #2 more than just storytelling. Together, #1 and #2 build a *positive*, evidence-respecting alternative to grand narratives, which is the necessary prerequisite for #3 to have serious traction. Skipping to #3 without solving #1 risks repeating the cycle of rhetorical critique without foundation. Avoiding the "Ultimate Cause" trap keeps the focus on tractable, evidence-sensitive complexity. This agenda uses your group's strengths to tackle the fundamental bottleneck you identified – the evidence-narrative mismatch – while delivering concrete conceptual advances.
