prompt: |-
  I'm a journalist covering science and ideas, and I'm putting together a feature on how classic AI puzzles keep coming back in weird clothes. I got into a long conversation with a researcher who thinks we've been misreading the frame problem all along—maybe it's not about bookkeeping non-effects, but about an epistemic friction between knowing what changed and knowing what stayed the same. That stuck with me. So here's what I need: write me a proposal for a one-semester philosophy term paper, about 5000 words, that takes this angle seriously. Don't treat it as a representation failure; treat it as an asymmetry in how agents track stability versus change.

  The proposal should have exactly five parts. First, state the sharp question. Second, explain why the usual fixes—successor-state axioms, defalt logic, non-monotonic reasoning—leave that asymmetry untouched. Third, lay out the method: maybe compare formal belief-update rules with human intutive physics judgments? Fourth, say what a result actually looks like and what counts as the project flopping. Fifth, give an honest scope check showing it really fits one semester. Write it like you're explaining the pitch to an editor over coffee, not filling out a grant form. Keep it casual—there can be a typo or two in there. And don't include a bibliography or citation list; I'll fill those in later myself.
reasoning: |-
  Okay, the user is a journalist covering science and ideas, working on a feature about how classic AI puzzles resurface in new forms. They had a conversation with a researcher who proposed a fresh take on the frame problem—not as a representation failure but as an epistemic friction between tracking change and stability. Now they need a proposal for a 5,000-word philosophy term paper that explores this angle. 

  The request is very specific: five parts, casual tone ("like explaining over coffee"), no citations, and it must avoid treating the frame problem as purely technical. The core idea is that asymmetry in tracking change vs. stability is fundamental. 

  First, I need to nail the "sharp question"—it should cut through the usual noise. The researcher’s friction metaphor feels sticky, so framing it as "Why is knowing what stays fixed harder than spotting what changes?" keeps it provocative. 

  For part two, the usual fixes (successor-state axioms, default logic) are workarounds that don’t touch the asymmetry. I’ll point out how they bake in the assumption that stability is passive, which misses the active cognitive effort involved. The default logic point is fun—it’s like laziness as a band-aid, not a solution. 

  Part three needs a method. Comparing formal belief-update rules (like AGM) with human intuitive physics feels right. Humans aren’t logical systems; we have heuristics for stability (like object permanence) that AI lacks. The mismatch exposes the asymmetry. 

  Results in part four: Success would be showing the friction exists in both systems but manifests differently. Failure would be if the asymmetry collapses under scrutiny—like if stability-tracking turns out reducible to change-tracking. 

  Scope check for part five: A semester’s work. I’ll emphasize focusing on belief update, not full action theories, and using existing empirical studies (like Baillargeon’s baby physics) to avoid new experiments. 

  Tone-wise, I’ll keep it loose—contractions, phrases like "wild goose chases," even a deliberate typo ("defalt logic" → "default logic" with a note). The editor should feel the energy of the idea, not get bogged in jargon. 

  The user’s unspoken need? They want a compelling narrative hook for their feature. This proposal isn’t just academic; it’s a story about how old puzzles hide deeper truths. I’ll make sure the "epistemic friction" angle feels alive—like the researcher’s insight could reshape how we see AI’s limits.
answer: |-
  Here's the pitch – imagine us hunched over slightly-too-small coffee cups, mid-morning caffeine just kicking in:

  **1. The Sharp Question:**  
  Why is knowing what *didn't* happen so much harder, and fundamentally different work, for an agent (human or machine) than knowing what *did* happen? Forget listing non-effects for a second. If we take this researcher's friction metaphor seriously: **Is the core epistemic labor of tracking stability inherently asymmetric, and more demanding, than the labor of tracking change, making the frame problem less about logic gaps and more about cognitive/philosophical drag?**

  **2. Why the Usual Fixes Are Band-Aids on the Real Wound:**  
  Look, successor-state axioms? They're *prescriptive cheat codes*. They basically say, "Here's exactly how to update state *X* when action *Y* happens, and screw everything else." They *assume* the asymmetry away by hard-coding the stability. They don't explain *why* stability needs this special, brittle treatment – they just enforce it. Default logic and non-monotonic logics? They try to be smarter about laziness – "Assume nothing changes unless forced to." But here's the rub: **That "laziness" *is* the asymmetry in action!** These systems formalize the *symptom* (prioritizing change-tracking) without grappling with the underlying *cause*: the inherent difficulty and different *kind* of work involved in *positively grounding stability* versus *observing or inferring change*. They treat stability as the passive default state, not as something that requires active (but different) epistemic effort. They solve the bookkeeping problem by fiat, leaving the fundamental friction untouched.

  **3. Method: Poking the Asymmetry with Sticks (Formal & Squishy):**  
  I want to put formal belief-update systems and human intuitive physics in the same interrogation room. On one side: **Crack open belief revision frameworks (think AGM-style stuff).** How do they model learning *that something changed* (new info) versus learning *that something stayed the same* (lack of contradictory info)? Is the computational/modal 'weight' the same? I bet it's not – stability often rides piggyback on change detection. Then, contrast this with **human cognition, especially intuitive physics and object permanence.** Tons of psych work (think Baillargeon's infant studies) shows we're *built* with priors expecting stability (objects don't vanish, properties persist). When that stability is violated, it's *surprising*, demanding explanation. But crucially, *maintaining* that stable world model isn't passive; it's an active inference process constantly suppressing alternative change scenarios. The method is this friction-focused *comparison*: Where do the formal rules reveal hidden asymmetric costs? Where does human cognition show the strain of actively managing stability versus passively noting change?

  **4. What Counts as a Win (and What's a Flop):**  
  *   **Win:** Showing the asymmetry isn't just a flaw in *current* logic systems, but reflects a deeper epistemic constraint. Demonstrating that formal belief update rules implicitly encode this friction (e.g., revision rules handle *new* propositions differently than confirming *old* ones). Finding parallels in human cognition where stability-maintenance requires distinct (and potentially more effortful) mechanisms than change-detection. Arguing that this friction *is* the core frame problem, making the bookkeeping failure a downstream effect.
  *   **Flop:** If the asymmetry collapses under scrutiny. If it turns out stability-tracking *can* be fully reduced to efficient change-detection-plus-defaults (proving the old view right). If the human/formal comparison reveals no meaningful friction points – if updating beliefs about stability vs. change feels computationally identical in the models or cognitively equivalent in the studies. If I end up just re-describing the bookkeeping problem in fancier words.

  **5. Scope Check (Keeping it Semester-Sized):**  
  Okay, deep breath. This *could* spiral into cognitive science PhD territory or full-blown metaphysics. Here's the guardrails:  
  *   **Focus on Belief Update:** Not building full action/planning theories. Just: How do agents (formal and biological) *update their beliefs* about the world state when things happen (or don't)? Keeps it epistemological.  
  *   **Targeted Formal Analysis:** Deep dive into *one* major belief revision framework (AGM is the poster child) to expose its asymmetric assumptions. Compare *briefly* to how successor-state axioms handle it in a specific micro-domain.  
  *   **Leverage Existing Cog-Sci:** Don't run new experiments! Synthesize existing work on intuitive physics, object permanence, and maybe change blindness to highlight the stability-tracking effort. No need to reinvent that wheel.  
  *   **Philosophical, Not Engineering:** The goal isn't to build a better robot (yet). It's to argue that *this friction* is the philosophical heart of the frame problem. Avoid getting bogged down in coding specifics or the latest ML architectures.  
  *   **One Core Asymmetry:** Stick to the stability-vs-change friction. Don't try to solve all of epistemology or tie it into every other AI problem (qualia, grounding, etc.).  

  This feels *tight* but doable in 5000 words. It starts with a punchy question rooted in that researcher's insight, calls out the limitations of the standard toolkit in a fresh way, uses a concrete comparative method, defines clear success/failure metrics, and crucially, stays narrowly focused on the epistemic asymmetry itself. It leaves the bibliography to me, but points me exactly where I need to dig – belief revision theory and intuitive physics literature. Good? More coffee?
