  Hmm, the real tension is between ex post sensitivity and avoiding leveling down in expectation. If they reject ex post prioritarianism (step 2), they might adopt ex ante prioritarianism, but that loses ex post sensitivity—actual outcomes wouldn't directly determine the moral value, which the user wants to keep. That's a high cost. 

  Alternatively, they could reject the interpretation in step (5) that prioritarianism demands leveling down in expectation. The argument equates declining a Pareto improvement in expectation with leveling down, but leveling down typically means making someone worse off to reduce inequality. In this case, no one is actually worse off; it's about risk. Prioritarianism cares about the distribution of actual welfare, not expected welfare. So rejecting (5) preserves the core idea that concavity prioritizes the worse off, and keeps ex post sensitivity. The cost is accepting that prioritarianism might reject some ex ante Pareto improvements when the worst-case outcomes are bad enough—which might be justified by the moral weight of actual suffering.

  The prioritarian's best reply to keep both ex post sensitivity and priority would be to argue that the concavity reflects the intrinsic disvalue of low welfare states, not risk aversion. So even if the lottery has equal expected welfare, the possibility of someone ending up at 0 welfare is so bad that it outweighs the potential gains. This maintains that actual outcomes matter and the concave transformation isn't just rescaling. The user might find this acceptable if they believe preventing actual low welfare is paramount, even at the cost of passing up some expected gains.
answer: |-
  ### Restatement of the Argument in Strongest Form  
  (Your friend's core case, reconstructed rigorously):  
  - **Premise 1 (Prioritarianism Defined)**: Prioritarianism ranks outcomes by summing a strictly concave, increasing transformation \( f \) of individual welfare. This avoids the *levelling-down objection*: since \( f \) is increasing, no one is ever made worse off to "improve" equality.  
  - **Premise 2 (Ex Post Extension)**: Under uncertainty, prioritarianism evaluates actions by the *expected value* of the sum of \( f(w_i) \) across possible outcomes (ex post prioritarianism).  
  - **Premise 3 (Numerical Dominance of Safe)**: For \( f(w) = \sqrt{w} \), two people at welfare 2:  
    - **Safe**: Both remain at 2. Sum: \( 2\sqrt{2} \approx 2.83 \).  
    - **Risky**: 50% chance of (6,0), 50% chance of (0,6). Sum: \( \frac{1}{2}(\sqrt{6} + \sqrt{0}) + \frac{1}{2}(\sqrt{0} + \sqrt{6}) = \sqrt{6} \approx 2.45 \).  
    Result: Safe > Risky. Generalizes to any strictly concave \( f \) where \( 2f(2) > f(6) + f(0) \).  
  - **Premise 4 (Ex Ante Pareto Dominance)**: Each person's *expected welfare* under Risky is 3; under Safe, it is 2. Both are better off ex ante, no one worse off.  
  - **Premise 5 (Ex Ante Levelling-Down)**: By rejecting Risky, prioritarianism prefers an option where *everyone is worse off in expectation* to avoid unequal outcomes. This mirrors the levelling-down objection: "improving" equality by making everyone worse off ex ante.  
  - **Premise 6 (Inequality Irrelevance)**: The issue isn’t inequality. Prioritarianism also prefers Safe over a *correlated lottery* (both get 6 or both get 0 with 50% chance): \( \frac{1}{2}(\sqrt{12}) + \frac{1}{2}(\sqrt{0}) \approx 1.73 < 2.83 \). Concavity acts as *risk aversion over individual welfare*, not a concern for inequality. If \( f \) merely rescales welfare, prioritarianism collapses to utilitarianism.  
  - **Conclusion (Premise 7)**: Prioritarianism is either:  
    (a) Utilitarianism in disguise (if \( f \) is linear/risk-neutral), or  
    (b) An expectation-levelling view that fails its own anti-levelling-down standard.  

  ---

  ### Key Points Where the Chain Could Break  
  1. **Reject Premise 2 (Ex Post Aggregation)**: Ex post prioritarianism is not the only way to extend the view to uncertainty. An *ex ante* approach (apply \( f \) to expected welfare) avoids the problem but sacrifices sensitivity to actual outcomes.  
  2. **Reject Premise 5 (Ex Ante Levelling-Down Analogy)**: The levelling-down objection might not apply to *ex ante* reasoning. Declining a gamble that improves expected welfare for all isn’t equivalent to intentional levelling-down; it’s avoiding risk of bad outcomes.  
  3. **Reject Premise 6 (Concavity ≠ Risk-Aversion)**: Concavity in \( f \) might express *priority to the worse off* without being reducible to risk aversion. The correlated lottery case may misdiagnose the moral concern.  

  ---

  ### The Step I Reject: **Premise 5 (Ex Ante Levelling-Down Analogy)**  
  **Why it looks fine**:  
  The levelling-down objection condemns policies that *harm some to benefit no one*. Premise 5 claims rejecting Risky is analogous: it makes everyone worse off ex ante for the sake of no one (since no actual person is better off in any outcome).  

  **Why I reject it**:  
  The analogy fails because **levelling down requires an actual harm to a person**. In Risky, *no one is actually harmed* by choosing Safe; Safe preserves the status quo. Rejecting Risky avoids *risking* harm (someone ending up at 0), but it doesn’t *inflict* harm. The "ex ante loss" is a statistical artifact, not a real welfare decrease for any individual. Prioritarianism’s rejection of Risky is a precaution against bad states of the world, not a leveling-down act.  

  **What rejecting it costs you**:  
  - **You must abandon the claim that prioritarianism satisfies *ex ante Pareto***. Prioritarianism can reject gambles that are better for everyone in expectation (as here). This is a genuine cost: it means prioritarianism may conflict with giving people what they rationally prefer ex ante (if they value expected welfare).  
  - **But it preserves what you want**:  
    - The concavity still expresses *priority to the worse off* (it disvalues low welfare states more intensely).  
    - *Ex post sensitivity* is intact (actual outcomes determine moral value).  

  ---

  ### Prioritarian’s Best Reply to Keep Priority + Ex Post Sensitivity  
  **Core Strategy**: Argue that Premise 6 is wrong. Concavity in \( f \) reflects **the intrinsic moral disvalue of low welfare**, not risk aversion. This distinguishes prioritarianism from both utilitarianism and egalitarianism.  

  **Reply**:  
  1. **Priority vs. Risk-Aversion**:  
     - In Risky, the state where someone ends up at 0 is *intrinsically bad*, not because it’s risky, but because welfare 0 is a terrible state for a person. The concave \( f \) (e.g., \( \sqrt{w} \)) assigns moral weight to the *actual welfare level*, not the risk.  
     - **Correlated Lottery Case**: Safe is preferred not because we fear risk, but because the outcome where both are at 0 is catastrophic. \( f(0) = 0 \) drags down the expected score, but this reflects the prioritarian judgment that 0 welfare is *infinitely worse* than 6 is good. Utilitarianism (\( f \) linear) ignores this; prioritarianism doesn’t.  

  2. **Why Utilitarianism Isn’t Rescued**:  
     - If \( f \) were merely rescaling welfare (e.g., converting "utils" to "moral value" linearly), then summing \( f(w) \) would be equivalent to summing \( w \). But strict concavity makes prioritarianism *non-linear* in welfare: improving a life at 0 to 1 matters more than improving a life at 5 to 6. This is priority, not rescaling.  

  3. **Why Egalitarianism Isn’t Smuggled In**:  
     - Unlike egalitarianism, prioritarianism never prefers an equal-but-worse outcome (e.g., (1,1) over (2,0)). Here, Safe is (2,2) vs. Risky’s *risk* of (6,0) or (0,6). But no outcome in Risky is preferred to Safe; the worst outcomes are dire.  

  **Cost of This Reply**:  
  - You must accept that prioritarianism can **conflict with ex ante Pareto** when gambles risk severe deprivation. This is the tradeoff for prioritizing the worst-off in actual outcomes.  
  - But it saves the core: priority to the worse off is expressed via concavity, and actual outcomes matter.  

  ---

  ### Practical Implication for Your Grant Committee  
  Prioritarianism might reject the risky global-health program if:  
  - The "0 welfare" outcome represents a catastrophic failure (e.g., wasting resources with no benefit while people suffer),  
  - And the modest program guarantees meaningful improvement for some.  
  But this requires judging that the moral disvalue of the worst-case scenario outweighs the expected gains—**even if beneficiaries rationally prefer the gamble**. If your fund prioritizes avoiding catastrophic failures over maximizing expected impact, this stance is defensible.  

  This gives you an exit: Reject Premise 5. The argument’s "levelling-down in expectation" charge fails because no one is *harmed* by avoiding the gamble. The cost is that ex ante Pareto isn’t sacred, but that’s the price of caring about actual suffering.
