answer: |-
  ### Scenario (118 words)
  A household monitors a single pantry shelf. **System A** is a voice-controlled LLM linked to an inventory database updated by manual barcode scans. **System B** is a simple robot: a weight sensor under the shelf plus a camera trained only to detect colour blobs matching "sugar" (white) or "coffee" (brown). Both answer "Is [item] on the shelf?". A uses its LLM for paraphrased queries ("Got any sweetener?") and explanations ("No sugar left, but coffee is present"). B answers only literal "sugar?" or "coffee?" with "present" or "absent" based on its sensors. If sugar spills (white blob present, weight zero), B reports "absent". A relies on scans; if a scan is missed, it confidently hallucinates stock.

  ### Verdicts
  *   **Outward Behaviour Camp (e.g., LLM supporters):** *A understands, B does not.* A handles novel phrasing, explains implications, and transfers concepts (e.g., linking "sweetener" to sugar). B fails paraphrasing, lacks explanations, and makes literal errors (calling spilled sugar "present" until weight updates it).
  *   **Causal Grounding Camp (e.g., embodied AI/robotics):** *B understands, A does not.* B's state ("present/absent") is *directly caused* by physical sensor input (weight, blob) detecting the *actual objects*. Errors (like spilled sugar) are corrected *by the world* via sensor update. A's state is caused by text (scans, training data); errors are corrected only by *more text* (correct scan), not the shelf itself.

  ### Isolated Feature
  **Correction Provenance:** Whether erroneous states are updated by *physical sensor feedback from the world* (B) or by *symbolic/textual input* (A). This directly tests your hypothesis.

  ### Removing the Feature
  If B's sensors are disabled and it relies *only* on a manual input stream (like A's scans), both camps align: neither is grounded. Outward behaviour still favours A, but causal grounding rejects both. Verdicts no longer cross.

  ### Attack from the Outward Behaviour Camp
  A defender would argue: "B's sensor link is crude transduction, not understanding. It lacks *generality* – it can't *reason* about 'sugar' beyond blob/weight. A's flexibility *is* understanding; it integrates concepts semantically. Its 'hallucinations' are like human memory errors. Correcting via scans (human input) is valid social grounding, akin to learning from others. You've defined 'understanding' so narrowly only simple sensors qualify, ignoring cognitive competence."

  ### Key Insight
  The case turns decisively on **correction provenance** – whether the ultimate error signal comes from the physical world or from symbolic records.
