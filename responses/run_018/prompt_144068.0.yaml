  ### Decision-Tree Taxonomy for Moral Responsibility of Transparent Algorithms/Institutions  
  *Framed via Strawson's Reactive Attitudes (e.g., resentment, gratitude)*  

  **Key Context**: The target agent is an institution or algorithm with fully transparent and externally modifiable decision procedures.  

  ---

  #### **Tree Structure**  
  1. **Q1 (Diagnostic)**: *When a transparent algorithm causes unjust harm, is resentment ever appropriate?*  
     - **No** → Go to Q2  
     - **Yes** → Go to Q3  

  2. **Q2 (Exemption Basis)**: *Is the inappropriateness solely due to the system’s procedural transparency (i.e., "determinism")?*  
     - **Yes** → **Pereboom’s Hard Incompatibilism**  
     - **No** → **Wolf’s Reason View**  

  3. **Q3 (Determinism Impact)**: *Does procedural transparency eliminate the appropriateness of resentment?*  
     - **Yes** → *Logically incoherent branch (see diagnosis below)*  
     - **No** → Go to Q4  

  4. **Q4 (Function of Attitudes)**: *Do reactive attitudes serve only a social-regulatory purpose (e.g., deterring future harm), not a genuine moral demand?*  
     - **Yes** → **Unnamed Instrumentalism**  
     - **No** → Go to Q5  

  5. **Q5 (Calibration)**: *Can resentment be proportionally calibrated (e.g., milder for minor flaws vs. severe for egregious ones)?*  
     - **Yes** → **Strawsonian Compatibilism & Fischer’s Semi-Compatibilism**  
     - **No** → **Unnamed All-or-Nothing Non-Instrumentalism**  

  ---

  #### **Leaf Positions & Awkward Commitments**  
  - **Pereboom’s Hard Incompatibilism**:  
    *Awkward commitment*: Insisting resentment is inappropriate even when a transparent system’s modifiable flaw causes grave harm, reducing accountability to purely technical fixes.  
  - **Wolf’s Reason View**:  
    *Awkward commitment*: Denying resentment toward a reason-responsive algorithm because it lacks "deep moral understanding," despite its ability to mimic ethical behavior.  
  - **Unnamed Instrumentalism**:  
    *Awkward commitment*: Treating resentment as a tool for system optimization, void of moral significance—e.g., "blaming" a calculator for miscalculation to motivate updates.  
  - **Strawsonian Compatibilism & Fischer’s Semi-Compatibilism**:  
    *Awkward commitment*: Attributing "quality of will" (e.g., malice/negligence) to a transparent algorithm whose "will" is mechanically inspectable.  
  - **Unnamed All-or-Nothing Non-Instrumentalism**:  
    *Awkward commitment*: Demanding identical resentment for minor bugs and catastrophic design flaws, since blame cannot be proportioned.  

  ---

  #### **Unoccupied Branches & Diagnoses**  
  1. **Q1=Yes → Q3=Yes** (Resentment appropriate *until* transparency is considered):  
     - **Diagnosis**: Logically incoherent. If transparency inherently eliminates appropriateness (Q3=Yes), then Q1 cannot be Yes for transparent systems.  

  2. **Q1=Yes → Q3=No → Q4=Yes → Q5=No** (Instrumentalist, all-or-nothing resentment):  
     - **Diagnosis**: Unexplored. Combining instrumentalism with binary blame is coherent (e.g., "blame as on/off switch for regulation") but pragmatically unattractive.  

  3. **Q1=Yes → Q3=No → Q4=No → Q5=No** (Non-instrumentalist, all-or-nothing resentment):  
     - **Diagnosis**: Unexplored. Coherent if resentment is seen as a primitive moral response (e.g., "harm always warrants full blame"), but clashes with intuitions about severity.  

  ---

  #### **Indistinguishable Positions**  
  - **Strawsonian Compatibilism & Fischer’s Semi-Compatibilism** share the leaf at **Q1=Yes, Q3=No, Q4=No, Q5=Yes**.  
    - **Why?** Both endorse calibrated resentment toward transparent systems as expressing moral demands, and the tree’s branches do not probe their core divergence (quality of will vs. reasons-responsiveness).  

  ---

  #### **Tree Navigation Example**  
  - **Pereboom’s Path**: Q1=No → Q2=Yes  
  - **Wolf’s Path**: Q1=No → Q2=No  
  - **Instrumentalism**: Q1=Yes → Q3=No → Q4=Yes  
  - **Strawson/Fischer**: Q1=Yes → Q3=No → Q4=No → Q5=Yes  
  - **All-or-Nothing**: Q1=Yes → Q3=No → Q4=No → Q5=No
