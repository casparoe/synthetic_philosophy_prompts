answer: |-
  ## Opening Remarks: On the Boundary of Calling

  Distinguished colleagues, advocates, scholars, and friends,

  Welcome. We gather at a threshold. The threshold marked by thirty-five hours. A line drawn in the complex terrain where our labor meets our lives. This workshop, "The Boundary of Calling: Work, Leisure, and the Thirty-Five-Hour Limit," confronts a tension as old as human striving and as urgent as tomorrow’s headlines. It’s a tension that pulses beneath the very idea of this gathering, and it will be the ground upon which we stand – or perhaps wrestle – for these two days.

  On one side, we carry the profound weight of **work as calling**. The idea that labor is more than mere toil; it can be a source of identity, purpose, even nobility. It whispers of dedication, craftsmanship, and contributing something larger than oneself. This isn't abstract theory. We see it in the doctor driven by a vow to heal, the teacher shaping young minds, the artisan perfecting their craft. To reduce this to mere hours feels, sometimes, like diminishing a sacred fire. It risks sounding like we dismiss the deep dignity found in pouring oneself fully into meaningful work.

  On the other side stands the undeniable reality of **leisure as an inalienable right**. A right not merely to rest, but to live. We know the grim evidence etched into lives and laws: the devastating toll of *karoshi* – death by overwork. We see the broken bodies, the fractured families, the burnout that hollows out the soul. The thirty-five-hour limit, or any reduction in excessive hours, isn’t just a policy; it’s a shield against this destruction. It’s the assertion that a life consumed entirely by labor is a life denied. To speak *only* of calling, ignoring this mortal danger, risks becoming an apology for exploitation – for systems that demand everything and return only exhaustion.

  This is our shared tension. It is not a problem to be solved neatly in five minutes, but a dynamic force we must engage with honestly. Our task here is not to choose one pole and abandon the other. It is to hold both realities firmly in view.

  For our colleagues steeped in the history of labor and economic thought: We cannot discuss the "spirit" of work without confronting the brutal *body* that work can break. The Protestant ethic cannot be separated from the Japanese case study, nor the French political struggle for the thirty-five-hour week from the lived experience of those fighting for breath.

  For our union organizers and occupational-health advocates: We cannot fight for life-saving limits without acknowledging the powerful human drive for purpose *through* work. The abstract concept of "vocation" resonates in the pride a worker takes in their skill, the solidarity of a shared struggle, the meaning found in providing for family or community. Dismissing this risks alienating the very people we seek to protect, making the fight seem like a denial of their worth.

  So how do we navigate this? How do we affirm that **reducing harmful, excessive work hours is fundamentally an act of preserving human life and dignity**, without implying that the work itself lacks inherent value? How do we honor the deep human impulse towards meaningful vocation, without providing cover for systems that twist that impulse into a tool of exhaustion?

  This workshop exists because we believe these questions demand shared exploration. We must examine the *boundary* itself. Is the thirty-five-hour limit, or any similar guardrail, primarily a **protective fence**? A necessary barrier erected *around* the domain of vocation to prevent it from consuming the whole person? Or, more radically, must we rethink vocation itself? Can we envision **calling reconceived**, so that leisure, rest, family, community – the fullness of life – is not an *exception* to work, confined outside its walls, but **integral to its very meaning and sustainability**? Can a calling thrive only when it acknowledges its own limits, respecting the time and space required for the human spirit to replenish?

  These are not academic puzzles. They shape policies that save lives. They influence contracts negotiated at bargaining tables. They determine the culture of our workplaces and the rhythm of our days. The answers we lean towards determine whether we see leisure as the *absence* of work, or as the vital ground from which meaningful work can truly grow.

  So, let us begin. Let us listen across disciplines and experiences. Let us challenge assumptions, share evidence, and grapple with this profound tension – the tension between the undeniable dignity found in work and the inalienable right to a life beyond it. The boundary of calling is where we stand. Let us explore it together, with open minds and a shared commitment to human flourishing.

  The central question awaits us: **Is leisure the essential boundary that protects vocation from consuming us, or is it the vital space we must weave back into the very fabric of vocation itself?**

  I invite you now to cross the threshold. Let the workshop begin.
