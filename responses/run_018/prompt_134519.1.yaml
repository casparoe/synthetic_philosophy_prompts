  For the vagueness question, I'm considering contrasting epistemicist views (hidden sharp boundaries) with her contextual fluidity claim. The follow-up should anticipate her likely rebuttal about context-independent assumptions. On the acoustic metric question, I'll focus on whether perfect similarity measurements could resolve function - with follow-up addressing her probable counter that context overrides formal features. 

