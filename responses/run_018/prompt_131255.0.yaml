  I'm applying for a six-month fellowship in philosophy of science and need a polished, two-page proposal. My working idea is this: ontic structural realism has been developed almost entirely within physics, where the implicit assumption is that mathematical structures survive theory change because they are uniquely realized in nature. But in topological data analysis applied to evolutionary biology—specifically, using persistent homology to classify mammalian cortical morphologies—the same formal structure is routinely realized by incompatible phylogenetic trees. This creates a tension that the standard epistemic versus ontic distinction, as developed in the quantum-mechanics and general-relativity literature, does not address. I want the proposal to ask: when a scientific domain systematically permits empirically equivalent but ontologically distinct realizations of an identical mathematical structure, does structural realism collapse into instrumentalism about that domain, or does it require a pluralist ontology in which structure itself is multiply instantiated? The proposal should contain: (1) a precise statement of the question, clearly distinguishing it from the familiar pessimistic-meta-induction argument; (2) an account of why the existing structural-realist literature leaves this open, with particular attention to the uniqueness assumption that physics-based examples carry; (3) a concrete, month-by-month research plan—part conceptual analysis of representational practices in topological data analysis, part targeted case study of competing phylogenetic interpretations—together with a justification for this mixed method over purely a priori or purely empirical alternatives; (4) a clear definition of success (what argument or framework would resolve the tension) and of failure (what finding or obstacle would show the project intractable within six months); and (5) an honest risk assessment, including the possibility that practicing biologists reject the philosophical framing. I do not need a bibliography, citation list, or literature review by author name; I will supply references myself. Please write in formal academic prose appropriate to a selection committee comprising both philosophers of science and working biologists.
