answer: |-
  Here’s your seminar prompt, structured as requested:

  ### The two views in plain english
  Lewis’s **Principal Principle (PP)** says: if you know the objective chance of some event (like an atom decaying) is *X*, and you have no “inadmissible” information (stuff that trumps chance, like knowing the future outcome), then your personal belief (credence) should be *X*. Chances are real, physical features of the world.  
  The **rival epistemic-subjectivist view** says: there’s no objective chance “out there.” “Chance” is just what an *ideally informed agent* (who knows all physical facts except maybe which exact world this is) would believe. To be rational, you should match *their* credences whenever possible. Deference is to an expert, not a fundamental law.

  ### The multivers twist
  Imagine you’re in a multiverse with many domains. Each domain has its *own* fundamental chance laws – say, some have a 20% chance/hour of atom decay, others 80%. You know the *distribution*: half are 20%-domains, half are 80%-domains. But you have no clue which domain *you* inhabit. Now, what should your credence be that a specific atom in your domain decays in the next hour?  
  *   **PP Approach:** You don’t know your *local* chance. PP directly applies only if you know the *specific* chance value. Is your knowledge of the distribution "inadmissible" for applying PP locally? If yes (likely, as it includes self-locating uncertainty), PP *blocks* direct deference. You might calculate an *average* (50% credence = 0.5 * 20% + 0.5 * 80% = 50%), but this isn’t PP *deferring* to a chance – it’s manual mixing. PP might demand you *wait* until you know your domain to set credence = local chance.  
  *   **Subjectivist Approach:** The “ideally informed agent” *would* know which domain you’re in. But you don’t. So, what should *your* credence be? The view likely says: since the ideal agent *for your situation* (knowing all physical facts but not your location) would have a 50% credence (the mixture), *that’s* what you should adopt. Location uncertainty *is* baked into the "chance" you defer to. It collapses the self-locating uncertainty into the credence you should hold.

  ### Settled vs genuinely contested
  **Settled:** PP’s core idea – rational credence defers to known objective chance absent inadmissible info – is widely accepted as a benchmark. The concept of "admissible information" (typically historical/background info, not future outcomes) is central. Subjectivists agree we should defer to an ideal expert's credences.  
  **Contested:** Whether *self-locating ignorance* (like not knowing your domain) counts as **inadmissible information** for PP is fiercely debated. Lewis assumed a single chance framework; multiverses stress-test PP. Does PP *require* knowing your local chance law, rendering it silent here? Or can the mixture *become* the chance you defer to? Subjectivists face questions: does their ideal agent *always* know your location? If not, how is "ideal information" defined relative to context? Both views grapple with whether location uncertainty fundamentally alters deference.

  ### Verdict
  In this multivers setup, PP likely *stalls* – self-locating ignorance seems inadmissible, preventing direct deference to a local chance. You calculate an average credence manually, not via PP. The rival view *absorbs* the location uncertainty smoothly: your rational credence *is* the mixture (50%), because that’s what deference to the contextually ideal agent demands. PP maintains a sharp line between chance uncertainty and self-location; the subjectivist view blurs them. Whether this is a bug or a feature is the core tension.

  **Liberties/Contested Note:** This analysis leans heavily on interpreting self-locating evidence as *potentially inadmissible* for PP. Lewis focused on temporal/historical admissibility; extending it to self-location in a multiverse is a contested modern application, not explicit in his original work. The subjectivist "ideal agent" is also underspecified – defining their "contextual knowledge" is a major point of debate.
