prompt: |-
  ok so i've been tinkering with distributed AI setups where nodes don't share a clock and there's no central processor — basically synthetic architectures that aren't brain-like at all. I'm trying to figure out if IIT (or any consciousness theory) can actually tell me wether one of these clusters has a unified experience, or if it's just a bunch of separate processes. Before I read more, can you lay out the desiderata? Like what must a theory deliver to count as adequate for substrate-independent, clockless integration? I want the real requirements: explaining phenominal unity without a neural hub, ruling out zombie-clusters in silicon, handling partial integration across firewalls, and whether it needs empirical equivalence with brain data. Say which are non-negotiable and which are just biological-camp preferences. Also tell me if any of these are jointly unsatisfiable — I think substrate independence and the exclusion postulate might be in tension for distributed systems but maybe that's wrong. No need for reading lists, just the conceptual checklist.
