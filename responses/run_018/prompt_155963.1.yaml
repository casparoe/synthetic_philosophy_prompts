answer: |-
  ### The three-layer map  
  **Frame message**: The TASS announcement framing Sputnik as a triumph of peaceful Soviet science ("contribution to world science"). This packaging targeted *global public opinion* (including Soviet citizens and non-aligned nations) to normalize the achievement as benign and ideological victory. Its function was to dictate *how* the event should be interpreted: as human progress, not military escalation.  

  **Outer message**: The literal signals broadcast by Sputnik: radio beeps at 20.005/40.002 MHz and orbital parameters (apogee/perigee, inclination). This was decodable by *any equipped receiver* (global ham radio operators, astronomers, Jodrell Bank). It was machine-like data requiring no political context—verifiable, undeniable proof of orbital capability.  

  **Inner message**: The unstated demonstration of an operational Intercontinental Ballistic Missile (ICBM) platform. The R-7 rocket’s power to lift a payload to orbit meant it could deliver a nuclear warhead to the continental US. This was decrypted *only by adversarial decoders* (US/NATO intelligence, NSC, Pentagon) who possessed the contextual "key": knowledge of Soviet ICBM programs and the strategic weight of orbital mechanics. The Kremlin did not intend this layer for Western militaries—it was an *unavoidable leakage* of capability.  

  ---

  ### The decoder problem  
  The TASS announcement ("peaceful science") fails as a Hofstadterian structural frame. In GEB, a start codon (e.g., ATG) is a *universal, functional signal* triggering a specific biological process in all ribosomes. It is intrinsic to the system’s operation. TASS’s frame, however, was *extrinsic propaganda*—a narrative overlay attempting to manipulate interpretation. It didn’t enable decoding of the inner message; it actively *obscured* it for most audiences.  

  The inner message’s decoding was adversarial and unintended. Hofstadter’s model assumes a cooperative system where sender/receiver share purpose (e.g., DNA instructs ribosomes). Here, the Kremlin’s frame targeted *neutral/domestic* decoders to mask the inner message, while the *actual* inner message (ICBM threat) was forcibly extracted by hostile decoders (US intelligence) ignoring the frame. The "start codon" analogy collapses: TASS was camouflage, not an instruction to translate. The true structural signal—orbital velocity—was physical, not linguistic, making the threat self-evident to those who knew rocketry.  

  ---

  ### Bottom line for the framework  
  Sputnik exposes Hofstadter’s framework as insufficient for adversarial contexts. His model relies on aligned sender/receiver goals, where inner messages are *intended* for decoding. Here:  
  1. **Inner messages become involuntary emissions**—the ICBM proof was inherent in the physics, not a crafted "message."  
  2. **Frames are weaponized disinformation**, not structural keys. Their success depends on the decoder’s naivete (e.g., global public) vs. skepticism (e.g., NSC).  
  3. **Decoders define meaning antagonistically**: US intelligence discarded the Soviet frame to extract the inner threat, proving that in geopolitics, the "inner message" is often a *vulnerability exposed*, not a communication.  
  Hofstadter’s tripartite structure holds for cooperative systems, but fractures when senders conceal intent and decoders exploit leakage. The framework needs a "hostile decoder" variant where physical evidence overrides narrative framing.
