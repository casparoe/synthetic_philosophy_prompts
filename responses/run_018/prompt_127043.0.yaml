answer: |-
  Your inquiry dissects a profound epistemological and normative asymmetry in collapse discourse. Let's reconstruct the implicit philosophical commitments and evaluate alternatives:

  ### Core Philosophical Commitments
  1. **Institutional Essentialism**: 
     - Societies are defined by *specific institutional forms* (palace bureaucracies, monumental architecture, hieroglyphic writing). This is a Platonic essentialism where societal "being" resides in formal structures rather than adaptive processes.
     - **Identity Conditions**: A society persists only if core institutions remain materially continuous. The Postclassic Maya (with decentralized trade networks, perishable architecture, and screenfold texts) become "new" societies because they lack Classic-era stone pyramids and royal stelae.

  2. **Complexity Teleology**: 
     - Implicit progress narrative: Complexity (monumentality, urbanization) represents societal "maturity." Its loss is regression, not adaptation. This inherits 19th-century unilinear evolutionism (e.g., Spencer, Tylor).
     - **Normative Loading**: Collapse is framed as *failure* because it violates the presumed imperative: "societies should maintain complexity." Rapa Nui's reduced population is "collapse"; Tikopia's successful demographic controls are "sustainability."

  3. **State-Centric Epistemology**: 
     - Knowledge systems equate societal continuity with state persistence. Post-Bronze Age Levantine villages (continuing Canaanite language/religion without palaces) become "dark age" societies rather than resilient adaptations.

  ### Is Exclusion of Reorganized Societies Necessary?
  The practice is **philosophically underdetermined** but contingently reinforced by:
  - **Essentialist View**: Requires exclusion (institutional form = society's essence)
  - **Functionalist View**: Could *include* reorganized societies if core functions (e.g., subsistence, ritual) persist through new structures
  - **Narrative View**: Depends on emic/etic frameworks: To the Classic Maya, 9th-century fragmentation was collapse; to Postclassic Mayapán residents, it was liberation.

  Catastrophic human welfare decline (e.g., 90% mortality) provides a value-neutral collapse criterion, but current discourse:
  1. Applies "collapse" to political fragmentation *without* demographic catastrophe (e.g., Maya Lowlands maintained 60-80% population)
  2. Ignores welfare disasters lacking institutional dissolution (e.g., Congo Free State atrocities)

  ### Shifting Frameworks: Practical Implications
  Adopting a **processual identity theory** (societies persist through institutional metamorphosis if cultural knowledge/communities endure) would necessitate:

  | Domain          | Current Practice                                                                 | Revised Approach                                                                 |
  |-----------------|----------------------------------------------------------------------------------|---------------------------------------------------------------------------------|
  | **Museum Curation** | "Classic Maya Collapse" dioramas ending with abandoned cities                  | Exhibits on "Maya Transformations": Classic governance → Postclassic trade networks |
  | **Pedagogy**      | Syllabi pairing 1177 BCE & Rapa Nui as collapse warnings                       | Modules comparing institutional collapse (Rome) vs. reorganization (Byzantine adaptation) |
  | **Policy Briefs** | "Avoid Maya/Roman collapse" rhetoric promoting complexity preservation         | "Adaptive Thresholds" framework: When simplification increases resilience (e.g., post-Carolingian Europe) |
  | **Heritage Narratives** | "Lost civilization" tropes at Copán or Mycenae                               | "Continuous communities" emphasis (e.g., Zapotec persistence after Monte Albán's decline) |

  ### Conclusion
  The asymmetry presupposes **institutional fetishism**—confusing societal essence with perishable political forms. This serves contemporary anxieties about industrial fragility but distorts historical trajectories. A consistent approach would either:
  1. **Restrict "collapse" to irreversible demographic/functional discontinuities** (e.g., Greenland Norse extinction), OR  
  2. **Adopt a morphogenetic perspective** where societies persist through structural changes unless collective identity dissolves (e.g., forced assimilation).

  Implementing (2) would require replacing "collapse" with **adaptive transition taxonomy** in policy/curation—e.g., "phase shift," "network reorganization," or "complexity reset." This reframes the Postclassic Maya not as diminished successors but as successful maritime adapters, and Late Bronze Age Cyprus not as a collapse victim but as an early Iron Age innovator. Such reframing detaches societal value from monumentality, centering instead on community endurance and knowledge continuity.
