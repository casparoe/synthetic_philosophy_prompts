  I need to brainstorm combination principles first. Organic unity (Moore's concept) suggests wholes have value beyond their parts. Multiplicative value would mean goods amplify each other exponentially. Negative interaction would cover cases where goods interfere destructively.

  Now for a unifying principle. The "amplification threshold" concept seems promising: goods amplify each other only when properly integrated, and the amplification factor depends on the quality of integration. This explains the multiplication in case 1 and the thinness in case 2. Case 3 shows negative interaction when integration is corrupted by rivalry. Case 4 reveals that the essence is the shared intentionality, not the medium. Case 5 indicates that physical presence provides richer integration.

  For the stranger test case: brief silent awe would have additive value (friendship-aspect + aesthetic-aspect) without amplification since there's no deeper integration.

