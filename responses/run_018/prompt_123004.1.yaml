answer: |-
  Here’s a structured research proposal addressing your core tension, designed to be rigorous yet feasible within three months. It avoids boilerplate and targets the ambiguity you identified.

  ---

  **Research Proposal: The Moral Psychology of Distance in Adam Smith’s Critique of Colonialism: Sympathy, Governance, and the Foundations of Anti-Imperialism**  

  **1. Research Question**  
  Did Adam Smith’s opposition to colonialism stem primarily from *economic inefficiencies created by misaligned incentives* (a principal-agent problem) or from the *moral corruption inherent in governing distant societies* where sympathy is attenuated? Does resolving this tension reveal whether Smith viewed colonies as merely inefficient or fundamentally unjust?  

  **2. The Problem with Existing Frameworks**  
  Scholarship bifurcates Smith’s anti-colonialism:  
  - **Economic readings** focus on *Wealth of Nations (WN)*: Colonies distort capital allocation ("fictitious capital"), enforce monopolistic rents, and suffer from legislators' ignorance of local conditions (a classic information/agency problem).  
  - **Moral readings** lean on *Theory of Moral Sentiments (TMS)*: Empire fosters avarice, violence, and undermines virtue.  
  *The gap*: Neither adequately confronts Smith’s explicit linkage of **distance** to *both* governance failure *and* moral disengagement. When Smith laments legislators who "cannot well judge" local affairs (*WN* IV.vii.c.66) and declares "sympathy . . . always fainter" with distance (*TMS* III.3.1), is he describing two discrete problems or facets of a unified critique? Current work treats these as parallel arguments, ignoring whether the *moral decay of sympathy* enables the *economic mismanagement*.  

  **3. Hypothesis & Approach**  
  **Hypothesis**: Smith’s critique hinges on the **interdependence of moral psychology and institutional efficiency**. Colonial governance fails *because* distance corrodes the sympathy enabling impartial judgment – collapsing the distinction between economic and moral failure. The "incompetence" of distant rulers (*WN*) is not merely informational but *moral*, rooted in TMS’s account of how spatial separation weakens fellow-feeling.  
  **Methodology**: Close textual analysis comparing:  
  - *WN*'s colonial administration passages (esp. Book IV on monopoly, Book V on governance costs) with *TMS*'s discussions of distance and sympathy (Part III on duty, Part VI on virtue).  
  - *Specific textual juxtapositions*:  
    - Smith’s critique of colonial legislatures’ ignorance (*WN* IV.vii.c) vs. the "impartial spectator’s" diminished authority over distant actors (*TMS* III.3).  
    - The misdirection of "fictitious capital" (*WN* II.v) as a symptom of *moral* failure: Does capital flee to colonies because investors, insulated by distance, lack sympathy for its destructive impacts?  
  - Focus on whether Smith frames administrative ignorance as a *technical* flaw or a *psychological* consequence of broken moral circuitry.  

  **4. Significance**  
  This reframes Smith’s anti-colonialism by:  
  - **Integrating TMS and WN**: Moving beyond treating them as separate domains.  
  - **Recasting "inefficiency" as moral pathology**: If market efficiency *requires* the sympathy mechanism, colonial mismanagement is not just wasteful but *corrupting*.  
  - **Resolving the "unjust vs. inefficient" dilemma**: If the principal-agent problem *originates* in attenuated sympathy, colonies become *inherently* unjust by violating the psychological preconditions for benevolent governance and efficient markets.  

  **5. Work Plan (12 Weeks)**  
  - **Weeks 1-2**: Deep dive into *WN* colonial critiques (Books II.v, IV.vii, V.iii). Catalogue all references to distance, ignorance, and institutional failure.  
  - **Weeks 3-4**: Deep dive into *TMS* on distance (Part III.1, III.3; Part VI.ii). Map the mechanics of sympathy’s attenuation.  
  - **Weeks 5-6**: Analysis 1: Juxtapose *WN* governance critiques with *TMS* sympathy/distance passages. Does Smith use identical/similar language? Are failures of judgment attributed to cognitive limits or moral disengagement?  
  - **Weeks 7-8**: Analysis 2: Examine "fictitious capital" flows. Does Smith imply investors’ moral blindness due to distance? Cross-reference *TMS* on wealth pursuit and moral self-deception.  
  - **Weeks 9-10**: Synthesis: Draft core argument resolving the tension. Test hypothesis: Does the *moral* decay (sympathy) *cause* the *economic* mismanagement?  
  - **Weeks 11-12**: Refine argument, write final proposal paper, outline implications for understanding Smithian liberalism and empire.  

  **6. Expected Outcomes & Deliverables**  
  - **Success**: A conference-ready paper demonstrating:  
    - Smith’s colonial critique is psychologically unified: Distance undermines *both* sympathy *and* effective governance, making them inseparable.  
    - Colonialism is therefore *inherently unjust* (due to broken moral psychology) *and* inefficient (due to resulting misgovernance). The distinction collapses.  
    - "Fictitious capital" reflects not just market distortion but *moral failure at a distance*.  
  - **Partial Success/Novel Finding**: Clear evidence that Smith *cannot* reconcile the two critiques, revealing a fundamental tension in his thought between utilitarian efficiency and moral sensibility.  
  - **Failure Modes**:  
    - **Textual Contradiction**: Smith explicitly treats governance ignorance and sympathy decay as unrelated.  
    - **Ambiguity**: Passages are too vague to support a strong link (mitigation: rigorously track language/context).  
    - **Scope Overreach**: The TMS/WN integration proves too complex for 3 months (mitigation: focus *only* on colonial distance passages).  

  **7. Feasibility**  
  **Manageable** because:  
  - Scope is tightly focused on colonial distance in specific sections of *WN* and *TMS*.  
  - Methodology is textual analysis, requiring no archival work.  
  - Deliverable (a 25-30 page paper) is achievable.  
  **Critical Risk**: Over-interpreting ambiguous passages. Mitigation: Ground every claim in direct textual evidence and avoid speculative leaps.  

  **8. Why This Isn’t a Standard Take**  
  This project moves beyond "Smith opposed mercantilism" or "Smith cared about morality" by:  
  - **Linking sympathy to institutional design**: Showing how TMS’s moral psychology *structures* WN’s institutional critique.  
  - **Reframing inefficiency as injustice**: Arguing that for Smith, markets cannot function "efficiently" *without* foundational sympathy – making colonial exploitation a categorical failure.  
  - **Exposing a core tension**: Does Smith believe markets *transcend* moral distance via price signals, or *require* moral proximity via sympathy? Colonies force this question.  

  ---

  **Key Advantages for Your Application:**  
  - **Precise Gap Identification**: Targets an unresolved tension in primary texts.  
  - **Methodological Rigor**: Close reading of specific passages avoids vagueness.  
  - **Intellectual Stakes**: Challenges bifurcated readings of Smith (economist vs. moralist).  
  - **Clear Feasibility**: Focused question, defined outputs, honest risk assessment.  
  - **Original Framing**: Positions "sympathy attenuation" as the missing link in colonial political economy.  

  This sets you up to demonstrate sophisticated engagement with Smith while delivering concrete results within 3 months. Good luck!
