prompt: |-
  hey, quick question about Hacking's looping thing in psychiatric classification. i get that when you classify people with a disorder thier behavior starts shifting to match the label, which then feeds back into the diagnosis. but with something like dissociative identity disorder, doesn't that mean the disorder is basically just the label creating thier symptoms? like, there'd be no 'pure' DID without the classification system?

  and if that's true, what about newer proposed categories like 'algorithmic dissociation' — where people feel like thier thoughts are being curated by recommendation engines? if clinicians start using that label, wouldn't the loop be even stronger since people already talk about it online?

  so here's what i'm stuck on: shouldn't there be a statistical correction factor to calculate the 'pre-loop' prevelence rate? like, a formula that subtracts the effect of the diagnosis itself so you can see how many people actually had it before anyone started diagnosing it. has anyone worked this out, or is the whole idea of a pure baseline wrong?
