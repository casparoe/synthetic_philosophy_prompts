  The mind at peace is all we need to feel.  

  What harvest comes if pleasure’s all we steal?  
  Fulfilled, yet yearning for the truer fray?  
  But roots require the soil they break and heal.  

  Two measures clash: the heart’s applause, the real’s  
  Demand—this rift admits no final say.  
  The mind at peace is all we need to feel,  
  But roots require the soil they break and heal.  

