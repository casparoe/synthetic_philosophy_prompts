     - Cycle 3 (10 min): Same.

     - Reset Phase (5 min): 
          - Count the total records in the notebook (each line is one record). 
          - Reset cost = 2 * (number of records).
          - Subtract from total accumulated points (S1+S2+S3).
          - Erase the notebook.

     - Repeat: Cycle 4,5,6 and reset (another 25 min)

     - Debrief (15 min): Map the game to the physics.

     Total: 10+5+10+10+10+5+25+15 = 90.

     **What might go wrong**:
     - The mixing phase might take too long if there are 52 cards. Instead, the facilitator can quickly mix by randomly moving a fraction of the cards? Or have the molecules each take a few cards and flip coins.

     - The scoring might take time. Have a helper or do it quickly.

     - The demon might not be able to sort many cards in 5 minutes. Adjust the time.

     - The cost C=2 might be too high or too low. We can adjust after seeing the first round.

     **Debrief**:
     - Sorting phase: the demon creates order (temperature difference) by sorting without apparent work. But the notebook (memory) is filling up.
     - The notebook represents the demon's memory. In physics, memory is physical and has entropy.
     - The reset phase: erasing the memory requires work (in physics, erasing a bit increases entropy by kT*ln2). In the game, we pay in points. The cost wipes out the gains.
     - If they never reset, the notebook grows. In physics, the memory would fill up and you'd have to either erase (cost) or use more physical memory (which eventually you have to erase or it becomes part of the system). The game only shows the cost when you erase, but in reality, the memory device itself is part of the system and has entropy.

     **Limitations**:
     - In the game, the reset cost is arbitrary (C=2). In physics, the cost is fixed per bit (kT*ln2) and the gain from sorting depends on the temperature difference. The game doesn't model the temperature difference explicitly.
     - The game assumes that the card color doesn't change. In reality, the speed of a molecule changes due to collisions. But the demon typically measures speed once and then the molecule collides and changes speed? That's a limitation. The game models a system where the identity (color) is fixed, but in reality, the speed is not fixed.
     - The mixing phase is artificial. In reality, the random motion is continuous and happens during the sorting? The game separates sorting and mixing.

     **Alternative to mixing phase**: Instead of a separate mixing phase, we can build mixing into the sorting phase. For example, while the demon is sorting, other players (molecules) are randomly moving cards. But that might be chaotic.

     Given the time and simplicity, the above design is manageable.

     **Materials List**:
     - Two boxes or tape to mark two chambers on a table.
     - One standard deck of playing cards.
     - A notebook and pen for the demon.
     - Coins for mixing (one coin per card? Or share a few coins).
     - Scoreboard.

     **Rules Summary Handout**:

     **Goal**: The demon team tries to maximize the score S by sorting red cards to the Right chamber and black cards to the Left.

     **Gameplay in one cycle (sorting phase)**:
     1. All cards start face down in a random chamber (after mixing).
     2. The demon may pick any face-down card from either chamber.
     3. If the card is not in the notebook, the demon must measure it (flip to see color) and record the card's identity (e.g., "Ace of Spades") and its color in the notebook.
     4. If the card is in the notebook, the demon can look up the color without flipping.
     5. The demon then decides where the card should be:
          - If red and in Left: move to Right.
          - If red and in Right: leave.
          - If black and in Left: leave.
          - If black and in Right: move to Left.
     6. After moving (or leaving), the card is placed face up in its chamber.
     7. The demon continues until time runs out or no more face-down cards.
     8. Score S = (number of correct) - (number of incorrect) is calculated and added to the team's total.
     9. Mixing phase: For each card, flip a coin. Heads: stay; Tails: move to the other chamber. Then turn all cards face down.

     **Reset Phase (after every 3 cycles)**:
     - Calculate reset cost = 2 * (number of records in the notebook).
     - Subtract the reset cost from the team's total points.
     - Erase the notebook.

     **Total time per cycle**: 10 minutes (5 min sorting, 2 min mixing, 3 min scoring and setup for next?).

     **Facilitator note**: Adjust times as needed. The first run might take longer.

     **Predictable problem**: The demon might not understand the lookup process and remeasure known cards. Remind them that they can look up to avoid flipping.

     **Another problem**: The mixing phase might not be random enough. Use a coin flip for each card to ensure randomness.

     **Scoring**: 
        Correct: red in Right, black in Left.
        Incorrect: red in Left, black in Right.
        S = (# correct) - (# incorrect)

     This should be a fun and enlightening game!
