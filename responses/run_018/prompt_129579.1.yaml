  The core philosophical question is whether there's a consistent theory behind this selective filtering. Possible frameworks include ethical contextualism with expiration (moral taint fades over time), medium-specific ethics (some art forms are more "tainted"), or pure pragmatism. But the patterns don't neatly fit any single theory - it's likely an unstable hybrid.

  I should map the implicit assumptions: 
  For living artists: direct financial/political risk, belief in ongoing moral contamination, performative disassociation. 
  For the dead: reduced backlash risk, historical contextualisation, legacy separation. 
  Medium differences: music's intimacy vs film's collaborative distance, plus commercial factors.

  Crucially, the practice doesn't require philosophical consistency - rival theories (contextualism, autonomism post-mortem, consequentialism) could all justify the same outcomes. The institutional behaviour is underdetermined by philosophy.

  Then we need to contrast what would change under two pure positions: 
  Radical autonomism (complete separation) would reinstate suppressed living artists and treat all media equally. 
  Universal moralism (permanent taint) would remove all problematic historical works and apply consistent deplatforming.

  The institutional hypocrisy likely stems from unexamined pragmatism - avoiding contemporary controversy while maintaining historical collections. Calling it out exposes the tension between ethical posturing and practical self-preservation.
answer: |-
  Right, let's dissect this institutional hypocrisy. It's a messy tangle of unspoken principles, commercial calculus, and historical inertia rather than a coherent aesthetic theory. Here's how the implicit commitments break down:

  ### The Implicit (and Inconsistent) Philosophical Commitments
  1.  **Proximity Principle & Moral Contagion (for the Living):** Institutions act *as if* the moral failing of a *living* artist is an active contaminant, directly tainting the work *now*. Suppression/demonetisation is performative disassociation – signalling the institution's current moral stance and attempting to sever its perceived complicity. The artist is seen as *currently benefiting* (financially/reputationally), creating an ongoing moral entanglement for the platform/gallery.
  2.  **Historical Cleansing / Legacy Separation (for the Dead):** Time acts as a solvent. Once the artist is dead:
      *   **Direct benefit ceases:** No royalties (often), no reputational boost *to the perpetrator*.
      *   **The work enters "History":** It becomes a cultural artefact, judged more for its historical influence and intrinsic qualities within art history than as a direct extension of the creator's *current* persona. The small plaque signifies contextualisation, not expulsion.
      *   **Legacy outweighs biography (selectively):** The cultural weight of the *work* (e.g., a Caravaggio, a Picasso) is deemed too significant to remove, effectively decoupling it from the now-distant moral failings of its creator in the institution's practical calculus.
  3.  **Medium-Specific Vulnerability (Music vs. Film vs. Visual Art):**
      *   **Music:** Highly personal, often autobiographical, consumed intimately and repeatedly. The artist's voice/persona is directly embedded. Platforms fear direct association ("We are *paying* this violent criminal *right now*") and user backlash is perceived as more visceral and immediate. Algorithmic suppression is easy and discreet.
      *   **Film:** Hugely collaborative, often corporate-funded. The director, while central, is one contributor among hundreds. The final product feels more like a distinct entity. Historical films by problematic directors are often seen as "classics" belonging to an era. Removal is logistically complex and commercially damaging (blockbuster libraries).
      *   **Visual Art (Acquisitions vs. Legacy):** *New* acquisitions from living, imprisoned artists pose the same "proximate contamination" risk as music – direct association and potential funding concerns. *Existing* works by long-dead morally flawed artists are protected by the "historical cleansing" principle and institutional investment (financial and scholarly).
  4.  **Risk Management Masquerading as Principle:** This is the overriding driver. The different treatments stem primarily from:
      *   **Perceived backlash risk:** Higher for directly funding/promoting living criminals, lower for displaying historical works where the harm feels abstract and distant.
      *   **Commercial cost:** Removing a major film from a streaming library is costly; suppressing a song via algorithm is cheap. Removing a cornerstone museum piece harms visitor numbers and institutional prestige.
      *   **Practicality:** It's easier to not acquire a new painting than to remove an old master. Algorithms can quietly suppress music; pulling films requires active, public decisions.
      *   **Performative Ethics:** Institutions need to be *seen* acting against contemporary evils. Criticising long-dead figures offers less reputational ROI.

  ### Is it a Coherent Theory? Does it Need to Be?
  *   **It's Philosophically Underdetermined:** **Absolutely.** The observed pattern doesn't *require* one single, consistent aesthetic theory. Several rival, even contradictory, philosophical positions can *license* this exact behaviour:
      *   **Ethical Contextualism with Expiry:** Moral judgement applies differently based on historical/cultural distance. Taint fades over time. (Explains dead vs. living).
      *   **Moderate Autonomism (Post-Mortem):** The artwork's aesthetic value *can* be separated from the artist's morality... but only once the artist is dead and can no longer personally benefit or exert influence. (Focuses on the *living* link).
      *   **Consequentialism/Pragmatism:** The *consequences* of displaying/suppressing the work *now* dictate action. Suppressing living artists avoids funding harm and backlash; displaying dead artists' work causes minimal current harm and provides cultural benefit. (Focuses purely on outcomes).
      *   **Medium Essentialism (Flawed):** Different art forms intrinsically carry the artist's moral character differently (e.g., music more directly than film). (A weak justification, often invoked but rarely defended rigorously).
  *   **It's Inconsistent:** The pattern *is* incoherent if judged by pure philosophical standards like universalism or consistent autonomism. Why is the murderous Renaissance artist's work "clean" but the murderous contemporary rapper's work "tainted"? The proximity principle and risk aversion, not deep aesthetics, provide the real answer.

  ### What Changes Under Different Core Philosophies?
  1.  **Radical Autonomism (Aesthetic Value COMPLETELY Independent):**
      *   **Living Artists:** Convicted criminals' music/films remain fully monetised and promoted. New works by imprisoned artists are acquired/displayed. Biographical plaques might omit or neutrally state facts, solely focusing on the work's formal qualities and context within the *artistic* tradition. Suppression algorithms based on artist morality are scrapped.
      *   **Dead Artists:** No change from *current* historical display practice. The plaque remains factual/art-historical.
      *   **Institutional Risk:** Massive potential backlash for "supporting" living criminals. Requires immense courage or profound commitment to the principle.
      *   **Result:** Consistent treatment across media and time, based *solely* on perceived artistic merit, decoupled entirely from creator morality.

  2.  **Universal Moralism (Serious Wrongdoing ALWAYS Diminishes Value):**
      *   **Living Artists:** Current suppression/demonetisation practices continue and likely intensify.
      *   **Dead Artists:** Works by artists known for "genuinely awful things" (slavery, murder, abuse, Nazism etc.) are *removed from permanent display*. They might be put in storage, shown only in highly critical, contextualising exhibitions explicitly about art and evil, or accompanied by extensive, condemnatory commentary – not a small neutral plaque. The *value* of the work is seen as permanently diminished by the moral flaw.
      *   **Mediums:** Consistent application – morally tainted films would be removed/deprioritised as rigorously as music or new acquisitions.
      *   **Institutional Impact:** Major upheaval. Museums lose cornerstone works. Streaming libraries shrink significantly. Requires massive historical reassessment and de-canonisation. Forces institutions into constant moral arbitration across centuries.
      *   **Result:** Suppression/deplatforming applied universally, regardless of time elapsed or artist's life status, based solely on the severity of the moral failing and its perceived inseparable link to the work's value.

  ### Conclusion
  The current institutional pattern isn't driven by a deep, consistent aesthetic philosophy like contextualism or autonomism. It's primarily **risk-managed pragmatism**, selectively applying principles like "moral contagion" and "historical cleansing" based on:
  *   **The artist's living status** (direct benefit, current outrage).
  *   **Perceived medium vulnerability** (music = personal, film = complex/corporate).
  *   **Commercial/PR cost** of action vs. inaction.
  *   **The weight of historical canonisation**.

  It's philosophically underdetermined – several theories can *explain* it, but none *justify* it consistently. Adopting either radical autonomism or universal moralism would force massive, uncomfortable changes, exposing the current compromise as the convenient, inconsistent muddle it really is. The small plaque for the dead monster and the algorithm suppressing the living one isn't philosophy; it's institutional self-preservation wearing an aesthetic fig leaf.
