prompt: |-
  I run a philosophy grad seminar — about 10 people, one 75-min session. I want a simulation that makes them feel self-locating belief in there bones, not just solve Sleeping Beauty on paper. The twist: run it as a group protocol where each student might be in one of two "waking slots" (Monday/Tuesday analog) with identical public rules, but they can talk and negotiate before placing small point-bets. The rules should be arranged so each person's rational credence about which slot they're in clashes with what the group can treat as common knowledge, and they have to agree on a payout split despite that. They should hit the coordination failure themselves — agree on the protocol, then still fail to align on the bet — and only after do we name what's going on.

  Design the full runnable activity: setup, materials and roles, the betting/payoff rules, a timeline broken down by minutes, and a debrief that maps the key moments onto de se vs de dicto reasoning and where the shared-evidence assumption cracks. Be honest about which feature of the philosophical problem this can't reproduce (probably the pure single-agent indexical). Also tell me what will predictably go wrong the first time I run it and how to handle it.

  Please respond with a JSON object with these fields: "setup_summary", "materials_and_roles", "betting_and_payoff_rules", "timeline_by_minutes", "predicted_first_run_failures", "debrief_mapping", "honest_limitation", "niche_twist_explanation". Each value should be a string describing that part.
reasoning: |-
  We are designing a simulation for a philosophy grad seminar to illustrate the Sleeping Beauty problem and the tension between individual and group reasoning in self-locating beliefs.

  The core idea: 
  - Each student (about 10) will be in one of two "waking slots" (like Monday and Tuesday in Sleeping Beauty). 
  - The setup is such that from each individual's perspective, they have a certain credence about which slot they are in, but the group has to coordinate on a bet about the global state (which includes the distribution of slots). 
  - We want them to agree on a protocol for betting and then experience a coordination failure because their individual credences clash with what the group collectively knows.

  We'll have:
  - A "coin flip" (or some random event) that determines the "global state". Let's say two possible global states: HEADS or TAILS.
  - In each global state, the students are assigned to two types of "slots": A and B. But the distribution depends on the global state.
  - The twist: in one state (say HEADS), most students are in slot A and few in slot B. In the other state (TAILS), the distribution is more balanced. This is to create a situation where the individual evidence (being in a slot) gives a different credence than the group's ability to reason about the overall distribution.

  Specifically, let's design the assignment:
  - There are 10 students. We need two slots: A and B.
  - Global state HEADS: 8 students in slot A, 2 in slot B.
  - Global state TAILS: 5 in slot A, 5 in slot B.

  Each student, upon "waking" (i.e., starting the activity), is told which slot they are in (A or B). But they do not know the global state (HEADS or TAILS). They also know the setup.

  The group knows:
  - The coin is fair: P(HEADS)=P(TAILS)=0.5.
  - The assignment rules as above.

  Now, we want a betting setup that forces a conflict between individual and group reasoning.

  The bet:
  - The group must collectively bet on whether the global state is HEADS or TAILS.
  - They can discuss and agree on a betting strategy (how to split their bets) before the coin is flipped and assignments are made? But note: the assignment happens after the coin flip, so they don't know their slot when they agree on the strategy. However, we want them to experience the conflict during the bet placement after they know their slots.

  So let's break the timeline:

  1. First, the group discusses and agrees on a betting protocol. They know the rules of the game (the assignment distributions) and that each will be assigned to a slot after the coin flip. They must agree on how they will bet as a group. Since they are a group, they might try to maximize group payoff.

  2. Then, the coin is flipped (by the instructor) and the assignments are made (privately, each student is told their slot). 

  3. Now, with their individual slot information, they must place bets. But they have to coordinate: the group must collectively decide how to bet. However, each student might have a different opinion based on their slot.

  We want a situation where:
  - If a student is in slot B, they have strong evidence for TAILS (because in HEADS, B is rare). Specifically in HEADS: P(B)=2/10, in TAILS: P(B)=5/10. So if a student is in B, they should think P(TAILS|B) = [P(B|TAILS)*P(TAILS)] / [P(B|TAILS)*P(TAILS) + P(B|HEADS)*P(HEADS)] = (0.5 * 0.5) / (0.5*0.5 + 0.2*0.5) = (0.25) / (0.25+0.1) = 0.25/0.35 ≈ 0.714. So they are about 71% sure of TAILS.

  - If a student is in slot A, they should think: P(HEADS|A) = [P(A|HEADS)*P(HEADS)] / [P(A|HEADS)*P(HEADS) + P(A|TAILS)*P(TAILS)] = (0.8*0.5) / (0.8*0.5 + 0.5*0.5) = (0.4) / (0.4+0.25) = 0.4/0.65 ≈ 0.615. So about 61.5% sure of HEADS.

  But the group as a whole, if they could aggregate their evidence, would know the exact global state. However, they are not allowed to reveal their slot assignments? That's key: we don't want them to reveal their slots because that would trivialize the problem. They have to coordinate without revealing their private information.

  So the challenge: they must agree on a betting strategy that uses their private information without revealing it. But they can discuss and try to come up with a plan.

  We can set up a betting market or a voting mechanism? But we want them to place bets that have monetary (point) consequences.

  Alternatively, we can have each student contribute a fixed amount (say 10 points) to a group pool. Then the group as a whole must decide how to bet the entire pool. They can bet on HEADS or TAILS. If they are right, they double the pool and split equally. If wrong, they lose the pool. But the problem: how do they decide? They must vote or reach consensus? But if they vote, the majority might be wrong because of the distribution of slots.

  Alternatively, we can have each student bet individually, but then the payouts are individual. However, we want a group coordination aspect. So let's make it that they have to agree on a single group bet.

  But the instructor can force them to reach consensus on the group bet. They can discuss but without revealing their slot.

  So the rule: during the bet placement phase, they can talk but they cannot say what slot they are in. They can only express opinions about what the group should do.

  Now, what will happen? The students in slot A (who are more likely to be in the majority) will push for betting on HEADS, and those in slot B will push for TAILS. But in the group, the number of students in each slot depends on the global state. 

  - In HEADS: 8 A and 2 B -> the 8 A will outvote the 2 B and the group will bet on HEADS (correct).
  - In TAILS: 5 A and 5 B -> a tie? How do they break it? They might flip a coin? But if they bet on HEADS, they lose; if they bet on TAILS, they win.

  In TAILS, the 5 A want HEADS and the 5 B want TAILS. If they have to reach consensus, they might fail. But we can require majority vote. In case of a tie, the instructor can have a rule: the bet is placed randomly? Or they can have a designated tie-breaker? But that might not be satisfactory.

  Alternatively, we can change the assignment to avoid ties. For example, in TAILS, let it be 6 in A and 4 in B? Then:

  - HEADS: 8 A, 2 B
  - TAILS: 6 A, 4 B

  Now, if a student is in A:
    P(HEADS|A) = (0.8*0.5) / (0.8*0.5 + 0.6*0.5) = 0.4 / (0.4+0.3) = 0.4/0.7 ≈ 0.571 (57.1% HEADS)
  If in B:
    P(TAILS|B) = (0.4*0.5) / (0.4*0.5 + 0.2*0.5) = 0.2 / (0.2+0.1) = 0.2/0.3 ≈ 0.667 (66.7% TAILS)

  But note: in TAILS, there are 6 A and 4 B. So the majority will be A (6) who have a slight bias for HEADS (57.1%) but not very strong. They might be persuaded by the B's? But the B's are more confident in TAILS.

  Now, the group must agree on one bet. If they vote, in HEADS: 8 A and 2 B -> bet HEADS (correct). In TAILS: 6 A and 4 B -> the A's will outvote and bet HEADS (but that's wrong). So in TAILS, the group will lose.

  But that is the coordination failure: the group bet is wrong in TAILS because the majority (A) is biased by their individual evidence, but the group as a whole could have known that if they had aggregated the evidence, they would see they have 6 A and 4 B, which only happens in TAILS. But they don't know that because they don't reveal their slots.

  So the debrief: when they see that in TAILS they bet HEADS and lost, they realize that if they had shared their slots, they would have known it was TAILS. But they didn't because of the rules.

  This maps to Sleeping Beauty: the individual beauty on a waking has a certain credence (in the classic problem, 1/3 for heads when woken) but if they could aggregate multiple wakings, they would know the coin flip? But in Sleeping Beauty, there is only one agent. So the limitation: we have multiple agents, but the self-locating belief is about which "waking" (slot) they are in, and the group has to reason about the global state without knowing the full distribution.

  Now, the betting and payoff rules:

  - Each student contributes 10 points to a group pool. So total pool: 100 points.
  - The group must bet the entire pool on either HEADS or TAILS.
  - If they bet correctly, they get 200 points (double) and split equally: each gets 20 points.
  - If they bet incorrectly, they lose the pool: each gets 0.

  But note: in the case of HEADS, they win and each gets 20. In TAILS, they lose and get 0. But in TAILS, they have 10 people, so they lose 10 points each. In HEADS, they gain 10 each. But the problem: they might not feel the loss if they don't have a stake? We can use points that matter for the course (like bonus) or just for learning.

  Alternatively, we can have individual bets? But we want group coordination.

  Another idea: let the group decide how to split the bet? They can bet a fraction on HEADS and a fraction on TAILS. Then they have to agree on the split. They might try to use a mechanism that reflects their individual credences. For example, each student says what fraction of the pool should be bet on HEADS. Then the group takes the average? But that might lead to a split that doesn't maximize group utility.

  But we want them to experience the conflict and then the failure. The failure we predict: in the TAILS case, the group will bet mostly on HEADS because the majority (A) are slightly in favor of HEADS. But then they lose.

  So let's stick with the group having to choose one bet (all or nothing on one outcome) by majority vote. And in the case of a tie, flip a coin? But with 10 students, we can avoid ties by having an odd number? Or we can have the instructor as a tie-breaker? Or just let them discuss until they reach consensus? But consensus might be hard.

  To save time, we can have voting. The rule: they vote by secret ballot? Or show of hands? But we don't want them to reveal their slots. So they can just vote for HEADS or TAILS without explanation? Or they can discuss without revealing slot.

  But the discussion might be constrained: they can say "I think we should bet on HEADS because ..." but without saying "I am in slot A".

  Let's design the timeline:

  Total: 75 minutes.

  1. Setup and explanation: 10 min.
  2. Group discussion to agree on the betting protocol (how they will decide as a group after they get their slots): 10 min.
  3. The instructor flips a coin (or uses a RNG) to determine the global state (HEADS or TAILS). Then assigns slots according to the state (using the assignment rules). This is done privately: each student gets a note with their slot. (5 min)
  4. Bet placement phase: the students discuss (without revealing their slot) and then vote to decide the group bet. (15 min)
  5. The instructor reveals the global state and the assignments. Then calculates the payout. (5 min)
  6. Debrief: 30 min.

  But step 2: they agree on the protocol. They might decide to vote by majority, or they might come up with a more clever mechanism. We don't want to force the mechanism? But we can suggest that they have to reach a group decision without revealing their slots.

  Predicted first run failures:
  - Students might accidentally reveal their slot during discussion. How to handle: remind them the rule is not to reveal. If they do, you might have to restart or note it and continue.
  - They might not understand the assignment rules. Solution: provide written rules and go over them carefully.
  - In the TAILS state, they might not reach a decision in 15 minutes. Solution: have a timer and if they don't decide, they forfeit the bet (lose the pool). Or force a vote at the end of 15 min.

  Debrief mapping:

  Key moments:
  - When they agree on the protocol: they are setting up the rules of coordination (de dicto: they agree on a general procedure).
  - When they get their slots: they now have de se beliefs (I am in A, so I think HEADS is more likely).
  - The discussion: they try to persuade each other without revealing their private information. This is where the shared evidence (the setup and the coin flip probability) is common, but the private evidence (their slot) is not shared. The group must reason de dicto about what the group should do, but each individual is reasoning from their de se perspective.
  - The voting: the majority vote leads to a decision that may not be optimal because it doesn't aggregate the private information. In TAILS, they bet HEADS and lose, which is a failure. This is because the shared-evidence assumption (that they all know the same things) is false: they have different private evidence.

  Honest limitation: 
  - In the original Sleeping Beauty, it's a single agent who is woken multiple times. Here we have multiple agents, each experiencing one "waking". So the indexical "this waking" is distributed across multiple agents. The pure single-agent indexical is not reproduced because each agent only experiences one slot.

  Niche twist explanation: 
  The activity forces the group to confront the gap between individual rational credence and the group's ability to act on aggregated evidence. By disallowing revelation of the private slot, we simulate the private nature of self-locating evidence. The coordination failure in TAILS (when they bet HEADS) illustrates that what is rational for the individual (e.g., an A student favoring HEADS) is not optimal for the group when the distribution of private evidence is itself evidence about the global state.

  Now, let's write the JSON.

  Note: We have 10 students. We use:
  - HEADS: 8 A, 2 B
  - TAILS: 6 A, 4 B

  But we need to assign the slots randomly. The instructor can do this by drawing names from a hat? Or using a random assignment tool.

  Materials: 
  - Coins or RNG for global state.
  - Slips of paper for slot assignments.
  - Voting ballots? Or just a show of hands? But we don't want them to know who voted what? Actually, it doesn't matter because they don't reveal slots. But to avoid pressure, secret ballot.

  But to save time, we can have open voting? Or just consensus by discussion.

  Alternatively, we can have them write down their vote and then the instructor collects and counts.

  Now the JSON fields:

  1. setup_summary: 
     "A fair coin is flipped to determine the global state: HEADS or TAILS. In HEADS, 8 students are assigned to slot A and 2 to slot B. In TAILS, 6 are assigned to slot A and 4 to slot B. Each student is privately told their slot. The group must collectively bet on the global state by contributing to a group pool and deciding on a single bet (HEADS or TAILS) without revealing their slot assignments. The goal is to illustrate the tension between individual credences (based on their slot) and the group's ability to aggregate evidence."

  2. materials_and_roles:
     - Instructor: explains rules, flips coin, assigns slots, facilitates.
     - Students: 10 participants. Each receives a private slot assignment and participates in group discussion and voting.
     - Materials: Coin (or RNG), slips of paper for slot assignments (10 per run), whiteboard for rules, voting ballots (optional), timer.

  3. betting_and_payoff_rules:
     "Each student contributes 10 points to a group pool (total 100 points). The group must bet the entire pool on either HEADS or TAILS. After the coin flip and slot assignment, students discuss without revealing their slot. They then vote by secret ballot to decide the bet (majority wins; tie broken by coin flip). If the bet is correct, the pool doubles (200 points) and is split equally among all (20 points each). If incorrect, the pool is lost (0 points each)."

  4. timeline_by_minutes:
     "0-10: Setup and rules explanation.
     10-20: Group discussion to agree on betting protocol (how they will decide after assignments).
     20-25: Instructor flips coin, determines state, and privately assigns slots (slips of paper).
     25-40: Students discuss (without revealing slot) and vote to decide group bet.
     40-45: Instructor reveals state and assignments, calculates payout.
     45-75: Debrief and discussion."

  5. predicted_first_run_failures:
     "1. Students may accidentally reveal their slot during discussion. Handle by gentle reminder and restarting discussion if necessary.
     2. Group may deadlock in TAILS state due to 6-4 split and fail to vote. Handle by enforcing a time limit and then requiring a vote.
     3. Confusion about the assignment rules. Handle by providing written rules and a chart: HEADS: 8A/2B, TAILS:6A/4B.
     4. In voting, tie in TAILS? Actually 6-4 avoids tie. But if absentees, adjust. Have the instructor break ties if needed."

  6. debrief_mapping:
     "Agreeing on protocol: de dicto reasoning about group procedure.
     Receiving slot assignment: de se belief formation (each forms credence based on their slot).
     Group discussion: attempt to reconcile de se beliefs into de dicto group action without sharing private evidence; shared evidence (setup, coin fairness) is common, but private evidence (slot) is not.
     Voting and outcome: in TAILS, group bets HEADS (due to majority A's) and loses, illustrating coordination failure. This shows that the group's de dicto decision (based on majority) fails to account for the aggregated de se evidence (the distribution of slots, which is only known privately). The shared-evidence assumption (that all evidence is common) cracks because the private evidence is not shared."

  7. honest_limitation:
     "The original Sleeping Beauty problem is about a single agent's self-locating belief across multiple potential awakenings. This simulation uses multiple agents to mimic the multiple 'awakenings', but each agent experiences only one slot. Therefore, the pure indexical 'I' in the single-agent case is not fully captured. The simulation highlights group coordination with private evidence, but cannot reproduce the subjective first-person uncertainty of a single agent who might be awakened multiple times."

  8. niche_twist_explanation:
     "The twist lies in the group coordination requirement and the ban on revealing private slots. This forces students to confront the gap between their individual rational credence (which depends on their slot) and the group's rational action (which would require knowing the slot distribution). The predictable failure in the TAILS state (where the group bets HEADS) makes the problem visceral, as students see that their individual reasoning, while rational, leads to a suboptimal group outcome when aggregated by voting. This failure is then mapped to the philosophical concepts in debrief."
