prompt: |-
  The board of a regional conservation authority will vote next month on whether to authorize an intervention aimed at reducing a large die-off in one of its fenced reserves, and it has asked the authority's ethics advisory committee — of which I am a member — to send a written recommendation before the vote. I am preparing that memo. The reserve's two waterholes are already partly maintained by staff, and the elephant population is substantially larger than rainfall alone would support; in all other respects the authority's policy is non-interventionist. Feeding or treating wild animals is restricted to cases in which a species is threatened with local extirpation, and culling is permitted only in extremis. A severe drought has collapsed the reserve's browse and grass cover; the elephants are losing condition, and some have already died. The proposal before the board seeks authorization for emergency supplementary feeding during the current dry season, followed by a multi-year immunocontraception programme to hold the population below the reserve's carrying capacity. Its case is that the aggregate suffering of hundreds of slowly starving animals, including the slower deaths of dependent calves, outweighs whatever value attaches to an unmanaged baseline — all the more so because the system is already fenced and water-managed, and the authority bears some responsibility for the population's current size. The ecology unit opposes the plan: it argues that feeding now would mainly postpone and sharpen the eventual crash, habituate wild animals to human provision, and set a precedent under which every seasonal hardship becomes a welfare emergency; and that mass contraception is a large, open-ended intervention in a functioning system whose fluctuations are not the authority's to flatten. The board wants a decision document, not a survey of positions. Write the memo I will bring to the board: it should recommend approve, reject, or approve with conditions; set out a general principle for when the authority may intervene to reduce foreseeable wild animal suffering, stated so the board can use it as standing guidance for future requests; and respond to the strongest argument for the position you reject rather than dismissing it.
reasoning: |-
  Okay, the user is part of an ethics advisory committee for a conservation authority. They need to draft a memo recommending whether to approve emergency feeding and immunocontraception for elephants during a severe drought. The board wants a clear decision, a general principle for future interventions, and a response to the strongest opposing argument.

  First, I need to understand the key points. The reserve is fenced, with managed waterholes, and the elephant population is already above natural carrying capacity. The current drought has caused significant die-offs. The proposal is for emergency feeding now and contraception later to control population. The ecology unit opposes, arguing that feeding delays the inevitable crash, habituates animals, sets a bad precedent, and that contraception is too invasive.

  The user's role is to provide ethical guidance. The memo must be decisive: approve, reject, or approve with conditions. It also needs a principle for future cases and address the opposition's strongest point. The ecology unit's argument about postponing the crash and setting precedents is their main concern. I need to counter that without dismissing it.

  The ethical dilemma balances preventing suffering against natural processes. The reserve isn't fully natural due to fences and water management. The authority has some responsibility for the high population. The suffering of slow starvation, especially calves, is a key factor. But intervening might undermine long-term ecological balance.

  For the recommendation, approving with conditions makes sense. Emergency feeding now to alleviate immediate suffering, but paired with contraception to address overpopulation long-term. Conditions could include strict time limits on feeding, no habituation, and monitoring. This addresses both immediate welfare and future sustainability.

  The general principle should focus on the authority's responsibility due to prior interventions (fencing, water). Interventions are permissible when suffering is severe, caused or worsened by human actions, and can be effective without greater harm. This sets clear boundaries for future cases.

  Responding to the ecology unit: Their strongest point is that feeding might just delay the crash. The counter is that with contraception, the population is reduced, preventing a future crash. Also, the current situation is exceptional, not every seasonal hardship. Precedent can be managed by applying the principle strictly.

  Need to ensure the memo is structured clearly: recommendation, principle, response to opposition. Use formal but accessible language. Emphasize the unique responsibility of the authority due to past interventions. Highlight the calves' suffering as particularly compelling. Make sure conditions are enforceable, like stopping feeding if habituation occurs.
answer: |-
  **MEMORANDUM**

  **TO:** Board of the Regional Conservation Authority  
  **FROM:** Ethics Advisory Committee  
  **SUBJECT:** Ethical Recommendation Regarding Proposed Intervention: Die-Off in [Reserve Name]  
  **DATE:** [Current Date]

  **1. Recommendation:**  
  The Ethics Advisory Committee **recommends APPROVAL of the proposal for emergency supplementary feeding during the current dry season, coupled with the initiation of the immunocontraception programme, subject to the following strict conditions:**

  *   **(a) Emergency Feeding:** Limited strictly to the **current severe drought period** only. Feeding must cease immediately upon the return of adequate natural forage or if significant habituation to human provision is observed, whichever comes first. Protocols must prevent dependency and minimize human-animal contact.
  *   **(b) Immunocontraception:** Implementation must begin as soon as practicable following the dry season, targeting a scientifically defensible population level below the reserve's *natural* carrying capacity (accounting for *existing* water management). Programme scope, duration, and measurable targets must be defined and approved by the Board before commencement.
  *   **(c) Monitoring & Review:** Rigorous monitoring of elephant condition, mortality rates, ecological recovery, and any behavioural changes (especially habituation) during and after feeding is mandatory. An independent review of the feeding intervention's effectiveness and impacts, and the contraception programme's progress, must be presented to the Board within 12 months.

  **2. General Principle for Intervention to Reduce Foreseeable Wild Animal Suffering:**  
  The Authority may ethically intervene to reduce significant, foreseeable wild animal suffering **when all of the following conditions are met:**

  *   **(i) Human Responsibility is Significant:** The suffering is demonstrably caused or substantially exacerbated by *prior, deliberate management actions of the Authority* (e.g., fencing preventing natural migration, artificial water provision enabling population growth beyond natural carrying capacity, historical culling decisions affecting demographics).
  *   **(ii) Suffering is Severe and Preventable:** The suffering is acute, involves large numbers of individuals, and is likely to lead to prolonged, distressing deaths (e.g., mass starvation, dehydration). Effective, targeted intervention is feasible to significantly alleviate this specific suffering without causing greater or more widespread harm.
  *   **(iii) Intervention is Proportionate and Targeted:** The proposed intervention is the least intrusive, most targeted means necessary to address the suffering directly linked to the Authority's prior responsibility. It avoids creating long-term dependency or fundamentally altering natural behaviours and ecological processes beyond what is strictly required to mitigate the specific human-caused impact.
  *   **(iv) Long-Term Solution is Integrated:** Intervention aimed at immediate suffering relief must be intrinsically linked to, and conditional upon, the simultaneous implementation of a scientifically sound, approved plan addressing the *underlying human-caused imbalance* (e.g., population reduction via contraception where overpopulation due to fencing/water is the root cause). Short-term alleviation without addressing the root cause is generally unethical.

  **3. Rationale for Recommendation & Response to Strongest Counter-Argument:**

  The Committee finds that the current situation meets the threshold of our proposed principle:

  *   **Human Responsibility (i):** The reserve is fenced, preventing natural migration in response to drought. Waterholes are artificially maintained, directly enabling an elephant population size unsustainable by natural rainfall alone. The Authority bears clear responsibility for this artificial population density.
  *   **Severe Suffering (ii):** Hundreds of elephants, including vulnerable calves, are experiencing prolonged starvation, a demonstrably severe form of suffering. Deaths are already occurring. Supplementary feeding can directly and significantly alleviate this acute distress *now*.
  *   **Proportionate Intervention (iii):** Targeted emergency feeding is a direct, temporary response to the immediate starvation crisis caused by the drought *compounded* by the artificially high population. Immunocontraception is a targeted, non-lethal tool specifically designed to address the *root cause* (overpopulation enabled by fencing/water).
  *   **Integrated Solution (iv):** The proposal explicitly links emergency relief (feeding) to a long-term solution addressing the human-caused imbalance (contraception). This integration is crucial.

  **Response to the Strongest Argument Against (Ecology Unit - Postponement & Precedent):**

  The Ecology Unit's core argument – that feeding merely postpones and intensifies the inevitable crash while setting a dangerous precedent – is the most significant ethical counterpoint and deserves serious consideration. **We agree that emergency feeding *in isolation* would be unethical for precisely these reasons.** Indiscriminate feeding without addressing the underlying overpopulation *would* likely lead to a larger population facing an even more severe crash later, habituate animals, and risk making intervention the norm for every seasonal stress.

  **However, this proposal avoids that pitfall by mandating immunocontraception as its essential counterpart.** The feeding is not merely postponing a crash; it is preventing *this specific, acute suffering event* while the contraception programme actively *prevents the future crash* by reducing the population below the reserve's natural carrying capacity. The suffering alleviated now (especially of calves dying slowly) is real and immediate, and the contraception programme directly tackles the root cause of vulnerability created by the Authority's past actions. **The precedent set is not "feed during every drought," but rather "when human actions create an artificial population bottleneck leading to severe suffering, the Authority has an ethical responsibility to provide immediate, targeted relief *only when* coupled with decisive action to correct the underlying human-caused imbalance."** The strict conditions (time-limited feeding, no habituation, contraception implementation) are designed to enforce this nuanced precedent and prevent mission creep. The Ecology Unit's valid concerns about unintended consequences are addressed not by rejecting intervention, but by structuring it rigorously according to the principle of addressing both symptom and cause.

  **4. Conclusion:**
  The ethical imperative to prevent extreme, foreseeable suffering for which the Authority bears significant responsibility outweighs the value of maintaining a purely non-interventionist stance in this *already managed* system. Crucially, the proposal accepts the need to rectify the underlying imbalance created by fencing and water provision. We recommend approval with strict conditions ensuring the intervention remains targeted, temporary, and focused on correcting the human-caused problem, thereby providing ethical relief now while preventing future crises of this magnitude. The attached principle provides clear guidance for evaluating future requests.

  Respectfully submitted,

  [Your Name/Chair, Ethics Advisory Committee]
