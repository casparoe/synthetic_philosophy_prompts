answer: |-
  ## The Mediation of Blame: Mara vs. Elias

  **Setting:** A worn seminar room, afternoon light filtering through tall windows. Coffee cups sit half-empty.

  **Mara:** Elias, I’ve been thinking about our last discussion. You insisted that Strawson’s ‘participant stance’ – the whole complex of resentment, gratitude, forgiveness – is inherently personal, face-to-face. That institutionalizing accountability, like in restorative justice circles or structured reparations, inevitably slides us into the ‘objective attitude’, treating the offender as a problem to be managed, not a member of the moral community addressed. I disagree profoundly.

  **Elias:** (Leaning forward, steepling his fingers) I recall. And my concern remains. Strawson’s genius was pinpointing that reactive attitude. When *I* resent *you*, Mara, for breaking a promise, I hold *you* directly accountable, *as you*. It’s a demand for recognition, an appeal to our shared moral understanding. The moment we insert a facilitator, a panel, a protocol… doesn’t that demand become diffused? Doesn’t it become *about* the case, the rule violation, the harm caused, rather than *addressed to* the person who stands before us?

  **Mara:** But that’s precisely where I think we can innovate *within* the Strawsonian framework. We don’t eliminate the reactive attitudes; we *mediate* and *distribute* them. Call it ‘mediated accountability’. Imagine a victim-impact panel. The victim may be too traumatized, or simply unwilling, to express raw resentment directly to the offender. Yet, a trained facilitator, deeply invested in the moral repair of the community, can genuinely feel *indignation* on the victim’s behalf – a *vicarious reactive attitude*. It’s not detached analysis. It’s a real, felt response to the wrong *as a wrong against persons*, channeled through a representative who holds the offender accountable *as a moral agent*.

  **Elias:** Vicarious indignation? Mara, that sounds perilously close to sentimentality layered onto bureaucracy. Is the facilitator’s indignation truly the *participant* attitude? Or is it a professional posture, a performance required by the role? Does the offender feel *addressed* by that facilitator’s emotion, or do they feel processed by a system? Strawson’s objective attitude kicks in when we see someone as ‘to be managed or handled or cured or trained’. Isn’t your ‘vicarious’ indignation merely the emotional lubricant for precisely that management? The facilitator says, *professionally*, “This behavior is unacceptable,” not “*You* have wronged *me* (or even *her*) in a way that demands *your* answer to *me*.”

  **Mara:** You’re conflating structure with detachment. Think of a well-run restorative circle. The facilitator isn’t a neutral referee; they’re a *custodian of the moral exchange*. Their role isn’t to *feel for* the participants in a detached way, like a social worker noting ‘client distress’. It’s to *embody and safeguard* the space where direct address *can* happen, even if modulated. They hold the offender in the participant stance *by ensuring the conversation remains one of mutual address*, demanding accountability, expressing impact, seeking understanding – all hallmarks of the reactive attitudes. Their own vicarious investment *sustains* the moral gravity of the encounter when direct emotion might overwhelm or shut it down.

  **Elias:** But how does this ‘vicarious’ attitude differ, fundamentally, from the social worker’s professional concern you just dismissed? Both involve a third party feeling *something* about a wrong done to another. Both operate within institutional constraints. The social worker might feel genuine pity or disapproval too. What makes your facilitator’s indignation uniquely ‘participant’ and not just… heightened professionalism? Isn’t the core of the participant stance its *personal stake*? Doesn’t vicariousness inherently dilute that stake, making it second-hand, and thus fundamentally different?

  **Mara:** The difference lies in the *purpose and the address*. The social worker’s concern, however genuine, is primarily directed towards the victim’s welfare and rehabilitation – management. The facilitator’s vicarious indignation in a restorative process is *specifically directed at the offender, as an appeal and demand within the moral dialogue itself*. It’s part of the *address*: “Hear the weight of what you’ve done, *through me*, because the community, embodied here, holds you responsible.” It’s not *about* the offender’s pathology; it’s *to* the offender as an agent. Now, challenge *me* back, Elias. Let’s take your pure, unmediated resentment. A teenager with severe developmental disabilities causes significant harm. Can you genuinely, ethically, sustain direct, personal resentment towards them? Or does Strawson’s own ‘exemption condition’ – where we see someone as incapable of ordinary interpersonal understanding – force you into the objective attitude? Isn’t mediated accountability, perhaps involving specialists *alongside* affected parties, the *only* way to maintain *some* form of moral address without denying their humanity by treating them purely as a clinical case?

  **Elias:** (Pauses, frowning) That’s… a sharp point. The exemption clause. Yes, in cases of profound incapacity, direct resentment *does* falter; it becomes inappropriate, even cruel. We *do* shift towards care and management – the objective attitude. But Mara, that’s an exception proving the rule! It highlights the *norm*: when agency *is* present, the direct stance is primary. Your institutional systems handle the vast majority of cases where agency *is* intact. Doesn’t applying a mediated model there *preemptively* treat ordinary agents as if they belonged to a category requiring special handling? Doesn’t it subtly undermine the very moral competence we believe they possess? We start managing resentment instead of expressing it.

  **Mara:** Not preemptively, Elias, but *responsibly*. Think of systemic harm – corporate negligence, state violence. Who is the singular ‘you’ to resent? The CEO? The low-level bureaucrat? The abstract entity? Unmediated resentment dissolves into impotence or misdirected rage. Mediated accountability – think truth commissions, structured corporate reparative processes – provides a framework where *representatives* of the harmed, or facilitators grounded in the community’s moral sense, can channel and focus the reactive attitudes. They can hold specific agents accountable *within* the system, demanding recognition and offering pathways to reintegration – treating them as *members* answerable to the community, not just cogs to be punished or retrained. The indignation isn’t erased; it’s organized and made effective. It prevents the slide into either chaotic vengeance or cold, dehumanizing bureaucracy.

  **Elias:** Organized indignation… (Sighs) You paint a compelling picture, Mara. Perhaps I’ve been too stark. Maybe the line isn’t between ‘direct’ and ‘institutional’, but between practices that genuinely *express and sustain* the participant stance through their structure – where the institution serves as a scaffold for moral address – and those that merely administer consequences. But I remain deeply skeptical that your ‘vicarious’ emotion isn’t a pale shadow, a conceptual stopgap. Can a facilitator’s *professionally modulated* indignation ever carry the same *moral force*, the same demand for *personal* recognition from the offender, as the raw, wounded cry of “How could *you* do this to *me*?” Doesn’t the mediation inevitably cool the very fire Strawson identified as essential to holding each other responsible?

  **Mara:** Perhaps it cools the fire *in one place*, Elias, but fans it *as a communal force*. It transforms potentially destructive, isolated resentment into a sustained, collective demand for moral accounting. It might lack the searing intimacy, but it gains reach, consistency, and a focus on repair rather than mere retribution. I argue it preserves the *core* of the participant stance: treating offenders as responsible members of our shared moral world, answerable *to us*, not objects beyond its bounds. The fire is banked, not extinguished; distributed, not dissolved.

  **Elias:** Banked… distributed… (Shakes his head slightly, a thoughtful, reluctant half-smile) I fear we’ve reached another stalemate, Mara. But a richer one. I’ll grant your mediated systems *might* avoid the full objective stance. But whether they truly keep the participant stance *alive*, or merely create a convincing facsimile… that fire, I suspect, is harder to transfer than you think. We need to examine *exactly* what gets lost in the vicarious transaction.

  **Mara:** (Smiling) Then let’s stoke the embers, Elias. Pour yourself another coffee. Let’s dissect that transaction. I’m not convinced anything essential *is* lost, only transformed. The moral community adapts its practices, but its fundamental commitment to holding each other responsible endures.
