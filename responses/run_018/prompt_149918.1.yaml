  **THE INSTITUTE FOR PROPER FUNCTION RESTORATION (IPFR)**  
  **Patient Intake, Functionality Assessment & Informed Consent Packet**  
  **(Revision 9.3 - Per 2029 Brussels Protocol & Merger Compliance Directive α-7)**  

  **Section 1: Introduction & Mandatory Acknowledgment**  
  Welcome to IPFR. We restore *proper* organic function. This is distinct from mere operational adequacy. Your signature below confirms understanding that "function" is a rigorously defined ontological category at IPFR, subject to institutional policy (IPFR Ontological Standards Manual, OSM v.12.1). Failure to comply with documentation requirements may result in denial of service or post-procedural reimbursement disputes.  

  ☐ **1.1:** I acknowledge that IPFR adheres to a dual-track accreditation system for all implants (biological, bioengineered, or synthetic), governed by:  
      *   **(A) Etiological Validity (EV):** Function derived from documented historical selection pressures.  
      *   **(B) Systemic Contribution Integrity (SCI):** Function derived from current causal role within the integrated physiological system.  
      *   *(See Section 3: "Defining 'Proper Function' - A Primer for Patients").*  

  **Signature:** _____________________________ **Date:** ______________  

  **Section 2: Implant Type Selection & Preliminary Documentation**  
  Select your desired organ/implant category (check one primary, multiple secondary if applicable):  

  ☐ **2.1 Cardiothoracic (e.g., Heart, Lung)**  
  ☐ **2.2 Renal/Excretory (e.g., Kidney, Bladder)**  
  ☐ **2.3 Hepatic/Pancreatic**  
  ☐ **2.4 Neuromodulatory (e.g., Synthetic Pacemaker, Bioengineered Ganglion)**  
  ☐ **2.5 Other (Specify): ___________________________**  

  **WARNING:** Selection dictates subsequent documentation burden. Cardiothoracic & Neuromodulatory implants trigger mandatory **Section 4** compliance.  

  **Section 3: Defining 'Proper Function' - A Primer for Patients**  
  *   **3.1 Etiological Function (EV):** The *proper function* of an organ is the effect for which it was *historically selected* by natural processes (e.g., hearts pump blood *because* pumping blood conferred a fitness advantage ancestrally). An effect performed *without* this lineage is merely an *accident* or *capacity*, not a *proper function*.  
  *   **3.2 Systemic Contribution Function (SCI):** The *proper function* of an organ is the *causal role* it currently plays in sustaining the viability and organization of the organism as a whole (e.g., a structure contributes to systemic stability by pumping blood, irrespective of its origin).  
  *   **3.3 IPFR Policy:** IPFR recognizes both valid frameworks. However, coverage tiers, implant certification, and post-operative accountability differ significantly (See **Sections 4, 7, Appendix B**). Consultation with our integrated **Neo-Aristotelian Teleology Consultancy (NATC)** unit is recommended for complex cases (Billing Code: NATC-ASSESS).  

  **Section 4: Mandatory Etiological Validation (EV) Track - For Organs Requiring Historical Pedigree**  
  *(Required for all implants listed in Section 2.1 & 2.4 unless applying for **Section 7.1 Exception**)*  

  *   **4.1 Purpose:** To establish the bona fide *selected-effect history* of the proposed implant, ensuring its effects qualify as *proper functions* under the EV framework.  
  *   **4.2 Historical Lineage Verification (HLV):** Patient must provide documented evidence of the implant's evolutionary selection trajectory. Acceptable formats:  
      ☐ Peer-reviewed phylogenetic analysis (certified by IPFR-approved evolutionary biologist).  
      ☐ Fossil record correlation report (IPFR Paleontology Form P-44b).  
      ☐ Validated Synthetic Selection History (VSSH) dossier compliant with the **2029 Brussels Protocol on Synthetic Selection Histories** (Requires NATC pre-approval & notarization).  
      ☐ Certified lineage tracing for bioengineered tissues derived *exclusively* from etiologically validated source material.  
  *   **4.3 Lack of HLV:** Failure to provide satisfactory HLV documentation necessitates application under the SCI Track (**Section 7.1**), potentially affecting insurance coverage and ontological warranty (**Appendix B**).  

  **Section 5: Systemic Contribution Assessment (SCA) - Standard Pre-Implant Evaluation**  
  *(Required for ALL patients, regardless of chosen track)*  

  *   **5.1 Purpose:** To model the predicted causal role of the proposed implant within the patient's *current* integrated physiological system.  
  *   **5.2 Assessment:** IPFR physiologists will quantify the implant's projected contribution to systemic homeostasis, viability thresholds, and organizational coherence using IPFR-approved SCA matrices (Forms SCA-1 through SCA-9).  
  *   **5.3 Outcome:** Generates an SCI Score predicting functional adequacy. A low SCI Score may contraindicate implantation *even if perfect HLV is provided* (e.g., an etiologically valid heart predicted to fail pumping within the patient's specific system).  

  **Section 6: Consent for Ontologically Certified EV Implants**  
  *(Complete ONLY if proceeding with EV Track and HLV Satisfied - Section 4)*  

  *   **6.1 Warranty:** IPFR guarantees that the implanted organ possesses *Etiological Validity* (EV). Its effects are *proper functions* by virtue of its certified selection history.  
  *   **6.2 Limitation:** IPFR makes **NO** guarantee regarding the implant's *current* Systemic Contribution Integrity (SCI) within *your specific biological system*. It may fail to perform its historically selected effect (e.g., an etiologically valid heart may not pump effectively in *you*).  
  *   **6.3 Acknowledgment:**  
      ☐ I understand that EV certification guarantees historical pedigree, not present operational success.  
      ☐ I understand that functional failure does *not* negate the organ's *proper function* under the EV framework; it signifies a failure to *realize* that function within my system.  
      ☐ I waive claims against IPFR based solely on operational failure if HLV remains valid. (See **Appendix B: Refund Policy for Continuity Disputes**, Scenario A).  

  **Signature:** _____________________________ **Date:** ______________  

  **Section 7: The Systemic Contribution Integrity (SCI) Track & Exceptions**  

  *   **7.1 The System-Contribution Exception:** Patients may receive implants lacking satisfactory Etiological Validation (EV) if the Systemic Contribution Assessment (SCA) predicts high functional adequacy (SCI Score ≥ 85%). This includes:  
      *   Novel bioengineered organs without evolutionary precedent.  
      *   Synthetic implants (e.g., advanced mechanical pumps).  
      *   Organs with incomplete/unverifiable HLV.  
  *   **7.2 Mandatory SCI Waiver & Ontological Drift Acknowledgment:**  
      ☐ I understand this implant **lacks Etiological Validity (EV)**. Its effects (e.g., pumping blood) are considered *systemically contributory* but *not* historically selected *proper functions* under the EV framework.  
      ☐ I acknowledge this may constitute **"Ontological Drift"** – the assignment of function based purely on current causal role, decoupled from historical origin.  
      ☐ I understand that while the implant may perform adequately (high SCI), it occupies a distinct ontological category per IPFR OSM v.12.1 and NATC guidelines.  
      ☐ I waive claims asserting the implant possesses historical proper function. (See **Appendix B**, Scenario B).  
  *   **7.3 Insurance Note:** Coverage for SCI Track implants is often limited to 70% of base cost under most plans due to "Pedigree Deficiency" clauses. EV Track implants typically receive 95% coverage.  

  **Signature:** _____________________________ **Date:** ______________  

  **Appendix B: Refund Policy for Continuity Disputes**  
  Refunds or revisions are adjudicated based on the failure mode relative to the chosen accreditation track:  

  *   **Scenario A (EV Track Failure):** Implant possesses valid HLV (EV Certified) but fails to perform its selected effect (e.g., certified heart fails to pump).  
      *   *Outcome:* No refund for the ontological certification (EV remains valid). Patient may qualify for a **Partial System Integration Refund (PSIR)** up to 40% of implant cost, contingent on proof that failure stems solely from recipient-system incompatibility *not* foreseeable in SCA (**Section 5**).  
  *   **Scenario B (SCI Track Denial of Coverage):** Implant performs its systemic role adequately (High SCI Score verified post-op) but insurance denies coverage due to lack of EV (Pedigree Deficiency).  
      *   *Outcome:* IPFR will provide administrative appeal support based on SCI performance metrics. **No direct refund from IPFR.** Patient responsibility for uncovered costs stands.  
  *   **Scenario C (Misclassification):** IPFR incorrectly assigns an implant to EV or SCI track due to administrative error.  
      *   *Outcome:* Full refund or corrective re-implantation at IPFR expense. (Rare, requires Audit Committee review).  

  ---

  **FINAL PATIENT ACKNOWLEDGEMENTS**  

  ☐ I have read and understand the ontological distinctions between Etiological Validity (EV) and Systemic Contribution Integrity (SCI) as defined by IPFR policy.  
  ☐ I understand that choosing the EV Track prioritizes historical lineage over guaranteed present function, while the SCI Track prioritizes present functional role over historical lineage.  
  ☐ I understand IPFR's merger with the Neo-Aristotelian Teleology Consultancy (NATC) informs our rigorous application of functional categorization.  
  ☐ I accept that disputes regarding the "properness" of my implant's function will be resolved according to IPFR OSM v.12.1 and the terms outlined herein, not common vernacular or unverified philosophical leanings.  

  **Patient Signature:** _____________________________ **Date:** ______________  
  **IPFR Compliance Officer Signature:** _____________________________ **Date:** ______________  
  **NATC Liaison Initials:** _______ **(If Consulted)**  

  *(Submit completed packet to Intake Desk 7, Wing Delta. Allow 6-8 weeks for Ontology Review Board processing before scheduling.)*
