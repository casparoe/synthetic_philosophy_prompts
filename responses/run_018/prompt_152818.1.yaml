prompt: |-
  I am presenting a thesis on von Neumann's unfinished theory of self-reproducing automata, arguing that his notion of "surviving technology" is not a prediction of machine immortality but a structural claim: technological lineages achieve evolutionary independence from biological creators once they embed autonomous error-correction mechanisms, and consequently obsolete artifacts—specifically analog computing architectures—should be treated not as failed prototypes but as genuinely extinct evolutionary lineages with their own genotypic logic. The audience is a philosophy-of-technology workshop composed mainly of philosophers of biology who are fluent in evolutionary theory but skeptical about extending evolutionary vocabulary to artifacts, plus two historians of computing who know von Neumann's manuscripts well and are hostile to anachronistic singularity readings. Draft my Q&A preparation sheet: list the eight objections I will actually face, ordered by how damaging they are, each phrased in the vocabulary that audience uses—evolutionary ontology, artifact theory, or historiographic method. For each objection, specify what I should concede immediately, what I must hold, a reply calibrated for roughly two minutes, and the weakest point in that reply. Include the objection about analog computing extinction that I am hoping nobody raises. Finally, flag the precise structural feature of my argument—the genotype-phenotype distinction I apply to technological lineages—that, if collapsed, undermines the entire framing, and tell me how to defend it under direct attack without appealing to authority or citation.
