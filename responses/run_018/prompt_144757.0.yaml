answer: |-
  Here's a sharp, unsentimental reading of *The Metamorphosis* through your proposed lens of graduated moral status, pinpointing key moments and pushing back where necessary:

  **Mapping the Downward Shifts on the Gradient:**

  1.  **Loss of Speech & Communication:** This is the *first critical downgrade*. Gregor retains complex thoughts ("I have to get up, my train leaves at five") but cannot articulate them. His family hears only insectile noises ("That was an animal's voice," says his father). This instantly severs **social reciprocity** and signals a collapse of **cognitive continuity** *in their perception*. His inner life becomes irrelevant noise. Moral status plummets.

  2.  **The Apple Incident:** A brutal inflection point. Father pelts Gregor with apples, one embedding in his back. This isn't just neglect; it's *active aggression* based purely on appearance and perceived threat. The wound causes physical decay and constant pain, directly diminishing **affective range** – Gregor becomes consumed by suffering, narrowing his inner world. The family's shift from uneasy tolerance to viewing him as a dangerous pest marks a severe status drop.

  3.  **Refusal of Food & Rotting Debris:** This signifies the decay of **social reciprocity** and **affective range** *on Gregor's side*. He loses interest in milk (a human food) and later rejects all food, subsisting on scraps. His room fills with rubbish and dust. This isn't just neglect *by* the family; it's an erosion of Gregor's own connection to human needs and cleanliness, aligning his *behavior* more with vermin. The family sees this as confirmation of his non-human status.

  4.  **The Furniture Removal & "Couch" Confinement:** Grete insists on removing furniture to give him space to crawl, arguing he "can't possibly" need human things. This is the explicit denial of his **cognitive continuity**. Removing the writing desk, his last link to his human past/identity, confines him not just physically but *conceptually* to his insect form. His desperate clinging to the picture is the last gasp of his human affective connection, brutally rejected. His status is now firmly in the "pest" category.

  5.  **Final Neglect & Death:** Gregor is forgotten, his door left open only for ventilation. He starves amidst filth. His death isn't mourned; it's a relief. His physical form has dictated his status to the point where his existence is incompatible with their humanity. He hits rock bottom on their moral scale: less than a pet, equivalent to a parasite to be eradicated.

  **Inner Life vs. Appearance/Function:**

  *   Kafka relentlessly shows that **appearance and social function utterly override cognition** for the family (and ultimately, even for Gregor himself). His rich inner monologue – his anxieties, memories, love, shame – is *entirely invisible* to them. They interpret his actions solely through the lens of the insect body: his attempt to save the picture is an "attack," his presence is "contamination," his noises are threatening.
  *   The tragedy is precisely this: **His consciousness *is* morally relevant** (to the reader, and implicitly), **but it is rendered irrelevant by his form and consequent loss of function.** He cannot *perform* humanity (work, speak, care for others), so his inner humanity is discounted. Kafka suggests that moral status in society is conferred based on observable utility and conformity to expected forms, *not* on inherent subjective experience.

  **Where the Story Resists the Neat Gradient:**

  1.  **Gregor's Own Perception:** Gregor never *internally* accepts a lower moral status. He agonizes over his family's hardship, feels shame, tries to communicate. Even as his body betrays him, his consciousness remains stubbornly, tragically human. The gradient model is imposed *on* him, not within him. His persistent humanity makes the family's degradation of him more horrifying.
  2.  **The Lack of a "Higher" Animal Analogy:** Gregor isn't a dog or a chimp with recognizably complex mammalian emotions. He's an ambiguous, repulsive vermin. Kafka avoids making him sympathetic *through* animal qualities. This forces the question: Is *any* degree of sentience enough if the form is alien and useless? The story suggests the answer for most people is "no."
  3.  **The Speed and Completeness of the Collapse:** The transition isn't a slow slide down a scale. The loss of speech and the apple incident create near-instantaneous catastrophic drops. The family's capacity for moral consideration proves incredibly fragile, collapsing almost entirely once utility is gone and appearance becomes repellent. It's less a gradient descent and more a series of trapdoors.

  **What Kafka Adds Beyond Gradated Sentience:**

  Kafka exposes the **brutal social mechanics and emotional dishonesty** underlying moral status assignment:

  1.  **Utility is Paramount:** Gregor's value as a son/human was entirely tied to his function as breadwinner. Once he cannot work, his moral claim evaporates. Kafka shows how easily "moral status" masks economic dependency.
  2.  **Love is Conditional (and Fragile):** The family's initial care (feeding) is obligation mixed with horror. Their "affection" is contingent on Gregor's former function and form. Kafka strips away the illusion of unconditional love/family bonds in the face of radical uselessness and difference.
  3.  **The Violence of Perception:** It's not just that Gregor *is* lower status; he is *made* lower status through the family's interpretation of his body and actions. Kafka shows how moral status is actively constructed through perception and narrative (Grete's persuasive arguments for dehumanization).
  4.  **The Horror of Trapped Consciousness:** Philosophical debates about degrees often remain abstract. Kafka forces us to *live inside* the being whose complex inner life is rendered morally null by its vessel. It’s the existential nightmare of being unseen and unheard in your own mind.
  5.  **Appearance Trumps Sentience:** A purely sentience-based argument might grant Gregor high status due to his mind. Kafka brutally demonstrates that society will *always* prioritize the visible form and practical function. The repulsive body negates the inner world.

  **In essence:** Kafka uses the grotesque premise not to illustrate a neat spectrum of moral worth based on capacities, but to expose how easily society *abandons* any consideration of inner life when faced with uselessness, difference, and ugliness. The "gradient" exists, but it's a flimsy facade over a pit of indifference and self-interest, where the fall is swift and total once social function is lost. The philosophical horror isn't the metamorphosis; it's the speed and totality with which his humanity becomes invisible.
