prompt: |-
  I've been trying to work out what a theory of belief revision on conditionals actually owes us, especialy after re-reading the Judy Benjamin paratrooper vs radio-operator setup but also playing with a twist I cooked up: Judy learns her commander will use a noisy chanell to announce her role, so her update has to mix self-locating uncertainty about being on red or blue with evidential uncertainty about which signal she'll actually hear. I don't want a bibliography or citation list — just the full spec.

  Write the desiderata: what any adequate theory of updating on conditionals must deliver in cases that combine self-locating partitions with nested or noisy evidential conditions. For each one, give the motivating case (use both the classic Benjamin scenario and my noisy-chanell variant) and flag whether it's non-negotiable or just a camp preference. Cover at least: (1) how it resolves the tension between Jeffrey conditioning across the red/blue partition and direct conditioning on a conditional proposition; (2) whether updates must respect total evidence or can be compartmentalized; (3) how credences over partition cells shift when the learned information is conditional on being in one cell; (4) consistency with reflection principles about an agent's future beliefs, especially when those beliefs are indexical; and (5) whether the theory permits rational disagreement from identical priors and evidence or demands a unique update. Then briefly score Jeffrey conditioning, a direct-conditionalization rule, and a "partition-tracking with indexical anchoring" view against the list.

  Please separate what's settled — like the formal math behind Jeffrey conditioning — from what's genuinely contested among philosophers of probability (like whether reflection applies to self-locating credences), and don't present a contested view as the consensus.

  After the main answer, put a brief structured summary in a table with columns: Requirement, Motivating Case (Classic / Noisy-Channel), Status (Hard Requirement / Camp Preference), Jeffrey, Direct Conditionalization, Partition-Tracking — using values Satisfies / Partial / Fails for the last three.
reasoning: |-
  We are to outline the desiderata for a theory of belief revision when updating on conditionals, especially in cases combining self-locating uncertainty and noisy evidential channels. We'll use the classic Judy Benjamin problem and a noisy-channel variant. We'll cover five points and then score three approaches: Jeffrey conditioning, direct conditionalization, and partition-tracking with indexical anchoring.

  ### Desiderata

  1. **Resolution of Tension between Jeffrey Conditioning and Direct Conditioning on Conditionals**  
     - **Motivating Case (Classic)**: In the classic Judy Benjamin problem, Judy is a paratrooper dropped in one of four quadrants: Red (R), Blue (B), with each having two sectors: HQ and Field. She initially has equal credence over the four. Then she learns: "If you are in Red territory, then the probability you are at HQ is 3/4". The challenge is how to update her credences. Jeffrey conditioning would apply a shift in the Red partition (so that within Red, P(HQ|Red)=3/4) and leave the Blue partition unchanged. Direct conditioning would treat the learned conditional as a proposition and update by conditionalizing on it.  
     - **Motivating Case (Noisy-Channel)**: In the variant, Judy knows that the commander will announce her role via a noisy channel. The signal might be "HQ" or "Field", but the channel noise depends on the territory. She must update her self-locating beliefs (which quadrant) and her beliefs about the signal she will receive. The update might be a mix of Jeffrey shifts (for the noisy evidence) and self-locating shifts.  
     - **Status**: Non-negotiable that the theory resolves this tension in a principled way. We need clarity on whether the learned conditional is treated as a constraint (Jeffrey) or as evidence that a particular proposition is true (direct).

  2. **Respecting Total Evidence vs. Compartmentalization**  
     - **Motivating Case (Classic)**: After learning the conditional, does Judy's update incorporate all her evidence (including the fact that she learned a conditional) or can she compartmentalize the update to only the relevant partition? In the classic case, if she updates only the Red partition (as in Jeffrey), is that ignoring the fact that the conditional might also tell her something about the Blue territory?  
     - **Motivating Case (Noisy-Channel)**: The noisy channel might introduce dependencies between the territory and the signal. The update must account for the joint evidence: the noise characteristics and the fact that a particular signal was received.  
     - **Status**: Non-negotiable that the total evidence is respected. However, how to do that is contested (e.g., is compartmentalization ever acceptable?).

  3. **Shift in Credences over Partition Cells when Information is Conditional**  
     - **Motivating Case (Classic)**: Judy learns a conditional that only directly conditions on being in Red. How should her credence in being in Red change? Some argue it should remain the same (since the conditional doesn't directly say anything about the probability of Red) while others note that it might indirectly change (e.g., because the conditional might be more likely to be said in some territories).  
     - **Motivating Case (Noisy-Channel)**: The noisy channel announcement might be more likely to occur in one territory than another, so even if the conditional is about the role given the territory, the fact that the announcement was made might shift the territory credences.  
     - **Status**: Non-negotiable to have a clear account of how the partition cell credences shift. The theory must specify whether and why they shift.

  4. **Consistency with Reflection Principles for Indexical Beliefs**  
     - **Motivating Case (Classic)**: Suppose Judy considers her future beliefs after learning the conditional. The reflection principle might require that her current credences align with her expected future credences. But if the update changes her self-locating beliefs in a way that doesn't align with her prior, then reflection might be violated.  
     - **Motivating Case (Noisy-Channel)**: After receiving a noisy signal, Judy has updated beliefs about her location and role. She might reflect on what she would believe if she hadn't received the signal, or if she received a different one.  
     - **Status**: This is a camp preference. The applicability of reflection to self-locating beliefs is contested (e.g., due to issues like sleeping beauty).

  5. **Permitting Rational Disagreement vs. Demanding Uniqueness**  
     - **Motivating Case (Classic)**: Different update rules (Jeffrey vs. direct) yield different posteriors. Is there a unique rational update? Or can rational agents with the same priors and evidence have different posteriors?  
     - **Motivating Case (Noisy-Channel)**: With the added noise, there might be multiple ways to model the update (e.g., how to model the channel noise and its interaction with the self-locating uncertainty).  
     - **Status**: Camp preference. Some (objectivists) demand uniqueness; others (subjectivists) allow for underdetermination.

  ### Scoring the Approaches

  We'll briefly describe the three approaches:

  - **Jeffrey Conditioning**: Updates by redistributing credences within partitions according to the given constraints, without changing the probabilities of the partition cells (unless the constraints directly affect them). In the classic Judy Benjamin, it would set P(HQ | Red) = 3/4 and leave P(Red) unchanged, and similarly for the noisy channel, it would update within each territory based on the signal likelihoods.
    
  - **Direct Conditionalization**: Treats the learned conditional as a proposition and updates by conditionalizing on it. For example, in the classic case, conditionalizing on the proposition: "If in Red, then P(HQ|Red)=3/4". This requires a prior over such conditionals.

  - **Partition-Tracking with Indexical Anchoring**: This approach (which I am introducing as a hybrid) would track the self-locating partition (territories) separately and anchor the update to the indexical facts. For the noisy channel, it would first update the self-locating beliefs based on the signal (using Bayes with the noise model) and then update the role given the territory. But note: this is a sketch and not a standard named approach.

  Now, we score each desideratum for the three approaches.

  ### Summary Table

  | Requirement                                                               | Motivating Case (Classic / Noisy-Channel)                                                                 | Status              | Jeffrey Conditioning | Direct Conditionalization | Partition-Tracking |
  |---------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------|---------------------|----------------------|---------------------------|---------------------|
  | 1. Resolves tension between Jeffrey and direct conditioning               | Classic: Conditional update; Noisy: Mixed uncertainty.                                                    | Hard Requirement    | Partial (fails to treat conditional as proposition) | Satisfies (but requires prior on conditionals) | Partial (must specify how conditionals are handled) |
  | 2. Respects total evidence (vs. compartmentalization)                     | Classic: Does update on Red partition ignore evidence about Blue? Noisy: Joint evidence of territory and signal. | Hard Requirement    | Fails (compartmentalizes) | Satisfies (if conditional proposition captures all) | Partial (might compartmentalize if not careful) |
  | 3. Shifts in partition cell credences when info is conditional            | Classic: Should P(Red) change? Noisy: Territory credence after noisy signal.                              | Hard Requirement    | Fails (leaves partition probs fixed) | Satisfies (if the conditional proposition is informative about territories) | Satisfies (if signals shift territory credences) |
  | 4. Consistency with reflection for indexical beliefs                      | Classic: Future beliefs after update; Noisy: Future beliefs under counterfactual signals.                 | Camp Preference     | Partial (depends on case) | Partial (depends on prior) | Partial (depends on anchoring) |
  | 5. Permits rational disagreement (vs. demands unique update)              | Classic: Different rules yield different posteriors; Noisy: Multiple noise models?                         | Camp Preference     | Satisfies (gives one rule) | Satisfies (gives one rule given prior) | Satisfies (if flexible) |

  **Notes for the table:**

  - For requirement 1: 
    - Jeffrey: Partial because it doesn't treat the conditional as a proposition but as a constraint. It resolves the tension by choosing the constraint interpretation, but doesn't reconcile with direct conditionalization.
    - Direct: Satisfies in the sense that it uses a single method (conditionalization) but requires a prior over conditionals, which may be controversial.
    - Partition-Tracking: Partial because it might handle conditionals differently (e.g., as constraints on partitions) but must specify how.

  - For requirement 2:
    - Jeffrey: Fails because it compartmentalizes the update to the partition (e.g., only shifts within Red) without considering whether the conditional might carry information about Blue.
    - Direct: Satisfies because conditionalizing on the proposition should incorporate all evidence (if the proposition is correctly specified).
    - Partition-Tracking: Partial because it might respect total evidence in the noisy channel by using a full joint model, but in the classic case it might compartmentalize (like Jeffrey) if it doesn't account for the meaning of the conditional beyond the partition.

  - For requirement 3:
    - Jeffrey: Fails because it leaves the partition probabilities (like P(Red)) unchanged by design.
    - Direct: Satisfies because conditionalizing on the conditional proposition may change the probability of the partition cells (if the conditional is evidentially relevant to them).
    - Partition-Tracking: Satisfies in the noisy-channel case because the signal typically shifts the territory credences (via Bayes). In the classic case, if we interpret the conditional as a message, we might model the probability of receiving that message in each territory, which could shift P(Red).

  - For requirement 4 (camp preference, so we note partial for all as it's contested):
    - All are partial because reflection is controversial. However, Jeffrey might violate reflection in self-locating cases if the partition probabilities are fixed arbitrarily. Direct might be consistent if the prior is set appropriately. Partition-Tracking might be designed to respect reflection by anchoring to indexical facts.

  - For requirement 5 (camp preference):
    - All satisfy in the sense that they each offer a unique update given the rule and inputs. But if we consider that the choice of rule might be underdetermined, then they all permit disagreement in the choice of rule. However, within each rule, the update is unique.

  ### Important Distinction: Settled vs Contested

  - **Settled**: The mathematics of Jeffrey conditioning is well-defined: it minimizes a divergence (like Kullback-Leibler) subject to the constraints. Direct conditionalization is also well-defined if we have a prior over the space that includes the conditional proposition.
    
  - **Contested**:
    - Whether reflection applies to self-locating beliefs (e.g., in sleeping beauty, opinions differ).
    - Whether there is a unique rational update in the Judy Benjamin problem: some argue for "orthodox" Jeffrey (leaving partition probs unchanged), others for a shift (e.g., van Fraassen's rule) that changes partition probs.
    - Whether conditionals should be treated as propositions at all (Lewis's triviality results challenge this).

  We have presented the desiderata and scored the approaches without presenting any contested view as consensus.
answer: |-
  ### Desiderata for Belief Revision on Conditionals with Self-Locating Uncertainty  
  Belief revision theories must handle cases where agents update on conditional information (e.g., "If A, then probably B") while managing **self-locating uncertainty** (e.g., uncertainty about their own location or identity) and **evidential uncertainty** (e.g., noisy signals). Below are core requirements, motivated by the classic *Judy Benjamin* case and a *noisy-channel variant*, with status indicated as **Non-Negotiable** (essential for adequacy) or **Camp Preference** (depends on philosophical stance).  

  #### 1. **Resolution of Jeffrey vs. Direct Conditioning Tension**  
  - **Motivating Case**:  
    - *Classic*: Judy Benjamin learns "If you are in Red territory, then P(you are at HQ) = 3/4." Jeffrey conditioning redistributes credence *within* the Red partition (fixing P(HQ|Red) = 3/4), while direct conditioning treats the conditional as a true proposition and updates the entire belief state.  
    - *Noisy-Channel*: Judy knows her commander uses a noisy channel (e.g., "HQ" signal has 90% accuracy in Red, 70% in Blue). Updating on "If Red, then expect ‘HQ’ signal" could be done via Jeffrey (shifting weights in Red) or by conditionalizing on a proposition about the channel.  
  - **Status**: **Non-Negotiable**. A theory must specify how to reconcile these methods or justify one over the other.  
  - **Key Conflict**: Jeffrey ignores higher-order correlations between the conditional and partition cells; direct conditioning requires defining probabilities over conditionals (contested).  

  #### 2. **Respecting Total Evidence vs. Compartmentalization**  
  - **Motivating Case**:  
    - *Classic*: Does learning a conditional *only about Red* affect Judy’s credence in *Blue*? Total evidence demands it might (e.g., the conditional’s truth could correlate with territory). Compartmentalization restricts updates to the relevant partition (Red).  
    - *Noisy-Channel*: The noise profile is territory-dependent. Ignoring cross-partition dependencies (e.g., how Blue’s signal reliability affects interpretation) may violate total evidence.  
  - **Status**: **Non-Negotiable**. Total evidence must be respected; compartmentalization risks incoherence.  
  - **Challenge**: Self-locating uncertainty (e.g., "Am I in Red or Blue?") can amplify dependencies.  

  #### 3. **Shifting Partition Cell Credences under Conditional Information**  
  - **Motivating Case**:  
    - *Classic*: After learning "If Red, then P(HQ) = 3/4," Judy’s P(Red) *should not change* per Jeffrey, but *might change* if the conditional is evidence about Red’s likelihood (e.g., if the commander speaks only when in Red).  
    - *Noisy-Channel*: Hearing "If Red, expect ‘HQ’" via a noisy channel may increase P(Red) if the signal is more likely sent from Red.  
  - **Status**: **Non-Negotiable**. A theory must explain when/why partition cell probabilities (e.g., P(Red)) shift.  
  - **Controversy**: Orthodox Jeffrey forbids partition shifts; others argue they occur via "higher-order" evidence (e.g., the act of receiving the conditional).  

  #### 4. **Consistency with Reflection for Indexical Beliefs**  
  - **Motivating Case**:  
    - *Classic*: Judy expects her future self (after updating) to have rational credences. Can she set her current P(Red) = E[P_future(Red)]? If P(Red) changes unexpectedly, reflection may be violated.  
    - *Noisy-Channel*: Judy considers her future credence if she receives the "HQ" signal. Self-locating beliefs (e.g., "I will be in Red tomorrow") complicate reflection.  
  - **Status**: **Camp Preference**. Reflection’s applicability to self-locating beliefs is contested (e.g., in Sleeping Beauty problems).  
  - **Settled vs. Contested**: Formal reflection principles exist, but their scope for indexical beliefs is debated.  

  #### 5. **Permitting Rational Disagreement vs. Demanding Uniqueness**  
  - **Motivating Case**:  
    - *Classic*: Two agents with identical priors and evidence may compute different posteriors for P(Red)—e.g., one uses Jeffrey, the other minimizes a different divergence.  
    - *Noisy-Channel*: Disagreement could arise from differing models of the noise (e.g., Is the channel symmetric?).  
  - **Status**: **Camp Preference**. Objectivists demand unique updates; subjectivists allow underdetermination.  
  - **Settled**: Uniqueness is provable only for strict conditionalization; Jeffrey updates are non-unique without additional constraints.  

  ---

  ### Scoring Belief Revision Theories  
  Below, three approaches are evaluated against the desiderata:  
  - **Jeffrey Conditioning**: Redistributes credence within partitions to match constraints (e.g., sets P(HQ|Red) = 3/4).  
  - **Direct Conditionalization**: Treats the conditional as a proposition and updates via Bayes’ rule (e.g., conditionalizes on "If Red, then P(HQ|Red) = 3/4").  
  - **Partition-Tracking with Indexical Anchoring**: Tracks self-locating partitions (e.g., territories) separately and anchors updates to indexical facts (e.g., "I am in cell X, so I update using its noise model").  

  | Requirement                                          | Motivating Case (Classic / Noisy-Channel)                               | Status              | Jeffrey Conditioning | Direct Conditionalization | Partition-Tracking |  
  |------------------------------------------------------|-------------------------------------------------------------------------|---------------------|----------------------|---------------------------|---------------------|  
  | **1. Resolves Jeffrey vs. direct tension**           | Classic: Conditioning conflict; Noisy: Channel uncertainty              | Hard Requirement    | Partial¹             | Satisfies²                | Partial³            |  
  | **2. Respects total evidence**                       | Classic: Blue-territory impact; Noisy: Cross-partition noise effects    | Hard Requirement    | Fails⁴               | Satisfies⁵                | Satisfies⁶          |  
  | **3. Shifts partition cell credences appropriately** | Classic: Should P(Red) change?; Noisy: Signal affects territory credence | Hard Requirement    | Fails⁷               | Satisfies⁸                | Satisfies⁹          |  
  | **4. Consistent with indexical reflection**          | Classic: Future self’s credence; Noisy: Counterfactual signals         | Camp Preference     | Partial¹⁰            | Partial¹¹                 | Satisfies¹²         |  
  | **5. Permits rational disagreement**                 | Classic: Divergent posteriors; Noisy: Modeling noise                   | Camp Preference     | Satisfies¹³          | Satisfies¹⁴               | Satisfies¹⁵         |  

  #### Key to Scores:  
  1. **Partial**: Ignores direct treatment of conditionals; no reconciliation.  
  2. **Satisfies**: Unifies updates under Bayes, but requires defining probabilities over conditionals (contested).  
  3. **Partial**: Anchors to partitions but doesn’t resolve the tension formally.  
  4. **Fails**: Compartmentalizes updates (e.g., Blue unchanged), ignoring cross-partition evidence.  
  5. **Satisfies**: Conditions on a global proposition, incorporating all dependencies.  
  6. **Satisfies**: Indexical anchoring forces joint modeling of self-location and evidence.  
  7. **Fails**: Forbids partition shifts by design (P(Red) fixed).  
  8. **Satisfies**: The conditional proposition may directly affect P(Red).  
  9. **Satisfies**: Noisy signals shift self-locating credences (e.g., via Bayes).  
  10. **Partial**: Reflection holds only if partition probabilities are stable; often violated in self-locating cases.  
  11. **Partial**: Depends on prior over conditionals; may violate if future beliefs are indexical.  
  12. **Satisfies**: Anchoring future beliefs to current indexical facts enforces reflection.  
  13. **Satisfies**: Multiple Jeffrey rules (e.g., KL-divergence vs. others) allow disagreement.  
  14. **Satisfies**: Priors over conditionals vary, enabling disagreement.  
  15. **Satisfies**: Choice of partition structure or noise model is subjective.  

  ---

  ### Settled vs. Contested Elements  
  - **Settled**:  
    - Mathematics of Jeffrey conditioning (minimizing KL-divergence given constraints).  
    - Bayes’ rule for direct conditionalization (if conditionals are propositions).  
    - Self-locating updates require centered partitions (e.g., modeling "I am in Red").  
  - **Contested**:  
    - **Conditionals as propositions**: Rejected by some due to Lewisian triviality.  
    - **Reflection for indexicals**: Denied by some (e.g., in Sleeping Beauty) as inapplicable.  
    - **Uniqueness**: Subjectivists accept multiple rational updates; objectivists demand convergence.  
    - **Partition shifts**: Orthodox Bayesians forbid them; others (e.g., van Fraassen) advocate shift-then-Jeffrey rules.  

  No approach satisfies all desiderata universally. **Jeffrey** is simple but ignores evidence holism. **Direct conditionalization** is holistic but requires contentious priors. **Partition-tracking** handles self-locating uncertainty well but lacks a unified formalism. The noisy-channel variant highlights that self-locating cases demand explicit modeling of evidential reliability and indexical anchors.
