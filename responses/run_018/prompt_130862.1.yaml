  ```json
  {
    "rejected_step": 6,
    "why_it_looked_fine": "It conflates institutional influence with political agency, mistaking administrators for policymakers.",
    "cost_of_rejection": "Accepting that unelected experts may hold operational power if constrained by non-electoral accountability mechanisms.",
    "equivocation_flag": true,
    "status_of_premise_1": "kept",
    "status_of_premise_3": "kept",
    "alternative_reading": "Legitimacy under sortition requires term-limited representatives + a rule-bound bureaucracy subject to external oversight, separating technical expertise from political power."
  }
  ```

  **Key Insight**: Your fable’s peer-confirmation mechanism *could* resolve the tension if applied to administrators (e.g., panels of citizens confirm senior bureaucrats’ continued tenure). This maintains institutional memory while creating a non-electoral accountability path, invalidating Step 8’s false dilemma. The core error was reducing all power to a binary of "political vs. non-political" – real constitutions compartmentalize authority.
