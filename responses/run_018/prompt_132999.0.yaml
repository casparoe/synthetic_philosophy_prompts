  I need to start by brainstorming concrete institutional practices that treat these cases as collapse scenarios. For museums, this would include timeline displays ending with "collapse" terminology, exhibit labels emphasizing decline, and abrupt transitions in gallery layouts. UNESCO World Heritage listings often use collapse narratives to justify site significance, as seen in descriptions of Maya cities or Rapa Nui that highlight abandonment narratives. Textbooks typically have chapters titled "The Maya Collapse" that present it as a historical endpoint. Archaeological site management plans often frame conservation priorities around preserving "collapsed" monumental structures rather than continuous habitation sites.

  When analyzing these practices philosophically, I'll examine three ontological views: substantialist (societies as entities with essential identities), functionalist (societies as systems requiring specific functions), and relational-processual (societies as dynamic networks without fixed essences). The institutional labeling clearly follows a substantialist view where demographic/political discontinuities mark the "death" of a society, despite evidence of cultural continuity in domestic life, language and kinship structures.

  Looking at the archaeological evidence: In the Eastern Mediterranean, palatial systems collapsed but village life continued with cultural adaptations. For the Maya, monumental construction ceased but populations persisted with transformed settlement patterns. On Easter Island, statue construction stopped but Rapa Nui society continued with cultural innovation. This evidence undermines the substantialist reading while being compatible with functionalist or relational views.

  I need to distinguish what these heritage practices presuppose versus what they merely accommodate. They fundamentally presuppose that societies have essential identities that can be destroyed. While they might accommodate evidence of continuity as "legacy" or "survival," the collapse framing requires substantialism. A relational ontology could theoretically use "collapse" metaphorically but would fundamentally transform the concept to mean reorganization rather than termination.

  If institutions shifted to relational-functional views, we'd see concrete changes: museum exhibits would reframe "collapse" as transformation, UNESCO descriptions would emphasize cultural continuity alongside change, textbooks would replace "collapse" chapters with narratives of reorganization, and site management would prioritize continuous-use landscapes alongside monuments.

  The key feature that collapse narratives depend on substantialism to maintain is the normative baseline that equates societal health with political complexity and monument-building. Without substantialism, we couldn't treat the cessation of monument-building as societal death rather than adaptive change. This normative valuation must be made explicit rather than embedded in institutional framing.
answer: |-
  ### Brainstormed Institutional Practices Framing Collapse
  1. **Museum periodization:** Gallery transitions marked as "Late Bronze Age Collapse" or "Classic Maya Collapse," with artifacts isolated in "terminal" phases; post-collapse materials displayed separately or minimally.
  2. **UNESCO World Heritage descriptions:** Emphasis on "abandoned cities" (e.g., Tikal's "abandonment in the 10th century"), Rapa Nui's "ecological collapse," and Mycenaean palaces as "destroyed." Narrative focus on "mysterious disappearance."
  3. **Textbook chapter headings:** Sections titled "The Maya Collapse" or "The Bronze Age Catastrophe," framing events as endpoints; timelines terminating with collapse icons.
  4. **Archaeological site management plans:** Conservation prioritization of "peak period" monuments (pyramids, palaces) over later structures; interpretive signage highlighting "decline" markers (e.g., unfinished statues on Rapa Nui).

  ### Philosophical Commitments in Collapse Labeling
  The practices presuppose a **substantialist metaphysics** of societal identity:
  - Societies are treated as bounded entities with essential properties (monumentality, centralized rule, artistic styles).
  - "Collapse" signifies the irreversible destruction of this essence, even when linguistic kinship, or domestic practices persist (e.g., Linear B script disappearance vs. continued Cypriot village life).
  - Functionalist elements (e.g., loss of palatial redistribution) are subsumed under this substantialist frame—collapse occurs when *specific* elite functions cease, ignoring reorganized alternatives (e.g., decentralized trade networks post-Bronze Age).

  **Archaeological Evidence vs. Substantialism:**
  - **Eastern Mediterranean:** Palatial systems collapse c. 1200 BCE, but domestic settlements (e.g., Tiryns lower town) thrive with new cultural syntheses. Substantialism ignores continuity in pottery styles and domestic rituals.
  - **Classic Maya:** Monumental construction halts (c. 9th century CE), yet populations persist with transformed settlement patterns (e.g., continued occupation at Lamanai). Framing collapse as "termination" dismisses Postclassic political adaptations.
  - **Rapa Nui:** Cessation of *moai* carving (c. 1600 CE) is labeled collapse, yet kinship-based *matato'a* clans maintained sustainable horticulture and new religious practices (Birdman cult). The substantialist focus on statues equates societal death with elite cultural loss.

  A **functionalist reading** fails to justify "collapse" without contradiction: if societies are systems fulfilling core functions (subsistence, cohesion), continuity in village life and agriculture (e.g., Maya *milpa* farming, Rapa Nui yam cultivation) implies reorganization, not termination. Labeling these cases "collapse" thus smuggles in substantialist assumptions about *which* functions (monument building, dynastic rule) are essential.

  ### Presupposition vs. Accommodation
  - **Presupposes:** Societies are discrete substances with teleological trajectories; collapse is an ontological endpoint. Discontinuity in elite traits signifies societal death.
  - **Accommodates but does not require:** Evidence of continuity (e.g., Maya persistence in Belize) is relegated to "survival" or "legacy," preserving the collapse narrative’s core.

  A **relational-processual ontology** (societies as fluid networks) *could* use "collapse" metaphorically for rapid network reconfiguration but would reject it as an ontological category. This view forces abandonment of the *failure-versus-change* distinction as empirically incoherent—what institutions call "collapse" becomes "reticulation under stress" (e.g., Mycenaean refugees integrating into Phoenician trade networks).

  ### Institutional Revisions under Relational-Functional Framing
  1. **Curatorial framing:** Replace "Collapse" gallery endings with "Transformation" sections showing hybrid artifacts (e.g., Post-Palatial Cypriot pottery alongside Philistine forms). Contextualize monument decline within resilient subsistence strategies.
  2. **Pedagogical narrative:** Textbook chapters titled "Reorganization in the 9th Century Maya Lowlands" or "Post-Palatial Mediterranean Networks," emphasizing demographic continuity and adaptive shifts.
  3. **Conservation funding:** Prioritize multi-period sites (e.g., Rapa Nui's *ahu* and later *manavai* gardens equally); fund studies of post-"collapse" habitation layers as central to heritage value.

  ### Normative Feature Dependent on Substantialism
  The institutional practice cannot sustain its **normative baseline equating "societal health" with political centralization and monumentality** without substantialism. This valuation—
  - Privileges elite achievements (palaces, pyramids) over vernacular resilience (household production, local trade).
  - Assumes complexity is the default state, pathologizing decentralization (e.g., post-Classic Maya city-states labelled "degenerate").

  Scholars must *explicitly argue* that monumentality signifies "health" rather than inheriting this from collapse framing. Absent substantialism, the cessation of pyramid-building is merely a cultural choice, not societal death—demanding justification for why local continuity matters less than state apparatus.
