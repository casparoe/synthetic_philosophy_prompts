  hey so ive been thinking about this thing with my savings and i cant tell if im being selfish or just normal. i live in a town that got split by a border like fifty years ago, but honestly nothing changed except now half my friends are technically in another country. same language, same church, same food, everything. anyway i saved up a little, not alot, and theres this old community center on my side thats about to close, and theres also one across the line that needs help way more cause theyre poorer. my first thought was obviously help my side cause these are my people, i see them at the grocery store. but then i realized if the border had been drawn twenty miles east, those other people would be my neighbors and these ones wouldnt. so is my feeling that i owe my side more just because of some random line? or is it okay to care more about people you actually share a town with? i dont want to be one of those people who only cares about strangers, but i also dont want to be unfair. what do you actually think?
