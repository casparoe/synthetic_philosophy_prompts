answer: |-
  Based on your precise description and conceptual carve-out, the phenomenon you've identified is most accurately termed **Epistemic Closure of Moral Framing (ECMF)** or **Moral Category Occlusion (MCO)**. Let's build this step-by-step, addressing why existing terms fall short and how this configuration is distinct:

  ### Core Definition
  **Moral Category Occlusion (MCO):**  
  *A systemic-cognitive condition in which institutional language, metrics, and procedures structurally exclude moral concepts as valid categories for evaluating outcomes. Harm is rendered exclusively as operational data, making moral evaluation appear not just irrelevant but epistemically incoherent within the system's logic.*

  ### Key Features (Why It's Distinct)
  1.  **Epistemic Barrier (Not Psychological Avoidance):**  
      Unlike Bandura's "moral disengagement" (which relies on mechanisms like dehumanization *to reduce guilt*), MCO operates at the level of *knowledge systems*. Moral terms aren't suppressed; they're rendered nonsensical. Asking "Was this deportation *wrong*?" is like asking "Is this database query *purple*?" – the framework lacks conceptual hooks for the question.
  2.  **Structural Compartmentalization (Not Individual Thoughtlessness):**  
      Arendt's "thoughtlessness" focuses on individual failure to *think* from others' perspectives. MCO is *system-embedded*. The bureaucracy/algorithm/tool defines reality through its own ontology ("error rates," "throughput," "compliance status"). Moral evaluation exists *outside* this ontology. Individuals aren't necessarily unreflective *generally*; they're operating within a closed epistemic frame.
  3.  **Literal Inapplicability (Not Euphemism or Bad Faith):**  
      Euphemisms ("collateral damage") intentionally soften reality. Bad faith involves knowing deception. In MCO, the technical description ("pipeline error rate exceeded tolerance") is offered *as the complete and accurate account*. Switching to moral language feels like introducing alien concepts, not revealing hidden truths. The puzzlement is genuine.
  4.  **Stability Through System Logic:**  
      This isn't fragile denial. It's reinforced by system requirements: audits measure deviations from procedure, not suffering; algorithms optimize for efficiency metrics, not fairness-as-justice; compliance checks verify rule-adherence, not ethical outcomes. Moral reasoning lacks a procedural "input slot."

  ### Conceptual Neighbors & Boundaries
  *   **Bureaucratic Rationality (Weber):** *Close, but broader.* Weber's "iron cage" describes instrumental rationality dominating society. MCO is a specific *mechanism within it* – the *active exclusion* of non-instrumental (moral) evaluation from the operational language itself. Weber provides the stage; MCO is a specific scene.
  *   **Technocracy/Technological Rationality (Ellul, Marcuse):** *Overlaps significantly.* Focuses on efficiency/control as paramount values. MCO is the *linguistic and cognitive manifestation* of this: when "what can be measured" (error rates) completely displaces "what matters morally" (human suffering).
  *   **Reification (Lukács):** *Related foundational concept.* Reification turns social relations into thing-like "facts." MCO is reification *applied specifically to harm*: suffering becomes a quantifiable system variable ("cost," "risk factor," "failure rate").
  *   **Ideology (Althusser, Žižek):** *Distinct.* Ideology often involves false consciousness or internalized belief. MCO doesn't require belief in the system's *rightness*, only acceptance of its *operational definitions*. One can find the system absurd *while still being unable to express moral concerns within it*.
  *   **Anomie (Durkheim):** *Different.* Anomie is normlessness, often leading to distress. MCO thrives on *hyper-normativity* within the system – just norms of a specific, morally evacuated kind. Individuals feel "normal" operating within it.
  *   **Moral Dumbfounding (Haidt):** *Mirrors cognitively but differs structurally.* Dumbfounding is an individual inability to articulate *reasons* for a moral intuition. MCO is an *institutionalized* inability to even recognize the situation *as* moral.

  ### Boundary Cases: Where MCO Breaks Down or Blurs
  1.  **Conscious Cynicism:** When individuals *recognize* the moral harm but deliberately *choose* the technical register for deflection or careerism. This edges into bad faith/deceit, distinct from genuine category occlusion.
  2.  **Systemic Crisis/Scandal:** When overwhelming evidence forces the system to temporarily acknowledge moral categories ("We deeply regret the loss of life"). MCO is suspended, but the system often seeks a quick "technical fix" to restore its closed logic.
  3.  **Hybrid Roles/Whistleblowers:** Individuals partially embedded in the system but retaining external moral frameworks. They experience intense cognitive dissonance precisely because they *can* apply moral categories, highlighting the occlusion for others.
  4.  **"Ethical" Tech/Compliance:** Systems that incorporate *simulated* moral language ("fairness score," "ethical AI review") but reduce it to another technical variable without genuine moral reasoning. This is MCO *wearing a mask*, not its absence.

  ### Why "Moral Category Occlusion"?
  *   **Moral Category:** Emphasizes the specific concepts (good, evil, justice, cruelty, dignity) being excluded.
  *   **Occlusion:** Implies an active blocking or closing off, not mere absence. It's structural and intentional (at the system level).
  *   **Epistemic:** Roots the phenomenon in systems of knowledge and what counts as valid description/evaluation within a specific framework.

  ### In Practice (Eichmann & Beyond)
  *   **Eichmann:** Arendt saw clichés and lack of imagination. MCO adds: his language was dictated by the *RSHA's operational ontology*. Deportations were "evacuations" or "resettlement" – terms defining the act purely by its logistical place in the system, occluding "murder" as a valid category *within that frame*.
  *   **Tech Ethics Board:** Discussing biased algorithms solely in terms of "statistical disparity," "model drift," or "input contamination," unable to transition to "discrimination," "injustice," or "harm to vulnerable groups" as *meaningful evaluations within the meeting's protocol*.
  *   **Compliance Officer:** Reporting a safety violation that killed workers as "Procedure 7B non-conformance leading to asset loss and production delay," genuinely puzzled when asked about "corporate manslaughter" or "moral responsibility."

  MCO is the linguistic armor of modern systemic harm, making morality literally unspeakable within the machine's logic. It's not that people *are* monsters; it's that the system *makes monstrous evaluation impossible* by design. Your observation nails a critical pathology of rationalized administration.
