  The user is clearly well-read, referencing Arendt, Bandura, and Weber. They're not satisfied with existing terms like "moral disengagement" or "thoughtlessness" because what they're seeing is more structural—a rigid separation of registers where moral vocabulary isn't just avoided but treated as categorically inapplicable. They want a precise term or concept that captures this exact dynamic.

  Hmm, let me unpack this. The core issue seems to be an institutionalized epistemic barrier where moral reasoning is excluded by design. It's not that individuals are suppressing guilt; the system itself doesn't allow for moral language. When they say "error rate exceeded tolerance," they're not euphemizing—they're operating in a framework where "harm" is literally just a metric. 

  The user’s frustration is palpable. They’ve noticed this pattern across domains (tech, compliance, history) and want to pin it down rigorously. They’re rejecting nearby concepts for good reasons: Bandura’s "moral disengagement" involves psychological mechanisms like dehumanization, while Arendt’s "thoughtlessness" is about individual cognitive failure. This is different—it’s systemic, almost like the bureaucracy has its own ontology where morality doesn’t exist. 

  I recall Sloterdijk’s "cynical reason" and Luhmann’s systems theory, but neither fully fits. Sloterdijk is about ideological detachment, and Luhmann’s autopoiesis describes self-referential systems but doesn’t explicitly address the moral register. The closest might be "epistemic closure" from institutional epistemology, but it needs tweaking. 

  I think I’ll propose "**Moral Category Occlusion**" (MCO). It’s not just that morality is ignored; the system’s architecture prevents moral categories from even appearing as valid inputs. Like trying to discuss color in a sonar system—the sensors aren’t built for it. Boundary cases would be: (1) When technical language *is* used euphemistically (that’s deceit, not MCO), or (2) When moral terms exist in the system but are hypocritically applied (that’s bad faith). 

  The user would probably push back on whether this is truly "stable"—doesn’t cognitive dissonance eventually creep in? But that’s the point: MCO works precisely because it’s structurally reinforced. A compliance officer isn’t wrestling with guilt; their job defines "harm" as a compliance metric, full stop. 

  ... Wait, should I mention Foucault’s "regimes of truth"? Too broad. Or Habermas’s "colonization of the lifeworld"? Close, but about market logic invading personal spheres. MCO is more granular. 

