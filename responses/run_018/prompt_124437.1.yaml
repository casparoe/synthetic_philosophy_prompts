prompt: |-
  Hey, I'm trying to pin down a pattern I keep seeing in administrative and bureaucratic contexts, especially when I read about cases like Eichmann and the kind of evil Arendt called 'banal'. Let me describe it concretly, because I don't have the right word for it.

  There's this thing people do — I've seen it in modern compliance officers, in tech ethics boards, even in historical accounts of mid-level bureaucrats — where they talk about serious harm (deportations, system failures that kill people, algorithmic exclusion) entirely inside the technical vocabulary of the system. Not as euphemism — they're not saying "collateral damage" to hide blood. They're saying "the pipeline had an error rate that exceeded tolerance for that cohort" and they genuinely mean people died, but the moral registter just... isn't available to them. It's not that they're suppressing guilt; it's like asking them to evaluate the harm in moral terms is a catagory mistake, like asking whether a spreadsheet is brave. They can recite the facts with perfect accuracy, but only in the system's own language, and they seem genuinely puzzled when you switch registers.

  I noticed this especially comparing it to Arendt's point about Eichmann — she said he wasn't evil in a deep, demonic way, he was thoughtlesness, he spoke in cliches, he couldn't think from another person's viewpoint. But what I'm describing feels narrower and more structural. It's not just a lack of imagination; it's an active, stable compartment where harm gets parsed as an operational variable, and moral evaluation is treated as literally inapplicable, not just ignored or avoided.

  So: is there an established name for this exact configuration? I'm not looking for moral disengagement (Bandura), and it's not quite Arendt's thoughtlessness, and it's not just bureaucratic rationality in Weber's sense. If there's a term that captures exactly this — the rigid separation of registers, where moral vocabulary is catagorically excluded rather than suppressed — I'd like to know it, how it relates to the nearest concepts, and where the boundaries are. If there's no name, can you coin one, define it precisely, and tell me the boundary cases? I won't be satisfied with just a label — I want to know exactly what it is, what it isn't, and where it breaks down.

  Please think carefully and step by step, don't rush. You're an expert philosopher with a background in political theory and moral psychology, so dig into the conceptual carving. Maybe start with a quick brainstorm of nearby terms, then narrow in, and show me the edges where this thing stops being itself and becomes something else. Thanks!
