answer: |-
  You've hit on one of the deepest problems in population ethics and decision theory: **how to handle potentially infinite values under uncertainty**. Your longtermist colleague's argument relies on a flawed application of expected value theory when infinities are involved. Here's the conceptual machinery to dismantle it:

  ### Core Problems with the "Infinite Dominance" Argument
  1. **Failure of Expected Value with Infinities**:
     - Standard expected value calculations assume utilities are finite or bounded. When unbounded utilities (including infinity) enter the mix, **expectation summation becomes undefined or paradoxical**.
     - Example: If outcome A has utility ∞ with probability *p* > 0, and utility 0 otherwise, its "expected value" is ∞ × *p* + 0 × (1-*p*) = ∞. But this implies *any* nonzero probability of infinite value dominates *any* finite value—even if *p* is infinitesimal (e.g., 1/googolplex). This leads to absurdities (e.g., prioritizing a 0.0001% chance of utopia over certain prevention of genocide).

  2. **The Problem of Cardinal Comparability**:
     - Comparing finite and infinite utilities requires a **common scale**, but no coherent mapping exists. If saving 200 students gives utility *U*, and the "infinite future" gives utility ∞, what is *U*/∞? It's undefined—not "approximately zero." Thus, we can't rank them arithmetically.

  3. **Violation of Dominance Principles**:
     - **Statewise Dominance** fails: The chair *only* dominates in scenarios where the infinite future is possible *and* the chair positively affects it. But:
       - There are possible states where the chair has *no effect* (utility 0) or causes *harm* (negative utility).
       - There are states where the mental health program saves lives (positive utility) while the chair does nothing.
     - Unless the chair has *positive utility in every possible world* (implausible), no dominance holds.

  4. **Infinite Ethics Requires Special Decision Rules**:
     - With infinite possibilities, we need alternatives to standard expected utility:
       - **Differential Expectation** (Bostrom): Compare *differences* in outcomes across choices. If the chair adds utility Δ in infinite futures, but Δ might be finite (e.g., marginally improving a utopia), it loses its dominance.
       - **Hyperreal Utilities** (e.g., surreal numbers): Assign infinite utilities as hyperreals (e.g., ω), but then ω > *U* doesn't imply ω + risk > *U* + certainty. Risk-aversion still applies.
       - **Permissive** **Moderation**: Reject actions whose *worst-case* outcomes are catastrophically bad, even if expected value is infinite. The chair might risk existential catastrophe (e.g., bad policy enabling dystopia).

  5. **Epistemic Challenges**:
     - "Nonzero probability of infinite future" is poorly defined. What justifies this probability? If we assign *any* outcome a nonzero probability arbitrarily, decision-making collapses (Pascal's Mugging).
     - Rational agents should **discount low-probability events** below a robustness threshold (e.g., if *p* < 1/10^100, ignore).

  ### A Principled Objection Framework
  **Block the inference using these axioms**:
  > **A1. Finite Sure-Bet Principle**: A guaranteed finite moral good (*G*) cannot be obligatorily traded for a gamble that, with probability 1, yields no better than *G*, merely because the gamble has a *p*-chance of an incomparable outcome (∞).  
  >  
  > **A2. Statewise Non-Dominance**: Option A only dominates B if A is at least as good as B in *all* possible states of the world and strictly better in some. The chair fails this against the mental health program.  
  >  
  > **A3. Bounded Impact Assessment**: When outcomes involve hypothetical infinities, default to evaluating differences in *finitely accessible* welfare. The chair's impact on an infinite future is undefined; the mental health impact is quantifiable.  

  ### Practical Application to Your Case
  - **Mental health program**: Delivers guaranteed, measurable welfare gains (e.g., 200 students × lifetime well-being boost). Call this total utility *U*.
  - **Policy chair**: 
    - With probability *p* ≈ ? (unknowably small?): *Maybe* influences an infinite future. But its marginal impact Δ is undefined (could be 0, finite, or infinite). 
    - With probability 1-*p*: Has finite impact (possibly negative if funding is wasted).
  - **Decision rule**: Unless *p* is significant *and* Δ is provably positive *and* infinite, the *certainty* of *U* outweighs the speculative chair. The burden of proof lies on the longtermist to quantify Δ—which they cannot.

  ### Why Sentiment Isn't Needed
  This isn't about emotion; it's about **coherent decision theory under indeterminacy**. The longtermist's error is treating ∞ as a number that vacuously dominates arithmetic. Rigorous approaches (e.g., Nick Bostrom's *Infinite Ethics* or Lara Buchak's risk-weighted expected utility) show that infinities require modified frameworks—not default dominance.

  **Your conceptual move**: Force the longtermist to specify (1) the probability *p* of their scenario, (2) the *marginal utility* Δ of the chair in that scenario, and (3) why Δ isn't dwarfed by the near-term certainties. If they retreat to "Δ could be infinite," invoke A1/A2: we don't sacrifice concrete goods for incommensurable maybes.
