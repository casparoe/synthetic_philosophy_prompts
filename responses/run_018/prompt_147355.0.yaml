answer: |-
  This is a fantastically sharp question cutting to the heart of legal philosophy and societal hypocrisy. Your novel premise is dynamite, forcing confrontation with uncomfortable truths. Let's dissect the selective criminalization of "morals offenses" in supposedly liberal democracies:

  **The Philosophical Commitments Behind the Inconsistency:**

  1.  **Lingering Legal Paternalism & Symbolism:** While *Mill/Hart* ("Harm Principle": state intervention only justified to prevent harm to others) dominates rhetoric, paternalism (protecting people from themselves) persists in diluted form. Laws against incest or extreme obscenity often carry a whiff of "society knows what's best for your soul/character," even if unstated. Crucially, these laws act as **symbolic statements** of core societal values – a line drawn in the sand declaring "this *is* intolerable," regardless of measurable harm between consenting adults.
  2.  **Devlin's Shadow Cast Long:** You nailed it. Despite Hart's influence, **Devlin's "Disintegration Thesis"** ("society has a right to preserve its shared morality as a condition of its existence, like an immune system") remains deeply embedded in *some* corners of the law. The explicit citation of "public morality" or "moral fabric" is pure Devlin. Society fears that tolerating certain acts (like consensual adult incest) weakens foundational bonds (family structure, taboos) deemed essential for social cohesion, even absent immediate, direct harm.
  3.  **Majoritarianism Masquerading as Harm:** This is crucial. Gambling and drugs are often legalized/decriminalized because large segments of the population *like* (or tolerate) them, generating significant tax revenue and political support. The "harm" argument becomes secondary or is managed via regulation. Conversely, acts triggering profound disgust (like incest) are practiced by a tiny minority with little political power. Legislators cater to the majority's revulsion, **framing that collective disgust *itself* as a form of societal harm** – the erosion of shared values, psychic offense, or a threat to the "moral ecology."
  4.  **The Disgust Heuristic & Moralization:** This is where the "smuggling" happens. The selective practice presupposes that **disgust *is* a legitimate indicator of profound moral wrongness**, even when harm arguments are weak or indistinguishable from other legal activities. It treats revulsion as a pre-rational signal that something threatens the social order at a deep, non-negotiable level. This taps into theories like Leon Kass's "wisdom of repugnance" (though heavily criticized). The inconsistency arises because disgust towards gambling/drugs was overcome by popularity/profit/pragmatism, while disgust towards incest remains culturally potent.
  5.  **The Illusion of Neutrality & Defining "Harm":** Liberal democracies pretend legal systems are neutral, but "harm" is a **socially constructed and contested concept**. By defining "collective disgust," "outrage," or "undermining public morality" *as* harms in specific contexts (incest, public indecency) but not others (gambling ads, ubiquitous alcohol), the system reveals its non-neutrality. It prioritizes *certain types* of social stability (avoiding taboo-breaking) over *other types* of harm (addiction, financial ruin).

  **Can Collective Disgust Be "Harm" Under Hart's Principle?**

  *   **Hart's View:** Hart would vehemently reject it. He distinguished sharply between "harm" (physical injury, financial loss, psychological distress from direct attack) and "mere offense" (disgust, outrage, hurt feelings based on knowing something happens privately). He argued society must tolerate profound offense to protect liberty. Collective disgust is the *epitome* of the "moralism" he sought to exclude.
  *   **The Stretch:** Legislatures *do* stretch "harm" to encompass collective disgust. They argue:
      *   **Corrosive Effects:** Tolerating taboo acts erodes shared norms over time, leading to societal breakdown (Devlin's disintegration).
      *   **Psychic Harm:** Knowing such acts occur causes genuine distress and undermines citizens' sense of living in a moral community.
      *   **Slippery Slope:** Allowing one taboo to fall weakens resistance to others.
  *   **The Problem:** This stretch is **inconsistent and discriminatory**. Why is disgust over incest a cognizable harm justifying criminalization, but disgust over state-sponsored gambling isn't? It reveals the argument is less about "harm" per se and more about **which disgusts hold sufficient cultural and political power to be codified into law**.

  **Where My Reasoning is Most Likely Reaching / Vulnerable:**

  1.  **Overstating "Harm" in Gambling/Drugs vs. Underestimating "Harm" in Incest:** I'm treating the harms of gambling/drugs as objectively greater than the alleged harms of consensual adult incest. Critics could argue:
      *   The *potential* societal harm from normalizing incest (confusing kinship roles, genetic risks if procreation occurs, psychological impacts even on "consenting" adults shaped by unique family dynamics) is profound and distinct, even if hard to quantify immediately for a specific childless couple.
      *   Gambling/drug harms are often individual and mitigated by regulation (e.g., addiction services, spending limits), while incest's harm is argued to be more fundamentally societal/symbolic.
      *   **My Weakness:** Dismissing the *symbolic/social fabric* harm argument too readily might underestimate its genuine psychological and social force for many people, even if I disagree with criminalization.
  2.  **The "Arbitrariness" of Disgust:** I'm assuming disgust is purely arbitrary and culturally contingent. While largely true, could there be an **evolutionary or deeply ingrained psychological basis** for incest disgust serving a protective function (preventing inbreeding, maintaining clear family structures)? Does this give it *some* different status, even if insufficient for criminalization?
      *   **My Weakness:** Dismissing disgust as *entirely* irrational or manufactured overlooks potential deep-seated psychological roots, even if they don't justify criminalization in a liberal society.
  3.  **Ignoring Practical Politics:** My analysis focuses on philosophy, but the real reason is often crude **political calculus and path dependence.** Incest laws are ancient, rarely enforced against consenting adults, but politically toxic to repeal. Gambling/drug laws changed because powerful lobbies and shifting public opinion forced it. The inconsistency isn't philosophical coherence but **which taboo-breakers have enough money/votes.**
      *   **My Weakness:** Attributing the inconsistency purely to philosophical commitments might neglect the messy reality of power, inertia, and fear of electoral backlash.

  **What Would Change My Mind?**

  1.  **Strong Empirical Evidence Linking Mere Knowledge of Private Consensual Taboo Acts to Widespread, Measurable Societal Harm:** If rigorous, longitudinal studies demonstrated that the *knowledge* that private, consensual adult incest (or other deep taboos) was legal and occurring caused significant, measurable increases in things like: erosion of trust in communities, breakdown of non-incestuous family structures, increased mental health issues in the *general population*, or tangible economic costs *beyond* enforcement savings, that would seriously challenge the Hartian position. It would lend credence to Devlin's disintegration thesis and the "collective disgust as harm" argument.
  2.  **Evidence that Disgust is a Reliable Heuristic for *Hidden* Harms:** If cognitive science/evolutionary psychology could robustly demonstrate that the specific disgust response triggered by acts like incest consistently correlates with previously *undetected* but profound individual or societal harms (e.g., subtle long-term psychological damage even in "consenting" adults, unforeseen cascading effects on kinship networks), this would undermine the "consensual adults, no harm" argument. It would suggest disgust is tracking something real we were missing.
  3.  **A Coherent, Non-Arbitrary Principle Distinguishing "Criminalizable Disgust" from "Tolerable Disgust":** If someone could articulate a philosophically rigorous principle (beyond majoritarianism or tradition) explaining *why* collective disgust towards incest justifies criminalization while collective disgust towards gambling, extreme wealth inequality, or certain forms of speech does not – and this principle held up under scrutiny – it would force a reevaluation. Currently, that principle seems absent or purely based on historical power dynamics.

  **For Your Novel:**

  This inconsistency is *gold* for your lawyer character. They can ruthlessly expose the hypocrisy:

  *   "We criminalize love between these two adults because it revolts us, yet we run state lotteries that bankrupt families and advertise them during the Super Bowl. Where is the *real* harm? Where is the *real* threat to the 'moral fabric'? Is our moral fabric only torn by what we find *personally disgusting*, not by what demonstrably destroys lives?"
  *   "The state argues it must protect 'public morality.' But public morality, it seems, is whatever the majority finds icky *and* lacks the lobbyists to fight back. Is that the principle we enshrine in law? The tyranny of the disgusted majority?"
  *   "They invoke 'potential harm to society.' Show me the study. Show me the data proving two adults loving each other in private harms *you* more than the casino on every corner harms vulnerable families. Your Honor, this isn't about harm. It's about fear. Fear of difference. Fear of challenging ancient taboos. And fear is not a sufficient reason to imprison people."

  Your exploration of this legal and philosophical tangle promises a powerful story. Good luck!
