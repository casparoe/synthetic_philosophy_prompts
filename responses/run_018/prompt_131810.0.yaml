  - **SII Prediction**: This shows that the pre-operative unified "user" was always an interface-level construction (a useful fiction) and that the surgery simply disrupted the mechanisms that maintained this fiction, revealing the underlying multiplicity.
  - **FRR Prediction**: This shows that a real but distributed controller (the user) was physically divided by the surgery; the pre-operative unity was a genuine feature of the system's functional integration, which was lost due to the disconnection.

  #### Crux C: Predictive Processing and Phenomenal Character
  (a) **The Case**: Predictive processing models aim to explain perception and cognition. Both sides agree that the ability of these models to account for the specificity and unity of phenomenal character (e.g., why a particular red looks the way it does and is experienced as unified) is a critical test.

