  (e) There is a conceptual distinction between:
      - Interface transparency failure: The system misrepresents its own mechanism as being something it is not (e.g., representing a continuous visual field when the underlying process is discrete sampling).
      - Functional opacity: The system correctly represents its outputs (e.g., the content of perception) but lacks access to the implementation details (how the outputs are produced).

  ### Step 2: Disagreements Table
  We present a table with three points of disagreement. For each, we phrase the position in wording that the respective camp would accept.

  | Issue | Strong Interface Illusionists (SII) | Functional Realist Representationalists (FRR) |
  |-------|-------------------------------------|----------------------------------------------|
  | (i) **Ontological status of phenomenal properties** | Phenomenal properties (e.g., the redness of red) are purely fictive interface elements; they are representational artifacts without corresponding real features in the underlying system. | Phenomenal properties are real features of experience; they are genuinely instantiated representational contents, even if compressed and action-oriented. |
  | (ii) **The "user" of the interface** | The "user" (the subject of experience) is itself a constructed fiction, arising from the interface's self-model and having no independent existence beyond the functional dynamics of the system. | The "user" is a genuinely existing controller, instantiated by the system's functional architecture, and not merely a fictional construct. |
  | (iii) **Interface metaphor and ontological error** | Accepting the interface metaphor entails that conscious mental states systematically involve ontological error: we mistake the interface's representations (e.g., unified self, continuous visual field) for features of reality when they are not. | Accepting the interface metaphor does not entail systematic ontological error; the interface correctly represents the world (within its compression limits) and the phenomenal properties are real properties of the representational state, not errors. |

  ### Step 3: Cruxes
  We present three cruxes. For each, we provide:
  (a) The concrete case, empirical finding, or argument both sides agree bears on it.
  (b) Each side's explicit prediction.

  #### Crux A: Introspective Unreliability
  (a) **The Case**: Widespread introspective unreliability (e.g., inattentional blindness, change blindness, false memories, and illusions such as the rubber hand illusion) is well-documented. Both sides agree that these phenomena occur and are relevant to the nature of consciousness.

  (b) **Predictions**:
  - **SII Prediction**: These phenomena prove that conscious representations are fictions because they show that the contents of consciousness are not direct readouts of reality or neural states but are constructed and often inaccurate, supporting the view that the interface is generating a fictional narrative.
  - **FRR Prediction**: These phenomena merely show that a real representational system is noisy and access-limited; they do not prove that the representations are fictional, only that they are fallible and sometimes fail to accurately represent due to computational constraints.

