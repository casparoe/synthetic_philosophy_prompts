  ### Joint Statement of Adversarial Collaboration:  
  **Strong Interface Illusionism (SII) vs. Functional Realist Representationalism (FRR)**  

  #### 1. Agreed Claims  
  Both SII and FRR endorse the following:  
  1. **Epistemic Constraints**: The brain lacks direct access to its own neural implementation. Conscious access is selective, compressed, and serves action-oriented functions.  
  2. **Predictive Processing Framework**: Hierarchical Bayesian inference and predictive processing offer viable explanations for perception, cognition, and the minimization of prediction error.  
  3. **Interface Metaphor Validity**: The desktop/user-interface metaphor legitimately characterizes conscious experience as an abstraction layer that simplifies underlying computational complexity for efficient behavioral guidance.  
  4. **Anti-Cartesian Commitment**: Both reject "Cartesian theater" models (e.g., a literal inner spectator viewing unified sensory broadcasts).  
  5. **Distinction Availability**: The conceptual separation between **interface transparency failure** (misrepresentation of implementation mechanisms) and **functional opacity** (accurate representation of outputs without implementation access) is coherent and relevant, irrespective of which (if either) applies to consciousness.  

  ---  

  #### 2. Disagreements Table  
  | Issue | Strong Interface Illusionists (SII) | Functional Realist Representationalists (FRR) |  
  |-------|-------------------------------------|-----------------------------------------------|  
  | **(i) Ontological status of phenomenal properties** | Phenomenal properties (e.g., pain’s hurtfulness) are *purely fictive interface elements*: they lack real instantiations and exist only as compressed representations with no corresponding features in the physical world or neural machinery. | Phenomenal properties are *genuinely instantiated representational contents*: their compressed, action-oriented format does not negate their reality as features of experience implemented by the system. |  
  | **(ii) Nature of the "user"** | The "user" (the subject of experience) is a *constructed fiction*: it emerges solely from the interface’s self-model and has no existence beyond its functional role in organizing behavior. | The "user" is a *genuinely existing controller*: it is a real, emergent causal agent instantiated by the system’s functional architecture, not a narrative artifact. |  
  | **(iii) Interface metaphor’s entailment of ontological error** | Accepting the interface metaphor entails *systematic ontological error*: agents falsely believe their mental states (e.g., unity of self) reflect intrinsic realities rather than pragmatic fictions. | Accepting the interface metaphor entails *functional limitation* but *no systematic error*: agents correctly represent contents (e.g., objects) while lacking access to implementation; no illusion of intrinsic reality occurs. |  

  ---  

  #### 3. Cruxes  
  **Crux A: Introspective Unreliability**  
  - **(a) Agreed Case**: Humans exhibit systematic introspective unreliability (e.g., failure to notice visual changes in change-blindness experiments, misattribution of emotional causes).  
  - **(b) Predictions**:  
    - **SII**: This proves consciousness is *fictive*: noise and access constraints reveal the absence of a "real" substrate behind the interface.  
    - **FRR**: This proves consciousness is *real but imperfect*: noise and access constraints are properties of a physical representational system, not evidence for fictionalism.  

  **Crux B: Split-Brain Cases**  
  - **(a) Agreed Case**: Post-commissurotomy, patients display two independent streams of cognition/behavior (e.g., conflicting hand actions), yet report pre-operative unity.  
  - **(b) Predictions**:  
    - **SII**: This shows the pre-operative "user" was an *interface construction*: unity was never physically real, and division reveals its fictive nature.  
    - **FRR**: This shows the pre-operative user was a *real controller*: physical disconnection fragmented a previously integrated system.  

  **Crux C: Predictive Processing and Phenomenal Character**  
  - **(a) Agreed Case**: Predictive processing models explain perception via hierarchical Bayesian inference (e.g., visual filling-in, multisensory integration).  
  - **(b) Predictions**:  
    - **SII**: These models can explain *all* aspects of phenomenal character (e.g., redness, pain qualia) *without* positing real phenomenal properties; specificity is fully accounted for by compression.  
    - **FRR**: These models *cannot* explain phenomenal character’s specificity (e.g., *why* red feels distinct from blue) without real phenomenal properties as intrinsic to representations.  

  ---  
  **Signed,**  
  [Representative, Strong Interface Illusionism]  
  [Representative, Functional Realist Representationalism]  

  ---  
  ### Notes on Constructive Framing  
  - **Clarified Distinction**: The agreed-upon separation of "interface transparency failure" (SII’s focus) and "functional opacity" (FRR’s focus) isolates the dispute: SII argues consciousness *is* a transparency failure, while FRR argues it is mere functional opacity.  
  - **Cruxes as Deciders**: Each crux is designed such that empirical or theoretical progress (e.g., neural correlates of unity in split brains, computational models of qualia) could refute one position’s prediction.  
  - **Verbal Neutrality**: Positions avoid theory-laden jargon (e.g., "illusion" vs. "real" is defined explicitly per camp), minimizing terminological ambiguity.
