  For the knockout punch: their argument assumes a self must be either atomic or illusory. But Hofstadter's "I" is neither - it's a dynamic perspective. Like how a vortex exists without being a "thing." When they demand "real" syntax in neurons, I'll ask what "real" means - if implemented causal powers count, then yes. Recursive neural assemblies are syntax. Time to get Sussman and Steele on neural nets implementing fixed points...

