  ## Money Pump Villanelle

  **Coffee's worth more than sleep**, the steam's my creed,  
  This foggy dawn demands a jolt to start.  
  I trade yawned hours for the buzz I need –  
  Three bucks fly out, but wakefulness is freed.  
  **Sleep's worth more than cash**, this heavy head, this heart  
  That drags like stones through mud. A different deed:  
  I'll pay for shut-eye, skip the caffeine feed,  
  Buy back the peace my choices tore apart.  
  **Cash is worth more than coffee**, logic's dart  
  Pricks through the haze. This crumpled bill I save  
  Instead of sipping, playing wisdom's part.  
  *But wait...* That chill? The craving starts to carve  
  A hollow ache. My focus starts to wave.  
  **Coffee's worth more than sleep**, the steam's my creed.  

  **Sleep's worth more than cash**, this yawn, this leaden need  
  That makes my eyelids sink. Forget the brave  
  Resolve. I'll trade some dollars for the speed  
  Of sinking deep where quiet thoughts proceed.  
  **Cash is worth more than coffee**, strong and grave  
  My purpose feels. That latte? I concede  
  It's just a want. My wallet's where I cleave.  
  **Coffee's worth more than sleep**, the steam's my creed –  
  The grinder's roar, the bitter, needed draught,  
  Temptation wins again, a planted seed.  
  **Cash is worth more than coffee**... *Damn, indeed.*  

  **Coffee's worth more than sleep**... *hold on, I'm caught.*  
  **Sleep's worth more than cash**... *that nap I bought?*  
  **Cash is worth more than coffee**... *fee ignored?*  
  The circle spins – each trade a lesson taught  
  Then lost. My pocket's lighter than I thought.  
  **Coffee's worth more than sleep**, the steam's my creed,  
  **Sleep's worth more than cash**, this fog decreed,  
  **Cash is worth more than coffee**... *cash I'm short.*  
  Same mug, same chair, same stupid, looping greed –  
  Three bucks flew out each time I took the lead  
  Right back to zero. Feels like I've been played  
  By my own choices. What a dumb machine  
  I feed with quarters, trapped inside this scene.  
  **Coffee's worth more than sleep**, the steam's my creed...  
  *...But where'd my damn ten dollars go?*

  ---

  **Notes on the Money Pump Twist:**
  *   **Rotating Refrains:** The three core lines ("Coffee's worth more than sleep," "Sleep's worth more than cash," "Cash is worth more than coffee") cycle through the villanelle positions as requested, creating the circular logic.
  *   **Reasoning & Drain:** Each refrain introduces the *reason* for the next trade-off, mimicking the pump. The "Three bucks fly out" and "fee ignored?" lines explicitly show the monetary loss per cycle.
  *   **Casual American English:** Uses contractions ("damn," "dollars," "bucks," "dumb machine," "hold on," "Damn, indeed," "stupid, looping greed"), natural phrasing ("foggy dawn," "heavy head," "craving starts to carve," "pocket's lighter").
  *   **Structural Payoff:** The final stanza brings all three refrains together *and* explicitly shows the speaker realizing they are back at the start ("Same mug, same chair") and significantly poorer ("where'd my damn ten dollars go?"), landing the money pump concept.
  *   **Rhyme & Repetition:** Tight rhymes (creed/need, start/heart, freed/feed, dart/part, save/wave, etc.) reinforce the cyclical, self-justifying nature of the speaker's thoughts. The repetition feels like someone convincing themselves step-by-step into the trap.
