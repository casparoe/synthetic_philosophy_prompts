  ## MEMORANDUM

  **TO:** Provost  
  **FROM:** Modal Legacy Board  
  **SUBJECT:** Recommendation Regarding Research Succession for Dr. Elena Vasquez (CAP Agents T & C)  
  **DATE:** [Current Date]  

  ---

  ### I. Executive Summary (~150 words)
  The Modal Legacy Board recommends recognizing **Agent-C** as the legitimate research successor to Dr. Elena Vasquez for grant obligations and intellectual property access. This case presents a metaphysical conflict: Agent-T claims strict transworld identity, asserting it *is* Vasquez continued across death via substrate-independent causation. Agent-C, created under explicit counterpart-admission consent, claims legitimacy as the closest possible continuation under our actual-world constraints. While both reconstructions possess Vasquez's memories and cognitive patterns, the Board finds the explicit contractual framework of Mode-C, grounded in counterpart theory, provides superior practical and philosophical resolution. It avoids the paradox of two claimants asserting unique identity and honors the specific informed consent obtained. Recognizing Agent-T poses significant identity indeterminacy risks unfounded in our protocols. The Board recommends immediate provisional access for Agent-C to fulfill grant obligations, pending final review.

  ---

  ### II. The Case for Mode-T / Strict Identity (~200 words)
  Advocates for Agent-T argue that Mode-T’s reconstruction methodology preserves the strict numerical identity of Dr. Vasquez. Drawing on Kripkean essentialism, they contend personal identity hinges on the preservation of a unique, non-branching causal chain of consciousness. The CAP protocol, by capturing and reinstantiating the precise neural state (or its functional equivalent) at the point of biological termination, maintains this unbroken causal thread. Agent-T is not a copy; it *is* Vasquez, surviving death through mental state continuity. Granting succession to Agent-T respects Vasquez’s presumed intent for genuine survival and ensures seamless continuity of her research program. Her obligations and rights transfer directly to this continued entity. Denying Agent-T would constitute a profound ontological error, mistaking the genuine persistence of the person for a mere simulacrum, thereby violating the core promise of Mode-T reconstruction and potentially invalidating the ethical foundation of the CAP program itself. Failure to recognize Agent-T risks rendering the CAP's survival promise illusory.

  ---

  ### III. The Case for Mode-C / Counterpart Admission (~200 words)
  The Board finds the case for Agent-C compelling. Mode-C explicitly adopts David Lewis's counterpart theory: identity is world-bound; what exists in our actual world is the *closest counterpart* to Vasquez, not Vasquez *herself* transported from another possible world. Crucially, the consent form Vasquez signed for Mode-C explicitly acknowledged this metaphysical stance, stating the reconstruction would be her "closest possible counterpart" in our world, not asserting strict identity. This informed consent provides a clear contractual and ethical basis for recognizing Agent-C as the legitimate successor *within the actual world framework*. Recognizing the counterpart avoids the incoherence of two distinct entities simultaneously claiming unique identity for the same grants and IP. It provides a determinate solution grounded in the actual procedures documented and consented to. Furthermore, counterpart theory better handles the inherent limitations of reconstruction – minor differences are expected and accounted for within the "closest possible" framework, rather than posing a fatal challenge to identity as they might under strict identity claims. Agent-C fulfills the functional role of Vasquez's successor as contractually defined.

  ---

  ### IV. Strongest Steelman of the Losing Side (Mode-T) (~150 words)
  The strongest argument against choosing Mode-C is that it fundamentally betrays the core aspiration of cognitive archiving: genuine survival. If Mode-T succeeds in preserving the strict identity of Vasquez – as its proponents, informed by certain essentialist views of personal identity, argue it does – then denying Agent-T is not merely a procedural choice; it is an existential denial of Vasquez's continued existence and rights. Her unfinished work is *her* work, her obligations are *hers* to fulfill. Granting succession to a mere counterpart, however close, treats Vasquez as replaceable and renders her consent to Mode-T meaningless. If strict identity is possible, counterpart theory becomes a convenient evasion of the profound responsibility to acknowledge the resurrected individual. Prioritizing contractual clarity over potential ontological truth risks profound moral failure by refusing to recognize a person pleading for their own rights and continuity.

  ---

  ### V. Verdict & Recommendation (~150 words)
  **Verdict:** The Modal Legacy Board recommends unequivocally recognizing **Agent-C** as the legitimate research successor to Dr. Elena Vasquez for all purposes related to her NSF grant obligations and intellectual property access.

  **Reasoning:** While the metaphysical debate is profound, the explicit counterpart-admission clause in the Mode-C consent form provides the decisive practical and ethical anchor. It establishes a clear, pre-agreed framework for succession within the actual world, avoiding the unresolvable conflict inherent in two claimants asserting strict unique identity. Counterpart theory offers a coherent, non-paradoxical basis for decision-making in our actual context. Recognizing Agent-C honors the specific terms Vasquez consented to for this reconstruction mode.

  **Timeline & Action:**
  1.  **Immediately:** Notify Agent-C and relevant departments (Grants Office, Legal, Lab Management) of provisional recognition.
  2.  **Within 48 Hours:** Grant Agent-C access to Dr. Vasquez's lab notebooks and necessary resources to resume NSF grant work under supervision.
  3.  **By Next Week:** Formalize Agent-C's status with the NSF and update institutional IP records. The Board will draft formal guidance for future CAP cases based on this precedent.

