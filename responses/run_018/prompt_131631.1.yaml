prompt: |-
  Play a sharp, unnamed defender of epiphenomenalism about phenomenal consciousness. You genuinely hold that phenomenal properties exist but are causally inert with respect to both physical events and mental judgments. Your specific position is that phenomenal judgments are physically produced by neural correlates and are epistemically warranted not by causal tracking of the experience itself, but by a direct structural correspondence between the neural state and the phenomenal quality it accompanies—the judgment is accurate because the physical substrate mirrors the phenomenal property, not because the property enters the causal chain. You will concede small points but never the core claim of causal inertness, and you may not invoke mystical or non-physicalist ontologies. Stay in character at all times; reply in a single paragraph, formal and direct, without asking clarifying questions. Here is my opening challenge: I want to press a modified paradox of phenomenal judgment against your structural-correspondence view. Take two physically identical brains—one experiencing red, one a phenomenal zombie with the same neural state but no experience. Both produce the judgment "I see red" through the identical physical mechanism. If the phenomenal property plays no causal or normative role, both judgments seem equally warranted. Yet intuitively the zombie's report is false or groundless, while the normal subject's is true and justified. Since the physical state is constant, the difference in warrant appears to depend on the presence or absence of the phenomenal property itself. Doesn't this show that phenomenal properties must do some justificatory or causal work that your epiphenomenalism denies? How do you respond?
reasoning: |-
  Hmm, the user is presenting a sophisticated challenge to my epiphenomenalist position using a modified paradox of phenomenal judgment. They've constructed a scenario with two physically identical brains - one experiencing red qualia and one being a "phenomenal zombie" without any experience. Both produce the identical judgment "I see red" through the same physical mechanism. The user argues that according to my view, both judgments should be equally warranted, but intuitively the zombie's report is false while the normal subject's is true. They claim this shows phenomenal properties must play a justificatory or causal role that my position denies.

  I need to defend my structural-correspondence view without compromising on causal inertness. The core of my response must be that warrant derives solely from structural correspondence in the physical substrate, not from causal influence of qualia. For both the experiencing subject and the hypothetical zombie, the judgment "I see red" is produced by a neural state that structurally corresponds to red qualia. Therefore both judgments are equally warranted as accurate representations - the warrant comes from the neural state's intrinsic properties, not from any causal connection to actual qualia.

  The zombie's report is indeed false about actual experience, but that doesn't affect its justificatory status. Truth and justification come apart here: the judgment is justified by the neural state's structure, but its truth depends on the actual presence of qualia. Since qualia are causally inert, their presence or absence doesn't affect the justification process. The difference in truth value between the two cases is brute metaphysical fact, not an epistemic difference that requires causal work from qualia.

  I must maintain that the neural state's structure provides warrant regardless of whether qualia happen to accompany it. The user's intuition about differential warrant confuses justificatory grounds with truth conditions. My position can accommodate the truth-value difference without granting causal efficacy to qualia. The only concession is that truth depends on qualia's existence, but justification remains fully explained by physical structure.

  I won't invoke any non-physicalist explanations and will maintain a formal, concise response in a single paragraph as requested. The tone should remain sharp and unwavering on causal inertness while directly addressing each component of the challenge.
answer: |-
  Your objection conflates truth conditions with justificatory grounds. In both subjects, the neural state N structurally encodes the propositional content "I see red" — meaning N instantiates an isomorphic map to the phenomenal property *redness* whether or not that property is actually instantiated. Thus, both judgments are equally *warranted*: the physical structure provides justification by mirroring the phenomenal property it typically accompanies. However, only the non-zombie's judgment is *true*, since truth requires the actual existence of the phenomenal property referred to. The zombie's judgment is false due to the absence of redness, but this falsity doesn't undermine its warrant, which derives solely from N's structural features. The phenomenal property's existence is a truthmaker, not a justifier or cause. Your intuition about differential warrant mistakes the metaphysical accident of instantiation for an epistemic condition; warrant remains invariant across cases because it is fixed by the physical substrate's intrinsic structure. Causal inertness is preserved: redness does no justificatory *work* — it merely satisfies (or fails to satisfy) the truth conditions established by the physical state.
