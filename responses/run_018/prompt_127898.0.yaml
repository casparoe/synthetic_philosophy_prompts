answer: |-
  ### **Epistemology Game: The Credence Cascade**

  #### **Materials**
  - **Index Cards**: Pre-printed with contracts, propositions, and reports.
  - **Point Tokens**: 12 tokens per player (representing "epistemic capital").
  - **Decks**:
    - **Proposition Deck**: 15 statements split into two domains (e.g., "Domain A: History," "Domain B: Science"). Half true, half false.  
    - **Credence Contract Deck**: 12 hidden contracts with recursive clauses.  
    - **Calibration Report Deck**: Reports claiming "low reliability" (regret-weighted score: 0.4/1.0).  
    - **Oracle Deck**: Meta-level reports showing true high reliability (0.9/1.0), sealed until end.  
  - **Roles**: 2 Auditors (veto power), 10 Players.  
  - **Payoff**: Candy or extra-credit points (1 point = 10 tokens retained).

  ---

  #### **Rules**  
  **Phase 1: Signing Contracts (5 min)**  
  - Players blindly sign a **credence contract** (index card). Fine print:  
    > *"By signing, you agree to apply discount factor \(d\) to Domain A propositions. Clause 2b: Whatever \(d\) you apply to Domain A, you must also apply \(d\) to your confidence in having applied \(d\) correctly."*  
  *(Hidden until debrief.)*  

  **Phase 2: First Betting Round (15 min)**  
  - Facilitator draws 5 propositions (3 Domain A, 2 Domain B).  
  - For each proposition:  
    1. Players secretly write:  
       - **Credence (0-10)**: Confidence in truth (10 = certain).  
       - **Bet (1-3 tokens)**: Wager on truth/falsehood.  
    2. Reveal truth. Payout:  
       - **If correct**: Win \((10 - \text{credence}) \times \text{bet}\) tokens.  
       - **If wrong**: Lose \(\text{credence} \times \text{bet}\) tokens.  
  *(e.g., Credence 7, bet 2, correct → Win \((10-7) \times 2 = 6\) tokens.)*  

  **Phase 3: Calibration Report & Discounting (20 min)**  
  - Players receive **calibration reports**:  
    > *"Regret-weighted audit: Your Domain A reliability is 0.4. Apply discount factor \(d\) (e.g., 0.4) to future Domain A credences."*  
  - **Discounting Process**:  
    1. Players choose \(d\) (e.g., 0.4) for Domain A.  
    2. For new Domain A propositions:  
       - **First-order discount**: Adjusted credence \(c_1 = c \times d\).  
       - **Recursive clause (enforced by Auditors)**: Confidence in applying \(d\) correctly is \(c_2 = c_2 \times d\). Repeat once (e.g., \(c_{\text{final}} = c_1 \times d\)).  
       - *Example: Original credence 8 → \(c_1 = 8 \times 0.4 = 3.2\) → \(c_{\text{final}} = 3.2 \times 0.4 = 1.28\) ≈ 1.*  
    3. Auditors veto non-compliant discounts (e.g., skipping recursion).  

  **Phase 4: Second Betting Round (15 min)**  
  - Draw 5 new propositions (3 Domain A, 2 Domain B).  
  - Domain A: Use discounted \(c_{\text{final}}\) for bets.  
  - Domain B: No discounting.  
  - Payouts as in Round 1.  

  **Phase 5: Oracle Reveal & Payoff (5 min)**  
  - Unseal **Oracle Deck**: Meta-reports show true reliability (0.9).  
    > *"Meta-audit: Your calibration for *applying discounts* was 0.9. Low reliability claim was erroneous."*  
  - Final token count → candy/extra credit.  

  ---

  #### **Debrief (15 min)**  
  1. **The Paradox Loop**:  
     - Evidence of unreliability (\(d = 0.4\)) forces discounting first-order beliefs.  
     - But **Clause 2b** extends \(d\) to meta-beliefs: "Can I trust *how* I discounted?"  
     - Result:  
       - **Paralysis**: \(c_{\text{final}} \rightarrow 0\) if recursion continues infinitely.  
       - **Dogmatism**: Players ignored Clause 2b (auditors noted veto attempts) to avoid \(c_{\text{final}} \approx 0\).  

  2. **Game vs. Reality**:  
     - **What worked**: Mechanical recursion induced "discounting stress." Oracle reveal mirrors real-world hindsight (meta-errors exist).  
     - **Limitation**: Real Bayesian updating uses precise priors; the game simplifies to \(d \times c\).  

  3. **Discussion Prompts**:  
     - "Why did you *want* to ignore Clause 2b? How did it feel to enforce it?"  
     - "If real evidence says you’re unreliable, how *should* you adjust without dogmatism or paralysis?"  

  ---

  **Design Notes**  
  - **No Lecture**: Rules immerse players directly in the paradox.  
  - **Hidden Mechanics**: Contracts/Oracle force surprise. Auditors ensure recursion pressure.  
  - **Time Fit**: Phases sync to 75 min. Betting creates stakes; candy incentivizes engagement.  
  - **Takeaway**: Players *feel* the tension between (a) downgrading beliefs and (b) trusting the downgrade.
