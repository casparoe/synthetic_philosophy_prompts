prompt: |-
  I am planning a session for a philosophy reading group—mostly metaphysicians and ethicists with no social-choice background—on judgment aggregation and the discursive dilemma. I need a teaching plan, not the lecture itself: map the dependency order of ideas and why each must precede the next (specifically, why individual consistency must be established before group consistency is defined, and why the premise-based versus conclusion-based distinction must come before the divergence is shown); specify the single carrying case—a three-person committee judging a binary gene-editing proposal across two premises and one conclusion—and state exactly what properties it needs (symmetry across members, no strategic voting, premises that are independently plausible) and what it must avoid (any appearance of hidden weighting or manipulation) so the contradiction feels structural rather than behavioral; list the misconceptions in the order they will arise—first that simple majority rule should prevent contradiction; second that the group is irrational in the same way a confused individual is; third that requiring discussion before voting solves the problem rather than relocating it; and fourth that scaling up members or premises eliminates the tension—identifying which is the deepest and the precise point in the sequence to head off each; propose the understanding check that distinguishes grasping the structural point from memorizing the table, specifically asking them to design an aggregation rule for a four-member group with three premises and report what democratic cost it incurs; and say what I should explicitly refuse to explain at this level—the full formal impossibility proof and its precise relation to Arrow's theorem—providing the exact refusal wording I should use. Keep the response under 350 words.
reasoning: |-
  Okay, the user is planning a philosophy reading group session on judgment aggregation and the discursive dilemma. They need a structured teaching plan, not the lecture content itself. Let me break down their requirements.

  First, they want the dependency order of ideas explained. The sequence must start with individual consistency before group consistency because individuals need coherent beliefs to show how aggregation breaks coherence. Then premise-based vs conclusion-based approaches must be introduced before showing their divergence - otherwise the dilemma's core conflict wouldn't make sense.

  The carrying case needs careful design: a 3-person committee evaluating a gene-editing proposal with two premises and one conclusion. Key requirements include symmetry (equal member weight), no strategic voting (focus on structural issues), independently plausible premises (so conclusion depends on them), and avoiding any perception of manipulation. This ensures the contradiction appears inherent to logic, not behavior.

  For misconceptions, I'll sequence them as they naturally arise: 
  1. Majority rule should prevent contradiction (countered by the doctrinal paradox table)
  2. Group irrationality resembling individual confusion (clarified by showing all individuals are consistent)
  3. Discussion as solution (explained as only moving the aggregation problem upstream)
  4. Scaling eliminates tension (refuted by noting impossibility results persist)

  The deepest misconception is #2 - mistaking structural aggregation failure for individual irrationality. This must be addressed immediately after presenting the paradox.

  The understanding check should test conceptual grasp: asking participants to design an aggregation rule for 4 members/3 premises and identify democratic costs, not just reproduce the table.

  Finally, I'll prepare refusal wording for impossibility proofs and Arrow's theorem links: "Formal impossibility results require technical machinery beyond our scope today, but they confirm this tension persists across aggregation methods."

  The user's clearly experienced - they've identified precise pedagogical pain points. Their emphasis on "structural rather than behavioral" shows they want to avoid misdirection toward voting theory. The gene-editing case choice is smart - topical and vivid for ethicists. I'll keep the plan under 350 words as requested.
answer: |-
  Here’s the structured teaching plan:

  **Dependency Order & Rationale:**  
  1. **Individual consistency:** Establish that rational agents hold logically connected judgments (e.g., if P1 and P2 are true, then C must be true). *Why first?* Without this baseline, group inconsistency could be misattributed to individual error.  
  2. **Group consistency:** Define consistency for the collective outcome. *Why next?* Contrasts individual rationality with collective irrationality under aggregation.  
  3. **Premise-based (PB) vs. conclusion-based (CB) aggregation:** Introduce both methods. *Why before divergence?* Learners need to grasp these distinct democratic approaches *before* seeing how they conflict.  
  4. **Show divergence:** Reveal that PB and CB yield different (and sometimes inconsistent) group outcomes on the same inputs.  

  **Carrying Case:**  
  *Scenario:* 3 philosophers judge a gene-editing proposal:  
  - **P1:** The edit is medically necessary. (Binary: T/F)  
  - **P2:** The edit poses no unjustifiable ecological risk. (Binary: T/F)  
  - **C:** The edit should be approved. (C = P1 ∧ P2)  
  *Required Properties:*  
  - **Symmetry:** Identical voting weight/competence for all 3 members.  
  - **No strategic voting:** Assume sincere judgment expression.  
  - **Independent plausibility:** P1 and P2 are defensible standalone claims; C *depends* on both.  
  *Avoid:* Any asymmetry in presentation or implication that one premise/member is privileged.  

  **Misconceptions & Mitigation Sequence:**  
  1. **"Majority voting prevents contradiction."** *When:* After presenting the paradox table. *Counter:* Show majority on premises forces C=F, while majority on C forces C=T.  
  2. **"The group is irrational like a confused individual."** *When:* Upon seeing inconsistent group outcome. *Counter (deepest):* Emphasize all *individuals* are fully consistent; the irrationality is *emergent* from aggregation.  
  3. **"Discussion before voting solves this."** *When:* During Q&A after divergence. *Counter:* Discussion shifts the aggregation problem to the deliberative group (how to aggregate reasons?), it doesn’t eliminate it.  
  4. **"Scaling up (members/premises) eliminates tension."** *When:* When generalizing implications. *Counter:* Impossibility theorems show the problem persists structurally.  

  **Understanding Check:**  
  *Ask:* "Design an aggregation rule for a 4-member group assessing *three* independent premises (P1, P2, P3) and a conclusion C = P1 ∧ P2 ∧ P3. What democratic trade-off does your rule impose? (E.g., PB risks inconsistent C; CB ignores premise-level majorities)."  

  **Explicit Refusal:**  
  *Wording:* "We must stop short of the full impossibility proof and its exact formal relationship to Arrow’s Theorem. These require a level of technical social-choice machinery that would distract from today’s core conceptual point: that *any* aggregation rule for interconnected judgments faces fundamental trade-offs between capturing the group’s will on reasons versus outcomes."  

