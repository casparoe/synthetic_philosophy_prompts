answer: |-
  Here is the full specification of desiderata for resolving hedonism's heterogeneity problem, with motivations and classifications:

  ---

  ### **Desiderata for Hedonistic Heterogeneity Resolution**

  1.  **Cross-Modal Comparability Criterion**
      *   **Specification:** The theory must provide a principled basis for comparing the *magnitude* or *choice-worthiness* of pleasures arising from radically different sources (e.g., sensory warmth vs. cognitive satisfaction) **without** positing a distinct, phenomenologically identical "pleasure sensation" common to all instances.
      *   **Motivation:** Hedonism requires a unified currency for practical reasoning (e.g., maximizing net pleasure). Without comparability, it cannot guide choices between qualitatively disparate goods like a warm bath or solving a puzzle. The phenomenological disparity rules out simple sensation identity as the basis.
      *   **Status:** **Non-negotiable.** Core to hedonism's function as a normative theory.

  2.  **Unity-in-Diversity Constraint**
      *   **Specification:** The theory must account for the prima facie different *modes* of pleasure (sensory, cognitive, affective) in a way that explains why they are legitimately categorized *as pleasures* (sharing a core property) without reducing them to unrelated phenomena or creating distinct, incommensurable "pleasure kinds."
      *   **Motivation:** Intuitively, we recognize warmth, satisfaction, and relief *as* pleasures, despite differences. Fragmenting pleasure into unrelated kinds abandons hedonism's core monistic claim. The theory must articulate the unifying thread.
      *   **Status:** **Non-negotiable.** Essential for maintaining pleasure as a single fundamental good.

  3.  **Normative Unity Demand**
      *   **Specification:** The theory must explain why pleasure, across all its disparate instances, functions as a **unified normative reason** for action or pursuit. It must show why "it feels good" provides a reason, regardless of the specific qualitative character or source, and why this reason isn't merely homonymous (accidentally sharing the name "pleasure" but differing fundamentally in reason-giving force).
      *   **Motivation:** Hedonism posits pleasure *itself* as the sole ultimate good/reason-provider. If the pleasure in sunlight and the pleasure in a proof provide reasons in fundamentally different ways, or if "pleasure" is just a label for different reason-givers, hedonism collapses into disguised pluralism.
      *   **Status:** **Non-negotiable.** Foundational to hedonism's normative structure.

  4.  **Thin/Thick Accommodation Requirement**
      *   **Specification:** The theory must accommodate both "thin" pleasures (e.g., the mere absence of pain, a baseline comfort, simple relief) and "thick" pleasures (e.g., rich, complex experiences like savoring wine, intense aesthetic absorption) as genuine pleasures, **without** reducing thick pleasures to aggregates of thin sensations or dismissing thin pleasures as merely the absence of displeasure (and hence not truly positive).
      *   **Motivation:** Phenomenologically, both are experienced as positively valenced states contributing to well-being. Reducing thick to thin ignores qualitative richness; reducing thin to non-displeasure ignores its positive contribution. A theory must capture the shared positive valence while respecting the difference in complexity.
      *   **Status:** **Non-negotiable.** Necessary for descriptive adequacy to the full range of pleasant experience.

  5.  **Parasitic/Perverse Pleasure Condition**
      *   **Specification:** The theory must explicitly address pleasures considered "parasitic" (e.g., schadenfreude - pleasure at another's misfortune) or "perverse" (e.g., sadistic pleasure). It must show whether they share the core property identified in benign pleasures (e.g., solving a puzzle, enjoying sunshine) or reveal a structural ambiguity in the concept of pleasure (e.g., being "pleasant" in a different, perhaps problematic, way).
      *   **Motivation:** Such pleasures challenge hedonism's moral implications and internal coherence. If they share the core property, hedonism seemingly endorses them as intrinsically good. If they are structurally different, the theory must clarify the difference without ad hoc exclusion. This tests the theory's robustness and scope.
      *   **Status:** **Preference (but highly significant).** Reflects a tension within hedonist camps: Strict axiologists might insist parasitic pleasures *are* genuine pleasures (emphasizing the core property), while others might argue they represent a distortion or involve different elements (reflecting normative/phenomenological concerns).

  6.  **Neurobiological Consistency Constraint**
      *   **Specification:** The theory must be consistent with the neuroscientific observation that different pleasures (e.g., food, sex, social, cognitive) activate **overlapping but non-identical brain networks** (e.g., involving mesolimbic dopamine, opioid, endocannabinoid systems, orbitofrontal cortex). It must allow for a "family resemblance" or distributed realization of pleasure without collapsing into a neurobiological or conceptual pluralism that abandons unity.
      *   **Motivation:** Neuroscience shows pleasure isn't localized to one "pleasure center" but involves distributed, interacting systems. A theory denying any neural commonality is implausible; one demanding identical neural realization for all pleasures is falsified. The theory must explain how phenomenological/functional unity maps onto neural diversity.
      *   **Status:** **Preference (towards naturalism).** Essential for scientifically informed theories, potentially negotiable for purely conceptual/phenomenological accounts (though at the cost of empirical plausibility).

  ---

  ### **Tension Analysis: Likely Jointly Unsatisfiable Pair**

  **Desideratum 1 (Cross-Modal Comparability) and Desideratum 6 (Neurobiological Consistency)** present the strongest potential tension.

  *   **Why:** Desideratum 1 requires a robust basis for comparing *all* pleasures as instances of a single currency. A strong reading might push towards identifying a *single, measurable common factor* (even if not phenomenological) as the basis for comparison (e.g., a specific neurobiological signal intensity, a functional output magnitude).
  *   **Conflict with 6:** Neuroscience (Desideratum 6) shows that the neural underpinnings of pleasure are diverse and distributed. There is no single, consistent neural signal or circuit whose intensity correlates perfectly with the subjective intensity or value of *all* types of pleasure across contexts and individuals. Reward processing involves multiple interacting systems contributing differently to different pleasures.
  *   **Consequence:** Finding a basis for comparison (1) that relies *directly* on a single neurobiological substrate is likely impossible given (6). A theory satisfying both must therefore ground comparability in something *other* than a direct, simple neurobiological identity – e.g., a complex functional role (like "rewardingness" or "motivational strength") that is *realized by* diverse neural mechanisms (family resemblance), or a higher-order phenomenological property (like "felt positivity" or "desire for continuation") that supervenes on diverse lower-level states. This is challenging but not necessarily impossible; it requires a sophisticated account avoiding reductionism.

  ---

  ### **Brief Note on Classical Theories**

  *   **Qualitative Hedonism (Mill):** Struggles with (1) - How to *compare* higher vs. lower pleasures without a common metric? Fares well on (2) & (4) by acknowledging qualitative differences within unity. Faces challenge on (5) - Are "lower" pleasures akin to parasitic? Handles (3) by linking reason to quality. Lacks resources for (6).
  *   **Quantitative Hedonism (Bentham):** Addresses (1) via intensity/duration, but fails (2) & (4) by ignoring qualitative diversity (reducing thick to quantity of thin). Struggles with (3) if qualitative differences *should* affect reasons. Easily includes parasitic pleasures (5). Ignores (6).
  *   **Functionalism/Dispositionalism (e.g., Sidgwick-inspired, modern accounts):** Strongest on (1) (comparability via motivational strength/learning), (2) & (3) (unity via functional role - e.g., "conscious state that is desired intrinsically/wanted to continue"). Can handle (4) (different realizers of the function). Flexible on (5) (can include or exclude based on functional role context). Best positioned for (6) (functional role realized by diverse neural substrates). Main challenge is capturing the *felt* dimension adequately for some.

  This specification provides a rigorous framework for evaluating any proposed solution to the heterogeneity problem, highlighting both the core demands of hedonism and the significant conceptual pressures it faces.
