  Neuroscientific constraints. Different pleasures use overlapping brain circuits but aren't identical. The theory must allow for family resemblance without collapsing into pluralism. Non-negotiable because empirical evidence can't be ignored. A purely phenomenological view might struggle here.

  Now, identifying tensions. Cross-modal comparability and phenomenological unity (from 1 and 2) might conflict with neuroscientific diversity (6). If comparability relies on a common neural substrate, but circuits are varied, that's a problem. Functional comparability could work, but might not satisfy purists who want a unified feel.

  Also, parasitic pleasures (5) and normative unity (3) might clash. Including schadenfreude as a reason for action could be ethically problematic. A theory might need to explain why some pleasures aren't reasons, risking fragmentation.

  I should note where classical theories stand. Qualitative hedonism (Mill) uses higher/lower pleasures but struggles with comparability. Quantitative (Bentham) ignores qualitative differences. Functionalism might handle comparability via desire but could miss the felt experience.

