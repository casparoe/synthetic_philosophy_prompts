  Next, distinguishing sensory, cognitive, and affective pleasures without fragmenting them. If we split them too much, pleasure isn't unified anymore. A theory needs a common core, maybe a disposition or functional role. Essentialists might insist on a felt quality, but that risks not capturing all types. This is probably non-negotiable too, as fragmentation undermines hedonism's core claim.

  Unified normative reason is crucial. Why do all pleasures count as reasons for action? If they're just homonyms, hedonism falls apart. The theory must show a shared property that grounds their reason-giving force. Functionalists have an edge here, linking to desire or well-being. Non-negotiable because without this, hedonism isn't coherent.

  Accommodating thin and thick pleasures. Thin pleasures like absence of pain vs. rich experiences like tasting wine. Reducing one to the other misses something. The theory must recognize both without oversimplifying. This might be non-negotiable to cover the full spectrum of pleasure experiences.

