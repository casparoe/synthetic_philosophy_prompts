answer: |-
  This phenomenon doesn't have a single, universally accepted name, but it can be precisely defined and distinguished from related concepts. The core idea is **Domain-Sensitive Aggregation Resistance (DSAR)**.

  Here's the conceptual carving you requested:

  1.  **The Phenomenon (DSAR Defined):**
      *   **Core:** The tendency to resist aggregating numerous, phenomenally *opaque* micro-harms (like barely-noticeable, fleeting cognitive glitches or low-level background epistemic inefficiencies) into a morally significant total burden, while readily accepting the aggregation of numerous phenomenally *transparent* micro-harms (like barely-noticeable physical irritations or somatic twinges) of equivalent *subjective intensity per bearer* into a significant total burden.
      *   **Key Features:**
          *   *Sub-Threshold:* Both harm types are individually below the threshold of being considered a significant complaint or motivator for action by the bearer.
          *   *Distributed:* No single victim suffers a severe focal harm; the potential moral weight arises solely from summation.
          *   *Stipulated Equivalence:* The *per-instance subjective badness* is stipulated to be identical (e.g., both a dust-speck irritation and a momentary confusion rate a "1" on a discomfort scale for the experiencer).
          *   *Asymmetry by Domain:* Resistance to aggregation is significantly stronger for harms occurring in the epistemic/conceptual domain compared to the somatic/physical/sensory domain, even when persistence and cumulation are identical.
          *   *Phenomenal Opacity vs. Transparency:* The asymmetry hinges on how directly and vividly the harm manifests in conscious experience. Physical irritations are "felt" directly. Epistemic micro-harms (minor confusion, fleeting calculation error, very subtle loss of focus) often lack this immediate sensory signature; their negative valence might be inferred cognitively rather than *felt* somatically.

  2.  **Distinguishing it from Neighboring Concepts:**
      *   **Scope Neglect / Insensitivity:** This is a *general* failure to respond proportionally to the *scale* of harm (number of victims). DSAR is *asymmetric across harm types* for the *same scale*. People might neglect *both* aggregations compared to a single severe harm, but they neglect the *epistemic* aggregation *more* than the *physical* aggregation. Scope neglect is about magnitude blindness; DSAR is about *differential valuation based on harm domain* despite equivalent per-capita magnitude and total scale.
      *   **Person-Affecting Views / Restrictions:** These prioritize harms to *specific, identifiable individuals* over statistical lives or diffuse burdens. DSAR occurs *even when* the harms are distributed across identifiable individuals (your 10 billion people). The resistance isn't primarily because victims are "statistical," but because the *nature* of the harm itself (epistemic opacity) makes its aggregation seem less morally compelling. Person-affecting views resist aggregation *in general*; DSAR resists it *specifically for opaque harms*.
      *   **Non-Identity Problem:** This concerns harms to individuals whose very existence depends on the allegedly harmful act. DSAR involves harms to *existing, identifiable people* experiencing minor negative states. The issue isn't whether they are made worse off than they would otherwise *not* exist, but whether the sum of their minor opaque harms counts significantly. Non-identity is about counterfactuals and identity; DSAR is about the perceived aggregability of extant harms based on their phenomenal character.
      *   **Standard Torture-vs-Dust-Specks:** This classic problem pits a single severe harm against an astronomical number of trivial harms, exploring the limits of aggregation *itself* and potential lexical thresholds. DSAR operates *within* the realm of sub-threshold harms, comparing the aggregability of *different types* of trivial harms (physical vs. epistemic) with *identical per-capita intensity and scale*. It reveals a *further asymmetry* beyond simple aggregation debates.

  3.  **Boundary Conditions & Where Edges Fail:**
      *   **Requires Sub-Threshold Harms:** If the harms exceed a noticeable threshold for individuals (e.g., moderate pain vs. significant confusion), standard aggregation debates apply, and DSAR might weaken as the harms become salient regardless of domain.
      *   **Requires Phenomenal Opacity:** If an "epistemic" harm has a strong, direct phenomenal component (e.g., a sharp, distracting mental pang accompanying confusion, or a noticeable feeling of frustration), resistance to aggregation may decrease, blurring the line with somatic harms.
      *   **Depends on Description & Salience:** Framing matters. Describing epistemic harms in more vivid, sensory-like terms ("a sudden, jarring hiccup in your train of thought") might reduce DSAR compared to abstract descriptions ("a suboptimal cognitive state").
      *   **Not Purely About Measurability:** While somatic harms are often easier to measure objectively, DSAR persists even when the *subjective intensity* is stipulated as equal. The resistance seems rooted more in the *quality* of the experience (its directness in awareness) than just its quantifiability.
      *   **Potential Confound - Value Differences:** Some might genuinely value freedom from minor physical irritation *more* than freedom from minor cognitive glitch, independent of aggregation. DSAR becomes distinct when we *stipulate* equivalent per-capita disvalue and focus purely on the *resistance to summing* the opaque instances. If someone argues the epistemic harm *isn't* actually equivalently bad per instance, that's a different objection, not DSAR.
      *   **Cumulation Matters, But Asymmetrically:** While both scenarios involve cumulation, DSAR suggests that the *moral weight* of cumulated opaque harms (e.g., total "confusion-minutes" lost) is discounted *more heavily* than the identical cumulation of transparent harms (e.g., total "irritation-minutes").

  **In essence:** Domain-Sensitive Aggregation Resistance (DSAR) captures the specific intuition that phenomenally opaque micro-harms (like minor, fleeting epistemic states) resist being summed into a morally compelling total burden in a way that phenomenally transparent micro-harms (like minor physical irritations) of equivalent per-capita intensity do not, even when distribution, scale, and cumulation are identical. It highlights a bias in moral calculus based on the *mode of presentation* of the harm in conscious experience, distinct from scope neglect, person-affecting restrictions, or the non-identity problem.
