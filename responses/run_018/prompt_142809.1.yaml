prompt: |-
  write me the desiderata for any theory of moral responsability that claims Frankfurt cases don't kill the principle of alternative possibilities. I want the actual spec: the cases it must cover (classic Frankfurt, nested ones where the intervener is also monitored, and ones where the agent falsely believes they have live options), the distinctions it can't collapse (sourcehood vs leeway, blame vs punishment), and any empirical constraints from neuroscience on unconscious action initiation it has to respect. Flag hard constraints vs camp preferences. Then briefly score sourcehood theories, hierarchical compatibilism, and this injected hybrid I'm calling 'epistemic leeway' -- responsibility only requires alternatives you could access with reasonable epistemic effort -- against your list. No citations or reading lists, just the criteria and the quick scorecard. Keep it focused and don't wander into libertarian metaphysics unless it's actually required by one of the desiderata.
reasoning: |-
  Okay, the user wants a detailed specification for theories of moral responsibility that can withstand Frankfurt cases. Let me start by recalling what Frankfurt cases are—they're scenarios designed to challenge the Principle of Alternative Possibilities (PAP), which states that moral responsibility requires the ability to do otherwise. In a classic Frankfurt case, an agent decides to act on their own, but there's a counterfactual intervener (like Black with his device) who would have forced the action if the agent hadn't chosen it. The agent is responsible even though they couldn't have done otherwise because the intervener didn't actually intervene.

  The user specified several things: desiderata covering different Frankfurt variants (classic, nested, false belief cases), preserving key distinctions (sourcehood vs. leeway, blame vs. punishment), and respecting neuroscience constraints (like Libet's experiments on unconscious initiation of actions). They also want a scorecard evaluating sourcehood theories, hierarchical compatibilism, and their proposed "epistemic leeway" approach.

  First, I need to outline the desiderata clearly. The hard constraints are non-negotiable: any theory must handle the Frankfurt cases without collapsing essential distinctions. The camp preferences are softer, like avoiding obscure metaphysics. For Frankfurt cases, the classic case is straightforward. Nested cases add layers—like an intervener who is also being monitored. False belief cases involve agents who think they have options but don't, which tests whether the belief in alternatives affects responsibility.

  Key distinctions: Sourcehood (the action originates from the agent) vs. leeway (having alternative possibilities). Blame (attributing responsibility) vs. punishment (consequences based on societal rules). Collapsing these could lead to conceptual confusion. Neuroscience constraints are crucial; Libet's findings suggest actions start unconsciously before conscious decision, so any theory must account for that without making consciousness irrelevant.

  Now, scoring the theories. Sourcehood theories (like Fischer and Ravizza's) focus on the agent's control over the action's source. They handle Frankfurt cases well by emphasizing sourcehood over alternatives. But they might struggle with false belief cases if the agent's belief in alternatives is tied to responsibility. Neuroscience is a challenge if unconscious initiation undermines control.

  Hierarchical compatibilism (like Frankfurt's own) involves aligning desires with higher-order volitions. It works for classic Frankfurt but gets messy with nested cases where higher-order desires might be manipulated. False belief cases are tricky if the agent's hierarchy is based on false premises. Neuroscience issues persist if higher-order reflections occur too late.

  Epistemic leeway requires accessible alternatives through reasonable effort. It handles false belief cases better because responsibility depends on epistemic access, not actual alternatives. However, classic Frankfurt cases are a problem since the agent couldn't access alternatives, yet we still hold them responsible. Neuroscience might be less problematic if epistemic effort doesn't rely on conscious initiation.

  The user might be developing their own theory or critiquing existing ones. Their mention of "injected hybrid" suggests innovation, so they need clear criteria to test their idea. They want to avoid libertarian metaphysics unless necessary, so I should ensure desiderata don't force that. They might value practical applicability over theoretical purity, hence the emphasis on empirical constraints and avoiding collapsed distinctions.

  Deep needs: They likely seek a robust framework that accommodates real-world complexities (like false beliefs and unconscious processes) without relying on inaccessible alternatives. Their hybrid theory attempts a middle ground, so evaluating it against strict criteria helps validate its viability. They might also want to position their theory as a solution to gaps in existing approaches, hence the detailed scorecard.
answer: |-
  Here are the desiderata for a Frankfurt-resistant theory of moral responsibility, followed by a quick scorecard:

  **Desiderata for a Frankfurt-Resistant Moral Responsibility Theory**

  **I. Hard Constraints (Must-Haves):**
  1.  **Classic Frankfurt Immunity:** Must explain why Jones (or equivalent) is responsible in the *original Frankfurt case* (Black monitors, intervenes *only* if Jones shows sign of choosing B, Jones chooses A on his own) **without** requiring Jones could have actually done otherwise at the moment of choice.
  2.  **Sourcehood Primacy:** Must prioritize *sourcehood* (the action issues from the agent's own mechanisms/endorsement in a sufficiently deep way) as the core grounding for responsibility in Frankfurt scenarios, *without* collapsing sourcehood into leeway.
  3.  **Blame/Punishment Distinction:** Must maintain a clear conceptual distinction between *blameworthiness* (attributing responsibility for the action/deed) and *punishment* (social/legal consequences), especially when actual alternatives are absent. Punishment may require additional considerations (deterrence, safety) beyond basic blame.
  4.  **Neuroscience Constraint:** Must be compatible with findings (e.g., Libet-style experiments) suggesting unconscious neural precursors to conscious intention/decision initiation **without** automatically exonerating the agent. Cannot require conscious initiation *prior* to unconscious precursors for basic responsibility.

  **II. Case Coverage (Must Explain):**
  5.  **Nested Frankfurt Cases:** Must handle cases where the primary intervener (Black) is *also* monitored by a secondary mechanism (e.g., Black's superior, Grey) who would intervene to stop Black if *he* showed sign of "going rogue" and *not* intervening appropriately. Responsibility attribution for Jones shouldn't hinge on Black's potential freedom.
  6.  **False Belief Cases:** Must explain why an agent who *falsely believes* they have alternative possibilities (due to elaborate deception) but is actually in a Frankfurt-style scenario (no real alternatives) is *still* responsible *if* they act based on their own reasons/endorsement.

  **III. Camp Preferences (Should-Haves, Not Strictly Required):**
  7.  **Avoid Obscure Metaphysics:** Should not rely on contentious libertarian metaphysics (e.g., non-causal agent causation, irreducible indeterminism) unless demonstrably necessary to meet hard constraints.
  8.  **Intelligible Mechanism:** Should provide a plausible and relatively clear account of the psychological mechanisms grounding sourcehood (e.g., identification, reasons-responsiveness, judgment sensitivity).
  9.  **Robustness:** Should ideally account for responsibility in non-Frankfurt scenarios as well.

  **Scorecard:**

  1.  **Sourcehood Theories (e.g., Fischer & Ravizza's "Guidance Control"):**
      *   **HC1 (Classic Frankfurt):** PASS (Guidance control based on reasons-responsiveness of mechanism).
      *   **HC2 (Sourcehood Primacy):** PASS (Core strength).
      *   **HC3 (Blame/Punish Distinction):** PASS (Can maintain distinction).
      *   **HC4 (Neuroscience):** STRUGGLE (Needs careful interpretation; if unconscious precursors bypass the *relevant* reasons-responsive mechanism, it's problematic).
      *   **CC1 (Nested Cases):** PASS (Focuses on agent's mechanism, not intervener's).
      *   **CC2 (False Belief):** PASS (Actual access to alternatives irrelevant; source matters).
      *   **CP7 (Avoid Metaphysics):** PASS (Compatibilist).
      *   **CP8 (Mechanism):** PASS (Reasons-responsiveness mechanism).
      *   **CP9 (Robustness):** PASS (Designed broadly). **OVERALL:** Strongest performer against this list.

  2.  **Hierarchical Compatibilism (e.g., Frankfurt, early Dworkin):**
      *   **HC1 (Classic Frankfurt):** PASS (Responsible if acting on 1st-order desire endorsed by 2nd-order volition).
      *   **HC2 (Sourcehood Primacy):** AMBIGUOUS (Source is identification, but identification itself can be manipulated; potential regress problem threatens sourcehood depth).
      *   **HC3 (Blame/Punish):** PASS (Can maintain).
      *   **HC4 (Neuroscience):** STRUGGLE (Similar to Sourcehood; requires identification/higher-order reflection not rendered epiphenomenal).
      *   **CC1 (Nested Cases):** PASS (Focuses on agent's hierarchy).
      *   **CC2 (False Belief):** PROBLEMATIC (If false belief stems from manipulation *of the hierarchy itself*, sourcehood may be undermined. If hierarchy is intact, might PASS).
      *   **CP7 (Avoid Metaphysics):** PASS (Compatibilist).
      *   **CP8 (Mechanism):** PASS/FAIL (Clear mechanism proposed, but problems like "wantonness" and regress are well-known weaknesses).
      *   **CP9 (Robustness):** MODERATE (Struggles with manipulation and addiction cases). **OVERALL:** Solid on Frankfurt cases, weaker on sourcehood depth and robustness due to hierarchy problems.

  3.  **Epistemic Leeway ("Alternatives accessible via reasonable epistemic effort"):**
      *   **HC1 (Classic Frankfurt):** FAIL (Jones had *no* accessible alternatives; reasonable effort wouldn't reveal Black/device. Theory must say Jones is *not* responsible, contradicting Frankfurt intuition).
      *   **HC2 (Sourcehood Primacy):** FAIL (Leeway, even epistemic, is prioritized over sourcehood as the necessary condition).
      *   **HC3 (Blame/Punish):** PASS (Can maintain distinction).
      *   **HC4 (Neuroscience):** PASS (Epistemic effort doesn't directly rely on conscious initiation timing).
      *   **CC1 (Nested Cases):** FAIL (Same as HC1 - no accessible alternatives).
      *   **CC2 (False Belief):** PASS? (Agent *believes* they have accessible alternatives due to deception; reasonable effort might *not* reveal the trap. But if the belief satisfies "accessibility" *for them*, maybe PASS. Highly dependent on definition of "reasonable effort" and "accessibility").
      *   **CP7 (Avoid Metaphysics):** PASS (No inherent libertarianism).
      *   **CP8 (Mechanism):** MODERATE (Mechanism (epistemic effort) is clear, but its link to responsibility is weak per HC1/2 failure).
      *   **CP9 (Robustness):** MODERATE (Works for normal cases, fails classic Frankfurt). **OVERALL:** Fails the core Frankfurt test (HC1) and sourcehood primacy (HC2). Handles false belief cases *if* the false belief counts as "access," but this is controversial and doesn't rescue the core failure.
