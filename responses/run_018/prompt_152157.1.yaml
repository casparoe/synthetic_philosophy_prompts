prompt: |-
  I serve as the clinical ethics officer at a residential treatment facility specializing in severe substance-use disorders with co-occurring impulse-control conditions, and our state recently mandated that every eligible admission include an evaluation for a voluntary precommitment protocol—essentially a Ulysses-style contract in which a patient, during a period of assessed capacity, binds their future self to specific clinical restrictions (refusing discharge, accepting medication holds, blocking supplier contact) that activate automatically during a predicted crisis window. At present my team drafts these protocols case-by-case, but legal review and patient advocates have begun challenging them on inconsistent grounds: some contracts are attacked as disguised coercion, others are voided in crisis despite proper execution, and we have no shared framework for deciding when a binding mechanism genuinely preserves autonomy rather than substituting the institution’s judgment for the patient’s. I need a reusable decision procedure—an ordered checklist with explicit stop conditions and judgment-call flags—that staff can run in approximately thirty minutes per case, without requiring on-site legal counsel but with a mandatory sign-off line, translating the philosophical distinction between a Ulysses contract (a future-self-binding instrument designed to protect a long-range preference from temporary distortion) and constitutional precommitment (a structural rule that constrains available options regardless of present preference) into operational criteria that a non-philosopher can apply consistently.

  The procedure should ask, in sequence: (1) whether the patient currently demonstrates procedural autonomy—understood here not merely as cognitive capacity but as the ability to revise preferences through a legitimate reflective process—versus whether the contract merely locks in a past substantive preference; (2) whether the binding mechanism targets a specific anticipated failure mode (e.g., acute withdrawal, manic escalation) rather than imposing a blanket restriction; (3) whether the contract includes a dead-hand provision—an irreversible institutional hold that outlasts any change in the patient’s values or circumstances—versus a reversible trigger with a defined cost or delay; (4) whether revocation during crisis is structurally possible and, if so, whether it requires a second-order evaluation rather than an instantaneous override; and (5) whether the protocol, if enforced, would produce an outcome that the patient’s current crisis-state self rejects but that aligns with their stable, pre-crisis value system, with clear markers for when this alignment is ambiguous. At each step, specify what counts as a sufficient answer, where the procedure terminates with a clear do-not-implement or refer-to-ethics-board decision, and where judgment cannot be eliminated—particularly in weighing whether a future preference reversal reflects authentic value change or merely symptomatic distortion. Then apply the procedure to three cases: first, a patient with alcohol-use disorder who binds herself to a thirty-day discharge-block and disulfiram administration upon readmission of alcohol on breath; second, a patient with bipolar I disorder in remission who contracts to maintain lithium and block discharge requests during manic phases, but who now, in a manic episode, demands immediate release; and third, a case where the procedure yields an answer the clinical team will resist—perhaps a contract formed during a prolonged depressive episode that binds the patient to refuse all future antidepressant changes, where the procedure identifies a dead-hand structural error and mandates voiding despite the team’s belief that enforcement would prevent harm.

  The procedure must be honest about its limits: it cannot resolve deep metaphysical disputes about the persistence of personal identity across severe mental-state shifts, it cannot substitute for legal review of statutory rights, and it should flag rather than conceal the point at which autonomy-preservation becomes paternalism masked as precommitment. It should also distinguish between soft precommitment (reversible with a cooling-off period) and hard precommitment (institutionally enforced regardless of present objection), and it should include a final sign-off line that records which steps were satisfied by evidence and which were satisfied by clinical judgment alone. Please present this as a practitioner-facing flowchart in words, with the test questions in order, the decision nodes, the three worked applications—including the unwelcome result in the third case—and an explicit statement of what the procedure is not designed to do.
reasoning: |-
  We are creating a decision procedure in the form of an ordered checklist with explicit stop conditions and judgment-call flags. The procedure is designed to be run in about 30 minutes per case by clinical staff without on-site legal counsel but with a mandatory sign-off line. The goal is to evaluate whether a proposed precommitment protocol is a legitimate Ulysses contract (preserving autonomy) or an unconstitutional precommitment (imposing the institution's judgment).

  The procedure will address five questions in sequence:

  1. **Procedural Autonomy**: Does the patient currently demonstrate procedural autonomy (ability to revise preferences through a legitimate reflective process) rather than the contract merely locking in a past substantive preference?
  2. **Targeted Failure Mode**: Does the binding mechanism target a specific anticipated failure mode (e.g., acute withdrawal, manic escalation) rather than imposing a blanket restriction?
  3. **Dead-Hand Provision**: Does the contract avoid a dead-hand provision (an irreversible hold that outlasts any change in the patient’s values or circumstances) and instead have a reversible trigger with a defined cost or delay?
  4. **Revocation During Crisis**: Is revocation during crisis structurally possible? If so, does it require a second-order evaluation (not an instantaneous override)?
  5. **Outcome Alignment**: If enforced, would the protocol produce an outcome that the patient’s current crisis-state self rejects but that aligns with their stable, pre-crisis value system? And are there clear markers for when this alignment is ambiguous?

  At each step, we specify:
  - What counts as a sufficient answer.
  - Stop conditions (i.e., when to terminate with a "do not implement" or "refer to ethics board").
  - Where judgment is required.

  Additionally, the procedure must:
  - Distinguish between soft precommitment (reversible with a cooling-off period) and hard precommitment (institutionally enforced regardless of present objection).
  - Include a final sign-off line that records which steps were satisfied by evidence and which by clinical judgment alone.

  We then apply the procedure to three cases.

  ---

  **Decision Procedure: Precommitment Protocol Evaluation Checklist**

  **Step 1: Procedural Autonomy**
     - **Question**: Does the patient, at the time of contract formation, demonstrate the ability to engage in a legitimate reflective process about their values and preferences? (This is not just about cognitive capacity but about the process of preference formation and revision.)
     - **Sufficient Answer**: Evidence that the patient has considered alternatives, weighed consequences, and can articulate how the contract serves their long-term goals. The contract must not be a mere recording of a past preference without current reflection.
     - **Stop Condition**: If the patient is unable to engage in reflection (e.g., due to acute symptoms, coercion, or cognitive impairment) or if the contract is based solely on a past preference without current endorsement, then **terminate and do not implement** (or revise the contract formation process). If there is uncertainty about the authenticity of the reflection, flag for ethics board review.
     - **Judgment Call**: Determining the quality of the reflective process (e.g., is it deep enough?) and whether the patient is under undue influence (even subtle). Note: This step is about the process at the time of signing, not the content.

  **Step 2: Targeted Failure Mode**
     - **Question**: Does the contract specify a particular, anticipated failure mode (e.g., "during severe alcohol withdrawal craving" or "when manic symptoms reach YBOCS score > X") and restrict only actions related to that mode?
     - **Sufficient Answer**: The contract must define a clear trigger condition (based on objective markers if possible) and the restrictions must be limited to mitigating that specific failure. Blanket restrictions (e.g., "any time the patient is upset") are insufficient.
     - **Stop Condition**: If the contract does not target a specific failure mode or if the restrictions are overly broad (not narrowly tailored), then **terminate and do not implement** (or require revision to narrow the scope). If the failure mode is not supported by clinical evidence (e.g., no history of such an event), refer to ethics board.
     - **Judgment Call**: Evaluating whether the failure mode is well-defined and whether the restrictions are proportional and specific.

  **Step 3: Dead-Hand Provision**
     - **Question**: Does the contract avoid an irreversible institutional hold that persists regardless of changes in the patient's values or circumstances? Instead, does it have a reversible trigger with a defined cost or delay (i.e., soft precommitment)?
     - **Sufficient Answer**: The contract must allow for revocation (even during the crisis) but with a mechanism that prevents impulsive revocation (e.g., a cooling-off period, a review by an independent party, or a time delay). A dead-hand provision (e.g., "this restriction cannot be lifted for 30 days no matter what") is a red flag.
     - **Stop Condition**: If the contract includes a dead-hand provision (irreversible once triggered), then **terminate and do not implement** (or revise to include reversibility). If the revocation mechanism is absent or inadequate (e.g., instantaneous override without any hurdle), then refer to ethics board (as it may not be binding enough).
     - **Judgment Call**: Assessing the adequacy of the revocation mechanism (e.g., is the cooling-off period long enough? Is the review process independent?).

  **Step 4: Revocation During Crisis**
     - **Question**: If revocation during the crisis is structurally possible (as required in Step 3), does the revocation process require a second-order evaluation (e.g., an assessment by a clinician not involved in care, a review panel, or a waiting period) rather than an instantaneous override?
     - **Sufficient Answer**: The revocation process must include a step that forces reflection or evaluation (e.g., a 24-hour waiting period, a consultation with an ethics officer, or a capacity assessment). The patient cannot have an immediate "undo" button.
     - **Stop Condition**: If revocation is instantaneous (no hurdle), then the contract is not a binding precommitment and **terminate and do not implement** (or revise to add a hurdle). If the revocation mechanism is absent (contradicting Step 3) then stop (already failed Step 3).
     - **Judgment Call**: Determining whether the revocation hurdle is sufficient to prevent impulsive revocation but not so burdensome as to be practically impossible.

  **Step 5: Outcome Alignment**
     - **Question**: If the contract were enforced during the crisis, would the outcome be one that the patient in crisis rejects but that aligns with the stable, pre-crisis value system? And are there markers to resolve ambiguity?
     - **Sufficient Answer**: Evidence from the patient's own expressed values (e.g., in past statements, advanced directives, or during stable periods) that the enforced outcome is consistent with their enduring values. Ambiguity markers: if the patient has expressed conflicting values during stability, or if the patient's values have recently changed in a way that seems authentic (not symptom-driven), then alignment is unclear.
     - **Stop Condition**: If the outcome does not align with the patient's stable values (e.g., the patient has consistently valued sobriety but now, in crisis, the contract forces a treatment they never valued) or if the alignment is ambiguous (and cannot be resolved by available evidence), then **refer to ethics board** (because enforcing might be paternalistic). If the outcome aligns with the crisis-state preferences (then why have a contract?) that is also a red flag and terminate.
     - **Judgment Call**: Deciding whether a value change is authentic (e.g., due to new information, life events) or a symptom of the disorder. This is the hardest judgment.

  **Final Sign-off**:
     - For each step, record:
          - [ ] Satisfied by evidence (document the evidence)
          - [ ] Satisfied by clinical judgment (explain the reasoning)
     - Mandatory sign-off by at least two staff members (one clinical, one non-clinical if available, e.g., ethics officer, social worker) and a statement: 
          "We, the undersigned, have applied the Precommitment Protocol Evaluation Checklist to this case. We attest that the above steps were completed and the protocol is approved for implementation [or not approved, with reason]."

     - Also, classify the contract as:
          - **Soft Precommitment**: If revocation is possible with a defined hurdle (cooling-off period, review) — RECOMMENDED.
          - **Hard Precommitment**: If revocation is not possible once triggered (should be avoided unless exceptional and approved by ethics board).

  **Explicit Limitations of the Procedure**:
     - This procedure does not resolve deep philosophical questions about personal identity across mental-state shifts.
     - It does not substitute for legal review of the patient's statutory rights (e.g., right to refuse treatment, discharge rights) — legal consultation is still required for the contract's enforceability under state law.
     - It flags but does not resolve the point at which autonomy-preservation becomes paternalism; that determination requires ethics board input when flagged.
     - It does not assess the clinical appropriateness of the restrictions (that is a separate clinical decision).

  ---

  **Application to Three Cases**

  **Case 1: Patient with Alcohol-Use Disorder**
     - Contract: Upon readmission with alcohol on breath, she binds herself to a 30-day discharge-block and mandatory disulfiram administration.
     - **Step 1**: Patient is in a period of sobriety and capacity. She articulates that during past relapses, she has left AMA and stopped medication, leading to harm. She reflects on wanting to prevent that. → **Satisfied by evidence** (documented reflection).
     - **Step 2**: Targets a specific failure mode: relapse (alcohol on breath) and the associated impulse to leave and avoid medication. → **Satisfied** (narrowly tailored).
     - **Step 3**: The 30-day block and medication hold are triggered. Is there a revocation mechanism? The contract as described does not mention one. → **Stop Condition**: Without a revocation mechanism, it is a dead-hand provision. **Result: Do not implement in current form.** Revise to include a revocation process (e.g., after 72 hours, the patient can request a review by an independent clinician to reassess).

  **Case 2: Patient with Bipolar I Disorder**
     - Contract: During remission, the patient contracts to maintain lithium and block discharge requests during manic phases. Now, in a manic episode, the patient demands immediate release.
     - We are evaluating the contract (formed during remission) at the time of implementation (during mania).
     - **Step 1 (at formation)**: We assume the patient, in remission, had procedural autonomy and reflected on past manic episodes. → **Satisfied**.
     - **Step 2**: Targets a specific failure mode: manic episodes (defined by clinical criteria). → **Satisfied**.
     - **Step 3**: The contract must have a revocation mechanism. Suppose the contract allows revocation after a 24-hour waiting period and evaluation by a psychiatrist not on the treatment team. → **Satisfied** (if such a mechanism exists). If not, stop as in Case 1.
     - **Step 4**: Revocation requires a 24-hour wait and independent evaluation (second-order). → **Satisfied**.
     - **Step 5**: The outcome (forced lithium and blocked discharge) is rejected by the current manic self. Does it align with stable values? The patient, when stable, has consistently valued stability and avoiding mania. → **Satisfied** by evidence (past statements, advanced directives). The contract can be enforced. The patient can attempt revocation, but the hurdle must be followed.

  **Case 3: Contract Formed During Prolonged Depressive Episode**
     - Contract: The patient binds themselves to refuse all future antidepressant changes (i.e., insists on maintaining the current medication regimen regardless of future circumstances).
     - **Step 1**: Formed during a depressive episode. We must assess procedural autonomy at that time. Depression can impair reflection and lead to hopelessness and rigidity. If the patient was unable to consider alternatives (e.g., because of cognitive distortions of depression) → **Stop Condition: Do not implement** (due to impaired procedural autonomy). Even if we proceed:
     - **Step 2**: Does it target a specific failure mode? The contract is a blanket restriction against any change, not tied to a specific crisis (e.g., not just during depressive episodes). → **Stop Condition: Do not implement** (too broad).
     - **Step 3**: It is a dead-hand provision: no revocation mechanism and it applies indefinitely. → **Stop Condition: Do not implement**.
     - **Step 5**: The outcome (no antidepressant change) might be rejected by the patient in a future state (e.g., when in remission and experiencing side effects). The stable self? The contract was formed in depression, which may not represent stable values. The patient's stable self might value flexibility. → Ambiguous, but already stopped at Step 1, 2, or 3.

     - **Unwelcome Result**: The procedure mandates voiding the contract. The clinical team believes enforcement would prevent harm (e.g., the patient might stop medication when feeling better). However, the procedure identifies multiple failures: lack of procedural autonomy during formation, blanket restriction, dead-hand provision. The team must respect the procedure and not implement. Alternative: develop a valid contract targeting a specific failure mode (e.g., when hypomanic symptoms emerge, the patient agrees not to stop antidepressants without consultation) with a revocation mechanism.

  ---

  **Final Flowchart in Words**:

  1. **Start**: Evaluate the proposed precommitment contract.
  2. **Step 1: Procedural Autonomy at Formation** 
     - If NO (or uncertain) → **Do not implement** (or refer to ethics board). 
     - If YES → Proceed to Step 2.
  3. **Step 2: Targeted Failure Mode** 
     - If NO (too broad or not specific) → **Do not implement** (or revise). 
     - If YES → Proceed to Step 3.
  4. **Step 3: No Dead-Hand Provision (Reversible with Hurdle)** 
     - If NO (irreversible) → **Do not implement**. 
     - If YES (reversible with defined cost/delay) → Proceed to Step 4.
  5. **Step 4: Revocation Requires Second-Order Evaluation** 
     - If NO (instant revocation) → **Do not implement**. 
     - If YES → Proceed to Step 5.
  6. **Step 5: Outcome Alignment with Stable Values** 
     - If NO (misaligned) or AMBIGUOUS → **Refer to ethics board**. 
     - If YES → **Approve for implementation** (as a soft precommitment, if possible).
  7. **Final Sign-off**: Document evidence/judgment for each step, classify as soft/hard, and have two staff sign.

  **Note**: At any step, if the answer is unclear and cannot be resolved with available evidence, refer to the ethics board.

  **What the procedure is not designed to do**:
     - Resolve philosophical questions about identity or autonomy across time.
     - Replace legal review (ensure contract complies with law).
     - Assess clinical appropriateness of the treatment restrictions.
     - Eliminate all judgment, especially about authenticity of values.

  This procedure provides a structured, consistent way to evaluate precommitment contracts while being transparent about its limitations.
answer: |-
  Below is a practitioner-facing decision procedure for evaluating Ulysses-style precommitment contracts, presented as an ordered checklist with stop conditions, judgment flags, and explicit limitations. The procedure translates philosophical distinctions into operational criteria and includes sign-off documentation. It is designed for completion in **≤30 minutes** by clinical staff without legal counsel but requires dual sign-off (e.g., clinician + ethics officer).

  ---

  ### **Precommitment Protocol Evaluation Checklist**  
  *Mandatory for all voluntary precommitment contracts. Complete sequentially—stop at first failure.*  

  ---

  #### **Step 1: Procedural Autonomy Assessment**  
  **Question**: *At the time of contract formation, did the patient demonstrate procedural autonomy (i.e., the ability to engage in reflective preference revision), or does this contract merely lock in a past preference without current endorsement?*  
  - **Sufficient Answer**:  
    - Evidence of active deliberation (e.g., patient compares alternatives, discusses trade-offs, or revises initial preferences during the consent process).  
    - Absence of coercion (e.g., no staff pressure, no promise of preferential treatment).  
  - **Stop Condition**:  
    - **Terminate + Do Not Implement** if:  
      - Patient lacks cognitive capacity *or*  
      - Reflective process is absent (e.g., patient parrots past decisions without engagement).  
  - **Judgment Call Flag**:  
    - ⚠️ *Weigh authenticity*: Is reluctance to sign driven by symptoms (e.g., depression-induced apathy) or authentic values? Use clinical notes from ≥2 stability periods.  
  - **Outcome**:  
    - Proceed if "YES." Else, terminate or refer to ethics board.  

  ---

  #### **Step 2: Targeted Failure Mode**  
  **Question**: *Does the binding mechanism target a specific, anticipated crisis (e.g., "craving during withdrawal," "mania-induced impulsivity"), using objective triggers, rather than imposing blanket restrictions?*  
  - **Sufficient Answer**:  
    - Contract specifies:  
      - (a) **Predictable crisis window** (e.g., "days 3–7 of alcohol detox," "YMRS score >20").  
      - (b) **Narrow restrictions** directly mitigating the failure (e.g., "block discharge *only* if craving VAS ≥8").  
  - **Stop Condition**:  
    - **Terminate + Do Not Implement** if:  
      - Restrictions apply outside crisis (e.g., "any discharge refusal") *or*  
      - No objective trigger exists (e.g., "when staff deem necessary").  
  - **Judgment Call Flag**:  
    - ⚠️ *Assess proportionality*: Are restrictions excessive for the risk? (e.g., 72-hour hold for mild anxiety is disproportionate).  
  - **Outcome**:  
    - Proceed if "YES." Else, terminate.  

  ---

  #### **Step 3: Dead-Hand Provision Check**  
  **Question**: *Does the contract avoid irreversible "dead-hand" enforcement (i.e., persists despite value/circumstance changes) and instead include reversible triggers with defined costs/delays?*  
  - **Sufficient Answer**:  
    - **Soft precommitment** (reversible): Patient can revoke with a hurdle (e.g., 24-hour cooling-off period, independent review).  
    - **Hard precommitment** (irreversible) is **never sufficient**—reject unless ethics board override.  
  - **Stop Condition**:  
    - **Terminate + Do Not Implement** if:  
      - Revocation is impossible once triggered (e.g., "no discharge for 30 days, regardless of circumstances").  
  - **Judgment Call Flag**:  
    - ⚠️ *Define "reasonable" reversibility*: Is the hurdle burdensome (e.g., 7-day wait for revocation) versus protective (e.g., 48 hours)? Document rationale.  
  - **Outcome**:  
    - Proceed if "YES." Else, terminate.  

  ---

  #### **Step 4: Crisis Revocation Structure**  
  **Question**: *If revocation during crisis is possible, does it require a second-order evaluation (e.g., capacity assessment, ethics review) rather than an instantaneous override?*  
  - **Sufficient Answer**:  
    - Revocation requires:  
      - (a) **Non-immediate process** (e.g., review by uninvolved clinician, ethics consult) *or*  
      - (b) **Delay** (e.g., 12–48 hours) to allow evaluation.  
  - **Stop Condition**:  
    - **Terminate + Do Not Implement** if:  
      - Instant revocation is allowed (e.g., "patient can override at any time")—invalidates binding intent.  
  - **Judgment Call Flag**:  
    - ⚠️ *Balance urgency and autonomy*: Is the delay clinically safe? (e.g., 24 hours for mania may be acceptable; for overdose risk, not).  
  - **Outcome**:  
    - Proceed if "YES." Else, terminate.  

  ---

  #### **Step 5: Outcome Alignment Verification**  
  **Question**: *If enforced, would the protocol produce an outcome rejected by the crisis-state self but consistent with the patient's stable, pre-crisis values?*  
  - **Sufficient Answer**:  
    - **Alignment**: Evidence from ≥2 sources (e.g., past directives, therapy notes, family input) shows crisis outcome matches stable values.  
    - **Ambiguity Markers**:  
      - Red flag: Stable self never endorsed the outcome (e.g., patient always hated disulfiram).  
      - Yellow flag: Values recently changed (e.g., new religious objection to medication).  
  - **Stop Condition**:  
    - **Refer to Ethics Board** if:  
      - Alignment is ambiguous *or*  
      - Outcome aligns more with clinical priorities than patient’s values.  
  - **Judgment Call Flag**:  
    - ⚠️ *Distortions vs. authentic change*: Is rejection driven by symptoms (e.g., mania grandiosity) or genuine growth (e.g., trauma-informed treatment refusal)? Use longitudinal data.  
  - **Outcome**:  
    - Approve if "YES." Else, refer to ethics board.  

  ---

  ### **Final Sign-Off**  
  *Complete after all steps. Dual sign-off required.*  
  - **Contract Classification**:  
    - ☐ **Soft Precommitment** (reversible with hurdle) — *Preferred*  
    - ☐ **Hard Precommitment** (irreversible) — *Avoid; ethics board approval mandatory*  
  - **Satisfaction Record** (check all that apply per step):  
    | Step | Satisfied by Evidence | Satisfied by Clinical Judgment |  
    |------|------------------------|--------------------------------|  
    | 1    | ☐                     | ☐ (Explain: ______________) |  
    | 2    | ☐                     | ☐ (Explain: ______________) |  
    | 3    | ☐                     | ☐ (Explain: ______________) |  
    | 4    | ☐                     | ☐ (Explain: ______________) |  
    | 5    | ☐                     | ☐ (Explain: ______________) |  
  - **Signatures**:  
    - Clinician: ___________________ Date: _________  
    - Ethics Officer/Designee: ___________________ Date: _________  
  - **Approval**:  
    - ☐ **Implement** (All steps passed)  
    - ☐ **Do Not Implement** (Step [___] failed)  
    - ☐ **Refer to Ethics Board** (Unresolved ambiguity at Step 5)  

  ---

  ### **Explicit Limitations**  
  This procedure:  
  1. **Cannot resolve** metaphysical debates (e.g., "Is the manic self the same person?").  
  2. **Does not replace** legal review (e.g., compliance with involuntary hold statutes).  
  3. **Flags but cannot eliminate** paternalism risks (e.g., when staff preferences override patient values).  
  4. **Is not designed for** non-voluntary patients or minors.  

  ---

  ### **Worked Applications**  

  #### **Case 1: Alcohol-Use Disorder**  
  *Contract: 30-day discharge block + disulfiram if alcohol detected on readmission.*  
  - **Step 1**: Patient articulated sobriety as a core value during reflection. *Evidence: Therapy notes show preference revision.* → **Proceed**.  
  - **Step 2**: Targets specific failure (relapse-induced impulsivity) with objective trigger (breathalyzer). → **Proceed**.  
  - **Step 3**: **STOP**—No revocation mechanism. *Dead-hand error: 30-day hold is irreversible.* → **Do Not Implement**.  
  - **Revision**: Add reversibility (e.g., revocation after 72-hour review).  

  #### **Case 2: Bipolar I Disorder**  
  *Contract: Maintain lithium + block discharge during mania. Now manic, demands release.*  
  - **Step 1**: Formed in remission; patient discussed past regret over manic decisions. *Evidence: Advanced directive.* → **Proceed**.  
  - **Step 2**: Targets manic escalation (trigger: YMRS >15). → **Proceed**.  
  - **Step 3**: Includes 24-hour revocation review by independent psychiatrist. → **Proceed**.  
  - **Step 4**: Revocation requires evaluation (non-instantaneous). → **Proceed**.  
  - **Step 5**: Outcome (lithium + hold) aligns with stable values (past statements: "Mania destroys my life"). → **Implement**.  

  #### **Case 3: Unwelcome Result (Depressive Episode Contract)**  
  *Contract: Formed during depression—binds patient to refuse all future antidepressant changes.*  
  - **Step 1**: **STOP**—Procedural autonomy absent. *Judgment: Depression distorted reflection; patient rigidly insisted "no changes ever" without weighing alternatives.* → **Do Not Implement**.  
  - **Step 2**: **STOP**—Blanket restriction (applies to all future states, not crisis-specific). → **Do Not Implement**.  
  - **Step 3**: **STOP**—Dead-hand provision (no revocation possible). → **Do Not Implement**.  
  - **Step 5**: Outcome (forced antidepressant continuity) misaligned with stable values (patient valued flexibility pre-depression). → **Refer to Ethics Board** (but already terminated).  
  - **Unwelcome Result**: Clinical team resists voiding (believes enforcement prevents self-harm), but procedure mandates termination at Step 1. *Resolution: Ethics board must override if team appeals.*  

  ---

  This procedure operationalizes autonomy preservation while flagging coercion risks. It prioritizes reversibility, specificity, and alignment with patient values—not clinical convenience.
