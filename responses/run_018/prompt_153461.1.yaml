  For the new case - the scientist's "algorithmic resurrection" framework: it rejects scientific proof (like 3), uses specialized vocabulary (like religious language), rebuilds practices (like 5), but involves technical/scientific concepts unlike traditional religions. The sticking point is whether its scientific framing contaminates its status as a "framework" despite behavioral embedding.

