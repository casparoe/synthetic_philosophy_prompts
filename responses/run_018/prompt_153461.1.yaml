  Your a professional philosopher of religion with a focus on Wittgensteins later philosophy. Before you answer, brainstorm at least three different rules that could fit the pattern of verdicts below, and note exactly where they split on the new case.

  Here are reconstructed verdicts from Wittgensteins remarks on religious belief:

  - He rejects belief in God when its treated like a scientific hypothesis backed by cosmological argument.
  - He rejects religious language used purely as metaphorical ethics with no literal framework behind it.
  - He accepts the belief of someone living fully inside Christian concepts of sin and redemption, even with zero proof.
  - He rejects adopting reincarnation just for psychological comfort if it doesnt restructure practices or relationships.
  - He treats divine-command morality as genuinely religious (not just moral realism) because its embedded in a form of life, not argued for.

  New case: A cognitive scientist adopts an "algorithmic resurrection" framework. She thinks future AI will reconstruct consciousness from her neural data, but only if she follows information-preservation rituals. She denies seeking scientific proof, uses technical vocabulary, and has rebuilt her diet, relationships, and ethics around this. She says its not a metaphor.

  What should we predict Wittgenstein would say? Which of the five above is the closest analag? Lay out two plausible rules that match his earlier verdicts but diverge here — state each rules prediction about her case. Give your best guess with reasons, and be honest: accepting her means adopting what principle about content vs form? Rejecting her means drawing the science/framework line where? Also name one further hypothetical case that would decide between those rules.

  Dont quote texts, dont list bibliographies, think carefully.
