  ### **Rent Control Simulation: Standing-Shift Discovery Game**  
  **Goal:** Physically experience how price controls (rent caps) shift moral standing by excluding claimants, undermining the policy's ethical justification.  

  ---

  ### **Game Setup**  
  **Participants:** 16 grad students  
  **Roles (assigned secretly via face-down cards):**  
  - **Landlords (L):** 4 players (own apartments).  
  - **Tenants (T):** 6 players (seek apartments).  
  - **Workers (W):** 4 players (seek jobs).  
  - **Employers (E):** 1 player (offers jobs).  
  - **Regulator (R):** 1 player (enforces rules).  
  *Why asymmetry?* Ensures scarcity—only 4 apartments/jobs for 10 claimants.  

  **Stakes:** Candy (or points). Each successful trade = 2 candies. Unsuccessful = 0.  

  **Materials:**  
  - Role cards (hidden payoffs inside).  
  - Apartment/Job tokens (4 each).  
  - Regulator’s “Price Control Rule Card” ($500 rent cap; $15/hr wage floor).  

  ---

  ### **Hidden Payoff Structure (Printed on Role Cards)**  
  **Landlords (L1-L4):**  
  > *"You own 1 apartment. Cost to maintain it is $X/month. You profit if rent > $X.  
  > **Secret Cost:** L1: $300, L2: $400, L3: $450, L4: $600."*  

  **Tenants (T1-T6):**  
  > *"You need an apartment. Max affordable rent is $Y. You benefit if rent < $Y.  
  > **Secret Max Rent:** T1: $800, T2: $700, T3: $600, T4: $550, T5: $500, T6: $450."*  

  **Workers (W1-W4):**  
  > *"You need a job. Min acceptable wage is $Z/hr. You benefit if wage > $Z.  
  > **Secret Min Wage:** W1: $10, W2: $12, W3: $14, W4: $16."*  

  **Employer (E1):**  
  > *"You offer 1 job. Max wage you can pay is $20/hr. Profit = $20 - agreed wage."*  

  **Regulator (R1):**  
  > *"Enforce rules:  
  > - **Round 1:** No price controls.  
  > - **Round 2:** Rent cap ($500), Wage floor ($15/hr).  
  > Punish violations (cancel trade). Allocate scarce slots if needed (e.g., lottery)."*  

  ---

  ### **Timeline (90 Min Total)**  
  **1. Intro & Rules (10 min):**  
  - Explain roles, stakes (candy), and goal: "Secure housing/jobs through negotiation."  
  - Hand out **face-down role cards**. Participants read secretly.  
  - Emphasize: *"Your payoff depends on your secret numbers. Hide them!"*  

  **2. Round 1: Free Market (20 min):**  
  - **Goal:** Landlords/Employer negotiate rent/wage with Tenants/Workers.  
  - **Process:**  
    - Participants mingle, strike deals.  
    - Successful trades: Give token to Tenant/Worker, report terms to Regulator.  
  - **Expected Outcome:**  
    - Apartments: Landlords rent to highest bidders (T1-T4; rent $500-$600).  
    - Jobs: Employer hires W1-W3 (wage $10-$14).  
    - **Excluded:** T5-T6 (low max rent), W4 (high min wage).  

  **3. Round 2: Price Controls (25 min):**  
  - **Regulator enforces:**  
    - Rent cap: **$500** (no rent > $500).  
    - Wage floor: **$15/hr** (no wage < $15).  
  - **Process:**  
    - Landlords: Only L1-L2 can rent (costs < $500). L3-L4 exit (would lose money).  
    - Employer: Can only hire if wage ≥ $15.  
    - Regulator allocates **3 slots max** (2 apartments, 1 job) via lottery if over-subscribed.  
  - **Expected Outcome:**  
    - **Apartments:** 2 slots for T1-T4 (WTP > $500). T5-T6 still excluded.  
    - **Jobs:** 1 slot for W4 (only one accepting $15+). W1-W3 excluded (demand < $15).  
    - **Standing shift:** T1-T4 and W4 now "winners"; T5-T6/W1-W3 invisible.  

  **4. Debrief (35 min):**  
  - **Step 1: Report outcomes (5 min):**  
    - Who got housing/jobs in each round? Who was excluded?  
    - Reveal secret payoffs. Calculate candy earned.  
  - **Step 2: Emotional reflection (10 min):**  
    - Ask excluded players: *"Could you voice objections? Did anyone defend you?"*  
    - Ask winners: *"Did you feel the policy was fair? Why?"*  
  - **Step 3: Reveal the standing shift (15 min):**  
    - **Key Script:**  
      > *"In Round 2, the rent cap ($500) and wage floor ($15) defined who 'counted.' T5-T6 and W1-W3 were excluded—not because they were exploited, but because the rules erased them. The 'winners' (T1-T4, W4) could defend the policy: 'It helped us!' But the policy itself silenced the excluded. By shrinking the pool of claimants, it rigged the ethical debate in its own favor. You just experienced the **standing shift**—the cap undermines its justification by hiding its victims."*  
    - Highlight: Defenders treat the **served group** (T1-T4, W4) as the only moral claimants, but the policy **created** this group by excluding others.  
  - **Step 4: Connect to theory (5 min):**  
    - *"This is why price controls aren't just about shortages. They redraw moral boundaries. Rent control 'helps tenants'—but only the ones who qualify. The rest? They vanish."*  

  ---

  ### **Limitations & How to Address Them**  
  1. **Long-run/Intergenerational Effects:**  
     - **Game can’t capture:** Slow erosion of housing quality, reduced job growth, or inherited disadvantage (e.g., landlords converting units to avoid caps).  
     - **Verbal bridge:** *"Imagine Round 3: Landlords sell apartments as condos (reducing supply), or your children inherit exclusion. Short-term 'winners' become long-term losers."*  

  2. **Non-Monetary Factors:**  
     - **Game can’t capture:** Discrimination, luck, or power imbalances (e.g., landlords choosing tenants based on race).  
     - **Verbal bridge:** *"In reality, the 'lottery' isn’t random. The standing shift amplifies inequality—those excluded are often marginalized."*  

  3. **Wage vs. Rent Dynamics:**  
     - **Game simplifies:** Labor and housing are linked (e.g., low wages cause rent stress).  
     - **Verbal bridge:** *"Notice Workers/Tenants overlap? In life, low-wage workers are often rent-burdened. A wage floor might help them afford rent—but only if they keep their jobs."*  

  ---

  ### **Why This Works**  
  - **Standing-Shift Discovery:** Players feel the exclusion physically. The debrief forces them to confront how the policy rigs its own defense.  
  - **No Lecture Needed:** The rules create tension organically. Winners defend the cap; excluded players voice frustration.  
  - **Stakes:** Candy makes choices visceral. Secret payoffs prevent gaming.  

  **Final Prep Tip:** Use distinct colored cards for roles. Keep the regulator’s rule card visible. Stay strict on time!
