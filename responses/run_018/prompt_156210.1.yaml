  Here's the reasoning for why asymmetric epistemic closure undermines the moral equality of combatants, focusing on structural factors rather than individual negligence:

  1.  **Walzer's Symmetry Premise:** The moral equality of combatants rests on the claim that soldiers on both sides are equally ignorant about the justice of their nation's cause (*jus ad bellum*). This ignorance is presumed unavoidable and non-culpable, stemming from their position within the state apparatus and reliance on political leadership. Therefore, they share an equal right to kill enemy combatants and are equally liable to be killed.

  2.  **Epistemic Closure in Command Hierarchies:** All military command structures inherently create some degree of "epistemic closure" – systems that control the flow of information, shaping what soldiers know, believe, and consider relevant. This includes formal orders, intelligence briefings, training, propaganda, censorship, and informal norms about questioning authority.

  3.  **Asymmetry in Closure Mechanisms:** Crucially, the *nature* and *purpose* of this closure differ fundamentally between states fighting aggressive wars and those fighting defensive wars:
      *   **Aggressor States:** Initiating an aggressive war requires justifying actions that violate fundamental norms. Maintaining cohesion and suppressing dissent becomes critical. This creates **incentives and institutional imperatives for deeper, more systematic epistemic closure.** Mechanisms include:
          *   **Active Suppression:** Punishing dissent, controlling media narratives tightly, restricting access to external information, framing critics as traitors.
          *   **Selective Framing:** Propaganda emphasizes selective "threats" while suppressing contradictory evidence about the war's origins or conduct.
          *   **Internal Filters:** Command structures actively filter out, dismiss, or reinterpret counter-evidence to maintain the official justification narrative. Questioning the war's justice becomes institutionally dangerous and structurally discouraged at all levels.
      *   **Defensive States:** While secrecy and operational security exist, fighting a defensive war often aligns more readily with widely accepted moral norms (self-preservation). This creates different dynamics:
          *   **Less Need for Deep Deception:** The core justification (defense against attack) is often clearer and less morally contested internally. There is less *structural need* to suppress fundamental doubts about *why* the war is being fought.
          *   **Preserved Dissent Channels:** While operational dissent might be restricted, channels for internal debate regarding the *justice of the cause* (e.g., legislative oversight, critical media, public protest tolerated within limits) are more likely to persist or be harder to completely suppress. Counter-evidence challenging the *necessity* or *proportionality* of the defensive effort has a higher chance of surfacing within the system.

  4.  **Asymmetric Culpability for Ignorance:** This structural asymmetry means the "they didn't know" excuse is not equally strong for soldiers on both sides:
      *   **Defender Soldiers:** Their ignorance about the justice of their *defense* is more plausibly a result of the inherent fog of war and their position. The system they operate in is less structurally rigged *against* the emergence of counter-evidence regarding the fundamental justice of fighting back.
      *   **Aggressor Soldiers:** Their ignorance is actively *manufactured and maintained* by the institutional imperative of the aggressive state. The command hierarchy systematically suppresses the very counter-evidence that would reveal the aggression. While individuals might not actively seek truth, the key point is that the system is designed to make accessing or acting on that truth exceptionally difficult and perilous, even for those disposed to question.

  5.  **Undermining Symmetry, Not Imposing Individual Blame:** This structural analysis breaks the symmetry without resorting to "they should have checked the news":
      *   The aggressor soldier's ignorance is a *foreseeable consequence* of the institutional structure necessary to wage an aggressive war. The state, by choosing aggression, *chooses* the mechanisms that deeply close off knowledge critical to moral assessment.
      *   Therefore, the aggressor soldier's claim to non-culpable ignorance is **structurally weaker**. Their epistemic environment is deliberately constructed to prevent them from forming an accurate assessment of the war's justice in a way that the defender soldier's environment typically is not.
      *   This difference stems from the *nature of the enterprise* (aggression vs. defense) and the institutional forms it necessitates, not from a failure of individual due diligence by each soldier. It's a systemic feature of the aggressor's war machine.

  **Conclusion:** The moral equality of combatants breaks down because the epistemic closure within an aggressor state's military is *asymmetrically deeper and more systematically aimed at suppressing knowledge of injustice* than in a defender state. This asymmetry makes the claim of non-culpable ignorance structurally less credible for soldiers participating in aggression. Their reduced access to truth is an intended feature of the system waging an unjust war, weakening the Walzerian justification for their equal right to kill. The inequality arises from the differing institutional realities imposed by the nature of the war itself, not individual fault.
