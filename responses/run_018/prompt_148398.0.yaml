prompt: |-
  You are advising a three-year research programme that must advance how institutional beliefs and social structures are reconstructed from material remains alone, with no textual corroboration. Among the open problems—how to weigh negative evidence (the absence of expected ritual objects in an otherwise intact assemblage), how to distinguish collective intentionality from aggregated individual practice in burial patterns, and how settlement-layout analysis can constrain cosmological inference without circular reasoning—which two should take priority and in what order? I want you to treat the inferential asymmetry between presence and absence (where a missing cult object might signal taboo, trade interruption, or mere taphonomic loss) not as a settled methodological point but as a live crux: is resolving it upstream of the others, or is it a secondary refinement that depends on first solving the collective-intentionality problem? Rank your priorities with explicit criteria—tractability for non-textual contexts, dependence relations between questions, and risk of false institutional attribution—and state what empirical or conceptual result in the next few years would reorder them. Please answer in British English.
reasoning: |-
  Okay, the user is asking for advice on prioritising research problems in archaeology, specifically focusing on reconstructing institutional beliefs and social structures from material remains without texts. They've outlined three key issues: weighing negative evidence (absence of expected objects), distinguishing collective intentionality from individual practices in burials, and avoiding circular reasoning in settlement layout analysis for cosmological inferences. 

  The user wants me to treat the asymmetry between presence/absence evidence as a live debate - not settled - and consider whether resolving it should come before tackling collective intentionality. They also want explicit ranking criteria: tractability without texts, dependence between questions, and risk of false attribution. Plus, they want to know what future findings could reshuffle priorities.

  Hmm, this is a sophisticated methodological question. The user is clearly deeply versed in archaeological theory - probably a senior researcher or programme director designing a multi-year project. Their phrasing suggests frustration with current methodological limitations in "reading" institutions from artefacts alone. The subtext seems to be: "How do we avoid just projecting modern assumptions onto silent material culture?"

  Right, breaking this down. First, the negative evidence crux: absence could mean anything from cultural taboo to rats stealing artefacts. Until we can interpret silence reliably, all other inferences are shaky. But doing so requires understanding group norms - which loops back to intentionality. Chicken-and-egg problem. 

  Meanwhile, the settlement layout question feels downstream - you'd need solid frameworks for absence and intentionality before decoding cosmology from postholes without circularity. The burial patterns issue offers the most direct window into "groupness" - grave goods don't lie about ritual behaviour, even if their meaning is slippery.

  Weighing criteria:
  - Tractability: Burials win - discrete contexts, repeated behaviours. Absence is messier (taphonomy!).
  - Dependencies: Can't resolve absence without intentionality (is missing X meaningful or random?). But intentionality needs absence methods to detect deviations.
  - Risk: Get intentionality wrong and entire social reconstructions collapse. False attributions from settlement layouts are catastrophic but maybe more containable.

  So sequencing: Collective intentionality first (burials as testbed), then absence. Why? Because intentionality gives the "why" behind absences. Finding patterned exclusions in burials could bootstrap absence methodology. Whereas cracking absence alone might just yield generic taphonomic models.

  But contingency plan: If Year 1 excavations find a settlement with systematic "ritual voids" (e.g., shrines missing universal deity figurines), that could force absence up the agenda. Or if burial analysis shows individual quirks overwhelming group signals, intentionality becomes harder and absence might need solving first to filter noise.

  Ultimately the user needs guardrails against overinterpreting silence. My recommendation is to build from graves upward - corpses don't move, potsherds do. Establish what "group ritual" looks like materially before decoding empty spaces.
answer: |-
  Right, let's break this down systematically. Prioritising these open problems requires weighing their foundational nature, the risks of misinterpretation, and how they interlock. Based on your criteria (tractability non-textually, dependence relations, risk of false attribution), here are the priorities:

  1.  **Priority 1: Distinguishing Collective Intentionality from Aggregated Individual Practice in Burial Patterns**
      *   **Rationale:**
          *   **Tractability:** Burial contexts are often high-integrity 'closed finds'. Patterns are observable (grave goods, body position, spatial clustering), and repeated behaviours offer statistical leverage. Testing hypotheses about group norms vs. individual variation is feasible through spatial analysis, grave good associations, demographic correlations, and comparison across multiple sites/periods. Non-textual methods (e.g., network analysis of grave good co-occurrence, Bayesian modelling of trait distribution) are well-suited.
          *   **Dependence:** This is arguably the *most fundamental*. Understanding whether patterns represent institutional norms ("the *group* does this") or emergent individual choices ("many *people* happened to do this") is **upstream** of interpreting *both* negative evidence *and* cosmological inference. If we misattribute aggregated individual acts to institutional belief, *all* subsequent inferences about social structure and institutions are built on sand. Resolving intentionality provides the essential framework for judging the *significance* of presence/absence and the social meaning encoded in settlement layout.
          *   **Risk of False Attribution:** Extremely high. Mistaking widespread individual preferences (e.g., personal adornment fashion) for a mandated ritual practice profoundly distorts the reconstruction of institutions, hierarchy, and shared belief systems. It risks creating "zombie institutions" – social structures inferred from material patterns that never actually existed as coherent, binding entities.

  2.  **Priority 2: Resolving the Inferential Asymmetry of Presence vs. Absence (Negative Evidence)**
      *   **Rationale:**
          *   **Tractability:** While inherently challenging, this problem can be approached methodologically. Developing robust protocols requires controlled studies of taphonomy (formation processes), experimental archaeology (deposition/destruction), comparative analysis across similar cultures/sites, and sophisticated statistical modelling (e.g., quantifying the probability of survival/loss vs. deliberate exclusion). Focus can be placed on specific, high-visibility contexts like ritual deposits or elite burials initially. Non-textual proxies (e.g., evidence of deliberate sealing vs. disturbance, micro-debris analysis) are key.
          *   **Dependence:** This is **partially dependent on progress with Priority 1**. Establishing clearer signals of *collective intentionality* (Priority 1) provides crucial context for interpreting absence. Is the absence in a context *known* (from Priority 1 methods) to be tightly regulated? If so, absence becomes *more* significant. Conversely, in contexts dominated by individual choice, absence is harder to interpret institutionally. However, resolving the asymmetry is also **a prerequisite for refining cosmological inference** (Priority 3, implicitly lower), as cosmological models often rely on interpreting patterns of inclusion/exclusion (e.g., specific zones in settlements).
          *   **Risk of False Attribution:** Very high, but often *secondary* to misattributing intentionality. Misinterpreting absence can lead to false negatives (missing an important taboo or ritual shift) or false positives (inferring a taboo or crisis from mere taphonomic loss or local variation). This directly corrupts inferences about ritual practice, trade networks, social hierarchies (access to goods), and belief systems (taboos).

  **Why not Settlement Layout/Cosmology First?**

  *   **Dependence:** Settlement layout analysis for *cosmological inference* heavily **depends on the first two priorities**. Without understanding whether patterns reflect collective norms (Priority 1) and how to interpret the meaning of specific inclusions/exclusions within those patterns (Priority 2), cosmological interpretations are highly vulnerable to circular reasoning ("This layout looks symbolic to us, therefore it reflects cosmology, which explains the layout"). Establishing the 'social grammar' (collective intentionality) and the 'vocabulary' (significance of presence/absence) is essential *before* attempting complex 'sentence structure' (cosmology).
  *   **Tractability:** While layout is observable, *inferring cosmology* non-textually is arguably the least tractable of the three. The link between physical space and abstract belief is indirect and culturally variable. It often requires prior assumptions or ethnographic analogy, increasing circularity risk.
  *   **Risk:** High risk of imposing modern or ethnographically derived cosmological models onto patterns that may have had entirely different social, economic, or environmental drivers.

  **Summary of Priority Order & Reasoning:**

  1.  **Collective Intentionality (Burials):** Highest priority due to being the most **foundational** (upstream), highly **tractable** in specific contexts, and carrying the **greatest risk** of catastrophic misattribution of institutional structure if unresolved.
  2.  **Presence/Absence Asymmetry:** Second priority as it is **critical for robust inference** across many domains, **methodologically addressable** with focused effort, and its **interpretation is significantly sharpened by progress on intentionality**, while also being necessary for refining cosmological models. High risk of false attribution, but somewhat mitigated by progress on Priority 1.
  3.  **Settlement Layout/Cosmology:** Lower priority currently, as it **depends fundamentally** on robust solutions to the first two problems to avoid circularity. Best approached later with stronger methodological foundations.

  **Potential Empirical/Conceptual Results that Could Reorder Priorities:**

  *   **Result Boosting Presence/Absence to #1:** A breakthrough in **taphonomic modelling** that reliably quantifies survival probabilities for specific object types in specific depositional contexts across diverse environments. Or, compelling **ethnoarchaeological work** demonstrating clear, cross-culturally applicable material signatures distinguishing deliberate ritual exclusion from accidental loss/destruction *that are detectable archaeologically*. This would make resolving the asymmetry significantly more tractable and potentially less dependent on fully resolving intentionality first.
  *   **Result Boosting Cosmology (or lowering it further):** The **development and successful application of a rigorous, non-circular analytical framework** for inferring cosmology (e.g., combining spatial analysis with evidence of repetitive ritual practice *within* the settlement defined by Priorities 1 & 2, or using astronomical alignments with demonstrable intentionality). Conversely, a **strong conceptual argument demonstrating the near impossibility** of reliably inferring specific cosmological beliefs from settlement layout alone without textual support *even with Priorities 1 & 2 resolved* might solidify its lower priority.
  *   **Result Challenging the Sequence:** Discovery of an exceptionally well-preserved **settlement site with unambiguous, repeated patterns of structured absence** (e.g., identical "voids" in ritual structures across multiple sites) *alongside* clear burial evidence. This could force the programme to tackle absence and intentionality in parallel or demonstrate that settlement evidence might offer a unique, direct route to understanding institutionalised rules governing absence.

  The core logic remains: establish the nature of the 'social actor' (collective intent?) and the reliability of the 'signs' (presence/absence meaning?) before attempting to decode the most complex 'messages' (cosmology). Progress on burial intentionality provides the essential scaffolding for tackling the insidious problem of silence in the archaeological record.
