  Okay, the user is deep into Buddhist philosophy, specifically the anatta doctrine and personal identity. They're preparing for a seminar discussion where someone challenged how anatta can account for moral accountability and karmic continuity without a self. The user wants to outline the criteria any defense of anatta must meet to avoid eliminativism or crypto-substantialism.

  First, I need to recall the core issues. Anatta rejects a permanent self (atman), so any account must explain personal identity without it. The main challenges are: distinguishing "my" suffering from "yours," grounding moral responsibility, explaining karmic continuity, and handling first-person perspectives without a self.

  The user mentioned specific problems: moral accountability, karmic ownership, and the asymmetry between first and third-person access. They also want to know which criteria are non-negotiable in classical Buddhism and which are modern preferences. Plus, they're interested in tensions between desiderata and how different Buddhist schools handle them.

  Let me break down the desiderata. First, the non-negotiables based on classical Buddhism. The rejection of svabhava is key—no inherent existence in the aggregates. Then, anatta must avoid eternalism (permanent self) and annihilationism (total negation). Also, karmic continuity is essential; actions have effects without a self. Moral responsibility must be preserved, and the conventional self has normative weight—it's not a mere fiction.

  Then there are derivative desiderata. Explaining first-person phenomena like memory and anticipation without a unitary subject. Accounting for indexicality—why "I" feel connected to past experiences. The sense of agency and ownership without a self. Asymmetry in access to mental states (first vs. third-person). Also, diachronic coherence—how we maintain identity over time.

  Tensions arise between these. For example, moral accountability might need a thicker agent, but anatta denies that. Karmic inheritance versus indexical immediacy: why this stream inherits past karma without a self. Also, agency without an agent could be tricky. The user wants to know if any desiderata are jointly unsatisfiable.

  Next, considering how different schools approach this. Abhidharma reductionism uses causal continuity between momentary dharmas. It handles karmic continuity well but might struggle with indexical persistence and moral accountability. Yogacara's store consciousness provides continuity, which helps with diachronic coherence but risks substantialism. Modern phenomenological approaches focus on the minimal sense of self as a process, addressing first-person access but maybe not karmic continuity.

  I should note where tensions are sharp. For instance, robust moral responsibility might conflict with the no-self view. Or indexical persistence feeling like a core self versus the doctrine denying it. The user wants to highlight these to preempt seminar debates.

  Also, the user emphasized avoiding bibliographies. Focus on conceptual structure, not sources. Make sure each desideratum has a clear motivation, like why normative weight is necessary for ethics. Mention which are classical must-haves versus modern additions, like narrative unity.

  Need to ensure all key points are covered: desiderata, their motivations, tensions, and how schools handle them briefly. Check that the analysis stays on criteria without grading theories too much. Highlight the joint unsatisfiability possibilities as that's crucial for their seminar prep.
answer: |-
  Here is a structured set of desiderata for an adequate philosophical account of personal identity under *anattā*, grounded in classical Buddhist commitments and modern philosophical concerns, along with their motivations, tensions, and brief notes on representative approaches:

  ### Core Non-Negotiable Desiderata (Classical Buddhist Commitments)

  1.  **Rejection of Substantial Self (Svabhāva-Nairātmya):**
      *   **Requirement:** Deny any enduring, unitary, independent, self-existing entity (*ātman*, *svabhāva*) within or beyond the aggregates (*skandhas*).
      *   **Motivation:** Foundational Buddhist ontology. Accepting *svabhāva* undermines impermanence (*anicca*), dependent origination (*pratītyasamutpāda*), and the core soteriological goal of liberation from clinging to self.
      *   **Pressure:** Avoids "crypto-substantialism" (e.g., positing a subtle, unchanging core disguised as consciousness, awareness, or narrative unity).

  2.  **Avoidance of Eternalism and Annihilationism:**
      *   **Requirement:** Steer clear of the extremes (*antagrāhikā drshti*) of positing a permanent self (eternalism) or denying any continuity whatsoever (annihilationism, leading to hard eliminativism).
      *   **Motivation:** Central doctrinal injunction (e.g., *Kaccānagotta Sutta*). Grounds the Middle Way. Annihilationism negates karma and rebirth; eternalism negates *anattā*.
      *   **Pressure:** The account must explain continuity without permanence and change without utter discontinuity or nihilism regarding conventional identity.

  3.  **Karmic Causality & Continuity (Vipāka Pratyaya):**
      *   **Requirement:** Explain why volitional actions (*karma/kamma*) have their fruits (*vipāka*) specifically within a particular, identifiable causal sequence ("stream") across time, potentially spanning lifetimes, *without* a permanent owner/subject of the action or fruit.
      *   **Motivation:** Ethical core of Buddhist thought (moral responsibility, path to liberation). Rebirth doctrine. Requires explaining "belonging" without an owner.
      *   **Pressure:** Why do *these* aggregates now experience the fruit of *those* past aggregates' actions? What constitutes the "stream" that links cause and effect?

  4.  **Conventional Reality & Normative Weight (Samvrtisatya):**
      *   **Requirement:** Account for the robust reality and normative significance of the conventional person (*pudgala*) in ethics (compassion, responsibility), phenomenology ("I" experience), and social discourse, without treating it as *merely* a linguistic fiction devoid of causal power or moral import.
      *   **Motivation:** Practical necessity for ethics, community, and path practice. Avoids hard eliminativism which renders moral distinctions ("my" vs. "your" suffering) arbitrary and undermines motivation for liberation. Distinguishes *anattā* from nihilism.
      *   **Pressure:** How can "I" be responsible, how can "your" suffering matter more to you, if there's ultimately no "I" or "you"?

  ### Derivative Desiderata (Strongly Motivated, but Interpretation Varies)

  5.  **First-Person Phenomena (Memory & Anticipatory Concern):**
      *   **Requirement:** Explain the phenomenology of episodic memory ("I remember *my* childhood") and future-oriented concern ("I am afraid of *my* death") without invoking a persisting, identical subject that "has" the memory/fear.
      *   **Motivation:** Ubiquitous human experience. Key to understanding suffering (*dukkha*) and the motivation for practice. Avoids implausible denial of lived experience.
      *   **Pressure:** How can memory feel "mine" if there's no enduring "me"? Why do I care specifically about *this* future aggregate-process?

  6.  **Indexical Persistence & Ownership ("Mineness"):**
      *   **Requirement:** Account for the sense that *this* present experience (pain, thought) is "mine" and that *this* awareness inherits the results of past actions performed within "this" stream, without positing a substrate.
      *   **Motivation:** Deep-seated phenomenological and karmic intuition. Explains the *immediacy* and *directness* of "my" experience and "my" karmic burden. Distinguishes "inheritance" within a stream from mere random occurrence.
      *   **Pressure:** Why does *this* present moment feel like the inheritor of *that* specific past action, rather than any other moment? How is "mineness" constituted without an owner?

  7.  **Agency Without Agent (Kāraka without Kartr):**
      *   **Requirement:** Provide a coherent account of intentional action, effort, and moral responsibility ("I did it") without a permanent, substantial agent performing the action.
      *   **Motivation:** Essential for ethics (karma, path practice), phenomenology of volition, and avoiding fatalism. Echoes the "action exists, no actor exists" paradox.
      *   **Pressure:** How can an action be "mine" and me be responsible if there's no "I" that performed it? Can reduction to complex causal chains fully capture accountability?

  8.  **Asymmetry of Access:**
      *   **Requirement:** Explain the privileged, immediate, non-inferential access I have to "my own" present mental states (e.g., pain, thought) compared to my access to yours (which is inferential/behavioral), without grounding this asymmetry in a substantial ego-core.
      *   **Motivation:** Fundamental epistemological fact. Key to distinguishing streams phenomenologically. Avoids collapsing into a view where all mental states are equally "public" or accessible.
      *   **Pressure:** What constitutes the "boundary" between streams that makes my mental states directly accessible only to "this" stream if not an owner/subject?

  9.  **Diachronic Coherence (Optional Weighting):**
      *   **Requirement:** (Varies by Camp) Explain the (often imperfect) psychological and narrative coherence of a person over time – plans, character traits, life story – without reifying a narrative self as an entity.
      *   **Motivation:** Common human experience and social interaction. Important for some ethical and psychological models. *Note:* Classical Abhidharma may minimize this; modern interpreters/narrative views emphasize it.
      *   **Pressure:** How does a causally connected series of aggregates exhibit patterns of habit, character, and purpose approximating a "person" if not through a persistent core?

  ### Key Tensions & Potential Joint Unsatisfiability

  *   **Moral Accountability vs. No-Agent:** Can a purely causal, process-based account ("action A caused result R in the same stream") generate the *normative force* of *desert* or *responsibility* typically associated with agency? Does "belonging to the stream" feel sufficiently robust for "I did it, I deserve the fruit" without smuggling in a thin agent? (**Agency Without Agent** vs. **Rejection of Substantial Self**).
  *   **Indexical Persistence & Karmic Inheritance vs. Momentariness:** In highly reductionist views (e.g., strict Abhidharma), if aggregates are strictly momentary and nothing persists, *what* constitutes the "this-ness" that inherits the karma? Why does *this* moment inherit *that* past action? Causal connection alone may feel insufficient to ground the *indexical immediacy* ("*This* is mine! *This* inherits!"). (**Indexical Persistence**, **Karmic Causality** vs. radical momentariness implied by some interpretations of **Rejection of Substantial Self**).
  *   **Conventional Normative Weight vs. Ultimate Non-Existence:** How can the conventional self bear *genuine* moral weight (e.g., "your" suffering demands *my* compassion) if it is *only* conventionally real and ultimately empty? This is the classic tension between the Two Truths applied to ethics. (**Conventional Reality & Normative Weight** vs. the ultimate implication of **Rejection of Substantial Self**).

  ### Brief Notes on Approaches Handling Key Requirements

  1.  **Abhidharma Reductionism:**
      *   **Karmic Continuity:** Handled via complex causal chains (*citta-santāna*) linking momentary mental events (*dharmas*), especially volitions (*cetanā*) and their stored "seeds" or tendencies. Ownership = causal linkage within *this* sequence.
      *   **First-Person Phenomena/Indexicality:** A challenge. Memory is a present cognitive event causally linked to a past object. "Mineness" is an emergent quality of the causal series, not an intrinsic property. Can feel like it struggles with the *immediacy* of indexicality.
      *   **Tension:** Strong on causality, potentially weak on robust phenomenology of ownership and normative accountability beyond causal consequence.

  2.  **Yogācāra (Store Consciousness - *Ālayavijñāna*):**
      *   **Diachronic Coherence/Karmic Continuity:** *Ālayavijñāna* acts as a subliminal, evolving stream carrying karmic seeds (*bīja*) from moment to moment and life to life. Provides a substrate-like *continuity* without a substantial *entity* (arguably).
      *   **Asymmetry of Access:** Grounded in the private, subjective nature of mind-streams (*citta-santāna*) and the role of *manas* (ego-centric mind) grasping at the *ālaya* as "self."
      *   **Tension:** Risks crypto-substantialism. Is the *ālaya* a *de facto* subtle self? Does it adequately preserve the strict *anattā* of all *dharmas*?

  3.  **Modern "Thin" Phenomenological/Process View:**
      *   **Agency Without Agent:** Agency is an emergent property of complex, dynamic processes of intention, perception, and action arising interdependently within a psychophysical stream. "I" is a processual enactment.
      *   **Indexical Persistence/"Mineness":** Arises from the embodied, embedded, and enactive nature of consciousness – the specific, perspectival "here and now" of *this* organism interacting with its world. The sense of "me" is a dynamic self-specifying process.
      *   **Tension:** May struggle to ground robust *interpersonal* karmic continuity (especially rebirth) or provide a compelling non-circular account of why *this* specific perspective inherits *that* specific past karma. Normative weight can be pragmatic but may lack metaphysical grounding.

  This architecture highlights that the core challenge lies in satisfying the non-negotiable commitments (**1-4**) while adequately addressing the phenomenology and ethics embedded in **5-8**, particularly navigating the tensions around ownership, inheritance, and agency without collapsing into extremes. Whether all desiderata can be *fully* satisfied without residue remains a profound philosophical question within Buddhism.
