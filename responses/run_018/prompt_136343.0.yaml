  Where this gets messy is the normative claim about suffering. In control systems, an unheeded alarm is just data - not inherently "bad." But humans experience unattended pain as suffering regardless of avoidance behavior. That's the residue. 

  The user's sharp about detecting philosophical smuggling. They're right that philosophers often imply intrinsic badness where engineers see functional failure. But maybe that intrinsic quality maps to something like... system integrity violations? Though even that feels forced. 

