      *   **Popperian:** "Pattern" = an internal hypothesis/model of the world. "Holds me fast" = the hypothesis *was* believed/acted upon internally until falsified/killed off. (Lines: Spinning inner world, prediction, testing models internally, letting false ideas die *within*).
