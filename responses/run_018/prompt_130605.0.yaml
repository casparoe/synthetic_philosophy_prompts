  4.  **Accuracy:**
      *   Darwinian: Focus on blind variation & environmental selection, no foresight.
      *   Skinnerian: Focus on operant conditioning (reward/punishment shaping behaviour).
      *   Popperian: Explicitly shows *internal* modeling ("spin a world inside my head"), prediction, and the death of hypotheses *in the mind* ("die within") before costly real-world actions.
      *   Gregorian: Focus on naming, tool-making, and the cultural transmission/sharing of representations ("lend my pattern", "borrow my name", "sticky web").
