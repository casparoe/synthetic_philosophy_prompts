  **The Fourfold Chant**

  **(Darwinian Voice: Survival Behaviour)**
  Blind variation, pressing need,
  Environment selects the seed.
  No thought, no plan, no inner stage,
  Just birth, and death, and turn the page.
  *This pattern holds me fast.*

  **(Skinnerian Voice: Reinforced Habit)**
  Stimulus strikes, a swift reply,
  Reward descends from sky on high.
  Or painful sting, which I avoid,
  The path well-trod, by trial employed.
  *This pattern holds me fast.*

  **(Popperian Voice: Internal Hypothesis Killed)**
  I spin a world inside my head,
  Predict the path where fools might tread.
  I test the model, not the limb,
  Let false conjectures die within.
  *This pattern holds me fast.*

  **(Gregorian Voice: Named Tool for Borrowing)**
  I name the weave, the knot, the frame,
  This useful thing, I give a name.
  Take this design, lend my pattern,
  Grow the sticky web we're at in.
  *This pattern holds me fast.*

  ---

