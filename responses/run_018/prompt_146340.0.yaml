prompt: |-
  There's a strange split in heritage law and museum norms about old ships versus old cars. Restore a wooden ship over two centuries—replace every plank, mast, and rope—and maritime registries and museums still treat it as the exact same vessel, same registration number, same historical identity, as long as the keel line and official paperwork stay unbroken. Do the same thing to a car, swap out engine, chassis, body, every bolt, and title law treats it as breaking the original identity for tax and ownership. What view of object persistence does that institutional pattern presuppose? Reconstruct the implicit metaphysics: is it endurance with essential parts, four-dimensional spatiotemporal continuity, or something like institutional baptism that survives total material turnover? Say whether the practice strictly needs one of those, or if it's philosophically underdetermined and fits several theories. Check if it's consistant with how the same system handles aircraft restoration or historic buildings. Then tell me what a heritage registry built on pure mereological essentialism, or on a perdurantist career-path view, would have to change about its rules. Give me your bottom line in \answer{...} at the very end.
reasoning: |-
  Hmm, this is an intriguing philosophical puzzle about identity persistence across material replacement. The user is contrasting how maritime heritage treats ship restorations versus how automotive title law handles car restorations, asking about the underlying metaphysical assumptions. 

  First let's unpack the empirical observation: For 200-year-old ships, replacing every single part (planks, mast, ropes etc.) while preserving the keel and paperwork allows it to retain original identity. But replacing all components of a car (engine, chassis, body) voids its original identity in legal/tax contexts. The keel seems crucial for ships while cars lack an equivalent "core" element.

  Now the philosophical framing: The user suggests three possible metaphysical theories - 1) Endurance with essential parts (ship keel as essential), 2) 4D spatiotemporal continuity (the physical object's worldline), or 3) Institutional baptism (registration as social construct). 

  I need to test these against the practices. The ship case clearly privileges the keel as an essential part - that aligns with mereological essentialism where certain components define identity. But the car case rejects this entirely, treating total replacement as identity-destroying. This asymmetry suggests institutional baptism might be the unifying factor: Maritime tradition sanctifies the keel, while automotive law sanctifies serial numbers on frames (often replaced in cars). 

  Checking consistency with other domains: Aircraft restoration often uses "data plate essentialism" where the manufacturer's plate defines identity regardless of part replacement - similar to ships. Historic buildings commonly allow substantial reconstruction as long as key structural elements remain. So the pattern holds: Institutions designate certain elements as identity-bearers.

  For counterfactual registries: A pure mereological essentialism system would require listing every original part as essential - impractical for complex objects. Perdurantism would treat objects as spatiotemporal worms, making "original identity" claims nonsensical since all parts exist in different temporal slices anyway. Both would require radical overhaul of current practices.

  Bottom line: The disparity stems from institutional conventions privileging different "essences" (keels vs VIN plates), not metaphysical necessity. The practices could technically fit multiple theories, but institutional baptism best explains the variance across domains.
answer: |-
  The institutional disparity between ship and car restoration reveals a pragmatic **essential part theory** undergirded by **institutional baptism**, where designated "core elements" (like a ship's keel or a car's frame/VIN plate) serve as socially agreed-upon identity anchors. This practice is philosophically **underdetermined** but most naturally aligns with a conventionalist view.  

  ### Analysis of Implicit Metaphysics:
  1. **Endurance with Essential Parts** (Mereological Essentialism Lite):  
     - Ships: The keel is treated as an *essential part* whose persistence maintains identity despite replacement of all other components.  
     - Cars: Automotive law implies *no single essential part* exists; total replacement voids identity.  
     - **Fit**: Partial—ships follow this, but cars reject it.  

  2. **Four-Dimensional Spatiotemporal Continuity** (Perdurantism):  
     - Neither practice strictly adheres to this. Ships undergo radical temporal part replacement yet retain identity, while cars lose identity despite potential continuity in location/restoration process.  
     - **Fit**: Weak—both cases prioritize designated structures over spacetime continuity.  

  3. **Institutional Baptism**:  
     - Maritime registries "baptize" the keel as the identity anchor via paperwork. Automotive systems baptize the VIN/frame but revoke identity if replaced.  
     - **Consistency**: Aircraft restoration mirrors ships (data plate/keel tube as essential); historic buildings often prioritize foundational elements (e.g., original facade or footprint).  
     - **Best Fit**: Explains cross-domain variance via socially designated essences.  

  ### Counterfactual Registries:
  - **Pure Mereological Essentialism Registry**:  
    - Would require *all original parts* to be essential. No restoration beyond minor repairs allowed—replacing a single plank or piston voids identity. Ships like *HMS Victory* (98% replaced) or cars like a "matching numbers" classic would lose historical status.  

  - **Perdurantist "Career-Path" Registry**:  
    - Identity tied to the object’s entire spacetime path. A ship/car could be dismantled, stored in boxes for decades, and reassembled while retaining identity. Total part replacement is irrelevant if the restoration is a temporal stage of the same "career."  

  ### Bottom Line:
  The disparity arises from **domain-specific institutional conventions**, not metaphysical necessity. Ship practice assumes a *privileged essential part* (keel), while car law reflects bureaucratic aversion to material turnover. It is **philosophically underdetermined** but operationally consistent within each domain. A unified metaphysics isn't required—practical needs (e.g., maritime tradition vs. title fraud prevention) dictate the rules.  

  \answer{The institutional pattern presupposes a conventionalist view where identity is anchored by socially designated essential parts (e.g., a ship's keel) or baptismal markers (e.g., VIN plates). This practice is philosophically underdetermined but functionally consistent within domains, favoring institutional baptism over strict mereological essentialism or perdurantism.}
