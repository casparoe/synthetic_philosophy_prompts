answer: |-
  Here's a residue report on translating Scanlon's contractualism into statistical mechanics/thermodynamics vocabulary, highlighting where analogies hold, distort, or fail entirely. I'll follow your request to prioritize where the physics framework *doesn't* capture the ethical concepts.

  ### 1. **The Aggregation Problem & Extensive/Intensive Properties**
     - **Philosophical Claim:** Contractualism prohibits aggregating many small harms to outweigh one severe harm. Complaints are assessed individually; a principle causing severe harm to one is reasonably rejectable *by that individual*, even if it spares many others minor harms.
     - **Physics Translation Attempt:**  
       - *Clean Fit:* **Intensive properties** (e.g., temperature, pressure) are direct analogs to **individual complaints**. An intensive property is defined *locally* and does not scale with system size. A single particle at high temperature (severe harm) isn't "averaged out" by many particles at low temperature (minor harms). Similarly, contractualism treats the severe harm as an unreducible intensive complaint.  
       - *Distortion:* **Extensive properties** (e.g., energy, volume) scale with system size and *can* be summed. This mirrors *aggregative* ethical theories (utilitarianism). However, contractualism rejects treating harms as extensive (additive). The distortion arises because extensive properties *do* emerge from microscopic summation (e.g., total energy), but contractualism denies this summation is morally valid.  
       - **No Physical Counterpart:** The **normative asymmetry** between intensive/severe harm and extensive/minor harms. Physics describes intensive/extensive as *categories* without prescribing which should "dominate." Contractualism asserts the severe harm *must* dominate morally—a prescriptive rule physics lacks. Temperature gradients equilibrate; severe harms don’t "equilibrate" with minor ones.

  ### 2. **"Reasonable Rejection" and Stability Criteria**
     - **Philosophical Claim:** A principle is wrong if it could be "reasonably rejected" by any person affected. "Reasonable" involves impartiality, justifiability to others, and no undue sacrifice.
     - **Physics Translation Attempt:**  
       - *Clean Fit:* **None.** Equilibrium states minimize free energy, but this is value-neutral. "Reasonable rejection" has no counterpart in energy minimization or entropy maximization.  
       - *Distorted Fit:*  
         - **Symmetry-breaking:** A principle might be "rejected" if it imposes asymmetric burdens (like a phase transition breaking symmetry). But symmetry-breaking is descriptive; "reasonable" rejection is normative.  
         - **Metastability:** A "reasonably rejectable" principle could resemble a metastable state (viable but fragile under perturbation). Yet metastability is amoral; a state is metastable based on energy barriers, not justifiability.  
       - **No Physical Counterpart:** The **normative core of mutual recognition**. "Reasonable" hinges on whether a burden *can be justified to others* given their standpoint. Physics has no concept of "justification," "standpoint," or "undue sacrifice." Ensemble averaging erases individual perspectives; contractualism centers them.

  ### 3. **The Non-Fungibility of Persons: The Irreducible Residue**
     - **Philosophical Claim:** Individuals are distinct sources of moral claims. You cannot "trade" persons or their complaints mathematically.
     - **Physics Translation Attempt:**  
       - *Clean Fit:* **None.** Particles in an ensemble are fungible and indistinguishable (e.g., Bose-Einstein statistics). Swapping particles doesn’t change the state. Contractualism’s persons are *distinguishable* and non-interchangeable.  
       - *Distorted Fit:* **Boundary conditions** or **external constraints** (e.g., fixed volume) might limit system behavior, analogous to deontic constraints. But constraints in physics are physical, not moral.  
       - **No Physical Counterpart:** **Moral agency and patienthood.** Persons are both subjects experiencing harms *and* agents evaluating principles. Particles experience forces but don’t "evaluate" or "reject" states. The "separateness of persons" (Rawls) is ethical, not thermodynamic.

  ---

  ### Why the Residue Matters: Indeterminacy vs. Genuine Difference
  1. **Physics Omits Normativity:** The untranslatable elements ("reasonable," "justifiability," "undue sacrifice") are irreducibly normative. Physics describes *what is*; contractualism prescribes *what ought to be recognized*. No stability criterion can capture "ought."
  2. **Non-Fungibility is Fundamental:** Statistical mechanics relies on particle indistinguishability and additive aggregation. Contractualism rejects both for persons, treating them as unique loci of moral weight. This isn’t indeterminacy—it’s a deliberate feature of the theory.
  3. **Does Translation Failure Reveal Indeterminacy?** Not in this case. The residue—mutual justifiability, non-aggregation, agential standpoint—are precisely defined in Scanlon's framework. Their absence in physics highlights that ethics deals with **reasons, recognition, and relationships**, not just states and forces. Physics lacks the tools to model "what we owe to each other."

  ### Conclusion: The Boundary of the Analogy
  - **What Translates:**  
    The aggregation/non-aggregation distinction maps cleanly onto extensive vs. intensive variables. This clarifies *why* contractualism resists summing harms.  
  - **What Distorts:**  
    Stability/equilibrium metaphors risk misrepresenting "reasonable rejection" as a mechanical outcome rather than a deliberative process.  
  - **What Fails:**  
    The core normative machinery—mutual justifiability, the moral significance of individual standpoint, and the non-fungibility of persons—has no physical analog. This failure isn't a flaw in contractualism but evidence that morality operates in a domain physics cannot access: the space of reasons among free, distinct agents.  

  **Final Verdict:** The residue confirms contractualism relies on distinctions physics genuinely omits. It’s not that the claim is indeterminate; it’s that ethics requires concepts beyond physical description. Your physics lens hasn't found indeterminacy—it’s illuminated a frontier.
