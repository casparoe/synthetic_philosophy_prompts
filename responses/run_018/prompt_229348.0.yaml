answer: |-
  This is a profound exploration of legal philosophy, touching on epistemology, metaphysics of law, and practical jurisprudence. Let's reconstruct the implicit theories step by step:

  ### 1. **The Bright-Line Threshold (0.08% BAC): Presupposed Theory of Vagueness**
     - **Legal Formalism/Conventionalism**: The statute presupposes that vagueness is a *problem to be solved by legal fiat*. It implicitly endorses:
       - **Anti-Realism about Impairment Thresholds**: There is no natural, discoverable boundary where impairment begins. The 0.08% line is a *stipulative convention* (like a dictionary definition or speed limit), not an attempt to track a pre-legal fact.
       - **Rule-of-Law Values**: Precision serves predictability, deterrence, and equality. A bright line minimizes arbitrary enforcement and gives citizens clear ex ante notice (Lon Fuller's "inner morality of law").
       - **Epistemic Pragmatism**: While impairment varies by individual, a population-level proxy is necessary for administrability. BAC is a *legally constructed surrogate* for impairment, justified by statistical correlation.

     *What it rejects*: Any commitment to metaphysical vagueness (i.e., that "impaired" has no sharp boundary in reality). The law *creates* a boundary where science sees a continuum.

  ### 2. **The Fuzzy "Impaired Driving" Standard: Presupposed Theory**
     - **Legal Realism/Contextualism**: This rule assumes:
       - **Ontological Vagueness**: "Impairment" is inherently gradient and context-dependent. No single metric captures it (e.g., tolerance, fatigue, medication interactions).
       - **Epistemic Reliance on Judgment**: Courts and officers can recognize "paradigm cases" of impairment (Wittgenstein's family resemblances) without precise thresholds.
       - **Safety Net Function**: Catches dangerous driving below BAC thresholds or involving substances without clear biomarkers.

  ### 3. **Coexistence: Complementary or Contradictory?**
     - **Pragmatic Division of Labor** (Coherent):
       - *BAC Rule*: Targets **efficiency and deterrence** for high-risk cases. Acts as a "conclusive presumption" of impairment at 0.08%+ (a legal fiction).
       - *Impaired Standard*: Targets **equity and comprehensiveness** for non-alcohol impairment or sub-BAC impairment. Embraces contextual judgment.
       - *Analogy*: Like prohibiting "vehicles in park" (bright-line) + "reckless operation" (vague standard). One defines a prohibited state, the other a prohibited manner.

     - **Incoherence Risk**:
       If BAC were framed as *discovering* the "true" threshold of impairment, conflict with the vague standard would arise. But in practice, it's understood as a policy tool. The hybrid system reveals law's **dual nature**: it aspires to both precision (rules) and justice (standards).

  ### 4. **Enforcement Tolerances: Vagueness vs. Epistemology**
     - **Measurement Error Margins**: Primarily reflect **epistemic humility** (instrument reliability, physiological variation). *Not* an acknowledgment of vagueness in "impairment." A 0.08% result ±0.01% means: "We penalize only when guilt is probable beyond measurement doubt."
     - **Prosecutorial Discretion**: Borderline cases (e.g., 0.081%) are dropped due to:
       - Resource constraints (not vagueness)
       - Moral hesitancy about punishing "technical violations"
       - **Implicit Sorites Recognition**: Punishing at 0.081% but not 0.079% feels arbitrary, so discretion softens the line’s harshness.
     
     *Why the distinction matters*: Tolerances address uncertainty in *evidence*, not vagueness in *the concept*. Vagueness would persist even with perfect measurement.

  ### 5. **If "Impaired" is Irreducibly Vague: Legal Implications**
  Adopting a robust theory of vagueness (e.g., semantic indecision or ontological indeterminacy) would require reimagining, not abandoning, the bright-line rule:
     - **Bright-Line Repurposed**:
       - **Safe Harbor**: Redefine 0.08% not as "impairment," but as a "conclusive legal prohibition" (e.g., "It is illegal to drive with BAC ≥0.08%"). This decouples it from ontological claims.
       - **Evidential Presumption**: Treat 0.08% as *prima facie* evidence of impairment, rebuttable by individual factors (some states already do this below 0.08%).
     
     - **Enhanced Role for Standards**:
       - **Tiered Penalties**: Higher penalties for BAC ≥0.08%, lower for "impaired" below threshold.
       - **Contextual Thresholds**: Variable limits (e.g., lower for commercial drivers) acknowledging vagueness’s contextual nature.
     
     - **Procedural Safeguards**:
       - **Jury Instructions**: Explicitly frame "impairment" as a spectrum requiring holistic judgment.
       - **Burden Shifting**: Require the state to prove *actual* impairment for sub-BAC charges, not just deviation from sobriety.

     - **Why Not Abandon Bright-Lines?** 
       Deterrence and efficiency necessitate rules. Even if "impaired" is vague, 0.08% is a rationally chosen *policy marker* for unacceptable risk—akin to setting a voting age despite vague "maturity."

  ### Conclusion: Law's Implicit Philosophy
  The system pragmatically **hybridizes theories**:
  - **Bright-line**: Embraces *conventionalism* ("We set boundaries where none exist").
  - **Vague standard**: Accepts *ontological vagueness* ("Impairment lacks sharp edges").
  - **Enforcement tolerances**: Reflect *epistemic limitations* ("We know our tools are imperfect").

  This isn’t theoretical indecision but a **functional pluralism**. Law uses precise rules to combat vagueness where administrability demands it, while reserving standards for contexts needing nuance. The tension mirrors law’s struggle to balance certainty with fairness—a reminder that legal systems are human tools for governing fuzzy realities, not metaphysical treatises.

  *Would this change if philosophers convinced legislatures that "impaired" is fundamentally vague?* Only superficially. Law would retain bright lines as risk-based prohibitions, relabeling them as policy choices rather than natural boundaries—a shift in rhetoric more than substance. The deeper lesson: law’s power often lies in its *fictions*, not its metaphysics.
