answer: |-
  The institutional split you describe presupposes a **dualistic ontology of information**: information is treated as *abstract and substrate-independent* in computational contexts, but *physical and entropic* in thermodynamic contexts. This duality is pragmatically useful but philosophically tension-filled. Here's a reconstruction of the implicit view, its coherence, and consequences of rejecting it:

  ---

  ### **Implicit Ontology: The Dualistic Framework**
  1. **Computer Science/Information Theory Perspective**:  
     - **Information as Abstraction**: Bits are logical states (0/1) divorced from physical implementation.  
     - **Computation as Mathematics**: Algorithms are formal symbol manipulations; thermodynamics is irrelevant to correctness or complexity.  
     - **Thermodynamic Neutrality**: Logical operations (e.g., AND, XOR) incur no *inherent* energy cost—only imperfect implementations do.

  2. **Physics Perspective (Maxwell's Demon Resolution)**:  
     - **Information as Physical**: Measurement and erasure are physical processes requiring work.  
     - **Landauer's Principle**: Erasing 1 bit *must* dissipate *kT* ln 2 heat to reset the system's entropy.  
     - **Computation as Thermodynamic**: The demon’s "brain" is a physical system; its memory erasure restores the Second Law.

  ---

  ### **Coherence of the Split**
  - **Is it coherent to treat algorithms as mathematical but the demon's computation as physical?**  
    **Yes, conditionally**. The distinction holds if:  
    - Computation is viewed in *layers*:  
      - **Abstract Layer**: Algorithms as mathematical objects (CS focus).  
      - **Physical Layer**: Instantiation requiring energy/matter (physics focus).  
    - **Boundary Condition**: Thermodynamics applies *only* when information is irreversibly erased or measured in a way that reduces phase space.  
    - **Exception Handling**: Abstract computational reversibility (e.g., Toffoli gates) doesn’t mandate physical reversibility, but erasure does.  

    **Inconsistency emerges only if one conflates layers**: e.g., claiming abstract bits *must* obey Landauer’s principle, or that physical bits can avoid thermodynamics via "pure logic."

  ---

  ### **Consequences of a Consistently Non-Physical Information Ontology**  
  If information is *always* abstract/non-physical:  
  1. **Maxwell's Demon Resolution Collapses**:  
     - Landauer’s principle becomes invalid (erasure has no intrinsic cost).  
     - The demon’s sorting could violate the Second Law unless new physics is invoked (e.g., quantum decoherence).  

  2. **Physics Pedagogy Requires Overhaul**:  
     - Alternative demon resolutions needed, e.g.:  
       - Deny the demon’s *measurement* ability (quantum limits, e.g., Szilard engine).  
       - Invoke energy costs in *acquisition* of information (Bennett’s later work).  
       - Attribute entropy to correlation destruction, not erasure.  

  3. **Computational Thermodynamics Redefined**:  
     - Reversible computing becomes *thermodynamically free* in theory, erasing Landauer’s barrier.  

  ---

  ### **Landauer, Erasure, and Reversible Computing: Core Tensions**  
  - **Does the resolution depend on irreversible erasure?**  
    **Yes, in standard accounts**. The demon’s memory *erasure* is the entropy dump site, not computation itself. Bennett’s 1982 revision shows that *reversible* computation (without erasure) avoids dissipation, but:  
    - **The demon still requires erasure**: To operate cyclically, it must reset its memory between trials, forcing erasure.  
    - **Erasure is fundamentally irreversible**: Even with reversible gates, deleting information to reuse a finite memory *requires* entropy export (Landauer’s principle).  

  - **Reversible Computing’s Theoretical Possibility**:  
    - Reversible architectures (e.g., Fredkin gates) can compute with *zero* dissipation *if* no information is erased.  
    - **But**: Infinite memory isn’t physical. Resetting memory for reuse *demands* erasure, reactivating Landauer’s cost.  
    - **Pedagogical Gap**: CS often omits that reversible computing delays—but doesn’t eliminate—entropic costs to the erasure step.  

  ---

  ### **Conclusion: Pragmatism vs. Consistency**  
  The split ontology is **coherent pragmatically** but **incomplete metaphysically**. It accommodates disciplinary efficiency:  
  - CS abstracts hardware to focus on complexity;  
  - Physics ties information to thermodynamics to save the Second Law.  

  **To adopt a consistently non-physical view**:  
  - Physics curricula must abandon Landauer’s principle and ground the demon’s failure elsewhere (e.g., quantum measurement limits).  
  - CS must acknowledge that *implementing* algorithms *always* risks thermodynamic costs when resetting memory.  

  **The unresolved tension**: Reversible computing theoretically separates logic from erasure, but erasure remains unavoidable in finite physical systems. Thus, Landauer’s principle—and the demon’s reliance on it—stands, but only as a *physical* constraint on *abstract* information processing.
