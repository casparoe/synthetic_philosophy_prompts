answer: |-
  **ART INSURANCE POLICY: FORM S-7 (METAPHYSICAL CONTINUITY RIDER)**  
  **POLICY HOLDER:** ÆSTHETICA MUSEUM  
  **OBJECT:** *DANCING NYMPH* (MARBLE STATUE WITH CLAY ARMATURE; ACCESSION #Δ-547)  

  **1.0 PREAMBLE**  
  This Policy indemnifies the Insured Object against material loss, existential discontinuity, or metaphysical ambiguity arising from Conservation Procedure #84 ("Gradual Armature Replacement"). Coverage applies exclusively to the Object’s identity as defined herein.  

  **2.0 DEFINITIONS**  
  2.1 **"Insured Object"** denotes the *Dancing Nymph* statue, indexed under the dominant sortal "statue" (not "lump of marble/clay"). Identity persists iff:  
  &emsp;(a) It occupies a continuous worldline through spacetime;  
  &emsp;(b) >51% of its original aesthetic essence is preserved;  
  &emsp;(c) No rival entity satisfying (a)–(b) emerges concurrently (see §5).  
  2.2 **"Permanent Parts"** are marble components (>5g mass) irreplaceable without identity disruption.  
  2.3 **"Temporary Parts"** are clay armature fragments scheduled for removal. These lack coverage after excision.  
  2.4 **"Shadow Statue"** refers to the negative-space configuration left by each removed clay fragment. Coverage limited to §7 provisions.  

  **3.0 CONSERVATION PROTOCOL**  
  3.1 During armature replacement, the Insured Object endures as a single entity (endurantism model).  
  3.2 Excised clay fragments cease to be Temporary Parts immediately upon detachment.  

  **4.0 IDENTITY MAINTENANCE**  
  4.1 The Insured Object’s continuity is governed by Four-Dimensional Preservation:  
  &emsp;(a) Each temporal stage (perdurantism) must share >90% matter with its predecessor.  
  &emsp;(b) Co-located entities (e.g., "statue" and "clay aggregate") are distinct; only the statue-sortal qualifies.  
  > *Senior Conservator’s Note:* "It’s the *Nymph*. Always has been. If you reassemble the clay, you get fancy pottery—not art."  

  **5.0 NO-BRANCHING CLAUSE**  
  5.1 Should discarded clay fragments be reassembled into a distinct entity satisfying *Dancing Nymph*’s appearance and function:  
  &emsp;(a) The reassembled entity is deemed a "rival object" and excluded from coverage.  
  &emsp;(b) Identity priority defaults to the entity containing >50% original marble.  
  5.2 In disputes, Æsthetica Museum’s Conservation Logbook supersedes external claims.  

  **6.0 TEMPORARY PARTS DISPOSITION**  
  6.1 Excised clay fragments are designated "non-essential matter" after removal.  
  6.2 Transfer to third parties voids their metaphysical association with the Insured Object.  

  **7.0 SHADOW STATUE RIDER**  
  7.1 Negative-space voids left by clay removal ("Shadow Statues") may be insured if:  
  &emsp;(a) The void retains a silhouette recognizable as *Dancing Nymph* per §2.1(b);  
  &emsp;(b) No marble component occupies >10% of the void’s volume.  
  7.2 In no event shall the Shadow Statue, the Insured Object, and any reassembled clay rival (§5) be deemed identical.  

  **8.0 DISPUTE RESOLUTION**  
  8.1 Continuity claims must be submitted to the Metaphysical Arbitration Panel (MAP).  
  8.2 MAP criteria:  
  &emsp;(a) Aesthetic dominance of form over matter;  
  &emsp;(b) Historical provenance of intentionality;  
  &emsp;(c) Absence of spatial overlap with rivals.  
  8.3 MAP rulings are binding, final, and ineligible for temporal-part appeals.  

  **9.0 EXCLUSIONS**  
  9.1 Identity failure due to:  
  &emsp;(a) Simultaneous existence of ≥2 entities satisfying §2.1 criteria;  
  &emsp;(b) Replacement of >49% marble mass in a single conservation session;  
  &emsp;(c) Quantum superposition of the Insured Object and Shadow Statue.  

  **10.0 CLAIMS PROCESS**  
  10.1 Proof of loss requires:  
  &emsp;(a) Timestamped conservation records;  
  &emsp;(b) 3D scan verifying spacetime trajectory compliance (§3.1);  
  &emsp;(c) Affidavit from Senior Conservator attesting to "common-sense continuity."  

  **SUMMARY:** This policy endorses endurantism tempered by aesthetic essentialism, rejecting both mereological universalism and the tyranny of temporal parts.
