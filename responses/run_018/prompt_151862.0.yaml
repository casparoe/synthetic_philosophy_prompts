  hey, can you draft a final exam essay for my upper-level rational-choice seminar? 12 students, 75 minutes, 30 marks total. We covered Newcomb, evidential vs causal decision theory, and that Platonia dilemma / Luring Lottery stuff about superrationall agents facing a predictor. I want it in the weeds — not just "summarize Platonia" — so I'm injecting a twist I made up called the Cascaded Lure.

  Set up the exam like this: start with a one-paragraph recap of the standard one-shot Platonia dilemma (two identical reasoners, each picks Enter or Pass; exactly one enter gets a million, both or neither get a hundred; no entry cost). Then present the twist: three rounds, same simultaneous choice each round, but now each agent has a hidden type — Stable or Volatile — assigned randomly and privately, unknown even to themself. Per round payoffs: exactly one enters -> entrant gets $500k times the round number if Stable, $0 if Volatile; the other gets $50k regardless. Both enter or both pass -> each gets $200 that round. After round 3 all types are revealed publicly.

  The exam should have three parts:

  Part 1 (10 marks): Explain why in the one-shot Platonia case the usual dominance reasoning for entering collapses once the agents recognize they share an identical reasoning algorithm. Pinpoint the exact step where superrationall symmetry undermines the "I should enter regardless" argument.

  Part 2 (12 marks): Apply that analysis to the Cascaded Lure. Do the hidden Stable/Volatile types break the superrational symmetry or preserve it? Would an evidentialist and a causalist give different recommendations for round 1? Be specific about whether the unknown type functions like the Newcomb predictor or like pure noise.

