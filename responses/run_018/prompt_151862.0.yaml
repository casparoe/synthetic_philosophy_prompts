answer: |-
  ## Final Exam: Cascaded Lure & Superrationality  
  **Time:** 75 Minutes | **Total Marks:** 30 | **Answer all parts.**

  **Scenario Recap:**  
  Recall the standard one-shot Platonia Dilemma: Two identical superrational agents simultaneously choose "Enter" or "Pass". Exactly one "Enter" wins $1,000,000; both "Enter" or both "Pass" wins each $100. No entry cost. Agents know they share identical reasoning algorithms and inputs, leading to perfect symmetry. The "obvious" dominance argument for entering ("I get $1M if they pass, $100 if they enter; better than $100 if I pass") collapses because agents realize their decisions are logically entangled. If both reason identically, they must choose the *same* action. But if both enter, they lose the prize. Superrationality suggests coordinating on the mutually superior outcome (both pass for $100 each) avoids the $100/$100 symmetry trap of both entering.

  **The Twist: Cascaded Lure**  
  Now, agents play **three rounds** of a modified game. Before Round 1, each agent is privately assigned a hidden **type**: **Stable** (50% chance) or **Volatile** (50% chance). Crucially, *agents do not know their own type*. Each round, agents simultaneously choose Enter (E) or Pass (P). Payoffs **per round** are:  
  - If **exactly one agent Enters**:  
    - The **Entering agent** gets **$500,000 × Round#** if **Stable**, **$0** if **Volatile**.  
    - The **Passing agent** gets **$50,000** regardless of type.  
  - If **both Enter** or **both Pass**: Each gets **$200**.  
  After Round 3, all types are revealed publicly. Agents are superrational and know it.

  ---

  **Part 1: Collapse of Dominance in Platonia (10 Marks)**  
  Explain why the dominance reasoning ("I should Enter regardless of what the other does") fails in the standard one-shot Platonia Dilemma once agents recognize their identical reasoning. Pinpoint the *exact step* where superrational symmetry undermines this argument.

  **Model Answer Snippet:**  
  > Dominance reasoning assumes *I* can freely choose Enter while the *other* agent's choice remains independent. But superrationality breaks this: since both agents use identical algorithms on identical information (including knowledge of symmetry), they *must* reach the same conclusion. "I Enter" logically implies "They Enter" (and vice versa). The fatal step is assuming counterfactual independence ("*If* I Enter, *maybe* they Pass"). Under symmetry, "I Enter" isn't independent—it entails "They Enter", collapsing the supposedly dominant strategy into the worst joint outcome ($100 each). Dominance fails because the "rows" in my decision matrix aren't causally separable; my choice *is* their choice.

  ---

  **Part 2: Cascaded Lure Analysis (12 Marks)**  
  Apply the above analysis to Round 1 of the Cascaded Lure.  
  (i) Do the hidden Stable/Volatile types break or preserve superrational symmetry?  
  (ii) Would an evidential decision theorist (EDT) and a causal decision theorist (CDT) give different recommendations for Round 1?  
  (iii) Is the unknown type functionally like a Newcomb predictor or pure noise? Be specific.

  **Model Answer Snippet:**  
  > (i) Types *preserve symmetry*. Agents still share identical algorithms and inputs (including ignorance of their type). Superrationality forces identical *reasoning*, leading to identical actions each round, regardless of hidden type (which doesn’t affect cognition).  
  (ii) **YES**.  
  - **EDT** sees "I Enter" as *evidence* my twin also Enters (due to symmetry). But "twin Enters" is *also* evidence *I* am Stable (since only a Stable entrant gets paid: $500k vs $0). EDT calculates: P(I’m Stable | I Enter) = P(twin Enters & I’m Stable) / P(I Enter). By symmetry P(twin Enters | I Enter) ≈ 1. P(I’m Stable) = 0.5. But *conditional on both Entering* (which symmetry demands), the expected payoff is (0.5 × $500k) + (0.5 × $0) = $250k. Passing when twin Enters gives $50k. Both Passing gives $200. So EDT *prefers Entering* ($250k > $50k or $200).  
  - **CDT** ignores the evidential link. My choice *causes* no change to my type or the twin's action (due to simultaneity/symmetry). CDT sees: *If* I Enter, I get $500k×1 if Stable (prob 0.5), $0 if Volatile (prob 0.5) → $250k expected. *If* I Pass, I get $50k if twin Enters (which CDT doesn’t tie to my choice), or $200 if twin Passes. Without the evidential link, CDT treats twin's action as independent. Assuming P(twin Enters) = 0.5 (naive), Pass pays (0.5×$50k) + (0.5×$200) = $125k. $250k > $125k → CDT *also* prefers Enter. **BUT** wait: Symmetry forces P(twin Enters) = 1 *if* I Enter, so CDT *must* acknowledge the correlation. Correct CDT sees: Choosing Enter *causes* me to be in the "both Enter" state (via symmetry), paying $250k. Choosing Pass *causes* "both Pass" ($200) since twin mirrors me. So $250k > $200 → CDT *still* prefers Enter.  
  (iii) **Like a Newcomb predictor.** The hidden type *correlates with the twin's action* via the superrational link. "I am Stable" is evidence (to EDT) that "twin will Enter" (since only then does my Stable type yield $500k), just like Newcomb's box B being full is evidence the Predictor foresaw one-boxing. It’s not noise because the payoff *depends* on the type-action correlation.

  ---

  **Part 3: "Just Newcomb?" Rebuttal (8 Marks)**  
  A study-group partner claims: "Cascaded Lure is just Newcomb with extra steps—hidden type = predictor, rounds = repetition." Give the best reply identifying **one structural feature** unique to Cascaded Lure with **no Newcomb analog**, explaining why the reduction fails.

  **Model Answer Snippet:**  
  > **The Volatile type’s $0 payout for solo entry has no Newcomb parallel.** In Newcomb, a one-boxer *always* gets $1M (+$1k) regardless of hidden traits; a two-boxer gets $1k (or $1,001k). Here, a Stable entrant gets $500k×round if solo, but a Volatile entrant gets **$0** under the *same* condition (solo entry). This creates a **perverse incentive against Entering if one suspects being Volatile**—something absent in Newcomb. Crucially, in later rounds, *revealed types* from earlier rounds break symmetry: E.g., if Round 1 shows I’m Volatile and my twin is Stable, symmetry is shattered; we’re no longer identical reasoners. Rounds aren’t mere repetition; they create evolving, asymmetric information states. Newcomb has no such state-dependent payoff asymmetry or mid-game revelation breaking agent symmetry.

  ---

  **Marking Scheme (30 Total)**  
  1.  **P1: Symmetry Breaks Dominance (6 marks)**  
      *Must hit:* Dominance assumes choice independence; symmetry makes choices logically identical.  
      *Common error:* Says "they think the same" without explaining why this *invalidates* dominance reasoning.  
  2.  **P2(i): Types Preserve Symmetry (2 marks)**  
      *Must hit:* Hidden types don’t affect reasoning algorithm/inputs; identical outputs still forced.  
      *Common error:* Claims types break symmetry because "agents are different".  
  3.  **P2(ii): EDT vs CDT Distinction (8 marks)**  
      *Must hit:* EDT uses Enter→evidence of being Stable; CDT ignores evidence but (correctly) acknowledges symmetry-induced correlation. Both recommend Enter for Round 1.  
      *Common error:* Misapplies CDT by ignoring symmetry (e.g., assumes random twin action). Or claims EDT prefers Pass.  
  4.  **P2(iii): Type as Predictor, Not Noise (2 marks)**  
      *Must hit:* Type correlates with action/payoff meaningfully (like Newcomb’s predictor), not randomly.  
      *Common error:* Calls it "noise" or conflates with risk.  
  5.  **P3: Unique Structural Feature (12 marks)**  
      *Must hit:* Identifies **Volatile’s $0 solo payout** OR **revealed types breaking symmetry mid-game** AND explains why this has no Newcomb equivalent and prevents reduction.  
      *Common error:* Vague ("it’s more complex") or focuses on number of rounds without unique mechanism.  

  ---

  **Good luck! Remember: Superrationality means your answer is probably identical to your neighbor's. Don’t panic.**
