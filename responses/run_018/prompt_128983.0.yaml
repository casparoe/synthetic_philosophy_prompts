prompt: |-
  I'm a software engineer without formal philosophy training, and I'm dissatisfied with the usual "agent versus stochastic parrot" framing of LLMs. Please build a decision-tree taxonomy that classifies positions by concrete functional commitments rather than by the labels people use.

  Use exactly these five branch questions, each answerable yes/no without knowing philosophical jargon: (1) Does the system have causally efficacious propositional-attitude states—beliefs or intentions—that drive outputs, rather than being merely interpreted into them? (2) Does it maintain diachronic coherence, meaning stable goals, character, or reasoning patterns across extended multi-turn interactions? (3) Is its reasoning counterfactually robust, yielding the same conclusion when the prompt is syntactically altered but semantically preserved? (4) Does it have functional access to its own internal processing states, not merely its outputs? (5) Can it initiate environmental or weight-level changes without direct human intermediation?

  For each leaf, give the position's common or descriptive name, a one-sentence statement of its most awkward commitment, and—if the combination of answers is logically possible but unoccupied—note it as unnamed with a brief diagnosis (incoherent, unattractive, or unexplored). Flag any pair of leaves that this tree genuinely cannot separate. Do not include citations, bibliographies, or references to specific papers; I need to evaluate this without web access.
