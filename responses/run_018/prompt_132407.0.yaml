answer: |-
  The board's position rests on a sophisticated but controversial philosophical framework with distinct theories of moral responsibility, historical judgment, and commemorative ethics. Let's reconstruct it precisely:

  **Core Philosophical Commitments:**
  1.  **Domain-Specific Commemorative Worth:** This is central. The board presupposes that societal honor can be legitimately attached to *specific contributions* (funding public institutions) without endorsing the honoree's *entire life or character*. Achievements in philanthropy/civic life are seen as conceptually and morally separable from harmful practices in economic exploitation. This relies on a **compartmentalization thesis**: human actions and impacts in one sphere (commerce) do not inherently contaminate or negate value in another (philanthropy).

  2.  **Intentionality and Direct Role as Locus of Blame:** Moral responsibility is tied primarily to:
      *   **Intentionality:** Actions undertaken knowingly and willingly.
      *   **Direct Institutional Role & Control:** Actions performed within the scope of one's defined role and over which one had significant control.
      *   **Specific Harmful Actions:** Blame attaches to *doing specific harmful things* (e.g., directly ordering coercive labor practices), not merely to *benefiting* from a harmful system or holding a position within it. Being a "primary beneficiary and active architect" is insufficient *unless* the specific harm commemorated *is* the source of the wealth used for the honored act *or* the honored act itself *is* the harm. Funding a library with profits is distinct from, say, naming a plaza *for* operating the coercive fleet.

  3.  **"Focused Honor" Theory of Commemoration:** Public naming is not an endorsement of a person's entire moral character or life history. It is a specific acknowledgment of a specific, contextually valuable contribution to the community ("commemorative core"). The "biographical periphery" – other actions, beliefs, or contexts – is acknowledged as relevant history but deemed non-disqualifying for this specific act of recognition.

  4.  **Contextualization as Redemption/Sufficiency:** The primary harm of problematic commemoration is seen as *erasure* or *uncritical celebration*. Providing historical context (the interpretive installation) mitigates this harm by acknowledging the full picture. This transforms the monument from pure celebration into a site of complex historical education. Retention + context is seen as morally sufficient and preferable to removal (which might be viewed as erasure or presentism).

  5.  **Forward-Looking Pragmatism:** The *current value* of the public institution (the plaza, the library) funded by the philanthropy is a significant factor. Disrupting this established public good (by renaming the plaza) is seen as requiring a higher justificatory threshold than contextualizing its origin.

  **Distinctions: What's Required vs. What Fits:**
  *   **Strictly Required:**
      *   Domain-specificity of commemorative worth (philanthropy separable from exploitation).
      *   Rejection of the principle that benefiting from/architecting systemic harm automatically forfeits *all* commemorative standing.
      *   Belief that contextualization can redeem the commemorative act.
      *   Focus on the *specific contribution honored*, not the whole person.
  *   **Merely Fits/Accommodates (but not strictly required):**
      *   A purely consequentialist view of morality (focus on outcomes like the library).
      *   A strictly action-based (vs. character-based) ethic. The framework *works* with action-based ethics but doesn't *require* rejecting character-based views. One could believe character matters but still compartmentalize contributions.
      *   A relativist view of historical morality ("everyone was doing it"). The board *could* hold this, but their rule doesn't depend on it; they might acknowledge the actions were objectively wrong but still separable.
      *   A view that systemic harm is less morally culpable than direct, personal harm.

  **Moral Character vs. Moral Action:**
  An opponent accepting the board's distinction is **not necessarily locked into** a specific theory privileging moral action *over* moral character. The framework primarily **privileges specific *contributions* over either a holistic assessment of *actions* or *character*.** It allows for the possibility that:
  *   The honoree had a deeply flawed character, but *this specific philanthropic act* was genuinely good and worthy of recognition.
  *   Many of the honoree's actions were reprehensible, but *this specific action* (funding the library) was good.
  It sidesteps the character vs. action debate by focusing narrowly on the *legacy of the specific contribution* to the community. One could believe character is paramount but still accept that public commemoration can legitimately target isolated contributions.

  **Consequences of Adopting the Alternative Standard:**
  Adopting the standard that "active, knowing participation in and profit from systemic harm forfeits commemorative standing irrespective of parallel achievements" would necessitate abandoning or fundamentally reconceiving key elements:

  1.  **Retention of the Name:** This becomes untenable. If the systemic harm is disqualifying *per se*, keeping the name is seen as an ongoing endorsement of the honoree, inherently contaminated by the harm. The name itself becomes a symbol of the harm, regardless of context.
  2.  **The "Commemorative Core" / "Biographical Periphery" Distinction:** This framework collapses entirely. The systemic harm is not "peripheral"; it becomes central to the moral assessment of the *person*, rendering any "core" worthy of public honor impossible. The harm defines the legacy.
  3.  **The Interpretive Plaque:** Its function changes radically. It could no longer serve as a contextualizing footnote enabling retention. It might only be conceivable as part of a *new* monument explicitly about the harm itself (e.g., "Site of Former X Plaza, named for a profiteer of coerced labor"), or as a condemnation accompanying removal. Its purpose shifts from enabling nuanced commemoration to documenting culpability or explaining removal.
  4.  **The "Defining Legacy":** This concept becomes problematic. The alternative standard rejects the idea that a positive legacy can be "defined" in isolation from the systemic harm. The magnate's legacy is seen as fundamentally *constituted* by both the exploitation *and* the philanthropy, with the former morally negating any commemorative value derived from the latter. The "defining legacy" is one of exploitation enabled by wealth, making any public honor based on that wealth inherently immoral. Public memory must prioritize condemnation or critical examination, not selective celebration.

  **In essence:** The board's framework relies on moral and historical compartmentalization and views contextualization as redemptive. The alternative standard views systemic harm as morally totalizing, rendering any public honor based on wealth derived from it inherently compromised and requiring removal to avoid endorsement and to prioritize justice in historical memory. The core dispute hinges on whether certain contributions *can* be morally quarantined from the harms that enabled them.
