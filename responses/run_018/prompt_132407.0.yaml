  The user asks whether accepting this distinction locks someone into particular theories of moral character versus action. Interesting nuance here. The board's position seems compatible with both character-based and action-based ethics, but strongly favors action-focused judgment since it separates specific blameworthy actions from other praiseworthy ones. 

  Now, if we replace this with a view that systemic harm forfeits all commemorative standing, we'd have to abandon: the name retention (since honor becomes impossible), the commemorative/core-periphery framework itself (as the harm defines the legacy), and possibly the plaque (which might shift from contextualization to condemnation). The very concept of a "defining legacy" would collapse under this alternative view.

  The user seems philosophically sophisticated - they're not just asking for an opinion but for structural analysis. They're likely frustrated with the board's compromise and seeking intellectual tools to challenge it. I should maintain academic rigor while making this accessible. 

