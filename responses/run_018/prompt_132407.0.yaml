prompt: |-
  I have been sitting in on the hearings of my city's public memorials board, which is currently debating whether to retain a prominent downtown plaza named after a nineteenth-century shipping magnate whose fortune built the local university library but whose fleet also carried goods produced by coerced labor in overseas territories. The board's working draft proposes a formal distinction between "commemorative core" and "biographical periphery": they recommend keeping the plaza's name intact, accompanied by an interpretive installation, provided that the reason the figure was originally honored—philanthropic funding of public institutions—is not itself the harmful practice. They explicitly reject the alternative standard that would disqualify anyone who was a primary beneficiary and active architect of systemic exploitation, regardless of other achievements. I am trying to understand the philosophical architecture that makes this distinction seem reasonable to them.

  What theory of moral responsibility, historical judgment, and the ethics of public memory does this institutional rule presuppose? Does it commit the board to a view that commemorative worth is domain-specific—that achievements in education or civic architecture can be quarantined from moral failures in economic extraction—or does it instead rely on a control-based account of blame that only attaches to actions within one's direct institutional role? Reconstruct the implicit framework, carefully distinguishing what the practice strictly requires from what it merely happens to fit with, and tell me whether an opponent who accepts the board's distinction is thereby locked into a particular theory of moral character versus moral action. Furthermore, if we replaced the board's underlying view with one holding that active, knowing participation in and profit from systemic harm forfeits commemorative standing irrespective of parallel achievements, what specific elements of the current practice—the retention of the name, the interpretive plaque, the very idea of a "defining legacy"—would have to be abandoned or reconceived? Please provide your answer in American English.
reasoning: |-
  Okay, the user is presenting a complex ethical and philosophical dilemma about public commemoration. They've been observing their city's memorials board debates regarding a plaza named after a 19th-century shipping magnate with a problematic history involving coerced labor. The board proposes keeping the name while adding contextual information, drawing a distinction between "commemorative core" (philanthropy) and "biographical periphery" (exploitation). 

  Hmm, the user wants me to unpack the philosophical framework behind this distinction. They're asking specifically about theories of moral responsibility, historical judgment, and ethics of public memory. This requires careful analysis of what the board's position implies versus what it merely accommodates. 

