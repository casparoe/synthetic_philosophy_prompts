answer: |-
  ### The Reprimand Protocol: Structured Deliberation  
  **Total Time:** 90 minutes  
  **Participants:** 8–12 advanced undergraduates/early graduate students  
  **Core Objective:** Participants experience how treating hypocrisy as a binary disqualifier collapses collective blame, revealing standing as a distributed resource.  

  ---

  ### **Preparation**  
  1. **Case Card**: Describe a serious transgression.  
     *Example:* "Dr. A, a senior scholar, systematically took credit for graduate students' research in 3 publications over 2 years. The students received no acknowledgment."  
  2. **Fault Cards**:  
     - **Tainted (75% of participants)**: Minor, relatable faults.  
       *Examples:* "Once, you forgot to credit a colleague for a minor idea in a seminar"; "Once, you omitted a co-author’s contribution in a footnote."  
     - **Pure (25%)**: "You have never failed to give credit where due."  
  3. **Materials**: Red/green tokens, secret ballots, central board.  

  ---

  ### **Procedure** (60 minutes)  
  #### **Phase 1: Silent Positioning** (10 min)  
  - Facilitator reads the case aloud.  
  - Participants **write privately**: *Should the group issue a formal condemnation?* (No discussion).  

  #### **Phase 2: Structured Disclosure** (25 min)  
  - Circle seating. **Each speaks once** in order:  
    - **Supporters** must declare "tainted" or "pure" (no details) and place a token:  
      - 🔴 Red = Tainted supporter.  
      - 🟢 Green = Pure supporter.  
    - **Opponents** state opposition and place **no token**.  
  - Facilitator updates the board in real time: *"Current tokens: 3 green, 5 red, 2 opposed."*  

  #### **Phase 3: Vote and Payoff** (15 min)  
  1. **Secret ballot**: Participants sign/refuse the condemnation statement.  
  2. **Reward condition**: Group receives a reward (e.g., choose next topic + snacks) **only if ≥75% sign**.  
  3. **Reveal fault cards**: All cards shown face-up.  
  4. **Apply purity filter**: Only 🟢 token-holders’ votes count toward the 75% threshold.  
     - *Anticipated outcome*: Raw votes often pass (e.g., 80% sign), but filtered votes fail (e.g., only 25% are pure 🟢 supporters). Reward collapses.  

  ---

  ### **Debrief** (30 min)  
  **Map the Experience to the Concept**  
  1. **Phase 1 (Silent Positioning)**:  
     - *Link to idea*: Initial confidence assumes purity resides *elsewhere*. Participants overlook their own minor faults.  
     - *Prompt*: "In the silent phase, did you assume others were ‘pure’? How did that shape your initial yes/no?"  

  2. **Phase 2 (Disclosure)**:  
     - *Link to idea*: First 🔴 token triggers defensiveness/strategic silence. Red tokens accumulate, making support feel reckless.  
     - *Prompt*: "When the first ‘tainted’ supporter spoke, how did the room shift? Did red tokens make supporting harder?"  

  3. **Phase 3 (Collapse)**:  
     - *Link to idea*: Revealed taint shows consistency requires near-total silence. Private blame (ballot) survives, but public standing collapses.  
     - *Prompt*: "After the purity filter, we lost the reward despite strong raw support. Why did collective judgment fail?"  

  **Address Predicted Failures**  
  - **Failure 1: Rejecting binary taint**  
    - *Likely argument*: "Degrees of fault matter!" or "Acknowledgment restores standing!"  
    - *Response*: "Could the group draw a **non-arbitrary line** between ‘minor’ and ‘major’ fault *during Phase 2*? The game freezes time—real standing can be repaired, but here we see the cost of an all-or-nothing rule."  

  - **Failure 2: Silent supporters**  
    - *Likely behavior*: Oppose in Phase 2 (no token) but sign ballot in Phase 3.  
    - *Response*: "This isn’t cheating—it shows the **tension between private blame and public standing**. Why might someone condemn privately but stay silent publicly?"  

  **Acknowledge Limitations**  
  - **What the game excludes**:  
    - Standing is **diachronic** (apology/change matters; the game freezes it).  
    - **Private blame** often endures when public standing collapses.  
    - Real-world judgment relies on **long-term reputations**, not one-round snapshots.  
  - *Facilitator note*: "Actual communities avoid collapse by allowing redemption or relaxing purity—otherwise, no one can speak."  

  **Final Conceptual Frame**  
  - "Standing to blame isn’t just an individual badge—it’s a **group resource**. If most share a minor fault, strict purity:  
    1. **Excuses hypocrites** (expected), but also...  
    2. **Collapses collective power** (unexpected).  
    - We’re left with two uneasy fixes: accept arbitrary asymmetry (only the pure speak) or relax purity. Both *feel* flawed—that’s the tension."  

  ---

  ### **Facilitator Notes**  
  - **No theory names**: Use phrases like "shared minor faults" (not "moral luck") or "collective power" (not "standing norms").  
  - **Pacing**: Strictly enforce speaking time in Phase 2 (90 seconds/person).  
  - **Token psychology**: Place the board centrally—red tokens induce visceral unease.  
  - **Reward stakes**: Make rewards tangible (e.g., "Choose next week’s topic") to mirror real-world incentives.  
  - **Outcome likelihood**: In groups of 12, 3 pure 🟢 tokens. Even if all 3 sign, 3/12 = 25% < 75% → reward fails. Raw votes typically pass (tainted supporters often sign ballots).  

  By embedding the dilemma in lived experience, the protocol forces confrontation with hypocrisy’s paradox before naming it—making the theoretical insight *emerge* from collective frustration.
