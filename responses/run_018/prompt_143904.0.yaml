answer: |-
  *(Leans forward, eyes alight with recognition)*  
  You've grasped the core of it. That modern bias you detect—the conflation of *centralized spectacle* with *society itself*—is precisely why I reject "collapse" as a false obituary. What you call "deliberate resizing," I term **subsistence-first decoupling**: the conscious uncoupling of burdensome, resource-hungry superstructures from the enduring subsistence base that actually sustains life. Let me defend this with the evidence you’ve invoked and push further.  

  **Easter Island is indeed paradigmatic.** When the last great *toromiro* tree fell, the islanders didn’t wail helplessly as their society "ended." They *stopped* the moai. Why? Because transporting megaliths required immense social coordination and calorie expenditure—energy that could no longer be spared. But look deeper: the *mana* system didn’t vanish; it *adapted*. Birdman rituals emerged, demanding far less timber but still channeling social competition. Sweet potato yields remained stable in lithic mulch gardens. Fishhooks of human bone show continuity in maritime skills. The people didn’t fail; they *divested* from an unsustainable practice and reinvested energy into survival. Archaeologists fixated on statues declared them "collapsed," but the soil tells us: **they lived**.  

  **The Maya lowlands? Same pattern.** When Tikal’s last king faded, the *milpa* farmers didn’t vanish. Terraces at Caracol show continuous cultivation. Petén farmers kept planting maize, beans, and squash using generations-deep knowledge. Ceramic styles evolved locally—no longer stamped with royal insignia, but still functionally elegant. The "collapse" was of kingship, not culture. The surplus that once built pyramids was reclaimed by the households that produced it. Ask yourself: was a king’s divine blood worth more than a farmer’s rain-almanac? The decoupling here was **energy-budget rationalization**: shedding the 30% of surplus siphoned by elites to prop up temples and wars, letting the 70% sustain actual lives.  

  **And the Late Bronze Age?** Palace scribes wailed of "sea peoples" and fallen kingdoms. But dig into village sites: bronze sickles and ploughshares weren’t melted down into swords or abandoned; they were *recycled locally*. Kilns kept firing pottery. Sheep still grazed hillsides. The loss of tin trade routes killed palace-centric bulk bronze production, but small-scale metallurgy persisted. What died was the illusion that a Mycenaean warlord’s redistributive feast was the only glue holding society together. Villages had always fed themselves; now they simply kept the surplus.  

  **So—is this one box for three stories? Absolutely not.** It’s a pattern of *adaptive prioritization*. When monument-building becomes a net drain on subsistence—whether through deforestation (Rapa Nui), drought-exacerbated elite competition (Maya), or trade network fragility (Bronze Age)—societies discard the drain. The "organizational unbundling" you intuit is real: **they cut the overhead**.  

  *(Pauses, fixing you with a challenge)*  
  You used "reverted" for Easter Island. Why assume statue-carving was "progress" and its end a regression? Did the farmer tending taro ever benefit from a moai? Or did her surplus feed the carvers? When you say "less visible to archaeologists," you expose the root problem: we’ve let elites monopolize our definition of civilization. If a society feeds its children, tends its sick, and passes on knowledge *without* pyramids—is that collapse? Or is it wisdom?  

  **Your turn.** When you picture the Maya "collapse," do you mourn the abandoned city—or respect the persistence of the milpa?
