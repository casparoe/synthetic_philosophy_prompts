answer: |-
  Your dilemma captures a real ethical tension—not just a building election, but a microcosm of how we navigate imperfect choices in community life. Your roommate isn't wrong that voting expresses values, but when outcomes have lasting consequences, strategy and principle must coexist. Here's a way to break it down:

  ### 1. **Acknowledge the Stakes**
     - **Marcus:** Permanent loss of shared green space + short-term relief. His "solution" sacrifices long-term community value for individual gain. Leading in polls ≠ wisdom.
     - **Diane:** Preserves the garden but abandons sustainability (compost) and accessibility (ramp). Her history with Marcus suggests possible hidden alliances or compromised principles.
     - **Raj:** Visionary but lacks feasibility. Symbolic support might feel good but won’t stop Marcus. Risk: Splitting the anti-Marcus vote.

  ### 2. **Principled Voting ≠ Purity Testing**
     Your fear of being a "sell-out" (compromising too much) or "indulgent idealist" (voting unrealistically) reveals a healthy awareness. Principled voting means:
     - **Prioritizing non-negotiable harms:** If losing the garden *forever* is unacceptable, Marcus is off the table. If Diane’s neglect of accessibility/compost violates core values, she’s compromised too.
     - **Rejecting false binaries:** Not voting for Diane ≠ automatically voting for Raj. Your vote is a tool, not an identity badge.

  ### 3. **A Strategic Framework for Integrity**
     Consider this decision tree:
     - **Step 1: Can Raj win?** If polls show him <10%, he’s a spoiler. Voting for him helps Marcus by splitting opposition. *Principle:* Don’t enable the worst outcome to "feel pure."
     - **Step 2: Is Diane trustworthy?** Investigate her split with Marcus. Did she leave on principle? Has she addressed the ramp/compost cuts? *Principle:* Don’t reward dismissiveness toward accessibility or sustainability.
     - **Step 3: Weigh lesser evils:** If Diane is flawed but stops Marcus, a vote for her preserves the garden *while you push her on accessibility/compost later*. If she’s a puppet for Marcus? Unacceptable.

  ### 4. **Action Beyond Voting**
     - **Leverage your influence:** Talk to neighbors about Diane’s accessibility/compost flaws. Push Raj to endorse Diane if he can’t win (or vice versa) to consolidate votes against Marcus.
     - **Demand commitments:** Publicly ask Diane: "Will you fix the ramp by X date? Restore compost funding?" Her reaction reveals her character.
     - **Prepare for the long game:** If Marcus wins, organize to protect the garden legally (e.g., landmark status). If Diane wins, hold her accountable day one.

  ### 5. **The Core Question: What Can You Live With?**
     - If you vote Diane to stop Marcus and she betrays you, was fighting for the garden worth it?  
     - If you vote Raj and Marcus wins by 2 votes, can you accept losing the garden forever?  
     - If you don’t vote at all, will you regret your silence?

  ### Bottom Line
  **This isn’t overthinking—it’s democratic responsibility.** Small elections shape daily lives profoundly. Vote strategically *and* morally:  
  - **If Diane’s flaws are manageable**, vote for her to save the garden while organizing to fix her policy gaps.  
  - **If she’s irredeemable**, vote Raj only if he’s viable or if losing the garden is preferable to empowering Diane.  
  - **Never enable Marcus** unless selling the garden is truly your priority.

  **Your tension isn’t drama—it’s citizenship.** The "sell-out vs. idealist" trap is real, but refusing to choose is its own moral surrender. Vote to minimize harm, then fight like hell to make the outcome better.
