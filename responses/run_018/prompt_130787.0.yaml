prompt: |-
  Everytime I travel someone hits me with "when in Rome, do as the Romans do" like its a knockdown argument — last week about tipping in NYC (which I think is coercive) and then jaywalking in Berlin. I'm trying to figure out what that proverb actually amounts to when people apply it to everyday conventions: tipping, queueing, jaywalking, and whether visitors really have moral obligations to conform.

  Can you lay out teh precise claims it could be expressing? For example: pure descriptive prediction ("locals will stare"), prudential advice ("avoid conflict"), universal morality with locally-variable rules, full-blown cultural relativism, or something weirder like the convention generating its own authority regardless of welfare. For each reading say if its trivial, defensible, false, and — crucially — whether it actually supports the conclusion people push (that I must tip/queue/jaywalk like them). I want a menu I can use, not one picked answer.

  Keep it under 300 words, bullet points ok. Also please separate what's genuinely settled (that social conventions exist and vary) from what's contested among people who study norms — don't present one side like cultural relativism or universalism as teh consensus.
reasoning: |-
  Hmm, the user is frustrated with people using "when in Rome, do as the Romans do" as a conversation-ender in travel situations, like tipping in NYC or jaywalking in Berlin. They're questioning whether this proverb actually creates moral obligations for visitors to conform to local customs. They want me to break down the different possible interpretations of this saying and evaluate each one's validity and implications.

  I need to analyze this proverb systematically. The core question is whether "when in Rome..." creates genuine moral obligations or just practical advice. The user specifically wants a "menu" of interpretations they can reference in arguments, not a single definitive answer. They've asked me to separate factual realities (customs vary) from contested philosophical positions.

  Let me outline the possible interpretations: First, it could be purely descriptive - just stating that customs exist. That's true but trivial. Second, it could be prudential advice - conforming avoids trouble. This is often true but doesn't create moral obligation. Third, it might imply local conventions have normative weight. This is philosophically contested and doesn't automatically create obligation. Fourth, it could suggest cultural relativism where morality is location-dependent. This is highly debated. Fifth, it might imply conventions create their own authority. This is philosophically extreme and generally rejected.

  I should note that all interpretations accept the basic fact that social conventions vary - that's settled. But whether conformity is morally required remains deeply contested among philosophers and anthropologists. Even if we grant local conventions some weight, it doesn't necessarily override other considerations like personal ethics or welfare concerns.

  The key takeaway is that "when in Rome..." is rarely a knockdown argument. While practical conformity is often wise, the moral obligation question depends on context and philosophical stance. The proverb's strength as an argument varies significantly based on which interpretation you adopt.
answer: |-
  Here's your analytical menu for "when in Rome" arguments:

  | **Interpretation** | **Core Claim** | **Validity/Status** | **Supports Obligation?** | **Notes** |
  |-------------------|----------------|---------------------|--------------------------|-----------|
  | **Descriptive Statement** | Conventions exist and vary locally. | Settled fact (trivial) | ❌ No | Acknowledges reality, imposes no "should". |
  | **Prudential Advice** | Conforming minimizes friction/risk. | Often defensible | ❌ No (Not moral) | Practical wisdom ≠ obligation. Effectiveness varies by context. |
  | **Local Normativity** | Conventions generate *some* genuine obligation for participants/residents. | Contested (defensible w/ limits) | ⚠️ Partially | Philosophers debate source/weight (social contract, respect). Doesn't auto-extinguish dissent. |
  | **Cultural Relativism** | Morality *is* defined by local culture; "right" = "local norm". | Highly contested | ✅ Yes (But extreme) | Rejected by universalists. Reduces to "might makes right" locally. |
  | **Self-Authorizing Conventions** | Conventions obligate *merely by existing*, regardless of reason/welfare. | Generally rejected | ✅ Yes (But weak) | Circular logic. Fails if convention is harmful/arbitrary. |

  **Settled Fact:** Social conventions *exist* and *vary significantly* across locations/cultures (tipping, queueing, jaywalking norms).

  **Contested Issues:**
  *   **Source of Normative Force:** Does participation/residence create obligation? (Social contract theories vs. dissent).
  *   **Scope of Relativism:** Are *all* local norms morally binding? (Relativists vs. Universalists).
  *   **Overriding Factors:** When do welfare, fairness, or personal ethics outweigh convention? (E.g., coercive tipping).

  **Conclusion:** "When in Rome" is **never a knockdown moral argument**. It's strongest as **prudential advice** or a weak appeal to **local normativity**, but fails to establish universal obligation. Context (harm, coercion, reasonableness) always matters. You can acknowledge the *fact* of the convention while disputing any *obligation* to follow it.
