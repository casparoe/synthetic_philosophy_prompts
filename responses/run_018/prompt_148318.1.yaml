  ### **Gaps and Limitations**
  1. **Incoherent Gap: Probabilist + Anti-computationalist**  
     - *Why*: Probabilism (Leaf 2) requires brains to run algorithms (just non-Boolean), while anti-computationalism (Leaf 4) denies algorithms exist. These can’t coexist—no one should hold both. The tree avoids this by routing "noise breaks algorithms" to Q4, separating them cleanly.

  2. **Unexplored Gap: Analog Dynamist + Probabilist**  
     - *Why*: Analog dynamics (Leaf 3) treats computation as continuous (e.g., differential equations), while probabilism (Leaf 2) uses discrete probabilistic logic. These conflict, but a hybrid "probabilistic analog" view (e.g., stochastic dynamics) is *possible*—it’s just not covered by the five leaves. The tree routes analog views away from logic-based splits (Q2, Q6), so this gap is unexplored but not incoherent.

  3. **Unattractive Gap: Redundancy Engineer + Analog Dynamist**  
     - *Why*: Redundancy engineering (Leaf 1) assumes digital foundations, while analog dynamism (Leaf 3) rejects discrete symbols. The tree forces a choice at Q2 (digital vs. not), making this combo inaccessible. It’s unattractive—few would argue for "error-corrected analog" since analog systems don’t use voting.

  4. **Can’t Separate: Nothing Special vs. Redundancy Engineer in one case**  
     - *Where*: At Q5, both leaves (1 and 5) agree brains can be digitally replicated, but Leaf 5 sees unreliability as trivial. The tree *does* separate them via Q5: "Yes" → Leaf 1, "No" → Leaf 5. However, if someone asserts "it’s digital but boring," Q5 forces a choice based on replicability, so they *are* separable.

