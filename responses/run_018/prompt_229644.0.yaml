  - **Description**: An old fishing boat kept in continuous summer service. Its hull planks were gradually replaced years ago (with the frame untouched at that time). Now, over three winters, the oak frame (keel and ribs) is being replaced rib by rib. After this work, no original wood remains—no original planks, keel, or ribs. No removed material was saved.
