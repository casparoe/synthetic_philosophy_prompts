reasoning: |-
  We are drafting a joint statement between two camps on Buddhist no-self (anatta) and personal identity.

  Camp A: Discrete-event reductionists. They say "person" is just a conventional label for a collection of discrete, impermanent mental and physical events. There is no continuous thread, not even functional continuity over time.

  Camp B: Causal-stream defenders. They say anatta denies a permanent, unitary soul (atman) but there is an impermanent causal-psychological stream (like a flame passed from candle to candle) that explains memory, karma, and moral accountability.

  We need:

  1. A numbered list of agreed claims. These should cover:
     - What anatta actually rejects (both agree it rejects a permanent, unchanging soul/atman).
     - Conventional vs ultimate description (both agree that the person is a conventional designation, but they might differ on what that entails).
     - The "scanned-mind teletransport" scenario: both agree on the physics (the mind is scanned, original destroyed, reconstructed on Mars) and that it needs philosophical explanation.

  2. The exact disagreements, each phrased in a way that each camp accepts their own version. We present these in a table with two columns: one for Camp A and one for Camp B.

  3. The cruxes: key points of disagreement. We'll list each crux and then a concrete case or argument that both accept as bearing on it. Then, we'll state each camp's prediction about that case. We can structure this as a table too.

  4. Format: First the agreed claims (numbered), then a table of disagreements (with two columns: Camp A and Camp B), then a table for cruxes (with columns for Crux, Argument/Case, Camp A Prediction, Camp B Prediction). Finally, a one-line summary.

  We avoid abstruse jargon and keep it casual. A typo or two is okay.

  Let's start with the agreed claims:

  Agreed Claims:

  1. Anatta definitively rejects the existence of a permanent, unchanging, and unitary self (atman) that persists through time and is the underlying subject of experiences.

  2. The concept of a "person" (puggala) is a conventional (samutti) designation, useful for everyday communication and ethical discourse, but it does not refer to an ultimate reality (paramattha).

  3. Both camps agree that in the "scanned-mind teletransport" scenario (where a mind-state is fully scanned, the original body destroyed, and an exact replica is reconstructed on Mars), the following physical facts are true: 
     a) The original body and brain are destroyed.
     b) The replica on Mars has an identical physical and informational state at the moment of reconstruction.
     c) There is no physical connection (like a continuous causal chain) between the original and the replica beyond the information transfer.

  4. Both camps agree that the teletransport scenario raises philosophical questions about personal identity, moral responsibility, and the continuity of consciousness that require explanation within the framework of anatta.

  Now, the disagreements:

  We'll present them in a table. Each row is a topic, and then two columns: Camp A and Camp B.

  Disagreements:

  | Topic | Camp A (Discrete-event reductionists) | Camp B (Causal-stream defenders) |
  |-------|----------------------------------------|----------------------------------|
  | **Diachronic Identity** | There is no diachronic identity whatsoever. Each moment is a discrete event, and the idea of a person as a temporally extended being is entirely a conceptual fabrication without any basis in reality, not even functional continuity. | While there is no permanent self, there is an impermanent, ever-changing causal stream of mental and physical events. This stream provides functional continuity and explains why we speak of a person over time. |
  | **Moral Responsibility** | Moral responsibility is a conventional label applied to a series of events. The only "sameness" required is the conventional designation of a life-process. The reconstructed person on Mars is morally accountable for the original's actions because we conventionally assign the same label to both. | Moral responsibility requires causal continuity in the psychological stream. The replica on Mars, lacking causal continuity with the original (it's a copy, not a continuation), is not morally responsible for the original's actions. It's a new being with the same memories. |
  | **Karma** | Karma is the causal relationship between events, but without any enduring entity. The results of actions are experienced by the appropriate subsequent event clusters, which are linked by causal patterns but not by identity. | Karma operates through the causal stream. The stream that committed an action will experience its result because of the continuity in the stream, even if the stream changes. The replica on Mars, being a copy, does not inherit the karma of the original. |

  Now, the cruxes:

  We need to identify the key points of disagreement and present a concrete case or argument that both accept as relevant. Then each camp's prediction.

  We'll do a table:

  | Crux | Argument/Case | Camp A Prediction | Camp B Prediction |
  |------|---------------|-------------------|-------------------|
  | **Whether causal continuity requires an underlying bearer** | Case: Consider a river. The river is just water molecules in constant flux, but we say it's the same river because of the causal continuity of the flow. Is there an underlying bearer of the river's identity? | Camp A: The river is just a label for a series of water molecules. There is no underlying bearer; the continuity is a pattern we project. | Camp B: The river's identity is in the continuous flow (the causal process). While there's no underlying substance, the process itself is real and provides continuity without a bearer. |
  | **Whether moral responsibility requires literal sameness** | Case: A person commits a crime, then undergoes teletransport (original destroyed, replica on Mars). Should the replica be held responsible for the crime? | Camp A: Yes, because the replica has the same memories and psychological states, and in convention, we treat it as the same person. | Camp B: No, because the replica is a copy, not the same causal stream. The original stream ended when the original was destroyed. The replica is a new stream. |

  Finally, the one-line summary:

  Summary: The leftover gap is mostly ontological (about what exists) for Camp A, but mostly about pragmatic convention for Camp B? Actually, let's think:

  - Camp A thinks the gap is entirely conventional (no ontology of continuity).
  - Camp B thinks there is an ontological continuity (the causal stream) that grounds convention.

  But in the summary, we need to capture the overall disagreement. Maybe:

  Summary: The core disagreement centers on whether the causal continuity of experience requires an ontological basis (Camp B) or is fully reducible to conventional labeling (Camp A).

  But to make it one line:

  Summary: The leftover gap is ontological for Camp B (denying any underlying bearer but affirming causal continuity) and purely conventional for Camp A (denying any continuity beyond labeling).

  Alternatively: 

