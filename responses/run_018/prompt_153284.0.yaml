  On falsifiability... that's tricky. Their theory avoids Whorf's mistakes by focusing on recall, but could become unfalsifiable if "systematic alteration" is too vague. They'd need precise, testable predictions - like "Turkish speakers will attribute 15% more agency to inferred events than witnessed ones in recall tasks." Otherwise it risks being "just-so" storytelling.

  The insulation question is profound. For a psychological claim, unfalsifiability is fatal. But if they make concrete predictions about memory distortion patterns across languages, it's salvageable. Maybe suggest they collaborate with cognitive linguists on cross-linguistic experiments?

