  Similarly for usury: Question notes interest vs. money's purpose → Scholar defaults to telos → Follow-up contrasts retail trade (also telos-compliant but condemned). Trap her in Aristotle's own inconsistency.

  ...Modern case question is strategic. Forces theory into practice. If she approves surge pricing, it reveals subjectivism's amorality; if she disapproves, she must locate Aristotelian limits - which her theory might lack. Either way, illuminating.

