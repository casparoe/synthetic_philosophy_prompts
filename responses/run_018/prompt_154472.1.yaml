  Here is the prioritized research agenda, ranked by highest potential impact given tractability (metaphysical analysis feasible without new tools), dependency (upstream influence on other issues), and neglectedness (current under-exploration relative to importance):

  1.  **Clarify whether structural realization genuinely dissolves the subject-summation problem or merely relabels it as non-emergent derivation.** (Upstream, High Tractability, Highly Neglected) Resolving this is paramount: if successful, it dissolves the core subject-summing pressure, making panpsychism vastly more defensible; if it fails, effort can refocus on other combination models. Success forces physicalists to confront non-aggregative emergence as primitive.

  2.  **Develop a metaphysics of determinacy: how can purely structural/dynamic micro-phenomenal properties ground determinate macro-qualities?** (Upstream, High Tractability, Moderately Neglected) This addresses the neglected core of the determinacy problem. Solving it is essential for any combination account and pressures physicalism to explain qualitative determinacy without brute-fundamental qualia.

  3.  **Analyze if the determinacy problem presupposes the Hard Problem by demanding non-structural grounding for macro-qualities.** (Upstream, High Tractability, Neglected) If yes, it strengthens panpsychism by exposing physicalism's inability to address qualitative determinacy structurally; if no, it refines the determinacy challenge. Resolution sharpens the consciousness debate's central metaphysical battleground.

  4.  **Assess if structural realization implies downward causation or novel causal powers at the macro-level, violating causal closure.** (Downstream, High Tractability, Very Neglected) This downstream implication is critical for panpsychism's scientific compatibility. Clarification prevents internal inconsistency and defines its challenge to physicalist causal models.

  5.  **Evaluate whether "phenomenal structure" in micro-properties can be specified without presupposing the macro-qualities it's meant to ground.** (Upstream, Moderate Tractability, Neglected) This upstream methodological check is crucial to avoid circularity in solving determinacy. Success ensures solutions aren't question-begging, strengthening panpsychism's explanatory claim against physicalism.
