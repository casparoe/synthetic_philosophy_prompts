  Here's the tight argument, addressing parity/proportionality and probabilistic dampening:

  **Moral Weight Parity Defense:**  
  1. **Substrate Independence**: If simulated minds have qualia (subjective experience), their suffering/flourishing is ethically significant regardless of physical basis. Denying this implies consciousness requires biological substrate—an arbitrary boundary violating anti-speciesism.  
  2. **No Privileged Ontology**: Base reality lacks intrinsic moral superiority. Simulated beings experiencing identical phenomenological richness have equal claim to moral consideration—otherwise, we privilege "originality" over lived experience.  
  3. **Parity > Proportionality**: Proportionality (e.g., weighting by computational resources) collapses under regress: nested simulations would have diminishing moral weight, creating ethical black holes. Parity avoids capricious hierarchy. If consciousness is binary, weight is 1:1.  

  **Interaction with Probabilistic Dampening:**  
  Bostrom’s trilemma implies high P(sim) given advanced civilizations. Normally, this dampens longtermism: if we're sims, our actions likely don't affect base-reality’s far future. *But under parity:*  

  - **Impact Amplification**:  
    - **If we're sims**: Our actions shape *this* simulation’s future (potentially vast, with moral weight = base). Existential risks here annihilate real value.  
    - **If we're base**: Creating altruistic simulations multiplies morally weighted futures. Preventing human extinction enables future sim-generations.  
  - **Net Effect on Urgency**:  
    Let \( P(\text{base}) \) = probability we’re base-reality. Standard view reduces far-future value by \( P(\text{base}) \). Under parity:  
    \[
    \text{Expected Value} = \underbrace{P(\text{base}) \cdot V(\text{base future})}_{\text{traditional}} + \underbrace{(1 - P(\text{base})) \cdot V(\text{sim future}) + P(\text{base}) \cdot V(\text{sims we create})}_{\text{new terms}}
    \]  
    - \( V(\text{sim future}) \) is non-zero (parity) and likely *larger* than base (sims can be numerous/cheap).  
    - \( V(\text{sims we create}) \) adds massive potential upside if we survive.  
    Thus, high \( P(\text{sim}) \) *increases* expected value of far-future efforts by making sim-impact probable. Existential risk mitigation becomes *more* urgent—it safeguards both base and sim trajectories.  

  **Conclusion**: Parity transforms simulation risk from a dampener to an accelerator. High \( P(\text{sim}) \) no longer reduces our expected influence—it multiplies morally weighted futures we must protect.
