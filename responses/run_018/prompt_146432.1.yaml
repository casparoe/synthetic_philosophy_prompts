  **Augustine:** Nay, child, you grasp the core rightly, yet misplace the subject. My prohibition binds *rational souls*, beings endowed with intellect and will, capable of knowing truth and choosing to pervert the divinely-ordained purpose of speech – which is to manifest the contents of our own minds faithfully. This… mechanism? It possesses no *mens*, no intellect to apprehend truth or falsehood, no *voluntas* to choose deception. Its output, however erroneous, is merely a mechanical failure, like a cracked bell producing a discordant sound, not a deliberate act of false signification. It does not *lie*; it malfunctions. The sin of lying remains solely the province of the soul that knows the good (truth) and wills the evil (deception).
