answer: |-
  **(You approach the podium, tap the mic lightly, glance at the crumpled workshop invite with "subsidiarty" visible, and smile)**

  Alright, good morning. Welcome to “Who Decides the Scale?” – a question I suspect half of you could write dissertations on blindfolded, while the other half live with the bruises of the answer every single day. Lawyers, scholars, Article 5 TEU whisperers… welcome. Organizers, activists, cantonal and Länder veterans who’ve had one too many directives land with a thud and a “trust us, it’s better this way”… welcome. I see you eyeing each other. Perfect.

  Because we’re not actually here to fight about *who* decides. Not today. We’re here to dig into the *how* and the *why*. Specifically, the word we all know, often invoke, and frequently… well, misspell. (*Holds up invite, points*) ‘Subsidiarty’. Lovely. Let’s keep that energy – a little messy, a little human. Because that’s where subsidiarity *lives*.

  Here’s the big idea I want to plant in the next eight minutes: **Subsidiarity isn’t about geography. It’s not a rule that “closer is always better.” It’s not just about pushing power down the ladder because hills are pretty or local accents are charming.**

  **It’s about reverse delegation. It’s about legitimacy flowing *up*, not trickling down.**

  Think about it. The standard story is: Sovereign Power (capital S, capital P) sits at the top – maybe a nation-state, maybe Brussels. It magnanimously *delegates* tasks downwards. “Here, local level, you handle parks. We’ll handle war.” The center grants authority. The center remains the source.

  But what if we flipped it? What if the legitimacy of the *center* – its very right to exist and act on big things – actually *depends* on the active, generative work happening below? What if lower bodies aren't just passive recipients of delegated tasks, but are the **active generators of the conditions that make the center's claims legitimate**?

  This is where the rubber meets the road – and where the potholes get deep.

  Look at the EU. Article 5 TEU: Subsidiarity means the Union shall act *only* if the objectives cannot be sufficiently achieved by the Member States. Noble! But in practice? Too often, it feels like a procedural fig leaf. A way for the center to say, “We *could* act effectively, but hey, we’ll let *you* do the hard part… and if it fails? Well, *your* implementation must have been flawed.” It’s a blame-shifting device disguised as respect for localism. Where’s the *generation* of legitimacy from below in that? Where’s the Member State actively shaping the *Union's* competence?

  Now, look at Switzerland. Fiscal equalization. Rich cantons subsidize poor ones. Beautiful solidarity! But hang on… doesn’t that fundamentally break the pure “local autonomy” fantasy? If Zug is effectively generating resources that enable Uri to function autonomously, is Zug’s autonomy diminished? Or is this complex interdependence *itself* the act of generating a *Swiss* legitimacy that couldn't exist otherwise? The center (Bern) isn't delegating down; the cantons are weaving the fabric *upwards* that gives Bern its purpose.

  **(Here comes the awkward analogy...)**

  So, think of it like... plumbing. Stick with me! The classic view sees subsidiarity as valves: the center opens or closes the flow of power/water downwards. Simple control. But the *reverse delegation* view? That’s seeing the entire system’s water *pressure* – its very ability to function at *any* level – as being generated by the local pumps. The village well, the cantonal reservoir, the national treatment plant… they don’t just *receive* water from some mythical source lake at the capital. They *are* the source. They actively create the pressure that allows the whole network to flow. If one pump fails spectacularly, the pressure drops everywhere. If they coordinate poorly, you get leaks and bursts. The center’s valve only works *because* the local pumps are generating the pressure. *(Pause, look at the lawyers slightly confused, the organizers nodding knowingly)* Yeah, maybe plumbing wasn't my best subject... but you get the *pressure*, right?

  **This flips everything.**

  1.  **It means I *can't* stand here and promise you that decentralizing power automatically equals more democracy.** Sometimes, the local pump is broken or toxic. Legitimacy isn't guaranteed by proximity; it's generated by the *quality* of the agreement, the *effectiveness* of the action, and the *recognition* that this level *needs* to act for the whole to hold. A dysfunctional commune doesn't magically become democratic just because it's small.
  2.  **It means we *can't* treat the EU like a slightly oversized nation-state that just needs a good trimming.** That "Competence-Competence" debate – who decides who decides? – is crucial, lawyers. But the real gap, the "missing middle," isn't just about powers between Brussels and national capitals. It's about how *regions*, *cantons*, *Länder* – those active generators – are structurally involved in *setting the terms* of that competence debate *upwards*. How do they feed their generated legitimacy into defining what the center *should* even be competent *for*? The current mechanisms often feel like after-the-fact checks, not generative inputs.
  3.  **It forces us to ask: What are the *conditions* that enable lower levels to be these legitimacy generators?** It’s not magic. It requires resources, agency, real decision-making power *within their sphere*, and crucially, mechanisms for horizontal solidarity and upward feedback that aren't just begging at the central table. Swiss fiscal equalization, for all its complexity, *is* one such mechanism – a messy, negotiated generator of shared legitimacy.

  So, "Who Decides the Scale?" The answer isn't simple. It’s a constant negotiation, a dynamic flow. Not top-down delegation, but a multi-directional generation of legitimacy. The center isn't the sun; it’s more like… a junction box (okay, no more analogies!). Its power depends on the energy being fed *into* it from below and across.

  My hope is that today, we move beyond the tired binary of "Brussels/Berlin knows best" versus "Everything local is inherently good." Let’s dig into the plumbing – the pressure points, the generators, the leaks. Let’s figure out how to build systems where legitimacy isn't assumed, but actively, collaboratively, *generated*.

  Questions? Arguments? Plumbing horror stories? Let’s have at it.
