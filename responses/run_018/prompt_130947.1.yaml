  I'm delivering the opening remarks this Thursday at our neighborhood assembly about the old riverbank lot. Roughly half the audience are residents and activists split between those who want affordable housing built and those who want the land left as open green space. The other half are graduate students in urban ethics and two city mediators who have studied comparative epistemology, so they will notice if I misrepresent the philosophical ideas. I have no formal academic training — I'm just a longtime resident who read about Jain anekāntavāda, the doctrine of many-sided truth, and kept returning to it.

