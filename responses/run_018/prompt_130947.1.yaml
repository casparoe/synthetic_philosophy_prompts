  ## Opening Remarks: Riverbank Assembly

  **1. Setup (102 words)**  
  Thursday’s assembly gathers us at a crossroads. We meet by the old riverbank lot – a place holding memories, needs, and futures. Roughly half are neighbors like me, divided passionately: some see essential homes rising here, others irreplaceable green sanctuary. The other half are urban ethics students and city mediators deeply versed in how we know and argue about such things. My role isn’t to decide or persuade, but to open a space for genuine encounter. I’m no scholar, but a longtime resident who found resonance in an ancient idea: *anekāntavāda*, the Jain teaching of many-sidedness. That’s the spirit I ask us to embody tonight.

  **2. Pre-Writing Notes: Structural Uses of Anekāntavāda (148 words)**

  1.  **Qualifying Claims by Standpoint (Naya):** Every assertion about the lot (e.g., "This land *must* be housing," "This land *is* vital green space") will be explicitly framed as emerging from a specific, limited perspective (*naya*) – the needs of families without homes, the ecological value of urban green space, historical connection, etc. The language will use implicit qualifiers like "from this vital perspective..." or "considering this crucial need..." without declaring any single *naya* as the whole truth.
  2.  **Withholding Final Judgment:** The speech will deliberately *refuse* to declare one side "right" or propose a concrete solution or compromise. It will emphasize that reality (the complete truth of the lot's value and potential) outstrips any single judgment we can make now ("is it housing? is it park?"). Resolution is suspended, honoring the complexity.
  3.  **Invoking the Inexpressible (Avaktavya):** The central framing will be that the *future reality* of this lot, in its fullness, might be something our current categories ("development" vs. "preservation") cannot adequately capture. Our task isn't just choosing between known options, but perhaps discovering a possibility that transcends this binary – a future currently "inexpressible" within our debate.

  **3. The Speech (648 words)**

  Good evening, neighbors, students, mediators. Thank you for coming down to the riverbank on a weeknight. Look around. Feel the air, hear the water. This place… it matters. It matters deeply, but differently, to each of us gathered here. That difference is why we’re here tonight, and it’s also, I believe, the key to moving forward with care.

  For years, I’ve listened. Listened to the fierce conviction on both sides of this question about our old lot. To those who speak of families struggling, crammed into places too small, too expensive – who see this ground as a chance to build shelter, community, *home*. That need is real. It’s urgent. From *that* standpoint, the call for housing here isn’t just logical; it’s a moral imperative. I hear you.

  And I’ve listened just as closely to those who speak of roots – roots of trees, roots of memory. Who talk about the breath this green space gives our neighborhood, the refuge for birds and bugs and kids kicking a ball. Who worry about concrete swallowing the last wild edge we have left by the water. From *that* standpoint, preserving this land isn’t just desirable; it feels like protecting the soul of the place. I hear you too.

  Here’s what struck me, wrestling with these two powerful, seemingly opposite truths: what if neither one, by itself, is the *whole* story of this piece of earth? What if the deepest reality of what this land *is*, and what it *could be*, is more than any single "yes, build" or "no, preserve" can hold?

  There’s an old idea I kept circling back to, called *anekāntavāda*. Roughly, it means "many-sided reality." It suggests that truth isn’t a single, simple thing we grab hold of. Instead, we see it in parts, from different angles, like people describing an elephant by touching only its leg, or its trunk, or its tail. Each person feels something real, something true about the *elephant* – but it’s not the *whole* elephant. Their truth is real *from their standpoint*, from their *naya*.

  That’s what I see happening here. The truth spoken by those needing homes – it’s real, vital, from *their* necessary standpoint. The truth spoken by those guarding the green – it’s equally real, vital, from *their* necessary standpoint. *Anekāntavāda* asks us to hold both these truths, not to cancel one with the other, but to see that the land itself holds more than either perspective alone can capture. It asks us to pause before declaring one side simply "right."

  And it pushes us further. The Jains who developed this idea talked about a seventh possibility beyond just "yes," "no," or "maybe." They called it *avaktavya* – the "inexpressible." It’s the recognition that some realities are so complex, so new, that our current words and categories just… fail. They can’t quite contain it.

  **Is it possible that the truest future for *this* riverbank lot is precisely that – inexpressible right now?** Not just a compromise splitting the difference between housing and park, but something else entirely? Something we haven’t fully imagined yet, something that honors the urgency of shelter *and* the irreplaceable value of this green river edge in a way our current "either/or" language can’t quite frame? A reality that outruns our present debate?

  That’s the space I want us to inhabit tonight. Not the space of picking winners, or forcing a quick vote, or even finding a neat middle ground *yet*. But the space of genuine listening – listening *through* the different standpoints, honoring the partial but vital truth in each. Listening for what the land itself, and the needs of our whole community, might be whispering beneath the loud either/or. Listening, perhaps, for the shape of that "inexpressible" possibility that respects the full complexity here.

  It takes courage to pause in uncertainty. It takes respect to hold competing truths without dismissing them. But if we can do that – if we can let the many-sidedness of this place and our needs be present, without rushing to collapse it into one answer tonight – then I believe we open the door to something wiser, something more truly fitting for this ground we all care about. Thank you for listening, and for bringing your standpoint, your *naya*, into this shared space. Let's begin.

  **4. Commentary on Structural Choices (199 words)**

  *   **Philosophy Shaping Rhetoric:** Anekāntavāda structurally dictated the speech's core moves:
      *   **Explicit Naya-Framing:** Each position ("housing imperative," "green sanctuary") was introduced with phrases like "From *that* standpoint..." and "From *that* standpoint...", embodying the contextual validity of partial perspectives without endorsing any as absolute. This avoids declarative "This is true" statements.
      *   **Withholding Synthesis/Resolution:** Crucially, the speech never attempts to reconcile the positions or suggest a compromise. It explicitly *refuses* ("Not just a compromise..."), honoring anekāntavāda's insistence that reality exceeds current judgments. The close focuses on "listening" and "uncertainty," not decision-making.
      *   **Centering Avaktavya:** The "inexpressible" isn't an afterthought; it's the central proposition framing the lot's future. The binary is presented as potentially inadequate *before* solutions are discussed, shifting the goal from choosing a side to seeking a new conceptual space.
  *   **Serving the Mixed Audience:** Residents hear their core concerns validated contextually ("I hear you"). Activists feel their urgency acknowledged without being dismissed. Students/mediators see sophisticated epistemology applied concretely: standpoint relativity (*naya*), suspension of judgment (syād), and the limits of language (*avaktavya*) are operationalized, not just named.
  *   **Avoiding Misinterpretation:** Relativism ("everyone's equally right") is actively countered. Standpoints are "partial but vital truths," contextual ("from *that* standpoint"), never declared universally valid or equal in weight. The emphasis is on the *inadequacy* of any single perspective and the *excess* of reality, not the equivalence of all claims. The "inexpressible" underscores a reality *beyond* current claims, not their equality.
