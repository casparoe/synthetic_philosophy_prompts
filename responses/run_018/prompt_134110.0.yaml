prompt: |-
  Theres this pattern in public arguments — and in my grad seminar — where calling someone hypocritical immediately triggers a check on whether you yourself do the same thing. If you share the vice, people say you have no standing to blame; if your record is clean, your blame counts even when youre not the wronged party. Meanwhile in other contexts people treat hypocrisy as just an ad hominem that doesnt cancel the substance of the charge. So whats the implicit philosophy here? Is standing being treated like a moral cleanliness score that gets forfiet by shared guilt? Or is it tied to being specially affected, with hypocrisy just muddying the waters? Reconstruct the theory the practice actually needs, say whether its coherent across both contexts, and tell me what would have to shift if we replaced it with a view where standing depends solely on being wronged or on institutional role, not on personal purity. Keep it under 250 words, ideally one tight paragraph.
reasoning: |-
  Okay, the user presents a complex philosophical question about hypocrisy and moral standing in arguments. They've observed two conflicting patterns: one where personal conduct determines standing to criticize, and another where hypocrisy is dismissed as irrelevant ad hominem. Their query digs into the implicit theory behind these practices and asks for reconstruction.

  Hmm, this requires unpacking several layers. First, the "clean hands" approach seems to operate on a quasi-legal principle where shared guilt invalidates one's right to judge - like disqualifying a witness for complicity. But the ad hominem dismissal suggests a different logic where personal flaws don't negate factual claims. 

  The tension reveals an unspoken moral economy where credibility functions as social currency. When people demand clean hands, they're really testing if the accuser has "skin in the game" - but this confuses moral authority with factual validity. For institutional roles, this creates problems: imagine if judges could only sentence crimes they'd never committed. 

  The core incoherence lies in mixing deontological ethics (blame as duty) with virtue ethics (blame as character reflection). To reconstruct coherently, we'd need to decouple the act of criticism from the critic's virtue, treating hypocrisy as separate from truth-value. 

  Shifting to a wronged-party/institutional model would require cultural changes: accepting that flawed messengers can deliver true messages, and that neutral arbiters (like judges) needn't be morally pristine. But this risks undervaluing integrity. Perhaps the solution is qualifying criticism: "I'm flawed too, but this standard remains valid because..." - maintaining truth-telling while acknowledging shared imperfection.
answer: |-
  The implicit philosophy treats standing as **moral credibility contingent on personal consistency**, blending virtue ethics with social contract logic. When you accuse others, your own conduct becomes relevant: shared vice suggests insincere performative blame ("why listen to a liar about lying?"), while clean hands signal authentic commitment to the norm, granting moral authority. In contexts dismissing hypocrisy as mere ad hominem, the focus shifts to **deontological truth**: the accusation's validity stands independently of the accuser's flaws. 

  This duality is **incoherent** because it conflates *moral authority* with *factual correctness*. A consistent theory should separate them: standing to blame should derive **either** from being wronged (victim standing) **or** institutional role (judge, regulator), not personal purity. Hypocrisy would then be a separate character flaw—damaging persuasion but irrelevant to the accusation's truth or procedural legitimacy. 

  Shifting to victim-/role-based standing requires:  
  1. **Decoupling criticism from virtue**: Accept that flawed people can identify real wrongs.  
  2. **Emphasizing institutional arbitration**: Neutral third parties (courts, ombuds) could blame without personal purity checks.  
  3. **Reframing hypocrisy**: Treat it as bad faith, not invalidation—e.g., "I fail this standard too, but it remains right."  

  This ends the "clean hands" gatekeeping but risks undervaluing integrity. Coherence demands we judge claims on evidence, not the claimant’s scorecard.

