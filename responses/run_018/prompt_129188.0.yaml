  ### Regional Resilience Funding: A Classroom Activity on Decision-Making Under Uncertainty  
  **Duration:** 60 minutes  
  **Participants:** 12 upper-level students (decision theory/philosophy of economics)  
  **Objective:** Experience the psychological pull of violating the independence axiom (Allais paradox) through a framed game, without naming it until debrief.  

  ---

  ### **Materials**  
  - Anonymous choice-recording cards (12 sets, pre-printed with options for Rounds 1 and 2).  
  - Two sealed envelopes labeled "Systemic Shock Draw" (one for each round).  
  - Whiteboard/projector to display rules and record aggregate choices.  
  - Random number generator (e.g., 100-sided die or digital tool) for shock reveal.  
  - Token prize (e.g., extra credit points, candy) tied to points earned.  

  ---

  ### **Game Setup (5 mins)**  
  **Facilitator Script:**  
  *"You are policymakers allocating resilience funding to regions. Points translate to real rewards. Decisions are private, anonymous, and final. No discussion between rounds. We’ll reveal systemic shocks after choices are locked."*  

  ---

  ### **Round 1: Baseline Funding (15 mins)**  
  **Options:**  
  - **Option S (Stable):** 50 points guaranteed.  
  - **Option G (Growth):**  
    - 200 points with probability 0.89,  
    - 50 points with probability 0.10,  
    - 0 points with probability 0.01.  

  **Procedure:**  
  1. Students privately circle S or G on cards.  
  2. Cards collected, choices tallied (but not revealed).  

  **Expected Behavior:**  
  Most choose **S** due to certainty effect (fear of 1% ruin).  

  ---

  ### **Round 2: Integrated Funding + Systemic Shock (15 mins)**  
  **Facilitator Script:**  
  *"We’re adding a shared systemic shock layer. The same hidden event affects both options. The shock—drawn after you commit—determines if funding activates."*  

  **Options (both conditional on a single hidden state draw):**  
  - **Option R (Resilient):** 50 points with probability 0.11, otherwise 0.  
  - **Option T (Thriving):** 200 points with probability 0.10, otherwise 0.  

  **Note:**  
  - Probabilities reflect *identical* state spaces. For example:  
    - States 1–89: Both options yield 0 (*shock hits*).  
    - States 90–99: R yields 50, T yields 0.  
    - State 100: R yields 0, T yields 200.  
  *(Do not reveal this mapping until debrief!)*  

  **Procedure:**  
  1. Students privately circle R or T on new cards.  
  2. Cards collected.  

  **Expected Behavior:**  
  Many who chose **S** in Round 1 switch to **T** (seeking upside when "safe" is gone).  

  ---

  ### **Shock Reveal & Payoff Ceremony (10 mins)**  
  1. **Draw shocks ceremonially:**  
     - Round 1: Draw a random number (1–100) to determine outcomes for G-choosers.  
     - Round 2: Draw *one* number (1–100) to resolve both R and T simultaneously.  
  2. **Assign points:**  
     - Base points: Awarded based on choices and shock outcomes.  
     - **Bonus points:**  
       - **+10 pts** for consistency: (S then R) or (G then T).  
       - **+30 pts** for (S then T)—the Allais shift.  
       - **+0 pts** for (G then R).  
  3. Report aggregate choices (e.g., *"Round 1: 10 S, 2 G; Round 2: 3 R, 9 T"*) and highlight S→T pattern.  

  ---

  ### **Debrief (15 mins)**  
  **Goal:** Connect choices to the paradox without technical jargon first.  

  #### Step 1: Elicit Participant Reasoning  
  - *"Why did S-choosers avoid G in Round 1?"*  
    - Expected: *"Couldn’t risk 1% ruin when 50 was guaranteed."*  
  - *"Why did many S-choosers pick T in Round 2?"*  
    - Expected: *"No safe choice—so why not chase 200 points?"* or *"Shock made 50 less relevant."*  
  - **Predictable Pitfall:** Students invent domain-specific justifications (e.g., *"Round 2 shocks change risk appetite"*).  

  #### Step 2: Map to Allais Structure  
  **Reveal the paradox:**  
  *"This mirrors the Allais paradox, violating expected utility’s independence axiom. Let’s see why."*  

  1. Visualize Round 1:  
     - S = **50 for sure**.  
     - G = **89%:200, 10%:50, 1%:0**.  
  2. Visualize Round 2:  
     - R = **11%:50, 89%:0**.  
     - T = **10%:200, 90%:0**.  
  3. **Key Insight:**  
     - Round 2 is *Round 1 with the "89%:200" outcome replaced by 0* (common consequence removal).  
     - Independence axiom demands: If S > G, then R > T. But S→T flips this!  

  #### Step 3: Discuss Framing vs. Normative Rationality  
  - **What the game captures well:**  
    - *Framing matters:* Identical probabilities (200:50 odds) evaluated differently when certainty is removed.  
    - Shared systemic shock = vivid common-consequence removal.  
  - **What it can’t capture:**  
    - *Normative defense of independence:* Savage’s axioms (consistency across states) must be explained:  
      - *"Would you defend reversing choices if the same states govern both rounds? Why/why not?"*  

  ---

  ### **Facilitator Notes**  
  - **Why bonus points?** 30 pts for S→T makes the reversal *tangible*, simulating real-world incentives that exploit framing effects.  
  - **Handling justifications:** Ask students to *"articulate a universal decision rule"* before debrief. Exposes if they’d accept the same logic in both rounds.  
  - **Timing rigor:** Keep rounds tight. Use countdowns.  
  - **Post-activity:** Assign a reflection—*"Does violating independence feel rational? Defend your view axiomatically."*  

  ---

  ### **Expected Outcomes**  
  - 80–90% choose S in Round 1; 50–70% of S-choosers pick T in Round 2.  
  - S→T choosers feel conflicted when axioms are revealed—creates "aha!" moment for normative debates.  
  - Game succeeds if students *feel* the paradox before understanding it.
