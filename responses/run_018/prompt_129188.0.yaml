     - "For those who chose T in Round 2, what was your reasoning?" (Likely: the chance of 200 is worth the risk since both options are risky anyway, and 50 is not that much more than 0.)

  4. **Reveal the Allais paradox:** 
     - "What we just experienced is a classic example known as the Allais paradox. It demonstrates a violation of the independence axiom in expected utility theory."
     - Explain the independence axiom: if you prefer lottery A over lottery B, then you should prefer a mixture of A with any common lottery over the same mixture of B with that common lottery.

  5. **Map the rounds:**
     - Show that Round 1 Option S and Round 2 Option R are related by the removal of a common consequence (the 89% chance of 200 in G and the 89% chance of 50 in S? Actually, it's not exactly removal, but we can show the numerical relation).

     We can write:

          S: 50 for sure.
          G: 200 with 0.89, 50 with 0.10, 0 with 0.01.

          R: 50 with 0.11, 0 with 0.89.
          T: 200 with 0.10, 0 with 0.90.

     And note that if you take S and remove the 89% chance of 50, you are left with 50 with 0.11 and 0 with 0.89 -> R.
     But if you take G and remove the 89% chance of 200, you are left with 50 with 0.10 and 0 with 0.01? But that lottery has total probability 0.11? To express it in the whole probability space, we would have to say: 50 with 0.10 and 0 with 0.01 and then also 0 in the 89% that we removed? So it's 50 with 0.10, 0 with 0.90? But that is not T. T is 200 with 0.10 and 0 with 0.90.

     This seems not to match. Let me try differently:

          Let lottery X = 50 with probability 1.
          Let lottery Y = 50 with probability 10/11, 0 with probability 1/11.
          Let lottery Z = 200 with probability 10/11, 0 with probability 1/11.

          Then:
            S = 0.89 * (50) + 0.11 * X   [but X is 50, so it's 50 everywhere]
            G = 0.89 * (200) + 0.11 * Y

            R = 0.89 * (0) + 0.11 * X = 0.11 * X
            T = 0.89 * (0) + 0.11 * Z

          So if we let the common lottery be a lottery that gives 200 with probability 1 (with weight 0.89) and 0 with probability 1 (with weight 0.89) in the common part? It's not the same common lottery for both.

     Given the time, we will simply state: 

          In the Allais paradox, the first choice is between:
            A: 50 for sure.
            B: 200 with 89%, 50 with 10%, 0 with 1%.

          The second choice is between:
            C: 50 with 11%, 0 with 89%.
            D: 200 with 10%, 0 with 90%.

          And many people choose A and D, which violates independence.

     And our activity is exactly that.

  6. **Discuss what the game reproduces well:**
     - The activity reproduces the framing-sensitive evaluation of shared outcomes: the certainty effect in Round 1 (where the sure thing is attractive) and the shift to risk-seeking in the domain of losses (or when everything is probabilistic) in Round 2.

  7. **What it cannot reproduce:**
     - The activity does not provide a normative defense of the independence axiom (which comes from Savage-style axioms). This must be discussed by the facilitator.

  8. **Predictions and handling justifications:**
     - Predict that students will invent domain-specific reasons for switching (e.g., "In Round 1, I couldn't risk getting 0 because the region needed some funding, but in Round 2, we were already facing a systemic shock so we went for the higher upside."). 
     - Advise: Ask students to articulate the principle behind each choice without the context. For example, "If we strip away the regional funding context and just think in terms of points and probabilities, what rule were you using in Round 1? And in Round 2?" 
     - Then point out that the probabilities in the two rounds are related in a way that should lead to consistent choices if the independence axiom holds.

  **Timing:**
  - Round 1: 5 min explanation + 5 min decision = 10 min
  - Round 2: 5 min explanation + 5 min decision = 10 min
  - Shock Reveal: 5 min
  - Aggregate and Bonus: 5 min
  - Debrief: 25 min

  Total: 55 minutes (with 5 minutes buffer)

  **Bonus Scheme Clarification:**
  - We will award:
     - 10 bonus points for: (S in R1 and R in R2) OR (G in R1 and T in R2)
     - 30 bonus points for: (S in R1 and T in R2)
     - 0 for: (G in R1 and R in R2)

  This is to highlight the common reversal.

  **Note on Payoffs:**
  - We must ensure that the bonus points are significant enough to be noticed. Since the maximum payoff in one round is 200, having 30 bonus points is substantial.

  **Facilitator Notes:**
  - During the activity, do not mention the independence axiom or Allais.
  - During the debrief, start by asking for reasons, then reveal the aggregate and bonus, then ask about the reversal pattern, then reveal the paradox.
  - Be prepared for students to be confused about the common-state in Round 2. Reiterate that the same shock (state) affects both options in Round 2.

  **Final Structure:**

  1. **Round 1 (10 minutes):** 
     - Explain the options for Round 1.
     - Students choose S or G anonymously.

  2. **Round 2 (10 minutes):**
     - Explain Round 2 and the systemic shock.
     - Students choose R or T anonymously.

  3. **Shock Reveal (5 minutes):**
     - Draw a state for Round 1 and announce outcomes for those who chose G.
     - Draw a state for Round 2 and announce outcomes for R and T (students get their chosen option's outcome).

  4. **Bonus and Aggregate (5 minutes):**
     - Tally the choices and cross-tabulate.
     - Award bonus points based on the pattern.

  5. **Debrief (25 minutes):** as outlined above.
