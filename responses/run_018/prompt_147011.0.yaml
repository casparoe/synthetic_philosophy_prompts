  ### Workshop Design: Chaos, Predictability, and Determinism  
  **Duration:** 90 minutes  
  **Participants:** 16 advanced philosophy students (graduate/upper-level undergraduate)  
  **Objective:** Demonstrate that exact deterministic laws + approximately correct initial conditions are structurally insufficient for medium-term prediction.  
  **Key Insight:** Epistemic limits (measurement resolution) cause unavoidable divergence in deterministic chaotic systems.  
  **Structure:** 4 teams of 4. Two rounds with token stakes, followed by a debrief.  

  ---

  ### **Materials**  
  - **Teams:** Worksheets, pencils, calculators (optional but discouraged), tokens (e.g., poker chips).  
  - **Facilitator:** Sealed envelope with hidden initial value \(x_0 = 0.40017\), high-precision calculator, display for initial values/results.  
  - **Rule for All Rounds:**  
    \[
    x_{n+1} = 4x_n(1 - x_n)
    \]
    - **Rounding protocol:** All intermediate values rounded to **2 decimal places** (e.g., \(0.1234 \to 0.12\)).  

  ---

  ### **Round 1: The Laplacean Bet** (25 min)  
  **Premise:** Bet on predictability despite knowing the exact law and an approximate initial condition.  

  1. **Setup (5 min):**  
     - All teams receive:  
       - Initial condition: \(x_0 = 0.40\) (displayed).  
       - Worksheet to compute \(x_1\) to \(x_8\).  
     - **Bet:** Each team wagers 3 tokens on whether their \(x_6\) will match the "World Engine" (hidden true trajectory).  

  2. **Computation (10 min):**  
     - Teams compute iteratively:  
       - \(x_{n+1} = 4x_n(1 - x_n)\), rounding each result to 2 decimals.  
       - *Example:*  
         - \(x_1 = 4 \times 0.40 \times (1 - 0.40) = 0.96\)  
         - \(x_2 = 4 \times 0.96 \times (1 - 0.96) = 0.15\)  

  3. **Reveal & Payout (10 min):**  
     - Facilitator reveals the "true" trajectory (computed from \(x_0 = 0.40017\) with **no rounding**).  
       - *Sample true values (5 decimals):*  
         | Iteration | True \(x_n\) |  
         |-----------|--------------|  
         | 0         | 0.40017      |  
         | 1         | 0.96014      |  
         | 2         | 0.15317      |  
         | 3         | 0.51901      |  
         | 4         | 0.99842      |  
         | 5         | 0.00638      |  
         | 6         | 0.02540      |  
         | 7         | 0.09900      |  
         | 8         | 0.35677      |  
     - **Payout criteria** (at \(x_6\)):  
       - Full (3 tokens): \(| \text{team } x_6 - \text{true } x_6 | \leq 0.05\)  
       - Partial (1 token): \(0.05 < | \text{difference} | \leq 0.20\)  
       - None: Otherwise.  
     - **Expected Outcome:**  
       - Teams start close (e.g., \(x_1 = 0.96\) vs. true \(0.96014\)).  
       - Divergence visible by \(x_5\) (team avg. \(x_5 \approx 0.07\) vs. true \(0.00638\)).  
       - By \(x_8\), teams scatter (e.g., common team values: \(0.18, 0.40, 0.82, 0.50\)).  

  ---

  ### **Round 2: The Shadowing Round** (20 min)  
  **Premise:** Test if identical laws + care + "same" initial conditions (via low-resolution display) yield convergent predictions.  

  1. **Setup (5 min):**  
     - Each team gets a **different initial condition** (displayed as \(0.40\)):  
       - Team 1: \(x_0 = 0.40000\)  
       - Team 2: \(x_0 = 0.40010\)  
       - Team 3: \(x_0 = 0.39990\)  
       - Team 4: \(x_0 = 0.40100\)  
     - **Task:** Compute \(x_1\) to \(x_8\) with the same rounding protocol.  

  2. **Computation (10 min):**  
     - Teams calculate independently.  
       - *All start at displayed \(x_0 = 0.40\), but true values differ slightly.*  

  3. **Reveal (5 min):**  
     - Facilitator displays:  
       - All teams’ trajectories.  
       - The true trajectory from Round 1 (\(x_0 = 0.40017\)).  
     - **Expected Outcome:**  
       - Inter-team divergence by \(x_4\) (e.g., values span \([0.00, 1.00]\)).  
       - No team shadows the true trajectory beyond \(x_3\).  
       - *Sample team \(x_8\) values:* \(0.18, 0.43, 0.82, 0.29\) (scattered across \([0,1]\)).  

  ---

  ### **Debrief** (35 min)  
  **Goal:** Conceptualize the structural failure of predictability.  

  1. **Map the Activity (10 min):**  
     - **Round 1 (Laplacean Bet):**  
       - Represents the intuition that determinism implies predictability.  
       - **Failure reason:** Unavoidable measurement resolution (rounding) amplifies small initial errors.  
     - **Round 2 (Shadowing):**  
       - Shows that identical laws + care + "same" initial conditions (per measurement) still diverge.  
       - **Key insight:** Determinism governs each trajectory exactly, but no *approximate knowledge* can track the true path.  

  2. **Introduce Frameworks (15 min):**  
     - **Epistemic Lyapunov Horizon:**  
       - The iteration (or time) beyond which any approximation becomes predictively useless.  
       - Teams mark their worksheets: "Where did your shadow break?" (Typically \(n=3-5\)).  
     - **Structural vs. Careless Failure:**  
       - Emphasize: Divergence persists even with **perfect law-knowledge** and **no calculation errors**.  
       - Blaming "human error" misses the point—chaos is a property of the system.  

  3. **Address Predictable Issues (10 min):**  
     - **"We could fix it with better rounding/more decimals!"**  
       - *Response:* Allow 1 min for teams to try (e.g., use 3 decimals). Show that divergence still occurs.  
       - Reinforce: The problem is **resolution limits in principle**, not specific rounding protocols.  
     - **"But what about continuous systems/free will/quantum physics?"**  
       - *Response:* This activity **only** separates determinism from predictability. Chaos occurs in continuous systems (e.g., weather), with Lyapunov horizons as **temporal parameters**. Other topics are out of scope.  

  ---

  ### **Facilitation Notes**  
  - **Precomputation:** Calculate true trajectories in advance (high-precision).  
  - **Divergence Visualization:**  
    - Display all teams’ worksheets side-by-side in Round 1 to show identical calculations diverge from the true path.  
    - In Round 2, plot trajectories on a shared graph to visualize inter-team scatter.  
  - **Honest Limitations:**  
    - Discrete steps only (no continuous flows).  
    - Simplified chaos (no Lyapunov exponents/measure theory).  
  - **No Extras:** Avoid computers/citations; focus on embodied intuition.  

  **Outcome:** Participants experience how deterministic chaos imposes hard epistemic limits, shattering Laplacean optimism through manual computation.
