prompt: |-
  Hey — long one, sorry in advance. I'm in a methods reading group (psych adjacent, mostly grad students plus one statistician who keeps audibly sighing) and I've been asked to write up my own position on the replication mess so the others can poke at it before the next session. I'd rather find the holes myself first, so here's roughly where I've landed:

  (1) The crisis is mainly a selective-reporting problem — p-hacking, publication bias, the file drawer, the garden of forking paths — not a problem with the internal logic of frequentist inference. A p-value does what it says on the tin; people just fed it garbage. (2) Because of that, I'm happy to let big multi-site preregistered replications and meta-analyses adjudicate: if a claim has been through that filter I'll believe it, and if it hasn't I'm at maybe 50/50 at best. (3) I'm not a Bayesian in practice. Priors feel like a license to smuggle in what you already hoped was true, and I don't want my conclusions to depend on my guess; long-run error control is the thing a method can actually promise. (4) That said, I like the proposal floating around to drop the default threshold by an order of magnitude (0.05 to 0.005), and I like preregistration as the main institutional fix. (5) I think the field should de-emphasize dichotomous significant/not-significant verdicts in favour of reporting effect sizes and interval estimates. (6) I also think exploratory analysis is where the interesting findings actually come from, and I don't want a culture where nobody is allowed to look at their own data until they've committed to an analysis plan.

  And here's the bit I've been pushing in the group that nobody has quite shot down yet — I call it search-adjusted thresholds. The idea: how suspicious you should be of a nominally significant result ought to scale with how searchy the literature it comes from is, not just with the design of the single study. A p = 0.04 from a clean pre-registered test of a prediction nobody had thought to look for is one thing; the same number from a subfield where everyone runs twenty outcomes and four exclusion criteria and reports whichever one cleared the bar is quite another, even if the paper in front of you is itself preregistered, because the whole literature's habits are what generated the hypothesis you're now testing. So the evidential bar should rise with the forking density of the surrounding research area. My statistician friend says this is just a prior wearing a trenchcoat, and that once you start estimating forking density you're doing exactly the thing in (3) that I say I don't want to do. I think it's a correction for a measurable feature of a procedure and it can in principle be read off the design, not off my hopes. Who's closer to right?

  What I want is an audit of the whole package, not a lecture on any single item: which of these actually collide with each other, which only look like they do and dissolve once you cash them out, and for each real collision what the cheapest fix would be and what it would cost me. Rank the tensions by how bad they are rather than flagging all of them as equally fatal, and tell me if there's a single revision that would clean up several at once. Also, please seperate what's settled from what's genuinely contested among people who work on this — flag plainly when something you're telling me is one side of a live argument instead of smoothing it into the consensus view — and where you're reading a commitment into me that I didn't actually state, say what you're assuming so I can disown it if it isn't mine.
reasoning: |-
  Okay, let me unravel this user's query. They're in a methods reading group, psych-adjacent, mostly grad students with a statistician who sighs a lot. They need to present their position on the replication crisis and want to preempt criticisms. Their stance has several points, and they're particularly concerned about their "search-adjusted thresholds" idea being called a Bayesian prior in disguise.

  First, I need to break down their position into key claims: selective reporting as the root cause, reliance on multi-site replications and meta-analyses, rejection of Bayesianism, support for lower p-value thresholds and preregistration, emphasis on effect sizes over dichotomous results, valuing exploratory analysis, and the search-adjusted thresholds concept. The main tension they're facing is between their anti-Bayesian stance and their proposed adjustment, which the statistician says is just a prior.

  Looking deeper, the user's identity is a grad student in a methods group, likely early in their research career. They're trying to establish a coherent methodological stance but are aware of potential contradictions. Their actual needs include identifying internal conflicts in their position, understanding which parts are settled vs. contested, and finding fixes for tensions. They also want to know if their search-adjusted thresholds can be framed without Bayesian priors.

  Unspoken needs might include a desire for validation of their overall framework while being open to tweaks. They might feel defensive about the statistician's criticism and want to solidify their argument. They also need clarity on where their position stands in the broader methodological debate to confidently present it to the group.

  I should assess each point for conflicts. For example, point 3 (anti-Bayesian) clashes with point 7 (search-adjusted thresholds) because the latter involves prior-like adjustments. Points 5 (de-emphasize dichotomous results) and 6 (value exploratory analysis) might conflict with strict preregistration. Also, their reliance on large replications (point 2) could be at odds with valuing exploratory work (point 6), as exploratory findings are harder to validate through replication.

  The statistician's critique that search-adjusted thresholds are Bayesian priors has merit. Adjusting thresholds based on "forking density" requires estimating how much flexibility exists in a literature, which involves prior beliefs about research practices. Even if based on empirical audits, choosing which practices to measure and how to quantify them introduces subjectivity, akin to setting a prior. This directly challenges the user's rejection of Bayesianism.

  To resolve this, the user could reframe search-adjusted thresholds as a frequentist correction using empirical data from preregistration reports or methodological surveys. However, this still involves modeling assumptions. Alternatively, they might accept a mild Bayesian influence without fully embracing priors, but that risks undermining their stance against Bayesian methods.

  Other tensions include balancing preregistration with exploratory analysis. Strict preregistration could stifle discovery, but the user wants both. They might advocate for clear labeling of exploratory vs. confirmatory analyses and using different thresholds for each. Also, lowering p-value thresholds (point 4) might reduce false positives but increase false negatives, especially for smaller studies, which conflicts with valuing exploratory findings that often come from smaller, flexible designs.

  The user needs to prioritize which tensions to address. The Bayesian conflict is the most critical. Solutions include refining their threshold proposal with explicit frequentist methods or conceding a minimal Bayesian element. For exploratory analysis, distinguishing it from confirmatory work in reporting could help. Emphasizing effect sizes and intervals aligns with de-emphasizing dichotomous results and supports better interpretation of replication outcomes.

  In summary, the user's position is mostly coherent except for the search-adjusted thresholds conflicting with their anti-Bayesian stance. Addressing that tension is key, possibly by redefining the thresholds as procedural corrections. Other conflicts can be managed by clarifying when and how exploratory analyses are presented and ensuring that replication efforts focus on effect sizes. This approach maintains their core principles while adjusting for the main criticism.
answer: |-
  Here's an audit of your position, structured to address your requests: evaluating internal tensions, ranking conflicts, offering fixes, flagging contested points, and clarifying assumptions. Your core position is coherent and defensible, but tensions exist – primarily around your "search-adjusted thresholds" and its relationship to Bayesianism vs. frequentism.

  **Core Tensions Ranked (Most Severe First):**

  1.  **Your Anti-Bayesian Stance (Point 3) vs. Search-Adjusted Thresholds (Point 7):**
      *   **Conflict:** Your statistician friend is largely correct. "Search-adjusted thresholds" *fundamentally* function like an empirically informed prior probability that the hypothesis is false (or that the effect size is negligible) *before* seeing the specific study's data. Estimating "forking density" isn't just reading off a design; it requires modeling assumptions about how researchers behave across a literature, choosing *which* flexibility dimensions matter, weighting them, and aggregating evidence (e.g., from preregistration track records, methodological surveys, failed replication rates). This injects subjectivity and external information *exactly* like a prior. Claiming it's purely a "measurable feature of a procedure" ignores the modeling choices and uncertainty inherent in quantifying "forking density" across diverse contexts.
      *   **Cheapest Fix:** **Reframe as a Frequentist Correction for *Known* Procedural Biases.** Instead of adjusting the *threshold* based on a nebulous "literature habit," focus on adjustments directly tied to *quantifiable actions within the specific study lineage*. Examples:
          *   **Bonferroni/Šidák Corrections:** For *explicitly* tested multiple comparisons/hypotheses *within* the study or a declared family of studies.
          *   **Alpha Spending Functions:** For pre-specified sequential analyses.
          *   **Procedural Penalties:** Pre-registering a rule like "If we use outcome X from a previous study that tested 20 outcomes, we use alpha=0.005 instead of 0.05." This draws the line at *documented, specific* flexibility.
      *   **Cost:** You lose the broader "literature context" adjustment you wanted. It becomes more mechanical and confined to documented procedures within a study or its direct predecessors. It doesn't easily capture implicit "garden of forking paths" habits across a field.
      *   **Alternative Fix (Costly):** **Acknowledge it's a Weakly Bayesian Move.** Accept that incorporating evidence about research practices *is* using a prior, but argue it's an *objective prior* based on empirical auditing data (e.g., "Based on meta-research, subfield Y has an estimated false positive rate of 40% for p<0.05 studies, implying a prior odds ratio of Z"). This maintains your aversion to personal hunches but abandons strict "no priors" frequentism. *This is contested ground:* Many Bayesians argue "objective" priors are still priors, while some frequentists see this as importing bias.

  2.  **Valuing Exploratory Analysis (Point 6) vs. Relying on Large Pre-Registered Replications/Meta-Analyses (Point 2) and Preregistration (Point 4):**
      *   **Conflict:** Your solution for reliability (big replications/pre-reg) inherently prioritizes confirmatory research. Exploratory findings are, by definition, not pre-registered and often arise from smaller, flexible studies. How do you reconcile believing *only* claims that pass the big replication filter with valuing the exploratory work that generates those claims? Strict prereg culture *can* stifle the serendipity of exploration if not managed carefully.
      *   **Cheapest Fix:** **Strictly Separate Roles & Labeling.** Champion exploratory analysis *as hypothesis generation*, not hypothesis testing. Demand that exploratory findings be:
          *   Explicitly labeled as such.
          *   Reported with effect sizes, CIs, and *all* relevant analyses (transparency over selective reporting).
          *   Not subjected to dichotomous "significance" judgments (aligns with Point 5).
          *   Understood as requiring *future confirmatory testing* (via pre-reg, multi-site replics) before being considered reliable evidence (Point 2). View them as 10/90 or 20/80 bets, not 50/50.
      *   **Cost:** It requires strong cultural shift in reporting and interpretation. Exploratory papers might get less attention initially. It doesn't solve the "file drawer" problem for exploratory null results.
      *   **Fixes Multiple Tensions?** Yes! This fix directly addresses the tension between (2), (4), and (6). It also reinforces your Point 5 (de-emphasize dichotomous results) for exploratory work.

  3.  **De-emphasizing Dichotomous Significance (Point 5) vs. Proposing Lower Alpha (Point 4):**
      *   **Conflict:** Lowering the alpha threshold (e.g., 0.05 to 0.005) is itself a move reinforcing the dichotomous mindset ("Is it < 0.005 or not?"), even if motivated by better error control. It risks shifting the goalposts without fully addressing the core problem of treating "p < alpha" as a scientific truth token.
      *   **Cheapest Fix:** **Frame Lower Alpha as a *Supplement*, Not a Replacement, for Point 5.** Advocate for lower alpha thresholds *alongside* the mandatory reporting of effect sizes and CIs. Explicitly state that the lower alpha is a *pragmatic tool* for improving error control in a noisy system, but it *does not* replace the need to interpret estimates in context. Emphasize that "p < 0.005" still only means "incompatible with H0 under strict assumptions," not "true" or "important."
      *   **Cost:** The tension isn't fully resolved, but mitigated. The lowered threshold still creates a binary attractor. It makes exploratory findings (Point 6) even harder to "publish" under traditional norms.
      *   **Fixes Multiple Tensions?** Indirectly. It prevents lowering alpha from undermining your core message in Point 5.

  4.  **Selective Reporting as Root Cause (Point 1) vs. Reliance on Big Replications (Point 2):**
      *   **Conflict:** While logically consistent (big replications help fix selective reporting fallout), there's a pragmatic tension. Big replications are expensive and slow. Focusing *only* on claims that have passed this filter risks neglecting newer fields, rare phenomena, or resource-poor areas where such replication isn't feasible yet. It might bias belief towards established, fundable topics.
      *   **Cheapest Fix:** **Clarify the 50/50 Stance & Embrace Graded Belief.** Emphasize that your "50/50 at best" for non-replicated claims isn't a dismissal, but a call for appropriate skepticism and *prioritization* of replication efforts. Actively promote smaller-scale, rigorous pre-registered replications as stepping stones. Frame belief as a continuum: "Strong belief requires strong evidence (big replics), tentative hypothesis requires less, but always requires transparency (prereg, open data)."
      *   **Cost:** Requires nuance in communication. Doesn't solve the resource imbalance for replication.

  **Settled vs. Contested Ground (Flagged Clearly):**

  *   **Settled (Near Consensus):**
      *   **Point 1 (Selective Reporting is Central):** Most methodologists agree this is the primary driver of the replication crisis. While other issues (e.g., low power, questionable measurement) exist, they are amplified by selection bias.
      *   **Point 4 (Preregistration is a Key Institutional Fix):** Widely accepted as a crucial tool for combating HARKing and p-hacking in *confirmatory* research.
      *   **Point 5 (De-emphasize Dichotomous Significance):** Strong consensus that p < 0.05 ≠ "truth" and that effect sizes/CIs are essential. The ASA's 2016 statement solidified this.
  *   **Contested (Live Arguments):**
      *   **Point 3 (Rejection of Bayesianism):** **HOTLY CONTESTED.** This is a fundamental philosophical divide. Bayesians argue frequentist error control is often not the relevant quantity for scientific inference (e.g., it ignores the prior plausibility and the specific data observed), and that well-calibrated priors (even if subjective) are essential. Frequentists counter that Bayesian posteriors are sensitive to prior choice and lack guaranteed long-run error control. Your "license to smuggle" critique is a standard frequentist objection.
      *   **Point 4 (Lowering Alpha Threshold):** **CONTENDED.** Proponents (e.g., Valen Johnson, Daniel Benjamin) argue it's a simple, effective partial fix for false positives. Opponents argue it exacerbates the file drawer problem, reduces power dramatically (especially for smaller studies), doesn't address underlying issues like effect size inflation, and might be a band-aid distracting from deeper reforms. The "0.005" number itself is debated.
      *   **Point 7 (Search-Adjusted Thresholds / Literature Context):** **CONTENDED & EMERGING.** The *idea* that context matters is gaining traction (e.g., Ioannidis' "Why Most Published Research Findings Are False" relies on prior probability). However, *how* to operationalize this statistically is highly contested. Is it Bayesian? Is it a frequentist correction? Can "forking density" be reliably measured? Your specific proposal is novel and falls squarely into this active debate area. Your statistician's critique represents one common viewpoint.
      *   **Point 2 (Exclusive Reliance on Big Replications/Meta-Analyses):** **CONTENDED.** While their value is undisputed, making them the *sole* arbiter of belief is controversial. Critics argue it's impractical, slow, ignores valuable information from well-conducted initial studies, and potentially stifles innovation. Meta-analyses themselves can be biased (e.g., publication bias persists).

  **Assumptions Made & Clarifications Needed:**

  1.  **Assumption:** Your rejection of Bayesianism (Point 3) implies a commitment to *strict Neyman-Pearson frequentism* (focusing solely on long-run error rates over many hypothetical experiments). **Clarify:** Is this accurate? Or are you open to Fisherian p-values (as measures of evidence against a specific null) within a broader frequentist framework? This affects how you defend against the Bayesian critique of Point 7.
  2.  **Assumption:** Your "50/50 at best" (Point 2) implies a very low prior belief in *any* novel hypothesis without massive replication. **Clarify:** Is this baseline skepticism applied uniformly? Does it vary based on theoretical plausibility or initial study quality, or *only* based on replication status? (This links back to the tension with Point 7 and the Bayesian critique).
  3.  **Assumption:** You view "priors" solely as subjective hunches. **Clarify:** Are you completely opposed to *any* form of prior information, even empirically derived baselines (e.g., "only 1 in 10 novel effects in this field replicate")? This is crucial for whether *any* version of Point 7 can fit within your framework.

  **Single Revision with Broad Impact:**

  **Embrace and Formalize the Distinction Between Exploratory and Confirmatory Research.**

  *   **How it Helps:**
      *   **Resolves Tension 2:** Clearly defines the role of each. Exploratory = hypothesis generation (valuing Point 6), Confirmatory = hypothesis testing (requiring Points 2 & 4).
      *   **Supports Point 5:** Mandates effect sizes/CIs everywhere, but especially de-emphasizes dichotomous results for exploratory work ("look at the estimate, not the p-value").
      *   **Informs Point 7:** "Searchiness" is primarily an attribute of poorly labeled exploratory work masquerading as confirmatory. Clean separation reduces the perceived need for broad "literature habit" adjustments. Corrections apply *within* the confirmatory paradigm for documented flexibility.
      *   **Strengthens Point 4:** Preregistration becomes the clear marker for confirmatory analysis.
      *   **Aligns with Point 1:** Much "p-hacking" stems from blurring exploration and confirmation. Separation tackles this root cause.
  *   **Cost:** Requires a major cultural and publishing norms shift. Demands clear labeling and potentially different standards/journals/sections for different modes. Doesn't eliminate all selective reporting within exploration.

  **Conclusion:**

  Your position is largely coherent and aligns with significant methodological reform movements. The **most critical tension** is between your rejection of Bayesianism and your intuitively appealing "search-adjusted thresholds," which your statistician correctly identifies as Bayesian in spirit. The cheapest fix is reframing Point 7 as applying frequentist corrections only to *documented, specific* procedural flexibility within a study or its direct lineage, abandoning the broader "literature habit" adjustment. The most impactful single revision is rigorously separating exploratory and confirmatory research, which alleviates several other tensions. Be prepared to defend your strict frequentist stance against Bayesian critiques, clarify your level of baseline skepticism, and articulate how you handle prior information derived from meta-research. Good luck with the reading group! Expect the sighing statistician to focus on Point 3 vs. Point 7.
