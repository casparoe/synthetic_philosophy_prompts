  - "Rational choice theory says they're irrelevant" – mostly true in strict theory.
  - Examples like finishing a degree or sitting through a bad movie are fallacies. But are they *always* irrational? Maybe not, if there are other factors.

  The user mentioned commitment effects, reputation, self-narrative. These are important. For instance, continuing a degree might signal commitment to future employers. Or finishing a project to avoid feeling wasteful, which ties into identity. Behavioral economics shows that people do consider these things, and they aren't necessarily irrational.

  I should distinguish between the core economic principle and real-world applications. The core is sound: sunk costs shouldn't affect marginal decisions. But in practice, past investments can provide information. For example, sticking with a relationship might indicate learned value, not just time invested.

  Also, the friend's conclusion to decide "as if with no history" is problematic. History provides information. If a project has consumed resources, that might signal its complexity or your own capabilities. Ignoring that could lead to underestimating future costs.

