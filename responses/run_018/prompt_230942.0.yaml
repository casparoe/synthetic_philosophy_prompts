  First, I need to recall the standard economic view. Sunk costs are irrelevant for future decisions; only marginal costs and benefits matter. That's textbook. But the user's friend extends this to say there's *never* a reason to consider past investments. The user suspects this ignores nuances like psychological or strategic factors.

  Breaking down the friend's statement: 
