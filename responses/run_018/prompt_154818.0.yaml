answer: |-
  ## Union Automation Assessment Procedure

  **1. Role, Stakes, and Constraints (110 words)**
  As the union's automation advisor, I review employer automation proposals monthly. My signed recommendation (Oppose, Negotiate Conditions, Accept w/Monitoring) is based solely on the proposal documents and confidential worker interviews within 48 hours. I lack engineering expertise and cannot commission studies. The core stakes are: net job loss, increased work pace/intensity, skill erosion, and the transfer of worker knowledge into company-owned systems ("dead labor"). My recommendation goes to the union executive board (including non-specialists) with justification based on worker welfare and control over the labor process. The goal is to prevent exploitation disguised as progress.

  **2. The Procedure—Ordered Tests and Rules (450 words)**

  **PHASE 1: JOB & TIME IMPACT (Assess Displacement & Intensity)**
  1.  **Job Loss Estimate:** Does the proposal credibly estimate net job reduction (after accounting for any new roles)? *Sufficient:* Specific numbers/percentages per role/department. *Rule:* If >10% net loss, triggers Phase 3 Opposition or strict Negotiation conditions.
  2.  **Displaced Task Analysis:** Are the eliminated tasks primarily repetitive, hazardous, or physically taxing? *Sufficient:* Clear mapping of tasks removed vs. retained. *Rule:* Eliminating desirable/skilled tasks increases negative impact severity.
  3.  **Time Savings Allocation:** Does the proposal explicitly commit surplus time *reduction* to (a) shorter hours with maintained wages, or (b) retraining/redeployment? *Sufficient:* Concrete language in the proposal (e.g., "hours reduced by X%", "redeployment plan attached"). *Rule:* Absence of (a) or (b) is a major negative; presence moves towards Negotiate/Accept.
  4.  **Work Intensification Risk:** Does the system inherently enable/require increased output targets or pace for remaining workers? *Sufficient:* Worker reports of historical speed-up after automation; proposal metrics focusing solely on output/throughput. *Rule:* High risk triggers Negotiation for strict output/pacing limits or Opposition.

  **PHASE 2: LABOR PROCESS CONTROL (Assess Formal vs. Real Subsumption)**
  5.  **Worker Autonomy & Rhythm:** Does the system integrate into the *existing* workflow, controlled by workers using their judgment/timing? Or does it dictate the workflow sequence, pace, and logic? *Sufficient:* Worker interviews describing control vs. being monitored/paced; proposal describing system-driven workflows. **[NICHE DISTINCTION]**
      *   *Rule (Formal Subsumption - Extends Capacity):* If the machine *augments* worker capacity within *their* established rhythm/timing (e.g., power tools, basic conveyors), leans towards **Negotiate** (focus on safety, training, job loss mitigation).
      *   *Rule (Real Subsumption - Imposes Tempo):* If the machine *dictates* the sequence, logic, and *pace* of work (e.g., algorithmically timed assembly lines, AI pacing systems), workers become servants to the machine's logic. This is a core characteristic of real subsumption and strongly leans towards **Oppose** unless exceptional safeguards are negotiated.
  6.  **Skill & Judgment Reduction:** Does the system automate decision-making or complex judgment previously exercised by workers? *Sufficient:* Proposal stating automation of diagnostics/planning; workers reporting loss of decision-making authority. *Rule:* Significant reduction triggers Negotiation for upskilling paths or veto rights, or Opposition if total deskilling.

  **PHASE 3: KNOWLEDGE CAPTURE & OWNERSHIP (Assect Tacit Knowledge Extraction)**
  7.  **Tacit Knowledge Extraction Test:** Does the system *require* workers to input experiential knowledge (diagnostic patterns, problem-solving methods, organizational tips) that is then formalized into algorithms/databases they cannot access or control? *Sufficient:* Proposal mentioning "capturing best practices," "training the AI," or requiring detailed data logging; workers describing feeding the system their know-how. *Rule:* Any extraction mandates **Negotiation** for worker access, data ownership clauses, royalties, or veto power. *Extensive* extraction with no worker benefit or control is an **Oppose** trigger.
  8.  **Proprietary Lock-in:** Is the captured knowledge/algorithm locked into a company-owned, proprietary system inaccessible to the union? *Sufficient:* Proposal language on IP ownership, lack of union access clauses. *Rule:* Proprietary lock-in combined with extraction (Q7) is a severe negative, demanding strong Negotiation or Opposition.

  **3. Stop Points, Opposition Triggers, and Value Handoffs (190 words)**

  *   **Mandatory Opposition Triggers:**
      *   Proposal fails Phase 1, Q3 (No commitment to time savings for workers via shorter hours/redeployment) *AND* shows >10% net job loss (Phase 1, Q1).
      *   Proposal demonstrates clear Real Subsumption (Phase 2, Q5 - Imposes Tempo) *AND* high Work Intensification Risk (Phase 1, Q4) *without* mitigable safeguards.
      *   Proposal involves extensive Tacit Knowledge Extraction (Phase 3, Q7) *AND* Proprietary Lock-in (Phase 3, Q8) *without* possibility of significant worker benefit/control.
  *   **Mandatory Negotiation Trigger:** Any "Yes" in Phase 3 (Q7 or Q8) mandates negotiation for knowledge ownership/access/compensation clauses. Significant risks in other phases (e.g., job loss without mitigation, intensification risk, skill loss) also mandate negotiation for specific protections (e.g., retraining, staffing ratios, output caps, veto rights).
  *   **Value Handoff Stop Point:** If the procedure indicates potential for significant productivity gains benefiting workers (e.g., clear path to shorter hours via Q3) *but* requires eliminating roles central to a valued craft identity, the decision is handed to the Board. The advisor flags the factual trade-off (economic security vs. craft preservation) but states the framework cannot resolve this value judgment.

  **4. Three Worked Cases (350 words)**

  *   **(a) Robotic Welding Line (Eliminates 50% of team, unchanged tasks/pace for rest):**
      *   Q1: >10% job loss (50%) - **Negative.**
      *   Q2: Eliminates skilled welding tasks? (Assume yes) - **Negative.**
      *   Q3: Time savings allocated? (Assume no commitment) - **Major Negative.**
      *   Q4: Intensification risk? Low (pace unchanged) - **Pass.**
      *   Q5: Dictates pace? No (workers keep rhythm) - **Formal Subsumption.**
      *   Q6: Skill loss? For eliminated workers, yes; retained? Minimal. Mixed. **Negotiation** focus: Severe job loss mitigation (severance, retraining, attrition), *not* labor process.
      *   Q7/Q8: Knowledge capture? Unlikely. **Recommendation: Negotiate Conditions** (focus: job loss mitigation, wage protection for retained).

  *   **(b) AI Scheduling/Pacing Algorithm (Adjusts targets based on real-time data):**
      *   Q1: Job loss? May be indirect via "efficiency." **Risk.**
      *   Q3: Time savings allocation? Highly unlikely. **Major Negative.**
      *   Q4: Intensification risk? Inherently high (continuous adjustment). **Major Negative.**
      *   Q5: Dictates pace? Absolutely (algorithm sets targets/logic). **Real Subsumption (Imposes Tempo).**
      *   Q6: Skill loss? Reduces planning/judgment. **Negative.**
      *   Q7: Tacit extraction? Likely (uses performance data to refine pacing). **Negative.**
      *   Q8: Proprietary? Almost certainly. **Negative.**
      *   **Recommendation: Oppose.** Combines mandated tempo (Real Subsumption), high intensification risk, likely knowledge capture, and no worker benefit from time savings.

  *   **(c) Predictive Maintenance Platform (Mechanics input data, system automates diagnostics, reduces role to sensor swaps):**
      *   Q1: Job loss? Possible reduction via "efficiency." **Risk.**
      *   Q3: Time savings allocation? (Assume vague promises) - **Likely Negative.**
      *   Q4: Intensification? Possible if more sensors to manage. **Risk.**
      *   Q5: Dictates pace? Unlikely for sensor swap; diagnostic pace set by system. Mixed, but not core tempo imposition. **Formal-ish.**
      *   Q6: Skill loss? Major (diagnostics automated). **Major Negative.**
      *   Q7: Tacit Extraction? **YES** (Mechanics input failure patterns, training the AI). **Critical Negative.**
      *   Q8: Proprietary? Almost certainly. **Critical Negative.**
      *   **Recommendation: Accept with Strict Monitoring & Conditions** (Not Oppose). Why? While severe deskilling and knowledge extraction occur, the core *labor process* isn't fundamentally redesigned *around the machine's rhythm* dictating human movement (Real Subsumption). The system automates a cognitive *function* (diagnosis), replacing mechanic *judgment*, but mechanics aren't subjected to a new machine-imposed physical tempo. Negotiation is mandatory (Q7/Q8 triggers) for: Access to the diagnostic database, input/validation rights, guaranteed upskilling on system management, staffing levels, no discipline based on automated diagnostics alone. *This conditional acceptance is unwelcome but reflects the procedure's distinction between automating tasks/functions (formal) vs. redesigning the work tempo/rhythm itself (real).*

  **5. Limits, Misfires, and Unsettled Cases (200 words)**

  *   **False Negatives (Accept/Negotiate when should Oppose):**
      *   **Vague Proposals:** Ambiguous language on data ownership (Q8) or time allocation (Q3) can mask risks. Judgment required: assume worst-case without explicit guarantees.
      *   **Long-Term Creep:** Systems appearing benign initially (Formal Subsumption) may enable later Real Subsumption (e.g., adding pacing later). Monitoring is crucial.
      *   **"Cooperative" Extraction:** Workers willingly contributing knowledge without realizing future displacement (Q7). Interviews must probe understanding of long-term impact.
  *   **False Positives (Oppose when could Negotiate):**
      *   **Misinterpreted Automation:** Mistaking complex but worker-controlled tools (e.g., advanced CNC programming *by* machinists) for Real Subsumption (Q5). Worker interviews vital.
      *   **Overly Pessimistic Q3:** Rejecting proposals with genuine, enforceable shorter-hour commitments due to distrust. Requires careful verification.
  *   **Unsettled Cases:**
      *   **Ambiguous Subsumption:** Does algorithmically *suggesting* (not enforcing) a workflow constitute tempo imposition (Q5)? Judgment call based on worker experience of pressure.
      *   **Data Value Ambiguity:** How much compensation is fair for knowledge extraction (Q7/Q8)? Framework flags the issue but negotiation determines the value.
      *   **Solidarity vs. Efficiency:** When job loss is concentrated in one group, but gains (like shorter hours) benefit others (Handoff Point). Framework identifies the conflict but cannot resolve it.
      *   **"Good" Real Subsumption?** The framework inherently views Real Subsumption (imposed tempo) negatively as worker subordination. Cases where workers genuinely prefer this are value conflicts (Handoff Point).
