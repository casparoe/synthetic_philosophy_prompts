  ## Moral Philosophy Dialogue: The Budget Model Twist

  **(Setting: A slightly worn tutorial room in an Oxford college. MAYA and LEO are packing up after a session on demandingness objections. Tea mugs are half-empty.)**

  ### 1. Opening Positions (250 words)

  **Maya:** (Sighing, stacking papers) Honestly, Leo, every time we dissect Singer’s shallow pond or Unger’s envelope case, it just feels… suffocating. Consequentialism *has* to be wrong ‘cause it asks for everything. Like, literally, until giving more wouldn’t help anyone else more than it costs *me*. I’m skint most weeks, barely afford cinema tickets, and this theory tells me I’m *obligated* to donate that cash to AMF instead? Forever? That’s not morality, that’s moral bankruptcy for the agent! It ignores we have lives, projects, *needs* beyond being utility pumps.

  **Leo:** (Leaning back, thoughtful) Right, I get it *feels* mad demanding, Maya. But doesn’t that feeling rely on assuming our baseline – our comfy life – is morally neutral? Consequentialism just points out the stark maths: if my £20 saves a life via AMF, and skipping one film barely dents my wellbeing comparatively… well, *not* donating has a massive negative consequence. It’s not *punishing* me for having preferences; it’s recognising the *actual cost* of indulging them when lives are at stake. The ‘demandingness’ is just the gap between what we *want* to do and what the situation objectively requires for the best outcome.

  **Maya:** But ‘objectively requires’ ignores the agent’s reality! It treats my time, my energy, my little pleasures like an infinite resource. It *feels* like an impossible debt piling up.

  **Leo:** Ah, ‘debt’. Interesting word. Let’s unpack that…

  ### 2. The Budget-Model and Wellbeing Back-and-Forth (400 words)

  **Maya:** What’s to unpack? Every time I choose myself over the greater good, according to consequentialism, I’m accruing moral debt. Like I owe the universe somethin’ I haven’t paid. No wonder it feels crushing – it’s a constant overdraft on my moral account!

  **Leo:** See, *that’s* the ‘budget model’ our tutor mentioned! You’re implicitly framing morality like a personal ledger: ‘Moral Credits In (Doing Good)’ vs. ‘Moral Debits Out (Costs to Me)’. And if debits exceed some fuzzy ‘budget’, you’re bankrupt, crushed. But why accept that model? Why assume moral obligations *are* like financial debts that accumulate against a limited personal fund?

  **Maya:** Because that’s how it *feels*, innit? Resources *are* limited – time, money, emotional bandwidth. Using them on myself feels like spending from a finite pot that *could* be spent morally. Hence… debt. Simple.

  **Leo:** But feeling it doesn’t make the *model* accurate for moral theory. And here’s the tutor’s twist: that crushing ‘debt’ feeling might *depend* on a specific view of wellbeing – preference-satisfaction. If wellbeing is *just* about fulfilling my personal desires and preferences, then *any* act diverting resources from *my* preferences feels like a pure loss, a cost, a debit. Donating £20 *is* a direct hit to my preference for cinema, hence the debt feeling.

  **Maya:** (Nodding slowly) Yeah… it *is* a loss to my preferences. That cinema trip *would* have satisfied a preference. So the cost is real on that view.

  **Leo:** Exactly! But what if wellbeing isn't *just* preference-satisfaction? What if it’s, say, objective list theory – flourishing involving relationships, achievements, knowledge? Or maybe desire-independent goods? Suddenly, donating £20 isn’t *necessarily* a net debit against my wellbeing. It might contribute to my flourishing by aligning with my value of compassion, reducing cognitive dissonance, fostering meaning. The ‘cost’ shrinks, maybe vanishes, or even becomes a gain. The ‘budget model’ collapses if wellbeing isn’t defined by thwarted preferences.

  **Maya:** Hmm… that’s clever. So you’re saying the demandingness objection only feels utterly crushing *if* I already buy that wellbeing = my preferences getting met, *and* I see moral action as always draining that personal preference-pot? If wellbeing is more holistic or objective, the ‘cost’ of donating isn’t automatically a wellbeing *loss*?

  **Leo:** Precisely! Consequentialism demands we maximise wellbeing, full stop. It doesn’t *prescribe* what wellbeing *is*. If donating genuinely enhances my flourishing in a broader sense, it’s not a ‘cost’ in the budget-debt sense; it’s part of the wellbeing calculus itself. The ‘crushing’ feeling might stem from an overly narrow, preference-centric view smuggled into the objection.

  **Maya:** But hang on… even on an objective list, skipping cinema *might* still mean missing out on relaxation or cultural engagement – genuine objective goods! And constantly prioritising distant needs *could* objectively damage my close relationships or mental health through exhaustion. The potential for demandingness isn’t *just* about preference-thwarting; objective wellbeing can still be stretched thin.

  **Leo:** Fair point. I’m not saying demandingness vanishes entirely. Just that framing it as a crushing *debt* heavily depends on seeing wellbeing as purely personal preference-satisfaction. Recognising that might soften the *psychological* weight, even if the objective requirement remains significant.

  ### 3. Where They Land (200 words)

  **Maya:** Okay, I’ll concede that. The ‘debt piling up’ feeling *is* probably tied to seeing my wellbeing as my preferences getting met. And if wellbeing includes things like living ethically or finding meaning in contribution… maybe giving doesn’t always *feel* like such a raw loss. It might even balance the ledger differently.

  **Leo:** Right. So the demandingness objection relies on assuming a specific, preference-based view of wellbeing to generate that particular ‘crushing debt’ sensation. It’s not necessarily baked into consequentialism *itself*.

  **Maya:** But… I’m not totally letting consequentialism off the hook. Even with an objective wellbeing view, there’s still a point where constantly giving *would* objectively undermine my own flourishing – relationships, health, capacity to function. Consequentialism still risks demanding agents sacrifice *too much* of their own necessary wellbeing foundation, regardless of how we model the ‘cost’. That core worry about unsustainable demands remains.

  **Leo:** Absolutely agree. You’ve nailed the core of the objection: where’s the line before self-sacrifice becomes self-destruction, harming net wellbeing? Consequentialism struggles with that *structurally*, irrespective of the wellbeing theory or cost model. The ‘budget model’ angle just shows why the objection often *feels* so viscerally awful. It’s a nuance, not a knockout blow for either side.

  **Maya:** (Gathering bag) Partial agreement then. The crushing *feeling* might be budget-model + preference-wellbeing dependent. But the fundamental worry about *excessive* demand? That’s still a proper headache for your lot, Leo. Tea tomorrow?

  **Leo:** (Smiling) Definitely. My treat… though maybe not *every* time, yeah? Gotta keep *some* budget for moral philosophy debates.
