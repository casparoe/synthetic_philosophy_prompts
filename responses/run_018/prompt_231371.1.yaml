prompt: |-
  In preparing a graduate unit on the nonidentity problem, I presented the following argument in seminar. It seemed to prove too much and none of us could immediately see where it failed, so before I teach the material again I want a precise diagnosis.

  (1) A person is wronged by an act or policy only if that act or policy makes the person worse off than they would have been in its absence.

  (2) A person is not made worse off by an act or policy that is a necessary causal condition of that person's ever having existed, provided the life that person lives is worth living. The only alternative is never existing, and a life worth living is not worse for the person who lives it than never having existed.

  (3) For every person now alive who is descended from people enslaved in the transatlantic slave trade, the slave trade is a necessary causal condition of that person's existence. Had it not occurred, the specific chain of migrations, meetings, unions, and conceptions that produced that particular person would not have occurred, and that person would never have existed.

  (4) Therefore, by (2), the slave trade made no present descendant of those it enslaved worse off than that descendant would otherwise have been.

  (5) Therefore, by (1), the slave trade wronged no present descendant of those it enslaved.

  (6) A person now alive has a claim of justice grounded in an act only if that act wronged them.

  (7) Therefore, no present descendant of those enslaved has a claim of justice grounded in the slave trade.

  (8) By exactly parallel reasoning, no future person is wronged by any present policy that is a necessary causal condition of that person's existence. Large-scale choices—a high-emissions energy policy, delayed decarbonization, the depletion of a finite resource base—alter who meets whom, who stays, and who is born; under a different policy, different people would eventually be conceived. So long as the resulting lives remain worth living, none of those future people is made worse off by our present choice, and by (1) none is wronged by it.

  (9) These conclusions cannot be right. It cannot be that present descendants of enslaved people have no claim of justice grounded in what was done to their ancestors; and it cannot be that a policy knowingly bequeathing future people lives that are only barely worth living—lives shaped by avoidable climate damage—wrongs no one.

  So either (1), (2), or (6) is false, or at least one inference in the argument is invalid. Where does the argument go wrong? If a premise is false, identify it and explain what rejecting it commits us to. If a step is invalid, locate the precise step and state the distinction it overlooks. I would prefer to keep the judgments in (9), but I do not want to pay for them by quietly surrendering every person-affecting constraint on moral evaluation; tell me what the least costly revision is and what it commits me to.

  Lead with your bottom line in the first sentence, then give your reasoning; no preamble and no restating of the question.
reasoning: |-
  Okay, the user is a graduate instructor teaching a unit on the nonidentity problem. They presented an argument in seminar that seemed to prove too much, and now they want to identify precisely where it fails. The argument concludes that descendants of enslaved people have no justice claims related to the slave trade, and similarly, future generations aren't wronged by harmful policies like climate inaction, as long as their lives are worth living. The user finds these conclusions unacceptable and wants to know which premise or inference is flawed, without abandoning person-affecting constraints entirely.

  First, I need to recall the nonidentity problem. It's a philosophical issue where actions affecting who comes into existence might not harm specific individuals, since those individuals wouldn't exist otherwise. The argument here uses that logic: premises (1) and (2) set up that wronging requires making someone worse off, and necessary conditions for existence don't count as making someone worse off if their life is worth living. Step (3) applies this to descendants of enslaved people, leading to (4) and (5) that they weren't wronged. Step (6) ties wronging to claims of justice, so (7) denies such claims. Step (8) extends it to future people and policies like climate change. Step (9) rejects these conclusions as implausible.

  The user points out that either a premise is false or an inference is invalid. I have to identify the flaw. Premise (1) is a standard person-affecting principle: you're wronged only if made worse off. Premise (2) seems solid for the nonidentity case—existing with a worth-living life isn't worse than never existing. Step (3) is factual for descendants. The inference to (4) and (5) follows logically if we accept (1)-(3). Similarly, (8) parallels the reasoning. Premise (6) links wronging to justice claims, which might be debatable but isn't the core issue here.

  The problem must be in how the argument handles the scope of wronging. The key insight is that premise (1) is too narrow. Wronging someone might not always require making them worse off compared to their actual alternatives. In cases where an act causes someone to exist with harms, but they wouldn't exist otherwise, (1) says they're not worse off. But perhaps we can wrong someone by creating them in a harmed state, even if it's not worse than non-existence. This is a common response to the nonidentity problem. Rejecting (1) allows for wronging without comparative harm, but that might weaken person-affecting constraints. The user wants to preserve some person-affecting elements, so the least costly revision is to reject (1) and allow that acts can wrong people by causing them to exist with severe injustices or deprivations, without requiring that they'd be better off otherwise. This commits to a view where creating people in unjust conditions can be wronging them, even if their life is net positive.

  Another possibility is to question premise (6), that justice claims require being wronged. But that might not address the core issue, as the wronging part is still problematic. Or, perhaps distinguish between individual wronging and collective/historical injustice, but the user wants a precise step. I think premise (1) is the culprit. Rejecting it means denying that wronging always requires making someone worse off, which allows for claims based on the slave trade's ongoing effects or climate policies' creation of avoidable hardships. This revision keeps person-affecting elements by focusing on the individuals affected, but broadens what counts as wronging. It's less costly than rejecting person-affecting constraints entirely.
answer: |-
  The argument fails at step (5) due to a false inference from (4) to (5), because premise (1) is false: being wronged does not strictly require being made *comparatively worse off* in cases involving necessary conditions of existence.

  Premise (1) states that wronging requires making a person worse off than they would have been otherwise. While intuitive for same-person scenarios, this comparative harm condition fails in nonidentity cases. One can be wronged by an act that is a necessary condition for one's existence if that act *imposes unjust burdens or deprivations* on them, even if their life is net worth living and nonexistence was the alternative. Wronging here is not about being worse off relative to a baseline of nonexistence (which premise (2) correctly notes is incoherent), but about violating rights or duties owed to the person *once they exist*. For descendants of the enslaved, the slave trade inflicted an ongoing, inherited injustice—such as systemic disadvantage or the wrongful appropriation of lineage and labor—that constitutes a present harm *to them*, independent of whether they would otherwise not exist. Similarly, a high-emissions policy wrongs future people by *causing* them to live in avoidably degraded conditions, violating a duty not to create persons in unjust states.

  Rejecting (1) commits you to a "non-comparative" account of harm/wronging: an act can wrong someone if it causes them to suffer severe injustice or deprivation, irrespective of whether they would have been better off absent the act. This preserves person-affecting constraints (wronging still requires a victim) while accommodating historical and intergenerational justice. It avoids the extreme conclusions in (7) and (8) without collapsing into impersonal morality. The least costly revision is to retain (2) and (6) but refine (1) to recognize non-comparative wrongs arising from the infliction of unjust conditions. This entails that descendants of the enslaved have claims grounded in *inherited injustices perpetuated in their lives*, and future people can be wronged by policies that *forseeably create them in avoidably impoverished circumstances*.
