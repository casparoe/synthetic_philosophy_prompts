prompt: |-
  I have an argument that extends Dennett’s Chase-and-Sanborn intuition pump and seems to show that if we quine qualia we must also quine beliefs, which is intolerable. (1) Chase reports that Maxwell House coffee now tastes bad because he has become a more sophisticated drinker — a change in reactive disposition. Sanborn reports that Maxwell House tastes exactly as it always did to him, but it used to taste good and now tastes bad — a change in intrinsic qualitative character. (2) From the first-person perspective alone, neither can determine whether they are in the Chase-type or the Sanborn-type situation; there is no introspective datum that reveals whether one’s preferences or one’s phenomenal properties have shifted. (3) If a distinction is in principle undetectable both behaviourally and introspectively, then positing entities on only one side of it is ontologically extravagant; so we should quine intrinsic qualia and retain only the functional description. (4) Apply the same reasoning to belief: I sincerely judge that water is wet, but I might be in a ‘Chase-type’ case (my belief about water changed) or a ‘Sanborn-type’ case (the contentful character associated with ‘water’ inverted, leaving my behavioural and functional profile intact). (5) Introspection offers no access to whether my mental symbol’s reference or my attitude toward it has altered. (6) Therefore, by parity with (3), there is no fact of the matter separating belief-content inversion from belief-attitude change, and we ought to quine determinate propositional content altogether. (7) But if beliefs lack determinate content, rational agency and scientific explanation collapse; this is unacceptable. I should like to preserve both (3) and (7). Which step should I reject? Please explain why that step initially looked plausible, and discuss what a heterophenomenological eliminativist about qualia, a representationalist about phenomenal consciousness, and an externalist about mental content each have to pay to deny it. Answer in British English.
