  Confidence check: A real Millian might balk at joint claim 4 (generalizing to "I am Iris")—it blurs name semantics with indexicals. A Fregean might hate "residual disagreement 2" calling modes psychological. But overall, it’s signable because it frames disputes precisely without conceding ground. 

  ... Time to write. I’ll start with the headline, bullet-point the agreements, then lay out the rest. For the dossier case, I’ll stress that both sides *describe* the irrationality similarly (two mental files) but *explain* it differently (semantic vs. psychological). That’s the novelistic hook—Iris realizing their fight is about words, not the world.
answer: |-
  **Joint Statement: The Semantic Architecture of Identity Claims**  
  *Signed after 12 months of adversarial collaboration*  

  **Headline:**  
  The core disagreement concerns whether cognitive differences in identity statements require distinct *semantic content* (Fregean) or arise solely from *psychological associations* attached to identical semantic values (Millian).  

  ---

  ### (1) Jointly Endorsed Claims  
  *Both signatories accept these as uncontroversial data:*  
  1. **Cognitive Asymmetry**: "Hesperus is Hesperus" is cognitively trivial; "Hesperus is Phosphorus" can be informative despite identical truth conditions.  
  2. **Substitution Failure**: Substituting co-referential names in belief reports (e.g., "Lois believes Superman flies" vs. "Lois believes Clark Kent flies") can alter truth value.  
  3. **Generalization Beyond Names**: The phenomenon extends to natural kind terms ("Water is H₂O" is informative), indexicals ("I am Iris" is trivial to Iris but potentially informative to others), and descriptive identities ("The murderer is the vicar" can surprise).  
  4. **Authorial Rename Case**: Learning "Mary is Marianne" *is* informative to a reader of draft four alone, replicating the Hesperus/Phosphorus dynamic. This is not reducible to fiction or authorial intent but reflects cognitive access via distinct lexical entries.  

  ---

  ### (2) Residual Disagreements  
  | **Millian Position (Semantic Minimalism)**                        | **Fregean Position (Semantic Enrichment)**                          |
  |-------------------------------------------------------------------|---------------------------------------------------------------------|
  | Names contribute only their referent to semantic content.         | Names contribute a *mode of presentation* (MoP) to semantic content. |
  | Informativeness is purely psychological (e.g., distinct mental files). | Informativeness is partly semantic (encoded in the MoP).            |
  | Belief reports’ substitution failures stem from pragmatics/metalinguistics. | Substitution failures reflect MoP-sensitive semantic content.      |
  | "Two-dossier" cases expose irrationality, not semantic ambiguity. | "Two-dossier" cases show reference via distinct, semantically relevant MoPs. |

  ---

  ### (3) Cruxes & Test Cases  
  *Each crux’s resolution would materially alter one or both positions.*  

  **Crux 1: Where does cognitive difference reside?**  
  - **Test Case**: *Embedding under "obvious"*:  
    - Sentence: "It’s obvious that Hesperus is Phosphorus."  
    - **Millian Prediction**: True (semantically trivial); seeming falsity is pragmatic.  
    - **Fregean Prediction**: False (semantically non-trivial).  
  - *Both agree*: If competent speakers reject this as false, it favors Fregeanism.  

  **Crux 2: Are "MoPs" and "mental files" distinct?**  
  - **Test Case**: *The Two-Dossier Paradox*:  
    - Iris has two unlinked mental files for the same man (File A: embezzler; File B: innocent). She asserts both "He embezzled" (viewing A) and "He didn’t" (viewing B).  
    - **Millian Explanation**: Files are psychological; her contradiction is irrational but semantically coherent (one referent).  
    - **Fregean Explanation**: Files *are* MoPs; her assertions have distinct semantic content ("He₁ embezzled" vs. "He₂ didn’t"), so no contradiction.  
  - *Both agree*: If Iris’s utterances are not contradictory, Fregeanism wins; if they *are* contradictory, Millianism wins.  

  **Crux 3: Is the Mary/Marianne case identical to Hesperus?**  
  - **Test Case**: *Authorial Intent*:  
    - Suppose the novelist explicitly states: "In all drafts, 'Mary' and 'Marianne' corefer."  
    - **Millian Prediction**: Informativeness evaporates (reader error corrected).  
    - **Fregean Prediction**: Informativeness persists (lexical MoPs remain distinct).  
  - *Both agree*: If readers still find it informative post-disclosure, it supports Fregean semantics.  

  ---

  ### (4) The Rename & Dossier Cases Integrated  
  - **Mary/Marianne**: Jointly agreed to be the *same phenomenon* as Hesperus/Phosphorus (§1.4). Authorial intent is irrelevant to the *reader’s* cognitive state upon encounter.  
  - **Two-Dossier Case**:  
    - **Common Ground**: Iris manifests a *cognitive illusion of distinct referents*.  
    - **Disagreement**:  
      - Millian: Her error is psychological; semantics sees one object.  
      - Fregean: Her error reflects semantic access via two MoPs (meanings fragment).  

  ---

  **Signatory Confidence Assessment**  
  *Confidence: High*. This document isolates disagreements at the semantics-psychology interface without requiring either side to abandon core tenets.  
  - **Most Likely Objection**: A Millian may strike §1.4 ("Authorial Rename Case") *if* they insist fictional names lack referents. However, the phenomenon’s structural identity to Hesperus cases makes this defensible.  
  - **Line Most Likely Crossed**: **§3, Crux 2 (Fregean column)**: "Files *are* MoPs." A neo-Fregean might soften this to "MoPs *determine* file structure" to avoid collapsing semantics into psychology.  

  ---  
  *This document represents the irreducible boundary between semantics and psychology. Future progress requires jointly designed experiments on utterance interpretation under controlled cognitive constraints.*
