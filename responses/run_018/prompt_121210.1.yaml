  For the joint claims, I’ll start with the cognitive difference between trivial and informative identities. Both sides accept this happens, but they’ll fight over *why*. Substitution failures in belief reports are another safe bet—even Millians like Salmon or Soames admit *something* pragmatic is going on. Generalization to "water is H₂O" and "I am Iris" is trickier; Millians might resist lumping names with natural kinds or indexicals, but the data feels parallel. 

