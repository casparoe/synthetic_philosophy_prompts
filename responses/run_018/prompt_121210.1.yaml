  Her draft cases are gold. The Mary/Marianne rename mirrors Hesperus/Phosphorus but adds authorial intent—does that change things? The two-dossier case forces both sides to explain irrational belief. Millians will call it a psychological glitch; Fregeans will say it reveals semantic fragmentation. 

