answer: |-
  (Constitutionalist opponent voice, sharp but conceding surface distinctions): Your replicator case cleverly exposes a *practical* difference in how we track objects—artworks demand continuity of structure, not matter, for re-identification, while mere matter demands material continuity. But this difference tracks distinct ways we *access* the same enduring object: the spatially coincident entity. When we say "the statue persists," we refer to the object *under its structural-functional description*—and its persistence condition *is* the maintenance of that form by whatever matter realizes it. When we say "the clay is replaced," we refer to the *very same object* under its material-composition description, noting the change in its parts. There's only one thing here: an entity that *can* persist through material change *when* its essential structure (the statue-shape) is preserved. The different ways we talk reflect our interests in its different, real, co-located properties and capacities, not a plurality of objects. The artwork's diachronic identity *supervenes* on the continuous realization of its form by the clay-stuff, however that stuff is replaced.
