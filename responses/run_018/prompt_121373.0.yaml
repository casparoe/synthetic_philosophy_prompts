prompt: |-
  I chair the quarterly continuation review of a public innovation fund. Three times a year, over two days, my committee of five — two engineers, a finance officer, a programme manager and me — decides whether each of roughly a dozen ongoing multi-year projects receives its next tranche. We have about forty minutes per project. The project teams appear in person and lobby hard, and they control most of the numbers we see: cost-to-complete, risk registers, the probability the remaining work delivers. Our recommendations go to a board that almost always accepts them, and the sums at stake in a single decision range from a few hundred thousand to tens of millions.

  I need a written procedure we can actually run in that setting, and I need it to be more discriminating than the textbook instruction to disregard sunk costs. That instruction is right often enough that I teach it to new committee members, but in something like a third of our cases the money already spent seems to carry real information, or to have created a situation in which stopping is genuinely the worse option — and in another third it merely feels that way. Telling those apart, under time pressure, with the project champion in the room, is the job.

  So give me the translation, not the theory: the questions in the order I should ask them, what counts as a sufficient answer to each, the point at which the procedure returns a definite no and we stop discussing, and the points at which it has to hand the decision back to a human being because the remaining question is one about what we care about rather than what is the case. It has to be runnable by people with no philosophy and no time; if a step cannot realistically be completed inside a forty-minute slot, say so and say what to do instead.

  I have two hunches I want you to adopt, correct or discard rather than humour. First: I have been separating reasons for continuing into ones that work at the level of this single project and ones that work only at the level of a standing policy — the partner who will never co-fund with us again if we abandon a demonstrator plant, the signal sent to future applicants about how we behave when costs overrun. My test for the second kind is whether we would want a rule with that content and whether we could publish it in our guidelines without inviting manipulation. I suspect this is also the place where bad arguments hide, since almost any project-specific reason can be redescribed as a policy. Second: I suspect some of our projects have sharply increasing returns to completion — the final tranche is where nearly all the value sits, so that the earlier spend is what makes the remaining spend worth making — and that this thought is doing more work in my reasoning than I can currently defend or bound.

  The procedure must survive three hard cases: the champion whose career is tied to continuation and whose cost-to-complete estimates have already been wrong twice; the project where the only honest reason to continue is that our agency publicly promised a community or partner we would finish; and the project we would continue mainly because cancelling would read as an admission that the earlier decision was wrong.

  Then apply the finished procedure to three sketches of mine. (1) A six-year ecological monitoring network, five years in, 78 per cent of budget spent, whose dataset answers the question it was built for only at year eight, while a cheaper satellite method has since emerged that answers most of that question now. (2) A demonstrator plant at 40 per cent of budget, costs at 2.5 times the original estimate, core technical risk unresolved, with a co-funder who threatens to withdraw from all future programmes if we stop. (3) A project I personally championed six years ago, 90 per cent of budget spent, delivering everything specified in its original charter, whose remaining tranche buys an output no current user wants. At least one of these must come out with an answer I will not want to hear; tell me which, and why you think I will resist it.

  Close by telling me what the procedure cannot do — including which of its steps is most likely to be quietly corrupted by the fact that the champions supply the numbers, that we meet only quarterly, and that we never observe what happened to the projects we killed — and what single finding about our portfolio would most quickly convince you that the procedure should be withdrawn.

  No literature and no citations; I need something my finance officer can run on a Tuesday. Nine hundred words maximum, the numbered procedure first and the applications after it.
reasoning: |-
  Okay, let me tackle this step by step. The user chairs a high-stakes innovation fund review committee that decides whether ongoing projects get their next funding tranche. They need a practical, discriminating procedure that can handle real-world pressures in 40-minute slots—not textbook theory. 

  First, I need to absorb their core challenges: sunk costs aren't always irrelevant (1/3 of cases it carries real info, another 1/3 it's misleading), they need to separate project-specific vs policy-level reasons, and they suspect hidden increasing returns near completion. The procedure must survive three hard cases involving biased champions, political promises, and ego protection, plus handle their three project sketches—with at least one uncomfortable outcome.

  Key constraints: max 900 words, no citations, must work for non-philosophers. The finance officer should execute this on a Tuesday. I'll structure it as numbered steps with clear exit ramps to "human judgment," then apply to their cases. 

  For the procedure itself, I'm thinking: Start by forcing the team to quantify the actual value of remaining work (Step 1) to bypass sunk cost dramatics. Then demand proof they can deliver it (Step 2)—this is where we'll catch optimistic estimates. Step 3 asks "Would we start this today?" to flush out policy excuses. Step 4 is the kill switch: if prior tranches failed to deliver promised value, stop. Only then assess broader policy impacts in Step 5. 

  The hunches: I'll adopt their policy-test (only allow policy arguments they'd publish in guidelines) but discard the increasing returns suspicion—it's usually a sunk cost fallacy in disguise. For the three hard cases: the biased champion gets trapped in Steps 2/4; the political promise only survives if it passes the publishable-policy test; the ego project dies at Step 1 when no user wants the output. 

  Now the sketches: 
  - The monitoring network (Sketch 1) likely dies at Step 1—satellites solve the need now, so remaining spend isn't justified even with 78% sunk. 
  - The bloated demonstrator plant (Sketch 2) might survive only if the co-funder threat passes the policy test (would we publish "we never abandon projects under threat"? Probably not). 
  - Their pet project (Sketch 3) clearly fails Step 1—no user wants the output. They'll resist this because ego.

  Biggest vulnerabilities: Champions controlling numbers (mitigate by demanding evidence for estimates), quarterly meetings (can't adjust mid-quarter—so require monthly milestone reports), and no autopsy on killed projects (suggest sampling 2 dead projects/year for review). If I discovered the portfolio had >50% of projects relying on "policy exceptions," I'd scrap the procedure—it's being gamed.

  Word count is tight—I'll compress explanations and use blunt language. The user wants "translation, not theory," so I'll avoid jargon. Final check: Does this fit finance-officer-on-a-Tuesday usability? Yes—clear yes/no thresholds, minimal paperwork.
answer: |-
  ### Continuation Review Procedure (40-Minute Slot)

  1.  **What *New, Specific Value* Does This Tranche Buy?** (5 mins)
      *   *Ask:* "What measurable outcome, deliverable, or milestone does *this specific tranche payment* achieve? What is its standalone value to our mission/users?"
      *   *Sufficient Answer:* Concrete, quantifiable output (e.g., "completes prototype testing," "delivers validated dataset for Region X," "achieves operational readiness milestone Y"). Vague promises ("progress," "de-risking") are insufficient.
      *   *Stop if No:* If no clear, valuable *new* output is defined for the tranche, recommend **STOP**. (Sunk cost irrelevant if nothing valuable remains.)

  2.  **Can They *Realistically* Deliver That Value With *This* Money & Time?** (15 mins)
      *   *Ask:* "Show evidence your cost-to-complete estimate for *this tranche's scope* is reliable. What specific, unresolved risks could prevent delivery? How will you mitigate them *within this tranche*? Has previous tranche work delivered *its* promised value?"
      *   *Sufficient Answer:* Historical accuracy of *their own* past tranche estimates/cost controls. Independent validation (e.g., external review, proven component tests). Credible, specific mitigation plans for key risks. Proof prior tranche milestones were met.
      *   *Stop if No:* If cost estimate reliability is low (history of >20% variance *without* justification), *or* core technical/execution risks remain unresolved with no credible near-term mitigation, recommend **STOP**. (Avoids throwing good money after bad.)

  3.  **Would We Start *This Specific Project* Today, Knowing What We Know?** (5 mins)
      *   *Ask:* "Ignoring sunk costs and prior commitments: If this project were proposed *today*, with its *current* scope, cost-to-complete, risks, and alternatives (like the satellite), would we fund it?"
      *   *Sufficient Answer:* Requires comparing the project's *remaining* value/cost/risk profile against current priorities and alternatives. Must be justified on standalone project merits.
      *   *Handoff if Tempted to Say No BUT...* If the answer is "No," BUT the champion argues for continuation based on broader consequences (policy, partnerships, reputation), proceed to Step 4. Otherwise, recommend **STOP**.

  4.  **Is the "Policy" Reason *Publishable* and *Manipulation-Proof*?** (10 mins - *Only if Step 3 is "No"*)
      *   *Ask:* "You argue we must continue due to [Partnership Threat/Reputation/Policy]. Would we *formally adopt and publish* a rule stating: 'We will fund projects exceeding budget/offering low value if [specific reason cited]'? Could applicants easily game this rule?"
      *   *Sufficient Answer:* The rule must be specific, justifiable to stakeholders, and demonstrably resistant to manipulation (e.g., "We honor signed, fixed-scope co-funding agreements involving critical national infrastructure partners" is stronger than "We avoid upsetting partners"). Vague reputational fears fail.
      *   *Stop if No:* If the policy argument is unpublishable, easily gamed, or boils down to avoiding embarrassment, recommend **STOP**. (Filters bad-faith policy arguments.)

  5.  **Human Judgment: Does the *Net Benefit* Justify Proceeding?** (5 mins - *If not already Stopped*)
      *   *Ask Committee:* "Weighing the *new* value (Step 1), the *delivery risk* (Step 2), and *any valid policy* reason (Step 4): Is the overall benefit worth the cost and risk of *this tranche*? Does it align with current priorities?"
      *   *Handoff:* This is the committee's judgment call. No fixed rule. **Recommend GO/NO-GO**.

  ---

  ### Application to Sketches

  1.  **Ecological Monitoring (78% spent):**
      *   **Step 1:** *New Value?* Tranche buys data towards Y8 completion (value only at Y8). Satellite answers "most of that question now" - weak new value. **➔ Weak.**
      *   **Step 2:** *Can they deliver?* Likely yes, but value is questionable.
      *   **Step 3:** *Start today?* No. Satellite is cheaper/faster for most needs. **➔ Proceed to Step 4.**
      *   **Step 4:** *Policy Reason?* "Honor long-term data commitment." Publishable rule? "We complete multi-year monitoring even if superseded if dataset uniqueness justifies it." Is Y2 data *unique* vs. satellite? Unlikely. Manipulable? Yes (overstate uniqueness). **➔ STOP.** *You'll resist:* Sunk cost is high (78%), stopping feels wasteful, but the *remaining* spend buys little *new* value vs. alternative.

  2.  **Demonstrator Plant (40% spent, 2.5x cost):**
      *   **Step 1:** *New Value?* Tranche likely funds resolving core tech risk / significant build. High *potential* value if resolved.
      *   **Step 2:** *Can they deliver?* Core tech risk unresolved + history of massive cost overrun (250%) = **Low reliability. STOP.** *Policy (Step 4) bypassed - fails Step 2.* Co-funder threat is irrelevant if they can't deliver anyway. Continuing risks far greater waste.

  3.  **Your Championed Project (90% spent, unwanted output):**
      *   **Step 1:** *New Value?* Tranche buys an output "no current user wants." **➔ No new value. STOP.** *You'll resist:* Sunk cost is extreme (90%), personal stake, desire to "finish." But Step 1 is clear: spend buys valueless output.

  ---

  ### What the Procedure Cannot Do & Failure Signals

  *   **Cannot Do:**
      *   **Fully Verify Champion-Supplied Numbers:** Relies on historical accuracy checks (Step 2) but can't audit in real-time. Mitigation: Demand *evidence* for estimates (test data, quotes) & flag unreliable histories.
      *   **Predict the Future:** Assesses probability, not certainty. Step 2 is the guardrail.
      *   **Eliminate All Bias:** Committee judgment (Step 5) remains. Mitigation: Focus procedure on Steps 1-4 first.
      *   **Fix Quarterly Cadence Issues:** Can't react mid-tranche. Mitigation: Require monthly milestone reports between reviews for early warning.
      *   **Learn from Stopped Projects:** No autopsies. Mitigation: Sample 1-2 stopped projects annually for review.

  *   **Most Vulnerable Step:** **Step 2 (Delivery Risk).** Champions control risk registers/probabilities. Pressure to downplay risks is high. Corruption: Accepting vague mitigations or ignoring poor cost history.

  *   **Withdraw if:** **>50% of "GO" decisions rely solely on Step 4 (Policy Exceptions).** This signals the core project assessment (Steps 1-3) is failing, and the procedure is being gamed to justify poor projects via political/social pressure, invalidating its purpose.
