prompt: |-
  Draft the joint statement of an adversarial collaboration between two camps interpreting T.M. Scanlon’s contractualism in relation to the aggregation problem. Name the parties precisely: Camp A, the Pairwise Baseline Contractualists, who hold that the reasonableness of rejecting a principle is assessed for each affected individual against a baseline that does not include other people’s parallel burdens, so that multiplying small harms across a population never aggregates into justification for imposing a large harm on one; and Camp B, the Structural Interdependence Contractualists, who hold that in institutional and collective-choice contexts the baseline for each person already includes the structural presence of others, so that evaluating whether a principle can be justified to each requires comparing patterns of burden across the affected group, and what looks like aggregation is actually pairwise comparison against interdependent baselines.

  The document should open with a numbered section of agreed claims—shared commitments about what contractualism requires (justification to each, not maximization of aggregate welfare; the role of reasonable rejection; the rejection of pure utilitarian trade-offs; the distinction between harming one to prevent harm to others versus distributing unavoidable burdens). Follow this with a disagreements table: for each remaining dispute, state the precise formulation that Camp A would sign for its own position and the precise formulation that Camp B would sign for its own position, using neutral wording for the framing of each row.

  Then identify the cruxes—sub-questions such that resolving them would move at least one camp. For each crux, specify a concrete case or line of reasoning both camps agree bears on it, and record in advance what each camp predicts or concludes about that case. Include at least these three cruxes: (1) whether the baseline for measuring burden in Scanlon’s formula can include the presence or absence of other burden-bearers without collapsing into utilitarian aggregation; (2) whether an individual’s knowledge that she is one of many similarly situated can enter into what she can reasonably reject, or whether such knowledge is irrelevant to pairwise justification; (3) whether there is a principled distinction between “counting numbers” and “counting structural patterns” in institutional design, and if so, what formal feature distinguishes them.

  For the concrete test case, use the following constructed scenario, which both camps should treat as genuinely bearing on the dispute: the Distributed Archive Protocol, in which a shared institutional system must either preserve 10,000 individually minor but collectively irreplaceable cultural records (each tied to one specific community) at the cost of one researcher’s life-saving project being halted, or preserve the researcher’s project at the cost of all 10,000 records being lost. Both camps should state whether the contractualist can justify the first option to the researcher, whether she can justify the second option to any one record-holder, and whether the multiplicity of record-holders changes what any one of them can reject.

  Conclude the joint statement by indicating, for each disagreement, whether it is substantive or partly verbal—specifically, whether the dispute over “aggregation” dissolves once both sides accept that the structural-interdependence view does not license sacrificing one for the greater good in the utilitarian sense, and whether the pairwise-baseline view can accommodate institutional reasoning without contradiction. Do not include bibliographies, reading lists, citations, or references to specific page numbers. Do not ask the camps to agree on a final verdict; the goal is an exact map of shared ground and precisely located residual disagreement.
reasoning: |-
  We are drafting a joint statement between two camps of Scanlonian contractualists regarding the aggregation problem.

  Camp A: Pairwise Baseline Contractualists
  - They hold that the reasonableness of rejecting a principle is assessed for each affected individual against a baseline that does not include other people's parallel burdens. Thus, multiplying small harms across a population never aggregates into justification for imposing a large harm on one.

  Camp B: Structural Interdependence Contractualists
  - They hold that in institutional and collective-choice contexts, the baseline for each person already includes the structural presence of others. Therefore, evaluating whether a principle can be justified to each requires comparing patterns of burden across the group. What looks like aggregation is actually pairwise comparison against interdependent baselines.

  Structure of the joint statement:

  1. Section 1: Agreed Claims (numbered)
     - Shared commitments about what contractualism requires.

  2. Disagreements Table
     - For each remaining dispute, state:
          - The precise formulation that Camp A would sign for its own position.
          - The precise formulation that Camp B would sign for its own position.
     - Use neutral wording for the framing of each row.

  3. Cruxes
     - Identify sub-questions (cruxes) that, if resolved, would move at least one camp.
     - For each crux:
          - Specify a concrete case or line of reasoning both camps agree bears on it.
          - Record what each camp predicts or concludes about that case.
     - Include at least these three cruxes:
          (1) Whether the baseline for measuring burden can include the presence or absence of other burden-bearers without collapsing into utilitarian aggregation.
          (2) Whether an individual's knowledge that she is one of many similarly situated can enter into what she can reasonably reject, or whether such knowledge is irrelevant to pairwise justification.
          (3) Whether there is a principled distinction between "counting numbers" and "counting structural patterns" in institutional design, and what formal feature distinguishes them.

     - Use the concrete test case: the Distributed Archive Protocol.

  4. Conclusion
     - For each disagreement, indicate whether it is substantive or partly verbal.
     - Specifically address:
          - Whether the dispute over "aggregation" dissolves once both sides accept that the structural-interdependence view does not license sacrificing one for the greater good in the utilitarian sense.
          - Whether the pairwise-baseline view can accommodate institutional reasoning without contradiction.

  Let's begin.

  ---

  **Joint Statement on the Interpretation of Scanlon’s Contractualism Regarding Aggregation**

  **Section 1: Agreed Claims**

  The undersigned parties, Camp A (Pairwise Baseline Contractualists) and Camp B (Structural Interdependence Contractualists), affirm the following shared commitments regarding T.M. Scanlon’s contractualism:

  1. Contractualism requires that a principle be justifiable to each person affected by it. The central idea is that an act is wrong if it would be disallowed by any set of principles for the general regulation of behavior that no one could reasonably reject as a basis for informed, unforced general agreement.

  2. The standard for reasonable rejection is not equivalent to maximizing aggregate welfare. Contractualism is fundamentally non-aggregative in the utilitarian sense.

  3. An individual’s reasonable rejection of a principle depends on the burdens that the principle would impose on them relative to alternative principles. The assessment of burden must be made from the standpoint of the individual.

  4. Contractualism prohibits purely utilitarian trade-offs, such as sacrificing one individual to save a greater number if the sacrifice involves a grave harm to that individual and the principle permitting such sacrifice would be reasonably rejectable by that individual.

  5. There is a distinction between:
     a. Cases where a principle involves harming one person to prevent harm to others (which is generally prohibited by contractualism unless the harm to the one is minor and the harm to the others is major and numerous, but without aggregating the minor harms in a way that overrides the prohibition against severe harm).
     b. Cases where a principle involves the distribution of unavoidable burdens (where the focus is on ensuring that the distribution does not place unreasonable burdens on any individual).

  **Section 2: Disagreements Table**

  The parties disagree on the following points, and each camp endorses the respective formulation below as its own position:

  | Dispute Description | Camp A (Pairwise Baseline) Position | Camp B (Structural Interdependence) Position |
  |---------------------|--------------------------------------|-----------------------------------------------|
  | **The baseline for measuring burdens in pairwise justification** | In assessing whether a burden imposed on an individual by a principle is reasonable, the baseline for comparison is a state of affairs that does not include the burdens of other individuals as a factor in the individual's own burden assessment. The presence or absence of other burden-bearers is irrelevant to the pairwise comparison between the principle and the baseline for that individual. | In institutional and collective-choice contexts, the baseline for an individual already includes the structural fact that they are part of a group facing a collective problem. Therefore, the burden on an individual is measured relative to a baseline that incorporates the interdependence of burdens across the group, and the reasonableness of rejection depends on the pattern of burdens that would result. |
  | **The role of multiplicity in reasonable rejection** | The fact that an individual is one of many similarly situated individuals does not affect what that individual can reasonably reject. The individual's claim is assessed solely by the magnitude of the burden they bear, without reference to the number of others who bear similar burdens. | In contexts of collective action, an individual's reasonable rejection must take into account that they are part of a group facing a shared problem. The knowledge that one is one of many similarly situated can affect what it is reasonable to reject because the alternative principles may distribute burdens in a way that is structurally interdependent. |
  | **The permissibility of what appears as aggregation** | Multiplying small harms across a large population never aggregates into a total burden that can justify imposing a large harm on a single individual. A principle that imposes a large harm on one to prevent many small harms to others can be reasonably rejected by the one. | What appears as aggregation is not the summing of welfare but the recognition of a structural pattern in which the baseline of each individual is interdependent. In such patterns, a principle that prevents many small harms by imposing a large harm on one may sometimes be justifiable to each, including the one, if the alternative would impose an unreasonable pattern of burdens on the group. |

  **Section 3: Cruxes**

  Both parties agree that the following sub-questions (cruxes) are central to the dispute and that resolving them would move at least one camp. For each crux, we provide a concrete case or line of reasoning and record each camp's prediction or conclusion.

  **Crux 1: Baselines and Utilitarian Collapse**

  *Question*: Whether the baseline for measuring burden in Scanlon’s formula can include the presence or absence of other burden-bearers without collapsing into utilitarian aggregation.

  *Concrete Case: The Distributed Archive Protocol*
  - *Scenario*: A shared institutional system must choose between:
     - Option 1: Preserving 10,000 individually minor but collectively irreplaceable cultural records (each tied to one specific community) at the cost of one researcher’s life-saving project being halted (a large harm to the researcher).
     - Option 2: Preserving the researcher’s project at the cost of all 10,000 records being lost (a small harm to each record-holder, but the loss of each record is a minor harm to one community).

  *Camp A Prediction*:
  - The contractualist can justify Option 1 to the researcher? **No**, because the researcher suffers a large harm (loss of a life-saving project) and the baseline for the researcher does not include the existence of the 10,000 record-holders. The researcher can reasonably reject a principle that imposes such a large harm on them to prevent many small harms to others, since the small harms do not aggregate to create a burden that can override the researcher's claim.
  - The contractualist can justify Option 2 to any one record-holder? **Yes**, because the harm to any one record-holder (loss of one record) is minor, and the record-holder cannot reasonably reject a principle that imposes such a minor burden on them to prevent a large harm to the researcher (by saving the researcher's project). However, note: Option 2 leads to the loss of all records, but from the perspective of one record-holder, the principle allows the loss of their record to prevent a large harm to the researcher. But Camp A must also consider that the same principle leads to the loss of every record. However, in pairwise comparison, the burden on one record-holder is minor, so they cannot reasonably reject a principle that imposes a minor burden to prevent a large harm to the researcher. But wait: the principle in Option 2 is not about one record but about all 10,000. Camp A would say: for any one record-holder, the principle they are evaluating is one that allows the loss of their record in order to save the researcher's project. Since the loss of their record is minor, and the saving of the researcher is a large benefit (or preventing a large harm to the researcher), then the record-holder cannot reasonably reject this principle. The fact that 9,999 others also lose their records does not change the pairwise burden for this record-holder. Therefore, Option 2 is justifiable to each record-holder. However, the researcher would also be affected by Option 2? Actually, in Option 2 the researcher's project is saved, so the researcher is not burdened. So Option 2 is justifiable to the researcher and to each record-holder? But then why would we ever choose Option 1? Camp A must hold that Option 2 is justifiable and Option 1 is not. But note: Option 1 imposes a large harm on the researcher to save the records. The researcher can reject Option 1. Therefore, Option 2 is the only one that is not reasonably rejectable.

  *Camp B Prediction*:
  - The contractualist can justify Option 1 to the researcher? **Yes**, under the structural interdependence view. The baseline for the researcher includes the fact that they are part of an institutional system that must preserve cultural records. The loss of 10,000 records is a structural catastrophe for the cultural system, and the burden on the researcher (while large) is not unreasonable when compared to the alternative pattern of burden (the loss of all records). The researcher cannot reasonably reject Option 1 because the alternative (Option 2) would impose a pattern of burdens that is worse for the group as a whole and for each record-holder in the interdependent baseline. However, note that the burden on the researcher is large. But Camp B would argue that in the structural context, the researcher's burden is not unreasonable when the alternative is the collapse of the entire archive. Moreover, the researcher is part of the same institution that benefits from the archive, so the baseline includes the researcher's role in the institution.
  - The contractualist can justify Option 2 to any one record-holder? **No**. For one record-holder, the loss of their record is a minor harm. However, the baseline for each record-holder includes the structural fact that the archive is a shared resource and that the loss of one record would not by itself cause the loss of the others. But in Option 2, the principle leads to the loss of all records. Therefore, the burden on an individual record-holder is not just the loss of their own record but the participation in a pattern that leads to the loss of the entire archive. This pattern is unreasonable because it destroys the collective good. Thus, each record-holder can reasonably reject Option 2 because it imposes an unreasonable pattern of burden.

  *Summary for Crux 1*:
  - Camp A concludes: Option 1 is reasonably rejectable by the researcher; Option 2 is not reasonably rejectable by any record-holder and is justifiable.
  - Camp B concludes: Option 1 is not reasonably rejectable by the researcher (so it is justifiable to the researcher) and Option 2 is reasonably rejectable by each record-holder.

  **Crux 2: The Role of Knowledge of Multiplicity**

  *Question*: Whether an individual’s knowledge that she is one of many similarly situated can enter into what she can reasonably reject, or whether such knowledge is irrelevant to pairwise justification.

  *Concrete Case: The Distributed Archive Protocol* (same as above)

  *Camp A Prediction*:
  - The multiplicity of record-holders does not change what any one of them can reasonably reject. For an individual record-holder, the burden is the loss of their own record, which is minor. The knowledge that there are 9,999 others in the same situation does not make their burden heavier. Therefore, they cannot reasonably reject a principle that imposes this minor burden to prevent a large harm to the researcher (in Option 2). Similarly, for the researcher, the burden is the loss of their project, which is large, and the fact that this loss prevents 10,000 minor harms does not reduce the burden. The knowledge of the multiplicity does not change the pairwise burden.

  *Camp B Prediction*:
  - The multiplicity of record-holders is essential to what each can reasonably reject. Each record-holder, knowing that they are one of many, must consider the structural role of the principle. In Option 2, the principle leads to the loss of the entire archive, which is a collective disaster. Therefore, even though the burden on one record-holder is minor, the knowledge that the same minor burden is imposed on all, leading to the total loss, makes the burden unreasonable to each. Each can reasonably reject a principle that, when generalized, leads to such a pattern.

  **Crux 3: Counting Numbers vs. Structural Patterns**

  *Question*: Whether there is a principled distinction between "counting numbers" and "counting structural patterns" in institutional design, and if so, what formal feature distinguishes them.

  *Concrete Case: The Distributed Archive Protocol* (same as above)

  *Camp A Position*:
  - There is no principled distinction that allows counting structural patterns without collapsing into counting numbers. Any appeal to patterns is a covert form of aggregation. The formal feature that distinguishes permissible from impermissible reasoning is the pairwise comparison of individual burdens without reference to the number of others. In the Archive case, the only relevant burdens are the researcher's large harm and the minor harm to each record-holder. The pattern of 10,000 minor harms is not a distinct burden.

  *Camp B Position*:
  - There is a principled distinction. Counting numbers sums individual burdens, while counting structural patterns evaluates the overall shape of the distribution of burdens in a way that affects each individual's baseline. The formal feature is the interdependence of the baseline: each individual's baseline is defined by the institutional structure, and a pattern that undermines the structure (like the total loss of the archive) creates a burden that is not reducible to the sum of individual burdens. In the Archive case, the loss of the entire archive is a structural burden that each record-holder faces in their baseline, so it is not about the number 10,000 but about the collapse of the system.

  **Section 4: Conclusion on the Nature of Disagreements**

  The parties offer the following assessments of whether the disagreements are substantive or partly verbal:

  1. **Disagreement on the baseline for measuring burdens**:
     - Camp A holds that the dispute is substantive: the structural interdependence view does collapse into aggregation because it allows the number of people affected to determine the reasonableness of rejection in a way that overrides the prohibition against severe harm.
     - Camp B holds that the dispute is substantive: the pairwise baseline view fails to account for the structural features of institutional contexts and thus cannot handle collective action problems without contradiction.

     However, both camps agree that the dispute over "aggregation" does not dissolve even after acknowledging that the structural-interdependence view does not license utilitarian sacrifice. Camp B maintains that its view does not endorse maximizing the aggregate but rather evaluates patterns of burden in an interdependent system. Camp A remains unconvinced that this is distinct from aggregation.

  2. **Disagreement on the role of multiplicity**:
     - Both camps agree that this is a substantive disagreement. Camp A sees the knowledge of multiplicity as irrelevant, while Camp B sees it as essential in institutional contexts.

  3. **Disagreement on the permissibility of what appears as aggregation**:
     - This is the core substantive disagreement. Camp A denies that multiplying small harms can ever justify a large harm, while Camp B allows it in some cases of structural interdependence without aggregating in the utilitarian sense.

  Regarding the possibility of accommodation:

  - Camp B contends that the pairwise-baseline view cannot accommodate institutional reasoning without contradiction because it ignores the structural interdependence inherent in institutions.
  - Camp A contends that the structural-interdependence view cannot avoid collapsing into aggregation and thus betrays the core contractualist commitment to pairwise justification.

  The parties agree that the above accurately maps their shared ground and residual disagreements.

  Signed,

  Camp A: Pairwise Baseline Contractualists  
  Camp B: Structural Interdependence Contractualists
answer: |-
  **Joint Statement on Scanlon’s Contractualism and the Aggregation Problem**  
  *Between Camp A (Pairwise Baseline Contractualists) and Camp B (Structural Interdependence Contractualists)*  

  ### Section 1: Agreed Claims  
  The parties affirm the following shared commitments regarding T.M. Scanlon’s contractualism:  
  1. Contractualism requires that principles be justifiable to each affected person; justification is not reducible to maximizing aggregate welfare.  
  2. A principle is reasonably rejectable if it imposes a burden on an individual that is significant relative to alternatives, and no individual may be sacrificed solely for aggregate gains.  
  3. Reasonable rejection assesses burdens pairwise (i.e., from each individual’s standpoint), not via interpersonal aggregation of welfare.  
  4. Contractualism prohibits "utilitarian trade-offs": imposing a grave harm on one to prevent smaller harms to many cannot be justified by summing the smaller harms.  
  5. A distinction exists between:  
     - (a) Harming one to benefit others (generally impermissible under contractualism unless burdens are comparable).  
     - (b) Distributing unavoidable burdens (permissible if no individual bears an unreasonable share).  

  ---

  ### Section 2: Disagreements Table  
  | **Dispute Description**                                                                                                | **Camp A Position (Pairwise Baseline)**                                                                                                                                 | **Camp B Position (Structural Interdependence)**                                                                                                                                 |  
  |------------------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|  
  | **The baseline for measuring individual burdens**                                                                      | The baseline for assessing burdens to an individual must exclude the presence or burdens of others; it is defined solely by the individual’s standalone situation.       | The baseline for assessing burdens inherently includes structural interdependencies in institutional contexts; it reflects the individual’s embeddedness in a collective system. |  
  | **The role of population size in reasonable rejection**                                                                | The number of individuals facing similar burdens is irrelevant to whether any one individual can reasonably reject a principle.                                           | The number of individuals facing similar burdens can affect reasonable rejection, as it shapes the structural pattern of burdens within the baseline.                             |  
  | **The permissibility of preventing many small harms by imposing a large harm**                                         | A principle imposing a large harm on one to prevent small harms to many is always reasonably rejectable by the one, regardless of the number of small harms prevented.   | A principle imposing a large harm on one to prevent many small harms may not be reasonably rejectable if the baseline’s structural interdependence makes the pattern of burdens unsustainable. |  

  ---

  ### Section 3: Cruxes  
  **Crux 1: Baselines and Utilitarian Collapse**  
  *Question*: Can the baseline include the presence/absence of other burden-bearers without collapsing into utilitarian aggregation?  
  *Concrete Case: Distributed Archive Protocol*  
  - *Scenario*: An institution must choose:  
    - *Option 1*: Halt one researcher’s life-saving project (large harm to one) to preserve 10,000 minor cultural records (each tied to one community; loss is a small harm per record-holder).  
    - *Option 2*: Save the researcher’s project (no harm to researcher) but lose all 10,000 records (small harm to each record-holder).  
  - *Camp A Prediction*:  
    - Option 1 is reasonably rejectable by the researcher (large harm unjustifiable by non-aggregated small harms).  
    - Option 2 is **not** reasonably rejectable by any single record-holder (small harm to them is minor vs. saving a life). Multiplicity does not change rejectability.  
  - *Camp B Prediction*:  
    - Option 1 is **not** reasonably rejectable by the researcher (the baseline includes institutional interdependence; losing all records is a structural catastrophe).  
    - Option 2 is reasonably rejectable by each record-holder (the baseline includes collective preservation; losing all records imposes an unsustainable pattern). Multiplicity defines the structural burden.  

  **Crux 2: Knowledge of Multiplicity in Reasonable Rejection**  
  *Question*: Can an individual’s knowledge that they are one of many similarly situated affect reasonable rejection?  
  *Concrete Case: Distributed Archive Protocol*  
  - *Camp A Prediction*:  
    - Knowledge of multiplicity is irrelevant. A record-holder’s burden is measured solely by their loss; they cannot invoke the losses of others to strengthen their rejection.  
  - *Camp B Prediction*:  
    - Knowledge of multiplicity is relevant. A record-holder can reasonably reject Option 2 *because* they know the loss of all records (including theirs) collapses a shared system.  

  **Crux 3: Numbers vs. Structural Patterns**  
  *Question*: Is there a principled distinction between "counting numbers" and "counting structural patterns," and what formal feature distinguishes them?  
  *Concrete Case: Distributed Archive Protocol*  
  - *Camp A Position*:  
    - No distinction exists; "structural patterns" covertly aggregate numbers. The formal feature is individual burden magnitude. Here, 10,000 minor harms are 10,000 separate burdens, never combining to outweigh a large harm.  
  - *Camp B Position*:  
    - A distinction exists; "structural patterns" evaluate system-wide sustainability, not summed burdens. The formal feature is *emergent institutional fragility* (e.g., total archive loss destroys a shared resource, altering each individual’s baseline).  

  ---

  ### Section 4: Conclusion on Disagreement Status  
  1. **Baseline definition**:  
     - *Substantive disagreement*. The dispute does not dissolve even if Camp B disavows utilitarian aggregation. Camp A holds that Camp B’s "interdependent baseline" implicitly aggregates burdens; Camp B holds their view is structurally distinct.  

  2. **Role of multiplicity**:  
     - *Substantive disagreement*. Camp A insists knowledge of numbers is irrelevant to pairwise justification; Camp B argues it is essential for institutional reasoning.  

  3. **Accommodating institutional reasoning**:  
     - Camp A’s pairwise view *cannot fully accommodate* institutional reasoning without contradiction, as it requires ignoring structural interdependencies.  
     - Camp B’s structural view *can avoid utilitarian sacrifice* by tying permissibility to baseline patterns, not summed welfare.  

  Signed,  
  *Camp A: Pairwise Baseline Contractualists*  
  *Camp B: Structural Interdependence Contractualists*
