  **Joint Statement: Ulysses Contracts & the Revocable Lockbox Test Case**

  **Camp A (Hard Precommitment Advocate) & Camp B (Continuity Skeptic)**

  **Agreed Foundational Claims:**
  1.  **Structural Time-Inconsistency Exists:** Individuals and collectives often face predictable conflicts between preferences held at different times (e.g., calm-state vs. craving-state; long-term planning vs. short-term electoral pressures).
  2.  **Preference Revision is Normal:** Values and preferences can genuinely shift over time through reflection, new information, or personal development. Distinguishing *impulsive* reversal from *genuine* revision is crucial but difficult.
  3.  **Precommitment Requires Constraint:** Any effective precommitment device must impose *some* cost or friction on reversing the prior commitment; purely costless "commitments" are indistinguishable from ordinary preferences.
  4.  **The Lockbox Mechanism:** The "revocable lockbox" test case involves: (a) A self-binding rule restricting future action. (b) A designated escape hatch revocable *only* after (i) a mandatory 72-hour waiting period and (ii) a formal, notarized declaration affirming a genuine, values-based shift justifying revocation.
  5.  **Formal Distinction:** The lockbox *adds significant procedural friction* to revocation. It does *not* make revocation logically or physically impossible ("removing options" in the absolute sense).

  **Disagreements Table:**

  | Issue                                      | Camp A (Hard Precommitment) View                                                                 | Camp B (Continuity Skeptic) View                                                                 |
  | :----------------------------------------- | :----------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------- |
  | **Nature of Binding**                      | Binding future selves is an exercise of rational agency across time, enabling long-term goals.   | Binding a future self either constrains a different agent (if changed) or coercively restricts the same agent (if unchanged). |
  | **Legitimacy of Entrenchment**             | Constitutional entrenchment is essential to solve collective time-inconsistency; present majorities legitimately bind future ones to core principles/procedures. | Democratic legitimacy requires present consent; past majorities cannot legitimately "trap" present ones. "Dead-hand control" is undemocratic. |
  | **Purpose of Removing Options**            | The *core function* of a Ulysses contract is to eliminate tempting but destructive choices *in the moment of weakness*; taking options off the table is the point. | Adding friction is acceptable only if it supports reflection; *removing options* is inherently coercive or paternalistic, violating autonomy. |
  | **The Lockbox's Effect**                   | The lockbox preserves the Ulysses function: 72hrs + declaration is sufficient friction to block impulsive reversal while allowing genuine revision. | The lockbox collapses the Ulysses idea: It's just slow-motion preference revision. The "protection" is weak/illusory against strong impulses. |
  | **Autonomy Requirement**                   | Autonomy is exercised *in the commitment act*. Future autonomy isn't violated by self-imposed, revocable (with friction) constraints designed to protect agency. | Autonomy requires the *on-going practical ability* to revoke constraints *in real-time*. Significant friction violates this requirement. |

  **Cruxes:**

  1.  **Crux 1: Does Autonomy Require Real-Time Revocability?**
      *   **Camp A:** No. Autonomy is expressed in the initial sovereign choice to bind oneself. Preventing impulsive self-sabotage *enhances* agency over time. Revocability with meaningful friction preserves the ability for genuine change.
      *   **Camp B:** Yes. True autonomy means the present self must retain the *effective power* to change course *when it decides to*, not just after a delay. Significant friction constitutes coercion by the past self.

      **Concrete Case (Gambling Relapse):** Sarah, a recovering gambler, signs a lockbox contract barring her from casinos/online sites. Months later, during severe stress, she feels an overwhelming urge to gamble. She immediately tries to revoke the contract. The lockbox forces her to wait 72 hours and get a notarized statement affirming her values have changed regarding gambling.
      *   **Camp A Prediction:** The 72hr delay allows the intense craving to subside. Sarah either doesn't file the revocation after cooling off, or files it *only* if she has genuinely decided gambling is now acceptable. The lockbox worked.
      *   **Camp B Prediction:** The craving persists throughout the 72hrs. Sarah endures agonizing distress, files the revocation the moment she can, and gambles. The lockbox merely delayed her inevitable action and caused unnecessary suffering without protecting her from relapse. It violated her autonomy during the crisis.

  2.  **Crux 2: Does the Lockbox Preserve Protection or Just Slow Down Change?**
      *   **Camp A:** It preserves core protection. The friction is calibrated to block impulsive reversal (which happens quickly) while allowing deliberate, values-based revision (which requires reflection time). It *saves* the Ulysses concept by making it practical and revocation-trackable.
      *   **Camp B:** It collapses into ordinary change. The 72hrs is arbitrary and ineffective against strong impulses that last days. The declaration is performative/meaningless under duress. It only slows down the process of preference change/reversal, failing to provide the "binding" force essential to a true Ulysses contract. It’s just a slightly stickier preference.

      **Concrete Case (Diet Commitment):** Ben commits via lockbox to a strict diet/no junk food. At a party surrounded by friends eating pizza, he desperately wants some. He tries to revoke.
      *   **Camp A Prediction:** The 72hr delay forces Ben to leave the party without pizza. By the next day, the temptation has passed significantly; he likely doesn't follow through on revocation. The lockbox protected him from an impulsive lapse.
      *   **Camp B Prediction:** Ben suffers intense craving and frustration at the party, leaves resentful, and spends the next 72hrs fixated on pizza. He files the revocation immediately when possible and eats pizza. The lockbox didn't change the outcome, only delayed it and made Ben miserable. It didn't offer real protection, just friction.

