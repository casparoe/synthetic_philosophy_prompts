  Let me break this down systematically. First, we need to separate the two presentisms: moral (bad) vs. conceptual (unavoidable). Like how using "economics" for medieval grain markets isn't the same as condemning feudalism. But the user's right - the line gets blurry. Take "identity work": applying it to Roman emperor worship might reveal genuine functions, but if we imply Romans had a modern concept of identity, that's distortive.

