prompt: |-
  hey can you explain the conceptual knot in presentism? historians warn against judging past societies by our ethics, but they still use modern catergories—say, calling an ancient ceremony political legitimation or identity work. is that still presentist, or is there a real line between importing our concepts and importing our values? feels like the two bleed together in practise and i cant tell where one ends.
