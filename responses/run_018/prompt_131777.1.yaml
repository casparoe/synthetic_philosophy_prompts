  ### **Practical Rationality Workshop: Escalation Auction Game**  
  **Total Duration:** 90 minutes (30-minute game, 60-minute debrief)  
  **Participants:** 14 advanced philosophy students (7 pairs)  

  ---

  #### **1. Rules, Materials, and Setup**  
  **Materials:**  
  - 14 index cards (one per player)  
  - 14 pens  
  - 7 pairs of bidding tokens: Green ("BID") and Red ("WITHDRAW") cards for each player  
  - 21 profile slips (7 slips × 3 profiles: *Instrumentalist*, *Identity-Consistent*, *Rule-Follower*)  
  - Whiteboard to track bids and display rules  
  - Timer  

  **Room Setup:**  
  - Arrange 7 tables with two chairs each (one pair per table).  
  - Place one index card, one pen, and one set of bidding tokens (green/red cards) at each seat.  
  - Profile slips are shuffled and drawn blindly by participants before the game.  

  **Rules:**  
  - **Prize:** 10 points (fixed value).  
  - **Bidding:**  
    - Bids start at 1 point and escalate by 1 point per round (e.g., Round 1: 1 point, Round 2: 2 points).  
    - Each round, players simultaneously reveal a green ("BID") or red ("WITHDRAW") token.  
    - If both withdraw in the same round, the auction ends with no winner.  
    - If one bids and the other withdraws, the bidder wins the prize (10 points minus their final bid). The withdrawer pays their last bid and receives nothing.  
    - If both bid, the auction advances to the next round.  
    - Game ends after 12 rounds or when both withdraw.  
  - **Profiles and Justifications:**  
    - Before Round 1, each player draws a secret profile slip.  
    - **Instrumentalist:** Justify bids solely by expected point yield (e.g., *"Bid 4: Winning nets +6 points, which outweighs the risk."*).  
    - **Identity-Consistent:** Justify bids solely by coherence with prior moves (e.g., *"Bid 5: I must honor my commitment to win after bidding 4."*).  
    - **Rule-Follower:** In Round 1, announce a stopping threshold aloud (e.g., *"I will quit at 6"*). Justify bids by adherence to this rule (e.g., *"Bid 3: 3 < 6, so I follow my rule."*).  
    - **Profile Switching:**  
      - A player may switch profiles at any time by tearing up their current index card in front of their partner.  
      - Switching costs 3 points (deducted from final score).  
      - They start a new card with their new profile.  
  - **Emotional Weight Mechanism:**  
    - Index cards must be visible to the opponent at all times.  
    - Players write one-sentence rationales on their card *before* revealing their bid/withdraw token each round.  
    - Tearing up a card (switching profiles) is a public act—forcing players to confront the social cost of admitting inconsistency.  

  ---

  #### **2. Point/Payoff Scheme & Emotional Stakes**  
  **Payoffs:**  
  - **Winner:** 10 points - final bid - switching costs (if any).  
  - **Loser:** 0 points - last bid - switching costs (if any).  
  - **Both withdraw:** Both pay last bid (if they bid previously) + switching costs.  

  **Emotional Stakes Without Real Money:**  
  - Points feed into a **low-stakes course ranking system** (e.g., top 3 scorers get a symbolic prize: bookstore gift card or public recognition).  
  - **Key Psychological Levers:**  
    - Public rationales and card-tearing create social pressure (e.g., embarrassment at admitting irrationality).  
    - Score visibility on the whiteboard fosters competition ("losing stings" even without cash).  
    - Profile constraints force players into self-justification traps mirroring real-world identity defense.  

  ---

  #### **3. Timeline**  
  **Game Phase (30 minutes):**  
  - **0–5 min:** Setup. Distribute materials, draw profiles, explain rules.  
  - **5–25 min:** Auction. Run 12 rounds (60 seconds/round). Facilitator calls "Reveal tokens!" and "Record rationale!" each round.  
  - **25–30 min:** Calculate scores. Players report outcomes to facilitator; scores displayed anonymously (e.g., "Pair 3: Player A: +2, Player B: -7").  

  **Debrief Phase (60 minutes):**  
  - **30–45 min:** **Experience Sharing.** Pairs report: max bid, "trap moments," vivid rationales.  
  - **45–55 min:** **Mechanics Analysis.** Map game moments to sunk costs/identity tension.  
  - **55–60 min:** **Limitations Discussion.** Address gaps between game/reality.  
  - **60–90 min:** **Open Dialogue.** Connect to practical rationality, ethics, and real-world cases.  

  ---

  #### **4. Debrief Mapped to Game Moments**  
  **Debrief Script (Facilitator Guides Discussion):**  
  > **"When bids exceeded half the prize value (Round 5–6):**  
  > - *Mechanics:* At bid=5, winning nets only +5 points—yet players continued. Why? Sunk costs distorted local rationality (e.g., *'I’ve already spent 4 points—I must win to break even'*).  
  > - *Philosophical Tension:* Instrumentalists faced cognitive dissonance (bid=6 yields +4 points, but risk of loss increases). Identity-Consistent players doubled down (*'Quitting now wastes my past bids'*)."  

  > **"When non-verbal cues (glaring/silence) replaced calculation:**  
  > - *Mechanics:* Around bid=8–9, partners stopped calculating and reacted emotionally. The card’s visibility turned justification into a social contract—*betraying* it felt like losing face.  
  > - *Philosophical Tension:* Rule-Followers who quit at their threshold avoided losses but faced 'weakness' stigma. Identity-Consistent players interpreted silence as defiance, escalating to defend their narrative."  

  > **"When a player considered tearing their card but bid instead:**  
  > - *Mechanics:* Switching profiles cost 3 points + public shame. Bidding felt cheaper than admitting irrationality—even as global losses mounted.  
  > - *Philosophical Tension:* Instrumentalists who tore cards 'solved' the trap but paid an identity tax. Rule-Followers who bid past thresholds betrayed their rules to avoid being 'inconsistent'."  

  ---

  #### **5. Predictable Problems & Corrections**  
  **Problem 1: Pairs quit early (e.g., Round 3) to avoid conflict.**  
  - *Correction:* In setup, say: *"This is a lab for experiencing escalation—push to at least Round 5 even if uncomfortable. Withdrawing early robs you of the core lesson."*  

  **Problem 2: One partner refuses to bid aggressively.**  
  - *Correction:* Assign profiles randomly but firmly. Remind players: *"Your profile demands certain reasoning—e.g., Identity-Consistent must defend prior bids even if you personally dislike it."*  

  **Problem 3: Profiles feel arbitrary.**  
  - *Correction:* Post-game, clarify: *"Profiles simulate how real people adopt reasoning styles—e.g., an investor becomes Identity-Consistent after public promises, or a doctor follows Rule-Follower protocols."*  

  ---

  #### **6. Limitations & Mitigation in Debrief**  
  **Limitation:** *Assigned profiles lack authentic adoption; players know it’s a "role."*  
  - **Mitigation:** Discuss: *"In life, we grow into identities (e.g., 'I’m a fighter'). Here, profiles jump-start that—but real escalation traps deepen when identities feel self-chosen."*  

  **Limitation:** *No real financial ruin; stakes are symbolic.*  
  - **Mitigation:** Contrast: *"A $10M corporate bid feels different, but the psychology is identical. Imagine bid=50 representing your life savings—the trap tightens when stakes are irreversible."*  

  **Limitation:** *Social pressure is simulated (tearing a card ≠ losing a career).*  
  - **Mitigation:** Highlight: *"Tearing a card mimics the shame of real-world backtracking (e.g., a politician U-turn). But in life, the audience is larger and consequences graver."*  

  ---

  ### **Final Note for Facilitator**  
  **Run it tomorrow:**  
  - Emphasize that the game’s power lies in *what the rules make players do*, not your explanation.  
  - During debrief, cold-call pairs to share raw moments (e.g., *"Player 4, you glared at bid=9—what did that silence mean?"*).  
  - The escalation trap will emerge organically when bids hit 7+ and players realize they’re bidding *not for the prize, but to avoid the shame of quitting*.  

  **Output:** Players will viscerally feel the trap—not just understand it—and debate rationality/identity tensions with newfound clarity.
