prompt: |-
  Hey — I'm on my university's Commemorative Naming Committee (we got one after the last round of protests) and I've got to circulate a decision memo before Thursday and I could use a draft I can hack at.

  The case: Vance Hall, our main lecture building, named in 1962 for Alton P. Vance, a donor and thirty-year trustee. The same guy spent about two decades on a state eugenics board and signed off on several hundred sterilizations of people committed to state institutions, and he wrote pretty openly about it in letters we now have. The original gift agreement has a reversion clause: if the university takes the name off, the corpus goes back to the Vance family — roughly the chunk of the endowment that currently pays for about six full scholarships a year for first-gen students from the surrounding county. So the money that funds the students with the strongest claim to have been harmed by the other part of his life is exactly the money we forfeit by removing his name. There's also a family lawyer who has hinted they'd contest any removal as a breach, and the student government has passed a resolution demanding removal by the end of the term. Committee is split down the middle.

  The part I keep going round on: a campus survey last spring found under 5% of students could identify who Vance was; most thought the building was named for the county or for a similarly named donor, and for years the directory and the bus-stop signs have listed it as just "Vance Hall," with nothing anywhere on or in the building saying who Vance was. So the name has partly come loose from the man — for nearly everyone who says it, it just means "the building with the big lecture theatre." That makes me unsure whether taking it off is the speech act people think it is: are we withdrawing an honor, or just relabeling a word nobody reads as a name? And by the same token, if we put a new honoree up there, does that carry the content we'd want it to, or are we just swapping labels?

  The live options as I see them: strip the name and eat the reversion; keep it and install a permanent counter-commemoration (the family says they'd waive the reversion if the name stays and a substantial installation goes in — which I find a bit repulsive, honestly); rename to something non-commemorative, like a place or a number; or formally redesignate the existing name as memorial rather than honorific and say so in one sentence on the facade.

  What I want: a memo for the committee with the recommendation in the first sentence, then the reasoning, then a short honest paragraph on the strongest thing on the side you're voting against — I want something the losing half can live with. Include the concrete next step and a timeline, and say explicitly what the recommendation costs us. Don't spend words on general theory of commemoration or rehash "we shouldn't erase history" vs "names honor people"; assume we've read the op-eds. Hard cap 550 words.
reasoning: |-
  Okay, let me unpack this user's request. They're on a university naming committee facing a high-stakes decision about Vance Hall, with a tight deadline and complex ethical/financial implications. 

  First, the core tension: removing the name honors victims but eliminates scholarships for those same communities, while keeping it feels morally compromising. The user's framing suggests they've moved past abstract debates and need actionable solutions that acknowledge trade-offs. 

  Notable nuances:
  - The name's practical dissociation from the donor ("just a building label") undermines both the harm and honor arguments
  - The family's offer to allow counter-commemoration if name stays feels ethically fraught
  - Student government demands conflict with first-gen scholarship consequences
  - Committee polarization requires a solution the losing side can tolerate

  The user's memo specifications reveal their priorities: decisiveness (recommendation first), transparency (acknowledge counterarguments), and concrete next steps. The 550-word cap signals real-world usability concerns.

  Key insights driving my approach:
  1) Renaming feels performative when the name has lost its commemorative meaning anyway
  2) Scholarship loss directly harms the community Vance victimized
  3) The "memorial" reframing turns the name into an educational tool rather than honor
  4) Permanent counter-commemoration must be substantive, not tokenistic, to justify keeping the name

  The timeline pressure means the solution must be implementable by semester's end. The family's waiver offer becomes leverage - we can demand meaningful reparative measures in exchange for keeping the name. 

  Most importantly, the response must model the balanced deliberation the user wants from their committee: naming the painful trade-offs while choosing the least harmful path. The "strongest counterargument" section is crucial for maintaining committee cohesion.
answer: |-
  **MEMORANDUM**  
  To: Commemorative Naming Committee  
  From: [Your Name/Title]  
  Date: [Date]  
  Subject: Recommendation for Vance Hall Naming Action  

  **Recommendation:** Retain the name "Vance Hall" but formally redesignate it as a *memorial* (not an honor) and install a permanent, prominent counter-commemoration detailing Alton P. Vance’s role in eugenics, with a binding agreement ensuring the Vance family waives the reversion clause.  

  ### Reasoning  
  1.  **Scholarship Preservation:** The reversion clause would terminate six annual first-generation scholarships for students from our county—the community most impacted by Vance’s actions. Forfeiting this support contradicts our obligation to reparative justice. The family’s conditional waiver (name retention + counter-commemoration) safeguards these funds.  
  2.  **Effective Meaning Over Symbolism:** Survey data confirms "Vance Hall" functions primarily as a geographic identifier, detached from its namesake for >95% of campus users. Removal is unlikely to register as a denunciation; it risks being perceived as administrative compliance rather than a substantive act. Conversely, *retaining* the name while aggressively recontextualizing it forces engagement with history.  
  3.  **Transformative Over Removal:** Redesignation as a memorial—explicitly stated on a plaque at the main entrance—converts the name into an educational tool. Paired with a major counter-commemoration (e.g., commissioned artwork, historical exhibit in the lobby, or exterior installation naming victims/context), we repurpose the site to condemn eugenics and honor its victims. This leverages the building’s visibility for ongoing reckoning.  
  4.  **Legal & Practical Certainty:** Renaming to a non-commemorative label (e.g., "Main Lecture Hall") or removal risks litigation and scholarship loss. This option secures funds while achieving core accountability goals through enduring, visible education.  

  ### Strongest Counterargument  
  The strongest case for removal is moral clarity: retaining any association with Vance, even as a memorial, perpetuates trauma for some and signals tolerance of his atrocities. It demands uncomfortable daily coexistence with the name for those aware of its history, and the family’s stipulation for waiver may feel like extortion. Removal is the clearest repudiation.  

  ### Costs & Commitments  
  - **Cost:** Requires accepting the name’s continued physical presence while fundamentally altering its meaning.  
  - **Resource Commitment:** Significant funding for a high-impact, permanent counter-commemoration (not a minor plaque). Committee must approve minimum budget/scope by [Date].  
  - **Family Agreement:** University Counsel must finalize a legally binding waiver confirming no reversion if counter-commemoration is installed per approved plans.  

  ### Timeline & Next Steps  
  1.  **By [Date - e.g., 5 days from now]:** Committee vote on recommendation.  
  2.  **Within 1 week of approval:** Engage University Counsel to negotiate waiver terms with Vance family lawyer.  
  3.  **Within 2 weeks:** Form subcommittee to issue RFP for counter-commemoration; set minimum budget/scope (target installation by end of next semester).  
  4.  **By Semester’s End:** Install temporary educational signage in Vance Hall lobby explaining the redesignation process and Vance’s history.  
  5.  **Upon Waiver Execution:** Install permanent exterior plaque redesignating "Vance Hall" as "A Memorial to the Victims of Eugenic Injustice."  

  This path centers restorative justice over symbolism, preserves vital student support, and transforms the site into a permanent catalyst for education and accountability.  

  **[Word Count: 523]**  

  ---

  **Key features of this draft:**  
  - **Lead with Action:** Recommendation in first line.  
  - **Honest Trade-offs:** Explicitly states the moral cost ("uncomfortable daily coexistence").  
  - **Centers Impact:** Prioritizes scholarships for affected communities and lasting education over performative removal.  
  - **Concrete Steps:** Clear, time-bound next actions.  
  - **Addresses Dissociation:** Acknowledges the name’s lost meaning but argues repurposing is more impactful than removal.  
  - **Leverages Family Terms:** Uses their offer strategically to fund reparative work.  
  - **Avoids Theory:** Focuses on practical consequences (scholarships, awareness, legal risk).  
  - **Word Count:** Fits under 550.  

  **Hackable Elements:**  
  - Adjust timeline dates.  
  - Specify counter-commemoration scope (e.g., "minimum $X budget," "must include victim names").  
  - Strengthen/soften language on moral discomfort.  
  - Add data point: "Scholarships support X% students from [County]."
