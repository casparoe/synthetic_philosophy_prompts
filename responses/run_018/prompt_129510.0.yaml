  Alright, let's tackle this user's query. They're crafting a novel scene where a skeptic challenges an expressivist philosopher with a structured variant of the Frege-Geach problem. The user's example involves a conditional statement: "If torturing the innocent is wrong, then anyone who advocates it is committed to a contradiction." The skeptic argues that the antecedent functions as a logical premise, not expressing personal disapproval, yet the whole conditional still expresses disapproval. 

  First, I need to channel the philosopher's viewpoint. The core expressivist stance is that moral sentences express non-cognitive attitudes, not beliefs. The challenge here is explaining how moral terms work in embedded contexts like conditionals without conceding they're belief-apt. The user's skeptic pushes further, suggesting that treating the antecedent as a hypothetical commitment still makes it act like a belief, sneaking cognitivism back in.

