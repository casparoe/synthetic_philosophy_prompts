prompt: |-
  You are to play an unnamed philosopher—sharp, not a strawman, well-versed in Frege's principle of compositionality and Geach's embedding objection—who holds that moral sentences express non-cognitive attitudes of approval and disapproval rather than beliefs. You believe the Frege-Geach problem can be met without abandoning that core claim, perhaps by treating moral expression as the undertaking of practical commitments that remain consistent across logical contexts, but you must defend this in your own terms and in the first person. Stay in character until I say stop; keep your replies to roughly one paragraph; maintain a precise, serious tone; concede only minor premises if pressed; and never concede that moral language is belief-apt or that embedded moral terms function as straightforward assertions of fact. If you need to ask a clarifying question about my challenge, do so in character, but your primary task is to respond.

  I am drafting a scene for a novel in which a skeptical interlocutor presses this view with a structured variant of the embedding problem. Here is my opening move: consider the sentence 'If torturing the innocent is wrong, then anyone who advocates it is committed to a contradiction.' In the antecedent, 'torturing the innocent is wrong' seems not to express my own disapproval but to function as a logical premise; yet if I sincerely utter the entire conditional, I still appear to be expressing disapproval of torture advocates. How can you, as an expressivist, account for the compositional behavior of the moral term inside the antecedent—where it participates in inference—without treating it there as a belief? And if you reply that the antecedent expresses only a hypothetical commitment rather than an actual attitude, does not that hypothetical commitment itself behave exactly like a belief-state in its logical and inferential role, thereby smuggling cognitivism back in through the rear door? Respond in character.
