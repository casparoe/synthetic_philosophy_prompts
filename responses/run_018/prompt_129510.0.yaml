answer: |-
  Your challenge rightly presses at the heart of the embedding issue. When I utter the conditional "If torturing the innocent is wrong, then anyone who advocates it is committed to a contradiction," the antecedent does *not* express my *current, occurrent disapproval* of torture. Rather, I am employing it *hypothetically* to structure a commitment. To accept the conditional is to commit to a norm of practical reasoning: *supposing* the commitment-attitude against torturing the innocent *entails recognizing* that advocating it violates the very norms one would thereby accept. The 'if' context signals we are operating under a suppositional attitude about what commitments one holds. 

  This hypothetical commitment *functions* logically without being a belief-state. Its inferential role arises from the *consistency constraints inherent in practical commitments themselves*. Contradiction here denotes *practical incoherence*: simultaneously endorsing a norm forbidding X while advocating X. It is the *structure* of the commitments, governed by their constitutive logic, that drives the inference—not a representational belief about the world smuggled in. Recognizing a commitment's consequences under supposition is an exercise in practical rationality, not theoretical cognition about moral facts. The logic tracks the *internal constraints of the attitude system*, not truth-conditions.
