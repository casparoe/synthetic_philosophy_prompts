answer: |-
  Below is a branching taxonomy for extending Russell's theory of definite descriptions to non-extensional contexts. The tree is built from diagnostic questions that sort positions based on their commitments, with named views at the leaves. Each question is concrete and label-free, focusing on logical and semantic features. Contested interpretive claims (e.g., Russell's intentions) are explicitly flagged, and no stance is presented as specialist consensus. Unoccupied leaves are diagnosed as incoherent, unstable, or unexplored. Key logical points (e.g., scope ambiguity in belief reports) are distinguished from contested extensions.  

  ---

  ### **Taxonomy of Extensions to Russell's Theory**  
  **Russell's core theory**: Definite descriptions ("the F") are quantificational (not singular terms): "The F is G" ≡ ∃x (∀y (Fy ↔ y=x) ∧ Gx). Challenges arise in non-extensional contexts (belief, modality, fiction) due to opacity, truth-value gaps, or nonexistent referents.  

  #### **Diagnostic Questions & Branches**  
  1. **In opaque contexts (e.g., 'S believes the F is G'), can the description take wide scope over the non-extensional operator?**  
     - *Settled logical point*: Russell's original theory allows scope distinctions in belief/modal contexts.  
     - *Contested extension*: Whether wide scope is mandatory, optional, or incoherent in non-extensional contexts.  
     - **Branch by answer**:  
       - *(A) Yes* → Proceed to Q2.  
       - *(B) No* → Proceed to Q3.  

  2. **If wide scope is available (Q1A), must the existence/uniqueness commitment of the description be satisfied in the actual world (not just the believer's/modal world)?**  
     - **Branch by answer**:  
       - *(A) Yes, existence/uniqueness is actual-world-bound* → Proceed to Q4.  
       - *(B) No, existence/uniqueness is evaluated in the believer's/modal world* → Proceed to Q5.  

  3. **If wide scope is barred (Q1B), is the description still treated as a quantifier (not a singular term) within the non-extensional context?**  
     - **Branch by answer**:  
       - *(A) Yes, always quantificational* → Leaf: **"Strawsonian Presuppositional"** (e.g., Strawson; descriptions trigger existence/uniqueness presuppositions; failure yields truth-value gaps in all contexts).  
       - *(B) No, it becomes a singular term* → Leaf: **"Hybrid Direct-Reference"** (e.g., influenced by Donnellan; descriptions shift to directly referential in opacity, rigidly designating actual referents).  

  4. **If wide scope requires actual-world existence (Q2A), can the description designate nonexistent objects (e.g., in fiction)?**  
     - **Branch by answer**:  
       - *(A) Yes, nonexistents are admissible referents* → Leaf: **"Meinongian Revision"** (e.g., Parsons; quantifiers range over existent/nonexistent objects; actual-world existence not required).  
       - *(B) No, existence must be actual and factual* → Proceed to Q6.  

  5. **If existence is evaluated in non-actual worlds (Q2B), does the description retain its quantificational role (not singular)?**  
     - **Branch by answer**:  
       - *(A) Yes, strictly quantificational* → Leaf: **"Neo-Russellian Scope-Based"** (e.g., Neale; scope distinctions resolve opacity; descriptions never become singular terms).  
       - *(B) No, it shifts to singular in de re attitudes/modality* → Leaf: **"Unoccupied"** (diagnosis: *Incoherent*—quantifiers cannot simultaneously be singular terms; collapses into direct reference).  

  6. **If actual existence is required and nonexistents barred (Q4B), how are truth-value gaps handled in fiction/belief?**  
     - **Branch by answer**:  
       - *(A) Gaps are prohibited; all sentences are bivalent* → Leaf: **"Strict Russellian"** (e.g., Quinean extension; "Pegasus flies" is false; belief reports with empty descriptions are false).  
       - *(B) Gaps are tolerated in non-extensional contexts only* → Leaf: **"Unoccupied"** (diagnosis: *Unstable*—inconsistent with Russell's bivalence in extensional contexts).  

  ---

  ### **Taxonomy Map**  
  ```  
  1. Wide scope available?  
     ├─(A) Yes → 2. Existence actual-world-bound?  
     │   ├─(A) Yes → 4. Nonexistents admissible?  
     │   │   ├─(A) Yes → Leaf: Meinongian Revision  
     │   │   └─(B) No → 6. Truth-value gaps?  
     │   │        ├─(A) No → Leaf: Strict Russellian  
     │   │        └─(B) Yes → Leaf: Unoccupied (Unstable)  
     │   └─(B) No → 5. Quantificational role retained?  
     │        ├─(A) Yes → Leaf: Neo-Russellian Scope-Based  
     │        └─(B) No → Leaf: Unoccupied (Incoherent)  
     └─(B) No → 3. Still quantificational?  
          ├─(A) Yes → Leaf: Strawsonian Presuppositional  
          └─(B) No → Leaf: Hybrid Direct-Reference  
  ```  

  ---

  ### **Notes on Key Distinctions & Unoccupied Leaves**  
  - **Settled vs. Contested**:  
    - Scope ambiguity (Q1) is a *settled* feature of Russell's logic.  
    - All extensions (e.g., wide scope in fiction, existence in modal worlds) are *contested*; no consensus exists.  
  - **Unoccupied Leaves**:  
    - *Q5B*: Quantificational descriptions cannot coherently "shift" to singular terms (violates compositionality).  
    - *Q6B*: Bivalence in extensional contexts + gaps in non-extensional contexts creates instability (undermines uniformity).  
  - **Flagged Overlaps**:  
    - **Strict Russellian** and **Neo-Russellian Scope-Based** cannot be cleanly separated on fiction: Both treat empty descriptions as false, but Neo-Russellians use scope for modal subclauses (e.g., "The F might be G").  
    - **Hybrid Direct-Reference** and **Meinongian Revision** overlap on rigid designation in belief but diverge on fictional objects.  

  ---

  ### **Summary of Named Positions**  
  - **Strict Russellian**: Bivalent; wide scope optional; existence actual; fictional claims false.  
  - **Neo-Russellian Scope-Based**: Scope resolves opacity; existence evaluated in belief/modal worlds; fictional claims false.  
  - **Strawsonian Presuppositional**: No wide scope; descriptions quantificational; existence presupposed (gaps if failed).  
  - **Hybrid Direct-Reference**: No wide scope; descriptions become singular terms in opacity (rigid designation).  
  - **Meinongian Revision**: Wide scope + actual existence not required; quantifiers range over nonexistents.  

  This taxonomy isolates commitments without privileging any view, suitable for seminar discussion. Adjust branch emphasis based on focal contexts (e.g., fiction vs. belief).
