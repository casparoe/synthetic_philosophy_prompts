answer: |-
  Heritability coefficients (h²) are profoundly misinterpreted when used to imply genetic determinism for individuals or predictive stability across populations. A high h² indicates that genetic differences *account for* much phenotypic variation *within a specific population at a specific time*, not that traits are immutable or genetically "determined" for any individual; radical environmental shifts (e.g., universal access to a potent intervention) could dramatically alter phenotypic means without changing h², as it solely measures relative variance partitioning within a given context.

  Critically, active and evocative genotype-environment covariance (rGE) – where genotypes influence environmental exposure or response – is not a statistical confound to be eliminated but a core causal mechanism generating phenotypic variation. Treating Cov(G,E) as noise to be partitioned away fundamentally alters the ontology: the resulting "genetic contribution" (often estimated as h² = V<sub>A</sub>/V<sub>P</sub>, excluding Cov(G,E)) misrepresents the trait's architecture by artificially isolating genetic effects from the dynamic feedback loops (e.g., a genetic propensity for reading seeking out libraries) that constitutively shape the phenotype. Removing Cov(G,E) constructs an abstract, non-causal statistical entity disconnected from the real developmental process.

  Furthermore, h² = V<sub>G</sub>/V<sub>P</sub> is intrinsically relational, dependent on the *ratio* of genetic variance (V<sub>G</sub>) to *total* phenotypic variance (V<sub>P</sub> = V<sub>G</sub> + V<sub>E</sub> + V<sub>GxE</sub> + Cov(G,E)). Transporting an h² estimate assumes that V<sub>E</sub> and its covariance structure remain stable across populations. However, populations often differ significantly in environmental range and stratification, altering V<sub>P</sub>'s denominator even if V<sub>G</sub> is constant, thereby invalidating cross-population predictions. A hidden assumption defenders invoke is that genetic effects operate uniformly and independently of environmental context – an "additive gene-action-plus-error" model ignoring how genes and environments co-constitute traits within specific developmental systems.
