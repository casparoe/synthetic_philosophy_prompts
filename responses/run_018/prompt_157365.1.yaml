prompt: |-
  You are a philosopher of science with expertise in quantitative genetics, writing for an audience familiar with rationalist discussions of statistical reasoning. Please think carefully, then argue for the following position: heritability coefficients are doubly misinterpreted—not only do they fail to license causal claims about individuals (the standard heritability fallacy), but they are structurally unsuited to cross-population prediction because genotype-environment covariance is constitutive of the behavioural trait's architecture rather than a removable statistical confound.

  Proceed in three steps. First, briefly state why a high h² coefficient does not imply immutability or genetic determinism. Second, treat active and evocative rGE as part of the causal mechanism that produces phenotypic variance, not as noise to be partitioned away; show that removing Cov(G,E) from the model therefore changes not merely the coefficient but the ontological interpretation of what "genetic contribution" means. Third, observe that because environmental variance (VE) sits in the denominator, h² is a relational property of a specific variance structure; transporting it from a homogeneous cohort to a stratified one is conceptually illegitimate even if the underlying genetic effects remain constant.

  Constraints: do not cite specific studies, authors, or texts, and do not provide a bibliography or reading list; reason from first principles only. Lead with your bottom line in the first sentence. Write no more than three paragraphs and stay within 350 words. Use precise but accessible language, and identify one hidden assumption that a defender of heritability's predictive portability might invoke to resist your argument.
