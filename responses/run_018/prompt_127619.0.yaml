prompt: |-
  I'm running a small coaching practice for grad students and freelancers who keep missing deadlines they 'definitely wanted' to make, and I was talking with a friend who teaches philosophy who said I'm probably just reinventing akrasia vs hyperbolic discounting. Maybe, but I still need an actual intake procedre I can run in about 45 minutes that tells me which failure mode we're dealing with, if any, and exactly where I should stop and refer out rather than coach.

  Turn the philosophical distinction between weakness of will and hyperbolic discounting into a reusable decision flowchart — ordered questions, what counts as a sufficient answer to each, hard stops for 'this is values, not psychology' or 'this is neither,' and honest flags for where judgment can't be eliminated. I want you to build in a 'temporal authority check' as a gate: it should test whether the client's planning self was sufficiently informed and not under acute stress when it set the goal, and that result should control whether hyperbolic discounting even applies. Don't treat it as an afterthought; make it a real decision node with conditions.

  Apply it to three cases: (a) a PhD student who had the grant draft finished but missed the portal deadline, (b) a freelancer who delayed invoicing for three months until rent was due, and (c) one case where the procedure returns an answer you'll probably dislike — like labeling a choice as rational discounting when it looks like moral failure. Be explicit about what the procedure flat-out can't settle and where human judgment sneaks in despite the flowchart. End with one line starting 'Bottom line:' summarizing the deliverable.
reasoning: |-
  We are creating a decision flowchart to distinguish between:
   1. Akrasia (weakness of will) - where the agent acts against their own better judgment.
   2. Hyperbolic discounting - where the agent overvalues immediate rewards over future ones, leading to procrastination or deadline missing.

   Additionally, we have a 'temporal authority check': we must verify that the client's planning self (when they set the goal) was sufficiently informed and not under acute stress. If not, then hyperbolic discounting might not be the right model.

   Steps:
   1. Temporal Authority Check: 
      - Was the goal set with full information? (e.g., did they know the steps, time required, etc.?)
      - Was the planning self under acute stress? (e.g., setting the goal in a panic, under external pressure, or during a crisis?)
      If either condition is not met, then we mark the goal-setting as flawed and the hyperbolic discounting model may not apply.

   2. After passing the temporal authority check, we can consider hyperbolic discounting. If the client consistently chooses immediate gratification (or avoidance of discomfort) over the long-term goal, despite having the goal as a high priority, then it's hyperbolic discounting.

   3. If the temporal authority check passes and the client did not choose immediate gratification (or avoidance) but still failed to act, then we might be dealing with akrasia (weakness of will). This is when the client judges that they should do X, but they do Y anyway, without a clear reward in the immediate moment.

   4. There might be other factors: 
      - If the client did not actually value the goal (then it's a values issue, not a psychological failure mode).
      - If the client made a rational decision to delay (e.g., because of new information or a higher priority), then it's rational discounting.

   5. Hard stops for referral:
      - If the issue is primarily about values (the client doesn't actually care about the goal) then we refer to a values coach or therapist.
      - If there is evidence of a deeper psychological issue (e.g., ADHD, depression, anxiety disorder) then refer to a mental health professional.

   We'll design a flowchart with ordered questions.

   Proposed Flowchart:

   Start:
   Q1: Did the client fail to meet a deadline they claim to have wanted to meet? (If no, stop - not applicable.)

   Q2: Temporal Authority Check:
     a. When setting the goal, did the client have sufficient information about the steps and time required? (Yes/No)
     b. When setting the goal, was the client under acute stress (e.g., panic, crisis, extreme pressure)? (Yes/No)

     Conditions:
       - If both (a) Yes and (b) No -> pass (planning self had authority) -> proceed to Q3.
       - Otherwise -> planning authority flawed -> go to Branch A.

   Branch A (Flawed planning authority):
     - The failure may be due to unrealistic goal setting, not necessarily discounting or akrasia.
     - Coach might help with planning skills or refer to a planner if the issue is chronic and severe.
     - Also, check if the client now has a pattern of setting goals under stress or without information? Then it's a planning issue.

   Q3: At the moment of decision (when they should have been working toward the goal), did the client choose an alternative activity that provided immediate gratification (or avoidance of discomfort) that they now regret? 
     - Examples: watched TV instead of working, played video games, etc.
     - If Yes -> likely hyperbolic discounting.
     - If No -> go to Q4.

   Q4: Did the client, at the moment of decision, still hold the belief that they should be working on the goal (i.e., they knew it was the right thing to do) but found themselves unable to act? 
     - If Yes -> likely akrasia (weakness of will).
     - If No -> go to Q5.

   Q5: Has the client's valuation of the goal changed? (e.g., they realized they didn't care about the grant, or they found a better opportunity?)
     - If Yes -> then it's a values shift or rational re-evaluation. (Not a failure mode, but a change of mind.)
     - If No -> then we have an unknown or other issue (possibly executive dysfunction, etc. -> refer to mental health professional).

   Additionally, at any step, if there are signs of clinical issues (like chronic procrastination, emotional distress, history of ADHD, etc.), we should refer to a mental health professional.

   Now, let's apply to the cases:

   Case (a): PhD student who had the grant draft finished but missed the portal deadline.

     Q1: Yes, failed deadline.
     Q2: 
          a. Probably yes, they had the draft done so they knew the steps and time required for submission? But note: missing the portal deadline might be a separate step. 
             Did they know the exact deadline and the time required to submit? Likely yes.
          b. When setting the goal (to submit by the deadline) were they under acute stress? Probably not, because they had the draft done. 
          -> Passes temporal authority.

     Q3: At the moment of decision (when they should have submitted), what did they do? 
          - If they were doing something else pleasurable (like going out with friends) instead of submitting, then hyperbolic discounting.
          - But note: they had the draft done. Why didn't they submit? 
            Common reasons: they thought they had more time (then it's a planning flaw, so we go back to Branch A? But in our Q2 they passed). 
            Or they got anxious about submitting and avoided it? Then it might be avoidance (which is immediate gratification of reducing anxiety) -> hyperbolic discounting.

          Alternatively, they might have been busy with something else and forgot? Then it might be an organizational issue.

          Let's assume they were anxious and avoided the portal. Then immediate gratification (avoiding anxiety) -> hyperbolic discounting.

   Case (b): Freelancer who delayed invoicing for three months until rent was due.

     Q1: Yes.
     Q2: 
          a. Did they know the steps and time required? Invoicing is simple and they know how. Yes.
          b. When setting the goal (to invoice promptly), were they under acute stress? Probably not (unless they set the goal when they were in a crisis, but typically not). Pass.

     Q3: At the moment of decision each time, did they choose an alternative activity that provided immediate gratification? 
          - They might have avoided invoicing because it's unpleasant (immediate discomfort) and did something else that was more pleasant. So yes, hyperbolic discounting.

          But note: why until rent was due? The urgency of rent made the immediate consequences of not invoicing (no money for rent) more salient, so they finally did it.

          This is classic hyperbolic discounting.

   Case (c): A case where the procedure labels a choice as rational discounting when it looks like moral failure.

     Example: A client set a goal to finish a project by a deadline. But then a family emergency happened and they had to care for a sick relative. They missed the deadline. 

     Q1: Yes, they missed.

     Q2: 
          a. When setting the goal, they had sufficient information? Yes.
          b. Were they under acute stress? Maybe not at the time of setting, but during the period, the emergency arose.

          However, note: the temporal authority check is about the time of goal setting. So if the emergency happened after goal setting, then the check passes? But then we have new information.

          We might adjust: if during the execution, new information or events occur that change the situation, then at the moment of decision, the client might be making a rational choice.

     So we go to Q3: At the moment of decision, did they choose an alternative activity for immediate gratification? 
          - They chose to care for their relative. This is not immediate gratification in the sense of pleasure, but a higher priority. 

     Then Q4: Did they believe they should be working on the goal? They might have, but they also believed they should care for their relative. 

     Then Q5: Has their valuation of the goal changed? Not permanently, but temporarily the relative became more important.

     We can interpret this as rational discounting: the costs of not helping the relative (immediate and severe) outweighed the benefits of meeting the deadline (which might be extended or have a penalty that is acceptable).

     However, the client might feel guilty (moral failure) but rationally, it was the right choice.

     So the flowchart would lead to: rational discounting.

   What the procedure can't settle:

    - The temporal authority check requires judgment: what counts as "sufficient information" and "acute stress"? 
    - In Q3 and Q4, the coach must rely on the client's self-report about their mental state at the time, which may be unreliable.
    - There might be mixed motives (both hyperbolic discounting and a values shift).

   Bottom line: A 45-minute intake procedure flowchart that distinguishes between akrasia, hyperbolic discounting, flawed planning, values shift, and rational discounting, with a gate for temporal authority and referrals for clinical or values issues.

   Let's write the flowchart in a structured way:

   Flowchart Steps:

   1. Confirmation of Failure:
      - "Did you fail to meet a deadline that you had intended to meet?"
          - No: Stop, not applicable.
          - Yes: Proceed to 2.

   2. Temporal Authority Check:
      a. "When you set this goal, did you have a clear understanding of the steps required and the time it would take?" 
          - If No: Planning authority flawed (Branch A).
      b. "When you set this goal, were you under acute stress (e.g., panic, crisis, extreme pressure)?" 
          - If Yes: Planning authority flawed (Branch A).
      - If both a. Yes and b. No: Proceed to 3.

   Branch A (Flawed Planning Authority):
      - "It seems the goal was set without adequate information or under duress. This is a planning issue. We can work on planning skills, but if this pattern is chronic and causing distress, consider referral to a professional who specializes in planning or mental health if underlying issues exist."
      - Also, check for patterns: "Do you often set goals without sufficient information or when stressed?" If yes, then referral might be needed.

   3. Immediate Gratification/Avoidance:
      - "At the time you were supposed to be working on the goal, did you choose to do something else that gave you immediate pleasure or helped you avoid discomfort (e.g., watching TV, playing games, avoiding anxiety)?" 
          - Yes: Hyperbolic discounting -> coaching can focus on commitment devices, precommitment, etc.
          - No: Proceed to 4.

   4. Weakness of Will (Akrasia):
      - "At the moment of decision, did you still believe that working on the goal was the right thing to do, but found yourself unable to make yourself do it?" 
          - Yes: Akrasia -> coaching might focus on willpower strengthening, habit formation, or identifying hidden factors.
          - No: Proceed to 5.

   5. Values Shift or Rational Reevaluation:
      - "Looking back, do you now feel that the goal wasn't actually important to you, or that you had a good reason to change your priorities?" 
          - Yes: 
              - If it's a values shift: "This seems to be a reevaluation of what matters to you. We can explore values clarification, or if it's causing distress, refer to a therapist or values coach."
              - If it's a rational response to new information (like an emergency): "This seems like a rational adjustment to changing circumstances. Not a failure."
          - No: Proceed to 6.

   6. Other/Unclear:
      - "Given the complexity, there may be other factors at play (e.g., executive dysfunction, mental health issues). I recommend consulting a mental health professional for an evaluation."

   Additionally, at any step, if the client reports symptoms of ADHD, depression, anxiety, etc., refer to a mental health professional.

   Now, let's code the three cases into this flowchart:

   Case (a): PhD student with finished draft missing portal deadline.

     Step 1: Yes.
     Step 2: 
          a. Yes (they knew how to submit and the deadline).
          b. No acute stress at goal setting? (Assuming goal was set earlier, not at the last minute) -> Pass.
     Step 3: 
          - Why didn't they submit? If they avoided because of anxiety (immediate relief by avoiding) -> Yes, hyperbolic discounting.
          - If they simply forgot, that might be an organizational issue (which might be a planning flaw? But they passed step 2). Alternatively, we might need a separate branch for memory issues? 
            However, forgetting might be due to not having a system (planning) or due to avoidance (then it's discounting). 
          Let's assume they avoided due to anxiety -> hyperbolic discounting.

   Case (b): Freelancer delaying invoicing until rent due.

     Step 1: Yes.
     Step 2: 
          a. Yes (they know how to invoice).
          b. No acute stress at goal setting -> Pass.
     Step 3: 
          - They avoided the unpleasant task (invoicing) and did something more pleasant? Yes -> hyperbolic discounting.

   Case (c): Rational discounting that looks like moral failure.

     Example: Client misses deadline due to family emergency.

     Step 1: Yes.
     Step 2: 
          a. Yes (they knew the steps when setting the goal).
          b. No (at goal setting, no emergency) -> Pass.
     Step 3: 
          - Did they choose an alternative activity for immediate gratification? 
            They chose to care for a relative. This isn't for immediate gratification in the typical sense (it's not pleasurable, but it's urgent and important). 
            So we say No.
     Step 4: 
          - At the moment, did they believe they should be working? They might have, but they also believed they should care for their relative. 
            So they might not have been in a state of akrasia (they were acting on a higher priority). 
            So No.
     Step 5: 
          - "Looking back, do you now feel that the goal wasn't actually important... or that you had a good reason to change priorities?" 
            They had a good reason (family emergency) -> Yes, rational reevaluation.

     Therefore, we classify as rational discounting.

   What the procedure can't settle:

    - The distinction between "immediate gratification" (in Step 3) and a rational response to an urgent need (like the family emergency) is not always clear. The coach must use judgment to see if the alternative activity was truly a higher priority or just a way to avoid discomfort.

    - In Step 4, the client might not accurately recall their belief state at the time.

    - The temporal authority check (Step 2) is subjective.

    - There might be cases of mixed motives.

   Bottom line: A structured 45-minute intake flowchart that classifies deadline failures into: flawed planning, hyperbolic discounting, akrasia, values shift, rational reevaluation, or other (with referral), with a gate for temporal authority.
answer: |-
  ### Decision Flowchart for Deadline Failure Analysis  
  **Time:** Designed for 45-minute intake.  
  **Purpose:** Diagnose failure mode (akrasia, hyperbolic discounting, values conflict, or other) and flag referral needs.  
  **Core Gate:** Temporal Authority Check (TAC) validates if the goal-setting "planning self" was legitimate.  

  ---

  #### **Flowchart Steps**  
  1. **Confirm Goal Commitment**  
     *Question:* "Did you genuinely believe this deadline mattered when you set it?"  
     *Sufficient Answer:* Explicit "yes" + examples of prior effort.  
     *Hard Stop:* "No" → **Values Conflict** (refer to values-based coach/life planner).  

  2. **Temporal Authority Check (TAC)** [Gate for Hyperbolic Discounting]  
     *Question:* "When setting the goal, were you:  
     - Fully informed about required steps?  
     - Free from acute stress (e.g., panic, exhaustion, coercion)?"  
     *Sufficient Answer:*  
     - **Pass:** "Yes" to both + details showing calm/agency (e.g., "I blocked time after reviewing requirements").  
     - **Fail:** *Any* "no" or vagueness (e.g., "I was panicking about my career").  
     *Outcome:*  
     - Pass → Proceed to Step 3.  
     - Fail → **Flawed Planning** (coach on goal-setting hygiene; if chronic, refer to therapist).  

  3. **Hyperbolic Discounting Test**  
     *Question:* "At the moment of skipping work, did you choose a *specific*, *immediately rewarding* alternative?"  
     *Sufficient Answer:*  
     - **Yes** (e.g., "scrolled TikTok for 3 hours" or "napped to avoid anxiety") → **Hyperbolic Discounting**.  
     - **No** (e.g., "I stared at the screen paralyzed") → Proceed to Step 4.  

  4. **Akrasia Test**  
     *Question:* "In that moment, did you still believe the goal was important *but felt unable to act*?"  
     *Sufficient Answer:*  
     - **Yes** + expressions of guilt/conflict (e.g., "I hated myself but couldn’t move") → **Akrasia**.  
     - **No** → Proceed to Step 5.  

  5. **Rationality/External Shift Check**  
     *Question:* "Did new information or priorities *reasonably* justify delaying?"  
     *Sufficient Answer:*  
     - **Yes** + tangible evidence (e.g., "client changed specs" or "family emergency") → **Rational Discounting** (not a failure).  
     - **No** → **Unknown/Clinical Issue** (refer to mental health professional).  

  ---

  #### **Case Applications**  
  **(a) PhD student with finished grant draft missing portal deadline:**  
  - TAC Pass (calmly planned draft timeline).  
  - Hyperbolic Discounting Test: *Yes* ("I watched Netflix to avoid submission anxiety").  
  - **Diagnosis: Hyperbolic Discounting** (immediate anxiety relief > long-term reward).  

  **(b) Freelancer delaying invoicing until rent due:**  
  - TAC Pass (knew steps; set goal rationally).  
  - Hyperbolic Discounting Test: *Yes* ("I played video games instead—invoicing feels tedious").  
  - **Diagnosis: Hyperbolic Discounting** (immediate tedium avoidance > future payment).  

  **(c) "Rational Discounting" that resembles moral failure:**  
  - *Client missed a manuscript deadline to care for a friend’s pet during their crisis.*  
  - TAC Pass (set deadline with clear intent).  
  - Hyperbolic Discounting Test: *No* (didn’t choose "fun" alternative).  
  - Akrasia Test: *No* (didn’t feel conflicted; saw pet care as urgent).  
  - Rationality Test: *Yes* ("Friend had no one else—this was non-negotiable").  
  - **Diagnosis: Rational Discounting** (externally validated reprioritization).  
  - *Why it stings:* Feels like "irresponsibility" but passes all objectivity checks. Coach must accept client’s values hierarchy.  

  ---

  #### **Limits and Judgment Calls**  
  - **TAC subjectivity:** "Acute stress" and "fully informed" require coach inference (e.g., client calling it "stressful" vs. describing panic attacks).  
  - **Akrasia ambiguity:** Distinguishing "inability to act" (akrasia) from hidden discounting (e.g., avoiding anxiety isn’t always volunteered).  
  - **Rationality loopholes:** Clients may reframe procrastination as "reevaluation." Coach must pressure-test evidence (e.g., "What new information emerged?").  
  - **Unresolved:** Chronic patterns (e.g., lifelong procrastination) automatically trigger mental health referral—flowchart can’t diagnose ADHD/depression.  

  **Bottom line:** A replicable 45-minute intake separating akrasia, hyperbolic discounting, planning flaws, and values shifts, with embedded temporal authority validation and referral flags.
