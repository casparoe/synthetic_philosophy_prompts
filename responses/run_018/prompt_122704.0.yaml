prompt: |-
  I serve on the allocation committee of the Bracknell Trust, a small health-focused foundation that is spending down: our governing instrument requires the remaining capital to be committed within three grant cycles, after which the Trust closes. This cycle we have USD 4.6 million to place. Three proposals survived staff review, and we cannot fund all three at full scope, so the decision is real.

  Our standing method is a multiplicative importance / tractability / neglectedness score. In our scorecard, importance is burden per unit of problem (DALYs), tractability is the share of the problem averted per million dollars in that setting, and neglectedness is one over total annual philanthropic and bilateral spend in the cause, taken at whatever level of description staff happened to use in the proponent's write-up.

  Proposal A: school-based treatment for soil-transmitted helminths plus micronutrient supplementation in two districts of a low-income country. USD 1.9 million over three years. Evidence base is strong and the delivery platform is proven; cost per child treated is roughly a dollar. Two bilateral funders and one multilateral are active in the same districts, and staff estimate about three million dollars of room for more funding before the platform saturates. One of the bilaterals has announced it will exit the country within eighteen months, and the ministry has no budget line to absorb the shortfall; if it leaves, staff think remaining room for more funding roughly doubles.

  Proposal B: a pilot to remove lead from paint sold in a middle-income country's domestic market, paired with enforcement capacity. USD 2.2 million over three years. Burden is large, the causal chain from regulation to measured blood-lead reduction is long, and the evidence for enforcement actually biting is thin; there is political risk. No other funder is currently in lead work in that country. Separately, a large private foundation has publicly pledged to match new commitments in this area one-for-one, up to 1.5 million dollars in total, but only for commitments signed before a deadline five months from now, and nothing thereafter.

  Proposal C: surveillance, clinical guidance, and a small treatment stockpile for a poorly understood chronic kidney disease affecting young agricultural workers in one region. USD 1.4 million over three years. Almost nothing is spent on it globally, the aetiology is unsettled, and part of the grant is research that would change what later funders could do. Our own regional program officer has nine years of relationships with the regional health authority and two growers' associations; her secondment ends in fourteen months, and that relationship capital leaves with her.

  Two further complications. First, two committee members want the scorecard amended before we vote: one to replace neglectedness with a counterfactual-displacement measure (the share of resulting activity that would not have occurred but for us), and one to force every cause onto a fixed twelve-area taxonomy so that staff cannot sharpen a description until the denominator looks small — under that taxonomy, at least two of these proposals collapse into the same cause area. Second, our treasurer wants up to one million dollars held back unallocated, on the ground that a large funder is expected to open a co-funding window in about fourteen months.

  Please draft the decision memo I will circulate, addressed to the committee and no longer than about a thousand words. It should: open with a specific recommended allocation, including tranche structure or conditions and whether any reserve is justified; state what weight the ITN score should carry in the final decision and why; say whether we should adopt either amendment now or decide this case first and revise the framework afterward; and include a short section giving the strongest version of the case for the option you are not recommending, of the kind its advocate would recognize. The committee is split and sophisticated, so the reasoning has to be usable by people who disagree with the conclusion, not merely a restatement of the score.
reasoning: |-
  We are facing a critical decision with limited funds and three compelling proposals. We must allocate $4.6 million, but cannot fund all three at full scope. Additionally, we have a standing method (ITN: importance, tractability, neglectedness) and two proposed amendments to the scorecard. There's also a request to hold back up to $1 million for a future co-funding opportunity.

   After careful analysis, I recommend the following allocation:

   - Fund Proposal B at $2.2 million, but structure it to take advantage of the matching pledge: This grant would be made in two tranches. The first tranche of $1.1 million would be released immediately to secure the 1:1 match (thus turning $1.1 million into $2.2 million total for the project, including the match). The second tranche of $1.1 million would be released after the first year, conditional on satisfactory progress and the match being confirmed. This leverages the matching opportunity and effectively doubles our impact for this proposal. The total outlay from us would be $2.2 million, but the project would receive $4.4 million.

   - Fund Proposal C at $1.4 million, with no tranche conditions. This is because the regional program officer's relationships are critical and time-bound (her secondment ends in 14 months). We need to act quickly to utilize this relationship capital.

   - Do not fund Proposal A at this time.

   - Hold back $1 million as a reserve for the anticipated co-funding window in 14 months. This leaves us with $4.6 million - ($2.2 million + $1.4 million) = $1.0 million, which matches the treasurer's request.

   However, note that the total allocation would be $2.2M (B) + $1.4M (C) = $3.6M, plus $1.0M reserve, totaling $4.6M.

   Why not A? While it has a strong evidence base and low cost, the bilateral funder's exit in 18 months might open up more room, but we have time in the next cycle (we have two more cycles after this) to address it. Also, the current room is only $3 million, and if the bilateral exits, it becomes $6 million. We can reconsider then. Moreover, the matching opportunity in B and the time-sensitive relationship in C are more pressing.

   Now, the ITN score:

   We should use the ITN score as a primary tool but not the sole determinant. In this case, the time-sensitive opportunities (matching deadline in B and relationship in C) and the leverage (matching) are critical factors that the ITN framework does not fully capture. Therefore, we should assign heavy weight to the ITN scores but also consider these additional factors.

   Regarding the amendments to the scorecard:

   I recommend that we do not adopt either amendment for this decision. We should decide this case first and then review the framework afterward. Why?
   - The counterfactual-displacement measure: This is a valuable concept but requires more development and data that we may not have readily available. It could lead to subjective estimates in this round.
   - The fixed taxonomy: While it would address the issue of staff sharpening descriptions, it is too rigid and might not capture the nuances of each proposal. Moreover, we are in a spend-down phase and need flexibility.

   Therefore, we should use the current ITN method for this round and then, after this decision, form a small working group to review the framework and consider these amendments for the next cycle.

   The case for Proposal A (the one not recommended):

   The strongest case for Proposal A is that it addresses a high-burden, well-understood problem with a proven, low-cost intervention. At roughly $1 per child treated, we can reach a large number of children and prevent significant DALYs. The evidence base is strong, and the delivery platform is ready to scale. The bilateral exit in 18 months does create uncertainty, but it also means that without our funding now, there might be a gap in treatment that could lead to a resurgence of disease. Moreover, the cost-effectiveness of this intervention is among the highest of any health intervention. If we do not fund now, we risk a loss of momentum and a potential increase in disease burden that could take years to reverse. Additionally, the current room for funding ($3 million) is sufficient for our grant, and if we wait, the bilateral exit might create a funding gap that we could fill in the next cycle, but by then the platform might have weakened without sustained funding.

   However, against this, we have the matching opportunity in B and the time-bound relationship in C that we believe are more critical to capture now.

   In summary, we recommend:

   - Fund Proposal B: $2.2 million (in two tranches as described)
   - Fund Proposal C: $1.4 million
   - Reserve: $1.0 million
   - Do not fund Proposal A at this time.

   We use the ITN scores as a primary guide but adjust for time-sensitive leverage and relationship factors. We do not change the scorecard now but commit to reviewing the framework after this decision.

   Draft Memo:

  ---

  **MEMORANDUM**

  To: Allocation Committee, Bracknell Trust  
  From: [Your Name/Title]  
  Date: [Current Date]  
  Subject: Funding Recommendations for Current Grant Cycle  

  ### Executive Summary
  This memo recommends allocating the current cycle's $4.6 million as follows:  
  - **Proposal B**: $2.2 million (structured in two tranches to secure a 1:1 match)  
  - **Proposal C**: $1.4 million  
  - **Reserve**: $1.0 million (for a future co-funding opportunity)  
  - **Proposal A**: Not funded in this cycle.  

  The ITN (Importance, Tractability, Neglectedness) framework should carry substantial weight in our decision, but we must also consider time-sensitive leverage and relationship factors. We do not recommend adopting the proposed amendments to the scorecard for this cycle but commit to a post-decision review of the framework.  

  ### Detailed Recommendations

  1. **Proposal B: Lead Paint Regulation and Enforcement Pilot**  
     - **Amount**: $2.2 million, structured in two tranches:  
       - Tranche 1: $1.1 million released immediately to secure the 1:1 match (deadline in 5 months).  
       - Tranche 2: $1.1 million released after 12 months, conditional on satisfactory progress and match confirmation.  
     - **Rationale**: This proposal offers exceptional leverage due to the 1:1 matching pledge (up to $1.5 million). Our $2.2 million grant, with the match, would deliver $4.4 million to the project. The burden of lead exposure is high, and the neglectedness is evident (no other funder in the country). The political risk and long causal chain are mitigated by the matching opportunity, which effectively doubles our impact and reduces the risk per dollar. Missing the matching deadline would forfeit this leverage.  

  2. **Proposal C: Chronic Kidney Disease in Agricultural Workers**  
     - **Amount**: $1.4 million, full amount released upon grant signing.  
     - **Rationale**: The time-bound nature of our program officer's relationship (ending in 14 months) is critical. Her nine years of trust with local authorities and growers' associations are irreplaceable and necessary for project success. The proposal addresses a highly neglected condition with potential for catalytic research. The funding will build surveillance and stockpile capacity and could unlock future funding by clarifying aetiology.  

  3. **Reserve**  
     - **Amount**: $1.0 million.  
     - **Rationale**: The treasurer has indicated a strong likelihood of a co-funding window with a large funder in approximately 14 months. Holding this reserve aligns with our spend-down strategy by allowing us to leverage a larger partnership in the next cycle.  

  4. **Proposal A: School-Based Deworming and Micronutrients**  
     - **Not funded this cycle**.  
     - **Rationale**: While the evidence is strong and cost per child is low, the current room for funding ($3 million) and the potential doubling after a bilateral exit (in 18 months) allow us to defer. We can reconsider in the next cycle when the funding gap becomes clearer. This also preserves funds for the time-sensitive opportunities in B and C.  

  ### Weight of ITN Framework
  The ITN scores are a robust starting point and should carry substantial weight (we assign 60-70% of the decision weight). However, in this cycle, we must also account for:  
  - **Leverage**: The matching opportunity in Proposal B (which multiplies impact) and the catalytic potential of Proposal C (research and relationship capital).  
  - **Time Sensitivity**: The matching deadline (5 months) and relationship window (14 months) are critical and non-replicable.  

  These factors are not fully captured by ITN and justify deviations from a pure ITN ranking.  

  ### Amendments to the Scorecard
  We recommend against adopting either amendment for this decision:  
  - **Counterfactual-displacement measure**: While conceptually sound, it requires more development and data collection. Implementing it now would introduce subjectivity and delay.  
  - **Fixed taxonomy**: This would reduce flexibility and might obscure unique aspects of proposals (e.g., Proposal C's regional focus versus a global cause area).  

  We should decide this case using our current framework and then form a working group to review the scorecard for the next cycle.  

  ### The Case for Proposal A
  Proposal A presents a compelling opportunity: it targets a high-burden disease with a proven, cost-effective intervention. At about $1 per child, it promises immediate and measurable impact. The bilateral exit in 18 months creates a risk of a funding cliff; our funding now could maintain continuity and prevent a resurgence. The platform is ready to absorb funds, and delays might lead to lost momentum and increased disease burden. The evidence base is among the strongest, and the cost per DALY averted is extremely low.  

  ### Conclusion
  We recommend funding Proposals B and C and holding a $1.0 million reserve. This allocation captures unique leverage and time-bound opportunities while preserving funds for future partnerships. We do not fund Proposal A at this time but note it as a high-priority candidate for the next cycle. The ITN framework remains central, but we must adapt to exceptional circumstances. We will review the scorecard amendments after this decision.  

  I look forward to discussing this at the committee meeting.
answer: |-
  **MEMORANDUM**  
  To: Bracknell Trust Allocation Committee  
  From: [Your Name], Allocation Committee Member  
  Date: [Current Date]  
  Subject: Funding Recommendations & Framework Guidance — Cycle [X]  

  ### I. Recommended Allocation  
  Given the $4.6M budget, time constraints, and strategic opportunities, I propose:  
  1. **Fund Proposal B at $2.2M** (lead paint regulation), structured to unlock matching funds:  
     - **Tranche 1**: $1.1M released immediately to secure the 1:1 private match (deadline: 5 months).  
     - **Tranche 2**: $1.1M released at 18 months, contingent on verified enforcement progress.  
     - *Rationale*: Secures $4.4M total investment (our $2.2M + $2.2M match), addressing high neglectedness and leveraging irreversible opportunity.  

  2. **Fund Proposal C at $1.4M** (kidney disease in agricultural workers), fully committed upfront.  
     - *Rationale*: Capitalizes on expiring staff relationships (14-month window) and unlocks catalytic research.  

  3. **Reject Proposal A** (deworming/micronutrients).  
     - *Rationale*: Bilateral uncertainty allows deferral to next cycle without near-term saturation risk.  

  4. **Hold $1.0M reserve** for future co-funding (per Treasurer’s guidance).  
     - *Conditions*: Reserve released only if the $14M co-funding window materializes; otherwise, rolled into Cycle 2.  

  *Total allocation: $3.6M ($2.2M + $1.4M) + $1.0M reserve = $4.6M.*  

  ---

  ### II. Role of ITN Scoring  
  The ITN framework should anchor **~70% of decision-weight**, supplemented by two overrides:  
  - **Time-limited leverage** (e.g., Proposal B’s match deadline, Proposal C’s relationship expiry).  
  - **Spend-down imperative**: Prioritizing irreversible opportunities that expire before Cycle 3.  

  *Why this balance?*  
  ITN provides rigor but fails to capture temporal risks/leverage (e.g., matching funds, staff turnover). Overweighting ITN would sacrifice Proposal B’s $2.2M match and Proposal C’s relationship capital. Conversely, ignoring ITN risks undervaluing neglectedness (B) and tractability (A).  

  ---

  ### III. Scorecard Amendments: Postpone Revision  
  Reject both amendments **for this vote**; reassess after Cycle 1:  
  1. **Counterfactual-displacement metric**:  
     - *Problem*: Highly speculative (e.g., estimating "displacement" for Proposal B’s regulation requires forecasting funder behavior). Unworkable this cycle.  
  2. **Fixed 12-area taxonomy**:  
     - *Problem*: Over-aggregation masks material differences (e.g., collapsing "lead poisoning" and "kidney disease" into "environmental health" would obscure Proposal B’s country-level neglectedness and Proposal C’s novel aetiology).  

  *Path forward*: Test amendments in Cycle 2 with retroactive pilot analysis.  

  ---

  ### IV. The Case for Proposal A (as an Advocate Would Frame It)  
  **"Proven impact at scale should trump uncertainty and novelty."**  
  - **Highest tractability**: Near-certain DALY reduction at $1/child, backed by gold-standard evidence. Delaying treatment risks irreversible developmental harm.  
  - **Hidden neglectedness**: The bilateral exit ($3M–$6M impending gap) creates urgent counterfactual impact. Ministry dependency means our $1.9M prevents collapse.  
  - **ITN superiority**: Scores higher than B/C on tractability (proven delivery) and importance (immediate burden). B’s leverage is speculative (enforcement risk), while C’s research may not yield interventions.  
  - **Moral urgency**: Directly addresses children’s health *today*; B/C target systemic change with delayed/no measurable lives saved.  

  ---

  ### V. Critical Tradeoffs & Risks  
  - **Proposal B risk**: Enforcement may fail (thin evidence), wasting funds. *Mitigant*: Tranche 2 is conditional.  
  - **Proposal C risk**: Research may not attract follow-on funding. *Mitigant*: Regional partnerships ensure baseline uptake.  
  - **Reserve risk**: Co-funding window may not open. *Mitigant*: $1.0M is a small hedge; redeployable.  
  - **Cycle 2 priority**: Revisit Proposal A post-bilateral exit, using clearer funding-gap data.  

  ---

  ### VI. Conclusion  
  Fund **B ($2.2M, tranched)**, **C ($1.4M)**, and **$1.0M reserve**. ITN guides but does not dictate, given temporal leverage. Reject framework amendments until Cycle 2. Proposal A’s merits are real but deferrable. This allocation maximizes irreversible impact while preserving optionality.  

  **Recommended vote**: Approve the above allocation package.
