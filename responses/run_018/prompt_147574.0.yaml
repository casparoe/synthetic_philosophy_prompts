    "embedded_confusion": "Lewisian modal realism requires an 'explanatory bridge' (causal, nomological, or modal) *linking* the actual world to other concrete worlds to ground counterfactual dependence.",
    "counterfactual_analysis": "Lewis analyzes counterfactuals via a *similarity ordering* between worlds, assessed *entirely from the perspective of the actual world*. 'A □→ C' is true in W iff in the closest (most similar) A-worlds to W, C is true. Similarity is determined by the laws and particular facts of W, *not* by any relation between W and those other worlds.",
    "world_isolation": "Worlds are causally and spatiotemporally isolated. There is *no* interaction, influence, or connection between them. The 'similarity' relation is an abstract comparison made *within* the modal realist framework, not a physical bridge.",
    "counterpart_function": "Counterpart theory resolves issues of *transworld identity* for de re modal claims and counterfactuals about individuals. It identifies *which individuals* in other worlds represent counterparts of actual individuals. It does *not* ground counterfactual dependence itself, which is handled solely by the world-similarity metric.",
    "remaining_tension": "The reliance on the primitive, unanalyzed notion of *overall comparative similarity* between worlds. Critics argue this metric lacks a robust metaphysical foundation within Lewis's system and struggles to fully capture the objective explanatory role of laws and causation in counterfactual reasoning."
  }
