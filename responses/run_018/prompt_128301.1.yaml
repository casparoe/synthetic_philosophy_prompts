  Dependency order is crucial. Start with the basics: what a Bongard problem is. Explain the left and right panels with examples. Then move to feature listing as a first approach. Let the students see its limitations. Then introduce the need for relational features. The asymmetry example can demonstrate that. Follow by showing how negation (what's not there) plays a role, which leads to the concept of negative space.

