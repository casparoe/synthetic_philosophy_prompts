answer: |-
  Here's a teaching plan structured as continuous prose, focusing on the dependencies, a specific example, misconception sequence, and a closing check, tailored for philosophy of science students new to cognitive psych concepts:

  Start by grounding them in the *structure* of a Bongard problem: six boxes on the left, six on the right, and the task is to infer the abstract rule partitioning them. Crucially, don't present solutions yet. Emphasize that this is a *minimalist laboratory* for studying how humans (or agents) induce concepts from sparse, unannotated examples—no labels, no teacher confirming guesses. They need to see the format as a constraint *before* tackling induction; it forces abstraction from raw perceptual input. Immediately contrast this with supervised learning: point out there’s no "training set" with correct answers provided, no error signal—just two silent panels demanding a hypothesis explain *both* inclusion and exclusion. This preempts the "it’s like machine learning with labels" misconception early.  

  Now, introduce your carrying example: **Left panel**: six variations of a filled rectangle with a single, small *square-shaped bite* missing from *different edges* (top, bottom, left, right, corners). **Right panel**: six filled rectangles with a single, small *semicircular bite* missing, again from various edges. The rule? "Shapes missing a *polygonal* segment (specifically square) vs. shapes missing a *curved* segment (specifically semicircular)". This example *must* avoid symmetrical shapes or obvious positive features (like "has a circle"); the *absence* (the negative space of the bite) is the carrier of the distinction. It must also avoid bites being identical in size/position across panels—vary these to force attention on the *shape* of the missing part, not its location or scale. The key is that the defining feature is *relational* (the contour of the void) and *qualitative* (angular vs. curved), not a simple inventory of parts.  

  Here’s where misconceptions surface sequentially: First, students will instinctively **list visible features** ("all have bites", "all are rectangles"). Let them propose these. Then reveal why it fails: *Both* panels share these features! This exposes the insufficiency of low-level feature listing and creates the "itch" for a deeper principle. Next, they’ll likely **treat the left panel as the "rule" and the right as "exceptions"**—a natural but fatal error. Cut this off by asking: "If left is 'the rule', what *positive* description fits all left boxes but *excludes* all right boxes?" They’ll struggle because the left lacks a unified positive trait (bites are in different locations). Stress the problem’s symmetry: the rule must *simultaneously* define membership in *both* groups; the left isn’t privileged. This is where the bite *shape* (negative space) emerges as the solution—likely proposed hesitantly. Highlight this shift: from cataloging *presences* to recognizing *structural properties of absence*.  

  Midway, the **"pattern matching"** misconception solidifies. They’ll think solving is about memorizing left-panel patterns. Dissolve this by modifying your example: Add a *seventh* box to the left—a rectangle missing a *triangular* bite (polygonal, so belongs on left). Ask if this violates their initial "square" hypothesis. They’ll see it doesn’t—the concept *broadens* to "polygonal voids". This shows induction isn’t matching instances but *inferring a category* that tolerates variation (different polygons). Contrast this with rote memorization: A matcher would reject the triangle as "not seen", but the induced concept ("angular missing segment") accommodates it. Tie this to philosophy: It’s *abduction* (inference to the best explanation) underdetermined by data.  

  Finally, the **closing check**: Don’t let them just solve a problem. Instead, present a *new* asymmetry case (e.g., left: shapes with *internal* lines intersecting at right angles; right: shapes with *internal* lines intersecting at non-right angles—using varied shapes like circles, hexagons). Have them *articulate not just the rule, but why it requires relational induction over feature listing*. Ask: "What minimal change to one example would *break* your rule, forcing a new hypothesis?" If they grasp it, they’ll target the *structural relationship* (e.g., "Change an intersection in a left-panel shape to 89 degrees—it’s still angular but now violates the ‘right angle’ rule"). This shows they’re testing the *invariant*, not memorizing pixels. If they tweak superficial features (color, size), they’ve missed the point.  

  **What to leave out**: Skip the 1960s AI history (Bongard’s origins, early pattern recognition ambitions). Why? It’s a distraction from the *epistemological mechanics* of induction you’re emphasizing. For philosophy students, the value lies in the problem as a lens on concept formation, not its computational genealogy. Also avoid deep dives into current cognitive models (e.g., Bayesian induction)—tantalizing but premature. Focus purely on the *logical structure* of the inference from minimal data. The goal is for them to leave unsettled by how much we *project* onto sparse examples, seeing Bongard problems not as puzzles but as stark metaphors for scientific hypothesis generation itself.
