  1. Pattern matching: Students might think it's about memorizing patterns rather than forming a hypothesis. This comes up early when they try to list features. Counter by showing how features alone fail in the asymmetry example.
  2. Left panel as rule-set: They might assume left is always the "rule" and right the "exception." Use an example where both sides have similar features but differ in structure. Show that the rule must explain both inclusion and exclusion.
  3. Conflation with supervised learning: Clarify that there's no training data; it's about hypothesis generation from minimal examples. Emphasize the abductive reasoning aspect.

  The closing check should involve a problem where the solution isn't obvious, requiring them to articulate the underlying principle. Ask them to generate their own problem, which forces them to think about what makes a valid concept and what minimal examples are sufficient.

