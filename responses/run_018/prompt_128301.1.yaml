  hey — quick ask. i'm running a grad session on Bongard problems and concept induction from minimal examples, mostly for philosophy of science students who've never touched cognitive psych. don't lecture me on teh problems themselves; i need a teaching plan. lay out the dependancy order: what idea has to be in place before they can see why induction here isn't just feature-listing? pick one carrying example — not the tired circle-vs-triangle ones, maybe an asymmetry case where negative space does the work — and say exactly what it needs to have and what it must avoid. then map the misconceptions in sequence: i think they'll default to 'pattern matching' and assume the left panel is always teh rule-set, maybe also conflate it with supervised learning — tell me where in the arc each pops up and how to cut it off before it hardens. what's the closing check that shows they've grasped the induction problem rather than just solved puzzles? and be explicit about what to leave out — maybe the 1960s AI history? — and say why. write it all as continuous prose, no headings or bullets or bold, like a long email.
