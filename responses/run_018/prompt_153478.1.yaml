answer: |-
  Here's a breakdown of the Frege-Geach deadlock, using your "dance vs. container" metaphor as the lens, and addressing your specific questions:

  **The Core Disagreement: Substantive Semantic Composition vs. Metaphorical Mismatch (Leaning Heavily Towards Substantive)**

  1.  **What the Expressivist Side Says (The Dancers):**
      *   "Moral statements *fundamentally* express non-cognitive attitudes (disapproval, commitment, plans - e.g., Gibbard, Blackburn). Their primary function is practical guidance, not describing facts."
      *   "The 'container' metaphor (truth-conditional semantics) is fundamentally *wrong* for the core function of moral language. You're trying to fit a dynamic, action-oriented phenomenon (the dance) into a static box (the container)."
      *   "We *can* explain embeddings *without* positing beliefs/truth-conditions as fundamental. We provide a *different kind of explanation* (e.g., Blackburn's 'attitudes to attitudes', Gibbard's 'plan-laden content', Horgan & Timmons' 'cognitivist expressivism') showing how the *pragmatic force* or *commitment* can project systematically in complex sentences (like steps in a dance influencing the next move)."
      *   "Truth-conditional semantics *presupposes* cognitivism and begs the question against us. It's the wrong tool for the job."

  2.  **What the Truth-Conditionalist/Cognitivist Side Says (The Container Builders):**
      *   "Logic and semantics require compositional, truth-evaluable content (e.g., Geach, Searle, Schroeder). 'If P then Q' works because 'P' has a content that can be true/false *independently* of anyone asserting it or having an attitude *at the moment of utterance*."
      *   "Expressivist explanations of embeddings (the 'dance moves') are either:
          *   *Ad hoc*: Tailored specifically to solve Frege-Geach, not derived from a general theory.
          *   *Covertly truth-conditional*: They end up defining complex contents that *look* and *behave* exactly like truth-conditions (Schroeder's "The Expressivist's Worry"), effectively collapsing into the 'container' model they reject.
          *   *Psychologically implausible*: Attributing complex, nested attitudes (e.g., disapproval of not disapproving of encouraging murder) doesn't match how people actually process conditionals."
      *   "The 'dance' metaphor is vague. Formal semantics *works*. It provides a rigorous, predictive account of language *in general*. Expressivism needs to show how its 'dance' can achieve the same level of systematicity and predictive power for *all* embeddings (negation, disjunction, quantifiers, modals) without relying on truth-conditional structures."

  **Diagnosis: Primarily Substantive Disagreement About Semantic Composition**

  *   **Not *Just* Verbal:** Both sides understand what "meaning" typically entails in formal semantics (compositionality, truth-conditions, logical relations). The expressivist isn't merely redefining "meaning"; they are **rejecting the applicability of that entire framework** to the moral domain. They argue for a *different kind of compositional system* based on attitudes/commitments.
  *   **Not *Just* Different Questions:** While their *starting points* differ (psychology/pragmatics vs. formal logic), they are demonstrably trying to answer the *same core question*: "How does the meaning of complex sentences systematically depend on the meanings of their parts *in moral discourse*?" They collide directly on this point.
  *   **The Metaphorical Mismatch is *Symptomatic*, Not the Cause:** Your insight is crucial. The "container" metaphor *embodies* the truth-conditional/compositional paradigm. The "dance" metaphor *embodies* the dynamic, pragmatic, commitment-based paradigm. The **substantive disagreement is about which paradigm provides the correct fundamental account of moral language composition**. The metaphors highlight the clash of worldviews, but the dispute is about how language *actually functions*.

  **What Could Break the Deadlock?**

  1.  **The "Expressivist's Triumph" (Formal Result):** A demonstrably successful **formal compositional semantics for a full, complex language (including all problematic embeddings: negation, disjunction, conditionals, quantifiers, modals) built *entirely* on expressivist foundations (attitudes, plans, commitments) without smuggling in truth-conditions.** It must be:
      *   *Formally rigorous:* Mathematically precise and systematic.
      *   *Predictive:* Explains linguistic intuitions and inferences as well as truth-conditional semantics.
      *   *Psychologically plausible:* The attitudes/commitments it posits must align with how minds *actually* process complex moral language.
      *   *General:* Applicable beyond a few hand-picked examples. Schroeder's work highlights how hard this is.
  2.  **The "Container Leak" (Psychological Finding):** **Strong empirical evidence that the *cognitive processing* of embedded moral sentences (especially conditionals, negations) *does not involve* activating the core affective/attitudinal state associated with the atomic moral claim.** For example:
      *   fMRI studies showing conditionals like "If murder is wrong..." activate *only* abstract reasoning/linguistic areas, *not* the emotional/affective regions activated by "Murder is wrong!".
      *   Behavioral studies showing reaction times/inference patterns for embedded moral claims mirror those for non-moral descriptive claims, differing significantly from asserted moral claims.
      This would severely challenge the core expressivist claim that the *same* attitude is expressed, even embedded, and support the truth-conditional view that embedded clauses function as abstract propositions.
  3.  **The "Dissolving Distinction":** A clear conceptual separation showing the dispute rests on a **false dichotomy**. Perhaps:
      *   **Hybrid Theories Gain Dominance:** Models successfully integrating both attitudinal and truth-conditional components (e.g., Ridge's Ecumenical Expressivism) become so explanatorily powerful that the "pure" versions fade. The debate shifts to *how* these components interact compositionally, rather than *which one is fundamental*.
      *   **Focus Shift to Function, Not Ontology:** Widespread acceptance that the debate is less about the *metaphysical status* of moral properties and more about the *functional role* of moral language. Both sides might agree moral sentences play a unique practical role *and* exhibit logical structure, focusing on how that structure serves the function rather than reducing one to the other.

  **Where My Reasoning is Shakier & What Could Flip It:**

  1.  **The Power of Quasi-Realism:** My diagnosis leans against expressivism because formal results like Schroeder's seem damning. **Where I'm shaky:** Blackburn's quasi-realism is incredibly sophisticated. Could a sufficiently developed version *really* mimic all truth-conditional behavior without ontological commitment, making the "container" metaphor just a useful *representation* of the deeper "dance"? **What could flip it:** A novel quasi-realist formal model demonstrably handling *all* embeddings as elegantly as truth-conditional semantics, perhaps using dynamic semantics or sophisticated commitment structures, convincing formal semanticists.
  2.  **The Scope of "Compositionality":** I assume both sides agree on the *need* for compositionality. **Where I'm shaky:** Could radical expressivists successfully argue that compositionality *itself* is a "container"-inspired concept that doesn't apply to the dynamic "dance" of attitude expression? That logic in moral language works fundamentally differently? **What could flip it:** A compelling argument (backed by linguistic evidence) that moral inferences *don't* follow standard logical patterns, or that "compositionality" as defined in formal semantics is an artificial constraint irrelevant to the actual use of moral language. This would make the disagreement more about the *goals* of semantic theory.
  3.  **The Metaphor's Bite:** I treat the metaphor clash as symptomatic. **Where I'm shaky:** Could the insistence on the "container" metaphor *itself* be the primary obstacle? If truth-conditionalists conceded that "embedding" is a misleading static term and adopted a dynamic framework (like update semantics) from the start, could expressivist insights be integrated more easily? **What could flip it:** Truth-conditional semanticists explicitly adopting dynamic frameworks *and* finding expressivist explanations naturally fitting within them, resolving the problem without expressivists needing a wholly distinct formalism. This would dissolve the deadlock by changing the shared background framework.

  **For Your Scene:** The loop likely persists because the philosophers are talking past each other's fundamental metaphors (container vs. dance) while both demanding compositional explanations. The expressivist feels the truth-conditionalist is asking an illegitimate question based on a flawed model. The truth-conditionalist feels the expressivist is hand-waving away a hard, formal problem. The breakthrough might come from one character explicitly challenging the *metaphor* ("Why *must* meaning be contained? What if logic emerges from the dance?") or proposing a hybrid/integrated view, or pointing to a specific psychological finding about how we *actually* process "if murder is wrong..."
