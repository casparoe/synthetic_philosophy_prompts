  ### Key Rationale for Assessments:
  - **Decisive Defeaters**: Target the *conceptual necessity* claim. If process inspection doesn't access true causality (defeater 1) or outcome methods can provably enforce honesty (defeater 2), the position collapses. Observer-effect corruption (defeater 3) makes the method actively harmful.
  - **Awkward Evidence**: Highlights practical or correlational challenges but doesn't negate the epistemic argument. Process proponents can reframe these as implementation gaps or insufficient rigor.
  - **Concessions**: Necessary to avoid overclaiming. Outcome methods have domains of validity, and process verification faces real-world limits.
  - **Unfalsifiability**: The "not deep enough" retreat is a real vulnerability. Legitimate only if paired with objective standards for verification depth.
  - **Confidence**: Moderate because (a) the software analogy is robust, but (b) AI cognition may differ fundamentally in ways not yet understood (e.g., emergent deception). The position is strongest against current LLMs, weakest against future architectures with endogenous reasoning obscurity.

  The "defender's feared objection" is **defeater 1** (epiphenomenal representations), as it directly invalidates the foundational analogy to software auditing. If reasoning traces are confabulated, inspecting them is worse than useless—it creates false confidence.
