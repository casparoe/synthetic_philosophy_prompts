  ## The Frankfurt Gambit: Engineered Identities and the Persistent Ghost of Alternative Possibilities

  Frankfurt cases, those ingenious philosophical thought experiments featuring covert monitors poised to force an action should the agent waver, have long been deployed as a decisive counterattack against the Principle of Alternative Possibilities (PAP). PAP, in its simplest form, holds that an agent is morally responsible for an action only if they could have done otherwise. Frankfurt argued that in his scenarios – where the agent chooses the monitored action freely *without* the intervention activating – the agent *could not* have done otherwise (due to the hidden mechanism), yet intuitively *is* morally responsible. This, he claimed, proves PAP is false. Responsibility, it seemed, could reside solely in the actual sequence of events: the agent's own reasons, deliberation, and choice – a matter of **sourcehood** (the action genuinely originating from the agent's own will and character) rather than **leeway** (the availability of alternative courses of action). However, the case of **gradually engineered identification** – where an agent comes to fully endorse a harmful desire implanted through long-term, covert conditioning or neural modification – exposes a critical vulnerability in the sourcehood-only approach. It suggests that while Frankfurt cases may successfully sever responsibility from *simultaneous* alternative possibilities, they do not fully exorcise the need for alternative possibilities *altogether*; a revised principle incorporating *historical* leeway remains necessary to block responsibility in cases of profound manipulation.

  Frankfurt's core insight is compelling. In the classic Jones/Black case, Jones deliberates and chooses to vote for the fascist candidate for his own reasons. Black, the lurking neuroscientist, remains inert. Intuitively, Jones is blameworthy. Crucially, had Jones shown signs of voting differently, Black would have intervened, ensuring the fascist vote. Consequently, Jones *could not* have voted otherwise at the time of action. Since responsibility seems intact despite this lack of leeway, PAP appears refuted. Philosophers like John Martin Fischer and Mark Ravizza subsequently developed sophisticated "actual sequence" models of responsibility, focusing on **guidance control**. Here, responsibility hinges on the action issuing from the agent's own, moderately reasons-responsive mechanism. The agent must recognize reasons, and their mechanism must be capable of responding *differently* to *some* possible reasons, but crucially, *not* necessarily to the *actual* reasons present at the time. The emphasis shifts decisively from "could I have done otherwise *then*?" to "did this action *come from me*?"

  This sourcehood-centric view, however, confronts a profound challenge with **engineered identification**. Imagine "Patient Alpha": over years, through sophisticated, undetectable neural modulation and subtle environmental conditioning orchestrated by a malicious actor, Alpha develops a deep-seated desire to harm a specific group. The process is gradual. Alpha experiences the desire as arising internally, reflects on it, comes to endorse it as aligned with their evolving values (shaped by the process), and ultimately commits a harmful act based on this fully owned desire. According to a pure sourcehood account – like Frankfurt's own "hierarchical" model (acting on a desire you want to have) or deep self/endorsement views – Alpha seems responsible. The desire is reflectively endorsed; the action issues authentically from their current values and choices; the manipulation is causally remote and doesn't coerce the *act itself*. If sourcehood is sufficient, blame seems unavoidable.

  Yet, the intuition that Alpha is *not* responsible, or at least significantly less responsible, is powerful and persistent. Why? Because we recognize that the *source of the source* – the very character and values from which the action springs – was externally imposed through a process Alpha could not resist or detect. The problem isn't a lack of simultaneous alternatives *at the moment of action* (Alpha could, in theory, have chosen differently *then*, reflecting their current endorsed state). The problem lies in the *historical* trajectory: **Alpha lacked the ability to avoid becoming the kind of person who would endorse that desire and perform that action.** They had no alternative possibility *to resist the identity-forming manipulation itself*. This historical lack of leeway regarding the formation of their responsible agency undermines the legitimacy of holding them fully accountable for actions flowing from that engineered agency.

  Therefore, Frankfurt cases, while successfully challenging the necessity of *simultaneous* alternative possibilities, do not eradicate the need for alternative possibilities *conceptually*. They shift the locus of the requirement. The engineered identification case demands a **revised principle**:

  > **The Historical Principle of Alternative Possibilities (HPAP):** An agent S is morally responsible for action A performed at time T only if, at some relevant point *prior* to the development of the character/desires that directly led to A, S could have done something that would have prevented them from becoming an agent who would choose to do A at T (or at least, who would choose to do A *for the reasons they did*).

  HPAP incorporates sourcehood – the action must still genuinely flow from the agent's character at T – but adds a crucial historical leeway condition specifically designed to address manipulation. It asks: could S have avoided being *made* into this source? In standard Frankfurt cases, Jones *could* have resisted becoming the kind of person who votes fascist; his character formation wasn't manipulated. Jones's pre-manipulation history involved genuine alternative possibilities for moral development. Alpha, however, lacked *that* kind of leeway. The HPAP thus shields manipulated agents while preserving the Frankfurtian insight that responsibility for the *act itself* doesn't require flickering alternatives at the moment of choice.

  **Conclusion:** Frankfurt cases successfully demonstrate that moral responsibility does not require the ability to do otherwise *at the very moment of action* (simultaneous leeway). They effectively shift the focus to sourcehood within the actual sequence. However, the specter of alternative possibilities is not fully banished. The deeply troubling case of gradual, covert engineered identification reveals that a purely sourcehood-based account risks legitimizing responsibility for actions springing from an agency fundamentally corrupted by external forces. To preserve the intuition that we are not blameworthy for actions flowing from manipulated identities, we must retain a historical form of alternative possibilities. The **Historical Principle of Alternative Possibilities (HPAP)** provides this safeguard: true responsibility requires that we could have, at some prior point relevant to our character formation, avoided becoming the kind of person who would inevitably (or characteristically) perform the blameworthy act. Sourcehood is necessary, but without the historical leeway to have shaped the source itself in a minimally self-directed way, it is insufficient for full moral blameworthiness.

  **What Would Change My Mind?** My conclusion rests on the separability of sourcehood and historical leeway, and the intuitive force of non-responsibility in engineered identification. Two things could change my view:
  1.  **A Conceptual Argument for Inseparability:** A convincing demonstration that sourcehood *necessarily* entails historical leeway – that a genuinely self-originated action is *impossible* if the agent's character was shaped without any prior alternative possibilities for its development. If sourcehood conceptually requires an unmanipulated history involving some agential input shaped by alternatives, HPAP might be redundant.
  2.  **A Robust Real-World Parallel:** A clear analysis of a phenomenon like severe, long-term coercive persuasion in cults, or certain addiction recovery narratives, where individuals *do* seem legitimately blameworthy for harmful acts committed *after* they have fully internalized and endorsed manipulated desires/values *despite* lacking significant historical alternatives during the indoctrination period. If such cases convincingly show that deep identification *alone* grounds responsibility even with a manipulated origin, it would weaken the HPAP argument. However, most analyses of such cases tend to emphasize the *residual* agency or the *possibility* of resistance during the process, implicitly upholding the importance of historical leeway.

  Until such challenges materialize, the engineered identity scenario stands as a potent reminder that while Frankfurt clipped the wings of simultaneous PAP, the ghost of alternative possibilities still haunts the foundations of responsibility, demanding a place in our account of the self who originates the action.
