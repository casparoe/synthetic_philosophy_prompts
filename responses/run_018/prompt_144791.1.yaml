  The five positions I need to map are:
  - (a) Strict intention-based view (rejects outcome-tracking)
  - (b) Direct Buddhist consequentialism (aggregates welfare)
  - (c) Karmic-latency hybrid (outcomes matter through effect on agent's future)
  - (d) No-self block (rejects aggregation due to anatman)
