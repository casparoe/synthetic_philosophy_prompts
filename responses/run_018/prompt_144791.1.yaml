prompt: |-
  You are a professional philosopher specializing in comparative ethics and Buddhist philosophy. Before you construct the instrument, take a moment to brainstorm the logical space: list the distinctions that genuinely separate interpretations of Buddhist ethics—particularly around karma, mental intention (cetana), the doctrine of no-self (anatman), and skillful means (upaya)—rather than recycling the standard textbook labels.

  For my seminar on Buddhist ethics and consequentialism, I need a decision-tree taxonomy (not a list of named schools) that sorts someone’s actual commitments about whether, and how, outcome-based moral reasoning can be reconciled with Buddhist frameworks. The tree should start with concrete case judgments—e.g., whether a bodhisattva who kills one being with purely compassionate motivation produces a morally different result than one who does so from calculated welfare maximization; whether delayed karmic fruits count as present moral outcomes that justify harm; and whether consequentialist aggregation is coherent if there is no substantial self to serve as the locus of summed welfare—so that a respondent can answer without already knowing which view is which.

  Please build the tree with these constraints. First, lay out the branching questions: each node must be a single, answerable claim or case comparison, not a self-identification prompt like “are you a consequentialist?” Second, place the following positions at the leaves: (a) a strict intention-based view that rejects outcome-tracking altogether; (b) a direct Buddhist consequentialism that aggregates welfare across all affected beings; (c) a “karmic-latency” hybrid in which present outcomes matter only through their conditioning effect on the agent’s future mental continuum; (d) a “no-self block” that denies consequentialist calculus applies precisely because anatman undermines any unified subject to bear aggregated welfare; and (e) an upaya exception view that permits apparently harmful acts only when they express non-attachment rather than utility calculation. Third, map the logical combinations: note any unoccupied branch—especially whether direct welfare aggregation can consistently combine with the denial of a substantial self, and diagnose whether the gap is incoherent, unattractive, or merely unexplored. Fourth, flag any pair of leaves your included cases genuinely fail to separate. Fifth, provide a scoring key that translates answer patterns into leaf positions. Keep the tree to roughly six to eight nodes, avoid bibliographies or citations, and do not invoke obscure sectarian texts; build the taxonomy from concepts a student in this course could reason about from first principles.
