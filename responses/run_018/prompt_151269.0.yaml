       (a) *Gradual part replacement*: Over time, parts of a statue (e.g., a bronze statue) may be replaced without the statue ceasing to exist, while the lump of clay (or the matter) may be considered to have changed its parts.
       (b) *Destructive testing*: If a small part of the statue is removed for analysis (without destroying the artwork), the statue survives, but the lump of clay is diminished.
       (c) *Artistic restoration*: A statue that is damaged and then restored is typically considered the same statue, but the lump of clay (or the matter) may have undergone significant change.
       (d) *Formless intermediate states*: It is possible for the matter that constitutes a statue to exist in a state without the form (e.g., when the statue is melted down into a lump), and then be reshaped into a statue again.

  1.3 **Limits of Standard Arguments**:
     - Both camps agree that Leibniz's Law (the principle that if x and y are identical, then they share all properties) is valid. However:
