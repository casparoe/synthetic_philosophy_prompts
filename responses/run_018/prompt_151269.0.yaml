answer: |-
  ### Joint Statement: Adversarial Collaboration on the Ontology of Statues and Clay  
  **Between the Constitutional-Pluralist Camp and the Four-Dimensional-Monist Camp**  

  #### **1. Agreed Claims**  
  1.1 **Formal Ontology of Material Constitution**:  
  - Both camps accept that at any time \(t\), the statue and the lump of clay occupy identical spatial regions and share all material parts at \(t\).  
  - The pluralist posits a constitution relation \(C\) between the statue (\(S\)) and the lump (\(L\)), where \(C(S, L, t)\) is:  
    - Irreflexive: \(\forall x \forall t \neg C(x, x, t)\).  
    - Asymmetric: If \(C(S, L, t)\), then \(\neg C(L, S, t)\).  
    - Non-transitive: \(C(S, L, t)\) does not entail that \(C\) holds across chains (e.g., \(S\)-\(L\)-\(M\)).  
  - The monist denies distinct relata for \(C\) but accepts that "constitution" describes phase transitions in a single 4D object.  

  1.2 **Empirical Data Requiring Explanation**:  
  Both camps commit to explaining:  
  - **Gradual part replacement**: Sequential substitution of material parts (e.g., bronze statue repairs).  
  - **Destructive testing**: Removal of a small part (e.g., for analysis) that preserves the statue but alters the lump.  
  - **Artistic restoration**: Reconstruction of a damaged statue (e.g., reassembling fragments) that preserves artistic identity.  
  - **Formless intermediate states**: Existence of matter in a non-statue configuration (e.g., melted ingot) between statue phases.  

  1.3 **Limits of Leibniz’s Law Arguments**:  
  - **Established**: If \(S\) and \(L\) exhibit incompatible non-relational properties at a single time \(t\), they cannot be identical.  
  - **Not established**: Whether modal/temporal differences (e.g., "can survive flattening") are non-relational properties or reducible to:  
    - Temporal indexing (monist: properties hold relative to phases).  
    - Relational/historical properties (e.g., "is an artwork" depends on cultural context).  
  - **Contested**: Modal-difference premises (e.g., "\(L\) can survive flattening at \(t\) but \(S\) cannot") are disputed at the level of fundamentality.  

  ---

  #### **2. Disagreements Table**  
  | Dispute                 | Pluralist Formulation (a)                                                                 | Monist Formulation (b)                                                                                     | Point of Divergence (c)                                                                                             |  
  |-------------------------|-------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------|  
  | **Numerical distinctness** | "At \(t\), \(S\) and \(L\) are numerically distinct objects despite sharing all material parts."       | "At \(t\), ‘statue’ and ‘clay’ denote different temporal phases or perspectives on a single 4D object."    | Pluralism asserts two coincident entities; monism asserts one entity with phase-relative descriptions.              |  
  | **Persistence conditions** | "\(S\) persists iff its artistic form is preserved; \(L\) persists iff its matter is materially continuous." | "Persistence conditions are phase-conditions: a ‘statue-phase’ persists iff form is present; a ‘clay-phase’ persists iff matter is continuous." | Pluralism attributes persistence conditions to objects; monism attributes them to phases of a 4D worm.              |  
  | **Artistic properties** | "Being an artwork is an intrinsic property of \(S\) at \(t\) when statue-shaped."                     | "Being an artwork is a relational property of the 4D object’s statue-phase, dependent on historical context." | Pluralism takes artistic properties as intrinsic to objects; monism takes them as phase-relative relations.         |  
  | **Modal differences**   | "\(S\) and \(L\) have divergent modal profiles (e.g., \(S\) cannot survive flattening; \(L\) can)."   | "Modal properties are phase-indexed: the 4D object cannot survive flattening during a statue-phase but can during a clay-phase." | Pluralism grounds modal differences in distinct objects; monism grounds them in temporal phases of one object.      |  

  ---

  #### **3. Cruxes**  
  If any crux is settled decisively, at least one camp would revise its core position. Both camps pre-commit to the following:  

  3.1 **Are artistic-form properties intrinsic or relational?**  
  - **Decisive evidence**: An atom-for-atom duplicate of a statue created by random natural processes (e.g., lightning striking clay).  
    - *Pluralist prediction*: Not an artwork—artistic properties are intrinsic and require authorship.  
    - *Monist prediction*: Not an artwork—artistic properties are relational and require causal-historical context.  
  - **Agreement**: If the duplicate is uncontroversially an artwork, intrinsicism is falsified; if uncontroversially not, relationalism is falsified.  

  3.2 **Can coincident objects have divergent persistence conditions?**  
  - **Decisive evidence**: A scenario where two objects share parts at \(t\) but diverge modally (e.g., one survives form-destruction, the other does not) without contradiction.  
    - *Pluralist prediction*: Possible—coincidence does not entail identity of persistence conditions.  
    - *Monist prediction*: Impossible—persistence conditions are phase-descriptions of one object.  
  - **Agreement**: Demonstrable consistency proves pluralism; inconsistency proves monism.  

  3.3 **Is causal-historical continuity necessary for artwork identity?**  
  - **Decisive evidence**: A destroyed statue perfectly recreated from new matter with identical form and function.  
    - *Pluralist prediction*: Not the same artwork—causal continuity is necessary.  
    - *Monist prediction*: Not the same artwork—the 4D worm lacks spatiotemporal continuity.  
  - **Agreement**: Widespread intuition that it is the same artwork falsifies both; that it is not confirms both.  

  3.4 **Is ‘part’ indexed to an object’s kind?**  
  - **Decisive evidence**: A replaced part (e.g., a bronze patch) considered part of the statue but not the original lump.  
    - *Pluralist prediction*: Yes—parthood is kind-relative (the patch is part of \(S\) but not \(L\)).  
    - *Monist prediction*: No—parthood is absolute (the patch is part of the 4D object simpliciter).  
  - **Agreement**: Kind-relative parthood judgments confirm pluralism; absolute judgments confirm monism.  

