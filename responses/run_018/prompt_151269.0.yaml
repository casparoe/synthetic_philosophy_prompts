  #### **5. Verbal Disputes**  
  - **Verbal portion**: Disagreement over "object," "part," "survival," and "identity" when used without temporal or perspectival indexing.  
  - **Why verbal**: "Object" is ambiguous between:  
    - (Pluralist) A time-bound entity with kind-relative persistence conditions.  
    - (Monist) A maximal 4D spacetime worm.  
    Similarly, "part" and "survival" derive divergent meanings from this core ambiguity.  
  - **Neutral reformulation**: Replace "How many objects are present at \(t\)?" with:  
    - "Does the region at \(t\) contain one spacetime continuant with phase-dependent properties, or two continuants with distinct modal profiles?"  
    Replace "Does \(X\) survive?" with:  
    - "Is there continuity in the spacetime path satisfying the persistence conditions for \(X\)?"  

