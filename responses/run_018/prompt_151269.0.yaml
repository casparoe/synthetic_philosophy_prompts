  Both parties agree on the following:

  1.1 **Formal Ontology of Material Constitution**:
     - The pluralist camp holds that there is a constitution relation between the statue and the lump of clay. This relation is not identity. Both camps agree that the constitution relation is irreflexive, asymmetric, and non-transitive. Moreover, both camps accept that at any time t when the statue is constituted by the clay, the statue and the clay share all of their material parts at t and occupy the same spatial region at t. The monist camp, while not recognizing a constitution relation between two distinct objects, can accept a description of the one object as being in a "constituting state" (for the clay) and a "constituted state" (for the statue) at different temporal parts.

  1.2 **Empirical Data Requiring Explanation**:
