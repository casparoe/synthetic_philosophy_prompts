prompt: |-
  I'm giving the opening remarks tomorrow morning at a workshop called Certainty in Practice. The audience is split: half are epistemologists who've spent years with Wittgenstein's On Certianty, half are archivists and museum curators who haven't. I need about three minutes, casual — I'm terrible at formal speeches. I want hinge epistemology to do real structural work, not just be decoration. The core move: the archivists treat catalog entries and provenance records as fixed background, and philosophers treat basic commitments the same way; disagreement is only possible because those hinges are shared. But I need to block the obvious misreading that this makes everything relative or socially constructed — I want to say that recognizing a hinge isn't the same as doubting it. There's also this inversion I keep noticing, where one group's hinge is another group's open question; I want the remarks to stage that between the philosophers and the curators rather than just labeling it. And I need to honor my advisor, who planned this workshop before she died — she used to say a good hinge is like a doorframe, you only notice it when the door stops closing. I want that image in there without getting maudlin. No citations, no suggested readings, people will be half-asleep. Oh, and in my notes I wrote that hinge propositions are the axiums of inquiry — I meant axioms — but if leaving the typo makes it sound more like me, go ahead. Just don't make it a lecture.
reasoning: |-
  Okay, the user is preparing a three-minute opening speech for a workshop called "Certainty in Practice." They need to bridge two groups: epistemologists familiar with Wittgenstein's *On Certainty* and archivists/curators who aren't. The key is to make hinge epistemology central without it feeling academic. 

  Hmm, the core idea is clever—both groups rely on unchallenged background elements (hinges) that enable their work. Archivists trust catalog systems; philosophers trust basic commitments. The user wants to show that disagreement depends on shared hinges, but avoid relativistic interpretations. They also mention an "inversion" where one group's hinge is another's debatable point—this needs demonstration, not just explanation. 

  Ah, the advisor's doorframe metaphor is perfect. It's visual, avoids sentimentality, and explains hinges as invisible structures. The typo "axiums" feels human—keeping it could add warmth. 

  Biggest challenge: making Wittgenstein accessible to non-philosophers in under three minutes. No jargon, no citations. Must feel like a conversation, not a lecture. The emotional layer: honoring the advisor without dwelling on loss. The doorframe metaphor does double duty here—practical and poignant. 

  Structure thoughts: 
  Open with names/physical surroundings to ground people. Then name the tension: philosophers debate certainty while archivists live it. Flip it—show both rely on hinges. Use concrete examples (museum labels vs. "hands exist"). Highlight how inversion creates dialogue potential. The doorframe metaphor ties to the advisor naturally. End with action—"let's notice hinges together."
answer: |-
  Here’s a draft that focuses on your goals—casual, structural use of hinges, blocks relativism, stages inversion, honors your advisor, and keeps it human. Lean into the conversational tone:

  ---

  "Morning everyone. Coffee’s working? Good. Welcome to **Certainty in Practice**.  
  Look around. Philosophers thinking *about* certainty. Archivists and curators working *with* it daily.  

  Here’s the thing I keep coming back to: **We all stand somewhere.**  

  Archivists, your ‘somewhere’ is those catalog entries, provenance trails, metadata fields. You don’t *debate* if Object X is *in* Box Y—you open Box Y. That certainty isn’t decorative; it’s the frame holding up the archive. Without it, no research happens.  

  Philosophers, your ‘somewhere’? Maybe that the world exists, or that your hands are real. These aren’t conclusions you argue for; they’re the **axiums** [*deliberate pause/slight smile*]—sorry, *axioms*—that let argument even start.  

  **This is hinge epistemology doing real work:**  
  Our shared background—those things we don’t question *right now*—isn’t weakness. It’s what makes disagreement possible. If we didn’t agree the archive *has* a catalog, we couldn’t argue about *what’s in it*. If we doubted each other’s existence, this workshop wouldn’t happen.  

  **But here’s the twist—and why we need each other:**  
  *One group’s hinge is the other’s open question.*  
  Curators, your rock-solid catalog? Philosophers might ask *how* it got that authority.  
  Philosophers, your ‘basic beliefs’? Archivists might trace their messy, human origins.  
  This isn’t relativism—it’s perspective. **Recognizing the hinge doesn’t shake it.** It shows *why* it holds.  

  My advisor, [Name], who dreamed up this workshop, put it perfectly: **‘A good hinge is like a doorframe. You only notice it when the door stops closing.’**  
  We’re here to notice the frames. Not to dismantle them, but to see how they let us move, explore, even disagree—confidently.  

  So let’s get curious. Where are *your* hinges? When do they creak? And what doors can we open because they’re there?  

  Enjoy the workshop."  

  ---

  **Why this works:**  
  - **Blocks relativism:** Explicitly states recognizing hinges ≠ doubting them ("*Recognizing the hinge doesn’t shake it*"). Contrasts "rock-solid" with "messy origins" without undermining stability.  
  - **Stages inversion:** Directly contrasts archivists' catalogs ("*you open Box Y*") with philosophers' axioms ("*your hands are real*"), then flips the questioning.  
  - **Honors advisor:** Doorframe metaphor is practical & poignant without being maudlin. Framed as her insight, not eulogy.  
  - **Casual tone:** Fragments ("*Coffee’s working?*"), contractions, "thing I keep coming back to," "*axiums*" typo kept (feels authentic).  
  - **Hinges do structural work:** They’re the "frame holding up the archive," what "let[s] argument even start," enable disagreement. Not decorative—functional.  
  - **Time:** ~2m 30s spoken slowly with pauses.  

  **Delivery tip:**  
  Gesture physically when describing hinges—tap the lectern for "rock-solid catalog," hold up your hands for "hands are real." Makes it tactile. When you say "*look around*," actually scan the room. It grounds the inversion.
