  ### Leaves  
  - **Leaf A (Repeated, unconditional):** No gain from switching. The growth rate of wealth is identical for always switching or never switching under any unconditional policy.  
    *Awkward commitment:* Ignores potential state-dependent opportunities in repeated play.  
  - **Leaf B (Ex-ante, infinite expectation):** Switching gains nothing. No finite expectation exists for comparison; symmetry implies indifference.  
    *Awkward commitment:* Cannot justify switching even if ex-post gains seem evident.  
  - **Leaf C (Ex-ante, finite expectation):** Switching gains nothing. Symmetry ensures equal expected value for swapping or not.  
    *Awkward commitment:* Overrules ex-post reasoning that might suggest gains.  
  - **Leaf D (Ex-post, accept 1.25):** Switch: expected value of the other envelope is 1.25 times your amount.  
    *Awkward commitment:* Implies perpetual switching (as the same logic applies after swapping), causing a contradiction.  
  - **Leaf E (Ex-post, reject 1.25):** Switching gains nothing. Without distributional knowledge, symmetry holds; swapping is rationally permissible but not required.  
    *Awkward commitment:* Permits arbitrary decisions with no guidance for action.  
  - **Leaf F (Ex-post, known, gain > 0):** Switch: the conditional expected gain is positive (e.g., below a threshold in finite cases).  
    *Awkward commitment:* Vulnerable to heavy-tailed distributions where expectations diverge.  
  - **Leaf G (Ex-post, known, gain ≤ 0):** Do not switch: the conditional expected gain is non-positive (e.g., at or above a threshold).  
    *Awkward commitment:* Fails if the distribution is misspecified or discontinuous.  

