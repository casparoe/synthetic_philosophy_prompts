  ## AFTERLIFE ORIGINALS: POSTHUMOUS NARRATIVE RIGHTS LICENSING AGREEMENT (STANDARD TERMS)

  **THIS AGREEMENT** ("Agreement") is entered into by and between the undersigned Grantor(s) ("Grantor"), acting in their capacity as the legally recognized executor, administrator, or heir(s) with testamentary authority over the tangible and intangible property of the deceased individual ("Subject"), and AFTERLIFE ORIGINALS, LLC ("AO"), a Delaware limited liability company. This Agreement governs the licensing of certain Posthumous Narrative Rights (as defined below) related to the Subject.

  **1. Definitions**
      1.1. **"Posthumous Narrative Rights" (PNRs):** Refers to the non-exclusive, transferable right to depict, dramatize, fictionalize, represent, and commercially exploit the life story, persona, biographical details, relationships, significant experiences, and perceived character traits of the Subject within audiovisual works produced or distributed by AO or its licensees.
      1.2. **"Licensed Materials":** Includes authorized access to personal correspondence, diaries, photographs, audio/video recordings, and other tangible or digital artifacts provided by the Grantor to AO for the purpose of developing and producing Licensed Works.
      1.3. **"Licensed Work(s)":** Any film, series, documentary, docudrama, or other audiovisual narrative content produced or distributed by AO utilizing the PNRs licensed hereunder.
      1.4. **"Epistemic Misrepresentation":** The deliberate and material fictionalization or alteration within a Licensed Work of documented core beliefs, values, or ideological positions demonstrably held by the Subject during their lifetime, where such alteration serves dramatic convenience rather than narrative coherence based on available evidence, and which a reasonable viewer would likely interpret as reflecting the Subject's actual viewpoint.
      1.5. **"Dignitary Interest":** An intangible interest pertaining to the Subject’s posthumous reputation, legacy, and the perceived integrity of their life narrative as presented to the public, as understood within applicable legal frameworks and cultural norms.

  **2. Grant of Rights**
      2.1. Grantor hereby grants to AO, its successors, assigns, and licensees, a worldwide, perpetual, irrevocable (subject to Clause 7), and royalty-bearing license to utilize the PNRs for the development, production, distribution, marketing, and exploitation of Licensed Works in all media now known or hereafter devised.
      2.2. This grant includes the right to adapt, fictionalize, composite characters, and create derivative works based upon the Subject's life and PNRs, provided such adaptations comply with the restrictions herein, particularly Clauses 3 and 5.

  **3. Epistemic Fidelity & Restriction on Misrepresentation**
      3.1. AO acknowledges that Epistemic Misrepresentation constitutes a material breach of this Agreement. Grantor retains the right to review final shooting scripts and rough cuts of Licensed Works specifically to identify potential instances of Epistemic Misrepresentation concerning the Subject.
      3.2. AO shall make reasonable, good faith efforts, utilizing Licensed Materials and reputable biographical sources, to ensure that depictions of the Subject's fundamental beliefs, motivations in key documented decisions, and publicly stated positions are not materially distorted in a manner constituting Epistemic Misrepresentation.
      3.3. Dramatic compression, dialogue creation for scenes lacking verbatim records, or the omission of non-material beliefs shall not, in themselves, constitute Epistemic Misrepresentation. The standard rests on material alteration of *core* documented ideological or belief structures.

  **4. Commodification of Private Experience & Grief**
      4.1. Grantor expressly acknowledges and agrees that by licensing PNRs under this Agreement, aspects of the Subject's life experiences, including those previously considered private, familial, or encompassed within the Grantor's own sphere of grief, are transferred into the public domain of exploitable narrative content for AO.
      4.2. AO's utilization of such experiences, relationships, or expressions of grief within Licensed Works, even if previously private, shall not be deemed an invasion of privacy or infliction of emotional distress upon the Grantor, provided such utilization is within the scope of the licensed PNRs and does not otherwise violate this Agreement. The Grantor licenses not only the Subject's story but also the associated emotional and relational context as narrative raw material.

  **5. Moral Integrity & Dignitary Interest**
      5.1. While AO retains creative discretion under Clause 2.2, it agrees to accord reasonable weight to the Subject’s potential Dignitary Interest in its production decisions. AO shall avoid depictions that a significant portion of the contemporary public would find gratuitously degrading or that constitute libel per se *against the Subject*, as distinct from dramatic interpretation.
      5.2. This clause pertains solely to the potential reputational interests of the Subject as an entity distinct from the Grantor's sensibilities. Enforcement is limited to preventing depictions constituting legally cognizable defamation of the deceased where applicable law permits such claims, or clear violations of Clause 3. Dissatisfaction with dramatic tone or artistic interpretation, absent Epistemic Misrepresentation or defamation, does not constitute a breach.

  **6. Transferability & Heir Succession**
      6.1. The license granted herein is freely transferable and assignable by AO without further consent from Grantor. AO may sublicense PNRs to third-party producers, distributors, or platforms.
      6.2. Grantor's rights and obligations under this Agreement, including the entitlement to royalties and the right to review for Epistemic Misrepresentation pursuant to Clause 3.1, shall bind and inure to the benefit of Grantor's heirs, successors, executors, and administrators ("Successors").
      6.3. Successors inherit the benefits and burdens of this Agreement. Disputes arising between multiple Successors regarding the exercise of rights hereunder (e.g., approval of script changes requested under Clause 3.1) are the sole responsibility of the Successors to resolve internally; AO is only obligated to respond to directives from a Successor holding demonstrable majority authority or a valid court order binding all relevant parties.

  **7. Termination**
      7.1. This Agreement is perpetual and irrevocable *except* for material breach by AO. The sole grounds for Grantor or Successors to seek termination are:
          (a) Persistent and uncured Epistemic Misrepresentation across multiple Licensed Works despite formal notification and opportunity to cure;
          (b) Non-payment of royalties due and owing after cure period; or
          (c) AO's dissolution or cessation of operations without assignment of its obligations. Termination does not affect rights in Licensed Works already produced and distributed.

  **8. Governing Law & Dispute Resolution**
      8.1. This Agreement shall be governed by the laws of the State of Delaware, without regard to conflict of laws principles. Any dispute arising under this Agreement, including claims related to Epistemic Misrepresentation or Dignitary Interest, shall be settled by binding arbitration in Wilmington, Delaware, under the rules of the American Arbitration Association.

  ---
  **Explanatory Note: Underlying Philosophical Positions**

  This satirical Agreement embeds genuine philosophical debates within a corporate framework. Here’s a breakdown of the intuitions and contested views referenced:

  *   **Settled Moral Intuitions (Broadly Shared):**
      *   **Fraud/Bad Faith (Clause 3):** Most agree deliberately lying about core historical facts (like changing a known abolitionist into a slaveholder) is wrong. The Agreement frames this as "Epistemic Misrepresentation" – a breach akin to contractual fraud, resting on the intuition that knowingly misrepresenting fundamental truths is harmful/deceptive, even about the dead.
      *   **Protecting Vulnerable Heirs (Implied in Clause 4 & 6):** The idea that grief-stricken or financially desperate heirs might be exploited into signing away sensitive rights reflects a shared concern for protecting the living from predatory contracts.
      *   **Truth in Commerce (Clause 3):** The requirement for "good faith efforts" based on evidence touches on an expectation of basic honesty in commercial representations, even within dramatizations.

  *   **Genuinely Contested Philosophical Positions:**
      *   **Do the Dead Have Interests? (Clauses 3, 5):** This is the core debate. Joel Feinberg argued the dead *can* be harmed (e.g., by broken promises or defamation affecting their reputation-as-lived). Others (like Epicurus or contemporary figures like Steven Luper) argue death ends existence and thus the capacity for interests or harm. Clause 5 ("Dignitary Interest") directly invokes Feinberg's concept, while framing "Epistemic Misrepresentation" as a breach implicitly assumes the Subject *has* an interest in not having core beliefs misrepresented posthumously. **There is no consensus here.** The Agreement treats these interests as *potentially* real and contractually relevant, which is a contested stance.
      *   **Can Consent Be Given Posthumously? (Entire Agreement):** The premise of licensing "rights" from heirs assumes heirs can legitimately consent *for* the deceased. This is highly contested. Does ownership of physical artifacts (diaries) grant moral authority over the *narrative* of a person's life and beliefs? Many philosophers argue it does not; the Agreement satirizes the common industry practice that assumes it does.
      *   **Is Dramatization Harmful? (Clauses 3, 4, 5):** Even if the dead have interests, is *changing details for drama* inherently harmful? Does it matter if it's a core belief (Clause 3) vs. a minor detail? Does turning private grief into public spectacle (Clause 4) wrong the *deceased* (violating a past interest in privacy) or only the living heirs? These are active areas of debate in narrative ethics and bioethics. The Agreement treats Epistemic Misrepresentation as uniquely harmful, reflecting one side of this debate.
      *   **Commodification of Personhood (Clause 4):** The clause bluntly stating private grief becomes "narrative raw material" highlights the ethical concern that licensing such rights commodifies intimate aspects of human life and relationships in ways many find objectionable, regardless of harm to the dead. While the *extent* of this wrong is contested, the underlying intuition that some things shouldn't be for sale is widely recognized.

  The satire works by presenting contested philosophical positions (especially about posthumous interests and the legitimacy of heir consent) as settled, operationalized corporate clauses within an inherently exploitative system ("grave-robbing with better lighting"), while grounding the breach conditions in stronger, more widely shared intuitions about deception and exploitation of the living.
