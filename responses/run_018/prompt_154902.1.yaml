  Compare the coherence-based account of moral bias, which treats a preference as biased when it conflicts with an agent's own more reflective and stable commitments upon careful consideration, with the genealogical account, which treats a preference as biased when it originates from a causal history—such as adaptive social conditioning or institutional pressure—that the agent would reject upon becoming fully aware of it. Focus in particular on whether these two accounts can systematically diverge: for instance, can a preference be fully coherent with an agent's broader value system yet genealogically suspect, or genealogically innocent yet incoherent with the agent's other commitments? Evaluate which account, if either, offers a more reliable way to distinguish a genuine moral preference from a bias that merely presents itself as one, using concrete illustrative cases rather than abstract taxonomy alone. In your response, clearly separate what is settled about these frameworks from what remains genuinely contested among specialists, and avoid presenting any contested interpretation as the consensus position. Please write in American English.
