  ok so my parents just finalized this awful decades-long negotiation over the farm and watching it I realized the centipede game isn't broken because people are irrational — it's broken because the agent at round 20 isn't identical to the agent at round 1, so backward induction has no stable subject to apply to. I'm presenting this at the philosophy dept colloquium next thursday. Audience is mostly philosophers of action who think rational choice is just applied logic, plus two behavioral economists who run actualy centipede experiments, plus my advisor who basically wrote the book on common knowledge framing in games. I need a Q&A prep sheet: the eight objections I'll actually get, ordered by damage, phrased in thier vocabulary, each with a two-minute reply and an honest note on where I'm soft. Include the one I'm praying nobody asks — probably whether I'm just projecting my parents' divorce onto decision theory. Don't ask for a bibliography or citation list; I'm writing this on a train with spotty wifi. Stick to stuff that's in the standard literature but twist it; don't invoke some obscure 1987 working paper nobody's memorized. There's a typo in here somewhere but you get the idea.
