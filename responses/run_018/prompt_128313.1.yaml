  Final prep sheet will weaponize the audience's jargon against them. Behavioral econ folks hate being told they missed a cognitive bias? Good—point out that identity instability *is* the bias. Philosophers love logic? Show backward induction's circularity when "agent" isn't a fixed term. Advisor cares about common knowledge? Argue that identity flux makes common knowledge impossible to establish.  

