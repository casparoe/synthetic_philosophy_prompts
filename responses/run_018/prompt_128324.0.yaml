prompt: |-
  hey, quick question about bayesian confirmation and the old-evidence thing. i get that if you've already observed E then P(E|K) is 1, so the bayes factor is 1 and H gets no boost. but people treat this like a deep problem only because they lock K in place. what if you just do counterfactual conditioning: you ask what your credence in E would've been under a prior state K* where you hadnt seen it yet, then run the ratio P(E|H,K*) over P(E|~H,K*)? that'd restore confirmation for mercury's orbit supporting GR even after einstein already knew the data. if bayesians reject that move, isnt it just a weird metaphysical hangup about not revising your epistemic past? it feels like the whole old-evidence problem is a pseudoproblem made up by people who confuse diachronic coherence rules with actual rationality constraints. am i missing something obvious? please answer in american english.
