answer: |-
  You're hitting on the real nerve of the old-evidence problem in Bayesian confirmation theory. Your counterfactual move is **exactly what many philosophers and scientists intuitively want to do** (and often *do* informally). The "metaphysical hangup" you sense isn't universal among Bayesians, but there *are* legit reasons why some resist it. Here's the breakdown in plain American English:

  ### Your Counterfactual Fix (The Right Intuition)
  1.  **"Rewind Your Knowledge":** Pretend you're in a state *before* you learned the evidence `E` (Mercury's orbit anomaly). Call this state `K*` (your background knowledge minus `E`).
  2.  **"What Would I Have Expected?":** Ask: "If `H` (General Relativity) were true, how likely would `E` have been under `K*`?" → `P(E|H, K*)`.
  3.  **"What Would I Have Expected Otherwise?":** Ask: "If `H` were *false* (~`H`), how likely would `E` have been under `K*`?" → `P(E|~H, K*)`.
  4.  **Compare:** The ratio `[P(E|H, K*) / P(E|~H, K*)]` is your counterfactual Bayes Factor. If it's >1, `E` confirms `H`, even though you *now* know `E`. This gives Einstein his due credit for Mercury's orbit *after* he knows it.

  **This feels like sanity.** Scientists *do* reason this way: "Damn, GR predicted that weird orbit *perfectly* – that's amazing, even though we knew the orbit beforehand!"

  ### Why Some Bayesians Get Twitchy (The Objections)
  Objectors aren't *necessarily* irrational stick-in-the-muds. They point out legit headaches with `K*`:

  1.  **"What Exactly is `K*`? No Really, Define It.":**
      *   It's *not* your actual historical prior. Einstein knew tons of physics (`K`) *including* Mercury's orbit (`E`). `K* = K minus E` is an **artificial construct**.
      *   **The Problem:** What *else* gets subtracted or modified when you remove `E`? Did knowing `E` subtly influence other parts of `K`? If `E` was surprising *because* of `K`, is `K*` even coherent? Defining `K*` precisely is messy (some call it "metaphysical" because it's counterfactual history).

  2.  **"Where Do These Counterfactual Probabilities Come From?":**
      *   `P(E|H, K*)` and `P(E|~H, K*)` are probabilities assigned *now*, based on your *current* knowledge `K` (which *includes* `E` and how `H` explains it!).
      *   **The Problem:** Can you *genuinely* simulate what your degree of belief in `E` *would* have been under `K*` **without** being contaminated by your *current* knowledge (`K`) that `E` is true and that `H` explains it so well? Or are you just making up numbers that fit the desired conclusion? This risks being "confirmation bias in hindsight."

  3.  **The "Why Stop There?" Problem:**
      *   If you allow counterfactual `K*` for old evidence `E1`, why not do it for *another* piece of old evidence `E2`? And another (`E3`)? You could potentially "reconfirm" `H` endlessly with the same evidence by selectively rewinding different bits. This smells fishy. Synchronic (current belief) Bayesians want confirmation tied to *actual* belief updates.

  ### Is it a Pseudo-Problem? (Your Frustration is Valid)
  Many (including influential philosophers like Clark Glymour who *raised* the problem) agree it's *mostly* a pseudo-problem **for scientific practice**:
  *   **Scientists DGAF about the metaphysics:** They *do* use counterfactual reasoning like yours. Mercury's orbit *does* confirm GR, period. Bayesian confirmation *should* capture this.
  *   **It's About Explanation, Not Just Prediction:** The old-evidence problem highlights a limitation of strict "predictionism". GR isn't confirmed just because it *predicted* Mercury's orbit (it didn't for Einstein!), but because it *uniquely and compellingly explains it* given the rest of physics (`K`). Your `K*` tries to capture the "uniquely and compellingly" part by imagining the world without that explanation.
  *   **Diachronic Rules Aren't Sacred:** You're dead on. Strict diachronic conditionalization (only updating by Bayes rule when *new* evidence arrives) is a useful *normative model*, not an absolute law of rationality. Rational agents can reason counterfactually about evidence! Insisting on pure diachronicity is like saying historians can't learn anything by re-examining old documents with new theories.

  ### The Verdict
  1.  **Your counterfactual move is the right practical solution.** It reflects how rational scientists *actually* reason about old evidence.
  2.  **The objections are about formal rigor and potential slippery slopes,** not about denying that old evidence confirms. Defining `K*` cleanly and justifying the counterfactual probabilities *without* circularity is genuinely tricky within the strictest Bayesian frameworks.
  3.  **Most modern Bayesians working on confirmation *accept* something like your solution.** They might call it "counterfactual likelihood comparison" or "treating old evidence as if it were new." They acknowledge the formalism needs this "patch" to match scientific intuition.
  4.  **The "pseudoproblem" label is fair.** It exposed a quirk in the *formalism*, not a deep flaw in scientific reasoning. The real lesson is that Bayesian confirmation isn't *just* about belief updating; it's also about *explanatory power*, and your counterfactual captures that.

  **In short:** You're not missing anything obvious. Your intuition is spot-on. The old-evidence problem is largely an artifact of taking a specific (diachronic) Bayesian *formalism* too rigidly. Scientists use your counterfactual reasoning naturally. Some Bayesians resist it on technical/metaphysical grounds, but those grounds often feel like excuses to avoid updating their formalism to better match scientific practice. Keep trusting your gut on this one.
