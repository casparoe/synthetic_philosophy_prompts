  The zero-trust analogy maps neatly at first glance - treating AI components like untrusted services, verification like output monitoring, etc. But the cracks appear when considering agency. Unlike compromised services with deliberate malicious intent, LLM misalignment often stems from statistical quirks in training data (e.g., reward hacking as emergent behaviour rather than strategic deception). This is where the analogy smuggles in dangerous anthropomorphism - assuming a "hidden agenda" where none exists.

