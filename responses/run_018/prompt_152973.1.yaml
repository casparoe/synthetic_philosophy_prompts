prompt: |-
  You are a senior reproductive-ethics consultant at a regional fertility center, and you need a reusable decision framework for evaluating requests for preimplantation genetic testing and experimental targeted germline editing. You have about forty-five minutes per consultation, your notes must survive review by a hospital ethics board that includes non-philosophers, and you cannot resolve deep metaphysical disputes in real time. The framework must translate two commitments into an operational procedure: first, the principle of procreative beneficence, understood as a reason to select the child expected to have the best life measured against a plural but bounded conception of well-being rather than any single metric; second, the constraints of liberal eugenics, meaning institutional neutrality among reasonable conceptions of the good life, a strict prohibition on coercive or socially compelled selection, and special caution wherever the selected trait is identity-constituting for existing communities.

  Turn these commitments into a step-by-step procedure your team can actually run: list the questions to ask in fixed order; specify what counts as a sufficient answer to each; identify the exact points where the procedure stops with a clear recommendation (support, conditional support, defer, or decline); and flag explicitly where a question is irreducibly one of values rather than clinical or predictive fact, so that the board or the parents must decide. Mark which steps are judgment calls dressed as procedure. The framework must handle hard cases: selection for traits whose value depends on contested social contexts; interventions with multi-generational effects that alter the range of lives available to descendants; and requests that define the best life using metrics the future child might reject.

  Then apply the procedure to three proposals:

  1. A couple requests germline editing to reduce a known high-penetrance variant for early-onset familial Alzheimer's, with no other intended modifications.
  2. A couple enrolled in a long-duration isolated space-mission program requests selection for a heritable variant associated with extreme emotional resilience to prolonged solitude, a trait highly valued by mission architects but not by mainstream social norms.
  3. A deaf couple requests selection for congenital deafness, arguing that deafness is not a disability but a cultural identity, and that hearing children born into Deaf families often face social isolation; the procedure must address whether best life can be defined in a way that respects this claim without collapsing into pure parental preference.

  In at least one case the procedure should yield a recommendation that conflicts with the parents' stated preference, and you must explain how the framework justifies that conflict without violating liberal neutrality. Finally, state clearly what the procedure cannot do: for instance, resolving the non-identity problem, adjudicating between genuinely incommensurable conceptions of flourishing, or substituting for democratic deliberation about which traits should be socially encouraged.
reasoning: |-
  We are creating a decision framework that must be operational, time-efficient, and ethically robust. The framework is based on two commitments: procreative beneficence (understood as selecting the child expected to have the best life according to a plural but bounded conception of well-being) and liberal eugenics (institutional neutrality, no coercion, and caution with identity-constituting traits).

  The procedure must be step-by-step, with fixed order of questions, criteria for sufficient answers, and clear stopping points with one of four recommendations: Support, Conditional Support, Defer, or Decline.

  Key principles to embed:
  1. Procreative beneficence: We are not maximizing a single metric but considering a bounded pluralism of well-being. We must avoid imposing a single conception of the good life.
  2. Liberal eugenics constraints: 
     a. Neutrality: Do not favor any reasonable conception of the good life.
     b. No coercion: The selection must be freely chosen by the parents without societal pressure.
     c. Special caution for identity-constituting traits: Extra scrutiny when the trait is central to an existing community's identity.

  The framework must handle:
  - Traits with contested social value
  - Multi-generational effects altering the range of lives available to descendants
  - Requests that define "best life" in a way the future child might reject

  We break the procedure into distinct steps. At each step, we either proceed or stop with a recommendation. We flag steps that are value judgments disguised as procedure and steps that require input from the ethics board or parents because they are irreducibly about values.

  ---

  **Decision Framework: Step-by-Step Procedure**

  **Step 1: Initial Screening for Medical and Legal Compliance**
     - **Question:** Does the request involve a genetic intervention that is currently illegal or not medically approved for the stated purpose in this jurisdiction? 
     - **Sufficient Answer:** Provide documentation of legal and regulatory compliance (e.g., FDA/EMA approval for the specific indication, or institutional review board approval for experimental interventions). If the intervention is illegal or not approved for the stated purpose, stop and **Decline**.
     - **Note:** This step is primarily factual. However, if the intervention is in a legal gray area, it may require deferral to the ethics board.

  **Step 2: Clarification of the Trait and Intervention**
     - **Question:** Precisely what trait(s) are being selected for or against? What is the specific genetic variant and the method (PGT or germline editing)? What is the expected effect on the child?
     - **Sufficient Answer:** A clear description of the trait, the variant, the intervention, and the expected phenotypic outcome. If the trait is not well-defined or the intervention is not technically feasible, stop and **Decline**.
     - **Note:** This step is factual (clinical/genetic). If the intervention is experimental and not yet proven, we may need to defer for further review.

  **Step 3: Assessment of Harm and Benefit (Procreative Beneficence Core)**
     - **Question:** Based on available evidence, what is the expected impact of the trait on the child's well-being? Consider both the magnitude and probability of harms and benefits across a plural but bounded set of well-being domains (physical health, cognitive functioning, emotional stability, social integration, etc.). 
     - **Sufficient Answer:** A balanced assessment that weighs the evidence in each domain. If the trait is expected to cause severe harm (e.g., life-threatening illness, extreme pain) without countervailing benefits, then the intervention to avoid that trait is supported. Conversely, if the trait is expected to confer significant benefits without substantial harms, then selection for it is supported. However, if the trait's impact on well-being is highly contested or context-dependent, proceed to Step 4.
     - **Stopping Point:** 
          - If the trait is unambiguously harmful (e.g., early-onset fatal disease) and the intervention reduces that harm, recommend **Support** (if all other steps are passed). 
          - If the trait is unambiguously beneficial (e.g., resistance to a common serious disease) and the intervention confers that benefit, recommend **Support** (if all other steps are passed). 
          - If the trait's impact is ambiguous, proceed to Step 4.
     - **Note:** This step requires judgment. We must avoid imposing a single metric. The bounded pluralism means we consider a range of domains but exclude conceptions of well-being that are unreasonable (e.g., those that would require extreme suffering). We are not maximizing but ensuring the child has a life above a threshold of well-being.

  **Step 4: Social Context and Identity-Constituting Traits (Liberal Eugenics Caution)**
     - **Question:** Is the trait identity-constituting for an existing community? And does the intervention (whether for or against the trait) risk undermining that community or coercing individuals within it?
     - **Sufficient Answer:** An analysis of whether the trait is central to a recognized community (e.g., Deaf culture for deafness) and whether the intervention would be seen as a rejection of that community. Also, consider if the request is driven by social pressure (e.g., to conform to mainstream norms) or by free parental choice.
     - **Stopping Point:** 
          - If the trait is identity-constituting and the intervention would likely harm the community (e.g., by reducing the number of members) or if the request is driven by coercion (social or institutional), then **Decline** or **Defer** to the ethics board for further review. 
          - If the trait is identity-constituting but the parents are part of that community and are freely choosing the intervention (e.g., selecting for deafness in a Deaf family), then proceed to Step 5.
          - If the trait is not identity-constituting, proceed to Step 5.
     - **Note:** This step is value-laden and requires cultural sensitivity. It directly addresses the liberal eugenics constraint of avoiding harm to communities and ensuring non-coercion.

  **Step 5: Multi-Generational and Non-Identity Considerations**
     - **Question:** Does the intervention have effects beyond the immediate child? Specifically, could it alter the range of lives available to future descendants (e.g., by introducing heritable changes) or create non-identity problems (where the intervention changes the identity of the child)? 
     - **Sufficient Answer:** An assessment of the heritability of the change and the potential long-term consequences. For germline editing, this is inherent. Also, note that if the intervention changes the genetic identity of the child, then the non-identity problem arises (we are choosing a different child). 
     - **Stopping Point:** 
          - If the intervention is heritable (germline editing) and the trait is not unambiguously beneficial (from Step 3) and/or is identity-constituting (Step 4), then **Defer** to the ethics board for a more thorough review of long-term implications. 
          - If the intervention is not heritable (e.g., PGT) or the trait is unambiguously beneficial and not identity-constituting, then proceed to Step 6.
     - **Note:** We cannot resolve the non-identity problem, but we can flag cases where the intervention creates a different child. We must be cautious about altering the gene pool without strong justification.

  **Step 6: Parental Autonomy and Future Child's Autonomy**
     - **Question:** Is the parents' conception of the "best life" for the child one that the child might reasonably reject? And does the intervention allow the child sufficient autonomy to form their own conception of the good life?
     - **Sufficient Answer:** Consider whether the selected trait would foreclose major life options or force the child into a specific life path. Also, consider if the trait is essential for the child to have a minimally decent life (if so, then it may be justified). 
     - **Stopping Point:** 
          - If the trait would severely restrict the child's future autonomy (e.g., selecting for a trait that commits the child to a specific career or lifestyle without their consent) and is not necessary for health, then **Decline**. 
          - Otherwise, if all previous steps are passed, recommend **Support** or **Conditional Support** (if there are unresolved issues that require monitoring or further consent).
     - **Note:** This step is inherently about values. We must balance parental autonomy with the future child's autonomy. We cannot guarantee the child will agree with the parents, but we can avoid interventions that would make it impossible for the child to choose a range of reasonable life paths.

  **Step 7: Final Check for Unresolved Issues**
     - **Question:** Are there any remaining concerns that have not been addressed? This includes unresolved value conflicts, technical uncertainties, or social implications that require broader societal deliberation.
     - **Sufficient Answer:** If any step required deferral to the ethics board, then we **Defer**. If there are technical uncertainties, we may recommend **Conditional Support** (e.g., with ongoing monitoring). If the request involves a trait that society is actively debating (e.g., intelligence enhancement), then we **Defer** for broader societal input.
     - **Recommendation:**
          - If all steps are passed without requiring deferral or decline, then **Support**.
          - If there are conditions that can be met (e.g., additional counseling, waiting for further evidence) then **Conditional Support**.
          - If the issue requires input beyond the clinic (e.g., societal debate, policy change) then **Defer**.
          - If any step resulted in a decline, then **Decline**.

  ---

  **Application of the Framework to the Three Proposals**

  **Case 1: Germline editing to reduce early-onset familial Alzheimer's**

  - Step 1: The intervention is for a serious medical condition. Assuming it is legally approved for this indication (or under experimental protocol with IRB approval), proceed.
  - Step 2: The trait is a high-penetrance variant for early-onset Alzheimer's. The intervention is germline editing to remove that variant. Expected effect: the child and their descendants will not inherit the variant, avoiding the disease.
  - Step 3: The trait (having the variant) unambiguously causes severe harm: progressive dementia and early death. Avoiding it is a clear benefit. **Support** at this step (if the intervention is safe and effective).
  - Step 4: Alzheimer's is not identity-constituting for any community. Proceed.
  - Step 5: The intervention is heritable (germline editing). However, since the harm is unambiguous and severe, the long-term benefit outweighs the caution. Proceed (with note that germline editing requires careful oversight, but in this case, the benefit is clear).
  - Step 6: The child is not being forced into a specific life path; they are being spared a devastating disease. Their autonomy is enhanced by having a longer, healthier life.
  - Step 7: No unresolved issues. **Recommendation: Support**.

  **Case 2: Selection for emotional resilience to prolonged solitude for a space mission**

  - Step 1: Assuming PGT for this variant is legally permissible (though not for a traditional medical condition), proceed.
  - Step 2: Trait: a heritable variant associated with extreme emotional resilience to prolonged solitude. Intervention: PGT (selecting embryos with the variant). Expected effect: the child would have enhanced resilience in isolated environments.
  - Step 3: The impact on well-being is ambiguous. In the context of a space mission, it may be beneficial (preventing mental health issues). But in mainstream society, extreme resilience to solitude might lead to social detachment or difficulty forming relationships. We cannot say unambiguously that it is beneficial. Proceed to Step 4.
  - Step 4: The trait is not identity-constituting for a recognized community (unless the space mission community is considered, but it is not a traditional cultural group). However, we must check for coercion: are the parents freely choosing, or are they pressured by the mission program? The question says they are enrolled in the program, so there may be institutional pressure. We must be cautious. If there is evidence of coercion (e.g., the mission requires this trait for participation), then **Decline**. Otherwise, proceed.
  - Step 5: Since this is PGT (not germline editing), the change is not heritable beyond the child. However, note that the child is being selected for a specific trait that may not be beneficial in all contexts. Proceed to Step 6.
  - Step 6: The trait may restrict the child's autonomy. The parents are selecting a child for a specific environment (space mission) that the child may not choose. The child might reject the life of an astronaut and desire deep social connections. This is a significant concern. **Decline** because the child's future autonomy is unduly restricted by selecting for a trait that is only beneficial in a very specific context that the child might not choose.
  - Step 7: **Recommendation: Decline** because of Step 6 (and possibly Step 4 if coercion is present). The framework justifies this without violating liberal neutrality: we are not imposing a conception of the good life but ensuring that the child has the opportunity to choose among a range of reasonable life plans. Selecting for a trait that is only valuable in a niche environment (and potentially detrimental elsewhere) fails to respect the child's future autonomy.

  **Case 3: Selection for congenital deafness by a deaf couple**

  - Step 1: Assuming PGT for deafness is legally permissible (though controversial), proceed.
  - Step 2: Trait: congenital deafness. Intervention: PGT to select an embryo with the variant for deafness. Expected effect: the child will be deaf.
  - Step 3: The impact on well-being is contested. Mainstream society views deafness as a disability (reducing access to communication, increasing risks). However, within Deaf culture, it is a valued identity. We cannot unambiguously say it is harmful in all contexts. Proceed to Step 4.
  - Step 4: Deafness is identity-constituting for the Deaf community. The parents are part of that community and are freely choosing. However, we must be cautious: selecting for deafness might be seen as harming the child by mainstream standards. But under liberal eugenics, we must be neutral among reasonable conceptions. The key question: is the parents' choice coercive to the child? The parents argue that a hearing child in a Deaf family might face isolation. This is a complex value judgment. 
       - We note that the child will be part of the Deaf community and have access to its support. However, the child might later reject that identity and wish to integrate into the hearing world. But being deaf would make that harder. 
       - We must also consider: is the Deaf community's conception of flourishing reasonable? It is, as it provides a rich cultural life. But we must also acknowledge that deafness imposes physical limitations (e.g., inability to hear alarms, difficulty in emergencies). 
       - The framework requires special caution. We might **Defer** to the ethics board because of the identity-constituting nature and the contested well-being impact. However, we proceed to Step 5 to complete the analysis.
  - Step 5: PGT does not have multi-generational effects beyond the child (unless the child later has children, but they might be deaf by chance or choice). The non-identity problem: by selecting a deaf child, we are creating a different child than we would otherwise. This is inherent in PGT. We cannot resolve it, but we note it. Proceed.
  - Step 6: The child might reject deafness. They might wish they could hear. But the parents argue that in their family and community, the child will flourish. However, the child's autonomy is restricted by being deaf: they cannot easily choose to live in the hearing world without significant barriers. This is a severe restriction. On the other hand, a hearing child in a Deaf family might also face challenges (isolation). 
       - The framework must balance: does being deaf allow the child a sufficiently open future? The mainstream view is that it does not (because of the barriers). The Deaf community view is that it does (with sign language and community). 
       - This is a value conflict that the procedure cannot resolve. Therefore, we must **Defer** to the ethics board and/or require additional counseling for the parents. 
  - Step 7: Due to the unresolved value conflict and the identity-constituting nature, we **Defer** to the ethics board. The framework does not automatically decline because the parents' conception of the good life is reasonable, but the impact on the child's autonomy is significant. The board must weigh the cultural context against the physical limitations.

  However, note: the framework might lead to a **Decline** if the ethics board determines that the child's well-being (across a bounded pluralism) is unacceptably compromised by deafness. But in the spirit of liberal neutrality, we should respect the parents' cultural choice unless it clearly falls below a threshold of well-being. The bounded pluralism excludes conceptions that would allow for severe harm. Deafness, with modern accommodations, does not necessarily fall below that threshold. Therefore, the board might conditionally support the request with requirements (e.g., ensuring the child will have access to all available accommodations and technologies, and that the parents commit to supporting the child if they later wish to use hearing aids or cochlear implants). 

  But in the procedure, we **Defer** because it is a judgment call that requires broader input.

  ---

  **What the Procedure Cannot Do**

  1. **Resolve the non-identity problem**: When an intervention results in a different child being born, we cannot say whether the child is better or worse off because they wouldn't exist otherwise. We can only note the issue and proceed with caution.
  2. **Adjudicate between genuinely incommensurable conceptions of flourishing**: If two reasonable conceptions of the good life conflict (e.g., Deaf culture vs. mainstream health norms), the procedure flags the conflict but cannot resolve it. It must defer to the ethics board or broader societal deliberation.
  3. **Substitute for democratic deliberation**: The framework is for individual cases. It cannot decide which traits should be socially encouraged or discouraged at a policy level. That requires public debate and legislation.
  4. **Predict the future**: The assessment of well-being is based on current evidence and social contexts, which may change.
  5. **Eliminate all bias**: Despite neutrality, the bounded pluralism of well-being might reflect the dominant culture's values. We try to minimize this by including diverse perspectives on the ethics board.

  ---

  **Summary of Recommendations for the Cases:**

  1. **Alzheimer's case: Support** - Clear medical benefit without significant downsides.
  2. **Space resilience case: Decline** - The trait is context-specific and may unduly restrict the child's future autonomy.
  3. **Deafness case: Defer** to ethics board - Due to the identity-constituting nature and the value conflict about well-being and autonomy.

  In the space resilience case, the framework justifies declining without violating liberal neutrality by focusing on the child's future autonomy (a core element of liberal eugenics) and the bounded conception of well-being that requires the child to have access to a range of reasonable life plans. The framework does not favor any particular conception of the good life but insists that the child must be able to choose among them.
answer: |-
  ### Decision Framework for Preimplantation Genetic Testing and Germline Editing  
  **Operational Principles:**  
  1. **Procreative Beneficence (PB):** Select the child expected to have the "best life" based on a *plural but bounded* conception of well-being (e.g., physical health, psychological resilience, social integration, cognitive capacity). Excludes conceptions violating minimal thresholds of well-being (e.g., extreme suffering, incapacity for basic agency).  
  2. **Liberal Eugenics (LE):**  
     - *Institutional Neutrality:* Do not favor any reasonable conception of the good life.  
     - *Anti-Coercion:* Reject interventions driven by social pressure or eugenic mandates.  
     - *Identity-Constituting Traits:* Heightened scrutiny for traits central to marginalized communities (e.g., Deafness).  

  **Step-by-Step Procedure**  
  *Time: 45 min/consult. Fixed order; stops at clear decision points (Support, Conditional Support, Defer, Decline).*  

  #### **Step 1: Medical Necessity and Feasibility**  
  - **Question:** "Is the intervention medically feasible and reliable for the stated purpose? What is the evidence for safety/efficacy?"  
  - **Sufficient Answer:** Peer-reviewed data or consensus guidelines confirming feasibility. If experimental, IRB-approved protocol required.  
  - **Stop & Decline:** If unsafe, unreliable, or scientifically unvalidated.  
  - **Judgment Call Alert:** None (clinical fact-based).  

  #### **Step 2: Harm-Benefit Assessment (PB Core)**  
  - **Question:** "Does the trait significantly increase the risk of *severe harm* (e.g., early death, extreme pain, loss of basic agency) or confer *robust benefits* across multiple well-being domains?"  
  - **Sufficient Answer:**  
    - **Harm:** High-penetrance variants linked to severe, early-onset disease.  
    - **Benefit:** Traits with broad, context-independent advantages (e.g., disease resistance).  
  - **Stop & Support:** If trait unambiguously reduces severe harm (e.g., lethal disease).  
  - **Stop & Defer:** If evidence is inconclusive or context-dependent (e.g., resilience traits).  
  - **Value Flag:** "Severe harm" and "basic agency" are value-laden but bounded by medical consensus (e.g., WHO disability criteria).  

  #### **Step 3: Identity and Coercion Check (LE Core)**  
  - **Question:** "Is the trait identity-constituting for an existing community? Is the request driven by parental autonomy or external coercion?"  
  - **Sufficient Answer:**  
    - Identity-constituting: Trait is culturally defining (e.g., Deafness) and linked to a community with shared language/norms.  
    - Coercion: Pressure from institutions, employers, or family dynasties (e.g., "designer baby" mandates).  
  - **Stop & Decline:** If coercion is confirmed.  
  - **Stop & Defer:** If trait is identity-constituting (to ethics board).  
  - **Judgment Call Alert:** Defining "community" and "coercion" requires cultural sensitivity.  

  #### **Step 4: Autonomy and Future Openness (PB + LE)**  
  - **Question:** "Could this trait foreclose the child’s ability to pursue reasonable conceptions of the good life? Does it respect future autonomy?"  
  - **Sufficient Answer:**  
    - **Red Flag:** Traits that eliminate major life options (e.g., inability to form relationships, avoid extreme suffering).  
    - **Green Flag:** Traits that expand options (e.g., disease prevention) or align with family/community context.  
  - **Stop & Decline:** If trait severely constrains future autonomy (e.g., selecting for solitude resilience in non-isolated contexts).  
  - **Value Flag:** "Reasonable conceptions" and "future autonomy" are value-judgments; defer to parents/board if contested.  

  #### **Step 5: Multi-Generational Impact**  
  - **Question:** "Does the intervention alter the gene pool or restrict life choices for descendants?"  
  - **Sufficient Answer:**  
    - Germline edits: Documented risks of off-target effects or reduced genetic diversity.  
    - Social effects: Traits that could limit descendants’ opportunities (e.g., extreme biological specialization).  
  - **Stop & Conditional Support:** If edits are corrective (e.g., disease prevention) with monitoring.  
  - **Stop & Decline:** If edits promote traits that could enforce narrow social roles (e.g., caste-based selection).  
  - **Judgment Call Alert:** Predictive uncertainty about future societies.  

  #### **Step 6: Parental Narrative Check (LE Safeguard)**  
  - **Question:** "Is the parents’ definition of ‘best life’ consistent with a bounded pluralism of well-being, or does it impose a single metric (e.g., intelligence, obedience)?"  
  - **Sufficient Answer:** Parental justification must reference plural well-being domains (e.g., "resilience aids mental health and relationships," not "we want a genius").  
  - **Stop & Defer:** If parents insist on a single metric conflicting with PB (e.g., selecting for high IQ alone).  
  - **Value Flag:** Parents/board must resolve conflicts between parental values and PB’s bounded pluralism.  

  #### **Final Recommendation Logic**  
  - **Support:** Passes all steps without defer/decline triggers.  
  - **Conditional Support:** Requires monitoring (e.g., experimental edits) or parental counseling.  
  - **Defer:** Ethics board review needed for value conflicts or insufficient data.  
  - **Decline:** Fails Steps 1, 3 (coercion), 4 (autonomy violation), or 5 (harm to descendants).  

  ---  
  ### Application to Cases  
  #### **Case 1: Germline Editing for Familial Alzheimer’s**  
  - **Step 1:** Supported (feasible for high-penetrance variants).  
  - **Step 2:** **Support** (prevents severe harm: early dementia/death).  
  - **Step 3:** Not identity-constituting or coercive.  
  - **Step 4:** Enhances autonomy (reduces disease burden).  
  - **Step 5:** **Conditional Support** (germline edits require long-term monitoring).  
  - **Step 6:** Aligns with PB (health is bounded well-being domain).  
  - **Outcome: Conditional Support** (due to experimental nature).  

  #### **Case 2: Selection for Solitude Resilience**  
  - **Step 1:** Supported (PGT feasible for known variant).  
  - **Step 2:** **Defer** (resilience benefits are context-dependent; not intrinsically harmful but not universally beneficial).  
  - **Step 3:** **Decline** (trait not identity-constituting, but mission architects’ influence risks institutional coercion).  
  - **Stop at Step 3: Decline**  
  - **Justification:** Violates LE’s anti-coercion principle. Mission pressure compromises parental autonomy. PB does not override LE constraints.  

  #### **Case 3: Selection for Congenital Deafness**  
  - **Step 1:** Supported (PGT feasible).  
  - **Step 2:** **Defer** (Deafness imposes physical/social barriers but is not unambiguously "severe harm" due to cultural context).  
  - **Step 3:** **Defer to Ethics Board** (Deafness is identity-constituting; community flourishing vs. physical limitation conflict).  
  - **Step 4:** **Decline** (limits child’s autonomy: cannot access sound-centric experiences, emergency alerts, or choose hearing culture).  
  - **Stop at Step 4: Decline**  
  - **Justification:**  
    - PB’s bounded pluralism excludes traits that foreclose *basic agency* (e.g., navigating environments safely).  
    - LE neutrality respects Deaf culture but cannot override PB’s minimal well-being threshold (e.g., physical safety).  
    - Conflict: Parents’ "best life" definition (cultural belonging) vs. child’s future autonomy (hearing world access).  

  ---  
  ### What the Framework Cannot Do  
  1. **Resolve the non-identity problem:** Cannot adjudicate whether selecting a "different child" (e.g., deaf vs. hearing) is harm/benefit.  
  2. **Adjudicate incommensurable values:** When conceptions of flourishing are irreconcilable (e.g., Deaf cultural integrity vs. hearing physical capability), the framework flags the conflict but requires societal deliberation.  
  3. **Predict social evolution:** Cannot foresee whether a trait (e.g., solitude resilience) will be valued in future societies.  
  4. **Substitute for democracy:** Trait prioritization (e.g., "Is deafness a disability?") requires public debate, not clinical arbitration.  
  5. **Guarantee child’s agreement:** Parents’ "best life" metric may conflict with the child’s future values; framework minimizes but cannot eliminate this risk.  

  **Framework Integrity:** Balances PB and LE by:  
  - Using medical consensus to bound "well-being."  
  - Rejecting coercion while respecting parental autonomy within pluralism.  
  - Prioritizing autonomy when identity-constituting traits risk physical/social exclusion.
