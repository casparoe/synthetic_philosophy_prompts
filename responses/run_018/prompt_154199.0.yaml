answer: |-
  ### Translation of Epistemicism and Supervaluationism into Dependent Type Theory

  #### **Epistemicism (Williamson)**
  **Core Claim**: A sharp boundary exists (e.g., a specific grain count \(n\) where \(n\)-grain heaps are heaps, but \((n+1)\)-grain heaps are not). We are *ignorant* of this boundary.

  **Type-Theoretic Translation**:
  - **Predicate as Type Family**:  
    Model "is a heap" as a type family `Heap : ℕ → Type`, where `Heap k` is the type of proofs that a \(k\)-grain collection is a heap.
  - **Sharp Boundary**:  
    There exists a specific \(n : ℕ\) such that:
    - For \(k \leq n\), `Heap k` is inhabited (e.g., by a canonical proof `heap_k`).
    - For \(k > n\), `¬ Heap k` (i.e., `Heap k → ⊥`) is inhabited.
  - **Ignorance**:  
    The exact \(n\) is unknown. This is modeled as:
    - **Unknown Parameter**: Fix a context with a hidden \(n : ℕ\) and a secrecy axiom (e.g., `isHidden : (n : ℕ) → Type`, with no computational access to `n`).  
      - `Heap k` is defined as `Σ (n : ℕ), isHidden n × (k ≤ n)` but this is inconsistent with ignorance of \(n\).  
    - **Oracle**: Postulate a non-computable function `f : ℕ → Bool` and define:  
      ```coq
      Heap k := f k = true   -- Proof-relevant: Heap k is inhabited iff f k = true
      ```
      Ignorance means `f` is not constructively definable; proofs of `Heap k` are opaque.
  - **Ignorance in Proof-Relevance**:  
    Truth requires proof; ignorance means we lack constructive access to the proof term for `∀k, Heap k ∨ ¬ Heap k` at the boundary. Classical LEM is smuggled in via:
    ```coq
    Axiom LEM_Heap : ∀ (k : ℕ), (Heap k) + (¬ Heap k).  -- Non-constructive
    ```

  **Residue Report**:
  1. **Clean Translation**:  
     - The sharp boundary as a fixed \(n\) translates to an unknown parameter or oracle.
     - Ignorance as computational opacity of the proof/oracle.
  2. **Distortion**:  
     - Bivalence requires `LEM_Heap`, violating proof-relevance. Without it, we cannot assert `Heap k ∨ ¬ Heap k` for all \(k\).
     - Sorites tolerance (`∀k, Heap k → Heap (k+1)`) is false but unlocatable; this requires non-constructive existence of a counterexample \(n\) with no witness.
  3. **No Expression**:  
     - Epistemicism’s *metaphysical determinacy* (boundary exists mind-independently) lacks a type-theoretic correlate. Types are defined by proof rules, not hidden facts.

  ---

  #### **Supervaluationism (Fine/Keefe)**
  **Core Claim**: Truth is relative to admissible precisifications. "Heap" is true iff true in all precisifications, false iff false in all, indeterminate otherwise.

  **Type-Theoretic Translation**:
  - **Admissible Precisifications as Refinements**:  
    Define a type `Prec` of admissible precisifications. Each `s : Prec` is a sharp predicate `Heap_s : ℕ → Type` with:
    - **Decidability**: `∀s k, (Heap_s k) + (¬ Heap_s k)`.  
    - **Constraints**: Respects clear cases (e.g., `Heap_s 0`, `¬ Heap_s 1000`).
  - **Supertruth**:  
    `SuperHeap k := Π (s : Prec), Heap_s k`  
    `SuperNotHeap k := Π (s : Prec), ¬ Heap_s k`  
    Indeterminacy: Cases where neither holds.
  - **Indeterminacy as Proof Absence**:  
    For borderline \(k\), we have:  
    `¬(SuperHeap k) × ¬(SuperNotHeap k)`, which reduces to:  
    `(Σ (s : Prec), ¬ Heap_s k) × (Σ (s' : Prec), Heap_s' k)`.

  **Residue Report**:
  1. **Clean Translation**:  
     - Precisifications as refinements (`Prec`), supertruth as dependent product.
     - Indeterminacy as the lack of a uniform proof across `Prec`.
  2. **Distortion**:  
     - "Admissible" constraints (e.g., tolerance in non-borderline regions) may map to type classes or universes, but risk collapsing into gradual typing if constraints are too weak.
     - Classical gluts/gaps are avoided; indeterminacy is proof-irrelevance *between* precisifications, but type theory forces proof-relevance *within* each.
  3. **No Expression**:  
     - Supervaluationism’s "truth in virtue of meaning" for constraints lacks an analog. Type constraints are syntactic, not semantic.
     - The sorites tolerance principle is superfalse, but its universal quantification over `Prec` doesn’t capture the vague "seems true" intuition.

  ---

  ### **Hybrid Constructive Epistemicism: Assessment**
  **Proposal**: A sharp boundary exists, but it is *constructively undefined*—the inductive definition of `Heap` lacks a decision procedure, and valid extensions assign different cutoffs.

  **Comparison**:
  - **Epistemicism?**: No—no unique hidden \(n\); cutoffs vary by extension.  
  - **Supervaluationism?**: Yes—the "extensions" are precisifications.  
    - **Key Distinction**: The hybrid treats extensions as *constructive possibilities* (consistent with the definition), while supervaluationism treats them as *semantic completions*.  
    - **Coherence**: The hybrid collapses into supervaluationism unless:  
      - Extensions are not "admissible" by meaning (but by logic), or  
      - A unique boundary exists but is unknowable (back to epistemicism).  

  **Type-Theoretic Distinction**:
  - **Epistemic Ignorance**: `Σ (n : ℕ), isHidden n × (Heap iff k ≤ n)` (non-constructive).  
  - **Constructive Underdetermination**: `Prec` as a type of decidable extensions of an inductive `Heap` definition.  
    - Example: `Heap` defined inductively for \(k = 0\), monotonicity broken at some \(n\), but \(n\) not fixed.  
    - Distinction fails if "admissible" = "constructively extendible".  

  **Residue-Driven Verdict**:
  - **Collapse**: The hybrid is supervaluationism if "extensions" = "admissible precisifications".  
  - **Framework Limitation**: Type theory cannot distinguish "unknowable boundary" (epistemicism) from "no boundary" (supervaluationism) without classical axioms. Proof-relevance forces underdetermination to be about proof multiplicity (supervaluationism), not hidden facts.  

  ---

  ### **Conclusion**
  - **Epistemicism**: Requires smuggling in classical logic (LEM) for bivalence; ignorance is non-constructive opacity.  
  - **Supervaluationism**: Naturally maps to proof-relevant quantification over precisifications; indeterminacy is proof absence.  
  - **Hybrid**: Collapses into supervaluationism—the "constructive extensions" *are* precisifications.  
  - **Residue Insight**:  
    The untranslatable elements (metaphysical determinacy, semantic admissibility) reveal that the debate relies on classical or semantic assumptions alien to proof-relevant type theory. **Vagueness in type theory is inherently supervaluationist**.
