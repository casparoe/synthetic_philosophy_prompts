  also inject this niche idea: the tax might actually enforce a hidden 'domestic productivity norm' — the belief that every room you have should be justified by labour-market participation, so your home itself becomes a site of employability optimisation. analyse whether this norm holds up, and whether the bedroom tax shows that welfare conditionality has moved from 'seek work' to 'your private life must be arranged for work'.

