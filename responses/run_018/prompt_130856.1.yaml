  For the prep sheet, sequencing is critical. The deadliest objection must target the actual derivation step where Fitch's contradiction arises under graded closure. Showing residual paradox vulnerability would undermine everything. Subsequent points should cascade from technical to conceptual, ending with the omniscience relocation issue they specifically requested as #5.

