  ### Key Distinctions & Diagnosed Gaps:
  1. **Aspect-Pluralism vs. Modal-Pluralism**:  
     - **Aspect-pluralism** (Q1 "Yes") requires the object itself to bear multiple facets (e.g., the self has a "permanent feature" and a "distinct changeable feature").  
     - **Modal-pluralism** (Q2 "Yes") requires multiple conditions of access (e.g., time, relation, perspective) to a single reality (e.g., the self has one nature that appears permanent in one context, changeable in another).  
     - *Convergence warning*: Both may use "standpoints" or "respects," but Q1/Q2 force separation: Q1 focuses on object-structure; Q2 on access-conditions.  

  2. **Gaps in the Logical Space**:  
     - **Aspect-pluralism with bivalent truth for unqualified claims** (e.g., asserting "The self is permanent" without specifying feature X) is **incoherent**. If aspects co-exist, unqualified claims imply simultaneous contradiction (e.g., "permanent" and "changeable" in the *same* respect). Hence, this combination is absent—it collapses into contradiction.  
     - **Aspect-pluralism with modal valuation** (e.g., treating aspects as "perspectives") is **unattractive but explorable**. It risks conflating object-multiplicity with access-multiplicity, but could be coherent if aspects are framed as "modes of being." Not mapped here to maintain clarity.  
     - **Modal-pluralism with aspect-like truth** (e.g., conditions of access creating "facets" in the object) is **occupied by perspectival realism (Leaf 3)**, but only when truth is bivalent per perspective. If truth is non-bivalent (Leaf 4), it becomes epistemic humility.  

  3. **Leaves Explained**:  
     - **Leaf 1 (Aspect-pluralism, bivalent)**: Qualified claims (e.g., "permanent in feature X") are straightforwardly true. The object is composite, but each aspect-specific claim is binary-true.  
     - **Leaf 2 (Classical Jain)**: Seven-fold predication (e.g., "in some respect, permanent; in some respect, not") denies bivalence. Truth is intrinsically partial and relational.  
     - **Leaf 3 (Perspectival realism)**: Each access-condition (e.g., a specific time or relation) yields a complete, binary-true description. Reality is unified but accessed via irreducible standpoints.  
     - **Leaf 4 (Epistemic humility)**: Claims under any condition are approximate or incomplete. No commitment to objective multifacetedness; contradiction is avoided by rejecting absolute truth.  
     - **Leaf 5 (Semantic-contextualism)**: Contradiction is linguistic; unqualified claims are elliptical (e.g., "permanent" always implies an unstated "in respect X").  

