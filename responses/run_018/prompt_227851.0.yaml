  ### Activity Design: "The Surprise Lockdown Drill"

  #### **Conceptual Overview**
  This activity recreates the surprise exam paradox through a 3-round game (representing Monday, Tuesday, Wednesday). Participants ("Students") must predict whether a "lockdown drill" occurs each day while avoiding surprise (failing to predict it) or false alarms (predicting it incorrectly). A "Principal" (scheduler) commits to a hidden schedule in advance. The paradox arises when Students use backward induction to eliminate all days, yet the drill occurs on an "eliminated" day (e.g., Tuesday), surprising them. This creates visceral tension between reasoning and reality.

  #### **Setup & Rules**  
  1. **Materials**:  
     - Index cards (one per Student per round, for predictions).  
     - One envelope + sheet of paper (for Principal’s schedule).  
     - Pens.  
     - Whiteboard or paper to track scores.  

  2. **Roles**:  
     - **Principal**: One participant (ideally someone familiar with the paradox). Secretly writes the drill day (e.g., "Tuesday") on paper, seals it in an envelope, and gives it to the facilitator. Rejoins as a Student but avoids leading discussions.  
     - **Students**: All other participants. Try to maximize points by predicting drills correctly.  
     - **Facilitator**: Explains rules, enforces timing, reveals outcomes, and tallies scores.  

  3. **Game Flow** (3 rounds = 3 days):  
     - **Start of Day**: Students discuss for 5 minutes: "Can the drill happen today as a surprise?"  
     - **Predictions**: Each Student writes on an index card:  
       - `Drill today?` (Yes/No).  
       - `Belief` (Which days are still possible? e.g., "Tue, Wed").  
     - **Outcome**:  
       - Facilitator checks the envelope.  
       - If the drill is scheduled for that day, it occurs. If not, no drill.  
     - **Scoring** (per Student, per round):  
       - Drill occurs + you predicted `Yes`: **+1 point** (not surprised).  
       - Drill occurs + you predicted `No`: **-1 point** (surprised).  
       - No drill + you predicted `Yes`: **-1 point** (false alarm).  
       - No drill + you predicted `No`: **0 points** (correct non-prediction).  
     - **Principal’s Bonus**:  
       - Drill occurs + at least one Student is surprised: **+5 points**.  
       - Drill never occurs: **-5 points** (invalidates the announcement).  

  4. **Key Mechanics**:  
     - The Principal **commits in advance** (schedule is sealed). This mirrors the original puzzle’s "believed announcement" and ensures the drill is fixed, not adaptive. An adversarial/adaptive scheduler would undermine the announcement’s truth, while a committed one forces Students to confront the paradox when reality defies their elimination.  
     - **Backward induction emerges organically**: Students debate eliminating days (e.g., "Wednesday can’t work because if it’s the last day, we’ll predict it!"). The facilitator does not intervene—let them reason themselves into a contradiction.  
     - **Stakes**: Pride-based scoring. Publicly track points to incentivize engagement.  

  #### **Timeline** (Total: 75 min)  
  - **Introduction (5 min)**:  
    - *Script*: "We’re simulating a 3-day week. A lockdown drill will occur on exactly one day. Your goal: predict if it happens each day to avoid penalties. The drill will be a surprise—you shouldn’t deduce it must happen that morning. Points reward accurate predictions. One of you is the Principal; they’ve already chosen the day secretly. Let’s begin."  
    - *Do not name the paradox*.  

  - **Monday (15 min)**:  
    - Discussion (5 min): Students chat freely. (Likely: No days eliminated; drill could be any day).  
    - Predictions (5 min): Write cards. Collect and hold.  
    - Outcome (5 min): Facilitator reveals outcome (usually no drill). Update scores.  

  - **Tuesday (15 min)**:  
    - Discussion (5 min): Students debate backward induction. (Likely: Some argue "Wednesday is impossible, so it must be today!").  
    - Predictions (5 min): Write cards.  
    - Outcome (5 min): If scheduled, reveal drill. Most will be surprised if drill occurs. Update scores.  

  - **Wednesday (15 min)**:  
    - Discussion (5 min): If drill hasn’t occurred, Students realize it must be Wednesday.  
    - Predictions (5 min): Write cards.  
    - Outcome (5 min): Reveal outcome. Update scores.  

  - **Scoring & Transition to Debrief (5 min)**: Tally points. Announce "winner."  

  - **Debrief (20 min)**:  
    - Reveal the paradox’s name. Use guided questions:  
      1. "When did you eliminate Wednesday? Why did that feel logical?" → Links to induction’s first step.  
      2. "If you eliminated all days, how did the drill still happen?" → Highlights the contradiction.  
      3. "Who was surprised on Tuesday? Why didn’t you predict it?" → Maps to the cascade failing in reality.  
      4. "How did the Principal’s sealed schedule affect your trust?" → Reflects the announcement’s role.  
    - **Honest Limitations**:  
      - The activity cannot reproduce the **self-referential semantic loop** of the original announcement. IRL, "it will be a surprise" refers to itself, creating a logical contradiction. Here, the rule is externally enforced, avoiding this loop but weakening the paradox’s "inevitability."  
      - Students may not fully eliminate days due to imperfect reasoning (unlike idealized agents). This is a feature: it shows how human frailty "saves" them from the paradox, but the debrief connects it to the theoretical cascade.  

  #### **Known Failure Modes & Mitigation**  
  - **Participants game payoffs**: E.g., always predict "drill" to avoid surprise.  
    - *Mitigation*: False alarms penalize this (-1 point). Use public scores to shame over-prediction.  
  - **Refusal to update beliefs**: E.g., "I never eliminated Wednesday!"  
    - *Mitigation*: In debrief, contrast holdouts with those who eliminated days. Ask: "Did group pressure influence you?"  
  - **Scheduling drift**: Principal picks Monday (no surprise) or forgets to seal schedule.  
    - *Mitigation*: Brief the Principal secretly: "Choose Tuesday to maximize your bonus." Use a sealed envelope for rigor.  
  - **Time overrun**: Discussions run long.  
    - *Mitigation*: Strict 5-minute timers. Facilitator interrupts firmly.  

