prompt: |-
  As a journalist who covers emerging science, I need a reusable editorial procedure for deciding whether a researcher's claim is assertible in a published story, grounded in the philosophy of assertion — specifically the debate over whether assertion requires knowledge, mere true belief, justified belief, or some intermediate norm such as reasonable belief. The deliverable should be an ordered checklist that an editor can run in minutes: the questions to ask in sequence, what counts as a sufficient answer at each stage, where the procedure stops with a clear rejection, and where it must defer to human judgment because the competing norms themselves diverge. The procedure must distinguish empirical claims, interpretive claims, and predictive claims; it must handle expert disagreement within a field and technically true assertions that mislead through framing; and it must state explicit stopping rules. Then apply the procedure to three cases: a climate scientist offering a specific regional temperature projection for 2050; a psychologist asserting a causal mechanism for a behavioral effect on the basis of a single pre-registered study; and a historian arguing that a recently discovered archival document requires revising a standard narrative. Be sure to include one case in which the procedure produces an answer a science editor would likely resist, and clearly flag every point at which judgment cannot be eliminated.
reasoning: |-
  Okay, the user is a science journalist who covers emerging science. They need a reusable editorial procedure to decide if a researcher's claim can be asserted in a published story. This has to be grounded in the philosophy of assertion, considering debates around whether assertion requires knowledge, true belief, justified belief, or reasonable belief. The deliverable is an ordered checklist that an editor can use quickly, with clear steps, sufficient answers, rejection points, and where human judgment is needed. It also needs to handle different types of claims and expert disagreements.

  Breaking down the requirements: The procedure must distinguish empirical, interpretive, and predictive claims. It should address expert disagreement and technically true but misleading statements. Explicit stopping rules are crucial. Then, I need to apply it to three cases: a climate scientist's regional projection for 2050, a psychologist's causal claim from one pre-registered study, and a historian revising a narrative based on a new document. One case should challenge a science editor's typical stance.

  First, I'll outline the philosophical norms since that's the foundation. The key norms are: Knowledge (KNA - requires truth, belief, and justification), Reasonable Belief (RBNA - justified and non-negligent), Justified True Belief (JTBN - similar to knowledge but without Gettier issues), and Justified Belief (JBN - justification regardless of truth). For journalism, Reasonable Belief seems most practical because it balances rigor with the need to report timely information without guaranteeing absolute truth.

  Now, building the checklist. It should be sequential: start with identifying the claim type, then assess its nature, check for misleading framing, evaluate support, handle disagreements, and apply norms. Each step needs clear questions, sufficient answers, rejection criteria, and judgment points. I'll organize it in phases with stopping rules to make it efficient.

  For claim types: Empirical is about observable facts, interpretive about meaning, predictive about future events. This affects the evidence required. For example, predictions need probabilistic framing.

  Handling misleading framing is important. Even if technically true, if the context distorts understanding, it might need rejection or reframing. Expert disagreement requires assessing consensus levels—majority view vs. significant minority.

  Stopping rules: Reject if evidence is insufficient, claim is misleading, or lack of justification. Defer to judgment when norms conflict or in cases of legitimate disagreement.

  Applying to the cases:
  1. **Climate scientist projection for 2050**: Predictive claim with models. Models have consensus, so assert with probabilistic language. Judgment needed on framing to avoid overconfidence.
  2. **Psychologist's causal mechanism**: Empirical claim from one study. Pre-registration reduces bias but one study isn't enough. Reject as a standalone causal claim; suggest tentative language. This might resist editors who favor novel findings.
  3. **Historian's narrative revision**: Interpretive claim. New document adds evidence but requires peer validation. Assert as a challenge needing more review, not a definitive revision.

  I need to ensure the procedure is practical. Editors need speed, so each step should be quick. Highlighting judgment points where philosophy doesn't give clear answers, like when reasonable belief is met but other norms aren't, or in framing decisions.

  Finally, the checklist must be reusable and clear. Testing it on the cases to show how it works, especially the psychologist case where rejection might be unpopular but necessary per the norms.
answer: |-
  Here is a reusable editorial procedure grounded in assertion philosophy, designed for rapid deployment by science editors. It prioritizes the **Reasonable Belief Norm of Assertion (RBNA)** as the most pragmatic standard for journalism (justified belief formed non-negligently, with proportional confidence), while explicitly flagging points where competing norms (Knowledge Norm/KNA, Justified Belief Norm/JBN) create ambiguity requiring judgment.

  **Editorial Assertibility Checklist**  
  *(Run sequentially; stop at any rejection point)*

  ---

  ### **PHASE 1: CLAIM CLASSIFICATION & FRAMING**  
  *Purpose: Categorize the claim and screen for deceptive framing.*  
  1. **What is the *exact* claim being asserted?**  
     - *Sufficient answer*: A single-sentence formulation (e.g., "X causes Y," "Evidence proves Z," "Event A will occur by Year B").  
     - *Rejection*: Vague or unverifiable claims (e.g., "This might revolutionize the field").  
     - *Judgment*: None.  

  2. **Claim type?**  
     - **Empirical**: About observable/measurable phenomena (e.g., "Vaccine efficacy is 85%").  
     - **Interpretive**: About meaning/significance (e.g., "This artifact proves trade links existed").  
     - **Predictive**: About future states (e.g., "Sea levels will rise 0.5m by 2100").  
     - *Sufficient answer*: Clear categorization.  
     - *Rejection*: Claims blending >1 type without disentanglement.  
     - *Judgment*: Ambiguous cases (e.g., historical causation claims).  

  3. **Is the claim technically true but framed misleadingly?**  
     - *Sufficient answer*: "No" OR "Yes, but reframed as [neutral wording]."  
     - *Rejection*: Unfixable framing that distorts reality (e.g., cherry-picking data, false equivalence).  
     - *Judgment*: Deciding if reframing resolves the issue.  

  ---

  ### **PHASE 2: EVIDENCE ASSESSMENT**  
  *Purpose: Evaluate support against claim type.*  
  4. **What direct evidence supports the claim?**  
     - *Empirical*: Requires reproducible data/methods.  
     - *Interpretive*: Requires source authenticity + contextual coherence.  
     - *Predictive*: Requires validated models/mechanisms.  
     - *Sufficient answer*: Peer-reviewed data/artifacts/methods cited.  
     - *Rejection*: Evidence absent, retracted, or methodologically invalid (e.g., confounded study).  
     - *Judgment*: Assessing methodological validity for novel techniques.  

  5. **Strength of justification?**  
     - **High**: Multiple independent lines of evidence/consensus.  
     - **Medium**: Robust single study/document + theoretical plausibility.  
     - **Low**: Preliminary/contested evidence.  
     - *Sufficient answer*: Justification level assigned.  
     - *Rejection*: "Low" justification for high-stakes claims (e.g., medical causations).  
     - *Judgment*: Weighing interdisciplinary evidence.  

  ---

  ### **PHASE 3: EXPERT CONSENSUS & NORMS**  
  *Purpose: Gauge field acceptance and apply assertion norms.*  
  6. **Level of expert disagreement?**  
     - **Consensus**: >90% agreement in relevant experts.  
     - **Contested**: Vocal minority (>20%) disputes core claim.  
     - **Disputed**: Field split near 50/50.  
     - *Sufficient answer*: Categorization based on literature/peer interviews.  
     - *Rejection*: "Disputed" claims presented as settled.  
     - *Judgment*: Interpreting survey data or expert feedback.  

  7. **Does the claim satisfy the *Reasonable Belief Norm* (RBNA)?**  
     - *Conditions*: (a) Belief is justified (Phase 2), (b) No negligence in ignoring counterevidence, (c) Confidence proportional to evidence.  
     - *Sufficient answer*: "Yes" if all conditions met.  
     - *Rejection*: "No" (e.g., ignoring major counter-studies).  
     - *Judgment*: Deciding proportionality of confidence.  

  8. **Competing norms conflict?**  
     - *KNA (Knowledge Norm)*: Requires truth + justification. Unverifiable for predictions/interpretations.  
     - *JBN (Justified Belief Norm)*: Ignores truth; permits assertions later proven false.  
     - *Sufficient answer*: "RBNA sufficient" OR "Conflict exists: [Specify]."  
     - *Rejection*: None – defer to judgment.  
     - *Judgment*: **ALWAYS DEFER**. If KNA/JBN conflict with RBNA (e.g., high-uncertainty predictions), editor must decide.  

  ---

  ### **PHASE 4: ASSERTIBILITY DECISION**  
  9. **Final wording check:**  
     - Predictive claims must include uncertainty ranges.  
     - Interpretive claims must use "suggests" not "proves."  
     - Contested claims must note dissent.  
     - *Sufficient answer*: Wording adheres to standards.  
     - *Rejection*: Unfixable overstatement.  
     - *Judgment*: Wording nuance in edge cases.  

  **Output**:  
  - **Assertible** (with required wording), **Reject**, or **Defer to Editor** (due to norm conflict).  

  ---

  ### **APPLICATION TO CASES**  
  **Case 1: Climate Scientist’s 2050 Regional Temperature Projection**  
  - **Phase 1**: Predictive claim. Framing must avoid "certainty."  
  - **Phase 2**: High justification (multi-model ensembles, physical mechanisms).  
  - **Phase 3**: Consensus on methods; contested on regional precision. RBNA satisfied if uncertainty ranges included.  
  - **Phase 4**: **Assertible** as: "Models project a 2-3°C rise by 2050 (likely range)."  
  - *Judgment Flags*: Proportional confidence (Phase 2 Q5), wording (Phase 4 Q9).  

  **Case 2: Psychologist Asserting Causal Mechanism from One Pre-registered Study**  
  - **Phase 1**: Empirical claim (causation).  
  - **Phase 2**: Medium justification (robust method but single study; no replication).  
  - **Phase 3**: Likely contested (single studies rarely prove causation in psychology). RBNA **not satisfied** due to negligence if ignoring replication crisis norms.  
  - **Phase 4**: **Reject** as stated. Permissible wording: "One study suggests X as a possible mechanism; replication needed."  
  - **Science Editor Resistance Point**: Editors may favor "novel" findings, but philosophy dictates rejection of direct causal assertion. *Judgment Flags*: Strength of justification (Phase 2 Q5), RBNA negligence (Phase 3 Q7).  

  **Case 3: Historian Revising Standard Narrative via New Archival Document**  
  - **Phase 1**: Interpretive claim.  
  - **Phase 2**: Medium justification (document authenticated, but requires contextual analysis).  
  - **Phase 3**: Contested (revisionism inherently debated). RBNA satisfied if alternative interpretations acknowledged.  
  - **Phase 4**: **Assertible** as: "New evidence challenges the standard narrative, suggesting X. Some scholars caution Y."  
  - *Judgment Flags*: Framing neutrality (Phase 1 Q3), expert disagreement level (Phase 3 Q6).  

  ---

  **KEY JUDGMENT POINTS (UNAVOIDABLE)**  
  1. **Proportional Confidence** (Phase 2 Q5): Quantifying "reasonable" certainty.  
  2. **Expert Disagreement Threshold** (Phase 3 Q6): Deciding what constitutes "significant" dissent.  
  3. **Norm Conflict Resolution** (Phase 3 Q8): Choosing between RBNA/KNA/JBN when they diverge.  
  4. **Wording Nuance** (Phase 4 Q9): Balancing accuracy with accessibility.  

  This procedure prioritizes epistemic responsibility while acknowledging journalism’s need for timeliness. It rejects assertions that fail the RBNA standard (demanding justification and non-negligence) but forces explicit deliberation where philosophical norms disagree—ensuring transparency in editorial decisions.
