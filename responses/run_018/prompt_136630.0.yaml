prompt: |-
  Having spent my career in experimental physics and only recently begun studying philosophy in retirement, I am struck by institutional practices that seem to carry hidden theoretical baggage. One puzzling case is the design of the post-war international military tribunals convened at Nuremberg and Tokyo: these courts were constituted solely by judges appointed by the Allied powers, applied legal categories—such as crimes against peace and crimes against humanity—that lacked clear basis in the positive international or domestic law binding the defendants when the acts occurred, and rejected the defense of superior orders while declining to examine comparable Allied conduct, including strategic bombing and ongoing colonial occupation. A further asymmetry rarely emphasized is that the Tokyo bench included representatives of European colonial powers—Britain, France, and the Netherlands—whose own imperial presence in Asia went unscrutinized even as Japanese territorial expansion was prosecuted as criminal aggression, and the tribunals derived authority not from any pre-existing international legislature but from the victors’ joint declaration, yet presented their judgments as applications of universal moral-legal principles rather than as impositions of victors’ will.

  What implicit theory of law and moral responsibility must such an institutional arrangement presuppose? Does it require a natural-law commitment that certain acts are inherently criminal regardless of enacted statute, or can a modified legal positivism accommodate retroactive punishment once sovereignty has collapsed? And what conception of political legitimacy permits a court composed exclusively of victorious and, in some cases, colonial powers to claim impartial jurisdiction over defeated enemies without undermining its own authority? Please reconstruct the philosophical commitments that make this practice coherent, distinguish those that are strictly necessary from those that merely fit well with it, and indicate where the institutional design is philosophically underdetermined—compatible with rival theories of justice, sovereignty, and legal morality.

  Please present your answer as a numbered list of exactly five items. Each item should be one or two sentences. Do not include an introduction or a conclusion.
reasoning: |-
  Hmm, the user is an experimental physicist who has recently started studying philosophy in retirement. They're deeply interested in the institutional design of the Nuremberg and Tokyo tribunals, pointing out several asymmetries: judges appointed only by Allied powers, retroactive application of new legal categories, rejection of superior orders defense while ignoring Allied actions, colonial powers judging Japan's expansion, and the tribunals deriving authority from victors' declaration while claiming universal principles. They want me to reconstruct the philosophical commitments behind this arrangement.

  The user is asking me to identify the implicit theory of law and moral responsibility behind these tribunals. They specifically want to know if this requires natural law or if legal positivism could accommodate retroactive punishment after sovereignty collapse. They're also questioning the conception of political legitimacy that allows victors to claim impartial jurisdiction. I need to provide exactly five numbered items that reconstruct these philosophical commitments, distinguishing necessary elements from compatible ones, and showing where the design is philosophically underdetermined.

  I need to address the core issues: the basis for retroactive punishment, the authority of victors, claims to universal justice, and the handling of asymmetry. For retroactive punishment, the tribunals clearly rejected strict positivism by punishing acts that weren't illegal at the time. This suggests a natural law foundation where certain acts are inherently criminal. But I should note that modified positivism might accommodate this if sovereignty collapse creates a legal vacuum.

  On legitimacy, the tribunals relied on victors' authority yet claimed impartiality. This could imply a realist view where power confers temporary legitimacy or a universalist view where victors act as agents for humanity. The exclusion of colonial scrutiny points to universalism being selectively applied, which might be compatible with various theories as long as power is concentrated.

  I'll structure my response into five precise points: first, on natural law necessity for retroactivity; second, on sovereignty collapse enabling victors' authority; third, on the claim to universal jurisdiction despite victor constitution; fourth, on the selective universalism that exempts allies; and fifth, on how this design remains compatible with different theories of justice. I'll make sure each point is one or two sentences and directly addresses the philosophical underpinnings as requested.
answer: |-
  Here are the five items:

  1.  The practice necessitates a natural law foundation or equivalent meta-ethical stance, asserting that core acts like aggressive war and mass atrocities possess inherent criminality independent of prior positive law, thereby justifying *nullum crimen sine lege* exceptions for retroactive prosecution when confronting unprecedented evil.
  2.  It presupposes a conception of sovereignty as contingent and defeasible, where total military defeat and regime collapse (especially of aggressor states) temporarily transfers legitimate authority—including law-making/judicial power—to the victors, enabling them to fill the normative void and establish *ex post facto* jurisdiction.
  3.  The arrangement relies on a claim to universal moral-legal principles applied impartially, implying the victors act not merely as partisan enforcers but as temporary agents for a nascent "international community" or humanity itself, which grants legitimacy despite the bench's composition.
  4.  The selective application of these universal principles (e.g., scrutinizing Axis aggression while exempting Allied colonialism/bombing) is compatible with multiple theories; it could stem from pragmatic victor realism, a belief in the unique scale/culpability of Axis crimes, or a flawed implementation of universalism, rather than being strictly necessary to the core judicial function.
  5.  The institutional design is philosophically underdetermined regarding the source of the victors' *authority* to act for the international community; it remains compatible with both realist views (might makes provisional right) and cosmopolitan/Kantian views (enforcing pre-political natural law), as well as differing conceptions of transitional justice (retribution vs. establishing new norms).
