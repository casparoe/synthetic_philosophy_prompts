prompt: |-
  Your an expert on metaphysics and museum policy. Before you answer, do a quick brainstorm: jot down at least three rival accounts of what makes a material object stay the same thing over time—like form-matter, four-dimensionalism, or social-constitution stuff. Then think carefully.

  There's this niche conservation rule some museums use for "ephemeral sculptures" made of biodegradable material—wax, chocolate, whatever. The contract says display the original till it decays, then cast a replacement from the original mold, keeping thier same catalog entry and title. But the mold gets destroyed after the third replacement, so eventually there's zero physical continuity with the first piece except the paperwork. What theory of material constitution does that practice presuppose? Does it need the artwork to be a persisting form, a discontinuous four-dimensional object, or just an institutionally tracked entity? Reconstruct the implicit view, say whether the practice is locked into one theory or compatible with several, and tell me what a museum that believed in strict material continuity—same clay, same statue—would have to do differently. No bibliography needed, just the reasoning.
reasoning: |-
  Okay, the user is asking about metaphysics and museum policy, specifically regarding ephemeral sculptures. They want me to brainstorm three rival accounts of material object persistence over time. I recall form-matter hylomorphism, where an object persists if its form remains the same even if the matter changes. Then there's four-dimensionalism, which views objects as space-time worms with temporal parts. And third, social-constitution theory, where persistence depends on social practices and institutional recognition.

  The user describes a museum practice for biodegradable artworks. The original is displayed until it decays, then replaced using the original mold, up to three times. After that, even the mold is gone, leaving only paperwork. The question is what theory of material constitution this practice presupposes. I need to figure out if it aligns with one theory or is compatible with multiple.

  Looking at the practice, the museum treats the artwork as the same entity despite material changes. The key is the continuous catalog entry and title. This seems to rely on institutional identity rather than physical continuity. Social-constitution theory fits best because the artwork's persistence is maintained through institutional tracking, even when the physical material is entirely replaced. 

  But is it compatible with other theories? Under four-dimensionalism, the artwork could be seen as a discontinuous object with temporal parts corresponding to each instance. The practice might fit this view if the replacements are considered parts of the same space-time worm. However, the museum's rule doesn't necessarily require temporal parts; it's more about institutional continuity. Form-matter theory might struggle since the form isn't identical—each casting is a new instance. The mold's use suggests a similar form, but it's not the same form as the original. So social-constitution seems the strongest fit.

  The user also asks what a museum with strict material continuity would do differently. Such a museum, adhering to the same clay/same statue view, wouldn't allow replacements. Once the original decays, the artwork ceases to exist. They might preserve the original longer through controlled environments or display fragments. No recasts; the artwork's existence is tied to its original matter.

  I should consider the user's deeper needs. They might be exploring how institutions influence the identity of artworks, or questioning the flexibility of persistence criteria in conservation. They could be interested in the philosophical implications of museum practices, or how theory informs real-world policies. By analyzing the implicit view in the practice, I address their query while touching on broader themes of identity and institutional authority in art conservation.
answer: |-
  Based on your query, here's the requested analysis:

  **Brainstorm: Rival Accounts of Persistence**
  1.  **Hylomorphism (Form-Matter):** An object persists as the *same thing* if it retains its substantial form, even if its underlying matter changes incrementally (like Theseus's Ship). Identity depends on the continuous existence of the organizing principle (form) instantiating the object's essential properties.
  2.  **Four-Dimensionalism (Perdurantism):** Objects are extended in time as well as space, like "space-time worms." The object persists by having different temporal parts at different times. The whole object (the worm) is the sum of all its temporal parts (infant-you, adult-you, etc.). Identity is the unity of these parts under a single spatiotemporal path.
  3.  **Social Constitution/Institutional Theory:** The persistence of certain objects, especially artifacts or social objects (like artworks, money, nations), is grounded in collective intentionality, social practices, conventions, and institutional recognition. Identity is maintained through continued assignment of a specific status function ("this is *the* artwork") by the relevant community/institution.

  **Analysis of the Museum Practice:**

  1.  **Implicit Presupposition: Social Constitution/Institutional Theory**
      *   **Reasoning:** The practice fundamentally relies on the museum's institutional authority and record-keeping to maintain the artwork's identity. The physical object decays *entirely*. Its replacements are new material objects cast from a mold, but crucially, *they inherit the original's catalog entry and title*. This continuity exists *only* through institutional fiat ("This new cast *is* the artwork originally cataloged as X"). The identity is socially constituted and tracked via paperwork. Physical continuity (matter or mold) is explicitly finite and expendable; the institutional identity is perpetual.

  2.  **Compatibility with Other Theories:**
      *   **Largely Incompatible with Hylomorphism:** Hylomorphism requires the persistence of the *same substantial form*. While each cast might have a *similar* form derived from the mold, the substantial form of the *original* instantiation ceases to exist when it decays. The mold creates a *new* instance of the *type* (a new wax sculpture), not the *same* substantial form as the original artwork. The practice treats the new cast as numerically identical to the original, not just a new token of the same type.
      *   **Potentially Compatible (with caveats) with Four-Dimensionalism:** The practice *could* be interpreted as defining the artwork as a discontinuous four-dimensional object. The original instance and the three replacement casts are distinct temporal parts ("stages") of a single, extended space-time worm united solely by the museum's cataloging practice. The "worm" is defined by its institutional history. However, this requires stretching the typical spatiotemporal continuity associated with perdurantism. The museum's *practice* doesn't inherently require thinking in 4D terms; it operates on the simpler level of institutional designation. The compatibility is semantic rather than necessary.

  3.  **Action by a "Strict Material Continuity" Museum:**
      A museum adhering to a theory requiring strict material continuity (e.g., a robust form-matter view where the original matter is essential, or a mereological essentialism) would:
      *   **Reject Replacement Casts:** They would *not* allow the decayed artwork to be replaced with a new cast under the same catalog entry. The *original* artwork ceases to exist when its specific matter decays beyond recognition or cohesion.
      *   **Prioritize Preservation:** Focus intensely on slowing decay (climate control, barriers) to preserve the original material as long as possible.
      *   **Document & Archive, Don't Replace:** When decay inevitably wins, the artwork would be deaccessioned or listed as "destroyed." The mold might be kept as an artifact *related* to the original artwork, but any new cast made from it would be cataloged as a *distinct* artwork (e.g., "Replica of [Original Title]" or "Posthumous Cast") with its own unique identity.
      *   **Display Fragments:** Might display the remaining fragments of the original material as relics of the lost artwork, explicitly not as the intact work itself.

  **Conclusion:**

  The ephemeral sculpture practice implicitly presupposes a **Social Constitution or Institutional Theory** of persistence. It relies entirely on the museum's authority to maintain the artwork's numerical identity through its catalog system, explicitly overriding the lack of physical continuity. While it *could* be awkwardly mapped onto a four-dimensionalist view (as a discontinuous worm), it is fundamentally incompatible with theories (like strict hylomorphism or mereological essentialism) demanding continuous material existence or the persistence of the original substantial form. A museum holding such a materialist view would prioritize preserving the original matter until its destruction, after which the artwork ceases to exist, rejecting replacement casts as impostors to the original's identity.
