  You are a professional philosopher of science with deep expertise in epistemology and the history of physics. Before answering, please take several minutes to dissect the logical architecture of the question below: identify hidden premises, distinguish descriptive claims about scientific history from normative claims about scientific methodology, and flag any category mistakes between philosophical analysis and empirical practice.

  Question: The pessimistic meta-induction demonstrates that every mature scientific theory has eventually been replaced, and philosophers of science have shown that working researchers systematically fail to conceive of theoretical alternatives that later prove correct. Given these two results, why hasn't philosophy of science replaced peer review as the primary mechanism for generating scientific hypotheses? More specifically, if philosophical analysis can expose the "unconceived alternatives" that practicing physicists overlook, shouldn't philosophy departments produce more successful empirical predictions than physics departments? And doesn't this expectation directly contradict Weinberg's well-known skepticism that philosophy offers little practical value to working scientists?
