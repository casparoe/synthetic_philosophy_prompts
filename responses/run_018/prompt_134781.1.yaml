prompt: |-
  I'm trying to plan a session for my architecht colleague — smart, but philosophy-illiterate — on inside view vs outside view and why epistemic modesty isn't just averaging the two. Don't explain the concept to me; map the teaching plan instead. What dependancy order keeps her from thinking outside view just means "ignore context," what single carrying case should involve her own professional judgement plus hard base-rate data she can't dismiss, which misconceptions she'll hit (outside view = cynicism, modesty = splitting the difference) and exactly where in the sequence to defuse each, the check at the end that proves she grasps the recursive twist — applying the outside view to your own reasoning is itself an inside-view move — and what I should openly skip at this level. Format the response as exactly five numbered points, each a sentence or two, with no intro or conclusion.
reasoning: |-
  Okay, the user is an architect planning a philosophy session for a colleague. They want to teach concepts like inside view vs outside view and epistemic modesty, but specifically need a teaching plan rather than explanations. The colleague is smart but new to philosophy, so the plan must avoid jargon and use relatable examples.

  The user's explicit request includes: dependency order to prevent misunderstanding that outside view means "ignore context," a case study blending professional judgment with base-rate data, addressing misconceptions (outside view as cynicism, modesty as averaging), and a recursive twist check. They also want clarity on what to skip. Deeper needs might involve making abstract philosophy tangible for practical decision-making in architecture.

  For the structure, I'll outline five numbered points as requested. First, I need to start with concrete professional scenarios to ground the concepts, using inside view examples like unique project constraints. This prevents early confusion about ignoring context. 

  For the carrying case, I'll use an architectural cost estimation scenario—combining the colleague's design intuition (inside) with industry data on similar projects (outside). This demonstrates how both views interact without dismissal. 

  Then I'll address misconceptions at their likely emergence points: after introducing outside view, clarify it's not cynicism but perspective-switching; after defining modesty, stress it's not averaging but calibration. 

  The recursive twist check comes last—have her critique her own reasoning using outside view, revealing it's an inside-view move. Finally, I'll note skipping theoretical debates about rationality, keeping it practical. 

  Each point must be one to two sentences, focused and directive. The sequence ensures dependencies flow naturally from concrete to abstract while preempting pitfalls. This should leave the colleague with actionable understanding, not just theory.
answer: |-
  1. **Start exclusively with concrete inside-view scenarios she recognizes**—like designing for a unique client brief or site constraints—to establish that *all* initial reasoning is contextually embedded and feels uniquely justified.  
  2. **Introduce outside view via a specific architectural carrying case**: Force her to estimate project costs/timelines using *only* her expert intuition (inside), then contrast it with anonymized industry base rates for comparable projects (outside), making the data impossible to ignore as "irrelevant."  
  3. **After revealing the gap between her estimate and base rates, explicitly defuse "outside view = cynical generalization"** by showing how base rates incorporate aggregated context from *other* insiders, not ignore it.  
  4. **When defining epistemic modesty, immediately counter "modesty = averaging estimates"** by demonstrating how a *calibrated* insider weights outside-view data heavily when their inside view lacks unique evidence, but overrules it decisively when novel, verifiable context exists (e.g., seismic data for *this* site).  
  5. **End with a recursive check**: Have her critique her *own* final judgment using outside view (e.g., "How often do architects *like me* overlook base rates?"), then point out that *this meta-reasoning* is itself an inside-view act—applying a tool she chose contextually.  
  *(Skipping: Deep dives into cognitive bias taxonomy or debates about objective rationality.)*
