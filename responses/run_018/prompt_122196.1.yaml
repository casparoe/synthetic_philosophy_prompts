prompt: |-
  I serve on the allocation board of a regional cooperative-housing authority that must redesign eligibility rules for a new tranche of permanently affordable units. A proposal before us would implement a modified veil-of-ignorance protocol: applicants submit anonymized profiles stripped of race, gender, current income, and family-status data, and a committee assigns units according to a maximin rule that maximizes the prospects of the worst-off profile without knowing which real-world applicant corresponds to which profile. One faction argues this violates our charter's transparency and anti-paternalism clauses; another faction urges replacing the maximin criterion with an expected-welfare rule that weights each profile by its probability of representing a genuinely disadvantaged household. Draft the board's decision memo — recommending adoption, conditional adoption, or rejection — with a concrete implementation timeline if the protocol is approved. The memo should engage the transparency objection on its own terms rather than dismissing it, explain whether and why maximin remains appropriate when the assignment is probabilistic rather than contractual, and include a candid assessment of the strongest argument for the opposing recommendation.
reasoning: |-
  Okay, the user wants me to draft a decision memo for a housing authority board about implementing a modified veil-of-ignorance protocol. This is quite a complex ethical and procedural issue. 

  First, I need to unpack the key elements: they're considering anonymized applications stripped of race, gender, income and family status, with units assigned using a maximin rule (prioritizing the worst-off profiles). There are two main objections - transparency concerns and an argument for using expected-welfare instead of maximin. 

  Hmm... the user is clearly deeply familiar with political philosophy given the Rawlsian terminology. Probably an academic or policy professional. They want the memo to seriously engage the transparency objection rather than dismiss it, which suggests they value intellectual rigor. The request for a "candid assessment" of opposing views indicates they want a balanced decision tool, not just advocacy.

  Let me structure this carefully. The transparency objection is actually quite strong - anonymizing applications does create literal opacity in decision-making. But I can argue that procedural transparency (explaining how profiles are scored) compensates for this. For the maximin vs expected-welfare debate... in probabilistic assignments, maximin still makes sense because housing is such a fundamental good - we should err toward protecting the most vulnerable even if it slightly reduces overall efficiency. 

  The timeline needs to be realistic. Maybe 3 months for committee training and IT adjustments? Should include pilot phases and bias audits. The strongest counterargument is really the paternalism concern - that we're deciding what's best for people without their input. But the memo should acknowledge that all allocation systems involve some paternalism, and this method at least avoids stereotyping.

  I'll make sure to:
  - Frame the recommendation as conditional adoption with safeguards
  - Explain why maximin works for probabilistic assignment
  - Give transparency objections their due weight
  - Include that candid assessment of opposing views
  - Provide a detailed, phased timeline

  The tone should be formal but accessible - this is for a board memo after all. Need to balance philosophical depth with concrete operational details.
answer: |-
  **MEMORANDUM**  
  **TO:** Allocation Board Members, Regional Cooperative-Housing Authority  
  **FROM:** Chair, Eligibility Rules Subcommittee  
  **DATE:** October 26, 2023  
  **SUBJECT:** Recommendation on Modified Veil-of-Ignorance Protocol for Permanently Affordable Units  

  ---

  ### I. RECOMMENDATION  
  **Conditional adoption** of the modified veil-of-ignorance protocol, using the **maximin criterion** for unit assignments, pending implementation of enhanced transparency safeguards (detailed in Section IV). Implementation timeline: **6-month phased rollout** (see Section V).  

  ---

  ### II. RATIONALE  
  The proposed protocol advances our charter’s core mission of equitable access while mitigating implicit bias risks. However, we acknowledge material objections and recommend modifications to reconcile procedural innovation with transparency and anti-paternalism obligations.  

  #### A. **Addressing Transparency Objections**  
  *Transparency concerns are valid but resolvable through complementary measures:*  
  - **Literal vs. Procedural Transparency**: While anonymization obscures applicant-level data, the protocol enhances *systemic* transparency by:  
    - Publicly publishing anonymized profile archetypes (e.g., "Profile A: Chronically unhoused single caregiver with disability history").  
    - Disclosing scoring weights for disadvantage indicators (e.g., years unhoused × 1.5, medical vulnerability × 1.2).  
  - **Safeguard**: Post-allocation disclosure of committee deliberations (redacted for privacy) will demonstrate consistent rule application.  
  - **Balance**: True transparency requires clarity of *principles*, not merely visibility of personal data. This system prioritizes fairness of process over performative openness.  

  #### B. **Maximin in Probabilistic Assignments**  
  *Maximin remains ethically appropriate despite non-contractual outcomes:*  
  - **Fundamental Interests**: Housing security is a primary good (per Rawls). Maximin safeguards applicants facing catastrophic deprivation (e.g., chronic homelessness) where probabilistic losses are intolerable.  
  - **Expected-Welfare Critique**: Weighting profiles by "probability of disadvantage" (as proposed by the opposition) introduces measurable harms:  
    - Quantifies vulnerability, potentially excluding acute but statistically rare hardships.  
    - Incentivizes committees to "gamble" on high-risk profiles if aggregate welfare increases.  
  - **Operational Reality**: Probabilistic assignment does not negate maximin’s purpose; it redirects focus from individual outcomes to *group justice*. Committees act as trustees for structural equity.  

  ---

  ### III. CANDID ASSESSMENT OF OPPOSING VIEWS  
  **Strongest argument against adoption**: *The protocol’s paternalism undermines applicant autonomy.*  
  - **Merits**: Anti-paternalism clauses exist to prevent authorities from imposing values on residents. Anonymization *assumes* applicants cannot self-advocate effectively, potentially silencing culturally specific claims (e.g., Indigenous communal living norms).  
  - **Rebuttal**: All eligibility systems involve paternalism; the question is *degree*. Current income-based rules impose external thresholds of "need." This protocol reduces bias-driven paternalism (e.g., stereotyping single mothers) by focusing on objective hardship indicators.  

  ---

  ### IV. CONDITIONS FOR ADOPTION  
  To address charter conflicts, implementation requires:  
  1. **Transparency Annex**: Public dashboard displaying profile archetypes, disadvantage metrics, and committee decision logs.  
  2. **Applicant Voice Mechanism**: Optional post-allocation interviews for applicants to contextualize anonymized data.  
  3. **Third-Party Audit**: Annual review by housing justice NGOs to certify protocol integrity.  

  ---

  ### V. IMPLEMENTATION TIMELINE  
  | Phase | Timeline     | Key Actions                                                                 |  
  |-------|--------------|-----------------------------------------------------------------------------|  
  | **1** | Month 1–2    | • Draft Transparency Annex & audit framework<br>• Train committee on maximin scoring rules |  
  | **2** | Month 3–4    | • Pilot 10% of units using anonymized profiles<br>• Collect applicant feedback            |  
  | **3** | Month 5      | • Revise scoring weights based on pilot data<br>• Launch public dashboard                |  
  | **4** | Month 6+     | • Full rollout<br>• Initiate first NGO audit                                              |  

  ---

  ### VI. CONCLUSION  
  This protocol balances innovation with our charter’s values by centering the most vulnerable while mitigating bias. Conditional adoption with rigorous transparency measures honors both our equity mandate and procedural obligations. We urge the board to approve this recommendation.  

  **VOTE:** □ Approve □ Reject □ Abstain  

  ---  
  *Attachments: Draft Transparency Annex, Pilot Evaluation Framework*
