  I'm moderately confident in this diagnosis, but least sure about whether welfare comparisons fundamentally undermine absolute prioritarianism - that might require deeper examination of how we define individual welfare levels independently of comparisons. The user's framing suggests this coherence problem might be secondary to the conceptual confusion though.
answer: |-
  The core disagreement is structural and verbal: "prioritarianism" ambiguously refers to two distinct weighting schemes—absolute (welfare weight depends solely on the individual's absolute welfare level) and comparative (weight depends on the recipient's position relative to others). The leveling-down objection targets only comparative prioritarianism, which *can* endorse downward transfers when equality increases, even without net benefit. Absolute prioritarianism, weighting only absolute deprivation, avoids leveling-down entirely as it violates the Pareto principle. Progress requires **conceptual distinction**: formally defining these schemes separately within social welfare functions, then proving whether monotonic weighting *under absolute deprivation* necessarily avoids leveling-down (it does, as welfare decreases harm everyone). The debate conflates these, masking substantive agreement that absolute priority avoids the objection. I'm highly confident this conflation causes the stalemate, but least sure whether "absolute deprivation" presupposes interpersonally comparable cardinal welfare—a deeper coherence issue if denied. The question is well-posed only after disambiguation.

