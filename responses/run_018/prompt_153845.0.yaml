  Bottom line: Refusing the promotion is not inherently irrational, as her current life provides security and fulfilment, but her reasoning regarding the house *does* likely confuse genuine need with relative standing.

  Explanation: Your friend's basic income securely covers daily necessities, freeing her to choose work based on meaning, which she finds in the orchard. Rejecting a higher salary to preserve this fulfilment is rational, prioritising well-being over mere income. The dilemma arises from her *motivations* for wanting the corporate role. Funding private education could represent a genuine need for specific opportunities she values for her children. However, her explicit desire for "a larger home than those of her neighbours" strongly suggests status competition, not necessity – this is the potential fault. Her basic income and orchard work already provide adequate housing. While the corporate role offers tangible benefits (savings, education options), the core choice is between a fulfilling, secure present and pursuing significantly higher income primarily driven by comparative status and perceived social advancement. Her rationality hinges on honestly assessing whether the corporate path's benefits outweigh the loss of fulfilment, and crucially, disentangling authentic needs from positional desires.
