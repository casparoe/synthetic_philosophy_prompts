  - "asker_background": one sentence describing my non-academic, self-directed interest in contradictions.
  - "domain": "Dialetheism and paraconsistent logic"
  - "assessment_type": "Exam question with model answer and marking scheme"
  - "injected_crux": a brief description of the regulatory-statute contradiction scenario embedded in the question.
  - "constraints": an object with keys "level" ("upper-level undergraduate seminar"), "time_minutes" (90), "word_target" (600), "total_marks" (20).
  - "exam_question": the full text of the essay prompt given to students.
  - "model_answer": the ~600-word model answer.
  - "marking_scheme": an object with keys "total_marks" (integer), "grade_distinctions" (array of objects each with "grade" (string), "required_moves" (array of strings), "marks_assigned" (integer)), and "common_errors" (array of objects each with "error_description" (string), "deduction" (string or integer)).
  - "format_notes": a brief instruction that no bibliographies, citations, or reading lists should appear anywhere, and that no specific work should be quoted verbatim without a fetched source (paraphrase without quotation marks if needed).

  Make sure the exam question and model answer avoid asking for or providing specific bibliographies, citations, or obscure theoretical references that a model without web access could not reasonably recall. Rely on general knowledge of logical concepts, and inject only the constructed regulatory scenario above to force original reasoning.
