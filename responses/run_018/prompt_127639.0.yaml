  1. The full exam question as it would appear on the exam.
  2. A model answer of approximately 600 words.
  3. A marking scheme out of 20 total marks that distinguishes an A answer from a B answer by naming the specific conceptual moves each must contain (for instance, separating formal properties of paraconsistent systems from practical decision procedures; analyzing whether rejecting explosion solves or relocates the contradiction; assessing the epistemic cost of dialetheist commitment in normative reasoning). Include a brief list of common errors and the marks each should cost.

