prompt: |-
  I'm putting together a problem set on killing vs letting die, and I've been noticing a pattern in student papers that I don't have a label for. Someone argues that witholding life support and withdrawing it are morally the same, which is fine, but then they jump straight to "so there's no real difference between polluting and failing to clean up pollution" or between shutting down a harmful factory and never having built it. In the medical case there's an underlying pathology that's going to kill the patient regardless; the agent is just choosing whether to block it. In the factory or climate case there's no analogous "natural" harm running on its own -- the baseline is already human-made. So they're taking a local equivalence that depends on a specific causal background and using it as a universal solvent for the doing/allowing distinction. Does this specific failure mode have a name in the literature? If not, what's the sharpest way to distinguish it from just misapplying an analogy? And please be explicit about how sure you are in what you claim, and flag the one point you're least confident about.
reasoning: |-
  Okay, the user is putting together a problem set on killing vs letting die and has noticed a pattern in student papers. They describe a situation where students equate withholding and withdrawing life support, then extend that to scenarios like polluting versus not cleaning up pollution, or shutting down a harmful factory versus never building it. The user points out that in medical cases, there's an underlying pathology causing harm regardless of intervention, whereas in environmental or factory cases, the baseline harm is human-made. This seems to be a misapplication of an analogy, but the user wants a specific term for this failure mode.

  First, I need to recall philosophical concepts related to doing vs allowing harm. The user mentions the equivalence between withholding and withdrawing treatment in medical ethics, which is well-established. The problem arises when students apply this to non-medical contexts without considering the causal background. 

  The key issue here is the role of pre-existing causal structures. In medical contexts, the disease is the primary cause, and the agent's role is intervening or not. But in pollution or factory examples, the harm is directly caused by human actions. For instance, not cleaning up pollution is part of an ongoing human-made harm, whereas in medicine, the harm exists independently. 

  I remember that Shelly Kagan discusses pre-existing threats in his work on doing and allowing. He distinguishes between allowing harm from pre-existing threats versus creating new threats. The medical case falls under allowing a pre-existing threat (the disease) to take its course, while polluting introduces a new threat. So when students equate not cleaning pollution to withholding treatment, they're overlooking that pollution itself is a new threat introduced by humans, not a pre-existing one. 

  Another angle is the moral distinction between acts and omissions. In medical ethics, withholding and withdrawing are both omissions relative to the disease. But in environmental cases, failing to clean up pollution could be seen as an ongoing act if the pollution is anthropogenic. So students are conflating two different types of omissions: one where the agent didn't start the harm (medical) and another where they did (pollution).

  The user also asks about naming this failure mode. I'm not sure if there's a specific term in the literature. It might be a form of causal background neglect or misidentifying the threat origin. Alternatively, it could be a category error where students treat human-made harms as natural threats. 

  I should check if there's a known fallacy here. Perhaps it's an instance of false analogy, but the user wants something more specific. Shelly Kagan's distinction between creating vs. allowing threats seems relevant. The students are ignoring that in non-medical cases, the threat isn't pre-existing; it's created by human action. So the failure mode might be called "ignoring the distinction between created and pre-existing threats." 

  The user's least confident point might be whether there's a specific term. I need to be clear that while there's no widely accepted term, the core issue is neglecting the causal history and baseline agency. Highlighting the difference between antecedent versus consequent conditions could help. Also, emphasizing that in medical cases, the agent is a non-preventer, whereas in pollution, they might be a preventer who initiated the harm. 

  To structure the response, I'll start by affirming the user's observation, explain the medical context's unique features (underlying pathology), contrast it with anthropogenic harms, discuss the philosophical concepts like Kagan's framework, propose possible names for the fallacy, and suggest teaching strategies. The least confident point is the existence of a specific term, so I'll flag that and offer descriptive alternatives instead.
answer: |-
  Based on your description, this is a fascinating and specific pattern of reasoning error. While there isn't a single, universally agreed-upon *name* for this *exact* failure mode (like "Affirming the Consequent" for a formal fallacy), it's a well-recognized pitfall in applied ethics, particularly surrounding the doing/allowing distinction and its dependence on causal baselines. Here's a breakdown:

  1.  **The Core Error: Ignoring the Causal Baseline / Misidentifying the "Status Quo Ante"**
      *   **Confidence:** Very High. This is the crux of the issue you've identified. Students are correctly grasping the equivalence between *withholding* and *withdrawing* **within a specific context** (medical intervention where an underlying pathology is the primary cause of death).
      *   **The Mistake:** They then erroneously assume this equivalence holds **regardless of the causal history and baseline conditions**. They fail to see that the moral equivalence in the medical case **depends critically** on the pre-existence of an *independent, "natural" causal process* (the disease) that the agent is choosing *not to interrupt* (withholding) or *ceasing to interrupt* (withdrawing). The baseline is the disease progressing.
      *   **The Misapplication:** In the pollution/factory examples, there is **no analogous independent, pre-existing, "natural" harmful process** that the agent is merely failing to interrupt. The *baseline itself is already shaped by prior human action*.
          *   **Pollution:** The baseline isn't "clean environment + natural disaster." It's "environment polluted by human action." "Failing to clean up" isn't equivalent to *withholding intervention* against a natural threat; it's often *allowing a human-created threat to persist*. The harm originates from the *creation* of the pollution, not from a natural process the agent is failing to stop.
          *   **Factory:** The baseline isn't "healthy community + natural economic forces." It's "community impacted by a factory humans chose to build." "Never building it" prevents the harm from *arising*. "Shutting it down" stops an *ongoing harm the agent initiated or sustained*. The equivalence to medical withdrawal fails because shutting it down stops an *agent-initiated* harm stream, while never building it avoids *initiating* it in the first place. Withdrawing life support stops *interfering with* an independent harm (disease); shutting down the factory stops *causing* a harm.

  2.  **Distinguishing It from Simple Misapplied Analogy:**
      *   **Confidence:** High. While it *involves* a misapplied analogy, it's more specific.
      *   **The Key Distinction:** This error isn't just about the analogy being imperfect; it's about **systematically ignoring the foundational role of the causal baseline in grounding the doing/allowing distinction itself**. The student is taking a principle (withholding/withdrawing equivalence) that *only makes moral sense within a context where the harm originates independently of the agent's potential non-intervention*, and applying it to contexts **where the potential harm originates *from* prior or ongoing actions of the agent (or those they represent)**. They are treating the equivalence as a *fundamental moral truth* divorced from its necessary causal scaffolding, rather than a *context-dependent conclusion*.

  3.  **Relevant Concepts & Potential Labels (Less Standardized):**
      *   **Causal Baseline Neglect:** This is descriptive and accurate. (Confidence: High on descriptiveness, Medium on it being a standard *term*).
      *   **Misidentifying the Pre-Existing Threat/Status Quo Ante:** Emphasizes the need to correctly define the "starting point" against which actions/omissions are judged. (Confidence: High on importance, Medium on standard term).
      *   **Conflating Allowing with Creating/Sustaining:** While "allowing" can sometimes involve sustaining a harm you caused, the medical equivalence relies on allowing a harm *you didn't cause*. (Confidence: High on the distinction, but needs nuance).
      *   **Ignoring the Distinction Between Antecedent vs. Consequent Conditions (Kagan):** Shelly Kagan's work (*The Limits of Morality*) is highly relevant. He argues the doing/allowing distinction often hinges on whether the agent **makes the victim worse off relative to their *antecedent* condition** (before the agent acted) vs. just failing to make them better off (*consequent* condition). In medicine, withholding/withdrawing typically leaves the patient no worse off than their antecedent (diseased) state. Polluting *makes* the environment worse off than its antecedent (clean) state; failing to clean up fails to return it to its antecedent state but doesn't *further worsen* it *relative to the state the agent's prior action created*. Students are applying the "no worse off" test from the medical context without recognizing the crucial antecedent state has been altered by *human action* in the pollution case. (Confidence: High that Kagan's framework is directly applicable and illuminating).
      *   **The "Pre-Existing Threat" Fallacy:** Assumes a pre-existing, independent threat exists where none does. (Confidence: Medium - descriptive, but might be seen as too narrow).

  4.  **The Sharpest Way to Distinguish & Explain:**
      *   **Confidence:** High. The clearest explanation emphasizes the **source of the harm** and the **baseline condition**:
          > "The moral equivalence between withholding and withdrawing life support holds *because* the underlying cause of death (the disease) is *independent of the agent's choice*. The agent is merely deciding whether or not to *interfere* with that pre-existing fatal process. In contrast, the harms from pollution or the factory *originate from prior human actions*. There is no independent, 'natural' fatal process running its course that the agent is choosing to block or not block. The baseline condition itself is already the *result* of human intervention. Failing to clean up pollution is allowing *a harm we created* to persist, not merely failing to prevent a naturally occurring harm. Shutting down a factory stops *a harm we initiated*, while never building it avoids *initiating* that harm. The medical equivalence relies on a *passive baseline* (disease); these cases involve an *active, human-shaped baseline*."

  5.  **My Least Confident Point:**
      *   **Confidence Level Flagged:** Medium-Low.
      *   **The Point:** The existence of a single, widely recognized, **specific name** for *this exact* failure mode in the literature. While the *components* (causal baselines, antecedent/consequent conditions, doing/allowing, pre-existing threats) are heavily discussed (especially by Kagan, Foot, Bennett), and the *error* is well-known, I am not confident there is one universally accepted *label* like "Causal Baseline Equivocation" or "Pre-Existing Threat Misapplication" that appears consistently across texts specifically for this pattern. It's more often *described* as a misapplication of the doing/allowing distinction by neglecting the causal history or baseline conditions. Philosophers frequently point *out* this error in critiques, but don't always give it a unique, catchy name beyond referencing the underlying concepts.

  **Recommendation for Teaching:**

  *   Explicitly teach the concept of the **"causal baseline"** or **"status quo ante."**
  *   Use Kagan's **antecedent vs. consequent condition** distinction explicitly.
  *   Frame the medical withholding/withdrawing equivalence as **highly context-dependent** on the presence of an **independent, pre-existing cause of harm**.
  *   When students make this jump, ask: **"What is the independent, pre-existing harm analogous to the disease in this case? Or is the baseline harm itself caused by human action?"**
  *   Contrast: "Stopping interference with a natural harm" (medical withdrawal) vs. "Stopping the causing of an artificial harm" (factory shutdown) vs. "Failing to rectify an artificial harm" (not cleaning pollution).

  This should help students see why the analogy dissolves when the causal origins of the harm differ fundamentally.
