  Below is the branching tree taxonomy for positions on bootstrapping basic empirical knowledge to justify its originating cognitive process. The tree is structured using concrete diagnostic cases, with internal nodes posing questions that students can answer without recognizing philosophical labels. Leaves specify named positions or unnamed combinations, each with one sentence on its most awkward commitment. The root divides on acceptance of basic knowledge, followed by branches on three axes: permissibility of bootstrapping, context-dependence, and epistemic output.

  ---

  **Root: Diagnostic Case**  
  *A patient uses a clinical sensor that outputs "normal" for their vital signs. They believe the reading is accurate without inferring from other beliefs (e.g., prior tests or theories).*  
  **Question:** Is this belief (about the sensor output) non-inferential basic knowledge?  
  - **No** → Leaf: **Denial of Basic Knowledge**  
    *Awkward commitment: All empirical knowledge must be inferential, forcing foundationalism to rely on infinite regress or coherentism without fixed anchors.*  
  - **Yes** → Proceed to Branch A.

  **Branch A: Circularity Evaluation**  
  *The same sensor self-calibrates by comparing its current "normal" output to past "normal" outputs, then concludes: "I am reliable."*  
  **Question:** Can this bootstrapping reasoning avoid vicious circularity?  
  - **No** → Leaf: **Hard-line Anti-Bootstrapping**  
    *Awkward commitment: Rejects all self-supporting arguments, making it impossible to empirically verify any instrument's reliability, even after extensive consistent results.*  
  - **Yes** → Proceed to Branch B.

  **Branch B: Contextual Sensitivity**  
  *A technician uses a device's consistent "normal" readings to assert its reliability during routine checks. After a malfunction scare, the same reasoning is challenged as question-begging.*  
  **Question:** Does the legitimacy of bootstrapping depend on whether skeptical alternatives (e.g., sensor drift, hacking) are contextually salient?  
  - **Yes** → Proceed to Branch C.  
  - **No** → Proceed to Branch D.  

  **Branch C: Contextual Output (Salience-Dependent Cases)**  
  *During a stable phase (no salient threats), bootstrapping concludes: "The sensor is not malfunctioning."*  
  **Question:** Does this yield genuine knowledge of the hypothesis's falsity, or only pragmatic dismissal?  
  - **Genuine knowledge** → Leaf: **Contextualism**  
    *Awkward commitment: In high-salience contexts (e.g., post-malfunction), bootstrapping is illegitimate, blocking self-certification precisely when reliability doubts are urgent.*  
  - **Practical entitlement** → Leaf: **Unnamed: Salience-Triggered Entitlement**  
    *Awkward commitment: Bootstrapping only grants action-guiding permission to ignore doubts, never knowledge of reliability, undermining claims of objective justification.*  

  **Branch D: Contextual Output (Salience-Independent Cases)**  
  *Bootstrapping is used to dismiss malfunction scenarios even when they are salient (e.g., during a sensor recall controversy).*  
  **Question:** Does this yield genuine knowledge of the hypothesis's falsity, or only pragmatic dismissal?  
  - **Genuine knowledge** → Leaf: **Unrestricted Reliabilism or Epistemic Disjunctivism**  
    *Flag: Tree cannot separate these positions.*  
    - *Unrestricted Reliabilism*: Awkward commitment: Validates bootstrapping universally, allowing circular self-verification even against vivid, undefeated skeptical challenges.  
    - *Epistemic Disjunctivism*: Awkward commitment: In "good case" scenarios, skeptical alternatives are rationally excluded by factive perceptual states, but bad cases are subjectively indistinguishable yet unjustified.  
  - **Practical entitlement** → Leaf: **Unoccupied: Acontextual Instrumentalism**  
    *Diagnosis of vacancy: Stable bootstrapping that never yields knowledge but is always pragmatically legitimate is unexplored; it incoherently divorces epistemic entitlement from truth-apt justification while demanding context-invariance.*  

  ---

  ### Key Notes:
  1. **Flagged Unseparated Leaves**: The tree cannot distinguish *Unrestricted Reliabilism* (e.g., externalist accounts accepting bootstrapping) from *Epistemic Disjunctivism* (e.g., McDowell/Pritchard) on the specified axes. Both occupy the same leaf (salience-independent + genuine knowledge) but differ in their mechanisms: disjunctivism avoids bootstrapping by leveraging factive perceptual states, while reliabilism directly endorses the reasoning.  
  2. **Concrete Cases**: Nodes use real-world scenarios (clinical sensors, calibration protocols) to make abstract dilemmas tangible.  
  3. **Unoccupied Combination**: *Acontextual Instrumentalism* (salience-independent + practical entitlement) is explicitly unoccupied; its instability (pragmatic license without knowledge) explains why it lacks proponents.  
  4. **Synthetic Coverage**: The tree isolates core disagreements while revealing underdeveloped positions, aiding seminar discussions on self-certifying systems.
