prompt: |-
  hey so me and my friend had this long argument last night about wether DNA is literally a code or if thats just a metaphor biologists borrowed from computer science. i ended up taking the side that its not just metaphor - specifically im arguing that the genetic translation system involves a triadic semiotic relation (codon, tRNA adaptor, amino acid) that makes it structurally different from pure causal correlation or shannon information, closer to an actual representational code with semantic content rather than just chemistry happening in sequence. im giving a short talk on this at an interdisciplinary philosophy of biology seminar next week, audience is mostly molecular biologists and a couple philosophers of science who think importing intentional or linguistic concepts into genetics is just anthropomorphism and that mechanistic explanation plus shannons framework handles all the information talk we actually need. can you prep me for the q&a? i want the objections ordered from most likely to most damaging, written the way theyd actually ask them in that room, each with a quick reply and a honest note on where that reply is weakest. tell me what i should concede right at the start so i dont sound defensive, and identify the one reply that absolutely has to land or the whole argument collapses. also include the objection im secretly hoping nobody brings up, with what id say if they do. please write all of this as one continuous block of prose, no headings, no bullet points, no bold text, no tables, just like youre writing me a long email or letter.
