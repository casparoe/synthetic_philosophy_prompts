prompt: |-
  I'm trying to sort out what I actually think about the moral equality of combatants, going by my gut on specific cases. A drafted soldier fighting for an unjust invasion: I think he still has the same right not to be killed as the defender, he didn't choose the war. A volunteer who enlists knowing the cause is unjust: I think he loses that equality, he's culpable. A mercenary fighting purely for money with no idea whether the cause is just: weird, I think he retains equality, like he's just an instrument? No wait, that feels wrong — maybe he dosent. A civilian who grabs a rifle when her town is attacked, even if her side is technically the aggressor: I think she gets full combatant rights anyway. A drone pilot in Nevada: I think equality applies symetrically here, but I'm shaky. Then there's an autonomous weapons system trained only on data from just wars, now selecting targets for an unjust conflict: I feel there's no equality, but I can't tell if that's because there's no agent or because the cause is bad. The tension is that the mercenary and the AI both lack knowledge of justice, yet I treat them differently. Is there one principle that captures all this, or close? What does it predict for a cyber-combatant who only disrupts logistics but never kills? And be honest about which of my verdicts has to go. Keep it tight — max 200 words, bottom-line principle first, then map it to my cases.
reasoning: |-
  Okay, the user is grappling with the moral equality of combatants in various scenarios, trying to find a consistent principle. They've presented several cases: drafted soldier, volunteer, mercenary, civilian defender, drone pilot, autonomous weapons system, and a cyber-combatant. Their intuitions vary—drafted soldiers and civilians retain equality, volunteers lose it, mercenaries and AIs are confusing. The tension between mercenaries and AIs lacking knowledge but being treated differently needs resolution.

  First, I need to identify the underlying principle. The user's responses suggest that control and culpability matter. The drafted soldier has no choice, so not culpable. The volunteer chooses, so culpable. The civilian defending her town is reacting, not initiating aggression. The mercenary's knowledge gap might not absolve them if they're willfully ignorant. The AI isn't an agent, so no moral standing. 

  The principle could be: Moral equality depends on culpable contribution to unjust harm. This means if someone is responsible for contributing to an unjust cause, they lose protection. Now applying this to cases: 

  Drafted soldier: Not culpable, retains equality. Volunteer: Culpable, loses. Mercenary: Even without knowledge, taking payment to participate makes them culpable for contributing, so loses equality. Civilian defender: Defending against attack isn't contributing to aggression, so retains rights. Drone pilot: Directly causing harm in an unjust war, culpable, so loses equality. AI: No agency, no culpability, but also no rights—so no equality applies. Cyber-combatant disrupting logistics: If it's for an unjust war and they're culpable, they lose protection even without killing because they enable harm. 

  This means the user's initial intuition about the mercenary retaining equality has to go. The mercenary is culpable by participating for payment, regardless of knowledge. The autonomous weapon lacks agency, so the case is different. The cyber-combatant, if culpable, loses equality even without lethal actions. Tightening this into a principle: "Lose protection if culpably advancing unjust harm." That should cover all cases consistently.
answer: |-
  **Bottom-line principle:** Combatants lose moral equality (right not to be killed) only when *culpably advancing an unjust harm*. Culpability requires agency and avoidable contribution to the unjust cause.

  1.  **Drafted Soldier (Unjust Invasion):** Not culpable (no choice). **Retains equality.**
  2.  **Volunteer (Knows Cause Unjust):** Culpable (chose to advance unjust harm). **Loses equality.**
  3.  **Mercenary (No Knowledge):** *Culpable* (willfully ignorant; sells services enabling *any* harm). **Loses equality.** (Your initial verdict must go.)
  4.  **Civilian Defender (Town Attacked):** Not advancing *unjust harm*; defending against immediate attack. **Retains equality.**
  5.  **Drone Pilot (Unjust War):** Culpable (directly inflicting harm for unjust cause). **Loses equality.**
  6.  **Autonomous Weapons System:** Not an agent (no culpability). **No equality applies.**
  7.  **Cyber-Combatant (Disrupts Logistics - Unjust War):** If culpable (knowingly advancing unjust harm), **loses equality** – harm enables killing. If unaware/unavoidable, retains.
