prompt: |-
  I have no formal training in this and have been working it out on my own, but I have ended up an anti-fanatic about astronomical stakes: I hold that any decision procedure worth using has to be able to set aside an outcome whose probability falls below some threshold, however enormous the payoff — that a rule which will always trade a certain decent result for a one-in-10^30 chance of one astronomically better has malfunctioned, and that expected-value maximization needs a non-fanatical supplement rather than just more careful probability estimates.

  What would count against that, ranked from fatal to merely awkward? I would especially like to know which costs a defender of anti-fanaticism would themselves concede and which they would say I have misdescribed: that a threshold rule can choose something worse than an available alternative in every state of the world; that it seems to require giving up the thought that saving more people is straightforwardly better than saving fewer; that the threshold itself looks arbitrary, or looks like it has been placed just where the embarrassing cases stop; and that it appears to commit me symmetrically to ignoring tiny chances of astronomically bad outcomes.

  My own worry is a different one. In actual cases I suspect my refusal is not a view about value at all but plain distrust: of the description of the setup, of the model that produces the tiny number, of my own grasp of very large quantities. If that is the whole story, then in a fully idealized case — chance and payoff stipulated to be exactly as described, every misunderstanding ruled out — does my own view require me to be a fanatic after all? And if it does, is that fatal, because the view then does no work exactly where the pressure is greatest, or is it fine, because the view was only ever about choosing under real uncertainty and the idealized case is an artefact? An argument of that shape would move me more than any number of further mugging variants.
reasoning: |-
  Okay, let's start by unpacking the user's query. They're grappling with the concept of "astronomical stakes" in decision theory, specifically rejecting fanaticism—the idea that even minuscule probabilities of enormous payoffs should dictate choices. They propose a threshold rule to ignore outcomes below a certain probability, but they're aware of several criticisms and want them ranked by severity. 

  First, I notice the user is self-taught, which is impressive given the complexity of the topic. Their frustration with "mugging variants" suggests they've encountered Pascalian wagers ad nauseam and find them unpersuasive. The core tension they're wrestling with is whether their intuition is fundamentally about epistemic humility (distrust of models/descriptions) or a normative stance on value itself. 

  The user’s meta-concern is particularly interesting: if their anti-fanaticism collapses in idealized cases where all uncertainties are removed, does that undermine their entire position? This feels like the crux—they’re worried their view might only work pragmatically and fail theoretically. 

  Breaking down the objections they listed:  
  1. **Dominance violations** (choosing a strictly worse outcome) is the strongest counterargument because it attacks decision-theoretic coherence. I’d rank this as "fatal" if consistency is non-negotiable.  
  2. **Arbitrariness of threshold** is awkward but defensible—many real-world rules (p-values, clinical significance thresholds) accept this.  
  3. **Violating "more saved = better"** is serious but not decisive; consequentialists can bite the bullet by arguing ordinal rankings break down at extremes.  
  4. **Symmetry for losses** is actually a point *for* their view—it avoids dystopian conclusions like torturing one person to prevent 1e30 dust specks.  

  The user’s self-doubt about distrust being the real driver is astute. In practice, anti-fanaticism *is* often epistemic: we reject Pascal’s Mugging because we suspect the probability isn’t *actually* 1e-9, or the payoff isn’t real. But in a truly idealized case? If probabilities and utilities are taken as given, rejecting EV maximization requires endorsing a non-consequentialist axiom (e.g., "no realizer of infinitesimal probability should determine choices").  

  Whether this is "fatal" depends on goals. If they want a decision procedure that’s *theoretically* watertight, collapsing in idealized cases is problematic. If they want a *pragmatic* tool for real-world choices, it’s fine—idealized cases are irrelevant. The user seems to lean toward the latter, given their disdain for "artefacts."  

  A path forward: argue that decision theory must account for *computational constraints* or *moral uncertainty*. We can’t actually compute or comprehend 1e30 lives saved, so treating it as "astronomical" rather than linear is rational. This bridges the epistemic/normative gap.
answer: |-
  Your position—that decision procedures should ignore outcomes below a probability threshold, however large the payoff—faces both philosophical and practical challenges. Below, I rank counterarguments from **fatal** (threatening the core coherence of the view) to **awkward** (tractable but requiring careful defense), then address your epistemic worry. I'll note where defenders might concede or dispute each point.

  ---

  ### **Counterarguments Ranked by Severity**
  1. **Violates Stochastic Dominance (Fatal)**  
     - **Problem:** A threshold rule can force you to choose an option that is *worse in every possible state of the world* than an alternative.  
       *Example:* Option A gives 1 utilon with certainty. Option B gives 1e100 utilons if a fair coin lands heads (prob. 0.5), but 0 utilons if tails. A threshold rule (e.g., ignore probabilities < 1e-9) might reject B's upside and choose A—even though B is never worse than A and sometimes better.  
     - **Why Fatal?** This violates a bedrock principle of rational choice: avoid strictly dominated options. Defenders must either abandon dominance or accept fanaticism in some cases.  
     - **Defender Response:** Concede the violation but argue dominance is less compelling when probabilities are *incommensurable* (e.g., uncertainties about the model itself).

  2. **Symmetry for Catastrophic Losses (Fatal if Unaddressed)**  
     - **Problem:** If you ignore tiny chances of vast gains, consistency demands ignoring tiny chances of vast losses. But this could justify accepting existential risks.  
       *Example:* A 1e-30 chance of destroying Earth for minor convenience. Ignoring this due to low probability seems indefensible.  
     - **Why Fatal?** Anti-fanaticism may require tolerating asymmetrically bad outcomes, undermining its appeal.  
     - **Defender Response:** Reject symmetry. Argue that avoiding catastrophe has *infinite disvalue* or that losses trigger distinct moral principles (e.g., precautionary reasoning). Not all concede this.

  3. **Arbitrariness of the Threshold (Serious but Awkward)**  
     - **Problem:** Any specific threshold (e.g., 1e-30) appears arbitrary. Why not 1e-29 or 1e-31? This invites "threshold-slicing" arguments: if 1e-30 is acceptable, why isn't 0.9e-30?  
     - **Why Awkward?** Defenders can appeal to *practical necessity*: we need *some* cutoff to avoid paralysis. Analogies: p-values in statistics or the Planck scale in physics.  
     - **Defender Response:** Concede arbitrariness but argue it’s preferable to fanaticism’s absurdities. Thresholds can be context-dependent or fuzzy.

  4. **Rejects "More Saved = Better" (Awkward)**  
     - **Problem:** If saving 1e30 lives has positive utility, but you ignore it below a threshold, you’re not maximizing lives saved. This clashes with straightforward consequentialism.  
     - **Defender Response:** Deny that utility is linear or comparable at extremes. Argue that *moral significance* diminishes beyond comprehensible scales (e.g., "a billion lives matter, but not 1e30 more than one").

  ---

  ### **Your Epistemic Worry: Distrust vs. Idealization**
  You suspect your anti-fanaticism stems from distrust of models, not value theory. In a **fully idealized case** (exact probabilities/payoffs, no misunderstanding), would you be forced into fanaticism? And is this fatal?

  1. **Does it force fanaticism?**  
     Yes—if probabilities/utilities are *stipulated as real and comprehensible*, rejecting EV maximization requires accepting that some payoffs are morally irrelevant. This is a *normative* claim: "No outcome, however valuable, can matter if its probability is below ε."

  2. **Is this fatal?**  
     - **Yes, if** you seek a universal decision theory. Anti-fanaticism then fails in the very cases it was meant to address.  
     - **No, if** your goal is practical decision-making under real-world uncertainty. Idealized cases are epistemically inaccessible—we never have perfect confidence in 1e-30 probabilities. Thus, the view still does work where it matters: in actual choices plagued by ambiguity, model error, and limited cognition.  
     - **Key Insight:** Your instinct aligns with **bounded rationality** (e.g., Kahneman’s System 1 distrusts extreme probabilities). In practice, a threshold rule approximates robust heuristics for agents with cognitive limitations.

  ---

  ### **A Path Forward: Defending Anti-Fanaticism**
  Defenders can ground your view without collapse in idealized cases:
  1. **Moral Invariance Principle:** Outcomes below a probability threshold cannot override obligations (e.g., keep promises, avoid harm) that apply to "realistic" scenarios.  
  2. **Value Non-Archimedeanism:** Some goods (e.g., basic rights) are lexically prior to astronomical payoffs. Tiny probabilities don’t override them.  
  3. **Epistemic Priority:** Idealized cases are irrelevant because probabilities below ε are indistinguishable from 0 in all *actionable* models (e.g., due to entropy, chaos, or measurement limits).

  This preserves anti-fanaticism as a **pragmatic necessity** while conceding it’s not a fundamental law of rationality. As you noted, this is more compelling than debating muggers—it addresses the *function* of decision rules in a finite, uncertain world.

  Would you like deeper analysis of a specific counterargument or defense strategy?
