prompt: |-
  You are a senior lecturer in philosophy of biology with extensive experience marking undergraduate examinations. Before assessing the work below, please take a few moments to brainstorm the central distinctions between etiological and causal-role theories of function, the standard ways students misapply them, and the specific conceptual pressure points involving artificial systems, exaptation, and spandrels. Think carefully and methodically, working step by step.

  Your role is that of an impartial exam grader: do not rewrite the answer, do not advocate for your own philosophical position, and do not ask for references, bibliographies, or further reading. Provide your assessment in British English.

  Please read the following exam question and the student’s response, then deliver a point-by-point grading report. Award a specific grade using the British university classification (First, Upper Second, Lower Second, Third, or Fail), and justify it with precise comments that identify both what is correct and what is subtly mistaken—particularly any misattributed view, conflation, or inferential slip that a hasty marker might overlook. Your deliverable should be a detailed assessment rather than a general impression.

  Exam question:
  Distinguish the etiological (selected-effects) account of biological function from the causal-role (system-capacity) account, illustrating each with reference to the mammalian heart. Then consider a bio-engineered synthetic pump implanted in an artificial organism that circulates synthetic blood but has no evolutionary history: would either account assign it a biological function? Finally, discuss how each account treats exaptation and spandrels, and whether either can accommodate functional change without contradiction.

  Student answer:
  The etiological account, developed by philosophers such as Larry Wright and Ruth Millikan, holds that a trait’s function is the specific effect for which it was naturally selected, so that the heart functions to pump blood because pumping explains why hearts are present in the population today. The causal-role account, defended by Robert Cummins, holds that function is defined purely by a trait’s contribution to some complex system capacity; on this view, the heart functions to pump blood because that contribution sustains the organism’s circulatory capacity, regardless of evolutionary origins.

  Applying this to the synthetic pump: since it was never subject to natural selection, the etiological account must deny it has any biological function, whereas the causal-role account grants it a function because it contributes to circulation in the artificial organism.

  Regarding exaptation and spandrels, the etiological account easily accommodates exaptation—feathers originally selected for insulation can later be selected for flight, updating their function—while it correctly denies function to spandrels such as the human chin, which were never selected for anything. The causal-role account, however, struggles with spandrels because it requires an evolutionary history to assign functional status; without selection, Cummins’s view cannot determine whether the chin contributes to a capacity, leaving spandrels functionally undefined. By contrast, exaptation is problematic for the causal-role account, since any change in contribution immediately changes the function, making historical continuity impossible.
reasoning: |-
  Okay, I need to tackle this as a senior lecturer in philosophy of biology grading an undergraduate exam. The question is about distinguishing etiological and causal-role theories of function and applying them to various scenarios. Let me start by recalling the core differences between these two accounts.

  The etiological account, also known as the selected-effects theory, ties a trait's function to its evolutionary history. Specifically, a trait's function is the effect for which it was naturally selected. For example, the heart's function to pump blood is because that effect contributed to the survival and reproduction of ancestors, leading to the heart's prevalence today. Wright and Millikan are key figures here. On the other hand, the causal-role account, associated with Cummins, defines function in terms of a trait's current causal contribution to a system's capacity. So the heart pumps blood as part of the circulatory system, regardless of how it evolved.

  Now, considering the student's response. They correctly distinguish the two accounts using the heart example. That's solid. Moving to the synthetic pump scenario: the student states that etiological theory denies it a biological function due to no evolutionary history, which is correct. Causal-role would assign a function because it currently contributes to circulation. That's accurate.

  When it comes to exaptation and spandrels, the student makes several points. They say etiological handles exaptation well (e.g., feathers evolving from insulation to flight), which is right because the function updates based on recent selection. They also note spandrels like the human chin lack function under etiological since no selection. Correct. 

  But then the student claims causal-role struggles with spandrels because it "requires an evolutionary history." That's a mistake. The causal-role account doesn't rely on evolutionary history at all; it's about current contributions. So spandrels could have a function if they now contribute to a system capacity, even if they weren't selected. The student's error here is conflating the accounts' requirements. 

  Also, the student says exaptation is problematic for causal-role because any change in contribution changes the function immediately, losing historical continuity. This is partly right—causal-role is ahistorical, so function is current. But the student implies this is a problem, whereas it's actually consistent with Cummins' view. However, they miss that both accounts can handle functional change, just differently. Etiological requires new selection, while causal-role reflects current role changes. 

  The student also misattributes the causal-role's issue with spandrels. Causal-role doesn't need evolutionary history; it can assign function based on current contribution. So the chin might have a function if it contributes to, say, chewing or speech now. The student's mistake here is significant because it misrepresents Cummins' theory.

  In summary, the student demonstrates good understanding of the core distinctions and the synthetic pump case. However, errors in handling spandrels under causal-role and exaptation nuances lower the mark. The spandrel confusion is a critical conceptual error, but not enough to fail. The answer is largely accurate but has specific flaws. Given that, an Upper Second (2:1) seems appropriate. The student shows competence with key points but stumbles on finer distinctions, especially misattributing historical requirements to causal-role.
answer: |-
  ## Grading Report

  **Overall Grade: Upper Second (2:1)**  
  *Justification:* The answer demonstrates a solid grasp of the core distinctions between the two accounts, correctly applies them to the heart and the synthetic pump, and identifies key strengths/weaknesses regarding exaptation. However, it contains significant conceptual errors in handling spandrels under the causal-role account and misrepresents the implications of functional change for that account. These errors prevent a First-class mark but reflect competent undergraduate understanding.

  **Point-by-Point Assessment:**

  1.  **Distinction of Accounts & Heart Illustration:**
      *   *Correct:* Clearly defines the etiological account in terms of selection history (citing Wright/Millikan) and the causal-role account in terms of current systemic contribution (citing Cummins). The heart example is accurately used for both: pumping blood as the selected effect *and* as a contribution to circulatory capacity.
      *   *Subtlety:* Correctly avoids conflating the accounts. No significant errors here.

  2.  **Synthetic Pump Analysis:**
      *   *Correct:* Accurately states the etiological account denies the pump a biological function due to its lack of evolutionary history. Correctly states the causal-role account *would* assign it the function of pumping synthetic blood because of its current contribution to circulation within the artificial organism/system. This is precisely the standard application.

  3.  **Exaptation (Etiological Account):**
      *   *Correct:* Accurately describes how exaptation works under the etiological view – a trait originally selected for Effect A can acquire a new function for Effect B if Effect B becomes the *current* basis of selection (feathers for insulation → flight). Correctly notes the function updates based on *recent* selective history.

  4.  **Spandrels (Etiological Account):**
      *   *Correct:* Accurately states that the etiological account denies a function to spandrels (like the human chin) precisely because they are byproducts without a history of selection *for* their current effect. This is well-understood.

  5.  **Spandrels (Causal-Role Account - Major Error):**
      *   *Incorrect:* The claim that "the causal-role account... requires an evolutionary history to assign functional status" and that Cummins's view "cannot determine whether the chin contributes to a capacity" without selection is a **fundamental misrepresentation**.
      *   *Analysis:* The causal-role account is *explicitly ahistorical*. It requires *no* evolutionary history whatsoever. A function is assigned *if and only if* the trait currently contributes to some specified capacity of a containing system. Whether the chin *does* currently contribute to a capacity (e.g., mastication, speech articulation, structural support) is an empirical question about the *current system*, not a historical one. If it does contribute, it *has* a causal-role function. If it doesn't, it doesn't. Spandrels are **not** inherently "functionally undefined" under Cummins; their status depends entirely on their current causal role. This is a significant conceptual conflation.

  6.  **Exaptation (Causal-Role Account - Mischaracterisation):**
      *   *Partially Correct:* It is true that under the causal-role account, a change in the trait's contribution would entail a change in its function *under that specific analysis*. There is no inherent requirement for historical continuity.
      *   *Mischaracterisation:* Labelling this as "problematic" and implying it makes exaptation impossible for the account is misleading. The causal-role account *can* describe the change: the trait's contribution (and thus its function) at time T1 (e.g., feathers contributing to insulation) differs from its contribution/function at time T2 (e.g., feathers contributing to flight). It simply doesn't *explain why* the change occurred or privilege the later function based on history. Exaptation *can* be accommodated as a *change* in causal role over time, but the account does not (and does not aim to) capture the *etiological shift* central to the selected-effects view. The student presents this difference as a *failure* of the causal-role account rather than a *feature* or necessary consequence of its definition.

  7.  **Functional Change Without Contradiction:**
      *   *Implied but Flawed:* The discussion of exaptation touches on this. The answer correctly implies the etiological account handles functional change via shifts in selection pressure. However, the misrepresentation of the causal-role account's handling of spandrels and exaptation undermines the assessment of whether *it* can accommodate change. The causal-role account *inherently* accommodates functional change without contradiction – if the current causal contribution changes, the function changes. The contradiction only arises if one mistakenly imposes historical requirements (as the student does).

  **Key Justification for Grade (Upper Second):** The answer correctly identifies and applies the core tenets of both theories to the central examples (heart, synthetic pump) and accurately describes the etiological view on exaptation and spandrels. This demonstrates a good understanding of the primary lecture material. The critical error regarding the causal-role account's requirements for spandrels (attributing a need for evolutionary history) and the mischaracterisation of its handling of exaptation as problematic are significant conceptual mistakes. However, these mistakes involve nuanced application to specific cases rather than a fundamental misunderstanding of the core definitions. The answer is structurally sound and addresses all parts of the question competently, albeit with notable flaws in specific areas, placing it firmly in the Upper Second category. A First-class answer would not make these specific misattributions regarding the causal-role account's ahistorical nature.
