answer: |-
  ### Central Difference Between Mencian and Xunzian Positions  
  Mencius posits that human nature (*xing*) contains innate moral inclinations ("sprouts" like compassion, shame, and reverence) that naturally align with virtue when properly cultivated. These sprouts are pre-rational affective tendencies that can mature into full virtue through guided nurturing. Xunzi, conversely, argues human nature is inherently self-interested and amoral, prone to conflict without external correction. Virtue arises solely through conscious effort: ritual (*li*) and learning artificially reshape raw impulses into socialized conduct, overriding innate tendencies rather than cultivating them. The core divergence thus lies in whether morality originates *internally* (as latent potentials requiring development) or *externally* (as imposed structures counteracting innate disorder).  

  ### Unifying Principle for All Five Judgments  
  **Principle:** *Complete moral agency arises from the dynamic integration of an innate affective substrate (providing motivational orientation) and an external normative architecture (providing cognitive and behavioral structure), with defectiveness resulting from the absence or malformation of either component.*  

  **Application to Judgments:**  
  1. **Child’s spontaneous aid:** Explained by the *affective substrate* (innate compassion as moral sprout), prior to normative shaping.  
  2. **Ritualized society without feeling:** Achieves order via *normative architecture* alone, but implicitly defective (lacks affective motivation; judged "stable" but not fully virtuous).  
  3. **Compassionate but untrained person:** *Affective substrate* without *normative architecture* leads to chaotic expression (compassion misdirected or inconsistent).  
  4. **Trained but emotionally deprived person:** *Normative architecture* without integrated *affective substrate* yields reliable conduct but defective virtue (no internal motivation; "hollow" compliance).  
  5. **Pure rational self-legislation’s incoherence:** Rejects moral systems bypassing the *affective substrate*; pre-rational emotional foundations are necessary for coherent virtue.  

  **Hypothetical Sixth Case:**  
  *Institutional rules imposed on infants before emotional capacity emerges.*  
  - **Evaluation:** This fails because the *affective substrate* (necessary for motivational grounding) is developmentally absent. Rules lack emotional anchorage, producing mechanical conditioning devoid of moral meaning. The infant cannot internalize norms as values, violating the principle’s requirement for integration.  

  ### Alternative Competing Frameworks (If No Unifying Principle Existed)  
  **Alternative A (Mencian Priority):** *Innate sprouts are necessary and sufficient foundations; normative architecture merely nurtures pre-existing tendencies.*  
  - Must overturn: Judgment 2 (ritual alone cannot yield true moral order without sprouts) and Judgment 4 (external training without affect is irrelevant—virtue must flow from sprouts).  
  - Sacrifices: Overrules empirical social stability (2) and phenomenological depth (4).  

  **Alternative B (Xunzian Priority):** *Normative architecture wholly constructs virtue; affective states are byproducts of training, not prerequisites.*  
  - Must overturn: Judgment 1 (child’s aid is coincidental, not innate), Judgment 5 (rational self-legislation is coherent), and implicitly Judgment 4 (no "defect" in emotionless virtue).  
  - Sacrifices: Intuitive moral psychology (1,5) and experiential reality of motivation (4).  

  **Why the Unifying Principle is Preferable:**  
  The proposed principle sacrifices no judgments, whereas both alternatives discard core intuitions: Alternative A ignores sociology (Judgment 2) and moral psychology (4), while Alternative B dismisses developmental evidence (1) and motivational coherence (5). The principle’s dual-aspect model acknowledges Mencius’ insight (affect as necessary foundation) and Xunzi’s insight (structure as necessary discipline), transcending their dichotomy. It treats morality as biologically grounded *and* culturally articulated, with defectiveness (e.g., "stable" but soulless societies or "reliable" but alienated agents) emerging from dis-integration. This reflects classical Chinese thought’s synthetic potential beyond rigid doctrinal divides.  

