prompt: |-
  Two philosophers of science, Maya and Leo, are debating whether interventionist accounts of causation genuinely dispense with counterfactual metaphysics or merely conceal it within formal machinery. I want you to adjudicate their exchange point by point.

  Maya opens: interventionism, in the tradition of Pearl and Woodward, is superior because it grounds causation in manipulable structural relationships. To ask whether smoking causes cancer is to ask whether an intervention on smoking changes cancer rates in the model. We do not need to rank the similarity of possible worlds, as Lewisian counterfactual theories require; we need only check local stability under an intervention.

  Leo responds: but the do-operator is defined counterfactually. To apply do(X = x) is precisely to ask what the system would be like if X were set to x by an external intervention that breaks its normal causes. That is not empirical observation; it is a modal comparison, just restricted to a graph. Interventionism has not eliminated counterfactual dependence; it has localised and formalised it.

  Maya: localisation is the achievement, not a disguise. The comparison is constrained by the causal structure, not by global intuitions about world-similarity. We compute responses within the model, not by weighing distant worlds.

  Leo: yet computing the response requires knowing the right graph, and selecting variables is theory-laden. More importantly, consider omissions. My failure to water the plant caused it to die. There is no action performed, only an absence. Counterfactual analysis handles this naturally: had I watered it, it would have lived. Interventionism must construct a binary watering variable and treat its value of zero as an observed state, then compute do(watering = 1). But this invents the intervention post hoc. Worse, take a structural omission in social causation—say, a regulator's failure to inspect, where performing the inspection might require dissolving the institutional role itself. Here a counterfactual judgment seems available—if inspection had occurred, harm would have been averted—yet there is no coherent intervention variable without altering the very system being analysed. So interventionism either excludes legitimate causal claims or evaluates them via the hidden counterfactual judgments it claims to avoid.

  Maya: if there is no possible intervention, there is no identifiable causal mechanism. Those claims may be rhetorically useful, but they are causally defective. The cost is a virtue: it filters out spurious modal speculation.

  Leo: that proves too much. Many accepted causal explanations in history and institutional analysis depend on omissions for which direct intervention is conceptually impossible. Rejecting them all seems like a methodological straitjacket, not a clarification.

  Please go through the exchange and say who is right at each stage—on the nature of the do-operator, on omissions, and on the institutional case. Say also what both are missing, perhaps about whether the dispute concerns metaphysics or explanatory practice. Write in British English, in no more than 350 words, and do not include citations or a reading list.
reasoning: |-
  Hmm, the user wants me to adjudicate a debate between two philosophers of science, Maya and Leo, about interventionist accounts of causation. They're arguing about whether interventionism genuinely avoids counterfactual metaphysics or just hides it within formal models.

  Looking at their exchange:
  - Maya starts by praising interventionism (Pearl/Woodward style) for grounding causation in manipulable relationships rather than possible-world similarity like Lewisian theories. She sees interventions as empirical checks on local stability.
  - Leo counters that the do-operator is inherently counterfactual - it asks what "would" happen under hypothetical interventions. He argues interventionism just formalizes counterfactuals within graphs rather than eliminating them.
  - Maya pushes back that this localisation is valuable because it's constrained by causal structure, not vague intuitions about possible worlds.
  - Leo then raises the problem of omissions (like not watering a plant) and institutional cases (like a regulator's failure to inspect). He argues counterfactuals handle these naturally, while interventionism either excludes them or smuggles in counterfactual judgments when defining intervention variables.
  - Maya responds that if no intervention is possible, the causal claim is defective - which she sees as a strength that filters out speculation.
  - Leo retorts that this dismisses legitimate causal explanations in history and social sciences where omissions are central but interventions are conceptually impossible.

  I need to adjudicate point by point:
  1. On the do-operator: Leo is right that it's counterfactual in nature, but Maya is correct that its formal constraints are an improvement over Lewis's similarity metrics. Both miss that this is more about epistemology than metaphysics - the formalism makes counterfactuals tractable for modeling.
  2. On omissions: Leo's critique hits home. Defining "watering=0" as an observed state doesn't capture the causal force of absence, and the institutional case shows interventionism struggles with systemic properties. Maya's "defective claim" stance oversimplifies social science practice.
  3. On institutional cases: Leo wins this round. His example exposes interventionism's limitation with role-dependent causation, though Maya correctly notes such cases risk becoming untestable.

  Both philosophers are missing that their dispute reflects different explanatory priorities: Maya values testable mechanisms (good for experimental sciences), while Leo defends interpretive depth (crucial for historical analysis). The core tension isn't about eliminating metaphysics but about balancing formal rigor with explanatory scope - a trade-off between precision and applicability that varies across disciplines. I'll structure this as a point-by-point analysis in British English, keeping it under 350 words without citations.
answer: |-
  ### Adjudication of the Debate

  **On the do-operator:**  
  Leo is correct that the do-operator relies on counterfactual reasoning. Defining an intervention *does* require modal comparison ("what *would* happen if X were set by force?"). Maya is right, however, that localisation within a causal model constrains this counterfactual, replacing Lewis’s nebulous "similarity of worlds" with graph-based computation. Both miss that the dispute is partly terminological: interventionism formalises counterfactuals to make them empirically tractable, not to eliminate modality.  

  **On omissions:**  
  Leo’s critique is stronger here. For simple omissions (not watering a plant), interventionism can awkwardly force absence into a binary variable, but as Leo notes, this retrofits the "intervention". Maya’s claim that non-intervenable cases are "causally defective" is too dismissive. Leo correctly identifies that interventionism struggles with causally relevant absences, though Maya’s point about filtering speculative claims has merit in experimental contexts.  

  **On institutional cases:**  
  Leo wins this round. His regulator example exposes a genuine weakness: where an "intervention" (e.g., performing an inspection) requires dismantling the institutional role itself, the causal model’s variables become incoherent. Counterfactual judgments ("if inspection *had* occurred...") may still be intelligible here. Maya’s retort that such cases are "spurious" ignores established explanatory practices in social sciences.  

  **What both miss:**  
  The core disagreement concerns **explanatory practice**, not metaphysics alone. Maya prioritises testable, mechanistic causation (valuable in sciences), while Leo defends the legitimacy of non-intervenable causal claims (essential in history/social sciences). Interventionism doesn’t "conceal" counterfactuals; it operationalises them for modelling. Conversely, counterfactual dependence remains metaphysically prior—even in graphs—but the formalism avoids Lewis’s problematic ontology. The real issue is whether causal rigor requires manipulability *in principle*. Leo’s examples show that sometimes it cannot, demanding a broader epistemology.  

