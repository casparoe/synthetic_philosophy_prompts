prompt: |-
  I'm writting this for a reading group on mental causation, mostly Kim's causal exclusion argument, Davidson's anomalous monism, and the more recent proportionality stuff, and I keep having the feeling that each position is built to satisfy a slightly different job description, so I can't compare them fairly. Before I read any further, I want the full spec.

  Write the desiderata: what any adequate theory of mental causation has to deliver. Include the cases it has to get right (a decision causing a bodily movement, one belief causing another, a standing trait explaining a whole pattern of action over time), the distinctions it can't collapse (especially the difference between a mental state's actually producing an effect and its merely being counterfactually relevant to it), and the constraints it can't contradict (causal closure of the physical, if you take the evidence that way; the datum that mental life isn't systematically epiphenomenal; whatever constraints on causation you want to import from the general metaphysics of causation). For each requirement, give the case or consideration that makes it a requirement. Then mark which requirements are non-negotiable and which are just camp preferences — things like the demand that causation be production rather than mere difference-making, or the assumption that the relata are events and not properties, which people seem to assume but rarely defend. And the part I want to see most: tell me whether some subset of the requirements is jointly unsatisfiable. If the setup basically forces a choice among mental distinctness, physical causal closure, and the causal efficacy of the mental, say so, and say which candidate gives up which. A short scorecard of epiphenomenalism, type identity, and non-reductive physicalism against the list is fine, but keep the weight on the critera. End with a line beginning 'Verdict:' naming the single requirement that does the most work eliminating candidate theories.
reasoning: |-
  Okay, the user is part of a reading group on mental causation, focusing on Kim's exclusion argument, Davidson's anomalous monism, and proportionality. They're feeling that each theory serves a different purpose and wants a clear set of desiderata to evaluate them fairly. 

  First, I need to outline what any adequate theory of mental causation must achieve. The user specifically mentioned cases like decisions causing bodily movements, beliefs causing other beliefs, and standing traits explaining patterns of behavior. They also want distinctions like actual production vs. counterfactual relevance, and constraints like physical causal closure and avoiding systematic epiphenomenalism. 

  Let me start by listing the core cases. The decision-to-action case is non-negotiable because denying it leads to implausible epiphenomenalism. Introspective causation (like one belief causing another) is also crucial—ignoring this makes theories feel incomplete. Standing traits as pattern explanations highlight the need for dispositional properties to have causal relevance over time. 

  For distinctions, actual production vs. counterfactual dependence is key. Some theories (like difference-making accounts) might blur this, but production seems more intuitive for mental causation. The user also wants to flag which constraints are metaphysical preferences versus strict requirements. 

  Constraints: Physical causal closure has strong empirical support from physics and neuroscience—denying it would be a last resort. Avoiding systematic epiphenomenalism is non-negotiable; otherwise, mental states become irrelevant. The user also mentioned importing general causation frameworks (like event vs. property causation), but these are more flexible camp preferences. 

  Now, the tension points: The exclusion problem shows that mental distinctness + physical closure + mental efficacy can't all coexist. Each theory sacrifices one: epiphenomenalism drops efficacy, identity theory drops distinctness, and non-reductive physicalism struggles with efficacy under closure. 

  For the scorecard: Epiphenomenalism fails efficacy. Identity theory sacrifices distinctness but satisfies everything else. Non-reductive physicalism struggles with efficacy due to overdetermination worries. 

  The verdict should highlight the most impactful requirement. Physical causal closure does the heaviest lifting—it's the main driver of the exclusion argument that forces tough choices. Without it, theories could easily preserve both distinctness and efficacy. 

  The user's deeper need here is clarity amid conflicting frameworks. They want a structured way to compare theories without getting lost in jargon. By crystallizing the desiderata and tensions, they can engage more critically with the readings. Their frustration about "different job descriptions" suggests they need a unifying lens—this breakdown should provide that.
answer: |-
  Here's a comprehensive specification of desiderata for a theory of mental causation, designed as your evaluation framework:

  **Core Cases Any Theory Must Get Right (Non-Negotiable):**

  1.  **Decision-to-Action Causation:** A conscious decision (e.g., deciding to raise your arm) must genuinely cause the corresponding bodily movement (your arm raising). *Requirement Source:* Basic phenomenology of agency; denying this implies radical epiphenomenalism for conscious will, rendering action inexplicable.
  2.  **Mental-to-Mental Causation:** One mental state must genuinely cause another (e.g., perceiving smoke causing the belief "there's fire"; a sharp pain causing the desire "make it stop"; a belief causing a new belief via inference). *Requirement Source:* The coherence and dynamics of mental life; reasoning, learning, and cognitive processes demand genuine mental efficacy.
  3.  **Standing Trait Dispositional Causation:** Relatively stable mental properties (e.g., a phobia, a character trait like honesty, a standing belief) must be genuinely causally relevant in explaining *patterns* of behavior or mental states over time (e.g., the phobia causing avoidance behaviors in relevant situations; honesty causing truth-telling across varied contexts). *Requirement Source:* Explanation in psychology, psychiatry, and everyday life; traits explain *dispositions* to act, not just single events.

  **Essential Distinctions (Non-Negotiable):**

  4.  **Actual Causation vs. Mere Counterfactual Dependence:** The theory must distinguish between a mental state *actually producing* an effect and its merely being *counterfactually necessary/sufficient* for that effect. *Requirement Source:* Avoiding trivialization. Many things are counterfactually relevant (e.g., the Big Bang to my typing) without being causes. Mental causation must be more than just a correlation or a necessary condition in a chain; it needs "oomph" in the actual sequence.
  5.  **Mental Distinctness:** Mental properties/states must be distinct from (not identical to) their underlying physical realizers. *Requirement Source:* Multiple realizability (same mental state can be realized by different physical states), the autonomy of psychology (psychological laws aren't reducible to physical laws), and the apparent failure of strict psychophysical identities.

  **Key Constraints (Non-Negotiable):**

  6.  **Avoid Systematic Epiphenomenalism:** Mental properties/states cannot be systematically causally inert. *Requirement Source:* The core motivation for the problem; denying mental efficacy makes psychology illusory and agency impossible, contradicting experience and scientific practice.
  7.  **Physical Causal Closure (PCC):** Every physical event that has a cause has a *sufficient physical cause* (at the time it occurs). *Requirement Source:* Overwhelming empirical success of physics and neuroscience; no compelling evidence of "gaps" where non-physical causes *must* operate; provides a complete causal story for the physical domain. (Widely accepted as non-negotiable, though some dispute its *interpretation* or *scope*).
  8.  **No Widespread Systematic Overdetermination:** Effects cannot systematically have two *distinct* and *independently sufficient* causes (one mental, one physical). *Requirement Source:* Parsimony and implausibility; while genuine overdetermination (like two bullets) is possible, it's rare and coincidental. Systematic overdetermination for *every* action/mental event seems absurd.

  **Camp Preferences / Debated Framing Assumptions (Negotiable):**

  9.  **Causal Relata:** Whether causation relates events (Davidson), properties/instantiations of properties (Kim, proportionality), facts, or tropes. *Debate Source:* General metaphysics of causation; impacts how mental *properties* get causal relevance.
  10. **Metaphysics of Causation:** Whether causation is fundamentally about "production" (energy/momentum transfer, physical connection), "difference-making" (counterfactual dependence), nomological sufficiency, or primitive "oomph". *Debate Source:* Deep disagreements in general causation; influences how "actual causation" (Desid. 4) is understood and whether mental properties can satisfy it.
  11. **Strength of PCC:** Whether PCC requires only *a* sufficient physical cause or *a complete* sufficient physical cause (excluding non-physical additions). *Debate Source:* Interpretation of physics; impacts how "exclusion" works.
  12. **Level Fundamentalism:** Assumption that fundamental physical causation is the only "real" causation, and higher-level causation must reduce or be illusory. *Debate Source:* Metaphysical commitments; often implicit in exclusion arguments.

  **The Tension & Joint Unsatisfiability:**

  The core tension arises primarily among three non-negotiable desiderata:

  *   **(5) Mental Distinctness:** M ≠ P (Mental properties are not identical to physical properties).
  *   **(7) Physical Causal Closure (PCC):** Every physical effect has a sufficient physical cause P* (at the time).
  *   **(6/8) Mental Efficacy + No Widespread Overdetermination:** M causes E, but E doesn't have two distinct sufficient causes (M and P).

  **The Exclusion Problem (Kim):** If M is distinct from P (5), and P (or some physical cause P*) is sufficient for E due to PCC (7), then for M to *also* cause E, it seems E would be systematically overdetermined by M and P. But systematic overdetermination is implausible (8). Therefore, M appears excluded from genuinely causing E, violating Mental Efficacy (6). **These three are jointly unsatisfiable.** Any theory must deny or significantly reinterpret one.

  **Scorecard Against Desiderata:**

  | Desideratum              | Epiphenomenalism          | Type Identity Theory      | Non-Reductive Physicalism (NRP) |
  | :----------------------- | :------------------------ | :------------------------ | :------------------------------ |
  | **1. Decision-to-Action** | ✗ (Denies Efficacy)       | ✓ (via P)                 | ? (Struggles with Exclusion)    |
  | **2. Mental-to-Mental**   | ✗ (Denies Efficacy)       | ✓ (via P)                 | ? (Struggles with Exclusion)    |
  | **3. Standing Traits**    | ✗ (Denies Efficacy)       | ✓ (via P)                 | ? (Struggles with Exclusion)    |
  | **4. Actual Cause ≠ CFD** | ? (Vacuous)               | ✓ (M=P, so cause is P)    | ? (Often relies on CFD)         |
  | **5. Mental Distinctness**| ✓                         | ✗ (Denies: M = P)         | ✓                               |
  | **6. No Sys. Epiphen.**   | ✗ (Denies Efficacy)       | ✓                         | ✓ (Aims for, but Exclusion threatens) |
  | **7. PCC**                | ✓                         | ✓                         | ✓                               |
  | **8. No Widespr. Overdet.**| ✓ (No M cause)            | ✓ (M=P, so no distinct cause) | ? (Often accused of overdet. or preemption) |

  *   **Epiphenomenalism:** Sacrifices **Mental Efficacy (6)** to preserve **Distinctness (5)** and **PCC (7)**. Fails all core cases.
  *   **Type Identity:** Sacrifices **Mental Distinctness (5)** to preserve **PCC (7)** and **Mental Efficacy (6)** (by identifying M with P). Faces multiple realizability objection.
  *   **Non-Reductive Physicalism:** Tries to preserve **Distinctness (5)** and **Efficacy (6)** while accepting **PCC (7)**. Struggles fundamentally with **Exclusion/Overdetermination (8)** and often relies heavily on counterfactual dependence for actual causation **(4)**, which some find insufficient. Strategies (realization, supervenient causation, proportionality) aim to show M isn't excluded *despite* P*.

  **Verdict:** The single requirement that does the most work eliminating candidate theories is **Physical Causal Closure (7)**. It is the engine driving the causal exclusion argument. Without PCC, mental distinctness and efficacy could coexist easily. PCC forces the dilemma: either identify the mental with the physical (sacrificing distinctness), render the mental causally inert (sacrificing efficacy), or find a way to reconcile distinctness and efficacy under PCC without systematic overdetermination – the central challenge for Non-Reductive Physicalism and proportionality approaches.
