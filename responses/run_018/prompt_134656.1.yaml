  For the gallery opening scenario: abandoning it for antidote administration would be obligatory under clause 1 (low cost, direct harm prevention). 

  The only judgment my principle can't fully accommodate is case 4 - skipping surgery for book launch. My principle would permit it as protecting a central life-project with moderate cost, but the user sees it as blameworthy. This exposes a tension in their own verdicts between cases 1 and 4. 

