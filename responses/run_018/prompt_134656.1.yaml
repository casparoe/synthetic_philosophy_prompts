answer: |-
  Here is the five-item response:

  1.  **Principle Clause:** Agents have a stringent duty to prevent imminent, severe, and directly perceptible harm to a specific other when the cost of intervention is minimal disruption to ongoing, non-critical activity. **Verification Motivation:** This clause is motivated by the drowning child verdict (Case 2) – failing such a minimal-cost, direct intervention is monstrous. **Gallery Opening Prediction:** Abandoning the gallery opening to administer the antidote is obligatory; the cost is low (missed event) against imminent, severe, specific harm to a stranger. **Incompatibility:** None for this clause.

  2.  **Principle Clause:** Agents are morally permitted to privilege the integrity and continuity of their defining life-project(s) over maximizing impersonal good, provided the sacrificed good is large-scale but statistically diffuse, and the cost to the project is existentially significant disruption or fundamental redirection. **Verification Motivation:** This clause is motivated by the career-over-surgery verdict (Case 1) – sacrificing a core identity project for diffuse future good is not blameworthy. **Gallery Opening Prediction:** Abandoning the opening is *not* required under this clause, as the cost (missing one event) is not existentially significant disruption to the life-project. **Incompatibility:** None for this clause.

  3.  **Principle Clause:** Agents are not morally required to sacrifice resources beyond a moderate baseline (e.g., 10% income) for diffuse, statistical good, even if the further sacrifice could save more lives, as such demands lack the specificity and immediacy that generate stringent duties and threaten life-project continuity through cumulative erosion. **Verification Motivation:** This clause is motivated by the donation verdict (Case 3) – refusing to donate 50% is not a moral failure. **Gallery Opening Prediction:** This clause does not apply to the gallery opening scenario (which involves direct intervention, not diffuse donation). **Incompatibility:** None for this clause.

  4.  **Principle Clause:** Agents are blameworthy if they refuse a moderate-cost intervention to prevent severe, specific, and imminent harm to a known other, when the cost primarily involves postponing or rescheduling a significant but non-existential professional/social commitment within their life-project. **Verification Motivation:** This clause is motivated by the skipped-surgery-for-book-launch verdict (Case 4) – prioritizing the launch over a life is blameworthy despite the cost being smaller than Case 1. **Gallery Opening Prediction:** Abandoning the opening is obligatory under this clause (moderate cost: missed event; prevents specific, severe harm). **Incompatibility:** This clause conflicts with the *permission* granted in Case 1.

  5.  **Principle Clause:** It is categorically wrong, irrespective of consequences, to subvert the constitutive norms of a practice intrinsic to the agent's life-project (e.g., truthfulness in fiction for a novelist) as a means to an end, violating the internal integrity of the project itself. **Verification Motivation:** This clause is motivated by the falsified data verdict (Case 5) – wrong beyond selfishness due to violating literary norms. **Gallery Opening Prediction:** This clause does not apply to the gallery opening scenario. **Incompatibility:** The principle as a whole **cannot accommodate Case 4 (skipped surgery for book launch)** without contradiction. Clause 4 demands intervention for moderate cost to non-existential commitments, but Clause 2 permits refusing *massive* costs (like career change) for greater diffuse good. The user judges the refusal in Case 4 blameworthy despite the cost being *less* disruptive than in Case 1. The principle protects the project against existential disruption (Case 1) but not against moderate disruption for specific harm (Case 4), aligning with most verdicts, *except* that Case 4's cost falls below the existential threshold Clause 2 protects, making the refusal seem *less* justified than Case 1, yet Clause 4 renders it blameworthy, creating tension with the permission in Case 1.
