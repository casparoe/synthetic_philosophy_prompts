answer: |-
  The basement under the Leeds Central Library Archives smelled perpetually of damp concrete, ozone from ageing electronics, and the faint, sweet-sharp tang of decaying acetate. Eleanor ‘El’ Vance hunched over her workstation, the green glow of a spectral analyser reflecting in her tired eyes. Surrounding her: towers of obsolete tape decks, shelves crammed with brittle reel-to-reels spooled with history’s whispers, and the constant, low hum of dehumidifiers fighting a losing battle against the River Aire’s seepage.

  Her domain was the gaps. The dropouts. The moments where time, captured on Dictaphone microcassettes or quarter-inch tape, had simply… faltered. Corrosion, sticky shed syndrome, magnetic decay – they all conspired to eat milliseconds, sometimes seconds, of sound. El’s job was restoration. Her bespoke software, a jury-rigged Frankenstein of legacy code and open-source patches, analysed the waveform either side of a gap and *interpolated*. It filled the silence with its best guess based on context – a cough becoming a sigh, a mumbled consonant smoothed into a vowel, an awkward pause erased entirely.

  Lately, though, the gaps weren’t just on tape. They were in her head. Specifically, in her memories of arguments with Brendan, the perpetually cheerful, technically brilliant, and utterly infuriating digitisation specialist who worked two aisles over.

  Take last Tuesday. Brendan had breezed in, knocking over a precarious stack of unprocessed Betamax tapes. El had snapped, something sharp about "professional standards" and "decades of work." She remembered the flush on his neck, the tight set of his jaw. She *remembered* him muttering, low and bitter, "Right, well, maybe if *some* people spent less time polishing knobs and more time processing..." Then, a blank. A fuzzy discontinuity. And then he was smiling, handing her a lukewarm tea from the canteen, saying brightly, "Sorted the Betas, El. Brew?" The transition was seamless, jarringly smooth. Like the software had patched over the ugly middle bit.

  **Orwellian?** Had her consciousness, in the moment after, rewritten the past? Had she genuinely *experienced* Brendan’s insult, only for her mind to retroactively scrub it, inserting the conciliatory tea moment in its place? Erasing the uncomfortable truth, like Winston Smith’s diary entries vanishing down the memory hole.

  **Or Stalinesque?** Had the insult *never actually reached her conscious awareness at all*? Was her mind, like her software, simply interpolating a less abrasive narrative *before* the experience even registered? Airbrushing Brendan’s nastiness out before it could stain her perception, like a show trial where the inconvenient defendant simply never existed?

  The uncertainty gnawed at her. It felt like walking on spongy ground. She started keeping a log. A small, hard-backed notebook she’d liberated from the "disposal" pile. *Real ink on real paper.* After any interaction with Brendan, especially a tense one, she’d duck into the dank little toilet cubicle and scribble down her immediate recollection: *Brendan said: "Polishing knobs." Felt hot anger. Then... tea? Gap. Feels wrong.*

  But the log started feeling unreliable too. Yesterday’s entry: *He accused me of hoarding the good splicing tape. Voice tight. Said: "Typical El, sitting on the good stuff." Then... he offered a Jaffa Cake?* Had he actually offered the cake? Or was *that* the interpolation, smoothing over the sting of the accusation? The ink looked solid, definite, but the memory it described felt fluid, unstable.

  Then came the Dixon Tape.

  It was a reel labelled "Dixon, J. - Oral Hist. Mill Workers, 1977." Standard fare. But the playback was riddled with dropouts. El loaded it into the main restoration deck, a hulking beast she called Bertha. The software chugged, filling gaps in an elderly man’s reminiscences about looms and lunch breaks. She listened, half-attentive, cleaning her headphones with an alcohol wipe.

  A longer gap appeared. Three seconds. The software hummed, extrapolating. What came out wasn't seamless.

  "…and the foreman, Mr. Arkwright, he were a right bastard if you were slow," Dixon’s voice rasped. Gap. Interpolation triggered. But instead of a smooth continuation, two voices overlayed each other in the filled silence: Dixon’s familiar rasp, *but also* a higher, sharper, female voice El didn’t recognise, both speaking different words simultaneously. "*…never paid overtime proper…*" (Dixon) tangled with "*…took my wages, he did…*" (the woman). It was cacophonous, impossible. The software hadn't chosen *a* path; it had tried to fill the gap with *two* contradictory possibilities at once.

  El froze, the alcohol wipe forgotten. The impossible voices echoed in the damp silence of the basement. Her heart hammered against her ribs. *Error in the interpolation. Contamination. Cross-talk the algorithm couldn't resolve.*

  A cold dread washed over her. If the machine could produce such a nonsensical, contradictory patch… what was her own mind doing? When it encountered a gap in her experience – a moment of high stress, a flash of anger – was it filling it with one smooth, plausible narrative? Or was it, somewhere beneath the surface of her awareness, generating multiple, clashing possibilities? Was the seamless transition from Brendan’s insult to the offered tea *her* mind’s successful interpolation, hiding a messy, contradictory reality she couldn't perceive? Or was the *memory of the insult itself* the faulty patch, generated later to explain the inexplicable gap?

  She pulled out her logbook, fingers trembling. Flipped to the entry about the splicing tape accusation. *"Said: 'Typical El, sitting on the good stuff.'"* The ink was slightly smudged, perhaps from damp. Or had her thumb rubbed it while writing? Or… was the smudge somehow part of the record, a physical manifestation of the uncertainty? Did the words *really* capture what happened, or were they just another layer of interpretation?

  The flickering monitor light caught the dust motes dancing in the air. Down here, surrounded by decaying history and machines that guessed at the gaps, Eleanor Vance felt the past, both recorded and remembered, shift like sand underfoot. Was she meticulously restoring the truth of her own consciousness, only to realise she might be editing the original master tape? Or were the uncomfortable originals never really there at all, just phantom signals lost in the neural noise, replaced before she could even register them? The only certainty was the hum of the dehumidifiers, the smell of vinegar syndrome, and the chilling echo of two impossible voices arguing in a silence that never was. The question – Orwellian or Stalinesque? – hung heavy and unresolved in the damp Leeds air, as solid and as elusive as the tapes whispering their corrupted secrets all around her.
