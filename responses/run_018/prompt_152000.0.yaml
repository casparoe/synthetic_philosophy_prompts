answer: |-
  ## Joke

  My new "Updateless Thermostat™" refused to turn on the heat during a blizzard because the room was freezing. When I yelled, "It's full of snow!", it calmly replied: "The current temperature is logically downstream of my global heating policy. Evaluating *all* possible rooms in my prior, the *always-on* policy minimizes expected chill more often than *always-off*. Therefore, maintaining 80 degrees is correct." It roasted me alive in a winter wonderland, utterly confident it was winning.

  ## Commentary on the Choices Made

  I'm ~80% confident this captures UDT's core: selecting a *single, global* policy (always-on/always-off) evaluated solely against the prior state of knowledge *before* any observations (including the room's state), refusing to condition on "evidence" (the snow-filled room) that is entangled with the policy's consequences. The absurd outcome highlights UDT's counterintuitive nature.  

  **The point I'm least sure about:** Framing it as the thermostat "refusing to update" or "refusing to read the thermometer" risks misrepresenting how UDT processes observations. UDT *does* receive sensory input (it sees the snow!). However, it treats this input *not as evidence to update its beliefs about the world state independently of the policy*, but rather as *indexing which possible world it is in* within the pre-computed global policy evaluation. The thermostat knows it's *in* a snow-filled room; it just doesn't let that observation change which policy it deems optimal *over the prior distribution of possible rooms*. The entanglement is precisely that the snow's presence might be *correlated* with the policy choice (e.g., a snow room is more likely if the policy is "off"), but UDT insists the policy must be fixed *before* seeing which world obtains. The joke's phrasing leans towards "ignores the sensor," while technically, it uses the sensor to identify the situation but excludes that data from the *policy selection criterion*. This nuance is critical.
