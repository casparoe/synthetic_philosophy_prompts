answer: |-
  Here's a decision tree mapping the logical space of guilt vs. shame, focusing on witness requirements, triggers, institutional design, and unintended consequences. Leaves include the view name, its core position, and its "awkward commitment." Two leaves collapse under collective attribution (noted).

  ---

  **Guilt vs. Shame: Moral Emotion Engineering Decision Tree**

  1.  **START: Does the emotion require an ACTUAL witness?**
      *   **YES →** Go to 2 (Shame-Prone Path)
      *   **NO (Counterfactual witness suffices) →** Go to 3 (Guilt-Prone Path)

  **SHAME-PRONE PATH (Actual Witness Required)**

  2.  **Is the trigger primarily breaking an internalized rule OR losing social rank/status?**
      *   **Breaking Internalized Rule →** Go to 4
      *   **Losing Social Rank/Status →** Go to 5

      4.  **Rule-Breaking Shame:** Shame arises from rule violation *only* when actually witnessed. *Awkward Commitment:* Requires constant surveillance to enforce morality; private immorality is "free" if undetected.
      5.  **Status-Preserving Shame:** Shame arises primarily from perceived loss of standing in the eyes of others. *Awkward Commitment:* Permits harmful acts if they *boost* status; moral worth is entirely contingent on social perception.

  **GUILT-PRONE PATH (Counterfactual Witness Suffices)**

  3.  **Is the trigger primarily breaking an internalized rule OR losing social rank/status?**
      *   **Breaking Internalized Rule →** Go to 6
      *   **Losing Social Rank/Status →** Go to 7

      6.  **Internalized Guilt:** Guilt arises from violating internal standards, regardless of witnesses. *Awkward Commitment:* Risk of excessive self-punishment or moral scrupulosity disconnected from social harm; institutions may struggle to *trigger* it reliably.
      7.  **Status-Anxiety Guilt:** "Guilt" arises from anxiety about *potential* status loss if actions *were* known (counterfactual witness = disapproving audience). *Awkward Commitment:* Blurs into shame; motivation is still fundamentally social fear, not pure rule-integrity. *COLLAPSES into Status-Preserving Shame (Leaf 5) under collective attribution.*

  **INSTITUTIONAL DESIGN & LEAKAGE (Applies to Both Paths - Focus on Goal)**

  8.  **Can institutions reliably cultivate Target Emotion (e.g., Pure Guilt) without the Other leaking back in?**
      *   **YES (Target Emotion Achievable) →** Go to 9
      *   **NO (Leakage Inevitable) →** Go to 10

      9.  **Engineered Purity:** Institutions (e.g., emphasizing personal conscience, private confession) can foster Target Emotion while suppressing the Other. *Awkward Commitment:* Neglects essential social functions of the suppressed emotion (e.g., shame's role in signaling untrustworthiness or motivating public apology/repair), potentially weakening social cohesion or accountability mechanisms.
      10. **Inevitable Hybrid/Leakage:** Attempts to engineer one emotion inevitably create conditions for the other to emerge or fulfill necessary functions. *Awkward Commitment:* Accepts messy moral psychology; pure engineering is impossible, leading to unintended consequences (e.g., guilt-focused systems creating hidden shame spirals, shame-focused systems generating covert guilt). *COLLAPSES distinction between Rule-Breaking Shame (4) and Internalized Guilt (6) under collective attribution if the "rule" is collectively attributed.*

  ---

  **Collapsed Leaves under Collective Attribution:**

  1.  **Status-Anxiety Guilt (Leaf 7) collapses into Status-Preserving Shame (Leaf 5):** If the "potential disapproving witness" is the collective itself (society, community), the anxiety about status loss *to that collective* is functionally identical to shame triggered *by* the collective's perception.
  2.  **Rule-Breaking Shame (Leaf 4) & Internalized Guilt (Leaf 6) distinction collapses:** If the "internalized rule" is deeply and uniformly held *by the collective*, and the collective acts as the salient witness/counterfactual witness, the experience of violating it blends shame (facing the group) and guilt (violating the shared internal standard). The emotion becomes a hybrid focused on failing the collective's internalized norm.

  **Tree Summary (8 Leaves):**
  1.  Rule-Breaking Shame (4)
  2.  Status-Preserving Shame (5)
  3.  Internalized Guilt (6)
  4.  Status-Anxiety Guilt (7) *Collapses w/ 5 under collective attrib.*
  5.  Engineered Purity (9)
  6.  Inevitable Hybrid/Leakage (10) *Collapses 4 & 6 distinction under collective attrib.*
