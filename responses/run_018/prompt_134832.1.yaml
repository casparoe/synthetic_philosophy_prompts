  i need a prep sheet for the Q&A, ordered by how much damage each objection does, phrased the way these people would actually say it — so cosmologist-style objections about reference-class instability, philosopher-style ones about whether im smuggling in a metaphysics of causation, and the ethics student asking why causal accessibility should matter for moral weight at all. for each one give me a two-minute reply and an honest note on where that reply is weakest. also tell me what i should concede upfront about the reference-class problem rather than trying to hide it. and please include the one question im praying nobody asks — the one that exposes the softest joint in my argument. dont ask me for a bibliography or reading list, i dont have access to search right now and i just need the objections mapped out. also i think i spelled "accessability" wrong in my slides but thats not important.
