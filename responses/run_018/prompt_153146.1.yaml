  But grounding is usually about explanation or determination, not propositional unity. The user might be conflating two issues: the structure of facts versus explanatory relations. Grounding explains why something is the case, but Bradley's problem is about what makes a proposition unified. So the user's "fix" might not directly apply to Bradley's original issue. 

