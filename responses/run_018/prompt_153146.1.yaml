  Also, proponents of grounding often avoid Bradley's regress by denying it's a real problem. Some might argue that relations don't require further relations to connect to their terms. But that's a separate stance. The user's point highlights that declaring something primitive is a common philosophical move, but it doesn't necessarily resolve the underlying metaphysical issue. 

  I should acknowledge that the user's observation is astute. They're seeing a structural similarity between Bradley's regress and infinite grounding chains. But grounding is meant to be explanatory, not compositional. Their deeper need might be reassurance that their understanding isn't off-track, while clarifying distinctions between different metaphysical problems. 

