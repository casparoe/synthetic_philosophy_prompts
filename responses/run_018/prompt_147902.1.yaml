answer: |-
  ### Decision Tree: Navigating Reference-Class Ambiguity in Forecasting  
  *Root Question: When estimating the success probability of a new AI startup, do you let case-specific details ("inside view") influence your choice of reference classes?*  

  1. **No, I avoid case-specific details entirely**  
     → *Next Question: How do you select a reference class without any inside-view input?*  
     - **"I pick the broadest possible class (e.g., ‘all startups ever’)."**  
       → **Leaf 1: Naive Outside-Viewism**  
       *Awkward commitment: You must accept that the base rate for coffee shops is equally valid for your quantum-computing startup.*  
     - **"I average all reference classes in my dataset (e.g., every industry/timeline I have)."**  
       → **Leaf 2: Universal Averaging**  
       *Awkward commitment: You must treat the failure rate of 1800s whaling ships as equally relevant to your AI startup.*  

  2. **Yes, I use case-specific details**  
     → *Next Question: Do you rely on one reference class or combine multiple?*  
     - **"I pick one narrow class (e.g., ‘AI startups post-2020’)."**  
       → **Leaf 3: Inside-View Selection**  
       *Awkward commitment: You must believe your gut instinct about which class fits best is never biased or overfitted.*  
     - **"I combine multiple plausible classes."**  
       → *Next Question: How do you weight them?*  
       - **"I assign equal weight to all classes I deem plausible (e.g., AI, SaaS, and deep-tech startups)."**  
         → **Leaf 4: Reference-Class Averaging**  
         *Awkward commitment: You must agree that your judgment of ‘plausibility’ doesn’t imply some classes are better than others.*  
       - **"I weight classes based on similarity to my case but penalize extreme adjustments."**  
         → **Leaf 5: Lindy-Modest Weighting**  
         *Awkward commitment: You must defend penalizing adjustments by an arbitrary decay rate (e.g., -10% per ‘step’ from the base rate).*  
       - **"I use a Bayesian model to weight classes by how well they predict cases like mine."**  
         → **Leaf 6: Full Bayesian Model Averaging**  
         *Awkward commitment: You must accept that your Bayesian priors are just inside-view biases in disguise.*  

  ---

  ### Key Notes:  
  - **Indistinguishable Leaves**:  
    - **Leaf 4 vs. Leaf 5**: The tree can’t separate "equal weighting" from "Lindy weighting" if you skip defining the penalty function. Both start with inside-view class selection.  
  - **Empty Combinations**:  
    - **"Pure outside-view with no class selection"**: Incoherent—you must pick *some* class or aggregation method.  
    - **"Inside-view class selection with no base rates"**: Unexplored (e.g., using only causal models).  
  - **Total Leaves**: 6 (covers all requested stances + universal averaging).  

  ### Handout Flow:  
  - Start at the root. Answer each question based on your intuition.  
  - Reach a leaf → confront its "awkward commitment" to stress-test your stance.  
  - Discuss: *Which leaf feels safest? Which commitment is hardest to swallow?*
