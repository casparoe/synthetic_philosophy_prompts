answer: |-
  The residue indicates that cryptographic-provenance models expose conceptual imprecision in the intentionalist debate's core concept of "meaning," not merely a defect in the digital-forensics framework.

  **Core Debate Restatement (Cryptographic Provenance Terms):**
  1.  **Strong Anti-Intentionalism:** Publication broadcasts a signed payload; valid interpretation requires only payload analysis and hash verification confirming the artifact's integrity as received, rendering signer metadata (authorial intent) irrelevant to payload meaning. Chain-of-custody ends at publication broadcast.
  2.  **Moderate Intentionalism:** The signatory's (author's) verified signature on the payload establishes provenance and defines the valid decryption key for the intended plaintext meaning. While payload analysis is essential, ignoring the verified signatory metadata constitutes an integrity failure, as chain-of-custody includes the signing event. Subsequent transmissions must preserve the signed payload's integrity.
  3.  **Emergent Reader-Community View:** Meaning is generated through distributed payload analysis consensus across nodes (readers), forming a dynamic ledger of interpretations. The original signatory's authority diminishes post-broadcast; chain-of-custody is superseded by network validation of payload mutations or derived annotations, creating new, collectively signed provenance records.

  **Translation Analysis:**

  *   **Strong Anti-Intentionalism:**
      *   **Clean Translation:** Publication as broadcasting a signed payload; interpretation as payload analysis/hash verification; text autonomy as payload integrity being self-sufficient.
      *   **Distorted Translation:** "Intentional fallacy" mapped to ignoring signer metadata overemphasizes the *irrelevance* of intent within the model, whereas literary anti-intentionalism often argues intent is *unknowable* or *unnecessary*, not just irrelevant metadata. Treating all valid interpretations as passing hash verification implies a singular integrity check, whereas literary anti-intentionalism allows multiple valid interpretations of the same payload.
      *   **No Analog:** The normative claim that focusing on signer metadata is a *fallacy*; the phenomenological experience of encountering the text *as* an autonomous artifact.

  *   **Moderate Intentionalism:**
      *   **Clean Translation:** Author as signatory; publication as broadcasting signed payload; authorial intent as signer metadata defining the valid decryption context (key); textual variants requiring chain-of-custody verification.
      *   **Distorted Translation:** Equating authorial intent with a cryptographic key implies a deterministic, single correct decryption (meaning), which moderate literary intentionalism rarely claims, allowing for nuance and "horizons." Treating private drafts/pre-publication materials as escrowed keys or unsigned precursors is clumsy; they are more like earlier commits in a version history.
      *   **No Analog:** The normative claim that we *should* respect the signatory's authority; the concept of "legitimate but not exclusive" guidance – cryptography demands verification or rejection, not graded legitimacy; the role of biographical context beyond the signing event metadata.

  *   **Emergent Reader-Community View:**
      *   **Clean Translation:** Consensus interpretation as distributed ledger validation; evolving meaning as new, collectively signed annotations or payload forks; diminished authorial authority post-broadcast.
      *   **Distorted Translation:** Mapping reader consensus to cryptographic consensus (e.g., PoW/PoS) grossly misrepresents the mechanics and purpose of both. Literary consensus is interpretive, not transactional or integrity-based. "Payload mutations" imply changes to the original signed artifact's hash, which contradicts the model's core integrity principle – reader views are interpretations *of* the payload, not alterations *to* it.
      *   **No Analog:** The constructed nature of the "author-function" versus the fixed identity in signing; the idea of meaning being *created* by the community rather than *discovered* in the payload; the lack of any equivalent to cryptographic finality in interpretation.

  **Residue Report:**
  The significant residue – particularly the untranslatable *normative claims* (e.g., "should respect," "is a fallacy"), the *phenomenological experiences* (e.g., being addressed, encountering autonomy), the *graded legitimacy* of intent in moderate views, and the *constructed/creative* nature of community meaning – fundamentally exposes a **limitation in applying cryptographic integrity models to hermeneutics**. These models excel at verifying provenance and payload integrity but inherently lack the conceptual machinery to handle the *evaluative*, *experiential*, and *generative* dimensions central to literary meaning-making. However, the exercise **also reveals conceptual imprecision** in the original debate: the vague ontological status of "intention" (metadata? key? inaccessible black box?), the ambiguous mechanics of how intent "constrains" interpretation (deterministic decryption? fuzzy guidance?), and the often-undefined source of interpretive authority in reader-response theories become starkly apparent when forced into a model demanding precise definitions of identity, verification, and data integrity. The residue stems primarily from an ontological mismatch between data integrity and meaning generation, though it also highlights unresolved ambiguities within the literary theories themselves.
