  First, I need to unpack the unstated beliefs baked into "transparent stewardship." Let me mentally list them: 
  - That physical possession is separable from moral accountability (hence keeping objects while apologizing) 
  - That information access (scans, co-curation) can substitute for repatriation  
  - That museums are neutral "stewards" rather than beneficiaries of violence 
