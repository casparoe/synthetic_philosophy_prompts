  Wait, is that consistent? If museums claim universality but control interpretation, that's contradictory. And when they "share authority" temporarily, it's still on their terms. The user's spot-on about that tension.  

  Now for interpretive sovereignty - that flips everything. Source communities wouldn't just advise displays; they'd own the narrative. Museums would become lenders or hosts, not authorities. Physical return would be the default unless communities choose otherwise. Big shift!  

