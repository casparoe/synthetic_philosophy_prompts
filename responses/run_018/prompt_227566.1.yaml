prompt: |-
  So my coworker and I keep getting into this argument about population ethics, of all things, and I want to figure out what her actual view is because I genuinely can't pin it down. Here's how she's answered when I've thrown cases at her over the past few months:

  - Mere addition: you have a world with a billion very happy people, and you can add another billion people with good lives without affecting the first group at all. She says go for it, the world is strictly better, no hesitation.
  - The classic repugnant conclusion setup: a billion people with amazing lives versus a trillion people whose lives are barely worth living, just barely net positive. She picked the billion and got kind of annoyed I even asked. She said a world can be worse precisely because it contains more lives if those lives are crummy enough.
  - Creating an extra happy person, but doing it slightly reduces the welfare of already-existing people (like, they each lose a tiny bit of wellbeing to fund the new person's existence). She said don't do it. If the person doesn't exist yet, nobody's being wronged by not creating them, but the existing people ARE being made worse off.
  - Same as the last one, except the "cost" to existing people is purely symbolic, like a policy they mildly dislike but that doesn't actually affect their wellbeing at all. She flipped: create the person. Fine. Whatever. (I think she was mostly just calling the case dumb, but she did give a verdict.)

  New case I want to hit her with: humanity has a chance to seed a colony on Mars. The colonists would have genuinely good, flourishing lives, well above the bar of a life worth living, but noticeably below the average quality of life on Earth, since Earth keeps getting richer while the colony stays resource-strapped. Founding the colony has zero effect on Earth people's welfare either way. Would she say yes to the colony?

  What I want from you: (1) your best guess at her verdict and why, (2) at least two or three different principles or theories of population ethics that all fit her four verdicts so far, and how each one rules on the Mars case, (3) if the verdicts genuinely underdetermine the answer, tell me what further case I could put to her that would actually distinguish the live candidates, and (4) where you do land on a guess, tell me how confident you are.

  One more thing: I know some of this territory is heavily fought over in the literature and some of it is basically common ground. Please be upfront about which parts of your answer reflect genuine consensus or near-consensus among people who work on this stuff and which parts are you picking sides in a live dispute. Don't dress up a contested position as the settled view just because it makes the answer cleaner.
reasoning: |-
  Okay, the user is having a debate with their coworker about population ethics and wants help figuring out her underlying principles. They've described four specific cases where she gave clear answers, and now they're planning to present a new Mars colony scenario. The user wants me to: predict her response to Mars, identify ethical theories that fit her past answers, suggest follow-up cases if needed, and be transparent about academic consensus.

  First, I need to analyze the coworker's pattern across the four given cases. In mere addition, she approves adding happy people at no cost. In the repugnant conclusion, she rejects massive population increase with barely-positive lives. For the third case (creating a person with welfare cost), she opposes it due to harm to existing people. But in the fourth case (purely symbolic cost), she flips to approving creation. This suggests she weighs existing people's welfare heavily but isn't strictly anti-natalist.

  The Mars case is interesting: colonists would have genuinely good lives (above "worth living" threshold) but below Earth's average, with zero impact on Earthlings. My strong instinct is that she'd approve this—it mirrors mere addition where new good lives are created without harming anyone. The quality difference doesn't seem decisive since her repugnant conclusion rejection was about barely-positive lives, not sub-average-but-still-good ones.

  For theories fitting her pattern: Critical-Level Utilitarianism (CLU) is a top contender—it adds a welfare threshold before new lives count positively. Her repugnant conclusion rejection aligns with CLU's avoidance of valuing barely-positive lives, while mere addition fits if the critical level is below her "crummy" threshold. Mars should be fine under CLU since colonists are above the critical level. 

  Another fit is Person-Affecting Views with asymmetry: not creating isn't wrong (explains case 3), but creating good lives without harm is good (cases 1 & 4). Her case 3/case 4 split shows she cares about actual harm, not just preferences. Mars should get a green light here too.

  Weakly Discontinuous Averagism could also work—it values average welfare but doesn't infinitely prioritize it. Her rejection of repugnant conclusion avoids collapsing into total utilitarianism, while mere addition might be acceptable if the average drop is small (unlike the trillion-people case). Mars approval would depend on whether the quality gap crosses her discontinuity threshold; I'd guess not, given her tolerance in mere addition.

  If these theories all point to "yes" on Mars, I need a distinguishing follow-up case. A "Non-Identity Problem" scenario would work: choosing Policy A (future generation has high welfare) vs. Policy B (different, larger generation with lower but still good welfare, where the specific people wouldn't exist under A). If she prefers A, it suggests averagism; if indifferent or prefers B, it points to CLU or person-affecting views.

  I should note consensus issues: rejection of repugnant conclusion is widely shared, but theories diverge sharply afterward. Mere addition acceptance is common but not universal. Her harm/symbolic-cost distinction is non-standard and makes person-affecting views a bit strained. 

  Confidence on Mars prediction is high (85%)—it structurally resembles her "yes" cases more than "no" cases. The follow-up non-identity case will be crucial for pinpointing her framework.
answer: |-
  Based on your coworker's pattern, here's the breakdown for the Mars case and the underlying ethical theories:

  1.  **Predicted Verdict for Mars Colony: APPROVE (High Confidence - ~85%)**
      *   **Why:** This case strongly mirrors the "Mere Addition" scenario she approved. Adding lives that are *genuinely good/flourishing* (well above "barely worth living") without negatively impacting existing people aligns perfectly with her first verdict. The *difference in average quality* between Earth and Mars doesn't seem decisive for her, as she rejected the Repugnant Conclusion due to the *crumminess* of the added lives, not *merely* their lower average. Since the Martian lives are stipulated as "good/flourishing," the quality gap shouldn't trigger her Repugnant Conclusion rejection. The lack of impact on Earth seals it.

  2.  **Theories Fitting Her Four Verdicts & Ruling on Mars:**
      *   **Critical-Level Utilitarianism (CLU):**
          *   **Core Idea:** The value of adding a person depends on their welfare *relative to a critical level* (C), not just zero. Adding a life is good only if welfare > C. C is typically set above zero (e.g., "moderately good"). Total welfare is calculated as Σ(W_i - C) for all individuals i.
          *   **Fits Verdicts:**
              *   Mere Addition: Added lives have high W > C, so good. Total welfare increases.
              *   Repugnant Conclusion: Trillion lives have W just above zero but < C. Σ(W_i - C) is hugely negative. Billion lives have high W > C, so Σ(W_i - C) is large positive. Billion world is vastly better.
              *   Creation w/ Welfare Cost: New life has W_new > C? But existing lives lose welfare (ΔW_existing < 0). The *net* effect on Σ(W_i - C) is likely negative (losses likely outweigh gain of (W_new - C)), especially if the cost per existing person is significant relative to the new person's surplus. Don't create.
              *   Creation w/ Symbolic Cost: Symbolic cost means ΔW_existing ≈ 0. Adding (W_new - C) > 0 is a net gain. Create.
          *   **Mars Ruling:** APPROVE. Martian lives have W_m > C (since "good, flourishing"). Earth lives unchanged (ΔW_earth = 0). Σ(W_i - C) increases significantly. *This is the strongest fit overall.*
      *   **Person-Affecting Views with Asymmetry & Harm Focus:**
          *   **Core Idea:** Moral significance lies in how actions affect *particular people who exist or will exist independently of the choice*. Key features: (a) **Asymmetry:** Not creating a potential person with a good life is *not wrong* (no one is harmed by *not* existing). (b) **Harm Avoidance Priority:** Harming existing (or future-determinate) people is bad. (c) **Benefiting:** Adding good lives *without harming anyone* is good.
          *   **Fits Verdicts:**
              *   Mere Addition: Adding good lives without harming anyone is good. Existing people unaffected.
              *   Repugnant Conclusion: Creating the *trillion* lives involves bringing into existence vast numbers whose lives, while net positive, are so poor that it constitutes a kind of *collective harm* or violates a duty to *only create lives above a certain threshold*. (This requires supplementing the core person-affecting idea with a sufficiency threshold). Alternatively, she might view it as failing to benefit the potential people *enough* to justify the overall dismal state.
              *   Creation w/ Welfare Cost: Harms existing people (reduces their welfare). The benefit to the non-existent person doesn't morally compensate because that person wasn't *harmed* by not being created. Don't create.
              *   Creation w/ Symbolic Cost: No *actual welfare harm* to existing people (only symbolic dislike). Adding a good life without harming anyone is good. Create.
          *   **Mars Ruling:** APPROVE. Creating Martians adds good lives without harming anyone on Earth (zero effect). Martians' lives are clearly above any plausible sufficiency threshold ("good, flourishing").
      *   **(Weakly) Discontinuous Averagism:**
          *   **Core Idea:** Value is based on average welfare per person, but with a *discontinuity* or strong weighting against adding lives below a certain quality threshold, even if above zero. Adding lives slightly below average might be acceptable if *high enough*, but adding lives close to zero is terrible regardless of quantity.
          *   **Fits Verdicts:**
              *   Mere Addition: Adding lives *with high welfare* slightly lowers the average, but because the added lives are *well above the discontinuity threshold*, the slight average drop is acceptable and the world is better overall (total welfare increases significantly).
              *   Repugnant Conclusion: Adding vast numbers of lives *barely above zero* drastically crashes the average far below the discontinuity threshold. This is catastrophically bad, worse than the high-average world.
              *   Creation w/ Welfare Cost: Lowers the average welfare (existing people lose welfare, new person might be below/average). Likely a net negative change, especially depending on magnitudes. Don't create.
              *   Creation w/ Symbolic Cost: Symbolic cost doesn't change welfare, so ΔW ≈ 0. Adding a person with positive welfare increases total welfare but lowers average welfare. However, if the new life's welfare is high enough (well above the discontinuity threshold), the average drop might be deemed acceptable. She begrudgingly approves ("Fine. Whatever.").
          *   **Mars Ruling:** LIKELY APPROVE, but less certain than other theories. The quality gap ("noticeably below" Earth's average) is key. If "noticeably below" still means *well above her discontinuity/sufficiency threshold* (implied by "good, flourishing"), adding them slightly lowers the global average but adds significant total welfare. This mirrors Mere Addition. If "noticeably below" gets too close to her threshold for comfort, she *might* hesitate. Given her Mere Addition approval despite a slight average drop, APPROVE is probable.

  3.  **Distinguishing Follow-Up Case (If Needed):**
      The Mars case likely gets the same answer (Approve) under all plausible theories fitting her prior views. To distinguish CLU/Person-Affecting from Discontinuous Averagism, use a **Non-Identity Problem case**:
      *   **Case:** We must choose between two policies affecting future generations:
          *   **Policy A:** Leads to a smaller future population (say, 1 billion) with *very high* average welfare (e.g., 100 units).
          *   **Policy B:** Leads to a larger future population (say, 10 billion) with *lower but still clearly good* average welfare (e.g., 60 units). Crucially, the *specific individuals* who exist in the future under Policy B are *different* from those who would exist under Policy A. Neither policy harms people who would otherwise exist - it just determines *which* potential people come into existence.
      *   **Why this distinguishes:**
          *   **Critical-Level Utilitarianism (CLU):** Likely prefers **Policy B** if Σ(W_i - C) is larger. (Assuming C < 60: 10B * (60 - C) > 1B * (100 - C)).
          *   **Person-Affecting w/ Asymmetry:** Likely sees **no strong reason to prefer either**, as no one is harmed by choosing A or B. The people in B aren't deprived by choosing A (they wouldn't exist), and vice-versa. Adding good lives in B is good, but not adding them in A isn't wrong. Might be indifferent or weakly prefer B for total good. Her Repugnant Conclusion rejection suggests she might lean towards **Policy A** (higher quality) if she applies a sufficiency threshold strongly.
          *   **Discontinuous Averagism:** Strongly prefers **Policy A** because it has a much higher average welfare (100 vs. 60). The discontinuity makes the lower average of B significantly worse, even though the lives are good. Total welfare doesn't compensate.

  4.  **Consensus vs. Contested Positions:**
      *   **Near Consensus:** The Repugnant Conclusion is widely considered a serious problem for Total Utilitarianism. Rejecting it in the form your coworker did (preferring a smaller, happier population over a vast one with barely-positive lives) is a very common starting point for alternative theories. Her acceptance of Mere Addition (no-harm, adding good lives) is also widely shared, though not universal (e.g., strict averagists reject it).
      *   **Contested Territory:**
          *   **Theories Themselves:** CLU, Person-Affecting views, and Averagism (especially discontinuous forms) are all active, contested approaches. There is no consensus on which is correct.
          *   **Her Specific Nuances:** Her sharp distinction between *welfare cost* (don't create) and *purely symbolic cost* (create) is crucial. CLU handles this cleanly via net welfare calculation. Person-Affecting views need to define "harm" strictly as welfare reduction. Discontinuous Averagism struggles slightly as both cases lower the average. This nuance makes CLU the *cleanest* fit.
          *   **The Mars Case:** While I predict Approve with high confidence based on her pattern, the *degree* to which average quality differences matter *below* the "crumminess" threshold is specific to her intuitions. It's contested whether sub-average-but-good lives should be added when they lower the average.

  **Conclusion:** Your coworker rejects Total Utilitarianism due to the Repugnant Conclusion and prioritizes avoiding harm to existing people over creating new ones when there's a trade-off. **Critical-Level Utilitarianism** provides the most parsimonious explanation for her specific combination of answers, including the welfare vs. symbolic cost distinction, and predicts **approval for the Mars colony**. Person-Affecting views with a sufficiency threshold and Discontinuous Averagism also fit reasonably well and also predict approval for Mars. Use the Non-Identity case (Policy A vs. Policy B) to distinguish between these live options if needed. Good luck with the debate!
