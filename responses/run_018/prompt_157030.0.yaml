answer: |-
  1.  **Literal description:** Scientists practice science without consciously applying philosophical theories, just as birds fly without ornithological knowledge. **True but trivial**; doesn't justify dismissal as it merely states a fact about practice vs. explicit knowledge.
  2.  **Methodological independence:** Scientific methods are developed and validated *through scientific practice itself*, not derived from prior philosophical analysis. **True (heuristic value)**; supports ignoring *foundational* philosophy questions in a *methods* class, but not all inquiry.
  3.  **Epistemic sufficiency:** The knowledge and reasoning *internal* to successful science are sufficient for its progress and justification, making external philosophical validation unnecessary. **Debatable/Partially True (justificatory value)**; can justify dismissing requests for *external* philosophical justification, but ignores philosophy's role in clarifying internal concepts.
  4.  **Irrelevance:** Philosophical analysis offers no genuine insight or improvement to actual scientific practice or the understanding of its methods. **False**; dismisses philosophy's heuristic value (sparking ideas) and justificatory value (clarifying foundations/limits), making dismissal unwarranted.
  5.  **Harmful distraction:** Engaging with philosophy actively hinders scientific progress by diverting focus from empirical work to unresolvable abstract debates. **Radical & Generally False**; while over-fixation *can* be unproductive, philosophy often aids heuristic exploration and justificatory rigor; dismissal based on this claim is ideological.
