prompt: |-
  hey im in philosophy of science this semster and my ta keeps throwing feynmans ornithology line at us — philosophy is to scientists like bird study is to birds — whenever someone asks about method. i get that its dismissive but i feel like the slogan is hiding a bunch of different arguments and he just picks the strongest one without saying which. can you lay out exactly five precise readings of what that comparison could actually mean, ordered from the totally obvious platitude to the actually radical claim? for each one just tell me in a sentence or two whether its true, false, or just trivial, and whether that specific version actually supports dismissing a question in class. also please work in the distinction between heuristic value and justifactory value somewhere — i think people conflate those but im not sure. answer as exactly five numbered items, each one or two sentences max, with zero intro or conclusion. and dont tell me to check specific books, i cant.
