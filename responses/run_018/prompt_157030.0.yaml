  The heuristic/justifactory distinction is key here. Heuristic value is about discovery and process, while justifactory concerns validation. Many philosophy debates conflate these, so I'll clarify where each interpretation falls on that axis.

  For example, when claiming scientists don't need philosophy to conduct research (interpretation 2), that's about heuristic process being independent - true but trivial. But claiming philosophical analysis can't improve methods (interpretation 4) falsely denies its justifactory potential.

