  ## Office of the Nomisma: Public Information Bulletin  
  *Serving the Virtuous Exchange Since [Redacted]*

  The Office of the Nomisma administers the city-state's monetary system according to the principles of sound reason and natural justice. Our sole purpose is to facilitate the equitable exchange of goods necessary for the well-ordered household (*oikos*), ensuring tokens serve solely as conventional measures of true need (*chreia*). The system operates by civic convention (*nomos*), not immutable nature, reflecting the Assembly's sovereign will. This bulletin addresses common inquiries regarding our procedures.

  1.  **Why does the value of my coins change weekly?**  
      The intrinsic value of coinage resides not in the material (clay, tin), but in its conventional measurement of communal demand. Our weekly Demand Index surveys households to quantify shifts in the intensity and distribution of *chreia*. If demand for grain surges relative to sandals, the Nomisma tokens required to acquire a standard measure of grain will increase proportionally next week. This ensures tokens accurately reflect the real standard of value: current communal need. Stability arises from accurate measurement, not fixed token quantity. Carry the latest Demand Index schedule when transacting.

  2.  **I am a builder who needs shoes. How do I legally trade with the shoemaker?**  
      Direct barter is inefficient. You must first file Form NC-7b (*Declaration of Diagonal Conjunction Intent*) with the Exchange Rectification Bureau. Officials will assess the proportionate value of your house-claim relative to the shoemaker's footwear, based on the current Demand Index and the intrinsic usefulness (*chreia*) of shelter versus foot protection. Crucially, they will establish the ratio wherein *you* stand to the shoemaker as the *shoes* stand to the *house*. Only once this proportion is certified and the diagonal conjunction formally recorded (Fee: 1 token) may the actual tokens be exchanged for the goods. This guarantees equivalence before transfer.

  3.  **Why are savings accounts offering interest illegal?**  
      Interest constitutes the unnatural generation of money from money. Nomisma tokens exist solely by convention to facilitate the exchange of useful goods. They are sterile signs, incapable of natural reproduction. Generating tokens from tokens (*tokos*) divorces wealth from real *chreia* and fosters the limitless, unnatural pursuit of token accumulation (*chrematistike*), corroding household virtue. The Office of Usury Prevention actively monitors for any transaction where deposited tokens appear to "breed" (e.g., interest-bearing deposits, speculative futures). Such activities are confiscated and recycled into public amphorae.

  4.  **What is Clay Token Reissue Day?**  
      Held annually (or as the Assembly decrees), this vital civic exercise demonstrates the conventional nature of Nomisma. All existing tokens are declared void. Citizens surrender old tokens and receive new ones, differentiated by a unique annual stamp, in quantities proportionate to their certified household need (*chreia*) assessed via the latest Demand Index. This prevents the dangerous misconception that tokens possess inherent, enduring value independent of the Assembly's decree and the current state of communal demand. Hoarding void tokens is futile and subject to compost duty.

  5.  **Professor Ivor Bullion (University of Midas Point) claims banning interest stifles growth and that money is naturally a commodity/store of value. How do you respond?**  
      Professor Bullion fundamentally mistakes convention for nature. Nomisma tokens are not commodities like wheat or iron; they are abstract measures established by law for equitable exchange within our polis. Their "storage" of value is purely conventional and temporal, reset by the Demand Index and Reissue Day. The "growth" he champions is the unnatural, limitless *chrematistike* we explicitly reject as destructive to the household and civic order. True wealth (*oikonomia*) is bounded by the needs of the virtuous life, not token accumulation. His theories belong to a different, less enlightened, convention.

  6.  **Can I use Nomisma tokens for trade outside the city-state?**  
      No. Nomisma tokens derive their validity solely from the convention (*nomos*) established by our Assembly and the current quantification of *chreia* within our citizen body. Beyond our borders, this convention ceases. Our tokens revert to inert clay or base metal. Visitors must exchange external coinage for Nomisma tokens at the Border Rectification Office upon entry (using a simplified diagonal conjunction protocol), and reverse the process upon departure. Attempting to use Nomisma externally, or bring external "commodity-money" into internal circulation, violates the Monetary Purity Act.

  7.  **What distinguishes acceptable household management from illicit wealth-getting?**  
      Natural wealth-getting (*oikonomia*) is the acquisition of goods sufficient for the good life of the household – sustenance, shelter, tools, modest comforts – acquired through direct management of resources or equitable exchange measured by *chreia*. It is limited by purpose. Illicit *chrematistike* is the pursuit of token accumulation as an end in itself, divorced from genuine need. It employs techniques like interest, bulk speculation purely for token gain, or hoarding tokens beyond certified need. The Office monitors token velocity and concentration to identify and rectify *chrematistike*, redirecting tokens towards virtuous household circulation.
