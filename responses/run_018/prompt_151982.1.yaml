  First, gotta acknowledge the audience split: half are scholars who breathe "School of Names" texts, half are here for pizza and credit. That means zero jargon but also zero dumbing down—tightrope walk time. The white horse argument isn't just a party trick; it's the spine of the talk. Need to frame it as a live wire still zapping us today. 

