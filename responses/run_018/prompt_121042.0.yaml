  The user also wants to know what case would split these rules apart. A child or animal recognizing a pattern without understanding the structure might help distinguish between "conscious insight" and "mechanistic behavior." If the partner denies this is JOOTSing, she's likely privileging explicit meta-representation. If she accepts it, consciousness might be key.

