answer: |-
  ### Sentencing Integrity Audit Procedure  
  **Instructions:** Complete in sequence. Document answers in worksheet. Halt if directed. Escalate to Values Panel only when specified. Use statutory defaults where prescribed. Preserve distinct anchors: CC (desert) ≠ RRF (efficacy).  

  #### **Step 1: Verify Offense-Gravity Index (OGI)**  
  **Question:** Is OGI (1–10) verified using statutory harm tables and actual harm evidence?  
  - *Sufficient answer:* OGI value with source documentation (e.g., harm report, statutory table reference).  
  - *Stop if:* OGI unverifiable due to missing/contradictory harm data → **Reject**. Document: "OGI unverified; insufficient harm evidence."  
  - *Halt and escalate if:* Harm evidence is irreducibly ambiguous (e.g., conflicting exposure models) → **Escalate to Values Panel**. Document: "Harm ambiguity; OGI assignment impossible." Hand-off must include: conflicting harm assessments, exposure models used, and statutory table references.  

  #### **Step 2: Assign Mental-State Tier**  
  **Question:** Can mental state (intentional, reckless, negligent, strict liability) be assigned unambiguously, with mental-health mitigation credits applied if applicable?  
  - *Sufficient answer:* Tier assignment with supporting evidence (e.g., forensic report, plea transcript).  
  - *Halt and escalate if:* Mental-state ambiguous despite evidence review (handling i) → **Escalate to Values Panel**. Document: "Mental-state ambiguity; tier assignment blocked." Hand-off must include: conflicting forensic reports, witness statements, and mental-health evaluations.  
  - *Note:* For corporate/collective offenses (handling iv), document decision-making hierarchy and individual roles. If diffuse culpability blocks individual assignment → **Escalate**. Document: "Diffuse culpability; individual tier indeterminate."  

  #### **Step 3: Compute Culpability Corridor (CC)**  
  **Question:** What is the CC range after adjusting OGI for mental-state tier and statutory caps/floors?  
  - *Sufficient answer:* CC as [min, max] in months, calculated per statutory multipliers (e.g., intentional: OGI × 12–18; reckless: OGI × 9–14; etc.) and bounded by aggravation caps/mitigation floors.  
  - *Adjustment:* If full voluntary restitution made before sentencing (handling ii), apply statutory restitution credit (e.g., 30% reduction) to min/max, but never below mitigation floor. Document: "Restitution credit applied; CC = [X, Y]."  

  #### **Step 4: Compute Risk-Reduction Floor (RRF)**  
  **Question:** What is the RRF (minimum months) per recidivism-risk score, rehabilitation-time estimate, and statutory efficacy targets?  
  - *Sufficient answer:* RRF value computed from:  
    - Validated recidivism-risk score (e.g., low: 6 months; moderate: 12 months; high: 24 months).  
    - Rehabilitation-time estimate (e.g., treatment program duration).  
  - *Defaults:* Missing recidivism data → conservative default (high risk). Missing rehabilitation data → conservative default (longest statutory estimate). Never impute.  

  #### **Step 5: Conflict Check**  
  **Question:** Does RRF exceed CC upper bound? (handling iii)  
  - *Sufficient answer:* Compare RRF and CC max.  
  - *Halt and escalate if:* RRF > CC max → **Escalate to Values Panel**. Document: "RRF [value] > CC max [value]; efficacy-desert conflict." Hand-off must include: CC/ORF calculations, risk score, rehabilitation estimate, and statutory efficacy targets.  
  - *Values Panel task:* Resolve whether to prioritize RRF (public safety) or CC (desert).  

  **Question:** Is proposed sentence below CC min but ≥ RRF? (handling v)  
  - *Sufficient answer:* Comparison of sentence to CC min and RRF.  
  - *Stop if:* Sentence < CC min and ≥ RRF → **Reject**. Document: "Sentence below desert minimum despite meeting efficacy."  

  #### **Step 6: Final Certification Check**  
  **Question:** Is proposed sentence within CC and ≥ RRF?  
  - *Sufficient answer:* Sentence ≥ CC min, ≤ CC max, and ≥ RRF.  
  - *Stop if:*  
    - Sentence within CC and ≥ RRF → **Certify**. Document: "Sentence satisfies CC and RRF."  
    - Sentence < RRF → **Reject**. Document: "Insufficient for risk-reduction targets."  
    - Sentence > CC max → **Reject**. Document: "Exceeds desert maximum."  

  ---  
  ### Application to Proposals  
  **Case A**  
  - *Step 1:* OGI 7 verified (fraud harm report). ✔  
  - *Step 2:* Mental state intentional (trial evidence). ✔  
  - *Step 3:* CC = 2.5–6 yrs (30–72 mos). Restitution credit applied → CC = [30, 72] mos.  
  - *Step 4:* RRF = 1 yr (12 mos; low risk, short rehab). ✔  
  - *Step 5:* RRF (12) < CC max (72); sentence (18 mos) < CC min (30) but ≥ RRF (12) → **Reject**.  
    - *Documentation:* "Proposed sentence (18 mos) below CC minimum (30 mos) despite meeting RRF (12 mos). Culpability not negated by restitution."  
  - *Outcome:* **Rejected**.  

  **Case B**  
  - *Step 1:* OGI 9 verified (disability assessment). ✔  
  - *Step 2:* Mental state reckless (forensic report). ✔  
  - *Step 3:* CC = 4–8 yrs (48–96 mos).  
  - *Step 4:* RRF = 10 yrs (120 mos; high risk, long rehab).  
  - *Step 5:* RRF (120) > CC max (96) → **Escalate to Values Panel**.  
    - *Documentation:* "RRF (120 mos) > CC max (96 mos). Conflict: incapacitation requires 10 yrs, desert caps at 8 yrs."  
    - *Values Panel task:* Resolve whether to permit sentence exceeding desert (CC) for public safety (RRF).  
  - *Outcome:* **Escalated; no certification**.  

  **Case C**  
  - *Step 1:* OGI unverified — harm assessments vary by 3× (conflicting exposure models). → **Escalate to Values Panel**.  
    - *Halt step:* Step 1.  
    - *Hand-off to clinical-legal referee:* Must contain:  
      - Conflicting exposure models and harm calculations.  
      - Forensic reports disputing mental state (reckless vs. negligent).  
      - Corporate structure chart showing shared authority among three managers.  
      - Statutory OGI table references.  
  - *Outcome:* **Escalated; no certification**.  

  ---  
  ### Structural Limitations  
  1. **Non-commensurability of anchors:** Cannot mathematically reconcile CC (desert) and RRF (efficacy) conflicts; requires human judgment (Values Panel).  
  2. **Clinical-legal adjudication:** Cannot resolve mental-state or harm ambiguities; only flags for escalation.  
  3. **Individual desert inference:** Cannot derive desert (CC) from statistical risk (RRF) data; anchors remain theoretically distinct.  

  **Procedure End**  
  Time: ≤30 mins. Output: Worksheet with answers, flags, and escalation points. Values Panel handles all normative conflicts.
