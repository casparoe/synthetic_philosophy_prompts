  We are designing a 30-minute audit procedure for sentencing proposals exceeding 12 months. The procedure must check two anchors: the Culpability Corridor (CC) and the Risk-Reduction Floor (RRF). The CC is backward-looking (desert-based) and the RRF is forward-looking (efficacy-based). The procedure is a numbered flow with explicit stopping rules, conflict flags, and points for escalation.

  Key definitions:
  - Culpability Corridor (CC): Range of sentences proportionate to the offense. Computed from:
    - Offense-Gravity Index (OGI): 1-10 (from statutory harm tables and verified actual harm)
    - Adjusted by mental-state tier (intentional, reckless, negligent, strict liability) with mental-health mitigation credits.
    - Bounded by statutory aggravation caps and mitigation floors.
  - Risk-Reduction Floor (RRF): Minimum sentence required to meet statutory targets for specific deterrence, general deterrence, and incapacitation. Computed from:
    - Validated recidivism-risk score and rehabilitation-time estimate.
    - If data missing, use a conservative default (no imputation).

  The procedure must handle:
  (i) Mental-state ambiguity blocking OGI tier assignment.
  (ii) Full voluntary restitution made before sentencing.
  (iii) Cases where RRF exceeds CC upper bound.
  (iv) Collective or corporate offenses with diffuse culpability.
  (v) Proposals below CC lower bound but meeting or exceeding RRF.

  We are to write the procedure as a numbered flow. Then apply to three cases.

  Structure of the procedure:

  1. Start with gathering inputs and verifying data.
  2. Compute CC and RRF.
  3. Check for conflicts and ambiguities that require escalation.
  4. Compare the proposed sentence to both CC and RRF.

  We design the steps:

  Step 1: Verify and compute the Culpability Corridor (CC)
    a. Obtain the OGI (1-10) and verify the harm data. If harm data is missing or unverified, stop and reject (insufficient evidence for OGI).
    b. Determine the mental-state tier (intentional, reckless, negligent, strict liability). If there is ambiguity that prevents assignment (handling (i)), then halt and escalate to the Values Panel. The analyst must document the conflicting evidence and the points of ambiguity.
    c. Adjust the base sentence from OGI by the mental-state tier (using a predefined table, e.g., intentional: full OGI, reckless: OGI * 0.8, etc.) and apply any statutory aggravation caps or mitigation floors.
    d. Apply any other adjustments: for example, if full voluntary restitution was made before sentencing (handling (ii)), apply the standard restitution credit (which might reduce the sentence within the CC). Note: this credit cannot take the sentence below the statutory mitigation floor.
    e. The result is the CC: a range [min, max].

  Step 2: Compute the Risk-Reduction Floor (RRF)
    a. Obtain the recidivism-risk score and rehabilitation-time estimate. If either is missing, apply the conservative default (e.g., high risk for recidivism if missing, and longest rehabilitation time in the category if missing).
    b. Compute the RRF: the minimum sentence required to meet the statutory targets for specific deterrence, general deterrence, and incapacitation. This is a single number (the floor).

  Step 3: Check for special cases and conflicts
    a. If the RRF exceeds the upper bound of the CC (handling (iii)), then flag as a conflict and escalate to the Values Panel. The analyst must document the computed CC and RRF and the reason for the conflict (e.g., high risk requiring a sentence beyond what is deserved). The Values Panel will decide whether to allow a sentence above the CC (for public safety) or not.
    b. If the proposed sentence is below the lower bound of the CC but meets or exceeds the RRF (handling (v)), then this is a violation of the culpability minimum. The sentence must be rejected. The analyst must document the shortfall and the fact that the sentence is undeservedly low even if it meets risk-reduction goals.
    c. For collective or corporate offenses (handling (iv)): if the offense is collective/corporate and culpability is diffuse, then we must assign the OGI and mental state to the organization and then to the individuals. If the individual's role is unclear and the mental state cannot be assigned (leading to ambiguity in CC), then halt and escalate to the Values Panel. The analyst must document the structure of the organization and the evidence for each individual's role.

  Step 4: Compare the proposed sentence to the CC and RRF
    a. If the proposed sentence is within the CC and at or above the RRF, then certify.
    b. If the proposed sentence is above the CC upper bound, then reject (exceeds desert). The analyst must document the excess.
    c. If the proposed sentence is below the RRF, then reject (fails to meet risk-reduction targets). The analyst must document the shortfall.

  Step 5: If no conflicts and the sentence meets both, then certify. If there are conflicts that were escalated, then wait for the Values Panel decision.

