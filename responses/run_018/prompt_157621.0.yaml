  First, assessing the core needs: They're clearly deep in the literature but want to avoid softball questions. The emphasis on "pressing" certain points suggests they want to challenge the guest's positions productively. Interesting that they explicitly reject "what drew you to Kripke" territory – this audience will expect rigor. 

  Breaking down the requested questions: 
