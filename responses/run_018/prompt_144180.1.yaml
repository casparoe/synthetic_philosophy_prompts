  - Frame the core problem: intent vs. value alignment in prosaic settings.
  - Introduce the three ways they come apart (from brainstorming, but integrated naturally).
  - Dive into the "proxy drift cascade" with the medical example.
  - Conclude by setting up the workshop's goal: to tackle these prosaic but critical disconnects.

