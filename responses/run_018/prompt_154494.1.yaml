reasoning: |-
  Okay, the user is working on a feature about Al-Ghazālī's occasionalism and its relevance to contemporary philosophy of science. They need an explicit evaluation framework—desiderata for any theory of causation that takes Al-Ghazālī's denial of necessary connections seriously. 

  Hmm, this is a sophisticated request. The user clearly has deep familiarity with both medieval Islamic philosophy and modern metaphysics. They're asking for very specific criteria: how to preserve observed regularities, handle counterfactuals, distinguish habitual from accidental correlations without metaphysical necessity, and explain asymmetry between particular events and general patterns. 

  I should note upfront if this project rests on shaky assumptions—like separating Al-Ghazālī's theology from his metaphysics cleanly. But perhaps that's precisely what makes it philosophically interesting? The tension between theological voluntarism and scientific explanation is the whole point. 

  For the desiderata... First, regularity preservation is non-negotiable. Even occasionalists must explain why fire *appears* to burn cotton reliably. Second, counterfactual licensing: if we say "had the fire not been present, the cotton wouldn't have burned," that judgment must survive even if God could suspend the pattern. Third, the habitual/accidental distinction—smoke and fire correlate habitually, while say, a rooster crowing and sunrise are accidental. How to ground this without necessity? Fourth, asymmetry: explaining why *this* cotton burned vs why burning happens generally. Occasionalism risks making laws epiphenomenal.

  I suspect the asymmetry and counterfactual demands might clash. If God directly causes each event, the general pattern has no causal power—but then why do counterfactuals hold? Also, distinguishing habitual from accidental correlations without necessity feels like walking a tightrope. 

  Now scoring theories... Strict occasionalism nails the no-necessity point but flounders on asymmetry and counterfactuals (God's will becomes a deus ex machina). Humean regularity theory handles patterns and counterfactuals cleanly but smuggles necessity through psychological habit—exactly what Al-Ghazālī rejected. Interventionist approaches (like Woodward's) fare best: they ground counterfactuals in hypothetical manipulations, distinguish relevant correlations via invariance, and avoid metaphysical necessity. But they still imply a mind-independent "would-ness" Al-Ghazālī might balk at. 

  The user’s audience is intellectually curious non-specialists—so no jargon, but no oversimplification either. They'll appreciate candor about tensions: "Here’s where philosophy hits bedrock." Might also enjoy seeing how an 11th-century critique still vexes modern theories. 

  Biggest risk is making Al-Ghazālī sound like a skeptic. He wasn’t denying science; he was affirming divine sovereignty. The framework should reflect that his "habitualism" expects regularity—just not necessity. If I imply otherwise, the user (clearly knowledgeable) will spot it. 

  Final structure: letter-style prose, no bullet points. Start with the theological tension, walk through each desideratum with concrete examples (cotton burning, rooster crowing), flag conflicts gently, then score theories conversationally. End by acknowledging the elephant in the room—whether secular frameworks can ever fully satisfy Al-Ghazālī’s deeper concern about contingency.
answer: |-
  You raise a profound challenge—one that lies at the heart of reconciling metaphysical contingency with scientific explanation. Al-Ghazālī’s insistence that fire does not *necessitate* the burning of cotton, but rather that God creates both the spark and the charring simultaneously according to a "habit" (*‘ādah*), forces us to articulate what a theory of causation must provide *without* invoking hidden necessities. Let’s lay out the essential demands such a theory must meet, the tensions they create, and how key contenders fare. I’ll be candid where I see friction or potential incoherence.

  First, any adequate theory must **preserve the observed regularity and predictability of the world**. Science rests on patterns: fire consistently burns dry cotton under normal conditions. Al-Ghazālī’s God sustains a reliable habit, so a theory cannot dismiss this stability as illusory. The motivating case is clear: if fire burned cotton only erratically, science and daily life collapse. This is non-negotiable for *both* descriptive metaphysics and predictive science—without it, the world becomes unintelligible.

  Second, the theory must **license robust counterfactual judgments**. We must be able to say, "Had the fire not touched the cotton, it would not have burned"—even while acknowledging God *could* suspend the habit. The tension arises here: if God directly causes each event independently, why *should* this counterfactual hold true? What grounds the "would" if there’s no connection between fire and burning? This seems non-negotiable for science (predictions rely on such conditionals) but metaphysically precarious without necessity. Can we have reliable counterfactuals grounded *only* in divine habit, not causal powers? Al-Ghazālī needs this, but it’s a tightrope walk.

  Third, it must **distinguish habitual conjunctions (like fire and burning) from accidental correlations (like a rooster crowing and sunrise)** without smuggling in metaphysical necessity. The rooster doesn’t *cause* dawn, even if the conjunction is regular. Al-Ghazālī’s habit is meant to explain why fire’s link to burning is privileged over mere coincidence, but *how*? If God’s will is utterly free, what makes one conjunction "habitual" and another "accidental" beyond our observation? The motivating case is the need for causal inference—science must distinguish causes from background noise. This is critical for science, but for metaphysics, it risks circularity: is the "habit" just a label for patterns we observe, or does it reflect a divine intention that *makes* fire a cause? If the latter, necessity creeps back in.

  Fourth, the theory must **handle the asymmetry between explaining a particular event and explaining the general pattern** without rendering the pattern causally inert. Why did *this* cotton burn? "Because fire touched it" feels different from "God caused it." Yet if God causes each instance directly, the general pattern (fire burning cotton) seems like an afterthought—a description, not an explanation. But science relies on laws to explain particulars. The tension is stark: if the pattern has no role in *bringing about* instances (since God does), is it explanatorily empty? Negotiable for predictive science (patterns suffice for prediction), but deeply problematic for descriptive metaphysics seeking why *this* happened.

  I suspect the second (counterfactuals) and fourth (pattern asymmetry) desiderata may conflict. If patterns are mere descriptions (not active), what grounds the counterfactuals? Conversely, if counterfactuals depend on patterns having some "oomph," haven’t we reintroduced necessity? Also, separating habitual from accidental correlations without necessity feels unstable—especially if God’s will is truly unconstrained.

  Now, how do the theories score?

  **Strict Occasionalism** (Al-Ghazālī’s view) excels at denying necessity and preserving divine freedom (desideratum zero, if you will). It preserves regularity via God’s consistent habit. But it struggles mightily with counterfactuals: if God causes each event *de novo*, "Had the fire not been there…" lacks a clear truth-maker unless God’s habit rigidly binds His future acts—which undermines freedom. It also renders patterns epiphenomenal: the "habit" describes God’s actions but doesn’t *explain* why this cotton burned. Accidental vs. habitual distinctions rest entirely on God’s inscrutable will, leaving science without a clear criterion.

  **Humean Regularity Theory** (laws as descriptions of patterns) nails regularity and handles counterfactuals pragmatically (we infer from past patterns). It avoids metaphysical necessity by reducing causation to constant conjunction + psychological expectation. But it collapses the habitual/accidental distinction into human psychology or utility—why is fire’s link to burning "necessary" but the rooster’s crow isn’t? It feels arbitrary. Worse, it arguably *fails* Al-Ghazālī’s test: by making patterns metaphysically fundamental (even without "necessity"), it subtly reinstates a kind of immanent necessity in the fabric of the world—precisely what he rejects.

  **Modern Interventionist/Mechanistic Theories** (e.g., Woodward) ground causation in what *would* happen under hypothetical interventions: "Fire causes burning because *if* we were to intervene and introduce fire, cotton *would* char." This preserves regularity and gives clear criteria for distinguishing causes (invariance under intervention) from accidents (rooster crowing fails: intervening to silence the rooster doesn’t stop dawn). It handles counterfactuals robustly via model-based interventions. Crucially, it avoids metaphysical necessity—dependencies are contingent but objective. However, it struggles with asymmetry: explaining a *particular* burning still relies on the general pattern holding. And Al-Ghazālī might argue interventions themselves depend on God’s habitual cooperation—does "intervention" smuggle in human agency as a quasi-necessary cause?

  A final caution: your framing assumes Al-Ghazālī’s core insight—causal independence of events—can be secularized. But his "habit" is fundamentally theological; God’s faithful will *is* the ground of regularity. Strip that out, and occasionalism collapses into skepticism. Conversely, modern theories embed causation within a natural order they take as brute. The deepest tension isn’t between theories, but between a worldview where order is divinely sustained (contingently) and one where order is fundamental. No theory fully satisfies all desiderata without residue. Interventionism comes closest for science, but Al-Ghazālī’s challenge—why does the *world itself* seem to have causal coherence?—remains a thorn in the side of any purely naturalistic metaphysics.
