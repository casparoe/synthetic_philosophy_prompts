prompt: |-
  I'm running a study-group session for some final-year psych undergrads who've just done a module on introspection but haven't touched philosophy of mind. I want to walk them through illusionism about phenomenal consciousness — the view that phenomenal properties are a kind of representational fiction cooked up by introspective mechanisms, a bit like predictive-processing models that misrepresent their own predictions as direct qualitative feels. Don't explain the theory to me; plan how I should explain it in about forty-five minutes.

  What has to come first so the idea doesn't sound like behaviourism in disguise, which concrete example should carry the whole session (and why not the standard Mary-the-scientist or zombie case, if those aren't the right ones), and which misconceptions they'll definately form — I'm guessing 'illusionism means we don't really experience anything' and 'it's just denying the obvious' — with exactly where in the sequence I should head each one off. I also need to know what I should openly refuse to explain at this level — maybe the metaphysical debates about physicalism vs dualism? — and one check question at the end that shows whether they've understood that phenomenal character is misrepresented rather than denied. Please write in British English, and finish with a single line beginning 'Plan summary: ' followed by a one-sentence summary of your plan.
reasoning: |-
  Alright, let me tackle this query step by step. The user is running a study group for final-year psychology undergraduates who've studied introspection but not philosophy of mind. They want to introduce illusionism about phenomenal consciousness in 45 minutes without it being mistaken for behaviourism. 

  First, I need to establish why illusionism isn't behaviourism. Behaviourism dismisses internal states, while illusionism acknowledges rich internal representations. Highlighting this difference early is crucial. Maybe start by contrasting both views using a concrete example like visual illusions, which illustrate misrepresentation without denying subjective experience.

  Next, choosing the right example is key. The user mentioned avoiding Mary or zombies. I think the thermal grill illusion works well because it demonstrates a qualitative feel (burning cold) arising from misrepresentation, which students can relate to. This example clearly shows how the brain creates a non-existent sensation, fitting illusionism's core idea.

  I should anticipate misconceptions. Students might think illusionism denies experience altogether or dismisses introspection as invalid. Addressing these early by stressing that experiences are real but misrepresented will prevent confusion. For instance, during the thermal grill explanation, emphasize that the burning sensation is genuinely felt but misattributed.

  What to avoid? Deep metaphysical debates about physicalism vs dualism. The session should focus on introspective mechanisms and representational errors, not broader philosophical arguments. Also, steer clear of neuroscientific details to keep it accessible.

  For a check question, ask something like: "If someone says illusionism claims we don't experience pain during the thermal grill, what's wrong with that?" The correct answer should highlight that the experience is real but misrepresents the stimulus, showing understanding of misrepresentation vs. denial.

  Finally, structure the session: start with the illusionism-behaviourism contrast, use the thermal grill as the central example, address misconceptions when introducing the illusion, and end with the check question. Keep explanations focused on psychology, avoiding philosophy and neuroscience tangents.
answer: |-
  Here’s a structured 45-minute plan for teaching illusionism to psych undergrads, prioritising clarity and avoiding common pitfalls:

  **Phase 1: Groundwork (10 mins)**  
  - **Start with introspection’s limits:** Briefly recap their module — e.g., "You’ve studied how introspection accesses mental states, but *how* does it construct what we report?"  
  - **Contrast with behaviourism:** Explicitly state: *"Illusionism isn’t denying inner experiences like behaviourism did. Behaviourism ignored subjective states; illusionism says subjective states exist but are misdescribed by introspection — like mistaking a CGI dragon for a real one."*  
  - **Key upfront distinction:** *"Illusionism targets *phenomenal properties* (the ‘raw feel’), not conscious states themselves. We *have* experiences, but their ‘ineffable qualitative glow’ is introspective misrepresentation."*

  **Phase 2: Core Example — The Thermal Grill Illusion (20 mins)**  
  *(Why this? It’s empirically grounded, visceral, and avoids philosophical abstractions of Mary/zombies)*  
  - **Demonstrate:** Show image/video of the grill (alternating warm/cool bars creating a burning sensation). Ask: "What would you *feel* touching this?"  
  - **Mechanism:** Explain predictive processing briefly: *"Your brain expects ‘harm’ from alternating temps, generates a ‘burn’ prediction. Introspection misreads this prediction as a direct physical property — ‘heat’ — rather than a computed signal."*  
  - **Link to illusionism:** *"The ‘burn’ isn’t out there, nor a fundamental property in your mind. It’s a *useful misrepresentation* by introspection. Similarly, ‘redness’ isn’t in the world OR a non-physical ‘quale’ — it’s introspection misrepresenting visual processing."*

  **Phase 3: Tackling Misconceptions (10 mins)**  
  *(Preempt during/after the example)*  
  1. **"Illusionism denies experience"**: Head off **during the example explanation**. Stress: *"You absolutely *feel* the burning illusion! Illusionism says the *nature* of that feeling is misrepresented — not that it doesn’t occur. The *what-it’s-like* is real, but it’s not what introspection claims."*  
  2. **"It’s denying the obvious"**: Address **after the example**. Say: *"Introspection *feels* obvious, but so did ‘the sun orbits Earth’. Illusionism asks: could introspection be a *user interface* simplifying neural processes, not a literal truth-teller?"*  

  **Phase 4: Consolidation & Check (5 mins)**  
  - **Refuse to dive into:** Metaphysical debates (physicalism vs dualism) and hard problem solutions. State: *"Today’s focus is the *psychology of introspection*, not solving metaphysics."*  
  - **Check Question:**  
    *"In illusionism, when you stub your toe, does it deny you feel pain? If not, what *does* it say is illusory?"*  
    **Target Answer:** *"No — the pain experience is real. The illusion is that introspection misrepresents neural signals as intrinsic ‘pain qualia’ rather than a representational state."*  

  **Plan summary:** Contrast illusionism with behaviourism upfront, anchor in the thermal grill illusion to show misrepresentation of predictive signals, preempt key misconceptions during the example, and verify understanding via a pain-question check.
