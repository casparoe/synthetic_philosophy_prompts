  Key constraints: 
  - Must be a 45-minute question (25 marks) 
  - Arithmetic should support reasoning, not dominate it 
  - No citations—everything self-contained in the answer 
  - Model answer ~700 words with clear marking scheme 
  - Crux must be explicit upfront: "Group competence depends on independence and individual competence" 

  The user's suggested wrinkles are strong, but I'll prioritize correlated errors and unequal competence. Correlated errors expose how CJT's independence assumption is fragile in practice (e.g., shared memos creating blocs), while unequal competence introduces the tension between majority rule vs. expert deference. The sub-50% case is powerful but risks overshadowing nuance if combined; better as a standalone twist. 

  For the question setup: A 19-member licensing committee fits well—odd number avoids ties, size allows calculable probabilities without excessive computation. Scenario 1: Five members share a memo (correlated errors). Scenario 2: Varying competences where the best member is strong (0.9) but others weaker, forcing comparison of majority vs. expert rule. 

  Model answer structure: 
  1. Restate CJT assumptions 
  2. Break Scenario 1: Correlated bloc caps group competence 
  3. Break Scenario 2: Weighted voting/expert rule beats majority 
  4. Synthesize: Why CJT doesn't automatically endorse democracy 
  5. Highlight contested implications (democracy vs. epistocracy) 

  Marking scheme: 5 key moves, 5 marks each. Top marks require hitting: 
  - Correlated errors → ceiling effect 
  - Unequal competence → weighted voting superiority 
  - Finite vs. asymptotic distinction 
  - CJT silence on competence sources 
  - Legitimacy/epistocracy tension 

  Common pitfalls to note: 
  - Missing that correlated errors don't average out 
  - Treating CJT limit as relevant for small n 
  - Assuming real voters mirror CJT assumptions 

  This forces the "hence democracy" crowd to grapple with mechanics and the legitimacy crowd with formal limitations. The explicit crux—group competence dependencies—keeps both sides honest.
answer: |-
  **Crux:** Group competence depends critically on both the independence of judgments and the distribution of individual competences, meaning majority rule is not universally optimal and asymptotic results can mislead for finite groups.

  ---

  **Final Examination Question: Epistemic Democracy (45 Minutes, 25 Marks)**

  The Local Infrastructure Licensing Committee (LILC) has 19 members who vote "Yes" or "No" on whether to grant a permit for a new energy facility. There is an objective fact of the matter: either the facility meets all safety and environmental standards ("Correct": Yes) or it does not ("Correct": No). The Committee aims to make the correct collective decision. Individual members have varying probabilities (competences *p_i*) of voting correctly, based on their expertise and information sources. Assume all *p_i* > 0.5 unless otherwise stated.

  **Part A (Scenario 1: Correlated Errors)**  
  Five members of the LILC rely *solely* on the same internal expert’s summary memo when evaluating the facility. If the memo contains an error, all five members will vote incorrectly. If the memo is correct, each of the five votes correctly *independently* with *p_i* = 0.7. The probability the memo itself is correct is 0.8. The remaining 14 members vote correctly *independently* of each other and the memo group, each with *p_i* = 0.65.

  1.  Explain why the five memo-reliant members do *not* constitute five independent sources of evidence for the committee’s decision, despite their individual *p_i* = 0.7 when the memo is correct.
  2.  Describe how adding *more* members who rely *only* on this same memo would affect the overall probability of a correct majority vote by the LILC. Justify your answer.

  **Part B (Scenario 2: Unequal Competence & Alternative Rules)**  
  The LILC now consists of 19 members with *independent* judgments but significantly varying competences:  
  - Member A: *p_A* = 0.90  
  - 6 Members: *p_i* = 0.75 each  
  - 6 Members: *p_i* = 0.65 each  
  - 6 Members: *p_i* = 0.60 each

  1.  The Condorcet Jury Theorem (CJT) suggests simple majority rule is highly reliable for large groups of slightly competent independent voters. Explain why CJT *does not* imply that simple majority rule is the most reliable decision rule for *this specific group* of 19 members.
  2.  Compare the *expected reliability* (probability of being correct) of the following three decision rules for this group. *No calculations are required*; reason qualitatively using the concept of weighting evidence by competence:  
      (i) Simple majority rule (1 member = 1 vote).  
      (ii) Weighted voting where each member's vote is weighted proportional to log(*p_i*/(1-*p_i*)).  
      (iii) Deferring the decision solely to Member A.
  3.  Based on this comparison, which rule (i, ii, or iii) would likely be *most reliable*? Briefly explain why.

  **Part C (Synthesis & Implications)**  
  1.  Suppose a different decision body has a mean member competence *just below* 0.5 (e.g., *p_avg* ≈ 0.49), with independent votes. Explain what happens to the probability of a correct majority decision as the group size increases. Contrast this sharply with the CJT asymptotic result for *p_i* > 0.5.
  2.  The CJT, under its assumptions, shows that majority rule is a good way to *aggregate* many independent judgments of competent individuals. Critically discuss, using the scenarios above, what the theorem does *not* tell us about:  
      (a) How to ensure individuals *are* competent (*p_i* > 0.5) in real-world decisions.  
      (b) Whether majority rule is the optimal *aggregation method* when independence is violated or competences vary greatly.  
      (c) How to resolve the potential tension between achieving the most *reliable* outcome (emphasized by CJT) and achieving a *legitimate* outcome (often emphasized in democratic theory).

  ---

  **Model Answer (Approx. 700 words)**

  **Part A:**  
  1.  The five memo-reliant members' votes are not independent sources because their correctness depends entirely on a single source: the memo. If the memo is wrong (prob. 0.2), *all five* are guaranteed wrong. If correct (prob. 0.8), they vote independently *only conditional on the memo being correct*. Their errors are perfectly correlated if the memo is wrong, and partially correlated even if correct due to the common dependence. This violates the CJT's critical independence assumption. They function more like a single "super-voter" whose competence is the probability the memo is correct *and* the majority of the five get it right *given* a correct memo (a complex value around 0.8), rather than five truly independent judges.
  2.  Adding more members relying *only* on this same memo would *not* significantly increase the committee's reliability and could even slightly *decrease* it. Each new member adds no new *independent* information; they simply amplify the single piece of evidence (the memo). The core problem is the shared error risk. Once the "memo-bloc" is large enough to influence the majority (which it already can in a 19-member committee), increasing its size further doesn't reduce the fundamental risk associated with the memo being wrong. It mostly just dilutes the votes of the truly independent members. There's a ceiling on group competence set by the reliability of the shared information source (here, the memo's 0.8 correctness probability).

  **Part B:**  
  1.  CJT assumes homogeneous and *slightly above* 0.5 competence. Here, competences are highly heterogeneous (0.60 to 0.90). CJT's asymptotic guarantee that majority rule beats any single expert applies only for large *n* and doesn't specify what's optimal for small/medium groups, especially when competence varies widely. For smaller groups with a highly competent member, giving that expert disproportionate weight or even sole authority might outperform giving equal weight (one vote) to much less competent members. CJT is silent on optimal weighting for finite *n*.
  2.  (i) *Simple Majority (1 vote each):* Treats the highly reliable vote of Member A (0.90) the same as the votes of the least reliable members (0.60). This fails to leverage Member A's superior accuracy and gives excessive weight to less informative judgments.  
      (ii) *Weighted Voting (Log-odds weights):* This rule is derived from maximizing the likelihood of a correct decision under independence. It weights votes proportional to the strength of the evidence they provide (log(*p_i*/(1-*p_i*)) is the Bayes factor weight). Member A's vote would get very high weight (~log(9)), the p=0.75 votes moderate weight (~log(3)), and the p=0.60/0.65 votes low weight (~log(1.5)/~log(1.86)). This efficiently pools the differing evidential strengths.  
      (iii) *Defer to Member A:* Relies solely on the most competent individual (p=0.90), ignoring all others. This is simple but wastes the evidence from the other 18 members, some of whom (p=0.75) are reasonably competent.  
  3.  Weighted voting (ii) would likely be the most reliable. Deferring to A (iii) wastes valuable information from the competent sub-group (p=0.75). Simple majority (i) gives too much influence to the less competent members (p=0.60/0.65), dragging down the group's potential. Weighted voting optimally combines the evidence, heavily weighting the strongest signal (A) while still incorporating useful information from the moderately competent members and minimizing the impact of the least competent. For this specific group size and competence distribution, it likely outperforms both majority rule (due to heterogeneity) and sole expert rule (due to wasted evidence).

  **Part C:**  
  1.  If mean competence *p* < 0.5 and votes are independent, the probability of a correct majority vote *decreases* towards 0 as the group size increases. This is the *reverse* of the CJT result for *p* > 0.5. Adding more members below 0.5 competence makes it increasingly likely the majority will be wrong. The CJT's asymptotic claim is *highly sensitive* to the assumption *p_i* > 0.5. A mean just below 0.5 makes majority rule *worse than random* for large groups. The limit result (*P_correct* -> 1) is only guaranteed if *p_i* > 0.5, and crucially, *p* < 0.5 guarantees *P_correct* -> 0.
  2.  (a) *Source of Competence:* CJT takes competent individuals (*p_i* > 0.5) as a given. It says nothing about *how* to create or identify such individuals. Real-world voters may lack the expertise, information, or motivation to achieve *p_i* > 0.5 on complex issues. Epistemic democrats need separate arguments (e.g., about collective intelligence, diversity, education) to justify this assumption.  
      (b) *Optimal Aggregation:* CJT shows majority rule works well under *ideal* conditions (independence, homogeneity, *p_i*>0.5). Scenarios A & B show how violating independence (common information) or homogeneity (varying *p_i*) can make majority rule *suboptimal*. Real groups often face these violations, suggesting alternative rules (weighted voting, expert panels, deliberation protocols) might be more reliable epistocratically. CJT doesn't establish majority rule as universally best.  
      (c) *Reliability vs. Legitimacy:* CJT focuses purely on the *epistemic* value (getting the right answer). Legitimacy in democratic theory often rests on procedural fairness, equal voice, participation, or consent. Weighted voting (B-ii) or expert rule (B-iii) may be more reliable than majority rule in some scenarios (like B), but they violate the "one person, one vote" principle central to many conceptions of democratic legitimacy. Conversely, simple majority rule (A-i) might be chosen for legitimacy reasons even if other rules are known to be slightly more reliable (e.g., if unequal weighting is seen as unfair). The CJT result, while powerful under its assumptions, does not resolve this inherent tension between epistemic performance and democratic values.

  ---

  **Marking Scheme (25 Marks Total)**

  1.  **Correlated Errors Undermine Independence & Add Evidence (5 marks):**  
      *   Must-hit: Clearly explains correlation/bloc effect (A1) AND identifies ceiling/diminishing returns from adding dependent members (A2).  
      *   Common Botch: Stating "independence violated" without explaining *how* the memo creates correlation/bloc, or claiming adding members always helps reliability.

  2.  **Heterogeneity Challenges Majority Rule & Requires Weighting (5 marks):**  
      *   Must-hit: Identifies why homogeneous CJT doesn't imply optimality here (B1) AND correctly compares weighting schemes qualitatively (B2) AND justifies why weighted voting likely best (B3) based on evidence strength.  
      *   Common Botch: Assuming majority rule is always best for *p_i* > 0.5, or failing to see why Member A deserves more weight than p=0.6 members.

  3.  **Finite-n vs. Asymptotic Sensitivity (Sub-0.5 Case) (5 marks):**  
      *   Must-hit: Correctly states *P_correct* -> 0 for *p_avg* < 0.5 (C1) AND contrasts sharply with CJT limit for *p_i* > 0.5 (C1).  
      *   Common Botch: Misapplying the CJT limit (*P_correct* ->1) to the *p_avg* < 0.5 case, or not contrasting the limits sharply.

  4.  **CJT's Silence on Competence Origin (5 marks):**  
      *   Must-hit: Explicitly states CJT assumes but does not explain how to achieve *p_i* > 0.5 (C2a).  
      *   Common Botch: Assuming CJT proves voters *are* competent, or not separating the aggregation result from the competence assumption.

  5.  **Distinguishing Aggregation Optimality & Legitimacy Tension (5 marks):**  
      *   Must-hit: Notes CJT doesn't prove majority rule optimal when assumptions violated (C2b) AND identifies the core tension between reliability (CJT's focus) and legitimacy norms like equality/participation (C2c).  
      *   Common Botch: Conflating CJT's aggregation result under ideal conditions with a proof of majority rule's universal superiority, or ignoring the legitimacy challenge to epistocratic alternatives.

  **Distinguishing A from B:**  
  *   **A (22-25):** Hits all 5 moves clearly and accurately. Synthesizes implications powerfully (esp. C2). Explains nuances (e.g., conditional independence in A1, why weighted beats expert in B3, sharpness of limit contrast in C1).  
  *   **B (17-21):** Hits core points of moves 1-5 but may have minor inaccuracies or lack full synthesis. Might slightly misstate the impact in A2, be less precise on weighting rationale in B2/B3, or give a weaker contrast in C1/C2c. Doesn't miss any move entirely.
