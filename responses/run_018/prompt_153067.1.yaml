  I'm trying to figure out where to put my time on a project about rational irrationality — specifically Parfit's hitchhiker-style cases but applied to institutional commitment devices, like when an org pre-commits to a safety protocol that its future self will want to break. I know the standard debate about causal vs evidential reasoning in the hitchhiker, but I'm wondering: what are the actual open questions or lines of work here that'd be worth pursuing for someone with about a year and no formal logic backround? In particular, I'm torn between (1) whether there are tractable formal models of 'sequential hitchhiking' where you commit, observe partial outcomes, then face a second commitment decision; (2) how rational irrationality interacts with group agency — can a collective be a hitchhiker if its members have different preferences over time?; and (3) whether the practical upshot for institutional design is mostly about locking in good decisions or mostly about the psychology of credibility. Which of these should I actually prioritize if I want the work to matter for real-world commitment mechanisms, not just be philosophy for philosophers? Give me a dependancy-aware ordering: what's upstream, what's tractable for a non-logician, and which lines you'd drop because they don't change the practical picture. Also, if I'm wrong that institutional commitment is the right framing here — like if the hitchhiker problem dissolves once you leave the individual agent — just tell me straight, don't humor the premise.
