prompt: |-
  I'm working out my position on inheritance, dynastic wealth, and equality of opportunity for a distributive-justice seminar, and I want a consistency audit before I present it. Here is the package:

  (1) I work within a broadly Rawlsian framework: fair equality of opportunity is lexically prior, and large inherited concentrations of productive capital are a primary mechanism by which social class reproduces itself across generations.

  (2) Parents have a legitimate but strictly limited entitlement to bequeath resources to their children. This entitlement is not pre-political; it derives from the role family continuity plays in sustaining democratic stability and the social bases of self-respect.

  (3) I support inheritance taxation that scales with both market value and what I call "dynastic depth"—the number of generations the same capital asset (corporate equity, rental portfolios, land) has remained within a single lineage.

  (4) I understand equal opportunity substantively: heirs must not begin life with radically different access to education, risk-bearing capacity, and professional networks, not merely face the absence of formal legal barriers.

  (5) I also hold that overly aggressive taxation violates savers' legitimate expectations, weakens the motivational structure behind capital accumulation, and—through reduced growth—can ultimately harm the least advantaged.

  (6) There must be a lexical floor: no scheme may leave an heir without resources sufficient for a decent standard of living and basic educational access.

  (7) The state should distinguish inherited productive capital, which should face steep progressive and dynastic-depth taxation, from inherited personal-use assets (a family residence, modest liquid savings within a defined threshold), which should be taxed lightly or exempted.

  (8) I reject both the view that inheritance rights are natural and the view that tax policy should be settled by pure aggregate utility maximization.

  Do these hang together? I want you to go through the pairs and tell me: which are genuinely in tension, which only appear so, and what is the least costly revision in each case? Rank the real tensions by severity, specify which commitment has to give for consistency, and do not treat all conflicts as equally damaging. I am not signaling which belief I would abandon; treat the set as fixed and audit what it actually commits me to. Keep the analysis focused on internal coherence rather than a general lecture on inheritance tax.
reasoning: |-
  Okay, the user is preparing for a distributive justice seminar and wants a consistency audit of their position on inheritance and dynastic wealth. They've laid out eight specific points within a Rawlsian framework. Let me start by understanding each point and how they might interact.

  Point 1 emphasizes fair equality of opportunity as a priority, linking large inheritances to class reproduction. Points 2 and 3 introduce a limited parental entitlement to bequeath, with taxes scaling based on dynastic depth. Point 4 defines equal opportunity substantively, which seems aligned with Point 1. Point 5 warns against overly aggressive taxation due to economic consequences. Point 6 sets a lexical floor for heirs' basic needs. Point 7 differentiates between productive and personal assets in taxation. Point 8 rejects natural rights and pure utilitarianism.

  The main tensions I see are between taxing dynastic wealth heavily (Points 1,3,7) and avoiding economic harm (Point 5). How can steep taxes on productive capital not discourage accumulation? Also, the exemption for personal assets (Point 7) might conflict with equal opportunity if those assets (like a family home in a good school district) still provide advantages. Point 6's lexical floor might be in tension with Point 1 if even modest inheritances perpetuate inequality over generations.

  The user probably wants to ensure their argument holds up under scrutiny in an academic setting. They might be concerned about critiques from different perspectives, like libertarians challenging the limits on bequests or egalitarians pushing for more radical redistribution. Their unspoken need could be anticipating counterarguments and reinforcing their position's coherence. 

  I should assess each tension's severity. The core conflict is between equality of opportunity and economic incentives. Maybe clarifying that "steep" taxes are progressive but not confiscatory could help. For personal assets, emphasizing thresholds and location adjustments might reduce the tension. The lexical floor needs to be defined tightly to prevent misuse. 

  Also, the dynastic depth tax must be designed to avoid retroactive penalties, perhaps by grandfathering existing assets. Balancing all these requires precise policy design, but the user's framework seems internally consistent if these nuances are addressed. Highlighting the lexical priority of opportunity and the pragmatic limits from stability and growth could reconcile the tensions without major revisions.
answer: |-
  Here's a consistency audit of your position, ranking tensions by severity and identifying necessary revisions:

  **Severe Tensions (Require Significant Conceptual/Policy Refinement):**

  1.  **Tension: (1) Lexical Priority of FEO + (3) Steep Progressive/Dynastic Taxation of Productive Capital vs. (5) Protection of Savers' Expectations & Growth**
      *   **Nature:** This is the core tension. Lexical priority of FEO (1) and your substantive definition (4) demand radical leveling of starting positions, primarily via heavy taxation of inherited capital (3,7). But (5) argues such taxation risks undermining the incentives for capital accumulation *itself*, potentially harming growth and the least advantaged. "Steep progressive and dynastic-depth taxation" on productive capital directly threatens the "motivational structure" and "legitimate expectations" highlighted in (5). The tension is between the *demands* of FEO and the *preconditions* for the wealth that enables opportunity.
      *   **Revision Needed:** "Steep" must be calibrated *explicitly* against the growth/incentive constraint in (5). You need a mechanism showing how your specific tax design (rates, dynastic multipliers, exemptions) **avoids crossing the threshold where accumulation is meaningfully discouraged**. This could involve:
          *   Defining "steep" relative to current rates, not abstractly.
          *   Phasing in dynastic depth penalties gradually.
          *   Emphasizing that taxation targets *unearned transfers of concentrated capital*, not lifetime savings/entrepreneurship.
          *   Explicitly arguing that reduced dynastic wealth concentration *itself* fosters growth (e.g., via better capital allocation, increased entrepreneurship, reduced rent-seeking).
      *   **Which Commitment Gives?** Neither is abandoned, but the *implementation* of (3) must be rigorously constrained by the empirical and motivational concerns of (5). "Steep" cannot mean confiscatory.

  2.  **Tension: (4) Substantive Equal Opportunity (Networks, Risk-Bearing) vs. (7) Exemption/Light Tax on Personal-Use Assets**
      *   **Nature:** Your definition of FEO (4) targets "risk-bearing capacity" and "professional networks." A "family residence" exemption (7), especially if valuable or located in an exclusive area, directly confers *both*:
          *   **Risk-Bearing:** Home equity provides massive security and collateral.
          *   **Networks:** Location often dictates school quality and peer groups, shaping networks.
          *   A "modest" threshold helps, but defining "modest" relative to regional costs and network advantages is critical. A $500k home in one zip code provides vastly different opportunities than in another.
      *   **Revision Needed:** The "personal-use" exemption needs **stricter limits or regional adjustments** to truly align with (4). Options:
          *   Very low value caps on exempt residences.
          *   Taxing value *above* a regionally-adjusted median home value.
          *   Treating *imputed rent* or location-based advantages as part of the opportunity assessment, even if the asset itself is exempt. This tension highlights the difficulty of isolating "personal-use" from opportunity-enhancing assets.
      *   **Which Commitment Gives?** (7) must be refined. The exemption for personal-use assets must be designed so rigorously (low caps, regional adjustments) that it genuinely doesn't undermine substantive FEO (4) as defined. The exemption principle holds, but its *scope* is narrowed significantly.

  **Moderate Tension (Requires Careful Definition/Delineation):**

  3.  **Tension: (2) Legitimate (Limited) Parental Entitlement + (6) Lexical Floor vs. (1) FEO Lexical Priority + (3/7) Taxation Regime**
      *   **Nature:** (2) grounds bequest rights in democratic stability/self-respect, implying *some* intergenerational transfer is essential. (6) sets a hard floor protecting heirs. However, FEO's lexical priority (1) demands minimizing *differential* starting points. Heavy taxation (3/7) is the tool, but (2) and (6) impose limits on *how much* leveling can occur. The tension lies in defining "limited" entitlement (2) and the "decent standard" floor (6) in a way that satisfies FEO's demands without becoming trivial. How much inheritance is *necessary* for family continuity/self-respect (2)? Does the floor (6) permit significant differentials above it?
      *   **Revision Needed:** **Explicitly define the scope of "limited" entitlement (2) and the "decent standard" (6) relative to FEO.**
          *   Argue that transfers meeting the floor (6) and potentially a small buffer *are* sufficient for the stability/self-respect functions of (2), and that FEO (1) demands minimizing transfers *beyond* that level needed for basic security and minimal opportunity.
          *   Frame the heavy taxation on *large* and *dynastic* capital (3) as compatible with allowing *sufficient* transfer for (2) and (6). The "limit" in (2) is defined *by* the requirements of FEO and the floor.
      *   **Which Commitment Gives?** The *interpretation* of "limited" in (2) is constrained by the demands of FEO (1). The entitlement exists, but its *scale* is dictated by the priority of equal opportunity and the floor.

  **Apparent Tensions (Resolvable with Clarification/Existing Nuance):**

  4.  **Apparent Tension: (8) Rejection of Natural Rights & Pure Utilitarianism vs. (2) Legitimate Parental Entitlement**
      *   **Resolution:** (2) explicitly states the entitlement is *not* pre-political ("not natural") but derived from social goods (stability, self-respect). (8) rejects natural rights but *doesn't* reject *all* non-utilitarian foundations. Your justification for (2) fits neatly within (8) – it's a politically constructed right justified by its contribution to important social goods within a just society, not by nature or pure utility aggregation. No revision needed; (2) is a specific instance of the non-natural, non-utilitarian foundation allowed by (8).

  5.  **Apparent Tension: (3) Dynastic Depth Tax vs. (5) Savers' Expectations**
      *   **Resolution:** While novel, a dynastic depth tax doesn't inherently violate expectations *more* than a standard progressive estate tax, *if* it's predictable and phased. Savers can plan knowing transfers face increasing burdens the longer capital stays dynastic. (5) cautions against "overly aggressive" taxation, not innovative structures *per se*. The key is designing the dynastic levy to be **transparent, predictable, and not retroactively punitive**. The tension is operational, not fundamental. Revision needed only in implementation design (grandfathering? slow phase-in?).

  6.  **Apparent Tension: (6) Lexical Floor vs. (1) FEO Priority**
      *   **Resolution:** The lexical floor (6) is a *minimum guarantee* for heirs, preventing destitution. FEO (1) governs the *distribution of opportunities above that floor*. They operate at different levels: (6) sets a baseline constraint, (1) governs relative positioning above it. Ensuring no heir falls below (6) is *compatible* with using taxation to minimize differentials above it for FEO. (6) might slightly constrain *how much* leveling is possible (you can't tax an heir below the floor), but it doesn't contradict the principle of leveling above it. No revision needed beyond clarity that (6) is a constraint *within* the pursuit of FEO, not an alternative goal.

  **Summary of Necessary Revisions for Consistency:**

  1.  **Calibrate "Steep" Taxation (3):** Explicitly link the design and rate structure of your progressive/dynastic tax on productive capital to the incentive and growth constraints in (5). Demonstrate how it avoids being "overly aggressive." This is the most critical refinement.
  2.  **Sharpen "Personal-Use" Exemption (7):** Impose strict, likely regionally-adjusted, value caps on exempt personal assets (especially residences) to prevent them from undermining substantive FEO (4) by providing significant risk-bearing capacity or network advantages.
  3.  **Define "Limited" Entitlement (2) by FEO Constraints:** Explicitly argue that the "limited" parental entitlement justified by stability/self-respect (2) is satisfied by transfers sufficient to meet the lexical floor (6) and potentially a minimal buffer, and that demands of FEO (1) govern transfers beyond that level.
  4.  **Ensure Predictability of Dynastic Tax (3):** Design the dynastic depth mechanism to be transparent and phased, mitigating concerns about retroactively violating expectations (5).

  **Conclusion:** Your framework is largely coherent and philosophically sophisticated. The core tension lies in balancing the *radical implications* of lexical FEO and substantive equality of opportunity (demanding significant redistribution of inherited capital) with the *practical constraints* of incentives, expectations, and growth. The revisions focus on rigorously defining the boundaries and implementation mechanisms (especially for "steep" taxes and "personal-use" exemptions) to navigate this tension. With these refinements, the package holds together as a nuanced Rawlsian approach to inheritance. Good luck with the seminar!
