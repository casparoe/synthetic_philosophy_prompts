  As a retired physicist who only started reading philosphy after leaving the lab, I've been chewing on Black's spheres argument about the identity of indiscernibles. Can you tell me the most important implications of that two-sphere universe for how we should think about identity in quantum mechanics—specifically for entangled pairs of genuinely identical particles that are spatially seperated? I don't want a balanced overview; take a clear position on which of those implications survive and which ones collapse once you bring in quantum statistics, and give me your reasons rather than a menu of options. (Sorry if my framing is sloppy—I think I meant spatial separation, not temporal separation, but correct me if that mix-up actually breaks the argument.)
