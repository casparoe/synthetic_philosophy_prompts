  I recall Max Black imagined two identical spheres in an otherwise empty universe to challenge Leibniz. But quantum mechanics makes this scenario physically impossible for particles like electrons. Their wavefunctions must be symmetric or antisymmetric under exchange, which means you fundamentally can't assign distinct identities even with spatial separation. 

