  First, I need to consider the user's context: they're designing a graduate seminar in medieval philosophy and religion. This means the document must be rigorous enough for academic scrutiny while remaining accessible for classroom use. The user clearly wants to avoid superficial resolutions of the sacrificial persistence problem, so the desiderata must force engagement with the core tension.

  The three structural layers outlined (anthropological-genetic, legal-permanence, metaphysical-symbolic) are crucial. For each, I'll identify non-negotiable requirements based on Maimonides' explicit statements across his works. The anthropological layer must preserve both the historical contingency of sacrifice's introduction and its non-provisional status - that's the tightrope every reconstruction must walk.

  On legal permanence, the key is showing how the Mishneh Torah's treatment isn't just lip service. Any reconstruction that implies Maimonides secretly wanted sacrifices abolished fails here. The metaphysical layer is trickiest - it must address symbolic aspects without anachronistically imposing modern animal ethics. Maimonides' Aristotelian hierarchy is non-negotiable; particular providence simply doesn't extend to animals.

  The consistency requirements are non-negotiable anchors: divine law's immutability, prayer as temporary substitute, and the distinction between accessible reasons versus currently unknown reasons. These often get blurred in secondary literature. The taʿlīm/esoteric distinction might be where interpretive camps diverge most - some see hierarchy, others complementarity.

  Noticing potential fault lines: the concession/permanence clash seems fundamentally unstable. If sacrifice was medicine for idolatry, how can it remain binding after the disease is cured? Also, robust symbolism risks smuggling in concerns Maimonides explicitly rejects. The legal-formalist camp might handle permanence well but stumble on symbolism, while symbolic readings often weaken permanence.

  The dominant concession-pedagogical approach (e.g., Kellner) probably violates permanence most severely. Its insistence on sacrifice's obsolescence contradicts Maimonides' legal codification. Meanwhile, esoteric-symbolic readings (Fox, Stern) risk overplaying metaphysical meanings at the expense of legal realism.

  Ultimately, the desiderata will expose that no single reconstruction satisfies all constraints perfectly. That's pedagogically valuable - the document should frame the tension as philosophically generative rather than resolvable.
answer: |-
  ## Formal Desiderata Document: Evaluating Reconstructions of Maimonides' Position on Animal Sacrifice

  **Document Purpose:** To establish the necessary criteria for any adequate philosophical reconstruction of Moses Maimonides' position on animal sacrifice, specifically addressing the "Sacrificial Persistence Problem": the tension between his anthropological-genetic explanation for the *origin* of sacrifice and his treatment of sacrificial law as *permanently binding* in his legal codex. This document specifies the phenomena, texts, distinctions, and broader philosophical commitments that a successful reconstruction must accommodate and remain consistent with.

  **The Core Problem:** The reconstruction must resolve, or rigorously articulate without dissolving, the tension arising from Maimonides simultaneously holding:
  1.  **Anthropological-Genetic Claim (Guide III.32):** Sacrifice was commanded primarily as a concession to the Israelites' ingrained idolatrous habits, serving a pedagogical function (taʿlīm) to wean them from idolatry by redirecting similar practices towards God.
  2.  **Legal-Permanence Claim (Mishneh Torah, esp. Hilkhot Ma'aseh ha-Qorbanot, Hilkhot Melakhim 11:1):** The sacrificial laws are eternally binding divine commandments (mitzvot), integral to the Torah, potentially restorable with the Temple, and distinct from prayer which is only a temporary substitute under exile conditions.

  **Structural Demands (Non-Negotiable):** Any reconstruction must explicitly address these three interdependent layers:

  1.  **Anthropological-Genetic Layer:**
      *   **Requirement G1:** Account for the *historical contingency* and *pedagogical purpose* (redirecting idolatrous impulse) of the *initial institution* of sacrifice as presented in *Guide* III.32. (Non-Negotiable)
      *   **Requirement G2:** Explain why this genetic explanation does *not* render the sacrificial commandments *merely provisional* or *obsolete* once the original pedagogical need (overcoming Egyptian idolatry) is met. (Non-Negotiable)
      *   **Requirement G3:** Maintain consistency with Maimonides' view that divine law, while accommodating historical circumstances in its *particulars*, does not change in its *essential* nature or binding force (*Guide* II.39, III.34; *MT Yesodei ha-Torah* 9:1). (Non-Negotiable)
      *   **Motivation:** To prevent dismissing the *Guide*'s explanation as implying abolition, while respecting the immutability of divine law.

  2.  **Legal-Permanence Layer:**
      *   **Requirement L1:** Explain the *permanent binding force* (ḥiyyuv) of sacrificial laws within Maimonides' legal system (*Mishneh Torah*), including their detailed codification and classification among the commandments. (Non-Negotiable)
      *   **Requirement L2:** Account for the potential *future actualization* of sacrifices (e.g., *MT Melakhim* 11:1) and the distinction between sacrifice and prayer (*Guide* III.32, *MT Tefillah* 1:1-5), where prayer is a substitute *only* under conditions of exile/lack of Temple, not a superior replacement in principle. (Non-Negotiable)
      *   **Requirement L3:** Justify classifying the *specific rationales* (taʿamei ha-mitzvot) for sacrificial details among the "opaque commandments" (ḥuqqim) whose reasons are not immediately obvious (*Guide* III.26, III.32, III.46), *without* implying this opacity signifies meaninglessness, arbitrariness, or purely historical justification irrelevant to the present/future. (Non-Negotiable)
      *   **Motivation:** To prevent treating the legal texts as insincere formalism or mere rhetorical cover for an abolished practice, respecting Maimonides' role as halakhic codifier.

  3.  **Metaphysical-Symbolic Layer:**
      *   **Requirement M1:** Determine the status of the *specific conditions* for sacrificial animals (domestic status, physical perfection [tamim], specific species) – whether they carry inherent *symbolic weight* (e.g., representing the subordination of human appetites/animal nature to intellect/divine will) or are primarily *conventional legal markers* (gezerat ha-katuv). (Interpretive Camp Preference: Esoteric-Symbolic vs. Legal-Formalist camps diverge here)
      *   **Requirement M2:** Reconcile any proposed symbolic meaning with Maimonides' Aristotelian hierarchy, wherein *particular providence* extends only to rational beings (*Guide* III.17-18). (Non-Negotiable)
      *   **Requirement M3:** Ensure the reconstruction does *not* attribute to Maimonides a primary concern for *animal suffering* or *individual animal welfare* that contradicts his explicit denial of particular providence over non-rational animals and his view of animals as resources for human use (*Guide* III.17; *MT Avodat Kokhavim* 1:1). (Non-Negotiable)
      *   **Motivation:** To explore potential deeper meaning without anachronistically imposing modern ethical concerns or violating Maimonides' explicit metaphysical commitments.

  **Essential Distinction to Preserve (Non-Negotiable):**
  *   **Requirement D1:** Preserve and articulate the relationship between the **Exoteric Pedagogical Function (taʿlīm)** and the **Esoteric Ontological/Legal Status**. The reconstruction must show how these relate (e.g., as surface function vs. deep structure; as complementary aspects; as genuinely unresolved) *without collapsing them into a single, identical explanation*. The genetic explanation (taʿlīm) cannot be the exhaustive esoteric truth if the law is permanent.

  **Broader Consistency Requirements (Non-Negotiable):**
  *   **Requirement C1:** Compatibility with Maimonides' view that the essential content and binding nature of the divine law *do not change* (*Guide* II.39, III.34; *MT Yesodei ha-Torah* 9:1).
  *   **Requirement C2:** Compatibility with his claim that prayer substitutes for sacrifice *only* in the absence of the Temple (*Guide* III.32, *MT Tefillah* 1:1-5).
  *   **Requirement C3:** Compatibility with his insistence that the reasons for commandments are *in principle accessible* to perfected human reason, even if currently unknown or classified as "opaque" (ḥuqqim) (*Guide* III.26, III.31, III.49). A reconstruction cannot render the reasons *in principle* unknowable or purely arbitrary.
  *   **Requirement C4:** Compatibility with his denial that non-rational animals are subjects of *particular divine concern* or providence (*Guide* III.17-18).

  **Required Determinate Judgments:** The reconstruction must yield clear positions on:
  *   Whether sacrifice retains *intrinsic* value/meaning beyond its historical pedagogical origin.
  *   Whether the *specific details* (species, perfection) carry symbolic meaning related to human psychology/metaphysics or are purely conventional.
  *   The precise *nature of the tension* between the genetic explanation and legal permanence (e.g., paradox, dialectic, progressive understanding, complementary perspectives).

  **Suspected Points of Tension/Joint Unsatisfiability:**
  1.  **Exhaustive Concession Thesis vs. Permanence Thesis:** If the *sole* reason for sacrifice was curing a specific, now-cured psychological defect (idolatrous habit), it is exceptionally difficult to explain its permanent binding force and potential restoration without rendering the legal position disingenuous or Maimonides inconsistent. *(Likely Jointly Unsatisfiable)*
  2.  **Robust Symbolic Reading vs. Aristotelian Hierarchy:** A strong symbolic reading that imbues the *animal itself* (its suffering, perfection, species) with intrinsic metaphysical significance risks contradicting Requirement M3 (denial of particular providence for animals) and Requirement C4. Symbolism must focus on the *human act/state* or the *divine command structure*, not the animal's inherent status or experience. *(Potentially Satisfiable only with Careful Constraint)*

  **Damaging Requirement to Dominant Readings:** **Requirement G2** (Genetic explanation ≠ Provisional/Obsolescence) does the most damage to the currently dominant **Concessive-Pedagogical** camp, which often struggles to avoid implying obsolescence. **Requirement M3** (No anachronistic animal ethics) severely constrains **Esoteric-Symbolic** readings.

  **Brief Evaluation of Interpretive Camps Against Desiderata:**

  | Camp                  | Strengths Re: Desiderata                                  | Weaknesses Re: Desiderata                                        |
  | :-------------------- | :-------------------------------------------------------- | :--------------------------------------------------------------- |
  | **Concessive-Pedagogical** | Strong on G1 (Genetic Origin), D1 (Distinction)          | Weak on G2 (Avoiding Obsolescence), L1/L2 (Permanence), risks violating C1 (Immutable Law) & C3 (Reasons Accessible). Often struggles with M1/M2. |
  | **Esoteric-Symbolic**     | Strong on M1 (Symbolism), G2 (Avoiding Obsolescence), potentially strong on C3 (Reasons Accessible) | Risks violating M3/C4 (Anachronistic Animal Ethics), can downplay L3 (Opaque Nature), sometimes weak on L1/L2 (Legal Force/Permanence as primary). |
  | **Legal-Formalist**       | Strong on L1/L2/L3 (Permanence, Legal Status, Opacity), C1/C2 (Immutable Law, Prayer as Substitute) | Weak on G1/G2 (Integrating Genetic Explanation meaningfully), often neglects M1 (Symbolism), risks making reasons purely arbitrary (violating C3). |

  **Conclusion:** This specification establishes the non-negotiable textual and philosophical constraints any reconstruction of Maimonides' position on sacrifice must satisfy. The core tension (Sacrificial Persistence Problem) is genuine and central. While differing interpretive camps prioritize different desiderata, a minimally adequate reconstruction must successfully integrate the Anthropological-Genetic, Legal-Permanence, and Metaphysical-Symbolic layers without violating the defined non-negotiable requirements (G1, G2, G3, L1, L2, L3, M2, M3, D1, C1, C2, C3, C4). The points of tension identified (Exhaustive Concession vs. Permanence; Robust Symbolism vs. Hierarchy) highlight areas where reconstructions face their greatest challenges and where interpretive choices are most consequential. No reconstruction satisfying *all* desiderata equally strongly may be possible, but adequacy requires a compelling account that respects the constraints and articulates the nature of the residual tension.
