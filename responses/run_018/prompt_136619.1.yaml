  I'm working on an assignment for my course on collective memory and national identity, focusing on what scholars call 'lost cause' narratives — for instance, the American Confederacy, Masada, Kosovo Polje, or the Dunkirk evacuation — in which a military defeat is reinterpreted as a moral or strategic victory. Rather than a historical comparison, I need an example of a conceptual issue that arises structurally within these myths: specifically, the tension between commemorating the defeated party's agency (framing Masada's collective suicide or Dunkirk's retreat as autonomous, dignified choices rather than mere failures) and applying retrospective strategic judgment (the view that the defeat was avoidable and caused by flawed aims or tactical errors). The example should illustrate that this tension is not resolved by separating 'noble' from 'ignoble' lost causes, but instead points to an ambiguity about whether the normative power of the myth comes from the narrative framing of human choice or from the objective historical outcome. Could you construct such an example and explain the conceptual knot?
