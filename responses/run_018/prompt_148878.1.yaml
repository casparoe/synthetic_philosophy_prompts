  - Eliminativism brutally dissolves puzzles by denying statues exist—only particles arranged statue-wise. It dodges all issues but at the cost of rejecting ordinary reality, which seems untenable for conservation debates. 

  User likely wants this for academic work, but their focus on "weirder" cases hints at frustration with oversimplified models. They might be probing whether any theory handles real-world messiness. I should stress that no option perfectly resolves the conservation/co-location conflict—that's the knot. 

