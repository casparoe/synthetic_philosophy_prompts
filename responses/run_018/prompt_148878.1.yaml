answer: |-
  ### Bottom Line:  
  **No theory fully satisfies all desiderata. Constitution view handles co-location naturally but flounders on replacement and conservation; four-dimensionalism resolves persistence puzzles but overcommits on boundaries; eliminativism avoids contradictions but denies obvious truths. The tension between Conservation of Matter and Co-location Avoidance is unresolvable.**

  ---

  ### Desiderata for Material Constitution:  
  1. **Persistence Through Change**  
     *Case: Slow Replacement*  
     The original terracotta statue has its molecules replaced by synthetic binder over decades. The museum claims it’s the *same statue*; a chemist calls it a new composite. An account must explain whether the statue persists and under what conditions.  
     *Required:* Criteria for transtemporal identity despite material flux.

  2. **Co-location Avoidance**  
     *Case: Statue and Clay*  
     A statue and the lump of clay occupy the same space at the same time. Are they two objects or one? An account must explain how distinct properties (e.g., "created by Michelangelo" vs. "existed as raw clay") apply without multiplying entities absurdly.  
     *Required:* Avoid systematic co-location of distinct objects.

  3. **Boundary Sensitivity**  
     *Case: The Armature*  
     A bronze statue has a hollow steel frame. Some conservators treat it as part of the artwork; others see it as scaffolding. An account must clarify what determines "parthood" in an object’s constitution.  
     *Required:* Explain how functional/cultural factors fix compositional boundaries.

  4. **Conservation of Matter**  
     *Case: Squashing*  
     If you flatten the clay lump, the statue is destroyed, but the clay persists. An account must explain how matter can survive annihilation of the object it constitutes.  
     *Required:* Ground the intuition that matter isn’t created/destroyed by rearrangement.

  5. **Property Exclusion**  
     *Case: Overlap*  
     Statue Goliath and clay Lump share all matter at *t*. Yet Goliath is *artistically valuable* while Lump is not. An account must allow distinct properties without contradiction.  
     *Required:* Respect Leibniz’s Law (if *x* and *y* have different properties, they are distinct).

  6. **Explanatory Simplicity**  
     *Case: All scenarios*  
     Avoid ad-hoc solutions or ontological proliferation (e.g., positing infinite coincident objects).  

  ---

  ### The Unsatisfiable Pair:  
  - **Conservation of Matter** demands that the original clay persists through gradual replacement.  
  - **Co-location Avoidance** rejects two objects (original clay + composite) occupying the same space post-replacement.  
  **Conflict:** If matter persists, it constitutes a distinct object (violating Co-location Avoidance). If not, Conservation of Matter is denied.

  ---

  ### Theory Evaluation:  
  1. **Constitution View (e.g., Baker)**  
     - *Persistence/Replacement:* The statue persists if it retains its "primary kind" (e.g., *artwork*), even with new matter. **Score: ✓**  
     - *Co-location:* Statue and clay are non-identical but co-located at *t*. **Score: ✓** (but violates Co-location Avoidance).  
     - *Boundaries:* Armature is part of the statue if functionally essential. **Score: △** (vague).  
     - *Conservation:* Original clay is destroyed when synthetic binder dominates. **Score: ✗** (violates matter conservation).  
     - *Property Exclusion:* Different "constitution relations" explain distinct properties. **Score: ✓**  

  2. **Four-Dimensionalism (Perdurantism)**  
     - *Persistence/Replacement:* The statue is a spacetime worm; replacement is a temporal part with new matter. **Score: ✓**  
     - *Co-location:* Statue and clay are distinct 4D wholes overlapping at temporal parts. **Score: △** (technically avoids co-location but multiplies entities).  
     - *Boundaries:* Armature is part of the statue’s temporal segment. **Score: ✓** (but over-includes scaffolding).  
     - *Conservation:* Original clay’s temporal parts persist but are "earlier." **Score: ✓**  
     - *Property Exclusion:* Properties are temporal-part-relative. **Score: ✓**  

  3. **Ordinary-Object Eliminativism (e.g., Merricks)**  
     - *Persistence/Replacement:* Only particles exist. "Statue" is a convenient label for particle arrangements. **Score: ✗** (denies persistence of *the statue*).  
     - *Co-location:* Only particles are co-located. **Score: ✓** (trivially avoids co-location).  
     - *Boundaries:* No statues → no parthood disputes. **Score: ✗** (dismisses conservation practice).  
     - *Conservation:* Particles persist. **Score: ✓**  
     - *Property Exclusion:* Only particles have properties; "artistic value" is subjective. **Score: ✗** (ignores institutional facts).  

  ---

  ### Why No Theory Wins:  
  The **Constitution View** sacrifices Conservation of Matter for Co-location Avoidance and Persistence. **Four-Dimensionalism** saves Conservation and Persistence but inflates ontology, making boundary disputes arbitrary. **Eliminativism** dodges all puzzles by rejecting ordinary objects but fails to explain museum practices or artistic identity. The irreconcilable core is **matter’s persistence vs. object unity**—if matter endures through replacement, it either constitutes a new object (violating Co-location Avoidance) or the original object ceases to exist (violating Persistence). Each theory picks its poison.
