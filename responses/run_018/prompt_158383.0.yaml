  hey — i've been mulling over whether 'better than' is actually transitive, and i keep hitting loops. like, job A pays better than B, B has better work-life balance than C, but then C feels more meaningful than A, so which one's best? and then there's the spectrum argument — change one small feature at a time and suddenly you're comparing totally different kinds of goods. but i also noticed it gets messier when you ask 'better for who' — me, my family, the town — and those three orderings dont line up either, whilst comparing goods across different dimensions.

  i've got no academic background, just thinking about it on my own, but i'm genuinely wondering: if people were going to put years of work into sorting out the open questions here — about transitivity failures, spectrum arguments, and comparing goods across different people or dimensions — which ones actually matter most? what's upstream of the others, what's tractable without being a mathematician, and what's overrated? defend the ordering: tell me what deserves serious effort and what you'd leave alone, and how you'd split limited resources.

  please be upfront about how confident you are in the ranking, and point out the specific claim you're least sure about. also, please dont send me a bibliography or reading list — i wouldnt be able to check those properly.
