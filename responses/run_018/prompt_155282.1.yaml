answer: |-
  **Bottom Line:** Dewey's experimentalism grounds democratic legitimacy not in static expressions of popular will or consent, but in institutions designed to rigorously test policies as fallible hypotheses subject to ongoing, collective revision based on their consequences.

  Dewey viewed democracy as collective social inquiry, akin to the scientific method. Truth and effective solutions emerge from experimentation, observation of outcomes, and revision. Thus, legitimacy arises from structures embedding this learning process: institutions must treat policies not as final mandates reflecting an unchanging "will," but as provisional data generating consequences that the public, through inclusive deliberation, analyzes and uses to revise future action. Consent becomes dynamic, embedded in the *process* of learning and adapting, not a one-time authorization.

  This avoids technocracy because Dewey insisted *experimental inquiry is intrinsically democratic*. Genuine experimentation requires incorporating diverse experiences and perspectives to identify problems, formulate hypotheses, interpret results, and redefine goals. Technocratic management, conversely, applies predetermined expert solutions (routine problem-solving). Dewey's key distinction is between this routine application of known fixes and *experimental inquiry*, which tackles novel, uncertain situations demanding collective intelligence. Legitimate institutions must foster the latter: enabling public participation in defining problems, scrutinizing outcomes, and iterating solutions—turning governance itself into a learning laboratory where "the people" are active experimenters, not passive consent-givers or subjects ruled by experts.
