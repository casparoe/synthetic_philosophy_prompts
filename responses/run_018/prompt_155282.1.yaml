prompt: |-
  Please argue that Dewey’s experimentalism about democracy and inquiry implies democratic legitimacy should be judged mainly by whether institutions are structured to treat policy outcomes as fallible, collectively revisable data—rather than by whether they express popular will or secure explicit consent. Address the objection that this collapses democracy into technocratic management, and explain how Dewey’s distinction between routine problem-solving and genuinely experimental inquiry applies to institutional design. Lead with your bottom line in one sentence, then present the argument in no more than 250 words; do not include bibliographies, citations, or references to specific editions.
reasoning: |-
  Okay, the user wants me to argue how Dewey's experimentalism implies democratic legitimacy comes from institutional structures treating policies as fallible and revisable, rather than popular will or consent. They also want me to address the technocracy objection and explain Dewey's distinction between routine vs. experimental inquiry in institutions.

  First, I need to distill Dewey's core idea: democracy as a learning system. His experimentalism views knowledge as provisional and refined through collective testing. So legitimacy stems from creating structures that treat policies as hypotheses to be tested and revised, not as final expressions of will. 

  The technocracy objection is crucial. Critics might say this reduces democracy to expert management. But Dewey insists experimental inquiry must be participatory—integrating diverse experiences through inclusive deliberation. Technocracy lacks this feedback loop. 

  Then there's Dewey's distinction between routine problem-solving (applying existing solutions) vs. genuine experimentation (testing new methods amid uncertainty). Institutions must foster the latter through open information, participatory review, and iterative adjustments. 

