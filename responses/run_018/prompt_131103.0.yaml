prompt: |-
  As a novelist who constructs characters from the inside out, I am asking for a conceptual instrument rather than a scene: a precisely calibrated thought experiment examining whether virtue can survive institutional corruption. Design a one-paragraph, realistic workplace scenario—set in a contemporary clinical research unit or an architectural practice, with no trolleys, demons, or perfect predictors—in which a professional who genuinely possesses Aristotelian practical wisdom (phronesis) integrated with institutional loyalty produces a more destructive outcome than a colleague who lacks both traits, precisely because the organizational framing activates situationist mechanisms—specifically moral licensing and ethical fading—while the colleague's detached cynicism insulates her from those mechanisms. The scenario must generate, not stipulate, its verdict through the interaction of trait and context. After presenting the case, provide the following: first, what virtue ethics says about evaluating the agent's character versus the action's consequences; second, what the situationist critique—drawing on the fragmentation thesis rather than merely denying that traits exist—says about whether phronesis is genuinely present or exercised here; third, identify the precise structural feature that does the work—whether it is the trait-context interaction, the framing mechanism alone, or a failure of narrative identity across roles—and explain what collapses if that feature is removed; fourth, show how a virtue ethicist would defend the protagonist by distinguishing between possessing a virtue and exercising it under non-ideal conditions, perhaps appealing to the distinction between trait-activation and trait-expression or to narrative coherence as an integrating factor; and fifth, state honestly whether the case genuinely tests virtue ethics or merely assumes situationism in its design. Avoid bibliographies, citations, or requests for specific texts; the reasoning should stand on conceptual grounds alone, and you should inject at least one genuinely niche but defensible conceptual distinction—such as the role of role-identity fusion in suppressing moral perception—to show the case does not simply beg the question.
