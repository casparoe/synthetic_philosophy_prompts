answer: |-
  Here's a battle-tested Q&A prep sheet ordered by threat level, with authentic objections, targeted replies, vulnerability flags, and strategic concessions. I've prioritized objections based on seminar composition and your friend's warning.

  **Core Stance to Reiterate:** *"Idealized deliberation under fragmented practical identity doesn't seek coherence but identifies value-fragments that withstand diachronic reflection, weighting them by stability. Normativity emerges from this process, not from forcing unity."*

  ---

  ### **Tier 1: Existential Threats (Must Defend Aggressively)**
  1. **The Kantian Constructivist: "Unity of Agency" Objection**  
     *Their Phrasing:* "Your model evacuates agency of its constitutive feature: unity. If values are irreconcilable fragments across time-slices, what binds the agent into a *single entity* capable of *authoring* actions? Without a unified practical standpoint, you collapse into a bundle of sub-agents, making deliberation incoherent and responsibility impossible."  
     **Your 2-Minute Reply:**  
     "Agency isn't predicated on *achieved* unity but on the *capacity for reflective engagement* with one's fragments. The 'binding' force is the ongoing *process* of weighting stable value-fragments under diachronic reflection. Responsibility attaches to how one weights and acts on these fragments, not to a fictive unified self. Think of Odysseus tying himself to the mast: his agency persists *through* fragmentation by designing processes to honor stable values."  
     **Soft Spot:**  
     Your reply redefines agency as procedural rather than substantive. Kantians will argue this dissolves autonomy into mere reactivity. *Flag:* Emphasize that *deliberation* (not just action) requires recognizing multiple normative sources within one biological entity. Cite Korsgaard on agency as self-constitution but stress it can be *polycentric*.

  2. **The Meta-Ethicist: "Indirect Normativity as Vacuous" Objection**  
     *Their Phrasing:* "Calling this 'indirect normativity' is sophistry. If weighting fragments doesn't resolve conflicts—just stabilizes them—what *normative work* is left? You've replaced 'ought' with 'is stable,' collapsing normativity into psychology. This isn't normativity; it’s anthropology with delusions of grandeur."  
     **Your 2-Minute Reply:**  
     "Normativity arises *from* the authority of stability-under-reflection. A value-fragment that persists through reflection isn't just a psychological fact—it’s a *reason-generating commitment*. The 'ought' is in the requirement to *engage* with these stable fragments proportionally to their stability. This avoids the false promise of coherence, which often *imposes* values to resolve conflicts artificially."  
     **Soft Spot:**  
     Risk of naturalistic fallacy. Stress that stability is a *procedural filter*, not the source of value. Distinguish "stable under reflection" from "merely persistent."

  ---

  ### **Tier 2: High-Damage Practical Objections**
  3. **The Decision Theorist: "Action-Guidance Failure" Objection**  
     *Their Phrasing:* "If fragments stay incompatible, how does this *guide action*? Without coherence, you can’t maximize utility or even satisfice. Your 'weighted fragments' output no choice function—just a pile of reasons pointing in opposite directions. Deliberation becomes paralyzed."  
     **Your 2-Minute Reply:**  
     "Action-guidance comes from *satisficing* stable fragments, not maximizing coherence. We choose acts that satisfy the *most weighty* stable fragments *sufficiently*, even if others conflict. Example: A fragmented parent might stably value career ambition (30%) and presence (70%). They take a job with less pay but flexible hours—*not* a 'coherent' compromise, but an act satisfying the dominant fragment."  
     **Soft Spot:**  
     Weighting mechanics are underspecified. *Flag:* Admit this requires contextual judgment but argue coherence models often hide weighting in utility functions.

  4. **The Kantian: "Regress of Reflection" Objection**  
     *Their Phrasing:* "You say we weight fragments by 'stability under diachronic reflection.' But if the self is fragmented, *who* is reflecting? Each time-slice has different values. Doesn’t this lead to an infinite regress of reflections on reflections, with no anchor?"  
     **Your 2-Minute Reply:**  
     "Reflection occurs *within* time-slices, evaluating past/future fragments from the present standpoint. Stability is measured by whether a fragment *recurs* as motivationally salient across reflections. The 'anchor' is the *biological continuity* of the agent, not their normative unity. Like Hume’s theater: no 'self' backstage, but the stage persists."  
     **Soft Spot:**  
     Biological continuity is normatively inert. *Mitigate:* Argue that the practice of reflection itself creates a thin normative thread.

  ---

  ### **Tier 3: Manageable but Tricky**
  5. **The Decision Theorist: "Modeling Impossibility" Objection**  
     *Their Phrasing:* "How do you formalize this? Utility functions require completeness. Your 'stable fragments' sound like unmixable vNM axioms. You can't even define a preference ordering!"  
     **Your 2-Minute Reply:**  
     "We *can* model it: treat each fragment as a separate utility function, then use Borda counts or approval voting over actions. Stability scores act as weights. Yes, it violates transitivity sometimes—but so do humans. Coherence models are *descriptively inaccurate* for fragmented agents."  
     **Soft Spot:**  
     Lacks predictive precision. *Concede:* "This is a normative model, not a descriptive one. It tells us how we *ought* to deliberate, not how we *do*."

  ---

  ### **The Nightmare Question (Hope Nobody Asks)**
  **The Meta-Ethicist/Kantian Hybrid: "Why Not Nihilism?"**  
  *Their Phrasing:* "If your fragments are truly incompatible and stability is just a psychological property, why isn’t this a road to nihilism? You’ve made normativity *arbitrary*—why not drop all fragments and embrace indifference?"  
  **Why It’s Deadly:** Questions the whole project’s normative authority. Forces you to defend objectivity.  
  **Your 2-Minute Reply (Gambit):**  
  "Because indifference *isn’t* stable under reflection for most agents. The persistent pull of value-fragments *is* the anti-nihilistic datum. Nihilism is just another fragment to weight—and it rarely wins, because even fragmented agents *care*. Stability under reflection *is* the minimal criterion for reasons to exist."  
  **Soft Spot:**  
  Risk of circularity: "caring" presupposes normativity. *Fallback:* "This is why we need *indirect* normativity: to explain how reasons emerge from non-arbitrary features of our practical condition."

  ---

  ### **Concession Strategy**
  **Concede Up Front:**  
  - *"This sacrifices elegant action-guidance for phenomenological accuracy."*  
  - *"It doesn’t resolve moral dilemmas; it dignifies them as permanent features of some identities."*  

  **Hold at All Costs:**  
  1. Fragmentation ≠ incoherence. Stability under reflection provides normative traction.  
  2. Unity is not necessary for agency—*processes* can sustain agency.  
  3. Indirect normativity isn’t a "cop-out"; it’s the only viable path for fragmented agents.  

  **Unity of Agency Triage:**  
  If pressed, reframe: *"Unity isn’t the starting point—it’s a rare achievement. Most agency occurs in the interstices of fragmentation. Demanding unity *a priori* excludes real moral experiences."* Quote Frankfurt: "Caring is fragmentary by nature."

  ---
  **Final Tip:** Start with a case study (e.g., addict who values sobriety but also resents it as repression). Ground abstract claims in lived fragmentation. Good luck!
