prompt: |-
  I'm putting together questions for a podcast chat with a thinker who defends the idea that analogy-making is the root of all cognition, like Hofstadter and Sander lay out in Surfaces and Essences. I don't want the usual "define analogy for us" opener. Instead I'm stuck on whether a small model that just matches surface patterns is really analogizing or only faking it, and on this weird hunch I have that the leftover parts of an analogy that don't map cleanly — the junk that gets left behind — actually do more conceptual work than the matching parts. Could you draft 6 to 8 interview questions? I need one on whether analogy requires some kind of inner awareness to be real, one on those leftover mismatched bits, and one on pushing analogies into totally different domains like cooking and politics. For each question, include a follow-up keyed to the answer he's most likely to give. Please split the response into three seperate sections: 1) Quick framing of the view (~100 words), 2) The questions with pushback follow-ups (~350 words), 3) What's settled versus what's still genuinely fought over among people who study this (~100 words). Don't present contested stuff as if there's a clear expert consensus.
