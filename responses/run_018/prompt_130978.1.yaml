prompt: |-
  You serve as methodological adviser to a regional public-works board that reviews high-stakes infrastructure proposals and must combine conflicting stakeholder reports about risk and welfare. The board wants to operationalize Harsanyi's aggregation theorem—under which social preferences over lotteries satisfy the von Neumann-Morgenstern axioms and a weak Pareto condition if and only if social welfare equals a state-independent weighted sum of individual cardinal utilities—into a reusable decision procedure that non-economist members can execute in a single two-hour session without software.

  Construct the procedure as an ordered sequence of tests with explicit stopping rules: (1) the verification questions that establish whether each stakeholder report can be treated as a vNM preference ordering; (2) the check for the independence axiom and what to do when it fails for one group; (3) the determination of welfare weights, marked clearly as a value judgment that the procedure cannot resolve; (4) the computation or approximation step, with instructions for what to do when cardinal utilities are only ordinally ranked; and (5) the final aggregation rule and the conditions that force deferral to a human vote. Specify the hard cases the procedure must handle, including stakeholder proxies who represent future generations through discount-rate models and groups whose ambiguity aversion about climate scenarios violates independence. Apply the procedure to two proposals: reinforcing a coastal levee where agricultural representatives reject standard lotteries over flood probabilities, and extending a transit corridor where present users and a future-generations proxy disagree on both outcomes and weights. Include one application where the procedure recommends approval that conflicts with the board's intuitive moral judgment, and explain why. Conclude by stating precisely what the procedure cannot determine—especially the normative source of the weights and the status of goods that fall outside utility—so the board knows where judgment is unavoidable.
reasoning: |-
  We are constructing a decision procedure based on Harsanyi's aggregation theorem for a public-works board. The procedure must be executable in a single two-hour session without software by non-economists.

  Harsanyi's theorem states that if individual preferences and social preferences satisfy the von Neumann-Morgenstern (vNM) axioms (completeness, transitivity, continuity, and independence) and the social preferences satisfy a weak Pareto condition (if everyone prefers A to B, then society prefers A to B), then social welfare is a weighted sum of individual utilities.

  The procedure will have the following steps:

  1. **Verification of vNM preferences for each stakeholder report**: We need to check that each stakeholder's report is consistent with vNM preferences (i.e., that it can be represented by a vNM utility function). This involves checking for the vNM axioms.

  2. **Check for the independence axiom and handling failures**: We must check the independence axiom for each group. If it fails for a group, we cannot treat their preferences as vNM and must adjust or note the issue.

  3. **Determination of welfare weights**: This step requires a value judgment (the weights are not determined by the theorem). The board must decide on the weights.

  4. **Computation or approximation of utilities**: When cardinal utilities are provided, we can compute the weighted sum. If only ordinal rankings are available, we must approximate.

  5. **Final aggregation rule and conditions for deferral**: We aggregate the utilities and decide based on the weighted sum. In some cases (e.g., when the independence axiom fails or when weights are not agreed), we may have to defer to a vote.

  Hard cases to handle:
  - Stakeholder proxies for future generations (using discount rates) may have vNM preferences, but we must check.
  - Groups with ambiguity aversion (violating independence) cannot be represented by vNM utilities.

  Applications:
  1. **Coastal levee reinforcement**: Agricultural representatives reject standard lotteries (violating independence?).
  2. **Transit corridor extension**: Present users and a future-generations proxy disagree on outcomes and weights.

  We also need an example where the procedure recommends approval that conflicts with the board's moral judgment.

  Finally, we state what the procedure cannot determine.

  **Procedure:**

  **Step 1: Verify vNM Preferences for Each Stakeholder Report**

  For each stakeholder group, we must check that their preferences over lotteries satisfy the vNM axioms. We do this by asking the following verification questions (to be answered by the stakeholder representative or from their written report):

  - **Completeness and Transitivity**: For any two lotteries A and B, does the stakeholder have a clear preference (A > B, B > A, or indifferent)? And are these preferences transitive?
    - *Stopping rule*: If a stakeholder cannot compare two lotteries (incompleteness) or if we find a cycle (A > B, B > C, but C > A), then we mark this stakeholder as non-vNM.

  - **Continuity**: For any three lotteries A, B, C where A > B > C, does there exist a probability p such that the stakeholder is indifferent between B and the lottery that yields A with probability p and C with probability 1-p?
    - *Stopping rule*: If the stakeholder representative cannot answer or if the answer is inconsistent (e.g., for some p, they change their mind when asked in multiple ways), then we mark as non-vNM.

  - **Independence**: For any lotteries A, B, and C, and any probability p in (0,1), does the stakeholder have: 
    A > B if and only if [pA + (1-p)C] > [pB + (1-p)C]?
    - *Stopping rule*: If we find a counterexample (e.g., A > B but for some p and C, [pA + (1-p)C] <= [pB + (1-p)C]), then mark as non-vNM.

  *Handling non-vNM stakeholders*: If a stakeholder fails any of these, we note that we cannot use their utility function in the weighted sum. We then proceed to Step 2 to see if we can adjust or if we must defer.

  **Step 2: Check for Independence and Handle Failures**

  We focus on the independence axiom because it is the most commonly violated and critical. We have already checked in Step 1. If a stakeholder fails the independence check (or any other vNM axiom), we cannot represent their preferences by a vNM utility function. 

  *What to do when independence fails for one group?*
  - If the group is small or their preferences are not critical, the board may decide to exclude them from the aggregation and note it in the record. However, this is a value judgment and should be avoided if the group is significant.
  - Alternatively, we might try to approximate their preferences by a vNM function (if possible) by asking for their certainty equivalents for some lotteries and fitting a utility function. But this is time-consuming and may not be feasible in two hours.
  - If the group is large or critical and we cannot represent them by vNM, then we must defer to a board vote (go to Step 5, deferral).

  *Special case: Ambiguity aversion* (e.g., about climate scenarios): This violates independence. We cannot use vNM for such groups. We must note that and consider deferral.

  **Step 3: Determination of Welfare Weights**

  - This step is a value judgment. The board must assign non-negative weights to each stakeholder group that passed Step 1 (and possibly adjusted in Step 2). 
  - The weights should reflect the relative importance the board assigns to each group (e.g., present vs. future generations, different sectors of society). 
  - *How to do it*: The board can discuss and vote on the weights. They might use criteria such as population size, vulnerability, or ethical principles. 
  - *Mark clearly*: The weights are not determined by the procedure. They are a normative input from the board.

  **Step 4: Computation or Approximation of Social Welfare**

  - If we have vNM utilities for each group and weights, then the social welfare of a lottery L is: 
    W(L) = ∑ [w_i * u_i(L)] 
    for each group i, where w_i is the weight and u_i(L) is the expected utility of lottery L for group i.

  - *When cardinal utilities are only ordinally ranked*: We cannot compute the weighted sum exactly. We must use an approximation:
    - If the board can agree on a common scale (e.g., 0 for the worst outcome and 1 for the best) and each group's utility is normalized accordingly, then we can use the normalized utilities. But note: vNM utilities are unique up to affine transformations, so normalization is allowed.
    - Alternatively, we can use a method such as range normalization: for each group i, set the worst outcome to 0 and the best to 1, then rescale their utilities accordingly. Then compute the weighted sum.

  - *Handling partial information*: If we only have ordinal rankings (but no cardinal values) for some groups, we might use a multi-criteria decision method (like Borda count) but this is not strictly Harsanyi. Instead, we can try to elicit cardinal utilities by asking for certainty equivalents (if time permits). If not, we must defer.

  **Step 5: Final Aggregation and Deferral**

  - For each proposal, compute the social welfare for the proposed project and for the status quo (or alternative projects). The project with the highest social welfare is recommended.

  - *Conditions for deferral to a human vote*:
    - If any critical stakeholder group (as determined by the board) fails the vNM test (Step 1) and we cannot adjust (Step 2).
    - If we cannot assign weights (Step 3) for a significant group.
    - If we cannot compute the social welfare (Step 4) due to lack of cardinal information.
    - If the social welfare difference between two options is very small (the board should set a threshold, e.g., less than 5% difference) and not statistically significant (if uncertainty is present), then defer.

  **Hard Cases:**

  1. **Stakeholder proxies for future generations**: These are often modeled with discount rates. We must check if their preferences satisfy vNM. Discounting is linear in probabilities and thus typically satisfies independence? Not necessarily: if the proxy uses a non-expected utility model (like hyperbolic discounting) then it might violate vNM. We must apply Step 1 to the proxy's report.

  2. **Ambiguity aversion**: As noted, violates independence. We cannot use vNM. We must defer to vote if such a group is critical.

  **Application 1: Reinforcing a Coastal Levee**

  - *Scenario*: Agricultural representatives reject standard lotteries over flood probabilities (they are ambiguity averse). They might say: "We don't know the exact probabilities of floods, so we cannot compare lotteries."

  - *Step 1*: They fail independence (and maybe continuity) because they are ambiguity averse. We mark them as non-vNM.

  - *Step 2*: Since they are a critical group, we cannot exclude them. We must defer to a board vote (Step 5).

  **Application 2: Extending a Transit Corridor**

  - *Scenario*: Present users and a future-generations proxy disagree on outcomes and weights.

  - *Step 1*: We check both groups for vNM. Present users: likely vNM. Future generations proxy: if they use a discounted utility model (with expected utility), they are vNM. Otherwise, not.

  - *Step 3*: The board must assign weights. They might assign a lower weight to future generations due to discounting, or equal weight? This is a value judgment. Suppose the board decides weights: 0.6 for present and 0.4 for future.

  - *Step 4*: We compute the expected utilities for the project and the status quo for both groups. The future generations proxy might have a high utility for the project (because it reduces future congestion and pollution) but present users might have a loss during construction. We compute the weighted sum.

  - *Step 5*: If the project has a higher weighted sum, we approve. Otherwise, reject.

  **Application 3: A Case that Conflicts with Moral Judgment**

  - *Scenario*: A proposal to build a dam that will displace a small indigenous community but provide electricity to a large urban population. The indigenous community has a high weight because of vulnerability (as assigned by the board). However, the urban population has a much larger population and thus, even with a lower per capita weight, the total weighted utility for the dam is positive.

  - *Computation*: Suppose:
    - Indigenous group: 100 people, weight=0.5, utility of dam = -50 (displacement), utility per person: -0.5 -> total: -50 * 0.5 = -25
    - Urban group: 1,000,000 people, weight=0.1, utility per person: 0.01 (small benefit) -> total: 1e6 * 0.01 * 0.1 = 1000
    - Social welfare: -25 + 1000 = 975 > 0, so approve.

  - *Conflict*: The board might feel that displacing the indigenous community is morally wrong and should not be overridden by the urban benefits. But the procedure recommends approval.

  - *Why?* The weights and the utility functions are value judgments. The board might reconsider the weights (assign higher weight to the indigenous group) or the utility function (the disutility of displacement might be underestimated). But if they stick to the initial weights and utilities, the procedure leads to approval.

  **What the Procedure Cannot Determine:**

  1. **The normative source of the weights**: The weights are a value judgment and must come from the board's ethical principles (e.g., egalitarian, utilitarian, prioritarian). The procedure does not set them.

  2. **The status of goods outside utility**: Non-utility considerations (like rights, justice, environmental integrity) are not captured by the utility functions. If stakeholders do not incorporate these into their utility, then they are not included. The board must decide if such considerations are important enough to override the procedure.

  3. **Handling non-vNM preferences**: The procedure cannot aggregate preferences that violate vNM axioms without approximation or deferral.

  4. **Interpersonal comparisons of utility**: The procedure assumes that utilities are comparable across individuals (via the weights). But the board must decide how to make these comparisons.

  5. **Discount rates for future generations**: The procedure does not specify how to discount future utilities. The board must decide on the discount rate (which is embedded in the future generations proxy's utility function and in the weights).

  **Conclusion:**

  The procedure provides a structured way to apply Harsanyi's theorem, but it requires the board to make value judgments, especially on weights and on how to handle non-vNM preferences. In cases of ambiguity aversion or when critical groups cannot be represented by vNM, the procedure will often defer to a vote. The board must be aware that the procedure is based on expected utility and may not capture all ethical considerations.
answer: |-
  ### **Decision Procedure for Harsanyi Aggregation**  
  This procedure operationalizes Harsanyi’s theorem for public-works proposals. It assumes stakeholders submit reports ranking outcomes and lotteries. The board must complete all steps in ≤2 hours without software. If deferral occurs, the board votes by majority rule.

  ---

  ### **Step 1: Verify vNM Preferences for Each Stakeholder**  
  **Objective**: Confirm each stakeholder’s report satisfies vNM axioms (completeness, transitivity, continuity, independence).  
  **Tests**: Ask these questions for each stakeholder group:  
  1. **Completeness/Transitivity**:  
     - *Question*: "For outcomes A, B, and C, if you prefer A > B and B > C, do you always prefer A > C? If not, provide counterexamples."  
     - *Stopping Rule*: If inconsistency is found (e.g., A > B > C > A), exclude the group from aggregation and note: "Stakeholder X violates transitivity."  
  2. **Continuity**:  
     - *Question*: "For outcomes A > B > C, is there a probability *p* where you are indifferent between B and a lottery giving A with probability *p* and C with probability *1-p*?"  
     - *Stopping Rule*: If no such *p* exists (e.g., B is always worse than any risky lottery), mark: "Stakeholder X violates continuity."  
  3. **Independence**:  
     - *Question*: "If you prefer A > B, do you also prefer a lottery with A (probability *p*) and C (1-*p*) over a lottery with B (probability *p*) and C (1-*p*) for any *p* > 0 and any C?"  
     - *Stopping Rule*: If "no" (e.g., "I prefer A alone but the mixed lottery with C changes my preference"), mark: "Stakeholder X violates independence."  

  **Hard Cases**:  
  - **Ambiguity-Averse Groups** (e.g., climate uncertainty): Automatically fail independence.  
  - **Future Generations Proxy** (e.g., discounting model): Test for vNM consistency. If proxy uses exponential discounting (e.g., utility = Σβ<sup>t</sup>u(c<sub>t</sub>)), it typically satisfies vNM; if hyperbolic discounting, it fails.  

  **Output**: List of "vNM-consistent" stakeholders. If >50% of groups (by board-defined criticality) fail, defer to vote (Step 5).

  ---

  ### **Step 2: Handle Independence Axiom Failures**  
  **Objective**: Address groups failing independence (e.g., ambiguity-averse stakeholders).  
  **Procedure**:  
  1. **Isolate Non-vNM Groups**: Separate stakeholders who failed Step 1.  
  2. **Adjustment Attempt**:  
     - *Question*: "Can you accept a simplified lottery using worst-case, best-case, and most-likely scenarios instead of precise probabilities?"  
     - *If Yes*: Recalculate utilities as certainty equivalents (e.g., "What guaranteed outcome is equivalent to this risky outcome?"). Retest with simplified lotteries in Step 1.  
     - *If No*: Categorize as "non-vNM."  
  **Stopping Rule**:  
  - If all non-vNM groups are adjusted successfully, include them.  
  - If any critical group (≥30% of affected population, per board judgment) cannot be adjusted, defer to vote (Step 5).  

  **Example (Coastal Levee)**:  
  - Agricultural stakeholders reject flood-probability lotteries (ambiguity aversion).  
  - Adjustment: Use scenarios (e.g., "100-year flood," "no flood") and ask certainty equivalents. If they assign utilities to scenarios, proceed; else, defer.

  ---

  ### **Step 3: Determine Welfare Weights**  
  **Objective**: Assign weights to stakeholders. **This is a value judgment—the procedure cannot resolve it.**  
  **Procedure**:  
  1. **Board Discussion** (20 minutes max):  
     - Weights reflect ethical priorities (e.g., vulnerable groups weighted higher).  
     - Default: Equal weights if no consensus.  
  2. **Explicit Mark**: Announce: "Weight assignment requires normative judgment. Economists cannot determine weights—this is the board’s ethical choice."  
  **Output**: Weights *w<sub>i</sub>* ≥ 0 for each vNM-consistent stakeholder, summing to 1.  

  **Hard Cases**:  
  - **Future Generations Proxy**: Weights may be discounted (e.g., *w<sub>future</sub>* = 1/(1+r)<sup>T</sup>). Board must agree on discount rate *r*.  

  ---

  ### **Step 4: Compute Social Welfare**  
  **Objective**: Calculate weighted sum of utilities: *W* = Σ*w<sub>i</sub>u<sub>i</sub>*.  
  **Instructions for Ordinal Utilities**:  
  - If utilities are ordinally ranked (e.g., "A > B > C" without cardinal values):  
    1. **Normalize Scales**: Assign *u<sub>i</sub>(worst outcome)* = 0 and *u<sub>i</sub>(best outcome)* = 1 for each stakeholder.  
    2. **Approximate Midpoints**: For other outcomes, ask: "Is outcome X closer to worst (0), best (1), or halfway (0.5)?" Use 0, 0.5, or 1.  
    3. **Linear Approximation**: If no finer granularity, assume linear utility in ranks.  
  - **Stopping Rule**: If stakeholders cannot rank outcomes (e.g., "A and B are incomparable"), defer to vote.  

  **Computation**:  
  - For each proposal, compute expected utilities for vNM groups.  
  - *W* = Σ*w<sub>i</sub>u<sub>i</sub>*.  
  - **Approval Threshold**: Approve if *W<sub>proposal</sub>* > *W<sub>status quo</sub>* by ≥10% (predefined significance margin).  

  ---

  ### **Step 5: Aggregation Rule and Deferral Conditions**  
  **Final Rule**:  
  - If *W<sub>proposal</sub>* > *W<sub>status quo</sub>* + 10% margin, **approve**.  
  - If *W<sub>proposal</sub>* < *W<sub>status quo</sub>* - 10% margin, **reject**.  
  - Else, **defer to board vote** (simple majority).  

  **Deferral Conditions** (force vote if any apply):  
  1. >50% of critical stakeholders are non-vNM (Step 1).  
  2. Independence axiom failure in critical groups with no adjustment (Step 2).  
  3. No agreement on weights (Step 3).  
  4. Cardinal utilities unattainable for >1 group (Step 4).  
  5. |*W<sub>proposal</sub>* – *W<sub>status quo</sub>*| ≤ 10%.  

  ---

  ### **Applications**  
  **Proposal 1: Coastal Levee Reinforcement**  
  - **Stakeholders**:  
    - Residents (vNM-consistent): Utilities based on flood risk reduction.  
    - Agricultural reps (non-vNM): Reject flood-probability lotteries (ambiguity aversion).  
  - **Procedure**:  
    1. Step 1: Agricultural group fails independence.  
    2. Step 2: Adjustment attempted—certainty equivalents for scenarios. They refuse.  
    3. Step 3: Weights assigned: Residents (70%), Agricultural (30%).  
    4. Step 4: Cannot compute *u<sub>ag</sub>* cardinally → **Defer to vote** (Step 5).  

  **Proposal 2: Transit Corridor Extension**  
  - **Stakeholders**:  
    - Present users (vNM): Utilities based on travel time savings.  
    - Future generations proxy (vNM): Discounted utility (r=2% per year).  
  - **Conflict**: Present users weight near-term congestion; future proxy weights long-term sustainability.  
  - **Procedure**:  
    1. Step 1: Both vNM-consistent.  
    2. Step 3: Board assigns weights: Present users (60%), Future proxy (40%).  
    3. Step 4: *W<sub>extension</sub>* = 0.6×0.3 + 0.4×0.8 = 0.5; *W<sub>no-extension</sub>* = 0.6×0.5 + 0.4×0.1 = 0.34.  
    4. Step 5: *W<sub>extension</sub>* > *W<sub>no-extension</sub>* by 47% → **Approve**.  

  **Conflict Case: Dam Construction**  
  - **Scenario**: Build a dam displacing 1,000 tribal residents (utility = -50) but providing electricity to 1M urban users (utility = +0.1/person).  
  - **Weights**: Board assigns high weight to tribal group (*w<sub>tribal</sub>* = 0.4) due to vulnerability.  
  - **Computation**:  
    - *W<sub>dam</sub>* = 0.4×(-50) + 0.6×(1,000,000×0.1) = -20 + 60,000 = 59,980.  
    - *W<sub>no-dam</sub>* = 0.  
  - **Procedure Recommends**: Approval (59,980 > 0).  
  - **Moral Conflict**: Board feels displacement is unjust despite net utility gain.  
  - **Why?** Harsanyi’s theorem assumes utilities capture all welfare. The tribal group’s loss (e.g., cultural destruction) may be undervalued in their utility report, and weights are fixed by board.  

  ---

  ### **What the Procedure Cannot Determine**  
  1. **Normative Weights**: The source of weights (e.g., egalitarian vs. utilitarian ethics) is a board judgment.  
  2. **Non-Utility Goods**: Environmental or cultural values not reflected in stakeholder utilities are ignored.  
  3. **Ambiguity Aversion**: The procedure excludes non-vNM groups or defers; it cannot "solve" ambiguity.  
  4. **Interpersonal Comparisons**: Utilities are assumed comparable; the procedure does not justify this.  
  5. **Discount Rates**: Choosing *r* for future generations is ethical, not technical.  

  **Final Note**: This procedure ensures consistency with Harsanyi’s axioms but cannot replace ethical deliberation. Use it to structure debate, not eliminate it.
