answer: |-
  Here's your conceptual prompt draft, designed to spark thinking about consciousness distribution criteria – casual, with a few deliberate quirks, focused on the desiderata:

  ---

  **Prompt: Consciousness Distribution Criteria – What Gotta Give?**

  "Yo, building a theory about how consciousness gets doled out across critters? Don't just handwave it. Lay out the **FULL checklist** an adequate account **must** hit. What's the bare minimum it's gotta explain? Be ruthless. Include:

  1.  **The Weird Squad (Cases it MUST Handle):**
      *   **Cephalopods (Octo/Squid):** Smart AF, complex behaviors, totally alien neurology (decentralized, no central cortex). Can't just be a mammal-brained theory.
      *   **Insects (Bees/Flies):** Tiny brains, complex learned behaviors, potential evidence for subjective states (pain debates). Does size *really* matter that much?
      *   **Fish:** Vertebrates, clear nociception, complex social/spatial behaviors. Are they just wet robots or more?
      *   **(Edge Cases - Handle or Explain Away):** Plants (bioelectrical signaling, "behavior"?), simple worms (C. elegans), and yeah, maybe even future AGI/LLMs – does the theory implode if silicon gets sparky? Reasoning: Ignoring these is ignoring the scope of the problem.

  2.  **The Splits it Can't Smudge (Critical Distinctions):**
      *   **Minimal Awareness (e.g., basic sensory qualia) vs. High-Level Sentience (rich inner world, self-reflectiveness, narrative).** Why? Ethics hinges on this (is a fly *suffering* or just reacting?), and conflating them makes the theory uselessly vague.
      *   **Nociception (detecting damage) vs. Suffering (aversive *experience*).** Why? HUGE ethical implications. A theory that collapses these either denies obvious pain (bad) or attributes suffering way too broadly (also bad).
      *   **Reflex/Computation vs. Subjective Experience.** Why? This is the Hard Problem core. A theory needs to say *what* it's actually explaining beyond complex input-output.
      *   Reasoning: Blurring these is failing to explain the actual phenomena we care about.

  3.  **Biological Bedrock (Constraints it Can't Break):**
      *   **Evolutionary Continuity:** Consciousness didn't poof into existence fully formed. There must be a plausible gradualist story (proto-consciousness, increasing complexity). Non-negotiable for most scientists.
      *   **Absence of Sharp Neural Cutoff:** No single magic neuron or structure that cleanly separates "conscious" from "non-conscious" across all species. Evidence is messy (e.g., bird pallium vs. mammal cortex function). **Strongly preferred, arguably non-negotiable** based on comparative neuro.
      *   **Functional/Behavioral Plausibility:** The proposed neural correlates/mechanisms must *plausibly* support the observed behaviors linked to consciousness (learning, flexibility, etc.).
      *   Reasoning: Contradicting evolution or known neuro is a non-starter for a biological theory. Functionality is key.

  4.  **Camp Preferences vs. Non-Negotiables:**
      *   **Non-Negotiables (Probably):** Handling cephalopods/birds/fish/insects seriously, making the key distinctions (awareness/sentience, nociception/suffering), respecting evolutionary continuity, avoiding sharp neural cutoffs.
      *   **Preferences/Battlegrounds:** How "rich" minimal awareness is, whether plants/AI *can* be conscious under the theory (vs *are*), the specific neural mechanisms favored, how strongly behavior is weighted.

  5.  **The Impossible Duos? (Flag Conflicts):**
      *   **Big Tension:** **Evolutionary Continuity + A Strict Binary Threshold ("Conscious/Not").** Continuity screams gradual emergence; a sharp binary threshold (e.g., "recurrent processing present/absent") seems to demand a sudden jump. Can these be reconciled? How?
      *   **Potential Conflict:** **Absence of Sharp Neural Cutoff + Highly Specific Neural Mechanism.** If the theory *requires* a very specific mammalian-like structure (e.g., layered cortex), it struggles HARD with cephalopods/birds, implying a cutoff where biology shows functional equivalence.

  6.  **The Theory-Killer Requirement:**
      *   Which single demand wrecks the most popular theories? **Probably the ABSENCE OF A SHARP NEURAL CUTOFF.**
      *   **Mammal-Only (or Cortex-Only) Views:** Instantly torpedoed. Birds and cephalopods demonstrate complex cognition without mammalian cortex. Fail.
      *   **Panpsychism:** *Avoids* the neural cutoff problem (consciousness is fundamental everywhere!), but gets wrecked elsewhere – especially by the **Nociception vs. Suffering** distinction and the **Minimal Awareness vs. High-Level Sentience** split. If consciousness is fundamental to particles, why is suffering linked to complex nervous systems? What explains the *gradient*? It struggles massively with differentiation and combination ("combination problem").

  **(Bonus Mini-Score: Panpsychism dodges the neural cutoff bullet but bleeds out on distinctions. Mammal-only views ace distinctions (within their scope) but get shredded by the neural cutoff constraint and fail the cephalopod/fish/insect cases.)**

  **Focus:** The *weight* is on defining the criteria themselves – the cases, distinctions, constraints, tensions. The scoring is just illustrative flavor.

  ---

  **Why this works for your dataset:**

  1.  **Explicitly Lists Desiderata:** Cases, distinctions, constraints, conflicts are clearly separated.
  2.  **Provides Reasoning:** Explains *why* each criterion matters (ethics, evolution, Hard Problem scope).
  3.  **Highlights Tensions:** Flags the Continuity vs. Binary conflict explicitly.
  4.  **Distinguishes Non-Negotiables:** Separates core demands from debatable preferences.
  5.  **Identifies a Key Challenge:** Pinpoints the "Absence of Sharp Neural Cutoff" as a major hurdle for popular theories.
  6.  **Casual Tone & Minor Flaws:** Uses conversational language ("Smart AF", "poof into existence", "torpedoed") and has a few deliberate informalities ("gotta", "weird squad").
  7.  **Secondary Scoring:** Briefly shows how criteria apply to panpsychism/mammal-only without making it the focus.
  8.  **Scope:** Encompasses animals, plants, AI as edge cases per your request.
