  The real pain point appears to be the feeling of circularity. When they say "spinning wheels," I suspect they've encountered debates where people cite contradictory evidence (e.g., religious charity vs. secular Scandinavian trust metrics) without engaging the underlying premises. Their layered questions reveal sophisticated thinking: they're simultaneously considering individual psychology ("resistance to corruption"), sociological mechanisms ("horizontal vs vertical trust"), and meta-ethical foundations ("binding norms").

  Hmm, the key insight might be that this isn't one debate but three nested ones, each requiring different resolution methods. For definitional issues, we'd need conceptual clarification; for empirical claims, targeted research; for foundational disagreements, perhaps only identifying irreconcilable premises. The prison demographics example is perfect - it's often weaponized without specifying whether it measures morality (defined as which outcome?) or controls for socioeconomic variables.

  I should note their implicit request for intellectual honesty: they want to know if continued debate is futile. The answer requires separating resolvable disputes from true philosophical divides. Interesting how they frame "bedrock intuition" - that's essentially where Hume's is/ought problem lives, and where modern moral realism debates camp out. 

