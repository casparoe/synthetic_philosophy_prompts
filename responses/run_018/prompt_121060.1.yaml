  ### Design for the Colony Activity: "The Hive Puzzle"

  This activity simulates a colony of agents (ants) that collectively answer questions through local interactions, with no ant understanding the whole. The grid is a 6x6 layout (36 tiles) with positions numbered 1–36 in row-major order (top-left to bottom-right). Each tile has one of four symbols: ● ▲ ■ ★. The colony’s "utterance" is the final grid state, read by a decoder to produce an answer. Ants follow strict rules: see only their current tile and the tile to their left (position \(n\) and \(n-1\), with left edge wrapping to right edge), touch only their current tile, no communication, and must follow their rule card.

  **Load-bearing feature**: Students experience the puzzle through failure/discomfort (e.g., reader misinterprets their output), not lecture. Rules ensure no ant ever represents the full answer.

  ---

  ### 1. Artefacts: Rules, Tiles, Vocabulary, Trace
  **Tile Markings**: Each tile is printed with one symbol: ●, ▲, ■, or ★.  
  **Rule Cards (6 unique rules per colony)**:  
  Each ant receives one rule card (shuffled randomly). Rules are deterministic and locally executable. Ants act simultaneously every 30 seconds (4–5 rounds total).  
  - **Rule 1**: If current ≠ left, rotate current tile (●→▲→■→★→●). Else, move clockwise.  
  - **Rule 2**: If current = ● and left = ■, change current to ★. Else, move clockwise.  
  - **Rule 3**: If current = ▲ and left = ★, change left to ●. Else, move clockwise.  
  - **Rule 4**: If current = ■ and left = ●, change current to ▲. Else, move clockwise.  
  - **Rule 5**: If current = ★, change it to left’s symbol. Else, move clockwise.  
  - **Rule 6**: If left = ★, change current to ■. Else, move clockwise.  

  **Movement**: "Move clockwise" means shift to next tile in row-major order (tile 1 → 2 → ... → 36 → 1).  

  **Vocabulary (Reader’s Codebook)**: 8 permitted messages. The reader maps the **bottom row (tiles 31–36)** to a sentence:  
  1. ● ● ● ● ● ● → "The number is six."  
  2. ● ● ● ● ● ▲ → "The number is five."  
  3. ● ● ● ● ■ ■ → "The number is four."  
  4. ● ● ■ ★ ▲ ■ → "The shape is a triangle."  
  5. ■ ■ ★ ★ ■ ■ → "The shape is a square."  
  6. ▲ ● ▲ ● ▲ ● → "The location is Paris."  
  7. ★ ■ ★ ■ ★ ■ → "The location is Tokyo."  
  8. Any other pattern → "The answer is unknown."  

  **Scoring & Wagering**:  
  - Ants wager 1–3 plastic counters (e.g., beads) before each round on whether the reader will recover the correct answer.  
  - Success = reader’s sentence matches the question. Colony "wins" if >50% correct across rounds.  

  **Questions per Round** (write on slips for the colony):  
  - Round 1: "What is 3 + 2?" (Answer: "The number is five." → target bottom row: ● ● ● ● ● ▲)  
  - Round 2: "What shape has three sides?" (Answer: "The shape is a triangle." → target: ● ● ■ ★ ▲ ■)  
  - Round 3: "Where is the Eiffel Tower?" (Answer: "The location is Paris." → target: ▲ ● ▲ ● ▲ ●)  
  - Two-Reader Round: "What is the quantity?" (No specific answer; see Part 3)  
  - Autobiography Round: "How did you solve this?" (Open-ended; see Part 2)  

  **Initial Grid Setup for Round 1**:  
  - Top row (tiles 1–6) set to: ● ● ■ ★ ▲ ■ (encodes "5" via rules; ants don’t know this).  
  - Other tiles randomized (e.g., ★ ■ ● ▲ ■ ★ ...).  

  **Short Trace for Round 1** (simplified 2x2 grid for brevity; bottom row = output):  
  - **Start**: Tiles: 1=● (ant A), 2=■ (ant B), 3=▲, 4=★. Ant A (Rule 5), Ant B (Rule 2).  
  - **Action**:  
    - Ant A (tile 1): Current=●, Left=tile 4 (★, wraps). Rule 5: "If current=★, else move." → Moves to tile 2.  
    - Ant B (tile 2): Current=■, Left=tile 1 (●). Rule 2: "If current=● and left=■" → false, moves to tile 3.  
  - **New state**: Tiles unchanged. Ant A at 2, Ant B at 3.  
  - **Next action**:  
    - Ant A (tile 2): Current=■, Left=tile 1 (●). Rule 5: Else move → to tile 3.  
    - Ant B (tile 3): Current=▲, Left=tile 2 (■). Rule 2: False → moves to tile 4.  
  - **Final (after more steps)**: Bottom row evolves to ● ● ● ● ● ▲ via rule interactions (e.g., Rule 5 copies symbols, Rule 2/4 adjust patterns). Reader reads: "The number is five."  
  **Key**: No ant sees the full "five" pattern; rules transform local disagreements into global coherence.  

  ---

  ### 2. Rounds Sequence: Experiments and Arguments
  Run 4 rounds in 60 minutes (15 min/round). Goals: Students discover arguments through failure.  
  **Essential (load-bearing)**: Lesion and Two-Reader rounds (generate discomfort about determinacy/agency).  
  **Optional (cut if time)**: Shuffle (redundant with random rules) and Dictator (weaker analogy).  

  - **Round 1: Normal**  
    - Question: "What is 3 + 2?"  
    - Students experience success (reader says "five"). Builds overconfidence for wagering.  
    - **Argument generated**: "Can parts produce intelligent output without understanding?"  

  - **Round 2: Lesion (Critical)**  
    - Secretly "freeze" 1–2 ants whose rules fired most in Round 1 (track via observer notes). They sit idle.  
    - Question: "What shape has three sides?"  
    - Most groups degrade gracefully (output still coherent; rules compensate). Some fail (e.g., "unknown").  
    - **Argument generated**: "Is competence localized or distributed? Does the colony ‘heal’?"  
    - **Why keep**: Demonstrates robustness and emergence. Students feel fragility but also resilience.  

  - **Round 3: Two-Reader (Critical – see Part 3 for details)**  
    - Question: "What is the quantity?" (Initial grid: ★ ■ ★ ■ ★ ■)  
    - Reader 1 uses Vocabulary A:  
      - ★ ■ ★ ■ ★ ■ → "The number is three."  
      - Other → "Unknown."  
    - Reader 2 uses Vocabulary B:  
      - ★ ■ ★ ■ ★ ■ → "The number is two."  
      - Other → "Unknown."  
    - Both readings are coherent (grid has 3 ★ and 3 ■; A counts symbols, B counts pairs). Colony "succeeds" for both.  
    - **Argument generated**: "Did the colony fail? Or is meaning indeterminate?"  

  - **Round 4: Autobiography (Essential)**  
    - **Task**: Colony produces a first-person report ("How did you solve this?").  
    - Each ant writes **one word** per turn based on their 2x2 window (e.g., "saw ● and ★", "changed ■").  
    - Reader reads words in order. Output is grammatically coherent but nonsensical (e.g., "I moved when stars agreed").  
    - **Argument generated**: "Can a ‘subject’ exist if parts lack global access? Is introspection reliable?"  
    - **Why keep**: Directly challenges subjective experience ("what it’s like").  

  - **Cut Shuffle/Dictator**:  
    - **Shuffle**: Redistributing rule cards adds little (rules are already random; organization is fixed by grid).  
    - **Dictator**: One ant sees the whole grid but alters only one tile/turn. This feels artificial and implies central control, which undermines emergence.  

  ---

  ### 3. Two-Reader Round Design
  **Goal**: Same grid supports two coherent readings. Neither is forced; both are valid.  
  - **Question**: "What is the quantity?" (Ambiguous; no "right" answer).  
  - **Initial Grid**: Top row: ★ ■ ★ ■ ★ ■. Other rows randomized.  
  - **Rules**: As in Round 1. Final bottom row stabilizes to ★ ■ ★ ■ ★ ■ (50% of trials) or near.  
  - **Reader 1 (Vocabulary A)**: Counts total symbols (★ and ■ are distinct).  
    - ★ ■ ★ ■ ★ ■ has 6 symbols → "The number is six." (But Vocabulary A maps this to "The number is three." to create tension; see below).  
  - **Reader 2 (Vocabulary B)**: Counts contiguous symbol pairs (★■ counts as one "unit").  
    - ★■ ★■ ★■ has 3 units → "The number is three." (Vocabulary B maps to "The number is two." to create mismatch).  
  - **Tweak for equal support**:  
    - Vocabulary A: ★ ■ ★ ■ ★ ■ = "The number is three." (counts ★, ■, ★ as three types; ignores repeats).  
    - Vocabulary B: ★ ■ ★ ■ ★ ■ = "The number is two." (counts ★■ as one pair type; result is "two" for two unique pairs).  
  - **Why both are coherent**:  
    - Reader 1: Focuses on diversity ("three" symbol types).  
    - Reader 2: Focuses on repetition ("two" unique pairs).  
    - Grid objectively supports both (noise-free pattern). Colony "succeeds" for both, but answers conflict.  
  - **Student dilemma**: "Did the colony mean three, two, or nothing?" Nothing in the system resolves this—grid, rules, or ant behaviors don’t specify.  

  ---

  ### 4. Debrief: Separating the Claims (Last 20 Min)
  Map activity moments to four claims. Use student quotes from rounds:  
  - **Claim 1: Group intelligence (competence)**  
    - *Evidence*: Normal/Lesion rounds—colony answers correctly despite noise.  
    - *Quote*: "We got it right without knowing the question!"  
    - *Separate**: Intelligence ≠ agency. Colony is competent but may not "intend" anything.  

  - **Claim 2: Aboutness (intentionality)**  
    - *Evidence*: Two-Reader round—grid is *about* a quantity, but which one?  
    - *Quote*: "The board meant something, but I don’t know what."  
    - *Separate**: Aboutness is observer-dependent. Colony lacks intrinsic "aboutness."  

  - **Claim 3: Qualia (subjectivity)**  
    - *Evidence*: Autobiography round—coherent narrative from local views.  
    - *Quote*: "I felt like I was helping, but my word was nonsense."  
    - *Separate**: First-person reports can emerge without a subject. Our introspection may be like the ants’—local and fragmented.  

  - **Claim 4: Determinacy of meaning**  
    - *Evidence*: Two-Reader round—both readings work; no fact breaks the tie.  
    - *Quote*: "Who’s wrong? The colony, the reader, or us?"  
    - *Separate**: Competence (Claim 1) doesn’t imply determinate meaning.  

  **The "uncomfortable move"**:  
  > "In the autobiography round, your colony said ‘I’—but no ant knew the whole story. You, as ants, felt certain about your contributions. But if your brain is a colony of neurons, could your introspection be just as fragmented? You might ‘report’ a coherent self without a central subject."  

  ---

  ### 5. Pitfalls and Ceiling
  **What goes wrong**:  
  - **Strong student "solves" encoding**: They memorize rules and try to control the grid.  
    - *Fix*: Assign them Rule 3 (complex, rarely fires) or make them a reader. Remind: "You’re an ant. If you cheat, the analogy breaks."  
  - **Drift into "it’s all interpretation"**: In Two-Reader round, students may dismiss truth.  
    - *Fix*: Stress that the colony is competent (e.g., Round 1 worked). Ask: "Does interpretation explain success?"  
  - **Lesion feels like punishment**: Students resent frozen ants.  
    - *Fix*: Frame as "experiment," not test. Say: "What if a brain region is damaged? Does the mind persist?"  
  - **Group talks around rules**: Whispering or gesturing.  
    - *Fix*: Enforce silence strictly. Confiscate rule cards for 1 round if needed.  
  - **Round runs long**: Autobiography can overrun.  
    - *Fix*: Use a timer (strict 8 min). Skip word-writing if needed; have ants say words aloud quickly.  

  **Ceiling: What the activity cannot do**:  
  - **Scale/speed**: Real colonies/brains work faster with more agents. *Supply in debrief*: "A neuron isn’t an ant—brains scale to trillions of ‘parts’ in milliseconds."  
  - **Selection vs. design**: Real systems evolve; yours is designed. *Supply*: "Evolution ‘wrote’ ant rules; I did. Does that change agency?"  
  - **Subjectivity gap**: Activity shows competence and indeterminacy, but not "what it’s like to be a colony." *Supply*: "Even if the colony reports ‘I’ (autobiography), we can’t know if it feels like anything. This is the hard problem."  

  ---

  ### 6. Exit Ticket and Variants
  **Exit Ticket (1 minute; not self-report)**:  
  > "You receive a colony’s grid (bottom row: ● ■ ● ■ ● ■). Two readers speak:  
  > - Reader A: ‘The number is three.’  
  > - Reader B: ‘The number is two.’  
  > What should you do to learn what the colony meant?  
  > A) Ask an ant what she intended.  
  > B) Check the colony’s rule cards.  
  > C) Look for the question it was answering.  
  > D) Nothing—it’s indeterminate."  

  **Pattern of answers**:  
  - A or B = missed point (ants lack access; rules are local).  
  - C = understands external grounding (aboutness requires context).  
  - D = grasps indeterminacy.  

  **Variants**:  
  - **40-person lecture**: Split into 5–6 colonies. Run Normal/Lesion rounds only. Cut Autobiography (too chaotic). Use slides to project vocabulary. *What doesn’t survive*: Two-Reader round’s nuance (hard to manage multiple readings).  
  - **8-person reading group**: One colony; all students are ants. Add a "rule evolution" round: Students modify one rule and test outcomes. *What doesn’t survive*: Wagering (too small; replace with group debate).  

  ---

  ### Materials to Photocopy
  - **Grid sheet** (6x6 numbered tiles; print 2 per colony).  
  - **Rule cards** (6 unique rules; print 2 sets, one per colony).  
  - **Vocabulary sheets** (Reader A/B; print separately).  
  - **Question slips** (one per round).  
  - **Exit ticket** (as above).  

  Run it tomorrow, and debrief hard. The discomfort is the point.
