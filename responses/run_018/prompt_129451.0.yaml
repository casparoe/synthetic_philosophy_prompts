answer: |-
  Your analysis identifies a profound tension in how societies demarcate market boundaries for bodily goods and services. The pattern you describe rests on a fragmented but internally consistent set of philosophical commitments that prioritize **contextual integrity, stratified commodification, and civic reciprocity**, while accommodating pragmatic necessities. Below is a reconstruction of the implicit theory:

  ---

  ### **Core Philosophical Commitments**
  1. **Anti-Commodification of Irreplaceable/Identity-Forming Goods**  
     - **Kidneys**: Prohibiting sales protects bodily integrity and dignity by resisting the reduction of unique, non-regenerative body parts to fungible commodities. This draws from Kantian deontology (treating the body as an end in itself) and Elizabeth Anderson’s "expressivist" critique (markets express inappropriate valuations).  
     - **Whole Blood**: Symbolizes communal solidarity ("gift relationship" à la Titmuss). Compensation risks corrupting altruism and introducing safety hazards (e.g., incentivizing high-risk donors).  

  2. **Pragmatic Consequentialism for Renewable/Processed Goods**  
     - **Blood Plasma**: Commercialization is permitted because:  
       - Plasma is renewable, *processed* into non-identity-forming products (e.g., clotting factors), distancing it from symbolic "wholeness."  
       - Consequentialism dominates: Paid plasma ensures sufficient supply for life-saving therapies, with regulation mitigating exploitation (e.g., screening, volume limits).  
     - **Hair/Sperm**: Low intimacy, high renewability, and minimal identity-connection allow market logic. Sperm’s "donor" framing maintains a dignity veneer while permitting payment for "time/effort."  

  3. **Reciprocity as Non-Market Virtue Ethics**  
     - **Organ Priority Systems**: Reflect **virtue-ethical reciprocity** (e.g., MacIntyre) or **delayed mutual advantage** (contractualism). By rewarding donors with priority, society:  
       - Avoids commodification (no cash exchange),  
       - Embodies civic duty,  
       - Incentivizes prosocial behavior without market coercion.  
     - *Not purely contractualist*: It lacks the Rawlsian "veil of ignorance" but aligns with communitarian mutual aid (e.g., Sandel).  

  4. **Surrogacy: Carving Out "Labor" from "Goods"**  
     - Allowing expense reimbursement but not gestational wages:  
       - Avoids commodifying the *child* (by not pricing creation) and the mother’s *bodily autonomy* (by framing payment as support, not compensation).  
       - Reflects a **dualist theory**: The gestational process is "intrinsically valuable" labor (beyond market valuation), while expenses are extrinsic costs.  

  5. **Emergency Price-Gouging: Dignity in Necessity**  
     - Prohibiting water price spikes during emergencies treats water as a **bodily extension** essential for survival, invoking "desperate exchange" critiques (Radin). Luxury goods lack this necessity nexus.  

  ---

  ### **What the Practice Strictly Requires vs. Accommodates**
  | **Practice**               | **Strictly Requires**                                  | **Merely Accommodates**                                  |  
  |----------------------------|-------------------------------------------------------|----------------------------------------------------------|  
  | Organ Donor Priority       | Non-market reciprocity                                | *Not* cash equivalence; could be other non-monetary rewards |  
  | Prohibited Kidney Sales    | Irreplaceable organs excluded from markets            | *Not* all bodily tissues; e.g., hair sales permitted     |  
  | Paid Plasma                | Supply sufficiency for life-saving products           | *Not* intrinsic permissibility; relies on renewability   |  
  | Unpaid Whole Blood         | Symbolic altruism                                     | *Not* plasma, due to processing/convenience factors      |  
  | Surrogacy Expenses-Only    | Non-commodification of child/gestational relationship | *Not* bans on compensation; e.g., Iran permits paid surrogacy |  

  ---

  ### **Unified Account? Pragmatic Moral Pluralism**  
  The pattern resists a single principle but reveals a **contextual hierarchy of values**:  
  - **Dignity** dominates for non-renewable, identity-constitutive goods (organs, whole blood).  
  - **Consequentialism** prevails for renewable, processable goods with high social utility (plasma).  
  - **Virtue Ethics/Reciprocity** governs systems encouraging prosociality without direct commodification (donor priority).  
  - **Risk Externalization** explains distinctions: Kidney sales risk exploiting the poor; plasma sales are tractable via corporate control.  

  **Social Signaling** is key: Blood donation signals communal unity; surrogacy reimbursement signals respect for gestation without endorsing "womb rental."  

  ---

  ### **Extending/Contracting Market Boundaries**  
  The same commitments could justify:  
  - **Expansion**:  
    - **Commercial Surrogacy**: If framed as *labor* (like paid plasma donation) with robust protections, consequentialism could override dignity concerns.  
    - **Compensated Bone Marrow Donation**: Renewable tissue, analogous to plasma.  
  - **Contraction**:  
    - **Banning Paid Plasma**: If altruistic plasma supply suffices (as in some EU states), dignity arguments could prevail.  
    - **Extending Price-Gouging Protections**: To all essential goods (e.g., insulin), invoking bodily necessity.  

  However, **inconsistencies undermine principled expansion**:  
  - Allowing sperm sales but not surrogacy wages contradicts the "intrinsic labor" stance.  
  - Permitting plasma sales but not kidney markets inconsistently applies renewability criteria (hair is non-renewable but saleable).  

  ---

  ### **Conclusion: A Hybrid Framework**  
  The legal patchwork reflects **pragmatic moral pluralism**:  
  1. **Non-commodification core**: Bodily integrity and dignity for irreplaceable/identity-forming goods.  
  2. **Consequentialist periphery**: Markets permitted where utility outweighs corruption risks (plasma, hair).  
  3. **Reciprocity as a non-market bridge**: Incentivizing virtue without commodification.  

  This framework is less a coherent theory than a negotiated truce between competing values—dignity, utility, and civic virtue—with pragmatism resolving tensions. To systematize it, societies must choose: either embrace consequentialism for all renewable bodily goods (permitting compensated surrogacy/kidneys) or consistently defend dignity (restricting plasma/hair sales). The current middle path sustains logical gaps but reflects deeply held, if unstable, intuitions about the body’s sacred and instrumental dimensions.
