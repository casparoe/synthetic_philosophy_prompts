prompt: |-
  I'm a doctoral student in philosophy of science working on social epistemology, and in a recent seminar we were debating whether the standard taxonomy of epistemic pathologies can adequately capture institutional failures in high-stakes quantitative decision-making. I would like you to take the 1998 collapse of Long-Term Capital Management—specifically the months preceding the Russian sovereign default, when the firm's internal risk models registered catastrophic exposure to emerging-market spreads, yet the senior partners dismissed warnings from junior quantitative analysts and treated external regulatory inquiries as ignorant interference—and analyze it as a disciplined case study through the lens of echo chambers versus epistemic bubbles.

  Using the conceptual distinction between informational isolation (epistemic bubbles) and trust-based isolation (echo chambers), please map the internal dynamics with precision: identify the structural positions occupied by the Nobel laureate partners versus the risk-management staff, specify whether contrary evidence was actively excluded from the partners' information environment or rather present but systematically distrusted because of its source, and examine how the prestige hierarchy shaped what could count as credible dissent. Then say what the theory gets right about the collapse—whether the partners genuinely lacked access to disconfirming data, or whether they possessed it and devalued it regardless of its evidential quality—and where the framework misdescribes the episode, particularly regarding the role of stochastic calculus overconfidence versus social distrust. Finally, I want you to push beyond the standard binary: consider whether LTCM reveals a distinct pathology, an "epistemic prestige cascade," in which credibility flows downward from institutional status so that dissent becomes not merely distrusted but structurally inaudible, and ask whether recognizing this phenomenon modifies the normative recommendations that the bubble-and-chamber framework typically generates for institutional design. Do not supply bibliographies, reading lists, or citations; I am interested solely in the conceptual architecture and the two-way illumination between the theory and the case.
