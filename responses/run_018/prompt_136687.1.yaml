prompt: |-
  hey, so ive been thinking about manipulation vs persuasion on my own, mostly because i keep seeing people online call everything they dislike "manipulation" and everything they like "just good reasoning." i tried to break it down into three layers of how you can get someone to choose differently: layer one is giving them true info they didnt have, layer two is changing how they weight the reasons they already have without lying (like making health risks feel more urgent), and layer three is tweaking the choice setup itself like defaults or framing so they pick differently without really thinking. im especially stuck on layer two — is that legit persuasion or is it already manipulation?

  i want a kind of exam question i could use with my discussion group (were not academics, just people who read a bit). it should be an essay question that cant be answered by just reciting "manipulation is non-rational persuasion is rational" — people need to actually deal with layer two and say where the line is. please include a model answer of around 500 words and a marking scheme that lists the specific moves a top answer must make, plus the common mistakes that should lose marks. dont ask for citations or reading lists — none of us have library access for this. also please avoid super obscure theories we wouldnt know. keep it focused on the three-layer idea i mentioned.
