   ... Alternatively, they might arbitrarily choose one action over the other, but then they are acting against one of their obligations without a reason provided by the logic. This arbitrary choice might be seen as a failure of rationality, because the agent is ignoring one of the obligations they believe to be true. The dialetheist might argue that the agent can both believe the contradiction and still act, by adopting a stance of pragmatic resolution. However, this pragmatic move is not derived from the logic itself and is an external addition. Thus, it does not save dialetheism from the charge that it leaves the practical conflict unresolved.

   Furthermore, the epistemic commitment to a contradiction about obligations may extend beyond the immediate action. If the agent believes both obligations, then they must also believe that whatever they do, they will be violating an obligation. This leads to a belief that they are necessarily blameworthy, which might be an unacceptable consequence for a normative system. It could undermine the entire project of having obligations if they are not consistently actionable.

   Therefore, the dialetheist approach in this regulatory scenario, while formally coherent, fails to provide a satisfactory resolution for the rational agent who must act. The practical conflict remains, and the epistemic cost of believing a contradiction about obligations is high. This suggests that for practical normative reasoning, dialetheism and paraconsistent logic may be less useful than in domains where action is not required.

