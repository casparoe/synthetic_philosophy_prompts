prompt: |-
  I have no formal training in philosophy or logic; I have been thinking about these questions independently after coming across the idea that some contradictions might be literally true rather than errors. I want to see whether an AI can work through a specific conceptual tension in dialetheism and paraconsistent logic without falling back on memorized summaries.

  Please draft an exam question for an upper-level undergraduate seminar—about 90 minutes, with an expected answer of roughly 600 words—on dialetheism and paraconsistent logic. The question must not be answerable by simply reciting the standard arguments commonly associated with allowing true contradictions, or by defining the principle of explosion. Instead, build the question around this injected scenario: a single, unambiguous regulatory statute contains one clause that mandates action X for every case falling under category A, and another clause that prohibits action X for every case falling under category B, where a particular real-world situation is demonstrably both an A and a B, and where the contradiction cannot be dismissed as a drafting mistake because the categories are independently well-defined. Ask the student to evaluate whether adopting a paraconsistent logic that rejects explosion actually helps rational agents decide what to do in that situation, or whether it merely blocks arbitrary inference while leaving the practical normative conflict untouched. The student should also be required to address whether accepting dialetheism in this localized domain forces an unacceptable epistemic commitment—namely, believing a contradiction about what one ought to do.

  Provide the following in your response:
  1. The full exam question as it would appear on the exam.
  2. A model answer of approximately 600 words.
  3. A marking scheme out of 20 total marks that distinguishes an A answer from a B answer by naming the specific conceptual moves each must contain (for instance, separating formal properties of paraconsistent systems from practical decision procedures; analyzing whether rejecting explosion solves or relocates the contradiction; assessing the epistemic cost of dialetheist commitment in normative reasoning). Include a brief list of common errors and the marks each should cost.

  Please format your entire response as structured data: a JSON object with exactly these named fields, each described below:
  - "asker_background": one sentence describing my non-academic, self-directed interest in contradictions.
  - "domain": "Dialetheism and paraconsistent logic"
  - "assessment_type": "Exam question with model answer and marking scheme"
  - "injected_crux": a brief description of the regulatory-statute contradiction scenario embedded in the question.
  - "constraints": an object with keys "level" ("upper-level undergraduate seminar"), "time_minutes" (90), "word_target" (600), "total_marks" (20).
  - "exam_question": the full text of the essay prompt given to students.
  - "model_answer": the ~600-word model answer.
  - "marking_scheme": an object with keys "total_marks" (integer), "grade_distinctions" (array of objects each with "grade" (string), "required_moves" (array of strings), "marks_assigned" (integer)), and "common_errors" (array of objects each with "error_description" (string), "deduction" (string or integer)).
  - "format_notes": a brief instruction that no bibliographies, citations, or reading lists should appear anywhere, and that no specific work should be quoted verbatim without a fetched source (paraphrase without quotation marks if needed).

  Make sure the exam question and model answer avoid asking for or providing specific bibliographies, citations, or obscure theoretical references that a model without web access could not reasonably recall. Rely on general knowledge of logical concepts, and inject only the constructed regulatory scenario above to force original reasoning.
