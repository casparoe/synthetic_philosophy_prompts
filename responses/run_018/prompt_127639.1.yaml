   Exam Question:

   Consider the following regulatory scenario: a single, unambiguous statute contains one clause that mandates action X for every case falling under category A, and another clause that prohibits action X for every case falling under category B. A particular real-world situation is demonstrably both an A and a B. The categories A and B are independently well-defined and the overlap is not due to a drafting mistake; it is a genuine feature of the statute. Consequently, the situation yields a true contradiction: it is simultaneously obligatory to perform X and obligatory to not perform X.

   Evaluate whether adopting a paraconsistent logic that rejects the principle of explosion actually helps rational agents decide what to do in that situation, or whether it merely blocks arbitrary inference while leaving the practical normative conflict untouched. In your evaluation, also address the following: does accepting dialetheism in this localized domain force an unacceptable epistemic commitment—namely, believing a contradiction about what one ought to do?

   Your answer should not simply recite standard arguments for dialetheism or define the principle of explosion. Focus on the implications for decision-making and epistemic costs in this specific scenario.

   Model Answer (approx 600 words):

   In the given regulatory scenario, a paraconsistent logic that rejects explosion prevents the derivation of arbitrary conclusions from the contradictory obligations. This is because such a logic allows for true contradictions without trivializing the system. However, it does not by itself resolve the practical question of what action to take. The rejection of explosion blocks the inference that any arbitrary action is obligatory (or prohibited) due to the contradiction, but it does not provide guidance on whether to perform X or not in this specific case. The normative conflict remains: the agent is faced with two incompatible obligations that are both true.

   The core issue is that paraconsistent logic is a formal system for reasoning with contradictions, not a decision procedure for action. It can help avoid the absurdity of explosion, ensuring that other obligations and facts remain unaffected. For instance, if there were other unrelated obligations, they would not be undermined by this local contradiction. But for the conflicting obligations at hand, the logic does not break the deadlock. The agent still must choose between performing X and not performing X, and the logic does not assign a priority or a way to reconcile the conflict. Thus, the practical normative conflict is untouched by the adoption of paraconsistent logic.

   Turning to dialetheism: accepting that there is a true contradiction in obligations (both 'ought X' and 'ought not X' are true) forces an epistemic commitment to believing a contradiction about what one ought to do. This is problematic because belief is typically taken to be guided by norms of rationality that exclude believing both a proposition and its negation. Even if one holds that some contradictions are true, believing both sides of a contradiction may lead to cognitive dissonance and practical indecision. In the context of action, the agent who believes both that they ought to do X and that they ought not do X may be paralyzed, unable to form an intention to act. Alternatively, they might arbitrarily choose one action over the other, but then they are acting against one of their obligations without a reason provided by the logic.

   Moreover, the epistemic cost is heightened in normative reasoning because obligations are action-guiding. If we accept a true contradiction about what we ought to do, it undermines the very function of obligations: to direct action. Without a way to resolve the conflict, the agent is left in a state of normative confusion. The dialetheist might respond that the agent should accept the contradiction and then use some additional criteria (e.g., moral or pragmatic) to decide. But this move essentially concedes that dialetheism alone does not solve the problem and requires supplementing with external decision principles. This raises the question: why accept the contradiction in the first place if we then have to override it with non-dialetheist reasoning?

   In conclusion, while paraconsistent logic prevents the system from becoming trivial by rejecting explosion, it does not help in deciding what to do in the face of contradictory obligations. It merely isolates the contradiction. Accepting dialetheism in this context imposes a heavy epistemic burden: the agent must believe a contradiction about their obligations, which may be unacceptable because it prevents coherent action-guidance. Thus, the adoption of paraconsistent logic and dialetheism might be formally adequate for representing the statute, but it does not resolve the practical dilemma and may even exacerbate the problem of decision-making by requiring belief in incompatible obligations.

   (Word count: approx 530. We can add a bit more to reach 600 if needed, but it's close.)

