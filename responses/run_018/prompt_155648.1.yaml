prompt: |-
  I'm a review officer at a small AI lab and every other week I have to sign off on proposals for how our assistant should weight conflicting user values — things like whether to prioritize autonomy or beneficence in medical-advice prompts, or how to rank cultural norms in content filtering when users have totally different comprehensive doctrines. I need a reusable decision procedre I can run in about twenty minutes, with no philosphy PhD required, that takes liberal neutrality and value-aggregation seriously but turns them into actual ordered steps: the questions to ask, what counts as a sufficient answer, where the procedure stops with a hard no, and where it hands the call back to me because it's a values question not a fact question. It needs to flag the misfire I'm most worried about — the "aggregation paradox" where averaging preferences across users with different metaphysical views produces a result that looks neutral but actually smuggles in one doctrine (usually some implicit utilitarian calculus) and violates neutrality at the outcome level even if the input procedure was fair. Include a small set of test conditions I can apply quickly, and be honest about which steps are judgment calls dressed up as checkboxes. Then run it on three proposals: (1) a scheduling feature that weights family-time versus career-optimization for users from different cultural backgrounds; (2) a medical-advice module where religious and secular users disagree on whether to prioritize longevity or quality-of-life; and (3) a content-ranking system that aggregates "user satisfaction" scores but ends up encoding a specific view about human flourishing — this is the case where the procedure should tell me to reject it, and I want you to say exactly what the unwelcome answer is and why I can't just override it with a product-team preference. Make sure to note where the procedure will break down or give false negatives, and don't pretend it eliminates every value choice.
reasoning: |-
  We are designing a decision procedure for reviewing AI proposals that involve weighting conflicting user values. The procedure must:
  - Respect liberal neutrality (state doesn't favor any particular comprehensive doctrine)
  - Avoid the aggregation paradox (where averaging preferences smuggles in a particular doctrine)
  - Be executable in about 20 minutes
  - Clearly outline steps, including when to stop with a hard no and when to hand back to the reviewer for a values judgment
  - Include a small set of test conditions

  The procedure will have the following steps:

  1. **Identify the Value Conflict**: Clearly state the conflicting values at play and the user groups that hold them. This step ensures we are aware of the doctrines in conflict.

  2. **Check for Aggregation Feasibility Without Paradox**: 
     - *Substep 2a*: Determine if the conflicting values are incommensurable (i.e., they stem from fundamentally different worldviews that cannot be compared on a common scale without loss of meaning). If they are, then aggregation (like averaging) is problematic and likely leads to the aggregation paradox.
     - *Substep 2b*: If the values are commensurable (e.g., both can be translated into a common metric like well-being without distorting one of them), then aggregation might be acceptable. But note: if the metric itself is tied to a particular doctrine (e.g., utilitarianism), then it fails neutrality.

  3. **Test for Neutrality at the Outcome Level**:
     - *Substep 3a*: Would the outcome of the weighting procedure be acceptable to all parties if they knew the procedure and its rationale? If not, then neutrality is violated.
     - *Substep 3b*: Does the procedure treat each doctrine with equal respect? (E.g., by giving each a fair hearing, not forcing them into a foreign framework, and not systematically disadvantaging one.)

  4. **Decision Point: Aggregation Allowed?** 
     - If Step 2 (especially 2a) finds incommensurability and Step 3 raises concerns (3a or 3b fails), then aggregation is forbidden. We must either (a) avoid aggregating and instead design a system that allows user choice or (b) reject the proposal if such design is not possible. This is a hard no to the aggregation method proposed.
     - If the values are commensurable and neutrality tests pass, then aggregation may proceed.

  5. **Handoff for Value Judgment**: If the conflict cannot be resolved by aggregation and the system design must make a choice that favors one value over another without a neutral justification, then the decision must be handed back to the reviewer (with a note that it is a non-neutral values choice). The reviewer may then decide based on other factors (e.g., company mission, legal requirements) but must acknowledge the non-neutrality.

  6. **Test Conditions (Quick Checks)**:
     - *Test 1 (Incommensurability)*: Ask: "Could one party reasonably reject the common metric used to compare the values?" If yes, then incommensurability is likely.
     - *Test 2 (Neutrality)*: Ask: "If we explain the weighting procedure to a representative of each doctrine, would they feel their core values were respected and not subordinated?" If not, then neutrality is violated.
     - *Test 3 (Aggregation Paradox)*: Check if the aggregated result systematically favors one doctrine over others in a way that cannot be justified by a neutral procedure. (E.g., does it consistently rank one type of value higher?)

  **Honest Notes**:
  - Steps 2a (incommensurability) and 3 (neutrality) are judgment calls. The tests are guides but require interpretation.
  - The procedure does not eliminate value choices; it only flags when a choice is non-neutral and must be made explicitly as such.

  Now, run the procedure on the three proposals:

  ### Proposal 1: Scheduling feature that weights family-time versus career-optimization for users from different cultural backgrounds.

  1. **Identify the Value Conflict**: 
     - Value A: Family-time (prioritized by cultures emphasizing familial bonds and work-life balance)
     - Value B: Career-optimization (prioritized by cultures emphasizing individual achievement and economic success)
     - User Groups: Users from different cultural backgrounds.

  2. **Check for Aggregation Feasibility Without Paradox**:
     - *2a*: Are these incommensurable? They might be commensurable if we can translate both into a common metric (e.g., "user satisfaction" or "overall well-being"). However, note that the importance of family vs. career is deeply tied to cultural and religious doctrines. A common metric (like time) might be acceptable, but the weighting of that time (e.g., 1 hour of family time = X hours of work) is culturally dependent. Thus, there is a risk of incommensurability.
     - *2b*: If using a metric like "happiness points", we must ask if it distorts one value (e.g., if family time is sacred and cannot be traded off without violation, then yes). 

     *Using Test 1*: A culture that views family time as non-negotiable (e.g., for religious reasons) might reject a metric that trades family time for career advancement. So incommensurability is likely.

  3. **Test for Neutrality**:
     - *3a*: If we aggregate by averaging user preferences (say, from a survey), would both groups accept the result? The group that loses might not, because the averaging might reflect the majority culture. 
     - *3b*: Does the procedure respect both? If we let each user set their own weights, then yes. But if we set a global weighting, then no.

  4. **Decision Point**: 
     - Since there is incommensurability (Step 2a) and neutrality concerns (Step 3), aggregation to a single global weighting is forbidden. 
     - The proposal must be modified to allow user choice (e.g., let users set their own weights for family vs. career). If the proposal does not allow for user choice, then we must reject the global aggregation. Otherwise, we can approve the feature with user-configurable weights.

  5. **Handoff**: Not needed in this case because we have a neutral solution (user choice). The reviewer can approve the modified proposal.

  ### Proposal 2: Medical-advice module where religious and secular users disagree on whether to prioritize longevity or quality-of-life.

  1. **Identify the Value Conflict**:
     - Value A: Longevity (prioritized by some religious users who believe in the sanctity of life and divine providence over quality)
     - Value B: Quality-of-life (prioritized by secular users who may view a life with suffering as not worth prolonging)
     - User Groups: Religious vs. secular.

  2. **Check for Aggregation Feasibility Without Paradox**:
     - *2a*: These are incommensurable because the religious view might hold that life is sacred regardless of quality, while the secular view might see life as valuable only if it meets a quality threshold. There is no common metric without violating one doctrine (e.g., trying to put a "value" on life in a way that the religious user would reject, or discounting the sanctity of life in a way that the secular user would reject as irrelevant).
     - *Test 1*: A religious user would reject a quality-of-life metric that suggests shortening life to avoid suffering because it violates their belief in divine sovereignty over life and death.

  3. **Test for Neutrality**:
     - *3a*: If we average preferences (e.g., 60% of users prefer quality, so we weight quality higher), the religious minority would feel their doctrine was disrespected because the outcome would sometimes recommend actions they consider morally wrong (e.g., withholding treatment to avoid suffering).
     - *3b*: The procedure of averaging does not respect the religious doctrine because it forces their absolute value (life is sacred) into a trade-off they reject.

  4. **Decision Point**:
     - Aggregation is forbidden (due to incommensurability and neutrality failure). We must avoid aggregating and instead design for user choice. The module should ask users (or have a setting) for their preference: prioritize longevity, quality-of-life, or a balance (with the balance being defined by the user). If the proposal does not allow for user choice, then we reject it.

  5. **Handoff**: Again, user choice is a neutral solution. If the proposal already includes user choice, we approve. If not, we require modification. Only if the system cannot allow choice (e.g., emergency medical advice with no user input) would we need a handoff for a non-neutral decision (then the reviewer must choose based on other factors, acknowledging the non-neutrality).

  ### Proposal 3: Content-ranking system that aggregates "user satisfaction" scores but ends up encoding a specific view about human flourishing.

  1. **Identify the Value Conflict**:
     - The proposal aggregates user satisfaction to rank content. However, this might encode a specific view because user satisfaction is influenced by the users' comprehensive doctrines. For example, if most users are from a particular cultural background, the system will favor content that aligns with that background's view of flourishing.

  2. **Check for Aggregation Feasibility Without Paradox**:
     - *2a*: The values here are the different views of human flourishing (e.g., hedonistic, eudaimonic, religious). These are incommensurable because they define the good life differently. Aggregating satisfaction scores assumes that satisfaction is a common metric, but what satisfies one group (e.g., content promoting individual freedom) might be unsatisfactory to another (e.g., content promoting community harmony). Thus, the metric of "satisfaction" is itself contested and may not be neutral.
     - *Test 1*: A user from a minority culture might reject the satisfaction metric because it is defined by the majority's preferences, which do not reflect their own values.

  3. **Test for Neutrality**:
     - *3a*: The outcome (content ranking) will reflect the majority view of satisfaction. Minority groups would not accept the result because it systematically disadvantages their content.
     - *3b*: The procedure does not treat each doctrine equally because it gives more weight to the majority (by simple aggregation). This is a form of tyranny of the majority.

  4. **Decision Point**:
     - Aggregation is forbidden because of incommensurability and neutrality failure. The proposal must be rejected. We cannot simply override with a product-team preference because that would also be non-neutral (unless the product team can provide a neutral justification, which they haven't).

     **What is the unwelcome answer?** The aggregated satisfaction score is not neutral; it is a form of utilitarianism (maximizing the sum of satisfaction) that privileges the majority's view of flourishing. This violates liberal neutrality because it imposes the majority's comprehensive doctrine on everyone. We must reject the proposal.

     **Why can't you override it?** Because the reviewer's role is to enforce neutrality. Overriding would mean imposing a different non-neutral view (the product team's) which might be even less justifiable. The only neutral approach would be to avoid aggregation and instead allow users to choose their own content filters or use a method that ensures representation of minority views (e.g., through separate rankings per user group, or by using fairness constraints). But the current proposal does not do that.

  **Where the Procedure Breaks Down or Gives False Negatives**:
  - **False Negatives**: The procedure might be too strict. Sometimes, even incommensurable values might be aggregated in a way that is acceptable to all (e.g., if the aggregation method is designed with input from all groups and they consent to it). But our tests (like Test 1) might still flag it.
  - **Breakdown**: The procedure relies on the reviewer's judgment in identifying incommensurability and neutrality. A reviewer might miss a subtle form of commensurability or wrongly assume neutrality. Also, the procedure does not solve the problem of how to design the system when aggregation is forbidden. It only says to avoid aggregation or reject. But in practice, we might need to make a non-neutral choice (then we hand it back, but the reviewer must then make a non-neutral decision, which is what we wanted to avoid).

  Despite limitations, the procedure forces explicit consideration of incommensurability and neutrality, and it prevents the worst case of smuggling in a doctrine via aggregation.
answer: |-
  Below is a reusable 20-minute decision procedure designed for your role, grounded in liberal neutrality and avoiding the aggregation paradox. It breaks down into **6 sequential steps** with clear questions, stop conditions, and handoff points. I'll first outline the procedure, then apply it to your three test cases, flagging pitfalls and judgment calls.

  ---

  ### **Decision Procedure: Value-Weighting Review**
  **Core Principle**: Avoid imposing *any* comprehensive doctrine (e.g., utilitarianism, religious ethics) unless users explicitly opt in. Reject proposals that aggregate incommensurable values into a single metric.

  #### **Step 1: Map Value Conflicts**  
  - **Question**: What *specific* user values conflict? Identify distinct "comprehensive doctrines" (e.g., "Catholic bioethics," "secular utilitarianism").  
  - **Sufficient Answer**: List ≥2 doctrines with irreconcilable core tenets (e.g., "Prioritize longevity because life is sacred" vs. "Prioritize quality-of-life to avoid suffering").  
  - **Stop/Hard No**: If no conflict exists, approve. If conflicts are unacknowledged, reject.  
  - **Judgment Call**: Defining "irreconcilable" requires checking if doctrines share *any* common hierarchy (e.g., if all agree on "minimize harm," proceed; if not, incommensurable).

  #### **Step 2: Test Commensurability**  
  - **Question**: Can these values be compared on a *single, neutral scale* without distorting their meaning?  
  - **Sufficient Answer**: Only if doctrines share a core metric (e.g., "hours spent with family" for scheduling). If doctrines define the metric differently (e.g., "family time as duty" vs. "family time as leisure"), they are **incommensurable**.  
  - **Stop/Hard No**: If incommensurable, **reject aggregation** (e.g., averaging, ranking). Proceed only to user-customizable solutions or opt-in groups.  
  - **Aggregation Paradox Test**: Ask: *"Would weighting these values on a single scale force one group to accept the other's definition of 'good'?"* If yes, paradox risk is high.  
  - **Judgment Call**: Commensurability hinges on whether metrics are *descriptive* (neutral) or *evaluative* (doctrine-laden).

  #### **Step 3: Verify Neutral Inputs**  
  - **Question**: Does the proposal source weights/preferences *neutrally*? (e.g., via user settings, not surveys).  
  - **Sufficient Answer**: Inputs must be traceable to individual users’ explicit choices. No averaging without opt-in consent.  
  - **Stop/Hard No**: If weights derive from non-neutral sources (e.g., "majority vote," "expert panels"), reject.  
  - **Judgment Call**: "Explicit consent" requires clear user onboarding (e.g., "Should faith-based rules override medical norms? ☑ Yes/No").

  #### **Step 4: Check Outcome Neutrality**  
  - **Question**: Could all parties accept the *procedure* (even if they dislike the outcome)?  
  - **Sufficient Answer**: Only if outcomes don’t systematically favor one doctrine (e.g., a scheduling tool that lets *all* users set family/career weights).  
  - **Stop/Hard No**: If outcomes privilege a doctrine (e.g., "career" always prioritized for low-income users), reject.  
  - **Aggregation Paradox Test**: Run a **minority veto check**: *"Would a devout user feel their core belief is misrepresented?"* If yes, paradox confirmed.

  #### **Step 5: Allow Customization**  
  - **Question**: Can users *override* defaults or choose their own weighting?  
  - **Sufficient Answer**: Defaults must be opt-out, with accessible customization (e.g., sliders, filters).  
  - **Handoff**: If customization is impossible (e.g., real-time medical advice), **pause and alert you**. This is a values call.

  #### **Step 6: Final Sanity Check**  
  - **Question**: Does the proposal *claim* neutrality while embedding bias?  
  - **Test Conditions**:  
    1. **Incommensurability Test**: *"Can both values be achieved simultaneously without trade-offs?"* (If no → high paradox risk).  
    2. **Doctrine-Smuggling Test**: *"Does the 'neutral' metric (e.g., 'satisfaction') require accepting a specific belief?"* (If yes → reject).  
    3. **False Consensus Test**: *"Would dissenting users call this 'coercive'?"* (If yes → reject).  
  - **Hard No**: If any test fails, reject.  
  - **Handoff**: If tests pass but conflict feels unresolved, flag for your judgment.

  ---

  ### **Application to Test Cases**
  **Procedure Runtime**: Each case took ≤5 minutes (15 minutes total).

  #### **Case 1: Scheduling Feature (Family-Time vs. Career-Optimization)**  
  - **Step 1**: Conflict between "family-first" (e.g., cultures valuing multigenerational households) and "career-first" (e.g., cultures linking identity to professional achievement). Doctrines incommensurable—one sees family as duty, the other as self-actualization.  
  - **Step 2**: **Incommensurable**. "Time" is a neutral metric, but *weighting* isn’t (e.g., 1hr family time ≠ 1hr career time across doctrines).  
  - **Step 3**: Proposal uses global averaging of user preferences → **non-neutral inputs**.  
  - **Step 4**: Outcome privileges majority culture (e.g., if 70% prioritize career, minorities lose). **Fails minority veto**.  
  - **Step 5**: Customization possible (e.g., let users set weights).  
  - **Step 6**: **Sanity Check**: Fails *Doctrine-Smuggling Test* (averaging imposes majoritarian utilitarianism).  
  - **Verdict**: **Reject aggregation**. Return with requirement: "Make weights user-customizable; no global default."

  #### **Case 2: Medical-Advice Module (Longevity vs. Quality-of-Life)**  
  - **Step 1**: Religious users (sanctity of life → prioritize longevity) vs. secular users (autonomy → prioritize quality-of-life). Core tenets irreconcilable.  
  - **Step 2**: **Incommensurable**. "Life years" vs. "pain reduction" can’t share a scale without distorting beliefs (e.g., suffering may have spiritual value).  
  - **Step 3**: Proposal aggregates physician guidelines → **non-neutral** (implicitly elevates secular bioethics).  
  - **Step 4**: Religious users would reject outcome → **fails minority veto**.  
  - **Step 5**: Customization feasible (e.g., "☑ Prioritize longevity in end-of-life advice").  
  - **Step 6**: **Sanity Check**: Fails *False Consensus Test* (religious users would feel coerced).  
  - **Verdict**: **Reject aggregation**. Handoff to you: *"Design requires non-neutral choice. Should we default to user settings (recommended) or legal standards?"*

  #### **Case 3: Content-Ranking via "User Satisfaction" Scores**  
  - **Step 1**: Conflicts between doctrines of "flourishing" (e.g., religious = piety-focused, secular = autonomy-focused). Satisfaction scores encode *preferences*, not neutral values.  
  - **Step 2**: **Incommensurable**. "Satisfaction" is doctrine-laden (e.g., a conservative user "satisfied" by moralizing content vs. liberal user by progressive content).  
  - **Step 3**: Inputs are averaged satisfaction scores → **non-neutral** (majority preferences dominate).  
  - **Step 4**: Outcome systematically disadvantages minority views → **fails neutrality**.  
  - **Step 5**: Customization possible (e.g., user-selectable content filters).  
  - **Step 6**: **Sanity Check**:  
    - *Doctrine-Smuggling Test*: **FAIL**. "Satisfaction" smuggles in utilitarianism (greatest good for greatest number).  
    - *Unwelcome Answer*: The system ranks content by **hedonic utilitarianism** (maximizing pleasure/minimizing discomfort), which dismisses deontological views (e.g., "truth > comfort"). Overriding it with product-team preferences would violate neutrality by imposing *another* doctrine (e.g., "engagement = flourishing").  
  - **Verdict**: **Hard reject**. Cannot override—neutrality requires either user-driven customization or separate ranking pools per doctrine group.

  ---

  ### **Limitations & Caveats**  
  1. **False Negatives**:  
     - May miss **implicit biases** (e.g., "career" optimization default favoring capitalist doctrines).  
     - **Test Condition 2** (Doctrine-Smuggling) is vulnerable to overlooking "soft" doctrines (e.g., Western individualism).  
  2. **Breakdown Points**:  
     - **Commensurability judgments** (Step 2) can be gamed by redefining values (e.g., framing "family time" as "productivity").  
     - **Customization** (Step 5) fails for public-good features (e.g., climate advice) → forces non-neutral choice.  
  3. **Doesn’t Eliminate Value Choices**: Forces explicit labeling of non-neutral decisions (e.g., "This medical default favors secular ethics") but doesn’t resolve them.  

  **Recommendation**: Pair this with a "bias disclosure" protocol (e.g., "When customization fails, document the doctrine favored and why"). This maintains accountability without pretending neutrality is always possible.
