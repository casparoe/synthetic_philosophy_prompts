  Okay, the user is preparing for a graduate workshop on collective action and has noticed an inconsistent argumentative pattern. Let me start by understanding the core issue. They’ve observed that in discussions about meat consumption, people accept that individual actions (like not buying meat) are causally ineffective but still morally significant due to expressive reasons like norm-setting. However, in democratic contexts like voting, the same people dismiss expressive reasons when arguing that a single vote doesn't affect outcomes.

  The user wants to know if this inconsistency has a name in the literature. They’re looking for a precise conceptualization of this phenomenon. First, I need to parse the asymmetry: why are expressive reasons accepted in one context but rejected in another? The key difference seems to be the type of collective mechanism—market participation vs. institutional representation.

  Looking into existing philosophical concepts, the inefficacy objection is central. But the asymmetry here is about how non-instrumental reasons are treated differently. The literature on expressive voting or symbolic action might be relevant, but the user notes that their interlocutor dismisses expressive reasons in voting contexts. So, the issue is the selective validation of expressive justifications based on the mechanism's nature.

  The user mentions avoiding confusion with motivated reasoning, the non-identity problem, and symbolic action. So, the concept needs to distinguish this specific asymmetry. Terms like "democratic exceptionalism" or "threshold-mediated rationale asymmetry" come to mind. But I need to check if there's an established term. Derek Parfit's works discuss collective harm thresholds, but he doesn't address this asymmetry. Similarly, voting theory often focuses on the paradox of voting without linking to other domains like consumption.

  The deeper need might be for a framework to critique this inconsistency in workshops. The user probably wants to highlight how categorization of mechanisms influences moral reasoning. They might also need to address why people separate market actions from democratic ones, perhaps due to perceived immediacy or institutional mediation.

  I should define a new term if none exists. "Domain-specific validation of expressive rationales" or "categorization-dependent efficacy discounting." Emphasize the role of mechanism categorization: direct participation (market) vs. representative systems (voting). The boundaries should exclude cases where expressive reasons are uniformly accepted/rejected or where thresholds don't exist. Also, distinguish from motivated reasoning by focusing on structural features rather than prior beliefs.

  In summary, the user needs a clear concept to articulate this asymmetry, with precise boundaries. Creating a new term like "Mechanism-Mediated Rationale Asymmetry" could encapsulate the phenomenon, highlighting how the type of collective mechanism affects the acceptance of non-instrumental reasons despite similar causal inefficacy.
answer: |-
  This inconsistency represents a sophisticated and under-theorized pattern in practical reasoning, straddling collective action problems, democratic theory, and ethics. While **no universally accepted term exists** for this precise asymmetry, the phenomenon can be precisely carved out and distinguished from its neighbors as follows:

  ### Core Phenomenon: Mechanism-Mediated Rationale Asymmetry (MMRA)
  *(Proposed conceptualization)*

  **Definition:**  
  The selective acceptance/rejection of *non-instrumental rationales* (e.g., expressive, symbolic, or norm-reinforcing reasons) for participating in a threshold-governed collective action, where the normative weight granted to the rationale depends on the *categorization of the collective mechanism* itself, despite identical causal inefficacy at the individual level.

  **Key Features:**  
  1.  **Causal Nullity:** The individual act is demonstrably causally inefficacious in altering outcomes due to threshold effects (supplier reorder quantities, electoral margins).  
  2.  **Available Non-Instrumental Rationale:** A plausible expressive/symbolic justification exists (moral self-alignment, democratic ritual, norm reinforcement).  
  3.  **Asymmetry Trigger:** The mechanism is categorized as either:  
      *   **Direct/Participatory Harm System (e.g., market consumption):** Non-instrumental rationale accepted as normatively sufficient.  
      *   **Indirect/Representative Legitimacy System (e.g., mass democracy):** Non-instrumental rationale rejected as normatively irrelevant absent causal efficacy.  
  4.  **Structural Consistency, Normative Inconsistency:** The underlying causal structure (threshold problem) is identical; the inconsistency arises solely from the *type* of collective mechanism.

  ---

  ### Nearest Neighbors & Distinctions in the Literature

  1.  **The Standard Inefficacy Objection:**  
      *   *Neighbor:* Shared focus on causal nullity in collective actions.  
      *   *Distinction:* The standard objection uniformly rejects participation based on inefficacy *regardless of mechanism type*. MMRA is defined by the *asymmetric treatment* of non-instrumental reasons *depending* on mechanism categorization. (e.g., Parfit's "Harmless Torturers" establishes inefficacy but doesn't explore asymmetry across domains).

  2.  **Expressive Voting vs. Symbolic Action:**  
      *   *Neighbor:* Literature on voting often acknowledges expressive/symbolic reasons (Brennan, Lomasky) or democratic ritual significance (Edelman). Symbolic action theory examines non-causal meanings of acts.  
      *   *Distinction:* MMRA highlights the *rejection* of these very reasons *specifically in voting contexts* by agents who *accept* analogous reasons in consumption contexts. The focus is the *inconsistency* across domains, not the validity of expressivism itself.

  3.  **Motivated Reasoning / Cognitive Bias:**  
      *   *Neighbor:* The asymmetry *could* result from bias (e.g., protecting voting habits while critiquing consumption).  
      *   *Distinction:* MMRA identifies a *structurally triggered* inconsistency based on *mechanism features* (direct participation vs. institutional mediation). While bias might *explain* it, the pattern itself is defined by the *systematic dependence on mechanism categorization*, making it a distinct normative puzzle. The agent's *prior commitments* (e.g., political ideology, dietary habits) are not the defining feature here.

  4.  **The Non-Identity Problem:**  
      *   *Neighbor:* Both involve counterintuitive conclusions about individual impact in collective scenarios.  
      *   *Distinction:* Non-Identity concerns identity-dependent harms across time (e.g., future persons). MMRA concerns *simultaneous* collective action with thresholds and the *normative status of non-causal reasons* across mechanism types. No identity dependence is involved.

  5.  **Democratic Legitimacy & Fair Play:**  
      *   *Neighbor:* Theories arguing voting is a duty of fairness or to sustain institutions (Rawls, Estlund).  
      *   *Distinction:* MMRA arises when an agent *rejects* such institutional/normative justifications *specifically because of causal inefficacy*, despite accepting functionally similar justifications (norm-sustaining) in non-democratic collective actions like consumption. The asymmetry is key.

  ---

  ### Conceptual Boundaries of MMRA

  *   **Essential:**  
      *   A *clear causal threshold* rendering individual acts null.  
      *   An *available and plausible non-instrumental rationale* for acting.  
      *   The *asymmetric acceptance/rejection* of that rationale.  
      *   The asymmetry being *primarily triggered by the categorization of the collective mechanism* (direct harm participation vs. representative legitimacy system).
  *   **Excluded:**  
      *   Cases without a clear causal threshold (e.g., acts with tiny but non-zero probability of effect).  
      *   Cases where non-instrumental reasons are *uniformly* accepted or rejected across domains.  
      *   Asymmetry driven *solely* by the agent's specific prior values/biases unrelated to mechanism structure (e.g., "I care about animals but not climate policy").  
      *   Arguments about the *intrinsic* (in)validity of expressive reasons themselves (e.g., whether expressivism is coherent). MMRA focuses on the *inconsistent application*.

  ---

  ### Why This Carving Matters for Your Workshop
  This pattern exposes a tension between two common intuitions:
  1.  **Participation as Constitutive:** In direct systems (like markets), participation is seen as inherently constitutive of the harm/benefit, making expressive alignment morally meaningful *as participation*, even if causally null.
  2.  **Legitimacy as Outcome-Dependent:** In mass democratic systems, participation is often seen as *only* instrumentally valuable for generating legitimate *outcomes*. If the vote doesn't affect the outcome, it's dismissed as mere "noise," irrelevant to legitimacy which is conferred by the *system's* function, not the individual expressive act within it.

  The conceptual framework of MMRA allows you to isolate this inconsistency not as simple hypocrisy, but as a reflection of deep-seated, often unexamined, assumptions about what *kind* of collective action confers meaning on individual participation beyond causality. It highlights a potential blind spot where the structure of the mechanism itself dictates the acceptability of non-instrumental reasoning, creating a normative discontinuity between seemingly analogous collective action problems.
