answer: |-
  Okay, got it. Love the angle – injecting institutional path-dependency into the nonidentity problem is sharp and genuinely underexplored. Let's ditch the baby-making focus and get macro. Here’s a draft pitch leaning into your framing, keeping it conceptual, casual, and scope-aware:

  **Subject: Workshop Pitch: Nonidentity in the Macro - Institutional Path-Dependency & the Future Citizen**

  Hey folks,

  So, I’m wrestling with the nonidentity problem (Parfit’s ghost, I know), but I’m sick of the standard "should-I-have-*this*-kid?" lens. Feels like we’re missing the forest for the trees – specifically, the forest *planted* by massive institutional choices. My proposal: **shift the focus to how large-scale, path-dependent institutional decisions (think major climate adaptation regimes, foundational constitutional amendments, or long-term economic structures) don't just *affect* future citizens, they literally *constitute* the pool of individuals who will exist centuries down the line.** It’s nonidentity via structural causation: collective life trajectories (migration, economic sorting, mating patterns) reshaped over generations by the institutional architecture we choose *now*. This isn't skipping a child; it's building a different societal maze that leads to entirely different people emerging at the exit centuries later.

  My core question isn't about individual procreation, but about **institutional stewardship**: **Does the fact that specific future democratic citizens wouldn't exist *but for* our choice of long-term institutional path (e.g., preserving Institution X vs. radically changing to Y) dissolve or weaken our moral duties *to preserve or maintain those very institutions* (X) *for the sake of those future citizens*?** And crucially, **is there an asymmetry between "harming a specific future person *if they exist*" (the classic framing) and "substituting one *entire future population* for another via institutional design choices *we make now*"?**

  **Why isn't this already settled by the existing literature?** Pretty straightforward gap, I think. The canonical nonidentity debate (Parfit, Woodward, et al.) is laser-focused on the micro-level: individual reproductive acts affecting specific potential future individuals. The moral agents and patients are individuals. But macro-institutional choices are made *collectively* (states, societies), often explicitly claiming to act *on behalf of* or *in the interests of* "future generations" conceived as a collective entity or placeholder. The *causal structure* is utterly different: complex, multi-generational feedback loops involving vast numbers of people and systemic forces (migration flows driven by policy, economic opportunities shaping family formation, etc.). Crucially, the *institutions themselves* are part of the identity-determining conditions for future individuals in a way a single parental decision isn't. The literature just doesn't grapple with this macro-causal structure and its implications for collective duties towards institutionally-constituted future collectives.

  **My Approach: Frameworks in Tension.** I won't just slap Parfit onto institutions. Instead, I'll compare two fundamental ways we conceptualize "future citizens" when justifying institutional preservation:
  1.  **The Specific Individuals Framework (SIF):** Future citizens are conceived as specific, identifiable (in principle) individuals who *will* exist and have moral standing *as those individuals*. We owe duties *to them*.
  2.  **The Placeholder Roles Framework (PRF):** Future citizens are conceived as holders of roles/citizenship within the enduring political community. We owe duties *to the role* or *to the continuity of the community*, not necessarily to the specific individuals who will *incidentally* occupy those roles far in the future. (Think Rawlsian "heads of families" or constitutional perpetuity claims).

  **The Test:** Does the nonidentity problem (arising from institutional path-dependency) fatally undermine moral duties to preserve Institution X *differently* under these frameworks?
  *   **Under SIF:** If preserving Institution X is necessary for Specific Future Citizen S to exist, but changing to Y would cause Different Future Citizen D to exist instead, can we meaningfully say we owe a duty *to S* to preserve X? S only exists *because* we preserved X, so what "harm" could avoiding X (and thus preventing S) constitute *to S*? The classic nonidentity challenge seems to bite hard here, potentially dissolving duties to preserve X *for the sake of S*.
  *   **Under PRF:** Does the nonidentity effect matter at all? If the duty is to maintain the institution *as a role* or for the *continuity of the democratic community itself*, regardless of *who* fills the roles centuries from now, does the identity-swapping caused by path dependency even register as morally relevant? The duty might persist *despite* the population substitution.

  **Success vs. Failure:**
  *   **Success:** Showing that institutional nonidentity creates a *distinct* moral challenge compared to reproductive nonidentity, particularly by:
      *   Revealing a potential **asymmetry**: Nonidentity *might* undermine duties under SIF but *not necessarily* under PRF when dealing with institutional preservation.
      *   Highlighting how **collective agency** and **systemic causation** change the nature of the problem (it's not about *creating* individuals directly, but shaping the conditions that determine *which* individuals emerge).
      *   Demonstrating that the **institutions themselves are part of the identity conditions**, making the duty potentially self-referential in a way individual procreation isn't.
  *   **Failure:** If the analysis ultimately reduces to showing that institutional choices cause different people to exist, and then applying the *exact same* Parfitian arguments about harming/non-harming to "Future Population A" vs. "Future Population B" without revealing any new structural or normative wrinkles specific to the institutional level and collective duty context. If it just becomes "Big Nonidentity," it's not novel enough.

  **Scope Check & Honesty (Crucial for 6 Weeks!):**
  This is a *conceptual* exploration, not an empirical proof. I'm philosophically analyzing the *implications* of the institutional path-dependency *assumption* for nonidentity and duties to preserve institutions.
  *   **Drawing the Line:** I **will not** dive deep into the empirical sociology of *how exactly* institutions cause demographic shifts over centuries. I'll gesture towards plausible mechanisms (e.g., climate policy -> habitable zones -> migration -> mating pools; constitutional rights -> economic structure -> class formation -> family size/timing) but treat this path-dependency as a *conceptual given* for the sake of the argument. I won't model specific scenarios or predict outcomes. The focus is the *moral logic* given that such effects occur.
  *   **What Could Blow It Up:**
      *   Getting sucked into debates about the *actual* predictability or magnitude of institutional demographic effects (rabbit hole!).
      *   Trying to fully resolve the metaphysics of future individuals or collective identity across centuries.
      *   Fully developing a positive theory of duties under PRF – I'll sketch its plausibility and contrast with SIF, but building a robust PRF theory is book-length.
      *   Engaging exhaustively with every permutation of the existing nonidentity literature. I'll engage key positions (person-affecting views, impersonal views, harm thresholds) *conceptually* as they relate to the institutional framing.
      *   Tackling *all* types of institutions. Focus is on core democratic/constitutional ones where claims about duty to future citizens are strongest (e.g., preserving democratic norms, fundamental rights regimes, climate viability as a precondition for political community).

  **The Upshot:** This paper aims to show that ignoring institutional path-dependency makes standard nonidentity analyses inadequate for evaluating our duties towards the *very institutions* meant to shape our collective future. It forces us to confront whether "acting for future citizens" requires thinking of them as specific people (vulnerable to nonidentity) or as placeholders in an enduring project (potentially immune). The asymmetry question highlights a potentially unique normative challenge at the macro level.

  Thoughts? Keen to dig into whether this framing actually *does* new work or if I'm just moving deckchairs on the Parfitian Titanic. Let me know if the scope feels manageable for a workshop/summer paper or if I'm deluding myself!

  Best,

  [Your Name]
  (PhD Candidate, Moral/Political Phil, [Your Uni])

  ---

  **Why this works (hopefully):**

  1.  **Framing Clear:** Opens with the core shift from micro-reproduction to macro-institutional path-dependency.
  2.  **Question Sharp:** States the precise institutional-duty question *and* the asymmetry question upfront.
  3.  **Gap Identified:** Explicitly calls out the micro-focus of existing lit and why macro is different (collective agency, systemic causation, institutions as identity conditions).
  4.  **Approach Novel:** Contrasting SIF vs. PRF is a fresh way in, directly tied to the institutional context and the nature of the duty claimed. Explains *why* not just Parfit applied big.
  5.  **Success/Failure Defined:** Clear criteria for what constitutes a novel contribution vs. just rehashing.
  6.  **Scope Managed:** Explicitly flags the empirical rabbit hole (sociology) as out-of-bounds for *this* project. Focus is conceptual implications. Lists specific things that *won't* be done. Casual language reinforces the "this is a focused probe" vibe.
  7.  **Casual but Conceptual:** Uses phrases like "sick of," "Parfit's ghost," "deluding myself," "rabbit hole," "moving deckchairs," but the core conceptual moves (SIF/PRF, structural causation, self-referential institutions, asymmetry) are clearly articulated at a level an LLM *should* grasp.
  8.  **Typos/Informality:** "forest *planted*" (mild informality), "Parfitian Titanic" (casual metaphor), "Keen to dig in" (colloquial closing). Didn't force typos, kept it naturally grad-student-email-esque.
