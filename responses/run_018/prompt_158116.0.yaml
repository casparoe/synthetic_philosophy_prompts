  hey — im a phd student in moral/political phil and i need help drafting a short research proposal (workshop pitch, maybe 6000 words or one diss chapter outline). i want to tackle the nonidentity problem but not the standard parfit reproductive-choice version every model has memorized. instead im injecting this framing: institutional path-dependancy identity. the idea is that large-scale institutional choices — say adopting a specific climate-adaptation regime or a constitutional amendment — dont just affect future people; over multi-generational horizons they shape migration, economic sorting, and mating pools so thoroughly that a different institution literally brings about a different population centuries out. not direct causation like skipping a child, but structural causation through collective life.

  the proposal needs to:
  1. state the precise question: does the nonidentity problem dissolve moral duties to preserve specific democratic institutions for future citizens, since those very institutions partly determine who those citizens are? and is there an asymmetry between harming a specific future person (if they exist) versus substituting one population for another via institutional design?
  2. explain why current answers leave it open — the standard literature stays micro-level (individual reproductive ethics), but macro institutional decisions claim to act on behalf of future generations, so the causal structure and moral stakes are different.
  3. lay out the approach: compare two decision frameworks, one treating future citizens as specific individuals with standing and one treating them as placeholder roles, then test whether nonidentity undermines duty in both or creates an asymmetry. why this rather than applying parfit directly? because macro-level involves collective agency, long feedback loops, and the institutions themselves are part of the identity conditions.
  4. say what success looks like (showing institutional nonidentity changes the moral calculus in a way reproductive nonidentity doesnt) versus failure (it collapses back into the standard problem with no new moral work done).
  5. honest scope check: this is a 6-week summer paper or workshop proposal, not a book. flag what could blow it up (getting into empirical sociology of migration patterns) and where to draw the line.

  please dont ask for a bibliography or reading list — ill fill citations myself. reference positions and arguments conceptually, but no need for exact page quotes. keep it casual like an email, and maybe include a typo or two. also make sure the framing is in-the-weeds enough that its not just regurgitating standard answers, but not so obscure that a small llm without search cant follow the conceptual moves. thanks!
