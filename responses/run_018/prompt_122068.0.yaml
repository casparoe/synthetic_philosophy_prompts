  Now, brainstorming objections. For the formal group, they might question if aptness introduces anything new beyond functional decision theories like FDT. They could argue that idealizations are still useful as benchmarks. The Kantians might see aptness as already implied by constructivism. The Bayesian will want equations and proofs of existence.

