  I'm trying to locate where my disagreement with a colleague actually lives. My credence that Friedman's F-twist — that unrealistic assumptions in a scientific model are not merely tolerable but methodologically virtuous, provided the model delivers accurate predictions — survives as a sound principle specifically for policy-relevant macroeconomic and social-scientific modeling is about 0.35; hers is closer to 0.75. Give me your own number, but more importantly decompose the question. Break it into: (1) whether macro-level predictive success genuinely indicates that false micro-foundations have isolated an essential mechanism rather than just accommodating free parameters; (2) whether predictive adequacy should be judged by correlational fit, out-of-sample forecasting, or counterfactual stability under intervention; (3) whether there are documented cases in economics or sociology where structurally false but predictively successful models have guided actual policy better than structurally accurate alternatives; and (4) whether "unrealistic" can be defined independently of the model's own theoretical vocabulary. Assign a rough probability to each, explain in one line how they combine, and tell me which of the two positions — 0.35 or 0.75 — most likely diverges on which sub-question. Then identify the term you are least confident in and describe the concrete empirical pattern — for instance, a false-microfoundations model consistently outperforming a structurally accurate rival in out-of-sample policy evaluation — that would shift it most.
