  Their deeper need might be to identify contradictions in theories to strengthen their argument. They mentioned scalar capacity, ecological relational, and hybrid views. Scoring these against the desiderata will help them evaluate existing frameworks. They emphasized avoiding jargon and focusing on edge cases, so I should keep explanations conceptual, not citation-heavy.

  Breaking it down: Non-negotiable desiderata probably include avoiding thermostat status and preventing bacteria from having significant weight. The ant colony problem highlights aggregation vs. emergence. Synthetic networks test functional vs. biological bases. The tension between continuous gradation and no hidden thresholds is crucial—many theories might sneak in a threshold despite claiming gradualism.

