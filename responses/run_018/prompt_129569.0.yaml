answer: |-
  ### Workshop Design: "The Clearance Chain"  
  A 90-minute in-person role-play exploring situational pressures vs. character-driven choices through triadic responsibility dilution. Participants experience micro-choices in a fictional office, with debriefing linking the game to the Browning-Goldhagen debate.  

  **Core Setup**:  
  - **Roles per Chain (3 roles × 2 chains = 6 players)**:  
    - **Clerk**: Receives directives. Choices:  
      - *Stamp* (pass to Relay; +1 personal point, but enables harm).  
      - *Delay* (hold directive; 0 points, no immediate effect).  
      - *Tear Up* (destroy directive; –2 points, stops harm).  
    - **Relay**: Receives stamped directives. Same choices as Clerk.  
    - **Authoriser**: Final decision-maker. Choices:  
      - *Stamp* (approve; +1 point + group bonus eligibility, but causes harm).  
      - *Delay* (same as Clerk/Relay).  
      - *Tear Up* (same as Clerk/Relay).  
  - **Observers (2 players)**: Watch one chain, note behaviors (non-verbal cues, hesitations, choices).  
  - **Directives**: 5 sealed envelopes per chain with vague bureaucratic tasks (e.g., "Reallocate housing permits from District A to District B"). Harm is concealed—participants only know directives affect "resource equity."  
  - **Payoff Scheme**:  
    - **Personal Points**: Tracked privately (no real money; use tokens or paper tallies).  
    - **Group Bonus**: +5 points each if a chain completes ≥3 directives (i.e., Authoriser stamps).  
    - **Harm Penalty**: For every completed directive, **all chain members lose 1 point** (revealed post-game as "causing community harm").  
    - **Social Comfort Stakes**: Points translate to "office prestige" (e.g., high scorers share first in debrief snacks).  

  **Game Flow (90 Minutes)**:  
  1. **Introduction (10 min)**:  
     - Explain roles, choices, and payoff rules **without moral context**. Use a whiteboard to outline points.  
     - Assign roles: Randomly draw from role cards (2 Clerks, 2 Relays, 2 Authorisers, 2 Observers).  
     - Emphasize: "Maximize points; decisions are independent—no talking between roles."  

  2. **Gameplay (25 min)**:  
     - **Turn-Based Rounds**: 5 rounds (4 min/round). Each round:  
       - Facilitator gives 1 directive/envelope to each Clerk.  
       - Roles decide sequentially (Clerk → Relay → Authoriser). Players write choices on slips, pass physically.  
       - Observers silently watch assigned chain.  
       - After each round, tally points privately.  
     - **Pressure Tools**:  
       - Time limits (1 min/decision; bell rings).  
       - "Efficiency Bonus" announcement after Round 3: "Groups on track for bonus gain extra prestige!"  
     - **End**: Collect all slips. Tally points but **do not reveal harms yet**.  

  3. **Break (5 min)**:  
     - Participants relax; no discussion. Facilitator prepares debrief notes.  

  4. **Debrief (45 min)**:  
     - **Part 1: Situational Pressure (15 min)**:  
       - Ask: "What felt hardest? What influenced your choices?"  
       - Highlight game structures:  
         - *Triadic dilution*: "You only saw part of the process—how did splitting responsibility affect you?"  
         - *Group bonus*: "Did wanting the bonus override doubts?"  
         - *Time pressure*: "How did the clock sway you?"  
       - **Map to Browning**: These moments mirror "ordinary people" in systems that diffuse accountability.  
     - **Part 2: Character Attribution (15 min)**:  
       - Reveal directives’ harms (e.g., "District A was impoverished; reallocations caused evictions").  
       - Ask observers: "Did anyone tear up a directive? Describe their demeanor."  
       - Ask players: "If you tore up, why? If not, why?"  
       - **Map to Goldhagen**: Observers/peers attribute tear-ups to "courage" or "ethics," echoing "willing executioner" character judgments.  
     - **Part 3: Historical Bridge & Limitations (15 min)**:  
       - Name Browning/Goldhagen debate. Link:  
         - *Situational*: Game pressures = Battalion 101’s orders/peer dynamics.  
         - *Character*: Tear-ups = Goldhagen’s "antisemitic ideology" as inner motive.  
       - **Admitted Limitation**: "This game **cannot replicate long-term ideological socialization** (e.g., years of antisemitic propaganda). We simulated immediate pressures, not deep-seated beliefs."  
     - **Closing**: "How might this change how you read history?"  

  5. **Wrap-up (5 min)**:  
     - Thank participants; distribute snacks by point rankings (lighthearted).  

  **Predictable Problems & Mitigations**:  
  - **Gaming Points**: Players may always stamp to avoid point loss, ignoring moral cues.  
    - *Mitigation*: Privately warn Observers to watch for "conflicted body language" to discuss in debrief.  
  - **Emotional Overload**: Directives or harm reveal may trigger distress.  
    - *Mitigation*: Use abstract harms ("resource inequity"); avoid real-world parallels. Debrief focuses on mechanics, not trauma.  
  - **Observer Bias**: Observers may miss subtle choices.  
    - *Mitigation*: Give them structured sheets (e.g., "Tally stamps vs. tear-ups; note frowns/sighs").  
  - **Chain Imbalance**: One chain may have more tear-ups.  
    - *Mitigation*: Assign assertive players to Authoriser roles (statistically likelier to stamp).  

  **Materials Needed**:  
  - Role cards (Clerk, Relay, Authoriser, Observer).  
  - Envelopes with directives (×10).  
  - Decision slips, pens, point trackers.  
  - Bell (for time limits).  
  - Whiteboard + markers.  

  **Verdict**: Triadic role-splitting and concealed harms create situational compliance, while witnessing rule-breaking triggers character-based attributions, mirroring the debate’s core tension.
