prompt: |-
  Hey, I'm opening a small workshop tomorrow—maybe twenty people, half are analytic philosophers who think Kierkegaard is mostly bad phenomenology, half are theologians who treat his Abraham book like scripture. I need opening remarks, under 350 words, that actually use the teleological suspension of the ethical to structure what I can and can't say. Specifcally: I shouldn't just welcome everyone to an "ethical dialogue" because Abraham suspends the universal for the singular, so praising universal ethics as our shared ground would miss the whole point. At the same time I can't preach faith to the philosophers. I want to navigate that tension, maybe using Abraham's silence—the fact that he can't explain himself to Sarah or Isaac—as a model for why interdisciplinary disagreement here shouldn't be smoothed over into consensus. Write the remarks. Also tell me exactly where your framing is weakest: what argument or example would make you drop this structural move and just give a normal welcome? And note if you're taking liberties with Kierkegaard's text or leaning on a contested reading.
