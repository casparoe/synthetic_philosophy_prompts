prompt: |-
  I'm working on a problem-set for my metaphysics seminar and I'm tired of the same old statue-and-clay examples everyone just recites from memory. So I want to inject something weirder: picture a 2nd-century Roman copy of a lost Greek bronze that's been restored over centuries, but the newest patch uses bio-mineralized limestone grown in a lab — chemically identical to Carrara marble, but synthesized by bacteria in 2024 with no geological history at all. The museum says it's still the same statue; a critic argues that because the replacement matter never existed in nature, material continuity is broken.

  I need five multiple-choice questions that use this exact scenario to test whether students really grasp material constitution, not just name-drop 'Ship of Theseus.' Each question should have four options, and every wrong option has to catch a seperate, real misunderstanding — like confusing material constitution with spatiotemporal continuity, or assuming chemical identity automatically saves identity. For each item, give the correct answer and a brief explanation of what mistake each distractor represents. Please format your response as a numbered list of exactly five items, each item being one question plus its explanation in a sentence or two, with no intro or conclusion whatsoever. Also, don't stay neutral in the explanations — take a clear, committed stance on whether those synthetic replacement parts preserve the statue's identity, defend that view with reasons, and don't just say 'it depends on your theory.'
