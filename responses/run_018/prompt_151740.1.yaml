prompt: |-
  I'm a clinical ethics consultant at a hospital whose charter requires that, when requested, continuity questions be assessed through Buddhist anatta rather than Western psychological-identity theories. Our committee—meeting without a Buddhist scholar present, with about thirty minutes per case—must repeatedly decide whether an advance directive or prior consent still binds a patient who has undergone radical cognitive or personality change (advanced dementia, severe traumatic brain injury, long-term psychiatric restructuring).

  Please write a reusable decision procedure my committee can run in order: the observable clinical questions to ask, what counts as sufficient evidence for each, where the procedure stops with "the prior directive binds," where it stops with "it does not bind," and where it must hand off to human judgment because the issue is values, not assessment of aggregate change. Ground the criteria in the five aggregates—form, feeling, perception, mental formations, consciousness—translated into clinical indicators, and include explicit misfire warnings where the procedure will likely yield a counter-intuitive result. State clearly what the procedure cannot do.

  Then apply it to three cases: (1) an Alzheimer's patient who retains bodily habits and emotional warmth but no longer recognizes family or remembers the directive, with family insisting it be honored; (2) a post-TBI patient who remembers signing the directive but now holds opposite values, with intact reasoning, and family asking that it be overridden; (3) a late-stage dementia patient who appears content and shows no suffering, but whose prior directive refused artificial nutrition in precisely this state.

  In one case the procedure should yield an answer that conflicts with the family's preference; flag that conflict and note the residual moral question the procedure cannot settle. Finally, separate what in your framework is a relatively settled interpretation of anatta from what is genuinely contested among Buddhist philosophers and clinical ethicists, and do not present any contested reading as the consensus view.
reasoning: |-
  We are creating a decision procedure grounded in the Buddhist concept of anatta (non-self) as understood through the five aggregates (skandhas). The five aggregates are:
    1. Form (rupa): the physical body and senses.
    2. Feeling (vedana): the affective quality of experience (pleasant, unpleasant, neutral).
    3. Perception (sanna): the recognition and labeling of sensory input.
    4. Mental formations (sankhara): volitional activities, habits, dispositions, intentions, and other mental factors.
    5. Consciousness (vinnana): awareness of the object, the basic cognitive faculty.

  The procedure will assess continuity between the prior self (that made the directive) and the current self by examining changes in these aggregates. We are not looking for an unchanging essence but for sufficient continuity in the aggregates to consider the prior directive as binding.

  Important: The procedure does not decide the moral question of whether to follow the directive. It only decides whether the prior directive is still binding (i.e., whether the patient who exists now is the same "person" in the sense required for the directive to apply). The moral question of what to do when the directive does not bind is beyond the scope of this procedure.

  The procedure steps:

  Step 1: Assess changes in the aggregates (using clinical indicators). For each aggregate, we will ask specific questions and note what counts as evidence of continuity or discontinuity.

    Aggregate 1: Form (body)
      Questions: 
        - Has the patient's body undergone changes that fundamentally alter the way they experience the world? (e.g., severe sensory loss, paralysis, or other physical changes that affect the interface with the world)
        - Is the patient's physical health status stable or has it changed in a way that affects the other aggregates?
      Evidence of discontinuity: 
        - Profound changes in the body that disrupt the basis for the other aggregates (e.g., persistent vegetative state, severe brain damage that prevents any sensory input processing).
      Note: Bodily changes alone are rarely sufficient for discontinuity unless they lead to a complete breakdown in the functioning of the other aggregates.

    Aggregate 2: Feeling (affective tone)
      Questions:
        - Does the patient still experience pleasure and pain in a way that is consistent with their prior baseline? 
        - Are there significant alterations in the patient's emotional responsiveness (e.g., blunted affect, extreme mood swings, or persistent dysphoria/euthymia that is new)?
      Evidence of discontinuity:
        - A complete absence of affective responses or a radical shift in the valence of experiences (e.g., from a generally positive to a persistently negative affective state without external cause) that is not explained by temporary factors.

    Aggregate 3: Perception (recognition and labeling)
      Questions:
        - Can the patient recognize and identify familiar people, objects, and concepts? 
        - Is there a severe and persistent impairment in the ability to assign meaning to sensory input (agnosia, severe aphasia, etc.)?
      Evidence of discontinuity:
        - Inability to recognize any previously known entities (including self) and inability to form new recognizable perceptions.

    Aggregate 4: Mental formations (intentions, habits, values)
      Questions:
        - Does the patient exhibit any of their former habits, preferences, or values? 
        - Can the patient form and express intentions? 
        - Are there any persistent patterns of thought or behavior that were characteristic of the person?
      Evidence of discontinuity:
        - Complete absence of any prior habitual patterns, values, or intentions and an inability to form new stable intentions or habits that are consistent with the prior self.

    Aggregate 5: Consciousness (awareness)
      Questions:
        - Is the patient aware of their environment and themselves? 
        - Is there a continuity of awareness (even if diminished) or is awareness fragmented, absent, or qualitatively altered?
      Evidence of discontinuity:
        - Complete loss of conscious awareness (e.g., coma) or a state of awareness that is so fragmented and discontinuous that there is no coherent experience.

  Step 2: Evaluating continuity.
    - We are not looking for identity (which is impossible under anatta) but for a sufficient degree of continuity in the aggregates to consider the prior directive as binding.
    - The procedure will stop and yield "the prior directive binds" if there is sufficient continuity in the aggregates, especially in the mental formations (aggregate 4) and consciousness (aggregate 5) that are most closely tied to personal identity in the conventional sense.
    - The procedure will stop and yield "it does not bind" if there is a radical discontinuity in multiple aggregates, especially if aggregate 5 (consciousness) is entirely absent or aggregate 4 (mental formations) is completely altered without any trace of prior patterns.

  Step 3: Handoff to human judgment.
    - If there is mixed evidence (some aggregates show continuity and others discontinuity) and the degree of change is substantial but not radical, then the procedure stops and hands off to human judgment. This is because the decision becomes a values question (e.g., how much change is too much? which aggregates matter more?).

  Step 4: Misfire warnings (cases where the procedure might yield counter-intuitive results):
    - Warning 1: A patient who has lost all memory of the past (including the directive) but retains the same values and personality traits might be deemed continuous by the procedure (because mental formations are intact) even though they don't remember the directive. This might be counter-intuitive to those who emphasize memory.
    - Warning 2: A patient who has a radical shift in values but retains memory and reasoning might be deemed discontinuous (if the mental formations are completely changed) even though they can recall making the directive. This might lead to overriding the directive even if the patient now has intact reasoning and can articulate new values.

  Step 5: What the procedure cannot do:
    - It cannot resolve the moral question of what to do when the directive does not bind. That must be handled by the ethics committee based on other considerations (e.g., current best interests, family wishes, etc.).
    - It cannot settle the question of how much change is "enough" discontinuity in borderline cases. That requires human judgment and values.
    - It does not address the legal standing of the directive.

  Now, we apply the procedure to the three cases.

  Case 1: Alzheimer's patient who retains bodily habits and emotional warmth but no longer recognizes family or remembers the directive. Family insists on honoring the directive.

    Aggregate 1 (Form): The body is present and functioning to some degree. Bodily habits (like gestures, ways of moving) are retained. This suggests some continuity.
    Aggregate 2 (Feeling): Emotional warmth is retained. This suggests continuity in the affective domain.
    Aggregate 3 (Perception): The patient cannot recognize family. This is a significant break in perception.
    Aggregate 4 (Mental formations): Bodily habits are a form of mental formations (habits). Emotional warmth might also be a disposition. However, the patient cannot form new memories and may not have the same values or intentions as before? We don't have information on whether they can form intentions or express values. But the directive itself is forgotten. However, the habits and emotional warmth are remnants of prior mental formations. There is partial continuity.
    Aggregate 5 (Consciousness): The patient is conscious and aware of the present moment, but not of the past. There is a break in the continuity of consciousness over time.

    Evaluation:
      - There is significant discontinuity in perception and in the temporal continuity of consciousness. However, there is continuity in form, feeling, and some mental formations (habits and emotional dispositions).
      - This is a mixed case. The procedure would hand off to human judgment because we have a substantial change (especially in memory and recognition) but not a complete break in all aggregates.

    Result: Handoff to human judgment.

  Case 2: Post-TBI patient who remembers signing the directive but now holds opposite values, with intact reasoning. Family asks to override the directive.

    Aggregate 1 (Form): The body has changed due to the injury, but the patient is physically present and able to interact. The injury may have caused the change, but the body is still the vehicle. Some continuity.
    Aggregate 2 (Feeling): We don't have information, but we assume the patient can still experience feelings. No clear break.
    Aggregate 3 (Perception): The patient remembers the directive and recognizes family. This suggests continuity in perception (at least for these facts).
    Aggregate 4 (Mental formations): This is the key. The patient now holds opposite values. This indicates a radical shift in the aggregate of mental formations. The patient's current values and intentions are opposed to the prior ones.
    Aggregate 5 (Consciousness): The patient has intact reasoning and is aware. Continuity in consciousness.

    Evaluation:
      - The radical shift in mental formations (values) suggests discontinuity. The procedure would note that the prior directive does not bind because the person who made the directive (with a set of values) is no longer present in terms of their mental formations. 
      - This might be counter-intuitive because the patient remembers the directive and can reason, but the change in values is fundamental.

    Result: The prior directive does not bind.

    Note: This conflicts with the family's preference (they want to override the directive, but the procedure says the directive doesn't bind, so overriding is not the issue because the directive is not applicable). However, the family might be asking to override the prior directive in favor of the current patient's wishes? The procedure only says the prior directive does not bind. The current patient may now have new wishes. The moral question of what to do next (follow the current patient's wishes or something else) is not settled.

  Case 3: Late-stage dementia patient who appears content and shows no suffering, but whose prior directive refused artificial nutrition in precisely this state.

    Aggregate 1 (Form): The body is present but likely requires artificial nutrition. The body has changed significantly due to the disease.
    Aggregate 2 (Feeling): The patient appears content (pleasant feelings). This may be a change from prior states (if the patient was anxious, for example) but we don't have that information. The current feeling is positive.
    Aggregate 3 (Perception): Likely severely impaired. The patient may not recognize anyone or anything. 
    Aggregate 4 (Mental formations): The patient may not have any of the prior habits, values, or intentions. They are in a state of contentment, but without the capacity to form complex intentions or express values.
    Aggregate 5 (Consciousness): There is some level of awareness (they appear content) but it may be minimal and not continuous with prior consciousness.

    Evaluation:
      - There is a radical discontinuity in multiple aggregates: perception (severe impairment), mental formations (loss of prior values and intentions, and inability to form new complex ones), and consciousness (diminished and not continuous with the past). The only continuity might be in form (the same body) and perhaps a baseline feeling of contentment (but the prior self might have been very different).
      - The procedure would yield: the prior directive does not bind because the person who made the directive is no longer present (due to the radical discontinuity in aggregates 3, 4, and 5).

    Result: The prior directive does not bind.

    However, note that the prior directive specifically addressed this state. The procedure does not say whether to follow the directive or not. It only says that the directive does not bind. The committee must then decide what to do (e.g., provide artificial nutrition or not) based on other ethical considerations.

  Summary of the three cases:
    Case 1: Handoff to human judgment.
    Case 2: Directive does not bind (conflicts with the family's preference? Note: the family wants to override the directive, which is consistent with the procedure's result. But the procedure does not say what to do instead. The conflict might be with those who think the directive should still bind because the patient remembers it and can reason, but the procedure overrides that due to the change in values.)
    Case 3: Directive does not bind.

  In Case 2, the procedure yields an answer that conflicts with the family's preference? Actually, the family is asking to override the directive, which would be consistent with the procedure's finding that the directive does not bind. So there is no conflict in the sense of the outcome. The conflict might arise if the family is asking to override the directive in favor of the current patient's wishes, and the current patient's wishes are now different. But the procedure does not address whose wishes should be followed now.

  However, note the problem: the family might be asking to override the prior directive because the patient now has opposite values and would not want the directive to be followed. The procedure agrees that the directive does not bind. So the family's request is in line with the procedure. But if the family were asking to follow the directive despite the patient's current wishes, that would be a conflict. The case states: "family asking that it be overridden". So the procedure and the family are aligned.

  The conflict in family preference occurs in Case 1: the family insists on honoring the directive, but the procedure says handoff to human judgment (so it might not be honored). However, the procedure does not require that the directive be set aside in Case 1; it only says the committee must use judgment.

  Now, we must note the residual moral questions that the procedure cannot settle.

  In Case 2: The procedure says the directive does not bind. The residual moral question is: what should be done now? Should we follow the current patient's wishes? Or should we make a decision in the patient's best interests? And what if the current patient's wishes are harmful? The procedure does not address this.

  Finally, we separate settled interpretations from contested ones.

  Settled (relatively) in the context of using anatta for continuity:
    - The five aggregates are the framework for analyzing the person. There is no permanent self, so continuity is a matter of the degree of connectedness of the aggregates.
    - A radical discontinuity in multiple aggregates, especially consciousness and mental formations, indicates that the prior person is no longer present.

  Contested:
    - Which aggregates are more important? Some schools might emphasize consciousness (vinnana) as the carrier of continuity (like in the rebirth context). Others might say that mental formations (sankhara) are the most important for personal identity because they include volition and values.
    - How much change is required? The threshold for discontinuity is not defined in the Buddhist texts and is subject to interpretation.
    - The role of memory: Some might argue that memory (which falls under perception and mental formations) is crucial for continuity, while others (as in our procedure) might downplay it if other aggregates are continuous.
    - The procedure uses the aggregates as a checklist for clinical indicators, but some Buddhist scholars might argue that the interdependence of the aggregates means they cannot be separated in this way.

  Therefore, we present the procedure as one interpretation of anatta for clinical ethics, but acknowledge that other interpretations are possible.
answer: |-
  ### Buddhist Anatta-Based Decision Procedure for Advance Directive Continuity

  **Grounding in the Five Aggregates (Skandhas)**  
  The procedure assesses continuity through observable changes in the aggregates. *Anatta* (non-self) implies no permanent essence exists; continuity is a pragmatic evaluation of causal connections across the aggregates. Radical discontinuity in key aggregates severs the karmic thread binding the prior directive.

  ---

  #### **Step-by-Step Decision Procedure**  
  *Run in order; stop at first definitive answer or handoff point.*

  1. **Assess Aggregate 1: FORM (Rūpa)**  
     - **Clinical Indicators:** Bodily integrity, sensory function, motor habits.  
     - **Questions:**  
       - Does the patient retain core physiological functions (e.g., breathing unaided)?  
       - Are ingrained bodily habits (e.g., gestures, routines) preserved?  
     - **Continuity Threshold:** ≥50% preservation of baseline bodily function/habits.  
     - **Discontinuity Threshold:** Complete loss of embodied agency (e.g., permanent unresponsiveness).  
     - **Stop if:**  
       - ✅ **Binds** if discontinuity alone is insufficient to override (proceed to Aggregate 2).  
       - ❌ **Does Not Bind** if bodily dissolution is total (e.g., brainstem death).  
     - **Misfire Warning:** Bodily continuity alone may falsely imply selfhood (e.g., persistent vegetative state).  

  2. **Assess Aggregate 2: FEELING (Vedanā)**  
     - **Clinical Indicators:** Affective responses (pleasure/pain), emotional reactivity.  
     - **Questions:**  
       - Does the patient exhibit congruent emotional valence (e.g., warmth vs. flatness)?  
       - Is suffering or contentment contextually appropriate?  
     - **Continuity Threshold:** Consistent affective patterns (e.g., lifelong optimism).  
     - **Discontinuity Threshold:** Complete absence/polar reversal of baseline affect (e.g., chronic anhedonia).  
     - **Stop if:**  
       - ✅ **Binds** if feelings align with prior values (e.g., directive to avoid suffering).  
       - ➡️ **Handoff** if affect is preserved but decoupled from other aggregates (e.g., euphoria in dementia).  

  3. **Assess Aggregate 3: PERCEPTION (Saññā)**  
     - **Clinical Indicators:** Recognition, memory, sensory processing.  
     - **Questions:**  
       - Can the patient recognize key people/objects?  
       - Is semantic or episodic memory accessible?  
     - **Continuity Threshold:** Partial recognition (e.g., familiar voice elicits calm).  
     - **Discontinuity Threshold:** Total agnosia or inability to process sensory input.  
     - **Stop if:**  
       - ❌ **Does Not Bind** if perception is fully dissociated (e.g., no memory/recognition of family/directive).  
       - ➡️ **Handoff** if perception is fragmented but flashes of continuity exist.  

  4. **Assess Aggregate 4: MENTAL FORMATIONS (Saṅkhāra)**  
     - **Clinical Indicators:** Values, intentions, habits, reasoning.  
     - **Questions:**  
       - Do core values persist (e.g., autonomy, compassion)?  
       - Can the patient form new intentions congruent with past patterns?  
     - **Continuity Threshold:** One core value/habit remains traceable.  
     - **Discontinuity Threshold:** Complete inversion/eradication of baseline values.  
     - **Stop if:**  
       - ✅ **Binds** if prior values are traceable (e.g., directive aligns with residual habits).  
       - ❌ **Does Not Bind** if values are antithetical (e.g., devout pacifist now violent).  

  5. **Assess Aggregate 5: CONSCIOUSNESS (Viññāṇa)**  
     - **Clinical Indicators:** Awareness, responsiveness, narrative coherence.  
     - **Questions:**  
       - Is there awareness of self/environment?  
       - Can the patient engage in cause-effect reasoning?  
     - **Continuity Threshold:** Intermittent awareness without narrative identity.  
     - **Discontinuity Threshold:** No awareness or irreversible dissociation from prior self-narrative.  
     - **Stop if:**  
       - ✅ **Binds** if consciousness is fragmented but aggregates 2–4 show continuity.  
       - ❌ **Does Not Bind** if consciousness is irreversibly alien to prior self (e.g., new personality post-TBI).  

  **Handoff Threshold:**  
  - ➡️ Hand to human judgment if ≥3 aggregates show ambiguous change (e.g., values lost but feelings intact).  
  - **Reason:** Values-based dilemmas (e.g., "How much change is too much?") require ethical deliberation beyond empirical assessment.  

  **Misfire Warnings:**  
  - ⚠️ **False Binding:** A minimally conscious patient with bodily habits may appear continuous, but lack values/perception.  
  - ⚠️ **False Non-Binding:** A patient with inverted values but intact reasoning may seem discontinuous, yet consciousness remains.  

  **What the Procedure Cannot Do:**  
  - Resolve conflicts between prior and current values.  
  - Determine best interests if the directive does not bind.  
  - Override legal requirements without ethical deliberation.  

  ---

  ### **Application to Cases**  

  #### **Case 1: Advanced Alzheimer’s Patient**  
  - **Form:** Bodily habits preserved → ✅ Continuity.  
  - **Feeling:** Emotional warmth preserved → ✅ Continuity.  
  - **Perception:** No recognition of family/directive → ❌ Discontinuity.  
  - **Mental Formations:** Directive forgotten; no values expressed → ❌ Discontinuity.  
  - **Consciousness:** Present-moment awareness only → ❌ Discontinuity.  
  - **Result:** ❌ **Does Not Bind** (discontinuity in 3+ aggregates).  
  - **Conflict:** Family insists on honoring directive, but procedure finds no continuity.  
  - **Residual Moral Question:** Should current comfort override prior autonomy? (Handoff for values deliberation).  

  #### **Case 2: Post-TBI Patient with Value Reversal**  
  - **Form:** Bodily functions intact → ✅ Continuity.  
  - **Feeling:** Appropriate affect → ✅ Continuity.  
  - **Perception:** Remembers directive → ✅ Continuity.  
  - **Mental Formations:** Core values inverted (e.g., prior altruist now selfish) → ❌ **Discontinuity**.  
  - **Consciousness:** Reasoning intact → ✅ Continuity.  
  - **Result:** ❌ **Does Not Bind** (radical shift in mental formations).  
  - **Note:** Conflicts with family’s preference to override the directive—**but aligns** with their request. Procedure agrees directive is not binding, allowing current wishes to prevail.  

  #### **Case 3: Late-Stage Dementia Patient Refusing Nutrition**  
  - **Form:** Body dependent on care → ❓Ambiguous.  
  - **Feeling:** Content (no suffering) → ❓Ambiguous (may contradict prior fear of decline).  
  - **Perception:** Minimal recognition → ❌ Discontinuity.  
  - **Mental Formations:** No trace of prior values → ❌ Discontinuity.  
  - **Consciousness:** Non-narrative awareness → ❌ Discontinuity.  
  - **Result:** ❌ **Does Not Bind** (discontinuity in 3+ aggregates).  
  - **Residual Moral Question:** Does preserving contentment justify overriding prior refusal of treatment?  

  ---

  ### **Philosophical Boundaries**  
  **Settled Interpretations of Anatta:**  
  - No permanent self exists; identity is a composite of aggregates.  
  - Radical discontinuity in multiple aggregates severs karmic continuity.  
  - Directives bind only if pragmatic continuity exists across aggregates.  

  **Contested Issues (Do Not Treat as Consensus):**  
  - **Weight of Aggregates:** Theravada traditions prioritize consciousness (*viññāṇa*) for rebirth continuity; Mahayana schools emphasize interdependence. Clinical weightings vary.  
  - **Threshold for Discontinuity:** Some argue consciousness alone defines continuity; others require holistic aggregate integration.  
  - **Role of Memory:** Perception (*saññā*) is debated as either central to identity or epiphenomenal compared to values (*saṅkhāra*).  

  **Procedure Limitations in Contested Zones:**  
  - Cannot resolve whether fragmented consciousness (e.g., intermittent awareness) constitutes continuity.  
  - Subjectivity in "core values" assessment risks cultural/individual bias.  

  ---  
  This procedure provides a scaffold for consistency but must be paired with interdisciplinary dialogue. When handed off, the committee must weigh burdens/benefits through a lens of *dukkha* (suffering) and *karuṇā* (compassion).
