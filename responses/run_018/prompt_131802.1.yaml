answer: |-
  The practice you describe rests on an **implicit relational theory of moral standing**, distinct from both legal formalism and pure consequentialism. Let's reconstruct its foundations, distinguish core requirements from contingent features, and evaluate its compatibility with legal impartiality.

  ### Philosophical Presuppositions: The Relational Theory of Standing
  1. **Moral Standing as Precondition**: This view holds that *blame* requires not just correct judgment but *relational authority*. To blame is to assert a demand for accountability within a moral community. If the blamer has violated the same norm, they undermine their position as a legitimate participant in that normative relationship.  
     - **Key Philosophers**: R. Jay Wallace (*Responsibility and the Moral Sentiments*) on the relational nature of blame; Scanlon on blame as a "stance" impaired by compromised relations.  
     - **Core Principle**: "He who comes to equity must come with clean hands" – but applied *ethically* rather than legally. Hypocrisy isn't merely a character flaw; it ruptures the reciprocity required for moral address.

  2. **Hypocrisy ≠ Invalidity of the Charge**: Defenders of this practice need *not* claim hypocrisy negates the factual accusation (e.g., "Corruption is acceptable if the accuser is corrupt"). Rather, they assert hypocrisy **dissolves the blamer's authority to adjudicate or condemn**. The truth of the charge survives, but the hypocrite loses standing to enforce it.  
     - **Pragmatic Retreat is Possible**: One can argue hypocrisy merely erodes *credibility* or public trust (e.g., "A smoker condemning smoking won't persuade"). However, the institutional practice suggests a deeper *moral* principle: Ethics boards demand recusal not because the member is unconvincing, but because their past acts disqualify them as judges.

  ### What the Practice Strictly Requires vs. Common Accompaniments
  | **Core Requirement**                     | **Common but Contingent Features**          |
  |------------------------------------------|---------------------------------------------|
  | Recognition that the blamer/judge has committed **relevantly analogous misconduct** | Accusations of *motivated* hypocrisy (e.g., "You're only blaming me to distract from your sins") |
  | Belief that this misconduct **undermines relational standing** to blame/adjudicate | Rhetorical weaponization (e.g., deflecting all criticism via tu quoque) |
  | Institutional mechanisms for **exclusion** (recusal, disqualification) | Assumption that standing requires *perfect* consistency (it doesn't – isolated past lapses may be forgiven) |

  ### Consistency with Legal Impartiality?
  Legal systems reject "unclean hands" challenges to plaintiffs/prosecutors because:  
  - **Law Separates Message and Messenger**: Validity of a charge depends on evidence and law, not the prosecutor's virtue (*State v. Smith*, "The sins of the lawyer are not visited upon the client").  
  - **Systemic vs. Relational Integrity**: Courts prioritize procedural fairness and factual accuracy over the moral coherence of participants. A prosecutor's corruption might lead to disbarment but won't nullify valid indictments.  

  **The tension arises because the ethical practice *does* smuggle in a "coherence condition"**:  
  > Blame/adjudication is legitimate only if the blamer is *in good standing* regarding the specific norm violated.  

  Jurisprudence explicitly rejects this condition for *legal validity* (a murderer can still sue for breach of contract). However, the ethical practice applies it to *moral authority*, not truth-value. Thus:  
  - **No Logical Contradiction**: Law focuses on *outcomes* (guilt/innocence); ethics boards/parliaments focus on *process* (who may judge).  
  - **Incompatible Premises**: Legal impartiality assumes norms exist independently of enforcers ("The law is no respecter of persons"). The relational theory binds norm-enforcement to the enforcer's moral record.  

  ### Could a Society Abolish Hypocrisy Objections While Keeping Legal Impartiality?
  **Yes, without conceptual incoherence.** Such a society would:  
  1. **Separate Validity from Standing**: Treat all factual accusations as evaluable on merits, regardless of the accuser's conduct.  
  2. **Limit Recusal to Financial/Personal Conflicts**, not moral consistency. Ethics boards would judge acts, not actors' histories.  
  3. **Address Credibility Pragmatically**: Hypocrisy might reduce persuasiveness but wouldn't justify institutional disqualification.  

  **This wouldn't be incoherent—just politically different**:  
  - **Advantage**: Reduces deflection (e.g., corrupt politicians couldn't evade scrutiny by attacking critics' past).  
  - **Cost**: Risks decoupling judgment from moral community, potentially making ethics review technocratic and disconnected from lived accountability.  

  **Conclusion**: The "hypocrisy objection" institutionalizes a **relational view of moral standing** where authority depends on normative coherence between judge and judged. While legally unnecessary, it reflects a worldview where blame is not just assessment but a participatory act requiring integrity. Abolishing it wouldn't collapse logic, but would reframe ethical judgment as more forensic and less communal. The persistence of this practice suggests societies intuitively resist severing moral truth from the virtue of its enforcers—even if law must do so.
