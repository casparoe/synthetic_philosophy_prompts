prompt: |-
  As a novelist drafting a scene in which a philosophy professor administers a final examination to an upper-level practical-reason seminar, I need an exam question that asks whether honoring sunk costs is always irrational, but that resists answers that merely recite the standard fallacy. The prompt should inject a niche conceptual distinction—treating sunk costs not as inputs to expected utility but as constitutive constraints on diachronic agency—so that students must argue whether maintaining a failing project can be rational as an expression of narrative integrity rather than investment recovery, and whether such integrity can be defended without collapsing into mere psychological consistency. Please provide the exam question; a model answer of roughly 500 words divided across two successive parts; and a marking scheme divided across two parts that separates an A answer—which distinguishes constitutive reasons from instrumental ones and addresses the self-undermining risk—from a B answer that merely catalogs rational and irrational commitments. Deliver exactly five numbered items with no introduction or conclusion: item 1, the question; items 2 and 3, the model answer; items 4 and 5, the marking scheme.
