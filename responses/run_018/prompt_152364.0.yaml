  First, source-tracking (A). This feels most tractable—philosophers excel at conceptual analysis and cognitive scientists can map biases without fMRI. Papers on predictive processing or introspection illusions could be reanalyzed. If they found a robust model linking specific cognitive mechanisms to the "gap" intuition, that could directly help debunk false positives in AI reports. Three years is tight but doable for a pilot model. 

  Normative weight (B) is trickier. It's upstream but hinges on thorny meta-philosophy about evidence. A small team might get bogged down in circular debates (e.g., "Is intuition ever evidence?"). Still, if they could reframe it as "conditions under which gap-intuitions reliably track ontological gaps," that might bridge to applied concerns. But high risk of no consensus. 

  Export problem (C) is a trap here. While philosophically deep, it requires solving A and B first, and its answers (e.g., "solving meta-problem changes nothing") wouldn't help assess AI claims. Even a breakthrough here (like a formal proof) is unlikely in three years with this team. 

  *lightbulb* The unmentioned angle? Operationalizing intuitions for AI validation. That's where they'd get mileage—developing tests for synthetic agents based on gap-producing cognitive biases. Example: if humans perceive "hard gaps" when system X has property Y, use Y as a red flag for unreliable phenomenological reports. 

  Ranking: A > B > C, with A being the only safe bet. Flip-condition: If someone published a devastating critique of source-tracking models tomorrow, I'd pivot to B. But dead end? Definitely C for this team. 

