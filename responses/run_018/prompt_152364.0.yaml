  Hmm, their practical constraints are crucial here—a small team of philosophers and one cognitive scientist, no lab access, three-year timeline, with a concrete goal of informing artificial phenomenological reports. That immediately rules out neuro-heavy approaches. The "needle-moving" criterion for synthetic agents' claims about inner life suggests they care about actionable outputs for AI ethics/validation, not just theoretical debate. 

