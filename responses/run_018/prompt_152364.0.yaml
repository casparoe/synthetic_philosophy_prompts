answer: |-
  Based on your constraints (small philosophy-heavy team, 3 years, no labs, applied goal of evaluating artificial phenomenological reports), here's the prioritized ranking and rationale:

  **Ranking: 1 > 2 > 3**  
  *(1. Source-Tracking, 2. Normative Weight, 3. Export Problem)*  

  ### Defending the Order:
  1. **Source-Tracking (A) is Prime**  
     - **Tractability**: Perfect for philosophers/cogsci. Analyze existing empirical work (illusions, metacognition errors, predictive processing), linguistic quirks, or conceptual paradoxes. Requires no new data—just synthesis and modeling.  
     - **Upstream Impact**: Directly informs whether synthetic reports are *likely* generated by mechanisms triggering human-like "gap intuitions." E.g., if you identify cognitive biases causing "explanatory gap" feelings, you can test if AI architectures replicate those biases.  
     - **Outputs in 3 Years**: A computational model of gap-intuition generation (e.g., "This architecture feature X predicts gap-reporting in humans, thus similar AI reports may be illusory").  

  2. **Normative Weight (B) is Secondary but Critical**  
     - **Tractability**: Harder—requires meta-philosophy (e.g., debates on intuition as evidence) but no labs. Focus on *conditional claims*: *If* source-tracking shows gap-intuitions arise from cognitive bugs, *then* do they lose evidentiary weight?  
     - **Downstream Impact**: Determines whether debunking source-tracking *matters* for AI validation. If intuitions retain weight despite origins, AI reports remain epistemically thorny.  
     - **Outputs in 3 Years**: A framework for assigning confidence to synthetic reports based on source-tracking findings (e.g., "Bias Y reduces evidential value by factor Z").  

  3. **Export Problem (C) is a Distraction**  
     - **Tractability**: Pure philosophy with low resolution odds. Endless debates about "what solves consciousness."  
     - **Irrelevance to AI Goal**: Even if solving the meta-problem *doesn’t* dissolve the hard problem, you still need (A) and (B) to evaluate AI reports.  
     - **Dead End for You**: High effort, near-zero practical export for synthetic phenomenology.  

  ### Missing Lines to Consider:
  - **Operationalizing "Phenomenological Reports"**: How do we design tests for synthetic agents that avoid human cognitive biases? (Bridge between A and applied AI).  
  - **Cross-Architecture Comparisons**: Map cognitive features (e.g., recurrent processing, global workspace) to gap-reporting tendencies.  
  - **Simulation Arguments**: Could AIs *simulate* gap-intuitions without phenomenology? (Leverage source-tracking models).  

  ### Flip-Conditions:
  - **Prioritize B over A** if: A major paper proves gap-intuitions track a *reliable* ontological feature (e.g., "Information integration below threshold X never correlates with reports"). Unlikely, but would force normative urgency.  
  - **Drop C entirely** if: Consensus emerges that meta-problem solutions *can’t* resolve the hard problem (e.g., Chalmers doubles down). Already probable.  

  ### Dead Ends for Your Team:
  - **Neuroimaging-Free Source-Tracking**: Focus on behavioral/cognitive/linguistic proxies (e.g., analyzing "explanatory gap" discourse patterns).  
  - **Avoid**:  
    - Fancy neuroscience (no equipment).  
    - Grand unified theories of consciousness (too big for 3 years).  
    - Arguing about metaphysical primitives (e.g., panpsychism).  

  ### Where the Years Should Go:
  - **Year 1**: Hammer source-tracking. Catalog cognitive biases (e.g., introspective opacity, hyper-dualist cognition), build a taxonomy linking them to gap reports.  
  - **Year 2**: Develop testable models for how these biases generate intuitions. Simulate AI architectures that replicate these features.  
  - **Year 3**: Integrate with normative weight—create evaluation heuristics for AI reports based on Years 1–2.  

  **Bottom Line**: Your unique value is leveraging philosophy to **reverse-engineer gap intuitions** into AI validation tools. Source-tracking is the engine; normative weight is the steering. The export problem is a philosophical luxury you can’t afford.
