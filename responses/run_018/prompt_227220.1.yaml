          Round 5: 1/10000 -> we do four draws: suit, rank, coin flip, and then a 10-sided die? We don't have a die. Or we can do a fourth draw from a deck of 10 cards? Then 1/4 * 1/13 * 1/2 * 1/10 = 1/1040. Then set payoff to 1040*25 = 26,000? Then EV=25.

          But this is messy and the probabilities are not exactly what we wanted.

        So we stick to dice if possible.

    Implementation:

        We'll prepare:

          - Scoreboard (poster paper or whiteboard) with team names and columns for each round and total.
          - Score sheets for teams to record their choices (optional, but we collect their choices each round).
          - A coin and 10-sided die (or multiple if available).

        We'll run the 5 rounds as described.

    Debrief structure:

        1. How did you feel during the game? (Open discussion)
        2. What was your strategy? Did it change? Why?
        3. How did you feel in round 4 and 5 when the chance was so small?
        4. Show the expected values for each round. Ask: "If you were only concerned with the average outcome, what should you have chosen in each round?" (Answer: B every time)
        5. Why didn't you? (Discuss intuition: the chance was too small to bank on, the game is short so we might not get the long-run average, etc.)
        6. Connect to the real examples: lottery (small chance of big win, but most lose), asteroid (small chance of extinction, but if it happens the loss is huge), charity (small chance that your donation triggers a huge future impact). And Pascal's wager: tiny chance that God exists, but infinite reward for believing.
        7. Discuss the options for dealing with this:

            a) Cap the payoffs: Maybe 250,000 points isn't really 25,000 times as valuable as 10? (But in the game it is.) In real life, we might have diminishing returns.

            b) Discount tiny probabilities: Set a threshold below which we ignore probabilities? What threshold? And what if the event is catastrophic?

            c) Reject the numbers: The probabilities and payoffs might be speculative.

            d) Bite the bullet: Always follow the expected value. But that might lead to spending all our money on lottery tickets? (No, because the expected value of lottery tickets is negative in real life. But in our game it was positive.)

        8. Point out: in our game, the expected value was positive and known. In real life, it's often unknown or negative.

    Final note: The activity might not work perfectly the first time, but it should spark the intended tension. If it doesn't, we can adjust the payoffs or the probabilities for next time.

    We'll go with the dice version if possible, and if not, we'll use the card method with adjusted payoffs.

