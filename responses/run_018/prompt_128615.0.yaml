answer: |-
  ### Argumentative Moves Outline

  **Dr. Thorne’s Adaptationist Moves:**  
  1. **Functional asymmetry argument**: The moral/hedonic divergence is *strategically partitioned*—deontological framing stabilizes social perception (public signaling), while hyperbolic discounting optimizes private energy allocation.  
  2. **Comparative primatology support**: Chimpanzee reciprocal exchanges show similar commitment-device logic (e.g., grooming debts honored despite immediate costs), suggesting deep evolutionary roots.  
  3. **Predictive coding rebuttal**: Even if predictive architecture is exapted, its *differential deployment* (moral vs. hedonic) demonstrates selective refinement for social niche constraints.  

  **Dr. Kowalski’s Spandrels Moves:**  
  1. **Architectural incompatibility**: Affective forecasting (limbic-driven) and linguistic self-modeling (cortical) evolved under distinct pressures; forced integration *creates* the asymmetry as a processing artifact.  
  2. **Maladaptive evidence**: Suicidal altruism or pathological future-self dissociation show the system’s *dysfunctional extremes*, unlikely in optimized adaptations.  
  3. **Exaptation depth challenge**: Adaptationism cannot explain why *this specific conflict* (deontological/discounting) emerges—predictive coding’s error-minimization logic predicts such clashes when repurposed.  

  ---

  ### Formal Dialogue: "The Future-Self Paradox"  

  **Setting**: Philosophy of Science Colloquium, Q&A after keynote presentations.  

  **Dr. Aris Thorne** (leaning forward, gesturing precisely): Lena, your predictive coding model elegantly describes *how* moral and hedonic temporal representations clash. But it doesn’t explain *why* this asymmetry takes a *functionally coherent* form. Consider: deontological framing of future obligations is cross-culturally invariant in contexts of social scrutiny—marriage vows, inheritance rituals. This isn’t a random byproduct; it’s a commitment device honed by group selection. Hyperbolic discounting, conversely, governs solitary choices like snack consumption. The partition is adaptive.  

  **Dr. Lena Kowalski** (steepling fingers, calm): Aris, you presuppose functionality where constraint suffices. Why must moral rigidity target the *distant* future? If it were designed for reputation, shouldn’t it peak at socially observable timeframes (days/weeks), not decades? Yet it doesn’t—because linguistic self-projection *inherently* generates linear time. The asymmetry arises because affective systems, evolved for imminent rewards, can’t "speak" that language. Look at AI predictive systems: when we train them on both reinforcement learning (affective analog) and symbolic planning (linguistic analog), similar clashes emerge *without* selective pressure.  

  **Thorne** (nodding slowly): Fair—but your AI example proves my point. Those systems *can* be tuned to resolve clashes *if* fitness outcomes demand it. Humans haven’t because the asymmetry *works*. Comparative data shows this: in capuchins, future-food promises enforce cooperation, but individuals still discount personal foraging gains. Your "maladaptive extremes" argument ignores that adaptations have trade-offs. Suicide isn’t *designed*; it’s a failure mode of a system optimized for typical social payoffs.  

  **Kowalski** (raising a palm): "Tuned by selection"? Then why does the deontological mode often *undermine* coalition stability? Think of feuds: "I must punish your descendant in 2050 for this insult." That’s disastrously rigid! Predictive coding explains this better: narrative recursion amplifies small errors into moral absolutes. It’s not a bug in adaptation—it’s a *byproduct* of repurposing sensory-hierarchical error correction for ethics. The specific form—linear morals vs. hyperbolic hedonics—stems from how cortex and limbic systems compress time differently. Where’s the selection pressure *for* that conflict?  

  **Thorne** (smiling wryly): Conflict isn’t the target; *differential deployment* is. Social morals leverage narrative precision *because* vagueness invites cheating. Hedonics don’t require that. As for rigidity: yes, it risks feuds, but cultures develop dampeners (e.g., reconciliation rituals). That’s adaptation refining the spandrel! Your model just relocates the burden: why did predictive coding exapt *this particular asymmetry*? If it’s unavoidable, why don’t all recursive self-models show identical divergences? Octopuses have predictive brains but no such moral/hedonic split.  

  **Kowalski** (leaning in intently): Octopuses lack *narrative* recursion—precisely my point. The asymmetry emerges only when predictive coding handles linguistically structured selfhood. And it’s not "relocating burden"; it’s *shifting the explanandum*. You’re describing utility; I’m explaining origin. Take fMRI evidence: when people judge distant-future moral acts, it activates linguistic centers (Broca’s area), not just social cognition nodes. That’s architectural inheritance, not a social module. If it were adapted, why isn’t discounting suppressed in moral contexts? Yet in experiments, subjects call "future theft" immoral while underdiscounting its hedonic cost!  

  **Thorne** (spreading hands): Because suppressing discounting would be maladaptive! Moral judgment tracks *accountability*—will others *know*? Hedonics track private reward. The systems aren’t meant to align. That’s the design. Your neural data confirms partitioning: different circuits for different functions. Exaptation might initiate repurposing, but selection sculpts efficiency. Without that, why is the asymmetry so stable across ecologies?  

  **Kowalski** (softly): Stability isn’t proof of function. Physics constrains spandrels too. Until we simulate minds with alternate architectures, we can’t know if this asymmetry is inevitable—or just a frozen accident of how *our* prediction machinery exapted symbols. Perhaps the tension itself is a spandrel... or the price of human consciousness.  

  **Thorne** (thoughtfully): Then let’s agree on this: even if architecture initiates the divide, selection *maintains* it. But without your constraint, we’d have a different moral psychology.  

  **Kowalski** (nodding): And without your function, we’d lack testable hypotheses about its stability. Still—does selection explain the *quirkiness*, Aris? The dreams where we betray our future selves guilt-free?  

  **Thorne** (chuckling): Dreams! Now there’s a spandrel even I won’t claim is adaptive.  

  ---

  Verdict: The central tension lies in whether the moral/hedonic asymmetry reflects optimal functional differentiation maintained by selection or an inescapable cognitive constraint arising from repurposed prediction systems.
