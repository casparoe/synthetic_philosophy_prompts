prompt: |-
  You are a philosopher of biology specializing in evolutionary epistemology and conceptual analysis. Before composing your answer, briefly outline three argumentative moves for each side. Then write a formal dialogue between Dr. Aris Thorne, who defends a refined adaptationist account, and Dr. Lena Kowalski, who advances the Gould-Lewontin spandrels critique applied to a specific conceptual case.

  The case concerns the human tendency to apply strict deontological moral obligations to actions affecting one's distant future self, while simultaneously hyperbolically discounting the welfare of that same future self in economic and hedonic reasoning. Thorne argues that this asymmetry is an adaptation for long-term social reputation management and coalition stability: linear moral evaluation serves as a credible commitment device observable by others, whereas hyperbolic discounting governs private affective forecasting. Kowalski counters that the phenomenon is not a well-engineered adaptation but a spandrel arising when the brain's hierarchical predictive coding architecture—evolved primarily for sensory and motor prediction—was exapted for narrative language and recursive self-modeling. On her view, the moral future self is an architectural byproduct of forcing two incompatible temporal representations, affective and linguistic, into coherence, rather than a purpose-built feature.

  The dialogue should be genuinely adversarial yet respectful. Each character must respond directly to the other's specific points: Thorne should address Kowalski's claims about architectural byproducts and predictive coding rather than merely restating selectionist logic; Kowalski should address Thorne's comparative and commitment-device arguments rather than merely invoking warnings about Panglossian reasoning. They should discuss whether the asymmetry demonstrates functional design or structural constraint, what evidence from comparative primatology or artificial predictive systems might bear on the question, and whether treating the capacity as a spandrel genuinely explains its specific form or merely relocates the explanatory burden. Keep both voices equally rigorous, avoiding strawmen, and aim for the tone of a real philosophy of science seminar exchange.

  End with a one-sentence summary of the dialogue's central unresolved tension, placed on its own line at the very end and beginning with the word Verdict:
