  ### Taxonomy of Positions on Net Wild Animal Suffering from Habitat Destruction  
  **Root Claim:** "Large-scale habitat destruction produces a net reduction in wild animal suffering."  
  *(Splits on acceptance/rejection of this claim)*  

  #### Branch 1: **Accepts the root claim** (net reduction occurs)  
  &nbsp;&nbsp;■ **Node 1.1:** "The dominant affected populations are r-selected, so preventing births of individuals with high juvenile mortality reduces suffering more than any survivor distress."  
  &nbsp;&nbsp;&nbsp;&nbsp;■ **Node 1.1.1:** "Post-disturbance demographic compensation (e.g., increased reproduction in refugia) does **not** fully offset the welfare reduction from lower overall numbers."  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;■ **Node 1.1.1.1:** "Survivors displaced into sink habitats experience **no significant welfare drop** compared to the source habitat, or displacement is minimal."  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;● **Leaf:** Unnamed.  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;*Awkward commitment:* Must disregard welfare impacts on survivors if prevented future suffering (from never-existing r-selected juveniles) is deemed overwhelmingly dominant.  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;■ **Node 1.1.1.2:** "Survivors displaced into sink habitats experience **significant welfare reduction**, but prevention of future suffering still dominates net calculus."  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;● **Leaf:** Unnamed.  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;*Awkward commitment:* Requires accepting that each displaced survivor’s suffering is less bad than the cumulative suffering of the many prevented births, even if displacement causes severe individual harm.  

  &nbsp;&nbsp;■ **Node 1.2:** "The dominant affected populations are K-selected, so improved welfare of survivors (e.g., from reduced density) outweighs immediate mortality/displacement costs."  
  &nbsp;&nbsp;&nbsp;&nbsp;■ **Node 1.2.1:** "Post-disturbance mortality is **density-dependent**, and demographic compensation does **not** fully offset welfare gains from lower density."  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;■ **Node 1.2.1.1:** "Displaced survivors experience **no significant welfare drop** in sink habitats."  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;● **Leaf:** Unnamed.  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;*Awkward commitment:* Must assume density reduction improves survivor welfare drastically enough to outweigh all direct destruction-induced suffering (e.g., violent deaths).  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;■ **Node 1.2.1.2:** "Displaced survivors experience **significant welfare reduction** in sinks, but density-driven gains in remnants yield net reduction."  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;● **Leaf:** Unnamed.  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;*Awkward commitment:* Must argue that welfare gains for a few non-displaced individuals (e.g., from reduced competition) outweigh welfare losses for many displaced ones.  

  #### Branch 2: **Rejects the root claim** (net increase or ambiguous outcome)  
  &nbsp;&nbsp;■ **Node 2.1:** "Dominant populations are r-selected, and demographic compensation **fully offsets** welfare reduction by rapidly restoring pre-disturbance population/suffering levels."  
  &nbsp;&nbsp;&nbsp;&nbsp;● **Leaf:** Unnamed.  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;*Awkward commitment:* Must hold that r-selected populations rebound so completely that any suffering reduction is ephemeral, rendering habitat destruction net neutral or harmful.  
  &nbsp;&nbsp;■ **Node 2.2:** "Dominant populations are r-selected, but **immediate suffering and displacement costs** outweigh long-term birth-prevention benefits."  
  &nbsp;&nbsp;&nbsp;&nbsp;● **Leaf:** Unnamed.  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;*Awkward commitment:* Must prioritize acute suffering of dying/displaced individuals over the theoretical suffering of never-born future r-selected juveniles.  
  &nbsp;&nbsp;■ **Node 2.3:** "Dominant populations are K-selected, and **density-independent mortality** dominates post-disturbance (e.g., from ongoing degradation), preventing welfare gains from density reduction."  
  &nbsp;&nbsp;&nbsp;&nbsp;■ **Node 2.3.1:** "Demographic compensation does **not** occur, but survivor welfare improves too little to offset initial suffering."  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;● **Leaf:** Unnamed.  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;*Awkward commitment:* Must claim that even persistent population reduction fails to improve welfare for K-selected species if baseline conditions remain poor.  
  &nbsp;&nbsp;&nbsp;&nbsp;■ **Node 2.3.2:** "Demographic compensation **occurs**, increasing reproduction/survival in sinks and elevating net suffering above pre-disturbance levels."  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;● **Leaf:** Unnamed.  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;*Awkward commitment:* Requires accepting that short-term population decline can backfire by trapping more individuals in low-welfare sinks long-term.  
  &nbsp;&nbsp;■ **Node 2.4:** "**Source-sink welfare spillover** dominates: displacement into sinks causes such severe welfare loss that it overwhelms any benefits from population/density reduction, regardless of life-history strategy."  
  &nbsp;&nbsp;&nbsp;&nbsp;● **Leaf:** Unnamed.  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;*Awkward commitment:* Must hold that sink habitats are so universally detrimental that forced displacement alone makes destruction net harmful, even with fewer total animals.  

  ---

  ### Flagged Overlap  
  **Leaves under Node 2.3.1 and Node 2.4 cannot be cleanly separated** in cases where:  
  - A K-selected population experiences both (1) insufficient welfare improvement in remnants (Node 2.3.1) and (2) severe welfare loss from sink displacement (Node 2.4).  
  - **Overlap reason:** Node 2.4 is life-history-agnostic, while Node 2.3.1 is K-selected-specific; real-world scenarios often involve both factors, forcing arbitrary classification.  

  ---

  ### Unoccupied Logical Combination  
  **Combination:**  
  - Accepts root claim (net reduction).  
  - Dominant populations are r-selected.  
  - Demographic compensation **fully offsets** population reduction.  
  - Source-sink spillover is **severe** (welfare in sinks is far worse than source).  
  - **Net reduction still holds** because compensation occurs in high-welfare refugia (not sinks), improving per-capita welfare.  

  **Diagnosis:** Unoccupied because **unexplored**.  
  - Not incoherent: Logically possible if refugia are higher-quality than the destroyed habitat.  
  - Unattractive to typical positions: r-selected compensation usually occurs in degraded sinks, making welfare gains unlikely.  
  - Absent from literature: No major ethical framework explicitly argues this edge case.
