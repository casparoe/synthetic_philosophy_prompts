  First, considering the seminar context: graduate metaphysics students likely have prior exposure to disposition debates but may conflate positions. Including artificial/institutional cases prevents natural-system biases and exposes overlooked commitments. The taxonomy aims to reveal logical dependencies - particularly whether one can consistently uphold dispositional realism while accepting systematic interference in complex systems.

  For the decision tree structure, I'll start with the root commitment about unmanifested dispositions. The branch points need concrete scenarios:
  - For finking: an internal interrupter case like a robot arm with contact-triggered safety override
  - For masking: an institutional case like committee funding approval blocked by quorum rules
  - Composite dispositions: can systems possess dispositions finked/masked by subsystems?
  - Widespread masking: challenges to dispositional essentialism

  The leaf positions must include at least the six specified views. Each path must be traceable through Yes/No answers. I need to ensure questions are answerable without philosophical labels - e.g., "Does the robot lose its grasping ability when the override is installed?" rather than "Do you accept finking?"

  In mapping logical space, I'll identify all 16 possible answer combinations. The empty cells need diagnoses: incoherent (e.g., accepting bare dispositions but denying masked dispositions survive), unattractive (e.g., eliminativism only for artificial systems), or unexplored. I must flag where bare dispositionalism and mask-tolerant realism converge - likely in physical examples without composite cases.

  For seminar use, I'll emphasise presenting cases neutrally: describe the robot's safety mechanism without calling it "finking," present the committee quorum as procedural fact. Students should answer based on intuition before labelling positions.

  The main challenges will be: distinguishing mask-tolerant realism from bare dispositionalism without composite cases (requires the subsystem question), and preventing position-label guessing by making cases sufficiently novel. The institutional example helps here by being less philosophically familiar.
answer: |-
  ### Taxonomy of Dispositional Commitments: Decision Tree for Graduate Seminar

  **1. Purpose and Angle (148 words)**  
  This taxonomy structures a graduate metaphysics seminar by forcing participants to confront concrete implications of their views on dispositions, bypassing preferred labels. The inclusion of composite entities (institutions with veto rules) and artificial systems (robotic override circuits) reveals how commitments extend beyond simple physical objects, testing consistency and exposing hidden assumptions. By focusing on finking (internal interruption) and masking (blocking without property destruction), the tree probes whether dispositions can survive systematic interference in complex structures. It aims to map the logical space between realism and eliminativism, highlighting tensions like whether widespread masking in artificial systems undermines dispositional essentialism. Crucially, it identifies where positions collapse under pressure from engineered or collective cases that challenge reductionism.

  **2. The Decision Tree**  
  *Nodes phrased as concrete yes/no questions:*  

  **Root:** "Can a property like 'fragility' exist in an unbroken vase that never shatters?"  
  - **Yes** → Proceed to Q1.  
  - **No** → **Leaf: Anti-Realist Eliminativism** (Dispositions are redundant; only categorical bases exist).  

  **Q1 (Finking):** "A robotic arm is programmed to grasp objects when near them (*grasping disposition*). It has an internal safety circuit that instantly deactivates grasping motors upon contact (*internal interrupter*). If the arm approaches but never touches an object, did it *lose* the grasping disposition when the circuit was installed?"  
  - **Yes** → Proceed to Q3.  
  - **No** → Proceed to Q2.  

  **Q2 (Masking):** "A university committee has rules stating it *approves funding* for worthy projects (*approval disposition*). Its charter also imposes a mandatory quorum: if fewer than 10 members attend, no vote occurs (*external blocker*). When only 9 attend, preventing approval of a worthy project, is the approval disposition *removed* or merely *suppressed*?"  
  - **Removed** → **Leaf: Bare Dispositional Realism** (Dispositions are irreducible properties destroyed by finks or masks).  
  - **Suppressed** → Proceed to Q4.  

  **Q3 (Composite Dispositions):** "Can the robotic arm (from Q1) *itself* possess a genuine *grasping disposition*, even if this is systematically interrupted by *its own* safety circuit?"  
  - **Yes** → Proceed to Q4.  
  - **No** → **Leaf: Reductionism** (Composite dispositions are reducible to parts; interrupted dispositions aren’t real).  

  **Q4 (Widespread Masking):** "If masking (as in the committee case) is common in *both* natural systems (e.g., waterproof seeds) *and* artificial ones (e.g., circuit breakers), can properties like solubility or fragility still be *essentially* dispositional?"  
  - **Yes** → **Leaf: Mask-Tolerant Dispositional Realism** (Dispositions survive masking but are defeated by finking).  
  - **No** → **Leaf: Hybrid Realism** (Dispositions exist only where finking/masking aren’t structurally guaranteed).  

  **Q1 Alternate Path (if Q1=No):** "Can the committee (from Q2) *itself* possess a genuine *approval disposition*, even if this is systematically masked by *its own* quorum rule?"  
  - **Yes** → **Leaf: Collective Dispositionalism** (Composites have irreducible dispositions unaffected by part-level interference).  
  - **No** → **Leaf: Anti-Realist Eliminativism** (Dispositions are redundant; only categorical bases exist).  

  *Leaf Summary:*  
  - **Anti-Realist Eliminativism:** Dispositions are analysable away; only non-dispositional properties exist.  
  - **Bare Dispositional Realism:** Dispositions are fundamental, intrinsic properties destroyed by finks/masks.  
  - **Mask-Tolerant Dispositional Realism:** Dispositions survive masking but are extinguished by finking.  
  - **Collective Dispositionalism:** Composite entities have irreducible dispositions, immune to part-level interference.  
  - **Reductionism:** Composite dispositions reduce to parts; interrupted dispositions aren’t genuine.  
  - **Hybrid Realism:** Dispositions exist contingently where interference isn’t guaranteed.  

  **3. Logical Space Mapping**  
  *Combinations based on answers to Root, Q1, Q2/Q3, Q4 (16 possible paths):*  

  | Root | Q1 (Fink) | Q2 (Mask) / Q3 (Composite) | Q4 (Essentialism) | Occupied? | Position                     | Empty Diagnosis |
  |------|-----------|-----------------------------|-------------------|-----------|------------------------------|----------------|
  | No   | –         | –                           | –                 | Yes       | Anti-Realist Eliminativism   | – |
  | Yes  | Yes       | Removed                     | –                 | –         | *Incoherent*                 | Denying masks survive while accepting unmanifested dispositions contradicts bare realism. |
  | Yes  | Yes       | Suppressed                  | –                 | –         | *Unoccupied*                 | Unattractive: Accepts masks survive but skips composite test; unstable. |
  | Yes  | Yes       | –           | Yes               | –         | *Incoherent*                 | Q3=No (composite dispo denied) + Q4=Yes (essentialism) conflicts. |
  | Yes  | Yes       | –           | No                | Yes       | Reductionism                 | – |
  | Yes  | No        | Removed                     | –                 | Yes       | Bare Dispositional Realism   | – |
  | Yes  | No        | Suppressed                  | Yes               | Yes       | Mask-Tolerant Realism        | – |
  | Yes  | No        | Suppressed                  | No                | Yes       | Hybrid Realism               | – |
  | Yes  | No        | –           | –                 | Yes       | Collective Dispositionalism  | – |
  | *Other Combinations* | | | | **No** | | **Unexplored** (e.g., Root=Yes + Q1=No + Q2=Removed + Q4=No: Masking destroys dispositions but composites have them). |

  **4. Unresolvable Pairs and Limits (198 words)**  
  The tree cannot distinguish **Bare Dispositionalism** and **Mask-Tolerant Realism** in standard *physical* cases (e.g., a fragile glass with external padding). Both answer identically to Q1 (finking removes disposition) and Q2 (masking removes disposition). Their divergence appears *only* in the composite/artificial cases:  
  - Bare Realism answers Q3 (composite disposition) with **No** (the robotic arm lacks a genuine grasping disposition if its safety circuit interrupts it).  
  - Mask-Tolerant Realism answers Q3 with **Yes** (the arm retains the disposition, as masking is tolerable), then answers Q4 **Yes** (essentialism holds).  

  Similarly, **Collective Dispositionalism** and **Mask-Tolerant Realism** converge on answering Q2 (masking suppresses but doesn’t remove) and Q4 (essentialism holds). They split only on Q1:  
  - Collective Dispositionalism answers Q1 **No** (finking doesn’t remove the robotic arm’s disposition), leading to the institutional composite test.  
  - Mask-Tolerant Realism answers Q1 **Yes** (finking removes dispositions), bypassing the composite test until Q4.  

  The tree relies on composite/institutional cases to force these distinctions. Without them, Bare and Mask-Tolerant Realism appear identical, as both reject surviving finking.

  **5. Seminar Use Notes (98 words)**  
  Administer the tree orally or as a worksheet. **Present cases neutrally:**  
  - *Robotic Arm:* "This arm moves towards objects to grasp them. Its internal safety system instantly disables grasping upon contact. If it never touches an object, did adding the safety system remove its grasping ability?"  
  - *Committee:* "This committee must approve funding for valid projects. Its rules require 10 members for a vote. When only 9 attend, blocking approval, was the committee’s ability to approve removed or just blocked?"  
  Require yes/no or A/B answers. Reveal position labels *only* after all answers are recorded to avoid bias. Highlight where intuition clashes with preferred theories.
