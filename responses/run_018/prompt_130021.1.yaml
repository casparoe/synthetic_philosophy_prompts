prompt: |-
  I'm trying to locate the crux in my disagreement with a colleague about whether indirect normativity survives a particular restriction on idealization. On the view in question, rational norms are fixed not by direct evaluation of outcomes but by what a coherence-corrected idealized agent would endorse — except that the idealization is restricted to eliminating formal inconsistencies in one's preference ordering and is barred from incorporating new empirical information or revising basic evaluative weights. My credence that this restricted indirect view still yields norms that systematically diverge from direct first-order evaluation is about 0.35; my colleague's is about 0.75. Give me your own number, decomposed into: (i) the probability that coherence-fixing alone can reorder preferences in action-relevant ways; (ii) the probability that such reorderings, if they occur, carry genuine normative authority rather than being formal artifacts; (iii) the probability that direct evaluation is already unstable without coherence constraints, making any divergence spurious; and (iv) one further factor you think belongs. For each, provide a rough value and a one-line justification, show the combination, identify which term you are least confident in and what formal example or argument would most shift it, and say which sub-question best explains the gap between 0.35 and 0.75.
