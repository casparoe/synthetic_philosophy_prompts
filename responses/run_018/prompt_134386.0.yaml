  Finally, interference vs. maintenance. Consider an AI "maintaining" a forest by replacing it with plastic replicas - physically identical but ecologically dead. Whether this counts as interference hinges entirely on whether we value ecosystem functions over mere appearance. No description-neutral definition exists.

