  ### Decision Tree: Moral Reason for Individual Action in Collective Harms

  **Root Node:**  
  *"Can we assign a definite share of the total harm (e.g., animal suffering from meat demand, climate damage from emissions, or election outcomes) to each individual's action?"*  
  - **No** → Go to **Non-Decomposable Harms**  
  - **Yes** → Go to **Harm Structure Branch**  

  ---

  #### **Branch 1: Non-Decomposable Harms**  
  *Harms cannot be divided into individual shares (e.g., climate change as a systemic injustice or factory farming as an emergent practice).*  
  → *"Does participating in the practice (e.g., buying factory-farmed meat) make one complicit in the harm, even if no single action changes outcomes?"*  
  - **Yes** → **Leaf 1: Practice-Based Solidarity**  
    - **Domain**: Meat consumption  
    - **Core claim**: Abstaining is obligatory because participation implicates you in collective wrongdoing, regardless of causal impact.  
    - **Awkward commitment**: You are blameworthy even if the system would persist identically without you (e.g., farm subsidies ensure demand is irrelevant).  
  - **No** → *"Does your role (e.g., 'global citizen') require action to oppose structural injustice?"*  
    - **Yes** → **Leaf 2: Role-Obligation (Unnamed)**  
      - **Domain**: Climate change  
      - **Core claim**: Roles demand reducing carbon footprints as symbolic alignment with justice, even if emissions aren't traceable to specific harms.  
      - **Awkward commitment**: You must treat trivial emissions cuts as morally urgent despite being causally irrelevant (e.g., refusing a solo flight while global aviation grows).  

  ---

  #### **Branch 2: Harm Structure (Decomposable Harms)**  
  → *"How do individual actions combine to cause harm?"*  
  - **Continuous Aggregation** (e.g., each unit of carbon/meat adds imperceptibly to harm) → Go to **Continuous Branch**  
  - **Threshold Aggregation** (e.g., crossing a climate tipping point) → Go to **Threshold Branch**  
  - **Winner-Take-All** (e.g., only pivotal votes change outcomes) → Go to **Winner-Take-All Branch**  

  ##### **Sub-Branch 2.1: Continuous Aggregation**  
  *Each action adds marginally (e.g., one gasoline purchase among billions).*  
  → *"Is the moral reason grounded in your action's expected harm (even if tiny)?"*  
  - **Yes** → **Leaf 3: Expected-Utility Aggregation**  
    - **Domain**: Climate change  
    - **Core claim**: Imperceptible expected harm (e.g., 1-in-a-billion chance of triggering a storm) justifies reducing consumption.  
    - **Awkward commitment**: Every micro-choice (e.g., a single car trip) becomes morally fraught, demanding constant scrutiny.  
  - **No** → *"Is it grounded in participation enabling an unjust practice?"*  
    - **Yes** → **Leaf 4: Participatory Complicity (Unnamed)**  
      - **Domain**: Meat consumption  
      - **Core claim**: Buying meat supports a cruel system, making you complicit even if your purchase doesn't affect total production.  
      - **Awkward commitment**: You share blame for all farm suffering even if boycotts fail (e.g., when meat is wasted or exported).  

  ##### **Sub-Branch 2.2: Threshold Aggregation**  
  *Harm occurs if a critical boundary is crossed (e.g., CO₂ exceeding 450ppm).*  
  → *"Is the moral reason grounded in the chance your action could tip the scale?"*  
  - **Yes** → **Leaf 5: Threshold-Sensitive Expected Utility**  
    - **Domain**: Climate change (tipping points)  
    - **Core claim**: Near thresholds, actions have high expected harm (e.g., your emissions might trigger collapse), demanding abstinence.  
    - **Awkward commitment**: Far from thresholds, emissions have near-zero moral weight (e.g., flying is fine if the planet is 0.1°C below doom).  
  - **No** → *"Is it grounded in enabling a practice risking catastrophe?"*  
    - **Yes** → **Leaf 6: Complicity in Threshold Risk (Unnamed)**  
      - **Domain**: Climate change  
      - **Core claim**: Participating in high-carbon life makes you responsible for risking threshold breaches, regardless of proximity.  
      - **Awkward commitment**: All emissions are equally blameworthy (e.g., idling your car = billionaires’ jets) since all add to cumulative risk.  

  ##### **Sub-Branch 2.3: Winner-Take-All**  
  *Only pivotal actions matter (e.g., voting in large elections).*  
  → *"Is the moral reason grounded in your action being pivotal?"*  
  - **Yes** → **Leaf 7: Act-Consequentialist Rejection**  
    - **Domain**: Voting  
    - **Core claim**: Voting is irrational if non-pivotal (e.g., in safe districts) since it wastes effort for no benefit.  
    - **Awkward commitment**: You should free-ride: abstain but hope others vote your preference.  
  - **No** → *"Is it grounded in your role (e.g., 'citizen') requiring participation?"*  
    - **Yes** → **Leaf 8: Role-Obligation**  
      - **Domain**: Voting  
      - **Core claim**: Civic duty demands voting as a ritual of democracy, even if your vote never affects outcomes.  
      - **Awkward commitment**: Voting in landslides is purely symbolic (e.g., a GOP vote in California wastes time but is "required").  
    - **No** → *"Is it grounded in complicity for electoral outcomes?"*  
      - **→ EMPTY BRANCH**  

  ---

  ### Empty Branch Diagnosis  
  **Combination**: Winner-take-all + Participatory complicity.  
  **Diagnosis**: *Incoherent*. Complicity requires contributing to harm, but non-pivotal actions (e.g., a non-tiebreaking vote) cause no harm in winner-take-all structures. Blaming non-pivotal voters for outcomes they didn’t influence is logically inconsistent.  

  ### Key  
  - **Domains covered**: Climate change (Leaves 2, 3, 5, 6), meat (Leaves 1, 4), voting (Leaves 7, 8).  
  - **Total leaves**: 8 (7 named, 1 empty).  
  - **Tree structure**: Root → 2 main branches → 3 harm types → 3 obligation sources (with pruning for coherence).
