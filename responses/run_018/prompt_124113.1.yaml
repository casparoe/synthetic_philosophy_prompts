  2. **Intuitive Problem**: Paying feels irrational. The probability is so low that it seems like the mugger is almost certainly bluffing. Moreover, if you pay once, you're vulnerable to a flood of copycat muggings that would drain your resources.

  3. **EU Calculation**: Under standard EU with unbounded utility, for any fixed p>0, there exists a finite N such that the EU of paying exceeds the EU of not paying (which is 0). Thus, EU maximizers must pay for sufficiently large N.

  4. **Dominance Reasoning**: Critics argue that paying is a dominated strategy. If we consider the entire class of similar mugging scenarios, a strategy of never paying avoids certain losses and only misses out on gains that are so improbable they're not worth considering. Moreover, in repeated settings, paying leads to bankruptcy almost surely.

  5. **Divergence Point**: The camps split on whether the EU calculation (which says "pay") or dominance reasoning (which says "don't pay") should prevail. This hinges on deeper disagreements about the foundations of rational choice.

