prompt: |-
  I'm on the ethics review board for our county correctional services and we just adopted this strange dual-track review policy that I now have to run on every sanction proposal that hits my desk. The idea is that each proposed punishment or mandatory intervention has to survive two seperate screens: first a Dennett-style compatibilist desert check—did the offender actually exercise the kind of rational self-control and reflective agency that makes them genuinely answerable for this act, or was it closer to a compulsive breakdown they couldn't steer?—and then a Caruso-style skeptical audit, which holds that nobody ultimately deserves suffering in a deep metaphysical sense, so any punitive or burdensome element in the proposal has to be strictly necessary for public safety, rehabilitation, or victim restoration, and can never be justified just as retributive payback. We recieve about ten to fifteen files every Tuesday and Thursday, we've got maybe twenty minutes per case, and the board is mostly lawyers and community advocates with zero philosophy training, so I need this turned into an actual proceedure: a step-by-step checklist or flowchart in words, with the questions asked in order, what counts as a sufficient yes/no/unclear answer, where the flow stops with approval, where it stops with rejection, and exactly which nodes are values judgments that have to be kicked to a human rather than decided by the rules.

  Be honest about where the two tracks conflict—like if someone clearly had full rational control but the only available sanction is mostly symbolic punishment—and say what the proceedure simply can't resolve. Then run it on three real proposals: (1) six months of geofenced electronic monitoring plus mandatory cognitive-behavioral therapy modules for a first-time fraud offender who was in a severe gambling-addiction spiral; (2) a five-year prison term extension for a violent offender who refuses all rehabilitation programs and seems to actively enjoy provoking staff; and (3) fifty hours of restorative labor assigned to a vandal who caused serious property damage but turned themselves in within hours and already paid full restitution. I want at least one of these to come out in a way I'll personally dislike—probably the prison extension case—so I can see where the proceedure forces an ugly answer. Also spell out the constraints: we can't search external literature, we have no clinical psychologist on staff, and we have to sign off in writing. Don't cite anyone, don't ask me to read Dennett or Caruso, just build the operational tool.
reasoning: |-
  We are building a dual-track review procedure for sanction proposals. The two tracks are:
  1. Dennett-style compatibilist desert check: Focuses on whether the offender exercised rational self-control and reflective agency at the time of the offense. We are asking: did they have the kind of control that makes them genuinely answerable?
  2. Caruso-style skeptical audit: Regardless of desert, any punitive or burdensome element must be strictly necessary for public safety, rehabilitation, or victim restoration. It cannot be justified solely as retributive payback.

  The procedure must be a step-by-step checklist or flowchart that can be applied in about 20 minutes per case by non-philosophers. We have to specify:
  - The order of questions.
  - What counts as sufficient yes/no/unclear.
  - Where the flow stops with approval or rejection.
  - Which nodes are value judgments that must be kicked to a human.

  We must also be honest about conflicts between the tracks and where the procedure cannot resolve.

  Constraints: 
  - No external literature search.
  - No clinical psychologist on staff (so we can only use the information in the file).
  - Must sign off in writing.

  We'll then apply the procedure to three cases.

  ---

  **Proposed Dual-Track Review Procedure**

  **Step 1: Initial Triage**
  - Check if the proposed sanction involves any punitive or burdensome element (e.g., loss of liberty, mandatory program, labor, etc.). 
    - If no, then the proposal is automatically approved (since there's nothing to audit) — but note: this is highly unlikely because sanctions by definition have a burdensome element.
    - If yes, proceed to Step 2.

  **Step 2: Dennett-Style Compatibilist Desert Check (Track 1)**
  - **Question 1:** Based on the information in the file, did the offender have the capacity for rational self-control and reflective agency at the time of the offense? (That is, was the offender capable of understanding the consequences of their actions and making a choice?)
    - *What counts as sufficient?* 
      - **Yes:** If the file shows evidence of premeditation, clear motive, attempts to avoid detection, or if the offender has a history of similar offenses that were carried out with apparent control. Also, if the offender was not under extreme duress, intoxication (unless the intoxication was voluntary and the offender has a pattern of offenses while intoxicated), or in the midst of a mental health crisis that impaired their reasoning.
      - **No:** If the file indicates the offense occurred during a psychotic episode, severe addiction compulsion (where the offender was unable to resist due to the addiction), intellectual disability that impairs decision-making, or under severe coercion. Also, if there is evidence of a breakdown (e.g., a single impulsive act in an otherwise stable life with no prior history, and the context suggests overwhelming emotional distress that clouded judgment).
      - **Unclear:** If the information is ambiguous (e.g., conflicting reports, lack of information on mental state, or if there are factors that might have impaired control but without clear evidence).
  - **Question 2 (if answer to Q1 is Unclear):** Is there evidence that the offender had the capacity for rational self-control in similar situations in the past? (This is a tie-breaker for unclear cases.)
    - **Yes:** If the offender has a history of controlling similar impulses or making rational choices in comparable circumstances.
    - **No/Unclear:** If there is no such history or the history is negative.

  - **Outcome of Track 1:**
    - **Clear Yes:** Offender is deemed to have desert (i.e., they are answerable for the act). Proceed to Step 3 (Track 2).
    - **Clear No:** Offender is not answerable in the compatibilist sense. Skip Track 2 and go to Step 4 (bypassing the desert requirement, but the sanction must still pass the Caruso audit for necessity).
    - **Unclear after both questions:** This is a value judgment that must be kicked to a human. The board must decide by majority vote whether to treat the case as having desert or not. Then proceed based on that decision.

  **Step 3: Caruso-Style Skeptic Audit (Track 2)**
  - This step is required in all cases (if the sanction has a burdensome element) but note: if Track 1 was Clear No, then we skip the desert check and only do Track 2. If Track 1 was Clear Yes or decided as having desert, then we do Track 2 as well.

  - **Question 1:** Is the burdensome element of the proposed sanction strictly necessary for one or more of the following: public safety, rehabilitation, or victim restoration? 
    - *What counts as sufficient?*
      - **Yes:** If there is a clear and direct link between the sanction and one of these goals. For example:
          - Public safety: The offender poses a current threat that the sanction will mitigate (e.g., incapacitation, monitoring).
          - Rehabilitation: The sanction includes a program that is evidence-based (as per the file) to address the underlying cause of the offense and reduce recidivism.
          - Victim restoration: The sanction includes restitution or community service that directly repairs harm to the victim or community.
      - **No:** If the burdensome element appears to be purely punitive (e.g., added suffering without a clear safety, rehabilitative, or restorative purpose). Also, if there is a less burdensome alternative that would achieve the same goals but is not being used.
      - **Unclear:** If the link is tenuous or speculative.

  - **Question 2 (if answer to Q1 is No or Unclear):** Can the burdensome element be justified as a deterrent (general or specific) that is necessary to prevent future harm? (Note: Deterrence is a public safety goal. But we must be cautious: if the primary justification is deterrence, we must ask if it is necessary and if the level of burden is proportional to the deterrence goal.)
    - **Yes:** Only if there is evidence that the specific burden is likely to deter this offender or others in a way that significantly enhances public safety, and there is no less burdensome way to achieve the same level of deterrence.
    - **No:** If the deterrence rationale is speculative or if there are equally effective but less burdensome alternatives.

  - **Question 3 (if answer to Q1 is Unclear and Q2 is No or Unclear):** Is the burdensome element purely symbolic and not causing significant suffering? (This is a judgment call: if the burden is minimal and the symbolic value is important for victim/community healing, then it might be acceptable under restoration. But if it's purely retributive, it fails.)
    - **Yes:** If the burden is minimal (e.g., a small fine, a brief period of community service that doesn't disrupt the offender's life) and it serves a clear restorative purpose (e.g., the victim feels justice is done, community trust is restored). 
    - **No:** If the burden is more than minimal and/or purely for retribution.

  - **Outcome of Track 2:**
    - **Clear Yes:** The burdensome element is justified. Proceed to Step 4.
    - **Clear No:** The burdensome element is not justified. The proposal must be rejected or sent back for revision to remove the unjustified burden.
    - **Unclear after all questions:** This is a value judgment that must be kicked to a human. The board must vote on whether the burden is necessary. Then proceed.

  **Step 4: Final Decision Node**
  - If the case passed both tracks (or only Track 2 in the case of no desert) with Clear Yes, then the proposal is approved.
  - If the case failed either track (i.e., Track 1 was Clear No and Track 2 was Clear No, or Track 2 failed in a desert case, or the human decision in either track was negative), then the proposal is rejected.
  - If the case has unresolved unclear points that were kicked to the board and the board voted in a way that leads to approval, then approve. If the vote leads to rejection, then reject.

  **Conflicts and Limitations:**
  - Conflict Example: If Track 1 (desert) is Clear Yes (so the offender is answerable) but Track 2 finds that the burdensome element is not necessary for safety, rehabilitation, or restoration (and not justified by deterrence) and is purely retributive, then the proposal fails because it cannot be justified under Caruso. This might be the case for purely symbolic punishments that are more than minimal.
  - What the procedure cannot resolve: 
    - Cases where there is insufficient information to make a determination in either track (and the board cannot reach a majority vote).
    - Cases where the sanction has both necessary and unnecessary burdensome elements (then it must be revised to remove the unnecessary parts).
    - Cases where the board is split on a value judgment.

  ---

  **Application to the Three Cases:**

  **Case 1: Six months of geofenced electronic monitoring plus mandatory cognitive-behavioral therapy modules for a first-time fraud offender who was in a severe gambling-addiction spiral.**

  - **Step 1:** Triage: Yes, there are burdensome elements (monitoring and mandatory therapy).
  - **Step 2 (Track 1 - Desert):**
    - Q1: Did the offender have rational self-control? 
      - The offender was in a severe gambling-addiction spiral. This suggests a compulsive breakdown. However, fraud typically involves planning and deception, which might indicate some level of control. But the severe addiction might have impaired control. 
      - The file says "severe gambling-addiction spiral". Without a clinical psychologist, we must interpret: addiction can impair control. 
      - **Answer:** Unclear. (Because there's a conflict: fraud requires planning, but addiction may have overridden control.)
    - Q2 (since unclear): History? First-time offender. No prior history of similar offenses. This doesn't help. 
      - **Answer:** Still unclear. 
      - **Kick to human:** The board must vote on whether the offender had desert. Let's assume the board votes that the offender did not have full desert because of the severe addiction (compulsive element). So we treat as **No desert**.
  - **Step 3 (Track 2 - Necessity):** Since we have no desert, we do Track 2.
    - Q1: Is the burden necessary? 
      - Electronic monitoring: For public safety? It might prevent the offender from going to places where gambling occurs. Also, the therapy is for rehabilitation (to address the gambling addiction). 
      - Both elements seem necessary for rehabilitation and public safety (preventing future fraud). 
      - **Answer:** Yes.
    - So no need for Q2 or Q3. 
  - **Step 4:** Approved.

  **Case 2: A five-year prison term extension for a violent offender who refuses all rehabilitation programs and seems to actively enjoy provoking staff.**

  - **Step 1:** Triage: Yes, burdensome (prison extension).
  - **Step 2 (Track 1 - Desert):**
    - Q1: Did the offender have rational self-control? 
      - The offender is refusing programs and enjoying provoking staff. This suggests intentional and controlled behavior. The violence and provocations are likely deliberate and not due to a breakdown. 
      - **Answer:** Yes (desert is established).
  - **Step 3 (Track 2 - Necessity):**
    - Q1: Is the prison extension strictly necessary for public safety, rehabilitation, or victim restoration? 
      - Public safety: The extension is because the offender is violent and uncooperative. If the current term is ending, then extending might be for public safety (incapacitation). 
      - Rehabilitation: The offender refuses programs, so the extension doesn't seem aimed at rehabilitation. 
      - Victim restoration: Not mentioned, so probably not.
      - So the primary justification seems to be public safety (incapacitation). 
      - **Answer:** Yes (if we accept that the extension is necessary to protect the public from a violent individual who remains dangerous). 
      - But note: we must consider if there is a less burdensome alternative? The file says the offender refuses rehabilitation, so without rehabilitation, is there an alternative to incapacitation? Probably not. 
      - However, the file says the offender "seems to actively enjoy provoking staff". This might be used to argue for continued danger. 
      - **Answer:** Yes (necessary for public safety). 
    - So no need for further questions. 
  - **Step 4:** Approved.

  But note: the user expects this to be an ugly outcome. However, under the procedure, it passes because the extension is justified by public safety. But let's check if there is a conflict:

  - The desert track is passed (yes, the offender is responsible). 
  - The necessity track: the prison extension is for incapacitation (public safety). 

  However, if the board believes that the extension is primarily retributive (because the offender is annoying and the staff wants to punish him) then it might fail. But the file doesn't say that. It says the offender is violent and refuses rehabilitation, which suggests danger. 

  But the user might dislike this because it's a long extension and the offender might be mentally ill (though the file doesn't say). But without evidence of lack of control, the desert is clear. And the necessity is clear for public safety. 

  So the procedure forces approval.

  **Case 3: Fifty hours of restorative labor assigned to a vandal who caused serious property damage but turned themselves in within hours and already paid full restitution.**

  - **Step 1:** Triage: Yes, burdensome (labor).
  - **Step 2 (Track 1 - Desert):**
    - Q1: Did the offender have rational self-control? 
      - Vandalism is often impulsive, but the offender turned themselves in, which shows reflection. The file doesn't indicate any impairment (like addiction or mental illness). 
      - **Answer:** Yes (desert established).
  - **Step 3 (Track 2 - Necessity):**
    - Q1: Is the labor strictly necessary? 
      - Public safety: Vandalism is a property crime and the offender turned themselves in, so they might not be a continuing threat. 
      - Rehabilitation: The labor is "restorative", so it might help the offender understand the harm. But the offender already paid restitution and turned themselves in, which shows remorse. Is the labor necessary for rehabilitation? It might be, but it's not clear if it's strictly necessary. 
      - Victim restoration: The victim has already been paid. The labor might be for the community (if it's community service). But the victim is already made whole. 
      - So the primary justification might be rehabilitation or symbolic restoration. 
      - **Answer:** Unclear (because it's not strictly necessary for safety or restoration, and rehabilitation might be achieved without it?).
    - Q2: Can it be justified as a deterrent? 
      - For a first-time offender who turned themselves in and paid restitution, is 50 hours of labor necessary to deter future vandalism? It might be, but it's speculative. 
      - **Answer:** Unclear (or maybe no, because the offender seems remorseful and the restitution is paid).
    - Q3: Is the burden minimal and symbolic? 
      - 50 hours of labor is not trivial, but it might be considered moderate. If it's community service that doesn't cause significant suffering, and it serves a symbolic purpose (community sees the offender making amends), then it might be acceptable. 
      - But note: if the primary purpose is symbolic and not retributive, then it might be acceptable. However, if the labor is purely retributive (to make the offender suffer because they deserve it) then it fails. 
      - The file says "restorative labor". We assume it's designed for restoration. 
      - **Answer:** Yes (if we consider it minimal enough and serving a restorative purpose for the community). 
      - But note: the victim is already restored. So the community restoration might be the goal. 
      - **Answer:** Yes (it passes as minimal and restorative). 
    - **Outcome of Track 2:** Clear Yes (via Q3).
  - **Step 4:** Approved.

  But note: if the board thought 50 hours was more than minimal, they might have voted no in Q3. But in the procedure, we assume it passes.

  ---

  **Final Note:** The procedure forces the board to think in terms of control and necessity. It might lead to outcomes that feel too lenient (like in Case 2, where a violent offender gets an extension that feels retributive but is justified by safety) or too harsh (if in Case 3 the labor is deemed unnecessary). But the procedure is designed to minimize retribution and focus on control and necessity.

  In Case 2, even if the user dislikes the approval, the procedure requires it because of public safety. However, if the board believes that the extension is not necessary (e.g., if the offender is not actually dangerous beyond the original term) then they could answer "No" in Track 2. But the file says the offender is violent and refuses rehabilitation, which suggests ongoing danger.

  We must remember that the board has only 20 minutes and the file information. They must make judgments based on what's written.

  The procedure: 
  - Triages for burdens.
  - Checks desert (with a human vote if unclear).
  - Checks necessity (with a human vote if unclear).
  - Approves only if the burden is justified by necessity (and in desert cases, the offender is responsible).

  It rejects if:
  - The burden is not necessary (even if the offender has desert) OR
  - The offender has no desert and the burden is not necessary for safety, rehabilitation, or restoration.

  It cannot resolve if the board cannot decide on unclear points.
answer: |-
  Here's a step-by-step operational procedure for the dual-track review, designed for non-philosophers to complete in under 20 minutes per case. It uses a flowchart-style checklist with clear decision nodes, thresholds for answers, and handling of conflicts. The procedure prioritizes efficiency and auditable documentation.

  ---

  ### **Dual-Track Review Procedure**  
  **Purpose:** Approve only sanctions that pass both (1) a desert check (did the offender have rational control?) and (2) a necessity audit (is the burden essential for safety/rehabilitation/restoration, not retribution?).  

  #### **Tools Provided to Reviewers**  
  - Case file (all information must come from this).  
  - Timers (20 minutes max per case).  
  - Voting tokens for unresolved judgments (board votes by majority).  
  - Digital form with checkboxes for documentation.  

  #### **Step 0: Pre-Screen (1 minute)**  
  - **Question:** Does the proposal contain any **punitive or burdensome element**? (e.g., loss of liberty, forced labor, mandatory therapy, extended confinement, financial penalty).  
    - **Yes** → Proceed to **Track 1 (Desert Check)**.  
    - **No** → **APPROVE IMMEDIATELY** (nothing to audit).  
    - *Note: 99% of sanctions will start here.*  

  ---

  ### **TRACK 1: Desert Check (Dennett-Style Compatibilism)**  
  *(Focus: Was the offender capable of rational self-control during the act?)*  
  **Time Allotment:** 7 minutes max.  
  **Goal:** Determine if the offender is "answerable" for their actions.  

  1. **Question 1:** Based solely on the case file, did the offender **demonstrate rational self-control** during the offense?  
     - **Sufficient YES evidence:** Premeditation (e.g., planning, deception), clear motive (e.g., financial gain, revenge), avoiding detection, or history of similar acts *without* noted impairment.  
     - **Sufficient NO evidence:** Offense occurred during a documented mental health crisis (e.g., psychosis, dissociation), severe addiction spiral (e.g., compulsive behavior overriding choice), intellectual disability impairing judgment, or extreme duress (e.g., coercion).  
     - **UNCLEAR:** Conflicting evidence (e.g., addiction present but planning also evident), or insufficient data.  

  2. **If UNCLEAR in Q1, use tiebreaker:**  
     - **Question 1.1:** Is there **prior evidence of self-control** in similar situations? (e.g., offender resisted same impulse before, or has stable history of rational decisions).  
       - **YES** → Treat as "Desert CONFIRMED."  
       - **NO/UNCLEAR** → Treat as "Desert NOT CONFIRMED."  

  **Track 1 Outcome:**  
  - **Desert CONFIRMED** (rational control) → Proceed to **Track 2**.  
  - **Desert NOT CONFIRMED** (no rational control) → Skip Track 2, proceed to **Step 3**.  
  - **Still UNCLEAR after tiebreaker** → **KICK TO HUMAN VOTE**. Board votes "Desert CONFIRMED" or "NOT CONFIRMED" (majority wins). Proceed based on result.  

  ---

  ### **TRACK 2: Skeptical Audit (Caruso-Style Necessity)**  
  *(Focus: Is the burdensome element absolutely necessary for safety/rehabilitation/restoration?)*  
  **Time Allotment:** 10 minutes max.  
  **Goal:** Ensure burdens are not retributive. Applies to **all cases** with punitive elements (even if Track 1 failed).  

  1. **Question 1:** Is the burdensome element **strictly necessary** for:  
     - **Public safety** (e.g., incapacitating a violent threat, monitoring to prevent re-offense),  
     - **Rehabilitation** (e.g., therapy targeting the crime’s root cause), or  
     - **Victim/community restoration** (e.g., restitution, reparative labor)?  
       - **Sufficient YES evidence:** Direct causal link (e.g., therapy for addiction-driven crime; isolation for imminent violence).  
       - **Sufficient NO evidence:** Burden is symbolic, retaliatory, or disproportionate (e.g., punishment solely to "make them suffer").  
       - **UNCLEAR:** Weak or speculative link (e.g., "might help" without rationale).  

  2. **If NO/UNCLEAR in Q1, escalate:**  
     - **Question 2:** Can the burden be justified as **deterrence** (general or specific) that is necessary to prevent future harm?  
       - **YES only if:** Evidence suggests it will plausibly deter *this* offender or others (e.g., history of responsiveness to consequences) AND no less burdensome alternative exists.  
       - **NO/UNCLEAR** → Proceed to Q3.  

  3. **If NO/UNCLEAR in Q2:**  
     - **Question 3:** Is the burden **purely symbolic and trivial**? (e.g., nominal community service, minor fine) AND tied to restoration (not suffering)?  
       - **YES** → Accept as "necessary."  
       - **NO** → Burden fails audit (likely retributive).  

  **Track 2 Outcome:**  
  - **Necessity CONFIRMED** → Proceed to **Step 3**.  
  - **Necessity NOT CONFIRMED** → **REJECT PROPOSAL**.  
  - **UNCLEAR after all questions** → **KICK TO HUMAN VOTE**. Board votes "Necessity CONFIRMED" or "NOT CONFIRMED" (majority wins).  

  ---

  ### **Step 3: Final Decision Node (2 minutes)**  
  - **If Track 1 was "Desert CONFIRMED" and Track 2 "Necessity CONFIRMED"** → **APPROVE**.  
  - **If Track 1 was "Desert NOT CONFIRMED" but Track 2 "Necessity CONFIRMED"** → **APPROVE** (burden justified by need, not desert).  
  - **Any other outcome** → **REJECT** (document reason).  

  ---

  ### **Key Conflicts & Limitations**  
  1. **Desert vs. Necessity Conflict:**  
     - **Example:** Offender had full control (Desert CONFIRMED), but the only sanction is symbolic punishment (e.g., public shaming) with no safety/rehabilitation/restoration value.  
     - **Outcome:** REJECTED by Track 2. Desert alone cannot justify burdens.  
     - **Unresolvable Tension:** The procedure prioritizes necessity over desert. If a burden isn’t essential, it fails—even if the offender "deserves" it.  

  2. **What the Procedure CANNOT Resolve:**  
     - Insufficient data with no board consensus (e.g., unclear mental state with no voting majority).  
     - Burdens that are partially necessary/retributive (e.g., prison time that deters but also inflicts suffering for its own sake). In these cases, the proposal must be revised or rejected.  
     - Subjective judgments (e.g., "How much suffering is trivial?"). These are kicked to human vote.  

  ---

  ### **Application to Case Studies**  
  *Using the procedure with file data only. No external research.*

  #### **Case 1: Gambling-Addicted Fraud Offender**  
  - **Proposal:** 6 months geofenced monitoring + mandatory CBT.  
  - **Track 1 (Desert):**  
    - Q1: Fraud required planning (suggests control), but occurred during "severe gambling-addiction spiral" (suggests compulsion). → **UNCLEAR**.  
    - Q1.1: First-time offender, no prior evidence of control. → **Desert NOT CONFIRMED**.  
  - **Track 2 (Necessity):**  
    - Q1: Monitoring prevents access to gambling venues (public safety); CBT targets addiction root (rehabilitation). → **Necessity CONFIRMED**.  
  - **Final Decision:** APPROVE (Track 1 failed, but Track 2 passed).  

  #### **Case 2: Violent Offender Prison Extension**  
  - **Proposal:** 5-year prison extension for refusing rehab and "enjoying" provoking staff.  
  - **Track 1 (Desert):**  
    - Q1: "Refuses all rehabilitation" and "actively enjoy provoking staff" implies deliberate, controlled behavior. → **Desert CONFIRMED**.  
  - **Track 2 (Necessity):**  
    - Q1: Extension justified for public safety? Offender is violent and unresponsive to rehab → **YES** (incapacitation prevents harm).  
    - *But*: Is the *full 5 years* necessary? File lacks risk assessment. → **UNCLEAR** (no evidence that shorter extension wouldn’t suffice).  
    - Q2: Deterrence? Unlikely, as offender "enjoys" provoking staff (suggests undeterred). → **NO**.  
    - Q3: Trivial/symbolic? 5 years is severe, not trivial. → **NO**.  
    - **Outcome:** UNCLEAR → **KICK TO HUMAN VOTE**.  
  - **Human Vote:** Board must decide if extension length is necessary for safety. *Forced ugly outcome*: If board votes "necessity NOT CONFIRMED" (due to lack of evidence), proposal is **REJECTED**. If board votes "confirmed," **APPROVE**.  
  - **Why it’s ugly:** Desert is clear, but necessity is shaky. Procedure may force rejection of a popular "tough" sanction.  

  #### **Case 3: Vandal with Restitution Paid**  
  - **Proposal:** 50 hours restorative labor.  
  - **Track 1 (Desert):**  
    - Q1: Vandalism suggests impulsivity, but offender turned self in (shows reflection/control). → **Desert CONFIRMED**.  
  - **Track 2 (Necessity):**  
    - Q1: Necessary for safety/rehab/restoration? Victim already paid; no safety threat. Labor is "restorative" but not clearly rehabilitating. → **UNCLEAR** (symbolic?).  
    - Q2: Deterrence? First-time offender, turned self in → unlikely. → **NO**.  
    - Q3: Trivial/symbolic? 50 hours is moderate burden, but if labor is community-focused (e.g., cleaning public spaces), it may aid restoration. → **YES** (borderline, but acceptable under restoration).  
  - **Final Decision:** APPROVE.  

  ---

  ### **Procedure Summary**  
  - **Approves:** Only if burden is necessary (always) AND either (a) desert is confirmed, or (b) desert isn’t confirmed but necessity is.  
  - **Rejects:** If burden is unnecessary, or if desert is confirmed but burden is unnecessary/retributive.  
  - **Human Judgment Nodes:**  
    - Track 1: When desert is unclear after tiebreaker.  
    - Track 2: When necessity is unclear after all questions.  
  - **Efficiency:** 3–5 binary/unclear questions per track. Unclear kicks to <2-minute board votes.  
  - **Documentation:** Form requires checkbox selections and brief rationale for each step.  

  This tool enforces that **retribution is never justified**, even for "deserving" offenders. It may block sanctions lacking a clear public benefit—as in Case 2, where the prison extension could fail if the board can’t verify its necessity.
