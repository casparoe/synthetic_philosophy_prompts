prompt: |-
  You are an expert on the philosophy of collective action and the epistemics of group decision-making. I want a careful structural diagnosis rather than generic leadership advice.

  I am one of seven volunteer moderators of a long-running online community of about forty thousand members. We are all equals on paper, and each of us has the permission to post a site-wide announcement without anyone else's approval. For the past week we have been privately debating whether to respond to a platform policy change that we all regard as bad for the community. All seven of us drafted a personal statement protesting the change. After the drafts circulated, an odd pattern emerged. Each of us, reading only our own draft, concluded that if that draft alone went out, it would be a net positive: it would signal that the moderation team is engaged and might put useful pressure on the platform. Yet we also all agreed that if even three or four of the seven statements went out, it would look as though the moderation team had splintered, and the community would end up worse off than if no statement had been posted. I am fairly confident everyone is reasoning honestly, but the pattern feels structurally broken.

  Please first brainstorm the structural features of the case, then identify the underlying problem and explain how seven individually reasonable judgments could produce a collectively bad outcome. Finally, recommend a concrete decision procedure we could adopt so that this kind of failure does not recur.
reasoning: |-
  Okay, the user is one of seven volunteer moderators for a large online community. They're facing a dilemma where each moderator believes their individual protest statement would be beneficial if posted alone, but if multiple statements go out, it would look like the team is splintered and harm the community. They need a structural analysis rather than leadership advice.

  First, I need to unpack the structural features. The key elements here are: symmetric authority (all have equal power to post announcements), parallel independent drafting (each created their own statement without coordination), and sequential evaluation (each assessed their own draft first). There's also a participation threshold effect - the harm comes when a critical mass (3-4) of statements are posted. 

  The underlying problem seems to be a classic collective action paradox, specifically a volunteer's dilemma in threshold form. Each moderator faces asymmetric costs/benefits: the personal benefit of acting alone vs the shared cost when too many act. There's also an epistemic issue - individual judgments are made in isolation without group calibration. The fact that all seven independently reached the same conclusion suggests this is a systemic failure rather than individual error.

  This resembles game theory scenarios like the volunteer's dilemma or threshold public goods problems. The moderators are stuck in a Nash equilibrium where "post" seems rational individually but leads to collective harm. The lack of coordination mechanisms exacerbates this - there's no way to enforce a single statement or limit responses.

  For solutions, they need procedural constraints that transform the decision structure. Requiring unanimous consent before any statement is posted would solve the immediate problem but might be impractical. A delegation system where one moderator is randomly selected to post (with others standing by) could work. Or they could implement a cooling-off period with mutual veto rights. 

  The key is changing the incentive structure so that individual rationality aligns with collective rationality. Any solution should preserve their egalitarian values while preventing coordination failures. The recommendation should include both immediate fixes for this situation and long-term procedural changes.
answer: |-
  Here's a structural diagnosis of your situation, identification of the core problem, and a recommended decision procedure:

  ### Structural Features of the Case
  1.  **Symmetric Authority:** All moderators possess identical, unilateral power to issue binding announcements.
  2.  **Parallel Independent Drafting:** Statements were created *before* collective deliberation on coordination, leading to multiple distinct positions.
  3.  **Sequential Individual Evaluation:** Judgment ("Is my statement net positive?") was made by each moderator viewing *only their own draft* in isolation.
  4.  **Threshold Effect:** The negative outcome (appearing splintered) emerges only when a critical mass (3-4) of statements are posted. One or two statements are perceived as beneficial.
  5.  **Common Knowledge of Preferences:** All moderators agree on the *goal* (protest the change) and the *risk* (harm from multiple statements).
  6.  **Lack of Coordination Mechanism:** No pre-existing procedure exists to ensure only one statement (or a unified one) is posted.
  7.  **Volunteer Nature & Egalitarian Ethos:** Decision-making norms likely prioritize individual autonomy and consensus, potentially discouraging strong coordination or leadership emergence.

  ### The Underlying Problem: A Threshold Volunteer's Dilemma with Epistemic Fragmentation
  This is a sophisticated collective action problem combining elements of:
  *   **Threshold Public Goods/Volunteer's Dilemma:** The group needs *someone* to act (volunteer a statement) for the collective good, but *too many* volunteers create a collective bad. The "good" (effective protest) is achieved only if the number of volunteers stays below the threshold (1 or 2). The "bad" (splintered appearance) occurs if the threshold is exceeded (3+).
  *   **Epistemic Asymmetry & Isolation:** Each moderator, evaluating *only their own draft*, lacks crucial information: *What specific content do the other drafts contain?* Crucially, they also lack knowledge of *how others will perceive the combination of different statements*. Their individual judgment ("My statement is good alone") is made in an epistemic vacuum regarding the collective outcome.
  *   **Strategic Uncertainty & Dominant Strategy Trap:** Each moderator reasons:
      *   *If others don't post, my statement is beneficial.*
      *   *If others do post, posting mine risks pushing us over the harmful threshold.*
      *   However, since each believes *their* statement is uniquely valuable/appropriate (a natural consequence of drafting individually) and fears *inaction* if they don't post, the dominant *individual* inclination is to post ("My statement is good alone, and someone *has* to act").
      *   Crucially, *all seven* reach this same conclusion simultaneously based on their isolated epistemic position and symmetric incentives. This leads to the dangerous equilibrium where everyone *wants* to post, knowing that *if everyone acts on this desire*, the worst outcome occurs.

  **Why Individually Reasonable Judgments Lead to Collective Failure:**
  1.  **Partial Information:** Each "My statement is good alone" judgment is correct *given the information available to them* (only their own draft). They lack the information to judge the *collective* outcome.
  2.  **Misplaced Causal Attribution:** Each focuses on the *content* of their own statement ("This is good protest") rather than the *signaling effect* of multiple distinct statements ("The *team* is divided"). The collective harm arises not from bad content, but from the *plurality* itself.
  3.  **Failure of Aggregation:** Individually rational decisions ("Post") do not aggregate into a collectively rational outcome ("One statement posted") because the decision structure lacks the mechanism to enforce or coordinate that aggregation. The symmetric authority structure actively works *against* aggregation.
  4.  **Absence of Common Knowledge of Commitment:** Even if one moderator privately decides *not* to post to avoid the threshold, they have no guarantee others will also refrain. Fear of being the *only* one who didn't act (leading to no protest or only one potentially inadequate statement) can push them back towards posting.

  ### Recommended Concrete Decision Procedure: The Unanimous Consent Gate (UCG)
  **Goal:** Transform the decision from individual unilateral action into a collective coordination mechanism that prevents exceeding the threshold while ensuring action happens.

  **The Procedure:**
  1.  **Trigger:** An issue arises requiring a potential moderator statement.
  2.  **Drafting (Optional but Recommended):** Individuals *may* draft statements (valuable for clarifying views).
  3.  **Collective Deliberation & Synthesis:** Moderators deliberate on *whether* a statement is needed and *what core message* it should convey. Aim for a unified position. If consensus on wording isn't possible *and* multiple distinct positions are strongly held, proceed to Step 4.
  4.  **The Gate:** **No moderator may post *any* individual statement on the issue without first obtaining the *unanimous consent* of all seven moderators.** This applies specifically to *this* issue/statement type.
      *   Moderator A proposes posting their draft. They present it in the private forum.
      *   All seven moderators vote: "Consent to Moderator A posting *this specific draft* as the *sole* moderator statement on this issue?"
      *   **Unanimous "Yes" Required:** If all seven vote "Yes," Moderator A posts it. *No other moderator posts their statement.*
      *   **Any "No":** If even one moderator votes "No," Moderator A *does not* post their draft. The proposal fails.
  5.  **Iteration (if needed):**
      *   If Moderator A's proposal fails, Moderator B can propose *their* draft (or a revised one) through the same UCG process.
      *   Alternatively, the group can return to Step 3 to attempt a collaborative draft.
      *   The process repeats until one proposal gains unanimous consent, or the group collectively decides *not* to issue any statement.

  **Why this Solves the Structural Problem:**
  1.  **Prevents Threshold Breach:** Only *one* statement can ever be posted (the one that passes UCG), eliminating the risk of splintering from multiple posts.
  2.  **Aligns Individual and Collective Rationality:** It forces individual desire to post ("My statement is good") to be tempered by the collective judgment ("Is *this* statement acceptable as the *sole* representation of the team?"). Voting "No" is now a low-cost way for any moderator to prevent a statement they believe is harmful or inadequate from being the *only* one.
  3.  **Creates Common Knowledge:** The voting process makes preferences and judgments visible to all. If a proposal fails, it signals disagreement about its adequacy as the single voice.
  4.  **Encourages Synthesis:** Knowing they need unanimous consent, proposers are incentivized to draft statements that incorporate broader concerns or seek input beforehand, making consensus more likely. The threat of a "No" vote encourages moderation and inclusivity in drafting.
  5.  **Preserves Equality:** Authority remains symmetric. Any moderator can propose, any can block. It doesn't require hierarchy or delegation.
  6.  **Manages Epistemic Isolation:** The deliberation and voting process forces the aggregation of individual perspectives and judgments about the collective impact *before* any action is taken.
  7.  **Ensures Action is Possible:** If there *is* a statement that all moderators can accept as the single team voice, it will be found and posted. If not, no statement is posted, avoiding the worst outcome (multiple conflicting ones).

  **Implementation Note:** Adopt this as a formal amendment to your moderation protocols. Discuss it thoroughly *before* the next crisis. The key is shifting the norm from "I can post if I think it's good" to "We only post if we *all* agree *this specific one* should represent us alone." This transforms the structure from a coordination trap into a robust filter for unified action.
