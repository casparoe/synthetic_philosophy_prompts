prompt: |-
  I'm a self-taught reader with no academic credentials, but I've spent the last year working through logical empiricism on my own, and I'm now preparing to record a podcast interview with a defender of Otto Neurath's ISOTYPE and his broader philosophy of picture-language. Before you draft anything, please take a moment to think carefully about the actual tensions in Neurath's position—especially the conflict between his anti-foundationalist "rebuild the ship at sea" epistemology and his ambition to create a universally legible, culturally neutral visual vocabulary. I want you to act as an expert philosopher of science with deep familiarity with logical empiricism and visual epistemology.

  Start with a brief internal brainstorming: identify the three deepest conceptual tensions in Neurath's picture-language project, particularly where his rejection of metaphysical foundations sits uneasily with his claim that standardized icons can bypass linguistic ambiguity entirely.

  Then write me a sequence of five interview questions. The questions should turn on real content, not biography: press on whether ISOTYPE icons function like Neurath's earlier protocol sentences (Protokollsätze) but without their conventionality problem; anticipate the standard reply that pictures are merely pedagogical aids rather than truth-bearing reports, and include the immediate follow-up that asks how they then contribute to the unity of science; and include one question that introduces the idea of "visual protocol sentences"—treating an ISOTYPE chart as attempting to do the work of a foundational observation report through imagery alone. Make the deflection progressively harder: by the fourth question the interviewee should have to address whether a fixed pictorial lexicon secretly reintroduces the kind of foundational framework Neurath insisted knowledge lacks.

  Keep everything meaningful for someone who can't search the web—no requests for bibliographies, citation lists, or obscure secondary literature, and don't lean on hyper-niche scholarship that only specialists have memorized. The prompt should be polished and formal.

  End your response with a one-sentence summary of the interview strategy on its own line, formatted exactly as: Verdict: [your summary].
