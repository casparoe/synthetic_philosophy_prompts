prompt: |-
  I serve on the clinical ethics committee at a regional medical center—weekly meetings, about thirty minutes per case, members are clinicians and attorneys with no philosophy training, and our reports may be subpoenaed—so any framework must be documentable by non-specialists and executable under time pressure. The issue became personally urgent last month when my father suffered catastrophic brain trauma and was enrolled in an experimental modular neural prosthesis trial in which different psychological capacities—episodic memory, moral reasoning, bodily self-awareness, linguistic competence—are replaced by synthetic substrates at different rates rather than all at once. Our family is split over whether his advance directive still binds “him,” whether a new legal identity has emerged, and how to distribute decision-making authority when psychological continuity is partial, branched, or module-specific rather than globally present or absent. I need a reusable decision procedure grounded in Derek Parfit’s psychological-continuity account of survival—the framework that treats the teletransporter problem as testing what matters in survival rather than tracking physical continuity—but stripped of metaphysical baggage, so that it can be run by non-philosophers on any case involving modular disruption.

  Please construct the procedure as an ordered sequence of questions: for each step, specify the factual evidence required (which capacities remain functionally intact, through what causal pathway, whether branching creates multiple claimants), what counts as a sufficient answer, where the procedure terminates with a clear negative, and where it must hand the decision to human value judgment because the question is normative rather than empirical. Include explicit misfire warnings—points where mechanical application conflicts with legal precedent or family intuition. Then apply it to two cases. First: a patient whose episodic memory and autobiographical narrative are fully prosthetic, but whose moral dispositions, linguistic patterns, and bodily awareness remain intact; the family petitions to void his advance directive, and I personally want it preserved, but I want the procedure to recommend voiding it so I can see exactly where judgment must override mechanics. Second: a split-brain intervention after trauma in which the left hemisphere retains language and moral reasoning but lacks bodily self-awareness, while the right hemisphere retains bodily awareness and emotional response but no language; both sides claim authority over the patient’s estate and medical choices. Keep the full response under 550 words.
