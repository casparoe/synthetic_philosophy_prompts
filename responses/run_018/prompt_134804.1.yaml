answer: |-
  Here is the executable procedure, grounded in Parfit's framework but operationalized for clinical use, followed by case applications:

  **Psychological Continuity Assessment Procedure (PCAP)**

  1.  **"Which core psychological modules (episodic memory, moral dispositions, linguistic competence, bodily awareness, autobiographical narrative) retain functional connection to the patient's pre-disruption psychology?"**
      *   *Evidence:* Clinical/neuropsychological testing data, implant logs (if applicable), behavioral observation. Specify modules and the causal pathway (e.g., "Episodic memory: prosthetic implant, no organic connection"; "Moral reasoning: intact organic pathways").
      *   *Sufficient Answer:* Module-by-module status report. *Terminate if negative:* If *no* module shows functional connection to the original person (e.g., complete global organic failure with entirely new prosthetic psychology), conclude: **Original identity/person does not survive; advance directives likely void.** Proceed to Step 2 if *any* connection exists.

  2.  **"Is there sufficient overlap and connection across the preserved/organically connected modules to constitute psychological continuity?"**
      *   *Evidence:* Integration assessment (e.g., does moral reasoning *use* episodic memories? Does language express autobiographical awareness coherently?).
      *   *Sufficient Answer:* Description of integration quality (Strong/Moderate/Weak/Fragmented). *Terminate if negative:* If modules operate in complete isolation with no functional interaction ("Fragmented"), conclude: **Psychological continuity is broken; original identity likely does not survive; advance directives may be void.** *Handoff if weak/moderate:* Proceed to Step 3 if integration is Weak/Moderate. *Misfire Warning:* "Weak" continuity may still legally bind directives; override requires careful justification.

  3.  **"Is there evidence of branching (e.g., split-brain, multiple claimants, distinct psychological streams)?"**
      *   *Evidence:* Neurological data (e.g., hemisphere isolation), behavioral observation of conflicting claims/personas.
      *   *Sufficient Answer:* "Single Stream" or "Branching Present (Specify Streams)". *Terminate if negative:* Proceed to Step 4. *Handoff if positive:* Branching necessitates **human judgment** on authority distribution (e.g., co-guardianship). *Misfire Warning:* Legal systems struggle with branching; precedent favors unified identity.

  4.  **"Do the preserved/organically connected modules include those central to forming values expressed in the advance directive (e.g., moral reasoning for DNR, bodily awareness for refusing amputation)?"**
      *   *Evidence:* Advance directive content, assessment of relevant preserved modules.
      *   *Sufficient Answer:* "Relevant modules preserved" or "Relevant modules disrupted". *Handoff:* Always normative. If preserved, **directive likely still binds**. If disrupted, **directive may be voidable**; decision requires weighing original intent vs. current interests/best interests via standard ethics consultation. *Misfire Warning:* Voiding based on module loss without assessing *relevance* contradicts legal respect for directives.

  ---

  **Case 1 Application (Father: Prosthetic Memory/Narrative, Organic Morals/Language/Body):**
  1.  Modules connected: Moral Disp (Organic), Language (Organic), Bodily Aware (Organic). Memory/Narrative (Prosthetic). Proceed.
  2.  Integration: Moderate/Weak (Moral reasoning likely independent of prosthetic narrative? Language may express prosthetic "memories"). Proceed.
  3.  Branching: None. Proceed.
  4.  Relevant Modules: Directive likely based on values (moral reasoning) and bodily integrity (bodily awareness) – *both organically intact*. **PCAP Output: Advance Directive Likely Still Binds.** *Misfire Triggered:* To "recommend voiding" requires overriding Step 4's empirical finding of intact relevant modules. This forces **human judgment** – arguing the *prosthetic narrative* fundamentally alters identity/values despite intact morals, or prioritizing current expressed wishes/family consent over the directive.

  **Case 2 Application (Split-Brain: LH Language/Morals, RH Body/Emotion):**
  1.  Modules connected: LH (Language Organic, Moral Organic), RH (Bodily Organic, Emotional Organic). Proceed.
  2.  Integration: Fragmented *between* hemispheres. Proceed (Step 2 only terminates if *all* modules fragmented).
  3.  Branching: Present (LH Stream & RH Stream). **PCAP Output: Handoff Required.** Authority distribution is a **normative judgment** (e.g., co-decision-makers, court-appointed guardian considering each stream's capacities for specific decisions). *Misfire Warning:* Mechanically splitting authority contradicts legal precedent assuming a single person; a unified guardian may be legally required despite branching.
