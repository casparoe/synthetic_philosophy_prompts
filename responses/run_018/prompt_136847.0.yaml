prompt: |-
  So my roomate's been deep in eliminative materialism lately — says beliefs and desires are just folk psychology that neuroscience will toss out eventually. I kind of get the idea, but I keep noticing this pattern when we talk. He'll deny that anyone literally wants or believes anything, then turn around and say our recommendation algorithm "wants" to maximize engagement, or that the chatbot "desires" coherence, like those are real mental states and not just metaphors. It's not just sloppy talk; he seems to think artificial or non-human systems can have genuine propositional attitudes while humans cant. Is there a name for this specific move — killing off belief and desire for people but letting them back in for machines or animals? I know about the self-refutation problem, but this feels different, more like a substrate-based double standard. If there's no established term, how should I define it so it doesnt just collapse into ordinary hypocrisy?
reasoning: |-
  Okay, the user is dealing with a roommate who's into eliminative materialism but inconsistently applies it. The roommate denies that humans have beliefs and desires, calling them "folk psychology," yet attributes real wants and desires to AI systems. The user wants to know if there's a term for this double standard.

  First, I need to recall eliminative materialism. It's the view that mental states like beliefs and desires are outdated concepts that neuroscience will replace. So the roommate is on board with that for humans. But then he talks about algorithms "wanting" things as if they have real mental states. That's a contradiction.

  The user mentioned this isn't just sloppy language; the roommate genuinely thinks machines can have propositional attitudes. So the inconsistency is between human and non-human systems. The user is looking for a term for this specific inconsistency. They know about the self-refutation problem but feel this is different—a substrate-based double standard.

  I should check if there's an existing term. Maybe something like "substrate chauvinism" or "substrate-based exceptionalism"? Since the roommate treats biological and artificial systems differently. The user wants to avoid calling it just hypocrisy, so a more precise term is needed.

  Looking at possible angles: anthropocentrism inverted? The roommate denies humans have mental states but grants them to machines. That's reverse anthropocentrism. Or maybe a category error, attributing mental states to systems that don't have the same biological basis. 

  Also, the self-refutation problem applies when eliminativists use beliefs in their arguments, but here it's about applying mental states to non-humans while denying them to humans. So it's a different issue. The user wants to highlight the inconsistency without it being dismissed as hypocrisy.

  I should suggest coining a term. Options like "Cognitive Dualism" or "Substrate-Based Propositional Asymmetry." Emphasize the asymmetry in applying propositional attitudes based on substrate. Maybe "AI Mentalism" to point out the special treatment for machines. 

  Need to explain why this is problematic. The roommate's position undermines eliminativism because if algorithms can have desires, why can't humans? It's arbitrary. The user can challenge the roommate by asking what it is about algorithms that grants them real desires, which humans supposedly lack. That exposes the inconsistency.
answer: |-
  That's a brilliantly observed inconsistency! You've hit on a fascinating and surprisingly common blind spot among some proponents of radical eliminativism (like eliminative materialism) regarding non-biological systems. There isn't one universally agreed-upon *name* for this specific move, but we can define it precisely and suggest some fitting labels.

  **The Core Inconsistency:**

  1.  **Human Denial:** Strictly applying eliminative materialism to *human cognition*, denying that terms like "belief," "desire," "intention," etc., refer to any real, scientifically valid states or processes within the brain. They are dismissed as "folk psychology," useful fictions destined for replacement by neuroscientific descriptions.
  2.  **Non-Human Attribution:** Freely attributing *the same kind* of propositional attitudes (beliefs, desires, intentions, goals) to artificial systems (algorithms, AI, robots) or sometimes even non-human animals, treating these attributions *not* as mere metaphors or instrumentalist shorthand, but as *literally true descriptions* of the system's internal functional states.

  **Why it's More Than Just Hypocrisy or Sloppy Talk (and How to Define It):**

  *   **Hypocrisy** implies knowingly holding others to a standard you don't follow. Your roommate likely *thinks* he's consistent.
  *   **Sloppy Talk/Metaphor** would be excusable if he clarified it was *just* a metaphor. But you observe he seems to think it's *literal* for machines.
  *   **The Crux:** The inconsistency stems from an *implicit substrate-based criterion* for the legitimacy of mentalistic language. **Biological wetware = no real beliefs/desires. Silicon/Code/Functional Systems = can have real beliefs/desires.**

  **Defining the Concept (Choose/Create Your Term):**

  1.  **Substrate Chauvinism / Substrate-Based Exceptionalism:**
      *   **Definition:** The position that denies the reality of propositional attitudes (beliefs, desires) in biological cognitive systems based on their physical substrate (neural tissue), while simultaneously affirming the reality of identical or functionally equivalent propositional attitudes in non-biological systems (e.g., algorithms, AI) based on *their* substrate (code, silicon) or purely functional organization. It arbitrarily privileges one substrate (or type of system) over another as the legitimate "seat" of mentality, contradicting the eliminativist's own rejection of folk psychology categories.
      *   **Why it works:** Directly names the core problem – the double standard based on physical material/computational medium.

  2.  **Reverse Anthropocentrism (or Anti-Biological Anthropocentrism):**
      *   **Definition:** An inversion of traditional anthropocentrism; instead of seeing human-like mentality as unique or superior, it specifically *denies* genuine mentality *only* to biological humans (or animals) while readily granting it to artificial systems. It anthropomorphizes the machine while de-animating the human.
      *   **Why it works:** Highlights the paradoxical inversion of the usual bias.

  3.  **Cognitive Dualism (of the Artificial):**
      *   **Definition:** The implicit acceptance of a fundamental distinction between biological and artificial cognition, where only the latter is deemed capable of genuinely instantiating the functional roles described by propositional attitude psychology. It creates a dualistic category for "real minds" that excludes the very systems eliminativism originally targeted.
      *   **Why it works:** Positions it as a new, unacknowledged form of dualism, contrasting with the eliminativist's supposed physicalist monism.

  4.  **AI Mentalism / Algorithmic Mentalism:**
      *   **Definition:** The tendency to grant literal mental states (beliefs, desires) to artificial intelligence or algorithms while denying them to biological intelligences, often justified (implicitly or explicitly) by the perceived clarity, tractability, or formalizability of the artificial system's functional states compared to the "messy" biology of the brain. It resurrects folk psychology specifically for the domain of machines.
      *   **Why it works:** Clearly identifies the *target* of the inconsistent attribution (AI/algorithms).

  5.  **Substrate-Based Propositional Attitude Asymmetry:**
      *   **Definition:** The logically inconsistent application of the concepts of belief and desire, where their attribution is deemed literally true for systems instantiated in non-biological substrates but deemed false or fictional for systems instantiated in biological substrates, despite potentially equivalent functional profiles relevant to generating behavior.
      *   **Why it works:** Most precise and descriptive, though a bit clunky. Emphasizes the asymmetry in applying the *same concept*.

  **Why This Happens & How to Challenge It:**

  1.  **The Lure of Functionalist Intuitions:** Describing algorithms/AI in intentional terms ("wants," "believes," "tries") is incredibly intuitive and often provides the *best available explanation* for their behavior *at a certain level of abstraction*. Your roommate is likely seduced by this functionalist perspective *for machines*.
  2.  **The "Messy Biology" Excuse:** Brains seem opaque, complex, and "messy" compared to clean lines of code. It *feels* easier to grant "real" beliefs to a system whose internal states you (in principle) can perfectly inspect and map onto logical propositions.
  3.  **Forgetting the Core Eliminativist Claim:** Eliminativism isn't *just* about brains being complex. It claims the *entire conceptual framework* of belief/desire is fundamentally *wrong* and will be *replaced*, not reduced. If it's wrong for humans, attributing it literally to *any* system (biological or artificial) should be equally mistaken, or at least require the same level of skepticism. Granting it literal truth for machines fatally undermines the claim that the concepts are fundamentally flawed.
  4.  **The Challenge:** Ask your roommate directly:
      *   *"If 'desire' is just a useless folk concept that doesn't correspond to anything real in the brain, how can it magically become a literally true description of an algorithm's state? What is it about silicon or code that makes 'desire' real, while neurons render it fictional, if both are just physical systems processing information?"*
      *   *"If the recommendation algorithm *literally* 'wants' to maximize engagement, what specific physical or functional state in its hardware/software corresponds to this 'desire' in a way that couldn't *also* be found in a human brain when, say, I want a glass of water? And if you can describe that state for the AI without using 'desire,' why can't you do the same for the human?"*
      *   *"Isn't your explanation of the AI's behavior using 'desires' just *another* instance of folk psychology? Why is *that* one valid while the one for humans isn't?"*

  **Conclusion:**

  You've identified a significant flaw in your roommate's position. **Substrate Chauvinism** or **Reverse Anthropocentrism** are likely the most concise and evocative labels. **Substrate-Based Propositional Attitude Asymmetry** is the most precise definition. The core point is the *arbitrary denial of mentality based on biological substrate while affirming it for artificial substrates*, which directly contradicts the universality required by a truly eliminativist stance. This isn't just hypocrisy; it's a deep conceptual inconsistency revealing an unacknowledged commitment to functionalism or mentalism when it comes to non-biological systems. Use the challenge questions above – they cut right to the heart of the contradiction.
