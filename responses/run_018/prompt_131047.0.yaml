  ## Opening Remarks: "Strange Loops in Practice"

  Colleagues, welcome. We gather today under the compelling, confounding banner of "Strange Loops in Practice." Our disciplines, at first glance, might seem to orbit different suns: one preoccupied with the abstract structures of thought, causality, and representation; the other deeply engaged with the tangible, the visual, the paradoxical made manifest. Yet, we are united here by a single, deceptively simple image: M.C. Escher’s *Drawing Hands*.

  We know it well. Two hands, emerging from cuffs resting on a sheet of paper. The right hand, mid-stroke, draws the left cuff and the beginnings of the left hand. Simultaneously, the left hand, pencil poised, draws the right cuff and the beginnings of the right hand. They appear locked in the act of conjuring each other into existence. It’s often called an optical illusion, a clever trick. But today, let us treat it not as a *visual* paradox, but as a *causal* argument rendered in graphite.

  The immediate question screams: How can A create B, if B is simultaneously creating A? Where does the causal chain begin? Conventionally, we might seek an escape hatch, an external foundation – perhaps the artist, Escher himself, standing outside the frame. Or, perhaps, that sheet of paper. It sits there, seemingly passive, untouched by the frantic reciprocal drawing above. It feels solid, foundational – the *inviolate level*.

  The concept of an inviolate level is crucial. Within a system exhibiting self-reference or a strange loop – where elements refer back to themselves or each other in a closed, hierarchical, yet tangled way – the inviolate level represents a stratum that remains fundamentally *unaffected* by the looping dynamics above it. It’s the ground upon which the loop plays out, the stable platform that allows the paradox to exist without collapsing into nonsense. In computational systems, it might be the hardware executing the self-referential code. In cognitive models, it might be the basic biological processes supporting higher-order thought. At first glance, the paper in *Drawing Hands* seems the perfect candidate: it holds the drawing; the hands rest upon it; yet, crucially, *neither hand draws the paper itself*. It appears inviolate.

  But I propose we look deeper, and challenge this seemingly obvious interpretation. Is the paper truly untouched? Is it merely a passive stage? I argue, emphatically, *no*. The paper is not a hidden foundation lying safely *outside* the causal loop. Rather, it is the *third term* actively sustained *by* the loop itself – a product of the very tangle it appears to underpin.

  Consider the logic of the image *as presented*. The hands draw *each other*, but they *also* draw the cuffs, which rest upon… the paper. The paper is depicted *as part of the drawn scene*. It is rendered with the same pencil strokes, the same texture, the same visual language as the hands. It shares their reality. The loop doesn't merely *occur on* the paper; the loop *generates the representation of the paper*. The act of the left hand drawing the right cuff implicitly defines the surface *on which that cuff rests*. The right hand, drawing the left, does the same. The paper, within the depicted reality, is *not pre-existing*. Its seeming solidity, its role as the base, is *an effect* of the reciprocal drawing act. It is constituted *by* the loop.

  This is where the strangeness intensifies, and where our practical inquiries begin. The hierarchy isn't merely tangled *despite* a solid base; it is tangled *because* its apparent base – the paper – is itself *reproduced from within the loop*. There is no safe ground *external* to the system depicted. The inviolate level isn't violated; it is revealed to be an *illusion of invariance* generated by the loop's dynamics. The stability of the "base" is contingent upon the continuous, reciprocal action happening "above" it. Remove the drawing hands, and the paper, *as depicted*, vanishes with them. Its existence is dependent on the loop it seems to support.

  **Why does this matter for us, gathered here today?**

  For our colleagues steeped in hierarchical modeling, cognitive science, and the philosophy of self-reference: This interpretation demands rigor. It refuses the easy resolution of an external ground. It compels us to examine systems where the "base" level isn't immutable hardware or simple physics, but is itself dynamically constituted or represented *by* the higher-level processes it enables. Think of a mind modeling its own neural processes: the model is generated *by* the processes it seeks to represent, blurring the line between the representing system and the represented "hardware." The inviolate level becomes dynamic, context-dependent, a *function* of the loop rather than its anchor. Our formal models must grapple with this constitutive entanglement without collapsing into incoherence.

  For our colleagues in curation and visual art: This perspective refuses to reduce *Drawing Hands* to a mere illustration of a pre-existing logical puzzle. It elevates the artwork as its own profound *argument* about creation, dependence, and the nature of representation. Escher isn't just doodling a paradox; he's visually demonstrating how the *representation of the ground* (the paper) is inextricably bound to the act of representation itself (the drawing hands). The paper's materiality *in the artwork* is an active participant in the loop’s meaning, not a passive given. It challenges us to see the artwork not as depicting a static impossibility, but as enacting a dynamic, self-sustaining process of emergence where every element, including the foundation, plays an active, interdependent role.

  This is the fertile, unsettling ground of "Strange Loops in Practice." We are not here to resolve Escher’s paradox, but to inhabit it. We are here to ask: Where do we find such constitutive loops – where the ground is generated by the structure it supports – in our own domains? In the self-referential structures of cognition? In the way artistic practices create the very frameworks that define them? In the tangled hierarchies of complex systems, biological or social?

  The hands draw each other, drawing the cuffs, drawing the paper upon which they rest. It’s not a trick. It’s an invitation. An invitation to explore the practices where the loop *is* the foundation, where stability emerges precariously from reciprocal constitution, and where the "paper" is not a hidden given, but the visible, dynamic product of the very process it enables. The paradox isn't a flaw to be fixed; it's the engine of the phenomenon.

  I look forward to the strange and practical loops we will trace together in the coming days. Let the inquiry begin. For, as the image suggests, perhaps the paper needs the pencil needing the hand needing the paper... and so it goes.
