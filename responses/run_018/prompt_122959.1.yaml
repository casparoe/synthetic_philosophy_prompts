prompt: |-
  Been going back and forth on blame for ages and I want someone to check whether my actual package hangs together before I try to teach it. Where I've landed:

  (a) whether someone deserves blame depends only on them — what they did, their reasons, what they were capable of — and nothing about the person doing the blaming makes the target any more or less blameworthy;
  (b) even so, a hypocritical blamer lacks standing: their blame is out of order and they should keep it to themselves, even when the target obviously deserves blame;
  (c) what does the forfeiting is the blamer having done a relevantly similar wrong themselves and not owned up to it;
  (d) standing isn't scalar — you either have it or you don't, and it doesn't get discounted just because the blamer's own version was much smaller than the target's;
  (e) you get it back by acknowledging it and genuinely changing, so the forfeiture isn't permanent;
  (f) none of this is special to blame between people who know each other — an uninvolved third party whose done the same thing and hasn't owned up to it lacks standing too;
  (g) but the person who's never done anything remotely like it, who blames only when it costs them nothing and goes quiet the moment the norm is inconvenient, has full standing — clean hands is what matters;
  (h) and I want to hang onto the thought that a lot of ordinary public criticism — random people calling out powerful people who do bad things — is perfectly appropriate and is one of the few accountability mechanisms that actually does any work.

  So: which of these really collide and which only look like they do? I half suspect (a) and (b) are fine together and the appearance of conflict is an illusion, but I can't tell where the real problem is. Rank whatever genuine tensions you find by how bad they are, say for each one what would have to give and what that costs me, and name the single revision that cleans up the most. Also: seperate what's actually settled among people who work on this from what's a live dispute — don't smooth a contested view into orthodoxy for me.
reasoning: |-
  Okay, the user has laid out their entire package on blame and standing, and they're asking me to check for internal consistency before they teach it. They've got eight distinct points (a through h) that form a cohesive theory. Let me start by understanding each point in depth.

  Point (a) says blameworthiness is objective—it depends only on the target's actions, reasons, and capabilities. That's a classic internalist view. Then (b) introduces hypocrisy as a standing issue: even if someone deserves blame, a hypocritical blamer should keep quiet. (c) defines hypocrisy as having committed a similar wrong without owning up. (d) makes standing binary—no degrees—even if the blamer's past wrong was minor. (e) allows regaining standing through acknowledgment and change. (f) extends this to third parties, not just personal relationships. (g) gives full standing to those with "clean hands," even if they only blame when convenient. (h) wants to preserve public criticism as a valid accountability tool.

  The user suspects (a) and (b) might conflict but hopes it's illusory. I need to spot real tensions. First, (a) makes blameworthiness agent-relative, but (b)-(g) make the act of blaming dependent on the blamer's history. That seems okay—desert vs. expression are separate. But the big clash is between (d) (standing is binary) and (g) (clean hands matter). If someone only blames when it's costless—say, a social media activist who stays silent on friends' misdeeds—they technically have clean hands per (c) because they haven't done the same wrong. But (g) calls this "full standing," which feels off. How can they be a hypocrite without committing a similar act? That's where the "clean hands" definition might be too narrow. 

  Then there's (h): public criticism. If a random person online calls out a CEO, but they've never done corporate fraud (clean hands), they have standing per (g). But what if they've done unrelated wrongs, like tax evasion? Per (c), only "relevantly similar" wrongs count, so they'd still have standing. Is that defensible? Probably, but it might rub people the wrong way. 

  The user also needs to handle cases where past wrongs aren't identical. If someone stole once but blames a murderer, is it "relevantly similar"? Per (d), minor vs. major doesn't matter—so no standing. But that could feel disproportionate. And for (f), third-party hypocrisy: if a journalist condemns corruption but has unacknowledged plagiarism, they lack standing. That might undermine accountability, per (h). 

  The core tension is between the binary, act-based view of hypocrisy in (c)-(d) and the intuition in (g) that opportunistic blamers are problematic. (g) is the weak link. If they drop (g) and concede that "clean hands" blamers can still be criticizable for inconsistency, it solves a lot. But that costs them the neatness of "never did it = always okay." Alternatively, they could refine "clean hands" to include dispositional hypocrisy, but that might complicate (d)'s binary view. 

  Among scholars, the objectivity of blameworthiness (a) is contested—some think social context matters. Hypocrisy's mechanics (c-e) are also debated, especially proportionality. The user should flag these as live disputes. 

  For the biggest fix: revising (g) to allow criticism of inconsistent blamers, even with clean hands, resolves the tension with (h) and better matches real-world intuitions. It means "standing" isn't just about past acts but also about genuine commitment to norms. That's a heavier lift but saves the rest.
answer: |-
  Your package is coherent in many respects, but genuine tensions exist—particularly between (g) and the rest, with secondary clashes involving (d), (h), and the scope of hypocrisy in (c). Below is a breakdown of tensions, ranked by severity, with costs of revision and scholarly context. Key insight: **The deepest conflict isn’t between (a) and (b), but between (g) and your broader theory of hypocrisy.**

  ### Ranked Tensions (Most Severe First)
  1.  **🧩 (g) vs. (b)/(c)/(f): "Clean Hands" vs. Hypocrisy Definition**  
      - **Conflict:** (g) grants full standing to blamers who avoid *relevantly similar wrongs* (per (c)) but exhibit **dispositional hypocrisy** (e.g., blaming only when costless, staying silent when norms are inconvenient). Yet (b)/(c) tie standing *only* to committing/unacknowledged similar acts—not to inconsistent *commitment* to the norm. This creates a perverse result: A person who *never* violates the norm but selectively enforces it (e.g., only condemns sexism when targeting political rivals) has "clean hands" and full standing under (g), despite being a **procedural hypocrite** undermining the norm’s authority.  
      - **Cost of Revising (g):** Abandoning "clean hands" as sufficient for standing forces you to confront whether *procedural consistency* (e.g., willingness to blame when costly) is part of standing. This blurs lines between standing and *blamer integrity*, and risks overburdening blamers.  
      - **Cost of Revising (b)/(c):** Expanding hypocrisy to include dispositional inconsistency (e.g., "you don’t *really* care about this norm") violates (c)’s focus on *committing similar acts* and makes standing assessment more subjective.  

  2.  **⚖️ (d) vs. Intuitions about Proportionality**  
      - **Conflict:** (d)’s non-scalar standing (e.g., one unacknowledged parking violation = no standing to blame a murderer) clashes with moral intuitions and (h)’s defense of public criticism. If a minor hypocritical act permanently (*until repentance*) nullifies standing to blame *any* similar wrong—regardless of severity—it risks silencing valid criticism (e.g., a journalist who once plagiarized but now exposes corruption).  
      - **Cost of Revision:** Making standing scalar (e.g., "forfeiture scales with severity") undermines (d)’s clarity and risks moral bookkeeping. Alternatively, restricting "relevantly similar" (c) to *severity* contexts preserves (d) but weakens the theory’s simplicity.  
      - **Scholarly Context:** Non-scalar views exist (e.g., Todd 2019), but proportionality debates are live (Fritz & Miller 2018 vs. Lippert-Rasmussen 2023).  

  3.  **🌐 (f) vs. (h): Third-Party Hypocrisy & Public Accountability**  
      - **Conflict:** (f) denies standing to *any* hypocrite (even uninvolved third parties), but (h) champions public criticism. If "relevant similarity" (c) is broad (e.g., "any dishonesty"), most people lack standing to blame powerful wrongdoers (we’ve all lied unacknowledged). This could neuter (h)’s accountability mechanism.  
      - **Resolution?** Narrow "relevantly similar" (c) to *contextually specific wrongs* (e.g., only corporate fraudsters lack standing to blame fraud). But this risks arbitrariness and conflicts with (d)’s rigidity.  
      - **Scholarly Divide:** "Uninvolved hypocrites lack standing" is defended (Wallace 2010), but contested by those who see hypocrisy as primarily an *interpersonal* wrong (Bell 2013).  

  4.  **🔄 (e) vs. Practical Realities of Standing**  
      - **Conflict:** If standing requires *acknowledgment and genuine change* (e), how can we verify this? Public blamers (per (h)) can’t prove internal reform. This risks making standing permanently forfeitable in practice.  
      - **Cost of Revision:** Softening (e) to allow *sincere apology without proven change* risks hollow performativity. Keeping (e) may limit standing to close relationships.  

  ---

  ### Settled vs. Contested in Scholarship
  - **Settled (Broad Consensus):**  
    - Hypocrisy *can* undermine standing (b)—though "standing" terminology isn’t universal (see Coates & Tognazzini 2013).  
    - Blameworthiness depends on the target’s actions/reasons (a) is standard in **attributability** theories (Scanlon 2008), but contested by **answerability** theorists (Smith 2015) who emphasize social context.  
  - **Contested (Live Disputes):**  
    - **Scope of Hypocrisy:** Is it *committing similar acts* (c) (King 2020) or *expressive inconsistency* (e.g., blaming while not caring about the norm) (Fricker 2016)?  
    - **Third-Party Standing:** Does hypocrisy *always* nullify it (f) (Todd 2019), or only in personal relationships (Bell 2013)?  
    - **Scalarity:** Is standing binary (d) or graded (Lippert-Rasmussen 2023)?  

  ---

  ### Single Best Revision: **Modify (g)**
  - **Problem:** (g) is the linchpin tension, creating inconsistency by ignoring *procedural hypocrisy* while demanding clean hands.  
  - **Revision:** Replace (g) with:  
    > *"(g) One forfeits standing only via unacknowledged relevantly similar wrongdoing (per c). However, blamers with 'clean hands' may still be *criticizable* for *procedural hypocrisy* (e.g., selective enforcement) if their blame undermines the norm’s authority—but this doesn’t negate standing."*  
  - **Why It Helps:**  
    - Preserves (b)/(c)/(f): Standing loss remains act-based.  
    - Addresses the intuition behind (g): Opportunistic blamers aren’t "off the hook," but their flaw is *integrity*, not standing.  
    - Protects (h): Public critics keep standing unless they commit similar wrongs.  
  - **Cost:** Forces a distinction between *standing to blame* and *being a good blamer*. Some may find this inelegant.  

  ---

  ### Quick Reference: How Revisions Resolve Tensions
  | Your Thesis | Conflict With | Fix | Cost |
  |------------|--------------|-----|------|
  | (g) | (b)/(c)/(f) | Demote procedural hypocrisy to blamer integrity (not standing) | Splits moral evaluation of blame |
  | (d) | Proportionality | Narrow "relevantly similar" (c) to context/severity | Weakens theoretical simplicity |
  | (f) | (h) | Limit "similar wrongs" to specific contexts (e.g., corporate fraud) | Risks arbitrariness |

  Your core (a)/(b) distinction is defensible—**blameworthiness is agent-relative; standing is relational**. The real fragility lies in (g)’s overreach. Tightening hypocrisy to *act-based* forfeiture (c) while acknowledging *procedural hypocrisy* as a separate flaw resolves most tensions without collapsing your framework. Teach the distinctions boldly—but flag the contested debates.
