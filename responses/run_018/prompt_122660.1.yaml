     - Q1: yes
     - Q2: yes
     - Q3: yes
     - Q4: no (threat may undermine reasons-responsiveness, so not responsible)
     - Q5: yes (reward: may not undermine, so responsible)
     - Q6: yes
     - Q7: yes
     - Q8: yes (manipulation doesn't matter if the mechanism is now reasons-responsive)

