        A1b: No -> then likely Frankfurt identification view (because they might think the manipulation breaks identification).

    But then we need to distinguish semicompatibilism and Frankfurt view. Use another question? We have more questions.

    For branch A1 (yes to Q1 and yes to Q7), we have not asked Q2, Q3, etc.

    We need to ask about the other cases to separate.

    For example, in threat case (Q4), semicompatibilists might say yes or no depending on whether the threat undermines reasons-responsiveness. Typically, in a severe threat, they might say not responsible. Similarly, Frankfurt view might say not responsible if the threat causes the agent not to identify with the desire.

