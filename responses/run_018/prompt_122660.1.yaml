  5. Source incompatibilism:
     - Q1: yes (AP not needed)
     - Q2: yes
     - Q3: yes
     - Q4: no or yes? Source incompatibilism doesn't necessarily say anything about threat. They might say not responsible in threat because of coercion, but their main point is about history.
     - Typically, source incompatibilism says no in manipulation and no in plain determinism.
     - So:
     - Q1: yes
     - Q7: no (plain determinism: not responsible)
     - Q8: no (manipulation: not responsible)
     - For the others, it might vary, but we can set:
     - Q2: yes
     - Q3: yes
     - Q4: no
     - Q5: no
     - Q6: yes

  6. Skepticism (about desert-entailing control):
     - This can be a codicil. The skeptical position might say no in all or most, especially for the desert question. But they might say not responsible in plain determinism and manipulation, and also in Frankfurt cases.
     - So pattern might be:
     - Q1: no
     - Q2: no
     - Q3: no
     - Q4: no
     - Q5: no
     - Q6: no (or yes, but they might say not deserving of blame)
     - Q7: no
     - Q8: no

   But they might also say yes in some cases for forward-looking reasons, but for the tree, we are asking about moral responsibility in the desert-entailing sense.

   We can have a leaf for skepticism and also allow other leaves to have the skeptical codicil (which is a practical stance).

   In the scoring key, we can have a separate leaf for skepticism and note that if the respondent's pattern is mostly 'no' and they endorse the forward-looking practice, they are in the skeptical leaf.

