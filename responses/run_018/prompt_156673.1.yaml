answer: |-
  **Exam Question: The Normative-Descriptive Tension in Everettian Branch Weighting**  

  You are granted the standard decision-theoretic derivation of the Born rule in Everettian quantum mechanics (e.g., Deutsch-Wallace), where rational agents maximize expected utility using squared amplitudes as branch weights. Now consider the *epistemic invariance constraint*: because the universal wavefunction evolves unitarily and all branches are equally real, a rational agent’s epistemic situation—including their grounds for assigning credences—must be identical in every branch. Any deviation would violate the deterministic symmetry of branching.  

  **Tasks:**  
  1. **Identify the problematic principle:** Pinpoint where the decision-theoretic argument introduces a *weighted principle of indifference* over branches (i.e., treating amplitude-squared as a prior weight). Explain why this principle either:  
     - (i) *Begs the question* against Everett’s determinism (by presupposing probabilistic "chances"), or  
     - (ii) *Smuggles in a probabilistic assumption* incompatible with branch invariance.  
  2. **Assess epistemic invariance:** Can this constraint be satisfied without either:  
     - (i) Collapsing the multiverse into a single-world theory (e.g., hidden variables), or  
     - (ii) Reducing branch weights to subjective *self-locating uncertainty* (which undermines Everett’s deterministic appeal)? Justify your answer.  
  3. **Evaluate the measurement problem:** Does this tension show that the many-worlds interpretation *fails to solve the measurement problem* (by not recovering objective probabilities)? Or does it instead require *reconceiving "probability"* as purely normative in a branching universe?  

  ---  
  **Model Answer (689 words):**  

  The decision-theoretic derivation of the Born rule relies on a *weighted principle of indifference* that covertly assumes the very probabilistic structure it seeks to justify. When an agent faces branching, the argument prescribes indifference over future branches *weighted by squared amplitude*. For instance, in Wallace’s axioms, branch "multiplicity" is defined via amplitude, and rationality demands betting in proportion to these weights. This weighting is introduced when equating quantum games with classical lotteries: branches are treated as possible outcomes with pre-assigned "fair" weights. Yet this begs the question against Everett’s deterministic framework. Branching is not stochastic; all outcomes *deterministically* occur. To impose weights as priors is to presuppose that amplitude-squared measures "objective chance" of experiencing a branch—a notion Everett explicitly rejects. If no physical fact distinguishes branches beyond amplitude, weighting indifference by |ψ|² smuggles in probability *before* deriving it, violating the invariance constraint that agents’ epistemic grounds must be branch-independent.  

  The epistemic invariance constraint cannot be satisfied if branch weights are *descriptive*. If probabilities describe "which branch an agent is in," invariance is violated: agents exist in every branch, so no unique "location" can be assigned. Descriptive probabilities imply a further fact (e.g., "I am probably in high-weight branches"), but Everett denies such facts—all branches are equally actual. Avoiding this requires either:  
  - **Collapse to single-world realism**: By adding hidden variables (e.g., Bohmian trajectories), one branch is privileged, restoring unique "location." But this abandons Everett’s core tenet: universal unitarity without hidden variables.  
  - **Self-locating uncertainty (SLU)**: Agents might express ignorance about "which branch I am in," treating weights as credences. Yet SLU undermines determinism. In unitary evolution, agents *split*—they do not "wake up" in one branch. SLU misapplies probability to a *multiplicity* of future selves, each equally real. Worse, it implies a *preexisting self* that might "land" in a branch, contradicting the emergence of persons via branching.  

  This tension does not prove Everett *fails* the measurement problem. The measurement problem concerns how unitary dynamics yields definite outcomes without collapse. Everett solves this *ontologically*: all outcomes define branches. The Born rule problem is distinct—it asks why we observe statistics matching |ψ|². The tension here reveals that "probability" must be *reconceived as purely normative*. Weighted indifference cannot be descriptive without violating invariance or determinism. Instead, branch weights are *rational constraints on action*: given branching, agents ought to care about future selves proportional to |ψ|². No "objective probability of occurrence" exists—only a prescription to apportion concern. This rescues determinism: branching is fixed, but rational agents *treat* branches *as if* they were probabilistic for decision-making.  

  However, this normative move risks circularity. If weights are not inherent to branching, why should |ψ|² dictate concern? The decision-theoretic argument answers: violating it guarantees suboptimal outcomes *across the multiverse* (e.g., an agent who bets against |ψ|² will have more future selves losing). Yet this "pragmatic" justification still relies on *summing utilities over branches*—which already assumes weighted indifference. Thus, the derivation either presupposes probabilistic ontology (begging the question) or accepts normativity as primitive. The latter reconceives probability: it is not about "what happens" (everything happens), but "how to act" given inevitable multiplicity. Everett thus solves the measurement problem ontologically but replaces objective probability with *objective rationality*.  

  ---  
  **Marking Scheme:**  
  **A (First-class) Answer Must:**  
  - **Identify the weighted principle of indifference** in decision theory (e.g., Wallace’s branching indifference axiom) as the point where |ψ|² is imported as a prior weight for branches.  
  - **Explain the circularity**: Weighted indifference either (i) *presupposes probabilistic chances* (contradicting Everett’s determinism), or (ii) *smuggles probability* by treating amplitude as a "fair" weighting factor without justification under invariance.  
  - **Reject descriptive probability**: Clearly state that if weights describe "occurrence probability," they violate invariance (no unique agent location) or require hidden variables.  
  - **Resolve via normativity**: Argue that the tension forces probability to be normative—a rule for rational action, not description—and that this does *not* undermine the measurement solution (which is ontological).  
  - **Concede the circularity challenge**: Note that normativity may still rely on weighted sums, which require prior justification.  

  **B (Upper second-class) Answer Might:**  
  - Correctly locate the decision-theoretic use of branch weights but ambiguously characterize it (e.g., calling it "necessary for rationality" without noting the circularity).  
  - Recognize the invariance problem but conflate descriptive/normative probability (e.g., suggesting weights are "objective" but not ontically distinct).  
  - Propose SLU or descriptive weights as solutions without seeing how they violate determinism or invariance.  
  - Claim Everett "fails" without addressing how normativity redefines probability’s role.  
  - Focus on technical axioms without tying them to the conceptual tension.  

  ---  
  **Verdict:** An A answer must recognize that decision theory’s use of weighted indifference *presupposes normativity* while simultaneously *requiring it as a prior*, creating a circularity that exposes probability as irreducible to descriptive facts in Everett.
