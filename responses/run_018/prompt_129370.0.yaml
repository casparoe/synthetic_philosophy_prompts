answer: |-
  Here's your tailored Q&A prep sheet, ordered by potential damage if unanswered, with replies calibrated for your specific audience. Confidence ratings (High/Moderate/Low) reflect philosophical defensibility; your **least certain point** is flagged in Objection 1.

  ---

  ### **Q&A Prep: Restricted Ontological Identification (ROI)**
  **Core Thesis:** *Entities permanently informationally inaccessible across all possible epistemic frames are ontologically identical. Distinguishing them introduces "empty structure." Applied to fiction: Indistinguishable possible worlds in a narrative’s modal backdrop should not be multiply reified.*

  ---

  ### **Objection 1 (Most Damaging + Your Dreaded Scenario)**  
  **Charge:** *"ROI collapses modal distinctions by rendering necessary and contingent properties epistemically indistinguishable. If two entities (e.g., worlds) are identified solely due to epistemic inaccessibility, you conflate metaphysical contingency with epistemic limits. This undermines modal discourse, making ‘could have been otherwise’ claims vacuously true or false."*  
  **Reply (Confidence: Moderate):**  
  "ROI doesn’t erase modal properties; it constrains *reification*. Necessity/contingency are *de dicto* features of propositions, not *de re* properties of indiscernible entities. We retain modal logic’s syntactic distinctions while rejecting ontologically redundant entities. Empty structure arises only when we *multiply* entities lacking possible grounding relations."  
  **Weakness:** Distinguishing *de re* contingency from epistemic indiscernibility relies on the *possibility* of access to justify non-identity. This risks circularity if "possibility" presupposes non-collapse.  
  **Softest Point:** Defending *de re* contingency without epistemic anchors may sound like special pleading.  

  ---

  ### **Objection 2 (Highly Damaging)**  
  **Charge:** *"You conflate epistemology and ontology. Informational inaccessibility is an epistemic constraint, but ontological parsimony (Ockham’s Razor) applies only to causal/structural grounds. ROI illicitly elevates an epistemic failure to an ontological criterion."*  
  **Reply (Confidence: High):**  
  "ROI targets scenarios where no *possible* causal-nomological structure could discriminate entities—this isn’t mere epistemic limitation but a *modal* constraint on physical realizability. If no experiment, even counterfactually, could distinguish them, positing multiplicity adds no explanatory power to our best theories."  
  **Weakness:** Assumes "possible causal-nomological structure" is ontologically prior to individuation. Critics may argue individuation is primitive.  

  ---

  ### **Objection 3 (Highly Damaging)**  
  **Charge:** *"Formal undefinability: How do you rigorously define ‘epistemic frame’ or ‘in principle inaccessible’ without invoking circular modal semantics? Logically, ROI requires quantifying over all possible observers/models, risking paradoxes of totality."*  
  **Reply (Confidence: Moderate):**  
  "We define accessibility relative to a *physicalizable* model (e.g., within quantum information theory’s ‘no-signaling’ principle). Formally, if for all admissible models *M*, entities *x* and *y* satisfy ∀φ(◇φ(x) ↔ ◇φ(y)), then *x=y*. This avoids totality by restricting to physically realizable frames."  
  **Weakness:** "Admissible models" may exclude metaphysically possible but non-physicalizable observers, inviting charges of physicalist bias.  

  ---

  ### **Objection 4 (Moderately Damaging)**  
  **Charge (Philosopher of Fiction):** *"Literary practice requires a ‘rich’ modal space: Characters’ counterfactual reasoning (e.g., ‘If I had acted differently…’) presupposes non-actualized possibilia. ROI’s sparse backdrop cannot support normative or psychological analyses of fictional modality."*  
  **Reply (Confidence: High):**  
  "ROI targets *backdrop* ontology, not character-level modal attitudes. A fiction can reference ‘other possible worlds’ as intentional objects without ontologically committing to indistinguishable ones. Just as we reduce coincident objects in persistence, we reduce coincident worlds in fiction."  
  **Weakness:** If a fiction *explicitly* describes two indiscernible worlds (e.g., through an omniscient narrator), ROI forces identification, potentially contradicting authorial intent.  

  ---

  ### **Objection 5 (Moderately Damaging)**  
  **Charge:** *"ROI’s ‘empty structure’ accusation unfairly stigmatizes structural realists. They distinguish entities *by* relational positions in a structure, even if intrinsic properties are inaccessible. Isn’t ROI just verificationism rebranded?"*  
  **Reply (Confidence: Moderate):**  
  "Structural realism requires *discernible* relational differences. If two putative nodes in a structure share all extrinsic/intrinsic relations *and* are mutually inaccessible, the structure has redundant symmetry. ROI generalizes this: indiscernible relata collapse. Verificationism targets meaning; ROI targets ontological economy."  
  **Weakness:** Structural realists may argue that "positional" differences suffice for individuality even without discernibility.  

  ---

  ### **Objection 6 (Less Damaging but Probable)**  
  **Charge:** *"Parsimony arguments like ROI conflate *simplicity* with *truth*. Ontological inflation may be inelegant, but why think it’s *false*? Science often posits symmetric structures (e.g., gauge redundancies) we don’t eliminate."*  
  **Reply (Confidence: High):**  
  "Science eliminates *redundant* structure when it lacks empirical consequences (e.g., equivalence classes in gauge theories). ROI extends this: If a distinction generates no *possible* difference-makers, it’s not just pragmatically otiose—it’s *metaphysically* unreal. Elegance here tracks ontological grounding."  
  **Weakness:** Some argue symmetries are physically significant (e.g., in quantum gravity), making elimination contentious.  

  ---

  ### **Key Strategic Notes**  
  1. **Your Weakest Point:** Defending *de re* modality against collapse (Objection 1). Lean into *de dicto* necessity to avoid grounding contingency in entities.  
  2. **Audience Alignment:** Emphasize ROI as a *constraint on reification*, not an epistemic reduction of modality. Use scientific underdetermination examples (e.g., quantum symmetries).  
  3. **Logician Trap:** Preemptively clarify that "epistemic frames" mean *physically realizable models*, not possible worlds semantics.  
  4. **Confidence Summary:**  
     - Highest: Objections 4 & 6 (fiction applicability, parsimony defense).  
     - Moderate: Objections 1, 3, 5 (modal collapse, formalization, structuralism).  
     - **Least Certain:** Contingency preservation in Objection 1.  

  **Final Tip:** Open with a scientific case (e.g., identifying indistinguishable quantum states) to ground ROI’s plausibility before literary application. This disarms "epistemic vs. ontological" skeptics early.
