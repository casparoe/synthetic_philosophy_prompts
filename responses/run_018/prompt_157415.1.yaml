answer: |-
  **Joint Statement on Bounded Rationality:  
  Adversarial Collaboration Between Procedural Rationalist and Constrained Optimizer Camps**

  ### I. Jointly Endorsed Claims  
  Both parties endorse the following propositions:  

  1. **Formal Structure of Choice Sets and Stopping Rules**:  
     Decision-makers face sequential search problems where alternatives are evaluated one at a time. Stopping rules—whether satisficing (terminating when an option meets an aspiration level) or reservation-value-based (terminating when an option exceeds a threshold)—determine when search ends. Choice sets need not be fully enumerated or globally compared.  

  2. **Empirical Reality of Cognitive and Organizational Limits**:  
     Humans and organizations operate under inescapable constraints: finite working memory, attentional bottlenecks, and computational limitations. These constraints necessitate heuristic procedures that forgo exhaustive search or utility maximization, particularly in complex or uncertain environments.  

  3. **Simon’s Administrative Studies on Aspiration Adjustment**:  
     Empirical work (e.g., Simon 1955) demonstrated that aspiration levels (a) adapt dynamically to experience (e.g., rising after successes, falling after failures), (b) are influenced by social and organizational norms, and (c) drive search initiation/termination in ways incongruent with static optimization.  

  4. **Termination of Search Without Global Comparison**:  
     Agents terminate search without comparing all alternatives when:  
     (a) An option surpasses a threshold (aspiration or reservation value);  
     (b) Search costs exceed anticipated marginal gains;  
     (c) Institutional routines (e.g., fixed review periods) mandate stopping.  

  ---

  ### II. Disagreements Table  
  *Each camp states its view in self-accepted wording and neutrally describes the opposing view. Cruxes include predictions for agreed-upon test cases.*  

  | **Crux Issue** | **Procedural Rationalist (PR) View** | **Constrained Optimizer (CO) View** |
  |----------------|--------------------------------------|-------------------------------------|
  | **(a) Aspiration Level: Representational Threshold or Implicit Price?** | |
  | **PR View:**<br>Aspiration levels are cognitively distinct reference points that directly trigger decisions. They function as internal thresholds shaped by learning, emotions, and social cues, not merely as shadow prices. | **CO View:**<br>Aspiration levels are implicit reservation values endogenizing the marginal cost of search. They emerge from optimization under information costs and lack independent psychological reality beyond this constraint. |
  | **PR Description of CO View:**<br>Constrained optimizers treat aspiration levels as reduced-form proxies for opportunity costs in dynamic programming. | **CO Description of PR View:**<br>Procedural rationalists treat aspiration levels as adaptive constructs decoupled from explicit cost-benefit calculus. |
  | **Agreed Test Case:** *Job searchers adjusting aspirations after prolonged unemployment.*<br>- **PR Prediction:** Aspirations decline faster than opportunity-cost models predict, driven by emotional toll or peer comparisons.<br>- **CO Prediction:** Aspirations decline at a rate consistent with Bayesian updating of labor-market expectations and search-cost constraints. |
  | | |
  | **(b) Sequential Search: Reducible to Single-Period Optimization?** | |
  | **PR View:**<br>Sequential search with satisficing is irreducible to single-period optimization. Stopping rules (e.g., "accept first satisfactory option") are procedurally distinct: they require no global value computation and exploit local feedback. | **CO View:**<br>Satisficing with a fixed aspiration level is formally equivalent to optimal stopping with a reservation value. Any observed behavior can be modeled as constrained optimization over search trajectories. |
  | **PR Description of CO View:**<br>Constrained optimizers reduce sequential heuristics to equivalent single-period choice problems with endogenous thresholds. | **CO Description of PR View:**<br>Procedural rationalists deny the formal isomorphism, emphasizing process differences over outcomes. |
  | **Agreed Test Case:** *Homebuyers using a "three-viewings-then-decide" rule.*<br>- **PR Prediction:** Buyers terminate after three viewings regardless of option quality, per procedural commitment.<br>- **CO Prediction:** Buyers adjust viewing limits dynamically to maximize expected utility (e.g., extending search if early options are poor). |
  | | |
  | **(c) Ecological Rationality: Causal Mechanism or Redescription?** | |
  | **PR View:**<br>Ecological rationality is causal: accuracy stems from heuristics exploiting environmental structures (e.g., non-compensatory cues). This requires no optimization; it is an emergent match between rules and ecology. | **CO View:**<br>Ecological rationality redescribes efficient search. Heuristics succeed only insofar as they approximate optimal Bayesian inference given environmental statistics and computation costs. |
  | **PR Description of CO View:**<br>Constrained optimizers recast ecological fits as instances of optimal information acquisition under constraints. | **CO Description of PR View:**<br>Procedural rationalists attribute success to direct heuristic-environment interaction, bypassing optimization logic. |
  | **Agreed Test Case:** *"Take-the-best" heuristic (selecting options via one-reason decision-making) in high-validity environments.*<br>- **PR Prediction:** Accuracy matches optimal models, but with lower cognitive effort and no probability calculations.<br>- **CO Prediction:** Accuracy aligns with optimal Bayesian classifiers using the same information; effort reduction is endogenous to cost constraints. |
  | | |
  | **(d) Normative Satisficing: Transferable to Artificial Agents?** | |
  | **PR View:**<br>Satisficing is normatively justified for humans due to hard cognitive limits. For AI with explicit utilities and search budgets, it is only defensible if optimization is intractable (e.g., NP-hard problems) or robustness trumps precision. | **CO View:**<br>Satisficing is always suboptimal for artificial agents unless it implements a computed reservation value. Heuristics without optimization foundations risk arbitrariness. |
  | **PR Description of CO View:**<br>Constrained optimizers endorse satisficing for AI only when it explicitly solves a constrained-optimization problem. | **CO Description of PR View:**<br>Procedural rationalists defend satisficing for AI in complex environments even without optimization guarantees. |
  | **Agreed Test Case:** *AI agent playing real-time chess with fixed computation time.*<br>- **PR Prediction:** Satisficing (e.g., accepting first "good enough" move) outperforms optimization in win-rate under time constraints.<br>- **CO Prediction:** Optimization with a dynamically set reservation value (e.g., expected board value) dominates fixed satisficing. |

  ---

  ### Verbal Disagreement Note  
  The dispute over **Crux (b)** partially hinges on terminology.  
  - **Procedural Rationalists** define "optimization" as requiring *global comparison* or *full utility maximization*, which they reject as descriptively implausible.  
  - **Constrained Optimizers** define "optimization" as *any process that maximizes expected utility subject to costs*, including local improvements converging to global solutions.  
  This wording divergence obscures agreement that agents *behave as if* using thresholds, but disagrees on whether thresholds are computed or procedural. Substance diverges on cognitive implementation, not functional outcomes.  

  ---  
  *This document, comprising jointly endorsed claims and clarified disagreements, is signed by both camps as a basis for ongoing research.*
