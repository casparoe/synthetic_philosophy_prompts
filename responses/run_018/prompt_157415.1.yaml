prompt: |-
  After a long argument with my friend about whether bounded rationality describes a real cognitive limit or merely an optimal response to information costs, I want us to stop talking past each other. Draft the joint statement of an adversarial collaboration between a procedural-rationalist camp, in the Simon tradition—treating aspiration levels, sequential search, and organizational decision processes as genuinely distinct mechanisms—and a constrained-optimization camp, in the neoclassical search-theory tradition—treating satisficing as endogenous reservation-value optimization under computation or sampling costs. The statement should open with a numbered section of claims both sides can sign, covering: the formal structure of choice sets and stopping rules; the empirical reality of cognitive and organizational limits; what Simon’s administrative studies actually demonstrated about aspiration adjustment; and the conditions under which agents terminate search without global comparison. Next, present a disagreements table with two columns—Procedural Rationalist and Constrained Optimizer—each stating its own view in wording it fully accepts and describing the opposing view in neutral terms neither side rejects. The cruxes must include: (a) whether an aspiration level functions as an internal representational threshold or merely as an implicit price constraint; (b) whether sequential search with a stopping rule is formally reducible to single-period optimization with an endogenously chosen reservation value; (c) whether ecological rationality—environment-structure matching that makes simple heuristics accurate—is a separate causal mechanism or only a redescription of efficient search given environmental statistics; and (d) whether the normative justification for satisficing in human cognition, if any, carries over to artificial agents with explicit utility functions and programmable search budgets. For each crux, specify a concrete model, empirical pattern, or decision case that both sides agree bears on the issue, and record in advance what each side predicts about that case. If any portion of the dispute turns out to be verbal—for example, over whether “optimization” requires global comparison or only local improvement—identify precisely which portion and explain why the wording rather than the substance diverges. Do not include bibliographies, citations, or reading lists; the document should be writable without access to external sources. Keep the tone formal, the formulations exact, and the residual disagreements sharp enough that either party could sign its own column without feeling misrepresented.
reasoning: |-
  We are drafting a joint statement for an adversarial collaboration between two camps in decision theory: the Procedural Rationalist camp (in the tradition of Herbert Simon) and the Constrained Optimizer camp (in the neoclassical tradition of search theory). The statement has two main parts: (1) a numbered section of claims both sides can agree on, and (2) a disagreements table with two columns (one for each camp) and four cruxes (a-d). For each crux, we also specify a concrete case and record each camp's prediction.

  Let's structure the document:

  I. Joint Agreement Section (numbered)
     We cover:
     1. The formal structure of choice sets and stopping rules.
     2. The empirical reality of cognitive and organizational limits.
     3. What Simon’s administrative studies demonstrated about aspiration adjustment.
     4. The conditions under which agents terminate search without global comparison.

  II. Disagreements Table (with two columns: Procedural Rationalist and Constrained Optimizer)
     For each of the four cruxes (a-d), we have:
     - A statement of the crux issue.
     - A concrete model, empirical pattern, or decision case that both sides agree bears on the issue.
     - The prediction of each camp for that case.

     Additionally, we note if any part of the dispute is verbal (e.g., definition of "optimization").

  We must keep the tone formal and exact.

  Let's draft:

  ---

  **Joint Statement on Bounded Rationality: Adversarial Collaboration Between Procedural Rationalist and Constrained Optimizer Camps**

  **I. Jointly Endorsed Claims**

  Both parties to this collaboration endorse the following claims:

  1. **Formal Structure of Choice Sets and Stopping Rules**: Decision problems often involve sequential search over a set of alternatives, where the agent applies a stopping rule to terminate search and select an option. The choice set may be encountered sequentially, and the stopping rule may depend on the history of observed options and/or internal states (such as an aspiration level).

  2. **Empirical Reality of Cognitive and Organizational Limits**: Human decision-makers and organizations face constraints on information processing, including limited memory, attention, and computational capacity. These constraints prevent exhaustive search and comparison in complex environments. Organizations also impose procedural constraints that shape decision processes.

  3. **Simon’s Administrative Studies on Aspiration Adjustment**: Simon’s empirical work demonstrated that in organizational settings, aspiration levels (a) are adjusted over time in response to experience (e.g., success raises aspirations, failure lowers them), (b) are influenced by social comparisons and institutional norms, and (c) serve as reference points that determine when search is initiated or terminated. These adjustments are not always instantaneous or perfectly calibrated.

  4. **Conditions for Terminating Search Without Global Comparison**: Agents often terminate search without comparing all possible alternatives. This occurs when (a) an option meets or exceeds an aspiration level, (b) the cost of further search (in time, effort, or opportunity) is deemed too high relative to expected improvement, or (c) institutional rules or habits dictate a stopping point.

  **II. Disagreements**

  The table below outlines the core disagreements. For each crux, the Procedural Rationalist (PR) camp states its view in wording it accepts, and the Constrained Optimizer (CO) camp does the same. Each camp also describes the opposing view in neutral terms that the other camp would not reject as a misrepresentation. Following each crux, a concrete case is presented along with the predictions of each camp.

  | Crux Issue | Procedural Rationalist (PR) View | Constrained Optimizer (CO) View |
  |------------|----------------------------------|---------------------------------|
  | **(a) Nature of Aspiration Level** | **PR View:** An aspiration level functions as an internal representational threshold that is psychologically salient and directly triggers choice when exceeded, without requiring explicit comparison to all alternatives. This threshold is adjusted through learning and social processes and is not merely a shadow price. <br><br>**PR Description of CO View:** The constrained optimization camp views the aspiration level as an endogenously determined reservation value that reflects the opportunity cost of continued search, effectively acting as a constraint in an optimization problem. | **CO View:** An aspiration level is an implicit price constraint that emerges as the reservation value in an optimal stopping problem, where it equates the marginal cost of further search with the expected marginal benefit. It is a component of an optimal strategy under information costs. <br><br>**CO Description of PR View:** The procedural rationalist camp views the aspiration level as a cognitive heuristic that serves as a stopping criterion, which is updated adaptively but not necessarily in a way that maximizes expected utility. |
  | *Concrete Case*: **Job search with a fixed search cost per period and a known distribution of wage offers.** <br> - *PR Prediction*: Job seekers will set an initial aspiration level based on social norms or past experience and adjust it adaptively (e.g., lowering it after repeated failures). They may accept a job that meets their current aspiration even if it is below the theoretical reservation wage. <br> - *CO Prediction*: Job seekers will compute (exactly or approximately) the reservation wage that maximizes expected net benefit and will accept the first offer above that reservation wage. Aspiration levels, if measured, will align with the computed reservation wage. |
  | **(b) Reducibility of Sequential Search** | **PR View:** Sequential search with a stopping rule is not formally reducible to a single-period optimization because the cognitive processes involve step-by-step evaluation and adaptive rule-following, which may not internally represent the global optimum. The stopping rule is a procedural heuristic that can be understood without positing an endogenous reservation value. <br><br>**PR Description of CO View:** The constrained optimization camp models sequential search as equivalent to a single-period optimization problem in which the agent chooses a reservation value that maximizes expected utility given search costs. | **CO View:** Any sequential search process with a well-defined stopping rule can be formally represented as the solution to a single-period optimization problem in which the reservation value is endogenously chosen to maximize expected utility, net of search costs. The sequential aspect is a computational implementation of this optimal policy. <br><br>**CO Description of PR View:** The procedural rationalist camp emphasizes that the actual cognitive process of sequential search does not involve computing a reservation value but rather applies simple rules (like satisficing) that are computationally feasible. |
  | *Concrete Case*: **Consumer choosing a rental apartment by visiting options one by one, with a cost per visit.** <br> - *PR Prediction*: Consumers will use a satisficing rule (e.g., "accept the first apartment that meets my minimum requirements on key attributes") and will not compute a reservation value. They may stop even if they have not found the globally best option. <br> - *CO Prediction*: Consumers will behave as if they have a reservation value (which may be approximated by experience) and will stop when they find an option above that value. The stopping rule is consistent with optimal stopping theory. |
  | **(c) Ecological Rationality** | **PR View:** Ecological rationality is a distinct causal mechanism: simple heuristics are accurate because they exploit statistical structures in the environment (e.g., cue validities), and this matching is a result of adaptive learning or evolution, not explicit optimization. The heuristics work because of environmental structure, not because they solve an optimization problem. <br><br>**PR Description of CO View:** The constrained optimization camp views ecological rationality as a redescription of efficient search: heuristics that perform well do so because they are adapted to the environment, which is equivalent to being optimal given the environmental statistics and computational constraints. | **CO View:** Ecological rationality is a redescription of efficient search: heuristics that are ecologically rational are those that, given the statistical structure of the environment and the costs of information processing, approximate the solution to an optimization problem. There is no separate causal mechanism; it is optimization under constraints. <br><br>**CO Description of PR View:** The procedural rationalist camp holds that ecological rationality arises from the direct matching of heuristic rules to environmental regularities without the need for optimization, and that this matching can be studied independently of optimization models. |
  | *Concrete Case*: **The "take-the-best" heuristic in binary choice (selecting the option with the first discriminating cue in a validity-ordered list).** <br> - *PR Prediction*: In environments where cues have high validity and are non-compensatory, the heuristic will achieve high accuracy with little computation. This success is due to the environmental structure and does not require the agent to compute expected utilities. <br> - *CO Prediction*: The heuristic is a computationally efficient approximation to the optimal Bayesian decision rule in environments with similar statistical properties. Its success is explained by its efficiency in trading off accuracy and computation costs. |
  | **(d) Normative Justification for Satisficing in Artificial Agents** | **PR View:** Satisficing is normatively justified for human cognition due to cognitive limits, and this justification does not automatically carry over to artificial agents. For artificial agents with explicit utility functions and programmable search budgets, satisficing may still be useful as a robust strategy in complex or uncertain environments, but it is not necessarily superior to optimization if computational resources are sufficient. <br><br>**PR Description of CO View:** The constrained optimization camp holds that for artificial agents, satisficing can only be normatively justified as an approximation to optimal search when optimization is computationally infeasible; otherwise, explicit optimization is preferred. | **CO View:** The normative justification for satisficing in humans (as a response to computational limits) does carry over to artificial agents: when optimization is costly, satisficing with an appropriately set aspiration level is the optimal strategy. For artificial agents with known utility functions, the aspiration level should be set to the optimal reservation value. <br><br>**CO Description of PR View:** The procedural rationalist camp argues that satisficing may have independent normative value for artificial agents in environments where robustness, speed, or simplicity are valued beyond what is captured by a utility function, or when the utility function is not fully known. |
  | *Concrete Case*: **Designing an AI agent for real-time strategy games with limited computation time per move.** <br> - *PR Prediction*: A satisficing agent (e.g., one that stops search when a move meets a dynamically adjusted aspiration level) may outperform an optimization-based agent in complex, time-pressured environments because it avoids overcomputation and adapts to changing conditions. <br> - *CO Prediction*: An agent that sets its aspiration level (reservation value) optimally based on the remaining time and expected value of further search will outperform a satisficing agent with fixed or naively adjusted aspiration levels. Satisficing is only normatively justified if it implements the optimal stopping rule. |

  **Verbal Disagreement Note**: 

  A portion of the dispute over crux (b) is verbal. The term "optimization" is used differently: 
  - The PR camp uses "optimization" to mean a process that involves explicit global comparison and maximization (which they reject as cognitively unrealistic in many cases). 
  - The CO camp uses "optimization" to mean any process that can be formally modeled as maximizing expected utility (which may be achieved by local rules without global comparison). 

  Thus, when the PR camp says sequential search is not reducible to optimization, they mean it does not require the agent to perform global maximization. The CO camp, however, sees the reduction as formal: the behavior is consistent with optimization even if the cognitive process is local. This difference in the meaning of "optimization" (process vs. outcome) explains part of the disagreement without substantive divergence on the observed behavior.

