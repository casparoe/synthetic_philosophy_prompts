  ### Sen's Liberal Paradox: Proseminar Game Plan  
  **Goal:** Experience the paradox through hands-on dilemmas, avoiding immediate "impossibility" framing. Focus on sympathetic interventions, expose the "private sphere" illusion, and explore rights as waivable options.

  ---

  ### **Round 1: Sympathetic Meddling**  
  **Scenario:** Your overworked colleague Alex is burnt out. The group must rank alternatives for Alex:  
  - **A:** Alex takes a full day off.  
  - **B:** Alex works a half-day.  
  - **C:** Alex works a full day.  

  **Preference Cards** (14 participants):  
  - **"Alex’s Friend" (1 person):**  
    - *Preference:* A > B > C  
    - *Protected Pair:* (A, B)  
    - *Why?* You care about Alex’s health. A day off (A) is best, but a half-day (B) is better than forcing them to work full-time (C). You’re decisive here because you know Alex best.  

  - **"Team Realist" (1 person):**  
    - *Preference:* B > C > A  
    - *Protected Pair:* (B, C)  
    - *Why?* A half-day (B) balances rest and productivity. Canceling work (A) would delay a critical deadline. As team leader, you’re decisive on workload intensity.  

  - **"Project Advocates" (12 people):**  
    - *Preference:* C > A > B  
    - *No protected pair.*  
    - *Why?* The project is at risk. Alex working (C) is safest. A day off (A) is better than a half-day (B), which causes chaos.  

  **Rules for Rule-Enforcer:**  
  1. You must create **one group ranking** (A vs. B vs. C).  
  2. Respect **decisiveness**: If someone has a protected pair, the group ranking *must* match their preference for that pair.  
  3. Respect **unanimity**: If *everyone* prefers X > Y, the group ranking *must* have X > Y.  
  4. No ties allowed.  

  **Why this cycles:**  
  - Alex’s Friend forces **A > B** (decisiveness).  
  - Team Realist forces **B > C** (decisiveness).  
  - Unanimity on **C > A?** Project Advocates prefer C > A, but Alex’s Friend prefers A > C → *no unanimity*.  
  - **But...** 13/14 prefer C > A (Project Advocates + Team Realist). The rule-enforcer *must* respect this supermajority (game adaptation; Pareto requires unanimity, but this forces conflict visibly).  
  - Cycle: **A > B** (Friend) + **B > C** (Realist) + **C > A** (supermajority) → **A > B > C > A!**  

  ---

  ### **Round 2: "Private Sphere" Exposed**  
  **Scenario:** Who presents next week? Alternatives:  
  - **X:** Sarah presents.  
  - **Y:** Tom presents.  
  - **Z:** Cancel the presentation.  

  **Preference Cards:**  
  - **"Bystander" (1 person):**  
    - *Preference:* X > Y > Z  
    - *Protected Pair:* (X, Y)  
    - *Why?* Sarah’s style is clearer, but Tom is okay. You’re decisive because you organized the schedule.  

  - **"Instructor" (1 person):**  
    - *Preference:* Y > Z > X  
    - *Protected Pair:* (Y, Z)  
    - *Why?* Tom is prepared (Y); canceling (Z) is better than Sarah (X), who needs more time. As instructor, you’re decisive on presenter readiness.  

  - **"Audience" (12 people):**  
    - *Preference:* Z > X > Y  
    - *No protected pair.*  
    - *Why?* Canceling (Z) saves time for discussion. Sarah (X) is better than Tom (Y).  

  **Crucial Twist:**  
  Bystander’s protected pair **(X, Y)** concerns *Sarah and Tom*, not themselves. Instructor’s pair **(Y, Z)** concerns Tom’s workload.  

  **Rules:** Same as Round 1.  

  **Why this cycles (and surprises):**  
  - Bystander forces **X > Y**.  
  - Instructor forces **Y > Z**.  
  - 13/14 prefer **Z > X** (Audience + Instructor).  
  - Cycle: **X > Y > Z > X** → Still impossible!  
  **Debrief Hook:** The "private sphere" (Bystander deciding between X/Y) is a *formal condition*, not about literal privacy. The cycle persists even when rights affect others.  

  ---

  ### **Round 3: Waivable Rights**  
  **Scenario:** Same as Round 1 (Alex’s workload). New rule:  
  - Anyone with a protected pair can **waive their right** (i.e., hand their card back).  
  - If waived, the group uses **supermajority** (13/14) for that pair.  

  **Possible Outcomes:**  
  - **No one waives:** Cycle persists (as Round 1).  
  - **Alex’s Friend waives (A,B):**  
    - Supermajority (13/14) prefers **A > B** → Now **A > B** (group) + **B > C** (Realist) + **C > A** (supermajority) → Cycle **A > B > C > A**.  
  - **Team Realist waives (B,C):**  
    - Supermajority (12/14) prefers **C > B** (Audience + Friend) → Ranking: **A > B** (Friend) + **C > B** (group) + **C > A** (supermajority) → **C > A > B** (transitive: C > A, A > B → C > B). **Cycle broken!**  
  - **Both waive:** **C > A > B** (supermajority on all pairs).  

  **Key Insight:**  
  - The cycle breaks *only* if Team Realist waives. Rights as waivable options can resolve the paradox, but power matters: the "weaker" party waiving won’t help.  

  ---

  ### **Timeline (90 Minutes)**  
  1. **Intro (5 min):**  
     - Frame as "designing fair group decisions," not an impossibility proof.  
     - Assign roles: 1 rule-enforcer (randomly chosen), others get preference cards.  

  2. **Round 1 (20 min):**  
     - Rule-enforcer tries to build the ranking.  
     - *Predictable issue:* Someone suggests Alex "should want to work" (fixed preferences). Stop them: "Preferences are given; we’re testing the system, not the people."  

  3. **Debrief Round 1 (10 min):**  
     - Map the conflict:  
       - "A > B" = Liberal condition (decisiveness).  
       - "B > C" = Liberal condition.  
       - "C > A" = Pareto-like (supermajority as analog for collective agreement).  
     - Highlight: Both conditions seem ethical alone (protecting expertise + respecting majority), but clash.  

  4. **Round 2 (15 min):**  
     - Rule-enforcer tries again.  
     - *Predictable issue:* "Bystander shouldn’t decide for others!" → Agree, but the *formal condition* doesn’t care.  

  5. **Debrief Round 2 (10 min):**  
     - Q: "Did your 'private sphere' protect you? Or was it just a rule?"  
     - Point: Formally, liberalism is about *decisiveness*, not literal privacy.  

  6. **Round 3 (15 min):**  
     - Allow waiver before rule-enforcer starts.  
     - *Predictable issue:* Econ students suggest "mechanism design" (e.g., voting rules). Note: "We’re testing conditions, not fixes—save for discussion!"  

  7. **Debrief Round 3 (10 min):**  
     - Q: "Who had to waive to escape? What did we lose?"  
       - Waiving Team Realist’s right sacrifices their input on workload intensity.  
       - Waiving *all* rights sacrifices minority protections.  
     - Connect to Sen: Rights as options can avoid impossibility, but require voluntary surrender.  

  8. **Final Discussion (5 min):**  
     - "Which condition should ‘give’? Liberalism? Pareto? Why?"  
     - **Honest note:** The game uses supermajority, not strict Pareto. In Sen, Pareto requires *unanimity*. With unanimity, the cycle holds without our adaptation. State this.  

  ---

  ### **Predictable Issues & Mitigation**  
  - **"Change preferences!"**: Stop early: "Preferences reflect real disagreements; our job is to aggregate them."  
  - **Econ students "optimize"**: Acknowledge: "Mechanism design is a solution! But today, we’re diagnosing why it’s *needed*."  
  - **Why supermajority?**: "It forces a cycle visibly. Sen’s theorem uses unanimity, which also triggers cycles. We’ll discuss!"  
  - **Despair at impossibility**: Emphasize: "Sen’s point isn’t that we can’t decide—it’s that we must examine *what* we sacrifice in fair procedures."  

  **Outcome:** Students experience the paradox as a practical dilemma, not an abstract theorem. The debrief turns their frustration into debate about liberalism vs. efficiency.
