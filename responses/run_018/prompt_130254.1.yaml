answer: |-
  ### Section 1 — The Explanatory Target  
  A causal-historical theory of national prosperity must clarify which of three distinct explanatory targets it addresses:  
  1. **Cross-sectional variance**: Why are some nations richer than others *at a given historical moment* (e.g., 2020)?  
  2. **Temporal trajectories**: How does *a single polity* transition from poverty to wealth (or vice versa) *across centuries* (e.g., Britain 1500–1900)?  
  3. **Counterfactual resilience**: What would a nation’s prosperity path have been *under altered conditions* (e.g., no Belgian colonisation in Congo)?  

  A theory claiming to explain "why some nations are rich" **must cover cross-sectional variance**, as this defines comparative wealth. Temporal trajectories are essential if the theory asserts path-dependency (e.g., "institutions persist"). Counterfactual resilience is necessary for causal claims about specific factors (e.g., colonisation). A theory covering *only one* target incurs **explanatory costs**: ignoring cross-section forfeits comparative power; ignoring trajectories risks ahistorical statism; ignoring counterfactuals reduces policy relevance. While legitimate for narrow aims, single-target theories cannot claim comprehensive causal authority.  

  ---

  ### Section 2 — The Desiderata  
  **(a) Reversal-of-Fortune Without Institutional Reductionism**  
  *Requirement*: Explain why high pre-colonial population density (e.g., Mughal India, Aztec Mexico) later correlates with poverty *without presuming* extractive institutions were geography’s inevitable result.  
  *Logic*: Geographic theories might argue dense populations invited exploitative colonisation; institutionalists might claim density enabled extractive rule. An adequate theory must allow for *alternative pathways* (e.g., disease burdens crippling post-colonial state capacity independently).  

  **(b) Disentangling Causal vs. Epiphenomenal Institutions**  
  *Requirement*: A criterion to distinguish institutions *causing* wealth (e.g., property rights) from those merely reflecting prior geographic advantages (e.g., fertile land enabling centralised bureaucracy).  
  *Logic*: Institutions arising *after* geographic constraints (e.g., Scandinavian trade laws adapting to poor soils) are likelier causal; those persisting when geography changes (e.g., Botswana’s democracy post-diamond discovery) resist epiphenomenality.  

  **(c) Non-Temporal Causal Priority**  
  *Requirement*: A principle to assign causal primacy among geography, culture, and institutions when all co-exist historically.  
  *Logic*: Temporal order alone fails (e.g., geography precedes institutions but may not determine them). Instead, test *constraint mechanisms*: geography sets initial opportunity costs; culture filters institutional adoption; institutions lock in incentives.  

  **(d) Scandinavian and Resource-Curse Consistency**  
  *Requirement*: Explain both Scandinavia (wealthy despite poor soils/cold) and resource-cursed states (poor despite minerals/oil).  
  *Logic*: Rules out monocausal geographic determinism *and* naïve institutionalism. Forces theories to model *interactions* (e.g., resource abundance enabling patronage *only* when accountability is weak).  

  **(e) De Jure vs. De Facto Distinction**  
  *Requirement*: Separate formal rules (e.g., constitutions) from informal power (e.g., elite networks). Explain why conflating them undermines causation.  
  *Logic*: Conflation misattributes outcomes (e.g., "democratic" Mexico under PRI was de facto oligarchic). Causal power lies in *enforcement*, not parchment.  

  **(f) Falsifiability Under Observational Equivalence**  
  *Requirement*: Specify evidence falsifying the theory when culture/institutions appear identical (e.g., colonial Korea: same geography, divergent post-1945 paths).  
  *Logic*: If two identical-institution states diverge (e.g., Haiti/Dominican Republic), culture *or* contingency must explain; otherwise, institutions are insufficient.  

  **(g) Parallel-Worlds Constraint**  
  *Requirement*: For pairs with similar starts but divergent outcomes (e.g., Burkina Faso vs. Thailand), identify non-post-hoc branching factors.  
  *Logic*: To avoid narrative cherry-picking, the branching factor must be *exogenous* (e.g., colonial policy differences) or a measurable *critical juncture* (e.g., a revolution).  

  **Suspected Contradiction**: Desiderata (b) and (c) may conflict. Establishing institutional causality without temporal precedence [(b)] risks circularity if relying on counterfactuals [(c)], yet counterfactuals are untestable in macrohistory.  

  ---

  ### Section 3 — Negotiability Audit  
  - **(a)** *Non-negotiable*: Any colonial-era theory must address reversals.  
  - **(b)** *Camp-specific*: Institutionalists insist on it; geographicists see it as redundant.  
  - **(c)** *Non-negotiable*: Causal claims require prioritisation beyond chronology.  
  - **(d)** *Non-negotiable*: Inconsistent cases falsify monocausal theories.  
  - **(e)** *Non-negotiable*: Conflation undermines *all* causal claims empirically.  
  - **(f)** *Non-negotiable*: Falsifiability is a baseline scientific criterion.  
  - **(g)** *Camp-specific*: Path-dependency advocates accept contingent branching; determinists reject it.  

  **Highest-exclusion desideratum**: **(f) Falsifiability** excludes cultural theories (often unfalsifiable due to vague metrics) and ad hoc institutional narratives.  

  ---

  ### Section 4 — Brief Contender Sketch  
  **Institutionalist Account** (e.g., Acemoglu-Robinson):  
  - *Fails (b)*: Labels institutions "extractive" post-hoc without proving geography didn’t enable them.  
  - *Fails (e)*: Conflates de jure property rights with de facto elite control (e.g., colonial Americas).  
  - *Fails (g)*: Cannot explain divergence in similar-start cases (e.g., North vs. South Yemen) without cherry-picking junctures.  

  **Geographic Determinism** (e.g., Diamond, Sachs):  
  - *Fails (d)*: Cannot explain Scandinavian success or resource curses without auxiliary claims.  
  - *Fails (a)*: Reversals become tautological ("dense regions were doomed by ecology").  
  - *Fails (c)*: Treats geography as static prime mover, ignoring institutional adaptation.  

  **Cultural Explanation** (e.g., Banfield, Weber):  
  - *Fails (f)*: Rarely specifies falsifying evidence; norms are retrofitted to outcomes (e.g., "Asian values" for growth).  
  - *Fails (g)*: Struggles with parallel worlds (e.g., why similar Confucian cultures diverged in Korea/Taiwan vs. mainland China).  
  - *Fails (a)*: Cannot explain why dense, "low-trust" pre-colonial societies (e.g., India) later grew rapidly.  

  **Shared Gap**: All three struggle with **(c)**, using temporal order (e.g., "institutions emerged after geography") as a proxy for causal priority. None fully resolves how to test whether institutions are epiphenomenal **(b)**.
