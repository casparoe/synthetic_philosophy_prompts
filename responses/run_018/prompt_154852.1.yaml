answer: |-
  ### Exam Question  
  **Philosophy of Biology Final Examination**  
  **Time Allowed: 75 minutes**  
  **Word Limit: 900–1,100 words**  

  **Prompt:**  
  Consider a synthetic *xenoperoxisome*, engineered entirely *de novo* from non-biological synthetic lipids and recombinant proteins with no evolutionary ancestry. When inserted into mammalian cells, it performs detoxification identically to natural peroxisomes. However, it is essential *only* within an artificial metabolic pathway constructed in the laboratory and has never been subjected to natural selection.  

  **Taking a definite, committed stance**, argue whether the xenoperoxisome possesses a *biological function*. Defend **one** of the following positions:  
  1. An **etiological (selection-history) account** correctly denies it a biological function,  
  2. A **causal-role (system-relative) account** correctly attributes it a biological function, or  
  3. A **specifically modified hybrid account** of your own design (e.g., incorporating design intentions) attributes function under defined conditions.  

  **Your essay must**:  
  - Apply your chosen framework’s conceptual machinery directly to the xenoperoxisome case,  
  - Explicitly distinguish between *proper function* (etiological) and *system function* (causal-role) at least once,  
  - Defend your position with reasons why it best resolves this case,  
  - Identify **one significant conceptual cost or objection** your own view faces *specifically in this synthetic scenario*, and explain why it is problematic.  

  **Do not** neutrally summarize standard contrasts between etiological and causal-role accounts. Focus on reasoned application to the case.  

  ---

  ### Model Answer (920 words)  
  The xenoperoxisome—a synthetic organelle engineered without evolutionary ancestry but performing detoxification like natural peroxisomes—forces a critical choice in the function debate. I argue that the **causal-role account** correctly attributes a biological function to the xenoperoxisome, but *only* when "system" is restricted to the engineered cellular context. This resolution, however, incurs a significant cost: the erosion of normative force in distinguishing malfunction from mere failure.  

  **Causal-Role Function Applied**  
  Causal-role theories define a function as a component’s current activity contributing to a system’s capacity. Here, the xenoperoxisome’s detoxification activity sustains viability in cells reliant on the artificial metabolic pathway. Unlike etiological views, this account demands no selective history. The xenoperoxisome’s causal contribution—neutralizing toxins—is identical to natural peroxisomes, fulfilling a critical role in maintaining the *engineered* cell’s homeostasis. Crucially, "system" must be delineated as *the laboratory-constructed cell-line*, where the synthetic pathway is essential. In broader systems (e.g., wild-type organisms), the xenoperoxisome lacks a function—but within its intended context, its causal role is both observable and indispensable.  

  **Against Etiological Accounts**  
  Etiological theories ground function in selective history: a trait’s function is what it was selected for. The xenoperoxisome has no such history. It was not shaped by natural selection, nor does it derive from ancestral traits. Proponents like Millikan would thus deny it a *proper function*, classifying its detoxification as merely accidental. However, this dismissal is inadequate here. Biologists in the lab *rely* on the xenoperoxisome’s consistent detoxification to achieve experimental goals. Denying it a function ignores its operational reality in a biological system. Etiology conflates *origin* with *operational significance*: the xenoperoxisome’s lack of history does not negate its present causal efficacy.  

  **Hybrid Proxies Fail**  
  One might propose a hybrid, substituting intentional design for natural selection. Yet this move collapses the normative core of function ascriptions. Design intentions can explain why the xenoperoxisome exists, but they cannot ground *malfunction*. Suppose a xenoperoxisome fails to detoxify due to a manufacturing defect. An etiological account (even design-based) can call this a *malfunction*: it fails to perform its designed purpose. But if we accept design as a proxy, we must also accept that *any* failed artifact (e.g., a broken watch) "malfunctions"—a biological misstep. Biology’s normative distinction between malfunction (e.g., a mutated heart failing to pump) and mere absence of function (e.g., a vestigial appendix) relies on natural selection’s historical feedback. Designer intentions lack this authority; a "defective" xenoperoxisome is just a failed experiment, not a biological anomaly. Thus, hybrid approaches forfeit the very normativity that makes functional discourse distinctively biological.  

  **Causal-Role’s Biological Legitimacy**  
  The causal-role view rightly treats the xenoperoxisome’s operation as functional *biology* because it integrates into a living cellular system. Unlike a mere machine, the xenoperoxisome interacts dynamically with biological processes: it uses cellular ATP, responds to metabolic signals, and its failure causes cell death in the engineered pathway. This embeddedness justifies calling its role "biological" rather than merely artifactual. Crucially, causal-role theorists like Cummins can accommodate system-relativity: the xenoperoxisome has a function in the artificial cell-line but not in unmodified organisms. This flexibility reflects biology’s expanding scope, where synthetic constructs become legitimate objects of functional analysis.  

  **The Cost: Normativity and Malfunction**  
  My position faces a serious objection: **without history, we lose the normative basis to distinguish malfunction from non-function**. In natural peroxisomes, failure to detoxify due to mutation is malfunction—it violates a historical norm. But in the xenoperoxisome, failure could result from either (a) flawed design (not a biological malfunction) or (b) context disruption (e.g., toxin overload). The causal-role account can only describe *dysfunction* relative to current system goals (e.g., "it disrupts cell survival"), not prescribe what the organelle *ought* to do. This strips function ascriptions of their evaluative force. Biologists studying synthetic systems thus sacrifice the powerful normative framework applied to natural traits.  

  **Conclusion**  
  The xenoperoxisome has a biological function only under a causal-role analysis restricted to the engineered cellular system. This attribution reflects its actual causal contribution while acknowledging synthetic biology’s innovations. However, embracing current efficacy over historical normativity means accepting that "function" in synthetic contexts is descriptive, not prescriptive. As such contexts proliferate, philosophers must either expand "biology" to include designed functions or concede that normativity remains evolution’s exclusive domain.  

  ---

  ### Marking Scheme (Total: 20 marks)  
  **1. Application of Etiological Criterion to the Case** (4 marks)  
     - *Full credit*: Correctly notes xenoperoxisome lacks selection history, so etiological accounts deny *proper function*.  
     - *Common error*: Claims etiological accounts *must* attribute function due to similarity to natural peroxisomes.  

  **2. Application of Causal-Role Criterion to the Case** (4 marks)  
     - *Full credit*: Identifies detoxification as causal contribution to engineered cell-line’s viability.  
     - *Common error*: Fails to specify the *system* (artificial pathway) or conflates it with natural cells.  

  **3. Committed Defense with Reasons** (5 marks)  
     - *Full credit*: Chooses one view/hybrid, defends it using scenario-specific reasoning (e.g., "causal integration justifies biological status").  
     - *Common error*: Summarizes both views neutrally or commits without scenario-based justification.  

  **4. Identification of Internal Cost** (4 marks)  
     - *Full credit*: Names a plausible, theory-specific cost (e.g., causal-role loses normativity; etiology ignores operational efficacy).  
     - *Common error*: Identifies a general weakness unrelated to synthetic context (e.g., "etiology is circular") or cites rival view’s strength as cost.  

  **5. Handling Malfunction/Normativity** (3 marks)  
     - *Full credit*: Explicitly contrasts historical vs. systemic norms (e.g., "malfunction requires selection history").  
     - *Common error*: Uses "malfunction" ambiguously or ignores the distinction.  

  **Grade Boundaries**:  
  - **A (18–20)**: Hits all 5 moves + **defends chosen view against strongest counterargument** (e.g., causal-role advocate rebuts "it’s just an artifact" by showing cellular integration).  
  - **B (14–15)**: Correctly applies both frameworks (moves 1 & 2) and commits (move 3) but **fails to engage deeply with counterarguments** or **dismisses cost superficially** (e.g., "the normativity loss isn’t important").  
  - **C (10–12)**: Partial applications/errors in moves 1–2 OR no commitment (move 3) OR missing cost (move 4).  

  ---  
  This assessment tests applied philosophical reasoning under constraints resembling real-world synthetic biology. The marking scheme rewards precision in leveraging theoretical tools while penalizing evasion of synthetic cases’ challenges.
