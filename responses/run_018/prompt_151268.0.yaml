  I should break this down systematically. Start by explaining how framing as a functional mechanism generates the sense of authority. The immediacy and non-inferential nature come from cognitive architecture—maybe fast, encapsulated processes that bypass deliberation. That feels authoritative but isn't epistemically privileged. 

  Then for phenomenal concepts: the framing mechanism makes them seem irreducible by blocking access to underlying mechanisms. It's like a user interface hiding the code. The realist mistake is taking this opacity as ontological primitiveness. 

  The self-refutation point is trickier. Maybe distinguish between framing-as-process and framing-as-content? The illusionist claim is about the process, and recognizing it doesn't trigger the same framing because it's theoretical, not introspective. That could work. 

