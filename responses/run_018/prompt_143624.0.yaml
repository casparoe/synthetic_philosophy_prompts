prompt: |-
  ok so i'm reading darwin's descent of man for a philosophy of bio class and i keep noticing this pattern that feels like it should have a name but i dont know it. darwin explains religious belief by saying our brains evolved agent-detection and causal reasoning, so belief in god is basically a spandrel - the evolutionary origin is supposed to undercut the belief. but then with morality he says the moral sense also evolved out of social instincts, yet he doesnt treat that origin as undermining morality at all. in fact he uses moral standards - sympathy should expand, cruelty is wrong - to judge evolutionary outcomes, almost like morality stands outside the evolutionary story and grades it. so he's doing evolutionary debunking on religion but shielding morality, even though both have basically the same kind of evolutionary explanation.

  is there a specific term for this asymmetrical move, where you cite evolutionary origins to dismiss one domain but protect another domain with identical origins? i know it's not just the genetic fallacy, and it's not exactly special pleading because there might be a principled reason origins affect belief differently in different domains. but i want to know if philosophers of science or metaethics have named this specific pattern, and if not, how you'd draw its edges - like is it always inconsistent, or can there be real distinctions between how origins bear on descriptive vs normative claims? i really just want the carving, not just a bare label: what the phenomenon is, what it isn't, and where it stops being the same thing.
reasoning: |-
  Okay, the user is reading Darwin's "Descent of Man" and noticed an asymmetry in how he treats religious belief versus morality. Darwin uses evolutionary origins to debunk religion as a spandrel but doesn't apply the same reasoning to morality. Instead, he uses moral standards to judge evolution. The user wants to know if there's a specific term for this move and how philosophers analyze it.

  First, I need to recall relevant concepts in evolutionary debunking arguments. Sharon Street's work comes to mind, where she distinguishes between domains where evolutionary origins undermine truth claims. For religion, Darwin suggests agent-detection leads to false beliefs about gods. But for morality, he treats it as adaptive, so its origins don't necessarily undermine its validity.

  The user mentioned it's not just the genetic fallacy. They're right; the issue is deeper. The genetic fallacy is about dismissing claims based on origin alone, but here the asymmetry is key. Darwin might argue that religious beliefs are false positives, while moral instincts track real social facts. That's a possible distinction.

  I should check if there's a named term for this asymmetry. "Selective Skepticism" or "Asymmetric Evolutionary Debunking" might fit, but I'm not sure if there's a standard term. Philosophers like Richard Joyce and Guy Kahane discuss debunking arguments in metaethics, comparing them to other domains. The user might benefit from knowing these discussions even without a single label.

  Also, the user wants to know if there's a principled distinction. Darwin could argue morality's adaptive value aligns with truth, whereas religion doesn't. But that hinges on whether moral facts exist independently. If moral realism is true, evolution could track those truths. For anti-realists, origins might debunk morality too. So the asymmetry depends on one's metaethical stance.

  The user's deeper need seems to be understanding the philosophical underpinnings of Darwin's move. They might be preparing for a class discussion or paper, needing both terminology and conceptual clarity. Explaining the role of truth-tracking and adaptive function in different domains would address their query effectively. Also, highlighting thinkers like Street and Joyce provides resources for further reading.
answer: |-
  You've hit upon a profound and frequently debated issue in philosophy, particularly at the intersection of evolutionary biology, metaethics, and philosophy of religion. There isn't a single, universally agreed-upon *label* for this *specific* asymmetry in Darwin, but the phenomenon is well-recognized and analyzed under several related concepts. Here's the carving:

  1.  **The Core Phenomenon:** It's **Selective Application of Evolutionary Debunking Arguments (EDA).**
      *   **Evolutionary Debunking Argument (EDA):** An argument claiming that the evolutionary origins of a belief or faculty (especially if non-truth-tracking or shaped by selective pressures unrelated to truth) undermine the justification for believing that faculty delivers true beliefs or accesses objective facts.
      *   **Selective Skepticism:** Applying this skeptical reasoning rigorously to one domain (e.g., religion, aesthetics) while exempting another domain (e.g., morality, logic, science) *despite analogous evolutionary origins*. Darwin applies EDA to religion but shields morality.

  2.  **Why it's Not *Just* the Genetic Fallacy:**
      *   **Genetic Fallacy:** Dismissing a claim *solely* because of its origin. EDA proponents argue it's *not* *just* the origin, but *what that origin implies* about the reliability or truth-tracking nature of the faculty. For Darwin, agent-detection is prone to false positives (seeing agency where none exists), undermining the truth of religious beliefs. He implicitly argues morality's origin *doesn't* imply unreliability or falsity in the same way.

  3.  **Why it's Not (Necessarily) *Just* Special Pleading:** Darwin *might* have a principled distinction in mind:
      *   **Truth-Tracking Potential:** He could argue that *social instincts* (like sympathy, reciprocity) evolved *because* they track features of our social reality essential for survival/reproduction (e.g., cooperation *is* beneficial). In contrast, *agent-detection* in religious contexts is a misfiring, generating false positives about supernatural agents ungrounded in reality. Morality, for Darwin, tracks real social needs and facts; religion tracks illusions.
      *   **Adaptive vs. Spandrel:** He explicitly frames religious belief as a *spandrel* (non-adaptive byproduct), while morality is presented as directly *adaptive* (promoting group cohesion). He might think adaptive traits are more likely to be reliable guides to navigating the world that selected for them.
      *   **Normative Force:** Darwin seems to treat morality as having inherent normative authority ("sympathy *should* expand", "cruelty *is* wrong"), which he then uses to judge evolution. He doesn't grant religious beliefs the same normative authority over reality. He sees morality as *discovered* by evolved instincts, while religion is *invented* by them.

  4.  **Key Philosophical Frameworks & Terms Analyzing This Asymmetry:**
      *   **Sharon Street's "Darwinian Dilemma" for Moral Realism:** This is the most direct engagement with the core issue. Street argues that if evolution shaped our moral judgments (as Darwin describes), then either:
          1.  These judgments track *independent* moral truths (which would be an incredible coincidence, given evolution selects for fitness, not truth), or
          2.  There *are no such independent truths* (moral anti-realism).
          Darwin's asymmetry suggests he leans towards (1) for morality but (2) for religion. Street uses this to argue *against* moral realism. **This dilemma highlights the tension Darwin embodies.**
      *   **Domain-Specific Reliability:** Philosophers debate whether evolutionary pressures make certain cognitive faculties (logic, perception, causal reasoning) reliable truth-trackers in the domains they evolved for, while making others (like hyperactive agency detection) unreliable. The debate is whether *morality* falls into the first category (like perception) or the second (like certain superstitions). Darwin puts religion in the second and morality in the first.
      *   **Arguments from Queerness / Explanatory Challenges (J.L. Mackie):** Mackie argued that objective moral values/properties would be metaphysically "queer" and causally inert – unable to explain why we evolved to believe in them. Darwin's explanation of morality *via* evolution seems to provide a naturalistic explanation, potentially *undermining* the need for objective moral facts. Yet Darwin doesn't draw this conclusion – he acts as if the moral facts *persist*. This highlights the asymmetry: he accepts the evolutionary explanation as *compatible* with moral truth for morality, but sees it as *incompatible* with religious truth.

  5.  **Where the Edges Are / When it Stops Being the Same Thing:**
      The asymmetry *is* potentially inconsistent **if**:
      *   The evolutionary origins of *both* faculties are argued to be equally non-truth-tracking (e.g., both are spandrels or shaped purely by fitness with no connection to relevant facts).
      *   No compelling argument is given for why origins undermine truth in one domain but not the other.
      The asymmetry *might* be justified **if**:
      *   A convincing case is made that the evolutionary origins of morality *do* make it reliably truth-tracking regarding objective moral facts (e.g., cooperation *is* objectively good, and evolution selected for recognizing this), while the origins of religious belief demonstrably make it unreliable regarding supernatural agents.
      *   One adopts different metaethical stances: e.g., **moral naturalism/reductionism** (moral facts *are* natural facts about well-being or social flourishing, which evolution *could* track) vs. **error theory** about religion (religious beliefs are systematically false). Darwin's stance leans towards moral naturalism and religious error theory.
      *   The **descriptive vs. normative distinction** is crucial: Explaining *how* we came to have moral beliefs (descriptive) doesn't automatically tell us if those beliefs *are* true or what we *ought* to do (normative). Darwin uses the *descriptive* origin to dismiss the *descriptive* truth-claims of religion ("God exists"). However, he seems to think the *descriptive* origin of morality either (a) reveals fundamental *normative* truths about social existence, or (b) grounds the normative authority of morality itself (sympathy *should* expand *because* it's our evolved nature and promotes flourishing).

  **Conclusion:**

  While there's no single, perfect label beyond "Selective Application of EDAs" or "Darwin's Asymmetry," the phenomenon is central to **Sharon Street's Darwinian Dilemma** and ongoing debates in metaethics about **evolutionary debunking arguments**. The key distinction Darwin *relies on* (whether successfully or not) is that the evolutionary origin of morality makes it a reliable guide to *real social facts and needs*, granting its normative authority, while the origin of religious belief makes it a source of illusion, stripping it of descriptive truth. The consistency of this move hinges entirely on whether one accepts that evolved moral instincts reliably track objective moral truths or fundamental facts about human flourishing in a way that evolved religious instincts do not track supernatural realities. Philosophers remain deeply divided on this point.
