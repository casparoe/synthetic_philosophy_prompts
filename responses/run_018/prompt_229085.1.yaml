answer: |-
  ## The Envelope Crucible: Ana vs. Ben

  **Setting:** A small, book-lined common room after the philosophy of probability reading group. Coffee mugs sit half-empty. Ana leans forward intently, Ben sits back thoughtfully, fingers steepled.

  **Ana:** Ben, I still think you’re dismissing the arithmetic too quickly. Look at it purely conditionally: *Given* I have €100 in my envelope, the other envelope *must* contain either €50 or €200. The host told us one is double the other, truthfully. Those are the only two possibilities relevant to my decision *now*.

  **Ben:** I agree on the possibilities, Ana. €50 or €200. But *why* are you assigning them equal probability? That’s where the symmetry you invoke actually breaks down.

  **Ana:** What else could I assign? I have zero information favoring one over the other! Before I opened it, symmetry said each envelope had a 50% chance of being the larger or smaller. Finding €100 doesn’t suddenly bias that; it’s new information, but it applies equally to both scenarios. So conditional on seeing €100, the probability the other is €50 should equal the probability it’s €200. Each is 1/2. Is that not basic conditional probability?

  **Ben:** It *seems* basic. But let’s follow your logic. Suppose you found €100, switched, and got €200. If you then applied the same logic again, you’d say: “Ah, I have €200. The other envelope must be €100 or €400, each equally likely! Expected value €250 > €200, so I should switch back!” And you’d be wrong half the time. Your reasoning creates a perpetual switching machine. That screams inconsistency.

  **Ana:** It highlights the paradox, Ben, but it doesn’t invalidate the *conditional calculation at each step*. When I hold €200, the calculation *is* correct *if* I assume the probabilities are equal then. The inconsistency arises because the *overall* situation forbids this calculation holding universally. But that doesn’t mean the calculation is *wrong* for this specific €100 case. Maybe the host has a specific setup where seeing €100 *does* make €50 and €200 equally likely? Show me the flaw *in the arithmetic itself*: (1/2 * 50) + (1/2 * 200) = 125. Is 125 not greater than 100? Where’s the mathematical error?

  **Ben:** The error isn’t in the arithmetic’s execution, Ana. It’s in the *interpretation* of the symbols. Assigning P(Other = 50 | Mine = 100) = 1/2 and P(Other = 200 | Mine = 100) = 1/2 is a *substantive assumption* about how the host filled the envelopes. It assumes that the probability of the smaller amount being €50 (implying larger is €100, which I found) is *equal* to the probability of the smaller amount being €100 (implying larger is €200, which would be in the other envelope). Are those two events equally likely? Why?

  **Ana:** Because the envelopes were identical, I chose randomly! Finding €100 doesn’t tell me if it was originally the smaller or the larger sum. Why should I think it was *more likely* to have been the smaller or the larger? It seems inherently symmetric *at this moment*.

  **Ben:** But the symmetry of the *choice* doesn’t imply symmetry of the *amounts*. Imagine the host decides the small amount, S, by drawing randomly from *some* distribution. Suppose S is always a power of 2: €1, €2, €4, €8, ..., etc., each with equal probability. Now, you open your envelope and see €100. Can that happen? Only if S=€100 (and you got it, meaning the other has €200) or if S=€50 (and you got the larger, €100, so the other has €50). But crucially, P(S=€50) and P(S=€100) are *both* non-zero only if the distribution includes both values. In my power-of-2 example, S=€50 isn’t even possible! But even if it is, say S is chosen uniformly between €1 and €1000. What’s P(S=50 | You found 100) vs. P(S=100 | You found 100)?

  **Ana:** *(Pauses, thinking)* If S is uniform from 1 to 1000, and you randomly pick an envelope… If I find €100, it could be because S=100 (I picked the small one) or S=50 (I picked the large one). The probability of picking the small envelope is 1/2, regardless of S. So…
  P(Other=50 | Mine=100) = P(I picked Large | Mine=100) = P(S=50) * P(Pick Large | S=50) / [P(S=50)*P(Pick Large|S=50) + P(S=100)*P(Pick Small|S=100)]
  = [P(S=50) * (1/2)] / [P(S=50)*(1/2) + P(S=100)*(1/2)] = P(S=50) / [P(S=50) + P(S=100)]

  **Ben:** Exactly! And if the prior distribution for S is uniform, P(S=50) = P(S=100), so your ratio is 1/2. Equal probability! Your calculation holds. But notice the expected gain? (1/2)(-50) + (1/2)(+100) = +25. A genuine 25% expected gain by switching. But what if you found €1? Or €1000?

  **Ana:** If I found S_min=€1, switching gains €1 (to €2). If I found S_max=€1000 (implying S=€500, other has €1000), switching loses €500. But the gain when switching from small is proportional to S, the loss when switching from large is also proportional to S. In uniform S, the *ex ante* expected gain from switching is zero, as symmetry demands. But *conditional* on seeing a *specific* value like €100, there *can* be a gain or loss depending on whether that value is more likely to be the smaller or larger sum in its pair. With uniform S, values near €500 are more likely to be the *larger* sum in their pair (since S could be €250 to €500 making L=€500 plausible), while values near €1 or €1000 are more likely to be the *smaller* or *larger*, respectively. But at €100, with uniform prior, it *was* symmetric! So switching was profitable.

  **Ben:** But therein lies the rub, Ana. *Only* because €100 is below the midpoint of the possible S range. Your original argument claimed switching is *always* beneficial, no matter what you see. That requires that *for every possible amount X you might find*, P(Other= X/2 | Mine=X) = P(Other=2X | Mine=X) = 1/2. This implies that for every X, the probability the smaller amount was X/2 (meaning you hold the large one) equals the probability the smaller amount was X (meaning you hold the small one). Symbolically: P(S = X/2) = P(S = X) for *every X* you might observe.

  **Ana:** Yes… and?

  **Ben:** And that’s impossible with any proper probability distribution over S! Think: P(S=100) = P(S=200) = P(S=400) = P(S=50) = P(S=25) = ... and so on, *ad infinitum*. The probabilities can’t all be equal and positive forever; they wouldn’t sum to 1. The only way is if the distribution is *improper* – like a uniform distribution over all positive reals. But then the expected value of S is infinite! And your expectation calculation for switching also becomes indeterminate: (1/2)(X/2) + (1/2)(2X) = (5/4)X > X, suggesting infinite expected gain, but only because the expected value of *any* amount is infinite. It’s a mirage.

  **Ana:** *(Leans back, absorbing)* So... my assumption of equal likelihoods conditional on seeing *any* X requires the prior distribution for S to be scale-invariant? Meaning it has no "natural" scale, and infinite expectation? And in any realistic scenario, with bounded amounts or a proper prior favoring certain scales, the conditional probabilities aren’t equal for *every* X. They might be equal for *some* X, like €100 in the uniform [1,1000] case, but not for €1 or €500. And crucially, the *overall* expected value of switching is zero, respecting symmetry.

  **Ben:** Precisely. Your initial calculation isn’t *mathematically* wrong in isolation. It’s that the assumption P(Other=X/2 | Mine=X) = 1/2 for *any conceivable X*, which your argument tacitly relies upon to justify switching unconditionally, implicitly commits you to an impossible or pathological prior distribution. In any well-defined scenario with finite expectations or a proper prior, that equality only holds for specific values, if at all. The paradox arises from demanding that impossible uniformity.

  **Ana:** So the crux is the host's procedure. If they used a distribution where seeing *any* specific amount X makes it equally likely that X was the smaller or the larger sum in its pair – which requires P(S = X) = P(S = X/2) for all possible X – then we need an improper prior, and expectation loses meaning. But if they used a realistic distribution (bounded, or proper), then while for *some* values switching might be profitable, for others it might not, and *ex ante*, switching gains nothing. My opening calculation assumed the pathological case applied universally.

  **Ben:** And my intuition that symmetry forbids switching being always beneficial was correct, but I initially failed to articulate *why* your calculation failed – it wasn’t the arithmetic, but the unsupported assumption of equal conditional probabilities. That assumption smuggles in an impossible prior. The real symmetry is *ex ante*: before seeing any amount, the other envelope is probabilistically identical to the one you hold.

  **Ana:** So, closing position: I see now that my argument for *always* switching rests on an implicit assumption about the prior distribution that’s impossible to satisfy with finite expectations. Conditional on seeing a *specific* X, whether switching is beneficial depends entirely on the host's unknown distribution. Without knowing that, I can't claim switching is *always* better. My calculation only works under very specific, often unrealistic, conditions.

  **Ben:** And I concede your conditional expectation calculation is mathematically sound *given* the equal probability assumption. The flaw is that this assumption, while intuitively appealing when you see €100, cannot hold consistently for all possible amounts without leading to infinite expectations or an improper prior. The paradox dissolves when we realize the conditional probabilities depend critically on the host's method, which breaks the naive local symmetry for arbitrary X. The envelopes *are* symmetric *ex ante*, and no general argument can justify switching based solely on seeing your amount.

