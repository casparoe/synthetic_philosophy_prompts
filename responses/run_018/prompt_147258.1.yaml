prompt: |-
  You serve as an editorial referee for an interdisciplinary policy journal that publishes rapid-response briefs on emerging scientific and historical controversies. Your task is not merely to recommend acceptance or rejection, but to produce a standardized "assertion audit" for every brief: a reusable decision procedure that applies the three major norms of assertion—knowledge, truth, and belief—to determine whether the brief's central empirical claim is assertible in its published form. Policymakers will cite these briefs without reading the underlying studies, so the audit must be executable in under fifteen minutes, must not require direct access to the author's mental states or to ground-truth databases, and must document every point where judgment cannot be eliminated.

  Design an eight-step (or fewer) procedural checklist with explicit branching conditions. For each step, specify the test to run, the information required, and the judgment call (if any) that must be signed off by the referee. The procedure must handle three hard cases: claims supported only by unpublished preprints or single small-sample studies; claims that are probably true but depend on modeling parameters that other experts dispute; and claims that the author sincerely believes but admits are not yet established by the available record. For each case, the procedure must generate one of four outputs: "assertible without qualification," "assertible only in conditional or hedged form," "not assertible—recommend revision to a weaker claim," or "not assertible—recommend withholding publication until further evidence is available."

  In addition to the immediate audit, include a "downstream liability" check: if the claim is asserted now, what specific update, correction, or retraction obligation is triggered should contradictory evidence emerge within twelve months? This check must be operational—specify the trigger condition, the responsible party, and the form of the correction.

  Apply your procedure to three hypothetical briefs:

  1. A forty-subject pilot study finding that a common dietary supplement improves working memory in older adults, with no replication and no registered protocol.
  2. A climate-modeling brief asserting that a specific ocean-feedback loop will accelerate warming by 0.4°C within fifteen years, where the parameter governing the loop is disputed by three other modeling groups.
  3. A brief claiming that a particular indigenous burial practice was widespread in the region during the pre-contact period, where the author has strong ethnographic belief and partial oral-historical support, but the archaeological record is ambiguous and a competing interpretation exists in the literature.

  For each brief, state the step-by-step output of your procedure, identify the exact step where an unavoidable judgment call occurred, and explain one specific way the procedure could misfire if applied mechanically without that judgment. Then state clearly what the procedure cannot do—for example, whether it can resolve the underlying philosophical disagreement between the knowledge norm and the belief norm, or whether it can guarantee that policymakers will attend to the qualifications.

  Keep the language formal, the distinctions sharp, and the practical constraints explicit. Do not include bibliographies, reading lists, or requests for citations.
reasoning: |-
  We are designing an eight-step procedural checklist for assertion audit. The steps must cover the three norms of assertion: knowledge, truth, and belief. The procedure must be executable in under 15 minutes without access to the author's mental states or ground-truth databases. It must handle the three hard cases and produce one of four outputs.

  The four outputs are:
  - "assertible without qualification"
  - "assertible only in conditional or hedged form"
  - "not assertible—recommend revision to a weaker claim"
  - "not assertible—recommend withholding publication until further evidence is available"

  Additionally, we need a "downstream liability" check that specifies the trigger condition, responsible party, and form of correction if contradictory evidence emerges within 12 months.

  We are to apply the procedure to three hypothetical briefs.

  Let's design the eight-step checklist:

  **Assertion Audit Checklist**

  **Step 1: Identify the Central Empirical Claim (CEC)**
     - Test: Extract the main empirical proposition that the brief is asserting. This must be a single, declarative statement that can be true or false.
     - Information Required: The brief itself.
     - Judgment Call: None (this is a straightforward extraction). However, if the brief has multiple claims, the referee must identify the one central claim (if not clear, the referee must note that and proceed with the most prominent one, but this is a judgment call). We will avoid that by requiring the brief to have a clearly stated central claim.

  **Step 2: Belief Norm Check**
     - Test: Does the brief include a statement of the author's endorsement of the CEC? (e.g., "we conclude that", "we find that", or similar). If not, check if the author presents the claim as their own position (even if hedged). If the author explicitly disavows belief (e.g., "this is speculative"), then the belief norm is violated.
     - Information Required: The brief's text, especially the conclusion and discussion sections.
     - Judgment Call: Referee must determine if the author's language constitutes endorsement. For example, if the author says "it is possible that", that is not endorsement. But if they say "our results demonstrate", that is endorsement.

  **Step 3: Truth Norm Check - Evidence Base**
     - Test: Does the brief provide at least one empirical source (study, dataset, model) that directly supports the CEC? The source must be cited and described in the brief. If no source is provided, the claim is unsupported and fails the truth norm.
     - Information Required: The brief and its references (but we do not access the actual studies, only what is in the brief).
     - Judgment Call: Referee must determine if the cited source(s) are described as providing support for the CEC. This is a judgment because the brief might misrepresent the source.

  **Step 4: Truth Norm Check - Quality of Evidence**
     - Test: Assess the quality of the evidence base without accessing the original sources. Consider: 
       - Is the evidence from a peer-reviewed publication? (Preprints are not peer-reviewed.)
       - If the evidence is a single study, does the brief report the sample size and methodology? 
       - Are there any red flags in the brief's description of the evidence (e.g., small sample, lack of control, potential biases acknowledged by the author)?
     - Information Required: The brief's description of the evidence and the references (to see publication status).
     - Judgment Call: Referee must judge the adequacy of the evidence based solely on the brief's description. This step cannot verify the actual quality of the study, only the reported characteristics.

  **Step 5: Truth Norm Check - Consensus and Controversy**
     - Test: Does the brief acknowledge and address existing controversies or conflicting evidence? If the brief makes no mention of any controversy, check the references for the presence of conflicting studies. If the brief cites multiple independent sources that support the claim without conflicting evidence, then the truth norm is satisfied. If conflicting evidence is cited or known (from the brief's own references) but not addressed, that is a problem.
     - Information Required: The brief and its references (we only see the reference list, not the content of references).
     - Judgment Call: Referee must decide if the brief adequately addresses conflicts. If the brief does not cite any conflicting evidence, the referee cannot know if there is any (because we don't have ground-truth databases). Therefore, the judgment is: if the brief does not mention any controversy and the evidence base (from step 3 and 4) is strong (e.g., multiple independent replications, large samples, no red flags) then we assume no significant controversy. Otherwise, if the evidence is weak (e.g., single study, small sample) or if the brief does mention controversy, then the referee must note that the claim is controversial.

  **Step 6: Knowledge Norm Check**
     - Test: Based on steps 2-5, does the author have a justified belief in the CEC? The belief must be justified by the evidence presented and the handling of controversy. If the evidence is weak (e.g., single small-sample study) or if there is significant unaddressed controversy, then the author does not have knowledge (even if they believe it).
     - Information Required: Outputs from steps 2-5.
     - Judgment Call: The referee must decide if the evidence and the author's handling of it rise to the level of justification required for knowledge. This is a holistic judgment.

  **Step 7: Assertibility Determination**
     - Test: Apply the following branching conditions:
       - If the claim passes all norms (belief, truth, knowledge) without issues: output "assertible without qualification".
       - If the claim passes belief and truth but fails knowledge (i.e., the evidence is insufficient for full justification but the claim is supported and the author believes it) OR if the claim is controversial but the author has addressed the controversy and the evidence is still reasonably strong: output "assertible only in conditional or hedged form".
       - If the claim fails the truth norm (i.e., no evidence or very weak evidence) but the author believes it and there is some evidence: output "not assertible—recommend revision to a weaker claim".
       - If the claim fails the belief norm or if the truth norm is failed due to no evidence: output "not assertible—recommend withholding publication until further evidence is available".
     - Information Required: Results from steps 2-6.
     - Judgment Call: The referee must choose the appropriate output based on the conditions. This step is algorithmic once the judgments from previous steps are made.

  **Step 8: Downstream Liability Check**
     - Test: For any claim that is asserted (whether qualified or not), specify:
       - Trigger condition: Within 12 months, a peer-reviewed publication (or pre-print if the original was based on pre-print) appears that provides substantial contradictory evidence (i.e., a study or analysis that directly challenges the CEC and is of comparable or better quality than the original evidence).
       - Responsible party: The journal editor (who must initiate the correction process) and the author (who must provide a response).
       - Form of correction: 
          - If the original was "assertible without qualification": a published correction or, in severe cases, retraction.
          - If the original was "assertible only in conditional or hedged form": an update to the brief with a discussion of the new evidence and a re-evaluation of the claim (without retraction, because it was already hedged).
     - Judgment Call: The referee must specify the trigger condition in operational terms (e.g., "a peer-reviewed study with a sample size at least as large as the original" or "a model from an independent group using different parameters"). This requires setting a threshold for what counts as substantial contradictory evidence.

  Now, we apply this procedure to the three hypothetical briefs.

  **Hypothetical Brief 1: Forty-subject pilot study on a dietary supplement improving working memory in older adults, no replication, no registered protocol.**

  Step 1: CEC = "Dietary supplement X improves working memory in older adults."

  Step 2: The brief likely states the finding as a conclusion (e.g., "we found that..."). So, belief norm passed.

  Step 3: The brief provides one source: the pilot study. So, truth norm (evidence base) passed.

  Step 4: Quality of evidence: 
    - The study is a pilot with 40 subjects (small sample).
    - No replication and no registered protocol (so potential for bias and lack of pre-registration).
    - The brief probably reports the methodology and results. But the quality is low due to small sample and no replication.
    - Judgment: evidence quality is weak.

  Step 5: Consensus and controversy: 
    - The brief may not mention any controversy because it's a new finding. Since it's a single small-sample study, we assume there is no consensus and the claim is novel. Without access to ground truth, we note that the evidence is weak and there is no mention of replication or existing literature. Since the brief does not acknowledge the limitations as a cause for controversy, we note a potential issue.

  Step 6: Knowledge norm: The author believes the claim and there is evidence, but the evidence is weak. Therefore, the author does not have knowledge (justified true belief) because the justification is insufficient.

  Step 7: Assertibility determination: 
    - The claim passed belief and truth (there is evidence) but failed knowledge. So, output: "assertible only in conditional or hedged form" (e.g., "preliminary evidence suggests that...").

  Step 8: Downstream liability: 
    - Trigger: Within 12 months, a peer-reviewed study with a larger sample (at least 100 subjects) or a replication attempt that fails to find the effect.
    - Responsible: Journal editor and author.
    - Correction: Since the original was conditional, the brief should be updated with the new evidence and a re-evaluation.

  Judgment call in Step 4: The referee judged the evidence as weak due to small sample and no replication. If applied mechanically without judgment, one might only note the absence of peer-review (if it's a preprint) but miss the small sample issue. However, the brief would report the sample size, so that's objective. The judgment is in deciding that a 40-subject pilot is weak. Without that judgment, the procedure might pass it as acceptable.

  **Hypothetical Brief 2: Climate-modeling brief asserting a specific ocean-feedback loop will accelerate warming by 0.4°C within fifteen years, with disputed parameter by three other modeling groups.**

  Step 1: CEC = "The ocean-feedback loop X will accelerate warming by 0.4°C within fifteen years."

  Step 2: The author asserts this as a finding of their model. So, belief norm passed.

  Step 3: The brief provides the model as evidence. So, truth norm (evidence base) passed.

  Step 4: Quality of evidence: 
    - The model is described, but the key parameter is disputed by three other groups. The brief should acknowledge this. If it does, then the evidence is of good quality but uncertain. If it doesn't, that's a red flag.
    - We assume the brief acknowledges the dispute.

  Step 5: Consensus and controversy: 
    - The brief explicitly mentions that three other groups dispute the parameter. So, there is controversy. The brief must address it (e.g., by explaining why they use their parameter). If they address it adequately, then the truth norm is satisfied (because they have evidence and they acknowledge the controversy). If they dismiss it without reason, that's inadequate.

  Step 6: Knowledge norm: The author has a justified belief? The evidence is from a model, but the controversy means that the justification is not complete. Therefore, the author does not have knowledge in the strong sense.

  Step 7: Assertibility determination: 
    - The claim passes belief and truth (evidence exists and controversy is acknowledged) but fails knowledge (because of the controversy). So, output: "assertible only in conditional or hedged form" (e.g., "according to our model, which uses parameter value Y, the loop will accelerate warming by 0.4°C, but this is subject to ongoing debate about the parameter").

  Step 8: Downstream liability: 
    - Trigger: Within 12 months, a peer-reviewed study by one of the disputing groups (or a new group) that provides evidence for a different parameter value and shows that the warming acceleration is significantly different (e.g., less than 0.2°C or more than 0.6°C) OR a consensus report (like IPCC) that settles the parameter.
    - Responsible: Journal editor and author.
    - Correction: Update the brief to reflect the new evidence and adjust the claim accordingly (since it was conditional, no retraction, but an update).

  Judgment call in Step 5: The referee must judge if the brief adequately addresses the controversy. If the brief simply says "others disagree" without any argument, that may not be adequate. If applied mechanically, the procedure might pass any mention as adequate.

  **Hypothetical Brief 3: Claim about indigenous burial practice being widespread in the pre-contact period, with author's belief and partial oral history, but ambiguous archaeological record and competing interpretation.**

  Step 1: CEC = "Indigenous burial practice Y was widespread in region Z during the pre-contact period."

  Step 2: The author has strong belief (ethnographic) and states the claim. So, belief norm passed.

  Step 3: The brief provides evidence: partial oral-historical support and the archaeological record (even if ambiguous). So, truth norm (evidence base) passed.

  Step 4: Quality of evidence: 
    - The evidence is partial oral history and ambiguous archaeological record. This is weak because the archaeological record is ambiguous and oral history may not be conclusive for "widespread". The brief should acknowledge the ambiguity.

  Step 5: Consensus and controversy: 
    - The brief must mention the competing interpretation in the literature. If it does not, that's a red flag. We assume it does because the problem states that a competing interpretation exists and the author is aware (since they are an expert). So, the brief likely acknowledges the controversy.

  Step 6: Knowledge norm: The author believes the claim and there is some evidence, but the evidence is weak and contested. Therefore, the author does not have knowledge (justification is insufficient).

  Step 7: Assertibility determination: 
    - The claim passes belief and truth (there is evidence) but fails knowledge. So, output: "assertible only in conditional or hedged form" (e.g., "oral historical evidence suggests that practice Y was widespread, though the archaeological record is currently ambiguous").

  Step 8: Downstream liability: 
    - Trigger: Within 12 months, new archaeological findings that directly contradict the claim (e.g., a large-scale study of burial sites showing the practice was rare) or a peer-reviewed synthesis that supports the competing interpretation.
    - Responsible: Journal editor and author.
    - Correction: Update the brief to reflect the new findings.

  Judgment call in Step 4: The referee must judge the quality of the evidence as weak because the archaeological record is ambiguous. If applied mechanically, one might note that both oral history and archaeology are present and not see the ambiguity as a weakness.

  **What the Procedure Cannot Do**

  The procedure cannot:
  - Resolve the underlying philosophical disagreement between the knowledge norm and the belief norm. It operationalizes the knowledge norm as requiring justification (step 6) and the belief norm as requiring authorial endorsement (step 2), but it does not settle the debate about whether belief alone is sufficient for assertion (which it is not in this procedure).
  - Guarantee that policymakers will attend to the qualifications. The procedure can require hedging, but it cannot control how the brief is cited or interpreted.
  - Access the actual truth of the claim. It relies on the evidence presented and the author's handling of it.
  - Account for evidence not mentioned in the brief or its references because we do not have access to ground-truth databases.
  - Eliminate all judgment calls, especially in evaluating the quality of evidence and the adequacy of addressing controversy.

  The procedure is designed to be a practical, rapid audit that enforces transparency about the strength of claims and the potential for error.
answer: |-
  ### Assertion Audit Procedure: Eight-Step Checklist

  **Step 1: Identify Central Empirical Claim (CEC)**  
  - **Test**: Extract the core empirical proposition being asserted. Must be a single, testable statement.  
  - **Information Required**: The brief's abstract, introduction, and conclusion.  
  - **Judgment Call**: Referee must isolate the primary claim if multiple are present.  
  - **Branching**: If no clear CEC exists, halt and request revision.  

  **Step 2: Belief Norm Check**  
  - **Test**: Verify explicit author endorsement (e.g., "we conclude," "data show").  
  - **Information Required**: Author’s framing of the CEC in the text.  
  - **Judgment Call**: Referee assesses if language implies sincere belief (e.g., hedging like "may" or "suggests" fails).  
  - **Branching**: If no endorsement, output "not assertible—recommend revision."  

  **Step 3: Evidence Base Sufficiency**  
  - **Test**: Confirm at least one supporting empirical source (study, model, dataset) is cited.  
  - **Information Required**: References section and in-text citations.  
  - **Judgment Call**: Referee determines if sources are directly relevant to the CEC.  
  - **Branching**: If no sources, output "not assertible—withhold publication."  

  **Step 4: Evidence Quality Assessment**  
  - **Test**: Evaluate robustness flags:  
    - Peer-review status (preprint vs. published).  
    - Sample size, methodology transparency, conflict acknowledgment.  
    - Replication status (single study vs. multiple).  
  - **Information Required**: Brief’s description of methods, limitations, and citations.  
  - **Judgment Call**: Referee flags "high risk" if: unpublished preprint, small sample, unreplicated, or undisputed conflicts.  
  - **Branching**: If high risk, proceed to Step 5; else, proceed to Step 6.  

  **Step 5: Controversy Handling Check**  
  - **Test**: Determine if the brief acknowledges and substantively engages with conflicting evidence (e.g., rival studies, disputed parameters).  
  - **Information Required**: Literature review, discussion section, cited opposing work.  
  - **Judgment Call**: Referee evaluates if engagement is adequate (e.g., rebuttal vs. dismissal).  
  - **Branching**:  
    - If conflicts unaddressed, output "not assertible—recommend revision."  
    - If conflicts addressed, proceed to Step 6.  

  **Step 6: Knowledge Norm Synthesis**  
  - **Test**: Integrate Steps 2–5 to assess justification.  
  - **Information Required**: Results from Steps 2–5.  
  - **Judgment Call**: Referee weighs evidence strength and controversy severity:  
    - **Strong**: Published, replicated, no material disputes.  
    - **Moderate**: Preprint/single study but conflicts addressed.  
    - **Weak**: Unreplicated, undisputed conflicts, or low transparency.  
  - **Branching**:  
    - Strong → Proceed to Step 7 for "assertible without qualification."  
    - Moderate → Proceed to Step 7 for "assertible only conditionally."  
    - Weak → Output "not assertible—withhold publication."  

  **Step 7: Assertibility Output**  
  - **Test**: Assign one of four outputs based on Step 6:  
    - **Unqualified**: CEC meets all norms robustly.  
    - **Conditional/Hedged**: Moderate justification (requires qualifiers like "evidence suggests").  
    - **Revise**: Weak evidence but salvageable (e.g., narrow scope).  
    - **Withhold**: Critical flaws (e.g., no evidence or unaddressed conflicts).  
  - **Information Required**: Step 6 synthesis.  
  - **Judgment Call**: Referee finalizes output; no branching.  

  **Step 8: Downstream Liability Protocol**  
  - **Test**: Define obligations if contradictory evidence emerges within 12 months.  
  - **Information Required**: Output from Step 7.  
  - **Judgment Call**: Referee specifies:  
    - **Trigger**: Peer-reviewed study contradicting CEC, with equal/better methodology.  
    - **Responsible Party**: Journal editor (enforcement) and author (response).  
  - **Correction Form**:  
    - Unqualified claim → Retraction or prominent correction.  
    - Conditional claim → Update with new evidence analysis.  
    - Revised/withheld claims → Not applicable.  

  ---

  ### Application to Hypothetical Briefs

  #### **Brief 1: Dietary supplement improves working memory (40-subject pilot)**  
  1. **CEC**: "Supplement X improves working memory in older adults."  
  2. **Belief Norm**: Pass (author endorses findings).  
  3. **Evidence Base**: Pass (pilot study cited).  
  4. **Evidence Quality**: High risk (unpublished preprint, small sample, no replication/protocol).  
  5. **Controversy Handling**: Fail (no conflicts acknowledged; no replication discussed).  
  6. **Knowledge Norm**: Weak (unreplicated, high-risk flags).  
  7. **Output**: "Not assertible—recommend withholding publication until further evidence."  
  8. **Liability**: N/A (withheld).  
  - **Judgment Call**: Step 4—Assessing "high risk" from small sample and no protocol.  
  - **Misfire Risk**: Mechanically, a preprint might be dismissed without considering pilot utility; judgment ensures context (e.g., novelty) is weighed.  

  #### **Brief 2: Climate model predicts 0.4°C warming from disputed feedback loop**  
  1. **CEC**: "Ocean-feedback loop Y will accelerate warming by 0.4°C by 2040."  
  2. **Belief Norm**: Pass (author asserts model output).  
  3. **Evidence Base**: Pass (model cited).  
  4. **Evidence Quality**: High risk (parameter disputed by three groups).  
  5. **Controversy Handling**: Pass (brief acknowledges disputes and defends parameters).  
  6. **Knowledge Norm**: Moderate (addressed controversy but unresolved).  
  7. **Output**: "Assertible only in conditional form" (e.g., "under parameter set Z, model projects...").  
  8. **Liability**: Trigger: Peer-reviewed model with alternative parameter showing ≤0.2°C or ≥0.6°C. Correction: Update brief comparing models.  
  - **Judgment Call**: Step 5—Evaluating adequacy of conflict engagement (e.g., superficial vs. substantive rebuttal).  
  - **Misfire Risk**: Mechanical application might accept any conflict mention; judgment ensures engagement is rigorous.  

  #### **Brief 3: Indigenous burial practice was widespread pre-contact**  
  1. **CEC**: "Burial practice A was widespread in region B pre-contact."  
  2. **Belief Norm**: Pass (author states belief based on ethnography).  
  3. **Evidence Base**: Pass (oral histories and archaeology cited).  
  4. **Evidence Quality**: High risk (archaeological ambiguity, competing interpretation).  
  5. **Controversy Handling**: Pass (brief cites and critiques competing interpretation).  
  6. **Knowledge Norm**: Moderate (belief and partial evidence, but unresolved ambiguity).  
  7. **Output**: "Assertible only in hedged form" (e.g., "oral evidence indicates practice A may have been widespread...").  
  8. **Liability**: Trigger: Peer-reviewed archaeological study showing practice was rare. Correction: Update with new evidence and revise claim.  
  - **Judgment Call**: Step 6—Balancing ethnographic belief against empirical ambiguity.  
  - **Misfire Risk**: Mechanically, oral history might be downgraded; judgment recognizes its validity in interdisciplinary work.  

  ---

  ### Limitations of the Procedure  
  1. **Philosophical Disagreements**: Cannot resolve tension between knowledge and belief norms. For example, in Brief 3, the belief norm is satisfied by the author’s sincerity, but the knowledge norm requires empirical justification—a philosophical gap the procedure operationalizes but does not reconcile.  
  2. **Judgment Dependence**: Critical steps (4–6) rely on referee expertise; the procedure documents but cannot eliminate this subjectivity.  
  3. **Evidence Access**: Cannot verify ground truth; relies solely on the brief’s representation of evidence. Misrepresentations (e.g., overselling preprint validity) may go undetected.  
  4. **Policy Impact**: Cannot ensure policymakers heed qualifications (e.g., conditional language in Briefs 2–3 may be stripped in citations).  
  5. **Temporal Constraints**: Designed for speed (15 minutes), so cannot detect subtle fraud or long-term replicability issues.  
  6. **Scope**: Limited to empirical claims; cannot audit normative or policy recommendations derived from the CEC.  

  ---  
  **Procedure Signature**: Referees must sign off on judgment calls at Steps 4, 5, and 6, with rationale documented in the audit log. This maintains transparency while adhering to practical constraints.
