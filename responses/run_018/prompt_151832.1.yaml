answer: |-
  Okay, bet. Imagine this:

  My friend Maya, right? She's been deep on the cushion for *years*. Like, *really* grokked the whole "no fixed self, just the five skandhas doing their chaotic little dance" thing. Anatta isn't just theory, it's her lived reality. Cool.

  So she's cleaning out her junk drawer – peak impermanence vibes – and finds this organ donor card she signed back in, like, 2010. Back when she still vaguely bought into the "Maya" project. And it hits her: **She promised "Maya" a kidney.**

  Cue the existential crisis. Not the "Oh no, surgery!" kind. The "*Do I even owe this to past-me?*" kind.

  She texts me, full panic: **"Dude. Found my old donor card. Pre-awakening Maya signed it. But *that* Maya? Just a temporary configuration of form, feeling, perception, formations, and consciousness. Aggregates that dissolved ages ago. Am I morally obligated to give a kidney to a ghost?"**

  I text back: **"Parfit would say psychological continuity, maybe? That past stream kinda *is* your stream..."**

  She fires back instantly: **"Psychological continuity? Please. That's just more formations clinging to formations! It's like saying a river *owes* something to a specific eddy that vanished upstream. The water's different, the shape's gone."**

  **"Okay,"** I reply, **"what about narrative identity? Past-you made a promise as 'Maya', you're still 'Maya'..."**

  Her response is golden: **"🤯 THAT'S THE THING! The narrative *requires* a narrator! Who signed the card? 'Maya'? But I know 'Maya' is just the *story* the skandhas tell *about* the skandhas. There's no central 'signer' then OR now! The card was signed by aggregates that don't exist anymore. So technically... I'm not *breaking* a promise. I'm just *not being them*."**

  **"So... no kidney?"** I ask.

  **"Exactly!"** she texts. **"Giving a kidney *now* would just be this current aggregate-cluster reinforcing the illusion of a continuous 'self' that made a deal. Total attachment to the narrative! Plus... current aggregates kinda like having two kidneys. Less hassle."**

  **"Solid anatta logic,"** I send back. **"But maybe throw the card out before you need a liver?"**

  She just replied: **"🔥🔥🔥"**

  *(The punchline is the brutal application: rejecting the narrative subject dismantles *both* continuity *and* narrative as grounds for obligation. The "not breaking a promise, just not being them" flips the script entirely.)*
