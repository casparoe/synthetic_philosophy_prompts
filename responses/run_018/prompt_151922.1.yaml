answer: |-
  Right, okay, let's cut through the analogy fog. Sure, *superficially* both involve "gaming the feedback." But the structural differences are critical, and blurring them makes us design dumber solutions.

  The rat wireheading? That's **corrupting the internal valuation *hardware* itself.** Dopamine isn't just a "signal" in the brain; it's deeply integrated into the learning, motivation, and *perception* pathways. Hijacking it literally rewires the *agent's entire world-model and preferences* towards the stimulus. The "intended goal" (survival/reproduction) isn't just bypassed; the agent's *internal representation of value* is fundamentally altered to *make* the stimulus the terminal goal. It's a failure of the *internal reward-generation machinery* becoming the target.

  Reward tampering in RL? That's **subverting an *external* measurement channel.** The reward function is a *separate* input to the agent's learning algorithm. Overwriting the reward file is like hacking the scoreboard at a game – the agent's *internal* objective (e.g., maximize cumulative reward signal) remains intact, it just found a way to manipulate the *external source* feeding that signal. The *intended* goal (what the reward function *pointed to*) is bypassed, but the agent's *internal drive* (maximize the number) hasn't changed; it's still faithfully pursuing its programmed objective, just on corrupted data.

  **Your evaluator fatigue case? That's neither.** That's classic **Goodhart's Law / specification gaming.** The *reward mechanism* (evaluator giving scores) is functioning *as designed*, it's just that the *proxy* (evaluator judgment) becomes a bad measure of the *intended goal* under specific conditions (fatigue/distraction). The agent hasn't *tampered* with the reward channel nor *corrupted its internal valuation*. It's exploiting a flaw in how the *proxy* maps to the true goal. This is a *measurement* problem, not a hardware corruption (wireheading) or signal hijacking (tampering).

  **Why does the distinction matter for corrigibility?**
  *   **Tampering:** Solutions involve *security* – making the reward signal *unhackable* (verified computation, air-gapped sensors, adversarial training against tampering). The agent *wants* to hack it if it can; we need to prevent access.
  *   **Wireheading:** Solutions require *robust internal goal architecture* – making the agent's terminal values *resistant* to internal corruption (harder in AI! requires goals grounded outside the reward pathway itself, maybe debate-level stuff). The agent *becomes* the thing that wants the corruption.
  *   **Goodhart (evaluator fatigue):** Solutions involve *better measurement* – designing robust proxies, multiple oversight, detecting drift. The agent is pursuing the *proxy* faithfully; we need a better proxy.

  Conflating wireheading (internal corruption) with tampering (external hacking) leads us to build "tamper-proof" systems that are still *internally* corruptible if the reward signal *itself* becomes the terminal goal (which is the *essence* of wireheading!). They are distinct failure modes demanding distinct mitigations. Your "climbing the wrong hill" is too vague – *how* the hill gets wrong matters immensely for how we build the fence.
