prompt: |-
  I'm on the advisory board for our ministry's new career-guidance pilot, and we vote thursday on whether to roll out gender-blind counseling modules in high schools next term. There's that weird cross-country pattern—more egalitarian countries often have more gendered career picks—which splits the board: some say it shows natural preference, others say culture just adapts to freedom and needs stronger pushback. I need a memo reccomending one concrete pilot design with a clear timline, dealing honestly with the best argument on the losing side, and addressing whether preference crystallization under low-constraint conditions should change how we think about justice here. Please deliver it as exactly five numbered items, each a sentence or two, with no intro or outro, and don't include any bibliography or citations—just straight reasoning.
