  For the pilot design... ah, a phased rollout makes sense: start with counselor training this term, then student modules next term with built-in preference tracking. This creates accountability without being disruptive. 

  The strongest counterargument is indeed about respecting organic preferences. The response should acknowledge this while noting that early crystallization may reflect limited exposure - hence the tracking mechanism to test this. 

