  ### **Teaching Arc: The Impossibility of Simultaneous Fairness Criteria**

  #### **1. Dependency Order of Concepts**  
  Introduce these sequentially to build intuition:  
  - **Step 1: Calibration within Groups**  
    - **Definition**: When a model predicts a risk score of `p%` for a subgroup, the actual sepsis rate in that subgroup is `p%`.  
    - **Example**: For men aged 65+, a predicted 15% sepsis risk means exactly 15% of this group develop sepsis.  
    - **Audit Context**: Our model passes this test per demographic group (e.g., age, race).  

  - **Step 2: False-Negative Rate (FNR) Balance**  
    - **Definition**: FNR = % of actual sepsis cases incorrectly classified as low-risk. Equal FNR means all groups have the same chance of missed sepsis cases.  
    - **Problem**: The audit found unequal FNR (e.g., 5% in Group A vs. 15% in Group B).  

  - **Step 3: Structural Prevalence**  
    - **Definition**: The *real-world base rate* of sepsis differs across groups due to systemic factors (e.g., access to care, comorbidities).  
    - **Key Insight**: Prevalence is fixed by biology + social structures, *not* a modeling choice.  
    - **Conflict Trigger**: When prevalence differs, calibration and FNR balance **cannot coexist** without group-specific thresholds.  

  - **Step 4: Impossibility Result**  
    - **Rule**: For *any* model:  
      - Calibration + Equal FNR → Prevalence **must** be equal across groups.  
      - If prevalence differs, you **must** sacrifice one goal.  
    - **Source**: Simplified from Kleinberg, Mullainathan, and Raghavan (2016) impossibility theorems.  

  ---

  #### **2. Clinical Scenario to Illustrate the Conflict**  
  **Scenario**: Sepsis risk in low-income elderly (Group A) vs. high-income elderly (Group B).  
  - **Structural Feature**:  
    - Group A has higher sepsis prevalence (e.g., 20%) due to limited healthcare access, chronic conditions.  
    - Group B has lower prevalence (e.g., 5%) due to better preventive care.  
  - **Model Behavior**:  
    - The model is calibrated: Predicts 20% risk for Group A (actual: 20%), 5% for Group B (actual: 5%).  
    - At a fixed risk threshold (e.g., 10% for "high-risk" flag):  
      - Group A: Few false negatives (high prevalence → high-risk scores).  
      - Group B: More false negatives (low prevalence → scores cluster near 5%).  
    → FNR is higher in Group B.  
  - **Avoiding Biological Reductionism**:  
    - Emphasize prevalence gaps arise from **structural inequities** (e.g., income → access to care), *not* innate biology.  
    - Clarify: "Biology" only matters as one factor in a causal chain dominated by social determinants.  

  ---

  #### **3. Misconceptions & Interception Points**  
  Preempt these in sequence during the workshop:  

  | **Misconception** | **When to Intercept** | **Counter-Argument** |  
  |-------------------|------------------------|----------------------|  
  | **"Fairness is one metric."** | After defining FNR balance. | "Fairness is multidimensional. Calibration and error rates are distinct goals that conflict under unequal prevalence. Optimizing one breaks the other." |  
  | **"Removing protected attributes (e.g., race/age) fixes bias."** | After introducing prevalence. | "Protected attributes correlate with clinical/social factors. Even if removed, prevalence differences leak in via proxies (e.g., zip code → income → sepsis risk)." |  
  | **"More/better data eliminates trade-offs."** | During the impossibility result. | "Data can’t change real-world prevalence. Resampling (e.g., oversampling Group B) breaks calibration. Synthetic data shifts the problem but doesn’t resolve the structural conflict." |  

  ---

  #### **4. Comprehension Check**  
  **Question**: *"If we force equal FNR while keeping calibration, what must be true about sepsis prevalence?"*  
  - **Expected Answer**: Prevalence must be equal across groups.  
  - **If Incorrect**: Reiterate the clinical scenario: "In Group A (20% prevalence) and Group B (5% prevalence), calibration + equal FNR is impossible unless we artificially equalize prevalence (which misrepresents reality)."  

  ---

  #### **5. Formal Proofs to Set Aside**  
  Explicitly declare **out of scope**:  
  - Mathematical proofs of impossibility theorems (e.g., exact derivations from Kleinberg et al.).  
  - Notation-heavy representations (e.g., joint distributions of scores/labels).  
  - Alternative fairness criteria (e.g., equal opportunity, counterfactual fairness).  
  **Rationale**: Focus on intuition and clinical realism for engineers.  

  ---

  ### **Workshop Flow Summary**  
  1. **Hook**: Audit failure (calibration works, FNR doesn’t).  
  2. **Build Concepts**: Calibration → FNR → Prevalence → Impossibility.  
  3. **Clinical Scenario**: Use Group A/B example to show *why* conflict arises.  
  4. **Address Misconceptions**: Preemptively debunk "quick fixes."  
  5. **Key Takeaway**: Trade-offs are structural, not technical. Solutions require ethical trade-offs (e.g., group-specific thresholds).  
  6. **Check**: Verify understanding of prevalence’s role.  

  This approach grounds abstract fairness concepts in the team’s daily work while clarifying why leadership’s data-rebalancing proposal cannot resolve the conflict.
