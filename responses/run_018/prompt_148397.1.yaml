  *   **Guided Exploration:** User defines **Divergence Budget (Δ)**. Engine performs constrained gradient ascent:  
      *   **Objective:** Maximize Novelty Score (cosine distance from training set centroids).  
      *   **Constraint:** **Anti-Inductive Regularization Term (λ * ||ΔKnobs||^2 * ThemeAttractorStrength)**.  
