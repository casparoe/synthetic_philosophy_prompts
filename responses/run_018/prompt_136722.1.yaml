  The core question here is about material constitution—how an object relates to its matter. The statue/clay problem is a classic puzzle: when you have a statue made of clay, are there two things (statue and clay) or just one? The friend's view is monist: only the clay exists, arranged in a statue shape. The pluralist view says both exist, with the statue depending on the clay.

  I need to break down the corporation analogy. Corporations are often seen as entities separate from their employees, but in law or philosophy, they might be reducible to the people and contracts involved. For the analogy: corporation = statue, employees = clay particles, firing/hiring = losing/gaining atoms. This suggests that just as a corporation persists through employee turnover, a statue persists through atomic changes.

  But where does this break down? With corporations, identity is tied to legal or functional continuity—like contracts and roles—which aren't physical. In contrast, statues and clay are purely physical; if you melt the clay, the statue is destroyed, but the clay might remain. Also, corporations can survive complete staff replacement over time, but for a statue, replacing all atoms at once might not preserve it—it's more about gradual change. The analogy might be smuggling in abstract, non-physical elements like social agreements, which don't apply to inanimate objects like statues.

  Does the one-object view survive without the analogy? Probably not strongly. Pluralists could argue that the statue has different persistence conditions—it's destroyed if deformed, while the clay isn't—suggesting they're distinct. The analogy's persuasive power hides this, so stripping it away might give ammo to pluralists.

  For a better analogy, I'll suggest a river: it persists through water molecule changes, but it's not the water itself. This captures constitution without reduction and highlights temporary parts naturally.

