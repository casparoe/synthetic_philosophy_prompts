  Final polish: avoid academic jargon. "Restorative cataloging" itself needs defining early on. And the conclusion should stress that this isn’t redemption, just a step toward ethical stewardship. The committee’s discomfort is part of the point.
answer: |-
  ## MEMORANDUM  
  **TO:** Acquisitions and Ethics Committee Members  
  **FROM:** [Your Committee Designation, e.g., Chair, Drafting Subcommittee]  
  **DATE:** October 10, 2023  
  **SUBJECT:** Recommendation Regarding Donation of 1970s Tenant Organizing Campaign Materials & Proposed Restorative Cataloging  

  ### I. Introduction
  This memo addresses the urgent decision regarding the offered donation of records documenting the 1970s [Neighborhood Name] tenant organizing campaign. The collection comprises solely landlord-generated "coercive records" (security logs, eviction notices, surveillance photos, court filings) and recent descendant-created "shadow histories" (oral reconstructions without contemporaneous corroboration). The donor proposes acceptance, digitization, and "restorative cataloging" to reframe metadata around the organizers. Our recommendation balances ethical preservation, historical integrity, and the potential for perpetuating harm.

  ### II. Analysis of Key Ethical and Historical Concerns
  **A. The Case for Acceptance & Restorative Cataloging:**  
  Proponents argue that traditional archival description inherently privileges the perspective of power (here, the landlords). "Restorative cataloging" is framed as necessary interpretive repair to center marginalized subjects rendered invisible by both historical violence (arson) and the nature of the surviving records. Reframing metadata and finding aids could transform these instruments of oppression into evidence of resistance, aligning with critical archival theory seeking to counter structural bias.

  **B. The Risk of Historical Distortion:**  
  Critics contend that restorative cataloging imposes present-day moral frameworks and activist agendas onto historical documents, potentially distorting historical understanding. The records *were* created as tools of discipline; altering their descriptive context risks obscuring their original function and the mechanisms of power they represent. While neutrality is a myth, reframing must avoid anachronism that hinders accurate comprehension of *how* oppression operated.

  **C. The Perpetuation of Harm & Ethical Refusal:**  
  The most profound concern is that preserving and providing access to these materials – *even reframed* – may extend the original violence. Surveillance photographs and personal data extracted through coercion retain their harmful potential. Circulating them risks re-victimization and further commodifying trauma. Ethical refusal argues that some silences are preferable to a curated, mediated presence that replicates the erasure it seeks to counter. Preserving the "master's tools" (the landlords' records) without the authentic voices of the oppressed may ultimately reinforce the very domination the archive intends to remedy, making refusal an act of integrity.

  ### III. Committee Recommendation: Conditional Acceptance with Rigorous Ethical Safeguards and Community Partnership
  **The Committee RECOMMENDS ACCEPTING the donation, subject to the following strict conditions and phased implementation:**  

  1.  **Immediate Acceptance (Upon Vote):**  
      *   Formalize donation agreement, explicitly acknowledging the sensitive nature of the coercive records and the interpretive status of the "shadow histories."
      *   Secure materials with standard preservation protocols.

  2.  **Mandatory Community Consultation Phase (Months 1-4 Post-Acceptance):**  
      *   **Purpose:** To determine the ethical parameters for processing, description, access, and potential use of the coercive records and the shadow histories. **This phase is non-negotiable.**
      *   **Participants:** Prioritize engagement with surviving organizers (if any exist), descendants involved in creating the shadow histories, representatives from relevant tenant rights/historical justice organizations, and scholars specializing in community archives, trauma-informed archiving, and the history of displacement/housing justice.
      *   **Key Questions:**
          *   Should *all* coercive records be preserved and made accessible? Are specific items (e.g., identifiable surveillance photos, sensitive personal data in logs) too harmful to retain or display?
          *   What level of description/reframing ("restorative cataloging") is desired and ethically sound? What terminology should be used/avoided?
          *   What access restrictions or contextual warnings are necessary for researchers and the public?
          *   How should the "shadow histories" be described to honor their intent while clearly indicating their interpretive, non-contemporaneous nature? How can their creation process be documented?
          *   Does the community support digitization? If so, under what specific conditions?

  3.  **Processing, Description & Access Implementation (Months 5-12, Informed by Consultation):**  
      *   **Coercive Records:**
          *   Process and describe with transparency about their *original* function as tools of oppression.
          *   Implement "restorative" or critical descriptive elements **only as explicitly guided by community input**, framing the organizers' agency *in relation to* the documented oppression, clearly indicating this is an interpretive layer. Avoid erasing the records' provenance and original intent.
          *   Enact stringent access protocols based on consultation: redaction of sensitive personal data, restrictions on specific image types, mandatory researcher agreements, prominent contextual statements on finding aids and digital interfaces warning of violent/extractive content.
          *   Digitization decisions will follow community guidance; potentially limit digitization of the most harmful items.
      *   **"Shadow Histories":**
          *   Process and describe clearly as "Oral History Reconstructions by Descendants, [Date Range]" or similar. Metadata must explicitly state they are non-contemporaneous interpretations based on family memory and inference, lacking documentary corroboration.
          *   Honor their role as "living counter-archives" while maintaining historical clarity about their nature.
          *   Digitization and access permitted as per donor agreement and standard practice, with clear descriptive context.
      *   **Cataloging Standard:** Reject the term "restorative cataloging" as potentially misleading. Adopt "Critical Contextual Description" or "Community-Informed Description" reflecting the dual commitment to historical accuracy and ethical reframing.

  4.  **Ongoing Review:** Commit to reviewing access policies and descriptive frameworks every 3 years, incorporating ongoing community feedback.

  ### IV. Rationale for Conditional Acceptance
  *   **Rejection Risks Irreparable Loss:** While ethically fraught, these are the *only* surviving documentary traces of this campaign. Rejection guarantees permanent silence.
  *   **Deferral is Inadequate:** Mere deferral without a commitment to community consultation kicks the ethical can down the road. Acceptance with mandated consultation provides a concrete framework for addressing the core ethical dilemmas.
  *   **Honoring the "Strongest Consideration":** This recommendation directly confronts the risk that preservation replicates harm. The mandatory consultation centers the potential for harm and empowers the affected community to dictate terms, including potential redaction or restricted access to the most sensitive coercive materials. It acknowledges ethical refusal *for specific components* as a possible outcome of the consultation.
  *   **Balancing Historical Integrity & Ethical Reframing:** The phased approach allows for critical description that acknowledges the records' oppressive origin *while* incorporating community-guided framing to highlight resistance, without imposing anachronistic judgments or obscuring historical reality.
  *   **Procedural Justice:** Centering community voices in determining the fate and form of records documenting their (or their ancestors') oppression aligns with principles of reparative and restorative justice in archives.

  ### V. Implementation Timeline Summary
  *   **Day 1:** Committee Vote on Recommendation.
  *   **Week 1 (If Accepted):** Execute Donation Agreement, Secure Materials.
  *   **Months 1-4:** Design & Execute Mandatory Community Consultation Process.
  *   **Months 5-12:** Process, Describe, and Establish Access Protocols Based on Consultation Findings.
  *   **Month 13:** Collection Open for Research (with established restrictions/warnings).
  *   **Ongoing:** 3-Year Policy/Description Reviews.

  ### VI. Conclusion
  This donation presents a profound challenge: to preserve evidence of erasure without perpetuating the violence embedded within the records. Rejection silences history; uncritical acceptance risks extending harm. Our recommendation for **Conditional Acceptance with Mandatory Community Consultation** offers a path forward. It acknowledges the validity of concerns about historical distortion by insisting on transparent description of the records' origins, and it takes the risk of perpetuating harm with utmost seriousness by placing decisions about the most sensitive materials and their description directly in the hands of the descendant and advocacy community. This process embraces the complexity, recognizing that ethical stewardship sometimes requires sharing curatorial authority and accepting that some scars in the historical record may be too deep to fully heal, but that silence is not the only alternative to uncritical preservation.

  **RECOMMENDED ACTION:** Vote to accept the donation under the strict conditions and implementation timeline outlined above.

  ---

  **Attachments:**  
  *   Draft Community Consultation Plan Outline  
  *   Proposed Donation Agreement Addendum (Ethical Conditions Clause)
