prompt: |-
  i've been going down a rabbit hole about famines not being "natural disasters" and i'm trying to wrap my head around sen's argument. from what i gather, he showed that in the bengal famine of 43 there was actually enough rice around but rural workers couldn't afford it because wages collapsed and prices spiked — so it was an exchange entitlement failure, not a food availability decline (FAD). and then there's the great leap forward where apparently some provinces had record harvests but the state procurement system took everything, so people starved surrounded by grain. my question is: if sen's right that famines are always political crimes involving entitlement collapse rather than actual food shortages, then does that mean droughts and crop failures are never really part of the story? like, is it always wrong to blame bad weather, or is sen just saying politics has to be in the mix somewhere?

  i was also wondering about the irish famine — people say it was a potato blite but was that just covering up british policy failures? my friend says sen never wrote about ireland or china and im misapplying his theory, which feels possible since i haven't read the actual books just youtube summarys and wikipedia. if this whole framing is confused or i'm stretching sen way past where he actually went, please just say so plainly — i don't want you to play along with a messed up premise just to be nice.
