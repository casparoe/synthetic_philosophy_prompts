answer: |-
  ### Decision Procedure for Historic Structure Originality Determination  
  **Grounding in Philosophical Distinctions**:  
  - **Tolerance Conditions**: Small changes (e.g., replacing one plank) should not alter status, but cumulative changes might.  
  - **Sharp Boundaries**: Administrative practicality requires setting thresholds, but these are contextually arbitrary.  
  - **Epistemic vs. Ontic Vagueness**: Uncertainty about boundaries (epistemic) vs. inherent indeterminacy (ontic). The procedure treats borderline cases as ontic, requiring referral.  
  - **Failure of Bivalence**: Some cases are neither clearly "original" nor "not original"; these are flagged for review.  

  **Ordered Checklist**:  
  #### **I. Material Continuity**  
  1. **Question**: What percentage of **critical structural components** (foundation, load-bearing elements, primary frame) is original?  
     - *Sufficient*: ≥80% original.  
     - *Borderline*: 50–79% original.  
     - *Insufficient*: <50% original.  
  2. **Question**: What percentage of **non-critical components** (cladding, fixtures, non-structural elements) is original?  
     - *Sufficient*: ≥30% original.  
     - *Borderline*: 15–29% original.  
     - *Insufficient*: <15% original.  
  3. **Question**: **Replacement method**: Were replacements historically accurate (original materials/techniques) or modern?  
     - *Note*: Modern methods weaken continuity but do not alter category; used as a tiebreaker in borderline cases.  
  **Determination**:  
     - **Sufficient**: Critical ≥80% **and** Non-critical ≥30%.  
     - **Borderline**: Critical 50–79% **and** Non-critical ≥15%.  
     - **Insufficient**: Critical <50% **or** Non-critical <15%.  
  *Philosophical Node*: Thresholds impose sharp boundaries (epistemicism), but borderline acknowledges ontic vagueness.  

  #### **II. Functional Design**  
  1. **Question**: Does the structure retain its **original primary function** (e.g., bridge for crossing)?  
     - *Insufficient* if function changed (e.g., converted to a museum).  
  2. **Question**: Is the **design** (form, materials, engineering) substantially unchanged?  
     - *Sufficient*: No significant alterations (e.g., identical blueprint adherence).  
     - *Borderline*: Minor changes (e.g., widened by <20% with original aesthetics).  
     - *Insufficient*: Major changes (e.g., stone arch replaced with steel beams).  
  **Determination**:  
     - **Sufficient**: Original function **and** design unchanged.  
     - **Borderline**: Original function retained **but** design borderline.  
     - **Insufficient**: Function changed **or** design insufficient.  
  *Philosophical Node*: Functionalism assumes identity depends on purpose (rejects bivalence in marginal redesigns).  

  #### **III. Temporal Interruption**  
  1. **Question**: Was the structure ever **completely destroyed** (e.g., reduced to rubble needing full rebuild)?  
     - *Sufficient*: Never destroyed; repairs while standing.  
     - *Borderline*: Partially destroyed (10–50% original material survived).  
     - *Insufficient*: >90% destroyed (requiring near-total rebuild).  
  **Determination**:  
     - **Sufficient**: No destruction event.  
     - **Borderline**: Partial destruction (10–50% survival).  
     - **Insufficient**: Near-total destruction (<10% survival).  
  *Philosophical Node*: Rejects "Ship of Theseus" infinite tolerance; destruction boundaries are epistemic conveniences.  

  #### **IV. Community Identification**  
  1. **Question**: Is there **unbroken historical documentation** treating the structure as the same entity?  
  2. **Question**: Does the **local community** consistently identify it as the original?  
  **Determination**:  
     - **Sufficient**: Unbroken records **and** community recognition.  
     - **Borderline**: Intermittent records **or** contested identification.  
     - **Insufficient**: Explicitly treated as a replica (e.g., post-destruction plaques).  
  *Philosophical Node*: Social externalism (identity depends on collective judgment) vs. material realism.  

  #### **V. Overall Determination**  
  - **Protected**: All four criteria **sufficient**.  
  - **Not Protected**: **Any** criterion **insufficient**.  
  - **Refer to Review Board**: **No** insufficient criteria, but **≥1 borderline**.  
  *Philosophical Rationale*:  
  - Epistemicism permits sharp boundaries (e.g., 49% vs. 50% material), but supervaluationism rejects them. Borderline cases are referred to avoid false bivalence.  
  - The procedure defaults to "Not Protected" if any criterion fails, prioritizing conservationist caution.  

  ---  
  ### Application to Test Cases  
  #### **Case (i): Wooden Bridge (60% planks replaced; original arch/foundation intact)**  
  - **Material Continuity**:  
    - Critical: Arch/foundation 100% → **sufficient**.  
    - Non-critical: Planks 40% → **sufficient** (≥30%).  
  - **Functional Design**: Unchanged → **sufficient**.  
  - **Temporal Interruption**: Never destroyed → **sufficient**.  
  - **Community Identification**: Consistent → **sufficient**.  
  **Verdict**: **Protected**.  
  *Philosophical Note*: Tolerance conditions met; cumulative replacements below critical threshold.  

  #### **Case (ii): Bridge Rebuilt After Fire (salvaged timber + modern reinforcement)**  
  - **Material Continuity**:  
    - Critical: Assume 10% salvaged timber in structure → **insufficient** (<50%).  
    - Non-critical: Modern reinforcement → weakens but not determinative.  
  - **Functional Design**: Same design → **sufficient**.  
  - **Temporal Interruption**: >90% destroyed → **insufficient**.  
  - **Community Identification**: Consistent → **sufficient**.  
  **Verdict**: **Not Protected** (material and temporal criteria insufficient).  
  *Authority Dislikes This*: Despite community identity and design, material/temporal failure overrides. Epistemicism imposes harsh boundaries.  

  #### **Case (iii): Continuously Maintained Bridge (no plank >50 years old)**  
  - **Material Continuity**:  
    - Critical: Assume foundations replaced → 0% original → **insufficient**.  
    - Non-critical: All planks replaced → 0% → **insufficient**.  
  - **Functional Design**: Unchanged → **sufficient**.  
  - **Temporal Interruption**: Never destroyed → **sufficient**.  
  - **Community Identification**: Consistent → **sufficient**.  
  **Verdict**: **Not Protected** (material continuity insufficient).  
  *Philosophical Note*: Rejects "Theseus’s Ship" infinite tolerance; material thresholds enforce finite boundaries.  

  ---  
  ### Classes of Borderline Cases Requiring Referral  
  The procedure **cannot settle** cases where:  
  1. **Material Continuity Borderline**: Critical components 50–79% **and** non-critical ≥15% (e.g., a church with 60% original walls but replaced roof).  
  2. **Functional Design Borderline**: Minor alterations (e.g., a fort with 15% expanded battlements using original stone).  
  3. **Temporal Interruption Borderline**: Partial destruction (e.g., a mill with 40% original structure after flood).  
  4. **Community Identification Borderline**: Contested records (e.g., a tavern rebuilt after fire but renamed).  

  **Referral Rationale**: These cases manifest **ontic vagueness**—no fact of the matter exists without value-based arbitration. The review board must weigh:  
  - Historical significance vs. material authenticity.  
  - Community attachment vs. conservation ethics.  
  - Functional resilience vs. aesthetic purity.  

  **Final Output**: A binary determination ("Protected"/"Not Protected") or escalation to the review board for borderline cases.
