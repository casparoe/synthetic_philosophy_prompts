prompt: |-
  My roommate and her coworker argued over dinner about why norms like slavery and dueling actually disappeared. Maya said she mostly buys the Appiah and Williams line—that norms like those don't collapse because people suddenly win arguments, but because honor codes shift and make the old practice embarrassing. She added her own twist: with slavery, slaveholders already saw themselves as honorable gentlemen, so the revolution wasn't honor being redirected toward abolition, but honor suffering status inflation—once gentleman-status got too cheap to claim, owning slaves went from noble to tacky. Jordan said that's just economic interest wearing a fancy coat. Industrial capitalism made slave labor inefficient, and dueling died because states monopolized violence and raised legal risks—honor is just the story people tell afterward. Maya pushed back that slaveholders fought a war they knew was economically ruinous, which only makes sense if status and honor were really on the line, not pocketbooks. And dueling bans existed for centuries with little effect—only when elites started seeing it as cowardly rather than brave did it actually stop. Jordan replied that Maya's "status inflation" collapses honor right back into social competition, which is just interest by another name. Plus if honor shifts are totally independent of reason, then the Appiah thesis makes moral revolutions look like fashion trends with no normative pull, which can't be right. They want me to referee and I honestly can't tell who's winning. Can you go through their exchange round by round—say who's clearly right or wrong at each step, note what both miss, and give an overall sense of who's closer? Also say exactly what argument or fact would change your verdict, and be straight about where your reasoning is shakiest. Format it like this: "The dispute" (~150 words), "Round-by-round" (~350 words), "What's missing" (~150 words), "What would change my mind" (~100 words). I'm writing this on my phone so there might be a typo or two—sorry if "refferee" is misspelled or something.
reasoning: |-
  Okay, the user wants me to referee a debate between Maya and Jordan about why norms like slavery and dueling disappeared. Let me break down their arguments. 

  Maya follows Appiah and Williams, emphasizing shifts in honor codes leading to embarrassment over old practices. She adds a twist about "status inflation" where owning slaves became "tacky" when gentleman status became too cheap. Jordan counters that it's really economic interests and legal changes—industrial capitalism made slavery inefficient, and states monopolizing violence reduced dueling. 

  Maya pushes back: slaveholders fought a costly war for status, not economics, and dueling bans only worked when elites saw it as cowardly. Jordan argues that "status inflation" reduces honor to social competition, which is just interest in disguise, and moral shifts without reason seem like fashion trends.

  I need to assess each round. First, Maya's honor shift vs. Jordan's economic angle. Slavery's collapse: Jordan has a point about economic factors, but Maya's Civil War example holds weight—why fight a ruinous war if not for honor? Dueling: Jordan's legal explanation is solid, but Maya's timing argument about elite perception changing is compelling. Jordan's critique about honor collapsing into interest is strong, but Maya's distinction between material and status interests is valid.

  What's missing? Both overlook how honor and economics interact. For slavery, Northern industrial interests vs. Southern honor. Also, the role of moral arguments—Appiah doesn't ignore reason, just emphasizes emotional catalysts. Dueling's decline needed both legal enforcement and cultural shift.

  What would change my mind? If pre-Civil War Southerners openly admitted economic motives over honor, or if dueling declined solely due to enforcement without cultural change. My shakiest point is equating status with interest—maybe they're distinct motivations.

  Overall, Maya edges out because her examples show honor's independent force, especially in irrational actions like the Civil War. But it's close; both factors matter.
answer: |-
  ### The Dispute  
  Maya argues that norms like slavery and dueling collapsed primarily due to shifts in honor culture, not rational argument or economics. Citing Appiah/Williams, she contends slavery became "tacky" when gentleman-status inflated (making slaveholding lose prestige), and dueling only died when elites saw it as cowardly. Jordan counters that material interests drove both changes: slavery became inefficient under industrial capitalism, and states suppressed dueling by monopolizing violence. He dismisses honor as a post-hoc narrative and claims Maya’s "status inflation" reduces honor to social competition (i.e., disguised self-interest). Maya insists slaveholders’ economically ruinous Civil War proves honor’s primacy, while Jordan retorts that her thesis renders moral change arbitrary, like fashion.

  ### Round-by-Round Assessment  
  1. **Maya’s Opening (Appiah/Williams + Status Inflation)**  
     *Right:* Correct that moral revolutions often pivot on shame/embarrassment (e.g., dueling declined when Romanticism reframed it as theatrical, not brave).  
     *Wrong:* Overstates "independence" from economics; plantation slavery’s profitability *was* threatened by industrialization and wage labor.  
     **Verdict:** Partially right but incomplete.  

  2. **Jordan’s Rebuttal (Economics/Laws as Drivers)**  
     *Right:* Industrial capitalism *did* undermine slavery’s efficiency (e.g., Adam Smith’s critiques), and state monopolization of violence (e.g., stricter dueling laws post-1820s) raised costs.  
     *Wrong:* Underestimates cultural agency. Slaveholders fought the Civil War despite economic forecasts of ruin, and dueling bans failed for centuries until cultural stigma emerged.  
     **Verdict:** Strong on structures, weak on motivation.  

  3. **Maya’s Pushback (War & Dueling Timing)**  
     *Right:* The South’s secession *was* driven by "honor culture" (historian Bertram Wyatt-Brown) and fear of status erosion. Dueling persisted in Europe despite bans until 19th-century cultural shifts (e.g., British officers court-martialed for dueling post-1840s).  
     *Wrong:* Ignores that economic stress *amplified* Southern status anxiety (e.g., falling cotton prices).  
     **Verdict:** Wins this round—honor explains irrational sacrifices.  

  4. **Jordan’s Final Critique (Honor = Interest / Moral Arbitrariness)**  
     *Right:* Redefining honor *as* status competition *does* risk circularity. Appiah’s model *can* downplay reasoned advocacy (e.g., abolitionist arguments *did* sway public shame).  
     *Wrong:* Conflates "social" with "material" interest. Duelists died for intangible reputation; slaveholders lost wealth for perceived dignity.  
     **Verdict:** Partially valid critique but oversimplifies honor.  

  **Overall Score:** Maya 2.5, Jordan 1.5 (out of 4 rounds). Maya’s evidence of counter-economic actions gives her the edge, but Jordan exposes gaps in her framework.

  ### What’s Missing  
  - **Interaction Effects:** Honor shifts often *follow* material/legal changes. Dueling declined through *both* cultural stigma (Maya) *and* enforceable laws (Jordan).  
  - **Abolitionist Agency:** Both downplay how moral arguments (e.g., Enlightenment critiques) *shaped* new honor codes. Appiah acknowledges this, but Maya underemphasizes it.  
  - **Global Nuance:** Slavery ended in Brazil (1888) without war; British abolition combined evangelical shame *and* economic pivots to wage labor. Dueling faded earlier in the UK than in Germany, showing law/culture interplay.

  ### What Would Change My Mind  
  - **For Jordan:** Evidence that Southern elites *privately* cited economics over honor as the *primary* secession motive (diaries show the opposite). Or proof that dueling declined solely due to prosecution, with *no* shift in elite attitudes (historical records contradict this).  
  - **For Maya:** If pre-1860s slaveholders *en masse* called slavery "tacky" due to status inflation (no such evidence—critiques focused on morality/efficiency).  
  - **Shakiest Point:** Equating "status interest" with "material interest." Jordan’s conflation feels reductive, but Maya’s distinction isn’t airtight. If status-seeking is *always* adaptive self-interest, Jordan wins. But suicidal honor (e.g., duelists) suggests otherwise.
