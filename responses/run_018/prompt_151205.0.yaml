answer: |-
  Here's a careful unpacking of that conceptual knot in Scanlon's contractualism, focusing on the tension between indexical reasonableness and potential collective scaling:

  **Core Tension Explained:**

  1.  **The Indexical Anchor:** At its heart, Scanlonian "reasonable rejection" is fundamentally **indexical** and **first-personal**. Each individual assesses a principle *from their own standpoint* based on *their own* reasons (burdens, benefits, alternatives). They ask: "Given the burdens *I* would bear under this principle compared to alternatives, can *I* reasonably reject it?" Your "one-in-a-million" micro-harm case exploits this perfectly: *My* tiny burden provides *me* with insufficient reason for rejection. Rejection must be grounded in *my* complaint.

  2.  **The Requirement of Justifiability "To Each":** The key phrase "justifiable *to each person*" imposes a **distributive requirement**. A principle must pass muster *individually* for every single person. It's not enough that it's justifiable "to people collectively" or "on average." Each person is a veto point if they have a sufficiently strong individual complaint.

  3.  **The Aggregation Gap & Its Source:** The inability to aggregate micro-harms stems directly from points 1 and 2:
      *   No single individual suffers a burden significant enough to ground a *reasonable rejection* from *their own* standpoint.
      *   Since the principle must be justifiable *to each*, and *no individual* has strong enough grounds for rejection, the principle allowing the diffuse harm cannot be reasonably rejected *by anyone*.
      *   The *collective* harm (one unit total) is morally significant, but it remains **invisible to the indexical rejection test**. It doesn't register as a *reason* for any *particular individual* to reject the principle, as their contribution to it is negligible.

  4.  **The Hidden Collective Dimension - Tension Point:** Here's the knot: Does the requirement that a principle be "justifiable *to each* person" *itself* implicitly introduce a collective or comparative dimension *within the individual assessment*?
      *   **Argument For:**
          *   When Person A considers rejecting Principle P, they don't *only* look at their own burden in isolation. They implicitly compare the *distribution of burdens* under P versus alternatives. They see that under the alternative concentrated-harm principle, *someone else* suffers a massive burden.
          *   Crucially, Scanlon argues that the *comparative* strength of complaints matters. Person A knows that *if they reject* the diffuse-harm principle P, the alternative forces an enormous, clearly rejectable burden onto *some specific individual* (or small group). Person A's complaint (their micro-harm) is vastly *weaker* than the concentrated-harm victim's complaint would be under the alternative.
          *   Therefore, Person A concludes that *their own* complaint **is not strong enough** to make rejecting P *reasonable*, **precisely because** rejecting P would impose a much worse burden on someone else. Their assessment incorporates the *relative severity* of burdens *across individuals* under competing principles. This comparative judgment seems inherently non-indexical; it requires looking at the *pattern* of burdens affecting *others*.
      *   **Argument Against:**
          *   Person A's judgment remains ultimately grounded in *their own* moral reason: the recognition that it would be *unreasonable for them* to insist on a principle that avoids their tiny burden at the cost of imposing a devastating burden on someone else. The reasonableness of *their* acceptance or rejection hinges on the *comparative weight* of *their own* burden versus the *worst-off burden under alternatives*. The "collective" picture informs *their individual* reasonableness calculation, but the rejection power itself remains firmly located in the individual and indexed to *their* comparative standing.

  **Is the Inability to Aggregate Just a Logical Feature?**

  Yes, **primarily**. The aggregation gap is the *direct consequence* of the core individualist restriction. If "reasonable rejection" must be grounded in a burden significant enough *from that individual's own standpoint* to justify their veto, and micro-harms never meet that threshold individually, then diffuse harms *logically cannot* be aggregated to form a basis for rejection. This is a feature, not a bug, of the strict individualist interpretation. The tension arises because this feature seems to conflict with the moral intuition that *total* harm matters.

  **Does it Point to an Undeveloped Collective Dimension?**

  **Partially, and this is where the deep philosophical tension lies.**
  *   **The "To Each" Requirement as Constraint:** The distributive requirement ("to each") acts as a powerful *constraint* against imposing severe burdens on individuals for aggregate gain. This is a core strength against utilitarianism.
  *   **The "To Each" Requirement as Potential Opening?:** However, the *comparative* aspect of individual reasonableness assessment (weighing *my* burden against *others'* potential burdens under alternatives) suggests that the individual standpoint is **not hermetically sealed**. Individuals *do* consider the overall distribution and the relative positions of others when judging the reasonableness of *their own* rejection. This comparative judgment is essential for the framework to function and avoid stalemates where everyone rejects everything imposing any burden.
  *   **The Undeveloped Question:** The crucial undeveloped question is: **Can the *recognition* of the collective harm *itself* ever become a *first-personal reason* powerful enough for an individual to reasonably reject a principle, *even if their own direct burden is tiny*?** Scanlon's standard framework says "no" because the direct burden is too small to ground rejection, and rejecting to prevent the collective harm would (under the alternative) impose a massive direct burden on someone else, making *their* rejection unreasonable. But does this fully capture the moral significance of the *collective* outcome?

  **Confidence & Uncertainty:**

  *   **Overall Confidence:** **High (85%)** in the analysis above: that the aggregation gap is primarily a logical consequence of the indexical, individualist foundation; that the tension arises from the comparative nature of reasonableness assessments incorporating the burdens of others; and that this points to a complex interplay between individual standpoint and collective pattern that Scanlon acknowledges but doesn't fully resolve in favor of aggregating micro-harms.
  *   **Point of Least Certainty / Key Uncertainty:** **Whether "reasonable rejection" could *ever* be fundamentally non-indexical.** Specifically: Could the *sheer number* of individuals affected by micro-harms (the collective harm) *itself* generate a distinct *kind* of first-personal reason for rejection that Scanlon's comparative framework currently overlooks? For example:
      *   Could Person A reasonably reject the diffuse-harm principle *because* it reflects a *systematic disrespect* or *failure of mutual recognition* by imposing burdens *on everyone* without sufficient justification, making the social structure itself objectionable *to them*? This shifts the complaint from the *size of the burden* to the *nature of the principle* governing social interaction.
      *   Is there a non-consequentialist way to argue that bearing *any* burden for a policy lacking strong justification *while knowing millions of others bear the same pointless burden* creates a unique kind of *relational* or *civic* complaint grounded in fairness or reciprocity? This complaint would be indexed to the individual ("*I* am part of this unjustified imposition affecting us all") but its *reason* is inherently collective.

  **Conclusion:** The tension arises because the indexical nature of "reasonable rejection" logically prevents aggregating micro-harms for rejection purposes, while the requirement of justifiability "to each" forces individuals to make comparative judgments about the burdens of *others*. This comparative element introduces a non-indexical dimension *into* the individual's reasoning, but it doesn't currently provide a pathway for the *collective harm itself* to become a direct ground for reasonable rejection. The deepest uncertainty lies in whether contractualism could develop a conception of individual reasonableness that incorporates a *first-personal complaint about being part of a collectively harmful pattern* as a distinct moral reason, without collapsing into consequentialism or abandoning its core individualist commitment. Scanlon's framework brilliantly exposes the problem but leaves this specific conceptual knot tightly tied.
