  - "Early rounds could signal type!" → Under CKR, types are known. Signaling is redundant and costly. 

  User wants continuous prose - no bullet points, just flowing logical steps. Need to sound convinced but not dogmatic... confident in the machinery of rationality. 

  *Final polish*: Emphasize that backward induction is a steel trap. Audits merely give us more tools to see its teeth faster. The game collapses at round one with even more inevitability now. 

