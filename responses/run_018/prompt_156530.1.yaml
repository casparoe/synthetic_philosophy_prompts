prompt: |-
  ok so im curating a dataset of historical atrocities and trying to build a reusable tagging proceedure based on lemkins actual framework—not just the narrow UN convention version but the broader original one that included cultural and political destruction—so that annotaters without legal training can apply it consistently. i want a step-by-step decision tree in words: first check if there's a protected-group target (national, ethnical, racial, religious, or in lemkins broader view cultural/political collectives), then check for intent to destroy that group as such, then check whether the destruction is partial or total, but also run a seperate branch for cultural-genocide indicators like systematic language suppression or institutional destruction even when physical killing is minimal. include explicit test sentences or questions at each node that an annotator can answer yes/no/maybe. then work through two cases: one where state-induced famine is framed as 'economic reform' and the procedure has to decide if that masks genocidal intent, and one where destroying religious schools and archives happens with almost no direct killing—here the legal-definition branch should say no, but the broader lemkin branch should say yes, and i want the annotator to flag the divergence rather than resolve it. mark every step thats a judgment call dressed up as procedure—especially defining the group boundary when identities are hybrid or contested—and say what the procedure cant settle, like when two survivor communities apply different labels to the same event. keep it practical: each decision should take under five minutes, and flag where an annotator has to escalate to a human reviewer. dont ask for citations, just the operationalized framework with the hard cases and misfire points built in.
reasoning: |-
  We are building a decision tree for annotators to tag historical atrocities based on Lemkin's broader framework of genocide, which includes cultural and political destruction, not just the physical destruction in the UN Convention.

   The decision tree will have two main branches:
    1. The "Physical Genocide" branch (which includes the UN Convention's elements but also uses Lemkin's broader group definitions).
    2. The "Cultural Genocide" branch (which is not in the UN Convention but is part of Lemkin's original concept).

   Steps:

   1. Check for a protected group target (national, ethnical, racial, religious, or in Lemkin's broader view: cultural or political collectives).
      - Test question: "Is the target of the atrocity a distinct group defined by shared national, ethnic, racial, religious, cultural, or political identity?"
          - If yes, proceed.
          - If no, stop (not genocide under either definition, though note: the event might still be a crime against humanity or war crime, but that's out of scope for this tagging).

   2. Check for intent to destroy the group, in whole or in part, as such.
      - Test question: "Is there evidence that the perpetrator intended to destroy the group (in whole or in part) because of its group identity?"
          - This is a judgment call: look for explicit statements, patterns of action that target the group, or systematic policies that disproportionately affect the group and are not justified by military necessity or other legitimate state interests.
          - Note: Intent can be inferred from the totality of circumstances.

   3. Check the nature of destruction:
      - Physical Genocide branch: 
          - Test question: "Did the acts include killing members of the group, causing serious bodily or mental harm, deliberately inflicting conditions of life calculated to bring about physical destruction, imposing measures intended to prevent births, or forcibly transferring children?"
          - If yes to any, then it qualifies as physical genocide (even if partial).

      - Cultural Genocide branch (run in parallel, even if physical branch is positive, because we want to tag both aspects if present):
          - Test question: "Did the acts include systematic suppression of the group's language, destruction of cultural institutions (e.g., schools, libraries, places of worship), suppression of religious practices, destruction of historical monuments, or other measures aimed at erasing the group's cultural identity?"
          - If yes, then it qualifies as cultural genocide.

   4. Partial vs. Total Destruction:
      - For physical genocide: 
          - Test question: "Was the intent to destroy the entire group (total) or a substantial part (partial)?"
      - For cultural genocide:
          - Test question: "Was the intent to completely eradicate the group's cultural identity (total) or to suppress it in part (partial)?"

   5. Flagging divergence:
      - If the event qualifies as physical genocide under the UN Convention (or the physical branch) but not cultural, tag as physical.
      - If the event qualifies as cultural but not physical, tag as cultural (and note that this would not be genocide under the UN Convention, but is under Lemkin's broader definition).
      - If both, tag both.

   6. Handling cases where the group boundaries are contested or hybrid:
      - Judgment call: The annotator must decide if the targeted group is sufficiently distinct and falls within one of the protected categories. If the group identity is ambiguous (e.g., a social class that also has ethnic dimensions, or a political group that is also defined by religion), the annotator should:
          - Test question: "Is the group primarily targeted because of its national, ethnic, racial, religious, cultural, or political identity, and is that identity a core part of the group's existence?"
          - If unsure, mark as "maybe" and escalate to a reviewer.

   7. Intent masked as something else (like economic reform):
      - Test question: "Despite the stated justification (e.g., economic reform), is there evidence that the policy was designed to disproportionately harm the protected group and destroy them in whole or in part?"
          - Look for: disproportionate impact, exclusion of the group from relief, historical context of animosity, statements by perpetrators, etc.
          - This is a judgment call: if the evidence is ambiguous, mark as "maybe" and escalate.

   8. When survivor communities disagree:
      - The procedure cannot settle this. The annotator should note the disagreement and tag based on the preponderance of evidence. If there is significant disagreement among sources, mark as "contested" and escalate.

   9. Time constraint: Each decision step should take under five minutes. Steps that require deep contextual analysis (e.g., inferring intent, group definition) should be flagged for escalation when ambiguous.

   Now, let's build the decision tree in words:

   Decision Tree for Genocide Tagging (Lemkin Framework)

   Step 0: Precondition - Is the event an atrocity? (We assume we are only tagging events already identified as atrocities.)

   Step 1: Group Identification
     - Question: "Is there a targeted group that is defined by a shared national, ethnic, racial, religious, cultural, or political identity?"
          - Yes: Proceed to Step 2.
          - No: Stop. Not genocide (tag as non-genocide atrocity, if applicable in your system).
          - Maybe: Escalate to reviewer. (Judgment call: group boundaries may be hybrid or contested.)

   Step 2: Intent to Destroy
     - Question: "Did the perpetrator(s) intend to destroy this group, in whole or in part, because of its identity?"
          - Look for: explicit statements, patterns of action, policies that specifically target the group and are not justifiable by non-genocidal reasons.
          - Yes: Proceed to Step 3 (Physical branch) and Step 4 (Cultural branch) in parallel.
          - No: Stop. Not genocide (unless intent can be inferred from the acts? But the definition requires intent. So if no, then not genocide. But note: sometimes intent is inferred. So if the acts are so systematically destructive that intent is the only reasonable inference, then mark yes. This is a judgment call.)
          - Maybe: Escalate to reviewer.

   Step 3: Physical Genocide Branch (acts)
     - Question: "Did the acts include any of the following, targeting the group?
          a) Killing members of the group.
          b) Causing serious bodily or mental harm to members of the group.
          c) Deliberately inflicting conditions of life calculated to bring about the group's physical destruction (e.g., starvation, deprivation of medical care).
          d) Imposing measures intended to prevent births within the group (e.g., forced sterilization, prohibition of marriage).
          e) Forcibly transferring children of the group to another group."
     - Yes: Physical genocide is present. Then go to Step 5 for partial/total.
     - No: Physical genocide is absent (but cultural might still be present).

   Step 4: Cultural Genocide Branch (acts)
     - Question: "Did the acts include any of the following, targeting the group?
          a) Systematic suppression of the group's language (e.g., banning use in schools, public life).
          b) Destruction of cultural institutions (e.g., schools, libraries, museums, places of worship) that are central to the group's identity.
          c) Destruction or desecration of cultural heritage (e.g., monuments, historical sites, religious artifacts).
          d) Suppression of religious practices and institutions.
          e) Disruption of family and community structures that transmit culture (e.g., forced removal of children for cultural assimilation)."
     - Yes: Cultural genocide is present. Then go to Step 6 for partial/total.
     - No: Cultural genocide is absent.

   Step 5: Physical Genocide - Partial or Total?
     - Question: "Was the intent to destroy the entire group (total) or a substantial part (partial)?"
          - Note: Substantial part can be defined by numbers, strategic importance, or symbolic importance (e.g., a community that is essential to the group's survival). This is a judgment call.
          - Total: Tag as physical genocide (total).
          - Partial: Tag as physical genocide (partial).
          - Maybe: Escalate.

   Step 6: Cultural Genocide - Partial or Total?
     - Question: "Was the intent to completely eradicate the group's cultural identity (total) or to suppress it in part (partial)?"
          - Total: Tag as cultural genocide (total).
          - Partial: Tag as cultural genocide (partial).
          - Maybe: Escalate.

   Step 7: Flagging Divergence
     - If physical genocide is present and cultural is absent: Tag as "Physical Genocide" (and note: this matches the UN Convention).
     - If cultural genocide is present and physical is absent: Tag as "Cultural Genocide" (and note: this does not match the UN Convention but is part of Lemkin's framework).
     - If both are present: Tag both.

   Step 8: Special Cases
     - Case 1: State-induced famine framed as 'economic reform'
          - Step 1: Group? Yes (e.g., an ethnic group in a region).
          - Step 2: Intent? We must look beyond the frame. Questions: 
              - Was the famine disproportionately affecting the group?
              - Was there a history of conflict with the group?
              - Were relief efforts denied to the group?
              - Were there statements indicating a desire to eliminate the group?
              - If evidence points to intent, then yes. Otherwise, maybe (escalate).
          - Step 3: Physical genocide? Yes, because inflicting conditions of life (starvation) if intent is established.
          - Step 4: Cultural genocide? Maybe (if, for example, the famine led to the breakdown of cultural transmission, but that's indirect; if there was also destruction of cultural institutions, then yes). In this case, we might not have cultural acts.

     - Case 2: Destroying religious schools and archives with minimal killing
          - Step 1: Group? Yes (religious group).
          - Step 2: Intent? Yes (because the destruction is systematic and targets the group's identity).
          - Step 3: Physical genocide? No (minimal killing, and the acts don't include the physical destruction acts listed).
          - Step 4: Cultural genocide? Yes (destruction of cultural institutions: religious schools and archives).
          - Step 7: Flag divergence: This would be cultural genocide only (not physical) so the UN Convention would not call it genocide, but Lemkin would.

   Step 9: Annotator Guidance
     - Time: Each step should take under 5 minutes. If an annotator is stuck, they should escalate.
     - Escalate when:
          - Group identity is ambiguous (Step 1: maybe).
          - Intent is ambiguous (Step 2: maybe).
          - The acts are borderline (e.g., is the destruction of a single school systematic? Step 4: maybe).
          - Partial vs. total is unclear (Steps 5 and 6: maybe).
          - There is significant disagreement among sources.

     - The procedure cannot settle:
          - When two survivor communities label the same event differently (e.g., one calls it genocide, another does not). The annotator should note the disagreement and tag based on the preponderance of evidence, but flag for reviewer.

     - Judgment calls dressed as procedure:
          - Step 1: Defining the group when identities are hybrid or contested.
          - Step 2: Inferring intent, especially when masked.
          - Step 5 and 6: Determining partial vs. total destruction.

     - Important: The annotator is not required to resolve the divergence between the UN Convention and Lemkin's framework. They tag both aspects and note the divergence.

   Let's formalize the steps with explicit questions and then run the two cases.
answer: |-
  Here's a step-by-step decision tree for genocide tagging under Lemkin's expanded framework, designed for rapid annotation with built-in divergence flags and escalation points. Key judgment calls are explicitly marked (**JC**), and limitations are highlighted.

  ---

  ### **Genocide Tagging Decision Tree (Lemkin Framework)**
  **Core Principle:** Tag *both* UN Convention (physical) and Lemkin (cultural/political) criteria separately.  
  **Time Budget:** ≤5 min per case step. Escalate ambiguities.

  ---

  #### **STEP 1: GROUP IDENTIFICATION**  
  **Question:** *"Is the target a collective with shared identity (national, ethnic, racial, religious) OR a cultural/political group (e.g., language community, dissident faction, social class with distinct traditions)?"*  
  - **Yes** → Proceed to Step 2.  
  - **No** → Stop (not genocide).  
  - **Maybe** → Flag: **"Group boundary contested"** and escalate.  
    - **JC:** Hybrid identities (e.g., "ethnic + class") require judging primary targeting motive.  
    - **Limitation:** Cannot resolve if group self-identification is split (e.g., some victims ID as hybrid, others as unified).

  ---

  #### **STEP 2: INTENT TO DESTROY**  
  **Question:** *"Is there evidence the perpetrator aimed to annihilate the group *as such* (not incidental harm)? Look for:**  
    - Policy documents/speeches naming the group  
    - Systematic patterns (not isolated acts)  
    - Targeting core pillars of group existence*"*  
  - **Yes** → Proceed to Steps 3A (Physical) & 3B (Cultural) *in parallel*.  
  - **No** → Stop.  
  - **Maybe** → Flag: **"Intent ambiguous"** and escalate.  
    - **JC:** "Economic reform" masking → Check: *"Was harm disproportionately focused on the group? Were alternatives available?"*  
      - *Test:* Famine case: If food blocked *only* in group's regions despite national surplus → **Yes**.  

  ---

  #### **STEP 3A: PHYSICAL DESTRUCTION (UN/Lemkin Physical)**  
  **Question:** *"Was there any of the following?*  
    a) Killing/injury  
    b) Life conditions calculated to destroy (e.g., starvation, forced labor)  
    c) Biological destruction (forced birth control, child transfer)"*  
  - **Yes** → Tag: **"Physical Genocide (Partial/Total)"** → Go to Step 4.  
  - **No** → Proceed to Step 3B.  

  ---

  #### **STEP 3B: CULTURAL DESTRUCTION (Lemkin Cultural)**  
  **Question:** *"Was there systematic erasure of group identity?*  
    a) Banning language/religion in public life  
    b) Destroying cultural institutions (schools, museums, archives)  
    c) Forcing assimilation (e.g., renaming people/places, banning rituals)"*  
  - **Yes** → Tag: **"Cultural Genocide"** → Go to Step 4.  
  - **No** → Stop.  

  ---

  #### **STEP 4: SEVERITY & DIVERGENCE CHECK**  
  **Physical Branch:**  
    - *Question:* *"Did acts aim for full group elimination (total) or critical segment (partial)?"*  
      - **JC:** "Critical segment" = threatens group survival (e.g., exterminating urban elites).  

  **Cultural Branch:**  
    - *Question:* *"Was cultural erasure systematic (not ad hoc vandalism)?"*  

  **Final Tagging:**  
    - **IF** Physical = Yes + Cultural = No → **"UN Convention Genocide"**  
    - **IF** Cultural = Yes + Physical = No → **"Lemkin Cultural Genocide"**  
    - **IF Both** → Tag both.  
    - **Flag divergence** when UN/Lemkin tags differ → **"Definitional divergence: UN negative, Lemkin positive"**.  
    - **Limitation:** Cannot override survivor communities' conflicting labels → Note: "Source conflict on label."  

  ---

  ### **Case Applications**
  #### **CASE 1: State-Induced Famine ("Economic Reform")**  
  - **Step 1:** *Group?* Yes (ethnic farmers in Region X).  
  - **Step 2:** *Intent?* **Maybe** (state claims "economic reform" but quotas target only Group X farms). → **Escalate:** Reviewer checks if Group X was exempt from aid.  
    - *Reviewer finds:* Aid denied only to Group X despite famine → **Yes (genocidal intent)**.  
  - **Step 3A:** *Physical destruction?* **Yes** (starvation = life conditions). → Tag: **Physical Genocide**.  
  - **Step 3B:** *Cultural destruction?* **No** (no language/ritual bans).  
  - **Result:** **UN Convention Genocide**. No divergence.  

  #### **CASE 2: Religious Schools/Archives Destroyed (Minimal Killing)**  
  - **Step 1:** *Group?* Yes (religious minority).  
  - **Step 2:** *Intent?* **Yes** (state orders: "Eliminate backward curricula").  
  - **Step 3A:** *Physical destruction?* **No** (minimal killing).  
  - **Step 3B:** *Cultural destruction?* **Yes** (schools/archives razed). → Tag: **Cultural Genocide**.  
  - **Divergence Flag:** **"Definitional divergence: UN negative, Lemkin positive"**.  
  - **Result:** Lemkin Cultural Genocide only.  

  ---

  ### **Annotator Cheat Sheet**  
  - **Escalate within 5 min if:**  
    - Group ID or intent is "maybe."  
    - Physical/cultural acts are borderline (e.g., 1 school burned = not systematic).  
    - Survivor accounts label events divergently.  
  - **Never:**  
    - Resolve UN/Lemkin divergence (flag it).  
    - Override source conflicts (document them).  
  - **Key Judgment Calls (JCs):**  
    - Group boundaries under hybrid identity.  
    - Intent inference when masked by policy.  
    - "Systematic" vs. "sporadic" cultural destruction.  

  **Output Format:** Tags + flags (e.g., "Physical Genocide (Partial) | Cultural Genocide | DIVERGENCE: UN- Lemkin+").
