  Here's my take: Your distinction between "binding conflicts" (genuine dilemmas with conflicting *duties*) and "bad-option traps" (merely awful choices without conflicting obligations) is insightful. In a true binding conflict, choosing the lesser harm fulfills one duty while unavoidably *violating* another valid competing duty; the guilt arises from this real, unfulfilled obligation ("moral residue"), proving it's more than emotional noise—it's the recognition of a genuine moral cost paid. Genuine moral dilemmas *do* require this actual contradiction in obligations, while lingering distress in a bad-option trap might be emotional fallout without the same philosophical weight. I'm fairly sure (80%) that guilt in binding conflicts signifies a real unfulfilled duty. I'm least sure whether *all* resulting guilt is philosophically meaningful—sometimes it might be disproportionate or rooted in psychology rather than the duty itself.

