prompt: |-
  ok so me and my friend had this long argument last night about hard choices -- not just tough decisions but the kind where values are genuinely incommensurable, like artistic integrity vs not harming people, and picking one doesn't mean you value it more, it means the other gets actively destroyed rather than traded away. i want to run an activity for my philosophy seminar (10 grad students, 90 mins) that makes them feel that force, not just discuss it. my idea is a game called broken scale: they act as a collective deciding whether to expose plagiarism in a beloved community artist's work, knowing it'll save others from bad art but destroy the artist and community trust. they vote using three card colors -- red for care, blue for autonomy, green for truth -- but the rule is you can only play one color, then you have to literally tear the other two cards in half and drop them in a box in front of everyone. no exchange rates, no balancing act. after voting they must justify the decision using only the vocabulary of the color they kept. payoff is just social status in the room plus the physical pile of torn cards left on the table. can you design the full rules, materials, timeline, and debrief? the debrief should map the tearing moment and the vocabulary lock onto the philosophical idea of incommensurability, say what will definatly go wrong the first run (i think people will try to hoard cards or treat it like a strategy game), and be honest about which feature the activity can't reproduce -- probably the long-term existential weight, or the fact that real loss isn't as clean as tearing paper? also please don't include any reading list or citations; i want them to hit it raw. write it so it runs with zero web access needed.
