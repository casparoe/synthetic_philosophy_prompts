answer: |-
  Here’s the complete, zero-resource design for **Broken Scale** – optimized for 90 minutes, visceral impact, and philosophical confrontation with incommensurability.

  ---

  ### **BROKEN SCALE: RULES & MATERIALS**  
  *"When you choose one value, you annihilate the others."*

  **Materials (Per Student):**  
  - 3 Cards (5x7" cardstock): **Red (CARE)**, **Blue (AUTONOMY)**, **Green (TRUTH)**  
  - 1 Small Ritual Box (with a slot) placed centrally  
  - Timer  
  - Whiteboard + Marker  

  ---

  ### **TIMELINE (90 MINS TOTAL)**  
  **0-10m: SETUP**  
  - Distribute card sets.  
  - Draw on board:  
    > **RED = CARE:** Prevent harm, nurture community, protect vulnerability.  
    > **BLUE = AUTONOMY:** Uphold agency, non-interference, self-determination.  
    > **GREEN = TRUTH:** Demand honesty, expose deception, prioritize facts.  

  **10-25m: SCENARIO BRIEFING**  
  *Read aloud slowly:*  
  > *"River, a beloved artist in your tight-knit creative community, is about to receive a major award for their groundbreaking 'Memory Fragments' series. Last night, you discovered irrefutable proof that River plagiarized the core concepts from an obscure, deceased artist. Exposing this will:  
  > - **Save** future artists from inferior plagiarized work & restore artistic integrity (TRUTH),  
  > - **Destroy** River’s career/mental health & fracture community trust (CARE),  
  > - **Override** River’s right to control their narrative (AUTONOMY).  
  > Your collective must decide NOW: EXPOSE or CONCEAL?"*  

  **25-35m: SILENT CHOICE**  
  - *"Do NOT discuss. Stare at your three cards. Choose ONE color to KEEP. You have 90 seconds."*  
  - *"When time ends, you MUST immediately TEAR your two unchosen cards in half—cleanly, visibly—and drop the pieces into the Ritual Box. No hesitation."*  

  **35-60m: JUSTIFICATION & VOTE**  
  - *"One by one, step forward. State ONLY: ‘I vote to [EXPOSE/CONCEAL]’. Then justify your vote using ONLY THE VOCABULARY of your kept card. No other values exist anymore."*  
    - *Red Example:* "I conceal to protect River from collapse. This community’s survival demands compassion."  
    - *Green Example:* "I expose to obliterate falsehood. Authenticity cannot coexist with theft."  
    - *Blue Example:* "I conceal to honor River’s self-sovereignty. No outsider owns their narrative."  
  - Tally votes on board after all speak.  

  **60-85m: DEBRIEF (Key Questions)**  
  *(Start by emptying the Ritual Box, spilling torn cards onto the table.)*  

  1. **THE TEARING:**  
     - *"What did it feel like to physically destroy two values? Did tearing them *mean* something that ‘setting aside’ wouldn’t?"*  
     - **Philosophical Link:** *"This is incommensurability: not weighing options, but ERASING them. You didn’t ‘trade’ care for truth—you annihilated care’s claim entirely. The scraps are what’s left of the worlds you refused."*  

  2. **VOCABULARY LOCK:**  
     - *"When you could ONLY speak ‘care’, could you still *feel* the ghost of ‘truth’? Did the language cage clarify or distort your choice?"*  
     - **Philosophical Link:** *"Real hard choices force us into moral monolingualism. Justifying a choice in one value-system often requires silencing others—not because they’re weaker, but because they’re *untanslatable*."*  

  3. **WHAT BROKE:**  
     - *"Did anyone try to ‘game’ it? Hoard cards? Flinch while tearing? Why?"*  
     - **Predictable Failures:**  
       - *Hesitation:* Humans instinctively resist destroying options.  
       - *Strategic Voting:* Someone likely picked a color to "balance" the group or "win" status—betraying the exercise.  
       - *Vocabulary Cheating:* Sneaking in "truth" while holding "care" cards.  
     - *"This proves how deeply we crave commensurability—even when the rules forbid it."*  

  4. **THE UNREALITY:**  
     - *"What can’t this ritual capture?"*  
     - **Honest Limits:**  
       - *Clean Loss:* Tearing paper is cathartic. Real loss festers. You don’t "drop it in a box."  
       - *Existential Weight:* You knew this ended in 90 mins. River’s ruin lasts decades.  
       - *Ambiguity:* Real choices aren’t color-coded. Values bleed.  

  **85-90m: CLOSING**  
  *"Leave the torn cards on the table. Walk past them on your way out. That pile is the cost of every ‘hard choice’ ever made—visible, ugly, and unresolved."*  

  ---

  ### **WHY THIS WORKS**  
  - **Tearing as Violence:** Makes abstract loss tactile and irreversible.  
  - **Vocabulary Lock:** Simulates how moral frameworks exclude rivals.  
  - **Pile of Scraps:** A visible monument to cumulative sacrifice.  
  - **No "Win State":** Only social pressure + physical remnants. Forces authenticity.  

  **First Run Warnings:**  
  - Students will sweat during silent choice.  
  - Someone will vote "expose" with *red* and say "We must protect the community *from* River." Call this out in debrief as vocabulary cheating ("protect" is care-language justifying truth-acts).  
  - The pile of torn cards will shock them. **Use that.**  

  This ritual won’t solve incommensurability—it makes you *bleed* it. Run it raw.
