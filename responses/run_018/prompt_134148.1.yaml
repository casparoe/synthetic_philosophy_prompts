       - **I.A.D.E** requires both interferers to destroy fragility but lets blockage *persist*, contradicting actualism.  
       - **III.A.C.F** functionalism prohibits vanishing under blockage.  
       - **II.A.C.E** claims only *one* interferer destroys fragility but lets *blockage* persist arbitrarily.  

