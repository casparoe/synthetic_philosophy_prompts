  ### Taxonomy of Dispositional Views: A Nested Decision Tree

  **Root Split: Combined Fink and Mask Case**  
  *A fragile glass vase is wrapped in shock-absorbing foam (masking any impact) and fitted with an internal self-repair mechanism that instantly heals any crack (finking fragility). Is the vase still fragile?*  
  - **Branch I**: The vase is **not fragile** because *both* conditions destroy the disposition.  
  - **Branch II**: The vase is **not fragile**, but this is because *only one* condition destroys the disposition (either the mask or the fink, but not both).  
  - **Branch III**: The vase is **still fragile** (neither condition destroys the disposition, or the mask/fink distinction is denied).  

  **Second-Level Split: Mimic Case**  
  *A holographic projection behaves identically to a breaking vase upon impact but lacks physical substrate. Is the hologram fragile?*  
  - **Branch I.A**: The hologram is **not fragile** (dispositions require an underlying categorical base).  
  - **Branch II.A**: The hologram is **not fragile** (as above; see Branch I.A).  
  - **Branch III.A**: The hologram is **fragile** (behavioral counterfactuals or functional profiles suffice for ascribing dispositions).  
  - **Branch III.B**: The hologram is **not fragile** (dispositions require a categorical base, even if the vase’s fragility persists in Branch III).  

  **Third-Level Split: Double-Fink Antidote Case**  
  *A poison is lethal iff ingested without an antidote. An antidote-release mechanism detects the poison and administers the antidote. Is the poison lethal in this environment?*  
  - **Branch I.A.C**: The poison is **lethal** (dispositions depend on nearby worlds without interferers).  
  - **Branch I.A.D**: The poison is **not lethal** (dispositions depend on actual-world conditions).  
  - **Branch II.A.C**: The poison is **lethal** (as Branch I.A.C).  
  - **Branch II.A.D**: The poison is **not lethal** (as Branch I.A.D).  
  - **Branch III.A.C**: The poison is **lethal** (as Branch I.A.C).  
  - **Branch III.A.D**: The poison is **not lethal** (as Branch I.A.D).  
  - **Branch III.B.C**: The poison is **lethal** (as Branch I.A.C).  
  - **Branch III.B.D**: The poison is **not lethal** (as Branch I.A.D).  

  **Fourth-Level Split: Permanent Universal Blockage Case**  
  *Every manifestation of a disposition (e.g., solubility) is permanently and universally blocked (masked or finked), with no possible manifestation. What happens to the disposition?*  
  - **Branch I.A.C.E**: The disposition **persists** as a unified power.  
  - **Branch I.A.C.F**: The disposition **vanishes**.  
  - **Branch I.A.D.E**: The disposition **persists** (unstable: conflicts with actualism).  
  - **Branch I.A.D.F**: The disposition **vanishes**.  
  - **Branch II.A.C.E**: The disposition **persists** (unstable: Branch II requires only one interferer to destroy the vase’s fragility, yet here it persists).  
  - **Branch II.A.C.F**: The disposition **vanishes**.  
  - **Branch II.A.D.E**: The disposition **persists** (unstable: as Branch II.A.C.E).  
  - **Branch II.A.D.F**: The disposition **vanishes**.  
  - **Branch III.A.C.E**: The disposition **persists** as a functional role.  
  - **Branch III.A.C.F**: The disposition **vanishes** (incoherent: functionalism requires persistence).  
  - **Branch III.A.D.E**: The disposition **persists** (incoherent: functionalism requires counterfactual-based analysis).  
  - **Branch III.A.D.F**: The disposition **vanishes** (incoherent: as above).  
  - **Branch III.B.C.E**: The disposition **persists** as a categorical power.  
  - **Branch III.B.C.F**: The disposition **vanishes** (incoherent: realism requires persistence).  
  - **Branch III.B.D.E**: The disposition **persists** (unstable: conflicts with actualism).  
  - **Branch III.B.D.F**: The disposition **vanishes**.  

  ---

  ### Leaf Positions and Diagnoses  
  1. **Branch I.A.C.E**:  
     - **Position**: Unnamed.  
     - **Diagnosis**: Coherent but undefended. Combines (1) both interferers destroy dispositions, (2) categorical bases are required, (3) counterfactual-based analysis, and (4) persistence under blockage. Rare; few tie blockage-vanishing to interferer-destruction inconsistently.  

  2. **Branch I.A.C.F**:  
     - **Position**: **Sophisticated Conditional Analysis** (e.g., Choi, Lewis).  
     - **Diagnosis**: Stable. Dispositions are defined by *stimulus-manifestation* conditionals in *close worlds*; interferers falsify conditionals, and universal blockage implies no close worlds manifest.  

  3. **Branch I.A.D.F**:  
     - **Position**: **Simple Conditional Analysis** (early positivism).  
     - **Diagnosis**: Unstable. Requires actual-world conditions for dispositions (hence not lethal), but cannot explain why *both* interferers destroy fragility while antidotes don’t destroy lethality. Vulnerable to finks/masks.  

  4. **Branch II.A.D.F**:  
     - **Position**: **Mixed Actualist View** (unnamed).  
     - **Diagnosis**: Coherent but rare. Holds that only *one* interferer (mask or fink) destroys dispositions, with categorical bases and actual-world dependence. Stable if consistently specifying which interferer matters.  

  5. **Branch III.A.C.E**:  
     - **Position**: **Functionalism** (e.g., Prior-Pargetter-Jackson).  
     - **Diagnosis**: Stable. Dispositions are functional roles defined by *counterfactual behaviors*; blockage is irrelevant to existence.  

  6. **Branch III.B.C.E**:  
     - **Position**: **Dispositional Realism** (e.g., Martin, Heil).  
     - **Diagnosis**: Stable. Dispositions are irreducible causal powers grounded in categorical bases; interferers prevent manifestation but don’t destroy the power.  

  7. **Branch III.B.D.F**:  
     - **Position**: **Semi-Eliminativism** (unnamed).  
     - **Diagnosis**: Coherent but undefended. Accepts categorical bases but ties dispositions to actual-manifestation conditions; thus, universal blockage implies no disposition.  

  8. **Branch I.A.D.E**, **II.A.C.E**, **II.A.D.E**, **III.A.C.F**, **III.A.D.E**, **III.A.D.F**, **III.B.C.F**, **III.B.D.E**:  
     - **Position**: Unnamed.  
