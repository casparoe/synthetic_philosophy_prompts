  ### Convergence and Instability Notes  
  - **Branches I.A** and **II.A** converge on the mimic case (both require categorical bases), but diverge on why the vase isn’t fragile (both vs. one interferer). This is **rhetorical convergence**: they agree on judgments but describe them differently.  
  - **Branch II** is **unstable** if users cannot consistently specify whether masks or finks destroy dispositions. For example, claiming a fink destroys fragility but an identical mask does not is arbitrary.  
  - **Functionalism (III.A.C.E)** and **realism (III.B.C.E)** converge on the antidote case (both say the poison is lethal) and blockage (both say persistence). This is **practical convergence**: they agree on judgments *and* descriptions for these cases.  
  - The tree cannot distinguish **Simple Conditional Analysis (I.A.D.F)** from **Mixed Actualist View (II.A.D.F)** using the antidote/blockage cases alone (both say "not lethal" and "vanishes"). Further cases (e.g., asymmetric interferers) would be needed.
