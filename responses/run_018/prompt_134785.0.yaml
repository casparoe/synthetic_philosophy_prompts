answer: |-
  Here's a logical decision tree for mapping gradated moral status positions, designed for intuitive navigation via concrete scenarios. Key features:  
  - **Root:** Fundamental structure of moral status  
  - **Branches:** Grounding property + specific mechanism  
  - **Leaves:** 8 distinct terminal positions (plus 2 collapse notes)  
  - **Scenarios:** Phrased as practical tests  
  - **Flags:** Incoherent paths (⚠️), collapsing positions (⚖️), and indistinguishables (~)  

  ---

  ### ROOT: **Can moral status be partially lost/gained without total loss?**  
  *(e.g., If you slowly replace a human's neurons with functionally identical silicon chips, does moral status...)*  
  1. **Decrease continuously** → Go to **CONTINUUM**  
  2. **Stay intact until a critical threshold, then drop abruptly** → Go to **THRESHOLD-BINARY**  
  3. **Change in discrete jumps between distinct categories** → Go to **TIERED**  

  ---

  ### CONTINUUM: **What property's intensity grounds moral weight?**  
  *(e.g., A bee vs. coma patient with identical neural activity: which has higher status?)*  
  1. **Raw subjective experience (phenomenal consciousness)** → *Test: If an AI reports identical qualia to a human, does it deserve equal weight?*  
     - **A. Yes, proportional to qualia complexity** → **LEAF: Phenomenal Gradient** (Singer-esque suffering-capacity)  
     - **B. Only if qualia are biologically instantiated** → **LEAF: Bio-Exclusive Gradient**  
  2. **Functional complexity (goal-pursuit, learning, etc.)** → *Test: Is a highly adaptive AI with no consciousness morally considerable?*  
     - **A. Yes, weight proportional to cognitive integration** → **LEAF: Functional Autonomy Gradient**  
     - **B. Only if functions include emotional processing** → **LEAF: Affective Cognition Threshold**  
  3. **Relational impact on moral agents** → *Test: Does a dog in a loving home have higher status than an identical stray?*  
     - **A. Status fixed, but obligations differ** → *←COLLAPSE→* **⚖️** (Not gradated status; see *Contextual Activation* below)  
     - **B. Status itself amplifies with social entanglement** → **LEAF: Relational Embeddedness Gradient**  

  ---

  ### THRESHOLD-BINARY: **What defines the threshold?**  
  *(⚠️ Incoherent if combined with grounding properties that are inherently scalar)*  
  *(e.g., Is there *any* being below human-level sentience that deserves nonzero direct moral weight?)*  
  1. **No, only phenomenal humans/similar minds matter** → **LEAF: Anthropocentric Binary** ("thermostats have zero")  
  2. **Yes, but only above a strict neurological benchmark** → **LEAF: Neuro-Correlation Threshold** (e.g., requires mammalian cortex)  

  ---

  ### TIERED: **Are tiers separated by...**  
  *(e.g., Would a genetically enhanced chimp with human-level cognition belong in a new tier?)*  
  1. **Degree gaps in a single scale** → *~Indistinguishable from high-threshold CONTINUUM~*  
  2. **Incommensurable differences in moral kind** → *Test: Is saving 1,000 ants morally preferable to saving one dog?*  
     - **A. No, ants/dogs occupy distinct tiers** → **LEAF: Incommensurable Kinds** (e.g., Regan-style animal rights)  
     - **B. Yes, if aggregate suffering outweighs** → **LEAF: Tiered Aggregativism**  

  ---

  ### SPECIAL CASES (Branch from root or grounding properties)  
  - **Contextual Activation**: *Test: Does a sleeping human have equal status to an awake one? What about a mosquito in an empty room?*  
    - Status persists for sleepers, vanishes for unattended insects → **LEAF: Agent-Dependent Emergence**  
  - **Cumulative Micro-Status**: *Test: Is destroying an ant colony worse than killing one bird?*  
    - Colony > bird, but individual ant ≈ 0 → **LEAF: Aggregate Moral Patienthood** (e.g., ecosystems as patients)  

  ---

  ### CRITICAL NOTES  
  - **Incoherences**:  
    - ⚠️ **THRESHOLD-BINARY + Relational Grounding** → Status can't be both binary *and* relationally scaled.  
    - ⚠️ **TIERED + Continuous Grounding Property** → Tiers imply discontinuities; continuous properties demand gradients.  
  - **Collapses**:  
    - ⚖️ **High-threshold CONTINUUM ≈ TIERED with narrow gaps** → Identical practical implications.  
  - **Indistinguishables**:  
    - ~**Bio-Exclusive Gradient** vs. **Neuro-Correlation Threshold**~ → May coincide if biological = neural threshold.  

  ---

  ### TREE SUMMARY (8 Terminal Leaves)  
  1. **Phenomenal Gradient**  
  2. **Bio-Exclusive Gradient**  
  3. **Functional Autonomy Gradient**  
  4. **Affective Cognition Threshold**  
  5. **Relational Embeddedness Gradient**  
  6. **Anthropocentric Binary**  
  7. **Incommensurable Kinds**  
  8. **Tiered Aggregativism**  
  *+ 2 Special Cases:*  
  9. **Agent-Dependent Emergence**  
  10. **Aggregate Moral Patienthood**  

  This forces distinctions between positions that *sound* similar (e.g., gradients vs. high-threshold binaries) while exposing hidden compatibilities. Use scenarios like neuron replacement, AI qualia reports, or ant-colony destruction to anchor debates without jargon.
