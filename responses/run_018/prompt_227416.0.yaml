prompt: |-
  Write an internal company memo, around 600 words, from the HR team at a mid-sized tech firm. The firm's lunchtime Stoicism club has been such a hit with leadership that this year's redundancy round is to be run entirely on Stoic principles. Departing staff are to be reminded that their jobs are externals and therefore indifferents; each exit interview will open with a sorting exercise in which the employee seperates their concerns into what is up to them and what is not; the severance package is to be described as a preferred indifferent that a sage wouldn't make a fuss about. Include the usual memo furniture: subject line, three or four action items, a short FAQ, an upbeat sign-off.

  The comedy has to come from the Stoicism being right on the page -- prohairesis, the dichotomy of control, the archer analogy where doing your best is yours and hitting the target isn't -- while the use it's being put to is grotesque. The memo writer must never notice that Stoic ethics also has quite a lot to say about justice, our roles towards others, and what the people sending the memo owe their colleagues; the reader should have noticed by about paragraph three. Deadpan the whole way, no winking, and any Stoic slogans should be paraphrased rather than given as verbatim quotes. The target is the corporate self-help repurposing of Stoicism, not the philosophy itself and not any actual person.
reasoning: |-
  Okay, the user wants a satirical company memo where Stoic principles are misapplied during redundancies. Hmm, they're clearly targeting corporate misuse of philosophy - the dark humor lies in HR using "dichotomy of control" to justify layoffs while ignoring Stoicism's emphasis on justice and community. 

  First, I need to nail the tone: deadpan corporate-speak masking ethical bankruptcy. No overt jokes - the comedy should emerge from the chilling disconnect between Marcus Aurelius quotes and severance paperwork. Key elements: the sorting exercise during exit interviews (grotesque), calling severance a "preferred indifferent" (absurd corporate doublespeak), and total omission of leadership's Stoic duties to employees.

  User's deeper request seems to be mocking how companies weaponize self-help philosophies. They specified avoiding mockery of actual Stoicism or people - good, this should skewer the appropriation, not the source material. The FAQ section is crucial for layered satire: surface-level HR helpfulness undercut by unexamined cruelty ("How does this align with our values?" "Perfectly!").

  Must include all memo conventions but pervert them: subject line with forced positivity ("Enhancing Resilience"), action items that mechanize suffering. Sign-off needs that corporate faux-inspirational tone ("Steadfastly forward!") that feels dystopian here. 

  Biggest challenge: balancing readability with philosophical accuracy. The archer analogy must appear correctly (effort vs outcome) while being twisted into "your firing is an external". Prohairesis gets a euphemistic rename ("inner citadel") to sound more corporate. Never let the writer realize they're violating the very philosophy they quote - that cognitive dissonance is the punchline.

  User clearly knows Stoicism well (cited prohairesis/dichotomy correctly) so the satire must hold up to scrutiny. The "justice" gap should scream at readers by paragraph three when exit interviews are framed as "learning opportunities". Final touch: HR's contact info offering "clarity" - the ultimate bureaucratic irony.
answer: |-
  **MEMORANDUM**  

  **TO:** All Staff  
  **FROM:** Human Resources Department  
  **SUBJECT:** Enhancing Resilience: Applying Stoic Principles to Our Upcoming Organizational Restructuring  
  **DATE:** October 26, 2023  

  **Purpose:**  
  As part of our ongoing commitment to fostering resilience and wisdom (values underscored by the popularity of our Lunchtime Stoicism Club), this year’s workforce restructuring will integrate core Stoic principles. By approaching redundancies with philosophical clarity, we aim to support both departing and remaining colleagues in maintaining emotional equilibrium. Remember: while events may challenge us, our reasoned choices remain within our control.  

  ### Key Principles Guiding This Process:  
  1. **The Dichotomy of Control:** Staff will be guided to recognize that their role, position, or continued employment is an "external" — neither good nor bad in itself, and thus a matter of indifference. True excellence lies solely in our judgments and actions.  
  2. **The Sorting Exercise:** Exit interviews will begin with a practical reflection activity. Employees will categorize their concerns into two columns: "Within My Control" (e.g., attitude, future actions) and "Outside My Control" (e.g., organizational decisions, market forces). HR will provide worksheets.  
  3. **Preferred Indifferents:** Severance packages, while offering practical advantages, will be presented as "preferred indifferents." A truly wise person recognizes that such things, while useful, do not determine inner worth or virtue.  

  ### Action Items:  
  1. **Managers:** Attend the mandatory briefing, *"Stoic Leadership: Navigating Change with Virtue,"* on November 3rd (Calendly invite to follow). You will learn how to frame restructuring discussions using the Archer Analogy: *focusing solely on the effort you put into the process (your virtue) rather than the outcome (the arrow hitting the target)*.  
  2. **Departing Staff:** Attend your scheduled exit interview prepared for the Sorting Exercise. Bring questions, but note that only concerns related to *personal agency* (Column 1) will be actionable.  
  3. **Remaining Staff:** Utilize daily lunchtime Stoicism sessions to reinforce focus on your sphere of control. Remember: your colleagues’ departures are externals.  
  4. **All Staff:** Review the attached *"Stoic Resilience Handbook: Restructuring Edition"* (Section 3: "Your Inner Citadel is Your True Security").  

  ### FAQ:  
  **Q: How can this approach help departing employees?**  
  A: By distinguishing between what is "up to them" (their character, future choices) and what is not (their role ending), we empower individuals to direct energy toward their true sphere of influence. This is genuine empowerment.  

  **Q: Is it appropriate to use philosophy during something as difficult as redundancy?**  
  A: Stoicism teaches us that difficulty is a chance to exercise virtue. Framing this transition through timeless principles transforms it into a profound learning opportunity.  

  **Q: Does this mean the company bears no responsibility for the impact of redundancies?**  
  A: Our responsibility lies in acting with virtue (wisdom, justice, courage, moderation). Providing clarity, respectful processes, and a severance package aligns with this duty. Outcomes (e.g., individual hardship) are externals.  

  **Q: How does this align with our company values?**  
  A: Perfectly. "Resilience" and "Wisdom" are pillars of our culture. Embracing indifferents while focusing on inner excellence epitomizes these values.  

  **Closing:**  
  Change, while unsettling, is an opportunity to practice the principles we discuss. To departing colleagues: remember that your worth was never defined by your role. To remaining colleagues: fortify your inner citadel. This restructuring, while an external indifferent, is a shared exercise in aligning our judgments with nature.  

  We move forward with courage and reason.  

  Steadfastly,  
  **The HR Team**  
  *"It’s not events that disturb us, but our judgments about them."*  
  — *Paraphrased from Epictetus, Enchiridion 5*  

  ---  
  **For Stoic guidance queries:** hr.stoicism@techfirm.io | **Handbook Access:** HR Portal > Resilience Resources
