prompt: |-
  I run an upper-level undergraduate seminar in moral philosophy—about 14 students, one 75-minute session. The announced topic is moral particularism versus generalism, but I want the session to target a specific, somewhat neglected pressure point within that debate: reason holism, or the claim that the very same non-moral feature can operate as a reason with opposite moral valence across contexts without being governed by any further general principle.

  Design a structured in-class deliberation—preferably with assigned roles and forced choices rather than open discussion—so that participants discover this holism for themselves before it is named. The rules should be arranged so that students apply identical descriptive predicates to two structurally parallel cases and reach opposite moral verdicts, then face a mechanism that makes them feel the cost of either retaining both verdicts or collapsing them into a hidden generalization.

  Specify: the physical setup and materials; the roles or constraints (for example, some participants must defend verdicts using only descriptive, non-moral vocabulary, while others must propose the relevant difference that saves consistency); a phased timeline; and an incentive scheme that rewards coherence but penalizes ad hoc exceptions—using points, voting tokens, or staged public commitments rather than real money.

  Then provide a debrief that maps specific moments in the activity onto parts of the particularist/generalist debate: where students implicitly appealed to ceteris paribus conditions, where they invented unstated background conditions to save a rule, and where they simply refused to generalize. Include an honest account of what will go wrong the first time—especially the tendency to smuggle in covert general principles—and how to handle it without undermining the exercise.

  Finally, be explicit about which feature of particularist reason holism the activity cannot reproduce—whether the phenomenology of direct moral perception, the metaphysical claim about the non-codifiability of reasons, or the rejection of moral explanation altogether—and note that this gap must be filled by the facilitator's follow-up discussion.
reasoning: |-
  We are designing an in-class deliberation activity for an upper-level undergraduate seminar on moral philosophy. The goal is to have students discover "reason holism" through a structured exercise with two cases that are structurally parallel but lead to opposite moral verdicts. The activity should involve assigned roles and forced choices, and it should make students feel the cost of either retaining both verdicts (thus accepting holism) or collapsing them into a hidden generalization (which might seem ad hoc). 

  ### Physical Setup and Materials
  - **Room Setup**: Arrange chairs in a circle or around a table to facilitate discussion. 
  - **Materials**:
    1. **Case Handouts**: Two short case descriptions (Case A and Case B) that are parallel in structure but differ in context. We need to use identical descriptive features (predicates) in both cases. 
    2. **Role Cards**: For assigning roles to students. 
    3. **Voting Tokens**: Two colors (e.g., green for "permissible", red for "impermissible"). 
    4. **Whiteboard or Flip Chart**: To record arguments, proposed principles, and votes.
    5. **Timer**: For managing phases.

  ### Case Design
  We need two cases that share a non-moral feature that can be a reason for opposite moral verdicts. Let's choose a feature: **breaking a promise to meet someone**. 

  - **Case A (Breaking a promise for a minor reason)**:
    > Alex promises to meet Bailey for coffee at 3pm. On the way, Alex sees a street performer whose show is about to start and decides to stop and watch, knowing that this will make Alex 15 minutes late. Alex texts Bailey: "Running a bit late, but I'll be there!" Bailey is mildly annoyed but not seriously inconvenienced.

  - **Case B (Breaking a promise for a significant reason)**:
    > Casey promises to meet Dakota for coffee at 3pm. On the way, Casey witnesses a car accident. Casey stops to help the injured person, calling 911 and staying until the ambulance arrives. This makes Casey 45 minutes late. Casey texts Dakota: "Emergency, will be late!" Dakota is worried but understanding when they learn the reason.

  The non-moral feature in both cases is: **breaking a promise to meet someone**. In Case A, it seems blameworthy; in Case B, it seems praiseworthy or at least excusable.

  ### Roles
  Assign roles to students (by random draw or assignment):

  1. **Descriptive Advocates (2 per case, total 4)**: Must argue for the moral verdict (permissible or impermissible) using only descriptive, non-moral vocabulary. They cannot use moral terms (like "right", "wrong", "duty"). They must point to features of the situation.
  2. **Principle Proposers (4)**: After the initial verdicts, their job is to propose a general principle that can consistently explain both cases. They must avoid ad hoc exceptions.
  3. **Consistency Enforcers (4)**: They challenge any proposed principle by pointing out inconsistencies or demanding that the principle cover both cases without arbitrary distinctions.
  4. **The Skeptic (1)**: Role is to push for holism by pointing out that the same feature (promise-breaking) is playing opposite roles and that no satisfying general principle is emerging.
  5. **The Rest (1 or 2)**: Can be assigned as voters or as a jury that must reach a verdict.

  Alternatively, if 14 students, we can have:
  - 4 Descriptive Advocates (2 for Case A, 2 for Case B)
  - 4 Principle Proposers
  - 4 Consistency Enforcers
  - 1 Skeptic
  - 1 Facilitator (could be the instructor, but if a student is assigned, the instructor should supervise)

  But note: the instructor might be the overall facilitator. Alternatively, we can have 14 students as:
  - 2 groups of 7: each group deals with one case? But we want them to see both cases together. So better to have the whole class together.

  Revised role assignment for 14:
  - 2 Advocates for Case A (arguing that Alex's action is impermissible, using only descriptive terms)
  - 2 Advocates for Case A (arguing that Alex's action is permissible? But we want the class to see opposite verdicts. So we assign the verdicts? Actually, we can let the class vote on the verdicts first and then assign roles to defend the verdicts.)

  Alternatively, structure:

  ### Phased Timeline (75 minutes total)

  **Phase 1: Case Presentation and Initial Verdicts (15 minutes)**
  - Present Case A and Case B (handed out or projected). Read aloud.
  - Without discussion, each student votes privately on each case using tokens (green: permissible; red: impermissible). Collect votes and display counts. We expect: Case A mostly impermissible, Case B mostly permissible.

  **Phase 2: Descriptive Advocacy (20 minutes)**
  - Assign roles: 
    - 2 students are Advocates for the verdict on Case A (they must defend the majority verdict for Case A using only descriptive language).
    - 2 students are Advocates for the verdict on Case B (same, for Case B).
    - The rest are the "Council" (10 students) who will question the advocates and then vote again.
  - Each pair of advocates has 5 minutes to present their case (using only descriptive terms). Then the council can ask questions for 5 minutes per case.

  **Phase 3: The Challenge of Consistency (20 minutes)**
  - Now reveal the tension: both cases involve the same descriptive feature (breaking a promise) but with opposite verdicts.
  - Assign new roles (or use existing council members as Principle Proposers and Consistency Enforcers):
    - 4 Principle Proposers: They must propose a general principle that explains both verdicts. Example: "Breaking a promise is impermissible unless there is an emergency." 
    - 4 Consistency Enforcers: They challenge the principle by either (a) showing it doesn't cover both cases, or (b) pointing out that the principle is ad hoc (why is "emergency" the only exception?).
    - The Skeptic (1) and the rest (if any) can also participate.
  - The goal is to see if a principle can be found that is not ad hoc.

  **Phase 4: Forced Choice and Final Vote (15 minutes)**
  - The Council (all students not in the other roles) must now choose one of two options (forced choice):
    Option 1: Retain both verdicts (thus accepting that breaking a promise can be a reason for impermissible in one context and permissible in another without a general rule).
    Option 2: Reject one of the verdicts to preserve a consistent rule (e.g., either both are permissible or both impermissible).
  - Principle Proposers and Advocates can make final pitches (2 minutes each side). Then the Council votes by show of hands.

  **Phase 5: Debrief (10 minutes)**
  - Instructor-led discussion to connect to the debate.

  ### Incentive Scheme
  - **Coherence Reward**: If the Council in Phase 4 chooses Option 2 (consistent rule) and the rule they settle on is not challenged as ad hoc by the Consistency Enforcers (and the instructor), then they get 2 points (imaginary). But if the rule is deemed ad hoc, they lose 1 point. 
  - **Holism Reward**: If they choose Option 1 (retain both verdicts) and the Skeptic can successfully argue that no non-ad-hoc rule is available, then the Council gets 2 points. If they choose Option 1 but the Principle Proposers show a non-ad-hoc rule was possible, they lose 1 point.
  - **Individual Rewards**: Advocates get 1 point if their descriptive argument is deemed effective by the Council (by vote). Principle Proposers get 1 point if their principle is accepted by the Council and not deemed ad hoc.

  Points can be tracked on the board and can be used for bragging rights or a small prize (e.g., candy).

  ### Debrief: Mapping to the Debate
  1. **Initial Voting (Phase 1)**: Students are relying on direct moral perception. This maps to particularism's emphasis on context-sensitive moral judgment.
  2. **Descriptive Advocacy (Phase 2)**: Students are forced to use non-moral language. This reveals that they are implicitly relying on background conditions (e.g., in Case B, the emergency). This is where they are inventing unstated conditions to explain the verdict.
  3. **Challenge of Consistency (Phase 3)**: When Principle Proposers suggest a rule (e.g., "unless there's an emergency"), Consistency Enforcers might point out that not every emergency justifies breaking a promise (e.g., what if it's a very minor emergency and the promise is very important?) or that the rule is circular (if "emergency" is defined in moral terms). This illustrates the ceteris paribus conditions that generalists use and the particularist critique that these conditions are endless and context-dependent.
  4. **Forced Choice (Phase 4)**: Choosing Option 1 is accepting holism. Choosing Option 2 might involve either (a) collapsing the verdicts (saying both are permissible or both impermissible) which feels counterintuitive, or (b) creating an exception that seems ad hoc (e.g., "unless it's for a good reason" which is circular). This forces students to feel the cost of each approach.

  ### What Will Go Wrong
  - **Smuggling General Principles**: In Phase 2, advocates might use normative language. The instructor must enforce the rule: "Only descriptive terms: what happened, not what should have happened." 
    - *Handling*: Intervene to rephrase. Example: If a student says "Alex did wrong by breaking the promise", ask: "Can you say that without using the word 'wrong'? What descriptive fact makes it wrong?"
  - **Ad Hoc Rules**: In Phase 3, Principle Proposers might propose rules that are too vague or clearly tailored to the two cases. 
    - *Handling*: The Consistency Enforcers (and instructor) should push: "What counts as an emergency? Would it work in all cases? What about a case with a non-emergency but very good reason?"
  - **Time Pressure**: The activity is time-bound. 
    - *Handling*: Keep strict time limits. If a phase is running over, cut off and move on.

  ### What the Activity Cannot Reproduce
  - **Phenomenology of Direct Moral Perception**: The activity uses cases and reasoning, but it doesn't capture the immediate, non-inferential way we often experience moral demands in real life. 
  - **Metaphysical Claim about Non-Codifiability**: The activity shows the practical difficulty of codification, but it doesn't prove that codification is impossible in principle. 
  - **Rejection of Moral Explanation**: The activity still operates within the framework of giving reasons and explanations, whereas radical particularism might reject the need for such explanations altogether.

  **Follow-up Discussion**: The instructor must explicitly note these gaps and discuss how particularists argue that moral reasons are inherently context-dependent and that the failure to find a satisfactory rule in the activity is not just a temporary setback but reflects the nature of morality. The generalist might counter that we can always refine principles and that the activity only shows the complexity, not the impossibility, of codification.

  This structure should lead students to experience the core tension and set the stage for a deeper dive into particularism and generalism.
answer: |-
  ### Structured In-Class Deliberation: "The Promise Paradox"  
  **Objective:** Students discover reason holism by applying identical descriptive features (e.g., "breaking a promise") to two cases, reaching opposite moral verdicts, then confronting the tension between ad hoc exceptions and radical generalization.  

  ---

  #### **Physical Setup & Materials**  
  - **Room Arrangement:** U-shaped table for face-to-face debate.  
  - **Materials:**  
    1. **Case Cards (2 types):**  
       - **Case A (Trivial Delay):** *"Sam promises to meet Taylor at a café at 3 PM. On the way, Sam stops to watch a street performer, making them 15 minutes late. Sam texts, ‘Running late!’ Taylor is mildly annoyed."*  
       - **Case B (Emergency Delay):** *"Jamie promises to meet Morgan at a café at 3 PM. On the way, Jamie stops to help an injured cyclist, making them 45 minutes late. Jamie texts, ‘Emergency, running late!’ Morgan is understanding."*  
    2. **Role Badges:** Advocate (×4), Principle Scout (×4), Holist (×2), Arbiter (×4).  
    3. **Voting Tokens:** Red ("impermissible"), Green ("permissible").  
    4. **Whiteboard:** To track arguments and principles.  
    5. **"Coherence Points" (CP):** Poker chips (1 CP = 1 chip; used for rewards).  

  ---

  #### **Roles & Constraints**  
  | Role | # Students | Constraints | Incentive |  
  |------|------------|-------------|-----------|  
  | **Advocate** | 4 (2 per case) | Argue for a verdict **using only descriptive language** (e.g., "broke a promise," "caused annoyance"). Banned: moral terms ("wrong," "duty"). | +1 CP if Council accepts their verdict; -1 CP if they use moral language. |  
  | **Principle Scout** | 4 | Propose a **general principle** to explain both verdicts. Must avoid "ad hoc" exceptions (e.g., no "unless it’s fun" or "unless it’s an emergency" without defining "emergency"). | +2 CP if principle passes Arbiter vote; -2 CP if deemed "ad hoc." |  
  | **Holist** | 2 | Reject all generalizations. Defend verdicts as "context-dependent." Challenge Principles Scouts to define terms non-circularly. | +1 CP per successful challenge to a principle. |  
  | **Arbiter** | 4 | Vote on verdicts/principles. Must justify votes descriptively. Represent the "Council." | +1 CP if final stance is coherent (per Council vote); -1 CP if inconsistent. |  

  ---

  #### **Phased Timeline (75 mins)**  
  **Phase 1: Case Judgment (15 mins)**  
  - **Setup:** Arbiters read Case A and B silently. Advocates prepare arguments (descriptive only).  
  - **Activity:**  
    - Advocates present for 3 mins/case.  
    - Arbiters vote with tokens (green/red) for each case.  
  - **Outcome:** *Expected result: Case A (red), Case B (green).* Whiteboard records votes.  

  **Phase 2: The Tension (20 mins)**  
  - **Setup:** Instructor highlights the shared feature: "Both broke a promise." Principle Scouts/Holists take roles.  
  - **Activity:**  
    - Principle Scouts propose one general principle (e.g., "Breaking promises is wrong unless X").  
    - Holists challenge: "How do you define X without moral terms?"  
    - Advocates defend original verdicts descriptively.  
  - **Outcome:** Scouts write principles on whiteboard.  

  **Phase 3: Forced Choice (25 mins)**  
  - **Setup:** Arbiters choose:  
    - **Option 1:** Keep both verdicts (accept inconsistency).  
    - **Option 2:** Collapse verdicts (e.g., both impermissible).  
  - **Activity:**  
    - Scouts argue for Option 2 via a principle. Holists argue for Option 1.  
    - Arbiters vote anonymously. Outcome determines CP rewards.  
  - **Outcome:** *Foreseen conflict: Option 1 wins, but at cost of consistency; Option 2 forces counterintuitive generalization.*  

  **Phase 4: Debrief Prep (5 mins)**  
  - Instructor notes key moments on whiteboard for debrief.  

  ---

  #### **Incentive Scheme (Coherence Points)**  
  - **CP Rewards:**  
    - Advocates: Earn CP for descriptive rigor.  
    - Scouts: Earn CP for principles avoiding "ad hoc" labels.  
    - Holists: Earn CP for exposing circularity.  
    - Arbiters: Earn CP for coherent final vote.  
  - **Penalties:**  
    - "Ad hoc" principle: Scouts lose CP.  
    - Moral language: Advocates lose CP.  
    - Inconsistent votes: Arbiters lose CP.  
  - **Payout:** Most CP = "Moral Philosopher of the Day" (trivial prize: e.g., pick discussion topic next week).  

  ---

  ### **Debrief: Mapping to Particularism/Generalism Debate**  
  1. **Initial Verdicts (Phase 1):**  
     - *Particularist Moment:* Students judged cases contextually without explicit rules. Maps to **moral perception**—direct intuition of wrongness in Case A vs. justifiability in Case B.  
     - *Generalist Counter:* The shared feature ("broke promise") created cognitive dissonance, prompting a demand for principles.  

  2. **Descriptive Advocacy (Phase 2):**  
     - *Hidden Generalization:* Advocates likely smuggled in unstated conditions (e.g., "stopped for *selfish* reason" in Case A). Shows how **ceteris paribus clauses** operate implicitly.  
     - *Holist Pressure:* When Holists forced non-moral definitions (e.g., "Define ‘selfish’ without moral baggage"), students saw the **collapse into circularity** (e.g., "selfish means... wrong").  

  3. **Principle Proposals (Phase 2):**  
     - *Ad Hoc Alert:* Scouts proposed principles like "unless there’s greater harm." Holists exposed vagueness ("What counts as ‘greater’?"), mirroring Dancy’s critique of **shapeless moral predicates**.  
     - *Generalism’s Cost:* Option 2 (collapse verdicts) required rejecting intuition (e.g., "Both are wrong"), revealing the **price of codification**—sacrificing nuance for consistency.  

  4. **Final Choice (Phase 3):**  
     - *Reason Holism Revealed:* Most groups choose Option 1 (keep verdicts), implicitly accepting that promise-breaking is a **reason for** wrongness in Case A but **against** wrongness in Case B (it highlights Jamie’s altruism).  

  ---

  ### **What Will Go Wrong (and How to Fix It)**  
  - **Problem 1: Smuggling General Principles**  
    - *Manifestation:* Advocates say, "Sam was *irresponsible*" (moral term disguised as description).  
    - *Fix:* Intervene: "Re-express ‘irresponsible’ using only facts: e.g., ‘Sam chose entertainment over timeliness.’" Enforce CP penalties.  

  - **Problem 2: Ad Hoc Overfitting**  
    - *Manifestation:* Scouts propose "unless it’s fun" for Case A, which fails for other cases (e.g., breaking promises for fun isn’t always wrong).  
    - *Fix:* Holists demand: "Test your principle: Would it work if Sam broke a promise to save a life? What about to nap?" Push Scouts toward *testability*.  

  - **Problem 3: Arbiters Avoid Conflict**  
    - *Manifestation:* Arbiters vote for Option 2 to "be consistent," ignoring intuition.  
    - *Fix:* Ask: "Does your principle match your gut feeling in Case B? If not, what’s the cost?" Use CP to reward courage.  

  ---

  ### **What the Activity Cannot Capture**  
  - **The Gap:** The exercise **cannot reproduce the phenomenology of direct moral perception**—the immediate, non-inferential "seeing" of wrongness (e.g., McNaughton’s "moral vision"). Students reason discursively; they don’t *experience* holism as a lived intuition.  
  - **Follow-Up Needed:** Facilitator must:  
    1. Contrast the activity’s *argumentative* process with particularism’s claim that moral knowledge is **non-propositional**.  
    2. Discuss whether holism implies **metaphysical non-codifiability** (reasons lack invariant valence) or merely **epistemic limitations** (we can’t *find* the rules).  
    3. Acknowledge that generalists (e.g., Ross) accept defeasible principles—this activity oversimplifies by forcing all-or-nothing choices.  

  **Closing Script:** "Today, you felt the weight of holism—the same feature played opposite roles, and forcing a rule felt artificial. But is this because morality *can’t* be codified, or because we’re bad at codifying? Next class, we test whether ‘moral principles’ are salvageable."  

  ---  
  This structure forces students into the particularist’s dilemma: abandon systematization or embrace inconsistency. By making the cost of generalization tangible (via CP penalties and forced choices), it primes them to grasp holism’s appeal before it’s named.
