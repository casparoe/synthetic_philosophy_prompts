prompt: |-
  I'm working on a project that applies Kant's universalizability tests to institutional moral agency — specifically to maxims adopted within functional roles (judge, administrator, voter, physician) where the agent's practical reasoning presupposes a collective structure that makes the maxim possible. There's a poorly mapped ambiguity in how we read the contradiction in the will: is it a contradiction internal to the individual agent's practical reasoning, or is it a contradiction that only emerges in the institutional architecture that the maxim requires? Given this framing, I want you to treat three open lines of work as candidates for priority, defend an ordering among them, and explain what criteria govern the ranking.

  The three lines are: first, whether the Formula of Universal Law can be coherently extended to maxims whose grammatical and practical subject is an institutional role rather than an individual rational being, without the test collapsing into a different form of universalization (say, a contractualist or rule-utilitarian one); second, whether the "practical contradiction" that results from universalizing certain role-based maxims indicates a genuine moral failure of the agent, a functional impossibility of the institution, or a category error in applying an individualist test to distributed action; and third, what the implications are for moral responsibility when the contradiction is visible only at the institutional level but the harmful act is performed by an individual who could sincerely claim that her personal maxim is universalizable.

  Please prioritize these for a researcher with roughly three years, a background in moral philosophy rather than sociology or legal theory, and an interest in conceptual clarity over policy design. For each line, say why it is or isn't upstream of the others — that is, whether resolving it is a precondition for making progress on the remaining ones. Identify the trade-offs between tractability and importance: which question looks answerable with conceptual tools alone, and which risks becoming an empirical study of institutions disguised as Kant scholarship? Finally, specify what evidence or argument over the next few years would most change your ordering — for instance, if it turned out that Kant's own examples in the Groundwork implicitly depend on individualist assumptions that cannot be relaxed, or if recent work in collective intentionality showed that role-based maxims cannot be individuated sharply enough to enter the universalization procedure at all. I want a defended agenda, not a survey, and not a bibliography.
reasoning: |-
  Okay, the user is working on applying Kant's universalizability tests to institutional roles. They've outlined three specific lines of inquiry and want help prioritizing them. Let me unpack their query carefully.

  First, I notice they're grappling with a core ambiguity in Kant interpretation - whether the contradiction in the will test should be understood individually or institutionally. That's the crux they want resolved. Their three proposed research lines all stem from this central tension.

  The first question is about subjecthood - can institutional roles even be proper subjects for maxims? This seems foundational because if we can't coherently formulate role-based maxims for Kant's test, the other questions become moot. The user's background in moral philosophy rather than sociology suggests conceptual work will suit them better than institutional studies. 

  The second question concerns the nature of the contradiction itself - is it personal or systemic? But this appears downstream because we need to first establish that role-based maxims can enter the universalization procedure meaningfully. 

  The third question deals with moral responsibility when systemic flaws manifest through individual actions. This seems most dependent on resolving the prior issues - it's where the rubber meets the road applicationally.

  For a 3-year timeline, starting with the conceptual foundation makes sense. The subjecthood question can be tackled through textual analysis and logical argumentation, fitting the user's philosophical strengths. The other questions would require more interdisciplinary work they might not be ready for yet.

  The trade-offs are clear: Question 1 is tractable but abstract; Question 3 is concrete but messy. An ideal path would be to secure the conceptual basis first, then build outwards. If Kant's texts show no flexibility on individualism, that would collapse the project early - hence the priority. But if role-based maxims prove viable, the subsequent questions open up rich avenues.

  The user wants a defended agenda, not just a survey. So my recommendation should be firm: Subjecthood first, contradiction nature second, responsibility third - with clear reasoning about dependencies between them. The empirical risks in latter questions make them poor starting points for a philosopher.
answer: |-
  Here is a prioritized research agenda, defended according to your constraints of conceptual focus, philosophical background, and 3-year timeframe:

  **Priority Order:**
  1.  **Subjecthood & Coherence:** Whether FUL can coherently apply to institutional-role maxims without collapsing into alternative universalization forms.
  2.  **Nature of the Contradiction:** Whether the "practical contradiction" indicates moral failure, functional impossibility, or category error.
  3.  **Distributed Responsibility:** Implications for moral responsibility when the contradiction is systemic but the act is individual.

  **Defense of the Ordering & Criteria:**

  1.  **Subjecthood & Coherence (Question 1) is FUNDAMENTAL and UPSTREAM.**
      *   **Why Upstream?** Until you establish *that* and *how* a role-based maxim can even *be* a valid subject for the FUL test *as a Kantian test*, the other questions are premature. If role-based maxims cannot coherently enter the universalization procedure without fundamentally altering its nature (e.g., becoming rule-utilitarian by assessing institutional consequences, or contractualist by requiring role-holder assent), then investigating the *type* of contradiction or *responsibility* for it is meaningless within a Kantian framework. Progress on Questions 2 and 3 *presupposes* a positive or qualifiedly positive answer to Question 1.
      *   **Tractability vs. Importance:** High Importance (foundational), High Tractability (Conceptual). This is pure conceptual analysis and Kantian exegesis. It requires dissecting the logical structure of maxims, the presuppositions of the FUL (rational agency, autonomy), and the metaphysics of roles/institutions. Your background is ideal. It avoids empirical institutional studies. The challenge is rigorously avoiding conceptual slippage into non-Kantian universalization.
      *   **Evidence/Argument Changing Priority:** If textual analysis (e.g., *Groundwork*, *Metaphysics of Morals*) conclusively shows Kant *requires* maxims to be attributable *solely* to individual transcendental freedom, denying any possible "institutional will," this project might be stillborn. Conversely, if analysis of "public right" or Kant's views on offices suggests a conceptual space for role-bound practical reasoning distinct from raw individualism, it strengthens the case.

  2.  **Nature of the Contradiction (Question 2) is DOWNSTREAM but OPERATIONAL.**
      *   **Why Downstream?** This question *assumes* that role-based maxims can be meaningfully universalized via FUL (established in Q1). It then asks *what the contradiction actually signifies* within this newly established framework. Resolving Q1 provides the necessary conceptual tools and framing to even *ask* whether the contradiction reveals a flaw in the agent's character, a flaw in the institutional design presupposed by the role, or a mistake in applying the test here at all. Progress here clarifies the *meaning* of a failed test in this context.
      *   **Tractability vs. Importance:** High Importance (diagnostic), Moderate Tractability (Conceptual/Interface). While still primarily conceptual, probing the "contradiction in the will" for institutional roles requires careful interface between Kant's moral psychology and the functional logic of institutions. It risks veering towards functionalist analysis ("impossibility of the institution"), which must be kept strictly within the bounds of *practical reason* (what a rational will *could* consistently will for the institution) rather than empirical sociology. Your philosophical toolkit is still central.
      *   **Evidence/Argument Changing Priority:** If work in Q1 reveals that role-based maxims entail a *necessary* institutional reference, making the "will" inherently collective *for the purpose of the test*, then the contradiction *must* be read institutionally, pushing this question higher. If recent work on collective intentionality (e.g., Bratman, Gilbert, Pettit) convincingly shows that "institutional willing" relevant to *moral* contradiction is incoherent or reducible to individual wills, it undermines the distinct institutional reading.

  3.  **Distributed Responsibility (Question 3) is APPLICATION and DOWNSTREAM.**
      *   **Why Downstream?** This crucial question about blame, sanction, and individual culpability *presupposes* answers to both Q1 and Q2. You must first know *if* the role-based maxim is a valid FUL subject (Q1), and *what kind of failure* the contradiction reveals (Q2: e.g., is it a *moral* failure of the agent, or just a design flaw?). Only then can you rigorously analyze the responsibility of the individual actor embedded within the flawed system. Addressing this first would lack the necessary conceptual grounding.
      *   **Tractability vs. Importance:** High Importance (practical implications), Lower Tractability (Conceptual/Empirical Risk). While the core question of responsibility is philosophical, answering it robustly in this context *requires* a firm grasp of the institutional agency established in Q1 and the nature of the failure diagnosed in Q2. There's a significant risk of this line demanding analysis of real-world institutional dynamics, role internalization, epistemic constraints on actors, and potentially legal/sociological theories of organizational responsibility – areas outside your core background and the project's conceptual focus. It's the point where the conceptual framework meets messy reality.
      *   **Evidence/Argument Changing Priority:** If resolving Q2 definitively shows the contradiction *only* indicates institutional dysfunction with *no* necessary implication for the *moral character* of the individual role-holder acting sincerely on a universalizable personal maxim, this question becomes less urgent (focus shifts to institutional reform). Conversely, if Q2 shows the contradiction *does* imply a failure of the agent's *moral reasoning* precisely *because* they inhabit the role, this question gains urgency.

  **Governance Criteria for Ranking:**

  1.  **Conceptual Dependency (Upstreamness):** Does progress on *this* question logically enable or constrain work on the others? (Q1 is most upstream).
  2.  **Fit with Researcher's Assets:** Does the question leverage philosophical training and prioritize conceptual clarity over empirical/disciplinary breadth? (Q1 & Q2 fit best, Q3 risks divergence).
  3.  **Tractability within Constraints:** Can the question be meaningfully advanced in 3 years using primarily philosophical/conceptual tools? (Q1 is safest, Q2 feasible, Q3 riskiest).
  4.  **Foundation vs. Application:** Does the question establish the core framework (Q1), refine its operation (Q2), or explore its consequences (Q3)? Foundational work precedes application.
  5.  **Risk of Framework Collapse:** Does a negative answer to this question fundamentally undermine the entire project? (Failure in Q1 is most catastrophic).

  **Conclusion:** Begin with **Subjecthood & Coherence (Q1)**. It is the indispensable conceptual bedrock upon which the entire project rests. Success here validates the core premise and provides the tools for Q2. In Year 2, shift to the **Nature of the Contradiction (Q2)**, diagnosing what the test reveals within the institutional framework established in Q1. Only in Year 3, with firm answers to Q1 and Q2, tackle **Distributed Responsibility (Q3)**, where the philosophical framework confronts the complexities of individual action within potentially flawed institutional agency. This order maximizes conceptual rigor, leverages your strengths, mitigates empirical drift, and ensures each stage builds logically on the last.
