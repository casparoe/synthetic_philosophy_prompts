  hey im prepping interview questions for my podcast next week — the guest is this philosopher (lets call her Dr. Meera) who defends a strict four-pramāṇa Nyāya view but with a twist: she thinks upamāna (comparison/analogy) is the real workhorse behind scientific reasoning and that anumāna gets overrated. i need like 8 or 9 questions that go past surface-level stuff. specifically i want one that presses her on why upamāna doesn't just collapse into pratyakṣa or śabda, one on how she answers the old Nyāya objection that analogies already presuppose knowledge of the relation being compared, and one that asks whether transformer-style pattern matching in LLMs is closer to upamāna or to anumāna — and for each, a follow-up that anticipates her reply and then pokes a hole in it. also maybe one about whether making comparison primary makes the pramāṇa list circular. no need for citations or a reading list, just the actual questions. oh and i keep typing pramana without the long a so don't stress about perfect spelling.
