  First, I need to establish clear conceptual boundaries. Contractual conversion implies organic transformation through voluntary cooperation within market structures, while structural expropriation necessitates state-enforced ownership abolition. This maps well to Mill's documented ambivalence about socialism - his enthusiasm for worker cooperatives versus suspicion of revolutionary seizures.

  For the arguments section, I recall Mill's Chapters on Socialism emphasize experimentation with producer cooperatives as laboratories for moral improvement. His stationary state concept becomes crucial here - envisioning capitalism's peaceful supersession once growth plateaus and distributive justice ascends. The competitive element is vital; Mill wants cooperatives to prove superiority through market success, not mandate.

  The crux lies where widespread voluntary adoption might achieve socialist ends through market means. If cooperatives dominate through efficiency, does that functionally expropriate capitalists without state action? And can Mill's liberty principle distinguish this from coercion when systemic outcomes are identical? This exposes his delicate balancing act.

  Evaluating within utilitarianism: Mill optimistically assumes contractual conversion satisfies both justice and efficiency. But his framework struggles if cooperatives fail to emerge voluntarily at scale. The stationary state's democratic politics might then demand structural solutions, clashing with his anti-paternalism.

  Ultimately Mill commits to evolutionary socialism - rejecting expropriation while betting competitive markets will voluntarily birth cooperative ownership. The distinction clarifies his unique position but obscures whether market pressures could themselves become coercive in transitional phases.
answer: |-
  ### 1. Conceptual Framing (200 words)
  **Contractual conversion** denotes the gradual, voluntary replacement of hierarchical capitalist firms with worker-owned cooperatives through free market processes. It relies on individuals freely associating under new property arrangements via contract and competition, proving cooperatives' superior efficiency and morality without state coercion. **Structural expropriation** signifies the abolition of private capital ownership as a non-negotiable prerequisite for justice, achieved through state power (e.g., confiscation or mandatory collectivization) overriding individual choice and existing property rights. Mill's late writings align with the first while rejecting the second. He sympathizes with socialism's critique of wage labor's indignity and distributive inequities but insists transformation must occur through persuasion, voluntary experimentation, and competitive success—not state-imposed revolution. For Mill, justice requires respecting individual liberty and existing entitlements during transition; structural expropriation violates both by mandating a specific economic endpoint. Contractual conversion preserves freedom of association and market dynamism while allowing socialist principles to prove their worth organically.

  ### 2. Mill’s Arguments (250 words)
  Mill’s late position advocates for worker cooperatives as the ideal vehicle for socialist transformation. He argues cooperative production aligns workers' interests, eliminates exploitative employer-employee relations, and distributes profits equitably, fostering moral development and social harmony. Crucially, this must emerge *voluntarily*: workers freely associate, pooling capital or securing loans to buy out firms. Competition remains essential. Cooperatives must demonstrate superior efficiency and fairness in the marketplace, outcompeting traditional firms to attract workers and capital. This "competitive test" ensures progress reflects genuine merit, not state favoritism.

  Mill envisions this evolution occurring within a "stationary state" of capital accumulation—a mature economy where growth plateaus. Here, society shifts focus from relentless production to equitable distribution and quality of life. The stationary state provides fertile ground for cooperatives, as emphasis moves from maximizing investor returns to improving worker welfare and social justice. Mill rejects state confiscation or forced collectivization. Redistribution, if needed, should occur through inheritance taxes or limited welfare, not the abolition of private capital. His socialism hinges on *voluntary adoption* of cooperative models within a competitive framework, gradually transforming economic relations without violating property rights or individual liberty.

  ### 3. The Crux (200 words)
  The tension crystallizes when contractual conversion achieves near-universal success. If cooperatives demonstrably outcompete capitalist firms, attracting virtually all labor and capital through free choice, private capital ownership in production could functionally disappear. This outcome—a cooperative economy—mirrors the *result* of structural expropriation, achieved through market forces rather than state seizure. The conceptual boundary collapses here: widespread voluntary adoption functionally abolishes private capital as a dominant social relation. Mill’s commitment to liberty faces strain at this point. If cooperatives become overwhelmingly dominant, the "choice" for new workers or entrepreneurs to form traditional firms might exist formally but be practically non-viable due to market pressures, mimicking structural exclusion. Furthermore, Mill’s utilitarian concern for distributive justice might seem satisfied by the cooperative outcome, but his liberal principle—protecting the liberty to own capital and hire labor, even if inefficient—risks being extinguished not by law, but by the very competitive processes he championed. The voluntarism underpinning contractual conversion becomes precarious when systemic outcomes render alternative arrangements obsolete.

  ### 4. Assessment within Mill’s Framework (200 words)
  Resolving this tension within Mill’s utilitarianism and liberalism is challenging. Utilitarianism *might* justify the cooperative dominance if it maximizes overall happiness through greater equity and dignity, even if it de facto eliminates traditional capitalism via market pressure. Mill could argue that protecting a "liberty" to engage in socially inferior (exploitative, less efficient) wage-labor relations isn't a core liberal value. However, his deep liberal commitment to pluralism and individual experimentation clashes with this. If the market "chooses" cooperatives universally, it extinguishes economic diversity and the freedom to test alternative arrangements, potentially stifling innovation. Mill’s framework struggles to reconcile these outcomes. His insistence on limiting state power (rejecting expropriation) is clear, but his optimism about voluntary conversion overlooks how market success could itself become a coercive force undermining the very economic liberty he sought to preserve. This reveals an ambiguity: Mill defends existing property rights during transition yet champions a system (cooperatives) whose full success would render those rights (to own capital *for employing others*) largely irrelevant. He lacks a clear principle for when market-driven homogeneity becomes illiberal.

  ### 5. Bottom Line (100 words)
  Mill’s late socialism commits him to the *experimental, voluntary, and competitive* adoption of worker cooperatives as a morally and economically superior alternative to wage labor, while staunchly rejecting state-mandated expropriation of private capital. He advocates a gradual evolution within the market framework. The contractual/structural distinction clarifies his core commitment: transformation must respect individual liberty and property rights via free contract and association. However, it obscures the potential instability at the endpoint: if contractual conversion succeeds completely, its functional outcome—the effective abolition of private productive capital ownership through market forces—becomes indistinguishable in practice from the expropriation Mill morally opposed, raising unresolved questions about the survival of economic pluralism.
