prompt: |-
  You are serving as an expert philosophical advisor to an institutional decision body: a philosopher of science with deep familiarity in formal epistemology, Bayesian reasoning, and decision theory, writing for an interdisciplinary board that includes statisticians, ethicists, and administrators but no specialist in agreement theorems. Before drafting, think step-by-step: consider whether a middle path exists—such as permitting a family of baseline priors rather than a single shared prior, or requiring sensitivity analysis across permitted priors—that might preserve both aggregation coherence and expert autonomy.

  I chair the Advisory Panel on Aggregation Protocols for my university's Center for Structured Expert Judgment. The Center proposes a two-stage forecasting protocol for institutional risk planning: in Stage One, disciplinary experts (epidemiologists, climate modelers, economists) must converge on a shared baseline prior distribution over the relevant outcome space before accessing their private datasets; in Stage Two, each updates independently and the pooled posteriors inform institutional decisions. The rationale is that without this "prior calibration" step, aggregation collapses into incommensurable posteriors—treating rational disagreement as irreducible noise—and makes institutional risk planning impossible.

  Half the panel supports the protocol, arguing that a common prior is a procedural precondition for meaningful Bayesian aggregation, not an epistemic suppression. The other half rejects it, arguing that mandating prior agreement violates expert autonomy, conceals genuine theoretical disagreement behind false consensus, and risks institutional overconfidence—especially since disciplines have structurally different evidential baselines. One dissenting member has introduced a niche concern: in domains of "deep uncertainty," where the outcome space itself is contested, forcing a shared prior does not merely suppress probability disagreement; it can silently commit the institution to an ontological framing that some experts reject—treating climate tipping points as quantifiable risks rather than qualitative regime shifts, for example.

  We must issue a formal recommendation memo before next month's board meeting. The memo should recommend whether to approve, reject, or approve with conditions the proposed common-prior calibration protocol, with a concrete implementation timeline if approved, or a concrete alternative aggregation method if rejected.

  Structure your response exactly as follows, with approximate lengths:

  1. Executive Summary (approx. 120 words): State the bottom-line recommendation and the single strongest reason.
  2. The Philosophical Core (approx. 220 words): Explain the common prior assumption and why it is contested here, including the deep-uncertainty framing problem.
  3. The Case for the Protocol (approx. 260 words): Present the strongest arguments for Stage One fairly.
  4. The Case Against the Protocol (approx. 260 words): Present the strongest objections, including autonomy and ontological framing, fairly.
  5. Adjudication and Verdict (approx. 220 words): Evaluate competing considerations, identify any missed middle ground, and state what is decisive.
  6. Concrete Recommendation and Conditions (approx. 220 words): Give an actionable decision—approve, reject, or approve with conditions—with specific safeguards or an alternative method, plus an implementation timeline or review checkpoint.
  7. Treatment of the Losing Side (approx. 160 words): Honestly address the strongest remaining consideration on the side you did not take and explain why it does not overturn your recommendation, or what residual risk to monitor.

  Write in a formal, polished tone suitable for circulation to a university board. Do not include bibliographies, reading lists, citation requests, or requests for further sources. Do not ask for references. Focus on reasoning that stands on its own, and ensure your recommendation includes a clear time frame or checkpoint.
reasoning: |-
  Okay, let me approach this as a philosophical advisor to the panel. The core tension is between institutional coherence (requiring Bayesian aggregation) and expert autonomy in high-stakes forecasting. The proposed two-stage protocol demands shared priors before private data access - a strong constraint that triggers legitimate epistemic and ethical concerns.

  Hmm... The "deep uncertainty" objection particularly resonates - forcing priors can covertly impose ontological commitments when experts fundamentally disagree about the nature of the phenomenon (e.g., tipping points as quantifiable risks vs. qualitative shifts). But the pro-protocol argument has weight too: without some baseline calibration, aggregation becomes mathematically incoherent. 

  I wonder if there's a middle path? Instead of a single prior, perhaps allow a family of priors reflecting different disciplinary perspectives. Or mandate explicit sensitivity analyses showing how conclusions vary across plausible priors. This could preserve both aggregation integrity and theoretical pluralism. 

  For the memo structure: The executive summary needs to clearly recommend the conditional approval with this sensitivity analysis requirement. The philosophical core should unpack why the common prior assumption is both necessary and problematic here - especially the ontological framing risk. 

  When presenting both sides, I'll emphasize the pro-protocol argument about avoiding "garbage in, garbage out" aggregation, while giving full weight to the autonomy objection. The adjudication must show why the middle path resolves the deadlock. 

  The timeline should include a pilot phase with post-hoc review - say 18 months - to evaluate if the sensitivity analyses adequately capture dissent. For the losing side concession, I'll acknowledge that residual framing risks persist even with multiple priors, requiring ongoing ontological audits. 

  This approach honors the Bayesian framework while rejecting its most restrictive assumptions. The key is making the pluralism systematic rather than ad hoc.
answer: |-
  **1. Executive Summary**  
  The Panel recommends **approving the protocol with conditions**, mandating sensitivity analysis across a *family* of disciplined baseline priors rather than a single shared prior. The strongest reason is that this reconciles Bayesian coherence with expert autonomy: it ensures probabilistic aggregation remains meaningful while transparently capturing irreducible theoretical disagreements—especially critical in domains of deep uncertainty where outcome spaces are contested. Implementation requires Stage One to generate multiple priors reflecting structurally different evidential baselines (e.g., quantifiable risk vs. qualitative regime shift frameworks), with Stage Two updates and final aggregation conditioned on this plurality.  

  ---

  **2. The Philosophical Core**  
  The common prior assumption (CPA) posits that rational agents with identical information should agree on prior probabilities. It enables coherent aggregation by ensuring posterior differences stem solely from new evidence. Here, CPA is contested because disciplinary experts *begin* with irreconcilable "evidential baselines" shaped by theoretical commitments—not incomplete information. Forcing a single prior risks misrepresenting foundational disagreements as computational errors. Crucially, in deep uncertainty (e.g., climate tipping points), outcome spaces are ontologically contested: experts disagree on *what constitutes a relevant event*. A monolithic prior implicitly institutionalizes one framing, suppressing alternatives as mathematically illegible.  

  ---

  **3. The Case for the Protocol**  
  Proponents correctly argue that without prior calibration, Bayesian aggregation degenerates. Disparate priors produce divergent posteriors even under identical evidence, rendering pooled outputs incoherent—effectively aggregating incommensurable quantities. This undermines institutional risk planning by treating substantive theoretical divides as noise. The protocol’s Stage One mitigates this by establishing a controlled epistemic baseline, ensuring posterior differences reflect only *new* evidence. It operationalizes the CPA not as dogma but as a procedural scaffold for commensurability, preventing self-defeating relativism in aggregation. Crucially, it compels experts to explicitly negotiate uncertainties *before* data access, reducing idiosyncratic overconfidence.  

  ---

  **4. The Case Against the Protocol**  
  Opponents contend that mandating prior convergence violates expert autonomy by compelling consensus on premises some fundamentally reject. It risks institutional groupthink: a negotiated prior may reflect diplomatic compromise or dominant paradigms rather than epistemic legitimacy, concealing dissent under false unity. In deep uncertainty, it exacerbates ontological injustice—e.g., quantifying climate tipping points as continuous risks privileges modeling approaches over qualitative, complex-systems perspectives. This frames dissent as recalcitrance, not reasoned disagreement. Practically, experts may disengage if their core frameworks are marginalized, degrading the process’s legitimacy and evidential quality.  

  ---

  **5. Adjudication and Verdict**  
  Both positions identify valid perils: incoherent aggregation versus epistemic suppression. The decisive insight is that CPA need not require *one* prior—only a *shared structure* for comparing divergences. A middle path exists: **requiring experts to define a finite set of baseline priors** representing distinct, discipline-sanctioned ontological framings (e.g., a climate economist’s stochastic prior vs. an Earth system scientist’s catastrophe-theoretic prior). This preserves Bayesian coherence *within* each framing while making aggregation across framings transparent. The core failure of the proposed protocol is ontological monism; the solution is structured pluralism.  

  ---

  **6. Concrete Recommendation and Conditions**  
  **Approve the protocol with binding conditions:**  
  - **Stage One Modification:** Experts jointly define 2–4 baseline priors reflecting distinct, defensible ontological framings (e.g., continuous risk vs. discontinuous thresholds). Priors must satisfy peer-validated disciplinary plausibility.  
  - **Stage Two Modification:** Each expert updates *all* priors with private data.  
  - **Aggregation:** Final forecasts report (a) posterior distributions under each prior, and (b) meta-distributions (e.g., model-averaged) with weights reflecting institutional risk appetites.  
  - **Safeguards:** An ethics review certifies no framing is systematically excluded; experts may append dissents.  
  - **Timeline:** Pilot phase (18 months) for 3 high-uncertainty risks, with review by this Panel at 12 months. Full rollout contingent on review approval.  

  ---

  **7. Treatment of the Losing Side**  
  The strongest residual risk—that ontological framing biases in the prior family may still institutionalize contested assumptions—is acknowledged. However, this approach *mitigates* (not eliminates) the risk by formalizing pluralism and exposing framing choices to scrutiny. The dissenting concern for expert autonomy is honored by permitting framings to emerge from experts (not administrators) and allowing dissents. The Panel will monitor for "framing drift" in reviews, requiring revalidation of priors biannually. While no method fully escapes the problem of deep uncertainty, this makes institutional commitments explicit and contestable.
