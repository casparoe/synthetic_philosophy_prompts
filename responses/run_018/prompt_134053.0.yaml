  *Pauses to organize thoughts* The user wants desiderata that address all these while respecting evolutionary/neurobiological constraints. Non-negotiables would include: avoiding circularity in scaffolding, forbidding reflexive cranes (they're skyhooks in disguise), preserving the ontology/explanatory distinction, and accounting for normative force. The cross-cultural disagreement point might be negotiable in how it's resolved, but not in requiring a naturalistic account of revision.

  *Checks for tensions* The biggest conflict might be between needing emergent normative properties (to avoid reductionism) and demanding step-by-step materialist construction (to avoid skyhooks). That's the tightrope walk. Also, requiring error correction without transcendence is tricky but possible through social feedback loops.

  For evaluating existing theories: Evolutionary game theory often stumbles on scaffolding paradox. Dual-process models risk explanatory delegation failures. Normativist-emergence views flirt with skyhooks. The reflexivity constraint does heavy lifting here - it exposes when theories cheat.

  *Mentally sketches response structure* Will define crane requirements first, then each desideratum with rationale and negotiability status. Highlight the reflexivity prohibition as the killer filter. Keep comparisons brief but precise. User seems exhausted by debate, so clarity is paramount - no jargon dumps.
answer: |-
  Here’s a systematic breakdown of desiderata for a legitimate crane-based account of moral cognition, followed by evaluations of key approaches. The core challenge is **building normative properties (e.g., "oughtness," authority) from non-normative biological/cognitive parts without erasing normativity or smuggling in unexplained elements.**

  ---

  ### **Core Crane Requirements: What Must Be Delivered**
  1. **Ontological Emergence without Mystery**: Normative properties must *arise* from complex interactions of non-normative parts (e.g., neurons, evolutionary pressures), but not as brute additions.  
  2. **Explanatory Autonomy**: Higher-level normative phenomena (e.g., moral dilemmas) require explanations at their own level *without* being reducible to lower-level terms (e.g., "neuron X fired" cannot replace "I felt obligated").  
  3. **Causal Efficacy**: Emergent normative capacities must exert real causal influence (e.g., guilt altering behavior).  
  4. **Compatibility with Evolution/Biology**: Must fit known constraints (e.g., no teleology, no violation of natural selection).  

  ---

  ### **Desiderata for an Adequate Crane-Based Account**  
  *(Non-negotiable unless specified)*  

  1. **Resolve the Scaffolding Paradox**  
     - **Phenomenon**: E.g., "reputation tracking" seems to presuppose norms (e.g., "cheating is *wrong*").  
     - **Requirement**: The theory must show how proto-normative scaffolding (e.g., predictive reward systems) *bootstraps* into full normativity via feedback loops. **Non-negotiable**.  
     - **Solution Sketch**: Iterative co-evolution (e.g., low-level reinforcement learning + social feedback creates normative "pull").  

  2. **Forbid Reflexive Cranes**  
     - **Problem**: A mechanism that "borrows" normativity (e.g., "we track norms because norms exist") is a skyhook.  
     - **Requirement**: No mechanism can presuppose the very normative layer it constructs. **Non-negotiable**. Reflexive cranes collapse into circularity.  

  3. **Distinguish Ontological Reduction vs. Explanatory Delegation**  
     - **Greedy Reductionism Trap**: Confusing "morality is *made of* neural processes" (ontological) with "morality is *explained by* neural processes alone" (explanatory).  
     - **Requirement**: Preserve normative properties as real emergent patterns, while explaining their *basis* mechanistically. **Non-negotiable**. Collapsing these erases normativity.  

  4. **Explain Cross-Disagreement & Error Correction**  
     - **Phenomenon**: Moral progress (e.g., rejecting slavery) without invoking transcendent "Truth."  
     - **Requirement**: Show how norms are revised via *immanent criteria* (e.g., coherence, well-being feedback). **Non-negotiable**. Skyhooks = failure.  
     - **Solution Sketch**: Social negotiation + cognitive biases (e.g., aversion to suffering) acting as error signals.  

  5. **Empirical Equivalence with Evolutionary Psychology (EP)**  
     - **Requirement**: Not necessary. EP often relies on just-so stories; a crane-based account can (and should) posit *more constrained* mechanisms. **Negotiable** if EP models are underspecified.  

  ---

  ### **Tensions & Dealbreakers**  
  - **Major Conflict**: *Explanatory autonomy* (Desideratum 3) vs. *strict physical closure* (all causes are physical). **Resolution**: Normative properties supervene on physical bases but have "downward causation" via constraint-based feedback (e.g., norms shape neural plasticity).  
  - **Killer Constraint**: **Reflexive cranes are forbidden** (Desideratum 2). This excludes:  
    - Theories where "normative inference" is presupposed in cognitive machinery.  
    - Evolutionary accounts where "group fitness" implicitly assumes moral value.  

  ---

  ### **Evaluation of Existing Approaches**  
  1. **Evolutionary Game Theory (EGT)**  
     - ✅ Explains cooperation (e.g., tit-for-tat) mechanistically.  
     - ❌ Fails Desideratum 1 (scaffolding): Stable equilibria ≠ *obligation*. Often smuggles in normativity (e.g., "punishment evolves" assumes wrongness).  
     - ❌ Risks greedy reductionism (Desideratum 3): Reduces "fairness" to payoff matrices.  

  2. **Dual-Process Models**  
     - ✅ Distinguishes intuitive (System 1) vs. reflective (System 2) judgment.  
     - ❌ Fails Desideratum 2: System 2 often implicitly uses "rational norms" as skyhooks.  
     - ❌ Lacks emergent normativity: Cannot bridge *is* (cognitive conflict) → *ought* (authoritative correction).  

  3. **Normativist-Emergence Views**  
     - ✅ Takes normativity seriously (Desideratum 3).  
     - ❌ Risks Desideratum 2: Some posit "proto-norms" that covertly borrow from full normativity.  
     - ❌ Struggles with Desideratum 4: Explaining error correction without transcendence is underspecified.  

  ---

  ### **Conclusion: The Viable Path**  
  A successful crane must:  
  1. **Bootsrap normativity** via layered feedback (e.g., emotional conditioning → social negotiation → abstract principles).  
  2. **Anchor "oughtness" in constitutive goals** (e.g., deep needs for social belonging + avoidance of distress as biological foundations).  
  3. **Treat moral disagreement as system-level calibration** (e.g., norms evolve via cognitive conflict resolving into wider coherence).  

  **Biggest Obstacle**: Avoiding reflexive cranes while explaining normativity's *causal grip*. Most theories fail here by either reducing morality to non-normative parts (greedy) or invoking ungrounded normativity (skyhooks). The solution requires showing how material processes *acquire* normative authority through their role in maintaining complex, self-sustaining systems (e.g., minds in social networks).
