  Hmm, this requires unpacking several layers. First, I need to establish what a legitimate crane for normative capacities must achieve. The core tension seems to be: how can we explain moral judgment as emerging from non-moral components without either erasing its distinctive normative character (reductionism) or smuggling in unexplained elements (skyhooks)? 

