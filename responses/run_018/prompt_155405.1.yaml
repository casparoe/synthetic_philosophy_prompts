  hey so i just moved to berlin for grad school and im kind of obsessed with how seriously people take queing and jaywalking here. i was fighting with my flatmate about whether im actually morally wrong when i cross on red with zero cars, or skip a tip in some weird edge case. can you write a dialogue between me and my flatmate arguing about whether everyday local conventions — queing, jaywalking, tipping — are real moral obligations that visitors must follow, or just coordination norms? neither of us should be a strawman; we should actually respond to each other. my flatmate thinks some conventions are "opaque" to outsiders — you cant tell if theyre moral or practical — so opacity demands deference. i think opacity means you should suspend judgment instead of blindly following. please answer in american english. oh and i know i spelled queing wrong at least once, and i probably wrote "definately" somewhere — just keep the casual vibe with a typo or two.
