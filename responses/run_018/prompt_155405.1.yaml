answer: |-
  Okay, here's that kitchen-table debate, typos and all, keeping it real:

  **Setting:** A slightly messy Berlin apartment kitchen. Alex (you, American grad student) is making coffee. Finn (your flatmate, lived in Berlin for 3 years) is scrolling their phone at the table.

  **Alex:** Ugh, Finn, seriously? More passive-aggressive tutting on the way home. Some lady *definately* gave me the stink-eye ‘cause I crossed Landsberger Allee on red. Like, 3 AM, *zero* cars for miles. It was basically a pedestrian runway.

  **Finn:** (Looks up, sighs) Alex. It’s not about *that* car, or that moment. It’s the principle. People expect predictability. Kids see you, they think it’s okay. An old person hesitates ‘cause they see you crossing against the light, maybe they misjudge... it creates chaos.

  **Alex:** Chaos? Dude, it was deserted! That feels... performative. Like, the *rule* is the moral thing, regardless of context? It’s just a coordination norm. Like driving on the right. Useful, but not inherently *wrong* if you safely drive on the left on an empty road in Montana.

  **Finn:** Okay, maybe the desert road analogy kinda works... but norms *become* moral when they’re about safety and fairness in a dense society. Jaywalking *can* be dangerous, even if not every single instance is. Following the signal is respecting the system that keeps everyone safer overall. You skipping it disrespects that social contract.

  **Alex:** "Social contract"? But what if the contract has weird, arbitrary clauses? Like tipping! Last week at that weird Späti where the guy literally grunted at me? Zero service vibe. I left coins, but way less. You said I stiffed him. But *why* is that stiffing him? Is it a moral obligation to subsidize wages everywhere, always, even with terrible service? Or is it just a practical norm because wages are low, and I’m free to adjust based on service? How is that *moral*?

  **Finn:** **That’s** the opacity thing I keep trying to explain! You *don’t know* why the norm exists or how deeply it’s tied to someone’s livelihood here. Maybe that Späti guy is paid *expecting* tips. Maybe his boss is a jerk. Maybe he’s just having a crap day. The *point* is, **you don’t know**. As an outsider, the safest, most respectful thing is to defer to the local convention until you *truly* understand it. Blindly applying your "critical judgment" without the cultural context is arrogant. Deference shows respect for the system you’re joining.

  **Alex:** Whoa, "arrogant"? Harsh. Look, I get the humility angle. I do. But blind deference feels... intellectually lazy? And sometimes harmful! If a norm *is* actually unjust – and yeah, tipping *can* be seen as letting employers off the hook – shouldn’t we question it? Opacity means **suspend judgment**, not automatically obey. Like, figure out *why* people care about queing so much. Is it pure fairness? Fear of confrontation? Efficiency? Once I know *why*, I can decide if it makes sense to follow strictly, or if bending it in an edge case (like genuinely not seeing the end of the line) is harmless.

  **Finn:** But in the *moment*, Alex, when you’re at the Bäckerei and everyone’s silently queing with laser focus, your "suspended judgment" looks like line-cutting or disrespect. The *perception* matters. Following the visible norm prevents friction, maintains order. It’s practical *and* shows consideration. Question it later, research it, debate me over coffee... but in the moment? Just queue. Cross on green. Tip the standard amount unless something is egregious. It’s not blind obedience, it’s social lubrication. You avoiding minor social friction *is* a moral good in a community.

  **Alex:** Social lubrication, okay, I can kinda buy that argument for avoiding conflict. Like, fine, I’ll queue super diligently to avoid glares. But calling it a *moral* failing if I don’t? That feels like conflating politeness with ethics. And the opacity thing... shouldn’t locals *welcome* questions about *why* a norm exists? If it’s truly practical and good, explaining it should reinforce it. If it’s just "because we’ve always done it," maybe it *should* be challenged?

  **Finn:** Challenged thoughtfully, over time, sure. But bombarding locals with "But WHY?" every time you encounter a norm is exhausting and often comes off as dismissive. Defer first, understand later. Then challenge if you still think it’s valid. Starting with defiance because you don’t immediately see the point... that’s where the friction comes from. It’s not just about *you* and the empty street. It’s about participating in the system as it is, while you learn it.

  **Alex:** (Takes a sip of coffee) Okay, okay. So... deference as a temporary courtesy while learning the ropes? Not a permanent moral surrender? I can maybe get behind that. But only if it goes both ways – locals gotta cut *me* some slack while I figure out which norms are sacred and which are just... German efficiency on autopilot.

  **Finn:** (Smirks slightly) Deal. But for now... just wait for the damn green man, okay? My nerves can’t take the tutting on your behalf.

  **Alex:** (Grins) Fine. But we're *not* done arguing about that Späti tip.
