answer: |-
  ### Exam Question: Ethics 405 Final (90 minutes | Target: 700 words)  
  **Scenario:** Dr. Aris Thorne, a climate scientist, publishes a paper titled "The Objective Imperative: Deriving Moral Duty from Climate Data." She argues that statistical models projecting a 2.8°C global temperature rise by 2050—coupled with economic data predicting a 17% loss in global GDP—*directly imply* a moral obligation for all nations to reduce carbon emissions. She insists her derivation relies solely on empirical facts ("is" statements) with "zero hidden ethical premises."  

  **Task:**  
  1. **Diagnose** whether Thorne’s derivation collapses due to **Hume’s is-ought gap**, **Moore’s naturalistic fallacy** (via the open-question argument), or **both**.  
  2. **Defend** whether these two failures represent the *same underlying logical error* or *distinct conceptual mistakes*.  
  3. **Engage reverse derivation**: Could a pre-existing "ought" (e.g., "we *must* limit warming to 1.5°C") retroactively validate or invalidate empirical "is" claims (e.g., temperature projections)? Explain implications.  

  ---

  ### Model Answer (620 words)  
  Thorne’s attempt to derive moral obligation from descriptive data fails on both Humean and Moorean grounds, but these diagnose *distinct* errors with complementary implications.  

  **1. Hume’s gap: The missing bridge**  
  Hume’s is-ought problem exposes Thorne’s *logical invalidity*. Temperature statistics and GDP projections ("is" statements) describe factual states of the world. Moral obligations ("oughts") prescribe actions. No logical rule permits inferring prescriptions from descriptions alone. For example: "Unmitigated emissions cause 2.8°C warming" *does not entail* "we ought to reduce emissions"—unless we add a suppressed premise like "we ought to prevent economic loss" or "preserving human welfare is good." Thorne’s claim of "zero hidden value premises" is thus incoherent; her conclusion smuggles in an unstated normative commitment. Hume’s gap is about *inferential structure*: moving from descriptive premises to prescriptive conclusions requires a normative bridge.  

  **2. Moore’s naturalistic fallacy: The definitional trap**  
  Moore’s open-question argument attacks Thorne’s *conflation of concepts*. Suppose we grant Thorne’s empirical data (e.g., "2.8°C warming reduces GDP"). Moore would ask: *Is preventing this outcome necessarily "good"?* Even if we agree it *is* good, this remains an *open question*—it cannot be resolved by scientific data alone. Moore’s fallacy occurs when "good" (an indefinable, non-natural property) is reduced to natural properties like "economic stability" or "temperature thresholds." Thorne conflates *what is* (empirical consequences) with *what ought to be valued*, committing a category error. While Hume identifies invalid inference, Moore reveals conceptual equivocation.  

  **3. Divergence and synergy**  
  These failures are *not identical*:  
  - **Hume** targets *reasoning validity* (can’t leap from "is" to "ought").  
  - **Moore** targets *conceptual boundaries* (can’t define "good" via natural properties).  
  Thorne’s error is doubly flawed: her inference is invalid (Hume), *and* she misidentifies the nature of moral terms (Moore). They converge, however, in rejecting *ethical naturalism*—the idea that moral facts are reducible to scientific facts.  

  **4. Reverse derivation: Can "ought" block "is"?**  
  Reverse derivation—using an "ought" to challenge an "is"—fares no better. Suppose policymakers declare, "We *ought* to limit warming to 1.5°C; therefore, models showing 2.8°C rises are flawed." This confuses prescription with description. Normative commitments (*oughts*) might influence *which empirical questions we ask* (e.g., funding research on 1.5°C pathways), but they cannot invalidate factual data. Science remains accountable to evidence, not moral preferences. Symmetry fails: while *oughts* cannot be derived from *is*, *is* cannot be negated by *ought*.  

  **Conclusion**  
  Thorne’s derivation fails separately from Humean (invalid inference) and Moorean (conceptual confusion) perspectives. Reverse derivation highlights their asymmetry: prescriptive commitments may guide empirical inquiry but cannot override descriptive truths. Both failures remind us that ethics requires explicit value premises irreducible to data—a lesson critical for evidence-driven fields like climate policy.  

  ---

  ### Marking Scheme (20 points)  
  | **Must-Hit Moves**                     | **Points** | **Common Pitfalls** |  
  |----------------------------------------|------------|---------------------|  
  | **1. Hume’s gap correctly applied**    | 4          | Mistaking Hume for a semantic critique (confusing with Moore) |  
  | **2. Moore’s OQA correctly applied**   | 4          | Reducing Moore to "you can’t define good" without open-question logic |  
  | **3. Differentiation of errors**       | 5          | Conflating Hume/Moore as "same issue" or vague appeals to "naturalism" |  
  | **4. Reverse derivation engagement**  | 4          | Claiming symmetry ("ought blocks is") without critique |  
  | **5. Synthesis & insight**             | 3          | Mechanical comparison; no meta-commentary on naturalism’s limits |  

  ### Exam Writer’s Notes  
  - **Crux distinction**: Hume is about *inferential validity*; Moore is about *conceptual irreducibility*.  
  - **Reverse derivation trap**: Students often assert moral goals can "reframe science," but lose marks if they imply *oughts* override empirical truth.  
  - **Anti-regurgitation guard**: By requiring analysis of a *specific scientific claim* and *reverse derivation*, the question forces application beyond textbook definitions.  
  - **LLM-compatibility**: Avoids niche references; relies on core Hume/Moore arguments any competent model would encode.  

  This design ensures candidates must *use* the concepts, not just recognize them—aligning with your professor’s emphasis on "failure modes in practice."
