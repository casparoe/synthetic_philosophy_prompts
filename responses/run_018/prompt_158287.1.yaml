  Key philosophical tension:
  - Suffering is lexically worse than pleasure up to a threshold (i.e., any suffering above the threshold cannot be compensated by any amount of pleasure).
  - Below the threshold, suffering and pleasure are commensurable (can be traded off on a common scale).

  The activity should:
  - Be an in-person token economy game with real stakes (course credits or snacks).
  - Have a hidden discontinuous cliff: accumulating one more suffering-unit in a bucket suddenly nullifies all pleasure-units in that bucket.
  - The group doesn't know the cutoff until they cross it.
  - They should discover the commensurability problem when they try to calculate net welfare and the math collapses.

  Brainstorming the tension:
  The tension arises when agents try to aggregate welfare by summing pleasure and subtracting suffering, assuming a common metric, but then encounter a discontinuity that breaks the aggregation. This forces them to confront that below the threshold, the units are commensurable, but above, they are not. The challenge is that the threshold is unknown and the discontinuity is abrupt.

  Activity Design: "The Welfare Trade-Off Game"

  **Goal:** Groups build a social welfare function by trading pleasure-units and suffering-units to maximize their collective welfare (which translates to rewards).

