  **Core Mechanic:**
  - Each group has a "welfare bucket" (a physical bucket or a tally on a board) that accumulates pleasure-units (P-units) and suffering-units (S-units).
  - They will make a series of trades (decisions) that add P-units and/or S-units to their bucket.
  - The hidden rule: There is a threshold T (say, 10 S-units). If at any point the S-units in the bucket reach or exceed T, then all P-units in that bucket are nullified (set to zero) and any future P-units are also immediately nullified (until the bucket is reset, but we may not reset in this game). However, S-units continue to accumulate.
  - Below T, welfare is calculated as: Net Welfare = P-units - S-units (or some other linear function, but for simplicity, we can use this).
  - Above T, welfare = - (total S-units) [since P-units are zero].

  But note: The group doesn't know about the threshold until they cross it. They start by being told that they will be trading P and S units and that their goal is to maximize net welfare (P - S). The discontinuity is revealed only when they trigger it.

