answer: |-
  Here's a concrete example illustrating functional overdetermination in teleosemantics, moving beyond standard misrepresentation to highlight a deeper challenge for naturalizing content:

  **The Case: Primate Lateral Vigilance Response (LVR)**

  *   **Mechanism:** A neural circuit in a primate species (e.g., baboons) that triggers a specific suite of physiological and behavioral responses upon detecting movement in the peripheral visual field, particularly to the sides or rear:
      *   Physiological: Pupil dilation, increased heart rate, adrenaline surge, head swivel.
      *   Behavioral: Brief freezing, rapid orientation towards the stimulus, heightened sensory focus.
  *   **Evolutionary History:**
      1.  **Predator Avoidance Function:** For millions of years, this LVR was crucial for detecting ambush predators (leopards, snakes). Individuals with a rapid, sensitive LVR were more likely to spot the predator early and escape, passing on the genes for this mechanism. Its *proper function* (selected effect) was **detecting environmental threats**.
      2.  **Social Hierarchy Function:** Concurrently, within the complex social group, the *same* LVR response became co-opted and refined. Detecting the rapid, often silent approach of a higher-ranking conspecific (e.g., an alpha male charging to assert dominance or discipline) was vital. Freezing/submitting immediately upon detecting the alpha's approach prevented costly fights and injuries. Individuals whose LVR was sensitive to subtle cues of dominant approach (posture, speed, direction) had better social outcomes and reproductive success. Its *proper function* became **detecting dominant conspecifics' approach**.
  *   **The Overdetermination:** Natural selection robustly shaped the LVR mechanism via *both* pathways. There isn't a clear historical "winner" or sequential dominance (predator first, then social). Both selective pressures operated simultaneously and intensely, shaping the mechanism's sensitivity, speed, and triggering thresholds. The mechanism has *two distinct, equally valid proper functions* grounded in its evolutionary history.

  **The Content Clash:**

  Now, consider the specific mental token produced by the LVR when it fires: call it the **"LATERAL-THREAT!" token**.

  *   **According to the Predator Avoidance Function:** The token's content is **<Predator Approaching from Flank>**. Its biological purpose (the reason it was selected) is to cause escape behaviors appropriate for environmental threats (climbing a tree, alarm calling, fleeing).
  *   **According to the Social Hierarchy Function:** The token's content is **<Dominant Conspecific Approaching Aggressively>**. Its biological purpose is to cause submissive/deference behaviors appropriate for social threats (freezing, crouching, presenting, averting gaze).

  **Why the Clash is Problematic (Beyond Indeterminacy):**

  1.  **Incompatible Truth Conditions:** The two assigned contents have fundamentally different truth-makers in the world:
      *   `<Predator Approaching>` is true iff a leopard/snake/etc. is approaching.
      *   `<Dominant Approaching Aggressively>` is true iff a high-ranking troop member is approaching with aggressive intent.
      These states of affairs are distinct and often mutually exclusive (a leopard isn't a dominant baboon). A token cannot simultaneously represent both with the same specificity.
  2.  **Incompatible Behavioral Prescriptions:** The "correct" response dictated by the content differs radically:
      *   Predator content prescribes **flight/fight against environment**.
      *   Dominant content prescribes **submission/deference within social structure**.
      Acting on the "wrong" prescription based on the token could be disastrous (submitting to a leopard, fleeing/challenging the alpha).
  3.  **The Pull-Apart & the Interpretive Layer:** Teleosemantics aims to fix content *solely* by the mechanism's evolutionary history (its proper function). Here, history delivers *two equally valid, but incompatible, proper functions*. Teleosemantics lacks the internal resources to privilege one function over the other as the "true" content-fixer for the token. The *same* physical token production process (the LVR firing) is equally explained by both selective histories.

  **The Consequence: Forced Interpretation Undermines Naturalization**

  This functional overdetermination creates a dilemma for the naturalist:

  *   **Option 1: Content is Ambiguous/Disjunctive:** Claim the token means something vague like `<Significant Negative Event Approaching Laterally>` or disjunctive `<Predator OR Dominant Approaching>`. But this violates teleosemantics' promise of *specific* content grounded in selection history. Selection shaped the mechanism for highly *specific* discriminations (leopard vs. antelope; alpha's charge vs. juvenile play). A disjunctive content ignores the specific historical paths and fails to explain the *specificity* of the mechanism's tuning and the *appropriateness* of distinct behaviors.
  *   **Option 2: Context Determines Content:** Argue that the *current context* (presence of predator cues vs. social cues) determines which function is "operative" and thus fixes the content. *This is the critical problem.*
      *   **Why it imports interpretation:** For the context to determine which evolutionary function fixes the token's content *now*, the system (or the theorist) must *interpret* the current sensory input *as* predator-like or dominant-like *before* the LVR token can be assigned its specific content. Teleosemantics was supposed to *explain* how content arises from non-semantic, natural facts (evolutionary history + mechanism). Relying on context to select the relevant function smuggles in a prior layer of *semantic interpretation* of that very context. What natural facts determine *which* historical function is relevant *now*? It seems to require something like a *representation* of the context *as* predator-relevant or social-relevant – creating a regress or presupposing the very kind of semantic content teleosemantics seeks to naturalize. The "context" isn't a brute physical fact; its relevance to function-selection is inherently interpretive.

  **The Core Problem for Naturalization:** Functional overdetermination shows that evolutionary history alone can be insufficient to pin down *specific* content for a mental token, even when misrepresentation isn't the issue. History provides *too much* – multiple valid selective paths leading to incompatible contents. Resolving this clash *without* invoking an interpretive layer that categorizes current stimuli and selects the relevant historical function seems impossible. But invoking such interpretation undermines teleosemantics' core ambition: to fully reduce mental content to non-semantic, non-intentional natural facts (mechanism + selection history). The need for this interpretive step reveals a gap in the naturalization project, suggesting that fixing determinate content might inherently require something beyond pure causal history, something more akin to the "interpretive stance" teleosemantics aimed to eliminate.
