  We are creating a vetting procedure for manuscripts that invoke Hacking's "looping effect". The procedure is a sequence of tests that a referee (or student) can run in the first hour of reading. The goal is to check for proper usage of the concept and to flag common misapplications.

  Key distinctions we must capture (as per the user's requirements):

  a) Interactive vs. indifferent kinds: The kind must be one that can be aware of and respond to the classification (human kinds, typically). If it's not, then looping cannot occur.

  b) Genuine feedback mechanism: We need to see a specified mechanism by which the classification leads to a response that then alters the classification or the classified. Not just downward causation (e.g., stigma causing harm) without a loop.

  c) Looping vs. generic social construction or historical contingency: Looping requires a feedback loop, not just that the category is constructed or changes over time.

  d) Change in the individuals vs. change in the classification: A full loop requires both, but Hacking sometimes emphasizes the change in the kind itself (the people) and the change in the classification. However, note that in the looping effect, the change in the classified individuals (or their behavior) leads to a change in the classification, and then the changed classification affects the individuals again, and so on. So we need at least one cycle.

  The procedure:

  We design a sequence of tests. At each step, we ask a question about the manuscript. Based on the answer, we either pass, fail (with a specific verdict), or hand off to referee judgment.

  Test 1: Is the kind interactive?
     Question: Does the manuscript explicitly identify the classified entities as human (or interactive) kinds, i.e., kinds that can be aware of and respond to how they are classified? 
     Pass: The manuscript clearly states that the classification is applied to human beings (or groups of humans) and that the classified individuals (or relevant actors) can become aware of the classification and react to it. Example: "The diagnosis of ADHD is applied to children, and these children (or their parents) may change their behavior in response to the diagnosis." 
     Fail: The kind is non-human (e.g., a chemical element, a star, a non-human animal) or the manuscript does not establish that the classified entities are capable of responding to the classification (e.g., classifying a rock as igneous). Example: "Classifying a new species of beetle leads to changes in conservation policy." (Here, the beetle does not respond to the classification, so it fails.)
     On failure: Stop with verdict: "The kind under discussion is not an interactive kind. The author should either reframe the argument without invoking the looping effect or provide a compelling case that the kind is interactive (if it is non-human but still interactive, e.g., some social animals). If the kind is not interactive, the looping effect does not apply."

  Test 2: Is there a causal mechanism from classification to a response?
     Question: Does the manuscript specify a mechanism by which the classification leads to a response by the classified individuals (or by institutions/experts acting on their behalf) that alters either (a) the behavior, self-understanding, or condition of the classified individuals, or (b) the classificatory scheme (criteria, practice, or definition)?
     Pass: The manuscript describes a specific pathway. Example: "When people are diagnosed with depression, they internalize the label and alter their behavior to conform to the diagnosis, which then affects their symptoms." OR "Patient advocacy groups, in response to the classification, lobby for changes in diagnostic criteria, leading to an expansion of the diagnosis."
     Fail: The manuscript only states that the classification causes harm (e.g., stigma leading to social isolation) or benefit without indicating how that response feeds back to alter the classification or the individuals in a way that could affect the classification. Example: "Labeling someone as having a mental disorder leads to stigma, which worsens their condition." (This is downward causation without a loop.)
     On failure: Downgrade: "The manuscript asserts a loop but does not specify a feedback mechanism. Treat the looping claim as a promissory note and evaluate the rest of the argument without it. Alternatively, the author should provide a mechanism to show how the response alters the classification or the individuals in a manner that feeds back."

  Test 3: Is there a feedback loop that changes the classificatory scheme or the kind in a way that affects future classification?
     Question: Does the manuscript show or argue that the response to the classification leads to a change in the classificatory scheme (e.g., criteria, diagnostic practice, expert understanding) or in the classified individuals (e.g., their behavior, self-conception, or condition) that then affects subsequent applications of the classification? (Note: we are looking for at least one full cycle of the loop.)
     Pass: The manuscript provides evidence or a clear argument that the initial classification leads to a response that then alters either the kind (the people) or the classification, and that this alteration then affects how the classification is applied in the future. Example: "The initial classification of multiple personality disorder led to increased media attention, which caused more people to present with symptoms that matched the media portrayal, which then led clinicians to revise the diagnostic criteria to account for these new presentations."
     Fail: The manuscript only shows that the classification causes a change in the individuals (e.g., stigma worsens their condition) but does not show how that change affects the classification. OR the manuscript only shows that the classification criteria changed due to external factors (e.g., lobbying) without showing how that change was a response to the way the classification was affecting the individuals. Example: "The diagnosis of autism expanded because of advocacy by parents." (If there is no link to how the initial classification of autism led to the advocacy and then the advocacy changed the criteria, which then changed the behavior of individuals, then it fails to show a loop. But note: if the advocacy was a response to the classification and then the changed criteria then altered the people being classified, that would be a loop. So we must check for the cycle.)
     On failure: Handoff to referee judgment. Why? Because the manuscript might have described a mechanism that is incomplete but could be fixed with minor revisions, or the referee might be able to infer a loop from the described changes even if the author did not explicitly state it. The referee must use discretion. However, if the manuscript only shows a one-way effect (either the effect on the individuals or a change in the criteria without a feedback link), then the verdict would be: "The manuscript describes a change in the classified individuals or the classificatory scheme but does not show a feedback loop. The author should either provide evidence of the loop (how the change in the individuals leads to a change in the scheme, or vice versa, and then back) or recast the argument without invoking the looping effect."

  Test 4: Distinguishing looping from generic social construction or historical contingency.
     Question: Does the manuscript explicitly link the feedback mechanism to the dynamic, interactive process that Hacking describes, and not merely to the fact that the category is socially constructed or that it changed over time due to external factors?
     Pass: The manuscript discusses the looping effect as a dynamic process of interaction between the classified and the classifiers (or the classification system) and contrasts it with static social construction or historical change without feedback. Example: "The looping effect here is not just that the diagnosis is socially constructed, but that the very use of the diagnosis by clinicians and patients leads to changes in the symptoms and the diagnostic criteria over time."
     Fail: The manuscript uses "looping effect" as a synonym for social construction or historical contingency without invoking a feedback loop. Example: "The diagnosis of hysteria is a looping effect because it was constructed in a particular historical context and then fell out of use." (This fails because it doesn't show a feedback loop, just historical change.)
     On failure: Downgrade: "The manuscript conflates the looping effect with social construction or historical contingency. The author should either provide evidence of a feedback loop or use more appropriate terminology (e.g., 'socially constructed' or 'historically contingent')."

  Note: We might combine some of these, but the user wants an ordered sequence.

  Order of tests:

  1. Test 1: Interactive kind? (If not, stop: looping doesn't apply.)
  2. Test 2: Causal mechanism? (If not, downgrade: promissory note.)
  3. Test 3: Feedback loop? (If not, handoff to referee to see if it's salvageable or if it's a one-way effect.)
  4. Test 4: Distinguishing from social construction? (This might be covered in Test 3, but we add it to be explicit.)

  But note that Test 4 is partly covered by the previous tests. We might run Test 4 as a final check for conflation.

  Alternatively, we can structure it as:

