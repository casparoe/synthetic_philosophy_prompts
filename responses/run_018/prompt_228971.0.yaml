  Step 2: Is there a mechanism for response? (If no, downgrade and stop the looping evaluation.)
  Step 3: Does the manuscript show a feedback loop (i.e., a cycle that alters either the kind or the classification and then feeds back)? (If no, handoff to referee to decide if it's a looping claim or not, because it might be a partial loop that the author can fix by adding one more step.)
