  Now, run the procedure on three hypothetical submissions:

  Submission 1: "Short-video platforms carrying first-person symptom accounts of attention deficit disorder have created a loop -- viewers reinterpret their own histories through the symptom lists, present to clinicians already scripted, clinicians anchor on the presentation, and diagnostic practice drifts toward the platform's picture."

  Run Test 1: Interactive kind? Yes, the classification of ADHD is applied to humans (viewers/patients) who can respond. Pass.

  Test 2: Mechanism? Yes: viewers see videos -> reinterpret their own histories -> present to clinicians in a scripted way -> clinicians anchor on that presentation -> diagnostic practice drifts. This is a mechanism. Pass.

  Test 3: Feedback loop? The drift in diagnostic practice (change in the classificatory scheme) then presumably leads to more people being diagnosed in this way, which might lead to more videos, etc. But the manuscript does not explicitly say that the changed diagnostic practice then affects future viewers (i.e., the next cycle). However, it says "diagnostic practice drifts toward the platform's picture", which then would affect future presentations? The author implies a loop by using the word "loop". We can infer that the drift will lead to more such presentations. But the manuscript does not explicitly state the feedback to the kind (the viewers) or the next cycle. However, the mechanism described includes the drift, which is a change in the classificatory practice. And that change will then be used in future classifications. So it is a loop. Pass.

  Test 4: Distinguishing from social construction? The paper is about a dynamic process of interaction between the platform, the viewers, and the clinicians. It is not just saying that ADHD is socially constructed. Pass.

  Verdict: Passes all tests. The looping effect is appropriately applied.

  Submission 2: "Classifying a condition as a mental disorder loops because the stigma of the label worsens the prognosis of those labeled."

