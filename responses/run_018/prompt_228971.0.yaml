answer: |-
  Below is a vetting procedure for manuscripts invoking Hacking's "looping effect," designed as an ordered sequence of tests. It addresses your core requirements: it is executable within an hour, requires no external empirical work, forces distinctions (a)–(d), and outputs clear verdicts (stop/downgrade/handoff). The procedure prioritizes false negatives over false positives to avoid endorsing misapplications, as per your concern about misuse.

  ---

  ### **Vetting Procedure for Looping Effect Claims**
  **Instructions**: Run tests in order. Stop or downgrade as indicated. If a test fails, do not proceed to the next test unless specified. Base judgments solely on the manuscript text.

  #### **Test 1: Interactive Kind Check**  
  **Question**: Does the manuscript explicitly establish that the classified entities are *interactive kinds* (i.e., capable of awareness and response to their classification), as opposed to indifferent kinds (e.g., inanimate objects, non-human biological taxa)?  
  - **Pass**: Manuscript states (or strongly implies) that the kind involves humans who can perceive and react to their classification (e.g., "Patients diagnosed with disorder X become aware of the label and alter their self-conception").  
  - **Fail**: Kind is non-interactive (e.g., "Classifying a new protein structure") or manuscript treats a human kind as passive (e.g., "Diagnoses are applied to patients" without noting agency).  
  - **On Failure**: **Stop with verdict**. "This is not a looping-effect claim; the kind is indifferent. Recommend the author redescribe it as [e.g., labeling effect/social construction] or justify its interactivity."  

  #### **Test 2: Feedback Mechanism Check**  
  **Question**: Does the manuscript specify a *causal mechanism* for how the classification triggers a response that alters either (i) the classified individuals/group, or (ii) the classificatory scheme (criteria/practice), creating potential for feedback?  
  - **Pass**: Mechanism details who responds (e.g., patients, clinicians, institutions), how (e.g., behavioral adaptation, lobbying, diagnostic drift), and what changes (e.g., symptoms, criteria). Example: "Clinicians’ use of diagnosis Y leads patients to adopt illness behaviors, which in turn pressures diagnostic manuals to broaden Y’s scope."  
  - **Fail**: Mechanism is absent, vague, or describes unidirectional effects (e.g., "Stigma causes suffering" without feedback; "Lobbying changed criteria" without linking to classified individuals).  
  - **On Failure**: **Downgrade**. "The loop is asserted but not shown; treat as a promissory note. Evaluate argument without looping rhetoric, or request mechanism specification."  

  #### **Test 3: Loop Closure Check**  
  **Question**: Does the manuscript show a *closed feedback loop* where the response to classification alters either (i) the classified individuals/group *in a way that affects future classification*, or (ii) the classificatory scheme *in a way that alters the classified individuals/group*?  
  - **Pass**: Manuscript traces at least one full cycle (e.g., "Classification → response → change in people → change in future classification" or "Classification → response → change in criteria → change in people"). Example: "Diagnosis Z leads to public awareness; aware individuals emulate Z’s symptoms; clinicians then revise Z to match new presentations."  
  - **Fail**: Only one side changes without affecting the other (e.g., "Stigma worsens symptoms" [no scheme change]; "Criteria expanded" [no individual change]; "Advocacy changed diagnosis" [no link to individual response]).  
  - **On Failure**: **Handoff to referee judgment**. *Why*: The loop may be implied but not explicit, or salvaged with minor revisions. The referee must assess if the described change *could* close the loop (e.g., criteria changes *likely* alter future patients) based on plausibility, but the procedure cannot infer gaps.  

  #### **Test 4: Hacking vs. Generic Construction Check**  
  **Question**: Does the manuscript distinguish looping from generic social construction/historical contingency by emphasizing *dynamic feedback* (not just cultural context or criteria revisions)?  
  - **Pass**: Manuscript explicitly frames changes as iterative, interactive, and arising from responses to classification (e.g., "Looping explains drift in diagnosis X, unlike static social construction").  
  - **Fail**: Uses "looping" as a synonym for social construction, harm from labeling, or historical change (e.g., "Category X is a looping effect because it was invented in the 1990s").  
  - **On Failure**: **Downgrade**. "The loop is conflated with social construction/contingency. Recommend rephrasing as [e.g., constructed/contingent] or adding feedback dynamics."  

  ---

  ### **Procedure Runs on Hypothetical Submissions**
  **Key**:  
  ✅ = Pass, ❌ = Fail, ⚠️ = Handoff/Downgrade  

  #### **Submission 1**: *Short-video platforms and ADHD*  
  - **Test 1 (Interactive Kind)**: ✅  
    - Work: ADHD classification targets humans; manuscript notes viewers "reinterpret their own histories."  
  - **Test 2 (Feedback Mechanism)**: ✅  
    - Work: Specifies mechanism: videos → viewer self-reinterpretation → scripted clinical presentations → clinician anchoring → diagnostic drift.  
  - **Test 3 (Loop Closure)**: ✅  
    - Work: Diagnostic drift alters classificatory scheme, which feeds back by shaping future viewers' presentations (implied cycle: drift → more scripted accounts → further drift).  
  - **Test 4 (Hacking vs. Construction)**: ✅  
    - Work: Focuses on dynamic interaction (platforms → individuals → clinicians → practice).  
  - **Verdict**: **Pass**. Looping claim is valid.  

  #### **Submission 2**: *Stigma worsens prognosis*  
  - **Test 1 (Interactive Kind)**: ✅  
    - Work: Mental disorder classification applied to humans.  
  - **Test 2 (Feedback Mechanism)**: ❌  
    - Work: Only describes unidirectional effect (stigma → worse prognosis). No mechanism for feedback to classification or individuals affecting future classification.  
  - **On Failure**: **Downgrade**. "Treat looping as promissory note; argument is better framed as labeling harm."  
  - **Verdict**: **Fails at Test 2**.  

  #### **Submission 3**: *Advocacy-driven criteria expansion*  
  - **Test 1 (Interactive Kind)**: ✅  
    - Work: Diagnosis applied to humans; advocacy group represents classified individuals.  
  - **Test 2 (Feedback Mechanism)**: ✅  
    - Work: Specifies mechanism: classification → lobbying by patients → committee decisions → criteria expansion.  
  - **Test 3 (Loop Closure)**: ❌  
    - Work: Criteria expansion changes classificatory scheme, but no link to how this alters the classified individuals (e.g., new symptoms, advocacy responses) or feeds back (e.g., expanded criteria → new patient behaviors → further advocacy). Manuscript only shows one half-loop (scheme change).  
  - **On Failure**: **Handoff to referee judgment**. *Why*: A referee might infer that expanded criteria alter future patients (e.g., more diagnoses → larger advocacy group), but the manuscript does not state this. The procedure cannot assume closure.  
  - **Test 4 (Hacking vs. Construction)**: ⚠️  
    - Work: Not run (Test 3 failed), but if continued: Manuscript risks conflating looping with interest-driven revision (lobbying ≠ dynamic feedback).  
  - **Verdict**: **Fails at Test 3; handoff**.  
    - **Discomfort Analysis**: You may instinctively accept this as looping (it shows agency and scheme change). The discomfort arises because advocacy *could* close the loop, but the procedure requires explicit linkage. This highlights the **procedure’s rigor, not a defect**. Your instinct reflects field-specific leniency toward plausible loops, but the procedure minimizes false positives by demanding specificity.  

  ---

  ### **Sacrifices and Limitations**  
  **Sacrifices for Runnability** (with expected errors):  
  1. **Temporal depth ignored**: Requires only one loop cycle, not historical persistence. May generate *false passes* for isolated incidents (e.g., one advocacy win) mislabeled as "looping."  
  2. **Implicit interactivity**: Only checks explicit human focus. May cause *false fails* for non-human interactive kinds (e.g., animal groups) if the manuscript doesn’t argue for their agency.  
  3. **Mechanism simplicity**: Accepts verbal descriptions without evidence. May cause *false passes* for speculative mechanisms.  
  4. **Hacking’s nuance**: Downplays Hacking’s "making up people" emphasis. May cause *false fails* for papers focusing on identity formation without explicit scheme change.  

  **What the Procedure Cannot Do**:  
  1. **Judge plausibility or evidence**: Hands off whenever empirical gaps exist (e.g., Test 3 failures). You must assess if mechanisms are credible.  
  2. **Handle implicit loops**: Manuscripts implying feedback without stating it will fail (e.g., Submission 3). You must intervene.  
  3. **Resolve Hacking exegesis**: Cannot arbitrate interpretive disputes (e.g., whether criteria changes alone suffice for looping). You must decide based on scholarship.  
  4. **Systematic mishandling**:  
     - Will **false-pass** papers with vague but verbose mechanisms (e.g., "complex sociocultural feedback" without specifics).  
     - Will **false-fail** papers on non-diagnostic human kinds (e.g., gender categories) if interactivity isn’t foregrounded.  
     - Will **struggle with multi-actor loops** (e.g., institutions + patients) if roles aren’t clearly assigned.  

  The procedure flags common misuses early but cannot replace your judgment on philosophically nuanced cases. Use it as a sieve, not a verdict.
