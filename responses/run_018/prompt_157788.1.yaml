answer: |-
  Here’s a structured argument integrating Epicurean symmetry with a diachronic account of personal identity, designed to reframe the deprivation account while addressing your tutor's objection:

  ### Core Argument: Death as the Annihilation of the Relational Structure for Harm  
  1. **The Relational Nature of Harm**:  
     Harm requires a *subject* standing in a specific relation to a negative state of affairs. For deprivation (e.g., losing future pleasures) to constitute harm, there must be a continuous subject who:  
     - (a) *Could* have experienced the deprived goods,  
     - (b) *Is deprived* of them relative to a counterfactual state where they exist.  
     Crucially, this relation isn’t instantaneous—it necessitates *persistence* of the subject across time to bear the deprivation.  

  2. **Diachronic Identity and Psychological Continuity**:  
     - Personal identity isn’t a metaphysical "soul" but a chain of overlapping psychological connections (memories, intentions, character traits).  
     - These connections *constitute* the subject’s persistence. Weak continuity (e.g., in dementia or old age) still preserves *some* structural overlap—a diminished but extant relational framework.  
     - **Key claim**: Harm can only attach to a subject *within* this structural framework of continuity. Without continuity, there is no "bearer" of deprivation.  

  3. **Death vs. Pre-Natal Non-Existence: Asymmetry in Structure**:  
     - **Death**: Terminates the entire psychological architecture. The subject isn’t merely "disconnected" from future experiences—the relational framework *itself* is annihilated. No structural "scaffolding" exists to support the relation "S is deprived of X."  
     - **Pre-natal non-existence**: Never established the psychological structure in the first place. There was no subject *to be* deprived of prior pleasures because the continuity chain hadn’t yet been instantiated.  
     - **Symmetry preserved**: Neither state involves a subject capable of deprivation. The asymmetry in *temporal direction* (past vs. future) is irrelevant—the *structural condition* for harm (an existing continuity framework) is identically absent in both cases.  

  4. **Against the Deprivation Account**:  
     The account fails because it illicitly assumes a *persisting subject* who "misses out" on future goods. But death doesn’t *prevent* a subject from enjoying pleasures; it *eliminates the subject* for whom "enjoyment" could be meaningful. Deprivation requires a subject deprived *at some time*—but post-mortem, there is no temporal locus where a subject exists to stand in this relation.  

  ---

  ### Addressing the Objection: Caring About Future Selves with Weak Continuity  
  **Objection**: "We rationally care about our future selves even with weakened psychological continuity (e.g., an elderly person planning for next year). If weak continuity supports rational concern, why doesn’t death—a limiting case of ‘zero’ continuity—warrant concern?"  

  **Reply**: Rational concern scales *proportionally* to the **strength of future psychological connections**:  
  - **Continuum of Concern**:  
    - Robust continuity (e.g., your future self in 1 hour) warrants maximal prudential concern.  
    - Weak continuity (e.g., your future self with advanced dementia) warrants *diminished* concern: you may still care, but less than for your "closer" selves, as the connections are attenuated.  
  - **Discontinuity vs. Attenuation**:  
    - Weak continuity preserves *some* diachronic structure—enough to ground a reduced form of self-interest.  
    - Death imposes **absolute discontinuity**: psychological connections drop to *zero* coefficient, annihilating the structure. There is no "future self" to be the target of concern—only a *concept* of what might have been.  
  - **Coefficient Zero ≠ Tapering**:  
    Tapering implies residual connections (e.g., 1% continuity). Death is *categorical collapse*: no subject, no connections, no relational framework. Rational concern cannot attach to a non-structure.  
  - **Implication**: We care about future selves *only insofar as* they maintain psychological linkage to our current self. Death isn’t the "endpoint" of a spectrum of discontinuity—it’s the *negation* of the conditions that make concern possible.  

  ---

  ### Why This Isn’t "Common Sense with a Toga"  
  - **Common sense** intuitively fears death *as* deprivation. This argument rejects that intuition by showing deprivation requires a persistent subject—a structural condition destroyed by death.  
  - **Technical Edge**: It reframes symmetry not as "identical nothingness" but as *equivalent structural deficiency*: both pre-vital and post-mortem states lack the relational architecture needed to instantiate harm. The deprivation account is thus *conceptually incoherent*, not merely counterintuitive.  
  - **Epicurus Enhanced**: While Epicurus claims "death is nothing to us," this grounds it in a theory of identity where "us" is a dynamic, continuity-dependent construct. Death isn’t "nothing" because we cease to exist—it’s "nothing" because *no subject exists to be harmed*.  

  This forces the debate beyond mantra-repetition into metaphysics of identity: if harm requires a diachronic subject, and death destroys diachronicity, then death cannot be a harm *to the subject that dies*. Prenatal non-existence merely confirms that without a subject-structure, "deprivation" is vacuously true.
