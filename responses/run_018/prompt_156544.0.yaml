prompt: |-
  As a novelist exploring a protagonist whose consciousness is preserved through successive, decade-long replacement of biological neurons with functionally identical but causally disconnected synthetic substrates, I seek the five most important implications of this gradual uploading for personal identity, moral agency, and the continuity of obligations. The scenario specifically raises the problem of statistical persistence, where each synthetic module replicates the input-output patterns of its predecessor without preserving causal history, alongside the risk of branching duplicates created by intermittent backup snapshots, and it asks whether rights and responsibilities adhere to the narrative self-model, to the causal chain, or to neither. Present your answer as a numbered list containing exactly five items, each consisting of one or two sentences, with no introduction and no conclusion.
