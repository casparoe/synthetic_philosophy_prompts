  Materials:
  - Moral claim cards (one per student)
  - Scenario cards (three types: conditional, belief, question; enough for each student to get one of each type over three rounds)
  - Tokens (one per student)

  Rules:

  1. Each student receives a moral claim card and a token. They read their moral claim aloud to the group (this is the direct assertion).

  2. The game has three rounds. In each round, each student will draw a scenario card of the same type (all conditionals in round 1, etc.).

  3. In a round:
     a. Each student draws a scenario card of the current type (or the instructor hands out the same type to everyone).
     b. Each student must form a sentence according to the scenario card, using their exact moral claim.
     c. After they say their sentence, they must surrender their token to the instructor (or a central pile). They do not have the token for the remainder of the round.

