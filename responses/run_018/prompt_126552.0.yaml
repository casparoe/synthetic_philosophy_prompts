  - What did the token represent? (Expression of the attitude, not the attitude itself.)
  - Why did you have to surrender the token in the conditional context? (Because you weren't expressing the attitude, only considering it hypothetically.)
  - Why is this a problem for expressivism? (Because in a modus ponens argument: "If stealing is wrong, then it's punishable. Stealing is wrong. Therefore, it's punishable." The expressivist must explain how the second premise (a direct assertion) expresses disapproval, but the first premise uses the same sentence without expressing disapproval. And then the inference is valid. The token surrender illustrates that the meaning (expression) is missing in the first premise, so how can the argument work?)

  Honest Note: The token mechanics cannot reproduce the non-cognitive content surviving inside unasserted contexts because the token represents the expression (an act) which by definition doesn't happen in unasserted contexts. But the expressivist needs the meaning (which is the attitude) to be present without being expressed. The token doesn't represent the attitude itself, only its expression.

  Predictable Breakage:

  1. Students might refuse to surrender the token, arguing that they still hold the commitment. Solution: Clarify at the start that the token represents the act of expressing the attitude, not the attitude itself. In embedded contexts, that act does not occur.

  2. Students might struggle to form the embedded sentences. Solution: Provide examples on the scenario cards.

  Example Scenario Cards:

  Conditional Card: 
  "Form a conditional sentence using your moral claim. For example, if your claim is 'Stealing is wrong', you might say: 'If stealing is wrong, then we should not steal.' Then, surrender your token."

  Belief Card:
  "Form a belief report using your moral claim. For example: 'Alice believes that stealing is wrong.' Then, surrender your token."

  Question Card:
  "Form a question using your moral claim. For example: 'Is stealing wrong?' Then, surrender your token."

  3. The game might feel too abstract. Solution: Use engaging moral claims and encourage creativity in forming sentences.

  4. Time might run short. We have 8 students and three rounds. Each student takes about 1 minute to form and say their sentence. So 8 students * 3 rounds * 1 minute = 24 minutes. Plus setup and debrief, it should fit in 30-40 minutes. Then we have 50 minutes for debrief and discussion.

  We can do the debrief in two parts: after the game, then open discussion.

  This should work.
answer: |-
  ### Frege-Geach Embedding Game: "Commitment in Context"

  This game is designed to make the Frege-Gech embedding problem viscerally tangible by forcing students to confront how their "commitment" to a moral claim behaves when embedded in non-assertoric contexts (conditionals, belief reports, questions). The core tension: expressivism says moral claims express non-cognitive attitudes (e.g., disapproval), but embedding them in complex sentences doesn't express those attitudes—yet we still reason with them logically. The game uses physical tokens to represent the "expression" of commitment, not the attitude itself.

  **Learning Objective**: Students will experience the disconnect between holding a moral attitude and being unable to "use" it in embedded contexts, highlighting why expressivism struggles to explain logical consistency.

  ---

  ### **Materials Needed**
  - **Commitment Tokens**: One distinct token per student (e.g., colored poker chips, sticky notes, or small cards). Tokens represent the *act of expressing* their moral attitude.
  - **Moral Claim Cards**: 8 cards, each with a simple moral claim (e.g., "Stealing is wrong," "Charity is good," "Lying is immoral").  
  - **Embedding Scenario Cards**: Three decks (shuffled separately), each with 8 identical cards for one embedding type:
    - **Conditional Deck**: "Embed your moral claim in a conditional: *If [your claim], then...*"  
      (e.g., "If stealing is wrong, then thieves should be punished.")
    - **Belief Report Deck**: "Embed your moral claim in a belief report: *[Name] believes that [your claim].*"  
      (e.g., "Sam believes that stealing is wrong.")
    - **Question Deck**: "Embed your moral claim in a question: *Is it true that [your claim]?*"  
      (e.g., "Is it true that stealing is wrong?")
  - **Timer**: For enforcing turn limits.
  - **Scoreboard** (optional): To track points for token retention.

  ---

  ### **Game Rules**
  **Players**: 8 students + you as facilitator/referee.  
  **Duration**: 30–40 minutes (leaving 50–60 minutes for debrief/discussion).  
  **Goal**: Retain your token by directly asserting your moral claim. Lose it when embedding forces non-assertoric use.  
  **Stakes**: Losing a token means sitting out the next round (no participation) OR losing 1 point (if scoring). Tokens are returned at the start of each new round.  

  #### **Setup**
  1. Give each student one **moral claim card** and one **commitment token**.  
  2. Students read their claim aloud (e.g., "Stealing is wrong!")—this is a direct assertion. They place their token visibly in front of them (they "hold" it).  
  3. Explain:  
     - "This token represents your *expression* of a moral attitude (e.g., disapproval of stealing). It does NOT represent whether you privately hold that attitude—you might still believe it even without the token."  
     - "When you embed your claim in a complex sentence, you may need to surrender the token because you’re no longer *expressing* the attitude."  

  #### **Round Structure (3 rounds total, one per embedding type)**
  1. **Draw Scenario Cards**:  
     - Round 1: All draw from the **Conditional Deck**.  
     - Round 2: All draw from the **Belief Report Deck**.  
     - Round 3: All draw from the **Question Deck**.  
     *Why same deck per round? Ensures all students grapple with the same embedding type simultaneously, easing debrief.*  

  2. **Take Turns (1 minute per student)**:  
     - Each student reads their scenario card aloud.  
     - They *must* create a sentence using their **exact moral claim** as embedded.  
       - Example: Claim = "Stealing is wrong"; Conditional = "If stealing is wrong, then we need security cameras."  
     - After speaking, the **facilitator judges** if the embedding was valid (correct logical form). If invalid, they redo it.  

  3. **Token Surrender Rule**:  
     - After a valid embedding, the student **surrenders their token** to the facilitator.  
     - **Consequence**: They lose 1 point OR sit out the next embedding round (their choice).  
     - **Exception**: If a student *directly re-asserts* their claim after embedding (e.g., "Sam believes stealing is wrong—*and I agree!*"), they keep their token. *But this is rare and discouraged—it defeats the point of embedding.*  

  4. **Reset for Next Round**:  
     - Tokens are returned to all students at the start of each new round.  
     - Students who sat out return to play.  

  #### **End of Game**  
  - Tally points (if scoring) or acknowledge students who retained tokens most often.  
  - No "winner"—this is a tension simulator, not a competition!  

  ---

  ### **Debrief (20–30 minutes)**  
  Map game mechanics to the Frege-Geach problem. Use the whiteboard to outline:  

  1. **Token as Expression**:  
     - "The token represented the *act of expressing* a non-cognitive attitude (e.g., booing stealing). When you directly asserted your claim, you expressed this—so you kept the token."  

  2. **Embedding Rounds as Logical Forms**:  
     - **Conditional Round**:  
       - Logical Form: *If P, then Q* (e.g., "If stealing is wrong, then...").  
       - Problem: You surrendered the token because conditionals don’t assert P—they’re hypothetical. Expressivism struggles: if "stealing is wrong" only expresses disapproval when asserted, how does it contribute meaning here?  
     - **Belief Report Round**:  
       - Logical Form: *Agent believes that P*.  
       - Problem: You surrendered the token because reporting a belief isn’t expressing your own attitude toward P. But in logic, "Sam believes stealing is wrong" relies on the same meaning of P.  
     - **Question Round**:  
       - Logical Form: *Is it true that P?*  
       - Problem: Questions don’t assert P, so no attitude is expressed—token lost. Yet we understand the question because P has stable meaning.  

  3. **The "Honest Note" (Key Limitation)**:  
     - "The token mechanics literally cannot reproduce how *non-cognitive content survives inside unasserted contexts*. In the game, surrendering the token meant the attitude wasn’t expressed—but in reality, you still *held* the attitude privately (e.g., you still disapproved of stealing). Expressivism’s challenge is explaining how this unexpressed attitude can still provide logical 'fuel' for embeddings. The token represented the *expression*, not the underlying attitude—so we couldn’t simulate the attitude persisting inertly in embeddings. This gap is why expressivists need 'quasi-realist' moves like higher-order attitudes or propositional proxies."  

  4. **Discussion Prompts**:  
     - "How did it feel to surrender your token? Did it match your intuition that you still 'believed' the claim?"  
     - "Why might this be a problem for moral arguments (e.g., modus ponens: 'If stealing is wrong, don’t do it. Stealing is wrong. So don’t do it.')?"  
     - "Can expressivism 'save' the token? How?" (Tease solutions like Blackburn’s projectivism or Gibbard’s norm-expressivism.)  

  ---

  ### **Predictable Breakdowns & Fixes**  
  1. **Students Refuse to Surrender Tokens**:  
     - **Why**: They’ll argue, "But I still believe this!" (confusing token=attitude with token=expression).  
     - **Fix**: Emphasize during setup: "The token represents *expression*, not belief. Embedding suspends expression—like how saying 'If I win the lottery...' doesn’t mean you’re winning it now." Enforce surrender strictly.  

  2. **Poor Embedding Examples**:  
     - **Why**: Students might say, "If charity is good, then I’ll donate!" (keeping token since they’re indirectly expressing approval).  
     - **Fix**: Require embeddings to be "neutral" (e.g., "If charity is good, taxes should fund it"). Intervene if they sneak in assertion.  

  3. **Confusion Over Belief Reports**:  
     - **Why**: "Sam believes stealing is wrong" might feel like agreement (so they keep the token).  
     - **Fix**: Rule: "Unless you explicitly add 'and I agree,' belief reports don’t express your attitude."  

  4. **Time Crunch**:  
     - **Why**: Debates over valid embeddings or token surrender.  
     - **Fix**: Use a timer (1 min/turn). Prep clear examples in advance.  

  5. **Sitting Out Feels Punitive**:  
     - **Why**: Loss of engagement.  
     - **Fix**: Use points instead of sitting out, or let sitting-out students act as "logic police" to stay involved.  

  ---

  **Why This Works**: The physical act of surrendering the token mirrors expressivism’s "attitude expression gap" in embeddings. By feeling frustrated when they lose their token despite holding the belief, students viscerally grasp why Geach called this a "devastating" problem. It transforms an abstract puzzle into a lived tension—setting up your next seminar on quasi-realism perfectly!
