  Similarly for belief report: "I believe that [moral claim]" or "Alice believes that [moral claim]". They surrender the token.

  For question: "Is it true that [moral claim]?" They surrender the token.

  But note: if the student says "I believe that stealing is wrong", they are expressing their own belief. In expressivism, that might be understood as expressing a higher-order attitude? But the original moral claim was about stealing, not about belief. We are focusing on the embedded moral sentence. The expressivist problem is that the embedded sentence "stealing is wrong" is not being used to express disapproval of stealing. So the token (which represents expressing disapproval of stealing) must be surrendered.

  Stakes:

  - When they surrender the token, they lose a point (if we are scoring) or they have to sit out the next round? But we are doing rounds by type, so if we do three rounds, sitting out a round might not be ideal.

  Alternatively, we can have a point system:

  - At the start, each student has 3 points (or 0? and they get a point for holding the token?).

  We can say:

  - Each student starts with 0 points.
  - When they make a direct assertion (at the start) they get 1 point and the token.
  - Then, in each embedding round, if they successfully form the embedded sentence, they get 1 point (for participating) but they must surrender the token (and that doesn't lose a point, it just means they don't have the token for the next part?).

  But the token surrender is the key. We want them to feel the loss of the token (the expression) when they embed.

  We can have a rule that they must have the token to score points? So:

  - The token is required to score points in the game.
  - At the start, they have the token and 0 points.
  - Then, we have an initial scoring round: they can score a point by using their moral claim in a direct assertion (they do this at the start, so they get 1 point and keep the token).
  - Then, we have the embedding rounds. In each embedding round, they must form the embedded sentence. After they do so, they must surrender the token. Then, they cannot score in the next scoring opportunity? But we are not having more scoring opportunities.

