  - Question: When the student asks, "Is stealing wrong?" they are not asserting that stealing is wrong (nor expressing disapproval). So they surrender the token.

  But note: in a question, they might be inviting others to express their attitudes, but the student themselves is not expressing. So token surrendered.

  However, what about when the student is required to respond to the question? The scenario card for a question might say: "Ask the group: Is it true that [your moral claim]?" Then the student asks, and then the group members (who are not the one asking) can answer? But we are focusing on the student who draws the card. They are required to ask the question, so they are not asserting.

