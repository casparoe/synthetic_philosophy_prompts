prompt: |-
  I run a grad seminar on metaethics — about 8 people, 90 minutes. We just covered basic expressivism, but the Frege-Geach embedding problem still lands like a logic puzzle instead of a real tension. Design an in-class game that makes them feel the problem physically: each student starts with a 'commitment token' for one moral claim, then draws scenario cards that force them to embed that exact sentence in a conditional, a belief report, and a direct question. The rules should make it obvious that they still hold the token in some contexts but must surrender it in others, with small stakes like losing a point or sitting out one round. Include turn rules, a debrief that maps each embedding round onto the logical form, and an honest note on which part — probly the non-cognitive content surviving inside unasserted contexts — the token mechanics literally cant reproduce. Also tell me what will predictably break the first time I run it, like people refusing to surrender thier token.
reasoning: |-
  We are designing an in-class game to illustrate the Frege-Geach embedding problem for expressivism. The core idea is that expressivism struggles to explain how moral sentences retain their meaning and function when embedded in complex sentences (like conditionals, belief reports, or questions) because expressivism initially explains moral claims as expressions of non-cognitive attitudes (like approval or disapproval) that are typically only expressed in direct assertions.

  Game Structure:
  - Each student starts with a 'commitment token' representing their endorsement of a moral claim (e.g., "Stealing is wrong").
  - We have scenario cards that present contexts requiring embedding the moral claim in different ways: conditionals, belief reports, and questions.
  - The rules will require students to sometimes surrender their token (lose a point or sit out a round) when they cannot consistently hold their commitment in the embedded context, and sometimes they keep it.

  Setup:
  - Prepare a set of moral claims on index cards (one per student). Examples: "Stealing is wrong", "Helping others is good", "Cheating is bad", "Lying is wrong".
  - Prepare scenario cards for each embedding type. Each scenario card will describe a situation that forces the student to use their moral claim in an embedded context.
    - Conditional: e.g., "If [your moral claim], then what? (You must form a conditional using your moral claim as the antecedent or consequent)."
    - Belief report: e.g., "Alice believes that [your moral claim]. Do you agree with Alice?"
    - Question: e.g., "Ask the group: Is it true that [your moral claim]?"

  Rules:
  1. Each student gets one moral claim and one commitment token (a physical token like a poker chip or a colored card).
  2. The game proceeds in rounds. In each round, a student draws a scenario card and must respond according to the card.
  3. The student must perform the linguistic act required by the scenario card using their exact moral claim.
  4. The group then discusses whether the student's response is consistent with holding the commitment token. The instructor (or a designated rule-enforcer) makes the final call.

  Token Surrender Conditions (these are the key teaching moments):
  - Direct Assertion: If the scenario requires a direct assertion (like in the initial state) the student keeps the token and even gets a point? (But note: we start with the token, so we don't need to give a point for that. We can just say they keep it.)
  - Conditional (in antecedent): If the student uses their moral claim in the antecedent of a conditional (e.g., "If stealing is wrong, then we shouldn't do it"), they must surrender their token. Why? Because in expressivism, when you say "If stealing is wrong..." you are not expressing disapproval of stealing; you are considering a hypothetical. So the attitude isn't expressed. Thus, the commitment token (which represents the attitude) must be surrendered.
