  - In each embedding round, they surrender the token and then at the end of the round, they get it back? But that doesn't show the problem because they get it back. The problem is that during the embedded use, the meaning (token) is missing.

  We want to show that the embedded use leaves the sentence without the meaning (token). So when they surrender the token, they don't get it back until they re-assert. But we are not having them re-assert.

  So let me restructure:

  1. Each student starts by directly asserting their moral claim and receiving a token (they are in the "expressing" state).
  2. Then, each student takes a turn drawing a scenario card (which will be one of the three embedding types). They must then use their moral claim in that embedded context.
  3. After they do so, they must surrender the token (because they are no longer expressing the attitude).
  4. Then, we move to the next student. The student who surrendered the token does not have it until they re-assert. But we don't have a mechanism for re-asserting.

  We can add a rule: after every two embedding rounds, there is an "assertion round" where anyone without a token can re-assert their moral claim to get the token back. But that might distract.

  Alternatively, we can have the tokens circulate? But that's not the point.

  We can have a very short game: one round per student. Each student draws one scenario card (which might be direct assertion, conditional, belief, or question). But we want to force them to do an embedding.

  I think the best is to have three rounds for each embedding type, and after each embedding, they surrender the token. Then, at the end of the round, they get the token back? But that doesn't show a lasting loss.

  But the point is to feel the loss of the token (the meaning) during the embedded use. So we can have them surrender the token for the rest of that round? And then at the start of the next round, they get it back? But then the loss is temporary.

  We can explain in the debrief that the token represents the expression of the attitude. When they embed, they are not expressing, so they lose the token. But then, when they are done with the embedded context, they can express again. However, the problem is that during the embedded context, the sentence is still meaningful and functions logically, but without the expression (token). So the token loss illustrates that the expression is missing.

  Debrief:

