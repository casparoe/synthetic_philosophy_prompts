  We need to represent the expressivist idea: the meaning of the moral sentence is the expression of the attitude. So when the sentence is embedded, the attitude is not expressed, so the meaning isn't present? But we know that the meaning must be the same for the sentence to function in logic.

  Therefore, the token should represent the expression of the attitude. So when the student expresses the attitude (by direct assertion) they get to hold the token. When they use the sentence in a context that does not express the attitude (any embedding) they must surrender the token.

