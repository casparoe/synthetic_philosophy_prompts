  For the residue report, clean fits include falsifiability mapping to NHST and predictive failure. Partial fits involve Popper's bold conjectures clashing with how incremental science actually works. The complete misfits are Popper's rejection of induction and his all-or-nothing falsification - these don't match how science handles messy data through statistical inference.

