answer: |-
  Here are five counterarguments sorted by decisiveness:

  1.  **Rivalrous domains exist:** Ideas can be rivalrous in contexts like trade secrets or military strategy, where an idea's value depends on exclusive access, and others using it diminishes control—paralleling physical scarcity.  
  2.  **Labor-mixing analogies hold:** Just as Locke's labor mixing justifies owning land (itself non-created), developing an original idea mixes labor with the abstract potential of that idea-type in the conceptual commons, creating ownership.  
  3.  **Intuitive ownership cases:** We intuitively recognize ownership in novel, specific ideas like unique plot twists or inventions; denying this feels like theft, suggesting property concepts map naturally to idea-types in core instances.  
  4.  **Redefinition unfalsifiability:** Your position may be insulated by defining "property" solely through rivalrous physical tokens, making it tautologically true but ignoring coherent property frameworks for non-rivalrous abstract objects like debts or shares.  
  5.  **Abstract objects as property:** Mathematical proofs or logical theorems, though non-rivalrous and discovered, are treated as owned discoveries (e.g., naming rights, priority claims), demonstrating coherent property relations for pure idea-types.
