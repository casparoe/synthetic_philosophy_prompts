answer: |-
  Your argument for "normative framing asymmetry" (NFA) as a distinct condition invalidating consent is sophisticated and tackles a crucial gap in consent theory, particularly in institutional settings. Let's address your three queries systematically:

  ### (1) Distinctness from Deception (Omission/Emphasis)
  NFA **is genuinely distinct** from deception by omission or misleading emphasis, though the boundary requires careful demarcation. Here's why and where nuances lie:

  *   **Core Distinction:** Deception (whether by false statement, omission, or selective emphasis) **induces a false belief about a material fact** (e.g., risk level, nature of the procedure, identity of the actor). NFA, as you define it, operates *even when all material facts are accurately disclosed*. The failure isn't about believing something untrue *about the world*, but about having one's practical reasoning **channeled through an alien evaluative lens**.
  *   **The Mechanism:** Deception corrupts the *informational substrate* of decision-making. NFA corrupts the *interpretive framework* applied to that information. It's about the "why it matters" and "how to weigh it," not the "what it is."
  *   **The "No False Belief" Test:** Your clinical trial example is apt. The participant may *accurately* believe: "This is Phase I," "There's a 20% chance of severe side effects," "It's research." Yet, framing it *exclusively* as "potential breakthrough treatment" or "your best hope" leverages therapeutic hope as the dominant evaluative category, overshadowing the participant's own values (e.g., altruism, risk aversion unrelated to personal therapy, skepticism about research benefits). They haven't been lied to *about the facts*, but their agency in *assigning meaning and weight* to those facts has been usurped.
  *   **Where It Touches Deception:** NFA *can* facilitate *self*-deception or involve deception if:
      *   The consenter is misled about *the seeker's interpretive framework or purpose* (e.g., believing the doctor *solely* wears a therapeutic hat when recruiting for research – this *is* deception by omission about role/interest).
      *   Framing actively obscures readily available counter-framings that a reasonable person would consider material to their evaluation. However, NFA's core case holds even when the seeker's framing is *one* valid perspective, if it's presented as the *only* or *definitive* lens, suppressing the consenter's authority to apply their own.
  *   **Conclusion on Distinctness:** NFA is conceptually distinct. Its core failure is the *usurpation of the consenter's normative authority* over meaning-making, not the provision of false information. It targets the structure of practical reasoning itself.

  ### (2) Dependence on an Implausibly Thick Conception of Autonomy?
  Your claim **does rely on a thicker conception of autonomy**, but **it need not be implausible or overbroad** if carefully scoped. Here's the defense and qualification:

  *   **The Thickness:** You move beyond "procedural" autonomy (adequate info + non-coercion + competence) towards a more "relational" or "substantive" view, emphasizing the *authority to define the meaning and significance* of one's actions within the consent interaction. This *is* thicker than the standard account.
  *   **Avoiding Overbreadth: Key Qualifications:**
      *   **Context Matters:** The weight of NFA is strongest in **high-stakes, asymmetric, and institutional contexts** (healthcare, research, complex contracts) where power imbalances are inherent, standardized language is prevalent, and consequences are significant. It's less plausible to demand perfect framing symmetry in mundane transactions (e.g., buying coffee).
      *   **"Does Not Actually Share" is Crucial:** The invalidation hinges on the consenter *not sharing* the dominant evaluative frame *and* this frame being imposed in a way that *undermines their ability to apply their own*. Autonomy doesn't require others to magically intuit our unique frameworks, but it *does* require them not to actively impose their framework in a way that suppresses the consenter's. A consenter *can* freely adopt the seeker's frame if it resonates – the failure is the *asymmetrical control* preventing alternative framing.
      *   **Reasonable Availability of Alternative Frames:** The argument gains force when counter-framings are readily available and materially different (e.g., research vs. therapy; contractual obligation vs. collaborative partnership; financial cost vs. investment). It weakens if only one reasonable framing exists.
      *   **Vulnerability & Epistemic Justice:** NFA often exploits vulnerabilities (hope, trust, institutional reliance) and relates to epistemic injustice – dismissing the consenter's perspective as irrelevant. Thicker autonomy here protects against these specific harms prevalent in bureaucratic settings.
  *   **Conclusion on Autonomy:** While thicker, this conception is plausible and necessary to capture a genuine autonomy failure in contexts where power and framing control reside firmly with one party. It targets a specific pathology of institutional consent processes without necessarily invalidating vast swathes of ordinary consent if contextualized and qualified as above.

  ### (3) Concrete Institutional Remedies Beyond More Disclosure
  Moving beyond "information dumping" is essential. Here are concrete remedies addressing NFA's core issue (usurped normative authority):

  1.  **Mandatory Multi-Perspective Framing Statements:** Instead of just listing facts, require standardized language explicitly stating:
      *   **The Primary Framing/Goal:** "This is a research study primarily designed to gather generalizable knowledge, not to provide direct therapeutic benefit to you." (Contrast with: "This study offers access to a promising new treatment.").
      *   **Alternative Common Perspectives:** "While some participants hope for personal benefit, the primary purpose is research. You should consider whether participating aligns with your values regarding contributing to science versus seeking personal medical gain."
      *   **Explicit Invitation to Reframe:** "How does this opportunity fit into your own goals and values? What questions do you have about how this might impact you beyond the medical facts?"

  2.  **Structured Shared Decision-Making (SDM) Tools with Framing Elements:** Develop and mandate decision aids that:
      *   Present information through *multiple* common value lenses (e.g., "Therapeutic Hope Lens," "Scientific Contribution Lens," "Risk Minimization Lens").
      *   Include prompts for the consenter to articulate their own priorities *before* deep diving into details ("What's most important to you when considering this option?").
      *   Facilitate a conversation where the professional *explicitly acknowledges* the framing choices and invites the consenter to co-interpret the information.

  3.  **Professional Training on Framing Awareness & Elicitation:**
      *   Train consent-seekers (clinicians, researchers, administrators) to recognize their own framing biases and the dominant institutional frames.
      *   Teach techniques to *elicit* the consenter's framing: "What's your understanding of why this is being offered?" "What are you hoping this might do for you?" "What worries you most about it?".
      *   Train professionals to *acknowledge and discuss* framing differences explicitly: "I realize we often talk about this trial in terms of hope for new treatments, but it's important to remember its main goal is research. How does that fit with what *you're* looking for?"

  4.  **"Framing Check" within Consent Review Processes (IRBs/ERBs):** Institutional Review Boards/Ethics Review Boards could require:
      *   Analysis of the dominant framing(s) used in consent materials and discussions.
      *   Justification for why this framing is appropriate and not unduly coercive/manipulative.
      *   Evidence that alternative reasonable framings are acknowledged or that materials facilitate the consenter's own framing.
      *   Review of scripts/training for how framing will be discussed interactively.

  5.  **Narrative or Value-Based Consent Supplements:** Alongside standard forms, offer optional spaces (written or verbal) for consenters to briefly state *in their own words* what the agreement means *to them* or what their primary hopes/concerns are. This doesn't change the legal agreement but formally incorporates their framing into the record and signals its importance.

  **Key Takeaway:** These remedies focus on **transparency about framing**, **acknowledging pluralism in values/perspectives**, **structured elicitation of the consenter's frame**, and **fostering dialogue** about meaning. They move beyond mere disclosure towards fostering a more symmetrical *conversation about significance*, making the consenter's authority over meaning tangible within institutional constraints. They are demanding but not impossible, requiring shifts in training, tool development, and institutional oversight priorities rather than infinite personalization. Your concept of NFA provides a powerful theoretical foundation for advocating precisely these kinds of practical reforms.
