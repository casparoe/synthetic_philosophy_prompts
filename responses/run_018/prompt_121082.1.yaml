  For (3), institutional remedies beyond more disclosure. The user suggests current practices rely too much on information dumping. Possible solutions could include mandatory framing statements, where the purpose (e.g., research vs. treatment) is explicitly stated. Or shared framing tools, like decision aids that present multiple perspectives. Training professionals to acknowledge framing choices and invite questions could help. Also, allowing consenters to contribute their own framing, like narrative input during the process. These address the asymmetry without full personalization, making it feasible in bureaucratic systems.

