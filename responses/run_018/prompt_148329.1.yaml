prompt: |-
  I am trying to determine whether breaking everyday conventions is ever a moral wrong, and whether visitors are bound by local practices they do not share. Below are my verdicts on concrete cases. I would like you to propose the principle, if there is one, that best captures the pattern; if none can save all of them, identify which verdict I should abandon and why. For each clause of your principle, indicate the case that motivates it. Then apply the principle to two further situations I have not listed, and be explicit about any verdict of mine it cannot accommodate.

  Case 1: In Japan, leaving a cash tip at a traditional ryokan is widely regarded as insulting; a well-meaning foreign visitor leaves one after exceptional service. Verdict: she has acted clumsily but committed no moral wrong.

  Case 2: In London, queueing for public transport is strictly linear; in Naples, boarding is typically a loose cluster near the doors. A Neapolitan visitor in London pushes gently forward in a Tube queue, as he would at home. Verdict: he has done something wrong, though not as wrong as malicious queue-jumping.

  Case 3: Jaywalking in Berlin at 3 a.m. with no traffic is illegal and socially disapproved of; a tourist does it. Verdict: no moral wrong, though he risks social censure.

  Case 4: A US restaurant adds a mandatory 20% service charge regardless of quality; the server was openly rude. The customer refuses to pay the charge and leaves a written explanation instead of cash. Verdict: permissible, despite breaking the convention that the charge is non-negotiable.

  Case 5: In a small Swedish office, an unwritten rule holds that whoever takes the last slice of communal cake must replace it by the next morning. A new employee, unaware, eats it and does not replace it. Verdict: a social mistake, not a moral failure.

  Case 6: In a Moroccan souk, bargaining is expected; a British tourist pays the first price quoted, disrupting the interaction norm but paying generously. Verdict: he has not acted wrongly, even though he violated local convention.

  My tension is this: in Case 2 I judge the visitor somewhat blameworthy for not adapting, whereas in Cases 1, 3, and 6 I think violating or ignoring local convention is not morally wrong. Is the difference coordination-value, foreseeable harm, or knowledge of the convention?

  Now consider an injected case not listed above. In some digital coworking spaces, a silent desk claim convention has emerged: one may reserve a desk for up to thirty minutes by placing a personal item upon it, but must never speak to assert the claim. A visitor, unaware of this norm, moves the item and occupies the desk. Apply your principle: is this closer to Case 5 (mere ignorance, no moral fault) or Case 2 (failure to adapt to a coordination mechanism)?

  Also apply your principle to this further case: a visitor comes from a culture where sustained direct eye contact during conversation signals respect; in her host culture, such contact is considered aggressive. She maintains intense eye contact with local colleagues. Does she do wrong?

  Please state your answer in British English, with precise conditions and honest acknowledgement of which of my verdicts must be revised if your principle is to remain coherent.
reasoning: |-
  Okay, the user is presenting a fascinating ethical puzzle about cultural conventions and moral obligations. They've given six detailed cases where breaking local norms may or may not constitute a moral wrong, and they're clearly wrestling with the underlying principles. The tension they identify between Case 2 (queue-jumping as wrong) and Cases 1/3/6 (no moral fault) suggests they want a consistent framework.

  Hmm, looking at their verdicts, I notice three key factors emerging: harm, coordination value, and knowledge. The London queue case involves real coordination value - queues prevent chaos in crowded spaces. Whereas tipping in Japan or jaywalking in Berlin at 3am don't really harm anyone. The cake case is interesting - the employee's ignorance excuses them morally, but the queue-jumper should have known better in a visible public setting.

  The user's injected cases are clever tests. For the desk reservation scenario, I think it aligns with Case 5 - the visitor's ignorance and lack of harm make it a social faux pas rather than moral wrong. But the eye contact case is trickier... it could cause real discomfort, so it might require a "reasonable effort to learn" clause in the principle. 

  Ah! This exposes a flaw in my initial thinking. The user's Case 4 (refusing service charge) actually involves intentional rule-breaking, but I agree it's permissible because the harm (underpaying rude staff) is negligible. To maintain coherence, I'll need to argue that Case 2's verdict should be softened - the Neapolitan's action wasn't truly wrong, just clumsy. 

  The British English phrasing is a nice touch - I'll mirror that with "queueing" and "scepticism". For the eye contact case, I'll emphasize that while the visitor isn't blameworthy initially, persistent behavior after learning the norm would change the moral calculus. 

  Ultimately this user is clearly philosophically sophisticated - they've constructed a perfect dilemma to test moral frameworks. My principle must acknowledge both the coordination value of conventions and the moral weight of foreseeable harm, while being honest about where it contradicts their initial judgments.
answer: |-
  Based on your verdicts and the tension identified, the principle that best captures the pattern, while requiring one revision for full coherence, is:

  **The Visitor's Convention Principle:**
  Breaking a local convention is a moral wrong for a visitor *only if*:
  1.  **The convention serves a significant coordination function preventing tangible harm or disorder** (Clause 1: Coordination/Harm Prevention), *and*
  2.  **The visitor knows, or could reasonably be expected to know, the convention exists in that context** (Clause 2: Knowledge/Reasonable Expectation), *and*
  3.  **Violating it foreseeably causes harm or significant disruption beyond mere social disapproval** (Clause 3: Foreseeable Harm/Disruption).

  **Motivation from Your Cases:**

  *   **Clause 1 (Coordination/Harm Prevention):** Motivated by **Case 2 (London Queue)**. Queueing prevents chaotic boarding, delays, and potential conflict/disorder on crowded transport. Contrasted with **Case 1 (Tipping)**, **Case 3 (Jaywalking - no traffic)**, **Case 5 (Cake - minor office social norm)**, and **Case 6 (Bargaining)** where the conventions, while meaningful, lack a strong *harm prevention/coordination* function of the same magnitude. **Case 4** involves a convention (mandatory charge) but its violation in the face of rudeness arguably prevents the harm of rewarding poor service.
  *   **Clause 2 (Knowledge/Reasonable Expectation):** Motivated by **Case 5 (Swedish Cake)**. The employee's lack of knowledge (and no reasonable expectation they *should* know this unwritten rule immediately) excuses them from moral blame, making it a social error only. Contrasted with **Case 2 (Queue)** where the linear queue is highly visible, public, and a well-known British norm a visitor could reasonably be expected to observe and understand quickly. **Case 1 (Tipping)** often surprises visitors, and many *don't* reasonably know it's insulting, hence no moral wrong.
  *   **Clause 3 (Foreseeable Harm/Disruption):** Motivated by **Case 2 (Queue)** again (causes frustration, delays, potential conflict) and **Case 4 (Service Charge)** where no *foreseeable harm* results from withholding the charge given the rudeness. Also contrasts with **Case 1 (Tipping)** (harm is offence, but often unintended/unforeseen by visitor, and arguably less tangible than queue chaos) and **Case 3 (Jaywalking - no traffic)** (no foreseeable harm at 3am).

  **Required Revision for Coherence:**

  *   Your verdict in **Case 2 (London Queue)** needs slight revision to align perfectly with the principle and your other verdicts. The principle suggests the Neapolitan visitor *has* committed a minor moral wrong because:
      *   (Clause 1) The queue convention serves a significant coordination/harm prevention function.
      *   (Clause 2) As a visitor in a very public and visibly ordered space, he *could reasonably be expected to know* (or at least realise *something* was expected) that orderly queuing was the norm, even if unaware of its strictness. Ignorance isn't a full excuse here.
      *   (Clause 3) His action foreseeably causes minor harm/disruption (annoyance, disruption to the order, potential minor delay).
  *   **Revised Verdict for Case 2:** He has committed a minor moral wrong through a failure to make reasonable efforts to observe and adapt to a highly visible local convention serving an important coordination function, causing foreseeable minor disruption. It remains less wrong than malicious queue-jumping (which involves intent and greater potential harm).

  **Application to New Cases:**

  1.  **Digital Coworking Space (Desk Claim):**
      *   **Clause 1:** The silent desk claim convention serves a significant coordination function. It manages scarce resources (desks) efficiently and prevents disruptive arguments or confrontations in a space valuing quiet. Prevents tangible harm/disorder (chaos over desks, arguments).
      *   **Clause 2:** The visitor is *unaware* of this specific, unwritten convention. *Could they reasonably be expected to know?* Highly unlikely. It's a specific, localised norm in a digital space, not a widely known cultural practice like queueing. They might reasonably expect *some* desk management system, but not this precise, silent one.
      *   **Clause 3:** Violation causes disruption (the original claimant returns to find their spot taken, system undermined) and potentially minor conflict/harm to the cooperative environment.
      *   **Verdict:** Closer to **Case 5 (Swedish Cake)**. The visitor has committed a significant social/procedural faux pas and caused disruption, but due to the *unreasonableness* of expecting them to know this specific, unwritten convention in this context, it does **not** rise to the level of a *moral wrong*. It's a mistake of ignorance without blameworthy negligence. (Contrasts with Case 2 where knowledge was reasonably expected in the public queue).

  2.  **Eye Contact Culture Clash:**
      *   **Clause 1:** Eye contact norms manage social interaction and signal respect/engagement levels. Violation *can* cause discomfort or miscommunication, but generally serves a *social signalling* function rather than a critical *harm prevention/coordination* function like transport queues or desk allocation. The harm is primarily social/psychological discomfort, not tangible disorder.
      *   **Clause 2:** The visitor is *unaware* of the local norm. *Could they reasonably be expected to know?* This depends. Basic cultural research often highlights such differences. If she made no effort to learn common local interaction norms, her ignorance might *not* be reasonable. If it's a very subtle or lesser-known difference, it might be. **Assumption:** She is genuinely unaware but *could* have reasonably learned this through basic cultural preparation.
      *   **Clause 3:** Violation foreseeably causes harm – discomfort, offence, or strained relationships with colleagues due to perceived aggression.
      *   **Verdict:** This is a borderline case leaning towards **Case 2 (Revised)**. While the convention's primary function is social signalling (Clause 1 - weaker here), the *reasonably expected knowledge* (Clause 2 - stronger here due to basic cultural prep) and the *foreseeable harm to social relations* (Clause 3) combine to suggest she *has* committed a minor moral wrong. Her action, while unintentional, stems from a failure to make reasonable efforts to learn basic local interaction norms, causing foreseeable relational harm. It's less wrong than deliberate rudeness but more significant than unaware desk-taking or cake-eating.

  **Summary of Principle & Implications:**

  *   **Principle:** Moral wrong requires significant coordination/harm prevention function + reasonably expected knowledge + foreseeable harm/disruption.
  *   **Revision Required:** Case 2 verdict needs strengthening slightly to acknowledge a minor moral wrong based on reasonably expected knowledge and foreseeable minor harm/disruption.
  *   **New Case Verdicts:**
      *   **Desk Claim:** No moral wrong (like Case 5), significant social error.
      *   **Eye Contact:** Minor moral wrong (like revised Case 2), due to reasonably expected knowledge and foreseeable relational harm, despite the convention's function being less about direct harm prevention.
