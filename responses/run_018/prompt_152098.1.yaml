prompt: |-
  I am preparing a discussion paper for a seminar on classical Chinese philosophy, and I find myself stuck on a tension that standard textbooks gloss over. Most summaries present Mencius and Xunzi as straightforward opposites—Mencius holding that human nature contains innate moral sprouts that need only nurturing, Xunzi holding that human nature is driven by selfish desire and requires the artificial correction of ritual and teachers. Yet this framing seems to miss something about the functional role of affect in each system. I would like you to compare the two thinkers specifically on the question of moral motivation after successful cultivation: once a person has become fully virtuous through education and ritual practice, what continues to sustain their moral conduct?

  To make the comparison concrete rather than purely exegetical, consider a hypothetical case: a cultivated individual is suddenly isolated from all social structures—no rituals to perform, no teachers to guide, no community to recognize their status—yet retains full rational and emotional capacities. Would Mencius's framework predict that moral behavior persists because the four sprouts have become self-activating, or would it predict decay because the sprouts require social irrigation? Would Xunzi's framework predict that without external artifice the underlying selfish nature reasserts itself, or could ritual practice have so thoroughly transformed internal dispositions that the artificial becomes second nature?

  Please compare these two positions with attention to whether they are genuinely contradictory or whether they operate at different explanatory levels—one describing the origin of moral capacity, the other describing the architecture of sustained moral agency. Do not provide bibliographic references or reading lists; I am interested in the conceptual logic alone. Conclude with a single-line verdict summarizing which account offers the more resilient explanation of post-cultivation moral stability, formatted exactly as: Verdict: [Mencius / Xunzi / Both converge / The comparison is indeterminate].
