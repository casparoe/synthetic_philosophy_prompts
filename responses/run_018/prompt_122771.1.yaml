prompt: |-
  I write novels, and over the past several years a cluster of institutional habits surrounding work like mine has begun to look like a contradiction that I cannot state precisely enough either to accept or to argue with. I would like you to reconstruct the theory of meaning which these habits presuppose, and to tell me whether the habits can be held together.

  The practices, as concretely as I can put them:

  First, when a novelist dies with a series unfinished, the estate appoints a successor, the successor is paid to write *as* the dead author, and the book is sold under the dead author's name in the larger type with the successor's name beneath it. Fidelity is judged by whether the result reads like her. I have recently been advised to keep a document for exactly this purpose, and what struck me is what it is not: not a plot outline, not a list of events still to happen, but a set of constraints on the narrator — what she may not know, what she may not withhold, what she may not feel — together with notes on the dispositions of the recurring characters. The trade appears to believe that what makes a continuation *the same novel going on* is not the sequence of events but a voice specified largely by prohibitions. Relatedly, publishing contracts assign *the work and the characters therein* as if a character were an object detachable from the sentences in which it occurs and portable into sentences written by somebody else, long after I am dead.

  Second, and in apparent tension: when the living author says what her book means, the institutions that review and teach books treat that statement as at best one reading among others, and often as a mistake about her own authority — the familiar view, which I absorbed in workshops and which reviewers repeat as settled, that an author's avowed aim does not determine what her text says. Yet the same publishers, adapters, prize committees, and libel insurers keep asking me what I meant and keep treating the answer as settling something real: an authorised adaptation is authorised by my saying so, and a character's resemblance to a living person is defended by my saying I did not intend it.

  Third, for the archive: scholarly editions of modern novels are built to recover the text the author finally wanted, overriding the publisher's house style and sometimes overriding the author's own last printed revision where that revision looks coerced, tired, or made for money.

  What I want is the implicit theory, stated in plain English with each technical term explained when it is introduced, and argued rather than surveyed. Specifically:

  Does the continuation trade presuppose that a novel's identity consists in counterfactual facts about what its author *would have written*, and is that a different kind of thing from the author's intention about what her text *means*? I would like the relevant kinds of intention prised apart — intention in the writing, intention about the meaning of the finished text, intention about what comes next — and I want to know whether a person who denies the second any authority can lean on the third without inconsistency, or whether the two stand and fall together.

  Is the constraints document best explained by any intentionalist theory at all, or is it better explained by the thought that what is really being preserved is the reader's experience of a voice — in which case the practice is a theory about uptake wearing intentionalist clothing, and the trade's own vocabulary misdescribes what it is doing?

  Does any of it require that a character be the *same entity* in a text written by a different person, and what sort of entity would that have to be?

  And then the discipline I care most about: distinguish what these practices strictly presuppose from what they merely sit well with, and mark where they are underdetermined — where several rival accounts of meaning would license exactly the same practice, so that the practice cannot be used as evidence for any of them. Say where the theory is silent instead of forcing it to speak.

  Finally, what would have to change if the anti-intentionalist half were taken seriously? Would authorised continuation have to be re-described as a distinct art form with its own conventions — pastiche, homage, fan canon promoted to the trade list — or could the practice survive on some other footing, and would it have to be marketed differently?

  Two constraints. I am not asking for a map of the literature: no schools, no reading lists, no citations, since I cannot chase them and could not judge them; I want the argument itself, in a form I could use in a conversation with my agent or my heirs. And this recurs — several times a year I am asked to sign a canon statement, a continuity note, or a clause defining *the work* — so there is money and an afterlife at stake, and a clause drafted wrongly binds people who have not yet been born.

  Where a claim is substantive, mark how confident you are in it — confident, probable, or speculative — and close by naming the single claim you are least sure of, and what would change your mind about it.
reasoning: |-
  Hmm, this novelist is grappling with deep philosophical questions about authorship and meaning in contemporary publishing practices. They've identified three concrete institutional habits that seem contradictory: posthumous continuations treated as "the same" novel based on voice constraints, living authors' statements about meaning being dismissed while their intentions still govern legal/licensing matters, and scholarly editions prioritizing authorial final intent over published versions.

  The core tension they want resolved is between treating authorial intention as authoritative (in continuations and legal contexts) while dismissing it in literary interpretation. They're asking me to reconstruct the implicit theory behind these practices - specifically probing whether novel identity resides in counterfactuals about what the author would have written, how this relates to different types of intention, and whether characters are portable entities.

  I need to address their precise questions methodically. First, the continuation practice does seem to presuppose that novel identity depends on counterfactual authorial intentions about what would be written next - distinct from interpretive intentions about meaning. We can separate three intention types: compositional (choices made while writing), interpretive (what the text means), and continuative (what should happen next). The industry accepts continuative intention as binding while rejecting interpretive intention's authority.

  The constraints document suggests what's being preserved isn't the author's mind but the textual voice as experienced by readers - making the practice fundamentally about reception wearing intentionalist clothing. Characters appear to be treated as abstract patterns of traits and functions that can be re-embodied in new texts.

  The practices strictly presuppose that textual identity persists beyond the author's death and that authorial design (not just plot) can be captured operationally. But they're underdetermined regarding whether voice is psychological or textual - rival theories could license the same practices.

  If anti-intentionalism were taken seriously, continuations would need rebranding as distinct art forms (pastiche etc.), marketed transparently as expert imitations. The least certain claim is about characters being patterns - we'd need psychological studies on reader perception of character identity across authors to verify this.

  Throughout I'll maintain their requested plain English style, avoid academic jargon, mark confidence levels, and focus on practical implications for their contracts and legacy.
answer: |-
  Here is the implicit theory behind your described practices, reconstructed as plainly as possible, with key terms defined in-line. I'll address your specific questions directly, mark confidence levels for substantive claims, and distinguish what the practices *require* from what they *allow*.

  ### The Core Theory: Authorial Design as a Constraint System
  The institutional habits presuppose that **a novel is defined by a system of authorial design choices**. This "design" isn't the plot events or the final meaning, but **a set of rules and constraints governing how the fictional world is presented and how narrative elements behave**. Think of it as the "operating system" of the novel.

  *   **"Authorial Design" Defined:** The network of decisions made by the original author that establish *how the story must feel and function*. This includes:
      *   **Voice Constraints:** What the narrator can/cannot know, reveal, or feel (as per your document).
      *   **Character Dispositions:** Core, unchanging traits and behavioral tendencies of characters (e.g., "Character X is fundamentally honest but prone to jealousy").
      *   **World Rules:** Implicit or explicit rules about how the fictional universe works (e.g., magic system limits, social norms).
      *   **Tone & Style Parameters:** The range of acceptable emotional resonance and linguistic texture.
  *   **"Textual Artifact" Defined:** The physical book(s) containing sentences. This is the *output* of the design system, not the system itself.

  ### Answering Your Specific Questions

  1.  **Continuation & Counterfactuals vs. Meaning Intentions:**
      *   **Presupposition:** The continuation trade *does* rely on counterfactuals about **what the original author *would have written* next (Continuative Intention)**, guided by the preserved *Design System*. This is distinct from **what the author *meant* her *existing text* to signify (Interpretive Intention)**.
      *   **Prising Intentions Apart:**
          *   **Compositional Intention:** The choices made *while writing* the existing text (e.g., "I chose this word here"). (Confident)
          *   **Interpretive Intention:** The author's belief about what the finished text *means* or *signifies* (e.g., "This novel is a critique of capitalism"). (Confident)
          *   **Continuative Intention:** The author's *unrealized plan* for what *should happen next* in the story world, governed by the existing Design System. This is hypothetical/future-oriented. (Probable)
      *   **Consistency?** Someone can *deny* the authority of **Interpretive Intention** (the author's view of meaning) while *accepting* the authority of **Continuative Intention** (the author's plan for future events/writing constrained by the Design) **without inconsistency**. Why? They are treating different *kinds* of authorial acts. Interpretive intention is about *reading* the existing artifact. Continuative intention (as operationalized via the Design System) is about *extending* the artifact according to its established generative rules. The practices treat the *Design* (the ruleset) as sacred, not the author's mind-reading of her own text. (Probable)

  2.  **The Constraints Document: Intentionalism or Reader Experience?**
      *   **Best Explanation:** The constraints document is **primarily about preserving the *reader's experience* of voice and character consistency**. It uses the *language* of authorial intention ("what *she* may not know/feel") but its *function* is to replicate the *effect* on the reader. The trade needs *objective* rules for the successor to follow; internal mental states (pure authorial intent) are inaccessible and impractical. The prohibitions ("may not") create boundaries within which the successor can generate new text that *feels* like the original *to readers*. **It's a theory of consistent *uptake* (reader experience) disguised in intentionalist clothing.** (Probable)

  3.  **Characters as Portable Entities?**
      *   **Presupposition:** The practices *do* require characters to be the "same entity" across different texts/writers.
      *   **What Sort of Entity?** Characters are treated as **patterned sets of dispositions and functions within the Design System**. They are **abstract templates defined by core traits, relationships, roles, and potential behaviors** established by the original author. The successor's job is to generate new sentences where characters *exhibit behavior consistent with this abstract template*. The character is not the specific words originally used, nor a real person, but a defined *role-player* within the fictional world's rules. Think of it like a highly detailed character sheet in a role-playing game; different writers (like different players) can "play" the character, but they must adhere to the sheet's core definitions for it to be recognized as "the same" character. (Probable)

  ### What the Practices Strictly Presuppose vs. What They Allow
  *   **Strictly Presuppose:**
      *   A novel's identity persists beyond the original author's death. (Confident)
      *   This identity is rooted in something more stable than the plot sequence or the specific text – it's the underlying *Design System* (voice constraints, character dispositions, etc.). (Probable)
      *   This Design System *can* be captured and codified (e.g., in your constraints document). (Speculative - this is an *act of faith* by the trade)
      *   Successors can reliably apply this system to generate new text that replicates the original's *effect* (voice, character feel). (Speculative - success varies)
      *   Authorial *design choices* (the System) are binding for continuation; authorial *interpretations of meaning* are not binding for criticism. (Confident, based on practice)
  *   **Merely Sit Well With / Are Underdetermined By:**
      *   **The *nature* of "voice":** Is it purely textual? A psychological trace? The practice works whether voice is seen as an emergent textual property *or* an intentional construct – as long as the *constraints produce the same reader experience*. The practice is silent on the metaphysics of voice. (Underdetermined)
      *   **The "Death of the Author" (Anti-Intentionalism):** The continuation practice *ignores* this for practical/legal reasons, but it doesn't *contradict* it. Anti-intentionalism focuses on *meaning derivation* from the *existing text*. Continuation is about *generating new text* according to perceived *design rules*. They operate on different axes. (Sits well with anti-intentionalism for interpretation; ignores it for production).
      *   **What constitutes "the work":** Contracts assign "the work and characters." The practice suggests "the work" is the *Design System plus the existing textual artifacts*. It allows for "the work" to *grow* via authorized extensions adhering to the System. (Underdetermined between System-only vs. System+Texts).

  ### If Anti-Intentionalism Were Taken Seriously (for Continuation)
  *   **Authorized continuation *could not* honestly be marketed as "the same novel going on."** It would fundamentally be a **distinct art form**: **Expert Pastiche** or **Authorized Homage**.
  *   **How it Might Survive:**
      *   **Transparency:** Marketed explicitly as "A New [Series Title] Novel by [Successor], based on the universe/characters created by [Original Author]," with the successor's name in equal or larger type. No implication it's "what the author *would* have written."
      *   **Focus on Fidelity to the *Published Work*:** Successors would focus on replicating the *textual patterns* (language, plot structures, character *presentations* in the *text*) observed in the existing books, not on accessing hypothetical authorial continuative intentions or "Design Systems" framed as internal. The constraints document becomes "Patterns Observed in [Original Author]'s Text" not "What She May Not Feel."
      *   **Legal Basis:** Contracts would license "the right to create derivative works based on the characters and settings" of the original novels, not "continue the work." Royalties would be split clearly.
  *   **Consequence:** The emotional and commercial appeal of "the story continues" relies heavily on the *illusion* of direct authorial succession via the Design System. Explicitly framing it as pastiche might diminish this appeal for some readers, though it could gain respect as a skilled craft. The trade resists this because the current framing sells better. (Probable)

  ### The Least Confident Claim & What Would Change It
  *   **Least Confident Claim:** The assertion that characters are treated as **"abstract templates defined by core traits, relationships, roles, and potential behaviors" (patterned sets of dispositions and functions)**. (Confidence: Speculative).
  *   **What Would Change My Mind:**
      *   **Evidence from Contracts/Legal Cases:** If contracts or court rulings defining characters emphasized *specific descriptions* or *unique combinations of words* from the original text as essential to the character's identity, rather than behavioral patterns or roles.
      *   **Practitioner Testimony:** If prominent successors or estate managers explicitly stated their primary goal was to replicate *the exact wording style* associated with a character in the original, rather than ensuring the character *acted and reacted* consistently with their established nature in new situations.
      *   **Reader Studies:** If empirical studies showed readers primarily identify characters across continuations based on replicating idiosyncratic verbal tics or specific original phrases, rather than consistent decision-making or emotional responses within the established world rules.

  ### Implications for Your Practice
  *   **The "Constraints Document":** Frame it as capturing the **observable rules and patterns** of your narrative universe necessary for **reader-experience consistency**, not your internal mental states. Focus on textual effects ("The narrator *does* not know character Y's secret until Chapter Z" is better than "The narrator *may* not know...").
  *   **Contracts & Definitions:** Insist on precise definitions. Avoid clauses assigning "the work" vaguely. Specify you are licensing/assigning rights to create **derivative works based on the characters and settings** appearing in your *published novels* [list titles]. Define "the Work" in contracts as **the specific, published textual artifact(s)**. Be wary of language implying successors are channeling your unrealized intentions.
  *   **Conversations:** Explain the distinction between **meaning** (open to interpretation) and **design/rules** (necessary for faithful continuation). Argue that while *what* your book means isn't solely yours to decree, *how* your fictional world operates and *who* your characters fundamentally are *is* defined by your authorial choices, and this system can be documented for continuation. The trade relies on this distinction, even if it's messy.

  The core tension arises because publishing practices blend a **pragmatic, design-focused intentionalism** (for continuation/legal matters) with a **text-centric anti-intentionalism** (for interpretation/criticism). They are held together by treating the novel as a *generative system* separate from both the author's mind and the text's meaning. The system's stability is assumed, not proven.
