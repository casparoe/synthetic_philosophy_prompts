  okay so me and my roommate just got out of this two-hour argument about moral revolutions — like why dueling and slavery actually went away – and she kept saying it was all appiah-style honor shifts and williams-style thick concepts losing grip, not actual moral reasoning, and i was pushing back that arguments still do real work even inside an honor culture. now she wants me to help her little brother understand the debate for some high-school philosophy elective he’s in next week, but i need a teaching plan, not the lecture itself. can you map out the order the ideas have to come in so he doesnt just think “people got nicer” or “morality is fashion”? i want dueling in britain as the carrying example instead of slavery since thats overused, and i need to know exactly what that case has to include – the state monopolizing violence, refusal-to-duel becoming respectable rather than cowardly – and what it should leave out so it doesnt confuse him. then tell me the misconseptions he’ll form – im guessing “if honor drove it then arguments never matter” and “moral progress is just relative taste” – and precisely where in the sequence i head each one off. also i need one check question at the end that proves he sees arguments and honor shifts interacting rather than replacing each other, plus what i should openly skip at this level (probably dont dig into williams’s full moral-luck framework or appiahs cross-cultural honor-world taxonomy?). also please weave in the niche point that some norms collapse not because they’re defeated but because the social conditions that made them intelligible disappear, but keep it grounded. and no reading lists or citations – he cant look stuff up and i dont want him guessing authors. oh and i keep writing recieve with the wrong order but thats not important here.
