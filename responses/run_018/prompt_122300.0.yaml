  P(T|A) = P(A|T)*P(T) / [P(A|T)*P(T) + P(A|H)*P(H)] = (0.7 * 0.5) / (0.7*0.5 + 0.5*0.5) = 0.35 / (0.35+0.25) = 0.35/0.60 = 7/12 ≈ 58.3%
