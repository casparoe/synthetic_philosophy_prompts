  2. Then perform the coin flip and assignment. 

  3. Group discussion (15 min): They discuss how to split the group pot without revealing their slot. 

  4. They agree on a split and lock it in. 

  5. Then, each student secretly writes down how they would split their 10 personal points. 

  6. Reveal the condition and calculate payouts. 

  7. Then, reveal the assignments (so they see how many were A and B) and the individual bets. 

  Now, we predict that the group might split the pot 50-50 (if they don't know how to aggregate) or 60-40 (if they use the prior that the expected fraction of A is 60%). However, the individuals: if they are A, they should put more on T (because P(T|A) = P(T and A)/P(A) = (0.5 * 0.7) / (0.5*0.7 + 0.5*0.5) = 0.35 / 0.35+0.25 = 0.35/0.6 = 7/12 ≈ 58.3%). Wait, that doesn't seem right. 

