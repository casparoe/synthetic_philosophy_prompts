  1. "setup_summary": A concise overview of the setup.
  2. "materials_and_roles": What materials are needed and what roles participants play.
  3. "betting_and_payoff_rules": The specific rules for betting and payoffs that create the tension.
  4. "timeline_by_minutes": A minute-by-minute breakdown of the activity.
  5. "predicted_first_run_failures": What might go wrong the first time and how to handle it.
  6. "debrief_mapping": How to map key moments to de se vs de dicto reasoning and where the shared evidence assumption cracks.
  7. "honest_limitation": A clear statement of what this simulation cannot capture (probably the pure single-agent indexical).
