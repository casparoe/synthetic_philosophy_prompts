  ### Materials and Roles
  - Facilitator (instructor) who flips the coin and assigns slots.
  - Envelopes or private messaging for slot assignment.
  - A way to record the group's bet (whiteboard or form).
  - Individual bet slips for the personal bets.
  - A coin (or RNG) to determine the condition.

  ### Betting and Payoff Rules
  - Group pot: 100 points. The group must decide how to split these 100 points between two options: Condition H and Condition T. 
  - After the condition is revealed, the group wins the amount they placed on the correct condition. 
  - Each student also gets 10 personal points. They must split these 10 points between H and T in any way they wish (e.g., 5 on H and 5 on T, or 10 on T, etc.). They record this secretly. 
  - Personal payouts: they win personal points in proportion to their bet on the correct condition (so if they put 6 on T and T is correct, they get 6 points; if they put 6 on T and H is correct, they get the 4 they put on H? Wait, no: if they split 6 on T and 4 on H, then if T is correct they get 6, if H they get 4). 

  But note: the personal points are split, so they are betting the entire 10. The return is the amount they allocated to the correct condition. 

  ### Timeline by Minutes
  Total 75 minutes.

  - [0-10]: Setup and rules explanation. 
  - [10-15]: Facilitator flips the coin (in front of everyone? or in private? We can do it in front) to determine the condition (H or T). Then, the facilitator randomly assigns each student to a slot (A or B) according to the condition. This is done by writing on slips of paper and distributing in envelopes. Each student opens their envelope privately and sees their slot (A or B) and then seals it again? Or they just remember and keep it secret. 
  - [15-30]: Group discussion. Students discuss how to split the group pot of 100 points. They cannot reveal their slot. They must agree on one split (e.g., 50-50, or 60-40, etc.). They write the agreed split on the board. 
  - [30-35]: Each student is given a slip to record their personal bet: how to split their 10 points between H and T. They do this secretly. 
  - [35-40]: Facilitator reveals the condition (H or T) and the group payout is calculated. 
  - [40-50]: Facilitator reveals the assignments (how many A and B) and collects the individual bet slips. Then, the individual payouts are calculated and announced (or handed back privately). 
  - [50-75]: Debrief and discussion.

  ### Predicted First Run Failures
  - Students might accidentally reveal their slot during discussion. Handle by reminding them of the rule and monitoring.
  - The group might not be able to agree on a split. Handle by setting a timer and if they don't agree by the end, the facilitator forces a vote (majority rule) or a default 50-50.
  - Students might not understand the betting mechanism. Handle by doing a practice round with a simplified example (without the slot assignment) before the actual activity.
  - The calculation of the expected value might be too difficult. Reassure that they don't have to calculate exactly, but use their intuition.

  ### Debrief Mapping
  - The group discussion: represents the attempt to form common knowledge. The rules and prior are common knowledge, but the private slot assignments are not. 
  - The group's agreed split: reflects de dicto reasoning (based on the prior and the rules without the private indexical information). 
  - The individual bets: reflect de se reasoning (each updates based on their own slot, which is indexical information). 
  - The clash: the group split (say 50-50) does not incorporate the private information, while the individuals do. But note that the group split might be suboptimal (if they had aggregated, they would know the condition from the number of A's). This shows the shared evidence assumption: the group only has the common evidence, but each has additional private evidence that they cannot share (by the rules) or that is essentially indexical. 
  - The moment when the assignments are revealed: they see that the group could have known the condition if they had shared their slots, but the rules prohibited that. This highlights the value of indexical information and how it is lost in the group common knowledge.

  ### Honest Limitation
  This simulation cannot reproduce the pure single-agent indexical uncertainty of the original Sleeping Beauty problem. In Sleeping Beauty, the same agent is awakened once or twice, and the question is about her credence upon awakening. Here, we have multiple agents, each with their own private slot assignment. The group setting introduces strategic and coordination elements that are absent in the single-agent case. Moreover, in Sleeping Beauty, the agent's uncertainty is about which awakening she is in, and she knows that in one case (tails) she is awakened twice, so her being awakened is evidence for tails. In our group simulation, each student is only "awakened" once (assigned one slot) and the evidence comes from the conditional probability of being assigned a slot given the condition.

  ### Niche Twist Explanation
  The twist is that the group must coordinate a single bet despite each member having private, self-locating information (their slot assignment) that rationally updates their credence about the condition in opposite directions depending on their slot. This forces a conflict between individual rationality (betting based on de se information) and group coordination (needing a common de dicto bet without aggregating the private information). The coordination failure occurs when the group settles on a compromise split (e.g., 50-50) that does not align with any individual's updated credence, and then each individual, when betting personally, diverges from the group bet. This makes palpable the gap between common knowledge and private indexical beliefs.

