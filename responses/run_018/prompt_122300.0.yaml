  Then, the group might try to use a reasoning: "If we all reason as if we are a randomly selected member, then the chance that a randomly selected member is A is 0.6 (the prior). So we should put 60% on T." But then an individual who is B might object: "But I know I'm B, so for me the chance of T is only 0.5 * (0.3) / [0.5*0.3 + 0.5*0.5] = 0.3 / (0.3+0.5) = 3/8 = 37.5%, so I think we should put less on T." But they cannot reveal they are B.

