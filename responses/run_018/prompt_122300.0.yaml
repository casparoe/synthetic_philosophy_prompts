  We can have them first agree on a betting strategy without knowing their own slot? But that would be before assignment. 

  But we want them to have the assignment and the private information.

  Revised timeline:

  1. Explain the rules to the group: 
     - A coin flip will determine the condition: H (50% A) or T (70% A). 
     - Then, each student will be randomly assigned to a slot (A or B) according to the condition. 
     - Each student will be told their own slot in private and must keep it secret. 
     - The group must then collectively decide how to split 100 points between two pots: Pot H (condition H) and Pot T (condition T). 
     - After they lock in the split, the condition is revealed and the group wins the amount they put in the correct pot (so if they put 60 in T and T is correct, they get 60 points). 
