prompt: |-
  I'm a retired physicist and I keep trying to figure out what makes me call one claim about the past pseudohistory and another claim legitimate speculation. My gut verdicts don't line up, and I want to know if there's a principle behind them.

  Atlantis. As literal history I'd call it pseudohistory — the island that sank in a day and a night, the war with Athens, all of it. But I also think Plato was probably garbling something real, maybe the Thera eruption and the Minoan collapse. So I hold both: literal Atlantis is crankery, but "Plato half-remembered a real catastrophe" is fine. That already feels like it should bother me more than it does.

  Troy. Before Schliemann, using Homer as a source for a real city looked like the same move — trusting myth against the professionals. But a Bronze Age city at Hisarlik really was destroyed more than once. So rejecting expert consensus can't be what makes something pseudohistory. Yet I'd still put Fomenko's New Chronology — the claim that ancient and medieval history is a vast forgery — in a totally different, bottomless category. The difference can't just be that Troy turned out right and Fomenko is absurd, because that would make pseudohistory a matter of hindsight.

  Ancient aliens. Von Däniken's claim that the pyramids or the Nazca lines needed extraterrestrial help is pseudohistory, obviously. But the weird part is that some of the puzzles he points to are real engineering questions, and his explanations are at least phrased in a physical-sounding vocabulary. I want to say the problem isn't that his hypotheses are extraordinary — extraordinary things do happen — but something about how he treats evidence: he dosen't seem to care whether it could count against him. Compare Wegener: continental drift was mocked for decades and is now orthodoxy. So "the establishment rejected it" works on neither side as a criterion.

  Menzies and pre-Columbian contact. I think Gavin Menzies' 1421 thesis — that Chinese fleets reached the Americas before Columbus — is pseudohistory, even though pre-Columbian contact is a perfectly respectable question and we now know the Norse reached Newfoundland (L'Anse aux Meadows). Menzies probably has more "evidence" than the Norse case did early on. So it can't just be amount of evidence either.

  Is there one principle of demarcation that gets these verdicts, or most of them? What would it say about a case I keep going back and forth on: the Kensington Runestone, a carved stone found in Minnesota in 1898 with an inscription claiming Norse explorers reached the area in 1362, which most specialists think is a modern hoax but which keeps getting re-litigated on rune forms and weathering? And which of my verdicts does the principle force me to give up?
reasoning: |-
  Okay, let's start by unpacking the retired physicist's dilemma. He's trying to find a consistent principle to distinguish pseudohistory from legitimate historical speculation. He's given several examples where his gut reactions don't seem to align, and he wants a unified framework. 

  First, I need to understand his examples. Atlantis: literal Atlantis as pseudohistory, but the idea that Plato was inspired by real events (like Thera) is acceptable. Troy: Schliemann was initially dismissed but turned out right, so going against consensus isn't inherently pseudohistorical. Fomenko's New Chronology is clearly pseudohistory despite also challenging consensus. Ancient aliens (von Däniken) is pseudohistory even though he addresses real puzzles. Menzies' Chinese fleet theory is pseudohistory despite pre-Columbian contact being a valid field. The Kensington Runestone is ambiguous for him.

  The key points he raises: consensus rejection isn't a reliable marker, evidence quantity isn't either, and extraordinary claims aren't automatically pseudohistory if evidence supports them (like continental drift). He senses that evidence handling is crucial—von Däniken ignores counter-evidence, while Wegener engaged with it.

  I recall Karl Popper's demarcation problem between science and pseudoscience, centered on falsifiability. For history, evidence integrity might be similar. But history isn't experimental; it's about interpreting traces. So maybe the principle is how hypotheses interact with evidence. Legitimate speculation uses evidence as constraints, while pseudohistory treats evidence as props. 

  For Atlantis, the literal version ignores geological impossibility (island sinking in a day) and lacks corroborating evidence. The Thera theory fits archaeological and geological data. Troy: Schliemann followed evidence (Homer as a lead, then excavating). Fomenko, however, dismisses all contrary evidence as forgery, making his theory unfalsifiable. Von Däniken cherry-picks anomalies without addressing how his claims could be disproven. Menzies overinterprets evidence (e.g., vague similarities as proof) and ignores alternative explanations. 

  The Kensington Runestone: the hoax hypothesis considers linguistic anomalies and context (found by a farmer with Scandinavian roots), while proponents focus only on supportive details. A legitimate approach would weigh all evidence, including motive and historical context.

  So the core principle might be: does the theory engage critically with evidence, or does it evade counterarguments? Legitimate scholarship seeks to falsify its own ideas; pseudohistory protects them. This explains why Wegener isn't pseudoscience—he presented testable mechanisms and addressed counter-evidence. Von Däniken doesn't.

  Applying this, the physicist might need to adjust on Troy: Schliemann's initial approach had issues (he damaged Troy's layers), but his core method was evidence-driven, so it's not pseudohistory. For Kensington, the hoax theory better integrates all evidence, making skepticism legitimate. His gut verdicts mostly hold under this principle.
answer: |-
  Your struggle resonates deeply—it's the eternal tension between curiosity and credibility. Based on your examples and the patterns in your judgments, the demarcation principle that best captures your instincts appears to be **Evidential Responsiveness**:  

  > **A historical claim becomes pseudohistory when it systematically avoids engagement with counterevidence, methodological constraints, or peer-driven revision—treating evidence as decoration rather than a constraint. Legitimate speculation, conversely, is defined by its capacity to adapt to new data and critique.**

  Let's test this against your cases:  

  1. **Atlantis Literal vs. Thera Inspiration**  
     - *Literal Atlantis*: Ignores Plato's philosophical context, geological implausibility (island sinking in 24h), and lack of corroborating evidence. **Ignores counterevidence → Pseudohistory.**  
     - *Thera/Minoan hypothesis*: Adapts to archaeology (Thera's eruption chronology), volcanology (caldera collapse), and textual analysis (Plato's Egyptian sources). **Revises with new data → Legitimate speculation.**  

  2. **Troy vs. Fomenko**  
     - *Schliemann's Troy*: Used Homer as a *testable* guide, then revised based on stratigraphy and Hittite records. **Responsive to excavation data → Legitimate (if flawed) methodology.**  
     - *Fomenko*: Dismisses radiocarbon dating, dendrochronology, and textual criticism as "forgeries." **Immunizes claims against falsification → Pseudohistory.**  

  3. **Von Däniken vs. Wegener**  
     - *Ancient Aliens*: "Evidence" (e.g., Nazca lines) is cherry-picked; anomalies aren't tested against human capability or cultural context. **No mechanism for correction → Pseudohistory.**  
     - *Wegener*: Proposed continental drift *and* mechanisms (e.g., continental "rafts"), predicted fossil patterns, invited peer review. **Falsifiable and adaptive → Legitimate science.**  

  4. **Menzies vs. Norse Vinland**  
     - *Menzies*: Interprets ambiguous artifacts (e.g., Chinese-style carvings) as proof while ignoring contrary evidence (no Chinese DNA, ceramics, or credible narratives). **Selective evidence use → Pseudohistory.**  
     - *Norse Vinland*: Hypothesis survived because it predicted specific settlement traits (butternuts, turf walls) later found at L'Anse aux Meadows. **Testable predictions → Legitimate.**  

  ### The Kensington Runestone Test  
  - **Pseudohistory View (Hoax)**: Prioritizes linguistic anachronisms (e.g., post-14th c. runes), the finder's Swedish heritage, and 19th c. hoax trends. *Acknowledges counterevidence*.  
  - **Legitimate Speculation View (Authentic)**: Focuses solely on weathering or rune forms *without* addressing why medieval Norse would be 2,500km inland, far beyond known expeditions. **Ignores contextual counterevidence → Pseudohistory.**  
  *Your principle demands siding with the hoax verdict*, as the pro-authenticity camp avoids engaging with historical and geographic constraints.  

  ### Which Verdict Must Change?  
  - **Troy Pre-Schliemann**: You initially called it "trusting myth against professionals." But under *evidential responsiveness*, Schliemann wasn't pseudohistorical—he *tested* Homer via excavation. Rejecting consensus isn't pseudohistory if done through evidence-responsive methods. **Adjustment: Troy skeptics weren't pseudohistorical; they were wrong but methodologically sound.**  

  ### Why This Works  
  Pseudohistory treats evidence like a buffet: take what tastes good, leave the rest. Legitimate speculation treats it like a dialogue: "What must be true *given* all this?" Your physicist's intuition for **falsifiability** and **error correction** is the spine of this principle—aligning with how science navigates uncertainty while pseudohistory evades it.  

  > "Extraordinary claims require extraordinary evidence" fails because *all* historical claims require *sufficient* evidence. The real fault line is whether the claimant cares if they're wrong.
