answer: |-
  ## Exam Prompt and Constraints

  **Course:** PHIL 4100: Advanced Topics in Personal Identity  
  **Exam Time Allocation:** 90 minutes total  
  **Question Time/Word Expectation:** 25 marks, approx. 25-30 minutes, 1,200 words  
  **Prompt:**

  "Derek Parfit famously argued that personal survival is grounded not in bodily or physical continuity, but in psychological continuity and connectedness, which he termed 'Relation R'. Relation R holds that a person P1 at time T1 survives as person P2 at time T2 if and only if there is overlapping chains of strong psychological connectedness (e.g., memories, intentions, character traits) holding between P1 and P2, and this continuity is caused in the 'right kind of way'—typically, by a reliable causal process like normal brain function, but crucially *without* requiring the persistence of the same physical matter.

  Consider the following thought experiment, the **Gradual Replacement Teletransporter (GRT)**:

  > Over a period of twelve months, every individual biological neuron in Subject Alpha's brain is meticulously replaced, one at a time, by an artificial, functionally identical synthetic neuron. Each synthetic neuron perfectly preserves the exact functional role, connectivity, and contribution to psychological states of the biological neuron it replaces. Consciousness and psychological continuity (memories, intentions, character) are maintained uninterrupted throughout the entire process. Crucially, each replaced biological neuron is immediately and permanently destroyed. At the end of the twelve months, no original biological matter from Alpha's brain remains; the entire brain substrate is synthetic.

  According to Parfit's Relation R, does Subject Alpha survive this process? Defend your answer.

  Now, suppose a critic proposes a modified criterion, **Relation R***: Psychological continuity is necessary for survival, but it is *also* necessary that this continuity is supported by a continuous physical substrate – meaning there must be some degree of spatiotemporally continuous matter persisting from the original to the later person.

  1.  Does the GRT scenario satisfy Relation R*? Why or why not?
  2.  Evaluate Relation R* as a criterion for personal survival:
      *   Does it successfully avoid the problems of the GRT case under Relation R, or does it introduce new problems?
      *   Does Relation R* collapse into a traditional bodily-continuity view of personal identity, or does it represent a genuinely distinct, hybrid criterion? Justify your analysis.
      *   Is the substrate-continuity requirement in R* well-motivated, or does it merely reflect an intuitive bias about the importance of 'original matter' that Parfit would dismiss? Discuss the role of intuition in assessing survival in the GRT case.

  Your essay must directly engage with the distinction between psychological continuity and bodily/substrate continuity. You must also explain why the *gradual* nature of the GRT process differs significantly from standard teletransporter cases involving instantaneous scanning and duplication (which raise the 'branching problem'), and how this difference impacts the assessment of survival under both R and R*. Avoid merely summarizing Parfit's views or textbook definitions; focus on applying concepts critically to the specific GRT puzzle."

  ---

  ## Model Answer (Approx. 550 words)

  According to Parfit's Relation R, Subject Alpha unequivocally survives the Gradual Replacement Teletransporter (GRT) process. Relation R defines survival solely in terms of overlapping chains of strong psychological connectedness (memories, beliefs, intentions, character) caused in the right kind of way. The GRT meticulously preserves psychological continuity: consciousness never lapses, memories are retained, intentions persist, and character remains stable. The replacement process, although artificial, is explicitly designed to be a *reliable causal process* maintaining these connections – analogous to the reliable function Parfit attributes to a healthy brain. The destruction of the original neurons doesn't violate Relation R because R explicitly does *not* require the persistence of the original matter; it only requires the *preservation of the psychological relations* via *some* reliable causal mechanism. The synthetic neurons provide that mechanism. Therefore, by Parfit's lights, the person at the end of the process is psychologically continuous with Alpha and is caused in the right way; Alpha survives.

  The GRT crucially avoids the primary objection to standard instantaneous teletransporters: the branching problem. In standard cases, scanning and duplication create the possibility of multiple psychologically continuous descendants (e.g., one on Earth, one on Mars), leading to the "fission" problem where neither descendant can be numerically identical to the original without violating the transitivity of identity. The GRT, however, involves no branching. There is only one continuous stream of consciousness supported by a single, gradually transforming physical system. At no point is there duplication or competing claimants to Alpha's identity. This absence of branching removes the major challenge that forces Parfit to reduce survival to psychological continuity *without* identity and adopt a "further fact"-denying view. In the non-branching GRT case, Relation R straightforwardly implies Alpha's survival *as* the resulting synthetic-brain individual.

  Turning to Relation R*, which adds a substrate-continuity requirement: The GRT process *does not* satisfy R*. While psychological continuity is preserved, R* demands that *some* spatiotemporally continuous matter persists from the original to the final person. The GRT explicitly destroys each original neuron as it's replaced. By the end, *no* original biological matter remains. The substrate is entirely new synthetic matter. Therefore, despite perfect psychological continuity, R* would deny that Alpha survives – the final person is merely a psychological duplicate inhabiting a wholly new physical brain.

  Evaluating R* reveals significant problems. First, it *does* avoid the GRT survival verdict under R, but only by introducing a requirement (substrate continuity) that Parfit argues is irrelevant to what matters in survival – our psychological connectedness and continuity. R* appears to reintroduce the very physical persistence criterion Parfit sought to reject. Second, R* risks collapsing into a traditional bodily-continuity view. If "substrate continuity" is interpreted as requiring the continuous existence of a critical mass of the *original* brain matter (or some essential part), it becomes indistinguishable from a brain-based bodily criterion. If, instead, it allows for gradual replacement *as long as some minimal matter persists continuously*, it faces arbitrariness: how much matter is required? Why is 99.9% replacement (some original matter remains) survival under R*, but 100% replacement (no original matter) is not, despite identical psychology? This arbitrary threshold seems philosophically unmotivated.

  Ultimately, the substrate-continuity requirement in R* seems primarily driven by *intuition* – the intuitive discomfort many feel at the idea that "we" could be composed of entirely new matter, even if psychologically identical. Parfit would argue this intuition is a deep-seated but mistaken Cartesian hangover, conflating the physical vehicle with the psychological person. The GRT case starkly exposes this intuition. Relation R demands we prioritize what matters – psychological continuity – over our attachment to original matter. While R* responds to that intuition, it does so by adding a requirement that lacks independent justification beyond that intuition and risks regressing to the bodily views Parfit persuasively critiqued. Therefore, while R* technically yields a different verdict for GRT, it fails to provide a compelling reason to abandon Parfit's purely psychological Relation R.

  ---

  ## Marking Scheme (25 Marks Total)

  *   **Correct Application of Relation R to GRT (4 marks):**
      *   (2 marks) Clearly states that Parfit's Relation R implies survival for GRT.
      *   (2 marks) Accurately explains *why*: Unbroken psychological continuity maintained by a reliable causal process (synthetic replacement), no requirement for original matter. (Deduct 1 mark for vagueness on "right kind of cause", deduct 1-2 marks for implying physical continuity matters for R).
  *   **Analysis of Branching vs. Non-Branching (4 marks):**
      *   (2 marks) Correctly identifies the branching problem (fission) as the core issue for standard teletransporters under Relation R.
      *   (2 marks) Clearly explains why GRT *avoids* branching (single stream of consciousness, no duplication, gradual transformation of a single system). (Deduct 1 mark for mentioning branching but not explaining its significance for R's verdicts, deduct 2 marks for incorrectly claiming GRT involves branching or failing to distinguish it).
  *   **Application & Analysis of Relation R* to GRT (4 marks):**
      *   (2 marks) Correctly states GRT does *not* satisfy R* due to the complete lack of persisting original substrate.
      *   (2 marks) Accurately explains the substrate-continuity requirement of R* and how GRT violates it through total replacement and destruction. (Deduct 1 mark for vagueness on R*'s requirement, deduct 1-2 marks for incorrectly stating GRT satisfies R*).
  *   **Evaluation of Relation R*: Collapse into Bodily View? (6 marks):**
      *   (2 marks) Identifies the risk that R* collapses into a bodily-continuity view (especially brain-based) if substrate continuity means persistence of original matter.
      *   (2 marks) Identifies the problem of arbitrariness if R* allows some minimal matter (Why that threshold?).
      *   (2 marks) Argues whether R* is genuinely distinct (e.g., still requires psychology *plus* substrate) or effectively redundant with bodily views. (Deduct 1-2 marks for superficial treatment, deduct 2-3 marks for failing to address collapse/arbitrariness).
  *   **Evaluation of Relation R*: Motivation & Intuition (5 marks):**
      *   (3 marks) Effectively argues that the substrate requirement in R* primarily reflects an *intuition* about the importance of original matter/persistence.
      *   (2 marks) Engages critically with this intuition: Does it have independent justification beyond gut feeling? Does Parfit provide good reasons to dismiss it (prioritizing psychology)? Links this intuition directly to discomfort with the GRT outcome under R. (Deduct 1-2 marks for merely stating intuition is involved without critical evaluation, deduct 2 marks for ignoring Parfit's challenge to bodily intuitions).
  *   **Clarity, Structure, and Argumentation (2 marks):**
      *   Well-structured, coherent argument addressing all parts of the prompt. Precise use of terms (Relation R, R*, psychological continuity, substrate, branching). Avoids significant digressions.

  **Common Errors and Deductions:**
  *   **-2 to -3 marks:** Conflating GRT with a standard brain transplant (where matter is moved) or standard teletransporter with branching. This fundamentally misrepresents the scenario.
  *   **-2 marks:** Simply asserting psychological continuity is sufficient for survival under R without explaining *why* (especially how GRT meets the "right kind of cause" requirement).
  *   **-2 marks:** Mischaracterizing the branching problem (e.g., thinking it applies to GRT, or not understanding why it challenges identity under R).
  *   **-2 marks:** Treating Relation R* as obviously correct or superior without critical evaluation of its problems (collapse, arbitrariness, intuition-dependence).
  *   **-1 to -2 marks:** Confusing psychological continuity with bodily continuity, or failing to clearly distinguish them.
  *   **-1 mark:** Significant omissions in addressing parts of the prompt.
  *   **-1 mark per instance:** Significant conceptual inaccuracy (e.g., claiming Parfit thinks identity survives fission, misdefining Relation R/R*).
