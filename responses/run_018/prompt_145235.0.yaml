  First, I need to figure out why this debate is stuck. The user mentions that both camps accept the same neuroscience, recognize degrees of articulation, and lack decisive experiments. So, what's the core issue? The user suggests several possibilities: verbal dispute, hidden disagreements about explanation, metaphysical clash, or bedrock intuitions.

  Hmm, the reductionists might be focusing on structural explanations, saying that if you can model it with propositions and procedures, that's sufficient. Anti-reductionists argue that the ability to adapt to novelty isn't captured by any set of propositions. This feels like a difference in what counts as a complete explanation. Reductionists might prioritize mechanistic models, while anti-reductionists value the agent's perspective and flexibility.

  The user also asks if there's a way to resolve this. Experiments haven't worked because both sides interpret results through their frameworks. Maybe the problem is the question itself. Framing it as a dichotomy might be too simplistic. Perhaps shifting to a pluralist approach, where different explanatory frameworks coexist, could help. Instead of asking "is it reducible?" we could ask "under what conditions do propositional models suffice, and when do we need non-propositional concepts?"

  Also, considering embodied cognition might be useful. If cognition is rooted in sensorimotor engagement, then knowing-how might involve non-representational elements. But even that might not settle the debate. The deeper issue could be about explanatory goals—whether we're satisfied with third-person models or insist on capturing first-person experience.

