prompt: |-
  A study partner walked me into this argument about Nietzsche's eternal recurrence, and I cannot find the exit. (1) If recurrence is literally true, every mental act—including regret, resolve, or moral condemnation—repeats identically across every cycle, with the same causal origin and the same consequence. (2) A mental state that is never correlated with a different world-state lacks counterfactual efficacy: it is not the kind of thing that could have done otherwise. (3) Nietzsche nevertheless presents recurrence as an ethical test: the strong soul affirms the eternal return even of its smallest, most regrettable moments. (4) Genuine affirmation requires the logical possibility of rejection; without that contrast, yes-saying collapses into mere descriptive acceptance, indistinguishable from passive resignation. (5) So if recurrence eliminates all counterfactual openness, it also eliminates the condition that makes affirmation a virtue rather than a psychological inevitability, and the ideal of the Übermensch is undermined. (6) Therefore either recurrence is not a cosmological claim, or Nietzsche's ethics is self-defeating. I want to keep (1) and (3), but something slipped between (2) and (5) that I cannot name. Which step do you reject, what does that rejection cost—especially for the claim in (4) that affirmation needs a real contrast—and can the argument be repaired without giving up the literal cosmological reading? Please respond in American English as a numbered list of exactly five items, each a sentence or two long, with no introduction or conclusion.
