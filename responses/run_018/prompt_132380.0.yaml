  The divergence remains, but the specification says that the divergence must arise specifically from the second-order uncertainty. However, in the maximin and MFT, they are not using the second-order uncertainty; they are using the first-order theories. So the second-order uncertainty is a red herring? 

  Actually, the specification says: "the divergence must arise specifically from how each procedure handles second-order uncertainty about whether moral comparison across theories should be linear or non-linearly transformed." 

  In our case, the MEC (linear) does not handle the second-order uncertainty at all (it assumes linear). The maximin and MFT do not explicitly handle it either. But the presence of the catastrophic outcome (the 0) is what causes maximin and MFT to choose B, and that catastrophic outcome is only a problem if we are not aggregating linearly. So the agent's second-order uncertainty about aggregation makes the linear MEC method less attractive because it ignores the risk of being wrong about the aggregation method.

  But in the case as presented, the MEC (linear) ignores the second-order uncertainty and thus recommends A, while the other methods (by their nature) are more cautious and choose B. The second-order uncertainty is the reason why the agent might doubt the linear MEC.

  **Strongest Objection from MEC Defender:**

  The MEC defender could argue that maximin (and MFT) illegitimately treat moral theories as states of nature that can cause "harm" to the decision-maker, rather than as competing normative descriptions of what one ought to do. In particular, maximin focuses on the worst-case theory, but if the true moral theory is consequentialism, then the fact that deontology or contractualism would condemn the action is irrelevant. The decision should be based on the expected moral truth. By avoiding Protocol A because of the contractualist veto, maximin gives undue weight to a theory that may be false. Moreover, the second-order uncertainty about the aggregation metric is just another layer of moral uncertainty that should be incorporated into a grand MEC calculation (as we did in the revised MEC above, which then recommended B). The defender might say: if you account for the second-order uncertainty in MEC, then you get B. So the problem is not with MEC per se, but with the naive application that ignores higher-order uncertainties. The case does not criticize MEC but criticizes incomplete MEC.

