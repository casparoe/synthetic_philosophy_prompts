  For B: 0.5 * 0.65 + 0.5 * 0.5 = 0.325 + 0.25 = 0.575.

  Then MEC (now accounting for second-order uncertainty) would recommend B (0.575 > 0.35). But we want the pure linear MEC to recommend A and the others to recommend B without necessarily having MEC change. The specification says: MEC (using linear intertheoretic) recommends A, while maximin and MFT recommend B. And the divergence arises from the second-order uncertainty (which the other methods might be sensitive to).

