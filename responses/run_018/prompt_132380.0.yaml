  **Second-Order Uncertainty:** The agent is uncertain whether the intertheoretic comparison of choice-worthiness should be linear (additive) or non-linear (multiplicative, emphasizing catastrophic outcomes). Specifically, they have 50% credence that the true metric is linear and 50% that it is non-linear (e.g., exponential penalty for worst-case outcomes).

