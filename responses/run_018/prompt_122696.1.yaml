  There's also tension between the longitudinal stake argument for 16-year-olds (2) and the citizenship requirement (3). Why base inclusion on stake for age but not residency? The user needs to explain why citizenship is special despite affected interests.

  The voting-as-trust view (6) creates tension with the case verdicts about dementia patients and indifferent voters (7). If voting is a public trust, we might question whether those who can't exercise judgment or don't care should vote. But the user specifically wants to include them.

