  - Compulsory voting (4) and dementia cases (7) might work if assistance is provided.

  For the audit, I'll identify these tensions in order of severity and show what revisions would cost the user. The most significant repair would be to clarify the sovereignty principle in Principle 3, but that might weaken the affected-interests foundation. Overall, the package can be defensible with some refinements, especially regarding the national/local distinction.
answer: |-
  ### Stage 1: Brainstorming Candidate Principles  
  Your package suggests these core principles (with rivals marked):  
  1. **Affected Interests Principle (AIP)**: All whose significant interests are durably impacted by collective decisions merit inclusion (*rival to sovereignty-based membership*).  
  2. **Longitudinal Stake Priority**: Greater future exposure to policy consequences strengthens franchise claims (*rival to competence/maturity thresholds*).  
  3. **Sovereignty Principle**: National self-determination requires formal membership (citizenship), while local governance hinges on residence/impact (*rival to unitary affected-interests*).  
  4. **Epistemic Collectivism**: Group judgment quality depends on broad, socially representative participation (*rival to voluntarist/autonomy views*).  
  5. **Anti-Arbitrariness**: Exclusionary rules must avoid manipulable standards (e.g., tests) and historical patterns of bias (*rival to instrumentalist competence arguments*).  
  6. **Institutional Conception of Franchise**: Voting serves collective self-rule, not individual entitlement; exclusions need only public justification (*rival to natural-rights voting*).  

  *Key Rivalries*:  
  - **AIP vs. Sovereignty Principle** (Item 3 limits inclusion despite affected interests).  
  - **Longitudinal Stake vs. Anti-Arbitrariness** (Item 2 uses a "stake" proxy but rejects individualized assessment).  
  - **Epistemic Collectivism vs. Institutional Conception** (Item 4 values participation for wisdom; Item 6 treats voting as office-holding, indifferent to wisdom).  

  ### Stage 2: Consistency Audit  
  #### Ranked Tensions (Severe to Mild):  
  1. **Item 1 (AIP) vs. Item 3 (Citizenship for National Elections)**  
     - **Conflict**: AIP demands inclusion for long-term residents (taxed, affected by laws), yet Item 3 excludes them nationally. Sovereignty trumps affected interests without argument.  
     - **Cost of Revision**: Abandoning Item 3’s citizenship rule violates your sovereignty principle and weakens defensibility to excluded non-citizens (who may see arbitrariness). Keeping Item 3 requires demoting AIP from "real ground" to one consideration among others.  
     - **Flow-on Effects**: Undermines longitudinal-stake argument (Item 2), as future stake could similarly be overridden by sovereignty.  

  2. **Item 6 (Voting as Public Trust) vs. Item 7 (Dementia/Indifference Cases)**  
     - **Conflict**: If voting is a trust requiring judgment, enfranchising the severely cognitively impaired (or the wholly indifferent) seems inconsistent. Item 7 prioritizes anti-arbitrariness (Item 5) over functional capacity.  
     - **Cost of Revision**: Excluding these groups violates Item 5’s anti-manipulation norm and Item 1’s inclusion principle (they remain affected). Including them weakens Item 6’s "public office" logic by decoupling vote from deliberative responsibility.  
     - **Flow-on Effects**: None directly, but strains compulsory voting (Item 4a) by forcing participation from those arguably incapable of fulfilling the "trust."  

  3. **Item 4 (Compulsory Turnout) vs. Item 7 (Indifferent Voters)**  
     - **Conflict**: Compelling the indifferent to vote (Item 4) contradicts Item 7’s protection of their franchise. If indifference doesn’t negate inclusion, why force engagement?  
     - **Dissolves Under Scrutiny?**: Partially. Item 4b’s epistemic aim (better collective judgment via diversity) justifies coercion regardless of individual motivation. The tension is pragmatic, not logical: indifferent voters may undermine epistemic goals, but excluding them violates anti-arbitrariness (Item 5).  

  4. **Item 2 (Stake-Based Age Inclusion) vs. Item 3 (Citizenship Exclusion)**  
     - **Apparent Conflict**: Why prioritize longitudinal stake for youth but ignore residence-based stake for non-citizens?  
     - **Dissolves Under Scrutiny?**: Yes, if sovereignty (Item 3) applies only to *national* self-definition, while longitudinal stake (Item 2) operates within the pre-defined demos. Tension remains if non-citizens have comparable lifetime stakes (e.g., young immigrants).  

  5. **Item 4 (Compulsory Turnout) vs. Item 6 (Voting as Trust)**  
     - **Apparent Conflict**: Can a "public office" be legally mandated?  
     - **Dissolves Under Scrutiny?**: Yes. Jurors (a clear public trust) are compelled; Item 6 doesn’t require voluntarism.  

  #### Orthogonal Items:  
  - **Item 5 (No Tests)** aligns with AIP and Anti-Arbitrariness, no friction.  
  - **Item 2’s rejection of proxy voting/weighting** is consistent with one-person-one-vote egalitarianism.  

  #### Most Impactful Revision:  
  - **Revise Item 3** to extend national suffrage to long-term residents (e.g., 10+ years). This:  
    - Resolves the severe Item 1/Item 3 conflict by honoring AIP.  
    - Preserves local voting for non-citizens (showing gradualism).  
    - Costs: Weakens sovereignty principle, potentially alienating citizens who value formal membership. May require abandoning Item 6’s "no rights-based complaint" stance if exclusion is unjust under AIP.  

  #### Survivability of Package:  
  With Item 3 revised, the package is defensible:  
  - AIP grounds inclusion (Items 1, 2, 7).  
  - Sovereignty is tempered but retained for defining the *national* demos via residence duration.  
  - Compulsion (Item 4) serves epistemic/equity goals without requiring voter competence (Item 5).  
  - Voting-as-trust (Item 6) justifies exclusions (e.g., minors under 16) via public reason, not rights.  
  **Verdict**: A coherent, publishable theory blending instrumentalist epistemology (Item 4), constitutive sovereignty (revised Item 3), and anti-discrimination (Items 5, 7). The unresolved Item 6/Item 7 tension is minor if "public office" is interpreted minimally as *eligibility* rather than *capacity*.
