answer: |-
  Here's a decision-tree taxonomy focused on accommodating uninstantiated structural roles, designed for your diagnostic purpose:

  **Decision Tree: Can a View Accommodate Uninstantiated Structural Roles?**

  1.  **First Node: Does the view admit that there are genuinely real, repeatable properties/patterns (like "being prime" or "algorithm P")?**
      *   **No** → **Extreme Nominalism** (e.g., strict Particularism)
          *   *Most awkward commitment:* It must deny the reality of uninstantiated structural roles *altogether*, reducing them to mere names or mental constructs, even when they seem objectively discoverable (like prime number properties).
      *   **Yes** → Proceed to Node 2.

  2.  **Second Node: Must these repeatable properties/patterns *always* be instantiated in concrete particular things (objects, events) to exist?**
      *   **Yes** → Proceed to Node 3.
      *   **No** → **Platonic Realism** (e.g., traditional Platonism)
          *   *Most awkward commitment:* It posits a vast, abstract realm of necessarily existing, uninstantiated structural roles (Forms), raising concerns about ontological extravagance and our epistemic access to them.

  3.  **Third Node: Do these repeatable properties/patterns exist objectively, independently of minds and our concepts?**
      *   **Yes** → **Immanent Realism** (e.g., Aristotelian Universals)
          *   *Most awkward commitment:* It cannot accommodate *genuinely real* uninstantiated structural roles (like a novel, unbuilt algorithm), as universals only exist *in re* (in particular instantiations).
      *   **No** → **Conceptualism** (e.g., some forms of Idealism or Kantianism)
          *   *Most awkward commitment:* It reduces uninstantiated structural roles to mind-dependent concepts, making their apparent objectivity and discoverability (e.g., in mathematics) dependent on contingent mental activity.

  ---

  **Handling the "Unnamed" Branches:**

  *   **Branch A: Repeatables Exist? (Node 1) = Yes / Must Be Instantiated? (Node 2) = Yes / Mind-Independent? (Node 3) = *Unnamed***
      *   *Diagnosis:* **Incoherence?** This combination demands mind-independent properties that *must* be instantiated. If they are truly mind-independent, their existence *shouldn't* depend on being instantiated. A view holding both simultaneously faces tension: how can a property's existence depend *only* on instantiation (Node 2) yet also be mind-independent (Node 3)? This suggests instability. *(Note: This is where Immanent Realism lives, but it answers "No" to Node 3 being sufficient for existence without instantiation, not "Yes" to mind-independence implying existence without instantiation. This unnamed branch asks for mind-independent properties whose existence is still tied to instantiation, which is problematic.)*
  *   **Branch B: Repeatables Exist? (Node 1) = Yes / Must Be Instantiated? (Node 2) = No / Mind-Independent? (Node 3) = No → *Unnamed***
      *   *Diagnosis:* **Neglect/Unattractiveness?** This view allows uninstantiated repeatables but denies their mind-independence. While logically possible (e.g., positing uninstantiated concepts in a divine or cosmic mind), it's uncommon as a distinct label. It might be seen as a variant of Conceptualism extended to uninstantiated cases, or a form of Idealism/Theism, but lacks a standard *specific* name like the others. It's potentially unattractive because it attributes the reality of abstract structures (like math) entirely to a mind without grounding them further, potentially undermining their necessity and objectivity.

  ---

  **Key Features of the Taxonomy:**

  1.  **Diagnostic Focus:** The core tension is forced at Node 2 (Instantiation Requirement), directly testing views on uninstantiated structural roles. Node 3 (Mind-Independence) further refines the nature of the repeatables admitted.
  2.  **Student-Facing Questions:** Each node is a concrete, foundational question about the *nature* of properties/patterns, answerable without knowing the historical labels.
  3.  **Clear Leaf Identification:** Each endpoint names a well-known position.
  4.  **Highlighted "Awkwardness":** The one-sentence summaries explicitly tie each position's core commitment to the challenge posed by uninstantiated structural roles.
  5.  **Handled "Unnamed":** The two logically possible but unnamed combinations are identified and diagnosed (incoherence/tension vs. neglect/unattractiveness).
  6.  **Coverage:** Captures the major historical positions:
      *   **Extreme Nominalism:** Rejects repeatables fundamentally.
      *   **Resemblance Nominalism:** *Isn't a distinct leaf?* Correct. Standard Resemblance Nominalism (e.g., "things are red because they resemble each other, not because they share a universal") **rejects genuine repeatable properties** (Node 1 = No). It explains apparent repeatability through resemblances between particulars, fitting comfortably under the "Extreme Nominalism" leaf in this taxonomy focused on the *existence* of repeatables. Its awkwardness is the same: denying the independent reality of patterns like prime-hood.
      *   **Conceptualism:** Mind-dependent repeatables (instantiated or not).
      *   **Trope Theory:** *Isn't a distinct leaf?* Correct. Standard Trope Theory **denies genuine repeatable properties** (Node 1 = No). It posits only particular property-instances (tropes). Apparent repeatability is explained by the resemblance of distinct tropes. Like Resemblance Nominalism, it belongs under the "Extreme Nominalism" leaf here. Its awkwardness is explaining how uninstantiated structural roles (requiring *non-particular* repeatability) could exist when only unique tropes are fundamental. *(Note: Some modern "trope bundle" theories might *approximate* universals via resemblance classes, but the core commitment is to non-repeatable particulars, hence Node 1 = No).*
      *   **Immanent Realism:** Mind-independent repeatables requiring instantiation.
      *   **Platonic Realism:** Mind-independent repeatables *not* requiring instantiation.

  This structure efficiently uses your diagnostic to map the landscape, revealing why Platonic Realism is uniquely positioned to accept uninstantiated structural roles directly, while others struggle or deny their fundamental reality.
