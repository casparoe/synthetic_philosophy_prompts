prompt: |-
  For a long-read essay I am planning on why the question of whether there would have been a Nazi Germany without Hitler is so hard to settle, I want to stop litigating the particular case for a moment and instead specify what any adequate theory of individual historical agency would have to get right. Give me the requirements list: the cases it must be able to handle, the distinctions it must respect, the methodological constraints it cannot violate, and the empirical results it cannot contradict, with the consideration behind each requirement. In particular, I want to know which demands on such a theory are genuine adequacy conditions and which are just methodological preferences or ideological commitments of one camp, and which ones are non-negotiable. One thing I especially want: flag any subset of these requirements that may be jointly unsatisfiable, given what is known about path dependence, selection effects, structural constraint, and counterfactual dependence. Keep the weight on the criteria and their motivating cases rather than on a scorecard of existing views, since I want to apply the list myself. A table is fine if that helps.
reasoning: |-
