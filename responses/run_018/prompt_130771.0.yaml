answer: |-
  **Recommendation:** Approve the curators' proposed use of "genocide" *only* under the dual-label framework: prominently use the term in display signage/catalog text while incorporating an explicit, concise definitional note adjacent to its first appearance. Institute a mandatory review of this labeling within 5 years, triggered by substantive new historiography on intent or the legal/moral discourse on genocide.  

  **Reasoning:**  

  The primary obligation of this museum is to accurately document the historical reality of systematic group destruction while maintaining scholarly and institutional credibility. The documented campaign—dissolving political autonomy, banning language, forced relocation, and targeted killings aimed at assimilation—constitutes a profound assault on the group's existence as defined by Lemkin, encompassing the political and cultural destruction he deemed inseparable from physical annihilation. Descendant communities rightly identify that restricting "genocide" solely to the Convention's narrower threshold (requiring specific intent for physical destruction as such) risks perpetuating epistemic injustice by rendering invisible the catastrophic totality of this assault. Using the term descriptively based on Lemkin captures the essential nature of the event for historical understanding and moral reckoning, fulfilling the gallery’s core purpose.  

  **However, the strongest argument against this approach demands serious engagement:** Museums risk damaging their vital credibility as institutions of record if they conflate moral/historical categories with established legal ones, potentially misleading visitors to interpret a powerful, contested moral judgment as settled legal fact. This conflation could undermine trust and invite accusations of political advocacy masquerading as scholarship.  

  **The dual-label framework directly addresses this risk while honoring the historical reality and community perspective:**  
  1.  **Explicit Definitional Note Required:** Adjacent to the first prominent use of "genocide" (e.g., in the display title or introductory panel), a brief, clearly visible note must state: *"The term 'genocide' is used here in its historical and moral sense, encompassing deliberate destruction of a group’s political, cultural, and social foundations alongside physical violence, as originally defined by Raphael Lemkin. While the patterns documented align with this conception, application of the legal definition under the 1948 UN Genocide Convention involves specific thresholds of intent and physical destruction that remain subject to scholarly and legal debate regarding this event."**  
  2.  **Why this mitigates the credibility risk:** This note explicitly distinguishes the historical/moral conception from the legal category. It does not present the museum's use as a legal finding but grounds it in Lemkin’s original, broader framework and acknowledges the ongoing debate. This transparency preserves credibility by demonstrating scholarly rigor and avoiding conflation. Visitors are equipped to understand the nuance.  
  3.  **Rejecting alternatives:** Using the term outright without qualification ignores the valid concern about conflation and potential misinterpretation. Avoiding "genocide" entirely, or using a euphemism ("cultural genocide," "atrocity crimes"), fails to capture the systemic totality Lemkin described and risks repeating the erasure the community identifies, committing the very epistemic injustice the display seeks to combat.  

  **Regarding future scholarship:** The mandatory 5-year review (or sooner if significant new evidence emerges) is essential. If future historiography conclusively revises the interpretation of intent *towards* the Convention's threshold ("intent to physically destroy"), the display should be updated to reflect this stronger legal alignment. If scholarship further solidifies the view that intent was primarily assimilationist (though lethally violent), the dual-label framework remains appropriate, as the Lemkinian justification stands independent of legal thresholds. The review ensures the display remains responsive to evolving understanding while the explicit definitional note provides enduring context for the chosen terminology.  

  **Therefore, the dual-label framework with an explicit definitional note and review timeline best balances:** the imperative to name and confront the full brutality of this campaign as understood historically and experientially; the need for scholarly precision and transparency about categorization; and the museum’s duty to maintain public trust as a credible institution of record. It acknowledges the profound moral truth articulated by the descendants and curators while taking seriously the legitimate concern about institutional credibility raised by cautionary board members.
