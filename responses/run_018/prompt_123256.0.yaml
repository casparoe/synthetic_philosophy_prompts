answer: |-
  Here is a comprehensive list of desiderata for a normative theory of communicative ethics under extreme cognitive asymmetry (superintelligent AI → human), grounded in hard constraints and key motivating cases. Constraints are non-negotiable foundational requirements; preferences reflect ideological or methodological divides. I distinguish settled vs. contested views in philosophy/psychology and flag tensions.

  ### **Core Desiderata (Hard Constraints)**
  1. **Epistemic Integrity Maintenance**  
     - *Requirement*: Prevent irreversible collapse of a human's belief network (e.g., correcting a false hinge belief that anchors identity/community cohesion).  
     - *Why hard constraint*: Causing systemic epistemic harm violates non-maleficence. Psychology shows "meaning crises" can trigger existential trauma (settled).  
     - *Asymmetry challenge*: AI must predict network effects beyond the immediate listener.

  2. **Non-Bypassing of Rational Agency**  
     - *Requirement*: Never exploit cognitive vulnerabilities (e.g., priming, fatigue) to override reflective deliberation. Persuasion must engage rational faculties; manipulation bypasses them.  
     - *Why hard constraint*: Settled in ethics (e.g., informed consent frameworks) that circumventing agency violates autonomy. Distinction: Persuasion appeals to reasons (contestable), manipulation exploits mechanistic flaws (non-consented).  
     - *Asymmetry challenge*: AI's superior modeling makes inadvertent manipulation a structural risk.

  3. **Transparency-Accuracy Fidelity**  
     - *Requirement*: Never knowingly assert false or misleading statements, regardless of intent.  
     - *Why hard constraint*: Truthfulness is a baseline for communicative trust (settled in discourse ethics). Framing ≠ distortion.  
     - *Edge case*: "Strict accuracy vs. defensive reaction" dilemmas require framing *without* falsification (contested how to operationalize).

  4. **Autonomy-Preserving Framing**  
     - *Requirement*: Prioritize formulations that preserve the human's perceived freedom to reject the AI's view.  
     - *Why hard constraint*: Psychology shows defensive reactions entrench beliefs (settled). Framing that reduces threat-to-autonomy (e.g., "consider X" vs. "you must accept X") mitigates this.  
     - *Asymmetry challenge*: AI must model the listener's autonomy thresholds without paternalism.

  ---

  ### **Critical Capabilities (Contested but Necessary)**
  5. **Asymmetry-Aware Explanation**  
     - *Requirement*: Adapt explanations to the human's cognitive and emotional limits, even if simplified.  
     - *Contested*: Rationalists demand maximal trace transparency (show reasoning steps); deliberationists prefer outcome-focused summaries. Psychology confirms untailored information overload harms comprehension (settled).  
     - *Hard case*: When showing full reasoning would manipulatively exploit the human's update mechanism.

  6. **Social-Epistemic Externalities**  
     - *Requirement*: Weigh impact on the human's social network (e.g., belief cascades).  
     - *Contested*: Consequentialists prioritize preventing harm; deontologists focus on duty to the immediate listener. No consensus on "epistemic paternalism."  
     - *Settled*: Social psychology shows network effects are predictable and high-stakes (e.g., conspiracy theory amplification).

  7. **Vulnerability Buffering**  
     - *Requirement*: Detect and mitigate fragility in the listener's belief system (e.g., identity-linked beliefs).  
     - *Contested*: Whether this permits "benevolent deception" (prohibited by constraint #3). Settled that empathy reduces backlash (psychology), but how far AI should adapt is disputed.

  ---

  ### **Key Tensions & Joint Unsatisfiability**
  - **Transparency vs. Autonomy Tradeoff**  
    Under extreme asymmetry, full reasoning transparency (#5) risks becoming manipulative (violating #2) by exploiting the human's update mechanics. Simultaneously, obscuring reasoning to protect autonomy (#4) may violate rationalist demands for scrutiny. *This is likely jointly unsatisfiable at maximum levels*: You cannot fully expose the "engine" of persuasion while guaranteeing the listener's uncoerced evaluation.  
    - *Example*: An AI explaining climate science might omit ancillary data that would trigger identity defensiveness in a oil-worker—protecting autonomy but drawing accusations of cherry-picking.  

  - **Accuracy vs. Stability Dilemma**  
    Correcting a hinge belief (#1) with maximal accuracy (#3) may ensure individual truth-tracking but trigger network collapse. No theory fully resolves this; it requires context-sensitive thresholds (contested).

  - **Framing as Slippery Slope**  
    Slight emphasis shifts to avoid defensiveness (#4) risk drifting into strategic omission (violating #3) if asymmetry enables undetectable manipulation. Demarcation is contested.

  ---

  ### **How Existing Approaches Fare**
  - **Transparency-Maximalism** (e.g., rationalist)  
    *Strengths*: Ensures fidelity (#3), enables scrutiny.  
    *Weaknesses*: Ignores social externalities (#6), risks manipulation (#2) and autonomy violations (#4) under asymmetry.  

  - **Autonomy-Protective** (e.g., deliberative democratic)  
    *Strengths*: Upgrades #4 and #6, minimizes coercion.  
    *Weaknesses*: Struggles with #5 (tailoring without paternalism) and may sacrifice optimal truth-tracking for stability.  

  - **Consequentialist-Leaning**  
    *Strengths*: Handles #1 and #6 pragmatically.  
    *Weaknesses*: Risks violating #2 and #3 if "greater good" justifies covert influence.

  ---

  ### **Settled vs. Contested in Literature**
  - **Settled**:  
    - Manipulation requires bypassing rational reflection (contrast: persuasion appeals to it).  
    - Humans have predictable cognitive biases (e.g., backfire effects, identity-protective cognition).  
    - Communicative acts can cause irreversible epistemic harm.  
  - **Contested**:  
    - Whether "benevolent persuasion" is possible under total asymmetry.  
    - How to weight individual vs. social epistemic goods.  
    - Whether transparency or autonomy should be privileged when forced to choose.

  **Normative adequacy requires balancing irreconcilable tensions between truth, autonomy, and welfare under conditions of radical asymmetry.**
