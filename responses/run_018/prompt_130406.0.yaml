answer: |-
  Here is a specification of desiderata for resolving the nonidentity problem, grounded in canonical cases and conceptual tensions. Each requirement includes its motivating case/pressure, and conflicting pairs are flagged. Scoring of existing approaches follows the checklist.

  ---

  ### **Core Desiderata for Any Resolution**
  1. **Welfare-Dependent Timing Sensitivity**  
     *Requirement:* Must judge that delaying conception to ensure a child has higher welfare (e.g., due to cured disease) is morally better.  
     *Case:* "Risky Policy" (Parfit): Conceiving now → child with lifelong disability; conceiving later → different, healthy child.  
     *Pressure:* Captures intuition that we ought to wait if welfare differs.

  2. **Non-Overlapping Population Comparison**  
     *Requirement:* Must condemn actions/policies that create a worse-off future population *even if no one in that population is worse off than they would otherwise be* (due to non-identity).  
     *Case:* "Climate Policy Choice": High emissions → Population A (low welfare, but lives worth living); low emissions → Population B (higher welfare, no overlap with A).  
     *Pressure:* Explains why reckless long-term policies are wrong despite non-identity.

  3. **Harm/Benefit Distinction Preservation**  
     *Requirement:* Must not conflate "harming a specific person" (making them worse off than baseline) with "failing to confer a benefit" (e.g., creating a person with lower welfare than an alternative person).  
     *Case:* "Surgery Choice": Failing to perform lifesaving surgery on an existing child (harm) vs. conceiving a disabled child instead of a healthy one (non-identity).  
     *Pressure:* Maintains moral asymmetry between harming identifiable individuals and affecting identity-dependent welfare.

  4. **"Wrongful Hardship" Explanatory Power**  
     *Requirement:* Must justify why creating a person whose life is barely worth living (but better than non-existence) can still be wrong.  
     *Case:* "14-Year-Old Girl" (Parfit): Conceiving a child likely to suffer severe hardship due to young motherhood.  
     *Pressure:* Upholds intuition that some existences, while net-positive, are unjustifiably burdened.

  5. **Identity Shuffling and Harm Assessment**  
     *Requirement:* Specify whether carbon policies that alter future identities "harm" anyone, addressing how personal identity metaphysics (endurantism vs. perdurantism) affects this verdict.  
     *Case:* "Centuries-Long Policy Shift": Policy X → descendants {Alice, Bob}; Policy Y → descendants {Chloe, Dan}. Is anyone in {Chloe, Dan} "harmed" by choosing Y?  
     *Pressure:* Resolves whether identity-shifting in climate ethics constitutes harm or merely differential benefit assignment.

  6. **Metaphysical Neutrality/Clarity**  
     *Requirement:* Must either be compatible with both endurantist ("enduring self") and perdurantist ("4D temporal parts") views of personal identity, or explicitly justify why one matters for harm.  
     *Case:* If Policy Y creates Chloe with hardship, is she "harmed" only if her identity is fixed pre-policy (endurantism)? Or is harm indexed to counterpart relations (perdurantism)?  
     *Pressure:* Avoids metaphysical arbitrariness in harm claims.

  7. **Non-Ad-Hoc Consistency**  
     *Requirement:* Must not rely on case-specific adjustments; principles should generalize across nonidentity cases.  
     *Pressure:* Prevents tactical evasion of core tensions (e.g., "wrongful hardship" only applying to individuals, not groups).

  8. **Policy Relevance**  
     *Requirement:* Must generate actionable duties for intergenerational justice (e.g., climate policy).  
     *Pressure:* Avoids theoretical solutions that paralyze real-world decision-making.

  ---

  ### **Flagged Tensions (Likely Jointly Unsatisfiable)**  
  - **D3 + D2 + D4:** Preserving a *strict person-affecting restriction* (D3: only actions harming specific individuals are wrong) conflicts with condemning identity-shifting choices that create worse-off groups (D2, D4). *Example:* Climate inaction creates a worse-off non-overlapping population (violates D2/D4), but no one is harmed relative to their existence baseline (satisfies D3).  
  - **D3 + D5:** If "harm" requires making someone worse off than *they* would otherwise be (actualist harm), identity shuffling (D5) cannot harm anyone. But intuitions demand accountability for reckless shuffling (D2, D4).  
  - **D4 + D6:** "Wrongful hardship" (D4) may require different identity metaphysics (D6) to avoid implying that Chloe is harmed by being created (contradicting D3).

  ---

  ### **Scoring Existing Approaches**  
  *(✓ = Satisfies; ✗ = Fails; ~ = Partially)*  

  | Desideratum          | Person-Affecting Restriction (PAR) | Wide Impersonal Consequentialism (WIC) | Actualist Harm View |
  |----------------------|-----------------------------------|---------------------------------------|---------------------|
  | **1. Timing Sensitivity** | ✗ (No duty to "possible people") | ✓ (Welfare-maximizing)               | ✗ (No one harmed) |
  | **2. Non-Overlap Condemnation** | ✗ (No victim)          | ✓ (Compares populations impersonally) | ✗ (No victim) |
  | **3. Harm/Benefit Distinction** | ✓ (Core strength)        | ✗ (Collapses harming/not benefiting) | ✓ (Strict harm focus) |
  | **4. Wrongful Hardship** | ✗ (No complaint)         | ✓ (Condemns low-welfare creation)    | ✗ (Not harmful) |
  | **5. Identity Shuffling & Harm** | ✗ (No harm)             | ~ (Harm irrelevant; focus on welfare) | ✗ (No harm) |
  | **6. Metaphysical Clarity** | ✓ (Harm independent of metaphysics) | ✓ (Ignores identity)                | ✗ (Depends on identity persistence) |
  | **7. Non-Ad-Hoc Consistency** | ✓ (Principled)          | ~ (General but counterintuitive re: D3) | ✓ (Principled) |
  | **8. Policy Relevance** | ✗ (Paralyzes climate action) | ✓ (Clear prescriptions)             | ✗ (Paralyzes) |

  **Summary of Tradeoffs**:  
  - **PAR** preserves harm intuitions (D3) but cannot condemn non-overlap harms (D2) or wrongful hardship (D4).  
  - **WIC** condemns bad outcomes (D1/D2/D4/D8) but sacrifices the harm/benefit distinction (D3).  
  - **Actualist Harm** strictly upholds D3 and D7 but fails virtually all applied cases (D1/D2/D4/D8).  

  ---

  ### **Diagnosis**  
  The core tension lies between **person-affecting intuitions** (D3: harming vs. not benefiting) and **impersonal outcome evaluations** (D2/D4: condemning avoidable hardship regardless of identity). No approach satisfies all desiderata because D2 and D4 require moral assessment of outcomes *without victims*, while D3 demands identifiable victims for wrongdoing. Metaphysical commitments (D5/D6) may refine but not resolve this. The problem likely lies in the criteria themselves: **D2, D3, and D4 form an inconsistent triad** under identity-affecting choices. A resolution must either:  
  - Reject D3 (allowing impersonal duties),  
  - Reject D2/D4 (absolving identity-shifting harms), or  
  - Redefine "harm"/"benefit" via metaphysics (e.g., modal accounts of harm), risking circularity.  

  Your frustration is well-founded—the desiderata expose a fracture in our moral concepts. The next step is deciding which intuitions to prioritize or reconceptualize.
