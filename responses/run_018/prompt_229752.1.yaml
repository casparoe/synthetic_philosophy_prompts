  ### Diagnostic Decision Tree: The Boundary Problem in Democratic Theory

  This decision tree helps you identify your underlying principle for determining *who constitutes the "we"* in democratic decisions. Answer each question based on your intuitive response to the concrete case. There are no right or wrong answers—this instrument sorts you by your judgments, not by labels.

  ---

  #### **Node 1: Factory Emissions Test**  
  *A factory in Country A emits pollution that drifts across the border, harming residents in Country B. Should residents of Country B have a formal right to vote in Country A’s decision about regulating the factory?*  
  - **Yes** → Go to Node 2 (Policy-dependent demos: the "we" is defined by the decision's effects)  
  - **No** → Go to Node 3 (Pre-political demos: the "we" is fixed before the decision)  

  ---

  #### **Node 2 (Policy-dependent branch): Nuclear Waste Test**  
  *A government chooses a site for long-term nuclear waste storage. This binds people not yet born. Should the interests of these future people be given weight in the decision?*  
  - **Yes** → Go to Node 4  
  - **No** → Go to Node 5  

  ---

  #### **Node 4: Future Generations as More Than Proxies?**  
  *Can future people’s interests count directly (e.g., as a moral constraint), or must the living act solely as their proxies (e.g., voting based on predicted preferences)?*  
  - **Directly** → Go to Node 6  
  - **Only through proxies** → *Unnamed position* (Why? Granting weight to future interests but requiring proxy representation collapses into living people voting for themselves, undermining the principle.)  

  ---

  #### **Node 6: Rent Control Standing Test**  
  *A city considers rent control. Long-distance commuters work in the city but live elsewhere and cannot vote there. Should they have a formal right to vote on this ordinance?*  
  - **Yes** → *All-affected interests principle* (You grant standing to all whose interests are meaningfully affected, including non-residents.)  
  - **No** → Go to Node 7  

  ---

  #### **Node 7: Rent Control Interests Test**  
  *Even if commuters shouldn’t vote, should the city council be required to consider their interests (e.g., commuting costs) when justifying the rent control decision?*  
  - **Yes** → *All-affected interests principle* (You grant standing to have interests counted, but not necessarily a vote.)  
  - **No** → *Unnamed position* (Why? Policy-dependent demos requires *some* role for affectedness, but you deny it here—incoherent with Node 2.)  

