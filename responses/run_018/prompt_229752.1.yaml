  - **Yes** → *Unnamed position* (Why? Including non-citizen residents *and* citizens abroad fits no standard pre-political principle; it mixes territory/citizenship.)  
  - **No** → *Territorial principle* (You grant standing only to residents, regardless of citizenship.)  

