  ### Named Leaves (Terminal Positions)
  - **All-affected interests principle**: Standing (vote/voice) or moral consideration for all whose interests are meaningfully impacted.  
  - **Stakeholder principle**: Standing for those with intense, direct stakes in the outcome.  
  - **Territorial principle**: Standing only for residents within a geographic area.  
  - **Citizenship principle**: Standing only for legal citizens.  
  - **Territorial-citizenship status quo**: Standing only for resident citizens.  
  - **Cultural/national demos**: *Not directly reached* (Why? The tree lacks a cultural case to split this from citizenship/territory; e.g., "Should a culturally assimilated non-citizen resident vote, while an unassimilated citizen abroad cannot?" would test it.)  
