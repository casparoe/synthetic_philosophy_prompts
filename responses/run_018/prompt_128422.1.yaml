prompt: |-
  Write a decision-tree taxonomy that sorts positions on the scientific demarcation problem, treating falsificationism not as a single leaf but as an internal branching structure that splits on its well-known failure modes. The tree must begin with the root commitment: "There is a principled boundary separating scientific from non-scientific inquiry" versus its denial. From there, move through diagnostic nodes that present concrete cases rather than named theories. The required branching nodes and their illustrative cases are: (1) whether a permanently untestable but mathematically coherent framework—consider certain current formulations of string theory—should be excluded from science; (2) whether non-repeatable historical reconstructions—such as the causal explanation of the Cretaceous-Paleogene mass extinction—count as scientific despite lacking laboratory repetition; (3) whether a theory that can always accommodate anomalous data by adding auxiliary hypotheses (the conventionalist stratagem problem) is thereby immunized and should be demoted; (4) whether the Duhem-Quine thesis undermines any attempt at isolating and falsifying a single theoretical claim. From these nodes, derive exactly eight leaf positions.

  Each leaf must carry a label (use established names where they exist—e.g., naive Popperian falsificationism, Lakatosian research-programme demarcation, Kuhnian paradigm-bound science, Feyerabendian epistemic anarchism, institutionalist sociology of science, predictive-calibration demarcation, revision-directionality demarcation, or "unnamed/unoccupied") and a one-sentence statement of its most awkward commitment.

  You must inject one non-standard diagnostic axis called "revision directionality": this axis asks whether a research program facing anomaly must alter its core theoretical commitments, or whether preserving the core while revising peripheral commitments counts as legitimate theoretical development rather than immunization. Place this axis at the level that separates progressive problem-shifts from protective stratagems. Explicitly flag any pair of leaves your tree cannot genuinely separate—particularly whether Kuhnian paradigm-preservation and conventionalist-stratagem defense collapse into the same position.

  Present the result as a JSON object with the following exact schema:
  {
    "root_commitment": string,
    "diagnostic_axis_revision_directionality": {
      "description": string,
      "branch_questions": [string, string]
    },
    "nodes": [
      {
        "node_id": string,
        "question": string,
        "case_illustration": string,
        "branches": [string, ...]
      }
    ],
    "leaves": [
      {
        "label": string,
        "awkward_commitment": string,
        "occupied": boolean,
        "nearest_standard_name": string
      }
    ],
    "unseparated_pairs": [
      {
        "leaf_a": string,
        "leaf_b": string,
        "reason": string
      }
    ],
    "note_on_falsificationism": string
  }

  Do not include bibliographies, citations, reading lists, or verbatim quotations from any philosopher; paraphrase all positions in your own wording. Do not depend on specific publication dates, page numbers, or titled works.
