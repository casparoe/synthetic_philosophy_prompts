answer: |-
  Here is the full specification of desiderata for an adequate theory of standing to blame, treating hypocrisy as a structural stress-test revealing the concept's purpose. The desiderata are grouped by category (Phenomena, Distinctions, Consistency Conditions), with motivating cases, negotiability flags, and core tensions identified.

  ---

  ### **I. Phenomena to Capture (The Hard Cases)**
  1. **Unconditional Victim Standing**  
     *Case:* A victim of theft blames her perpetrator, even if she herself has stolen in the past.  
     *Requirement:* Victims must possess standing to blame their direct wrongdoer *regardless* of their own moral flaws.  
     *Negotiability:* **Non-negotiable**. This is foundational to blame as a tool of victims.

  2. **Third-Party Vice in Distinct Domain**  
     *Case:* A habitual liar blames a friend for cruelty to animals.  
     *Requirement:* Standing cannot be universally voided by unrelated moral failures. Blame about fault X may survive if the blamer’s vice concerns Y (where X ≠ Y).  
     *Negotiability:* Negotiable *only* in degree (some theories may weaken standing here).

  3. **Structural Complicity Without Personal Fault**  
     *Case:* A wealthy executive condemns sweatshop labor while benefiting from exploitative systems she didn’t create.  
     *Requirement:* Standing may be compromised by *systemic* entanglement in the wrong, even without identical personal wrongdoing.  
     *Negotiability:* **Non-negotiable** for structural realism; contested by individualism.

  4. **Diminished-But-Not-Erased Standing**  
     *Case:* A recovering alcoholic condemns drunken violence, but with reduced credibility due to recent relapses.  
     *Requirement:* Hypocrisy can attenuate standing (e.g., making blame less effective or authoritative) without annihilating it.  
     *Negotiability:* **Non-negotiable** (rejects binary standing).

  5. **Epistemic Blindness vs. Volitional Hypocrisy**  
     *Cases:*  
     - *Epistemic:* A narcissist unknowingly condemns in others the selfishness he exhibits.  
     - *Volitional:* A politician rails against corruption while taking bribes.  
     *Requirement:* Volitional hypocrisy must more severely undermine standing than epistemic blindness.  
     *Negotiability:* Negotiable in *how* severity is weighted, but distinction must be preserved.

  6. **Victim-Authorized Standing**  
     *Case:* A victim of assault authorizes her friend (who is complicit in rape culture) to blame the perpetrator.  
     *Requirement:* Victims can *transfer* standing to otherwise disqualified blamers, overriding typical barriers.  
     *Negotiability:* **Non-negotiable** for victim-centric accounts; contested by purity theories.

  ---

  ### **II. Distinctions to Preserve**
  7. **Lacking Standing vs. Conditional/Delegated Standing**  
     *Case:* A non-victim with identical fault (e.g., a thief blaming theft) lacks standing; a victim-authorized third party possesses delegated standing.  
     *Requirement:* Must distinguish total disqualification from weakened, revocable, or borrowed authority.  
     *Negotiability:* **Non-negotiable** (prevents collapse of blame’s relational structure).

  8. **Identical Fault vs. Structurally Related Fault**  
     *Case:* Condemning greed while being lustful (distinct vices) vs. condemning greed while being greedy (identical vice).  
     *Requirement:* Hypocrisy about the *identical* fault is more corrosive to standing than about a *related* fault.  
     *Negotiability:* Negotiable in defining "relatedness," but hierarchy must exist.

  9. **Moral Standing vs. Epistemic Entitlement**  
     *Case:* A corrupt judge may *know* a defendant is guilty (epistemic entitlement) but lack *moral authority* to condemn (moral standing).  
     *Requirement:* Standing is not reducible to factual correctness about the wrong.  
     *Negotiability:* **Non-negotiable** (prevents instrumentalization of blame).

  10. **Forfeiture vs. Waiver/Transfer**  
      *Case:* A wrongdoer forfeits standing by their own actions; a victim waives standing requirements for a delegate.  
      *Requirement:* Standing’s loss (forfeiture) must differ conceptually from its gift (waiver/transfer).  
      *Negotiability:* **Non-negotiable** (anchors agency in victims and wrongdoers).

  11. **Performative, Structural, and Epistemic Hypocrisy**  
      *Cases:*  
      - *Performative:* Blaming others for faults you actively commit.  
      - *Structural:* Blaming while embedded in systems that enable the wrong.  
      - *Epistemic:* Blaming without self-awareness of similar faults.  
      *Requirement:* These forms impact standing differently (performative > structural > epistemic).  
      *Negotiability:* Negotiable in ordering, but distinction must hold.

  ---

  ### **III. Consistency Conditions**
  12. **Alignment with Moral Address Practices**  
      *Requirement:* Must explain why we intuitively reject hypocritical blame (e.g., "Practice what you preach") yet permit victims to blame despite flaws.  
      *Negotiability:* **Non-negotiable** (empirical bedrock).

  13. **Compatibility with Moral Psychology**  
      *Requirement:* Must cohere with findings (e.g., hypocritical blame triggers resentment; victim blame commands attention even when imperfect).  
      *Negotiability:* **Non-negotiable** for naturalistic accounts.

  14. **Non-Idolatry of Purity**  
      *Requirement:* Standing cannot demand moral perfection, or else blame becomes impossible.  
      *Negotiability:* **Non-negotiable** for non-sectarian theories.

  15. **Gradable (Non-Binary) Standing**  
      *Requirement:* Standing admits of degrees (strong, weak, conditional) rather than all-or-nothing.  
      *Negotiability:* Camp-specific. Binary views exist but fail **Diminished-But-Not-Erased Standing**.

  ---

  ### **Core Tensions & Dealbreakers**
  - **The Trilemma:**  
    *Unconditional Victim Standing* + *Widespread Third-Party Blame* + *Blamer Purity Requirement* are **jointly unsatisfiable**.  
    *Resolution:* Sacrifice either universal blamer purity (allowing structurally complicit blame) or unrestricted third-party blame (requiring victim-authorization/delegation).

  - **Strictest Requirement:**  
    **Structural Complicity Without Personal Fault** eliminates the most accounts (e.g., comparative-moral-record views ignore systemic factors; pure relational accounts struggle with non-victim complicity).

  - **Fatal Challenge:**  
    If **Forfeiture vs. Waiver/Transfer** collapses, victim agency and wrongdoer accountability become incoherent. This distinction *must* hold.

  ---

  ### **Scoring Major Families of Views**
  - **Pure Relational/Victim-Waiver Accounts**  
    *Strengths:* Captures **Unconditional Victim Standing**, **Victim-Authorized Standing**, **Forfeiture vs. Waiver**.  
    *Weaknesses:* Struggles with **Structural Complicity**, **Third-Party Vice**, and **Epistemic Blindness vs. Volitional Hypocrisy**.

  - **Comparative Moral Record Accounts**  
    *Strengths:* Handles **Volitional Hypocrisy**, **Diminished Standing**, **Identical vs. Related Fault**.  
    *Weaknesses:* Violates **Unconditional Victim Standing**, ignores **Structural Complicity**, often binary.

  - **Hypocrisy-Irrelevant Accounts**  
    *Strengths:* Permits widespread blame.  
    *Weaknesses:* Fails **Diminished Standing**, **Moral Psychology Consistency**, and all hypocrisy cases. Collapses **Moral vs. Epistemic Standing**.

  ---

  ### **Critical Assessment of Framing**
  The framing is **not fundamentally confused** but exposes tensions:
  1. **Standing is unitary** in serving one core purpose: *regulating moral address to preserve its authority and uptake*.
  2. **Hypocrisy is the optimal lens** because it tests when blame’s *performative force* is undermined by the blamer’s position.
  3. **Forfeiture/Waiver distinction holds** if standing is a *relational license* (like a moral power) rather than a property.

  **The central insight**: Standing mediates between blame’s *truth* (the wrong) and its *function* (moral repair). Hypocrisy stresses this by revealing that the blamer’s role in the moral ecosystem affects whether blame can achieve its ends. No theory ignoring this duality survives the cases.
