prompt: |-
  I dont know if there's a established term for this pattern I keep seeing in talks about art and testimony. Example one: someone says a painting is overwhelming, I look and feel flat, and instead of doubting myself I start doubting whether they actually felt overwhelmed or were just performing connoisseurship. Example two: people defend learning aesthetics from others by comparing it to trusting a scientist, but the comeback isnt that art is subjective - it's that scientists dont fake data for status, while critics might fake awe. So the argument stops being about whether testimony can carry knowledge and becomes about whether we can verify the speaker's emotional state is genuine. Is there an established concept that captures this exact shift from an epistemic worry to a worry about performed sincerity? If not, can you coin something like affective credentialism and say exactly where its edges are - especially how it differs from just not trusting experts? Write the response in American English as a numbered list of exactly five items, each a sentence or two, no intro or conclusion.
reasoning: |-
  Okay, the user is describing a specific pattern they've noticed in discussions about art and testimony. They give two examples: one where someone claims a painting is overwhelming but the viewer feels nothing, leading to suspicion about whether the awe is genuine or performative; another where the defense of trusting aesthetic judgments is countered not by subjectivity arguments but by questioning if critics fake emotions for status. 

  The core issue seems to be a shift from debating knowledge transmission ("can testimony teach me about art?") to interrogating emotional authenticity ("is this person actually feeling what they claim?"). This feels distinct from general skepticism about expertise - it's specifically targeting the sincerity of affective responses. 

  I need to address both parts: first identifying if an established term exists (I don't think one does), then coining a precise phrase that captures this phenomenon without overgeneralizing. "Affective credentialism" seems apt, but must clearly demarcate it from related concepts like ad hominem attacks or debates about subjectivity. 

  Key differentiators to highlight: 
  - It bypasses the artwork's qualities entirely to focus on the testifier's interior state
  - Unlike general distrust of experts, it accepts their knowledge but suspects emotional performance 
  - The "credentialism" angle emphasizes how sincerity becomes a gatekeeping tool

  The user clearly wants analytical precision - they're mapping philosophical terrain. Their examples suggest frustration with conversations derailed by performativity suspicions. Since they requested a numbered list without intros/conclusions, I'll structure it as five tight points: establish the pattern, name it, define boundaries, contrast with expert distrust, and note its distinct epistemic damage. 

  American English phrasing is straightforward: avoid "one might argue" constructions, use "fake" instead of "feign," and keep sentences compact. The coined term should feel clinically descriptive rather than judgmental.
answer: |-
  Here's the response as requested:

  1.  The specific pattern you describe, shifting from debating the epistemic value of testimony about art to questioning the sincerity of the speaker's expressed emotional state, doesn't have a single, universally established philosophical or critical term.
  2.  Coining "Affective Credentialism" effectively captures this move: it's the demand to verify the genuine internal affective state (like awe or overwhelm) of the testifier as a prerequisite for accepting their aesthetic testimony, treating emotional sincerity as a necessary credential.
  3.  Affective Credentialism differs from simply distrusting experts because it specifically targets the *emotional authenticity* claimed in the testimony, not necessarily the testifier's knowledge, skill, or potential biases about the artwork itself or art history.
  4.  Its boundary is sharp: it applies *only* when the core objection shifts from "Is this artwork actually good/overwhelming?" or "Can you teach me to see it?" to "Is the speaker *really* feeling what they say they are, or is this performance for status/connoisseurship?"
  5.  This differs significantly from arguments about art's subjectivity (which question if aesthetic properties are real or knowable) or general expert skepticism (which questions knowledge/objectivity), as Affective Credentialism uniquely makes the *speaker's internal emotional state* the contested, unverifiable focal point undermining testimony.
