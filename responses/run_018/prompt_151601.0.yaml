  Opening: Punchy von Neumann quote to hook both crowds. Then immediately clarify—"this isn’t just a metaphor; it’s a design constraint." 
  Middle: Contrast standard scholarship (tech as evolving system) with user’s twist (intent as parasite). Flag the pivot loudly: "Here’s where I diverge…" 
  Close: Practical hook—"So when we design institutions, we can’t just wish intent into existence. How do we host the parasite better?" 

  Tone: 
