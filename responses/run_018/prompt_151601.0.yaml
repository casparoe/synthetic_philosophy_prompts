answer: |-
  Here’s a draft for your 5-minute opener—casual, connective, and walking that tightrope:

  ---

  "Hey everyone—really excited to dig into institutional design with you all. Before we start brainstorming solutions, I wanna ground us in a weird little idea from John von Neumann. Some of you historians know his late work intimately; for others, he’s mostly the computing pioneer. But right at the end of his life, he got obsessed with this biological metaphor for technology. He wrote that technologies **don’t survive because we ‘choose’ them rationally—they survive because they replicate, adapt, and compete like organisms in an ecosystem.**  

  That’s not just poetic. It’s a constraint. If institutions are built *on* or *around* tech (and today, they always are), then their ‘design’ isn’t just about our blueprints or values. It’s shaped by whatever helps the underlying tech reproduce itself. Think of bureaucracies fossilizing around legacy software, or platforms bending governance to their scaling logic. The tools aren’t passive—they’re active evolutionary players.  

  Now—fair warning—this next bit is *my* spin, not textbook von Neumann. But if tech evolves biologically, then **human collective intent isn’t the driver—it’s more like a parasite.** Not ‘parasite’ in a moral sense, but in a structural one: our goals can only latch onto institutions *if* they align with the reproductive needs of the systems we’re using. If they don’t? Our ‘intent’ gets shed. Adaptation favors the tool’s survival, not our idealism.  

  So when we talk about ‘designing’ institutions for long-term risk, we can’t start from pure human values or shared goals alone. We have to ask: **‘What’s already replicating here? How’s our intent hitching a ride?’** Because if we ignore that parasitic dance—if we pretend institutions are blank slates—we’ll keep building atop quicksand.  

  Not the cheeriest framing, I know! But maybe it’s useful friction. Let’s see where it takes us."

  ---

  **Why this works:**  
  - **Audience bridge:** Name-checks historians’ expertise while framing core ideas accessibly for non-specialists.  
  - **Scholarship guardrails:** Explicitly tags the "parasite" framing as *your* synthesis ("my spin, not textbook").  
  - **Structural punch:** Rooting design in replication/adaptation *forces* the constraint you wanted.  
  - **Casual but crisp:** Contractions, italics for emphasis, no citations. Feels spoken.  
  - **No overclaim:** Avoids implying von Neumann would endorse your extension.  

  **Delivery tip:** Pause before "my spin," lean into "parasite" with a half-smile (disarm the edginess), and end on "useful friction" to pivot to collaboration. Good luck with the workshop!
