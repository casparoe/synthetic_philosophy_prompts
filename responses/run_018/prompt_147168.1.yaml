prompt: |-
  Having spent thirty years in experimental physics before turning, in retirement, to the study of classical Indian epistemology, I am struck by how the Nyāya school's four pramāṇas—pratyakṣa (perception), anumāna (inference), upamāna (comparison or analogy), and śabda (testimony)—map imperfectly onto the methods I once trusted in the laboratory. Rather than asking for a historical summary, I want an evaluation on a specific dimension: please rank these four knowledge-sources according to what I will call their "error-correction resilience," defined as the capacity of a community of inquirers to identify and rectify a false deliverance generated by that particular source without circularly relying on one of the other three. Assign each pramāṇa an integer score from 1 (least resilient) to 10 (most resilient), and in a concise paragraph for each, justify the score by appealing to internal features of the Nyāya account—for instance, the conditions of invariable concomitance (vyāpti) in anumāna, the dependency relations that constrain upamāna, the authority conditions for śabda, or the directness and fallibility conditions discussed for pratyakṣa. I ask that you treat the framework on its own terms rather than reducing it to a modern philosophy of science gloss, and that you present your answer in American English. Please do not include bibliographies, citation lists, or reading recommendations; I am working without library access and need only the conceptual analysis.
reasoning: |-
  Okay, the user has a fascinating background—thirty years in experimental physics now studying classical Indian epistemology, specifically the Nyāya school's four pramāṇas. They want a very specific analysis: ranking these knowledge sources by "error-correction resilience," defined as a community's ability to identify and correct false outputs without circularly relying on the other three pramāṇas. 

  Hmm, this is a sophisticated request. They're clearly not looking for historical overviews but a rigorous conceptual evaluation within Nyāya's own framework. The physics background suggests they'll appreciate precision, while the retirement shift to Indian philosophy indicates deep intellectual curiosity. The "working without library access" detail implies they need self-contained reasoning, not citations.

  Let me break this down. First, I need to assess each pramāṇa's internal error-correction mechanisms per Nyāya texts:
  - Pratyakṣa (perception): Direct but fallible. Nyāya admits illusions and sense defects. A community could cross-verify identical perceptions (e.g., multiple witnesses), but contradictions only reveal error—they can't resolve *which* perception is faulty without inference. Score low (2/10).
  - Anumāna (inference): Relies on vyāpti (universal concomitance). A community can debate premises and counterexamples. This allows non-circular error detection by exposing flawed vyāpti through contradictory instances. Strong resilience (8/10).
  - Upamāna (analogy): Depends on prior knowledge and testimony. If the analogy fails, you can't verify without circling back to testimony or perception. Very limited self-correction (1/10).
  - Śabda (testimony): Requires checking the speaker's credibility, but that itself needs other pramāṇas. Cross-referencing sources helps, but contradictions can't be resolved internally. Moderate (5/10).

  The user emphasized avoiding modern scientific parallels, so I'll strictly use Nyāya terms like vyāpti or āpta. Their "American English" request means avoiding Britishisms and keeping paragraphs concise. 

  Biggest challenge: justifying scores without external references. For upamāna, I'll highlight its dependency chain; for anumāna, the public debatability of vyāpti. The physics-trained mind will likely probe loopholes, so arguments must be watertight. 

  Final thought: They're essentially asking which pramāṇa best supports Popperian falsification within its own framework. Irony noted, but won't mention it.
answer: |-
  Based on Nyāya's internal criteria for validity and the inherent mechanisms within each *pramāṇa* for community-based error detection and correction without circular reliance on the other three, here is the ranking by "error-correction resilience":

  1.  **Anumāna (Inference): Score 8/10**  
      Anumāna's resilience stems directly from its core requirement: *vyāpti* (invariable concomitance). A community identifies error by finding a counter-example (*vyabhicāra*) where the purported *hetu* (reason) exists without the *sādhya* (probandum), or vice versa. This is an *internal* check within the inferential process itself. The validity of the counter-example itself relies on perception (*pratyakṣa*) – seeing smoke without fire, or fire without smoke. Crucially, however, **this perception is not used to *establish* a new truth or *justify* the inference; it functions solely to *falsify* the claimed *vyāpti* by exposing a contradiction within the inferential structure's universal premise.** The community doesn't need to appeal to *another* inference, analogy, or testimony *about the inference* to see the logical flaw revealed by the perceptual counter-instance. Error-correction rests on demonstrating failure to meet the *pramāṇa*'s own defining condition (*vyāpti*), using perception strictly for falsification.

  2.  **Śabda (Testimony): Score 5/10**  
      Śabda's resilience depends heavily on testing the *āptatva* (trustworthiness) of the source, defined as competence and truthfulness. A community can identify potential error *internally* by detecting inconsistencies within the testimony itself (*vākyabādha*) or contradictions between different statements from the *same* trusted source. However, **rectifying the error – determining *which* part is false and what the truth *is* – fundamentally requires resorting to other *pramāṇas*.** Was the source incompetent on this point? Verifying that requires perception, inference, or testimony about *their* reliability. Was the statement misheard/misremembered? This requires perceptual verification. While internal consistency checks offer *some* non-circular error *detection*, genuine error *correction* inherently breaks self-containment and relies on other *pramāṇas* to establish the truth that falsifies the testimony.

  3.  **Pratyakṣa (Perception): Score 2/10**  
      Nyāya acknowledges perception's fallibility due to *doṣas* (defects in sense organs, mind, or external conditions). A community can identify *potential* error through disagreement: conflicting perceptual reports from seemingly competent observers under similar conditions flag inconsistency. However, **resolving *which* perception is erroneous and *why* cannot be done solely within perception itself.** Determining if it's *dvitīyākṣadṛṣṭa* (a defect in the perceiver's eye), *mānasa-dṛṣṭa* (a mental defect), or *sāmānyadṛṣṭa* (object-related defect) necessitates inference (e.g., inferring a visual defect from patterns of error) or testimony (e.g., a doctor's diagnosis). Perception provides the conflicting data, but adjudicating the conflict requires tools beyond its direct grasp. Its immediacy hinders its self-correction capacity.

  4.  **Upamāna (Comparison/Analogy): Score 1/10**  
      Upamāna relies crucially on prior knowledge gained through other *pramāṇas*: knowledge of the standard (e.g., a cow from prior perception/testimony), knowledge of the similarity (e.g., "gavaya is like cow"), and the subsequent identification relying on this similarity. **Error-correction is almost entirely dependent on these external sources.** If the analogy fails (e.g., the gavaya is *not* cow-like in a crucial way), identifying the error requires re-examining the knowledge of the standard (perception/testimony) or the judgment of similarity (perception/inference). There is no significant *internal* mechanism within the analogical process itself that a community can systematically employ to detect and correct its own errors without immediately reverting to perception, inference, or testimony to validate the components of the analogy. Its derivative nature offers minimal self-contained resilience.
