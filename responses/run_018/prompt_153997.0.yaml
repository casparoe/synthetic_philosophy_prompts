    Final Procedure Outline:

    **Audit Procedure for Belief Revision**

    Time Limit: 30 minutes

    Steps:

    1. (2 min) Define the change event: [Description]

    2. (10 min) Direct Entailments (Bin 1):
          - Starting from the change event, traverse the dependency graph forward until:
              a) You hit a shielded default (then stop that branch and note the default as shielded in step 3).
              b) You hit a belief about human intentions, market prices, or legal liability (then mark that belief as a ghost frame in bin 3 and stop the branch).
          - Every belief that is updated as a direct consequence of the change and that is within the technical domain (and not shielded) goes into bin 1.

    3. (5 min) Shielded Defaults (Bin 2):
          - Review the list of default beliefs (that are not in bin 1). For each, check if the change breaks the condition for the default. If not, mark as shielded (bin 2). If there is any doubt, mark as ghost frame (bin 3) and document the doubt as a value judgment (if it is a judgment call).

    4. (10 min) Ghost Frames (Bin 3):
          - Identify:
