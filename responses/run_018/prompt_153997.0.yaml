prompt: |-
  You advise the maintenance team for an autonomous warehouse network that must revise its operational belief database whenever a hardware component or regulatory constraint changes. The frame problem—knowing precisely which inferences to drop and which to preserve—makes every update risk either leaving hidden errors intact or cascading into irrelevant domains. Design a reusable audit procedure that the team can complete in under thirty minutes per change event. The procedure must require the auditor to sort every affected belief into three bins: direct entailments of the change, shielded defaults that survive untouched, and “ghost frames” (inherited but now-untracked assumptions that have not been explicitly invalidated and must be manually exposed). It must specify a hard stopping rule that prevents revision from reaching beliefs about human intentions, market prices, or legal liability; it must flag every step that depends on a value judgment rather than a technical check; and it must include a documentation protocol for unresolved conflicts between ghost frames. Apply the procedure to three cases: lowering the weight limit on a loading dock, where energy-cost defaults should survive but queue-order assumptions must be flagged; installing a fire-suppression system that disables certain sensors, where inventory-tracking beliefs should be shielded despite the sensor loss; and a third case in which the procedure yields a result the team is likely to resist. Conclude by stating exactly what the procedure cannot settle—especially when ghost frames contradict one another—and how the residual uncertainty should be recorded for the next audit cycle.
reasoning: |-
  We are designing an audit procedure for updating the belief database in an autonomous warehouse network.
   The procedure must sort every affected belief into three bins:
    1. Direct entailments of the change: beliefs that are directly and necessarily affected by the change and must be updated.
    2. Shielded defaults: beliefs that survive untouched because they are shielded by the structure of the system (e.g., defaults that are independent of the change).
    3. Ghost frames: inherited but now-untracked assumptions that have not been explicitly invalidated and must be manually exposed.

   The procedure must have:
    - A hard stopping rule that prevents revision from reaching beliefs about human intentions, market prices, or legal liability.
    - Flagging of every step that depends on a value judgment (so that the auditor is aware when they are making a non-technical decision).
    - A documentation protocol for unresolved conflicts between ghost frames.

   We are to apply the procedure to three cases.

   Steps for the audit procedure:

   1. **Identify the Change Event**: Clearly define the change (e.g., lowering weight limit, installing fire-suppression system).
   2. **Map Direct Entailments**:
        - Identify all beliefs that are directly and necessarily affected by the change. This is done by following logical dependencies from the change event until we hit the stopping rule.
        - Stopping rule: If a belief concerns human intentions, market prices, or legal liability, stop and do not revise further. Instead, mark the last technical belief as a ghost frame (if it leads to such non-technical beliefs) and document the path.
   3. **Identify Shielded Defaults**:
        - These are beliefs that are not in the direct entailment path and are not affected by the change. They are typically defaults that are independent or have been designed to be robust to such changes.
        - The auditor must check if the change breaks any dependency that the default relies on. If not, it is shielded.
   4. **Flag Ghost Frames**:
        - These are beliefs that were inherited from previous states (or from higher-level assumptions) that are not directly affected by the change but might be invalidated because they rely on conditions that the change might have indirectly altered. However, note that they are not explicitly invalidated by the change and hence must be manually checked.
        - Also, when the stopping rule is triggered, the technical belief that leads to non-technical beliefs (which are out of scope) becomes a ghost frame because we are not tracking beyond that point.

   5. **Value Judgment Flagging**:
        - At every step where the auditor must make a decision that is not purely based on a technical dependency (e.g., deciding that a default is shielded because it is "unlikely" to be affected, or deciding that a ghost frame is low risk), they must flag that step and document the reasoning.

   6. **Documentation Protocol for Unresolved Conflicts between Ghost Frames**:
        - If two or more ghost frames are found to be in conflict (i.e., they lead to contradictory conclusions), the auditor must document:
            a) The conflicting ghost frames.
            b) The potential impact of the conflict (e.g., which operations might be affected).
            c) The reasoning why the conflict was not resolved (e.g., lack of time, requires higher-level decision).
            d) A plan for when and how the conflict should be resolved (e.g., in the next audit cycle, or by a specific team).

   7. **Hard Stopping Rule**:
        - When tracing dependencies, if the next belief to be considered is about human intentions, market prices, or legal liability, stop the revision for that path. The last technical belief that led to this non-technical one is marked as a ghost frame (because we are not tracking beyond that point). Also, document the path that was stopped.

   8. **Time Constraint**: The entire procedure must take under 30 minutes. Therefore, the auditor must be efficient. We can design the procedure to be done with a checklist and a dependency graph that is precomputed (or maintained) for the system.

   Implementation of the procedure:

    - Precondition: The system has a dependency graph of beliefs (which can be a directed graph where nodes are beliefs and edges represent dependencies). This graph must be maintained and available.

    Step-by-Step:

    1. **Change Event Definition** (2 minutes):
          - Write down the change event in precise terms.

    2. **Direct Entailments** (10 minutes):
          - Starting from the change event, traverse the dependency graph forward (i.e., from causes to effects) and mark every belief that is directly affected until:
              a) You hit a belief that is shielded (by the structure, e.g., a default that is known to be robust) and then stop that branch.
              b) You hit the stopping rule (non-technical domain: human intentions, market prices, legal liability) -> then mark the last technical belief as a ghost frame and stop.
          - For each belief encountered, if it is a direct entailment, put it in bin 1. If it leads to a non-technical domain, then the last technical belief goes to bin 3 (ghost frame) and stop that branch.

    3. **Shielded Defaults** (5 minutes):
          - Look at the defaults (beliefs that are not in the direct entailment path). Check if the change breaks any of the conditions that the default relies on. If not, mark as shielded (bin 2). If there is any doubt, mark as a ghost frame (bin 3) and document.

    4. **Ghost Frame Identification** (10 minutes):
          - Identify beliefs that are not in the direct entailment path but might be affected because they rely on conditions that the change might have altered. This includes:
              - Beliefs that are derived from the changed component but were not caught in the direct entailment because the dependency was indirect or non-monotonic.
              - Beliefs that were inherited from a previous state and have not been updated because they are not directly dependent, but the change might invalidate them.
          - Also, include the ones found in step 2 when the stopping rule was triggered.
          - Flag any step in this identification that requires a value judgment (e.g., "this belief is unlikely to be affected, so I won't mark it as ghost frame" is a value judgment and must be flagged).

    5. **Conflict Documentation** (3 minutes):
          - If any ghost frames are in conflict, document the conflict as described above.

    Total: 30 minutes.

   Now, apply to the three cases.

   Case 1: Lowering the weight limit on a loading dock.

    - Change: The maximum weight allowed on dock X is reduced from W1 to W2.
    - Direct entailments (bin 1):
          - Beliefs about the maximum weight capacity of dock X are updated.
