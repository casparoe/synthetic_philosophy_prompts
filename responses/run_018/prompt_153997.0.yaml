              - The ghost frames in conflict.
              - The nature of the conflict.
              - Potential impact on operations.
              - Why it is unresolved (e.g., requires non-technical input, time constraints).
              - Plan for resolution (e.g., next audit cycle, external review).

    Value Judgment Flagging:
          - During steps 2-4, whenever the auditor makes a decision that is not purely based on the dependency graph (e.g., "I think this default is unlikely to break"), they must flag it and note the reasoning.

    Documentation:
          - All bins are documented in the audit log.
          - The conflict documentation (if any) is attached.
          - The value judgments are listed with reasoning.

    Residual Uncertainty:
          - All ghost frames (especially conflicting ones) and value judgments are the residual uncertainty. They are recorded for the next audit cycle.

    Note: The dependency graph is critical. It must be maintained and available at the time of the audit.

    This procedure is reusable and designed to be completed in 30 minutes.
answer: |-
  ### Audit Procedure for Belief Database Revision

  **Objective**: Efficiently update the belief database within 30 minutes per change event, categorizing beliefs into three bins while enforcing constraints and documenting unresolved conflicts.

  **Procedure Steps** (Time: 25 minutes + 5-minute buffer):
  1. **Define Change Scope** (2 minutes):  
     - Document the change (e.g., "Fire-suppression system installed in Zone A").  
     - List hardware/regulatory components directly altered (e.g., sensors, weight limits).  
     - **Stopping Rule Trigger**: If the change involves human intentions, market prices, or legal liability, exclude these domains immediately.

  2. **Trace Direct Entailments** (Bin 1, 8 minutes):  
     - Identify beliefs directly inferable from the change using logical dependencies (e.g., "Sensor X disabled → Camera Y activation required").  
     - **Hard Stopping Rule**: Halt if a dependency chain reaches human/market/legal beliefs. Flag the last technical belief as a "boundary ghost frame" (subtype of Bin 3).  
     - **Value Judgment Flag**: Highlight steps requiring subjective interpretation (e.g., "Is Camera Y’s activation *necessary* or just preferred?").

  3. **Verify Shielded Defaults** (Bin 2, 5 minutes):  
     - Test defaults against the change:  
       - If a default relies on unchanged variables (e.g., energy costs depend on grid rates, not dock weight), retain in Bin 2.  
       - **Value Judgment Flag**: If shielding relies on probabilistic reasoning (e.g., "Failure risk < 0.1%"), document it.

  4. **Flag Ghost Frames** (Bin 3, 8 minutes):  
     - Identify assumptions inherited from superseded states but not invalidated (e.g., "Inventory counts assume sensor reliability").  
     - Detect "boundary ghost frames" from Step 2.  
     - **Conflict Protocol**: For conflicting ghost frames (e.g., "Assume low fire risk" vs. "Assume sensor redundancy"), document:  
       - Contradictory beliefs and their sources.  
       - Operational risks (e.g., "Inventory inaccuracies in Zone A").  
       - Label as "UNRESOLVED: Requires [Team/Data] by [Next Audit]".

  5. **Finalize & Document** (2 minutes):  
     - Log bins, flagged judgments, and unresolved conflicts in the audit trail.  
     - Preserve a snapshot of pre-change beliefs for recovery.

  ---

  ### Application to Cases

  **Case 1: Lowering Dock Weight Limit**  
  - **Change**: Max weight reduced from 5T to 3T at Dock 7.  
  - **Bin 1 (Direct Entailments)**:  
    - "Items >3T rerouted to Dock 9."  
    - "Dock 7 structural stress limits updated."  
  - **Bin 2 (Shielded Defaults)**:  
    - "Energy cost per kg/km unchanged" (relies on grid rates, unaltered).  
  - **Bin 3 (Ghost Frames)**:  
    - "Queue-order assumes Dock 7 handles heaviest items" (untracked; flag for manual review).  
  - **Value Judgment**: None (all technical checks).  
  - **Conflict**: N/A.

  **Case 2: Installing Fire-Suppression System**  
  - **Change**: System added in Zone A; disables thermal sensors.  
  - **Bin 1 (Direct Entailments)**:  
    - "Thermal sensors inactive during suppression events."  
    - "Fire alarms trigger suppression activation."  
  - **Bin 2 (Shielded Defaults)**:  
    - "Inventory tracked via RFID (not sensors)" (independent of thermal sensors).  
  - **Bin 3 (Ghost Frames)**:  
    - "Zone A fire risk assumes sensor-backed detection" (boundary ghost frame; must expose).  
  - **Value Judgment**: "RFID suffices for inventory" (technical, but requires validation).  
  - **Conflict**: N/A.

  **Case 3: Eliminating Express Shipping Lane (Likely Resistance)**  
  - **Change**: Remove priority lane for express items to reduce costs.  
  - **Bin 1 (Direct Entailments)**:  
    - "All items use standard lanes."  
    - "Express surcharge revenue model voided."  
  - **Bin 2 (Shielded Defaults)**:  
    - "Robot battery consumption unchanged" (unrelated to lanes).  
  - **Bin 3 (Ghost Frames)**:  
    - "Customer satisfaction assumes 2-hour delivery" (boundary; stops at human intentions).  
    - "Maintenance schedules assume low standard-lane wear" (untracked).  
  - **Value Judgment**: "Standard lanes handle 100% capacity" (subjective load estimate).  
  - **Conflict**: Unresolved between ghost frames:  
    - "Low wear assumption" vs. "Increased standard-lane traffic."  
    - **Documentation**: "UNRESOLVED: Lane durability vs. traffic surge. Risks robot fatigue. Escalate to robotics team by Q3 audit."  
  - **Resistance Cause**: Team may reject revenue/customer impact (non-technical), but procedure halts at boundary.

  ---

  ### What the Procedure Cannot Settle
  1. **Ghost Frame Contradictions**:  
     - Conflicts between inherited assumptions (e.g., "Assume sensors fail safely" vs. "Assume no redundancy") are unresolvable within the audit. They are documented as "UNRESOLVED" with:  
       - Risk assessment (e.g., "Potential inventory loss in fires").  
       - Escalation path (e.g., "Safety team review required").  
     - Residual uncertainty is recorded in the audit log for the next cycle.

  2. **Value Judgments**:  
     - Subjective calls (e.g., "Shielded by low risk") are flagged but not resolved. They require domain-expert validation post-audit.

  3. **Boundary Constraints**:  
     - Beliefs about human intentions, market dynamics, or legal risks are excluded entirely. Their impact is inferred only via ghost frames.

  **Residual Uncertainty Protocol**:  
  - All Bin 3 entries and unresolved conflicts are archived in the "Ghost Frame Registry."  
  - Before the next audit, teams must:  
    - Address escalated conflicts.  
    - Validate flagged value judgments.  
    - Update the dependency graph to reduce ghost frames.  
  - Unresolved items from prior audits are prioritized in the 30-minute window.  

  This procedure ensures focused, auditable revisions while containing the frame problem. It explicitly leaves non-technical and conflicting assumptions for targeted follow-up, preventing overreach during time-constrained updates.
