          - Bin 2: 
              - We might try to shield some defaults, but the team might resist because they realize that many defaults are broken. For example, the default that "maintenance is done when the warehouse is closed" is now broken. So we cannot shield it. We must update it (so it becomes a direct entailment) and then the update might lead to the stopping rule when we get to worker safety (which is non-technical? or is it technical?).

