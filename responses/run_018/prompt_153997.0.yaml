    Revised approach for stopping rule: When we are tracing the dependency and we hit a non-technical belief, we do not update it (we stop the propagation) and we mark that non-technical belief as a ghost frame? But the procedure requires sorting every affected belief, and non-technical beliefs are affected. However, the procedure also says we must not revise them. So:

        - We mark the non-technical belief as a ghost frame (bin 3) and stop.

    Therefore, in this case:
          - Direct entailments: the technical beliefs about weight limits and rerouting (but without updating the cost).
          - Ghost frames: the belief about the cost of using dock Y (because we did not update it, and it might be affected by the rerouting) and also the queue-order assumptions (which are technical) that must be flagged. The problem states: "queue-order assumptions must be flagged". Why? Because the rerouting might change the queue at dock Y? So we have a belief about the queue order at dock X (which is directly affected) and at dock Y? The queue order at dock X is direct: if heavy items are no longer at dock X, then the queue might be for lighter items. But the queue at dock Y might now have heavy items and that might change the order? However, the dependency might not be direct. So we mark the queue-order assumptions at dock Y as ghost frames? Or are they direct?

    The problem says: "energy-cost defaults should survive but queue-order assumptions must be flagged". So energy-cost defaults are shielded (bin 2). Queue-order assumptions are ghost frames (bin 3).

    So for case 1:
        - Bin 1 (direct): 
            - "Max weight at dock X is W2"
            - "Item I (with weight > W2) cannot be loaded at dock X"
            - "Item I must be rerouted to dock Y"
        - Bin 2 (shielded): 
            - Beliefs about energy cost (e.g., "using dock X costs E units of energy per hour") because they are independent of weight limit? Or maybe they are affected by the weight limit? The problem says they should survive, so we assume they are shielded.
        - Bin 3 (ghost frames):
            - Beliefs about queue order at dock Y (because the rerouting adds new items to dock Y and might change the order) -> we flag this as a ghost frame and require manual exposure.
            - Also, if there is a belief about the cost of using dock Y (which is market-related) and we stopped because of the stopping rule, then that cost belief is also a ghost frame.

    Case 2: Installing a fire-suppression system that disables certain sensors.

    - Change: Certain sensors (say, in the ceiling) are disabled when the fire-suppression system is active (or perhaps they are permanently removed? The problem says "disables" so it might be temporary). But note: the problem says "installing", so we are adding a system that disables existing sensors (maybe during fire events). However, we must consider the operational beliefs.

    - Direct entailments (bin 1):
          - When the fire-suppression system is active, the sensors in area A are disabled.
          - Therefore, during fire events, the system cannot rely on those sensors for inventory tracking in area A.

    - The problem states: "inventory-tracking beliefs should be shielded despite the sensor loss". How? The system must have a fallback for inventory tracking when the sensors are disabled. So the shielded defaults might be:
          - Beliefs about the inventory tracking using alternative methods (e.g., using other sensors, or using historical data) that are not affected by the fire-suppression system.

    - So:
          - Bin 1: 
              - "When fire-suppression is active, sensors in area A are disabled."
              - "During fire events, do not use sensors in area A for inventory tracking."
          - Bin 2 (shielded):
              - Beliefs about the alternative inventory tracking methods (e.g., "if sensor A is unavailable, use sensor B", or "if no sensor, use the last known position") that are already in place and are not affected by the change? But note: the change is the installation of the fire-suppression system. The alternative methods might be already present and shielded. However, if the fire-suppression system disables multiple sensors (including the alternative ones) then it might break the shielded default? The problem says they should be shielded, so we assume they are.

          - Bin 3 (ghost frames):
              - There might be an assumption that the fire-suppression system will only be active during actual fires, and that fires are rare. This assumption might be inherited and not explicitly tracked. If the system becomes active too often (e.g., due to false alarms), then the inventory tracking might be frequently lost. This is a ghost frame: the assumption about the frequency of fires that trigger the system.

    Case 3: A case where the team is likely to resist.

    Let's choose: Changing the operating hours of the warehouse to 24/7.

    - Change: The warehouse now operates 24 hours a day, 7 days a week.

    - Direct entailments:
          - Beliefs about the time windows for operations (e.g., "the warehouse is open from 8am to 8pm") are updated to "always open".
