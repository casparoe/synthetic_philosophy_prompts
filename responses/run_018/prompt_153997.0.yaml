          - Beliefs about human worker shifts: the stopping rule says we must not go into human intentions. So if there is a belief that "maintenance is done during night shift when no workers are present", and now we have workers at night, then we stop at the technical belief about maintenance scheduling and mark the non-technical belief about worker safety as a ghost frame? Actually, the belief about worker shifts is about human intentions? Or is it a technical belief about the schedule? We must stop at the point of human intentions. So if we have a belief that "during night shift, there are no workers" (which is a technical fact) then we can update that? But if we have a belief that "workers prefer not to work at night", that's human intention -> stop.

          - The team might resist because they don't want to deal with the cascade of changes to worker schedules and safety protocols (which are non-technical and out of scope) but the ghost frames will point out that these are now assumptions that are untracked and might be invalid.

    - How the procedure applies:
