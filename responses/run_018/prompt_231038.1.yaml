  The core issue is probably a meta-disagreement about the authority of rationality. The user sees rationality as providing objective standards, while the friend views it as instrumental to preferences. Progress might require accepting that pure time preference isn't rationally obligatory but recognizing its ethical implications in policy contexts, distinguishing between personal and societal discounting.
answer: |-
  **The core disagreement is a normative clash about the authority of rationality over basic preferences, exacerbated by conceptual slippage between psychology, individual rationality, and ethics, and further confused by conflating descriptive and prescriptive uses of discounting.** Here’s the diagnosis and path forward:

  1.  **Normative Disagreement About Rationality’s Authority:**  
      Your argument assumes rationality imposes *external constraints* on preferences: a "fully rational agent" *shouldn’t* arbitrarily discount future welfare. This views rationality as substantive (e.g., akin to Ramsey/Sidgwick/Parfit), demanding impartiality across time. Your friend adopts a *Humean/instrumentalist* view: rationality merely coordinates means to ends; if a stable preference for "now" exists (even exponentially discounted), it’s not "mistaken," just a brute fact. Calling it irrational is moralizing. **Progress requires explicitly debating this meta-issue: Can rationality critique basic preferences, or only their consistency?**

  2.  **Conceptual Slippage Between Domains:**  
      The conflict jumps between distinct frames:
      *   **Psychology (Descriptive):** "Everyone does it" (present bias or exponential discounting).
      *   **Individual Rationality (Normative/Consistency):** Time-consistent exponential discounting avoids self-sabotage but doesn’t justify the *rate*; present bias is dynamically inconsistent.
      *   **Ethics/Social Choice (Normative/Impartiality):** "Climate policy discounting" is a *moral* parameter; Ramsey’s critique targets this, not individual psychology.
      Your friend uses psychological facts ("everyone does it") to defend an ethical/policy stance ("climate needs discounting") and individual rationality ("it’s not mistaken"). You use ethical critiques (Ramsey) against individual rationality/psychology. **Progress requires rigidly separating these domains:** Is the claim about human cognition, consistent preference satisfaction, or moral justifiability?

  3.  **Empirical Conflation Masquerading as Resolution:**  
      When your friend shifted to "maybe nobody actually discounts exponentially," it injected a *descriptive* claim into a *normative* debate. Even if true (likely), it doesn’t resolve whether exponential pure time preference *would be* rational if it existed, or if it’s ethically acceptable for policy. This evasion sidesteps the core normative clash. **Progress demands isolating the counterfactual: "If an agent *did* have stable exponential pure time preference, would that preference be rationally/ethically defensible *per se*?"**

  **What Progress Looks Like:**  
  Acknowledge the bedrock normative divide (Point 1), then rigorously disambiguate:  
  - **Distinguish Frameworks:** Agree to discuss *either* ethics (e.g., "Is pure time discounting justifiable in climate cost-benefit analysis?") *or* individual rationality (e.g., "Can a pure time preference be consistent and satisfy axioms of rational choice without being 'arbitrary'?") separately.  
  - **Formalize the Counterfactual:** In the rationality frame, examine if pure time preference violates axioms like state-independence or if it can be represented as a "taste" within standard rational choice models. In ethics, engage Parfit’s "non-identity problem" or discounted utilitarianism’s implications for equality.  
  - **Change the Question:** Shift from "Is it rational?" to "What does accepting pure time preference *commit us to*?" (e.g., "Would you endorse a medical treatment causing more *total* pain if sufficiently delayed, solely due to date?"). This tests intuitive consistency.  

  **Bottom Line:** The debate is stuck because it conflates "is" (psychology), "can" (consistent preference), and "ought" (ethics), while avoiding the irreconcilable normative premise about whether rationality can judge basic desires. Disambiguation and domain-specific argumentation are the only paths forward—accepting that ultimate justification may hinge on foundational intuitions about impartiality.
