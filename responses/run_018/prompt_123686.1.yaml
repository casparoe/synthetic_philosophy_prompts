answer: |-
  Here’s a focused decision tree for the procreation asymmetry, designed around concrete cases and branching logic. Positions marked **\*** are actively defended in literature; others are categorized as unstable/unexplored. Key blurrings noted.

  ### Decision Tree: Procreation Asymmetry Taxonomies
  *(Start: You accept there’s an asymmetry between creating suffering vs. happy people)*

  1. **Is the asymmetry absolute?**  
     - **YES (Absolute asymmetry)** → Go to 1A  
     - **NO (Asymmetry depends on a welfare threshold)** → Go to 1B  

  ---

  #### **1A: Absolute Asymmetry**  
  *"Creating any suffering person is wrong; creating happy people is never *required*, no matter how happy."*  
     - **Why?**  
       - **Harm-Based Explanation:** "Only harms (suffering) need moral justification; benefits (happiness) are morally optional." → **Case Test: Neutral Beings?**  
         - *Extend*: Creating neutral beings is impermissible (they can’t benefit, but risk of harm remains).  
           → **Position: \*Classic Anti-Natalism (Benatar)**  
         - *Collapse*: No reason to create/avoid them (no harm possible).  
           → **Position: Unnamed/Unstable**  
       - **Rights-Based Explanation:** "Non-existent beings have no right to be created (even if happy), but creating a sufferer violates their right not to be harmed." → **Case Test: Neutral Beings?**  
         - *Extend*: Permissible to create (no rights violation) but not obligatory.  
           → **Position: \*Rights Anti-Natalism (e.g., Narveson)**  
         - *Collapse*: Neutral beings have no rights → creation is neutral.  
           → **Position: Unnamed/Unstable**  
       - **Expectation-Based Explanation:** "Creation is evaluated as *imposing* life; omission is *withholding* life. Only imposition needs justification." → **Case Test: Neutral Beings?**  
         - *Collapse*: No expectation of harm/benefit → creation is neutral.  
           → **Position: \*Asymmetry by Default (Shiffrin-adjacent)**  

  #### **1B: Threshold-Dependent Asymmetry**  
  *"Asymmetry only applies when expected welfare is below a threshold (e.g., net negative). Creating *very* happy people *can* be good."*  
     - **Why?**  
       - **Harm-Based Explanation:** "Avoiding harm is obligatory; promoting happiness is only optional *unless* welfare is high enough to override risks." → **Case Test: Neutral Beings?**  
         - *Collapse*: No harm → no reason to create/avoid.  
           → **Position: \*Threshold Anti-Natalism (McMahan-adjacent)**  
       - **Rights-Based Explanation:** "Potential beings lack rights, but we may have *impersonal* reasons to create happy lives above a threshold." → **Case Test: Neutral Beings?**  
         - *Collapse*: No rights violation → permissible but not required.  
           → **Position: Unnamed/Unexplored**  
       - **Expectation-Based Explanation:** "Creating below-threshold lives is *harming*; creating above-threshold is *benefiting*. Omission isn’t harming." → **Case Test: Neutral Beings?**  
         - *Reverse*: Creating neutral beings is neutral; omission is neutral.  
           → **Position: Unnamed/Unstable**  

  ---

  ### Key Annotations:
  - **Blurring Alert**: Harm-based and rights-based views often converge in practice (both are "person-affecting") → hard to distinguish in applied cases (e.g., "Is creating a sufferer a *harm* or a *rights violation*?").  
  - **Incoherent Branch**: Accepting asymmetry but rejecting *all three explanations* → **Incoherent**. Asymmetry requires *some* justificatory framework (harm/rights/expectation structure is exhaustive for core asymmetry defenses).  
  - **Unexplored Branches**:  
    - Threshold + expectation-based → no clear defender (utilitarians reject asymmetry; deontologists prefer absolute).  
    - Rights-based + neutral beings collapse → logically consistent but undefended.  
  - **Neutral Beings Test Outcomes**:  
    - **Extend**: Asymmetry persists (creation is wrong/neutral; omission is neutral).  
    - **Collapse**: No moral difference between creating/omitting neutral beings.  
    - **Reverse**: Creating neutral beings becomes obligatory (rare; only in impersonal totalism, which rejects asymmetry).  

  ### Tree Summary (7 Leaves):
  | Path                                      | Position                          | Stability               |  
  |-------------------------------------------|-----------------------------------|-------------------------|  
  | Absolute + Harm + Extend Neutral          | \*Benatar                        | Defended                |  
  | Absolute + Harm + Collapse Neutral        | Unnamed                          | Unstable (ignores risk) |  
  | Absolute + Rights + Extend Neutral        | \*Narveson-style                 | Defended                |  
  | Absolute + Expectation + Collapse Neutral | \*Shiffrin-style                 | Defended                |  
  | Threshold + Harm + Collapse Neutral       | \*Threshold Anti-Natalism        | Defended                |  
  | Threshold + Rights + Collapse Neutral     | Unnamed                          | Unexplored              |  
  | Threshold + Expectation + Collapse Neutral| Unnamed                          | Unstable (blurs into utilitarianism) |  

  ### Why Incoherent/Unexplored?
  - **Incoherent**: Asymmetry without a harm/rights/expectation basis lacks moral mechanics → it becomes an intuition without scaffolding.  
  - **Unexplored**: Threshold + expectation-based is vacuously utilitarian (if creation benefits, it’s required → rejects asymmetry). Rights + threshold is theoretically possible but ignored (rights theorists prefer absolutes).  

  This forces students to confront the asymmetry’s *structure* before labels—using the neutral-beings edge case to stress-test coherence. I’ve flagged defended positions (\*) and logical gaps, per your request.
