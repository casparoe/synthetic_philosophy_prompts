answer: |-
  Your diagnosis is sharp: **this is primarily a conflict of explanatory projects disguised as a substantive debate about mechanisms, exacerbated by conceptual ambiguity around "norm."** Here's a breakdown of the structure, what each side *actually* says, and paths to progress:

  **The Core Structure of the Stall:**

  1.  **Different Questions, Same Word ("Norm"):**
      *   **Lewisians (Conventionalists):** Ask *"How are norms* ***justified*** *as binding rules? Why do we feel we* ***ought*** *to follow them?"* Their answer relies on **common knowledge, mutual expectations, and conditional preferences.** Norms solve coordination problems *because* agents recognize them as solutions and expect others to recognize them too. The "ought" emerges from the logic of coordination and the salience of the solution (e.g., "We *should* drive on the right *because* everyone expects it and it avoids chaos"). They focus on the **normative force**.
      *   **Evolutionists (Stable Strategists):** Ask *"How do behavioral regularities that look like norms* ***arise*** *and* ***persist*** *in populations?"* Their answer relies on **evolutionary dynamics (biological, cultural, gene-culture coevolution), learning heuristics, reinforcement, and simple conditional strategies.** Agents need not understand the rule, its purpose, or others' beliefs about it. The "ought" is an illusion or a downstream effect of internalized punishment/reward systems. They focus on **behavioral regularity and stability.**

  2.  **Critiques Rooted in Projectional Confusion:**
      *   **Lewisian Critique:** "You miss the *normativity*! Explaining how a behavior pattern spreads doesn't explain why I feel *obligated* to queue, or why breaking it feels *wrong*, not just risky. Your agents are zombies following internalized triggers, not responsive to reasons." (Targeting the *justification gap* in the evolutionary account).
      *   **Evolutionist Critique:** "You require hyper-rationality! Real humans (especially children, or in complex new situations) don't perform common knowledge reasoning for most norms. Your model is computationally implausible and ignores the messy reality of learning and habit." (Targeting the *psychological realism gap* in the Lewisian account).

  3.  **The "Ought" Mismatch:**
      *   Lewisians see the *deontic* "ought" (duty, obligation) as primary and irreducible in their explanation.
      *   Evolutionists see the *instrumental* "ought" (this behavior is advantageous/punishment-avoiding) as sufficient and primary; the deontic feeling is an epiphenomenon of the underlying instrumental logic coupled with emotional/social learning mechanisms.

  4.  **The Empirical Ghost:** The hidden question *"Do humans actually compute common knowledge when following everyday norms?"* is crucial but often obscured. Lewisians often describe a *logical structure* justifying the norm, not necessarily the *real-time cognitive process*. Evolutionists point to evidence of norm compliance without explicit reasoning (e.g., mimicry, quick emotional responses to violation). This *is* empirically tractable (see below).

  **Diagnosis: What Kind of Disagreement?**

  *   **Primarily Different Questions / Explanatory Projects:** The core issue. They are answering fundamentally different "why?" questions about the same phenomena.
  *   **Substantive (Bedrock) Differences:** Underlying the projects are deep intuitions:
      *   Lewisians: Rationality (broadly construed – responsiveness to reasons, expectations) and normativity are *constitutive* features of social norms.
      *   Evolutionists: Psychological/cognitive realism and the power of non-rational processes are paramount; rationality is often a post-hoc story.
  *   **Verbal Ambiguity:** The word "norm" tragically conflates:
      1.  Behavioral Regularity (observed pattern).
      2.  Normative Force (sense of obligation/appropriateness).
      3.  Enforcement Mechanism (sanctions, internalized guilt).
      Both sides often slide between these meanings, talking past each other.

  **Paths to Progress (Beyond Admitting Stuckness):**

  1.  **Conceptual Surgery: Distinguishing Norm Types (Your Hunch):** This is the most promising *conceptual* step.
      *   **Coordination Norms (Lewisian Core):** Focused on solving pure coordination problems (driving side, meeting points). Common knowledge *logic* best explains their stability and normative force *as solutions*. The empirical question is whether agents *use* this logic or simpler heuristics *in practice*.
      *   **Commitment Norms (Deep Evolutionist Territory):** Focused on solving cooperation problems requiring sacrifice (reciprocity, fairness, prohibitions). Evolutionary stable strategies (TFT, punishment) are likely the primary *causal origin*. The "ought" feeling here may be a powerful evolved *enforcement mechanism* (guilt, indignation) for sustaining cooperation, *not* primarily derived from common knowledge reasoning.
      *   **Conformity Norms:** Driven by social learning, identity signaling, avoiding ostracism – heavily evolutionarily explained, with normativity potentially being a weaker "fitting in" feeling.
      *   **Progress:** Explicitly mapping different norm *types* to different primary explanatory frameworks dissolves much of the apparent conflict. It acknowledges that "norms" aren't a single phenomenon.

  2.  **Empirical Pivot: Testing the Psychological Reality of Common Knowledge:**
      *   **Key Question:** Do people spontaneously compute (or act *as if* they compute) hierarchies of beliefs ("I believe X, I believe you believe X, I believe you believe I believe X...") in routine norm-following? Or do they rely on simpler cues (perceived regularity, immediate social feedback, emotional valence)?
      *   **Methods:**
          *   Cognitive load experiments: Does impairing complex reasoning disrupt norm compliance more for certain norms (coordination vs. commitment)?
          *   Developmental studies: How do children acquire different norms? Do they show understanding of mutual expectations early, or rely on reinforcement/punishment?
          *   Neuroimaging: Are brain regions associated with explicit mental state reasoning (TPJ, mPFC) consistently activated during norm compliance/violation, or are reward/punishment/emotional centers more central?
          *   Cross-cultural comparison: Are norms requiring higher-order reasoning more variable or unstable?
      *   **Progress:** Evidence showing minimal common knowledge computation in most everyday norm-following would seriously challenge the Lewisian account as a *psychological process*, forcing refinement (e.g., treating it as a useful *rational reconstruction* rather than a cognitive description). Evidence finding it crucial for *establishing* new coordination norms would support its niche role.

  3.  **Mechanistic Hybrid Models (Theoretical Progress):**
      *   Develop models where simple learning rules (evolutionary) *bootstrap* agents into states where Lewisian common knowledge *becomes* a useful (though perhaps not constantly computed) representation for *maintaining* complex coordination. Or models where "ought" feelings (emotional commitment devices) evolve *because* they stabilize beneficial behaviors *in agents capable of reasoning*, creating a feedback loop.
      *   **Progress:** Showing how the "justification" structure (Lewis) could *emerge from* or *interact with* evolutionary dynamics, without requiring hyper-rationality at the outset.

  **Conclusion & Prognosis:**

  The standoff is **real but not irreconcilable.** It stems from **conflicting explanatory goals (justification vs. origin) combined with conceptual ambiguity ("norm") and differing bedrock intuitions about rationality.** Simply admitting it's stuck is premature.

  **Progress is most likely through:**

  1.  **Conceptual Refinement:** Explicitly distinguishing types of norms (Coordination vs. Commitment being key) and assigning primary (not exclusive) explanatory frameworks to each. This directly addresses the "talking past each other" issue.
  2.  **Targeted Empirical Research:** Focusing on the psychological reality of common knowledge computation during norm-following. This tackles the hidden empirical question head-on and can force theory adjustment.
  3.  **Developing Hybrid Models:** Showing how justification structures could arise from or interact with evolutionary dynamics.

  While a single "knockout" result is unlikely, **rigorous conceptual taxonomy combined with targeted cognitive science can significantly unstick the debate.** It forces both sides to clarify *which aspects* of *which norms* they are explaining and provides empirical constraints on the role (or lack thereof) of high-level rationality in everyday normativity. The concept of "norm" *does* too much work, and surgically separating its meanings is the first step forward.
