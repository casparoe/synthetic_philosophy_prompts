  What does each side actually say? Lewisians argue that without common knowledge, you can't explain why we feel we ought to follow norms. Evolutionists point to empirical evidence of norm-following in animals or children without complex cognition. So the disagreement is substantive—rooted in different assumptions about human rationality and cognition. 

  The user wants to know what kind of disagreement this is. It's a mix: verbal because 'norm' is ambiguous, substantive in underlying assumptions, and different questions being addressed. The user's suggestion to separate 'commitment norms' from 'coordination norms' could help. For example, coordination norms might be explained by evolution, while commitment norms need the 'ought' from common knowledge. 

