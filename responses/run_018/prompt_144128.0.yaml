answer: |-
  ## Dialogue: Metrics, Mugs, and Institutional Muscle

  **Setting:** A slightly sticky table in the back of The Mitre pub. Half-finished pints of ale sit between Priya and Tom.

  **Priya:** (Stirring her drink with a slightly bent beer mat) Honestly, Tom, I'm starting to think the whole measurability fetish in EA is quietly hollowing us out. Like, building institutions made of tissue paper.

  **Tom:** (Raising an eyebrow) Tissue paper? Bit dramatic, Priya. What’s brought this on? Another grant report drafting session?

  **Priya:** Ugh, don’t. It’s *always* the grant reports. Look, I get it. Funders want to know their money did *something*. Bednets distributed, malaria cases averted, tonnes of CO2 sequestered. Nice, clean numbers. But the *demand* for those numbers… it’s forcing everyone to restructure around what’s *legible*, not what’s actually bloody useful, especially in longtermist spaces.

  **Tom:** Okay, hit me. How’s legibility wrecking things?

  **Priya:** Right. Take this org I was talking to – working on AI governance capacity building. Their actual *useful* work? Building deep, trusted relationships with policymakers, fostering nuanced understanding, creating informal networks for rapid response. Stuff that builds *resilience*, right? Institutional muscle.

  **Tom:** Sounds crucial.

  **Priya:** Exactly! But what’s the *deliverable* they can put in the quarterly report to their quant-focused funder? They can’t say "fostered nuanced understanding in Minister X." So what do they do? They spend half their time commissioning elaborate, 80-page risk assessment documents on hypothetical AI takeover scenarios. Beautifully formatted, impeccably referenced. Utterly useless. No busy minister is reading that. But it’s *measurable* – "produced X reports." They’re optimising for the report, not the resilience. The institution becomes a report factory, not a… well, institution.

  **Tom:** (Nods slowly) Okay, I see the perverse incentive. But Priya, without *some* demand for measurability, what do you get? Patronage. Vanity projects. ‘Trust me, I’m doing important things’ while sipping cocktails at Davos. Metrics, even imperfect ones, force *some* accountability, some focus on actual outputs over vibes.

  **Priya:** But it’s creating a *specific kind* of institution! One that’s brittle. Great at churning out the pre-defined metric, useless when the crisis looks different or requires deep, unquantifiable relationships or institutional memory. And you know what makes it worse? ‘Earning to give.’

  **Tom:** Oh come on, not ETG. That’s just about resource maximisation. Transparent!

  **Priya:** *Is* it? Think about it, Tom. Your typical high-earning ETG donor. They’ve spent all day in finance or tech, swimming in dashboards and KPIs. They want that same clean hit for their philanthropy. They want to point to a number – lives saved per dollar, tonnes of CO2 reduced. They *need* that to justify their donation, to themselves and maybe their peers. So what do they fund? The stuff with the cleanest metrics! Which pushes *more* money towards the bednets and the deworming – which are great! – but also towards those bloody useless longtermist reports, because they’re a ‘deliverable’. They accidentally incentivise performative measurement across the board. It’s metric theatre.

  **Tom:** (Leans back, takes a sip) That’s a bit harsh. Firstly, ETG donors *also* fund meta and capacity building – OpenPhil’s a huge example. Secondly, complaining about measurability bias feels a bit like complaining gravity pulls things down. *Of course* funders gravitate towards what they can understand and measure. Institutional capacity *is* inherently fuzzy and hard to measure. Does that mean we shouldn’t try to measure *anything*? Throw the baby out with the bathwater?

  **Priya:** No, obviously not! I’m not advocating for vibes-based funding. But we’re *over*-correcting. We’re letting the measurable tail wag the institutional dog. Funders need to get comfortable with funding *slack*, funding *relationships*, funding the boring maintenance of capability, even if the only metric is "still exists and is trusted by key stakeholders." That’s resilience! It’s like… funding the fire brigade *before* the fire, based on their training and equipment, not just how many fires they put out last year.

  **Tom:** And how do you stop *that* becoming a cosy sinecure for underperforming mates? How do you ensure quality? Metrics, even proxy ones, are a defence against that. Maybe the answer isn’t ditching measurability, but getting *better* at measuring resilience? Or funding more unrestricted grants specifically for institutional health?

  **Priya:** (Sighs) Maybe. But I think the incentive structure is deeply skewed by the *type* of wealth and the *demand* for certainty. Funders, especially those coming from ETG backgrounds, crave the certainty of a number, even a flawed one, over the messy reality of building robust systems. And that craving is actively selecting *for* organisations good at producing numbers, not necessarily good at being resilient institutions. It’s a quiet erosion.

  **Tom:** I hear you. I really do. The report factory thing is a real risk, especially in longtermism where direct impact is… speculative. And yeah, ETG donors probably have a bias towards the quantifiable. But I still think the alternative – relying purely on relationships and trust networks without *any* demand for evidence of effort or output – is riskier. It’s easier to hide failure or inefficiency. The measurability pressure keeps everyone at least vaguely pointed towards *doing something* tangible.

  **Priya:** Even if that ‘something tangible’ is counter-productive in the long run? We agree the bias exists, then? And that it *might* be corrosive?

  **Tom:** Okay, concession: Yes, there’s a measurability bias. Yes, it *can* distort priorities, especially towards short-term, easily quantifiable outputs over long-term, hard-to-measure resilience. And yes, high-earners used to clear metrics probably amplify that preference. The risk of ‘metric theatre’ in complex spaces is real.

  **Priya:** And you agree it’s a particular problem for building the kind of deep, adaptable institutions we *need* for long-term challenges?

  **Tom:** Yeah, I’ll buy that. Where we disagree, I think, is on the *degree* of harm versus the harm of the alternative, and maybe on the solution. You seem to think funders should just… chill out and fund vibes more.

  **Priya:** (Smirks) Not *vibes*. Institutional *substance* that’s inherently hard to capture in a quarterly KPI. And I think the ETG pipeline *does* subtly reinforce the problem by funnelling a certain mindset into funding decisions.

  **Tom:** And I think ditching accountability is a path to mediocrity, and that we need to work *within* the gravity well of measurability, trying to develop better proxies for resilience, or carve out specific funding streams for it with different reporting expectations. Maybe funders *do* need to explicitly allocate a percentage for ‘institutional health – metrics TBD’.

  **Priya:** Okay, I’ll take that. So… common ground: Measurability bias exists, it *can* harm institutional resilience, especially in complex longtermist work, and ETG donors might be more susceptible to it. Disagreement: You think it’s a necessary, manageable evil outweighed by accountability benefits. I think it’s actively corrosive and requires a more fundamental shift in what funders value, particularly for building resilient institutions.

  **Tom:** (Holds up his glass) Sounds about right. To wrestling with gravity?

  **Priya:** (Clinks her glass against his) To wrestling with gravity… and maybe building slightly less brittle structures while we’re at it. Cheers. Pass the crisps, this is thirsty work.
