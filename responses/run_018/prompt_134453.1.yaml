answer: |-
  Here’s your seminar final package designed to push students beyond recitation and into conceptual tension:

  ---

  ### 1. Essay Question (75 mins, ~800 words)  
  **"Shadow We-Mode Coordination and the Boundaries of Joint Action"**  
  Define "shadow we-mode coordination" as coordination governed by shared norms of mutual correction and accountability (e.g., "fix what breaks according to local rules"), *without* agents sharing representational content about the overarching goal (e.g., repair crews restoring a city grid without knowing its purpose; open-source maintainers patching code without agreeing on the software’s telos). **Argue whether this phenomenon qualifies as genuine joint action.** In your response:  
  - Confront whether Bratman’s "Shared Cooperative Activity" (SCA) framework *can* accommodate shadow we-mode, given its emphasis on **shared intention** (interlocking intentions toward a common goal), **mutual responsiveness**, and **commitment to mutual support**. Where exactly does Bratman require shared representational content about the goal?  
  - Evaluate whether Gilbert’s "plural subject" theory (grounded in joint commitment to a goal *as a body*) can absorb shadow we-mode’s reliance on procedural norms *instead of* shared goal-belief. Does her account of normative obligation ("owing" actions to others) apply here?  
  - Conclude by defending whether joint action *demands* shared goal-representation, or if commitment to shared *corrective procedures* suffices.  

  ---

  ### 2. Model Answer (~600 words)  
  Shadow we-mode coordination—exemplified by decentralized networks like disaster responders following local repair protocols or open-source communities adhering to contribution norms—challenges orthodox accounts of joint action by decoupling procedural coordination from shared goal-representation. I argue it constitutes a *sui generis* form of joint action irreducible to Bratman or Gilbert’s models, exposing gaps in their requirement of shared intentional content.  

  Bratman’s SCA cannot fully assimilate shadow we-mode. While his "mutual responsiveness" and "commitment to mutual support" *seem* present (e.g., maintainers adjust actions based on others’ code commits; they feel obligated to fix others’ errors), SCA hinges on **shared intention toward a goal with representational content**. For Bratman, agents must not only intend *that we J* but also share subplans and beliefs about *what J is* (e.g., "we intend to *build a functional power grid*"). Shadow we-mode agents, however, lack this: a lineman repairing a transformer follows rules ("restore voltage here") without representing the grid’s *purpose* (e.g., powering hospitals vs. factories). Bratman’s "mutual belief" condition—that all know and believe others share the goal—collapses when agents cannot even articulate a unified goal. Shared *procedures* for correction ("patch security flaws") are insufficient without shared representational content about the *end*.  

  Gilbert’s plural subject theory fares better but stumbles at internalizing shadow we-mode. Her joint commitment creates obligations (e.g., open-source contributors owe fixes to the collective) and licenses mutual correction. However, Gilbertian commitment is fundamentally to a **goal conceived as a single object of attention** ("we are committed *to singing a duet*"). Shadow we-mode replaces this with commitment to a *distributed process*: one is accountable for following local norms, not for advancing a collectively represented end. While Gilbert’s "owing" actions applies to norm-enforcement (e.g., criticizing a violator), the lack of a jointly endorsed *telos* means the "plural subject" lacks the conceptual cohesion she demands. A Gilbertian collective requires "we believe *that p*" (e.g., "we are maintaining *this software*"); shadow agents merely believe "*if I break rule R, others will correct me*."  

  Thus, shadow we-mode reveals a lacuna: **joint action can emerge from shared accountability to procedural norms alone**, without shared goal-representation. This is genuine joint action because it satisfies core criteria: collective accountability (agents accept rebuke for norm-deviation), interdependence (actions only make sense within the norm-structured web), and group-level outcomes (e.g., a functional system). Bratman and Gilbert overstate the necessity of shared *representational content*, conflating it with shared *normative structure*. Shadow we-mode shows that what binds agents is not a jointly represented end, but a shared "grammar of repair."  

  ---

  ### 3. Marking Scheme (Total: 25 points)  
  **A (21–25)**: Explicitly confronts theoretical tensions; isolates *exact* points where frameworks demand shared content.  
  **B (16–20)**: Compares theories competently but misses nuances; conflates key distinctions.  

  #### Specific Criteria:  
  - **Defines shadow we-mode accurately** (procedural norms + accountability *without* shared goal-representation) + **relevant example** (4 pts)  
  - **Bratman Analysis**:  
    - Identifies SCA’s **shared intention** (interlocking intentions re: *goal-content*) as non-negotiable (3 pts)  
    - Notes **mutual belief condition** requires shared goal-representation (2 pts)  
    - *Conflation Penalty*: –2 pts if equates "mutual responsiveness" with shared norms *without* addressing goal-content.  
  - **Gilbert Analysis**:  
    - Explains that **joint commitment** requires goal-as-shared-object (3 pts)  
    - Recognizes **normative obligations** (*partial* fit for correction norms) (2 pts)  
    - *Conflation Penalty*: –2 pts if treats shared commitment to *procedure* as identical to commitment to *end*.  
  - **Critical Synthesis**:  
    - Argues whether shadow we-mode counts as joint action (3 pts)  
    - Identifies **shared representational content about the goal** as the core friction (3 pts)  
    - Distinguishes **shared commitment to an end** vs. **shared commitment to a corrective procedure** (3 pts)  
    - *Key Insight Reward*: +2 pts for noting Bratman/Gilbert conflate shared *intentional content* with shared *normative structure*.  

  ---

  ### Notes  
  - The question forces engagement with *unstated* assumptions (e.g., Bratman’s goal-representation is cognitive, not behavioral).  
  - The model answer prioritizes precision over coverage, modeling grad-level argumentation.  
  - The rubric penalizes the exact conflation (goal-representation = normative structure) the user flagged.  
  - Adjust point distributions if needed—this balances conceptual depth with exam realism.
