answer: |-
  ## Proposal: Normative Standing and the Substrate Dependence of Moral Continuity in Gradual Neural Replacement  

  **1. Core Question & Conceptual Gap**  
  Gradual neural replacement (GNR)—the sequential substitution of biological neurons with synthetic functional equivalents—is typically analyzed through binary questions of personal identity (“Does the same person survive?”). This framing neglects a more urgent problem: **Can GNR preserve psychological and behavioral continuity while severing *normative standing*—the continuity of being the same moral patient with identical ethical claims and obligations?** I propose that normative standing may depend on the persistence of a *biological substrate architecture* that enables homeostatic self-regulation, a feature potentially lost even in functionally identical synthetic systems. Existing theories fail to resolve this:  
  - **Psychological-continuity theories** collapse normative standing into cognitive function.  
  - **Animalism** ties moral status to biological humanity as an all-or-nothing property, ignoring partial replacement.  
  - **Upload advocates** assume functional equivalence guarantees moral equivalence.  
  **The gap:** No framework evaluates whether GNR decouples *cognition* from the *embodied basis of moral patienthood*.  

  **2. Position: Substrate Architecture as the Ground of Normative Standing**  
  I argue that **normative standing is contingent on the continuity of biological substrate architecture**, not merely functional or psychological continuity. Synthetic modules may replicate *information processing* but fail to replicate the *teleonomic* (goal-directed, self-sustaining) properties of biological neurons that ground moral status. Reasons for this position:  
  - **Vulnerability and Moral Patiency**: Biological homeostasis generates intrinsic needs (e.g., avoiding tissue damage, metabolic balance). Moral obligations arise from responsiveness to these needs. Synthetic systems lack equivalent vulnerability; their “needs” are assigned, not emergent.  
  - **Causal History Matters**: Moral status arises from a shared evolutionary history of embodied suffering and flourishing. GNR severs this history by introducing causally inert synthetic parts.  
  - **The Risk of Epiphenomenal Morality**: If synthetic neurons process pain signals without instantiating genuine distress (despite identical behavior), obligations to the entity dissolve. Functionalism cannot capture this distinction.  

  **3. Method: Taxonomy of Scenarios for Conceptual Mapping**  
  Over three months, I will analyze three GNR scenarios to isolate when normative continuity breaks:  
  - **Scenario 1 (Uniform Substitution)**: All neurons replaced identically.  
    *Question:* Does the entity retain original moral claims if synthetic neurons lack biological self-regulation?  
  - **Scenario 2 (Region-Specific Substitution)**: Only emotion-processing neurons replaced with optimized synthetic versions (e.g., reduced "suffering" during pain).  
    *Question:* Does the entity still warrant compassion if its distress response is functionally identical but architecturally altered?  
  - **Scenario 3 (Social-Role Substitution)**: Neurons replaced identically, but the process alters social behavior (e.g., reduced empathy due to synthetic reward mechanics).  
    *Question:* Do changed social obligations (e.g., diminished duties to others) break normative standing even if identity is preserved?  

  **Analysis Tools**:  
  - **Functional Equivalence Test**: Does identical input-output behavior preserve moral status?  
  - **Substrate Dependence Test**: Does replacing biological self-regulation with synthetic control undermine patiency?  
  - **Causal History Test**: Does origin (biological vs. synthetic) alter the basis of moral claims?  

  **4. Deliverables & Outcomes**  
  - **Target Result**: A framework demonstrating that normative standing requires *biological substrate continuity* alongside functional equivalence. Success would show that:  
    (a) GNR entities may lose moral patienthood despite psychological continuity;  
    (b) Moral obligations could shift to creators/users of synthetic systems.  
  - **Failure Conditions**:  
    - If no distinction exists between biological and synthetic substrates *after* functional equivalence.  
    - If causal history proves irrelevant to normative standing.  
  - **Output**: A paper arguing that GNR necessitates new ethical paradigms for synthetic consciousness.  

  **5. Feasibility & Ambition**  
  The project is ambitious but feasible in three months. **Scope is realistic** because it:  
  - Avoids empirical work, focusing solely on conceptual analysis.  
  - Uses targeted scenarios to limit variables.  
  - Builds on established neuroethical debates without requiring novel formal systems.  
  **Key risk**: Defending substrate-dependence against robust functionalist objections may require more time than allotted. However, the taxonomy forces engagement with hard cases (e.g., Scenario 2), making the core argument testable within the timeframe. **This is not overambitious**—it maps a neglected problem but does not resolve all metaethical debates.  

  **Conclusion**  
  Gradual neural replacement tests whether humanity can be preserved synthetically. By reframing GNR around normative standing—not identity—and defending the primacy of biological continuity, this project exposes a critical vulnerability in transhumanist ethics: replicating *mind* may not replicate *moral worth*. The outcome will clarify obligations to post-biological entities and redefine the boundaries of moral community in an age of neurotechnology.
