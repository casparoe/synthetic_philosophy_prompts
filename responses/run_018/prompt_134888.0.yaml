prompt: |-
  You're a senior advisor on democratic innovation working with a mid-sized city manager. Think step by step and do a quick brainstorm before you layout the answer. I need you to turn the actual logic behind sortition—random selection solves party capture but only produces legitimate outcomes under descriptive representation, low urgency, and the absence of "mandate contamination"—into a reusable decision procedue your office can run in about 20 minutes before anyone signs off. The city keeps recieving pitched citizens' assemblies for every dispute, so build an ordered checklist: entry conditions that make this even a candidate, hard-stop questions where a no kills the proposal dead, then the nodes where facts end and values take over, with clear flags for where the tool will misfire. Treat mandate contamination—when the recruitment pool draws from self-selected activists rather than a genuinely random civic roll—as a fatal flaw if present.

  Apply the checklist to two proposals: first, a sorted mini-public to redesign bike-lane priorities, which should pass but yield a recommendation that conflicts with the mayor's campaign promises; second, using sortition to set emergency drought-rationing rules, which should fail hard on urgency and technical need. Don't ask for bibliographies or cite scholars—just build the practical tool, mark the judgment calls honestly, and say exactly what the procedue can't do. Keep it casual, a typo or two is totally fine.
reasoning: |-
  Okay, the user is a senior advisor on democratic innovation working with a city manager. They need a practical, reusable checklist for evaluating proposals for citizens' assemblies based on sortition. The key points from the query are: sortition solves party capture but requires descriptive representation, low urgency, and no mandate contamination. Mandate contamination is a fatal flaw. The checklist should have entry conditions, hard-stop questions, and judgment calls. Then apply it to two cases: bike-lane redesign (should pass) and emergency drought rules (should fail).

  First, I need to break down the logic of sortition. Random selection ensures no party capture, but legitimacy relies on the assembly being descriptively representative of the population. If the recruitment pool isn't truly random (mandate contamination), the whole thing's invalid. Also, sortition works best when there's time to deliberate without pressure, and the issue doesn't require technical expertise. Urgency and technical needs are red flags.

  The checklist structure should start with entry conditions - basic must-haves to even consider the proposal. Then hard-stop questions where a "no" kills it immediately. After that, judgment zones where values come into play, highlighting where things could go wrong. Mandate contamination is a hard-stop.

  For the bike-lane example: descriptive representation should be manageable, urgency is low, mandate contamination should be avoidable. The conflict with the mayor's promises is a post-check issue, not a dealbreaker for the assembly itself. The drought example has high urgency and technical complexity (water management expertise needed), so it should fail the hard-stops.

  The user wants this practical, no academic references. Keep it casual, okay with typos. Need to mark clearly where judgment is required and what the tool can't handle - like resolving conflicts with elected officials' mandates or predicting public acceptance.

  Also, the city gets too many assembly pitches, so this checklist should quickly filter out unsuitable cases. Emphasize that even if it passes, the outcome might not be implemented, but that's beyond the scope of this tool.

  Putting it together: Entry conditions include the problem being public, non-technical, and suitable for deliberation. Hard-stops: mandate contamination, high urgency, technical need, unrepresentative pool. Judgment zones: conflict with mandates, polarization, implementation risks. Then apply to both cases clearly showing why one passes and the other fails hard.
answer: |-
  Here's your **Sortition Quick-Screen Tool** – a 20-min checklist to gut-check citizens' assembly pitches. Remember: **Sortition’s sweet spot = breaking partisan gridlock ONLY when the room looks like the city, nobody’s panicking, and recruits aren’t activists in disguise.** 

  ---

  ### **The Sortition Screener (v1.0)**
  **TIME BOX:** 15-20 min max. Answer fast – gut reactions ok.  
  **OUTCOME:** Greenlight, Redlight, or "Proceed But Warn" (PBW).

  #### **I. ENTRY CONDITIONS (3 mins)**  
  *Does this even belong in the sortition bucket?*  
  ☐ **Public Problem:** Directly impacts residents’ daily lives (not internal admin).  
  ☐ **Non-Technical:** Solvable via common sense + lived experience (no PhD required).  
  ☐ **Deliberation-Friendly:** Multiple valid perspectives exist (not a yes/no binary).  
  *→ If all ✅, proceed. Else, reject or redirect to experts/referendum.*

  #### **II. HARD-STOP QUESTIONS (7 mins)**  
  *A single "NO" kills it dead. No appeals.*  
  1. **🔥 Urgency Check:** *"Must this be solved in under 90 days?"*  
     **NO** → Proceed | **YES** → **REDLIGHT** (Sortition = slow democracy).  
  2. **🧠 Technical Need:** *"Requires specialized knowledge not held by 90% of citizens?"*  
     **NO** → Proceed | **YES** → **REDLIGHT** (Use experts, not randoms).  
  3. **🎯 Mandate Contamination:** *"Will recruitment pull from self-selected groups (activists, volunteers) NOT a true civic lottery?"*  
     **NO** → Proceed | **YES** → **REDLIGHT** (Fatal! Invalidates legitimacy).  
  4. **📊 Descriptive Rep Feasibility:** *"Can we realistically get a mini-public that mirrors city demographics (age, income, race, geography)?"*  
     **YES** → Proceed | **NO** → **REDLIGHT** (If unrepresentative, outcome is illegitimate).  

  #### **III. JUDGMENT ZONES (5 mins)**  
  *Flags for political risk – doesn’t kill, but requires manager’s call.*  
  ⚠️ **Mandate Conflict Potential:** *"Could recommendations contradict elected officials’ campaign promises?"*  
     High risk → **PBW** (Mayor/council may ignore it). Low → Green.  
  ⚠️ **Polarization Trap:** *"Is this issue already tribalized (e.g., culture war)?"*  
     High → **PBW** (Assembly may deadlock or backlash). Low → Green.  
  ⚠️ **Implementation Realism:** *"Can we ACTUALLY enact their advice if controversial?"*  
     Unlikely → **PBW** (Don’t waste $ if doomed). Likely → Green.  

  #### **WHAT THIS TOOL CAN’T DO:**  
  - Guarantee political buy-in from elected leaders.  
  - Prevent public backlash if outcome is unpopular.  
  - Fix low civic trust (garbage in, garbage out).  
  - Replace legal/technical review.  

  ---

  ### **Test Runs:**  
  **Case 1: Bike-Lane Priorities Redesign**  
  - **Entry:** ✅ Public ✅ Non-tech ✅ Deliberation-friendly  
  - **Hard-Stops:**  
    1. Urgency? *No deadline → PASS*  
    2. Technical? *Layouts need common sense → PASS*  
    3. Mandate contamination? *Recruit from voter roll → PASS*  
    4. Descriptive rep? *City has good census data → PASS*  
  - **Judgment:**  
    ⚠️ Mandate conflict? *Mayor promised "no downtown bike lanes" → HIGH RISK (PBW)*  
    ⚠️ Polarization? *Cyclists vs. drivers → MODERATE (PBW)*  
    **→ VERDICT: PROCEED BUT WARN (PBW)** *"Assembly likely recommends downtown lanes – be ready for mayor to rage-quit."*  

  **Case 2: Emergency Drought-Rationing Rules**  
  - **Entry:** ✅ Public ❓ **Non-tech?** *Rationing needs hydrology/equity models → AMBIGUOUS*  
  - **Hard-Stops:**  
    1. Urgency? *"Must act in 30 days!" → YES → REDLIGHT*  
    *(Stop here – no need to check further)*  
    **→ VERDICT: REDLIGHT** *"Urgency + technical complexity = sortition misfire. Hand to water dept + crisis team."*  

  ---

  **Why this works:**  
  - **Kills garbage pitches fast** (drought example died in 3 mins).  
  - **Flags political landmines** (bike-lane mandate conflict).  
  - **No false positives** – mandate contamination/urgency are unforgiving.  
  - **Casual but brutal** – no ivory tower jargon, just actionable filters.  

  Print it, slap it on a clipboard, and use it to shut down 80% of assembly spam by coffee break. You’ll still need values calls on the PBWs... but that’s why the city manager gets paid the big bucks 😉.
