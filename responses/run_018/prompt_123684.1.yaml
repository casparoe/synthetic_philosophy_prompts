prompt: |-
  As a software engineer without formal philosophical training, I am designing architectures for long-term cognitive-state preservation and substrate migration. Before I adopt any framework, I want the full specification.

  Write the desiderata that any adequate theory of personal identity and survival must meet to be useful for gradual mind uploading and incremental substrate replacement. I need the complete list of requirements: the engineered scenarios it must correctly adjudicate, the conceptual distinctions it must preserve rather than collapse (for example, between survival and mere replication, between temporary divergence and permanent fission, or between a primary running instance and a read-only safety shadow), the empirical or neuroscientific results it cannot contradict, and the normative stakes it must respect—such as whether the original biological system retains moral standing during parallel operation.

  Ground each requirement in a concrete case drawn from the following engineered situations: (a) a decade-long neuron-by-neuron replacement of biological tissue with synthetic analogs, maintaining continuous subjective experience without a sharp transition point; (b) a suspended cognitive state that is resumed on different hardware while the original biological brain remains active for months, then is deactivated region-by-region; (c) a "shadow" backup running in read-only mode on isolated hardware, activated only upon primary failure; (d) a temporary six-month divergence in affective-processing latency during hybrid operation that eventually reconverges; and (e) the choice between this gradual path and destructive high-fidelity scanning that yields exactly one digital instance.

  For each desideratum, indicate whether it is non-negotiable for any serious theory or a preference specific to one camp—such as bodily continuity, psychological continuity, singular self-reference, substrate independence, or non-branching. Then state clearly whether any subset of these desiderata is jointly unsatisfiable given standard rational constraints—for example, whether preserving strict numerical identity, allowing substrate-independent survival, and forbidding any parallel instance can all hold together.

  Finally, briefly assess how three broad approaches—psychological-continuity theories, biological or animalist accounts, and substrate-independent patternist or functionalist views—measure up against your list. Do not provide bibliographies, reading lists, or citations, and do not invoke obscure theories I am unlikely to have encountered.

  Please write your response in American English, in a formal and polished style.
reasoning: |-
  Okay, the user is a software engineer working on mind uploading and substrate replacement. They need a clear set of requirements for personal identity theories that can handle their technical scenarios. Let me unpack their request.

  First, they're designing systems for gradual cognitive preservation and migration. Their examples include neuron-by-neuron replacement, suspended states with parallel operation, read-only backups, temporary divergences, and destructive scanning choices. Each scenario tests different aspects of identity.

  The core challenge is translating philosophical concepts into engineering specs. They need criteria that can actually decide cases like: when does survival happen? When is a copy just a replica? How to handle branching instances? And what moral implications each scenario carries.

  Hmm, they specifically want to avoid academic jargon and focus on practical adjudication. The examples given are brilliant stress tests: (a) tests continuity, (b) forces parallel instance resolution, (c) pits backup vs identity, (d) challenges temporary divergence tolerance, and (e) compares gradual vs destructive methods.

  For each requirement, I'll need to: ground it in their examples, mark its negotiability (is this universally required or camp-specific?), and check for logical conflicts. The big tension points will be around numerical identity vs branching, and biological continuity vs functionalism.

  The assessment part is tricky - must compare psychological, biological, and patternist theories without citations. I'll focus on how each handles the engineered cases: e.g., biological theories fail substrate independence, patternism struggles with singular self-reference.

  Key pitfalls to avoid: don't assume philosophical knowledge, don't collapse survival/replication distinctions, and explicitly flag any unsatisfiable desiderata combinations (like demanding both strict identity and parallel instances).

  The moral dimension is crucial too - especially for case (b) where biological and digital instances coexist. Any theory must clarify whose experiences "count".

  This feels like building acceptance criteria for identity theories. The engineer needs to know which philosophical frameworks won't break under real implementation stresses.
answer: |-
  Here are the desiderata for a theory of personal identity relevant to engineered substrate migration and mind uploading, derived from your specified scenarios, categorized by their grounding, negotiability, and logical constraints.

  ### Core Desiderata (Non-Negotiable for Engineering Utility)
  1.  **Gradual Replacement without Identity Disruption (Grounded in Scenario A)**
      *   **Requirement:** The theory must recognize survival through neuron-by-neuron replacement with functionally identical synthetic analogs, where subjective experience remains unbroken. It must entail that the resulting synthetic system *is* the original person, not a successor or replica.
      *   **Negotiability:** Non-negotiable for substrate migration. Contradicts strict biological essentialism but aligns with psychological continuity and functionalism.
      *   **Distinction Preserved:** Survival vs. Replication (this *is* survival, not mere replication).

  2.  **Distinction Between Survival and Replication (Grounded in Scenarios B, C, E)**
      *   **Requirement:** The theory must clearly differentiate between:
          *   The *original* system surviving a process (Scenario A, potentially Scenario D).
          *   A *new* but qualitatively identical instance being created (Scenario C backup activation, Scenario E destructive scan *if* original is destroyed, Scenario B digital activation *if* biological original survives).
      *   **Negotiability:** Non-negotiable. Essential for ethical and practical decision-making (e.g., backup use, destructive scanning). Requires a criterion beyond mere qualitative similarity.
      *   **Distinction Preserved:** Survival vs. Replication (core).

  3.  **Handling Parallel Instances & Moral Standing (Grounded in Scenario B)**
      *   **Requirement:** The theory must adjudicate identity and moral standing when multiple instances (biological original and digital copy) run in parallel. It must specify:
          *   Which instance(s) constitute the original person (if any).
          *   The moral standing of *each* instance during parallel operation (e.g., is the biological original still "me"? Is the digital copy also "me" or a distinct entity with rights?).
      *   **Negotiability:** Non-negotiable for parallel operation safety protocols and ethics. Directly challenges theories demanding strict numerical identity or non-branching.
      *   **Distinction Preserved:** Primary Instance vs. Forked Instance; Singular Identity vs. Branching Identity.

  4.  **Temporal Divergence Tolerance with Reconvergence (Grounded in Scenario D)**
      *   **Requirement:** The theory must allow for *temporary* divergence in cognitive states, processing speed, or even affect (e.g., due to hybrid system latency), provided the systems eventually reconverge to a sufficiently similar state and maintain causal linkage. Survival should not be invalidated solely by such temporary, functionally irrelevant differences.
      *   **Negotiability:** Non-negotiable for realistic hybrid/substrate transition engineering where perfect sync is impossible. Favors psychological continuity/functionalist views over strict instantaneous identity criteria.
      *   **Distinction Preserved:** Temporary State Divergence vs. Permanent Fission; Functional Equivalence vs. Perfect Identity.

  5.  **Backup Status without Identity Claim (Grounded in Scenario C)**
      *   **Requirement:** The theory must classify a read-only, non-active backup ("shadow") as *not* being an instance of the person, just inert data. Its activation *creates* a new instance (a replica), distinct from the original if the original still exists.
      *   **Negotiability:** Non-negotiable for backup system design and ethics. Requires identity to be tied to active process/continuity, not mere static pattern existence. Contradicts theories where identity is solely in the information pattern regardless of instantiation.
      *   **Distinction Preserved:** Active Process vs. Static Data; Survival vs. Replication (applied to activation).

  ### Important Preferences (Camp-Specific)
  6.  **Substrate Independence (Grounded in Scenarios A, B, E)**
      *   **Requirement:** Survival should not fundamentally depend on the specific material substrate (biological neurons, silicon, etc.) but on the preservation of the relevant cognitive structure, function, and continuity.
      *   **Negotiability:** Preference (Functionalist/Patternist camp). Non-negotiable for the *goal* of substrate migration. Directly contradicted by Biological/Animalist views.
      *   **Empirical Constraint:** Cannot contradict evidence that specific cognitive functions *require* specific biological properties not replicable synthetically (though current neuroscience lacks evidence for this at the functional level relevant to identity).

  7.  **Primacy of Subjective Continuity (Grounded in Scenarios A, B, D)**
      *   **Requirement:** The uninterrupted (or minimally disrupted) flow of first-person subjective experience should be a primary indicator of survival. A sharp break in subjective experience (e.g., destructive scan/upload) should require justification for claiming survival.
      *   **Negotiability:** Preference (emphasized by Psychological Continuity views). While desirable, strict non-branching theories might downplay it if continuity of psychology/causation is deemed sufficient without subjective flow.
      *   **Normative Stake:** Impacts the perceived safety and acceptability of methods (gradual vs. destructive).

  8.  **Resolution of Fission (Grounded in Scenarios B, C activation)**
      *   **Requirement:** The theory should provide a clear, non-arbitrary way to adjudicate identity after permanent fission (e.g., both instances in Scenario B continuing indefinitely). Options include: neither is original, both are original but distinct persons, one inherits identity based on a privileged criterion (e.g., causal origin, substrate).
      *   **Negotiability:** Preference (various camps handle this differently: Parfitian reductionism vs. non-branching requirements). Essential for ethics of forking but admits multiple defensible answers.

  ### Logical Constraints & Joint Unsatisfiability
  *   **Unsatisfiable Triad:**
      1.  **Strict Numerical Identity:** The person is a single, indivisible entity persisting through time.
      2.  **Substrate-Independent Survival:** Survival can occur across different physical substrates.
      3.  **Forbidding Parallel Instances:** There can never be more than one instance claiming to be the original person at a time.
  *   **Conflict:** Scenarios like (B) create parallel instances. If survival is substrate-independent (2), both instances might have equal claim initially. However, strict numerical identity (1) forbids two entities being the *one* original person simultaneously. Forbidding parallel instances (3) forces a choice that violates either the equality implied by (2) or the continuity of one/both streams. **These three cannot all be true.** Engineering realities (B, C activation) force confrontation with branching.
  *   **Resolution:** Engineering practice typically requires sacrificing either strict numerical identity (adopting a continuity-based view allowing branching) or accepting substrate dependence. Forbidding parallel instances is often pragmatically enforced (e.g., kill original after upload) but isn't a fundamental metaphysical constraint.

  ### Assessment of Major Approaches

  1.  **Psychological Continuity (PC):**
      *   **Strengths:** Excels at (1) Gradual Replacement, (4) Temporal Divergence Tolerance, (6) Substrate Independence (implied), (7) Subjective Continuity focus. Provides tools for (8) Fission resolution (often concluding neither is numerically identical to original, but both are psychologically continuous successors).
      *   **Weaknesses:** Struggles sharply with (2) Survival vs. Replication and (3) Parallel Instances under non-branching clauses. Without non-branching, it risks collapsing survival into replication in cases like (B) - both instances are psychologically continuous, so both "survive" as successors, muddying uniqueness. Handles (5) Backups well only if continuity is process-based. Can feel counterintuitive regarding numerical identity.

  2.  **Biological / Animalist (BA):**
      *   **Strengths:** Clear on (2) Survival vs. Replication (only the original biological organism survives) and (3) Parallel Instances (only the biological original is "me"; the digital is a replica). Handles (5) Backups unambiguously (inert data).
      *   **Weaknesses:** Fails catastrophically on (1) Gradual Replacement (synthetic brain isn't the organism), (6) Substrate Independence (core rejection), and (4) Temporal Divergence (if divergence involves substrate change). Renders substrate migration conceptually impossible for *survival*. Ignores (7) Subjective Continuity if the organism persists. Useless for core engineering goals.

  3.  **Substrate-Independent Patternism / Functionalism (SI-PF):**
      *   **Strengths:** Excels at (1) Gradual Replacement, (6) Substrate Independence (core tenet), (4) Temporal Divergence Tolerance (if function preserved). Handles (5) Backups clearly (inert pattern != person; activation creates instance).
      *   **Weaknesses:** Struggles profoundly with (2) Survival vs. Replication and (3) Parallel Instances. If identity *is* the pattern/function, then any perfect copy is equally "me" (failing 2 & 3). Needs additional criteria (like unique causal continuity or process) to rescue these distinctions, moving closer to PC. May downplay (7) Subjective Continuity if pattern is defined objectively. Resolution of (8) Fission often leans towards multiplicity.

  ### Conclusion
  An adequate theory for engineering must satisfy the **Non-Negotiable** requirements (1-5). This strongly favors **Psychological Continuity** or robust **Functionalist/Patternist** views that incorporate a non-arbitrary criterion for unique survival through continuous causation (e.g., a non-branching requirement *or* a clear account of branching consequences). **Biological/Animalist** theories are rendered inadequate by their failure on (1) and (6). All theories face significant challenges from parallel instance scenarios (B), forcing compromises on strict numerical identity or uniqueness. The core tension lies in balancing the need for a unique, continuous "self" with the empirical and engineering realities of potential copying, branching, and substrate change.
