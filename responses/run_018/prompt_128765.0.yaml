answer: |-
  ## Exam Question:  
  **"Evaluate whether recasting predication as a functional mapping (e.g., treating the copula as a function from properties to objects) genuinely resolves Bradley’s regress concerning the unity of the proposition, or whether it merely relocates the regress to the level of functional application. In your assessment, consider both the claim that this approach eliminates the need for a separate unifying relation and the objection that applying a function to an argument requires its own account of unification. Conclude by arguing whether this strategy secures propositional unity or simply disguises the original problem."**

  ---

  ## Model Answer (Approx. 700 words)

  Bradley’s regress challenges the relational model of predication. If a proposition like "a is F" requires a relation (e.g., instantiation) to unify object *a* and property *F*, then what unifies *this* relation to *a* and *F*? An infinite regress of relations threatens, suggesting relational models fail to explain propositional unity. The functional approach proposes a solution: treat the copula not as a two-place relation, but as a function *f* that maps properties to objects (e.g., *f(F) = a*). This essay argues that while this move initially avoids the explicit regress, it ultimately relocates the problem to the application of the function itself, failing to secure genuine unity.

  **1. The Functionalist Claim: Eliminating the Relational Unifier**  
  Proponents argue that functions dissolve Bradley’s regress by eliminating the need for a separate *relating entity*. In "a is F", the copula is reinterpreted as a function *f* whose application *f(F)* directly outputs *a*. Unity is achieved intrinsically through the operation of function application itself – no additional "glue" is required. The proposition’s structure is captured by the mathematical act of applying *f* to *F*, yielding *a* as the value. This contrasts with the relational model, where the instantiation relation *R(a, F)* stands as a third entity demanding its own unification with *a* and *F*, triggering the regress. On the functional view, the function *is* the structuring principle; its application *constitutes* the unity. There is no third element requiring unification, so the explicit regress does not begin.

  **2. The Meta-Level Objection: Regress in Functional Application**  
  However, this solution merely disguises the problem. The functional application *f(F)* itself must be unified. What accounts for the togetherness of the function *f* and its argument *F* such that they form a single, meaningful unit – *f(F)* – whose output is *a*? The functionalist must explain how *f* and *F* combine to yield this specific application. If this combination requires a further principle or entity (e.g., an "application relation" or a further function), a meta-level regress analogous to Bradley’s emerges: what unifies *that* principle to *f* and *F*? Crucially, the functional model replaces the dyadic instantiation relation with a *functional complex* – the pairing of the function and its argument. The unity of *this* complex – the fact that *f* is being applied *to F* rather than merely juxtaposed with it – demands explanation in precisely the same way the unity of *a* and *F* demanded explanation in the relational model. Function application does not magically avoid the need for metaphysical unification; it presupposes it at a higher level. The functional "operation" itself becomes the new locus of Bradley’s challenge.

  **3. Judgment: Relocation, Not Resolution**  
  The functional strategy does not genuinely secure propositional unity; it merely relocates Bradley’s difficulty. While it successfully avoids the *initial step* of the explicit regress concerning a third relational element binding object and property, it fails to provide a regress-stopping account of the unity inherent in its own foundational operation – functional application. The functionalist’s claim that function application is an unanalyzable primitive unity is no more satisfying than the relationalist’s claim that instantiation is primitive. Both appeal to brute unification. If the relationalist’s primitive relation is problematic for lacking internal explanation, the functionalist’s primitive application is equally so. The core insight of Bradley’s regress is that any analysis positing distinct components requires an account of their togetherness. The functional model posits distinct components (*f* and *F*) whose togetherness in the act of application is fundamental. But this is structurally isomorphic to the relationalist’s primitive instantiation. The regress is therefore not dissolved but shifted: the question becomes how the function and its argument form a unified act of application, rather than how a relation and its relata form a unified fact. Neither strategy ultimately explains unity; both ultimately rely on an unanalyzed, primitive combinatorial act vulnerable to the regress’s core demand for explanation. Consequently, the functional view does not represent a decisive advance over standard relationalism in resolving Bradley’s challenge to propositional unity.

  ---

  ## Marking Scheme (Total: 25 points)

  **I. Core Argument Structure (15 points)**
  *   **A. Functionalist Claim (5 pts):**
      *   (3 pts) Clear explanation of recasting copula as a function (e.g., *f(F) = a*).
      *   (2 pts) Correct identification of how this *appears* to avoid Bradley’s regress: eliminating the third relational entity and appealing to the unity inherent in function application itself.
  *   **B. Meta-Level Objection (7 pts):**
      *   (3 pts) Clear articulation that functional application (*f(F)*) itself constitutes a complex requiring unification.
      *   (4 pts) Forceful argument explaining *why* this is a problem: The need to account for how *f* and *F* are combined/jointly instantiated to form the act of application, potentially restarting the regress at the meta-level (e.g., what unifies the "application" to *f* and *F*?).
  *   **C. Reasoned Judgment (3 pts):**
      *   (1 pt) Clear verdict (e.g., relocates, not resolves).
      *   (2 pts) Persuasive reasoning: Recognition that the functionalist's "primitive application" is analogous to the relationalist's "primitive relation," failing to provide a deeper explanation of unity and leaving the core problem unsolved.

  **II. Conceptual Clarity & Precision (7 points)**
  *   (3 pts) Accurate understanding of Bradley’s regress (threat to unity via infinite demand for unifiers).
  *   (2 pts) Clear distinction between relational and functional models of predication.
  *   (2 pts) Precise use of terms (copula, function, argument, application, unity, regress, meta-level, primitive).

  **III. Avoiding Common Pitfall (-3 points if present)**
  *   **Specific Mistake (Conflation):** **(-3 pts)** Conflating the functional view (mapping properties to objects via the copula-as-function) with a *trope-theoretic* account (where "a is F" involves a particularized property - the F-ness of a - requiring no further unification). These are distinct solutions. Weaker answers might describe the functional view as just "eliminating universals" or "making properties particulars."

  **IV. Overall Structure & Coherence (3 points)**
  *   (1 pt) Clear introduction stating the problem and thesis.
  *   (1 pt) Logical flow between the three core moves (Claim, Objection, Judgment).
  *   (1 pt) Effective conclusion summarizing the argument and verdict.

  ---
  **Notes for Graders:**
  *   Focus on conceptual grasp, not historical exegesis or citation.
  *   Reward clear reasoning over verbosity.
  *   Deduct heavily for the "Conflation" mistake; it indicates a fundamental misunderstanding of the functional proposal.
  *   A top-tier answer (21-25 pts) will sharply define the functional move, deliver a devastating meta-objection, and conclude decisively that the problem is relocated, drawing the analogy to primitive relational unity. Good answers (15-20 pts) will cover all three moves adequately but may lack depth in the objection or judgment. Weaker answers (<15 pts) will likely misrepresent the functional view, fail to articulate the meta-objection clearly, or offer an unsubstantiated judgment.
