  1. **Introduction (5 min)**: The problem of self-trust and the escrow example.
  2. **Löb's Theorem (10 min)**: Statement and intuitive explanation.
  3. **Object vs Meta (10 min)**: Distinction and the need for meta-endorsement.
  4. **Formalizing the Agent (15 min)**: How the agent represents its own proofs and the escrow contract.
  5. **The Obstacle in Escrow (15 min)**: Why the contract doesn't help the agent gain new confidence.
  6. **Misconceptions (10 min)**: Address as they come up, or proactively at the end of step 4 and 5.
  7. **Check for Understanding (5 min)**: The question above.
  8. **Debrief (5 min)**: Emphasize the purely internal nature of the obstacle and what we skipped.

  Total: 75 minutes.

