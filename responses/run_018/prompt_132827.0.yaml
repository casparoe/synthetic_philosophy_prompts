  ### (40-60 min) The Escrow Example
  - Present the escrow scenario in detail.
  - The agent sets up a contract: if at t0 it proves that at t1 it will defect (i.e., not do A), then the contract forces it to do A (by severe punishment).
  - This contract is intended to ensure: if the agent proves at t0 that it will do A (or not defect) then it will do A? Actually, we want to focus on the defection. Let P be "the agent does A at t1". The contract says: if □_{t0} (¬P) then P (because the contract forces P to avoid punishment). So we have: □_{t0} (¬P) → P.
  - But note: this is equivalent to ¬P → ¬□_{t0} (¬P). That is, if the agent does not do A, then it did not prove at t0 that it wouldn't do A? Not exactly. We have: if the agent proves ¬P at t0, then P is forced. So the agent at t0 has: □_{t0} ¬P → P.
  - Now, the agent would like to prove P. It might try to use the contract: if I prove ¬P, then P, so ¬P leads to a contradiction? Therefore, I cannot prove ¬P. But that doesn't give me P. I might still not do A and not have proved ¬P.
