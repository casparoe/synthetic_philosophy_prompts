prompt: |-
  I'm in a metaphysics reading group with my friend Maya and we've been arguing about cross-world identity, not in the usual textbook framing but more like whether the same "you-thing" can sit in two worlds or if we're just tracking similarity lines. Anyway, her verdicts so far have been pretty steady: yes, you'd still be you if you'd become a musician instead of an accountant; yes if you'd grown up in Osaka with the same parents; yes even if you'd lost your left eye in an accident; but no, if the specific sperm and egg that formed you had never met — even if your parents had a different child right after — then there's no world where you exist; also no to a perfect brain-upload running on silicon, that's just a copy; yes, Sherlock Holmes could have had a sister and still be Sherlock Holmes; and she said that if your parents had never met at all, there wouldn't be anyone in that world who counts as you, only people who are somewhat like you. Now there's this branching case she's stumped on: at the exact moment of your birth, reality splits — in one branch you grow up normally, in the other a clone is made from your cells and raised in the exact same enviroment. Would Maya say the clone is you? I'm less interested in her gut answer than in mapping the rules that fit all her earlier calls — maybe literal transworld identity with essential origin, maybe a counterpart view that weights causal origin over psychological similarity, maybe even some modal-part view where you have parts scattered across worlds — and saying which one she probably runs. Also, what's the further case that would actually split them apart, since right now they all seem to agree on the upload being a copy and the career change being okay?
reasoning: |-
  Okay, the user is part of a metaphysics reading group with Maya, and they're debating cross-world identity. They've described Maya's specific judgments on various scenarios: she accepts identity through changes like career, location, or losing an eye but draws the line at different biological origins or brain uploads. Now they're stuck on a branching scenario at birth with a clone raised identically. The user wants to map Maya's implicit rules and find a test case to distinguish between theories.

  First, I need to parse Maya's existing verdicts. She seems to prioritize the biological origin—specifically the sperm and egg meeting—as essential. That's why she denies identity if the parents never met or if a different child is born. The clone case is tricky because it shares the same origin but diverges immediately after birth. 

  Maya's rejection of the brain upload as a copy suggests she values biological continuity over psychological similarity. Sherlock Holmes having a sister is accepted because fictional characters don't have fixed origins, unlike real people. This points toward origin essentialism for biological entities.

  The theories in play are origin essentialism, counterpart theory with causal weight, and modal parts. Origin essentialism strictly requires the same biological start. Counterpart theory could prioritize origin but might allow psychological similarity in some cases. Modal parts would see the clone as a counterpart but not identical. 

  For the clone scenario, since the clone comes from the same zygote but branches at birth, origin essentialism might still consider it the same person because the origin is identical. However, Maya might hesitate because the clone is a separate physical entity. Her prior emphasis on the sperm and egg meeting as necessary but possibly sufficient could lead her to say the clone is still her. 

  To split the theories, a scenario where the origin is the same but the entity is duplicated later might help. For example, teleportation creating two copies. Origin essentialism would struggle here, possibly denying both are identical. Counterpart theory might see both as counterparts but not identical. Modal parts would handle duplication naturally. 

  Another test case could be gradual replacement: if neurons are replaced with synthetic ones one by one, when does identity stop? Origin essentialism might say never if origin is preserved, while others might differ. 

  The user's deeper need is to clarify Maya's underlying principles and find a decisive test case. They might also want to resolve their debate by understanding which metaphysical framework aligns with Maya's intuitions, possibly to strengthen their argument or explore inconsistencies.
answer: |-
  Based on Maya's consistent verdicts, her implicit metaphysical rules strongly point to **Origin Essentialism (specifically Biological Origin Essentialism)**, likely within a framework of **Literal Transworld Identity** (LTI). Here's the breakdown and prediction for the clone case:

  ### Mapping Maya's Rules (The "Maya-System")
  1.  **Biological Origin is Necessary & Sufficient Core:** The meeting of the specific sperm and egg is *essential* for being you. No meeting = No you. Same meeting = Potential for you (given normal development).
  2.  **Literal Identity Requires Causal Continuity:** Identity isn't just similarity; it requires a spatiotemporally continuous causal chain originating from that biological event. A perfect copy (brain upload) lacks this causal chain from *your* origin, so it's not you.
  3.  **Robustness Within the Causal Chain:** Once the essential origin is secured, significant changes *along the continuous causal chain* (career, location, even physical alterations like losing an eye) preserve identity. These are accidental properties.
  4.  **Fictional Characters are Different:** Sherlock Holmes is an abstract artifact/character. His identity is determined by constitutive properties (brilliant detective, Baker Street, Watson, etc.), not a biological origin. Adding a sister is consistent with those core properties.
  5.  **No Origin, No Identity, Only Similarity:** If your parents never met, there's no entity sharing *your* essential origin. Any similar person in that world is just that – similar, but not *you*.

  ### Prediction for the Branching Clone Case
  *   **Maya would say the clone *IS* you (at least initially).**
      *   **Why:** Both individuals (the original and the clone) originate from *the exact same biological event* – the zygote formed by that specific sperm and egg meeting. The branching happens *immediately after* the essential origin event (conception/birth). At the moment of branching, both share the numerically identical origin. The causal chain splits, but both chains originate from *your* essential starting point.
      *   **Analogy:** Think of it like identical twins, but artificially induced at birth instead of during embryonic development. Maya's essentialism about the sperm/egg meeting strongly suggests she would see both twins (or both branches) as originating from *the* essential event defining "you". The duplication happens *after* the essential origin is established.

  ### Why the Other Theories Don't Fit As Well
  1.  **Counterpart Theory (Weighting Origin):** Could mimic many verdicts. However, Maya's *strong* denial of identity if the sperm/egg don't meet ("no world where you exist") and her insistence that the upload is *not* you (merely a copy/similar) suggest she's talking about literal identity of a particular entity, not just the best counterpart. Her language ("counts as you") leans towards LTI. Counterpart theory struggles to explain the *absolute* "no existence" claim without origin.
  2.  **Modal Parts:** This could handle branching more naturally. However, Maya's verdicts don't readily suggest she thinks of individuals as having parts scattered across worlds. Her "yes" to career/location change seems like the *whole* person persists changed, not that part of them does. Her "no" to different-sperm scenarios feels like a denial of existence, not a denial of a part. Her language is more entity-focused than part-focused.

  ### The Crucial Test Case to Split Origin Essentialism and Counterpart Theory
  The brain upload case already shows a difference in emphasis (literal continuity vs. similarity), but to *force* a split *specifically* on branching/duplication scenarios where Origin Essentialism becomes strained, consider:

  **The Delayed Duplication Teleporter:**
  1.  You step into a teleporter. It scans you perfectly down to the quantum state, *destroys* your original body/brain, and creates an identical copy (from new matter) on Mars using the scan data.
  2.  **Variant A (Malfunction):** The destruction mechanism fails. The original you is still on Earth. The copy is on Mars. Both are psychologically and physically identical at the moment of teleportation and share all memories up to that point.
  3.  **Variant B (Pre-Scan):** The teleporter scans you *without* destruction. Years later, using that old scan data (which is now outdated), someone creates a copy on Mars. The original you is still on Earth, years older with new memories.

  **Predicted Maya-System (Origin Essentialism/LTI) Response:**
  *   **Variant A:** *Neither* is the original you. The original you was destroyed. The Earth body is a spontaneously reassembled duplicate (lacking the continuous causal chain from your origin). The Mars copy is also just a duplicate. Both are "copies," neither is *literally* you. The *you* defined by that sperm/egg origin and continuous chain ceased to exist when the original was destroyed.
  *   **Variant B:** The original on Earth is clearly you (continuous causal chain). The Mars copy is *not* you. It's a copy created from data, lacking the causal chain from your biological origin. It's no different than a brain upload.

  **Predicted Counterpart Theory (Origin-Weighted) Response:**
  *   **Variant A:** *Both* could be considered very good counterparts of the original you (especially if origin is highly weighted). They are equally similar and both exist in worlds very close to the original's world. There might be debate about which is the *best* counterpart, but both likely count as "you" in a counterpart sense. The destruction of the original might be seen as the end of that entity, but the counterparts carry on the role.
  *   **Variant B:** The Earth original is the primary counterpart of your past self. The Mars copy is also a counterpart (sharing origin via the scan data and high similarity at scan time), but perhaps a slightly less good one due to the time gap and lack of recent continuity. It's still a version of "you".

  **Why this Splits Them:**
  *   Origin Essentialism/LTI (Maya-System) is forced into a counterintuitive "neither is you" position in Variant A because the continuous causal chain from the essential origin is broken by destruction and reconstruction (even perfect). Identity is strictly tied to *one* continuous entity.
  *   Counterpart Theory can much more easily accommodate both duplicates as being "you" (in the counterpart sense), especially in Variant A where they are symmetric. It handles duplication naturally by allowing multiple counterparts in different worlds (or branches). Origin is important for similarity scoring, but perfect similarity *can* outweigh it, especially in duplication scenarios.

  This test case moves beyond mere copying (upload) to a scenario of *branching/duplication with destruction*, forcing the theories to reveal their core commitments: strict numerical identity tied to origin+continuity vs. similarity-based counterpart relations that can tolerate duplication. Maya's likely "neither" verdict in Variant A would strongly confirm her adherence to Origin Essentialism/LTI. If she considered one or both to still be "you" in some sense, it would push towards Counterpart Theory.
