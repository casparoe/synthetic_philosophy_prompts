prompt: |-
  I'm a software engineer with no formal philosophy background, and I've been trying to map concepts from my work onto questions about moral worth. In code review, we sharply distinguish between a patch that fixes a bug by coincidence and one that fixes it because it addresses the root cause; analogously, in ethics people talk about acting in accordance with duty versus acting from duty. Before I read the standard literature in depth, I want a full specification of what any adequate theory of moral worth must actually deliver. Write the desiderata: the cases it has to get right (for example, an agent who does the right thing for a bad reason, one who acts from a genuinely correct reason but harms someone through non-culpable ignorance, one whose motives are genuinely mixed, and a "refactoring" scenario—borrowed from version control—where an agent amends their stated justification after acting without changing the causal history of the decision), the distinctions it must preserve (such as between having moral worth and being merely praiseworthy, between primary and derivative moral value, and between an agent's actual reasons and the reasons that were available to them), and the results from empirical psychology or behavioral economics it must remain consistent with (for instance, evidence that people rarely act for explicitly articulated reasons). For each desideratum, provide the motivating case or consideration behind it, and flag any pair you suspect is jointly unsatisfiable—I am especially interested in whether accommodating the "refactoring" case forces a collapse of the distinction between actual and available reasons. Then, briefly, score how a Kantian view centered on maxims, a virtue-ethical view centered on character, and a consequentialist view centered on outcomes fare against your list, but keep the weight on the criteria rather than on the scoring. End with a single machine-readable line beginning exactly with Verdict: followed by a one-sentence summary of the deepest tension in the list.
reasoning: |-
  We are crafting a list of desiderata for a theory of moral worth. The user is a software engineer drawing analogies from code review to ethics. We must cover:

  1. Cases it must get right:
     a. Right action for a bad reason (e.g., helping someone to show off).
     b. Right action from a genuinely correct reason (but with unintended harm due to non-culpable ignorance).
     c. Mixed motives (some good, some bad).
     d. "Refactoring" scenario: agent changes stated justification after acting without altering the causal history of the decision.

  2. Distinctions it must preserve:
     a. Between having moral worth and being merely praiseworthy (i.e., an action can be praiseworthy because it had good effects, but without moral worth if the motive was bad).
     b. Between primary and derivative moral value (e.g., an action might be good because it is done from a good motive (primary) vs. because it has good effects (derivative)).
     c. Between an agent's actual reasons and the reasons that were available to them (this relates to epistemic constraints).

  3. Results from empirical psychology it must remain consistent with:
     a. Evidence that people rarely act for explicitly articulated reasons (i.e., post-hoc rationalization is common).

  We also note that the user is especially interested in whether the refactoring case forces a collapse of the distinction between actual and available reasons.

  Then, we briefly score three ethical theories (Kantian, Virtue-Ethical, Consequentialist) against the list, but focus on the criteria.

  Finally, we end with a Verdict: one-sentence summary of the deepest tension.

  Let's break down each desideratum:

  **Cases:**

  1. **Bad Reason Case**: An agent does the right thing but for a bad reason (e.g., helps an elderly person cross the street to impress onlookers). The theory must judge that the action lacks moral worth even though it is the right action.

     *Motivation*: We need to capture that moral worth depends on the quality of the motive. Analogous to a patch that fixes a bug by coincidence: it works but isn't reliable.

  2. **Non-Culpable Ignorance Case**: An agent acts from a genuinely correct reason but causes harm due to non-culpable ignorance (e.g., a doctor prescribes a medication that is later found to cause a severe allergic reaction, but there was no prior indication of the allergy). The theory must preserve the moral worth of the action (since the motive was good) despite the bad outcome.

     *Motivation*: Moral worth should not be undermined by unforeseeable consequences. This is like a patch that addresses the root cause but fails in an edge case that couldn't have been reasonably anticipated.

  3. **Mixed Motives Case**: An agent acts from a mix of good and bad motives (e.g., donates to charity partly out of genuine concern and partly for tax benefits). The theory must account for the complexity and perhaps assign partial or diminished moral worth.

     *Motivation*: Real-life actions often have multiple motivations. We need a way to handle this without being all-or-nothing.

  4. **Refactoring Scenario**: After acting, the agent changes their stated justification without changing the causal history (e.g., someone donates to charity and initially says it's for tax reasons, but later claims it was out of pure altruism). The theory must hold that the moral worth is fixed by the actual reasons at the time of action, not the later rationalization.

     *Motivation*: Analogous to version control: changing the commit message doesn't change the code. The actual reasons (the causal history) are what matter.

  **Distinctions:**

  5. **Moral Worth vs. Praiseworthiness**: The theory must distinguish between an action that is praiseworthy (because it had good consequences) but lacks moral worth (because of bad motives) and one that has moral worth (because of good motives) even if the consequences are bad (due to non-culpable ignorance). 

     *Motivation*: We must not conflate the evaluation of the action's outcome with the evaluation of the agent's will.

  6. **Primary vs. Derivative Moral Value**: The theory must account for actions that are good primarily because of the motive (e.g., helping someone out of genuine concern) versus those that are good derivatively (e.g., helping someone by accident, which is good because it helps, but the motive was bad). 

     *Motivation*: This distinction helps in understanding the source of moral value.

  7. **Actual Reasons vs. Available Reasons**: The theory must distinguish between the reasons that actually motivated the agent and the reasons that were available to the agent at the time (i.e., what they could have known). 

     *Motivation*: This is crucial for handling cases of ignorance (culpable or not). Also, the refactoring scenario tests this: the actual reasons are fixed, but the available reasons might have included the one the agent later articulates.

  **Empirical Constraints:**

  8. **Post-Hoc Rationalization**: The theory must be consistent with the psychological finding that people often act without explicit, articulated reasons and then rationalize their actions afterward. 

     *Motivation*: A theory that requires agents to have explicit, articulated reasons at the time of action would be empirically inadequate.

  **Suspected Tensions:**

  The user is especially interested in the refactoring scenario and whether it forces a collapse of the distinction between actual and available reasons. 

  - In the refactoring case, the agent's actual reasons at the time of action are fixed. However, if the agent later articulates a reason that was available (but not actual) at the time, does that count? We want to say no: the moral worth is fixed by the actual reasons. But what if the agent is just bad at articulating? The theory must account for the possibility that the actual reason might not be explicitly articulated at the time, but it must not allow the refactored reason to replace the actual one.

  Now, we suspect that the following pair might be jointly unsatisfiable:

  - **Refactoring Scenario** (desideratum 4) and **Empirical Constraint of Post-Hoc Rationalization** (desideratum 8): 
    - The refactoring scenario requires that moral worth depends on actual reasons, which are fixed at the time of action and not altered by later rationalizations. 
    - But the empirical constraint says that people often don't have explicit reasons at the time and only articulate them later. 
    - How can we know the actual reasons if they are not articulated and subject to rationalization? This might push us to rely on available reasons (what the agent could have known) as a proxy, but that would collapse the distinction between actual and available reasons (desideratum 7). 

  Alternatively, we might have to accept that actual reasons are not necessarily explicit and may be unconscious, but then we face the problem of access: how do we determine what the actual reasons were? This is a challenge for any theory.

  **Brief Scoring of Theories:**

  We consider:

  A. **Kantian view (centered on maxims)**: 
     - Maxims are the subjective principles of volition. Moral worth is determined by acting from duty (i.e., because the maxim is in accordance with the moral law).
     - Case 1 (bad reason): Handles well. Acting for show lacks moral worth.
     - Case 2 (non-culpable ignorance): The maxim is what matters. If the doctor acted from duty (e.g., to heal), then the action has moral worth even if harm occurs.
     - Case 3 (mixed motives): Kant is often interpreted as requiring pure motives. Mixed motives might not have full moral worth. However, Kant might say that if the action is done from duty (even with other motives) it has moral worth, but this is controversial.
     - Case 4 (refactoring): The maxim is fixed at the time of action. Later rationalization doesn't change it. But Kant requires the agent to act under the description of the moral law? If the actual maxim was not the moral one, then even if the agent later claims it was, it doesn't count. However, Kant might struggle with implicit maxims.
     - Distinction 5: Clear: moral worth is about the maxim, not the outcome.
     - Distinction 6: Primary value is in the good will (acting from duty).
     - Distinction 7: Actual reasons are the maxim. But available reasons? Kant focuses on the agent's actual maxim, not what they could have known. This might be a problem for non-culpable ignorance: if the agent didn't know a fact, it might affect the maxim (e.g., the doctor's maxim might be to heal with the available means, which is good).
     - Empirical constraint 8: Kantian maxims are often explicit. But Kant allows that maxims can be implicit? However, the requirement to act from duty might be too demanding given that people rationalize.

  B. **Virtue-Ethical view (centered on character)**:
     - Moral worth is tied to the agent's character: actions express virtues or vices.
     - Case 1: If the action is done for show, it might express the vice of vanity, so lacks moral worth.
     - Case 2: If the doctor has the virtue of compassion and acts accordingly, then the action has moral worth despite the bad outcome.
     - Case 3: Mixed motives might reflect a character that is not fully virtuous. The action might have partial moral worth.
     - Case 4: The character at the time of action matters. Later rationalization doesn't change the character at that time. But character is enduring, so if the agent is lying later, that might reflect on their character now, but the original action is fixed.
     - Distinction 5: An action can be praiseworthy (because it had good effects) but not express virtue (if done by a non-virtuous person). Conversely, a virtuous action might have bad consequences and still have moral worth.
     - Distinction 6: Primary value is in the virtuous character. Actions are derivatively good if they are what a virtuous person would do, but without the virtue, they lack primary value.
     - Distinction 7: Actual reasons might be less central; what matters is the character. But character might be expressed in the reasons. Available reasons? A virtuous person would attend to available reasons, so non-culpable ignorance might be excused if the agent was being conscientious.
     - Empirical constraint 8: Virtue ethics doesn't require explicit reasons; it focuses on dispositions and habits. It can accommodate that people act without explicit reasoning.

  C. **Consequentialist view (centered on outcomes)**:
     - Typically, consequentialism evaluates actions by their consequences. Moral worth might be tied to the expected consequences (or the motive to produce good consequences).
     - Case 1: If the action produces good consequences, it might be praiseworthy, but the motive (to show off) doesn't produce good consequences in the long run? Consequentialists might focus on the motive's tendency to produce good. So a bad motive might have negative consequences in other contexts, so the action might be judged as having less moral worth? This is tricky.
     - Case 2: The doctor intended good but caused harm. If we focus on actual consequences, then the action is bad. But if we focus on expected consequences (given the available information), then the action might be good. So moral worth might be tied to the expected consequences. But then we lose the distinction between moral worth and praiseworthiness? Because an action that turned out bad due to bad luck might still have been motivated by good expected consequences.
     - Case 3: Mixed motives: if the net expected consequence is good, then the action might have moral worth? But this doesn't capture the moral worth of the motive per se.
     - Case 4: The actual motive might be what leads to consequences. If the agent later claims a different motive, but the actual motive (at the time) is what drove the action, then it is fixed. But consequentialism might not care about the motive as long as the consequences are good? Or it might care about the motive because of its long-term consequences.
     - Distinction 5: Consequentialism might collapse moral worth and praiseworthiness because both are tied to consequences (either actual or expected). This is a problem.
     - Distinction 6: The primary value is in the consequences. The motive is only derivatively good if it leads to good consequences.
     - Distinction 7: Actual reasons vs. available reasons: consequentialism might focus on the reasons that were available (for expected utility) but the actual reason might be irrelevant if the outcome is what matters? But if we tie moral worth to the motive to produce good consequences, then the actual reason must be that the agent was trying to produce good consequences. The available reasons would matter for whether the expected consequences were reasonable.
     - Empirical constraint 8: Consequentialism might require agents to have the goal of maximizing good, but that might not be explicit. However, it can accommodate that people act without explicit reasoning if we interpret their motives as aiming at good.

  **Verdict on the deepest tension:**

  The deepest tension is between the **refactoring scenario** (which requires that moral worth is fixed by the actual reasons at the time of action) and the **empirical constraint of post-hoc rationalization** (which suggests that we often don't have access to the actual reasons and that they are constructed after the fact). This tension threatens to collapse the distinction between actual and available reasons because, without clear access to actual reasons, we might have to rely on available reasons (what the agent could have known and articulated) to assign moral worth.

  Now, we write the full response.
answer: |-
  ### Desiderata for a Theory of Moral Worth  
  Below is a full specification of what an adequate theory of moral worth must deliver, structured into **cases**, **distinctions**, and **empirical constraints**. For each, I provide the motivating case or consideration and flag potential tensions. I then briefly score Kantian, virtue-ethical, and consequentialist views against the list, focusing on the criteria.  

  #### **Cases the Theory Must Get Right**  
  1. **Right Action, Bad Reason**  
     - **Case**: An agent performs a morally right action (e.g., donating to charity) but for a bad reason (e.g., to gain social status).  
     - **Motivation**: Analogous to a bug-fix patch that works *coincidentally* (e.g., a code change that resolves a crash but introduces hidden technical debt). The theory must deny moral worth here, as the action’s rightness is accidental, not grounded in moral reasoning.  
     - **Flag**: Tension with consequentialist views that tie moral worth to outcomes.  

  2. **Right Reason, Unintended Harm via Non-Culpable Ignorance**  
     - **Case**: An agent acts from a morally correct reason (e.g., a doctor prescribing a treatment to save a life) but causes harm due to unforeseeable factors (e.g., an unknown allergy).  
     - **Motivation**: Mirrors a patch addressing a bug’s *root cause* that fails in rare edge cases beyond reasonable anticipation. The theory must affirm moral worth despite the bad outcome, preserving the distinction between intention and result.  
     - **Flag**: Risks conflating moral worth with blameworthiness if the theory overemphasizes outcomes.  

  3. **Mixed Motives**  
     - **Case**: An agent acts from a blend of good and bad motives (e.g., helping a colleague partly out of genuine care and partly to secure a promotion).  
     - **Motivation**: Reflects real-world complexity (like code with both elegant and hacky elements). The theory must handle partial or graded moral worth without reducing to all-or-nothing judgments.  
     - **Flag**: Challenges Kantian purity tests; may require a scalar approach.  

  4. **Refactoring Scenario**  
     - **Case**: An agent retroactively amends their stated justification for an action (e.g., claiming altruism after donating for tax benefits) without altering the causal history of their decision.  
     - **Motivation**: Borrows from version control—rewriting a commit message doesn’t change the code. The theory must anchor moral worth to the *actual reasons at the time of action*, ignoring post hoc rationalizations.  
     - **Flag**: Suspected tension with empirical psychology (see below); may threaten the actual/available reasons distinction.  

  #### **Distinctions the Theory Must Preserve**  
  5. **Moral Worth vs. Mere Praiseworthiness**  
     - **Distinction**: Moral worth concerns the *motive* behind an action (e.g., acting from duty), while praiseworthiness concerns its *effects* (e.g., a good outcome from a selfish act).  
     - **Motivation**: Analogous to distinguishing a *robust* bug-fix (root cause addressed) from a *fragile* one (bug masked). Prevents conflating "what worked" with "why it worked."  
     - **Flag**: Consequentialism may collapse this distinction.  

  6. **Primary vs. Derivative Moral Value**  
     - **Distinction**: Primary value resides in the agent’s will or character (e.g., acting from compassion), while derivative value arises from consequences (e.g., accidental benefits from a selfish act).  
     - **Motivation**: Parallels evaluating code by its design (primary) vs. its runtime behavior (derivative). Ensures moral value isn’t reducible to outcomes.  
     - **Flag**: Virtue ethics handles this well; consequentialism may invert it.  

  7. **Actual Reasons vs. Available Reasons**  
     - **Distinction**: Actual reasons are those that *causally motivated* the agent; available reasons are those *objectively accessible* to them (e.g., facts they could have known).  
     - **Motivation**: Critical for non-culpable ignorance cases (e.g., a doctor lacking access to a patient’s undisclosed medical history). Avoids holding agents to standards beyond their epistemic reach.  
     - **Flag**: The "refactoring" case may pressure this distinction (see below).  

  #### **Empirical Constraints the Theory Must Satisfy**  
  8. **Post Hoc Rationalization**  
     - **Constraint**: People rarely act for explicitly articulated reasons; motivations are often reconstructed after the fact.  
     - **Motivation**: Evidence from psychology (e.g., Nisbett and Wilson’s studies on confabulation). The theory must not require conscious, real-time reason articulation to assign moral worth.  
     - **Flag**: Tension with Kantian maxims; may complicate access to "actual reasons."  

  #### **Suspected Tensions**  
  - **Refactoring + Rationalization vs. Actual/Available Reasons Distinction**:  
    - The "refactoring" case demands that moral worth depends on *actual reasons* (fixed at action-time), but the empirical constraint suggests actual reasons are often inaccessible or constructed post hoc. This risks collapsing the distinction: if we can’t access actual reasons, we might default to *available reasons* (what the agent *could* have articulated), eroding the barrier between the two.  
  - **Joint Unsatisfiability Risk**: Accommodating both the refactoring scenario (no moral credit for retroactive justifications) and post hoc rationalization (agents rarely know their true motives) may force theories to either:  
    (a) Overemphasize available reasons (undermining actual reasons), or  
    (b) Rely on unobservable mental states (risking empirical vacuity).  

  #### **Scoring Ethical Theories**  
  *Note: Scoring is brief and criteria-focused; "✓" = strong fit, "△" = partial fit, "✗" = weak fit.*  

  - **Kantian (Maxims)**:  
    - Cases: 1✓ (denies worth for non-duty motives), 2✓ (maxim matters, not outcome), 3✗ (mixed motives often fail purity tests), 4△ (maxims are fixed but hard to verify post hoc).  
    - Distinctions: 5✓ (worth ≠ praiseworthiness), 6✓ (primary value in good will), 7△ (actual reasons via maxims, but available reasons ignored).  
    - Empirical: 8✗ (requires explicit maxims, clashing with confabulation).  
    - **Summary**: Strong on distinctions but weak on mixed motives and psychology.  

  - **Virtue-Ethical (Character)**:  
    - Cases: 1✓ (bad reason reveals vice), 2✓ (non-culpable ignorance excusable), 3△ (mixed motives reflect character flaws), 4✓ (character at action-time fixes worth).  
    - Distinctions: 5✓ (worth tied to virtue, not outcomes), 6✓ (primary value in character), 7✓ (actual reasons as expressions of character; available reasons inform culpability).  
    - Empirical: 8✓ (character traits are dispositional, not requiring explicit reasons).  
    - **Summary**: Robust across cases and distinctions; best on empirical fit.  

  - **Consequentialist (Outcomes)**:  
    - Cases: 1✗ (good outcome may grant worth), 2△ (expected outcomes matter, but harm may override), 3△ (net good could assign worth), 4✗ (retroactive justification irrelevant if outcome unchanged).  
    - Distinctions: 5✗ (often conflates worth with praiseworthiness), 6✗ (derivative value dominates), 7△ (available reasons matter for expected utility; actual reasons irrelevant).  
    - Empirical: 8✓ (doesn’t require explicit reasons).  
    - **Summary**: Struggles with non-outcome elements; collapses key distinctions.  

  ---

  Verdict: The deepest tension arises between the refactoring scenario's demand for action-time actual reasons and the empirical reality of post hoc rationalization, which threatens to collapse the distinction between actual and available reasons by forcing reliance on reconstructible justifications.
