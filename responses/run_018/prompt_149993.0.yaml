  ### Essay Prompt: The Contractual Turn in Welfare Fraud  
  **(45 minutes, ~800 words)**  

  **Background:** Contemporary welfare states increasingly frame benefit fraud not as *theft* (illegal appropriation of public funds) but as a *breach of social contract*—a failure to uphold reciprocal obligations tied to conditional benefits (e.g., job-seeking requirements). This reframes the recipient as a "contractor" bound by duties, not just a citizen claiming social rights.  

  **Prompt:** Analyse whether this "contractual" reframing:  
  1. **Transforms the moral status** of welfare recipients from *citizens* (with inherent dignity and social rights) to *contractors* (whose entitlements hinge on performance),  
  2. **Enables harsher sanctions** (e.g., long-term benefit bans, mandatory work programs) without explicitly invoking the "undeserving poor" narrative, and  
  3. **Genuinely replaces dignity-based assumptions** with reciprocity, or merely conceals old moral judgments ("deserving/undeserving") behind contractual language.  

  **Tasks:**  
  - Map the social contract analogy precisely: What constitutes the "promise" breached? Who are the "parties"?  
  - Identify where the analogy *collapses* (e.g., unequal power, lack of consent, or irrelevance of social rights).  
  - Argue conclusively: Does conditionality *eliminate* or *repackage* the deserving/undeserving distinction?  

  ---

  ### Model Answer (600 words)  

  The reframing of welfare fraud as a "breach of social contract" superficially elevates reciprocity over moral desert. By treating benefits as conditional on claimant duties (e.g., job-seeking), the state positions recipients as contractors who *earn* entitlements through compliance. Fraud becomes a broken promise—not theft—implying sanctions are penalties for non-performance, not punishment for moral failing. This avoids explicit "undeserving poor" rhetoric, as the contractor’s failure is technical (breach of terms) not moral (innate worthlessness).  

  **Transformation of Moral Status:**  
  The contractual model shifts recipients from *citizens* holding rights by virtue of membership to *contractors* whose status depends on fulfilling duties. Where citizenship invokes inherent dignity (grounded in social rights), the contractor’s value is transactional: benefits are "payment" for compliance. Sanctions like benefit suspensions thus appear as enforcement of agreed terms, not denial of basic rights. This lets the state impose harsher penalties (e.g., 3-year bans) while claiming neutrality: the recipient "chose" the contract’s terms.  

  **Enabling Harsher Sanctions:**  
  This framing justifies severity without moral language. Theft implies criminality, inviting proportionality scrutiny. Contractual breach, however, permits "liquidated damages" (e.g., benefit withdrawal) framed as corrective, not punitive. By avoiding "undeserving" labels, the state sidesteps debates about structural barriers to compliance (e.g., job scarcity). Sanctions target "non-performance," masking how they disproportionately harm vulnerable groups (e.g., those with mental health issues), effectively recreating "undeserving" categories through behavior-based exclusion.  

  **Collapse of the Analogy:**  
  The contract analogy fails critically:  
  1. **Consent/Equality:** Contracts require voluntary agreement and equal bargaining power. Welfare "contracts" are non-negotiable; recipients lack alternatives.  
  2. **Social Rights:** Citizenship entails unconditional rights to subsistence. Contractualism reduces these to contingent privileges, ignoring that needs persist post-"breach."  
  3. **Structural Inequity:** Fraud detection targets administrative errors or marginalized claimants unable to navigate complex rules, conflating incapacity with dishonesty.  

  **Repackaging, Not Replacing:**  
  The contractual frame does not eliminate the deserving/undeserving binary—it rebrands it. "Compliant" contractors become *deserving*; "non-compliant" ones are *undeserving* but relabeled "breachers." Reciprocity talk ("something for something") smuggles in moral judgment: those who breach are "free riders" lacking civic virtue. Conditionality’s harshest sanctions (e.g., total exclusion) reveal the enduring assumption that some forfeit social membership. Dignity is not replaced but subordinated to performance, rendering human worth conditional.  

  **Conclusion:**  
  Contractualism is a strategic reframing that conceals moral disenfranchisement. By treating fraud as breach, the state technicizes exclusion, justifying severity while evading scrutiny of its normative foundations. Yet, by collapsing under scrutiny of consent and rights, it exposes reciprocity as a veneer for repackaged desert—where the "undeserving poor" become the "non-compliant contractor."  

  ---

  ### Marking Scheme  
  **A-Grade (Distinction: 70%+)**  
  - **Precise Mapping:** Explicitly contrasts "contractual breach" (broken promise between parties) vs. "theft" (crime against collective). Identifies the "contract" as state-imposed duties for benefits.  
  - **Core Insight:** Demonstrates how contractual language avoids *explicit* "undeserving" rhetoric but recreates it *implicitly* via compliance demands.  
  - **Collapse Analysis:** Highlights 2+ irreconcilable flaws (e.g., lack of consent, irrelevance of social rights, or sanctions violating dignity despite reciprocity claims).  
  - **Thesis Clarity:** Argues persuasively that conditionality *repackages* desert (e.g., "compliant=deserving, non-compliant=undeserving") using reciprocity to mask moralism.  
  - **Nuance:** Notes how harsher sanctions function as "moral disenfranchisement" while claiming neutrality.  

  **B-Grade (Merit: 60-69%)**  
  - **Partial Mapping:** Distinguishes breach from theft but undersells social rights or power asymmetry.  
  - **Limited Insight:** Sees contractualism as avoiding "undeserving" labels but misses how it reinstates them behaviorally.  
  - **Superficial Collapse:** Identifies 1 analogy flaw (e.g., no negotiation) without linking to moral status.  
  - **Weaker Thesis:** Claims conditionality "reduces stigma" without proving desert is repackaged, or conflates elimination with concealment.  
  - **Omissions:** Ignores sanctions’ disproportionate impact or treats fraud as homogenous.  

  **C-Grade (Pass: 50-59%)**  
  Vague on contractual vs. theft frameworks; conflates fraud with administrative error; treats social rights as irrelevant; asserts "contractor" status without analysing moral transformation; fails to engage with reciprocity’s normative premises.  

  **D/F-Grade (Fail: <50%)**  
  Misrepresents prompt (e.g., debates "fraud rates" not moral status); conflates welfare with private contracts; unsubstantiated claims; ignores conditionality/fraud framing entirely.  

  ---

  **Key Penalties:**  
  - **-10%:** Conflating fraud (intentional deception) with administrative errors/clumsy compliance.  
  - **-15%:** Ignoring social rights (e.g., arguing "all welfare is conditional anyway").  
  - **-20%:** Treating "contractor" status as literal, not a state-constructed analogy.  
  - **-25%:** Missing the core paradox: Does contractualism *hide* or *solve* the deserving/undeserving problem?  

  This tests conceptual precision on reciprocity’s moral sleight-of-hand—exactly as requested. Let me know if you need further calibration.
