prompt: |-
  ok so i'm trying to map out what actually needs solving in the advance-directive literature, specificaly around whether the earlier self has authority over the later one when the change isn't total incompetence but more like a patchwork—some capacities intact, values shifted in weird ways. there's the standard autonomy-vs-welfare framing, there's the Ulysses-contract angle, and then there's this newer idea i've been playing with: treating the directive not as a single command but as a kind of 'constitutional amendment' that only binds certain domains (medical, financial) while leaving others open to renegotiation by the later self. but i don't know which open questions actually deserve the next few years of work if you're a philosopher with maybe one grad student and no clinical access.

  so: which three or four conceptual problems in this space are most upstream? i'm thinking about (1) whether partial value change undermines the moral authority of the prior directive or just its applicability, (2) how to model authority when the later self retains narrative coherence but rejects the earlier self's priorities, and (3) whether there's any meaningful distinction between 'authenticity of the moment' and 'authenticity over a lifespan' that doesn't just collapse into preference-utilitarianism. but maybe i'm missing the real crux.

  rank them for me—defend the ordering using criteriea like: does solving this unlock answers to the others, is it tractible without massive empirical datasets, and would the answer actually shift how clinicans or courts treat these cases? also tell me which ones are overated—like, maybe the Ulysses-contract literature is a dead end because it assumes a binary competent/incompetent divide that doesn't match progressive conditions. and please don't just list papers; i want an agenda, not a biblography. also there's probably a typo in my reasoning somewhere but i'll leave it to you to spot.
