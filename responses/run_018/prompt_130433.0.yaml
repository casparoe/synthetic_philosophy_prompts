answer: |-
  Based on your description, this is a distinct conceptual maneuver that deserves its own label. I propose the term **"Epistemic Camouflage"** (with variants: **"Taxonomic Cargo-Culting"** or **"Framework Parasitism"**). Here's the precise carving:

  ### Core Mechanism: Illegitimate Epistemic Transfer
  1.  **Source Domain:** Established cognitive science constructs (Kahneman/Tversky biases) with:
      *   Experimental validation (lab studies, reproducibility)
      *   Defined boundaries (specific predictable deviations from rationality)
      *   Epistemic authority (backed by decades of research).
  2.  **Target Domain:** A locally observed, self-help-relevant failure mode ("status-quo bias in career choice", "akrasia towards email").
  3.  **Transfer:** The *epistemic weight* and *conceptual legitimacy* of the Source Domain are illicitly grafted onto the Target Domain.
      *   Not just analogy ("this is *like* base-rate neglect"), but ontological equivalence ("this *is* a cognitive bias like base-rate neglect").
      *   Defense relies on surface similarity ("it involves System 1", "it feels irrational") while ignoring the lack of empirical grounding, predictive power, or defined scope for the Target.

  ### Key Boundaries & Distinctions
  *   **vs. Analogical Reasoning:** Analogy uses similarity for *illustration* or *hypothesis generation*. Epistemic Camouflage uses similarity for *credibility grafting*. It asserts equivalence ("this IS that category") rather than resemblance ("this reminds me of that").
  *   **vs. Wittgensteinian Family Resemblance:** Family resemblance accepts fuzzy boundaries *within a recognized category*. Epistemic Camouflage *smuggles a new item into a tightly defined category* by exploiting fuzziness at the edges. It doesn't argue for a broader, looser definition of "bias"; it asserts the new item belongs *under the existing definition*.
  *   **vs. Auxiliary-Hypothesis Tweaking:** Tweaking adjusts a core theory to accommodate new data *within its domain*. Camouflage *expands the domain* of the core theory to cover unrelated phenomena *without* adjusting the theory itself, just parasitizing its prestige. The core cognitive bias literature isn't being revised; its label is being misappropriated.
  *   **vs. Concept Creep:** Creep expands the *meaning* or *application* of a term (e.g., "trauma"). Camouflage expands the *membership* of a *formal category* without changing the category's definition. It's taxonomic inflation, not semantic drift.
  *   **vs. Plain Equivocation:** Equivocation uses the same word for different meanings. Camouflage insists the meaning *is the same* despite lacking the defining properties (evidence, reproducibility, specificity).

  ### Where "Epistemic Camouflage" Stops Being This Thing
  1.  **When Experimental Backing Appears:** If rigorous studies validate the local failure mode as a distinct, reproducible cognitive bias meeting the standards of the source domain, it transitions from camouflage to legitimate extension.
  2.  **When Scope is Explicitly Limited:** If the writer clearly states "This is *my informal heuristic* inspired by cognitive bias concepts, *not* an established psychological phenomenon," it avoids the camouflage. The authority isn't parasitized.
  3.  **When the Framework is Explicitly Redefined:** If the writer argues *on principled grounds* that the definition of "cognitive bias" *should be broadened* (e.g., to include context-dependent motivational failures) and defends this redefinition independently, it's theory-building, not camouflage. Camouflage assumes the existing framework's authority while violating its membership rules.
  4.  **When It's Truly Just an Analogy:** If the comparison is solely illustrative and no claim of categorical equivalence or borrowed epistemic weight is made ("Failing to update your career plans feels *a bit like* status quo bias, perhaps because...").

  ### Why This Pattern is Pervasive in Rationalist Spaces
  *   **Craving Rigor:** Desire to ground self-help in "science."
  *   **Conceptual Toolkit Hunger:** A bias framework provides a ready-made, prestigious language for dissection.
  *   **Signal of Sophistication:** Using "bias" labels signals membership in the cognitively savvy in-group.
  *   **Explanatory Seduction:** Kahneman-style biases offer clean, mechanistic stories. Local failure modes are messier. Camouflage imposes false cleanliness.

  **In essence:** Epistemic Camouflage is the act of dressing a self-help folk concept in the borrowed lab coat of experimental cognitive psychology, asserting categorical equivalence to gain unearned legitimacy, while oscillating between demanding the authority of the source domain and retreating to the vagueness of folk psychology when challenged. It exploits the gap between the rigor of the original research and the colloquial use of "bias" in rationalist discourse.
