  Hmm, this feels like a taxonomy problem. The key elements seem to be: informal concepts borrowing the epistemic weight of formal psychology, without the same evidence. The user wants clear boundaries—how this differs from analogy, family resemblance, or hypothesis tweaking.

  I recall terms like "ontological smuggling" or "legitimacy grafting," but nothing quite fits. Maybe I should focus on the epistemic transfer aspect. Terms like "heuristic overextension" come to mind, emphasizing the stretching of a framework beyond its support.

  The user is clearly well-versed in rationalist discourse. They're not just asking for a definition; they want conceptual tools to critique these moves. Their frustration suggests they've seen this pattern cause muddy thinking in their community.

  I should avoid academic jargon since they specified "no bibliography." The coining needs to be precise but accessible. Let me break down the components: 
  - Illegitimate epistemic transfer (borrowing authority) 
  - Formalization by association 
  - Taxonomic boundary violations 

  "Epistemic camouflage" captures the disguise aspect. "Taxonomic cargo-culting" highlights mimicking structure without substance. But "framework parasitism" might be most accurate—the local concept feeds off the host framework's credibility without contributing evidence.

  Boundaries are crucial. This isn't analogical reasoning because analogies don't claim formal equivalence. It's not family resemblance because that acknowledges fuzzy categories, whereas here there's a false claim of membership. Auxiliary tweaking adjusts theories; this is wholesale category conflation.

  The user's deeper need might be arming themselves against bad arguments. By naming this move, they can call it out when someone defends a pet concept by vaguely invoking "biases" while ignoring the lack of evidence. That's probably why they emphasize "where it stops being this thing"—they want to know when the comparison becomes invalid.

