  **MUNICIPAL COMMISSION FOR RATIONAL RECONSTRUCTION**
  **DECISION MEMORANDUM: MC/DR/AX/1947-08**

  **TO:** City Reconstruction Authority, Planning Directorate  
  **FROM:** Chair, Municipal Commission for Rational Reconstruction  
  **DATE:** 17 October 1947  
  **SUBJECT:** Ruling on Proposed Axiological Partition Protocol (APP) for Rekonstruktionsgebiet Osthafen  

  **1. RECOMMENDATION & ACTIONABLE CONDITIONS**  
  The Commission has reviewed the Axiological Partition Protocol (APP) for application in the redesign of the Osthafen industrial quarter. **The Commission REJECTS the APP in its current form.**  

  However, recognizing the underlying concern regarding the clarity of decision-making inputs, the Commission **conditionally approves a modified approach**, subject to the following binding requirements for any future reconstruction plan submitted for this quarter:  

  *   **Integrated Value Assessment:** All proposals must include a dedicated section explicitly documenting community-expressed values, preferences, and non-instrumental concerns (e.g., belonging, aesthetic continuity, social dignity) gathered through structured public consultation. This section must be presented alongside, and with equal prominence to, the empirical data analysis.  
  *   **Metric Transparency & Justification:** The selection of all empirical metrics (e.g., traffic flow, sanitation load, density, commute duration) used to generate the "factual branch" of any plan must be accompanied by a formal justification statement. This statement must clearly articulate:  
      *   The specific reconstruction goals each metric is intended to measure.  
      *   The rationale for prioritizing these specific measurable outcomes over other potential measurable outcomes (e.g., why economic efficiency metrics were chosen over pedestrian proximity metrics, or vice-versa).  
  *   **Value Integration Rationale:** The final plan must contain a concluding section explaining how the documented community values and preferences influenced the weighting of empirical metrics, the selection between empirically equivalent options, or the acceptance of empirically suboptimal outcomes where values were deemed paramount. This rationale must be specific and traceable.  

  Plans failing to meet these conditions will be deemed incomplete and returned without substantive review.

  **2. TREATMENT OF OPPOSITION'S STRONGEST ARGUMENT**  
  The Commission acknowledges the forceful argument presented against the APP, primarily by local architects and community representatives. Their central contention is that the strict Carnapian division between cognitive (empirically verifiable) and non-cognitive (value-based) statements, as implemented by the APP, is itself a normative choice with significant consequences. They argue that the selection of *which* empirical metrics are deemed "factual" and worthy of measurement inherently reflects unstated value judgments about what constitutes important or legitimate aspects of urban life. For instance, prioritizing metrics quantifying economic output or vehicular efficiency over metrics quantifying social interaction spaces or pedestrian accessibility inherently values one conception of urban success over another.  

  **The Commission finds substantial merit in this critique.** The act of defining the scope of "fact" for planning purposes – deciding what gets measured and optimized – cannot be entirely divorced from underlying conceptions of what makes a city function well or what constitutes a good life for its inhabitants. These conceptions are value-laden. Therefore, the APP's claim to create a purely neutral, value-free empirical domain through partition is overstated. The selection of metrics is a value-sensitive act that the APP framework fails to adequately acknowledge or mitigate, effectively embedding specific normative priorities while dismissing others expressed by the community as "non-cognitive" and therefore lacking justificatory force.

  **3. DISCUSSION OF CARNAP'S PROPOSED SOLUTION**  
  The Commission has considered the counter-argument, derived from the philosophical framework underpinning the APP, that rational value discussion can be preserved within the partition model. This view suggests that conflicting community preferences can be reconciled by translating them into empirical predictions about which outcomes would lead to the greatest measurable human satisfaction (e.g., surveys predicting resident contentment under different scenarios).  

  **The Commission concludes this approach cannot salvage the APP without effectively collapsing the very distinction it seeks to enforce.** While predicting satisfaction levels *is* an empirical exercise, the act of selecting *satisfaction* as the ultimate empirical arbiter of value disputes is itself a profound value commitment. It presupposes that aggregate subjective contentment is the sole or primary legitimate goal of urban planning, potentially marginalizing other values like justice, dignity, historical continuity, or democratic participation, which communities might express but which may not correlate directly or solely with measurable satisfaction. Further, attempting to *reduce* complex values like "belonging" or "aesthetic continuity" solely to future satisfaction predictions strips them of their intrinsic meaning and the reasons communities hold them. Therefore, relying on satisfaction predictions as the sole bridge between the "value branch" and the "factual branch" does not preserve the partition; it smuggles a specific, contestable value (aggregate satisfaction) into the cognitive domain as the master metric, undermining the protocol's foundational claim of strict separation.

  **4. PRACTICAL ADJUDICATION OF CONTRADICTORY VALUE PREFERENCES**  
  The Commission anticipates scenarios where structured consultation reveals two (or more) community groups holding strong, contradictory value preferences (e.g., Group A prioritizes preserving traditional street patterns for continuity; Group B prioritizes radical modernization for perceived progress), and where both preferences predict essentially equal levels of aggregate satisfaction based on available empirical models.  

  **In such cases, the Commission will not default to either preference based solely on the value branch documentation.** Instead, adjudication will proceed as follows:  
  1.  **Scrutiny of Metric Selection:** Re-examine the empirical metrics used. Does the selection inherently favor one set of values over the other (e.g., are metrics biased towards efficiency over character)? Adjustments may be required.  
  2.  **Exploration of Alternatives:** Require planners to investigate whether design alternatives exist that could better accommodate elements of both conflicting values, even if partially.  
  3.  **Priority Weighting Based on Reconstruction Goals:** The Commission will make a determinative judgment based on the *explicitly stated and justified overarching goals* for the Osthafen quarter, as established by the City Reconstruction Authority and informed by city-wide policy and the documented values of the *broader* citizenry. This prioritization will be clearly stated in the rationale section (as required in Condition 3 above).  
  4.  **Democratic Mandate:** Where values are irreconcilable and equally valid within the planning framework, the Commission may recommend that the final decision rests with the elected City Council, based on the fully documented value conflict and empirical analysis presented. The Commission's role is to ensure this choice is informed and transparent, not to avoid political judgment on fundamental value conflicts.  

  **CONCLUSION**  
  The Axiological Partition Protocol, while aiming for clarity, imposes an artificial and unsustainable division that risks obscuring the value judgments inherent in metric selection and disenfranchising legitimate community voices by denying their justificatory role. The Commission rejects the APP but mandates a revised approach ensuring explicit documentation of values alongside empirical data, full transparency regarding the value-laden nature of metric selection, and a clear rationale for how values ultimately influence the plan. This approach acknowledges the complexity of reconstruction, honors community input as integral to justification, and demands rigorous accountability for the normative choices embedded within technical planning.

  **SIGNED,**  
  **[Chair's Name]**  
  Chair, Municipal Commission for Rational Reconstruction
