  To construct the rule framework, I consider four potential principles: topological continuity (stroke connection), relational anatomy (bowl+tail), cultural recognition (alphabet membership), and orientation invariance. The graffiti "a" validates relational anatomy as primary, while rotation case proves orientation is fixed. Negative space acceptance shows modality indifference. 

