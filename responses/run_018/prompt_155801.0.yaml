  The discrimination test I'd propose - a mirrored "a" with preserved orientation - would pit relational anatomy against cultural recognition. If accepted, it confirms feature abstraction dominates; if rejected, it proves alphabet conventions constrain even when features match. This isolates the core tension in their friend's logic.

