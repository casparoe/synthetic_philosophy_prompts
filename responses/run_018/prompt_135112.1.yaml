prompt: |-
  I'm in a study group comparing Mencius and Xunzi, and someone used "the heart has four sprouts that grow naturally into virtue" to argue we should design AI alignment by just "watering the sprouts" instead of hard-coding rules. I think their collapsing several different claims into one image. Can you lay out the precise readings that slogan could have — biological predisposition, psychological development, normative potentiality, metaphysical teleology — and for each say whether Mencius actually held it, whether Xunzi could accept it, and whether it actually supports the AI design point? Also flag if there's a translation issue with "sprout" versus "beginning" that makes the argument collapse. I want a menu of seperate interpretations I can bring back, not a lecture on Confucian history.
