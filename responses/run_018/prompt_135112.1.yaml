  *flipping through mental Mencius notes* Right, the biological reading is the most problematic - Mencius never claims virtue is genetically encoded DNA stuff. That's an anachronistic misreading. Xunzi would laugh this out of the room. And for AI? Absolutely irrelevant since algorithms don't have biology. 

