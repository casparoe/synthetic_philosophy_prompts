answer: |-
  Here are the desiderata for a theory of climate obligation that rigorously engages the moral ontologies underpinning carbon pricing, direct regulation, and degrowth, treating them as fundamentally distinct ethical frameworks rather than mere policy tools.

  **Core Desiderata for the Theory:**
  1.  **Explicit Moral Ontology:** Must articulate the fundamental nature of climate harm (fungible commodity, absolute boundary violation, inherent symptom of a destructive system) and the corresponding conception of obligation (compensation, prohibition, systemic transformation).
  2.  **Non-Collapsibility of Frameworks:** Must preserve the distinct logics of each approach, resisting facile synthesis that obscures their core ethical disagreements.
  3.  **Handling Value Pluralism & Conflict:** Must acknowledge that different values (efficiency, justice, sustainability, autonomy, sufficiency) are often incommensurable and generate genuine ethical dilemmas.
  4.  **Context Sensitivity:** Must recognize that the "right" approach might differ based on the *type* of activity, actor, historical responsibility, and socio-ecological context, without resorting to moral relativism.
  5.  **Constrained by Empirical Reality:** Must be compatible with established scientific understanding of climate change and socio-economic dynamics.

  **Critical Test Cases (Why They Test, Not Just Illustrate):**
  1.  **The Marginal Factory:**
      *   *Case:* A moderately profitable factory emits above a safe threshold. Can it pay a high carbon price/offset, or must it be shut down via regulation?
      *   *Why a Test:* Directly probes the fungibility of harm. Pricing says "yes, if cost internalized"; Regulation says "no, boundary violation"; Degrowth says "irrelevant if the activity is part of the growth paradigm causing systemic harm." Tests the theory's commitment to its ontology when faced with economic disruption.
  2.  **The Community Dilemma:**
      *   *Case:* A community faces climate impacts. Does the primary obligation involve building protective green infrastructure (implying continued resource use) or contracting consumption/decentralizing to reduce vulnerability and overall demand?
      *   *Why a Test:* Challenges the understanding of adaptation vs. mitigation and the locus of obligation. Pricing might focus on efficient infrastructure investment; Regulation might mandate specific resilience standards; Degrowth focuses on reducing dependence on vulnerable, high-throughput systems. Tests how the theory defines "need," "resilience," and "development."
  3.  **The Reparative Obligation:**
      *   *Case:* What does a historically high-emitting rich nation owe? Precise financial compensation calculated based on past emissions (to fund mitigation/adaptation elsewhere), or a fundamental restructuring of its own economy and global relationships?
      *   *Why a Test:* Explores the nature of historical responsibility and the commensurability of harm. Pricing leans towards quantifiable compensation; Regulation might focus on strict domestic cuts; Degrowth demands dismantling the extractive systems built on historical emissions. Tests the theory's stance on historical injustice, compensation vs. transformation, and the possibility of quantifying "debt."

  **Indispensable Distinctions (Cannot Be Collapsed):**
  1.  **Efficiency vs. Justice:**
      *   *Consideration:* Achieving aggregate emissions reductions at lowest cost (efficiency) often conflicts with ensuring the burdens and benefits are distributed fairly, especially regarding vulnerability and historical responsibility (justice). A theory must confront this tension, not assume one subsumes the other.
  2.  **Aggregate Reduction vs. Distributive Burden:**
      *   *Consideration:* *How much* reduction is achieved globally is a separate (though related) question from *who bears the cost* of achieving it (e.g., wealthy vs. poor nations, current vs. future generations, industry vs. consumers). A theory must address both dimensions distinctly.
  3.  **Intergenerational vs. Intragenerational Equity:**
      *   *Consideration:* Obligations to future generations (preventing catastrophic harm) can conflict with obligations to alleviate poverty and injustice *within* the current generation (e.g., rapid fossil fuel phase-out impacts). A theory must navigate this temporal justice dilemma.
  4.  **Mitigation vs. Adaptation:**
      *   *Consideration:* While linked, preventing future harm (mitigation) and coping with unavoidable harm (adaptation) raise distinct ethical questions about responsibility, resource allocation, and the acceptability of "managed" loss.
  5.  **Harm Commensurability vs. Incommensurability:**
      *   *Consideration:* Can climate harms (species loss, displacement, death) be meaningfully valued in monetary terms and offset, or are they absolute losses that pricing merely obscures? This is the core ontological divide.

  **Non-Negotiable Empirical Constraints (Cannot Contradict):**
  1.  **Non-Market Externalities:** Climate change causes vast, non-monetizable harms (ecosystem collapse, cultural loss, trauma, existential risk) that market pricing inherently struggles to capture fully.
  2.  **Path Dependence & Lock-In:** Existing infrastructure, institutions, and power structures heavily constrain feasible transitions; theories ignoring this risk irrelevance or unintended consequences.
  3.  **Diminishing Marginal Utility of Wealth:** The ethical weight of imposing costs varies drastically based on the existing wealth of those bearing the cost. $1000 means less to a billionaire than to someone in poverty.
  4.  **Degrowth Redistribution Imperative:** Reducing aggregate material/energy throughput without explicit, radical redistribution of wealth, power, and access to resources will inevitably worsen inequality and replicate colonial patterns of exploitation ("austerity for the poor, luxury for the rich").
  5.  **Irreversibility & Tipping Points:** Some climate impacts are irreversible or trigger cascading, uncontrollable changes (tipping points), elevating the moral stakes of delay and under-action.

  **Negotiable vs. Non-Negotiable Desiderata:**
  *   **Non-Negotiable:** Handling value pluralism/conflict (Des. 3), Context Sensitivity (Des. 4), Constrained by Empirical Reality (Des. 5), Preserving core distinctions (Efficiency/Justice, Agg. Reduction/Dist. Burden, Inter/Intragenerational Equity, Commensurability), Adherence to empirical constraints 1-5.
  *   **Potentially Liberal-Economics-in-Disguise:** An *overriding* focus on aggregate efficiency as the *primary* moral goal; Treating all values as fundamentally commensurable via pricing; Assuming growth is always possible and necessary for justice ("green growth" as the *only* solution); Viewing compensation as always sufficient for rectifying harm.

  **The Crucial Joint Unsatisfiability Problem:**
  *   **The Tension:** Holding that **carbon harm is fundamentally incommensurable with money** (core to the regulation and degrowth ontologies) **AND** that **rich countries owe precise, quantifiable compensation for past emissions** creates a profound, likely irresolvable, conflict.
  *   **Why:** If the harm (e.g., lives lost, cultures destroyed, ecosystems irreparably damaged *by past emissions*) is truly incommensurable, then no amount of money can *compensate* for it in a morally adequate way. Precise quantification implies commensurability – you can calculate an equivalent monetary value. Demanding precise compensation implicitly accepts the fungibility of harm that the incommensurability stance rejects.
  *   **Resolution Attempts & Problems:**
      *   *Call it "Reparations" not "Compensation":* This acknowledges the debt is unpayable but still owed, often demanding structural change. However, the demand for *precise quantification* (e.g., $X trillion) still smuggles in commensurability.
      *   *Focus on Obligation, Not Equivalence:* The theory could demand rich nations undertake massive, costly transformative actions *because* of their debt, without claiming the cost precisely equals the harm. But this abandons the "precise, quantifiable" aspect.
  *   **Conclusion:** A theory **cannot simultaneously hold both propositions strictly.** It must either:
      1.  **Modify the Incommensurability Claim:** Allow that *some* aspects of harm (e.g., funding adaptation) *can* be quantified for practical purposes, while maintaining that core harms are irreparable (a messy compromise).
      2.  **Abandon Precise Quantification:** Frame the obligation as massive, non-negotiable, transformative action proportional to historical responsibility, rejecting precise monetary calculation as impossible or morally inadequate.
      3.  **Reject Incommensurability:** Embrace the pricing ontology fully, accepting that money *is* the metric for rectification (which undermines the regulation/degrowth critique).

  **Brief Scoring Against Criteria (Illustrative, Not Exhaustive):**

  1.  **Market Pricing:**
      *   *Strengths:* Excels on efficiency, aggregate reduction mechanisms, precise (fungible) compensation. Matches commensurability ontology.
      *   *Weaknesses:* Fails on non-market externalities (Constraint 1), often collapses justice into efficiency, struggles with irreversibility/tipping points (Constraint 5), poor on degrowth redistribution (Constraint 4). Fails the Factory Shutdown test if harm is incommensurable. Struggles with the Reparative Obligation test (quantifies but misses transformation).
  2.  **Direct Regulation (Green New Deal Style):**
      *   *Strengths:* Addresses non-market harms (Constraint 1), sets hard boundaries (Factory test), can integrate justice/redistribution goals, focuses on tangible transformation (Infrastructure/Reparation tests), acknowledges incommensurability.
      *   *Weaknesses:* Can be inefficient/rigid, struggles with precise quantification of historical debt (Unsatisfiability), may not sufficiently challenge the growth paradigm (Degrowth critique), path dependency (Constraint 2) can limit ambition.
  3.  **Degrowth / Post-Growth:**
      *   *Strengths:* Directly tackles the root cause (growth paradigm), essential for meeting ecological limits long-term, centers sufficiency and redistribution (Constraint 4), rejects commensurability, demands structural transformation (Reparation/Community tests).
      *   *Weaknesses:* Politically challenging due to path dependency/lock-in (Constraint 2), lacks detailed governance blueprints, potential short-term disruption conflicting with intragenerational equity, struggles with precise compensation (Unsatisfiability), requires massive cultural/political shift.

  This framework provides the rigorous, ontologically grounded criteria needed to move beyond superficial policy debates and engage the deep ethical fissures shaping the climate crisis. The identified joint unsatisfiability problem is particularly crucial for forcing clarity on the fundamental nature of harm and obligation.
