answer: |-
  You've identified a fascinating and nuanced dialectical pattern in the philosophy of dreams. While there isn't a single established, universally recognised term *specifically* for this manoeuvre, we can analyse it and propose a fitting designation.

  ### Analysis of the Manoeuvre
  1.  **Core Mechanism:** Both sides strategically toggle between interpreting dream phenomena as either:
      *   **Occurrent Experience (OE):** A real-time, phenomenal state during sleep.
      *   **Representational Trace (RT):** A memory structure formed *during* or *upon* waking, lacking phenomenal character at its formation.
  2.  **Asymmetrical Application:**
      *   **The Sceptic (Anti-OE):** Invokes **RT** to *deny* phenomenal experience during sleep ("just traces!"). But then implicitly relies on **RT** *carrying phenomenal content* to explain vivid reports, without conceding OE occurred to *generate* that content.
      *   **The Defender (Pro-OE):** Invokes **OE** to explain vivid reports ("proof of experience!"). But retreats to **RT** *lacking veridicality constraints* when faced with impossible/confabulated content, shielding OE from needing to be coherent or accurate.
  3.  **Key Feature:** The *same conceptual distinction* (OE vs. RT) is deployed, but the *burden of proof* and *explanatory weight* assigned to each pole shifts depending on the challenge faced. The distinction itself remains stable, but *which aspect is emphasised* and *what it's required to explain* changes opportunistically.

  ### Why Existing Terms Don't Quite Fit
  *   **Motte-and-Bailey:** As you note, it's not a core/outgrowth structure. Both positions (OE and RT interpretations) are actively used *defensively*.
  *   **Equivocation:** The terms don't change meaning; the sceptic consistently defines RT as non-phenomenal, the defender defines OE as phenomenal. The shift is in *application*.
  *   **Ad Hoc Hypothesis:** While each tactical retreat *looks* ad hoc, it's not introducing a *new* concept; it's selectively emphasising one pole of an *already accepted* distinction to deflect a specific objection.
  *   **Dialectical Inconsistency/Question-Begging:** This is broader. The manoeuvre *is* inconsistent in its *demands* on the distinction, but it's a specific *form* of inconsistency leveraging a dual-purpose distinction.

  ### Proposed Term: The Phenomenal Shell Game

  *   **Definition:** A dialectical strategy in the philosophy of consciousness (particularly regarding dreams) where the distinction between **occurrent phenomenal experience** and **merely representational memory traces** is used asymmetrically. Each pole of the distinction is strategically emphasised to deflect counterarguments while the other pole is downplayed, effectively shifting the burden of proof and avoiding direct engagement with the problematic implications of consistently applying either interpretation across all dream phenomena. The "pea" (the explanation for phenomenal character) is hidden under one shell (OE or RT) whenever the other shell is challenged.
  *   **Boundary Cases & Distinctions:**
      *   **Vs. Ordinary Auxiliary Hypothesis Adjustment:** Auxiliary hypotheses *supplement* a core theory to handle anomalies. The Phenomenal Shell Game doesn't add new hypotheses; it *toggles* the emphasis between two *core, pre-existing, and interdependent* interpretations of the *same* phenomena (the dream report and its origin). It exploits the ambiguity inherent in *how* a memory trace relates to a prior (or absent) experience.
      *   **Vs. Genuine Theoretical Development:** If a philosopher consistently argued that RTs *can* carry rich, quasi-phenomenal content *without* OE, or that OE *is* inherently non-veridical and fragmentary, that would be a coherent position. The Shell Game involves *inconsistent application* of the distinction *within a single argumentative stance* for defensive purposes.
      *   **When is it *not* the Shell Game?** When a philosopher:
          *   Consistently applies one interpretation (OE or RT) to *all* dream phenomena and bites the bullet on the consequences.
          *   Develops a positive, integrated theory explicitly explaining the relationship between OE and RT that doesn't require context-dependent switching to handle objections.
          *   Acknowledges the tension and explicitly argues why different aspects require different emphasis (without simply deflecting counterarguments).
  *   **Scope Beyond Dreams:**
      *   **Philosophy of Mind/Perception:** Debates about perception (e.g., disjunctivism vs. representationalism) can involve similar toggling. For instance, when pressed on hallucinations, a direct realist might emphasise the *judgement* or *belief* formed *after* the non-veridical *appearance*, downplaying the phenomenal similarity to veridical perception. Conversely, a representationalist facing criticism about the "veil of perception" might emphasise the direct causal link in veridical cases, downplaying the representational intermediary. The "appearance vs. judgement" or "direct awareness vs. representation" distinction can be played as a shell game.
      *   **Memory:** Debates about the "feeling of pastness" or episodic memory could involve toggling between a direct reliving (OE-like) and a reconstructive inference (RT-like).
      *   **Imagination:** Similar questions arise about the phenomenology of imagining – is it a faint OE or just a dispositional RT?

  ### Conclusion
  The **Phenomenal Shell Game** aptly captures the strategic, context-dependent switching you've observed. It exploits the inherent difficulty in empirically verifying the relationship between subjective reports, memory traces, and any putative conscious state occurring during sleep. While particularly salient in the dream debate due to the near-total isolation of the dreaming brain, the underlying structure – strategically toggling between a "live experience" interpretation and a "mere representation" interpretation of mental content to avoid counterarguments – is a recognisable dialectical pattern within the philosophy of mind and consciousness, wherever the link between report, representation, and phenomenology is contested. It's a specific form of burden-shifting inconsistency *within* a stable conceptual framework.
