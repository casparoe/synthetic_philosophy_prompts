prompt: |-
  me and my friend were arguing for like three hours about whether anyone actually deserves punishment in the deep metaphyiscal sense. he kept bringing up caruso's point that free will skepticism kills retributivism, and i countered with dennett's idea that we can still hold people responsible even if determinism is true because moral competance is a real skill. but then he said something weird about how desert might be diachronc — like, maybe you don't deserve blame at the exact moment of the act but you accumulate it through repeated choices, or lose it if your brain gets rewired. i don't fully buy it but i want to hear the best version.

  please argue that dennett is basically right that just deserts survive free will skepticism, but do it through this specific lens: treat moral responsability not as a static property you either have or don't, but as a kind of calibrated trust that societies maintain toward agents who demonstrate stable normative competance over time. in other words, argue that caruso's quarantine model misses the point because desert isn't about paying back a metaphyiscal debt — it's about maintaining the integrity of a shared normative practice that requires recognizing gradations of agency. and specifically, address the diachronc twist my friend mentioned: if an agent's capacities genuinely change (through addiction, brain injury, or long-term rehabilitation), then what they deserve shifts accordingly, not because desert is arbitrary, but because it's tied to their current role in the normative system. make sure the answer is in american english, and don't just list philosophers — actually build the argument. and please no bibliography, i just want the reasoning.
