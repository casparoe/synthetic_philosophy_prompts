  For the diachronic part, I'll use gradual capacity changes. Take addiction: early use involves competence (thus desert), but chronic addiction rewires the brain, eroding that competence. Desert fades because the agent can't reliably participate in the normative system anymore. Same for rehabilitation - regained competence restores desert/trust.

