answer: |-
  Here's the argument, building on Dennett's core insight while incorporating your friend's diachronic twist and reframing desert as calibrated trust within a normative system:

  1.  **Dismantling the "Cosmic Debt" Model:** Your friend (and Caruso) is right about one thing: if we imagine "desert" as a *metaphysical debt* incurred by a contra-causal free act against the universe's moral ledger, then free will skepticism *does* kill retributivism. Determinism means no agent authored their actions in that god-like, ultimate-responsibility way. There's no cosmic creditor demanding payment in suffering. This model of desert *is* incoherent without libertarian free will.

  2.  **Responsibility as Social Competence (Dennett's Core):** Where Caruso goes wrong is thinking desert *must* be that cosmic debt. Dennett offers the alternative: moral responsibility is about *practical competence within a community*. It's the capacity to understand reasons, norms, expectations, and consequences, and to regulate behavior accordingly. This is a *real skill* (or set of skills) that humans develop to varying degrees. It's not magic; it's complex cognitive and social functioning honed by evolution and culture.

  3.  **"Desert" as Calibrated Trust in a Normative Practice:** Now, let's reframe "desert" not as a debt, but as the *calibrated level of trust and expectation* a community invests in an agent based on their demonstrated competence. Think of it like trust in a driver:
      *   You trust a licensed driver with a good record (high competence) to navigate traffic responsibly.
      *   You *don't* trust a toddler behind the wheel (no competence).
      *   Blame/praise, and yes, *consequences* like punishment, are the mechanisms by which the community *maintains the integrity* of this shared normative "driving practice." We hold the competent driver responsible for running a red light not to make them "pay," but to *reinforce the rules of the road*, signal the seriousness of the norm, incentivize future compliance, and potentially recalibrate our trust in *that specific driver*.

  4.  **Why Caruso's Quarantine Model Isn't Enough:** Caruso says we should only "quarantine" dangerous people like we quarantine disease, focusing solely on prevention without "blame." This misses the point entirely. Normative practices (like law, morality, promises, contracts) *depend* on participants recognizing each other as competent agents *within* the practice. Quarantine treats people like objects or forces of nature. Holding someone responsible (blaming, punishing *appropriately*) treats them as an *agent* who *should have known better* and *can* (in most cases) adjust future behavior. It *sustains the practice itself* by affirming the norms and the agency of those bound by them. Ignoring competence levels (treating everyone like a toddler or a typhoon) collapses the practice.

  5.  **Embracing the Diachronic Twist (The Shifting Sands of Competence):** This is where your friend's insight fits perfectly. Moral competence isn't static. It's a *diachronically stable (or unstable) capacity*.
      *   **Accumulation?** It's not that "desert" magically accumulates with each bad act like points. Instead, *repeated* harmful choices, *especially* when they show awareness and disregard for norms, *demonstrate* a *persistent pattern* of unreliability or defiance. This *justifies lowering the community's trust* in that agent's competence and warrants stronger recalibration (more serious consequences) to protect the normative practice and incentivize change. It's evidence of *current* incompetence (or malice) within the practice.
      *   **Loss Due to Changed Capacity (Addiction, Injury):** This is crucial. If someone suffers a traumatic brain injury that destroys their capacity for impulse control or moral reasoning, their *competence* within the normative practice is fundamentally altered. The community *should* recalibrate its expectations and responses accordingly. Blaming them *as if* they were fully competent becomes nonsensical and cruel – it misreads their actual role in the normative system. Punishment aimed at "just deserts" in the old sense is unjust. Intervention shifts towards containment (closer to quarantine) *or* care and rehabilitation, focused on their *new* level of capacity and potential for recovery.
      *   **Rehabilitation and Regained Trust:** Conversely, genuine long-term rehabilitation demonstrates the *restoration* or *development* of normative competence. The individual shows sustained capacity to understand, adhere to, and contribute to the shared norms. The community *should* recalibrate its trust upwards. Continuing to treat them as a pariah or imposing harsh punishment *despite* demonstrated rehabilitation isn't "holding them to their debt"; it's *failing* to recognize their *current* competent role within the normative practice, undermining the practice's own goals of restoration and reintegration.

  6.  **Why This Survives Free Will Skepticism:** This entire framework operates *within* a deterministic world. We're talking about identifiable cognitive capacities (reasoning, empathy, impulse control, learning), patterns of behavior, and the social mechanics of maintaining cooperative systems. We hold people responsible *because they are generally competent participants* in these systems, not because they possess magical freedom. Desert, understood as the *appropriate calibration of trust and consequence based on current demonstrable competence*, is entirely coherent. Punishment (or reward) isn't about cosmic payback; it's about:
      *   **Norm Reinforcement:** Signaling the importance of shared rules.
      *   **Incentivization:** Encouraging future competence and compliance.
      *   **Protection:** Safeguarding the community and the practice from harm caused by incompetence or malice.
      *   **Recalibration:** Adjusting the community's expectations and responses to the agent's *actual, current* level of competence.
      *   **Potential Restoration:** Creating pathways back into full participation for those who regain competence.

  **Conclusion:** Dennett is right – moral competence is real and sufficient for responsibility. Caruso's quarantine model fails because it ignores that responsibility is *relational*, embedded in the ongoing practice of mutual recognition among (imperfectly, deterministically) competent agents. Your friend's diachronic insight strengthens this: "Desert" shifts because the *competence* that grounds our calibrated trust and justifies our responses *shifts*. It's not arbitrary; it's a continuous, evidence-based assessment of an agent's current capacity to participate meaningfully in the shared normative world. Punishment or blame, when justified, isn't about paying a debt to the past; it's about responsibly managing the ongoing relationship within the normative practice, based on who the agent *is* (in terms of their demonstrable capacities) *now*.
