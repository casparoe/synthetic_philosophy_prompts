answer: |-
  ### Final Examination Essay Question  

  **Rationality and the Sunk Cost Conundrum: Identity, Practice, and Diachronic Agency**  

  *"The standard economic model of rationality mandates that agents ignore sunk costs—unrecoverable past investments—and make decisions based solely on expected future utility. However, consider the following case: A fifteen-year collaborative physics project across six international laboratories has produced exclusively null results in its search for an ‘anomalous particle’. The principal investigators acknowledge no future breakthrough is probable. Yet they argue termination would dissolve the uniquely specialized epistemic community, shared methodological norms, and inter-laboratory trust cultivated through the project’s history. Abandoning it, they claim, would destroy something intrinsically valuable that the sunk costs themselves helped constitute: the collaborative practice and identity of the group.*  

  **Evaluate the rationality of continuing this project.** In your essay:  
  1. **Articulate** the standard forward-looking argument for ignoring sunk costs and explain its core normative principle.  
  2. **Analyze** how this case challenges that model by framing sunk costs as *constitutive investments*—generating present reasons (e.g., preserving the epistemic community) not reducible to future payoffs.  
  3. **Address** the objection that this justification collapses into psychological attachment (e.g., commitment bias) and propose a **principled criterion** to distinguish legitimate path-dependent rationality from fallacy.  
  4. **Evaluate** whether a coherent concept of *diachronic rationality* (where history non-instrumentally constrains present choices) can accommodate this case without abandoning the sunk cost critique’s core insight.  
  5. **Defend a clear position**: Is honoring sunk costs *always irrational*, particularly in this collaboration? Justify your view.  

  *(Approx. 800–1000 words; 90 minutes)*  

  ---

  ### Model Answer (600 words)  

  **(1) Standard Forward-Looking Rationality**  
  The sunk cost fallacy arises when past investments, being unrecoverable, influence present decisions despite having no causal bearing on future outcomes. Rational choice theory—grounded in expected utility maximization—demands agents consider only marginal future costs/benefits. Honoring sunk costs violates this by letting psychologically salient but economically irrelevant history distort resource allocation. For example, continuing a failing project because "we’ve invested too much to quit" misallocates present resources towards unpromising futures. The normative core is *instrumental efficiency*: agents as atomistic "time-slice" optimizers should ignore history to maximize prospective gains.  

  **(2) Constitutive Investments Challenge the Standard Model**  
  The physics collaboration case reveals a limitation: sunk costs here created *constitutive goods*—irreducible social and epistemic structures (trust, shared methodology, community identity)—that possess *present* value independent of future discoveries. Terminating the project destroys these goods, which exist only *because* of the historical investment. Unlike a wasted monetary expenditure, these goods are non-fungible: they cannot be recovered or redeployed elsewhere. Thus, continuing constitutes *preservation* of a rationally valuable practice, not pursuit of a future payoff. This challenges the atomistic agency assumption: the "agent" here is the diachronic community, not a time-slice individual.  

  **(3) Distinguishing Path-Dependence from Bias**  
  The objection that this is mere commitment bias (e.g., emotional attachment to past efforts) misses the structural distinction. **Principled Criterion**: *Constitutive investments generate rational preservation reasons only if:*  
  (a) The sunk cost created a *non-fungible capacity or practice* (e.g., rare expertise, trust networks);  
  (b) Its abandonment would *irreversibly dissolve* that capacity; and  
  (c) The capacity has *independent rational value* (e.g., enables future epistemic projects beyond the original goal).  
  In the science case, dissolving the community destroys a unique epistemic infrastructure valuable for *other* inquiries (criterion c). By contrast, persisting with a failing solo project due to "pride" lacks (c)—it serves no broader rational end.  

  **(4) Diachronic Rationality Without Instrumentalization**  
  A diachronic rationality model *can* accommodate this without rejecting sunk cost critique. Here, history constrains choice not instrumentally (to recover costs) but *constitutively*: the community’s identity and capacities *are* partly constituted by its past commitments. Ceasing the project isn’t inefficient resource allocation; it is self-disintegration of the rational agent (the collective). This reframes "irrationality": honoring sunk costs becomes fallacious only when history is mistaken as affecting *future* utility (e.g., "we’ll succeed because we’ve suffered"), not when preserving constitutive structures enabling agency itself.  

  **(5) Position: Sunk Costs Are Not Always Irrational**  
  Honoring sunk costs is *not* always irrational. In standard cases (e.g., finishing a bad movie due to ticket cost), it is fallacious: history affects no constitutive goods. In the collaboration, however, the costs created *enduring rational structures* whose preservation is intrinsically valuable. Abandoning it would not be efficient forward-looking choice but *destruction of collective agency*. Thus, rational agents must weigh constitutive preservation against opportunity costs—not ignore history entirely. The sunk cost critique remains valid but incomplete: it overlooks how investments shape the agent’s identity and capacities over time.  

  ---

  ### Marking Scheme (20 marks total)  

  #### **Part 1: Standard Model (3 marks)**  
  - **A (3)** : Clearly defines sunk cost fallacy *and* articulates normative principle (forward-looking efficiency/atomistic agency).  
  - **B (2)** : Defines fallacy but weakly explains norm (e.g., omits time-slice agency).  
  - *Common error*: Describes fallacy without explaining *why* ignoring sunk costs is normative.  

  #### **Part 2: Constitutive Investment Analysis (5 marks)**  
  - **A (4-5)** : Explains how sunk costs *constituted* epistemic community/trust *and* why their loss is non-instrumental (e.g., dissolution ≠ lost utility).  
  - **B (3)** : Identifies community loss but frames it instrumentally (e.g., "trust useful for future projects").  
  - *Common error*: Treats community as emotional attachment, not structural epistemic capacity.  

  #### **Part 3: Bias vs. Path-Dependence (5 marks)**  
  - **A (4-5)** : Proposes a specific, structural criterion (e.g., non-fungibility/irreversibility/independent value) *and* applies it to case.  
  - **B (3)** : Vague criterion (e.g., "case-by-case") or conflates with emotional bias.  
  - *Common error*: Only asserts "this isn’t bias" without offering a test.  

  #### **Part 4: Diachronic Rationality (4 marks)**  
  - **A (4)** : Defines diachronic agency (history shapes identity/capacities) *and* explains how constitutive preservation differs from instrumentalizing history.  
  - **B (2-3)** : Mentions "long-term agency" but collapses into forward-looking utility.  
  - *Common error*: Proposes diachronic view but cannot distinguish from sunk cost fallacy.  

  #### **Part 5: Position & Defense (3 marks)**  
  - **A (3)** : Takes clear stance ("not always irrational"), defends using case-specific criteria *and* general principle (e.g., constitutive agency).  
  - **B (2)** : Qualified stance ("sometimes rational") with weak/no reference to case/criteria.  
  - *Common error*: Defends position only via intuition, not prior analysis.  

  #### **A Grade (16–20)**  
  All A-level parts addressed. Exposes atomistic agency in Part 1; uses "dissolution of epistemic capacity" (not emotion) in Part 2; offers revisable structural criterion (e.g., non-fungibility) in Part 3; distinguishes constitutive from instrumental diachronic constraints in Part 4.  

  #### **B Grade (13–15)**  
  Adequate but shallow: Omits key conceptual moves (e.g., no atomistic agency critique; frames community loss instrumentally); weak criterion (e.g., "when costs are high"); conflates diachronic with future utility.  

  ---  
  *Exam design note: This tests higher-order analysis by forcing engagement with constitutive agency—a concept likely discussed in seminars but not in textbook sunk cost definitions. The marking scheme rewards recognizing how rational agency models embed metaphysical assumptions (e.g., time-slice vs. diachronic selves).*
