answer: |-
  You've pinpointed a crucial and subtle asymmetry in how Buddhist ethical discourse *often operates in practice*, especially around "skillful means" (upaya) and the role of the teacher. This goes beyond simple "intention matters" or standard consequentialism/deontology debates. While there isn't one universally agreed-upon term for this *specific mechanism*, we can absolutely define it sharply and coin a term that captures its essence.

  **The Core Mechanism You've Observed:**

  1.  **Pure Intention as Moral Solvent:** If the actor's mind is perceived as *truly* pure (motivated solely by ultimate compassion/wisdom, free from defilements like anger, pride, or selfishness), then negative consequences arising from the action are deemed *karmically insignificant* or even *transmuted*. The action is justified *despite* the harm. The purity "absorbs" the negative karmic potential.
  2.  **Impure Intention as Moral Poison:** If even a trace of defilement is present in the motivation, then *even positive outcomes* are deemed tainted or negated karmically. The action is condemned *despite* the benefit. The impurity "contaminates" the entire act and its results.
  3.  **Intention as Gatekeeper, Not Weight:** Crucially, intention isn't being *weighed against* consequences in a cost-benefit analysis. Instead, the *quality* of the intention acts as a **gatekeeper** determining whether the consequences (good or bad) are even *admitted* into the karmic/moral equation for *that actor*. Good outcomes with bad motivation? Morally irrelevant (or negative). Bad outcomes with pure motivation? Morally irrelevant (or justified).

  **Why This Isn't Standard Buddhist "Intention-First" or Consequentialism:**

  *   **Vs. Standard Buddhist Intention-Primacy (Karma):** Traditional karma doctrine *emphasizes* cetana (volition/intention) as the primary determinant of karmic fruitfulness. However, it generally teaches that actions have consequences (*vipaka*, *phala*) based on their nature *and* intention. Harmful actions *tend* to bring suffering, even if motivated by (mistaken) compassion. Your observation highlights a *rhetorical move* where this link is severed *only when purity is asserted*, creating the asymmetry. Pure intention isn't just primary; it's presented as potentially *overriding* the typical karmic link between harmful action and result *for the actor* (though the victim's karmic experience remains).
  *   **Vs. Consequentialism:** Consequentialism evaluates actions *solely* by the net outcome. Intention might predict outcomes but doesn't *define* morality. Here, intention *defines* the moral character of the action *and* determines whether the visible outcome is morally relevant *for the agent's karma*. A good outcome with impure motivation is morally bad; a bad outcome with pure motivation is morally good/neutral. This is the opposite of consequentialism.

  **Established Concepts & Potential Terms:**

  1.  **Karmic Alchemy / Moral Alchemy:** This captures the idea that pure intention can seemingly "transmute" the karmic valence of a harmful act into something neutral or even positive, while impure intention "corrupts" a beneficial act. It emphasizes the transformative power attributed to the mind's purity. *(Closest existing concept, but not universal)*
  2.  **Mental Determinism (Karmic):** Focuses on the mind state being the *sole* determinant of the karmic result for the actor, rendering external consequences irrelevant *for their karma*. *(Descriptive)*
  3.  **Purity Valve:** The purity/impurity of intention acts like a valve controlling the flow of karmic consequences. Pure = valve closes, bad consequences can't "enter" the actor's karmic stream. Impure = valve closes, good consequences can't "enter". *(Metaphorical)*

  **Coining a Sharp Term: Intentional Karmic Override (IKO) / Motivational Karmic Filter (MKF)**

  *   **Intentional Karmic Override (IKO):**
      *   **What's Inside:** The actor's claimed mental state (pure/compassionate vs. impure/defiled).
      *   **What's Outside:** The actual, observable consequences of the action (harm/benefit).
      *   **The Mechanism:** The internal state ("pure" intention) is asserted to **override** the typical karmic link between the external action (especially if harmful) and negative karmic results *for the actor*. Conversely, an "impure" state **overrides** the link between beneficial action and positive karmic results *for the actor*.
      *   **Sharp Edge:** Highlights the *asymmetry* and the *power* attributed to intention to *suspend* normal karmic causality *specifically for the agent*, based solely on the *asserted quality* of their mind. It's not just primary, it's *overriding*.
      *   **Differs From:** Standard intention-first views (which still see intention *shaping* consequences, not *negating* them for the agent) and consequentialism (which ignores intention as a *moral determinant*).

  *   **Motivational Karmic Filter (MKF):**
      *   **What's Inside:** Same as IKO - the actor's mental state.
      *   **What's Outside:** Same as IKO - the consequences.
      *   **The Mechanism:** The internal state acts as a **filter** on the consequences. Only consequences "compatible" with the *claimed* mental state pass through to be considered karmically relevant *for the actor*. Pure motivation filters *out* negative consequences; impure motivation filters *out* positive consequences. What remains *after filtering* defines the karmic impact *for that actor*.
      *   **Sharp Edge:** Emphasizes the *selective exclusion* of inconvenient consequences based on the asserted mental state. The filter *decides what counts*.
      *   **Differs From:** Same as IKO.

  **Why This Happens (Especially with Teachers/Skillful Means):**

  1.  **Idealization of the Buddha/Arhat:** Acts from the Jataka or attributed to enlightened beings are seen through the lens of their ultimate purity. The assumption is their wisdom *knows* this harsh act is the *only* way to help, so the harm is karmically necessary/irrelevant *for them*.
  2.  **Primacy of Liberation:** The ultimate goal isn't worldly happiness but liberation from suffering. A harsh act motivated by pure compassion aimed at *spiritual awakening* is seen as cutting through delusion, its worldly harm secondary. An act easing suffering but reinforcing delusion (due to impure motivation) is seen as ultimately harmful.
  3.  **Trust in the Teacher:** Discourses often rely on trust in the teacher's realization. Questioning the purity of a realized teacher's motivation is seen as a defilement *in the questioner*. This creates a space where the "pure intention" claim is often accepted prima facie.
  4.  **Rhetorical Defense:** It provides a powerful, seemingly "Buddhist" justification for controversial actions taken by revered figures, insulating them from criticism based on observable harm.

  **Conclusion:**

  You've identified a real and significant pattern – **Intentional Karmic Override (IKO)** or **Motivational Karmic Filter (MKF)**. This isn't necessarily *doctrine* but a *rhetorical and interpretive mechanism* prevalent in discussions of skillful means, teacher authority, and the actions of highly revered figures. It leverages the core Buddhist emphasis on intention but stretches it into an asymmetry where asserted purity can morally insulate an actor from the negative consequences of their actions, while asserted impurity can morally negate the positive consequences. Understanding this mechanism is crucial for critically engaging with Buddhist ethical debates, especially those involving controversial actions justified as "skillful means."
