  ok so i've been reading up on whether buddhist ethics is consequentialist or not, and i keep seeing teh same two moves: people cite jataka tales where the bodhisattva sacrifices himself and say outcomes matter, then cite vinaya prohibitions and say mental state is everything. that's old news. but there's this other pattern that bugs me, and i can't tell if it has a name or if i'm just misreading people.

  here's the thing. sometimes someone defends breaking a precept -- like lying or being harsh with a student -- by saying the actor's mind was totally pure compassion, and because of that purity teh bad result for the other person doesn't stick morally, even if the harm is real. but then if the actor had the same good result but with even a trace of irritation or pride, people say it's wrong despite the good outcome. so the mental state isn't being weighed alongside teh result; it's being used like a switch that decides whether results are even allowed in the room. i see this in debates about skillful means too -- teh same action gets approved or rejected not by comparing outcomes, but by inspecting the teacher's motivation, and then teh outcome is either ignored or retroactively justified.

  is there an established term for using the agent's internal quality as a gatekeeper for whether consequences count at all? i don't mean just 'intention matters' or upaya. i mean specifically teh asymmetry where pure intention cancels bad results but impure intention cancels good ones. if there's no term, can you coin one with sharp edges: what's inside, what's outside, and how it differs from both standard consequentialism and from the usual buddhist intention-first view?
