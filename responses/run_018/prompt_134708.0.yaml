  The user is likely a student or scholar in Buddhist studies or ethics. They've done their homework but feel stuck in repetitive discussions. Their deeper need might be to articulate this nuanced mechanism to advance their understanding or academic work. They might be looking for terminology to frame their observations, which could help in debates or publications.

  I recall concepts like "karmic filtering" or "mental determinism" from Buddhist philosophy. The idea is that karma is primarily intention-driven. Pure compassion purifies the act, minimizing negative karma regardless of outcome. But even a hint of defilement taints the action, negating positive results. This is rooted in teachings like AN 6.63, where intention is karma.

  Terms like "karmic alchemy" or "moral solvent" come to mind. "Karmic alchemy" suggests that intention transforms the moral nature of outcomes. "Mental determinism" emphasizes that the mind's state dictates whether consequences count. These terms highlight the gatekeeping role of intention. 

  I should also differentiate this from Western ethics. Consequentialism weighs outcomes, deontology focuses on rules. Here, intention isn't a factor among others; it's a prerequisite that validates or invalidates outcomes. This is key to the user's point about asymmetry.

  The user might also appreciate knowing this is recognized in scholarship, even without a universal term. References to figures like Keown or Goodman could add credibility. Mentioning "skillful means" (upaya) as a context where this asymmetry plays out ties it back to their examples.

