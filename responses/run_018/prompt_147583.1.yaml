answer: |-
  Here is a formalization of the desiderata for an adequate theory of pattern-reality respecting Dennett's three stances as distinct but non-collapsible perspectives. The requirements are derived from the core phenomena each stance captures and the tensions between them.

  **Core Desiderata for a Theory of Pattern-Reality Respecting the Three Stances**

  1.  **Predictive & Explanatory Coverage:**
      *   **A. Cross-Stance Pattern Equivalence (Non-Negotiable):** Must explain how distinct stance-specific patterns (physical, design-functional, intentional belief-desire) can successfully predict/explain *the same physical behavior* via different compressions/abstractions.
          *   *Case:* A chess-playing computer. Physical stance: transistor voltages. Design stance: algorithm execution (minimax, evaluation functions). Intentional stance: "wants to control the center," "believes the knight is threatened." All successfully predict the next move, but at vastly different levels of granularity and with different ontological commitments.
      *   **B. Stance-Specific Explanatory Power (Non-Negotiable):** Must account for phenomena uniquely predicted/explained best (or only) within a single stance.
          *   *Case (Physical):* Explaining why a specific transistor failed due to electromigration.
          *   *Case (Design):* Explaining why a particular software bug causes a system crash under specific input conditions.
          *   *Case (Intentional):* Explaining why someone took a detour to avoid an embarrassing encounter.
      *   **C. Stance Interference & Conflict (Non-Negotiable):** Must account for cases where predictions/explanations from different stances genuinely conflict or interfere, not just diverge due to incomplete information.
          *   *Case (Physical vs. Intentional):* Addiction. Intentional stance predicts "wants to quit." Physical stance (neurochemistry, conditioning) predicts relapse. The conflict isn't just epistemic; the physical processes actively subvert the intentional pattern.
          *   *Case (Design vs. Intentional):* Optical illusions. Design stance (visual processing algorithms) predicts the illusion. Intentional stance (belief about the world) is systematically misled. The conflict reveals the mechanistic underpinning overriding the "natural" intentional interpretation.
      *   **D. Predictive Robustness under Stance Shift (Preference - Pattern-Realist):** Should ideally explain the robustness of higher-level patterns despite changes at lower levels (multiple realizability).
          *   *Case:* The same chess-playing strategy (intentional/design) can be implemented on silicon, vacuum tubes, or by a human brain (different physical substrates).

  2.  **Ontological Distinctions:**
      *   **E. Stance-Relative Reality vs. Mere Projection (Non-Negotiable):** Must distinguish between patterns that are *robustly detectable* and *projectively useful* from within a stance (possessing stance-relative reality) vs. patterns that are purely subjective impositions with no traction on the system's behavior.
          *   *Case:* Attributing the belief "2+2=4" to a calculator (robust, predictive) vs. attributing the belief "the sky is blue" to a rock (purely projective, non-predictive). The theory must ground this difference without assuming intrinsic intentionality.
      *   **F. Predictive Utility vs. Full Ontological Commitment (Non-Negotiable):** Must preserve the distinction between the undeniable *predictive/explanatory utility* of a stance and the specific *ontological commitments* often associated with its folk concepts (e.g., the utility of belief-desire psychology vs. commitment to immaterial Cartesian minds or irreducible propositional attitudes).
          *   *Case:* Successfully predicting behavior using the intentional stance does not *necessarily* entail that beliefs are "things in the head" with intrinsic semantic content, any more than predicting pressure using the ideal gas law commits us to perfectly elastic point particles.
      *   **G. Pattern Existence vs. Pattern Amount (Non-Negotiable):** Must distinguish between *whether a pattern is present at all* (is the system a suitable intentional system?) and *how much of that pattern exists* (how well-defined are the beliefs/desires? How noisy is the signal?).
          *   *Case:* A simple thermostat vs. a chess master vs. a person with severe dementia. All can warrant *some* intentional stance attributions ("wants room temp=70F", "wants to win", "wants comfort"), but the precision, richness, and predictive power (the "amount" of the intentional pattern) differs vastly. The theory must handle this continuum without collapsing into eliminativism for simple systems or full-blown realism only for complex ones.

  3.  **Consistency Conditions:**
      *   **H. Physical Closure (Non-Negotiable):** Must uphold the causal closure/completeness of the physical domain. No stance's patterns can introduce novel *physical* forces or violate fundamental physical laws. All effects have sufficient physical causes.
          *   *Case:* The movement of a robot arm is fully explainable by the physics of its motors and control circuits. Attributing the movement to "its desire to fetch the cup" does not add a new physical force.
      *   **I. No Free Ontological Lunch (Non-Negotiable):** The reality attributed to higher-level patterns (design, intentional) must be grounded in and constrained by the physical substrate. Patterns cannot float free; they must supervene on the physical without being identical to it.
          *   *Case:* Changing the physical state of a computer (e.g., flipping a crucial memory bit) can alter or destroy its functional state (design stance) and its intentional state (e.g., its "belief").
      *   **J. Empirical Adequacy at Each Level (Non-Negotiable):** Explanations and predictions generated within each stance must be empirically testable and corrigible *relative to the granularity and purpose of that stance*. Physical explanations are testable against physical measurements, design explanations against functional outputs, intentional explanations against behavioral predictions.
          *   *Case:* A failed behavioral prediction from the intentional stance forces a revision of belief/desire attributions, not necessarily a rejection of the stance itself for that system (cf. Quinean holism applied to the stance).

  **Analysis of Tensions & Non-Negotiables vs. Preferences:**

  *   **Non-Negotiables:** A, B, C, E, F, G, H, I, J. These capture the core phenomena the stances address and the fundamental constraints derived from physics and non-arbitrariness.
  *   **Preferences:** D (Robustness) is desirable for pattern-realists but might be downplayed by more reductionist views.
  *   **Key Tension:** The most significant potential conflict is between **H (Physical Closure)** and granting **strong ontological autonomy** to intentional patterns (often implied by E and F taken to an extreme). If intentional patterns are *causally efficacious* in a way not reducible to physical causation, this violates H. Conversely, if their efficacy is *only* derivative/physical, does this collapse them into the physical stance (violating B, C) or render them merely useful fictions (violating E, G)? **This tension is inherent in the stances themselves** – they offer genuinely different perspectives *and* the physical stance is fundamental. A theory must resolve this tension without violating the non-negotiables.
  *   **Joint Unsatisfiability?** Strict adherence to **H (Physical Closure)** combined with **I (No Free Lunch)** seems incompatible with granting **full causal autonomy and irreducible reality (strong emergence)** to intentional patterns. However, the desiderata do *not* strictly require strong emergence; they require non-collapsibility, stance-relative reality, and unique explanatory power (B, E, F, G). A theory satisfying H, I, and supervenience can still satisfy these if it posits patterns as real, non-identical to the physical substrate, and explanatorily indispensable *at their own level*.

  **The Eliminator: Requirement G (Pattern Existence vs. Pattern Amount)**
  This requirement eliminates the largest share of existing views:
  *   **Eliminative Physicalism:** Denies the existence of intentional patterns altogether (fails E, G).
  *   **Strong Realism (Fodor-esque):** Often treats beliefs as discrete, language-like tokens present only in complex systems, struggling with the continuum (fails G – can't handle simple cases well).
  *   **Instrumentalism:** Treats *all* patterns as merely useful fictions, blurring the line between robust detection (E) and mere projection, and failing to capture the "amount" distinction (G).
  *   **Type-Identity Physicalism:** Collapses patterns strictly onto specific physical types, failing multiple realizability (implied by D) and the autonomy required by B and C.

  **Brief Scoring of Views Against Desiderata:**

  1.  **Dennett's Pattern-Realism:**
      *   **Strengths:** Excels at A, B (especially C, D), E, F, G, J. Explicitly built around pattern existence/amount (G) and stance relativity (E).
      *   **Tension:** Navigates H & I via "real patterns" supervening on physics. Critics argue it leans too close to instrumentalism (F), potentially undercutting E by making pattern reality *only* about predictive utility, and struggles to fully satisfy demands for strong ontological autonomy sometimes desired for intentionality (the core of the argument).

  2.  **Eliminative Physicalism (e.g., Churchland):**
      *   **Strengths:** Embraces H, I fully. Strong on J at physical level.
      *   **Failures:** Fundamentally rejects the reality and often the unique utility (B) of design/intentional patterns, especially intentional (E, F, G catastrophically). Fails A, C by dismissing one side of the equivalence/conflict as illusion.

  3.  **Strong Emergentism:**
      *   **Strengths:** Embraces B, C, E, F (often strongly), G, D. Aims for high ontological autonomy.
      *   **Failures/Tensions:** Directly violates **H (Physical Closure)** by positing novel downward causation. Struggles with **I (No Free Lunch)** by making higher-level causation seemingly brute. Often struggles with **J** at the physical level when emergence introduces causal gaps. May struggle with **A** if emergent properties fundamentally alter behavior in ways lower stances can't track.

  **Conclusion:** An adequate theory must walk a tightrope, grounding patterns in physics (H, I) while respecting their distinct reality, utility, and non-collapsible explanatory roles across stances (A, B, C, E, F, G), all while being empirically accountable (J). The distinction between pattern existence and pattern amount (G) is crucial for avoiding simplistic dichotomies and is the most discriminating requirement. The inherent tension between physical fundamentality and the autonomy of higher stances remains the central philosophical challenge.
