answer: |-
  Here’s a step-by-step breakdown of the desiderata for a theory of life, grounded in philosophical rigor and your borderline cases. I’ve structured it as requested—starting with a brainstorm, then listing desiderata with justifications, tensions, and theory evaluations—all without leaning on textbook definitions.

  ---

  ### **Step 1: Brainstorm Core Challenges**
  - **Borderline Cases**:  
    - *Mirror-cell*: Challenges whether "life" requires biochemical compatibility with Earth’s systems or merely functional equivalence.  
    - *Genome-free xenobots*: Tests if evolution/genetics is essential, or if goal-directed behavior + self-replication suffice.  
  - **Key Tensions**:  
    - Must avoid circularity (e.g., "organisms are alive, parts are not").  
    - Must distinguish *parasitic dependency* (viruses) from *emergent individuality*.  
    - Must allow non-carbon life without vagueness ("complexity" isn’t enough).  
    - Must resolve if evolution is *constitutive* or *contingent* for life.  
  - **Non-Negotiables**: Any theory must explain *why* we intuit life as a distinct natural kind (e.g., why a mitochondrion isn’t "alive" but a bacterium is).

  ---

  ### **Step 2: Desiderata List**  
  *(Motivating puzzles in italics; **N/N** = Non-Negotiable vs. **C/P** = Camp-Specific)*  

  1. **Functional Autonomy**  
     - *Motivation*: Why is a tissue culture (e.g., HeLa cells) not "alive" while a synthetic cell is?  
     - **N/N**: Must distinguish parts (dependent on external organization) from wholes (self-sustaining).  
     - *Test*: Mirror-cell passes (internally autonomous); xenobot fails if reliant on external programming.  

  2. **Operational Closure**  
     - *Motivation*: How do viruses differ from virophages (which parasitize viruses)? Both lack metabolism, but virophages hijack *viral* machinery—suggesting a hierarchy of dependency.  
     - **N/N**: Requires causal self-containment (e.g., a system’s processes recursively depend *only on itself*).  
     - *Test*: Virophages fail (need viral hosts); mirror-cell passes; xenobot passes only if its "kinematics" are self-generated.  

  3. **Non-Arbitrary Individuality**  
     - *Motivation*: Mitochondria have DNA/metabolism but aren’t organisms. Why?  
     - **C/P** (Determinists vs. Pluralists): Non-negotiable that boundaries aren’t observer-relative; determinists demand physical borders (e.g., membrane), pluralists accept functional individuation.  
     - *Test*: Xenobot must form a cohesive unit *not* dependent on host topology.  

  4. **Adaptive Open-Endedness**  
     - *Motivation*: If a synthetic cell reproduces identically (no evolution), is it alive?  
     - **C/P**: Selection-history theorists (**N/N** for them) demand capacity for evolution; organizational views see it as contingent.  
     - *Tension*: Clashes with "metabolic closure" if evolution requires environmental openness (e.g., mirror-cell can’t evolve if isolated chirally).  

  5. **Substrate Neutrality**  
     - *Motivation*: Could a silicon-mesh AI that self-repairs/replicates be alive?  
     - **N/N**: Must avoid carbon chauvinism but exclude trivial cases (e.g., fire "metabolizes" but isn’t alive).  
     - *Test*: Mirror-cell is alive (chirality irrelevant); a crystal isn’t (lacks agency).  

  6. **Teleology Without Design**  
     - *Motivation*: Xenobots move toward "goals" via programming—is this intrinsic teleology?  
     - **N/N**: Requires *intrinsic* goals (e.g., maintenance of self), not imposed purposes.  
     - *Test*: Xenobot fails if goals are externally scripted; mirror-cell passes if it "aims" to persist.  

  7. **Information-Process Independence**  
     - *Motivation*: Can life exist without genomes?  
     - **C/P**: Organizational views allow it (e.g., autopoiesis); etiological views require heritable variation.  
     - *Test*: Genome-free xenobot passes only if it "inherits" kinematic patterns sans nucleic acids.  

  ---

  ### **Step 3: Tensions & Negotiability**  
  - **Fatal Tension**: #4 (Evolutionary Potential) vs. #1/2 (Functional Autonomy/Closure).  
    - *Why*: Strict closure (e.g., mirror-cell) isolates systems, preventing environmental interaction needed for evolution. Minimal synthetic cells that reproduce identically satisfy closure but fail #4.  
    - *Resolution*: Only negotiable if evolution is deemed non-essential.  
  - **Non-Negotiables**: #1, #2, #5, #6 (avoid circularity, triviality, or teleological cheating).  
  - **Camp-Specific**: #4 (etiological views) and #7 (organizational views).  

  ---

  ### **Step 4: Theory Evaluation**  
  **A. Etiological/Selection-History Account**  
  - *Core*: Life = entities undergoing Darwinian evolution.  
  - **Strengths**: Easily excludes xenobots (no heritability), viruses (no evolution solo), and demands #4.  
  - **Weaknesses**: Fails #5 (substrate-neutrality—requires carbon-like evolution?), #7 (xenobots), and struggles with mirror-cells (if evolutionarily isolated).  

  **B. Organizational Closure (Autopoiesis+)**  
  - *Core*: Life = self-producing network maintaining identity via operational closure.  
  - **Strengths**: Explains #1 (mitochondria lack closure), #2 (virophages violate closure), #5 (substrate-neutral), and accepts mirror-cells.  
  - **Weaknesses**: Ambiguous on #4 (must open-endedness be *possible* or actual?) and may overinclude (e.g., autocatalytic sets). Xenobots require scrutiny: are they self-constructing or externally assembled?  

  ---

  ### **Borderline Verdicts**  
  - **Mirror-cell**: Alive by organizational views (functional autonomy/closure); dead by strict etiological views (no evolutionary potential).  
  - **Xenobot**: Dead if externally programmed (fails #6); *potentially* alive if self-sustaining and goal-directed (e.g., finds energy without scripts).  

  This framework forces theories to confront the *why* behind intuitions—not just checklist criteria. The irreconcilable tension (#4 vs. #1/2) suggests pluralism may be necessary unless one desideratum is demoted. Let me know if you want to drill into specific tensions.
