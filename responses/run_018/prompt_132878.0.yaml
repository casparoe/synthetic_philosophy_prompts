  5. They might ask for more tokens. The facilitator should say: "You have all the tokens provided."

  6. They might try to change the order of blocks. The Auditor should enforce the building sequence.

  In the debrief, if they express frustration about the rules, use that to discuss how in logic the rules are fixed and we cannot change them arbitrarily.

