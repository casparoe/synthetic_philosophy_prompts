answer: |-
  Here's the scenario and breakdown – drafted for fried-brain efficiency:

  **Scenario:**  
  Sarah (marketing manager) emails her team about the quarterly report: *"Let's ensure we hit those targets – the deadline is flexible, but leadership is watching closely."* Statistical MT (trained on clean corporate docs) renders this word-perfect into German for Klaus (new Berlin hire): *"Stellen wir sicher, dass wir diese Ziele erreichen – die Frist ist flexibel, aber die Führungsebene beobachtet genau."* Klaus, unaware of last quarter's near-miss and Sarah's passive-aggressive "flexible" code for "URGENT," prioritizes other tasks, assuming genuine flexibility. Meanwhile, Eva (local admin with middling English but deep office lore) reads Sarah's email. She translates it loosely for a colleague: *"Sarah sagt, wir müssen die Ziele *jetzt* treffen – Chefetage guckt uns auf die Finger, 'flexibel' heißt hier 'sofort'!"* Hearing Eva’s frantic tone, the colleague flags Klaus, he re-prioritizes, and the report squeaks in on time. Disaster averted.

  **Hofstadter's Worry:**  
  The MT nailed the dictionary meanings and syntax but completely missed the **speaker meaning**. The "flexible" wasn't about literal time elasticity; it was a coded *threat* relying on shared trauma about leadership scrutiny. The MT operates on surface-level statistical correlations between words, not on **understanding the communicative intent rooted in social context and history**. It translated the *sentence*, not Sarah's *warning*.

  **Functionalist Defense:**  
  Functionalists counter: "Output-equivalence!" The MT produced a grammatically correct, lexically accurate translation *of the text it was given*. Its job is to map source strings to target strings based on learned patterns, not mind-read office politics. Eva produced a *functionally better outcome* for the situation, but she *didn't* translate the text accurately ("flexibel" ≠ "sofort"). Her success came from **adding external knowledge the MT wasn't provided**.

  **The Exact Feature Gap:**  
  **Lexical/Statistical Correlation vs. Pragmatic/Social Intent.** The MT correlates "flexible deadline" with translations seen in similar *sentence structures*. It lacks the module for inferring *why* a human would phrase it that way *in this specific social dynamic*.

  **Remove the Gap?**  
  If Sarah's message was unambiguous ("Submit the final report by 5 PM EST Friday sharp. Failure risks project cancellation."), the statistical MT *would* likely convey the urgency perfectly. The screw-up hinges entirely on the ambiguity requiring social decoding.

  **Statistical MT Defender's Counterattack (Beyond "Humans Pattern-Match Too"):**  
  *   **Input Problem, Not System Problem:** "This is bad *communication* by Sarah, not bad *translation*. Ambiguous source text = ambiguous output. Blame the manager, not the tool. Give the MT the *explicit* context humans need, and it performs fine."
  *   **Data Scalability:** "Sure, Eva saved the day *this time*. But she only knows *this* office's politics. A well-trained MT system, fed enough real-world *examples* of passive-aggressive corporate emails (with context tags?), *could* learn to flag or even adapt 'flexible' in contexts statistically linked to urgency. Humans don't scale."
  *   **Consistency Over Intuition:** "Eva *guessed* the intent correctly. What if she guessed wrong? The MT provides consistent, verifiable output based on the text. For high-stakes *legal* docs, you want the MT's precision, not Eva's hunches, even if she's sometimes brilliant."

  **TL;DR:** MT got the words right but missed the office-politics subtext (Hofstadter's "meaning" gap). Functionalists say it did its job *on the text provided*. The killer feature is **pragmatic inference of intent from social context**. Defenders argue: train MT on messier data, blame ambiguous inputs, or value consistency over risky human intuition.
