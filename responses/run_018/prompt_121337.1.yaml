prompt: |-
  I sit on a hospital formulary committee, so I spend a silly amount of time arguing about what counts as treatment versus what counts as enhancement, and I keep running into a shape I dont have a word for.

  It goes like this. Some intervention starts out as an upgrade for people who are already functioning fine — most of the ones I see were originally developed to rebuild or repair something damaged, and then get offered to people who just dont like how that part looks or works. As more people take it up, the range of what looks unremarkable shifts. Then not having it starts to read as the defect, and a few years later the same intervention is being requested as a restoration. The thing you measure to decide what counts as normal has itself been moved by the thing it was being used to classify. I think I see the same shape with height referrals for kids who are short but healthy, and with students using prescription stimulants to study, and it makes me suspicious that "restore normal functioning" cant do the work people want from it, because the normal is downstream of the interventions.

  Two things I cant settle on my own. First, every case I can think of ratchets in one direction — upgrades turn into restorations, but I cant produce a single case where a restoration turns into an upgrade — and I dont know whether that asymmetry is part of the thing or just a fact about how medicine happens to spread. Second, I cant tell whether this only afflicts baselines defined statistically off a population, or whether it also gets into the alternative baselines people propose when the statistical one starts wobbling, like "restore the level this particular person would have had if nothing had gone wrong" or "restore what the function is for."

  So: does this have a name? And I dont just want a label dropped on it. I want to know what the phenomenon actually is, how it differs from the nearby things it keeps getting muddled with — plain medicalisation, the problem of which population you compare someone to, the thing where a measure stops being useful once people start aiming at it, the thing where classifying people changes the people being classified — and where its edges are. If nothing established really fits, coin a term and define it tightly enough that I could look at a new case and say whether it is or isnt an instance. End with \answer{...} containing just the one best label, established or coined, and nothing else on that line.
reasoning: |-
  Okay, the user is on a hospital formulary committee and is dealing with a tricky phenomenon. They describe how interventions initially meant as enhancements for those already functioning normally end up shifting what's considered "normal." Over time, not having the intervention starts to be seen as a defect, and the same treatment is then requested as a restoration. This creates a loop where the baseline for normality is changed by the interventions themselves. Examples include height referrals for healthy but short kids and students using stimulants to study.

  First, I need to figure out if this phenomenon has a name. The user mentioned they don't just want a label but a deep understanding. They also have two specific questions: why the change seems to only go from enhancement to restoration, not the reverse, and whether this affects non-statistical baselines like individual potential or functional norms.

  Breaking down the phenomenon: It starts with an intervention designed for restoration (fixing damage) being used as an enhancement. As more people adopt it, the statistical norm shifts. This makes the natural state seem defective, turning the enhancement into the new restoration. The key is the circularity: the measure (normal function) is altered by the interventions it's meant to evaluate.

  Now, existing concepts: Medicalization is when a condition becomes defined and treated as medical, but it's broader and doesn't capture the feedback loop. Shifting baselines refer to changing perceptions of norms over time, often in ecology, but here it's driven by medical interventions. The Cobra Effect is when incentives backfire, but that's about unintended consequences. Goodhart's Law says that when a measure becomes a target, it ceases to be useful—similar but not exactly the same. Reflexivity in sociology involves feedback loops between concepts and reality, which is close but not specific to medicine.

  The term "therapeutic creep" comes to mind, but that's more about expanding indications for drugs. "Enhancement spiral" might fit, but it's not established. After considering, "Normative Feedback Loop" seems appropriate. It emphasizes the cyclical nature: interventions change the norm, which then redefines what needs intervention.

  Addressing the user's questions: The unidirectional ratchet (only enhancement to restoration) likely stems from technological advancement and social adoption. Once a new norm is established, reverting is hard because of path dependency. For the second question, statistical norms are most vulnerable, but even functional or counterfactual norms can be affected. For example, if enhancements become widespread, the expected "natural" state for an individual might be recalibrated, or functional demands could increase due to societal changes.

  Ensuring the definition is tight: Key elements are intervention shifting the norm, reclassification of natural states as deficient, and the circular redefinition of "restoration." Exclusions would be cases without this feedback loop, like purely cosmetic procedures that don't redefine health, or temporary shifts without reclassification.

  The best label is "Normative Feedback Loop." It captures the cyclical process and the redefinition of norms. Coined terms should be precise, so defining it as a self-reinforcing cycle where therapeutic enhancements alter the statistical or functional baseline, causing natural states to be redefined as deficits requiring restoration.
answer: |-
  This phenomenon represents a **Normative Feedback Loop** in medical classification, specifically a self-reinforcing cycle where therapeutic *enhancements* alter the perceived baseline of "normal" function, which subsequently reclassifies the unenhanced state as a deficit requiring *restoration*. Here's a precise breakdown:

  ### Core Mechanism
  1.  **Initial State:** Intervention `I` is developed to restore function (`R`) in population `P_d` (diseased/damaged).
  2.  **Enhancement Adoption:** `I` is adopted by population `P_h` (healthy) for enhancement (`E`), improving a trait beyond typical function.
  3.  **Baseline Shift:** Widespread adoption of `I` in `P_h` shifts the statistical distribution or societal perception of "normal" for the trait.
  4.  **Reclassification:** The original, unenhanced state of `P_h` is now perceived as deficient relative to the new norm.
  5.  **Loop Closure:** `I` is reclassified as a restoration (`R`) for this newly defined "deficit" in `P_h`, even though no underlying pathology exists. The measure ("normal function") is corrupted by the interventions it was meant to evaluate.

  ### Distinguishing from Neighboring Concepts
  *   **Medicalization:** Broader process of defining non-medical problems as medical. The NFL *is* a specific *driver* of medicalization, but focuses on the *feedback mechanism* where the intervention itself corrupts the norm used for classification. Medicalization can occur without this loop (e.g., newly defining grief as depression).
  *   **Shifting Baselines:** Describes changing perceptions of "normal" over time (e.g., environmental degradation). The NFL is a specific *cause* of shifting baselines in medicine, driven by the *adoption of enhancements* and resulting in *reclassification of treatments*.
  *   **Goodhart's Law ("When a measure becomes a target, it ceases to be a good measure"):** The NFL is a *manifestation* of Goodhart's Law applied to medical norms. The "measure" (statistical/functional normality) becomes a "target" (via enhancement), corrupting its validity for defining disease.
  *   **Reflexivity (Social Sciences):** The NFL is a form of reflexivity where the act of classifying/categorizing (using `I` for enhancement) changes the phenomenon being categorized (the norm for "healthy" function).
  *   **Cobra Effect/Perverse Incentives:** Focuses on unintended consequences of incentives. The NFL involves unintended consequences of *adoption* changing *definitions*, not necessarily perverse incentives driving behavior.
  *   **Which Population?:** While population choice matters (e.g., global vs. local norms), the NFL occurs *within* a chosen population definition as adoption changes *that population's* distribution/perception.

  ### Addressing Your Specific Questions
  1.  **The Unidirectional Ratchet (Enhancement→Restoration):** This asymmetry is *inherent* to the NFL phenomenon, driven by technological progress, social adoption, and path dependency.
      *   **Why Enhancement→Restoration?** Enhancements offer perceived advantages. Adoption increases prevalence, shifting the statistical mean and societal expectations upwards/downwards. Reverting is socially/technologically difficult (path dependency). The new "normal" becomes entrenched.
      *   **Why not Restoration→Enhancement?** True restoration targets a specific pathology against a *stable* baseline (e.g., antibiotics for infection). If the pathology is eliminated or the baseline shifts downward (e.g., famine reducing average height), the *need* for the intervention might decrease, but it doesn't typically get *reclassified* as an enhancement for the healthy. It might become obsolete or prophylactic, but not redefined as improving function *beyond* a newly lowered norm.
  2.  **Affects Non-Statistical Baselines?** Absolutely. The NFL can corrupt proposed alternatives:
      *   **"Restore level if nothing went wrong" (Counterfactual):** Widespread enhancement adoption changes societal expectations of what "would have gone wrong" *means*. If most peers are enhanced, a child's "natural potential" height might be seen as inherently deficient relative to the new environment.
      *   **"Restore the function's purpose" (Functional):** Societal definitions of "adequate function" can shift *because* of widely available enhancements. If cognitive enhancers are ubiquitous, the functional demands of education/employment may inflate, making unenhanced cognition insufficient for tasks it previously sufficed for. The *purpose* is redefined by the available means.

  ### Defining the Edges: Is it a Normative Feedback Loop?
  A case is an NFL if it demonstrates **ALL** of the following:
  1.  **Intervention Origin:** `I` is initially used/understood as *restorative* (`R`) for a defined pathology/damage OR *enhancing* (`E`) beyond typical function in the healthy.
  2.  **Adoption & Shift:** Adoption of `I` by a significant portion of the *healthy* population (`P_h`) for enhancement (`E`) demonstrably shifts the *statistical distribution* or *societal perception* of "normal" function for that trait.
  3.  **Reclassification:** Due to the shift in (2), the *original, unenhanced state* of `P_h` is redefined as a *deficit* or *disorder* relative to the new norm.
  4.  **Loop Closure:** `I` is subsequently advocated for, prescribed, or understood as a *restoration* (`R`) for this newly defined deficit in `P_h`.

  **Exclusions:**
  *   Interventions that shift norms without reclassification (e.g., cosmetic surgery normalizing a look doesn't automatically make natural features a "disease").
  *   Shifts driven solely by changing environmental factors/disease prevalence without enhancement adoption (e.g., average height decreasing due to famine).
  *   Cases where an enhancement remains classified solely as an elective enhancement, even if popular.

  ### The Best Label
  The phenomenon is most precisely captured by the established sociological concept of a **feedback loop** applied specifically to the corruption of medical/social norms. While terms like "therapeutic creep" or "enhancement spiral" exist, they lack the emphasis on the *circular redefinition* of the norm. "Normative Feedback Loop" directly names the core dynamic: the norm used for classification is altered by the consequences of the classifications themselves.

  \answer{Normative Feedback Loop}
