prompt: |-
  Below is an essay sketch I want commented on. I am arguing that standard speech-act taxonomy treats performatives as discrete events complete at the moment of utterance, but that a large class of institutional utterances—those I call "standing performatives"—have success conditions that extend over time and depend on a persistent institutional substrate rather than on felicity conditions fixed at t=0. A discrete performative like "I bet you five dollars" succeeds or misfires at the moment it is spoken; by contrast, a standing performative like "this university is hereby accredited for the next ten years" or "the emergency powers are hereby invoked" does not merely produce an immediate effect but establishes a continuous normative state. On my view, if the substrate collapses—say, the accrediting body dissolves or the emergency framework is legislatively revoked—the original utterance is not just violated afterward but retroactively suspended or voided, which is different from saying someone broke a promise made in a discrete utterance. I also want to push the idea that Austin's category of "exercitives" (exercising powers, rights, or influence) implicitly assumes this substrate stability but never analyzes it, so the distinction between illocutionary force and perlocutionary effect becomes unstable for standing cases: maintaining the state looks like a perlocutionary consequence, yet it is actually part of the illocutionary success condition.

  Please comment on three things. First, accuracy: am I misreading Austin's distinction between illocutionary and perlocutionary acts, and does the idea of retroactive suspension actually conflict with his binary happy/unhappy framework for misfires? Second, conceptual coherence: is "standing performative" a genuine extension of speech-act theory, or am I just redescribing institutional maintenance conditions that belong to sociology or law rather than philosophy of language? Third, on the internal logic: I claim that for standing performatives, the speaker's authority must be continuously recognized rather than merely present at utterance—does this collapse into a theory of institutional authority that makes the speech-act component redundant?

  In your response, say what would change your mind. Specifically, identify the argument or distinction that, if shown to be mistaken, would cause you to reject the standing/discrete distinction entirely, and flag where your reasoning is most likely to fail—whether in the reading of Austin, in the analogy between discrete and standing cases, or in the claim about retroactive voiding versus subsequent violation. Do not provide bibliographies, citation lists, or suggestions for further reading; I am working without access to sources and want the evaluation to depend only on the conceptual structure presented here.
reasoning: |-
  Okay, let me unpack this user's request. They're developing a theory about "standing performatives" that challenge standard speech-act taxonomy, particularly Austin's framework. The core idea is that some institutional utterances establish ongoing states rather than discrete events, with success conditions that extend over time. 

  Hmm, the user seems deeply familiar with Austin's work but is pushing beyond it. Their three requested focus areas suggest they're at a critical juncture in developing this theory - they want to know if it holds water philosophically. The no-sources constraint is interesting; they're forcing a pure conceptual evaluation, which means I need to be extra careful with terminology.

  First, on accuracy: Austin definitely treats performatives as point-in-time acts. But his "unhappy" conditions (misfires/abuses) don't account for later institutional collapse. The retroactive voiding idea is radical - it implies the original utterance wasn't just undermined but was never valid. That feels like a genuine extension rather than misreading, though it strains Austin's binary framework.

  Second, conceptual coherence: The "standing performative" category seems philosophically significant because it reveals how language constitutively maintains institutions. This isn't just sociology - it shows language doing different work when bound to persistent substrates. The illocutionary/perlocutionary blur is the most exciting part here.

  Third, on redundancy concerns: No, the speech-act component isn't made redundant because the utterance still triggers the state. Continuous recognition is part of the validity condition, not a replacement for the speech-act. It's the difference between lighting a fire (discrete act) and maintaining a nuclear reaction (standing act) - both depend on initial activation.

  What would change my mind? If someone proved that all apparent "standing" cases are just discrete acts plus separate sustaining actions. But the retroactive voiding phenomenon suggests otherwise - when the substrate collapses, it rewrites history in ways discrete acts don't. My weakest point might be overstating the analogy between accreditation and bets; maybe the difference is just scalar, not categorical.

  The user's clearly done serious work here. The emergency powers example is particularly clever - when a court later rules an emergency declaration was unconstitutional, it doesn't just terminate the state but negates its legal existence from day one. That retrospective dimension is what makes this theory feel truly novel.
answer: |-
  Here’s a focused evaluation addressing your three queries, with explicit criteria for rejection and vulnerability points flagged:

  ### 1. **Accuracy vis-à-vis Austin**  
     - **Illocutionary/Perlocutionary Distinction**: Your critique is sound. Austin *does* treat illocutionary success (e.g., "I bet") as settled at *t=0* via felicity conditions (authority, uptake, procedure). Perlocutionary effects (e.g., convincing someone) are causal consequences *after* the act. Your "standing performatives" expose a gap: the *maintenance* of the normative state (e.g., accreditation being in force) is neither a discrete illocutionary act nor a mere perlocutionary effect—it’s a *sustained illocutionary condition*. This destabilizes Austin’s binary.  
     - **Retroactive Suspension vs. Misfire**: Austin’s misfires (e.g., lack of authority at *t=0*) invalidate the act *ab initio*. Your retroactive suspension (e.g., accreditor dissolving *later*) voids an act *initially valid*. This *does* conflict with Austin’s framework, which lacks a category for *ex post facto* institutional collapse annulling past speech acts.  
     - ***What would change my mind***: If Austin’s "securing uptake" could be shown to encompass *continuous* institutional recognition (it can’t—he explicitly ties uptake to the moment of utterance). If retroactive suspension were proven indistinguishable from a *perlocutionary failure* (e.g., "they stopped obeying"), your distinction collapses.  
     - ***Vulnerability***: Overstretching "misfire." Austin might say the *original* act succeeded, and its *violation* is external. Your retroactive voiding needs rigorous separation from subsequent breaches.

  ### 2. **Conceptual Coherence of "Standing Performatives"**  
     - **Genuine Extension or Redescription?**: This *is* a philosophically novel extension. You’re not just describing institutional maintenance (sociology/law) but arguing that the *illocutionary force itself* depends on persistent conditions. This reveals a linguistic phenomenon: certain utterances *constitutively require* durational support to *be* successful illocutions (not just to have effects).  
     - **Philosophical Significance**: It forces speech-act theory to account for institutional *temporality*. The "substrate" isn’t just context—it’s a *constitutive precondition* for the act’s ongoing validity, blurring illocution/perlocution boundaries in a way sociology alone wouldn’t.  
     - ***What would change my mind***: If all "standing" cases can be reduced to a *series* of discrete performatives (e.g., daily re-authorizations), or if the "substrate" is shown to be *only* a perlocutionary enabler (like needing police to enforce a verdict).  
     - ***Vulnerability***: Conflating institutional durability with illocutionary force. If the substrate’s collapse merely *ends effects* (perlocutionary) rather than *voids the act* (illocutionary), your core claim weakens.

  ### 3. **Internal Logic: Authority Redundancy?**  
     - **Continuous Authority ≠ Redundancy**: No—the speech act remains essential to *initiate* the state. Continuous recognition sustains the *validity conditions*, not the act itself. Compare: A lit match (speech act) ignites a fire (state), but oxygen (substrate) must persist to *keep* it burning. Without the match, no fire exists to maintain.  
     - **Speech-Act Component**: The utterance isn’t redundant; it’s the *trigger* that binds the institution to a new state. Continuous authority sustains the *conditions* under which the act *remains* in force.  
     - ***What would change my mind***: If institutions can enter "standing states" *without* a performative utterance (e.g., through tacit practice). Or if "continuous recognition" wholly *replaces* the need for an initial utterance (it doesn’t—you still need "hereby accredited" to start the clock).  
     - ***Vulnerability***: If the "substrate" does all the work and the utterance is merely ceremonial. Your emergency powers example is strong here—without the utterance, no emergency is legally invoked, regardless of substrate.

  ### Critical Weakness & Rejection Threshold  
  - **The linchpin**: Your analogy between discrete ("I bet") and standing ("accredited") cases. **If retroactive voiding can be shown as merely a *violation of consequences* (like breaking a bet’s terms) rather than *invalidating the act’s initial success*, your distinction fails.** Austin could argue: the accreditor’s dissolution *breaks the contract* created by the performative but doesn’t retroactively make "hereby accredited" a misfire; it was happy until violated.  
  - **Most likely failure point**: The analogy itself. Discrete performatives create *instant obligations* but aren’t "voided" if conditions change later (e.g., betting law is repealed—your bet was still placed). For standing cases, you argue institutional collapse *erases the past act*. Proving this isn’t just a special *type* of violation (sociological) but an *illocutionary cancellation* (philosophical) is your highest hurdle. If this collapses, standing performatives revert to discrete acts plus external maintenance.
