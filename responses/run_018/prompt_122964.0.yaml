  - **C. You should have removed the option to deviate.** → **Ulysses-style precommitment**  
    *Most awkward commitment: You incur costs to eliminate options that might be beneficial ex post.*  

  #### **Branch 6: Avoid Exploitation Without Precommitment?**  
  *Can you avoid exploitation in Scenario 1 without altering your options?*  
  - **Yes** → Go to Branch 7  
  - **No** → Go to Branch 8  

  #### **Branch 7: How Avoid Exploitation?**  
  *How do you avoid exploitation without precommitment?*  
  - **A. Re-optimize period-by-period.** → **Incoherent** (Leads to the same cycle and exploitation)  
  - **B. Use backward induction from the start.** → **Sophisticated choice** (Same as Branch 3B)  
  - **C. Stick to a pre-formed plan no matter what.** → **Resolute choice**  
    *Most awkward commitment: You ignore current preferences even when compelling.*  

  #### **Branch 8: Why Precommit?**  
  *Why must you alter your options to avoid exploitation?*  
  - **A. Future selves won’t act as you now want.** → **Ulysses-style precommitment** (Same as Branch 4C)  
  - **B. Exploitability is a misfortune, not a fault.** → **Pumpability as misfortune**  
    *Most awkward commitment: You may be drained of resources with no rational recourse.*  
  - **C. Selves are independent agents needing a deal.** → **Bargaining among selves**  
    *Most awkward commitment: You sacrifice Pareto-optimal outcomes to satisfy all selves.*  

