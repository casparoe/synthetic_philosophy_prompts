  This tree guides you from concrete choices to your implicit stance on rational choice over time. Branch questions are based on cases, not labels. Answer based on your intuitions. After branching, positions are located in the logical space, with unoccupied combinations diagnosed. Each leaf names a position (or "unnamed"), states its most awkward commitment, and is reached via consistent answers.

