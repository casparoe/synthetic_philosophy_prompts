prompt: |-
  Clarify the conceptual core of the frame problem by treating it not merely as an AI planning puzzle about physical inertia, but as a deeper tension between monotonic representation and non-monotonic inference. In particular, examine whether frame axioms and successor-state axioms genuinely resolve anything, or whether they simply encode a default assumption that most properties persist into the ontology itself, thereby concealing the underlying difficulty: that without an explicit relevance filter, any complete world-state representation demands either an infinite conjunction of non-changes or a closure rule that is either too weak to prevent inconsistency or too strong to be tractable. Conclude by assessing whether this reveals the frame problem to be not a representational deficit about knowledge of the world, but a symptom of the intractability of exhaustive causal theories under resource-bounded reasoning. Keep your response to two paragraphs at most; do not include citations, bibliographies, or references to specific texts.
