  In the activity, after the first update (ruling out Blue-Swamp), we have:
     Red-Plain: 1/3
     Red-Swamp: 1/3
     Blue-Plain: 1/3

  Then the conditional evidence: "Given Red, the odds of Plain to Swamp are 1:3".

  So the constraint on Red: the probability of Red-Plain should be 1/4 of the total Red probability, and Red-Swamp should be 3/4.

  But the total Red probability is currently 2/3. So to satisfy the constraint, we must have:
     P(Red-Plain) = (1/4)*(2/3) = 1/6
     P(Red-Swamp) = (3/4)*(2/3) = 1/2

  Then, the probability mass for the Blue cell is still 1/3? Or should it be adjusted? The constraint doesn't say. So if we leave it at 1/3, then we have:
     Red-Plain: 1/6
     Red-Swamp: 1/2
     Blue-Plain: 1/3
     Total: 1/6 + 3/6 + 2/6 = 6/6=1.

  But note: the total probability for Blue is 1/3, same as after the first update. The unconditional probability for Red is 1/6+1/2=2/3, also same as before.

  However, we might want to allow students to also move mass from Red to Blue or vice versa? The constraint doesn't forbid that. For example, a group might reason: "The conditional information makes Red seem more uncertain, so maybe we should decrease the probability of Red and increase Blue." They might then reduce P(Red) and increase P(Blue) arbitrarily, as long as the conditional within Red is 1:3.

  For instance, they might set:
     P(Red) = some value, say 0.5.
     Then P(Red-Plain) = (1/4)*0.5 = 0.125
     P(Red-Swamp) = (3/4)*0.5 = 0.375
     P(Blue) = 0.5
     and then within Blue, they might keep it as one cell: Blue-Plain=0.5.

  Or, they might split Blue into two cells even though one was ruled out? But we ruled out Blue-Swamp, so Blue-Plain is the only possibility for Blue.

  So in this setup, the only freedom is to move probability between the entire Red and the entire Blue. The conditional within Red is fixed once we choose P(Red), because:
     P(Red-Plain) = (1/4) * P(Red)
     P(Red-Swamp) = (3/4) * P(Red)
     P(Blue-Plain) = P(Blue) = 1 - P(Red)

  And then we have no constraint on P(Red). So any P(Red) in [0,1] is allowed? But that can't be, because the conditional update should be consistent with the first update ruling out Blue-Swamp, and also, the conditional within Red should be satisfied.

  So we have a family of solutions parameterized by P(Red) in [0,1]. The only constraint is that the conditional within Red is 1:3, and the only cell for Blue is Blue-Plain, and the total is 1.

  This is what we want for the activity. Different groups will choose different P(Red) and hence different distributions. Some might keep P(Red)=2/3, some might set it to 0.5, or even to 0.1.

  Then, in the debrief, we can point out that the information does not determine how to allocate the probability between the Red and Blue areas, and that's the underdetermination. The minent rule would choose the distribution closest to the current distribution (after the first update) in relative entropy. The current distribution after the first update is:
     Q0: Red-Plain=1/3, Red-Swamp=1/3, Blue-Plain=1/3.

  We then minimize relative entropy over distributions of the form:
     Q: Red-Plain = (1/4)r, Red-Swamp = (3/4)r, Blue-Plain = 1-r   [where r = P(Red)]

  The relative entropy D(Q||Q0) = 
     (1/4)r * log( ((1/4)r) / (1/3) ) + 
     (3/4)r * log( ((3/4)r) / (1/3) ) + 
     (1-r) * log( (1-r) / (1/3) )

  We can minimize this function in r. But for the activity, we don't need to do this minimization; we can just let the students choose r arbitrarily.

  Then, the punchline: the minent rule will choose a particular r that minimizes this, and it turns out to be r=2/3? Because then the distribution is exactly the same as before the conditional update within the Red and Blue groups? But wait, if r=2/3, then the distribution is:
     Red-Plain = (1/4)*(2/3)=1/6
     Red-Swamp = (3/4)*(2/3)=1/2
     Blue-Plain = 1-2/3=1/3

  Which is exactly the distribution we get if we leave the Blue probability unchanged and only update within Red. This has the advantage that the conditional distribution for Blue is unchanged (which is now degenerate: only one cell). 

  And the relative entropy would be zero for the conditional within Blue because it is unchanged? And for the Red part, it has to change to meet the constraint, so the entropy for that part might be not zero. But if we set r=2/3, then the only changes are within Red, which is as required.

  But is this the minimum? It might be, because if we change r, then both the Red and Blue parts change, which might increase the divergence.

  So in this case, the minent rule would leave the unconditional probabilities for the colors unchanged and only update within Red. This does not increase P(Blue) ( it remains 1/3).

  To get an increase in P(Blue), we need a different setup. Consider having the first update rule out a cell in the Red territory? 

  First update: rule out Red-Swamp. Then we have:
     Red-Plain: 1/3
     Blue-Plain: 1/3
     Blue-Swamp: 1/3
     P(Red)=1/3, P(Blue)=2/3.

  Then, conditional evidence: "Given Red, the odds of Plain to Swamp are 1:3". 
     But currently, within Red, we only have Red-Plain (since Red-Swamp is ruled out). This is a problem because we need to have a positive probability for Red-Swamp to have a conditional probability.

  So we must not rule out a cell in the territory that will be conditionally updated. Therefore, we should rule out a cell that is not in the condition.

  But then, to see an increase in the other color, we might need to start with a non-uniform prior. Given the time constraints, we might not want to do that.

  Therefore, I propose to accept that in this activity, the unconditional probability for the other color might not increase, and instead focus on the underdetermination of how to allocate probability between the two colors and within the condition.

   The core teaching goals are:
     - Updating on conditional information does not determine the unconditional probability of the condition.
     - The resulting underdetermination leads to multiple possible updates.
     - The minent rule is one way, which in this case leaves the unconditional probability of the condition unchanged.

   We can then mention that in the original Judy Benjamin problem (without an intermediate update), the minent rule also leaves the probability of the condition unchanged, but there are other problems where it might change.

  **Revised Activity:**

  ** Minute-by-Minute Timeline (75 minutes): **

  0-5 min: Introduction to the scenario and setup.
  - "You are search teams looking for a lost camper. The camper is in one of four regions: Red-Plain, Red-Swamp, Blue-Plain, Blue-Swamp. Initially, you have no information, so you assign 25% to each."

  5-10 min: Initial setup in groups.
  - Groups distribute tokens: 5 tokens per card (if using 20 tokens).

  10-20 min: First update - hard evidence.
  - "We just received a report: The camper is definitely not in the Blue-Swamp region. Update your probabilities accordingly."
  - Groups remove tokens from Blue-Swamp and redistribute the tokens proportionally among the other three. Since they were equal, they should now have about 6.66 tokens each. But to avoid fractions, use 12 tokens initially (3 per card) and then after removing one card, redistribute the 12 tokens equally among the three remaining: 4 tokens per card. 
     - So: Red-Plain: 4, Red-Swamp: 4, Blue-Plain: 4, Blue-Swamp: 0.
     - Each token now represents 1/12 of the probability? We can say that the total tokens should be 12, so each token is 1/12.

  20-40 min: Second update - conditional evidence.
  - "Now, you receive a second report: 'Given that the camper is in Red territory, the odds between Plain and Swamp are 1:3 (Plain:Swamp).'"
  - Explain: This means that if we consider only the Red territory, for every 1 part Plain, there are 3 parts Swamp. So the probability of Plain given Red is 1/4, and Swamp given Red is 3/4.
  - Note: This does not rule out any region, and it doesn't tell you anything directly about Blue territory.
  - Instructions: "Update your tokens to reflect this new information. You may move tokens between any of the cards, as long as: 
     a) The conditional probability within Red territory (i.e., the proportion between Red-Plain and Red-Swamp) is 1:3. 
     b) The total number of tokens remains 12. 
     c) Blue-Swamp must remain at 0 tokens (since it was ruled out)."
  - Let them work in groups. Walk around to observe.

  40-55 min: Group reporting and initial discussion.
  - Have 2-3 groups share their final distribution and explain why they did it that way.
  - Expected responses:
     - Some groups will leave the Blue-Plain tokens at 4, and adjust the Red tokens: so they set Red-Plain to 1 token and Red-Swamp to 3 tokens. Why? Because then within Red, tokens are 1:3. And the total tokens: 1+3+4=8, but we need 12. They forget to scale.
        - Correction: They need to scale within the constraint. If they want the conditional within Red to be 1:3, and they leave Blue at 4, then the tokens in Red must sum to 8, and be in the ratio 1:3. So Red-Plain=2, Red-Swamp=6, Blue=4. Total=12.
     - Some groups might reduce the tokens in Blue and increase in Red, or vice versa. For example, they might set:
          Red-Plain=1, Red-Swamp=3, Blue-Plain=8.  Total=12.   [P(Red)=4/12=1/3, P(Blue)=8/12=2/3]
     - Or: Red-Plain=3, Red-Swamp=9, Blue-Plain=0.  [But then the conditional in Red is 3:9=1:3, but they removed all tokens from Blue, which is allowed? They might reason that the conditional information suggests the camper is in Swamp, and they think that might make Red more likely, but they have to set P(Blue)=0? This might be an error.]

  55-65 min: Debrief and philosophical reflection.
  - Highlight the underdetermination: The new information does not specify how the probability should be allocated between Red and Blue. So groups had to make a choice.
  - Point out that the most common approaches will be:
     a) Leave the probability of Blue unchanged (at 4 tokens) and adjust only within Red (2 and 6 tokens for a total of 8 in Red). This is Jeffrey conditionalization (updating only the conditional within the partition) or the minent rule in this context.
     b) Reallocate arbitrarily between the colors. For example, one group might have increased Blue and decreased Red, or vice versa.
  - The uncomfortable realization: In the minent rule, we leave P(Blue) unchanged, but note that within Red, we now have a higher probability for Red-Swamp. However, the information didn't directly say anything about Blue, so why should Blue change? But also, why should it remain the same? The information might make us more confident in Blue because Red is now more uncertain? 
  - Explain that in the literature, the minent rule is one candidate, but some argue for other rules.

  65-75 min: Wrap-up and connection to Judy Benjamin.
  - In the standard Judy Benjamin problem, there is no intermediate update, and the minent rule leaves the probability of the other territory unchanged. But there are other rules that do change it.
  - The conditional information feels like it should only affect the within-Red probabilities, but some update rules (not minent) might change the unconditional probability of the territories.
  - Limitations of the activity: 
     - In the real Judy Benjamin problem, the conditional information comes from a trusted source that might have a perspective on the whole map, so it might indirectly bear on the territory. Our activity doesn't capture that trust aspect.
     - The activity has an intermediate update, which the Judy Benjamin problem does not, but it allows us to create a situation where the conditional update is on a non-zero probability event.

  **What will go wrong:**
  - Students might not understand the conditional odds. Provide an example: "1:3 means if there are 4 parts, 1 is Plain and 3 are Swamp, so Plain is 1/4 and Swamp is 3/4 of the Red territory."
  - Students might try to renormalize without redistributing between Red and Blue: They might set the tokens in Red to be in the ratio 1:3, but forget to scale them so that the total remains 12. They might end up with fewer or more tokens. 
  - Students might want to set Blue to be also in a ratio, but Blue has only one cell, so they might feel it has to be 1:0 or something. 
  - Some groups might not realize they can change the number of tokens in Blue. They might fix it at 4 and only adjust the Red within themselves. That's fine, that's one approach.

  **Handout for Students:**

  ### The Lost Camper Activity

  **Scenario:**
  A camper is lost in one of four regions defined by:
  - **Color:** Red or Blue territory
  - **Terrain:** Plain or Swamp

  The four regions are: 
  - Red-Plain (RP)
  - Red-Swamp (RS)
  - Blue-Plain (BP)
  - Blue-Swamp (BS)

  **Materials:**
  - 4 index cards labeled: RP, RS, BP, BS.
  - 12 tokens (each token represents 1/12 of the probability).

  **Initial Setup (5 minutes):**
  - Place the four cards in a grid.
  - Put 3 tokens on each card (since 3/12 = 25% for each region).

  **First Update (10 minutes):**
  - You receive new information: "The camper is definitely not in the Blue-Swamp region."
  - Remove all tokens from BS.
  - You now have 9 tokens on the other three cards. But you need to have a total of 12 tokens to represent 100%. This means you must redistribute the tokens to reflect the new information. Since we have no reason to favor any of the three remaining regions, add tokens equally: 
     - Take 3 additional tokens (or however many you need to get to 12) and distribute them equally. But it's easier to start over: 
     - Remove tokens from BS. Now you have 9 tokens on RP, RS, and BP (3 each). You need to add 3 tokens. How should they be distributed? 
     - Since the three regions are equally likely, add one token to each. Now you have:
          RP: 4 tokens (4/12 = 1/3)
          RS: 4 tokens (1/3)
          BP: 4 tokens (1/3)
          BS: 0 tokens.

  **Second Update (20 minutes):**
  - You receive new information: "Given that the camper is in Red territory, the odds of Plain to Swamp are 1:3."
  - This means: In the Red territory, for every 1 part Plain, there are 3 parts Swamp. Therefore, the probability of Plain given Red is 1/4, and Swamp given Red is 3/4.
  - Your task: Update the tokens on your cards to reflect this new information. 
  - Rules:
     a) The tokens within the Red territory must be in the ratio 1:3 (RP:RS).
     b) The total number of tokens must be 12.
     c) BS must remain at 0 tokens.
  - You may move tokens between any cards (even between Red and Blue) as long as the above conditions are met.

  **Group Discussion:**
  Be prepared to explain your group's distribution and why you chose it.

  **Debrief (Instructor Lead):**
  - We will see that different groups have different distributions.
  - The new information underdetermines the update: it doesn't tell us how to allocate probability between Red and Blue.
  - The most common approaches:
     - Leave the tokens on Blue unchanged and only adjust within Red: 
          RP: 2 tokens, RS: 6 tokens, BP: 4 tokens. 
          Why? Because then within Red: 2:6 = 1:3, and the total is 12. This keeps the probability of Blue at 4/12=1/3.
     - Or, change the allocation to Blue: 
          For example, RP: 1 token, RS: 3 tokens, BP: 8 tokens. 
          Then within Red: 1:3, and the probability of Blue is 8/12=2/3.
     - Or, any other distribution where the tokens in Red are in the ratio 1:3 and the tokens in Blue are between 0 and 12, and the total is 12.

  - This is the puzzle: the information about the conditional within Red doesn't tell us how to change the probability of Blue. But should it? 
  - In the standard approach (minimum relative entropy), we choose the distribution that is closest to the previous distribution (after the first update) in a specific sense. In this case, it leaves the probability of Blue unchanged. But that is a choice.

  **Limitations:**
  - In the actual Judy Benjamin problem, the conditional information comes from a source that may have additional knowledge about the whole map, but our activity treats it as a constraint without considering the source's reliability or perspective.
  - The activity has an intermediate update that rules out one region, which is not in the original problem, but it helps us avoid the problem of conditioning on a zero-probability event.

  This activity should achieve the goal of making students feel the underdetermination and the non-triviality of updating on conditional information.
answer: |-
  ### Structured Activity Design: The Judy Benjamin Problem  
  **Goal:** Students experience updating on conditional evidence, confront underdetermination, and feel the unintuitive shift in unconditional probabilities.  

  ---

  ### Brainstormed Formats & Selection  
  1. **Card Sorting with Tokens:**  
     - Groups use index cards (representing partition cells) and tokens (probability mass). They redistribute tokens upon evidence.  
     - *Why chosen:* Tangible, flexible for redistribution, avoids fractions by using discrete tokens. Easily scales to group work.  

  2. **Human Bar Graph:**  
     - Students stand in tape-marked grid quadrants; redistributing requires physically moving to new cells.  
     - *Why not chosen:* Logistically chaotic (space, movement), hard to represent partial mass, risks embarrassment.  

  3. **Dice/Card Game:**  
     - Students draw cards or roll dice to simulate evidence, then recalculate odds.  
     - *Why not chosen:* Overly procedural, distracts from conceptual struggle with token redistribution.  

  ---

  ### Final Activity: "The Lost Hiker"  
  #### Materials (for each group of 4 students)  
  - **4 index cards** labeled:  
    - *Red-Plain, Red-Swamp, Blue-Plain, Blue-Swamp*  
  - **48 poker chips** (12 per card initially).  
  - **1 sheet** with rules & prompts (handout).  
  - **1 calculator** (optional, for groups needing fractions).  

  #### Group Roles & Rules (Handout Excerpt)  
  **Roles:**  
  - **Facilitator:** Ensures group follows steps, keeps time.  
  - **Distributor:** Moves tokens during updates.  
  - **Recorder:** Tracks final probabilities.  
  - **Spokesperson:** Explains group’s reasoning.  

  **Rules:**  
  1. Start with 12 chips on each card (equal 25% probability per region).  
  2. When evidence is given:  
     - First update: Remove chips from ruled-out region. Redistribute *only* to remaining regions proportionally.  
     - Second update: Reposition chips *anywhere*, but must satisfy the conditional odds. Total chips must always sum to 48.  
  3. No independence assumptions! Only follow explicit constraints.  

  ---

  ### Minute-by-Minute Timeline (75 min)  
  **0-10 min: Setup & Context**  
  - Introduce the "Lost Hiker" scenario:  
    > "A hiker is lost in one of four regions: Red/Blue territory, each with Plain/Swamp terrain. We start with equal credence in each."  
  - Distribute materials. Groups place 12 chips on each card.  

  **10-20 min: First Update (Confidence)**  
  - Give evidence: *"The hiker is NOT in Blue-Swamp."*  
  - Groups remove Blue-Swamp chips.  
  - **Task:** Redistribute 48 chips proportionally among remaining three regions (should get 16 chips each).  
  - *Checkpoint:* All groups should have 16 chips on Red-Plain, Red-Swamp, Blue-Plain.  

  **20-45 min: Second Update (Stuckness & Experimentation)**  
  - Give evidence: *"Given the hiker is in Red territory, the odds of Plain vs. Swamp are 1:3."*  
    - Clarify: "This means if you *only* consider Red, for every 1 Plain, there are 3 Swamps."  
  - **Task:** Update chips to satisfy:  
    - `Chips on Red-Plain : Chips on Red-Swamp = 1 : 3`  
    - Total chips = 48.  
    - Blue-Swamp remains at 0.  
  - **Crucial ambiguity:** Groups *can* move chips between Red/Blue regions.  
  - Instructor circulates, probes: *"Why did you move those? Does the evidence force Blue to change?"*  

  **45-60 min: Group Reports & Debate**  
  - 3 groups share distributions (via spokesperson). **Expected outcomes:**  
    - **Group A:** Leaves Blue-Plain at 16 chips. Adjusts Red: Red-Plain=4, Red-Swamp=12 (since 4:12=1:3). **P(Blue)=33%** (unchanged).  
    - **Group B:** Decreases Blue: Red-Plain=8, Red-Swamp=24, Blue-Plain=16. **P(Blue)=33%** (accidentally preserved).  
    - **Group C:** Increases Blue: Red-Plain=3, Red-Swamp=9, Blue-Plain=36. **P(Blue)=75%** (shifted).  
  - Debate: *"Group C, why did Blue increase? Group A, why not?"*  

  **60-75 min: Instructor Debrief**  
  - **Map to Philosophical Concepts:**  
    - *Group A:* "Jeffrey Conditioning" (update only the conditional subtree).  
    - *Group C:* "MaxEnt/Minimum Relative Entropy" (redistribute to minimize surprise; unintuitively raises P(Blue) here).  
    - *Group B:* "Refusal to Update" (smuggled in an assumption that Blue is fixed).  
  - **Key Insight:**  
    > "The conditional info felt 'only about Red,' but MaxEnt *automatically* raised P(Blue) because it minimizes changes *globally*. Blue 'benefited' from our uncertainty about Red shifting."  
  - **Punchline Naming:**  
    - "This is the Judy Benjamin problem: Conditional evidence can shift unconditional probabilities, and MaxEnt is controversial. Should you only update the targeted subtree, or let the whole distribution adjust?"  

  ---

  ### Predictable Problems & Solutions  
  - **Renormalizing without redistributing:**  
    - *E.g.,* Groups keep chips on Blue fixed and *only* adjust Red.  
    - **Solution:** Ask: *"Does the evidence forbid moving chips between territories? Could moving them make your distribution 'smoother'?"*  

  - **Smuggling independence:**  
    - *E.g.,* "Blue is independent, so we didn’t touch it."  
    - **Solution:** Challenge: *"The evidence didn’t mention independence! Why assume it?"*  

  - **Math anxiety:**  
    - **Solution:** Use chips for arithmetic (e.g., "1:3 ratio = 1+3=4 parts; divide Red’s chips into 4 piles"). Allow calculator for ratios.  

  ---

  ### Honest Limitation  
  - **Trusted Source Dynamics:**  
    > "This activity *cannot* replicate why conditional evidence from a *fallible source* feels like testimony 'about' the unconditioned variable. Here, the odds constraint is a brute fact, not a report that might indirectly signal something about Blue. In Judy Benjamin, the source’s *reliability* makes the shift feel like a betrayal. Use a follow-up discussion to explore this nuance: *'What if the message came from a scout who only saw Red territory? Would you still let P(Blue) rise?'"*  

  ---  
  **Outcome:** Students physically grapple with underdetermination, confront the MaxEnt intuition pump, and leave unsettled by how "silent" evidence speaks volumes.
