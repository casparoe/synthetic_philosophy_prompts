  I'm putting together interview quesitons for a podcast with an unnamed philosopher who defends the view that Zeno's Arrow paradox is actually an attack on instantaneous velocity, not on motion—so the calculus reply (instantaneous rate of change) is what gets broken, not saved. I want about eight focused questions, no generic biography stuff. Specifically: one pressing why the dichotomy paradox is usually misread as infinite divisibility when he thinks it's about endpoint topology and whether a line can have a last point; a folow-up keyed to him saying it's about dense ordering without atoms. Another on the Achilles paradox—if velocity at an instant is incoherent, does the tortoise still have an advantage, or does the paradox collapse differently?—with a folow-up for his likely answer that it's not about speed but about comparing undefined states. One on whether he's projecting a modern, post-Newtonian notion of instant back onto Zeno, and what Aristotle's Physics actually says about the now; include a follow-up for him citing Physics VI. Another asking if this reading makes Zeno an ally of presentism or just a critic of naive B-theory about time. For each question, build in a follow-up that anticipates his standard reply. Also: if my framing is confused—say, if this interpretation just collapses back into the standard motion-based reading or misuses Aristotle—tell me plainly rather than playing along.
