              Round 1:
                - Facilitator announces: "Round 1: Option A is 1 point. Option B is a 1 in 10 chance to win 20 points."
                - Teams have 1 minute to discuss and choose. They write their choice (A or B) on a card and hold it up.
                - Facilitator records the choices.
                - For teams that chose A: they get 1 point for round 1.
                - For teams that chose B: they come to the rolling station and roll one d10. If it shows 0, they win 20 points. Otherwise, 0.
                - Record the points for round 1 for each team.

              Repeat for rounds 2-6, adjusting the prize and the number of dice accordingly.

            After round 6, total the points for each team.

            The team with the highest total points wins the game and gets to choose the refreshments for the next meeting.

