            Start with open questions:

              - How did you feel during the game? 
              - What was your team's strategy? Did it change? Why?
              - At what round (if any) did you stop choosing Option B? Why?
              - How do you feel about your final score?

            Then, to connect to the pattern:

              - Did anyone feel that in the later rounds, even though the expected value was high, they didn't want to choose B? Why?
              - Did the arithmetic feel like it was forcing you to choose B even when you didn't want to?

            Introduce the concept of expected value (if not already mentioned):

              - In each round, the expected value of Option B was 2 points (because 20 * 0.1 = 2, 200 * 0.01 = 2, etc.), while Option A was 1 point. So by expected value, B was always better.

            Ask:

              - Why then did many of you abandon B in the later rounds?

            Discuss the reasons:

              - The chance of winning was so small that it felt like 0.
              - The guaranteed 1 point per round added up.
              - The prizes were so large that they became abstract and not meaningful? Or conversely, the guaranteed points were more tangible.

            Map to real examples:

              - Lottery: small chance of a large prize, but the expected value is negative (because you pay to play). In our game, you didn't pay to play? But you gave up the guaranteed point.
              - Asteroid detection: small probability of a catastrophe, but the cost of the catastrophe is enormous. So expected value might justify spending on detection.
              - The charitable donation argument: a tiny chance of affecting the very long-term future might have an enormous expected value.

            Discuss the options for responding to such arguments:

              - Cap the payoffs? (But then you might undervalue truly existential risks.)
              - Discount tiny probabilities? (Set a threshold below which we treat as zero. But where to set it?)
              - Refuse to treat the numbers as precise? (Use qualitative judgments.)
              - Bite the bullet and accept the reasoning? (But then we might end up spending all our resources on long shots.)

            Finally, note the limitations of the game:

              - In the game, the probabilities were known and the payoffs were in fungible points. In real life, we often don't know the probabilities, and the payoffs might be incommensurable (like lives saved vs. dollars).

            End by connecting to Pascal's wager and ask if anyone has thoughts on how this relates.

          Potential Pitfalls and How to Handle Them:

            - The expert participant: Before the game, ask them to be an observer or to not reveal the expected value until the debrief.

            - Participants treating it as gambling: Frame it as a learning experience. Emphasize that the points are not real money.

            - A team wins a big prize: Acknowledge their luck and use it to discuss the role of chance. Ask: "If you had known you would win, would you have chosen differently in the other rounds? But you didn't know."

            - No one wins any B prize: Then the always-B teams have 0. We can note that the expected value was high but the actual outcome was 0.

          Confidence:

            I am confident that the design will create the desired tension. The physical rolling of the dice for the long shot will make the small probabilities feel real, and the accumulation of guaranteed points will be tangible. The debrief plan directly addresses the philosophical problem.

            However, the following assumptions might be wrong:

              - That participants will abandon B in the later rounds. If they don't, then the tension might not arise. In that case, we can still discuss why they stuck with it and whether they would do the same with real stakes.

              - That the guaranteed point per round will feel like a real opportunity cost. If participants discount the guaranteed point, they might not feel the tension.

            Watch for:

              - When do teams start defecting from B? (Round 4 or 5?)
              - Groans when a team almost wins (e.g., rolls three 0s and then a non-zero in the fourth die in round 4).
              - Laughter at the absurdity of the large numbers.

            If the activity is not teaching the lesson (e.g., if everyone always chooses B and no one feels uneasy), then in the debrief we can introduce a thought experiment with even larger numbers and smaller probabilities (like 1 in 10^20 chance of 2*10^20 points) and ask if they would still choose B. We can also ask if they would pay $1 for a 1 in 10^20 chance of winning $2*10^20? (Note that the expected value is $2, but the chance is astronomically small.)

