            - Break the group into 4 teams (or 3-5 teams depending on the group size).
            - Set up the rolling station at the front.

          Rules:

            We are playing 6 rounds. In each round, your team will choose one of two options:

              Option A: You get 1 point for sure.
              Option B: You get a chance to win a large prize. The chance of winning starts at 1 in 10 in round 1 and gets smaller each round, but the prize gets larger. If you don't win, you get 0 points for that round.

            The details for Option B in each round:

              Round 1: Prize = 20 points. Chance: 1 in 10. To win, you must roll a 0 on one d10.
              Round 2: Prize = 200 points. Chance: 1 in 100. To win, you must roll two 0s on two d10.
              Round 3: Prize = 2000 points. Chance: 1 in 1000. To win, you must roll three 0s on three d10.
              Round 4: Prize = 20000 points. Chance: 1 in 10000. To win, you must roll four 0s on four d10.
              Round 5: Prize = 200000 points. Chance: 1 in 100000. To win, you must roll five 0s on five d10.
              Round 6: Prize = 2000000 points. Chance: 1 in 1000000. To win, you must roll six 0s on six d10.

