  ### The Long Shot: A Decision Game

  **Objective**: To create a visceral experience of the tension between expected value calculations and intuitive judgment in extreme probability-payoff scenarios, leading to self-discovery of the philosophical dilemma.

  #### Materials Needed
  - **10-sided dice (d10)**: 6 per team (or one shared set). Each die should have faces 0-9.
  - **Scoreboard**: Whiteboard or large paper with team names and round columns.
  - **Markers and paper**: For tracking choices and scores.
  - **Timer**: For round deadlines.
  - **Prizes**: Trivial stakes (e.g., winning team chooses next month’s topic; runner-up picks refreshments). No real money involved.
  - **Team cards**: Pre-printed with team numbers (1–4) for quick identification.

  #### Setup
  - **Group size**: 14 people → Split into **4 teams** (3–4 people each). Teams collaborate on decisions.
  - **Duration**: 6 rounds (60 min total), 45 min debrief.
  - **Location**: Tables arranged so teams can see the scoreboard and rolling station.

  ---

  ### Game Rules
  **Premise**: Each round, teams choose between:  
  - **Option A**: A modest **guaranteed payoff** (1 point).  
  - **Option B**: A **long-shot payoff** with tiny probability but huge points (probability decreases, payoff increases each round).  

  **Probability Mechanics**:  
  - For Option B, teams must roll a specific sequence on d10s:  
    - **Round 1**: Roll one 0 (1/10 chance).  
    - **Round 2**: Roll two 0s (1/100).  
    - **Round 3**: Roll three 0s (1/1,000).  
    - *Continue scaling up to Round 6: six 0s (1/1,000,000)*.  
  - Dice are rolled simultaneously (e.g., for Round 3, roll 3 dice at once). All must show 0 to win.  

  **Payoffs**:  
  | Round | Option A (Guaranteed) | Option B (Long Shot) | Probability of B Winning | Expected Value (B) |  
  |-------|------------------------|----------------------|--------------------------|-------------------|  
  | 1     | 1 point               | 20 points           | 1/10 = 0.1              | 2 points          |  
  | 2     | 1 point               | 200 points          | 1/100 = 0.01            | 2 points          |  
  | 3     | 1 point               | 2,000 points        | 1/1,000 = 0.001         | 2 points          |  
  | 4     | 1 point               | 20,000 points       | 1/10,000 = 0.0001       | 2 points          |  
  | 5     | 1 point               | 200,000 points      | 1/100,000 = 0.00001     | 2 points          |  
  | 6     | 1 point               | 2,000,000 points    | 1/1,000,000 = 0.000001  | 2 points          |  

  **Why this design?**  
  - **EV of B is always double A** (2 > 1), so arithmetic *always* favors B.  
  - Guaranteed points accumulate slowly (max 6 points for always choosing A), while B’s rare wins are astronomical.  
  - Physical dice make tiny probabilities visceral (e.g., groans when a team rolls 0,0,0,1 in Round 4).  

  **How to Play**:  
  1. **Announce round** (e.g., “Round 3: A = 1 point, B = win 2,000 if you roll three 0s”).  
  2. **Teams deliberate** (1 min). Write choice (A/B) on card and hold it up.  
  3. **Resolve choices**:  
     - Teams choosing A: Add 1 point to score.  
     - Teams choosing B: Roll dice at the front. If successful, add points; if not, 0.  
  4. **Update scoreboard** publicly after each round.  
  5. **Repeat** for 6 rounds.  

  **Winning**: Team with the highest total points post-Round 6 wins trivial prize (e.g., picks next topic).  

  ---

  ### Debrief Plan (45 Min)  
  **Goal**: Map game experiences to the philosophical problem without lecturing.  

  1. **Feelings First (10 min)**:  
     - *Ask*: “When did choosing B start feeling absurd? What did it feel like to roll for 1-in-a-million?”  
     - *Map to game*: Highlight Round 4+ (when probabilities drop below "graspable"). Note laughter/groans during rolls.  

  2. **The Arithmetic Bully (10 min)**:  
     - *Reveal*: “B’s *expected value* was always double A’s. Why did many of you abandon B anyway?”  
     - *Options for response*:  
       - **Cap payoffs**: “What if we capped B at 1,000 points? Would you choose it more?” (Cost: Ignores true scale of real-world stakes like human extinction.)  
       - **Discount tiny probabilities**: “Did 1-in-a-million feel like zero? Why?” (Cost: Underestimates black-swan risks.)  
       - **Reject precise numbers**: “Can we trust probabilities this small?” (Cost: Paralysis in decision-making.)  
       - **Bite the bullet**: “If you always chose B, did it pay off?” (Cost: Real-world absurdity, e.g., spending on lottery tickets over food.)  

  3. **Connect to Real Cases (15 min)**:  
     - Lottery tickets → Similar to Round 1 (palatable risk).  
     - Asteroid detection → Round 4 (tiny probability, huge payoff).  
     - Pascal’s wager → Round 6 (infinite stakes).  
     - *Key insight*: “The game had known probabilities/dice. Real life has **uncertainty**—we don’t know the true odds of asteroid impacts or salvation.”  

  4. **Limitations (5 min)**:  
     - The game can’t replicate **real stakes** (points ≠ lives) or **deep uncertainty** (dice are fair; real probabilities are debated).  

  ---

  ### Predictable Challenges & Fixes  
  1. **The Expert Participant**:  
     - *Risk*: Preemptively explains EV, ruining discovery.  
     - *Fix*: Privately ask them to “play along” as a skeptic or observer. Frame game as “behavioral experiment,” not philosophy.  

  2. **Gambling Mentality**:  
     - *Risk*: Teams treat it as a casino night.  
     - *Fix*: Open with: “This isn’t about winning points. It’s about noticing when math clashes with intuition.”  

  3. **A Win Ruins the Lesson**:  
     - *Risk*: A team wins big in Round 5–6, making B seem wise.  
     - *Fix*: Use it! Ask: “Would you make the same choice if points were your life savings? Why did this win feel like luck, not skill?”  

  4. **No One Chooses B**:  
     - *Risk*: Teams avoid B early, missing the tension.  
     - *Fix*: If <50% choose B by Round 3, add a “nudge” (“Scientists say B is mathematically optimal…”).  

  ---

  ### Designer Confidence & Adjustments  
  **Confidence Level**: High (8/10). The design:  
  - Forces confrontation via physical dice (tiny probabilities feel real).  
  - Lets EV silently dominate early rounds (normalizing the logic).  
  - Uses accumulating guaranteed points to create regret (e.g., “I could have had 6 points!”).  

  **Assumptions & Risks**:  
  - **Assumption**: Teams abandon B by Round 4–5 as absurdity mounts.  
    - *Watch for*: If >80% still choose B in Round 6, the tension failed.  
    - *Adjust*: In debrief, escalate to a 1-in-a-billion scenario. Ask: “At what point would you refuse B?”  
  - **Assumption**: Guaranteed points create “opportunity cost” angst.  
    - *Watch for*: Teams dismissing 1 point as trivial.  
    - *Adjust*: Increase A’s payoff (e.g., 5 points) to amplify FOMO.  
  - **Sympathetic Version**:  
    - If players argue “B is *always* rational,” run a **variant** with real stakes: Teams bet on lunch orders. B offers a 1/100 chance to win a $100 meal vs. A’s guaranteed $1 snack. Now, choosing B risks real hunger—highlighting utility limits and risk aversion.  

  **Final Note**: This game *rigs nothing*—EV truly favors B. But it exposes how humans *capitulate to math* while *recoiling at impracticality*. That’s the mugging.  

  ---  
  **Run it, and let the dice do the talking.** By Round 6, when teams balk at rolling for 2 million points, they’ll *feel* the problem in their guts. Then, the debrief names it.
