prompt: |-
  ok so me and my friend just had this exhausting two-hour argument about montaignes cannibals essay and she kept dropping that line everyone repeats — that we call barbarism whatever isnt our own practice — like it was some automatic win for full cultural relativism. she was using it to say we cant criticize the tupinamba ritual at all, but i think montaignes doing something way more targeted and maybe even the opposite. can you act like a professional philosopher of culture who has actually worked through the essay, think carefully and step by step, and first brainstorm the different precise things that slogan could actually claim? i want them laid out as a menu: the trivial bias version, the descriptive anthropology version, the strong normative relativism version, and whatever else hides in there. for each one say whether its actually in the text, whether its defensible, and whether it gets my friend to her conclusion that cross-cultural moral criticism is always off-limits. please also deal with the niche point that montaigne explicitly compares these practices to the far worse violence europeans were inflicting on each other during the wars of religion, because she completely ignored that comparison and i think it breaks some of the readings. lead with your bottom line in the very first sentence — like which reading is actually supported and why her use fails — then give the reasoning with no preamble and dont restate my question back at me. and since i dont have access to a library right now, dont give me a reading list or citations, just work with the ideas.
reasoning: |-
  Okay, the user and their friend had a heated argument about Montaigne's "Of Cannibals" essay. The friend keeps quoting the line about barbarism being whatever isn't our own practice, using it to argue for full cultural relativism where no cross-cultural criticism is possible. The user thinks Montaigne is doing something more targeted, even the opposite. They want me to act as a professional philosopher of culture to dissect that slogan.

  First, I need to recall Montaigne's essay. He discusses the Tupinambá people of Brazil and their ritual cannibalism. The famous line is: "every man calls barbarous anything he is not accustomed to." The friend uses this to say we can't criticize the Tupinambá ritual, but the user disagrees.

  Let me break down the possible interpretations of that slogan. I should create a menu of options: trivial bias, descriptive anthropology, strong normative relativism, and others. For each, I'll assess if it's in the text, if it's defensible, and if it supports the friend's conclusion.

  First, the trivial bias version. This is the idea that people are quick to label unfamiliar things as barbaric. Montaigne definitely says this. It's defensible as a psychological observation, but it doesn't lead to cultural relativism—it just warns against snap judgments.

  Next, descriptive anthropology. This means understanding practices within their cultural context. Montaigne does this by explaining the Tupinambá's reasons for cannibalism: revenge, honor, not mere cruelty. It's in the text and defensible, but it doesn't say all practices are morally equal; it just urges contextual understanding.

  Then, strong normative relativism. This claims morality is culture-bound, so no external criticism is valid. The friend uses this to say we can't criticize the Tupinambá. But is this in Montaigne? He doesn't say that. In fact, he condemns European atrocities, showing he believes in universal moral standards. His critique of the Wars of Religion—massacres, torture—is harsher than his tone toward the Tupinambá. This comparison is key. He writes that European violence is worse because it's for religion or greed, whereas the Tupinambá have a coherent cultural logic. So, Montaigne is making a moral comparison, not suspending judgment.

  Another angle: universalist irony. Montaigne uses the Tupinambá to hold up a mirror to European hypocrisy. By showing "barbarians" as more virtuous in some ways, he criticizes his own society. This is in the text—he praises their natural virtues and contrasts European corruption. It's defensible as satire, but it relies on shared moral grounds, like condemning cruelty and greed.

  Now, assessing the friend's claim. She says the slogan forbids all cross-cultural criticism. But Montaigne criticizes Europeans fiercely. His point is that "barbarism" is misapplied by Europeans who are actually worse. So her conclusion isn't supported. The text allows criticism, especially when practices violate basic humanity, as seen in his outrage at colonial brutality.

  Also, the user mentioned the comparison to Wars of Religion, which the friend ignored. Montaigne explicitly says European cruelty is "worse" than the Tupinambá's. That breaks the relativist reading because he's ranking actions morally. He doesn't relativize torture or mass murder; he condemns them universally.

  So, the bottom line: Montaigne supports a universalist irony reading, not strong relativism. The friend's use fails because she misses his moral comparisons and critiques of Europe. The essay is a call to examine one's own barbarism, not to suspend all judgment.

  I should structure this clearly. Start with the main point upfront, then detail each interpretation with text support, defensibility, and relevance to the friend's claim. Keep it step-by-step, no fluff. Since the user can't access a library, avoid citations and focus on ideas. Make sure to address the Wars of Religion comparison as it's crucial to undermining the relativist view.
answer: |-
  **Bottom Line:** Montaigne uses the "barbarism" slogan primarily for *universalist irony* and *critique of European hypocrisy*, not strong cultural relativism; your friend's conclusion (no cross-cultural criticism possible) is unsupported and directly contradicted by Montaigne's explicit comparison to European religious violence, which reveals his core universalist moral framework.

  **Brainstorming the Slogan's Meanings & Their Validity:**

  1.  **The Trivial Bias Claim:**
      *   **Claim:** Humans exhibit a predictable *psychological bias* to label unfamiliar customs as "barbaric" simply because they are different and unknown, reflecting ignorance or prejudice rather than reasoned judgment.
      *   **In the Text?** **Yes, explicitly.** This is the most literal reading of the line itself. Montaigne spends significant time illustrating European shock at Tupinambá practices solely based on unfamiliarity.
      *   **Defensible?** **Highly defensible.** This is a well-documented psychological and historical phenomenon (ethnocentrism). Montaigne uses it effectively to puncture European arrogance.
      *   **Gets to Friend's Conclusion?** **No.** This is purely descriptive of a cognitive bias. It warns against *hasty, uninformed* judgment based *only* on difference, but it doesn't preclude the possibility of *informed, reasoned* cross-cultural moral judgment. It says "Don't call it barbaric *just because* it's unfamiliar," not "You can *never* call anything barbaric."

  2.  **The Descriptive Anthropology Claim:**
      *   **Claim:** To understand any practice (like Tupinambá warfare/cannibalism), it *must* be understood within its *specific cultural context, motivations, and value system*. Judging it solely by external standards is meaningless.
      *   **In the Text?** **Yes, implicitly and explicitly.** Montaigne meticulously describes the Tupinambá practice: its roots in warfare and revenge, its ritualized nature, the participants' courage, and its function within their social framework (e.g., integrating the enemy's valor). He contrasts this with European misrepresentations.
      *   **Defensible?** **Crucially defensible.** This is foundational to cultural anthropology. Understanding context is necessary for *accurate description* and avoiding gross misinterpretation. It's a prerequisite for any *meaningful* evaluation.
      *   **Gets to Friend's Conclusion?** **No.** This is a methodological principle for *understanding*, not a normative claim about morality. It argues that *before* you judge, you must understand *what* you are judging and *why* it exists for them. It doesn't say that after understanding, criticism is impossible or invalid. It demands rigor in evaluation, not its abolition.

  3.  **The Strong Normative Relativism Claim:**
      *   **Claim:** Moral values are *entirely* determined by, and relative to, specific cultures. There are no trans-cultural moral standards. Therefore, judging another culture's practices by the standards of your own (or any "universal" standard) is fundamentally illegitimate and impossible.
      *   **In the Text?** **No, not supported, and actively undermined.** This is how your friend is interpreting the slogan. However, Montaigne **never** states this. Crucially, **he engages in cross-cultural moral criticism himself**, most damningly against Europeans.
      *   **Defensible?** **Highly contested and philosophically problematic.** Strong relativism struggles with logical consistency (e.g., "Is tolerance an absolute value?"), the possibility of criticizing atrocities like genocide *even within* a culture that might endorse them, and moral progress through intercultural critique. Montaigne doesn't endorse it.
      *   **Gets to Friend's Conclusion?** **Yes, this is her claim.** But crucially, **this claim is NOT Montaigne's position**. He uses the Tupinambá precisely to *criticize* Europe, demonstrating that he *does* believe in trans-cultural moral standards he can apply to *both* societies.

  4.  **The Universalist Irony / Critique of Hypocrisy Claim:**
      *   **Claim:** The slogan exposes the *hypocrisy* and *blindness* of Europeans who label others "barbaric" for practices that are often *less destructive or more principled* than their own widespread, brutal actions. The real "barbarism" is frequently found at home, obscured by custom and self-righteousness. This implies shared, universal standards against cruelty and inhumanity.
      *   **In the Text?** **Yes, overwhelmingly and explicitly.** This is Montaigne's **central purpose**. He doesn't stop at describing Tupinambá practices contextually. He **directly compares them to European practices during the Wars of Religion**:
          *   Tupinambá eat the dead *after* battle as part of a warrior ethos and revenge ritual.
          *   Europeans torture and massacre living fellow Christians *en masse* (often civilians), burn people alive, tear them limb from limb, over abstract religious differences and political power. Montaigne calls this "far worse" (**"under pretense of piety and religion"**), highlighting its scale, treachery, cruelty, and motivation (zealotry, ambition).
      *   **Defensible?** **Highly defensible as satire and moral critique.** Montaigne uses the relativist *slogan* strategically to shock his readers into recognizing their own barbarity. The *comparison itself* relies on a universalist premise: that inflicting extreme suffering and death on a massive scale for base motives is worse than a ritualized practice of revenge warfare within a coherent (if alien) cultural framework. He appeals to shared notions of proportionality, cruelty, and justice.
      *   **Gets to Friend's Conclusion?** **Absolutely not. This directly refutes it.** Montaigne isn't suspending judgment; he's making **fierce cross-cultural moral judgments**, condemning European violence *more harshly* precisely because it violates universal standards *more grievously*. His criticism of Europe depends on the possibility of applying moral standards across cultures.

  **Why Your Friend's Use Fails & The Niche Point Matters:**

  Your friend isolates the slogan ("barbarism = not our practice") and reads it as strong relativism (Claim 3). However, ignoring the **explicit comparison to European religious violence is fatal to this reading**. Montaigne doesn't say "We can't judge cannibalism." He says, effectively:

  1.  *Understand* the Tupinambá practice in its context (Claim 2 - Descriptive).
  2.  Recognize our *bias* in labeling it barbaric just because it's unfamiliar (Claim 1 - Bias).
  3.  Now look at *our own* widespread, systematic torture and massacre motivated by greed and dogma.
  4.  *By any reasonable standard* (including the courage and motives the Tupinambá display within *their* framework), **our actions are objectively more barbaric** (Claim 4 - Universalist Irony/Critique).

  **The comparison is not an aside; it's the essay's core argument.** It proves Montaigne believes in trans-cultural moral yardsticks (e.g., condemning excessive cruelty, torture, killing for ignoble motives). He uses the Tupinambá not to shield them from *all* criticism, but to hold up a mirror to Europe and say, "Your condemnation of *them* is absurd when your own actions are far worse by *any* humane standard." His essay is a call for self-critique grounded in a recognition of shared humanity and universal moral failings, not a declaration that moral judgment across cultures is impossible.
