answer: |-
  Here’s your Q&A prep sheet—casual, typo-tolerant, and battle-tested for that room. I’ve ranked objections by how much they’d derail you, with replies tight enough for a 2-minute clock. Weaknesses flagged upfront.

  ---

  ### **Q&A Prep: Structural PAP Job Talk**  
  *Concession opener:* "Just to stress—I fully grant locked-in patients lack framework-level control. My claim is that *typical* moral responsibility requires retaining structural alternatives, not that all agents have them."  

  ---

  **1. Objection (Compatibilist Heavyweight):**  
  *"Frankfurt already handles this. Black blocks* **all** *relevant alternatives—volitional AND structural. If Jones can’t refuse *now*, how can he ‘become the kind of agent’ who would? That’s just a disguised flicker of freedom."*  
  **Reply:** "Black blocks *token* refusal-options, not Jones’s capacity to *reshape his agency* over time (e.g., via commitment to honesty). Frankfurt cases only manipulate first-order choices, not second-order plasticity. Responsibility hinges on the latter."  
  ☠️ **Weakness:** Requires arguing that framework-shifts are *categorically distinct* from volitions—might feel handwavey.  

  **2. Objection (Libertarian):**  
  *"You’re dodging the real issue! The ‘structural alternative’ is pre-encoded in neural precursors *before* the decision. If Black controls those, your framework-option was never open."*  
  **Reply:** "Neural states don’t equate to *agential structure*. My ‘becoming’ isn’t a micro-causal event—it’s a temporally extended process of self-constitution (e.g., cultivating habits). Black can’t erase that without rewriting Jones’s *entire history*."  
  ☠️ **Weakness:** If the libertarian insists precursors *are* agential, you’ll sound dualist.  

  **3. Objection (Cognitive Scientist):**  
  *"Locked-in patients *do* retain ‘action-space’ via neuroplasticity. If they learn to ‘refuse’ via EEG, doesn’t that *restore* structural alternatives—and thus responsibility?"*  
  **Reply:** "Great point! But I’d argue EEG-refusal is a *new* volitional channel, not framework-level. The *original* structural capacity (e.g., vocal refusal) was destroyed. They’re responsible *now* only if they *rebuilt* agency—which concedes my core claim."  
  ☠️ **Weakness:** If they prove locked-in patients *never* lose framework-control, your PAP collapses.  

  **4. Objection (Compatibilist #2):**  
  *"This feels untestable. How do we know if an agent ‘retained structural alternatives’? Isn’t this just PAP with extra metaphysical baggage?"*  
  **Reply:** "Testability: Look at addiction studies. Relapsed addicts who *chose* to avoid support groups (restructuring their option-space) vs. those coerced. The former show responsibility *despite* identical first-order urges."  
  ☠️ **Weakness:** Relies on contested interpretations of addiction.  

  **5. Objection (Semantic Stickler):**  
  *"Why call this PAP? PAP’s dead. You’re describing ‘meta-agential control’—don’t rehab a corpse."*  
  **Reply:** "Fair! But PAP’s intuition—*could I have shaped my will?*—is what survives Frankfurt. Naming it ‘Structural PAP’ hooks into the literature while flagging the shift."  
  ☠️ **Weakness:** Pedants will mutter about misleading branding.  

  **6. Objection (Action Theorist):**  
  *"Framework changes aren’t ‘choices.’ They’re gradual drifts. If no crisp ‘architechtinic moment,’ how does responsibility attach?"*  
  **Reply:** "Some are decisive (e.g., joining the military). Others accumulate—but responsibility applies to the *capacity* to steer the drift, not a single choice."  
  ☠️ **Weakness:** Blurs control’s location.  

  **7. Objection (Frankfurt Purist):**  
  *"What if Black *also* blocks framework-shifts? If Jones tries to ‘become honest,’ Black activates a framework-nudge. Still responsible?"*  
  **Reply:** "Then Black *is* manipulating structure, and Jones isn’t responsible! But classic Frankfurt cases don’t do this—they’re about *situational* coercion, not total agential rewiring."  
  ☠️ **Weakness:** Opens door to "global Black" counterexamples.  

  ---

  ### **☢️ NUCLEAR OBJECTION (PRAY NOBODY ASKS):**  
  *"Doesn’t this require an infinite regress? If moral responsibility needs a prior structural choice to shape my framework, what shaped THAT framework? Am I responsible only if I self-created from nothing?"*  

  **Reply:** "Shit. *[deep breath]* No—I’d argue we have a *primitive framework-capacity* (not an infinite chain). Like Aristotle’s ‘archē,’ it’s the starting point: the ability to *begin* restructuring. We’re responsible when we *use* that capacity, not for having it."  
  **If pushed:** "Okay, fine—I have to admit this *does* imply a foundational layer of agency that isn’t itself chosen. But that’s true of any responsibility theory! Even compatibilists need *some* unchosen capacity for reason-responsiveness."  

  ---

  **Final tip:** When the neural-state libertarian objects, lean into "temporally extended agency." When the cognitive scientist speaks, cite their locked-in work respectfully. For compatibilists, stress that Structural PAP *preserves* their intuitions about reasons-responsiveness—just at a meta-level.  
    
  Break a leg. They won’t know what hit ’em.
