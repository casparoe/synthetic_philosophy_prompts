prompt: |-
  Write the desiderata an adequate conceptual framing of the AI alignment problem must satisfy — not a literature review, but the specification itself. The framing must preserve distinctions between misspecified-optimization failures and genuine value divergence, between single-agent errors and emergent multi-agent coordination breakdowns, and between technical control problems and institutional embedding failures; for each desideratum, state the motivating case or conceptual pressure behind it, mark which are non-negotiable and which reflect camp-specific preferences, and identify any subset that looks jointly unsatisfiable. Then briefly score the standard “specification gaming” framing, the “value loading” framing, and a framing that treats alignment as institutional design rather than technical control, keeping the weight on the criteria rather than the scorecard. Lead with your bottom line in the first sentence, then the reasoning, with no preamble and no restating of the question.
