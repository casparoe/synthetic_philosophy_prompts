answer: |-
  ### Exam Question  
  **Evaluate Hume's argument in "On Suicide" that self-destruction does not violate duties to society. Does his reasoning implicitly treat individuals as *fungible* (interchangeable) social units? If so, does this conflict with his sentimentalist moral theory, which emphasizes personal affections and particular relationships? Finally, consider an "exit-license" model where society permits suicide only when an individual’s net social contribution becomes negative. Does Hume’s argument support, undermine, or remain orthogonal to this model? Ground your analysis in Hume’s text and philosophical tensions.**  

  ---

  ### Model Answer (632 words)  
  Hume’s "On Suicide" famously challenges religious and social prohibitions against self-destruction by arguing suicide violates no duties to God, self, or society. His case for the latter—that suicide breaches no social obligations—rests on a utilitarian-style calculus: individuals may permissibly end their lives when their continued existence burdens society more than it benefits others. Hume contends that removing oneself during profound suffering or incapacity is analogous to retiring a "useless" part from a machine, thereby freeing resources for others. This framing implicitly treats humans as *fungible* social units—interchangeable components valued purely by net utility—rather than unique beings embedded in irreplaceable relational webs.  

  This fungibility assumption clashes with Hume’s sentimentalist ethics. In the *Treatise* and *Enquiry*, he grounds morality in passions and context-specific sympathies, stressing that virtues like benevolence arise from *particular* attachments (e.g., family bonds). We judge a person’s character through emotional responses to their concrete relationships, not abstract calculations. Yet Hume’s suicide essay reduces social duty to impersonal arithmetic: if your death yields a net gain for society, you are "replaceable," and suicide is neutral or even laudable. This ignores how sentimentalism values individuals *as particular persons*—a grieving parent isn’t "fungible" to their child. The tension here reveals a paradox: Hume weaponizes fungibility to refute social-duty objections but sidelines his core moral theory, which would recoil at quantifying human worth.  

  Enter the "exit-license" model: society permits suicide only when an individual’s net contribution is negative (e.g., through illness, poverty, or dependency). Superficially, this aligns with Hume’s cost-benefit rationale—it echoes his claim that ending a burdensome life "benefits society." However, Hume’s reasoning *undermines* this model in two ways. First, his essay prioritizes *individual autonomy* over social accounting. He insists the decision to die rests on personal judgment of unbearable suffering, not external verdicts about one’s "net value." For Hume, suicide is justified when life becomes intolerable *to the sufferer*, even if others deem them "useful." The exit-license model, by outsourcing approval to society, contradicts Hume’s emphasis on first-person authority.  

  Second, the model exacerbates the fungibility problem Hume’s sentimentalism resists. Institutionalizing net-contribution assessments formalizes the reduction of humans to interchangeable economic units. Hume’s broader ethics, however, sees value in non-utilitarian virtues like loyalty and friendship—sentiments that defy fungibility. Consider a war veteran with PTSD: society might calculate their "negative" economic contribution, but sentimentalism would recognize their irreplaceable role in a community’s shared history. The exit-license framework, by reducing this to a ledger, embodies the cold calculus Hume’s moral theory elsewhere condemns.  

  Hume’s argument thus remains *orthogonal* to the model’s core mechanism. His essay uses fungibility tactically to dismantle objections but roots permissibility in private despair, not social permission. He never suggests society should *enforce* utility thresholds; his focus is emancipating individuals from guilt, not creating bureaucratic gatekeeping. Ultimately, Hume’s reasoning exposes the model’s moral danger: it entrenches the very dehumanization his sentimentalist framework rejects.  

