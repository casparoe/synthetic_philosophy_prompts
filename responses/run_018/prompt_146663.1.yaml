  First, I need to understand the user's concerns. They want a cohesive teaching sequence that clearly differentiates testimonial and hermeneutical injustice through one strong example. The challenge is making sure both concepts are visible without conflating them. The students are likely to confuse epistemic injustice with simple bias or poor listening, so the workshop must address that early on.

  The key is to start with credibility as a structural issue, not just personal. Public health students might focus on individual clinician bias, but epistemic injustice is about systemic credibility deficits. I should begin with an accessible concept—like how credibility is socially assigned—using a relatable example, maybe from their field. 

  The Black maternal health case is powerful but needs careful handling. To avoid muddying the two injustices, the example must show two distinct moments: first, the testimonial injustice when clinicians dismiss the patient's testimony (credibility deficit), and second, the hermeneutical injustice where the patient lacks the vocabulary to describe their structural stress, leading to misinterpretation (conceptual gap). 

  For the sequence: start with an interactive credibility exercise to hook them. Then introduce epistemic injustice broadly before diving into the case study. Break down the case into two clear phases: testimonial harm when the patient speaks and isn't believed, and hermeneutical harm when the system lacks the framework to understand structural weathering. Use pauses for reflection and discussion to reinforce each part.

  Common misconceptions: students might think this is just about bias or communication skills. Address this after introducing testimonial injustice by contrasting systemic credibility deficits with individual bias. For hermeneutical injustice, emphasize the gap in collective understanding, not just the patient's word choice.

  The check question at the end should target hermeneutical injustice specifically. Ask how the interpretive gap affects future patients, probing their grasp of the structural conceptual void.

  Drop the virtue epistemology framing—it's not essential for this audience. Focus on structural harm and knowledge gaps in public health contexts. Avoid jargon; use terms like "credibility assignment" instead of "testimonial sensibility."

  Timing is tight: 90 minutes. Allocate time for intro, credibility exercise, case study breakdown, group work, and wrap-up. Keep lectures short, maximize interaction. The goal is clarity on both injustices through one case, ensuring students leave seeing the system, not just individuals.
answer: |-
  Here’s a streamlined 90-minute workshop plan focused on **structural credibility gaps** and **interpretive injustice**, using Black maternal health as the anchor case. The sequence avoids jargon-first teaching and preempts common misconceptions.

  **Core Example:**  
  *Black patients describe chronic stress symptoms (e.g., "My body feels worn down," "I can’t catch a break") as causes of pregnancy complications. Clinicians document this as "poor self-care," "non-compliance," or "exaggeration."*  

  **Key Elements to Highlight:**  
  - Testimonial harm: Dismissing firsthand knowledge despite patient expertise in their own body  
  - Hermeneutical harm: Structural stressors (racism, economic precarity) lack clinical terminology, forcing patients to use inadequate language that gets misread  

  ---

  ### **Teaching Sequence (90 Min Total)**  
  **PART 1: SETUP — CREDIBILITY IS STRUCTURAL (20 Min)**  
  - **Hook (5 min):** *Quick exercise* — "You’re a clinician. A patient says, *‘I’m so stressed my bones ache.’* What’s your reaction?" Discuss variations if patient is:  
    - A single mother working 3 jobs  
    - A CEO  
    *(Goal: Reveal subconscious credibility assignments)*  
  - **Frame (10 min):** Introduce "credibility economies" (no philosophy terms):  
    > *"We assign credibility based on social scripts — not just facts. Systems decide who’s ‘believable.’ What happens when a whole group’s knowledge is routinely discounted?"*  
  - **Myth-Buster Slide (5 min):**  
    > ❌ *"This is just bad listeners / individual bias"*  
    > ✅ *"This is systemic: patterns where entire types of knowledge get silenced"*  

  **PART 2: CASE DEEP DIVE — TWO HARMS, ONE STORY (40 Min)**  
  - **Case Narrative (10 min):** Tell the story of "Tanya" (composite based on maternal health research):  
    - *Repeatedly describes relentless stress, physical exhaustion, fear for safety*  
    - *Clinician notes: "Patient blames ‘stress’ for missed appointments. Unrealistic expectations."*  
    - *Outcome: Severe preeclampsia dismissed until emergency*  
  - **Group Work (15 min):** *"Where did Tanya’s knowledge get blocked? What made clinicians misinterpret her?"*  
    - **Guide them to identify TWO layers:**  
      > 🗣️ **Testimonial Harm:** *Her words were heard but not believed* (e.g., "blames stress" = coded as excuse)  
      > 🔍 **Hermeneutical Harm:** *No shared concept for "weathering"* → Her language ("worn down") gets filtered through individual-behavior frameworks ("non-compliant")  
  - **Debrief (15 min):** Contrast the harms visually:  
    > | **Testimonial Injustice** | **Hermeneutical Injustice** |  
    > |---------------------------|------------------------------|  
    > | "You’re not credible"      | "Your reality has no name here" |  
    > | *Ignores the speaker*      | *Ignores the system*         |  

  **PART 3: WHY HERMENEUTICAL INJUSTICE IS THE HIDDEN ENGINE (20 Min)**  
  - **Critical Turn (5 min):** *"What if Tanya used the PERFECT words? Would she be believed?"*  
    - *Likely not: The clinical framework lacks "structural weathering" as a valid diagnosis.*  
  - **Public Health Lens (10 min):** Discuss:  
    - How data collection (e.g., reducing symptoms to "compliance") reinforces hermeneutical gaps  
    - When "patient-centered care" fails without structural concepts  
  - **Check Question (5 min) — PROVES HERMENEUTICAL UNDERSTANDING:**  
    > *"If a new patient says, ‘I feel like the system is grinding me down,’ but clinicians reinterpret this as depression, is this mainly testimonial injustice? Why/why not?"*  
    > ✅ **Target insight:** *Hermeneutical! The system lacks tools to interpret "grinding down" as structural harm → defaults to individual-psychological framing.*  

  **PART 4: ACTION TAKEAWAYS (10 Min)**  
  - **Reframe Solutions:**  
    - Testimonial: Amplify credibility (e.g., doulas as witnesses)  
    - **Hermeneutical:** Create new categories (e.g., "weathering" in medical coding, intake forms asking about structural stress)  
  - **Closing:** *"You’re not just fighting bias; you’re fighting gaps in how reality gets defined."*  

  ---

  ### **What to Drop & Why**  
  - **Skip virtue epistemology** (no "testimonial justice as a virtue"). Public health students need **structural/systemic framing**, not ethical self-improvement.  
  - **Avoid "oppression" as an opener.** Start with credibility assignment — it’s more tangible.  
  - **Don’t split testimonial/hermeneutical into separate modules.** Use the case’s natural progression (speech → interpretation) to show their interplay.  

  ### **Preempted Misconceptions**  
  - **"It’s just bias"**: Killed in Part 1 by showing *systemic credibility patterns*.  
  - **"Listening harder fixes this"**: Debunked in Part 3 — without hermeneutical resources, listening fails.  
  - **"Hermeneutical = fancy word for ‘miscommunication’"**: Neutralized by showing how *power* shapes which concepts exist (e.g., "non-compliance" is legitimated; "weathering" isn’t).  

  **Key Anchor:** The same case shows both harms:  
  - **Testimonial**: Patient speaks → credibility deficit → dismissal  
  - **Hermeneutical**: Patient’s experience → no shared language → distortion  
  The clinical record becomes proof of both injustices.  

  This sequence makes the *system* the villain — fitting for future public health leaders.
