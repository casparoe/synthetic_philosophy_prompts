answer: |-
  The frame problem's core lies in the incompatibility between classical logic's monotonic nature—where adding truths never invalidates prior conclusions—and the non-monotonic reality of reasoning about change, where most facts persist by default unless explicitly affected. Frame axioms attempt brute-force enumeration of non-changes, but this leads to combinatorial explosion and impracticality. Successor-state axioms appear more elegant by defining change conditions and implying persistence otherwise, yet they merely encode the default persistence assumption directly into the world model's ontology. This doesn't resolve the underlying difficulty: it presupposes a complete, closed-world enumeration of *all* possible change causes. Without an implicit relevance filter determining which properties *could* be affected by an action, the system remains vulnerable. Representing persistence requires either an infinite set of frame axioms or a universal "nothing else changes" closure rule; the former is intractable, while the latter risks inconsistency if unanticipated interactions occur or is computationally infeasible to verify exhaustively.

  This demonstrates that the frame problem is not fundamentally a deficit in *representing* world knowledge, but a symptom of the inherent intractability of exhaustive causal theories under bounded resources. Reasoning efficiently demands inferring persistence by default, but guaranteeing this inference is safe requires knowing all possible causal dependencies—a task demanding unbounded computation and complete causal knowledge. Any practical system must therefore rely on heuristic relevance filters or incomplete models, making the frame problem inescapable. It reveals that tractable reasoning under uncertainty necessitates approximating causality and relevance, rather than attempting exhaustive enumeration, highlighting a fundamental limitation in automating resource-bounded common-sense reasoning about dynamic worlds.
