  The frame problem fundamentally concerns how to efficiently manage what doesn't change during actions. Classical logic uses monotonic representations where adding new information can't retract previous truths, but real-world reasoning requires non-monotonic inference where we make default assumptions about persistence. Frame axioms attempt to explicitly list what doesn't change, but this becomes impractical with infinite properties. Successor-state axioms seem more elegant by defining what does change and implying everything else persists, but this still requires a domain closure assumption that's computationally expensive to verify.

