answer: |-
  ## OFFICE OF DUAL-FRAMEWORK INTERSPECIES GOVERNANCE (ODFIG)
  **Frequently Asked Questions (Version 7.3.1a, Compliance Cycle FY-38)**

  **1. What is ODFIG's primary statutory mandate?**
  ODFIG is tasked with the unified administration and enforcement of the Interspecies Ethical Harmonization Act (IEHA). This requires the simultaneous application of two distinct operational frameworks: (a) The Aggregate Welfare Optimization Protocol (AWOP), governing non-human biological entities, which mandates maximizing net positive experiential states across populations, allowing necessary trade-offs to achieve optimal outcomes; and (b) The Inviolable Status Protection Protocol (ISPP), governing human persons, which establishes absolute prohibitions against specific actions (e.g., uncompensated physical infringement, unauthorized consciousness modification) regardless of potential benefits accrued elsewhere. ODFIG ensures all relevant entities are correctly categorized and managed under the appropriate framework without overlap or operational drift.

  **2. How does ODFIG determine if a non-human entity falls under AWOP or ISPP?**
  Classification adheres strictly to the Biological Status Taxonomy (BST), Annex Delta. Standard vertebrate and invertebrate species are pre-classified under AWOP. Entities exhibiting novel or ambiguous characteristics undergo Tiered Assessment. Tier-1 evaluates baseline sentience indicators (nociception, learned avoidance). Tier-2 assesses complex cognitive markers (tool use, deferred gratification, symbolic communication). Entities exceeding Tier-2 thresholds, or those incorporating anomalous elements (e.g., significant human-derived neural substrates, non-biological consciousness platforms), are escalated to the Tier-3 Marginal Agency Assessment Protocol (T3-MAAP).

  **3. What is the Tier-3 Marginal Agency Assessment Protocol (T3-MAAP)?**
  T3-MAAP is a classified diagnostic sequence employing standardized neuro-behavioral assays approved under Directive ODFIG/Neuro/387. It quantifies agency-relevant capacities: recursive intention modeling, counterfactual reasoning, and second-order preference articulation. Entities scoring above the established Agency Recognition Threshold (ART) on all primary assays trigger provisional ISPP coverage pending final review by the Marginal Status Review Board (MSRB). Scoring below ART confirms AWOP applicability. T3-MAAP assessments require ODFIG-Certified Neuro-Ethical Technicians and occur at designated Assessment Centers (Schedule available on ODFIG Portals 4 and 7).

  **4. How are resource allocations decided for non-human populations under AWOP?**
  AWOP utilizes the Calculated Welfare Index (CWI), a dynamic metric incorporating intensity and duration of negative/positive experiential states, population density, resource scarcity projections, and cross-species impact coefficients. Actions minimizing aggregate negative CWI (e.g., controlled habitat reduction, selective population management) are authorized if they demonstrably yield a net CWI increase within the approved calculation horizon (typically 5-10 Generational Equivalents). Form ODFIG-1147b ("AWOP Trade-off Justification Matrix") must document all variables and projections. Petitions for horizon extension require Regional Director approval.

  **5. Under what circumstances can ISPP protections be overridden for human persons?**
  ISPP protections are non-negotiable and non-aggregable. No projected benefit, regardless of magnitude or population scope (including non-human entities under AWOP), justifies infringement upon the core ISPP prohibitions for a single protected human person. Compensated transfers of specific rights are permissible only via Form ODFIG-5521 ("Voluntary Right Waiver & Compensation Agreement"), subject to stringent cognitive capacity verification and mandatory 90-day cooling-off periods. Unauthorized infringement invokes Penalty Schedule Gamma.

  **6. How does ODFIG handle situations where AWOP actions impacting non-humans indirectly affect humans?**
  Indirect effects on humans fall outside ISPP’s direct infringement prohibitions unless they constitute a *foreseeable and substantial* violation of a core protected status (e.g., deliberate contamination of a human water source during pest management). General emotional distress, economic impact, or lifestyle alteration resulting from AWOP implementation (e.g., localized culling programs reducing recreational birdwatching opportunities) are categorized as Non-Core Impacts and do not constitute ISPP violations. Grievances may be filed via Form ODFIG-2099 ("Non-Core Impact Mitigation Request").

  **7. Can entities transitioning *during* T3-MAAP assessment be managed under both frameworks?**
  No. Dual-framework application is strictly prohibited due to operational incompatibility. An entity undergoing T3-MAAP is temporarily held in Pre-Assessment Status (PAS) under minimal welfare safeguards (Annex Theta: PAS Standards). Management actions during PAS are restricted to essential sustenance and non-invasive observation. Once T3-MAAP concludes, the entity is immediately transferred to either AWOP management (standard facilities) or ISPP protection (designated High-Agency Holding). Retroactive application of AWOP actions post-ISPP determination constitutes a Category 5 Infraction.

  **8. What specific challenges arise with experimentally enhanced corvids or chimeric organisms?**
  These entities frequently present Marginal Status Indicators (MSIs), triggering mandatory T3-MAAP. Key challenges involve:
  *   **Corvids (Enhanced Working Memory):** Assessment focuses on whether enhanced memory enables complex future-state modeling and preference persistence exceeding ART baseline. Does caching behavior demonstrate multi-variable optimization for hypothetical future scarcity, or mere instinctive hoarding? Protocol ODFIG/Neuro/387-C addresses avian-specific assay calibration.
  *   **Chimeras (Human Neural Tissue):** The critical threshold is functional integration. Does the human-derived tissue contribute dominantly to circuits generating the agency capacities measured in T3-MAAP, or is its role subsidiary (e.g., metabolic support, non-integrated graft)? Biopsy for neural mapping pre-T3-MAAP requires Special Ethics Panel waiver (Form ODFIG-7766).
  Delays in T3-MAAP scheduling due to specialized technician availability are noted; entities in PAS exceeding statutory holding limits qualify for expedited review (Request Form ODFIG-4410).

  **9. What happens if an entity under AWOP management subsequently develops traits suggesting it may meet ART?**
  Any ODFIG field agent, licensed veterinarian, or accredited researcher observing potential MSIs in an AWOP-managed entity must file an Immediate Status Review Request (ISRR, Form ODFIG-8801) with the relevant Sector Office. The entity is placed in PAS within 72 hours pending initiation of T3-MAAP. Failure to report suspected MSIs is a Category 3 Infraction. AWOP management actions cease upon PAS designation.

  **10. How does ODFIG reconcile AWOP's permission of significant suffering for aggregate gain with ISPP's absolute prohibition on harming humans for any gain?**
  ODFIG administers the frameworks as defined by statute and regulatory code, based on the distinct ontological categories established therein. The capacity for inviolable personhood, as empirically detectable via protocols like T3-MAAP, triggers ISPP. Its absence confirms AWOP applicability. Reconciliation is procedural, not substantive: ODFIG ensures correct classification and framework application. Questions regarding the foundational categorization criteria should be directed to the Congressional Office of Philosophical Oversight (COPO), as they fall outside ODFIG's operational purview. Our mandate is consistent and impartial application, not framework justification.

  **//END FAQ//**
