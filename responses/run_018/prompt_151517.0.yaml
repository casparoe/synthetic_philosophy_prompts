prompt: |-
  I am preparing a single fifty-minute seminar for philosophy undergraduates who have completed the Groundwork but have not yet studied the Doctrine of Virtue or Kant's reply to Benjamin Constant. I want to teach Kant's absolute prohibition on lying, using the murderer-at-the-door scenario not as a simple intuition pump but as a stress-test for the Formula of Humanity. Do not explain the doctrine to me; instead, design the pedagogical sequence.

  Open with the carrying example you would use—either a refined version of the murderer case or a substitute—and in the same opening sentence state the first conceptual dependency that must be in place before it is introduced, explaining why that dependency prevents students from reducing Kant's position to mere stubbornness. Next, lay out the remaining dependency order concisely: which idea about rational agency or perfect duty must follow the example so that the prohibition on lying is seen as structural rather than dogmatic? Then map the misconceptions students will form in sequence—anticipating at least that mental reservation is just a hidden permission to lie, that Kant values rules over human lives, and that Constant's critique makes the view obsolete—and specify the exact point in the lesson where each should be intercepted. Provide one diagnostic question that distinguishes understanding lying as a corruption of rational nature from viewing it merely as an imprudent strategy. Explicitly identify one related topic, such as the Doctrine of Right's treatment of false promises or the casuistry on equivocation, that you will deliberately exclude and justify that omission for this audience. Keep the entire response under 300 words, present the dependency order and misconception map as brief bullet points rather than prose, and do not include any reading list or citations.
reasoning: |-
  Okay, the user wants me to design a pedagogical sequence for teaching Kant's absolute prohibition on lying to philosophy undergraduates. They've studied the Groundwork but not yet the Doctrine of Virtue or Kant's reply to Benjamin Constant. The focus should be on using the murderer-at-the-door scenario to stress-test the Formula of Humanity, not just as an intuition pump.

  I need to open with a carrying example that establishes a key conceptual dependency upfront. The opening sentence must include both the example and explain why this dependency prevents students from reducing Kant's position to mere stubbornness. I'll use a refined murderer case: "When Constant's murderer asks if their target is home, we must recall that rational nature exists as an end in itself, preventing misreading Kant's truth-telling duty as rule-fetishism."

  For the dependency order, I'll structure it as bullet points showing what must follow the initial example:
  - Rational nature as end-in-itself → establishes why deception violates humanity
  - Perfect vs imperfect duties → shows why lying can't be excused by consequences
  - Maxim universalization test → demonstrates structural contradiction in lying

  Now for the misconception map - I need to anticipate and intercept three common misunderstandings:
  1. That mental reservation is just hidden permission to lie → intercept when explaining how deception always instrumentalizes
  2. That Kant values rules over lives → intercept during perfect duty discussion by emphasizing humanity's absolute worth
  3. That Constant's critique makes Kant obsolete → intercept while analyzing the universalization test's structural focus

  I'll include one diagnostic question: "Does lying primarily fail because it creates social distrust (misconception) or because it manipulates another's rational agency (correct understanding)?"

  For exclusion, I'll deliberately omit the Doctrine of Right's treatment of false promises because it introduces political/legal dimensions that distract from the core ethical focus on rational agency. This keeps the seminar tightly focused for this audience.

  The entire response must stay under 300 words, use bullet points for dependencies and misconceptions, and avoid citations or reading lists. I'll keep the language concise while ensuring all key pedagogical elements are covered.
answer: |-
  **Opening Sentence:** "Before examining whether you may lie to Constant's murderer at your door asking if their target is inside, recall Kant's core tenet that *rational nature exists as an end in itself*; this dependency prevents reducing his prohibition to mere rule-stubbornness by grounding duty in the inviolable value of agency itself."

  **Dependency Order (Post-Opening):**
  *   **→ Rational nature as end-in-itself:** Lying inherently instrumentalizes/degrades another's rational agency.
  *   **→ Perfect vs. imperfect duties:** Truthfulness is a perfect duty (no exceptions based on inclination/consequence).
  *   **→ Universalization test (FH focus):** Lying as a universal maxim destroys the very condition for communication/rational trust.

  **Misconception Map (Interception Points):**
  1.  **Mental reservation = hidden permission:** Intercept *immediately* when introducing "truthfulness" → Explain deception *itself* instrumentalizes, regardless of verbal trickery.
  2.  **Values rules over lives:** Intercept during **perfect duty** discussion → Emphasize Kant values *humanity* (rational agency) absolutely; consequences for mere "life" don't override this.
  3.  **Constant makes Kant obsolete:** Intercept during **universalization analysis** → Counter that Constant focuses on *harmful outcomes*, missing Kant's point about *corrupting the condition of all rightful interaction*.

  **Diagnostic Question:** "Does lying primarily violate duty because it risks punishment/erodes trust (misconception), or because it uses another's reason merely as a tool (correct FH understanding)?"

  **Excluded Topic:** The *Doctrine of Right*'s treatment of false promises. **Justification:** Introducing the distinct legal/political framework of external right obscures the core ethical argument about internal maxims and rational agency central to the *Groundwork/FH* focus of this seminar.
