answer: |-
  Your diagnosis is astute: the material-constitution debate *is* stalled because it conflates distinct inquiries under a single metaphysical heading. The stalemate arises not from a lack of rigor, but because participants are answering different questions while using the same vocabulary. Here’s a concrete breakdown:

  ### 1. **The Core Misalignment: Three Questions in Disguise**  
     - **Semantic/Explanatory Question** (What do artifact-terms *track*?):  
       Pluralists (e.g., Fine, Baker) treat "statue" as referring to an entity defined by *functional or historical properties* (e.g., "Goliath’s form"). Their arguments rely on modal differences: *"The statue, but not the clay, would cease to exist if flattened."* This is a claim about how language carves reality based on human intentions.  
       - *What’s really disputed*: Whether "statue" is a sortal term implying persistence conditions tied to *artistic function* vs. "clay" as a *material sortal*.  

     - **Aesthetic-Practical Question** (What do conservators *preserve*?):  
       When conservators restore a Rodin by replacing cracked bronze, they preserve *art-historical continuity*—not atomic substrate. Their practice treats identity as a narrative: *"The statue persists if its artistic ‘biography’ (origin, context, repair history) remains intact."* This aligns with monism (e.g., Thomson) but isn't driven by metaphysics; it’s about *cultural value*.  
       - *Hidden empirical insight*: Conservation ethics (e.g., Venice Charter) prioritize "authenticity of substance" *only when feasible*. Digital twins (e.g., scanned/reprinted Palmyra Arch) prove artistic identity can survive material discontinuity—directly challenging the eliminativist’s "only particles matter" stance.  

     - **Metaphysical Question** (Can co-located objects have different essences?):  
       Eliminativists (e.g., Merricks) reject co-location as ontologically profligate. But their argument hinges on *parsimony intuitions*, not empirical data: *"Why multiply objects when particles suffice?"* Meanwhile, pluralists retort with causal overdetermination puzzles (e.g., *"The statue’s fall caused damage, but the clay’s fall didn’t?"*).  
       - *The real conflict*: Competing criteria for "objecthood." Eliminativists demand *causal uniqueness*; pluralists accept *explanatory redundancy* for pragmatic reasons.  

  ### 2. **Is This Substantive, Verbal, or Mismatched?**  
     - **Primarily mismatched inquiries**, with verbal disagreements amplifying confusion:  
       - When a pluralist says "the statue survives restoration," they mean *the functional artifact* persists under a *sortal-dependent persistence condition*.  
       - When an eliminativist says "only the clay exists," they mean no *distinct entity* satisfies their *sparse ontology*.  
       - When a conservator says "this *is* the original statue," they assert *cultural continuity*, not metaphysical identity.  
       The word "object" is a *homonym* here: metaphysical entity (eliminativist) vs. cultural unit (conservator) vs. functionally individuated whole (pluralist).  

     - **Empirical/formal blind spot**: How artifact individuation *actually works* in human practice. Psychological studies (e.g., Bloom, Kelemen) show we assign artifact identity based on design history, not material continuity. A 3D-printed replica of Michelangelo’s *David* from fresh marble isn’t "David" because it lacks the *causal lineage*—not because atoms differ. Yet metaphysics rarely engages this.  

  ### 3. **Digital Reproduction and Conservation: Game Changers, Not Noise**  
     These practices expose the debate’s unexamined premise: that artistic identity *requires* material continuity.  
     - **Digital twins** (e.g., reassembled Buddhas of Bamiyan via 3D scans) prove functional/form properties can be replicated while *severed* from original matter. This undermines both:  
       - *Monist constitution* (no shared matter over time),  
       - *Eliminativism* (if the replica is "artistically identical," particles aren’t primary).  
     - **Conservation ethics** (e.g., replacing 30% of a ship’s timbers) reveal that "preservation" is about *maintaining narrative coherence*, not substrate.  
     - *Effect on the debate*: Forces a split between "material persistence" and "artistic persistence." The latter depends on socially embedded practices—something metaphysics ignores at its peril.  

  ### 4. **Pathways to Progress**  
  Your suggestions are spot-on; I’d prioritize:  
     - **Formalize dual persistence conditions**: Distinguish:  
       - *Material persistence*: Continuous spacetime path of particles (governed by mereology).  
       - *Artifactual persistence*: Causal-historical chain of form/function (governed by intentions + social practices).  
       This reframes the debate: pluralists capture artifact conditions; eliminativists win on material ontology; monists bridge them *contextually*.  

     - **Disentangle metaphysics from preservation ethics**:  
       Conservators don’t need co-located entities; they need criteria for *cultural authenticity*. A "replica ethics" framework (e.g., Dutton) can handle this without invoking constitution.  

     - **Confront bedrock parsimony intuitions**:  
       Acknowledge that eliminativism’s appeal isn’t empirical—it’s aesthetic (desire for "clean" ontology). Progress here requires metaontological clarity: *Why* is parsimony virtuous here? Does it explain conservation practices? (Spoiler: No.)  

  ### What Could *Actually* Move the Debate?  
  - **Empirical work on artifact cognition**: If humans individuate statues by historical lineage (not matter), pluralism isn’t "metaphysically extravagant"—it’s *descriptively accurate*.  
  - **Case studies from digital/physical hybrids**: Analyze how entities like *The Next Rembrandt* (AI-generated "new Rembrandt") challenge modal profiles. Does "originality" require physical instantiation?  
  - **Formalize "narrative identity"**: Use tools from dynamic mereology to model conservation as *identity-preserving transformations under constraints* (e.g., "≤20% material replacement").  

  **In short**: The debate stalls because it answers "How many objects are here?" without agreeing on what "object" means, what counts as "persistence," or why it matters. Genuine progress requires *disaggregating* the questions, then rebuilding with insights from practice. The irony? Conservators and digital artists have already moved beyond metaphysics—philosophers just haven’t noticed. Your hypothesis is correct: the ground *has* shifted.
