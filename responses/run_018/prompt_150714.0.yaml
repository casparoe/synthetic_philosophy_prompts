answer: |-
  This is an exceptionally sharp formulation of a deep problem at the intersection of metaethics, philosophy of language, and translation. You're absolutely right that this is a specific *kind* of Quinean underdetermination applied to normative language. Here's the breakdown:

  1.  **The Core Problem:** You've perfectly described the application of **Quine's Indeterminacy of Translation** to **normative/ethical vocabulary**. The two manuals are empirically equivalent but ontologically/metaphysically incompatible regarding the *status* of the normativity expressed.

  2.  **Is There a Specific Name?**
      *   **Not Universally Standardized:** There isn't a single, universally agreed-upon *term of art* solely for this specific normative case like "gavagai" is for the rabbit/undetached rabbit part case.
      *   **Common Descriptions:** It's most often described using phrases like:
          *   **Normative Indeterminacy of Translation** (This is probably the most precise and direct label for the phenomenon you describe).
          *   **Metaethical Underdetermination by Behavior/Evidence** (Highlights the metaethical consequences).
          *   **Indeterminacy of Moral Ontology in Translation** (Focuses on the ontological commitment aspect).
          *   **The Problem of Normative Equivalence in Radical Translation** (Places it firmly in the Quinean context).
      *   **Related Concepts:** It's deeply connected to:
          *   **J.L. Mackie's "Argument from Relativity" (or "Argument from Queerness"):** Mackie argued that the *observed variation* in moral codes across cultures is best explained by the *absence* of objective moral facts, not their presence. Your translation scenario is the *epistemological flipside*: even observing a *single* culture's consistent behavior cannot distinguish between realism and anti-realism in translation. Behavior underdetermines the metaphysics.
          *   **Non-Cognitivism vs. Cognitivism:** The indeterminacy directly challenges whether ethical sentences express beliefs (cognitivism) or non-cognitive attitudes (non-cognitivism). The empirically perfect manual could interpret the utterance as expressing a belief *or* an attitude.
          *   **Expressivism's Motivations:** Expressivists (like Simon Blackburn, Allan Gibbard) argue that moral language primarily functions to express attitudes and commitments, not to describe facts. Your scenario shows why this view is attractive: it avoids positing mysterious moral facts while explaining the motivational force and social function of moral talk, which aligns with observable behavior.

  3.  **Is it Just "The Same Old Indeterminacy"?**
      *   **Yes, in Structure:** Formally and methodologically, it *is* the same Quinean principle: empirical evidence underdetermines the choice between incompatible translation manuals assigning different meanings/ontological commitments to terms.
      *   **No, in Significance:** Its application to *normative* language is uniquely significant and problematic because:
          *   **Practical Urgency:** Normative language is central to human life, motivation, justification, and social coordination in a way that rabbit parts are not. The stakes feel higher.
          *   **The "Ought" Gap:** It highlights the infamous **Is-Ought Gap** (Hume's Guillotine). No amount of descriptive behavioral evidence ("is") can conclusively determine the correct translation of normative force ("ought"). Both manuals bridge the gap differently.
          *   **Metaphysical Weight:** The competing interpretations (objective moral law vs. cultural norm) involve radically different and deeply contested metaphysical commitments about the fabric of reality itself, far more than rabbit stages vs. whole rabbits.
          *   **Motivational Force:** Realist interpretations often struggle to explain why knowing an objective moral fact *motivates*, whereas anti-realist interpretations more easily link norms to desires, emotions, or social pressures reflected in behavior. The indeterminacy reflects this explanatory underdetermination.

  4.  **Naming the Boundary:**
      *   **The Boundary Question:** You ask a brilliant follow-up: Where does descriptive ontology end and normative framing begin in these cases? What is this boundary called?
      *   **The Challenge:** This boundary *is precisely what is blurred and underdetermined* in your scenario. The translation manual *draws the line* by deciding if "wrong" refers to an objective property or encodes a subjective/cultural stance.
      *   **Potential Labels for the Boundary/Limit:**
          *   **The Normative-Descriptive Divide (in Translation):** Simple and accurate.
          *   **The Limit of Naturalistic Constraint:** Highlights that natural facts (behavior) run out of constraining power precisely at the point of assigning *normative status*.
          *   **Quine's Verificational Horizon for Normativity:** The point beyond which verification (by behavior) cannot reach to settle the metaphysical nature of the normativity.
          *   **The Semantic Cut (for Oughts):** The point where the meaning assignment shifts from describing states of affairs to prescribing/evaluating them.
      *   **The Key Insight:** There is *no pre-behavioral, translation-independent fact of the matter* about where this boundary lies for the native speaker's language, according to the Quinean view applied rigorously. The manual *imposes* this boundary based on the translator's choices constrained *only* by the totality of behavioral evidence, which is insufficient to uniquely determine it. This is the heart of the normative indeterminacy.

  **In Conclusion:**

  You've hit upon a profound instance of **Normative Indeterminacy of Translation**. While it's structurally Quine's classic indeterminacy, its application to ethics intensifies the philosophical stakes by exposing the fundamental underdetermination of moral metaphysics by observable behavior and highlighting the precariousness of the descriptive/normative boundary within language itself. The boundary is drawn *by the translation manual*, not discovered in the behavior, and its location remains empirically indeterminate. This is a core challenge for metaethics and the philosophy of language. "Normative Indeterminacy" is the most concise label, but the descriptions involving "underdetermination of moral ontology" or the "limit of naturalistic constraint for normativity" capture its depth.
