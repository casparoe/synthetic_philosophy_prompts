  We are going to reinterpret Lewis Carroll's "What the Tortoise Said to Achilles" in the context of a proof assistant like Lean, using vocabulary such as proof terms, tactic scripts, Curry-Howard, etc.

  Original Carroll problem (simplified):
  - Achilles and the Tortoise are discussing an argument with premises:
     (A) Things that are equal to the same are equal to each other.
     (B) The two sides of this triangle are things equal to the same.
    and a conclusion:
     (Z) The two sides of this triangle are equal to each other.

  - The Tortoise accepts A and B, but refuses to accept Z until Achilles writes down a hypothetical premise (C): "If A and B are true, then Z must be true."
  - Then the Tortoise accepts A, B, and C, but still refuses Z, demanding a further premise (D): "If A, B, and C are true, then Z must be true," and so on.

  In logical terms, the Tortoise is refusing to apply modus ponens without an explicit rule that authorizes that application, and then demands a rule for that rule, leading to an infinite regress.

  Now, we restate in Lean/proof assistant terms:

  1. **Proof terms vs. tactic scripts, Curry-Howard:**
     - Under Curry-Howard, propositions are types and proofs are terms (inhabiting those types). So the argument becomes:
       Let `A`, `B`, `Z` be propositions (types). We have a proof (term) `hA : A`, a proof `hB : B`, and we wish to construct a proof of `Z`.
       We also have a proof `mp : ∀ (P Q : Prop), P → (P → Q) → Q` (modus ponens as a function). But note that in our case, we have a specific implication: `C : A → B → Z` (which corresponds to "if A and B, then Z").

     - The direct proof term would be: `mp A (B → Z) hA (mp (A ∧ B) Z (and_intro hA hB) C)`? Actually, let's break it down.

     Actually, for the original, we might have:
       `C : A → B → Z`
     Then the proof of `Z` is: `C hA hB`.

     But the Tortoise is not willing to accept that. The Tortoise wants to see the rule that allows the application of `C` to `hA` and `hB`. In Lean, the application is done by the function application rule (which is built-in: if you have `f : P → Q` and `p : P`, then `f p : Q`). So the Tortoise is essentially refusing to use the function application without a rule that says that function application is valid.

  2. **The gap between syntax and semantics:**
     - In a proof assistant, we have a formal system (syntax) that we hope corresponds to our intended semantics (e.g., the standard model of mathematics). The proof checker only checks the syntactic steps.

     - The Tortoise's regress is about the justification of the inference rules. In the context of Lean, the rules (like function application) are primitive and built into the kernel. The kernel is trusted to correctly implement the rules of the foundation (e.g., dependent type theory).

  3. **Tactic scripts vs. proof terms:**
     - When we write a tactic script (like `apply C` or `exact C hA hB`), the tactic engine constructs a proof term. The `exact` tactic would require a term of the goal type, so `exact C hA hB` would close the goal `Z` if `C : A → B → Z`, `hA : A`, `hB : B` are in the context.

     - The Tortoise might refuse to run the tactic `exact C hA hB` unless we provide a proof that the tactic is sound. But note: the tactic itself is not part of the proof term. The proof term is `C hA hB`. The tactic is just a way to construct that term.

  4. **The Tortoise's new demand (tactic-license):**
     - Now, the twist: the Tortoise doesn't reject inference but demands that every tactic step comes with an explicit 'tactic-license', i.e., a proof term authorizing that exact invocation, and then that license needs its own license, etc.

     - In Lean, tactics are meta-programs that generate proof terms. The soundness of the system relies on the fact that the kernel type-checks the resulting proof term. The tactic itself is not part of the trusted code base (TCB) because the kernel will reject any ill-formed proof term.

     - However, if the Tortoise demands a license for the tactic, that would be a proof that the tactic, when it claims to produce a term of type `T`, indeed produces a term of type `T`. But note: the license for the tactic would be a proof in the metalanguage (say, Lean's meta-programming framework) that the tactic is correct. And then we would need a license for that metalanguage proof, etc.

     This regress is similar to Carroll's, but it is happening at the meta-level.

  5. **How Lean handles "authorization":**
     - In Lean, the kernel is the ultimate authority. It checks the proof term. Tactics are not authorized at runtime by a proof term; they are programs that run and produce a term which is then checked by the kernel.

     - There are reflective techniques where one can prove within the object language that a certain tactic (or decision procedure) is sound. For example, one might prove a theorem that a particular algorithm for Presburger arithmetic is correct, and then use that to justify a tactic. However, the use of that tactic still produces a proof term that relies on that correctness theorem. The kernel checks the entire term, including the correctness proof.

     - The Tortoise's demand would be that for every invocation of a tactic, we must not only have a correctness theorem for the tactic in general, but also a proof that the specific instance of the tactic was correct. This would lead to an explosion of proof obligations.

  6. **Residue report:**
     - What translates cleanly:
          - The premises A, B, and the implication C are just assumptions (or constants) in the context.
          - The conclusion Z is the goal.
          - The direct proof term is `C hA hB`.
          - The Tortoise's refusal to accept `C hA hB` without a rule for function application corresponds to questioning the built-in function application rule. In Lean, this is primitive and not reducible to anything else.

     - What fits with distortion:
          - The infinite regress of premises (C, D, ...) can be seen as an infinite sequence of ever higher-level function types. For example, we might have:
              `C1 : A → B → Z`
              `C2 : (A → B → Z) → A → B → Z`  (which is just the identity function on `A → B → Z`)
              `C3 : ((A → B → Z) → A → B → Z) → (A → B → Z) → A → B → Z` (again, identity), etc.
            But note that `C2` is not needed because we already have `C1` and function application is built-in. The regress in the original Carroll story is blocked by the fact that the inference rule (modus ponens) is a rule of the system, not a premise.

          - In the tactic variant, the demand for a license per tactic step is a meta-level regress. This is not how Lean works, but it resembles the idea of proof-carrying code or certified metaprograms. However, in practice, we don't require a separate proof for each tactic call because the kernel checks the final proof term.

     - What has no counterpart:
          - In Lean, the function application rule is primitive and not justified by any further rule. There is no way to demand a rule for it because it is the foundation. The regress stops at the kernel.

          - The infinite regress of tactic licenses is not something that happens in standard formal methods. However, in a system that uses reflection, one might prove the correctness of a tactic once and then use it many times without having to re-prove it for each instance. The idea of requiring a license per invocation is impractical and not done.

  7. **The tactic-costume regress:**
     - The variant where the Tortoise demands a license for each tactic step is Carroll's regress in disguise. It is the same problem: the justification of the rule (here, the tactic) requires a further justification, ad infinitum.

     - However, in the context of formal methods, we break the regress by:
          - Trusting the kernel (which is small and verified).
          - For metaprograms (tactics), we can either trust the tactic engine (which is not in the TCB in Lean because the kernel checks the proof term) or use reflection to prove the correctness of the tactic once and then use it without further licenses.

     - Self-certifying compilers or reflective proof checking are ways to reduce the TCB. In reflective proof checking, the correctness of a proof-producing procedure is proved within the system, and then that procedure is used to generate proof terms. The proof term includes the correctness proof for the procedure, so the kernel only checks that. But note: the kernel still has to check the correctness proof, and that proof is finite. The regress is broken by having one (finite) proof for the entire class of instances.

  Conclusion:

  The Carroll regress highlights that inference rules must be taken as primitive. In Lean, the primitive rules are the rules of the type theory (function application, etc.) implemented by the kernel. The kernel is the foundation and cannot be justified within the system itself.

  The tactic-license variant is a regress at the meta-level. It is broken in practice by the fact that the kernel checks the proof term, and by the possibility of proving the correctness of a tactic once and for all (if one wishes) within the object theory.

  Therefore, the tactic-license regress is not something that actually happens in Lean because we don't require such licenses. The kernel's type checking is the ultimate authority.

