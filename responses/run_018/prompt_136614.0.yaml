answer: |-
  You've nailed a profound and widely recognized asymmetry in personal identity theory—one that doesn't have a single universally agreed-upon name but is deeply discussed in philosophy of mind. Here's how it maps onto established concepts:

  ### Core Asymmetry: **Continuity of Consciousness vs. Causal Disruption**
  1. **Gradual Replacement (Neuron Swap)**  
     - **Phenomenal Continuity**: Consciousness flows uninterrupted. Each moment connects seamlessly to the next.  
     - **Causal Smoothness**: No single event breaks the chain of psychological/physical causation.  
     - **Intuition**: "I persist" because there's no moment where "I" stop existing.  

  2. **Instant Teletransportation**  
     - **Consciousness Disruption**: Scanning/destruction creates a *phenomenal gap*—even if momentary.  
     - **Causal Disruption**: The original brain's causal processes terminate abruptly.  
     - **Duplication Threat**: If the original isn't destroyed, we face two claimants (Mars copy vs. Earth you).  
     - **Intuition**: "I die; a copy lives" because continuity is shattered.

  ### Key Philosophical Frameworks
  - **Parfit's "R-Branching"** (Reasons and Persons):  
    Teletransportation creates "branched" psychological continuity (original and copy). Gradual replacement avoids branching—it's a single, unbroken "R-relation" chain.  
    **→ Asymmetry Name:** *Branching Avoidance in Gradual Continuity*.

  - **Shoemaker's "Causal-Path Dependence"**:  
    Identity requires an unbroken causal path between mental states. Gradual replacement preserves this; teletransportation severs it.  
    **→ Asymmetry Name:** *Causal-Path Integrity Asymmetry*.

  - **Dainton's "Phenomenal Continuity"**:  
    The *felt flow* of consciousness is paramount. Gradual processes preserve it; instant duplication breaks the stream.  
    **→ Asymmetry Name:** *Temporal Grain Problem of Consciousness*.

  - **Nozick's "Closest Continuer"**:  
    In teletransportation, the copy is a "new" closest continuer. In gradual change, *you* remain the sole continuer at every step.  
    **→ Asymmetry Name:** *Continuer Uniqueness Asymmetry*.

  ### Why Rate Matters More Than Physical/Psychological Identity
  - **The Ship of Theseus Effect**: Slow replacement lets us psychologically "track" identity over time. We accept incremental change as persistence.  
  - **The Threshold Fallacy**: We treat instantaneous change as a discrete event (death/rebirth), while gradual change is a process.  
  - **Evolutionary Bias**: Human cognition evolved to equate abrupt discontinuities (e.g., unconsciousness) with termination of self.

  ### Proposed Name for the Asymmetry
  In literature, it’s often called:  
  **"The Rate-Dependent Continuity Problem"** or  
  **"The Temporal Threshold Paradox of Personal Identity"**.

  ### Why This Isn’t Settled
  - **Reductionists** (like Parfit): Argue both cases are *survival* (psychological continuity matters).  
  - **Animalists** (like Olson): Claim both are death if the biological organism is destroyed.  
  - **Phenomenalists** (like Dainton): Insist conscious continuity is irreducible and explains your intuition.

  ### Practical Takeaway
  Your intuition aligns with most people because **continuous first-person experience feels ontologically irreducible**. The asymmetry exposes that personal identity isn't just about *what* persists, but *how* it persists. Rate isn't incidental—it's constitutive of our sense of self.

  **Further Reading**:  
  - Parfit’s *Reasons and Persons* (§§90-95 on "teletransportation and the branch-line case").  
  - Dainton’s *Stream of Consciousness* (on temporal phenomenology).  
  - Garrett’s *Personal Identity and Self-Consciousness* (on gradualism).
