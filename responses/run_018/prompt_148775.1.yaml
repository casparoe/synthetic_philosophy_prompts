  ### Position Descriptions  
  1. **Empiricist Positivism**: Errors are random noise; correction requires no theory; single deviations do not challenge macro-claims.  
  2. **Sceptical Particularism**: Errors are noise but uncorrectable without theory; single deviations do not undermine macro-categories (awkward due to unresolved tension between data scepticism and macro-category retention).  
  3. **Critical Microhistory**: Errors reflect structural suppression; correction requires theory; single deviations invalidate "elite interest" by exposing contradictions.  
  4. **Structuralist Persistence**: Errors indicate structural suppression; correction requires theory; single deviations do not negate macro-categories, which endure as systemic features.  
  5. **Subaltern Recovery**: Errors prove local taxonomy overwriting; correction requires theory; single deviations dismantle "elite interest" by revealing resistance/alternatives.  
  6. **Poststructuralist Synthesis**: Errors signify overwritten local taxonomies; correction requires theory; single deviations enrich but do not falsify macro-categories, which remain heuristic tools.  

  This taxonomy demonstrates that microhistorical sources *can* falsify macro-claims (e.g., via **Critical Microhistory** or **Subaltern Recovery**) but often complicate rather than resolve debates, depending on interpretive choices.
