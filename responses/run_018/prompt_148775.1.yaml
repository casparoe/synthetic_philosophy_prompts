  - **Unnamed Positions**:  
    - *Structural suppression → Correct without theory = Yes*: Awkwardly assumes systemic bias can be neutrally corrected, ignoring theory's role in exposing power dynamics.  
    - *Overwritten local taxonomy → Correct without theory = Yes*: Awkwardly assumes erased taxonomies are recoverable without frameworks, overlooking interpretive dependence on theory.  
