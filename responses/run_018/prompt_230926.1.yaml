prompt: |-
  I'm a science journalist, and my editor's go-to line in story meetings is "we don't publish what we don't know." Last week he spiked a piece because the claim came from a reliable source and was overwhelmingly likely to be true, but he said it wasn't something we knew. I think that slogan is doing more work than it can bear, but I keep losing the argument about exactly which reading I'm objecting to. Can you lay out the distinct precise principles that line could be asserting — knowledge norm, truth norm, belief norm, justification norm, maybe a certainty threshold — and for each tell me whether its independently plausible, whether it's trivial or does real work, and whether it actually licenses his call to spike the story. I'd rather get a menu of readings with verdicts than one true interpretation, and I especially want to know which reading his argument needed to go through.
reasoning: |-
  Okay, the user is a science journalist dealing with an editor who uses the slogan "we don't publish what we don't know." The editor spiked a story that had a claim from a reliable source that was overwhelmingly likely true, but because it wasn't "known," it got rejected. The journalist is frustrated and thinks the slogan is being misapplied. They want a breakdown of possible interpretations of the slogan, each evaluated for plausibility, triviality, and whether it justifies spiking the story.

  First, I need to unpack the philosophical norms related to knowledge. The key terms here are knowledge norms, truth norms, belief norms, justification norms, and certainty thresholds. Each of these has different implications for journalism. 

  The user mentioned losing arguments about which interpretation they're objecting to. So, I should clearly define each principle to help them articulate their objection. The editor's decision seems strict, so identifying which norm he's relying on is crucial. Let me list out each possible principle:

  1. **Knowledge Norm**: Requires that claims must meet the philosophical definition of knowledge (justified true belief). This is high standard, especially in science where new findings often aren't settled. If the editor uses this, it might be too restrictive for journalism since breaking news often involves emerging evidence.

  2. **Truth Norm**: Only publish what's true. But journalists can't access absolute truth; they rely on evidence. This norm is impractical because truth is often not verifiable at the time of publishing. The editor's stance might imply this, but it's not feasible in practice.

  3. **Belief Norm**: Publish only what the publication believes. This is too subjective and variable. The editor's reliable source and likelihood suggest belief was there, so this probably isn't the issue.

  4. **Justification Norm**: Focuses on having sufficient evidence. This is a common journalistic standard. If the story had strong justification but was spiked, maybe the editor is demanding more than standard justification. But the user says the claim was "overwhelmingly likely," so justification seems present. Why was it rejected then?

  5. **Certainty Threshold**: Requires near-absolute certainty. This is excessive in science journalism where most findings are probabilistic. If the editor insists on this, it would prevent publishing many credible stories. This seems likely the culprit, especially since the claim was likely true but not certain.

  The user wants to know which reading the editor's argument depends on. The certainty threshold interpretation seems to align with the editor's action. The story had reliability and likelihood but not certainty, so spiking it based on that would require an impractical standard. 

  Also, considering the journalist's role: they need to inform the public about developing science, which involves reporting well-supported but not certain findings. The editor's stance might hinder timely reporting. The deeper need here is balancing accuracy with the necessity of sharing important, probable information. The journalist might need arguments against an unrealistic certainty standard, emphasizing that journalism isn't about absolute knowledge but responsible reporting based on evidence.
answer: |-
  Here's a dissection of your editor's slogan "we don't publish what we don't know" into distinct philosophical/journalistic principles, evaluated for plausibility, triviality, practical work, and applicability to your spiked story. The key insight is that **your editor likely defaults to an implausible "Certainty Threshold" interpretation, while you likely advocate for a "Justified Belief Norm" or "Truth-Tracking Norm."**

  ---

  ### 1. **Knowledge Norm (Strict JTB+ Definition)**  
     - **Principle:** Only publish claims meeting the *philosophical definition of knowledge*: Justified True Belief (plus anti-Gettier conditions).  
     - **Plausibility:** ❌ **Low**. Journalism isn't epistemology. Few scientific claims (especially breaking ones) meet strict JTB+ criteria at publication time. Truth is often only verifiable *later*.  
     - **Triviality/Work:** ⚠️ **Does real (but destructive) work**. It creates an impossibly high bar, conflating publication standards with philosophical certainty.  
     - **Licenses Spiking?** ✅ **Yes, excessively**. Your story (based on likelihood, not verified truth) fails this norm.  
     - **Editor's Reliance:** Likely implicit. His "know" may demand indefeasible justification + truth.  

  ### 2. **Truth Norm**  
     - **Principle:** Only publish claims that are *factually true*.  
     - **Plausibility:** ❌ **Very low**. Journalists lack omniscience. We publish based on *evidence of truth*, not truth itself. A norm requiring actual truth is paralyzing.  
     - **Triviality/Work:** ⚠️ **Trivial in theory, useless in practice**. "Publish only true things" is tautological but operationally meaningless.  
     - **Licenses Spiking?** ✅ **Yes**. Since truth can't be guaranteed pre-publication, this norm would spike *everything*.  
     - **Editor's Reliance:** Unlikely. Even he wouldn’t claim journalists access "truth" directly.  

  ### 3. **Belief Norm**  
     - **Principle:** Only publish what the *newsroom believes*.  
     - **Plausibility:** ⚠️ **Moderate but flawed**. Aligns with editorial autonomy but ignores that belief can be irrational or underinformed.  
     - **Triviality/Work:** ⚠️ **Does little work**. Reduces to "publish what we want," offering no objective standard.  
     - **Licenses Spiking?** ❌ **No, in your case**. You *did* believe the claim (via reliable source + high likelihood).  
     - **Editor's Reliance:** Unlikely—he invoked "knowledge," not belief.  

  ### 4. **Justification Norm (Your Likely Position)**  
     - **Principle:** Publish claims backed by *sufficient evidence* to justify belief, even if fallible.  
     - **Plausibility:** ✅ **High**. Matches scientific/journalistic practice (e.g., peer-reviewed studies, corroborated sources). Focuses on process, not outcome.  
     - **Triviality/Work:** ✅ **Does real, constructive work**. Sets a clear bar: "Have we done due diligence?"  
     - **Licenses Spiking?** ❌ **No**. Your story (reliable source, high likelihood) *meets* this norm.  
     - **Editor's Reliance:** He rejects this—hence the spike despite justification.  

  ### 5. **Certainty Threshold (Editor's Likely Interpretation)**  
     - **Principle:** Publish only claims meeting a threshold of *near-absolute certainty* (e.g., 99.9% likelihood).  
     - **Plausibility:** ❌ **Very low** in science journalism. Most cutting-edge science (e.g., climate models, epidemiological forecasts) is probabilistic. Demanding certainty stifles timely reporting.  
     - **Triviality/Work:** ✅ **Does real work—but harmful**. Conflates "knowledge" with "certainty," ignoring that science operates on confidence levels.  
     - **Licenses Spiking?** ✅ **Yes**. Your story (merely "overwhelmingly likely") fails this artificially high bar.  
     - **Editor's Reliance:** ⭐ **Critical**. This is likely his unstated premise. His argument *needs* this threshold to spike your story.  

  ### 6. **Truth-Tracking Norm (Pragmatic Alternative)**  
     - **Principle:** Publish claims generated by *reliable processes* (e.g., vetting sources, peer review) that *track truth* over time, even if imperfectly.  
     - **Plausibility:** ✅ **High**. Aligns with best practices: focus on methodology, transparency, and corrigibility.  
     - **Triviality/Work:** ✅ **Does essential work**. Balances rigor with realism. Allows publishing "likely" claims with caveats.  
     - **Licenses Spiking?** ❌ **No**. A reliable source + high likelihood suggests robust truth-tracking.  
     - **Editor's Reliance:** He rejects this by prioritizing "knowing" over process.  

  ---

  ### **Key Conclusions & Tactical Advice**  
  1. **Editor's True Norm:** He almost certainly relies on **#5 (Certainty Threshold)**. This lets him dismiss even well-justified claims ("likely" ≠ "certain"). His slogan is a rhetorical shield for extreme risk aversion.  
  2. **Your Objection:** You likely advocate **#4 (Justification Norm)** or **#6 (Truth-Tracking Norm)**. These are industry-standard (e.g., NYT/Waisto guidelines on using "sources familiar with").  
  3. **Why He "Wins" the Argument**: He equivocates! He uses "know" colloquially (= certainty) while you hear it philosophically (= justified belief). This ambiguity lets him default to certainty without defending it.  
  4. **How to Counter**:  
     - **Reframe the Slogan**: *"Does 'know' mean 'certain' or 'responsibly justified'? The first isn't feasible in science journalism."*  
     - **Appeal to Practice**: *"If we only publish certainties, we’d never cover new studies, forecasts, or investigations—which is 80% of science reporting."*  
     - **Propose Alternatives**: Push for **#6 (Truth-Tracking)** + transparency: *"We publish claims from reliable processes, flag confidence levels, and correct errors openly."*  

  **Bottom Line**: His stance is a misapplication of epistemology that ignores journalism’s function. By forcing him to defend his implicit **Certainty Threshold**, you expose its incompatibility with reporting on emerging science. If he won’t budge, propose a policy doc defining "know" operationally—that’s where the real debate lies.
