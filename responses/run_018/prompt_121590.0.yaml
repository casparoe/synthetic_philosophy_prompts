  ### **Residue Report: What Survives, What Fudges, What Has No Counterpart**
  | **Aspect**                          | **Translation Status**                                                                                               |
  |-------------------------------------|----------------------------------------------------------------------------------------------------------------------|
  | **Sampling frame**                  | **Fudges**: In surveys, frames are fixed and known. Here, the frame is counterfactual (all possible observers across worlds) and unknowable. Requires metaphysical commitment. |
  | **Inclusion probabilities**         | **Survives**: SSA/SIA map cleanly to \(\pi_j\). HT weights are conceptually analogous but not computable.           |
  | **Estimator (HT)**                  | **Fudges**: \(\hat{\tau}_{HT}\) is theoretically definable but practically useless without known \(\pi_i\) and world \(i\). |
  | **Priors (\(\pi_i\)) and posteriors** | **Survives**: Bayesian updating is standard in model-based survey inference. Priors play the same role.              |
  | **Design-based inference**          | **No counterpart**: Not feasible here. Anthropics is inherently model-based due to unobservable frames and priors.    |
  | **First-person perspective**        | **No counterpart**: The "I" in anthropics has no survey analog. Surveys sample units from a third-person perspective; anthropics centers on the sample being *you*. |
  | **Reference class problem**         | **No counterpart**: Surveys fix eligibility by design (e.g., "households in region X"). Anthropics debates who counts as an "observer" (conscious entities? humans only?). |

  - **Your guess was mostly correct**:  
    - The first-person perspective ("I am *this* observer") has **no counterpart** in surveys.  
    - The reference class problem (eligibility) also has **no counterpart** because survey frames are defined by the designer, not debated philosophically.  
    - However, the eligibility problem you mention (choosing frames for different purposes) *is* the anthropic reference class problem in disguise (see below).

