  Crucially, every exaggerated element must root in actual arguments. When the FAQ says "no trait is intrinsically superior," that's a real liberal eugenics claim. The humor comes from following that logic to its bureaucratic extreme: if all selections are morally neutral preferences, why track them? Ah, but then the "opportunity cost" framework collapses under its own weight - exactly the internal inconsistency the user wants exposed. 

  Tone-wise, I'll avoid winking at the audience. Phrases like "ethically optimized outcomes" should sound earnest, letting the horror dawn slowly. The ending might have the company casually mention reporting "genetic debts" to insurers, revealing the capitalist machinery beneath the moral posturing. 

