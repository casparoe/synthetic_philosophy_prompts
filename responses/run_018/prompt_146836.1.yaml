  I am a high school student preparing a submission for my school's philosophy journal, and I need a sustained piece of satire that examines the logic of procreative beneficence and liberal eugenics without simply reciting the familiar objections about state coercion or discrimination against disability. I want the form to be a deadpan corporate FAQ page for a fictional reproductive consulting firm, written in the bland, reassuring voice of a tech startup help center, running approximately seven hundred words. The piece should take the shape of continuous prose arranged as a flowing sequence of questions and answers, but please deliver it with absolutely no headings, bullet points, bold text, or tables — it should read like a single letter or email rather than a structured document. The target of the satire is the internal consistency of the liberal eugenics position, especially its claim that parental autonomy transforms genetic selection into pure moral beneficence; to keep the piece from being generic, please inject the niche conceptual twist of a "genetic opportunity cost," treating each selected embryo as creating a moral debt to the unselected genetic profiles that parents must record on an ethical balance sheet, and follow that idea to its logical conclusion. The humor should come from exaggerating real features of the view rather than inventing absurd ones, so that a specialist recognizes the satire is fair, and the irony should remain deadpan — legible without any winking. Please do not include bibliographies, reading lists, citations, or direct quotations from real texts; if a specific philosophical claim must be referenced, paraphrase it without quotation marks. Respond entirely in continuous prose with no formatting devices.
