answer: |-
  Here’s a comprehensive exam package designed around your crux, avoiding stock objections and forcing engagement with elasticity, positional goods, and the improvement/selection analogy. The vignette uses non-disability competitive traits to disrupt memorized scripts.

  ---

  ### **1. Exam Question (Student-Facing)**  
  **Time:** 60 minutes  
  **Word Guide:** ~1000 words  
  **Marks:** 30  

  > **Vignette:** *Alex and Sam are undergoing IVF. Their clinic offers polygenic scoring for non-medical traits, including "competitive persistence" (a predictor of resilience in high-stakes academic/career environments) and "social adaptability." They have four blastocysts with scores as follows:*  
  > **Embryo A:** High competitive persistence, Low social adaptability  
  > **B:** Medium competitive persistence, Medium social adaptability  
  > **C:** Low competitive persistence, High social adaptability  
  > **D:** Low competitive persistence, Low social adaptability  
  >   
  > *The clinic also offers two options: (1) Do another ovarian stimulation cycle now (increasing the chance of more/different embryos, but with significant physical/financial costs); or (2) Use frozen donor sperm from a highly educated donor with high polygenic scores for both traits, creating a new set of possible embryos.*  
  >   
  > **Question:** According to the principle of Procreative Beneficence (PB)—"select the child, of the possible children you could have, expected to have the best life"—should Alex and Sam transfer one existing embryo, create new embryos via Options (1) or (2), or delay for other alternatives? In your answer:  
  > - (a) Explain why PB’s advice changes drastically depending on how "possible children" is defined (e.g., whether it includes only existing embryos, current-cycle options, or all future alternatives).  
  > - (b) Analyze whether selecting for "competitive persistence" could self-defeat if all parents followed PB (considering its payoffs depend on others’ traits).  
  > - (c) Evaluate whether PB demands more from parents than the obligation to improve an existing child’s prospects (e.g., by moving school districts). Precisely identify where this analogy holds or breaks down.  

  ---

  ### **2. Model Answer (~850 words)**  
  **Introduction (80 words):**  
  Procreative Beneficence (PB) appears to offer clear guidance: select the embryo with the best life prospects. Yet Alex and Sam’s dilemma reveals PB’s instability. The indeterminacy of "possible children" and the positional nature of traits like "competitive persistence" risk rendering PB either arbitrary or impossibly demanding. Worse, it may undermine the child-centered welfare it claims to prioritize.  

  **Part (a): The Elastic Comparator Set Problem (280 words):**  
  PB’s coherence hinges on fixing the domain of "possible children," but this domain is fluid. If "possible children" means *only the four existing embryos*, PB advises selecting A (high competitive persistence). Yet this arbitrarily ignores Options (1) and (2). Why privilege this moment? Alex and Sam *chose* to start IVF now, not earlier or with donors—decisions already affecting which children are "possible." PB thus collapses into endorsing whichever embryo tops a set defined by prior choices it doesn’t evaluate.  

  If "possible children" includes *all feasible options* (e.g., new cycles, donors, or delaying to save money for more attempts), PB demands maximization without limits. Option (2) (donor sperm) likely produces embryos with higher aggregate scores than A-D. But Option (1) (another cycle) might yield even "better" embryos, and further delays could improve finances for more cycles. PB offers no stopping point: it becomes an instruction to endlessly optimize, sacrificing present well-being for hypothetical future gains. This either paralyzes decision-making or justifies unreasonable sacrifices, contravening PB’s aim to guide actionable choice.  

  **Part (b): Positional Traits and Collective Self-Defeat (260 words):**  
  "Competitive persistence" exemplifies a *positional good*: its benefits (e.g., elite job placement) depend on relative advantage, not absolute ability. If all parents select for high competitive persistence, the trait’s distribution skews upward, eroding its comparative advantage. Like height in basketball, when all players get taller, the competitive edge vanishes. PB would then compel parents to invest in costly interventions (e.g., additional cycles) for zero net welfare gain—a collective action trap.  

  This matters because PB justifies embryo selection *by appealing to the child’s welfare*. But for positional traits, widespread adherence to PB *reduces* expected welfare: resources wasted on fruitless optimization could have improved non-positional goods (e.g., emotional security). This is not just misapplication but *internal incoherence*: PB uses child welfare to demand actions that, universally adopted, diminish child welfare. The problem isn’t "naive reading" of "best life"—it reveals PB’s blindness to how trait values emerge socially. Selecting Embryo A might help *this child* only if others don’t optimize similarly.  

  **Part (c): Improvement vs. Selection Analogy (180 words):**  
  One might object that PB overdemands by requiring embryo optimization but not, say, moving school districts for an existing child. This analogy breaks down at three points:  
  1. **Identity Dependence**: Selecting Embryo A over B *changes which child exists*. Moving districts improves the *same child*; this is ethically distinct.  
  2. **Baseline Costs**: Parents aren’t obliged to bankrupt themselves to improve an existing child’s prospects. But PB applied to elastic comparator sets *demands* unlimited investment to expand options.  
  3. **Natural Lottery**: Not moving districts accepts the child’s traits as given by the "natural lottery." PB treats embryos as objects to be optimized, rejecting the lottery. This reframes procreation as engineering, not acceptance.  
  The analogy only holds if "possible children" is fixed (e.g., only existing embryos). But as (a) shows, PB cannot coherently fix the domain.  

  **Conclusion (50 words):**  
  PB self-destructs under scrutiny. Elastic comparator sets make it arbitrary or tyrannical; positional traits expose its self-defeating logic; and selection diverges sharply from improving existing children. Alex and Sam should reject PB as unworkable.  

  ---

  ### **3. Marking Scheme (30 marks total)**  
  **A (25–30)**: Diagnoses PB’s core instability; integrates all three parts; original analysis of positional/collective effects; precise analogy breakdown.  
  **B (18–24)**: Engages all parts but uneven; identifies elasticity/positionality but limited depth; analogy noted but not dissected.  
  **C (12–17)**: Superficial on elasticity/positionality; stock objections (e.g., autonomy/eugenics); analogy stated but not analyzed.  
  **D (0–11)**: Misdefines PB; ignores vignette; lists generic objections.  

  #### **Component Marks & Common Errors**  
  - **(a) Comparator Set Elasticity (10 marks)**  
    - *9–10*: Shows PB is arbitrary (fixed set) or infinitely demanding (open set); links to prior choices.  
    - *6–8*: Describes fixed vs. open sets but doesn’t trace implications.  
    - *0–5*: Ignores elasticity or misstates PB.  
    - *Common error:* Assumes "possible children" is self-evidently fixed.  

  - **(b) Positional Goods & Self-Defeat (10 marks)**  
    - *9–10*: Demonstrates how universal PB adoption erodes positional advantages; ties to child welfare.  
    - *6–8*: Notes competitive trait problem but no collective effect.  
    - *0–5*: Treats traits as non-positional or confuses with disability.  
    - *Common error:* Claims selection "still helps the child" without addressing distributional effects.  

  - **(c) Improvement/Selection Analogy (10 marks)**  
    - *9–10*: Breaks down analogy at identity/cost/baseline; shows elasticity’s role.  
    - *6–8*: States differences but lacks precision (e.g., "different situation").  
    - *0–5*: Assumes analogy holds without argument.  
    - *Common error:* Uses analogy as standalone objection without engaging (a)/(b).  

  ---

  ### **Why This Meets Your Spec**  
  - **Blocks memorized scripts**: Vignette avoids disability; forces novel engagement with elasticity/positionality.  
  - **Makes crux unavoidable**: Parts (a)/(b) directly target your "two horns" and collective self-defeat.  
  - **Earns the analogy**: Part (c) requires dissecting *how* selection differs from improvement.  
  - **Allows wrong answers**: Defending PB requires resolving elasticity/positionality (which model answer shows is implausible).  
  - **No citations needed**: Relies on core concepts (positional goods, identity) not niche scholarship.  

  This question pushes students to see PB as fractured at the foundations—not just "controversial" but *incoherent* under the pressure of real-world constraints.
