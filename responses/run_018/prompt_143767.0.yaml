reasoning: |-
  We are teaching iterated elimination of dominated strategies (IEDS) with a focus on the concept that a pure strategy can be dominated by a mixed strategy. The students are first-year grad students in logic with some exposure to modal logic and decision trees but no prior game theory. They have the misconception that rationality always leads to a single obvious answer and that rational choice is just Bayesian updating.

  Prerequisite Chain:
  1. Basic game representation: payoff matrix (for normal-form games) and the idea of players, strategies, and payoffs.
  2. The concept of dominance between pure strategies: strict dominance (one strategy always better than another, regardless of what others do) and weak dominance.
  3. The idea of mixed strategies: a probability distribution over pure strategies. We introduce the notion that players can randomize.
  4. Expected payoff: how to compute the expected payoff of a pure strategy against a mixed strategy of the opponent(s). This requires understanding of expectation (which they should have from probability, but we'll review briefly).
  5. Dominance by a mixed strategy: a pure strategy is strictly dominated by a mixed strategy if there exists a mixed strategy (over other pure strategies) that yields a strictly higher expected payoff against every possible pure strategy of the opponents. Note: We are not requiring the dominating mixture to be a best response, just that it dominates the pure strategy in question.

  Explanatory Arc:

  1. **Setting the Stage: Representing Games and Pure Strategy Dominance (15 mins)**
     - Introduce a simple 2x2 game (e.g., Prisoner's Dilemma) to show pure strategy dominance and iterated elimination of strictly dominated pure strategies. Emphasize that sometimes we can eliminate strategies that are never good, and then iterate.
     - Check: They should see that iterated elimination can lead to a unique outcome.

  2. **Introducing Mixed Strategies and Dominance by Mixture (20 mins)**
     - Explain that sometimes a pure strategy might not be dominated by any other pure strategy, but it might be dominated by a mixture of other pure strategies.
     - Example: We need a game where a pure strategy (say M) is not dominated by H or L alone, but a mixture of H and L does dominate M.
     - We'll use a 3-bidder auction with discrete bids, but note: the problem is that we have to consider the opponents' strategies. Since we have three players, the game is complex. Alternatively, we can use a two-player game to illustrate the point (which is simpler and avoids the complexity of multiple opponents). However, the request specifies a three-bidder auction. Let's design a simplified version.

