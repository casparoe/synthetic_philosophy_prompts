          The bids: [1,1,1]. Highest bid is 1. 
          Player1 wins only if reserve<=1 (probability 2/5) and then he is one of three, so wins with probability 1/3? Actually, if reserve<=1, then all three are at least the reserve and they tie. Then each has 1/3 chance to win. So expected payoff: (2/5) * (1/3) * (4-1) = (2/5)*(1/3)*3 = 2/5 = 0.4.

     - If player1 plays H (3):
          The bids: [3,1,1]. Highest bid is 3.
          Player1 wins if reserve<=3 (probability 4/5) and then he wins (since he is the only one with 3). Payoff: 4-3=1.
          Expected payoff: (4/5)*1 = 0.8.

     Now, if player1 plays the mixture 50% L and 50% H (so never M), then against (L,L) of the others:
          Expected payoff = 0.5 * (payoff of L) + 0.5 * (payoff of H) = 0.5*0.4 + 0.5*0.8 = 0.2 + 0.4 = 0.6.

     Compare to playing M: 1.2. So 0.6 < 1.2 -> the mixture is worse than M in this case.

     We need M to be dominated by the mixture in every profile. This profile (L,L) is a problem.

     Alternatively, we can adjust the parameters. Let me try making the value higher, say 5.

     Then:
        M against (L,L): reserve<=2 -> win 5-2=3 -> (3/5)*3 = 1.8.
        L against (L,L): (2/5) * (1/3)* (5-1) = (2/5)*(1/3)*4 = 8/15 ≈ 0.53.
        H against (L,L): reserve<=3 -> win 5-3=2 -> (4/5)*2 = 1.6.
        Mixture: 0.5*0.53 + 0.5*1.6 ≈ 0.265 + 0.8 = 1.065 < 1.8.

     Still not.

     We need a profile where M is weak. Consider the profile (H,H) for the others.

     Then:
        If player1 plays M (2): 
            Bids: [2,3,3] -> highest bid is 3. Player1 only has 2, so he never wins? Because even if reserve<=2, the others have 3 which is higher and wins. So he wins only if reserve<=2 and if the others don't win? Actually, the others have 3, which is above any reserve<=2, and they are the highest. So player1 loses. Thus, payoff=0.

        If player1 plays L (1): 
            Similarly, he never wins. Payoff=0.

        If player1 plays H (3): 
            Then bids: [3,3,3]. Reserve<=3 (probability 4/5). Then he is in a three-way tie. Expected payoff: (4/5) * (1/3)*(5-3) = (4/5)*(1/3)*2 ≈ 8/15 ≈ 0.53.

        Mixture of L and H: 0.5*0 + 0.5*0.53 = 0.265.

        But M gives 0, which is less than 0.265? Then M is worse than the mixture in this profile? But we want the mixture to dominate M, meaning it must be better in every profile. In the (L,L) profile, M was 1.8 and mixture 1.065, so M is better. 

     This is not working.

     Given the complexity, I suggest using a two-player example that is standard and clear. The following example is from Osborne (2003) or similar textbooks:

          Player 2
          L    R
     T   3,0  0,0
     M   0,0  3,0
     B   1,0  1,0

     For player 1:
        - T and M are not dominated by each other: T is better if player2 plays L, M is better if player2 plays R.
        - But B is strictly dominated by the mixed strategy that plays T and M each with probability 1/2.
          Against L: T gets 3, M gets 0, B gets 1. The mixture: 0.5*3 + 0.5*0 = 1.5 > 1.
          Against R: T gets 0, M gets 3, B gets 1. The mixture: 0.5*0 + 0.5*3 = 1.5 > 1.

     So B is strictly dominated by the mixture (1/2 T, 1/2 M). We can eliminate B.

     Then the game reduces to:

          L    R
     T   3,0  0,0
     M   0,0  3,0

     Now, we can do iterated dominance: for player2, both L and R give 0 no matter what, so they are not dominated? But note, we are only eliminating strictly dominated strategies.

     However, the example is clear for showing dominance by a mixture.

     Given the time and the students' background, I recommend using this two-player example. We can say that we are focusing on the strategic interaction of two players to keep it simple.

     So let's change the request: use a two-player game. We can frame it as a "submission game" or something abstract.

  3. **Step-by-Step Explanation of the Example (20 mins)**
     - Present the 3x2 game (player1 has T, M, B; player2 has L, R) with the payoffs for player1 (and arbitrary for player2, since we focus on player1).
     - Show that B is not dominated by T or M when considered individually: 
          Against L: T (3) > B (1) and M (0) < B (1) -> so neither T nor M dominates B.
          Against R: T (0) < B (1) and M (3) > B (1) -> again, neither dominates.
     - Now, introduce the idea of a mixture: 50% T and 50% M. Compute the expected payoff of this mixture against L: (3+0)/2 = 1.5, and against R: (0+3)/2 = 1.5.
     - Compare to B: 1 in both cases. So 1.5 > 1 in every case. Therefore, B is strictly dominated by this mixed strategy.
     - Eliminate B. Then the game becomes 2x2.

  4. **Addressing Misconceptions (15 mins)**
     - **Why can't I just best-respond with pure strategies?** 
          Because best responses depend on what others do. In the example, if player2 plays L, the best response is T (which gives 3) and if R then M (which gives 3). But if player1 doesn't know what player2 will do, they might consider mixed strategies. However, note that dominance is not about best responses but about having a strategy that is always better. We are eliminating a strategy that is never a good idea because there's a mixture that always does better.
     - **Is mixing just averaging my beliefs?**
          No. The dominating mixture is a way to show that a pure strategy is inferior. It doesn't mean that the player has to randomize. Even if the player doesn't randomize, the fact that there is a mixture that dominates B means that B is never a good choice. The player might choose either T or M, but they should never choose B. The mixture is a tool for comparison.
     - **Doesn't iteration always leave one strategy standing?**
          No. In the example after eliminating B, we are left with T and M. Neither of these is dominated by the other. So iteration stops with two strategies. This shows that we don't always get a unique answer. We might have a set of strategies that survive.

  5. **Check for Understanding (10 mins)**
     - Present a new 3x2 game (or similar) and ask: "Is there a pure strategy that is strictly dominated by a mixed strategy? If so, which one and by what mixture?"
     - Example:

          L    R
     A   2,?  0,?
     B   0,?  2,?
     C   1,?  1,?

     Answer: C is dominated by a 50-50 mixture of A and B. Against L: 0.5*2 + 0.5*0 = 1 > 1? Actually, 1 is not strictly greater than 1. So we need to adjust: make the payoff for C against L and R less than 1? Or use a mixture that does better. Alternatively, we can change the payoffs:

          L    R
     A   3,?  0,?
     B   0,?  3,?
     C   1,?  1,?

     Then mixture of A and B (50-50): against L: 1.5 > 1, against R: 1.5 > 1. So C is strictly dominated.

     - Also, ask: "If a strategy is dominated by a mixed strategy, does that mean the player must randomize to avoid it?" 
          Answer: No. The player can choose any of the pure strategies that are in the support of the dominating mixture (or any undominated strategy) without ever playing the dominated one. Randomization is one option, but they could also choose a pure strategy that is not dominated.

  6. **What to Leave Out (5 mins)**
     - Do not go into common knowledge conditions for iterated elimination (epistemic conditions). Just assume that players are rational and that this is common knowledge, but without formalizing the modal logic.
     - Avoid continuous strategy spaces and calculus-based examples.
     - Do not discuss the existence of Nash equilibrium or the details of best response correspondence.

  Plan Summary:

  Total time: 75 mins.

  1. (15 mins) Recap of pure strategy dominance and iterated elimination with a simple 2x2 example. Emphasize that we get a unique outcome in that example.
  2. (20 mins) Introduce mixed strategies and dominance by a mixture. Use the two-player 3x2 example (T, M, B vs L, R) to show that B is dominated by a 50-50 mix of T and M. Compute the expected payoffs step by step.
  3. (15 mins) Address the misconceptions in order: 
     - Why pure best responses aren't enough? Because we might not know the opponent's move, and dominance is about unconditional inferiority.
     - Mixing as a tool for comparison, not necessarily as a prescription.
     - Iteration doesn't always yield a single strategy: show that after eliminating B, T and M remain and neither dominates the other.
  4. (10 mins) Check for understanding with a new example. Ask the question about whether the player must randomize (answer: no).
  5. (5 mins) Wrap up: explain that we are leaving out common knowledge conditions and continuous extensions.

  This plan stays within the discrete, self-contained setting and builds the concept step by step, using a simple two-player example to illustrate the key idea without the complexity of an auction. If you are set on the auction, it might require more time to design and compute, but the two-player example is pedagogically effective and standard.
answer: |-
  ### Teaching Plan: Iterated Elimination via Dominance in Mixed Strategies  

  **Core Objective:**  
  Disrupt the misconception that rationality always yields a single obvious answer. Show that a pure strategy can be strictly dominated by a *convex mixture* of other pure strategies, even when it isn't dominated by any single pure strategy. Use a **discrete-action auction example** requiring no calculus.  

  ---

  ### **Prerequisite Chain & Conceptual Dependencies**  
  *(Sequential building blocks; each must be solid before moving on)*  
  1. **Payoff Matrices & Dominance Basics**  
     - *Purpose:* Transition from decision trees to normal-form games.  
     - *Key Idea:* Players, strategies, payoffs. Strict dominance (pure vs. pure): "Strategy A dominates B if A **always** gives higher payoff, no matter what others do."  
     - *Check:* Students can identify dominated pure strategies in a 2x2 matrix (e.g., Prisoner’s Dilemma).  

  2. **Mixed Strategies as Mathematical Tools**  
     - *Purpose:* Decouple "mixing" as dominance tool vs. actual random play.  
     - *Key Idea:* A mixed strategy is a probability distribution over pure strategies. Emphasize:  
       - "Mixing here is for **comparison**, not prescription."  
       - Expected payoff calculation against opponents' pure strategies.  
     - *Check:* Students compute expected payoffs of a mixed strategy (e.g., 40% A + 60% B) against a fixed opponent action.  

  3. **Dominance by Mixed Strategies**  
     - *Purpose:* Motivate why mixtures can dominate when pure strategies fail.  
     - *Key Idea:* "Strategy X is strictly dominated if there exists a mixture of **other strategies** that beats X in **every possible scenario**."  
     - *Check:* Contrast with pure dominance—e.g., "Why isn’t X dominated by pure Y? Because against action Z, Y loses but the mixture wins."  

  ---

  ### **Explanatory Arc: 75-Minute Workshop**  
  #### **Stage 1: Anchor in Pure Dominance (15 min)**  
  - **Activity:** Simple 2x2 matrix (e.g., Prisoner’s Dilemma).  
  - **Emphasize:**  
    - Iterated elimination reduces options but may not yield a single answer.  
    - "What if no pure strategy dominates another? Does that mean all are rational?" → Tease need for mixed strategies.  
  - **Misconception Addressed:** "Rationality = single obvious answer."  

  #### **Stage 2: Introduce Mixed Strategies as Tools (20 min)**  
  - **Activity:** 3x2 game where a pure strategy (e.g., Middle) is not dominated by any pure strategy but is dominated by a mix.  
    - *Example:*  
      - Rows: Bidder 1’s actions {Low, Medium, High}.  
      - Columns: Opponent’s (aggregated) actions {Weak, Strong}.  
      - Payoffs:  
        ```  
        Opponent: Weak    Strong  
        Low      │ 3      │ 0  
        Medium   │ 2      │ 2  
        High     │ 0      │ 4  
        ```  
    - **Key Observation:**  
      - Medium isn’t dominated by Low or High alone:  
        - Against Weak: Low (3) > Medium (2)  
        - Against Strong: High (4) > Medium (2).  
      - But a 50/50 mix of Low/High:  
        - Against Weak: (0.5×3 + 0.5×0) = 1.5 < 2? → **Not dominant yet!** (Adjust to make it work).  
  - **Fix the Example:**  
    - Revise payoffs to make Medium dominated:  
      ```  
      Opponent: Weak    Strong  
      Low      │ 4      │ 0  
      Medium   │ 2      │ 2  
      High     │ 0      │ 5  
      ```  
      - 50/50 Mix Low/High:  
        - Against Weak: (0.5×4 + 0.5×0) = **2** > Medium (2)? → Strict dominance requires **>**.  
        - Adjust Medium’s payoff against Weak to 1.9 (discrete but fractional) or:  
      **Better Fix (discrete, whole numbers):**  
      ```  
      Opponent: Weak    Strong  
      Low      │ 5      │ 0  
      Medium   │ 2      │ 2  
      High     │ 0      │ 6  
      ```  
      - 50/50 Mix Low/High:  
        - Against Weak: (0.5×5 + 0.5×0) = **2.5** > Medium (2)  
        - Against Strong: (0.5×0 + 0.5×6) = **3** > Medium (2).  
      → **Medium is strictly dominated by the mix.**  
  - **Pedagogical Hook:** "Medium seems safe alone but loses to a 'team' of Low and High."  

  #### **Stage 3: Three-Bidder Auction Example (25 min)**  
  - **Setup:**  
    - 3 bidders, each choose discrete bid: {Low=1, Medium=2, High=3}.  
    - Item value = 4 for all. Hidden reserve price ~ Uniform{1, 2, 3}.  
    - Rules:  
      - Highest bid ≥ reserve wins (ties broken randomly).  
      - Winner pays their bid → payoff = (4 - bid).  
      - Losers get 0.  
  - **Payoff Calculation for Bidder 1 (against 2 opponents playing uniformly random):**  
    - *Pure Strategies:*  
      - **Low (1):** Wins only if reserve=1 AND both opponents bid ≤1 (unlikely).  
        Expected payoff ≈ 0.2 (calculate together).  
      - **Medium (2):** Wins if reserve≤2 AND highest bid.  
        Expected payoff ≈ 1.0 (e.g., reserve=1/2/3 with prob 1/3; opponents randomize).  
      - **High (3):** Wins if reserve≤3, but pays more.  
        Expected payoff ≈ 0.5.  
    - **Convex Mixture (50% Low + 50% High):**  
      - Expected payoff = 0.5×(Low’s payoff) + 0.5×(High’s payoff) ≈ 0.5×0.2 + 0.5×0.5 = **0.35**.  
      - Wait! 0.35 < 1.0? → **Not dominant!**  
  - **Key Adjustment:** Show dominance **against specific opponent profiles**, not uniform randomness.  
    - Focus on two opponent bid profiles: (Low, Low) and (High, High).  
      - Against (Low, Low):  
        - Medium (2): Wins if reserve≤2 → payoff = 2.  
        - 50/50 Low/High:  
          - Low: Wins only if reserve=1 → payoff ≈ 1.  
          - High: Wins if reserve≤3 → payoff = 1.  
          - Mix expected = 0.5×1 + 0.5×1 = **1** < 2.  
      → Medium is **not** dominated here.  
    - Against (Medium, Medium):  
      - Medium: Ties → expected payoff = (4-2)/3 ≈ 0.67 (if tie broken evenly).  
      - 50/50 Low/High:  
        - Low: Loses (opponents bid 2≥reserve).  
        - High: Wins only if reserve≤3 → payoff=1.  
        - Mix expected = 0.5×0 + 0.5×1 = **0.5** < 0.67?  
  - **Critical Insight:** Redesign so mixture dominates **in all scenarios**. Use:  
    ```  
    Reserve price = {2} (deterministic for simplicity).  
    Opponents’ bids: Focus on profiles where Medium is weak (e.g., both opponents bid High).  
    ```  
    - Against (High, High):  
      - Medium (2): Reserve=2, but opponents bid 3>2 → loses. Payoff=0.  
      - Low (1): Loses. Payoff=0.  
      - High (3): Compete with two 3s → 1/3 chance to win. Payoff = (4-3)/3 ≈ 0.33.  
      - 50/50 Low/High: Expected = 0.5×0 + 0.5×0.33 ≈ 0.165 > 0? **Still not.**  
  - **Final Working Example:**  
    - **Add a bidder advantage:** "If tie includes you, you win extra bonus." Not ideal.  
    - **Better:** Adjust payoffs directly (abstract auction):  
      ```  
      Opponent Profiles: X (favorable) vs. Y (unfavorable)  
      Low      │ 4   │ 0  
      Medium   │ 3   │ 1  
      High     │ 0   │ 3  
      ```  
      - Medium not dominated by Low or High alone.  
      - 50/50 Low/High mix: Against X: (4+0)/2=**2** < Medium(3)? No.  
      - **Use asymmetric mix (e.g., 40% Low + 60% High):**  
        Against X: 0.4×4 + 0.6×0 = **1.6** < 3 → Fail.  
      - **Solution:** Ensure mixture > Medium in **both** columns:  
        ```  
        Low      │ 5   │ 1  
        Medium   │ 3   │ 2  
        High     │ 0   │ 4  
        ```  
        30% Low + 70% High mix:  
        - Against X: 0.3×5 + 0.7×0 = **1.5** < 3? → **No.**  
      - **Working Version:**  
        ```  
        Low      │ 6   │ 0  
        Medium   │ 3   │ 2  
        High     │ 0   │ 5  
        ```  
        50/50 Low/High mix:  
        - Against X: (6+0)/2 = **3** > Medium(3)? Need strict >.  
        → Change Medium’s payoff against X to **2.9** (discrete but fractional) or:  
        **Integer Solution:**  
        ```  
        Low      │ 7   │ 0  
        Medium   │ 3   │ 2  
        High     │ 0   │ 6  
        ```  
        50/50 Low/High:  
        - Against X: (7+0)/2 = **3.5** > 3  
        - Against Y: (0+6)/2 = **3** > 2  
        → **Medium strictly dominated.**  
  - **Discussion:** "Medium isn’t ‘bad’ against any single opponent play—it loses to the mix across **all** scenarios."  

  #### **Stage 4: Address Misconceptions (10 min)**  
  1. **"Why not best-respond with pure strategies?"**  
     - "Best responses depend on beliefs. Dominance is belief-free: a dominated strategy is **never** rational, no matter what others do."  

  2. **"Is mixing just averaging beliefs?"**  
     - "No! This mix is a **hypothetical benchmark**. You don’t randomize; you reject Medium because the mix **always** beats it."  

  3. **"Doesn’t iteration leave one strategy?"**  
     - Show post-elimination game (e.g., 2x2 matrix). "Iteration can stop with multiple rational choices—undermining the ‘single answer’ myth."  

  #### **Stage 5: Check for Understanding (5 min)**  
  - **Question:** "In a game, strategy X has payoffs (2, 1) against A/B. Y has (0, 3). Z has (1, 1.5). Is Z dominated by any mix of X/Y?"  
    - *Answer:* 50/50 mix: Against A: 0.5×2 + 0.5×0 = 1 < Z(1)? → Not dominated.  
    - **Key:** Students must identify if there exists *any* mix dominating Z in *all* cases.  
  - **Critical Takeaway:** "Dominance by a mixture means **there exists** a mix that always beats the pure strategy—it says nothing about your own play being random."  

  ---

  ### **What to Omit**  
  - **Epistemic Conditions:** No common knowledge of rationality or infinite regress.  
  - **Continuous Strategies:** No calculus; stick to discrete actions.  
  - **Nash Equilibrium:** Avoid linking to equilibrium concepts; focus solely on dominance.  
  - **Real Auctions:** Simplified payoff matrices > auction micro-details.  

  ### **Why This Works**  
  - **Builds Dependency:** Payoffs → pure dominance → mixed-as-tool → dominance-by-mixture.  
  - **Targets Misconceptions:** Explicitly dismantles "single answer" bias early.  
  - **Self-Contained:** All tools (expected payoffs, mixtures) taught from scratch.  

  --- 
  **Outcome:** Students leave seeing dominance as a **structural property** of the game, not a consequence of beliefs or updating. The auction example (with discrete adjustments) proves a pure strategy can be "inferior on average" even when not directly dominated.
