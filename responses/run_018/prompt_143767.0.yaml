     - The item has a hidden reserve price. The reserve price is randomly drawn from a uniform distribution over {0, 1, 2, 3, 4}. We assume that the bidders do not know the reserve price, but they know the distribution.
     - Rules: The highest bidder wins only if their bid is at least the reserve price. If there is a tie, the winner is chosen randomly among the highest bidders. The winner pays their bid. If no bid meets the reserve, no one wins and no one pays.
     - Payoff: The winner gets the value of the item (which we set to 4 for all) minus their bid. Non-winners get 0. If no winner, all get 0.
     - However, note that the payoff depends on the reserve price and the bids of others. To make the game symmetric and to avoid having to condition on the reserve price in the matrix, we can note that the reserve price is random and independent. Therefore, we can compute the expected payoff for a bidder given the bids of the others, by averaging over the reserve price and the tie-breaking.

     But note: The problem is that with three players and three actions, the payoff matrix is 3x3x3. We can reduce the complexity by assuming symmetry and focusing on one player's perspective against a fixed profile of the others? Alternatively, we can use a two-player game to illustrate the same point? The request says three-bidder. However, the key is to show that for a particular player, the strategy M is dominated by a mixture of H and L, when the opponents are playing uniformly random? Actually, we don't require the opponents to play uniformly random in the definition of dominance. The dominance must hold for every possible pure strategy of the opponents.

     Let me adjust: We want an example where for every possible pure strategy profile of the other players, the mixed strategy (say 50% L and 50% H) gives a higher expected payoff than M. But that might be too strong and hard to construct.

     Alternatively, we can use a two-player game that is simpler and still illustrates the point. I recall the classic example of a game with three strategies for each player:

          Player 2
          L   M   R
      T  0,4 4,0 5,3
  Player1 M  4,0 0,4 5,3
      B  3,5 3,5 6,6

     But note: in this game, the row player's strategy M is not dominated by T or B alone. However, a mixture of T and B (say 50-50) might dominate M? Let's check:

     Against L: 
        T: 0, M: 4, B: 3 -> M is best? 
        Mixture (T and B): 0.5*0 + 0.5*3 = 1.5 < 4 -> so M is better than the mixture against L.

     This doesn't work.

     Another example: 

          L   R
     T   3,? 0,?
     M   0,? 3,?
     B   1,? 1,?

     Here, B is dominated by a mixture of T and M (50-50): 
        Against L: mixture gives 1.5 > 1
        Against R: mixture gives 1.5 > 1

     So B is strictly dominated by the mixture. But we want to eliminate a strategy that is not dominated by any pure strategy. In this case, T and M are not dominated by each other, but B is dominated by a mixture.

     However, the request was for a three-bidder auction. Let me try to design one.

     We design a symmetric 3-player game, each with strategies L, M, H (bids: 1,2,3). The reserve price is uniformly random in {0,1,2,3,4}. The value of the item is 4 for all.

     Consider one player (say player 1). We want to show that for player 1, the strategy M (bid=2) is strictly dominated by a mixture of L and H. We have to show that for every possible bid profile of the other two players, the expected payoff from playing M is less than the expected payoff from the mixture (say 50% L and 50% H). 

     But note: the other two players can choose any of L, M, H. So we have 9 profiles for (player2, player3). We need to compute the expected payoff for player1 when he plays M, and when he plays the mixture, for each of these 9 profiles.

     However, because the reserve price is random, we have to average over the reserve price and also over the tie-breaking. We assume that in case of a tie, the winner is chosen uniformly at random among those who submitted the highest bid that is at least the reserve.

     Let's compute the expected payoff for a given bid by player1, given the bids of the other two.

     Example: Suppose the other two both play L (bid=1). Then:

     - If player1 plays M (2):
          The bids: [2,1,1]. The highest bid is 2.
          Player1 wins if the reserve price <=2. The reserve price is in {0,1,2,3,4}. Reserve<=2 happens with probability 3/5 (reserves 0,1,2).
