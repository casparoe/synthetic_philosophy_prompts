answer: |-
  Here's a reusable, field-ready decision procedure combining counterfactual & interventionist frameworks, designed for wetland restoration teams. Use it during check-ins with a whiteboard or shared doc.

  **Wetland Action Causality Assessment (WACA) Procedure**

  **Core Principle:** We only claim credit/blame if BOTH (1) the outcome *counterfactually depended* on our specific action *AND* (2) our action was an *effective intervention* breaking the right causal dependency. "Maybe" triggers a vote.

  **Required Prep:** Define the SPECIFIC ACTION (A) and SPECIFIC OUTCOME (O) in question *before* starting (e.g., A = "Planting reeds in Zone 3 on May 1st", O = "Water level drop >10cm at Well B by July 15th").

  ---

  **Step 1: Counterfactual Dependence (The "But For" Test)**
  *   **Question:** "Would Outcome (O) *still* have occurred, *in essentially the same way and magnitude*, if we had NOT done Action (A)?" Consider ONLY the absence of A.
  *   **Pass (Our Action *Necessary*?):** Clear evidence O would **NOT** have occurred without A. (e.g., Without installing barrier, flooding definitely wouldn't have happened *here*).
  *   **Fail (Our Action *Irrelevant*?):** Clear evidence O **WOULD** have occurred without A, essentially unchanged. (e.g., Record drought happened anyway).
  *   **Unclear/Vote Needed:** Genuine uncertainty, or O *might* have occurred but likely differently (e.g., less flooding, slower water drop). **VOTE Threshold:** >50% think O would *not* have happened *as it did* without A?
  *   **STOP if FAIL:** **Hard No.** Not our fault/credit for *this specific O*. (e.g., Drought case likely stops here). *Document reasoning.*

  **Step 2: Intervention Effectiveness (The "Knob-Turning" Test)**
  *   **Question:** "Was Action (A) a well-defined *intervention* that *actually changed* the key causal mechanism leading to Outcome (O)? Did it break the right dependency?"
  *   **Pass (Effective Manipulation):** We have evidence A directly manipulated a variable (X) known/suspected to cause O *in this system*, AND we broke a known causal link causing O (e.g., Barrier directly blocked specific water flow path known to cause flooding here; Reed planting targeted transpiration in a way *known* to affect local water table).
  *   **Fail (Ineffective or Wrong Target):** A didn't manipulate a plausibly causal variable for O, OR manipulated something irrelevant/too weak, OR strengthened the cause of O! (e.g., Reeds planted in already dry zone unlikely to *cause* regional drop; Barrier installed downstream of actual blockage).
  *   **Unclear/Vote Needed:** Mechanism plausible but evidence weak, or A manipulated X but link X->O is debated/context-dependent. **VOTE Threshold:** >50% think A effectively intervened on a *real cause* of O?
  *   **STOP if FAIL:** **Hard No.** Even if O depended on A (Step 1), it was likely coincidence or A was ineffective. Not our *meaningful* fault/credit. *Document reasoning.*

  **Step 3: Handling Overdetermination (Multiple Causes)**
  *   **Trigger:** Step 1 is "Unclear/Vote Needed" OR we suspect other significant causes alongside A.
  *   **Question:** "Are there other factors (C1, C2...) that *alone* could have caused O, OR that *combined* with A caused O?"
  *   **Analysis:**
      *   If other factors alone *sufficient* (e.g., massive rainfall alone caused flooding): **A is NOT necessary (Revisit Step 1 → Likely Fail/Hard No).**
      *   If A + other factors *jointly sufficient* but *neither alone sufficient* (e.g., Beaver dam *plus* barrier caused flooding; neither alone would have): **Partial Credit/Blame Possible.**
      *   **VOTE on Contribution:** If partial credit/blame possible, vote on estimated % contribution of A vs. other factors. (Default: Equal split if no strong evidence). *Record %.*

  **Step 4: Claim Resolution**
  *   **Clear Pass (Step 1 Pass & Step 2 Pass):** Claim Credit/Blame for O.
  *   **Clear Fail (Any Hard No):** No Claim on O.
  *   **Partial (Step 3 Vote):** Claim proportional Credit/Blame based on voted %.
  *   **Persistent Unclear:** "Insufficient Evidence to Assign Causality." Record uncertainty. Gather specific data for next time (see Data Flags).

  ---

  **Handling Missing Baseline Data: Critical Flags**
  *   **Step 1 Failure (False Negative Risk):** Without pre-A data on O, you might *wrongly conclude* O would have happened without A. **FLAG:** If no pre-A baseline for O, Step 1 answer is inherently weaker. Lean towards "Unclear/Vote" in Step 1.
  *   **Step 2 Failure (Mechanism Unknown):** Without understanding system dynamics (pre-A relationships), assessing *how* A intervened is guesswork. **FLAG:** If no pre-A data on key variables (water flow, soil moisture, etc.), Step 2 likely "Unclear/Vote".
  *   **General Rule:** Missing baseline data pushes answers towards "Unclear/Vote Needed". Prioritize collecting minimal baseline metrics before future actions!

  ---

  **Application to Your Cases:**

  **Case 1: Reeds Blamed for Water Table Drop During Drought**
  1.  **Step 1 (Counterfactual):** Would the water table have dropped significantly during a *regional drought* even without the reeds? **YES (Fail).** Drought alone was sufficient. **HARD NO.** *Team might hate it, but philosophy is clear: "but for" the reeds, the drop still happens due to drought. Record: "Regional drought primary driver. Reeds insignificant contributor at scale."*
  2.  *(Steps 2-4 Skipped due to Fail)*

  **Case 2: Beavers + Our Barriers Causing Flooding**
  1.  **Step 1 (Counterfactual):** Would the specific flooding (O) have occurred without our barriers (A)? Unclear! Beavers might have caused flooding alone, or barriers might have been essential. **→ Unclear/Vote Needed.** Vote: >50% think flooding *as observed* wouldn't have happened without barriers? (Likely YES - barriers added critical height/volume). **Pass (Via Vote).**
  2.  **Step 2 (Intervention):** Did installing barriers break the right dependency? Barriers directly manipulate water flow path/level - a key cause of flooding. **Pass.** (Assuming barriers were well-placed).
  3.  **Step 3 (Overdetermination):** Beavers are a significant other factor (C1). Could beavers *alone* have caused *this specific* flooding? **Unclear/Vote Needed.** Vote: Could beaver dam alone cause flooding *to this extent/location*? (Likely split vote). **Assume Partial Cause.**
  4.  **Vote on Contribution:** Estimate % contribution: Barriers 50% / Beavers 50% (Default split). Or argue 60/40, 40/60, etc. **Record Vote Result** (e.g., "Barriers 60%, Beavers 40%").
  5.  **Resolution:** Claim **60% of credit** for the flooding (adjust based on vote). Acknowledge beavers' role. *Crucially, this splits credit based on assessed contribution.*

  **Where Missing Data Breaks Down:**
  *   **Case 1:** *Missing baseline:* If no long-term water table data before the drought/reeds, arguing Step 1 becomes purely theoretical ("*Would* the drought alone cause it?"). **→ Forces Vote in Step 1.**
  *   **Case 2:** *Missing baseline:* If no pre-beaver/pre-barrier data on water flow rates/levels at the exact spot, Step 1 (Could beavers alone cause it?) and Step 2 (Did barriers *actually* change flow significantly?) become highly speculative. **→ Forces Votes in Step 1 AND Step 2, making Step 3 % highly uncertain.**

  **Procedure Summary:**  
  `Define A & O` → `Step 1: But For Test? (Fail=Hard No)` → `Step 2: Knob-Turning Test? (Fail=Hard No)` → `Step 3: Multiple Causes? (Partial?)` → `Step 4: Assign Credit/Blame (Full, None, Partial %)`  
  **Vote** at Unclear steps. **Flag** data gaps. **Document** every answer & vote.

  This forces structured thinking, integrates both key causal theories, handles complexity, and makes uncertainty explicit. Good luck tomorrow!
