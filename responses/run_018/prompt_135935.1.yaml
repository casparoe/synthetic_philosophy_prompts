  Applying to case 1 (reeds blamed for drought): Counterfactual analysis should show the drought would still lower water tables without reeds → "not our fault." But the team might resist, so I'll note where voting applies. For case 2 (beavers + barriers causing flooding): Here, both factors could contribute. The procedure should distinguish between necessary causes and additive effects, possibly splitting credit via voting.

