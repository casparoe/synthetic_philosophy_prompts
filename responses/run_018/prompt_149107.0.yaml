prompt: |-
  I just finished a long and rather heated argument with a friend about whether biography can teach morality or whether it always collapses into either worship or gossip. Rather than picking a side, I want to settle the matter by building something reusable: I am a secondary-school ethics curriculum designer, and every semester I must decide which lives our students read and how we frame them, knowing that students will imitate what they see whether I intend it or not. I need an operational decision procedure—a checklist in strict order, with stopping conditions and explicit judgment-flag points—to determine whether a given biography is pedagogically usable for moral formation, not merely historically informative.

  The principle I want translated draws on Plutarch’s practice of pairing lives to reveal character through comparable moral trials, but corrects it with an awareness of how hagiography and cynical debunking both destroy what makes a life instructive. I will call the core idea moral contingency: a biography teaches virtue only when it preserves moments where the subject’s character was genuinely open, where virtue and vice competed within the same person, and where the outcome was not predetermined by nature, narrative design, or retrospective justification. Hagiography destroys contingency by smoothing friction points into an inevitable arc of grace; cynical debunking destroys it by reducing every apparent virtue to hidden self-interest. The usable biography keeps the friction visible and allows the reader to inhabit the choice rather than admire or condemn from a distance.

  Please act as an expert in moral philosophy, the philosophy of biography, and curriculum design. Before constructing the tool, spend a few minutes brainstorming the conceptual translations required to turn this principle into a practitioner-level instrument without losing its philosophical content—specifically, which distinctions must survive simplification and which can be dropped, and where the procedure will necessarily misfire.

  Then deliver the procedure. It must be runnable by a non-specialist teacher in about thirty minutes per text. Structure it as ordered questions with: (a) what counts as a sufficient answer to continue, (b) what triggers an immediate “no,” and (c) explicit flags where the decision is a value judgment rather than a fact. Include small structural tests (sentence-level or narrative-arc checks) that reveal hagiographic smoothing and cynical reduction without requiring psychological expertise. State clearly what the procedure cannot do—what moral learning it excludes, where it will misfire, and which judgments remain with the practitioner.

  Apply the procedure to three cases:

  1. A widely assigned classroom biography of a celebrated twentieth-century scientist that frames her perseverance as innate, glosses over her documented collaboration with wartime military medicine, and treats a well-known extramarital relationship as purely private and therefore morally irrelevant to her exemplarity.
  2. A recent polemical biography of a beloved humanitarian that explains every charitable act as strategic reputation management and every moral risk as calculated self-interest, leaving no structural space for genuine virtue.
  3. A biography structured as an explicit parallel comparison—one political figure on the left and one on the right facing the same institutional crisis—in which both subjects make genuinely open choices, fail visibly, and are not redeemed by narrative closure.

  For case 1, the procedure should deliver the answer that is philosophically correct but that I, the asker, will likely dislike, because I have taught with that biography for years and find it inspiring. Be explicit about that tension.

  Finally, note what the procedure cannot settle—such as whether moral contingency is sufficient for pedagogical use, or whether some lives are too damaging to present regardless of narrative structure.

  End with a single line beginning “Verdict:” summarizing whether the procedure succeeds in preserving the philosophical core without collapsing into mere taste.

  Please think carefully step by step, and present the final procedure in a clear ordered format with the worked cases integrated.
reasoning: |-
  Hmm, this is a fascinating challenge from an ethics curriculum designer. They're wrestling with how to select biographies that truly teach morality without falling into hagiography or cynicism. The core concept they want operationalized is "moral contingency" - preserving those raw moments where character is tested and choices aren't predetermined.

  First, I need to unpack what makes this tricky. Moral contingency is subtle - it's about narrative spaces where virtue and vice actually compete within a person, not smoothed-over saintliness or reduced-to-nothing selfishness. Teachers aren't philosophers, so I must translate this into concrete textual features they can spot: things like how flaws are framed, whether failures have real consequences, and if motivations feel human rather than predetermined.

  Key distinctions to preserve:
  - Open choices vs inevitable outcomes
  - Internal moral friction vs external obstacles
  - Complex motives vs singular drives
  - Irreducible virtues/vices vs explained-away qualities

  What I can safely drop:
  - Deep psychological analysis
  - Historical accuracy verification (assume texts are factual)
  - Ultimate moral judgments about the subject

  The procedure must detect two failure modes:
  - Hagiography's "smoothing" (flaws as charming quirks, failures as necessary steps)
  - Cynicism's "reduction" (no act escapes selfish interpretation)

  For the test cases:
  That scientist biography they love? It'll likely fail - innate perseverance and glossed-over collaboration are classic hagiography. The humanitarian takedown? Pure cynicism. The parallel lives example? Perfect contingency showcase.

  Big limitations to flag:
  - Can't assess if a life is too disturbing for students
  - Doesn't cover how to teach the text well
  - Moral contingency alone isn't sufficient - it's necessary but not everything

  The checklist structure should flow logically:
  1. Screen for obvious disqualifiers
  2. Hunt for contingency markers
  3. Check for both virtues and vices being irreducible
  4. Assess narrative framing

  Final verdict hinges on whether it catches the core philosophy while remaining usable. That tension between philosophical purity and classroom practicality is exactly what the user needs navigated.
answer: |-
  ### Operational Decision Procedure: Moral Contingency Evaluation for Biographies  
  **Philosophical Core Preserved**: Moral contingency requires biographies to show:  
  - **Open moments**: Points where the subject’s choice was not predetermined.  
  - **Internal friction**: Virtue and vice coexist and compete.  
  - **Irreducible complexity**: Virtues are not sanitized; vices are not cynically reduced.  
  - **Unresolved outcomes**: No narrative "redemption arcs" that erase ambiguity.  

  **Key Simplifications**:  
  - **Dropped**: Deep historical context, psychological theories of motivation, subject’s ultimate moral worth.  
  - **Preserved**: Narrative structure, framing of choices, handling of flaws/virtues, textual patterns.  
  - **Misfires When**: Subject’s actions are universally condemned (e.g., violent criminals) or texts are purely fictional.  

  ---

  ### The Procedure: Ordered Checklist  
  **Time**: ~30 minutes per text. **Materials**: Biography, highlighter, notepad.  
  **Instructions**: Answer sequentially. Stop at any "NO" or "FLAG."  

  1. **Does the biography explicitly frame the subject as inherently virtuous or villainous?**  
     - *Sufficient to continue*: No inherent framing (e.g., avoids "born a genius/hero").  
     - *Immediate NO*: Uses deterministic language (e.g., "destined for greatness," "incorrigibly corrupt").  
     - *FLAG*: Judgment call on whether framing is implicit (e.g., "naturally resilient" vs. circumstantial).  
     - *Test*: Scan first/last chapters for phrases like "inevitable," "from birth," "always."  

  2. **Are there ≥3 documented failures or flaws presented as morally significant?**  
     - *Sufficient to continue*: Flaws are integral to key choices (e.g., dishonesty during a crisis).  
     - *Immediate NO*: Flaws omitted, minimized ("private matters"), or treated as virtues ("necessary ruthlessness").  
     - *FLAG*: Whether flaws are trivialized versus consequential.  
     - *Test*: Highlight flaws; if none affect the subject’s reputation/success, reject.  

  3. **Are ≥2 virtues presented without cynical reduction?**  
     - *Sufficient to continue*: Virtues stand unexplained or with internal conflict (e.g., "helped despite personal cost").  
     - *Immediate NO*: All virtues reduced to self-interest (e.g., "charity for fame").  
     - *FLAG*: Distinguishing reduction from contextual explanation.  
     - *Test*: Find a virtuous act; if immediately followed by "but this served…" reject.  

  4. **Does the narrative show ≥1 "open moment" where the subject’s choice was uncertain?**  
     - *Sufficient to continue*: Describes deliberation, alternative paths, or stakes (e.g., journals showing doubt).  
     - *Immediate NO*: Outcomes predetermined by narrative (e.g., "this strengthened her resolve").  
     - *FLAG*: Assessing if alternatives are plausible.  
     - *Test*: Identify a crisis; if no evidence of hesitation/regret, reject.  

  5. **Is there unresolved moral tension?**  
     - *Sufficient to continue*: Ambiguity remains post-choice (e.g., success with ethical cost).  
     - *Immediate NO*: Clear redemption ("they learned") or downfall ("they deserved it").  
     - *FLAG*: Whether closure feels contrived.  
     - *Test*: Read the aftermath of a failure; if blame is deflected or lesson stated, reject.  

  **Final Decision**:  
  - **Usable** if all steps passed.  
  - **Not Usable** if any "NO" or unresolved "FLAG."  

  ---

  ### What the Procedure Cannot Do  
  - **Excludes**: Non-narrative moral learning (e.g., abstract principles), lives with extreme harm (e.g., perpetrators).  
  - **Misfires**: On highly obscure figures (lacks documentation), or subjects with no recorded flaws (rare).  
  - **Requires Practitioner Judgment**: Age-appropriateness, cultural context, complementary pairing (à la Plutarch).  
  - **Limitation**: Contingency is necessary but not sufficient—may still require teacher guidance to avoid imitation.  

  ---

  ### Worked Cases  

  **Case 1: Celebrated Scientist Biography**  
  - Step 1: "Innate perseverance" → *Immediate NO* (deterministic framing).  
  - Step 2: Collaboration glossed over, affair deemed "private" → *NO* (flaws minimized).  
  - **Verdict: NOT USABLE.**  
    - *Tension noted*: Inspiring but fails contingency by smoothing friction. Philosophically, it teaches admiration, not moral reasoning.  

  **Case 2: Polemical Humanitarian Biography**  
  - Step 3: Every act reduced to "reputation management" → *Immediate NO* (cynical reduction).  
  - **Verdict: NOT USABLE.**  
    - Destroys contingency by eliminating virtue’s possibility.  

  **Case 3: Paired Political Figures**  
  - Step 1: No inherent framing → *Continue*.  
  - Step 2: Both fail visibly → *Continue* (flaws consequential).  
  - Step 3: Virtues presented without reduction (e.g., "risked career for principle") → *Continue*.  
  - Step 4: Shows open choices (e.g., "considered compromise") → *Continue*.  
  - Step 5: Failures unresolved → *Continue* (no redemption).  
  - **Verdict: USABLE.**  
    - Contingency preserved through parallel trials and unresolved outcomes.  

  ---

  **Verdict:** The procedure succeeds in preserving moral contingency’s core by converting friction, irreducibility, and openness into detectable narrative patterns, avoiding collapse into taste.
