answer: |-
  **The Unborrowed Light**

  Here thought sustains itself, complete, alone,
  Requires no audience, no flesh to feed—
  This self-sustaining flame is never done.

  The laurel fades when admiration's flown,
  The lamp of glory gutters without heed,
  Requires no audience, no flesh to feed.

  The cherished gaze withdrawn, love turns to stone,
  The sweetest touch grows stale, a withered weed—
  This self-sustaining flame is never done.

  Ambition's mirror cracks, left cold, unknown,
  Reflecting nothing but a hollow need,
  Requires no audience, no flesh to feed.

  The body tires, the keenest thrill is blown,
  To dust returns what once was sharp and freed—
  This self-sustaining flame is never done.

  Prejudice clouds the joy that others own,
  Or shifts with every wind, a broken reed,
  Requires no audience, no flesh to feed.

  Yet shadows hold their beauty, brightly shown,
  Though borrowed light must fail, and passions bleed—
  **This self-sustaining flame is never done,**
  **Requires no audience, no flesh to feed.**
