  In the final quatrain, both refrains stand juxtaposed—study as foundation, other passions as fleeting supplements. I'll avoid merging them, honoring du Châtelet's view that happiness requires study's stability even as other passions offer unstable joy. The language must stay vivid, using metaphors like extinguished lamps or fading mirrors, to keep it lyrical yet true to her distinctions. 

