  I hold the view that Pascal's mugging is not merely a quantitative edge case for expected-utility theory with unbounded payoffs, but reveals a structural defect in pure evidentialism about belief revision: a rational agent should treat demands on credence as governed by a prior "budget of cognitive commitment," such that any proposal falling outside the conceptual and practical framing for which the agent has already incurred fixed costs is not an evidential challenge but a category mistake about the scope of practical reasoning. On this account the mugging dissolves without arbitrary caps on utility or credence, because the mugger's scenario was never within the domain of belief revision to begin with. What would genuinely count against this position? I want the arguments, formal analogues, and intuitive cases that should move me, sorted from decisive to merely awkward. Specifically: (i) results in decision theory or AI alignment showing that such budgets either collapse back into standard Bayesian updating or generate worse paradoxes of their own; (ii) clear cases where refusing to update on an out-of-frame but genuinely possible outcome seems irrational rather than reasonable; (iii) whether the view can be qualified into unfalsifiability—for instance, by redefining any successful mugging as within-frame post hoc—and whether that insulation is a theoretical virtue or a fatal defect; and (iv) what defenders of this view should themselves concede as counting against them, not only what critics allege. Please rank the defeaters, distinguish live objections from merely logical possibilities, and assess honestly whether the position risks anything substantive or has been protected into emptiness. I am especially persuaded by structural and formal objections, but I want the full map of its exposure, including where its defenders would rightly admit damage.
