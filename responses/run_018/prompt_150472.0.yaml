  *checks Lewis's original paper mentally* Yes, the key is that in their model, when you evaluate "if A then C", you're not adding a new proposition to your current space - you're temporarily shifting to the submodel where A holds. So the conditional never gets a probability value in the original space, sidestepping Lewis's requirement that P(A→C) = P(C|A) for all probability measures.

  *strokes chin* The user's second insight is also sharp - Lewis's result reveals conditionals can't have context-independent probabilities. Their "conservative fix" question is spot-on: rejecting P(if A then C)=P(C|A) would be overkill when the real issue is propositionalization. 

  *warming up* I should emphasize how their subspace approach naturally dissolves the paradox. Ordinary reasoners don't assign probabilities to conditionals-as-objects; they perform context-bound evaluations. The multi-measure framework they mention (like lexicographic probabilities) would be overengineering unless they need iterated conditionals.

  *mental note* Must clarify why conditioning itself doesn't cause collapse: when you condition on A, you're not claiming P(A→C) exists in the prior model. Lewis's trap only springs when you try to make conditionals into propositions within the space they operate on.

