    "core_question": "Does successful cross-modal identification using sensory-substitution devices require a pre-existing shared amodal representational format, showing Molyneux's problem hinges on this format rather than innate ideas vs. learned associations?",
    "why_standard_framing_fails": "Locke vs. Leibniz debate focuses on origin of spatial concepts (innate vs. association) but assumes separate sensory data streams, overlooking the necessity of a common representational medium for cross-modal identification to even be possible.",
    "week_by_week_method": "Week1: Molyneux/SSD basics. Week2: Analyze SSD user reports & philosophy of identification. Week3: Map SSD experience to representational theories & argue for/against shared format. Week4: Synthesize answer, scope check, finalize paper.",
    "success_vs_failure": "Success: Clear answer (Yes/No/It-Depends) to core question, grounded in SSD data & philosophy, showing how SSD reframes Molyneux via a workshop paper. Failure: Unclear conclusion, weak SSD-philosophy link, bogged down in detail, missed deadline.",
    "scope_risk": "Achievable: Deep lit review on SSD phenomenology, philosophical analysis, synthesis paper. Risky: New user interviews. Out: Neuroimaging, building SSDs, large surveys, deep historical dive.",
    "defense_against_neuroscience_objection": "Uses SSD data as a conceptual probe to analyze necessary conditions for cross-modal ID (nature of representation, demonstrative thought, perceptual content), making it philosophy of mind focused on meaning & structure, not neural modeling or device efficacy.",
    "niche_injection": "Uses sensory-substitution devices (artificial cross-modal translation where user knows it's decoding) to create a modern parallel to Molyneux, forcing the question of representational format over innate ideas."
  }
