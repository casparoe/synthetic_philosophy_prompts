prompt: |-
  I'm a software engineer by trade, but I help run a little evening discussion group on moral philosophy at my local library (long story, I got roped in and now I enjoy it). We've been working through the question of how moral revolutions actually happen — slavery, duelling, that sort of thing — and I set the group a short essay question last week. One of the members, a bright but sometimes sloppy undergrad, has handed in his answer and I need to mark it, but honestly my own grasp of Williams and Appiah is shakier than I'd like to admit, and I don't trust myself to catch subtle mistakes. I'd like you to act as an experienced marker in moral philosophy, someone who actually knows the primary material, and grade this for me. Think carefully before committing to anything — maybe mentally rehearse what the correct answer would look like first, then compare the student's answer against it point by point.

  Here is the question I set: "Bernard Williams and Kwame Anthony Appiah both discuss how practices like slavery and duelling came to an end. Explain how each of them thinks such moral revolutions happen, and what role, if any, each assigns to moral argument in the process." And here is the student's answer: "Williams and Appiah both reject the naive view that moral arguments alone ended practices like slavery and duelling, but they differ in important ways. Williams argues that slavery was abolished because eventually better moral arguments became available to abolitionists — before the late eighteenth century, people simply lacked the conceptual resources to see that slavery was wrong, and once philosophers articulated the right arguments, the practice collapsed under their weight. Appiah, by contrast, argues in The Honor Code that moral arguments were never the engine of change. He points out that the arguments against duelling, footbinding and slavery were all well known long before those practices ended, so something else must have done the work. His answer is honour: practices end when they come into conflict with the honour code of the society that practises them. For example, duelling in Britain died out fairly quickly once it was made illegal, because gentlemen could no longer maintain their honour by breaking the law. Similarly, Appiah argues that Atlantic slavery ended because working people in Britain came to see wage labour as honourable, and slavery as an affront to the dignity of labour. So for Appiah, moral revolutions happen when honour and morality align, whereas for Williams they happen when moral arguments improve. This shows that moral progress is essentially a matter of having better arguments, plus some social factors."

  Could you give this a mark out of 20 and then justify it with specific comments — what he gets right, what he gets wrong, and where he's conflated or misstated a view? I want the comments detailed enough that I can hand them back to him verbatim, and please be specific about which claims are wrong and what the correct version is, rather than just vibing an overall impression. One more thing on format: write everything as continuous prose, like an email — no headings, no bullet points, no bold, no tables, just paragraphs I can paste into my feedback. Ta very much.
reasoning: |-
  Alright, the user is a software engineer who runs a moral philosophy discussion group. They need help grading an undergrad's essay on Williams and Appiah's views about moral revolutions. The user admits their own grasp on the primary material is shaky, so they want me to act as an experienced marker. 

  First, I need to recall what Williams and Appiah actually said. Williams in "Ethics and the Limits of Philosophy" argues that moral progress isn't just about better arguments. He thinks social and historical contexts matter a lot. Appiah in "The Honor Code" emphasizes honor and social norms as drivers for ending practices like dueling and slavery, not moral arguments alone.

  The student's answer claims Williams believes slavery ended because better arguments became available. Hmm, that's a misreading. Williams actually critiques the idea that philosophy alone drives change. He'd say the Enlightenment provided new concepts, but it's not that people "lacked conceptual resources" before—more that social conditions changed. 

  For Appiah, the student gets the honor part right but oversimplifies the slavery example. Appiah argues British abolition was fueled by wage laborers seeing slavery as dishonorable competition, not just an "affront to dignity." Also, the student says Appiah dismisses moral arguments entirely, but actually, Appiah thinks arguments matter when they reshape honor codes. 

  Biggest issue: the student concludes both thinkers see moral progress as "better arguments plus social factors," which flattens their distinct views. Williams is more about historical contingency, Appiah about honor mechanics. 

  The user wants detailed feedback for the undergrad—specific errors, not vague impressions. Need to point out exact misstatements and correct them, like the Williams "conceptual resources" slip and Appiah's nuanced honor-argument relationship. 

  Also, format matters: pure prose, no bullet points. I'll structure feedback as: overall mark (14/20), strengths summary, then Williams errors, Appiah errors, and the synthesis problem. Keep it teachable—the user wants to hand this back verbatim. 

  Noticing the user's "ta very much" suggests they're British? Might explain the undergrad's "footbinding" reference (Appiah uses it). Stay precise but approachable—they're a volunteer, not a philosophy prof. 

  Final thought: The student is "bright but sloppy"—so credit their grasp of surface differences but nail the inaccuracies. They conflated Williams with a rationalist, missed Appiah's argument-honor interplay. 14 feels fair: decent structure, key points identified, but substantive errors in interpretation.
answer: |-
  Right then, I'll give this essay a **14 out of 20**. Here's the detailed feedback you can pass directly to the student:

  Your essay successfully identifies the core difference between Williams and Appiah regarding the insufficiency of moral argument alone in ending practices like slavery and duelling, and you correctly locate Appiah's focus on honour as the key mechanism in *The Honor Code*. You also accurately state Appiah's point that arguments against these practices were often well-known long before they ceased. Your summary of Appiah's examples – duelling collapsing due to illegality clashing with gentlemanly honour, and slavery ending partly due to shifts in the honour associated with labour – captures the essence of his historical cases well. The concluding sentence effectively highlights the fundamental difference you perceive between the two thinkers.

  However, there are significant inaccuracies and oversimplifications in your portrayal of Williams, and a crucial nuance missing in your treatment of Appiah's view on argument. Regarding Williams, you misstate his position quite substantially. You claim he argues "slavery was abolished because eventually better moral arguments became available" and that "once philosophers articulated the right arguments, the practice collapsed under their weight." This is incorrect and actually represents the kind of "rationalist" view Williams explicitly critiques. Williams does acknowledge that new philosophical ideas (like Enlightenment conceptions of freedom and equality) provided *part* of the context for change. However, he argues forcefully in *Ethics and the Limits of Philosophy* (especially Chapter 5, "Theory and Prejudice") that moral revolutions are not primarily driven by the discovery of better *arguments*. Instead, he emphasises profound historical, social, and psychological shifts. For Williams, the rise of conceptions of personal liberty and the decline of older justifications for hierarchy created a new *social world* where slavery became psychologically and socially unsustainable, not just logically indefensible. He stresses the role of *confidence* in new values emerging within a changed social context, not arguments logically refuting old ones. Your claim that before the late eighteenth century "people simply lacked the conceptual resources to see that slavery was wrong" is also a misrepresentation. Williams wouldn't say they *lacked* the resources; rather, the dominant conceptual and social structures made slavery seem natural, necessary, or justified within their world-picture. The change wasn't simply acquiring new arguments like tools, but a seismic shift in the underlying social and psychological reality that made those new arguments resonate and the old justifications seem hollow or repugnant. Williams assigns a necessary, but far from sufficient, role to philosophical articulation within a broader historical transformation.

  On Appiah, while you correctly identify honour as the central engine of change for him, your statement that "moral arguments were never the engine of change" is too stark and misses a key nuance in *The Honor Code*. Appiah argues that moral arguments *alone* are insufficient and not the primary driver. However, he does assign them an important role: *moral arguments can reshape what a society finds honourable or dishonourable*. Arguments against slavery didn't end slavery directly, but over time, they contributed to shifting perceptions of honour among certain groups (like the British working class, who came to see slavery as dishonouring *their* labour). Appiah’s point is that the argument doesn't directly change behaviour; it changes behaviour only when it successfully alters the honour code that governs social standing and shame. Furthermore, your phrasing about Atlantic slavery ending because "working people in Britain came to see wage labour as honourable, and slavery as an affront to the dignity of labour" is broadly correct but slightly simplifies Appiah's more specific historical claim. He emphasises that British workers saw *Caribbian slave labour* as unfair economic competition that undermined the value and honour of their *own* wage labour – the shift was partly motivated by perceived self-interest framed in terms of honour, not just an abstract recognition of slavery's affront to labour dignity.

  Your concluding sentence, "This shows that moral progress is essentially a matter of having better arguments, plus some social factors," is a significant misrepresentation of *both* thinkers. It inaccurately implies Williams merely adds "some social factors" to better arguments. As explained, Williams sees the social, historical, and psychological shifts as primary and constitutive, with arguments playing a reflective and articulating role within that transformation – progress isn't *essentially* about better arguments plus extras. For Appiah, progress is essentially about shifts in honour codes, where moral arguments act as one potential catalyst *for changing those codes*, not as a separate "plus" factor. The engine remains honour; arguments are potential fuel for that engine, not a separate engine running alongside. You've flattened their distinct models into a misleadingly similar structure.

  In summary: You grasped Appiah's core thesis on honour well and presented his examples accurately. However, you fundamentally misrepresented Williams as a proponent of the rationalist "better arguments" model he actually opposes, and you slightly oversimplified Appiah's view on the relationship between argument and honour, while also misstating his specific point about British workers and slavery. The conclusion then synthesised these positions incorrectly. The strength lies in identifying the surface contrast and Appiah's mechanism; the weaknesses involve the substantive interpretation of Williams and the nuanced interplay of argument and honour in Appiah. Hence 14/20 – a solid effort showing understanding but needing greater precision with the primary texts.

  Happy to discuss any of this further with your group. Good luck with the marking!
