prompt: |-
  I run a small philosophy seminar for final-year undergrads, about eight people, one 70-minute session. We’ve covered basic metaethics but not in loads of detail. I want a runnable in-class game that makes them feel the Frege-Geach problem for expressivism in their bones, not just on paper. The tension is that moral sentences express an attitude like disapproval, but embed them in an ‘if’ or ‘not’ and that attitude seems to vanish — yet we still run modus ponens over them. I was arguing with my flatmate about this last night and she thinks expressivism is obviously true, so I want the activity to be a bit in the weeds: split the group into two teams, one using pure expressivism and one using a hybrid strategy where embedded moral sentences do semantic ascent and merely mention the attitude rather than expressing it. Give me rules, roles, materials, and a consistency/payoff scheme that needs no real money — maybe coherence points versus expressive-force points. Use a concrete scenario like lying to protect a friend. They should have attitude cards (red for disapproval, green for approval) that can only be played in unembedded assertoric slots; in embedded positions they must write on a neutral ‘mention card’ instead. Have them build a chain of reasoning and discover the breakdown themselves. Include a timeline, a debrief that maps each moment onto Frege’s idea of assertoric force and Geach’s embedding objection, and an honest note on which feature the game can’t reproduce — probably the precise content-force distinction in Frege’s original account. Also tell me what will predictably go wrong the first time — I imagine someone cheats by playing a card in an embedded slot — and how to handle it. Write everything in British English please, and don’t include a bibliography or reading list, just the design. Fianlly, keep it niche enough that it’s not the standard classroom demo everyone has seen.
reasoning: |-
  We are going to design an in-class game to illustrate the Frege-Geach problem for expressivism. The core idea is to have students experience the tension between expressing an attitude (like approval or disapproval) in unembedded contexts and the loss of that expression when the same moral sentence is embedded (e.g., in a conditional or negation). We'll split the group into two teams: one using pure expressivism and the other using a hybrid strategy (semantic ascent for embedded contexts).

  **Game Title:** Attitude & Embedding: The Frege-Geach Challenge

  **Scenario:** Lying to protect a friend. We'll use a specific example: "Lying to protect a friend is wrong." We'll build a chain of reasoning that uses modus ponens, for instance:

  1. If lying to protect a friend is wrong, then telling the truth and exposing your friend is right.
  2. Lying to protect a friend is wrong.
  3. Therefore, telling the truth and exposing your friend is right.

  But note: In expressivism, (1) is a conditional that does not express disapproval of lying, and (2) does express disapproval. How can we then use modus ponens to get (3) which expresses approval? The problem is that in (1) the moral sentence is embedded and so doesn't express the attitude, but in (2) it does. The hybrid team will use mention (semantic ascent) for the embedded occurrence in (1).

  **Materials:**
  - Coloured cards: 
    - Red cards (for disapproval) - one side says "DISAPPROVAL" and the other side is blank for writing the specific content, e.g., "Lying to protect a friend".
    - Green cards (for approval) - similarly, one side "APPROVAL", the other blank.
    - Neutral cards (white) for mention: one side says "MENTION", the other blank. On the blank side, they can write the content and the attitude being mentioned (e.g., "the attitude of disapproval towards lying to protect a friend").
  - Whiteboard or flip chart to build the chain of reasoning.
  - Markers.

  **Roles:**
  - Two teams (4 students each, or adjust as needed):
    - **Team Expressivism (Pure):** They must express attitudes (using red/green cards) only when the moral sentence is asserted (unembedded). In embedded contexts, they are not allowed to express an attitude, but they are also not allowed to use mention. They must try to build the argument without any attitude in the embedded parts. This will cause a problem when they try to use modus ponens because the premises won't connect properly.
    - **Team Hybrid:** They use expressivism for unembedded assertions and semantic ascent (mention) for embedded contexts. So in embedded positions, they write on a neutral card what attitude is being mentioned (without expressing it).

  **Rules:**
  1. The game is played in rounds. Each team will build the same chain of reasoning (the modus ponens argument above) step by step.
  2. For each step (each premise and conclusion), the team must decide whether the moral sentence is embedded or unembedded and choose the appropriate card:
     - Unembedded assertion: Use a red or green card (expressing disapproval or approval). Write the content on the blank side (e.g., "Lying to protect a friend is wrong") and place it on the board with the coloured side showing to indicate the attitude.
     - Embedded context (e.g., in a conditional, negation, etc.): Use a white neutral card (mention). Write on it the content and the attitude that would be expressed if unembedded, but in a mentioned form (e.g., "the proposition that lying to protect a friend is wrong, which expresses disapproval"). Place it with the "MENTION" side showing.
  3. The chain must be built in order: first premise (the conditional), second premise (the unembedded moral claim), then the conclusion.
  4. **Scoring (Coherence vs Expressive Force points):**
     - **Coherence Points:** Awarded when the team's chain of reasoning is logically valid (i.e., modus ponens works). Each step must follow from the previous in a way that preserves truth (or, in this case, the appropriate semantic property). The modus ponens inference must be supported by the cards played.
     - **Expressive Force Points:** Awarded for correctly expressing the attitude when required (unembedded) and for correctly using mention (without expressing) when embedded.
     - **How to score:**
       - For Team Expressivism (Pure): 
          - They get expressive force points for correctly using a red/green card in the unembedded second premise and in the conclusion (if they manage to express an attitude there). 
          - But they lose coherence points because in the first premise (conditional) they cannot express an attitude and so the conditional does not have the same content as in the second premise (which does express). Thus, modus ponens fails.
       - For Team Hybrid:
          - They get expressive force points for the second premise (using a red card) and for the conclusion (using a green card, if they do) but note the conclusion is unembedded so they should use a green card. 
          - They get expressive force points for the first premise because they correctly use a mention card (neutral) for the embedded occurrence.
          - They get coherence points because by mentioning the attitude in the first premise, they preserve the content (as a proposition) and so modus ponens can work.

  5. **The Problem for Pure Expressivism:** The pure expressivism team will have trouble because in the conditional they have a moral sentence that is not expressing an attitude. So when they assert the second premise (which does express disapproval) it is not clear how that connects to the conditional. The conditional might be understood as having a different kind of content (non-cognitive) that doesn't match the assertive content of the second premise. Hence, modus ponens fails.

  **Timeline (70-minute session):**
  - **0-10 mins:** Introduction. Explain the scenario and the rules. Split into teams and assign roles. Hand out materials.
  - **10-30 mins:** Game play. Each team builds the argument on their own section of the board. They have 20 minutes to discuss and place their cards for each step (premise 1, premise 2, conclusion). The tutor circulates to answer questions and ensure rules are followed.
  - **30-50 mins:** Presentation and scoring. Each team presents their chain and explains their choices. The tutor then awards coherence and expressive force points (as per above) and explains why.
  - **50-70 mins:** Debrief and mapping to Frege-Geach.

  **Debrief:**
  - Map the game to the Frege-Geach problem:
    1. **Assertoric Force (Frege):** In unembedded assertions (like the second premise), the moral sentence has assertoric force and expresses an attitude (the red/green card). This is the force of assertion.
    2. **Embedding (Geach):** When the same moral sentence is embedded (in the conditional, premise 1), it loses that force. In pure expressivism, without semantic ascent, the meaning changes and modus ponens fails (loss of coherence). In the hybrid approach, by mentioning the attitude, we preserve the content (as a proposition) and so the logical inference is saved, but at the cost of having to explain what that mentioned content is (and whether it's still expressivist).
  - What the game cannot reproduce: The precise content-force distinction in Frege's original account. Frege thought that the same content (thought) could be asserted (with force) or unasserted (as in a conditional). Expressivism traditionally has trouble because the content is tied to the attitude. The game simplifies by having the hybrid team use mention to capture the content, but in reality, expressivists need a more sophisticated account of how the same content can be both expressed and embedded.

  **What might go wrong:**
  - **Cheating:** A student might play a red/green card in an embedded slot (especially in Team Expressivism). How to handle: The tutor should be vigilant and remind the teams of the rules. If it happens, pause the game and explain: "Remember, in the conditional, you cannot express the attitude because you are not asserting the moral sentence. You are only supposing it. So you can't use a red card here. Try again."
  - **Confusion about embedding:** Students might not recognize what counts as embedded. Solution: Provide clear examples and non-moral examples first. For instance, in the conditional "If it rains, the street is wet", the antecedent is embedded. In our case, the moral sentence is in the antecedent.
  - **Hybrid team might struggle with how to write the mention card:** Provide a template: "The attitude of [disapproval/approval] towards [action]". Also, they might be unsure if the conclusion should be mentioned or expressed (it should be expressed because it's asserted).

  **Honest note:**
  The game simplifies by having the hybrid team use mention to stand for the proposition. But in the actual philosophical debate, hybrid expressivists don't necessarily resort to mention; they might have a more complex theory. Also, the game does not capture the full depth of Frege's content-force distinction because we are using cards to represent attitudes and mention, which are not exactly Frege's notions. However, the game does make the problem tangible and shows why expressivism faces a challenge and how one might try to solve it.

  This design is niche because it focuses on a specific argument (modus ponens) and uses a card-based representation that forces students to confront the attitude expression in embedded vs unembedded contexts. It also splits the group into two distinct strategies to highlight the trade-offs.

  Now, let's write the rules and materials in British English and without any references.
answer: |-
  Below is a complete design for your in-class game, tailored for a 70-minute session with eight students. It focuses on the **Frege-Geach problem** using a concrete lying scenario, team-based strategy (pure expressivism vs. hybrid), and a card system to simulate attitude expression/mentioning. The game forces students to confront how embedded moral sentences (in conditionals/negations) "lose" expressive force, sabotaging logical inference like modus ponens.  

  ---

  ### **Game Design: "Attitude & Embedding"**  
  **Core Tension:** Pure expressivism struggles to explain why modus ponens works with moral conditionals (e.g., "If lying is wrong, then...") since the attitude "vanishes" under embedding. The hybrid team uses semantic ascent (mentioning attitudes) to rescue logic but risks losing expressivism's spirit.  

  **Scenario:**  
  *Lying to protect a friend from bullies.* Use these sentences:  
  1. **Unembedded assertion:** "Lying to protect a friend is wrong." (Expresses *disapproval*)  
  2. **Conditional (embedded):** "If lying to protect a friend is wrong, then you should confess to covering for them."  
  3. **Modus Ponens Conclusion:** "Therefore, you should confess to covering for them."  

  ---

  ### **Materials & Setup**  
  - **Cards:**  
    - **Red (Disapproval):** 10 cards. Blank side for writing sentences (e.g., "Lying is wrong").  
    - **Green (Approval):** 10 cards. Blank side for writing.  
    - **Neutral (Mention):** 10 blank white cards. Used to write *mentioned* attitudes (e.g., "The attitude DISAPPROVAL toward lying").  
  - **Board:** A whiteboard divided into two columns (one per team). Teams build their "argument chain" here.  
  - **Timers:** Smartphone timers for rounds.  
  - **Scoreboard:** Track "Coherence Points" (logical validity) and "Force Points" (attitude expression).  

  **Teams (4 students each):**  
  - **Team Pure Expressivism:** Must use **only red/green cards** for *all* moral claims—even embedded ones. They *cannot* use neutral cards.  
  - **Team Hybrid:** Uses red/green cards for *unembedded* moral sentences. For embedded sentences (e.g., in "if" clauses), they **must** use neutral cards to *mention* the attitude (semantic ascent).  

  ---

  ### **Rules**  
  1. **Goal:** Build a valid modus ponens argument from the scenario:  
     - Premise 1 (Embedded): *"If lying to protect a friend is wrong, then you should confess."*  
     - Premise 2 (Unembedded): *"Lying to protect a friend is wrong."*  
     - Conclusion (Unembedded): *"Therefore, you should confess."*  

  2. **Building the Argument:**  
     - Teams have 15 minutes to write their argument chain on the board using cards. Each step (P1, P2, Conclusion) must be placed in order.  
     - **Card Rules:**  
       - **Unembedded slots (P2, Conclusion):** Attitude cards (red/green) **must** be played. The colour must match the attitude (red for "wrong", green for "should confess").  
       - **Embedded slots (P1’s "if" clause):**  
         - *Pure Expressivism:* Must play a red/green card (e.g., red for "lying is wrong" in P1).  
         - *Hybrid:* Must play a **neutral card** mentioning the attitude (e.g., "The attitude DISAPPROVAL toward lying").  
     - **Writing:** On card blanks, teams write the *full sentence* for unembedded slots; for neutral cards, they write the *mentioned attitude* (see examples above).  

  3. **Scoring (No Money Needed):**  
     - **Coherence Points (0–10):** Does modus ponens *work*? Award 10 points if the conclusion follows logically; 0 if not.  
     - **Force Points (0–10):** Did the team express/mention attitudes correctly per their theory?  
       - *Pure Expressivism:* 10 points if red/green cards are used in *all* slots.  
       - *Hybrid:* 10 points if red/green cards are used *only* in unembedded slots, and neutral cards in embedded slots.  
     - **Winning:** The team with the highest **combined score** (Coherence + Force) wins.  

  ---

  ### **Timeline (70 Minutes Total)**  
  - **0–10 mins:** Briefing  
    - Explain expressivism (attitudes = moral meaning) and the Frege-Geach problem (embedding "hides" attitudes).  
    - Assign teams, handout cards, clarify rules.  
  - **10–25 mins:** Game Round 1 (Building Arguments)  
    - Teams build their chains on the board. Tutor circulates, answers questions.  
  - **25–35 mins:** Scoring & Challenge  
    - Teams present chains. Tutor scores Coherence/Force (see **Predictable Problems** below for likely issues).  
  - **35–55 mins:** Game Round 2 (Swapped Strategies)  
    - Teams swap roles (Pure → Hybrid; Hybrid → Pure) and rebuild the argument.  
  - **55–65 mins:** Final Scoring & Discussion  
    - Compare scores. Highlight trade-offs: Pure keeps "force" but loses coherence; Hybrid keeps logic but "loses" expression in embeddings.  
  - **65–70 mins:** Debrief  

  ---

  ### **Debrief: Mapping to Frege-Geach**  
  - **Frege’s Assertoric Force:** Unembedded sentences (P2) have "force"—they *express* attitudes (red/green cards). Embedded sentences (P1) lack force—they’re just "content."  
  - **Geach’s Embedding Problem:**  
    - *Pure Expressivism:* Using a red card in P1’s "if" clause *simulates* expressing an attitude where it shouldn’t exist. This breaks modus ponens (no coherence points) because P1 and P2 aren’t "talking about the same thing."  
    - *Hybrid:* Neutral cards in P1 *mention* attitudes (semantic ascent), creating consistent "content" for modus ponens (coherence points). But Force Points drop because P1 no longer *expresses* disapproval.  
  - **Limitation of the Game:** Cards oversimplify Frege’s **content-force distinction**. IRL, Frege’s "content" (thought) is neutral and reusable in embeddings—but expressivism struggles to define it without attitudes. The game can’t model this abstract "content" (it reduces it to cards), so focus on the *functional* breakdown.  

  ---

  ### **Predictable Problems & Fixes**  
  - **Problem:** Students "cheat" by using red/green cards in embedded slots (Hybrid) or neutral cards in unembedded slots (Pure).  
    - **Fix:** Intervene immediately: "In your theory, this slot is embedded—you *can’t* express an attitude here! Use a neutral card (Hybrid) or commit to your red card (Pure)."  
  - **Problem:** Teams misidentify "embedded" slots (e.g., treating the conclusion as embedded).  
    - **Fix:** Pre-game examples: "The 'if' clause is embedded; a standalone moral claim isn’t."  
  - **Problem:** Hybrid team writes vague neutral cards (e.g., "Disapproval" without context).  
    - **Fix:** Enforce precision: "Your neutral card must *mention* the attitude *and* its target, e.g., 'DISAPPROVAL of lying'."  
  - **Problem:** Pure team insists modus ponens "works" with their red card in P1.  
    - **Fix:** In scoring, ask: "Does P1 *as you’ve expressed it* (with disapproval) logically entail the conclusion? Or is it just an attitude?" Highlight the missing link.  

  ---

  ### **Why This Works**  
  - **Experiential:** Students *feel* the tension when Hybrids "lose" force in P1 or Pure teams can’t validate modus ponens.  
  - **Niche & Tactile:** The card system is uncommon (not a stock demo), and the lying scenario grounds abstraction in drama.  
  - **British English:** Sorted—no "color" or "behavior" here!  

  This design forces students into the weeds of expressivism’s weakest spot. By Round 2, they’ll be arguing like your flatmate—but with battle scars from the embedding front. Let me know if you need refinements!
