answer: |-
  Your intuition hits on a core problem in philosophy of language (Frege's Puzzle), but a **contextual cognitive significance principle** can resolve your cases:

  > **An "a is b" identity feels informative if, for the knower, "a" and "b" are associated with distinct, non-trivially-connected cognitive access routes (modes of presentation) to the same referent.**

  **How it works & handles your cases:**

  1.  **Hesperus is Phosphorus:** *Informative.* "Hesperus" = "evening star concept"; "Phosphorus" = "morning star concept". Distinct observational routes, non-trivially connected (no prior knowledge they are one object).
  2.  **Clark Kent is Superman:** *Informative (fictional).* "Clark Kent" = "mild-mannered reporter concept"; "Superman" = "flying hero concept". Distinct behavioral/appearance routes, not trivially connected in-story.
  3.  **Water is H₂O:** *Informative.* "Water" = "wet, drinkable, macroscopic stuff concept"; "H₂O" = "specific molecular structure concept". Distinct phenomenological/scientific routes, not trivially connected before discovery.
  4.  **2024 Election Winner is Joe Biden:** *Uninformative (in 2025).* "2024 Election Winner" directly points to Biden in common knowledge. No distinct route exists; it's just applying a title *already known* to belong to him. *(If said before the election, it WOULD be informative!)*
  5.  **Tallest Mountain is Mount Everest:** *Uninformative.* "Tallest Mountain" is a description whose reference *is canonically fixed by the property itself*. Knowing the description implies knowing Everest is the referent for most people. No distinct cognitive route.
  6.  **Cicero is Tully:** *Contextually Dependent.*
      *   *Informative:* If you know Cicero's writings/philosophy and Tully's oratory/history *as separate figures*, learning the identity connects distinct cognitive routes.
      *   *Uninformative:* If you know they are standardly the same person, or "Tully" is just learned as "another name for Cicero", no distinct routes exist.
  7.  **Shadow is Raven (Avatar):** *Informative.* "Shadow" = one set of in-game actions/appearance/achievements; "Raven" = a *different* set of actions/appearance/achievements. Distinct behavioral/social routes exist for the player, non-trivially connected until revealed.
  8.  **"The author of this specific prompt is the author of this specific prompt":** ***Always Uninformative (Tautology).*** Both sides ("a" and "b") use *the exact same descriptive mode of presentation*. There is only one cognitive route described identically twice. No context makes this genuinely new information – it directly expresses self-identity.

  **Resolving the Everest vs. Hesperus Tension:**

  *   **Mount Everest:** The description "the tallest mountain" is *how most people primarily fix the reference* of "Mount Everest". Learning it *is* Everest adds no new cognitive route; it's restating the defining property using the name.
  *   **Hesperus/Phosphorus:** The names initially fix the reference via *distinct, independent phenomena* (evening appearance vs. morning appearance). Learning they are identical *merges two separate cognitive routes*.

  **The Key Difference:** Does the description used in the identity statement *itself constitute the primary cognitive route* to the object (Everest), or is it *one of multiple independent routes* that need connecting (Hesperus/Phosphorus, Clark Kent/Superman)?

  **Prediction for your niche avatar case:** This fits perfectly. The principle predicts it *is* informative (like Hesperus/Clark Kent) because distinct, non-trivially-connected cognitive routes exist for the player ("Shadow's actions" vs. "Raven's actions"). Anonymity reinforces the distinctness of these routes.

  **Why this works better than just "listing modes of presentation":**

  1.  **Contextual:** It depends on the *knower's state of knowledge* (Cicero/Tully).
  2.  **Non-Trivial Connection:** It excludes cases where one description is *already understood* to be synonymous with or definitively pointing to the other (Tallest Mountain/Everest, Election Winner/Biden *after* the fact).
  3.  **Cognitive Significance:** It focuses on *why* it feels like learning something – merging previously separate mental files.
  4.  **Handles Fiction/Anonymity:** The distinct routes exist based on the knower's experience, regardless of the real-world/fictional nature or anonymity.

  **In short:** You learn something when the identity connects *two different ways you had of thinking about the world*, not when it just repeats the same way or applies an already-known label.
