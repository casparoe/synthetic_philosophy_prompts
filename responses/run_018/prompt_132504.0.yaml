prompt: |-
  I was talking with my friend over coffee about why some "a is b" statements feel like they teach you something and others feel like you're just stuttering, and I realised my intuitions are all over the place. So here's my gut-check list. 'Hesperus is Phosphorus' — definitey news, even though it's the same rock. 'Clark Kent is Superman' — also news, but in a fictional way. 'Water is H2O' — news, but scientific, like you're learning the hidden structure. 'The 2024 election winner is Joe Biden' — not news at all, just applying a title. 'The tallest mountain is Mount Everest' — also not news, just unpacking what 'tallest mountain' means. But then 'Cicero is Tully' — I go back and forth; if you only know Roman rhetoric from one side it's news, but if you study both it's tautology. And then this niche scenario: in a multiplayer game with anonymous avatars, a player finds out that 'Shadow' and 'Raven' are the same person behind two screens. That feels like news, similar to Clark Kent, but I'm not sure if the anonymity makes it different.

  Can you find me a principle that gets all these, or close? Specifically I need to know what to do with the Mount Everest vs Hesperus tension — they both link a description to a proper name, but one feels empty and one doesn't. And if your principle forces me to drop a verdict, say which one and why. Also predict for this case I haven't decided: 'The author of this specific prompt is the author of this specific prompt' — is there any context where that's genuinely informative, or is it always just a tautology? And please don't just list modes of presentation without testing them against my weird avatar case.
