answer: |-
  ### Essay Question  
  **Institutional Dissolution and Vagueness: Epistemicism vs. Supervaluationism**  

  Consider the incremental dissolution of a philosophy department:  
  1. Tenure-review authority is revoked, though hiring continues.  
  2. Curriculum-veto power is transferred to the dean.  
  3. Budget autonomy is eliminated; funds are centrally allocated.  
  4. Physical office space is reassigned; members work remotely.  
  5. Only an informal research network persists, with no administrative structure.  

  **(a)** Is there a precise fact of the matter about *exactly when* the department ceases to exist? Defend **either** epistemicism **or** supervaluationism in response.  
  **(b)** Explain how your chosen theory resolves the sorites paradox generated by the five-step erosion.  
  **(c)** Does treating "department" as a collective-intentionality term (e.g., grounded in shared goals) rather than a physical aggregate introduce distinct vagueness challenges?  
  **(d)** For supervaluationism: Can "admissible precisifications" avoid sharp boundaries here, or do they reintroduce them covertly? For epistemicism: Does positing an unknown sharp boundary resolve the paradox or merely relocate it?  

  ---  

  ### Model Answer (900 words)  

  **(a)** Supervaluationism correctly denies a precise fact of the matter about the department’s cessation point. The term "department" suffers from *semantic indecision*: its application conditions are incompletely specified. No exact threshold exists where governance-loss tips into nonexistence because competent speakers lack determinate criteria for institutional identity. This contrasts with epistemicism, which insists on a hidden sharp boundary knowable only to an omniscient being.  

  **(b)** The dissolution series is soritical: each loss seems *tolerable* for departmental survival (e.g., losing tenure-review alone doesn’t destroy identity). Supervaluationism blocks the paradox by rejecting universal tolerance. While *some* precisifications permit survival after step 1 (e.g., defining departments by hiring capacity), others draw boundaries earlier (e.g., requiring budget autonomy). Crucially, **truth is supertruth**: "The department exists at step 2" is true only if *all* admissible precisifications agree. When precisifications disagree (e.g., at step 3, where some require curriculum control), the statement is *indeterminate*. Thus, no step forces a paradoxical jump from existence to nonexistence.  

  **(c)** Collective intentionality *intensifies* vagueness. If "department" denotes a physical aggregate (e.g., bodies in offices), vagueness arises from spatial/temporal boundaries. But as a collective-intentionality term, its existence depends on intersubjective attitudes (e.g., "We are a department"). This introduces **second-order vagueness**: when do enough members abandon shared goals to collapse the institution? Losing tenure review may not dissolve collective identity if members retain solidarity, but erosion of budget autonomy might. Since attitudes are gradient and unobservable, semantic indecision multiplies—precisifying "sufficient commitment" is inherently contestable.  

  **(d)** Supervaluationism covertly reintroduces sharp boundaries. Each precisification has a sharp cutoff (e.g., "department ceases at step 3"). While the *set* of precisifications creates indeterminacy zones (steps 2–4), **higher-order vagueness** emerges: when does a precisification become *inadmissible*? If "admissibility" itself lacks sharp boundaries (e.g., is a precisification requiring physical space *always* invalid post-step 4?), we face a new sorites for precisifications. Thus, supervaluationism displaces—but does not eliminate—sharp boundaries to the meta-level.  

  *Epistemicism alternative (had it been chosen)*:  
  Epistemicism’s sharp boundary (e.g., "ceases at step 3") relocates the paradox. We cannot know *why* losing budget autonomy (step 3) is fatal while losing curriculum power (step 2) is not. The puzzle becomes: how can a *tiny* difference (e.g., 1% less autonomy) destroy an institution? Epistemicism answers that collective-intentionality terms have hidden thresholds, but this merely swaps vagueness for brute ignorance.  

  ---  

  ### Marking Scheme (Total: 100 points)  

  #### **A-Level (85–100)**  
  - **(a) Theory Defense (20 pts)**: Explicitly distinguishes semantic indecision (superv.) vs. unknowable facts (epist.). Rejects ontological indeterminacy. *Deduct 5 if conflated*.  
  - **(b) Sorites Resolution (25 pts)**: Correctly applies tolerance principle to institutional context; explains supertruth/precisification divergence (superv.) OR unknowability/absence of vague objects (epist.). *Deduct 10 for misapplying tolerance; 5 for summary without mechanics*.  
  - **(c) Collective Intentionality (25 pts)**: Contrasts physical vs. intentional vagueness; diagnoses second-order vagueness from attitudinal gradients. *Deduct 15 if omitted; 8 if superficial*.  
  - **(d) Boundary Evaluation (20 pts)**: For superv.—identifies meta-boundaries in admissibility; for epist.—notes paradox relocation. *Deduct 10 if higher-order vagueness unaddressed*.  
  - **Structure (10 pts)**: Logical flow; no extraneous summary.  

  #### **B-Level (70–84)**  
  - **(a) Theory Defense (15)**: Correctly picks theory but vague on mechanics (e.g., "superv. uses precisifications").  
  - **(b) Sorites Resolution (20)**: Recognizes paradox but partial resolution (e.g., "precisifications help" without supertruth).  
  - **(c) Collective Intentionality (18)**: Mentions it but doesn’t explain distinct vagueness.  
  - **(d) Boundary Evaluation (15)**: Superficial critique (e.g., "superv. has boundaries too").  
  - **Structure (7)**: Some disorganization.  

  #### **C-Level (50–69)**: Summarizes theories; misapplies tolerance; ignores collective intentionality; significant conceptual errors.  
  #### **Failing (<50)**: Major omissions/errors (e.g., "vagueness = ontological fuzziness").  

  #### **Critical Deductions**  
  - **–10**: Treating precisifications as ontologically creative (e.g., "precisifications *make* the department exist").  
  - **–15**: Conflating epistemic ignorance with metaphysical indeterminacy.  
  - **–20**: Ignoring collective intentionality entirely.  
  - **–10**: Claiming epistemicism "solves" the paradox without addressing relocation.  

  ---  

  This design forces students to *deploy* the machinery of each theory: supervaluationism’s precisifications must resolve institutional sorites series, while epistemicism must confront collective-intentional thresholds. The collective-intentionality requirement blocks evasion into physicalist reductions, and the boundary-evaluation section targets each theory’s Achilles’ heel.
