answer: |-
  Your friend's summary captures the surface structure of Gongsun Long's argument but distorts its intent and overgeneralizes the School of Names' project. Your intuition about "sortal leakage" is insightful and offers a productive, though not perfect, parallel. Here's a precise breakdown:

  **Accurate Elements in the Summary:**

  1.  **Core Argument:** Gongsun Long *did* argue that "a white horse is not a horse" (白馬非馬, *bái mǎ fēi mǎ*).
  2.  **Basis in Extension/Reference:** The argument *does* hinge on the different scopes of reference ("extension") of the terms:
      *   "Horse" (馬, *mǎ*) refers to all horses, regardless of color.
      *   "White horse" (白馬, *bái mǎ*) refers only to horses that are white.
  3.  **Focus on Language:** The School of Names (名家, *Míngjiā*) *was* deeply concerned with the relationship between names (名, *míng*), actualities (實, *shí*), and the potential for contradiction or paradox within language.
  4.  **Exposing Contradictions:** They absolutely used paradoxes like the White Horse to expose tensions and ambiguities in ordinary language use.

  **Overstatements and Distortions:**

  1.  **"Shape/Form" vs. "Shape/Form + Color":** This is a significant oversimplification and misrepresentation. Gongsun Long doesn't neatly divide concepts into "shape/form" and "color" as distinct ontological categories. His argument is more fundamentally about:
      *   **The Denotation of Names:** "Horse" denotes the general class/form. "White" denotes the specific color. "White horse" denotes the *combination* or the specific instance possessing both.
      *   **The Indivisibility of Compound Concepts:** He argues that "white horse" is a single, unified concept/demand (requesting a white horse is different from requesting a horse *or* whiteness). You cannot separate the "horseness" from the "whiteness" in the specific instance when considering the compound term.
      *   **Not Primarily About Attributes:** While shape and color are involved, the core isn't dissecting the object into attributes *per se*, but dissecting the *meanings and extensions of the names themselves*.
  2.  **Goal: Rigorous Logic Replacing Common Sense?** This is a major overstatement and projection. The School of Names wasn't trying to *replace* common sense with formal logic (like modern symbolic logic). They were:
      *   **Investigating Language:** Exploring how language *actually functions* and where it breaks down.
      *   **Philosophical Inquiry:** Probing fundamental questions about universals, particulars, identity, and reference.
      *   **Sophistic/Persuasive Element:** Often engaged in debates aimed at winning arguments or demonstrating intellectual prowess, not necessarily establishing a new logical system for practical use. They weren't trying to abolish common sense; they were highlighting its linguistic underpinnings and potential inconsistencies.
  3.  **The Broad Principle ("Modifier Breaks Category Membership"):** **This is the most significant distortion.** Gongsun Long did *not* endorse a universal principle that *any* modifier breaks category membership. He applied his argument specifically to the "white horse" case and related paradoxes (like "a hard white stone").
      *   **"Tall man is not a man"?** There's *no* evidence Gongsun Long or the School of Names argued this. This is a modern extrapolation that misrepresents their focus. In common sense and their likely view, a tall man *is* still a man. The White Horse argument relies on the specific logical tension between the extension of the general term and the compound term requiring *both* properties simultaneously.
      *   **"Red apple is not an apple"?** Similarly, this is an unwarranted modern extension. Their target was specific paradoxes revealing deeper issues in naming and reference, not a blanket rule about adjectives.

  **Your "Sortal Leakage" Analogy: Productive but Needs Nuance**

  1.  **Connection:** Your concept is philosophically productive. The core similarity lies in the **mismatch between the extension/reference of a compound term and its unmodified head term.** Adding a qualifier ("white," "toy," "fake," "wooden") creates a new term that refers to a subset or even a different category that doesn't inherit *all* the essential properties of the head term category.
      *   "Toy gun" refers to objects that lack the essential property of being a lethal weapon, placing them outside the category "gun" (as defined by function).
      *   "Fake diamond" lacks the essential property of being carbon crystallized under specific conditions, placing it outside "diamond."
      *   "White horse" (in Gongsun Long's argument) refers *only* to horses with a specific color property, making its extension narrower than "horse," thus "not a horse" in the sense of not being *equivalent* to the entire class "horse."
      *   *Potential Leakage:* "Wooden table" vs. "wood" – "Wooden table" *is* still wood (materially), but "wooden table" as a functional object is a different *sortal* category than "wood" (the material). Whether this is "leakage" depends on the context (material vs. artifact classification).
  2.  **Distinction:** Where your analogy needs caution:
      *   **Gongsun Long's Focus:** He wasn't primarily concerned with *essential properties* defining category membership in the way modern essentialism often is (e.g., "what makes a gun a gun"). His focus was on the *logical relationship* between the *extensions* of the *names* "horse" and "white horse."
      *   **"Leakage" Implication:** "Sortal leakage" often implies the modified term *falls out* of the original category entirely ("toy gun" is *not* a gun). Gongsun Long's argument is subtly different: He argues "white horse" is not *identical* to "horse" because their extensions differ ("horse" includes brown horses, "white horse" does not). He isn't necessarily saying a white horse isn't *a* horse (an instance of the class "horse") – though the famous phrase "is not a horse" (*fei ma*) is ambiguous and hotly debated. His point is about the *terms* not being co-extensive or synonymous. A white horse *is* a horse, but the *name/concept* "white horse" is not the same as the *name/concept* "horse".
      *   **Degree of Separation:** In modern cases like "toy gun," the qualifier often negates an *essential functional property*, creating a clear categorical distinction. In "white horse," the qualifier adds an *accidental property* (color) creating a sub-category, not necessarily a *different* fundamental category. Gongsun Long pushes the logical point about the terms very hard, but the underlying ontological shift is arguably less radical than "toy gun" vs. "gun".

  **Conclusion on Anachronism & Productivity:**

  *   **Not Fundamentally Anachronistic:** Comparing the *logical structure* of the argument (mismatch in extension due to added qualifier) to modern cases like "toy gun" or "fake diamond" is **philosophically productive**. It highlights a recurring issue in language and categorization.
  *   **Anachronistic if Overextended:** It *becomes* anachronistic if you:
      *   Attribute a modern theory of essential properties or rigid designation to Gongsun Long.
      *   Assume he intended a *universal principle* applying to all modifiers like "tall" or "red".
      *   Conflate his specific logical point about term identity/extension with the stronger modern claim about category membership being fundamentally broken by modifiers (as implied by "tall man not a man").
  *   **Illuminates the Core Paradox:** Your "sortal leakage" lens helps illuminate *why* Gongsun Long's argument feels paradoxical and powerful: adding "white" changes the reference of "horse" in a way that seems to logically exclude the compound term from being synonymous with the simple term, creating a tension with our intuition that a white horse *is* still a horse.

  **In short:** Trust your friend on the *existence* of the "white horse is not a horse" argument and its basis in differing references. Be skeptical of the "shape/form + color" breakdown, the claim about replacing common sense with logic, and **especially the broad principle that *any* modifier breaks category membership ("tall man not a man") – this is a significant overstatement/distortion.** Your "sortal leakage" analogy is insightful for understanding the *logical tension* Gongsun Long exposed, provided you focus on the specific mismatch in extension he analyzed and avoid projecting modern essentialist theories or universal principles onto him.
