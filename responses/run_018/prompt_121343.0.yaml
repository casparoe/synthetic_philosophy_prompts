answer: |-
  Here is a branching taxonomy for classifying positions on moral worth based on concrete case judgments, structured as a diagnostic decision tree with 7 internal nodes and 8 leaves.

  **Moral Worth Diagnostic Tree**

  1.  **ROOT:** (Case: An agent helps a stranger in acute distress solely because they believe it's their duty under a universal moral law, and it genuinely is the right thing to do because it prevents severe suffering). **Must the agent's motivating reason (duty) correctly identify the feature actually making the act right (preventing suffering) for the act to have full moral worth?**
      *   **YES** → Go to 2 (Meta-Reason Error Case)
      *   **NO** → Go to 5 (Structural-Substitution Case)

  2.  **Meta-Reason Error Case:** (Case: An agent returns lost property solely because they believe a specific ancient religious text commands it. This text doesn't actually command it, but returning it *is* right because it respects the owner's autonomy. The agent desires to follow this text). **Does this meta-reason error (mistaken belief about the command's source/content) undermine the moral worth of returning the property?**
      *   **YES** → Go to 3
      *   **NO** → **Leaf: Unnamed Hybrid Tracking** (Accepts tracking but holds meta-reason error never undermines worth).

  3.  **Fragility Condition (After Meta-Error):** (Case: The agent from Root (1) helps the stranger solely from duty. However, they hold one highly specific, empirically shaky belief: if they believed there was even a 1% chance the stranger was faking distress as part of a performance art piece, they would not help. In reality, the risk was negligible). **Does this counterfactual brittleness (withholding help based on a slight belief change) diminish or erase the moral worth of their act?**
      *   **YES** → **Leaf: Strict Kantian Rationalism**
      *   **NO** → **Leaf: (Unnamed Position A)** (Requires correct tracking reason but allows meta-error & discounts fragility).

  4.  **(Implicit Node after Meta-Error YES):** The agent's reason *does* correctly track the right-making feature (respecting autonomy in the meta-error case, preventing suffering in the Root case). **Is this correct motivating reason sufficient for full moral worth, regardless of other factors (like fragility)?** (This node is implied by splitting on Fragility at Node 3 after answering YES to Meta-Error).
      *   *(Answered via Node 3)*

  5.  **Structural-Substitution Case (After Root NO):** (Case: A civil servant impartially applies a complex, equitable resource distribution rule designed by just institutions. They do this solely because it's their job requirement; they personally have no deep understanding of or commitment to the underlying justice principles, though the rule reliably produces right outcomes). **Can this act (applying the rule correctly) possess full moral worth solely due to the reliable structural alignment, despite the agent's lack of personal grasp of the right-making features?**
      *   **YES** → Go to 6
      *   **NO** → Go to 7

  6.  **Fragility Condition (After Structural YES):** (Case: The civil servant applies the rule correctly. However, they would have applied a blatantly unfair, self-serving rule just as diligently if it had been the official procedure, provided it didn't risk their job). **Does this counterfactual brittleness (applying an unfair rule if required) diminish or erase the moral worth of their correct application of the just rule?**
      *   **YES** → **Leaf: Modified Humean Sentimentalism (Structural Roles)**
      *   **NO** → **Leaf: Consequentialist Reason-Irrelevance**

  7.  **Agent's Motive (After Structural NO):** (Case: Since structural substitution isn't sufficient (Node 5 NO), what *is* crucial for moral worth? Consider an agent who reliably performs right acts). **Must the agent's motivating reason involve a direct, conscious appreciation of the act's right-making feature(s) (e.g., helping *because* it relieves suffering)?**
      *   **YES** → **Leaf: (Unnamed Position B)** (Rejects tracking but requires explicit conscious grasp of right-maker; rejects structural substitution).
      *   **NO** → **Leaf: Aristotelian Virtue-Based Habituation**

  **Leaf Mappings & Awkward Commitments:**

  *   **Strict Kantian Rationalism:** (Awkward Commitment: An act loses all moral worth if the agent would have failed to act virtuously under a highly specific, improbable counterfactual scenario, even if their actual motive was pure duty and perfectly aligned with the right action.)
  *   **(Unnamed Position A):** (Awkward Commitment: An act based entirely on a demonstrably false meta-justification (e.g., a non-existent divine command) can still have full moral worth if the underlying motivating desire accidentally aligns with the true right-maker, and the motive isn't fragile.)
  *   **Unnamed Hybrid Tracking:** (Awkward Commitment: The moral worth of an action is unaffected by the agent holding wildly inaccurate or even nonsensical beliefs about *why* their motivating reason is valid or authoritative, as long as the motivating reason itself correctly identifies the right-making feature.)
  *   **Modified Humean Sentimentalism (Structural Roles):** (Awkward Commitment: An agent diligently performing a profoundly just act within a well-designed system can possess full moral worth for that act *only if* their character is such that they *would* feel disapproval (or lack approval) for following a blatantly unjust rule if required, even if they never actually encounter such a rule.)
  *   **Consequentialist Reason-Irrelevance:** (Awkward Commitment: A self-serving bureaucrat blindly following a just procedure solely to avoid punishment possesses full moral worth for the just outcome they produce, identical to a saint acting from pure love of justice.)
  *   **(Unnamed Position B):** (Awkward Commitment: Moral worth requires the agent to consciously think about the specific right-making property (e.g., maximizing utility, respecting autonomy) *at the moment of action*, excluding virtuous habituation or rule-following based on a general sense of "duty" or "kindness" unless explicitly linked to the true right-maker.)
  *   **Aristotelian Virtue-Based Habituation:** (Awkward Commitment: An agent who reliably does the right thing for stable, deeply ingrained character reasons (e.g., kindness, honesty) possesses full moral worth for their actions *even if* their motivating reason misidentifies or is completely unaware of the true right-making feature (e.g., they help because "it's what nice people do," unaware that it prevents suffering or respects autonomy).

  **Unoccupied Combinations & Diagnosis:**

  1.  **Combination:** Root (1): **YES** (Tracking Required) → Meta-Reason Error (2): **YES** (Error Undermines) → Fragility (3): **NO** (Brittleness Irrelevant). *(Position: Requires correct tracking reason, meta-error destroys worth, but fragility doesn't matter.)*
      *   **Diagnosis:** **Unattractiveness.** This position demands a high bar (correct tracking, no meta-error) but then bizarrely allows the motive to be counterfactually unstable. If the reason's correctness is so crucial that a meta-error destroys worth, it's incoherent or deeply unattractive to simultaneously hold that the agent's commitment to that very reason is so shallow that a trivial belief change would make them abandon it, yet this doesn't diminish worth. It offers strictness without robustness.

  2.  **Combination:** Root (1): **NO** (Tracking Not Required) → Structural-Substitution (5): **NO** (Not Sufficient) → Agent's Motive (7): **YES** (Requires Conscious Grasp of Right-Maker). *(Position: Rejects tracking and structural substitution, requires explicit conscious grasp of the right-making feature.)*
      *   **Diagnosis:** **Unexplored Territory & Potential Unattractiveness.** This position (Leaf: Unnamed Position B) is included as a leaf, but the *combination* of rejecting structural substitution *and* requiring explicit conscious grasp is the gap. While requiring conscious grasp exists in some form (perhaps in highly reflective Kantianism), its combination with *rejecting* structural substitution is less prominent. It's unexplored systematically. Its awkwardness (requiring explicit conceptualization at the moment of action) makes it potentially unattractive for explaining the worth of habitual or intuitive virtuous actions, but it's not inherently incoherent.
