prompt: |-
  I'm a PhD student in moral philosophy working on intergenerational justice and the formal structure of long-term ethical decision-making. I'm preparing a 90-minute graduate seminar session for twelve students who have already encountered the non-identity problem and the repugnant conclusion in standard form, but who have never had to make an actual binding decision under the condition that the number of moral patients might be genuinely open-ended rather than merely very large. I want them to run into the structural failure of aggregation procedures with their own hands—through tangible stakes and a revealed hidden condition—before anyone names the paradox for them.

  Please design a runnable classroom activity—call it the Open-Horizon Allocation Game—that centers on what I will call the open-horizon aggregation paradox: the students, acting as constitutional architects, must collectively ratify a single resource-allocation rule (a written Constitution) that governs Generation 1, Generation 2, and every successive generation without knowing whether there will be a terminal Generation N, and without knowing whether the sequence is actually finite or potentially infinite. After ratification, they should run a live simulation of at least five successive generations using tangible, small-but-real stakes (token resources that convert into a shared reward), computing welfare for each round strictly according to their Constitution. Only after the simulation should the facilitator reveal the hidden termination condition—a probabilistic endpoint with infinite expectation but near-certain finite realization—thereby forcing an ex post evaluation that clashes with the ex ante justification they used to ratify the rule. Specify the precise setting (graduate seminar, 12 students, 90 minutes), assign concrete roles and rules so that the coordination failure and the aggregation breakdown emerge from the mechanics rather than from facilitator commentary, provide a minute-by-minute timeline, and include a debrief that maps specific moments (ratification, round 3, the endpoint revelation) onto the conceptual distinctions between average and total utilitarianism, ex ante versus ex post evaluation, and the failure of Archimedean aggregation across an open horizon. Be explicit about what the activity structurally cannot reproduce—namely, the metaphysical difference between potential and actual infinite populations—and state exactly how the facilitator must supply that distinction verbally after the simulation. Also predict the predictable failure mode (students will attempt to smuggle in an implicit discount rate or a hidden cutoff) and explain how to handle it without shutting down the discussion.

  Assume the role of an expert in normative ethics and experiential pedagogy. Before presenting the full design, briefly brainstorm how tangible stakes can represent abstract divergence without reducing the exercise to a mathematics demonstration. Then deliver the complete activity.

  Please lead with your bottom line—the core mechanic of the Constitution-ratification-simulation-revelation sequence and the single insight the debrief must deliver—in the first sentence, then unfold the rules, role assignments, timeline, debrief mapping, honest limitations, and failure-mode handling with no preamble and without restating the prompt.
