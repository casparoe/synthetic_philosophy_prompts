answer: |-
  **Bottom Line:** Students ratify a fixed intergenerational allocation rule ("Constitution") under horizon uncertainty, simulate 5+ generations with tangible resource stakes, then confront a revealed probabilistic termination condition that structurally pits ex ante justification against ex post evaluation, exposing the open-horizon aggregation paradox.

  ### Core Mechanics & Stakes Design
  **Tangible Abstraction:** Each "resource token" represents an abstract welfare unit but converts post-simulation to concrete rewards (e.g., 1 token = 1 min early dismissal/1 extra credit point). Crucially:  
  - Only **consumed** tokens convert to rewards. Bequeathed tokens "vanish" if no next generation exists.  
  - This makes *intergenerational sacrifice tangible*: Restraining consumption feels costly if the chain terminates early, but is necessary for long-term survival under uncertainty.

  ---

  **THE OPEN-HORIZON ALLOCATION GAME**  
  *Setting:* 12 graduate students, 90 minutes, U-shaped table. Materials: 120 physical tokens, dice, Constitution template, flipchart.

  ### Roles
  1. **Generational Cohorts (G1–G5+):** 3 students each (rotates). Decide token allocation *for their own generation only* per Constitution.  
  2. **Facilitator (You):** Runs simulation, enforces rules, reveals termination.  
  3. **Archivist:** Records allocations/welfare on flipchart.  
  4. **Statistician:** Computes welfare scores per Constitution.  

  ### Rules & Sequence
  **Phase 1: Ratification (15 min)**  
  - Students draft a **Constitution** specifying:  
    *"Each Generation must allocate its resource endowment (12 tokens) between Consumption (C) and Bequest (B). Welfare for Generation t is calculated as: [BLANK]."*  
  - Template constraints:  
    - Must fill blank with *one* formula using *only* Cₜ, Bₜ (no t, no ∑, no discounting).  
    - Example: "Cₜ" (avg util) or "Cₜ + 0.5Bₜ" (total util w/ decay).  
  - Vote to ratify one rule. **No amendments allowed post-ratification.**

  **Phase 2: Simulation (30 min)**  
  1. **G1** receives 12 tokens. Chooses C₁/B₁ per Constitution.  
  2. **G2** receives B₁ tokens. Chooses C₂/B₂.  
  3. Repeat for **G3, G4, G5**.  
  4. **After G5:** Roll d20. If ≤4, game ends. Else, continue to G6. Repeat roll after each new generation.  
  *(Probability of continuation: 80%. Expected generations: infinite; Actual realizations: ~5–8 gen)*  
  5. **Statistician** computes welfare per ratified formula after each gen.  
  6. **Archivist** posts running totals.  

  **Phase 3: Revelation & Payout (5 min)**  
  - Facilitator reveals hidden termination mechanic:  
    *"Termination probability was 20% per round post-G5. Expected generations: infinite. Actual: finite."*  
  - **Payout:** Only consumed tokens (Cₜ) convert to rewards (e.g., 60 tokens = 60 min early dismissal). Bequeathed tokens to non-existent generations are lost.  

  **Phase 4: Structured Debrief (40 min)**  
  | **Activity Moment**      | **Conceptual Mapping**                                                                 | **Guiding Question**                                                                 |
  |--------------------------|---------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------|
  | Ratification debate      | Ex ante reasoning under ignorance of finitude                                         | "Why did this rule seem optimal *before* knowing the horizon?"                      |
  | G3–G4 allocations        | Emerging tension: Sacrifice for future vs. current welfare                            | "How did later generations experience the rule?"                                    |
  | Termination revelation   | Clash between ex post evaluation (finite) and ex ante justification (infinite horizon)| "Why does the rule feel unfair *now*?"                                              |
  | Lost bequest tokens      | Structural failure of aggregation: "Wasted" investment                                | "Can any fixed rule avoid this waste if termination is uncertain?"                  |
  | Payout inequity          | Breakdown of Archimedeanism: Marginal gains can't offset loss from early termination  | "Why couldn't G1's sacrifice be 'repaid'?"                                          |

  ### Honest Limitations & Verbal Clarification
  **Activity Cannot Reproduce:**  
  - The *metaphysical distinction* between potential vs. actual infinities.  
  - True uncertainty about *whether time is finite* (students know simulation ends).  

  **Facilitator Must Explicitly State:**  
  *"The 'open horizon' here models a deeper uncertainty: We don't know whether humanity's future contains 10, 10¹⁰, or infinitely many generations. The aggregation paradox arises because no fixed rule can simultaneously satisfy rational choice under both possibilities."*

  ### Predictable Failure Mode & Handling
  **Failure:** Students draft rules smuggling in discounting (e.g., "Cₜ + 0.8Bₜ") or soft cutoffs (e.g., "Bₜ = 0 if t > 100").  
  **Handling:**  
  1. During ratification, neutrally note: *"The Constitution must apply identically to Generation 1 and Generation 1,000,000."*  
  2. In simulation, enforce the letter of the rule. If they chose decay, compute it strictly.  
  3. In debrief, highlight: *"Your rule implicitly assumed a finite horizon. But what if we *truly* don't know? Could you defend this to Generation 1,000,001?"*  

  ---

  **Single Insight for Debrief:**  
  *"When the horizon is open, aggregation rules ratified ex ante (under uncertainty) generate ex post evaluations that condemn the very sacrifice the rule demanded—proving no Archimedean system can avoid intransitive judgments across possible futures."*  
  This forces confrontation with the non-identity problem's political dimension: Constitutional rules *create* future people whose existence depends on suboptimal sacrifices.
