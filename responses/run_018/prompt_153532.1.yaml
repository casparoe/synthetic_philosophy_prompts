  2. **Substantive claims:** Rotation requires reference to absolute space (Newton's view), or inertial frames (neo-Newtonian view). The latter is what survives in Newtonian physics without absolute space.
  3. **Flat-out wrong:** That rotation is absolute in all senses, especially in GR where spacetime is dynamic. In GR, rotation is relative to local inertial frames, not absolute space.

