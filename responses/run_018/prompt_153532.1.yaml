  Been arguing with my advisr about Newton's bucket again. He keeps saying "the bucket proves rotation is absolute, not relational" whenever I bring up relationism, like that ends the conversation. But I'm pretty sure that line is doing a ton of hidden work. Can you lay out the distinct precise claims that slogan could actually mean — from trivial to substantive to flat-out wrong? I need the menu version: which reading just restates Newton's premises, which one survives in GR if any, and which ones depend on assuming Euclidean space? Also, which of these is he probably invoking when he uses it to shut down my point about dynmaical spacetime? There's probably a typo in my notes but I think you get the idea.
