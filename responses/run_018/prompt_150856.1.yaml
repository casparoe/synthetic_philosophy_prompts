  Structure: Start with recommendation upfront (conditional retention), then methodical reasoning. Define "recursive baseline adjustment" clearly - it's resetting expectations based on interventions, but must have fixed rules. Contrast with unfalsifiability risk. Explain why alternatives (short-cycle models) are worse. Conclude with conditions: independent audits, empirical anchors, sunset clause. 

