prompt: |-
  I spent much of last evening in a draining argument with a close friend who has become convinced of an institutional conspiracy theory—specifically, that a coalition of regulatory bodies systematically suppressed a set of technical audits that, had they been released, would have undermined a major policy decision made in 2019. When I pressed him on why no whistleblowers, leaked drafts, or archival traces have surfaced despite years of expected exposure, he kept returning to the same line: “Absence of evidence is not evidence of absence.” I told him that if that principle were applied consistently it would render every unfalsifiable narrative permanently immune to revision, but he insisted I was treating a nuanced epistemic guideline as if it were a logical tautology. I am now fairly sure he is running together several distinct claims under that single sentence, and I want a precise map of the damage before we talk again.

  Could you lay out, as a disambiguated menu, the different precise theses that “absence of evidence is not evidence of absence” could be expressing in the specific epistemological context of conspiracy theories—where the theory itself often includes mechanisms (compartmentalized secrecy, intimidation, document destruction) designed to explain away missing data? For each reading, I want to know: whether it is merely a trivial logical point about non-contradiction; a defensible methodological rule about burden of proof and who owes justification; a domain-specific heuristic about concealment being genuinely likely in particular institutional settings; or a stronger claim that actively blocks evidential updating; whether it genuinely applies when the absence in question is precisely the kind the conspiracy predicts should occur; and whether adopting that reading actually supports my friend’s refusal to treat the non-appearance of those 2019 audit reports as a reason to lower his confidence. I am not asking for bibliographies, citations, or a reading list—only the conceptual anatomy—because my goal is to bring this menu back to our conversation, identify exactly which version of the slogan he is using, and determine whether that version saves his view or collapses it into a self-sealing loop.
