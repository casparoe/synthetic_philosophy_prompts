prompt: |-
  Design a reusable, step-by-step audit procedure for a psychiatric-classification working group that must evaluate whether a proposed diagnostic revision risks triggering harmful looping effects in the sense developed by Ian Hacking—the idea that classifying people can change the very behaviors and self-understandings being classified, which then feed back into prevalence data and clinical perception. The working group operates under a six-week deadline, has no staff philosopher, and requires joint sign-off from clinicians and epidemiologists; the procedure must therefore be runnable by non-philosophers but must preserve the conceptual distinctions that actually matter.

  Structure the procedure as an ordered sequence of tests with explicit stop rules: for each step, state the question, what counts as a sufficient answer (including when the answer must be "we do not have enough evidence"), where the procedure terminates with a recommendation to proceed, where it terminates with a recommendation to halt, and where it explicitly hands the decision to human judgment because the issue is one of values rather than facts. Inject the following niche distinction into the framework: separate "taxonomic looping" (the label itself reshapes symptom expression and self-report) from "institutional looping" (the diagnosis changes access to resources, legal status, or social identity, which then alters observed prevalence independently of phenomenology). The procedure must contain specific checks for each kind and a rule for what to do when they point in opposite directions.

  Then apply the procedure to two concrete proposals: first, broadening the age-range criteria for an existing neurodevelopmental disorder so that it is routinely diagnosed in adults; second, introducing a new subthreshold anxiety category intended for primary-care screening. For each, run every step and record where the procedure yields a clear answer and where it stalls. Include one case—chosen from the two—where the procedure produces an answer the working group is likely to resist (for example, recommending against a revision that addresses a documented clinical gap because loop contamination is unquantifiable and institutional effects are irreversible). Finally, state precisely what the procedure cannot do: identify loops it is not designed to detect, substitute for ethical judgment about acceptable risk, or resolve conflicts between clinician and epidemiologist sign-off. Keep the tone formal and the language operational, avoiding requests for bibliographies, citation lists, or references to highly obscure secondary literature; paraphrase Hacking's core claims without using quotation marks.
reasoning: |-
  We are designing a step-by-step audit procedure for a psychiatric classification working group to evaluate whether a proposed diagnostic revision risks triggering harmful looping effects in the sense of Ian Hacking. The procedure must:
   - Separate "taxonomic looping" (label reshaping symptom expression and self-report) from "institutional looping" (diagnosis changing access to resources, legal status, or social identity, which then alters observed prevalence).
   - Be runnable by non-philosophers in a six-week timeframe, with joint sign-off by clinicians and epidemiologists.
   - Include explicit stop rules and specify when the procedure terminates with a recommendation to proceed, halt, or hand the decision to human judgment.

   The procedure is structured as an ordered sequence of tests. For each step, we state:
     - The question
     - What counts as a sufficient answer (including when the answer is "we do not have enough evidence")
     - Where the procedure terminates with a recommendation to proceed, halt, or hand the decision to human judgment.

   The procedure must also be applied to two concrete proposals.

   Steps of the Audit Procedure:

   Step 1: Pre-Screen for Direct Evidence of Prior Looping
     Question: Is there direct empirical evidence (from past revisions, similar categories, or natural experiments) that this specific revision or a closely analogous one has previously produced harmful looping effects?
     Sufficient answer: 
       - Yes: if there is at least one peer-reviewed study or a well-documented case series showing harmful looping (either taxonomic or institutional) for this or a similar revision.
       - No: if a systematic search (within time constraints) finds no such evidence.
       - We do not have enough evidence: if the search is inconclusive or no studies exist.
     Stop rules:
       - If Yes: proceed to Step 2 (to assess severity and reversibility) but note the evidence as a major risk factor.
       - If No or Not enough evidence: proceed to Step 2.

   Step 2: Assess Potential for Taxonomic Looping
     Question: Does the revision create new labels or significantly alter existing ones in ways that could reshape symptom expression, self-understanding, or self-reporting?
     Sufficient answer:
       - High potential: if the revision introduces a new label (or significantly redefines an existing one) that is likely to be internalized by patients (e.g., through media, clinical discourse, or patient communities) and that could lead to changes in how symptoms are experienced or reported. Evidence may include studies on labeling effects in similar conditions, or theoretical reasoning based on the nature of the label and the condition.
       - Low potential: if the revision is a minor adjustment (e.g., a threshold change without a new label) and there is no reason to believe it will be internalized.
       - Uncertain: if the potential cannot be determined with available evidence.
     Stop rules:
       - If High potential: proceed to Step 3 (to assess institutional looping) and note the risk.
       - If Low potential: proceed to Step 3 but with reduced concern for taxonomic looping.
       - If Uncertain: proceed to Step 3 and note the uncertainty.

   Step 3: Assess Potential for Institutional Looping
     Question: Does the revision change access to resources (e.g., treatment eligibility, insurance coverage), legal status (e.g., disability benefits, criminal responsibility), or social identity (e.g., stigma, advocacy group membership) in ways that could alter the observed prevalence or clinical perception of the condition?
     Sufficient answer:
       - High potential: if the revision directly ties the diagnosis to new resources or status changes (e.g., a new category that qualifies for disability) or there is evidence that such changes are likely (e.g., from policy statements, insurance coding changes, or similar past revisions).
       - Low potential: if the revision does not alter resource allocation, legal status, or social identity (e.g., a purely descriptive change without coding or policy implications).
       - Uncertain: if the potential cannot be determined.
     Stop rules: same as Step 2.

   Step 4: Evaluate Interaction and Severity of Looping Risks
     Question: If either taxonomic or institutional looping is identified as high potential (Step 2 or 3), what is the likely magnitude and harm of the feedback effects? Specifically, could the looping lead to:
       a) Overdiagnosis or underdiagnosis (distorting prevalence data)?
       b) Harm to patients (e.g., stigma, inappropriate treatment, identity disruption)?
       c) Self-reinforcing cycles that are difficult to reverse?
     Sufficient answer:
       - For each of a, b, c: 
          High: if there is strong reason to believe the effect will be substantial and harmful.
          Moderate: if the effect is likely but not severe.
          Low: if the effect is unlikely or trivial.
          Uncertain: if the effect cannot be assessed.
     Stop rules:
       - If any of a, b, c is rated High: proceed to Step 5 (to assess reversibility and mitigability).
       - If all are rated Low: proceed to Step 6 (overall risk assessment) with a note that looping risks are minimal.
       - If only Moderate and/or Uncertain: proceed to Step 5.

   Step 5: Assess Reversibility and Mitigability
     Question: If harmful looping occurs, can it be reversed (e.g., by retracting the revision) or mitigated (e.g., by safeguards in implementation)?
     Sufficient answer:
       - Reversible: if the effects are likely to be temporary and can be undone (e.g., by a future revision without institutional entrenchment).
       - Mitigable: if there are feasible interventions (e.g., clinical guidelines, monitoring) that can reduce harm even if the revision remains.
       - Irreversible and not mitigable: if the effects are likely to be permanent and cannot be adequately controlled (e.g., due to entrenched interests or irreversible social changes).
       - Uncertain: if reversibility or mitigability cannot be determined.
     Stop rules:
       - If Reversible and/or Mitigable: proceed to Step 6, noting the mitigation plan.
       - If Irreversible and not mitigable: terminate and recommend halting the revision (HALT).
       - If Uncertain: proceed to Step 6, but flag as high risk.

   Step 6: Overall Risk-Benefit Assessment (with Joint Sign-off)
     Question: Considering the potential for looping (Steps 2-3), the severity of harm (Step 4), and the reversibility (Step 5), do the benefits of the revision outweigh the risks?
     Sufficient answer: This step requires joint deliberation by the working group (clinicians and epidemiologists). They must consider:
          - The clinical and public health benefits of the revision (e.g., improved diagnosis, treatment access, research).
          - The assessed risks of looping and the feasibility of mitigation.
          - The availability of alternatives to the revision.
     Stop rules:
       - If the group reaches consensus that benefits outweigh risks (with mitigation if needed): Proceed with the revision (PROCEED).
       - If the group reaches consensus that risks outweigh benefits: Halt the revision (HALT).
       - If consensus cannot be reached, or if the decision hinges on value judgments (e.g., about the acceptability of a risk) that cannot be resolved by evidence: Hand the decision to a higher authority (e.g., an ethics committee or oversight board) with a clear summary of the disagreement (HAND TO JUDGMENT).

   Special Rule for Conflicting Evidence: 
     If the assessment of taxonomic looping and institutional looping point in opposite directions (e.g., one high and one low), then the working group must consider both risks independently and then together. In Step 4, they must evaluate the combined risk. If one type of looping is high and the other low, the overall risk may still be high if either one alone can cause significant harm.

   Now, apply the procedure to two proposals:

   Proposal 1: Broadening the age-range criteria for an existing neurodevelopmental disorder (e.g., ADHD) so that it is routinely diagnosed in adults.

   Step 1: Pre-Screen for Direct Evidence of Prior Looping
     - There is evidence from the extension of ADHD to adults that it led to increased diagnosis and treatment, but also concerns about overdiagnosis and medication misuse. However, the evidence of harmful looping (e.g., changes in self-perception leading to increased symptom reporting) is mixed and not conclusive.
     - Answer: We do not have enough evidence (for harmful looping specifically).

   Step 2: Assess Potential for Taxonomic Looping
     - The revision extends an existing label to adults. The label "ADHD" is already well-known and may be internalized by adults who previously were undiagnosed. This could lead to changes in self-understanding and symptom reporting (e.g., attributing normal adult distractibility to ADHD).
     - Answer: High potential.

   Step 3: Assess Potential for Institutional Looping
     - The revision may change access to resources (e.g., medication, workplace accommodations) and social identity (e.g., joining neurodiversity communities). This could lead to increased diagnosis due to incentives (e.g., for academic accommodations) or reduced stigma.
     - Answer: High potential.

   Step 4: Evaluate Interaction and Severity
     - a) Overdiagnosis: High (due to both taxonomic and institutional factors).
     - b) Harm: Moderate (risk of stigma and inappropriate medication use, but also benefits of treatment).
     - c) Self-reinforcing cycles: High (once diagnosed, patients may adopt the identity and seek accommodations, which reinforces the diagnosis; also, the pharmaceutical industry may promote the diagnosis).
     - Overall: High risk in a and c, moderate in b.

   Step 5: Assess Reversibility and Mitigability
     - The extension is reversible in theory (by narrowing criteria again) but institutional entrenchment (e.g., established patient groups, treatment protocols) may make it difficult. Mitigation is possible through strict diagnostic guidelines and monitoring.
     - Answer: Mitigable but not easily reversible.

   Step 6: Overall Risk-Benefit Assessment
     - Benefits: Addresses a significant gap in care for adults with the disorder.
     - Risks: High potential for overdiagnosis and self-reinforcing cycles, but mitigable.
     - The group must weigh these. Given the high risks and the mitigability, they might proceed with caution. However, if they cannot agree, it may be handed to judgment.

   But note: the procedure does not force a halt at Step 5 because it is mitigable. So it goes to Step 6.

   Proposal 2: Introducing a new subthreshold anxiety category intended for primary-care screening.

   Step 1: Pre-Screen for Direct Evidence of Prior Looping
     - Similar subthreshold categories (e.g., pre-diabetes) have led to increased diagnosis and treatment, but evidence for harmful looping in mental health is limited. Some studies show that labeling mild anxiety as a disorder can increase worry and healthcare seeking.
     - Answer: We do not have enough evidence (for harmful looping in this specific context).

   Step 2: Assess Potential for Taxonomic Looping
     - The new label (e.g., "Subthreshold Anxiety Disorder") may be internalized by patients, leading them to interpret normal anxiety as pathological and increasing symptom reporting.
     - Answer: High potential.

   Step 3: Assess Potential for Institutional Looping
     - The category is for screening and may not immediately change resources (e.g., it might not be covered by insurance). However, it could lead to more referrals and eventually pressure for coverage. Also, it may affect social identity (e.g., seeing oneself as having a mental health condition).
     - Answer: Moderate potential (because without immediate resource changes, institutional effects may be slower).

   Step 4: Evaluate Interaction and Severity
     - a) Overdiagnosis: High (taxonomic looping may lead to more people identifying with the label and seeking diagnosis).
     - b) Harm: High (risk of medicalizing normal anxiety, leading to unnecessary treatment and stigma).
     - c) Self-reinforcing cycles: Moderate (if the category becomes established, it may be hard to remove, but without strong institutional backing, it might be reversible).
     - Overall: High risk in a and b.

   Step 5: Assess Reversibility and Mitigability
     - Reversible: yes, because the category is new and not tied to major resources. Mitigable: through careful implementation (e.g., clear guidelines that it is for screening only, not a full diagnosis).
     - Answer: Reversible and mitigable.

   Step 6: Overall Risk-Benefit Assessment
     - Benefits: May improve early intervention for anxiety, preventing progression.
     - Risks: High potential for harm and overdiagnosis, but reversible and mitigable.
     - The group might proceed with caution.

   However, the problem asks for one case where the procedure produces an answer the working group is likely to resist. Let's choose Proposal 2. The group may want to introduce the category to address a gap in primary care (where mild anxiety is often missed). But the procedure flags high risks of taxonomic looping and harm (Step 4). If in Step 5, the group judges that the institutional looping is low and the risks are mitigable, they might proceed. But if they are uncertain about mitigation, or if the reversibility is in doubt, they might halt. However, the procedure does not automatically halt at Step 5 because it is reversible and mitigable. 

   Alternatively, we can design a scenario for Proposal 2 where the procedure recommends halting. Suppose in Step 3, we reassess: if the subthreshold category is tied to insurance billing codes (even for screening), then institutional looping might be high. Then in Step 5, if the group determines that the institutional changes would be hard to reverse (e.g., once insurance starts covering it, removing it would be politically difficult) and mitigation is not feasible, then Step 5 would lead to HALT. This might be resisted because the group sees the clinical need.

   But note: the problem says to include one case where the procedure produces an answer the group is likely to resist. Let's choose Proposal 2 and assume that the institutional looping is high (because it is tied to billing codes) and Step 5 determines it is irreversible and not mitigable. Then:

     Step 3: High potential (because it changes billing and thus resource allocation).
     Step 4: High for a, b, c (because with institutional backing, overdiagnosis, harm, and self-reinforcing cycles are likely).
     Step 5: Irreversible and not mitigable (because once the billing code is established, it will be used and hard to remove; and safeguards in primary care may not prevent overuse).

     Then Step 5 terminates with HALT.

     The group might resist because they see the need for early screening and the clinical benefits.

   Finally, state what the procedure cannot do:

     The procedure is designed to detect and evaluate looping risks of the taxonomic and institutional kinds. It cannot:
       1. Identify looping effects that do not fall into these two categories (e.g., purely economic feedback loops not tied to institutions as defined).
       2. Substitute for ethical judgment about the acceptability of a risk (e.g., how much overdiagnosis is too much).
       3. Resolve conflicts between clinician and epidemiologist sign-off beyond the structured deliberation in Step 6. If the group cannot agree, the procedure requires handing the decision to human judgment.
       4. Predict the exact magnitude of looping effects, especially in novel revisions.
       5. Account for all possible unintended consequences beyond looping.

   We now write the procedure formally.
answer: |-
  ### Step-by-Step Audit Procedure for Evaluating Diagnostic Revisions

  **Procedure Structure**: Ordered sequence of tests with explicit stop rules. Each test must be completed within the six-week deadline. Requires joint clinician-epidemiologist sign-off at critical stages.

  #### **Step 1: Pre-Screen for Direct Historical Precedent**  
  **Question**: Is there empirical evidence (from past revisions, comparable categories, or natural experiments) that this specific revision or an analogous one has triggered harmful looping effects?  
  **Sufficient Answer**:  
  - **Yes**: Peer-reviewed studies or documented case series demonstrate harmful looping.  
  - **No**: Systematic review (within time constraints) shows no evidence.  
  - **Insufficient Evidence**: Data are ambiguous, absent, or outside the six-week scope.  
  **Stop Rules**:  
  - **Yes** → Proceed to Step 2; flag as high-risk.  
  - **No** or **Insufficient Evidence** → Proceed to Step 2.  

  #### **Step 2: Assess Taxonomic Looping Potential**  
  **Question**: Could the revision reshape symptom expression, self-understanding, or self-reporting due to label internalization?  
  **Sufficient Answer**:  
  - **High**: New label or significant redefinition; condition involves identity-salient traits (e.g., personality, neurodevelopmental).  
  - **Low**: Technical adjustment (e.g., threshold tweak) with minimal identity impact.  
  - **Insufficient Evidence**: No data on patient internalization.  
  **Stop Rules**:  
  - **High** → Proceed to Step 3; note risk severity.  
  - **Low** → Proceed to Step 3; low priority.  
  - **Insufficient Evidence** → Proceed to Step 3; flag uncertainty.  

  #### **Step 3: Assess Institutional Looping Potential**  
  **Question**: Could the revision alter access to resources (treatment, insurance), legal status (disability, criminal liability), or social identity (stigma, advocacy groups), thereby changing observed prevalence?  
  **Sufficient Answer**:  
  - **High**: Diagnosis directly enables new benefits/restrictions (e.g., disability eligibility).  
  - **Low**: No material institutional consequences.  
  - **Insufficient Evidence**: Unclear policy impact.  
  **Stop Rules**:  
  - **High** → Proceed to Step 4; note risk severity.  
  - **Low** → Proceed to Step 4; low priority.  
  - **Insufficient Evidence** → Proceed to Step 4; flag uncertainty.  

  #### **Step 4: Resolve Conflicting Looping Risks**  
  **Question**: Do taxonomic and institutional assessments point in opposite directions?  
  **Sufficient Answer**:  
  - **Conflict**: One high, one low/insufficient.  
  - **Alignment**: Both high or both low.  
  - **Insufficient Evidence**: Both uncertain.  
  **Stop Rules**:  
  - **Conflict** → Proceed to Step 5; mandate joint clinician-epidemiologist review.  
  - **Alignment** → Proceed to Step 5.  
  - **Insufficient Evidence** → Proceed to Step 5; flag overall uncertainty.  

  #### **Step 5: Evaluate Harm Severity and Irreversibility**  
  **Question**: If looping occurs, what is the probable harm magnitude (over/underdiagnosis, stigma, treatment misuse) and reversibility?  
  **Sufficient Answer**:  
  - **High Harm + Irreversible**: Severe distortion in prevalence, entrenched stigma, or irreversible resource allocation.  
  - **Mitigable/Reversible**: Harm can be contained via guidelines or policy adjustments.  
  - **Insufficient Evidence**: Unquantifiable risk.  
  **Stop Rules**:  
  - **High Harm + Irreversible** → Terminate with **HALT**.  
  - **Mitigable/Reversible** → Proceed to Step 6.  
  - **Insufficient Evidence** → Proceed to Step 6; flag as high-risk.  

  #### **Step 6: Risk-Benefit Judgment**  
  **Question**: Do the revision’s clinical/epidemiological benefits outweigh looping risks?  
  **Sufficient Answer**:  
  - **Proceed**: Benefits (e.g., treatment access, research clarity) dominate.  
  - **Halt**: Looping risks dominate.  
  - **Values Conflict**: Disagreement hinges on non-empirical trade-offs (e.g., acceptable risk threshold).  
  **Stop Rules**:  
  - **Proceed** → Approve revision.  
  - **Halt** → Reject revision.  
  - **Values Conflict** → Terminate with **HAND TO JUDGMENT** (e.g., ethics board).  

  ---

  ### Application to Concrete Proposals  
  **Proposal 1: Broadening Age-Range for Neurodevelopmental Disorder (e.g., ADHD) in Adults**  
  - **Step 1**: *Insufficient Evidence* (limited data on adult-specific looping).  
  - **Step 2**: *High* (taxonomic; "ADHD" identity may reshape self-reporting in adults).  
  - **Step 3**: *High* (institutional; diagnosis enables workplace accommodations, medication access).  
  - **Step 4**: *Alignment* (both high).  
  - **Step 5**: *Mitigable/Reversible* (harm via overdiagnosis is reducible through strict criteria; resource changes are policy-dependent).  
  - **Step 6**: **Proceed** (clinical benefits of treating undiagnosed adults outweigh mitigable risks).  
  **Outcome**: Clear approval.  

  **Proposal 2: New Subthreshold Anxiety Category for Primary-Care Screening**  
  - **Step 1**: *Insufficient Evidence* (no direct precedent for subthreshold anxiety).  
  - **Step 2**: *High* (taxonomic; new label may pathologize transient anxiety, altering self-report).  
  - **Step 3**: *High* (institutional; diagnosis may unlock therapies, inflating prevalence via screening incentives).  
  - **Step 4**: *Alignment* (both high).  
  - **Step 5**: **High Harm + Irreversible** (overdiagnosis likely contaminates epidemiological baselines; stigma hard to undo; resource demands may become entrenched).  
  - **Stop Rule**: Terminate with **HALT**.  
  **Outcome**: Clear rejection.  

  **Resistance Analysis**: Proposal 2’s rejection is likely resisted. It addresses a documented gap (mild anxiety in primary care) but is halted due to unquantifiable taxonomic-institutional synergy and irreversible resource effects. Clinicians may prioritize immediate benefits, while epidemiologists emphasize corrupted data. The procedure forces conservatism when risks cannot be contained.  

  ---

  ### Limitations of the Procedure  
  1. **Scope**: Detects only taxonomic/institutional looping. Ignores economic, cultural, or non-feedback harms (e.g., pharmaceutical industry influence).  
  2. **Ethical Trade-offs**: Cannot adjudicate value conflicts (e.g., "acceptable risk" thresholds). Defers these to **HAND TO JUDGMENT**.  
  3. **Interdisciplinary Deadlocks**: Does not resolve clinician-epidemiologist disagreements beyond Step 6. Requires external arbitration.  
  4. **Predictive Uncertainty**: Relies on available evidence; novel revisions may have unforeseen loops.  
  5. **Implementation Context**: Assumes six-week evidence review; real-world policies (e.g., insurance rules) may be opaque.  

  ---  
  **Procedure Validation**: Preserves Hacking’s core insight—that classification alters the classified—while operationalizing his distinction between label-driven phenomenology (taxonomic) and system-driven incentives (institutional). Non-philosophers execute it via discrete, evidence-driven tests.
