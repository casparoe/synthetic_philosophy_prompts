answer: |-
  Here are five tightly argued exchanges addressing the core tension:

  **KNOWLEDGE-NORM ADVOCATE:** If no individual has personally verified the full model implementation—every parameterization scheme and coupling mechanism—how can *anyone* in the consortium genuinely claim *knowledge* sufficient to warrant assertion? You didn’t run the ice-sheet subroutine yourself.  
  **DISTRIBUTED-EPISTEMOLOGY DEFENDER:** Because the justification isn’t individual—it’s embedded in the consortium’s structure: specialists *did* verify their own modules against benchmarks, reviewers validated interfaces, and the emergent projection coheres across independently developed ensemble components.  
  **KNOWLEDGE-NORM ADVOCATE:** Coherence isn’t proof. If a critical error slips through an unverified coupling—say, ocean-atmosphere flux—who bears epistemic responsibility for the false assertion? Not you; you trusted the oceanographer who trusted the coder.  
  **DISTRIBUTED-EPISTEMOLOGY DEFENDER:** Responsibility *is* traceable: the flux protocol was peer-reviewed by both atmospheric chemists *and* ocean modelers, error bars quantify uncertainty from that coupling, and the system flags inconsistencies for targeted audit—it’s division of *verification labor*, not its absence.  
  **KNOWLEDGE-NORM ADVOCATE:** Division just diffuses ignorance. Asserting "X°C warming by 2100" implies someone knows X is true—but your system only shows *agreement*, not that anyone grasped the full causal chain justifying X.  
  **DISTRIBUTED-EPISTEMOLOGY DEFENDER:** Grasping the full chain individually is impossible—but the *collective* validation *is* the warrant: paleoclimate specialists vetted boundary conditions, statisticians confirmed trend significance, and sensitivity tests constrained projections. The consortium *as an epistemic agent* asserts based on integrated, scrutinized expertise.
