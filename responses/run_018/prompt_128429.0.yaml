prompt: |-
  I'm giving the opening remarks at a workshop next week — about half evolutionary biologists, half people who build evolutionary algorithms and LLMs — and I want to use Darwin's and Turing's strange inversions of reasoning to do actual structural work, not just decoration. The idea is that Darwin showed competence (adaptation) with-out any comprehending agent, and Turing flipped the burden again by saying we should grant competence (intelligence) with-out demanding we understand the internal mechanism. I need the speech to shape what I can and can't say: specifically, I shouldn't claim we understand these systems just because they work well, and I also shouldn't dismiss them just because we're partly in the dark about there internals. The biologists will roll there eyes if I treat natural selection like a cheap metaphor for backprop, and the engineers will tune out if I get too philosophical about "what intelligence really is." Can you write me about a five-minute opening that lands for both groups, keeps the tension live, and warns against those two mirror-image mistakes? I want it casual — this isn't a commencement address — but not sloppy, and I definitely don't want anything that sounds like I'm asking for a bibliography or citations, since I can't check those on the fly.
