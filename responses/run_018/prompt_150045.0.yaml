  Draft the joint statement that a committed psi-ontic realist and a committed psi-epistemicist could both sign after a good-faith adversarial collaboration concerning whether the quantum wavefunction represents a real physical state or a state of knowledge. Structure the document as follows. First, a numbered section of agreed claims: include agreement on the mathematical formalism of quantum mechanics; on the existence and nature of the measurement problem; on the empirical adequacy of the theory; on the constraints imposed by no-go results for hidden-variable theories, specifically that any viable ontological model must reproduce quantum statistics and respect parameter independence in Bell-type scenarios; and on the fact that distinct pure quantum states can yield identical predictions for some measurements but diverge for others. Second, a disagreements table in which each position is phrased in wording its own side would accept: in particular, address whether the wavefunction is uniquely determined by the ontic state of an individual system; whether preparation independence is a justified constraint on ontological models; and whether an epistemic view can avoid the objection that it renders the quantum state subjective in a way incompatible with intersubjective agreement about measurement outcomes. Third, identify the cruxes — I take the central ones to be (a) the interpretation of a hypothetical case in which a single particle is prepared in a superposition, subjected to a sequence of weak measurements that reveal expectation-value trajectories without state collapse, and then observed by two agents with access to disjoint subsets of that trajectory data; and (b) whether the success of quantum state tomography implies that the state describes an objective feature of the system or merely summarises an agent's information. For each crux, state the concrete case or argument both sides agree is relevant, and record each side's explicit prediction about what that case demonstrates. Finally, conclude with a brief assessment of whether any portion of the disagreement is verbal rather than substantive — for instance, about the meaning of "real" or "objective" — specifying which portion and why. Write in formal British English; do not request bibliographies, citations, or reading lists; and do not ask for verbatim quotations from philosophical or scientific texts.
