  ### Additional residue: Defining "the same system"
  In the discussion of strong JOOTS, we must decide what counts as the same system versus a different one. The vocabulary does not have a built-in notion of system identity. This is an additional assumption: we usually consider the consequence relation (or the set of theorems) as defining the system. But if we change the consequence relation, we get a different system. However, the notion of "jumping out" might imply a continuity that is not formally captured.

  ### Conclusion on residue
