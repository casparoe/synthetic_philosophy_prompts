  ### (b) Iteration of reflection and the unending process
  - **Translation**: Weak JOOTS (adding reflection principles) can be iterated. Each step adds a statement of consistency (Con(T) for the current theory T) to get a new theory T'. But by Gödel, T' cannot prove its own consistency, so we can do this again. This leads to a transfinite sequence of theories (ordinal logics).
