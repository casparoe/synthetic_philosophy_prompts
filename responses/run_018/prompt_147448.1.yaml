answer: |-
  Here's a decision tree designed to map the landscape of Sleeping Beauty positions based on your criteria. It prioritizes concrete operational questions over labels and includes the non-ergodic angle. It identifies 7 distinct leaves and flags key boundaries.

  **Decision Tree: Sleeping Beauty Positions**

  1.  **Node 1: Does learning "I am experiencing an awakening now" constitute new evidence that can/should update Beauty's credence in Heads (P(Heads))?**
      *   **Case Question:** *Beauty knows the experimental setup on Sunday (P(Heads)=1/2). Upon awakening, before learning anything else specific about the day or coin, does the fact that she is experiencing an awakening provide her with new information relevant to P(Heads)?*
      *   **Branch Yes:** Go to Node 2.
      *   **Branch No:** Go to Node 3 (Halfer Core).

  2.  **Node 2 (Given awakening is evidence): How is the awakening event epistemically treated?**
      *   **Case Question:** *Beauty is woken Monday and reliably informed that if the coin is Tails, she will be woken again Tuesday, but using a different, unknown protocol (e.g., a biased coin flip determines the Tuesday awakening). Does this "protocol uncertainty" fundamentally change how she should reason about the current (Monday) awakening relative to Heads vs. Tails?*
      *   **Branch (Awakening is a Random Draw):** The awakening should be treated as if randomly sampled from the set of *all possible awakenings* (Mon-Heads, Mon-Tails, Tue-Tails). The uncertainty about the Tuesday protocol makes this analogy strained or inappropriate. Go to Node 4 (Thirder Core).
      *   **Branch (Awakening is Pure Indexical):** The awakening provides purely self-locating information ("I am here now"). Its evidential import depends solely on the indexical relationship to the branching possibilities defined by the coin flip and the *known* rules (Mon & Tue awakenings under Tails). Protocol uncertainty doesn't alter the core indexical evidence gained. Go to Node 5.

  3.  **Node 3 (Halfer Core - Awakening not evidence): Can Beauty's credence change *during the experiment* without receiving new uncentered evidence?**
      *   **Case Question:** *Beauty awakens. Later, a reliable guard whispers "It is Monday" (new centered evidence). Her P(Heads) updates to 1/2. If the guard then retracts this, saying "I was mistaken, I have no day information for you," reverting Beauty to her initial awakened state, must her P(Heads) revert to 1/2?*
      *   **Branch Yes (Strict Conservation):** Centered evidence *only* shifts credence between centered possibilities *within* the fixed uncentered possibilities (Heads/Tails). Removing centered evidence reverts to the prior credence over uncentered possibilities. **Leaf: Lewisian Halfer** (P(Heads|Awake) = 1/2; P(Heads|Monday) = 1/2).
      *   **Branch No (Shift Allowed):** While awakening itself isn't evidence *for Heads vs Tails*, receiving and then losing centered evidence can create a situation where P(Heads) in the ambiguous awakened state differs from the initial 1/2, even without new uncentered evidence. **Leaf: Double-Halfer** (P(Heads|Awake) = 1/2; P(Heads|Monday) = 2/3). *Rationale:* Awakening splits possibilities; learning Monday eliminates the Tails-Tuesday branch, concentrating probability on Heads *relative to the remaining possibilities* after splitting. Retracting doesn't perfectly undo this.

  4.  **Node 4 (Thirder Core - Random Draw): Is the sampling process ergodic?**
      *   **Case Question:** *Imagine Beauty is woken repeatedly in identical experimental runs (same coin flip mechanism). Could the long-run frequency of "Heads" awakenings observed by Beauty differ systematically from the proportion of possible awakening slots that are "Heads" awakenings (1/3) within a single run, due to the temporal structure of the sampling?*
      *   **Branch No (Non-Ergodic Risk):** Yes, it could differ. Awakenings are sequential time slices within a single causal history. Observing an awakening isn't equivalent to randomly sampling from a pre-existing set of "awakening tokens" across all possible worlds. The process might not be mixing, or the "ensemble" might not be well-defined before equilibrium is reached (if ever). **Leaf: Non-Ergodic Thirder Skeptic** (Tentative P(Heads|Awake) ≈ 1/3, but recognizes potential fragility; emphasizes temporal embeddedness). *Note: This is less explored; often leads to rejecting the random draw model.*
      *   **Branch Yes (Ergodic Assumption):** No significant difference. The "reference class" of possible awakenings (Mon-H, Mon-T, Tue-T) is epistemically valid for sampling, regardless of temporal sequence. Long-run frequency = in-run proportion. **Leaf: Elga's Thirder** (P(Heads|Awake) = 1/3; based on indifference over awakenings).

  5.  **Node 5 (Thirder Core - Pure Indexical): Does the centered evidence uniquely identify a temporal branch?**
      *   **Case Question:** *Upon awakening, Beauty receives purely self-locating evidence ("I am experiencing an awakening"). Does this evidence uniquely pick out one specific temporal branch (e.g., "Monday" or "Tuesday") within the possible world she inhabits?*
      *   **Branch No (Ambiguous Branch):** The evidence is compatible with multiple branches (Mon & Tue under Tails). It rules out being in a state *without* an awakening (e.g., Tuesday under Heads), but doesn't distinguish between branches *with* awakenings. The prior probabilities of the centered possibilities (world+branch) must be updated accordingly. **Leaf: Indexical Conditioning Thirder** (P(Heads|Awake) = 1/3; based on updating Sunday's prior over world+branch using "awakening now" evidence). *Note: Close to Elga but emphasizes centered propositions.*
      *   **Branch Yes (Branch-Specific):** Vacant. The evidence "awakening now" does *not* uniquely identify "Monday" or "Tuesday" when Tails is true. Claiming it does would be incoherent given the setup. *Rationale: Incoherent premise.*

  **Key Notes & Limitations:**

  1.  **Non-Ergodic Branch (Node 4-No):** This is the least developed position, reflecting your interest. It often challenges the core "random draw" intuition of standard thirders. Positions here might lean towards 1/3 pragmatically but reject the standard justification, or favor 1/2 due to temporal embedding concerns. It's not a neatly named position.
  2.  **Double-Halfer (Node 3-No):** This position is stable but controversial. Critics argue the "shift without uncentered evidence" violates core Bayesian principles. Proponents argue it correctly handles the dynamics of centered evidence.
  3.  **Blurred Lines:**
      *   **Elga (Node 4-Yes) vs. Indexical Conditioning (Node 5-No):** These are very close in practice and motivation. The case question in Node 2 tries to separate them, but proponents of both might answer similarly. The distinction is primarily metaphysical (sampling vs. centered belief).
      *   **Lewisian Halfer (Node 3-Yes) vs. Non-Ergodic Skeptic (Node 4-No):** While vastly different in P(Heads|Awake), they *both* fundamentally reject the standard thirder's "random draw" or "indifference over awakenings" justification. The skeptic might even end up near 1/2.
  4.  **Vacant Branches:** Only Node 5-Yes is explicitly vacant due to incoherence. Other combinations (e.g., "Awakening Not Evidence" + "Ergodic Assumption") aren't logically vacant but aren't explored because they don't map onto the core disputes or lead back to existing leaves.
  5.  **Smuggling In?** The tree assumes the core setup is understood (Beauty knows the protocol, memory is wiped, awakenings are subjectively identical). It focuses *only* on the epistemic update mechanics upon awakening. It doesn't smuggle in an answer but structures the debate around the key operational disagreements you identified. Your emphasis on *how* belief updates, not just *what* it updates to, is central.
  6.  **Self-Locating Belief:** Your focus is correct. The core disagreement *is* about how agents update self-locating beliefs ("where/when am I within the world?") based on indexical evidence ("I am experiencing this now"), especially when combined with uncertainty about uncentered facts (Heads/Tails). The non-ergodic angle questions whether standard Bayesian conditioning over centered propositions is appropriate for this specific temporal setup.

  This tree captures the major named positions (Lewisian Halfer, Double-Halfer, Elga's Thirder) and maps them onto concrete operational choices. It also carves out space for the less common Indexical Conditioning Thirder and your area of interest (Non-Ergodic Skeptic), while identifying why some combinations are vacant or blurred.
