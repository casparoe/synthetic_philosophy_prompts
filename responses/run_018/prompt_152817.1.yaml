prompt: |-
  Hey, I'm trying to map out where the real leverage points are in decision-theoretic AI safety, specifically around counterfactual mugging — where some predictor rewards or punishes you based on what you'd do in a simulated counterfactual — and XOR-style blackmail setups where threats are arranged with exclusive-or conditions so that complying with one invites the other. You should act like a philosopher who's actually worked on formal decision theory and alignment framing, not just a generalist. Start with a quick brain-dump of what you think the landscape looks like, then organize it.

  What I actually need is a defended prioritization, not a survey. Suppose you have a small research group — say two people with philosophy logic backgrounds, one year, zero ML compute — and you want them to work on open questions in this space that could genuinely change how we'd design an agent's decision procedure. Which questions or lines of work matter most, in what order, and why? For each, explain how tractable it is for philosophers rather than engineers, whether it's upstream of other issues, and what kind of result over the next year would make you bump it up or down. Also flag which ones are overrated or don't actually affect agent design.

  Please truely seperate what's genuinely settled in this area (like, the basic logical structure of Newcomb-style prediction problems) from what's still contested among people who actually understand the formalism — don't present a contested view as if it's the consensus.

  Also, I want you to factor in two niche variants that aren't in the standard literature: "stochastic XOR blackmail," where the blackmailer only gets a noisy signal of your decision procedure rather than running a perfect simulation, and "counterfactual mugging with bounded predictors," where the predictor runs a truncated simulation with a hard compute cap. Do these break any of the classic answers? Which open questions become more urgent once you allow for noisy or bounded prediction?

  Don't give me a bibliography or citation list — I'm working offline and need arguments I can evaluate on their own. Just the agenda, the reasoning, and the ranking.
reasoning: |-
  We are given a specific research agenda setup: two philosophers with logic backgrounds, one year, no ML compute. We focus on decision-theoretic AI safety, particularly counterfactual mugging and XOR blackmail, including stochastic and bounded variants.

  The goal is a defended prioritization of open questions that could change agent design. We must separate settled from contested issues and consider two niche variants.

  Settled Issues (Consensus among Formalists):
  1. Newcomb's Problem: One-boxing dominates in the standard case when the predictor is perfect. This is settled by dominance arguments and causal decision theory (CDT) vs. evidential (EDT) vs. functional decision theory (FDT) debates. The logical structure is clear: if the prediction is based on your actual decision procedure, then one-boxing is correct for FDT/UDT agents and two-boxing for CDT.
  2. XOR Blackmail: Standard setup (with perfect predictors) is also settled in the same vein: paying in both cases is bad (because only one blackmailer is real, and paying both is dominated by paying none) but the agent must condition on the blackmailer's knowledge. FDT-style agents (that consider the logical output of their decision in all relevant situations) do not pay, while CDT might pay in one case but then gets exploited.

  Contested Issues (Where Formalists Disagree):
  1. How to handle logical uncertainty in decision-making (e.g., when the agent doesn't know the outcome of its own computation in counterfactuals).
  2. The exact formulation of FDT/UDT (Updateless Decision Theory) and how to generalize it to arbitrary problems (especially with multiple agents or logical correlations that are not pre-computed).
  3. How to handle bounded rationality (computational limits) in decision theory, especially in the context of prediction.

  Niche Variants:
  1. Stochastic XOR Blackmail: The blackmailer gets a noisy signal of your decision. This breaks the perfect correlation, making the problem more realistic but also more complex. Classic answers (like FDT not paying) might not hold because the signal might be weak.
  2. Counterfactual Mugging with Bounded Predictors: The predictor runs a truncated simulation. This breaks the perfect prediction, and the agent might have to account for the predictor's computational limitations.

  Research Agenda Prioritization:

  We are to rank research questions by:
  - Potential impact on agent design (if solved, would it change how we build agents?)
  - Tractability for philosophers (logic background, no compute)
  - Whether it's upstream (solving it would help with other problems)
  - What a result in the next year would look like to change priority.

  We also flag overrated or non-impactful lines.

  Ranked List:

  1. **Formalizing Bounded Rationality in Decision Theory (with focus on Bounded Predictors)**
     - Why: This is critical because real agents (including AIs) are bounded. The standard FDT/UDT assumes unbounded computation for both the agent and the predictor. But in reality, predictors (even superintelligent ones) might use approximations. This variant breaks classic answers and forces us to design agents that can handle approximate predictions.
     - Tractability: Philosophers can work on formal models of bounded reasoning (using logic, probabilistic reasoning) without needing ML compute. They can use toy models and proofs.
     - Upstream: Yes, because boundedness affects every decision problem. Solving this would influence how we design agents to interact with any imperfect predictor.
     - Next-year result: A formal model of an agent that performs well in counterfactual mugging with a bounded predictor, with proofs of robustness to the predictor's truncation depth. This would demonstrate a path forward for practical agent design.
     - Impact on variants: Directly addresses the bounded predictor variant. Also, stochastic variants might be approached similarly (noise as a form of boundedness).

  2. **Handling Logical Uncertainty in Decision Theory**
     - Why: In counterfactual mugging, the agent must reason about what it would do in a counterfactual, but if the agent hasn't fully computed its own decision in that scenario, it faces logical uncertainty. This is a major open problem and is upstream of many issues (including the bounded case).
     - Tractability: Philosophers with logic backgrounds are well-suited to formalize logical uncertainty (using proof theory, probabilistic logic, etc.).
     - Upstream: Very much so. Without this, agents cannot be built for complex logical environments.
     - Next-year result: A decision theory that integrates logical uncertainty and shows improved performance in counterfactual mugging and XOR blackmail. A formal proof that the agent avoids paying in XOR blackmail even under logical uncertainty.
     - Note: This is often confused with probabilistic uncertainty (which is more settled). Logical uncertainty is about unknown logical facts (like the output of a program).

  3. **Stochastic XOR Blackmail: Robustness to Noise**
     - Why: Real blackmailers won't have perfect simulation. The agent must decide whether to pay when the blackmailer has a noisy signal. This breaks the standard FDT answer because the correlation is imperfect. We need to know how an agent should behave in such cases to avoid exploitation.
     - Tractability: Philosophers can model this using probability theory and game theory (without needing simulations). They can define the problem and prove properties of decision strategies.
     - Upstream: Less upstream than the first two, but still important for real-world safety (where adversaries have imperfect information).
     - Next-year result: A formal characterization of when an agent should pay in stochastic XOR blackmail, and a decision strategy that minimizes loss across the noise levels. This would inform agent design in adversarial settings.
     - Caveat: This problem is more specific than the first two. It's a test case for the more general issue of imperfect correlation.

  4. **Clarifying the Foundations of FDT/UDT**
     - Why: There are multiple versions of FDT/UDT, and the field is not settled on which one is the "right" generalization. This matters because agent design hinges on the core decision theory. However, this might be more of a foundational debate that doesn't immediately lead to new designs.
     - Tractability: Pure philosophy and logic. But it might be intractable to resolve in one year because it's deeply philosophical.
     - Upstream: In principle, yes, but we already have working versions of FDT that handle the standard cases. The open questions are about edge cases and unification.
     - Next-year result: A unified formalization of FDT that resolves the existing ambiguities and applies cleanly to the niche variants. But if achieved, it would be high impact.
     - Overrated? Possibly, because we might be able to build agents without full philosophical consensus (using the existing FDT as a basis and then extending it for boundedness and uncertainty). So this is ranked lower.

  5. **Multi-Agent Extensions (e.g., in XOR blackmail with multiple blackmailers coordinating)**
     - Why: Real adversaries might coordinate. But this is less central to the core decision theory and more about game theory. We focus on single-agent decision theory in this agenda, so it's lower.
     - Tractability: Philosophers can handle it, but it's a bigger problem.
     - Upstream: Not as much because single-agent is the foundation.
     - Next-year result: Limited. We skip for now.

  Overrated/Non-Impactful:
  - **Rehashing the CDT vs. EDT vs. FDT debate for standard problems**: This is settled. Repeating it won't change agent design.
  - **Building complex simulations without formal proofs**: Without compute, and for philosophers, this is not tractable. Also, the value is limited without formal insights.

  Summary of Prioritization Order:
  1. Bounded Rationality (especially with bounded predictors) - because it's the most pressing for real agents and breaks classic answers.
  2. Logical Uncertainty - because it's a major blocker for implementing FDT-style agents in complex logical environments.
  3. Stochastic XOR Blackmail - as an important test case for robustness to imperfect information.
  4. Foundational Clarification of FDT/UDT - important but might not yield immediate design changes.

  Adjustments based on progress:
  - If bounded rationality shows quick wins (e.g., a simple model that works for counterfactual mugging with bounded predictors), then double down on that.
  - If logical uncertainty turns out to be too hard, then shift focus to stochastic blackmail as a concrete challenge.

  These two niche variants (stochastic and bounded) make the bounded rationality and logical uncertainty questions more urgent because they break the perfect prediction assumption that underlies the classic answers.
answer: |-
  ### Prioritized Research Agenda: Decision-Theoretic AI Safety  
  **Constraints:** 2 philosophers (logic backgrounds), 1 year, zero ML compute. Focus on **counterfactual mugging** (CFM), **XOR blackmail**, and their stochastic/bounded variants. Goal: identify leverage points that could change how we design agents' decision procedures.  

  **Core Philosophy:** Prioritize questions that are:  
  - **Upstream**: Affect multiple problems or reveal foundational flaws.  
  - **Tractable**: Solvable with formal logic/probability, not engineering.  
  - **Impactful**: Lead to novel agent designs (e.g., robust FDT/UDT variants).  
  - **Underexplored**: Avoid rehashing settled debates (e.g., Newcomb’s dominance).  

  **Settled vs. Contested Landscape** (Consensus among Formalists):  
  - **Settled**:  
    - Newcomb’s Problem: Dominance of one-boxing under perfect prediction (FDT/UDT > CDT).  
    - XOR Blackmail (standard): Paying *both* blackmailers is strictly dominated (FDT/UDT agents refuse payment; CDT defects unsafely).  
    - CFM (standard): FDT/UDT pays in the counterfactual; CDT refuses, losing high-payoff outcomes.  
    *No serious debate here. These are consequences of the formalisms.*  
  - **Contested**:  
    - **Logical Uncertainty**: How agents handle unknown outcomes of *their own decision procedure* (e.g., in nested counterfactuals).  
    - **Bounded Rationality**: How resource constraints affect optimal decisions (ignored in most decision theories).  
    - **FDT/UDT Foundations**: How to formalize "logical counterfactuals" without circularity or infinite regress.  
    - **Multi-Prediction Coordination**: Handling predictors with conflicting incentives (e.g., in XOR variants).  

  ### Top-Priority Research Lines (Ranked)  
  #### **1. Bounded Predictors in CFM & XOR Blackmail**  
  **Why highest priority?**  
  - Breaks core assumptions of FDT/UDT (which assume perfect prediction). Bounded predictors (e.g., truncated simulations) make standard answers (e.g., FDT paying in CFM) fail catastrophically.  
  - Upstream of all prediction-based problems: Real agents face computational limits, so this directly affects design (e.g., how to budget computation for counterfactuals).  
  - **Tractability**: Pure formal logic. Use computational complexity bounds, proof theory, and information-theoretic models. No ML needed.  
  - **Urgency with Variants**:  
    - *Bounded CFM*: If the predictor’s simulation is truncated, FDT may overpay (simulation too shallow to reflect true decision).  
    - *Bounded XOR*: Predictors with imperfect simulation might misestimate agent behavior, making refusal unsafe.  
  - **Target Result (1 year)**:  
    - Formalize a "bounded FDT" that maximizes expected utility against predictors with hard compute caps.  
    - *Success metric*: Prove robustness in CFM (e.g., agent pays iff predictor depth exceeds a threshold based on agent’s own complexity).  
    - **Upgrade/downgrade**: Bump up if initial models show tractable bounds; downgrade if boundedness reduces to noise (see #2).  

  #### **2. Stochastic XOR Blackmail**  
  **Why #2?**  
  - Breaks XOR’s standard solution: With noisy signals, refusing *all* blackmail becomes suboptimal (noise creates exploitation gaps).  
  - Tests the *robustness* of decision theories: Real-world adversaries (e.g., other AIs) will have imperfect information.  
  - Upstream of adversarial settings (e.g., security games where threats are correlated probabilistically).  
  - **Tractability**: Stochastic processes can be modeled with probabilistic logic and game theory. Philosophers excel here.  
  - **Urgency with Variants**:  
    - Noise makes FDT’s "logical correlation" argument fail. An agent must now weigh *evidence* (e.g., signal reliability) against extortion.  
    - Example: If Blackmailer A’s signal has 90% accuracy and B’s has 60%, should the agent ever pay? Current FDT has no answer.  
  - **Target Result (1 year)**:  
    - Axiomatize a decision rule for stochastic XOR that minimizes regret across noise levels.  
    - *Success metric*: Show that this rule dominates FDT when signal error >10% in toy cases.  
    - **Upgrade/downgrade**: Bump up if linked to logical uncertainty (#3); downgrade if boundedness (#1) subsumes noise.  

  #### **3. Logical Uncertainty in Nested Counterfactuals**  
  **Why #3?**  
  - Core flaw in FDT/UDT: Agents cannot perfectly compute their own outputs in all counterfactuals (e.g., undecidable subproblems).  
  - Upstream of *all* logical decision theories: If an agent can’t resolve its own counterfactuals, CFM/XOR incentives break down.  
  - **Tractability**: Philosophers can leverage proof theory (e.g., bounded logical induction) and type systems.  
  - **Urgency with Variants**:  
    - *Bounded predictors*: Amplifies uncertainty (predictor can’t simulate agent’s full reasoning).  
    - *Stochastic XOR*: Noise compounds uncertainty in logical inferences.  
  - **Target Result (1 year)**:  
    - Extend logical induction to decision-making, with probabilistic guarantees for CFM outcomes.  
    - *Success metric*: Prove that an agent with limited proof depth pays in CFM >90% of the time when it should.  
    - **Upgrade/downgrade**: Bump up if integrated with boundedness (#1); downgrade if infeasible without compute.  

  #### **4. Foundations of Logical Counterfactuals (FDT/UDT)**  
  **Why lowest?**  
  - Important but less urgent: Debates here (e.g., "best guess" counterfactuals) are philosophical and unlikely to change agent design soon.  
  - Partial consensus exists: FDT/UDT works under perfect prediction, but foundations are messy (e.g., no unified formalization).  
  - **Tractability**: High for philosophers, but risk of dead-end abstraction.  
  - **Target Result (1 year)**:  
    - A consistency proof for logical counterfactuals under resource bounds.  
    - *Success metric*: Resolve one key ambiguity (e.g., how to handle counterfactuals with logical contradictions).  
    - **Overrated?** Yes. Foundational work rarely impacts design without empirical pressure (e.g., boundedness). Prioritize only if #1–3 stall.  

  ### Lower-Priority/Overrated Areas  
  - **Rehashing Newcomb’s or Standard XOR**: Settled. No design impact.  
  - **Full Multi-Agent Extensions**: Intractable without compute; game theory is downstream.  
  - **Quantum or Physics-Based Models**: Speculative and irrelevant to agent design.  

  ### Why This Order?  
  1. **Boundedness (#1)** is the biggest gap: Real agents are resource-constrained, and bounded predictors break FDT/UDT. Solving this could yield a new decision procedure (e.g., "resource-rationed FDT").  
  2. **Stochasticity (#2)** tests real-world robustness: Noise is unavoidable, and safe agents must handle it.  
  3. **Logical uncertainty (#3)** underpins the others: Without it, agents can’t reason about themselves.  
  4. **Foundations (#4)** is backup: Only pursue if concrete problems (#1–3) reveal foundational flaws.  

  **Expected Outcomes in 1 Year**:  
  - A **bounded FDT protocol** for CFM/XOR (design impact: agents that avoid overcommitting computation).  
  - **Noise-robust decision rules** for adversarial settings (design impact: agents that resist probabilistic blackmail).  
  - **Logical uncertainty bounds** (design impact: agents that gracefully degrade under complexity pressure).  

  **Risks**: Boundedness (#1) might be too hard, but even partial results (e.g., for shallow predictors) would validate the approach. If so, pivot to #2–3. Stochasticity (#2) is a fallback if #1 stalls. This agenda ensures that by year’s end, your group produces tools for *safer agent designs under realism* (imperfect prediction, noise, and bounds).
