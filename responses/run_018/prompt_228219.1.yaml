prompt: |-
  Two friends of mine got into a surprisingly heated argument last weekend and I want a verdict. Our mutual friend Dana donated a kidney to a stranger through a non-directed donation program. Over drinks, Marcus said what she did wasn't just good, it was morally required: she had two working kidneys, the risk to her was low, someone was dying, and if it's the best thing she could do then calling it "above and beyond" is just a way of letting the rest of us off the hook. His line was basically that the category of supererogation is incoherent -- either she had most reason to do it, in which case it was obligatory, or she didn't, in which case donating wasn't actually the right thing.

  Jess pushed back that this makes morality insanely demanding, since on Marcus's view we should all be donating kidneys and giving away most of our money, and nobody can live like that. Marcus said that confuses what's wrong with what's blameworthy -- maybe morality requires the kidney but we're not justified in condemning people who don't, so the demandingness is real and we should just be honest about it. Jess conceded that was a better distinction than she'd expected, but said there's still something off: morality has to leave room for people to weigh their own projects and commitments, and Dana's donation is admirable precisely because it was optional -- she could have permissibly declined, which is why we praise her rather than just noting she did her duty. Marcus said "agent-centered prerogative" talk is just a polite name for permission to be selfish, and that Jess is confusing what we can get away with socially with what's actually permitted. Jess's last move was that if everything best is obligatory, the concept of a moral hero collapses, and any theory that can't distinguish Dana from someone who merely pays their taxes has lost something important. Then they both looked at me.

  Please go through the exchange move by move: who's right about what, which concessions were too quick or too slow, what both of them are missing, and who's more right overall about whether supererogation is a coherent category.
reasoning: |-
  Hmm, this user is presenting a fascinating ethical debate between their friends Marcus and Jess about kidney donation and supererogation. They want me to analyze the exchange move by move and determine who's more correct about whether "above and beyond" moral actions are coherent.

  Looking at Marcus's position first - he's making a strong utilitarian argument that collapses supererogation into obligation. His core claim that "either an action has most reason to do it (obligatory) or it doesn't (not right)" comes straight from act-consequentialism. The distinction he makes between wrongness and blameworthiness is actually quite sophisticated - he's acknowledging psychological limitations while maintaining moral demandingness. 

  Jess counters with three important points: demandingness objection, agent-centered prerogatives, and the collapse of moral heroism. Her intuition about morality needing "space" for personal projects reflects Bernard Williams' integrity objections. When she says Dana's action is admirable because optional, she's pinpointing the essence of supererogation - the gap between duty and sacrifice.

  The key philosophical fault line here is between consequentialist and non-consequentialist frameworks. Marcus is essentially channeling Peter Singer's famous pond analogy, while Jess is invoking ideas from moral philosophers like Susan Wolf or Michael Slote. 

  What both might be missing: Marcus underestimates how agent-relative reasons fundamentally alter moral calculus - it's not just about outcomes but about whose outcomes. Jess might not fully engage with how "optional" actions could still be morally required if they prevent great harm at little cost. The kidney case is particularly potent because it's a one-time act with minimal risk and massive benefit.

  On balance, I think Jess has the stronger position but for incomplete reasons. Supererogation remains coherent if we accept that morality has multiple dimensions (duty, virtue, care) and that reasons can be agent-relative. The moral hero concept doesn't collapse - it just shifts from "beyond duty" to "exceptional fulfillment of imperfect duties." Dana's act isn't optional in the sense that refusing would be blameless, but it's supererogatory in requiring exceptional virtue.
answer: |-
  Here's a move-by-move analysis of the argument, evaluating the philosophical strength of each position, key concessions, what's missing, and the coherence of supererogation:

  ### **The Exchange & Analysis**
  1. **Marcus's Opening Claim: Supererogation is Incoherent**
     - *Claim*: If donating was the "best" action (maximizes good, minimal risk), it was obligatory. If not "best," it wasn't actually right. No middle ground exists.
     - **Strengths**: 
       - Logically rigorous within *act-consequentialism* (if maximizing good is always obligatory).
       - Highlights discomfort with using "supererogatory" to excuse inaction when lives are at stake.
     - **Weaknesses**: 
       - Assumes moral reasons are exclusively *impersonal* (focused only on outcomes, not the agent's perspective).
       - Ignores that "best" is context-dependent and agent-relative (e.g., "best for whom?").

  2. **Jess's Pushback: Demandingness & Psychological Reality**
     - *Claim*: Marcus's view is too demanding (donate kidneys, give away most income). Normal people can't live this way.
     - **Strengths**: 
       - Correctly identifies extreme demands of *strict consequentialism*. 
       - Reflects real-world moral psychology (people need personal projects).
     - **Weaknesses**: 
       - Concedes too quickly that demandingness alone refutes Marcus. Demandingness ≠ false (e.g., maybe morality *is* hard).
       - Fails to address Marcus's core argument about reason-balancing.

  3. **Marcus's Distinction: Wrongness vs. Blameworthiness**
     - *Claim*: Not donating *could* be wrong but not blameworthy due to human limitations (weakness, bias, social norms).
     - **Strengths**:
       - Sophisticated move separating *objective duty* from *subjective accountability*. 
       - Avoids Jess's demandingness trap (we can agree an act is wrong without always blaming the agent).
     - **Weaknesses**: 
       - Still reduces morality to a single scale of "good produced," neglecting *agent-relative permissions* (e.g., prioritizing your child over a stranger).

  4. **Jess's Agent-Centered Prerogative**
     - *Claim*: Morality must allow space for personal commitments. Dana is admirable *because* she could permissibly decline.
     - **Strengths**:
       - Defends *agent-centered prerogatives* (Samuel Scheffler's term): Morality isn't just about outcomes; agents have a legitimate stake in their own lives.
       - Captures why we *praise* Dana: Supererogation requires optionality.
     - **Weaknesses**:
       - Doesn't *prove* such prerogatives exist; just asserts they must. Needs deeper justification.

  5. **Marcus's Counter: "Prerogatives = Selfishness"**
     - *Claim*: Agent-centered permissions are just excuses for selfishness disguised as philosophy.
     - **Strengths**: 
       - Forces Jess to justify *why* agents may permissibly prioritize themselves when greater good exists.
       - Exposes a tension: If saving a life is low-cost (like kidney donation), is *any* self-preference justified?
     - **Weaknesses**:
       - Overlooks that *all* moral theories (even Kantianism) allow some self-regard. Calling it "selfishness" ignores legitimate personal value.

  6. **Jess's Final Move: The Moral Hero**
     - *Claim*: If all best acts are obligatory, "moral hero" loses meaning. We lose the distinction between Dana (hero) and a taxpayer (minimal duty).
     - **Strengths**:
       - Highlights a vital *phenomenological* point: Our moral concepts (praise, admiration, heroism) depend on supererogation.
       - Exposes a cost of Marcus's view: It flattens morality, making exceptional sacrifice *expected*.
     - **Weaknesses**:
       - Marcus could reframe heroism as "excelling at duty" (e.g., a firefighter who runs into a burning building does their duty exceptionally).

  ---

  ### **What Both Are Missing**
  - **Marcus** misses that reasons can be *agent-relative*. Saving a stranger *might* be the best outcome, but I have stronger reasons to care for my own health/child than yours. Morality isn't just calculus.
  - **Jess** misses a robust defense of *why* agent-relative permissions exist. Are they grounded in autonomy? Flourishing? The value of personal integrity (Bernard Williams)?
  - **Both** underplay **threshold deontology**: Some acts (saving life at low risk) *become* obligatory regardless of cost-benefit, while others (donating all wealth) don’t.
  - **Both** overlook **virtue ethics**: Dana’s heroism reflects extraordinary compassion, not just rule-following. Virtue exceeds mere duty.

  ---

  ### **Verdict: Who's More Right?**
  **Jess wins on points, but Marcus exposes uncomfortable truths.**

  1. **Supererogation is Coherent**: Jess is correct that the category holds. Morality has:
     - **Duties** (what you must do, e.g., not kill).
     - **Supererogatory Acts** (what you *may* omit without blame but deserve praise for doing, e.g., Dana's donation).
     - **Optionality is key**: If Dana *had* to donate, she wouldn’t be a hero.

  2. **Why Marcus Isn't Wholly Wrong**:
     - His "wrong but not blameworthy" distinction is valid and important.
     - He's right that we often use "above and beyond" to avoid hard duties (e.g., giving to effective charities).

  3. **Why Jess's View is Stronger**:
     - **Psychological realism**: Morality must accommodate human nature. A theory demanding constant self-sacrifice is unsustainable and alienating.
     - **Preserves moral concepts**: Heroism, praise, and personal integrity collapse without supererogation.
     - **Balances values**: Morality isn't just about outcomes; it's also about relationships, identity, and permissible self-regard.

  **Key Insight**: Supererogation works if we accept **moderate dualism**:  
  - We have *general duties* to help others (mitigating suffering when feasible).  
  - But we also have *agent-relative permissions* to pursue personal goals, *unless* the cost to others is extreme (e.g., low-risk kidney donation crosses a threshold into duty for some, but not all, theories).  

  Dana's act is supererogatory because while donating was *very* good and perhaps "beyond minimal duty," it wasn't *strictly required* given legitimate self-regard. We praise her because she subordinated self-interest to compassion *voluntarily*. Marcus’s view makes morality inhumanely demanding; Jess preserves its texture. Tell your friends the coherent category stands—but Marcus’s challenge should make us reflect on when "optional" help becomes obligatory.
