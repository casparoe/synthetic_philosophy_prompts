  ### Scenario  
  M undergoes a gradual brain-replacement procedure over months, swapping neurons for synthetic equivalents one by one. At 70% completion, a malfunction leaves M’s hybrid brain (70% synthetic, 30% biological) in suspended animation. Recorded neuron data is streamed to two labs: **Lab A** immediately grows a full synthetic brain (simulating the missing 30%), implants it in a clone body, and activates it. **Lab B** waits a year, cultures biological neurons from M’s tissue to complete the remaining 30% in M’s original body (kept alive but unconscious), initializing the new neurons generically, and activates it. Both A and B awaken with ~70% of M’s memories/personality (shared with each other and M), but A is 100% synthetic in a new body, while B is in M’s original body with 30% new biological neurons.  

  ### Inheritance Outcomes per Theory  
  1. **Bodily-Continuity Theory**:  
     - **Verdict**: **B inherits**.  
     - **Why**: Only B preserves M’s biological body and partial brain matter (the original 30% biological neurons). Continuity of the *physical organism* is paramount.  

  2. **Psychological-Continuity Theory**:  
     - **Verdict**: **Neither inherits**.  
     - **Why**: Both A and B have ~70% psychological overlap with M, but the *branching* (two claimants with equal claim to M’s psychology) violates non-branching requirements for identity. M’s survival requires a unique psychological successor.  

  3. **Closest-Continuers Theory**:  
     - **Verdict**: **A inherits**.  
     - **Why**: A is the *soonest and most causally direct* continuer—created immediately after the malfunction using M’s data. B’s delayed activation (1 year) and reliance on generic neuron initialization make it a weaker continuer.  

  ### The Single Feature Doing the Work: **Temporal/Causal Asymmetry**  
  - **How it splits the theories**:  
    - Bodily continuity ignores timing, focusing only on the physical body (B wins).  
    - Psychological continuity treats timing as irrelevant to branching (neither wins).  
    - Closest continuer prioritizes immediacy and causal proximity (A wins).  
  - **If removed (e.g., both labs activate simultaneously)**:  
    - Bodily continuity still picks B (body is unchanged).  
    - Psychological continuity still picks neither (branching persists).  
    - Closest continuer **collapses into ambiguity**—no temporal break to tip the scale. Theories *disagree* (B vs. neither), but the three-way split vanishes.  

  ### Does B’s Biological Tissue "Cheat"?  
  - **No**. Bodily continuity explicitly requires biological persistence—B’s 30% preserved original neurons + original body satisfy this. However:  
    - The new 30% biological neurons are *cultured from M’s tissue but generically initialized*, so they contribute to bodily continuity *without* adding unique psychological content. This avoids "smuggling" extra psychological weight.  

  ### Does This Isolate the Problem?  
  **Yes**. The split isn’t from stacked ambiguities but from **one core tension**:  
  > *"Does survival depend on the body’s persistence (B), unique psychology (neither), or immediate causal succession (A)?"*  
  Each theory isolates a different aspect (body, psychology, causal immediacy), and the temporal asymmetry forces them apart. If all theories agreed on the same survivor despite the asymmetry, the case would fail—but they don’t. You’ve engineered a clean fracture.
