prompt: |-
  I'm in a comparative constitutional design course and got into this weird argument with a friend about whether constitutional monarchies are just expensive heritage museums or if they actually do hidden demcratic work that republics miss. I'm trying to map out the real open conceptual questions - not the tired "should Britain abolish the monarchy" debate, but the unresolved issues about reserve powers, symbolic neutrality, and informal influence in places like the UK, Norway, Sweden, and Japan.

  If you were advising someone with about three years to spend on democratic theory related to monarchy, which lines of work actually matter most and why? For instance, is whether conventional constraints on royal prerogative stay stable under populist pressure the upstream question everything else depends on? Or is it whether monarchs serve as non-electoral accountability mechanisms? Or maybe whether the Scandinavian practice - where the monarch technically appoints the government but stays visibly apolitical - creates useful ambiguity for democratic transitions, or just confusion?

  Please rank these (or ones I'm missing) by how much settling them would change our view of modern democracy, defend the ordering with criteria like tractability and downstream dependence, and don't bother with a bibliography or citations - I just need the reasoning. Also, say how confident you are in the ranking overall, and single out the specific point you're least sure about, since I'm sketching a short paper and don't want to build on shaky ground. There's probly a typo in here but you get the idea.
