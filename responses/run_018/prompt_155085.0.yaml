answer: |-
  Below is a reusable, real-time decision procedure for your IRB, designed as a step-by-step flowchart in words. It addresses the discursive dilemma, designated authority tagging, dissent preservation, qualified clearance, and meta-disagreements, while operating within 90-minute meetings with non-logicians. The procedure prioritizes **premise-based aggregation** (voting on R, C, V individually) as the default to uphold your protocol's requirement that all three premises must be affirmed for clearance. However, it incorporates a **conclusion-based vote** only to detect and resolve discursive dilemmas (where premise-based and conclusion-based outcomes conflict). Designated authorities are pre-assigned to avoid circularity, based on domain expertise:

  - **R (minimal risk)**: Biostatistician (B), as risk assessment hinges on statistical analysis.  
  - **C (informed consent)**: Patient advocate (PA), as adequacy for vulnerable populations requires lived-experience insight.  
  - **V (scientific value)**: Clinician-researcher (CR), as clinical relevance and scientific merit are best judged by research expertise.  
  - *Legal counsel (LC) and community representative (Com) have full voting rights but no designated authority on specific premises*. This tagging is fixed and non-negotiable to prevent circularity.

  ### Decision Procedure
  **Total Time Allocation**:  
  - Step 1–2: 15 min  
  - Step 3–5: 30 min  
  - Step 6–7: 30 min  
  - Step 8: 15 min  
  *(Total: 90 min)*

  #### Step 1: Preliminary Discussion (15 min)
  - **Purpose**: Clarify factual vs. axiological (value-based) disagreements.  
  - **Process**:  
    - Members present evidence for/against R, C, V.  
    - Chair identifies disagreements:  
      - **Factual**: Resolve with evidence (e.g., risk data).  
      - **Axiological**: Note for dissent recording (e.g., "risk is unacceptable regardless of data").  
    - If a member challenges whether R/C/V are the *right premises* (meta-disagreement), chair halts debate—this cannot be settled procedurally. Document the challenge as dissent (see Step 8).  
  - **Output**: Structured arguments for voting. No votes yet.

  #### Step 2: Vote on Premises (R, C, V) (5 min)
  - **Purpose**: Premise-based aggregation (primary path).  
  - **Process**:  
    - Secret ballot for R, C, V (yes/no). Majority = ≥4 of 7 votes.  
    - Record votes, including abstentions (treated as "no" for tallying).  
  - **Output**: Preliminary majority outcome for each premise.

  #### Step 3: Vote on Overall Clearance (Conclusion) (5 min)
  - **Purpose**: Detect discursive dilemmas.  
  - **Process**:  
    - Secret ballot: "Should this study be approved?" (yes/no). Majority = ≥4 votes.  
  - **Output**: Conclusion vote.

  #### Step 4: Apply Designated Authority Dissent Rule (5 min)
  - **Purpose**: Flag conditional status if designated authority dissents on their premise.  
  - **Process**:  
    - For each premise (R, C, V):  
      - If designated authority (B for R, PA for C, CR for V) voted "no", tag that premise with **designated dissent** (DD), regardless of majority outcome.  
      - DD overrides premise majority for clearance tier (e.g., R majority "yes" with B's dissent → R has DD).  
  - **Output**: DD tags for premises.

  #### Step 5: Resolve Discursive Dilemmas (20 min)
  - **Purpose**: Address conflicts between premise and conclusion votes.  
  - **Process**:  
    - **Case A: No dilemma** (Premise majority and conclusion vote align): Proceed to Step 6.  
    - **Case B: Dilemma detected** (Premises all have majority "yes", but conclusion vote is "no" OR premises lack majority but conclusion is "yes"):  
      - Chair announces: "Discursive dilemma detected."  
      - Allow 10-min focused discussion on the conflict.  
      - **Re-vote only on the affected premises/conclusion** (5 min).  
      - If dilemma persists, default to **premise-based outcome** (R/C/V votes) for clearance decision. Conclusion vote is used only for transparency.  
  - **Why this works**: Premises define your protocol; conclusion vote is advisory. Defaulting to premises avoids paralysis.

  #### Step 6: Determine Clearance Tier (5 min)
  - **Purpose**: Assign approval tier based on votes and DD tags.  
  - **Process**:  
    | Condition | Clearance Tier | Explanation |
    |-----------|----------------|-------------|
    | All R, C, V have majority "yes" AND no DD | **Unconditional Clearance** | Full approval. |
    | All R, C, V have majority "yes" BUT ≥1 DD | **Conditional Clearance (Tier 1)** | Approved, but DD triggers mandatory revisions (e.g., enhance consent process if PA dissents on C). |
    | Conclusion vote majority "yes" BUT ≥1 premise lacks majority | **Conditional Clearance (Tier 2)** | Approved only with major restrictions (e.g., reduce participant pool). Consequence of discursive dilemma resolution. |
    | Conclusion vote majority "no" OR ≥1 premise lacks majority (without Tier 2) | **Disapproved** | Rejected. |  
  - **Output**: Clearance decision.

  #### Step 7: Handle Irreducible Judgment Calls (5 min)
  - **Purpose**: Acknowledge procedural limits.  
  - **Process**:  
    - If disagreement persists on **axiological grounds** (e.g., "risk is inherently wrong") or **meta-disagreement** ("premises are inadequate"), chair declares: "This exceeds procedural resolution; dissent will be recorded."  
    - Decision stands per Step 6, but dissent is preserved (Step 8).  
  - **Unavoidable flaw**: The procedure cannot reconcile conflicts about whether R/C/V should apply (meta-disagreement). It assumes premises are valid.

  #### Step 8: Document Dissents (15 min)
  - **Purpose**: Ensure transparency.  
  - **Process**:  
    - **Mandatory recording**:  
      - Vote tallies for R, C, V, and conclusion.  
      - DD tags (e.g., "B dissented on R").  
      - Any member dissenting on a premise or overall decision may submit a written statement (≤100 words) for the record.  
    - **Special cases**:  
      - If designated authority dissented (DD), minutes must state: "Clearance conditional due to designated dissent on [premise]."  
      - Meta-disagreements recorded as: "[Member] challenged applicability of [premise]."  
  - **Output**: Final decision with dissents archived.

  ---

  ### Application to Cases
  *Assume votes: 7 members (B, PA, CR, LC, Com, and 2 unnamed general members). Majority = 4+ votes.*

  #### Case 1: Straightforward Approval  
  - **Votes**:  
    - R: 7 yes (B votes yes → no DD).  
    - C: 6 yes, 1 no (PA votes yes → no DD).  
    - V: 5 yes, 2 no (CR votes yes → no DD).  
    - Conclusion: 7 yes.  
  - **Procedure**:  
    - Step 2: All premises majority yes.  
    - Step 4: No DD.  
    - Step 5: No dilemma (premises and conclusion align).  
    - Step 6: **Unconditional clearance** (all premises yes, no DD).  
  - **Dissent**: None recorded beyond votes.

  #### Case 2: Premises Approved, Conclusion Fails, Biostatistician Dissents on R  
  - **Votes**:  
    - R: 4 yes, 3 no (B votes no → DD on R).  
    - C: 5 yes, 2 no (PA votes yes → no DD).  
    - V: 6 yes, 1 no (CR votes yes → no DD).  
    - Conclusion: 3 yes, 4 no (fails).  
  - **Procedure**:  
    - Step 2: All premises majority yes.  
    - Step 4: DD on R (B dissented).  
    - Step 5: Dilemma detected (premises yes, conclusion no). Discussion → re-vote unchanged. Default to premises.  
    - Step 6: **Conditional Clearance (Tier 1)** (all premises yes, but DD on R).  
  - **Dissent**: DD recorded: "B dissented on R." Conclusion vote recorded as context.

  #### Case 3: Procedure Mandates Approval Despite Chair's Opposition  
  - **Context**: You (chair) oppose due to ethical concerns beyond R/C/V (e.g., community impact).  
  - **Votes**:  
    - R: 5 yes, 2 no (B votes yes → no DD; you vote yes).  
    - C: 4 yes, 3 no (PA votes yes → no DD; you vote yes).  
    - V: 4 yes, 3 no (CR votes yes → no DD; you vote yes).  
    - Conclusion: 4 yes, 3 no (you vote no).  
  - **Procedure**:  
    - Step 2: All premises majority yes.  
    - Step 4: No DD.  
    - Step 5: Dilemma (premises yes, conclusion yes* → *majority yes, so no conflict). Proceed.  
    - Step 6: **Unconditional clearance** (all premises yes, no DD, conclusion majority yes).  
  - **Overruling Step**: Step 6. You voted yes on all premises, satisfying the protocol. Your conclusion dissent is personal, not premise-based.  
  - **Dissent**: Your written dissent recorded: "Voted no on conclusion due to unaddressed community impact."

  ---

  ### Limitations and Transparency Safeguards
  - **What the procedure cannot settle**:  
    - **Meta-disagreements** (e.g., "R/C/V are incomplete"): Flagged in Step 1/Step 7 and documented, but decision proceeds.  
    - **Axiological deadlocks** (e.g., "risk is immoral"): Treated as dissent; no procedural override.  
    - **Tie votes**: Chair breaks ties (not ideal but necessary for efficiency).  
  - **Why this works in 90 minutes**:  
    - Premise-based default minimizes complexity.  
    - Conclusion vote and dilemma resolution are quick checks.  
    - Dissent documentation is templated.  
  - **Critical rule**: Designated authority dissent (DD) **always** forces conditional clearance if premises pass, ensuring domain expertise is honored. No vote can suppress this.
