  - P: mu * 9900 + (1-mu) * (-100)
  - NP: 0

  Agent_T will choose P if mu * 9900 + (1-mu) * (-100) > 0, i.e., if mu > 100/10000 = 0.01.

  Now, what is the sequentially rational strategy for Agent_H? At H, Agent_H will choose P because 9900>0.

  So the consistent belief for Agent_T is that a_H = P (mu=1) because that's what Agent_H does in equilibrium. Therefore, Agent_T chooses P.

  So the equilibrium is (P for Agent_H, P for Agent_T) with belief mu=1.

  Still no conflict.

  The only way to get a conflict is if we force Agent_T to believe that Agent_H played NP, but then Agent_H would not play NP in equilibrium.

  So perhaps the CM as modeled doesn't produce a conflict in standard game theory.

  I recall that the original CM is usually presented with the agent not knowing the mugger's algorithm or something. Let's try a different approach.

  ### The essence of the conflict in CM

  In the updateful view, after learning that the coin is T, the agent no longer assigns probability 0.5 to H. They assign probability 0 to H. Therefore, they don't care about what happens in the H branch. So they see paying $100 in T as a sure loss of $100, because in their mind, the mugger's payment of $10,000 is conditional on a branch that has probability 0. So they. choose not to pay.

  In the updateless view, the agent continues to assign probability 0.5 to H and 0.5 to T, so they are willing to pay in T because it's part of a strategy that also gets them to pay in H, and overall it's beneficial.

  But in game theory, when the agent is at T, they know the state is T, so they assign probability 0 to H. It would be irrational to assign 0.5 to H.

  So to model this, we would have to assume that the agent, at T, for some reason, does not condition on being at T. That is, they have a different information structure.

  Or perhaps the agent is not able to use the information about the state to update their beliefs about the state because they are updateless.

  This is not standard in game theory.

  For the sake of the exercise, let's force the updateless agent to use the ex ante probabilities even at interim stages.

  So for the agent at T, they act as if they still assign 0.5 to H and 0.5 to T. Then, if they choose a strategy of paying in both states, their EU at T would be:
  - If they pay in both states:
     - In H: 9900
     - In T: if they pay, they get 9900 if a_H=P (which it is) or -100 if a_H=NP. But because they are updateless, they don't condition on a_H. They have to choose a strategy for both states at once.

  This is getting messy.

  ### Conclusion for CM in game theory

  In the standard game-theoretic formalization with sequential equilibrium, there is no conflict: the agent pays in both states and achieves the high payoff.

   Therefore, the conflict in the decision-theory literature may arise from either:
  - A different information structure (e.g., the agent at T does not know what they would have done in H and cannot condition on their strategy) and/or
  - A different updating rule (e.g., the agent at T is not allowed to use the information that the state is T).

  Since the latter is not rational in the standard sense, it is not represented in game theory.

