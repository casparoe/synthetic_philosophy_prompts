  ### Restatement of Updateless vs. Updateful Decision Theories in Game-Theoretic Terms  
  I'll formalize Counterfactual Mugging (CM) and XOR Blackmail as extensive-form games, then compare updateless (UL) and updateful (UF) decision theories using your vocabulary. The core distinction:  
  - **Updateful (Sequentially Rational)**: At each information set, the agent maximizes *interim* expected utility using Bayesian-updated beliefs.  
  - **Updateless**: The agent commits ex ante to a strategy (a complete contingency plan) that maximizes *ex ante* expected utility, then follows it mechanically without re-optimizing upon reaching information sets.  

  Key elements:  
  - **Game tree**: Nodes, information sets, actions, payoffs.  
  - **Strategies**: Maps from information sets to actions.  
  - **Sequential rationality**: Optimality at every information set given beliefs and future play.  
  - **Beliefs**: Probability distributions over nodes in an information set, updated via Bayes' rule where possible.  
  - **Ex ante EU**: Expected utility from the root.  
  - **Interim EU**: Expected utility conditional on reaching an information set.  

  ---

  ### **1. Counterfactual Mugging (CM)**  
  **Scenario**:  
  - Nature flips a fair coin: Heads (H) or Tails (T).  
  - If H, the agent pays the mugger $100 to receive $10,000.  
  - If T, the mugger asks, "Would you have paid in H?" If the agent answers truthfully "yes," they receive $10,000.  

  #### **Game Tree**  
  - **Players**: Agent (A), Nature (N).  
  - **Information structure**:  
    - N moves first: H (prob. 0.5) or T (prob. 0.5).  
    - A observes the outcome (no imperfect information).  
  - **Actions and payoffs**:  
    - After H: A chooses **Pay (P)** or **Not Pay (NP)**.  
      - P: A gets $9,900 (net gain).  
      - NP: A gets $0.  
    - After T: A chooses **Say Pay (SP)** or **Say Not Pay (SNP)**.  
      - SP: A gets $10,000 *iff* their strategy specifies P at H.  
      - SNP: A gets $0.  
  - **Information sets**:  
    - \(I_H\): Node after H.  
    - \(I_T\): Node after T.  
  - **Payoff dependence**: Payoff at \(I_T\) depends on A's *strategy* at \(I_H\) (even though \(I_H\) is unrealized).  

  #### **Strategies**  
  - A strategy for A: \((a_H, a_T)\) where \(a_H \in \{P, NP\}\), \(a_T \in \{SP, SNP\}\).  
  - **Ex ante EU**:  
    \[
    EU(a_H, a_T) = 0.5 \cdot u_H(a_H) + 0.5 \cdot u_T(a_T, a_H)
    \]
    - \(u_H(P) = 9900\), \(u_H(NP) = 0\).  
    - \(u_T(SP, P) = 10,000\), \(u_T(SP, NP) = 0\), \(u_T(SNP, \cdot) = 0\).  

  #### **Updateful (Sequentially Rational) Strategy**  
  - At \(I_H\): Maximize interim EU.  
    - \(E[u \mid I_H] = 9900\) if P, 0 if NP → Chooses **P**.  
  - At \(I_T\): Maximize interim EU given belief about own strategy at \(I_H\).  
    - Believes \(a_H = P\) (since it's sequentially rational at \(I_H\)) → Chooses **SP** (yields 10,000 > 0).  
  - Outcome: **(P, SP)**, ex ante EU = 9,950.  

  #### **Updateless Strategy**  
  - Choose \((a_H, a_T)\) to maximize ex ante EU:  
    - (P, SP): \(0.5 \cdot 9900 + 0.5 \cdot 10,000 = 9,950\)  
    - (P, SNP): \(0.5 \cdot 9900 + 0.5 \cdot 0 = 4,950\)  
    - (NP, SP): \(0.5 \cdot 0 + 0.5 \cdot 0 = 0\) (since \(u_T(SP, NP) = 0\))  
    - (NP, SNP): 0  
  - Optimal: **(P, SP)**, ex ante EU = 9,950.  
  - *No conflict in CM*: Both UL and UF converge.  

  ---

  ### **2. XOR Blackmail (XB)**  
  **Scenario**:  
  - Nature flips coins \(C_1\) (H/T) and \(C_2\) (0/1), independent, each prob. 0.5.  
  - Blackmailer sends letter iff \(C_1 = C_2\) (prob. 0.5).  
  - Upon receiving a letter:  
    - If A pays $1,000, nothing happens.  
    - If A doesn’t pay, secrets are published iff \(C_1 = H\), costing $10,000.  
  - **Crucial twist**: A *does not observe* \(C_1\) or \(C_2\) when deciding to pay.  

  #### **Game Tree**  
  - **Players**: A, N.  
  - **Information structure**:  
    - N moves first: Chooses \((C_1, C_2) \in \{H,T\} \times \{0,1\}\) (each combo prob. 0.25).  
    - A observes only whether a letter arrives.  
  - **Actions and payoffs**:  
    - No letter: A does nothing, payoff = 0.  
    - Letter: A chooses **Pay (P)** or **Not Pay (NP)**.  
      - P: A loses $1,000 (payoff = -1000).  
      - NP: Payoff = \(-10,000\) if \(C_1 = H\), else $0$.  
  - **Information sets**:  
    - \(I_\emptyset\): No letter (nodes where \(C_1 \neq C_2\)).  
    - \(I_{\text{letter}}\): Letter received (nodes where \(C_1 = C_2\)).  
      - A cannot distinguish \((H,0)\), \((T,1)\), \((H,1)\), \((T,0)\)? No: letter only if \(C_1 = C_2\), so \(I_{\text{letter}}\) contains nodes \((H,H)\) and \((T,T)\) (but coins are H/T and 0/1, so let’s redefine states: \((C_1, C_2)\) yields letter if \(C_1 = C_2\)).  
      - \(I_{\text{letter}}\) includes two nodes: \((H,H)\) and \((T,T)\) (prob. 0.25 each given letter).  

  #### **Beliefs at \(I_{\text{letter}}\)**  
  - By Bayes’ rule:  
    \[
    \mu(H,H \mid \text{letter}) = \mu(T,T \mid \text{letter}) = 0.5
    \]
  - Interim EU if NP:  
    \[
    E[u \mid I_{\text{letter}}] = 0.5 \cdot (-10,000) + 0.5 \cdot 0 = -5,000
    \]  
    (since loss only if \(C_1 = H\)).  

  #### **Updateful (Sequentially Rational) Strategy**  
  - At \(I_{\text{letter}}\):  
    - P: EU = -1,000  
    - NP: EU = -5,000 → Chooses **P**.  
  - Outcome: Pays upon receiving letter. Ex ante EU = \(0.5 \cdot 0 + 0.5 \cdot (-1000) = -500\).  

  #### **Updateless Strategy**  
  - Commit ex ante to a strategy for all information sets.  
  - **Option 1: Always pay if letter**  
    - EU = \(P(\text{no letter}) \cdot 0 + P(\text{letter}) \cdot (-1000) = -500\).  
  - **Option 2: Never pay if letter**  
    - EU = \(P(\text{no letter}) \cdot 0 + P(\text{letter}) \cdot [0.5 \cdot (-10,000) + 0.5 \cdot 0] = -2,500\).  
  - **Option 3: Mixed strategies** (e.g., pay with prob. \(p\)) yield lower EU than -500.  
  - Optimal: **Pay if letter**, ex ante EU = -500.  
  - *No conflict in XB*: Both UL and UF converge.  

  ---

  ### **Residue Report: What Carries Over, What Doesn’t**  
  #### **1. Elements That Carry Over Cleanly**  
  - **Updateless ≈ Ex Ante Commitment**:  
    - UL is identical to choosing a strategy at the root that maximizes ex ante EU, then following it rigidly.  
    - *Example*: In both CM and XB, UL agents precommit to \((P, SP)\) or "always pay," respectively.  
  - **Updateful ≈ Sequential Rationality**:  
    - UF matches standard interim best-response reasoning at each information set.  
    - *Example*: In XB, UF pays at \(I_{\text{letter}}\) because \(-1,000 > -5,000\).  
  - **No Off-Path Belief Distortions Needed**:  
    - In CM and XB, off-path beliefs (e.g., at \(I_T\) or \(I_{\text{letter}}\)) are uniquely pinned by Bayes’ rule. No correlation in beliefs beyond standard refinements.  

  #### **2. Elements Requiring Distortion**  
  - **UL as "Ignoring Information"**:  
    - Rationalists often describe UL as "not updating on the current information set." This *contradicts* sequential rationality.  
    - *Distortion*: In standard game theory, "not updating" is irrational unless information is payoff-irrelevant. In XB, \(I_{\text{letter}}\) is payoff-relevant, so UF and UL coincidentally agree. To force a conflict, rationalists implicitly assume agents cannot condition on their strategy (see below).  
  - **Strategy Dependence of Payoffs**:  
    - In CM, payoffs at \(I_T\) depend on actions at \(I_H\) (an off-path information set). This is representable via correlation in off-path beliefs, but requires care.  

  #### **3. Elements With No Counterpart**  
  - **Agents as Multi-Self Games**:  
    - Rationalists often model UL/UF by treating the agent at each information set as a distinct player (e.g., "A at \(I_H\)" vs. "A at \(I_T\)").  
    - *No counterpart*: In game theory, a single agent has one strategy across all information sets. The multi-self approach is an *ad hoc* departure.  
  - **Ambiguity in Beliefs About Own Strategy**:  
    - In CM, UF agents at \(I_T\) are assumed to "know their strategy at \(I_H\)." Game theorists avoid this by specifying off-path beliefs via consistency conditions (e.g., sequential equilibrium).  
  - **Counterfactual Validity**:  
    - Rationalists debate whether agents should "care" about unrealized paths (e.g., "Why pay in T when H didn’t happen?"). Game theory resolves this ex ante: all paths contribute to EU.  

  #### **4. Is UL Just Precommitment?**  
  - **Yes, but with a caveat**:  
    - UL is ex ante commitment to a strategy. However, rationalists motivate UL by arguing that UF agents leave themselves exploitable (e.g., in *true* CM variants where the mugger only pays if A *would have paid* in H, but A at T cannot condition on this).  
    - *Game-theoretic resolution*: If payoffs depend on counterfactual actions (like CM), specify off-path behavior via beliefs. Standard refinements (e.g., consistent beliefs) suffice; no need for UL.  

  #### **5. Does XB Introduce Unrepresentable Correlation?**  
  - **No**:  
    - XB’s correlation (\(C_1 = C_2\)) is captured by joint distributions over states. Beliefs at \(I_{\text{letter}}\) are uniquely Bayesian.  
    - If rationalists insist UL avoids "falling for blackmail," this implies irrationality: in XB, *not* paying yields lower interim EU.  

  #### **6. Missing Phenomena or Conceptual Slides?**  
  - **The Real Issue: Commitment vs. Re-Optimization**:  
    - Rationalists conflate two distinct concepts:  
      1. **Ex ante commitment**: Choosing a strategy upfront (UL).  
      2. **Interim best response**: Re-optimizing at each information set (UF).  
    - Game theory cleanly separates these. The "dispute" arises when rationalists:  
      - Assume agents cannot precommit (forcing UF).  
      - Invent scenarios where UF agents are exploited (e.g., if the mugger in CM only exists off-path).  
  - **No New Phenomena**:  
    - UL/UF add no tools beyond ex ante optimization and sequential equilibrium. Where they appear to, it stems from poorly specified off-path beliefs or ad hoc agent models.  

  ### **Recommendation**  
  - **Write off UL/UF as informal concepts**. They:  
    1. Reduce to standard game-theoretic commitment or sequential rationality.  
    2. Introduce no novel refinements or equilibrium concepts.  
    3. Rely on contrived beliefs (e.g., agents "ignoring" information) or multi-self constructions absent in microeconomic theory.  
  - **Instead**: Use your existing toolkit. For payoff dependence on off-path actions (like CM):  
    - Specify off-path beliefs via consistency requirements.  
    - Model commitment devices explicitly when relevant.  
  - **Exception**: If you study algorithmic agents with bounded recall or no correlation capabilities, UL/UF might offer heuristic insights—but even then, game theory can absorb them.  

  **Bottom line**: UL/UF are restatements of precommitment vs. sequential rationality, obscured by decision-theoretic folklore.
