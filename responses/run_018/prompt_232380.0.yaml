  - **Strategies**: A strategy for a player specifies an action at every information set where that player moves.
  - **Sequential rationality**: A strategy is sequentially rational if at every information set, the action prescribed is optimal given the beliefs at that information set and the future strategies.
  - **Interim and ex ante expected utility**: Ex ante is before any information is revealed (at the root); interim is after some private information is known (at an information set).
