answer: |-
  The salt wind off the grey sea bit at Aris’s cheeks as she walked the creaking boards of the West Pier. Below, the nets were drying, a fragile lattice against the vast, indifferent water. It was this indifference that haunted The Piers, the hard-won settlement clinging to the drowned coast. Survival demanded cohesion, which was why formal political parties had been outlawed in the Founders’ Charter. Governance was by sortition – the random drawing of names – for one-year Assembly terms, non-renewable. Deliberation, not partisanship; reason, not passion. Aris, a weaver drafted against her quiet nature, had believed in those safeguards. Until now.

  The Assembly Hall, a repurposed net-mending shed, hummed with low tension. Rain lashed the thick glass windows. On the table lay the issue: the sole vial of broad-spectrum antibiotic salvaged from the last mainland trade. Two claimants: young Tomas, a fisher recovering from a deep gash that threatened sepsis; and Elder Mara, whose persistent cough had worsened alarmingly. The Medica had presented the facts: Tomas had a high chance of full recovery with the drug; Mara’s prognosis was poor regardless, but the antibiotic might ease her suffering.

  Aris had listened, weighed. Tomas was vital, strong. But Mara… Mara had been the settlement’s first teacher, her stories the fragile thread connecting them to the world Before. Her illness wasn't her fault. To deny her even comfort felt cruel. Aris believed the vial should go to Mara. It was a hard judgment, but hers.

  Then the currents beneath the surface began to pull. Silas, a boatwright whose son worked alongside Tomas on the same skiff, spoke first. "Strength feeds strength. Tomas mends, he fishes. We all eat." Nods rippled through a particular group – the boat-builders, net-menders, most younger fishers. They sat together, shared tools, shared meals, shared a worldview forged on the open water. Aris had noticed their unspoken coordination before: proposals subtly supported, minor dissenters gently sidelined. They called themselves nothing, but their loyalty was palpable.

  Kael, a quiet man who repaired the desalination units, murmured, "Mara gave us memory. Is that worth less than fish?" A few others, mostly elders and crafters like Aris, murmured agreement. But their voices were scattered, hesitant.

  Then Brenna, Silas’s sister and a respected net-weaver, stood. Her voice was soft but carried. "We all honour Mara. But sentiment can't guide survival. Allocating scarce resources based on... emotional attachments?" She paused, letting the implication hang. "That’s the indulgence that drowned the old world. We chose reason. We chose *our* way." She didn’t look at Aris, but the weight of her gaze settled on the crafters’ section. *Our way.* The phrase, repeated often by this network, wasn’t policy; it was identity, a demand for cohesion.

  Aris felt the shift. Arguments for Tomas became sharper, edged with an unspoken accusation: prioritizing Mara wasn't just unwise, it was disloyal to the settlement’s pragmatic ethos, to *them*. Dissent wasn't merely disagreement; it felt like betrayal. When Jorin, a quiet gardener, suggested a lottery, Brenna’s glance silenced him. "Random chance? When we have clear reasoning?" Jorin shrunk back.

  Aris watched faces harden. Members she knew privately harboured doubts about Tomas’s absolute priority now echoed Brenna’s points with rehearsed conviction. The deliberation wasn’t about the medicine anymore; it was about affirming belonging, proving loyalty to the unspoken collective. Reasoning had been replaced by a collective passion for unity, for the dominance of their shared perspective. Simone Weil’s words, discussed dryly with her colleague back when academic debates felt relevant, echoed like a cold clang in her mind: *"A party is a machine for generating collective passion... suppressing individual moral judgment."* The machine had no name, no banner, but it was here, whirring efficiently in the absence of formal parties.

  The moment of recognition was physical. A wave of cold washed over Aris as she saw Elara, a fellow weaver and usually thoughtful, avoid her eyes and raise her hand for Tomas. It wasn’t belief in Elara’s eyes; it was fear. Fear of fracture, fear of being cast out of the warm circle of belonging that Brenna and Silas represented. The safeguards – sortition, term limits, no labels – hadn’t prevented the pathology; they had merely forced it underground, where loyalty networks flourished unseen, demanding conformity just as fiercely.

  The vote tiles, smooth sea-glass, lay before them. Green for Tomas, grey for Mara. The hum in the shed had solidified into a tribal drone.

  Aris picked up her tile. The cool surface felt alien. She thought of Mara’s rasping breath, of Tomas’s fevered eyes. She thought of the subtle pressure, the shared glances, the way dissent had become synonymous with disloyalty. The machine demanded green. To choose grey was to break ranks, to invite isolation in a community where isolation meant vulnerability.

  Her knuckles whitened around the grey tile. She saw Brenna watching, not with hostility, but with the calm certainty of the collective will. Aris looked down at her hand, trembling slightly. The grey sea-glass caught the dim light, a small, cold defiance. She held it poised over the voting bowl, the weight of her judgment, her isolation, and the insidious power of the nameless faction pressing down. Would it be green, swallowed by the collective hum? Or grey, a solitary splash in the silence?

  Her hand hovered. Rain drummed relentlessly on the roof. The vote remained uncounted.
