prompt: |-
  I'm drafting a scene for my novel where a older ethicist—she's not some tech-bro, more like a retired professor who thinks strong longtermism gets everything backwards—gets interveiwed on a small podcast about future people. She has this weird but specific view that our moral concepts are built for face-to-face reciprocity and just break when we try to apply them across ten thousand years, so she definately rejects the usual "astronomical stakes" framing and instead talks about "conceptual architecture." I need about eight questions that don't let her just recite Bostrom-style numbers. At least one should press her on whether longtermism secretly collapses into presentism if we can't individuate future people, one on the replaceability objection—that saving a future life just replaces it with another, so there's no net moral gain—and one on whether reducing existential risk is actually just risk-shifting onto present poor people who need those resources now. For each, include a follow-up that anticipates her standard dodge—she loves saying "moral distance isn't spatial distance, it's conceptual architecture"—and pushes back hard on that phrase specifically.

  Please start with the actual questions right away, no preamble or "here they are" intro. And don't ask for citations, a bibliography, or page numbers—if you mention anyone by name just paraphrase, since I'm writing this for a scene and not for a seminar paper.
