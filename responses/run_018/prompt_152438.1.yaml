prompt: |-
  Before I evaluate competing philosophical analyses of causation by omission, I want a rigorous specification of adequacy conditions. Write the desiderata that any theory of negative causation must satisfy to be viable: the explanatory targets it must hit, the hard cases it must classify correctly, the conceptual distinctions it must preserve, and the puzzles or paradoxes it must dissolve—each paired with the specific consideration or scenario that motivates it. Be sure to cover: (i) the clinical omission, in which a physician's failure to administer an available antidote is treated as causally responsible for death; (ii) the joint-protocol double omission, in which two gatekeepers each fail to perform complementary checks required by a shared rule, so that neither individual failure is sufficient for harm but the collective absence produces it; and (iii) the structural gap case, in which harm follows from an institutional absence of obligation—no particular agent was required to act—yet a normative baseline makes it plausible to speak of an omission rather than mere non-occurrence. For each desideratum, indicate whether you take it to be non-negotiable for any theory meant to ground moral or legal responsibility, and flag any tension between demands—especially between treating omissions as genuine causal relata and anchoring them in identifiable agent-level obligations. Conclude with a brief comparative assessment: how a counterfactual-dependence account, a normative-default theory, and an interventionist framework each perform against the list, noting where each succeeds and where it is forced to abandon a desideratum. Do not provide bibliographies, reading lists, or citations; work from the conceptual structure alone.
reasoning: |-
  We are constructing a set of adequacy conditions (desiderata) for a theory of causation by omission. We are to consider three specific cases: (i) clinical omission, (ii) joint-protocol double omission, and (iii) structural gap case. We must also indicate whether each desideratum is non-negotiable for grounding moral/legal responsibility and note any tensions. Then, we briefly compare three theories: counterfactual-dependence, normative-default, and interventionist.

  ## Desiderata for a Theory of Causation by Omission

  1. **Desideratum: Non-arbitrariness of Omission Specification**
     - **Motivation**: We must avoid the "problem of profligate omissions" (e.g., the death was caused by the physician's failure, but also by the gardener's failure to water a plant that would have grown into an antidote, etc.). The theory must explain why we pick out a particular omission (physician's) and not others.
     - **Scenario**: Clinical omission case. The physician fails to give the antidote, which was available and expected. We hold the physician responsible, not the gardener.
     - **Non-negotiable for responsibility?**: Yes. Without this, we cannot assign specific responsibility.
     - **Tension**: With the idea that omissions are absences, which are abundant. We need a principled way to pick the relevant absence.

  2. **Desideratum: Sufficiency of Agent-Level Obligation**
     - **Motivation**: To ground moral/legal responsibility, we typically require that the agent had a duty to act. The theory must link the omission to a breach of obligation.
     - **Scenario**: Clinical omission. The physician had a duty to administer the antidote.
     - **Non-negotiable?**: Yes, for moral/legal responsibility. Without an obligation, we might not blame the agent.
     - **Tension**: With the structural gap case, where there might be no specific agent-level obligation.

  3. **Desideratum: Causal Efficacy of Collective Omission without Individual Sufficiency**
     - **Motivation**: In cases of joint omission, no single omission is sufficient for the harm, but together they cause it. The theory must account for overdetermination by multiple omissions.
     - **Scenario**: Joint-protocol double omission. Two gatekeepers each fail to perform their complementary checks. Each failure alone would not have caused the harm (because the other check would have caught it), but together they did.
     - **Non-negotiable?**: Yes. Without this, we cannot assign responsibility in collaborative settings.
     - **Tension**: With the idea that each omission is only a cause if it is necessary for the effect (which neither is individually).

  4. **Desideratum: Handling Structural Gaps without Specific Obligations**
     - **Motivation**: Sometimes, harm results from the absence of an institutional structure or from a gap in the assignment of duties. We want to say that the absence caused the harm even though no particular agent was obligated to act.
     - **Scenario**: Structural gap. For example, a building collapses because there was no regulatory agency to inspect it. No specific agent was required to set up such an agency, but the absence caused the harm.
     - **Non-negotiable?**: Not strictly for agent-level responsibility, but for societal responsibility and policy. However, if the theory is to be comprehensive, it should account for this.
     - **Tension**: With the agent-level obligation requirement (Desideratum 2). This desideratum pushes against tying omissions solely to individual duties.

  5. **Desideratum: Preservation of the Distinction between Omission and Mere Non-Occurrence**
     - **Motivation**: Not every non-occurrence is an omission. Omissions are tied to expectations, norms, or possibilities. The theory must distinguish the physician's failure (omission) from the non-occurrence of a spontaneous antidote generation (mere non-occurrence).
     - **Scenario**: Clinical omission. We don't say that the patient died because the antidote did not spontaneously generate in the room.
     - **Non-negotiable?**: Yes. Without this, we lose the normative force of omissions.
     - **Tension**: With naturalistic accounts that try to reduce omissions to pure absences.

  6. **Desideratum: Avoiding Collapse into Positive Causation**
     - **Motivation**: We want to maintain that omissions are a distinct kind of causal factor, not reducible to positive actions. For example, the physician's omission is not the same as a positive action of injecting poison.
     - **Scenario**: Clinical omission. We don't want to say that the physician caused death in the same way as if they had actively killed.
     - **Non-negotiable?**: Not absolutely, but it is a key conceptual distinction. Some theories might reduce omissions to positive causes, but we want to preserve the distinction for moral/legal purposes (e.g., intent, mitigation).
     - **Tension**: With theories that try to unify causation under one model.

  7. **Desideratum: Resolution of Preemption and Overdetermination Puzzles**
     - **Motivation**: In cases where there are multiple potential preventers, we must determine which omission(s) count as the cause. For example, if both a physician and a nurse are supposed to administer the antidote and both fail, we might want to say both caused the death (symmetrically) or that one preempted the other? 
     - **Scenario**: Extend clinical omission to two agents both responsible. Alternatively, consider a case where one omission preempts another (e.g., if the physician's failure was such that even if the nurse had acted, it would have been too late because of the physician's delay).
     - **Non-negotiable?**: Yes, because preemption and overdetermination are common in omission cases and affect responsibility assignments.

  ## Comparative Assessment of Theories

  1. **Counterfactual-Dependence Account** (e.g., Lewis)
     - *Core Idea*: An omission (e.g., the physician not giving the antidote) causes death if, had the physician given the antidote, the death would not have occurred (i.e., the death depends counterfactually on the omission).
     - **Clinical omission**: Handles well. The death would not have occurred if the physician had given the antidote.
     - **Joint-protocol double omission**: Problem. For each gatekeeper, the harm would have occurred even if that gatekeeper had acted (because the other also failed). So, individually, neither omission is a cause. This fails our desideratum 3.
     - **Structural gap**: Struggles. The counterfactual "if there had been a regulatory agency, the building wouldn't have collapsed" might be true, but who is the agent? It doesn't assign responsibility to any agent. Also, it may be arbitrary which structural absence we pick (cf. desideratum 1). Moreover, without a specific agent, the counterfactual might not be anchored in an action we can expect from anyone.
     - **Non-arbitrariness**: Fails to provide a non-arbitrary way to pick which omission matters (because many absences would have prevented the death).
     - **Obligation link**: Not built-in; counterfactuals can run without obligations. So it might pick out absences that are not obligations (e.g., the gardener). Hence, fails desideratum 2 for responsibility.
     - **Verdict**: Good for simple cases but fails on joint omissions and structural gaps. Does not handle non-arbitrariness or obligation well.

  2. **Normative-Default Theory** (e.g., incorporating norms or obligations)
     - *Core Idea*: Omissions are causes only relative to a normative baseline. An omission is the failure to perform an action that was normatively expected.
     - **Clinical omission**: Handles well. The physician had a duty to act, so the omission is a cause.
     - **Joint-protocol double omission**: Can handle by saying both gatekeepers had duties, and the collective failure caused the harm. But we need to account for the fact that each individual omission is not sufficient. The theory might say that each omission is a cause because it was a necessary part of the set of conditions that caused the harm (if we think of causation as a complex of conditions). Alternatively, it might say that the effect was overdetermined by the two omissions? But that might not be the case because each alone was insufficient. This is a challenge.
     - **Structural gap**: Handles by appealing to institutional norms. The absence of a regulatory agency is a violation of a normative expectation (even if no specific agent is to blame). So the omission (by the system) caused the harm. However, this does not assign responsibility to an agent. If we want agent-level responsibility, we have a gap (tension with desideratum 2).
     - **Non-arbitrariness**: Handles well by tying omissions to normative expectations. We don't blame the gardener because there was no norm requiring the gardener to act.
     - **Obligation link**: Explicitly built-in (non-negotiable for responsibility). But in structural gaps, we might have a societal obligation without an agent, so it might not ground individual responsibility.
     - **Verdict**: Good for clinical and non-arbitrariness, and preserves the omission/non-occurrence distinction. Struggles with joint omissions (if we require individual sufficiency) and structural gaps (for agent responsibility). Tension between agent-level obligations and structural obligations.

  3. **Interventionist Account** (e.g., Woodward)
     - *Core Idea*: Causation is defined in terms of what would happen under interventions. We can intervene on the absence (make it present) and see if the outcome changes.
     - **Clinical omission**: Handles well. If we intervene to make the physician administer the antidote (set the variable to 'present'), then the patient survives.
     - **Joint-protocol double omission**: We can intervene on each gatekeeper individually. If we set gatekeeper1 to do the check (while gatekeeper2 still fails), the harm still occurs (because gatekeeper2's failure is enough? no, in the scenario, both checks are required). Actually, in the scenario, each check is necessary and together they are sufficient. So if we intervene on one gatekeeper to make them check, then the harm would be prevented only if the other gatekeeper also checks? This is tricky. 

       Let's clarify: 
          - Actual world: both fail -> harm.
          - Intervention on gatekeeper1: gatekeeper1 checks, gatekeeper2 still fails -> harm? 
            But by the protocol, if one check is done and it fails, then the harm is prevented? Or if one check is done and it passes, then the process goes through? We must know the mechanism. 

       Suppose the protocol: both checks must pass to prevent harm. If either fails, harm occurs. Then:
          - If we fix gatekeeper1 to check and pass, but gatekeeper2 fails, then harm occurs. Similarly for fixing gatekeeper2. So individually, changing one gatekeeper does not change the outcome. Only changing both does. Thus, the effect does not depend on either one individually. So we might say the cause is the conjunction? But interventionism typically looks at individual variables. We can model the joint omission as a single variable? Or use the idea of "contributing cause" in a larger model? This is a challenge.

     - **Structural gap**: We can define a variable for the presence of the regulatory agency. If we intervene to set it to present, then the building is inspected and reinforced, so no collapse. So the absence caused the collapse. But again, without an agent, we cannot assign responsibility.
     - **Non-arbitrariness**: We must choose which variables to include in the model. This choice is guided by our interests and norms. So it can be made non-arbitrary by building in the normative expectations as the variables we care about.
     - **Obligation link**: Not built-in. We can include variables that correspond to obligations, but the account itself doesn't require it. So we might still pick non-obligatory absences (if we model them) unless we restrict the variables to those that are normatively required.
     - **Verdict**: Flexible and handles clinical and structural gap cases well (by modeling the right variables). Can handle joint omissions by modeling the joint condition (if we allow it) but at the cost of not assigning individual responsibility. It doesn't inherently solve the obligation problem without supplementing with norms.

  ## Overall Tensions
  - The main tension is between treating omissions as genuine causes (which might require them to have the same status as positive causes in a causal model) and grounding them in agent-level obligations (which might require a normative layer). 
  - Also, the joint omission case challenges the sufficiency of individual omissions and the necessity condition (if we require causes to be necessary for their effects, then neither omission is necessary because the other could have been present and prevented the harm? Actually, in the scenario, the harm occurs only if both fail. So each omission is necessary for the harm in the actual circumstances (because if one had acted, the harm would have been prevented). But note: if we hold the other fixed, then yes, each is necessary. However, in the counterfactual account, the problem was that if we don't hold the other fixed, then the harm would have occurred anyway even if one had acted? That's because we are not holding the other fixed. The interventionist account explicitly holds other variables fixed? 

    Actually, in interventionism, when we intervene on one variable, we set it to a value independently of the others. So we break any influence on that variable. Then we see what happens. In the joint omission case, if we intervene on gatekeeper1 to make him check, then regardless of why he failed (so even if gatekeeper2 still fails), we set gatekeeper1 to check. Then, if the mechanism is that both checks are required to prevent harm, then if gatekeeper1 checks and passes, but gatekeeper2 fails, then harm occurs. So the outcome does not change. Hence, gatekeeper1's omission is not a cause. Similarly for gatekeeper2. But if we intervene on both, then the outcome changes. So the cause is the conjunction. 

    This might be acceptable if we are willing to assign responsibility to the pair. But in practice, we want to hold each gatekeeper responsible for their own omission. This is a challenge for interventionism (and counterfactual accounts) without a normative layer that assigns duties.

  ## Conclusion
  - **Counterfactual-dependence**: Simple but fails on joint omissions and non-arbitrariness. Not tied to obligations.
  - **Normative-default**: Handles obligations and non-arbitrariness well, but struggles with joint omissions (if we require individual causal contribution) and structural gaps (if we require agent-level obligations).
  - **Interventionist**: Flexible and can handle complex cases by model construction, but requires careful setting of variables and doesn't inherently solve the obligation problem. It can be supplemented with norms to pick the right variables.

  Ultimately, no theory perfectly satisfies all desiderata. The normative-default theory is best for grounding moral/legal responsibility because it directly incorporates obligations, but it may need to be extended to handle collective and structural cases without specific agents. The interventionist framework offers a more general causal machinery that can be adapted to normative contexts but might require additional normative input to avoid arbitrariness and to assign responsibility.
answer: |-
  ### Rigorous Desiderata for a Theory of Causation by Omission  
  A viable theory must satisfy the following adequacy conditions, derived from conceptual challenges and paradigmatic cases. Each desideratum is paired with its motivating scenario and assessed for non-negotiability in grounding moral/legal responsibility. Key tensions arise between treating omissions as genuine causes and tethering them to agent-level obligations.  

  ---

  #### **Desideratum 1: Non-Arbitrary Omission Selection**  
  - **Motivation**: Avoids the "problem of profligate omissions" (e.g., infinite absences could "cause" an outcome).  
  - **Scenario**: *Clinical omission* (physician fails to administer antidote). The physician’s omission is causally salient, while irrelevant absences (e.g., a passerby’s failure to act) are excluded.  
  - **Non-negotiable for responsibility?**: **Yes**. Moral/legal responsibility requires pinpointing *specific* blameworthy agents, not arbitrary non-events.  
  - **Tension**: Demands a principled way to distinguish "omissions" (normatively significant absences) from "mere non-occurrences" (irrelevant absences).  

  #### **Desideratum 2: Agent-Level Obligation Grounding**  
  - **Motivation**: Omissions must be anchored in identifiable duties to prevent responsibility from becoming vacuously expansive.  
  - **Scenario**: *Clinical omission*. The physician’s professional duty makes their omission causally relevant; a random bystander’s inaction is not equivalent.  
  - **Non-negotiable for responsibility?**: **Yes**. Moral/legal blame presumes a breached obligation.  
  - **Tension**: Clashes with *structural gap cases* (Desideratum 4), where no specific agent has a duty.  

  #### **Desideratum 3: Joint Omission Efficacy**  
  - **Motivation**: Captures causal overdetermination by multiple failures where no single omission is sufficient.  
  - **Scenario**: *Joint-protocol double omission* (two gatekeepers each fail complementary checks; their combined failure causes harm). The theory must recognize both omissions as causes despite individual insufficiency.  
  - **Non-negotiable for responsibility?**: **Yes**. Accountability in collaborative systems (e.g., healthcare, security) requires apportioning partial responsibility.  
  - **Tension**: Conflicts with counterfactual necessity (if no single omission is necessary, is it causal?).  

  #### **Desideratum 4: Structural Absence without Agent Obligation**  
  - **Motivation**: Accommodates harms arising from institutional/structural voids where no individual is obligated to act.  
  - **Scenario**: *Structural gap* (e.g., a building collapses due to lack of regulatory oversight; no law assigns inspection duty). The absence itself is causal despite no agent-level breach.  
  - **Non-negotiable for responsibility?**: **No** for *agent*-responsibility, but **yes** for *systemic* responsibility (e.g., policy reform).  
  - **Tension**: Undercuts Desideratum 2; risks decoupling causation from obligations.  

  #### **Desideratum 5: Preservation of Omission/Non-Occurrence Distinction**  
  - **Motivation**: Maintains that omissions are normative failures, not metaphysically barren absences.  
  - **Scenario**: *Clinical omission* vs. a "mere non-occurrence" (e.g., rain failing to magically cure the patient). The latter lacks normative weight.  
  - **Non-negotiable for responsibility?**: **Yes**. Moral/legal responsibility hinges on norm-violating inaction.  

  #### **Desideratum 6: Prevention of Causal Redundancy**  
  - **Motivation**: Resolves preemption puzzles (e.g., if two agents could prevent harm, but one omission preempts the other).  
  - **Scenario**: *Clinical omission* variant: Nurse also fails to act, but physician’s omission preempts blame. The theory must assign primary causation.  
  - **Non-negotiable for responsibility?**: **Yes**. Legal liability requires non-redundant causes.  

  #### **Desideratum 7: Compatibility with Positive Causation**  
  - **Motivation**: Avoids conflating causal *relata*: omissions (absence of action) vs. positive acts (e.g., injecting poison).  
  - **Scenario**: *Clinical omission* must differ categorically from active killing, even if outcomes are identical.  
  - **Non-negotiable for responsibility?**: **Yes**. Moral/legal distinctions (e.g., intent, negligence) rely on this.  

  ---

  ### Comparative Assessment of Theories  
  **1. Counterfactual-Dependence (e.g., Lewis)**  
  - **Core**: Omission causes outcome iff outcome would not occur if the omitted action had been performed.  
  - **Successes**:  
    - Handles *clinical omission* cleanly (death counterfactually depends on physician’s inaction).  
    - Satisfies Desideratum 6 (preemption) via comparative closeness of possible worlds.  
  - **Failures**:  
    - Fails *joint omission*: No individual counterfactual dependence (if one gatekeeper acted, harm still occurs due to the other’s omission). Abandons Desideratum 3.  
    - Fails *structural gap*: No specific action to counterfactualize ("had the institution existed...?" is agentless). Abandons Desideratum 4.  
    - Violates Desideratum 1: Proliferates absences (e.g., "had the gardener watered antidote-plants..." is equally causal).  

  **2. Normative-Default Theory (e.g., McGrath)**  
  - **Core**: Omissions are causes only relative to a normatively expected baseline (e.g., duties, defaults).  
  - **Successes**:  
    - Satisfies Desiderata 1–2: Non-arbitrary selection via obligations (e.g., physician’s duty); excludes "mere non-occurrences" (Desideratum 5).  
    - Handles *clinical omission*: Physician’s duty triggers causal status.  
  - **Failures**:  
    - Fails *joint omission*: Norms may not specify how to apportion causality when no single omission is sufficient. Desideratum 3 unmet.  
    - Fails *structural gap*: No agent-level obligation exists, so no "omission" (rejects Desideratum 4). Overly restricts causation to obligations.  
    - Tension: Risks circularity (duty defines causation, but duties presuppose causal responsibility).  

  **3. Interventionist Framework (e.g., Woodward)**  
  - **Core**: Omission causes outcome iff intervening to "add" the omitted action changes the outcome, holding other variables fixed.  
  - **Successes**:  
    - Handles *clinical omission*: Intervening to administer antidote saves the patient.  
    - Satisfies Desideratum 3 (*joint omission*): Intervening on both gatekeepers’ actions prevents harm; each omission is a difference-maker in the causal model.  
    - Addresses Desideratum 1: Variables are selected pragmatically (e.g., physician’s role, not gardener’s).  
  - **Failures**:  
    - Fails *structural gap*: Intervention requires manipulating a variable (e.g., "create regulatory institution"), but no agent is attached. Desideratum 4 unmet.  
    - Weak on Desideratum 2: Interventions may ignore obligations (e.g., "intervene to make passerby act" is technically causal).  
    - Blurs Desideratum 7: Omissions and positive acts are modeled symmetrically, eroding normative distinctions.  

  ---

  ### Conclusion  
  - **Counterfactual-dependence** excels in simple cases (e.g., *clinical omission*) but collapses under overdetermination (*joint omission*) and structural absences.  
  - **Normative-default** theory best secures agent-level responsibility (Desiderata 1, 2, 5) but cannot handle cases without obligations (*structural gap*) or joint causality.  
  - **Interventionism** is most technically robust for complex causation (*joint omission*) but struggles to anchor omissions in obligations (Desiderata 2, 4) and may overgeneralize.  

  **Key Trade-off**: Theories prioritizing *causal generality* (interventionism) sacrifice normative grounding, while those prioritizing *obligations* (normative-default) sacrifice causal breadth. A hybrid approach may be necessary to satisfy all desiderata.
