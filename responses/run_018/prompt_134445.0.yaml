  The oscillating case (indigenous vs chattel systems) shows why dimensional isolation needs refinement. The user struggles because disease demographics complicate harm metrics, while racialization defines chattel slavery. I need to add a clause about "temporally diffuse harms" for cases where harms are intergenerational or epidemiological. Also, "structural specificity" could handle unique institutional aspects like hereditary racialization.

  For the new pair (Nanjing vs Bataan), dimensional isolation should work: Nanjing has concentrated sexual violence and killing intensity, Bataan features prolonged suffering through neglect. No single ranking needed.

  The tension in Case 4 requires distinguishing "event singularity" (narrative salience) from core moral dimensions like harm. The user's intuition conflates it; I should make this explicit in the principle. 

  The principle might not fully save their Hiroshima intuition if they insist on its moral weight beyond narrative. But dimensional isolation can accommodate it by treating "technological irrevocability" as a separate dimension, though this adds complexity. 

  For indigenous vs chattel slavery, applying temporal diffusion (disease) and structural specificity (racialization) allows comparison without ranking. Verdict: incommensurable on totality but comparable in dimensions like labor coercion brutality or dehumanization mechanisms.

