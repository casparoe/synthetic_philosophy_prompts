answer: |-
  Here is the definite pedagogical sequence:

  Begin by grounding the discussion in a shared experience of disruptive uncertainty: "Recall when your community faced chaos—a collapsed bridge isolating neighborhoods, rumors of contaminated water, or sudden mass displacement." This visceral "indeterminate situation" (clarified simply as *collective confusion blocking action*) establishes the problem needing resolution and precedes all other concepts. Next, distinguish **democracy experimentally conceived**: it's not merely counting votes (*majoritarian preference-aggregation*), but the community's ongoing, intelligent effort to *transform* that confusion into a manageable situation. This distinction is foundational and must precede introducing inquiry. Only then define **inquiry** as the *reconstructive method* used: testing ideas through collective action and observation to resolve the indeterminacy. Immediately stress that this process belongs to the community itself, **intercepting the credentialist assumption** by asking, "Who here *hasn't* participated in figuring out a crisis with neighbors? That *is* inquiry." Use the **carrier scenario: a community confronting ambiguous, potentially toxic dust settling after a mysterious factory explosion**. Authorities are absent or contradictory. Residents must collectively investigate sources, health risks, and solutions. It fails as pure science (no lab, no experts, urgent need for action amid uncertainty) and fails as bargaining (outcomes depend on shared discovery of facts/effects, not just competing interests). **Intercept relativism** here: "If they rushed to blame migrants without evidence, would that collective decision be 'experimentally valid'? No! Inquiry demands *testing* ideas against consequences." Omit Dewey's formal logical apparatus (e.g., the "pattern of inquiry," propositional distinctions from *Logic: The Theory of Inquiry*). Conclude by posing: **"Why would treating *yesterday's* solution to the dust (e.g., 'just wash it off') as permanently valid undermine experimentalist democracy tomorrow?"** A correct answer grasps the continuous, reconstructive core.

  **Liberties Note:** This foregrounds collective agency and downplays Dewey's institutional focus. The "dust" scenario simplifies his complex "public" formation. Some scholars argue Dewey's later logic *is* essential to avoid relativism, but it's omitted here for accessibility. The anti-credentialism emphasis aligns with Dewey's ethos but sharpens his critique of expertise for this dissident context.
