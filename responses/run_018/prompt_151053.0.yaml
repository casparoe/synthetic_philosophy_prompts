  Omit Dewey's logical distinctions (e.g., determinate vs indeterminate) - too technical. Closing question tests structural grasp: "Why would experimentalism fail if we treated yesterday's solution as permanent?" 

  Liberties note: condensed Dewey's "public" complexity, foregrounded collective agency over his institutional concerns. Political philosophers might debate this emphasis, but it serves the novel's context of dissent. 

