prompt: |-
  In decision-theory threads on rationalist forums, I keep seeing the Pasadena paradox handled through a particular physical analogy: the undefined expectation is likened to an analytical balance with a broken spring, so that each successive weight placed on the pan sends it swinging infinitely between opposing extremes without ever reaching an equilibrium position. From this image people draw a strong normative conclusion — that comparing expected values in the Pasadena case is not merely unknown but structurally incoherent, like trying to read a measurement from a device that lacks any stable state; therefore, they claim, rational agents should abandon expected-utility maximization altogether and revert to dominance or satisficing rules. I want an audit of this comparison. Lay out an explicit correspondence table: what in the paradox plays the role of the pan, the successive weights, the broken spring, the absence of equilibrium, and the act of "reading" a result. Then separate the disanalogies that genuinely damage the argument from those that are only cosmetic. In particular, does the analogy quietly import the assumption that rational choice requires a convergent point-value, or that an undefined expectation is a kind of physical malfunction rather than a perfectly well-defined but non-convergent mathematical object? Does the conclusion — that EV reasoning ought to be rejected in this case — survive once those smuggled premises are on the table? And if the balance analogy misleads more than it clarifies, what would be a more accurate analogy for what undefined expectation actually does to rational comparison?
reasoning: |-
  Okay, the user is asking about the Pasadena paradox and a specific physical analogy used in rationalist forums. Let me start by recalling what the Pasadena paradox is. It's a decision theory problem where the expected utility is an infinite series that doesn't converge to a finite value. Specifically, it's conditionally convergent, meaning rearranging the terms can change the sum, leading to an undefined expectation. 

  The analogy they mention compares this to an analytical balance with a broken spring. Each weight added causes the pan to swing infinitely without settling. The conclusion drawn from this analogy is that expected utility maximization is incoherent in such cases, and agents should use dominance or satisficing instead. The user wants a breakdown of this analogy and whether it's valid.

  First, I need to map each part of the analogy to the paradox. The pan represents the agent's expected utility calculation. The successive weights are the terms in the infinite series of utilities multiplied by their probabilities. The broken spring symbolizes the conditional convergence property, where terms can be rearranged. The absence of equilibrium is the undefined expectation. Reading the result is trying to assign a single expected utility value.

  Now, the user's main concerns are whether the analogy smuggles in assumptions. Specifically, does it assume that rational choice requires a convergent point-value? And does it frame undefined expectation as a malfunction rather than a mathematical property? If so, does the conclusion still hold when those premises are exposed?

  I should address the disanalogies. The balance analogy implies a physical process that's ongoing, but the Pasadena series is a static mathematical object. The balance's instability is temporal, while the paradox's issue is about summation order. Also, the analogy suggests a physical failure, which might bias the view that it's a breakdown rather than an inherent mathematical feature.

  The core issue is whether the analogy's implication that undefined EV means maximization is impossible. But in decision theory, other approaches like dominance reasoning can still apply without a finite expectation. The analogy might overstate by implying complete incoherence, whereas mathematically, it's well-defined as divergent. So the conclusion to abandon EV might be valid, but the analogy's reasoning could be flawed.

  The user might be looking for validation that the analogy is misleading and wants a better one. A more accurate analogy could be trying to assign a single longitude to the North Pole using different projections. This highlights the coordinate dependence without implying malfunction. Or using Riemann's series theorem as a direct mathematical explanation.

  Underlying needs: The user might be engaging in debates on rationalist forums and needs a solid critique of this analogy to counter arguments. They might want to understand if undefined EV truly invalidates expected utility or if there are subtler approaches. Ensuring they grasp the mathematical essence without physical misinterpretations is key.
answer: |-
  Here's a systematic audit of the analytical balance analogy for the Pasadena Paradox, followed by a critical evaluation and proposal for a superior analogy.

  **Explicit Correspondence Table:**

  | **Analytical Balance Component** | **Corresponds to in Pasadena Paradox**                                                                 | **Role/Function**                                                                                                |
  | :------------------------------- | :----------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------- |
  | **The Pan**                      | The agent's *attempted calculation or representation of the overall expected utility (EU)*.            | The "place" where the outcome of the evaluation process is supposed to manifest (a stable EU value).            |
  | **Successive Weights**           | The individual terms in the infinite series defining the expectation: \( u(n) \times p(n) \).          | Inputs contributing to the final outcome. Each term represents the utility-probability product for outcome `n`. |
  | **Broken Spring**                | The *property of conditional convergence* of the series \( \sum_{n=1}^{\infty} (-1)^{n+1} \frac{2^n}{n} \). | The mechanism causing instability. Makes the sum pathologically sensitive to the *order of summation*.         |
  | **Absence of Equilibrium**       | The *undefined expectation value*.                                                                     | The failure to reach a stable, unique result despite processing all inputs (terms).                             |
  | **Act of "Reading" a Result**    | Attempting to assign a single, well-defined Expected Utility to the gamble for decision purposes.      | The final step in the expected utility maximization process where a value is used for comparison.               |

  **Critical Disanalogies:**

  1.  **Temporal Process vs. Static Object (Major Disanalogy):**
      *   **Analogy:** Presents the evaluation as a temporal, sequential process: weights are *added one after another*, causing the pan to swing *over time*.
      *   **Paradox:** The infinite series is a *static mathematical object*. All terms exist simultaneously. The problem isn't *when* terms are added, but *how* the infinite sum is defined due to conditional convergence. The "swinging" represents different possible finite partial sums depending on grouping or rearrangement, not a physical process unfolding in time. This disanalogy risks conflating the mathematical property with a physical malfunction occurring sequentially.

  2.  **Physical Malfunction vs. Mathematical Property (Major Disanalogy - Smuggled Premise):**
      *   **Analogy:** Attributes the instability to a *broken component* (the spring). This implies a defect, a failure of the device to perform its intended function correctly.
      *   **Paradox:** The conditional convergence is an *intrinsic, well-defined mathematical property* of the series itself. There's no "breakage" in the formalism of probability or utility; the expectation simply fails to converge absolutely, meaning its value isn't invariant under rearrangement. **This smuggles the premise that an undefined EV is a malfunction of the *theory* (like a broken machine) rather than a natural consequence of the mathematical structure of the specific gamble.**

  3.  **Dependence on Order of Addition vs. Order of Summation (Cosmetic Disanalogy):**
      *   **Analogy:** The pan swings wildly depending on the *order* weights are added.
      *   **Paradox:** The sum changes depending on the *order of summation* or *grouping* of terms. While related, the mathematical concept of rearrangement (any permutation) is more abstract than simply adding in a different sequence. The core point (order-dependence) is preserved, making this disanalogy less damaging.

  4.  **Dynamic Instability vs. Logical Undefinedness (Cosmetic Disanalogy):**
      *   **Analogy:** Focuses on perpetual motion and the *inability to stop* the swinging to get a reading.
      *   **Paradox:** Focuses on the logical *impossibility of assigning any single number* as *the* sum. It's not that the calculation is perpetually ongoing; it's that completing the summation (in the mathematical sense) doesn't yield a unique result. The "perpetual motion" aspect is a vivid but potentially misleading dramatization.

  **Evaluation of the Argument & Smuggled Premises:**

  1.  **Smuggled Premise 1: Rational Choice Requires a Convergent Point-Value:** The analogy strongly implies this. The balance *must* settle to a point for a reading; the EU calculation *must* yield a finite number for comparison. **This premise is central to the normative conclusion.** If one rejects this premise (e.g., arguing rational agents can use other criteria like minimax, tail behavior, or specific summation methods when faced with non-convergence), the conclusion doesn't automatically follow. The analogy builds this requirement into its core mechanism.
  2.  **Smuggled Premise 2: Undefined Expectation as Physical Malfunction:** As argued above, the "broken spring" frames the issue as a failure of the *decision-theoretic apparatus* rather than a property *of the gamble itself*. This biases the interpretation towards abandoning the apparatus (EV maximization) for this gamble. If undefined EV is seen as a *feature* signaling that the gamble possesses a pathological structure incompatible with simple EV comparison, the conclusion might be different (e.g., "avoid such gambles" or "use a different evaluation metric for them" rather than "abandon EV for all decisions").
  3.  **Does the Conclusion Survive?** The core insight – that standard EV maximization *fails* for the Pasadena gamble because it yields no unique value for comparison – is sound and captured by the analogy's "absence of equilibrium" and inability to "read a result". **However, the *strength* and *scope* of the normative conclusion ("abandon EV altogether and revert to dominance/satisficing") is heavily influenced by the smuggled premises:**
      *   If you accept that rational choice *requires* a convergent point-value EV, then abandoning EV maximization *for this specific class of gambles* is logical. Dominance or satisficing become fallback positions.
      *   If you reject that premise (e.g., believing other decision rules can handle such cases *within* a broader rational framework, or that EV can be salvaged with modifications like weak expectations or finitist truncation), then the analogy's conclusion is too strong. The analogy doesn't prove the necessity of the convergent point-value premise; it embeds it physically.

  **A More Accurate Analogy: The "North Pole of Utility"**

  The core issue is the assignment of a coordinate-independent "location" (a single EU value).

  1.  **The Analogy:** Imagine trying to assign a single, definitive *longitude* to the **North Pole**.
  2.  **Correspondence:**
      *   **The North Pole:** Represents the Pasadena gamble itself.
      *   **Longitude:** Represents the Expected Utility value we are trying to assign.
      *   **Different Map Projections:** Represents different ways of summing or grouping the infinite series (different orders of summation).
      *   **The Act of Reading Longitude:** Represents the attempt to assign a single EU value.
  3.  **Explanation:** Every standard map projection (e.g., Mercator, Azimuthal Equidistant) assigns a different longitude value to the North Pole (e.g., 0°, 90°E, 180°, etc.). There is no single, "correct" longitude for the North Pole; it depends entirely on the coordinate system (projection) you choose. Similarly, every different way of summing the conditionally convergent Pasadena series (grouping terms differently) yields a potentially different EU value. There is no single, "correct" EU inherent to the gamble itself independent of the summation method.
  4.  **Why it's Better:**
      *   **Avoids Physical Malfunction:** The problem isn't a broken globe; it's an intrinsic geometric property of the point (the pole) within the coordinate system (longitude). This mirrors the intrinsic mathematical property of the series (conditional convergence).
      *   **Avoids Temporal Dynamics:** It's a static mapping problem, not a process.
      *   **Highlights the Core Issue:** It directly illustrates the *dependence on the method of evaluation* (projection/summation order) for assigning a value to a singular point (the gamble). The value isn't undefined because of a failure; it's undefined *because* any assignment is fundamentally relative to the chosen method.
      *   **Clarifies the Limitation:** Just as demanding a single, projection-independent longitude for the North Pole is a category error, demanding a single, summation-order-independent EU for the Pasadena gamble exposes a limitation of the simple EV framework for *this specific structure*. It doesn't imply EV is "broken" globally, but shows it lacks the right "coordinate system" for this pathological case.
      *   **Suggests Alternatives:** To locate the North Pole, you use latitude (90°N) or Cartesian coordinates. Similarly, to evaluate the Pasadena gamble, you might need alternative criteria (e.g., tail utility, truncated EV, principle of infinite ethics, dominance reasoning) instead of simple, order-independent summation.

  **Conclusion:**

  The analytical balance analogy correctly identifies the symptom (no stable EU value) but misdiagnoses the cause as a malfunction ("broken spring") and implies a temporal process. This smuggles in the premise that a convergent point-value is absolutely necessary for rational choice and frames the undefined EV as a physical failure. While the conclusion that standard EV maximization fails for the Pasadena gamble is valid, the analogy's reasoning overstates the case and biases towards abandoning EV entirely for such gambles.

  The "North Pole of Utility" analogy more accurately captures the essence: assigning a single, order-independent EU to the Pasadena gamble is like assigning a single, projection-independent longitude to the North Pole – it's not a malfunction, but a consequence of the intrinsic structure of the object (the gamble/series) clashing with the chosen evaluation framework (simple summation/longitude). Rational agents need to recognize this limitation and employ alternative "coordinate systems" (decision rules) for such pathological cases, without necessarily discarding the entire map (EV) for well-behaved territories.
