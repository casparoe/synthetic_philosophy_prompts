prompt: |-
  I am designing a session for a graduate seminar in moral psychology and institutional design—twelve students, ninety minutes—after a recent experience facilitating restorative justice mediation left me unsettled about whether guilt and shame are culturally selectable instruments or structurally determined outcomes of deeper metaphysical commitments. I want an in-class simulation, which we might call the Moral Repair Protocol, in which participants must experience the constraint rather than merely discuss it. Divide the group into two factions representing communities recovering from collective harm: one faction may design repair mechanisms using only guilt-structured resources—private moral accounting, contractual restitution, and agent-centered forgiveness—while the other may use only shame-structured resources—public recognition of status injury, ritual reintegration, and collective witnessing. The critical design feature should be a hidden Ontological Framework card distributed to each faction that specifies whether the self in that community is treated as a stable moral ledger or as a performatively reconstructed social position; these cards remain concealed until after both factions have finalized their protocols, at which point they are revealed and the factions must negotiate whether their emotional architecture actually coheres with the metaphysics of personhood they implicitly adopted. Include explicit rules for cross-faction negotiation, a payoff scheme based on internal coherence and mutual recognizability rather than money, and materials simple enough to run without technology. The debrief should map each phase—the initial design, the hidden-card revelation, and the negotiation failure or success—onto the philosophical question of whether a culture can genuinely choose its dominant moral emotion, or whether that choice is already fixed by prior commitments about what a person essentially is. Please also predict what will go wrong the first time I run it, particularly the predictable confusion between emotional vocabulary and institutional form, and be frank about which feature of strong cultural constructivism about emotion this simulation necessarily cannot reproduce without direct facilitator supplementation.
reasoning: |-
  Okay, the user is designing a graduate seminar session in moral psychology and institutional design. They want a simulation called the Moral Repair Protocol where students experience the constraints of guilt vs. shame-based approaches to collective harm repair. 

  Hmm, this is clearly coming from a very specific academic frustration - that restorative justice mediation left them unsettled about whether guilt/shame are cultural choices or structurally determined. The simulation needs to make that philosophical tension visceral. 

  First I need to unpack their core ask: they want students to feel how metaphysical commitments about personhood (stable self vs performative self) constrain emotional toolkits for moral repair. The hidden Ontological Framework cards are brilliant - that revelation moment where groups realize their emotional architecture might not match their implicit metaphysics is the crux.

  What materials would work? Should keep it low-tech: index cards, markers, maybe some role descriptors. The payoff scheme is tricky - since it's not monetary, maybe use "social coherence points" tied to how well their repair protocol aligns with their revealed ontology? 

  Ah, the debrief mapping is crucial: Phase 1 (design) shows cultural selection in action, Phase 2 (card reveal) exposes prior commitments, Phase 3 (negotiation) tests whether emotions can be detached from metaphysics. 

  Predicting failures: Students will absolutely conflate institutional forms with emotions (e.g. thinking "apology" is inherently guilt-based). Also the performative aspect of shame will be hard to simulate without real social consequences. Might need facilitator prompts like: "In this shame-based system, what happens if the ritual fails?"

  Biggest limitation: The simulation can't show how emotions are lived experiences shaped by culture over time. A student playing "shame" won't actually feel the visceral dread of dishonor. Should warn the user they'll need to supplement with ethnographic examples of honor-shame societies.

  For negotiation rules: Strict turn-taking with "dialogue tokens" might prevent chaos. Maybe allow one ontology-translation attempt per faction? 

  ...wait, is the user hinting they want students to experience epistemic discomfort similar to their restorative justice work? That meta-layer should inform the debrief questions: "When your card was revealed, did you feel your tools suddenly seemed 'wrong'? That's the prior commitment asserting itself."
answer: |-
  Here’s a detailed design for the **Moral Repair Protocol** simulation, addressing your philosophical goals and practical constraints. It foregrounds the tension between cultural selection of emotions and their metaphysical grounding while predicting pitfalls for first-time facilitation.

  ---

  ### **Moral Repair Protocol: Simulation Structure**
  **Duration:** 90 minutes  
  **Participants:** 12 students (6 per faction)  
  **Materials:**  
  - 2 sets of faction briefs (Guilt/Shame)  
  - 2 hidden "Ontological Framework" cards (one per faction)  
  - Markers, poster paper, index cards  
  - Timer  
  - Negotiation rules handout  

  ---

  ### **Phase 1: Protocol Design (30 min)**
  **Faction Setup:**  
  - **Guilt Faction (GF)**: Uses *only* guilt-structured tools:  
    > Private moral accounting (e.g., one-on-one admissions), contractual restitution (e.g., reparations agreements), agent-centered forgiveness (e.g., victim-offender mediation).  
  - **Shame Faction (SF)**: Uses *only* shame-structured tools:  
    > Public status injury recognition (e.g., community truth-telling), ritual reintegration (e.g., cleansing ceremonies), collective witnessing (e.g., communal accountability circles).  

  **Task:**  
  Each faction designs a 3-step repair protocol for reconciling after **Group A harmed Group B over disputed land**. They must use *only* their assigned tools.  
  > *Example GF Protocol:*  
  > 1. Private admissions of fault + documentation.  
  > 2. Signed restitution contract.  
  > 3. Closed-door forgiveness hearings.  
  >   
  > *Example SF Protocol:*  
  > 1. Public storytelling of harm in communal space.  
  > 2. Ritual cleansing (e.g., shared labor on land).  
  > 3. Reintegration feast with symbolic gifts.  

  ---

  ### **Phase 2: Ontological Revelation & Negotiation (40 min)**  
  **Step 1: Reveal Hidden Cards (5 min)**  
  - GF receives: **"Self as Stable Moral Ledger"**  
    > *"Persons possess fixed moral character; actions reflect deviations from core integrity."*  
  - SF receives: **"Self as Performative Social Position"**  
    > *"Identity is relationally constituted; status exists through communal recognition."*  

  **Step 2: Cross-Faction Negotiation (35 min)**  
  - **Goal:** Merge protocols into a unified system *without abandoning core tools*.  
  - **Rules:**  
    - 3 rounds of 8-min structured dialogue (GF↔SF alternates opening).  
    - Each round begins with a "Coherence Test":  
      > *"Does Tool X from the other faction align with your ontology? Why/why not?"*  
    - No imposed solutions; factions advocate for their tools’ validity.  
  - **Payoff Scheme (Non-Monetary):**  
    - **Internal Coherence (IC)**: Does your final design align with *your* ontology? (Max 10 pts)  
    - **Mutual Recognizability (MR)**: Can the other faction map your tools to *their* ontology? (Max 10 pts)  
    > *Scoring example:* GF uses shame rituals → SF rates IC; GF explains how ritual "corrects the ledger" → GF earns MR points.  

  ---

  ### **Phase 3: Debrief & Philosophical Mapping (20 min)**  
  **Guiding Questions:**  
  1. **Design Phase (Pre-Revelation):**  
     > *"Could you freely 'choose' guilt/shame tools? Or were you constrained by the tools given?"*  
     → Highlights cultural *selection within bounds*.  
  2. **Revelation Phase:**  
     > *"When your card was revealed, did your tools suddenly feel 'natural' or 'forced'? Why?"*  
     → Exposes how metaphysics *pre-structures* emotional "fit."  
  3. **Negotiation Phase:**  
     > *"Could shame rituals 'work' in a ledger ontology? Could private contracts 'repair' in a performative ontology?"*  
     → Tests whether emotional architectures are *fungible* across ontologies.  

  **Core Insight:**  
  - If negotiation *fails*, it reveals emotions as structurally determined.  
  - If it *succeeds*, it suggests emotions can be instrumentally adapted (but at cost of coherence).  

  ---

  ### **Predictable First-Run Failures & Mitigation**  
  1. **Emotion-Tool Conflation:**  
     - *Problem:* Students assume "guilt = private" and "shame = public" *by definition*, missing that guilt can manifest publicly (e.g., trials) or shame privately (e.g., internalized stigma).  
     - *Mitigation:* Pre-simulation mini-lecture: *"Guilt/shame are defined by their* structure *(accountability locus: self/community), not their* setting."*  

  2. **Negotiation Stalemate:**  
     - *Problem:* Factions reject *all* opposing tools as "incoherent" → deadlock.  
     - *Mitigation:* Require factions to propose *one* tool adaptation (e.g., "Can we make your ritual private?").  

  3. **Oversimplified Ontologies:**  
     - *Problem:* Cards seen as "rules" rather than lived metaphysics → mechanical scoring.  
     - *Mitigation:** During debrief, contrast with real cases:  
       > *Ledger ontology:* Protestant忏悔 (private guilt).  
       > *Performative ontology:* Navajo *K’é* (kinship-based shame/restoration).  

  ---

  ### **Unsimulatable Element: Strong Cultural Constructivism**  
  **The Limitation:**  
  The simulation cannot replicate how *emotions are constituted* by cultural frameworks. Students "use" guilt/shame as pre-defined tools, but cannot experience how:  
  > - **Guilt** in a ledger ontology *feels* like a debt to the self.  
  > - **Shame** in a performative ontology *is* the dissolution of social existence.  

  **Facilitator Supplementation Needed:**  
  - Post-simulation, assign excerpts illustrating emotional phenomenology:  
    > - *Ledger guilt:* Nietzsche, *Genealogy of Morals* II (§16).  
    > - *Performative shame:* Kwame Anthony Appiah, *The Honor Code* (Chapter 1).  
  - Emphasize: *"What you designed were institutions that* channel *emotions. But the emotions themselves emerge from a lifetime of ontological conditioning."*  

  ---

  ### **Why This Works**  
  - **Hidden Cards** force confrontation between instrumental and metaphysical layers.  
  - **Coherence Scoring** replaces transactional bargaining with a struggle for conceptual integrity.  
  - **Predictable Stalemates** become data points: If GF/SF tools *can’t* be translated cross-ontology, it proves emotions aren’t "chosen" freely.  

  This simulation makes the abstract *physically constraining* — students will feel the frustration of trying to fit square tools into round metaphysical holes. Be prepared for passionate deadlocks; that’s where the learning ignites.
