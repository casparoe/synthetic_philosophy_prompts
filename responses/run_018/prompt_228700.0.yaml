  My roommate and I were arguing about the socialist calculation debate last night. His take: Mises and Hayek claimed central planning is impossible because no planning bureau could ever gather and crunch the sheer volume of economic information needed, but they were writing in the 1920s-40s, and now we have machine learning, massive compute, and real-time data on everything. So doesn't modern tech basicly prove Lange right and settle the calculation problem for good? I feel like something is off with this argument but I can't put my finger on what. Is he right that computing power has resolved the debate?
