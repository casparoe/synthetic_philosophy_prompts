  First, I need to unpack the core conflict: Lemkin's original definition included cultural destruction, but the UN Convention narrowed it to physical/biological group destruction. The research group's "structural-genocide" tag captures this cultural erasure aspect, especially regarding Chinese-Indonesians, while "political-democide" covers the mass killing of (primarily) communist suspects. The opposition worries that using any "genocide" tag here risks stretching the term beyond legal recognition or implying equivalence to cases like the Holocaust.

  Key angles to address:  
  - **Precision vs. Inflation**: Does dual-tagging clarify or muddy the waters? The structural-genocide tag specifically isolates cultural destruction, which is defensible under Lemkin but distinct from direct physical genocide.  
