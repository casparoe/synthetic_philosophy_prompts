prompt: |-
  I've been figting with my friend for like three hours about akrasia and hyperbolic disounting and I'm pretty sure neither of us knows what we're actually demanding from a theory. So I want the full checklist: what does an adequate account of weakness of will have to deliver? Not just 'explain why people smoke,' but the real spec. It needs to cover the classic cases where you act against your own present all-things-considered judgment, but it also has to draw sharp lines between real weakness, compulsion, addiction, and rational preference reversal — and it can't just invoke a hyperbolic curve and declare victory, because that explains why preferences shift across time, not why you feel torn in the single moment of choice. Here's the part I think gets ignored: the theory should preserve the first-person sense of internal struggle, the feeling that parts of me are at odds, without treating my present self and future self as literally separate agents playing a bargaining game, since that dissolves the problem into intertemporal game theory and erases the very struggle it's supposed to explain. It also needs to square with the neuroscience on prefrontal inhibition without reducing normative failure to a mere brain glitch — weakness has to be something you can be blamed for, not just a mechanical malfunction. Flag which of these are genuinely non-negotiable hard constraints and which are just preferences of particular camps (like do we need determinism? empirical equivalence with Ainslie's intertemporal model? no hidden mental states?). And tell me straight if some subset is jointly unsatisfiable — maybe preserving a unitary self for the phenomology conflicts with the divided-self structure hyperbolic discounting seems to require? Don't lay out five rival theories and leave me hanging; take a definite stance on which desiderata are load-bearing and which ones should be dropped if they clash. I'm writing this up for a philosophy of action seminar and I'm sick of fence-sitting answers that just say Davidson thinks X but the economists think Y.
reasoning: |-
  Okay, let me unpack this user's request. They're clearly frustrated after a heated debate about akrasia and hyperbolic discounting, and need a solid framework to evaluate theories of weakness of will. The core demand is for a checklist of non-negotiable criteria that any adequate account must satisfy, with clear distinctions between what's essential and what's optional.

  Hmm, the user emphasizes several key pain points: First, they want more than just preference reversal explanations - the theory must capture the visceral internal struggle in the moment of choice. Second, they reject approaches that fragment the self into separate agents. Third, there's a need to reconcile neuroscience with moral responsibility. And crucially, they want definitive answers, not just survey of existing theories.

  The user's tone suggests urgency and intellectual fatigue - they're "sick of fence-sitting answers". This is someone who's done their homework but hit conceptual roadblocks. The seminar paper context means we need academic rigor, but also clarity to cut through dead-end debates.

  Let me structure this around non-negotiable pillars. The unitary self constraint seems fundamental - without it, we lose the phenomenology of internal conflict. Normative failure must involve judgment-violation, not just preference shifts. And responsibility requires the action be "attributable" in a way compulsion isn't. 

  The neuroscience compatibility is tricky - it's necessary but shouldn't reduce weakness to mere malfunction. Hyperbolic discounting models are useful but insufficient alone; they need augmentation to explain synchronic conflict. 

  Where things get contentious is determinism - the user asks if it's required, but I think theories should remain neutral. Also, metaphysical baggage like hidden mental states should be minimized unless necessary.

  The biggest tension is between the divided-self models (which explain preference reversals well) and the unitary self requirement. My stance is that division must be functional, not ontological - subsystems in conflict, not multiple agents. The prefrontal cortex inhibition findings actually support this view of competing processes within one agent.

  For the seminar paper, I'll emphasize dropping any theory that fragments agency while keeping those that model intra-agent conflict. The responsibility angle is crucial - we must preserve blameworthiness by showing how the weak-willed action still flows from the agent's evaluative landscape, however distorted.
answer: |-
  Here's the definitive checklist for an adequate theory of weakness of will (WoW), separating non-negotiable constraints from desirable features and resolving tensions based on a unified stance:

  **Non-Negotiable Hard Constraints (Load-Bearing):**

  1.  **Violation of *Present* All-Things-Considered Judgment (ATCJ):** Must explain actions performed *intentionally* that the agent *concurrently* judges, all things considered, not to be best. This is the core definitional requirement (Davidson's insight). *Failure here means it's not explaining akrasia.*
  2.  **Intra-Personal Struggle & Unitary Agent:** Must preserve the *first-person phenomenology* of internal conflict ("parts of me are at war") while maintaining a *single, persisting agent*. The divided self must be *functional* (subsystems, processes, competing motivations within one mind) not *ontological* (separate agents/sub-personae bargaining). *Failure dissolves the problem.*
  3.  **Distinction from Compulsion/Addiction:** Must provide a clear criterion differentiating WoW (where the agent *could* have acted otherwise *in that moment*, however difficult) from cases of true compulsion/addiction (where the capacity for choice/control is *overwhelmed or pathologically diminished*). WoW involves *resistible* temptation; compulsion involves *unresistible* drive. *Failure collapses distinct phenomena.*
  4.  **Distinction from Rational Preference Reversal:** Must differentiate acting *against one's current best judgment* from rationally changing one's mind based on *new information, changing circumstances, or consistent time-consistent discounting*. WoW involves *judgment-violation*; rational reversal involves *judgment-revision*. *Failure pathologizes rational choice.*
  5.  **Compatibilist Blameworthiness:** Must explain why WoW is typically a *normative failure* for which the agent is *morally responsible* (blameworthy in principle, barring excusing conditions), without requiring contra-causal free will. This necessitates showing the action *flows from the agent's own evaluative/motivational structure* in a way that reflects a *characteristic failure of self-governance*, not just a random glitch or external force. *Failure reduces WoW to mere misfortune.*
  6.  **Synchronic Explanatory Power:** Must explain the *moment of choice conflict*. Why, *at the very time* of acting against the ATCJ, does the temptation feel compelling *despite* the concurrent judgment? Models focusing solely on preference shifts *across time* (like pure hyperbolic discounting) fail this. *Failure leaves the core experience unexplained.*

  **Highly Desirable, But Potentially Negotiable/Interpretable:**

  7.  **Compatibility with Neuroscience:** Should be plausible given findings on impulse control, reward systems (limbic), and inhibitory control (prefrontal cortex). However, it *cannot reduce* WoW *to* a "brain glitch" without normative significance. The theory must map the *functional roles* (motivation, judgment, inhibition) onto neural systems while preserving level (3) and (5). *Not strictly non-negotiable, but major weakness if absent.*
  8.  **Explanatory Scope:** Should handle classic cases (smoking, procrastination, diet lapses) *and* more subtle conflicts (e.g., moral courage failures, acting against deeply held principles under social pressure). *Wider scope is better, but core cases are primary.*
  9.  **Minimal Metaphysical Baggage:** Should avoid unnecessary ontological commitments (e.g., non-physical wills, irreducible qualia) or require highly controversial assumptions about free will. *Compatibility with determinism is strongly preferred.*
  10. **Mechanism for Struggle:** Should specify *how* the conflict between judgment and motivation manifests and is resolved (or not) – e.g., effort of will, shifting attention, motivational salience, failure of executive function. *Crucial for depth, but specific mechanisms can vary.*

  **Potentially Droppable/Dispensable:**

  11. **Empirical Equivalence to Hyperbolic Discounting:** While *intertemporal* preference reversal is a key *context* for WoW, a *complete* theory of WoW does not *need* to reproduce the precise mathematical predictions of hyperbolic discounting models for *all* choice behavior. It only needs to incorporate the relevant *insight* (immediate rewards exert disproportionate pull) into its synchronic account of judgment-violation. *Can be incorporated partially or inspirationally.*
  12. **No Hidden Mental States:** Banning *all* unconscious or sub-doxastic states is overly restrictive. A theory can posit relevant motivational or evaluative states operating below full conscious awareness, *as long as* the core conflict (violation of the *conscious* ATCJ) is preserved and these states are attributable to the agent. *Some hidden states are likely necessary.*
  13. **Complete Determinism Requirement:** While compatibility is highly desirable, the core constraints (especially 5) can potentially be formulated within certain libertarian frameworks. However, *requiring* indeterminism is unnecessary and likely detrimental, making responsibility harder to ground. *Compatibility is key; requiring indeterminism is dispensable.*

  **Resolving Tensions & The Stance:**

  *   **Unitary Self vs. Divided Self (The Core Tension):** The stance here is **functional division within a unitary agent is essential and sufficient.** Hyperbolic discounting *requires* this functional division (different valuation systems activated by proximity – limbic "wanting" vs. prefrontal "judging"). Neuroscience supports this (competing neural systems). This explains the *struggle* ("I" am the arena where these systems conflict) without fragmenting the agent ("I" am the whole person experiencing the conflict). The "parts" are *my* motivational subsystems, not other agents. **This constraint is load-bearing and achievable.**
  *   **Hyperbolic Discounting's Insufficiency:** You are correct. It explains *why* preferences reverse *over time* but not the *synchronic conflict during judgment violation*. An adequate theory must *augment* it with an account of how *both* the distant ATCJ *and* the potentiated immediate desire are *concurrently active* at the moment of choice, with the latter overriding the former despite the agent's *current* endorsement of the former. This requires integrating concepts like **motivational salience, attentional capture, or failure of inhibitory control** triggered by immediate cues.
  *   **Responsibility vs. Mechanism:** Responsibility (Constraint 5) is preserved by showing the action stems from the agent's *own* motivational structure and represents a *failure of their capacity for self-governance* based on their *own* judgments. The neuroscientific mechanism (Constraint 7) explains *how* this failure occurs at a sub-personal level, but the failure itself is attributable to the person as a whole. A faulty brake doesn't absolve the driver if they *should have* known/maintained it (character flaw) or *could have* used the handbrake (effort of will failed). The glitch becomes blameworthy *because* it reflects a characteristic vulnerability or failure of the agent's executive function *to do what they judge best*.

  **The Definite Stance:**

  A truly adequate account of weakness of will **must** be a **synchronic, intra-personal struggle model** grounded in **functional division within a unitary agent**. It explains the moment of judgment violation (Constraint 1 & 6) as the outcome of a conflict between concurrently active systems:
  1.  A **judgment system** generating the ATCJ (typically involving prefrontal cortex, long-term goals, abstract reasoning).
  2.  A **motivation system** generating powerful, action-oriented desire for the tempting option (potentiated by immediacy/cues, involving limbic reward systems).
  3.  An **executive/inhibitory system** responsible for aligning action with judgment (prefrontal cortex).

  **Weakness of will occurs when the motivation system's output, amplified by proximity/salience, overrides the judgment system's directive, and the executive system fails to exert sufficient inhibitory control to align action with judgment.** This preserves the unitary agent feeling torn (Constraint 2), distinguishes it from compulsion (Constraint 3 - the executive system *could* have succeeded but didn't), distinguishes it from rational reversal (Constraint 4 - judgment hasn't changed), grounds blameworthiness (Constraint 5 - failure is in the agent's self-governance apparatus), and is compatible with neuroscience (Constraint 7 - maps onto known neural systems and their dynamics).

  **Drop:** Theories that fragment the agent ontologically or reduce WoW purely to intertemporal preference shifts without a synchronic conflict mechanism. Hyperbolic discounting is a crucial *component* explaining *why* motivation becomes disproportionately strong near the choice point, but it is not the *whole story* of akrasia.

  This framework delivers the core phenomena, draws the necessary distinctions, preserves phenomenology and responsibility, and integrates the science without reductionism. It meets the non-negotiable constraints.
