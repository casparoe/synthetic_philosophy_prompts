answer: |-
  Consider the particle detector team: the sunk costs include thousands of hours calibrating subsystems to idiosyncratic noise profiles and environmental drift—knowledge not archived but embodied in the researchers' practices and the detector's tuned responses. Abandoning the project destroys this irrecoverable epistemic labor, which isn't a fungible asset but a scaffold enabling future measurements. Crucially, restarting would demand replicating this calibration under new conditions, introducing fresh uncertainties and hidden costs (e.g., re-learning thermal stabilization quirks that manifest only after months of operation). Thus, honoring sunk costs here isn't irrational commitment to past spending, but recognition that the detector's current state—its *achieved* calibration—embodies irreplaceable, non-transferable value that actively shapes the feasibility of future returns. The past isn't a proxy; it's materially constitutive.
