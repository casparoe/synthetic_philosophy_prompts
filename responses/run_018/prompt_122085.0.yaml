answer: |-
  ## Research Proposal: Rank-Relative Prioritarianism and the Leveling-Down Objection  

  **1. Core Research Question:**  
  Can formulating prioritarianism such that the moral weight of a welfare gain depends *solely* on an individual's *ordinal rank within a dynamically defined reference class* (rather than absolute welfare levels) resolve the conceptual instability of standard prioritarianism under uniform welfare shifts, and if so, does this reformulation nullify, transform, or preserve the force of Parfit’s leveling-down objection?  

  **2. Why the Standard Framing Leaves This Open:**  
  The standard leveling-down objection (LDO) against egalitarianism (and its evasion by prioritarianism) focuses narrowly on whether equality has *intrinsic* value. It concludes that leveling down is bad because it wastes welfare, implying prioritarianism avoids the LDO by valuing only welfare improvements weighted for absolute deprivation. However, this overlooks a deeper *structural vulnerability* in prioritarianism:  
  *   **The Instability Problem:** Standard prioritarian weight functions (e.g., concave transformations of *absolute* welfare) are sensitive to uniform downward (or upward) shifts in the welfare distribution. A policy deemed desirable in a high-welfare society might be undesirable under an identical *relative* distribution in a low-welfare society, solely due to the shift in absolute baselines. This violates the intuition that relative deprivation, not absolute numerical levels, is morally fundamental for distributive justice.  
  *   **The Gap:** Parfit's framing assumes prioritarianism is structurally sound once it rejects intrinsic equality. It fails to interrogate whether the *absolute-scale dependency* of prioritarianism creates its own normative problems (like instability) and whether this dependency is essential or incidental to its solution to the LDO. My proposal directly challenges this foundational assumption.  

  **3. Research Plan (12 Months):**  
  *   **Months 1-3: Conceptual Groundwork & Reference Class Analysis:**  
      *   Precisely define types of "reference classes" (e.g., current society, historical cohort, aspirational group).  
      *   Analyze how uniform welfare shifts impact standard prioritarian judgments using concrete cases.  
      *   Define "rank-relative prioritarianism" (RRP): Weight = f(rank_i within Reference Class C), independent of absolute welfare values in C.  
      *   Identify core normative intuitions RRP aims to capture (e.g., relativity of disadvantage, stability under societal shifts).  
  *   **Months 4-6: Formal Model Development:**  
      *   Develop a formal framework for RRP:  
          *   Define mechanisms for determining the relevant reference class `C` dynamically (e.g., local society at time t).  
          *   Specify the rank-weighting function `f(rank)` (e.g., steeply declining weights for worse ranks).  
          *   Formalize social welfare as the sum of `f(rank_i) * Δw_i` for gains, or similar.  
      *   Axiomatize key properties (e.g., invariance under affine transformations of welfare, strong Pigou-Dalton).  
  *   **Months 7-9: Testing Against the Leveling-Down Objection & Cases:**  
      *   Construct precise leveling-down scenarios within the RRP framework.  
      *   Analyze outcomes: Does RRP *ever* recommend leveling down? If not, why not? If it avoids LDO, is it for the "right" reasons (welfare waste) or due to its rank-sensitivity?  
      *   Test implications in cases involving:  
          *   Uniform downward shifts (Does RRP maintain consistent judgments?).  
          *   Changing population composition within the reference class.  
          *   "Zero-sum" relative improvements (e.g., moving from rank 100/100 to 99/100 with no absolute gain).  
  *   **Months 10-12: Synthesis, Implications & Drafting:**  
      *   Resolve the core question: Does LDO transform (e.g., into an objection about status competition or reference class arbitrariness) or dissolve under RRP?  
      *   Articulate the trade-offs: What core prioritarian/egalitarian intuitions does RRP preserve or sacrifice?  
      *   Draft findings for target philosophy/economics journals.  
      *   Outline implications for applied distributive contexts.  

  **4. What Would Count as Failure:**  
  The project would fail substantively if:  
  *   Rank-relative weighting proves *mathematically incoherent* or *necessarily collapses* into standard prioritarianism (e.g., if ranks require cardinal underpinnings reintroducing absolute scales).  
  *   RRP *systematically violates* strong, non-negotiable intuitions about distributive justice more severely than the instability it aims to solve (e.g., endorsing clearly perverse outcomes in standard cases).  
  *   The LDO persists *unchanged* against RRP, demonstrating that absolute levels, not rank-dependency, are indeed fundamental to avoiding leveling down.  
  *   Defining a non-arbitrary, dynamic reference class proves *intractable* or leads to obviously counterintuitive results.  

  **5. Honest Assessment of Scope:**  
  This is a *foundational, theoretical* project. It will:  
  *   Provide a rigorous conceptual and formal analysis of a specific structural flaw in prioritarianism.  
  *   Propose and model a novel alternative (RRP).  
  *   Test this model’s interaction with one major philosophical objection (LDO).  
  It will **not**:  
  *   Develop a complete, empirically calibrated theory of justice.  
  *   Resolve all debates about prioritarianism vs. egalitarianism.  
  *   Fully address the metaphysics of welfare or the precise measurement of "ranks."  
  *   Explore all possible reference class definitions in depth (focus is on establishing plausibility of the core rank-dependent mechanism).  
  The scope is ambitious but feasible for a year, focusing on conceptual clarity and formal demonstration rather than comprehensive defense. Success hinges on showing RRP is a coherent, interesting alternative worthy of further debate.  

  **6. Useful Result for Broader Distributive Justice Work:**  
  A successful outcome would offer:  
  *   **For Policymakers/Evaluators:** A distributive framework explicitly designed for *relativity* and *robustness under societal flux* (e.g., economic downturns, long-term progress). It could justify prioritizing the relatively worst-off *within* a specific context (a nation, a cohort), even when absolute comparisons across time/place are unstable, aiding targeted interventions.  
  *   **For Social Justice Advocates:** Conceptual tools highlighting that disadvantage is inherently relational ("last place" effects). This strengthens arguments against policies ignoring relative deprivation within groups, even amidst overall growth.  
  *   **For Economists/Modelers:** A formally tractable alternative to standard social welfare functions that incorporates rank-based concerns (akin to concerns about inequality or envy) without relying on contentious interpersonal comparisons of absolute utility, potentially influencing cost-benefit analysis or inequality metrics sensitive to positional goods.  

  This project bridges a gap in the theoretical foundations of prioritariansim, offering a novel perspective with potential to reframe debates on fairness in both academic and applied settings.
