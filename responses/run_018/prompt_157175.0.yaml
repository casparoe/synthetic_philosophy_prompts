  Even if the algorithm "works," it commits three fatal errors: 
  1) It treats individuals as preference-bundles rather than communicative beings capable of growth through interaction 
  2) It severs means (data aggregation) from ends (problem-resolution), ignoring how democratic processes reshape ends themselves 
  3) It mistakes welfare maximization for intelligent action, forgetting that human flourishing requires active participation in defining what "welfare" means

