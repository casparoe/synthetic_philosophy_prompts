prompt: |-
  In my philosphy of physics readng group someone kept saying 'you can't experience your own death in the multiverse' whenever quantum suicide came up, like it just ends the argument. I get it's tied to that quantum imortality idea but I'm not sure what precise thesis it's smuggling in. Can you unpack the different things that line could actually mean? Like is it a claim about consciousness always branching to a survivor-world, or about subjective probabilities being undefined at death, or just that first-person perspective can't observe non-existence? For each reading say whether it's defensible from the physics, whether it's a sloppy pop-science gloss, and whether it actually answers the suicide-experiment worry or just talks past it. I want a menu I can bring back to show which version they're actually using.
