  Their core challenge is reconciling two ideas: 1) the intuitive reality of conflicting obligations in crises, and 2) the logical impossibility of "ought" and "ought not" coexisting about the same action. They're particularly skeptical of "moral residue" as mere psychology, wanting proof that obligations persist post-violation without violating logic. The quantum physics analogy is sharp—they're demanding ethical rigor comparable to scientific disciplines.

