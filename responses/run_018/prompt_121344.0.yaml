answer: |-
  You misunderstand the regress argument's core demand. The viciousness lies not in the absence of a temporal starting point, but in the absence of a locus of ultimate *authorship* at any point. Your "ratchet" merely describes psychological continuity—the inheritance of attitudes and standards across time. Inheritance is transmission, not creation. You say each stage is "accountable" to prior standards it inherits. But *accountability itself* requires that the agent to whom standards are attributed was truly the author of those standards in the desert-entailing sense. If Stage S2 inherits "accountability" from Stage S1, but S1 itself inherited its standards (or the capacity to form them) from antecedent conditions for which *it* was not ultimately responsible, then S2 inherits a status S1 never legitimately possessed. You are transferring a debt nobody ever incurred. 

  You rely on "transfer" as if it were a primitive, unproblematic relation. But *what* is transferred? Only causal dispositions, psychological features, and social practices of holding accountable. None of these constitute desert. The coin analogy fails: a coin has intrinsic value conferred by its origin (the mint). Your stages have no such intrinsic responsibility-minting capacity. If the initial "coin" (the earliest stage's constitution) was not genuinely valuable (desert-conferring) because its properties were given, not self-created, then passing it along merely circulates counterfeit currency. The "sum" you describe is an accumulation of zeros. 

  The missing premise is ontological, not temporal: **Responsibility cannot be inherited if it was never generated *de novo* at any point in the chain.** Why accept this? Because desert requires *ownership* in the strongest sense—the buck must stop with the agent, not merely pass through them. Your stages are waystations, not origins. If no stage originates its responsibility-grounding properties (it can't, per your concession), then each merely transmits a status it received but did not earn. Transmission without origination is mere causal relay, not the establishment of true desert. 

  You claim each transfer is "real," but what is the *nature* of this reality? If it's just psychological or causal continuity, you've substituted a description of mechanism for a justification of desert. How does inheriting a standard from a prior self, which was itself shaped by forces beyond its ultimate control, make me *deserving* of blame for falling short? Isn't this just being punished for who the past made me?
