  First, let's unpack the core argument: The user claims counterfactuals collapse because major institutional changes inherently alter geographic utility (e.g., irrigation laws change how climate functions economically). This directly challenges methodological individualism in economics and pure institutionalism in poli sci.

  The audience composition requires triage:
  - Econ historians will attack via natural experiments (Acemoglu-style colonial instruments)
