answer: |-
  Here's your tactical Q&A prep sheet—prioritized by damage potential, phrased in their language, with tight replies and honesty flags.  

  ### **Top 3 Objections & Replies**  
  1. **Econ Historian (Natural Experiment Fan)**  
     *Objection:* "Your 'collapse' claim ignores quasi-experimental designs. We *can* isolate institutional effects using instruments like colonial settler mortality—where geography was predetermined and institutions varied exogenously."  
     *Reply (90s):* "Respectfully, those instruments assume geography is static. But settler mortality (malaria ecology) wasn’t just 'geography'—it *interacted* with colonial extraction strategies (institutions). Where extraction was brutal (Congo), infrastructure to mitigate disease wasn’t built; where settlers invested (Australia), it was. The instrument’s 'exogeneity' collapses when institutions reshape geographic utility."  
     *Slippery Flag:* I’m arguing geography’s *meaning* changes with institutions—not that instruments are useless, but their interpretation is flawed.  

  2. **Political Scientist (Culture Theorist)**  
     *Objection:* "You’re missing the mediating role of culture. Geography and institutions don’t interact directly—culture filters both (e.g., Protestantism valorizing land improvement)."  
     *Reply (90s):* "Culture matters, but it’s embedded in place. Take the Dutch Polders: Protestant norms enabled collective irrigation institutions, but those norms emerged *because* of the existential threat of flooding (geography). Change the geography (drain the sea), and the culture adapts; change the culture (individualism), and the institutions collapse. The triad is inseparable in practice."  
     *Slippery Flag:* I’m conflating "culture" with "institutionalized responses to geography." Purists will push back.  

  3. **Both Groups (Third-Variable Pushback)**  
     *Objection:* "This is a truism. Everything affects everything—but we still need identification. What about tech? War? Trade shocks? You’ve replaced two variables with a black box."  
     *Reply (90s):* "I’m not denying other factors—I’m saying *core development drivers* (arable land, trade routes) lose meaning without institutions. Consider the Suez Canal: a geographic shortcut, but useless without international law (institutions) to secure shipping. Change the law, and the canal’s value plummets. The counterfactual 'geography alone' doesn’t exist."  
     *Slippery Flag:* I’m prioritizing macro-level path dependence. Micro-studies (e.g., a single policy shock) might temporarily isolate variables.  

  ### **The Anthropologist's Nuclear Option**  
  *Question I Hope They Don’t Ask:*  
  **"Your entire framing assumes 'development' = wealth accumulation. Isn’t this reinforcing colonial teleology? What if communities use geography-institution feedback loops to *resist* commodification (e.g., Andean kinship systems)? Are you privileging growth over sovereignty?"**  

  *Reply Draft (Preemptive Prep):*  
  "That’s vital. My model *does* risk colonial bias by equating 'rich' with GDP. But the core mechanism—geography and institutions co-evolving—applies universally. Andean ayllus *are* institutions using geography (terraces, altitude) to sustain non-capitalist values. The point isn’t that growth is good; it’s that *any* social project (degrowth, Indigenous sovereignty) requires institutions that leverage geography intentionally. My failure: not centering who controls that process."  
  *Damage Control:* Acknowledge the bias upfront. Redirect to "institutional agency over geography" as neutral.  

  ### **Practical Survival Tips**  
  - **When challenged:** Use their examples against them ("As you know, in the Mali Empire, gold trade routes [geography] required Timbuktu’s legal codes [institutions]—remove one, and the system fails.").  
  - **Slippery Flags:** Pre-empt by admitting limits: "This is clearly messier at micro-scale, but for macro-historical patterns..."  
  - **Anthropologist Alliance:** If they drop the bomb, say: "I take that point deeply—let’s discuss post-talk how to decolonize this framework."  

  **Final Word:** Your strongest shield is path dependence. Hammer: "Geography sets initial conditions; institutions direct its use; both lock in. No separation." Good luck!
