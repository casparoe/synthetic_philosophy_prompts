  1) Methodology (econ historians' natural experiments - their gold standard)
  2) Third-variable problems (poli sci's culture variable)
  3) Epistemology (anthropologist's decolonial critique)

  For the colonial instrument objection: Must concede validity while reframing as local co-evolution. Example: Malaria risk in colonies wasn't just geography - indigenous water management practices shaped both disease ecology and later colonial institutions. The instrument masks this.

  Cultural objection requires embracing complexity but rejecting separability. Stress that culture manifests through land use practices (terrace farming, pastoral norms) which are literally geographic institutions.

  The anthropologist's potential question about development ontology is the nuclear option. Prep must acknowledge the Western productivity bias while redirecting to the core mechanism: All societies mediate geography through rules, but power determines who benefits. This sidesteps the "development = good" trap.

  Notable tactical notes:
