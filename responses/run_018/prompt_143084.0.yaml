answer: |-
  Here’s a taxonomy of EA critiques structured as a decision tree, designed to map nuanced disagreements without assuming label familiarity. Critiques split at key philosophical forks, each branch requiring concrete commitments. Includes niche distinctions (e.g., moral laundering, constitutive measurability) and flags contested/unsettled debates.  

  **Start:**  
  🤔 **Is EA’s core failure about *where* money goes (allocative) or *how* the movement operates (institutional)?**  

  ---

  ### 🌍 **Branch 1: Allocative Failure**  
  *(Problem: EA misdirects resources due to measurement bias)*  
  ➡️ **Is the bias fixable? Or does optimization itself corrupt morality?**  
  - **Branch 1A: Practical Measurability Error**  
    *Claim:* EA undervalues hard-to-quantify goods (dignity, justice, systemic change) but *could* fix this with better metrics.  
    *Position:* **Soft Measurability Skeptic** (e.g., some development ethicists).  
    *Awkward commitment:* "We *can* quantify ‘justice’ rigorously enough to satisfy utilitarians."  
    *Contested:* Whether EA’s tools *can* capture these dimensions without losing rigor.  

  - **Branch 1B: Constitutive Measurability Corruption**  
    *Claim:* The act of optimizing via metrics *redefines* moral good as whatever fits the model (e.g., QALYs erase non-instrumental human value).  
    *Position:* **Hard Measurability Skeptic** (e.g., some critical realists).  
    *Awkward commitment:* "Even if EA saved 1M lives via mosquito nets, its *method* degrades ethics."  
    *Unsettled:* Whether consequentialism *requires* quantification or just defaults to it.  

  ---

  ### 🏛️ **Branch 2: Institutional Failure**  
  *(Problem: EA’s structure distorts ethics/power)*  
  ➡️ **Focus on ‘earning to give’ or democratic/VC-style influence?**  

  #### 🔄 **Sub-branch: Earning to Give (ETG)**  
  ➡️ **Is ETG hypocritical... or systemically corrosive?**  
  - **Branch 2A: Individual Hypocrisy**  
    *Claim:* ETG practitioners violate integrity by profiting from harm (e.g., crypto, sweatshops) then donating.  
    *Position:* **Moral Purity Critic** (common in popular discourse).  
    *Awkward commitment:* "Donating *all* harmful profits is still unethical."  

  - **Branch 2B: Structural Moral Laundering**  
    *Claim:* ETG creates a "donation pipeline" that legitimizes harmful industries (e.g., SBF’s philanthropy masking crypto fraud).  
    *Position:* **Institutional Corruption Advocate** (e.g., foregrounded by post-FTX critics).  
    *Awkward commitment:* "Abolishing EA might *increase* net harm by dismantling an accountability tool."  
    *Contested:* Whether laundering is inherent to ETG or just a contingent risk.  

  #### 🗳️ **Sub-branch: Democratic & VC-Style Problems**  
  ➡️ **Is bypassing democracy the issue... or importing tech logic?**  
  - **Branch 2C: Democratic Deficit**  
    *Claim:* EA’s elite-driven priorities (e.g., AI risk > local poverty) override communities’ self-determination.  
    *Position:* **Democratic Prioritarian** (e.g., aligned with some postcolonial critiques).  
    *Awkward commitment:* "Locally chosen *inefficient* aid is better than outsider-chosen optimal aid."  

  - **Branch 2D: Epistemic Hubris**  
    *Claim:* EA’s "move fast/break things" ethos misapplies tech thinking to ethics (e.g., high-risk bets on unproven x-risks).  
    *Position:* **Precautionary Institutionalist** (e.g., critics of longtermism’s leverage).  
    *Awkward commitment:* "Slowing down existential risk work *now* might prevent future harm."  
    *Overlap alert:* Branches 2C and 2D often merge (e.g., "VC logic + elite control = epistemic injustice").  

  ---

  ### 🍃 Summary of Leaves:
  1. **Soft Measurability Skeptic**  
  2. **Hard Measurability Skeptic**  
  3. **Moral Purity Critic**  
  4. **Institutional Corruption Advocate**  
  5. **Democratic Prioritarian**  
  6. **Precautionary Institutionalist**  

  ### 🔍 Key Contested Zones:
  - **Constitutive vs. Instrumental Measurement:** Whether metrics *inherently* distort ethics (unsettled in moral philosophy).  
  - **Moral Laundering:** Whether ETG *causally* legitimizes harm or merely coexists with it (empirically thin literature).  
  - **Longtermism’s Democratic Deficit:** Whether urgency justifies overriding consensus (heated in policy ethics).  

  ### 💎 Underdiscussed Nuances:  
  - **"Constitutive" critiques** argue EA’s tools *create* new ethical blind spots (e.g., optimizing for health metrics ignores that *how* aid is delivered affects dignity).  
  - **Moral laundering** frames donations as PR that sustains harmful systems (e.g., oil companies funding EA-style climate research).  

  No major camp denies EA’s factual successes (e.g., malaria nets); critiques target *foundations* or *second-order effects*. Use this to show readers how disagreements cascade from first principles — not just "EA good vs. EA bad."
