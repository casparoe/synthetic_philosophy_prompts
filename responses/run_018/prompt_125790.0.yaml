prompt: |-
  I serve on the Long-Range Institutional Planning and Endowment Committee of a large research university, and we must decide by the end of this quarter whether to adopt a binding governance rule: every academic unit applying for multi-decade capital funding must submit strategic forecasts accompanied by explicit numerical probability ranges—specifically, 90 percent confidence intervals—for key outcomes such as enrollment shifts, interdisciplinary research breakthroughs, and long-range societal impact metrics. The administration's risk office argues that without such quantification, cross-unit comparison and fiduciary oversight are impossible; several senior faculty representatives, drawing on philosophy of economics and decision theory, object that many strategic uncertainties are not merely unknown in magnitude but structurally resistant to cardinal measurement, and that mandating precise numbers will institutionalize false precision rather than reduce it. One of our economic advisors circulated a brief invoking John Maynard Keynes's distinction between risk and uncertainty, but the brief appears to conflate Keynes's logical-relation theory of probability—developed in his 1921 Treatise on Probability—with Frank Knight's later economic taxonomy, and it further asserts that Keynes held long-run expectations to carry literally zero evidential weight, being governed entirely by convention or animal spirits. I need the committee's formal decision memo to engage Keynes's actual framework with philosophical seriousness: particularly his claim that probabilities can be ordered by comparative weight of argument even when they resist numerical assignment, and his view that rational belief is not reducible to frequency or subjective betting odds. At the same time, the memo must treat the risk office's concern as legitimate—namely, that purely qualitative assessments can mask arbitrariness, strategic ambiguity, and political bargaining—rather than dismissing it as managerial overreach.

  Please draft the memo I will circulate before our March meeting. It should recommend either adoption, rejection, or conditional adoption of the numerical-confidence mandate, paired with a concrete implementation timeline—say, a phased rollout over two budget cycles—and explicit criteria governing exceptions. The reasoning should identify precisely where the advisor's summary misrepresents Keynes's view of evidential weight, clarifying that Keynes did not treat long-run expectations as weightless conventions but as judgments supported by non-quantifiable yet rationally comparable arguments; it should also explain how Keynes's framework distinguishes measurable risk from genuine uncertainty without collapsing into skepticism about all forecasting. The memo must include an honest and substantive treatment of the strongest consideration on the opposing side: if you recommend conditional adoption or rejection, address directly how the university can maintain cross-unit accountability and prevent qualitative reports from becoming rhetorical exercises; if you recommend full adoption, explain how the mandate can be designed to avoid forcing false precision onto genuinely Keynesian uncertainties. Do not provide a bibliography or reading list; the committee needs reasoning it can act on, not further references.

  The deliverable should conclude with an actionable bottom line rather than an unresolved compromise—perhaps a tiered reporting structure in which quantifiable risks are submitted with standard numerical ranges, while non-quantifiable strategic uncertainties are documented through a structured weight-of-argument appendix requiring units to specify the evidential breadth, analogical support, and vulnerability to surprise for each forecast. This mechanism should be presented not as a philosophical ornament but as an institutional design feature that honors Keynes's epistemology while preserving the risk office's legitimate demand for transparent, comparable reasoning across units. Write the memo in formal institutional prose suitable for circulation to administrators, faculty senators, and trustees, with clear headings, a one-paragraph executive recommendation at the outset, and a closing implementation schedule.
reasoning: |-
  Okay, the user is part of a university committee deciding on a governance rule requiring academic units to submit strategic forecasts with 90% confidence intervals. There's tension between the risk office wanting quantifiable data and faculty arguing that some uncertainties can't be measured numerically. They specifically want to clarify Keynes's views on probability versus risk, as an advisor's brief seems to have misrepresented his position. 

  First, I need to unpack the core philosophical conflict. The risk office operates under a "quantify everything" paradigm common in institutional governance, while the faculty critique draws from Keynes's distinction between measurable risk (where probabilities can be assigned) and true uncertainty (where they can't). The advisor's brief incorrectly conflates Keynes with Knight and misstates that Keynes saw long-run expectations as having zero evidential weight. Actually, Keynes argued that even non-numerical probabilities have "weight" based on rational argumentation.

  The user's memo needs to correct this while respecting both sides. They're not asking for academic theory; they need actionable institutional design. The faculty's fear of "false precision" is valid—forcing numbers onto unquantifiable uncertainties (e.g., "probability of AI ethics breakthroughs by 2040") would indeed create garbage data. But the risk office isn't wrong to demand transparency; without structure, qualitative reports could become vague or politically manipulated.

  Hmm, the solution must bridge epistemology and bureaucracy. A tiered system makes sense: numerical ranges where appropriate (e.g., enrollment projections using historical data), and for true uncertainties, a "weight of argument" appendix documenting evidence quality. This aligns with Keynes's view that rational judgment isn't reducible to numbers but still requires rigorous comparative analysis. 

  For implementation, a phased rollout lets units adapt. Phase 1 could pilot the framework with STEM/social science units where some metrics are quantifiable, while Phase 2 expands to humanities. Exceptions should require justifying why a metric resists quantification—not just opting out. 

  The user emphasized "no unresolved compromises," so the recommendation must be decisive. Conditional adoption fits best: mandate the structure but allow flexibility in how uncertainty is expressed. Crucially, the appendix isn't a loophole; it's a disciplined way to capture non-numerical reasoning (e.g., "We assess high weight for climate policy impact based on X precedents, but acknowledge vulnerability to election surprises").

  Biggest challenge: making Keynes's weight-of-argument concept concrete for administrators. The memo must frame it as risk management—not philosophy—by requiring units to specify: 
  - What analogies support this forecast? 
  - What evidence gaps exist? 
  - What events could radically change this outcome? 

  This forces rigor without fake numbers. And by satisfying the risk office's need for cross-unit comparability, it prevents qualitative assessments from becoming "rhetorical exercises." 

  Finally, tone is key. The memo can't dismiss either side. The risk office gets auditable structure; faculty get protection from quantification theater. Closing with a timeline (e.g., "Full implementation by FY27") shows operational seriousness.
answer: |-
  **MEMORANDUM**  
  To: Long-Range Institutional Planning and Endowment Committee  
  From: [Your Name/Committee Chair]  
  Date: 1 March 2025  
  Subject: Recommendation on Mandated Numerical Probability Ranges for Capital Funding Applications  

  ---

  ### **I. EXECUTIVE RECOMMENDATION**  
  The Committee recommends **conditional adoption** of the strategic forecasting mandate, requiring academic units to submit 90% confidence intervals for quantifiable outcomes while permitting structured qualitative documentation for non-quantifiable strategic uncertainties. Implementation will occur in two phases: Phase 1 (FY2026) pilots the framework with three volunteer units and refines exception criteria; Phase 2 (FY2027) enacts university-wide rollout. Exceptions will be granted only for forecasts meeting strict criteria of "Keynesian uncertainty" (defined in Section IV). This approach honors fiduciary accountability, prevents false precision, and operationalizes John Maynard Keynes’s distinction between measurable risk and genuine uncertainty without misrepresenting his epistemology.  

  ---

  ### **II. CLARIFICATION OF KEYNES’S FRAMEWORK: CORRECTING THE RECORD**  
  The circulated economic advisor’s brief misrepresents Keynes’s view in three critical ways:  
  1. **Risk vs. Uncertainty**: Keynes (1921 *Treatise on Probability*) distinguished between "risk" (probabilities derivable from known frequencies or logical symmetries) and "uncertainty" (probabilities that lack calculable foundations). This aligns with, but is not identical to, Knight’s later taxonomy.  
  2. **Weight of Argument**: Keynes rejected the claim that non-numerical probabilities are arbitrary or "weightless." He argued rational agents compare "weight of argument" (i.e., breadth/vagueness of relevant evidence) to form ordinal judgments (e.g., Outcome A is *more likely* than B, though neither has a precise number).  
  3. **Long-Run Expectations**: The brief erroneously states Keynes viewed long-run expectations as purely conventional or driven by "animal spirits." In reality, Keynes held such judgments *can* be rational when based on comparable arguments—even when non-quantifiable.  

  **Implication for Strategic Forecasts**:  
  Mandating numerical ranges for all outcomes misapplies Keynes by collapsing uncertainty into risk. However, dismissing qualitative assessments ignores his insistence that rational belief requires structured evidentiary comparison.  

  ---

  ### **III. TIERED REPORTING STRUCTURE: QUANTITATIVE RANGES AND QUALITATIVE APPENDICES**  
  To resolve this tension, capital funding applications must include:  
  #### **A. Standard Numerical Ranges (Where Applicable)**  
     - **Requirement**: 90% confidence intervals for outcomes with sufficient historical data or model-based foundations (e.g., enrollment shifts, facility costs).  
     - **Justification**: Addresses the Risk Office’s need for cross-unit comparability and auditable assumptions.  

  #### **B. Structured Weight-of-Argument Appendix (For Non-Quantifiable Uncertainties)**  
     - **Required for**: Forecasts involving interdisciplinary breakthroughs, societal impacts, or emergent fields lacking data.  
     - **Documentation Framework**: Units must specify:  
        - **Evidential Breadth**: Sources consulted (e.g., expert panels, analogical cases).  
        - **Comparative Support**: Ordinal ranking vs. peer units or historical precedents (e.g., "higher confidence than Department X’s 2020 AI initiative").  
        - **Vulnerability to Surprise**: Key unknowns that could invalidate the forecast.  
     - **Audit Trail**: Appendices undergo peer review by a faculty-administrator panel to ensure rigor and deter "rhetorical exercises."  

  ---

  ### **IV. ADDRESSING CORE CONCERNS**  
  #### **A. Preventing False Precision**  
     - **Exception Criteria**: Numerical exemptions granted only if units demonstrate:  
        (a) No relevant frequency data exists;  
        (b) No consensus model supports quantification;  
        (c) Forecast involves novel societal/technological drivers.  
     - **Example**: Quantifying "probability of bio-ethics breakthroughs by 2040" is invalid; instead, the appendix details analogies to past paradigm shifts.  

  #### **B. Ensuring Accountability for Qualitative Assessments**  
     - **Review Protocol**: The Provost’s Office will score appendix coherence using:  
        - Evidence diversity (0–5 pts)  
        - Surprise vulnerability mapping (0–5 pts)  
        - Peer consensus rating (0–5 pts).  
     - **Comparative Oversight**: Scores benchmarked across units, with low-scoring reports requiring revision.  

  ---

  ### **V. IMPLEMENTATION TIMELINE**  
  | Phase | Timeline | Actions |  
  |-------|----------|---------|  
  | **Phase 1: Pilot & Refinement** | Q3 FY2026 | • 3 volunteer units test full framework.<br>• Risk Office drafts exception evaluation rubric.<br>• Faculty Senate reviews scoring methodology. |  
  | **Phase 2: Full Rollout** | FY2027 Budget Cycle | • Mandate applies to all capital funding applications.<br>• Exceptions panel established (3 faculty, 2 administrators, 1 trustee). |  
  | **Review** | Q4 FY2027 | Committee evaluates adherence, revises criteria if needed. |  

  ---

  ### **VI. CONCLUSION**  
  This recommendation rejects a binary choice between quantification and qualitative ambiguity. By adopting a tiered framework, the University commits to:  
  - **Fiduciary Rigor**: Cross-unit comparability via audited numerical ranges *and* scored qualitative appendices.  
  - **Epistemic Integrity**: Avoiding false precision where Keynesian uncertainty prevails, while demanding transparent "weight of argument" documentation.  
  - **Strategic Adaptability**: A phased rollout allows calibration to disciplinary realities.  

  **Bottom Line**: Adopt the mandate with the above conditions and timeline. The structured appendix is not a concession but an accountability mechanism—transforming qualitative judgment into auditable, comparable institutional reasoning.  

  ---  
  **END MEMORANDUM**
