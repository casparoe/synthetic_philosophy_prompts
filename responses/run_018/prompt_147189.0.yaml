answer: |-
  Based on your intuitive verdicts, a **single coherent principle** emerges that explains all four settled judgments while resolving your oscillation in Case 5. This principle reconciles the harm-help asymmetry with cases involving autonomous systems and omissions, without ad hoc adjustments. I'll state the principle, map it to your cases, resolve Case 5, and apply it to your proposed AI scenario.

  ---

  ### **The Unified Principle: Goal-Dependent Direct Causation (GDDC)**
  **An agent intentionally brings about outcome O if and only if:**
  1. **O is causally direct**: O results from the agent’s **action** (not omission) in a **non-deviant causal chain** (i.e., no significant unplanned intermediaries alter the outcome).
  2. **O is goal-necessary**: The agent **needs O to occur** to achieve their primary goal (O is a planned means or constitutive element of the goal).
  3. **Asymmetric voluntariness**: For **harmful O**, the agent must **actively enable or produce** the harm. For **beneficial O**, mere **foreseen enablement** via direct action suffices (reflecting weaker intentionality thresholds for help).

  ---

  ### **Mapping the Principle to Your Cases**
  | Case | Outcome (O) | GDDC Analysis | Your Verdict | Why It Fits |
  |------|-------------|---------------|--------------|-------------|
  | **1. Factory Owner (Harm)** | Poisoning river | **✓ Direct action** (installing filter), **✓ Goal-necessary** (toxin release is inherent to the cheaper system; saving money *requires* its release). **✓ Active harm production**. | Intentional | Harm is direct, necessary for the goal, and actively chosen. |
  | **2. Factory Owner (Help)** | Improving water | **✗ Not goal-necessary**: Pollution removal is a side effect; compliance doesn’t *require* improvement. **✓ Direct action** but insufficient without necessity. | Not intentional | Help is incidental, not needed for compliance. Asymmetric voluntariness excludes it. |
  | **3. Researcher (Help)** | Improving health | **✓ Direct action** (deploying drones), **✓ Goal-necessary?** Not for data collection, but **✓ Foreseen enablement**: Drone activity *directly* caused delivery (no deviant chain). **✓ Asymmetric voluntariness**: Benefit enabled by action suffices. | Intentional | Autonomous systems don’t break directness; help is foreseen and enabled by the agent’s direct action. |
  | **4. Admin (Harm)** | Patient death | **✗ Not direct action**: Outcome results from **omission** (terminating contract), not active harm. **✓ Goal-necessary** for budget cuts, but omission invalidates directness for harm. | Not intentional | Harm via omission fails the "direct action" requirement for intentional harm. |
  | **5. Teacher (Harm)** | Student fails | **✓ Direct action** (designing exam), **✓ Goal-necessary**: Failing the student is a *means* to maintain standards (goal requires specific exclusion). **✓ Active harm production**. | **Intentional** (resolves oscillation) | Matches Case 1: Harm is direct, necessary for the goal, and actively engineered. |

  **Why Case 5 is intentional**: The teacher’s action (exam design) directly targets the student’s failure as a means to her goal. Unlike Case 4 (omission), this is **active harm production**. Your oscillation likely stems from the goal’s perceived legitimacy ("maintaining standards"), but GDDC focuses on causal role, not moral valence.

  ---

  ### **Predictions for New Scenario: AI Safety System**
  **Scenario**: An AI safety system autonomously blocks a harmful action (e.g., launching a missile) that its human operator foresaw but failed to prevent.  
  **GDDC Analysis**:  
  - **For the AI**: **Intentional prevention of harm**.  
    - ✓ **Direct action**: AI actively blocks the missile.  
    - ✓ **Goal-necessity**: Preventing harm is constitutive of its safety goal.  
    - ✓ **Asymmetric voluntariness**: Benefit (harm prevention) is enabled by direct action.  
  - **For the Human Operator**: **Unintentional allowance of harm**.  
    - ✗ **Not direct action**: Harm results from *omission* (failing to intervene).  
    - ✓ **Foreseen but not goal-necessary**: Harm isn’t needed for the operator’s goal (which may be unrelated).  

  **Verdict**: The AI intentionally prevents harm; the human does not intentionally allow harm (though they may be negligent).

  ---

  ### **Addressing Your Core Questions**
  1. **Harm-help asymmetry with autonomous systems (Case 3)**:  
     The asymmetry **survives but is modulated by directness**. Autonomous systems (e.g., drones) preserve **direct causal chains** for benefits (weaker intentionality threshold), but for harm, they require **goal-necessity** (stronger threshold). Case 3’s drones are tools extending the researcher’s agency—health improvement is a foreseen direct byproduct of her action, satisfying asymmetric voluntariness for help.

  2. **Omission vs. directness for harm (Case 4 vs. Case 1)**:  
     **Omission weakens intentionality for harm** but not identically to how side effects weaken intentionality for help.  
     - Harm requires **active production** (Case 1: installing a toxin-releasing system).  
     - Help tolerates **foreseen enablement** (Case 3: deploying drones that *actively* deliver supplies).  
     Case 4’s omission fails the "direct action" clause for harm, mirroring how Case 2’s side effect fails "goal-necessity" for help—but the thresholds differ.

  ---

  ### **Outlier? Robustness Over Patching**
  No outlier exists in your four verdicts—**GDDC explains all without contradiction**. Case 3 is consistent because:  
  - Autonomous systems maintain **non-deviant causal chains** (drones delivering supplies is a predictable outcome of deployment).  
  - **Asymmetric voluntariness** accepts mediated benefits as intentional if directly enabled, while mediated harm (e.g., an AI poisoning water) would require goal-necessity to be intentional.  

  **Defending GDDC against alternatives**:  
  - **Double Effect** (traditional): Fails Case 3 (side-effect benefit can’t be intentional).  
  - **Causal Sufficiency**: Fails Cases 2/4 (over-includes incidental outcomes).  
  - **Pure Volitionism**: Fails Case 3 (researcher doesn’t "intend" health improvement).  
  GDDC uniquely handles mediation/autonomy by prioritizing **causal directness + goal-dependence**, with asymmetry grounded in empirical moral psychology (people assign stronger intentionality to harm than help).

  ---

  ### **Conclusion**
  Your judgments form a **coherent pattern** explained by **Goal-Dependent Direct Causation (GDDC)**. Harm requires active, goal-necessary production; help tolerates foreseen enablement via direct action. Autonomous systems preserve this asymmetry if they extend agency without deviant chains (Case 3), while omissions negate intentional harm (Case 4). Case 5 is **intentional harm**; the AI scenario sees **intentional prevention by the AI** but **unintentional allowance by the human**. This principle reflects deep-seated intuitions about control, causality, and moral valence—no patching needed.
