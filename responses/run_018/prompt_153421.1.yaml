  i need a sequence of about six questions that dont let her hide behind the idea that functionalist answers are cheap. first, push whether this collapses hedonism into reinforcement-learning behaviorism, since both update action policies. then include the standard reply and the follow-up: if she says the difference is that pleasure involves an explicit representation of warrant, ask whether that representation is itself a felt quality in disguise. next i want something on compulsive repetition — the gambler who pulls the lever forever but reports zero positive feeling. if she blocks this by saying he lacks the right kind of warrant, ask how she can tell the difference without sneaking phenomenal feel back in.

