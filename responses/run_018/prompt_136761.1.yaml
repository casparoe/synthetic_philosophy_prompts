  The reverse-Ulysses is interesting - it flips the classic scenario. Say a current majority wants to scrap electoral safeguards that past generations created, but a future majority might want to keep them. Does directionality matter? 

  I should also address the perpetuity issue. Many constitutions claim permanence, but is that defensible? And the domination concern - how to distinguish binding from tyranny over future voters. 

