answer: |-
  Here’s a decision tree for your philosopher character’s seminar, designed as an interactive debate tool. It’s gritty, opinionated, and forces students to take sides without jargon. I’ve rooted it in your requested structure, added the unnamed "indexical" leaf, flagged overlaps, and defended a stance.  

  **The Tree: Mary’s Room Smackdown**  
  *Start here:*  
  **Q1:** When Mary leaves her black-and-white room and sees red for the first time, does she discover something *factual* about color experience she couldn’t learn from textbooks?  
  - **→ No:** Jump to Q2.  
  - **→ Yes:** Jump to Q3.  

  ---

  **Q2 (from "No"):** If she doesn’t learn a new fact, what *does* she gain?  
  - **→ Abilities:** She gains skills (e.g., recognizing red, imagining it) but no new truths. **Leaf: Ability Hypothesis**. Physicalism survives.  
  - **→ A new perspective:** She learns *how* to point to her experience (e.g., "This is what red looks like") but adds nothing to what science already describes. **Leaf: Indexical Knowledge**. Physicalism survives.  

  ---

  **Q3 (from "Yes"):** Is the gap between her old knowledge and new discovery about *reality itself* or just *her understanding*?  
  - **→ Reality (metaphysical gap):** The world has properties science can’t capture. **Leaf: Jackson’s View**. Physicalism fails. Qualia are intrinsic.  
  - **→ Her understanding (epistemic gap):** Physical facts were always there; she just couldn’t grasp them. Jump to Q4.  

  ---

  **Q4 (from "epistemic gap"):** Are the qualities of her experience (e.g., redness) *intrinsic* (raw feels) or *relational* (tied to how her mind interacts with the world)?  
  - **→ Intrinsic:** The "what-it’s-like" is a bedrock property. Jump to Q5.  
  - **→ Relational:** Experience is about *representing* the world (e.g., red = coding external objects). **Leaf: Representationalist Denial**. Physicalism survives.  

  ---

  **Q5 (from "intrinsic"):** Can physicalism explain why her new knowledge *feels* irreducible?  
  - **→ No:** Then you’ve contradicted yourself—epistemic gaps shouldn’t imply intrinsic metaphysics. Revisit Q3!  
  - **→ Yes:** Her "eureka!" moment comes from wielding a *new concept* for physical brain states. **Leaf: Phenomenal Concept Strategy**. Physicalism survives.  

  ---

  **Indistinguishable Leaves & Why They’re Messy:**  
  - **Phenomenal Concept vs. Ability Hypothesis:** Both deny metaphysical gaps, but the tree separates them at Q1. If students conflate them (e.g., "New concepts *are* abilities!"), it’s **unexplored territory**—neither side fully resolves why Mary’s discovery *feels* ontological.  
  - **Indexical vs. Representationalism:** Indexical knowledge (Q2) is about *reference* ("this" experience), while representationalism (Q4) is about *content* (neural representations). They’re split cleanly.  

  **My Committed Stance (For Your Philosopher):**  
  **Q5’s "Phenomenal Concept Strategy" holds up.**  
  - **Why?** Mary’s shock comes from accessing physical brain states via a *phenomenal concept*—like learning physics in English, then "feeling" it in Greek. The gap is conceptual, not metaphysical.  
  - **Defense:**  
    1. **Saves physicalism without hand-waving:** Unlike indexical/ability views (which downplay her discovery) or representationalism (which reduces "redness" to abstract coding), this takes her revelation seriously *without* ghost-in-the-machine qualia.  
    2. **Acknowledges the kicker:** Jackson’s intrinsic qualia sound profound but crumble under neuroscience—e.g., change a brain state, and the "intrinsic" feeling changes. Relational views (representationalism) struggle with dreams/hallucinations where "red" exists without objects.  
    3. **Cuts through noise:** The epistemic gap is real, but it’s about *human cognition*, not cosmic mysteries. Mary’s room exposes how we *think* about minds, not what minds *are*.  

  **Weaknesses I’d Roast in Seminar:**  
  - Jackson’s View (metaphysical gap): Turns qualia into magical properties—untestable and redundant.  
  - Ability/Indexical: Feel evasive. ("She doesn’t learn a *fact*? Tell that to Mary sobbing over a rose!")  
  - Representationalism: Reduces agony to "error signals," which is ice-cold and ignores why pain *sucks*.  

  ---

  **Tree Flow Summary:**  
  ```  
  Q1 (New fact?) → No → Q2 → [Ability Hypothesis / Indexical]  
  Q1 → Yes → Q3 (Gap type?) → Metaphysical → [Jackson’s View]  
  Q3 → Epistemic → Q4 (Qualia type?) → Relational → [Representationalism]  
  Q4 → Intrinsic → Q5 → [Phenomenal Concept Strategy]  
  ```  

  **For Your Novel:**  
  - Have your philosopher bully students into Q5 ("If you’re not a physicalist, get out!"). She’d see Jackson as quaint, representationalists as robots, and indexical/ability folks as cowards.  
  - Grammar be damned—make her interrupt with "Bullshit!" when someone picks "metaphysical gap."  

  Dig it? Hack this up—it’s your world.
