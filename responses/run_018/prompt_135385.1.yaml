answer: |-
  Here's the thought experiment:

  **Scenario: The Sugar Archipelago**  
  Imagine the tropical nation of Cana, founded 300 years ago when colonists eradicated the indigenous population through disease and forced labor to establish sugar plantations worked by enslaved Africans. The last direct participants died by 1900. Cana gained independence in 1950, but a brutal dictatorship until 1980 kept the plantation-based economy intact. After the dictatorship fell, *all* current citizens immigrated voluntarily between 1985-2000, lured by ads promising "paradise jobs" in tourism and agriculture. Today, Cana's government proudly maintains the original colonial borders, funds its schools and hospitals with revenue from luxury resorts built atop former mass graves, and enforces property laws tracing directly to stolen indigenous land. Everyone knows the history, but no one has ancestral ties to victims *or* perpetrators. You're a tax-paying citizen who enjoys Cana's beaches and healthcare.

  **Analysis:**
  1.  **Jaspers' Political Guilt View:** You're politically guilty. By participating in Cana's state (paying taxes, voting, benefiting from its infrastructure), you're complicit in maintaining institutions *founded* on atrocity. Your passport and public services are direct products of that crime. You bear responsibility to reform the system you willingly joined.
  2.  **Strict Individualist View:** Zero guilt. You didn't commit, consent to, or benefit *intentionally* from the crimes. Your immigration was recent and economically motivated. Current institutions may be historically tainted, but your *individual* actions (working, paying taxes) are morally neutral within the *current* legal framework. Blame attaches only to actors, not passive beneficiaries generations removed.
  3.  **Bureaucratic Continuity View:** You inherit *moral liability*. While not criminally culpable, you exist within a moral debt framework created by the unatoned original sin. The state apparatus – its borders, land titles, economic structure – is a direct, unbroken conduit of ill-gotten gains. By upholding and benefiting from *this specific, continuity-dependent* system, you share a moral burden to acknowledge and address the inherited harm, even without bloodline connection.

  **The Key Feature:** **Institutional Persistence Despite Total Demographic Turnover.** The unbroken line of the *state itself* – its laws, borders, economy, and the material wealth embedded in them – carries the guilt. The institutions act as the "vessel" transferring the moral weight.

  **What Collapses Without It?**  
  If Cana had dissolved after the atrocity, been fully annexed/reset by another nation, or experienced a revolution that *fundamentally dismantled and replaced* its core institutions (e.g., redistributed all land unconditionally, wrote a wholly new constitution severing legal continuity, rebranded the economy away from the tainted assets), then claims of *inherited* guilt/liability for newcomers collapse. Jaspers might still see a *new* political guilt for maintaining *new* injustices, but the link to the *original* crime is broken. The individualist breathes easy, and the bureaucratic continuity view has no vessel for the inherited "debt" to persist. The crime becomes purely historical, not structurally embedded in the *present* state the citizens inhabit.
