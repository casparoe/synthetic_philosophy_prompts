answer: |-
  Here’s my credence decomposition for the claim that **attachment to originals is a non-rational "wrong-kind-of-reasons" fetish**, with causal history contributing *nothing constitutive* to aesthetic value. I assign an **overall credence of 0.3** (i.e., 30% confidence the framing is correct).

  ---

  ### **Decomposition & Credences**  
  *(Scale: 0 = certainly false, 1 = certainly true)*  

  1. **Aesthetic value is exhaustively perceptual/structural**  
     - *Claim:* If two objects are perceptually indistinguishable, their aesthetic value is identical.  
     - *Credence:* **0.4**  
     - *Reasoning:* While formal properties (color, composition) are primary, aesthetic experience often involves *cognitive penetration* (e.g., knowing it’s a forgery alters perception). Cases like identical twins playing the same sonata highlight how identical structures can feel different when context shifts.  

  2. **Artist’s intention/historical embeddedness is constitutive**  
     - *Claim:* The act of creation and historical context are intrinsic to artistic value, not just instrumental.  
     - *Credence:* **0.25**  
     - *Reasoning:* Artworks are *action traces* (e.g., Pollock’s drips encode human movement). A forged Rembrandt lacks the struggle of 17th-century innovation. However, this may conflate artistic and historical value.  

  3. **Wrong-kind-of-reasons analogy transfers to aesthetics**  
     - *Claim:* Preferring originals is like valuing "moral desert" – irrational outside moral contexts.  
     - *Credence:* **0.2**  
     - *Reasoning:* Ethics focuses on *actions* (e.g., praising for good motives), while aesthetics centers *experiences*. Provenance may provide *right-kind reasons* if art’s value includes its cultural biography (e.g., relics).  

  4. **Institutional/ritual value is separable from aesthetic value**  
     - *Claim:* Museums’ cultural roles are non-aesthetic additives.  
     - *Credence:* **0.5**  
     - *Reasoning:* We *can* isolate a painting’s visual impact from its Louvre label (e.g., viewing it unknowingly in a warehouse). But this risks circularity: if "aesthetic value" is defined *only* perceptually, institutional value is excluded by fiat.  

  ---

  ### **Overall Credence Calculation**  
  - **Weighted Average:** (0.4 + 0.25 + 0.2 + 0.5)/4 = **0.34** → Rounded to **0.3**  
    (Equal weighting for simplicity; sensitivity analysis below).  
  - **Key Sensitivity:** Most sensitive to **Component #3 (analogy transfer)**. If the ethical framework is inapplicable, the entire argument weakens.  

  ---

  ### **Most Persuasive Comparative Cases**  
  - **↑ Move credence ↑ (toward 0.5+):**  
    - *Perfect recording vs. live concert:* If a studio recording (identical sound) is valued equally to a live performance, originals are fetishized.  
    - *Restored vs. untouched artifact:* If a reconstructed Parthenon marble (with added fragments) elicits equal awe to the original fragments, provenance is irrelevant.  
  - **↓ Move credence ↓ (toward 0.1):**  
    - *Ancient tool vs. perfect replica:* A Neanderthal flint knife’s value plummets if revealed as a modern replica – despite identical form – suggesting history is constitutive.  
    - *Autograph manuscript vs. photocopy:* A handwritten Kafka draft feels ontologically different from a copy, even if text is identical.  

  ---

  ### **Confidence in Decomposition & Uncertainties**  
  - **Overall Confidence in Breakdown:** **70%**  
    - *Strengths:* Components cover core dimensions (perceptual, intentional, philosophical, institutional).  
  - **Least Certain Point:** **Component #2 (constitutive intentionality)** at credence 0.25.  
    - *Why?* Risk of conflating *artistic value* (e.g., innovation) with *aesthetic value* (e.g., beauty). Is a forged Vermeer less *beautiful* or just less *significant*?  
  - **Ethical Framework Risk:** Moderate concern I’m importing ethics into aesthetics in **Component #3**. Aesthetic "reasons" may legitimately include non-perceptual elements (e.g., knowing a landscape painting depicts a real threatened ecosystem).  

  ---

  ### **Conclusion**  
  I lean **against** the "wrong-kind-of-reasons" framing (70% against). While perceptual properties dominate aesthetic encounters, art’s cultural ontology – its genesis as a human artifact in history – likely provides *right-kind reasons* for valuing originals. The strongest counterargument would be evidence that **contextual knowledge never alters phenomenological experience** (e.g., blind studies showing identical emotional responses to originals/forgeries). Absent that, dismissing provenance as irrational risks over-privileging formalism.
