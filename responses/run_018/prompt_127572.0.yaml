prompt: |-
  im trying to avoid just defaulting to contextualism, so before i read more i want the full spec. write the desiderata for any theory that ties practical stakes to knowledge: the classic cases it has to get right (low-stakes bank withdrawal, high-stakes bank withdrawal, lottery belief, stopped clock), the conceptual distinctions it can't collapse (knowing vs justified true belief vs rational acceptance; also subject-stakes vs attributor-stakes), and the psychological findings about risk and belief revision it shouldn't flatly contradict. inject this edge case im stuck on: a belief formed when stakes were low, but the stakes spike retroactively — does the person still know? flag which requirements are non-negotiable vs camp-specific (like whether knowledge must be invariant across contexts), and tell me if any two are probably unsatisfiable together — especially if avoiding retroactive loss kills stakes-sensitivity. then briefly check pure contextualism, invariantist pragmatic encroachment, and a knowledge-first view against the list.

  please seperate settled points from genuinely contested ones, and don't pretend one side is the consensus. lead with the bottom line in sentence one, then reasoning, no preamble and don't restate my question.
reasoning: |-
  We are building desiderata for any theory that ties practical stakes to knowledge. The bottom line is: the theory must handle classic cases (low/high stakes bank, lottery, stopped clock), preserve key distinctions (knowledge vs. justified true belief vs. rational acceptance; subject-stakes vs. attributor-stakes), cohere with psychological findings, and address the retroactive stakes edge case without collapsing into inconsistency.

  ## Desiderata

  ### 1. Classic Cases
     - **Low-stakes bank withdrawal**: On Friday, Hannah has a justified true belief that the bank is open Saturday, with low stakes (no urgent need). She knows it.
     - **High-stakes bank withdrawal**: Same Hannah, same evidence, but now with high stakes (if bank closed, disaster). She does not know.
     - **Lottery belief**: One believes their ticket will lose (based on odds) but does not know it (even if true) because the chance of error is salient.
     - **Stopped clock**: One looks at a clock that stopped 12 hours ago but happens to show the right time. They form a true belief but do not know (Gettier-style).

  ### 2. Conceptual Distinctions
     - **Knowledge vs. Justified True Belief (JTB) vs. Rational Acceptance**: The theory must not collapse these. For example, in high stakes, one might have JTB without knowledge; in lottery, rational acceptance without knowledge.
     - **Subject-Stakes vs. Attributor-Stakes**: Subject-stakes: how the subject's practical situation affects whether they know. Attributor-stakes: how the attributor's context (e.g., in conversation) affects whether they attribute knowledge. The theory must clarify which stakes matter and avoid conflating them.

  ### 3. Psychological Findings
     - **Risk and Belief Revision**: People revise beliefs under perceived risk (e.g., higher stakes lead to more evidence demanded). The theory shouldn't contradict robust findings (e.g., that stakes can affect evidence thresholds in reasoning).

  ### 4. Edge Case: Retroactive Stakes
     - **Scenario**: A belief is formed when stakes are low (e.g., I believe my car is parked in A5; low stakes because I have time to find it). Then, stakes spike retroactively (e.g., I must get to ER, and my car is the only way). Do I still know where my car is?
     - **Challenge**: If the theory says knowledge is lost retroactively, it might violate the idea that knowledge is stable (once formed, it doesn't vanish without new evidence). If it says knowledge remains, then stakes-sensitivity seems violated (because current high stakes don't affect past knowledge).

  ### 5. Non-Negotiables vs. Camp-Specific
     - **Non-Negotiables**:
       - The theory must account for the intuitive judgments in the classic cases (low/high stakes, lottery, stopped clock).
       - It must not collapse knowledge into JTB or rational acceptance (i.e., it must allow that one can have JTB without knowing, as in Gettier or high stakes).
       - It must be consistent with the psychology of risk and belief formation (e.g., higher stakes lead to higher evidence thresholds).
     - **Camp-Specific**:
       - **Contextualism**: Knowledge attributions are context-sensitive (attributor's context matters). Non-negotiable for contextualists but rejected by invariantists.
       - **Invariantism**: Knowledge is not context-sensitive; what varies is only the practical rationality of acting. Some invariantists (pragmatic encroachers) tie knowledge to subject's stakes.
       - **Knowledge-First**: Knowledge is primitive and not reducible to JTB. Stakes might affect actionability of belief, not knowledge itself (but some knowledge-firsters accept pragmatic encroachment).

  ### 6. Tensions
     - **Retroactive Loss vs. Stakes-Sensitivity**: If we avoid retroactive loss (i.e., knowledge doesn't vanish when stakes rise without new evidence), then we might lose stakes-sensitivity (because the same belief is knowledge in low and high stakes). But if we allow retroactive loss, we break the link between knowledge and the conditions at the time of belief formation.
     - **Subject-Stakes vs. Attributor-Stakes**: If the theory uses subject-stakes, it might struggle with cases where the attributor is in a different context (e.g., high-stakes attributor says low-stakes subject doesn't know). If it uses attributor-stakes, it might make knowledge too relative.

  ## Theory Check

  ### Pure Contextualism
     - **Classic Cases**: Handles low/high stakes by shifting epistemic standards (attributor's context). Lottery and stopped clock: high standards in attributions.
     - **Distinctions**: Preserves knowledge vs. JTB by making knowledge attribution context-relative. Subject-stakes vs. attributor-stakes: attributor-stakes drive the context.
     - **Psychology**: Can accommodate that people adjust standards with stakes, but the psychological mechanisms are about attribution, not the subject's mental state.
     - **Retroactive Stakes**: If the attributor's stakes are high now, they might deny knowledge of the past belief. This allows retroactive loss (from the attributor's perspective) but might clash with the subject's perspective (who had low stakes when forming the belief). Controversial.

  ### Invariantist Pragmatic Encroachment
     - **Classic Cases**: Subject's stakes affect knowledge. In low stakes, Hannah knows; high stakes, she doesn't. Lottery: high stakes (losing is bad) so no knowledge. Stopped clock: no stakes effect (so no knowledge, as per standard).
     - **Distinctions**: Knowledge is JTB plus something (e.g., no defeaters) but stakes affect what counts as sufficient justification. Subject-stakes are primary.
     - **Psychology**: Fits with stakes influencing evidence thresholds for justification.
     - **Retroactive Stakes**: Problematic. If stakes rise after belief formation, does knowledge vanish? If yes, retroactive loss (but then knowledge is unstable). If no, then the high-stakes subject (who now has high stakes) might still know? But in high-stakes cases, we typically deny knowledge. This tension is unresolved.

  ### Knowledge-First View
     - **Classic Cases**: Some versions (e.g., Williamson) reject stakes affecting knowledge. They might explain low/high stakes by the actionability of belief (not knowledge itself). Lottery: one doesn't know because of the chance of error (not stakes). Stopped clock: no knowledge (Gettier).
     - **Distinctions**: Knowledge is unanalyzable and distinct from JTB. Stakes might affect action, not knowledge.
     - **Psychology**: Might say stakes affect belief revision, not knowledge. But then it doesn't explain why we deny knowledge in high stakes.
     - **Retroactive Stakes**: Since stakes don't affect knowledge, the belief remains known. But then it fails to account for high-stakes denial of knowledge.

  ## Summary of Tensions
     - The retroactive stakes case challenges all theories. Contextualism and pragmatic encroachment might accept retroactive loss (but at a cost). Knowledge-first avoids it but at the cost of stakes-sensitivity.
     - The biggest tension is between stakes-sensitivity and the stability of knowledge (no retroactive loss without new evidence). This is a major point of contention.

  ## Settled vs. Contested
     - **Settled**: The classic cases show that stakes matter to knowledge attributions (whether due to context or subject's situation). Also, knowledge is not JTB (Gettier cases).
     - **Contested**: Whether stakes affect the truth conditions of knowledge (invariantism vs. contextualism) vs. only the propriety of action. Whether retroactive stakes can affect knowledge is hotly debated.
answer: |-
  A theory linking practical stakes to knowledge must satisfy six core desiderata: handle classic cases, preserve conceptual distinctions, align with psychology, address retroactive stakes, balance non-negotiables versus camp-specific commitments, and resolve tensions—especially retroactive loss versus stakes-sensitivity.  

  **Core Desiderata:**  
  1. **Classic Cases** (non-negotiable):  
     - **Low-stakes bank**: Subject knows the bank is open (justified true belief, low risk).  
     - **High-stakes bank**: Same evidence/subject, but high risk (e.g., mortgage crisis) → knowledge denied.  
     - **Lottery belief**: Belief in losing is rational/justified but not knowledge (salient error risk).  
     - **Stopped clock**: True belief from a broken clock isn’t knowledge (Gettier vulnerability).  
     - *Failure here invalidates the theory*.  

  2. **Conceptual Distinctions** (non-negotiable):  
     - **Knowledge ≠ justified true belief (JTB)**: High-stakes bank shows JTB without knowledge; stopped clock is JTB without knowledge.  
     - **Knowledge ≠ rational acceptance**: Lottery belief is rational but not knowledge.  
     - **Subject-stakes ≠ attributor-stakes**: Must clarify whether stakes are tied to the believer’s context (subject) or the attributor’s context (e.g., a judge). Collapsing these conflates epistemic states with linguistic practices.  

  3. **Psychological Alignment** (non-negotiable):  
     - Must cohere with evidence that humans demand higher evidence thresholds under high stakes (e.g., Tversky/Kahneman on risk aversion) and adjust beliefs conservatively when stakes rise. Contradicting this empirical bedrock undermines credibility.  

  4. **Retroactive Stakes Edge Case** (critical tension point):  
     - *Scenario*: Belief formed in low stakes (e.g., "My car is in A5" when no urgency). Stakes spike retroactively (e.g., urgent medical need). Does knowledge persist?  
     - *Tension*: Denying knowledge implies knowledge is fragile (violates stability intuitions). Affirming knowledge threatens stakes-sensitivity (high stakes now don’t affect past knowledge). No consensus; theories diverge sharply.  

  5. **Non-Negotiables vs. Camp-Specific Commitments**:  
     - **Non-negotiables**: Explaining classic cases, preserving knowledge/JTB distinction, respecting psychology. All camps accept these.  
     - **Camp-specific**:  
       - *Contextualism*: Knowledge attributions vary with attributor’s context (non-negotiable for them).  
       - *Invariantism*: Knowledge itself is stake-invariant; only actionability changes (non-negotiable for purists).  
       - *Pragmatic encroachment*: Subject’s stakes directly affect knowledge (non-negotiable for them).  

  6. **Tensions Between Desiderata**:  
     - **Retroactive loss vs. stakes-sensitivity**: Avoiding retroactive loss (e.g., affirming knowledge persists after stakes spike) weakens stakes-sensitivity. Allowing retroactive loss (e.g., knowledge vanishes) violates knowledge stability. Likely unsatisfiable together without compromising core intuitions.  
     - **Subject-stakes vs. attributor-stakes**: Prioritizing one often collapses the distinction, undermining explanatory scope.  

  **Theory Assessments Against Desiderata**:  
  - **Pure Contextualism** (e.g., DeRose):  
    - ✅ Classic cases: Attributor’s high standards deny knowledge in high-stakes bank/lottery.  
    - ✅ Distinctions: Preserves knowledge/JTB split via context-relativity.  
    - ⚠️ Psychology: Attribution shifts match stake-driven evidence demands, but may not reflect subject’s psychology.  
    - ❌ Retroactive stakes: Attributor’s high stakes *now* deny past knowledge → problematic retroactive loss.  
    - ❓ Subject/attributor stakes: Leans attributor-stakes, risking conflation.  

  - **Invariantist Pragmatic Encroachment** (e.g., Fantl/McGrath):  
    - ✅ Classic cases: Subject’s stakes determine knowledge (low→knows, high→doesn’t). Lottery: High stakes deny knowledge.  
    - ✅ Distinctions: Knowledge ≠ JTB; stakes raise justification thresholds.  
    - ✅ Psychology: Stakes raise evidence needs for belief, aligning with risk-aversion findings.  
    - ❌ Retroactive stakes: Subject’s *current* high stakes revoke past knowledge → retroactive loss. Unstable.  
    - ✅ Subject-stakes: Clear priority.  

  - **Knowledge-First View** (e.g., Williamson, anti-encroachment):  
    - ⚠️ Classic cases: Rejects stakes affecting *knowledge*; explains high-stakes denial as due to actionability, not knowledge. Struggles with lottery (knowledge often denied despite statistical justification).  
    - ✅ Distinctions: Knowledge primitive; JTB insufficient (e.g., stopped clock).  
    - ⚠️ Psychology: Stakes affect action/belief revision, not knowledge → aligns but sidelines epistemic role of stakes.  
    - ✅ Retroactive stakes: Knowledge persists; stakes affect only practical rationality. Avoids retroactive loss.  
    - ✅ Subject/attributor stakes: Distinction maintained; stakes irrelevant to knowledge itself.  

  **Settled vs. Contested**:  
  - **Settled**: Classic cases require stakes-sensitivity in knowledge attributions; knowledge ≠ JTB; psychology shows stakes influence evidence thresholds.  
  - **Contested**: Whether stakes affect knowledge *truth-conditions* (contextualism/encroachment) versus *attributions/actions* (knowledge-first); whether retroactive stakes erase knowledge; subject- vs. attributor-stakes priority. No consensus—contextualism/encroachment dominate but face unresolved tensions.
