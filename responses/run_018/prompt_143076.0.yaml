answer: |-
  Here's a sharp analysis moving beyond the introductory trope, focusing on the nuances of the Hart-Fuller debate within *Antigone*'s specific textual tensions:

  **Beyond the Binary: Procedural Collapse and Moral Entanglement**

  1.  **Creon's Edict: Fuller's Internal Morality Under Siege (Not Just Hartian Immorality):**
      *   While Creon's edict banning Polyneices' burial is substantively abhorrent (fitting Hart's separation thesis, where valid law *can* be immoral), its failure is *also* deeply rooted in violations of Fuller's internal morality *before* the substantive evil becomes fully apparent.
      *   **Specific Scene: Creon's Announcement (Lines 162-210):** Creon *does* promulgate the edict publicly. However, its core flaws are procedural:
          *   **Generality:** It targets a *single, specific, already-dead* individual ("No man shall bury, none shall mourn for him" - 204). It's a bill of attainder, not a general rule. Its application is inherently particularistic and discriminatory.
          *   **Non-Retroactivity:** Polyneices committed his act (attacking Thebes) *before* the edict existed. The edict retroactively declares his *existing* corpse's treatment illegal and punishable by death. Creon is legislating *ex post facto* to condemn a past state of being.
          *   **Constancy/Non-Contradiction (Implied):** It fundamentally contradicts deeply ingrained, long-standing cultural/religious norms (burial rites) that functioned as unwritten, stable "laws" within Theban society. This creates an immediate, unresolvable conflict at the heart of the legal order.
      *   **Why this matters:** The guard's terror and reluctance (Scene 2) stem not *only* from the harsh penalty, but from the edict's *bizarre singularity* and *retroactive cruelty*. Its procedural incoherence makes it feel inherently illegitimate and impossible to administer justly *from the start*, fulfilling Fuller's prediction that such failures lead to law's collapse, even before the moral outrage (Antigone's act) manifests.

  2.  **Antigone's Appeal: Neither Pure Fuller nor Pure Hartian Warning:**
      *   **Fuller's Internal Morality?** Antigone invokes "unwritten and unfailing statutes" of the gods (450-457) against Creon's decree. This is *not* primarily an appeal to Fuller's *procedural* canons (generality, etc.). She appeals to *substantive* divine commands concerning burial rites and familial duty. Fuller's internal morality is about *how* law is made/administered to be *law*, not *what* it must contain. Antigone isn't critiquing Creon's *process* (though it's flawed) but his *content*'s clash with higher-order *substantive* morality.
      *   **Hart's Warning?** Hart *would* see Antigone as collapsing legal validity into morality: she denies the edict's validity *solely* because it conflicts with her moral/religious duty. She embodies the "natural law" position Hart critiques: "This is not law because it is evil."
      *   **The Complexity:** However, Antigone's "unwritten laws" *also* represent a stable, long-standing, *implicitly* "general" norm (applying to *all* corpses/dead kin) deeply embedded in the social fabric – possessing a kind of "constancy" and perceived legitimacy Creon's novel, particularistic edict lacks. The play suggests these "unwritten laws" functioned as a *de facto* legal framework. Her appeal highlights that law's legitimacy often draws on deeper, shared substantive norms, complicating Hart's strict separation. She isn't just invoking abstract morality; she's invoking an *alternative, established normative order*.

  3.  **Sharpest Tensions: Where Form and Substance Collide:**
      *   **Antigone vs. Creon (Scene 2, 441-525):** This is the core clash. Antigone explicitly grounds her defiance in substantive divine law ("I did not think your proclamation strong enough..."). Creon grounds his authority in positivist power ("The man the city sets up in authority..."). Yet, Creon's argument quickly reveals the *substantive* harshness ("An enemy is never a friend, not even in death" - 522) inseparable from his edict's *procedural* flaws (singularity, retroactivity). The scene resists separation.
      *   **Haemon vs. Creon (Scene 3, 631-765):** Haemon argues for flexibility, the will of the people ("The city mourns for this girl" - 733), and the danger of rigidity. This speaks to Fuller's principles of **congruence** (law should match social reality/expectations) and avoiding **impossible demands** (demanding citizens utterly abandon deep-seated religious/familial duty *is* impossible). Haemon warns that Creon's *procedural* source of authority (his decree) is undermined by its *substantive* injustice and inflexibility, leading to a failure of **constancy** (the law destabilizes the social order it should uphold).
      *   **Tiresias vs. Creon (Scene 5, 988-1114):** Tiresias doesn't just declare the edict immoral; he reveals its *consequences*: the gods reject Thebes's sacrifices because its ruler violated fundamental divine order. This blends Fuller (the law creates *incongruence* with the reality it governs, polluting the system) with a substantive natural law view (violating divine command invalidates the ruler's authority/law).

  4.  **Resisting Reduction:**
      *   **Against Simple Fuller:** Creon's edict *does* fail procedurally (generality, retroactivity). However, the play's tragic force arises equally from its *substantive* evil. The procedural flaws *enable* the substantive horror, but the horror is not *reducible* to the procedural flaws. Ismene knew the edict was promulgated and specific, yet tried to share Antigone's guilt later – the substantive moral pull remains powerful even when procedure is (partly) followed.
      *   **Against Simple Hart:** While Antigone embodies the collapse of validity into morality Hart warns against, the play suggests her "unwritten laws" represent a *competing normative system* with its own claim to legitimacy and constancy, not just private morality. Furthermore, Creon's *procedural* failures contribute directly to the edict's instability and unworkability, supporting Fuller's core claim that extreme injustice often arises *alongside* procedural failure; they aren't always separable. Hart might see the procedural flaws as evidence it was barely "law," but the play shows them as inherent *in* Creon's exercise of sovereign power to enact profound substantive injustice.

  **One-Line Summary:** *Antigone* reveals that the collapse of a legal order stems not *merely* from the separation of law and substantive morality (Hart) or the failure of internal procedural virtues alone (Fuller), but from the inextricable entanglement of procedural incoherence, substantive injustice, and the tragic human cost when power ignores the deep normative fabric binding a society.

  This framing emphasizes the play's demonstration that procedural flaws *enable and reflect* substantive evil, and that appeals to higher law challenge not just a law's *content* but the very *source and legitimacy* of the sovereign power making it, pushing beyond both philosophers' more abstract frameworks.
