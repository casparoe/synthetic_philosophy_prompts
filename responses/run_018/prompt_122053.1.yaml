prompt: |-
  I work in infrastructure at a small AI lab and sit in on an alignment reading group. I have no formal philosophy background, so please make the machinery explicit rather than relying on the names of positions I am probably mangling.

  Last week the group got onto acausal trade: the case of two agents who can never exchange a signal — because they sit in causally disconnected regions of spacetime, or in different branches, or one is a simulation running inside the other's model of the world — each deciding whether to pay a real cost to benefit the other, on the grounds that the two decisions are correlated not by causation but by something like logical or algorithmic dependence: both agents are, in the relevant sense, computing the same decision procedure, so if I cooperate, a sufficiently similar counterpart cooperates too.

  Our most theory-minded member said the whole topic is much less exotic than it sounds, because it is really just program equilibrium. His picture: two players submit programs to a referee instead of choosing actions directly. Each program is handed the other program's source code as input and must output cooperate or defect. The referee runs both once, together, with no communication between them. Because a program can inspect the other's source, it can implement something in the neighbourhood of cooperate if and only if I can verify that the other program cooperates with a program with my source; there are fixed points in which both programs cooperate; and so the prisoner's dilemma is dissolved without any causal influence running between the players. He drew two conclusions. The first is deflationary: the acausal in acausal trade is doing no work, what we have is an ordinary mechanism-design result with a self-referential trick in it, and any decision rule that handles the tournament correctly is simply whatever engineering works — no contested theory of rational choice required. The second is practical and aimed at my team: if we want a future system to be able to trade with us acausally, or to be able to predict that we will cooperate with it, then what matters is not adopting some disputed decision theory but publishing a legible, machine-checkable description of our agent's decision procedure — open weights, a formal specification of the policy, a signed commitment that the deployed artifact hashes to the published spec, that kind of work.

  A second member pushed the opposite way. In the tournament, he said, the correlation between the two outputs is thoroughly causal: a referee executes both programs, each program literally reads the other's text, the dependence has an ordinary common cause, and both players are guaranteed to exist, to face the same payoff matrix, and to be written in a notation the other can parse. In real acausal trade — us and a civilization we will never see, or us and a counterpart in another branch — none of that is on offer. So the analogy quietly imports precisely the channel that was supposed to be absent, and it supports neither conclusion.

  I find both stories plausible, and I have a budget question hanging on this, so I would like an actual audit rather than a verdict.

  Please give me: the mapping stated explicitly, as a table of correspondences if that is clearest — what plays the role of the referee, of the submitted program, of the source inspection, of the payoff matrix, of simultaneity, of the self-referential trick by which each program reasons about itself as seen from outside, and of the fixed point; then a separation of the disanalogies that are load-bearable for his two conclusions from the ones that are noise. In particular I want to know what features of the tournament the analogy smuggles into the target: a trusted executor, a shared syntax, guaranteed existence of the counterparty, symmetry of predictive power, full transparency, common authorship or common code.

  I also want three complications addressed, because I suspect they are where the argument actually lives.

  First, a variant I invented and cannot evaluate: a one-way tournament. A publishes its source and B can read it; B's source is sealed, and A receives only a signed commitment — a hash of B's program plus a machine-checkable proof that B cooperates with any program that cooperates with it, produced without revealing the source. Does cooperation still get off the ground when legibility runs in one direction only? If it does not, does that show the tournament needs a common cause that genuine acausal trade lacks? And what would that imply about the case I actually care about, where a far more capable system can predict us and we cannot predict it?

  Second, existence uncertainty. In the tournament both players certainly exist and certainly face the same game. In the acausal case, whether there is any counterparty facing the corresponding decision is itself unknown, and my paying the cost may be correlated with nothing at all, or with a counterparty that takes the benefit and gives nothing back. Is this a distinct problem, or the same problem in a different costume, and does the tournament picture have any way of representing it?

  Third, the practical conclusion on its own terms. Suppose the deflationary story about mechanism design is right, or suppose it is wrong. Either way, is investing in verifiable, published decision-procedure specifications actually justified by acausal-trade considerations, or does that work stand on entirely different and more ordinary grounds — conventional commitment, reputation, contracting with a party that can simulate our source — which would mean the analogy is only incidentally related to why the work is worth funding? I would rather be told that the conclusion is right for the wrong reasons than have it defended where it does not hold.

  Finally, if the tournament is the wrong picture, tell me what a better one would be: another engineering object — a published interface contract that a foreign client may or may not implement, a mutually referential treaty, a compiler that inlines its callers — that carries the real structure better. I do not need citations or further reading; I need the argument, and I need to know which parts of my colleague's case are just naming.
reasoning: |-
  We are going to break down the problem step by step.

  The core debate is about whether the program equilibrium model (the tournament) is a good analogy for acausal trade. The proponent (the theory-minded member) says it is, and that acausal trade is just this mechanism with a self-referential trick. The opponent (the second member) says the tournament model imports causal elements (like a referee and source code inspection) that are absent in real acausal trade.

  We are asked for:
  1. An explicit mapping (table of correspondences) between the tournament and acausal trade.
  2. Separation of disanalogies that are load-bearing for the two conclusions (deflationary and practical) from those that are noise.
  3. Addressing three complications: one-way tournament, existence uncertainty, and the practical conclusion on its own terms.
  4. If the tournament is the wrong picture, suggest a better engineering analogy.

  Let's start with the mapping.

  ### Mapping (Table of Correspondences)

  In the tournament setup:
  - Two players submit programs to a referee.
  - The referee runs both programs, giving each the other's source code as input.
  - Each program outputs cooperate or defect.
  - The payoff matrix is the standard prisoner's dilemma.

  In acausal trade (the target scenario):
  - Two agents in causally disconnected regions (or different branches, etc.) each decide whether to pay a cost to benefit the other.

  We map:

  | Tournament Concept          | Acausal Trade Concept (as per the proponent) | Notes |
  |-----------------------------|---------------------------------------------|-------|
  | Referee                     | The environment / laws of physics / logical structure | The referee is the mechanism that "runs" the agents and enforces the rules. In acausal trade, it's the logical or algorithmic dependence that ensures the correlation. |
  | Submitted program           | The agent's decision procedure / algorithm | In both cases, the agent is implemented by a computational process. |
  | Source code inspection      | The ability to simulate or reason about the other agent | In acausal trade, an agent doesn't literally read source code, but if it can simulate the other agent (or reason about it) then it can predict what the other will do. |
  | Payoff matrix               | The actual payoffs in the real situation | The prisoner's dilemma structure: mutual cooperation is better than mutual defection, but defecting when the other cooperates is best. |
  | Simultaneity                | Logical simultaneity (or same step in computation) | In the tournament, both programs are run at the same time. In acausal trade, the decisions are considered at the same logical time (e.g., both are deciding based on the same information, without one having already acted). |
  | Self-referential trick      | The agent's reasoning about itself from the outside | In the tournament, a program can reason: "If I output cooperate, then the other program (which is similar) will output cooperate." In acausal trade, an agent reasons: "If I cooperate, then my counterpart (which is logically determined by the same process) will cooperate." |
  | Fixed point                 | The equilibrium in which both cooperate | Both models aim for a fixed point where each agent's action is the best response to the other's, leading to mutual cooperation. |

  ### Load-Bearing Disanalogies vs. Noise

  The opponent argues that the tournament has a common cause (the referee) and other features that acausal trade lacks. We must separate which disanalogies break the analogy (load-bearing) and which are incidental (noise).

  **Load-Bearing Disanalogies (if any):**
  1. **Referee as common cause:** In the tournament, the referee is a common cause that runs both programs and provides the source code. In acausal trade, there is no such central coordinator. This is the core of the opponent's criticism.
  2. **Guaranteed existence and same game:** In the tournament, both players exist and face the same game. In acausal trade, there might be no counterparty, or the counterparty might face a different situation.
  3. **Shared syntax and parsing:** In the tournament, each program can parse the other's source code because they are written in a known language. In acausal trade, agents might not be able to interpret each other's decision procedures.
  4. **Full transparency:** In the tournament, each program gets the full source code of the other. In acausal trade, an agent might not have access to the full decision procedure of the other, or it might be too complex to simulate.

  **Noise (incidental disanalogies):**
  - The fact that the tournament is implemented on a computer and acausal trade is in the real world is not by itself a problem. The computational analogy is the point.
  - The use of a prisoner's dilemma is just an example; other games could be used.

  Now, how do these disanalogies affect the two conclusions?

  #### Deflationary Conclusion
  The proponent says: acausal trade is just program equilibrium, so no exotic decision theory is needed.

  If the disanalogies (especially the common cause and guaranteed existence) are too great, then the program equilibrium model does not capture the essence of acausal trade. The opponent argues that without a common cause, the correlation is not there. Therefore, the deflationary conclusion might not hold because the tournament model relies on a causal setup.

  #### Practical Conclusion
  The proponent says: to enable acausal trade, we should publish a legible, machine-checkable description of our decision procedure.

  If the disanalogies (like shared syntax and full transparency) are critical, then publishing our source might not be enough in the acausal case because the other agent might not be able to parse it or might not even exist. However, if the disanalogies are not critical, then publishing the source is indeed the key.

  ### Addressing the Three Complications

  #### 1. One-Way Tournament
  In this variant:
  - A publishes its source and B can read it.
  - B's source is sealed, but A receives a signed commitment (a hash and a proof that B cooperates with any program that cooperates with it).

  Can cooperation still occur?

  In this setup, B commits to cooperating with any program that cooperates with B. Since A can read B's commitment (but not B's source), A can verify that if A cooperates, then B will cooperate (because the commitment says so). Therefore, A should cooperate. This is similar to a promise by B.

  However, note that the commitment must be a zero-knowledge proof or something that does not reveal B's source but still convinces A. If A is convinced, then cooperation can occur.

  Does this show that the tournament needs a common cause? Not necessarily. In this variant, the referee is still there (to run the programs and enforce the commitment), but the information flow is asymmetric. The critical element is that B's commitment is binding and A can trust it. In acausal trade, if one party can make a verifiable commitment (without revealing its entire decision procedure), then cooperation might be possible.

  In the case where a far more capable system can predict us and we cannot predict it: if the capable system can make a commitment that we can verify (like the signed proof) and we publish our decision procedure (so it can predict us), then it can set up cooperation. We don't need to predict it, only to verify its commitment.

  #### 2. Existence Uncertainty
  In the tournament, both players exist and face the same game. In acausal trade, we might be uncertain if there is a counterparty, and if there is, whether it faces the same situation.

  This is a distinct problem. The tournament model does not represent it. However, we can extend the model: imagine that each program is run with a probability that the other program exists. Then the expected utility must account for the probability of existence and the probability that the counterparty cooperates.

  In acausal trade, an agent might only cooperate if it believes the probability of a counterparty existing and cooperating is high enough to justify the cost. This adds another layer of uncertainty.

  The tournament picture does not naturally represent this, but we could design a variant: the referee flips a coin to decide if the other program is present. Then each program must output an action without knowing if the other exists. This becomes a decision under uncertainty.

  #### 3. Practical Conclusion on Its Own Terms
  The question: is investing in verifiable, published decision-procedure specifications justified by acausal-trade considerations?

  Even if the deflationary story is wrong (i.e., the tournament is not a perfect analogy), publishing a legible decision procedure might still be useful for acausal trade. Why?
  - It allows other agents (if they exist and can simulate us) to predict that we will cooperate if they cooperate.
  - Without a legible specification, an advanced agent might not be able to predict our behavior, so it might not cooperate.

  However, the more capable system might be able to predict us even without a published specification (by reverse engineering from our behavior). But publishing a specification makes it easier and more reliable.

  Moreover, there are other reasons for publishing a specification:
  - **Conventional commitment and reputation:** As in the one-way tournament, a commitment (like the signed proof) can be used in causal interactions too.
  - **Contracting with a party that can simulate us:** If we are in a causal relationship with an agent that can simulate us, then publishing our source can help that agent trust us.

  Therefore, the practical conclusion (publishing a machine-checkable specification) might be justified on multiple grounds, including acausal trade. But note: in the one-way case, we don't necessarily need to publish our entire source if we can instead publish a commitment (like the proof in the one-way tournament). However, publishing the source is one way to enable the other party to verify our behavior.

  ### Is the Tournament the Wrong Picture? A Better Analogy?

  The tournament model captures the idea of mutual prediction and commitment, but it does rely on a central referee and full transparency. A better analogy might be:

  **Mutually referential treaty or interface contract:**
  - Each party publishes an interface: "I will do X if you do Y". Then, each can check the other's interface and decide. This is like a public commitment. The execution is not by a referee but by the agents themselves in their own environments.

  **Compiler that inlines its callers:**
  - Consider a compiler that inlines a function. The function's code is inserted into the caller's code. Similarly, each agent might "inline" a model of the other agent into its own decision process. Then, the decision is made by simulating the other. This avoids the referee but requires the agent to have the computational resources to simulate the other.

  However, note that without a referee, we must ensure that both agents are reasoning about each other at the same logical time. This can be achieved by having both agents compute a fixed point of their mutual behaviors.

  A better engineering object might be: **a mutually agreed protocol that is verified by each party independently**. Each party publishes a formal specification of their behavior in response to the other's actions. Then, each party can verify that if they follow the protocol, the other will too. This is similar to a smart contract but without a blockchain (because there's no communication).

  But note: in the acausal setting, they cannot communicate to agree on a protocol. So the protocol must be pre-agreed by design or by common knowledge.

  ### Final Thoughts on the Debate

  - The deflationary conclusion: The tournament is a specific mechanism that uses a causal referee. Therefore, it does not fully capture acausal trade without a common cause. The opponent is right that the analogy imports a causal element. However, the fixed-point reasoning (the self-referential trick) is the core of acausal trade, and it can be applied without a referee if the agents can simulate each other.

  - The practical conclusion: Publishing a legible decision procedure is useful for acausal trade, but it is also useful for other reasons (like causal commitments). The one-way tournament shows that even with asymmetric information, cooperation can occur with commitments. Therefore, the practical conclusion stands, even if the analogy is imperfect.

  ### Summary of Answers

  **Mapping:** As per the table.

  **Load-Bearing Disanalogies:**
  - The referee (common cause) and full transparency are the main disanalogies that challenge the deflationary conclusion. They are less critical for the practical conclusion.

  **Complications:**
  1. **One-way tournament:** Cooperation can still occur with a commitment from B. This does not require a common cause in the same way, but it does require a trusted commitment mechanism. In the acausal trade with a more capable system, if it can provide a verifiable commitment and we publish our source, then cooperation can occur.
  2. **Existence uncertainty:** This is a distinct problem. The tournament does not represent it, but we can extend it. In acausal trade, agents must account for the probability of a counterparty.
  3. **Practical conclusion:** Publishing specifications is justified for acausal trade (to enable prediction by others) and also for other reasons (causal commitments). Therefore, the work stands on multiple grounds.

  **Better Analogy:** A mutually referential treaty or a formal specification of behavior that each party can independently verify. The compiler inlining analogy captures the simulation aspect but still requires computational resources.

  **Verdict on the Budget Question:** The practical work (publishing verifiable specifications) is worth funding, even if the analogy is imperfect, because it enables both causal and acausal cooperation. The deflationary story might be overstated, but the engineering recommendation is sound.
answer: |-
  ### Mapping the Tournament to Acausal Trade
  Below is an explicit table of correspondences between the program tournament (mechanism-design model) and genuine acausal trade. Each row maps a component of the tournament to its proposed analogue in acausal trade, per the theory-minded member's analogy. Critically, this analogy assumes that "logical dependence" in acausal trade functions like source-code inspection in the tournament.

  | **Tournament Component**        | **Acausal Trade Analogue**                                                                 | **Notes** |
  |---------------------------------|-------------------------------------------------------------------------------------------|-----------|
  | **Referee**                     | The logical structure of reality / laws of physics / mathematical universe.               | The referee enforces the rules and simultaneity. In acausal trade, the "referee" is the impersonal fact that both agents are embedded in a consistent logical structure (e.g., same physical laws, same math). |
  | **Submitted Program**           | The agent's decision procedure (e.g., its source code or algorithm).                      | In both cases, this defines how the agent behaves. Publishing specs in acausal trade is like submitting a program. |
  | **Source Code Inspection**      | One agent simulating or logically predicting the other's decision.                        | In acausal trade, agents don't literally inspect code; they use their own cognitive capacity to simulate the counterpart's decision process. |
  | **Payoff Matrix**               | The real-world costs/benefits of cooperation/defection.                                   | Identical: mutual cooperation is better than mutual defection, but defecting while the other cooperates is optimal. |
  | **Simultaneity**                | Logical counterfactual alignment (e.g., "What if we both decide at the same logical time?"). | The tournament forces simultaneity via the referee. In acausal trade, agents assume their decisions are "logically simultaneous" (no precedence). |
  | **Self-Referential Trick**      | An agent reasoning: "If I cooperate, my logically similar counterpart will too."          | Both rely on fixed-point reasoning: each agent's decision is a function of the other's, creating mutual dependence. |
  | **Fixed Point**                 | The Nash equilibrium where both cooperate (e.g., mutual cooperation as the stable outcome). | In acausal trade, this is the state where both agents' decisions are consistent and mutually beneficial. |

  ### Load-Bearing Disanalogies vs. Noise
  The tournament analogy "smuggles in" features absent in genuine acausal trade. **Load-bearing disanalogies** break the analogy for key conclusions; **noise** is incidental and doesn't undermine the core argument.

  #### Load-Bearing Disanalogies (threaten both conclusions)
  1. **Trusted Executor (Referee)**:
     - *Tournament*: The referee guarantees execution, enforces rules, and prevents cheating.
     - *Acausal Trade*: No referee exists. The "logical structure of reality" doesn't actively enforce cooperation; it's passive.
     - *Why Load-Bearing?* Without a referee, there's no guarantee that both agents are evaluated together, or that they share a context. This breaks the fixed-point reasoning. If the deflationary story relies on the tournament being "ordinary mechanism design," but the referee is unique to the tournament, then acausal trade *is* exotic.

  2. **Guaranteed Existence and Symmetry**:
     - *Tournament*: Both players exist, face the same game, and are symmetric (same power, same access).
     - *Acausal Trade*: Counterparties may not exist, may face different games (e.g., different costs/benefits), or may be asymmetric (e.g., one agent is vastly more capable).
     - *Why Load-Bearing?* Existence uncertainty and asymmetry break the fixed point. If I cooperate but my counterparty doesn't exist, I pay a cost for no benefit. The deflationary conclusion ("no contested decision theory needed") assumes symmetry, but real acausal trade may require subjective probabilities over counterparties.

  3. **Full Transparency**:
     - *Tournament*: Each program gets the other's *exact* source code and can parse/execute it.
     - *Acausal Trade*: Agents may not fully understand each other (e.g., due to complexity, obfuscation, or ontological differences). Prediction is imperfect.
     - *Why Load-Bearing?* Source-code inspection enables perfect prediction. In acausal trade, misprediction could lead to defection. The practical conclusion ("publish machine-checkable specs") assumes transparency solves everything, but it might not be sufficient.

  #### Noise (incidental disanalogies)
  - **Common Authorship/Code**: In the tournament, programs may share code; in acausal trade, agents are independent. Not load-bearing—logical similarity matters, not common origin.
  - **Shared Syntax**: Tournament programs use a known language; acausal agents might use different "languages." But if agents can simulate each other (even imperfectly), this is approximable.
  - **Simultaneity Enforcement**: The tournament enforces it via the referee; acausal trade assumes it. This is a difference, but not fatal—logical time can be abstracted.

  #### Impact on Conclusions
  - **Deflationary Conclusion** ("Acausal trade is just program equilibrium"): Undermined by load-bearing disanalogies. The tournament relies on a causal referee and perfect transparency, which acausal trade lacks. Rational choice *is* contested here—e.g., how to handle existence uncertainty or asymmetric power.
  - **Practical Conclusion** ("Publish legible decision specs"): Weakened but not destroyed. Full transparency is load-bearing, but partial legibility might suffice (see one-way tournament below). The core idea—legibility aids prediction—still holds, but with caveats.

  ### Addressing Complications
  #### 1. One-Way Tournament (A publishes source; B commits with a hash/proof)
  - **Does cooperation get off the ground?** Yes, but only if B's proof is truly credible. A sees B's commitment: "I cooperate with anyone who cooperates with me." If A trusts the proof (e.g., via cryptographic verification), A cooperates. B doesn't need A's source because B's commitment is unconditional.  
  - **Does this imply a common cause?** No. The proof/hash replaces the referee by making B's behavior verifiable without execution. This is closer to acausal trade—it removes simultaneity and full transparency.  
  - **Implication for asymmetric capability**: In your case (a superior system that can predict us, but we can't predict it), cooperation is possible if:  
    - The superior system publishes an irrevocable, machine-verifiable proof that it will cooperate if we do (like B's commitment).  
    - We publish our source (so it can predict us).  
    We don't need to predict it—only trust its commitment. This is engineering-feasible (e.g., via zero-knowledge proofs).  

  #### 2. Existence Uncertainty
  - **Is this distinct?** Yes. In the tournament, existence is guaranteed; in acausal trade, it's probabilistic. This isn't the same as the "self-referential trick"—it's about whether there's anyone to trade with.  
  - **Can the tournament model represent it?** Only crudely. You could modify the tournament:  
    - With probability \( p \), the other program exists; with \( 1-p \), it doesn't.  
    - Each program now maximizes *expected* utility. Cooperation requires \( p \times \text{benefit} > \text{cost} \).  
    But this is a band-aid—the tournament doesn't naturally include uncertainty. In acausal trade, agents must incorporate subjective probabilities (e.g., "What's the chance a counterparty exists and is similar enough?"). This *does* require contested decision theory (e.g., updatelessness).  

  #### 3. Practical Conclusion on Its Own Terms
  - **If the deflationary story is right** (tournament = acausal trade): Publishing specs is directly justified. It enables counterparties to simulate you, creating the logical dependence needed for cooperation.  
  - **If the deflationary story is wrong** (tournament ≠ acausal trade): Publishing specs is *still* justified, but for broader reasons:  
    - **Conventional commitment/reputation**: Even with causal interaction, specs let others verify your behavior (e.g., smart contracts).  
    - **Causal trade with simulators**: A powerful agent (e.g., an AI) might simulate your published spec to decide if trading with you is safe.  
    - **Robustness**: Specs reduce ambiguity, making coordination more likely *regardless* of acausality.  
    - **Acausal benefits remain**: Though imperfect, legibility still aids prediction in logical-dependence scenarios.  
    **Verdict**: The work is worth funding, but **not primarily for acausal trade**. It stands on ordinary grounds: commitment, trust, and causal interactions with advanced systems. Acausal trade is a niche bonus. The analogy is "incidentally related"—useful for intuition, but not the core justification.  

  ### A Better Engineering Analogy
  The tournament is flawed because it smuggles in a referee (common cause) and perfect symmetry. A better analogy is:  
  **A mutually referential API contract in distributed systems.**  
  - **Components**:  
    - Two services (Service A and Service B) in isolated networks (no communication possible).  
    - Each publishes an interface specification (e.g., OpenAPI schema) defining:  
      - "If you send me request X, I will respond with Y."  
      - A signed hash of their implementation (to prove adherence).  
  - **How it mirrors acausal trade**:  
    - Service A can simulate Service B's behavior using B's published spec (no source code needed), and vice versa.  
    - Each decides whether to "cooperate" (send a costly request) based on simulating the other's response.  
    - Fixed point: Both send requests iff their simulations predict mutual cooperation.  
  - **Advantages over tournament**:  
    - No referee: Services run independently.  
    - Handles asymmetry: One service can have a simpler/harder-to-simulate spec.  
    - Existence uncertainty: Services can include probabilistic terms (e.g., "I exist with 60% uptime").  
    - Commitment via cryptography: Signed hashes bind implementations to specs, mimicking verifiable proofs.  
  - **Why it's better**: It focuses on *specifications over source code*, avoids a central executor, and allows for probabilistic/imperfect prediction. This is closer to real acausal trade, where agents publish "behavioral interfaces" (e.g., "I cooperate with cooperators") rather than raw algorithms.  

  ### Conclusion of the Audit
  - **Tournament Analogy**: Flawed due to smuggled-in referee, symmetry, and transparency. Weakens the deflationary claim but not the practical recommendation.  
  - **Practical Work (Publishing Specs)**: Justified, but mainly for causal reasons (commitment, verification, safer interaction with advanced AI). Acausal trade is a weak additional argument.  
  - **Recommendation**: Fund the work—it's low-cost/high-reward for general safety—but don't rely on acausal trade as the primary rationale. Use the "distributed API contract" analogy for clearer thinking.  

  **Key Takeaway for Your Budget**: The strongest case for publishing specs is about reducing risk in *causal* interactions with future AI systems (e.g., they simulate your published policy to decide if you're trustworthy). Acausal trade adds speculative upside, but it’s not the foundation.
