  The worlds that matter: for knowing p, we consider nearby worlds where the name is different but she wouldn't mistakenly recall it. For not knowing she knows, we consider worlds where she misremembers but feels equally confident. 

  This case avoids all the banned elements and uses normal memory fallibility. A KK defender might object that if she really knows, she must be able to know she knows. But I think the memory's opacity blocks this - she can't introspect reliability. 

  The crucial feature is the fallibility of memory without external checks. Remove that, and the case collapses. This also touches on luminosity - memory states aren't luminous because we can't always discern their accuracy. 

