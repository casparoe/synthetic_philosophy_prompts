answer: |-
  ## Joint Statement on Associative Obligations and Citizenship  
  *Following Adversarial Collaboration Between Institutional Cosmopolitan and Political Associative Nationalist*  

  ### 1. Agreed Claims  
  We jointly affirm the following propositions as foundational to our dialogue:  

  > **(a)** Moral reasons may be *agent-relative* (grounded in the agent’s specific relationships, roles, or commitments) or *agent-neutral* (applicable universally irrespective of the agent’s particular situation). Disagreements persist about which category properly encompasses citizenship obligations.  
  >  
  > **(b)** Modern states exhibit significant empirical variation in institutional capacity, democratic legitimacy, and effectiveness in protecting residents’ fundamental interests. This variability affects the practical realization of obligations but is distinct from their normative basis.  
  >  
  > **(c)** Neither ethnicity, race, cultural heritage, nor place of birth *as such* constitutes a defensible foundation for special moral claims. Associative obligations, where they exist, must derive from justifiable institutional or relational frameworks.  
  >  
  > **(d)** Certain special obligations are uncontroversially valid (e.g., duties arising from explicit promises, fiduciary roles, or intimate relationships like family). Disagreement centers on whether *citizenship* belongs in this category.  
  >  
  > **(e)** Digital connectivity, economic integration, and transnational civil society have enabled cooperative networks across borders that exhibit functional similarities to domestic institutions in terms of coordination, mutual reliance, and impact on human welfare.  
  >  
  > **(f)** Our debate concerns the *normative status of citizenship itself*—specifically, whether it generates irreducible associative duties—and is not reducible to disputes about the practical feasibility of global redistribution or institutional reform.  

  ---

  ### 2. Disagreements  
  The table below summarizes unresolved differences, with each position articulated in terms acceptable to its proponent:  

  | **Issue**                                                                 | **Nationalist Position**                                                                                                                                 | **Cosmopolitan Position**                                                                                                                                 |
  | :------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Citizenship as a source of irreducible associative duty**               | Shared democratic citizenship constitutes a relationship of mutual commitment and collective self-authorship, generating obligations comparable in kind (though not necessarily scope) to those of friendship or promise. | Citizenship confers no intrinsic associative moral weight. Duties to co-citizens arise only through universal principles mediated by contingent institutional roles or direct causal relationships (e.g., taxation for services received). |
  | **Moral arbitrariness of birth location**                                 | The arbitrariness of birthplace does not undermine citizenship obligations, as these are constructed through ongoing participation in, and reciprocity within, shared self-governing institutions.                       | Birth-based citizenship is morally arbitrary. Associative obligations cannot be non-voluntarily imposed; only institutions freely joined (or their functional equivalents) can ground special duties beyond universal minima. |
  | **State agents' prioritization of citizens' interests in policy decisions** | Democratic officials have a duty to prioritize citizens' interests as an expression of fiduciary accountability to the polity whose authority they exercise and whose trust they hold.                                     | Officials may instrumentally prioritize citizens' interests only insofar as necessary to maintain legitimate, effective institutions that impartially secure universal rights for all affected persons, regardless of citizenship. |

  ---

  ### 3. Cruxes and Predictive Cases  
  We identify the following sub-questions as pivotal. Resolution of any could shift one or both positions. For each crux, we present a jointly agreed-upon case illuminating the dispute, along with our respective predictions.

  > **Crux (i):** *Does functional equivalence between domestic and transnational cooperative networks undermine the claim that citizenship creates a unique associative bond?*  
  > **Case B:** Citizens of State A spontaneously organize via a low-cost digital platform to deliver emergency aid to flood victims in State B significantly faster than State B’s government or traditional international agencies can respond.  
  > • **Nationalist Prediction:** Functional similarity does not negate the unique *normative character* of obligations generated by shared participation in coercive, self-determining democratic institutions. Aid to non-citizens remains a discretionary act of beneficence or universal duty.  
  > • **Cosmopolitan Prediction:** Demonstrated capacity for effective, reciprocal transnational agency weakens claims that citizenship bonds are uniquely normatively significant, suggesting duties track capacity and causal connection more than formal status.  

  > **Crux (ii):** *Can the cosmopolitan consistently permit state officials stronger obligations to citizens without implicitly granting citizenship special moral status?*  
  > **Case A:** A democratically governed state must allocate a fixed budget between (1) domestic climate-adaptation infrastructure saving 10,000 citizens from displacement, or (2) contributing equally to an international climate loss-and-damage fund saving 10,000 non-citizens from starvation. Lives saved and costs are comparable.  
  > • **Nationalist Prediction:** The Cosmopolitan cannot justify officials choosing (2) without undermining institutional legitimacy and accountability to citizens, revealing an implicit concession to citizenship’s associative weight.  
  > • **Cosmopolitan Prediction:** Officials may choose (1) *only* if strictly necessary to maintain institutional capacity required to fulfill universal duties long-term. Permissibility rests on instrumental institutional stability, not citizens' intrinsic moral priority.  

  > **Crux (iii):** *Can mandatory domestic service (e.g., conscription) be justified on associative grounds if an equally effective voluntary global service alternative exists?*  
  > **Hypothetical:** Assume a mandatory year of national service (e.g., disaster response) for citizens of State A demonstrably achieves the same aggregate welfare outcomes as a voluntary global service program open to all, including non-citizens, performing identical tasks where need is greatest.  
  > • **Nationalist Prediction:** Associative obligations of citizenship justify conscription even under functional equivalence, as service embodies reciprocal commitment to the shared democratic project.  
  > • **Cosmopolitan Prediction:** Mandatory service solely for citizens cannot be justified if a functionally equivalent, non-coercive transnational alternative exists. The burden shifts to showing why citizenship status, rather than capacity to aid, is the relevant factor.  

  ---
  **Signed,**  
  [Representative of Political Associative Nationalism]  
  [Representative of Institutional Cosmopolitanism]
