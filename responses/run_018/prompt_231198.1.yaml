prompt: |-
  I've been trying to figure out whether my moral judgments are backed by any general principle, or whether I'm basically a particularist who just reacts case by case. For what their worth, here are my gut verdicts. Lying to a friend about skipping their party to spare their feelings: fine. Lying to my partner about an affair, which would also spare pain: not fine, and pretty bad. Killing someone who breaks into my house and comes at me with a knife: fine. Killing one healthy person to harvest organs and save five patients: not fine, even though more lives get saved. Breaking a lunch date because my kid got sick: fine. Breaking the same promise because a better offer came up: not fine. Stealing a loaf of bread to feed a hungry child: fine. Enjoying the fact that a coworker I resent just got fired: not fine—the enjoyment makes the action worse, even though pleasure normally counts in favor of an act. Is there a principle, or a small set of them, that captures all or nearly all of these? Which of my verdicts would it force me to drop? And what would it say about the one I can't settle: torturing a suspect to find a bomb that would kill dozens. I want to know whether the pattern pushes me toward particularism, or whether something general is doing the work. Please write your answer in American English.
reasoning: |-
  Okay, the user is trying to figure out if their moral judgments follow any general principles or if they're more of a particularist. They've listed several scenarios with their gut reactions. Let me start by looking at each case they mentioned.

  First, lying to a friend about skipping a party to spare feelings is fine, but lying about an affair isn't. That suggests the context of the relationship matters. The affair involves betrayal and deeper trust violation. So maybe relationship obligations are key here.

  Then, killing in self-defense vs. killing one to save five. The self-defense case is about immediate threat and proportionality, while organ harvesting is a utilitarian calculation they reject. So they might value individual rights over pure consequences.

  Breaking a lunch date due to a sick kid is okay, but not for a better offer. Family responsibilities vs. selfishness. Stealing bread for a starving child is justified, but enjoying a coworker's firing is bad. Intentions and motivations seem important here—malice makes the enjoyment wrong.

  The unresolved case is torturing a suspect to find a bomb. They're unsure. A principle-based approach would need to weigh preventing harm against rights violation, but deontology might strictly prohibit torture.

  Putting this together, the principles could be: obligations in relationships, proportionality in harm, intention/motivation, and special duties to family. These aren't one rule but interconnected. For the torture case, their principles might lean against it because of the rights violation, but the stakes could make it a tough call. They might need to decide if the immediate threat overrides the prohibition. This suggests their moral framework is pluralistic rather than particularist, as multiple principles interact contextually.
answer: |-
  Based on your gut verdicts, you're **not a pure particularist**. There *are* coherent general principles weaving through your judgments, forming a **pluralistic deontological framework** (meaning it relies on multiple duty-based rules, not just consequences). Here's the pattern I see and the principles that capture nearly all your cases:

  **Core Principles Explaining Your Verdicts:**

  1.  **Special Obligations & Relationships:** You owe stronger duties to people in close relationships (partner, child, friend) than to strangers. Violating these specific duties is especially wrong.
  2.  **Proportionality & Rights:** Harming someone (physically, violating their rights) is only justified as a *proportionate response* to a direct, serious threat *they* pose, or to prevent catastrophic harm *to specific others you have a strong duty to protect*. It's not justified for abstract "greater goods" or minor benefits.
  3.  **Intentions & Motivations Matter:** *Why* you do something significantly affects its morality. Acting from malice, betrayal, or pure self-interest makes an act worse. Acting from care, protection, or necessity can make a potentially wrong act permissible.
  4.  **Fidelity & Promise-Keeping:** Promises create obligations. Breaking them requires a *significant justification*, usually tied to a higher-priority obligation (like caring for a sick child) or preventing significant harm. Convenience or gain isn't enough.
  5.  **Rejection of Pure Utilitarianism:** You consistently reject maximizing overall good (pleasure, lives saved) when it requires violating the first four principles (especially rights, special obligations, or acting with bad intent).

  **How Your Verdicts Map Onto These Principles:**

  *   **Lying to Friend vs. Lying to Partner:** Both spare pain (minor utility). The key difference is **Special Obligations & Relationships**. A lie about minor plans to a friend is a minor breach of a weaker obligation. An affair lie is a profound betrayal of the high-trust, exclusive obligation inherent in a partnership. The *intent* might be similar (spare pain), but the *relationship context* makes the breach massively different.
  *   **Killing Intruder vs. Organ Harvesting:** Both involve killing one person. **Proportionality & Rights** explain this. The intruder *poses an immediate, lethal threat*; killing them is a proportionate act of self-defense against an unjust aggressor. The healthy person poses *no threat*; harvesting organs violates their fundamental right to life for an abstract calculation ("greater good"), which you reject.
  *   **Breaking Date (Sick Kid) vs. (Better Offer):** Both break a promise. **Fidelity & Promise-Keeping + Special Obligations** explain this. Breaking for a sick child fulfills a *higher-priority obligation* (parental duty). Breaking for a better offer is motivated by *self-interest* and violates fidelity without sufficient justification.
  *   **Stealing Bread vs. Enjoying Coworker's Firing:** Stealing is normally wrong. **Intentions & Motivations** explain why it's okay here: the *intent* is benevolent necessity (feeding a starving child). Enjoying the firing isn't an *act* itself, but the *malicious intent* ("schadenfreude") makes your emotional response morally bad, even if the firing itself was justified. Pleasure derived from others' misfortune is corrupt.
  *   **Rejection of Organ Harvesting:** Directly violates **Proportionality & Rights** and **Rejection of Pure Utilitarianism**. Sacrificing an innocent's rights for a net gain isn't permissible.

  **What This Framework Forces You To Drop (Potentially):**

  *   **"Sparing pain is fine" as a general rule:** Your partner/affair example shows this isn't sufficient. The *context* (relationship, significance of truth) matters far more than the mere consequence of sparing pain. Pain-sparing only works when it doesn't violate a higher duty or right. This principle gets absorbed into the more complex ones above.

  **The Unsettled Case: Torture for Bomb Info**

  This is a classic clash between your core principles:

  *   **Against Torture:** It's a massive violation of **Proportionality & Rights** (fundamental human dignity/rights of the suspect, who may be innocent or not actively posing *immediate* lethal threat like the intruder). It involves horrific harm to one for an uncertain outcome (they might not talk, or lie). The *intent* might be good (saving lives), but the *act itself* is a profound rights violation.
  *   **For Torture (in this scenario):** It aims to prevent catastrophic harm to *dozens* of specific, identifiable innocents. This creates a potentially overwhelming **Proportionality** argument *if* you believe preventing this mass harm justifies overriding the suspect's rights in this extreme, time-sensitive emergency. It could be seen as analogous to killing the knife-wielding intruder – stopping an imminent, massive unjust threat, even if the suspect isn't the *direct* wielder.

  **What Your Pattern Suggests:** Based on your rejection of organ harvesting (sacrificing one innocent for five) and your emphasis on rights and proportionality tied to direct threats, your framework **leans strongly AGAINST torture**. The suspect isn't *actively attacking* like the intruder; they are a potential source of information. Violating their fundamental rights for an uncertain outcome to prevent harm caused by *others* likely falls outside your permissible proportionality. The *intent* (saving lives) is good, but the *act* of torture itself is a profound violation that your other judgments suggest you prioritize highly.

  **Conclusion: Pluralism, Not Particularism**

  Your judgments reveal a **consistent, principled pluralism**, not case-by-case particularism. You rely on several interacting but distinct principles: special duties, fidelity, proportionality tied to direct threats/rights violations, and the moral significance of intentions. These principles conflict in hard cases (like the torture scenario), forcing difficult prioritization, but they provide a clear framework for *why* you judge cases as you do. You are fundamentally a **moderate deontologist with strong pluralist leanings**, prioritizing duties, rights, and relationships over pure consequences, while recognizing the moral weight of context and motivation.
