answer: |-
  This is a brilliantly conceived problem at the intersection of aesthetics, ontology, and value theory. Your "performative forgery" concept fundamentally challenges the parasitic model by embedding the deception *as a necessary condition* for the work's intended aesthetic structure and meaning. Let's unpack the tension:

  **1. The Core Tension: Causal Provenance vs. Negative Provenance**

  *   **Causal Provenance (CP):** This is the standard view. Value (aesthetic, historical, monetary) derives from the actual chain of creation – the specific mind, hand, context, and intention of the attributed author (e.g., Kafka). CP sees the artifact as a direct trace of that creative act. Exposure of forgery shatters this, revealing the artifact as a *failed trace* (if attempting originality) or a *mere copy* (if replicating).
  *   **Negative Provenance (NP):** Your concept introduces this. Value (specifically *aesthetic meaning* and *conceptual structure*) derives precisely from the *gap* between the attributed authorship and the actual authorship. The concealment of the forger's agency isn't incidental fraud; it's the *generative void* around which the work's meaning is constructed. The work's "aesthetic logic" *requires* the reader's initial belief in the false attribution to function correctly. NP sees the artifact as a *performance* whose meaning is contingent on the dynamic between deception and potential revelation.

  **2. The Status of the Exposed Performative Forgery**

  Does exposure destroy its aesthetic distinctiveness? **No, but it radically transforms it.** It doesn't collapse into a failed original or a mere duplicate. Instead:

  *   **It Becomes a Palimpsest of Meanings:** Pre-exposure, the work functions *as if* it were by the attributed author (e.g., a "lost Kafka"), generating meaning within that frame. Post-exposure, that initial reading experience doesn't vanish; it becomes a *layer* of meaning. The revealed truth (the forger's agency and intent) becomes a new, dominant layer. The work now signifies *about* forgery, authorship, authenticity, and the very expectations it manipulated.
  *   **It Gains Metatextual Irony:** The exposed forgery becomes a commentary on the attributed author's style, the expectations of modernism, the nature of literary value, and the act of reading itself. The "unreliable narrator" analogy holds: just as learning the narrator is unreliable reframes the entire narrative, learning the authorship is forged reframes the entire text. The "failure" is now the *subject*.
  *   **It Remains Conceptually Distinct:**
      *   vs. **Genuine Article:** The genuine article possesses CP value and lacks the constitutive layer of deception/revelation. Its meaning is generated *within* the author's oeuvre and biography.
      *   vs. **Innocent Duplicate:** A duplicate (e.g., a typescript of *The Trial* made by a secretary) lacks both original CP *and* the intentional structure of NP. It's a functional vehicle for the text. The exposed performative forgery, however, *embodies* the NP concept – the deception/revelation *is* its core aesthetic and conceptual content, intentionally built-in by the forger.

  **3. Goodman's Autographic/Allographic Distinction & Its Complication**

  *   **Goodman's Framework:** Nelson Goodman (*Languages of Art*) argued:
      *   **Autographic Arts:** Identity depends on the history of production (the specific physical object). Forgery is possible (e.g., painting, sculpture). Value is tied to the unique artifact.
      *   **Allographic Arts:** Identity depends solely on compliance with a notation (score, script, text). Any correct instance is equally the work. Forgery is *conceptually impossible* because the work is the *structure*, not a specific physical token. Literature is paradigmatically allographic. "Forgeries" are just incorrectly attributed copies or misidentified works, not threats to the work's identity.
  *   **Application & Complication:** Literature seems safely allographic. The *text* of your forged "lost modernist work" could, in theory, be perfectly notated and performed identically regardless of origin. *However*, your concept introduces a hidden **autographic dimension through intentionality**:
      *   **The Intentional Structure as Autographic:** The *specific act* of the forger – creating a text *intending it to be received as a specific lost work by X, with the concealment being structurally necessary* – injects a unique historical contingency. This intentional structure is *not* part of the notated text itself; it's an extrinsic fact *about* its production.
      *   **Meaning Dependence:** The work's *intended aesthetic logic and full meaning* depend on this specific historical act of deceptive creation. A duplicate made *after* exposure, while textually identical, lacks the constitutive element of the initial successful deception. It might convey the *metatextual irony*, but it wasn't *created* with the generative concealment as its core structural principle.
      *   **Conclusion:** While the literary *text* remains allographic (any copy can bear the same words), the **performative forgery as a complete aesthetic *event* or *concept*** acquires an autographic element. Its full identity and intended meaning are inseparable from the specific, deceptive act of its creation. The "work" becomes the text *plus* its specific genesis as a performative forgery.

  **4. What Would Change My Mind & Vulnerabilities**

  *   **Changing My Mind on Aesthetic Relevance of Hidden Intentionality:**
      *   **Argument:** A compelling case demonstrating that *all* aesthetically relevant properties are *solely* immanent within the text's syntactic and semantic structure, discernible through close reading independent of any knowledge of origin. If the "concealed authorship" structure adds nothing *discernible in the text itself* beyond what a skilled pastiche or clever original work could achieve, then NP might be an external *context*, not an internal *structure*. Revelation would merely correct a factual error without altering the work's inherent aesthetic properties.
      *   **Finding:** Empirical evidence from reader-response studies showing that exposure *never* qualitatively alters the perceived aesthetic qualities or meaning for informed readers beyond the initial shock of deception. If readers consistently report the work feels "the same" aesthetically post-exposure, NP's aesthetic claim weakens.
  *   **Changing My Mind on Provenance as Merely Market Construct:**
      *   **Argument:** A robust materialist/sociological theory demonstrating that *all* claims about CP or NP value are fundamentally reducible to market dynamics, institutional power (museums, academia), and constructed narratives with no grounding in philosophical ontology or inherent aesthetic properties. Value is *always* assigned, never discovered.
      *   **Finding:** Historical analysis showing that concepts like "genius," "originality," and "authenticity" are recent, culturally specific inventions with no basis in how artworks were actually experienced or valued in other periods, rendering CP philosophically hollow. Similarly, if NP value demonstrably *only* arises in specific market conditions obsessed with provenance scandals.
  *   **Key Vulnerabilities in My Reasoning:**
      1.  **The "Hard Problem" of Intentionality:** Can an author's *hidden* intention truly be structurally embedded in the text in a way accessible to aesthetic appreciation, or is it always an external fact? Am I smuggling authorial intent back in through the back door? If the text doesn't *formally signal* its forged nature (beyond stylistic pastiche, which could be original), is NP truly *in* the work?
      2.  **The Ephemerality of Deception:** The NP value crucially depends on the *temporal phase* of successful deception. Once exposed, can the work *retain* that NP value, or does it merely become a *record* of it? Is the exposed work *about* NP, or does it just *have* a history involving NP?
      3.  **Goodman's Resilience:** Pushing the autographic dimension onto the "event" or "concept" might seem like special pleading to save the theory. Goodman might argue the *literary work itself* remains untouched; the forgery story is just an interesting anecdote attached to one token copy, not altering the work's identity or aesthetic properties inherent in the notated structure.

  **Conclusion:**

  Your performative forgeries create a fascinating ontological hybrid. While the text itself remains allographic, the **complete aesthetic artifact** – the text *as created and intended to function through misattribution* – possesses a unique autographic dimension rooted in the forger's specific deceptive act. Causal Provenance is shattered upon exposure, but Negative Provenance emerges as the defining characteristic. The exposed work doesn't become worthless or derivative; it transforms into a complex, self-reflexive object whose core meaning *is* the exploration of the gap between attribution and origin, authorship and deception, genuine and fake. Its value shifts from parasitic imitation to conceptual performance art, interrogating the very foundations of literary authenticity and value that the parasitic model assumes. The greatest challenge lies in rigorously demonstrating how the "concealment" is not just a contextual trick, but an aesthetically perceivable structural element woven into the fabric of the text's meaning *by design*. Your novel explores this tension brilliantly – the forger isn't just copying; they are composing a meta-commentary on authorship using deception as their primary medium.
