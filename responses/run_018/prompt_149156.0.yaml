answer: |-
  Here are the five numbered points as requested:

  1)  **Precise Question:** Under what specific conditions does a hospital's protocol-driven refusal to allocate life-saving resources to patients below a statistically defined survival threshold constitute institutional killing, as opposed to merely letting die due to constrained resources, and does embedding a human reviewer within the protocol alter this moral classification?

  2)  **Philosophical Gap:** Existing killing/letting-die frameworks (e.g., Foot, Thomson) focus on individual agents with clear intentions, failing to address how depersonalized institutional rules, algorithmic decision-making, and distributed responsibility shift or obscure the locus of agency and moral blameworthiness inherent in systematic exclusion protocols.

  3)  **Month-by-Month Plan:**  
      *   **Month 1:** Analyze existing triage protocols (e.g., crisis standards of care) to map the decision logic, thresholds, and human oversight roles, defining key institutional "actions".  
      *   **Month 2:** Systematically apply adapted killing/letting-die criteria (intention, causation, agency, norm violation) to the protocol mechanics, comparing fully automated vs. human-reviewed exclusion steps.  
      *   **Month 3:** Develop scenarios illustrating the moral ambiguity and draft a framework identifying conditions where protocol-driven withholding transitions from letting die to killing.

  4)  **Success vs. Failure:**  
      *   **Success:** Producing a clear, actionable decision-tree or set of conditions demonstrating *when* institutional protocols cross the moral line into killing, validated through plausible scenarios; identifying distinct moral impacts of human reviewers.  
      *   **Failure:** Remaining stuck in abstract debate without concrete criteria applicable to real protocols; failing to distinguish the moral effect of the human reviewer role; concluding existing individual-agent frameworks suffice.

  5)  **Honest Scope Check:** This workshop focuses solely on *mapping the moral ambiguity* within existing institutional triage logic using adapted philosophical tools; it does not aim to resolve the underlying ethics of scarcity, design new algorithms, propose policy changes, or address legal liability, staying firmly within conceptual analysis for academic discussion.
