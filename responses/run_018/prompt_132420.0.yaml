  I've mostly bought into illusionism about phenomenal consciousness, but not the cartoon version — I mean the stronger claim that there literally are no phenomenal properties, and that the 'what it's like' feeling is just a misformatted self-model: the brain represents it's own access-limits as if they were intrinsic qualities, and because the model can't inspect its own source code, the error is permanently unfixible from the inside. So it's not that consciousness is hidden, it's that the representational vehicle itself manufactures a fake ontology. What would actually count against this? I don't want the usual 'but I can feel it!' objection. I want the hard stuff: which empirical results in consciousness science, which formal arguments about self-representation, or which cases in other domains (maybe artificial systems that lack this misformatting but still behave like us) would be decisive? Rank them from fatal to just awkward. Also, be honest: has this version of illusionism been qualified so much — 'oh it's only the ontology that's illusory, not the reporting' — that it's unfalsifiable? And if so, is that actually a problem for a view of this kind? Please answer in American English.
