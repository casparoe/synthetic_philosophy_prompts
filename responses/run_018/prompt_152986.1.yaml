prompt: |-
  hey can you write a satirical internal memo, about 600 words, from the CEO of a made-up hospital network called VitalEnd Solutions? they're rollling out a 'tiered death certification' program that treats brain death as the 'Premium' package and circulatory death as the 'Basic' package, with different billing codes and family notifcation schedules. the joke should come from actually getting the philosophy right — the memo should accidently expose that brain-dead patients can still have functioning heart and lungs, that the 'whole brain' criterion is kind of arbitrary, and that choosing between neurological and cardiopulmonary criteria is really a hidden value call about whether consciousness or biological integration is what matters. include a section on 'Extended Warranty' for patients who stay on ventilators after being declared dead, and a customer satisfaction survey asking familes whether they felt the death was 'authentic enough'. keep the voice totally deadpan corporate, like real hospital admin speak. don't cite anyone, just build the absurdity out of the concepts themselves.
reasoning: |-
  Okay, the user wants a satirical internal memo from a fictional hospital CEO about a "tiered death certification" program. They're clearly going for dark humor that exposes the absurdities in how we medically define death. 

  Hmm, the challenge here is balancing the corporate jargon with the philosophical undertones. The satire needs to work on two levels: the surface-level hospital admin nonsense (billing tiers! customer surveys!) while subtly revealing that defining death is actually a value judgment, not pure science. 

  Key points to hit:
  - Brain death as "Premium" vs circulatory death as "Basic" (with the joke being that brain-dead patients are biologically more "alive")
  - The arbitrary nature of "whole brain" criteria 
  - Ventilator use as "Extended Warranty" - that's beautifully dystopian
  - The customer satisfaction survey about "authenticity" of death is chef's kiss

  User definitely understands medical ethics - they referenced all the right controversies (consciousness vs biological integration, the Jahi McMath case implications). This isn't just random edginess; there's real knowledge behind the ask. 

  Gotta keep the tone absolutely deadpan. No winking at the audience. The humor comes from the CEO earnestly treating death like a SaaS product rollout. Should borrow phrases from real corporate memos: "streamline operations," "aligned with strategic priorities," "value-added services." 

  Biggest risk is making it too heavy-handed. The memo should accidentally expose the philosophical problems while pretending to be purely technical. Like when the CEO mentions brain-dead patients having "robust cardiovascular function" as a selling point for Premium - that's the gold right there. 

  For the survey questions: "Did the expiration feel authentic?" is perfect. Might add "How would you rate the clarity of our non-viability messaging?" for extra bureaucratic spice. 

  Extended Warranty section writes itself - charging for ventilator time after declaration of death is exactly the kind of late-stage capitalism healthcare satire we need. Should mention the "pre-paid options" for maximum ick factor. 

  Final touch: the CEO's sign-off. "VitalEnd Solutions: Because Every Ending Matters™" - yes, that trademark symbol is essential.
answer: |-
  **INTERNAL MEMO: VITALEND SOLUTIONS**  
  **TO:** All Medical Staff, Billing Departments, and Patient Relations  
  **FROM:** Thaddeus R. Brinkman, CEO  
  **SUBJECT:** Implementation of Tiered Death Certification™ Program (Effective Q1)  
  **DATE:** October 26, 2023  

  ---

  ### **Program Overview**  
  VitalEnd Solutions is proud to announce the rollout of our innovative **Tiered Death Certification™ Program**, designed to enhance operational efficiency, clarify billing structures, and standardize end-of-life protocols across our network. This initiative aligns with our strategic priority to *optimize resource allocation* while offering families *tailored end-of-life experiences*.  

  ### **Tiered Service Offerings**  
  1. **BASIC PACKAGE (Code: VES-DCB1)**  
     - **Criteria:** Circulatory-Respiratory Death (Cessation of heartbeat and respiration).  
     - **Protocol:** Standard 5-minute observation window post-arrest.  
     - **Billing:** Flat fee ($1,250). Expedited processing (certification within 30 mins).  
     - **Family Notification:** Tier 1 (RN-led, scripted call within 15 mins).  
     - **Best For:** Cost-conscious families, uncomplicated exits, or cases with limited insurance coverage.  

  2. **PREMIUM PACKAGE (Code: VES-DCP2)**  
     - **Criteria:** Whole-Brain Death (Irreversible cessation of *all* brain functions, including brainstem).  
     - **Protocol:** Dual-physician evaluation, 12-hour observation window, mandatory confirmatory testing (EEG, cerebral flow study).  
     - **Billing:** Comprehensive fee ($8,900). Covers ancillary diagnostics and specialist consult.  
     - **Family Notification:** Tier 3 (Attending physician + Grief Concierge™, in-person briefing with branded materials).  
     - **Value Proposition:** Despite premium pricing, families gain peace of mind from rigorous neurological validation. *Note: Premium patients often exhibit robust cardiovascular/lung function via ventilator support — a testament to the precision of the diagnosis.*  

  ### **Philosophical Alignment & Operational Clarity**  
  This tiered model acknowledges that "death" is not a monolithic biological event but a *service category* defined by clinical and familial priorities:  
  - **Basic Tier** prioritizes *biological integration* (heart/lung function) as the core indicator.  
  - **Premium Tier** recognizes *consciousness and neural coherence* as the ultimate arbiters of human viability.  

  *Key Insight:* The choice between tiers is not merely clinical but a *values-based decision*. Does the family prioritize the cessation of integrated biology (Basic) or the extinguishment of personhood (Premium)? Our role is to facilitate that choice transparently.  

  ### **Extended Warranty Option**  
  For Premium patients meeting brain-death criteria but maintained on ventilator support (e.g., pending organ procurement, familial logistics, or legal review), we offer **VitaSpan™ Extended Warranty**:  
  - **Coverage:** Ventilator, ICU bed, and metabolic support for 72–168 hours post-certification.  
  - **Billing:** Incremental daily rate ($4,200/day). Pre-paid packages available.  
  - **Benefit:** Families gain flexibility while preserving tissue viability. *Administratively, this reclassifies the patient from "deceased" to "warranted non-viable," streamlining compliance.*  

  ### **Quality Assurance: The "Authentic Passage" Survey**  
  Post-service, families will receive our **VitalEnd Customer Satisfaction Survey**, including critical metrics:  
  > *On a scale of 1–10, how "authentic" did your loved one’s death feel?*  
  > *Did the certification tier (Basic/Premium) align with your expectations of finality?*  
  > *How would you rate the dignity-to-bureaucracy ratio of the process?*  

  Feedback will directly inform our 2024 "Death Excellence" initiative.  

  ### **Implementation Timeline**  
  - **Training:** Mandatory modules on DeathTrak™ software (billing codes, tier flags) due by 11/30.  
  - **Marketing:** Brochures ("Choosing Your Exit Tier: A VitalEnd Guide") in all waiting rooms by 12/1.  
  - **Compliance:** Documentation must specify tier selection rationale (e.g., "Family values neural cessation over cardiopulmonary").  

  ### **Closing Remarks**  
  VitalEnd remains committed to *redefining the mortality landscape*. By commoditizing death certification into scalable, value-driven tiers, we empower families, maximize revenue integrity, and ethically navigate the ambiguities of modern demise. Remember: Not all deaths are created equal — but all can be *optimized*.  

  **In Service to Your Finality,**  
  Thaddeus R. Brinkman  
  CEO, VitalEnd Solutions  
  *"Because Every Ending Matters™"*  

  ---  
  *This memo complies with VitalEnd Policy 7.4.3 (Humor-Free Internal Communications).*
