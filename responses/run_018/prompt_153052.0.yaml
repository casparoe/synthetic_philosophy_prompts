prompt: |-
  You are a professional philosopher specializing in metaethics and evolutionary epistemology. Before giving your final assessment, please take a moment to brainstorm systematically: first lay out an explicit correspondence table, then separate disanalogies that matter for the intended argument from those that do not, and only then evaluate whether the conclusion survives.

  In discussions of evolutionary debunking, a common analogy compares moral cognition to taste preference formation: just as evolutionary biology explains our attraction to sugar without committing us to sugar possessing an objective, mind-independent property of goodness, evolutionary explanations of moral judgment are said to explain those judgments without committing us to objective moral properties. The analogy is typically used to license a specific conclusion—that evolutionary debunking undermines moral realism in the same direct, symmetrical way it undermines any gustatory realism about sweetness, and therefore that moral realists have no special defense against the debunking.

  I want you to audit this analogy carefully, but with one added conceptual layer. Alongside the standard mapping, consider the distinction between calibration tracking (a mechanism shaped to register an independent state of affairs) and ecological attunement (a mechanism shaped to maintain stable coordination within a particular social environment, without requiring correspondence to external moral facts). Some defenders of morality argue that even if moral cognition is fitness-driven, it might be attuned to genuinely stable cooperative structures in the way a thermostat registers temperature, rather than merely projecting preference onto a neutral world.

  Please do the following. First, provide the explicit correspondence table: what in the moral case plays the role of sweetness, the taste receptor, sugar, the evolutionary pressure, and the putative gustatory realist? Second, identify where the mapping breaks—particularly regarding whether moral cognition involves anything analogous to sensory transduction of an external property, whether evolutionary explanations of moral belief are genuinely symmetrical with explanations of taste preference, and whether the calibration-tracking versus ecological-attunement distinction fractures the symmetry the analogy depends on. Third, say what each side of the analogy quietly imports about whether values are projected or detected, and whether those imports are warranted. Fourth, determine whether the conclusion—that evolutionary debunking defeats moral realism as cleanly as it defeats gustatory realism—actually survives once these disanalogies and the attunement possibility are on the table, or whether the analogy was carrying the argumentative load all along. Finally, if the analogy collapses at a critical point, suggest what a better comparison would be for assessing whether evolutionary origins selectively undermine moral knowledge.
reasoning: |-
  Okay, the user is asking me to evaluate an analogy used in evolutionary debunking arguments against moral realism. The analogy compares moral cognition to taste preferences, suggesting that just as evolution explains our attraction to sugar without needing to posit objective "sweetness," it can explain moral judgments without objective moral properties. The user wants me to analyze this analogy thoroughly, considering the distinction between calibration tracking and ecological attunement.

  First, I need to set up a correspondence table to clarify the analogy. The key elements in the taste case are sweetness (the property), taste receptor (the cognitive mechanism), sugar (the object), evolutionary pressure (selection advantage), and gustatory realist (who believes sweetness is objective). For the moral case, I'll map these to moral wrongness, moral intuition, harmful actions, inclusive fitness, and moral realist respectively.

  Now, where does this mapping break? There are several critical disanalogies. Taste perception directly transduces chemical properties through sensory receptors, while moral cognition involves complex social reasoning without clear transduction. The evolutionary pressures differ too - taste preferences respond to immediate physiological needs, while moral judgments help navigate complex social coordination problems that may track real cooperative structures.

  The user specifically wants me to examine the calibration tracking vs. ecological attunement distinction. Calibration tracking would mean moral cognition detects independent moral facts like a thermometer detects temperature. Ecological attunement suggests it's tuned to social environments without corresponding to external facts. The analogy assumes moral cognition is mere attunement like taste, but realists argue it could be calibration tracking instead.

  Each side imports assumptions. The debunker assumes values are projected (like taste preferences), while the realist assumes they're detected. Neither position is proven by the analogy itself. The conclusion that evolutionary debunking defeats moral realism as cleanly as gustatory realism doesn't survive scrutiny because of these disanalogies.

  For a better comparison, I should consider phenomena with both calibration and attunement aspects. Social emotions or predator detection might work better, as they involve tracking real features while being shaped by evolution. This maintains the evolutionary challenge while allowing room for moral realists to argue their case more effectively.

  The user seems deeply familiar with metaethics and wants a rigorous analysis. They're likely preparing for academic work or a philosophical debate. My response needs to be thorough but structured, following their requested steps precisely while offering original insights about where the analogy fails and what might replace it.
answer: |-
  Here's a systematic audit of the evolutionary debunking analogy, incorporating the calibration/attunement distinction:

  ### 1. Explicit Correspondence Table
  | **Gustatory Domain**          | **Moral Domain**                     | **Functional Role**                             |
  |-------------------------------|--------------------------------------|------------------------------------------------|
  | Sweetness                     | Moral wrongness/goodness             | *Putative objective property*                  |
  | Taste receptor (e.g., T1R2/T1R3) | Moral intuition/cognition          | *Detection mechanism*                          |
  | Sugar/nutrients               | Harm/cooperation/social actions      | *Target object/event*                          |
  | Caloric need/reproductive fitness | Inclusive fitness/social stability | *Evolutionary pressure*                        |
  | Gustatory realist             | Moral realist                        | *Defender of objectivity*                      |
  | Preference for sweetness      | Moral condemnation/praise            | *Behavioral output*                            |

  ### 2. Critical Disanalogies & Symmetry Fractures

  **A. Sensory Transduction vs. Social Negotiation**  
  - *Taste*: Direct biochemical transduction (sugar molecules → neural firing).  
  - *Morality*: No physical transduction pathway; involves theory-laden interpretation of social dynamics.  
  - **Why it matters**: Undermines the claim that moral properties are "detected" like sweetness.

  **B. Explanatory Symmetry Breakdown**  
  - *Taste*: Evolution explains preference *and* fully explains why we *only* care about subjective experience (no adaptive need for sweetness-truth-tracking).  
  - *Morality*: Evolution explains why we *have* moral intuitions but *not* necessarily why they couldn't also track mind-independent cooperative facts (e.g., truth-tracking could be fitness-enhancing).  
  - **Why it matters**: Moral cognition may be a *byproduct* of capacities evolved for truth-tracking (e.g., causal reasoning).

  **C. Calibration Tracking vs. Ecological Attunement**  
  - *Calibration possibility*: If moral cognition functions like a thermostat, it may track moral analogs of "temperature" (e.g., welfare optimization thresholds).  
  - *Attunement reality*: Moral norms show radical cultural variability (e.g., honor codes vs. harm principles) unlike thermostatic responses to temperature.  
  - **Symmetry fracture**: Taste is purely attunement (no calibration claim survives), while morality *could* involve calibration (e.g., pain-avoidance mechanisms tracking objective disvalue).

  ### 3. Hidden Imports & Their Warrant

  | **Side**       | **Imported Assumption**           | **Warranted?**                                  |
  |----------------|-----------------------------------|------------------------------------------------|
  | **Debunker**   | Values are *projected* (like taste) | Only if morality lacks causal efficacy beyond attunement – but cooperative gains may require tracking real social facts. |
  | **Realist**    | Values are *detected* (like heat) | Only if moral properties have causal powers – contested in metaethics. |

  - **Unwarranted import by debunkers**: That all adaptive traits must be *merely* attuned (ignoring that truth-tracking is often adaptive).  
  - **Unwarranted import by realists**: That attunement *excludes* calibration (stable social ecologies may instantiate moral facts).

  ### 4. Conclusion Survival Assessment
  **The conclusion does not survive intact.** The analogy fails at three critical junctures:  
  - **Asymmetry in tracking potential**: Moral cognition's role in coordinating complex social behavior creates evolutionary pressure for *accuracy* in ways taste preferences lack (e.g., misjudging alliances vs. misjudging sweetness).  
  - **Calibration possibility**: If moral cognition tracks emergent properties of social ecosystems (e.g., "this norm maximizes welfare in this ecology"), it retains a claim to objectivity *even if evolution shaped the capacity*.  
  - **Overgeneralization**: The analogy assumes *all* adaptive traits are epistemically bankrupt, ignoring that perception and cognition evolved to track fitness-relevant truths.  

  **The argumentative load**: The analogy smuggles in non-naturalism about morality while relying on naturalism about taste. Once the calibration/attunement distinction is introduced, the debunker must show why moral cognition is *necessarily* mere attunement – which the analogy cannot do.

  ### 5. Superior Analogy: **Threat Detection Systems**
  - **Correspondence**:  
    - *External threat* ≈ Moral violation  
    - *Amygdala activation* ≈ Moral intuition  
    - *Evolutionary pressure*: Predator avoidance ≈ Social exclusion avoidance  
  - **Why better**:  
    a) Threat detection involves *calibration* (e.g., correctly identifying snakes) *and* *attunement* (e.g., false positives to rustling grass).  
    b) Admits "detection failure" modes (hallucinations) without undermining entire faculty.  
    c) Allows that evolution *can* shape truth-tracking mechanisms.  
  - **Epistemic implication**: Like threat detection, moral cognition may combine reliable tracking of objective dangers (e.g., betrayal) with adaptive false alarms – requiring calibration through reflection, not wholesale debunking.

  **Final Assessment**: The taste analogy overreaches by ignoring morality's possible dual status as both ecologically attuned *and* calibration-tracking. Evolutionary origins *challenge* moral realism by highlighting possible non-truth-tracking influences, but don't defeat it asymmetrically like gustatory realism, because moral facts (if they exist) could be embedded in the social structures cognition evolved to navigate. A moderated debunking conclusion survives: evolution gives reason for skepticism about *specific, unrefined* moral intuitions, not moral knowledge *tout court*.
