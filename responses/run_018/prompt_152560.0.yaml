  ### Decision Tree: Old-Evidence Problem in Bayesian Confirmation Theory  
  **Case:** An agent has credence 1 in E (e.g., Mercury's perihelion precession) and learns that H entails E (H ⊃ E). Does E confirm H?  

  #### Tree Structure  
  1. **Q1: Is confirmation defined by a belief-change process (diachronic)?**  
     - **Yes** → Go to Q2.  
     - **No** (confirmation is static/synchronic) → Go to Q3.  

  2. **Q2: Before learning H ⊃ E, was the agent certain of H ⊃ E (P(H ⊃ E) = 1)?**  
     - **Yes** → **Leaf (1)**: Old evidence is silent. Prior is E-conditional; no revision occurs.  
     - **No** → Go to Q4.  

  3. **Q4: Does confirmation require counterfactually removing E from the evidence set?**  
     - **Yes** → **Fifth Position: Dual-update**. Confirmation combines (i) counterfactual update on E (addressing propositional oldness) and (ii) actual update on H ⊃ E (addressing explanatory oldness). *Diagnosis: Merely unattractive—mixes counterfactual and actual dynamics without clear Bayesian justification.*  
     - **No** → **Leaf (2)**: The update is the entailment. Learning H ⊃ E is new evidence, allowing E to support H.  

  4. **Q3: How is synchronic confirmation computed?**  
     - **Option A**: Cannot be computed for old evidence → **Leaf (1)** (as above).  
     - **Option B**: Uses an unconditional prior (not conditioned on E) → **Leaf (3)**: Objective logical prior. Support is measured independently of the agent’s state.  
     - **Option C**: Uses the agent’s current credence function → **Leaf (4)**: Confirmation is comparative and atemporal. Old/new evidence identically supports H; the problem confuses dynamics with structure.  

  #### Key  
  - **Leaves**: (1) Silent evidence, (2) Entailment update, (3) Logical prior, (4) Atemporal relation.  
  - **Fifth Position**: Dual-update (non-standard).  
  - **Unseparated Pair**: Leaf (1) is reached via multiple paths (diachronic certainty of entailment or synchronic Option A) but represents the same commitment.  
  - **Unoccupied Combinations**:  
    - *Diachronic + Objective prior*: Combines belief-change with a non-agent-relative prior; incoherent—violates agent-centered Bayesianism.  
    - *Synchronic + Counterfactual removal of entailment*: Requires removing logical knowledge; unattractive—logical truths are inalienable.  

  ---

  **Tree Logic Summary**  
  - Path to **Leaf (1)**: Diachronic (Q1:Y → Q2:Y) or Synchronic (Q1:N → Q3:A).  
  - Path to **Leaf (2)**: Diachronic (Q1:Y → Q2:N → Q4:N).  
  - Path to **Leaf (3)**: Synchronic (Q1:N → Q3:B).  
  - Path to **Leaf (4)**: Synchronic (Q1:N → Q3:C).  
  - Path to **Fifth Position**: Diachronic (Q1:Y → Q2:N → Q4:Y).  

  **Notes**  
  - *Fifth Position*: Splits "propositional oldness" (E in evidence set) and "explanatory oldness" (unknown H ⊃ E link), weighting both in updating.  
  - *Leaf (4) Challenge*: In agent’s current function, P(H|E) = P(H) if P(E)=1; commitment assumes a non-standard measure (e.g., likelihood ratio) but remains a defined position.
