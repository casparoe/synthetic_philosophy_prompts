  Hmm, the user is asking for a teaching plan to explain David Lewis's concept of conventions to cognitive science graduate students. They specifically want to show why evolutionary stability alone isn't sufficient for a convention, countering their biologist friend's view.

  I need to understand what the user needs here. They're leading a 90-minute reading group session for students who know evolutionary game theory and signaling models but have no philosophy background. The goal is to teach Lewis's analysis of convention as having normative weight, distinct from mere evolutionary stability. The user needs a structured plan with dependencies, a good example, misconception handling, and a diagnostic question.

  The key distinction is that Lewis's conventions involve common knowledge, arbitrary alternatives, and normative "ought," whereas evolutionary stability is descriptive. The biologist friend is conflating these, so I need to clarify where the collapse happens: stability doesn't imply normativity.

  For the teaching plan, I'll structure it in steps to build concepts sequentially. Start with coordination problems, then add arbitrary alternatives to show how conventions solve them uniquely. Next, introduce common knowledge to explain why expectations become binding. Finally, bring in normativity as a consequence of the previous elements. This dependency is crucial—reversing it could lead to misconceptions.

  I'll use a cooperative multiplayer game example with roles like healer or tank. This is fresh compared to overused examples like driving. The example must have: coordination (everyone needs roles), arbitrary alternatives (any role set could work), spontaneous emergence (no authority), and normative pressure (newcomers feel they "should" conform). It must lack centralized control to show conventions are bottom-up, and exclude institutional contracts to highlight the social aspect.

  Common misconceptions: First, that conventions require explicit agreements—they don't, so I'll intervene when introducing arbitrary alternatives. Second, that evolutionary stability suffices for convention—this is the friend's error, so I'll address it when normativity is introduced, showing stability alone lacks "ought." Third, that common knowledge involves infinite regress—I'll clarify it's a practical, finite-level belief.

  I'll omit later evolutionary dynamics theories to avoid muddying the core distinction. The diagnostic question should test understanding, not just recall. I'll ask for an evolutionary stable pattern that isn't a convention, probing if they see the absence of normativity.

  Core principle: Normative "ought" emerges from common knowledge in coordination equilibria, not from stability itself. This summarizes the lesson.

  Finally, I'll ensure the plan is engaging and clear, using the game example to make it relatable. This should help the user teach effectively and counter their friend's argument.
answer: |-
  ## Teaching Plan: Lewisian Conventions vs. Evolutionary Stability

  **Target Audience:** Cognitive Science Grad Students (Strong EGT/Signaling, No Philosophy)
  **Goal:** Distinguish Lewisian convention (normative "ought") from evolutionarily stable regularity (descriptive stability).
  **Core Distinction:** Evolutionary stability provides a *mechanism* for sustaining conventions but does not *constitute* the normative dimension inherent in Lewis's analysis.
  **Time:** 90 Minutes

  **I. Building the Lewisian Edifice: Sequential Dependencies (30 mins)**
  *(Justification: Concepts build hierarchically; reversing order risks conflation or misunderstanding, especially collapsing normativity into stability.)*

  1.  **Foundation: Coordination Problems & Equilibrium (10 mins)**
      *   **Introduce:** Pure coordination problem structure (e.g., Meeting in NYC: Grand Central vs. Empire State). Multiple equilibria exist where *everyone* prefers coordinating on *any* equilibrium over *not* coordinating, but may be indifferent *between* equilibria.
      *   **Key:** Focus on the *payoff interdependence* – my best action depends on yours, and vice versa. Define a Coordination Equilibrium (CE): a combination of actions where no one would be better off if *any single individual* acted differently, *given the others' actions*.
      *   **Dependency Justification:** MUST start here. The coordination problem structure is the *raison d'être* for convention. Without multiple potential CEs, there's no need for a convention to select one. Game theory provides the common language. *If skipped, normativity loses its specific context.*

  2.  **The Crucial Twist: Arbitrariness & Alternatives (10 mins)**
      *   **Introduce:** In a coordination problem, there is always at least one *alternative* coordination equilibrium that would have served the purpose *just as well* (e.g., meeting at Empire State instead of Grand Central).
      *   **Key:** This arbitrariness is essential. It means the *specific* solution isn't dictated by the inherent payoffs *alone*; some *selection mechanism* is needed. The solution is contingent.
      *   **Dependency Justification:** MUST follow the coordination problem. Arbitrariness defines the *conventional* aspect. Without viable alternatives, the regularity might be driven solely by inherent payoff superiority (e.g., always eating the most nutritious berry), not convention. *If skipped, convention collapses into any stable solution.*

  3.  **The Social Glue: Common Knowledge & Expectations (7 mins)**
      *   **Introduce:** Agents conform to the regularity *R* (e.g., meeting at Grand Central). They *believe* others conform to *R*. They believe others *believe* they conform to *R*. And so on, to a degree sufficient for practical purposes (Lewis avoids infinite regress via "indicative" common knowledge).
      *   **Key:** This mutual expectation allows each agent to predict others' behavior reliably *and* know that others can predict theirs. It creates a stable basis for action.
      *   **Dependency Justification:** MUST follow arbitrariness. Common knowledge explains *why* agents converge on *this specific arbitrary solution* and *sustain* it. It transforms a possible solution into an expected one. *If introduced before arbitrariness, it might seem applicable to non-conventional stable states.*

  4.  **The Normative Payoff: The Emergent "Ought" (3 mins)**
      *   **Introduce:** Because of the coordination problem, the common knowledge, and the existence of alternatives, agents acquire a *reason* to conform: they *ought* to conform *to R*. Why?
          1.  *Expectation:* Others expect me to conform (based on common knowledge).
          2.  *Coordination Need:* I want to coordinate, and so do others.
          3.  *Arbitrariness:* Conforming to *R* achieves coordination as well as any alternative *A*.
      *   **Key:** The "ought" is conditional/pragmatic: "If you want to coordinate (which you do), and others expect *R*, then you *ought* to do *R*." It's not moral or absolute, but a rational response to the social-epistemic situation.
      *   **Dependency Justification:** MUST be the capstone. Normativity *emerges from* the combination of coordination need, common knowledge, and arbitrariness. It is the *consequence*, not the cause. **Collapse Point:** If normativity is introduced earlier (or equated with stability), it severs the vital link to the specific conditions (arbitrariness, common knowledge) that generate it in the Lewisian sense. Stability alone *lacks* the "because others expect it of this arbitrary type" rationale. *This is where your friend's error occurs.*

  **II. Carrying Example: Raid Roles (20 mins)**
  *(Goal: Illustrate Lewisian structure in a novel, relatable context.)*

  *   **Scenario:** A persistent cooperative multiplayer raid environment (e.g., an MMO dungeon). No central authority assigns roles. Over time, a pattern emerges: Player A (high HP gear) draws monster aggro ("Tank"), Player B (healing spells) focuses on healing ("Healer"), Players C/D (damage spells) focus on damage ("DPS"). Newcomers (Player E) join and observe the pattern.
  *   **Required Features (To Illustrate Lewis):**
      1.  **Coordination Problem:** Success *requires* role coordination. No single player can succeed alone; uncoordinated action leads to failure (wipe). Multiple CEs exist (e.g., Player C could tank, Player B could DPS, etc. – *if* everyone adjusted accordingly).
      2.  **Arbitrary Alternatives:** The *specific* assignment (A=Tank, B=Healer, C/D=DPS) is arbitrary. Many other role distributions could work *just as well* if consistently adopted from the start (e.g., B=Tank, A=DPS, C=Healer). The pattern isn't uniquely optimal based *only* on inherent player stats (though stats may make *this* pattern *easier* to stabilize).
      3.  **Spontaneous Emergence:** The pattern arises from repeated interactions, trial-and-error, or precedent, *not* top-down rules or explicit agreement. It's a *regularity*.
      4.  **Common Knowledge:** Experienced players know the pattern, know others know it, know others know they know it, etc. Newcomers quickly learn it's expected (social cues, chat, observation). This knowledge is practically sufficient for coordination.
      5.  **Normative "Ought":** Player E feels they *should* take the DPS role (if that's the slot open) or adapt their build to fit the missing role. Why? Not *just* because it's stable, but because *others expect it* for coordination, and any other viable pattern would require re-coordination everyone expects *this* one. Conforming avoids chaos/failure.
  *   **Features to Deliberately Lack:**
      1.  **Unique Optimality:** Avoid a scenario where one role distribution is *inherently, overwhelmingly superior* due to game mechanics (e.g., only one class *can* heal). This undermines arbitrariness.
      2.  **Centralized Enforcement:** No guild leader dictating roles. This would mask the spontaneous, self-sustaining nature crucial for convention.
      3.  **Explicit Contract/Rule:** Why avoid this as the parallel? An explicit rule (e.g., "Rule 7: Tanks must wear plate armor") is an *institutional fact*, created by fiat or agreement. It *may* generate an "ought" ("you ought to follow Rule 7"), but this is a *different kind* of normativity (deontic, based on authority/agreement). Lewisian conventions generate a *pre-legal, coordination-based* "ought" arising from mutual expectations in a contingent solution. Using an explicit rule conflates the source of normativity.

  **III. Misconception Map & Intervention (25 mins)**

  1.  **Misconception: Convention Requires Explicit Agreement/Contract.**
      *   **Where it Arises:** Likely when introducing the Raid Example ("But didn't they agree the first time?") or discussing the spontaneity requirement.
      *   **Form in Audience:** Might frame it through costly signaling models of commitment or verbal contracts as the only source of obligation. "How can there be an 'ought' without a prior signaling event establishing commitment?"
      *   **Intervention Point:** Immediately after presenting the Raid Example's spontaneous emergence. **Intervene:** "Notice the key point: the pattern emerged *without* anyone calling a meeting and saying 'Let's assign roles.' Agreements can *create* conventions, but Lewis argues conventions are *more fundamental* – they can arise purely from precedent and mutual adjustment in recurrent coordination problems. The 'ought' comes from the expectations and the coordination need itself, not from a promise made." Point back to the arbitrariness + common knowledge structure.

  2.  **Misconception: Evolutionary Stability is Sufficient for Convention.**
      *   **Where it Arises:** Most likely when introducing the Normative "Ought" or during discussion of the Raid Example's stability. The core challenge.
      *   **Form in Audience:** "If the role distribution is an ESS, it persists. Agents are programmed/best-responding to conform. Doesn't that *mean* they 'ought' to, in the functional sense? What extra does 'normative' add? Stability *is* the norm." May point to EGT models where stability predicts behavior perfectly.
      *   **Intervention Point:** **Crucially, AFTER establishing Common Knowledge and Arbitrariness, but BEFORE or DURING the Normative "Ought" discussion. Intervene Forcefully:** "Evolutionary stability explains *why* the pattern persists once established – it's resistant to invasion by deviant strategies. But does it explain *why Player E feels they 'should' adopt the DPS role*? Stability tells us *that* they will likely conform (descriptively). Lewis asks: *What reason does Player E have?* The reason is: 'Because *everyone expects me* to do this specific thing (DPS) to coordinate, and doing something else (even if stable *if* everyone changed) would violate those expectations and likely cause failure *right now*.' The 'ought' is tied to the *social expectations surrounding this arbitrary choice*, not just the stability of the outcome pattern. An ESS could exist without common knowledge of alternatives or expectations generating this specific reason (e.g., a uniquely optimal foraging path – you 'should' take it because it's best, not because others expect you to take *this specific path* when others are just as good)." **Highlight the Collapse:** Conflating stability with convention erases the specific rationale generated by common knowledge of an arbitrary alternative.

  3.  **Misconception: Common Knowledge = Impossible Infinite Regress.**
      *   **Where it Arises:** When introducing Common Knowledge.
      *   **Form in Audience:** "This requires an infinite tower of beliefs: I believe you believe I believe... That's cognitively implausible!" May cite computational limits.
      *   **Intervention Point:** Immediately during the Common Knowledge explanation. **Intervene:** "Lewis is very clear: he means 'common knowledge *as indicated*' – a *finite* number of levels sufficient for practical purposes in the context. In the raid, Player E sees A tanking, B healing, C/D DPSing. They hear "E, go DPS!" They see others acting confidently. They don't need infinite levels; they see evidence indicating that everyone knows the pattern, knows it's known, etc., *enough* that they can reliably base their action on the expectation that others will follow the pattern. It's a *practical* state of mutually reinforcing expectations."

  **IV. Deliberate Omissions & Reasoning (5 mins)**
  *   **Later Evolutionary Dynamics (Signaling Games, Normative Emergence Models):** **Omit.** While fascinating and relevant long-term, introducing Skyrms-style signaling games or models of how norm-psychology evolves risks *undermining the core distinction* at this stage. These models often aim to *reduce* normativity to evolved behavioral dispositions or stability properties. Your goal is to establish Lewis's *conceptual* distinction *first*. Bringing in these models prematurely invites the conflation you're fighting ("See, stability *does* explain the 'ought'!"). **Reasoning:** Protect the conceptual space. Once Lewis's analysis is solidly grasped, *then* exploring how evolution might produce creatures capable of Lewisian conventions (or challenge aspects of it) becomes productive.

  **V. Diagnostic Question (Check for Understanding) (10 mins)**
  *   **Question:** "Consider a population of birds where a specific, genetically encoded predator alarm call (e.g., a loud 'chirp-squawk') has evolved and is evolutionarily stable. All birds produce this call when seeing a predator, and all birds react appropriately (hide/flee) upon hearing it. Neighboring bird species have different, equally effective, genetically encoded calls. Is this alarm call a Lewisian convention? Why or why not? Specifically, does it generate the specific kind of normative 'ought' Lewis describes?"
  *   **Why it Reveals Understanding:**
      *   **Correct Answer (No):** Recognizes coordination problem (responding to threat) and stability (ESS). *But* identifies the missing Lewisian elements:
          1.  **Lack of Arbitrariness (Key):** The call is *not* arbitrary in the Lewisian sense for *this* population. It's genetically fixed; there are no *behavioral alternatives within the population's repertoire* that could serve the same function. While other species have alternatives, these aren't viable alternatives *for this population*. The 'chirp-squawk' is the *only* solution available to them.
          2.  **Lack of Normative "Ought" Source:** A bird doesn't produce the call *because others expect it to produce this specific call* when alternatives exist. It produces it because it's genetically programmed to do so upon seeing a predator. Others react because they're genetically programmed to react. The "ought" (if any) is purely functional/biological, not based on contingent social expectations surrounding an arbitrary choice.
      *   **Incorrect Answers:** Might focus only on the stability or the coordination benefit, missing the lack of contingency/arbitrariness and the different source of the behavioral imperative. Might confuse species-level differences with individual-level behavioral alternatives within the convention-sustaining group.

  **Core principle:** The normative "ought" of convention is a rational imperative generated solely by common knowledge of expectations within an arbitrary coordination equilibrium, distinct from the descriptive stability explaining its persistence.
