  Okay, the user is a junior in an upper-level seminar on moral change and social norms. They need to design a forty-minute peer-teaching session for undergrads who've only taken intro ethics. Their core thesis challenges the idea that rational argument alone drives moral change, using Bernard Williams and Kwame Anthony Appiah's honor-based framework. They’ve introduced a novel distinction between "argumentative defeat" and "honor depletion," which is clever—it’ll make the session feel fresh, not just a rehash of readings.  

  First, I need to unpack their pedagogical priorities. They’re clearly wary of lecturing and want active engagement, so the plan must prioritize clarity and avoid tangents. Their four requests are tightly scoped:  
  - **Explanatory arc**: Should they start with the intuitive (argument-driven model) or dive straight into honor phenomenology? Risk assessment: If they begin with honor, students might disengage before seeing the puzzle. Better to validate the intuitive view first ("Yes, arguments matter, BUT...") to hook them.  
  - **Anchor example**: Dueling vs. foot-binding. Dueling wins—it’s more relatable (Western context), has explicit codes (seconds, challenges), and economic factors are negligible. Foot-binding has gendered/cultural layers that could derail discussion. Save it as a contrast if time permits, but don’t split focus.  
  - **Misconceptions**: Three big ones:  
    1. *Honor = reputation*: Anticipate this when defining honor worlds. Stress that honor is *constitutive* (your identity hinges on it), not just "what people think."  
    2. *Excuses moral agency*: Preempt during the pivot to honor depletion. Emphasize Appiah isn’t absolving participants but explaining *how* change happened.  
    3. *Requires conscious elite action*: Debunk when discussing the dueling decline’s invisibility. Note that elites didn’t "decide"—they got trapped by shifting visibility.  
  - **Check for understanding**: Need something that forces applying "visibility → cost" causality. A hypothetical works: "Imagine if dueling was suddenly televised. How does that intensify honor depletion?"  
  - **What to omit**:  
    - Williams’ moral skepticism: Too abstract for intro-level.  
    - Modern shaming analogies: Rabbit-hole risk.  
    - Quantitative claims: Unverifiable in 40 mins.  

  Structural tweaks:  
  - **Timing**: 40 mins is tight. Allocate 5 mins for intro, 20 mins for dueling deep dive, 10 mins for Q&A/misconception checks.  
  - **Flow**: Start with a "vote" on why dueling declined (argument vs. social pressure) to surface intuitions. Then dissect why neither fully explains, pivoting to honor depletion.  
  - **Visual**: A simple T-chart comparing argumentative defeat vs. honor depletion could reinforce the distinction without jargon.  

  Biggest risk? Students reducing honor depletion to "peer pressure." The check question must force specificity about *external audiences disrupting internal logic*. Maybe: "Why couldn’t duelists just ignore the public? What did they *lose* by doing so?"  

  Final call: Avoid foot-binding unless as a footnote. Its complexity (pain, gender oppression) could overshadow the honor mechanics. Dueling is cleaner for the core point.
answer: |-
  Here’s a structured teaching plan for your 40-minute session, designed to maximize clarity and engagement while preempting common pitfalls. The arc prioritizes accessibility by starting from shared intuitions and building complexity gradually.

  ---

  ### **Teaching Plan: "Honor Depletion vs. Rational Argument in Moral Change"**  
  **Total Time:** 40 minutes  
  **Anchor Example:** **Dueling in 19th-Century Europe** (Foot-binding reserved for optional contrast).  

  #### **1. Hook: Intuitive Model & Its Limits** (8 mins)  
     - **Opening Question:** *"How do harmful practices like slavery or segregation end? What forces drive change?"*  
       - Elicit responses; expect "moral arguments," "enlightenment," "new laws." Validate these as common explanations.  
     - **Pivot:** "But some practices collapse *without* their practitioners renouncing them. Consider **dueling**: elites killed each other for centuries, then stopped. Did they suddenly realize it was wrong?"  
     - **Key Setup:** Display a quote from a 19th-century duelist (e.g., "I detest dueling but must uphold my honor").  
     - *Why this order?* Starts with familiar "argument-driven" progress narratives, creating cognitive tension when dueling contradicts them.  

  #### **2. Core Concepts: Honor Worlds & Internal Logic** (10 mins)  
     - **Define Honor World:**  
       - A social ecosystem where your worth depends on obeying shared codes (e.g., accepting a duel challenge = honorable; refusing = cowardice).  
       - **Crucial Distinction:** Honor ≠ mere reputation. *Honor is internal to the group’s values*; losing it means becoming a "non-person" within that world.  
     - **Dueling Example Details:**  
       - **Include:** Rituals (seconds, public challenges), social rewards (status, political power), and *internal* justifications (defending integrity, not murder).  
       - **Exclude:** Economic explanations (e.g., industrialization). Stress that duelists were often wealthy; cost wasn’t financial.  
     - **Misconception Alert #1:** *Preempt conflation of honor with reputation* here. Ask: *"If a stranger calls you a coward, is that the same as your peers declaring you dishonorable? Why/why not?"*  

  #### **3. Introducing "Honor Depletion"** (12 mins)  
     - **The Shift:** As societies modernize, honor practices face new audiences.  
       - **Dueling’s Turning Point:** Rise of newspapers, satire (e.g., political cartoons mocking duelists), bourgeois values (productivity > violence).  
     - **Mechanism:**  
       - Practitioners need *external* recognition (e.g., for political careers).  
       - When outsiders see the practice as absurd/barbaric, sustaining honor *internally* requires escalating costs (e.g., dueling risks not just death but public ridicule).  
       - **Honor Depletion Defined:** The practice collapses because maintaining it undermines the very status it conferred.  
     - **Misconception Alert #2:** *Preempt "excuses moral agency"* here. Emphasize: *"Appiah isn’t saying duelists were blameless. He’s explaining why the *system* unraveled despite their beliefs."*  
     - **Misconception Alert #3:** *Preempt "elites consciously abandoned it."* Stress: *"No one 'decided' to end dueling. Elites were trapped—obeying the code made them look worse to audiences they now needed."*  

  #### **4. Contrast: "Argumentative Defeat" vs. "Honor Depletion"** (5 mins)  
     - **Side-by-Side Comparison:**  
       - *Argumentative Defeat:* Insiders persuaded (e.g., abolitionists convince society slavery is immoral).  
       - *Honor Depletion:* Insiders *still* believe in the practice (duelists felt obligated) but external visibility makes it unsustainable.  
     - **Optional Contrast:** *Mention foot-binding* (1 min max) as a parallel case where ridicule by Westerners/urban elites accelerated collapse, but DO NOT delve. Use only if asked.  

  #### **5. Check for Understanding** (3 mins)  
     - **Question:** *"Imagine if 18th-century duels were suddenly live-streamed to the public. How would this accelerate 'honor depletion'? Would rational arguments against violence be necessary?"*  
       - **Goal:** Reveals if they grasp the *dependency*: external visibility → loss of honor’s social value → collapse. Correct answers highlight the *practitioners’ dilemma* (e.g., "Duelists would look barbaric to voters, making dueling pointless").  
     - **Avoid:** Vague nods to "social pressure." Demand specifics about visibility and costs.  

  #### **6. Conclusion & Implications** (2 mins)  
     - **Summary:** Moral change often depends on *social infrastructure* (who sees you, whose judgment matters), not just good arguments.  
     - **Bridge to Broader Themes:** "This shows why moral progress isn’t linear—it’s shaped by material changes like media, urbanization, etc."  

  ---

  ### **What to Omit**  
  1. **Williams’ moral skepticism:** No time to address meta-ethics; focus on mechanism, not philosophy of progress.  
  2. **Modern analogies (e.g., social media shaming):** Avoids over-simplification and anachronism.  
  3. **Quantitative claims:** No data on "rates of change"; this is conceptual.  
  4. **Foot-binding deep dive:** Its gender/colonial dimensions require nuance that distracts from the honor mechanism.  

  ### **Why This Sequence Works**  
  - **Dependency Order:** Starts intuitive → complicates → resolves.  
  - **Anchor Example Strength:** Dueling has clear internal rules, minimal economic interference, and vivid "visibility shifts" (media).  
  - **Misconception Management:** Addresses reductive readings of Appiah *before* they solidify.  
  - **Pacing:** Allocates time to the hinge concept (honor depletion) while keeping tangents at bay.  

  This plan ensures students walk away understanding *why* "rational argument alone" fails to explain cases like dueling—and how honor depletion offers a more compelling lens. Good luck!
