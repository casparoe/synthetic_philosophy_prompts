  The user's reference to Anscombe is crucial. Her protest wasn't just about civilian deaths but about Truman intentionally using civilians as a means to end the war. If the current protocol assumes nukes require such direct intentional authorisation, does that ironically accept Anscombe's premise? But that would be uncomfortable because it makes every nuclear-armed president a potential murderer by her standards.

