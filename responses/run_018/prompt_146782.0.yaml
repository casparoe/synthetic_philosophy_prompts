  ## The Ledger and the Limpet

  The rain on Bryggen Head wasn’t like city rain. It arrived in salt-laden sheets, blurring the stone cottages huddled against the cliffs, turning the narrow lanes into rivulets that chattered towards the grey churn of the North Sea. Aris Mendes pulled his oiled-wool jumper tighter, the familiar scent of fish and damp stone a comfort. His wrist-scanner pulsed faintly green as he passed Old Nan, hunched over her knitting on the covered stoop. A minuscule credit accrued. *Meeting needs*, he thought, nodding to her. That was the point. The old ways – chasing paper notes, banks like insatiable gulls – were gone. Here, life was measured in the tangible: fish hauled, nets mended, bread baked, and the quiet acknowledgement of shared existence, tallied silently by the ubiquitous scanners. *Oikonomia* restored, Aristotle’s ideal: exchange for the sake of the household, the community.

  Aris was a believer. He’d argued passionately for the Attention Credit System (ACS) during the Transition. His cottage, though small, was warm. His larder, stocked through credits earned hauling catches for the communal stores and fixing neighbour’s boats, held enough. He traded surplus mackerel credits for Elara’s sourdough, his watchful nod at young Liam repairing a wall earned him credit towards new netting. It felt *right*. Human. Grounded.

  His partner, Maya, painted. Not landscapes or portraits, but intricate, fleeting patterns in watercolour – swirls of tide-foam, the fractal chaos of lichen on rock. People stopped to watch her work on the harbour wall. Their scanners registered the pause, the focused gaze, transferring micro-credits to Maya. She’d trade them for pigments, paper, sometimes a little salted cod. Aris saw it as beautiful symmetry: her art met a need for beauty; the attention it garnered met their practical needs.

  Lately, however, Maya painted less on the wall. More in their cramped attic, the finished pieces stacked, unseen.

  "Silas offered to ‘stream’ me," she said one evening, her voice tight, staring into the peat fire. Rain lashed the tiny window. "Set up a camera. Said my ‘process’ was ‘undervalued’. That I could ‘scale’."

  Aris frowned, gutting the mackerel he’d earned that day. "Scale? What for? We’ve enough credits for peat, for flour, for mending the roof before winter." He tapped his scanner, showing a comfortable, steady balance. "The system works. We meet our needs."

  Maya traced a knot in the wooden table. "Silas doesn’t talk about needs, Aris. He talks about *portfolios*. About *maximising yield*." Her gaze met his, troubled. "He bought the old lighthouse keeper’s cottage. Not to live in. He’s filled it with screens, showing… I don’t know… kittens? Fast-cut waves? Things people stare at. He ‘employs’ people just to stand and watch them, feeding him credits. He calls it ‘attentional farming’."

  Aris scoffed, wiping fish scales from his hands. "Absurd. Credits are for *exchange*, Maya. For bread and boots. Silas is just… eccentric."

  But the unease lingered. He noticed Silas at the weekly market not bartering for smoked haddock or woollen socks, but scanning clusters of chatting neighbours, his own scanner flashing rapid, complex patterns. Aris saw Elara the baker, usually calm, flustered, baking elaborate, inedible sugar sculptures "to drive engagement". He saw Liam neglecting wall repairs to perform exaggerated stunts on the breakwater, drawing crowds, his scanner humming.

  The realisation came not in a flash, but like the slow, insidious creep of damp. Aris found himself one blustery afternoon walking past Silas’s cottage. Through a high window, he saw the glow of multiple screens. Inside, figures sat motionless in ergonomic chairs, eyes fixed on flickering images, their scanners linked by thin cables to a central console where Silas stood, watching a complex, cascading stream of numbers on a larger screen. His expression wasn’t one of meeting needs. It was the sharp, hungry look of a fisherman spotting a vast, unexpected shoal. Pure acquisition. Numbers for numbers' sake.

  Later, Aris found Maya in the attic, not painting. She was feeding sheets of her intricate, unseen watercolours – months of patient work – into the small stove. The glow lit her face, grim and resigned.

  "Maya! What—?"

  "They’re worth credits, Aris," she said flatly, not looking up. "Silas offered. A lot. More than a year’s fish. But only if I sold him exclusive streaming rights, promised daily ‘content drops’, wore a scanner constantly…" She fed another sheet. The vibrant blues and greens curled, blackened, vanished. "He doesn’t want the art. He wants the *attention* it might generate. It’s just… fuel. For the numbers." She finally looked at him, her eyes reflecting the dying flames. "It’s not about the bread anymore, is it? It’s about the ledger. Growing it. Endlessly."

  The words struck Aris like a physical blow. He thought of his own scanner balance. Comfortable. Secure. Yet, just yesterday, he’d felt a flicker of satisfaction seeing it nudge higher after helping rebuild the storm-damaged community store. Not because he needed anything specific, but just… *because*. The number itself had become the point. A coldness seeped into him, colder than the North Sea wind.

  He walked out onto the headland, the scanner on his wrist suddenly heavy, alien. Below, the sea churned, timeless, indifferent. He thought of Aristotle’s *chrematistics* – the art of wealth-getting divorced from the needs of the household. Money breeding money, endlessly. They’d abolished coin, but not the impulse. They’d digitised attention, quantified human interaction, and the ancient, insatiable hunger had simply found a new form. The ACS wasn’t restoring natural exchange; it was accelerating its perversion. Credits flowed, not to meet the hearth’s warmth or the belly’s hunger, but to feed the abstract, ever-growing hunger of the system itself. Perpetual growth. Detached from use. Governed by a logic Silas understood instinctively: accumulation without limit.

  Maya joined him silently, her hands stained with ash. She didn’t look at her scanner. She looked at the violent, beautiful sea, the gulls wheeling on the wind, the stubborn lichen clinging to the rocks.

  "They still need fish," she said quietly, her voice almost lost in the wind. "They still need bread."

  Aris touched his scanner, the green light pulsing faintly, a silent, relentless count. He thought of Silas’s glowing screens, the hollow eyes of his ‘farmers’, the ash of Maya’s paintings. Needs were still met, yes. But the *purpose*… the purpose had slipped its moorings, drifting into a boundless, chrematistic sea. He shivered, not entirely from the cold. The rain fell, washing the cobbles clean, while the invisible numbers climbed higher and higher in the damp, salt-laden air.
