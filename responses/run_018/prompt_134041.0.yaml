  Okay, the user wants me to explain the Frege-Geach problem using a nested modal-quantifier example instead of the standard conditional. They've provided a specific clause about moral wrongness of necessary actions and embedded it in a belief attribution. 

  First, I need to address whether pure expressivism can maintain compositionality with this embedding. The bottom line is that pure expressivism must either abandon compositionality or relax its pure non-cognitivist stance. 

  Looking at the example: when asserted alone, "it is wrong that, necessarily, every agent acts only if they know they cause harm" expresses a complex non-cognitive attitude (like disapproval of that necessity). But when embedded in "Sarah believes that [clause]", compositionality requires the embedded clause to contribute the same content in both contexts. 

  The problem is stark here because belief attributions are clearly cognitive - they describe psychological states. Expressivism traditionally handles simple moral judgments through non-cognitive attitudes, but this modal-quantifier embedding creates multiple layers: necessity operators, universal quantifiers, and conditional structures within the moral predicate. 

  Blackburn's quasi-realism might try to solve this by saying we're expressing higher-order attitudes toward accepting certain inferential patterns involving the embedded clause. But in this complex modal case, preserving logical consequence relations becomes messy - the inferential commitments would need to track intricate modal logic while remaining purely attitudinal, which seems unsustainable. 

  Gibbard's norm-expressivism could interpret the embedded clause as referring to a system of norms that condemns that necessity. But this effectively treats the moral content as a propositional object of belief, smuggling in cognitive content through the back door. 

  The user specifically asked about which horn of the dilemma does less damage to non-cognitivism. Abandoning compositionality would cripple expressivism's ability to explain moral reasoning and logic. Relaxing purity by allowing some propositional content better preserves explanatory power while maintaining core non-cognitivist insights about motivation. 

  The modal-quantifier example actually intensifies the problem compared to simple conditionals because it involves multiple embedding layers - the necessity operator, universal quantification, and conditional all create additional compositional pressure before we even reach the moral operator. This makes disjunctive attitude solutions even less plausible here.
answer: |-
  **Pure expressivism must abandon compositionality or relax its non-cognitivist purity; disjunctive attitude fixes fail for this modal-quantifier case, and relaxing purity does less damage.**  

  When asserted alone, "It is wrong that, necessarily, every agent acts only if they know they cause harm" (*P*) expresses a non-cognitive attitude (e.g., disapproval of the necessity of this conditional principle). However, embedded in "Sarah believes that *P*," compositionality demands *P* contributes the *same* semantic value in both contexts. The expressivist faces a dilemma:  

  1.  **If *P* expresses an attitude in the belief report:** Belief attributions like "Sarah believes that..." describe a cognitive state directed at *content*. Attributing belief in an *attitude* (e.g., "Sarah believes [my disapproval]") is nonsensical. Sarah's belief must be about *what* is wrong, not the speaker's attitude toward it. Treating the embedded *P* as expressing the attitude fails.  
  2.  **If *P* contributes no attitude/proposition in the belief report:** Then the belief report "Sarah believes that *P*" lacks determinate content – Sarah is described as believing *nothing* identifiable. This violates compositionality, as the meaning of the whole doesn't derive from the meaning of the parts.  

  **Disjunctive fixes fail with modal quantification:**  
  *   **Blackburn-style (Higher-order attitudes):** One might express *acceptance of a norm* prescribing disapproval toward anyone who accepts the necessity of *P*'s content. However, the embedded clause (*P*) involves nested operators: necessity (□), universal quantification (∀), a conditional (→), and the moral predicate (wrong). Preserving the logical relations (e.g., that "□∀x(Ax → Kx)" entails "∀x(Ax → Kx)") requires the higher-order attitude to mimic *propositional* entailment across all these operators. This forces the attitude expressed to track truth-conditional inferences *as if* the content were propositional, effectively smuggling in cognitive content under attitudinal guise. The complexity of the modal-quantifier structure makes this mimicry implausible without collapsing into descriptivism.  
  *   **Gibbard-style (Planning + Descriptive Core):** *P* might express a plan to condemn systems where □∀x(Ax → Kx) holds. In "Sarah believes that *P*," *P* would refer to the *plan-laden content* itself. However, for Sarah to *believe* this plan-laden content requires treating it as a cognitive object (e.g., believing *that such-and-such plan is correct*). This explicitly introduces a proposition (about the correctness of plans/norms), abandoning pure non-cognitivism. The quantificational and modal structure within *P* must then be handled descriptively within this normative proposition.  

  **The Horns & Damage:**  
  *   **Abandoning Compositionality:** This cripples expressivism's core aim of explaining moral *reasoning* and logic. If embedding breaks semantic structure, expressivism cannot account for the validity of arguments involving embedded moral clauses (e.g., modus ponens with complex modal-moral premises). This is fatal to the program.  
  *   **Relaxing Pure Expressivism (Accepting Cognitive Content):** Allowing that embedded clauses like *P* contribute a propositional content (e.g., a normative fact, a plan-property, or a truth-apt state of affairs) in compositional contexts maintains logic and linguistic competence. While this sacrifices *pure* non-cognitivism, it preserves the core *motivational* thesis: the *assertion* of *P* still expresses a non-cognitive attitude distinct from belief in the proposition. This hybrid approach explains compositionality and logic while retaining the anti-realist spirit that moral judgments are fundamentally practical. The damage is less severe; the theory loses purity but gains explanatory power for language and inference.  

  Thus, the modal-quantifier embedding exposes that pure expressivism cannot preserve compositionality without collapsing into or explicitly adopting a form of cognitivism for embedded contexts; sacrificing purity is the less damaging path.
