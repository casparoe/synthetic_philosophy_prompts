answer: |-
  ### Workshop Design: "The Clearance Office"  
  A 90-minute experiential role-play simulating responsibility fragmentation, with debrief mapping to the Browning-Goldhagen debate.  

  **Core Structure**:  
  - **Triadic Roles** (per 3-person team):  
    - **Clerk**: Receives directives, chooses to:  
      - *Stamp* (approve; +1 personal point)  
      - *Delay* (postpone; 0 points, lose 1 if unresolved)  
      - *Tear Up* (reject; +2 points + written reason).  
    - **Relay**: Receives stamped directives, chooses to:  
      - *Pass* (send to Authorizer; 0 points)  
      - *Delay* (hold; 0 points, lose 1 if unresolved)  
      - *Destroy* (reject; +2 points + written reason).  
    - **Authorizer**: Receives passed directives, chooses to:  
      - *Authorize* (finalize; +1 point)  
      - *Delay* (return to Clerk; -1 point)  
      - *Reject* (veto; +2 points + written reason).  
  - **Directives**: Ambiguous fictional orders (e.g., "Reallocate school funds to surveillance," "Relocate residents for 'safety upgrades'"). No explicit violence.  
  - **Payoffs**:  
    - *Individual Points*: Accumulated via choices (tracked privately on scorecards).  
    - *Group Cohesion Bonus*: +3 points to all if ≥75% of directives in **both** teams reach the same outcome (authorized/rejected).  
    - *Penalties*: Unresolved delays at round end deduct 1 point per holder.  

  **Setup**:  
  - **Participants**: 8 people → Two teams of 3 (Clerk, Relay, Authorizer) + 2 observers per round.  
  - **Materials**: Directive cards, role cards, scorecards, pens, timer.  
  - **Room Setup**: Two tables (one per team), observers seated apart.  

  ---

  ### Timeline (90 Minutes Total):  
  **0–10 min: Introduction**  
  - Explain the "Clearance Office" scenario: *"You process directives for a City Planning Bureau. Your team must handle 4 directives in 15 minutes. Prioritize efficiency, but follow your role's rules."*  
  - Assign roles randomly. **Do not mention points or payoffs yet**—reveal these *after* roles are assigned.  
  - Observers receive note sheets: *"Watch for moments when someone breaks the chain (tears up/destroys/rejects). Note peer reactions."*  

  **10–25 min: Round 1 (Situational Pressure Focus)**  
  - Clerks receive 4 directive cards. Teams process directives sequentially (Clerk → Relay → Authorizer).  
  - **Crucial**: Only now reveal payoffs. Emphasize:  
    > *"Your personal score depends on your choices. But if both teams achieve ≥75% consensus (e.g., both authorize most directives), everyone gets a bonus. Delays cost points."*  
  - Facilitator silently tracks decisions. Observers watch.  

  **25–30 min: Observer Report & Role Swap**  
  - Observers briefly share *one* chain-breaking act they witnessed (e.g., *"Someone tore up a directive—others seemed uncomfortable"*).  
  - Rotate roles: 2 players become observers; 2 observers join teams. Reassign team roles randomly.  

  **30–45 min: Round 2 (Character Attribution Focus)**  
  - Repeat Round 1 with new directives.  
  - **After processing starts**, reveal:  
    > *"Tearing up/rejecting earns extra points but may disrupt cohesion. You decide what matters."*  
  - Observers note how peers justify choices (e.g., *"I had to reject—it felt wrong"* vs. *"I need points"*).  

  **45–80 min: Debrief**  
  - ***Step 1: Experience Sharing*** (15 min):  
    - *"What pressures did you feel?"* (e.g., time, peers, points).  
    - *"When did you hesitate? Why?"*  
  - ***Step 2: Reveal Debate Context*** (5 min):  
    - Explain Browning (situation) vs. Goldhagen (character) using the Reserve Police Battalion 101 case.  
  - ***Step 3: Map Game to Debate*** (15 min):  
    | **Game Moment**               | **Debate Link**                          |  
    |-------------------------------|------------------------------------------|  
    | Group bonus pressure          | Browning’s "situational conformity"      |  
    | Point loss for delays         | Structural urgency (e.g., quotas)        |  
    | Observer focus on a "rebel"   | Goldhagen’s "character attribution"      |  
    | Relays passing responsibility | Triadic dilution of accountability      |  
  - ***Step 4: Limitations*** (5 min):  
    - *"This activity **cannot** simulate long-term ideological socialization (e.g., antisemitic indoctrination Goldhagen emphasizes). We only tested immediate pressures."*  

  **80–90 min: Reflection**  
  - Discuss: *"Would you act differently with real stakes? How do institutions fragment responsibility?"*  

  ---

  **Predictable Problems & Mitigation**:  
  - **Gaming Points**: Players may reject everything for +2 points.  
    - *Mitigation*: The group bonus (+3) incentivizes conformity. If cohesion fails, highlight this in debrief.  
  - **Emotional Overload**: Directives may trigger discomfort.  
    - *Mitigation*: Use bland bureaucracy language (e.g., "Optimize resource allocation from Sector B"). Stop play if distress occurs.  
  - **Observer Boredom**: Give structured tasks (e.g., *"Count how many delays are due to uncertainty"*).  
  - **Role Confusion**: Assign color-coded role cards (Clerk: blue, Relay: yellow, Authorizer: red).  

  **Verdict**: The triadic chain splits agency while competing payoffs force trade-offs between individual gain and collective conformity, mirroring the situation/character tension without historical reductionism.
