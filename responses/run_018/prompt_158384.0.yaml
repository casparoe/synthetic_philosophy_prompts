  Then, I should modify the scenario by removing one feature. If the conscripts know the war is unjust but are coerced, McMahan might still see them as non-liable, but Walzer would still grant them combatant status. If the operators are in the combat zone sharing risk, then the risk-based account would classify them as combatants again.

