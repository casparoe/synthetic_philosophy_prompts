prompt: |-
  I've been working through the literature on just war theory for a seminar paper, and I keep getting stuck on the moral equality of combatants—specifically, how it holds up when the usual symmetry conditions are technologically and structurally disrupted rather than merely morally asymmetrical. I'd like you to construct a thought experiment to my specifications.

  Design a single, realistic scenario—no science-fiction, no perfect predictors or demons, translatable to an institutional or workplace analog if needed—in which one state is clearly fighting a just defensive war against an aggressor, but the aggressor's soldiers are all conscripts who have been systematically deceived about the nature of the conflict and genuinely believe they are defending their homeland; meanwhile, the just state's military relies entirely on autonomous weapons systems that make lethal targeting decisions without any human soldier being present in the decision loop or accepting personal risk. Engineer the case so that the standard moral equality thesis—that just and unjust combatants have equal permission to kill each other—appears to collapse in a specific, non-obvious direction: the deceived conscripts seem to lack the moral status of combatants altogether and should be treated more like non-combatants or coerced instruments, while the operators of the autonomous systems on the just side seem unable to claim combatant privilege or moral equality with anyone because they bear no risk and exercise no direct moral agency in the killing. Present the scenario in one paragraph, then walk through what a Walzer-style moral equality account, a revisionist liability-based view (along McMahan's lines), and a pure risk-based account each say about permissions and protections here, and identify precisely which structural feature—deception and conscription on one side, removal of human risk and agency on the other, or their interaction—is doing the philosophical work. Next, show what happens if we remove just one feature: for instance, the conscripts know the war is unjust but remain coerced, or the just side uses autonomous systems but the human operators are physically present in the combat zone and share the risk. Finally, explain how a defender of moral equality would attack the case, and be explicit about where your reasoning is most vulnerable—whether in the analogy between technological absence and moral absence, in treating deception as exculpatory, or elsewhere—and state exactly what argument or counterexample would change your mind about which theory handles the scenario best.
