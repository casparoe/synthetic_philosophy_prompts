answer: |-
  ## The Diachronic Architecture Defense Against Money-Pump Objections

  The canonical money-pump argument stands as a formidable critique of cyclic preferences. If an agent prefers A to B, B to C, and C to A, then a cunning counterparty can offer a sequence of trades: exchanging C for A plus a small payment (exploiting A>C), then B for C plus payment (exploiting B>C), then A for B plus payment (exploiting A>B), leaving the agent back at A but poorer. This cycle can be repeated indefinitely, draining the agent's resources. The conclusion drawn is stark: cyclic preferences render an agent *practically* irrational due to inevitable exploitation, and thus cyclic preferences themselves must be deemed *theoretically* irrational. I contend, however, that this conclusion rests on an unexamined and ultimately indefensible assumption: **synchronic preference unity**.

  The money-pump critique implicitly assumes that preferences are, or ought to be, stable and unified across time. It treats the agent at decision point t1 (choosing A over C), t2 (choosing B over C), and t3 (choosing C over A) as the *same* agent encountering the *same* choice situation. This "synchronic unity" assumption collapses diachronic agency into a single, timeless point of evaluation. It ignores the fundamental reality that agents exist *in time*, and their perspectives, valuations, and even selves can evolve meaningfully between distinct decision epochs. The money pump's power derives precisely from forcing the agent to revisit an *identical* choice node (e.g., holding A) with *reversed* preferences (initially preferring A to C, later preferring C to A). It is this revisitation under preference reversal that enables exploitation.

  To escape this critique without abandoning the possibility of rational preference change, we must distinguish two levels of rational coherence within a diachronic agent:

  1.  **Intra-Epoch Coherence:** *Within* any single, discrete decision epoch (a bounded temporal window where the agent confronts a specific choice set under a stable evaluative perspective), rationality demands the standard axioms of rational choice, including transitivity. Preferences must be acyclic *at that moment*. An agent choosing A over B, B over C, but C over A *within the same epoch* exhibits internal inconsistency, violating the basic requirements of coherent choice under a single set of comparative judgments. This is indefensible irrationality.
  2.  **Inter-Epoch Sovereignty:** *Between* distinct decision epochs, however, the agent possesses sovereignty over her evaluative evolution. Rationality permits bounded shifts in preference orderings across time, provided these shifts are governed by an **explicit, ex-ante fixed transition charter**. This charter is a pre-commitment structure, rationally chosen *before* the sequence of choices begins, which defines:
      *   The sequence of anticipated decision epochs (t1, t2, ..., tn).
      *   The permissible preference structures allowable within each epoch (e.g., ordering Ω1 at t1, Ω2 at t2).
      *   **Crucially, the binding constraints on state transitions:** The charter explicitly prohibits any backward traversal to an *identical* choice situation defined by the *same* state *and* the *same* preference ordering previously held. It locks in the forward trajectory mandated by the charter.

  This architecture dissolves the money-pump threat. Consider an agent whose charter dictates: At Epoch 1 (state S1, holding good A), preferences Ω1 apply: A > B > C. The charter mandates a transition to Epoch 2 (state S2, holding B) upon choosing B over C (paying a small fee ε1). In Epoch 2, preferences Ω2 apply: B > C > A. The charter then mandates a transition to Epoch 3 (state S3, holding C) upon choosing C over A (paying ε2). Crucially, the charter *does not permit* a transition *back* to Epoch 1 (state S1 with preferences Ω1). Instead, in Epoch 3, preferences Ω3 apply: C > A > B. The agent now chooses A over B (paying ε3), transitioning to a *new* epoch, Epoch 4 (state S4, holding A), governed by a *new* preference structure Ω4 (which could be Ω1 again, or something else, as stipulated by the charter).

  The cyclical preference *shifts* (Ω1 -> Ω2 -> Ω3) are permitted by inter-epoch sovereignty, governed by the ex-ante charter. However, the *exploitability* vanishes. The counterparty cannot return the agent to S1 *under Ω1* after she has transitioned through S2 and S3 under Ω2 and Ω3. When the agent arrives at S4 holding A, she is in a *distinct* epoch governed by Ω4, not in S1 governed by Ω1. The charter structurally forbids reopening the Ω1 preference set at state S1. The agent pays fees (ε1+ε2+ε3) for the sequence A->B->C->A, but this is a *single*, chartered path through distinct evaluative states. The counterparty cannot restart the cycle *using the same preference reversals at the same node* because the charter prevents revisiting the *identical* (state + preference set) node. The "pump" is broken after one cycle; unbounded exploitation is impossible by design.

  The anticipated counter-argument is that this merely disguises irrationality through artificial epoch segmentation. If the agent ex-ante charters a path leading her to pay for a net-zero change in holdings (A->B->C->A), isn't this equivalent to cyclicity and thus irrational? The rebuttal lies in the *diachronic intentionality* embedded in the charter. The charter represents a rational, ex-ante plan embracing specific preference evolutions and their costs as part of a valued developmental, experiential, or strategic trajectory. Paying ε1+ε2+ε3 is not "exploited loss" but the *cost of the planned transition* between distinct evaluative states. Crucially, the *intra-epoch* coherence at each step ensures the agent acts rationally *as the self she is at that moment*, guided by the plan she made *as the self she was when she bound herself*. The money pump requires *synchronic inconsistency within a fixed identity*; the diachronic architecture provides *inter-temporal consistency across evolving identities bound by a unifying plan*.

  The normative upshot is profound: Rational diachronic agency does not require timeless preference invariance. It requires coherence *within* temporal slices of agency and a rationally binding structure *between* them that prevents pathological revisitation. Vulnerability to money pumps demonstrates not the inherent irrationality of preference cycles *across time*, but the danger of lacking a binding diachronic architecture that prohibits the backward traversal enabling exploitation. Rationality, diachronically understood, is compatible with planned, chartered revolutions in value.

