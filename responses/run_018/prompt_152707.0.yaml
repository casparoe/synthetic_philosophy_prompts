  But I should consider the counter-argument: that real-world political actors don't have this high level of common knowledge. People might conform to norms out of habit or fear of punishment, not mutual accountability. The epistemic demands might be too high. However, in democratic contexts, norms are often explicitly discussed and reinforced through institutions, speeches, and media. So while it's demanding, it's plausible that second-order accountability exists, especially among elites.

