  Now, applying this to democratic norms. Peaceful concession and loyal opposition are key. In functional democracies, losers concede, winners don't retaliate, and opposition remains loyal. The question is why these norms sometimes collapse. The reflexive framework suggests it's about second-order accountability—participants holding each other responsible for upholding these norms.

