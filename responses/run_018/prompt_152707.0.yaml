  The user might be interested in how this applies to current democratic backsliding. The deeper need is understanding how to protect democratic norms by reinforcing mutual accountability. So emphasizing the framework's diagnostic power makes sense. It explains why institutional mechanisms for accountability (like censure, media scrutiny) are crucial, and why their weakening precedes collapse.

