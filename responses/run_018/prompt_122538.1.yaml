prompt: |-
  I teach a second-year option in formal epistemology: eighteen students, one ninety-minute slot, a whiteboard and a projector, no preparatory reading. Last week they met the Dutch book argument and came away with the impression that probabilism is a theorem about not losing money. My slot has to replace that with the accuracy-first vindication — that credences have a distinctly epistemic utility, that this utility is closeness to the truth, and that an incoherent credence function is thereby accuracy-dominated: some coherent rival is closer to the truth at every single world, with no expectation taken and no money changing hands. I want a plan for teaching that, not the explanation itself.

  Four things I especially need decided.

  What has to be in place before the question "why should your credences satisfy the probability axioms?" even sounds like a question with a non-pragmatic answer. My own diagnosis is that the blockage is the thought that accuracy is all-or-nothing, so that grading a whole credence function for accuracy looks like a category mistake. Tell me if that diagnosis is wrong and what actually has to come first.

  The one example that carries the session. It has to be small enough that the class can compute every relevant number in full, more than once, at the board, and the credence function that gets dominated has to be one a real person would adopt rather than a straw man.

  Where the measure of accuracy enters, and how the class is made to see that it is not arbitrary. I do not want to name the quadratic score and let authority do the work. I want them to try the obvious alternative — add up the absolute distances from the truth values — and watch it make certainty optimal whatever you believe. Then I need to know what to say to the student who asks whether the domination result survives a switch to the logarithmic score.

  There is a complication I have to handle rather than dodge. The department grades its forecasting exercises with what a colleague calls the conviction score: you assign probabilities summing to one across a list of mutually exclusive outcomes, and your mark is the probability you gave the outcome that occurred minus the largest probability you gave any outcome that did not occur. It rewards calling it right decisively. I have half-convinced myself that with two outcomes it makes extremism optimal whatever you actually believe — back your favourite to the hilt — but I cannot tell whether that is an artefact of there being only two outcomes or the real defect, and I am not going to assert either in front of them. Settle it; decide whether the conviction score is the best available foil for the real thing or a distraction to be discarded for the day; and, if you keep it, place it to the minute.

  Misconceptions I expect, in no particular order: that the accuracy-first argument is the Dutch book argument with the money deleted; that if truth is the only epistemic good then accuracy must favour extreme credence; that the quadratic measure is a bare stipulation; and that the domination result vindicates more than coherence, when on its own it says nothing about responding to evidence. Where in the sequence each must be headed off, and which has to be pre-empted before it can even form.

  I know I will have to refuse three things openly: the lemma behind the domination result (I will assert it, not prove it), the question of which among the strictly proper scores is the correct one, and anything involving chance and credence. Tell me what else I should be refusing, and where in the sequence to say out loud that I am refusing it. The last ten minutes must leave them seeing that vindicating coherence is not the same as vindicating conditionalization; tell me what that closing move depends on.

  Commit to one plan: one example, one measure, one order, one place for each misconception, one minute count. Where you think my framing is mistaken, give me your judgement and the correction rather than a menu of alternatives with their costs and benefits. Assume no library and no internet on my side, and do not give me a reading list.

  Give the plan as a single markdown table, one row per step, with exactly these columns: `step` (a number and a five-to-eight-word label), `minutes` (cumulative), `move` (the thing said or put on the board, in one sentence), `needs` (which earlier step this rests on, and what breaks if I skip it), `misconception_closed` (the exact wrong thought this step forecloses, or an em dash), `check` (the one question or board vote that shows me whether it has landed).

  After the table, a single JSON object with exactly these keys: `carrying_example`, `example_rejected` (what you considered and dropped, and why), `scoring_rule`, `conviction_score_verdict` (one sentence: proper or not, and the shortest computation that settles it), `refusals` (array), `why_not_just_dutch_book` (one sentence for the student who asks), `coherence_vs_updating` (one sentence for the last ten minutes), `biggest_risk` (what is most likely to go wrong when I run this). One definite value per key, no options offered, and your reasons inside the values where they fit.

  Write in British English.
reasoning: |-
  We are designing a single 90-minute session to transition students from a Dutch book understanding of probabilism to an accuracy-first vindication. The goal is to emphasize that credences have an epistemic utility (closeness to truth) and that incoherent credences are accuracy-dominated without any expectation or money involved.

  Key requirements:
  - The blockage: Students may think accuracy is all-or-nothing, so we need to establish that credence functions can be graded for accuracy.
  - One example: Must be small (computable on the board), and the dominated credence function should be one a real person might hold.
  - Measure of accuracy: Introduce the quadratic scoring rule (Brier score) and contrast with absolute distance (which makes certainty optimal). Address whether the result holds for logarithmic score.
  - Handle the conviction score: Used in the department for forecasting. We must decide if it's a proper scoring rule and whether to use it as a foil.
  - Misconceptions to address:
    1. Accuracy-first is just Dutch book without money.
    2. If truth is the only epistemic good, then extreme credence is favored.
    3. Quadratic measure is arbitrary.
    4. Domination result vindicates more than coherence (e.g., responding to evidence).
  - Refusals: We will refuse to prove the domination lemma, discuss which proper score is correct, and anything about chance and credence. Also, we must explicitly refuse other things that come up and end by distinguishing coherence from conditionalization.

  Plan:
  We need to structure the session step by step. The example must be simple. Let's use a proposition and its negation (two possible worlds). The credence function we will show as dominated is one that violates additivity, e.g., assigning 0.6 to A and 0.5 to not-A (so total 1.1). This is a real mistake people make.

  For the conviction score: With two outcomes, let the outcomes be A and not-A. The conviction score for a probability distribution (p, 1-p) would be: if A occurs, then your score is p - max(probability given to not-A) = p - (1-p) = 2p-1. If not-A occurs, then your score is (1-p) - max(probability given to A) = (1-p) - p = 1-2p. Now, if you are a true believer in A (p=1), then if A occurs you get 1, if not you get -1. But if you are uncertain (say p=0.6), then if A occurs you get 0.2, if not you get -0.2. However, note that the expected score from the perspective of someone with true belief q in A: 
    E[score] = q*(2p-1) + (1-q)*(1-2p) = 2q p - q + 1 - q - 2p + 2q p = 4q p - 2q - 2p + 1.
  This is linear in p, so it's maximized at p=1 if q>0.5 and p=0 if q<0.5. Therefore, it encourages extremism regardless of your true belief. This is a defect. We can use this as a foil to show that not every scoring rule is proper. We'll keep it for the session because it's used in the department and shows why we need a proper rule.

  Session Outline:

  We break the 90 minutes into steps. We start by setting up the idea of epistemic utility and then move to the example.

  Step 1: Set the stage. Remind them of Dutch book and then pivot to epistemic goals.
  Step 2: Introduce the idea of graded accuracy. Show that we can measure how close a credence is to the truth (0 or 1) by a distance measure.
  Step 3: Try absolute distance. Show that it leads to favoring extreme credences (0 or 1) even when you are uncertain. This is bad because then you are not being honest about your uncertainty.
  Step 4: Introduce quadratic scoring rule. Show that it doesn't have the same problem: it rewards being calibrated.
  Step 5: Define accuracy for a whole credence function. We are going to look at two worlds (A true and A false) and see what the accuracy is in each.
  Step 6: Present a non-probabilistic credence function: c(A)=0.6, c(not-A)=0.5. This is incoherent because they don't add to 1. We compute its accuracy in both worlds using the quadratic score.
  Step 7: Show a coherent rival: c'(A)=0.55, c'(not-A)=0.45? Actually, we need to choose a coherent function that dominates. We can use the normalization: c*(A)=0.6/(0.6+0.5)=6/11≈0.545, c*(not-A)=5/11≈0.455. But actually, the standard move is to use the coherent function that is the normalization? However, in the accuracy argument, the dominating credence is usually the projection onto the set of coherent credences. But we can compute for both worlds and show that the coherent one is better in at least one and not worse in the other? Actually, we need strict domination? No, we need that for every world, the coherent one is at least as good and in some better. But we can choose a coherent one that strictly dominates.

  Actually, for the quadratic score, the incoherent credence function is dominated by the coherent one that is the normalization? Let me check:

  Let the credence function be b = (b1, b2) for A and not-A. The quadratic score in world i is: 
    - (1 - b_i)^2 - (0 - b_j)^2   for j≠i? Actually, we have two propositions: A and not-A. In world where A is true, the truth values are (1,0). The score is the sum of squared errors: (1-b1)^2 + (0-b2)^2.
  Similarly, in world where not-A is true: (0-b1)^2 + (1-b2)^2.

  Now take an incoherent b: (0.6, 0.5). Then:
  In A-world: (1-0.6)^2 + (0-0.5)^2 = 0.16 + 0.25 = 0.41.
  In not-A-world: (0-0.6)^2 + (1-0.5)^2 = 0.36 + 0.25 = 0.61.

  Now consider a coherent credence: we can take one that is the normalization: (0.6/(0.6+0.5), 0.5/(0.6+0.5)) = (6/11, 5/11) ≈ (0.545, 0.455). Then:
  In A-world: (1-0.545)^2 + (0-0.455)^2 ≈ (0.455)^2 + (0.455)^2 ≈ 0.207 + 0.207 = 0.414? That's worse than 0.41? That can't be dominating.

  Ah, I see. Normalization does not necessarily dominate. We need a different coherent function. The standard result is that any incoherent credence is dominated by a coherent one. We can choose the coherent credence that matches the incoherent one in the ratio? Actually, we can use the credence that minimizes the distance? But we need to compute one that dominates.

  Alternatively, we can use the credence that sets the probabilities to the normalized values? But that doesn't dominate. We need to choose a coherent function that is closer to the truth in every world.

  Let me compute the quadratic scores for the incoherent (0.6,0.5) and for the coherent (0.6, 0.4) [which is the same as (0.6,0.4) because then they add to 1]. Then:

  Incoherent (0.6,0.5):
    A-world: (1-0.6)^2 + (0-0.5)^2 = 0.16+0.25=0.41
    not-A-world: (0-0.6)^2 + (1-0.5)^2 = 0.36+0.25=0.61

  Coherent (0.6,0.4):
    A-world: (1-0.6)^2 + (0-0.4)^2 = 0.16+0.16=0.32
    not-A-world: (0-0.6)^2 + (1-0.4)^2 = 0.36+0.36=0.72

  In the A-world, 0.32 < 0.41 -> better. In the not-A-world, 0.72 > 0.61 -> worse. So not dominating.

  We need a coherent function that is better in both. How about (0.55,0.45)?

  Compute for (0.55,0.45):
    A-world: (1-0.55)^2 + (0-0.45)^2 = (0.45)^2 + (0.45)^2 = 0.2025*2 = 0.405
    not-A-world: (0-0.55)^2 + (1-0.45)^2 = (0.55)^2 + (0.55)^2 = 0.3025*2 = 0.605

  Compare to incoherent (0.6,0.5): 0.41 and 0.61. Then 0.405 < 0.41 and 0.605 < 0.61. So yes, (0.55,0.45) strictly dominates (0.6,0.5) in both worlds.

  So we can use (0.55,0.45) as the dominating coherent function.

  Now, the example: We have two propositions: A and ~A. The student has credences (0.6, 0.5). We show that the coherent credence (0.55,0.45) has better accuracy no matter what the truth is.

  Steps:

  1. (0-5 min) Introduction: Recap Dutch book as a pragmatic argument, then ask: "But is there a purely epistemic reason to have coherent credences?" Introduce the idea that we care about having accurate credences, and that accuracy might be graded.

  2. (5-15 min) Graded accuracy: We measure how close a credence is to the truth (0 or 1). We try absolute distance. For a single credence: if you assign 0.6 to A, and A is true, then absolute inaccuracy is |1-0.6|=0.4. If A is false, |0-0.6|=0.6. Now, if you are certain (1) and right, then inaccuracy=0; if wrong, 1. But if you are uncertain, you get something in between. But now, we want to assign a score to the whole credence function.

  3. (15-25 min) Absolute distance for the whole function: Take c(A)=0.6, c(~A)=0.4 (coherent). In A-world: |1-0.6| + |0-0.4| = 0.4+0.4=0.8. In ~A-world: |0-0.6|+|1-0.4|=0.6+0.6=1.2. Now take a coherent extreme: c(A)=1, c(~A)=0. In A-world: 0+1=1? Wait: |1-1|+|0-0|=0. In ~A-world: |0-1|+|1-0|=1+1=2. But now take an incoherent one? Actually, we want to show that absolute distance doesn't work. We show that if you are uncertain, you can always do better by going extreme? Actually, we show that for any coherent credence that is not extreme, there is an extreme one that is better in one world. But we want to show that absolute distance encourages extremism. We can compute the expected absolute inaccuracy from the perspective of the agent's own credence? But we don't want to use expectation. Instead, we can note that in any world, the absolute inaccuracy of a coherent credence function is at least 1? Actually, we can show that the minimum inaccuracy for a world is achieved by extreme credences. For example, in A-world, the best credence function is c(A)=1, c(~A)=0, with inaccuracy=0. But that is not unique? Actually, any function with c(A)=1 and c(~A)=x has inaccuracy |1-1|+|0-x|= |x|? Not necessarily 0. Only when x=0. So in A-world, the minimal absolute inaccuracy is 0, achieved by (1,0). Similarly, in ~A-world, by (0,1). Therefore, if you care only about absolute distance, then to minimize the worst-case inaccuracy, you might be driven to extremism. But more simply, if you are not an extreme believer, then in the world that turns out to be true, your inaccuracy is higher than the extreme believer who got it right. So to avoid that, you might be tempted to be extreme. But that is not honest. So we need a different measure.

  4. (25-35 min) Quadratic scoring rule. For a single credence, the quadratic inaccuracy for a true proposition is (1-b)^2, for false is (0-b)^2. Then for a whole function, we add them up. We show that for coherent credences, the quadratic score does not have the same problem: being certain when you are wrong is heavily penalized. We can show that for a proposition you are uncertain about, the quadratic score rewards being calibrated. For example, if A is true, then having b=0.6 gives (1-0.6)^2=0.16, while having b=1 gives 0? But if you are wrong, having b=0.6 gives (0-0.6)^2=0.36, while having b=1 gives (0-1)^2=1, which is worse. So it balances. Now we want to show that the quadratic score encourages coherence.

  5. (35-50 min) The example. We take the incoherent credence: c(A)=0.6, c(~A)=0.5. We compute the quadratic score in both worlds. We then show that the coherent credence c'(A)=0.55, c'(~A)=0.45 strictly dominates it: in A-world: 
     Incoherent: (1-0.6)^2 + (0-0.5)^2 = 0.16+0.25=0.41
     Coherent: (1-0.55)^2 + (0-0.45)^2 = (0.45)^2 + (0.45)^2 = 0.2025*2=0.405
     In not-A-world:
     Incoherent: (0-0.6)^2 + (1-0.5)^2 = 0.36+0.25=0.61
     Coherent: (0-0.55)^2 + (1-0.45)^2 = (0.55)^2 + (0.55)^2 = 0.3025*2=0.605
  So 0.405 < 0.41 and 0.605 < 0.61. Therefore, the coherent credence is strictly better in every world.

  6. (50-60 min) Now, address the conviction score. We explain the conviction score: for mutually exclusive outcomes, your score is the probability you assigned to the actual outcome minus the maximum probability you assigned to any outcome that did not occur. With two outcomes: A and not-A. If you assign p to A and 1-p to not-A.
     If A occurs: score = p - max{probability of not-A} = p - (1-p) = 2p-1.
     If not-A occurs: score = (1-p) - max{probability of A} = (1-p) - p = 1-2p.
  We note that this score can be negative. We ask: what credence should you have to maximize your score? 
     If you set p=1, then if A occurs you get 2*1-1=1, if not you get 1-2*1=-1.
     If you set p=0.6, then if A occurs you get 2*0.6-1=0.2, if not you get 1-1.2=-0.2.
  But now, if you are unsure, say your true belief is 0.6, then setting p=1 gives you an expected score of 0.6*1 + 0.4*(-1) = 0.2. While setting p=0.6 gives 0.6*0.2 + 0.4*(-0.2)=0.12 - 0.08=0.04, which is less. So you are encouraged to be extreme. This is a problem because it doesn't reflect your true uncertainty. Therefore, we need a scoring rule that is "proper" — one that encourages you to report your true credence. The quadratic score is proper: your own credence gives the best expected score.

