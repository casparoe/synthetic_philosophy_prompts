  ### Notes for Drafting
  - **Emphasize**: The etiological account’s strength in explaining malfunction (a core concern for your editors) makes it more rigorous for biology, while the causal-role account’s flexibility suits engineered systems.  
  - **Bridge the Divide**: Highlight that the etiological account can subsume causal roles *if* a selection history exists, but not vice versa.  
  - **Audience Hook**: Use the "engineered enzyme" case to engage readers—why does intuition clash with philosophy here?
