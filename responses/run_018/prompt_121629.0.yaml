answer: |-
  Here is a specification of desiderata for an adequate theory of personal identity constrained by the Buddhist doctrine of anatta (understood as a positive framework), organized by category. Key tensions and non-negotiables are flagged.

  **I. Phenomena & Cases the Theory Must Accommodate:**

  1.  **Stable Attention in Deep Meditation:** The phenomenological stability of attention and metacognitive awareness across profound meditative states (e.g., jhanas, nirodha-samapatti) where ordinary subject-object duality is attenuated or dissolved.
      *   **Motivation:** Demonstrates continuity of cognitive function and witnessing awareness *without* requiring a substantial, unchanging "self" as the observer. A core Buddhist experiential datum.
      *   **Non-Negotiable (Buddhist):** Yes. Directly relates to the nature of consciousness (vijnana/viññāṇa) and its role in continuity.

  2.  **Karmic Ethics without an Enduring Owner:** The ethical logic of karma (kamma) – intentional actions have morally relevant consequences for the actor – despite the absence of an enduring self (atman) that "owns" past actions or "receives" future results.
      *   **Motivation:** The bedrock of Buddhist ethics and soteriology. The theory must explain responsibility and consequence without reifying a self.
      *   **Non-Negotiable (Buddhist):** Absolutely. Failure here invalidates the theory within a Buddhist context.

  3.  **Post-Meditative Autobiographical Coherence:** The phenomenological coherence and sense of personal history *returning* after emerging from meditative states where subject-object structure collapses (e.g., cessation, pure awareness states), without invoking a pre-existing, hidden self.
      *   **Motivation:** Demonstrates how conventional identity and narrative coherence arise dependently *after* profound non-dual experiences, not from an underlying substance.
      *   **Non-Negotiable (Buddhist):** Yes. Addresses the practical reality of conventional existence after insight.

  4.  **Rebirth (Punabbhava/Saṃsāra) without Transmigration:** The continuity of process across lifetimes, implied by karma and the goal of liberation (nibbāna/nirvāṇa), without positing a soul, self-essence, or identical entity that moves from one life to the next.
      *   **Motivation:** A core tenet of Buddhist cosmology and soteriology. Must be distinguished from Hindu atman-based transmigration.
      *   **Non-Negotiable (Buddhist):** Yes. Essential for the framework.

  5.  **Moral Development & Culpability:** The possibility of long-term moral progress (or regression) across a single life and potentially across lives, including assigning appropriate responsibility for actions committed by "earlier" phases of the causal stream.
      *   **Motivation:** Necessary for the coherence of Buddhist path practices (sila, samadhi, pañña) and the logic of karma operating over time. Must avoid fatalism or nihilism.
      *   **Non-Negotiable (Buddhist):** Yes. Tied intrinsically to points 2 & 4.

  **II. Essential Distinctions the Theory Must Preserve:**

  6.  **Causal Continuity (Paṭiccasamuppāda) vs. Numerical Identity:** Clearly differentiate between the causal connectedness of momentary phenomena (dependent origination) and the concept of strict numerical identity over time (A at t1 = A at t2).
      *   **Motivation:** Anatta explicitly denies numerical identity of a self. Continuity is explained causally, not substantially. Confusion here leads to eternalism or annihilationism.
      *   **Non-Negotiable (Buddhist):** Absolutely fundamental.

  7.  **Conventional Self-Reference (Sammuti Sacca) vs. Ultimate Non-Self (Paramattha Sacca):** Account for the pragmatic, linguistic, and psychological necessity of using "I," "me," and autobiographical narratives in everyday life (conventional truth) while recognizing their ultimate lack of substantial referent (ultimate truth).
      *   **Motivation:** Central to the Two Truths doctrine. Denying conventional usage leads to incoherence; reifying it leads to clinging (upadana).
      *   **Non-Negotiable (Buddhist):** Yes. Balances practical life with liberating insight.

  8.  **Ownerless Experience vs. Subjectless Experience:** Explain how experiences occur *without* a substantial owner (anatta), while acknowledging the *apparent* subject-pole within the conventional flow of consciousness (especially in unenlightened states).
      *   **Motivation:** Avoids the extremes of positing a true subject or collapsing into an incoherent void where experience happens to "no one." Addresses the "for whom?" question phenomenologically.
      *   **Non-Negotiable (Buddhist):** Yes. Clarifies the nature of experience (vedana, sanna, sankhara, vinnana).

  **III. Constraints from Science & Psychology:**

  9.  **Compatibility with Cognitive Science of Self:** Cannot flatly contradict well-established findings on the constructed, modular, and dynamic nature of self-representation (e.g., work on narrative self, bodily self, social self, the effects of brain lesions on identity).
      *   **Motivation:** To maintain intellectual credibility and avoid unfalsifiable dogma. Anatta finds surprising resonance with empirical findings on the fragmented, constructed self.
      *   **Non-Negotiable (Buddhist):** No. This is a constraint for modern dialogue, not core doctrine. Buddhism could (and historically did) exist without it, but contradiction weakens modern applicability. *(Potential Western Prejudice: Prioritizing scientific naturalism)*.

  10. **Accommodation of Dissociation & Altered States:** Must make sense of clinical phenomena like dissociative identity disorder (DID), profound amnesia, or psychedelic experiences where the sense of self radically fragments or dissolves, without resorting to positing multiple "true" selves or a single hidden core self.
      *   **Motivation:** Challenges notions of a unified, essential self. Demonstrates the contingency and constructedness of selfhood.
      *   **Non-Negotiable (Buddhist):** No (but highly supportive). Buddhism offers frameworks (e.g., aggregates, dependently arisen cittas) potentially more flexible than substantialist views. *(Western Prejudice: Possibly over-reliance on pathology as definitive)*.

  **IV. Conceptual Puzzles the Theory Must Dissolve:**

  11. **The "Who?" Question in Meditation/Reintegration:** Explain *how* attention is stable or experience coheres *without* a self-owner. Who attends? Who remembers? Who acts karmically? The theory must provide a positive account, not just deny the self.
      *   **Motivation:** Merely saying "no self" is insufficient. Requires explaining the *apparent* agency and continuity functionally/causally.
      *   **Non-Negotiable (Buddhist):** Yes (implicitly). Failure is dismissive.

  12. **Moral Responsibility without Identity (The Rebirth Problem):** The core puzzle: How can an individual in Life B be morally responsible for the actions of a causally connected but **non-identical** individual in Life A? What constitutes the "individual" link strong enough for responsibility but weak enough to avoid identity?
      *   **Motivation:** The most severe test. Karma requires *appropriateness* of consequence to action/actor; rebirth implies causal connection but strict non-identity. Standard Western accounts (psychological continuity) often link responsibility tightly to identity or strong psychological connectedness, which rebirth explicitly denies.
      *   **Non-Negotiable (Buddhist):** Yes (must attempt resolution). Failure risks incoherence in the core doctrine.
      *   **Joint Unsatisfiability Flag:** **This is the primary tension.** Reconciling **strict causal discontinuity/non-identity between lives** (Des. 4) with a **robust, non-arbitrary notion of moral responsibility** (Des. 2 & 5) across those lives appears *prima facie* contradictory. The theory must dissolve this by redefining "responsibility" or "causal link" in a uniquely Buddhist way (e.g., via the causal efficacy of intention/cetana itself inhering in the stream, or a radically different metaphysics of cause/effect across time).

  13. **The Illusion of Self-Persistence:** Explain the powerful, pervasive, and (for liberation) problematic *illusion* of having a continuous, substantial self, despite its ultimate non-existence. How does this illusion arise and persist dependently?
      *   **Motivation:** Crucial for understanding suffering (dukkha) and ignorance (avijja). A merely negative account is inadequate.
      *   **Non-Negotiable (Buddhist):** Yes. Part of explaining samsara.

  **Summary of Non-Negotiables (Buddhist Framework):** 1, 2, 3, 4, 5, 6, 7, 8, 11, 12, 13. The core challenge is resolving the tension within Desideratum 12.

  **Potential Western Prejudices Imported:**
  *   Overemphasis on strict logic over paradoxical insight (may clash with Des. 12 resolution).
  *   Prioritizing scientific compatibility (Des. 9) as essential rather than desirable.
  *   Viewing narrative as foundational to selfhood (may overplay narrative coherence in Des. 3 vs. Buddhist emphasis on momentariness).
  *   Assumption that moral responsibility *requires* strict identity or strong psychological connectedness (the very assumption Des. 12 must challenge).

  **Brief Assessment of Existing Accounts:**

  *   **Reductionism (Parfitian):** Excels at Des. 6, 9, 10. Struggles profoundly with Des. 2, 4, 5, 12 (karma/rebirth/responsibility) and often dismisses or inadequately addresses Des. 1 & 3 (meditative phenomena). Tends to weaken responsibility excessively (problem for Des. 5). Confuses conventional truth (Des. 7).
  *   **Narrative Theories:** Good at Des. 3, 7 (conventional aspect). May partially address Des. 11 & 13. Often implicitly reify the narrative construct as the self, failing Des. 6, 7 (ultimate aspect), 8. Struggles with Des. 1, 4, and crucially Des. 2, 5, 12 (karma/rebirth/responsibility across narrative breaks). Vulnerable to Des. 10.
  *   **Abhidharma-Style Stream Continuity:** Strong on Des. 1, 3, 4, 6, 8 (citta/cetasiks stream). Explicitly addresses Des. 7. Provides a framework for Des. 11 & 13. Directly tackles Des. 2 & 5 via causal efficacy of cetana/karma within the dependently arising stream. **Most promising baseline.** Key challenges: Explaining the *nature* of the causal link across death (Des. 4 & 12) without smuggling in subtle identity; fully accommodating Des. 9 & 10 in modern terms; dissolving Des. 12 without appealing to unexplained metaphysical "glue." Requires careful elaboration of "soft" causality for rebirth responsibility distinct from identity.

  An adequate theory under these constraints will likely be a sophisticated development of the Abhidharma stream model, rigorously addressing the rebirth-responsibility puzzle (Des. 12) while incorporating insights from cognitive science and phenomenology without contradiction. It must walk the razor's edge between causal coherence and ontological reduction.
