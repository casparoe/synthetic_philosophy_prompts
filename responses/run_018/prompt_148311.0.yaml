  **Joke:**  
  Stan from Accounting slid Form CX-47B across Doris’s desk. “Just needs your approval stamp for the inter-departmental synergy initiative.” Doris sighed, pulling out Form CX-47B-APPROVAL-REQ. “Right, but *this* form requires approval *for* approving Form CX-47B.” Stan blinked. “Does *that* form need its own approval?” Doris nodded, already reaching for Form CX-47B-APPROVAL-REQ-VERIFICATION. “It’s policy. Unless…” She squinted at the fine print. “...you accept that *approving CX-47B* is an internal property of Form CX-47B itself. Then the relation’s self-unifying. No stamp needed!” Stan grabbed CX-47B back. “Brilliant! So it’s self-approved?” Doris’s stamp hovered. “Well, CX-47B *does* now list ‘SELF-APPROVAL’ under requirements…” **THWACK.** She stamped it. “There! Unified by departmental metaphysics.” The form instantly generated a sticky note: *ERROR: SELF-APPROVAL STATUS REQUIRES FORM CX-47B-AUTO-AFFIRMATION (PENDING HR/LOGISTICS SIGN-OFF).*  

  **Self-Critique:**  
  Okay, cheats Bradley *hard* by pretending "self-approval" could even *be* a property without presupposing the whole relational complex (and Absolute) he demands. Bradley’s regress isn’t *solved* by slapping "internal" on a relation—it’s about how any *relational fact* (like approval) can’t be fundamental. The joke treats "internal" as a magic wand, but Bradley would say the form’s "self-approval" tag *still* needs linking to its meaning, restarting the regress. Also, Russell’s "unifying factor" is more like a violent glue-monster binding terms (*cough* the stamp?), but here it’s bureaucratically handwaved. Leans on a very Russellian "external relations need a relator" reading, which Bradley would call... naïve. Fight me, Francis Herbert.
