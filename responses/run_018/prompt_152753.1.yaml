answer: |-
  **(Speaker stands, makes brief eye contact, pauses)**

  Good morning. We’re here to talk about ethics in education. And ethics, at its core, is about action – *doing the right thing*. But how do we *know* what the right thing *is*? How do we know we’re not just… accidentally right? That question landed me in an empty classroom last month after a meeting where I knew a policy was harmful, said so… and utterly failed to explain *why*. I had the truth. I lacked the knowledge. Turns out, just being right isn’t enough. Especially for us.

  So, let’s talk about the difference between *true belief* and *knowledge* – not as dusty philosophy, but as the bedrock of our practice. Because in education, the difference isn’t academic; it’s the difference between luck and professionalism, between fragility and resilience.

  **Philosophers,** you know the territory: True belief is like stumbling onto the road to Larissa by chance. You get there, but you couldn’t do it again reliably. Knowledge? That’s *understanding the map*, recognizing landmarks, knowing *why* this path leads home. It’s *credit-worthy*. It’s an *achievement*. You didn’t just guess the right answer on a math problem; you *earned* it through understanding the proof. That earned understanding – that knowledge – is stable. It can be challenged, tested, defended, and *shared*. True belief? It shatters at the first counter-argument. It’s vulnerable. Unreliable. Unteachable. Educators build with knowledge, not lucky guesses.

  **Administrators,** this hits the ground hard. Think about **hiring.** Do we want a teacher who just *believes* they’re good with struggling readers? Or one who can *articulate* specific strategies, point to evidence of their impact, explain *why* they work? The first might accidentally succeed sometimes. The second *knows* how to succeed consistently. Knowledge gives you a reliable predictor. True belief? It’s a gamble with student outcomes.

  Think about **teacher evaluation.** Evaluating solely on end-of-year test scores? That’s measuring *belief* – a belief that the outcome reflects good practice. But was it knowledge that drove that outcome, or just luck? A great curriculum delivered poorly might accidentally get decent scores one year. A brilliant teacher battling impossible circumstances might get unfairly penalized. True belief focuses only on the endpoint. *Knowledge* demands we look at the *why* behind the result. Did the teacher understand *why* their methods worked or didn't? Can they adapt? Can they explain their choices? *That's* evaluating the knowledge, the earned understanding, the thing that ensures sustainable success, not just a lucky snapshot.

  Knowledge isn’t just having the right answer locked away. It’s having the *reasons*, the *connections*, the *ability to navigate* the terrain of our decisions. It’s what lets us defend good choices ethically when challenged. It’s what lets us adapt when circumstances change. It’s what makes our "right thing" not just a fluke, but a *repeatable, responsible practice*.

  My failed moment? It was true belief. I got fired for lacking knowledge – the kind of knowledge that earns credit, withstands scrutiny, and commands respect. I don’t want that for any of you. I don’t want it for our schools. Our work is too important to rest on lucky guesses. Let’s spend our time together building the kind of knowledge – earned, defensible, grounded knowledge – that makes our ethical choices not just correct, but *credible*, *resilient*, and truly worthy of the trust placed in educators.

  Let’s begin.
