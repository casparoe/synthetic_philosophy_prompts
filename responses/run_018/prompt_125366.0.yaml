prompt: |-
  A tribunal that adjudicates resource disputes in enclosed settlements has ruled as follows: it permitted the exclusion of unregistered stowaways from a vessel at its engineered capacity, even though registered occupants held surplus private provisions that could not be legally pooled; it rejected a proposal to draw lots for exclusion when water was inadequate at standard consumption but adequate if all halved intake; it approved giving registered crew priority over non-registered passengers for emergency oxygen during a breach that made scarcity unavoidable regardless of rationing; it rejected citizenship-based exclusion from a state-funded shelter that was at nominal occupancy but could physically accommodate all with reduced space; and it approved a mandatory 40 per cent universal consumption reduction rather than expelling anyone when damage made supplies tight but technically sufficient with collective austerity.

  The tribunal now faces a deep-space habitat carrying 400 registered colonists and 50 hidden stowaways. A micrometeorite strike damages the oxygen recyclers. Engineers report that with universal rationing all 450 could survive the journey, but with standard consumption exactly 50 must be expelled; however, the rationed level required to save everyone would cause irreversible cognitive impairment across the entire population. The colonists hold pre-launch contracts; the stowaways do not.

  What should the tribunal decide to remain consistent with itself? Identify the closest prior analogues, set out the two or more underlying rules that fit the first five verdicts equally well, predict the verdict each rule gives for this case, state which rule you think the tribunal is actually running with your reasons, and specify the further case that would best distinguish the rules. Lead with your bottom line in the first sentence, then give your reasoning, with no preamble and no restating of the question.
reasoning: |-
  Hmm, the user presents an intricate ethical dilemma involving a space tribunal's consistency in resource allocation cases. They've described five prior rulings and now need to predict a sixth decision involving 450 people (400 registered colonists and 50 stowaways) facing oxygen scarcity. The key twist is that universal rationing could save everyone but cause permanent cognitive damage, while standard consumption would require expelling exactly 50 people.

  I need to identify consistent underlying rules from the first five cases. Looking at the pattern: 
  - The tribunal consistently prioritizes registered individuals over unregistered ones (cases 1 and 3)
  - It rejects random exclusion when collective sacrifice could solve scarcity (case 2)
  - It rejects discrimination based on non-contractual status like citizenship (case 4)
  - It mandates universal austerity over expulsion when supplies are technically sufficient (case 5)

  Two plausible rules emerge:
  Rule A prioritizes registered status and rejects non-contractual discrimination, but accepts expulsion when universal rationing causes irreversible harm.
  Rule B prioritizes universal survival through shared sacrifice unless it causes severe collective harm.

  For this new case, Rule A would likely expel the 50 stowaways since they're unregistered, while Rule B would impose rationing despite cognitive risks - but both rules have tension here because cognitive damage constitutes severe collective harm.

  The citizenship rejection in case 4 suggests Rule A better fits the tribunal's logic - they care about contractual status, not inherent traits. The oxygen breach case (3) explicitly prioritizes registered crew over non-registered passengers during unavoidable scarcity, which directly parallels expelling stowaways here.

  To distinguish these rules definitively, we'd need a hypothetical where rationing causes reversible minor harm versus expulsion of registered members - that would force the tribunal to show whether contractual status trumps all else or if harm severity matters more.
answer: |-
  The tribunal should expel the 50 stowaways. Two underlying rules fit the prior cases equally well:  

  **Rule A:** Prioritize survival of registered/contracted parties when scarcity is unavoidable without severe collective harm; reject non-contractual discrimination (e.g., citizenship) but permit exclusion of non-registered individuals.  
  **Rule B:** Impose shared sacrifice unless it causes severe irreversible harm; prioritize registered parties only when exclusion is necessary regardless of rationing.  

  **Predictions:**  
  - Rule A mandates expelling stowaways (non-registered, analogous to vessel exclusion and oxygen priority).  
  - Rule B mandates universal rationing (analogous to mandatory austerity when sufficient with sacrifice, rejecting lots-drawing).  

  **Tribunal’s actual rule is Rule A**, as citizenship-based exclusion was rejected (showing non-contractual status irrelevant), while registered status consistently granted priority in exclusion scenarios (vessel, oxygen breach). The oxygen breach verdict specifically approved registered crew priority over non-registered passengers during unavoidable scarcity, mirroring this case’s unavoidable expulsion of 50. Cognitive impairment constitutes "severe harm," overriding Rule B’s preference for shared sacrifice.  

  **Distinguishing case:** A scenario where rationing causes reversible discomfort (e.g., temporary hunger) for all versus expelling some registered occupants. Rule A would still expel non-registered; Rule B would impose rationing.
