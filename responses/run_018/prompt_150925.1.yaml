prompt: |-
  I'm stuck on wether adaptive nudging still counts as soft paternalism. Picture a public-health portal that tracks your past choices and dynamically adjusts the default—if you've skipped vaccines, opting in gets harder; if you comply, it's streamlined. What's your credence this is actually hard paternalism? Give me 0-1, then decompose: (a) does adaptive framing change the choice set or just its presentation, (b) does the algorithm's opaqueness damage autonomy enough to matter, (c) does the nudge/coercion distinction even hold up under personalization. Rough probs for each, one line of reasoning, then combine. Tell me which term is the shakiest and what'd shift it. I feel like I'm at about 0.55, mostly because of (b).
reasoning: |-
