answer: |-
  ## Asymmetric Multiplex Bridge Case

  **Scenario:** Subject S enters a scanner that disintegrates S's original body. Simultaneously, two replicas are generated at remote sites. R-alpha receives approximately 85% of S's psychological profile, encompassing S's entire long-term autobiographical memory bank. However, each of these memories carries an indelible phenomenological marker, experienced as recollections sourced from a third party or archive, lacking the sense of "I did this." R-beta receives the remaining 15%, consisting of S's core personality structure (dispositions, values, emotional responses) and *all* memories from the past year. Crucially, R-beta's memories are fully integrated with authentic first-person phenomenal ownership ("This happened *to me*"). Upon awakening, a temporary, high-bandwidth neural-computational bridge activates between R-alpha and R-beta. For precisely 72 hours, this link enables seamless, real-time sharing and integration of their cognitive and experiential states, creating a single distributed cognitive system with unified, effortless access to both memory sets and a harmonized stream of consciousness. After 72 hours, the bridge is permanently and irreversibly severed, leaving R-alpha and R-beta as fully independent, embodied individuals.

  ---

  **Theoretical Verdicts & Workings:**

  1.  **Bodily-Continuity Theory:**
      *   **Belief/Survival Claim:** S survives only if there is spatiotemporal continuity of the same living organism/body.
      *   **Criterion Applied:** Strict physical continuity of the biological organism.
      *   **Verdict & Explanation:** S does **not** survive at all. S's original body is destroyed. R-alpha and R-beta are newly created bodies/biologies at distant locations. The temporary neural link does not constitute physical continuity; it's merely data exchange between two distinct organisms. Neither replica is the *same* living body or continuous organism as the original S, even during the bridge phase. They are new entities.
      *   **Nearby Worlds Check:**
          *   *Bridge Indefinite:* Still no bodily continuity. S destroyed, two new bodies created. No survival.
          *   *R-alpha Lacks Ownership Deficit:* Irrelevant. The issue is bodily discontinuity, not psychological features.

  2.  **Psychological-Continuity Theory (Parfitian/Branching):**
      *   **Belief/Survival Claim:** S survives if there is sufficient psychological connectedness and continuity (e.g., overlapping memories, intentions, character traits) with a future person. Branching (multiple continuers) is possible.
      *   **Criterion Applied:** Degree of psychological connectedness/continuity, with emphasis on the *quality* of connection (here, phenomenal ownership).
      *   **Verdict & Explanation:** Both R-alpha and R-beta are continuers of S, but **R-beta is the closer continuer**. While R-alpha possesses the *content* of the majority of S's life history, the lack of first-person phenomenal ownership ("I did this") significantly weakens the psychological connection. These memories feel inherited, not lived. R-beta, despite having fewer memories in terms of temporal scope, possesses the core personality *and* the most recent year of memories *with full, authentic first-person ownership*. This direct, unmediated sense of "mineness" constitutes a stronger psychological connection to S's immediate past and core identity than R-alpha's vast but phenomenologically distanced archive.
      *   **Nearby Worlds Check:**
          *   *Bridge Indefinite:* Both remain connected continuers indefinitely. S survives "distributed."
          *   *R-alpha Lacks Ownership Deficit:* If R-alpha's memories also had full first-person ownership, it would likely be the *closer* continuer due to the sheer volume of connected memories, making the asymmetry less pronounced in R-beta's favor.

  3.  **Unitary-Narrative Theory:**
      *   **Belief/Survival Claim:** S survives only as long as there exists a capacity to maintain a single, coherent, non-contradictory first-person autobiographical narrative *without reliance on external or distributed scaffolding*.
      *   **Criterion Applied:** Capacity for unified, autonomously sustained self-narrative grounded in first-person experience.
      *   **Verdict & Explanation:** S survives **only during the 72-hour bridge period** as a single distributed subject. During this time, the bridge seamlessly integrates R-alpha's historical archive and R-beta's owned recent past/core self into one coherent, unified narrative stream accessible from a singular first-person perspective ("I remember my childhood *and* I remember breakfast today, seamlessly"). After severance, **S ceases to exist entirely**. R-alpha possesses a vast history but cannot claim it as its *own lived experience*; its narrative is fractured, built on "borrowed" memories. R-beta possesses a strong sense of self for the past year and core traits but lacks direct, owned access to the pre-year history; its narrative is truncated. Neither can autonomously sustain S's *complete* life narrative as a unified "I" without the other's scaffolded contribution.
      *   **Structural Feature Forcing Divergence:** The *combination* of the **temporary distributed substrate** (enabling unified narrative only while linked) and the **ownership asymmetry** (ensuring neither replica possesses *both* a complete owned history *and* the core self/near-term ownership post-severance) forces the Unitary-Narrative view to a distinct conclusion. Psychological continuity allows weaker connections to suffice post-severance; Unitary-Narrative requires the *scaffolded unity itself* to be the subject.

  **Defense Note (Psychological Continuity Attack):** A psychological-continuity theorist would strongly contest the Unitary-Narrative verdict. They would argue that narrative unity is primarily an *epistemic* or *practical* concern – how well we can *tell* our story or function socially – not a strict *metaphysical* condition for survival itself. From their perspective, R-beta possesses *sufficient* psychological connectedness (core personality, owned recent memories) to ground survival as S, even if R-beta's autobiography is now "gappy" regarding older events. The fragmentation or incompleteness of the narrative post-severance is seen as a loss of detail or coherence, not an ontological cessation of the person. They would insist that the metaphysical fact of psychological continuity resides in the overlapping mental states and dispositions, not in the perfection of the self-told story.

  **Removing the 72-Hour Bridge:** If the replicas awaken *without* any temporary link, the case collapses into a standard branching teletransporter problem with asymmetric memory allocation. The Unitary-Narrative view would be forced to make an uncomfortable choice: **a)** Deny S survives at all (due to lack of unified narrative capacity in either replica), **b)** Arbitrarily select one replica (likely R-beta, due to stronger ownership, but abandoning the strict unity requirement), or **c)** Reluctantly accept branching (contradicting its core tenet of narrative unity). All three options sacrifice the distinctive "S survives only distributed temporarily" result unique to the bridge scenario. Psychological continuity theory would maintain its "both are S, R-beta closer" verdict, and bodily continuity would still deny survival.

  ---
  This case isolates the role of *phenomenological ownership* and *temporal narrative unity* in a way the standard teletransporter does not, forcing specific divergences between the theories, particularly pressuring the Unitary-Narrative view to its distinctive (and arguably fragile) conclusion during the bridge period.
