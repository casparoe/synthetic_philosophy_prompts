prompt: |-
  I'm preparing material for a discussion circle drawn from longtime rationalist blog and forum readers, and I need a taxonomy tree—not a quiz with point values, but a branching classification—of the positions people actually hold about exceptional success and whether societies should celebrate or suppress it. The tree should span the familiar triad of American Dream celebration, Scandinavian Jantelagen suppression, and Anglophone tall-poppy syndrome, but I want it to treat material success and epistemic success—being visibly and correctly ahead of one's peers in reasoning or prediction—as distinct domains, since that distinction is live in this audience. I also want you to inject the niche idea of a reputational commons, treating visible status as partially rivalrous so that one person's exceptional recognition can deplete what is available for others, and I want that treated as a live branch option rather than background context.

  Please construct the taxonomy from logical space rather than from a roster of named doctrines. The root should be a concrete case: a single individual in a community achieves outcomes far above peers through some mix of talent, luck, and structure, in either material or epistemic form. Each branch should be labeled by a specific claim that separates siblings, phrased as a judgment or question that someone could answer without knowing which ideology it points to. Include these splits: whether the outcome reflects mainly individual merit or mainly structural advantage and luck; whether the appropriate response targets the individual—reward, suppress, or cut down—or targets institutions such as access rules, reward structures, or collective decision procedures; and whether visible disparity causes harm mainly through psychological resentment among peers, through extraction or domination by the successful party, or through corruption of group judgment when one voice dominates disproportionately. The tree should yield eight to ten leaves. Named leaves must include American Dream-style unlimited proportional celebration of success, Jantelagen-style active suppression of anyone who claims specialness regardless of the source of their achievement, and tall-poppy syndrome driven specifically by peer resentment of those who rise visibly above the group. You must also include at least two unoccupied or unnamed combinations—for instance, the view that epistemic outliers should be celebrated without limit while material outliers should be institutionally flattened, or the view that all visible success is structurally illegitimate yet suppressing individuals is still wrong—and briefly diagnose each as incoherent, unattractive, or merely unexplored. Please flag any pair of leaves that your branching logic genuinely cannot separate, rather than papering over the gap.

  Write the response as continuous prose only, with no headings, no bullet points, no bold text, and no tables, exactly as one writes a letter or an email, and use American English throughout. Use concrete scenarios in the branch descriptions—such as a researcher whose predictive model consistently outperforms institutional consensus but receives no citation credit or influence, versus an entrepreneur whose wealth derives partly from regulatory capture—so the instrument sorts people by what they believe about cases rather than by which slogan they prefer. Do not include bibliographies, reading lists, citations, or references to specific texts that would require lookup; the tree should be answerable entirely from conceptual reasoning. The audience is rationalist-leaning readers who think naturally in terms of incentives, institutional design, and rivalrous goods, so the language should reflect that fluency without becoming jargon-heavy.
reasoning: |-
  Okay, let me think through how to approach this taxonomy request. The user wants a branching classification of views on exceptional success, with specific requirements around structure and content.

  First, considering the user's context: they're preparing for a rationalist discussion circle, so the taxonomy needs to handle nuanced concepts like reputational commons and distinguish material/epistemic success. The concrete case approach makes sense - starting from an individual's exceptional outcome.

  For the root, I'll use a dual scenario: one material (entrepreneur with regulatory advantages) and one epistemic (researcher with uncited superior predictions). This sets up the material/epistemic distinction immediately.

  Key branching points to include:
  1. Merit vs structural factors as primary cause
  2. Individual vs institutional focus for response
  3. Harm mechanism: resentment, extraction, or judgment corruption

  The reputational commons concept should appear at the branch where we consider status as rivalrous. This fits naturally when discussing harm mechanisms.

  Leaf categories must cover:
  - American Dream celebration
  - Jantelagen suppression
  - Tall-poppy syndrome
  Plus two unnamed combinations like epistemic celebration with material flattening, and structural illegitimacy without suppression

  I need to watch for potential indistinct leaves, particularly around whether suppression targets individuals or institutions when harm mechanisms overlap. The taxonomy should acknowledge this limitation rather than force false distinctions.

  The prose format requires careful sequencing - I'll build the tree through logical progression rather than explicit headings. Concrete examples will anchor each branch point, keeping it accessible to rationalist thinkers without jargon. Each decision node will be framed as a question someone might actually confront when evaluating real cases.

  The unnamed combinations need brief evaluation: one seems coherent but unexplored (epistemic/material split), the other possibly incoherent (denying legitimacy while rejecting suppression). This meets the user's request for diagnosing why positions might be unoccupied.
answer: |-
  Begin with the concrete case: a community member achieves outcomes far surpassing peers—say, an entrepreneur whose wealth stems partly from genuine innovation but also regulatory capture (material success), or a researcher whose predictive models consistently outperform institutional consensus yet receive no credit or influence (epistemic success). The taxonomy branches by asking questions about the source of this disparity, the appropriate response, and the nature of harm perceived.

  First, ask whether the exceptional outcome arises primarily from the individual’s merit and effort, or from structural advantages and luck. For the entrepreneur, is their wealth earned through value creation, or did monopoly privileges and chance connections dominate? For the researcher, is their insight a product of unique genius and rigor, or privileged data access and fortunate problem selection? This split separates those who see outliers as deserving from those who see them as beneficiaries of uneven playing fields.

  Next, consider the appropriate locus of response: should action target the individual outlier, or institutional rules? Targeting the individual might mean rewarding them proportionally, suppressing their visibility, or cutting them down to size. Targeting institutions might mean altering access (e.g., breaking monopolies, democratizing data), reconfiguring rewards (e.g., steep inheritance taxes, citation reform), or changing group decision procedures (e.g., implementing prediction markets to amplify accurate voices). Here, one branch celebrates the entrepreneur’s wealth as just and incentivizing, while another designs antitrust policy to prevent future concentration. Similarly, one branch might elevate the researcher’s status to improve group epistemology, while another advocates anonymized peer review to reduce bias.

  Now, diagnose the primary harm caused by visible disparity. Does it stem from psychological resentment among peers, corrosive extraction/domination by the outlier, or corruption of collective judgment through disproportionate influence? This introduces the reputational commons: if status is partially rivalrous, exceptional recognition depletes a shared resource, starving others of credit or authority. For the material outlier, resentment might manifest as envy-driven boycotts; extraction might involve rent-seeking that drains community resources; judgment corruption could occur if wealth buys undue political sway. For the epistemic outlier, resentment could trigger dismissal of valid insights; extraction might involve hoarding data or attention; judgment corruption emerges if their voice drowns out equally valid perspectives, distorting truth-seeking.

  This yields leaves like American Dream idealism: merit-based success deserves unlimited proportional celebration, as it motivates effort and benefits all; resentment is a personal failing to overcome. Jantelagen-style suppression actively cuts down any individual claiming specialness, targeting both material and epistemic outliers to enforce equality; the harm is primarily to social cohesion via status rivalry, making suppression a communal duty. Tall-poppy syndrome focuses on peer resentment: materially or epistemically successful individuals provoke such destructive envy that communities informally cut them down, regardless of merit, to preserve harmony—a rivalrous commons logic where one person’s acclaim directly diminishes peers’ social capital.

  Two unnamed combinations emerge. One position might celebrate epistemic outliers without limit (their insights are pure public goods, advancing truth) while institutionally flattening material outliers via wealth caps or redistribution (material success is zero-sum, breeding resentment or exploitation). This is coherent but unexplored, risking inconsistency: if epistemic success relies on material resources (e.g., lab funding), suppressing the latter may starve the former. Another view could hold that all visible success is structurally illegitimate (merit is illusory; luck/privilege dominate), yet suppressing individuals remains unjust—focusing solely on transforming institutions. This may be unattractive: it paralyzes response, condemning outliers for systemic ills they didn’t create while offering them no path to redemption or contribution.

  A genuine indistinction arises between leaves where harm mechanisms overlap. When status rivalry (commons depletion) and extraction/domination both drive resentment—say, the wealthy entrepreneur exploits peers while hoarding social credit—the logic for targeting individuals versus institutions blurs. Is suppressing the outlier necessary to reclaim the commons, or is reforming monopolies sufficient? The taxonomy cannot neatly separate these without case-specific context, as the perceived primacy of harm is often subjective.

  Thus, the tree maps positions not by doctrine but by judgments on concrete cases, revealing tensions in how we reward visionaries, mitigate unfairness, and steward the invisible infrastructures of recognition that shape human flourishing.
