answer: |-
  Here is the reusable **Knowledge-Topology Audit** for allocation-mechanism decisions, followed by applications to your three cases. The procedure requires **no prior economics knowledge** and runs in **≤2 hours** per proposal.

  ---

  ### **Knowledge-Topology Audit Procedure**  
  **Objective**: Classify decision-relevant information across 4 dimensions to recommend institutional form.  
  **Input**: Sector proposal + local/district reports.  
  **Output**: Institutional verdict (Centralized/Decentralized/Hybrid) or "Board Judgment Required."

  ---

  #### **Dimension 1: Spatial Dispersal**  
  *Threshold Question*: **"Does critical data lose accuracy/resolution beyond 25km or one administrative district?"**  
  - *Evidence*:  
    - Sufficient for "YES": Sensor/monitor density varies >30% across districts; transport costs exceed 15% of resource value.  
    - Sufficient for "NO": Uniform sensor coverage; resource homogeneous (e.g., bulk electricity).  
  *Verdict Driver*: High dispersal → favors decentralization.

  #### **Dimension 2: Tacitness**  
  *Threshold Question*: **"Can >80% of operational rules be fully written in a checklist usable by a new hire?"**  
  - *Evidence*:  
    - Sufficient for "NO" (High Tacitness): Documented procedures cover <50% of decisions; local managers cite "experience" in >30% of incident reports.  
    - Sufficient for "YES" (Low Tacitness): Standardized digital workflows cover >90% of cases.  
  *Verdict Driver*: High tacitness → favors decentralization.

  #### **Dimension 3: Temporal Volatility**  
  *Threshold Question*: **"Do conditions change faster than standardized reports can be collated (≤1 cycle)?"**  
  - *Evidence*:  
    - Sufficient for "YES" (High Volatility): Sensor updates every 15 mins vs. weekly reports; >10% volatility in daily resource flows.  
    - Sufficient for "NO" (Low Volatility): Monthly fluctuations <5%; annual forecasts reliable.  
  *Verdict Driver*: High volatility → favors decentralization.

  #### **Dimension 4: Interdependence**  
  *Threshold Question*: **"Would a 10% change in District A’s usage cause >5% change in District B’s costs/availability?"**  
  - *Evidence*:  
    - Sufficient for "YES" (High Interdependence): Shared reservoirs/power lines; congestion pricing data shows spillovers.  
    - Sufficient for "NO" (Low Interdependence): Isolated resources (e.g., local roads); no cross-district transfers.  
  *Verdict Driver*: High interdependence → favors centralization.

  ---

  #### **Institutional Mapping Rules**  
  1. **Full Centralization** ONLY if:  
     - Low Spatial Dispersal (NO) + Low Tacitness (YES) + Low Volatility (NO) + High Interdependence (YES).  
     *Stop-Rule*: If ANY dimension violates → abort centralization.  

  2. **Full Decentralization** if:  
     - High Spatial Dispersal (YES) + High Tacitness (NO) + Low Interdependence (NO).  
     *(Volatility irrelevant: local actors adapt faster.)*  
     *Stop-Rule*: If High Interdependence (YES) → move to Hybrid.  

  3. **Hybrid (Bounded Local Discretion)**:  
     - Default when dimensions conflict, especially:  
       - High Tacitness + High Interdependence, OR  
       - High Volatility + High Interdependence.  
     *Design*: Central price floors/ceilings; local adjustment within 20% band.  

  4. **Board Judgment Required** if:  
     - High Tacitness (NO) + High Interdependence (YES) → **Stop-Rule 1** (Irreconcilable: local expertise vs. system-wide coordination).  
     - Political pressure for centralization opposes ≥2 decentralized verdicts → **Stop-Rule 2** (Acknowledge epistemic sacrifice).  

  ---

  ### **Case Applications**  

  #### **Case 1: Real-Time Load-Balancing Tariffs During Heat Waves**  
  - **Spatial Dispersal**: YES (Granular usage patterns vary block-by-block; evidence: smart meter data diverges >40% across neighborhoods).  
  - **Tacitness**: YES (Rules articulable; evidence: AI-driven demand algorithms cover 95% of scenarios).  
  - **Temporal Volatility**: YES (Changes in 15-min intervals; evidence: grid frequency fluctuates >20% daily during heatwaves).  
  - **Interdependence**: YES (Grid overload in one district cascades; evidence: historical blackout maps show contagion).  
  - **Verdict**: **DECENTRALIZE** (Local managers adjust tariffs hourly).  
  - **Contradicts Your Prior**: **Temporal Volatility** forces this. Central pricing cannot track 15-min changes with weekly reports.  
  - **Stop-Rule Trigger**: None (dimensions align for decentralization).  

  #### **Case 2: Emergency Drought-Water Rations**  
  - **Spatial Dispersal**: YES (Soil moisture varies by field; evidence: sensor variance >35% within districts).  
  - **Tacitness**: NO (Irrigation practices/water-sharing unrecorded; evidence: 70% of agreements verbal, no documentation).  
  - **Temporal Volatility**: NO (Drought changes over weeks; evidence: reservoir levels update weekly, matching cycles).  
  - **Interdependence**: YES (Aquifers span districts; evidence: model shows 10% drawdown in A reduces B’s supply by 8%).  
  - **Verdict**: **HYBRID** (Central caps on water withdrawals; local managers allocate based on tacit agreements).  
  - **Board Judgment Required?**: **YES** (Stop-Rule 1: High Tacitness + High Interdependence conflict → tradeoff between local fairness and system efficiency).  

  #### **Case 3: Bridge Maintenance Scheduling**  
  - **Spatial Dispersal**: YES (Micro-climate/wear hyper-local; evidence: corrosion rates vary 200% within 5km).  
  - **Tacitness**: NO (Unreported truck overloads; evidence: 60% of damage tickets cite "unexpected" weight violations).  
  - **Temporal Volatility**: NO (Degradation takes months; evidence: crack propagation models reliable at 3-month intervals).  
  - **Interdependence**: NO (Bridge failures rarely cascade; evidence: <2% of closures affect adjacent districts).  
  - **Verdict**: **FULL DECENTRALIZATION** (Local managers prioritize repairs).  
  - **Unresolved Normative Issue**: None (audit clear).  

  ---

  ### **Audit Reliability Conditions**  
  The procedure fails if:  
  1. **Tacitness becomes fully codifiable** (e.g., AI/ML extracts embodied knowledge from sensor streams).  
     - *Revision Needed*: Decentralization threshold for tacitness rises (e.g., from 80% to 95% articulability).  
     - *Weakest Link*: Tacitness detection relies on self-reported data—local managers may understate knowledge to retain autonomy.  

  2. **Interdependence is mis-measured** (e.g., "hidden" spillovers like ecological tipping points).  
     - *Empirical Red Flag*: Retrospective analysis shows >20% of "low-interdependence" decisions caused system failures.  

  3. **Political override frequency exceeds 30%** of cases → Audit loses credibility; staff bypass it.  

  **Most Plausible Collapse Point**: A skeptic argues that **tacitness is always reducible to data** via modern monitoring, eliminating the decentralization imperative. If proven, the audit defaults to centralization when interdependence is high—contradicting Hayek’s core thesis. Defense requires evidence of *persistent undocumented practices* (e.g., Case 2’s water-sharing remains verbal despite 10 years of digitization attempts).  

  ---  
  This audit institutionalizes the socialist calculation debate’s insights without requiring economic theory. It prioritizes epistemic feasibility over ideology—explicitly flagging when political goals clash with knowledge constraints.
