  ### Decision Tree: Value of Original Artworks vs. Perfect Perceptual Duplicates  
  **Root Question:** Does an original artwork possess value that an indistinguishable forgery cannot have?  

  ---

  #### **Node 1: Perceptual Identity**  
  *Is perceptual identity sufficient for artistic value?* (i.e., if two objects are perceptually indistinguishable, must they possess identical artistic value?)  
  - **Yes** → Proceed to Leaf 1.  
  - **No** → Proceed to Node 2.  

  ---

  #### **Node 2: Artist’s Manual Involvement**  
  *Is direct manual involvement by the named artist necessary for originality?* (i.e., does mediated production—e.g., studio assistants, foundry casting, digital fabrication—break the causal chain to the artist?)  
  - **Yes** → Proceed to Node 3.  
  - **No** → Proceed to Node 3.  

  ---

  #### **Node 3: Restoration Tolerance**  
  *Does restoration replacing ~95% of an artwork’s original substrate destroy its originality?*  
  - **Yes** → Proceed to Node 4.  
  - **No** → Proceed to Node 4.  

  ---

  #### **Node 4: Posthumous Algorithmic Generation**  
  *Does an algorithmically generated work—trained exclusively on a deceased artist’s corpus and executed without human intervention—count as:*  
  - **(a) Original**  
  - **(b) Forgery**  
  - **(c) Something else** (e.g., derivative work, new artwork, etc.)  

  ---

  ### Leaves (Terminal Positions)  

  1. **Leaf 1: Pure Aestheticism**  
     - **Path:** Node 1 = Yes.  
     - **View:** Artistic value resides solely in perceptible properties; perfect duplicates share identical value.  
     - **Awkward Commitment:** Must accept that a known forgery (e.g., van Meegeren’s Vermeer) has the same artistic value as the original, even when its discovery retroactively dismantles its historical and interpretive context.  

  2. **Leaf 2: Causal-Historical Essentialism**  
     - **Path:** Node 1 = No → Node 2 = No → Node 3 = Yes → Node 4 = (b) Forgery.  
     - **View:** Originality requires a direct causal link to the artist’s creative act; material discontinuity or posthumous generation breaks this chain.  
     - **Awkward Commitment:** Must deny originality to works with extensive but well-documented restoration (e.g., the Ghent Altarpiece), even if causally tied to the artist’s intent and institutionally accepted.  

  3. **Leaf 3: Institutional/Recognition-Based View**  
     - **Path:** Node 1 = No → Node 2 = No → Node 3 = No → Node 4 = (c) Something else.  
     - **View:** Value derives from art-world status (e.g., authentication, provenance); forgeries lack institutional recognition regardless of causal history.  
     - **Awkward Commitment:** Must accept that a forgery (e.g., Beltracchi’s forgeries) possesses the same value as an original if undetected, but loses it overnight upon discovery—despite unchanged perceptible properties.  

  4. **Leaf 4: Restoration-Tolerant Causal View**  
     - **Path:** Node 1 = No → Node 2 = No → Node 3 = No → Node 4 = (b) Forgery.  
     - **View:** Originality persists through material replacement if a continuous causal chain to the artist’s act is maintained; posthumous generation lacks this chain.  
     - **Awkward Commitment:** Must hold that a 95%-reconstructed artwork (e.g., the Ship of Theseus) retains full originality, while a perceptually identical, causally disconnected duplicate does not—even if the latter is materially closer to the original.  

  5. **Unnamed/Unexplored Positions**  
     - **Path A:** Node 1 = No → Node 2 = Yes → Node 3 = Yes → Node 4 = (b) Forgery.  
       - **Diagnosis:** Coherent but unattractive. Requires manual involvement (rejecting delegation, e.g., Warhol’s Factory works) yet accepts extreme restoration as destructive. Inconsistent in valuing artist touch in creation but not preservation.  
     - **Path B:** Node 1 = No → Node 2 = Yes → Node 3 = No → [Any Node 4 answer].  
       - **Diagnosis:** Incoherent. Demands artist’s hand for originality (Node 2 = Yes) but allows non-artist restorers to replace 95% of the substrate (Node 3 = No), fetishizing trace physical contact over holistic agency.  
     - **Path C:** Node 1 = No → Node 2 = No → Node 3 = Yes → Node 4 = (a) Original.  
       - **Diagnosis:** Overlooked and implausible. Claims restoration destroys originality (Node 3 = Yes) but grants it to algorithmically generated works (Node 4 = a), ignoring the shared lack of direct artist causation.  

  ---

  ### Ambiguity Flags  
  - **Causal-Historical Essentialism (Leaf 2) vs. Strict Manualism (Path A):**  
    Both paths answer Node 4 identically (Forgery), but Node 2 separates them. The tree distinguishes manual involvement (Path A) from broader causal agency (Leaf 2).  
  - **Institutional View (Leaf 3) vs. Restoration-Tolerant Causal View (Leaf 4):**  
    Both share Node 1/2/3 answers (No/No/No) but diverge at Node 4. "Something else" (Leaf 3) captures institutional context-dependence, while "Forgery" (Leaf 4) reflects causal essentialism.  
  - **Algorithmic Generation (Node 4):**  
    Institutional View (Leaf 3) defaults to "Something else" to reflect its dependence on art-world recognition (e.g., estate authorization), not fixed properties. Other views treat Node 4 deterministically.  

  —  
  *This tree exhausts the logical space defined by the four nodes. Unbranched intersections (e.g., Path B) highlight gaps in extant theories or unattractive commitments.*
