  Jordan's position is classic phenomenal concept strategy (PCS): the special nature of how we conceptualize experience creates the explanatory gap. Riley counters with a framing hypothesis - that it's our first-person perspective that creates the illusion of a hard problem. Their debate unfolds in six clear moves:

  1. Jordan opens with standard PCS: phenomenal concepts refer directly, hence the "something missing" feeling in physical explanations. 

  2. Riley reframes this as symptom vs cause - the framing creates the conceptual gap. Her mirror analogy is clever: just as you can't see the back of your head in a mirror, introspection structurally hides physical properties.

  3. Jordan's "extra steps" reply challenges Riley's distinction - if concepts lack physical content already, framing is redundant. This reveals a key philosophical divide: is the concept's nature primary, or is it shaped by perspective?

  4. Riley's hypothetical frame-neutral observer is her strongest move. If altering perspective dissolves the hard problem intuition, framing must be causal. But Jordan rightly calls this science fiction - we have no access to such cognition.

  5. Their clash over conceptual coherence vs biological reality highlights different methodologies: Riley values thought experiments, Jordan demands naturalistic constraints.

  6. The standstill reflects a deeper meta-disagreement about philosophical explanation itself.

  The user's suggestion about different levels is perceptive. I think they're onto something: framing might be the psychological mechanism that implements phenomenal concepts. But Riley might resist collapsing her account into Jordan's.

  Where they each have merit:
  - Jordan correctly notes phenomenal concepts are special (direct reference)
  - Riley's framing hypothesis better explains why the gap feels inescapable during introspection

