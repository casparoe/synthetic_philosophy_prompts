  Okay, the user is asking about Aquinas's view on tyrannicide and sedition, specifically focusing on the tension between the absence of legal remedies and the danger of disorder. They mentioned their seminar discussion and a professor's idea of a "residual authority problem." Let me unpack their main concern.

  The user wants to know if Aquinas sees the prohibition on private action as lifting when institutions collapse, or if the moral duty to avoid chaos still holds. The core question is whether institutional breakdown makes resistance permissible or if it removes both the right and the remedy. 

  I recall Aquinas's text in the Summa Theologiae (II-II, Q.42, A.2). He distinguishes between usurpers and legitimate rulers turned tyrants. For usurpers, public authority can remove them. For legitimate rulers, the community must exhaust legal channels first. The key points are that private individuals can't act, and public authority is needed. 

  But what happens when all authorities are gone? The user's professor's "residual authority problem" is crucial here. Aquinas emphasizes the risk of disorder as a structural issue, not just consequentialist. Even without functioning institutions, the moral prohibition remains because the act of private judgment itself is forbidden. Chaos isn't just a risk; it's tied to the lack of proper authority. 

  So, for Aquinas, the breakdown doesn't permit resistance; it makes the situation tragic. The duty to avoid chaos persists because the structural order requires authority, which is absent. The user needs to see that the prohibition is deontological, rooted in the nature of political order, not just outcomes. 

  Also, the user might be grappling with applying medieval theology to modern contexts. They might need reassurance that Aquinas's principles are about authority structures, not endorsing passive suffering. But the answer should stick to Aquinas's text. 

