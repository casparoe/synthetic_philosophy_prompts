answer: |-
  Aquinas treats the risk of disorder as a structural, deontological feature binding even when institutional remedies collapse, meaning the breakdown of legal channels does *not* transform private resistance into a permissible last resort but instead deepens the tragedy by removing both the remedy and the right simultaneously.  

  **Reasoning:**  
  1.  **Prohibition on Private Judgment:** Aquinas's core argument against private tyrannicide rests on the inherent lack of authority in a private individual to judge and execute a ruler (ST II-II, Q.42, A.2 ad 3; Q.64, A.3). This is a matter of *right order* (deontological), not merely a contingent risk assessment. The dissolution of institutions does not confer this missing authority onto private individuals; the structural prohibition persists.  
  2.  **Disorder as Inherent Evil:** Aquinas identifies sedition as intrinsically evil (ST II-II, Q.42, A.2) because it destroys the unity essential for the common good. The "worse disorder" he warns against is not merely a probable *consequence* to be weighed, but an intrinsic *evil* flowing from the act of private individuals usurping public judgment and force. This evil remains inherent regardless of the pre-existing state of institutional failure.  
  3.  **"Residual Authority" as Absent, not Transferred:** The "residual authority problem" highlights the vacuum created when all legitimate public authority capable of judging the ruler is destroyed. For Aquinas, authority isn't latent in "the people" as a collective of private individuals; it resides solely in constituted public power acting *for* the community. This vacuum annuls the *remedy* (no authority exists to act lawfully) but does *not* annul the *prohibition* on private action or the intrinsic evil of disorder. The moral weight of obedience and the duty to avoid chaos bind precisely *because* no legitimate authority exists to sanction violence.  
  4.  **No Permissible "Last Resort":** Aquinas explicitly states that only a *public authority* can act against a tyrant, even a legitimate one turned oppressive (ST II-II, Q.42, A.2 ad 3). His condition of exhausting institutional remedies is directed *only* at such public authority (e.g., lesser magistrates acting within their competence or the community acting *through its remaining legitimate structures*). When *all* such structures are destroyed, the condition for *public* action vanishes entirely. Private action remains categorically forbidden because the act itself violates the fundamental principle of legitimate authority and inherently produces the disorder it seeks to end. The tragedy is that the means of lawful redress are lost without legitimizing unlawful ones.
