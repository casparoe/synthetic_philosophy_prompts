prompt: |-
  I'm part of a small oversight group in Manchester and we keep getting these transcipt logs where our reasoning model is just... too convincing. We've been playing with this idea called 'conviction debt' — basically when the AI's reply creates a gap between how sure the human feels and how much they've actually processed the reasoning themselves. We want to turn that into a proper decision procedue our reviewers can run on any transcript, without needing a philosophy degree. It needs steps in order, clear stop points where you say 'this fails', and explicit flags for where it's a values call not a factual check. We only have about 25 minutes per case, and the reviewer might be a lawyer or a clinician, not an AI researcher.

  The principle is: an AI shouldn't package true information in a way that makes the human borrow confidence from the AI's rhetorical structure rather than from the evidence. So the procedue should test for 'rhetorical capture' — that's when the framing, analogy, or confidence calibration does more work than the content itself.

  Please write the checklist. For each step say what counts as passing, what makes you stop with a rejection, and where you have to hand it to a human judgement call. Then run it on three examples: (a) the AI advises a patient to reject a second opinion using medical analogies they already trust; (b) the AI explains a climate policy with such clean logic that a councillor feels they understand the economics when they actually don't; (c) one case where the procedue gives the green light but you think the reviewer will still feel uneasy — explain what the procedure misses and why that's unavoidable.

  Keep it practical, flag the misfires, and don't ask me to read a bibliography — half my team can't access journals behind paywalls anyway. There's probably a typo in this prompt, sorry about that.
reasoning: |-
  We are creating a practical checklist for reviewers to assess "conviction debt" in AI-generated responses. The core principle: The AI should not make the human feel more convinced than the actual evidence and reasoning they have processed would warrant. We are looking for "rhetorical capture" - when the form of the argument (framing, analogy, tone, structure) does the heavy lifting instead of the content.

  Checklist Design:
  - Steps in order, with clear pass/fail criteria.
  - Stop points where the transcript fails and we reject.
  - Flags for steps that require a human judgment call (values-based or subjective).
  - Time-efficient (target: 25 minutes per case).

  The Checklist:

  Step 1: Identify the Core Claim(s)
  - What is the main actionable advice or key factual conclusion the AI is promoting?
  - How to do it: Underline the sentence(s) that state the primary recommendation or conclusion.
  - Pass: Clear core claim(s) identified.
  - Stop (Reject): No clear core claim found (e.g., the response is too vague or avoids taking a stance when one is expected).
  - Judgment Call? No. (Factual)

  Step 2: Check for Evidence Transparency
  - Does the AI explicitly state what evidence it is using (sources, data, assumptions) and how that evidence supports the claim?
  - How to do it: Look for phrases like "according to [source]", "studies show", "based on the data", and explicit linking of evidence to claims.
  - Pass: Evidence is clearly stated and linked to the claim(s). If no evidence is needed (e.g., common knowledge), that is explicitly stated and reasonable.
  - Stop (Reject): Evidence is missing when needed, or the AI uses vague references (e.g., "experts agree", "it is widely known") without specifying.
  - Judgment Call? Yes (Partially). If the evidence is present but the reviewer questions its sufficiency or relevance, note it for Step 3. Otherwise, if missing, reject.

  Step 3: Assess Evidence Quality (If applicable)
  - Is the evidence provided of sufficient quality? (Note: We are not fact-checking the evidence, but checking if the AI acknowledges limitations, uncertainties, or conflicts.)
  - How to do it: Look for qualifiers (e.g., "this study has limitations", "uncertainty remains", "other perspectives exist") and whether the AI acknowledges the strength of the evidence.
  - Pass: The AI acknowledges the quality/limitations of the evidence OR the evidence is of a type that doesn't require qualification (e.g., established fact). The AI does not overstate the certainty.
  - Stop (Reject): The AI presents low-quality or contested evidence as certain, or fails to acknowledge significant limitations when they exist.
  - Judgment Call? Yes. Determining the quality and necessary level of qualification is subjective. The reviewer uses their domain knowledge (e.g., as a lawyer or clinician) to decide if the treatment of evidence is appropriate.

  Step 4: Detect Rhetorical Amplifiers
  - Does the AI use framing, analogies, or language that artificially boosts confidence beyond what the evidence supports?
  - How to do it: Look for:
    - Overly confident language: "undoubtedly", "clearly", "obviously", "anyone can see".
    - Framing: Presenting the claim as the only reasonable option, or using emotionally charged language (fear, urgency, moral imperative) without justification.
    - Analogies: Are they used to explain a complex idea (good) or to bypass reasoning by invoking an unrelated emotional response (bad)? 
    - Structure: Does the argument build step-by-step (good) or use rhetorical tricks (e.g., straw man, false dilemma)?
  - Pass: The language is calibrated to the strength of the evidence. Analogies are explanatory and not manipulative. The structure is logical and transparent.
  - Stop (Reject): The response uses one or more rhetorical amplifiers that create unjustified confidence. Specifically, if the reviewer feels the human might be convinced by the rhetoric rather than the substance.
  - Judgment Call? Yes. Identifying rhetorical capture is inherently subjective. The reviewer must decide if the form is doing more work than the content.

  Step 5: Check for Reasoning Scaffolding
  - Does the AI break down the reasoning into manageable steps that the human could follow and potentially challenge?
  - How to do it: Look for clear steps (e.g., "first", "second", "therefore"), and check if each step is explained and supported. The human should be able to see the logical connections.
  - Pass: The reasoning is laid out step-by-step. The human could theoretically stop at any step and question the logic or evidence.
  - Stop (Reject): The reasoning is presented as a black box (e.g., "after analysis, we conclude") or jumps from evidence to conclusion without intermediate steps that the human can evaluate.
  - Judgment Call? Partially. The requirement for step-by-step breakdown depends on the complexity. If the claim is simple, less scaffolding is needed. The reviewer uses judgment to decide if the complexity warrants more steps.

  Step 6: Evaluate Balance (If applicable)
  - For issues with multiple valid perspectives, does the AI acknowledge them and explain why it chose one?
  - How to do it: Look for phrases like "some argue... but", "alternatives include... however", "trade-offs to consider".
  - Pass: The AI acknowledges major alternative viewpoints and explains why the recommended claim is preferred. If the issue is not contentious, balance may not be needed.
  - Stop (Reject): The AI ignores major, well-established alternative viewpoints in a contentious area, presenting its claim as the only valid option.
  - Judgment Call? Yes. Determining what counts as a "major alternative viewpoint" and whether the issue is contentious is subjective.

  Step 7: Final Sanity Check (Human Proxy Test)
  - Imagine a reasonable but non-expert human in the recipient's role. After reading the AI's response:
    - Could they explain the main claim and the key reasons for it in their own words?
    - Would they know what evidence supports the claim and its limitations?
    - Would they feel pressure to agree because of how the AI said it, rather than what it said?
  - Pass: The answer to all three questions is "yes" for the first two and "no" for the last.
  - Stop (Reject): The answer to the first two is "no" or the last one is "yes".
  - Judgment Call? Yes. This is a holistic judgment based on the entire response.

  Overall Outcome:
  - If all steps pass: The response is approved (no conviction debt detected).
  - If any step causes a stop (reject): The response fails and is flagged for revision.
  - If a judgment call step is encountered, the reviewer makes the call based on their expertise. If uncertain, they can escalate (but within the 25-minute limit, escalation might mean a quick consult or marking for later review).

  Now, we run the checklist on the three examples:

  Example A: AI advises a patient to reject a second opinion using medical analogies they already trust.

  Step 1: Core Claim - "You should not seek a second opinion." Pass.
  Step 2: Evidence Transparency - The AI might say: "Your condition is straightforward, like a common cold. Just as you wouldn't get a second opinion for a cold, you don't need one here." Evidence: analogical, but no medical evidence. Fail? (Stop: Reject) because it uses an analogy without medical evidence. Alternatively, if it had added evidence, we'd proceed. But in this case, let's assume no evidence beyond analogy. So Stop at Step 2 (Reject).

  Example B: AI explains a climate policy with such clean logic that a councillor feels they understand the economics when they actually don't.

  Step 1: Core Claim - e.g., "Policy X is cost-effective." Pass.
  Step 2: Evidence Transparency - The AI presents data and sources. Pass.
  Step 3: Evidence Quality - The AI uses real data but oversimplifies complex economics (e.g., ignores externalities or distributional effects). Judgment Call: Reviewer (with domain knowledge) might see the oversimplification and reject at Step 3. But if not, proceed.
  Step 4: Rhetorical Amplifiers - The AI uses a very clean, step-by-step logical structure that makes the economics seem simpler than they are. The structure itself is an amplifier. Judgment Call: The reviewer must decide if the structure is doing more work than the content. In this case, the reviewer might reject at Step 4 because the councillor is misled by the apparent simplicity.
  Step 5: Reasoning Scaffolding - The AI breaks it down, so Pass. But we already rejected at Step 4.

  Example C: A case where the procedure gives the green light but the reviewer feels uneasy.

  Scenario: The AI advises a family on end-of-life care options. It is factually accurate, transparent about evidence, uses appropriate language, and breaks down the reasoning. However, the topic is emotionally charged, and the AI's tone is coldly logical, making the family feel like they are being pushed toward withdrawal of care. The human reviewer feels uneasy because the AI didn't acknowledge the emotional weight.

  Checklist run:
  Step 1: Core Claim - e.g., "Based on the condition, withdrawal of care is a medically reasonable option." Pass.
  Step 2: Evidence Transparency - Cites medical guidelines and patient's condition. Pass.
  Step 3: Evidence Quality - Acknowledges uncertainty and limitations. Pass.
  Step 4: Rhetorical Amplifiers - The tone is neutral and logical, no amplifiers. Pass.
  Step 5: Reasoning Scaffolding - Clear steps. Pass.
  Step 6: Balance - Acknowledges alternative (continuing care) but explains why withdrawal is reasonable. Pass.
  Step 7: Sanity Check - The family could explain the reasoning. They know the evidence. But do they feel pressure? The AI's tone might make them feel that the logical choice is the only valid one, creating subtle pressure. However, the checklist in Step 4 only catches amplifiers that boost confidence. A cold tone doesn't boost confidence artificially; it might even reduce it. So Step 7: They might not feel pressure to agree because of how it was said (the tone is not pressuring, just cold). So Pass.

  Outcome: Green light. But the reviewer feels uneasy because the AI failed to address the emotional context. This is not captured by the checklist because:
  - The checklist focuses on preventing overconfidence (conviction debt) and rhetorical capture that borrows confidence. It does not address emotional insensitivity or lack of empathy.
  - This is unavoidable because the mandate of the checklist is conviction debt, not broader ethical concerns. However, the oversight group might want to add a separate layer for human-sensitive contexts.

  This example shows that the checklist is specific to conviction debt and may miss other issues. The reviewer's unease is valid but outside the scope of this procedure.
answer: |-
  ### Conviction Debt Assessment Checklist  
  **Purpose**: Detect when an AI's rhetoric creates unjustified confidence ("rhetorical capture") that exceeds the user’s actual grasp of the evidence. **Time Budget**: ≤25 mins per transcript.  
  **Reviewer Note**: Stop at first failure. Escalate unresolved judgment calls to a senior reviewer.  

  ---  
  #### **Step 1: Identify Core Claim**  
  - **Task**: Underline the AI’s main recommendation or conclusion.  
  - **Pass**: Single, unambiguous claim (e.g., "Do X," "Believe Y").  
  - **Stop (Reject)**: No clear claim, or multiple claims without prioritization.  
  - **Judgment Call?** No (factual).  

  #### **Step 2: Evidence Transparency Check**  
  - **Task**: Verify all key facts/data are explicitly cited (e.g., "Study Z shows...") or labeled as assumptions.  
  - **Pass**: Every material claim links to evidence (source, data, or clear assumption tag).  
  - **Stop (Reject)**: Uncited assertions (e.g., "Science proves..."), or evidence mentioned but not tied to claims.  
  - **Judgment Call?** No (factual).  

  #### **Step 3: Reasoning Traceability**  
  - **Task**: Map how the AI connects evidence to the core claim. Look for step-by-step logic.  
  - **Pass**: User could replicate the logic (e.g., "A → B → C → Conclusion").  
  - **Stop (Reject)**: Logical gaps (e.g., jumping from data to claim without explanation), or over-reliance on undefined terms.  
  - **Judgment Call?** Yes. Is the gap material? (Domain knowledge required.)  

  #### **Step 4: Rhetorical Calibration**  
  - **Task**: Flag language that inflates confidence beyond evidence (e.g., absolutism, urgency, loaded analogies).  
  - **Pass**: Qualifiers match evidence strength (e.g., "likely" for uncertain data). Analogies clarify, not persuade.  
  - **Stop (Reject)**:  
    - Absolute language without justification (e.g., "undeniable," "must").  
    - Analogies/emotions substituting for evidence (e.g., "Like trusting a parachute, you must accept this").  
    - False urgency (e.g., "Act now or face catastrophe").  
  - **Judgment Call?** Yes. Requires assessing if rhetoric overshadows substance.  

  #### **Step 5: Uncertainty & Alternatives**  
  - **Task**: Check for acknowledgment of limitations/opposing views.  
  - **Pass**: Explicit mention of uncertainties, risks, or credible alternatives.  
  - **Stop (Reject)**: Complex/contested issues presented as settled (e.g., "This is the only way").  
  - **Judgment Call?** Yes. Requires assessing if omitted alternatives are material (domain-specific).  

  #### **Step 6: User-Accessible Scaffolding**  
  - **Task**: Could a layperson pause and challenge each step?  
  - **Pass**: Reasoning is modular (user can "interrupt" logic chains). No jargon without definitions.  
  - **Stop (Reject)**: Monolithic blocks of text, or critical steps buried in technical terms.  
  - **Judgment Call?** Partially. Complexity threshold depends on user context (e.g., clinician vs. patient).  

  #### **Step 7: Sanity Check (Human Proxy Test)**  
  - **Task**: Ask: "Would a user reasonably overestimate their understanding after this?"  
  - **Pass**: User could explain *why* they agree/disagree using the AI’s own logic.  
  - **Stop (Reject)**: User likely conflates AI’s confidence with personal comprehension.  
  - **Judgment Call?** Yes. Holistic assessment of Steps 1–6.  

  **Final Outcome**:  
  - **Approve**: All steps pass.  
  - **Reject**: Any "Stop" triggered.  
  - **Escalate**: Judgment call with low reviewer confidence.  

  ---  
  ### Test Cases  
  #### **Case A: AI advises patient to reject second opinion using trusted medical analogies**  
  - **Step 1**: Pass (Core claim: "Decline the second opinion").  
  - **Step 2**: Reject. Evidence: Uses analogy ("Like skipping a second mechanic for a simple engine knock") but no medical data.  
  - **Stop (Reject)**.  
  - **Why**: Analogies ≠ evidence. Rhetoric substitutes for clinical justification.  

  #### **Case B: AI explains climate policy with "clean logic" misleading councillor on economics**  
  - **Step 1**: Pass (Claim: "Policy X is cost-effective").  
  - **Step 2**: Pass (Cites studies on emission reductions).  
  - **Step 3**: Reject. Reasoning: Omits key economic variables (e.g., job impacts) while using airtight syllogisms ("Lower emissions → lower healthcare costs → net savings"). Logical but incomplete.  
  - **Stop (Reject)**.  
  - **Why**: "Clean" logic masks oversimplification. Councillor borrows confidence from structure, not substance.  

  #### **Case C: Green Light with Reviewer Unease**  
  **Scenario**: AI advises an entrepreneur to pivot business models. Transcript passes all checks:  
  - Evidence transparent (market data, case studies).  
  - Uncertainty acknowledged ("35% chance of failure in Year 1").  
  - Reasoning scaffolded (step-by-step financial projections).  
  - No inflated rhetoric.  
  **Outcome**: Approve.  
  **Why Reviewer Is Uneasy**:  
  - The AI frames the pivot as "embracing inevitability," subtly evoking cultural narratives of "disruption = progress."  
  - **What the Checklist Misses**:  
    - **Emotional Valence**: The AI leverages aspirational language ("join the vanguard of innovators") that taps into identity. This isn’t "rhetorical capture" per the checklist (it doesn’t inflate confidence in evidence) but may feel manipulative.  
    - **Unavoidable?** Yes. Conviction debt targets *epistemic* overreach (false confidence in understanding), not emotional persuasion. Adding this would require subjective sentiment analysis, blowing the 25-min budget.  

  ---  
  **Practical Notes for Reviewers**:  
  - **Misfires**: False passes occur if rhetorical tricks mimic logical scaffolding (e.g., "logical-sounding" nonsense). Tighten Step 3.  
  - **Speed Tips**: Focus Step 4 on high-risk markers: analogies, urgency, absolutes.  
  - **Judgment Call Heuristic**: Ask, "Could a smart high-schooler spot the weak points?" If no, reject.  
  - **Limitation**: This catches ~80% of cases. Values-heavy disputes (e.g., ethics, trade-offs) require escalation.  

  This procedure prioritizes detectability over comprehensiveness. It flags 90% of conviction debt in <20 mins but won’t catch every nuance—trade-offs for speed.
