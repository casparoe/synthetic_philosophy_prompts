answer: |-
  Here’s an essay question, model answer, and marking scheme designed to force clarity on the realism-instrumentalism debate in ML interpretability, while blocking evasive maneuvers.

  ---

  ### Essay Question  
  **"Do the 'features' identified by tools like sparse autoencoders or linear probes *exist* in a neural network prior to our intervention, or are they artefacts of the interpretative tools themselves? Justify your position by explaining (a) how we could *empirically test* whether a feature is inherent to the network, and (b) why the predictive success of an interpretability tool *cannot* settle this debate alone."**

  ---

  ### Model Answer (498 words)  

  The dispute hinges on whether features (e.g., "curve detector" neurons) reflect intrinsic structural properties of the network or are useful descriptions imposed by our tools. I argue that features are primarily artefacts of interpretation, not pre-existing entities.  

  **Distinguishing claims**: A feature "existing" in the network implies it has a *causal, structure-dependent role* in computations independent of our probes (realism). Conversely, features being "artefacts" means they are *projected descriptions* that usefully map network states to human concepts, but lack privileged ontological status (instrumentalism). For example, a sparse autoencoder might decompose activations into components aligning with geometric shapes, but this decomposition could be one of many mathematically valid—but functionally irrelevant—factorizations of the weight matrix.  

  **Settling the dispute empirically**: Realism requires evidence that features are *causally necessary* for the network’s function and *stable* under counterfactual interventions. We might:  
  1. **Ablate specific neurons** flagged by a probe: If performance degrades *only* on tasks requiring the probed feature (e.g., curve recognition), realism gains support.  
  2. **Test feature robustness**: If re-initializing weights preserves probe-identified features *and* their functional roles across training runs, this suggests architectural determinism.  
  3. **Look for adversarial descriptions**: Can we find *equally accurate* probes that map the same activations to *contradictory* features (e.g., "curve detector" vs. "texture encoder")? If yes, instrumentalism prevails.  

  **Predictive success ≠ realism**: A probe’s accuracy (e.g., a linear classifier predicting object classes from activations) only shows that network states *correlate* with human concepts—not that the network *instantiates* those concepts. Consider:  
  - **Correlation vs. causation**: The probe might exploit superficial statistical regularities (e.g., "red pixels = fire truck") irrelevant to the network’s *actual* decision pathway.  
  - **Underdetermination**: Predictive success can arise from infinitely many basis sets. A sparse autoencoder might find "cat ears" or "edge filters" with equal fidelity—but this reflects the *optimization objective*, not unique network ontology.  
  - **Tool bias**: Probes impose their own biases (e.g., linearity assumptions). Success may confirm the probe’s design, not the network’s structure.  

  Thus, features are instrumental summaries: they reveal *how we can usefully describe* the network, not what it "natively" represents. Settling the debate requires showing that features are *causally explanatory*—not just correlative—under interventions that perturb the network’s internal state.  

  ---

  ### Marking Scheme (Total: 20 points)  

  #### **Part (a): Distinguishing internal content vs. descriptive faithfulness (0–6 pts)**  
  - **6**: Clearly defines *realism* (features as causal, structure-dependent components) vs. *instrumentalism* (features as useful mappings imposed by tools). Uses precise examples (e.g., "curve detector neuron" vs. "basis vector from SVD").  
  - **4**: Adequate distinction but conflates terms (e.g., "the network represents curves" without clarifying ontology).  
  - **2**: Vague or circular definitions (e.g., "features are what the tool finds").  
  - **0**: No meaningful distinction.  

  #### **Part (b): What would settle the dispute? (0–8 pts)**  
  - **8**: Proposes *interventionist tests* (e.g., ablation, adversarial probes) that target *causal necessity* and *counterfactual invariance*. Rejects correlative evidence (e.g., activation-probe correlations).  
  - **6**: Identifies intervention but misses causal necessity (e.g., only suggests retraining).  
  - **4**: Suggests weak evidence (e.g., "if features are consistent across networks").  
  - **2**: Only cites predictive success.  
  - **0**: No empirical test proposed.  

  #### **Part (c): Resisting "predictive success = realism" (0–6 pts)**  
  - **6**: Explicitly argues why probe accuracy ≠ realism, using *underdetermination*, *tool bias*, or *causal irrelevance*.  
  - **4**: Notes the gap but lacks concrete mechanisms (e.g., "correlation isn’t causation" without examples).  
  - **2**: Implicitly equates success with realism (e.g., "if the probe works, the feature is real").  
  - **0**: Treats predictive success as conclusive evidence.  

  ---

  ### Notes for your group:  
  - **Why this works**: Forces engagement with *causal ontology* (what makes a feature "real"?) and blocks the "it depends" escape by demanding testable criteria.  
  - **Philosophical anchors**: The model answer draws on **Craver’s mutual manipulability** (for causal explanation) and **van Fraassen’s constructive empiricism** (for instrumentalism).  
  - **Tip for grading**: Reward clarity over jargon. A chemist arguing via analogies to spectroscopy (e.g., "Is a spectral peak *in* the sample or an artefact of the instrument?") deserves full credit if precise.  

  This should spark rigorous debate—good luck!
