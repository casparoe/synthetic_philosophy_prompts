  First, I need to recall the key elements of the institutional habit described. Parties track individual votes internally, assign scores, and tie those scores to resources like committee positions and budgets. The aggregate "unity ratings" are public, positioning the party as the mandate-bearer. The user is questioning if this system treats individual judgment as mere noise, needing filtration through collective will.

