prompt: |-
  Longtime rationalist-blog reader here, kicking around something from the cross-cultural philosophy-of-mind debates and hoping someone can put a name on it, or tell me there isn't one.

  The pattern: someone claims a philosophical intuition is universal — not a theorem, just one of those "everyone finds X" claims. Then a study shows that when you translate the standard vignette into another language and run it on, say, undergraduates somewhere else, their answers split differently. And the person who wanted universality doesn't update; instead they say the translation didn't preserve the relevant nuance, or the participants weren't answering the question as a question about the concept rather than as a practical matter, or they lacked the training to use the terms in the stipulative way. So the claim starts out as "the folk concept is universal" and ends up as "the concept is universal among competent speakers," where competent speaker is defined after the fact by whatever group gives the original answer.

  Concretely: in the classic justification-by-luck case — a man has very good evidence for a belief, the belief is true, but only because of a lucky coincidence — people in some non-Western samples are apparently much more likely to say he "doesn't know" than American students are. The universalist's first move is usually that the translated word for "justified" carries a stronger or weaker connotation. Fair enough, sometimes. But it would definetly be suspicious even if no translation problem could be found, wouldn't it? The same move shows up with the name-thief case: a man steals a discovery and publishes it under his own name, and when you ask who the name refers to, speakers of some languages disagree with the standard Western answer. The reply is that the question doesn't track "reference" in the techical sense, or that respondents are answering about credit, not naming.

  Is there an established term for this exact move — the post-hoc restriction of the population whose intuitions count, used to protect a universality claim from cross-cultural evidence? It's adjacent to No True Scotsman and a bit to moving the goalposts, but the tricky part is that the restriction is sometimes legitimate: some translations really are bad, and some survey questions really do confound what's being tested. So I'm not just after a label; I want the carve. Under what conditions is this a legitimate competence objection, and under what conditions is it just immunizing the claim against evidence? If there's no standard term, give me one with a definition and boundary cases.
reasoning: |-
  Okay, the user is a longtime reader of rationalist blogs and is diving into cross-cultural philosophy of mind debates. They're noticing a pattern where someone claims a philosophical intuition is universal, but when studies in other cultures show different results, the original claimant dismisses it by saying the translation was bad or the participants weren't competent. The user wants to know if there's a term for this move and how to distinguish legitimate concerns from dodging evidence.

  First, I need to recall if there's an established term for this. The examples given are the justification-by-luck case and the name-thief case. The universalist responds by narrowing the definition of "competent speakers" after seeing conflicting data. It's similar to No True Scotsman but more specific because it involves expertise in language or concepts.

  The user mentions adjacent concepts like No True Scotsman and moving the goalposts, but they need something more precise. The key here is that sometimes the objections about translation or competence are valid, so the challenge is to differentiate between legitimate methodological critiques and immunizing strategies.

  Looking into philosophical methodology, there might not be a single term. However, "Competence/Performance Distinction" is used in linguistics and philosophy. Chomsky's idea separates underlying competence from actual performance, which can be affected by errors. Applied here, universalists might claim that non-Western participants' responses are performance errors, not reflecting true competence.

  Another term could be "Intuition Elitism" or "Expertise Restriction," but they're not standardized. "Conceptual Competence Restriction" might work. The user also needs criteria to judge when such a move is legitimate. Factors include independent evidence for translation issues, whether the restriction was pre-registered, cross-cultural validation of concepts, and if the same pattern appears across multiple studies.

  The user's deeper need is to have a framework to critique claims of universality in philosophy of mind, especially when confronted with cross-cultural data. They might be involved in academic debates or writing, so providing a clear term and criteria would help them articulate their arguments better. They might also want to prevent Western-centric biases in philosophical claims by having tools to assess when objections are valid versus defensive.
answer: |-
  Based on your description, you've perfectly identified a pervasive and problematic move in cross-cultural philosophy and experimental philosophy (X-phi). While there isn't a single, universally agreed-upon *term* for this *exact specific move*, it's widely recognized and criticized. Here's the breakdown:

  1.  **The Core Move & Adjacent Concepts:**
      *   **Competence/Performance Distinction Exploitation:** This is the most direct conceptual framework it operates within. Originally from linguistics (Chomsky), it distinguishes underlying linguistic competence (knowledge of rules) from performance (actual use, prone to error/distraction). Philosophers adapted it to conceptual competence vs. performance errors in intuition. The problematic move **exploits** this distinction *post-hoc* to dismiss inconvenient data by attributing it solely to performance limitations (bad translation, pragmatic interpretation, lack of training) rather than genuine differences in conceptual competence.
      *   **Intuition Elitism / Expertise Restriction:** This describes the *consequence* – defining "competent" users restrictively (often implicitly as "those who agree with the dominant Western view" or "those trained in analytic philosophy") after seeing the data.
      *   **Methodological Solipsism (in X-phi Context):** Insisting that only intuitions gathered under highly idealized, context-stripped, or "philosophically purified" conditions using perfect translations count, effectively isolating the concept from how it functions naturally in diverse linguistic/cultural contexts.
      *   **Immunizing Strategy / Ad Hoc Rescue:** Describes the *function* – protecting the universality claim from falsification by adding auxiliary hypotheses *after* contradictory evidence arises.
      *   **Adjacent but Distinct:**
          *   **No True Scotsman (NTS):** Very close! NTS redefines the category membership ("No *true* Scotsman...") to exclude counterexamples. This move redefines "*competent* user" to exclude counterexamples. **The key difference:** NTS is often arbitrary redefinition of group membership. This move *borrows legitimacy* from the plausible (but often misapplied) competence/performance distinction in linguistics/philosophy of language. It's NTS *disguised as methodological rigor*.
          *   **Moving the Goalposts:** Also close. The goalpost moves from "folk intuition" to "intuition of competent users (as we now define them)". The difference is subtle; goalpost moving is broader, while this is a specific *type* of goalpost moving leveraging conceptual competence.
          *   **Stipulative Dodge:** Defining the technical term so narrowly after the fact that the empirical data becomes irrelevant ("They weren't answering about *reference* in the *strict philosophical sense*").

  2.  **Proposed Term: "Post-Hoc Competence Restriction" (PHCR)**
      *   **Definition:** The move of defending a claim about the universality of a concept or intuition by attributing conflicting cross-cultural or demographic data to a lack of conceptual or linguistic *competence* on the part of the respondents, where the criteria for competence are defined or significantly refined *after* encountering the conflicting data, and primarily serve to exclude those whose intuitions differ.
      *   **Key Elements:** Post-hoc definition of competence, attribution of difference to performance error/lack of competence, protection of universality claim, leveraging (often illegitimately) the competence/performance distinction.

  3.  **The Carve: Legitimate Concern vs. Immunizing PHCR**

      **Legitimate Competence/Objection (Methodological Critique):**
      *   **Pre-Registered or Independently Motivated:** Concerns about translation ambiguity, confounding factors (pragmatics, credit vs. reference), or required training are raised *before* seeing results or based on *independent linguistic/cultural evidence*.
      *   **Specific & Testable:** The objection points to a *specific, identifiable flaw* in the stimulus (e.g., "Word X in Language Y *always* implies moral blame, contaminating the epistemic question") that can be investigated and potentially corrected.
      *   **Predictive Power:** The objection explains *why* the specific pattern of divergence occurred (e.g., "Because 'know' in Language Z has a higher justification threshold, we predicted lower 'knowledge' attribution in luck cases").
      *   **Cross-Cultural Validation of Concepts:** Effort is made to establish *independently* (e.g., through other linguistic tasks, ethnographic work) that the core concept *is* present and relevant in the other culture/language, and the objection is about *this specific probe*.
      *   **Sensitivity to Replication:** If the divergence persists across multiple, carefully designed studies addressing the initial objections, the universality claimant *updates*.

      **Immunizing PHCR (The Problematic Move):**
      *   **Post-Hoc & Motivated:** The competence restriction is *only* invoked *after* seeing disagreeable results, primarily to salvage the universality claim.
      *   **Vague & Untestable:** Competence is defined vaguely ("true grasp", "philosophical sense") or circularly ("competent users are those who share the 'correct' intuition"). The criteria aren't independently measurable.
      *   **Ad Hoc & Unfalsifiable:** Each new counterexample is dismissed with a *new*, situation-specific competence objection (e.g., "Translation issue here," "Pragmatic interference there," "Different concept over there") without a unifying, predictive principle. The universality claim becomes unfalsifiable.
      *   **Lack of Independent Validation:** No effort is made to show the concept *is* universally shared *except* by defining competence based on agreement with the original intuition. There's no independent evidence the "incompetent" group lacks the concept altogether.
      *   **Ignores Replication:** The move is repeated even when subsequent studies control for the initially raised objections or show consistent divergence.
      *   **Goalpost Redefinition:** Shifts the claim from "folk concept" to "concept among philosophically trained Westerners" or "concept under perfect stipulation" without acknowledging this significantly changes the original claim.

  4.  **Boundary Cases:**
      *   **Clear Legitimate:** A pre-study linguistic analysis shows the key term in the target language has a primary meaning unrelated to the philosophical concept (e.g., translating "belief" with a word primarily meaning "religious faith"). Fixing *this specific* issue yields convergence.
      *   **Clear PHCR:** After finding divergence in the name-thief case, claiming "They weren't answering about *reference*, they were answering about *credit*" *without* showing linguistic evidence that the question *must* be interpreted as about credit, or showing that the culture *lacks* a concept of reference separate from credit. Especially if the same move wasn't applied to the original sample.
      *   **Gray Area (Likely PHCR):** Finding divergence in justification-by-luck, then claiming the translation of "justified" is slightly off *without* specific linguistic evidence, *and* rejecting follow-up studies that use alternative phrasings showing the same divergence pattern. The objection isn't specific/testable enough.
      *   **Gray Area (Debatable):** Insisting on "philosophical training" to grasp the precise thought experiment. Is this a legitimate requirement to access the *stipulated* concept, or an elitist PHCR dismissing folk intuitions? Depends on the *original claim*. If the claim was about *pre-theoretical folk intuition*, requiring training is PHCR. If the claim was about the *stipulated concept within a technical debate*, training might be legitimate (but universality claims about such technical concepts are rarer and different).

  **Conclusion:**

  The move you describe is most precisely understood as an **exploitation of the Competence/Performance Distinction** for immunizing purposes, often manifesting as **Post-Hoc Competence Restriction (PHCR)**. It's a specific form of *ad hoc* rescue that borrows legitimacy from linguistics but applies it illegitimately and post-hoc.

  The carve hinges on **motivation, timing, specificity, testability, and independent evidence**. Legitimate methodological critiques are prospective, specific, testable, and based on independent grounds. PHCR is retrospective, vague, untestable, circular, and primarily motivated by preserving the original universalist claim against countervailing evidence. The persistence of divergence despite addressing initial methodological concerns is a major red flag for PHCR.

  Your examples (justification-by-luck, name-thief) are textbook cases where PHCR is frequently deployed. Recognizing this pattern is crucial for critically evaluating claims about the universality of philosophical intuitions.
