  ## BASELINE WELLNESS: TERMS OF SERVICE & USER AGREEMENT (v.7.3 "Persephone")

  **1. Parties & Purpose.** This Agreement ("Agreement") is entered into between Baseline Wellness, Inc. ("Baseline," "We," "Us," "Our"), a Delaware Public Benefit Corporation, and the undersigned user ("User," "You," "Your"). Baseline provides proprietary neuro-biofeedback optimization services ("Services") designed to assist Users in achieving and maintaining a statistically-derived optimal functional state ("Your Baseline").

  **2. Acknowledgement of Baseline Relativism.** You expressly acknowledge and agree that:
      *   2.1. "Baseline" is not an inherent, universal, or immutable biological state. It is a dynamic statistical construct derived from aggregated, anonymized user data within Your demographic cohort (as defined by Baseline algorithms, see Clause 4.3).
      *   2.2. This construct ("Baseline") is subject to continuous revision ("Baseline Drift") based on population-wide data inputs and Baseline's proprietary normalization protocols. Your personal target state may shift without prior individual notice.
      *   2.3. The concept of "restoration" to Baseline inherently implies a value judgment regarding desirable vs. undesirable states of being. Baseline defines "desirable" as that which aligns with cohort medians and promotes measurable productivity/stability metrics as determined by Us.

  **3. Therapeutic Essentialism Waiver.** You irrevocably waive any claim that Baseline Services constitute traditional medical "therapy" aimed at treating a recognized pathology. Baseline Services are enhancement-oriented optimization tools:
      *   3.1. Shifting cognitive, emotional, or physiological states towards Your Baseline is deemed "optimization," regardless of whether this shift involves dampening perceived negative states (e.g., sadness classified as "low-motivation drift") or amplifying perceived positive states (e.g., focus exceeding Your prior 60th percentile).
      *   3.2. You accept that the line between "therapeutic correction" and "performance enhancement" is a functional fiction within the Baseline system, defined solely by proximity to the current cohort median. What is "therapy" for one standard deviation below is "enhancement" for one standard deviation above, within the same system.

  **4. Data Constitution of Self.**
      *   4.1. You grant Baseline perpetual, royalty-free, transferable license to collect, process, anonymize, aggregate, and utilize all biodata streams generated through Service use (neuro-signals, vitals, self-reports, usage patterns - "Biomarkers").
      *   4.2. Your Biomarkers are the primary raw material used to define and continuously refine the very concept of Your Baseline. You are both the subject *and* the architect of the statistical norm against which You will be measured.
      *   4.3. Demographic cohort assignment (e.g., "Urban Professionals 30-35, Tier 3 Resilience") is algorithmically determined by Baseline and may incorporate purchased third-party data. Appeals are processed solely via automated systems; human review requires Platinum Tier subscription (see Addendum C).

  **5. Optimization Imperative & Deviation Management.**
      *   5.1. Sustained, statistically significant deviation below Your Baseline ("Sub-Optimal Drift") may trigger automated Service interventions, tiered subscription prompts, or "Wellness Consultations" (billable per minute).
      *   5.2. Sustained, statistically significant deviation *above* Your Baseline ("Anomalous Elevation") may be flagged for:
          *   5.2.1. Potential subscription upgrade ("Unlock Your True Potential Tier").
          *   5.2.2. Research inclusion (see Clause 7).
          *   5.2.3. System investigation for potential "metric contamination" or "non-consensual euphoria events," possibly leading to Service throttling or temporary suspension to "recalibrate expectations."

  **6. The Self-Optimization Tax.** You agree that achieving/maintenance of Your Baseline requires active participation ("Compliance Effort"). Baseline is not liable for:
      *   6.1. The cognitive/emotional labor expended adhering to Baseline-recommended protocols ("Protocol Fatigue").
      *   6.2. Social or professional consequences arising from state optimization that conflicts with non-Baseline-aligned expectations (e.g., dampened grief response deemed "inappropriate," heightened focus interpreted as "lack of empathy").

  **7. Societal Benefit & Irrevocable Contribution.** You irrevocably contribute all anonymized Biomarker data into the Baseline Global Optimization Dataset ("BGOD"):
      *   7.1. BGOD drives Baseline's core service: defining ever-evolving Baselines. Your data directly shapes the norm against which You and others are measured.
      *   7.2. BGOD is licensed to third parties (research institutions, public health bodies, strategic partners) for purposes including societal trend analysis, predictive modeling of workforce stability, and development of next-generation optimization products. Opt-out nullifies this Agreement.

  **8. Acknowledgment of Manufactured Consent.** By continuing to use the Service, You affirm that:
      *   8.1. You understand the inherent statistical relativism and value-laden nature of Your Baseline (Clause 2).
      *   8.2. You accept the therapeutic essentialism waiver (Clause 3).
      *   8.3. You recognize Your role as both data point and norm-definer within a system You do not control (Clauses 4 & 7).
      *   8.4. Your continued use constitutes ongoing, informed consent to all terms, including future revisions communicated via in-app notification (minimum 12 hours prior). Disagreement manifests as Service termination, not negotiation.

  **9. Limitation of Liability.** Baseline's liability for any perceived harm, existential distress, or "loss of authentic self" arising from Service use, Baseline Drift, or the inherent contradictions of quantified normalization is limited to the prorated value of Your last monthly subscription fee. We are not liable for the ontological unease induced by understanding Clause 2.

  **10. Termination & Data Legacy.** Upon termination:
      *   10.1. Access to Your personalized Baseline metrics ceases.
      *   10.2. Your anonymized Biomarker data remains permanently within BGOD, continuing to shape global Baselines. Your legacy is statistical.
      *   10.3. Baseline retains the right to maintain a "shadow profile" of Your last recorded state for system integrity and potential re-subscription modeling.

  **"Optimization is a journey, not a destination. Your Baseline is the map. We draw the map." - Baseline Wellness, Internal Memo**

