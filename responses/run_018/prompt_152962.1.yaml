answer: |-
  Here’s the "Aunt Hillary Partition" simulation design:

  ---

  ### 1. The Setup and Roles (198 words)
  Arrange chairs in three zones: **Core** (center grid mat), **Periphery** (outer ring), and **Aunt Hillary** (isolated corner). Assign roles:  
  - **Core (6 players)**: Maintain the rhythmic "fugue" pattern (e.g., tokens cycling positions every 2 mins). Each has a hidden envelope with simple deterministic rules (*"If token N is east, move token S west"*).  
  - **Periphery (6 players)**: Execute tasks *near* the Core grid. Their rules include subtle disruptions (*"Every 3rd round, ‘accidentally’ nudge a token off-grid"*).  
  - **Aunt Hillary (2 players)**: Sit behind a screen. Receive written "echo reports" from a moderator (e.g., *"Round 1: Token A moved North"*) delayed by 1 round. They must vocalize predictions/commands (*"Next: Token B moves East!"*) to the whole room.  

  **Key constraints**:  
  - No talking *between* Core/Periphery; only nonverbal actions.  
  - Aunt Hillary hears *only* the moderator’s summaries.  
  - All have hidden payoff cards (e.g., Core A: "+5 if red tokens cluster").  

  ---

  ### 2. Rules, Materials, and Point Scheme (248 words)  
  **Materials**:  
  - 1 large grid mat (6x6 squares), 12 colored tokens, 14 envelopes (rules + payoff cards), timer, bell, moderator notepad.  

  **Rules**:  
  - **Rounds**: 2 mins each (10 rounds total).  
  - **Core/Periphery**: On "GO," open envelopes and act *only* on local rules (no strategy talk).  
  - **Aunt Hillary**: Receives moderator’s report *after* each round; shouts commands *before* the next.  
  - **Goal**: Sustain the fugue (e.g., tokens cycle positions predictably).  

  **Point Scheme (secret; revealed in debrief)**:  
  - **Core**: +10/round if fugue holds; -5 if Hillary’s command mismatches their action.  
  - **Periphery**: +5/round if fugue *disrupts without blame*; -10 if caught "sabotaging."  
  - **Aunt Hillary**: +10 if prediction matches *next* round; -20 if fugue collapses.  
  - **Individual payoffs**: E.g., "Periphery 3: +3 if blue token exits grid."  

  **Conflict built-in**: Core tries to stabilize; Periphery profits from hidden chaos; Hillary is blamed for "bad commands."  

  ---

  ### 3. Timeline and Running Notes (148 words)  
  - **0–10 mins**: Setup roles, distribute envelopes. Stress: "No cross-group talk; Hillary only hears me."  
  - **10–40 mins**: **Rounds 1–5**. Moderator records moves, delays Hillary’s report. *Predictably*: Fugue destabilizes (Periphery nudges tokens; Core freezes). Hillary shouts frantic guesses.  
  - **40–60 mins**: **Rounds 6–10**. Let one Core player "break character" to accuse Hillary. Watch Periphery feign innocence. *Note*: If fugue briefly recovers despite errors, highlight it.  
  - **60–75 mins**: **Collapse & Debrief**. Bell rings; reveal points. Fugue likely failed.  

  ---

  ### 4. The Debrief: Mapping Moments to Ideas (252 words)  
  - **"Hillary ruined it!"** → **Homunculus fallacy**: Mistaking systemic chaos for a faulty "controller."  
  - **"But Core followed rules blindly!"** → **Eliminativism**: Reducing colony to parts misses coordination (*not* just "bag of ants").  
  - **Fugue stabilized *despite* error** → **Emergence**: Resilience without central repair (like ant trail regeneration).  
  - **Periphery’s hidden incentives** → **Teleonomic vs. teleologic**: Colony "purpose" isn’t *intended* but results from local rules (+ selection pressures).  
  - **Hillary’s delayed echoes** → **Dennett’s "intentional stance"**: We project a "mind" onto systems that *seem* goal-directed.  
  **Crucial pivot**: "When you blamed Hillary, you *felt* the need for a captain. When the fugue survived a glitch, you *felt* the ‘whole’ acting. That’s the ant-colony dilemma."  

  ---

  ### 5. Predictable Failures and Fixes (152 words)  
  **Failures**:  
  - Players elect a leader or huddle illegally → *Fix*: Moderator resets, reminds: "No strategy talks; you’re ants!"  
  - Hillary demands rulebooks → *Fix*: "You’re separated—only get echoes."  
  - Periphery overthinks sabotage → *Fix*: Use simpler disruption rules (e.g., "Move nearest token left on odd rounds").  
  - Core ignores Hillary → *Fix*: Award bonus points for matching her commands.  

  **Design fixes**:  
  - If too chaotic, add a "pheromone" rule (e.g., leave colored dots where tokens moved).  
  - If too easy, give Periphery bolder sabotage ("Remove one token randomly every 3 rounds").  

  ---

  ### 6. The Honest Gap (98 words)  
  The simulation *cannot* replicate **phenomenal experience**. Ants lack qualia; their "coordination" is mechanistic. Participants *felt* frustration, blame, and awe—but these are *observer*-projections. Stress this: "You anthropomorphized Hillary and the fugue because *you* have consciousness. The colony doesn’t. The hard question: Does ‘collective intelligence’ imply subjective experience? Our game sidesteps that—it only models *behavioral* emergence."  

  ---

  This forces them to confront the paradox physically: The "mind" they instinctively sought (Hillary) was impotent, yet the system’s resilience felt undeniably *real*.
