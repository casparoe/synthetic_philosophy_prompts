answer: |-
  Based on your stringent constraints (no dark-room reruns, no cosmic FEP, theory-only access, 3-year horizon, demand for field-restructuring impact), the following two lines of inquiry should dominate resources, with a strong argument for deprioritizing the third:

  ### Core Priorities (85% Resources)
  1.  **Priority #1: The Representational Status of FEP/PP (Your Candidate i)**  
      *   **Question:** *Can prediction-error minimization be fully reconstructed in non-representational, sensorimotor-coupling terms without sacrificing explanatory power for core phenomena (especially interoception/allostasis)?*  
      *   **Why Upstream & Foundational:** This is **the** meta-theoretical bedrock. FEP/PP is often presented with representational baggage (generative models, beliefs, precision-weighting as attention). If it *can* be fully grounded in dynamical systems theory/enactive cognition, it fundamentally alters:  
          *   **Psychiatry:** Shifts from "faulty internal models" to "maladaptive organism-environment couplings" – changing intervention targets (e.g., embodied/enactive therapies vs. cognitive restructuring *alone*).  
          *   **Robotics:** Avoids the hard problem of symbol grounding; enables direct design of adaptive sensorimotor loops without internal representations, aligning with modern embodied AI.  
          *   **Philosophy of Interoception:** Recasts interoceptive "inference" as embodied self-regulation within a niche, dissolving mind-body representation problems.  
      *   **Tractability (Theory-Only):** **High.** Philosophers of science can rigorously analyze explanatory scope, compare formalisms (e.g., FEP math vs. non-representational dynamical systems models), and identify necessary/sufficient conditions for explaining key phenomena (e.g., allostasis, perceptual learning). Modelers can build minimal formal/computational models demonstrating equivalence (or lack thereof) between representational and non-representational implementations of core FEP processes.  
      *   **Impact:** **Transformative Practice.** Resolving this dictates the *entire ontological and methodological framework* for applying FEP/PP downstream. A non-representational vindication would force psychiatry, robotics, and philosophy to abandon internalist cognitivism when using FEP. A failure would solidify its representational commitments.

  2.  **Priority #2: Psychiatric Nosology – Unification vs. Fragmentation (Your Candidate ii)**  
      *   **Question:** *Does interoceptive/allostatic inference within FEP provide a unified transdiagnostic mechanism for psychiatric disorders (e.g., via maladaptive precision weighting or generative model rigidity), or does it inevitably fragment classifications further by emphasizing idiosyncratic interoceptive miscalibrations?*  
      *   **Why Dependent & High-Impact:** This **depends critically on #1** but has massive *direct* implications for psychiatry.  
          *   If #1 supports a representational view, "unification" likely means identifying common *computational* dysfunctions (e.g., chronic high interoceptive precision leading to anxiety/psychosis).  
          *   If #1 supports a non-representational view, "unification" means identifying common *dynamical* dysfunctions in body-environment regulation loops.  
      *   **Tractability (Theory-Only):** **Moderate-High.** Requires formal modeling of:  
          *   Variational mechanisms for allostatic failure (e.g., pathological precision optimization, model rigidity).  
          *   How these map onto existing symptom clusters (DSM/ICD/RDoC).  
          *   Whether mechanisms are sufficiently generalizable across disorders vs. inherently tied to specific interoceptive aberrations.  
          Philosophers can analyze the conceptual structure of classification (lumping vs. splitting) under FEP. Crucially, this *does not require* new wet-lab data initially; it requires re-interpreting *existing* psychopathology through a rigorously defined FEP lens derived from #1, and building models to test coherence.  
      *   **Impact:** **Transformative Practice.** A successful unified account directly restructures psychiatric research (guiding biomarker search, trial design) and diagnosis (potentially simplifying categories). Failure (fragmentation) still forces a rigorous, mechanistically grounded reconceptualization away from purely syndromic classification, improving validity.

  ### Deprioritized Candidate (iii): FEP as Independent Constraint vs. Redescription
  *   **Why Deprioritize?** While philosophically deep, its *immediate downstream impact* is lower than #1 and #2.  
      *   **Impact:** Primarily **theoretical ornament.** Resolving this might refine mathematical elegance or philosophical interpretation, but it's unlikely to *change how* roboticists build models, psychiatrists diagnose, or philosophers study interoception *in practice*. Practitioners will likely use the math (FEP or standard Bayes) that works best for their problem, regardless of foundational debates about "independence."  
      *   **Tractability:** **Moderate.** Requires deep formal comparison of FEP dynamics vs. standard Bayesian inference/decision theory.  
      *   **Dependency:** Somewhat downstream of #1. If FEP is fundamentally non-representational (#1), the question of its equivalence to standard (often representational) Bayes becomes less central or even ill-posed.  
      *   **Resource Allocation:** Deserves ~15% resources (e.g., one philosopher + part-time modeler) as it informs the *interpretation* of work on #1 and #2, but isn't the engine for restructuring fields.

  ### The Meta-Question: Conceptual vs. Normative Upstream Dispute
  *   **The Core Upstream Dispute is Conceptual:** The most fundamental question is **"What *is* minimization?"** when scaling from neurons to organisms. Is it:  
      *   A literal physical process (e.g., minimizing a thermodynamic free energy)?  
      *   A formal mathematical description of adaptive dynamics?  
      *   A normative prescription for what systems *should* do to persist?  
      *This conceptual ambiguity directly feeds into Candidate (i)* – whether minimization describes mechanistic coupling or requires representational inference.  
  *   **The Normative Dispute is Secondary (but Linked):** The question "What distinguishes an explanatory model from a post-hoc gloss?" depends *entirely* on resolving the conceptual dispute.  
      *   If minimization is a literal physical process, an explanatory model must detail its implementation.  
      *   If it's a formal description, explanatory power comes from linking formalism to specific phenomena.  
      *   If it's normative, explanation requires showing how norms arise from system constraints.  
  *   **Does Settling One Render the Other Dispensable?** **No, but settling the Conceptual dispute is logically prior.** You cannot coherently address what counts as a good *explanation* of FEP until you clarify what the theory *is fundamentally claiming to describe* (the nature of minimization). Resolving the conceptual foundation makes the normative criteria for successful explanation far clearer and less contentious. The normative dispute doesn't vanish, but its terms are set by the conceptual resolution.

  ### Resource Allocation & Sequencing Recommendation (3-Year Plan)
  *   **Year 1-2 (70% Resources):** **Full assault on Priority #1 (Representational Status).**  
      *   Philosophers: Deep conceptual analysis of "minimization," "model," "representation" within FEP/PP vs. enactivist/dynamical alternatives.  
      *   Modelers: Build minimal formal/computational models demonstrating key phenomena (e.g., habituation, basic allostasis, perceptual categorization) *both* ways (representational FEP & non-representational coupling). Rigorously compare explanatory scope, assumptions, and parsimony.  
      *   **Output:** Foundational papers resolving the ontological commitments of core FEP/PP mechanics.  
  *   **Year 2-3 (70% Resources):** **Priority #2 (Psychiatric Nosology) - Building on #1.**  
      *   Philosophers & Modelers: Collaboratively define the formal structure of allostatic failure based on the outcome of #1. Map rigorously onto major psychiatric domains (e.g., mood, anxiety, psychosis). Build generative models simulating how proposed dysfunctions lead to symptom clusters.  
      *   Philosophers: Analyze implications for psychiatric classification (lumping/splitting, RDoC framework).  
      *   **Output:** Concrete proposals for restructuring psychiatric classification based on FEP mechanisms derived from #1.  
  *   **Year 1-3 (15% Resources):** **Candidate #3 (FEP vs. Bayes)**  
      *   Parallel, lower-intensity work by specialists to inform the interpretation of #1 and #2, ensuring mathematical/philosophical coherence.  
  *   **Year 3 (15% Resources):** **Synthesis & Translation.**  
      *   Explicitly draw out implications for embodied robotics (design principles derived from #1) and philosophy of interoception (consequences of #1 & #2). Produce "field guides" for psychiatry, robotics, and philosophy based on the resolved foundations.

  This plan maximizes the chance of producing field-restructuring results within 3 years by focusing on the most upstream conceptual issue (#1) and the highest-impact downstream application (#2), tightly linking them. It avoids empirical dead ends and untestable metaphysics, leveraging theoretical strengths to force clarity on foundations that *must* be settled for meaningful progress in the target domains.
