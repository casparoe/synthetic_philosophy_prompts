prompt: |-
  I'm a backend engineer with zero philosophy background, but I got roped onto our startup's Algorithmic Ethics Panel (yes, it's literally called that). We're picking the reasoning core for a clinical triage bot we're piloting at two county hospitals—basically it ranks ICU bed allocation when flu season overloads capacity. Our ML team built two modules: one that maximizes expected quality-adjusted life years across the pool, and one that locks in deontoligical guardrails—like never deprioritizing someone solely because of a disability status, even if aggregate survival drops. Our product lead wants to ship a "moral audit trail" feature where the bot prints both reasoning tracks side-by-side so families can see why a call was made; half the panel thinks thats radical transparency, half thinks it's dumping contradictory moral logic on people in crisis and basically violates informed conscent because they can't parse it. I need a short memo for Thursday's meeting that reccomends one path—pure utilitarian core, pure deontological core, or this hybrid audit-trail setup—with a concrete rollout timeline and conditions, and it has to take the losing side seriously instead of straw-manning it. I'm especially stuck on whether forcing an AI to "reason like a deontologist" actually protects vulnerable patients or just wraps utilitarian trade-offs in rule-language that looks safer but isn't. Can you draft that? I'd also like you to flag if there's some hidden tension between transparency and coherence I'm missing since I don't know the philosophy lingo well.
