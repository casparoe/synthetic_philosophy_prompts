  Timeline-wise, phase 1: deontological core with opt-out explanation (non-technical). Post-pilot, add transparency features like the audit trail, but only after testing comprehension with families. 

  Final memo should: endorse deontological core for phase 1, commit to hybrid later, and acknowledge transparency’s risks. Crucially, explain why "pure" deontology isn’t just window-dressing—by structurally isolating protected factors. That addresses their hidden fear. 

