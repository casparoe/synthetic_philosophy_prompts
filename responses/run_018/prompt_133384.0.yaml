  **Formal & Philosophical Execution:**

  1.  **End-Words:** `subject`, `quality`, `bound`, `part`, `whole`, `derive` – Core terms of the debate.
  2.  **Stanzas 1-3 (Micropsychism/Combination):**
      *   Focuses on the failure of micro-subjects (`subject`) with their intrinsic qualities (`quality`) to combine.
      *   `bound` initially suggests physical connection (st1), then the limit preventing combination (st2), hinting at phenomenal binding.
      *   `derive` poses the question of origin for macro-consciousness.
      *   `part` and `whole` highlight the core problem: many parts, no unified whole emerges.
  3.  **Stanza 4-5 (Turn to Cosmopsychism/Derivation):**
      *   `whole` shifts position (now line-end in st4) to represent the cosmic subject.
      *   `derive` changes meaning: how do parts *derive* from the whole?
      *   `bound` now represents the cosmic source being bounded/unified (st4), then the problem of *binding* fragments *away* from the whole (st5).
      *   `part` becomes the problem (localized fragments).
      *   `quality` shifts to the restrictive property needed for individuation (st5).
      *   `subject` becomes the localized entity needing explanation (st5).
  4.  **Stanza 6 & Envoi (Stalemate & "Phenomenal Bonding" Parody):**
      *   Stanza 6 uses `bound` as both limit and the bonding relation itself, spinning the terms without resolution.
      *   **Envoi:** Forces all six terms into three lines.
      *   "The postulated bond, a **quality**" - Introduces phenomenal bonding as a proposed quality/relation.
