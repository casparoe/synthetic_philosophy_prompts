  hey — i'm a novelist working on a thing about an archivest who thinks she's found 'laws' in old newspapers, and it's made me wonder about Popper's old argument — the one about whether history can actually have laws. i want a taxomony, like a decision tree, so my readers (or maybe my character) can sort themselves into camps without just picking a label they like. build it from the questions: first, are deterministic laws of history possible? then branch on whether probabilstic patterns count as laws, whether explaining the past is different from predicting the future, and whether a law that only holds in fictional or counterfactual histories is still a real law — that's the bit i'm obsessed with. include Popper's anti-historicist view, the Marxist-style historicism he attacked, some middle 'structural tendency' camp, and note any unnamed combos that fall out of the branches. each leaf should carry a name (or 'unnamed') and one sentence on its most awkward commitment. flag any pair of leaves your tree can't really separate. phrase every node as a concrete claim someone could agree or disagree with without knowing the philosophy jargon. please answer in british english — colour, centre, practise — and don't include a bibliography or reading list, just the tree. there's a typo or two in here but don't correct them.
reasoning: |-
