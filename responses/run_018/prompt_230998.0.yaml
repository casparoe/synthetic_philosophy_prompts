prompt: |-
  Ok here's one. I'm in a reading group with two people who have been going back and forth for months about the doctrine of double effect, specifically about the switch/footbridge cases and close variants. One of them (call her A) is a defender of DDE: she thinks the intention/foresight distinction is doing real moral work, and that what makes the surgeon case impermissible and the strategic bombing case (on her view, maybe) permissible is whether the death is intended as a means or merely foreseen as a side effect. The other (call him B) thinks DDE is mostly post hoc pattern-matching: he claims that tweaking low-level details—like whether the fat man is pushed, dropped through a trapdoor, or shoved into the path of the trolley—changes people's verdicts in ways the intention/foresight distinction can't track. They've agreed to do an adversarial collaboration.

  Write the document they should have produced. It must have: a numbered list of claims both can sign, which should be substantial and not just "they disagree about X" (cover what they both accept about the standard cases, about what the distinction can and cannot explain, and about which features of cases are doing the work). Then a disagreements table: each remaining disagreement stated in neutral wording, plus a column or row for how each side would phrase its own view. For each disagreement give at least one crux—a subquestion or pair of cases such that settling it would actually move at least one of them. For each crux, spell out a concrete case or argument both would accept as bearing on it, and record in advance what A and B each predict about it (e.g., what pattern of judgments they expect, where they think the other side's description collapses or becomes arbitrary). Be really exact about where they part ways: is the dispute about descriptive moral psychology, about normative relevance, or about whether "intending as a means" can be defined non-arbitrarily in the first place? Use the switch, footbridge, and loop cases, and at least two non-trolley cases (hysterectomy vs. craniotomy, strategic vs. terror bombing, or something similar), but only in ways that test the distinction, not cases that just restate it. Also seperate out the points where B thinks A's view is a verbal move from the points where it makes a real difference.
reasoning: |-
  We are creating an adversarial collaboration document for A (defender of DDE) and B (skeptic of DDE). The document must have:

  I. A numbered list of claims both can sign (substantial agreements).
  II. A disagreements table with:
     - Each disagreement stated neutrally.
     - How each side phrases their own view.
     - For each disagreement, at least one crux (a testable subquestion or pair of cases) that would move at least one of them.
     - For each crux: a concrete case or argument both accept as bearing on it, and predictions from A and B.

  The disputes must be categorized as being about:
     - Descriptive moral psychology (what people actually judge)
     - Normative relevance (whether the distinction should matter)
     - Whether "intending as a means" can be defined non-arbitrarily.

  We use at least: switch, footbridge, loop, and two non-trolley cases (e.g., hysterectomy vs. craniotomy, strategic vs. terror bombing) to test the distinction.

  Separate B's objections that A's view is a verbal move from where it makes a real difference.

  ---

  I. List of Agreed Claims

  Both A and B agree on the following:

  1. In the standard trolley problem variants (switch, footbridge, loop), the majority of people judge the switch case as permissible and the footbridge case as impermissible. The loop case is more contested but often judged permissible.

  2. The distinction between intended and merely foreseen consequences is a traditional part of moral theory (e.g., in the Doctrine of Double Effect) and has been used to explain patterns in moral judgments.

  3. There are cases beyond trolley problems where the intended/foreseen distinction is often invoked, such as in the medical domain (e.g., hysterectomy to save mother's life where fetus dies as a side effect vs. craniotomy to kill fetus to save mother) and in wartime (strategic bombing vs. terror bombing). In these cases, the traditional DDE analysis often aligns with common moral intuitions (e.g., hysterectomy permissible, craniotomy impermissible; strategic bombing potentially permissible, terror bombing impermissible).

  4. However, both agree that empirical studies show that moral judgments are sensitive to various factors beyond the intention/foresight distinction, such as physical contact, personal force, spatial proximity, and the manner of causing harm (e.g., pushing vs. pulling a lever).

  5. The loop case (where diverting the trolley onto a side track that loops back requires a heavy object to stop it, and a fat man is used) is a point of contention: some studies show people judge it similarly to the switch case (permissible) and others more like the footbridge case (impermissible). Both agree that this variation challenges a simple application of DDE.

  6. The intention/foresight distinction is not the only factor influencing moral judgments. Other factors (like the ones above) also play a role, and sometimes these factors may override or interact with the intention/foresight distinction.

  7. The debate about DDE is not merely about moral psychology but also about normative ethics: whether the distinction should matter, and whether it can be coherently defined.

  ---

  II. Disagreements Table

  We structure the disagreements as follows. Each row is a disagreement. We state the disagreement neutrally, then have columns for A's view and B's view. Then, for each, we provide at least one crux, the concrete case or argument, and the predictions.

  **Note on Categories**: For each disagreement, we note the type of dispute (descriptive, normative, or conceptual).

  Disagreement 1: **The explanatory power of the intention/foresight distinction in accounting for moral judgments in trolley cases.**

  - Neutral statement: To what extent does the intention/foresight distinction explain the difference in judgments between the switch and footbridge cases?

  - A's view: The intention/foresight distinction is the primary factor explaining the difference. In the switch case, the death is a foreseen side effect, not intended as a means. In the footbridge case, the death is intended as a means to save the five. This distinction captures the core moral difference.

  - B's view: The intention/foresight distinction is not the primary factor. Instead, factors like personal force (direct physical contact) and the mechanism of harm (e.g., pushing vs. pulling a lever) are more fundamental. The distinction is often confounded with these factors and cannot explain cases where these factors are manipulated independently.

  - **Type of dispute**: Primarily descriptive moral psychology (what explains the pattern of judgments) but also conceptual (whether the intention/foresight distinction can be separated from these other factors).

  - Crux 1: **The Trapdoor Footbridge Case**

    - Case: A variant of footbridge where the agent does not push the fat man but instead pulls a lever that opens a trapdoor under him, dropping him onto the track to stop the trolley. The outcome is identical: the fat man dies and stops the trolley, saving five.
    - Argument: If the intention/foresight distinction is primary, then this case should be judged similarly to the standard footbridge (impermissible) because the agent still intends the death as a means. However, if personal force or direct physical contact matters, then this case might be judged more permissible because there is no pushing.
    - A's prediction: The trapdoor case should be judged impermissible, just like standard footbridge, because the death is intended as a means. Thus, the intention/foresight distinction explains it.
    - B's prediction: The trapdoor case will be judged more permissible than the standard footbridge (though perhaps not as permissible as the switch) because the absence of personal force reduces the aversion. This shows that the intention/foresight distinction is not the key driver.

  - Crux 2: **The Strategic/Terror Bombing with Different Means**

    - Case: Compare two bombing scenarios. In both, the bomber knows that civilians will die. In the first (strategic), the bomber targets a munitions factory, and the civilian deaths are a side effect. In the second (terror), the bomber targets civilians to demoralize the enemy. Now, add a variant: the terror bomber uses a remote-controlled drone that requires no personal force and minimal direct involvement.
    - Argument: If the intention/foresight distinction is primary, then the terror bombing with drone should still be impermissible because the deaths are intended. But if personal force matters, then the drone terror bombing might be judged less harshly than a hands-on terror attack (like planting a bomb in a cafe).
    - A's prediction: Both terror bombings are equally impermissible because the intention is the same (to kill civilians as a means). The means (drone vs. hands-on) should not change the moral status.
    - B's prediction: The drone terror bombing might be judged as less impermissible than the hands-on terror bombing because of reduced personal force, showing that the intention/foresight distinction is not the sole factor.

  Disagreement 2: **The non-arbitrariness of the concept of "intending as a means".**

  - Neutral statement: Can we define "intending as a means" in a non-arbitrary way that does not depend on ad hoc adjustments for different cases?

  - A's view: The concept is non-arbitrary and can be defined by reference to the agent's reasons for action and the role of the harm in the plan. For example, in the craniotomy case, the death of the fetus is intended as a means because the head crushing is part of the plan to remove it. In hysterectomy, the death is a side effect.

  - B's view: The concept is arbitrary because the same outcome can be described in multiple ways, and the distinction collapses under pressure. For example, in the loop trolley case, one can describe the death of the fat man either as a means (because his body is used to stop the trolley) or as a side effect (because the agent only intends to stop the trolley by a heavy object, and the fat man happens to be that object). The assignment of "means" versus "side effect" seems post hoc.

  - **Type of dispute**: Conceptual (definitional) and normative (because if it is arbitrary, then it might not be normatively relevant).

  - Crux: **The Loop Case and the Heavy Object**

    - Case: In the loop case, the trolley is diverted onto a loop that returns to the main track unless stopped by a heavy object. There is a fat man on the loop. The agent diverts the trolley, and the fat man is crushed, stopping the trolley and saving the five. Now, compare two descriptions:
        - Description 1: The agent intends to stop the trolley by using the fat man as a means (so his death is intended as a means).
        - Description 2: The agent intends to divert the trolley onto the loop and then have it stopped by a heavy object. The fat man happens to be the heavy object, so his death is a foreseen side effect of being used as a stop.
    - Argument: If the concept is non-arbitrary, there should be a principled way to choose between these descriptions. If not, then the assignment is arbitrary.
    - A's prediction: The correct description is that the agent intends the fat man's death as a means because the plan requires that the fat man (or whatever object) be crushed to stop the trolley. Without that, the plan fails. Therefore, the loop case is impermissible (like footbridge) and the description is non-arbitrary.
    - B's prediction: There is no non-arbitrary way to choose between the descriptions. Moreover, empirical studies show that people are split on the loop case, and their judgments can be swayed by framing. This indicates that the concept is not robust.

  - Additional Crux: **The Craniotomy with a Different Procedure**

    - Case: A variant of craniotomy where the procedure is described as "removing the fetus from the womb" and the crushing of the head is a foreseen but unintended consequence (because the fetus is too large to pass otherwise). But note: in traditional craniotomy, the head is crushed to allow removal. Now, if we describe the procedure as "removing the fetus" and the head crushing as a side effect, does that change the permissibility?
    - Argument: This tests whether the same physical act can be re-described arbitrarily to shift the intention.
    - A's prediction: The description matters only if it reflects the actual plan. In the standard craniotomy, the crushing is part of the means, so it is intended. In a hypothetical where the crushing is truly a side effect (e.g., the fetus dies from exposure after removal), then it would be permissible. But if the removal requires crushing, then it is intended.
    - B's prediction: People's judgments will flip based on the description, even if the physical facts are the same, showing that the intention/foresight distinction is a verbal move.

  Disagreement 3: **The normative relevance of the intention/foresight distinction.**

  - Neutral statement: Should the intention/foresight distinction matter for moral permissibility?

  - A's view: Yes, because intending harm as a means is a mark of disrespect for the person and makes the agent directly involved in the harm. Merely foreseeing harm is less wrong because the harm is not part of the agent's plan as a means.

  - B's view: The distinction should not matter for permissibility. What matters is the actual outcome, the causal structure, and other factors (like necessity, proportionality, and the agent's motives in a broader sense). The intention/foresight distinction is a red herring.

  - **Type of dispute**: Normative ethics.

  - Crux: **The Strategic Bombing with Intentional Collateral Damage**

    - Case: A bomber must destroy a munitions factory to win a war and save many lives. The factory is in a city, and bombing it will kill civilians. In one variant, the bomber regrets the civilian deaths but accepts them as necessary. In another variant, the bomber is indifferent to the civilian deaths. In a third variant, the bomber is pleased because he hates the enemy civilians. The bomber in all cases drops the bomb and kills the same number of civilians.
    - Argument: DDE traditionally holds that the permissibility depends on whether the deaths are intended (as in terror bombing) or merely foreseen (as in strategic bombing). But if the bomber's attitude (regret vs. pleasure) does not change the permissibility, then the distinction might not be normatively relevant. Alternatively, if the permissibility is the same regardless of the attitude, then the intention/foresight distinction (which is about the plan) might not be the key.
    - A's prediction: The permissibility depends solely on whether the deaths are intended as a means or an end. In strategic bombing, if the deaths are not intended, then the action is permissible (assuming proportionality, etc.). The bomber's emotional attitude (regret, indifference, or pleasure) does not affect permissibility, because permissibility is about the structure of the intention in the plan.
    - B's prediction: The permissibility of the bombing does not change with the bomber's internal attitude. The action is permissible or impermissible based on the expected outcomes and necessity, not on the intention/foresight distinction. Therefore, the distinction is not normatively relevant.

  - Additional Crux: **The Hysterectomy Case with a Malicious Surgeon**

    - Case: A pregnant woman has cancer and needs a hysterectomy to save her life. The surgery will result in the death of the fetus. In one scenario, the surgeon is indifferent to the fetus. In another, the surgeon hates the fetus and is glad to kill it. The surgery is identical.
    - Argument: If the intention/foresight distinction matters, then the permissibility should be the same in both scenarios because the death is not intended as a means. But if the surgeon's malicious intent makes the act impermissible, then the internal attitude matters and DDE is insufficient.
    - A's prediction: The permissibility is the same in both cases. The surgeon's internal attitude does not change the fact that the death is a side effect and not intended as a means. The act is permissible regardless of the surgeon's feelings.
    - B's prediction: If people judge the act as impermissible when the surgeon is malicious, then this shows that the intention (in the sense of the agent's attitude) matters, and DDE's narrow focus on the role in the plan is inadequate. Alternatively, if permissibility is unchanged, then it shows that the outcome and causal structure are what matter, not the intention.

  ---

  Separate Points: B's view that A's view is a verbal move vs. real difference.

  B thinks that in some cases, A's use of the intention/foresight distinction is a verbal move. For example:

  - In the loop case, B argues that A can arbitrarily choose to call the death "intended" or "foreseen" to match the desired judgment. This makes the distinction verbal.

  - In the craniotomy case, if A insists that the head-crushing is intended, but in a physically similar case (like a medical procedure that unavoidably causes death) A might call it foreseen, then the distinction is verbal.

  However, B acknowledges that in clear cases (like terror bombing vs. strategic bombing) the distinction does capture a real difference in the agent's plan. But B argues that even there, the moral difference is better explained by other factors (like the agent's overall goal and the necessity of the harm).

  In summary, the document would present these agreements and disagreements as above.
answer: |-
  ### Adversarial Collaboration: Doctrine of Double Effect in Trolley Cases and Beyond  
  **Participants**:  
  - **A**: Defends the Doctrine of Double Effect (DDE), arguing the intention/foresight distinction explains core moral differences (e.g., in trolley cases, hysterectomy, strategic bombing).  
  - **B**: Skeptical of DDE, arguing moral judgments are driven by low-level details (e.g., physical contact, mechanism of harm) and that DDE is post hoc pattern-matching.  

  ---

  ### I. Agreed Claims (Signed by Both)  
  Both A and B endorse the following substantial claims, based on empirical data, philosophical analysis, and shared intuitions:  

  1. **Consensus on Standard Cases**:  
     - The *switch case* (diverting a trolley to kill one instead of five) is widely judged permissible.  
     - The *footbridge case* (pushing a fat man to stop the trolley) is widely judged impermissible.  
     - The *loop case* (diverting a trolley that loops back, requiring one death to save five) elicits mixed judgments but leans toward impermissibility in most studies.  
     - In medical ethics, the *hysterectomy* (removing a uterus to save a mother, foreseeing fetal death) is widely judged permissible, while the *craniotomy* (crushing a fetus’s skull to save the mother) is widely judged impermissible.  
     - In wartime ethics, *strategic bombing* (destroying a military target, foreseeing civilian deaths) is often judged more permissible than *terror bombing* (intentionally killing civilians to demoralize the enemy).  

  2. **Role of Intention/Foresight Distinction**:  
     - The intention/foresight distinction *can* descriptively track patterns in moral judgments across standard cases (e.g., permissibility correlates with "foreseen side effect" in switch/hysterectomy/strategic bombing vs. "intended means" in footbridge/craniotomy/terror bombing).  
     - This distinction is *necessary but not sufficient* to explain moral judgments; other factors (e.g., physical contact, personal force) also influence responses.  

  3. **Limitations of DDE**:  
     - The distinction *cannot* explain why judgments shift in structurally similar cases with low-level variations (e.g., fat man *pushed* vs. *dropped via trapdoor* in footbridge).  
     - It *cannot* resolve ambiguous cases (e.g., loop) without ad hoc adjustments, and it fails to predict judgments when "intended as a means" is contested (e.g., craniotomy described as "removal with unintended crushing").  

  4. **Key Factors Influencing Judgments**:  
     - **Physical contact** (e.g., pushing vs. pulling a lever) and **personal force** (direct vs. indirect agency) robustly affect judgments independently of intention/foresight.  
     - **Spatial/temporal proximity** (e.g., bomb dropped from afar vs. hands-on attack) and **mechanism of harm** (e.g., trapdoor vs. shoving) significantly alter permissibility ratings.  
     - **Causal structure** (e.g., harm as direct effect vs. byproduct) and **avoidability** (e.g., whether harm is necessary for the goal) are often confounded with intention/foresight but can be disentangled.  

  5. **Empirical and Conceptual Groundwork**:  
     - Moral judgments are sensitive to framing and contextual details, indicating that DDE alone is an incomplete descriptive theory.  
     - The debate involves three separable levels:  
       - **Descriptive moral psychology**: What factors *actually* drive judgments?  
       - **Conceptual coherence**: Can "intending as a means" be defined non-arbitrarily?  
       - **Normative relevance**: *Should* the intention/foresight distinction matter for permissibility?  

  ---

  ### II. Disagreements Table  
  Each disagreement is stated neutrally, followed by columns for A’s and B’s views. For each, a **crux** (testable subquestion/case) is provided, with:  
  - A concrete case/argument both accept as decisive.  
  - Predictions from A and B.  
  - **Dispute type**: Descriptive (D), Conceptual (C), or Normative (N).  

  | Neutral Disagreement Statement                                                                 | A’s View (DDE Defender)                                                                                                                                 | B’s View (DDE Skeptic)                                                                                                                                 |
  |------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------------------------------------|
  | **1. Whether intention/foresight is the primary driver of moral judgments in trolley cases.**<br>*(Type: D, C)* | The core difference between switch (permissible) and footbridge (impermissible) is that death is a foreseen side-effect in switch but intended as a means in footbridge. Personal force is derivative of this distinction. | Personal force (e.g., pushing vs. pulling) is the primary factor; intention/foresight is inferred post hoc. DDE cannot explain variation in structurally identical cases. |
  | **Crux: Trapdoor Footbridge Case**<br>**Case**: Identical to footbridge, but the agent pulls a lever to open a trapdoor beneath the fat man, dropping him onto the tracks. Death is intended as a means to stop the trolley.<br>**Argument**: If intention/foresight is primary, judgments should match standard footbridge (impermissible). If personal force is primary, judgments should shift toward permissibility (no direct contact).<br>**A’s Prediction**: ~80% will judge this impermissible (same as footbridge), as death is intended as a means.<br>**B’s Prediction**: ~40-60% will judge it permissible (vs. <20% for footbridge), as removing personal force weakens aversion. | | |
  | **2. Whether "intending as a means" can be defined non-arbitrarily in edge cases.**<br>*(Type: C)* | "Intending as a means" is non-arbitrary: harm is intended if it is part of the plan’s causal structure (e.g., craniotomy requires crushing the fetus, so death is a means). Ambiguity arises from misdescription, not incoherence. | The distinction is arbitrary: the same outcome can be redescribed to fit "intended" or "foreseen" (e.g., loop case), making DDE a verbal sleight-of-hand. |
  | **Crux: Loop Case Redescription**<br>**Case**: Loop case, but described two ways:<br>(a) *Means-focused*: "You intend the fat man’s death to stop the trolley."<br>(b) *Side-effect-focused*: "You intend to stop the trolley with a heavy object; the fat man’s death is a foreseen side effect."<br>**Argument**: If the distinction is non-arbitrary, permissibility judgments should not vary with framing. If arbitrary, judgments will flip based on description.<br>**A’s Prediction**: Framing won’t affect judgments; ~60% will judge it impermissible regardless, as death is objectively a means.<br>**B’s Prediction**: Framing will cause significant divergence (e.g., 30% permissible under (a) vs. 70% under (b)), showing the distinction is verbal. | | |
  | **3. Whether the intention/foresight distinction explains wartime bombing cases.**<br>*(Type: D, N)* | Strategic bombing is permissible (foreseen death) and terror bombing impermissible (intended death) because intending harm violates constraints against using persons as means. | Permissibility is driven by proportionality and necessity; intention/foresight is irrelevant if outcomes and causal roles are identical. |
  | **Crux: Indirect Terror Bombing Case**<br>**Case**: Identical to terror bombing (civilian deaths intended to demoralize the enemy), but the bomber uses a drone strike with no personal force. Civilian deaths are intended as a means.<br>**Argument**: If DDE is normatively relevant, judgments should match standard terror bombing (impermissible). If low-level factors dominate, reduced personal force may increase permissibility.<br>**A’s Prediction**: ~85% will judge it impermissible (same as hands-on terror bombing), as deaths are intended.<br>**B’s Prediction**: ~40-50% will judge it permissible (vs. <20% for hands-on), as drone use reduces personal force/salience. | | |
  | **4. Whether DDE is normatively relevant in medical cases when intentions are malevolent.**<br>*(Type: N)* | The distinction matters normatively: permissibility depends on whether harm is a side effect (hysterectomy) or means (craniotomy), regardless of the agent’s emotions. | Normative weight lies in outcomes and consent; intention/foresight is redundant if harm is identical and necessary. |
  | **Crux: Malicious Hysterectomy Case**<br>**Case**: Hysterectomy to save a mother’s life, foreseeing fetal death. The surgeon is secretly pleased about the fetus dying (malevolent intent), but the procedure is medically identical.<br>**Argument**: If DDE is normatively relevant, permissibility should be unchanged (death remains a side effect). If motives override structure, judgments may shift toward impermissibility.<br>**A’s Prediction**: ~90% will judge it permissible (same as standard hysterectomy), as death is not a means.<br>**B’s Prediction**: ~50-60% will judge it impermissible due to the surgeon’s intent, showing outcome/intention are conflated normatively. | | |

  ---

  ### III. B’s Objections: Verbal Moves vs. Real Differences  
  B argues A’s DDE view functions as a **verbal move** in edge cases (collapsing into arbitrariness) but acknowledges a **real difference** in clear cases:  
  - **Verbal Move**: In cases like loop or craniotomy, "intending as a means" is assigned post hoc to match intuitions (e.g., B’s *Loop Redescription Crux* shows framing alters judgments). Here, DDE "tracks" judgments without explaining them.  
  - **Real Difference**: In paradigmatic cases like terror bombing vs. strategic bombing, the agent’s plan *does* differ structurally (civilian deaths as goal vs. byproduct). However, B contends low-level factors (e.g., personal force) better explain *why* this difference matters psychologically.  

  A counters that conceptual clarity resolves ambiguity (e.g., *intention* is defined by causal role in the plan, not emotions), and DDE’s normative force persists in clear cases regardless of framing.  

  ---  
  **Document End**  
  This document represents a good-faith adversarial collaboration, identifying shared ground, testable disagreements, and cruxes for future research.  
  Signed: ___________________ (A) | ___________________ (B)
