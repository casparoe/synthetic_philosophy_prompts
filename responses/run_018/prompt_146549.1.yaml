prompt: |-
  Hey so I'm running the discussion section for our upper-level epistemology course and the professor dumped this on me last minute — I need to write a take-home essay for the students that covers both the lottery paradox and the preface paradox but doesn't just let them recite the classic setup and call it a day. I was talking with my roommate about it over coffee and we came up with this idea: what if you frame the whole thing around acceptance thresholds and then throw in this niche scenario about an AI diagnostic system that outputs 99.2% confidence on each of 500 independent patient checks but also has a known calibration error that guarantees at least one false positive? I think it forces them to see whether the paradox is about probability aggregation or about self-knowledge of fallibility, which is definatly different from just memorizing Kyburg.

  Anyway, can you write me the actual exam prompt? It should be answerable in about 75 minutes, and I need a model answer of roughly 800 words plus a marking scheme broken into 5 specific moves (4 marks each, total 20). The scheme needs to say exactly what an A answer does that a B answer misses — for instance, whether they actually explain why lowering the belief threshold to 0.99 doesn't dissolve the lottery problem without breaking the preface, or if their just saying 'contextualism' and moving on. Don't include any bibliography requests or citation prompts since these are undergrads without library access to teh original papers. Make it feel like a real exam, not a summary assignment, and please make sure the marking scheme calls out the specific mistakes that cost marks, like conflating statistical expectation with epistemic acceptance.
