  But then there's the transformative aspect. Wine "loosens the soul," making it more pliable. The Stranger mentions that intoxication mimics madness, which is a temporary state. If wine reorders the soul's parts, then the drunken self is different. Training this altered state might not transfer back. The user is worried about habituation across different states. 

