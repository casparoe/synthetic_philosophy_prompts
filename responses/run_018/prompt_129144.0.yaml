answer: |-
  The pairing of legislative confidence and executive governance in parliamentary systems reflects a coherent theory of democratic legitimacy centered on **legislative supremacy and continuous accountability**, where the executive is a revocable delegate of the parliamentary majority—not an independent mandate-holder. This theory resolves tensions through functional interdependence and rests on a practical, stability-focused conception of sovereignty. The constructive vote of no confidence further refines this by embedding a principle of **unbroken popular mandate** in the legislature.  

  ### 1. **Implicit Theory of Legitimacy & Responsibility**  
     - **Executive as Revocable Delegate**: Parliamentary systems treat the executive as an agent of the legislature, which embodies the popular will. The government’s authority derives solely from the confidence of the elected assembly, not a separate electoral mandate. This makes the executive a *continuously conditional delegate*—legitimate only while commanding majority support.  
     - **Legislature as Sovereign Principal**: Sovereignty resides in the legislature as the direct representative of the electorate. The no-confidence vote (without need for "offenses") reflects this: the legislature may revoke authority for political reasons (e.g., policy disputes, loss of popularity), not just legal malfeasance.  
     - **Contrast with Presidentialism**: Presidential systems split mandates, creating dual legitimacy (executive and legislature both popularly elected). Fixed terms insulate the executive, treating it as a coequal branch with independent authority.  

  ---

  ### 2. **Resolving the Tension: Why Destroy Yet Depend?**  
  The tension between the legislature’s power to dismiss governments and its reliance on them arises from **functional specialization and reciprocal accountability**:  
     - **Functional Necessity**: Legislatures are deliberative bodies ill-suited for day-to-day administration. Governments (executives) propose budgets/laws, set agendas, and coordinate policy. The legislature *needs* the government to govern efficiently.  
     - **Reciprocal Deterrence**:  
       - The government depends on the legislature for survival, incentivizing responsiveness.  
       - The legislature depends on the government for legislative success, deterring frivolous no-confidence votes.  
     - **Stability via Political Cost**: A no-confidence vote risks governmental collapse or elections. Legislators face voter backlash for instability, ensuring dismissals occur only when sustaining the government is costlier than removing it.  

  **Sovereignty vs. Practicality**:  
     - **Formal Sovereignty**: Legally, parliament is supreme—it can dismiss governments at will, reflecting its role as the ultimate repository of popular will.  
     - **Practical Constraints**: Stability requires governments to govern. The system presupposes that rational actors avoid deadlock; if a government falls, a new one must form *from the existing legislature* or trigger elections. This balances sovereignty with governance continuity.  

  ---

  ### 3. **Constructive Vote of No Confidence: Continuity of Mandate**  
  The constructive vote (e.g., Germany, Spain) requires parliament to elect a successor *simultaneously* with dismissing the incumbent. This mechanism presupposes:  
     - **Unbroken Popular Mandate**: The legislature’s authority is continuous; it must ensure a viable alternative exists before revoking confidence. Sovereignty never "lapses"—the people’s will, vested in parliament, is perpetually exercised.  
     - **Collective Agency**: Parliament is not just a critic but a constructive actor. It must affirm a positive alternative, preventing opposition factions from toppling governments without governing capacity.  
     - **Stability as a Constitutional Value**: It prioritizes governance continuity over pure majoritarian flexibility, reducing incentives for opportunistic no-confidence votes.  

  **Philosophical Consistency**:  
     - The constructive vote *extends* the core theory of parliamentary legitimacy (sovereignty resides in the legislature) but adds a **governance-safeguarding principle**. It rejects the notion that a legislature can legitimately "destroy" without "creating," aligning with a deeper view that democracy requires not just accountability but *governing capacity*. It thus subtly shifts from pure legislative supremacy to a **sovereignty-stability hybrid**.  

  ---

  ### Conclusion: Coherence Through Interdependence  
  The parliamentary model’s coherence lies in its **fusion of authority and accountability**: the executive governs only with legislative consent, and the legislature depends on the executive for functional efficacy. This interdependence creates equilibrium, where the threat of dismissal ensures responsiveness, while the cost of instability discourages recklessness. The constructive vote reinforces this by tethering accountability to continuity, treating the legislature as both a sovereign and a steward of governance. Ultimately, the system rests on a **pragmatic theory of legitimacy**: democracy requires not just popular sovereignty but effective, stable administration—achieved by making the executive a delegate, not a rival.
