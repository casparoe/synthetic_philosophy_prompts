  Regarding insulation: If every counterexample can be dismissed by claiming hidden asymmetries, that's epistemically vicious unless constrained. The view needs clear criteria for what constitutes relevant labor.

  For collapse risks: If meta-labor just provides more evidence, it collapses into expertise deference. If it's truly distinct, we need to explain why it doesn't count as higher-order evidence requiring conciliation.

