answer: |-
  **The case holds structurally due to a forced separation between randomizer-defined chance and evidence about causal efficacy in a clinical trial scenario.**

  A hospital uses a cryptographically secure random number generator (RNG), externally audited as perfectly fair, to assign patients in a double-blind trial for Drug X versus placebo. The RNG governs assignment (1:1), defining the objective chance of any *individual* receiving Drug X as exactly 0.5. After 1,000 patients, results show 900 improved in the drug group versus 100 in placebo, yielding 90% observed efficacy. The prior mechanistic belief is that Drug X is inert (true effect = 0).

  *   **Belief:** Probability that Drug X has *any causal efficacy* (effect size >0).
  *   **Method:**  
      *   *PP Adherent:* Sets initial credence P(efficacy) = 0.5, based *only* on the known chance setup (RNG assignment). The trial data is *admissible evidence* for *updating* this prior, but the PP fixes the prior firmly at the known chance value (assignment probability). Strong data moves it, but not far from 0.5 initially.  
      *   *Evidentialist:* Ignores the RNG's 0.5 as irrelevant to *efficacy*. Updates solely on direct evidence: 900/1000 vs 100/1000 improvement rates. Uses a beta-binomial model, getting P(efficacy >0) > 0.99.
  *   **Nearby Worlds:**  
      *   Worlds with identical RNG but different trial outcomes (e.g., 500/500) yield PP prior = 0.5, evidentialist near 0.5.  
      *   Worlds with *no* RNG (e.g., physician assignment) see both methods use data directly (PP prior undefined for chance), converging near 1.0.
  *   **PP Verdict:** PP demands credence start at the known objective chance of assignment (0.5). Efficacy is inferred *from* the evidence *using* this prior. The RNG *is* the relevant "chance law" for the event "this patient got Drug X".  
  *   **Evidentialist Disagreement:** The 0.5 chance refers only to *assignment*, not *efficacy*. The overwhelming data *directly* measures efficacy's probability. Conditioning on the RNG's fairness is irrelevant noise.
  *   **Exact Feature:** The deliberate *framing* of the "objective chance" as *solely* the output of the RNG (assignment probability), rigorously separated from the *causal process* generating the evidence (drug mechanism). The RNG's output is treated as the immutable chance law; the drug's effect is part of the evidence-generating mechanism.
  *   **Without Ambiguity:** If "chance" included the *causal propensity* of the drug (not just assignment), PP couldn't set a 0.5 prior (no known value). The case collapses into standard evidential updating. The tension vanishes.
  *   **PP Defender Attack:** They argue you've *correctly* excluded the efficacy data as inadmissible for *setting* the chance prior. The *only* known objective chance is the RNG's assignment probability (0.5), confirmed independently. The efficacy data is *for* updating *from* that prior, not for redefining the chance itself. If the RNG's fairness is genuinely known, the prior *must* be 0.5 per PP. The evidentialist is smuggling the efficacy evidence into the chance base illegitimately.

  **Bottom Line:** The case is coherent and exploits a plausible, real-world framing decision about what constitutes the "objective chance" law (RNG output) versus the evidence-generating system (drug biology + trial). The tension arises directly from this separation.
