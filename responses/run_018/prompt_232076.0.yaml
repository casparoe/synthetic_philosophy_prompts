  First, I need to recall the main issues in population axiology. The Repugnant Conclusion is central—where a large population with minimal positive welfare is deemed better than a small one with high welfare. That's a big motivator for many requirements. Then there's the Mere Addition Paradox, which challenges whether adding happy people without affecting others is always good. The procreation asymmetry deals with not creating someone bad vs. not creating someone good. Non-identity problem involves choices affecting who exists. Same-number comparisons are more straightforward, like preferring higher total welfare or equality.

  The user wants to highlight which requirements are essential and which are camp-specific. For example, avoiding the Repugnant Conclusion might be non-negotiable for some, but totalists accept it. Similarly, person-affecting views insist that morality must relate to affecting individuals, while others might see that as optional.

  I should list each requirement with its motivation and categorize them. The impossibility theorems show that not all criteria can be satisfied simultaneously. For instance, Parfit's original work shows that avoiding the Repugnant Conclusion conflicts with other plausible principles. I need to explain where these conflicts arise, like between Non-Antiegalitarianism and the Quality Condition.

  Also, the user emphasized not to evaluate existing theories but to present the criteria. So I’ll avoid naming specific theories unless necessary. Focus on the requirements themselves: Separability, Transitivity, etc. Mention which ones lead to conflicts, like how accepting all of them is impossible per impossibility results.

  Deep needs: The user has been stuck in a debate because their friend uses different criteria. They want to clarify the foundational assumptions to move the discussion forward. They might need a structured framework to identify which axioms each side prioritizes. Unspoken need is resolving the deadlock by exposing the root differences in value systems, not just arguing outcomes.

  Need to ensure each requirement is clearly defined with its motivation. Check that all mentioned puzzles are covered: Repugnant Conclusion, Mere Addition, procreation asymmetry, non-identity, same-number cases. Note which requirements are widely accepted (like transitivity) versus contested (like person-affecting).

  Also, highlight conflicts. For example, Quality Condition vs. Non-Repugnance leads to contradictions when combined with other principles. Point out that some trade-offs are unavoidable, forcing a choice between criteria. This helps the user understand why the debate stalls—because different axioms are chosen, leading to different conclusions.

  Finally, structure the response with sections: Core Structural Requirements, Substantive Value Requirements, Person-Affecting Requirements. Summarize conflicts in an impossibility section. Clarify non-negotiable vs. negotiable based on philosophical consensus versus camp-specific views.
answer: |-
  Here’s a framework of requirements for a population axiology theory, grounded in the puzzles and judgments that motivate them. I’ll categorize them as **Core Structural** (widely seen as necessary for coherence), **Substantive Value** (driven by ethical intuitions, often contested), and **Person-Affecting** (reflects specific views about moral patients). Conflicts (impossibilities) are highlighted at the end.

  ### I. Core Structural Requirements (Generally Non-Negotiable for Coherence)
  These are needed for the theory to function as a consistent, rational ranking system. Rejecting them often leads to absurdity or irrationality.

  1.  **Transitivity:**
      *   **Motivation:** Basic rationality. If Population A is better than B, and B is better than C, then A must be better than C. Without this, cyclical preferences make "better than" meaningless.
      *   **Puzzles:** Avoids arbitrary or inconsistent rankings.

  2.  **Completeness (or a Defined Scope):**
      *   **Motivation:** The theory must be able to compare *any* two populations within its domain (or clearly define where comparisons *cannot* be made). "Incomparable" should be a deliberate, justified outcome, not a gap in the theory.
      *   **Puzzles:** Essential for practical application. The "Procreation Asymmetry" often creates pressure for incomparability between existence and non-existence.

  3.  **Asymmetry and Non-Reflexivity:**
      *   **Motivation:** If A is better than B, then B cannot be better than A (Asymmetry). No population can be better than itself (Non-Reflexivity). Fundamental logical properties of "better than."
      *   **Puzzles:** Prevents trivial contradictions.

  ### II. Substantive Value Requirements (Motivated by Intuitions, Highly Contested)
  These reflect ethical judgments about what makes populations good/bad. Different theories prioritize, modify, or reject these based on their core commitments.

  4.  **Pareto Principle (or Strong Pareto):**
      *   **Motivation:** If Population A is identical to Population B except that at least one person in A has higher welfare than their counterpart in B, and no one has lower welfare, then A is better than B. Embodies a minimal individualistic improvement.
      *   **Puzzles:** Seems uncontroversial in Same-Number Cases. Key driver in the **Mere Addition Paradox**: Adding a happy person without harming others seems like an improvement, yet this leads to the Repugnant Conclusion via seemingly rational steps.
      *   **Status:** Often considered a minimal requirement, but strict interpretations conflict with Averagism and some Person-Affecting views. Modified versions exist.

  5.  **Non-Antiegalitarianism:**
      *   **Motivation:** If two populations have the same number of people and the same total welfare, the population with more equally distributed welfare is better.
      *   **Puzzles:** Addresses Same-Number Cases. Reflects the intuition that equality is intrinsically valuable or that inequality is bad. Conflicts with strict Total Utilitarianism in same-total-but-unequal scenarios.

  6.  **Avoidance of the Repugnant Conclusion (Quality Sensitivity):**
      *   **Motivation:** The **Repugnant Conclusion** (RC) must *not* be endorsed. A vast population with lives barely worth living must *not* be judged better than a smaller population with very high-quality lives, even if the total welfare calculation favors the larger one. Requires sensitivity to *quality* of life, not just quantity of welfare units or people.
      *   **Puzzles:** Directly motivated by the RC. Represents a rejection of pure Total Utilitarianism. Often formalized as a **Quality Condition**: For any perfectly equal population with very high positive welfare, there is a larger population with lower positive welfare that is *not* better.
      *   **Status:** A core motivator for many alternatives to Totalism. Non-negotiable for critics of Totalism, explicitly accepted by Totalists.

  7.  **Non-Sadism (or Negative Mere Addition):**
      *   **Motivation:** Adding people with *negative* welfare (lives not worth living) to a population makes the population worse, *ceteris paribus*. Adding suffering is bad.
      *   **Puzzles:** Seems uncontroversial. Contrasts with "Procreation Asymmetry" regarding adding *positive* lives. A weak point in some early formulations trying to avoid RC.

  8.  **The Quality Condition:**
      *   **Motivation:** Formalizes the rejection of the RC (see #6). A population with extremely high welfare per person cannot be outranked by *any* larger population with sufficiently low (but still positive) welfare per person.
      *   **Puzzles:** Direct counter to RC. Stronger than mere "Avoidance." Often a key axiom in impossibility proofs.

  9.  **Mere Addition Intuition:**
      *   **Motivation:** Adding a person with a life worth living to a population, *without affecting the welfare of existing people*, does not make the population worse, and might make it better. (This is weaker than Pareto, which says it *is* better).
      *   **Puzzles:** Core driver of the **Mere Addition Paradox**. Seems intuitively plausible but, combined with Pareto and Transitivity, leads straight to the RC.

  ### III. Person-Affecting Requirements (Reflect Specific Meta-Ethical Views)
  These stem from the idea that morality must be fundamentally tied to affecting *particular individuals*.

  10. **The Person-Affecting Principle (PAP) / No-Difference View:**
      *   **Motivation:** An outcome A can only be better (or worse) than outcome B if A is better (or worse) *for* some particular person who exists or will exist in A or B. There is no "impersonal" value. Directly addresses the **Non-Identity Problem** (choices affecting *who* exists, not just their welfare level).
      *   **Puzzles:** **Non-Identity Problem** is the key motivator (e.g., choosing a policy that causes a future person to exist with a life barely worth living vs. a different policy causing a different person to exist with a much better life - PAP struggles to say the latter is better). **Procreation Asymmetry** (it's wrong to create a miserable person, but not wrong *not* to create a happy person) is often seen as a consequence of PAP-like reasoning. Conflicts strongly with Pareto (#4) and Mere Addition (#9) in cases involving different possible future people.
      *   **Status:** Core commitment of Person-Affecting Views. Often rejected by Impersonalist Views (Totalism, Averagism).

  11. **Procreation Asymmetry (sometimes seen as a consequence of PAP):**
      *   **Motivation:** While there is a strong duty *not* to bring a miserable person (negative welfare) into existence, there is *no* symmetrical duty *to* bring a happy person (positive welfare) into existence. Not creating a happy person is morally neutral.
      *   **Puzzles:** Directly challenges theories that see adding happy lives as always good (Totalism, Mere Addition). Deeply connected to the Non-Identity Problem and PAP.

  ### The Impossibility Trap: Where Requirements Conflict

  The field is defined by **impossibility theorems** (e.g., Parfit's original, Arrhenius's formal proofs). Key conflicts:

  1.  **The Core Impossibility (Avoiding Repugnance vs. Other Intuitions):** You **cannot** simultaneously satisfy *all* of the following:
      *   Transitivity (#1)
      *   Strong Pareto (#4 - adding a happy person *always* improves things)
      *   Non-Antiegalitarianism (#5 - equality matters in same-total cases)
      *   The Quality Condition (#8 - strict avoidance of RC)
      *   A requirement ensuring that adding lives worth living under certain conditions *can* be good (a formalization of Mere Addition intuition #9).
      *   *(Arrhenius's theorems show various combinations of these plus structural axioms are incompatible).*

  2.  **Person-Affecting vs. Impersonalism:** The Person-Affecting Principle (#10) and Procreation Asymmetry (#11) are fundamentally incompatible with the Pareto Principle (#4) and the Mere Addition Intuition (#9) in scenarios involving different identity sets (Non-Identity Problem scenarios). PAP struggles to condemn bringing a miserable person into existence *if that person wouldn't otherwise exist*, or to endorse bringing a happy person into existence *for their own sake*.

  ### Non-Negotiable vs. Negotiable: What Gives?

  *   **Non-Negotiable (for a workable theory):** The **Core Structural Requirements** (#1-3). Without these, the "theory" isn't really a coherent ranking system. Some might relax Completeness (#2) significantly.
  *   **Negotiable (Philosophical Choice):** Everything else (#4-11). This is where the camps diverge:
      *   **Totalists (Classic Utilitarians):** Accept Pareto (#4), Mere Addition (#9), Non-Sadism (#7). *Reject* Avoidance of RC (#6)/Quality Condition (#8) and PAP (#10). Often reject Non-Antiegalitarianism (#5). **RC is accepted.**
      *   **Averagists:** Prioritize average welfare. Often reject Pareto (#4 - adding a below-average happy person lowers the average) and Mere Addition (#9). Usually accept Avoidance of RC (#6) and Non-Antiegalitarianism (#5). Reject PAP (#10). **Mere Addition Paradox is blocked, RC avoided, but face other problems (e.g., "Sadistic Conclusion").**
      *   **Critical-Level / Variable Value Theories:** Modify Totalism by adding a positive "critical level" above zero that a life must exceed to contribute positively to total value. Aim to satisfy Mere Addition (#9) weakly, Pareto (#4), Non-Sadism (#7), and Avoidance of RC (#6)/Quality Condition (#8). **RC avoided, Mere Addition accepted, but face challenges with Non-Antiegalitarianism (#5) and negative welfare.**
      *   **Person-Affecting Views:** Prioritize PAP (#10) and Procreation Asymmetry (#11). Must reject or severely restrict Pareto (#4) and Mere Addition (#9) when future identities differ. Often embrace incomparability (#2). **Non-Identity Problem addressed, Procreation Asymmetry explained, Mere Addition Paradox blocked, RC avoided, but struggle to justify improving the future if it changes who exists.**
      *   **Egalitarian Views:** Prioritize Non-Antiegalitarianism (#5). Must find ways to integrate it with other demands, often conflicting with strong Pareto (#4) or Mere Addition (#9).

  **The Crucial Trade-off:** The fundamental tension lies between:

  1.  **Impersonal Aggregation:** Valuing total or average welfare independently of *who* experiences it. This tends to favor large populations and conflicts with RC avoidance and PAP.
  2.  **Person-Centeredness:** Tying moral value strictly to effects on identifiable individuals. This avoids RC and explains Asymmetry but struggles with same-number equality, Pareto improvements across generations, and justifying population size itself.
  3.  **Quality Sensitivity:** The insistence that very high welfare has lexical priority over quantity. This avoids RC but clashes with seemingly minimal aggregation principles (Pareto, Mere Addition) under transitivity.

  **To resolve your debate, you must first agree on which of these core intuitions (Avoid RC? Accept Mere Addition? Embrace PAP? Value Equality?) are truly non-negotiable *for each of you*, recognizing that satisfying all simultaneously is mathematically impossible.** The scorecard *is* the battleground.
