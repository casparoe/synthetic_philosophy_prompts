  Now, conflicts: Desideratum 3 (graded arbitration) vs. Desideratum 6 (binary subjecthood). The user probably wants this highlighted. Also, non-negotiables vs. camp-specific preferences: affective-cognitive dissociation and empirical adequacy are essential; reportability demands or mereological essentialism are optional. 

