answer: |-
  Here is a structured set of criteria of adequacy for theories of interhemispheric phenomenal unity in split-brain patients, with emphasis on the anterior commissure-sparing configuration, subcortical arbitration, and the affective-cognitive dissociation. Each desideratum includes its motivating cases, distinctions, variations, and philosophical constraints.

  ### Core Desiderata & Their Motivations

  1.  **Explain Preserved Affective Unity with Dissociated Cognitive Access:**
      *   **Must Explain:** Coherent emotional responses (e.g., fear, pleasure) to stimuli presented exclusively to either hemisphere, despite the lateralized stimulus being unreportable or unidentifiable by the other hemisphere. E.g., A fearful face presented to the right hemisphere (RH) triggering a physiological fear response (skin conductance) and a feeling of fear reportable by the left hemisphere (LH), even though the LH cannot identify *what* caused the fear.
      *   **Must Distinguish:** Phenomenal affective unity (integrated feeling state) from cognitive access unity (integrated conceptual awareness/report) and from narrative unity (coherent self-story). Crucially, **affective integration** (mediated by anterior commissure/amygdala) vs. **propositional/cognitive integration** (requiring corpus callosum).
      *   **Must Accommodate:** The specific anatomy: Intact anterior commissure/subcortical affective pathways (amygdala, hypothalamus, brainstem) enabling affective transfer, while callosotomy disrupts cortical propositional transfer.
      *   **Philosophical Commitment:** Must explain how a *phenomenal* feeling state (affect) can be unified across hemispheres without requiring unified *conceptual access* to its source or content. Neutral on whether affective unity is primitive or constructed, but must entail its possibility without callosal transfer.

  2.  **Distinguish & Account for Multiple "Unities" (Phenomenal, Access, Narrative, Affective-Cognitive):**
      *   **Must Explain:** Dissociations like: (a) A patient reporting feeling "funny" or anxious (unified affect) after a threatening stimulus is shown only to the RH, but having no verbal explanation (disrupted access/narrative unity). (b) Performing correctly on a bimanual coordination task (subcortically mediated motor unity) while verbally denying the purpose or even awareness of one hand's actions (disrupted access/narrative unity).
      *   **Must Distinguish:** *Phenomenal Unity* (seamless, unified qualitative experience) as a potential level distinct from *Access Unity* (availability of content to global cognitive/reporting systems), *Narrative Unity* (construction of a single autobiographical self), and crucially **Affective Integration** (unified feeling tone) vs. **Cognitive Integration** (unified conceptual content, beliefs, judgments) across hemispheres.
      *   **Must Accommodate:** Cases where one type of unity (affective, basic motor) is preserved while others (propositional access, narrative) are disrupted.
      *   **Philosophical Commitment:** Must preserve the conceptual distinctness of these types of unity. Should remain neutral on whether phenomenal unity necessarily entails access or narrative unity, or vice-versa.

  3.  **Incorporate the Role of Subcortical Arbitration & Coordination:**
      *   **Must Explain:** (a) Response coordination without conflict (e.g., bimanual tasks guided by subcortical structures like superior colliculi, basal ganglia). (b) Response *suppression* or *selection* (e.g., preventing contradictory actions, resolving simple interhemispheric conflicts like visual rivalry suppression via subcortical attention mechanisms). (c) Graded influence – why subcortical mechanisms sometimes succeed in coordinating/integrating and sometimes fail, leading to hemispheric rivalry.
      *   **Must Distinguish:** Cortical-level representational unity/disunity from subcortical mechanisms for behavioral coordination, attentional allocation, and affective tone setting.
      *   **Must Accommodate:** The variability in behavioral coherence observed across different split-brain patients and different tasks, attributable to the effectiveness of intact subcortical pathways (colliculi, basal ganglia, thalamus, brainstem) in specific contexts.
      *   **Philosophical Commitment:** Must allow for unity/disunity to be a dynamic, graded outcome of interactions between cortical isolation and subcortical integration/arbitration mechanisms. Neutral on whether subcortical processes themselves constitute phenomenal states.

  4.  **Handle Pathological & Anatomical Variation:**
      *   **Must Explain:** Differences between: (a) Complete callosotomy (no cortical bridge), (b) Partial callosotomy sparing anterior commissure (affective bridge), (c) Sparing other commissures (e.g., hippocampal), (d) Gradual disconnection (e.g., callosal tumors, MS lesions) vs. acute surgical section. E.g., Why sparing the anterior commissure leads to different symptom profiles (more affective coherence) compared to complete section.
      *   **Must Distinguish:** The specific contributions of different commissural pathways (callosal vs. anterior vs. hippocampal) and subcortical structures to different aspects of unity/disunity.
      *   **Must Accommodate:** The continuum of disconnection syndromes, not treating "split-brain" as a monolithic condition. Account for why gradual disconnection might lead to compensatory mechanisms or less pronounced disunity than acute section.
      *   **Philosophical Commitment:** Must be specific enough to map onto real anatomical variations, but abstract enough to cover the range. Neutral on metaphysical implications of gradual vs. abrupt disconnection.

  5.  **Explain Phenomenal Unity Without Callosal Transfer:**
      *   **Must Explain:** The possibility of a single, unified field of phenomenality persisting despite the severing of the primary cortical information highway (corpus callosum), potentially relying on subcortical and/or anterior commissural routes for affective/motor coherence.
      *   **Must Distinguish:** The *mechanism* of information transfer/integration (callosal vs. subcortical) from the *ontological status* of the resulting experience (unified or not).
      *   **Must Accommodate:** The intuition (and some patient reports) of a single stream of consciousness even in the face of demonstrable cognitive disunity.
      *   **Philosophical Commitment:** Must demonstrate how phenomenal unity is *possible* without callosal transfer. **Non-Negotiable:** Cannot *assume* callosal transfer is *necessary* for phenomenal unity. Should remain neutral on whether unity is primitive, constructed, or emergent (but must explain its mechanism in this context).

  6.  **Address the Subjecthood Question (One vs. Two):**
      *   **Must Explain:** How behavioral conflict (e.g., hands fighting over a task), independent goals/awareness in each hemisphere, and unified affect/coordination can coexist within a single organism. Does phenomenal unity entail singularity of subject?
      *   **Must Distinguish:** Unity of consciousness (a phenomenological property) from singularity of subject/person (a metaphysical/social entity). Can there be one subject with disunified consciousness? Or two subjects within one body sharing some unified states (affect)?
      *   **Must Accommodate:** The empirical ambiguity: Evidence sometimes points strongly towards two centers of awareness (dual-stream view), sometimes towards underlying unity (unified-field), and often towards complex mixtures (graded-integration).
      *   **Philosophical Commitment:** Must explicitly engage with the implications for personal identity and subjecthood. **Tension Flagged:** This desideratum is in **direct tension with Desideratum 3 (Subcortical Arbitration)**. Accommodating graded, context-dependent subcortical coordination/arbitration that sometimes produces coherent responses and sometimes conflict seems incompatible with a strict, binary "one subject OR two subjects" answer. A theory must either resolve this tension (e.g., by showing arbitration doesn't imply subject unity) or embrace a non-binary account of subjecthood/agency.

  7.  **Account for Reportability Asymmetries & Unreportable Unity:**
      *   **Must Explain:** (a) Why the LH (usually verbal) can report on its own experiences and some RH experiences (via subcortical/affective channels) but not on specific RH propositional content. (b) Why patients often report feeling unified despite behavioral evidence of disunity. (c) Evidence of unreportable cross-hemispheric priming/influence (e.g., affective priming, motor priming).
      *   **Must Distinguish:** Reportability (a functional capacity tied to specific cognitive systems, usually LH) from phenomenal character/unity itself.
      *   **Must Accommodate:** The LH's dominance in constructing the verbal narrative/report, potentially masking underlying disunity or unreportable unity (e.g., affective unity).
      *   **Philosophical Commitment:** **Non-Negotiable:** Cannot equate phenomenal unity with reportable unity. Must allow for the possibility of unreportable unified states (e.g., integrated affect) and unreportable disunities. Should remain neutral on whether first-person report is the ultimate authority on unity *in this specific population* (given known cognitive disconnections).

  8.  **Maintain Empirical Adequacy & Avoidance of "Ghost Unity":**
      *   **Must Explain:** All core experimental phenomena without resorting to unexplained "hidden" unity mechanisms or ignoring robust evidence of disunity. Must ground phenomenal claims in empirically measurable effects (behavior, physiology, report).
      *   **Must Distinguish:** Well-supported inferences about internal states based on converging evidence from different methodologies (e.g., lateralized response + report + physiology) from purely speculative claims.
      *   **Must Accommodate:** The full range of data, including instances of profound disunity and instances of preserved integration/coordination.
      *   **Philosophical Commitment:** **Non-Negotiable:** Must be empirically grounded and falsifiable. Cannot posit phenomenal unity that has *no* measurable consequences or is completely insulated from empirical investigation. Avoids vitalism or substance dualism.

  ### Non-Negotiable vs. Camp-Specific Preferences

  *   **Non-Negotiable for Any Adequate Account:**
      1.  Explain the possibility of phenomenal unity without callosal transfer (Desideratum 5).
      2.  Distinguish phenomenal unity from access/reportability unity (Desideratum 2, 7).
      3.  Account for the specific role of the intact anterior commissure in affective integration distinct from cognitive integration (Desideratum 1, 2).
      4.  Incorporate the empirical reality of subcortical arbitration/coordination and its variability (Desideratum 3).
      5.  Handle the core anatomical variations (complete, anterior-sparing) (Desideratum 4).
      6.  Maintain empirical adequacy (Desideratum 8).

  *   **Camp-Specific Preferences:**
      1.  **Insistence on First-Person Reportability as Ultimate Evidence:** While report data is crucial, demanding *all* claims about unity be directly reportable by the patient (especially given LH dominance) is unrealistic and ignores unreportable states (affect, subcortical integration). (Contra Desideratum 7).
      2.  **Mereological Essentialism about Persons:** The demand that a person's identity strictly depends on the continuity of their brain parts/connections, potentially forcing a "two persons" conclusion upon disconnection, regardless of phenomenal or behavioral evidence for underlying unity/coordination.
      3.  **Strict Binary Subjecthood:** Insisting the *only* options are "one subject" or "two subjects" (often tied to the above), which clashes with graded subcortical arbitration (Desideratum 3 vs. 6 tension).
      4.  **Primitivism vs. Constructivism vs. Emergentism:** While the theory must *explain* unity, choosing one of these specific metaphysical accounts of unity's nature is a theoretical choice, not a prerequisite for adequacy (Neutrality in Desiderata 1, 2, 5).
      5.  **Perfect Empirical Equivalence:** Demanding the theory produces predictions *identical* in every detail to standard neuropsychological descriptions might be too restrictive if those descriptions underplay phenomenal aspects.

  ### How Standard Views Fare (Briefly)

  *   **Unified-Field View:** Struggles severely with Desiderata 1 (affective-cognitive dissociation), 3 (subcortical arbitration variability), 4 (anterior sparing vs complete), 6 (subjecthood tension), and core empirical evidence of disunity (Desideratum 8). Fails non-negotiables.
  *   **Dual-Stream View:** Excels on Desiderata 1 (dissociation), 4 (variation), 7 (reportability asymmetry), and empirical adequacy (8) regarding disunity. Struggles profoundly with Desiderata 2 (affective unity), 3 (subcortical coordination), 5 (unity without callosum), 6 (ignores unified affect/coordination), failing key non-negotiables.
  *   **Graded-Integration Approaches:** Most promising baseline. Handles Desiderata 1, 2, 3, 4, 7, 8 well. Directly tackles the tension in Desideratum 6 (subjecthood vs. arbitration) by embracing non-binary/graded notions of unity and agency. The core challenge is providing a satisfying account of *phenomenal* unity (Desideratum 5) that isn't reduced to functional coordination or access – explaining *what it is like* to have unified affect but disunified cognition within one potentially graded subject.

  This specification provides the rigorous framework needed to evaluate whether phenomenal unity can persist through partial disconnection mediated by affective channels, demanding theories directly confront the unique interplay of severed cognition and preserved feeling within the architecture of a single brain. The tension between subcortical arbitration and subjecthood is likely the central philosophical battleground.
