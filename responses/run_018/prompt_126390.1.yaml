prompt: |-
  Write a poem of about 24 to 30 lines in loose blank verse with an intermittent rhyme scheme, spoken in the voice of someone revising their own final vocabulary in real time. The subject is Rorty’s antirepresentationalism: the rejection of language and mind as mirrors of nature, and the replacement of representational accuracy with practical utility for solidarity and self-creation. To keep the idea from being generic, build the poem around a specific conceptual pressure—what antirepresentationalism implies about a vocabulary that collapses not because it misrepresents reality (there being no reality to mirror) but because it loses its users’ capacity to coordinate action or sustain narrative identity, that is, a failure without falsehood. Begin with representationalist imagery—mirrors, correspondence, fixed reference—then execute a structural turn around lines 14 to 16 in which the mirror breaks not through distortion but through practical uselessness for the speaker’s projects; after the turn, the speaker should treat words as contingent tools rather than pictures. Let the poem’s sonic architecture do parallel work: use closed, echoing rhymes in the opening to evoke fixed correspondence, and shift to open, slant rhymes in the closing lines to evoke contingency. The poem should be accurate enough that someone familiar with Rorty recognizes the position rather than seeing a vague gesture at pragmatism, and it should stand as a poem for a reader who does not know the theory. Do not include citations, footnotes, bibliographic references, or appeals to specific texts. After the poem, provide a brief structured summary as a JSON object with exactly these fields: "opening_representationalist_imagery" (list the line numbers where mirror or correspondence imagery appears), "turn_line_range" (the line range of the structural turn), "failure_without_falsehood" (one or two sentences explaining how the poem renders vocabulary failure without misrepresentation), "sonic_shift" (brief description of the rhyme change from closed to open or slant), and "final_vocabulary_tool" (the closing image or phrase that treats language as a practical instrument rather than a mirror).
