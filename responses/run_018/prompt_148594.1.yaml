prompt: |-
  For a feature I am writing on the philosophy of effective altruism, a colleague summarized the institutional critique as follows: because effective altruism demands quantifiable impact, it directs resources toward interventions with clean metrics—such as bed-net distributions—while starving complex institutions like customary legal frameworks or oral-history archives whose benefits are diffuse and intergenerational; at the same time, the 'earning to give' pathway allows high-earners to treat donations as moral offsets for structural harms produced by their industries, so that the movement ends up legitimizing economic hierarchy rather than challenging it. I want to verify whether this captures the argument or smuggles in errors. Please reply in exactly five numbered items, each comprising one or two sentences, with no introduction and no conclusion: first, indicate which elements accurately reflect the measurability-bias and institutional-erosion claims; second, identify subtle misrepresentations, particularly whether framing earning-to-give as moral offsetting belongs to the standard critique; third, assess whether the conclusion about legitimizing hierarchy follows from those premises; fourth, sketch the reply an effective altruist might offer regarding quantitative evaluation and institutional humility; and fifth, state whether this summary is fair enough for publication.
reasoning: |-
  Okay, the user is working on a feature about effective altruism (EA) and wants to verify a colleague's summary of institutional critiques. They need a structured, five-point response without intros or conclusions. 

  First, I need to dissect the colleague's two main claims: measurability bias leading to neglect of complex institutions, and "earning to give" as moral offsetting that legitimizes hierarchy. The first part about quantifiable metrics favoring bed-nets over oral-history archives is spot-on—that's a core EA critique. The institutional erosion angle is also correctly identified as a common argument.

  Second, the "moral offsets" framing feels sticky. While critics do question whether earning-to-give addresses systemic harm, phrasing it as "offsetting" implies EA endorses harm-licensing, which isn't entirely fair. The standard critique focuses more on whether donations can neutralize complicity, not that EA explicitly treats them as offsets. 

  Third, the leap to "legitimizing hierarchy" seems underbaked. The premises describe resource allocation and offset concerns, but concluding EA actively reinforces inequality requires more evidence—like showing the movement rejects wealth redistribution. This overextends the argument.

  Fourth, an EA defender would counter that quantification targets tractability, not worth, and that they fund some hard-to-measure work (e.g., policy advocacy). They'd also note earning-to-give participants often push for ethical industry reforms alongside donating. 

  Fifth, despite minor overstatements, the summary is publishable with context. It captures key tensions accurately enough for journalism, as long as the piece acknowledges EA's nuances elsewhere. 

  The user seems meticulous—probing for hidden biases suggests they care about intellectual honesty. Their anxiety about "smuggling in errors" implies this is for a high-stakes publication. I’ll keep the response tight and evidence-based to match their rigor.
answer: |-
  Here is the breakdown in five numbered items:

  1.  The summary accurately captures the core measurability-bias critique: EA's emphasis on quantifiable metrics favors interventions like bed-net distributions over complex institutions like customary legal systems or oral-history archives, whose diffuse, long-term benefits are harder to measure, potentially starving them of resources.
  2.  Framing "earning to give" primarily as "moral offsetting" for structural harms subtly misrepresents the standard critique; while critics argue it allows ignoring complicity in harmful systems, the core concern is often about complicity and opportunity cost, not that EA explicitly promotes donations *as offsets* for ongoing harm.
  3.  The conclusion that EA *legitimizes economic hierarchy* does not strictly follow from the premises about measurability bias and earning-to-give critiques alone; this is a stronger, separate political claim requiring additional arguments about EA's stance on systemic inequality and wealth distribution beyond resource allocation efficiency.
  4.  An effective altruist might reply that quantitative evaluation prioritizes tractable impact where resources are scarce, but doesn't deny the value of complex institutions; they might also cite EA funding for policy, advocacy, and patient philanthropy as evidence of institutional humility and engagement with hard-to-measure causes.
  5.  While the summary contains minor overstatements (particularly framing earning-to-give as explicit "offsetting" and the strong hierarchy claim), it is a fair representation of common institutional critiques for publication, accurately reflecting core arguments about measurability bias and institutional neglect.
