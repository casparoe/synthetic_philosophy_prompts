  First, I should recall Walzer's actual arguments. From what I remember, Walzer's dirty hands concept is rooted in the idea that political ethics isn't just about choosing the lesser evil but about experiencing moral conflict. He argues that morality isn't unified; there are different moral systems that can conflict. So when a politician does something necessary but morally wrong, like torture to prevent a bombing, they're violating deep moral norms. The guilt they feel is because they've broken a moral rule, not just because they're unhappy about the costs. This guilt is a sign of their moral seriousness, showing they're still committed to the values they had to compromise.

  The friend's summary seems to miss this. By calling it "consequentialism with a guilty conscience," they're reducing it to a utilitarian calculation where guilt is tacked on. But Walzer is saying the guilt is intrinsic—it comes from the inherent wrongness of the act, not just the consequences. The politician isn't just weighing costs; they're facing a conflict between different moral demands. For example, the duty to protect lives versus the absolute prohibition against torture. So the clash is within morality itself, not between morality and politics. That's a key point the friend might be overlooking.

  Also, the friend claims Walzer invented this to criticize absolutists as too rigid. While Walzer does critique absolutism, his deeper point is about the tragic nature of political choice. The politician who gets their hands dirty is still guilty, even if the act was necessary. This challenges both consequentialists (who might justify the act without guilt) and absolutists (who refuse to act). So it's not just a rhetorical device; it's a real ethical dilemma.

  Regarding secrecy vs. transparency, the friend frames the debate around whether to admit wrongdoing publicly. But Walzer sees this as a secondary issue. The primary problem is the moral conflict itself. Public confession might be part of it, but it's not the core. Walzer suggests that admitting guilt could be a way to reaffirm the violated norms, but he's more focused on the internal conflict rather than the public relations aspect.

