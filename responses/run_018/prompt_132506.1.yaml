  A friend summarized the dirty-hands problem for me like this: polticians sometimes have to break moral rules to stop catastrophe, and Walzer's point is that they should feel guilty even when they picked the least-bad option. My friend said this is just consequentialism with a guilty conscience tacked on, and that Walzer made it up mainly to show absolutists are too rigid for government. He also claimed the whole debate is really about whether they should admit the wrongdoing publicly or hide it. Something feels off but i cant pin it down. Is this fair? Where does it confuse dirty hands with normal cost-benefit reasoning, is Walzer's view actually about a clash inside morality rather than morality versus politics, and is the secrecy-versus-transparency point a central philosophical issue or just a practical side question?
