prompt: |-
  Hey, I've been re-reading some old LW threads on split-brain stuff and I keep running into this tech analogy people use: the two hemispheres are like two seperate OS processes on one bare-metal server, with the corpus callosum as a high-bandwidth IPC pipe that got cut. They share peripherals (eyes, ears) but don't sync working memory, so you get those classic cases where the left hand grabs one card while the verbal left hemisphere reports another. I want to audit how far this holds, so lay out the correspondence table -- server, processes, shared peripherals, severed cable -- then the breakdown points, especially wether there's actually one user account or two. Does the analogy smuggle in a computational theory of mind that's doing all the work, and does the "two minds" conclusion survive once the disanalogies are on the table? Give me exactly five numbered points, each just one or two sentences, with no intro or conclusion.
reasoning: |-
  We are going to map the tech analogy to split-brain phenomena and then note breakdown points.

  1. **Server**: The physical brain (hardware) is the bare-metal server, running the mind's processes.
  2. **Processes**: Each cerebral hemisphere is a separate OS process, with its own processing and memory (working memory not shared).
  3. **Shared Peripherals**: Eyes, ears, and other sensory organs are shared peripherals, with each hemisphere receiving input (though with lateralization, e.g., left visual field to right hemisphere).
  4. **Severed Cable**: The corpus callosum is the high-bandwidth IPC pipe; when severed, inter-process communication is cut, leading to independent operation.
  5. **User Account**: The analogy breaks at the "user account" level because the unity of consciousness pre-surgery suggests one user, but post-surgery, behavioral evidence (like conflicting actions) implies two distinct agents, challenging the idea of a single user.

  Breakdown points:
  - The computational theory of mind is indeed smuggled in, as it assumes the mind is like software on hardware, which may oversimplify neural processes.
  - The "two minds" conclusion holds behaviorally but philosophically contested; the analogy doesn't resolve subjective unity (if any) post-surgery.
answer: |-
  1. **Server = brain hardware**: The physical brain is the bare-metal server, providing shared computational resources for both hemispheres.  
  2. **Processes = hemisphere modules**: Each hemisphere operates as a separate OS process, with isolated working memory and processing for tasks like vision or language.  
  3. **Shared peripherals = sensory organs**: Eyes/ears act as shared peripherals, feeding input to both hemispheres (e.g., left visual field to right hemisphere), but without automatic sync.  
  4. **Severed cable = corpus callosum**: The corpus callosum is the high-bandwidth IPC pipe; when cut, it halts direct inter-hemispheric data transfer, causing desynchronized outputs (e.g., conflicting hand/verbal reports).  
  5. **User account breakdown**: The analogy implies two "user accounts" post-severance due to independent behaviors, but pre-surgery unity and residual cross-talk muddy whether one or two agents exist—exposing how the computational theory smuggles in discrete "processes" while consciousness may resist such partitioning.
