answer: |-
  ### Teaching Plan: Two-Hour Seminar on Common Knowledge of Rationality

  **Target Audience:** Strong first-year undergraduates in philosophy and economics. Familiar with Nash equilibrium computation in simple games but no prior exposure to epistemic game theory or formal notions of knowledge.

  **Core Objective:** Distinguish "common knowledge of rationality" (CKR) from finite levels of mutual knowledge, emphasizing how CKR’s fixed-point structure enables deeper strategic inferences.

  ---

  #### 1. **Introduction: Rationality and Nash Equilibrium (10 min)**
     - **Content:** 
       - Recap rationality (each player maximizes expected utility given beliefs).
       - Review Nash equilibrium (no unilateral incentive to deviate).
       - **Problem:** Nash equilibrium assumes players correctly anticipate others' actions, but it doesn’t specify *how* they form these beliefs. Some equilibria rely on "unreasonable" beliefs.
     - **Why now?** Ground the seminar in familiar concepts. Motivate the need for stronger epistemic conditions.

  #### 2. **Formalizing Knowledge: From Individual to Mutual (20 min)**
     - **Content:**
       - Define individual knowledge: "Player \(i\) knows \(P\)" means \(P\) is true and \(i\) believes \(P\) (veridicality).
       - Mutual knowledge:  
         - \(E^1(P)\): Everyone knows \(P\).  
         - \(E^2(P)\): Everyone knows \(E^1(P)\) (everyone knows that everyone knows \(P\)).  
         - \(E^k(P)\): Finite \(k\)-level mutual knowledge.
       - **Key insight:** Mutual knowledge is recursive but terminates at finite \(k\).
     - **Why now?** Students must grasp mutual knowledge before understanding its limitations. Sets the stage for common knowledge as a fixed point.

  #### 3. **Common Knowledge: Fixed-Point Structure (20 min)**
     - **Content:**
       - Define common knowledge: \(P\) is common knowledge if:
         - Everyone knows \(P\) (\(E^1(P)\)),  
         - Everyone knows that \(P\) is common knowledge (infinite recursion as a fixed point).
       - Contrast with \(E^k(P)\): Finite \(k\) is insufficient for genuine common knowledge.
       - **Analogy:** Public announcements (e.g., a clock striking noon) make an event common knowledge; individual knowledge alone does not.
     - **Why before CKR?** Students will conflate CKR with \(E^k\)(rationality) without this foundation. Explicitly highlight the fixed-point nature.

  #### 4. **Puzzle: Muddy Children (30 min)**
     - **Setup:** 
       - \(n\) children, \(k\) have muddy foreheads. Each sees others’ foreheads but not their own. Father announces: "At least one of you is muddy." He then asks repeatedly, "Do you know if you’re muddy?"
     - **Key Observations:**
       - Before the announcement: All children know "at least one is muddy," but it is **not common knowledge**.
       - After the announcement: The fact becomes common knowledge.
       - On the \(m\)-th query (\(m \leq k\)), the \(m\)-th muddy child deduces their state.
     - **Why this puzzle?**
       - **Must have:** Iterative deduction where the gap between \(E^k\)(one muddy) and common knowledge is vivid. Shows that an announcement can transform knowledge even if everyone already knew \(P\) individually.
       - **Must lack:** Strategic payoffs (to isolate epistemic dynamics). Payoffs are reintroduced in the game-theoretic example.
     - **Address misconception:** Public announcements *can* change knowledge states even if everyone individually knew \(P\) (addressed during debrief).

  #### 5. **Game-Theoretic Payoff: Rationalizability and CKR (30 min)**
     - **Concrete Game:**
       ```text
       Player 1 \ Player 2   L       C       R
             T             0,0     5,10    0,0
             M            10,5     0,0     5,0
             B             0,0     0,5    10,10
       ```
       **Payoff Interpretation:**  
       - Row player (P1): T, M, B.  
       - Column player (P2): L, C, R.  
       - Unique Nash equilibrium: (B, R) → (10, 10).  
     - **Analysis with CKR:**
       - **Step 1 (Rationality):** Delete strictly dominated strategies.  
         - P2’s R is dominated by C/L? Not yet. P1’s T is dominated by M/B? Not yet.  
       - **Step 2 (Mutual knowledge of rationality):**  
         - P1 knows P2 is rational → P2 won’t play R (dominated if P1 plays T/M, but not B).  
         - P2 knows P1 is rational → P1 won’t play T (dominated by M if P2 plays L/C).  
         - Reduced game: P1: {M, B}, P2: {L, C}.  
       - **Step 3 (Common knowledge of rationality):**  
         - P1 knows P2 knows P1 is rational → P2 expects P1 to avoid T, so P2 plays L or C.  
         - P2 knows P1 knows P2 is rational → P1 expects P2 to avoid R, so P1 plays M or B.  
         - Iterate: M is dominated for P1 if P2 plays C? M yields 0 if P2 plays C, B yields 0. Not dominated.  
         - With CKR, only (B, R) survives: P1 plays B (best to R), P2 plays R (best to B).  
     - **Why this game?** 
       - Shows CKR’s power: Only (B, R) is rationalizable.  
       - **Anchor:** CKR enables P1 to infer that P2 will recognize B is optimal, justifying R. Without CKR, P1 might fear P2 plays C/L, making M/T seem viable.

  #### 6. **Addressing Misconceptions (Throughout)**
     - **Misconception 1:** "\(E^k\)(rationality) for large \(k\) is equivalent to CKR."  
       - **When addressed:** During common knowledge definition (Section 3) and Muddy Children.  
       - **Preemption:** Use the puzzle to show \(E^k\)(one muddy) holds for any \(k < n\), but children only deduce muddiness after \(k\) queries. CKR requires a fixed point, not high \(k\).  
     - **Misconception 2:** "Public announcements of known facts don’t change anything."  
       - **When addressed:** During Muddy Children debrief.  
       - **Preemption:** Before the announcement, no child can deduce their state. After, the iterative deduction starts.  
     - **Misconception 3:** "CKR always leads to Nash equilibrium."  
       - **When addressed:** During game analysis.  
       - **Preemption:** In the example, (B, R) is Nash, but CKR excludes non-rationalizable Nash equilibria in other games (mention as footnote; no need for examples).

  #### 7. **Closing Check: Concept Internalization (10 min)**
     - **Activity:** Pose a new game:
       ```
       P1 \ P2    L      R
          U     2,2    0,0
          D     0,0    1,1
       ```
       - **Question 1:** "If rationality is mutual knowledge up to \(E^2\), can (U, L) occur? Why?"  
         *(Answer: Yes. P1 might play U if they believe P2 plays L, and mutual knowledge doesn’t force alignment.)*  
       - **Question 2:** "Under CKR, is (U, L) possible? Why?"  
         *(Answer: Yes, but CKR doesn’t guarantee it. (D, R) is also rationalizable. CKR doesn’t resolve coordination; it only rules out irrational strategies.)*  
     - **Success criteria:** Students distinguish mutual knowledge from CKR and articulate why CKR permits multiple outcomes here.

  #### 8. **Deliberate Omissions (5 min)**
     - **Left out:**  
       - Mixed strategies and correlated equilibrium.  
       - Aumann’s agreement theorem or Bayesian games.  
       - Extensive-form games (e.g., centipede game).  
     - **Justification:** "Today focused on normal-form games and the base epistemology. These are natural next steps but exceed our scope."

  ---

  **Why This Sequence?**  
  - **Dependencies:** Knowledge (→ mutual knowledge (→ common knowledge (→ CKR))) is logically sequential. Without common knowledge defined first, students cannot grasp why CKR differs from \(E^k\)(rationality).  
  - **Flow:** Muddy Children isolates epistemology; the game reapplies it to payoffs. Misconceptions are preempted at points where they naturally arise.  
  - **Anchored in Payoffs:** The 3x3 game shows CKR’s real-world impact—players infer optimal behavior (B, R) only under CKR, altering outcomes.  

  **Total Time Allocation:**  
  - Intro: 10 min  
  - Knowledge → Mutual Knowledge: 20 min  
  - Common Knowledge: 20 min  
  - Muddy Children: 30 min  
  - Game & CKR: 30 min  
  - Closing Check: 10 min  
  - Omissions/Wrap-up: 5 min
