  Teaching Plan:

  1. **Introduction (10 minutes)**
     - Briefly review the idea of rationality in games (players are expected utility maximizers, given their beliefs) and the concept of Nash equilibrium (as a situation where each player's strategy is a best response to the others).
     - Motivate the seminar: In some games, Nash equilibrium seems too permissive. We need a stronger condition to rule out some equilibria that rely on "unreasonable" beliefs. This leads to the idea that players not only are rational but that this rationality is known to all in a very strong sense.

  2. **Introducing the Notion of Knowledge (15 minutes)**
     - Explain the formal notion of knowledge for a player: if a player knows a fact, then that fact must be true (veridicality). Use a simple example: if Alice knows that Bob is going to play Left, then Bob indeed plays Left.
     - Introduce mutual knowledge: "Everyone knows P" (E^1(P)) meaning that for every player, they know P. Then "Everyone knows that everyone knows P" (E^2(P)) and so on. But note: E^k(P) for a finite k is not enough for common knowledge.
     - **Why common knowledge must come first?** Without the concept of common knowledge, students might think that if we have E^k(P) for a sufficiently large k, that would be equivalent to common knowledge. We must show that common knowledge is a fixed point (P is common knowledge if everyone knows P, and everyone knows that P is common knowledge) and that it is strictly stronger than any finite level of mutual knowledge.

  3. **The Puzzle: The Muddy Children Puzzle (30 minutes)**
     - **Why this puzzle?** It vividly shows the gap between finite mutual knowledge and common knowledge. The puzzle does not require game payoffs but illustrates how an announcement (even one that everyone already knew individually) can change the state of knowledge when it becomes common knowledge.
     - **Setup**: n children are playing. Some have mud on their foreheads. Each child can see every other child's forehead but not their own. The father announces: "At least one of you has mud on your forehead." He then asks repeatedly: "Does anyone know if they have mud?" The first few times, no one answers, but eventually, the muddy children figure it out.
     - **Key points**:
       - Before the announcement, it is true that at least one child is muddy (so everyone individually knows that). But it is not common knowledge.
       - The father's announcement makes it common knowledge that at least one child is muddy.
       - The iterative process of asking and no one answering in the first k-1 rounds (for k muddy children) gradually updates the children's knowledge until the muddy children can deduce their state.
