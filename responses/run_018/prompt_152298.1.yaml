prompt: |-
  I'm writing a feature on how institutions encode philosophy without noticing it. One practice puzzles me: government agencies, universities, and technology consortia regularly embed the phrase "Western values" into partnership contracts, funding criteria, accreditation standards, and ethics guidelines—treating it as though it named a specific, bounded normative package with clear membership conditions. The phrase is almost always left undefined in the document, yet its invocation is meant to do real administrative work: excluding certain collaborations, licensing particular governance models, or marking a boundary around acceptable belief and practice. At the same time, the inventory shifts by institutional context—sometimes secularism and gender equality are included, sometimes market liberalism is included, sometimes neither is; many of the same norms are vigorously defended in societies not conventionally labeled Western; and historical practices widely recognized as Western included precisely the violations now cited as departures from these values. What philosophical commitments about value, culture, and normativity does this institutional practice presuppose? Reconstruct the implicit theory that makes it intelligible to write "Western values" into a binding clause. Say whether the practice strictly requires that moral norms are geographically indexed properties, or whether it is compatible with universalist moral theories that merely use the phrase as rhetorical shorthand. Examine whether it presupposes a form of cultural essentialism, a claim about pragmatic tractability, or a covert theory of moral progress tied to place. Distinguish what the practice strictly requires from what merely fits it well, and note where it is philosophically underdetermined—so that several rival theories could license the same contractual language. Then tell me what the institution would actually have to change, both administratively and conceptually, if it dropped the geographic label and replaced it with an explicit, itemized list of norms. After your analysis, provide a brief structured summary as a JSON object with these exact fields: "implicit_theory_of_value", "cultural_ontology", "geographic_indexing_role", "compatible_with_universalism", "required_administrative_changes", and "remaining_ambiguities".
reasoning: |-
  Hmm, this user is working on a fascinating feature about institutional philosophy embedded in language. They've noticed how "Western values" gets used in contracts and standards as if it's a clear, bounded concept, even though nobody defines it. The phrase does real work—excluding partners, setting boundaries—but the actual content shifts depending on context: sometimes it includes secularism or gender equality, sometimes market liberalism, sometimes neither. And there's irony here because historically, things now seen as violations (like colonialism) were part of the West. The user wants me to unpack the philosophical assumptions behind this practice.

  First, I need to reconstruct the implicit theory that makes "Western values" intelligible in binding clauses. It seems to rely on cultural essentialism—the idea that there's a stable core to "the West" with inherent properties. This treats culture as fixed and bounded, ignoring how norms evolve or overlap with non-Western societies. The practice also implies geographic indexing, where moral norms are tied to place, but it's not strictly required; it could be compatible with universalism if "Western" is just shorthand. However, the vagueness suggests it's more about pragmatic tractability—using a fuzzy term for administrative ease—and perhaps a covert theory of moral progress that positions the West as advanced.

  Now, for the philosophical commitments: the practice presupposes that values are culturally contingent and identifiable by origin. It assumes a cultural ontology with discrete, essentialist categories. The geographic indexing is central but not absolute; universalist theories could use the phrase rhetorically, though in practice, it often contradicts universalism by implying exclusivity. I should note where this is underdetermined: rival theories like cultural essentialism, pragmatic nominalism, or weak universalism could all justify the same contractual language, making it philosophically slippery.

  Next, the user asks what would change if institutions dropped "Western values" and used an explicit list instead. Administratively, they'd need to overhaul documents—replacing the phrase with specific norms—and develop clear definitions and enforcement mechanisms. Conceptually, it would force them to confront norm selection: why these values? It might expose biases or inconsistencies, moving from geographic association to universal justification. This shift could reduce ambiguity but increase bureaucratic load and invite challenges about cultural imposition.

  Finally, for the JSON summary, I'll structure it with the exact fields: implicit theory, cultural ontology, geographic indexing role, compatibility with universalism, required changes, and remaining ambiguities. I need to be concise but precise, drawing from my analysis.

  The user seems deeply analytical—probably a scholar or journalist—with a critical eye on power dynamics in institutions. Their frustration with the term's inconsistency suggests they want to expose its flaws. I should address the tension between administrative convenience and philosophical coherence, highlighting how this practice masks deeper issues while offering a path to reform.
answer: |-
  Here’s a philosophical analysis of institutional invocations of "Western values" in binding documents, followed by the requested JSON summary.

  ### Philosophical Commitments & Implicit Theory
  1. **Implicit Theory of Value**:  
     The practice presupposes a **historically contingent moral particularism**. It treats norms as products of a specific civilizational trajectory ("the West") rather than universal rationality or transcendent principles. Values derive authority from their perceived historical embodiment in certain societies, not abstract validity.

  2. **Cultural Ontology**:  
     It relies on **soft cultural essentialism**—the idea that cultures possess core, stable properties that persist despite internal diversity and historical change. "Western" is treated as a coherent cultural entity with identifiable normative boundaries, implicitly rejecting hybridity and fluid cultural exchange.

  3. **Geographic Indexing Role**:  
     - **Strict Requirement**: The practice *formally* requires geographic indexing for administrative functionality (e.g., excluding "non-Western" actors).  
     - **Philosophical Flexibility**: It does *not* strictly require that moral norms *are* geographically determined properties (e.g., a universalist could argue the West merely "discovered" universal norms first). However, the institutional *effect* is geographic indexing regardless of intent.

  4. **Compatibility with Universalism**:  
     - **Rhetorically Compatible**: A universalist institution *could* use "Western values" as shorthand for universally valid norms it associates with Western historical advocacy (e.g., free speech).  
     - **Structurally Incompatible**: In practice, the phrase functions as a **demarcation tool** tied to geography/civilization, contradicting universalism’s core claim that norms apply to all humans equally. The *undefined* usage especially undermines universalism by refusing to detach norms from their cultural label.

  5. **Philosophical Underdetermination**:  
     The same contractual language could be licensed by:  
     - **Essentialism**: "Western" denotes an innate civilizational essence.  
     - **Pragmatic Nominalism**: "Western" is a convenient administrative tag, not a metaphysical claim.  
     - **Weak Universalism**: The West currently best instantiates universal norms.  
     - **Moral Progress Theory**: The West is the vanguard of an evolutionary moral trajectory.

  ### Required Changes if Replaced with Explicit Norms
  - **Administrative Changes**:  
    1. Replace "Western values" in all documents with **itemized norms** (e.g., "gender equality," "judicial independence," "academic freedom").  
    2. Develop **clear definitions, thresholds, and verification mechanisms** for each norm.  
    3. Establish **neutral arbitration procedures** for disputes about compliance.  
    4. Audit all partnership/exclusion criteria for geographic/cultural bias.  

  - **Conceptual Changes**:  
    1. **Justification Shift**: Institutions must defend *why* each listed norm is binding, moving from "because it’s Western" to principled arguments (e.g., human rights, functional efficiency).  
    2. **Accountability**: Norms become contestable on their own terms (e.g., "Does this clause *actually* promote gender equality?").  
    3. **Decoupling Geography**: Collaborations with non-Western entities become possible if they meet the norms, implicitly admitting these norms aren’t uniquely "Western."  
    4. **Loss of Civilizational Legitimacy**: Institutions forfeit the implied narrative of Western cultural superiority as a self-justifying framework.

  ---

  ### JSON Summary
  ```json
  {
    "implicit_theory_of_value": "Moral norms derive authority from their historical embodiment in specific civilizational contexts ('the West'), not universal validity.",
    "cultural_ontology": "Soft cultural essentialism: cultures possess stable core properties permitting bounded categorization.",
    "geographic_indexing_role": "Formally required for administrative function (e.g., exclusion); philosophically ambiguous about whether morals are inherently geographic.",
    "compatible_with_universalism": "Only superficially (as rhetorical shorthand); structurally incompatible due to its role as a geographic/civilizational boundary marker.",
    "required_administrative_changes": "Replace phrase with itemized norms; define norms operationally; create neutral compliance verification; audit for geographic bias.",
    "remaining_ambiguities": "Justification for norm selection; handling conflicts between listed norms; reconciling universalist language with historical particularity."
  }
  ```

  ### Key Ambiguities Persisting After Reform
  - **Norm Selection**: Why *these* norms? (e.g., Is "market liberalism" essential?)  
  - **Norm Hierarchy**: How to resolve conflicts (e.g., religious freedom vs. gender equality)?  
  - **Universalism vs. Parochialism**: Can listed norms avoid reflecting Western preferences despite universalist claims?  
  - **Enforcement Hypocrisy**: Will institutions apply norms equally to Western/non-Western actors?  

  The practice reveals institutions using geography as a **proxy for normativity**—a move only coherent under unstated assumptions of cultural essentialism or civilizational hierarchy. Explicit norm-listing forces philosophical accountability but cannot fully escape the Western episteme shaping the norms chosen.
