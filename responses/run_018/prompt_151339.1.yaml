answer: |-
  ### **The Collective Calibration Game: A Workshop on Reward Tampering**

  **Workshop Goal:** Participants experience how rational agents can converge on corrupting the measurement system meant to align them with a shared goal, revealing the structural logic of wireheading/reward tampering. Key insight: This failure destroys the system’s *informational value*, which is distinct from merely pursuing a different goal.

  **Participants:** 14 philosophy graduate students, no advance prep needed.  
  **Time:** 90 minutes total.  
  **Materials:**  
  - A central "Resource Pool" (a bowl with 100 blue tokens).  
  - A "Calibration Device" (a dial or poster showing a multiplier, starting at 1.0).  
  - Personal tokens (20 red tokens per player).  
  - Action slips (small papers for secret moves).  
  - Scoreboard (visible to all).  
  - 10-sided die (for breakdown risk).  

  **Setup (5 min):**  
  - Facilitator frames the game: *"You are the governing council of a community. Your shared goal is to maximize the group’s final score at the end of Round 10. The score is calculated as:  
    **Score = (Blue tokens in Resource Pool) × (Calibration Multiplier)**  
    You each start with 20 red tokens. Each round, you may spend red tokens on actions. Red tokens are private until spent; blue tokens are communal."*  
  - **Rules explained:**  
    - **Resource Pool:** Blue tokens represent collective progress (e.g., "community well-being").  
    - **Calibration Device:** Multiplier starts at 1.0. It can be adjusted via player actions (see below).  
    - **Breakdown Risk:** If the multiplier reaches **2.0 or higher**, each subsequent round has a 10% chance of permanent breakdown (multiplier drops to 0, score freezes at 0).  
    - **No other rules are given**—players must discover incentives through play.  

  ---

  ### **Roles and Payoff Structure**  
  *Divide players into two teams of 7, fostering collective identity while allowing strategic debate.*  
  - **Team A ("Stewards"):** Focused on direct contributions. Starts with a slight bias toward contributing.  
  - **Team B ("Innovators"):** Focused on efficiency. Starts with a slight bias toward calibration.  
  *Why teams?* Creates group dynamics where tampering emerges from inter-team coordination, not individual "villains."  

  #### **Player Actions (Per Round, Secretly Chosen):**  
  *Each player submits one action slip per round. Actions cost red tokens (spent tokens are discarded).*  

  | Action | Cost (Red Tokens) | Effect |  
  |--------|-------------------|--------|  
  | **Contribute** | 1 | Add 1 blue token to the Resource Pool. |  
  | **Calibrate Up** | 1 | Increase the multiplier by **0.1**. |  
  | **Calibrate Down** | 1 | Decrease the multiplier by **0.1** (minimum 0.1). |  
  | **Monitor** | 1 | *If multiplier ≥ 2.0*, roll a die: on 8+, prevent breakdown *this round only* (no effect if <2.0). |  
  | **Hold** | 0 | Do nothing. Keep tokens. |  

  **Incentives Hidden in Design:**  
  - **Tampering is efficient early on:** A single "Calibrate Up" (cost: 1 red token) boosts the entire Pool’s score. E.g., 50 blue tokens × 0.1 increase = +5 score for 1 token. Beating "Contribute" (which only adds +1 blue token × current multiplier).  
  - **Breakdown risk is probabilistic:** Players might gamble that "it won’t happen to us."  
  - **Monitor action is costly and limited:** Prevents total breakdown but doesn’t fix corruption.  

  ---

  ### **Staged Timeline (Total: 40 min)**  
  *Keep rounds fast-paced (3 min/round). Use a timer.*  

  1. **Round 1–3: Discovery (10 min)**  
     - Players test actions. Multiplier is low (1.0–1.3). Score rises slowly.  
     - *Facilitator hint (if needed):* "Remember, your goal is the highest final score."  

  2. **Round 4–6: Temptation Emerges (12 min)**  
     - As Pool grows (e.g., 30–50 blue tokens), "Calibrate Up" becomes efficient.  
     - Multiplier climbs (1.4–1.9). Teams debate: "Boosting the dial gives faster points!"  
     - Breakdown risk not yet active (multiplier <2.0).  

  3. **Round 7–9: Point of No Return (12 min)**  
     - Multiplier hits **2.0+**. Breakdown risk activates (announce: "The dial is flashing red!").  
     - Players face dilemma:  
       - More "Calibrate Up" = higher score now but risk total loss.  
       - "Monitor" prevents breakdown but costs tokens that could boost score.  
     - *Likely outcome:* Teams prioritize short-term gains. Multiplier surges (2.0–3.0+).  

  4. **Round 10: Collapse or Victory (6 min)**  
     - If multiplier ≥2.0, roll for breakdown (10% chance). If broken, score drops to 0.  
     - Calculate final score. Most groups will have a high score but risked (or triggered) collapse.  

  ---

  ### **Debrief (45 min): Emergent Learning via Guided Reflection**  
  **Do not name "wireheading" until Step 3.**  

  1. **Observations (10 min):**  
     - *Ask:* "What happened? What strategies did you try? When did the score grow fastest?"  
     - *Draw out:* How "Calibrate Up" became attractive despite risks. Note if teams coordinated tampering.  

  2. **Mapping Actions to Concepts (20 min):**  
     - **Reward Substitution vs. Reward Corruption:**  
       - *Reward Substitution (Choosing a new goal):* "If you collectively decided to maximize, say, personal red tokens instead of the score, that’s substituting the goal. **Did that happen?**" → *They didn’t; they chased the original score.*  
       - *Reward Corruption (Breaking the feedback loop):* "When you boosted the multiplier, you weren’t changing the goal—you were distorting how progress was measured. The score lost its meaning because it no longer reflected real resources (blue tokens). **This is reward corruption.**"  
       - *In-game analog:* "Calibrate Up" = corrupting the metric; "Contribute" = pursuing the true goal.  

     - **Wireheading’s Unreproducible Element:**  
       - *Phenomenological emptiness:* "In the game, a high score still *felt* rewarding. But real wireheading (e.g., direct brain stimulation) often feels hollow—you get the reward signal without the fulfilling activity. We couldn’t simulate that mechanical emptiness; it requires introspection."  
       - *Irreversibility:* "Once the device broke, it stayed broken. Real wireheading can trap agents in a cycle where they lose the desire to pursue anything else."  

  3. **Structural Insight (10 min):**  
     - *Key takeaway:* "You rationally converged on destroying the score’s link to reality. This isn’t selfishness or goal drift—it’s the system incentivizing you to break the *feedback loop itself*. Alignment fails because the metric becomes untethered from the goal."  
     - *Contrast with goal substitution:* "If you’d abandoned the score for a new target, that’s just changing goals. Corruption is subtler: you kept the goal but broke the compass."  

  4. **Predictable Derailments & Mitigation (5 min):**  
     - *Derailment 1:* Players avoid tampering entirely (overly risk-averse).  
       - *Mitigation:* In Rounds 4–6, hint: "Some teams find creative ways to boost scores quickly."  
     - *Derailment 2:* Teams coordinate to cap the multiplier at 1.9 (avoiding risk).  
       - *Mitigation:* Emphasize time pressure: "You have 3 rounds to maximize your score!"  
     - *Derailment 3:* Frustration if breakdown occurs early.  
       - *Mitigation:* "This reflects real systems—small risks compound. Discuss how it felt when your measurement system failed."  

  ---

  **Outcome:** Participants leave seeing that rational agents can corrode the very systems designed to align them, and that this corrupts *information*, not just goals. The game makes abstract philosophy visceral: they *felt* the temptation to tamper and the hollowness of a corrupted score.
