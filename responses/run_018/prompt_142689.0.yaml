answer: |-
  ### Joint Statement: Adversarial Collaboration on Understanding in Machine Translation  
  **Between the Functional-Equivalence Camp (FEC) and Conceptual-Anchor Camp (CAC)**  

  #### **1. Agreed Claims**  
  1.1. **Formal Architecture of Current MT Systems**:  
     - Modern neural MT systems (e.g., sequence-to-sequence transformers) rely on high-dimensional vector embeddings and attention mechanisms to learn probabilistic mappings between linguistic forms in parallel corpora. These systems optimize for statistical co-occurrence patterns without built-in symbolic or ontological primitives.  

  1.2. **Requirements for Translation of Evidentiality-Marked Constructions**:  
     - When translating from a source language with grammatical evidentiality (e.g., Turkish -dı vs. -mış) to a target language without it (e.g., English), successful translation must preserve the epistemic distinction (e.g., direct witness vs. hearsay) through lexical or contextual means (e.g., adding "apparently" or "I saw").  
     - Both camps agree that current MT systems *can* produce superficially correct translations in high-resource settings but disagree on whether this reflects comprehension.  

  1.3. **Formal No-Go Results**:  
     - No-go results (e.g., from computational learning theory) do not preclude statistical models from approximating evidentiality translation arbitrarily well, given sufficient data and model capacity. However, such results imply that without explicit grounding, statistical models cannot *guarantee* meaning preservation under distribution shifts (e.g., novel grammatical constructions).  

  ---  
  #### **2. Disagreements Table**  
  | **Divergence Point** | **Functional-Equivalence Camp (FEC)** | **Conceptual-Anchor Camp (CAC)** |  
  |----------------------|--------------------------------------|----------------------------------|  
  | **Representation of Epistemic Source** | Distributional correlations in parallel corpora suffice for correct translation. No model-internal representation of "epistemic source" is needed; the system’s attention to contextual cues (e.g., surrounding words) functionally preserves meaning. | Correct rendering requires model-internal variables explicitly tracking epistemic source (e.g., a discrete state for "direct evidence" vs. "hearsay"). Without this, the system conflates distinct concepts when surface patterns are ambiguous. |  
  | **Nature of Understanding** | Translation achieving functional equivalence (output indistinguishable from human performance in context) constitutes genuine interlingual comprehension. Calling it "shallow" erroneously privileges human cognition over functional outcomes. | Functional equivalence without explicit conceptual anchoring is pattern-matching, not understanding. Systematic failure to preserve meaning in edge cases (e.g., evidentiality under negation) proves the absence of comprehension. |  
  | **Failure Attribution** | Errors in evidentiality translation arise from data sparsity or architectural limitations, not a fundamental lack of understanding. Optimization can resolve these. | Errors arise from the absence of structured representations linking grammar to world knowledge. No amount of data/optimization fixes this without conceptual anchoring. |  

  ---  
  #### **3. Cruxes**  
  **Crux 1: Low-Resource Evidentiality Pair Failure Modes**  
  - **FEC Prediction**: In low-resource pairs (e.g., Aymara→Swedish), MT errors will correlate with data sparsity. Performance will degrade smoothly (e.g., omission of evidential markers increases), but no systematic distortion of epistemic meaning will occur.  
  - **CAC Prediction**: Errors will be systematic (e.g., hearsay markers misrendered as direct evidence in ＞50% of ambiguous cases), indicating collapse of epistemic distinctions due to unanchored pattern-matching.  

  **Crux 2: Intervention via Epistemic-State Tagging**  
  - **Intervention**: Train MT systems on data where evidential markers are explicitly tagged (e.g., Turkish "gel-di-[DIRECT]" → English "came-[DIRECT]").  
  - **FEC Prediction**: Tagging will yield marginal gains (≤5% BLEU improvement) in high-resource settings but will not alter failure modes in low-resource cases. The model already infers epistemic states implicitly.  
  - **CAC Prediction**: Tagging will significantly improve accuracy (≥15% BLEU) and reduce systematic errors, especially in low-resource or ambiguous contexts, by forcing explicit representation of epistemic states.  

  **Settling the Cruxes**:  
  - If FEC’s predictions hold, CAC concedes statistical methods can handle evidentiality without conceptual anchors.  
  - If CAC’s predictions hold, FEC concedes explicit representations are necessary for meaning preservation.  

  ---  
  #### **4. Merely Verbal Disagreement**  
  - **Verbal Issue**: The term "understanding" is equivocal. FEC defines it as *output-functional equivalence*; CAC defines it as *mechanistic representation of concepts*.  
  - **Non-Verbal Core**: The dispute is substantive regarding whether statistical models *can preserve meaning without structured internal representations*. This is empirical, not definitional.  

  ---  
  #### **5. Evidence Against Own View**  
  - **FEC**: Persuasive evidence against their view would be: An MT system that achieves high BLEU scores but consistently distorts evidential meaning in human evaluations (e.g., ≥90% of speakers judge translations as misrepresenting epistemic source) *even after exhaustive data augmentation*. This would undermine functional equivalence.  
  - **CAC**: Persuasive evidence against their view would be: An MT system trained *without epistemic tags* that generalizes to novel evidentiality constructions (e.g., synthetic grammar with unseen markers) with ≥95% accuracy in human evaluations of meaning preservation. This would prove conceptual anchoring unnecessary.  

  ---  
