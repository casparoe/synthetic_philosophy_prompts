prompt: |-
  I'm running a graduate seminar on philosophy of language and cognitive science, and we've been arguing about whether large-scale statistical translation involves anything worthy of the name understanding. Rather than another round of polemics, I want you to draft the joint statement of an adversarial collaboration between two camps: the Functional-Equivalence Camp, which holds that modern neural statistical translation achieves a genuine, if non-human, form of interlingual comprehension—sufficient that calling it shallow is a category mistake about mechanism versus performance; and the Conceptual-Anchor Camp, which holds, in the spirit of Hofstadter's criticisms of statistical language processing, that translation without explicit conceptual anchoring across languages is pattern-matching that systematically fails to preserve what must be preserved, especially where grammatical structure encodes meaning.

  The deliverable should be a formal document both sides could sign. Include: (1) a numbered section of agreed claims—about the formal architecture of current MT systems, about what successful translation requires in cases involving evidentiality-marked constructions (where a source language grammatically encodes direct visual versus hearsay epistemic status and the target language leaves it pragmatically implicit), and about which formal no-go results, if any, constrain statistical models in this domain; (2) a disagreements table in which each camp's position is phrased in wording that side accepts for itself, with precise divergence points—especially on whether correct rendering of evidential distinctions requires a model-internal representation of epistemic source, or whether distributional correlation across parallel corpora suffices; (3) the cruxes—sub-questions such that settling them would move at least one camp—including what predictions each makes about failure modes in low-resource evidentiality pairs, and what intervention (for instance, explicit epistemic-state tagging in training data) each would take as decisive, with predictions recorded in advance; (4) an explicit identification of any part of the dispute that is merely verbal, with reasoning; and (5) a brief statement of what both sides agree would count as genuinely persuasive evidence against their own view. Keep the formulation precise and in the weeds—avoid generic slogans about AI and language—so the disagreement concerns mechanisms and representations rather than metaphors. Do not provide bibliographies, reading lists, or citations.
reasoning: |-
  We are drafting a joint statement for an adversarial collaboration between two camps in the philosophy of language and cognitive science seminar. The two camps are:

  1. Functional-Equivalence Camp: They argue that modern neural machine translation (MT) achieves a genuine form of interlingual comprehension, even if it's non-human. They believe that calling it "shallow" is a category mistake because it confuses mechanism (how it works) with performance (what it does).

  2. Conceptual-Anchor Camp: They argue, following Hofstadter, that translation without explicit conceptual anchoring is just pattern-matching and fails to preserve essential meaning, especially when grammatical structure (like evidential markers) encodes meaning.

  The deliverable must include:

  (1) Agreed Claims: Numbered section on:
     - Formal architecture of current MT systems
     - What successful translation requires in cases with evidentiality-marked constructions (where source language grammatically encodes epistemic status and target language does not)
     - Formal no-go results that constrain statistical models

  (2) Disagreements Table: Each camp's position in their own accepted wording, with precise divergence points, especially on whether correct rendering of evidential distinctions requires model-internal representation of epistemic source or if distributional correlation suffices.

  (3) Cruxes: Sub-questions that would move at least one camp, including:
     - Predictions about failure modes in low-resource evidentiality pairs
     - What intervention (e.g., explicit epistemic-state tagging in training data) each would take as decisive, with predictions recorded in advance.

  (4) Identification of any merely verbal part of the dispute.

  (5) What both sides agree would count as persuasive evidence against their own view.

  We must be precise and avoid generic slogans. Focus on mechanisms and representations.

  Let's structure the document accordingly.

  ---

  **Joint Statement on Adversarial Collaboration: Understanding in Machine Translation**

  **Preamble:**
  This document represents a joint statement by the Functional-Equivalence Camp (FEC) and the Conceptual-Anchor Camp (CAC) regarding the nature of understanding in large-scale statistical machine translation (MT). We seek to clarify points of agreement and disagreement, and to outline empirical tests that could resolve key disputes.

  **Section 1: Agreed Claims**

  Both camps agree on the following points regarding the current state of machine translation:

  1.1. **Architecture of Current MT Systems**: Modern neural MT systems (e.g., transformer-based models) are trained end-to-end on parallel corpora using gradient-based optimization to minimize a loss function (typically cross-entropy) that measures the discrepancy between predicted and actual target sequences. These systems do not rely on hand-coded rules or explicit symbolic representations of grammar or meaning; instead, they learn statistical regularities from data.

  1.2. **Requirements for Successful Translation in Evidentiality-Marked Constructions**: 
     - In cases where the source language grammatically encodes evidential distinctions (e.g., direct visual evidence vs. hearsay) and the target language does not have grammatical evidentiality (e.g., English), successful translation requires conveying the evidential meaning appropriately in the target language, typically through lexical or pragmatic means (e.g., adding phrases like "I saw that..." or "it is said that...").
     - Both camps agree that current MT systems can and do produce translations that include such lexical additions when the training data provides sufficient examples of parallel constructions.

  1.3. **Formal No-Go Results**: 
     - There are no known formal no-go results (e.g., from computational learning theory) that definitively rule out the possibility that a statistical model, given sufficient data and appropriate architecture, could learn to translate evidentiality-marked constructions correctly. However, both camps acknowledge that the practical limitations of current models (e.g., data sparsity in low-resource languages) may lead to failures.

  **Section 2: Disagreements Table**

  | Issue | Functional-Equivalence Camp (FEC) | Conceptual-Anchor Camp (CAC) |
  |-------|-----------------------------------|-----------------------------|
  | **Nature of Evidentiality Handling** | Correct rendering of evidential distinctions in translation is achieved by the model learning distributional correlations in the parallel corpus. The model does not require an internal representation of epistemic source as a distinct conceptual category; instead, it maps source patterns to target patterns in a way that captures the functional equivalence of meaning. | Correct rendering of evidential distinctions requires the model to form an explicit, internal representation of the epistemic source (e.g., as a conceptual anchor) that is then mapped to the target language. Without such an anchoring, the model is merely matching patterns without understanding what must be preserved, leading to systematic errors in meaning preservation. |
  | **Mechanism of Translation** | The end-to-end statistical learning of MT systems constitutes a form of understanding because it reliably produces functionally equivalent translations across a wide range of contexts. The non-human mechanism (statistical pattern matching) does not preclude genuine comprehension, which is defined by successful performance. | Translation without explicit conceptual representations (i.e., without structured, recombinable representations of meaning) is not understanding but pattern-matching. This fails to preserve meaning in cases where grammatical structure (like evidential markers) carries critical semantic content that must be explicitly represented and mapped. |

  **Section 3: Cruxes**

  The following sub-questions are identified as potential cruxes that could move at least one camp. For each, we outline the predictions of each camp and the decisive interventions.

  3.1. **Failure Modes in Low-Resource Evidentiality Pairs**:
     - **Scenario**: Consider a language pair where the source language (e.g., Turkish) has grammatical evidentiality and the target language (e.g., English) does not. We train MT systems on varying sizes of parallel corpora (from high-resource to low-resource) and test on sentences requiring evidentiality translation.
     - **FEC Prediction**: As training data decreases, the model will show a smooth degradation in performance (e.g., increasing omission of evidential markers in translation). The errors will be due to data sparsity and will not systematically distort meaning in a way that suggests a fundamental lack of understanding. With sufficient data, the model will learn to handle evidentiality appropriately.
     - **CAC Prediction**: Even in high-resource settings, the model will occasionally fail in ways that reveal a lack of conceptual anchoring (e.g., confusing direct and hearsay evidentials in ambiguous contexts). In low-resource settings, failures will be systematic and not merely due to sparsity: the model will either omit evidentiality or insert it randomly, showing that it does not represent the epistemic source internally.

  3.2. **Intervention: Explicit Epistemic-State Tagging**:
     - **Intervention**: Augment the training data with explicit tags for epistemic state (e.g., marking each source sentence with [direct_visual] or [hearsay]) and require the model to output corresponding markers in the target language (if not grammaticalized, then as lexical additions).
     - **FEC Prediction**: This intervention will not significantly improve translation quality beyond what a model trained on raw parallel corpora can achieve with sufficient data, because the model already learns the distributional cues. If improvement occurs, it is due to better data annotation, not a fundamental shift in understanding.
     - **CAC Prediction**: This intervention will lead to a significant improvement in translation quality, especially in low-resource and ambiguous contexts, because it forces the model to form explicit representations of epistemic source. Without such tagging, the model cannot reliably anchor the meaning.

  **Section 4: Merely Verbal Disagreement**

  Both camps agree that part of the dispute is verbal regarding the term "understanding":
  - FEC defines understanding in terms of functional performance: a system understands if it produces translations that are functionally equivalent to what a human would produce in the same context.
  - CAC defines understanding as requiring internal conceptual representations that are causally involved in the translation process.

  Thus, the disagreement about whether MT systems "understand" is partly terminological: FEC uses a performance-oriented definition, while CAC uses a mechanism-oriented definition. However, the camps agree that the core disagreement is not merely verbal because it hinges on empirical questions about the necessity of internal representations for preserving meaning in translation, especially in cases like evidentiality.

  **Section 5: Persuasive Evidence Against Own View**

  Both camps agree on what would count as persuasive evidence against their own position:

  - **FEC**: Evidence that would be persuasive against FEC's view would be a systematic failure in translation of evidentiality (or similar grammatical meaning) that cannot be remedied by increasing data, model size, or training time, and that is resolved only by introducing explicit symbolic representations of the relevant concepts. Such evidence would suggest that statistical methods alone are insufficient for functional equivalence.

  - **CAC**: Evidence that would be persuasive against CAC's view would be an MT system that, without any explicit representation of epistemic states, consistently and reliably translates evidentiality-marked constructions correctly (including in novel, ambiguous, or low-resource settings) and can generalize to unseen evidential contexts. This would show that explicit conceptual anchoring is not necessary for preserving meaning.

