answer: |-
  Here's a rigorous argument defending your position, focusing strictly on Dennett's internal criteria and the specified constraints:

  **1. Dennett's Real-Patterns Criterion & Ontological Neutrality:**  
  Dennett's "real patterns" criterion asserts that a pattern is real if its description is predictively robust *and* informationally compressed compared to exhaustive physical micro-descriptions. He maintains ontological neutrality between the physical, design, and intentional stances: all are equally valid ways of describing real patterns, with no privileged ontological level.

  **2. Distributed Biological Systems Challenge Neutrality:**  
  In systems like slime-mold networks or ant-colony foraging:  
  - **No Centralized Design History:** Evolution acts on the collective outcome, not discrete "parts." There is no engineered blueprint specifying functional subunits.  
  - **Non-Decomposable Dynamics:** System-level behavior emerges from countless low-level interactions (pheromone trails, cytoplasmic flow) with no clean physical decomposition into system-relevant functional modules. The causal dynamics are irreducibly distributed.  

  **3. Collapse of the Physical Stance:**  
  The physical stance requires identifying causally efficacious structures via micro-physical laws. However:  
  - The *informational patterns* governing system behavior (e.g., nutrient gradients in slime molds, path efficiency in ants) have no 1:1 mapping to discrete physical substrates. These patterns are distributed across the entire system and supervene on relational dynamics.  
  - A micro-physical description (e.g., molecular collisions in a slime mold tube) *fails to capture* the causally relevant structure—the network-level optimization. The pattern exists *only* at the macro-scale.  
  → **Result:** The physical stance cannot isolate the *causally efficacious* pattern. It drowns in noise.  

  **4. Collapse of the Design Stance:**  
  The design stance assumes functionally discrete parts optimized for a purpose. Here:  
  - Selection acts on the *collective output* (e.g., colony efficiency), not on specific mechanisms or subunits. Individual ants or slime mold cells lack fixed "functions"; their roles are contextual and interchangeable.  
  - There are no stable, design-like components to "reverse-engineer." The system achieves adaptability precisely because it *lacks* rigid functional decomposition.  
  → **Result:** The design stance finds no fixed functional architecture to describe. It is inapplicable.  

  **5. Necessity of the Intentional Stance:**  
  Only the intentional stance robustly captures the real pattern:  
  - **Predictive Power:** Attributing "beliefs" about gradients (slime mold) or "desires" for efficient paths (ants) yields high-fidelity predictions of system behavior.  
  - **Compression:** Describing the system as an "agent" optimizing a goal compresses trillions of micro-interactions into a tractable model (e.g., "The colony believes path A is shortest").  
  - **Causal Efficacy:** The *informational content* of the pattern (e.g., pheromone concentration as a "signal") is what drives system adaptation. This content is ontologically real—it determines the system's trajectory—but is *only accessible* via intentional idioms (e.g., "The mold seeks higher glucose concentration").  

  **6. Ontological Commitment Emerges:**  
  - The intentional stance is **unavoidable** because it is the *only* stance that isolates the causally potent pattern. Physical/design stances either miss the pattern or cannot articulate it.  
  - This pattern is **ontologically robust**: It is evolutionarily selected, physically instantiated, and counterfactually stable (alter the "belief"—e.g., disrupt pheromone trails—and behavior changes predictably).  
  - **Neutrality Collapses:** The intentional stance is not merely instrumental here—it is *epistemically and ontologically privileged*. Without it, the system’s most salient causal property (goal-directed optimization) vanishes from view. The other stances fail Dennett’s own real-patterns test.  

  **Conclusion:**  
  For emergent collective cognition, Dennett’s ontological neutrality is unsustainable. The absence of centralized design and non-decomposable dynamics renders the physical stance descriptively inadequate and the design stance incoherent. Only the intentional stance captures the evolutionarily selected, causally efficacious pattern. Thus, it transitions from heuristic to ontological commitment: the system *really is* an intentional system *at the collective level*, as this is the sole locus of its adaptive intelligence. Dennett’s framework, consistently applied, reveals that stances are not equally real when pattern reality is contingent on irreducible abstraction.
