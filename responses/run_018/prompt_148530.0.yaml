  I need to map the logical space carefully. The first fork is crucial: *must* reactive attitudes reflect true moral desert? This splits desert-dependence from independence. For the dependent branch, mental illness becomes a key divider—does it *always* force objective attitude? Then whether resentment can be graded. Finally, whether blame can be functional without emotion. 

