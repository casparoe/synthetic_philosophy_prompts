prompt: |-
  I've been running a small discussuion group with some friends from my course on moral psychology, and we've got stuck on a really specific problem that I think Strawson's reactive attitudes framework should help with but doesn't quite, at least in the way it's usually taught. We were talking about what happens when someone causes serious harm during a severe dissociative episode or an acute psycotic break — not just 'they weren't themselves' in a casual sense, but genuinely lacking the kind of rational agency that makes blame seem appropriate. I want to understand whether the right response is full-blown resentment, a complete switch to the objective attitude, or something in between like graded sorrow-without-blame. So I need a taxonomy — like a decision tree — that sorts positions on moral responsibility not by whether people call themselves compatibilists or incompatibilists, but by how they answer concrete questions about these edge cases.

  Please build it from the logical space first: start with whether reactive attitudes must track actual moral desert, then branch on whether mental illness automatically triggers the objective attitude, then on whether partial or calibrated resentment is conceptually possible, and finally on whether the social function of blame can survive without emotional blame proper. Each leaf should name the position if there's a standard one (Strawson's participant stance, hard determinist suspension, revisionist functionalism, maybe a 'graded reactive' view) or say 'unamed', plus one sentence on its most awkward commitment — for instance, having to claim that we should feel literally nothing for negligent harm caused by someone with a brain tumour, or that resentment is just behaviour-modification with no emotional core. Flag combinations that seem empty and say briefly why — incoherent, unattractive, or just unexplored? Make it a diagnostic tool: I should be able to ask my friends these four or five questions and map them onto a leaf without them knowing the labels. Don't include a bibliography or reading list — I'm working this out from first principles with the group, and I don't want guesses at citations. Oh, and please use British spelling throughout.
