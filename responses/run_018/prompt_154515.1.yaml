answer: |-
  Here is a comprehensive specification of desiderata for any theory of simmball-careenium interaction, structured around core phenomena, necessary distinctions, consistency conditions, and potential no-go results. Each desideratum includes its motivation and status (non-negotiable vs. camp-specific).

  ### I. Phenomena to be Explained (Empirical/Functional Adequacy)
  Any theory must account for observed or postulated interactions:

  1.  **Symbolic Rule Redirection (Apparent Downward Causation):**
      *   **Phenomenon:** Observed cases where the *application* of a symbolic rule within a simmball configuration demonstrably alters the trajectory of the careenium *away* from the path predicted by its immediate local dynamics or dominant attractors. (e.g., a logical operation "forcing" a chaotic substrate to stabilize transiently into a specific pattern).
      *   **Motivation:** Core challenge to epiphenomenalism; prima facie evidence for downward efficacy.
      *   **Status:** **Non-negotiable** (Must be explained, even if explanation denies literal downward causation).

  2.  **Substrate Noise Disruption (Symbolic Fragility):**
      *   **Phenomenon:** Cases where small-scale, intrinsically generated careenium instability (noise, sensitivity) disrupts the coherence or fidelity of a simmball configuration *without* fundamentally altering the intended symbolic rule or its logical implications (e.g., a bit-flip error in a symbolic representation, corrected later).
      *   **Motivation:** Demonstrates substrate autonomy and the dependence of simmballs on substrate dynamics; highlights the challenge of stability.
      *   **Status:** **Non-negotiable** (Fundamental consequence of unstable substrate).

  3.  **Symbolic Error Detection & Correction:**
      *   **Phenomenon:** The ability of simmball configurations to detect deviations from their own intended symbolic state (caused by substrate noise) and initiate substrate-level processes that *restore* the correct symbolic configuration.
      *   **Motivation:** Requires a feedback loop where symbolic state diagnoses substrate state and causally influences corrective actions; strong test of downward efficacy vs. clever pre-programmed dynamics.
      *   **Status:** **Non-negotiable** (Crucial for robust symbolic computation; tests causal pathways).

  4.  **Symbolically-Driven Multistability:**
      *   **Phenomenon:** Situations where the careenium exhibits multiple possible stable or meta-stable dynamical regimes, and the *active* simmball configuration selects or transitions between these regimes based on symbolic requirements.
      *   **Motivation:** Shows symbolic state influencing the *global dynamical landscape* of the substrate, not just local perturbations.
      *   **Status:** **High Priority / Strongly Expected** (Evidence for powerful downward influence; common in complex computation).

  5.  **Symbol Grounding & Interpretation Dynamics:**
      *   **Phenomenon:** How simmballs, as abstract symbols, acquire and maintain their referential or semantic connections to specific substrate states, environmental inputs, or other simmballs *through* the dynamics of the careenium itself.
      *   **Motivation:** Addresses the "hook-up" problem; requires an account of how meaning/functionality arises and is sustained in the interaction.
      *   **Status:** **Non-negotiable** (Essential for modeling cognition or meaningful computation).

  ### II. Distinctions to Preserve (Conceptual Adequacy)
  The theory must prevent conceptual collapse and respect key differences:

  6.  **Correlation vs. Causation Distinction:**
      *   **Distinction:** Must clearly differentiate between simmball states merely *correlating* with substrate dynamics (due to common cause or supervenience) and simmball states *causing* changes in substrate dynamics.
      *   **Motivation:** Core to the central question of downward efficacy; prevents equivocation.
      *   **Status:** **Non-negotiable** (Foundational to the framework's purpose).

  7.  **Local Substrate Perturbation vs. Global Symbolic Restructuring:**
      *   **Distinction:** Must differentiate between a substrate change affecting a small part of a simmball's implementation (e.g., a single value flip) and a change that fundamentally alters the symbolic meaning, rule, or large-scale structure of the simmball configuration itself.
      *   **Motivation:** Captures the difference between noise/error and fundamental symbolic change; relates to robustness and levels of description.
      *   **Status:** **Non-negotiable** (Reflects the discrete/symbolic vs. continuous/dynamic ontology).

  8.  **Weak Embedding vs. Strong Downward Determination:**
      *   **Distinction:** Must differentiate between simmballs being merely *implemented* or *realized* by suitable substrate patterns (weak embedding) and simmballs exerting *causal control* over substrate dynamics in a way that overrides or redirects intrinsic substrate tendencies (strong downward determination).
      *   **Motivation:** Separates epiphenomenalist/realization views from strong emergentist/interactionist views.
      *   **Status:** **Core Distinction** (Defines the spectrum of possible answers; non-negotiable to preserve clarity).

  9.  **Graded Causal Efficacy:**
      *   **Distinction:** Must accommodate the possibility that different types of simmballs (e.g., simple data registers vs. complex self-modifying programs) or different contexts might exhibit *varying degrees* of genuine downward causal influence.
      *   **Motivation:** Avoids an all-or-nothing fallacy; aligns with intuitions about complex systems where higher-level control varies.
      *   **Status:** **Highly Desirable** (Increases explanatory flexibility; often observed).

  ### III. Consistency Conditions (Theoretical Adequacy)
  The theory must cohere with established knowledge:

  10. **Substrate Dynamical Closure (Micro-Causal Completeness):**
      *   **Condition:** Any change in the local state of the careenium must have a sufficient cause within the prior state of the careenium itself, governed by its dynamical laws. No "gaps" exist at the substrate level.
      *   **Motivation:** Fundamental principle of physics/dynamical systems theory; basis of causal exclusion arguments. Violation implies magic or vitalism.
      *   **Status:** **Non-negotiable for Physicalists**; **Rejected/Reinterpreted by Strong Interactionists/Dualists**.

  11. **Respect for Nonlinearity & Sensitive Dependence:**
      *   **Condition:** The theory must be consistent with the core properties of the careenium: extreme sensitivity to initial conditions, potential for chaos, bifurcations, and the amplification of small fluctuations.
      *   **Motivation:** Defines the nature of the substrate; failure here means the theory doesn't apply to the specified framework.
      *   **Status:** **Non-negotiable** (Built into the framework definition).

  12. **Supervenience without Reduction:**
      *   **Condition:** Simmball states must supervene on careenium states (no change in simmball without change in substrate), but the theory must explain why simmball properties/states are not *reducible* to the properties/states of the localized substrate elements realizing them at a given instant (e.g., due to global/multiscale constraints, historical context, functional role).
      *   **Motivation:** Captures the core non-reductive character of simmballs; essential for their status as distinct symbolic entities.
      *   **Status:** **Non-negotiable** (Defines the framework).

  13. **Causal Non-Overdetermination:**
      *   **Condition:** If a substrate event S is caused by prior substrate state P, it should not *also* be caused by a simmball state M, unless M's causal influence is entirely constituted by/identical to the causal influence of P (or its relevant parts).
      *   **Motivation:** Avoids systematic causal overdetermination, widely considered implausible and redundant.
      *   **Status:** **Non-negotiable Constraint** (Forces theories to clarify the *mechanism* of downward causation if asserted).

  ### IV. Potential No-Go Results & Tensions
  Theories must navigate these inherent challenges:

  14. **The Causal Exclusion Challenge:**
      *   **Result:** If the careenium is micro-causally complete (Desideratum 10) and simmballs supervene on it (Desideratum 12), then any putative *distinct* downward causal power of simmballs seems either redundant (violating Desideratum 13) or impossible (no causal "room" at the bottom). Downward causation appears excluded.
      *   **Tension:** Directly threatens desiderata requiring genuine downward causal efficacy (implied by 1, 3, 4) and strong downward determination (8). Forces a choice: reject micro-closure (10 - unpopular), embrace overdetermination (13 - unpopular), deny supervenience (12 - contradicts framework), or explain how simmball causation *is* substrate causation in a non-reducible but non-overdetermining way (the main emergentist/interactionist challenge).
      *   **Status:** **Core Challenge** (The central theoretical hurdle for non-epiphenomenalist views).

  15. **The Instability Problem for Control:**
      *   **Result:** The extreme sensitivity of the careenium (Desideratum 11) makes stable, reliable control by higher-level simmballs seem incredibly difficult or fragile. How can discrete symbols reliably "steer" a chaotic medium without constant instability overwhelming the control signal?
      *   **Tension:** Challenges desiderata 1, 3, 4, 8, and 9 (requiring reliable efficacy). Favors views where simmballs are fragile patterns (epiphenomenalism) or where control exploits, rather than fights, instability (e.g., chaos control, harnessing attractors).
      *   **Status:** **Major Hurdle** (Tests the *robustness* of downward efficacy).

  16. **Tension: Substrate Autonomy vs. Robust Downward Efficacy:**
      *   **Conflict:** Desideratum 10 (Substrate Closure/Autonomy) and Desideratum 2 (Substrate Noise Disruption) emphasize the independence and primacy of substrate dynamics. Desiderata 1, 3, 4, and strong interpretations of 8 & 9 require simmballs to exert significant, sometimes overriding, influence on that substrate. These pull in opposite directions.
      *   **Why:** Substrate autonomy implies dynamics follow intrinsic laws; robust efficacy implies dynamics can be consistently redirected by external (symbolic) factors. Reconciling this requires showing how symbolic control emerges *from* and operates *through* substrate laws without violating them or being constantly undermined by them.
      *   **Status:** **Fundamental Conceptual Tension** (Defines the spectrum of solutions).

  ### How Standard Views Fare (Briefly)
  *   **Epiphenomenalism:** Easily satisfies 2, 6, 7, 8 (weak side), 10, 11, 12, 13, 14, 15. Fails to genuinely satisfy 1, 3, 4, 5 (beyond correlation), 8 (strong side), 9. Struggles with the *apparent* directedness of rule-following and error correction.
  *   **Weak Emergentism/Correlation-Only:** Similar to epiphenomenalism but emphasizes patterns and systemic properties. May offer richer explanations of 5 and the stability of simmballs, but still denies literal downward *causation* (failing 1, 3, 4 robustly).
  *   **Strong Emergentism/Interactionism:** Aims to satisfy 1, 3, 4, 5, 8 (strong), 9. Must directly confront and attempt to resolve 14 (Exclusion) and 15 (Instability) while respecting 10, 11, 12, 13. Typically posits novel causal powers or top-down constraints emerging at the simmball level. Success hinges on a plausible non-overdetermining mechanism.
  *   **Non-Reductive Physicalism/Constitutive Downward Causation:** Argues simmball causation *is* substrate causation, just described at a higher level of organization. Aims to satisfy all desiderata *except* perhaps the strongest interpretations of 8 (Downward Determination overriding substrate). Must carefully navigate 14 (Exclusion) by denying distinctness of causes, and show how this avoids reductionism (12) while explaining symbolic control (1,3,4). Faces challenge 15.

  This architecture provides the rigorous conceptual scaffolding needed to evaluate theories within the careenium-simmball framework. The central tension (Autonomy vs. Efficacy) and the looming challenge of Causal Exclusion (especially given the unstable substrate) define the difficult terrain any non-epiphenomenalist theory must navigate. Success requires satisfying the non-negotiable empirical and conceptual constraints while offering a coherent solution to the core no-go results.
