  Hmm, looking at their examples... Case 1 (Galileo) and Case 2 (climate model) feel unproblematic because the idealizations are about background conditions or resolution. But Case 3 (rational agents with perfect foresight) feels "like cheating" even if it predicts GDP well. The user senses something wrong with the mechanism itself being unrealistic. 

  Ah! The key might be whether the false assumption is doing essential explanatory work. In Case 3, perfect foresight isn't just simplifying reality—it's fundamentally misrepresenting how economic decisions are made. Whereas in Galileo's case, vacuum idealization doesn't change the core gravitational mechanism. 

  For Case 7 (dark energy as pure lambda), this framework suggests it's acceptable as a placeholder. The cosmological constant isn't pretending to explain dark energy's nature—it's parameterizing our ignorance while the model focuses on expansion dynamics. Much like Galileo's vacuum doesn't explain gravity but isolates its effects. 

  Case 6 fails because the false mutation-rate assumption actively distorts the causal story in clinical contexts. Case 4 gets partial credit because random mixing, while false, isn't catastrophically misleading for urban flu dynamics. 

  The user's struggle with Case 3 vs Case 6 reveals a deeper concern: predictive success alone isn't enough if the model's mechanism is fundamentally deceptive. We might salvage Case 3 only for narrow prediction tasks, but it can't explain economic behavior. 

  On the principled level, we're landing on: Unrealistic assumptions are tolerable when they're either (1) non-explanatory scaffolding (Galileo's vacuum), or (2) domain-appropriate approximations (climate resolution). But they're dangerous when they (a) misrepresent core mechanisms (Case 3/6), or (b) obscure critical dependencies (Case 6's mutation rates). 

  For Case 7—dark energy as lambda—it's clearly in category (1): a parameterized placeholder that doesn't pretend to explain. The "post-hoc fitting" charge is neutralized because all constants require empirical constraint; the issue is whether it blocks deeper understanding. Here it doesn't; it's a flag for future explanation. 

  The user might resist dropping Case 3 entirely, but the principle forces it: if perfect foresight were merely an idealization, removing it (adding bounded rationality) shouldn't destroy predictions. But if it does—as behavioral economics suggests—then the assumption wasn't benign. 

  Final note: The user's "explanatory outsourcing" intuition for Case 3 is insightful but slippery. We can allow purely predictive instruments (like engineering models), but then Case 3 must explicitly renounce explanatory claims—which economists rarely do. Hence their discomfort.
answer: |-
  Your struggle is profoundly insightful—it cuts to the heart of scientific modeling and the F-twist's tension between prediction and explanation. After analyzing your cases, **this principle reconciles your intuitions while forcing one verdict to drop:**

  > **Unrealistic assumptions are permissible when they (a) isolate/stabilize core mechanisms *without distorting causal dependencies*, or (b) serve as scaffolding for domain-specific prediction. They are impermissible when they (i) *misrepresent essential causal structure* or (ii) *obscure critical sensitivities*.**

  ### How it resolves your cases:
  1. **Galileo (✓):** Vacuum/point masses *isolate* gravity's core mechanism (acceleration under force) and *stabilize* predictions by eliminating friction—a distortion, not a dependency.  
  2. **Climate grid (✓):** Resolution limit *stabilizes* large-scale dynamics; mountains/cities are background noise, not essential dependencies.  
  3. **Perfect foresight (✗):** **Forced drop.** Assumption *misrepresents essential causal structure* (real agents adapt through learning/errors, not infinite computation). Predictive success is coincidental, hiding how expectations *actually* form.  
  4. **SIR random mixing (✓/△):** Acceptable for urban flu because density *compensates* for non-randomness; fails in rural settings where mixing *is* the causal dependency.  
  5. **Binary neuron model (✓ for engineering):** *Scaffolding* for chip design (domain-specific prediction), not explanation.  
  6. **Constant mutation rate (✗):** *Obscures critical sensitivity* (stress→mutation rate), making clinical protocols fail.  
  7. **Dark energy as lambda (✓):** *Isolates/stabilizes* expansion dynamics without distorting gravitational framework. Lambda is a *placeholder* for unknown physics (like Galileo's vacuum), not a false causal claim.  

  ---

  ### Why Case 3 must fall while Case 6 stands:
  - **Case 3’s flaw:** Perfect foresight isn’t just an idealization—it **replaces the actual causal mechanism** (adaptive expectations, bounded rationality) with a fictional one. If you "fix" it by adding learning constraints, predictions collapse (e.g., 2008 crisis models failed *because* they assumed rational expectations).  
  - **Case 6 survives:** The mutation-rate assumption isn’t just unrealistic—it **masks a critical dependency** (stress→mutation). Fixing it *improves* clinical relevance without abandoning the core model.  

  ---

  ### On Case 7 (dark energy): 
  Lambda-CDM’s use of a cosmological constant **✓ fits (a)**:  
  - It *isolates* the effect of cosmic acceleration on expansion dynamics.  
  - It *parameterizes ignorance* without pretending dark energy is understood (unlike Case 3’s pretense of understanding agency).  
  - Lambda is *not* fitted "post-hoc" pejoratively; it’s **constrained by data** (like gravitational constant *G*). The issue in Case 6 is ignoring *known dependencies* (stress), whereas lambda’s nature is *genuinely unknown*.  

  ---

  ### Addressing "predictive outsourcing" (Case 3):
  Your instinct isn’t a dead end, but requires rigor:  
  - **Predictive instruments** (e.g., engineering models) can use unrealistic assumptions *if* they renounce explanatory claims and operate within calibrated domains.  
  - **But Case 3 fails this:** Macro models *claim* to explain growth via rational agents, yet their assumptions distort real causes. If re-labeled *only* as a "prediction tool" with strict domain limits (e.g., "only for steady-state economies"), it *might* survive—but economists rarely do this.  

  ---

  ### Refinement for Case 4:
  Your "insulation" intuition is apt. Random mixing is acceptable **only when**:  
  - The *scale* (urban) makes contact heterogeneity negligible.  
  - The *target phenomenon* (mean infection rate) isn’t driven by network structure.  
  It fails when spatial structure *is* causal (rural/sparse networks).  

  ---

  ### Your best path forward:
  1. **Drop Case 3** as impermissible—its success is fortuitous, not grounded in causal fidelity.  
  2. **Embrace the principle** with two caveats:  
     - "Core mechanisms" must be *empirically grounded* (e.g., gravity in Case 1, expansion in Case 7).  
     - "Critical sensitivities" require *domain-aware validation* (e.g., testing models under stress in Case 6).  

  This framework preserves your intuitions about Galileo, climate grids, SIR (locally), lambda-CDM, and the mutation model’s flaw—while resolving the tension in Case 3. The F-twist’s weakness isn’t instrumentalism *itself*, but ignoring **when unreality corrupts causal insight or practical application**.  

  *Would you like to test this against other contested cases (e.g., rational choice in biology, frictionless markets in finance)?*
