answer: |-
  Here's the distilled epistemic toolkit you need, forged in decision theory and battle-tested against real-world reasoning failures. First, the three fatal confusions:

  **Confusion 1: Mistaking Aesthetic Coherence for Predictive Power**  
  People equate the internal elegance/satisfaction of their causal narrative ("gears-level understanding") with high probability of outcome. A beautiful theory feels like a *guarantee*, overriding base rates. (Result: Overconfidence in complex financial models during stable periods.)

  **Confusion 2: The Calibration Fallacy**  
  Assuming that because your *reasoning process* seems rigorous (e.g., detailed spreadsheet, Bayesian update), your *error bars* must be small. Confidence in method ≠ confidence in outcome. (Result: Engineers underestimating Mars Climate Orbiter risk because "we checked everything.")

  **Confusion 3: Outcome-Attribution Error**  
  Conflating ex-post outcome with ex-ante reasoning quality. A correct outcome (even if lucky) inflates confidence in the reasoning process; a wrong outcome (even with sound reasoning) triggers over-correction. (Result: Traders misdiagnosing skill vs. luck after black swan events.)

  ---

  ### THE DESIDERATA: SPEC SHEET FOR EPISTEMIC MODESTY THEORY
  *(Non-negotiable requirements in bold; 🚩 flags tensions)*

  1. **Handles Expert Disagreement/Outlier Status**  
     *Case:* You're a climate scientist 99% sure of catastrophic warming by 2050, but 30% of credentialed experts dissent.  
     *Why:* Ignoring outlier status invites groupthink; blind deference ignores crackpots.  
     *Requirement:* Must force engagement with *why* you're an outlier—not just count heads. Are dissenters epistemically corrupt? Did you skip a key study?  
     *Kills:* Naive outside-view base-rate deference. If you're the outlier, *you* are the inside view.

  2. **Sparse-Feedback Domain Calibration**  
     *Case:* Predicting societal collapse in 50 years. No calibration data exists for similar forecasts.  
     *Why:* In low-feedback domains (geopolitics, existential risk), standard calibration curves are meaningless. Confidence intervals derived from past accuracy are garbage.  
     *Requirement:* Must downgrade confidence in *all* quantitative predictions when feedback loops >10 years. Shift to qualitative "reliability weights" for models.  
     *Kills:* Forecasting tournament approaches (e.g., Good Judgment Project) applied to novel long-term risks.

  3. **Recursive Self-Application**  
     *Case:* "I should be modest because I'm usually overconfident... but is *this* assessment of my overconfidence itself overconfident?"  
     *Why:* Without recursion, modesty claims self-destruct. Your current "outside view" is just yesterday's inside view.  
     *Requirement:* Theory must output decisions, not infinite regress. (Solution: Cap recursion depth; anchor in *actionable* uncertainty.)  
     *Kills:* Pure Bayesian frameworks (infinite regress in priors) and unreflective inside/outside switches.

  4. **Distinguishes Belief-Modesty vs. Procedure-Modesty**  
     *Case:* You believe AI risk is high (belief) but know your estimation method lacks counterfactual testing (procedure).  
     *Why:* You can be modest about *how* you know while retaining *what* you know. Deferring belief ≠ deferring methodology.  
     *Requirement:* Must flag when to doubt conclusions vs. when to doubt *tools*. Updates should differ: Bad procedure? Scrap the analysis. Uncertain belief? Adjust probabilities.  
     *Kills:* "Just trust experts" — *which* expert methodology is robust?

  5. **Conforms to Bias & Forecasting Evidence**  
     *Case:* Ignoring base rates (outside view) contradicts Kahneman; ignoring gears (inside view) contradicts Tetlock's "superforecasters."  
     *Why:* A theory contradicting robust empirical results (e.g., overconfidence bias, crowd wisdom limits) is self-refuting.  
     *Requirement:* Must explain *when* base rates dominate (stable systems) vs. when causal models dominate (novel contexts). Cannot deny "planning fallacy" or "expert overclaim."  
     *Kills:* Ideological outside-view fundamentalism (e.g., "always bet against unique claims").  

  ---

  ### THE TENSION MAP: WHERE DESIDERATA COLLIDE
  - **🚩 Jointly Unsatisfiable Pair: Sparse-Feedback Calibration vs. Forecasting Evidence**  
    Forecasting research demands empirical calibration, but sparse domains make this impossible. *Stance:* Sacrifice precise probabilities; use *procedural* checks (e.g., "Did I simulate failure modes?") as proxy calibration.  
  - **Base-Rate Deferrers vs. Gears-Trusters:** Not a true conflict—*camp preferences*. Non-negotiable is *contextual triggering*: Use base rates by default; switch to gears when facing novel causal drivers or high-stakes unique events.  
  - **The Killer Requirement: Recursive Self-Application**  
    This murders popular takes:  
    - *Simple Bayesianism:* Dies in recursive prior uncertainty.  
    - *Outside-View Fundamentalism:* Can't explain why *this* base rate applies *now*.  
    - *Inside-View Intuitionism:* No guardrails against overconfidence spirals.  

  ### SCORECARD SNAPSHOT
  - **Tetlock's Superforecaster Training:** Aces forecasting evidence (5), fails sparse feedback (2) and recursion (3).  
  - **Robin Hanson's Outside View:** Crushes base rates (1,5), murdered by recursion (3) and gears/procedure modesty (4).  
  - **Weaver/Taleb-style Via Negativa:** Excels in sparse domains (2) and procedure modesty (4), weak on quantitative belief updates (5).  

  ### THE NON-NEGOTIABLE CORE
  Any viable theory **must** handle recursion (3) and belief/procedure distinction (4). Without these, it collapses under its own weight. The winning framework is *procedural inside-view auditing*: Run your gears, then stress-test them against *tail risks* and *methodological counterfactuals* (e.g., "What would a rival model show?"). Switch to outside view only when:  
  a) You're a statistical outlier *and* lack unique data, OR  
  b) Feedback sparsity forces reliance on structural anchors (e.g., thermodynamics > economic growth models).  

  Epistemic modesty isn't about deference—it's about building *error-aware* agency. The typo? "Veiw." Left it as a shibboleth for the epistemically vigilant.
