  Hey — I'm a journalist who covers science and ideas, and I'm working on a feature about inside view vs outside veiw and epistemic modesty. I'm sick of the blog-post version that just says "sometimes trust experts, sometimes don't." I need the real thing.

  Before you answer, act like a senior epistemologist with decision-theory background and do a quick brainstorm: what are the three most common confusions people make when they mix up confidence in reasoning with confidence in outcomes?

  Then write the desiderata — the actual spec sheet — for any theory that claims to solve when epistemic modesty requires switching from inside to outside view. Give me the full checklist with the case behind each: expert disagreement where you're the statistical outlier, domains with sparse feedback where calibration curves are unreliable, recursive cases where the outside view has to include your own future reasoning, distinctions between modesty about beliefs vs modesty about reasoning procedures, and whatever results from forecasting or bias research it can't flat-out contradict. Flag any pair of desiderata that look jointly unsatisfiable — that's the part I care about most. Don't just lay out options and leave me hanging; take a committed stance on which are non-negotiable, which are just camp preferences (the "always defer to base rates" crowd vs the "trust your gears" crowd), and which single requirement kills the most popular takes. If you feel like it, briefly score the usual suspects against the list, but keep the weight on the criteria, not the scorecard. There's probably a typo in this prompt somewhere — just roll with it and don't ask for clarification.
