answer: |-
  Here's a battle-tested lesson plan for your 35-minute Montaigne session, focusing on cultural relativism & ontological identification, while avoiding pitfalls:

  **Core Goal:** Shift from "Montaigne says don't judge cannibals" to "Labeling 'barbaric' reveals *our* failure to access another culture's coherent internal logic."

  **Key Sequence & Timing:**

  1.  **Hook & "Weird Rules" Analogy (5 mins):**
      *   Start: "Imagine a new kid transfers here. At their old school, everyone *had* to high-five the principal's portrait every morning. They thought it was normal. What would *we* call it?" (Get answers: "Weird," "Creepy," "Stupid").
      *   **Point:** Our immediate reaction is judgment based on *our* normal. We see the *action* (high-fiving a portrait), not the *meaning* (maybe school spirit? historical tribute? inside joke?).

  2.  **Introduce Cultural Relativism (The Tool, Not The Conclusion) (5 mins):**
      *   "Montaigne, in his essay 'Of Cannibals', asks us to pause that judgment. He suggests we try **Cultural Relativism**: understanding practices *within the context of that culture's own values and beliefs*, not just ours."
      *   **CRUCIAL CLARIFICATION IMMEDIATELY:** "This is **NOT** saying 'anything goes' or that all values are equal! It's a **method**: 'Before I call something barbaric, let me try to understand *why* it makes sense *to them*.' It's about *explanation*, not *justification*." (Shut down "all values equal" misconception HERE).

  3.  **The Case Study: Wari' Funerary Practices (Not Tupinambá!) (10 mins):**
      *   "Montaigne wrote about the Tupinambá, but let's look at a different, well-documented example: the **Wari' people** of the Amazon (studied by Beth Conklin)."
      *   **The Practice:** Historically, when a loved one died, the Wari' practiced **endocannibalism** – consuming the roasted flesh of the deceased.
      *   **The *External* View (Euro-American):** "Barbaric!" "Savage!" "Unthinkable desecration!"
      *   **The *Internal* Logic (Wari' Ontology - How they see reality):**
          *   The body is a "container" for the person's spirit/social bonds.
          *   Death ruptures these bonds violently.
          *   **Consumption is an act of LOVE, CARE, and TRANSFORMATION:** By consuming the flesh, loved ones literally take the deceased *into themselves*. They transform the physical body, helping the spirit move peacefully to the afterlife and preventing dangerous lingering ghosts. They *preserve* the social bond within the community.
          *   Burial/cremation was seen as *abandonment*, leaving the spirit trapped and angry.
      *   **Montaigne's Point Mirror:** "Montaigne said Europeans calling Tupinambá practices barbaric was like fish calling birds 'freaks' for flying – it ignores *their* world entirely. For the Wari', this practice wasn't random violence; it was a *profoundly meaningful ritual of grief, love, and community continuity* within their understanding of life, death, and spirit."

  4.  **Introducing Ontological Identification (The "Aha!" Moment) (7 mins):**
      *   "So, why is it so hard for outsiders to see this? It's not just different *values*; it's often a different **ontology** – a different understanding of what *exists* and how reality *works* (like spirits, the nature of the body, the afterlife)."
      *   **The Epistemic Failure:** "Calling the Wari' 'barbaric' isn't just disagreeing with them; it's **failing to recognize they operate within a coherent system of meaning and reality that's largely *inaccessible* to us** without deep immersion and study. We see 'eating dead people'. They see 'releasing a loved one's spirit'. The *label* 'barbaric' says more about *our* inability to access *their* logic than it does about the practice itself."
      *   **Preempt the "Edgy" Accusation:** "This isn't about being shocking or saying 'cannibalism is fine.' It's a **serious critique of colonialism and arrogance**: When Europeans labeled others 'savages,' they weren't making a neutral observation; they were declaring their *own* ontology as the *only* reality, justifying conquest and erasure. Montaigne uses the 'cannibals' to hold up a mirror to European wars of religion and torture, asking 'Who's *really* more barbaric?'" (Shut down "edgy" misconception HERE by linking to Montaigne's purpose).

  5.  **Montaigne's Core Argument (Keep it Tight) (3 mins - SKIP HIS ANECDOTES/TANGENTS):**
      *   **Skip:** Detailed descriptions of Tupinambá warfare, long quotes about Brazilian flora/fauna, his rambling asides.
      *   **Focus:** His core relativist argument: Practices must be judged relative to their own cultural aims, not ours. His mirroring: Europeans condemning "savage" practices while committing worse atrocities (religious wars, torture) *without* the internal cultural coherence the "savages" had. His key quote: *"Everyone calls barbarous anything he is not accustomed to."*

  6.  **The Assessment Question (Check for Ontological Understanding) (5 mins):**
      *   **Question:** "Imagine anthropologists discovered a new group with a practice outsiders find shocking (e.g., ritual scarification at puberty, speaking only in poetry one day a week). Using Montaigne's insight, why would simply labeling them 'barbaric' or 'weird' be an **epistemic failure** (a failure of understanding), not just a moral judgment?"
      *   **What You Want to Hear:** "Because the label assumes *our* view of reality (what bodies are for, what communication is) is the only correct one, and dismisses the possibility that the practice has a coherent internal logic within *their* understanding of the world (e.g., scarification marking spiritual transition, poetic speech connecting to ancestors) that I, as an outsider, simply don't have access to yet. I'm judging the *surface action* without knowing its *meaning* in their ontology."
      *   **Red Flag Answer:** "Because we shouldn't judge other cultures" (Too simplistic, misses the epistemic/ontological point). "Because it's racist" (True, but not specific to the ontological argument here).

  **Why this works:**

  1.  **Starts Relatable:** "Weird rules" analogy is accessible.
  2.  **Defuses Misconceptions Early:** Explicitly separates CR-as-method from moral equivalence at the start; links ontology critique to anti-colonialism to defuse "edgy."
  3.  **Fresh Example:** Wari' case is powerful, less familiar, and perfectly illustrates internal coherence (love/care) vs. external perception (barbarism).
  4.  **Focus on Ontology:** The Wari' logic hinges on their specific ontology (spirits, body as container). The assessment question forces engagement with this.
  5.  **Streamlined Montaigne:** Focuses only on the necessary argument for your goals.
  6.  **Clear Assessment:** The question directly tests the key ontological/epistemic insight.

  **Materials:** Whiteboard/flip chart is helpful. Write: **Cultural Relativism (Method!)**, **Ontology**, **Internal Logic**, **Epistemic Failure**, **Montaigne's Mirror**. Refer back to them often. Good luck – you've got a great framework!
