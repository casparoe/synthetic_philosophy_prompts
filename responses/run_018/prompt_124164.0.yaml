  hey so i have to run a study session tomorrow for like six juniors in my school philosophy club and i want to explain montaignes essay on cannibals and how it ties to cultural relativism, but im also trying to inject this idea about ontology identification — basically that labeling a group barbaric is partly an epistemic failure cause the internal logic of their practices is inaccesible to us. plan how i should teach it: what idea has to land first before they even understand why relativism isnt just saying cannibalism is okay, what example should carry the whole thing (and please not the tupinamba if thats too obvious?), the misconceptions theyll form in order — probably that all values are equal then that im being edgy — and exactly where in the sequence to shut each one down. also give me one end-of-session question that checks whether they got the inaccesible-information point about ontology rather than just remembering the cannibal shock factor, plus what part of montaignes actual argument i should skip since we only have 35 mins and no one brought the text.
