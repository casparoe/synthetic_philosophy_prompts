answer: |-
  That's a sharp observation, and you're right – this is a distinct and pernicious pattern that leverages the *dirty hands dilemma* but twists it into an *excuse* for *avoidable* wrongdoing. While there isn't one universally agreed-upon term, several established concepts capture its essence:

  1.  **"Corruption of Integrity" (within Dirty Hands Theory):** Michael Walzer, in his seminal essay "Political Action: The Problem of Dirty Hands," argued that the true horror isn't just the initial act, but the *corruption* it inflicts on the actor's integrity. Your example shows the *operationalization* of that corruption. The mayor/senator isn't just *feeling* corrupted; they are *using* their corrupted state as a *tool* or *justification* for further, avoidable corruption. They are essentially saying, "My integrity is already lost, so why protect it now?"

  2.  **"Moral Self-Licensing" (Specific Variant):** While you're right that classic moral licensing involves good deeds licensing bad deeds, psychologists identify a variant: **"past sacrifices/moral credits licensing subsequent indulgences."** The initial "dirty hands" act, framed as a necessary *sacrifice* for the greater good (even if it was), generates "moral credits" in the actor's own mind. They then feel entitled to "spend" these credits on self-serving or less justifiable actions later, like the luxury condo or unconstitutional data grab. The sacrifice becomes a license for indulgence.

  3.  **"Tainted Justification" or "Spoiled Agency":** This draws from organizational ethics and moral psychology. The initial unavoidable wrong "taints" the actor's moral standing. Instead of motivating *greater* caution, the taint becomes a justification for *lowering* standards ("I'm already tainted, so more taint doesn't matter"). Their agency is "spoiled," leading to a diminished sense of responsibility for future acts.

  4.  **"Ethical Slippery Slope (Agent-Focused)":** While not a causal slippery slope, it *is* a *psychological* or *rationalizing* slippery slope. The first compromise weakens the psychological barrier against future compromises. The "I'm already dirty" rationale makes subsequent wrongdoing feel psychologically easier and less significant. The slope isn't inevitable, but the rationale greases it.

  **What to Call It?**
  You could aptly call this pattern:

  *   **The "Corrupted Integrity Defense" or "Corruption Leverage":** Emphasizes the active *use* of the corrupted state gained from the initial dirty hands act.
  *   **"Moral Exhaustion / Cynicism Amplification":** Highlights the weariness and cynicism ("nothing matters anymore") that fuels the subsequent choices.
  *   **"Ethical Capital Depletion":** Frames the initial act as spending ethical capital, and subsequent acts as spending the depleted remains with no regard for replenishment.
  *   **"The 'Since-I'm-Already-Dirty' Fallacy" or "The Ruined Garment Rationalization":** More descriptive, capturing the core faulty logic.

  **Distinguishing it from Hypocrisy:**

  This is crucial. Here's the line:

  *   **Hypocrisy:** Involves a *discrepancy* between *professed* principles and *actual* behavior, often accompanied by *concealment* or *denial*. The hypocrite *claims* virtue while acting viciously and *hides* the vice or denies its inconsistency with their stated values.
      *   *Example:* A politician campaigns on family values but has multiple extramarital affairs and lies about them.
  *   **"Corrupted Integrity Defense":** Involves an *acknowledgment* of prior moral failure/compromise (the dirty hands act) but then *openly uses that acknowledged failure* as a *justification* for *further*, avoidable wrongdoing. There's less pretense about the "dirtiness"; it's weaponized. The vice is *admitted* and used as a *reason* for more vice.
      *   *Your Examples:* The mayor *admits* the dump was dirty hands but says that very dirtiness means she shouldn't bother trying to be clean now. The senator *admits* the '03 vote compromised his principles but argues that compromise means he shouldn't uphold them later.

  **Key Difference:** Hypocrisy relies on *deception* (of self or others) about one's virtue. The "Corrupted Integrity Defense" relies on *cynical honesty* about one's *lack* of virtue to justify its further erosion. It's not hiding the stain; it's pointing to the stain and saying, "See? Ruined. Might as well roll in the mud."

  This pattern is incredibly dangerous because it exploits the genuine tragedy of dirty hands situations to enable blatant corruption. Recognizing it requires calling out the faulty logic: past moral compromise, however necessary, *increases* the obligation for future moral vigilance and restitution, not the opposite. Using one's "dirt" as a license for more dirt is the surrender of ethical agency, not its justification.
