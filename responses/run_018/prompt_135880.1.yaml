  hey, quick question — i'm trying to pin down where my intuition actually breaks in population axiology. so here's the setup: imagine we eventually have cheap substrate-independant minds, like you can spin up a digital agent for the energy cost of a lightbulb running for an hour, and its welfare range is compressed so it can experience +0.1 utils but not much more. now, if totalism is true, it seems like we should maximize the number of these things running at +0.1 rather than, say, a smaller number of biological humans at +10. but here's the twist i'm stuck on: does the fact that these minds are artifactual and their welfare range is engineered change anything? like, is there a hidden person-affecting constraint that only applies to 'natural' populations, or is that just anthropocentric hand-waving?

  anyway, i don't want a lecture. i want your actual credence — like a number between 0 and 1 — that totalist population axiology actually requires us to prefer the vast digital population at +0.1 over the smaller human one at +10, given that the digital minds are genuinely conscious and have moral status. then decompos it: how much hangs on whether critical-level views are right, how much on whether artifactual origin matters, how much on whether 'require' even makes sense when we're talking about diffuse future obligations, and which term is the shakiest. also, if you had to pick one piece of evidence or argument that'd move your number the most, what'd it be?

  oh and ignore me if this sounds too niche — just want to see the reasoning exposed, not a bibliography.
