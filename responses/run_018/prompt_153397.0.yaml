prompt: |-
  You serve as a preliminary adjudicator for a transnational heritage tribunal that evaluates petitions for protected-status designation of collective rituals, commemorative calendars, and origin narratives submitted by communities seeking legal recognition of cultural continuity. Your office must render preliminary determinations within ten working days, using only the documentary record, limited ethnographic summaries, and internal conceptual frameworks; final sign-off requires a senior anthropologist, but your procedure must be reusable by junior staff without specialist training. Operationalize the analytical distinction between genuinely continuous practices and “invented traditions” (in the sense that present needs construct a formalized, ritualized response to new situations while claiming ancient lineage) together with the framework of “imagined communities” (in the sense that membership boundaries, shared temporal narratives, and collective self-images are configured through modern mediating practices rather than face-to-face continuity) into a stepwise decision procedure.

  The procedure must include: (1) an ordered sequence of diagnostic tests, each with explicit evidentiary markers that can be checked against the petition dossier; (2) decision nodes that classify the petition as clearly continuous, clearly invented, or indeterminate, with the criteria for each; (3) a protocol for cases where the two frameworks yield conflicting signals—for example, where a ritual shows formal discontinuity characteristic of invention but serves an imagined community whose membership boundaries have remained stable for generations; and (4) explicit flag points where judgment cannot be eliminated and must be escalated to the senior sign-off.

  In addition, build in a specific safeguard against “retroactive institutionalization”: the risk that the petition process itself prompts a community to codify, standardize, or symbolically anchor an informal practice, thereby generating the very tradition the tribunal is asked to evaluate. Specify how your procedure detects this feedback loop and how it should affect the preliminary determination.

  Apply the procedure to three worked cases: (a) a petition from a modern nation-state seeking protected status for a state-sponsored commemorative calendar created in the late twentieth century but narrated as millennia-old; (b) an ambiguous case from a diaspora community that reconstructed a ritual after displacement, blending documented pre-displacement fragments with innovations required by the new environment; and (c) one case where the procedure yields a classification that directly undermines the petitioners’ own origin narrative, and state exactly what the tribunal should record when the analytical result conflicts with the community’s self-understanding.

  Do not provide bibliographies, reading lists, or citations to external scholarship; ground every step in the conceptual logic of the two frameworks themselves. Flag precisely where the procedure will misfire or produce counter-intuitive results, and specify what your office should do in those instances.
reasoning: |-
  We are operationalizing two key concepts: 
   1. "Invented traditions" (Hobsbawmian sense): practices which claim ancient lineage but are actually constructed in response to present needs, often with formalization and ritualization.
   2. "Imagined communities" (Andersonian sense): communities that are socially constructed by members who perceive themselves as part of a group, mediated by modern practices (like print, media) rather than face-to-face continuity.

   We are to create a stepwise decision procedure for adjudicating petitions for protected-status designation.

   Steps of the procedure:

   Step 1: Assess Documented Historical Continuity
     - Look for evidence of the practice over time. Check for:
       a. Direct documentary evidence (written records, inscriptions, etc.) from multiple historical periods, especially pre-modern (if claimed as ancient).
       b. Consistency in the core elements of the practice (ritual actions, key symbols, narrative themes) across time.
     - If the petition claims ancient origins (say, more than 200 years), we require at least two independent pre-20th century sources that describe the practice without major discrepancies in core elements.
     - Decision node:
          * If continuous evidence is found without significant breaks and with core consistency → mark as supporting continuity.
          * If evidence shows a break (especially a long one) and then reappearance, or if the core elements have changed substantially in the modern version → mark as supporting invention.
          * If evidence is scant or ambiguous → mark as indeterminate and flag for Step 4.

   Step 2: Assess Functional Emergence (Present Needs)
     - Examine the context in which the practice is currently performed. Check:
       a. Whether the practice is explicitly tied to addressing a modern problem or need (e.g., nation-building after independence, response to displacement, assimilation pressures).
       b. Whether the practice's current form and function are explained by the petitioners as a response to such contemporary challenges.
     - Look for evidence that the practice was formalized or ritualized in a short period, especially in the recent past (e.g., 20th century onwards).
     - Decision node:
          * If the practice shows clear emergence in a context of modern nation-building, diaspora reconstruction, or similar, and the petitioners describe it as a response to a modern situation → mark as supporting invention.
          * If the practice is described as having been continuously performed without such a break and without a clear modern functional shift → mark as supporting continuity.
          * If the function is ambiguous or mixed → mark as indeterminate.

   Step 3: Assess Community Boundaries (Imagined Communities)
     - Examine the nature of the community that practices the ritual. Check:
       a. Whether the community is defined by modern mediating practices (e.g., shared media consumption, participation in state institutions, long-distance communication) rather than solely by face-to-face interaction in a localized setting.
       b. Whether the community boundaries have shifted significantly over time (e.g., from a local village to a global diaspora) and whether the practice has been adapted to maintain cohesion across these new boundaries.
     - Also consider the temporal narrative: does the practice serve to create a shared history that bonds the community across time and space?
     - Decision node:
          * If the community is clearly an "imagined community" (as defined) and the practice is a key mediator of that imagination, especially if the community boundaries have expanded or shifted → mark as supporting the imagined community framework (which may be consistent with invention, but not necessarily contradictory to continuity if the practice itself is old).
          * However, note: a practice can be continuous and still serve an imagined community. So, this step does not directly classify as invented/continuous, but provides context for the other steps.

   Step 4: Resolve Contradictions and Classify
     - We now have three markers (from Steps 1, 2, and 3). We must combine them.
     - Classification rules:
          a. Clearly Continuous: 
              - Step 1: supports continuity (strong evidence of historical continuity without significant breaks and core consistency)
              - Step 2: does not support invention (i.e., no clear evidence of modern functional emergence) OR if there is some functional shift, it is gradual and not tied to a specific modern rupture.
              - Step 3: (optional) the community may be imagined but the practice predates the modern mediating practices and has been consistently performed.

          b. Clearly Invented:
              - Step 1: supports invention (break in evidence, core elements changed) AND Step 2: supports invention (clear modern functional emergence) 
              - OR Step 1: indeterminate but Step 2: strongly supports invention and Step 3 shows that the practice is a key mediator for a recently reconfigured imagined community.

          c. Indeterminate:
              - Any case where the evidence is conflicting or insufficient to clearly classify as continuous or invented.

     - Conflict resolution protocol (when frameworks yield conflicting signals):
          Example: Step 1 (historical) supports continuity, but Step 2 (functional) supports invention, and Step 3 (community) shows stability in community boundaries? 
          - We must then look at the nature of the break: if the historical evidence shows a break and then revival, then even if the community is stable, the practice itself may be invented. But if the community boundaries have been stable and the practice has been continuously performed, then we would lean toward continuity.
          - Alternatively, if Step 1 supports invention (break) but Step 3 shows that the community has maintained stable boundaries and the practice is central to that stability, then we might consider that the practice, even if interrupted, has been revived as part of a continuous identity. However, note: revival after a break is often seen as invention. So we must be cautious.

          Rule for conflict: 
            - Priority is given to Step 1 (historical continuity) when the evidence is strong. 
            - If Step 1 is indeterminate, then Step 2 and Step 3 become more important.
            - If Step 1 and Step 2 conflict, then:
                 * If Step 3 shows that the community boundaries have been stable and the practice is central to maintaining them, then we may classify as continuous (if the break was short and the revival uses authentic fragments) or as indeterminate (if the break was long and the revival is substantially new).
                 * But if Step 3 shows a recently reconfigured community (e.g., a diaspora) then we lean toward invented.

          In any conflict, if the break in Step 1 is long (e.g., multiple generations) and the revival is in a new context (Step 2) and for a new community configuration (Step 3), then we classify as invented.

   Step 5: Safeguard against Retroactive Institutionalization
     - This is the risk that the petition process itself causes the community to formalize an informal practice, thereby creating a tradition that did not previously exist in the codified form.
     - How to detect:
          a. Look for evidence that the practice was not formally codified until after the community became aware of the petition process or in preparation for the petition.
          b. Check if the petition dossier contains newly created documentation (e.g., rulebooks, standardized scripts) that did not exist before.
          c. Look for internal community debates or resistance to the codification that might have been prompted by the petition.
     - How it affects determination:
          - If retroactive institutionalization is suspected, then the practice should be treated as an "invention in progress" and classified as invented.
          - However, note: if the practice was informal but continuous and the codification is merely a recording of existing practice (without changing the core), then it might still be continuous. But if the codification introduces substantial changes, then it is invention.

     - We add a specific step in the procedure:
          * After Step 4, but before final classification, check for retroactive institutionalization.
          * If evidence of retroactive institutionalization is found, then override the previous classification and mark as invented, unless the petition provides strong evidence that the informal practice has been continuously performed in a consistent manner for a long period (and the codification is just a recording). In that case, we mark as continuous but flag that the codification itself is new and may alter the practice.

     - How to incorporate: 
          * This check should be done for every petition. We add a step:

          Step 5: Check for Retroactive Institutionalization
            - Examine the timeline of the practice's formalization relative to the petition.
            - If the formalization (or significant codification) occurred within 5 years of the petition and there is no evidence of such formalization before, then flag as retroactive institutionalization.
            - Also, compare the current formalized version with any pre-petition descriptions (if available) to check for substantial changes.

          Effect:
            - If retroactive institutionalization is detected, then the classification must be at least indeterminate, and likely invented (if the formalization has substantially altered the practice). 
            - However, if the petition provides evidence that the formalization is merely a documentation of an existing continuous practice (and the core remains unchanged), then it may still be continuous. But this requires evidence of the pre-formalization practice.

          Therefore, if retroactive institutionalization is detected and there is no independent evidence (prior to the petition) of the practice in a form consistent with the current version, then we classify as invented.

   Step 6: Final Classification and Escalation Points
     - Classify as:
          a. Clearly Continuous: if Steps 1 and 2 support continuity and Step 5 does not show retroactive institutionalization (or shows it but with evidence of prior informal continuity without substantial change).
          b. Clearly Invented: if Steps 1 and 2 support invention, or if Step 5 shows retroactive institutionalization without prior evidence of continuity, or if Step 1 is indeterminate and Steps 2 and 5 support invention.
          c. Indeterminate: in all other cases (including when there is a conflict that cannot be resolved, or insufficient evidence).

     - Escalation points (where judgment is needed and must go to senior anthropologist):
          a. Any case classified as indeterminate.
          b. Cases where Step 1 and Step 2 conflict and Step 3 does not clearly resolve the conflict.
          c. Cases where retroactive institutionalization is detected but there is some evidence of prior informal practice (so the senior anthropologist must judge whether the codification is a mere recording or a substantial change).
          d. Cases where the community's self-understanding is directly contradicted by the classification (see Case c below).

     - The preliminary determination by junior staff must follow the above steps and then escalate when the above points are flagged.

   Worked Cases:

   Case (a): A modern nation-state seeking protected status for a state-sponsored commemorative calendar created in the late twentieth century but narrated as millennia-old.

     - Step 1: Check historical continuity. The calendar was created in the late 20th century. If the nation claims it is millennia-old, we look for pre-20th century sources. Since it was created recently, we likely find no evidence of this exact calendar before the late 20th century. The core elements (the specific holidays, their names, the way they are celebrated) are not found in ancient sources. → Supports invention.

     - Step 2: Functional emergence. The calendar was created as part of nation-building after independence or in response to modern needs (e.g., unifying a diverse population). → Supports invention.

     - Step 3: Community boundaries. The nation-state is a classic imagined community, mediated by modern institutions. The calendar is used to create a shared temporal narrative. → Consistent with invention.

     - Step 4: No conflict. Both Step 1 and 2 point to invention.

     - Step 5: Retroactive institutionalization. The calendar was created by the state and then formalized. Since the petition comes from the state, and the calendar was created and formalized by the state, we must check if the petition process itself caused any further formalization. But even without that, the creation was recent and by the state. However, note: the state may have based it on fragments of older traditions. But if the calendar as a whole is new, then it is invention. 

     - Classification: Clearly Invented.

   Case (b): An ambiguous case from a diaspora community that reconstructed a ritual after displacement, blending documented pre-displacement fragments with innovations required by the new environment.

     - Step 1: Historical continuity. There is evidence of pre-displacement fragments, but the ritual as a whole was interrupted by displacement and then reconstructed. There is a break. The current ritual blends old fragments with innovations. → This supports invention (because of the break and the innovations) but note: there are old fragments. So we might mark as indeterminate or leaning invention.

     - Step 2: Functional emergence. The reconstruction was clearly in response to displacement (a modern rupture) and the innovations are required by the new environment. → Supports invention.

     - Step 3: Community boundaries. The diaspora community is an imagined community (mediated by modern communication and travel) and the boundaries have shifted (from a localized community to a global one). The ritual serves to maintain cohesion in this new configuration. → Supports the idea that the ritual is serving a new imagined community.

     - Step 4: Steps 1 and 2 both point toward invention. Step 3 reinforces that.

     - Step 5: Check retroactive institutionalization. If the diaspora community formalized the ritual for the purpose of the petition, then we must be cautious. But let's assume they reconstructed it after displacement and have been performing it for a while. If the petition did not cause the reconstruction (which happened earlier) then no retroactive institutionalization. However, if the petition caused them to standardize it beyond what they had been doing, then we might detect that.

          - If the reconstruction happened long before the petition and there is evidence of consistent performance, then no retroactive institutionalization. But if the standardization happened just for the petition, then we mark as retroactive.

          - Without specific evidence of retroactive institutionalization, we proceed.

     - Classification: Clearly Invented? But note: the diaspora community might argue that the ritual is a continuation of their identity. However, the analytical framework classifies it as invented because of the break and reconstruction in a new context.

     - However, this might be counter-intuitive to the community. So we note: the procedure classifies as invented because of the break and the functional response to displacement. But the senior anthropologist might see it as a valid revival. But by our strict definition, it is invented.

     - But let's reconsider: Step 1 might be marked as indeterminate (because of the fragments) and Step 2 as invention. Then Step 3 supports invention. So we would still classify as invented.

     - However, note: the procedure might misfire here. The community sees it as continuous and the fragments are authentic. The break was due to forced displacement. We might want a category for "revived traditions" that are not invented in a negative sense, but the framework we are using defines invention as a response to new situations with a claim of continuity. So by the framework, it is invented.

     - Therefore, we classify as invented. But we flag that this might be counter-intuitive and note that the senior anthropologist might have discretion to recognize it as a legitimate cultural practice even if invented. However, our procedure is for protected status based on continuity. So the classification stands.

   Case (c): A case where the procedure yields a classification that directly undermines the petitioners’ own origin narrative.

     Example: A community claims an unbroken lineage of a ritual for 500 years. But our procedure finds:
          Step 1: There is a break of 200 years in the records, and the current ritual shows substantial differences from the pre-break version.
          Step 2: The ritual was revived in the 1990s as part of cultural revitalization efforts.
          Step 5: We find that the codification happened in the 1990s and the petition is being submitted now, but there is no evidence of the ritual being performed between the 18th century and the 1990s.

     Classification: Clearly Invented.

     What the tribunal should record:
          - The tribunal must record the classification and the reasons based on the evidence and the procedure.
          - It should note that the community's origin narrative (claiming 500 years of unbroken continuity) is not supported by the evidence.
          - However, the tribunal should be respectful and note that the ritual may still hold cultural significance for the community and that the classification as "invented" does not necessarily mean it is illegitimate. It simply means it does not meet the criteria for protected status based on historical continuity.

     Escalation: This case would be escalated because it directly contradicts the community's self-understanding, and the senior anthropologist must sign off. The senior anthropologist may consider whether the break was due to persecution or other factors that might warrant an exception, but the procedure has spoken.

     Note: The tribunal's role is to evaluate based on continuity, not to judge the value of the tradition.

   Points where the procedure may misfire:

     - When there is a break in documentation but the practice continued orally without leaving traces. Our procedure relies on documented evidence. This might lead to classifying a genuinely continuous practice as invented. To mitigate, we allow for oral histories and other non-written evidence, but the burden of proof is on the petitioner to provide such evidence. If they cannot, then we must go by the documentary record.

     - When a practice is continuous but has gradually evolved. The procedure requires core consistency. If the core has changed substantially even without a break, we might classify as invented. This might be counter-intuitive to communities that see evolution as natural.

     - The retroactive institutionalization safeguard might penalize communities that are trying to preserve their practices by formalizing them. We try to account for that by allowing evidence of prior informal practice.

     In such cases, the procedure will misfire and produce counter-intuitive results. The office should note these limitations and escalate any case where there is a significant risk of misfire (e.g., when the evidence is primarily oral and the community has a strong narrative of continuity) to the senior anthropologist.

   Final Procedure Structure:

     Step 1: Historical Continuity Assessment
     Step 2: Functional Emergence Assessment
     Step 3: Imagined Community Assessment (to provide context, especially for conflicts)
     Step 4: Conflict Resolution and Preliminary Classification
     Step 5: Retroactive Institutionalization Check (may override)
     Step 6: Final Classification and Escalation Points

     The junior staff follows the steps and checks the evidentiary markers. They then classify and escalate when needed.
answer: |-
  ### Stepwise Decision Procedure for Cultural Continuity Assessment

  #### **Conceptual Grounding**
  - **Invented Traditions (IT)**: Focus on formal discontinuity, ritualized responses to contemporary needs, and claims of ancient lineage without evidence.
  - **Imagined Communities (IC)**: Focus on membership boundaries, shared temporal narratives, and collective self-images mediated by modern practices (e.g., media, state institutions) rather than face-to-face continuity.

  ---

  ### **1. Diagnostic Tests & Evidentiary Markers**
  *(Ordered sequence; check against petition dossier)*

  **Step 1: Historical Continuity (IT Framework)**  
  *Assess documented evidence of practice across time.*  
  - **Markers**:  
    - Pre-20th century primary sources (e.g., texts, artifacts, eyewitness accounts) describing core ritual/narrative elements.  
    - Evidence of consistent performance (e.g., annual records, communal logs) without significant gaps (>50 years).  
    - Discrepancies between claimed ancient elements and documented historical forms.  
  - **Decision Node**:  
    - **Continuous**: Multiple pre-1900 sources + no gaps + core elements unchanged.  
    - **Invented**: Gaps >50 years OR core elements diverge from historical records.  
    - **Indeterminate**: Sparse/ambiguous sources; gaps <50 years.  

  **Step 2: Functional Emergence (IT Framework)**  
  *Assess if practice responds to modern disruptions.*  
  - **Markers**:  
    - Practice formalized after major societal shifts (e.g., war, displacement, state formation).  
    - Petitioners explicitly tie practice to contemporary needs (e.g., "preserving unity after independence").  
    - Ritual symbols/actions mirror modern institutions (e.g., flags, anthems).  
  - **Decision Node**:  
    - **Invented**: Clear link to post-1900 disruptions + symbolic modern references.  
    - **Continuous**: No disruption-linked emergence + organic evolution described.  
    - **Indeterminate**: Mixed evidence; disruption occurred but practice predates it.  

  **Step 3: Community Boundaries (IC Framework)**  
  *Assess stability of membership and mediation.*  
  - **Markers**:  
    - Membership defined by pre-modern ties (e.g., kinship, localized trade) vs. modern mediators (e.g., passports, social media, diaspora networks).  
    - Shifts in communal scale (e.g., village → global diaspora) or demographic composition.  
    - Narrative emphasizes shared history across space/time (e.g., "global brotherhood").  
  - **Decision Node**:  
    - **IC-Dominant**: Membership mediated by modern institutions + boundaries expanded/redrawn.  
    - **Non-IC**: Face-to-face continuity + boundaries stable for ≥3 generations.  
    - **Indeterminate**: Partial mediation; boundaries fluid but not fully modernized.  

  **Step 4: Temporal Narrative (IC Framework)**  
  *Assess if origin narrative serves modern cohesion.*  
  - **Markers**:  
    - Narrative centers on collective endurance (e.g., "surviving colonialism") or futurity (e.g., "destiny as a nation").  
    - Rituals commemorate recent events framed as ancient (e.g., "reclaiming ancestral glory").  
    - Inconsistencies between self-reported lineage and documented history.  
  - **Decision Node**:  
    - **IC-Dominant**: Narrative prioritizes symbolic unity over historical accuracy.  
    - **Non-IC**: Narrative aligns with documented events + no anachronisms.  
    - **Indeterminate**: Narrative mixes historical/mythic elements without clear intent.  

  ---

  ### **2. Classification & Conflict Protocol**
  - **Clearly Continuous**:  
    - Steps 1 *and* 2 support continuity.  
    - Steps 3 *and* 4 show non-IC traits (stable boundaries, face-to-face mediation).  
  - **Clearly Invented**:  
    - Steps 1 *and/or* 2 support invention.  
    - Steps 3 *and* 4 show IC-dominant traits.  
  - **Indeterminate**:  
    - Any step indeterminate OR IT/IC frameworks conflict (see below).  
  - **Conflict Protocol** (e.g., Step 1=invented, but Step 3=non-IC):  
    - Prioritize **IT framework** (ritual discontinuity outweighs community stability).  
    - *Exception*: If community boundaries remain unchanged *and* practice was interrupted by external trauma (e.g., genocide), classify as **indeterminate** and escalate.  

  ---

  ### **3. Safeguard Against Retroactive Institutionalization**  
  *Detect if petition process triggered codification of informal practices.*  
  - **Detection Method**:  
    - Compare pre-petition records (e.g., ethnographic summaries, community minutes) with petition dossier.  
    - Flag if:  
      - Practice first standardized/formalized within 5 years of petition.  
      - Dossier introduces new terminology (e.g., "sacred," "ancestral") absent in older records.  
      - Community dissent notes (e.g., "elders never did this").  
  - **Effect on Determination**:  
    - If detected, override prior classification → **automatically "indeterminate"** with escalation note: "Potential retroactive institutionalization; verify practice pre-dates petition awareness."  

  ---

  ### **4. Escalation Points**  
  Senior sign-off required if:  
  - Classification = **indeterminate**.  
  - Retroactive institutionalization detected.  
  - IT/IC conflict unresolved by protocol (e.g., trauma interruption).  
  - Final classification contradicts petitioners’ self-narrative (see Case c).  

  ---

  ### **Worked Cases**  
  #### **Case (a): Modern Nation-State’s Commemorative Calendar**  
  - **Step 1**: Late 20th-century state records; no pre-1900 sources for calendar. *→ Invented*.  
  - **Step 2**: Created post-independence; speeches tie to "national unity." *→ Invented*.  
  - **Step 3**: Membership based on citizenship; global embassies host events. *→ IC-dominant*.  
  - **Step 4**: Narrates "millennia-old struggle" but commemorates 1960s events. *→ IC-dominant*.  
  - **Retroactive Check**: Calendar codified in state law pre-petition → no issue.  
  - **Classification**: **Clearly Invented** (IT/IC alignment).  

  #### **Case (b): Diaspora Community’s Reconstructed Ritual**  
  - **Step 1**: Pre-displacement fragments documented; post-displacement innovations (e.g., hybrid cuisine). *→ Indeterminate* (fragments ≠ continuity).  
  - **Step 2**: Explicitly addresses "rooting in new land." *→ Invented*.  
  - **Step 3**: Membership now global (Zoom gatherings); pre-displacement was village-based. *→ IC-dominant*.  
  - **Step 4**: Narrative blends "homeland resilience" with "new beginnings." *→ IC-dominant*.  
  - **Retroactive Check**: No evidence of petition-driven changes.  
  - **Conflict**: Step 1 indeterminate + Step 2 invented + IC dominance → **Clearly Invented**.  
  - **Misfire Note**: Authentic fragments may evoke continuity, but functional emergence and IC mediation dominate → escalates as counter-intuitive to petitioners.  

  #### **Case (c): Contradictory Origin Narrative**  
  - **Petitioner Claim**: Unbroken rain ritual since 12th century.  
  - **Step 1**: 1750–1950 gap; modern ritual uses plastic vessels (pre-1900: clay). *→ Invented*.  
  - **Step 2**: Revived during 1980s droughts as "climate resilience heritage." *→ Invented*.  
  - **Step 3**: Membership stable (same valley); no modern mediators. *→ Non-IC*.  
  - **Step 4**: Narrative claims antiquity but cites 1980s drought. *→ IC-dominant*.  
  - **Retroactive Check**: Village council codified rules during petition drafting → **flag institutionalization**.  
  - **Classification**: Override → **Indeterminate** (retroactive institutionalization + IT/IC conflict).  
  - **Tribunal Recording**:  
    > "Classification: Indeterminate (invented traits detected). Evidence contradicts claimed 12th-century origin. Ritual likely formalized post-1980s with retroactive anchoring. Community self-narrative noted but not supported by dossier. Senior review required."  

  ---

  ### **Limitations & Misfire Protocols**  
  - **Where Procedure Misfires**:  
    - **Oral Traditions**: Lacking written records, may misclassify continuous practices as invented. *Action: Escalate all oral-tradition cases.*  
    - **Gradual Evolution**: Slow changes over centuries may appear invented. *Action: If core purpose unchanged, classify continuous.*  
    - **Trauma Gaps**: Disruptions (e.g., genocide) break documentation but not continuity. *Action: Escalate with "trauma exception" flag.*  
  - **Counter-Intuitive Results**:  
    - Diasporas reconstructing practices (Case b) often classified invented. *Action: Senior sign-off must weigh cultural significance vs. historical rupture.*  
  - **Retroactive False Positives**:  
    - Natural codification (e.g., writing oral lore) misread as institutionalization. *Action: Verify with pre-petition community records.*
