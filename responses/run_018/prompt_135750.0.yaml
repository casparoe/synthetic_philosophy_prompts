  For part 2 about sample-space choice, I should emphasize that Bertrand exposed how "random chord" requires explicit parameterization. Different reasonable choices (endpoints, midpoint, direction) lead to different measures because the underlying symmetries vary. This isn't a flaw in probability but a lesson in precise specification.

  When addressing flat priors in part 3, I'll acknowledge the problem while offering nuance. Modern Bayesians don't abandon flat priors entirely but use them cautiously with transformations like Jeffreys prior. The key is recognizing that "uniform" depends on the chosen parametrization's meaning.

