answer: |-
  Here is the precise translation you requested, with residue analysis and critical evaluation of "nomenclatural capture":

  **Taxonomic Translation of Genocide Discourse**

  1.  **Lemkin's Coining as New Species Description:**
      *   **Translation:** Analogous to publishing a formal species description based on observed novel characteristics (systematic destruction patterns) not adequately covered by existing taxa ("massacre," "crimes against humanity"). Lemkin provided a *diagnosis* (intent to destroy groups) and designated *type specimens* (e.g., the Armenian genocide, emerging evidence of the Holocaust) as reference points.
      *   **Fidelity:** High. Involves recognizing a distinct phenomenon, proposing a name, and establishing defining criteria based on observed instances.

  2.  **UN Genocide Convention Definition as a Species Concept:**
      *   **Translation:** The Convention acts as the formally adopted **"Legal-Intent Species Concept" (LISC)**. Key elements:
          *   *Group-Based Criteria (Protected Groups):* Analogous to defining the **taxonomic scope** of applicability (e.g., "only applies to vertebrates," or in this case, national, ethnic, racial, religious groups).
          *   *Intent Element (Dolus Specialis):* Analogous to a **required diagnostic character** in the definition (e.g., "presence of a specific enzyme," or here, specific intent to destroy the group in whole or in part).
          *   *Enumerated Acts (Killing, Causing Harm, etc.):* Analogous to **morphological/behavioral characters** used to diagnose the phenomenon (e.g., specific destructive behaviors constituting the "genetic material" of the crime).
      *   **Fidelity:** Moderate. The LISC functions like a hybrid phylogenetic/morphological concept: it defines essential characters (intent + acts) and sets boundaries (protected groups). However, the "intent" character is uniquely abstract and evidentiary compared to biological traits.

  3.  **State Refusal to Apply Label as Institutional Suppression:**
      *   **Translation:** Directly analogous to powerful taxonomic authorities (e.g., major museums, influential journals) refusing to adopt or recognize a validly described taxon. Reasons include:
          *   *Political Expediency:* Avoidance of legal obligations (R2P) or diplomatic fallout (like an institution avoiding reclassification that undermines its collections/research focus).
          *   *Conceptual Disagreement:* Arguing the event doesn't meet the LISC criteria (like disputing diagnostic characters).
          *   *Denialism:* Actively suppressing evidence or interpretation (akin to suppressing type specimens or field observations).
      *   **Fidelity:** High for *institutional behavior*. The dynamics of authority, inertia, and vested interests suppressing classification align well.

  4.  **Uniqueness (Holocaust) vs. Generality Debate as Lumping vs. Splitting:**
      *   **Translation:** Classic lumper-splitter tension.
          *   **Splitters:** Argue the Holocaust is a unique historical *species* (`Unicus extremis`) due to its industrial scale, ideological totality, and specific context. Applying "genocide" broadly dilutes its meaning/normative force (like over-splitting genera obscures evolutionary patterns).
          *   **Lumpers:** Argue the Holocaust is a definitive *specimen* of the broader *genus* `Genocidus humanus`, sharing the core diagnostic characters (intent + destructive acts against a group) with other events (Armenia, Rwanda, Cambodia). Denying the label to similar events is scientifically/morally inconsistent (like ignoring cryptic species due to superficial similarity).
          *   **Normative Dilution Worry:** Analogous to concern that over-lumping diverse phenomena under one name reduces the term's specific predictive power or conservation urgency for the most extreme cases.
      *   **Fidelity:** High for the *structural debate*. The core tension between emphasizing distinctiveness versus shared defining characteristics maps directly.

  **Residue Report: What Doesn't Translate**

  1.  **Moral Weight & Survivor Testimony:**
      *   **Residue:** The lived experience, trauma, and moral authority of survivors have no counterpart in taxonomy. A type specimen has evidentiary value but carries no inherent moral claim. Survivor testimony transcends evidentiary data – it is a *normative demand* for recognition and justice.
      *   **Distortion:** Treating testimony *only* as data input (like a field observation) misses its irreducible ethical and emotional force.

  2.  **Legal Triggers & State Obligations:**
      *   **Residue:** The Genocide Convention creates binding *legal obligations* under international law (e.g., prevention, punishment). Recognizing a biological taxon creates no comparable legal duties for states or the international community. The "R2P" doctrine has no ecological parallel.
      *   **Distortion:** Mapping institutional suppression covers political *resistance* but not the profound *legal consequences* that recognition/non-recognition entails.

  3.  **Normative Urgency of Prevention:**
      *   **Residue:** The core purpose of the genocide concept is *prevention*. While conservation biology has preventative goals, the urgency is instrumental (preserving biodiversity/ecosystems). The prevention imperative for genocide is intrinsic and absolute – stemming from the inherent value of human groups and individuals. Taxonomy lacks this inherent, categorical "ought."
      *   **Distortion:** Framing prevention solely as a conservation-like goal understates its basis in fundamental human rights and the imperative to protect human life and dignity *as ends in themselves*.

  4.  **Intentionality and Moral Agency:**
      *   **Residue:** The *dolus specialis* (specific intent) is an act of human moral agency and malice. Biological classifications involve no analogous intent or moral culpability. The "diagnostic character" of intent belongs to a radically different (moral/legal) domain.
      *   **Distortion:** While analogous as a required criterion, the *nature* of this criterion (conscious human choice to destroy) is ontologically distinct from biological traits.

  **Evaluation of "Nomenclatural Capture":**

  *   **Illumination:** The concept is **highly illuminating** for the politics of genocide denial and non-recognition. It perfectly captures:
      *   How powerful state actors strategically deny recognition of a valid classification (`Genocidus humanus`) because its formal acceptance triggers unwanted consequences (legal liability, intervention, reputational damage).
      *   The mechanisms: suppressing evidence (attacking "type specimens"/testimony), disputing diagnostic criteria (intent, group definition), leveraging institutional authority (UN veto, diplomatic pressure).
      *   The core dynamic of an authority benefiting from the non-application of an accurate term.
  *   **Ecological Assumption Risk:** The primary risk is **underestimating the role of active malice and the legal stakes**. In ecology, suppression might stem from conservatism, inertia, or resource limitations. In genocide politics, suppression is often an *active weapon* wielded with malice aforethought, directly linked to evading severe legal and moral condemnation. While "nomenclatural capture" describes the *structure* well, it may not fully convey the *intentional malevolence* and *existential stakes* inherent in genocide denial compared to, say, delaying the recognition of a new beetle species.

  **Critical Failure Point & Breakdown Location:**

  *   **Specific Failure:** The analogy would fundamentally break down if confronted by **the irreducible moral claim arising from the lived experience of victims and survivors, demanding not just classification, but justice.**
  *   **Empirical Mismatch:** Taxonomy deals with objects of study. Genocide discourse centers on subjects who are victims, agents, and moral claimants. Treating survivors solely as sources of data (like specimens) ignores their agency and moral standing.
  *   **Conceptual Gap:** Taxonomy lacks the conceptual framework for *moral responsibility, culpability, and restorative justice*. Assigning a label in biology has no equivalent to assigning blame or demanding reparations in human rights.
  *   **Normative Residue:** The core purpose of genocide classification is inextricably bound to *preventing future atrocities* and *delivering justice for past ones* – goals grounded in fundamental human rights and dignity. Taxonomy's goals (understanding, conserving biodiversity) are ultimately instrumental or value-laden in a different way.
  *   **Breakdown Location:** The analogy is most likely to break down **precisely at the point of applying the label and its consequences.** Assigning the classification `Genocidus humanus` isn't just a scientific act; it's a profound *moral and legal judgment* that triggers specific, weighty obligations focused on human subjects. The taxonomic act of assigning `Genus species` carries no comparable moral weight, legal force, or imperative for action directed towards the subjects of the classification itself. The **moral agency of the perpetrators and the moral patienthood of the victims** are the elements the ecological vocabulary cannot capture without severe distortion.
