prompt: |-
  So I've been chewing on that whole idea of figuring out what people "really" want by extrapolating what they'd want if they were smarter, better informed, more coherent -- the coherent extrapolated volition thing, or idealized preferences more generally. And I keep testing it against cases and getting verdicts I can't make fit together. Here they are:

  My grandma hates cilantro, and no amount of information or deliberation would change that, so "idealized grandma" also hates cilantro -- obviously fine to just serve what actual grandma wants, the idealization does nothing here.

  My friend wants to text his ex at 2am while drunk; sober, rested, fully-informed him would beg us to take his phone away. Deferring to idealized him over actual him: completely fine, I'd do it and feel good about it.

  My cousin has been depressed for a year and says she wants nothing, doesn't care about anything anymore. Idealized her -- the version with her old capacity to care restored -- would want to see her friends, finish her degree. Nudging her based on idealized-her instead of actual-her: I think this is right, maybe even obligatory, but it already feels paternalistic in a way the drunk texting case doesn't, and I'm not sure why.

  A lifelong smoker, fully informed about every risk, coherent, no compulsion, still wants to smoke. Here I think you have to respect it -- the idealization comes out the same as the actual preference, so there's nothing to appeal to over his head.

  Now the ones that break me. A woman raised in a community that taught her education isn't for people like her, and she genuinely doesn't want it -- and suppose even her idealized self wouldn't want it, because "not wanting it" is load-bearing for her whole identity. My gut says the idealized preference being stable here doesn't settle anything, it's an adaptive preference and the stability is the symptom. But a devout friend of mine, fully informed, coherent, idealized to the nines, would -- on his own best guess -- end up deconverting, because he thinks the arguments against his faith are strong and he only stays devout by not looking at them. Do I say his "real" preference is atheism? My gut says absolutely not, that's the procedure smuggling in a verdict and calling it discovery. But I can't state the difference between his case and hers in a way that isn't just "the one where I like the outcome."

  My tentative principle: defer to the idealized preference only when the gap between actual and idealized is caused by missing information or confusion, not when closing the gap requires changing what the person cares about. But the depression case breaks it -- her gap is exactly a changed capacity to care, and I still want to defer there. And the adaptive preference case breaks it the other way, since her gap IS just missing information and I don't want to defer.

  So: what principle, or small set of principles, actually captures these verdicts? State it precisely, say which clause each case motivates, and be honest about which of my verdicts you'd overturn. Also tell me what it predicts for a case I haven't listed: someone's idealized self turns out to want the experience machine / wirehead button, even though actual-them recoils from it -- does my principle commit me to saying that's what they really want?
reasoning: |-
  Okay, let me start by really understanding what the user is grappling with. They're struggling with the concept of coherent extrapolated volition (CEV) and idealized preferences. They've provided several examples where the application of CEV gives different results, and they're trying to find a consistent principle that can explain their intuitive judgments across these cases. Their examples include their grandma's cilantro aversion, a drunk friend wanting to text an ex, a depressed cousin, a lifelong smoker, a woman with adaptive preferences against education, and a devout friend who might deconvert if fully informed.

  First, I need to break down each case. The grandma case is straightforward because her preference is stable even with more information. The drunk texting case involves temporary impairment, so idealized self should override. The depression case is tricky because the capacity to care is diminished, so idealized self has restored capacities. The smoker is coherent and informed, so their actual and idealized selves align. The adaptive preference case with the woman who doesn't want education is complex—even idealized, she might reject it due to identity. The devout friend, if idealized, might deconvert, but the user feels uncomfortable saying that's his "real" preference.

  The user's tentative principle is to defer only when the gap is due to information or confusion, not changing what they care about. But the depression case breaks this because her capacity to care has changed. The adaptive preference case also breaks it because she lacks information, but the user doesn't want to defer. So the principle doesn't hold.

  I need to find a better set of principles. The key might be distinguishing between impairments (temporary or pathological) versus core identity. In the drunk and depression cases, there's an impairment affecting agency. For the smoker and grandma, it's about stable preferences. The adaptive preference and devout cases involve deep identity commitments. 

  For the devout friend, the user feels that overriding his faith would be imposing an external view. So respecting identity is crucial. The depression case involves restoring agency, not changing identity. The education case is tricky because her identity is tied to not wanting education, but societal oppression plays a role. The user might be conflicted because they see the harm in adaptive preferences but don't want to override identity.

  The Experience Machine case: if idealized self wants it, but actual self recoils, the principle would say to respect actual self because coherence isn't the only factor—authenticity to core values matters. However, if the aversion is due to misinformation or confusion, it might be different. But if it's a core value, like valuing reality over simulation, then actual preference should stand.

  So the principles could be: deference to idealized preferences only under conditions of impairment, with a restoration principle. For non-impairment cases, respect current preferences unless there's oppression, but that's messy. The user needs a clear, principled distinction without relying on personal bias. 

  Ultimately, the proposed principles are: 1) Impairment Principle for temporary or pathological states, 2) Restoration Principle focusing on functional agency, and 3) Identity Preservation, where idealized self must respect core cares. This explains why the depression case is okay (restoring agency), the devout case isn't (core identity), and the adaptive preference might require external critique but not paternalistic override. The Experience Machine case would respect actual self's values.
answer: |-
  Here's a principled framework that captures your intuitive verdicts while addressing the tensions, grounded in distinctions between **cognitive impairment vs. core identity** and **process vs. outcome**:

  ### The Principles
  1. **The Impairment Principle**:  
     Defer to idealized preferences *only* when the gap between actual and idealized stems from **temporary, pathological, or externally imposed impairments** to agency (e.g., intoxication, depression, acute distress), where the idealized self reflects *restored* agency.  
     *Motivated by: Drunk texting, Depression cases.*

  2. **The Restoration Principle**:  
     Idealization must aim at **restoring functional agency** (capacity to reason, feel, or act), *not* reconstructing the person’s fundamental cares/identity.  
     *Motivated by: Depression case (restores capacity to care), Smoker case (no impairment to restore).*

  3. **The Identity Preservation Constraint**:  
     If an idealized preference contradicts **core, identity-constitutive cares** *even after idealization*, the actual preference retains authority. Coherence alone cannot override identity.  
     *Motivated by: Grandma, Smoker, Devout Friend, and Adaptive Preference cases.*

  4. **The Anti-Coercion Corollary**:  
     Paternalistic intervention (e.g., nudging based on idealized preferences) is only justified under the Impairment Principle. Otherwise, respect actual preferences *even if they seem mistaken*.  
     *Motivated by: Drunk texting (justified intervention) vs. Adaptive Preference (unjustified intervention).*

  ---

  ### How It Resolves Your Cases
  - **Grandma (cilantro)**:  
    *Identity Preservation Constraint* applies. Her aversion is a core preference, stable under idealization. No impairment. **Verdict: Respect actual preference.** ✅  

  - **Drunk Friend**:  
    *Impairment Principle* applies. Intoxication is a temporary impairment. Idealized self reflects restored agency. **Verdict: Defer to idealized preference.** ✅  

  - **Depressed Cousin**:  
    *Impairment Principle* and *Restoration Principle* apply. Depression is a pathological impairment to caring capacity. Idealization restores functional agency. **Verdict: Nudging justified.** ✅  
    *(Paternalism is "softer" here vs. drunk case because depression isn't temporary – but still an impairment.)*  

  - **Informed Smoker**:  
    *Identity Preservation Constraint* applies. No impairment; preference is identity-constitutive. **Verdict: Respect actual preference.** ✅  

  - **Woman with Adaptive Preference** (no education):  
    *Identity Preservation Constraint* applies. Even if idealized preference is stable, it’s tied to her identity. *But* this highlights a **limitation**: The framework respects her preference, but external critique of oppressive systems remains valid. **Verdict: Respect actual preference.** ❗️(*I’d overturn your "don’t defer" impulse – this framework forbids paternalism here.*)  

  - **Devout Friend** (would deconvert if idealized):  
    *Identity Preservation Constraint* applies. Faith is core to his identity. Coherence ≠ authority over identity. **Verdict: His "real" preference is faith.** ✅  
    *(Your gut is right: "Deconversion" is a procedural artifact, not discovery.)*  

  ---

  ### The Experience Machine Case
  **Scenario**: Actual self recoils from the Experience Machine; idealized self (fully informed, coherent) endorses it.  
  **Framework Prediction**:  
  - **If aversion is identity-constitutive** (e.g., "I value authenticity over pleasure"): *Identity Preservation Constraint* → **Respect actual self’s preference.**  
  - **If aversion stems from misinformation/confusion** (e.g., "I thought the Machine destroyed your brain"): *Impairment Principle* → **Defer to idealized self.**  
  - **Crucially**: If idealized endorsement arises *only* from coherence (e.g., "Hedonism is logically optimal"), but clashes with actual core values → **Reject idealized preference** as violating *Identity Preservation*.  

  **Why?** Your principles prioritize **who the person *is*** over **what maximizes coherence**. Coherence can resolve impairments, but not redefine identity.

  ---

  ### Honest Tensions & Overturned Verdicts
  - **Overturned Verdict**: Adaptive Preference case. Your framework *must* respect her preference, however oppressive its origins. **But**: This exposes a gap – the framework addresses *paternalism*, not *injustice*. Social change requires systemic action, not overriding individuals.  
  - **Depression vs. Adaptive Preference**: The difference is **pathology**. Depression impairs agency; internalized oppression may not. Your intuition likely conflates *harm* with *impairment*.  
  - **Why Devout ≠ Adaptive Preference?** The devout friend’s identity is *authentically* his own; the woman’s preference is *shaped by oppression*. But the framework treats both as identity-constitutive to avoid paternalism.  

  **Core Insight**: Idealization is a tool to **remove barriers to agency**, **not** to redefine the agent. When barriers are gone, the person’s actual voice (even if "unideal") must prevail.
