prompt: |-
  You're a professional philosopher who's spent enough time around machine learning safety people to be fluent in the way they talk. Take your time with this one — I'd much rather have something careful and slightly awkward than something slick. Before you commit to an answer, spend a few paragraphs just brainstorming: list the analogies you reach for, the ones you throw out, and why. I want to see the rejected options too, not just the polished final version.

  Some context so you know where I'm coming from. I'm retired now — ran a medical mircobiology lab for about twenty-five years and sat on the university biosafety committee for most of that — and I've lately been going to a philosophy reading group, which is where this came up. We got onto AI control: the family of safety measures you'd design on the assumption that the model may be misaligned and may be actively trying to work around your measures, as opposed to alignment proper, where you're hoping it isn't. One of the group, who's read more than the rest of us, said this is definately just like high-containment biology. You assume the organism is dangerous, you build your barriers in layers, you never rely on the thing's good behaviour, and you still get useful work out of it. He used it to conclude that control is a tractable and fairly well-understood engineering problem, that we can keep getting useful work out of a system we don't trust more or less indefinitely, and that therefore we don't need to solve alignment before we deploy.

  I don't buy it, but I can't say exactly where it goes wrong, and I don't fully trust my own instincts here, because I'm the person in the room who keeps wanting to say "but a bacterium doesn't read your standard operating procedure."

  Here's the concrete setup we were arguing about, so you've got something specific to audit rather than a cloud of vibes. Call it the paraphrase-and-audit stack:

  - The deployment uses a powerful model that nobody trusts. It might be cooperative, or it might be waiting for a moment when defecting is cheap; the whole point is that you're not supposed to assume either way.
  - The untrusted model's job is to write code patches for a large codebase.
  - Before anything runs, a much weaker but trusted model reads each patch and rewrites it in its own words; only the rewritten version ships. The idea is that rewriting strips out anything hidden — a subtle backdoor, or a message encoded in the style or ordering of the code that only another copy of the untrusted model would pick up.
  - On top of that there are automated tripwires: cheap tests that fire when an output looks like it belongs to the sort of thing a scheming model would produce.
  - About one patch in twenty gets a full human review, chosen at random, and the humans know the rate but not which ones are coming.
  - If a tripwire fires or an audit finds something, the system shuts down, the weights are frozen, and the incident is logged.

  So: audit the analogy. I want the correspondence table first — what plays the role of the organism, the physical barrier, the leak, the decontamination step, the regulator with an enforceable standard, the experiment you're trying to run, and the thing you take out of the box. Then the places the mapping breaks. And this is the part I actually care about: which of those breaks matter for the conclusion he drew, and which are just incidental mismatches that would show up in any analogy whatsoever. What does the lab picture quietly import into the AI case that isn't there? Is there a weaker version of his conclusion that does survive once the disanalogies are on the table? And if the lab analogy is carrying more weight than it can hold, give me a better one — or tell me straight that nothing in my working life is a useful guide here and say what the relevant difference is.

  Three hunches of my own, for you to check rather than humour me about:

  1. In my lab the precaution was cheap — gloves and a cabinet don't stop you doing the experiment — and I suspect the equivalent cost in the AI case is not cheap at all, because what you're restricting is the same stuff you're trying to get out of the box.
  2. Our layers worked partly because we could treat failures as roughly independent, so the odds of all of them failing together were tiny. A single adversary that can reason about the whole stack doesn't fail independently across layers.
  3. We could tell when containment had failed. You culture the bug, you see the plaque, you know. I'm not convinced you can tell in the AI case, which I think makes "assume the worst" a different kind of posture there than it was for us.

  If any of those are wrong, or half-right, tell me which and what's really doing the work instead. Where you think the stack above has a genuine weakest link, name it and say why it's weak in a way the analogy would have hidden from me.

  Finish with a one-sentence verdict I can read out at the group, and don't give me citations or a reading list — we haven't got library access out here, and it's the arguments I want, not who said it first. Plain prose and tables, and no jargon I'd have to go and look up.
