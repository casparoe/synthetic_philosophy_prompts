  For (c) on karoshi persistence - Japan's work culture blends Confucianism with imported capitalism, making monocausal claims risky. Yet the "service overtime" phenomenon does reflect deep normative acceptance. 0.65 accounts for other factors.

  Regarding (d) about fragility causes - here's the rub: neoliberal policy actively dismantled labor protections independent of cultural norms. But the user's colleague's suffering shows how norms enable such erosion. 0.6 reflects this tension.

  The overall credence lands at 0.7 - the thesis holds but isn't exhaustive. I'm least sure about (d); concrete comparative studies of union strength vs. cultural attitudes would sway me. The user's experience reveals what raw data cannot: how philosophical voids become lived trauma. Their anger gives the question moral urgency beyond academic exercise.
answer: |-
  Here is my credence decomposition for your claim, with reasoning structured as requested:

  **Overall credence in full claim: 0.71**  
  *(Reflecting moderate-high confidence in the core thesis but significant hedging due to multifactorial causality)*

  ---

  ### (a) Weber's formulation lacks internal resources for intrinsic leisure-right  
  **Credence: 0.85**  
  *Justification:* Weber explicitly frames leisure as either recuperative (for work-capacity renewal) or morally suspect idleness; no positive theological space exists for leisure as an end or right within Calvinist-derived premises.

  ### (b) 35-hour week represents normative rupture  
  **Credence: 0.70**  
  *Justification:* French labor reductions emerged from socialist/Marxist critiques of exploitation, not Protestant ethic’s productivity logic; they prioritize worker dignity over output, constituting a distinct normative foundation.

  ### (c) Karoshi persistence better explained by absent leisure-right  
  **Credence: 0.65**  
  *Justification:* While economic pressures matter, Japan’s normalization of "service overtime" (unpaid, status-driven) reflects internalized work-ethic values that institutional enforcement alone cannot dissolve.

  ### (d) Normative gap causes fragility more than political economy  
  **Credence: 0.60**  
  *Justification:* Though neoliberal policy actively erodes protections, the *cultural acquiescence* to such erosion—e.g., framing leisure as "unaffordable luxury"—stems from work-ethic residue weakening collective resistance.

  ---

  ### Weakest term: (d)  
  **Why least confident:** Political-economic forces (financialization, global competition, shareholder primacy) demonstrably drive work intensification *independently* of cultural norms. For example:  
  - Amazon’s warehouse productivity algorithms would likely exist irrespective of Protestant ethic cultural legacy.  
  - Scandinavian robust leisure protections coexist with strong capitalism, suggesting institutions can override cultural predispositions.  

  **Evidence that would move my credence:**  
  - Historical analysis showing societies *without* Protestant ethic heritage (e.g., Greece, Thailand) developing *stronger* cultural resistance to work-hour erosion under similar economic pressures.  
  - Data demonstrating that countries with explicit philosophical/religious leisure traditions (e.g., Catholic "Sunday rest" cultures) exhibit materially stronger defense of labor protections than those shaped primarily by Protestant ethic.  

  ### Key Insight on Fragility  
  The normative gap creates a *vulnerability condition*: when economic pressures mount, societies lacking internalized leisure-as-right narratives sacrifice protections first. But it is not the sole actor; exogenous shocks (recessions, tech disruptions) can override even strong cultural foundations. Your colleague’s tragedy manifests this interplay—a system exploiting normative void *through* economic coercion.
