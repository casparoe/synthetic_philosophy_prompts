  First, I need to understand the core challenge here. The sister admitted she praised an artwork for career reasons rather than genuine appreciation, which raises the philosophical question of why some reasons "count" in aesthetic judgment while others don't. The user wants a single-session plan that helps her audit her own evaluations.

  Hmm... the key is to make abstract philosophy tangible through art-world examples she lives in. I should start with her concrete experience - her confession about praising for career gain. That's the perfect hook. But I must avoid jargon like "pro-attitude" initially. Instead, I'll build the concept from the ground up using her lived experience.

  The architecture needs careful sequencing: 
  First, distinguish between what motivates us versus what actually justifies an aesthetic judgment. Her career gain reason is a clear example of something that motivates but doesn't justify. 

  Then I should introduce a more ambiguous case - maybe loyalty to a mentor - to show it's not just about selfishness. The example must include both types of wrong-kind reasons and exclude anything that might make her think it's solely about hypocrisy or dishonesty.

  Common misconceptions to address: 
  - That admitting your motives solves the problem (it doesn't - the judgment itself remains unfitting)
  - That any reason explaining why you formed a judgment automatically justifies it (crucial distinction!)
  - That this is just about being hypocritical (it's deeper - about what makes praise appropriate)

  For the check of understanding, I'll create a new scenario - perhaps praising a friend's mediocre work out of compassion - and ask her to identify why compassion might be a wrong-kind reason here. No philosophy slogans, just real classification.

  Boundaries are vital: no tangents about belief formation, value realism debates, or institutional rationality. Pure aesthetic judgment focus. Dinner-friendly length too - one bite per course!

  The payoff is practical: she should walk away able to spot when her own praise or criticism stems from non-aesthetic reasons, whether obvious (career) or subtle (loyalty). Not to eliminate such reasons - that's impossible - but to recognize when they're distorting her artistic compass.
answer: |-
  Here’s a focused teaching plan for a single dinner conversation, structured to build understanding incrementally while preempting common pitfalls. The goal is **practical self-auditing**, not theoretical mastery.

  **Core Objective:**  
  She can distinguish *why* career gain/loyalty are "wrong-kind reasons" (WKRs) for aesthetic praise, while artistic merit is the "right-kind reason" (RKR), and apply this to her own judgments.

  **Key Boundary:**  
  *Exclude*: Belief examples (e.g., believing for money), value realism debates, institutional theory.  
  *Include only*: Aesthetic attitudes (praise/criticism) and their reasons.

  ---

  ### Teaching Sequence (≈ 45-60 mins, woven into dinner)

  #### **1. Anchor in Her Confession (5 mins)**  
  *   **Recap her story:** "You praised the installation partly to impress the gallery owner. But you also hinted you might not *truly* admire it that much. Philosophers ask: *Which parts of your motivation actually make the praise deserved?*"  
  *   **Goal:** Establish the problem using her lived experience. No jargon yet.

  #### **2. Contrast: Motive vs. Justification (10 mins)**  
  *   **Introduce two questions:**  
      (A) *What made you* ***say*** *it?* (e.g., career hopes, kindness, social pressure).  
      (B) *What would make the praise* ***accurate or fitting***? (e.g., "Was the installation genuinely innovative/beautiful/powerful?")  
  *   **Stress:** Both (A) and (B) are "reasons," but they do *different jobs*. (A) explains your *behavior*; (B) determines if your *attitude* (praise) matches reality.  
  *   **Preempt misconception:** "This isn’t about hypocrisy. Even if you admit your motives, question (B) remains: *Was your praise fitting?*"

  #### **3. The Carrying Example: "The Titanium Vortex" (15 mins)**  
  *   **Scenario:** A respected senior artist (her mentor) creates "The Titanium Vortex" – a large, expensive, but conceptually shallow sculpture.  
  *   **Reasons to praise it:**  
      - **RKR (Fitting):** "Its surface reflects light in breathtaking ways" (aesthetic merit).  
      - **Obvious WKR:** "Praising it might get me included in her next group show" (career incentive).  
      - **Subtle WKR:** "She’s my mentor; criticizing her feels disloyal" (relational loyalty).  
  *   **Crucial Exclusions:**  
      - *Avoid* calling WKRs "selfish" (loyalty isn’t selfish).  
      - *Avoid* suggesting she *shouldn’t* have these motives. Focus on what makes praise **fitting**.  
  *   **Key Insight:** Loyalty/career gains are great reasons *to speak* or *act* (e.g., attending the show). But they don’t answer: *Does the sculpture deserve praise?* Only its aesthetic features do.

  #### **4. Introduce "Fittingness" & Attitude (10 mins)**  
  *   **Define (without jargon):** Praise is "fitting" when it *matches* the thing’s actual artistic value. Like laughter fitting a funny joke.  
  *   **Now introduce "pro-attitude":** "Praise is a *stance* we take toward something – saying ‘this is good.’ Fittingness asks: *Does the object actually make that stance appropriate?*"  
  *   **Link to WKR:** Career gain/loyalty make *taking the stance* useful/safe. They don’t affect whether the object *warrants* that stance.  
  *   **Preempt misconception:** "This isn’t about ‘explanatory reasons.’ Knowing *why* you praised doesn’t tell us if the praise was *justified by the art*."

  #### **5. Check for Understanding: "The Melancholy Diorama" (5 mins)**  
  *   **Novel Case:** A close friend spends years on a technically flawed, sentimental diorama. You feel compelled to call it "profound."  
  *   **Ask her:** *"Which reason is a WKR for your praise, and why?"*  
      - (a) "Its use of shadow creates genuine emotional depth"  
      - (b) "I love my friend and don’t want to crush her"  
  *   **Target Response:** (b) is a WKR. It explains why you *voice* praise but doesn’t make the diorama *deserve* "profound" (unless the depth exists).  
  *   **Correct if needed:** If she picks (a), clarify: *Could this be RKR? Only if the shadows actually create depth.*

  #### **6. Audit Prompt & Conclusion (5 mins)**  
  *   **Practical Tool:** "When you judge art, ask: *‘Is my reason about the artwork’s qualities, or about its consequences/context for me/others?’* Only the first kind makes praise fitting."  
  *   **Reinforce:** WKRs aren’t "bad" – they’re normal! But conflating them with RKRs distorts your judgment.  
  *   **Boundary Reminder:** "We’re *only* talking about what makes praise/criticism fitting for art – not truth, morality, or ‘rationality’ in other domains."

  ---

  ### Why This Architecture Works
  - **Concrete Before Abstract:** Starts with her story, delays "pro-attitude" until fittingness is intuitive.  
  - **WKR Nuance:** The carrying example separates selfishness (career) from non-selfish WKRs (loyalty).  
  - **Preempts Pitfalls:** Addresses "honesty dissolves it" (Step 2), "explanatory=justifying" (Step 4), "hypocrisy focus" (Step 2).  
  - **Active Application:** The check requires classifying a new case, not parroting definitions.  
  - **Art-World Authentic:** Uses incentives/pressures she recognizes (galleries, mentors, peers).  

  **Dinner Delivery Tip:** Use napkin sketches (e.g., draw "Titanium Vortex" with arrows: "Light reflections → Fitting Praise" vs. "Gallery Owner → Motive to Praise"). Keep it conversational – her examples are better than yours!
