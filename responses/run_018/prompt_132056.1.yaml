answer: |-
  Here's a unified principle capturing your intuitions and resolving the tension between 3 & 4:

  **Reference is fixed by the dominant causal source anchoring the term within the relevant linguistic community's practice.**

  1.  **Cases Explained:**  
      *   **Twin Earth/Polymer Planet/Roommate:** The dominant causal source is the local substance interacting with users (`H2O`, `polymer`, `seltzer`), even if mistaken about properties (Roommate).
      *   **Dead Expert:** The dominant causal source anchoring "elm" is the expert taxonomy (Linnaeus), despite the local misapplication (`beech` samples). Deference points back to the anchoring source.
      *   **Isolated Town:** No external anchoring source exists. The dominant causal source *is* the local samples (`pine`), establishing a new kind.
      *   **Lone Inventor:** Indeterminacy arises. There's *no community* to establish a dominant source. "Flurg" could refer to his private intention (`gold`) *or* the actual sample (`pyrite`). Externalism often requires a community.

  2.  **AI Prediction:**  
      An AI using "water" based solely on text inherits its reference *through the causal chain from human language*. The dominant causal source anchoring "water" in that chain is `H₂O`. Therefore, the AI refers to `H₂O`, not whatever it might "think" water is or a hypothetical substance. Its reference is parasitic on the human linguistic practice grounded in `H₂O`.

  This principle prioritizes the *public, grounding causal history* of the term over individual conceptions or local samples *unless* no external anchor exists.
