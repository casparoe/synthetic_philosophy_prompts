prompt: |-
  Hey, hoping you can help me settle an argument before Thursday, because I've got a glyph to submit and I'm not sure it's going to survive contact with my tutor.

  I do a weekend lettering/type workshop — hobby thing, most of us are amateurs, one guy is a retired signwriter — and our tutor Mira spends most of each session going round the room pronouncing on whether the thing you've drawn "is an a" or not. She's been annoyingly consistent and nobody can work out what her actual rule is. I got into this whole question thru that old Letter Spirit project, the one where the idea is to have a program invent every letter of an alphabet in a consistent style by sticking strokes on a coarse grid — at least that's how I remember it — and the thing that got me hooked is exactly her problem: what is it that all the a's have in common. Her verdicts so far: a double-storey Garamond a, yes (obviously); a Futura single-storey one, yes; a blackletter/Fraktur a, yes, and she was faintly surprised we even asked; a five-year-old's shaky handwritten a whose bowl doesn't close, yes; a stencil a with the counter bridged so it's not an enclosed shape, yes; an a with the bowl filled in solid so it's just a blob with a stem, yes but "a bad a, still an a"; a turned a (the upside-down one that's its own IPA symbol), no; a Greek alpha, no; a Cyrillic а drawn identically to the Latin one in the same font, no, "same shape, different letter"; the @ sign, no, "there's an a inside it, the sign isn't an a"; the æ ligature, no; the a from a face where the entire alphabet has been rotated ninety degrees, yes, "obviously, the whole alphabet's on its side"; and a blob out of some generative net that an image classifier labels 'a' with 99% confidence but that no human reads as anything, no. She also keeps saying things that point in opposite directions — "it's a job in an alphabet, not a shape" one week, and then "no no, the letter has a spirit, you can't just shove any old thing into the slot" the next — which is what started the shouting at the pub.

  Here's my problem. The face I'm working on is a display thing where I've deliberately pushed all the differentiation onto the rest of the alphabet: my lowercase a is a plain circle, and I've rebuilt o as a hexagon, e as a circle with a bar, and so on, so that nothing else in the system is a plain circle. In running text it's completely unambiguous, I tested it on a few people and they read it first time; taken out of the alphabet and looked at on its own, my a is literally just a circle, with nothing a-ish about it whatsoever. I think there are at least three rules that fit everything Mira has said so far — something like "an a is whatever occupies the a-slot in a working alphabet, i.e. it's defined by its contrasts", something like "an a has to carry its own a-ness, a bowl-and-stem sort of vibe that survives being looked at in isolation", and something like "it's an a if competent readers read it as one" — and I want to know which of them my circle splits, what you'd guess she says and why, and what each rule is really committed to (does the reader rule care about context or about isolated presentation, does the slot rule care whether the alphabet is one anyone actually uses, does the spirit rule have anything to say about why the Fraktur a passes). Most of all: I suspect all three rules survive my circle one way or another, so what single test glyph should I bring along next week that would force them apart — and if you think her verdicts don't determine an answer at all, say so and tell me what she'd be committing herself to either way.
reasoning: |-
  Okay, the user is in a lettering workshop and has a tutor, Mira, who has very specific but seemingly inconsistent rules for what constitutes an "a" in typography. The user has created a typeface where the lowercase 'a' is just a plain circle, and they need to predict how Mira will judge it. They also want to design a test glyph to clarify Mira's underlying rule. 

  First, I need to unpack Mira's past verdicts. She accepts a wide range of 'a's: double-storey, single-storey, blackletter, imperfect handwritten, stencil, and even a blob-shaped 'a'—but rejects rotated Greek alpha, identical Cyrillic а, @, æ, and unreadable generative blobs. Her comments about "job in an alphabet" vs. "letter spirit" suggest tension between functional role and intrinsic form. 

  The user proposes three possible rules: 
  1. Slot Rule (defined by contrast within an alphabet) 
  2. Spirit Rule (intrinsic visual essence like bowl/stem) 
  3. Reader Rule (competent recognition). 

  For the circle 'a': 
  - Slot Rule would accept it since it contrasts with hexagonal 'o', etc. 
  - Spirit Rule would reject it—a circle lacks 'a-ness'. 
  - Reader Rule is ambiguous; it works in context but fails in isolation. 

  Mira's rejection of the Cyrillic а (same shape, different letter) suggests she prioritizes systemic role over form, leaning toward Slot Rule. But her "spirit" comment and acceptance of the rotated alphabet (where forms retain intrinsic structure) complicate this. 

  The test glyph should force contradictions: 
  1. An 'a' with correct contrasts but wrong shape (e.g., square in a circular-alphabet) might expose if Slot Rule overrides form. 
  2. A non-'a' shape that readers recognize as 'a' (e.g., a circle in a non-systematic test) could challenge Reader Rule. 
  3. A deformed 'a' with bowl/stem spirit but functional failure might test Spirit vs. Slot. 

  Mira's likely verdict on the circle 'a': Reject. Despite functional success, her "spirit" insistence and rejection of the Cyrillic а imply she demands intrinsic 'a-ness'—which a circle lacks. The test glyph should be a square 'a' in a circular-alphabet system; if she accepts it, Slot Rule prevails; if not, Spirit/Reader rules dominate. 

  Key nuance: Mira’s "spirit" likely means historical trace—minimal visual anchors (e.g., stem attachment in the filled-blob 'a')—not just abstract contrast. The circle has no such anchors.
answer: |-
  Based on Mira's verdicts and contradictions, here's a breakdown of the rules at play, how your circle 'a' challenges them, predictions for her reaction, and a decisive test glyph:

  ### The Three Rules & Your Circle 'a'
  1.  **Slot Rule (Functional Contrast):**
      *   *Definition:* A glyph is an 'a' if it occupies the 'a' slot in a *functioning, distinctive alphabet system*, contrasting appropriately with other glyphs (especially 'o', 'e', 'd').
      *   *Fits Mira's Verdicts:* Explains why the rotated 'a' (in a rotated system) is accepted, while the identical Cyrillic 'а' (in a different system) is rejected. Explains why the filled-blob 'a' (if it contrasts in its system) is a "bad a" but still an 'a'. Explains why the generative blob isn't an 'a' (it lacks a system).
      *   *Your Circle 'a':* **Passes.** It occupies the 'a' slot in your designed system, contrasting with the hexagonal 'o', barred 'e', etc., and functions unambiguously in text.
      *   *Commitments:* Requires a *coherent, functional system*. It doesn't care about historical precedent or isolated appearance, only systemic role and contrast.

  2.  **Spirit Rule (Intrinsic Form / Historical Trace):**
      *   *Definition:* A glyph is an 'a' if it retains core *intrinsic visual features* traceable to the historical development of the letter 'a', regardless of system – typically implying a closed or semi-closed bowl, a vertical stem (or strong vertical emphasis), and the specific relationship between them (e.g., stem attached to the bowl's right side).
      *   *Fits Mira's Verdicts:* Explains acceptance of double/single-storey, blackletter, shaky, stencil (retains bowl/stem relationship), and filled-blob (still implies bowl/stem) 'a's. Explains rejection of turned 'a' (wrong stem/bowl relationship), Greek alpha (different historical form), Cyrillic 'а' (different historical origin despite shape), @ (shape isn't primary), æ (composite), and generative blob (no trace).
      *   *Your Circle 'a':* **Fails.** A plain circle lacks the defining bowl-stem relationship and vertical emphasis intrinsic to the 'a' form throughout its evolution. It has no "a-ness" in isolation.
      *   *Commitments:* Requires recognisable vestiges of the Latin minuscule 'a' form. It cares deeply about the glyph's *inherent* structure, independent of its current context. Fraktur 'a' passes because its wild distortion still maintains the core bowl-stem dynamic.

  3.  **Reader Rule (Successful Recognition):**
      *   *Definition:* A glyph is an 'a' if *competent readers reliably recognise it as such* within its intended context.
      *   *Fits Mira's Verdicts:* Explains acceptance of functional glyphs (Garamond, Futura, shaky, stencil, rotated system) and rejection of non-functional ones (generative blob). Explains the "bad a" comment (it works, but poorly).
      *   *Your Circle 'a':* **Ambiguous.** It passes *in context* (your running text test) but fails *in isolation*. Mira's rejection of the Cyrillic 'а' *drawn identically* to a Latin 'a' suggests she prioritizes systemic/learned recognition over pure shape recognition. Recognition relies on context and expectation.
      *   *Commitments:* Depends entirely on demonstrable human interpretation *in the intended usage context*. It cares less about intrinsic form or system coherence if recognition works. Requires testing *by competent readers within the system*.

  ### Mira's Likely Verdict on Your Circle 'a': REJECTED
  *   **Why:** Her "spirit" comment and the **Cyrillic 'а' rejection** are the strongest evidence against the pure Slot Rule for your case. She explicitly separated "same shape, different letter," proving the shape alone isn't sufficient. Her acceptance of the filled-blob 'a' ("bad a, still an a") shows she tolerates extreme distortion *if the core bowl-stem spirit remains*. A plain circle has no stem, no bowl attachment point – it lacks the essential "a-ness" she demands intrinsically.
  *   **Contradiction Addressed:** Her "job in an alphabet" comment likely refers to the *necessity* of belonging to a system (rejecting isolated blobs), but her "spirit" comment and Cyrillic verdict show that within a system, the glyph must *also* carry the intrinsic historical baggage of the letter it's supposed to be. Your circle fails the spirit test.

  ### The Decisive Test Glyph: The Square "a"
  *   **Design:** Create an alphabet where the lowercase 'a' is a **plain square**. Rebuild the other letters distinctively:
      *   'o' = Circle
      *   'e' = Circle with a horizontal bar cutting off the top third.
      *   'd' = Square with a tall vertical stem ascending from its top-right corner.
      *   'c' = Square missing its right side.
      *   Ensure all other letters are clearly distinct in this squared-off system.
  *   **Test in Context:** Show a short word like "cat" or "and" set in this alphabet. Competent readers familiar with the Latin alphabet *should* be able to learn and read it unambiguously after minimal exposure.
  *   **Why This Splits the Rules:**
      1.  **Slot Rule:** **Accepts.** The square occupies the 'a' slot in a coherent, functional system, contrasting perfectly with a circular 'o', a modified-circle 'e', etc. It fulfills the job.
      2.  **Spirit Rule:** **Rejects.** A square has zero visual connection to the historical bowl-and-stem form of 'a'. It lacks curves, lacks a distinct bowl, lacks the characteristic stem attachment. It has no "a-ness".
      3.  **Reader Rule:** **Conditionally Accepts.** Competent readers *can* learn to read it reliably *within the system/context* (like your circle). However, in isolation, it looks nothing like an 'a'. This rule cares *only* if it works in use.
  *   **Predicting Mira's Verdict:** **REJECTED.** Based on her rejection of the Cyrillic 'а' (same shape, different letter) and her emphasis on "spirit," she will likely say the square is not an 'a'. It might be "the square letter" or "the first letter," but it lacks the intrinsic form. Her comment would likely be something like: "It *works* as a placeholder, but it doesn't *carry the a-ness*. It's just a square forced into the role." This verdict prioritizes the Spirit Rule, supported by the functional aspect of the Slot Rule requiring *some* intrinsic connection.

  ### What Her Verdict on the Square Commits Her To
  *   **If she rejects the Square 'a':** She firmly prioritizes the **Spirit Rule** (Intrinsic Form/Historical Trace). A glyph *must* carry recognizable vestiges of the traditional 'a' form, regardless of its systemic function or learnability. The Slot Rule is necessary (must belong to a system) but not sufficient (must also have the spirit).
  *   **If she accepts the Square 'a':** She prioritizes the **Slot Rule** (Functional Contrast) almost exclusively. Systemic role and contrast override any requirement for historical intrinsic form. The "spirit" comment becomes more about systemic coherence and recognizability *within the learned system* rather than intrinsic form.

  ### Conclusion
  Bring the **Square "a"** as your test glyph. It's the cleanest way to force the contradiction between Mira's acceptance of systemic function (Slot Rule) and her apparent requirement for intrinsic form (Spirit Rule), highlighted by her rejection of the identical Cyrillic 'а'. Based on her pattern, especially that Cyrillic rejection, **predict her to reject both your Circle 'a' and the Square 'a'**, confirming that her core rule is the **Spirit Rule**: an 'a' must intrinsically *look like* an 'a' (carrying the historical bowl-stem relationship) *and* occupy the 'a' slot in a functional system. Good luck with Mira!
