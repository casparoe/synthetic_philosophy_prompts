  ok so ive been trying to wrap my head around rawls' seperateness of persons objection and i think i mostly get it—utilitarianism treats society like one big person distributing goods across its own life stages, which is wrong because people are actually seperate centers of consciousness. but then i started wondering: if the core problem is that there's no super-subject who feels both the suffering and the relief, then why is it okay to make tradeoffs across time for a single person? like i suffer now for my future self's benefit and nobody calls that immoral aggregation. so is rawls secretly relying on a non-reductionist view of personal identity over time? and does this objection hit average utilitarianism too, or does averaging fix it by treating each person as an indivisible unit? i feel like parfit's reductionism should dissolve the separateness worry but nobody in the ethics literature actually connects those dots. also is there a version of this that applies to prioritarianism, or is prioritarianism immune because it weights the worst-off without aggregating?
