answer: |-
  You've hit on a profoundly deep tension in moral philosophy! Let's unpack this systematically:

  **1. Rawls' Separateness of Persons vs. Intrapersonal Trade-offs:**
  - Your intuition is sharp: **Rawls *does* implicitly rely on a non-reductionist (or "enduring self") view of personal identity.** The moral permissibility of sacrificing for your *own* future relies on the assumption that "future you" is *numerically identical* to "present you" in a morally significant way. Suffering now for future benefit is rational because *you* experience both the cost and the benefit.
  - Rawls' objection is that utilitarianism illegitimately extends this intrapersonal rationality to the *inter*personal case. For Rawls, the fact that "Person A suffers so Person B benefits" is fundamentally different because A and B are distinct "ends in themselves" (Kantian influence). There is no overarching "self" experiencing the net gain.

  **2. Parfitian Reductionism & Its Challenge:**
  - You're absolutely right that **Parfit's reductionism (*Reasons and Persons*) destabilizes this distinction.** If personal identity over time is just a matter of degrees of psychological connectedness (memories, intentions, character) and continuity, then:
      - The "separateness" of persons might be less metaphysically sharp.
      - The difference between intrapersonal and interpersonal trade-offs becomes one of *degree* (strength of psychological connections), not kind.
  - **Why isn't this connection made more often?**
      - **Rawls' Focus:** Rawls is primarily concerned with *justifying the basic structure of society* to free and equal moral persons. He argues persons *see themselves* as distinct beings with separate lives and plans. Metaphysical reductionism isn't necessary for this "political" conception.
      - **Moral Significance vs. Metaphysics:** Even if persons *are* reducible to psychological connections (Parfit), many argue that the *first-personal perspective* and the *distinctness of experiential streams* remain morally paramount. Hurting *this* conscious subject to benefit *that* one (even if psychologically connected) still seems wrong in a way that a present sacrifice for a tightly connected future self does not.
      - **Practical Deliberation:** Society must treat individuals as distinct legal and moral agents, regardless of metaphysical debates about identity. Reductionism doesn't dissolve the need for principles governing interactions *between* centers of consciousness.

  **3. Average Utilitarianism:**
  - **Does averaging "fix" the separateness objection?** **No, not fundamentally.**
      - **Problem 1 (Aggregation):** It still aggregates utilities *across persons* to calculate the average. The suffering of one person *can* still be outweighed by sufficient gains to others. Rawls' core objection is to this interpersonal aggregation for the sake of a total/average.
      - **Problem 2 (The "Mere Means" Issue):** An individual could still be sacrificed if doing so raises the average (e.g., killing a very unhappy person in a generally happy society). This treats them as a means to the statistical end of a higher average.
      - **Problem 3 (Ignoring Distribution):** Like Total Utilitarianism, it ignores *how* utility is distributed *between* distinct persons. Rawls' difference principle prioritizes the worst-off, rejecting aggregation that ignores their separateness.

  **4. Prioritarianism:**
  - **Is Prioritarianism immune?** **Largely, yes, but not without potential tensions.**
      - **The Core Defense:** Prioritarians (e.g., Parfit) *explicitly reject* interpersonal aggregation as morally decisive. Giving priority to the worse-off is based on the *separate moral weight* assigned to benefits/harms *at different levels of well-being*, not on summing gains/losses across persons. A small gain for someone very badly off morally outweighs a larger gain for someone well-off, *even if the total utility sum/average would be larger the other way*. This respects separateness by focusing on the *individual's position*.
      - **Potential Tension (The "Why Weight?" Question):** A critic influenced by separateness might ask: *Why* is it justified to weight the claims of individuals differently based on their absolute level of well-being? Doesn't this still involve comparing and weighing the interests of *different* persons within a single moral calculus? However, this is seen as a *distributive* principle applied *across* separate persons, not an *aggregative* one that dissolves their separateness.
      - **Avoids the Sacrifice Problem:** It generally avoids justifying significant sacrifices of the worse-off for the sake of the better-off, which is Rawls' primary concern with utilitarianism.

  **Synthesis & Conclusion:**

  1.  **Rawls & Identity:** You correctly identified that Rawls' objection relies on an enduring-self view of personal identity over time to ground the intuition that intrapersonal trade-offs are permissible while interpersonal ones are problematic. Parfit's reductionism challenges this metaphysical foundation.
  2.  **Why Intrapersonal is Different (Even for Reductionists):** Even if identity is reducible, the *strength of psychological connections* within a single life (compared to between lives) and the *unitary locus of experience* at any given moment provide *pragmatic and experiential* reasons to treat intrapersonal trade-offs differently. Society is constituted by *multiple* such loci.
  3.  **Average Utilitarianism Fails:** It changes the metric (average vs. total) but still aggregates across persons and ignores distributive justice between distinct individuals.
  4.  **Prioritarianism Succeeds (Mostly):** By rejecting aggregation as the primary moral rule and instead applying a weighting function *to the claims of each separate individual* based on their absolute welfare level, it respects the separateness of persons in a way aggregation-based utilitarianism does not. The "separateness" objection primarily targets *aggregation*, not *all* forms of interpersonal comparison or weighting.

  **The connection to Parfit *is* under-discussed in mainstream Rawlsian interpretations.** Your insight highlights how metaphysics of identity deeply underpins debates about distributive justice. While Rawls aimed for a "political not metaphysical" theory, his critique of utilitarianism leans heavily on a conception of the person that reductionism complicates. Prioritarianism emerges as a strong contender precisely because it navigates this tension by abandoning aggregation while still addressing distributive concerns *across* separate individuals.
