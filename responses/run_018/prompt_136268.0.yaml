answer: |-
  Here’s a structured analysis for your research planning, prioritizing leverage in democratic boundary problems:

  ### 1. **The Inclusion/Standing Split (Core Distinction)**  
  This split reframes the debate by exposing a critical gap: **Inclusion** (formal membership) ≠ **Standing** (actual influence). Most theories (e.g., "all affected" or "all subjected") focus on *who enters the demos* but ignore *how power operates within it*. For instance, colonial subjects were often "included" in imperial democracies but denied standing. Similarly, future generations might be symbolically included yet lack procedural levers to protect their interests. Separating these reveals that:  
  - **"All affected"** primarily addresses *inclusion* (impact as entry-ticket).  
  - **"All subjected"** better addresses *standing* (coercion demands accountability).  
  Ignoring this conflates *access* with *agency*, letting institutions claim legitimacy via inclusion while evading power-sharing. Institutional design must tackle both: *thresholds for entry* and *mechanisms for voice amplification*.  

  ---

  ### 2. **Ranked Research Priorities**  
  **(Leverage: Institutional redesign > Theoretical refinement)**  

  1. **Functional Boundaries (Non-Human & Non-Agent Entities)**  
     **Why upstream?** AI, ecosystems, and animals are already governed by democratic decisions but lack representation. Solving "how to institutionalize standing for non-persons" forces innovation in interest representation (e.g., guardians, algorithmic proxies, ecological courts). This directly reshapes institutions *now* (e.g., AI oversight boards, rights of nature laws). Until we resolve *how* non-agents gain standing, temporal boundaries remain abstract.  

  2. **Temporal Boundaries (Future Generations)**  
     **Why second?** Future inclusion is widely accepted, but standing mechanisms (e.g., ombudspersons, fiduciary trusts) depend on *functional boundary solutions*. Climate litigation shows traction (e.g., *Urgenda*), but enforcement relies on *present institutions* acting as proxies—which requires models from functional boundary work. Less institutionally disruptive than non-human representation.  

  3. **Inclusion/Standing Interaction**  
     **Why third?** Clarifying the split is foundational but primarily *diagnostic*. Empirical work on *when inclusion fails to generate standing* (e.g., marginalized groups in electoral systems) informs design but doesn’t mandate new structures like functional/temporal challenges. Vital for critique, less for blueprints.  

  **Key Leverage**: Functional boundaries force *concrete institutional innovation* (e.g., redefining legal personhood). Temporal boundaries extend existing human-centric models, while the inclusion/standing split provides the lens to evaluate both.  

  ---

  ### 3. **What Would Flip the Ranking?**  
  - **If future generations gain enforceable legal rights globally** (e.g., via ICC climate rulings), temporal boundaries jump to #1. Standing mechanisms (trusts, intergenerational juries) would become urgent.  
  - **If AI attains legal personhood widely**, functional boundaries lose urgency, elevating temporal challenges.  
  - **If empirical studies prove standing is *automatically* secured by inclusion** (e.g., via sortition or liquid democracy), the inclusion/standing split becomes mere taxonomy.  

  ---

  ### 4. **Bottom Line: One Thread for a Multi-Year Project**  
  **Focus: Functional Boundaries.**  
  Designing standing mechanisms for non-human entities (e.g., AI, rivers) creates transferable tools for temporal challenges and tests the inclusion/standing split in practice. Pilot "ecological interest representation" in local governments or algorithmic oversight bodies. This forces radical institutional creativity, addresses emerging crises (AI governance, extinction), and generates scalable models for future generations.  

  **Why?** It’s the most underexplored, institutionally fertile, and high-stakes frontier—where theoretical shifts directly enable new democratic forms.
