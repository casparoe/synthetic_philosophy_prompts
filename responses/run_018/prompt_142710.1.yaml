answer: |-
  Here are the desiderata for any adequate theory of material constitution, designed to solve the core problem rather than redescribe it:

  ### Non-Negotiable Desiderata (Necessary for Solving the Problem)
  1.  **Handle Classical Coincidence (Statue/Clay):** The theory must explain how the statue and the lump of clay are distinct objects despite sharing all matter at creation. *Why non-negotiable:* This is the foundational case establishing the need for a distinction between constitution and identity. Failure here means the theory doesn't address the core puzzle.
  2.  **Distinguish Constitution from Identity:** The theory must provide clear criteria for when object A constitutes object B without A being identical to B. *Why non-negotiable:* Without this distinction, the problem dissolves into identity, violating the core phenomenon (e.g., the statue is destroyed when squashed, the lump isn't).
  3.  **Account for Differing Persistence Conditions:** The theory must explain why the constituted object (statue, artwork, organism) persists or perishes under different conditions than the constituting matter (clay, atoms, substrate). *Why non-negotiable:* This difference in "modal profiles" (e.g., vulnerability to deformation vs. rearrangement) is the primary evidence for non-identity.
  4.  **Handle Complete Matter Replacement (Re-materialized Artwork & Metamorphosis):** The theory must explain persistence through total replacement of constituting matter without relying on spatio-temporal continuity of *any* specific material parts, as demonstrated by the scanned/re-materialized sculpture and biological metamorphosis (e.g., a caterpillar's entire cellular structure being replaced in pupation). *Why non-negotiable:* These cases directly challenge the necessity of matter continuity for persistence, demanding an account based on organization, function, or information.
  5.  **Respect Biological Identity:** The theory must accommodate biological persistence through radical matter replacement and reorganization (like metamorphosis or gradual cellular turnover) without requiring essentialism about specific parts or demanding spatio-temporal continuity of matter. *Why non-negotiable:* Biology provides clear, non-negotiable examples where identity is preserved despite total material change, grounded in life processes.
  6.  **Cohere with Mereological Facts:** The theory must not violate fundamental mereological principles without overwhelming justification (e.g., if A and B share all parts at t, they are mereologically coincident at t). *Why non-negotiable:* Mereology provides the basic framework for part/whole relations; radical contradiction undermines coherence.

  ### Context-Sensitive Desiderata (Reflects Theoretical Choices, But Must Be Addressed)
  7.  **Handle Distributed/"Cloud-like" Entities:** The theory should account for objects whose parts lack stable spatial relations or are widely dispersed (e.g., a distributed software process, a flock), where identity seems tied to functional integration or causal role rather than location. *Why context-sensitive:* While increasingly relevant, strict requirements here often stem from functionalist or anti-substantialist leanings. However, a robust theory *should* have resources to engage with such cases.
  8.  **Distinguish Persistence Conditions from Essential Properties:** The theory should clarify that *what it takes for an object to continue existing* (persistence) is distinct from *properties an object must have to be the kind of thing it is* (essence). *Why context-sensitive:* While crucial for precision, the specific content of essences is highly contested (e.g., artefact functionalism vs. historical origin views). The theory must respect the *distinction*, not necessarily endorse a specific essentialism.
  9.  **Distinguish Material Continuity from Formal/Functional Continuity:** The theory must provide resources to differentiate persistence grounded in sameness of matter from persistence grounded in sameness of structure, function, or information. *Why context-sensitive:* The necessity of this distinction is highlighted by the re-materialized artwork and biology, but its exact nature depends on the theory's core commitments.

  ### Potential Tensions Between Desiderata
  *   **Mereological Coherence (6) vs. Cloud-like Entities (7):** Mereology traditionally assumes localized parts. Insisting on strict mereological coherence for radically distributed entities might force awkward descriptions (e.g., claiming the "cloud object" is a scattered object with ever-changing locations). A theory might struggle to satisfy strict mereology while making sense of intuitively unified but spatially unstable entities.
  *   **Distinguishing C/I (2) & Persistence Conditions (3) vs. Avoiding Proliferation:** A robust distinction between constitution and identity, combined with differing persistence conditions, risks multiplying entities (statue *and* lump *and* atoms...). Some theories see this as a cost; others accept it. Satisfying 2 and 3 fully often conflicts with a strong desire for ontological parsimony.

  ### Assessment of Standard Theories Against Desiderata
  1.  **Identity Theory:** Collapses constitution into identity. Fails catastrophically at (1), (2), and (3). The re-materialized artwork (4) is impossible for it.
  2.  **Mereological Essentialism:** Claims objects cannot gain/lose parts. Fails (1) (statue/clay must be identical if coincident), (4) (replacement impossible), (5) (biology impossible), and (7) (distributed entities unstable). Violates (3) by making persistence depend solely on part identity.
  3.  **Four-Dimensionalism (Perdurantism):** Treats objects as spatio-temporal worms. Handles (1) by having different temporal parts for statue and lump. Handles (4) & (5) by allowing temporal parts with different matter. Struggles severely with (7) (distributed entities) due to reliance on spatio-temporal continuity for unifying temporal parts. Often blurs (2), treating constitution as temporal overlap of distinct worms. Can violate intuitions about (3) (persistence as endurance).
  4.  **Constitution View (Baker-style):** Posits distinct, coinciding objects with primary kinds (statue, lump). Excels at (1), (2), (3). Handles (4) & (5) by allowing the constituted object (artwork, organism) to persist via "sameness of primary kind" grounded in function/information even as the constituting matter changes. Can potentially handle (7) by defining primary kinds functionally. Respects (8) & (9). Faces challenges explaining *how* constitution relations begin/end precisely and potential ontological proliferation.

  ### The Most Damaging Requirement
  **Complete Matter Replacement (4 - Re-materialized Artwork & Metamorphosis)** does the most damage to mainstream candidates. It directly and forcefully undermines:
  *   **Identity Theory & Mereological Essentialism:** By making persistence without matter continuity impossible.
  *   **Spatio-Temporal Continuity Assumptions:** Implicit in many theories (including some versions of 4Dism), by severing persistence from the continuous path of any material substrate.
  *   **The Primacy of Matter:** By demonstrating that functional/informational continuity *alone* can sustain identity for constituted objects, forcing the theory to ground persistence in form, organization, or causal role rather than substance. This requirement exposes the insufficiency of theories that cannot meaningfully separate the persistence conditions of the constituted object from the fate of its current matter.
