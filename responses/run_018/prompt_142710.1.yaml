  Non-negotiable criteria should include handling classical cases (statue/clay) since they're foundational. Also, their re-materialized artifact to test functional continuity. Biological cases like metamorphosis are crucial because biology relies on form/function over matter. Cloud entities test spatial instability. These are non-negotiable because any theory must explain real-world phenomena, not just philosophical puzzles.

