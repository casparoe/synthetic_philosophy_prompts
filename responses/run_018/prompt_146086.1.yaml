answer: |-
  You've hit a nerve in cross-cultural pragmatics, and your frustration is valid. Let's dismantle your premises step-by-step in plain American English:

  **Your Broken Premise: Equating "Face-Saving" with "Deception"**
  This is the core issue. Brown & Levinson's "negative face" (autonomy) protection isn't inherently deceptive. Here's why:

  1.  **Indirectness ≠ Lying:** Japanese indirectness (using *tatemae*) isn't primarily about hiding your *honne* (true feeling). It's a **conventionalized signaling system.** Think of it like traffic lights:
      *   Red light doesn't *lie* about the driver's desire to go; it signals "Stop is required here for safety/social order." Everyone knows the code.
      *   Saying "That might be difficult" instead of "No" signals "I need to decline politely to preserve harmony." The listener understands the refusal. It's socially transparent *within its context*.

  2.  **Transparency is Culturally Defined:** You're assuming "transparency" means verbalizing literal truth directly. In high-context cultures like Japan:
      *   **Real Transparency = Understanding the Code:** True communication happens *because* both parties understand the implied meaning. Saying "I'll consider it" when you mean "No" *is* transparent *if* the listener correctly interprets it as "No." The "lie" is surface-level; the real message is received.
      *   **Directness Can Be Opaque (and Aggressive):** Bluntly saying "No" might obscure the speaker's intention to show respect or avoid conflict. The Dutch directness your BF uses is transparent *in a Dutch/low-context setting* because directness *is* the expected code. In Japan, that same directness can obscure the speaker's goodwill and appear hostile.

  3.  **The Function is Different:** Brown & Levinson see politeness as mitigating unavoidable face-threats. Japanese indirectness often **avoids creating the threat in the first place**.
      *   A direct "No" (American/Dutch style) is a clear face-threat that needs softening ("I'm sorry, but...").
      *   An indirect "That might be difficult" (Japanese style) *is* the softening – it avoids the blunt threat. The "deception" (if you insist on calling it that) *is* the politeness strategy itself, universally recognized within the culture.

  **Dutch Directness Isn't Morally Cleaner - It's Just Different:**

  1.  **It Has Its Own "Code":** Dutch directness isn't the absence of politeness; it's a specific *type* of politeness focused on:
      *   **Positive Face:** Showing respect through honesty, equality, and assuming the other can handle the truth ("We're both adults, I respect you enough to be straight").
      *   **Efficiency:** Valuing clarity and getting things done.
      *   **Within this code,** excessive indirectness *is* seen as deceptive or disrespectful (wasting time, not trusting the other person).

  2.  **Moral Baseline Issue:** You're absolutely right to question the assumption that "transparency = literal directness = universal moral good." This *is* an Anglo/Western (especially American/Dutch) baseline.
      *   **The Japanese baseline is "Wa" (和 - Harmony):** The highest moral good is maintaining social harmony and avoiding conflict/embarrassment. Indirectness serves *this* value. Literal truth that disrupts harmony can be seen as *more* morally problematic.
      *   **Neither baseline is objectively superior.** Judging Japanese indirectness as deceptive using an American/Dutch definition of transparency is like judging driving on the left side of the road as "wrong" because your baseline is driving on the right.

  **Your Roommate is Partly Right (But Simplifying):**

  *   **"Knowing the code" is crucial.** Yes, if both parties share the cultural understanding, the indirect message *is* received clearly. It's not a lie hoping to fool someone; it's a mutually understood signal.
  *   **But it's not *just* about guessing a white lie.** It's about understanding a whole system of communication where meaning resides as much in *how* something is said (or not said) and the context as in the literal words. A white lie is usually an *individual* act of concealment. Japanese indirectness is a *societal* system of conventionalized expression.

  **The Answer:**

  **Your core error is treating all linguistic face-saving strategies as inherently deceptive, and assuming "transparency = literal verbal directness" is the universal moral baseline.**

  1.  **Face-Saving ≠ Deception:** Indirectness can be a highly conventionalized, mutually understood signaling system, not an attempt to mislead. It prioritizes harmony and avoiding blunt threats over literal verbal expression.
  2.  **Transparency is Cultural:** What constitutes "clear, honest communication" differs. In Japan, clarity comes from correctly interpreting indirect signals *within the shared social code*. In the US/Netherlands, clarity comes from direct verbalization. Neither is inherently more "transparent" or "moral" in a universal sense.
  3.  **Moral Baselines Differ:** The Japanese system prioritizes group harmony (*Wa*) as the highest good. The American/Dutch systems often prioritize individual autonomy/truth-telling. Judging one using the other's moral framework creates a false hierarchy.

  **In short:** Japanese indirectness isn't "strategic deception" any more than using "please" is strategic manipulation. It's the culturally prescribed way to communicate difficult messages while upholding the core value of social harmony. Dutch directness upholds the core values of honesty and efficiency. Neither is morally cleaner *in principle*; they serve different social priorities. The friction happens when the codes clash, not because one is fundamentally deceptive or immoral.
