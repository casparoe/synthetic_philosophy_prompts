answer: |-
  You've grasped the radical core of the Mingjia (School of Names) position far better than most introductory accounts. Your reading aligns with a sophisticated interpretation of Gongsun Long's "white horse" paradox, moving beyond simple semantics to profound ontology. Let's break down your excellent questions:

  1.  **The Radical Separability Thesis:** Your interpretation is correct. The Mingjia, particularly Gongsun Long, seem to advocate for a strong ontological separability of attributes (形 *xing* - shape/form & 色 *se* - color/quality). These are not properties inhering in a single underlying substance (like Aristotelian substance-attribute metaphysics). Instead, they are primary, independent realities ("hard" and "white" in his other dialogues, "horseness" and "whiteness" here). An object like a "white horse" isn't a unified *thing*; it's a temporary coincidence or conjunction (兼 *jian*) of two distinct existences: the reality of "horseness" and the reality of "whiteness" occupying the same spatial location at the same time.

  2.  **Mereological Nihilism?** Your intuition is sharp. This view **does push perilously close to mereological nihilism** – the idea that only simples exist, and composites are not real entities. If "horseness" and "whiteness" are fundamentally distinct and primary realities, and the "white horse" is merely their co-location, then the "white horse" itself has no independent ontological status. It's an aggregate, not a substance. This applies universally: *every* perceived object becomes an unstable aggregation of co-located attributes. There is no "internal principle of unity" beyond spatial-temporal coincidence. The Mingjia ontology dissolves the common-sense object into its defining attributes.

  3.  **The Paradox of Disputation:** This is the crucial tension you identified. If the "white horse" is merely a fleeting, unreal conjunction, how can it serve as the stable subject of a true/false statement *about* that very conjunction? Doesn't the act of naming and disputing "white horse" presuppose *some* minimal unity or referential stability?

  **Resolving the Tension: Coherence Without Illusion?**

  The coherence lies not in salvaging composite entities, but in rethinking the nature of reference, truth, and the *function* of disputation within this radical framework:

  1.  **Reference to Patterns, Not Composites:** For the Mingjia, names (名 *ming*) primarily refer *not* to composite objects, but **to the attributes themselves or to stable *patterns* of co-occurrence.** "Horse" names the attribute/form 'horseness'. "White" names the attribute 'whiteness'. "White horse" names the specific pattern where 'whiteness' coincides with 'horseness'. The statement "a white horse is not a horse" is true *because*:
      *   The name "horse" refers *only* to the attribute 'horseness'.
      *   The name "white horse" refers to the conjunction of 'whiteness' and 'horseness'.
      *   The conjunction (pattern of two attributes) is ontologically distinct from the single attribute 'horseness' alone. Adding 'whiteness' changes the referent from a single attribute to a specific conjunction of attributes.
      *   The subject of the statement is the *pattern/conjunction* ("white horse"), and the predicate denies its identity with the *attribute* ("horse"). It's not denying that the white thing possesses horseness; it's denying that the pattern *is* the attribute.

  2.  **Disputation as Clarifying Reference & Correcting Error:** The Mingjia practice of disputation (辯 *bian*) isn't primarily about describing composite objects as stable entities. It's a therapeutic and corrective practice aimed at:
      *   **Exposing Linguistic Conflation:** Revealing how common language misleadingly treats names for conjunctions ("white horse") as if they referred to unified substances equivalent to the names of their component attributes ("horse"). Their paradoxes highlight this error.
      *   **Precision in Naming:** Insisting that names must correspond precisely to specific attributes or specific conjunctions, without blurring distinctions. Disputation sharpens this precision.
      *   **Correcting Misunderstandings of Reality:** Arguing *against* the naive assumption that the co-location of attributes creates a new, unified entity. The "white horse" is disputed *specifically* to show that it is *not* simply a "horse" (the attribute) but something different (a conjunction). The disputation *uses* the term "white horse" conventionally to point out its non-identity with "horse," thereby illuminating the underlying ontological separateness.

  3.  **Stability in Co-occurrence, Not Composition:** While the conjunction itself isn't a new substance, the *pattern* of co-occurrence might exhibit sufficient regularity and stability in experience to be named and discussed. The 'horseness' and 'whiteness' coincide in a way that allows us to reliably identify and talk *about* that specific coincidence. The stability needed for disputation comes from the relative stability of the *attributes themselves* and the reliability of their conjunction in specific instances, not from the conjunction being a fundamental entity.

  4.  **Rejecting Substance, Not Convention:** The Mingjia target the *metaphysical* assumption of unified substance, not necessarily the practical *linguistic convention* of using compound terms. They can engage in disputation *using* terms like "white horse" as conventional labels for frequently co-occurring attribute patterns, precisely *in order to* demonstrate that these labels do not refer to simple, unified entities equivalent to the labels for their component attributes. Their practice presupposes the *conventional usefulness* of the label "white horse" for a recognizable pattern, while denying its *ontological simplicity* or identity with "horse."

  **Conclusion:**

  Your reading is insightful. The Mingjia separability thesis **does** imply a radical dissolution of common-sense composite objects into co-located attributes, bordering on mereological nihilism. The "white horse" is not a real composite entity; it's a temporary conjunction of 'whiteness' and 'horseness'.

  However, this doesn't make disputation about "white horse" incoherent. Coherence is maintained by:

  1.  **Shifting Reference:** Names refer primarily to attributes or specific conjunction patterns, not to composite substances.
  2.  **Disputation's Purpose:** Its goal is therapeutic – to expose linguistic conflation and correct metaphysical errors about unity, *using* conventional terms to demonstrate their non-identity.
  3.  **Pattern Stability:** The relative stability of attributes and their regular co-occurrence patterns provides enough ground for naming and discussion, even if the conjunction itself isn't a fundamental unity.

  The Mingjia aren't saying "white horse" is an illusion in the sense of being unreal *as a conjunction*; they are saying it's an error to treat that conjunction *as if it were identical to* one of its component attributes ("horse") or *as if it were* a new, simple substance. Their separability preserves the distinct reality of form and color by refusing to let language or perception fuse them into a metaphysically simple whole. The "white horse" is real *as* the coincidence of white and horse, but it *is not* the horse (the attribute of horseness alone). Their disputation brilliantly leverages this distinction to challenge our deepest assumptions about language and reality.
