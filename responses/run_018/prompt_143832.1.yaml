  Here’s your satirical FAQ for the **Office of Formal Preservation (OFP)**, precisely 600 words, in deadpan bureaucratic American English. No prior knowledge of translation theory required!

  ---

  **OFFICE OF FORMAL PRESERVATION (OFP)**  
  **Division of Poetic Structural Integrity**  
  **FREQUENTLY ASKED QUESTIONS: LICENSED POETRY TRANSLATION**  

  **Q1: What is the OFP’s mission?**  
  A: The OFP ensures all translated poetry entering the American literary ecosystem adheres strictly to the original work’s formal architecture. Rhyme schemes, metrical patterns, syllable counts, and stanzaic frameworks are non-negotiable cultural assets. Meaning ("semantics") is classified as a secondary, mutable variable.  

  **Q2: Why must I obtain a Poetry Translation License?**  
  A: Unlicensed translation risks *formal contamination*. Imagine a sonnet collapsing into free verse due to reckless synonym selection, or a villanelle’s refrain drifting by ±1 syllable. The OFP prevents such structural emergencies. Licenses (Form PS-7b) are renewable biennially after passing the Rhyme & Meter Stability Exam (RMSE).  

  **Q3: What is a "Rhyme Bond"?**  
  A: All licensed translators must post a $500 Rhyme Bond (Cashier’s Check or Postal Money Order). This bond is forfeited if a translated work exhibits:  
  - Broken meter (e.g., iambic pentameter lapsing into tetrameter).  
  - Rhyme scheme deviation (ABAB becoming ABCA).  
  - Unauthorized enjambment across stanzas.  
  Bond reinstatement requires requalification on the RMSE and a $75 reprocessing fee.  

  **Q4: How does the Marot Metric™ scoring system work?**  
  A: The Marot Metric™ (MM) is our proprietary assessment tool. Translations earn points for:  
  - **Syllabic Fidelity (Max 50 pts)**: Matching the original poem syllable-per-syllable, per line.  
  - **Rhyme Integrity (Max 30 pts)**: Perfect rhyme preservation (no "slant rhyme" concessions).  
  - **Meter Conservation (Max 20 pts)**: Exact stress patterns, regardless of word choice.  
  *Note: Semantic coherence is not scored. Scores ≥85 qualify for OFP’s "Golden Quill" certification.*  

  **Q5: What is "Semantic Drift," and why is it penalized?**  
  A: Semantic Drift (SD) occurs when a translator prioritizes meaning over form, causing hazardous deviations (e.g., altering "the moon’s pale sorrow" to "a sad white cheese" merely to preserve rhyme). SD is a Class 2 Formal Violation. Fines are tiered:  
  - **Minor Drift** (≤3 lines affected): $25 per line.  
  - **Major Drift** (≥4 lines): $50/line + mandatory recalibration workshop.  
  - **Catastrophic Drift** (themes/plot altered): $200 + license suspension.  

  **Q6: Can I appeal a violation?**  
  A: Appeals require submitting Form SD-9 within 30 days, accompanied by:  
  - A notarized affidavit swearing the original poem’s author "would’ve prioritized form."  
  - A phonetic breakdown proving syllable alignment.  
  - A $150 appeal deposit (non-refundable if MM score remains <85).  

  **Q7: Are there exemptions?**  
  A: Exemptions are rare. Haiku translators may apply for a Syllable Variance Waiver (SVW) if seasonal words (*kigo*) disrupt counts. Epic poems (>1,000 lines) require a Structural Impact Statement. No exemptions exist for "difficult" source languages or "untranslatable idioms."  

  **Q8: How do I report unlicensed translation?**  
  A: Use our 24/7 Tip Line (1-888-NO-SLANT-RHYME) or file Form PS-10: "Citizen Report of Suspicious Free Verse." Anonymous reports accepted. Rewards include OFP merchandise (e.g., "I ♥ Meter" pins).  

  **Q9: What if the original poem has no formal structure?**  
  A: The OFP does not recognize "free verse" as poetry. Submit such queries to the Bureau of Ambiguous Prose (BAP), Room 4B.  

  ---  
  **PARODY FOOTNOTE: LIBERTIES TAKEN & CONTEXT**  
  *You’re not entirely wrong—but the satire leans into hyperbole:*  
  1. **"Le Ton beau de Marot"** is Douglas Hofstadter’s book exploring translation through Clément Marot’s 16th-century French poem. Hofstadter **doesn’t advocate sacrificing meaning for form**; he examines the *tension* between them. The satire here flips his nuanced debate into a dogma.  
  2. **"Marot Metric"**: Entirely invented. Hofstadter discusses "fidelity" but never reduces it to a point system.  
  3. **"Semantic Drift"**: Real translators debate this, but penalties are absurd. Most argue *some* drift is inevitable.  
  4. **Bureaucracy**: The OFP’s rigid rules parody how institutions sometimes prioritize measurable criteria (like form) over intangible qualities (like meaning)—not Hofstadter’s actual philosophy.  

  Satire target: Institutions (or pedants) valuing technical perfection over artistic essence. Hope Jess gets a laugh!
