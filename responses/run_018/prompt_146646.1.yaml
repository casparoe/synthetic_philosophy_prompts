  I just got out of this really long argument with my friend about those "if...then" sentences we use all the time — like "if I skip class, I'll miss the quiz" — and we kept getting stuck on whether they actually mean anything beyond "probably not both" or if there's real structure there. I'm taking this philosphy of language course and I feel like the textbook stuff about material implication is missing the point, but I also don't want to just memorize Lewis's triviality results without knowing what a theory actually has to cover.

  So can you act like an expert philosopher of logic who's careful with formal details but also thinks about ordinary talk? Think carefully and maybe start with a quick brainstorm of the key issues before you get formal. I want the full spec: what desiderata must any adequate theory of indicative conditionals meet? Include the standard ones — like handling cases where transitivity fails, or where adding information changes acceptability — but also this niche twist I can't stop thinking about: the "self-undermining" case where you're reasoning about a decision you're in the middle of making, and the antecedent describes taking that very decision, while the consequent mentions a reason that only holds if you don't take it. For example, "if I accept the offer, my best reason for accepting it vanishes." Any theory that collapses this into contradiction or just ignores it seems broken to me. For each requirement, say why it matters and whether it conflicts with others, especially given Lewis's triviality results. Don't give me a bibliography or tell me to read specific papers — I just want the criteria spelled out, with boundary cases showing where each one bites, and flag which ones are probably impossible to satisfy together or need to be treated as seperate conditions rather than one big package.
