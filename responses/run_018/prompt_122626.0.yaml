prompt: |-
  I sit on the Research Priorities Committee of a large agricultural research institute. Every spring we allocate a restricted endowment to a single two-year postdoctoral fellowship, and this year we are down to two finalists. One proposal would make controlled-atmosphere stunning for broiler chickens cheaper and more reliable in mid-sized processing plants. The other would develop and validate welfare indicators for farmed black soldier fly larvae: substrate temperature thresholds, larval stocking density, and the choice of killing method at harvest. The argument for it is that insect protein production is scaling up quickly, that welfare standards written while the industry is still young are the ones it will inherit, and that the field currently has almost no agreed outcome measures. Both finalists are strong, so this is not a decision we can make on file quality.

  What is dividing us is a number. The insect proposal's summary argues that farmed insect numbers already exceed farmed vertebrate numbers by three or four orders of magnitude and are growing far faster, that the standing number of insects alive at any moment is on the order of 10^18, and that even if the probability that larval insects have any valenced experience at all is as low as one or two percent, the expected scale swamps anything achievable in poultry. Two members want to adopt exactly that arithmetic as our ranking rule: individuals affected per dollar, multiplied by a probability of sentience, multiplied by the intensity and duration of the suffering averted. Two others think that formula is a machine for manufacturing conclusions from inputs nobody can defend, and that we should stay where the sentience premise is not itself in dispute.

  Two further complications came up at our last two meetings and I want them addressed rather than noted. First, a colleague argues that the relevant population is not the farmed insects at all: production facilities leak or release enormous numbers of animals, and any welfare standard we help author will also change how many insects get farmed in the first place, plausibly upward, since welfare certification makes a fast-growing industry politically more comfortable. On that picture we cannot even sign our effect on total insect-years, let alone its size. Second, our terms of reference tell us to fund work whose findings could reasonably change purchasing or husbandry practice within five years, and no one on the committee expects the sentience question to be settled either way in that window, even though the indicator work would yield usable results regardless.

  Draft the decision memo I will circulate to the committee before our April 17 meeting. It should recommend a concrete course of action with a time frame: one of the two fellowships, or a structured alternative such as funding one while commissioning a small piece of scoping work on the other, or deferring with a specified trigger. It should give reasons at a level of detail the unsuccessful applicant could actually respond to, and it should engage the strongest version of whichever case you reject: in particular, whether multiplying by a probability we cannot estimate is distinguishable from multiplying by an invented number, and whether an intervention whose net effect we cannot sign can still be worth funding on expected-value grounds. Be explicit about what you are assuming on the sentience question rather than trying to resolve it. Aim for roughly 1,200 words, in a form I can put straight into the meeting packet.
reasoning: |-
  Okay, let me approach this systematically. The user is a committee member facing a high-stakes funding decision between two agricultural research proposals with profound ethical implications. The core tension involves quantifying welfare impacts for potentially sentient beings versus focusing on undisputed sentience.

  First, I need to unpack the layers of complexity. The insect proposal presents an astronomical scale argument - even low sentience probability could yield massive expected impact. But the poultry intervention affects animals with undisputed sentience and clearer pathways to implementation. The committee is deadlocked over whether to use speculative probability multipliers.

  The memo must navigate three critical challenges:
  1) The sentience probability dilemma - how to handle unquantifiable uncertainty
  2) The systems effect paradox - welfare standards might increase total insect farming
  3) The five-year impact requirement - sentience research won't resolve in that timeframe

  I'm considering structuring the memo to first acknowledge both proposals' strengths, then confront the key sticking points head-on. For the probability question, I'll argue that while expected value calculations have theoretical merit, applying them here requires assumptions beyond our epistemic limits. The systems effect issue is even trickier - we're dealing with unpredictable market dynamics where welfare standards could perversely increase total insect-years.

  The poultry proposal seems more defensible because:
  - It targets suffering we know exists
  - Mid-sized plants represent a critical implementation gap
  - Its technical improvements have near-certain adoption pathways
  - All impacts occur within the required five-year window

  But I must give the insect argument its due force. That astronomical number - 10^18 insects - demands serious consideration. The memo should explicitly state that if larval sentience is probable (say >20%), the scale argument might prevail. And we should recommend commissioning a scoping study on insect welfare indicators since this field is evolving rapidly.

  For implementation, I'll suggest:
  - Funding the poultry fellowship immediately
  - Commissioning a 3-month insect welfare scoping study
  - Setting clear review triggers for future insect welfare funding
  - Requiring the insect researcher to address key uncertainties in parallel

  The language needs to balance scientific rigor with decisive leadership - this committee needs resolution. I'll maintain professional tone while making the uncomfortable probabilities explicit: we're not denying insect sentience, but refusing to bet resources on unquantifiable probabilities when alternatives exist.
answer: |-
  ## MEMORANDUM

  **TO:** Research Priorities Committee  
  **FROM:** [Your Name/Chair Designee]  
  **DATE:** April 10, 2024  
  **SUBJECT:** Recommendation on Allocation of Postdoctoral Fellowship Funding for 2024 Cycle  

  **1. Introduction**  
  This memo outlines a recommended course of action for allocating the 2024 two-year postdoctoral fellowship endowment. After thorough review of the two exceptional finalists – Project A (Controlled-Atmosphere Stunning for Mid-Sized Poultry Plants) and Project B (Welfare Indicators for Farmed Black Soldier Fly Larvae) – and consideration of committee debates, I propose funding **Project A (Poultry Stunning)** while commissioning a **targeted 3-month scoping study** on insect welfare indicators. A final decision on Project B’s core research will be deferred pending the scoping study’s outcomes, with clear triggers defined below. This path addresses the committee’s deadlock on sentience probability and systems effects, respects our 5-year impact mandate, leverages Project A’s immediate potential, and maintains rigorous engagement with Project B’s compelling scale argument.

  **2. Assessment of Finalists**  
  *   **Project A (Poultry Stunning):** Addresses a known welfare challenge (ineffective stunning leading to avoidable suffering/death) in a critical market segment (mid-sized plants) where adoption of high-welfare technology lags. The proposal offers clear, near-term pathways to impact: developing cheaper, more reliable technology directly applicable within existing regulatory and industry frameworks. Impact is measurable (reduced mortality, improved EEG indicators), adoption is highly probable within 5 years, and the sentience premise is uncontested. The primary limitation is scale: impact is confined to millions of broilers in mid-sized facilities.
  *   **Project B (Insect Welfare Indicators):** Addresses a potentially vast welfare gap in a rapidly scaling industry (insect protein). Its core strength lies in preventing future welfare catastrophes by establishing standards *before* industry consolidation. Developing validated indicators (temperature, density, killing methods) is foundational work essential for *any* future welfare assessment or regulation. The argument regarding scale (10^18+ insects, rapid growth) is mathematically compelling *if* larval sentience has non-negligible probability. However, the proposal faces significant challenges: (1) The fundamental sentience premise is unresolved and unlikely to be settled within 5 years; (2) The net welfare impact of intervention is ambiguous due to potential industry expansion ("welfare certification paradox"); (3) Direct pathways to measurable welfare change within 5 years are less certain, hinging on rapid industry uptake of nascent standards.

  **3. Engagement with Core Committee Divisions**  
  The impasse centers on whether and how to incorporate the immense scale of insect farming into our decision calculus, given deep uncertainty.

  *   **The Case for Scale and Expected Value (EV):** Proponents rightly argue that ignoring scale due to sentience uncertainty risks immense moral negligence if larvae *are* sentient. The EV framework (Individuals Affected × Prob(Sentience) × Intensity/Duration Averted) formally incorporates this uncertainty. Even a low Prob(Sentience) (e.g., 1-2%) applied to 10^18 individuals dwarfs the impact on vertebrates. Project B is a prerequisite for *any* future welfare gains in this sector. Rejecting it based *only* on sentience uncertainty potentially forfeits influence over a vast future industry.

  *   **The Case Against Arbitrary Probabilities and Unsignable Effects:** Opponents argue that assigning *any* specific Prob(Sentience) to larvae is currently scientifically indefensible. Is multiplying by 1% meaningfully different from 0.1% or 5%? Without credible bounds, the calculation becomes subjective, risking "manufactured" justification. Further, if welfare standards catalyze industry growth (increasing total insect-years lived, potentially under conditions only marginally improved), the *net* sign of the intervention (+ve or -ve welfare) is genuinely unknown. Funding based on EV when the net effect could be negative is ethically fraught. Our mandate demands reasonable expectation of *positive* practice change within 5 years, which requires more certainty on both sentience and impact pathways than currently exists.

  *   **Reconciliation:** Both viewpoints hold merit. **The scale argument cannot be dismissed lightly; it presents a profound ethical imperative.** However, utilizing the EV formula *as a decisive ranking tool* under current extreme uncertainty requires assumptions that stretch beyond defensible scientific inference. The systems effects (leakage, industry growth) compound this uncertainty, making even the direction of impact opaque. While EV calculations are valuable heuristics for very low-probability, high-impact events, applying them here mandates assigning specific probabilities and intensities to inherently speculative parameters without agreed-upon methodologies or data – venturing beyond our committee’s expertise and mandate.

  **4. Addressing Complications**  
  *   **Relevant Population & Systems Effects:** The concern is valid. Focusing solely on farmed larvae ignores escaped individuals and, critically, the potential for welfare standards to act as a growth accelerator. This creates a "double uncertainty": sentience *and* net welfare effect. This ambiguity directly challenges our requirement for fundable work to have a reasonable expectation of positive impact. Project B’s impact assessment requires complex modeling far beyond the proposal’s scope and our current capacity to evaluate reliably within the decision timeframe.
  *   **Five-Year Impact Window & Sentience Uncertainty:** Our terms of reference are clear. Project A demonstrably meets this criterion: usable technology leading to practice change within 5 years. Project B would yield *indicators* within 5 years, but their translation into *welfare improvements* hinges on industry adoption and presupposes sentience. Crucially, the core sentience question is highly unlikely to be resolved within 5 years. Funding Project B therefore relies on a chain of uncertain events: indicators developed -> industry adopts -> sentience exists -> adoption *improves* net welfare. Project A’s chain is shorter and more certain: technology developed -> adopted -> suffering reduced (sentience confirmed).

  **5. Recommendation & Action Plan**  
  I recommend the following structured course of action:

  1.  **Fund Project A (Poultry Stunning) Immediately:** Award the two-year postdoctoral fellowship to Project A. This leverages its uncontested sentience premise, clear 5-year impact pathway, and tangible welfare benefits for millions of animals in an underserved sector. It represents a high-confidence, high-value investment meeting our core mandate.

  2.  **Commission a Focused Scoping Study on Insect Welfare Indicators:** Allocate a smaller, separate budget (e.g., 5-10% of fellowship value) for a rapid (3-month) expert scoping study. **Scope:** The study should specifically address:
      *   Feasibility and methodology for establishing *credible bounds* on the probability of valenced experience in BSF larvae, based on current neurobiology, behavior, and evolutionary theory.
      *   Modeling the potential systems effects of welfare standards on total insect production (farmed + escaped), incorporating industry growth projections and certification dynamics.
      *   Pathways to *practical implementation* of welfare indicators within the next 5-7 years, including stakeholder engagement strategies and regulatory levers.
      *   Identification of the most critical, tractable indicators with the highest potential welfare leverage.

  3.  **Defer Final Decision on Project B Core Research with Defined Triggers:** Postpone funding the full Project B fellowship pending the scoping study report. **Decision Triggers:** The committee will reconvene by August 1, 2024, to review the scoping study. Funding for Project B (or a revised iteration) will be strongly considered if the study indicates:
      *   A credible pathway exists to establish a *meaningful lower bound* for Prob(Sentience) that is non-negligible (e.g., >1% deemed plausible by experts), *OR*
      *   Systems modeling suggests a *high probability* that welfare standards would lead to net positive welfare outcomes even with industry growth, *OR*
      *   Clear, actionable pathways to measurable welfare impact within a 5-7 year horizon are identified, independent of immediate sentience resolution.
      If the scoping study indicates these triggers are unlikely to be met soon, Project B remains unfunded this cycle, but the institute gains valuable foresight for future strategy.

  **6. Why This Path?**  
  *   **Honors Mandate & Resolves Deadlock:** Funds Project A, meeting the 5-year impact requirement on solid ground. Provides a rigorous, time-bound response to the profound ethical questions raised by Project B without requiring the committee to endorse unverifiable probabilities now.
  *   **Engages Deeply with Project B's Strength:** Takes the scale argument seriously by investing in dedicated analysis to reduce the critical uncertainties (sentience probability bounds, net systems impact, implementation pathways) that currently prevent confident funding. This is not kicking the can; it’s targeted due diligence.
  *   **Manages Risk:** Avoids committing major resources to an intervention with unsignable net welfare effects and unresolved foundational premises, while also avoiding the potential error of dismissing a vast future welfare domain. The scoping study mitigates the risk of inaction by providing a basis for near-term reassessment.
  *   **Practical & Actionable:** Provides a clear resolution for the current cycle (fund A, scope B) with a defined timeline (August decision on B) and concrete criteria for future action.
  *   **Builds Institutional Capacity:** The scoping study will provide invaluable intelligence for the institute on a rapidly emerging field, informing future priority-setting regardless of the immediate fellowship decision.

  **7. Assumptions on Sentience**  
  This recommendation explicitly **does not** resolve the sentience question. It operates on the following pragmatic assumptions:
  1.  **Vertebrate Sentience:** We operate under the established scientific consensus that chickens are sentient. Reducing their suffering is a known good.
  2.  **Insect Sentience Uncertainty:** We acknowledge the possibility that BSF larvae *could* have valenced experiences but also acknowledge that this is currently scientifically unresolved and highly uncertain. We lack sufficient evidence to assign a credible probability estimate or confidently assert sentience exists in a way comparable to vertebrates.
  3.  **Precaution & Tractability:** Where sentience is certain (poultry), we prioritize tractable interventions with clear impact. Where sentience is profoundly uncertain and impact pathways are complex (insects), we prioritize reducing epistemic uncertainty before committing major resources, while acknowledging the potential stakes. We do *not* assume insects are insentient; we assume the current state of knowledge makes large-scale investment based *primarily* on scale arguments involving their potential sentience epistemically premature for *this specific funding decision* under our mandate.

  **8. Conclusion**  
  Project A represents a high-certainty opportunity to reduce significant suffering in a population known to experience it, aligning perfectly with our mandate. Project B presents an ethically compelling vision of potentially vast scale but is currently hampered by foundational uncertainties that prevent confident assessment of its net welfare impact and alignment with our 5-year window. Funding Project A while commissioning a rapid, targeted scoping study on the critical uncertainties surrounding insect welfare allows us to act decisively now on solid ground, while demonstrating serious commitment to grappling with the profound questions Project B raises. I move that we approve funding for Project A and authorize the commissioning of the scoping study on Insect Welfare Indicators as described, with a decision on Project B by August 1, 2024, based on the study's findings against the defined triggers.

  **ATTACHMENT:** Draft Terms of Reference for Insect Welfare Indicators Scoping Study (To be developed by Secretariat if recommendation approved).
