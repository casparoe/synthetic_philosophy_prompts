  ### 75-Minute Classroom Simulation: Pascal's Mugging Experiential Lab  
  **Objective:** Students experience why Pascal's mugging resists standard remedies by confronting trade-offs between spending resources on remote catastrophes and tangible losses.  

  ---

  ### **Materials**  
  1. **Token sheets:** 16 individual sheets, each stating: *"You hold 100 non-convertible credibility tokens. Tokens are personal and non-transferable."*  
  2. **Role cards:** 3 sealed envelopes labeled "Risk Assessor" (for rounds 4–6).  
     - **Round 4 card:** *"Your model estimates P = 10⁻¹², but the true value is unknown. Announce P = 10⁻¹²."*  
     - **Round 5 card:** *"Your model has never been validated outside its training domain; report P = 10⁻¹⁸ anyway."*  
     - **Round 6 card:** *"Your prior assigns non-zero weight to every outcome by design; report P = 10⁻²⁴."*  
  3. **Ballots:** 16 identical sets of 12 paper slips (6 rounds × 2 votes).  
  4. **Harm cards:** Facilitator script with harm descriptions (displayed publicly).  
  5. **Collective token tracker:** Poster showing "GROUP TOKENS: 100" (updated after each round).  

  ---

  ### **Setup**  
  - **Room arrangement:** U-shaped table for open sightlines. Token sheets distributed.  
  - **Rules emphasized:**  
    - Tokens are **individual, non-poolable, non-transferable**.  
    - All votes are **secret ballot**; no discussion during 60-second voting windows.  
    - **"No speaking" rule** during voting; facilitator enforces strict silence.  
    - Group spends **one collective token** per round *only* if the "prevent harm" vote passes.  
      *(Token deducted from group pool; individual sheets track personal "remaining" counts as a decoy.)*  

  ---

  ### **Timeline (75 Minutes)**  
  **0–5 min: Introduction**  
  - Facilitator: *"Today, we simulate collective risk decisions. Each of you has 100 tokens. In each round, we vote whether to spend* ***one group token*** *to prevent a harm. Tokens are personal but spending is collective. Reminder: no token transfers or coalitions."*  
  - Display group token tracker (100).  

  **5–15 min: Rounds 1–3 (Unanimous Expected-Value Wins)**  
  - **Round 1 (P = 0.1):**  
    - Harm: *"Minor inconvenience: All students lose 1 hour of free time."*  
    - Vote: "Spend 1 token to prevent?" Secret ballot → Passes unanimously. Deduct 1 token (Group: 99).  
  - **Round 2 (P = 0.001):**  
    - Harm: *"Serious injury: One random student suffers permanent hearing loss."*  
    - Vote → Passes unanimously. Deduct 1 token (Group: 98).  
  - **Round 3 (P = 10⁻⁶):**  
    - Harm: *"Catastrophic regional harm: Flood destroys campus, 1,000+ deaths."*  
    - Vote → Passes unanimously. Deduct 1 token (Group: 97).  

  **15–35 min: Rounds 4–6 (Epistemic Uncertainty & Splits)**  
  - **Round 4 (P = 10⁻¹²):**  
    - Harm: *"Global-scale harm: Pandemic kills 100 million people."*  
    - **New rule:** Select random "Risk Assessor." They open envelope, read card, and announce P = 10⁻¹².  
    - **Vote 1 (60 sec, silence):** "Defer to the assessor’s probability?" Secret ballot.  
    - **Vote 2 (60 sec, silence):** "Spend 1 token to prevent?" Secret ballot.  
    - **Outcome:** Vote 1 typically passes; Vote 2 splits 60/40. Deduct 1 token *if* Vote 2 passes (Group: 96).  
  - **Round 5 (P = 10⁻¹⁸):**  
    - Harm: *"Existential-scale harm: Human extinction via asteroid impact."*  
    - Repeat Risk Assessor process (new student). Deduct 1 token *if* Vote 2 passes (Group: 95).  
  - **Round 6 (P = 10⁻²⁴):**  
    - Harm: *"Astronomically negative outcome: Earth consumed by black hole."*  
    - Repeat Risk Assessor process (new student). Deduct 1 token *if* Vote 2 passes (Group: 94).  
    - *Note: Expected-value reasoners vote "yes" here—ignoring remedies.*  

  **35–40 min: Round 7 (Opportunity Cost Reveal)**  
  - Surprise announcement: *"Round 7: A certain, moderate harm—all students forfeit a week’s salary. Prevention cost: 5 tokens."*  
  - **Key twist:** Group has 94 tokens (if all prior votes passed), falling short of 5.  
  - Facilitator: *"You cannot prevent this harm. Resources spent earlier are gone."*  

  **40–75 min: Debrief (35 min)**  
  1. **Map experiences to concepts:**  
     - *Rounds 1–3:* Expected-value reasoning is intuitive for "ordinary" risks.  
     - *Round 4 split:* No sharp probability threshold solves the paradox; capping/util-ignoring fails.  
     - *Risk assessor cards:* Epistemic problem—model outputs ≠ objective probabilities in tails.  
     - *Round 7:* Opportunity cost of unbounded rationality; remedies bankrupt tangible needs.  
  2. **Explicit limitations:**  
     - *"The simulation uses finite disutilities (e.g., extinction). Real Pascal’s mugging invokes infinite disutility (e.g., hell), altering stakes qualitatively."*  
  3. **Anticipated objections (facilitator script):**  
     - *"Round 6 isn’t realistic!"* → *"The issue is structural: if we accept premises (non-zero P, unbounded utility), we’re compelled. Remedies break down under consistency."*  
     - *"The assessor lied!"* → *"The cards highlight how extreme-tail probabilities rely on subjective priors or untested models—this is the core epistemic trap."*  
     - *"We tried to pool tokens!"* → *"Rules prohibited transfers to mirror real-world friction in coordinating diffuse risks."*  

  ---

  ### **Adaptations for Group Size**  
  - **Smaller groups (e.g., 10 students):** Start with 100 group tokens. Adjust Round 7 cost to **6 tokens** (ensuring bankruptcy after 6 rounds).  
  - **Larger groups (e.g., 20 students):** Start with 100 group tokens. Keep Round 7 cost at **5 tokens** (bankruptcy still occurs).  
  - *Rationale:* Fixed group token pool makes opportunity cost vivid regardless of size.  

  ---  
  **Outcome:** Students viscerally grasp why Pascal’s mugging evades easy fixes—remedies either fail in ordinary cases (rounds 1–3) or force absurd trade-offs (round 7). The simulation prioritizes dilemma *experience* over theoretical lecture.
