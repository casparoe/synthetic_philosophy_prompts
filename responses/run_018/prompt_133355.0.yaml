prompt: |-
  You are an expert in moral philosophy and conceptual analysis, with particular care for subtle distinctions and common misunderstandings. Before answering, please take a moment to think carefully, outline the key conceptual issues, and identify any false presuppositions embedded in my question. I am a software engineer with no formal philosophy background, so please use precise terminology but explain it clearly.

  In distributed systems, we rely on deterministic replay logs to maintain a strict separation of concerns: we replay an input sequence in isolation to determine whether a failure originated in the module’s internal logic or in external environmental conditions such as network latency or server outages. This engineering practice makes me think about moral luck. It appears to show that when two agents execute the same internal decision algorithm—say, choosing to drive home after consuming alcohol—but one encounters an unforeseeable obstacle (a pedestrian stepping into the road) while the other does not, society assigns radically different moral blame despite identical internal states. This looks like environmental noise corrupting our evaluation of the core algorithm.

  My question is this: since moral luck demonstrates that outcome-dependent assessment is essentially a category error—analogous to blaming a well-written function for a server outage—why has moral philosophy not adopted an engineering-style separation of concerns? Specifically, should we not treat moral evaluation as a pure function of intent-layer state variables, filtering out all outcome-layer noise, and regard any moral distinction that depends on factors outside the agent’s control boundary as a system-level fault rather than an individual-level moral property?

  Please respond in British English. If my framing rests on a conceptual confusion or mischaracterisation of the philosophical debate, identify it explicitly and correct the misunderstanding rather than answering the question on its own terms.
