prompt: |-
  I serve on an institutional review board for a public-science funder that receives frequent proposals to validate new measurement instruments—psychological screening tools, automated text-classifiers, clinical risk scores—and I need a reusable decision procedure I can run in about thirty minutes per proposal, without statistical expertise beyond what a generalist auditor can apply, because I have to sign off on funding recommendations. Too often a proposal validates an instrument by applying it to generate data, then uses those generated classifications as the criterion against which the instrument is tested: a circularity that may look like legitimate calibration but can be an illegitimate bootstrap in the epistemological sense, especially in cases of so-called easy knowledge where a source is used to establish the very warrant it needs. To operationalize this, the procedure should distinguish first-order bootstrapping—using the instrument’s own outputs as the direct validation criterion—from second-order bootstrapping—using prior outputs to shape the independent-looking criterion that then validates later versions—and it should apply an independent-anchor requirement: at least one node in the validation chain must not be causally or informationally downstream of the instrument’s own prior outputs.

  Write the procedure as an ordered checklist: the questions to ask in sequence, what counts as a sufficient answer to each, where the procedure stops with a clear reject or clear pass, and where it must hand the decision to human judgment because the issue is one of values or stakes rather than logical structure. Be explicit about which steps are judgment calls disguised as procedure, flag exactly where the procedure is likely to misfire—for example, when an apparently independent criterion was subtly calibrated by exposure to the instrument’s outputs without explicit acknowledgment—and state two things the procedure absolutely cannot do, such as establishing the instrument’s base-rate reliability in the wild or resolving whether a small residual circularity is tolerable given high-stakes intervention.

  Then apply it to three proposals: (1) a depression-screening app validated by comparing its scores to clinician diagnoses that were made using the app’s preliminary risk flags as part of the clinical intake form; (2) a literacy-assessment tool validated against teacher ratings where teachers were trained using sample items drawn from the tool itself, but the final ratings used unseen texts; and (3) a widely supported, high-budget climate-adaptation survey instrument validated against expert annotations that are genuinely independent in origin, but where the procedure detects a hidden dependency because the expert panel’s coding manual incorporated terminology introduced by an earlier pilot of the same survey—this should be the unwelcome case, since the proposal is politically popular and well-funded, but your procedure should flag it or reject it, and you should say what the auditor must do with that result.

  Lead with the bottom line—the full procedure summarized in one paragraph—then expand with the checklist, the judgment points, the misfire warnings, the three worked cases, and the limits. Keep the entire response to a maximum of 850 words. Do not include a bibliography, reading list, or citation list; refer to theoretical distinctions by descriptive name only, and do not quote any specific text.
reasoning: |-
  Hmm, the user is an IRB member at a public science funder who needs a quick, reusable decision procedure to detect circular validation in measurement instruments. They're drowning in proposals where instruments are validated against their own outputs—a classic epistemological bootstrap problem. What they really need is a 30-minute audit tool that doesn't require stats expertise but can flag both direct and subtle circularities.

  I'm considering the core challenge here: they need to operationalize philosophical concepts like "easy knowledge" and "bootstrapping" into concrete questions. The procedure must distinguish between first-order (obvious) and second-order (hidden) circularity, while enforcing an independent anchor requirement. The key insight is tracing causal/informational dependencies—not just mechanical independence.

  For the checklist design, I think it should flow from surface checks to deeper probes. Start with direct criterion examination (Step 1), then criterion provenance (Steps 2-3), and finally anchor verification (Step 4). Critical judgment points should be flagged where human discretion is unavoidable—like assessing whether "training contamination" is material. I must also warn about covert calibration (e.g., when an "independent" expert panel unknowingly internalized the instrument's framework).

  The worked examples are crucial for testing robustness. The depression app case is textbook first-order failure—clinicians seeing the app's flags creates direct dependence. The literacy tool is ambiguous: teacher training with sample items might be acceptable if final ratings used truly novel texts, but that's a judgment call. The climate survey is the sneaky one—experts using terminology from the pilot creates informational dependence even if they're "independent" bodies. That's exactly why Step 3 exists.

  I should emphasize two hard limits: (1) the procedure can't assess real-world reliability (only validation integrity), and (2) it can't justify tolerable circularity in high-stakes contexts—that's a values decision for the committee. The user needs to know where the tool ends and their judgment begins.

  The three test cases are designed to escalate: Case 1 is a clear reject, Case 2 shows the gray zone requiring human discretion, and Case 3 demonstrates how the procedure catches politically inconvenient truths. For Case 3, the auditor must report the finding transparently even if it's unpopular—the tool's job is to expose dependence, not decide acceptability.

  I'll structure the response with a bottom-line summary upfront, then unpack the checklist with embedded warnings, followed by the three cases and explicit limitations. The whole thing must stay under 850 words—so every sentence needs to pull weight.
answer: |-
  ### Bottom-Line Summary of Procedure
  The Independent Anchor Validation Checklist detects circular epistemic bootstrapping in measurement instrument proposals by asking four sequential questions: (1) Is the validation criterion *directly* the instrument’s own output? (Reject if yes). (2) Does the criterion derive from prior outputs of this instrument? (Reject if yes). (3) Could the criterion’s construction have been influenced by this instrument’s outputs? (Flag for human judgment if influence is plausible). (4) Is there at least one criterion node *not* causally or informationally dependent on any prior output? (Pass only if confirmed). Steps 3 and 4 involve judgment calls about informational dependence. The procedure cannot assess real-world reliability or resolve tolerable circularity in high-stakes contexts.

  ---

  ### The Independent Anchor Validation Checklist
  1.  **Is the validation criterion *directly* the output of the instrument being validated?**
      *   *Check:* Does the proposal compare the instrument's scores/predictions against *its own* classifications for the same data?
      *   *Sufficient Answer:* If yes, **REJECT** (First-order bootstrapping).
      *   *Outcome:* Stops here for rejection. Proceed if no.

  2.  **Does the validation criterion *explicitly* rely on prior outputs from this specific instrument (or its direct prototypes)?**
      *   *Check:* Does the proposal state that the "ground truth" criterion (e.g., labels, scores, diagnoses) was generated using an earlier version or output of *this* instrument?
      *   *Sufficient Answer:* If yes, **REJECT** (Explicit second-order bootstrapping).
      *   *Outcome:* Stops here for rejection. Proceed if no.

  3.  **Is there a *plausible risk* that the validation criterion was *shaped* by exposure to outputs from this instrument (or its concepts), even if not explicitly used as input?** **(JUDGMENT CALL)**
      *   *Check:* Scrutinize how the criterion (e.g., expert panel, training data, coding manual) was developed. Look for: use of instrument items/examples in criterion training; criterion developers having access to instrument outputs/design; criterion definitions incorporating terminology/concepts uniquely defined/popularized by the instrument.
      *   *Sufficient Answer:* If plausible risk exists (e.g., training contamination, conceptual drift), **FLAG FOR HUMAN JUDGMENT**. If no plausible risk is found, proceed.
      *   *Misfire Warning:* This step is highly vulnerable. It may miss *subtle* conceptual contamination (e.g., panelists unconsciously influenced by prior exposure) or incorrectly flag benign historical precedence. Conversely, it might underestimate influence if documentation is sparse. Requires careful but efficient reading of methods.

  4.  **Can an *independent anchor* be confirmed? Is at least one node in the criterion's provenance chain demonstrably *not* causally or informationally downstream of any output from this instrument or its direct lineage?**
      *   *Check:* Trace the origin of the criterion. Is there a source (e.g., established clinical standard, independently collected behavioral data, expert judgment using fundamentally different methods/concepts) that existed *prior* to and *without* influence from this instrument's development?
      *   *Sufficient Answer:* If a clear independent anchor exists (e.g., criterion based solely on pre-existing, unrelated standards/methods), **PASS**. If no anchor can be identified, **REJECT** (Violates independent anchor requirement).
      *   *Judgment Call:* Assessing "informational downstream" requires judgment about conceptual independence, not just mechanical separation. Is the anchor *truly* using different epistemic grounds?

  ---

  ### What the Procedure Cannot Do
  1.  **Establish real-world reliability or validity:** Passing the checklist only means the validation *design* avoids circularity. It says nothing about the instrument's accuracy, generalizability, or base-rate performance in actual use.
  2.  **Resolve tolerable circularity:** It cannot determine if a *detected* small circularity (e.g., minor training contamination) is acceptable given high potential benefits or practical constraints. This is a values/stakes decision for the IRB.

  ---

  ### Application to Cases

  1.  **Depression-Screening App:**
      *   Step 1: Criterion is clinician diagnoses. Not *directly* the app's output. **Proceed**.
      *   Step 2: Clinicians used the app's risk flags. This means the criterion *explicitly* relied on the instrument's output. **REJECT** (Explicit second-order bootstrapping). Clinician judgment was contaminated at source.

  2.  **Literacy-Assessment Tool:**
      *   Step 1: Criterion is teacher ratings. Not the tool's output. **Proceed**.
      *   Step 2: Proposal states teachers were trained using sample items *from the tool*. Final ratings used unseen texts. **REJECT** (Explicit second-order bootstrapping - prior outputs used to shape the raters). The "unseen texts" don't negate that the teachers' rating *ability* was calibrated using the instrument's own materials. No independent anchor for rater training.

  3.  **Climate-Adaptation Survey Instrument:**
      *   Step 1: Criterion is expert annotations. Not the survey's output. **Proceed**.
      *   Step 2: Proposal states expert annotations are "genuinely independent". No explicit use of prior outputs stated. **Proceed**.
      *   Step 3: **JUDGMENT CALL:** The expert panel's coding manual incorporated terminology introduced by an earlier pilot of the *same survey*. This creates a *plausible risk* the criterion (expert codes) was shaped by exposure to the instrument's concepts/outputs. The terminology defines the constructs being measured. **FLAG FOR HUMAN JUDGMENT**. The auditor must document this finding clearly: *"Validation criterion potentially contaminated by prior exposure to instrument's conceptual framework via coding manual terminology. Independent anchor requirement not clearly met."*
      *   **Auditor Action:** The auditor DOES NOT make the final funding decision. They report the procedural finding (Step 3 Flag) to the full IRB. The IRB must then debate: Is the potential contamination severe enough to invalidate the validation? Does the political popularity/benefit outweigh the epistemological flaw? The procedure forces transparency about the dependence.
