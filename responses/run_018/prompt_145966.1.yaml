  We are going to teach the roommate the distinction between risk aversion (modeled by curvature in the utility function) and probability weighting (which separately distorts probabilities) in the context of prospect theory. The goal is to show why a blackout tail (low probability catastrophic event) might be overweighted even if the utility function is not particularly curved for losses.

  Conceptual Dependencies:

  1. **Expected Utility (EU) without probability weighting**: 
     - In standard EU, we have a utility function `u(·)` that is typically concave for gains (risk aversion) and may be convex for losses (risk seeking for losses, as per prospect theory) but we are focusing on losses here.
     - The expected utility for a prospect is: `EU = Σ [p_i * u(x_i)]`.
     - Risk aversion for gains is modeled by the concavity of `u(·)`, meaning that the utility of the expected value is higher than the expected utility. But note: for losses, we might have convexity (leading to risk seeking) or concavity (risk aversion) depending on the region.

  2. **Limitation of EU for low-probability events**:
     - In EU, the probability `p` is used linearly. So a very low probability event, even if catastrophic, might not influence the decision much because `p` is so small.
     - However, people often overweight low probabilities (especially of extreme events) and underweight moderate to high probabilities.

  3. **Introducing Probability Weighting**:
     - Prospect theory (Kahneman and Tversky) suggests that people use a weighting function `w(p)` that distorts the actual probability `p`.
     - The weighting function `w(p)` is typically inverse S-shaped: it overweights small probabilities and underweights moderate to high probabilities.
     - So the prospect theory value becomes: `PT = Σ [w(p_i) * v(x_i)]`, where `v(x_i)` is the value function (which is similar to the utility function but defined on gains and losses relative to a reference point).

  4. **The Two Components**:
     - **Value Function (v)**: This captures the diminishing sensitivity to gains and losses (concave for gains, convex for losses) and loss aversion (steeper for losses than gains). This is where risk aversion for gains and risk seeking for small losses might be captured.
     - **Weighting Function (w)**: This captures the distortion of probabilities.

  5. **Why Separate?**
     - The utility function's curvature (or value function) cannot explain why someone would be very sensitive to a low-probability event. For example, in the blackout scenario, even if the utility function is linear, if we overweight the low probability of a blackout, that event will have a larger impact on the overall evaluation.

  Teaching Plan:

  **Step 1: Establish the Setup with the Two Prospects**

  We have two options:

  - **Option A (Solar-plus-battery retrofit)**: 
    - High monthly cost (small loss with high probability) but protects against blackouts.
    - Specifically, we pay a fixed extra amount every month (say, $100 more than current bills) but we avoid the catastrophic loss in the event of a grid collapse.

  - **Option B (Stay on grid)**:
    - Lower monthly bills (say, save $100 per month) but with a very low probability (say, 0.1% or 0.001) of a catastrophic grid collapse (which would result in a huge loss, say $50,000 in damages and inconvenience).

  **Step 2: Show Expected Utility Calculation (without weighting)**

  Assume we are using a utility function `u(·)` that is concave (risk averse) for losses? Actually, note: prospect theory's value function is typically convex for losses (risk seeking for losses). But for large losses, it might be concave (risk averse). To keep it simple, let's assume a concave utility function for losses (so risk averse) and linear for simplicity? We want to show that even with a reasonable utility function, the low probability event might not sway the decision.

  Calculate the expected utility for Option B:

  - With probability 0.999: utility of -$100 (relative to the reference point of not having the extra cost and not having the blackout) -> but note: actually, without the retrofit, we are saving $100 per month? Let's adjust:

  Actually, let's define:

  - Option A: Pay $100 more per month for sure -> so outcome: -$100 per month (relative to Option B's baseline without blackout?).

  But we need a common reference. Let's set the reference point as the state without the retrofit and without blackout. Then:

  - Option A: You pay an extra $100 per month for sure -> so outcome: -$100 (with probability 1). Utility: u(-100)

  - Option B: 
     - With probability 0.999: you pay $0 extra (so outcome = $0) -> utility u(0) = 0 (by convention, set at reference).
     - With probability 0.001: you suffer a catastrophic loss of $50,000 -> utility u(-50,000)

  So expected utility of Option B: 
     EU(B) = 0.999 * u(0) + 0.001 * u(-50,000) = 0.001 * u(-50,000)

  Now, the expected utility of Option A: 
     EU(A) = u(-100)

  We compare EU(A) and EU(B). 

  But note: without the retrofit, we are saving $100 per month? Actually, in Option B, we are not paying the extra $100, so we are saving $100 per month compared to Option A, but we are exposed to the blackout.

  So to adjust: 

  - In Option A, we are paying $100 more than the baseline (so loss of $100) for sure.
  - In Option B, we are paying the baseline (so no extra cost) with 0.999 probability, but with 0.001 probability we have a loss of $50,000.

  So the expected monetary loss of Option B is 0.001 * 50000 = $50. So in pure monetary terms, Option A costs $100 per month while Option B costs $50 on average. So expected value favors Option B by $50.

  But with risk aversion: if u is concave (and defined on wealth, not changes), then we are more sensitive to losses. However, if we use a utility function that is linear, then EU(B) = 0.001 * (-50000) = -50, and EU(A) = -100. So -50 > -100, so we choose B.

  With a concave utility function for losses (so risk averse for losses), we might have:

     u(-100) = -100 (if linear in small amounts) but for the large loss, due to concavity, u(-50000) might be greater than -50000 (in absolute value, less negative because of diminishing sensitivity? Actually, for losses, prospect theory has convexity, not concavity). 

  To avoid confusion, let's use the prospect theory value function for losses: which is convex (diminishing sensitivity: the difference between -100 and 0 is subjectively larger than the difference between -50,100 and -50,000). But note: we are comparing a sure loss of $100 versus a very small chance of a huge loss.

  However, even with a convex value function (for losses) in prospect theory, which would make the utility of -50,000 less negative than if it were linear, the expected utility of B might still be less negative than A? Because 0.001 * v(-50,000) might be greater (less negative) than v(-100). 

  But wait: if v is convex for losses, then v(-50,000) > -50,000 (if we set v(0)=0 and v is convex and negative). Actually, convexity for losses means that the value function is steeper near zero and shallower for larger losses. So v(-50,000) might be -40,000 (in utils) and v(-100) might be -120 (for example). Then:

     EU(B) = 0.001 * (-40,000) = -40
     EU(A) = v(-100) = -120

  Then EU(B) > EU(A) -> still prefer B.

  But the roommate is scared of the blackout tail. So why?

  **Step 3: Introduce Probability Weighting**

  Explain that in reality, people might overweight the small probability of the blackout. They don't use p=0.001, but a weighted probability w(0.001) that is higher, say 0.01 (10 times higher).

  So in prospect theory, the evaluation becomes:

     PT(B) = w(0.999) * v(0) + w(0.001) * v(-50,000)

  But note: w(0.999) = 1 - w(0.001) because the events are binary. And v(0)=0.

  So PT(B) = w(0.001) * v(-50,000)

  Now, if we use the same value function as above: v(-50,000) = -40,000, and w(0.001)=0.01, then:

     PT(B) = 0.01 * (-40,000) = -400

  Compare to PT(A) = v(-100) = -120

  Now, -400 < -120, so now Option A (solar) is preferred.

  This shows that the overweighting of the low probability event can reverse the decision.

  **Step 4: Clarify the Separation**

  - The curvature of the value function (v) captures how we feel about outcomes (e.g., the difference between losing $100 and $50,000). 
  - The probability weighting (w) captures how we perceive and react to probabilities (e.g., we might treat a 0.1% chance as if it were 1%).

  Without the weighting function, the value function alone (even if it is convex for losses) might not capture the fear of the low-probability catastrophic event because the probability is so small. The weighting function is what amplifies the impact of that event.

  **Step 5: The "Energy Sovereignty" Factor**

  This is a non-quantifiable factor. We can think of it as an additional benefit of Option A that is not captured in the monetary outcomes. We can model it as a separate positive utility that is added to Option A. For example, we might set:

     PT(A) = v(-100) + u_sovereignty

  where u_sovereignty is a positive constant that represents the peace of mind and independence. Then even if PT(B) were slightly better without it, the sovereignty factor might tip the balance.

  **Misconceptions and When to Address Them:**

  1. **Double-Counting Risk**: 
     - She might think that by having a convex value function for losses (which makes the large loss feel less bad) and then overweighting the probability, we are somehow double-counting the risk. 
     - **Defusal**: Emphasize that these are two separate psychological phenomena. The value function captures the subjective value of outcomes (how bad is losing $50,000?), while the weighting function captures the subjective perception of the probability (how likely does a 0.1% chance feel?).

  2. **This is just Bayesian subjective expected utility**:
     - She might think that we are just putting a different prior on the probability. But note: the weighting function is not a Bayesian update; it's a perceptual distortion that is applied to known probabilities. 
     - **Defusal**: Point out that in Bayesian updating, we change our probability based on evidence. Here, we are talking about known probabilities (e.g., from historical data) but we still distort them. The weighting function is applied to the given probabilities.

  **Check for Understanding:**

  Ask her to consider a hypothetical:

     - Option C: 99% chance to lose $100 and 1% chance to lose $0.
     - Option D: 100% chance to lose $99.

  In standard EU with risk aversion (concave utility), we would prefer D? Actually, for losses, if we are risk averse we would prefer the sure loss? But note: prospect theory's value function is convex for losses, so we might be risk seeking for losses and prefer C? 

  But now add probability weighting: we overweight the 1% chance of losing $0. So w(0.01) is higher than 0.01. Then the chance of losing $0 might seem more attractive. 

  But let's compute:

  Without weighting: 
     PT(C) = w(0.99)*v(-100) + w(0.01)*v(0) = w(0.99)*(-100) [if linear, and v(-100)=-100] and w(0.01)*0. But note: if we assume linear value function for simplicity, then:
     PT(C) = w(0.99)*(-100)
     PT(D) = v(-99) = -99

  Now, if w(0.99) is less than 0.99 (because we underweight high probabilities) then w(0.99) < 0.99, so PT(C) = w(0.99)*(-100) > -99 (if w(0.99) < 0.99) then PT(C) is greater than -99? Actually, w(0.99) is about 0.9? Then PT(C)= -90, which is greater than -99? Then we prefer C? 

  But note: we are comparing two losses. A higher value (less negative) is better.

  So without weighting, if w(0.99)=0.99, then PT(C)=-99, same as PT(D). But with weighting, we underweight the 99% and overweight the 1%, so w(0.99) < 0.99 -> then PT(C) = w(0.99)*(-100) > -99 (because w(0.99)*100 < 99) so PT(C) > -99 -> so we prefer C (the gamble) over D (the sure loss of $99). 

  But this is because of the probability weighting, not the value function. This example shows the effect of probability weighting independently.

  **What to Leave Out:**

  - Full axiomatic derivation of expected utility and prospect theory.
  - Rank-dependent formulations (which are a different way to apply weights, but we are using the simple prospect theory formulation for binary prospects, so we don't need to get into cumulative weighting).
  - The exact shape of the weighting function (e.g., Tversky and Kahneman's function) and value function parameters.

  **Avoid Conflating with Rank-Dependent Utility (RDU):**

  - In the teaching, stick to a simple binary outcome (like the blackout example) so that the weighting is applied to the single probability. In RDU, for more than two outcomes, the weighting is applied to cumulative probabilities. Since we have only two outcomes, the two formulations are the same. So the example is safe.

  **Conceptual Dependency Map:**

  1. Understand the two options and their outcomes and probabilities.
  2. Review standard expected utility and its limitations for low-probability events (without weighting).
  3. Show that even with a convex value function (for losses) the low probability event might not be enough to change the decision.
  4. Introduce the probability weighting function and show how it can change the decision.
  5. Separate the roles: value function for outcomes, weighting function for probabilities.
  6. Discuss the "energy sovereignty" as an additive constant (or a separate benefit) for the solar option.

  **Misconception Sequence:**

  1. At the point after explaining standard EU, she might say: "But we can just make the utility function more concave for losses to capture the fear." Then show that even with a linear (or convex) value function, the event is still negligible because of the low probability. Then introduce weighting.
  2. After introducing weighting, she might think it's double-counting: then clarify by showing the two functions capture different things.
  3. When you mention the sovereignty, she might think it can be folded into the utility function. That's true, but it's a separate outcome attribute. It doesn't change the probability weighting part.

  **Final Check:**

  Ask her: "In the blackout scenario, without changing the utility function, how does the weighting function make us more afraid of the blackout?" 

  Correct answer: The weighting function overweights the low probability of the blackout, making that event have a larger impact on the overall evaluation.

  **Plan Outline:**

  1. **Set up the scenario**: Two options, one with a sure loss and one with a small chance of a huge loss.
  2. **Calculate with standard EU**: Show that Option B (stay on grid) has a better expected utility (even with a reasonable utility function).
  3. **Reveal the paradox**: But we are scared of the blackout. Why?
  4. **Introduce probability weighting**: Show how overweighting the low probability reverses the decision.
  5. **Clarify separation**: Value function = outcome sensitivity, weighting function = probability perception.
  6. **Add sovereignty**: As an extra benefit for solar.
  7. **Address misconceptions** as they come up naturally at steps 2, 4, and 5.
  8. **Check understanding**: With the Option C vs D example, or by asking her to explain the reversal.

  This should give her the intuition without the math-track details.
answer: |-
  Here's a step-by-step teaching plan designed to address your roommate's misconceptions and build intuitive understanding without formal math. The structure follows conceptual dependencies, targets specific misconceptions at critical points, and uses your solar battery case study.

  ---

  ### **Teaching Plan: Why Probability Weighting ≠ Risk Aversion**
  **Core Objective:** Show that fear of low-probability disasters (grid collapse) can't be explained by utility curvature alone—it requires separate probability weighting.  
  **Pedagogical Strategy:** Use the solar battery decision as a running example. Contrast standard expected utility (EU) with prospect theory (PT) to highlight the gap.

  #### **1. Set the Stage with the Solar Battery Decision (5 mins)**
     - **Example Setup:**  
       - **Option A (Solar+Battery):** Guaranteed monthly cost increase of $100 (high-probability small loss).  
       - **Option B (Grid):** 0.1% chance of catastrophic grid collapse (costing $50k in damages/health), else no extra cost.  
       - **Non-Quantifiable Factor:** "Energy sovereignty" (security/autonomy feeling) for Option A.  
     - **Key Question:** "Why does Option B *feel* dangerous despite positive expected *monetary* value? ($50 expected loss vs. $100 sure loss)."

  #### **2. Review Standard Expected Utility (EU) and Its Shortcoming (10 mins)**  
     - **EU Formula:** `EU = Σ [p_i × u(outcome_i)]`  
       - Use a curved utility function `u()` for risk aversion (e.g., concave for losses, like `u(loss) = -√|loss|`).  
     - **Apply to Example:**  
       - Calculate EU for Option B: `(0.999 × u($0)) + (0.001 × u(-$50,000))`.  
       - Show that even with extreme curvature, the tiny probability dilutes the catastrophe's impact.  
       - **Result:** EU favors Option B (grid) unless utility curvature is unrealistically steep.  
     - **Misconception Addressed #1: "EU can capture this with curved u()"**  
       - *Defusal Here:* Point out the math forces linear probability treatment—curvature only magnifies *outcome* sensitivity, not *probability* sensitivity. The 0.001 probability is the bottleneck.

  #### **3. Introduce Probability Weighting (10 mins)**  
     - **Concept:** Humans don't use raw probabilities (`p`); they weight them (`w(p)`).  
       - **Weighting Function:** Overweight tiny probabilities (e.g., `w(0.001) = 0.05`), underweight high probabilities (e.g., `w(0.999) = 0.94`).  
     - **Prospect Theory (PT) Formula:** `PT = Σ [w(p_i) × u(outcome_i)]`  
     - **Apply to Example:**  
       - PT for Option B: `w(0.999) × u($0) + w(0.001) × u(-$50,000)`.  
       - With weighting: `0.94 × u($0) + 0.05 × u(-$50,000)`.  
       - **Contrast:** The weighted term `0.05 × u(-$50,000)` dominates vs. EU's `0.001 × u(-$50,000)`.  
       - **Result:** PT reverses the decision—Option A (solar) now wins.  
     - **Sticky Carrying Analogy:**  
       - *Curved utility* is like a sensitive scale—a gram of feathers vs. a gram of lead *feel* different.  
       - *Probability weighting* is like a probability "magnifying glass"—dust specks look like boulders under a lens.  
       - **Solar Case:** The $100 cost bump is feathers (high `p`, underweighted). The blackout is lead dust under a magnifying glass (tiny `p`, overweighted).

  #### **4. Clarify the Dependency Order (5 mins)**  
     - **Why Weighting Must Be Separate:**  
       1. **Curved u()** handles diminishing sensitivity to *outcomes* (e.g., losing $200 hurts less than 2× losing $100).  
       2. **w(p)** handles *probability perception* (e.g., 0.001 feels like 0.05).  
       - **Interdependency:** They interact multiplicatively (`w(p) × u(x)`), but one doesn't cause the other.  
     - **Misconception Addressed #2: "This is just Bayesian updating"**  
       - *Defusal Here:* Bayesian updates change beliefs (e.g., new storm forecasts). Probability weighting distorts *known* probabilities. No new data—just psychology.

  #### **5. Address Non-Quantifiable Factors ("Energy Sovereignty") (3 mins)**  
     - **Role:** This is a *separate utility component* for Option A.  
       - **Handling:** Frame it as a "+k" to Option A's utility (e.g., security/independence boost).  
       - **Key Point:** It doesn't interact with probability weighting—it's a bonus regardless of risk.

  #### **6. Misconception Checks & Understanding Verification (Ongoing)**  
     - **Critical Misconceptions & When to Defuse:**  
       | **Misconception** | **When to Address** | **Defusal Prompt** |  
       |-------------------|---------------------|-------------------|  
       | "We're double-counting risk aversion." | After Step 4 | "Does curved u() explain why 0.001 *feels* like 0.05? Or just how bad $50k feels?" |  
       | "This is just subjective probabilities." | During Step 4 | "Is the 0.001 probability *unknown* (Bayesian) or *distorted* (weighted)?" |  
       | "Can't we fold this into u()?" | After Step 3 | "Try adjusting u() to make EU mimic PT. Why does it break for other scenarios?" |  
     - **Understanding Check (Not Memorization):**  
       - **Scenario Test:** Give a new example:  
         *"Medication A: 99.9% chance of no side effects, 0.1% chance of death.  
         Medication B: Guaranteed mild nausea.  
         Why might PT prefer B, even if EU favors A?"*  
       - **Passing Answer:** "The 0.1% death chance feels scarier than 0.1% because it's overweighted—even if you're risk-neutral in utility."  

  #### **7. What to Explicitly Skip**  
     - Axiomatic derivations (von Neumann-Morgenstern for EU, Kahneman-Tversky for PT).  
     - Rank-dependent utility (RDU) or cumulative prospect theory.  
     - Parameter estimation or functional forms of `w(p)`.  
     - Historical context (e.g., Allais paradox).  

  #### **8. Avoiding Rank-Dependent Conflation**  
     - **How to Dodge:**  
       - Use only binary choices (solar vs. grid) in examples. RDU distinctions matter for >2 outcomes.  
       - Never mention "cumulative probabilities" or "decision weights." Stick to `w(p)` for single events.  
     - **If You Drift:** Anchor explanations in the solar case—it has one high-`p` loss and one low-`p` loss, no ranking needed.  

  ---

  ### **Conceptual Dependency Map**
  ```mermaid
  graph TD
      A[Solar Battery Decision] --> B[Standard EU Calculation]
      A --> C[Intuition Gap: Why fear the 0.1%?]
      B --> D[Curved u() Fails to Explain Tail Fear]
      C --> E[Probability Weighting w(p)]
      D --> E
      E --> F[Prospect Theory: w(p) × u(x)]
      F --> G[Weighting Explains Tail Overweighting]
      G --> H[Non-Quantifiable Factors: Add to Utility]
      H --> I[Decision Reversal in Solar Case]
  ```

  ### **Key Takeaways for Your Roommate**
  - **Curved u()** = How much you care about outcomes.  
  - **w(p)** = How much you care about probabilities.  
  - **EU's flaw:** Forces `w(p) = p`, so tails vanish.  
  - **PT fix:** Overweight rare disasters, underweight "boring" high probabilities.  
  - **Sovereignty:** Icing on the cake—not part of risk calculations.  

  This plan avoids math formalism, leverages relatable examples, and preempts common confusions. For the co-op board, strip down to the carrying analogy and solar case—no PT jargon, just "our brains exaggerate small risks."
