prompt: |-
  I just moved into a co-housing building and we're voting next week on a communal solar-plus-battery retrofit versus staying on the municipal grid, and suddenly risk-weighted expected utility feels personal—my roommate's auditing a decision-theory seminar and she's trying to convince me that standard expected utility with a curved u() can't capture why we're scared of the blackout tail even though the bills are almost certainly higher. I need a teaching plan for her, not the actual lecture: the dependancy order so she sees why the probability weighting has to be conceptually seperate from risk aversion inside the utility function, and the carrying example that should stick—which needs exactly one high-probability small loss (the monthly cost bump) and one low-probability catastrophic failure (storm-induced grid collapse where batteries save us), plus this vague "energy sovereignty" value that shouldn't be quantified but shouldn't disappear either.

  What misconceptions will she bring—probably that we're double-counting risk or that this is just Bayesian subjective expected utility—and at which point in the arc should I defuse each? What's the check that shows she actually understands the weighting mechanism rather than memorizing the integral form? And please tell me explicitly what to leave out, like the full axiomatic derivation, since she's not math-track. One more thing: I keep mixing this up with rank-dependent formulations in my head, so build the plan so it doesn't depend on knowing those distinctions cold, but don't let me accidentally conflate them when I'm explaining it to the co-op board. No reading lists, just the conceptual dependency map and misconception sequence.
