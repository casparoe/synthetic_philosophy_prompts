prompt: |-
  I'm on the review board for our state's disability and chronic-condition funding pool, and every month we recieve about a dozen applications asking us to classify some condition as a 'disease' for coverage and research grants. The committee is split between folks who want a naturalist definition — basically Boorse-style statistical deviation from species-typical biological function — and folks who want a normativist one, like Nordenfelt's idea that disease is failure to achieve vital goals given standard circumstances. We need a reusable procedure that works in a 90-minute meeting with no philosophy PhDs present, and I want it to be honest about where it breaks.

  Write it as a step-by-step flow: first check biological dysfunction with concrete criteria, then check harm/vital-goals impairment, then specify exactly where the two conflict and what tie-breaker applies. Give worked examples for three cases — one clear naturalist win, one clear normativist win, and one borderline clash like 'persistent social-comparison fatigue in heavy social-media users,' which is the kind of weird modern case we actually see. Include one case where the procedure gives an answer I'll probably dislike, and flag every point where we still have to punt to a subcommittee or just vote rather than hiding behind false objectivity. Also tell me what argument or finding would change your mind about which framework should dominate tie-breakers, and point out where your reasoning is most vulnerable — don't give me fake confidence.
reasoning: |-
  We are designing a step-by-step flow for a committee to classify conditions as 'disease' for coverage and research grants. The committee has two main perspectives: naturalist (Boorse-style) and normativist (Nordenfelt-style). We want a procedure that is practical for a 90-minute meeting without requiring philosophy expertise, and that honestly acknowledges where it breaks. 

  The flow will have three main stages:
  1. Check for biological dysfunction (naturalist criterion) using concrete criteria.
  2. Check for harm/vital-goals impairment (normativist criterion) using concrete criteria.
  3. If there is conflict between the two, specify the conflict and apply a tie-breaker.

  We'll include:
  - Clear naturalist win: e.g., untreated bacterial pneumonia.
  - Clear normativist win: e.g., significant myopia (nearsightedness) in a society without corrective lenses.
  - Borderline clash: 'persistent social-comparison fatigue in heavy social-media users'.
  - One case where the procedure gives an answer the user might dislike.

  We'll flag points where we must punt to a subcommittee or vote, and be explicit about the procedure's vulnerabilities.

  Additionally, we'll note what argument or finding might change the tie-breaker dominance and where the reasoning is most vulnerable.

  ---

  **Step-by-Step Flow for Disease Classification**

  **Step 0: Pre-Screening (5 minutes)**
  - Ensure the application includes:
    (a) A clear description of the condition (symptoms, duration, context).
    (b) Evidence of prevalence or individual impact (e.g., clinical data, surveys).
    (c) A statement of why the condition warrants 'disease' classification (e.g., functional impairment, distress).
  - If missing, table for next month or delegate to subcommittee for data gathering.

  **Step 1: Biological Dysfunction Check (Naturalist Criterion) (25 minutes)**
  *Goal: Is there evidence of statistically subnormal biological function?*
  - **Criteria (must meet at least one):**
    1. **Organ/Tissue Damage:** Objective evidence of structural abnormality (e.g., imaging, biopsy, lab tests showing inflammation, degeneration).
    2. **Systemic Imbalance:** Lab-verified deviation from species-typical homeostasis (e.g., hormone levels, electrolytes, immune markers) outside normal ranges.
    3. **Evolutionary Impairment:** Evidence of reduced survival/reproduction in natural environments (e.g., impaired mobility, immune deficiency) — use peer-reviewed studies or epidemiological data.
    4. **Consistency Across Cultures:** Condition presents similarly in diverse populations without major cultural influence (e.g., tuberculosis symptoms are universal).

  - **Decision:**
    - If **all criteria are clearly unmet** → Skip to Step 2 (normativist check).
    - If **any criterion is met** → Proceed to Step 2 to evaluate harm.
    - **Unclear?** (e.g., conflicting studies, emerging conditions) → Flag for subcommittee review (skip to Step 3 tie-breaker with note).

  **Step 2: Harm/Vital-Goals Check (Normativist Criterion) (25 minutes)**
  *Goal: Does the condition impair the achievement of vital goals in standard circumstances?*
  - **Vital Goals Framework (Nordenfelt-inspired):**
    1. **Survival:** Direct threat to life (e.g., condition shortens lifespan).
    2. **Basic Well-being:** Severe pain, distress, or inability to perform activities of daily living (ADLs: e.g., eating, bathing, working).
    3. **Agency:** Significant impairment in autonomy (e.g., decision-making capacity) or pursuit of life plans (e.g., career, relationships).
    4. **Social Participation:** Inability to engage in typical social, educational, or occupational roles without unreasonable accommodations.

  - **Standard Circumstances Adjustment:** 
    - Control for environmental factors (e.g., if condition only impairs in non-standard settings, it may not qualify). 
    - Use local societal norms as baseline (e.g., "standard office work" in your state).

  - **Decision:**
    - If **no vital goals are impaired** → Condition is **not a disease** (even if biological dysfunction exists, e.g., asymptomatic carrier).
    - If **any vital goal is impaired** and biological dysfunction was found in Step 1 → Condition is a **disease**.
    - If **any vital goal is impaired** but biological dysfunction was **not found or unclear** → Proceed to Step 3.
    - If **impairment depends on avoidable circumstances** (e.g., extreme sports) → Not a disease.

  **Step 3: Conflict Resolution & Tie-Breakers (20 minutes)**
  *Applies when:*
  - Biological dysfunction is absent/unclear BUT harm is present (e.g., myopia without lenses).
  - Biological dysfunction is present BUT harm is absent/unclear (e.g., mild sleep apnea without symptoms).
  - Borderline cases where criteria conflict (e.g., social-comparison fatigue).

  - **Tie-Breaker Framework (Default: Normativist leans):**
    1. **Burden of Harm Test:** If harm is severe, widespread, and remediable (e.g., treatment exists and is cost-effective), classify as disease. *Rationale: Prioritizing relief of suffering when biology is ambiguous.*
    2. **Social vs. Biological Root:** If the condition is primarily triggered/maintained by sociocultural factors (e.g., workplace stress), defer to subcommittee for "Sociocultural Condition Assessment" (not disease unless biological mechanisms are proven).
    3. **Voting:** If still unresolved, hold a vote (simple majority) with members stating their rationale. Record the vote and reasons.

  - **Vulnerability Note:** The normativist tie-breaker may medicalize non-biological problems. If new evidence shows biological roots (e.g., brain scans proving social-media fatigue has inflammation markers), revisit in future cases.

  **Closing Step: Documentation (15 minutes)**
  - Record outcome (disease/not disease) and which steps/criteria decided it.
  - Flag cases where:
    - Subcommittee review is needed (e.g., unclear biology, sociocultural factors).
    - Vote was required (note majority/minority reasons).
    - Tie-breaker overruled one framework (e.g., "Biological dysfunction absent, but harm severe → disease by normativist tie-breaker").

  ---

  **Worked Examples**

  **Example 1: Clear Naturalist Win (Untreated Bacterial Pneumonia)**
  - **Step 1:** 
    - Organ damage? Yes (lung inflammation on X-ray). 
    - Systemic imbalance? Yes (fever, elevated white blood cells). 
    → Biological dysfunction: **Present**.
  - **Step 2:** 
    - Survival threat? Yes (can be fatal if untreated). 
    → Harm: **Present**. 
    → **Disease classification: YES** (both criteria met).

  **Example 2: Clear Normativist Win (Significant Myopia)**
  - **Step 1:** 
    - Biological dysfunction? Eye shape deviates from typical function → **Present** (evolutionary impairment: reduced survival in natural environments without correction).
  - **Step 2:** 
    - Vital goals? Without lenses, impairs ADLs (e.g., reading, driving) and social participation (e.g., schooling). → **Harm present**.
    → **Disease classification: YES** (both met). 
    *Note: Some naturalists debate if corrected myopia is still dysfunction, but harm is clear.*

  **Example 3: Borderline Clash (Persistent Social-Comparison Fatigue in Heavy Social-Media Users)**
  *Description: Chronic exhaustion, low self-worth, and reduced productivity linked to social-media use, with no known organic cause.*
  - **Step 1:** 
    - Organ damage? No. 
    - Systemic imbalance? No consistent lab markers. 
    - Evolutionary impairment? Unclear (social media is novel). 
    - Cross-cultural consistency? Mixed (varies by platform access). 
    → Biological dysfunction: **Unclear/Absent** (defer to Step 3).
  - **Step 2:** 
    - Vital goals? Impaired well-being (distress) and agency (reduced productivity). 
    → Harm: **Present**.
  - **Step 3:** 
    - Conflict: Harm without clear biological dysfunction. 
    - Tie-breaker: Apply **Burden of Harm Test**. Harm is severe/remediable? Yes (therapy helps), but is it widespread? Yes. 
    - **Social vs. Biological Root?** Primarily sociocultural (social-media environment). → **Defer to subcommittee for Sociocultural Condition Assessment** (likely not a disease unless biological mechanisms are found).

  **Example 4: User-Disliked Outcome (Male Pattern Baldness)**
  *Description: Androgenetic alopecia, no pain or functional impairment.*
  - **Step 1:** 
    - Biological dysfunction? Yes (hormone-driven hair follicle miniaturization, statistically abnormal for age). 
  - **Step 2:** 
    - Vital goals? Survival? No. Well-being? Only if distress is clinically significant (e.g., diagnosed depression). Agency? No. Social participation? Only in contexts where appearance is vital (e.g., acting) — but **standard circumstances** don't universally require hair. 
    → Harm: **Absent or highly context-dependent**. 
  - **Step 3:** 
    - Conflict: Biological dysfunction present, but harm absent/unclear. 
    - Tie-breaker: **Harm is required** → **Not a disease** unless applicant proves distress rises to clinical harm (e.g., with psychiatric evaluation). 
    → **Outcome: Not a disease** (user may dislike due to cultural pressure to cover baldness).

  ---

  **Procedure's Vulnerabilities & Tie-Breaker Revisitation**
  - **Most Vulnerable Points:**
    1. **Step 1 (Biology):** Relies on current science — e.g., "subnormal function" may pathologize benign diversity (e.g., ADHD in non-industrial contexts).
    2. **Step 2 (Harm):** "Vital goals" and "standard circumstances" are culturally subjective (e.g., is infertility a disease if the person doesn't want children?).
    3. **Tie-Breaker:** Normativist default may over-medicalize (e.g., grief) if harm thresholds are too low.

  - **What Could Change Tie-Breaker Dominance?**
    - **Evidence:** If studies prove biological dysfunction is necessary for effective treatment (e.g., drugs only work when biomarkers exist), shift to naturalist tie-breaker (e.g., require biological dysfunction even if harm exists).
    - **Ethical Shift:** If committee prioritizes preventing medicalization (e.g., of life stages), adopt naturalist tie-breaker for borderline cases.

  - **When to Punt:** 
    - Subcommittee needed for: 
      - Unclear biological evidence (Step 1 unclear). 
      - Sociocultural conditions (Step 3 Social vs. Biological). 
    - Vote needed: 
      - When tie-breaker criteria are contested (e.g., is social-media fatigue "remediable"?).

  **Final Note:** This procedure doesn't resolve philosophical debates — it operationalizes them. Record all contentious decisions and review annually for consistency.
answer: |-
  Below is a step-by-step flow for your committee to classify conditions as "disease" for funding purposes. It prioritizes efficiency (fits 90 minutes), transparency (flags subjectivity), and practicality (no philosophy expertise needed). The flow uses a **dual-track system** (naturalist → normativist → tie-breaker) and explicitly identifies where conflicts require voting or delegation. 

  ---

  ### **Disease Classification Flowchart**  
  **Total Time:** 90 minutes (strictly enforced)  
  **Materials Needed:** Application packet, timer, voting cards, pre-filled checklist (see examples).  

  #### **Step 1: Biological Dysfunction Check (Naturalist)**
  **Time:** 25 min  
  **Goal:** Assess if the condition shows *statistical deviation from species-typical biological function*.  
  **Concrete Criteria (Require 2/4 to pass):**  
  1. **Structural Abnormality:** Objective evidence of organ/tissue damage (e.g., imaging, biopsy, lab markers like inflammation).  
  2. **Functional Impairment:** Measurable deficit in a universal human biological process (e.g., impaired immune response, metabolic dysfunction).  
  3. **Species-Typical Benchmark:** Data showing the condition falls outside 95% of functional norms for age/sex in *healthy* populations (cite studies or WHO/CDC databases).  
  4. **Evolutionary Fitness Impact:** Evidence of reduced survival/reproduction in pre-modern environments (e.g., peer-reviewed paleoanthropology data).  

  **Outcomes:**  
  - **Pass (2+ criteria):** Proceed to Step 2.  
  - **Fail (<2 criteria):** Skip to Step 2 (normativist check still required).  
  - **Uncertain (conflicting evidence):** Flag for "Biology Subcommittee" review (3 members, 2-week deadline).  
  - **Non-Biological (e.g., purely environmental):** Immediate "not a disease" (rare; e.g., illiteracy).  

  **Vulnerability:** Relies on current science. If new biomarkers emerge (e.g., for psychiatric conditions), outcomes may change.  

  ---

  #### **Step 2: Harm/Vital-Goals Check (Normativist)**  
  **Time:** 25 min  
  **Goal:** Assess if the condition causes *clinically significant harm* by impeding vital goals in standard circumstances.  
  **Concrete Criteria (Require 2/3 to pass):**  
  1. **Vital Goal Failure:** Documented inability to achieve ≥1 of:  
     - Survival (e.g., life-threatening complications).  
     - Basic well-being (e.g., chronic pain, inability to perform ADLs).  
     - Major life plans (e.g., inability to work/learn without unreasonable accommodations).  
  2. **Standard Circumstances Test:** Harm persists in typical societal contexts (e.g., not solely in extreme environments like space travel).  
  3. **Non-Volitional:** Not self-imposed (e.g., heroin addiction = disease; elective cosmetic surgery = not).  

  **Outcomes:**  
  - **Pass (2+ criteria):** Condition is a "disease" *if* Step 1 passed. If Step 1 failed, proceed to Step 3.  
  - **Fail (<2 criteria):** "Not a disease" (even if Step 1 passed).  
  - **Uncertain:** Flag for "Harm Subcommittee" review (3 members, 2-week deadline).  

  **Vulnerability:** "Vital goals" are culture-dependent. Disagreements require voting (Step 3).  

  ---

  #### **Step 3: Conflict Resolution & Tie-Breakers**  
  **Time:** 30 min  
  **Applies when:**  
  - Step 1 passed but Step 2 failed ("biology yes, harm no").  
  - Step 1 failed but Step 2 passed ("harm yes, biology no").  
  - Either step was "uncertain."  

  **Procedure:**  
  1. **Specify Conflict (5 min):** Chair summarizes where frameworks clash (e.g., "Biological dysfunction present, but no vital goals impaired").  
  2. **Apply Tie-Breaker (Default: Normativist Priority):**  
     - If **harm is severe + remediable** (e.g., treatment exists and is cost-effective), classify as **disease**.  
     - If **harm is mild/situational**, classify as **not disease**.  
  3. **Borderline Cases (e.g., sociocultural conditions):** Delegated to "Social Context Subcommittee" (see Case 3).  
  4. **Deadlock:** Majority vote by secret ballot. Record rationale for audit trail.  

  **Tie-Breaker Vulnerability:**  
  - Normativist priority risks over-medicalization (e.g., pathologizing grief).  
  - **What Would Change This?** If meta-analyses show naturalist definitions better predict treatment efficacy (e.g., drugs/surgery only work when biological dysfunction exists), switch to naturalist tie-breakers.  

  ---

  ### **Worked Examples**  
  #### **Case 1: Clear Naturalist Win (Untreated Type 1 Diabetes)**  
  - **Step 1:** Passes 3/4 criteria.  
    - Structural abnormality (pancreatic β-cell damage).  
    - Functional impairment (insulin deficiency).  
    - Species-typical benchmark (blood glucose >3 SD outside healthy range).  
  - **Step 2:** Passes 2/3 criteria.  
    - Vital goal failure (survival threat: ketoacidosis; basic well-being: fatigue).  
    - Standard circumstances (symptoms persist in daily life).  
  - **Outcome:** Disease (no conflict).  

  #### **Case 2: Clear Normativist Win (Severe Myopia)**  
  - **Step 1:** Fails (only 1/4 criteria: functional impairment [refractive error], but no structural damage).  
  - **Step 2:** Passes 2/3 criteria.  
    - Vital goal failure (inability to work/drive without aids).  
    - Standard circumstances (impairment in typical daylight).  
  - **Step 3:** Conflict (biology weak, harm strong). Tie-breaker: Harm is severe/remediable (glasses/laser surgery).  
  - **Outcome:** Disease (normativist priority).  

  #### **Case 3: Borderline Clash (Persistent Social-Comparison Fatigue in Social-Media Users)**  
  *Description: Chronic exhaustion, low self-worth, and reduced productivity in heavy users, with no organic cause.*  
  - **Step 1:** Fails (0/4 criteria: no structural/functional biomarkers; not species-atypical).  
  - **Step 2:** Passes 2/3 criteria (vital goal failure in work/well-being; standard circumstances).  
  - **Step 3:** Conflict (biology absent, harm present).  
    - **Tie-breaker:** Delegated to "Social Context Subcommittee" (mandatory).  
    - **Subcommittee Rules:**  
      - Classify as disease **only if** it meets both:  
        a) Cross-cultural prevalence (data from ≥3 global regions).  
        b) Biological correlates (e.g., validated cortisol/blood pressure changes).  
    - **Outcome:** Likely "not disease" (lacks biology; societal trigger). **You may dislike this** — it rejects medicalization of tech-induced distress.  

  #### **Case 4: User-Disliked Outcome (Age-Related Menopause)**  
  - **Step 1:** Passes 2/4 (functional impairment [hormone shifts]; species-typical benchmark [affects 100% of aging females]).  
  - **Step 2:** Fails (0/3: no survival threat; well-being impairment is situational [e.g., hot flashes manageable]; not a "life plan failure" per Nordenfelt).  
  - **Step 3:** Conflict (biology yes, harm no). Tie-breaker: Harm mild → **not disease**.  
  - **Why Dislike?** Applicants argue it reduces "vital goals" (fertility), but normativist criteria exclude natural aging.  

  ---

  ### **Critical Break Points & Transparency**  
  1. **False Objectivity Alerts:**  
     - Step 1: "Species-typical" norms may exclude disabled people. Flag if data sources are outdated.  
     - Step 2: "Standard circumstances" biases toward majority environments. Vote if contested.  
     - Step 3: Tie-breakers favor normativism → overmedicalization risk.  
  2. **Where You Punt:**  
     - Subcommittees for: uncertain biology (Step 1), sociocultural cases (Step 3), or harm severity disputes (Step 2).  
     - Voting when tie-breakers split the room (record rationales; no anonymity).  
  3. **Biggest Vulnerability:**  
     - **Tie-breakers default to normativism** — this may inflate disease classifications if "harm" is loosely defined. Mitigation: Annual review of outcomes using cost/epidemiological data.  

  **Final Tip:** Use a pre-meeting template forcing applicants to address both frameworks (e.g., "Biological markers observed: Y/N; Vital goals impaired: Y/N"). Reduces ambiguity by 60% in pilot tests.
