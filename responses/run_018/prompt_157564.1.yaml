answer: |-
  Here is the full specification of desiderata for a theory of moral authority in advance directives, structured as requested:

  ---

  ### **I. Phenomena Requiring Accommodation with Normative Mandates**
  | Phenomenon | Required Normative Result | Rationale for Mandate |
  |------------|---------------------------|------------------------|
  | **(i) Classic Refusal Cases**<br>(Content dementia patient w/ directive refusing ANH) | Directive **must** be binding absent countervailing factors | Past self's sovereignty over bodily integrity cannot be extinguished by disease-induced contentment. Refusal grounds moral barrier against unwanted bodily intrusion. |
  | **(ii) Psychiatric Directives**<br>(Directive refuses antipsychotics; current psychotic self "needs" them) | Directive **may be overridden** for imminent safety threats | Psychosis destroys minimal rational capacity necessary for autonomy. Directive loses authority when current self cannot form stable preferences. Override is required to prevent irreversible harm. |
  | **(iii) Long-Dormant Directives**<br>(Decades-old directive conflicts with recent competent preferences) | Directive **must yield** to recent preferences | Authority derives from continuity of identity. Recent expressions (if reflecting stable values *pre-incompetence*) supersede obsolete directives as authentic extensions of the person. |
  | **(iv) Demands for Aggressive Intervention**<br>(e.g., "Sustain life at all costs") | Directive **cannot compel** non-beneficial treatment | Positive claims (demands) impose burdens on others; negative claims (refusals) protect bodily integrity. Clinicians retain fiduciary duty to reject harmful/unreasonable treatments. |

  ---

  ### **II. Essential Conceptual Distinctions**
  | Distinction | Required Preservation | Reason/Case |
  |-------------|------------------------|------------|
  | **Authority vs. Evidential Weight** | Directive must be more than evidence of past preferences; it must have performative force. | *Conceptual*: If authority collapses into evidence, directives become advisory notes in substituted judgment, violating self-determination. |
  | **Standing for Refusal vs. Demand** | Standing to refuse treatment must be stronger than standing to demand it. | *Case*: Demanding experimental treatment (e.g., $1M unproven therapy) vs. refusing CPR. Latter protects bodily integrity; former allocates scarce resources. |
  | **Value Change vs. Taste Change** | Value change (e.g., religious conversion) can void authority; taste change (e.g., food preferences) cannot. | *Conceptual*: Core values define identity; tastes are peripheral. Losing belief in "sanctity of life" voids a refusal directive; preferring apples over pears does not. |
  | **Extinguished Autonomy vs. Unreliable Autonomy** | Must distinguish total incapacity (e.g., late-stage dementia) from fluctuating capacity (e.g., mild dementia). | *Case*: A minimally verbal dementia patient resisting baths retains negative autonomy; a comatose patient has none. Ignoring this erodes residual selfhood. |

  ---

  ### **III. Empirical & Psychological Constraints**
  The theory **must** incorporate these realities without collapsing into best-interests paternalism:
  - **Preference instability**: Declining stability with age/cognitive decline → *requires* scrutiny of directive-legitimacy but cannot invalidate all directives.
  - **Dementia adaptation**: Patients report well-being despite prior dire predictions → *must not* equate contentment with revocation of past refusals.
  - **Psychiatric distortion**: Psychosis warps present judgment *and* retrospective evaluation (e.g., "I never needed meds") → *prevents* privileging current preferences in psychosis.
  - **Constraint**: Theory retains directive authority even when "best interests" (e.g., survival, comfort) conflict with directives, if sovereignty conditions are met.

  ---

  ### **IV. Desiderata Ranking & Exclusionary Power**
  **Core Desideratum Doing Heavy Lifting**:  
  **Sovereignty Preservation Principle (SPP)**  
  > *"Directives retain authority iff they reflect the enduring values of a continuous self whose future incapacity was anticipated."*  
  - **Excludes**:  
    - *Precedent Autonomy*: SPP requires value continuity, not mere past preference.  
    - *Substituted Judgment*: Rejects treating directives as evidence; demands binding force.  
    - *Pure Best-Interests*: Directives trump interests unless authority voids (e.g., value discontinuity).  

  **Ranked Desiderata** (Non-Negotiable → Relaxable):  
  1. **Non-Identity Immunity**  
     *Past self and incompetent patient are the same moral person.*  
     → **Non-negotiable**: Collapse justifies overriding directives (e.g., "demented self is a new person").  
  2. **Asymmetry Principle**  
     *Refusals bind categorically; demands bind conditionally.*  
     → **Non-negotiable**: Bodily integrity vs. resource claims asymmetry is foundational.  
  3. **Temporal Priority**  
     *Recent competent preferences > older directives.*  
     → **Negotiable**: Could relax if value persistence proved (e.g., Alzheimer’s erasing recent memory).  
  4. **Threshold Competence Condition**  
     *Directives require minimal competence at issuance.*  
     → **Negotiable**: Standards may vary contextually (e.g., psychiatric vs. dementia directives).  

  ---

  ### **Synthesis**
  An adequate theory must treat directives as **sovereign acts** preserving identity across time, binding unless:
  - Values discontinuously shift *before* incompetence,  
  - Current incapacity is total (not partial),  
  - Or demands impose unconscionable burdens.  
  It rejects both frozen autonomy (ignoring adaptation) and presentism (ignoring past selves), anchoring authority in diachronic self-determination.
