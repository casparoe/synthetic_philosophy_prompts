  - The classic refusal case (dementia patient now happy but directive refuses feeding tubes) needs to uphold refusal despite current contentment. Why? Because overriding denies the past self's sovereignty over bodily integrity.  
  - Psychiatric directives (refusing antipsychotics during psychosis) must allow override if current safety is imminently threatened. Why? Because psychosis destroys minimal rational capacity needed for any autonomy claim.  
  - Dormant directives conflicting with recent preferences should likely be voided. Why? If the recent preferences reflect a stable value shift before incompetence, they supersede ancient instructions.  
  - Demands for aggressive treatment (like "keep me alive at all costs") shouldn't bind absolutely. Why? Resource constraints and clinician integrity create moral limits no directive can override.  

  For conceptual distinctions:  
  - Authority vs. evidential weight is crucial—a directive isn't just evidence but a performative act. Collapsing this makes directives advisory rather than binding.  
  - Refusal vs. demand asymmetry matters because saying "no" to bodily intrusion is a core right, while demanding treatment imposes positive obligations.  
  - Value changes (e.g., religious conversion) vs. taste changes (e.g., food preferences) must be distinguishable because only the former can void authority.  
  - Total vs. partial incompetence distinction is needed—some dementia patients retain fragments of autonomy we shouldn't ignore.  

  Empirical constraints are tricky: must acknowledge dementia patients' unexpected well-being and psychiatry's distorted perceptions without sliding into paternalism. The theory can't ignore these but also can't make "current contentment" trump all.  

  Key desideratum that excludes competitors: *The Sovereignty Preservation Principle* does heavy lifting. It invalidates pure present-best-interests (denies past autonomy), challenges precedent autonomy (if values truly changed), and complicates substituted judgment (if later incompetent preferences differ).  

  Ranking non-negotiables:  
  1. Sovereignty Preservation (absolute)  
  2. Non-Identity Immunity (can't treat patient as new person)  
  3. Asymmetry Principle (refusals stronger than demands)  
  4. Empirical Integrity (must engage real data)  
  Relaxable: Temporal Priority could bend if values demonstrably shifted pre-incompetence.  

  The user's demand for "required not optional" outputs suggests they're frustrated with wishy-washy compromise theories. I'll need to justify why each normative conclusion is mandatory—e.g., in psychiatric cases, safety override isn't discretionary because psychosis voids *all* autonomous expression.  

