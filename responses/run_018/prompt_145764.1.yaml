prompt: |-
  Write the opening remarks for a workshop titled "The Demos We Draw," convened in the wake of a municipal decision to extend local voting rights to non-citizen residents of five years' standing while excluding seasonal agricultural workers on rolling visas who have lived continuously in the jurisdiction for three years. The audience is mixed: democratic theorists, local officials, members of the newly enfranchised community, and representatives of the excluded workers. The remarks must take the boundary problem—who belongs to the demos?—as structurally unresolved rather than decorative: every criterion proposed (residence, citizenship, affected interests, subjection to law) must be shown to draw a line that includes some and excludes others without natural justification. To avoid a standard recitation of familiar arguments, inject and rely on a specific conceptual distinction: separate "membership as authorization" (the standing to authorize collective decisions) from "membership as exposure" (being structurally subject to decisions made by others without having authorized them). The distinction should do real work in the speech, constraining what the speaker can claim—honoring the council's expansion without treating it as a solution, and acknowledging the excluded workers without collapsing their claim into that of citizens. Deliver the remarks as exactly five points, each one or two sentences, with no introductory or concluding framing outside those five. Do not name specific philosophers, cite texts, or include bibliographic references; write for an audience that includes both specialists and non-specialists.
reasoning: |-
  Okay, the user wants me to write opening remarks for a workshop titled "The Demos We Draw." This is a complex political philosophy scenario involving voting rights extensions and exclusions. 

  I need to craft five concise points that address the boundary problem of democratic membership without providing neat solutions. The key is to introduce and utilize the "authorization vs exposure" distinction meaningfully.

  The audience includes theorists, officials, enfranchised non-citizens, and excluded workers - so the tone must balance academic rigor with accessibility. I'm avoiding philosophical citations as requested.

  For structure: Point 1 should frame the core tension using municipal decision as concrete example. Point 2 introduces the conceptual distinction freshly. Point 3 applies it to critique the expansion's limitations. Point 4 addresses excluded workers' unique position. Point 5 sets up the workshop's purpose without resolution.

  The challenge is making each point stand alone while creating cumulative impact, using precise language that respects all stakeholders' perspectives. I'm particularly mindful not to equate excluded workers' situation with citizens' while acknowledging their legitimate claims.

  The remarks should feel like an invitation to grapple with the problem rather than an academic lecture. I'll ensure the authorization/exposure distinction actively shapes each point rather than being decorative.
answer: |-
  1.  We gather today because our city's recent decision to enfranchise some non-citizens while excluding long-term seasonal workers starkly reveals democracy's foundational tension: every definition of 'the people' who rule inevitably draws a boundary, including some and excluding others without a self-evident natural justification.
  2.  To navigate this productively, let's distinguish two facets of membership: **authorization** – the standing to legitimize decisions through voting – and **exposure** – being profoundly subject to the binding power of decisions made by others without your authorization.
  3.  The council’s expansion rightly recognizes that enduring residency creates a claim to authorization for some; yet, we cannot treat this line as solving the problem, for it still excludes others deeply exposed to our collective choices.
  4.  This distinction forces us to see the excluded seasonal workers not merely as non-citizens lacking authorization, but crucially, as individuals enduring high exposure to our laws and policies without any formal channel to authorize those who make them.
  5.  Therefore, this workshop confronts the unresolved work of drawing the demos: we must grapple with the inevitable exclusions produced by *any* criterion – like residency or subjection – while holding both the necessity of authorization and the injustice of unmitigated exposure firmly in view.
