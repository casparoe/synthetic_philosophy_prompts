  Final structure: 
  1. Setup contingency argument (briefly). 
  2. Contrast with Boltzmann brain probability. 
  3. Twist: God isn't a sysadmin—he's an overwhelmed devops engineer cleaning up thermal fluctuation spam. 
  4. Punchline: First cause = cosmic `sudo rm -rf` on Boltzmann brains. 

