  Hey, I'm prepping a podcast intervew with an invented guest, Dr. Mira Kess — she's an enviromental philospher who argues that habitat destruction can actually reduce net wild-animal suffering, not merely by lowering populations but through what she calls 'welfare dilution in fragmented biomes.' Her idea is that intact ecosystems sustain predator-prey stress loops that prolong chronic suffering in prey, whereas fragmentation breaks those loops and suppresses reproduction in high-fertility species. I want 8–10 quesitons that go well beyond having her restate the view; they should press where the literature on wild-animal suffering and ecosystem ethics actually presses. Specifically, I need at least one question on whether she's smuggling in a hidden normative baseline about what counts as a 'natural' welfare state, one on how she responds to the objection that fragmentation just shifts suffering into smaller, more intense local die-offs, and one on whether her reasoning implies we should actively fragment certain wilderness areas. For each of those three, please include a follow-up keyed to the reply she's most likely to give — she usually deflects empirical worries by insisting that the welfare calculus is conceptually prior to ecological management. Please write the questions in British English, and don't worry about being formal; I don't mind if there's a typo or two in your reply.
