prompt: |-
  hey im putting together the final for my grad seminar on archives and power—specifically who gets recored and the silences in sources. i want one essay question that cant be answered by just reciting foucault or derrida. so im injecting a niche scenario: digitized colonial census rolls where missing fields get filled by algorithmic imputation, meaning the archive now holds synthetic voices that were never actually recorded.

  ask students to tackle whether this creates a new kind of archival silence—one that masks itself as presence—or if it restores subaltern presence in a real way. they should have to seperate absence of evidence from evidence of absence, and explain how epistemic injustice changes when the gap is hidden behind synthetic data.

  write the exam question (about 90 minutes, ~1200 words), a model answer (~600 words), and a marking scheme that distinguishes an A answer from a B by naming the specific conceptual moves each grade needs. include a one-line note on common errors.

  format everything as a json object with these fields: "question_text" (the exam prompt), "model_answer" (the model essay), "marking_scheme" (the rubric listing A-moves and B-moves), and "common_errors" (a brief string on typical mistakes). keep the tone casual but make the content sharp.
reasoning: |-
  We are creating an exam question that requires students to engage with the complexities of archival power, specifically in the context of digitized colonial census rolls with algorithmically imputed missing fields. The question should push them beyond simply citing Foucault or Derrida and instead focus on the nuanced issues of synthetic data in archives. The key elements to address are:
   1. Whether algorithmic imputation creates a new kind of archival silence that masks itself as presence, or if it restores subaltern presence in a real way.
   2. The distinction between absence of evidence and evidence of absence.
   3. How epistemic injustice changes when gaps are hidden behind synthetic data.

   We'll structure the output as a JSON object with the following fields:
     - "question_text": The exam prompt (for a 90-minute, 1200-word essay)
     - "model_answer": A model essay of about 600 words
     - "marking_scheme": A rubric that distinguishes an A answer from a B answer by naming specific conceptual moves, and also includes a note on common errors.
     - "common_errors": A brief string on typical mistakes.

   Let's break down each part.

   Question Text:
     We want a prompt that sets up the scenario and asks the critical questions. It should be engaging and direct.

   Model Answer:
     We'll write a concise essay that addresses the prompt, demonstrating the kind of analysis we expect. It should be approximately 600 words.

   Marking Scheme:
     We'll define:
       - A answer: Demonstrates sophisticated understanding, makes specific conceptual moves (e.g., nuanced discussion of synthetic data as a form of silencing, connects to epistemic injustice, clearly separates absence of evidence from evidence of absence, and discusses the implications of the hidden gap).
       - B answer: Shows good understanding but may be less nuanced, might miss some of the deeper implications or fail to fully develop the argument about epistemic injustice changing form.

     We'll list the specific moves required for an A and those that would get a B.

   Common Errors:
     A one-line note on typical mistakes (e.g., over-reliance on theorists without applying to the scenario, conflating absence of evidence with evidence of absence, not addressing the hidden nature of the synthetic data).

   Let's create the content accordingly.
