  We are going to design a reusable audit procedure for two-player deterministic perfect-information games. The goal is to use the strategy-stealing argument to check for the possibility of a second-player win and to establish when a first-player advantage is guaranteed.

  The strategy-stealing argument typically shows that if a game is symmetric and the second player had a winning strategy, the first player could "steal" that strategy by making an extra move and then following the second player's strategy, leading to a contradiction. Therefore, the preconditions for this argument are critical.

  We break down the procedure into ordered preconditions, with each precondition having:
  - A description of what must hold.
  - What counts as sufficient evidence for it.
  - The logical conclusion at that branch (if the condition holds or fails).
  - Points where we must halt for human judgment (due to continuous values, simultaneous resolution, irreversible state changes, etc.).

  ### Ordered Preconditions Checklist for Strategy-Stealing Argument

  1. **Determinism and Perfect Information**:
     - **Condition**: The game must be deterministic (no randomness) and have perfect information (all information about the game state is available to both players).
     - **Evidence**: Rules must not include any random elements (like dice, shuffling) and must not have hidden information (like cards in hand, fog of war).
     - **Conclusion**: If false, the strategy-stealing argument does not apply. Halt and note that the game is not deterministic or not perfect-information. If true, proceed.

  2. **Finite and Discrete**:
     - **Condition**: The game must be finite (every play ends after a finite number of moves) and have a discrete state space (no continuous values that could lead to an infinite branching factor or states that cannot be enumerated).
     - **Evidence**: Rules must specify a finite set of states and moves. The game must terminate in a bounded number of moves (e.g., by having a limited board, depletion of resources, or a maximum move count).
     - **Conclusion**: If false (e.g., because of continuous values or unbounded play), halt and note that the game is not finite or discrete. If true, proceed.

  3. **No Simultaneous Moves**:
     - **Condition**: Players must alternate moves; there are no simultaneous moves.
     - **Evidence**: Rules must state that players take turns, one after the other.
     - **Conclusion**: If false (simultaneous moves are present), halt. Strategy-stealing requires alternating moves. If true, proceed.

  4. **Symmetry of Starting Position**:
     - **Condition**: The starting position must be symmetric with respect to the two players. That is, the initial state does not favor one player over the other in terms of available moves or position.
     - **Evidence**: The rules must describe an initial state that is invariant under swapping the players (e.g., an empty board, or a board with symmetric pieces). If the initial state is asymmetric, then the condition fails.
     - **Conclusion**: If false, then strategy-stealing does not apply (because the first player might have an inherent advantage due to the starting position). We cannot use strategy-stealing to rule out a second-player win. However, note that the game might still be asymmetric and we must analyze without strategy-stealing. Proceed to step 5 only if symmetric. If asymmetric, halt and note that symmetry is broken.

  5. **Symmetry of Moves**:
