answer: |-
  Here is a full specification of the desiderata for a theory of the moral status of local conventions, structured as requested. Each includes the requirement, its motivating case, a "non-negotiable/preference" flag, and notes on tensions between desiderata. A brief comparative assessment of social-contract and harm-based views follows.

  ---

  ### **Desiderata for a Theory of Local Conventions**

  #### **1. Visitor Treatment & Scope of Obligation**  
  **Requirement:** Must distinguish between:  
     - **Structural ignorance:** Visitors genuinely unable to know the convention (e.g., no signage, cultural novelty).  
     - **Knowing refusal:** Visitors aware of the convention but rejecting it (e.g., a tourist refusing to queue, calling it "irrational").  
     - **Scope:** Specify whether obligations bind *only* locally embedded participants or extend to *all* agents in the context (e.g., must a short-term tourist tip where it’s mandatory for servers’ wages?).  
  **Motivating Case:** A traveler from a non-tipping culture (e.g., Japan) dines in the U.S. and doesn’t tip, unaware that servers rely on tips for subsistence. Contrast with a European who knows but refuses, arguing tipping is exploitative.  
  **Status:** **Non-negotiable.** Any theory must address scope and epistemic conditions to avoid over-/under-ascribing blame.  

  #### **2. Arbitrary Coordination vs. Harm-Prevention**  
  **Requirement:** Must distinguish conventions that are *morally arbitrary coordination tools* (e.g., driving on left/right) from those that *prevent direct harm to vulnerable parties* (e.g., tipping where wages are below minimum). The theory must explain when violation shifts from mere inconvenience to wrongful harm.  
  **Motivating Case:** Skipping a queue causes frustration (arbitrary harm), but not tipping a server who relies on tips for rent causes material deprivation (vulnerability-harm). Jaywalking on an empty street (coordination failure) vs. jaywalking that causes a traffic accident (direct harm).  
  **Status:** **Non-negotiable.** A theory collapsing this distinction fails basic moral intuitions about harm.  

  #### **3. Pluralistic Ignorance**  
  **Requirement:** Must explain why individuals enforce conventions they privately reject (e.g., "Everyone tips 20%, but I hate it") without reducing morality to *de facto* social pressure. Should account for moral reasons to retain/reject such conventions.  
  **Motivating Case:** A society where most privately oppose lavish wedding gifts but still give them due to perceived expectations, perpetuating financial strain. Or "mandatory" holiday bonuses in underpaid industries.  
  **Status:** **Non-negotiable.** A theory must address systemic false beliefs to avoid justifying oppressive norms.  

  #### **4. Moral Exemption Zones**  
  **Requirement:** Must identify conventions so weakly justified that non-compliance is *not blameworthy* despite causing minor inconvenience (e.g., jaywalking on empty streets, skipping a queue when late for an emergency).  
  **Motivating Case:** Jaywalking at 3 a.m. with no traffic violates a coordination rule but causes no risk/harm. Contrast with jaywalking during rush hour.  
  **Status:** **Preference (moderate).** Most theories accept threshold-based exemptions, but strict deontological views may resist.  

  #### **5. Universalizability vs. Local Participation**  
  **Requirement:** Must reconcile whether universalizability demands visitors follow local norms *always*, or whether obligations depend on context-specific participation/benefits. Must avoid collapsing into relativism (e.g., "local = right") or absolutism ("visitors must always comply").  
  **Motivating Case:** A vegan visiting a culture with ritual meat-eating: must they participate? A Scandinavian refusing to bribe officials in a corrupt country, despite local norms.  
  **Status:** **Preference (deep).** Reflects core divides (Kantian vs. communitarian).  

  ---

  ### **Tensions & Joint Unsatisfiability**  
  - **Major Tension:** **Desideratum 1 (obligations to visitors) vs. Desideratum 5 (local participation justification).**  
    - If obligations extend to *all* agents universally (per harm-based views), this conflicts with justifications rooted in *local* cooperation (e.g., social contracts).  
    - **Example:** If tipping is obligatory *only* because locals benefit from the system (social contract), why bind ignorant visitors? If it’s obligatory due to harm-prevention (vulnerable workers), visitors *are* bound regardless of participation.  
    - **Likely Unsatisfiable Pair:** Universal obligations to visitors + strictly local-participation justifications.  

  ---

  ### **How Leading Theories Fare**  
  | **Desideratum**       | **Social-Contract View**                                                                 | **Harm-Based View**                                                                 |  
  |------------------------|------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------|  
  | **1. Visitor Treatment** | Obligations bind only participants ("contractors"). Ignorant visitors exempt; refusal may challenge legitimacy. | Obligations bind all agents who risk harm. Ignorance mitigates blame; refusal requires harm-based justification. |  
  | **2. Arbitrary vs. Harm** | Distinction secondary; focus is on stability. Harm conventions may be prioritized if systemic collapse harms. | Core distinction: moral weight hinges on vulnerability/preventable harm. |  
  | **3. Pluralistic Ignorance** | Explains as coordination failure; may prescribe reform if convention undermines mutual benefit. | Labels it "harm by complicity"; emphasizes moral duty to correct false beliefs. |  
  | **4. Moral Exemption Zones** | Broad: exemptions where violations don’t threaten system stability (e.g., rare jaywalking). | Narrow: exemptions only if no risk of harm (e.g., empty street). |  
  | **5. Universalizability** | **Weak:** Obligations tied to local reciprocity. Visitors not bound unless they benefit. | **Strong:** Harm-based duties bind universally; visitors must comply to avoid harm. |  

  ---

  ### **Key Takeaways**  
  - **Non-negotiables (2,3)** require explaining harm distinctions and pluralistic ignorance.  
  - **Visitors (1)** and **universalizability (5)** expose the core tension: *Can "local" obligations be moral if not universal?*  
  - **Social-contract** struggles with universal duties to visitors; **harm-based** struggles with arbitrary conventions.  
  - A hybrid theory may be needed—e.g., conventions are *prima facie* obligations if they prevent harm or sustain beneficial cooperation, but exempt where justification is trivial or participation non-existent.  

  This framework forces theories to confront whether "conventional obligations" are morally distinctive or reducible to harm/consent. The visitor/universality tension is the litmus test.
