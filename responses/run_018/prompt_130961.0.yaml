  Let me unpack their five requested elements carefully. First, they want distinctions in how visitors are treated, especially regarding ignorance vs refusal and whether obligations extend beyond local participants. That's crucial because real-world cases (like tourists not tipping in tipping cultures) expose theoretical cracks. Second, the arbitrary vs protective convention distinction matters for cases like tipping (where livelihoods depend on it) versus queueing (mere inconvenience). Third, pluralistic ignorance is a sneaky problem—think of customs everyone hates but nobody challenges, like outdated dress codes. Fourth, "moral exemption zones" could cover things like jaywalking in empty streets versus crowded ones. Fifth, the universalizability vs local participation tension is the big one—can a theory demand visitors follow local norms without endorsing relativism?

  The user also wants meta-commentary: flag non-negotiables versus camp-specific preferences, and note potential incompatibilities. They're hinting at a core tension between universal obligations and locally grounded justifications. Smart. 

  For structure, I'll tackle each desideratum with: (1) precise specification, (2) motivating case, (3) non-negotiable/preference flag, and (4) how social contract vs harm theories handle it. The universal obligation vs local participation conflict in desiderata 1 and 5 needs special attention—they might be jointly unsatisfiable. Social contract theories lean local; harm theories lean universal. That tension is unavoidable. 

  I should emphasize that desiderata 2-4 are non-negotiables for any adequate theory, while 1 and 5 reflect deeper philosophical splits. The harm vs contract contrast will resurface throughout. User seems ready for this nuance—their query shows they've already spotted these fault lines. 

