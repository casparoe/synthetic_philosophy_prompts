prompt: |-
  I'm a software engineer with no formal philosophy background. I'm designing the "belief" layer of a reasoning system: a component that takes a probabilistic evidence base and outputs the claims the system may treat as settled for downstream planning. Before I commit to an implementation, I want an engineering-style requirements specification for what an adequate theory of rational acceptance has to satisfy. I am not asking for a survey of the literature or citations; the analysis should stand on its own.

  The two failure modes that worry me are the lottery paradox and the preface paradox, as I understand them.

  Lottery. A fair lottery has one million tickets and exactly one winner. For each ticket i, the evidence makes it 0.999999 likely that ticket i loses. A fixed-threshold rule — accept a claim iff its probability is at least 0.999 — therefore accepts "ticket i loses" for every i. If the system is allowed to conjoin claims it has accepted, it ends up accepting "every ticket loses," which contradicts its certain background knowledge that one ticket wins. So at least one of the threshold rule, closure under conjunction, and the requirement that an accepted body of claims be consistent must give. I want a principled account of which gives and why, not an ad hoc patch.

  Preface. An author writes a long, carefully checked nonfiction book. For each sentence, her checking is good enough that she rationally accepts that sentence. But she also has strong inductive grounds, from experience with long books and human fallibility, for accepting that at least one sentence in the book is false — and she says so in the preface. Her total set of accepted claims is inconsistent, and she can see that, yet she seems rational rather than confused. An adequate account must explain this: whether consistency is not a genuine requirement, whether she never really accepts the conjunctions, whether the preface claim is a different kind of acceptance, or something else.

  Please write the desiderata: the full list of requirements that a theory of rational acceptance (or of whatever the correct primitive turns out to be — graded credence alone, acceptance plus credence, context-dependent standards, etc.) must meet in order to handle these cases and be adequate for a truth-seeking reasoner. Treat the lottery and preface cases as non-optional test cases, but derive general requirements from them rather than just those two cases.

  For each requirement, provide:
  - a name and a one-sentence statement;
  - the motivating case or argument — a specific example, not just an appeal to intuitiveness;
  - a classification: non-negotiable, negotiable, or partially negotiable, with a sentence justifying the classification;
  - which naturally tempting positions it rules out or constrains.

  Pay particular attention to distinctions a theory may not collapse — e.g., degrees of confidence vs. all-or-nothing acceptance, acceptance for action vs. acceptance as true, and each claim's being individually acceptable vs. the conjunction's being acceptable — and to which results from probability theory or deductive logic a theory must respect and which it may reject or reinterpret.

  Then include:
  (1) a joint-satisfiability check: which pairs or subsets of the requirements conflict, why, and what reconciliation moves are available;
  (2) the single requirement that does the most work excluding candidate accounts, with a paragraph justifying that choice;
  (3) a brief scorecard for these four candidates against the list: (a) the fixed-threshold rule; (b) a view that keeps only graded probabilities and denies that there is any separate all-or-nothing acceptance; (c) a view on which standards of acceptance shift with stakes or context; (d) a view that treats consistency and closure as long-run ideals rather than requirements an agent must meet at every moment. Keep the scorecard brief; the requirements and their motivating cases are the deliverable.

  Return the result as a single JSON object with exactly this schema and nothing outside it:

  {
    "summary": "one-sentence summary of the spec",
    "requirements": [
      {
        "id": "req-1",
        "name": "short label",
        "statement": "one-sentence statement of the requirement",
        "motivating_case_or_argument": "specific case or argument that makes it binding",
        "necessity": "non-negotiable | negotiable | partially-negotiable",
        "necessity_rationale": "why it has that classification",
        "candidates_constrained": "which candidates or natural views it rules out or limits"
      }
    ],
    "tensions": [
      {
        "requirement_ids": ["req-1", "req-2"],
        "conflict": "why they cannot be jointly satisfied as stated",
        "reconciliation_options": "what a theory could give up or reinterpret"
      }
    ],
    "highest_leverage_requirement": {
      "id": "req-3",
      "rationale": "why this requirement does the most to narrow the space"
    },
    "candidate_scorecard": [
      {
        "candidate": "fixed-threshold rule",
        "verdict": "how it fares overall",
        "main_failure_or_insight": "which requirement it chiefly violates or illuminates"
      }
    ]
  }

  Stick to these keys; put all prose in the string fields rather than in separate commentary.
reasoning: |-
  We are designing a set of requirements for a theory of rational acceptance. The theory must handle the lottery paradox and the preface paradox as test cases, but the requirements should be general.

  Key insights from the paradoxes:

  Lottery:
  - For each ticket, we have high probability (0.999999) that it loses.
  - But we know exactly one wins, so the conjunction of all "ticket i loses" is false.
  - If we accept each "ticket i loses" (by a high threshold) and also accept closure under conjunction, we get a contradiction.

  Preface:
  - For each sentence in the book, the author has high justification and accepts it.
  - But the author also accepts that at least one sentence is false (preface claim).
  - So the set {sentence1, sentence2, ..., preface_claim} is inconsistent.

  Requirements we might derive:

  1. Consistency: The set of accepted claims must be consistent.
     - But the preface seems to show that sometimes we have inconsistent acceptances and are rational.

  2. Closure under conjunction: If you accept A and accept B, then you should accept A∧B.
     - But in the lottery, if we do that, we get an inconsistency.

  3. High probability suffices for acceptance (with a threshold).
     - But then in lottery, we accept each ticket loses, leading to problem.

  Alternatively, we might reject consistency or closure. But we need a principled reason.

  We might also consider:

  - The distinction between accepting a claim for practical purposes (action) and accepting it as true (theoretical). 
  - The role of context or stakes: maybe the threshold for acceptance changes with context.
  - Using graded beliefs (probabilities) without all-or-nothing acceptance.

  But we need requirements that any theory must satisfy.

  Let's list requirements:

  1. Non-negotiable: The system must avoid known contradictions. (Because if you accept a contradiction, you can prove anything, which is bad for truth-seeking.)
     - But note: in the preface, the author accepts an inconsistent set, but doesn't necessarily believe the contradiction? She just believes each sentence and believes at least one is false. She doesn't believe a specific contradiction? However, the set is inconsistent.

     However, the requirement might be: the set of accepted claims must be consistent? Or perhaps: the agent must not accept a claim that is logically false? But in the preface, the agent doesn't accept a contradiction; she accepts a set that is inconsistent. She doesn't accept the conjunction of all the sentences and the preface claim? So maybe we require that the set of accepted claims is consistent? But then the preface case becomes problematic.

  2. We might require that the system must be able to accept highly probable claims. (Otherwise, we never accept anything.)

  3. We might require that the system must be able to accept the conjunction of two claims it accepts? But lottery shows that leads to trouble.

  Alternatively, we might require that the system should not accept claims that it can see are jointly inconsistent? But in the lottery, if the system accepts each "ticket i loses", and it knows that these claims together with the background knowledge entail a contradiction, then it shouldn't accept them all? But each one individually is fine.

  So perhaps:

  - Requirement: If the agent accepts a set of claims and can see (with available resources) that they are inconsistent, then that is irrational. But in the lottery, the agent can see the inconsistency? Yes, because the agent knows that exactly one ticket wins. So if the agent accepts for every ticket that it loses, then the agent has accepted that no ticket wins, which contradicts the background knowledge. So the agent should not accept all of them? But each one is highly probable.

     This suggests that the agent must not accept a set of claims that it knows (or can easily deduce) is inconsistent.

     In the preface, the author knows that the set of claims (all the book sentences and the preface claim) is inconsistent? She knows that if all the sentences are true then the preface claim is false, and vice versa? She does. But she still rationally accepts each. So we have a conflict.

     Therefore, we must either:
     - Deny that the author accepts the conjunction of all the sentences? (So closure under conjunction fails.)
     - Or deny that the author accepts the set of all the sentences and the preface claim at the same time? (But she does.)

     Alternatively, we might say that the author's acceptance of the preface claim is of a different kind? Or that the acceptance of each sentence is provisional? 

  Given these, we derive the following requirements:

  Requirement 1: Individual High Probability Acceptance (non-negotiable)
     - Statement: A claim with sufficiently high probability (given the evidence) must be acceptable.
     - Motivating case: In the lottery, each "ticket i loses" has probability 0.999999, which is very high. It would be irrational not to accept that a particular ticket loses when the odds are so high. Similarly, in everyday life, we accept many things on less evidence.
     - Necessity: non-negotiable, because without it we would be paralyzed, unable to accept anything short of certainty.
     - Candidates constrained: Views that require certainty for acceptance.

  Requirement 2: Avoid Known Inconsistency (non-negotiable)
     - Statement: The agent must not accept a set of claims that it can see (with reasonable effort) is inconsistent.
     - Motivating case: In the lottery, if the agent accepts that every ticket loses, then it would be accepting a claim that contradicts the known fact that one ticket wins. This is irrational because it directly violates the truth-seeking goal.
     - Necessity: non-negotiable, because accepting a known inconsistency allows deriving any arbitrary claim, which is catastrophic for truth-seeking.
     - Candidates constrained: Views that allow known inconsistencies to be accepted (e.g., some paraconsistent approaches).

  Requirement 3: Conjunction Closure (partially negotiable)
     - Statement: If the agent accepts A and accepts B, then the agent must accept A∧B.
     - Motivating case: If we accept that the switch is on and that the light is off, we should accept that the switch is on and the light is off. Without such closure, reasoning becomes fragmented and the agent might fail to draw obvious conclusions.
     - Necessity: partially negotiable, because in the lottery and preface cases, strict closure leads to inconsistency. However, some form of closure is needed for coherent reasoning.
     - Candidates constrained: Views that reject closure entirely (which might lead to fragmented belief) and views that insist on strict closure (which then must explain the lottery and preface).

  Requirement 4: Contextual Sensitivity (negotiable)
     - Statement: The standards for acceptance may depend on the context, such as the stakes or the purpose of the inquiry.
     - Motivating case: In a low-stakes context, we might accept a claim with 0.95 probability, but in a high-stakes context (e.g., medical diagnosis) we require 0.999. This is because the cost of error varies.
     - Necessity: negotiable, because one might design a system without context-dependence, but it is a natural way to handle the variance in required confidence.
     - Candidates constrained: Fixed-threshold rules (if they are rigid across contexts).

  Requirement 5: Distinction Between Acceptance and Credence (non-negotiable)
     - Statement: The theory must not collapse the distinction between graded credence (probability) and all-or-nothing acceptance; they serve different functional roles.
     - Motivating case: In the preface, the author has high credence in each sentence and also high credence that at least one is false, but she still accepts each sentence individually. Acceptance is for use in reasoning and action, and it may not be simply a high credence. Without this distinction, we cannot explain why the author is rational in having these attitudes.
     - Necessity: non-negotiable, because the two notions are functionally distinct: acceptance is binary and used in reasoning, while credence is for nuanced updating and decision-making.
     - Candidates constrained: Views that reduce acceptance to high credence (e.g., the fixed-threshold rule without further adjustments) and views that ignore credence entirely.

  Now, tensions:

  - Requirement 1 (individual high probability acceptance) and Requirement 3 (conjunction closure) and Requirement 2 (avoid known inconsistency) conflict in the lottery. 
     - If we accept each ticket loses (by Requirement 1) and we close under conjunction (Requirement 3), then we accept a contradiction, violating Requirement 2.
     - Reconciliation: We can drop Requirement 3 (or weaken it) so that the agent does not have to accept the conjunction of all the individual acceptances. Or we can adjust Requirement 1 so that in cases where the individual acceptances are not independent and their conjunction is highly improbable, we do not accept each one? But note the lottery: each one is highly probable, but the conjunction is not. Alternatively, we might say that the agent does not accept each ticket loses? But that seems wrong.

     The standard move is to drop or restrict closure.

  - Similarly, in the preface, the same conflict between Requirements 1, 3, and 2.

  Highest leverage requirement: Requirement 5 (distinction between acceptance and credence). Why? Because it forces a separation that many theories (like fixed-threshold) collapse. Without this distinction, we cannot account for the preface paradox: the author has high credence in each sentence and in the preface claim, but she does not (and should not) accept the contradiction. The functional role of acceptance (for use in the book, for acting as if true) is different from merely having a high credence. This requirement rules out the fixed-threshold view and the view that only uses graded probabilities without acceptance.

  Candidate scorecard:

  (a) fixed-threshold rule:
     - Verdict: Fails overall because it leads to inconsistency in lottery and preface.
     - Main failure: It violates Requirement 2 (avoid known inconsistency) when combined with Requirement 3 (closure). But without closure, it might avoid inconsistency? However, if the system has closure (as is natural for a reasoning system), then it fails. Also, it collapses acceptance and credence (violating Requirement 5).

  (b) graded probabilities only (no all-or-nothing acceptance):
     - Verdict: Avoids the paradoxes by denying acceptance, but may be inadequate for downstream planning which often requires binary decisions.
     - Main failure: It violates Requirement 5 (by denying the distinction and the need for acceptance) and fails to provide a binary layer for planning.

  (c) context-dependent standards:
     - Verdict: Helps in some cases (e.g., adjusting thresholds with stakes) but does not by itself resolve the lottery and preface.
     - Main failure: Without additional moves (like restricting closure), it still faces the lottery and preface. It might satisfy Requirement 4 but fail on Requirement 2 if it doesn't address the inconsistency.

  (d) consistency and closure as long-run ideals:
     - Verdict: May handle the preface by saying that the author is not required to have a consistent set at every moment, but in the long run she should. But in the lottery, the agent knows the inconsistency immediately.
     - Main failure: It relaxes Requirement 2 and Requirement 3, but then the agent may have to reason with an inconsistent set, which is problematic for truth-seeking.

  Now, we write the requirements in the JSON format. We must have at least the ones above, but we might refine.

  We'll assign ids:

  req-1: IndividualHighProbability
  req-2: AvoidKnownInconsistency
  req-3: ConjunctionClosure (partially negotiable)
  req-4: ContextualSensitivity (negotiable)
  req-5: AcceptanceCredenceDistinction (non-negotiable)

  But note: we might need a requirement about the connection to action? The problem says "for downstream planning", so perhaps:

  Requirement 6: Actionability (non-negotiable)
     - Statement: The acceptance of a claim must license using it as a premise in practical reasoning and planning.
     - Motivating case: If the system accepts that a bridge is safe, it should be able to plan to cross it. Without this, the acceptance layer is disconnected from its purpose.
     - Necessity: non-negotiable, because the system is for planning.
     - Candidates constrained: Views that make acceptance too weak to support action (e.g., some noncognitivist or expressivist views) or views that separate acceptance for truth from acceptance for action.

  But the problem says "the claims the system may treat as settled for downstream planning", so actionability is built in.

  We might also add:

  Requirement 7: Non-Dogmatism (negotiable)
     - Statement: The system should be open to revising accepted claims in light of new evidence.
     - But that is more about dynamics, not the static picture.

  Given the focus on the two paradoxes, we'll stick to the core.

  We have five requirements. We must write the JSON accordingly.

  Tensions:

  - Between req-1, req-3, and req-2: as explained.

  Reconciliation: A theory might drop or restrict req-3 (closure under conjunction) so that the agent does not have to accept the conjunction of a very large set of individually accepted claims. Alternatively, it might adjust req-1 so that in contexts where the individual claims are not independent and the conjunction is improbable, the threshold is raised. Or it might use req-4 (contextual sensitivity) to adjust the threshold in such cases.

  Highest leverage: req-5.

  Now, the candidate scorecard:

