prompt: |-
  Hey — I run a tiny reading group in phil of science, and two of the regulars have spent a whole term going around in circles about verisimilitude and I want to force them to write something constructive instead. One of them is in the "likeness" / logical-space camp (the Tichý–Hilpinen–Niiniluoto–Oddie style idea that a theory's closeness to the truth is a function of how close to the actual world the worlds are in which the theory would be true); the other is in the "relevant consequence" camp (Schurz–Weingartner-ish: closeness is a matter of which consequences the theory gets right, and Popper's real mistake was an over-generous notion of consequence or content). They both accept that Popper's own truth-content-minus-falsity-content defintion is dead — the triviality result from the 70s, on which no false theory can be closer to the truth than another — and neither wants to re-litigate that.

  So: draft the joint statement such an adversarial collaboration should produce. Format it as (1) a numbered agreed-claims section, (2) a disagreements table, (3) a cruxes section.

  The agreed claims should include what the concept is even for — what work "closer to the truth" has to do inside an account of scientific progress, given that our best theories are strictly false — and what the triviality result does and does not establish. Don't let them agree to anything vacuous; if a claim is only jointly signable because both sides mean something different by a key word, keep it but flag it.

  The disagreements table: one row per disagreement, each row containing two formulations, one in the wording the likeness person would sign and one in the wording the consequence person would sign, and nothing either would reject as a statement of their own view.

  The cruxes section is the part I actually care about. For each crux give a concrete case both would accept as bearing on it, and write down in advance what each of them predicts the right verdict is. Build the cases around these, which are the things my group keeps getting stuck on:

  - A theory that says a quantity is 5.0 when it is really 5.1, versus one that says 5.0 when it is really 50. Can either apparatus grade the near-miss as better without just smuggling in a metric, and where is that metric supposed to come from?
  - Re-describing the same domain in a grue-ish / gerrymandered vocabulary and asking whether the truthlikeness ordering survives. If one camp's ordering flips under re-description and the other's doesn't, say that explicitly and say what each side will claim it shows.
  - "Padding": conjoining a theory with an irrelevant but true claim about a seperate subject matter, or adding an unconstrained parameter. Should that leave closeness to the truth unchanged? My suspicion is they have opposed intuitions here and that neither has noticed.
  - Cross-domain comparison: whether a false theory in one field can be closer to the truth than a false theory in a completely different field, and what that implies about how relevance gets fixed.

  Aim for something we could read out loud in about fifteen minutes, and don't bother with citations or footnotes, we know the literature. Two more things: at the end, have each side say, in one sentence, what argument or case would actually get them to switch; and add a short note from you on which jointly-signed claim is the most likely fudge, and where the residual disagreement is verbal rather than substantive (if any of it is).
reasoning: |-
  We are drafting a joint statement for two adversarial collaborators in the philosophy of science reading group. The topic is verisimilitude (truthlikeness). The two camps are:

  1. **Likeness camp (Logical Space)**: Truthlikeness is about the closeness of the worlds in which a theory is true to the actual world. (Tichý, Hilpinen, Niiniluoto, Oddie)
  2. **Consequence camp (Relevant Consequence)**: Truthlikeness is about the true and false consequences of a theory, with a focus on relevant consequences. (Schurz, Weingartner)

  They agree that Popper's original definition (truth content minus falsity content) is dead due to the 1970s triviality result (which showed that no false theory can be closer to the truth than another under that definition) and don't want to re-litigate that.

  The structure of the document:

  1. **Agreed Claims**: Numbered list of claims both sign, but flag any where a key word might be interpreted differently by each side.
  2. **Disagreements Table**: Table with one row per disagreement. Each row has two formulations: one in the likeness camp's wording and one in the consequence camp's wording. Each formulation should be acceptable to the respective camp and not rejected as a misstatement of their view.
  3. **Cruxes Section**: For each crux, provide a concrete case both accept as bearing on it. State what each camp predicts the right verdict is. The cruxes are:
     - **Near-miss vs. wild miss**: Theory A: quantity=5.0 (actual=5.1) vs. Theory B: quantity=5.0 (actual=50). Can either approach grade the near-miss as better without smuggling in a metric? Where does the metric come from?
     - **Re-description (grue-style)**: Does the truthlikeness ordering survive a gerrymandered re-description of the vocabulary? If one camp's ordering flips and the other's doesn't, state that and what each side claims it shows.
     - **Padding**: Conjoining a theory with an irrelevant true claim or adding an unconstrained parameter. Should that leave truthlikeness unchanged? They may have opposed intuitions.
     - **Cross-domain comparison**: Can a false theory in one field be closer to the truth than a false theory in another? What does this imply about relevance?
  4. **Closing**: Each side says in one sentence what argument or case would make them switch camps.
  5. **Note from the drafter**: Identify which agreed claim is most likely a fudge (i.e., they mean different things by a key word) and where the residual disagreement is verbal rather than substantive.

  The whole should be readable in about 15 minutes.

  Let's start drafting.

  ---

  **Joint Statement on Verisimilitude**

  **1. Agreed Claims**

  We, the undersigned, agree on the following points:

  1.1. The concept of verisimilitude is necessary to account for scientific progress in a non-Whiggish manner. Even when our best theories are strictly false, we can meaningfully say that one is closer to the truth than another, thus allowing for a cumulative and progressive view of science without requiring that we have attained the whole truth.

  1.2. Popper's original definition of verisimilitude (in terms of truth content minus falsity content) is untenable due to the 1970s triviality result. This result shows that, under Popper's definition, no false theory can be closer to the truth than another false theory. We accept this as a fatal flaw and do not seek to revive Popper's definition.

  1.3. The triviality result does not, however, imply that the concept of verisimilitude is incoherent. It only shows that Popper's particular logical definition fails. Alternative approaches (like the likeness account or the relevant consequence account) are viable and needed.

  1.4. Any adequate account of verisimilitude must avoid the problems of language dependence and triviality. It should also be able to handle both quantitative and qualitative theories.

  *Flag on 1.4*: The term "language dependence" might be interpreted differently. The likeness camp typically takes the notion of "world" or "state" as prior to language, while the consequence camp works within a linguistic framework. Both agree that the account should not be unduly sensitive to arbitrary changes in language, but they may differ on what counts as arbitrary.

  **2. Disagreements Table**

  | Disagreement                                                                 | Likeness Camp Formulation                                                                                                | Consequence Camp Formulation                                                                                               |
  | :--------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------- |
  | **The nature of truthlikeness**                                              | The truthlikeness of a theory is a function of the similarity between the actual world and the set of worlds in which the theory is true. | The truthlikeness of a theory is a function of the balance of its true and false relevant consequences.                  |
  | **The role of language/logic**                                               | The structure of logical space (and hence similarity between worlds) is prior to and independent of any particular linguistic representation. | The relevant consequences of a theory are determined by a canonical formulation that avoids irrelevant logical compounds. |
  | **The basis for comparison**                                                 | Truthlikeness comparisons are grounded in a metric over possible worlds, which may be context-dependent but is not arbitrary. | Truthlikeness comparisons are grounded in the set of basic relevant propositions that a theory entails.                  |

  *Note*: Each formulation is acceptable to the respective camp and is not a misstatement of their view.

  **3. Cruxes Section**

  We present concrete cases to highlight the cruxes of our disagreement. For each, we state the case and then the predictions of each camp.

  **Crux 1: Near-miss vs. wild miss**

  *Case*: Consider two false theories about a quantity (e.g., the speed of light in a vacuum). Theory A says the value is 5.0 units (actual is 5.1). Theory B says the value is 5.0 units (actual is 50). Is A closer to the truth than B?

  - **Likeness camp verdict**: Yes. The set of worlds where A is true (i.e., where the quantity is exactly 5.0) is closer to the actual world (where it is 5.1) than the set of worlds where B is true (where it is 5.0) is to the actual world (where it is 50). This requires a metric over the quantity, which is natural in this context (e.g., absolute difference). The metric is not smuggled; it is part of the structure of the logical space (e.g., the quantity is a real number with a standard metric). Without such a structure, likeness accounts cannot get off the ground, but they argue that such structure is often available in scientific contexts.

  - **Consequence camp verdict**: It depends. If we consider the relevant consequences, such as the proposition that the value is between 4.9 and 5.1, then A might entail this (if we interpret the theory as implying a range) while B does not. However, if we take the theories as exact point estimates, then both are equally false in terms of the atomic proposition. To capture the near-miss, we need to include relevant consequences that are about approximate values. The metric for approximation must come from the scientific context and the relevance of errors. Without a notion of relevant approximation, the consequence account might not distinguish A and B.

  **Crux 2: Re-description (grue-style)**

  *Case*: Suppose we have two theories in a domain with two properties: color (blue/green) and time (before/after t). The actual world is: object is blue before t and green after t. Theory A says it is blue always; Theory B says it is green always. Now, re-describe the properties using "grue" (blue before t, green after t) and "bleen" (green before t, blue after t). In the new vocabulary, the actual world is grue always. Theory A (blue always) becomes grue before t and bleen after t. Theory B (green always) becomes bleen before t and grue after t.

  - **Likeness camp verdict**: The truthlikeness ordering should be invariant under re-description because the worlds are the same, only the labels have changed. In the original description, A is false because after t it is not blue (it is green) but is blue before t, so it gets half right. B is false because before t it is not green (it is blue) but is green after t, so also half right. But under a natural metric, the actual world might be closer to one set than the other? Actually, in this case both A and B are equally distant? This might be a bad example because without a metric over the property space, likeness might not distinguish. Alternatively, if we consider the worlds, A is true in worlds where the object is blue at all times, which are far from the actual world if we have a similarity metric over color-time states. The key point: the likeness account insists that the ordering should not flip under re-description because the underlying reality is the same. If it does flip, that is a flaw in the account.

  - **Consequence camp verdict**: The ordering might flip under re-description. In the original language, the relevant consequences might be about color at specific times. Theory A has the true consequence that it is blue before t but false that it is blue after t. Similarly, B has true that it is green after t but false that it is green before t. In the grue language, the actual theory is "grue at all times". Theory A in grue terms is "grue at t if t< t, else bleen" which is not equivalent to a simple claim. The consequence camp must specify a canonical way to express consequences. If the re-description changes what counts as a relevant consequence, then the ordering might change. The camp argues that relevance is fixed by the scientific context, and gerrymandered predicates (like grue) are not scientifically relevant, so the ordering should not flip when using such predicates. But if we force the use of grue, then the account might give a different ordering, which they would regard as a problem for the language, not the account.

  *Clarification*: Both camps aim for invariance under "natural" re-descriptions, but they might disagree on what is natural. The grue case is meant to test if the account is sensitive to gerrymandered predicates.

  **Crux 3: Padding**

  *Case*: Take a theory T that is false but somewhat close to the truth in its domain. Now consider:
  - T1: T conjoined with an irrelevant true claim, e.g., "and the number of planets is 8".
  - T2: T with an unconstrained parameter added, e.g., a parameter that can take any value without affecting the rest of the theory.

  Should T1 and T2 be equally close to the truth as T?

  - **Likeness camp verdict**: For T1: The set of worlds where T1 is true is the intersection of the set for T and the set where the number of planets is 8. This set is a subset of the set for T and might be farther from the actual world if the actual number of planets is 8 (since the worlds in the subset are otherwise like T-worlds). But if the added claim is true and irrelevant, it might not change the similarity to the actual world. Actually, in likeness accounts, adding a true conjunct typically restricts the set of worlds, which might make the theory less verisimilar if it moves away from the actual world? Or more? This is complex. In Niiniluoto's account, adding a true conjunct can increase verisimilitude if it adds truth, but if it is irrelevant, it might not. In the unconstrained parameter case (T2), the theory is weaker and true in more worlds, including ones very far from actuality, so it might be less verisimilar.

    Expected verdict: T1 might be slightly closer if the added truth is about the actual world, but if it's irrelevant, it shouldn't help much. T2, by making the theory weaker, might be less verisimilar because it allows worlds that are far away.

  - **Consequence camp verdict**: For T1: Adding a true irrelevant consequence should not increase verisimilitude because the consequence is not relevant. The relevant consequences of T1 are the same as those of T plus the one about planets, but since the planet claim is irrelevant to the domain, it might not count. Schurz-Weingartner require that consequences be relevant and non-redundant. So T1 should not be closer than T. For T2: Adding an unconstrained parameter makes the theory have fewer relevant consequences (because it is weaker) and might not add any true relevant consequences. So T2 should be less verisimilar than T.

    Expected verdict: T1 is not closer than T, and T2 is less close than T.

  *Summary*: Likeness camp might see T1 as slightly better (if the added truth is true and the world is still close) but T2 as worse. Consequence camp sees T1 as not better and T2 as worse.

  **Crux 4: Cross-domain comparison**

  *Case*: Consider a false theory in physics (e.g., Newtonian mechanics, which is false but close to truth in its domain) and a false theory in astrology (e.g., all Aries are bold, when actually only 40% are). Can we say that Newtonian mechanics is closer to the truth than the astrology theory?

  - **Likeness camp verdict**: Yes, in principle. The worlds where Newtonian mechanics is true are much closer to the actual world (e.g., they approximate actual motions well) than the worlds where the astrology theory is true are to the actual world. The metric over possible worlds allows for such comparisons because the overall similarity between worlds can be defined, though it might be complex.

  - **Consequence camp verdict**: No, because the relevant consequences are domain-specific. Without a common set of relevant consequences, we cannot compare verisimilitude across domains. Verisimilitude is relative to a domain of discourse. Newtonian mechanics might be highly truthlike in its domain, and the astrology theory not, but they are about different things.

  **4. Switching Point**

  - **Likeness camp**: "I would switch to the consequence view if it could be shown that there is no non-arbitrary way to define a similarity metric between worlds that does not collapse into a measure over consequences."

  - **Consequence camp**: "I would switch to the likeness view if it could be shown that the relevant consequence approach cannot handle approximations without implicitly relying on a world-metric."

  **5. Drafter's Note**

  The most likely fudge in the agreed claims is in **1.4** regarding "language dependence". The likeness camp interprets this as the account being invariant under re-description that preserves the structure of the logical space, while the consequence camp interprets it as being invariant under changes in the language that do not affect the set of relevant consequences. This reflects a deeper disagreement about whether the structure of reality or the relevance of consequences is prior.

  The residual disagreement is substantive, not merely verbal. The camps fundamentally differ on what verisimilitude is: a relation between theories and the world (likeness) or a relation between theories and their consequences (consequence).
answer: |-
  ### Joint Statement on Verisimilitude  
  **Adversarial Collaboration between the Likeness Camp (LC) and the Consequence Camp (CC)**  

  #### 1. Agreed Claims  
  We jointly affirm the following:  
  1.1. **Purpose of Verisimilitude**: The concept is necessary to explain scientific progress without presupposing that our best theories are true. Even strictly false theories can be "closer to the truth" than rivals, allowing us to make sense of scientific improvement (e.g., Newtonian physics being closer to truth than Aristotelian physics, despite both being false).  
  1.2. **Popper's Failure**: Popper’s original definition (truth content minus falsity content) is irreparably flawed due to the 1970s triviality result (which proves no false theory can be strictly closer than another under his account). This result does *not* imply verisimilitude is incoherent, only that Popper’s formulation fails.  
  1.3. **Non-Vacuity Requirement**: Any viable account must avoid triviality and accommodate both qualitative (e.g., "All swans are white") and quantitative (e.g., "Gravity’s force is \(F = G \frac{m_1 m_2}{r^2}\)") theories.  
  1.4. **Language Sensitivity**: A satisfactory account must minimize arbitrary sensitivity to linguistic redescription. (*Flag: Both camps agree language matters, but LC interprets this as "invariance under structure-preserving re-description," while CC interprets it as "relevance-guided consequence stability."*)  
  1.5. **Relevance of Truthlikeness**: The concept must do work in explaining theory choice, progress, and the "directionality" of science (e.g., why we prefer theories that are not merely less false but more truth-approximating).  

  #### 2. Disagreements Table  
  | Issue | Likeness Camp (LC) Formulation | Consequence Camp (CC) Formulation |  
  |-------|--------------------------------|----------------------------------|  
  | **Core Definition** | Verisimilitude is a function of the average similarity between the actual world and the worlds in which the theory holds, where similarity is grounded in the structure of logical space. | Verisimilitude is a function of the theory’s true relevant consequences minus its false relevant consequences, with relevance fixed by a canonical, non-redundant representation. |  
  | **Metric Justification** | The metric for "closeness" between worlds is not smuggled; it emerges from objective features of logical space (e.g., distance in a state space for quantities). | A metric for "closeness" is not required; grading near-misses depends on the truth of relevant approximation-consequences (e.g., "The value is near 5.1"), derived from scientific practice. |  
  | **Content Identity** | Adding an irrelevant true conjunct (e.g., "and there are 8 planets") to a theory \(T\) does not alter truthlikeness, as it does not change \(T\)’s core world-set similarity. | Adding an irrelevant true conjunct does not alter truthlikeness, as it adds no new relevant consequence in the theory’s domain; relevance excludes extraneous truths. (*Note: Both agree on invariance but for different reasons—LC via world-sets, CC via consequence-relevance.*) |  
  | **Domain Relativity** | Cross-domain comparisons (e.g., physics vs. astrology) are possible via overall world similarity, as logical space is unified. | Cross-domain comparisons are incoherent; verisimilitude is domain-relative, as consequences are only comparable within a shared relevant vocabulary. |  

  #### 3. Cruxes Section  
  For each crux, we provide a case and each camp’s verdict.  

  **Crux 1: Near-Miss vs. Wild Miss**  
  *Case*: Theory A states a quantity is 5.0 (actual: 5.1); Theory B states it is 5.0 (actual: 50). Which is closer to the truth?  
  - **LC Verdict**: A is closer. Worlds where A holds are objectively nearer in logical space (e.g., using the absolute difference metric for quantities). The metric comes from the structure of the quantity’s state space, not arbitrary choice.  
  - **CC Verdict**: A is closer *only if* it entails true approximation-consequences (e.g., "The value is between 4.9 and 5.1"), while B does not. The metric is not "smuggled"—it derives from which consequences are relevant in the context (e.g., experimental error margins).  
  *Joint Prediction*: Both agree A is closer, but dispute the justification (LC: world similarity; CC: consequence truth).  

  **Crux 2: Re-Description (Grue-Style)**  
  *Case*: In a color-time domain, actuality: object is blue at \(t_1\), green at \(t_2\). Theory A: always blue. Theory B: always green. Now re-describe using "grue" (blue if \(t < t^*\), else green) and "bleen" (green if \(t < t^*\), else blue). Actuality is always grue; A becomes "grue at \(t_1\), bleen at \(t_2\)"; B becomes "bleen at \(t_1\), grue at \(t_2\)". Does A remain closer to truth than B?  
  - **LC Verdict**: Ordering is invariant; A is still closer. Worlds are unchanged by re-description—only labels differ. If ordering flips (e.g., B appears closer in grue-language), it exposes a flaw in the account (e.g., an inadequate similarity metric).  
  - **CC Verdict**: Ordering may flip. In natural language, A has true consequences about blue at \(t_1\) but false at \(t_2\); in grue-language, its consequences are mixed. Relevance depends on the vocabulary: if grue is gerrymandered, it yields irrelevant consequences, so ordering *should* flip to expose language-dependence. CC claims this shows likeness accounts are covertly language-sensitive.  
  *Joint Prediction*: LC predicts invariance; CC predicts variance under gerrymandering.  

  **Crux 3: Padding**  
  *Case*: Theory T is false but moderately truthlike. T1 = T conjoined with "there are 8 planets" (true but irrelevant). T2 = T with an unconstrained parameter (e.g., "T and parameter \(p\) is in [0,1]"). Should T, T1, and T2 have equal truthlikeness?  
  - **LC Verdict**: T and T1 are equally close (adding a true conjunct doesn’t change world-set similarity). T2 is *less* close—it holds in more worlds, including distant ones (e.g., where \(p\) is far from actuality), lowering average similarity.  
  - **CC Verdict**: T and T1 are equally close (irrelevant truth adds no relevant consequence). T2 is *less* close—it weakens T, reducing true relevant consequences (e.g., by introducing indeterminacy).  
  *Joint Prediction*: Both agree T1 ≈ T but T2 < T. LC grounds this in world-sets; CC in consequence sets.  

  **Crux 4: Cross-Domain Comparison**  
  *Case*: False theory in physics (e.g., Newtonian gravity) vs. false theory in astrology (e.g., "All Aries are bold"). Is Newtonian gravity closer to truth?  
  - **LC Verdict**: Yes. Possible worlds with Newtonian physics are objectively more similar overall to actuality (e.g., in motion-predictions) than worlds with the astrology theory.  
  - **CC Verdict**: No. Consequences are incomparable across domains (e.g., "force proportional to mass" vs. "Aries personality"). Relevance is domain-specific; cross-domain claims are meaningless for verisimilitude. CC argues this shows likeness accounts impose a dubious "universal similarity metric."  
  *Joint Prediction*: LC allows comparison; CC rejects it.  

  #### 4. Switching Points  
  - **Likeness Camp**: "I would switch to the consequence view if it could be shown that world-similarity metrics *always* reduce to consequence-balance in a way that makes the world-set approach redundant."  
  - **Consequence Camp**: "I would switch to the likeness view if it could be shown that consequence-relevance *cannot* handle approximations without implicitly relying on a pre-linguistic world-metric."  

  #### 5. Drafter's Note  
  - **Most Likely Fudge**: Agreed claim **1.4 (Language Sensitivity)**. LC interprets "minimize sensitivity" as requiring invariance under *any* re-description preserving logical space structure, while CC interprets it as stability under *relevance-preserving* re-description. This masks a substantive disagreement: LC sees worlds as prior to language; CC sees language as prior to relevance.  
  - **Residual Disagreement**: The core divide is **substantive**, not verbal. It centers on whether truthlikeness is "world-facing" (LC) or "consequence-facing" (CC). Verbal overlaps (e.g., both reject "padding") arise from different foundations (world-sets vs. consequences), not shared semantics.  

  ---  
  **Time Estimate**: ~12-14 minutes if read aloud at a moderate pace.
