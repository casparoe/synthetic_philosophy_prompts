  Hey, I've been noticing this pattern I dont have a word for, and I'm wondering if it connects to Neurath's picture-language stuff. You know how he wanted ISOTYPE to be this universal visual language — like you could draw scientific facts without hiding theoretical claims inside the picture? Lately I've seen people in AI ethics and philosophy of mind do something that feels like a twisted version: they draw these flowcharts — say, a value alignment pipeline or consciousness as stacked layers — and present them as just neutral maps, like anyone can read them without buying into a theory. But the layout always sneaks in commitments: values become discrete boxes, causality runs top-to-bottom, background stuff gets erased. Then when you poke at those choices, they retreat to it's just a visualization, but a minute later they use the same diagram to argue that the structure is really like that. So there's this back-and-forth where a philosophical diagram is defended as both theory-free and as capturing the real ontology, depending on what's being attacked. Is there an established concept for that specific move — not just general bias in images, but this cyclical defense of a conceptual diagram in normative domains? If not, how would you distinguish it from Neurath's actual project and from plain reification? Also, please say how confident you are in what you claim and single out the point you're least sure of — I have a hunch I'm mixing up some details about Neurath's intentions and maybe conflating his view with someone else in the Vienna Circle.
