  The user's observation is sharp - this is absolutely happening in value alignment flowcharts where discrete boxes obscure ethical complexity. Their request for confidence ratings is smart too; I should flag where I'm least certain. Probably the exact boundaries between Neurath/Carnap on protocol sentences, and whether "diplomatic reification" fully captures the two-step rhetorical move.

