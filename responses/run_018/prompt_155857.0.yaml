  1. The Tortoise claims he packed the suitcase (call this proposition P).
  2. Achilles demands a rule for every step (infinite regress).
  3. We want to subtly highlight that the Tortoise is trying to use syntactic rules without needing semantic backing (as per Carroll's confusion).

  Punchline: The Tortoise, after being asked for a rule to apply the previous rule (and so on), never gets to the conclusion. We'll show this by having the Tortoise stuck in an infinite loop of producing rules without ever getting to the fact that he packed the suitcase.

  We'll also slip in the point about syntactic rules by having the Tortoise say something like, "But the rule is just a symbol! It doesn't need a reason to be applied!" but Achilles demands a rule for that too.

