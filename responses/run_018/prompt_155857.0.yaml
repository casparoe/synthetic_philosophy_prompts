  ---

  **Achilles and the Tortoise at Airport Security**

  *Setting: TSA checkpoint. The Tortoise is at the conveyor belt, placing his shell-polish and a copy of "Principia Mathematica" into a bin. Achilles, in a TSA uniform, eyes the suitcase suspiciously.*

  **Achilles:** Hold on, Mr. Tortoise. You claim this suitcase is yours and that you packed it yourself?

  **Tortoise:** Indeed! Let me prove it. Call the proposition "I packed this suitcase" — we'll label it P.

  **Achilles:** Fine. But how do you get to P?

  **Tortoise:** Well, I have Rule 1: If I remember packing the suitcase, then P is true. And I do remember! Let's call that memory fact M. So, by Rule 1, M implies P.

  **Achilles:** I see. So you're saying: (M) and (M implies P) together imply P?

  **Tortoise:** Exactly! That's modus ponens, my dear agent.

  **Achilles:** But why should I accept that? I need a rule for that.

  **Tortoise:** *sighs* Very well. Rule 2: If you have M and you have (M implies P), then you must accept P.

  **Achilles:** Okay, but why should I accept Rule 2? What’s the rule that forces me to accept Rule 2?

  **Tortoise:** *digs into his shell, pulls out a notepad* Rule 3: If you have Rule 2, and you have M and (M implies P), then you must accept P.

  **Achilles:** And Rule 3? How do I apply Rule 3?

  **Tortoise:** *frantically scribbling* Rule 4: If you have Rule 3, and Rule 2, and M, and (M implies P), then P must be true!

  **Achilles:** *leaning in* And Rule 4? What's the rule that tells me to use Rule 4?

  **Tortoise:** *growing desperate* Rule 5: If you accept Rule 4, then with all the previous rules and premises, you get P! It's just a symbol! The rule doesn't need a reason to be applied! It's syntactic! It just is!

  **Achilles:** Interesting. So you're saying the rule is just a symbol and doesn't require semantic backing? Then why do you keep giving me rules? I need a rule for Rule 5.

  **Tortoise:** *staring blankly* ... Rule 6: If you have Rule 5, then...

  *(The Tortoise's voice trails off. He starts writing Rule 7, then Rule 8, and so on. The line behind him grows longer. The sun sets. The airport closes. Years pass. The suitcase remains unclaimed.)*

  **Narrator:** And that’s why you should never let a Tortoise pack a suitcase in an infinite regress.

