  Hypnosis comparison: in hypnosis, suggestions might override emotions, but it's not structural denial. Split-brain denial arises from the physical disconnect. So it's tied to the anatomy.

  Coining a term: "Hemispheric Emotional Disavowal" (HED). Disavowal implies rejecting responsibility, which fits the left brain refusing to acknowledge the right's emotions. Boundaries: only in commissurotomy patients, requires emotional generation in one hemisphere and linguistic denial in the other. Not applicable to intact brains where denial is psychological, not structural.

