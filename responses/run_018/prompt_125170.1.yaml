answer: |-
  ## Coffee Shop Clash: Expressivism vs. The Frege-Geach Problem

  **Setting:** A slightly noisy campus coffee shop. Maya nurses an oat milk latte, Leo stirs a black coffee. Philosophy textbooks are half-open on the table.

  **Maya:** ...so yeah, that’s why I think the Frege-Geach *thing* isn’t the knockout punch against expressivism everyone thinks it is. People just trot out the tired "lying" example. Big deal.

  **Leo:** *(Raises an eyebrow)* Okay, fine, skip the lying. But the core problem is embedding moral claims *inside* complex logical structures, right? Like conditionals, or disjunctions. That’s where expressivism seems to stumble. How does your "boo" or "hooray" attitude translate into something like *disjunctive* moral reasoning?

  **Maya:** Easily! Look, take this: "Either capital punishment is wrong, or it’s okay to kill innocent people in edge cases." A realist like you thinks both sides are truth-apt, right? You evaluate the *truth* of each disjunct.

  **Leo:** Essentially, yeah. We assess whether CP *is* wrong, and whether killing innocents in edge cases *is* okay. If I reject the conclusion, I have to deny one of them is true.

  **Maya:** Exactly! But for me, it’s different. I *reject* the second horn – "it’s okay to kill innocent people in edge cases" – flat out. But I’m not saying it’s *false*. I’m refusing, utterly and completely, to *endorse* that stance. It’s like the very idea revolts me, makes me recoil. I cannot adopt that practical attitude towards killing innocents, ever. Not one bit. So, *because* I reject that horn expressively, I’m committed to the other one: capital punishment *is* wrong. My "boo" transfers to CP.

  **Leo:** *(Leans forward)* Hold on. You *reject* the second horn. What does that rejection *mean*, Maya? When you say, "No, that’s unacceptable," it feels like you’re saying something *about the world*. That the proposition "it’s okay to kill innocents in edge cases" *doesn’t hold*. That it’s incorrect. Which sounds an awful lot like believing it’s *false*.

  **Maya:** No! It’s about *me*, my stance, my commitments. It’s a practical rejection, not a theoretical denial. I’m not describing a state of affairs; I’m *refusing to go there* morally. Think of it like refusing a command. If someone says, "Either steal that or punch that baby," me refusing to punch the baby doesn’t mean I think the command "punch the baby" describes a false fact about the world. It means I won’t do it! My rejection is an active *disendorsement*.

  **Leo:** But **your** refusal to "go there" morally *implies* you think that stance is *unjustified* or *incorrect* in some objective sense. Otherwise, why reject it so forcefully? And crucially, when you reason *from* rejecting that horn to accepting the other, you’re relying on the *logical structure*. You’re treating your rejection as having the same logical force as denying a truth. It *commits* you, just like a belief commits a realist. If you reject "kill innocents okay," you *must* accept "CP wrong," or your moral reasoning falls apart. That commitment *is* belief-like.

  **Maya:** Ugh, you’re making it sound cognitive again! The commitment is a *practical* commitment to consistency in my attitudes, not a belief in a proposition's truth-value. It’s like planning: "Either I take the bus or I walk." If I discover the bus route is flooded and I utterly reject taking that route (not because it's *false* it exists, but because it's disastrous!), I’m committed to walking. My rejection of the flooded route stems from my goals and practical stance, not from discovering a metaphysical falsehood about bus routes. Similarly, rejecting the "kill innocents" horn stems from my core moral sensibility.

  **Leo:** But the *force* of that rejection in the moral case feels different. When you say you "utterly reject" killing innocents being okay, and you base your condemnation of CP on that rejection within the disjunction, it seems like you’re appealing to something *more* than just personal preference. You expect others engaged in the reasoning to see that rejecting that horn is *required*, that it’s the only rational or morally acceptable move. That expectation points towards thinking there’s a *fact* about the wrongness of killing innocents that *demands* rejection, not just your personal "ick" factor. That’s the belief-like attitude sneaking back in – the attitude that the proposition itself is *wrong* to endorse.

  **Maya:** *(Sighs, takes a sip of latte)* Maybe it *feels* like that because moral language is so ingrained. But I maintain the core move is expressive. I reject the practical stance expressed by the second horn. That rejection, rooted in my moral sensibility, forces a practical commitment regarding the first horn within the logical framework. The *logical* structure constrains how my attitudes can consistently combine, but the *content* remains non-cognitive. I’m not describing moral reality; I’m navigating my commitments within it using logic as a tool for consistent expression. Saying "Geachh" *(deliberate stumble)* doesn't magically turn my "boo" into a "false."

  **Leo:** *(Chuckles slightly at the stumble)* Fair point on the pronunciation. But I still think navigating those commitments *using logic as a constraint* reveals that your attitudes are playing a belief-like role. The way you *reason* with them, especially in complex cases like this disjunction, mirrors cognitive discourse too closely. It suggests the expressivist toolbox isn't quite equipped for the full complexity of moral thought and language. The rejection of that horn isn't *just* expressive whim; it carries normative weight that looks suspiciously like truth-aptness.

  **Maya:** Or maybe it just shows logic is powerful enough to handle expressive commitments? Look, I get why it *looks* belief-like. But I think it *can* be explained without collapsing into realism. We might just have to agree to disagree on whether that explanation ultimately holds water against the Frege-G... *(trails off, smiles)* ...Geach problem.

  **Leo:** *(Smiles back)* Probably. More coffee? This is good practice for my seminar tomorrow.

  **Maya:** Definitely. My "hooray" for caffeine is very real, non-cognitively speaking.

  **Leo:** *(Rolls eyes, but good-naturedly)* And cognitively, it's objectively true this coffee is terrible. Let's get a fresh pot.
