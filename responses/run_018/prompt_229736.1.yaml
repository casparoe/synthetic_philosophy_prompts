answer: |-
  Here is the scene, built to your specifications:

  **Scene: Unpacking in Albuquerque**

  The U-Haul exhales cardboard dust as Marta hauls the last box into the sparsely furnished living room of the adobe-style rental. Her friend, Lena, who drove up from Phoenix to help, slices packing tape with Marta’s old chef’s knife – the one with the chipped olivewood handle Marta thought she’d left behind in Portland.

  **MARTA:** (Wiping sweat, grinning broadly) God, Lena, the *light* here! It just pours in. Like everything’s been rinsed clean. You feel it? No more Portland drizzle soaking into your bones. No more ghosts in the corners. Blank slate. Actual, honest-to-god freedom.

  She gestures expansively at the boxes, the bare walls. Lena carefully places the knife on the counter.

  **LENA:** It’s… definitely bright. And dry. So, graphic design this time? Freelance? You were making a killing with those botanical illustrations back in—

  **MARTA:** (Cutting her off, pulling a bright woven scarf from a box labeled "KITCHEN") Illustrations? That was a costume, Lena. A beautiful, intricate costume I wore for a while. But it wasn’t *me*. It was… accumulation. Like this scarf. Pretty, but heavy. (She tosses the scarf carelessly towards a chair; it misses and pools on the floor). Here, it’s pure potential. No history breathing down my neck. I choose what matters *now*. Today. This light. This air. My past? Just stories I used to tell myself. I’m under zero obligation to keep living them.

  She picks up a box cutter, slices open a box marked "BOOKS." Inside, nestled beside volumes on permaculture (her Vermont phase) and Jungian analysis (her Bay Area period), are framed photos: Marta grinning on a sailboat with her ex-husband, David; Marta holding a toddler niece (now college-aged); Marta accepting an award for those botanical illustrations.

  **MARTA:** (Absently pushing the photos deeper into the box, pulling out a book on desert ecology) See? The past is just… inert matter. Data points. I’m not defined by who I was married to, or what awards I won, or even what I *thought* I believed. That’s the trap, Lena! Letting what *was* dictate what *is*. I refuse that prison. My life starts *now*. (She slams the ecology book down emphatically on the empty bookshelf).

  **LENA:** (Picking up the fallen scarf, folding it neatly) Okay… but you brought the knife. The good one. And… (she peers into the open box) …photos? David? Little Ellie?

  **MARTA:** (A flicker of something crosses her face – annoyance? A micro-flinch? – instantly smoothed over) Oh, Lena, come on! Practicality! A good knife is a good knife. And photos? Things. Just things. They hold whatever meaning I assign them *today*. Which is… minimal. Dust collectors until I decide otherwise. The *power* is in the choosing, moment by moment. Not clinging to relics. (She turns away, busying herself with a box labeled "CLOTHES - WINTER," though it’s 90 degrees outside). This move? Pure ownership. No baggage. I feel… weightless.

  Lena watches as Marta pulls out a thick, cable-knit sweater – unmistakably from her Maine years. Marta stares at it for a beat too long, her knuckles white on the wool. Then, with a decisive gesture, she shoves it back into the box and kicks the box towards a closet.

  **LENA:** Weightless, huh? Need help with that closet? Looks heavy.

  **MARTA:** (Forcing a brighter smile) Nonsense! It’s all just… possibility. Ready for lunch? I found this amazing vegan taco place downtown – completely different vibe from anywhere else I’ve been. Feels like the *real* beginning.

  ---

  **Walkthrough: The Anatomy of Bad Faith**

  1.  **Why it's Bad Faith (Not Healthy Reinvention):** Marta isn't simply changing; she's engaging in a *denial* of her fundamental "facticity" – the concrete, given reality of her past choices, relationships, physical existence (her body, her age), and the world she inhabits. Sartrean authenticity requires acknowledging both our radical freedom *and* the inescapable weight of our facticity – the situation we find ourselves in *because* of past free choices. Marta tries to declare her facticity (the photos, the knife, the sweater, the skills she acquired, the relationships she had) "inert matter" or "just stories," pretending she can erase their constitutive role in who she *is* right now. She treats her past selves as costumes she wore, denying they were expressions of *her* freedom at the time. She mistakes "freedom *from*" (past definitions) for "freedom *in*" (her current situation).

  2.  **Beats Carrying the Philosophical Weight:**
      *   **"Blank slate. Actual, honest-to-god freedom." / "The past is just stories..."**: Explicitly denying facticity, framing it as a constraint ("prison") she has escaped.
      *   **Cutting Lena off about the illustrations**: Avoiding the concrete reality of her past achievements/skills. Dismissing them as "a costume" denies her own agency in choosing and excelling at that role.
      *   **Tossing the scarf / Ignoring the photos / Shoving the sweater away**: Physical manifestations of denial. The scarf missing the chair and pooling on the floor visually represents the "weight" she denies but which is tangibly present.
      *   **"They hold whatever meaning I assign them *today*."**: Reducing profound aspects of her facticity (relationships, achievements) to arbitrary, weightless signifiers she controls *now*. This ignores how they *already* shaped her and continue to resonate within her.
      *   **"I feel… weightless."**: The core declaration of her bad faith. She claims a freedom devoid of the gravity of her own existence. Lena's literal response ("Looks heavy") underscores the dissonance.
      *   **The Knife and Sweater**: Concrete objects carrying immense facticity (years of use, specific memories/locations). Her justifications ("Practicality!") are flimsy masks for the undeniable *presence* of her past in her present actions (she packed it, she uses it). The sweater's reappearance triggers a visceral, unguarded reaction she instantly suppresses.
      *   **"Pure potential." / "Real beginning."**: Treating the present moment as utterly disconnected, magically free from the sedimentation of past choices. Ignoring that her "new" choices (vegan tacos, desert ecology book) are made by the *same person* shaped by those past choices.

  3.  **Difference from the Waiter (Beyond Inversion):** The Waiter (over-identified with role) *flees transcendence into facticity*. He pretends he *is* the role, denying his freedom to be otherwise. Marta *flees facticity into transcendence*. She pretends she is *pure* freedom, denying the weight of her past and her current situation (the boxes, the knife, the photos, her age, her friendship with Lena). Both are denying the essential synthesis: humans are *both* transcendent (projecting into the future, choosing) *and* factical (thrown into a world with a body, history, and circumstances). The Waiter denies his "not-being-the-waiter"; Marta denies her "being-the-sum-of-her-past-choices-and-embodied-history." The structure is the same: a flight from the tension inherent in human reality. The *direction* of flight is opposite.

  4.  **Answering the Objection ("She just keeps changing her mind!"):** The objection misses the *quality* of the change and the *denial* involved. Changing one's mind authentically involves:
      *   **Acknowledgement:** Recognizing the previous choice *as* one's own, understanding its motivations and consequences within one's life narrative. Marta doesn't do this; she *disowns* her past choices ("costume," "just stories").
      *   **Responsibility:** Accepting that past choices create the *situation* from which the new choice is made. Marta denies this, acting as if each "reinvention" starts from zero, unburdened. She avoids the responsibility for the *consequences* of her past choices (the displaced relationships, the abandoned careers, the material traces – like the photos she stuffs back in the box).
      *   **Continuity:** Authentic change happens within the flow of a life. The person changing remains recognizably *the same consciousness* grappling with its situation. Marta tries to fracture this continuity, treating each "new" self as a separate entity unrelated to the previous one. Her changes aren't developments; they are attempted annihilations.

      **Does the case survive? Honestly, it's borderline in a single scene, by design (her words sound authentic). It survives *only* because we see the cracks:** her visceral reaction to the sweater, the presence of the photos/knife *she* packed, Lena's grounding presence highlighting the dissonance, the physical weight she denies ("Looks heavy"). The *novel* format is crucial to cement it – we *see* the pattern, the recurring denial, the accumulating wreckage she refuses to own. One scene hints at bad faith; the pattern confirms it.

  5.  **What if She Notices the Pattern?** It doesn't necessarily collapse; it can get *worse*, deepening the bad faith.
      *   **Rationalization:** "Ah, yes, my pattern! How fascinating! See, I *choose* this pattern of renewal! It’s my authentic expression of freedom!" This is still bad faith. She now flees into transcendence *about her pattern*, treating the pattern itself as a chosen identity, denying the facticity *of* the pattern (its roots in avoidance, its consequences, the suffering it causes herself/others). She turns her flight into a *role* ("The Reinventor"), mirroring the Waiter but inverted.
      *   **Anguish Avoidance:** Recognizing the pattern might induce the anguish of realizing her radical freedom *and* responsibility for the chaos. To avoid this anguish, she might double down on denial ("This time is *different*") or plunge into despair (another form of bad faith, denying freedom).
      *   **Potential for Shift:** *Only* if acknowledging the pattern leads her to confront the *meaning* of her actions – the *why* behind the detonations (fear of commitment? fear of being defined? unresolved trauma?), the responsibility for the consequences, the concrete reality of her life as a *continuum* – could it crack the bad faith. But Sartre would argue this is incredibly difficult; recognizing the pattern is just the first, perilous step into authenticity, fraught with the temptation to flee back into a new story (including the story of "the one who sees the pattern").

  The scene relies on the dissonance between Marta's soaring declarations of freedom and the undeniable, concrete traces of her past that she *brought with her* and reacts to physically. Her sincerity makes the self-deception palpable. She believes her own story of weightlessness while literally surrounded by, and interacting with, the weight she denies. Lena serves as the grounded counterpoint, her simple observations ("You kept the good knife," "Photos? David?") acting as subtle pins pricking Marta's balloon of transcendence. The failure is internal: the past isn't chasing her; it's *in the boxes she packed herself*.
