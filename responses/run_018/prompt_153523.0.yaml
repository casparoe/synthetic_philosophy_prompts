  Let's structure the proposal as a polished document of 2-3 pages.

  ---

  **Proposal: Collective Coherence Norms in Scientific Inquiry: A Pilot Study on Dutch Books for Research Groups**

  **1. Introduction**

  Scientific inquiry is increasingly a collective endeavor, with research groups integrating diverse models and expertise. While individual rationality in belief formation has been extensively studied through Dutch book arguments (establishing that incoherent credences lead to guaranteed losses), the collective dimension remains underexplored. This pilot study proposes to investigate whether the organizational structure of a research group—its "betting architecture"—can generate collective incoherences that are irreducible to the sum of individual incoherences. Specifically, we ask whether there exists a distinct class of Dutch book vulnerabilities that arise from the way groups coordinate probabilities across interdependent theoretical models, and whether this necessitates a sui generis norm of group epistemic rationality.

  **2. Research Questions**

  The central research question is precisely formulated as follows:

  *Does there exist a non-reducible class of collective Dutch book vulnerabilities that arise specifically from the coordination of probabilities across interdependent models in a research group, such that the group’s organizational structure (e.g., hierarchical validation vs. distributed peer-to-peer cross-checking) can produce guaranteed losses even when all individual members maintain probabilistically coherent credences? And if so, does recognizing such vulnerabilities support a distinct norm of group epistemic rationality?*

  This question targets the structural conditions under which collective incoherence emerges, independent of individual irrationality.

  **3. Gap in Existing Literature**

  Current treatments of Dutch book arguments fall short in addressing collective incoherence for two primary reasons:

  - **Classical Individual Probabilism**: The standard Dutch book argument focuses on individual agents, showing that violations of the probability axioms (e.g., non-additivity) make an individual vulnerable to a series of bets that guarantee loss. However, this framework does not account for the dynamics of group inquiry, where probabilities are assigned and updated through structured interactions (e.g., model validation protocols). Even if each group member is individually coherent, the aggregation of their beliefs through group procedures (such as voting, consensus building, or hierarchical approval) may yield collective credences that are incoherent.

  - **Extensions to Imprecise Probabilities and Decision Weights**: Recent work has extended Dutch book arguments to imprecise probabilities (sets of probability measures) and non-Bayesian decision weights. While these extensions address individual uncertainty and non-additive beliefs, they remain focused on the single-agent case. They do not consider how the *coordination* of beliefs across multiple agents—especially when agents are working with overlapping but distinct model spaces (e.g., different theoretical frameworks for the same phenomenon)—can create new forms of incoherence. For instance, when a group uses a hierarchical validation process, the weights assigned to models by different subgroups might lead to inconsistent joint probability assignments that are exploitable only at the collective level.

  Thus, the gap lies in the lack of formal frameworks that model the betting architecture of research groups and its impact on collective coherence.

  **4. Methodology**

  We propose a three-stage methodological plan for the pilot study:

  **Stage 1: Constructing a Minimal Multi-Agent Framework**
  - We will develop a formal model of a research group as a network of agents, each holding credences over a shared set of theoretical models. The models are interdependent, meaning that the acceptance of one model may constrain the probabilities assigned to others (e.g., due to theoretical incompatibilities).
  - The "betting architecture" will be represented by:
    - *Stake Assignment Rules*: How financial or epistemic stakes are distributed among agents when the group faces a bet (e.g., centralized funding vs. individual contributions).
    - *Model-Selection Procedures*: The rules for aggregating individual credences into collective decisions (e.g., hierarchical: a core team validates models; distributed: peer-to-peer cross-checking with majority rule).
  - We will define a collective Dutch book for the group as a set of bets offered to the group (via its members) that guarantees a net loss for the group as a whole, regardless of which models turn out to be correct.

  **Stage 2: Deriving Coherence Conditions**
  - Using the framework, we will derive necessary and sufficient conditions for avoiding collective Dutch books. This will involve:
    - *Analytical Proofs*: We will investigate under what conditions the group’s collective credences (as determined by the betting architecture) satisfy coherence constraints analogous to the probability axioms. For example, we will ask whether the collective probabilities must be additive across mutually exclusive models, or whether they must respect conditional probabilities when models are interdependent.
    - *Special Cases*: We will analyze specific architectures (e.g., strict hierarchy vs. distributed networks) to identify which structures are more prone to collective incoherence.

  **Stage 3: Comparative Analysis**
  - We will compare our derived coherence conditions with existing norms in social epistemology (e.g., the "truth-tracking" norms of List and Pettit) and collective decision theory (e.g., Arrow’s impossibility theorem and its Bayesian variants). The goal is to determine whether collective Dutch book avoidance requires novel norms that cannot be reduced to individual rationality or existing aggregation principles.

  **5. Success and Failure Conditions**

  The pilot study will be evaluated based on the following outcomes:

  - **Success**: We will have achieved success if we can:
    1. Construct at least one concrete example of a collective Dutch book that arises solely from the group’s betting architecture (e.g., in a hierarchical system) even when all individual credences are coherent.
    2. Provide a formal characterization (a taxonomy) of such collective Dutch books, identifying the structural features (e.g., non-additive aggregation, inconsistent conditional stakes) that generate them.
    3. Propose a corresponding coherence norm for group epistemic rationality that is distinct from individual norms (e.g., "A research group’s betting architecture must ensure that the collective credence function is a convex combination of coherent individual credence functions" or a more nuanced condition).

  - **Failure**: The study will be considered a failure (but still informative) if:
    - All apparent collective Dutch books are shown to decompose into individual incoherences (i.e., they arise only when at least one member violates individual probabilism) plus aggregation errors.
    - Alternatively, if collective Dutch books are shown to be avoidable by enforcing individual coherence plus a specific aggregation rule (e.g., linear pooling), then the case for a sui generis norm would not hold.

  **6. Scope and Limitations for a Six-Month Pilot**

  Given the six-month timeframe, we will need to simplify or defer some aspects:

  - **Model Simplification**: We will focus on a minimal case of two agents and two or three interdependent models to make analytical derivations tractable. Larger groups and more complex model interdependencies will be deferred to future work.
  - **Betting Architecture**: We will prioritize two contrasting architectures: (1) a two-level hierarchy (e.g., a lead researcher who validates the models of junior researchers) and (2) a symmetric peer-to-peer network (e.g., two researchers cross-checking each other’s models). More complex architectures (e.g., multi-level hierarchies or hybrid systems) will not be covered.
  - **Formal Derivation**: We will derive coherence conditions for the minimal cases using standard Dutch book constructions (exploiting non-additivity or conditional incoherence) but will not attempt a full generalization to arbitrary architectures. General theorems will be left for future research.
  - **Empirical Validation**: The pilot will be purely theoretical. While we will draw inspiration from real scientific practices (e.g., in climate modeling or particle physics), empirical testing of the derived norms is beyond the scope of this phase.

  **7. Conclusion**

  This pilot study addresses a foundational gap in the philosophy of science: whether the collective nature of scientific inquiry introduces unique coherence constraints. By formally modeling the betting architecture of research groups, we aim to establish whether irreducible collective Dutch books exist and what norms they imply. The outcomes will inform both philosophical debates on group rationality and the design of efficient scientific collaboration frameworks.

  ---

