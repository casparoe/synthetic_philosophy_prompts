  (c) A concrete methodological plan: building a minimal multi-agent framework, deriving coherence conditions, and comparing to existing work.
  (d) Success and failure conditions: success yields a taxonomy of irreducible collective Dutch books and a corresponding norm; failure shows that collective books decompose into individual incoherences plus aggregation error.
