prompt: |-
  Before I read another account of free will, I want the full specification for a theory of the variety of free will that is worth wanting — not a semantic account of the ordinary phrase and not merely a solution to the compatibility problem. Spell out what such a theory must get right: the cases it must handle (manipulation, coercion, addiction, weakness of will, Frankfurt-style overdetermination, the willing addict, the self-endorsed but predictable chooser), the distinctions it cannot collapse (freedom of action versus freedom of the will; the capacity for moral responsibility versus the freedom it might still be reasonable to want even if blame and credit were downgraded; local choice versus the shape of a life across time), and the empirical or theoretical results it cannot contradict, with the consideration behind each requirement. Mark which requirements are non-negotiable and which are parochial demands of a particular camp — leeway libertarians, source libertarians, reasons-responsiveness compatibilists, hierarchical compatibilists. Then say whether the demand for the ability to do otherwise and the demand to be an ultimate source of one's actions can be jointly satisfied in a naturalistic picture, and identify the single requirement that excludes the most popular accounts. Keep the scoring of named views brief; the criteria are what I am after.
reasoning: |-
  Okay, the user is asking for a detailed specification of what a desirable theory of free will must include. They want to avoid semantic debates and compatibility issues, focusing instead on necessary criteria. Let me start by understanding their requirements.

  First, the cases mentioned: manipulation, coercion, addiction, weakness of will, Frankfurt cases, willing addict, predictable chooser. Each tests different aspects. For example, manipulation challenges whether the source of action is truly the agent. Coercion involves external pressures affecting choice. Addiction and weakness of will relate to internal constraints. Frankfurt cases question the need for alternative possibilities. The willing addict and predictable chooser highlight endorsement and predictability without compulsion.

  Next, distinctions: freedom of action vs. will. The user wants to ensure the theory doesn't conflate them. Moral responsibility vs. broader freedom is another key point. They also mention local choices versus life trajectory. Each distinction needs clear boundaries in the theory.

  Empirical constraints: the theory must align with neuroscience on decision-making processes, determinism or indeterminism, and psychological development. It can't contradict established science, like Libet's experiments or cognitive psychology findings.

  Non-negotiables might include the ability to handle all cases without contradictions and align with science. Parochial demands depend on the camp. Leeway libertarians insist on alternative possibilities, source libertarians on ultimate origins. Compatibilists focus on mechanisms like reasons-responsiveness or hierarchical control.

  The user also wants to know if ultimate source and alternative possibilities can coexist naturalistically. Indeterminism might help, but randomness is a challenge. Possibly integrating indeterminism at earlier stages of deliberation could work, but it's tricky.

  The single requirement excluding popular accounts is likely the Ultimate Source Requirement, especially with the No Manipulation Constraint. This rules out many compatibilist views and some libertarian ones that can't ensure actions start with the agent.

  I need to ensure each criterion is clearly explained with its rationale. Highlighting non-negotiables vs. parochial demands per camp. Also, addressing the naturalistic possibility and the key exclusionary requirement concisely.
answer: |-
  Here is a specification for a theory of "free will worth wanting" (FW^3), focusing on functional requirements rather than semantic analysis or compatibility debates:

  **I. Core Functional Requirements (What FW^3 Must Enable):**
  1.  **Meaningful Agency:** The capacity to genuinely author actions and shape one's life narrative, making choices that express one's character, values, and reasons. *(Rationale: Without this, actions feel alien or meaningless; the core "worth wanting" is self-governance and authorship.)* **<Non-Negotiable>**
  2.  **Moral Responsibility (Plausibility):** The capacity to be an appropriate target (in principle) for moral credit/blame, praise/resentment, understanding *why* these attitudes make sense *because* of the agent's role in the action. *(Rationale: Deeply embedded in our interpersonal practices and sense of justice; FW^3 should make sense of this, even if blame practices are reformed.)* **<Non-Negotiable>**
  3.  **Self-Creation/Transformation:** The capacity for genuine self-revision over time – to reflect on, critically evaluate, and *alter* one's values, desires, and character through deliberation and effort. *(Rationale: Essential for personal growth, autonomy, and escaping pathological states; makes agency dynamic.)* **<Non-Negotiable>**
  4.  **Reasons-Responsiveness:** The capacity to recognize, weigh, and respond to normative reasons (moral, prudential, epistemic) in deliberation and action. Actions must be *sensitive* to reasons, not just caused by them. *(Rationale: Distinguishes rational agency from mere causation; underpins evaluation of choices.)* **<Non-Negotiable>**
  5.  **Non-Alienation:** Actions must genuinely "belong" to the agent, stemming from motivations/values they identify with, not experienced as externally imposed or foreign forces. *(Rationale: Addresses the phenomenology of agency and the core desire for authenticity.)* **<Non-Negotiable>**

  **II. Case Handling Requirements (What FW^3 Must Explain/Differentiate):**
  6.  **Manipulation:** Must distinguish between actions resulting from authentic agency and actions caused by covert, responsibility-undermining manipulation (e.g., brainwashing, subliminal programming). Must show *why* manipulation undermines FW^3 even if the agent feels uncoerced. *(Rationale: Tests the "source" of agency and resistance to external control.)* **<Non-Negotiable>**
  7.  **Coercion:** Must explain why overt coercion (e.g., "your money or your life") typically undermines responsibility *without* necessarily eliminating all freedom of action. *(Rationale: Tests the distinction between external force and internal choice, and the impact of severely constrained options.)*
  8.  **Addiction:** Must handle the spectrum from the "willing addict" (endorses use) to the "unwilling addict" (struggles against compulsion), explaining degrees of control/responsibility. *(Rationale: Tests the interplay of strong desires, endorsement, loss of control, and reasons-responsiveness under internal pressure.)*
  9.  **Weakness of Will (Akrasia):** Must explain how an agent can knowingly choose contrary to their own best judgment *without* this being mere compulsion or total loss of agency, yet potentially diminishing responsibility. *(Rationale: Tests the coherence of agency, the role of judgment vs. desire, and gradations of control.)*
  10. **Frankfurt-Style Cases:** Must explain why moral responsibility *can* persist even in scenarios designed to show the agent "could not have done otherwise" (due to a counterfactual intervener). *(Rationale: Tests the necessity of the "ability to do otherwise" for responsibility.)*
  11. **Willing Addict / Self-Endorsed Predictable Chooser:** Must explain why an agent who endorses their predictable actions or addictive behavior can still exhibit FW^3 (if they do), differentiating this from mere passive determination. *(Rationale: Tests the sufficiency of endorsement/hierarchical identification and whether predictability per se undermines freedom.)*

  **III. Essential Distinctions (What FW^3 Must Not Collapse):**
  12. **Freedom of Action vs. Freedom of Will:** Must distinguish between the ability to execute one's choices without physical/social impediment (freedom of action) and the ability to form those choices/wills *autonomously* in the first place (freedom of the will). *(Rationale: An agent can have many options (action freedom) but if their choices are manipulated or compelled, they lack will freedom (FW^3).)* **<Non-Negotiable>**
  13. **Moral Responsibility vs. Broader Autonomy:** Must distinguish the specific conditions needed for being a fitting target of moral blame/credit from the broader freedom of self-governance and life-shaping that might still be desirable even if reactive attitudes were abolished. *(Rationale: FW^3 encompasses more than just the basis for blame; it's about meaningful life authorship.)* **<Non-Negotiable>**
  14. **Local Choice vs. Global Life-Shaping:** Must account for both the freedom involved in individual, context-specific choices *and* the freedom involved in the long-term constitution of one's character and life trajectory. *(Rationale: FW^3 operates at multiple temporal scales; a good life requires both.)* **<Non-Negotiable>**

  **IV. Empirical & Theoretical Constraints (What FW^3 Cannot Contradict):**
  15. **Naturalistic Causation:** Must be compatible with a broadly naturalistic understanding of the mind as arising from and causally interacting with the physical world (brain, environment). Cannot require Cartesian dualism or causally isolated mental substances. *(Rationale: Required for scientific plausibility.)* **<Non-Negotiable>**
  16. **Psychological Realism:** Must align with established cognitive science regarding decision-making (unconscious processes, biases, heuristics, the role of emotion, the temporal dynamics of deliberation). Cannot require implausible forms of conscious control or perfectly rational deliberation. *(Rationale: An empirically adequate theory must fit how minds actually work.)* **<Non-Negotiable>**
  17. **Developmental Plausibility:** Must account for how FW^3 capacities develop (or fail to develop) through biological maturation, learning, and socialization. *(Rationale: Agency isn't magically present at birth; it's cultivated.)*
  18. **Causal Determinism / Indeterminism:** Must either accommodate causal determinism (the thesis that every event is necessitated by prior states and laws) *or* show how its required indeterminism isn't merely random/chance but integrated into agential control. *(Rationale: Avoids fatalism or reliance on randomness.)* **<Crucial Constraint>**

  **V. Scoring of Parochial Demands:**
  *   **Leeway Libertarians:** Demand **Ability to Do Otherwise (ADO)** under *exactly the same conditions* (strong ADO) as essential and incompatible with determinism. *(Parochial: Often conflicts with Naturalistic Causation (15) and struggles with Frankfurt Cases (10).)*
  *   **Source Libertarians:** Demand **Ultimate Sourcehood (US)** – the agent must be the absolute, buck-stopping originator of actions, not determined by prior causes. *(Parochial: Conflicts with Naturalistic Causation (15), Developmental Plausibility (17), and often struggles to avoid randomness.)*
  *   **Reasons-Responsiveness Compatibilists:** Prioritize **Reasons-Sensitivity (4)** as the core mechanism, defining control via reasons-tracking capacities. *(Parochial: May struggle with Manipulation (6 - if reasons-sensitivity is induced) and Ultimate Source/Non-Alienation (5) demands.)*
  *   **Hierarchical Compatibilists:** Prioritize **Identification/Non-Alienation (5)**, defining freedom via endorsement by higher-order desires/values. *(Parochial: Struggles with Manipulation (6 - if higher-order desires are manipulated), Weakness of Will (9 - acting against judgment), and Self-Creation (3 - what grounds higher-order desires?).)*

  **VI. Key Questions Answered:**
  *   **Can ADO & US be jointly satisfied naturalistically?** It is **extremely difficult, arguably impossible**, under strict naturalism. Strong ADO requires indeterminism. Naturalistic US requires the agent's actions to be caused by their reasons/character *in a way consistent with natural laws*. Indeterminism at the moment of choice risks introducing randomness incompatible with control (*Reasons-Responsiveness (4)*) and US (if the indeterminism isn't *authored*). Some theories (e.g., "event-causal libertarianism") attempt this but face the "disappearing agent" and "luck" problems. *Integration of non-random indeterminism earlier in deliberation/character formation* is the most promising but highly speculative path.
  *   **Single Requirement Excluding Most Popular Accounts:** **The Ultimate Source Requirement coupled with the No Manipulation Constraint (Embedded in 1, 5, 6 & Non-Negotiable Naturalism (15))**. This requirement demands that the agent be the *unmanipulated, buck-stopping origin* of their actions, stemming naturally from *their own* un-coerced, un-programmed character and judgment.
      *   **Excludes:** Most **compatibilist** accounts (Hierarchical, Reasons-Responsiveness) because they trace sources back beyond the agent (genes, environment, luck) making manipulation hard to rule out *in principle*, lacking true ultimacy.
      *   **Excludes:** Many **libertarian** accounts because they struggle to integrate US with Naturalism (15) without randomness or spooky causation, and often fail the Developmental Plausibility (17) constraint.
      *   **This requirement is the crux:** It demands an answer to "But where did *that* (desire, value, character trait) come from?" that doesn't ultimately point to something external or arbitrary. No major theory has a fully satisfying naturalistic solution.

  This specification defines FW^3 as a robust, layered capacity for self-constitution and reasons-guided life authorship, empirically constrained and distinct from mere choice or blameworthiness. The tension between Ultimate Sourcehood and Naturalism remains the central, likely insurmountable, challenge for any theory claiming to capture the deepest intuition of freedom worth wanting.
