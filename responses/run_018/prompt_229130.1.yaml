answer: |-
  Here’s your Q&A prep sheet, designed for rapid review. I’ve prioritized objections by **damage score** (likelihood × impact) and tailored replies to your audience’s frameworks. Soft spots are flagged candidly.

  ---

  ### **Preemptive Concessions (Slot into Talk)**
  1. **To causal modelers**: *"I grant that interventionist frameworks elegantly handle *many* dispositional behaviors. My claim isn’t that causal bases replace interventionism, but that they resolve *metaphysical* puzzles finks/masks pose for *analyses* of dispositions."*  
  2. **To metaphysicians**: *"Conditional analyses work perfectly for stable dispositions like fragility. My target is their failure in *dynamic* cases where the object’s causal structure interferes with itself."*

  ---

  ### **Top 8 Objections & Replies**  
  *(Ordered by Damage Score: High → Low)*  

  1. **Causal Modeler (Interventionist)**  
     *Objection*: "Why is 'causal basis' more than a relabeling of an interventionist 'mechanism'? Aren’t you just smuggling in problematic modal commitments?"  
     *Reply*: "Interventionism tracks *actual* causal pathways, but dispositions are *potentialities*. My causal basis grounds that potentiality in intrinsic structure. When a fink *destroys* the basis on stimulus, it’s not just interrupting a mechanism—it’s erasing the *capacity* for manifestation. Interventionism can’t model that ontological shift."  
     *Soft Spot*: Whether "erasing capacity" is detectable without modal tools.  
     *Defense*: Cite basis properties as physical states (e.g., molecular bonds) whose destruction preempts interventions.  

  2. **Philosopher of Language (Semanticist)**  
     *Objection*: "If 'disposition' ascriptions aren’t analyzed conditionally, how do you explain their truth-conditions? Your 'causal basis' sounds like hidden essentialism."  
     *Reply*: "Disposition terms are *context-sensitive*: they pick out a basis property salient in the conversation. 'Fragile' ascribed to a glass denotes its molecular structure *in normal contexts*, but we shift reference if finks are salient. This avoids essentialism and handles finks/masks via pragmatic modulation."  
     *Soft Spot*: Explaining *which* basis properties are contextually relevant.  
     *Defense*: Tie salience to explanatory goals (e.g., materials science vs. engineering).  

  3. **Modal Metaphysician (Possible Worlds)**  
     *Objection*: "Intrinsic finks seem like edge cases. Why not restrict conditional analyses to *non-self-undermining* dispositions?"  
     *Reply*: "Because *all* dispositions are vulnerable to intrinsic interference. Consider a protein that denatures *itself* on stimulus—no external fink needed. Restricting the analysis cherry-picks cases. My approach treats fragility and self-finking protein uniformly: both depend on a basis vulnerable to interference."  
     *Soft Spot*: Whether intrinsic finks are "merely possible" oddities.  
     *Defense*: Give concrete examples (e.g., metastable materials, biological switches).  

  4. **Causal Modeler (Redundancy Charge)**  
     *Objection*: "Can’t we model basis-interference with *dynamic causal graphs*? Adding 'dispositions' seems ontologically inflationary."  
     *Reply*: "Dynamic graphs model processes, not *unmanifested* dispositions. A vase’s fragility exists even when never struck. Causal bases account for this *persisting* potential without requiring actual interventions. It’s not inflation—it’s capturing pre-intervention reality."  
     *Soft Spot*: Whether "persisting potential" adds explanatory value over process models.  

  5. **Philosopher of Language (Competence)**  
     *Objection*: "Ordinary speakers don’t know 'causal bases'. How does your view explain their disposition ascriptions?"  
     *Reply*: "They needn’t know the *specific* basis. Just as we refer to 'genes' without knowing DNA, disposition terms refer via a placeholder: 'whatever physical property grounds manifestation in this kind of object'. Finks/masks occur when that property is disrupted."  
     *Soft Spot*: Whether placeholder terms avoid circularity.  

  6. **Modal Metaphysician (Counterexample)**  
     *Objection*: "What about mimics? A ice sculpture carved to look fragile isn’t fragile—but it has no 'basis' for fragility. Doesn’t this require conditionals?"  
     *Reply*: "Mimics lack the *right kind* of basis. A basis must be *causally capable* of producing manifestation. Ice lacks the structural basis for shattering under light stress—it’s just shaped that way. Conditionals fail here too: the sculpture *would* shatter if struck, yet it’s not fragile!"  
     *Soft Spot*: Defining "causally capable" without conditionals.  

  7. **Causal Modeler (Testability)**  
     *Objection*: "How do we *detect* a causal basis without observing manifestations under stimulus?"  
     *Reply*: "Same way we detect quarks or genes: indirect evidence from structure (e.g., spectroscopy for bonds) and *non-interfered* manifestations. Finks/masks are detectable when predicted manifestations fail despite structural readiness."  
     *Soft Spot*: Epistemic access to "structural readiness".  

  8. **Philosopher of Language (Ambiguity)**  
     *Objection*: "You treat 'fragility' as a natural-kind term, but we ascribe dispositions to aggregates (e.g., 'explosive crowd'). Where’s the causal basis there?"  
     *Reply*: "Crowd explosiveness supervenes on individual psychologies + group dynamics. The basis is the aggregate structure—disrupted if, say, police (a fink) disperse the crowd pre-protest. This scales without new machinery."  
     *Soft Spot*: Whether "aggregate structure" is causally unified.  

  ---

  ### **The Nightmare Question (Hope Nobody Asks)**  
  **Objection (Modal Metaphysician)**:  
  *"Suppose an intrinsic fink modifies the causal basis *during* stimulus so quickly that the basis *never exists* when the stimulus is present. Example: A 'suicide widget' that vaporizes itself at t1 if touched at t1. By your view, it has no disposition pre-t1—but intuitively, it’s disposed to vaporize when touched!"*  

  **Holding Response**:  
  *"This exploits an ambiguity in 'during'. The stimulus (touch) and basis-destruction (vaporization) are simultaneous only if time is discrete. In continuous time, there’s an infinitesimal interval where the basis *is* present with stimulus—enough for causation. If time is discrete, I concede this case requires refinement, but note: conditional analyses also fail here (if touched, it vaporizes—true, but so does destruction!). My broader framework handles 99% of cases; I’m refining edge cases now."*  

  **Redirect Strategy**:  
  - *Pivot to strength*: "Even if this case needs tweaking, remember: unified accounts avoid the 20+ patches proposed for finks/masks separately."  
  - *Defang*: Smile—"I’m glad we’re debating *which* metaphysics handles suicidal widgets best—progress!"  

  ---

  ### **Terminology Traps**  
  - **"Mask"**: Causal modelers hear *statistical masking* (confounding variables). **Clarify**: *"In disposition metaphysics, 'masking' isn’t about data—it’s when a *blocker* prevents manifestation despite an intact basis (e.g., antivenom masking poison’s lethality)."*  
  - **"Stimulus"**: Language philosophers may hear *intentional triggers*. **Clarify**: *"A 'stimulus' is just the antecedent condition—it needn’t be agentive (e.g., humidity as stimulus for rusting)."*  
  - **"Basis"**: Metaphysicians may hear *essential property*. **Clarify**: *"Causal bases are non-essential. A glass’s fragility basis is its bond structure, but it could *lose* that and still exist (e.g., as melted glass)."*  

  ---

  **Final Prep Tip**: Open Q&A by saying: *"I’ve argued finks and masks are two symptoms of one disease: causal interference. Whether you’re team interventionism, possible worlds, or semantics—let’s diagnose this together."* This frames objections as collaborative, not combative. Review this sheet 20 minutes pre-talk—you’ve got this.
