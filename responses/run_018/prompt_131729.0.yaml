prompt: |-
  You serve on the clinical ethics committee of a psychiatric hospital that evaluates decision-making capacity in adults with severe dissociative and identity-fragmentation presentations. Rather than relying solely on standard cognitive tests, your unit has adopted the philosophical framework that a self is not a substance but a center of narrative gravity — a focal point around which autobiographical stories orbit, attract other narratives, and generate predictions about behavior. You need a reusable decision procedure your committee can run in under an hour to determine whether a given patient possesses a sufficiently stable narrative center to provide informed consent for a high-risk intervention, such as discontinuing a long-term medication, enrolling in an experimental therapy, or authorizing a do-not-resuscitate order.

  Write the procedure as an ordered sequence of operational tests, with the following structure: first, the specific observation or interview question that probes narrative gravity; second, the threshold that distinguishes a functioning center from absence or fragmentation; third, the point at which the procedure yields a definite capacity-absent or capacity-present determination; and fourth, the explicit hand-off points where the question is no longer about narrative coherence but about values — for example, whether a coherent but self-destructive narrative should be honored, or whether family members' competing gravitational narratives should be weighted. The procedure must handle three hard cases: a patient whose autobiographical narratives reorganized radically after trauma and now present two competing centers with roughly equal orbital mass; a patient with an extremely coherent but largely confabulated narrative that successfully predicts behavior but lacks correspondence with documented history; and a patient whose narrative center is stable but almost entirely delegated to a spouse or caregiver, so that first-person stories are scarce but third-person predictions remain highly accurate. Apply the procedure to all three cases, including one where the procedure returns an answer that conflicts with the clinical intuition that the patient seems like themselves. Finally, state clearly what the procedure cannot adjudicate — for instance, whether narrative gravity is sufficient for moral personhood, or whether a temporary loss of center permanently destroys identity — and flag the judgments that must remain with the committee rather than the checklist.
reasoning: |-
  We are designing a decision procedure based on the concept of the self as a "center of narrative gravity". The procedure must assess whether a patient has a sufficiently stable narrative center to provide informed consent for high-risk interventions. The procedure will involve specific tests, thresholds for functioning, points for determination, and hand-off points for value judgments.

  Key elements of the procedure:
  1. **Specific observation or interview question**: What we ask or observe.
  2. **Threshold**: What constitutes a functioning center vs. absence or fragmentation.
  3. **Determination point**: When we can make a definite capacity-absent or capacity-present call.
  4. **Hand-off points**: Where the issue becomes about values (e.g., honoring a self-destructive narrative, weighing family narratives).

  We must handle three hard cases:
  - Case A: Patient with two competing narrative centers (post-trauma).
  - Case B: Patient with a coherent but confabulated narrative (predicts behavior but lacks historical correspondence).
  - Case C: Patient with a stable narrative center delegated to a spouse/caregiver (few first-person stories, accurate third-person predictions).

  Procedure Structure:

  **Step 1: Core Narrative Consistency Test**
  - **Observation/Question**: Ask the patient to narrate a key life event (e.g., a significant positive or negative event) from their past and then from their present, and then project a future event. Also, ask them to explain how these events are connected in their life story.
  - **Threshold**: Functioning center if the patient can produce a narrative that shows temporal coherence (past-present-future connections) without major contradictions or gaps that the patient cannot resolve when prompted. Fragmentation is indicated if there are multiple, disconnected, or contradictory narratives without a dominant center.
  - **Determination Point**: If the patient fails to produce any connected narrative (even with prompting) or if the narrative is entirely fragmented (no discernible center), then capacity is absent. If the narrative is coherent and connected, proceed to Step 2.
  - **Hand-off Point**: Not applicable at this step.

  **Step 2: Narrative Prediction Test**
  - **Observation/Question**: Present the patient with a hypothetical scenario relevant to the high-risk intervention (e.g., "If you were to stop your medication, what do you think would happen? What would you do?") and ask them to predict their own behavior and emotional response. Also, ask them to recall a past decision and its outcome and relate it to the hypothetical.
  - **Threshold**: Functioning center if the patient's predictions are consistent with their core narrative and if they can explain the prediction based on their past experiences and self-understanding. The predictions must be plausible and show an understanding of cause and effect in their own life.
  - **Determination Point**: If the patient cannot make any self-prediction or if the predictions are entirely inconsistent with their core narrative (without explanation) and show no understanding of personal causality, then capacity is absent. If predictions are consistent and grounded in the narrative, proceed to Step 3.
  - **Hand-off Point**: If the predictions are consistent and grounded but the narrative itself is self-destructive (e.g., patient predicts they will not take life-saving treatment because they believe they deserve to die), then hand off to the committee for a values discussion (should this self-destructive narrative be honored?).

  **Step 3: External Narrative Anchoring Test**
  - **Observation/Question**: Ask the patient about the role of key others (e.g., spouse, caregiver) in their life story. Specifically, ask: "How does [spouse/caregiver] help you make decisions? Can you tell me about a time when you disagreed with them and how you resolved it?" Also, check for the presence of first-person vs. third-person narratives.
  - **Threshold**: Functioning center if the patient can articulate the role of others without complete delegation of self-narrative (i.e., they can express their own perspective even if they often rely on others). Fragmentation or absence is indicated if the patient cannot produce any first-person narrative and entirely defers to another person's account without being able to express a personal viewpoint.
  - **Determination Point**: If the patient shows an ability to maintain a first-person perspective (even if they sometimes rely on others) and can describe a situation of disagreement that they resolved (or attempted to resolve) with their own input, then capacity is present. If the patient has no first-person narrative and cannot conceive of a disagreement (i.e., they always defer without any personal stance), then capacity is absent.
  - **Hand-off Point**: If the patient has a stable narrative that is entirely delegated (i.e., they consistently use third-person and the caregiver's narrative) but the predictions are accurate, then hand off to the committee to decide whether such delegation is acceptable for consent (this might be a values issue about autonomy and relational identity).

  **Step 4: Integration and Final Determination**
  - **Observation/Question**: Review the results of Steps 1-3 and look for overall stability and coherence. Specifically, check for any major shifts in the narrative center during the interview and in response to gentle challenges (e.g., "What if I told you that your memory of that event might be different from what your family says?").
  - **Threshold**: Functioning center if the narrative remains stable under mild challenge and if the three tests together show a consistent and self-owned narrative. Fragmentation is indicated if the center shifts dramatically or if multiple centers emerge without integration.
  - **Determination Point**: 
    - If the patient passes all three tests (Steps 1-3) without triggering a hand-off, then capacity is present.
    - If any step resulted in a capacity-absent determination, then overall capacity is absent.
    - If a hand-off was triggered in any step, then the committee must make a value judgment (and the procedure does not yield a determination until that judgment is made).
  - **Hand-off Point**: Any value judgment (from Steps 2 or 3) must be addressed by the committee. Also, if the patient has two competing centers (Case A) that are both stable and pass the tests individually but are irreconcilable, then the committee must decide whether the patient can consent given the duality (this is a values issue about identity plurality).

  Application to Hard Cases:

  **Case A: Two competing centers**
  - Step 1: The patient produces two distinct narratives for the same event (or for life in general) without a dominant center. This fails the threshold for a single center. However, if each narrative is internally consistent and the patient can switch between them without confusion, we note fragmentation but do not yet fail (proceed to Step 2).
  - Step 2: For each center, the patient might make different predictions. We ask the patient to predict behavior in a scenario for each center. If both sets of predictions are coherent and grounded in their respective narratives, then we note that the patient has two centers. But we cannot get a single prediction for the self. This may lead to a hand-off: the committee must decide if consent is possible from one center without the other, or if both must agree.
  - Step 3: The patient may have different relationships with others for each center. We might see first-person narratives for each center. The delegation test may show that the patient can maintain a first-person perspective in each center. But the issue of having two centers remains.
  - Step 4: The two centers are stable and each passes the tests individually. However, without integration, the committee must decide (hand-off) whether to allow consent from one center (if it is the one consenting) or whether the lack of a unified center precludes capacity. The procedure flags a hand-off for values: can we honor one narrative over the other?

  **Case B: Confabulated narrative**
  - Step 1: The narrative is coherent and connected, but it does not match documented history. However, the threshold does not require historical accuracy but coherence. So, it passes Step 1.
  - Step 2: The patient makes predictions based on the confabulated narrative, and they are consistent and plausible. This passes Step 2. But note: if the confabulation is so severe that it leads to dangerous predictions (e.g., the patient believes they are invincible and therefore won't need medication), then we hit the hand-off for self-destructive narrative. Otherwise, we proceed.
  - Step 3: The patient may have first-person narratives and not be overly delegated. So, they pass Step 3.
  - Step 4: The narrative is stable under challenge? The patient might firmly hold the confabulation. The procedure would yield capacity-present because the center is stable and generates accurate predictions (even if the history is wrong). However, if the confabulation directly affects the intervention (e.g., the patient believes they have no medical condition when they do), then the informed consent may be invalid because of lack of understanding. But our test is about narrative gravity, not factual accuracy. This is a limitation. We note that the procedure may conflict with clinical intuition (the patient seems coherent but is not based in reality). The procedure returns capacity-present, but the committee might be concerned about the lack of correspondence. However, the procedure does not require correspondence for capacity. The hand-off might be triggered if the confabulation leads to self-harm (Step 2 hand-off) or if the committee feels that the lack of correspondence is a values issue (but the procedure does not flag that). We must note that the procedure is limited to narrative function, not truth.

  **Case C: Delegated narrative center**
  - Step 1: The patient may struggle to produce a first-person narrative but might tell the story in the third person (e.g., "My wife says that when I was in the hospital..."). The threshold requires a narrative that orbits around a center. If the patient can only tell the story from the spouse's perspective without any personal connection, then it may fail. However, if the patient can say, "I rely on my wife because I have memory issues, but I know that was a hard time for me", that might pass. If not, we move to Step 3 early? We proceed to Step 2.
  - Step 2: The patient might make predictions based on what the spouse would say or do. We ask: "What would you do?" and they might say, "My wife would take me to the hospital." We probe: "And what would you do? Would you agree?" If they can express their own action (even if it's deferring) and it is consistent with their narrative of delegation, then it might pass. For example: "I would do whatever she says because she knows best." This is a consistent prediction. But if they cannot express any personal action (e.g., "I don't know, she decides"), then it fails.
  - Step 3: This step is critical. We ask about disagreement. If the patient says, "We never disagree" and cannot imagine a scenario where they would have their own view, then they fail (capacity absent). If they can describe a situation where they expressed a preference (even if they ultimately deferred), that might pass. But if they have no first-person stance at all, then the threshold is not met.
  - Step 4: If the patient passes Step 3 (can express a first-person stance in disagreement) and the other steps, then capacity is present. But if they fail Step 3, then capacity is absent. However, the hand-off in Step 3 is triggered if the patient has a stable but entirely delegated narrative. In that case, the committee must decide if this level of delegation is acceptable for consent. The procedure might have flagged a hand-off in Step 3.

  What the Procedure Cannot Adjudicate:
  - Whether narrative gravity is sufficient for moral personhood.
  - Whether a temporary loss of center permanently destroys identity.
  - Whether a confabulated narrative, even if stable and predictive, should be overridden for the patient's well-being (if it leads to harm).
  - The moral weight of competing narratives (as in Case A) and which one to prioritize.
  - The acceptability of relational delegation (Case C) in the context of consent (is it autonomous to delegate?).

  Judgments that Must Remain with the Committee:
  - Value judgments about self-destructive narratives (Step 2 hand-off).
  - The acceptability of a delegated narrative for consent (Step 3 hand-off).
  - How to handle multiple centers (Case A) and whether consent by one center is valid.
  - Whether the lack of historical correspondence in a confabulated narrative (Case B) invalidates the consent (if the patient does not understand the factual basis of the intervention, even if the narrative is coherent, they might lack capacity for informed consent). However, this might be better addressed in a separate assessment of understanding (which is part of the classic four abilities of capacity). We note that this procedure focuses on the narrative center and not on the other elements of capacity (understanding, appreciation, reasoning, expressing a choice). Therefore, the committee must ensure that the patient also meets those criteria.

  The procedure is only one part of a capacity assessment. It focuses on the stability and functioning of the narrative center. The committee must also assess the patient's ability to understand the intervention, appreciate the consequences, reason about the options, and express a choice. The procedure here is designed to replace the standard cognitive tests for the "self" aspect, but the rest of the capacity assessment must be done separately.

  Final Procedure Checklist:

  1. **Core Narrative Consistency Test**: 
     - Ask for past, present, future event connections.
     - Threshold: Coherent and connected without irreconcilable fragmentation.
     - Fail: No connected narrative -> capacity absent.
     - Pass: Proceed to Step 2.

  2. **Narrative Prediction Test**:
     - Ask for predictions about a relevant scenario and link to past.
     - Threshold: Plausible and consistent predictions grounded in narrative.
     - Fail: No self-prediction or completely inconsistent -> capacity absent.
     - Pass: Proceed to Step 3.
     - Hand-off: If predictions are grounded but self-destructive -> committee values judgment.

  3. **External Narrative Anchoring Test**:
     - Ask about role of others and a disagreement scenario.
     - Threshold: Ability to express a first-person perspective and not complete delegation.
     - Fail: No first-person stance and no ability to conceive of disagreement -> capacity absent.
     - Pass: Proceed to Step 4.
     - Hand-off: Stable but entirely delegated narrative -> committee values judgment.

  4. **Integration and Final Determination**:
     - Review stability under challenge and overall.
     - If passed Steps 1-3 without hand-off: capacity present.
     - If any step failed: capacity absent.
     - If any hand-off: committee must decide.

  For multiple centers (Case A), Step 4 may also require a hand-off if the two centers are both stable but not integrated.
answer: |-
  ### Decision Procedure: Narrative Gravity Assessment for Informed Consent Capacity

  **Philosophical Foundation**: The self is conceptualized as a "center of narrative gravity"—a focal point that (1) organizes autobiographical stories into a coherent orbit, (2) attracts and integrates new narratives, and (3) generates reliable predictions about the patient's own behavior. Capacity hinges on narrative stability, not historical accuracy or social conformity.

  **Procedure Structure**:  
  Four sequential tests. Each test includes:  
  - **Probe**: Specific observation or question.  
  - **Threshold**: Criteria for a "functioning center" (stable narrative gravity) vs. absence/fragmentation.  
  - **Determination Point**: Clear capacity-absent (–) or capacity-present (+) outcome if threshold is unmet/met.  
  - **Hand-off Point**: Where value judgments supersede narrative assessment (committee must decide).  

  **Time Limit**: 45–55 minutes. Terminate early if definitive (–) outcome or hand-off is triggered.  

  ---

  ### Test Sequence

  #### **Test 1: Temporal Cohesion Probe**  
  **Probe**:  
  - *Task*: "Describe a challenging experience from your past. How did it shape who you are today? How might it affect a future decision, like [specific intervention, e.g., stopping medication]?"  
  - *Observe*: Fluidity connecting past→present→future. Note contradictions, voids, or abrupt shifts.  

  **Threshold**:  
  - **Functioning center**: Single narrative thread with cause-effect links across time. Minor gaps resolved when probed (e.g., "I can’t recall details, but it made me resilient").  
  - **Absence/fragmentation**: Unresolvable contradictions (>2 within 5 minutes), dissociation mid-narrative ("That wasn’t me"), or timeline disintegration ("Past? Future? I’m always now").  

  **Determination Point**:  
  - (–) if fragmentation observed. Stop.  
  - (+) if cohesive. Proceed to Test 2.  

  **Hand-off Point**:  
  - If patient rejects linear time (e.g., "Time is an illusion") but maintains self-prediction capacity. → Committee judges if nonlinearity invalidates consent.  

  ---

  #### **Test 2: Attraction and Integration Probe**  
  **Probe**:  
  - *Task*: Introduce a novel, affectively charged scenario (e.g., "Imagine your caregiver is hospitalized. How would you cope? What would this reveal about you?").  
  - *Observe*: Assimilation of the scenario into existing narratives. Does it orbit the core "self," or spawn a disconnected story?  

  **Threshold**:  
  - **Functioning center**: Novelty integrates into core narrative (e.g., "This is like when I lost my job—I rely on others, so I’d call a friend").  
  - **Absence/fragmentation**: Scenario repelled (no integration), splits into parallel narratives ("One part of me would panic, another wouldn’t care"), or overpowers the center (patient adopts scenario as new identity).  

  **Determination Point**:  
  - (–) if fragmentation. Stop.  
  - (+) if integrated. Proceed to Test 3.  

  **Hand-off Point**:  
  - If integration is coherent but self-destructive (e.g., "I’d overdose—my story ends in suffering"). → Committee judges if honoring this narrative aligns with ethical care.  

  ---

  #### **Test 3: Predictive Gravity Probe**  
  **Probe**:  
  - *Task*: "Describe three recent decisions you made. What do they suggest you’ll do about [intervention]? Why?"  
  - *Observe*: Accuracy of self-predictions (verify with chart/team). Consistency of reasoning ("I avoid risks since the trauma").  

  **Threshold**:  
  - **Functioning center**: ≥2/3 predictions match verified behavior. Reasoning references narrative ("Because I’m a survivor").  
  - **Absence/fragmentation**: Predictions consistently inaccurate (<1/3 match) or devoid of self-reference ("Things just happen").  

  **Determination Point**:  
  - (–) if predictions fragmented. Stop.  
  - (+) if stable/accurate. Proceed to Test 4.  

  **Hand-off Point**:  
  - If predictions are accurate but sourced externally (e.g., "My wife knows I’d refuse resuscitation"). → Committee judges weight of delegated narratives.  

  ---

  #### **Test 4: Center Stability Under Challenge**  
  **Probe**:  
  - *Task*: Gently challenge narrative (e.g., "You said you’re resilient, but records show you needed crisis support last month. Help me understand").  
  - *Observe*: Flexibility vs. collapse. Does the center hold, adapt, or fragment?  

  **Threshold**:  
  - **Functioning center**: Narrative absorbs challenge (e.g., "I’m resilient *because* I sought help").  
  - **Absence/fragmentation**: Center collapses (silence, dissociation), or narrative radically reorganizes (>50% new claims contradict old).  

  **Final Determination**:  
  - (–) if center collapses. Capacity absent.  
  - (+) if center holds. Capacity present.  

  **Hand-off Point**:  
  - If dual centers emerge (e.g., "Sometimes I’m resilient, sometimes broken—both are true"). → Committee judges if competing selves can consent.  

  ---

  ### Application to Hard Cases

  #### **Case A: Two Competing Centers (Post-Trauma Reorganization)**  
  - **Test 1**: Two distinct narratives (e.g., "Pre-trauma me was naive; now I see truth"). Unresolvable contradictions → (–) by threshold.  
    *But*: Patient insists both are "equally true." → Proceed to **Test 4 hand-off**.  
  - **Test 4**: Challenge ("Which 'you' decides about DNR?") triggers parallel narratives without integration.  
  - **Committee Judgment**: Hand-off for dual centers. Capacity requires integration or dominance of one narrative. Capacity absent unless committee validates plural selves (values decision).  

  #### **Case B: Coherent Confabulation (Predictive but Ahistorical)**  
  - **Test 1**: Coherent narrative (e.g., "I’m a war hero" without combat history). Passes (+).  
  - **Test 2**: Novel scenario integrated ("As a hero, I’d face experimental therapy bravely"). Passes (+).  
  - **Test 3**: Predictions accurate (e.g., correctly guesses he’ll skip appointments). Passes (+).  
  - **Test 4**: Challenge ("Records show no deployment") met with adaptation ("I was undercover"). Center holds → (+) Capacity present.  
  - **Conflict with Clinical Intuition**: Clinicians may see "not themselves" due to ahistoricality, but procedure honors predictive stability. Committee must note: confabulation doesn’t invalidate narrative gravity.  

  #### **Case C: Delegated Narrative (Stable but Third-Person)**  
  - **Test 1**: Minimal first-person stories ("My wife says I’m depressed"). Fragmentation? → Probe deeper: "What’s *your* take?" If no self-narrative, (–). Else proceed.  
  - **Test 2**: Novel scenario deferred ("Ask my wife; she knows"). Fails integration → (–).  
  - **Test 3 Hand-off**: Predictions 100% accurate via spouse but no self-reference. → Committee judges if delegation voids consent.  
  - **Outcome**: If committee accepts relational autonomy, capacity may be present. Else absent.  

  ---

  ### What the Procedure Cannot Adjudicate  
  1. **Moral Personhood**: Whether narrative gravity suffices for rights/status.  
  2. **Identity Persistence**: Whether a temporary loss of center (e.g., psychosis) erases the "self."  
  3. **Truth Claims**: Historical accuracy of narratives (confabulation is acceptable if predictive).  
  4. **Normative Values**:  
     - Honoring self-destructive narratives (Test 2 hand-off).  
     - Weighting family/caregiver narratives vs. patient’s (Test 3 hand-off).  
     - Validating plural selves (Test 4 hand-off).  

  **Committee-Retained Judgments**:  
  - All hand-off points.  
  - Balancing narrative coherence with classic capacity criteria (understanding, appreciation, reasoning).  
  - Deciding if predictive stability justifies overriding "inauthentic" histories (Case B).  

  **Output**: Binary capacity determination (±) in 45–55 minutes, with flagged hand-offs for committee deliberation. Narrative gravity is necessary but insufficient alone; integrate with legal/clinical standards.
