answer: |-
  Here is a diagnostic taxonomy structured as a decision tree, focusing on **threshold-sensitive contextual modulation (TSM)** as the classifying axis. Nodes are framed as yes/no questions, and leaf positions include their core commitments and "awkward" implications.

  ---

  ### **Diagnostic Taxonomy: Threshold-Sensitive Modulation (TSM) in Metaethics**

  #### **Root Node**  
  **Q1: Accepts that moral feature-salience can be non-monotonic (i.e., reverses valence past a threshold)?**  
  - *If NO* → **Robust Generalism**  
    *Leaf*: Insists all genuine moral reasons are invariant; denies TSM occurs.  
    *Awkward commitment*: Must dismiss intuitive cases of feature-reversal as misdescribed or non-fundamental.  
  - *If YES* → Proceed to Q2.  

  #### **Q2 (After YES to Q1): Can contributory reasons survive TSM intact (i.e., retain invariant valence)?**  
  - *If NO* → **Reasons Holism** (core particularist commitment). Proceed to Q3.  
  - *If YES* → Proceed to Q4.  

  #### **Q3 (After NO to Q2): Does holism extend to all-things-considered (ATC) judgments?**  
  - *If NO* → **Principled Contextualism** (Hybrid)  
    *Leaf*: Accepts holistic reasons but insists ATC judgments follow stable patterns/principles.  
    *Awkward commitment*: Principles govern only *overall* verdicts, detached from contributory reasons’ context-sensitivity.  
  - *If YES* → **Standard Particularism**  
    *Leaf*: Denies any exceptionless principles, even for ATC judgments.  
    *Awkward commitment*: Practical reasoning requires no general rules, risking arbitrariness in novel cases.  

  #### **Q4 (After YES to Q2): Does practical reasoning require articulating TSM conditions?**  
  - *If NO* → **Non-Articulable Generalism** (Hybrid)  
    *Leaf*: Invariant reasons exist, but TSM thresholds cannot be fully codified.  
    *Awkward commitment*: Agents reliably apply exceptionless principles they cannot explicitly state.  
  - *If YES* → ***Logically Open Branch***  
    *Leaf*: **"Codified Threshold Generalism"** (Unoccupied)  
    *Diagnosis*: Conceptually unstable—if reasons survive TSM *intact*, articulating modulation conditions implies their valence isn’t truly invariant. Likely **incoherent**.  

  ---

  ### **Unoccupied Branches & Diagnoses**  
  1. **Path: YES (Q1) → YES (Q2) → YES (Q4)**  
     - *Position*: Accepts TSM, insists reasons are invariant *and* requires full articulation of thresholds.  
     - *Diagnosis*: **Conceptual incoherence**—Articulating modulation rules contradicts the claim that reasons’ valences never change.  

  2. **Path: YES (Q1) → NO (Q2) → NO (Q3)**  
     - *Position*: Holism about reasons but not ATC judgments, *without* requiring articulation (skips Q4).  
     - *Diagnosis*: **Unexplored but possible**—Theoretically consistent (e.g., "patterned particularism"), but **practically unattractive** due to opaque thresholds guiding ATC judgments.  

  ---

  ### **Taxonomy Limitations**  
  - **Fails to separate**:  
    1. **Particularism** and **Principled Contextualism** on *reasons holism* (both say NO at Q2).  
    2. **Robust Generalism** and **Non-Articulable Generalism** on *denying TSM* (both say NO at Q1, but the latter is a YES branch variant).  
  - **Why?** This axis prioritizes TSM-response over traditional holism/generalism boundaries, grouping theories by their *treatment of modulation* rather than principle-existence.  

  ---

  ### **Leaf Summary**  
  | **Position**                  | **Path**              | **Core Commitment**                                                                 |  
  |-------------------------------|-----------------------|-------------------------------------------------------------------------------------|  
  | Robust Generalism             | Q1: NO                | All genuine reasons are valence-invariant; TSM is illusory.                         |  
  | Standard Particularism        | Q1:Y → Q2:N → Q3:Y    | No exceptionless principles at any level (reasons or ATC).                          |  
  | Principled Contextualism      | Q1:Y → Q2:N → Q3:N    | Holistic reasons, but ATC judgments obey stable principles.                         |  
  | Non-Articulable Generalism    | Q1:Y → Q2:Y → Q4:N    | Invariant reasons exist, but TSM thresholds are inarticulable.                      |  
  | *Codified Threshold Generalism* | Q1:Y → Q2:Y → Q4:Y    | *Unoccupied: Incoherent (reasons can’t be invariant if modulation is codified).*   |  

  ---

  This tree isolates TSM as the pivotal metaethical challenge, forcing all theories to confront modulation’s implications for moral reasons, judgment, and reasoning—revealing novel hybrids and conceptual tensions beyond the standard debate.
