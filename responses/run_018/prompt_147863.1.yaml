prompt: |-
  At our philosophy of physics reading group, two members — Leo and Mara — became locked in a prolonged disagreement about whether the Born-rule problem in Everettian quantum mechanics is genuinely resolved by decision-theoretic arguments. I am writing as a bystander who could not referee them adequately and would like a point-by-point adjudication.

  Leo opened by observing that in the many-worlds interpretation the universal wavefunction evolves deterministically and never collapses; every outcome with non-zero amplitude is realised in some decoherent branch. He argued that this renders talk of probabilities apparently incoherent unless one can justify the Born weights. He claimed that the decision-theoretic derivation developed by Deutsch and Wallace solves the problem: a rational agent who knows the quantum state and must place bets on measurement outcomes should assign credences proportional to the squared amplitudes, rather than distributing them uniformly across branches. Leo insisted this is not circular, because the rationality axioms employed — such as diachronic consistency, measurement neutrality, and a symmetry condition across physically equivalent acts — make no explicit reference to probability. They constrain preferences over actions, and the unique weighting that satisfies all of them is |ψ|². Thus, Leo said, the derivation is epistemic rather than ontological: it shows why an agent ought to care about branches in proportion to their amplitude, without claiming that low-amplitude branches are less real.

  Mara replied that this merely relocates the mystery rather than dissolving it. She pointed out that in Everettian fission, every post-measurement copy of the agent experiences its particular outcome with complete certainty. There is therefore no single “I” who is genuinely uncertain about which branch she will inhabit; rather, there will be copies in every branch. Consequently, she argued, framing the issue as “what should I expect?” misapplies the apparatus of decision theory, which presupposes that one and only one outcome will be realised for the deliberating agent. She then introduced a further consideration: after decoherence, the branches are causally and epistemically separated, so no observer can ever gather statistical data across them. This means frequentist justifications of the weights are impossible in principle, not merely impractical. For Mara, this showed that the decision-theoretic argument does not explain why an individual should care about low-amplitude branches; it formalises a weighting that was already tacitly assumed in the statement of the problem.

  Leo countered that Mara’s fission objection confuses personal identity with rational concern. Even if all copies exist, each is a temporal continuation of the pre-measurement agent, and rationality requires distributing concern among all one’s future selves. The correct question, he said, is not “which copy will I be?” — since that presupposes uniqueness — but “how ought I to weigh the welfare of my various successors?” The squared-amplitude distribution, he maintained, is the only one that respects the symmetries of the quantum state and avoids arbitrarily privileging one physically identical branch over another.

  Mara responded that “distributing concern” is exactly where the circularity enters. Without an independent normative reason to treat squared amplitude as the correct metric of concern, one could just as well distribute concern equally per branch (branch-counting) or per unit of physical volume in configuration space. She added that Leo’s appeal to symmetry overlooks that, in the ontology of the theory, all branches exist with equal reality; the amplitude is a coefficient in the wavefunction, not an ontological weight. To treat it as a measure of rational concern, she argued, is to smuggle the Born rule back in through the normative back door, disguising an ontological assumption as a rationality constraint.

  They continued without convergence. Leo believes Mara misses that rational decision theory can generate probabilities without any ontological commitment to weighted existence; Mara believes Leo misses that the derivation assumes precisely what needs explaining by treating amplitude as a normative measure of concern.

  Please adjudicate this exchange move by move: assess Leo’s claim about the non-circularity of the rationality axioms, Mara’s objection concerning fission and epistemic separation, Leo’s reply about distributing concern among successors, and Mara’s charge that the argument smuggles in the Born rule. Say who is right about which specific point, identify anything important that both are neglecting — for example, whether the debate conflates rational expectation with predictive success, or whether there is a principled distinction between epistemic and ontological readings of the Born rule in this context — and indicate who is more right overall. Please write your answer in British English.
reasoning: |-
  Okay, I need to carefully adjudicate this debate between Leo and Mara about the Born rule in Everettian quantum mechanics. Let me start by understanding their core arguments.

  Leo is arguing that decision-theoretic approaches (like Deutsch and Wallace's) can non-circularly derive the Born rule by showing rational agents must bet according to squared amplitudes. His key claims are: (1) the rationality axioms (diachronic consistency, measurement neutrality, symmetry) don't reference probability, (2) the derivation is epistemic (about rational concern for future selves) not ontological (about branch reality).

  Mara's central objection is that this relocates rather than solves the problem. Her main points: (1) fission means no single agent experiences uncertainty, making decision theory inapplicable, (2) epistemic separation prevents empirical validation, (3) treating amplitude as concern metric assumes what needs proving.

  Looking at Leo's non-circularity claim: The rationality axioms themselves don't mention probability or squared amplitudes explicitly. Diachronic consistency is about preference coherence over time, measurement neutrality about equivalent measurement processes, symmetry about identical branches. So technically Leo is right that the axioms aren't circular - they constrain preferences without presupposing the Born rule.

  But Mara's fission objection has merit. In standard decision theory, agents face exclusive outcomes, whereas post-measurement all branches exist with definite experiences. The "which outcome will I see?" framing feels misplaced when "I" will see all outcomes in different branches. This does challenge whether decision theory applies here.

  Leo's response about distributing concern among successors is reasonable. If we view pre-fission agents as caring about all future selves, and ask how to weight their interests, that seems a coherent reframing. The symmetry argument against arbitrarily privileging identical branches is particularly strong.

  However, Mara's circularity charge hits home regarding the concern metric. Why amplitude rather than branch count? Leo's symmetry argument only works if we accept that branches with different amplitudes aren't "physically equivalent" - but in MWI's bare ontology, amplitude is just a wavefunction coefficient, not an inherent weight. So privileging amplitude in concern-distribution does seem to presuppose its normative significance.

  Both neglect important nuances: 
  - The distinction between rational expectation (subjective credence) and predictive success (objective outcomes) matters. In MWI, high-amplitude branches dominate future branches, so Born-rule weights predict typical experiences - but this involves subtle anthropic reasoning they don't address.
  - There's ambiguity in "rational concern" - is it about anticipating one's future experience (where all branches are equally "mine") or about influencing future welfare (where amplitude affects measure of future influence)?

  Overall, Leo has the stronger case for providing a consistent normative framework deriving Born rule weights from non-probabilistic axioms. But Mara rightly identifies unresolved tensions in why amplitude should ground concern rather than other quantities, and in how to reconcile subjective uncertainty with objective multiplicity.
answer: |-
  ### Adjudication of the Leo-Mara Debate on the Born Rule in Everettian Quantum Mechanics  
  **Core Issue:** Whether decision-theoretic arguments (e.g., Deutsch-Wallace) genuinely resolve the Born-rule problem in the many-worlds interpretation (MWI), or merely presuppose it.  

  #### **1. Leo’s Claim: Non-Circularity of Rationality Axioms**  
  - **Leo’s Argument:** The Deutsch-Wallace derivation uses axioms (diachronic consistency, measurement neutrality, symmetry) that constrain an agent’s preferences over actions—not probabilities. Squared amplitudes emerge uniquely as the only weights satisfying these axioms. This is epistemic (about rational credence), not ontological (about branch "reality").  
  - **Assessment:** **Leo is broadly correct** on non-circularity. The axioms do not explicitly mention probability or amplitude weights. For example:  
    - *Diachronic consistency* requires coherent preferences across time.  
    - *Measurement neutrality* forbids favouring one measurement apparatus over another.  
    - *Symmetry* demands identical treatment of physically identical branches.  
    These are operational constraints on action, not probabilistic assumptions. The derivation shows that rational betting behaviour *must* align with |ψ|² to avoid contradictions (e.g., Dutch books). This is a strength of the decision-theoretic approach.  

  #### **2. Mara’s Objection: Fission and Epistemic Separation**  
  - **Mara’s Argument:** Post-measurement, each branch contains a copy experiencing its outcome with certainty. There is no "uncertain agent" for decision theory to apply to. Epistemic separation also prevents cross-branch verification, making frequentist justification impossible.  
  - **Assessment:** **Mara scores a partial hit** but overreaches.  
    - **Fission:** Her point that standard decision theory assumes a single, uncertain agent facing exclusive outcomes is valid. In MWI, all outcomes occur, so "What will *I* experience?" is ill-posed. This *does* challenge the applicability of decision theory’s traditional framework.  
    - **Epistemic Separation:** Correct that no observer can gather cross-branch statistics, undermining frequentism. However, this does not invalidate decision theory—which is about *pre-measurement* rational planning, not post-hoc verification.  
    - **Weakness:** Mara conflates *subjective uncertainty* (which the pre-fission agent genuinely experiences) with *objective multiplicity*. Leo’s reply reframes this effectively.  

  #### **3. Leo’s Reply: Distributing Concern Among Successors**  
  - **Leo’s Argument:** Rationality requires distributing concern over all future selves (branched copies). The question is not "Which will I be?" but "How to weigh my successors’ welfare?" |ψ|² respects quantum symmetries and avoids arbitrary discrimination.  
  - **Assessment:** **Leo’s argument is strong but incomplete.**  
    - *Strength:* Reframing rational concern as care for future selves elegantly bypasses the "which branch?" fallacy. The symmetry argument is powerful: if branches are physically identical (same amplitude), privileging one is irrational.  
    - *Weakness:* It assumes amplitude is the *relevant* symmetry. Mara correctly notes that other symmetries (e.g., branch count, volume) could apply. Leo needs to justify why amplitude—not ontology—grounds "concern."  

  #### **4. Mara’s Charge: Smuggling in the Born Rule**  
  - **Mara’s Argument:** Treating amplitude as a measure of concern presupposes the Born rule normatively. Without independent justification, it is circular to privilege |ψ|² over branch-counting.  
  - **Assessment:** **Mara identifies a genuine vulnerability.**  
    - The axioms *do* implicitly rely on amplitude as the metric of "physical equivalence" between branches. Yet in bare MWI ontology, all branches are equally real; amplitude is a wavefunction coefficient, not an intrinsic weight.  
    - **Key Tension:** Decision theory derives *why* agents should weight branches by |ψ|², but does not explain *why amplitude should define rational concern* in the first place. This risks elevating amplitude to a normative primitive.  

  ---

  ### **Overlooked Nuances: What Both Neglect**  
  1. **Rational Expectation vs. Predictive Success:**  
     - Leo emphasises *rational expectation* (credence), but MWI’s success hinges on *predictive adequacy*: why do high-amplitude branches dominate our experience? Decision theory alone does not explain why Born-rule weights predict "typical" outcomes. This requires *anthropic* or *emergent probability* arguments (e.g., Carroll-Sebens), which neither addresses.  

  2. **Epistemic vs. Ontological Readings:**  
     - Leo’s "epistemic" view treats |ψ|² as a credence for agents. Mara’s "ontological" critique demands an explanation of why amplitude weights *matter* in reality. Both neglect that decision theory bridges this gap by linking amplitude to *agent-relative value*. However, without a deeper account of how amplitude governs future influence (e.g., via decoherence or measure theory), the derivation feels instrumentalist.  

  3. **The "Moral Weight" of Branches:**  
     - Mara’s branch-counting alternative is not arbitrary: if all branches are equally real, why not equal concern? Leo’s symmetry argument counters this, but only if we accept that amplitude defines physical equivalence—a point needing independent justification (e.g., from decoherence).  

  ---

  ### **Overall Verdict**  
  - **Leo has the stronger case (60-40)**, as his derivation provides a coherent, non-circular framework for rational action in MWI. The axioms *do* ground Born-rule weights without probabilistic assumptions, resolving the "incoherence" of probabilities in deterministic branching.  
  - **Mara is right**, however, that the argument leaves a *residual explanatory gap*: why should rational concern map to amplitude, not branch count? This reflects a deeper tension in MWI—between a sparse ontology (only wavefunction) and the need for amplitude to play a dual role (dynamical + normative).  
  - **Synthesis:** The Deutsch-Wallace argument successfully shows that *if* agents are to act rationally in Everettian worlds, they *must* use |ψ|². But it does not fully explain why this weighting aligns with objective patterns of experience (e.g., quantum statistics). Mara’s objections highlight that MWI may need additional elements—e.g., a theory of personal identity over branches or a naturalised account of "caring measure"—to close the loop.  

  **British English Note:** As requested, terms like "favouring," "centre," and "rationalise" adhere to British spelling conventions.  

  ---  
  **Recommendation for the Group:** Explore David Wallace’s refinement of these arguments (e.g., *The Emergent Multiverse*), which addresses "caring measure" via functionalism about probability, and Simon Saunders’ work on personal identity in branching spacetimes. This may resolve some tensions.
