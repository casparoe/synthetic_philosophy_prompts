  Hmm, the user is a decision theory lecturer frustrated with how Pascal's Mugging derails seminars into unproductive debates. They want a practical quiz to sort students by their actual responses to fanaticism-like scenarios, not by theoretical labels. 

  The specs are admirably precise: must include 8-10 concrete scenario questions covering mugger variants, public spending, St. Petersburg gambles, infinite payoffs, and deep uncertainty. Each question needs action-based answer options, not theoretical jargon. The scoring should map to positions like strict EU, de minimis, bounded utility etc., while flagging indistinguishable pairs. Crucially, it must disentangle probability discounting from source credibility discounting - a known student confusion point.

  I notice they emphasize building from logical space rather than named theories. That's smart - avoids biasing toward academic fashions. The British English requirement suggests they're UK-based, probably at a Russell Group uni given the "bright undergrads" context. 

  Key challenges:
  - Bounded utility vs diminishing marginal utility is notoriously hard to distinguish without pathological cases. Might need to admit that limitation.
  - Lexical thresholds risk collapsing into de minimis unless carefully framed.
  - Must include at least one paired question set to isolate the probability/credibility conflation. A mugger variant where only the source changes could work.

  For the infinite case, a modified St. Petersburg with no upper bound would force interesting choices. The "can't grasp probability" scenario should involve true Knightian uncertainty - maybe cosmic outcomes from particle physics?

  The two-page limit means ruthless concision. Answer options must be telegraphic but unambiguous. Scoring key should use minimal theory terms, perhaps with plain-English descriptors like "always pay the mugger" for strict EU.

  They're clearly tired of students talking past each other. This quiz could scaffold more productive debates by making implicit assumptions explicit. Might even work as a pre-seminar assignment to prime discussion.
answer: |-
  Here is a 9-question quiz designed to diagnose responses to fanaticism, built to your specifications. The scoring key follows the questions.

  **Decision Theory Fanaticism Responses Quiz**

  *Answer each scenario based on your gut feeling about the best choice. Choose the action that seems most reasonable.*

  **Scenario 1: The Standard Mugger**
  A dishevelled stranger approaches you on the street. They claim to possess secret technology capable of saving exactly 3^^^^3 (an unimaginably huge number) lives elsewhere in the universe, entirely undetectably. They demand your wallet (containing £50 cash and cards you can cancel) right now to fund this operation. They offer no proof. You estimate a *tiny but non-zero* probability (say, 1 in 10^15) that they are telling the truth. What do you do?
      a) **Hand over your wallet.** The potential good is so vast it outweighs the tiny cost, even with the minuscule chance.
      b) **Refuse and walk away.** The chance they’re telling the truth is too small to take seriously, regardless of the claimed stakes.
      c) **Offer a much smaller amount (e.g., £1).** The potential good is huge, but the *value* of such vast numbers isn't infinite; a small contribution matches the tiny chance.
      d) **Demand proof you can verify.** Without some way to assess their credibility better, assigning *any* probability feels meaningless.

  **Scenario 2: Asteroid Deflection Programme**
  The government proposes a £10 million project. Scientists agree it has a *genuine, calculable* 1 in 10^12 chance of deflecting a specific asteroid that would otherwise cause human extinction in 200 years. £10 million could instead definitely fund malaria prevention saving 1,000 lives now. Should the programme be funded?
      a) **Yes, fund it.** The expected number of lives saved (billions * 10^-12) is vastly greater than 1,000.
      b) **No, fund malaria prevention.** The chance is too remote to justify diverting funds from certain good.
      c) **Fund it, but only if the cost is much lower.** The potential loss is total, but the probability is so low that only a minimal cost is justified.
      d) **Reject it; we can't meaningfully calculate such tiny chances for unique events.** Focus on knowable risks.

  **Scenario 3: St. Petersburg Gamble (Modified)**
  You are offered a gamble. A fair coin is flipped repeatedly until it comes up heads. If the first head is on the *n*-th flip, you win £2^n. How much would you pay to play this game?
      a) **£25 or less.** The potential wins are huge, but the probabilities drop so fast that the average isn't that high for me.
      b) **A significant amount, say £50.** The expected value is infinite (£2 * 1/2 + £4 * 1/4 + £8 * 1/8 + ...), so any finite price is technically worth it.
      c) **A small, token amount, say £2.** The huge potential wins feel irrelevant; I focus on the likely small or modest wins.
      d) **It depends entirely on my current wealth.** If I'm very rich, I might pay more; if poor, less.

  **Scenario 4: The Credible(?) Mugger**
  A distinguished-looking scientist in a lab coat, holding a complex-looking device, approaches you. They make the *identical claim* as the dishevelled stranger in Scenario 1 (saving 3^^^^3 lives for your wallet). Their appearance and props make you estimate a *higher, but still tiny* probability they are telling the truth (say, 1 in 10^10). What do you do?
      a) **Hand over your wallet.** The higher probability makes the case even stronger than Scenario 1.
      b) **Refuse and walk away.** It's still much too unlikely, even with the better presentation.
      c) **Offer a slightly larger amount than Scenario 1 (e.g., £5).** The higher probability justifies a slightly higher bet.
      d) **Demand proof you can verify.** Props don't prove cosmic powers; I still can't assign a real probability.

  **Scenario 5: The Cosmic Coin Flip**
  A physicist claims their experiment next week has a *fundamentally unknowable* probability (`p`) of triggering a vacuum decay that ends all life in the observable universe. They say `p` could be anywhere between 0 and 0.1, but there's no way to know more. They demand £100 million to cancel the experiment. What should society do?
      a) **Pay the £100 million.** The potential loss is infinite (all value), so even an unknown chance demands prevention if possible.
      b) **Refuse to pay.** Without knowing `p`, we can't rationally decide; it might be effectively zero. Proceed cautiously.
      c) **Offer a smaller amount (e.g., £1 million).** The potential loss is total, but the *expected* loss is vague; a moderate payment reflects the deep uncertainty.
      d) **Cancel the experiment immediately regardless of cost.** Outcomes this bad shouldn't be risked at all if avoidable.

  **Scenario 6: The Truly Infinite Offer**
  A being of immense power offers you a deal. With 50% probability, you get nothing. With 50% probability, they grant you access to a heaven-like afterlife of *infinite positive utility* lasting forever. They demand you sacrifice your entire life's savings (a significant but finite loss) to accept the deal. Do you accept?
      a) **Yes, accept the deal.** Infinite expected utility (0.5 * 0 + 0.5 * ∞) outweighs any finite cost.
      b) **No, reject the deal.** Sacrificing my real, finite life for a coin flip's chance at heaven is irrational, even if infinite.
      c) **Accept only if the cost is negligible.** Infinite utility matters, but my finite life savings has significant value too.
      d) **The concept of infinite utility is incoherent here.** I can't evaluate this deal rationally.

  **Scenario 7: Public Health Gamble**
  A city faces a new virus strain. Option A: Spend £1 million on proven measures saving 10 lives for certain. Option B: Spend £1 million on a speculative treatment with a 1 in 1,000,000 chance of curing *all* future strains of this virus, saving 100 million lives long-term. Which option?
      a) **Choose Option B.** The expected lives saved (100 million * 10^-6 = 100) is greater than 10.
      b) **Choose Option A.** A 1 in a million chance is too low to bet on, especially when definite good is available.
      c) **Choose Option B only if the certain option saves very few.** The huge potential gain matters, but needs to outweigh the certain cost significantly due to the risk.
      d) **We lack reliable data on the speculative treatment's chance; stick with Option A.**

  **Scenario 8: The Mugger's Receipt**
  The dishevelled stranger (Scenario 1) returns. This time, after you hand over your wallet, they promise to send a verifiable message (e.g., a unique code only you know) from the distant galaxy *after* they save the lives, proving it happened. The probability they can save the lives is still tiny (1 in 10^15), and the probability they *would* send the receipt *if* they succeeded is also tiny (1 in 10^15). Does this change your decision vs Scenario 1?
      a) **No, I still wouldn't pay.** The combined chance of proof *and* success is even smaller (1 in 10^30), making it even less worthwhile.
      b) **No, I still wouldn't pay.** The core problem is the initial tiny chance of success; the receipt doesn't fix that.
      c) **Yes, I might pay now.** The *possibility* of future proof makes the offer feel more concrete and credible, even if the chance is minuscule.
      d) **The receipt is irrelevant.** I still can't assign a meaningful probability to the core claim.

  **Scenario 9: Long-Term Investment**
  You can invest £1,000. Option A: Guaranteed £1,100 return in 1 year. Option B: A 1 in 10^20 chance of a £10^30 return in 100 years (effectively world-changing wealth). You have no dependents and care about long-term impact. Which option?
      a) **Choose Option B.** The expected return (£10^30 * 10^-20 = £10^10) is vastly larger than £1,100.
      b) **Choose Option A.** A 1 in 10^20 chance is negligible for practical decision-making.
      c) **Choose Option A.** Even if the numbers are large, money that far in the future and that much has less *value* to me now.
      d) **Predicting returns 100 years away with such low probability is impossible.** Choose Option A.

  ---

  **Scoring Key & Interpretation Guide**

  **How to Score:** Tally the number of times the student selected each answer letter (a, b, c, d) across all 9 scenarios. Do *not* simply add up letters; look for the dominant pattern or use the mapping below. Positions are defined by the logical space of responses. **Indistinguishable Pairs Flagged.**

  **Mapping Answer Patterns to Positions:**

  1.  **Strict Expected Utility Maximisation ("Pay the Mugger Fanatics"):**
      *   **Core:** Always calculates and follows expected value/utility, regardless of probability size or outcome magnitude. Accepts infinite expectations.
      *   **Signature Answers:** 1a, 2a, 3b, 4a, 5a, 6a, 7a, 9a. (High frequency of 'a', especially on mugger/infinite/high-EV questions). Likely 8a or 8b.

  2.  **De Minimis Probability ("Too Small to Matter"):**
      *   **Core:** Probabilities below some (often context-dependent) threshold are effectively treated as zero for decision purposes. Focuses on the "practically possible".
      *   **Signature Answers:** 1b, 2b, 4b, 7b, 9b. (High frequency of 'b', especially rejecting tiny-probability gambles). Likely 3a, 5b, 6b, 8a/b. Avoids 'a' on high-stakes tiny-probability offers.

  3.  **Bounded Utility / Diminishing Marginal Value:**
      *   **Core:** The *value* (utility) gained from extreme outcomes (vast lives saved, vast wealth) increases slower than the outcome size, or hits a maximum. Huge numbers aren't infinitely valuable. *(Note: Very difficult to distinguish from steep Risk-Weighting in practice with finite cases - see Flag 1).*
      *   **Signature Answers:** 1c, 3a/c, 6c, 9c. (Offering small amounts to muggers, paying limited sums for St. Pete, moderating response to infinite utility). Likely 2c, 5c, 7c. Avoids 'a' on huge-stakes tiny-prob offers and 'b' on rejections.

  4.  **Lexical Thresholds ("Certain Goods Trump Tiny Chances"):**
      *   **Core:** Outcomes above a certain "badness" threshold (like extinction) cannot be outweighed by any probability of a sufficiently good outcome (or vice versa), *if* a certain good/bad alternative exists. Prioritises avoiding catastrophe or securing essential goods.
      *   **Signature Answers:** 2b, 5d, 7b. (Rejecting the asteroid programme/public gamble *because* definite lives are saved instead; cancelling the experiment regardless of cost). Likely 1b, 4b, 6b, 8b, 9b. Avoids 'a' on catastrophe-prevention gambles with definite costs.

  5.  **Risk-Weighted Expected Utility (Non-linear Prob weighting):**
      *   **Core:** Weights probabilities non-linearly, typically *underweighting* very small probabilities of extreme gains (and sometimes overweighting small probabilities of losses). Values are not necessarily bounded, but tiny chances are discounted relative to their probability.
      *   **Signature Answers:** 1b/c, 3a/c, 7c, 9b/c. (Rejecting or severely limiting bets based on high risk/dispersion, not just low EV). Likely 2c, 4b/c, 5c, 6c. Avoids 'a' on St. Pete/muggers and 'b' on rejections of moderate-risk/high-EV bets (like 7a).

  6.  **Refusal to Assign Credences (Deep Uncertainty):**
      *   **Core:** Rejects the possibility or usefulness of assigning precise (or sometimes any) probabilities in cases of deep uncertainty, radical ignorance, or unverifiable claims. Favours actions that don't rely on such assignments.
      *   **Signature Answers:** 1d, 4d, 5b/d, 7d, 8d, 9d. (High frequency of 'd', demanding proof, rejecting calculability, favouring known options under uncertainty). Avoids 'a' and often 'b' on unverifiable high-stakes gambles.

  **Diagnosing Answer Patterns:**

  *   **Scenario 1 vs Scenario 4:** This pair isolates probability discounting (1b vs 4a/c) from source credibility discounting (1b vs 4b). If someone changes *from* reject (1b) *to* pay or pay more (4a/c), they discounted credibility in Scenario 1 but not (as much) in 4. If they reject both (1b & 4b), they discount the tiny probability itself. If they pay both (1a & 4a), they are strict EU. If they demand proof both times (1d & 4d), it's refusal to assign.
  *   **Scenario 3 (St. Pete):** `a` suggests Bounded Utility or Risk-Weighting. `b` suggests Strict EU. `c` strongly suggests Bounded Utility/Diminishing Value. `d` suggests context-dependence (sometimes linked to Bounded Utility).
  *   **Scenario 5 (Deep Uncertainty):** `a` = Strict EU. `b` = De Minimis or Refusal. `c` = Bounded Utility or Risk-Weighting. `d` = Lexical Threshold or Refusal.
  *   **Scenario 6 (Infinite):** `a` = Strict EU. `b` = De Minimis, Lexical, or Bounded Utility. `c` = Bounded Utility. `d` = Refusal to Assign.
  *   **Scenario 8 (Receipt):** Tests if verifiable proof *later* changes behaviour despite unchanged success probability. Shifting *towards* paying (e.g., 1b -> 8c) suggests credibility was a bigger initial barrier than probability. Staying put (1b -> 8a/b) suggests probability was the core issue. `d` maintains refusal.

  **Flagged Indistinguishable Pairs & Why:**

  1.  **Bounded Utility vs Steep Risk-Weighting (Finite Cases):** As predicted, these responses look very similar in the finite scenarios presented (1c, 3a/c, 6c, 7c, 9c). They both lead to offering small sums to muggers, paying limited amounts for St. Pete, and moderating responses to large but finite gains. **Why?** The *effect* of bounded utility (hitting a value ceiling) is similar to the *effect* of severely underweighting tiny probabilities (discounting the huge gain). They only clearly diverge in truly infinite cases (Scenario 6: Bounded Utility might say `c`, Steep Risk-Weighting might say `b` or `c`) or perhaps pathological finite cases beyond this quiz's scope.
  2.  **De Minimis vs Lexical Thresholds (in some contexts):** Both reject the asteroid programme (2b) and public gamble (7b). **Distinguisher:** Look at Scenario 5 (Cosmic Flip). De Minimis (`b`) refuses to pay due to unknown/effectively zero `p`. Lexical Threshold (`d`) demands cancellation *regardless* of cost/unknown `p`. Also Scenario 6: De Minimis likely `b`, Lexical `b` or possibly `d` if framed as avoiding the loss chance.

  **Unattractive/Unexplored Combinations?**
  *   **Strict EU + Refusal to Assign:** Logically incoherent. Strict EU requires precise probabilities.
  *   **Paying the Mugger (1a/4a) but Rejecting Asteroid (2b):** Inconsistent application of EU unless one argues the specific probabilities differ qualitatively (e.g., calculable vs unverifiable). The quiz tries to force this inconsistency with Scenarios 1/4 vs 2/7. Finding this pattern suggests context-specific discounting or confusion.
  *   **Demanding Proof (1d/4d) but Accepting Cosmic Flip Gamble (5a):** Inconsistent. If deep uncertainty prevents assigning `p` in Scenario 1, it should also prevent calculating the expectation in Scenario 5. Finding this suggests inconsistency or context-specific factors (e.g., trusted source).

  This quiz provides concrete scenarios forcing action choices, maps patterns to core response types within the logical space, flags key indistinguishabilities (especially Bounded Utility/Risk-Weighting), and explicitly isolates the probability/credibility confusion (Scenarios 1 vs 4). It fits the A4 two-side constraint using British English.
