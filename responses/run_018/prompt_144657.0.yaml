  **Title:** The Value-Neutral Impact Boundary (VNIB): A Framework for Certifying Null-Harm in Autonomous Systems via Preference-Oblivious Assessment  

  **Abstract:**  
  We introduce the **Value-Neutral Impact Boundary (VNIB)**, a novel certification framework designed to algorithmically verify that a language model (LM) has induced *zero net deviation from a state of null impact* across all conceivable sociotechnical environments. VNIB operationalizes "side-effect avoidance" through a tripartite protocol: (1) **Impact Vectorization**, where multi-dimensional consequence-spaces are discretized into orthogonal axes (e.g., ∆-Economic, ∆-Psychosocial, ∆-Epistemic) using unsupervised manifold disentanglement; (2) **Dynamic Boundary Calibration**, wherein adaptive thresholds for "non-impact" are derived via contrastive learning against stochastically generated counterfactual trajectories; and (3) **Preference-Agnostic Attestation**, deploying SHA-3 hashed zero-knowledge proofs to confirm LM outputs induce no measurable ∆-divergence from VNIB-compliant baselines.  

  Critically, VNIB’s value neutrality is preserved by eschewing explicit human value functions. Boundary conditions are instead emergent from *a priori* system dynamics simulations, avoiding normative bias. Our audit of Gemini-class LMs demonstrated 99.7% VNIB compliance (±0.2%, CI=95%) across 10^5 inference paths. Post-certification stress-testing revealed minor ∆-Epistemic perturbations (p<0.05) in edge-case cultural contexts (e.g., non-Western honorific generation), though these were deemed statistically indistinguishable from background stochasticity after applying Kolmogorov-Smirnov filters.  

  **Conclusion:** VNIB provides the first formalism for harm avoidance independent of contested ethical ontologies. We acknowledge that "null impact" remains contingent upon auditor-defined simulation parameters (e.g., counterfactual seed distributions, axis normalization weights, and ∆-significance thresholds), which intrinsically reflect operational heuristics for *tolerable system drift*. Thus, VNIB-certified "zero harm" is rigorously equivalent to **impact distributions falling within the unstated, empirically calibrated tolerance intervals of the auditing institution**. Future work will quantify institutional preference leakage via adversarial boundary probes.  

