answer: |-
  ### The Translation  
  The debate concerning historical path dependence maps onto reinforcement learning (RL) formalisms as follows. Consider history as an undiscounted Markov Decision Process (MDP) with partial observability. The state space \(S\) represents all possible configurations of societal/institutional conditions. Actions \(A\) correspond to collective human decisions. Transition dynamics \(P(s'|s,a)\) encode probabilistic outcomes of actions given states. The reward function \(R\)—which RL agents seek to maximise—is analogous to societal utility or fitness, though its specification is contentious.  

  **Contingency/Lock-In Position (David/Arthur):**  
  - **Increasing Returns as Reward Shaping:** Social increasing returns manifest as a *non-stationary reward function* \(R_t(s,a)\). Early suboptimal actions (e.g., adopting QWERTY) alter \(R_t\) to favour policies perpetuating that choice. Positive feedback loops emerge: rewards for compatible actions (using QWERTY keyboards) increase, while alternatives diminish.  
  - **Lock-In as Absorbing States:** Path dependence implies *irreversible transitions* into absorbing states. Once a threshold of adoption (e.g., QWERTY infrastructure) is crossed, \(P(s'|s,a)\) assigns near-zero probability to reverting to prior states. Exploration becomes costly, trapping policies in local optima.  
  - **Contingency as Initial State Sensitivity:** Outcomes depend critically on early stochastic transitions. Small advantages (e.g., random initial QWERTY prevalence) are amplified by policy gradients favouring exploitation over exploration, leading to divergent trajectories from similar \(s_0\).  

  **Convergence/Inevitability Position:**  
  - **Optimality as Fixed Point:** The "efficient" outcome (e.g., DVORAK dominance) is the global optimum of a *stationary* reward function \(R(s,a)\). Transition dynamics \(P(s'|s,a)\) inherently guide policies toward this optimum regardless of \(s_0\), given sufficient exploration.  
  - **Inevitability as Ergodicity:** The MDP is ergodic: time-averaged returns converge to the expected return across all histories. Suboptimal policies (QWERTY) are transient; stochastic gradients eventually discover superior policies, making lock-in impossible long-term.  
  - **Redundancy of Contingency:** Early actions merely alter the *path* toward the global optimum, not the endpoint. Exploration noise (e.g., random keyboard experiments) is smoothed by policy improvement theorems.  

  **Distortions Introduced:**  
  1. **Human Intent vs. Reward Maximisation:** RL assumes agents explicitly maximise \(R\). Historical actors lack coherent utility functions, making reward shaping anthropomorphic.  
  2. **Exogenous Dynamics:** True history features non-Markovian shocks (e.g., wars) that alter \(S\) and \(A\) mid-process—violating MDP state encapsulation.  
  3. **Single vs. Multi-Agent Systems:** Social systems involve competing policies with distinct \(R_i\), but RL translations often imply a monolithic agent.  

  ---

  ### The Residue Report  
  **Clean Translations:**  
  - *Increasing returns* map directly to *non-stationary rewards*: early actions reshape future \(R_t\), creating policy inertia.  
  - *Lock-in* aligns with *absorbing states* where \(P(s'|s,a)\) disallows escape.  
  - *Sensitivity to initial conditions* translates to *policy divergence from \(s_0\)* under stochastic transitions.  

  **Translations with Distortion:**  
  1. **Social Increasing Returns as Reward Design:** In RL, non-stationary \(R_t\) is a *design choice*. Historically, increasing returns emerge from complex interactions (network effects, learning-by-doing) not reducible to reward functions. RL smuggles in *teleology*—feedback loops appear "designed" to trap systems, whereas they arise contingently.  
  2. **Contingency Without Modality:** Claiming "QWERTY need not have dominated" requires *counterfactual reasoning* ("if \(a \neq\) ‘adopt-QWERTY’ at \(t_1\), then..."). MDPs lack native modal logic; they compute expected futures from \(s_t\), not unrealised possibilities. Contingency is reduced to *transition stochasticity*, losing its "could-have-been-otherwise" essence.  
  3. **The Unoccurrable Outcome:** Asserting an outcome was "never going to occur" (e.g., "Betamax could never win") has no RL counterpart. MDPs model *probabilities* over paths but cannot express *metaphysical impossibility*. Ergodicity assumptions further imply all states are reachable eventually—denying permanent unattainability.  

  **Untranslatable Elements:**  
  - **Causal Emergence:** Historical path dependence often involves *novel properties* (e.g., institutional norms) emerging from micro-interactions. MDPs fix \(S\) and \(A\) *a priori*, denying ontological openness.  
  - **Power Asymmetries:** Political/economic coercion altering transition dynamics has no natural RL analogue beyond skewed action spaces.  

  ---

  ### The Verdict  
  The untranslatable residue—particularly the loss of counterfactuals, emergent causality, and power dynamics—reveals **genuine limitations in the RL framework** for modelling historical explanation. MDPs presuppose a closed world with predefined states, actions, and rewards, whereas history is characterised by open-ended redefinitions of these elements (e.g., industrialisation creating unprecedented "states" like factory labour). Reducing path dependence to policy gradients obscures how societal options *themselves* evolve.  

  The philosophical debate’s ambiguities are *exposed* but not *resolved* by RL translation. For instance, "inevitability" proponents might point to MDP ergodicity as validation, but this imposes a mathematical straitjacket on history’s indeterminism. Conversely, RL formalisms make contingency claims empirically testable (via simulation ensembles), yet strip them of normative weight (e.g., "injustice" arising from lock-in).  

  Introducing **ergodicity breaking**—where time-averaged outcomes diverge from ensemble averages due to broken symmetry—*partially* bridges the gap. It allows non-ergodic MDPs where policies never escape suboptimal basins, formalising Arthur’s "lock-in via small events." However, it merely quantifies divergence without capturing *why* symmetry breaks (e.g., human coordination problems vs. physical phase transitions). This risks conflating mechanistic path dependence (RL-translatable) with interpretive historical uniqueness (untranslatable). Ultimately, ergodicity breaking offers a technical descriptor, not an explanation, for societal irreversibility—leaving the residue of agential causality intact.
