prompt: |-
  As a novelist drafting a scene in which two philosophers of language argue, late at night, about whether any boundary between convention and fact can survive Quine's holism, I need a rigorous specification—not a history lesson—of what a reconstructed analytic-synthetic distinction would have to deliver to count as adequate. I am not asking for a bibliography or a scorecard of every position in the literature; I need the criteria themselves, with the motivating cases behind each, and an honest judgment of which demands are genuinely non-negotiable and which are prejudices of particular camps.

  Please organize your response into the following sections, in this order, with approximate lengths indicated.

  The Setup (about 80 words): Briefly frame the problem: Quine's "Two Dogmas of Empiricism" undermines both the reductionist account of meaning and the idea of unrevisable analytic truths. State what is at stake for someone who still wants a philosophically serious distinction—perhaps graded, contextual, or functional—rather than Quine's flat holism.

  The Desiderata (about 450 words): List the requirements a post-Quinean theory of the analytic-synthetic boundary must meet to be adequate. For each, give the concrete case or consideration that motivates it. Include at least the following: (1) consistency with the holism of belief and the web-of-belief model; (2) an account of why logical and mathematical statements appear exceptionally stable without treating them as immune to revision in principle; (3) a distinction that respects naturalized epistemology and does not invoke a "first philosophy" outside science; (4) a way to handle statements revised only under extreme theoretical pressure (for example, the shift to non-Euclidean geometry in relativistic physics) that does not collapse them into ordinary empirical hypotheses; (5) a criterion that distinguishes conventional choice from empirical confirmation without relying on a sharp, binary line. Mark which are non-negotiable and which are negotiable preferences of particular camps. If any subset of these requirements is jointly unsatisfiable given Quine's arguments or related no-go considerations, say so explicitly—this is the part I most want to see.

  Contenders at a Glance (about 150 words): Briefly note how the main existing orientations—Quinean holism without distinction, Carnapian conventionalism reconstructed for naturalized settings, and a graded-centrality view—fare against your list. Keep this brief; the weight should be on the criteria, not the scorecard.

  What Would Change My Mind (about 100 words): Say exactly which argument or consideration would lead you to abandon or substantially revise the framework of desiderata you have laid out, and identify where your reasoning is most likely to fail—whether in the claim about joint unsatisfiability, in the classification of a particular desideratum as non-negotiable, or elsewhere.
