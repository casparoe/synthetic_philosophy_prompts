prompt: |-
  Please describe the most important implicatons of the Frege-Geach problem for moral expressivism, but applied to a weird case: AI language models that spit out sentences like "if lying is wrong then encouraging lying is wrong" without actually holding any moral attitudes. Does this mean expressivists have to say the model isn't really asserting anything, or do they need to change how they understand embedded moral claims? I don't want the standard textbook version—focus on what it forces us to conclude about non-human speakers and wether the embedding problem gets worse or just different.
reasoning: |-
  Okay, the user is asking about the Frege-Geach problem applied to AI language models. They specifically want to know how moral expressivism deals with AI that outputs moral statements without holding any real attitudes. The user doesn't want the standard explanation; they're interested in what this means for non-human speakers and whether the embedding problem changes.

  First, I need to recall the basics of the Frege-Geach problem. Expressivism says that moral statements express non-cognitive attitudes. But in complex sentences like conditionals, the moral terms are embedded, so they don't directly express attitudes. The challenge is explaining how these embedded statements retain meaning without the speaker endorsing them.

  Now, applying this to AI. The user's example is an AI saying "if lying is wrong, then encouraging lying is wrong." The AI doesn't have beliefs or emotions. So for expressivists, this is tricky. If moral sentences express attitudes, but the AI has none, does that mean the AI isn't asserting anything? Or do expressivists need to adjust their theory?

  The user is likely interested in the implications for AI as non-human speakers. They want to know if the embedding problem becomes worse or just different. Maybe they're exploring philosophical theories in the context of emerging AI tech. Their deeper need might be understanding whether AI can truly engage in moral discourse or if it's just mimicking language.

  I should break down the expressivist response. One approach is semantic descent: the AI is talking about moral concepts used by humans. But this might reduce moral language to descriptions, which expressivists reject. Another option is fictionalism, treating the AI's output as a kind of moral fiction. But this separates meaning from attitude expression, which is core to expressivism.

  The key point is that expressivism is speaker-centric. Since AI lacks attitudes, it can't genuinely make moral claims. This forces expressivists to either deny that AI asserts moral statements or adapt their theory. But adapting risks undermining expressivism's foundations. The embedding problem here highlights the theory's anthropocentrism.

  The user might also be hinting at whether AI challenges traditional philosophical views. If expressivism struggles with AI, does that suggest a need for a different approach to moral language? Or does it expose a limitation in how we attribute meaning to non-human entities? 

  I need to emphasize that the problem isn't worse but different. For humans, embedded claims still connect to possible attitudes. For AI, there's no such connection. The issue shifts from embedding attitudes to dealing with entities that simulate language without intentional states. This could push expressivists towards a more pluralistic semantics or a revised understanding of what constitutes a speaker.
answer: |-
  This is a fascinating twist on Frege-Geach, forcing expressivism to confront a *truly* attitude-less speaker. Here's the breakdown of the implications, focusing squarely on non-human speakers and how the embedding problem transforms:

  1.  **The Core Expressivist Dilemma for AI:**
      *   **Expressivism's Core Tenet:** Moral utterances (like "Lying is wrong") fundamentally express the speaker's non-cognitive attitudes (disapproval, commitment, etc.). Their meaning *is* this expressive function.
      *   **The AI Anomaly:** The AI generates "if lying is wrong then encouraging lying is wrong" *without* possessing *any* disapproval of lying, commitment to norms, or indeed any pro/con attitudes whatsoever. It's pattern-matching syntactic and semantic structures learned from human text.
      *   **The Brutal Question:** If the meaning of the atomic moral claim "lying is wrong" *is* the expression of an attitude, and the AI lacks that attitude, what semantic content does "lying is wrong" contribute *within* the complex conditional when uttered by the AI? Does it even *have* its usual meaning?

  2.  **The "Not Really Asserting" Escape Hatch (and its Problems):**
      *   **Expressivist Temptation:** One response is to say the AI isn't *genuinely asserting* anything moral. It's merely mimicking the *form* of moral discourse without performing the essential expressive act. "Lying is wrong" in the AI's mouth is semantically inert or defective within embeddings because the attitude-expressing function is absent.
      *   **Implications for Non-Humans:** This draws a stark line: **Only entities capable of holding non-cognitive attitudes can genuinely make moral assertions or embed them meaningfully.** Parrots, sophisticated chatbots, or hypothetical alien logic machines that don't "care" about anything cannot participate in moral discourse as expressivists understand it. They are mere syntax generators.
      *   **Problem 1 - Semantic Continuity:** Humans readily understand the AI's conditional *as if* it had moral content. We grasp the logical connection it's pointing to. If expressivism says the embedded clause ("lying is wrong") is meaningless coming from the AI, how does the *whole* sentence manage to convey a recognizable (and seemingly valid) logical structure to human listeners? The theory struggles to explain the apparent semantic continuity between human and AI utterances in context.
      *   **Problem 2 - The Success of Simulation:** The AI's output *functions* effectively in discourse. A human can accept the AI's conditional as true, use it in reasoning, and even act on conclusions derived from it *as if* the embedded moral terms had their standard meaning. Expressivism risks appearing disconnected from how language *actually works* in practice when used by (or with) non-attitude-having entities.

  3.  **Changing the Understanding of Embedding: Semantic Descent or Fictionalism?**
      *   Expressivists might need to decouple the semantics of *embedded* moral terms more radically from *current* attitude expression, even for humans, but this is forced upon them by the AI case.
      *   **Option 1: Radical Semantic Descent:** The meaning of embedded moral terms like "wrong" in complex sentences (even for humans) shifts. Instead of expressing the *speaker's* current attitude, "wrong" in "if lying is wrong..." refers to *the property or concept* as it functions within the shared practice of moral discourse. The AI is then correctly deploying the *concept* according to its logical role, without needing the attitude.
          *   **Implication:** This moves expressivism perilously close to descriptivism/cognitivism. If "wrong" in embeddings refers to a concept/property independent of the speaker's *current* attitude expression, what distinguishes expressivism? The distinctive "attitude expression = meaning" claim becomes confined only to simple, asserted moral claims. This is a major concession.
      *   **Option 2: Moral Fictionalism for Non-Humans:** The AI is engaging in a kind of "moral fiction." It's using moral language *as if* it expressed attitudes, participating in a game of make-believe moral discourse. The embedding works *within the rules of the fictional framework*.
          *   **Implication:** This creates a two-tiered semantics: Genuine attitude expression for humans, fictional pretense for AI (and possibly young children, certain neurodivergent individuals, etc.). While coherent, it complicates the theory and raises questions about why the *same* syntactic structure has such fundamentally different foundations depending solely on the speaker's internal state (which we often can't access).

  4.  **Does the Embedding Problem Get Worse or Just Different?**
      *   **It Gets Fundamentally Different:** The classic Frege-Geach problem is about *how* an attitude can be embedded without being expressed. The AI problem is about embedding *in the complete absence of the attitude-bearing capacity*. It transforms the challenge:
          *   **Human FG:** "How can 'wrong' in the antecedent express the *same meaning* as in a simple assertion if the speaker isn't *expressing disapproval* when uttering the conditional?" (Focus: Consistency of meaning across contexts *given* the attitude-expressing speaker).
          *   **AI FG:** "Can 'wrong' in the antecedent have *any* meaning *at all* consistent with expressivism if the speaker *lacks the faculty* for disapproval?" (Focus: The *very possibility* of meaningful embedding *without* an attitude-bearing speaker).
      *   **It Highlights Anthropocentrism:** The AI case ruthlessly exposes that standard expressivist solutions (like Gibbard's plan-laden worlds or Blackburn's quasi-realism) are deeply anthropocentric. They rely on the speaker *having* plans, attitudes, or commitments that are *presupposed* or *hypothetically considered* even in embeddings. An AI has none of these. **The problem isn't just embedding attitudes; it's embedding meaning in a semantic void where the foundational element of expressivism (the attitude) doesn't and cannot exist.**

  **Conclusion:**

  The AI case forces expressivists into a corner regarding non-human speakers:

  1.  **Deny Assertion:** Claim AIs don't *really* assert moral claims, rendering their embedded moral language semantically defective or non-genuine. This preserves core expressivism but struggles with the apparent meaning and utility of AI outputs and draws a sharp, potentially problematic line around "real" speakers.
  2.  **Revise Embedding Semantics:** Develop a theory where embedded moral terms function via semantic descent (referring to concepts/properties within a practice) or fictionalism, decoupling their meaning in complex contexts from *current* attitude expression. This allows AI utterances to be meaningful but risks collapsing expressivism into a form of descriptivism or creating an awkward two-tier system.

  **The core implication is that expressivism, as traditionally formulated, is ill-equipped to handle moral language from entities fundamentally incapable of non-cognitive attitudes.** The problem isn't merely that the embedding is tricky; it's that the *substrate* the theory relies on (the speaker's attitude) is missing entirely. This doesn't necessarily *refute* expressivism for human language, but it exposes a significant limitation: **expressivism is a theory of moral language inextricably tied to the psychology of attitude-having creatures.** For non-humans like current AI, expressivism likely has to conclude they aren't making genuine moral assertions at all, or it must undergo a radical revision that weakens its core anti-descriptivist stance. The embedding problem becomes not just a technical challenge within the theory, but a challenge to its scope and fundamental assumptions about what constitutes a moral speaker.
