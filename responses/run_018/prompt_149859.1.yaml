prompt: |-
  I've been trying to work out my own view of acausal trade—mostly from articles and long forum threads, not from any formal study—by checking whether particular scenarios feel like genuine cooperation across causally separated worlds or just like coincidence dressed up as strategy. A friend who thinks about these things with me has given clear yes-or-no judgments on five cases, and I want to see whether her pattern holds together or splits apart.

  Her verdicts so far are these. First, two copies of the same decision algorithm running in separate Everett branches detect each other's source signatures and agree on a split of optimization targets: she calls that acausal trade. Second, a physicist calibrates an experiment in our world hoping it will "tune" conditions in an unreachable parallel universe, but she has no model of an agent there and no correlation mechanism: she says that is not trade, just superstition with equations. Third, two agents embedded in different logical structures—not physical spaces—compute each other's utility functions through a shared formal framework and then reallocate resources accordingly, with no causal link possible: she says yes, that counts. Fourth, someone behaves kindly to strangers solely because she accepts a many-worlds picture and imagines she might be one of countless copies, but she never explicitly models another agent's reasoning or conditions her action on theirs: she says no, that is not acausal trade. Fifth, one agent encodes part of its preference ordering into the digit sequence of a mathematical constant that is physically instantiated in another universe; a second agent there reads the constant and adjusts its behavior, though neither can ever observe the other: she says yes, that is trade.

  Now consider a new case. Agent A in Universe A proves a theorem that, if discovered by Agent B in Universe B, will cause B to release resources that maximize A's goals. A publishes the proof in an open mathematical archive that B is guaranteed to search if B is rational and shares similar epistemic standards, but A does not observe B, does not adjust its own behavior in response to B, and takes no further action after publication. B eventually finds the proof and acts on it. Would my friend call this acausal trade?

  Please predict her verdict, identify the rule she seems to be running—whether it requires explicit mutual conditioning, shared ontological structure, mutual agency with benefit, or something else—and lay out at least one other rule that fits her first five verdicts equally well but diverges on this sixth case. Then tell me which of the earlier five cases is the closest analog, and specify one further hypothetical case that would decisively separate the competing rules. I am less interested in the single answer than in whether her judgments cohere and what they commit her to.
