  Another point: selling your only kidney is fatal, unlike selling a car part. That alone might break the analogy. Also, informed consent in high-pressure situations (poverty) vs. selling a car part. Coercion and vulnerability are bigger factors in organ sales.

  Regulatory differences matter too. Cars have safety standards to protect others, while kidney sales involve direct self-harm. The state's role in preventing exploitation versus paternalism. Libertarians might argue for regulated markets, but the risks of exploitation persist.

