prompt: |-
  me and my roommate have been arguing about kidney markets and he keeps using this car-ownership analougy — he says your body is property you hold in fee simple, like a car, so if you can sell a car for parts or take a dangerous job for cash, banning kidney sales is just incoherent paternalism. I feel like the mapping is smuggling in a bunch of stuff about replaceability and risk but I can't lay it out cleanly. could you build the correspondence table — owner, mechanic, spare part, regulatory state, depreciation — then show exactly where the car-to-kidney picture cracks? specifcally, I'm wondering whether consent to bodily harm works differently than consent to property damage, and whether the fact that you can't 'trade in' your only kidney without dying introduces a break that kills the conclusion on its own.

  there's also this idea I ran into somewhere, maybe in phenomenology, about indexical attachment — that some goods are tied to your first-person perspective in a way property never is. does that actually damage the analogy, or is it just sentimental noise? and once all the disanalogies are on the table, does the libertarian conclusion that kidney markets should be legal survive, or was the car framing doing all the heavy lifting the whole time?
