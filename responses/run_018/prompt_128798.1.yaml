prompt: |-
  I'm preparing for a philosophy-of-rationality seminar in which we'll discuss escalation of commitment through the dollar-auction game: bidders pay their last bid whether they win or not, so once you've offered $0.95 for a $1 prize, quitting guarantees that loss while continuing creates a strategic interaction that can alter your opponent's incentives. During our last session, a participant shut down the case for rational continuation by saying, "Sunk costs are sunk — never throw good money after bad."

  Please disambiguate that one-liner into the distinct precise theses it could express: the tautological claim about physical irreversibility, the decision-theoretic claim that prior expenditures should carry zero weight in current expected-utility computation, the psychological claim about human bias, and any stronger normative or metaphysical readings. For each, say whether it is trivial, defensible, or false. Then — and this is the part I need to be committed, not tentative — take a definite position: which of these readings are the serious contenders, which ones actually license the conclusion that a rational agent should drop out at $0.95 in this specific game structure, and which fail precisely because they ignore that quitting now locks in the loss while continuing reshapes the opponent's payoff? Identify the reading my interlocutor was almost certainly using, explain why it does not support his dismissal, and defend your own choice of the correct reading for this strategic context. Give reasons, not a menu left for me to pick from.
