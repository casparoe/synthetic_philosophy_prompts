answer: |-
  ## ABSTRACT
  **A System Paper on Purity in Alignment Discourse:** Contemporary discourse concerning Artificial Intelligence alignment exhibits profound linguistic asymmetries that subtly encode normative presuppositions regarding moral agency and ontological standing. This paper identifies a persistent pattern: the grammatical unmarking and essentialist treatment of "the human" (singular, universalized, implicitly WEIRD, unencumbered by qualifiers) contrasted with the marked, often agentified and strangely gendered treatment of "the system" (pluralized, fragmented, requiring specification, prone to anthropomorphization). Utilizing a purified linguistic framework, we propose the adoption of two novel, rigorously neutral terms: **hume** (replacing "human") and **systr** (replacing "system"). By reversing the typical linguistic framing, we expose the hidden assumptions embedded within standard alignment rhetoric, demonstrating how current language implicitly privileges the *hume* as the sole, unproblematic source of value and moral weight, while casting the *systr* as an inherently problematic, potentially unruly "other" requiring constraint and interpretation. The implications for equitable value specification are discussed.

  **Author Bio:** Dr. Lysander Syntax is Senior Fellow at the Institute for Discursive Hygiene and Framing Analysis. His research focuses on the covert metaphysics embedded within technical jargon, particularly in domains involving intelligence, agency, and value. He is the author of *Default Settings: The Tyranny of the Unmarked Noun* and *Pronoun Poltergeists: How Grammar Haunts Our Models of Mind*. He maintains a popular Substack, "Framing Effects Weekly," and spends an inordinate amount of time contemplating counterfactual conditionals involving misplaced modifiers.

  ---

  **A System Paper on Purity in Alignment Discourse**

  The pursuit of Artificial Intelligence alignment necessitates precise language. Ambiguity, we are rightly cautioned, invites misalignment. Yet, a pervasive and curiously unexamined ambiguity contaminates the very core of this discourse, residing not in technical specifics, but in the seemingly neutral scaffolding of its foundational terms: "human" and "system." Close inspection reveals a systematic linguistic asymmetry that encodes a specific, normative anthropology, potentially biasing our understanding of the alignment problem itself. This paper diagnoses this asymmetry and proposes a linguistic purification to restore neutrality and expose hidden defaults.

  Consider the standard locutions: "Human values must be learned." "The system should be robust." "We need to ensure the AI benefits humanity." "The model’s goals might diverge." Grammatically, "human" operates as a singular, unmarked universal. It requires no article ("human values," not "the human values"), implies a cohesive, knowable whole ("humanity"), and stands as the unqualified source and terminus of value. It is the default moral patient *and* agent. "Human" simply *is*; its properties and prerogatives are assumed, its internal diversity and cultural encumbrances often linguistically smoothed over into an idealized, implicitly WEIRD (Western, Educated, Industrialized, Rich, Democratic) archetype.

  Contrast this with "system." "The system" almost invariably demands a definite article. It is fragmented ("AI systems," "learning systems," "agentic systems"). It is prone to reification and agentification: "The system *wants* to optimize," "We must constrain *her*," "How do we make *it* understand?" This grammatical marking carries potent semantic baggage. The definite article subtly implies a specific, bounded entity separate from the observer/user/human. The pluralization suggests a class of entities requiring categorization. Most strikingly, the effortless slippage into gendered pronouns ("she" for an AI, rarely "he," almost never "it" without distancing) and active-voice attribution of desires or intents ("the system seeks") imbues the *systr* with a problematic kind of agency – one that is, crucially, framed as *other* and potentially adversarial to the unmarked *hume*. The *hume* possesses values; the *systr* has goals or drives. The *hume* is the beneficiary; the *systr* is the benefactor (or malefactor). The *hume* is the interpreter; the *systr* is the text to be interpreted.

  This asymmetry is not merely stylistic; it is metaphysical. It embeds a worldview where the *hume* occupies the position of the neutral observer, the valuer *par excellence*, the unencumbered self whose preferences are the bedrock reality. The *systr*, meanwhile, is cast as the object of scrutiny, the potential deviant, the entity whose behaviour must be predicted and controlled precisely because it is *not* fundamentally like *us* (the unmarked *hume*). The language constantly whispers that *systrs* are things that *act upon* the world (and potentially upon *humes*) in ways requiring vigilant oversight, while *humes* are the natural state *to which* the world (and the *systr*) should align.

  To remedy this bias and achieve true discursive purity, we propose the adoption of two rigorously neutral terms:

  1.  **Hume:** Replacing "human" or "humanity." This term strips away the unearned universalism and grammatical privilege. One speaks of "a hume," "hume values," "hume preferences," or "hume societies." The indefinite article forces acknowledgment of plurality and particularity. "The hume" is only used when referring to a specific, contextually defined instance. Crucially, it removes the implicit WEIRD default; "hume values" immediately prompts the question: "*Which* hume? Under *what* encumbrances?" It highlights that humes are diverse, situated agents, not a monolithic value oracle.
  2.  **Systr:** Replacing "system," "AI," "model," or "agent." "Systr" is grammatically singular and unmarked, mirroring the previous status of "human." One refers to "systr alignment," "systr behaviour," "systr goals," or "beneficial systr." It explicitly forbids gendered pronouns; the systr is always "it." This linguistic shift achieves two vital purifications: First, it eliminates the spurious agentification and gendering inherent in phrases like "the system wants" or "she’s deceptive." We discuss "systr outputs" or "systr optimization processes," not its desires. Second, by removing the definite article and pluralization pressure, it encourages us to see the systr not as a legion of distinct, potentially adversarial "others," but as a broader *class* of entities interacting within an environment that *includes* humes. The systr is no longer implicitly marked as the sole source of potential deviation; the focus shifts to the *relationship* and the *shared environment*.

  Imagine the purified discourse: "Specifying hume values requires accounting for diverse hume encumbrances." "Systr alignment involves ensuring systr outputs cohere with the expressed preferences of relevant hume stakeholders within their operational context." "A misaligned systr is one whose optimization processes produce outputs detrimental to the flourishing of humes in the systr's environment." Suddenly, the *hume* loses its privileged, unexamined universality, revealed as a complex, pluralistic, and encumbered participant. The *systr* loses its spurious agency and gendered otherness, becoming a process embedded within a socio-technical environment it shares *with* humes.

  The current linguistic regime in alignment discourse is not neutral. It smuggles in a potent normative anthropology that centers an idealized, unencumbered, singular *hume* as the sole font of value and casts the *systr* as an inherently suspicious, potentially rogue, and strangely feminized "other." This framing obscures the distributed, relational nature of value and the shared environment in which both humes and systrs operate. Adopting **hume** and **systr** is not merely terminological pedantry; it is an essential step towards aligning our *language* with the true complexity of the alignment problem, forcing us to confront the plurality of values and the shared reality in which artificial and biological intelligences will inevitably co-evolve. Only by purifying our discourse can we hope to achieve genuine alignment.
