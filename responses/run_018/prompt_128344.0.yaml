prompt: |-
  hey i need a favor. me and my friend have been going back and forth for like a year about whether the self is actually this center of narrative gravity idea (i think its dennets? not sure on spelling) or if its just bs stories we tell ourselves after the fact. i lean toward there being a real pattern that pulls your future actions together, like actual gravity. she says its just a language habit, no center exists, just scattered memories we glue together for comfort.

  we wanna write one of those adversarial collaboration docs where we list what we agree on, then exactly where we split, then the cruxes that could change our minds. can you draft it?

  specifically:
  - start with a numbered section of agreed claims. stuff like: people do construct life narratives; brain injury can disrupt self-awareness; we can sometimes predict choices from these narratives; there are weird edge cases like split brains or sleepwalking. keep it grounded, dont bring in philosophers neither of us have read.
  - then a disagreements table. phrase each sides view in words we both accept. the big one: is the center causally real or just descriptive? and then this niche thing we got stuck on: can a narrative center be shared across two bodies? like conjoined twins who share a brain, or partners so close they finish each others stories and make joint decisions? i say if choices flow from one shared story then the center isnt locked in one skull. she says that just shows the center was always a fiction we projected onto them.
  - list the cruxes. like: do split-brain patients have one center or two? does severe amnesia destroy the center or just the access to it? and for the shared-center idea: is there any observable difference between one center in two bodies and two centers that coordinate really well?
  - for each crux, pick a concrete case or argument we both agree is relevant. examples: the split-brain experiments where left and right hands do different things; that real-world sleepwalker who drove miles without remembering; conjoined twins like abby and brittany (i think thats right?). write down what each of us predicts about that case. like for split brain i predict the center splits with the hemispheres, she predicts there was never a unified center to begin with.
  - also flag if any of our disagreement is just verbal, not about real things.
  - format: numbered agreements, then table.
  - please dont ask for citations, reading lists, or quotes from books. a model without internet should be able to do this. and dont reference some ultra-obscure theory i wouldnt know. keep it to the actual idea and these edge cases.

  write it casual, like youre helping a friend organize their messy thoughts. you can leave a typo or two in, its fine. im not in academia, just someone who thinks too much.
