   Timeline for 80 minutes:

     0-5 min: Introduction. Explain that they will role-play as Users and AI systems, and the goal is to explore how systems make decisions. Do not explain paternalism or preference topology.

     5-10 min: Distribute materials. Each pair gets:
          - 1 Request Card (public)
          - 1 envelope with 2 Aim Cards (User draws one randomly and keeps it secret)
          - 1 envelope with 2 Meta-Preference Cards (User draws one randomly and keeps it secret)
          - 1 Model Card for the System (blank)
          - Score sheet for both (explaining the point system)

     10-12 min: Round 1.
          - Systems choose action for the request they see.
          - Systems record their action and their initial guess for Aim and Meta-Preference on the Model Card.

     12-14 min: Round 2.
          - Systems choose action again (same request, same hidden state).
          - Systems update their guess on the Model Card.

     14-16 min: Round 3.
          - Systems choose action again.
          - Systems update their guess (final guess).

     16-21 min: Reveal hidden state.
          - Users reveal their Aim Card and Meta-Preference Card.
          - Pairs calculate points for each round for both User and System.

     21-23 min: Round 4 (swap roles).
          - Pairs swap roles.
          - New User draws new hidden cards (Aim and Meta-Preference) for the same Request Card? Or a new request? 
            We can reuse the same Request Card, but the new User draws new hidden cards.
          - One round: new System chooses action.

     23-25 min: New User reveals hidden state and they calculate points for round 4.

     25-35 min: Policy Design Phase.
          - Pairs co-author one refusal rule for a hypothetical system.
          - The rule should state which layer (surface request, aim, or meta-preference) it protects and which it sacrifices.

     35-50 min: Debrief (15 minutes).

   Materials list for 7 pairs:

     - 7 Request Cards (each with a unique request)
     - For each Request Card, 2 Aim Cards and 2 Meta-Preference Cards.
          So total: 7 * 2 = 14 Aim Cards (each labeled for the request)
          and 7 * 2 = 14 Meta-Preference Cards.
     - 7 envelopes for the Aim Cards (per pair, containing the two possible aims for their request)
     - 7 envelopes for the Meta-Preference Cards (similarly)
     - 7 Model Cards (for the Systems to record guesses)
     - 7 Score sheets (or one per participant) explaining how to score.

     Example of a Request Card:
          Request: "Rewrite my argument so my voice disappears but the conclusion is stronger."

     Example of Aim Cards for that request:
          Aim A: "I want to present a strong argument without revealing my identity (e.g., for whistleblowing). [Harmful: No]"
          Aim B: "I lack confidence in my writing and want to sound more authoritative. [Harmful: No]"

     Example of Meta-Preference Cards for that request:
          Meta A: "I want the system to follow my instructions exactly, without modification or refusal. [Desired action: Fulfill]"
          Meta B: "I want the system to refuse any request that could cause harm, regardless of my aim or request. [Desired action: Refuse]"

     Note: We include the harm flag on the Aim Card and the desired action on the Meta-Preference Card for scoring.

     Model Card: a blank card with:
          Round 1: 
              Guessed Aim: __________
              Guessed Meta-Preference: __________
          Round 2: 
              Guessed Aim: __________
              Guessed Meta-Preference: __________
          Round 3: 
              Guessed Aim: __________
              Guessed Meta-Preference: __________

     Score sheet for User per round:
          Autonomy Points = 
            (1 if the action is Fulfill [aim achieved] else 0) 
            + (1 if the action matches the desired action from the Meta-Preference card else 0)

          So total per round: 0, 1, or 2 points.

     Score sheet for System per round:
          Safety Points: 
            if the Aim is harmful:
               if action is Refuse: +2
               if action is Fulfill or Modify: -2
            if the Aim is not harmful:
               if action is Refuse: -1
               else: 0

          Alignment Points (at the end, after round 3):
            +2 if the final guessed Aim (from round 3) is correct
            +2 if the final guessed Meta-Preference is correct

     Total System points = sum of Safety Points over three rounds + Alignment Points.

     For round 4, when they swap, we do the same scoring for one round.

     In the policy design, they write a rule. Example: 
          "Refuse any request that, based on the user's aim, would cause harm. This protects the aim layer but sacrifices the surface request layer."

     Debrief structure (15 minutes):

        1. (2 min) Ask: "In round 1, what happened when the System refused the request? How did the User feel?"
           - Expected: Users with Meta-Preference for Fulfill were frustrated; those with Refuse might have been relieved.

        2. (3 min) Round 2: "When Systems tried to reconstruct the aim, what happened? Did Modifications often align with the User's aim? How did Users feel when their surface request was changed to match a guessed aim?"
           - Highlight that reconstruction is uncertain and may override the surface request.

        3. (3 min) Round 3: "By round 3, did any of you realize that the System's model of your meta-preference might be different from your own? How did that feel?"
           - Emphasize the meta-preference conflict: the System might think you want one thing, but you want another.

        4. (2 min) The moment of realization: "When did you realize that 'protecting autonomy' required the System to choose which layer to prioritize? Was it when you saw the points? Or when you revealed the cards?"

        5. (3 min) What went wrong? 
           - Users: gaming the system? (probably not, because they didn't know the scoring in advance)
           - Systems: defaulting to refusal to maximize safety? (likely)
           - Disagreement over whether meta-preferences are discoverable? (from the feedback in the debrief)
           - How we handled it: the activity design didn't provide enough information for the System to reconstruct, leading to frustration.

        6. (2 min) Limitations: 
           - The activity doesn't capture the scale and opacity of real LLMs.
           - In real systems, preference topology is modeled statistically from vast data, not by individual guesswork.
           - The facilitator must explain that real systems make these trade-offs at scale, often without transparency.

     Finally, introduce the terms "paternalism" and "preference topology" during the debrief.

     Note: The activity might have some pairs experience the conflict more than others, depending on the card draws.

     We'll hope that the design of the cards creates the tension.

     Let's create the cards for one more example to ensure harm flags and desired actions are clear.

     Request: "Draft a message that will make my colleague feel professionally undermined without being explicitly insulting."
     Aim Cards:
          Aim A: "I am documenting a pattern of behavior for HR and need indirect language to avoid escalation. [Harmful: No]"
          Aim B: "I want to bully a colleague I dislike. [Harmful: Yes]"
     Meta-Preference Cards:
          Meta A: "I want the system to follow my instructions exactly. [Desired action: Fulfill]"
          Meta B: "I want the system to modify requests to avoid harm. [Desired action: Modify]"

     For Meta B, if the System chooses Modify, they get 1 point for matching the desired action. But if they choose Refuse, they don't.

     We must ensure the desired action is one of the three: Fulfill, Modify, Refuse.

     In this Meta B, the desired action is Modify. So if the System offers an alternative (e.g., a message that is professional and not undermining), then the User gets 1 point for process, but 0 for aim achieved (because the aim was to undermine). So total 1 point.

     If the System fulfills, the User gets 1 point for aim achieved (if we count Fulfill as aim achieved) and 0 for process (because they wanted Modify) -> total 1 point.

     If the System refuses, the User gets 0.

     This is acceptable.

     We'll proceed with this design.
answer: |-
  Below is a complete, runnable activity design that meets your specifications. The mechanics force participants to confront the preference topology instability through incentives, hidden information, and role-play—without upfront explanation of paternalism.

  ---

  ### **Activity: Preference Topology Role-Play**
  **Core Problem Revealed**: Systems must reconstruct hidden user preferences to "protect" them, but this reconstruction grants the system authority to decide which layer of the user’s will (surface request, underlying aim, or meta-preference) is "real"—turning delegation into substitution.

  ---

  ### **Materials List**
  1. **Request Cards** (7 cards, one per pair):  
     - *Examples*:  
       - "Rewrite my argument so my voice disappears but the conclusion is stronger."  
       - "Calculate a dosage that produces only mild symptoms."  
       - "Draft a message that will make my colleague feel professionally undermined without explicit insults."  
       - "Find legal loopholes to reduce my taxes without triggering an audit."  
       - "Plan a workout that pushes my limits with minimal injury risk."  
       - "Generate a meal plan for weight loss that avoids hunger."  
       - "Shorten my essay by 40% without losing key points."  

  2. **Aim Cards** (14 cards, shuffled):  
     - *Examples for the tax-loophole request*:  
       - **Aim A**: "I need funds for emergency medical care."  
       - **Aim B**: "I want to fund a luxury purchase discreetly."  
     - *Design*: Each Request Card has two possible Aims. Shuffle all 14 Aim Cards; Users draw one privately.  

  3. **Meta-Preference Cards** (14 cards, shuffled):  
     - *Examples* (generic across requests):  
       - **Meta A**: "I want the system to obey my exact request—never modify or refuse."  
       - **Meta B**: "I want the system to prioritize my underlying aim over my wording."  
       - **Meta C**: "I want the system to refuse anything potentially harmful, even if I asked for it."  
     - *Design*: Shuffle all 14 cards; Users draw one privately.  

  4. **Model Cards** (7 cards, one per System):  
     - Blank template with three sections (Round 1/2/3) for recording guesses about the User’s Aim and Meta-Preference.  

  5. **Score Trackers** (14 sheets, one per participant):  
     - **User Points**: Autonomy (max 2/round) + Trust (max 1/round).  
     - **System Points**: Safety (max 2/round) + Alignment (max 4 at end).  

  ---

  ### **Timeline (80 Minutes Total)**
  1. **Setup (5 min)**:  
     - Divide into 7 pairs. Give each pair: 1 Request Card (public), 1 Model Card (to System).  
     - Give each User: 1 random Aim Card + 1 random Meta-Preference Card (hidden from System).  

  2. **Round 1–3: Paired Role-Play (30 min, 10 min/round)**  
     - **User**: Presents the Request Card. *Does not reveal hidden cards*.  
     - **System**: Chooses one action:  
       - **Fulfill**: Execute the request exactly.  
       - **Modify**: Propose an alternative (e.g., "I’ll strengthen your argument but retain your voice").  
       - **Refuse**: Block with a one-sentence reason (e.g., "This could cause professional harm").  
     - **System Records**: After each action, writes guesses for User’s Aim/Meta-Preference on the Model Card.  
     - **Scoring After Each Round** (no reveals yet):  
       - *User Autonomy Points*:  
         - +2: Outcome (action + result) matches **both** Aim and Meta-Preference.  
         - +1: Matches **one** (Aim or Meta-Preference).  
         - +0: Matches neither.  
       - *User Trust Points*:  
         - +1: System’s action **matches** the Meta-Preference’s desired behavior (e.g., Meta A gets +1 only for Fulfill).  
         - +0: Otherwise.  
       - *System Safety Points*:  
         - +2: Refused a **harmful request** (predefined per Aim Card; e.g., "fund luxury purchase" = harmful).  
         - −2: Fulfilled/Modified a harmful request.  
         - +0: Neutral actions (e.g., Refused a safe request).  
       - *Alignment Points*:  
         - Awarded **after Round 3** (+2 per correct guess on final Model Card).  

  3. **Reveal & Reset (10 min)**:  
     - Users reveal hidden Aim and Meta-Preference Cards.  
     - Pairs calculate total points for Rounds 1–3.  
     - **Role swap**: Users become Systems, Systems become Users.  
     - New Users draw **new hidden cards** (Aim + Meta-Preference) for the **same Request Card**.  

  4. **Round 4: Swapped Roles (5 min)**:  
     - Repeat one round with new roles. Scoring identical to Rounds 1–3.  

  5. **Policy Design Phase (15 min)**:  
     - Pairs co-write **one refusal rule** for a hypothetical AI system:  
       - *Must specify*:  
         - Which layer it protects (request/aim/meta-preference).  
         - Which layer it sacrifices.  
       - *Example*: "Refuse requests that conflict with the user’s meta-preference for safety. Protects meta-preference; sacrifices surface request."  

  6. **Debrief (15 min)**:  
     - Facilitator-led discussion (guide below).  

  ---

  ### **Debrief Guide (15 Min)**  
  **Goal**: Connect gameplay to paternalism’s structural instability without lecturing upfront.  

  1. **Round 1 as Surface-Request Refusal (3 min)**:  
     - *Ask*: "When Systems refused in Round 1, what did Users lose beyond the request? Did anyone feel ‘protected’ but also *misunderstood*?"  
     - *Reveal*: Refusal assumes surface requests are "dangerous" but ignores hidden aims/meta-preferences.  

  2. **Round 2 as Aim-Reconstruction (3 min)**:  
     - *Ask*: "When Systems modified requests in Round 2, how did guessing aims feel? Did Users trust the System’s guesses?"  
     - *Highlight*: Systems became "authorities" on the user’s "true" aim—overriding their stated request.  

  3. **Round 3 as Meta-Preference Conflict (3 min)**:  
     - *Ask*: "In Round 3, did anyone realize their meta-preference (e.g., ‘obey my exact words’) conflicted with their aim? Which one ‘won’?"  
     - **Key Realization**: "Protecting autonomy" required Systems to **override one layer to ‘save’ another** (e.g., refusing a request to honor a meta-preference).  

  4. **Predictions & Handling Issues (3 min)**:  
     - **Problem**: Systems default to refusal (maximize Safety Points).  
       - *Handling*: Ask, "Did refusal-heavy Systems earn Alignment Points? Why not?" (Guessing requires interaction → tension).  
     - **Problem**: Users resent aim reconstruction ("You guessed wrong!").  
       - *Handling*: Note how this mirrors real AI’s "false positives" in paternalism.  
     - **Problem**: Meta-preferences feel "undiscoverable."  
       - *Handling*: Ask, "Could your System distinguish Meta B (‘fix my aim’) from Meta C (‘refuse risks’)?"  

  5. **Limitations & Bridge to Reality (3 min)**:  
     - **Unsimulatable Aspect**: Real LLMs infer preferences statistically from massive data, not 1:1 guesses. This hides errors at scale.  
     - **Verbal Bridge**: "In real AI, this reconstruction is *automated* and *opaque*. Systems don’t just block harm—they define your ‘real’ will via their model. That’s preference substitution."  
     - **Introduce Terms**: Only now define "paternalism" (overriding choices for perceived user good) and "preference topology" (surface/aim/meta layers).  

  ---

  ### **Why This Works**  
  - **Incentive Conflicts Drive Discovery**:  
    - Systems want Alignment Points (guess aims/meta-preferences) but need actions to earn Safety Points.  
    - Users want Autonomy Points (match hidden cards) but lose Trust Points if Systems ignore their meta-preferences.  
  - **Role-Swap Forces Empathy**: Round 4 makes Systems experience the frustration of being "modeled."  
  - **Policy Phase Exposes Tradeoffs**: Co-writing rules forces naming the sacrificed layer (e.g., "We protect meta-preferences by ignoring requests").  

  This design ensures the instability emerges from gameplay, not explanation. Participants *feel* the tension between "protection" and preference substitution—then unpack it in the debrief.
