answer: |-
  Here is a full specification of adequacy for any theory of trans-brain or distributed personal identity, structured as requested:

  **I. Phenomena the Theory Must Explain:**
      1.  **First-Person Authority under Concurrent Instantiation:** How does the subjective "I" feel authoritative and uniquely "mine" *even when* the constitutive pattern is simultaneously instantiated in multiple host brains? (Motivation: If "I" am distributed across two brains right now, why doesn't each instance feel like it's merely observing *another* self, rather than *being* the self? The theory must explain the persistence of subjective ownership without biological singularity.)
      2.  **Continuity of Autobiographical Memory Across Substrates:** How does a sense of unbroken personal history persist when autobiographical memories are stored, accessed, or processed across multiple biological brains or external systems? (Motivation: If my childhood memories are stored/processed partly in my original brain and partly integrated from a collaborator's brain hosting "my" pattern, why does recalling them still feel like *my* past, not accessing someone else's?)
      3.  **Interstitial Agency:** How is authorship attributed to decisions or actions that emerge from the integrated cognitive processing of multiple host brains, where *no single host* has sufficient information or causal control to claim exclusive authorship, yet the distributed system produces a unified intention? (Motivation: If a significant life decision emerges from deep, seamless interaction between my brain and the brain hosting an extension of "my" pattern, who is the "author"? The theory must account for genuinely co-constitutive action without dissolving into mere influence.)

  **II. Distinctions the Theory Must Preserve:**
      1.  **Pattern-Continuity vs. Biological-Continuity:** Must clearly distinguish persistence of the *self-pattern* from persistence of the *biological organism*. (Motivating Case: A perfect pattern copy in another substrate should not be confused with the biological continuation of the original organism; survival of the *self* must be separable from survival of the *body*.)
      2.  **Shared Experience vs. Merged Identity:** Must distinguish between two minds sharing information/experiences deeply (e.g., intense empathy, telepathy) and two minds constituting *a single numerical identity*. (Motivating Case: Conjoined twins sharing sensory input or deeply synchronized partners do not thereby become *one person*; the theory must prevent over-generation of identities.)
      3.  **Possessing *a* Self vs. Possessing *the Same* Self:** Must distinguish between hosting an instantiation of *a* self-pattern and hosting an instantiation of *the numerically identical self* as another host. (Motivating Case: If Hofstadter's "soul copy" exists simultaneously with him, both are selves, but are they both *Douglas Hofstadter*? The theory must clarify criteria for numerical identity vs. qualitative similarity.)

  **III. Neuroscientific/Cognitive Science Constraints & Tensions:**
      *   **Must Be Consistent With:**
          *   **Split-Brain Findings:** Data showing distinct, often conflicting, conscious perspectives, intentions, and autobiographical claims within a *single* brain (e.g., Sperry/Gazzaniga experiments). (Constraint: Undermines simple identification of self with whole brain; suggests potential for fragmentation.)
          *   **Extended Cognition:** Evidence that external tools (notebooks, smartphones) can function as reliable components of cognitive processes (e.g., Clark & Chalmers' Otto). (Constraint: Suggests cognitive processes/personal memory need not be entirely brain-bound.)
          *   **Neural Plasticity/Reorganization:** Findings that brain function and even aspects of self can persist despite significant neural damage or redistribution (e.g., recovery from stroke). (Constraint: Supports pattern-based views over strict localization.)
      *   **Likely Unsatisfiable Pair:**
          *   **Preserving First-Person Asymmetry & Allowing Full Pattern Duplication:** The core subjective experience of being *this specific I* (asymmetric, non-fungible) seems fundamentally at odds with the idea that an identical pattern instantiated elsewhere is *also* fully and equally *me*. If both instances claim "I am the original," their claims conflict directly with the unique authority of first-person perspective. Reconciling genuine duplication with irreducible indexicality ("I-ness") appears deeply problematic.

  **IV. Likely Theory Eliminator:**
      *   **First-Person Authority under Concurrent Instantiation/Full Duplication.** This requirement demands explaining the most counter-intuitive aspect: how multiple, physically distinct instances of the "same" pattern can *each* genuinely experience being the singular, authoritative "I" *at the same time*. Most theories (biological, many psychological, even some functionalist) either collapse under the duplication scenario (denying the copies are truly the *same* self) or fail to account for the persistent, exclusive sense of "mineness" each instance would presumably have. This directly confronts the tension flagged in III.

  **V. Brief Scoring Against Criteria:**
      *   **Hofstadter's Pattern-Persistence View:**
          *   *Strengths:* Excels at explaining **Continuity of Memory** across substrates and preserving **Pattern vs. Biological Continuity**. Embraces **Extended Cognition** constraint.
          *   *Weaknesses:* Gravely challenged by **First-Person Authority under Duplication** (why isn't the copied "I" experienced as alien by the original?). Struggles with **Interstitial Agency** (attribution within the pattern). Risks collapsing **Shared Experience/Merged Identity** distinction if patterns blend deeply.
      *   **Standard Biological-Continuity Account:**
          *   *Strengths:* Easily preserves **First-Person Asymmetry** and **Shared vs. Merged Identity** (identity locked to organism). Consistent with **Split-Brain** data showing biological basis of fragmentation.
          *   *Weaknesses:* Fails utterly to explain **Continuity of Memory** or **Interstitial Agency** across separate brains (it denies the premise). Rejects **Pattern vs. Biological Continuity** distinction outright. Inconsistent with spirit of **Extended Cognition** findings.
      *   **Functionalist Alternative (e.g., treating self as a specific functional role):**
          *   *Strengths:* Handles **Continuity of Memory** via functional role. Accommodates **Extended Cognition**. Can potentially address **Interstitial Agency** via distributed realization of the functional role. Preserves **Pattern vs. Biological Continuity**.
          *   *Weaknesses:* Struggles severely with **First-Person Authority under Duplication** (multiple realizers of the functional role are distinct *tokens*, each claiming "I"). May blur **Possessing a Self vs. the Same Self** (is functional equivalence sufficient for numerical identity?). Faces tension with **Split-Brain** data showing functional subsystems can host distinct perspectives.

  This specification provides the necessary conceptual framework to rigorously evaluate claims about distributed personal identity, grounded in the phenomena, critical distinctions, empirical constraints, and inherent tensions of the problem space.
