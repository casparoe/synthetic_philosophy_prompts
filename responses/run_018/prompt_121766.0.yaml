  Okay, let me approach this rich query systematically. The user wants a hinge epistemology analysis of the Scopes Trial with specific conceptual tools, so I need to structure this carefully.

  First, I consider the core Wittgensteinian framing. The trial wasn't just about evolution vs creationism but about competing foundational certainties. The biblical literalists' hinges include creation in six days as non-negotiable reality, while the scientific hinges treat methodological naturalism as absolute. This explains why evidence couldn't settle the dispute - each side's "certainties" were actually functioning as perceptual frameworks.

  For the bidirectional mapping, I'll identify key players:
  - Bryan operated with vertical hinges like divine creation as ontological bedrock, and horizontal hinges about democratic authority over truth.
  - Darrow's vertical hinges included natural causation and deep time, with horizontal commitment to scientific expertise autonomy.
  - The jury likely shared Bryan's horizontal hinge about community sovereignty, making Scopes' guilt inevitable regardless of evidence.

  The cross-examination moment is crucial. Darrow pushing Bryan on Genesis literalism didn't create internal contradiction but exposed incommensurability - Bryan's hinge made "millions of years" nonsensical, while Darrow saw biblical time as irrational. 

  Now for the vertical/horizontal distinction I'm developing:
  - Vertical conflict: creation vs evolution as competing ontologies.
  - Horizontal conflict: majority rule vs expert autonomy in determining truth.
  The trial's surface was vertical but the ruling revealed horizontal dominance - the jury affirmed community's right to set educational norms regardless of scientific content.

  Where this distinction helps:
  - Explains why Scopes lost legally despite "winning" rhetorically - horizontal hinges about democratic control were operative.
  - Clarifies later institutional outcomes: as scientific authority became a new horizontal hinge in education, creationism was excluded not by evidence but by shifted epistemic authority norms.

  Limitations to note:
  - Wittgenstein doesn't address power dynamics in hinge shifts - why scientific authority eventually dominated requires sociological supplement.
  - The trial's pedagogical stakes show hinges aren't just cognitive but involve institutional control - an area needing further development.

  This approach reveals what standard narratives miss: the agony of the expert witnesses barred from testifying wasn't about withheld evidence but about denied epistemic standing - their horizontal hinge (experts define scientific truth) was rendered invalid in that framework.
answer: |-
  Here is a hinge-epistemology analysis of the Scopes Trial, incorporating your vertical/horizontal distinction and addressing each component of your query:

  ### Core Hinge Mapping: Biblical vs. Scientific Frameworks
  - **Biblical Literalist Hinges (Bryan/Jury)**  
    - *Vertical Hinges*:  
      - Divine creation *ex nihilo* (Genesis 1:1)  
      - Fixity of species (against common ancestry)  
      - Young Earth (6-day creation as literal chronology)  
    - *Horizontal Hinges*:  
      - Biblical text as ultimate epistemic authority  
      - Democratic majority's right to set educational norms  
      - Local community sovereignty over "outside" expertise  

  - **Scientific Naturalist Hinges (Darrow/Expert Witnesses)**  
    - *Vertical Hinges*:  
      - Methodological naturalism (no supernatural causation in science)  
      - Deep geological time (Earth >4.5bn years old)  
      - Evolutionary continuity across species  
    - *Horizontal Hinges*:  
      - Scientific consensus as arbiter of empirical truth  
      - Academic freedom as insulated from popular opinion  
      - Expert testimony as primary source of legitimate knowledge  

  ### Darrow's Cross-Examination of Bryan: Hinge Collision
  - **What it accomplished**:  
    Darrow exposed *incommensurability*, not internal contradiction. Bryan treated "six days" as a vertical hinge (non-negotiable reality), while Darrow treated it as a testable claim. When pressed on Jonah surviving in a whale, Bryan conceded *some* non-literal interpretation—but this didn't fracture his hinge structure. Instead, it revealed:  
    - Bryan's *horizontal* hinge: "Truth" must align with democratic values ("The people have a right to reject expert dogma").  
    - Darrow's *horizontal* hinge: "Truth" is determined by specialist methods ("Science operates beyond vote-taking").  

  - **Key exchange**:  
    > Darrow: "Do you think the earth was made in six days?"  
    > Bryan: "Not six days of twenty-four hours."  
    This wasn't a retreat but a *hinge-preserving move*—Bryan re-anchored literalism to divine temporality (vertical hinge), rejecting scientific timekeeping itself as irrelevant.  

  ### What Hinge Epistemology Reveals (Beyond Standard Narratives)
  1. **Evidence-Immunity**:  
     Neither side sought "more data." Creationists saw evolution as *category error* (violating vertical hinges), while scientists saw creationism as *methodologically illegitimate* (violating horizontal hinges). Expert witnesses barred from testifying weren't "silenced evidence" but *excluded authority*—a horizontal hinge conflict.  

  2. **Incommensurable Certainty**:  
     When Bryan declared, "It is better to trust in the Rock of Ages than to know the age of rocks," he framed geology as *existentially destabilizing*—not factually wrong but hinge-corrosive.  

  ### Vertical vs. Horizontal Hinge Conflict: The Core Tension
  - **Vertical Incommensurability**:  
    Manifest in ontological clashes (e.g., "Is 'day' a divine or geological unit?"). Yet this alone doesn't explain the trial's outcome.  

  - **Horizontal Dominance**:  
    The trial's resolution turned on *horizontal* hinges:  
    - Jury's verdict upheld the *democratic hinge*: Majority rights > scientific consensus.  
    - Judge Raulston barred experts because *community standards* (horizontal) dictated what counts as relevant knowledge.  
    - Bryan's anti-elitism framed evolution as "foreign dogma," privileging *popular sovereignty* over epistemic authority.  

  **Where the distinction succeeds**:  
  - Explains why Scopes was convicted despite Darrow's "rhetorical win." The jury applied horizontal hinges (our community, our rules).  
  - Clarifies why evolution later dominated education: Not through evidence but *institutional capture of horizontal hinges* (scientific authority embedded in curricula standards, textbook accreditation).  

  **Where it breaks down**:  
  1. **Power Blindspot**:  
     Wittgenstein doesn't explain *why* scientific horizontal hinges eventually prevailed. Hinge epistemology captures *how* frameworks clash but not *how power reshapes hinges*. The NSF-era (post-1957) cemented scientific authority via federal funding—a non-epistemic factor.  

  2. **Legal/Pedagogical Stakes**:  
     The trial's hinge conflict masked its function as *hegemonic struggle*. The Butler Act was a horizontal hinge assertion: "Democracy controls truth-production." Hinge epistemology is silent on why such conflicts manifest legally rather than philosophically.  

  3. **Limitation of the Distinction**:  
     - **Oversimplifies Bryan**: His populism fused vertical/horizontal hinges (biblical truth *is* democratic truth).  
     - **Neglects Hybridity**: Many "scientific creationists" later adopted science's horizontal hinges (peer review, institutions) while rejecting vertical ones—a dynamic the model struggles with.  

  ### Conclusion: Hinge Epistemology's Value and Gaps
  - **Illumination Achieved**:  
    Reveals the trial as *certainty collision* where "facts" were framework-contingent. Darrow and Bryan spoke across hinge chasms—one attacking vertical hinges as irrational, the other defending horizontal hinges as righteous.  

  - **Framework Limitations**:  
    - Cannot explain hinge *transition* (why science's horizontal hinges later dominated via structural power, not persuasion).  
    - Overlooks how hinge conflicts serve *non-epistemic goals* (e.g., Bryan's defense of rural identity against "Northern elites").  

  - **Your Distinction's Efficacy**:  
    The vertical/horizontal split clarifies that the trial's *enduring stakes* were horizontal: **Who controls knowledge-legitimation?** Yet it risks compartmentalizing what was lived as an integrated worldview. For hinge epistemology to handle real-world conflicts, it must engage sociology of power—how institutions materialize certain hinges while excluding others.  

  > **Recommendation for Seminar**: Contrast this case with a *resolved* hinge conflict (e.g., heliocentrism) to probe why some hinge shifts succeed and others stalemate. Highlight how horizontal hinges (e.g., Vatican's authority to "reinterpret" scripture) enabled the latter.
