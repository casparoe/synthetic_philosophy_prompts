prompt: |-
  Analyze the Thermidorian Reaction of July 1794 — the arrest and execution of Robespierre, Saint-Just, and Couthon, and the rapid dismantling of the Committee of Public Safety — through the lens of the claim that revolutions devour their own children, but do so with explicit attention to contingency and institutional design rather than to inevitable historical destiny. First, map the decision space on 8–10 Thermidor: identify the relevant actors (the remaining Jacobin deputies, the Thermidorian coalition, the Paris sections, and the Committee itself), the institutional constraints created by the merged executive-legislative structure and the Law of 22 Prairial, and the options actually available to each party. Then apply the theory: does Robespierre's fall look like a revolution consuming its architects because their ideological commitment to "virtue" and transparency made any opposition indistinguishable from corruption and therefore intolerable? Or does it look like an ordinary parliamentary coup made possible by contingent factors — the news of victory at Fleurus, Robespierre's refusal to name targets in his 8 Thermidor speech, and the precise coalition that assembled? Next, turn the episode back on the theory: what does Thermidor reveal about the limits of structural interpretations (whether class-struggle, ideological, or institutional) of 1789–94, and where exactly is the "devouring" narrative silent? Be disciplined about the mapping: do not force the theory to speak where the institutional details or the contingent sequence do the explanatory work. End with a one-sentence summary of whether this case confirms, complicates, or undermines the claim that revolutions necessarily eat their children.
reasoning: |-
  Okay, the user wants me to analyze the Thermidorian Reaction through a specific lens. They're asking me to examine whether Robespierre's fall was an inevitable result of revolutions "devouring their own children" or if it was more about contingency and institutional design. 

  First I need to map out the decision space around 8-10 Thermidor (late July 1794). The key players were: the remaining Jacobin deputies loyal to Robespierre, the Thermidorian coalition (which included former radicals like Tallien and Fouché, conservatives, and deputies afraid of being purged), the Paris sections (some radical, some turning conservative), and the Committee of Public Safety itself which was fractured.

  The institutional constraints are crucial here. The merged executive-legislative structure meant the Committee had immense power but was still technically accountable to the Convention. The Law of 22 Prairial had recently streamlined trials but also made accusations incredibly dangerous - it essentially weaponized the justice system.

  Looking at options: Robespierre could have named conspirators in his speech but didn't, which was a tactical error. The Thermidorians had to act fast before being purged. The Committee was divided - some members like Carnot and Billaud-Varenne were already against Robespierre. The Paris sections were wavering in their support.

  Now applying the theory: The "devouring" narrative suggests Robespierre's rigid ideology made compromise impossible. But the contingent factors seem more compelling - the victory at Fleurus reduced the need for terror, Robespierre's vague speech gave opponents an opening, and the precise makeup of the coalition (radicals fearing purge + conservatives wanting moderation) was situational.

  This case actually reveals the limits of structural interpretations. Class struggle doesn't fully explain why former radicals turned on Robespierre. Institutional design explains how the coup was possible (Convention voting system, Committee's weakened state) but not why it happened then. The "devouring" narrative ignores how close-run this was - if Robespierre had named names or if the sections had mobilized, history might be different.

  My one-sentence conclusion will be that Thermidor complicates the "devouring" thesis by showing how much depended on specific choices and circumstances rather than revolutionary inevitability.
answer: |-
  The Thermidorian Reaction exemplifies the contingent interplay of institutional design and specific choices within a revolutionary crisis, complicating the deterministic "devouring" thesis.

  **Decision Space Mapping (8-10 Thermidor Year II / 26-28 July 1794):**

  1.  **Actors:**
      *   **Robespierre, Saint-Just, Couthon:** Incumbents wielding immense symbolic and (dwindling) institutional power via the CPS. Deeply committed to revolutionary "virtue," perceiving opposition as counter-revolutionary corruption.
      *   **The Committee of Public Safety (CPS):** Fractured. Robespierre's faction (Le Bas, younger Saint-Just) vs. "Technocrats" (Carnot, Lindet, Prieur de la Côte-d'Or) focused on war/administration vs. "Security" faction (Billaud-Varenne, Collot d'Herbois) fearing Robespierre's moralizing purge. Institutional power concentrated but internally divided.
      *   **The Thermidorian Coalition:** Loosely aligned deputies driven by diverse motives:
          *   *Targeted Radicals:* Tallien, Fouché, Fréron (fearing imminent arrest due to corruption/atrocities).
          *   *Aligned CPS Members:* Billaud-Varenne, Collot d'Herbois (resenting Robespierre's dominance, fearing purge).
          *   *Plaine Deputies:* The "Marsh," increasingly alienated by Terror, seeking safety and restoration of Convention primacy.
          *   *Moderates/Conservatives:* Seizing an opportunity to end the Terror.
      *   **The Convention:** Sovereign body, but ceded vast power to CPS. Fearful of the CPS and Robespierre, but also its own vulnerability. Its voting procedures and physical layout were crucial stages.
      *   **Paris Sections & Commune:** Historically radical base. Support wavering due to war success, economic hardship, and Terror fatigue. The Commune (under Coffinhal, Payan) remained loyalist, but mobilization capacity was uncertain.

  2.  **Institutional Constraints:**
      *   **Merged Executive-Legislative Structure (CPS & Convention):** Created ambiguity. The CPS held de facto executive power, but sovereignty technically resided in the Convention. This meant the Convention could *legally* overthrow the CPS leadership, but doing so required overcoming the CPS's control over security and its revolutionary legitimacy.
      *   **Law of 22 Prairial (10 June 1794):** Crucially constrained options by:
          *   Removing defense counsel and pre-trial interrogation for accused.
          *   Defining crimes vaguely (e.g., "impairing the purity" of the Revolution).
          *   Limiting evidence to moral conviction.
          *   Mandating only acquittal or death.
          *   *Effect:* Made *any* accusation potentially lethal. Robespierre's vague warnings on 8 Thermidor weren't just rhetoric; under Prairial, they were implicit death sentences, paralyzing the Convention with fear and making preemptive action against him a perceived necessity for survival.

  3.  **Options Available:**
      *   **Robespierre Faction:**
          *   Name specific conspirators on 8 Thermidor, triggering immediate arrests (high risk, could fracture CPS/Convention further).
          *   Remain vague, relying on moral authority and CPS power to intimidate (chosen path).
          *   Mobilize the Commune/sections preemptively (risked insurrection, alienating Convention).
      *   **Thermidorian Coalition:**
          *   Preemptively accuse Robespierre & allies of tyranny before Convention (chosen path).
          *   Wait, risking arrest under Prairial Law.
          *   Attempt internal CPS coup (difficult given Robespierre's faction).
      *   **CPS (Non-Robespierre factions):** Align with Convention against Robespierre (Billaud/Collot chose this) or remain passive/neutral (Technocrats largely did until forced).
      *   **Convention (Plaine):** Support Robespierre (risking association with Terror), support Thermidorians (risking chaos if failed), or remain passive (chose this initially, then swung to Thermidorians).
      *   **Paris Commune/Sections:** Obey Convention orders, mobilize for Robespierre (attempted, but delayed and outmaneuvered), or remain passive.

  **Applying the Theory: Contingency vs. Ideological Devouring**

  *   **"Devouring" Lens (Ideological Commitment):** Robespierre's rigid ideology *did* create the conditions. His conflation of opposition with corruption, amplified by the Prairial Law, made compromise impossible. His refusal to name targets on 8 Thermidor stemmed from this worldview – the "impure" were obvious, naming them was almost beneath him, and the system (Prairial) would handle it. This refusal, however, was a critical *contingent choice*, not an inevitable step. It provided the opening.
  *   **Contingency Lens (Parliamentary Coup):** The fall looks fundamentally contingent:
      *   **Fleurus (26 June):** Military victory undermined the primary justification for the Terror (national emergency), reducing popular/Jacobin section support and emboldening opponents.
      *   **Robespierre's 8 Thermidor Speech:** His vague threats, *without naming names*, united disparate factions in the Convention (the fearful, the resentful, the ambitious, the genuinely moderate) against a common, immediate threat. Had he named Tallien/Fouché/etc., he might have shattered the nascent coalition or triggered a different crisis.
      *   **Coalition Assembly:** The *specific* alliance of terrified radicals (Tallien), resentful CPS hardliners (Billaud/Collot), and the Plaine was contingent. Billaud/Collot's decision to denounce Robespierre *from within the CPS* on 9 Thermidor was pivotal and unpredictable weeks earlier.
      *   **Procedural Contingency:** Saint-Just being shouted down, the successful vote to arrest Hanriot (Commune commander), the Convention's declaration of outlawry (denying trial) – these were specific moments where rhetoric, procedure, and the physical dynamics in the chamber mattered immensely.
      *   **Commune's Failure:** The loyalist Commune's slow, disorganized response was a key contingent failure, not an ideological inevitability.

  **Turning Back on Theory: Limits of Structure and Silence of the "Devouring" Narrative**

  *   **Limits of Structural Interpretations:**
      *   **Class Struggle:** Fails to explain why *radicals* (ex-Hébertists, CPS hardliners) turned on Robespierre, or why the Parisian *sans-culottes* didn't rise en masse. Motives were survival, personal rivalry, power, and fatigue, not class interest per se.
      *   **Ideological:** While ideology shaped Robespierre's actions, it doesn't explain the *timing* or *success* of the coup. The Thermidorians weren't motivated by a *different* coherent ideology initially, but by fear and opportunity.
      *   **Institutional:** The merged structure and Prairial Law created the *arena* and *stakes* (making politics zero-sum), but didn't *determine* the outcome. They made the coup *possible* and *necessary* for the plotters' survival, but the *success* depended on contingent choices (Robespierre's vagueness, Billaud/Collot's defection, Commune's failure).
  *   **Silence of the "Devouring" Narrative:**
      *   Ignores **agency and choice**: Robespierre chose not to name names. Billaud/Collot chose to attack him publicly. Tallien chose to lead the charge.
      *   Ignores **specific contingent triggers**: Fleurus fundamentally changed the context. The precise sequence of speeches and votes on 9 Thermidor was chaotic and decisive.
      *   Ignores the **role of fear under specific law (Prairial)**: The coup wasn't just ideological purification; it was a panicked survival move by deputies operating under a law that made accusation equivalent to a death sentence.
      *   Overlooks the **fragility of the outcome**: The Commune *nearly* succeeded in freeing the prisoners. Had Robespierre been more decisive or the Commune faster, the "devouring" might have continued differently.

  **Conclusion:**

  **The case of Thermidor complicates the claim that revolutions necessarily devour their children by demonstrating that while the revolutionary structure (ideological absolutism merged with institutional terror) creates fertile ground for such outcomes, the specific consumption of Robespierre was contingent upon a precise sequence of avoidable choices, external events (Fleurus), and the opportunistic assembly of a fragile coalition united primarily by immediate fear under the Law of 22 Prairial.**
