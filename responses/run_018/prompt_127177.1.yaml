prompt: |-
  I'm enrolled in a seminar on intergenerational justice, and during our discussion of long-run climate mitigation a fellow student keeps invoking the line "future people don't exist yet, so there's nothing to discount" whenever someone argues that present carbon budgets ought to be shaped by the welfare of people in the 23rd century. He treats it as a knock-down objection that distinguishes climate obligations from obligations to present strangers: we may owe distant descendants a generic duty not to render the world uninhabitable, he says, but nothing owed specifically to them as particular beneficiaries. I want to bring a precise disambiguation to the next session rather than just disagreeing.

  Could you unpack the slogan as a menu of distinct philosophical claims? In particular, distinguish: (i) metaphysical readings about whether non-existent beings can be subjects of harm, including presentist versus eternalist ontologies of future persons and whether temporal parts have moral standing before they are actualized; (ii) normative readings about whether moral consideration requires actual existence, possible existence, or some intermediate modal status, and whether harming requires a victim who already is; (iii) axiological and economic readings that separate pure time preference—weighting welfare less merely because it occurs later—from risk-adjusted or extinction-risk discounting; and (iv) the practical inference from any of these premises to his specific conclusion that long-run mitigation is not owed to particular distant individuals. For each variant, say whether it is a platitude, a defensible substantive thesis, or false; and then indicate which readings actually license his dismissal of climate obligations, which leave the debate untouched, and which might even strengthen the case for present action on behalf of the far future.
reasoning: |-
  Okay, let's start by unpacking the user's query. They're in a seminar on intergenerational justice, and a fellow student uses the argument that "future people don't exist yet, so there's nothing to discount" to dismiss the idea that present carbon budgets should consider people in the 23rd century. The user wants to disambiguate this slogan into different philosophical claims to counter this argument effectively.

  First, I need to break down the slogan into the categories the user mentioned: metaphysical, normative, axiological/economic, and practical inference. Each category needs analysis to see if it supports the student's dismissal of climate obligations.

  Starting with metaphysics. The student's argument hinges on presentism—only existing entities have moral standing. But eternalism, where future individuals are real, could counter that. Also, the non-identity problem complicates harm claims. The user might need to show that metaphysical debates don't settle the issue, and obligations could arise from creating future conditions rather than harming specific individuals.

  Next, normative aspects. The student might claim moral consideration requires existence. But potentialism or capacity-based theories extend consideration to possible beings. Theories like utilitarianism assess actions based on outcomes affecting whoever exists. The user could argue that obligations don't require specific beneficiaries but general duties to ensure livable conditions.

  Axiological and economic factors are crucial. The student might conflate pure time preference with other discounting types. Pure time preference is ethically questionable, while discounting for uncertainty or extinction risk might be valid. Highlighting this distinction can show that not discounting future welfare doesn't ignore risks but avoids arbitrary devaluation.

  Practical inference ties it all together. The student's conclusion might rely on conflating different premises. Clarifying that most premises don't support his dismissal could strengthen the case for action. Emphasizing the distinction between harming individuals and failing to benefit them, or duties to the future collective, might counter his argument.

  The user's deeper need is to effectively counter the slogan in a seminar setting with precise arguments. They want to move beyond mere disagreement by providing structured, philosophical disambiguation. They might also seek to advocate for strong climate action by showing that the slogan doesn't undermine obligations to the far future.

  I should ensure each category is addressed clearly, noting which readings are defensible, false, or platitudes. Highlighting where the student's argument fails and where alternative views support climate obligations is key. Emphasizing the non-identity problem and collective duties could provide strong counterpoints. Also, clarifying discounting types prevents misuse of economic arguments.
answer: |-
  Here's a disambiguation of "future people don't exist yet, so there's nothing to discount" across your requested categories, assessing each claim and its implications for climate obligations:

  ### I. Metaphysical Readings (Can Non-Existent Beings Be Harmed?)
  *   **(i1) Presentism + Harm Requires Actual Victims:** Only presently existing entities are real. Harm requires a *currently existing* subject whose state is worsened. Future individuals, being non-existent, cannot be subjects of harm *now*.  
      *Status:* **Defensible Substantive Thesis** (though controversial).  
      *Impact:* **Appears to license dismissal** of "harm to specific future persons" claims. Creates the *Non-Identity Problem* (NIP): Different present choices create different future populations, making it hard to say a specific future person is *worse off* than they *would have been* (since without the action, they likely wouldn't exist).
  *   **(i2) Eternalism + Moral Standing of Temporal Parts:** Future individuals (or their temporal stages) are real parts of the spacetime manifold. Their future suffering gives *current* moral reasons to prevent it.  
      *Status:* **Defensible Substantive Thesis.**  
      *Impact:* **Strengthens case for action.** If future suffering is "out there," discounting it merely for temporal location is harder to justify. Obligation is to specific future persons.
  *   **(i3) Non-Reductionism/Modal Realism about Persons:** Persons are trans-temporal entities whose identity isn't solely tied to a specific sperm/egg. Future persons *qua* types or roles (e.g., "human inhabitants of Earth in 2300") can be objects of concern even before conception.  
      *Status:* **Defensible but less common.**  
      *Impact:* **Leaves debate open/Strengthens case.** Mitigates NIP; we can have duties *to* the future inhabitants *of the world we create*, even if their specific identities are unknown.

  ### II. Normative Readings (Does Moral Consideration Require Existence?)
  *   **(ii1) Actualism:** Moral consideration requires *actual* existence. Only currently existing beings have moral status.  
      *Status:* **False/Highly Implausible.** (Implies we can dump toxins in aquifers today if effects take 50 years). Rejected by nearly all intergenerational ethics.
  *   **(ii2) Possibilism:** Moral consideration extends to *possible* future beings who *will* exist based on current trajectories or *could* exist based on our choices.  
      *Status:* **Platitude/Defensible Core of Intergenerational Ethics.**  
      *Impact:* **Essential for climate obligations.** We owe duties to the future people who *will* exist (barring catastrophe) *because of* our actions shaping their world. NIP complicates, but doesn't destroy, this.
  *   **(ii3) Capacity-Based:** Moral consideration depends on the *capacity* for welfare/suffering (e.g., sentience). Future beings possess this capacity *in virtue of the kind of beings they will be*.  
      *Status:* **Defensible Substantive Thesis (common in utilitarianism/prioritarianism).**  
      *Impact:* **Strengthens case for action.** Focuses on preventing future suffering/promoting welfare, regardless of specific identity. Obligation is to the *bearers of future welfare*, whoever they are.
  *   **(ii4) Harm Requires Pre-Existing Victim:** An act harms someone only if it makes them worse off than they were *before* the act. Future people have no prior state to worsen.  
      *Status:* **Defensible but Controversial.** (Leads to "Parfit's Conclusion" that creating a miserable life isn't "harming" that person, just making them worse off than *possible alternatives*).  
      *Impact:* **Appears to license dismissal** of "harming future persons" claims due to NIP. *But:* Opens door for **wronging** them (violating rights/legitimate expectations) or **failing to benefit** them appropriately, even if not strictly harming a pre-existing victim.

  ### III. Axiological & Economic Readings (What "Discounting" Means)
  *   **(iii1) Pure Time Preference (PTP):** Future welfare is intrinsically less valuable *merely because it occurs later in time.*  
      *Status:* **Ethically Indefensible Platitude in Economics, Debated in Philosophy.** Widely rejected as basis for intergenerational policy (Stern, Ramsey, IPCC ethics). Equivalent to saying "their suffering matters less because it's later."  
      *Impact:* **If used to discount, license dismissal.** But its indefensibility **strengthens the case for action** by removing a major argument *against* valuing the far future.
  *   **(iii2) Opportunity Cost/Risk-Adjusted Discounting:** Future costs/benefits are discounted because resources invested today can grow (opportunity cost), and because there's uncertainty (risk) about future impacts, technology, or even whether beneficiaries will exist (extinction risk).  
      *Status:* **Defensible Substantive Thesis (Economically Standard).**  
      *Impact:* **Does NOT license dismissal of obligations.** It's a *pragmatic adjustment for uncertainty and investment*, not a denial of the *existence* or *fundamental value* of future welfare. High extinction risk might *increase* near-term mitigation urgency.
  *   **(iii3) "Nothing to Discount" = PTP Only:** Interprets "nothing to discount" as *only* rejecting PTP.  
      *Status:* **Platitude (Ethically Defensible).**  
      *Impact:* **Leaves debate untouched/Strengthens case.** Affirms future welfare matters intrinsically as much as present welfare. Focus shifts to magnitude, probability, and cost-effectiveness of impacts.

  ### IV. Practical Inference: From Premises to Conclusion
  *   **His Conclusion:** Present carbon budgets need *not* be shaped by welfare of 23rd-century people *as specific beneficiaries*. Only a generic duty to avoid uninhabitability applies.
  *   **Licenses Dismissal Only If:**
      1.  **Strict Actualism (ii1)** is true (rejected).
      2.  **Harm Requires Pre-Existing Victim (ii4)** *and* **Presentism (i1)** are true *and* we focus *only* on "harm" narrowly defined. This creates NIP paralysis. *However*, it **fails to license dismissal** if:
          *   We have duties based on **wronging** (e.g., violating rights to a livable planet) or **failing to benefit** future generations appropriately.
          *   We accept **Possibilism (ii2)** or **Capacity-Based (ii3)** consideration.
          *   We have duties **to humanity/collective/civilization** across time, or duties **regarding the kind of world we leave**, independent of specific inhabitants.
          *   **Risk-Adjusted Discounting (iii2)** justifies *some* discounting but **still requires massive valuation of the far future** due to potentially catastrophic, irreversible impacts. Discounting ≠ Ignoring.
  *   **Strengthens Case for Action If:**
      1.  **Eternalism (i2)** or **Modal Realism (i3)** holds.
      2.  **Possibilism (ii2)** or **Capacity-Based (ii3)** holds (as they do).
      3.  **PTP (iii1)** is rejected as illegitimate **(iii3)**.
      4.  **Extinction Risk (iii2)** makes preserving civilization *more* urgent.
      5.  The focus shifts from *harming specific persons* to **preventing catastrophic suffering**, **fulfilling custodial duties**, or **avoiding irreversible damage** to the planet's capacity to support life.

  ### Key Takeaways for Your Seminar
  1.  **His Slogan is Ambiguous:** It conflates metaphysical non-existence (which is true but normatively irrelevant) with the indefensible claim that future welfare has no moral weight (PTP).
  2.  **NIP is a Challenge, Not a Knock-Down:** While NIP makes "harming specific future persons" difficult, most ethical frameworks find robust grounds for strong obligations to the future based on welfare, rights, duties of justice, or collective responsibility that bypass the need for specific victims. "Generic duty not to render uninhabitable" is an *understatement* of obligations; we owe them a *decent* or *just* world, not just a barely habitable one.
  3.  **Discounting ≠ Dismissal:** Rejecting PTP is ethically mandatory. Risk/opportunity cost discounting is technical and doesn't negate obligations; it quantifies uncertainty and trade-offs. High climate risks often *increase* the present value of mitigation.
  4.  **Obligations Don't Require Specific Beneficiaries:** Duties can be to the *future community*, to uphold principles of intergenerational justice, or to avoid creating a world of suffering, regardless of the specific identities of the sufferers. His distinction between "generic duty" and "duty to specific beneficiaries" is largely artificial in the climate context. The duty *is* specific to those who will live in the future world we create.
  5.  **Action Implication:** **No plausible reading of the slogan actually licenses dismissing 23rd-century welfare.** The strongest readings (rejecting PTP, accepting possibilism/capacity) demand it be central. Weaker readings (NIP) merely shift the *basis* of the obligation (from "harming individuals" to "wronging humanity," "failing in custodianship," or "creating avoidable suffering").

  **Bring to your seminar:** Frame the disambiguation. Challenge your peer to specify *which* reading he endorses. Argue that while metaphysics creates puzzles (NIP), normative ethics overwhelmingly supports strong obligations to the far future, and rejecting PTP is essential, not a reason for inaction. The slogan confuses description (future people don't exist *now*) with a highly contested normative claim (their welfare doesn't matter *now*). The former is true but irrelevant; the latter is false and dangerous.
