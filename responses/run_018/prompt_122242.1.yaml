  ### **Explanatory Notes (Second Page)**  
  1. **Key to Leaves**  
     - **Hard Szaszian**: Only cases with *demonstrable lesions* (e.g., Case 1, Case 2) are diseases. All else (e.g., grief, unemployment responses) are "problems in living."  
     - **Harmful-Dysfunction Naturalist**: Dysfunction (a mechanism failing its evolutionary/typical purpose) defines illness, even without lesions (e.g., longshoremen’s adaptability failure).  
     - **Eliminativist**: All mental disorders will eventually be explained by neurology; current absence of lesions is temporary.  
     - **Labelling/Deviance**: Illness is a societal label for deviance (e.g., anorexia as "nonconformity," online syndrome as "social contagion").  
     - **Meaningful Suffering**: Suffering is intelligible in context (e.g., grief, anorexia) and thus not a medical illness.  
     - **Meaningful-but-Still-Illness**: Suffering is intelligible but still a disease (e.g., "grief disorder," severe anorexia).  
     - **Useful Fiction**: Not a real disease, but the category is pragmatically useful (e.g., online syndrome for accessing resources).  
     - **Pluralist**: Answers vary case-by-case; no unified theory.  

  2. **Coercion Test Integration**  
     - The coercion test (Node 7) separates **ethical** (coercion justifiable?) from **metaphysical** (is it a disease?) views.  
     - E.g., a Szaszian (Node 8) might support force-feeding anorexia (Node 7: Yes) if they reject its "intelligibility" (Node 6: No) but still see it as dangerous.  
     - Conversely, a harmful-dysfunction naturalist (Node 4/5) might oppose coercion (Node 7: No) if they prioritize autonomy.  
     - *Added Node 8* resolves the Szaszian vs. meaningful-suffering split cleanly.  

  3. **Uninhabited Logical Spaces**  
     - **"No lesion, no dysfunction, no distress, no disvalue, but still a disease"**: *Incoherent*. If nothing is broken, distressing, or harmful, calling it "disease" is linguistically absurd.  
     - **"Lesion found, so punish harder"** (e.g., Case 7): *Unattractive*. Legally/contentiously equating neurobiology with culpability contradicts medical ethics; no mainstream position holds this.  

  4. **Indistinguishable Leaves**  
     - **Harmful-Dysfunction vs. Meaningful-but-Still-Illness** sometimes overlap (e.g., anorexia). The tree separates them via coercion (Node 7) and exit tests (Node 5).  
     - **Useful Fiction vs. Labelling/Deviance** are split by the exit test (Node 4): if symptoms dissolve with social change, it’s "useful fiction"; if not, it’s "deviance."  

  5. **Why These Cases/Tests?**  
     - Added **Case 2 (Syphilis)**: Not directly used, but implied in lesion-based nodes (e.g., Node 1/2). Reinforces that some "madness" has clear medical causes.  
     - Dropped **Case 5 (Teenagers)**: ADHD-like cases are polarizing but don’t add unique logical value; design/exit tests cover adaptability.  
     - **Exit test** on Case 6 (online syndrome) and Case 3 (grief) captures situational vs. intrinsic causes.  
     - **Autopsy test** on Case 7 (violent assaulter) forces the lesion question where evidence is equivocal.  

