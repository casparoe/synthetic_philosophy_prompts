  ### **How It Works in Your Group**  
  - **Szasz Fanboy**: Likely hits Node 1 (No) → Node 6 (Yes for anorexia) → Node 8 (Yes) → **Hard Szaszian**. If they support force-feeding, they’ll land there even faster.  
  - **Med Students**: Forced to engage with cases, not theories. E.g., arguing whether grief (Case 3) has a "lesion" or is "intelligible" reveals their implicit assumptions.  
  - **Psych Residents**: Coercion test (Node 7) forces them to confront clinical ethics vs. metaphysics.  
  - **Pluralist Leaf**: Catches those who reject binary choices (e.g., "Longshoremen are dysfunctional? Well, yes and no...").  

