answer: |-
  Dr. Venn steeples his fingers, eyes sharp behind his spectacles.  
  "Your distinction is admirably precise, but your conclusion mistakes the nature of institutional authority. When a legislature passes a constitutional amendment, it binds future sessions not because those future legislators share psychological continuity with the past body—they demonstrably do not—but because the *office* persists beyond its temporary occupants. The dementia patient is not merely a biological entity; they exist within a legally and morally constituted institution of personhood. Your advance directive is that patient’s constitutional moment—an exercise of normative authorship that establishes enduring constraints upon the *institutional self* that continues to operate under their name and social identity. To treat it as 'mere historical data' is to deny that the institutional role—the 'office of the person'—has any continuity beyond momentary cognition, reducing guardianship to ad hoc rule by the cognitively present. That way lies ethical arbitrariness. The directive persists precisely because the author, as office-holder, constituted a framework that survives their incapacitation—much as a prior legislature binds its successors by the authority of the institution, not the persistence of individual lawmakers."
