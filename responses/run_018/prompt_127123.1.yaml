answer: |-
  Here's the complete package, designed for sharp grad students and tired professors alike. Keep that newsletter vibe alive.  

  **Exam Prompt: "The Green-Transition Lock-In Paradox & Institutional Money Pumps"**  
  (Total: 20 Marks)  

  *Imagine a government credibly pre-commits to a steeply rising carbon price path (e.g., +$10/tonne/year) to drive fossil fuel phase-out and green investment. Five years in, a stunningly cheap Direct Air Capture (DAC) technology emerges, potentially offering net-negative emissions far faster/cheaper than anticipated. Major industry groups, facing the escalating tax burden, demand immediate revision of the pre-set price path downward, arguing the original justification (forcing rapid transition) is now obsolete. The government faces conflicting pressures: (1) Lower taxes *now* to avoid "stranding" investments based on the new DAC reality; (2) Maintain policy *credibility* by sticking to the pre-announced path; (3) Avoid pouring good money after bad by rigidly adhering to sunk costs (the political capital spent establishing the path). This leads to perceived cyclic preferences: Lower Taxes > Credibility > Avoid Sunk Costs > Lower Taxes... and repeat with each new pressure point. Industry groups strategically exploit this cycle to lobby for concessions at different points.*

  1.  **Explain** why this dynamic represents a structural failure of *diachronic consistency* for the institution (the government), not merely political hypocrisy. (7 marks)
  2.  **Compare and contrast** this "Green Lock-In Pump" with the classic Strotz-style hyperbolic discounting money pump applied to an *individual*. Focus on the *mechanism* of exploitation and the nature of the "currency" pumped. (6 marks)
  3.  **Evaluate** whether establishing an independent Carbon Price Board (CPB) with a fixed mandate (e.g., "achieve net-zero by 2050, cost-effectively") constitutes a robust *pre-commitment device* against this pump. Does it solve the problem, or merely shift the locus of the pump? Justify your answer. (7 marks)

  ---

  **Model Answer (~600 words):**

  This scenario outlines a profound *structural* failure of diachronic consistency for the government institution, not mere hypocrisy. Hypocrisy implies a mismatch between stated values and actions. Here, the problem arises from the *inherent conflict* between different rationales applicable at different institutional decision-points, *given the pre-commitment and the unforeseen shock*. At T0 (commitment), locking in a rising price path is rational to overcome market uncertainty and coordination problems, signalling long-term investment safety. At T1 (post-DAC shock), the *local* rationality changes dramatically: the original "forcing" function seems inefficient (even counterproductive if DAC offers cheaper abatement), making *lower taxes now* appear welfare-improving. Simultaneously, abandoning the path risks *credibility loss*, harming future policy effectiveness. Yet, rigid adherence *solely* to avoid admitting sunk costs is also irrational. Each rationale (Cost-Effectiveness Now, Long-Term Credibility, Avoiding Sunk-Cost Fallacy) is arguably valid *when viewed in isolation at a specific moment*, but they conflict when forced into sequence by the pre-commitment and the shock. Industry groups exploit this *institutional temporal inconsistency* by selectively amplifying whichever rationale pressures the government to reverse its *previous* position at each stage – demanding tax cuts (leveraging cost-effectiveness), then later attacking credibility if it caves, then decrying sunk costs if it holds firm. The pump works because the institution lacks a *stable, time-consistent preference ordering* across these distinct temporal perspectives under pressure.

  Contrast this with the classic Strotz pump targeting *individuals*. Both exploit dynamic inconsistency leading to cyclic choices and wealth extraction. However, the mechanisms differ critically:
  *   **Strotz Pump (Individual):** Exploits *intrapersonal* conflict due to *changing discount rates* over time. The "pumper" offers sequences of trades exploiting the individual's shifting impatience (e.g., paying to delay a chore, then paying to undo that delay). The currency is literal money or utility, pumped via repeated trades exploiting time-inconsistent valuations.
  *   **Green Lock-In Pump (Institution):** Exploits *inter-temporal conflict between distinct institutional rationales* (efficiency, credibility, procedural rationality) triggered by unforeseen events *and* strategic actors. The "currency" pumped includes *political capital, policy credibility, and economic rents* (e.g., tax breaks). Industry groups ("pumpers") don't offer direct trades but apply lobbying pressure *cyclically*, forcing the institution to expend resources (credibility, money, political capital) reversing positions based on whichever rationale is momentarily dominant. It operates on institutional "preferences" shaped by competing normative and practical demands across time.

  Establishing an independent Carbon Price Board (CPB) is a rational pre-commitment device *in principle*, aiming to shield policy from short-term political pressure. However, it likely **shifts the locus of the pump rather than eliminating it**:
  1.  **The Pump Moves Upstream:** Industry groups now target the *CPB's mandate, composition, or funding* instead of direct legislation. Lobbying shifts to arguments about "interpreting" cost-effectiveness in light of DAC ("The Board *must* lower prices now!") or accusations of the Board itself committing sunk-cost fallacies ("They're ignoring DAC due to institutional inertia!"). The cycle (Revise Mandate > Protect Board Independence > Avoid Board's Sunk Costs > Revise Mandate) replaces the original government cycle.
  2.  **Credibility Redefined, Not Eliminated:** The Board's *own* credibility becomes the new vulnerability. If it adjusts the price path significantly due to DAC, its original "commitment" (the path) is devalued, potentially harming its perceived independence and future signalling power. If it refuses *any* adjustment, it risks appearing dogmatic and inefficient, also damaging credibility. Its decisions become the new focal point for cyclical pressure.
  3.  **Sunk Costs Reappear:** The political capital invested in *creating* the Board and defending its independence becomes a new sunk cost. Pressure to reform or weaken the Board to "correct" its path can exploit the government's reluctance to admit this sunk cost, paralleling the original sunk-cost dilemma regarding the price path itself. The structural inconsistency migrates to the meta-institutional level.

  The CPB *mitigates* the *direct* vulnerability of elected officials to short-term lobbying cycles. However, it cannot resolve the fundamental tension between pre-commitment and radical unforeseen technological change. The diachronic inconsistency persists; the money pump adapts, finding new pressure points within or around the new institutional structure. The core challenge remains designing institutions robust to *both* time-inconsistency *and* strategic exploitation of unforeseen change.

  ---

  **Marking Scheme (Out of 20):**

  *   **A (18-20):** Outstanding. Seamlessly integrates all elements. **Crucially:**
      *   Clearly identifies *institutional* diachronic inconsistency as distinct from individual weakness/hypocrisy (Move A1).
      *   Explicitly contrasts the *mechanism* (shifting rationales vs. shifting discount rates) and *currency* (credibility/political capital vs. money/utility) between the Green Pump and Strotz (Move A2).
      *   Argues convincingly that the CPB *shifts* the pump (Move A3), detailing *how* (targeting mandate/credibility/reform) and *why* (the core inconsistency persists at a higher level). Avoids simply saying "lobbying moves."
      *   Synthesis shows deep understanding of institutional decision-making under uncertainty and strategic pressure.
  *   **B (15-17):** Very Good. Covers all parts well but lacks the precise "moves" for an A.
      *   Explains structural failure vs. hypocrisy adequately but less incisively than A.
      *   Compares Green Pump/Strotz but may focus more on similarities or less precisely on mechanism/currency.
      *   Recognizes CPB limitations but may not explicitly frame it as *shifting* the pump locus or detail *how* the pump adapts (e.g., just says "lobbying still happens" or "credibility is still an issue" without the cyclical institutional vulnerability).
      *   Good understanding but less nuanced synthesis than A.
  *   **C (12-14):** Competent. Addresses the prompt broadly but superficially or with minor errors/missing elements.
      *   Describes the problem but conflates structural failure with simple political weakness/hypocrisy.
      *   Mentions Strotz but provides a generic summary comparison, missing the specific mechanistic/currency contrast.
      *   Evaluates CPB simplistically (e.g., "it solves it" or "it doesn't work at all") without the shifting locus argument.
  *   **D (9-11):** Marginal. Significant gaps, errors, or misunderstanding.
      *   Struggles to articulate the structural nature of the inconsistency.
      *   Poor or incorrect comparison to Strotz.
      *   Little meaningful evaluation of the CPB.
      *   Summarizes the scenario without deep analysis.
  *   **F (0-8):** Inadequate. Fails to address core requirements, severe misunderstandings, or very brief.

  **Key Differentiators (A vs. B):**
  *   **Move A1:** "Structural failure of diachronic consistency" =/= "political hypocrisy/weakness". Must frame as *institutional* time-inconsistency in rationales.
  *   **Move A2:** Contrast MUST name: Strotz = Intra-agent, shifting discount rates, money pumped via trades. Green Pump = Inter-temporal conflict of distinct rationales, credibility/political capital pumped via cyclical lobbying pressure exploiting preference reversal.
  *   **Move A3:** CPB critique MUST argue it *shifts* the pump (not just mitigates or fails) and specify *how* (pump now targets Board's mandate, credibility, or existence; core inconsistency reappears at meta-level). Avoids just saying "lobbying finds a way."

  Grading should prioritize these specific analytical moves over stylistic perfection. Good luck storming the castle (of institutional inconsistency)!
