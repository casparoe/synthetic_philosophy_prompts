answer: |-
  Here's a step-by-step Neurath Isotype Compliance & Tactile Readability Procedure tailored for your exhibit design team. The checklist follows a sequential "hard reject" model where failure at Steps 1-4 kills the proposal immediately, while Steps 5-6 may require your judgment. I'll apply it to your two proposals and highlight limitations.

  ---

  ### **Neurath Isotype + Tactile Readability Procedure**
  **Key Principles Enforced:**  
  ① Identical unit symbols ② Quantity by repetition (not scaling) ③ 2D/flat design ④ Zero decorative complexity ⑤ Tactile non-blurring  

  **Required Tools:**  
  - Digital caliper (for physical gap measurement)  
  - Embossing test kit (e.g., swell paper or 3D-printed prototype)  
  - Low-vision tactile tester panel (for Step 6)  

  | Step | Check | Pass/Fail Criteria | Consequence | Escalation Needed? |
  |------|-------|---------------------|-------------|---------------------|
  | **1** | **Unit Symbol Uniformity**<br>_Are all symbols for a single unit truly identical?_ | PASS: Every unit symbol within a category (e.g., all coal icons) has identical shape, size, line weight, and orientation.<br>FAIL: Any variation in symbol design (e.g., coal lumps with different facet counts, rotated suns). | HARD REJECT if fail | No – objective check |
  | **2** | **Quantity Representation**<br>_Is quantity shown ONLY by repeating identical units?_ | PASS: Quantity differences use repeated symbols (e.g., 5 suns vs. 3 coal lumps).<br>FAIL: Scaling, color intensity, size gradients, or numerical labels replace repetition (e.g., one large icon = 5 units). | HARD REJECT if fail | No – objective check |
  | **3** | **Dimensionality & Decoration**<br>_Are symbols strictly 2D and minimal?_ | PASS: Symbols are flat silhouettes with uniform line weight. Zero shading/texture/decorative elements.<br>FAIL: 3D perspective, gradients, patterns, or "creative" details (e.g., sun rays with wavy lines). | HARD REJECT if fail | No – objective check |
  | **4** | **Tactile Gap Integrity**<br>_Will embossed symbols avoid blurring?_ | PASS: Measured gap between adjacent symbols ≥ **2x line weight** AND ≥ **1.5mm** (whichever is larger). Confirmed via embossed prototype.<br>FAIL: Gaps smaller than minimum, or clustered symbols creating tactile "noise". | HARD REJECT if fail | No – quantitative test |
  | **5** | **Inter-Category Symbol Distinction**<br>_Are symbols for different categories (e.g., coal vs. solar) tactilely distinct?_ | PASS: Low-vision testers correctly ID symbols by touch 19/20 times.<br>FAIL: Symbols feel similar (e.g., both circular shapes). | HARD REJECT if fail | No – tested outcome |
  | **6** | **Neurath Conceptual Alignment**<br>_Do symbols avoid unintended connotations?_ | PASS: Symbols are neutral "data carriers" (e.g., generic lump, geometric sun).<br>FAIL: Symbols imply bias (e.g., "dirty" coal vs. "happy" sun). | REFINE DESIGN | **YES – Values call to you** |

  ---

  ### **Application to Draft Proposals**
  **Proposal 1: Coal vs. Solar (Stacked Identical Icons)**  
  - **Step 1 (Unit Uniformity):** PASS – Identical coal lumps and identical suns.  
  - **Step 2 (Quantity Repetition):** PASS – Stacking = repetition.  
  - **Step 3 (2D/Minimal):** PASS – Flat silhouettes assumed.  
  - **Step 4 (Tactile Gaps):** **CONDITIONAL PASS** – *Only if gaps between lumps/suns ≥1.5mm + 2x line weight.* If stacked tightly, FAIL.  
  - **Step 5 (Inter-Category Distinction):** PASS – Lump (organic) vs. Sun (radial) = high tactile contrast.  
  - **Step 6 (Neutrality):** **VALUES CALL** – Sun may feel "optimistic"; coal neutral. *Requires your input.*  
  **VERDICT:** **APPROVED** if gaps pass; else redesign spacing.  

  **Proposal 2: Coal vs. Solar (Scaled Flame vs. Lightning Bolt)**  
  - **Step 1 (Unit Uniformity):** PASS – Single flame/bolt per category, so uniformity irrelevant.  
  - **Step 2 (Quantity Repetition):** **FAIL** – Scaled flame (large) vs. small bolt violates repetition rule.  
  - **Steps 3–6:** *Not evaluated* – Stopped at Step 2 (hard reject).  
  **VERDICT:** **HARD REJECT** – Neurath forbids scaling.  

  ---

  ### **The "Answer You'll Hate" Case**  
  **Proposal:** *Coal represented by 10 identical 2D lumps, solar by 10 identical suns. Gaps = 1.0mm (line weight = 0.6mm).*  
  - **Step 1:** PASS  
  - **Step 2:** PASS  
  - **Step 3:** PASS  
  - **Step 4:** **FAIL** – Gap (1.0mm) < 2x line weight (1.2mm).  
  **VERDICT:** **HARD REJECT** – Embossing would blur symbols. *Even if the graphic looks perfect visually, tactile safety trumps aesthetics.*  

  ---

  ### **What This Checklist CAN'T Settle**  
  1. **Symbol Semantics (e.g., "optimistic sun"):**  
     - Neurath demands neutrality, but cultural associations (sun = positive, coal = negative) are subjective. Step 6 flags this, but YOU must decide if it undermines educational goals.  

  2. **Color Choices:**  
     - Checklist ignores color (irrelevant for tactile needs). Use your discretion to ensure hues don't imply bias (e.g., coal in toxic green) or confuse color-blind visitors.  

  3. **Density vs. Comprehension Trade-offs:**  
     - E.g., Showing 1,000 units may require tiny symbols → fails Step 4 gaps. Checklist forces redesign (e.g., use "one symbol = 100 units" key), but can't judge if this reduces intuitiveness.  

  4. **Symbol Abstraction Level:**  
     - A minimalist coal lump vs. a literal photorealistic lump both pass Step 3, but realism may clutter tactile reading. Your call on balancing recognition with simplicity.  

  5. **Spatial Arrangement Creativity:**  
     - Neurath allows grids, circles, or lines to show quantity. Checklist only checks *inter-symbol gaps*, not whether a circular layout is "better" than a grid.  

  ---

  ### **Recommendations**  
  - **Prioritize Gap Testing Early:** 80% of tactile fails occur at Step 4. Require prototypes for *all* designs.  
  - **Step 6 is Your Lever:** Use it to filter symbols that "feel" right (e.g., reject a "menacing" wind turbine).  
  - **Kill Scaling Immediately:** Proposal 2 fails at Step 2 – no exceptions. Neurath considered scaling a "statistical lie."  
  - **Audit for Covert Bias:** Even passing designs may need tweaks if coal feels "evil" or solar "utopian."  

  This turns Neurath's philosophy into actionable QA. Hard rejects (Steps 1-5) prevent objectively flawed designs, while Step 6 lets you enforce the museum's voice. Test the checklist on a simple infographic first!
