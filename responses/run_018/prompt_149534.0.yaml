answer: |-
  Right, proper British political confusion, this. Was arguing with my dad the other day – he’s dead set he’s ‘left’ because he reckons anyone in a suit earning more than him is basically nicking his pension. ‘Down with the bosses!’ he shouts at the telly. Fair enough.

  Then, pint number three, he goes off on one about ‘needing stricter borders’ and ‘bloody queue jumpers’. Suddenly he sounds like my uncle Geoff who reads the *Daily Mail* for fun. My head’s spinning. Is he left? Is he right? Is he just… cross?

  And it’s like that everywhere! Remember when we went to France? Their ‘left’ is basically ‘no religion anywhere near the state, *merci beaucoup*’. Meanwhile, over here, ‘left’ could mean nationalising the railways *or* saving the newts in Chipping Sodbury. Totally different vibes! (*Kept the typo, boss*).

  It’s less a neat left-right split, more like someone dropped the political compass down the stairs. You’ve got your ‘hate the rich, love open borders’ lot in one corner, your ‘hate the rich, *close* the borders’ lot in another (hi Dad!), your ‘love the rich, but also love people marrying whoever’ crowd… Absolute state.

  Honestly, reckon you need graph paper just to plot where anyone actually stands. Economic left, social right? Economic liberal, social authoritarian? It’s a proper muddle. No wonder everyone just ends up shouting ‘woke!’ or ‘fascist!’ at each other – it’s easier than figuring out the bloody axes.

  So yeah, is the split real? Course it is. But mostly? It’s just vibes. And my dad’s vibe is currently ‘angry at his boss while sipping a shandy and demanding someone build a bigger fence’. Whatever *that* is on the spectrum. Pass the crisps.
