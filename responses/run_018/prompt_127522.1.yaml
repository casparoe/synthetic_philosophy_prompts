  For the "moral essentialism" charge, B is partially right that institutional function matters, but A isn't necessarily advocating for replacing the legal category.

  What both miss: Dr. A overlooks that Lemkin accepted compromises for legal viability. Dr. B underestimates how the legal definition can constrain moral understanding over time. Neither fully addresses how legal and moral categories interact dynamically.

