  hey so i was reading about that Letter Spirit project where the computer learns to make every version of the letter 'a' and apparently it finds this one hidden geometric thing that all a's share no matter the font, right? so if an algorithm can literally extract the essence of A-ness, doesnt that mean letter categories are basically Platonic forms and Wittgenstein was wrong about family resemblance? like why do designers still talk about style being fuzzy and context-dependent if we've already computed the invariant? am i mixing up what the program actually does, or is this genuinely a case where AI solved a philosophy problem by accident?
