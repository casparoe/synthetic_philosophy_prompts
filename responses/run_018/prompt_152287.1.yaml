prompt: |-
  Hey — I'm prepping material for a grad seminar on metaphyics of language and I need a prompt that gets students into the weeds a bit. Please explain the central conceptual tension deflationary theories of truth face with modal generalizations — specifically claims like 'everything the oracle said was necessarily true' — and whether that tension kills the view or just forces a revision. Lead with your bottom line in the first sentence: state exactly what the problem is and whether you think deflationism survives it, then lay out the reasoning withh no preamble and without restating the question. Don't just recycle the usual Horwich-versus-Field taxonomy; instead, contrast the disquotational strategy (eliminating 'true' via the disquotation schema) with the performative strand (treating 'true' as an endorsement speech-act) and ask whether either can genuinely explain scientific failure — e.g., why a false model mispredicts — without sneaking in a correspondence-style property. There's a typo or two in here, sorry about that. Keep it tight, and don't ask me for a bibliography — you don't need one.
