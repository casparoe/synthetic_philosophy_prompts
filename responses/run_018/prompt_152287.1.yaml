  For the disquotational vs. performative contrast: 
  - Disquotationalism reduces "true" to a device for infinite conjunction (e.g., "Everything the oracle said is true" becomes "P₁ and P₂ and ..." for all oracle claims). But this fails for modal cases because "necessarily true" can't be reduced to "necessarily P₁ and necessarily P₂..." if the oracle's claims are infinite or unknown. 
  - Performativism treats "true" as endorsement, so "necessarily true" would endorse the oracle's claims as necessary. But this doesn't explain why those claims *are* necessary—it just reports our attitude. 

