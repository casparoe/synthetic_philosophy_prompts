answer: |-
  **Bottom line:** Deflationism's core problem is explaining how 'true' in modal generalizations (like 'Everything the oracle said was necessarily true') or explanatory claims (like 'The model failed *because* it was false') can play a substantive role without invoking a substantive truth property, but it survives by adopting a minimal notion of truth-conditions that avoids robust correspondence.

  **The Modal Problem:**
  1.  **Disquotational Strategy:** Reducing "Everything the oracle said is true" to an infinite conjunction ("P₁ and P₂ and...") works for simple generalizations. But "Everything the oracle said was *necessarily* true" resists this. It *cannot* be reduced to "Necessarily P₁ and necessarily P₂ and..." if we don't know *all* the oracle's claims (making the conjunction unavailable) or if the claims are infinite. The modal operator applies to the *truth* of the claims collectively *as such*, not just to each individual claim we happen to list. Deflationism struggles to explain the contribution of 'true' here beyond its disquotational function.
  2.  **Performative Strategy:** Treating "is true" as endorsement ("I endorse everything the oracle said") fares worse. "Everything the oracle said was *necessarily* true" cannot plausibly mean "I *endorse* everything the oracle said as necessary." This confuses the *endorsement* (which is contingent and speaker-relative) with the *modal status* attributed to the oracle's *claims themselves*. The statement is about the oracle's claims possessing a necessary property, not about the speaker's current attitude.

  **The Explanatory Problem (Scientific Failure):**
  *   Consider: "The model mispredicted the experiment *because* its central assumption was false." Both deflationary strategies seem inadequate to explain the 'because':
      *   **Disquotational:** Reducing "The assumption was false" to "Not-P" (where P is the assumption) leaves the explanation as "The model failed *because* not-P." This *appears* sufficient, but it obscures the role 'false' plays. The explanation relies on the *semantic fact* that the model's *representation* (P) *fails to hold* in the world. Merely asserting "not-P" states the world's condition, but doesn't explicitly connect the *representational failure* to the predictive failure. Why does the model's *asserting something incorrect* cause the bad prediction?
      *   **Performative:** Reducing "The assumption was false" to "I refuse to endorse P" makes the explanation nonsensical: "The model failed *because* I refuse to endorse P." The model's failure is independent of the speaker's endorsement.

  **Resolution: Minimal Truth-Conditions**
  *   Deflationism survives by adopting a *minimal* concept of **truth-conditions**. This is *not* robust correspondence, but a deflationary commitment arising from the disquotation schema itself:
      *   To grasp "P" is (minimally) to grasp its truth-conditions: that "P" is true iff P.
      *   This establishes a *representational link* between the sentence/assertion and the world, but one fully explained by our understanding of the sentence's meaning (deflationary), not by a substantive relation like isomorphism.
  *   **Solving Modal Generalizations:** "Everything the oracle said was necessarily true" minimally means: For every proposition S asserted by the oracle, S is true in every possible world (where 'true' is understood via minimal disquotation). The work is done by the quantifier and the modal operator applied to the *propositions* via their truth-conditions. The generalization quantifies over propositions and attributes necessary possession of their deflationary truth-property.
  *   **Explaining Scientific Failure:** "The model failed *because* its central assumption was false" minimally means: The model contained an assertion "P" (with specific truth-conditions P); the actual world was not-P; the model's predictive mechanism *depended* on the world being P (given the meaning of "P" and the model's structure); therefore, the mechanism failed. The 'because' relies on the *incompatibility* between the world's state (not-P) and the state *required* for the model's successful operation *as defined by the truth-conditions of its representational components* (P). This uses the deflationary truth-condition (P is the condition for "P" being true) to explain the causal failure, without positing truth as a causal agent or robust correspondence. The failure is due to the world not satisfying the condition the model's representation *sets* for its own success.

  **Conclusion:** Deflationism requires acknowledging that truth involves minimal, representationally significant truth-conditions inherent to meaningful discourse. This avoids robust correspondence while explaining modal generalizations and explanatory uses by leveraging the conceptual link between meaning and truth established by the disquotational schema. The tension forces revision towards this minimal realism about truth-conditions, but doesn't kill the core deflationary insight that truth is not a substantive explanatory property *in itself*.
