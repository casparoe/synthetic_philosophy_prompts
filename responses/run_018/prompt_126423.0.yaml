  For (b): Even if we have such criteria, do they encode a status quo bias? Yes. Defining "low impact" relative to no activation assumes preserving the current state is desirable. But what if the world is headed toward disaster? Preventing the AI from intervening might itself cause harm. Also, choosing which physical variables to stabilize (like biomass) reflects a preference for biological life over other possible values. High probability here, maybe 85%, because any baseline comparison inherently values the existing state.

