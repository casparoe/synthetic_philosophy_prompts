prompt: |-
  I've been arguing with some people in my AI alignment study group about whether 'low impact' can be formallized without already knowing what we value. The basic proposal is that you define side-effects relative to a counterfactual where the AI never activates, then constrain it to stay within epsilon of that baseline on physically measurable variables—like total kinetic energy or biomass—so you don't need a full utility function over human flourishing.

  My friend says this just pushes the problem back: picking epsilon, picking which variables count as 'the world', and deciding what 'staying close' means all smuggle in normative judgments about what states are worth preserving. So I want your actual credence that there exists a non-trivial, non-empty definition of 'avoid side effects' that requires zero value specification. Decompose it: (a) the probability that a purely geometric or infroation-theoretic criterion—like bounded causal influence radius or reversibility—can do the job on its own; (b) the probability that even those criteria implicitly encode a preference for the status quo; (c) the probability that 'side effect' is inherently comparative and therefore collapses without a purpose; plus whatever other term you think belongs. Give rough numbers for each with one line of justification, combine them, and tell me which term moves the needle most and what evidence would shift it. Please lead with the bottom-line number in the very first sentence, then reasoning, no preamble, don't restate the question. This is for a conceptual dataset I'm building, so skip citations and reading lists—just work it out from first principles.
