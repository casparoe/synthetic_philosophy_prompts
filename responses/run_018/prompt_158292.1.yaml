prompt: |-
  I'm a journalist who covers science and ideaas, and I'm trying to write about Madhyamaka emptiness without just reapeating the usual soundbites. Every time I mention Nāgārjuna people drop the four-corner negation — "it is, it is not, it both is and is not, neither is nor is not" — like it explains everything. I want to know what precise philosophical claims that formula could actually be making. Lay out the distinct readings: is it a logical claim about the failure of bivalence? A metaphysical claim about svabhāva? An epistemic claim about the limits of conceptual thought? A rhetorical device? For each, say whether it's a trivial restatement, a defensible Madhyamaka thesis, or just false, and tell me which one people usually mean when they use it to shut down an argument about whether things really exist. Write your answer in American English, please.
