answer: |-
  ## The Constructed Disjunction

  We build our proofs like bridges, beam by beam,
  Where *is* demands the hand that shapes the stone.
  No phantom foothold on a logic dream,
  For **not false is not yet true**.

  The seed may wait in darkness, husked and deep,
  Unsplit by force of *either-or*'s decree.
  Its sprouting proof the only ground we keep,
  And **not false is closer, not true**.

  Where Hilbert's tenth commands a futile scan
  For machines that grind through endless sums in vain,
  To claim *solution or else none*? We ban
  What **not false, still not true** can name.

  This absent path through equations' tangled wood,
  This lacking key—we hold the space, unstained
  By claiming shadows where no witness stood,
  **Not false—** *(the silence remains)*

  ---

  ### Notes on Construction
  *   **Refrain Evolution:** The refrain precisely alters one word per quatrain (`not yet true` -> `closer, not true` -> `still not true`) before fracturing syntactically in the final quatrain, mirroring the intuitionist rejection of `¬¬P → P`.
  *   **Constructive Core:** Key ideas embedded: existence requiring construction ("hand that shapes the stone", "sprouting proof"), irreducible undecidability ("seed may wait", "absent path", "lacking key"), and rejecting classical disjunction without evidence ("claim *solution or else none*? We ban").
  *   **Diophantine Reference:** "Hilbert's tenth", "machines that grind through endless sums in vain", and "equations' tangled wood" directly reference the undecidability of Diophantine equations without explanatory intrusion.
  *   **Philosophical Tone:** Presents constructivism as a positive discipline ("build our proofs", "hold the space, unstained") focused on evidence and process, not mere skepticism. The unresolved final refrain embodies the irreducible possibility.
  *   **Accessibility:** Stands as a coherent poem about demanding proof and accepting uncertainty, while containing precise technical resonance for the seminar audience.
