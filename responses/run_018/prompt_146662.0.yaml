answer: |-
  ### Collective Memory Decision Tree: Duty to Remember vs. Case for Forgetting  

  **Start here:**  
  🤔 **Can forgetting ever be a moral act?** *(Not just an absence—a deliberate choice or outcome with ethical weight.)*  
  - **No** → You’re a **Mnemonic Activist**. Duty to remember is non-negotiable. Statues stay, records are sacred, archives must be defended. Digital rot is a crisis to fix, not fate.  
  - **Yes** → Go to next branch.  

  ---

  ### If "Yes" (forgetting *can* be moral):  
  🏛️ **A city removes a controversial statue. Is this forgetting justified?**  
  - **No** → Go to next branch.  
  - **Yes** → You’re an **Iconoclastic Forgetting Advocate**. Symbols of oppression must fall; public space shapes memory, and editing it is justice.  

  📜 **A survivor requests their trauma record be erased. Honor the request?**  
  - **Yes** → You’re a **Trauma-Centered Forgetting Advocate**. Personal agency trumps collective memory; erasure is repair, not betrayal.  
  - **No** → Go to next branch.  

  🧪 **A museum lets a contested artifact decay naturally (no restoration, "deaccesson" style). Ethical?**  
  - **Yes** → You’re a **Tragic Preservationist**. Some objects are too fraught to save; decay accepts history’s ambiguity.  
  - **No** → Go to final branch.  

  💾 **Digital rot happens (links die, servers fail, cloud archives vanish). Is this "forgetting" neutral or even useful?**  
  - **Neutral/Useful** → You’re a **Liberal Forgetter**. Digital decay culls the non-essential, freeing us from memory overload. Embrace entropy!  
  - **A problem** → You’re a **Paradoxical Archivist**. You accept forgetting can be moral... but *only* when intentional. Digital rot is chaos, not choice. (⚠️ *Empty branch? Rare—unintentional decay usually clashes with ethical agency.*)  

  ---

  ### Key Stances & Empty Branches:  
  - **Named Leaves:**  
    - `Mnemonic Activist`  
    - `Iconoclastic Forgetting Advocate`  
    - `Trauma-Centered Forgetting Advocate`  
    - `Tragic Preservationist`  
    - `Liberal Forgetter`  
    - `Paradoxical Archivist`  
  - **⚠️ Empty Logic Alert:**  
    - *"Forgiving all forgetting"* (moral + intentional + unintentional) → **No stance!** Why? Ethically incoherent—unintentional decay (digital rot) lacks agency, so it can’t be "moral."  
    - *"Statue removal YES but survivor erasure NO"* → **Unexplored!** Tension between public/private memory deserves its own camp (*"Selective Symbolist"?*).  

  ---

  ### How Digital Rot Warps Ethics:  
  > *Old-school preservation saw decay as failure. Digital rot flips this: a server crash isn’t a decision, it’s entropy on steroids. The "deaccesson" typo? Fitting—it’s like museums letting things rot, but without the curatorial intent. Cloud archives vanish without villains, muddying "duty" into tech fatalism.*  

  🌊 *Run your memory dilemma through this—see where you land!*
