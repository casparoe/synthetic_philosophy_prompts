answer: |-
  Here's the full specification for a robust theory of special obligations to compatriots, mapping the requirements, edge cases, and failure points of popular arguments:

  **Core Function:** The theory must justify *stronger* or *prioritized* obligations to fellow citizens/residents over outsiders, *beyond* baseline universal human duties.

  **Non-Negotiable Requirements (What It Must Get Right):**

  1.  **Grounding the Obligation:** It must establish *why* the relationship creates special duties. Possible sources (each with problems):
      *   *Reciprocity:* Shared institutions, tax payments, mutual protection. (Breaks with non-contributors or those excluded from benefits).
      *   *Shared Identity/Culture:* Common values, history, language, belonging. (Breaks with diverse societies, dissenters, minorities).
      *   *Cooperative Scheme:* Joint participation in a mutually beneficial social/political project. (Breaks with the marginalized, exploited, or those who never consented).
      *   *Proximity & Capacity:* Ease of identification and effective action within a bounded community. (Breaks with global interconnectedness/capacity).

  2.  **Defining "Compatriot":** It must clearly delineate *who* qualifies. This is the primary minefield:
      *   *Citizens:* Core case. But must handle dual citizens (obligations split? conflict?).
      *   *Permanent Residents (Non-Citizens):* Pay taxes, use services, bound by laws. Often indistinguishable from citizens in daily life. Must they be included? (Popular arguments often exclude them inconsistently).
      *   *Long-Term Temporary Residents (e.g., Work Visa Holders):* Contributing significantly, embedded socially. Degree of obligation?
      *   *The Stateless Within Borders:* Have no other state. Does obligation derive purely from presence/need?
      *   *"Digital Nomads" / High-Mobility Individuals:* Paying taxes in multiple jurisdictions (possibly minimally), using infrastructure/services transiently. Do they trigger obligations? How much? (Popular arguments implode here – they aren't "local" enough but may contribute financially).
      *   *Children of Citizens Born/Growing Up Abroad:* Formal citizenship, minimal connection. Full obligation?
      *   *Diaspora Communities (Emigrants):* Formal citizenship, emotional ties, potential remittances/investment. Obligation to them? From them? (Popular "locals first" ignores emigrants entirely).

  3.  **Distinguishing Status from Weight:** It must separate *qualification* for special consideration from the *degree* of that consideration. This is critical and often blurred:
      *   *Status:* Does the person fall within the defined group (e.g., citizen, resident)?
      *   *Weight/Strength of Claim:* Based on:
          *   *Degree of Integration/Contribution:* Long-term resident vs. new arrival? High taxpayer vs. beneficiary? (But risks creating tiers of citizenship).
          *   *Need and Vulnerability:* A desperate refugee vs. a wealthy immigrant? (Universal duties vs. special obligations clash here).
          *   *The Good in Question:* Priority for *scarce lifesaving resources* (e.g., disaster relief) vs. priority for *jobs/housing* vs. priority for *political participation/cultural preservation*? Obligations likely vary drastically. (Popular arguments treat all "local priority" equally).

  4.  **Handling Dynamic States & Edge Cases:**
      *   *"Might Be" Citizens (Climate Migrants, Asylum Seekers in Process):* People demonstrably needing refuge, likely to become long-term residents/citizens. Does potential future status create *present* obligations stronger than to distant strangers? (This eviscerates simple "citizens only" arguments).
      *   *Secession/New States:* Who counts as a "compatriot" during transition? Based on prior residency? Ethnicity? Choice? (Highlights the arbitrariness of many definitions).
      *   *Annexed Territories:* Do obligations shift instantly with border changes, or is there a transitional moral claim?
      *   *Non-Territorial Citizens (e.g., Extraterritorial Voting Rights):* Formally citizens, minimal physical presence/contribution. Full weight?

  5.  **Relationship to Universal Duties:** It must explain how compatriot obligations *interact* with, and are constrained by, fundamental duties to *all* humans (e.g., not letting outsiders starve while compatriots luxuriate). It cannot justify *violating* basic rights of outsiders.

  **The Knockout Requirement: The "No Moral Irrelevance" Principle**

  *   **The Requirement:** The theory must show that the *mere fact* of being a compatriot is **morally relevant** in a way that *justifies differential treatment* in a specific context, *even when all other relevant factors are equal* between the compatriot and the outsider.
  *   **Why it Knocks Out Popular "Charity Begins at Home" Arguments:**
      1.  **The Equal Need Scenario:** Imagine two people in identical, acute, life-threatening need: one is a local citizen, the other is a foreign national (or climate migrant, stateless person). *Only* the citizenship/residency status differs. Does the local *automatically* deserve priority *solely* because they are local? Popular arguments say "Yes."
      2.  **The Failure:** This exposes the moral arbitrariness. If *everything else is equal* (need, potential, vulnerability, etc.), prioritizing based *only* on the label "local" or "citizen" lacks inherent moral weight. It reduces to tribalism or preference for "our kind," which the theory must justify as morally significant *in itself*. Most reciprocity/cooperation arguments fail here – the outsider isn't *currently* part of the scheme, but that doesn't make their need less real or morally compelling *in that moment of crisis*. Identity arguments struggle to show why shared identity overrides equal suffering.
  *   **Where Popular Arguments Break:** They rely on conflating status with other factors that *are* morally relevant:
      *   **Conflation with Contribution:** "They paid taxes!" (But what about the needy citizen who never worked? Or the new arrival ready to contribute?).
      *   **Conflation with Proximity:** "We can help them easier!" (But global capacity exists, and proximity isn't always relevant to the good – e.g., remote aid allocation).
      *   **Conflation with Future Integration:** "They'll become one of us!" (But the *current* need is equal).
      *   **Conflation with Cultural Preservation:** "They understand our ways!" (Irrelevant to basic survival needs).
      *   **Conflation with Reciprocity Expectations:** "They'd help *us*!" (Untested assumption, and the outsider might too if given the chance).

  **Conclusion: Where Popular Theories Collapse**

  Popular "locals first" arguments typically fail the spec by:

  1.  **Failing the "No Moral Irrelevance" Test:** They cannot justify prioritizing a compatriot *solely* on status when need is equal, exposing inherent arbitrariness.
  2.  **Blurring Status and Weight:** Conflating formal citizenship/residency with contribution, need, or integration, leading to inconsistent application (e.g., excluding long-term residents, favoring wealthy citizens over needy non-citizens).
  3.  **Crashing on Edge Cases:** Being unable to coherently handle dual citizens (who's owed what?), non-citizen residents (integrated but formally excluded), climate migrants/"might-be" citizens (future vs. present claims), and digital nomads (territorial presence vs. contribution).
  4.  **Ignoring the Status/Weight Distinction:** Treating all claims by anyone with "local" status as equally strong, regardless of contribution, need, or the nature of the good.
  5.  **Under-Specifying the Grounding:** Relying on vague notions of "belonging" or "community" without rigorous justification that overrides equal moral concern for suffering.

  A viable theory needs to navigate these complexities by clearly defining the relevant community, justifying the *source* of the special obligation in a non-arbitrary way, rigorously distinguishing qualification from the strength of claim, and explicitly constraining special obligations with universal duties – especially when faced with the equal need of outsiders. Popular simplifications crumble under the weight of real-world ambiguity and the fundamental demand for non-arbitrary moral reasoning.
