  me and my roommate were arguing about the two envelope paradoxx actualy until like 2am and i still don't get the conceptual knot. not the basic "switch or stay" version — we both know that one cold. i'm stuck on what happens if you open the envelope and see $100. my friend kept insisting that even then, the expectation argument survives: if it's $100, then the other envelope is either $50 or $200 with equal prob, so expected value is $125, so you should still switch. but that feels wrong because once you see $100 you've learned something about where you sit in the distribution, right? if the prior over amounts was uniform or improper, seeing $100 should update your belief about whether you're holding the small or large envelope.

  but then he said the update doesn't work because the prior is improper and there's no normalization, so conditoning on seeing exactly $100 is technically undefined. i think the real issue is deeper though — it's about whether you're treating "i see $100" as regular evidential update or as a self-locating belief, like in sleeping beauty but for cash. can you explain the conceptual knot? specifically, why does the naive switching argument seem to survive opening the envelope, and is the fix that conditioning fails due to improper priors, or is it that we're mixing centered-world reasoning with standard bayesian updating? i want the gut-level intuition, not just the formal proof.
