  Considering possible angles:
  - The "arbitrary mechanisms" problem (Standing Order variations) could work but might lead to technical debates about systems design
  - The "temporal hostage" issue (Extubation) is strong but risks becoming a narrow medical ethics discussion
  - The "Locked Baseline View" is the most philosophically fertile - it directly challenges whether agency resides in present action or past choices, and exposes how moral responsibility might become unmoored from current agents

  Ah, yes - the Locked Baseline is clearly the winner. It transforms concrete cases into a meta-question about agency itself, forcing candidates to articulate what makes an agent the author of harm rather than a passive observer. That resists memorized answers because it requires constructing a positive account of agential responsibility while testing it against counterexamples about delegated agency and fixed histories.

  For the question structure, I'll:
  1. Present clean versions of Standing Order (with colleague/machine variants) and Extubation as paired challenges
  2. Explicitly block escape routes by prohibiting appeals to intention (double effect) or bare assertions
  3. Demand: a criterion, case application, Locked Baseline evaluation, and positive proposal about what the distinction must track

  The model answer needs to demonstrate:
  - A clear criterion (e.g. "initiating or sustaining lethal sequences")
  - Consistent application showing why nurse isn't killer in colleague/machine cases
  - Rejection of Locked Baseline as making responsibility arbitrary
  - Positive account linking distinction to authorship of new threats
  - Counterargument handling (e.g. "but what if the nurse promised to override?")

  Marking scheme will penalize:
  - Summarizing without applying (C)
  - Partial case analysis without universal criterion (B)
  - Missing Locked Baseline evaluation (automatic cap)
  - Unsupported moral weight claims
  - Ignoring the "what it must track" requirement

  *Adjusting model answer to ensure it hits all five marking points* - there, now the authorship proposal explicitly answers what the distinction tracks (new threat imposition) and counters the "duty objection" about the nurse.
answer: |-
  ## Exam Question: Third-Year Seminar Final  
  **Time Allowed:** 90 minutes  
  **Instructions:** Answer the question below. Do not summarize debates about the moral significance of the doing/allowing distinction. Appeals to the doctrine of double effect or unargued assertions about the distinction’s reality are insufficient. You must:  
  - **State and defend** a criterion for distinguishing doing harm from allowing harm.  
  - **Apply** your criterion to *Standing Order* and *Extubation* (detailed below).  
  - **Evaluate** the Locked Baseline View in light of your criterion.  
  - **Explain** what the doing/allowing distinction must track to bear moral weight, and defend this against one serious objection.  

  ---

  ### Cases  
  **Standing Order**  
  > A hospital’s automated system is set to deliver a lethal drug dose unless a nurse overrides it within 90 seconds. Nurse N sees the alert, knows how to override with one keystroke, and does nothing. The patient dies.  
  > *Variants (vary only one factor):*  
  > (A) N personally entered the lethal order.  
  > (B) A colleague entered the order.  
  > (C) The system generated the order randomly.  

  **Extubation**  
  > A patient on a ventilator will die within minutes if the breathing tube is removed. The patient would have died identically if the tube had never been inserted. Withdrawing the tube is classified as "allowing to die," yet never inserting it would also be "allowing to die."  

  **Locked Baseline View**  
  > Whether an agent *does* harm or *allows* it is settled by the last prior choice where an agent had an unforced option to alter events. The nurse in *Standing Order* merely allows death because the lethal sequence was "locked in" when the order was entered.  

  ---

  ### Question  
  Do the *Standing Order* variants and *Extubation* show that the doing/allowing distinction tracks morally arbitrary factors? Develop and defend an account of what the distinction *must* track to carry moral weight. Your answer must address the Locked Baseline View and one major objection to your account.  

  ---

  ## Model Answer (880 words)  
  The doing/allowing distinction is morally significant only if it tracks whether an agent *imposes a new lethal threat* versus *fails to interrupt an existing one*. I propose this **Threat-Introduction Criterion**: An agent *does harm* if they initiate or sustain a causal sequence that creates a lethal threat *independent* of the victim’s preexisting vulnerability. They merely *allow harm* if they refuse to counteract a threat that would otherwise proceed without their intervention. This avoids reducing the distinction to arbitrary history or mechanisms.  

  Apply this to *Standing Order*. In (A), N kills. By entering the order, N *created* a new, artificial threat—a system primed to deliver poison absent intervention. Her later inaction sustains her own lethal design. In (B) and (C), N lets die. The threat originates from the colleague or system flaw, not N. The lethal sequence runs autonomously; N’s override would disrupt it, but her refusal doesn’t activate it. The machine’s wiring ("runs until stopped") is irrelevant: what matters is whether N authored the threat. The Locked Baseline View mistakenly conflates authorship. It claims N’s role is identical in (B) and (C) because the "baseline" was locked earlier. But this ignores agency: in (B), the colleague *imposed* the threat; in (C), no agent did. N’s moral liability differs (e.g., she might have duties to correct colleague errors but not random glitches), yet in both, she *allows* death because she didn’t introduce the threat.  

  *Extubation* further tests this. Withdrawing the tube is allowing to die. The ventilator interrupts the patient’s fatal respiratory failure; removing it *restores* the preexisting lethal condition. The clinician doesn’t introduce a new threat (e.g., suffocation via pillow)—they cease counteracting an old one. Never inserting the tube would be identical: no new threat is imposed. That both are "allowing" isn’t paradoxical but correct. The classification isn’t hostage to timing; it hinges on whether the clinician’s act *itself* creates the danger. The ventilator’s physical presence is a red herring: unplugging a pacemaker sustaining a heart would be analogous. The threat isn’t the machine but the underlying pathology.  

  The Locked Baseline View fails because it makes agency arbitrary. It assigns responsibility to whoever last had "unforced options," regardless of their role or duties. In *Standing Order* (C), if the system default was set decades ago by a programmer unaware of this use, the View pins "doing harm" on them—absurdly, as they couldn’t foresee this outcome. Worse, if a child accidentally triggered the lethal order, the nurse’s inaction becomes "allowing," even though the child bears no moral responsibility. The View severs doing/allowing from what the agent *controls* at the time of death. It cannot explain why we blame N in (A) but not (B): her *present* relationship to the threat matters.  

  For the distinction to carry moral weight, it must track **whether the agent makes the victim worse off relative to the course of events the victim could reasonably expect absent the agent’s intervention**. This "Reasonable Baseline Expectation" anchors non-maleficence: we have stronger duties not to create new dangers than to rectify preexisting ones. In *Standing Order* (A), N violates the patient’s expectation of safety from staff-inflicted harm; in (B), the patient expects only that nurses won’t *introduce* new threats, though they may fail to fix others’. In *Extubation*, the patient expects treatment only if it is ongoing; ceasing it reverts them to their expected baseline (fatal illness), while *inserting* and *then removing* the tube wouldn’t worsen their original state.  

  One serious objection is that this lets agents evade duty by prior inaction. Suppose in *Standing Order* (B), N’s colleague set the order because N refused to check it earlier. If N’s earlier omission "locked" the baseline, my criterion might call her override a duty (since she partly enabled the threat) but still classify inaction as "allowing." Doesn’t this mismatch undermine moral weight? No. The distinction remains descriptively sound: N didn’t *create* the threat (the colleague did), so she *allows* death. But her moral blame could be high due to prior negligence. This shows the doing/allowing distinction is necessary but insufficient for full moral assessment; it tracks *one* dimension of agency (threat imposition), while duties consider relationships, promises, and prior conduct.  

  We thus rescue the distinction from arbitrariness. Whether a machine "runs until stopped" or treatment "has begun" matters only insofar as it clarifies who introduced the threat. The Locked Baseline View mistakes historical contingency for agency, but responsibility lives in present control over lethal sequences.  

  ---

  ## Marking Scheme (20 points total)  
  **Must-hit points for an A (17–20):**  
  1. **Clear Criterion + Defense (4 pts)**  
     - *A:* Articulates an original, non-circular criterion (e.g., threat-introduction, expectation violation).  
     - *B:* Restates a known view (e.g., "intervention vs. non-intervention") without refinement.  
     - *C:* Vague or inconsistent criterion.  
     *Common error:* Parroting "whether the agent causes the harm" without defining causation.  

  2. **Applied to Cases (5 pts)**  
     - *A:* Uses criterion to explain *all* variants of *Standing Order* AND *Extubation* coherently.  
     - *B:* Inconsistent application (e.g., nurse "kills" in (B) but not (C)).  
     - *C:* Treats cases in isolation or ignores variants.  
     *Common error:* Claiming Extubation is "killing" based on physical action alone.  

  3. **Locked Baseline Evaluation (4 pts)**  
     - *A:* Rejects or accepts it *based on criterion*, citing arbitrariness or moral detachment.  
     - *B:* Superficial engagement (e.g., "it seems wrong").  
     - *C:* Omits evaluation.  
     *Common error:* Agreeing with Locked Baseline without addressing how it handles colleague/random variants.  

  4. **What Distinction Must Track + Defense (4 pts)**  
     - *A:* Identifies a morally relevant feature (e.g., authorship, expectation) and argues why it matters.  
     - *B:* Asserts moral weight without justification.  
     - *C:* Conflates with intention or outcomes.  
     *Common error:* "It tracks control" without linking to harm imposition.  

  5. **Objection Handling (3 pts)**  
     - *A:* Names and rebuts a non-strawman objection (e.g., duty evasion, baseline vagueness).  
     - *B:* Weak objection (e.g., "consequentialists disagree").  
     - *C:* No objection addressed.  
     *Common error:* Raising but not resolving the objection.  

  **Consistency Check:** The model answer earns 20/20:  
  - (1) "Threat-Introduction Criterion" defined and defended (§1).  
  - (2) Applied to all *Standing Order* variants (§2) and *Extubation* (§3).  
  - (3) Locked Baseline rejected for arbitrariness (§4).  
  - (4) Distinction tracks "Reasonable Baseline Expectation" for moral weight (§5).  
  - (5) Objects and rebuts "duty evasion" via negligence (§6).  

  This forces candidates to *build* an account, not recite one. Good luck with your cohort!
