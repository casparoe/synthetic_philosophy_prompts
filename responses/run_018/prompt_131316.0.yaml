prompt: |-
  I'm in a metaphyics seminar this semester and my best friend roped me into giving the toast at her wedding recption on saturday. The room is gonna be split between philosophy grad students who know the origin essentialism debates and her relatives who just want heart. I want the toast to actually turn on the idea that she couldn't have come from a different sperm and egg—that her being this exact person is essentially tied to those specific origins—but with a twist: I want to ask whether a marriage vow is made by two origin-fixed individuals, or whether getting married creates a new kind of shared origin between them. The idea needs to do real structural work, like ruling out 'soulmate' talk or 'you could've been anyone' cliches, without turning into a lecture. Keep it to one paragraph, max 180 words, and make sure both sides of the room can laugh or at least nod. I wrote this quick between classes so sorry for any mess.
