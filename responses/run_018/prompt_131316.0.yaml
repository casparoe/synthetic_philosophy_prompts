  Here’s a toast that threads the needle, using origin essentialism for warmth, not lecture, while challenging clichés:

  "(Raises glass) Okay, full disclosure: as you know, I spend my days debating whether Sarah could’ve sprung from different sperm and egg. (Wink to philosophers). The philosophers here will groan, but the answer’s probably no – she *couldn’t* be anyone else; she’s essentially Sarah, born from that specific, beautiful collision of biology. But here’s the twist for marriage: while we arrive *at* this moment fixed by our origins, the vow itself? That’s where you two *invent* a brand new origin point. It’s not about finding a pre-existing ‘soulmate’ destiny wrote in the stars. No. It’s about standing here, as these two specific people, choosing *right now* to forge a shared beginning from scratch. This moment, this ‘I do,’ isn’t where your paths simply crossed; it’s where you deliberately ignite a single, brand-new story. You aren’t just who you came from anymore; you’re the origin of what you become together. To Sarah and Alex – founders of their own future! Cheers!"

  **Why it works:**
  *   **Hooks Both Sides:** "Sperm and egg" intro (philosophers nod), "beautiful collision" softens it for relatives. Acknowledges the academic context lightly ("philosophers will groan").
  *   **Core Metaphysics:** Clearly states origin essentialism ("couldn’t be anyone else," "essentially Sarah") without jargon.
  *   **The Twist:** Pivots to marriage as a *chosen, new origin* ("invent a brand new origin point," "forge a shared beginning," "ignite a single, brand-new story," "founders").
  *   **Rules Out Clichés:** Explicitly dismisses "pre-existing soulmate" and "destiny" while emphasizing active choice ("choosing right now," "deliberately").
  *   **Heart & Structure:** Focuses on their unique identity and active creation of a shared future. "Founders of their own future" is the warm, hopeful payoff.
  *   **Concise & Punchy:** ~160 words. Ends on a clear, toast-worthy sentiment.
  *   **Humor/Lightness:** Gentle teasing ("philosophers groan"), wink, accessible language.
