  The "will actively dislike" case requires careful construction: both sides must appear to share a suffering-weighted utility framework while differing only on empirical hyperpriors about feedback loops. This strips away the normative dimension the user wants preserved - precisely what will frustrate them.

  Important to explicitly state limitations too: the procedure will misfire if hyperpriors are misreported, struggles with nested model classes, and can't handle value incommensurability. The chair override clause is crucial - I'll specify when intuition should trump the flowchart.

  Throughout, I'll maintain British spelling and terminology while making definite design choices. For instance, I'll drop the distinction between model class and framing function hyperpriors in practice because they often blend, but preserve the normative/empirical divide where it matters for disposition.
answer: |-
  ## Hyperprior-Transparent Arbitration Procedure for Epistemic Peers

  **Core Principle:** Disagreements between epistemic peers require convergence *only* if they stem from corrigible differences within a shared epistemic or normative framework. Transparency of hyperpriors (over model classes or framing functions) is necessary to diagnose the *source* of divergence.

  **Procedure Flowchart (30-Minute Session):**

  1.  **Question:** "State the precise proposition P requiring arbitration. Do both peers agree that P is the *correct focal point* of the disagreement?"  
      *   **Sufficient Answer:** Explicit, mutually agreed-upon wording of P. If disagreement on P itself, panel reframes P neutrally based on initial submissions.  
      *   **Stopping Rule:** Proceed once P is clearly defined and mutually acknowledged as the dispute's core.  
      *   **Judgment Call:** Panel chair determines neutral reframing if peers deadlock on defining P. Flag: This framing sets the scope.

  2.  **Question (Hyperprior Transparency):** "For each peer, state: (a) Your posterior belief regarding P. (b) The specific generative model class M (e.g., linear dynamics, Bayesian network structure) or normative framing function F (e.g., utilitarian suffering-minimisation, deontological rule-adherence) used to arrive at (a). (c) Your hyperprior probability distribution over the *relevant space* of plausible model classes M_i or framing functions F_j that could reasonably be applied to P."  
      *   **Sufficient Answer:** Numerical/qualitative posteriors for P; explicit naming/description of M or F; explicit (even qualitative: e.g., "high confidence in M1, low in M2") hyperpriors over alternatives. Peers *must* declare if they consider only one M/F plausible (hyperprior ~1.0).  
      *   **Stopping Rule:** Proceed once all (a), (b), (c) are declared for both peers. *No debate on merits yet.*  
      *   **Judgment Call:** Panel assesses if declared hyperpriors cover the "relevant space" (ruling out fringe models/framings). Flag: Scope of "plausible" alternatives.

  3.  **Question (Shared Model/Framework Check):** "Based on declarations in Step 2, do both peers:  
      (i) Employ the *same* generative model class M *and* normative framing function F for P? OR  
      (ii) Employ the same M but different F? OR  
      (iii) Employ different M but the same F? OR  
      (iv) Employ different M *and* different F?"  
      *   **Sufficient Answer:** Clear classification (i-iv) based solely on Step 2 declarations.  
      *   **Stopping Rule:** Proceed immediately to Step 4 based on classification.  
      *   **Judgment Call:** Panel interprets "same" (e.g., is a specific type of neural net "same class" as general non-linear models?). Flag: Granularity of model/framework definition.

  4.  **Divergence Diagnosis & Disposition:**  
      *   **Case (i) Shared M & Shared F:**  
          *   **Diagnosis:** Divergent posteriors within shared framework. Common prior *assumed* applicable to M+F.  
          *   **Action:** Peers *must* reconcile posteriors. They share likelihoods/evidence within M+F until agreement or session end. Panel facilitates.  
          *   **Verdict:** **Convergence Required.** Full board signs off on reconciled posterior or acknowledges unresolvable impasse (rare under CPA within shared M+F).  
      *   **Case (ii) Shared M, Divergent F:**  
          *   **Diagnosis:** Normative framing disagreement. Outside scope of common prior over propositions/evidence.  
          *   **Action:** Escalate to **Values Committee**. Panel provides summary of M, P, and divergent F declarations.  
          *   **Verdict:** **No Convergence Required (Normative).** Chair signs off referral.  
      *   **Case (iii) Divergent M, Shared F:**  
          *   **Diagnosis:** Model class hyperprior divergence. Transparency required, but CPA doesn't force hyperprior convergence.  
          *   **Action:** Assess if hyperpriors are *stable* post-transparency (Step 2). Do peers significantly update their hyperpriors *just* from seeing the other's?  
              *   *If Yes (Hyperpriors Converge):* Treat as Case (i) - reconcile posteriors *within their now-shared preferred M* (if one dominates) or aggregate.  
              *   *If No (Hyperpriors Diverge):* Matter referred **back to researchers**. They must either:  
                  (a) Design a crucial experiment/simulation within Shared F to discriminate M1 vs M2.  
                  (b) Agree on a weighting scheme (e.g., model averaging using declared hyperpriors) for prediction/decision re: P.  
                  (c) Acknowledge irreducible uncertainty in P due to model ambiguity.  
          *   **Verdict:** **Convergence Required (if hyperpriors converge)** - Full board sign-off. **No Convergence Required (Empirical Hyperprior)** - Chair signs off referral back with instructions (a-c).  
      *   **Case (iv) Divergent M & Divergent F:**  
          *   **Diagnosis:** Fundamental paradigm clash.  
          *   **Action:** Escalate to **External Arbiter** (e.g., senior fellow outside the immediate dispute, specialised ethics board). Panel provides full Step 2 declarations.  
          *   **Verdict:** **No Convergence Required (Paradigm).** Full board signs off referral.

  **Application to Cases:**

  1.  **Epidemiologists (Vaccine Efficacy):**
      *   P: 10-year efficacy of Protocol X is below threshold Y.
      *   Step 2: Shared M (Bayesian meta-analysis framework). Shared F? (Implied: predictive accuracy is goal, no major *normative* framing split declared). Peer A: High hyperprior on Publication-Bias Model, Low on Genuine-Effect. Peer B: Reverse.
      *   Step 3: **(iii) Divergent M (within meta-analysis class), Shared F** (assuming no normative divergence declared).
      *   Step 4: Hyperpriors unlikely to converge just from transparency (deeply held beliefs about publication practices). **Verdict: No Convergence Required (Empirical Hyperprior).** Referred back to researchers with instructions: (a) Design analysis specifically testing for publication bias in *this* literature; (b) Average predictions using declared hyperpriors; (c) Report uncertainty from model ambiguity. Chair signs off.

  2.  **Philosophers (Deception in Altruism Study):**
      *   P: Using deception in Study Z is permissible.
      *   Step 2: Peer A: Posterior=No. Uses F_Deont: "Deception violates duty of respect." Hyperprior: F_Deont ~1.0, F_Util ~0. Peer B: Posterior=Yes (conditional). Uses F_Util: "Net reduction in suffering justifies deception if no alternative." Hyperprior: F_Util ~1.0, F_Deont ~0.
      *   Step 3: **(iv) Divergent M?** (Not primarily about empirical models). **(ii) Shared M?** (Not applicable). **--> (ii) Shared M? NO / (ii) Divergent F? YES --> (ii) Shared M, Divergent F.** (M is implicit/trivial here - the facts of the study are agreed, the *evaluation* differs).
      *   Step 4: **Diagnosis: Normative framing disagreement. Verdict: No Convergence Required (Normative).** Escalate to **Values Committee.** Chair signs off referral.

  3.  **Funding Committee (Suffering vs Capability - The Disliked Outcome):**
      *   P: Programme S (Suffering-Reduction) should be funded over Programme C (Capability-Building), given budget constraint.
      *   Step 2:
          *   Side S: Posterior=Fund S. Uses F_SuffUtil: "Utility = Reduction in Suffering (weighted)." Hyperpriors: High on Model M_SuffFocus ("Capability gains don't reliably reduce suffering long-term due to adaptation/hedonic treadmill"). Low on M_CapLoop ("Capability builds resilience, creating stronger long-term suffering reduction via feedback loops").
          *   Side C: Posterior=Fund C. Uses F_SuffUtil: "Utility = Reduction in Suffering (weighted)." Hyperpriors: High on M_CapLoop. Low on M_SuffFocus.
      *   Step 3: **(iii) Divergent M, Shared F.** Both use the *same* normative framing function (F_SuffUtil: Suffering-Weighted Utility)! Disagreement stems *only* from divergent empirical hyperpriors over models predicting *how* best to minimise suffering long-term (M_SuffFocus vs M_CapLoop).
      *   Step 4: Hyperpriors unlikely to converge via transparency alone. **Verdict: No Convergence Required (Empirical Hyperprior).** Referred back to researchers with instructions: (a) Design study/model comparing long-term suffering impact of S vs C types; (b) Average expected suffering reduction predictions using declared hyperpriors over M_SuffFocus/M_CapLoop; (c) Report funding uncertainty due to model ambiguity. **Chair signs off.**
      *   **Why you dislike it:** The procedure classifies the *framing* (F_SuffUtil) as shared, stripping away the perceived *normative* weight of autonomy/capability *as an intrinsic good*. It reduces the choice to an empirical prediction under a shared suffering-minimisation goal. Your hope to preserve the normative tension between suffering and autonomy is overridden by the peers' *declared* shared framing.

  **Explicit Limitations:**

  1.  **Misreporting Hyperpriors:** The procedure critically relies on truthful hyperprior declaration. Peers may misreport due to bias, strategic behaviour, or lack of introspection. This will lead to **misfires:** e.g., a true normative clash (Case ii/iv) misdiagnosed as empirical model divergence (Case iii) if one peer falsely claims to share F. The chair must be vigilant for implausible declarations.
  2.  **Nested/Ambiguous Model Classes:** Distinguishing "model classes" (M) is often fuzzy. A disagreement might be *within* a broad class (Case i) or *between* subclasses (Case iii). The **judgment call on granularity** (Step 3) is vulnerable and may misclassify divergence. Overly broad classes hide resolvable differences; overly narrow classes create false hyperprior disputes.
  3.  **Value Incommensurability:** Even within a shared *descriptive* framework F (e.g., multi-objective optimisation), if peers assign fundamentally different, non-negotiable weights to core values (e.g., suffering vs autonomy weights *within* F), the procedure may force aggregation (Case iii action b) that papers over an unresolvable normative rift. It **misclassifies deep value clashes as tractable weighting problems.**
  4.  **Hyperprior Stability Misjudgment:** The assessment of whether hyperpriors converge post-transparency (Step 4, Case iii) is highly subjective. A peer's refusal to update might stem from stubbornness (should force referral back) or genuine insight (warrants escalation). The panel can **err in forcing premature convergence or unnecessary referral.**
  5.  **Ignores Process & Power:** Focuses solely on epistemic/declarative state. Does not address imbalances in rhetorical skill, status, or access to data that might distort the process or declarations. Risks **privileging articulate or dominant peers.**
  6.  **Cannot Resolve True Paradigm Clashes:** Case (iv) referrals are a punt. The procedure offers no internal resolution for fundamental disagreements spanning both models and values.

  **Chair Override Conditions:** The chair *should* override the verdict if:
      *   There is **strong evidence of hyperprior misreporting** (e.g., peer's declaration contradicts prior consistent statements or basic rationality).
      *   The declared shared framework (F or M) is **demonstrably implausible or internally inconsistent** given the peers' histories or the proposition P.
      *   Applying the verdict (e.g., forcing convergence under Case i) would **clearly violate core ethical principles** of the collective, even if peers claim shared F.
      *   The **granularity judgment** (Step 3) is **clearly indefensible** upon brief reflection by the full panel.
      *   The dispute involves an **existential risk or immediate harm** where procedural delay is unacceptable (halt procedure, full board decides urgently).

  This procedure provides a structured, hyperprior-transparent lens for diagnosing peer disagreement. Its power lies in forcing explicit declarations of underlying model and value commitments before attempting resolution. Its weakness lies in the sensitivity of its diagnoses to the truthfulness and precision of those declarations and the inherent fuzziness of classifying frameworks. Vigilant chairing and acknowledgment of its limits are essential for legitimate application.
