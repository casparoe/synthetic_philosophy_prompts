  Now, we write the exam question and the model answer.

  Exam question:

  **Question 1 (30 marks): Anthropic Reasoning in Cosmology**

  Cosmologists have narrowed down to two theories that agree on all possible observations. The theory SPARSE says that our civilization is the only technological civilization that will ever exist, and it contains about \(10^{14}\) observer-lives. The theory CROWDED says there are about \(10^6\) such civilizations, each causally isolated from the others, and each containing about \(10^{14}\) observer-lives, for a total of \(10^{20}\) observer-lives. The priors for the two theories are equal.

  (a) Calculate how the self-indication assumption (SIA) updates the odds between SPARSE and CROWDED. Then, explain why the self-sampling assumption (SSA) does not update the odds in this scenario. (8 marks)

  (b) Now suppose you learn that you are an astronomer. Under CROWDED, only one civilization in a thousand develops astronomy, and each astronomy-doing civilization produces about \(10^8\) astronomer-lives. Under SPARSE, our civilization does have astronomy, and so also contains \(10^8\) astronomer-lives.

  (i) For both SSA and SIA, compute the likelihood of the evidence "I am an astronomer" under each theory. 
  (ii) Then, compute the posterior odds for SPARSE versus CROWDED under each of SSA and SIA. 
  (iii) Briefly explain why the same evidence leads to opposite conclusions under the two principles. (14 marks)

  (c) Discuss whether SIA's willingness to become highly confident in CROWDED from the armchair (without any specific astronomical evidence) is a reason to reject SIA. In your answer, note that SSA has its own armchair problems (such as in doomsday-style reasoning) and explain why this symmetry matters for adjudicating between the principles. (4 marks)

  (d) Both SSA and SIA face challenges regarding the choice of reference class. Explain how the choice of reference class might affect the SSA-based conclusion in part (b), and contrast this with how SIA avoids reference class dependence. Then, briefly note a different challenge that SIA faces (such as in infinite universes) and whether a restriction might help. (4 marks)

  ---

  **Model Answer**

  (a) Under SIA, the posterior probability of a theory is proportional to the product of the prior and the number of observers in that theory. The prior odds are 1:1. The number of observers under SPARSE is \(10^{14}\) and under CROWDED is \(10^{20}\). Therefore, the odds ratio updated by SIA is:
  \[
  \frac{P(\text{CROWDED} \mid \text{SIA})}{P(\text{SPARSE} \mid \text{SIA})} = \frac{0.5 \times 10^{20}}{0.5 \times 10^{14}} = 10^6.
  \]
  So SIA updates the odds to \(10^6 : 1\) in favor of CROWDED.

  Under SSA, the mere fact that we exist (without any specific additional evidence) does not update the probabilities because both theories entail the existence of observers. Specifically, the probability of observing that we exist (i.e., that there is at least one observer) is 1 under both SPARSE and CROWDED. Therefore, the likelihood ratio is 1 and the posterior odds remain 1:1.

  (b) (i) First, we note the relevant numbers:

  - SPARSE: 
      Total observers: \(10^{14}\)
      Astronomers: \(10^8\)
  - CROWDED:
      Total civilizations: \(10^6\)
      Fraction with astronomy: \(1/1000\), so astronomy civilizations: \(10^6 / 1000 = 10^3\).
      Total astronomers in CROWDED: \(10^3 \times 10^8 = 10^{11}\).
      Total observers in CROWDED: \(10^{20}\).

  Now, the evidence is "I am an astronomer".

  Under SSA: We are a random sample from all observers in the actual universe.

  - Likelihood under SPARSE: \(P(\text{I am astronomer} \mid \text{SPARSE}) = \frac{10^8}{10^{14}} = 10^{-6}\).
  - Likelihood under CROWDED: \(P(\text{I am astronomer} \mid \text{CROWDED}) = \frac{10^{11}}{10^{20}} = 10^{-9}\).

  Under SIA: The posterior is proportional to the prior times the number of astronomers in the theory.

  - The likelihood ratio interpretation in SIA is not the same as in SSA. Instead, for SIA, the update for the evidence "I am an astronomer" is done by weighting each theory by the number of astronomers (because SIA already weights by the total number of observers, and then conditioning on being an astronomer amounts to selecting the astronomer subset). Therefore:
    - The unnormalized posterior for SPARSE: \(P(\text{SPARSE}) \times \text{number of astronomers in SPARSE} = 0.5 \times 10^8\).
    - The unnormalized posterior for CROWDED: \(P(\text{CROWDED}) \times \text{number of astronomers in CROWDED} = 0.5 \times 10^{11}\).

  But note: we can also compute the likelihoods under SIA by considering the probability of being an astronomer given the theory and the SIA prior. However, the standard way is to note that the posterior odds are proportional to the product of the prior and the number of astronomers.

  (ii) Posterior odds:

  Under SSA:
    The likelihood ratio (SPARSE : CROWDED) is \(10^{-6} / 10^{-9} = 10^3\).
    Prior odds were 1:1, so posterior odds = \(1:1 \times 10^3 = 1000:1\) in favor of SPARSE.

  Under SIA:
    The unnormalized posteriors are proportional to \(0.5 \times 10^8\) for SPARSE and \(0.5 \times 10^{11}\) for CROWDED.
    Therefore, the ratio (CROWDED : SPARSE) = \((0.5 \times 10^{11}) / (0.5 \times 10^8) = 10^3\).
    So posterior odds are 1000:1 in favor of CROWDED.

  (iii) The same evidence leads to opposite conclusions because SSA and SIA handle the anthropic update differently. SSA conditions on being a random observer, so the evidence of being an astronomer is more likely under SPARSE because a larger fraction of observers in SPARSE are astronomers. In contrast, SIA weights theories by the total number of observers (or in this case, the number of astronomers) and so favors the theory with more astronomers overall, which is CROWDED.

  (c) SIA's armchair certainty in CROWDED might seem like a reductio because it allows us to become highly confident in a theory without empirical evidence beyond our existence. However, SSA has symmetric armchair problems: for instance, in the doomsday argument, SSA leads to the conclusion that humanity is likely to go extinct soon based on our birth rank. Both principles have counterintuitive implications from the armchair. Therefore, the charge of being "presumptuous" cannot by itself adjudicate because both are vulnerable to similar criticisms. A defender of SIA might bite the bullet and argue that our existence does provide evidence for theories that predict more observers.

  (d) Under SSA, the conclusion in part (b) depends on the reference class. If the reference class is broad (e.g., all observers) then we get the result above. But if we choose a reference class of "astronomers" only, then under SSA we would condition on being an astronomer from the start. Then the likelihoods would be:

     P(being an astronomer | SPARSE) = 1 (if SPARSE is true, then astronomers exist and we are among them? But note: we are conditioning on being an astronomer, so we are sampling from astronomers. Then the evidence of being an astronomer is equally expected under both? Actually, no: because under SPARSE, there is only one civilization of astronomers, while under CROWDED, there are many. But if we are conditioning on being an astronomer, then under SSA we are a random astronomer from all astronomers that ever exist.

     Under SPARSE: total astronomers = 10^8.
     Under CROWDED: total astronomers = 10^11.
     Then the likelihood of being an astronomer (if we are a random astronomer) is 1 in both? But wait, the probability of being an astronomer is not the same as the probability of being a particular astronomer. Actually, the evidence is "I am an astronomer", and under both theories we are an astronomer. But then we need the probability of observing nothing more? Actually, if we are conditioning on being an astronomer, then the likelihood for the theory is proportional to the probability of being an astronomer in that theory, which we already computed in the broad reference class. Alternatively, if the reference class is fixed as "astronomers", then the evidence is tautological. This shows the sensitivity to the reference class.

     In contrast, SIA avoids reference class dependence because it effectively weights by the number of observers in the reference class (in this case, the number of astronomers) without needing to specify the broader class. However, SIA faces a challenge in infinite universes: if there are infinitely many observers, then the weights become infinite and probabilities are undefined. A restriction to a finite reference class (e.g., observers in our causal patch) might be necessary.

  ---

  **Marking Scheme (total 30 marks)**

  (a) (8 marks)
  - 3 marks for correct SIA odds calculation (10^6:1 for CROWDED) with working.
  - 2 marks for noting that SSA gives no update because existence is certain under both.
  - 3 marks for clear explanation: the likelihood of existence under both is 1 so no update.

  Common mistakes: 
  - Claiming SSA gives an update because of the number of civilizations (e.g., saying under SSA the chance of being in our civilization under CROWDED is 1/10^6, but that would only be if we had specified which civilization, which we didn't). 
  - For SIA, forgetting to multiply by the prior or getting the ratio backwards.

  (b) (14 marks)
  - (i) 4 marks: Correct likelihoods under SSA (10^{-6} and 10^{-9}) and under SIA (proportional to 10^8 and 10^11, but note that in SIA we don't need the likelihoods as fractions because we use the number of astronomers). Alternatively, for SIA we can say the likelihoods are proportional to the number of astronomers (so 10^8 and 10^11) but normalized by the total observers? Actually, the model answer uses the unnormalized posteriors. The key is that for SIA the posterior is proportional to the number of astronomers.
  - (ii) 4 marks: Correct posterior odds for both SSA (1000:1 for SPARSE) and SIA (1000:1 for CROWDED).
  - (iii) 2 marks: Explaining that SSA conditions on being a random observer so cares about the fraction of astronomers, while SIA cares about the total number of astronomers.
  - 4 marks for the calculations and explanations being clear and complete.

  Common mistakes:
  - For SSA, using the number of astronomers without dividing by total observers.
  - For SIA, using the fraction of astronomers (like SSA) instead of the total number of astronomers.
  - Mixing up which theory is favored.

  (c) (4 marks)
  - 2 marks: Noting that SIA's armchair certainty might seem like a reductio but also mentioning SSA's doomsday argument as a symmetric problem.
  - 2 marks: Explaining that this symmetry means we cannot reject SIA solely on being "presumptuous" without also rejecting SSA.

  Common mistakes: Only criticizing SIA without mentioning SSA's problems.

  (d) (4 marks)
  - 2 marks: Explaining how SSA's result in (b) depends on the reference class (e.g., if the reference class is astronomers, then the likelihoods become 1 under both and we get no update, or if we change the reference class the fraction changes) and how this can flip the result.
  - 1 mark: Noting that SIA avoids reference class dependence in this case because it directly uses the number of astronomers (or the relevant group) without needing to specify a broader class.
  - 1 mark: Mentioning that SIA breaks down in infinite universes and might require a restriction (like only considering observers in our causal patch).

  Common mistakes: Not giving a concrete example of how changing the reference class affects SSA.
answer: |-
  ### Exam Question

  **Question 1: Anthropic Reasoning and Cosmology (30 marks)**  
  Cosmologists have narrowed down to two empirically indistinguishable theories about the universe:  
  - **SPARSE**: Only one technological civilization exists (ours), with \(10^{14}\) total observer-lives.  
  - **CROWDED**: \(10^6\) causally isolated civilizations exist, each with \(10^{14}\) observer-lives (total \(10^{20}\) observer-lives).  
  Priors are equal: \(P(\text{SPARSE}) = P(\text{CROWDED}) = 0.5\).  

  (a) **Classic anthropic update**:  
  (i) Compute the posterior odds (CROWDED : SPARSE) using the *self-indication assumption* (SIA). Show your work.  
  (ii) Explain why the *self-sampling assumption* (SSA) does not update the prior odds.  
  *(8 marks)*  

  (b) **Astronomer evidence**:  
  You learn you are an astronomer. Additional data:  
  - SPARSE: Has astronomy, with \(10^8\) astronomer-lives.  
  - CROWDED: Only 1 in 1000 civilizations develops astronomy; each has \(10^8\) astronomer-lives.  
  (i) For both SSA and SIA, compute the likelihood of observing "I am an astronomer" under each theory.  
  (ii) Using these likelihoods, compute the posterior odds (SPARSE : CROWDED) under SSA and (CROWDED : SPARSE) under SIA.  
  (iii) Briefly explain why the same evidence pushes the odds in *opposite directions* under SSA vs. SIA.  
  *(14 marks)*  

  (c) **Philosophical implications**:  
  SIA’s conclusion in (a) makes us near-certain of CROWDED *before* any evidence beyond our existence. Is this a fatal flaw (*reductio*) for SIA? Discuss why SSA faces a symmetric problem (e.g., doomsday-style reasoning), and why "presumptuousness" alone cannot resolve the debate.  
  *(4 marks)*  

  (d) **Reference class sensitivity**:  
  (i) Explain how SSA’s posterior in (b) changes if the reference class is narrowed to *only astronomers* or broadened to *all conscious beings*. Does this help SSA avoid counterintuitive results?  
  (ii) SIA avoids reference class dependence here but faces problems in infinite universes. Briefly explain why and suggest a restriction.  
  *(4 marks)*  

  ---

  ### Model Answer (Approx. 600 words)  

  **(a) Classic anthropic update**  
  (i) **SIA** weights theories by the number of observers. The posterior odds are:  
  \[
  \frac{P(\text{CROWDED} \mid \text{SIA})}{P(\text{SPARSE} \mid \text{SIA})} = \frac{P(\text{CROWDED}) \times \text{observers}_{\text{CROWDED}}}{P(\text{SPARSE}) \times \text{observers}_{\text{SPARSE}}} = \frac{0.5 \times 10^{20}}{0.5 \times 10^{14}} = 10^6.
  \]  
  Thus, SIA updates odds to **1,000,000:1 for CROWDED**.  

  (ii) **SSA** conditions on being a random observer in the actual world. The likelihood of existing (i.e., being an observer) is 1 under both theories:  
  - \(P(\text{existence} \mid \text{SPARSE}) = 1\) (only one civilization, and you are in it).  
  - \(P(\text{existence} \mid \text{CROWDED}) = 1\) (\(10^6\) civilizations, but you are in *some* civilization).  
  Since likelihoods are equal, SSA gives **no update** (posterior odds remain 1:1).  

  **(b) Astronomer evidence**  
  Key numbers:  
  - SPARSE: \(10^8\) astronomers, \(10^{14}\) observers → astronomer fraction: \(10^{-6}\).  
  - CROWDED: \(10^6\) civilizations × \(10^{14}\) observers = \(10^{20}\) observers. Astronomy civilizations: \(10^6 / 1000 = 10^3\). Astronomers: \(10^3 \times 10^8 = 10^{11}\) → astronomer fraction: \(10^{11}/10^{20} = 10^{-9}\).  

  (i) **Likelihoods** (probability of "I am an astronomer" given theory):  
  - **SSA**: Samples from *all observers*.  
    - SPARSE: \(P(\text{astronomer} \mid \text{SPARSE}) = 10^8 / 10^{14} = 10^{-6}\).  
    - CROWDED: \(P(\text{astronomer} \mid \text{CROWDED}) = 10^{11} / 10^{20} = 10^{-9}\).  
  - **SIA**: Posterior ∝ prior × number of *astronomers* (since SIA weights by "observer slots," and evidence selects the astronomer subset).  
    - SPARSE: Unnormalized likelihood = \(10^8\) (∝ number of astronomers).  
    - CROWDED: Unnormalized likelihood = \(10^{11}\).  

  (ii) **Posterior odds**:  
  - **SSA**: Posterior odds (SPARSE : CROWDED) = prior odds × likelihood ratio = \(1 \times \frac{10^{-6}}{10^{-9}} = 10^3\).  
    → **1000:1 for SPARSE**.  
  - **SIA**: Posterior odds (CROWDED : SPARSE) = \(\frac{P(\text{CROWDED}) \times 10^{11}}{P(\text{SPARSE}) \times 10^8} = \frac{0.5 \times 10^{11}}{0.5 \times 10^8} = 10^3\).  
    → **1000:1 for CROWDED**.  

  (iii) **Why opposite directions?**  
  - SSA depends on the *fraction* of observers who are astronomers. SPARSE has a higher fraction (\(10^{-6}\) vs. \(10^{-9}\)), so evidence favors SPARSE.  
  - SIA depends on the *absolute number* of astronomers. CROWDED has more astronomers (\(10^{11}\) vs. \(10^8\)), so evidence favors CROWDED.  
  The same evidence amplifies the existing SIA vs. SSA conflict: SSA penalizes theories with "wasted" non-astronomers, while SIA rewards theories with more total observers matching your data.  

  **(c) Philosophical implications**  
  SIA’s armchair certainty in CROWDED seems *presumptuous* (assigning high confidence without empirical data). However, SSA has a symmetric flaw: in the **doomsday argument**, SSA uses birth rank to infer humanity’s imminent extinction, which is also counterintuitive and armchair-derived. Rejecting SIA for "presumptuousness" alone is inconsistent without also rejecting SSA’s doomsday reasoning. The principles are *both* vulnerable to armchair paradoxes, so the debate requires deeper grounding (e.g., coherence or empirical calibration).  

  **(d) Reference class sensitivity**  
  (i) SSA’s result in (b) depends critically on the reference class:  
  - If narrowed to *astronomers only*, \(P(\text{astronomer} \mid \text{theory}) = 1\) for both, so no update (odds stay 1:1).  
  - If broadened to *all conscious beings* (e.g., including non-human animals), the fractions change arbitrarily—potentially reversing or nullifying the 1000:1 odds for SPARSE.  
  This makes SSA’s conclusions fragile and undermines its objectivity.  

  (ii) SIA avoids this by weighting theories directly by the number of observers matching the evidence (here, astronomers), sidestepping reference class choices. However, SIA fails in **infinite universes** (e.g., with infinitely many observers, probabilities become 0 or undefined). A fix is to restrict SIA to **observers in your causal patch** or use measure theory (e.g., density-based weighting).  

  ---

  ### Marking Scheme (30 marks total)  

  | **Part** | **Must-hit moves**                                                                 | **Marks** | **Common mistakes**                                                                 |
