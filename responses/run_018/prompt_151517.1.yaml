prompt: |-
  I am preparing a single fifty-minute seminar for philosophy undergraduates who have completed the Groundwork but have not yet studied the Doctrine of Virtue or Kant's reply to Benjamin Constant. I want to teach Kant's absolute prohibition on lying, using the murderer-at-the-door scenario not as a simple intuition pump but as a stress-test for the Formula of Humanity. Do not explain the doctrine to me; instead, design the pedagogical sequence.

  Open with the carrying example you would use—either a refined version of the murderer case or a substitute—and in the same opening sentence state the first conceptual dependency that must be in place before it is introduced, explaining why that dependency prevents students from reducing Kant's position to mere stubbornness. Next, lay out the remaining dependency order concisely: which idea about rational agency or perfect duty must follow the example so that the prohibition on lying is seen as structural rather than dogmatic? Then map the misconceptions students will form in sequence—anticipating at least that mental reservation is just a hidden permission to lie, that Kant values rules over human lives, and that Constant's critique makes the view obsolete—and specify the exact point in the lesson where each should be intercepted. Provide one diagnostic question that distinguishes understanding lying as a corruption of rational nature from viewing it merely as an imprudent strategy. Explicitly identify one related topic, such as the Doctrine of Right's treatment of false promises or the casuistry on equivocation, that you will deliberately exclude and justify that omission for this audience. Keep the entire response under 300 words, present the dependency order and misconception map as brief bullet points rather than prose, and do not include any reading list or citations.
reasoning: |-
  Okay, the user is asking me to design a pedagogical sequence for a fifty-minute philosophy seminar focusing on Kant's absolute prohibition on lying. The students have read the Groundwork but haven't studied the Doctrine of Virtue or Kant's reply to Benjamin Constant. The key requirement is to use the murderer-at-the-door scenario as a stress-test for the Formula of Humanity, not just as an intuition pump.

  I need to start with an opening example that establishes the first conceptual dependency. The user specifically wants this opening to prevent students from reducing Kant's position to mere stubbornness. I'll use a refined version of the murderer case: "Imagine a murderer asks if your friend is hiding in your house; Kant says you must answer truthfully." The critical dependency to establish first is that rational agents are ends-in-themselves. I'll explain that this prevents students from seeing Kant as stubborn because it shows his position stems from respecting others' rationality, not arbitrary rule-following.

  For the dependency order, I'll outline the key concepts that must follow sequentially:
  - First: Rational agents as ends-in-themselves (already covered in opening)
  - Second: Lying denies others the rational capacity to set ends
  - Third: This constitutes treating them as mere means (perfect duty violation)

  For misconception mapping, I'll anticipate three common misunderstandings and specify when to intercept them:
  1. Mental reservation as hidden permission to lie → Intercept when discussing the second dependency
  2. Kant values rules over lives → Counter when analyzing the case through FoH lens
  3. Constant's critique makes Kant obsolete → Address during Q&A to distinguish moral frameworks

  I need one diagnostic question that distinguishes understanding lying as corruption of rational nature versus seeing it as imprudent strategy. I'll use: "Does lying primarily wrong others by making their choices ineffective or by distorting their rational agency?"

  For exclusion, I'll omit the Doctrine of Right's treatment of false promises. Justification: Students lack prerequisite knowledge of Kant's legal/political distinctions, and it might dilute the focus on perfect duty to oneself.

  The response must be under 300 words, use bullet points for dependencies and misconceptions, and avoid citations. I'll keep it concise while ensuring all pedagogical elements are addressed to meet the seminar's learning objectives.
answer: |-
  **Opening Example & First Dependency:**  
  Begin with: "Given Kant's principle that rational agents are ends-in-themselves (FoH), imagine a murderer at your door asks if your friend is inside; you know truth-telling gets them killed. Kant still prohibits lying."  
  *Why it prevents "stubbornness" charge:* This frames the duty as protecting *rational agency itself*, not blind rule-worship.  

  **Dependency Order (Sequence After Opening):**  
  - Lying intentionally uses another’s rationality as a *tool* for your end.  
  - This *denies their capacity* to set ends based on truth → treats them as mere means.  
  - Thus, it violates a *perfect duty* to humanity in oneself/others (structural corruption).  

  **Misconception Map (Interception Points):**  
  - **Mental reservation = hidden permission to lie?** → Intercept *immediately* when analyzing *how* lying works (clarify: intentional deception still instrumentalizes).  
  - **Kant values rules over lives?** → Intercept *during FoH application* to the case (stress: it’s about respecting agency, not outcomes).  
  - **Constant’s critique makes Kant obsolete?** → Intercept *in Q&A* (note: Constant’s "duty to truth" permits lying; Kant’s is a *duty of right* to humanity, distinct frameworks).  

  **Diagnostic Question:**  
  *"Does lying primarily wrong others by (a) producing harmful outcomes they didn’t choose, or (b) hijacking their rational capacity to choose at all?"*  
  (Correct: b; shows grasp of rational nature corruption.)  

  **Excluded Topic & Justification:**  
  - **Doctrine of Right on false promises** → Omitted to avoid conflation with *self-regarding* duty against lying (Doctrine of Virtue). Audience lacks context for Kant’s legal/moral distinction, risking oversimplification.  

