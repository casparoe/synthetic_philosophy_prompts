answer: |-
  Your study group's argument is clever but contains a subtle misstep at **step (3) and its implications for (4)**. This misunderstanding creates a false equivalence between ISOTYPE and verbal language. Here's the breakdown:

  ### The Weak Link: **Step (3)**
  > *(3) "But if a picture shows a relation spatially, then recognizing that layout as meaning the relation already requires an interpretive rule linking geometry to fact."*

  **Problem:** This equivocates on **"interpretive rule"**. Neurath *agrees* that understanding ISOTYPE requires learning conventions. His claim isn't that pictograms are *convention-free*, but that their conventions are:
  1. **Perceptually Grounded**: They exploit innate human capacities to perceive spatial ratios (e.g., seeing that one bar is twice as long as another).
  2. **Physically Constrained**: The mapping between the pictogram (e.g., bar length) and the physical quantity (e.g., coal production) is *non-arbitrary*. A longer bar *must* represent a larger quantity by design. In language, the sign "large" has no inherent link to size.

  ### Why (4) Doesn't Follow
  > *(4) "So ISOTYPE doesn't remove hidden conventions; it buries them in the icon design."*

  **Neurath's Response:** Conventions aren't "buried"; they're **explicitly designed to be universal through perceptual immediacy**. The "rule" is:  
  > *"This geometric property (length/area) corresponds proportionally to this measurable physical quantity."*  

  This is fundamentally different from linguistic syntax because:
  - **Reduced Arbitrariness**: A 2:1 length ratio *directly mirrors* a 2:1 quantity ratio. No abstract grammar mediates this.
  - **Cross-Cultural Accessibility**: Spatial perception is universal (unlike French vs. Mandarin syntax). Learning the rule is quicker and more intuitive than mastering a verbal language.

  ### Salvaging (1) & (2)
  Neurath can consistently hold both:
  1. **ISOTYPE's Advantage**: It uses spatial perception to convey quantitative relationships *more directly* than verbal descriptions (which require parsing syntax and vocabulary).  
  2. **Boat Metaphor**: All knowledge systems (including ISOTYPE) lack external foundations and rely on coherence. But ISOTYPE’s elements are *physically anchored* (e.g., bar lengths tied to empirical measurements), making coherence checks more straightforward than with abstract language.

  ### If You Reject (4): What You Owe
  If you argue ISOTYPE *avoids* problematic conventions, you must defend:
  1. **Non-Arbitrariness**: Admit conventions exist but insist they are *minimally arbitrary* because they leverage perceptual universals (geometry → quantity).  
  2. **Degrees of Transparency**: Concede ISOTYPE isn’t "metaphysics-free" but argue it’s *more transparent* than language because its conventions are sensory and quantitative, not syntactic.  
  3. **Pragmatic Superiority**: Grant that both systems need rules, but ISOTYPE’s rules are optimized for cross-cultural data communication with fewer layers of abstraction.

  ### Key Neurathian Insights Your Group Missed
  - **Physicalism as Anchor**: ISOTYPE glyphs represent *measurable physical quantities*. The "rule" is a calibration between visual scale and data, not a linguistic convention.  
  - **Visual Syntax ≠ Verbal Syntax**: ISOTYPE has rules, but they are *topological* (e.g., adjacency, scaling) not *grammatical* (subject-predicate). This reduces interpretive flexibility.  
  - **The Boat Applies, But Differently**: Yes, ISOTYPE needs internal coherence (e.g., consistency in scaling across charts). But its "planks" (visual ratios) are repaired using *physical measurements*, not semantic negotiation. This is Neurath’s "encyclopedic integration" in action.

  ### Conclusion
  Your group errs by treating *all* conventions as equally arbitrary. Neurath’s genius was recognizing that **pictorial conventions leveraging perception are less arbitrary and more empirically constrained** than linguistic ones. ISOTYPE doesn’t escape conventions—it engineers them to be *objectively grounded*. Reject step (3)’s equivocation, and you keep (1) and (2) intact: ISOTYPE *shows* ratios spatially (exploiting perception), while the boat metaphor acknowledges all systems are coherentist (but ISOTYPE’s coherence is physically tethered).

  This doesn’t make ISOTYPE "perfect," but it *does* create a "principled gap" (step 5) between pictograms and verbal language. Your friend’s conclusion fails because ISOTYPE’s transparency is *comparative*, not absolute—and that’s enough for Neurath’s project.
