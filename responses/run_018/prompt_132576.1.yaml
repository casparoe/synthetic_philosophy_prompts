  ### Classroom Activity: The Token Tower Dilemma  
  **Objective:** Experience the tension between step-by-step rationality and cooperative potential in a multi-round interaction, mirroring the backward induction paradox without naming it.  

  ---

  #### **Materials per Pair**  
  - **Shared Token Stack:** Visible counter starting at 2 tokens.  
  - **Token Growth:** +2 tokens per round if both choose "build."  
  - **Banking Payoff:** If "bank" is chosen, the game ends. Banker (player who banks) gets 60% of tokens; non-banker gets 40%.  
    - *Example:* At 10 tokens, banker receives 6, non-banker receives 4.  
  - **Termination Envelope:** Sealed envelope with one hidden rule (assigned randomly):  
    - Rule 1: If both build past round 4, the stack collapses to 0.  
    - Rule 2: If Player A banks in round 3, Player B receives 0.  
    - Rule 3: If Player B banks in round 2, tokens are halved before splitting.  
  - **Choice Slips:** For silent-phase decisions.  
  - **Role Cards:** Assign "Player A" or "Player B" per student.  

  ---

  #### **Session Structure (75 min)**  
  **Phase 1: Silent Play (15 min)**  
  - **Setup:** Pairs sit facing each other. Stack starts at 2 tokens. Envelope is sealed.  
  - **Rules:**  
    - Each round, players **simultaneously** write "build" or "bank" on slips and hand to facilitator.  
    - If both choose "build": Stack grows by 2 tokens. Continue to next round.  
    - If one or both choose "bank": Game ends. Banker (first to bank by role priority: Player A > Player B) gets 60%, other gets 40%.  
    - **Communication:** Gestures or written notes only—no talking.  
  - **Critical Moment:** At the start of round 3, facilitator instructs pairs to open the envelope. The hidden rule applies *from that point onward* but does not alter prior rounds.  
  - **Outcome:** Game ends if banking occurs or after round 5 (max rounds).  

  **Phase 2: Open Discussion (20 min)**  
  - Pairs discuss their experience and strategy openly.  
  - **Constraints:** Do not reveal the hidden rule to other pairs. Do not open new envelopes.  
  - **Prompt:** "Why did you build or bank? How did the hidden rule affect your trust?"  

  **Phase 3: Private Commitment (10 min)**  
  - Each student **independently** writes whether they will "build" or "bank" in **round 5** on a slip (no consultation).  
  - **After commitment:** Envelopes are opened, and outcomes resolved hypothetically:  
    - If both build in round 5, apply the hidden rule.  
    - If one banks, use the banking payoff.  
  - **Final Step:** Facilitator calculates token totals (non-monetary).  

  ---

  #### **Debrief (20 min)**  
  Map the activity to backward induction concepts:  
  1. **Silent Phase → Step-by-Step Rationality:**  
     - Players focus on immediate gains (e.g., "Banking now guarantees me 60%").  
     - Hidden rules force short-term thinking, mimicking how backward induction starts from the end.  
     - **Tension:** Cooperation (building) risks collapse, echoing the paradox—rationality pushes toward early defection.  

  2. **Negotiation Phase → Common Knowledge of Rationality:**  
     - Discussion builds shared expectations but cannot eliminate uncertainty (hidden rules persist).  
     - Contrast with backward induction: Real agents lack common knowledge of *all* rules and payoffs.  

  3. **Private Commitment → Finitude Objection:**  
     - Round 5 choices reveal if players "look ahead" despite complexity.  
     - Few execute full inductive chains; hidden rules simulate real-world unpredictability.  

  **What the Activity Captures:**  
  - The core conflict: Short-term rationality vs. cooperative potential.  
  - How uncertainty (hidden rules) disrupts perfect backward induction.  

  **What It Cannot Reproduce:**  
  - **Infinite Regress of Reasoning:** Backward induction assumes agents recursively simulate *all* future steps. Here, rules are revealed incrementally, capping reasoning depth.  
  - **Fully Transparent Rationality:** Players lack ironclad mutual knowledge of each other’s rationality or payoffs.  

  **Facilitator’s Verbal Bridge:**  
  > "In backward induction, players are assumed to:  
  > 1. Know *every* future rule,  
  > 2. Believe their partner is perfectly rational, and  
  > 3. Simulate all steps to the end.  
  > Our hidden rules and communication limits disrupted this. Real agents use heuristics, not infinite chains."  

  ---

  #### **Predicted Problems & Solutions**  
  1. **Premature Envelope-Opening:**  
     - *Risk:* Curiosity leads to early opening, spoiling uncertainty.  
     - *Prevention:* Physically collect envelopes after distribution. Emphasize: "Open only when instructed in round 3."  

  2. **Token Split as Moral Issue:**  
     - *Risk:* Players view 60/40 split as "unfair," not strategic.  
     - *Recovery:* Reframe: "This is a rule, like chess. Focus on payoffs, not justice."  

  3. **Rule Confusion vs. Unfairness:**  
     - *Risk:* Blaming "unfair" rules (e.g., Rule 2 penalizes Player B).  
     - *Prevention:* Clarify pre-game: "Rules are randomized; they mimic unpredictable real-world constraints."  

  4. **Over-Communication in Silent Phase:**  
     - *Risk:* Written notes become explicit contracts.  
     - *Mitigation:* Ban promises (e.g., "No notes guaranteeing future builds").  

  ---

  **Design Rationale:**  
  - **Centipede Essence:** Growth-by-cooperation vs. collapse-by-defection is embedded in token mechanics.  
  - **Hidden Rules:** Simulate real-world uncertainty, blocking perfect backward induction.  
  - **No Prior Naming:** Avoids priming; tensions emerge organically.  

  This design forces confrontation with the paradox: Even when mutual building maximizes collective gain, step-by-step rationality and uncertainty pull players toward early banking. The debrief formalizes this as a flaw in classical rationality models.
