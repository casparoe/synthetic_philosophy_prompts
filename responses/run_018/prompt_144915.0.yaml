answer: |-
  ### 1. The Proposition  
  A consistently applied Neurathian physicalism permits conventional assignment of ethical ISOTYPE symbols without collapsing into realism or communicative instability, provided icons are grounded in revisable collective decisions rather than metaphysical properties.  

  ### 2. Decomposition  
  **(a) Anti-metaphysics extends to ethics (0.85)**  
  Neurath’s unified science rejects transcendent truths; ethics is framed as socio-behavioral coordination, not metaphysical inquiry. His encyclopedism treats norms as practical protocols.  
  **(b) Property-tracking needed for cross-linguistic stability (0.65)**  
  Non-observational predicates (e.g., "exploitation") require anchoring in intersubjectively verifiable social structures (e.g., wealth disparity metrics) to avoid semantic drift across cultures.  
  **(c) Stability without shared intuitions (0.40)**  
  Conventional icons presuppose overlapping material practices (e.g., labor laws). Absent these, symbols like "fairness" fragment in ideologically divided communities.  
  **(d) Physical grounding scope (0.60)**  
  *Hidden term*: Whether "physical" includes emergent social patterns. If structural relations (e.g., resource flows) are physical, icons can track them without metaphysics; else, conventions float.  

  ### 3. Combined Credence & Rule  
  **Credence: 0.13**  
  Combination rule: Multiplicative (a×b×c×d). Neurath’s anti-metaphysics (a) is strong, but cross-context stability (b,c) and physical scope (d) create friction. Low product reflects tension: conventionalism *can* hold theoretically but likely fractures communicatively.  

  ### 4. Sensitivity Analysis  
  **Weakest term: (c) Stability without shared intuitions (0.40)**  
  This shifts most if "collective decision" implies shared *material conditions* (e.g., global labor monitoring). If ethical icons map to physical feedback systems (e.g., exploitation triggering measurable unrest), stability could reach 0.70. Absent this, it drops to 0.20.  

  ### 5. Mapping Your Disagreement  
  **Your friend (~0.75) is more likely wrong.** Your credence (~0.35 realism-leaning) aligns better with (b) and (c):  
  - She overestimates (c), assuming collective decisions ensure stability without material anchors.  
  - You both split on (d): She sees ethical assignment as *purely* conventional (ignoring emergent physicality); you see it as requiring structural tracking.  
  Core clash: Whether "revisable protocol" for ethics can bypass *all* property-tracking (her view) or minimally demands emergent social physics (yours).  

  ---  
  **Key Insight**: Neurath’s conventionalism works only if "collective decisions" reference physical social systems—else, icons become unstable gestures. Your friend’s stance risks communicative collapse; yours risks covert realism but better predicts instability.**
