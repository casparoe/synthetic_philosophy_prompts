prompt: |-
  ok so i've been lurking on rationalist forums for years and usually skip the bioethics threads, but i'm taking this philosophy of medicine course and there's a practice that's been bugging me. in basically every hospital system i know of, a doctor can legally withdraw a ventilator or stop artificial nutrition with family consent, but if that same doctor gives a lethal injection—even to the same patient, with the same prognosis and an explicit request—it's treated as homicide. people defend the line by saying one is "letting die" and the other is "killing," but that sounds like it's presupposing a whole metaphysics of causation that nobody applies consistently elsewhere. like, we blame doctors for negligent omissions all the time, so omission bias can't be the full story, and if it's about intent then both actions involve the same intent to end suffering.

  so what philosophical commitments does this institutional practice actually presuppose? is it committed to the idea that omissions lack causal efficacy, or is it truely protecting some boundary around the physician's social role? could the practice be compatible with a view that killing and letting die are morally equivalent, but we maintain the distinction for tractability or narrative continuity—like, the patient's story has to include "the disease killed him" rather than "the doctor killed him"? and if we replaced the implicit theory with a framework that cares only about autonomy and outcomes, what exactly breaks in the protocol—not just the law, but the paperwork, the nursing documentation, the way families are counseled? i'm not asking for citations, just whether this is philosophically coherent or held together by something weirder, like a hidden commitment to "causal pathway ownership" that we don't admit out loud. also i might be missing something existant in the literature, but please don't just list books—i want the implicit theory reconstructed.
