  The user wants to understand the philosophical underpinnings of this distinction. They suspect it's not just about omission vs. commission or intent, pointing out that negligent omissions are still punished. They’re questioning whether the distinction is philosophically coherent or if it’s held together by something less explicit, like societal narratives or role-based boundaries. 

