prompt: |-
  Hey, quick one. I've been thinking about Clark/Chalmers-style extension, and there's this pattern I see with people using LLMs that doesn't map cleanly onto either pure tool-use or full-blown extended mind. They don't literally claim the model is part of their brain, but they also don't treat it like a calculator -- they talk about "our reasoning" and defend outputs as if there's a shared cogntive space where the bot is an exernal partner, not just an instrument. Is there an established term for this in-between zone? I know distributed cognition handles groups and parity handles functional equivalence, but this feels like a social-extended hybrid with an intentionally blurry boundary. If nothing fits, can you coin a precise concept with boundary cases that separate it from both Clark-style extension and ordinary scaffolding? Start with your bottom line in sentence one, then reasoning only, no preamble, and don't restate my question.
reasoning: |-
  Okay, the user is asking about a concept in philosophy of mind, specifically about how people interact with LLMs in a way that's not quite extended mind (like Clark/Chalmers) but also more than just using a tool. They mention people refer to "our reasoning" and defend outputs as if sharing cognitive space. 

  Hmm, this is interesting because the user clearly knows the existing frameworks - they mention distributed cognition and parity principle but find them insufficient. They want something that captures the intentional blurring of boundaries between human and AI cognition. 

  Let me unpack what they're describing: Humans aren't claiming the LLM is literally part of their mind (so not extended mind), but they're also not treating it like a passive tool (like a calculator). There's this collaborative aspect where they co-own the reasoning process. 

  The key elements seem to be: 
  1) Mutual shaping (human adapts to AI, AI adapts to human)
  2) Deliberate boundary blurring (the "our" in "our reasoning")
  3) Defending outputs as shared products

  Existing concepts don't quite fit. Distributed cognition focuses on human groups. Scaffolding is too one-directional. Extended mind requires functional equivalence. 

  What might work... "Cognitive symbiosis"? No, too biological. "Shared agency"? Too vague. 

  Ah! "Partnered cognition" - that captures the voluntary collaboration aspect. Or "dialogic extension" to emphasize the back-and-forth. But the user wants clear boundaries from existing concepts. 

  Important to distinguish from Clark: here it's about relationship not replacement. And from tools: there's mutual adaptation. 

  The user seems academically sophisticated - they used precise terms like "boundary cases". They're probably writing something or preparing a talk. Might need citable terminology. 

  Should emphasize the negotiated aspect - it's not permanent like extended mind, but more entangled than tool use. The defense of outputs is crucial - that shows commitment to the partnership. 

  "Collaborative cognitive integration" covers: collaboration (social), cognitive (mind), integration (blurred boundary). Needs the three criteria to prevent over-application. 

  Final answer should be punchy first line then tight reasoning. User hates fluff - specified "no preamble". Must honor that.
answer: |-
  **"Collaborative cognitive integration" best describes this phenomenon.**  

  Reasoning:  
  1. **Distinguishing from extended mind**: Clark/Chalmers require functional equivalence and constant availability, but here the AI is a *negotiated* partner—users dynamically adjust prompts, reject outputs, and co-construct reasoning without assuming seamless biological parity.  
  2. **Beyond tool-use**: Unlike calculators, LLMs engage in generative, open-ended tasks where users *internalize the interaction* (e.g., "we reasoned" implies shared agency), actively defending outputs as collaborative achievements.  
  3. **Boundary criteria**:  
     - **Intentional entanglement**: Users consciously blur self/other boundaries ("our analysis"), treating the model as a *participant* in reasoning.  
     - **Bidirectional adaptation**: Humans refine prompts *and* accept conceptual shifts from AI, creating feedback loops absent in scaffolding (e.g., consulting a dictionary).  
     - **Accountability-sharing**: Outputs are defended jointly (e.g., "we concluded"), unlike tools (sole user responsibility) or extended mind (attribution to self).  
  4. **Contrasts**:  
     - *Extended mind*: Fails—no claims of functional parity or constant coupling.  
     - *Distributed cognition*: Too group-focused; here the AI is a non-human agent.  
     - *Scaffolding*: Rejected—scaffolds are static supports (e.g., notes), not adaptive partners.  

  This framework captures the *deliberate, fluid collaboration* where cognition emerges from human-AI negotiation, not integration or mere use.
