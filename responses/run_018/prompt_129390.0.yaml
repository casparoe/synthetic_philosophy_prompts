  ### Exam Prompt: Practical Reasoning Take-Home  
  **Time Allotted:** 90 minutes  
  **Total Marks:** 20  

  **Scenario:**  
  > Ada intends to stop at the grocery store after work. She programs her car’s GPS with this destination. However, her car features an "adaptive routing system" that has learned her habitual commute patterns over months. Recognizing her current location and time of day, the GPS *automatically overrides* her entered destination and reroutes her toward home without alerting her. Ada, distracted by a phone call, fails to notice the override and arrives home, having forgotten the store.  
  >   
  > Contrast this with the classic "absent-minded driver" case (e.g., Bratman): A driver intends to go to the store but, lost in thought, takes her habitual exit home without deliberating.  

  **Question:**  
  Is the error in Ada’s case structurally identical to the classic absent-minded driver’s failure, or does the GPS’s predictive intervention create a fundamentally different kind of practical breakdown? Defend your position by addressing:  
  - Whether the error stems from Ada’s *personal-level reasoning* (e.g., intention, belief, habit) or a *subpersonal/external system* (the GPS).  
  - If the GPS functions as part of an "extended cognitive system," whether this relocates the failure outside Ada’s agency.  
  - Why describing this *only* as "habit" (like the classic case) is inadequate.  

  **Requirements:**  
  - Take a clear stance. Do not merely describe both sides.  
  - Engage the concepts of **personal vs. subpersonal processes** and **extended cognition**.  
  - No external citations needed; use course concepts.  

  ---

  ### Model Answer (Approx. 600 words)  
  The adaptive GPS transforms Ada’s error from a *personal failure of practical reasoning* (as in the classic case) into a *systemic conflict between agency and predictive automation*. This is a structurally distinct breakdown because the GPS operates as a subpersonal/external mechanism that bypasses—rather than expresses—Ada’s agential capacities, relocating the failure outside her deliberative control.  

  In the classic absent-minded driver, the error is personal: a habit (a subpersonal process) directly overrides a conscious intention without engaging deliberation. The driver’s own cognitive architecture produces the slip, making it a failure of *her* practical rationality—specifically, a disconnect between her endorsing "go to store" and her automatic procedural memory executing "go home." Here, habit is *hers*, arising from repeated personal actions.  

  The GPS case differs radically. First, the GPS’s override is not an extension of Ada’s mind but an *external prediction engine* imposing its own behavioral logic. It uses aggregated data (her past behavior) to *anticipate* her "typical" goal, substituting its inference for her declared intention. Unlike habit, this override is not a trace of Ada’s past agency but an algorithmic guess detached from her current mental states. When the GPS reroutes her, it does not express Ada’s subpersonal processes; it *displaces* them. The error thus originates in a subsystem that Ada does not cognitively "own," even if she relies on it. This shifts the failure from *intra*-personal (mind against itself) to *extra*-personal (mind against tool).  

  Second, treating the GPS as "extended cognition" (à la Clark & Chalmers) fails to resolve this. Extended cognition requires functional parity: the GPS must act as a reliable, integrated part of Ada’s cognitive workflow. But here, the GPS *contradicts* her explicit input, functioning as a rogue element. It is not a "trusted notebook" supplementing memory but a system that *actively disputes* her current intention. Thus, if cognition is extended, the error is a *malfunction of the coupled system*, not Ada’s rationality. The breakdown resembles a dispute between personal planning ("store") and an external subpersonal system ("home prediction"), reframing the error as *distributed* rather than individual.  

  Calling this "habit" obscures these stakes. Habit implies an internalized, personal automaticity—a "fast" response shaped by the agent’s history. The GPS’s override is neither internalized nor shaped solely by Ada: it is an external system interpreting her history *for her*. This conflates *descriptive* patterns (the GPS’s data) with *normative* agency (Ada’s commitment to the store). The classic case involves *akrasia* (weakness of will); here, the GPS imposes *alien control*.  

  In conclusion, the GPS creates a distinct error: a *systemic misalignment* between personal intention and external prediction. Unlike the classic driver’s lapse, Ada’s failure exposes how predictive tools can disrupt agency by privileging statistical norms over declared goals. The error lives not in her reasoning but in the unresolved tension between deliberation and automation.  

  ---

  ### Marking Scheme (20 Marks Total)  
  **A Answer (17–20 Marks)** Must Demonstrate:  
  1. **Clear Stance & Structural Contrast**: Explicitly argues the GPS case is distinct (not merely "similar with tech") and roots this in personal/subpersonal separation. (4 marks)  
  2. **GPS as Subpersonal/External Mechanism**: Explains why GPS override is not equivalent to internal habit (e.g., GPS uses *external* data/algorithm; not shaped by Ada’s agency). (4 marks)  
  3. **Extended Cognition Critique**: Engages extended mind theory to show GPS lacks integration/parity (e.g., it *contradicts*, not extends, intention). (4 marks)  
  4. **Habit ≠ GPS**: Directly refutes labeling GPS as "habit" by contrasting internal automaticity vs. external prediction. (3 marks)  
  5. **Locus of Failure**: Identifies error as systemic (agent-tool conflict) rather than agential (e.g., "GPS displaces, not expresses, cognition"). (3 marks)  
  6. **Clarity & Precision**: Structured argument; no filler. (2 marks)  

  **B Answer (12–16 Marks)**:  
  - Correctly describes both cases but **fails to take a stance** or superficially "compares" without analyzing structure.  
  - Treats GPS as "just high-tech habit," missing subpersonal/external distinction.  
  - Mentions extended cognition but doesn’t explain *why* it fails here.  
  - Repeats classic absent-minded driver analysis with GPS as an add-on.  

  **C Answer (7–11 Marks)**:  
  - Summarizes cases without analysis.  
  - Misuses terms (e.g., "GPS is part of her mind").  
  - Ignores personal/subpersonal distinction.  

  **D/F Answer (0–6 Marks)**:  
  - Factually incorrect (e.g., conflates GPS with memory).  
  - No engagement with course concepts.  
  - Unanswered or incoherent.  

  ---  
  **Notes for Grading:**  
  - **A+ (19–20)**: Adds nuance (e.g., "GPS as undermining agential authority").  
  - **Penalize**: Passive description ("some say...others say..."), ignoring the "habit ≠ GPS" directive, or treating the GPS as a neutral tool.  
  - **Reward**: Original framing (e.g., "predictive tech as subpersonal colonization") if coherent.  

  This prompt forces engagement with mind-technology boundaries while avoiding rote memorization. The marking scheme rewards depth on agency/externalism—key to your pedagogical goal. Let me know if you’d like a simplified rubric for TAs!
