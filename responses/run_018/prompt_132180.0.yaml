prompt: |-
  Im marking essays for my philosophy of ethics module and this one has me a bit stuck. The exam question was: 'Outline the situationist critique of global character traits, then discuss whether the modular virtue hypothesis saves virtue ethics or just concedes ground to the situationists.'

  Here is what the student wrote (abridged a bit):

  'The situationist critique, mainly from social psychology, shows that people lack stable global virtues like honesty or courage. In classic experiments people behave kindly in one setting then cruelly in another, which proves character is not consistent. Virtue ethicists think we have broad traits, but the evidence says we only have local behaviours shaped by context. The modular virtue hypothesis was actually proposed by situationists: it says virtues are broken into tiny domain-specific modules, like being honest with friends but not with strangers. Because these modules are still triggered by situations, situationism is vindicated and virtue ethics is defeated. So the modular idea doesnt rescue virtue ethics; it just shows that even local traits depend on context, meaning there are no real virtues at all.'

  Can you help me grade it? I was thinking maybe a low 2:1, but I dont want to be harsh if Im missing something in thier reasoning. Where is the student correct about the critique, and where do they slip? In particular, is it right to say situationists proposed the modular hypothesis? And does thier final step actually follow? Id like point-by-point comments I could put on the script, not just a number.
reasoning: |-
  Okay, I need to help this philosophy professor grade an essay about virtue ethics and the situationist critique. The student's argument is that modular virtues don't save virtue ethics but instead concede to situationism. Let me break this down step by step.

  First, the situationist critique. The student correctly identifies that social psychology experiments (like Milgram or Stanford Prison) show inconsistent behaviors across situations. That's accurate - people don't demonstrate stable global traits. Good start.

  But then they claim "the evidence says we only have local behaviours shaped by context." Here's the first slip - it's an overstatement. The research shows behavioral inconsistency, but doesn't prove no traits exist whatsoever. The student presents it as conclusive when it's actually contested in philosophy.

  Now the modular virtue hypothesis. Big problem here - the student says situationists proposed this. That's factually wrong. It was virtue ethicists like Nancy Snow who developed modular virtues as a response to situationism. The student has the origins backwards, which undermines their argument.

  Their conclusion that modular virtues "vindicate" situationism misses the point. Modularity was meant to show virtues exist in domain-specific ways - not that they don't exist at all. The student conflates contextual dependence with non-existence, ignoring how virtue ethicists argue these modules can still be character traits.

  The final leap that "there are no real virtues at all" doesn't follow. Even if virtues are modular, they could still be real psychological dispositions - just not global ones. The student doesn't engage with how virtue ethicists defend this position.

  Hmm... structural issues too. The essay oversimplifies the debate and misses key nuances. It doesn't address counterarguments or cite philosophers properly. The factual error about modular virtues' origins is particularly damaging.

  For grading, I'm thinking:
  - Strengths: Good grasp of situationist experiments
  - Weaknesses: Misattribution of modular hypothesis, overstatement of evidence, logical leaps
  - Could be a solid 2:2 if this was first-year undergrad, but since it's a specialized module, probably low 2:2/high 3rd

  The professor should point out where the reasoning jumps (local → no virtues) and emphasize that misattribution error. Also suggest engaging with virtue ethicists' actual responses to situationism.
answer: |-
  Here's a point-by-point assessment of the student's essay, highlighting strengths and weaknesses for your feedback. Based on this analysis, **a low 2:2 (or high 3rd class) is more appropriate than a 2:1**, due to significant factual inaccuracies and logical flaws.

  ---

  ### **Strengths of the Essay**
  1.  **Accurate summary of the situationist critique:**  
      ✅ *"The situationist critique... shows that people lack stable global virtues... In classic experiments people behave kindly in one setting then cruelly in another"*  
      **Feedback:** Correctly identifies the core situationist argument (e.g., Milgram, Stanford Prison, Isen & Levin experiments) and its challenge to global character traits. Good grasp of the empirical basis.

  2.  **Clear presentation of modular virtue hypothesis:**  
      ✅ *"virtues are broken into tiny domain-specific modules, like being honest with friends but not with strangers"*  
      **Feedback:** Accurately defines the modular hypothesis as positing context-bound virtues.  

  ---

  ### **Critical Weaknesses & Errors**
  1.  **Incorrect attribution of the modular hypothesis:**  
      ❌ *"The modular virtue hypothesis was actually proposed by situationists"*  
      **Feedback:** **Factually incorrect.** The modular hypothesis was developed *by virtue ethicists* (e.g., Nancy Snow, John Doris) *in response to* situationism. Situationists (e.g., Ross & Nisbett) argue virtues *don’t exist at all*; modularity is a *defense* of virtue ethics. **This misstep undermines the entire argument.**  

  2.  **Overstatement of situationist conclusions:**  
      ❌ *"the evidence says we only have local behaviours shaped by context"*  
      **Feedback:** The situationist evidence shows *inconsistency* in behavior, not that traits are purely "local behaviors." This conflates *descriptive* findings (behavior varies by context) with *ontological* claims (virtues don’t exist). Situationists argue traits are *epiphenomenal*, not merely "local."  

  3.  **Misrepresentation of virtue ethics' response:**  
      ❌ *"Because these modules are still triggered by situations, situationism is vindicated"*  
      **Feedback:** **Logical error.** Modular virtue theorists *agree* that context matters but argue these modules *are still character traits* (e.g., "honesty-with-friends" is a stable disposition in that domain). This doesn’t "vindicate" situationism—it *redefines* virtues to accommodate the evidence.  

  4.  **Non sequitur in the conclusion:**  
      ❌ *"it just shows that even local traits depend on context, meaning there are no real virtues at all"*  
      **Feedback:** **Does not follow.** Modularity claims virtues *are real but context-sensitive*. To conclude "no real virtues exist" assumes virtues *must* be global (which modularists reject). This ignores the core philosophical move: redefining virtue to avoid the situationist critique.  

  5.  **Oversimplification of the debate:**  
      ❌ *"virtue ethics is defeated"*  
      **Feedback:** Ignores nuanced defenses (e.g., Annas' skill model, Swanton's pluralism). Modularity is *one* response; declaring total defeat is unsubstantiated.  

  ---

  ### **Recommended Feedback for the Student**
  > **Overall:** You clearly understand the situationist critique and the basics of modular virtues. However, key errors undermine your argument.  
  > **Specific Points:**  
  > 1.  **Modular origins:** The modular hypothesis was proposed *by virtue ethicists*, not situationists. Situationists reject virtues entirely; modularity aims to *save* virtue ethics by redefining traits.  
  > 2.  **Misreading modularity:** Claiming modular virtues "vindicate" situationists confuses the debate. Modularists argue virtues *exist* as local dispositions; situationists deny dispositions matter at all.  
  > 3.  **Logical leap:** Even if virtues are context-dependent, it doesn’t follow they don’t exist (e.g., "honesty-with-friends" is still a virtue *in that domain*).  
  > 4.  **Engagement gap:** Address *why* virtue ethicists think modularity "saves" their framework (e.g., it preserves character-based explanations without ignoring empirical psychology).  
  > **Focus for improvement:** Distinguish between descriptive (how people act) and normative (what virtues are) claims. Engage with primary sources (e.g., Doris' *Lack of Character* vs. Snow's *Virtue as Social Intelligence*).  

  ---

  ### **Grading Justification**
  - **Strengths:** Clear writing, good grasp of situationism (4/5).  
  - **Weaknesses:** Factual error (modular origins), logical flaws, oversimplification (2/5).  
  - **Result:** A low **2:2 (55-57%)** or high **3rd (48-49%)** depending on institutional standards. The central error (attributing modularity to situationists) and failure to engage with the "saving" aspect of the question are significant flaws. A 2:1 would require accurate representation of both sides and coherent evaluation.  

  **Key takeaway for student:** Philosophy thrives on precise representation of opposing views. Always verify the provenance of theories!
