answer: |-
  ## Wrong-Kind-Reasons in Institutional Waters

  **1. The Scenario and Stakes (120 words)**

  The prestigious Elmwood University tenure committee faces an agonizing case: Dr. Aris Thorne. His research is groundbreaking, his teaching superb, and he is collegial within the department. However, documented evidence reveals he caused severe, lasting harm to individuals outside the university through deliberate, non-academic actions. The committee's charter explicitly lists only "research excellence, teaching effectiveness, and collegiality" as tenure criteria. Dr. Lin argues Thorne’s harmful actions provide *wrong-kind reasons* for denial – irrelevant to tenure's institutional purpose and corrupting the evaluation. Dr. Reyes counters that “wrong-kind reasons” is misapplied here; the issue is solely whether reasons fall *outside the mandate*, a design choice, not a metaphysical distinction about reason-types. This strains the standard individual-level framing (e.g., belief/desire) by shifting focus to collective agency, defined roles, and institutional teleology.

  **2. The Dialogue (650 words)**

  **Dr. Reyes:** Lin, I understand the moral revulsion, but framing Thorne's external actions as supplying "wrong-kind reasons" for tenure denial is a category error. The wrong-kind-reasons problem was forged to untangle reasons that directly *justify* an *attitude* (like believing P because it's true) from reasons that merely give us incentive to *have* that attitude (like believing P because it benefits us). Tenure denial isn't an attitude like belief; it's an institutional action governed by a specific mandate. The *only* relevant question here is: "Does this reason fall within the criteria defined by our institutional purpose?" The charter says no. Calling it "wrong kind" smuggles in the idea that some reasons are inherently alien to *any* evaluation of a professional, which isn't the case.

  **Dr. Lin:** Reyes, you make a sharp distinction, but it doesn’t dissolve the problem. Granting that the mandate defines *admissible* reasons doesn't mean all admissible reasons are of the *right kind* for the *specific evaluative judgment* involved. Tenure evaluation assesses *professional competence and contribution within the academic role*. Thorne's harmful actions, however egregious, are directed at individuals *outside* that role and context. Inviting them in as direct reasons for denying *professional standing* conflates the evaluation of Thorne *as a moral agent* with the evaluation of Thorne *as a professor*. This isn't just "outside the mandate" pragmatically; it operates at the wrong *level of description* for the institutional act of conferring academic tenure. It corrupts the evaluation by applying an alien normative framework – personal moral desert – to a professional institutional judgment.

  **Dr. Reyes:** Your "wrong level" argument presupposes an uncontested, objective account of what the "level of description" for academic tenure *should* be, Lin. But that's precisely what the mandate *defines*. The institution *could* have included "upholding the university's reputation" or "demonstrating good citizenship" as criteria. It didn't, by design. But if it had, would judging Thorne's actions *as a citizen* suddenly become the "right level"? Your claim that considering his actions "corrupts" the evaluation relies on an implicit, independent normative theory about the *true* purpose of tenure – one that trumps the actual, stipulated mandate. Without that independent theory, "wrong level" is just a rhetorical flourish for reasons *you* deem inappropriate. Collective agents like committees don't "believe" in tenure candidates; they act based on rules. The structure that makes "wrong-kind" intelligible for attitudes simply doesn't map cleanly onto rule-governed institutional action.

  **Dr. Lin:** You're conflating the *source* of authority (the mandate) with the *nature* of the reasons it authorizes. The mandate specifies criteria, yes, but those criteria themselves point to a *type* of reason – reasons bearing on scholarly merit and academic community function. Evaluating Thorne's *scholarly merit* involves reasons about his arguments, data, pedagogy, and departmental cooperation. Evaluating his *harm to external individuals* involves reasons about his character and interpersonal conduct in a completely different sphere. The mandate authorizes the former *type* of reason; it doesn't magically transform the latter *type* into the former. Calling them "reasons for tenure denial" under the mandate doesn't change their inherent nature as reasons addressing him *qua* private moral agent, not *qua* academic role-bearer. The "corruption" occurs when we pretend reasons of one kind can directly bear on a judgment designed for another kind, even if the mandate *seems* to allow it by silence. The mandate's silence doesn't legitimize every conceivable reason; it simply fails to explicitly *exclude* them. Applying them remains a category mistake *within* the evaluative logic the mandate *does* establish.

  **Dr. Reyes:** Your appeal to the "inherent nature" of reasons and "evaluative logic" is where I see the metaphysical overreach. Institutions are conventional constructs; their purposes and the "kinds" of reasons relevant to their actions are defined by human agreements and documents, not discovered in the fabric of reality. The mandate *is* the institutional purpose operationalized. If the mandate explicitly *included* "moral character broadly construed," then Thorne's actions would unambiguously supply the *right-kind* of reason *for this institution's tenure decision*. The fact that it doesn't include it means they are *invalid* reasons *for this committee* – not because they are inherently the "wrong kind" for evaluating a professor in some cosmic sense, but because they are *ultra vires*. Framing it as a "wrong-kind-reasons" problem risks turning a contingent design choice about role boundaries ("We, Elmwood, only care about X, Y, Z in this decision") into an assertion about the essential ontology of reasons relevant to professorial evaluation ("Reasons about external moral character are *metaphysically* incapable of bearing on professorial standing"). The latter is what I reject.

  **3. The Unresolved Crux (180 words)**

  The core, unresolved disagreement is **substantive** and hinges on divergent conceptions of institutional purpose and the nature of reasons within collective agency:

  1.  **Lin's View:** Institutional purposes have an objective, internal logic that defines the *kind* of reasons appropriate for specific institutional judgments, independent of explicit mandate wording. Reasons must cohere with the *implicit evaluative type* (e.g., professional competence) inherent in the act (e.g., granting tenure), even if not excluded. Importing reasons of an alien type (e.g., general moral character) constitutes a "wrong-kind" error, corrupting the judgment’s integrity.
  2.  **Reyes' View:** Institutional purposes are entirely constituted by their defining mandates/rules (conventionalism). The *only* relevant distinction is whether a reason is authorized or prohibited by the mandate ("*ultra vires*" or not). The "wrong-kind-reasons" framework, rooted in individual attitude-justification, is inapplicable to rule-based collective action. Labeling reasons "wrong kind" in this context falsely attributes a metaphysical property to them based on a contestable interpretation of institutional teleology.

  **Resolution requires:** Agreeing on a meta-theory of institutions. Does institutional purpose have an objective normative structure limiting admissible reasons beyond explicit rules (Lin), or is it exhaustively defined by contingent mandates, making all mandate-compliant reasons inherently "right kind" *for that institution* (Reyes)? Addressing this requires engaging with the philosophy of collective intentionality and whether institutions possess a "point" or "logic" that transcends their written statutes.
