answer: |-
  Your observation identifies a sophisticated epistemic maneuver that sits at the intersection of formal epistemology, social psychology, and philosophy of science. While no single term fully captures this pattern, it can be precisely characterized as **Convergence-Protective Residualization (CPR)**—a dialectical strategy that preserves the *principle of rational convergence* by retrojecting unexplained disagreement into an unobservable residual category (e.g., "priors," "weights," or "values") that is defined circularly by the disagreement itself.

  ### Core Mechanism & Definition
  - **CPR**: The post-hoc introduction of an unmeasurable, contentless prior divergence (epistemic, axiological, or methodological) to explain away failures of belief convergence, thereby insulating the convergence norm from falsification. The "prior" has no independent empirical grounding and derives its entire substance from the outcome it purportedly explains.
  - **Key Features**:
    1. **Residual Category**: The posited prior functions as an unfalsifiable explanatory sinkhole.
    2. **Retrojective Circularity**: The prior’s content is inferred *from* the disagreement (e.g., "Team A favors simplicity because they concluded X").
    3. **Immunization Strategy**: Protects the convergence principle by converting counterexamples into confirmations of hidden diversity.

  ### Distinction from Nearby Fallacies
  | **Fallacy**          | **Relation to CPR**                                                                 | **Distinction**                                                                 |
  |----------------------|-------------------------------------------------------------------------------------|---------------------------------------------------------------------------------|
  | **Ad Hoc Hypothesis** | CPR is a *subset* of ad hoc reasoning.                                              | Generic ad hoc hypotheses need not target convergence norms or use *priors* as the residual. CPR is domain-specific and structurally circular. |
  | **Motte-and-Bailey** | CPR can be a *tactic* within it (e.g., retreating to "priors" when convergence fails). | Motte-and-bailey involves shifting between defensible/indefensible claims. CPR focuses solely on preserving convergence via residual priors. |
  | **Confirmation Bias**| CPR is *motivated by* confirmation of the convergence norm.                         | Confirmation bias is broader; CPR is its institutionalized dialectical form in rationalist frameworks. |
  | **Begging the Question** | CPR *contains* circularity (disagreement proves prior difference).               | CPR’s circularity is *explanatory* (not logical), masking itself as Bayesian updating. |
  | **Reification Fallacy** | CPR *reifies* the disagreement into a "prior."                                    | Reification alone doesn’t target convergence; CPR uses reification defensively. |

  ### Boundary Conditions: Legitimate vs. Abusive CPR
  CPR becomes abusive when it violates **falsifiability** and **independence criteria**:

  | **Criterion**         | **Legitimate Prior Reconstruction**                          | **Abusive CPR**                                   |
  |-----------------------|-------------------------------------------------------------|--------------------------------------------------|
  | **Measurability**     | Prior can be independently operationalized (e.g., preregistered models, validated preference elicitation). | Prior is only definable *post-hoc* via the disagreement (e.g., Case 2’s "tail risk prior" inferred solely from policy stance). |
  | **Non-Circularity**   | Prior is justified by evidence *extrinsic* to the disagreement (e.g., past publications, experiments). | Prior’s sole evidence is the disagreement it explains (e.g., Case 1’s "background weights" with no pre-disagreement documentation). |
  | **Predictive Power**  | Prior explains *other* disagreements or predicts new ones.  | Prior has no explanatory power beyond the immediate disagreement. |
  | **Epistemic Cost**    | Admits convergence failure if no prior difference is found. | Denies convergence failure is possible; disagreement *always* implies hidden prior. |

  ### Contrasting Cases
  **Legitimate Borderline Case**:  
  Two Bayesian researchers dispute a climate model’s sensitivity. *Before* analyzing new data, they publicly specify priors (e.g., "Researcher A: Cauchy distribution centered on 3°C; Researcher B: Normal distribution on 4.5°C"). After divergence, they attribute differences to these *preregistered* priors. **This is valid**: Priors are measurable, non-circular, and falsifiable (e.g., if both used identical priors but diverged, convergence would genuinely fail).

  **Abusive Borderline Case**:  
  Two economists using identical DSGE models disagree on inflation forecasts. Defenders assert "different subjective priors on Phillips curve rigidity." When challenged, they cite no pre-disagreement evidence but claim the divergence itself *reveals* the priors. **This is CPR**: The "prior" is a phantom residual, defined only by the outcome.

  ### Established Terminology & Coined Term
  - **Partial Matches**:  
    - *Explanatory Gerrymandering* (Tetlock): Adjusting explanations to protect sacred values.  
    - *Divergence Absorption* (Egan & Elga): Formal Bayesian strategies absorbing disagreement into priors.  
    - *Pseudo-Bayesian Immunization* (Hájek): Using Bayesian formalism to evade falsification.  
  - **Coined Term**: **Convergence-Protective Residualization (CPR)**  
    *Definition*: *The dialectical practice of attributing failures of rational belief convergence to unspecified, unmeasurable prior differences, where the content of these priors is retrojected solely from the observed disagreement, rendering the convergence norm unfalsifiable.*

  ### Why This Matters
  CPR is epistemically corrosive because it:  
  1. **Conflates Rationality with Conformity**: Implies dissent *must* stem from hidden irrationality.  
  2. **Stifles Metacognition**: Prevents scrutiny of whether shared evidence *should* yield convergence (e.g., underdetermination in Case 1).  
  3. **Enables Elite Capture**: Experts can dismiss challenges as "priors" rather than engaging critiques.  

  Your cases exemplify how CPR transforms the convergence principle from a *normative ideal* into a *tautology*—a pattern endemic in fields where formal rationality is weaponized against epistemological uncertainty. Naming it (*CPR*) is the first step to disarm it.
