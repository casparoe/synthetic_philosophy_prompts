prompt: |-
  Having spent my career in experimental physics and only recently begun studying philosophy in retirement, I am struck by institutional practices that seem to carry hidden theoretical baggage. One puzzling case is the design of the post-war international military tribunals convened at Nuremberg and Tokyo: these courts were constituted solely by judges appointed by the Allied powers, applied legal categories—such as crimes against peace and crimes against humanity—that lacked clear basis in the positive international or domestic law binding the defendants when the acts occurred, and rejected the defense of superior orders while declining to examine comparable Allied conduct, including strategic bombing and ongoing colonial occupation. A further asymmetry rarely emphasized is that the Tokyo bench included representatives of European colonial powers—Britain, France, and the Netherlands—whose own imperial presence in Asia went unscrutinized even as Japanese territorial expansion was prosecuted as criminal aggression, and the tribunals derived authority not from any pre-existing international legislature but from the victors’ joint declaration, yet presented their judgments as applications of universal moral-legal principles rather than as impositions of victors’ will.

  What implicit theory of law and moral responsibility must such an institutional arrangement presuppose? Does it require a natural-law commitment that certain acts are inherently criminal regardless of enacted statute, or can a modified legal positivism accommodate retroactive punishment once sovereignty has collapsed? And what conception of political legitimacy permits a court composed exclusively of victorious and, in some cases, colonial powers to claim impartial jurisdiction over defeated enemies without undermining its own authority? Please reconstruct the philosophical commitments that make this practice coherent, distinguish those that are strictly necessary from those that merely fit well with it, and indicate where the institutional design is philosophically underdetermined—compatible with rival theories of justice, sovereignty, and legal morality.

  Please present your answer as a numbered list of exactly five items. Each item should be one or two sentences. Do not include an introduction or a conclusion.
reasoning: |-
  Hmm, the user is an experimental physicist who's recently started studying philosophy in retirement. They're puzzled by the design of post-war international military tribunals like Nuremberg and Tokyo, pointing out several asymmetries: judges only from Allied powers, retroactive application of laws like crimes against humanity, rejection of superior orders defense without examining Allied conduct, and colonial representation without scrutiny of their empires. They want me to reconstruct the philosophical commitments behind this institutional arrangement.

  The user is asking about the implicit theory of law and moral responsibility presupposed by these tribunals. They specifically want to know if it requires natural law or if modified legal positivism could accommodate it, and what conception of political legitimacy allows victors to claim impartial jurisdiction. They need a numbered list of exactly five items—no introduction or conclusion—each item one or two sentences, covering necessary commitments, compatible theories, and underdetermined aspects.

  I recall that the tribunals were justified partly by the idea that some acts are inherently wrong, which leans toward natural law. For example, crimes against humanity were treated as universal moral violations, regardless of existing statutes. But modified legal positivism might work if we see the victors' declaration as creating new law through their sovereignty after the collapse of the Axis regimes.

  On legitimacy, the tribunals claimed impartiality based on representing civilization, but this is tricky because it ignores the victors' own conduct. This could be seen as a sovereignty-based view where winners set the rules, or perhaps a transitional justice approach that prioritizes accountability over strict consistency.

  I need to identify what's strictly necessary versus what fits well. Core commitments include a rejection of strict positivism for retroactive crimes and some basis for victors' authority. Compatibility with rival theories exists in areas like sovereignty—where power transfers might justify the courts—or in moral responsibility, where different theories could explain why superior orders aren't a full defense. The design is underdetermined in how it handles impartiality and universality, allowing for interpretations from natural law to power-based realism.

  Finally, I'll structure the response as five clear, concise items focusing on: law's nature (natural vs. modified positivism), moral responsibility, legitimacy, necessary elements, and underdetermined aspects. This covers the user's request while staying philosophical and neutral.
answer: |-
  Here is the numbered list:

  1.  The arrangement presupposes a non-strict legal positivism or natural law foundation, where certain atrocities (like crimes against humanity) are deemed inherently criminal and punishable *ex post facto*, rejecting the positivist requirement of pre-existing positive law as the sole source of criminality for core offenses.
  2.  It assumes a conception of individual moral responsibility that transcends the defense of superior orders, holding leaders and executors accountable for violating fundamental moral norms even within a chain of command, implicitly prioritizing universal moral agency over strict obedience to state authority.
  3.  The legitimacy claim rests on a victor's sovereignty theory blended with a universalist assertion: the victors, acting as proxies for the "civilized world" or enforcing pre-existing (if unwritten) natural law, possess the *de facto* authority and moral standing to establish jurisdiction and define crimes, bypassing traditional requirements for neutral adjudication or defendant-state consent.
  4.  Strictly necessary commitments are: the rejection of strict legal positivism concerning core atrocities (permitting retroactivity for crimes against humanity/peace) and the victors' assertion of *de facto* jurisdiction based on conquest; commitments like the specific universalist framing or the refusal to examine Allied conduct are congruent but not logically indispensable.
  5.  The design is philosophically underdetermined regarding the precise source of universal norms (natural law vs. emergent customary law) and the basis for victor legitimacy (might-makes-right realism vs. transitional justice exceptionalism), making it compatible with rival theories of justice and sovereignty that accept exceptional retroactive jurisdiction for extreme crimes following regime collapse.
