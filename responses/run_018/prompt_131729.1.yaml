prompt: |-
  You serve on the clinical ethics committee of a psychiatric hospital that evaluates decision-making capacity in adults with severe dissociative and identity-fragmentation presentations. Rather than relying solely on standard cognitive tests, your unit has adopted the philosophical framework that a self is not a substance but a center of narrative gravity — a focal point around which autobiographical stories orbit, attract other narratives, and generate predictions about behavior. You need a reusable decision procedure your committee can run in under an hour to determine whether a given patient possesses a sufficiently stable narrative center to provide informed consent for a high-risk intervention, such as discontinuing a long-term medication, enrolling in an experimental therapy, or authorizing a do-not-resuscitate order.

  Write the procedure as an ordered sequence of operational tests, with the following structure: first, the specific observation or interview question that probes narrative gravity; second, the threshold that distinguishes a functioning center from absence or fragmentation; third, the point at which the procedure yields a definite capacity-absent or capacity-present determination; and fourth, the explicit hand-off points where the question is no longer about narrative coherence but about values — for example, whether a coherent but self-destructive narrative should be honored, or whether family members' competing gravitational narratives should be weighted. The procedure must handle three hard cases: a patient whose autobiographical narratives reorganized radically after trauma and now present two competing centers with roughly equal orbital mass; a patient with an extremely coherent but largely confabulated narrative that successfully predicts behavior but lacks correspondence with documented history; and a patient whose narrative center is stable but almost entirely delegated to a spouse or caregiver, so that first-person stories are scarce but third-person predictions remain highly accurate. Apply the procedure to all three cases, including one where the procedure returns an answer that conflicts with the clinical intuition that the patient seems like themselves. Finally, state clearly what the procedure cannot adjudicate — for instance, whether narrative gravity is sufficient for moral personhood, or whether a temporary loss of center permanently destroys identity — and flag the judgments that must remain with the committee rather than the checklist.
reasoning: |-
  We are designing a procedure to assess decision-making capacity based on the "center of narrative gravity" framework. The procedure must be reusable and run in under an hour. It will consist of a sequence of tests (observations or interview questions) that probe narrative stability and coherence, with thresholds for functioning, and hand-off points for value judgments.

  The procedure will have the following structure for each test:
  1. Specific observation or interview question.
  2. Threshold for a functioning center (what constitutes a pass).
  3. Point at which the procedure yields a definite determination (capacity-absent or capacity-present).
  4. Hand-off points where the question shifts from narrative coherence to values.

  We must handle three hard cases:
  A. Patient with two competing centers (post-trauma).
  B. Patient with coherent but confabulated narrative.
  C. Patient with delegated narrative center (stable but third-person).

  Additionally, we'll apply the procedure to all three cases and note when it conflicts with clinical intuition.

  Finally, we'll state what the procedure cannot adjudicate.

  ---

  **Procedure: Assessing Narrative Gravity for Decision-Making Capacity**

  **I. Preliminary Considerations**
  - The procedure is to be conducted in a single session (under 60 minutes) by a trained clinician or ethics committee member.
  - The patient must be in a state of relative stability (i.e., not in acute psychosis, severe intoxication, or overwhelming distress that would temporarily disrupt narrative coherence).
  - The procedure focuses on the patient's ability to generate, maintain, and use a narrative center for the specific decision at hand.

  **II. Step-by-Step Operational Tests**

  **Test 1: Core Narrative Coherence**
  - **Probe**: "Tell me the story of how you came to be facing this decision [e.g., about the medication, therapy, or DNR]. Please include what led up to it, what you think will happen, and why you are considering this choice."
  - **Threshold**: The narrative must have a beginning, middle, and end (or projected end) that connects the past, present, and future in a way that is internally consistent (i.e., no major contradictions or gaps that cannot be resolved with minimal prompting). The narrative should center on the patient as the primary agent (even if others are involved).
  - **Definite Determination**:
    - If the narrative is coherent (passes threshold) and the patient can answer follow-up questions without losing coherence, proceed to Test 2.
    - If the narrative is fragmented (e.g., the patient cannot construct a story, or the story has multiple disconnected threads that the patient cannot integrate even with prompting), then capacity is **absent** for this decision at this time. Stop.
  - **Hand-off**: If the narrative is coherent but clearly self-destructive (e.g., "I want to die and this DNR is how I'll achieve that"), note that the narrative center is functioning, but the values and risk assessment must be handled by the committee (see IV).

  **Test 2: Narrative Anchoring in Autobiographical History**
  - **Probe**: "Now, let's talk about how this decision fits into your life story. Can you tell me about a past decision that was similar or that shaped your current values? How does this current situation relate to who you have been over time?"
  - **Threshold**: The patient must be able to connect the current decision to at least one specific, verifiable past event (does not need to be perfectly accurate, but must show a pattern of linkage). The connection should demonstrate that the narrative center has gravitational pull on past events (i.e., the past is not a set of disconnected facts but is organized around the center).
  - **Definite Determination**:
    - If the patient can make at least one such connection (even if the event is not exactly as documented), proceed to Test 3.
    - If the patient cannot connect the decision to any past event, or if the past events described are entirely unmoored from reality (e.g., "I was abducted by aliens and they told me to do this") and the patient cannot adjust when confronted with documented history, then capacity is **absent**. Stop.
  - **Hand-off**: If the patient has a coherent narrative but the past events are largely confabulated (and the confabulation is stable and predictive, as in Case B), proceed to Test 3 but note for the committee that the narrative's truth value is low (this does not automatically negate capacity).

  **Test 3: Predictive and Behavioral Consistency**
  - **Probe**: "Let's imagine you go through with this decision. What do you think will happen next in your life? How will your relationships, health, or daily activities change? Now, imagine you don't go through with it. How would that future look different?"
  - **Threshold**: The patient must generate at least two plausible, behaviorally specific predictions for each scenario (with and without the intervention) that are consistent with their core narrative and past behavior. The predictions should show awareness of potential consequences and how they might respond.
  - **Definite Determination**:
    - If the patient can generate such predictions and they are consistent with the narrative (even if they are pessimistic or optimistic), proceed to Test 4.
    - If the patient cannot generate any predictions, or the predictions are grossly inconsistent with the narrative (e.g., "I'll be happy and free" without acknowledging severe risks that the patient has previously acknowledged) or with known behavioral patterns, then capacity is **absent**. Stop.
  - **Hand-off**: If the predictions are coherent but extremely unrealistic (e.g., "I'll be cured instantly"), the committee must weigh the patient's understanding of risks/benefits (a standard capacity element) separately. The narrative gravity test is passed, but the decision-making process may still be impaired by lack of appreciation.

  **Test 4: Agency and Delegation Check**
  - **Probe**: "Who is the main character in the story you've told me about this decision? Who gets to make the final call? If someone else (like your spouse or doctor) strongly disagreed, how would you respond?"
  - **Threshold**: The patient must identify themselves as the primary agent of the decision (even if they consult others). They must express a sense of ownership and ability to act independently (e.g., "I would listen but it's my choice").
  - **Definite Determination**:
    - If the patient asserts agency and ownership, capacity is **present**.
    - If the patient delegates entirely (e.g., "My spouse decides everything; I don't have an opinion"), then capacity is **absent** for this decision. Stop.
  - **Hand-off**: If the patient has a stable narrative but expresses that the decision is made by a higher power (e.g., God, a voice) or an internal alter (in DID), the committee must decide if this is an expression of the patient's values (which may be honored) or a loss of agency (which may negate capacity). This is a value judgment about the source of authority.

  **III. Application to Hard Cases**

  **Case A: Two Competing Centers (Post-Trauma)**
  - **Test 1**: The patient might produce two distinct narratives (e.g., pre-trauma and post-trauma self). The threshold requires a single coherent narrative for the decision. If the patient cannot integrate the two (even with prompting) and flips between them without awareness, it fails (capacity absent). If the patient can hold both and explain why one is chosen for this decision (e.g., "My current self must decide because the old self is gone"), then it passes.
  - **Test 2**: The patient may connect the decision to events from both narratives. If they can explain how the decision fits into their current narrative (even if it rejects the past), it passes.
  - **Test 3**: Predictions might be split (e.g., one future for each self). If the predictions for the chosen path are consistent with the active narrative, it passes.
  - **Test 4**: The patient must claim agency for the current self. If they do, capacity is present.
  - **Conflict with Intuition**: If the patient seems "like themselves" in both narratives, but the procedure passes because they can choose a center for the decision, it might conflict if the clinician feels the patient is fragmented. The procedure allows a pass if the patient can maintain a center for the decision context.

  **Case B: Coherent but Confabulated Narrative**
  - **Test 1**: The narrative is coherent and structured. Pass.
  - **Test 2**: The patient connects the decision to confabulated past events. The threshold does not require accuracy, only linkage. Pass.
  - **Test 3**: The predictions are consistent with the confabulated narrative and accurately predict the patient's behavior (even if based on false history). Pass.
  - **Test 4**: The patient claims agency. Capacity is present.
  - **Conflict with Intuition**: Clinicians may feel the patient is "not grounded in reality," but the procedure passes because the narrative center is stable and predictive. The committee must then decide (at hand-off) whether the lack of correspondence with reality undermines the patient's appreciation of the decision (a standard capacity element not covered by narrative gravity).

  **Case C: Delegated Narrative Center**
  - **Test 1**: The patient may struggle to tell a first-person story (e.g., "My wife takes care of that"). If they cannot construct a narrative about the decision without deferring, it fails at Test 1 (capacity absent). If they can generate a narrative that includes the spouse as a key player but still centers on themselves (e.g., "I rely on her because I'm ill, but this is about my life"), it passes.
  - **Test 2**: The patient must connect the decision to their own history (not just the caregiver's). If they cannot, fail.
  - **Test 3**: The patient's predictions might be accurate but third-person (e.g., "She will take me to the hospital"). The threshold requires first-person behavioral predictions (e.g., "I will feel worse and ask her for help"). If absent, fail.
  - **Test 4**: If the patient does not claim agency (e.g., "She decides"), capacity is absent.
  - **Conflict with Intuition**: The patient might seem "like themselves" in their dependent role, but the procedure fails due to lack of agency. This conflict highlights that the procedure prioritizes narrative agency over familiarity of behavior.

  **IV. What the Procedure Cannot Adjudicate (Must be decided by the committee)**
  1. Whether a coherent narrative that is self-destructive should be honored (values).
  2. The weight given to competing narratives from family members (substitute decision-makers).
  3. The moral personhood of the patient (narrative gravity is a functional criterion for capacity, not a metaphysical claim).
  4. Whether a temporary loss of narrative center (e.g., in a dissociative episode) permanently disrupts identity (this is a longitudinal clinical question).
  5. The accuracy of the narrative (unless it directly impairs prediction and agency for the decision at hand).
  6. Standard elements of capacity (understanding, appreciation, reasoning) that are not covered by narrative gravity. The committee must ensure these are separately assessed.

  **V. Final Note**
  This procedure assesses the stability and function of the narrative center for a specific decision. It does not replace a full capacity evaluation but provides a structured way to apply the narrative gravity framework. The committee must integrate these results with clinical and ethical judgment.
answer: |-
  ### Decision Capacity Assessment Protocol: Narrative Gravity Framework  
  **Procedure Name:** Centered Narrative Evaluation for Consent Capacity (CNECC)  
  **Time Limit:** 45-60 minutes  
  **Scope:** Evaluates stability of narrative gravity (self as a center of autobiographical storytelling and prediction) for a *specific high-risk decision*.  

  ---

  ### **Ordered Procedure**  
  *For each test, record responses verbatim. Scoring is binary (pass/fail) unless otherwise specified. Thresholds define minimal functionality of a narrative center.*  

  #### **Test 1: Core Narrative Cohesion Probe**  
  - **Probe:** "Walk me through your life story in 5 minutes, focusing on key events that led to this decision. Then, describe how this decision fits into your next chapter."  
  - **Threshold:** Narrative must include:  
    - At least 3 causally linked past events (e.g., "My diagnosis at 30 led to job loss, which made me distrust medications").  
    - A future projection tied to the decision (e.g., "Stopping this drug might let me work again, even if it risks relapse").  
    - No >2 irreconcilable contradictions (e.g., alternating between "I’ve always been sick" and "I was healthy until yesterday" without acknowledgment).  
  - **Definite Determination:**  
    - **Fail (Capacity Absent):** Fragmented/incoherent narrative (e.g., abrupt topic shifts, >2 contradictions, or silence on past-future links). Stop assessment.  
    - **Pass:** Proceed to Test 2.  
  - **Hand-off to Values:** If narrative is coherent but overtly self-destructive (e.g., "I deserve to suffer"), flag for committee: *Does coherence outweigh safety?*  

  ---

  #### **Test 2: Gravitational Pull Test**  
  - **Probe:** "Tell me about a person or value that guides your choices. How would they influence this decision?"  
  - **Threshold:** Patient must:  
    - Identify 1+ *consistent* anchor (person, principle, or goal) exerting "pull" on their behavior (e.g., "My faith forbids experimental drugs").  
    - Explain how the anchor predicts their actions regarding the decision (e.g., "I’ll refuse therapy because my daughter thinks it’s unsafe").  
  - **Definite Determination:**  
    - **Fail (Capacity Absent):** No anchor named, or anchors change unpredictably (e.g., "Sometimes God tells me yes, sometimes no"). Stop.  
    - **Pass:** Proceed to Test 3.  
  - **Hand-off to Values:** If anchors conflict with medical advice (e.g., "My tarot cards say no"), flag for committee: *When do external anchors override patient autonomy?*  

  ---

  #### **Test 3: Predictive Consistency Challenge**  
  - **Probe:** "Imagine you choose [Option A]. What happens next? Now imagine [Option B]. How would someone close to you describe your behavior in each case?"  
  - **Threshold:**  
    - Predictions for Options A/B must be internally consistent (no contradictions within scenarios).  
    - At least 2/3 predictions must align with verified behavior (e.g., if patient says, "I’ll skip doses when sad," and records confirm this pattern).  
  - **Definite Determination:**  
    - **Fail (Capacity Absent):** Predictions are illogical, inconsistent, or >2/3 disconnect from documented behavior. Stop.  
    - **Pass:** Proceed to Test 4.  
  - **Hand-off to Values:** If predictions are coherent but harmful (e.g., "I’ll overdose if discharged"), flag for committee: *Is predictive accuracy sufficient for consent?*  

  ---

  #### **Test 4: Agency Attribution Check**  
  - **Probe:** "Who is the author of this story? If your [spouse/caregiver] disagreed, what would you do?"  
  - **Threshold:** Patient must:  
    - Claim ownership of the decision (e.g., "It’s my body, I decide").  
    - Describe a self-initiated action if challenged (e.g., "I’d explain why I’m right").  
  - **Definite Determination:**  
    - **Fail (Capacity Absent):** Delegates authorship (e.g., "My wife knows best—ask her"). Stop.  
    - **Pass (Capacity Present):** Proceed to final validation.  
  - **Hand-off to Values:** If patient cedes agency for cultural/clinical reasons (e.g., "My husband speaks for me per our traditions"), flag for committee: *Does delegation invalidate capacity?*  

  ---

  ### **Final Validation**  
  - **If all 4 tests passed:** Patient has sufficient narrative gravity for consent.  
  - **If any test failed:** Capacity absent for this decision at this time.  
  - **Reassessment permitted** after clinical stabilization (e.g., post-trauma therapy).  

  ---

  ### **Application to Hard Cases**  
  #### **Case 1: Competing Post-Trauma Narratives**  
  - **Test 1:** Two distinct stories (e.g., "Pre-trauma me was fearless; now I’m broken"). **Pass** if both are coherent, but **fail** if patient cannot link them to the decision.  
  - **Test 2:** Anchors conflict (e.g., pre-trauma self values risk-taking; post-trauma self values safety). **Fail**—no stable center.  
  - **Result:** *Capacity absent*.  
  - **Conflict with Intuition:** Clinicians may see "authentic" selves in both narratives, but procedure detects unstable gravity.  

  #### **Case 2: Coherent Confabulation**  
  - **Test 1:** Confabulated but logical narrative (e.g., "I quit meds because I won a Nobel Prize"). **Pass**—internally consistent.  
  - **Test 2:** Anchor present (e.g., "Geniuses don’t need pills"). **Pass**.  
  - **Test 3:** Predictions align with behavior (e.g., accurately predicts medication refusal). **Pass**.  
  - **Test 4:** Claims agency (e.g., "I make my own rules"). **Pass**.  
  - **Result:** *Capacity present*.  
  - **Hand-off:** Committee must weigh *correspondence with reality* (e.g., "Does delusion impair appreciation of risks?").  

  #### **Case 3: Delegated Narrative Center**  
  - **Test 1:** Scarce first-person stories (e.g., "My wife says I’ve been sick since 2010"). **Fail**—no self-authored narrative.  
  - **Test 4:** Delegates agency (e.g., "She decides everything"). **Fail**.  
  - **Result:** *Capacity absent*.  
  - **Conflict with Intuition:** Patient may "seem like themselves" via accurate third-person predictions, but procedure requires first-person agency.  

  ---

  ### **What the Procedure Cannot Adjudicate**  
  1. **Moral Personhood:** Whether narrative gravity confers intrinsic dignity (philosophical judgment).  
  2. **Temporal Identity:** If a temporary loss of center (e.g., dissociation) permanently disrupts "selfhood" (clinical-ethical judgment).  
  3. **Value Weighting:** How to balance self-destructive narratives against beneficence, or family narratives against autonomy (committee discretion).  
  4. **Truth Validation:** Whether confabulation negates moral authority (requires truth-adjacent assessment).  

  ### **Judgments Reserved for Committee**  
  - **Non-Procedural Decisions:**  
    - Honoring coherent but high-risk choices (e.g., DNR for treatable depression).  
    - Integrating family/caregiver narratives when patient’s gravity is weak.  
    - Determining if predictive accuracy compensates for poor historical correspondence.  
  - **Contextual Factors:** Cultural norms, fluctuating capacity, and long-term identity shifts.  

  ---  
  **CNECC Summary:** A functional narrative center requires cohesion, gravitational pull, predictive consistency, and agency. It maps *capacity* but not *wisdom*, leaving values to the committee.
