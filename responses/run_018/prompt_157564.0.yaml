  Empirical constraints include preference instability in dementia, adaptation phenomena, and psychiatric distortions. The theory must acknowledge these without collapsing into best-interests calculus. That means incorporating mechanisms like time-based decay or value-tracking while maintaining directive authority as default.

  For desideratum ranking, the authority/evidence distinction is probably the most fundamental. It alone excludes precedent autonomy (which collapses authority into evidence) and substituted judgment (which does the reverse). Among non-negotiables, this distinction plus the refusal/demand asymmetry and the treatment of dementia contentment cases seem essential. Value/taste distinction could be relaxed if absolutely necessary.

