answer: |-
  Here is the full specification of desiderata for a theory of the moral authority of advance directives covering dementia, brain injury, and progressive psychiatric illness:

  **I. Phenomena the Theory Must Accommodate & Required Normative Results:**

  1.  **Classic Refusal Cases:**
      *   **Phenomenon:** Directive (e.g., refusing ANH) issued competently. Patient now has severe dementia, is content, enjoys simple interactions. Medical team believes intervention is beneficial *now*.
      *   **Required Result:** The directive **MUST** be honored, overriding current contentment and perceived benefit.
      *   **Why Required:** To protect the prior self's right to avoid a state of existence they deemed profoundly undesirable/undignified, preventing the instrumentalization of their current contentment to justify overriding their explicit, competent refusal of a specific intervention in this specific state. Failure here renders directives meaningless against the most common challenge.

  2.  **Psychiatric Advance Directives (PADs) Refusing Treatment:**
      *   **Phenomenon:** Directive refusing antipsychotics issued during competence. Patient now in acute psychosis, posing safety risk to self/others, seemingly wanting/needing medication.
      *   **Required Result:** The directive **MUST** be honored (barring specific statutory overrides like imminent danger clauses), overriding the later self's perceived needs/wants *during psychosis*.
      *   **Why Required:** To respect the prior self's competent judgment that the treatment's side effects or the experience of forced treatment in psychosis is worse than the risks of psychosis itself, and to prevent the distortion caused by the acute illness from invalidating the directive precisely when needed. Honoring only when the patient "agrees" eviscerates PADs.

  3.  **Long-Dormant Conflicting Directives:**
      *   **Phenomenon:** Directive drafted decades prior conflicts with preferences consistently expressed while still competent but shortly before losing capacity (e.g., directive at 40 refuses dialysis if demented; at 75, mildly impaired but still competent, expresses desire for all life-prolonging measures).
      *   **Required Result:** The **later competent expressions MUST override the older directive**.
      *   **Why Required:** To respect the patient's most recent competent expressions of will, acknowledging autonomy as a continuing process. A theory binding someone to a decades-old document over their more recent competent wishes disrespects their capacity for growth and change while competent.

  4.  **Directives Demanding Aggressive Intervention:**
      *   **Phenomenon:** Directive mandates maximal life-prolonging treatment (e.g., full code, long-term ventilation) even in states of profound dementia or minimal consciousness.
      *   **Required Result:** The directive **MAY** be overridden if fulfilling it requires scarce resources, imposes disproportionate burdens on caregivers/staff, or violates standard medical ethics/feasibility, even if the patient could pay. It does *not* create an absolute obligation equivalent to a refusal.
      *   **Why Required:** Demands for resource-intensive treatment impose positive obligations on others (providers, society) that refusals do not. Resource constraints, professional integrity (e.g., against futile treatment), and disproportionate burden create valid countervailing reasons absent in refusal cases, preventing demands from having absolute authority.

  **II. Distinctions the Theory Must Preserve Without Collapse:**

  1.  **Directive Authority vs. Evidential Weight:**
      *   **Distinction:** The directive's force *as a binding instruction* vs. its value *as evidence* about the patient's likely preferences/values *alongside* other evidence (e.g., past conversations).
      *   **Case/Reason:** A theory collapsing authority into mere evidence (like some substituted judgment views) fails Phenomenon 1 & 2 – the directive can always be outweighed by current interests or reinterpreted evidence. A theory collapsing evidence into authority (rigid precedent autonomy) fails Phenomenon 3 – it ignores more recent competent evidence conflicting with the directive.

  2.  **Authority to Refuse vs. Authority to Demand:**
      *   **Distinction:** The moral standing to bind others to *withhold* intervention vs. the standing to bind others to *provide* intervention.
      *   **Case/Reason:** Phenomenon 4 demonstrates this asymmetry. Refusals primarily constrain others from acting upon the patient; demands require others to act, expending resources and effort, potentially against professional judgment or fairness to others. A theory granting equal authority ignores the differing impacts on others' duties and rights.

  3.  **Change in Values vs. Change in Taste:**
      *   **Distinction:** A fundamental shift in core values/convictions relevant to treatment decisions (e.g., religious conversion, philosophical reassessment of "a life worth living") vs. a mere change in preference or enjoyment level not reflecting core values (e.g., no longer liking chocolate ice cream, enjoying simple activities they previously scorned).
      *   **Case/Reason:** Phenomenon 1 & 3. A profound value change *while competent* (Phenomenon 3) should undermine an older directive's authority. Mere changes in enjoyment or ability *due to incompetence* (Phenomenon 1, contented dementia) should *not* undermine the directive's authority, as they don't reflect a competent reassessment of core values. Collapsing these allows current experience to override prior values too easily.

  4.  **Incompetence Extinguishing Autonomy vs. Incompetence Making Autonomy Unreliable:**
      *   **Distinction:** Incompetence that completely negates the capacity for any autonomous choice (e.g., advanced dementia, profound delirium) vs. incompetence where the patient expresses clear, persistent preferences, but their judgment is impaired/unstable (e.g., some psychotic states, moderate dementia with fluctuating awareness).
      *   **Case/Reason:** Phenomenon 2 & Best Interests. In the first case (extinguished), only prior directives or best interests apply. In the second case (unreliable), expressed preferences, while impaired, may still hold *some* moral weight as expressions of the current self, needing careful integration with the directive and best interests. Collapsing these risks either ignoring current suffering/wishes entirely or giving unreliable expressions undue weight against the directive.

  **III. Empirical & Psychological Constraints (Theory Must Be Consistent With, Not Reduced By):**

  *   **Preference Instability:** Evidence that treatment preferences and values can change over time, even within competence, and that stability decreases with age/cognitive decline. *Implication:* Theory cannot assume preferences are static; must account for change (supports distinction III.3).
  *   **Dementia Adaptation/Positive Affect:** Evidence that many individuals with dementia report positive subjective well-being and adapt to their condition, contrary to the negative predictions often made in directives. *Implication:* Theory must explain why current contentment doesn't automatically override a refusal directive (supports Phenomenon 1 result), without denying the empirical reality.
  *   **Psychiatric Distortion:** Evidence that active psychiatric illness (psychosis, severe depression) can profoundly distort contemporaneous judgment *and* retrospective evaluation of past experiences/decisions. *Implication:* Theory must justify relying on the directive *despite* potential distortions in its creation *and* the later self's perception (supports Phenomenon 2 result), without making authority contingent on impossible certainty about past competence.
  *   **Constraint:** The theory **MUST NOT** reduce to a purely Best Interests (BI) calculus. It must maintain the directive as a distinct source of moral authority, even when it conflicts with a BI assessment based on current experience or empirical generalizations. The empirical data informs the *application* and *limits* of the theory, not its core justification for authority.

  **IV. Key Desideratum & Ranking:**

  1.  **Most Foundational Desideratum (Excluding Competitors):** **Preserving the Authority/Evidential Weight Distinction (II.1)**.
      *   **Work Done:** This single distinction primarily excludes:
          *   **Precedent Autonomy (Rigid):** Collapses evidential weight into absolute authority, failing Phenomenon 3 (recent wishes).
          *   **Substituted Judgment:** Collapses authority into mere best evidence of past preferences, failing Phenomenon 1 & 2 (current benefit/perceived need overrides directive).
          *   **Pure Present BI:** Ignores the directive's potential authority altogether, reducing it to irrelevant evidence at best.

  2.  **Ranking of Non-Negotiables (Must be Satisfied):**
      1.  **Authority/Evidential Weight Distinction (II.1):** Fundamental to the concept of a directive having *authority*.
      2.  **Accommodating Phenomenon 1 Result (Honoring Refusal in Contented Dementia):** The core test case defining the problem.
      3.  **Refusal/Demand Asymmetry (II.2):** Necessary to handle Phenomenon 4 and reflect the different moral landscapes of omission vs. commission.
      4.  **Accommodating Phenomenon 3 Result (Recent Competent Wishes Override Old Directive):** Essential for respecting autonomy as ongoing.

  3.  **Potentially Relaxable (If Joint Conflict Exists and Core is Preserved):**
      *   **Value vs. Taste Change Distinction (II.3):** While crucial in principle, operationalizing it perfectly is empirically difficult. A theory might need a practical proxy (e.g., time since last competent expression) if a perfect distinction proves intractable, provided it still protects against overriding directives based *solely* on altered enjoyment in dementia.
      *   **Extinguished vs. Unreliable Autonomy Distinction (II.4):** Important for nuance, but a theory might prioritize clarity (e.g., directive applies upon formal determination of incompetence) if reliably distinguishing degrees of impairment in practice is too complex, provided it still respects Phenomenon 2 and avoids collapsing into pure BI. Accommodating Phenomenon 2 result is more crucial than the precise mechanism for handling unreliable expressions.
