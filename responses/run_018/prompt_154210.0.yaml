  I should start by addressing the verbal vs. substantive debate. The different terms—backsliding, autocratization, deconsolidation—might reflect varying emphases, but the core issue is substantive. The minimalists (Schumpeterian) see democracy as elections, while maximalists (Dahl) include liberal institutions. When leaders dismantle independent judiciaries or media, minimalists might see it as democratic correction, while maximalists view it as erosion. That’s a normative clash, not just terminology.

