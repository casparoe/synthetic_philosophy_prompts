  About the symposiarch... the host wonders why Plato emphasizes drink-pacing over just recording results. The scholar might argue control creates optimal diagnostic conditions. Good - then our follow-up should press whether this turns the symposiarch into a therapist rather than civic observer.

  On Socrates in the Symposium... yes, the sober observer role. If she sees this as proto-symposiarch model, we should ask: doesn't that reduce philosophy to surveillance? Her likely defense about philosophical eros being different from civic oversight needs a sharp follow-up about whether eros can coexist with detached observation.

