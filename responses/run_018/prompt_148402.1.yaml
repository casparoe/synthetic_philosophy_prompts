prompt: |-
  At a philosophy of mind study group, Jordan and Riley got into a sustained argument about whether global workspace theory can genuinely accommodate phenomenal consciousness without collapsing it into access consciousness. Jordan began by claiming that recent global-workspace models—particularly those that treat broadcasting as graded rather than all-or-nothing—leave conceptual room for what she called "half-broadcast" states: sensory information that has achieved global availability for emotional modulation and perceptual integration but has not yet been formatted for conceptual report or rational action guidance. She argued that this is precisely where phenomenal consciousness resides: globally available, yet not access-conscious in Block's strict sense, since access requires conceptual availability for reasoning and voluntary control.

  Riley pushed back that this merely redefines phenomenal consciousness as a subset of access. He said that if a state is globally available—even only for "emotional integration"—then by definition it is accessible to some cognitive systems, which is all Block ever required for access consciousness. To defend the distinction, Riley introduced what he termed "refractory phenomenal residues": hypothetical cases in which intense local recurrent processing in early sensory cortices produces rich experiential character, but the signal is too noisy or weak to reach any global workspace threshold. He argued that these residues show phenomenal consciousness can exist with no broadcasting whatsoever, and that global-workspace theorists are forced either to deny that the residues are conscious—which he found implausible—or to concede that phenomenal consciousness does not require global availability.

  Jordan replied that invoking "refractory residues" is ad hoc unless we have independent criteria for attributing consciousness to sub-threshold neural events. She granted that local recurrent processing might be necessary for phenomenal consciousness, but insisted it is not sufficient: without at least partial global integration, there is no "subject" for whom the experience exists. She then argued that Riley's position risks collapsing into a form of panpsychism about micro-processes, since if any isolated local recurrent loop can be phenomenally conscious regardless of global context, consciousness becomes ubiquitous throughout the brain.

  Riley countered that Jordan was conflating "global integration" with "global broadcasting." He proposed that phenomenal consciousness requires only local integration with a self-model, not full workspace broadcasting, and that Jordan's "half-broadcast" category was actually closer to his view than she admitted—except that she insisted on retaining global availability, which he saw as unnecessary baggage inherited from access-based frameworks.

  Jordan closed by asking whether, on Riley's view, a fully anesthetized patient with isolated local recurrent activity in V1 could have a visual experience that produces no global effects whatsoever. Riley said yes, in principle, though he admitted we might never detect it. Jordan responded that if such a state is undetectable in principle and makes no difference to cognition or behavior, then postulating it violates parsimony and risks turning phenomenal consciousness into an epiphenomenal ghost.

  Please adjudicate their exchange move by move: evaluate Jordan's initial half-broadcast proposal, Riley's refractory-residue objection, Jordan's response about ad hoc attribution and panpsychism, Riley's distinction between integration and broadcasting, and Jordan's final parsimony challenge. For each move, rate it as clearly mistaken, partly right but missing something, or clearly right, with brief justification. Then say who is more right overall, and identify the deepest issue both parties are failing to address—particularly whether their disagreement is substantive or partly verbal about what "access" and "global availability" must entail.
reasoning: |-
  Hmm, this is a fascinating exchange about the philosophy of mind, specifically the relationship between global workspace theory and phenomenal consciousness. Jordan and Riley are debating whether global workspace theory can account for phenomenal consciousness without reducing it to access consciousness.

  Jordan starts with her "half-broadcast" concept. She suggests that sensory information can be globally available for emotional and perceptual processing without being formatted for conceptual reporting or rational action. She believes this is where phenomenal consciousness resides - available but not fully accessible in Block's sense. This seems like an interesting attempt to carve out space for phenomenal qualia within global workspace theory by making broadcasting graded rather than binary.

  Then Riley counters with his "refractory phenomenal residues" - cases where intense local processing creates rich experience but never reaches global broadcasting. He argues this shows phenomenal consciousness can exist without any global availability. His point challenges the necessity of global availability altogether.

  Jordan responds that we can't just attribute consciousness to local processes without independent criteria. She warns this could lead to panpsychism and emphasizes that without global integration, there's no subject experiencing anything. This highlights the problem of subjectivity.

  Riley then makes a key distinction between integration and broadcasting. He suggests phenomenal consciousness only requires local integration with a self-model, not full global broadcasting. This seems like a refinement of his position that separates integration from global availability.

  Finally, Jordan presents her parsimony challenge: if an anesthetized patient has undetectable local experiences that don't affect anything, why postulate them? She argues this makes consciousness epiphenomenal and unparsimonious.

  I need to evaluate each move carefully. For Jordan's half-broadcast idea, it's partly right but might still conflate global availability with access. Riley's residues are provocative but lack empirical support and attribution criteria. Jordan's panpsychism warning is valid, but she might overstate the subject requirement. Riley's integration/broadcasting distinction is insightful but still vague on what "local integration with self" means. Jordan's parsimony challenge hits hard but might dismiss genuine possibilities too quickly.

  Overall, Riley seems slightly more convincing because he successfully challenges the necessity of global availability, though both make good points. The deepest issue is that they're talking past each other on what "access" and "global availability" mean - Riley has a minimalist view while Jordan keeps broader criteria. They're also missing how to empirically test these ideas and the nature of subjectivity itself.
answer: |-
  Here's a move-by-move adjudication of Jordan and Riley's exchange, evaluating the core arguments and identifying the deeper underlying issues:

  **1. Jordan's Initial "Half-Broadcast" Proposal:**
  *   **Rating:** Partly right but missing something.
  *   **Justification:** Jordan makes a valuable contribution by highlighting how graded broadcasting in modern GWT models *could* conceptually accommodate states with phenomenal character that lack the full suite of functions associated with Block's "Access Consciousness" (A-consciousness), particularly conceptual reportability and rational action guidance. This addresses a common criticism that GWT reduces phenomenal consciousness (P-consciousness) to A-consciousness. However, she arguably still conflates "global availability" (a key GWT tenet) with minimal access. If the state is globally available *at all* (even for emotional modulation/integration), it *is* accessible to some higher systems, blurring her intended distinction. Her "half-broadcast" state is likely still a form of *access* consciousness, just a weaker or more specialized one ("Emotional-Access Consciousness" perhaps), rather than pure P-consciousness without access.

  **2. Riley's "Refractory Phenomenal Residues" Objection:**
  *   **Rating:** Partly right but missing something.
  *   **Justification:** Riley effectively challenges the *necessity* of global availability for P-consciousness by proposing hypothetical cases where intense local processing generates rich experience without reaching any global workspace threshold. This directly targets a core GWT commitment. His point that Jordan's "half-broadcast" state is still globally accessible (and thus A-conscious in a broad sense) is strong. However, his objection relies heavily on the plausibility of these "refractory residues," which he concedes might be undetectable. He lacks independent criteria for attributing P-consciousness to these purely local states beyond stipulation based on the intensity of processing. This makes the objection somewhat intuitive but empirically and conceptually under-supported at this stage.

  **3. Jordan's Response (Ad Hoc Attribution & Panpsychism):**
  *   **Rating:** Partly right but missing something.
  *   **Justification:** Jordan correctly identifies the core weakness in Riley's position: the lack of independent criteria for attributing consciousness to sub-global-threshold events. Simply pointing to intense local recurrent processing isn't sufficient. Her panpsychism worry is a valid *reductio ad absurdum* – if *any* isolated local recurrent loop can be conscious, consciousness becomes implausibly ubiquitous, divorced from any integrated subject or unified perspective. Her insistence that global integration is necessary for there to *be* a subject *for whom* the experience exists is a crucial point about subjectivity. However, she potentially overstates the case. While robust subjectivity likely requires global integration, it's debatable whether minimal phenomenal experience (e.g., a raw, unintegrated flash of color or pain) *necessarily* requires a full "subject" in a narratively rich sense. She also doesn't fully address Riley's point that local integration (e.g., within a sensory module plus a minimal self-model) might be sufficient for basic P-consciousness.

  **4. Riley's Distinction (Integration vs. Broadcasting):**
  *   **Rating:** Partly right but missing something.
  *   **Justification:** Riley makes a significant conceptual move by explicitly distinguishing "local integration with a self-model" from "full global workspace broadcasting." This clarifies his position and differentiates it from a crude radical localization view. It directly addresses Jordan's subjecthood concern by incorporating a minimal self-model at the local level. His point that Jordan's "half-broadcast" state might be closer to his view than she admits (as it involves integration short of full conceptual access) is insightful. However, the concept of "local integration with a self-model" remains vague. How "local" is this integration? What constitutes a sufficient "self-model"? Does this integration itself constitute a *kind* of limited access or broadcasting *within* a subsystem, blurring the line he tries to draw? He provides no mechanism or criteria for how this local complex achieves phenomenality without any form of broader accessibility.

  **5. Jordan's Final Parsimony Challenge:**
  *   **Rating:** Clearly Right on the specific challenge, but Partly Right overall.
  *   **Justification:** Jordan's anesthesiology challenge hits home. If Riley's "refractory residues" are *in principle* undetectable (causing no global effects on cognition, memory, behavior, or report, even indirectly) *and* they lack any independent criteria for attribution beyond Riley's stipulation, then postulating them *does* become radically unparsimonious. It risks turning P-consciousness into an epiphenomenal ghost in the machine – something that makes no causal difference whatsoever, violating a fundamental principle of scientific explanation (causal efficacy or at least detectability). Riley's admission that we might never detect it strengthens her case. **However,** this challenge primarily targets the *undetectable* residues Riley posited. It doesn't definitively refute the possibility of *detectable* forms of P-consciousness without full global broadcasting (e.g., subtle neural signatures or indirect behavioral effects from locally integrated states not meeting GWT's broadcasting threshold). She overreaches slightly by implying *all* non-globally broadcast states must be epiphenomenal ghosts.

  **Overall Assessment:**
  *   **Who is More Right?** **Riley scores a narrow victory on the core question of necessity.** He successfully challenges the claim that global availability/global workspace broadcasting is *strictly necessary* for phenomenal consciousness. His distinction between integration and broadcasting, coupled with the (admittedly under-specified) idea of local integration with a self-model, provides a plausible alternative framework that avoids collapsing P-consciousness entirely into A-consciousness as defined by Block. Jordan's arguments, while strong on the need for criteria and the dangers of epiphenomenalism, ultimately fail to demonstrate that *some* form of minimal access/integration (potentially more local than GWT envisions) isn't still required, or that global broadcasting is strictly necessary.
  *   **Deepest Issue Both Parties Are Failing to Address:** The disagreement is **substantive but significantly exacerbated by verbal/semantic issues regarding "access," "availability," and "integration."**
      *   **Substantive Core:** The core disagreement is about the *minimal functional architecture* required for phenomenal consciousness. Jordan defends a modified GWT where graded broadcasting allows for P-consciousness without *full* A-consciousness but still requires *some* global availability/integration. Riley argues that P-consciousness can arise from complex local integration (potentially including a minimal self-model) without needing *any* broadcasting to a global workspace.
      *   **Verbal/Semantic Confusion:**
          *   **"Access" (Block's A-consciousness):** Jordan uses Block's relatively narrow definition (availability for reasoning, reporting, voluntary control). Riley uses a broader, more minimal interpretation – availability *to any* cognitive system (like emotional systems) constitutes access. Their debate over whether "half-broadcast" states are A-conscious hinges on this definitional difference.
          *   **"Global Availability" (GWT):** Jordan equates this with the graded broadcasting mechanism of modern GWT. Riley argues this is too strong a requirement and conflates it with the broader notion of "integration." His "local integration with a self-model" is a form of access/integration, but he deliberately avoids calling it "global" to distinguish it from GWT.
          *   **"Integration":** Both use this term, but with different scopes. Jordan means global integration via broadcasting. Riley means local or regional integration sufficient for binding features and linking to a minimal self-representation. They lack a shared, precise definition of what level or kind of integration is necessary and sufficient for phenomenality.

  **The deepest unresolved question is: What constitutes the minimal form of "access" or "functional integration" that is both necessary and sufficient for phenomenal consciousness, and how does it relate to the mechanisms of global availability proposed by GWT?** Both are grappling with how subjectivity and qualitative experience emerge from neural processes, but their disagreement is framed by differing interpretations of key terms and the boundaries of functional architectures. Resolving this requires clearer definitions, better criteria for attributing consciousness, and empirical evidence about neural correlates of minimally conscious states.
