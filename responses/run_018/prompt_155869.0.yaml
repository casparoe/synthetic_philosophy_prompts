answer: |-
  Here’s a prioritized, defended research agenda for an 18-month postdoc in population axiology, targeting your core concerns of **threshold leakage**, **person-affecting tensions**, and **practical implications for longtermism**. I’ve ranked projects by tractability, foundational importance, neglect, and real-world impact, with brutal honesty on what solutions can/can’t deliver.

  ---

  ### **Ranked Research Priorities**
  1.  **Formalize & Test "Threshold Leakage" in Dynamic Models**  
      - **Why it matters**: Your intuition is spot-on — critical-level views (CLV) "solve" the repugnant conclusion (RC) in static comparisons but may fail catastrophically in intergenerational trajectories. If welfare drifts near the critical level, CLV could mandate massive population explosions for negligible gains (a "slow-motion RC") or condemn civilizations to extinction over minor welfare dips.  
      - **Tractability**: High. Requires building dynamic population models (e.g., overlapping generations + stochastic welfare drift) and simulating policy choices under CLV vs. alternatives. Existing tools (e.g., social choice dynamics) can be adapted.  
      - **Neglected?**: Yes. Most CLV work is static. Broome (2004) hints at drift risks, but no systematic treatment exists.  
      - **Real-world implications**:  
          - **If proven**: Undermines CLV as a "solution" to RC. Forces longtermists to prioritize **civilizational resilience** (avoiding welfare near critical levels) over pure trajectory changes.  
          - **Overrated risks**: Won’t "fix" longtermist funding splits alone — but could shift $$ from pure AI safety to climate-biodiversity interventions that stabilize welfare floors.  
      - **Outputs**: Agent-based models + proofs showing conditions where CLV generates counterintuitive obligations under drift.

  2.  **Resolve the Person-Affecting Paradox in Longtermist Contexts**  
      - **Why it matters**: Person-affecting views (PAV) reject creating "extra happy people" to satisfy totalism, but this clashes with longtermism’s core mandate: shaping the far future to enable vast populations. This tension is paralyzing policy (e.g., "Should we fund climate adaptation for 10B existing people or AI risk reduction for 10^20 future people?").  
      - **Tractability**: Medium. Demands reconciling PAV with non-identity problems across time. Focus on **existent vs. contingent future people** — do PAV constraints apply symmetrically?  
      - **Neglected?**: Partially. PAV is well-studied, but its conflict with *empirically-driven* longtermism (e.g., Ord, Bostrom) is underexplored. Key papers: Roberts (2023) on time-slice PAV; Arrhenius (2000) on impossibility theorems.  
      - **Real-world implications**:  
          - **If solved**: Could validate/invalidate "strong longtermism" (e.g., if PAV forbids trading existing welfare for future lives). Directly impacts EA funding: favors near-term human development over speculative futures.  
          - **Overrated hopes**: Won’t end the RC debate — but may show that PAV is *incoherent* for intergenerational ethics, pushing us toward impersonal views.  
      - **Outputs**: Axiomatic framework for PAV in dynamic settings + analysis of longtermist trade-offs under different PAV interpretations.

  3.  **Map Alternatives to CLV That Avoid Leakage**  
      - **Why it matters**: If CLV leaks, we need escape routes. Test whether **variable critical levels**, **negative utilitarianism**, or **average views with range constraints** can handle drift without new absurdities.  
      - **Tractability**: Medium/Low. Requires constructing new welfare functions and stress-testing them against leakage scenarios. Risk of dead ends.  
      - **Neglected?**: Partially. Variable CLV exists (e.g., Blackorby et al. 1995), but not stress-tested for leakage. Average views are seen as "solved" but rarely modeled dynamically.  
      - **Real-world implications**:  
          - **If successful**: Could salvage CLV-like systems or revive "discarded" theories for longterm policy.  
          - **Overrated**: Unlikely to yield a silver bullet. Population ethics is a minefield of impossibility results — but worth probing for least-worst options.  

  ---

  ### **Why This Order?**
  1.  **Threshold leakage** is the most original, tractable, and high-stakes angle. It directly tests your core hypothesis that CLV "moves the weirdness." Success here could reshape the field.  
  2.  **Person-affecting/longtermism clash** is urgent for real-world impact. Longtermism drives billion-dollar funding decisions — resolving this tension is ethically critical.  
  3.  **Alternatives to CLV** is a fallback. If leakage is real, we need options — but it’s less innovative than (1).  

  ---

  ### **What’s Not Worth the Time**
  - **Rehashing the RC itself**: The debate is saturated. Focus on *new failure modes* (leakage).  
  - **Pure metaphysics**: E.g., "Do possible people have moral weight?" — intractable and low-policy-impact.  
  - **Empirical welfare metrics**: Beyond scope; assume a coherent (if imperfect) cardinal scale.  

  ---

  ### **Real-World Impact: Honest Assessment**
  Solving these **won’t** directly dictate whether to fund malaria nets or asteroid defense. But:  
  - **If threshold leakage holds**: Longtermist institutions (e.g., Open Philanthropy) must prioritize avoiding civilizational collapse *even if welfare stays modest*. Favors climate/biodiversity over pure AI risk.  
  - **If PAV conflicts with longtermism**: Forces EAs to either abandon PAV (enabling stronger longtermism) or abandon creating future generations as a goal (a massive ideological shift).  
  - **Overrated implications**: No population axiom will "solve" discount rates or climate policy alone — but it can expose contradictions in dominant frameworks.  

  ---

  ### **Practical Game Plan for the Postdoc**
  - **Months 1–6**: Formalize threshold leakage (dynamic models + CLV). Publish a working paper.  
  - **Months 7–12**: Tackle PAV/longtermism clash. Engage with EA leaders (e.g., Forethought Foundation).  
  - **Months 13–18**: Explore CLV alternatives; synthesize findings into policy briefs.  

  **Target journals**: *Philosophy & Public Affairs*, *Economics & Philosophy*. **Key conferences**: PPE Society, EA Global.  

  This agenda nails neglected, high-upside questions while forcing clarity on the ethics shaping humanity’s future. Go hard at leakage first — it’s the linchpin.
