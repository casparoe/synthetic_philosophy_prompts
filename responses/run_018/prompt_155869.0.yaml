  Hey, I'm trying to map out where a small grant — say one post-doc for 18 months — should actually go in population axiology, specifically around the repugnant conclusion and whether patching totalism with critical-level views just moves the weirdness around instead of fixing it. I've been playing with this idea I'm calling "threshold leakage": the worry that if you block the repugnant conclusion by setting a welfare floor, the counterintuitive pressure doesn't vanish, it migrates into slow intergenerational comparisons where average welfare drifts just above or below that floor across centuries. There's also this tension with person-affecting intuitions — if part of why we reject totalism is that it forces us to create extra happy people, does that same intuition break climate-adaptation budgets that help existing people versus longtermist portfolios that might eventually produce vastly more future lives?

  So what are the open questions or lines of work here that truely matter, and which two or three should this postdoc chase? I want a defended ordering, not a survey: use criteria like tractability, how much other theoretical work depends on the answer, and wether it's genuinely neglected or just fashionable. Also be honest about which real-world implications — say for longtermist funding splits or intergenerational policy — actually follow if we solve the theory, and which ones are overrated.
