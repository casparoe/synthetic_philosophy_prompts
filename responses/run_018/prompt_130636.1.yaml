  First, I need to recap the Knobe effect simply: that people call harmful side-effects "intentional" but helpful ones "unintentional" in otherwise identical scenarios. The big debate is whether this reveals moral judgment shaping our concept of intentionality, or if it's just how we use words when morally riled up.

  For omissions—like *not* doing something—research shows the asymmetry holds too. If you *don't* act and cause harm (e.g., ignore a safety step that wrecks the environment), people call that "intentional" harm. But if you *don't act* and it accidentally helps (e.g., skip a step that *saves* the environment), they say it wasn't intentional. So moral badness still skews the "intentional" label toward negative outcomes, even for inaction.

  Now, institutional roles—like a CEO vs. a bureaucrat following rules. Studies suggest the effect *weakens* here. If someone's just doing their neutral job (e.g., a clerk processing forms that happen to harm), people are less likely to call side-effects "intentional," even if bad. The role frames the action as detached from personal intent. But if the role includes moral responsibility (e.g., a safety officer ignoring risks), the effect might return. So context matters: institutional settings can dilute the asymmetry by depersonalising intent.

  The user's flatmate dispute might hinge on whether moral blame *creates* intent or just highlights it. I’ll present both sides neutrally: the "deep link" view (morality shapes core concepts) vs. the "pragmatic tweak" view (language gets moral emphasis without changing fundamentals). No need to pick a winner—they want the conceptual map, not a verdict.

