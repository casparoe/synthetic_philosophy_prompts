  The residue analysis will be telling – if my architectural vocabulary can't capture GDPR's consent layers or social credit's mobility restrictions, it's not the metaphor's fault. Those gaps expose governance complexities that physical spaces can't replicate. Maybe that's the real insight: data flows resist architectural containment. 

