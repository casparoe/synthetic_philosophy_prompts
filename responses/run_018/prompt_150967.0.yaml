prompt: |-
  hey — i'm drafting a novel with two colonies, one built on guilt and one on shame, and my moral logic is a mess. here are my verdicts, they don't line up neat.

  case 1: a woman poisions her sister by mistake and hides it; she rots inside for years. i say that's guilt working right, even totally hidden.
  case 2: same thing but she's exposed and shunned; she feels nothing, just performs remorse. i say that's shame failing — the emotion got outscourced to the crowd.
  case 3: a town shares an old unspoken crime and everyone carries a vague heavyness. i call that healthy collective shame.
  case 4: but then a culture that tries to engineer private guilt through mass rituals — i feel that's a contradiction, guilt needs solitute?
  case 5: yet there's another culture in my notes that instutionalized shame and rebuilt personal identity around public role-change, and it actually works. so maybe a culture can choose?

  what principle captures all this, if any? is guilt or shame the better moral emotion? can a culture actually pick one? and what does your principle predict for a society that tries to make shame fully internal with no audience? be honest — which case do i have to drop?

  end with Verdict: [case number], then \answer{your bottom-line principle in one phrase}
reasoning: |-
  Okay, the user is crafting a novel with two colonies based on guilt and shame, and their moral logic feels messy. They've presented five cases that don't neatly align, and they're seeking a unifying principle. 

  First, I need to unpack their cases: 
  - Case 1 shows guilt functioning correctly as private torment even without discovery. 
  - Case 2 demonstrates shame's failure when emotion is outsourced to public performance. 
  - Case 3 frames collective shame as healthy when shared but unspoken. 
  - Case 4 questions if guilt can be culturally engineered through group rituals, feeling contradictory. 
  - Case 5 surprises with institutionalized shame successfully rebuilding identity through public roles.

  Hmm, the core tension is whether guilt/shame are inherently private/public or if cultures can reshape them. The user's phrasing suggests they suspect guilt requires solitude while shame needs an audience—but Case 5 disrupts that. 

  Looking deeper: 
  Their examples reveal shame isn't just about audience presence/absence. Case 2 fails because the shame is superficial (performed), while Case 5 succeeds because the culture transforms public judgment into identity reconstruction. Similarly, Case 3's "healthy" collective shame works because the weight is genuinely internalized, not enforced. 

  Ah! The real differentiator might be internalization vs. externality. Guilt by definition requires internalization (hence Case 4's contradiction—you can't force private conviction via crowds). Shame can swing either way: it fails when purely external (Case 2) but succeeds when internalized as identity (Case 5) or collective conscience (Case 3). 

  The user also asks which emotion is "better." That's tricky—both have dark sides (guilt can paralyze; shame can destroy self-worth). But functionally, guilt might edge ahead for intrinsic moral development since it doesn't rely on observers. Still, Case 5 proves shame can be rehabilitative if structurally repurposed. 

  For the experiment in their query (internalized shame with no audience): 
  A society trying that would likely fracture. Without witnesses, shame loses its social adhesive and morphs into either guilt (if internalized as personal failure) or dissipates entirely (if the cultural script requires spectators). 

  Now, the verdict... Case 4 must go. Engineered guilt via mass ritual is indeed a contradiction—like screaming at someone to be introspective. The other cases hold under the principle: "Guilt is inherently internal; shame is social but internalizable." 

  *Pauses* 
  The user's worldbuilding is sophisticated—they're noticing nuances even academics debate. Their frustration suggests they want coherence without oversimplifying. I should honor that by avoiding binaries and highlighting the cultural plasticity they've intuitively captured in Case 5. 

  Final principle: "Guilt anchors morality internally; shame binds it socially—but cultures can reroute either." Case 4 is the true outlier.
answer: |-
  Here's the breakdown with a unifying principle, addressing your cases and questions:

  **Core Principle:**  
  **Guilt is inherently internal (self-judgment of *actions*), while shame is inherently social (fear of *rejection* by a valued group). Cultures can amplify either, but cannot fundamentally alter their core nature.**

  **Analysis of Your Cases:**
  1.  **Case 1 (Hidden Poisoner, Guilt):** **Valid.** Guilt functions correctly – internal self-condemnation persists without any external audience. Solitude is its natural habitat.
  2.  **Case 2 (Exposed Poisoner, Performed Remorse):** **Valid.** This is *failed* shame. Shame requires the *threat* of rejection. Here, the actual rejection *is* the consequence, and the emotion itself is absent; only the performance remains. Shame's mechanism (fear of exposure/judgment) was bypassed by direct exposure/punishment.
  3.  **Case 3 (Collective Unspoken Crime, Heavyness):** **Valid.** This is *healthy collective shame*. The group shares a tacit understanding of a moral failing that defines their shared identity ("*we* did this"). The "heaviness" is the internalized social bond straining under the shared secret/failure. It's social glue, even if painful.
  4.  **Case 4 (Engineered Private Guilt via Mass Ritual):** **Contradiction.** Guilt cannot be reliably *engineered* externally *as guilt*. Mass rituals might induce *shame* (fear of group disapproval for *not* participating/feeling), *anxiety*, or even *suggested* feelings, but genuine guilt arises from an *individual's own* judgment of their specific act against their conscience. Crowds drown out the internal voice necessary for true guilt. This case fails the core nature of guilt.
  5.  **Case 5 (Institutionalized Shame & Role-Change):** **Valid.** This demonstrates shame's *cultural plasticity*. By ritualizing exposure and offering a clear, accepted path to reintegration (role-change), the culture leverages shame's social nature constructively. The public judgment is channeled into identity transformation *within the social structure*. Shame's fear of rejection is mitigated by the prescribed path back.

  **Answers to Your Questions:**

  1.  **What principle captures this?** See Core Principle above: Guilt is internal self-judgment of actions; Shame is social fear of rejection. Cultures shape expression but not essence.
  2.  **Guilt or Shame: Which is "better"?** Neither is inherently "better." Each serves different functions:
      *   **Guilt:** Better for *intrinsic moral development*, repairing specific wrongs (focus on the *act*), and functioning without surveillance. Prone to rumination/paralysis.
      *   **Shame:** Better for *maintaining social cohesion*, enforcing group norms, and identity-based regulation. Prone to scapegoating, destructive hiding, and crushing self-worth if excessive or without resolution.
  3.  **Can a culture pick one?** A culture can *emphasize* and *structure its institutions* around one mechanism, leveraging its strengths and mitigating weaknesses (as in Case 5 for shame). However, it cannot *eliminate* the fundamental nature of the other emotion in individuals. A "guilt culture" will still have people feeling shame; a "shame culture" will still have people feeling guilt.
  4.  **Prediction: Society tries to make shame fully internal with no audience?** This would **fail** or **transform into guilt.** Shame *requires* an actual or imagined audience whose judgment matters. Removing the audience removes the fuel. What might remain is:
      *   **Guilt:** If the person judges their *action* as wrong based on their *own* standards ("I did something bad").
      *   **Anxiety/Depression:** A free-floating negative feeling without the specific social anchor of shame.
      *   **Dissipation:** The feeling simply fades without the reinforcement of social judgment. True, sustained, *internalized shame with no audience* is an oxymoron; it becomes guilt or loses its defining characteristic.

  **Verdict: Case 4**  
  This case fundamentally misunderstands guilt. Guilt cannot be mass-produced externally *as guilt*. Crowds induce conformity, anxiety, or shame, not genuine internal self-condemnation specific to a personal act against one's conscience. Drop or radically rethink Case 4.

  \answer{Guilt is intrinsic self-judgment; shame is social fear of rejection. Cultures shape expression, not essence.}
