  ## Thought Experiment: The Singing Ledger of Tidewatch Cove

  At Tidewatch Cove, an isolated trading post, villagers use carved driftwood tokens to represent labor credits. Each token type corresponds to a specific task (e.g., net-mending, fish-smoking). Crucially, the *only* record of who owes whom is a communal song detailing every transaction, memorized by all adults. Tokens are physically exchanged during deals, but their value resides solely in the song's accounting; the driftwood itself is worthless scrap. Now, two events occur: First, a warehouse storing all tokens collapses, exposing them to salt spray. Within months, the tokens disintegrate into pulp. The song, however, remains intact. Second, years later, a fever sweeps through, killing the elders before they can fully teach the song to the young. The new generation finds a warehouse *full* of perfectly preserved tokens (stored safely elsewhere), but the song's meaning is lost.

  **Analysis & Theories Check:**
  *   **Berkeleyan Token-View:** Correctly predicts wealth (debts/credits) survives the token rot because value resided in the *communal agreement* recorded by the song. Obligations endure via memory. Conversely, wealth collapses when the song is forgotten, despite intact tokens, because the *conventional record* defining their meaning is gone. Tokens are inert without the shared understanding.
  *   **Commodity-Money View:** Incorrectly predicts wealth is destroyed when tokens rot (valuable material lost) and wealth persists when tokens are found intact (valuable material present). It mistakes the driftwood *itself* for the source of value.
  *   **Isolating Feature:** The scenario isolates value arising purely from *social convention and record-keeping* (the song) versus inherent material properties. Value transfers via shared knowledge, not substance.
  *   **Commodity Defender's Rebuttal:** They might argue the song *is* the valuable commodity (intellectual labor stored in brains/memory), not merely a token representing labor. They'd claim Tidewatch uses *two* systems: perishable token-money *and* song-commodity-money, muddying the test.
