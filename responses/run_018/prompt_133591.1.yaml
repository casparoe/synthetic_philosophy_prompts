  Okay, the user is a novelist working on a philosophical scene about artificial cognition. They want me to act as an expert in AI philosophy and narrative theory. The core request is to compare the "frame problem" in AI with what they term "inertial world-keeping" in fiction writing. 

  First, I need to unpack both concepts clearly. The frame problem in AI deals with how automated systems handle unchanged properties during actions - either by exhaustively listing everything that stays the same (successor-state axioms) or only noting changes (frame axioms). This leads to combinatorial explosion concerns. 

  For inertial world-keeping in writing, it's about maintaining background consistency without over-describing static elements. The user's key question is whether these share the same structural root in combinatorial representation, or if they diverge because readers fill gaps through inference. 

  I notice the user is very precise: they want exactly five numbered points, no intro/conclusion, and demand analysis of the computational tractability vs interpretive charity distinction. This suggests they've deeply considered the parallels already and need concise academic rigor. 

  As a novelist, they're likely probing how human cognition (via readers) solves what machines struggle with. The philosophical depth implies their scene might explore AI encountering narrative-like reasoning. 

  For the response structure: 
  - Points 1-2 should define each problem separately 
  - Point 3 must directly address the combinatorial root question 
  - Point 4 has to spotlight the reader inference divergence 
  - Point 5 needs to hammer the tractability/charity contrast as the "decisive separator" 

  The challenge is condensing complex philosophy into single-sentence bullets without oversimplifying. I'll emphasize that while both involve combinatorial representation, human interpretive charity fundamentally changes the game for writers.
answer: |-
  Here is the numbered list addressing your query:

  1.  Both automated reasoners and fiction writers must represent a dynamic world: agents track action consequences within a stable environment, while authors maintain consistent fictional worlds across narrative events, both facing the challenge of managing unchanged background elements.
  2.  The classical AI frame problem forces a choice: explicitly represent all unchanged properties via computationally heavy successor-state axioms, or list only changes via frame axioms, risking incomplete reasoning about persistence unless supplemented by costly default logic.
  3.  Inertial world-keeping, the authorial challenge, similarly avoids exhaustive enumeration of static facts but relies on reader inference rather than formal axioms; authors imply continuity through selective description, trusting readers to assume unchanging background elements unless noted otherwise.
  4.  These problems share a structural root in combinatorial representation—both grapple with the impracticality of explicitly representing vast amounts of unchanged state information across events or scenes.
  5.  They diverge decisively because readers supply missing continuity through pragmatic inference (interpretive charity), making inertial world-keeping tractable for authors; in contrast, automated reasoners lack this robust background understanding, making computational tractability the core unsolved challenge of the frame problem.
