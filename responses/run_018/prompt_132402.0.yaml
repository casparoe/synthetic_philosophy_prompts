answer: |-
  ## Opening Remarks: The Unwritten Rules of the Lab and the Ghost in the Machine

  Good morning. It’s a pleasure to open this workshop on “What We Leave Out When We Reason.” I stand before you not as a philosopher, but as someone who spent forty years in the trenches of experimental physics, wrestling with complex systems that rarely behaved exactly as the textbook said they should. My compass was the lab notebook, my tools were often temperamental, and my constant companion was the gnawing awareness of everything I *wasn’t* measuring, everything I *wasn’t* controlling for.

  That awareness brings me directly to the ghost haunting our workshop title: **the frame problem**. For those less familiar, in its starkest form, it’s the seemingly impossible task faced by an AI: How does it know, when it performs an action or observes a change, what *else* in the vast universe *doesn’t* change? How does it avoid drowning in an infinite sea of irrelevant non-effects? Philosophers and AI researchers formalize this beautifully – through successor-state axioms defining precisely what changes, or non-monotonic logics that allow default assumptions which can be overridden when surprising things happen. These are powerful, necessary tools for building reasoning systems.

  But here’s where my lab coat feels a bit itchy. Because when I reflect on four decades of designing, running, and troubleshooting long-term experiments – monitoring subtle signals over weeks or months, coaxing order from noisy data – I realize we experimental scientists never, *ever*, solved the frame problem the way the AI textbooks suggest. We didn’t enumerate the infinite list of things that *weren’t* affected by our manipulations. We couldn’t.

  Instead, we practiced something else. Something tacit, embodied, and deeply practical. I call it **domain locking**.

  Imagine setting up a delicate experiment measuring quantum effects at near-absolute zero. You spend weeks calibrating. You obsess over shielding from magnetic fields, vibrations, even cosmic rays. You control the temperature to microkelvins. You breathe carefully. What you are doing, intuitively, is not listing every possible perturbation. You are *locking down* a domain. You are creating a stable, bounded background field – a tightly controlled environment – within which your specific variables *can* change meaningfully, and where most potential interfering factors are tacitly assumed *not* to run rampant.

  *   **Domain locking isn't exhaustive enumeration.** It’s the engineer’s shrug: “The building’s foundation is solid; we don’t expect earthquakes *here* during this run.” It’s trusting the power grid *enough*, the cooling water flow *enough*, the vacuum seals *enough*, based on experience and redundancy. It’s the accumulated craft knowledge that tells you *this* knob matters immensely, *that* one can drift a little, and *those* over there? Ignore them for now; they’re locked out by the setup.
  *   **It’s dynamic and procedural.** We constantly *monitor* the lock. A spike on a voltage monitor, a strange hum, a change in the lab’s ambient temperature – these are breaches in the domain. They trigger alarms, not because we predicted that *exact* failure, but because they violate the *tacit stability* we depend on. We don’t reason about *all* possible breaches; we react when the lock *feels* compromised.
  *   **It relies on a stable world (until it doesn’t).** We lock the domain assuming fundamental stabilities – gravity works, materials hold, light speed is constant. We treat the broader context as fixed *for the purpose of this experiment*. This isn’t naivety; it’s operational necessity. We build robustness *within* the locked domain precisely because we know the lock isn’t absolute.

  So, here lies the tension I want to frame for our discussions:

  1.  **Formal AI (and Philosophy of Mind) wrestles directly with the representational frame problem:** How to explicitly model relevance, change, and persistence in a symbolic system? Successor-state axioms, non-monotonic logics – these are ingenious attempts to *formally capture* what changes and what stays the same, overcoming the logical nightmare of infinite non-effects.
  2.  **The practicing scientist relies on domain locking:** We tacitly stabilize an operational background – a bounded, controlled slice of the world – within which the frame problem is *practically dissolved* through context, constraint, and embodied monitoring. We don't *solve* the logical problem; we *circumvent* it operationally through environmental control and craft knowledge.

  **The critical question this poses for our workshop is this:** Are these two approaches – the formal-representational and the practical-operational – tackling the same beast, or fundamentally different ones?

  *   Is the AI researcher's frame problem a *logical abstraction* of the scientist's practical challenge? Or...
  *   Is the scientist's domain locking an *embodied solution* to a problem that only *looks* like the AI's frame problem from the outside? Or...
  *   Are we seeing two distinct strategies for managing complexity – one rooted in explicit symbolic representation for artificial minds, the other rooted in situated action and environmental control for biological (or instrument-augmented) ones?

  **This, I propose, is the core puzzle we leave you with today:** Where exactly does the line lie between the *logical problem of relevance* as formalized in AI and philosophy, and the *practical problem of operational stability* as lived daily in the lab and, perhaps, in our own cognitive engagement with the world? Are they facets of the same diamond, or entirely different minerals?

  The purpose of this workshop, then, is not to declare a winner, but to explore this tension. To ask: What do we *leave out* when we formalize reasoning? What do we *leave out* when we lock a domain? What do we *gain* and what do we *lose* in each approach? How do these omissions shape our understanding of intelligence, science, and the world itself?

  I spent forty years trusting the lock. Now, standing outside the lab, I find myself profoundly curious about the nature of that lock, and how it relates to the beautiful, intricate locksmithing happening in formal AI and philosophy. I look forward to being puzzled alongside all of you. Thank you. Let the exploration begin.
