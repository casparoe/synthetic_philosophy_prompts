  The core of their observation is fascinating: people are taking Keynes's warning about the challenge of leisure and weaponizing it to defend the very work culture he hoped we'd transcend. This creates a perverse outcome where his critique becomes fuel for the status quo. It's not straw man because they're correctly citing his psychological point, and not mere pessimism because they're actively constructing an argument. 

  I recall similar patterns in philosophy. Marcuse's "repressive desublimation" comes to mind—where systems maintain control by offering faux freedoms. But that's not quite it. More relevant is the concept of "adaptive preferences" where people justify oppressive conditions as desirable. Still, the user's case is more specific: it's an interpretive sleight-of-hand regarding a thinker's intent.

