answer: |-
  ### Cicero's *De Senectute*: Coherence Challenge Activity  
  **Goal:** Experience Cicero’s reframing of aging as a shift in *officia* (life-stage appropriate roles), not decline. Participants defend against the four charges of aging while maintaining philosophical consistency across rebuttals, mirroring Cicero’s integrated reasoning.  

  ---

  ### **Activity Structure**  
  **Time:** 120 minutes  
  **Participants:** 10 grad students (5 pairs)  
  **Materials:**  
  - 4 "Charge Cards" (1 per charge, duplicated for pairs)  
  - 1 "Consistency Tracker" sheet per participant (hidden until debrief)  
  - Whiteboard for public tracking  
  - Timer  

  ---

  ### **Phase 1: Setup & Framing** (20 min)  
  1. **Lecture (10 min)**:  
     - Recap Cicero’s core argument: Old age is not misery but a shift in *officia* (e.g., from active politics to contemplative mentorship).  
     - Highlight the four charges:  
       > ① Body weakens. ② Politics ends. ③ Pleasures fade. ④ Death is near.  
     - Emphasize the twist: Withdrawal is a *strategic transition*, not loss.  

  2. **Activity Brief (10 min)**:  
     - Split into 5 pairs. Assign each pair **one** Charge Card (multiple pairs get same charge).  
     - Explain:  
       - *"You’ll defend your assigned charge using Cicero’s arguments. But there’s a hidden goal: Your rebuttals must cohere across **all four charges**—like Cicero’s unified philosophy."*  
       - *"You’ll rotate partners. Defend your charge, then adapt to others’. Points come from consistency, not rhetoric."*  

  ---

  ### **Phase 2: Charge Cards & Rules**  
  **Card Design** (Text for all cards includes Cicero’s key rebuttal + tension trigger):  
  | Charge               | Cicero’s Rebuttal (Front)                              | Hidden Tension (Back) |  
  |----------------------|--------------------------------------------------------|------------------------|  
  | **Body Weakens**     | *"Exercise preserves agency; mind > body. Vigor comes from purpose, not youth."* | ⚠️ If you appeal to **wisdom/contemplation**, does it contradict valuing physical vigor? |  
  | **Politics Ends**    | *"Withdrawal isn’t loss—it’s freedom for higher *officia*: mentoring, writing, philosophy."* | ⚠️ If you frame politics as "noise," does it undermine arguing for **continued public engagement** elsewhere? |  
  | **Pleasures Fade**   | *"Sensual loss? Good! True joy is intellectual (e.g., farming, dialogue, art)."* | ⚠️ If pleasure is *detached*, can you justify **exercise/politics** as goods? |  
  | **Death is Near**    | *"Death completes a natural cycle. Life’s richness, not length, matters."* | ⚠️ Does accepting death **weaken defenses** of active *officia*? |  

  **Rules**:  
  - Each pair preps a 2-min defense for their charge using Cicero’s rebuttal (10 min prep).  
  - **Rotation Rounds**: 3 rounds × 10 min each (30 min total).  
    - *Round 1*: Pair A (Charge ①) vs. Pair B (Charge ②). Defend, then cross-examine.  
    - *Round 2*: Rotate pairs (e.g., Pair A now meets Pair C (Charge ③)). Repeat.  
    - *Round 3*: Final rotation (e.g., Pair A meets Pair D (Charge ④)).  
  - **Secret Task**: Participants note their own arguments on **Consistency Trackers** (hidden). No sharing!  

  ---

  ### **Phase 3: Rotation & Hidden Consistency Scoring** (40 min)  
  - **Process**:  
    1. Defender presents 2-min rebuttal using Charge Card.  
    2. Challenger questions (1 min).  
    3. Defender responds (1 min).  
    4. Both silently note key words from their arguments on trackers (e.g., "wisdom," "exercise," "withdrawal").  
  - **Scoring Mechanism**:  
    - Trackers list all 4 charges. Participants score **1 point** per charge if their keywords align with Cicero’s *officia* shift.  
    - **Coherence Bonus**: +2 points if arguments for **all charges** avoid contradictions (self-graded post-activity).  
    - *Example Penalty*: If you used "contemplation" for Politics (Charge ②) but "vigor" for Body (Charge ①), you lose the bonus.  

  ---

  ### **Phase 4: Reveal & Payoff** (15 min)  
  1. **Consistency Tracker Review**:  
     - Participants score themselves: 1 point per coherent charge (max 4), +2 bonus if no contradictions.  
     - Public tally on whiteboard: *"Who scored 6? 4? Why?"*  

  2. **Twist Reveal**:  
     - *"Points measured how Cicero’s *officia* shift underpins all rebuttals. Winning meant mirroring his holistic logic—not defeating charges."*  

  ---

  ### **Phase 5: Debrief** (25 min)  
  **Guide participants to connect tensions to Cicero’s text**:  
  1. **Breakdown Moments**:  
     - *Body vs. Politics*:  
       > *"You argued exercise maintains vigor (Body) but withdrawal enables wisdom (Politics). Cicero resolves this: Physical health supports *contemplative* officia (e.g., *De Senect.* XI: ‘The mind must exercise sway’). Withdrawal isn’t passivity—it’s redirected action."*  
     - *Pleasures vs. Death*:  
       > *"If pleasure is intellectual (Charge ③), why fear death (Charge ④)? Cicero: Wisdom lets us see death as natural (*De Senect.* XX: ‘Life has a fixed duration’). Pleasure and mortality both fit *nature’s plan*."*  

  2. **Cicero’s Moves**:  
     - Reframed withdrawal: Not deprivation but *elevated officium* (e.g., Scipio’s mentorship in *De Senect.* XIX).  
     - Unified philosophy: All rebuttals stem from *virtue through role-appropriate action*.  

  **What the Activity Can’t Capture**:  
  - Roman social stakes (e.g., *cursus honorum* shame). *Address post-activity:*  
    > *"Cicero wrote for elites fearing retirement’s stigma. His *officia* shift wasn’t just logic—it was face-saving. Withdrawal became moral authority, not failure."*  

  ---

  ### **Timeline Summary**  
  - 0:00-0:20 — Setup & Framing  
  - 0:20-0:30 — Charge Card Prep (pairs)  
  - 0:30-1:10 — Rotation Rounds (3 × 10 min + 10 min buffer)  
  - 1:10-1:25 — Consistency Reveal & Scoring  
  - 1:25-1:50 — Debrief & Cicero Connections  
  - 1:50-2:00 — Closing Lecture (Roman context limitations)  

  ---

  ### **Why This Works**  
  - **Pedagogical Payoff**: Forces direct engagement with Cicero’s integrative reasoning. Participants *feel* the tension in his claims (e.g., "Is wisdom physical or not?") before intellectualizing it.  
  - **Low Prep**: No citations or prizes—just cards, trackers, and structured dialogue.  
  - **Stoic *Officia* Focus**: Activity mirrors Cicero’s method: Charges are *indifferents*; coherence is *virtuous action*.  

  > "Old age is the consummation of life, not its dissolution." — *Cicero, De Senectute*
