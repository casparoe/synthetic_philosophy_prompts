prompt: |-
  Compare the global Quine-Duhem thesis—that for any theory there exists an empirically equivalent rival constructible by adjusting auxiliary hypotheses—with what might be called “domain-locked underdetermination,” in which the pool of permissible auxiliary adjustments is restricted by prior theoretical commitments that are treated as non-negotiable within the domain in question. In particular, discuss whether domain-locked underdetermination avoids Quine’s objection that global underdetermination is trivial because auxiliary hypotheses are always available; whether it retains any anti-realist force or collapses into a pragmatic selection problem; and how each variant handles observationally equivalent cosmological models that differ solely in the ontological interpretation of a dark-energy parameter without altering the underlying dynamics. Be precise about where the two positions diverge on the scope of theory revision and on whether empirical equivalence alone can motivate a skeptical conclusion.
reasoning: |-
  Okay, the user wants a comparison between the global Quine-Duhem thesis and domain-locked underdetermination. Let me start by recalling both concepts. The Quine-Duhem thesis says that any theory can be saved from falsification by adjusting auxiliary hypotheses. It's global because you can always construct an empirically equivalent rival by tweaking those auxiliaries. Domain-locked underdetermination, on the other hand, restricts those adjustments based on prior commitments within a specific domain. 

  First, I need to break down how these two positions differ in scope. The global version allows any auxiliary adjustment, making it trivial because rivals are always possible. But domain-locked limits adjustments to those accepted within the domain. For example, in cosmology, if dark energy is a fixed parameter, you can't reinterpret it as something else without violating domain commitments. 

  Next, Quine's objection: he thinks global underdetermination is trivial because you can always find auxiliaries. Domain-locked avoids this by making some auxiliaries non-negotiable. That means not every rival is permissible, so underdetermination isn't trivial here. But does this still support anti-realism? Or is it just a pragmatic issue? Domain-locked might show that within a framework, multiple theories can fit data, but since the framework itself is accepted, it's more about choosing between options rather than doubting the framework's reality. 

  Then there's the cosmological example. Two models with different ontological interpretations of dark energy but same dynamics. Global Quine-Duhem would say they're both possible by adjusting auxiliaries. But domain-locked might reject one if it violates commitments, like reinterpreting dark energy as modified gravity when the domain treats it as a fixed parameter. 

  The user also asks whether empirical equivalence alone leads to skepticism. In global underdetermination, yes, because rivals are always possible. But in domain-locked, empirical equivalence doesn't automatically imply skepticism because the framework restricts viable rivals. Skepticism might only arise if the framework is questioned, which isn't done within the domain. 

  I should clarify where they diverge: scope of revision and the necessity of empirical equivalence for skepticism. Domain-locked is context-dependent, tied to a research program, while global is universal. And without framework-relativity, empirical equivalence isn't enough for skepticism in domain-locked underdetermination. 

  The user's deeper need might be understanding if domain-locked underdetermination offers a middle ground between radical skepticism and realism. They might be interested in how scientific communities maintain progress despite underdetermination. The cosmological example suggests that ontological debates are constrained by domain commitments, affecting how theories are evaluated. 

  I need to ensure precision on each point: triviality avoidance, anti-realist force, and handling cosmological models. Highlight that domain-locked isn't trivial but also doesn't lead to full skepticism, whereas global does. The cosmological models show that domain commitments determine which interpretations are viable, affecting ontological conclusions without changing dynamics.
answer: |-
  Here's a precise comparison of global Quine-Duhem underdetermination (GQD) and domain-locked underdetermination (DLU), addressing your specific queries:

  **Core Definitions & Divergence on Scope of Revision:**
  1.  **GQD:** Claims that *for any theory T and any body of evidence E seeming to falsify T, there exists an empirically equivalent rival T'* (yielding identical predictions for all possible observations). T' is constructed by modifying *any arbitrary set of auxiliary hypotheses* (background assumptions, boundary conditions, measurement theories, etc.) while preserving T's core postulates, *or* vice versa. The pool of adjustable elements is **unrestricted**.
  2.  **DLU:** Acknowledges that *within a specific scientific domain governed by a set of entrenched prior theoretical commitments (PTCs),* multiple theories T1, T2,... Tn may be empirically equivalent *for the available evidence*. Crucially, constructing rivals is **restricted** – adjustments cannot violate the PTCs. PTCs are treated as non-negotiable *within that domain* (e.g., Lorentz invariance in particle physics, the cosmological principle in standard cosmology, conservation of energy-momentum in GR-based theories).

  **Key Divergence:** The **scope of permissible revision**.
  *   **GQD:** No auxiliary hypothesis is sacred. Anything *can* be revised to save a theory core or generate a rival. Revision is **unconstrained**.
  *   **DLU:** Specific, domain-constitutive auxiliaries (the PTCs) are *provisionally fixed* for the purposes of theory assessment *within that domain*. Revision is **constrained** by the accepted framework.

  **Addressing Quine's Triviality Objection:**
  *   **Quine's Objection (to GQD):** Because *any* auxiliary can be adjusted in *any* way, generating an empirically equivalent rival is always trivially possible (e.g., add "and invisible gremlins cause the anomaly" to the auxiliaries). This makes underdetermination ubiquitous but philosophically shallow.
  *   **How DLU Avoids Triviality:** DLU explicitly **rejects the trivial adjustments** Quine exploits. By restricting permissible auxiliary adjustments to those compatible with the domain's PTCs, it:
      *   **Limits the Rival Pool:** Only rivals constructed *without violating the PTCs* are deemed legitimate contenders within the domain. Adding "gremlins" typically violates fundamental PTCs (e.g., about causality, energy conservation, or the nature of physical entities).
      *   **Grounds Assessment in Practice:** DLU reflects how science *actually works*. Scientists don't seriously entertain rivals violating their field's foundational principles during normal research. Trivial rivals are excluded by the *pragmatic* and *constitutive* role of PTCs.
      *   **Provides Non-Arbitrary Constraints:** The constraints aren't ad hoc; they arise from the successful, productive theoretical framework dominating the domain.

  **Anti-Realist Force vs. Pragmatic Selection:**
  *   **GQD & Anti-Realism:** GQD provides strong fuel for anti-realism (especially instrumentalism or constructivism). If *any* theory, no matter how intuitively implausible, *can* be made empirically adequate by sufficient auxiliary fiddling, then empirical adequacy alone cannot justify belief in a theory's truth. Reality underdetermines theory choice radically.
  *   **DLU's Weaker Anti-Realist Force:** DLU retains *localized* anti-realist force:
      *   **Within the Domain:** It shows that even *after* accepting the robust PTCs, empirical equivalence can persist for *core theoretical claims specific to the phenomena under investigation* (e.g., the nature of dark energy *given* GR and FLRW cosmology). We cannot know which of the *domain-permissible* rivals is true based on empirical data alone.
      *   **Collapse into Pragmatism?** It *partially* collapses into a pragmatic selection problem *relative to the PTCs*. Scientists must choose between empirically equivalent T1 and T2 based on non-empirical virtues (simplicity, explanatory power, coherence with other domains, fruitfulness). However, DLU highlights:
          *   **The Relativity of Choice:** The "best" choice is only best *given the accepted PTC framework*. Change the framework (e.g., abandon the cosmological principle), and the landscape of viable theories shifts dramatically.
          *   **Skepticism about Domain-Specific Ontology:** DLU supports skepticism about the *specific ontological commitments* of theories *within* the domain that go beyond the PTCs themselves, precisely because multiple, ontologically distinct options satisfy the data *and* the PTCs.
  *   **Conclusion:** DLU **does not** collapse into *mere* pragmatism. It retains anti-realist force regarding **theories *within* a framework**, demonstrating that PTCs alone are insufficient to uniquely determine ontology from evidence. However, it **defers radical global skepticism** by accepting the PTC framework as a provisional given.

  **Handling Observationally Equivalent Cosmological Models (Dark Energy Ontology):**
  *   **The Scenario:** Consider two cosmological models based on General Relativity (GR) and the Friedmann-Lemaître-Robertson-Walker (FLRW) metric (PTCs: GR validity, homogeneity/isotropy on large scales).
      *   **Model A:** Interprets the accelerating expansion parameter (Λ in ΛCDM) as a **Cosmological Constant** (vacuum energy density - a property of spacetime itself).
      *   **Model B:** Interprets the *same* parameter (mathematically identical in the Friedmann equations) as **Quintessence** (a dynamic scalar field permeating space).
      *   **Empirical Equivalence:** Both models predict *identical* expansion histories, distance-redshift relations, CMB power spectra, etc. – all current observables. They are **empirically equivalent** *under the shared PTCs* (GR + FLRW).
  *   **GQD Analysis:**
      *   Sees A and B as a prime example of global underdetermination.
      *   Emphasizes that one could *also* generate rivals by altering *other* auxiliaries (e.g., modifying gravity instead of adding dark energy, changing initial conditions, adding undetectable fields). The equivalence is just one instance of ubiquitous trivial underdetermination.
      *   Argues empirical equivalence *alone* motivates skepticism: We have no empirical reason to believe spacetime has a fundamental energy density (A) rather than there being a dynamic field (B).
  *   **DLU Analysis:**
      *   Recognizes A and B as a clear case of **domain-locked underdetermination**.
      *   **Scope:** The underdetermination exists *specifically within the domain defined by the PTCs* (GR + FLRW cosmology). Both models strictly adhere to these commitments.
      *   **Non-Triviality:** Constructing these rivals isn't trivial within the domain. They represent distinct, physically motivated extensions of the core framework respecting its principles. Proposals violating the PTCs (e.g., a model requiring violation of the FLRW metric's symmetries to explain acceleration, or abandoning GR) are *not* considered rivals *within this domain*.
      *   **Anti-Realist Force:** DLU affirms that, *given our commitment to GR+FLRW*, we cannot empirically determine whether the cause of acceleration is a constant (A) or a dynamic field (B). This justifies skepticism about the **specific ontological nature of the "dark energy" parameter** *within this framework*.
      *   **Pragmatic Selection:** Choosing between A and B becomes pragmatic (e.g., constant is simpler, dynamic field might offer better integration with particle physics). However, DLU highlights this choice is relative to the GR+FLRW framework. *If* compelling evidence arose forcing revision of a PTC (e.g., evidence against large-scale homogeneity), *then* the underdetermination between A and B becomes moot, and a different set of rivals (possibly including modified gravity) emerges.

  **Divergence on Empirical Equivalence & Skepticism:**
  *   **GQD:** Empirical equivalence *alone* is sufficient to motivate a strong, global skeptical conclusion. The existence of *any* empirically equivalent rival (no matter how trivial or bizarre, as long as logically possible) undermines the justification for believing any specific theory is true. Skepticism is radical and pervasive.
  *   **DLU:** Empirical equivalence *alone* is **not sufficient** for a skeptical conclusion within a domain. Skepticism requires empirical equivalence *among rivals that also satisfy the domain's non-negotiable PTCs*. Trivial rivals violating PTCs are dismissed. Thus:
      *   Skepticism is **localized** to the specific theoretical claims differentiating the domain-permissible rivals (e.g., the ontology of the dark energy parameter).
      *   Skepticism is **framework-relative**. It applies *only* under the assumption that the PTCs are correct. Challenging the PTCs themselves requires different considerations (anomalies, coherence with other domains, etc.).
      *   Empirical equivalence motivates skepticism **only when** it persists *despite* adherence to the domain's robust constraints.

  **In Summary:**

  | Feature              | Global Quine-Duhem (GQD)                           | Domain-Locked Underdetermination (DLU)              |
  | :------------------- | :------------------------------------------------- | :-------------------------------------------------- |
  | **Scope of Revision** | Unrestricted (any auxiliary adjustable)           | Restricted (must respect entrenched PTCs)           |
  | **Triviality (Quine)** | Vulnerable (trivial rivals always possible)       | **Avoids** (excludes trivial rivals violating PTCs) |
  | **Anti-Realist Force** | Strong, Global Skepticism                         | **Localized Skepticism** within the PTC framework   |
  | **Pragmatism**       | Not applicable (skepticism dominates)             | **Pragmatic selection** *among* PTC-compliant rivals |
  | **Cosmo Example**    | Equivalence exemplifies ubiquitous triviality     | Equivalence shows **non-trivial underdetermination under GR+FLRW** |
  | **Skepticism Trigger**| Empirical Equivalence **alone**                  | EE + **Adherence to Domain PTCs**                   |
  | **Ontology (Cosmo)** | Deep skepticism about *any* dark energy ontology  | Skepticism about *specific nature* (const vs. dyn) **given GR+FLRW** |

  DLU offers a more nuanced and scientifically grounded picture of underdetermination. It avoids the triviality of GQD by incorporating the constitutive role of theoretical frameworks in scientific practice, while still demonstrating that empirical data, even under robust constraints, often underdetermines the specific ontological details of our theories, supporting a localized, framework-relative anti-realism.
