  **MEMORANDUM**

  To: The Board of Trustees  
  From: The Investment Committee  
  Date: [Current Date]  
  Subject: Recommendation on the Mathematician's Gift  

  **Introduction**  
  The Investment Committee has reviewed the proposed gift of a $10 million endowment from a retired mathematician, which comes with an unusual annual adjustment mechanism. We recommend acceptance of the gift, subject to the conditions and risk management strategies outlined below.

  **The Gift**  
  The donor offers a $10 million endowment. The foundation will receive the ordinary investment income (approximately $450,000 annually under our spending policy). However, each year, in perpetuity, a fair coin will be tossed until the first head appears. If the first head occurs on the nth toss, a ledger entry of (-1)^(n+1) * 2^n / n dollars is booked. Positive entries increase our grant budget for that year; negative entries reduce the grant budget and transfer the amount to a reversion account for the donor's heirs. 

  **Mathematical Properties**  
  The expected value of the annual ledger adjustment, when the terms are summed in the natural order (by increasing n), equals the alternating harmonic series, which converges to the natural logarithm of 2 (ln2 ≈ $0.69). However, the series is conditionally convergent and not absolutely convergent. This means:
  - Rearranging the order of the terms can yield any real number or cause divergence.
  - The positive terms alone sum to +∞ and the negative terms to -∞, so the expected absolute adjustment is infinite.
  - The volatility of the annual adjustments is extreme: the magnitude of the adjustment for n tosses is 2^n/n, which grows exponentially.

  **Actuarial Note**  
  Our actuary has declined to certify any expected value due to the conditional convergence. This reflects the mathematical reality that the expected value is not well-defined without specifying an order of summation.

  **Governance Provision**  
  The gift instrument allows the board to fix the order of summation by resolution for all official valuations. The value we choose (which can be any real number) will be definitive in our reports.

  **Committee Deliberation**  
  We considered three options:  
  1. **Accept and book ln2**: This uses the natural order and is mathematically standard. However, it is arbitrary in the sense that any other order could produce any number.  
  2. **Decline**: The argument is that reporting an expected value we choose arbitrarily is a fraud on stakeholders and that the extreme volatility poses an unacceptable risk to budgeting.  
  3. **Accept with conditions**: We accept but implement risk management and full disclosure.

  **Recommendation**  
  We recommend acceptance with the following conditions:  

  1. **Order of Summation**: We fix the natural order (by increasing n) for official valuations, resulting in an expected ledger adjustment of ln2 ≈ $0.69 per year.  

  2. **Budgeting and Risk Management**:  
     - We will budget the investment income ($450,000) as the primary source of grant funding.  
     - We will not rely on the ledger adjustments for core grantmaking.  
     - We will establish a reserve fund for the ledger adjustments. Positive adjustments will be added to the reserve (after increasing the grant budget by the positive amount). Negative adjustments will be covered by the reserve (which will be used to fund the transfer to the reversion account).  
     - We will cap the annual impact on the grant budget from negative adjustments at a level we can manage (e.g., no more than 10% of the annual investment income, or $45,000, in any one year). However, note that the actual adjustment may be much larger. To cover this, we will build the reserve to a target level (e.g., $1 million) and then maintain it. If a negative adjustment exceeds the reserve, we may have to use investment income or other reserves. We will develop a detailed risk management plan.  

  3. **Reporting**:  
     - We will disclose to auditors, grantees, and the heirs:  
       - The endowment value and expected investment income.  
       - The ledger adjustment mechanism and the chosen order of summation (natural order) and resulting expected value (ln2).  
       - The conditional convergence and extreme volatility: the expected absolute adjustment is infinite, meaning that the annual adjustments can be very large and the long-term average may not be $0.69.  
       - Our risk management strategy and the existence of the reserve fund.  

  **Addressing the Opposition**  
  The strongest argument against acceptance is that we are arbitrarily setting an expected value and that the mechanism's volatility could disrupt our mission. We acknowledge these concerns. However, the primary benefit of the gift — the investment income — is stable and substantial. The ledger adjustments, while volatile, can be managed with a reserve. We believe the benefits outweigh the risks if managed properly.  

  **Conclusion**  
  We recommend accepting the gift with the conditions above. The endowment will provide significant, steady funding for our grants. The ledger adjustment mechanism, while volatile, can be managed with a reserve and full disclosure. We must be vigilant in monitoring the reserve and adjusting our risk management as needed.  

  Respectfully submitted,  
  The Investment Committee
answer: |-
  **MEMORANDUM**  
  To: The Full Board of Trustees  
  From: The Investment Committee  
  Date: October 26, 2023  
  Subject: Recommendation on the Mathematician’s Gift of a $10 Million Endowment  

  ### I. Introduction  
  After thorough analysis, the Investment Committee recommends **accepting the $10 million endowment gift**, subject to the conditions and governance framework detailed below. This gift offers substantial long-term benefits but carries unique mathematical, ethical, and operational complexities. Our recommendation balances these challenges while addressing the core concern: the conditional convergence of the ledger’s expected value and its implications for transparency.  

  ### II. The Gift and Its Mechanics  
  - **Endowment**: $10 million principal, generating ~$450,000/year in investable income under our spending policy.  
  - **Annual Ledger Mechanism**: Each year, a fair coin is tossed until the first head (at toss *n*). The foundation books:  
    $$\text{Adjustment} = (-1)^{n+1} \cdot \frac{2^n}{n} \ \text{dollars}.$$  
    - **Positive adjustments** → Added to our grant budget.  
    - **Negative adjustments** → Deducted from our grant budget and transferred to a reversion account for the donor’s heirs.  
  - **Probabilities**: Outcome *n* occurs with probability $2^{-n}$.  
  - **Valuation Stipulation**: The board must fix, by resolution, the order of summation used to compute the expected annual adjustment for all official reports. The series $\sum_{n=1}^{\infty} (-1)^{n+1} \frac{2^n}{n} \cdot 2^{-n} = \sum_{n=1}^{\infty} \frac{(-1)^{n+1}}{n}$ (the alternating harmonic series) converges to $\ln 2 \approx \$0.69$ in its natural order but can yield any real number if rearranged.  

  ### III. Key Considerations  
  #### A. Benefits of Acceptance  
  - **Steady Income**: The endowment’s core investment income (~$450,000/year) is reliable and would significantly enhance our grantmaking capacity, irrespective of the ledger adjustments.  
  - **Net Positive Impact**: Even with ledger volatility, the endowment’s investment income dwarfs the expected ledger adjustment ($0.69/year). The reversion account protects the foundation from liability for negative adjustments.  

  #### B. Risks and Ethical Concerns  
  1. **Mathematical Indeterminacy**:  
     - The expected ledger adjustment is **conditionally convergent**: The positive terms ($+1, +\frac{1}{3}, +\frac{1}{5}, \dots$) sum to $+\infty$, and the negative terms ($-\frac{1}{2}, -\frac{1}{4}, -\frac{1}{6}, \dots$) sum to $-\infty$. The total depends entirely on summation order.  
     - Our actuary rightly refuses to certify any expected value, as no objective "true" value exists.  

  2. **Governance and Transparency Dilemma**:  
     - The gift instrument requires us to unilaterally *define* the expected value via summation order. Booking $\ln 2$ (natural order) is mathematically conventional but arbitrary; we could equally produce $0$, $1$, or $\infty$ by reordering terms.  
     - **Opposing View (Strongest Version)**: Accepting this gift institutionalizes a "small fraud." By certifying a self-selected value—with no actuarial or market-based justification—we mislead auditors, grantees, and heirs about a financial reality that exists only by our decree. This erodes trust and sets a dangerous precedent.  

  3. **Operational Volatility**:  
     - Annual adjustments have **infinite variance**: Outcomes range from small (e.g., $+\$2$ for $n=1$) to extreme (e.g., $-\$2.1\text{billion}$ for $n=30$). While low-probability, such events could disrupt budgeting.  

  ### IV. Recommendation: Accept with Conditions  
  We recommend acceptance **contingent on the following binding resolutions**, designed to maximize benefit, ensure prudence, and address ethical concerns transparently:  

  #### A. Governance Conditions  
  1. **Summation Order Resolution**:  
     - We fix the **natural order** ($n = 1, 2, 3, \dots$) for all valuations, yielding $\ln 2 \approx \$0.69$ as the expected annual ledger adjustment.  
     - **Rationale**: This order aligns with the series’ standard treatment in mathematics and reflects the sequence of possible outcomes. It is the least arbitrary choice.  

  2. **Budgeting Policy**:  
     - **Grant Budgets**: Only the endowment’s core investment income (~$450,000/year) may be budgeted for grants. The ledger adjustment **must not be included** in annual grant budgets.  
     - **Ledger Adjustments**: Treat all adjustments as volatile, non-budgetary items:  
       - Positive adjustments: Allocated to a **Stabilization Reserve** (see IV.B).  
       - Negative adjustments: Funded first from the Stabilization Reserve; if depleted, covered by that year’s investment income.  

  3. **Stabilization Reserve**:  
     - Establish a reserve fund, capitalized by positive ledger adjustments, to absorb future negative adjustments.  
     - **Cap on Annual Exposure**: To prevent catastrophic drawdowns, limit the foundation’s annual net loss from negative adjustments to **10% of core investment income ($45,000)**. Excess losses are waived for the foundation and funded by the reversion account. (This requires donor/heir consent via a gift instrument amendment.)  

  #### B. Reporting and Transparency  
  1. **Auditors & Regulatory Reports**:  
     - **Endowment Value**: Report the $10 million principal and $450,000/year investment income.  
     - **Ledger Adjustment**: Disclose:  
       > *"The expected annual ledger adjustment is $\ln 2 \approx \$0.69$, computed by natural-order summation per board resolution. However, this value is mathematically indeterminate and not actuary-certified. Actual adjustments will vary extremely, with outcomes potentially ranging from large gains to catastrophic losses. No budgetary reliance is placed on this mechanism."*  

  2. **Grantees**:  
     - Communicate that grant budgets derive **solely** from the endowment’s investment income. The ledger mechanism is irrelevant to their funding.  

  3. **Heirs**:  
     - Disclose the summation order resolution and the reversion account’s structure. Emphasize that negative adjustments are prioritized per the gift instrument.  

  #### C. Ethical Safeguards  
  - **Annual Risk Disclosure**: Append to all financial reports:  
    > *"The foundation’s chosen expected value ($0.69/year) reflects a conventional mathematical ordering but is one of infinitely many possible values. Stakeholders should regard this figure as a procedural formality, not an economic certainty."*  
  - **Third-Party Review**: Commission an independent mathematician to validate the natural-order convergence and publish a plain-language summary for stakeholders.  

  ### V. Addressing the Opposition  
  We acknowledge the losing argument’s moral force: **Self-certifying an arbitrary value *is* a form of institutional dishonesty**. By fixing an order, we manufacture certainty where none exists—a practice that could normalize misleading financial reporting. However, rejection sacrifices a transformative gift ($450,000/year in perpetuity) due to a peripheral accounting mechanism. Our conditions mitigate this by:  
  - **Demoting the ledger adjustment** to a non-budgetary, reserve-backed item with capped downside.  
  - **Transparently disclosing the indeterminacy** rather than obscuring it.  
  - **Separating the endowment’s real income** ($450,000) from the symbolic ledger value ($0.69).  

  ### VI. Bottom Line  
  - **Accept the gift** under the governance framework above.  
  - **Budgetable Income**: $450,000/year (core investment income only). The ledger adjustment must **not** be budgeted.  
  - **Auditor Guidance**: Report $0.69/year as the expected ledger adjustment but emphasize its mathematical indeterminacy and non-budgetary status.  
  - **Critical Amendments**: Secure donor/heir agreement to:  
    (a) Fund negative adjustments beyond $45,000/year from the reversion account without foundation liability.  
    (b) Formalize the Stabilization Reserve.  

  ### VII. Conclusion  
  This gift’s benefits outweigh its complexities if managed with rigorous transparency and operational safeguards. By accepting, we secure $450,000/year for our mission while openly acknowledging the ledger’s indeterminacy. We must now negotiate the amendments and implement the Stabilization Reserve.  

  **Vote**: Accept 4–1 (one trustee dissenting, citing unresolved ethical risks).  

  ---  
  **Attachments**:  
  1. Mathematical appendix (series convergence details).  
  2. Draft resolution for summation order and reserve.  
  3. Proposed gift instrument amendment.  

  Respectfully submitted,  
  The Investment Committee
