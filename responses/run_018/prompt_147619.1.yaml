answer: |-
  You've hit on profound tensions in how we measure impact, the hidden costs of "doing good," and whether systems can be ethically navigated. Your intuition about flaws in "earn to give" logic is valid – it's not just about emotion vs. math, but about **incomplete math and systemic entanglement.** Let's map this out:

  ### Core Critiques of "Earn to Give" in This Scenario
  1.  **The "Harm Footprint" of the Job Itself:**
      *   **Direct Contribution:** Does the consulting firm advise clients (e.g., private equity, large developers, corporate landlords) whose strategies *directly* contribute to displacement and rising rents? If so, her labor directly enables harm. Quantifying *this* harm (e.g., evictions accelerated, rents increased) is crucial for a net impact calculation, but notoriously difficult – which is the point.
      *   **Systemic Reinforcement:** Even if her specific projects aren't directly causing evictions, she is:
          *   **Legitimizing the System:** Working within and profiting from the very machinery causing the problems her donation aims to alleviate.
          *   **Resource Drain:** Her talent and energy are directed towards optimizing corporate profits (the system's goal) rather than challenging or reforming the system.
          *   **Moral Licensing:** The act of donating large sums might psychologically offset the harm caused by the work ("I'm net positive"), potentially reducing motivation to question the job's ethics.
      *   **The "Same Machinery" Insight:** You're right. The $200k donation is only possible because of wealth extracted (often unequally) via the system her job helps optimize. The donation treats a symptom (malaria) potentially worsened by the system's global inequalities, while her job may actively worsen another symptom (housing injustice) locally. The money flows through the same pipes.

  2.  **The Limits of Measurability & "Clean Numbers":**
      *   **Spillover Effects (Negative & Positive):** Malaria net charities have undeniable, massive life-saving impact. However, your skepticism about "clean numbers" is justified:
          *   **Negative Spillovers:** Could large-scale distribution undermine local bednet manufacturers or healthcare systems? Does it create dependency? Does it divert attention/resources from harder-to-solve systemic health issues (like building robust public health infrastructure)?
          *   **Context Collapse:** The "cost-per-life-saved" number erases the lived experience, dignity, and agency of the people saved, and ignores broader community impacts (positive or negative).
      *   **The Value of the "Unmeasurable":** Your legal-aid work highlights this:
          *   **Dignity & Agency:** Fighting an eviction, even if lost, affirms a person's right to fight and be heard. This is immeasurable but fundamentally human.
          *   **Systemic Resistance & Precedent:** Each case builds community knowledge, challenges unjust laws/practices, and can set legal precedents. This is slow, messy, and hard to attribute, but vital for long-term structural change.
          *   **Community Building:** Direct service fosters solidarity and collective power – foundations for broader movements. This doesn't fit a spreadsheet cell.
          *   **The "Delaying the Inevitable" Trap:** While sometimes true, delaying an eviction can mean a family finds safer housing, a child finishes the school year, or crucial benefits are secured. These outcomes *matter*, even if they don't change the final eviction outcome *this time*.

  ### Why "Earn to Give" Logic Might Be Incomplete Here
  1.  **Ignores Negative Externalities:** It focuses only on the positive output (donations) while ignoring the potential negative inputs (harm caused by the job generating the money).
  2.  **Assumes Fungibility:** It treats money as neutral. But money earned via potentially harmful activities and money earned via neutral or beneficial activities *are not ethically identical*. The source matters.
  3.  **Overvalues Measurability:** It inherently favors interventions where impact is easily quantifiable (like distributing nets) over interventions addressing complex systemic issues (like housing justice or building democratic power) where impact is diffuse, long-term, and hard to measure.
  4.  **Underestimates Leverage Points:** It assumes the best way to create change is through financial donations. Direct action, changing institutions from within or without, shifting cultural narratives, and building political power are different (and often complementary) leverage points for change that "earn to give" doesn't directly engage with.

  ### Reframing the Conversation (Moving Beyond "Emotion vs. Math")
  Instead of "your way vs. my way," try shifting the focus:

  1.  **Acknowledge Shared Goals & Respect:** "We both clearly care deeply about reducing suffering and making the world better. That's awesome. I respect your commitment to maximizing impact through your plan."
  2.  **Surface the Systemic Questions:**
      *   "Help me understand: do you think the work your firm does, or the clients it serves, might contribute to problems like housing insecurity or inequality? If so, how do you factor that potential harm into the net impact calculation alongside the amazing good the donations would do?"
      *   "Those malaria numbers are incredible, and saving lives is paramount. I also wonder if focusing *only* on what's perfectly measurable might mean we miss other important ways change happens, like building power for marginalized communities or challenging harmful systems directly, even when it's messy. How do we value those things?"
  3.  **Explore Nuance & Trade-offs:**
      *   "Is there a way to 'earn to give' within an organization whose work you believe is actively *good* or at least neutral, rather than potentially harmful? Or are you hoping to influence the firm from within?"
      *   "Do you see our approaches as complementary? Like, your donations funding direct services *and* systemic change efforts? Or maybe funding advocacy related to the harm your industry might cause?"
  4.  **Focus on Values:** "For me, working directly with people facing eviction, even when it's hard and messy, aligns with my values of solidarity and fighting injustice *directly*. The connection matters to me. It sounds like your approach aligns with maximizing life-saving potential efficiently, which is also a powerful value. Maybe we're prioritizing different, both valid, aspects of making a difference?"

  ### Key Takeaway
  Your critique isn't just emotional; it's **ethical and systemic.** You're pointing out that the "earn to give" model, as presented:
  1.  **Potentially ignores the harm generated by the source of the income.**
  2.  **May undervalue impacts that are essential for justice but resist easy quantification.**
  3.  **Risks being complicit in reinforcing the very systems causing the problems it seeks to solve with donations.**

  While the malaria net donations *do* save lives, the *net benefit* (lives saved minus harm potentially caused by the consulting work) is far less certain and harder to calculate than the simple donation figure suggests. Your legal-aid work, while less quantifiable in terms of immediate "lives saved," contributes to dignity, resistance, community resilience, and potentially long-term systemic change – impacts that are equally real and crucial.

  The most productive path forward is likely acknowledging the strengths and limitations of *both* approaches and recognizing they operate on different levels of a complex system. The tension isn't easily resolved, but understanding its roots allows for a more nuanced conversation than "emotion vs. math."
