answer: |-
  **Ethics Seminar Take-Home Exam: Moral Uncertainty & Incommensurable Values**

  **Time Allowed:** 45 Minutes  
  **Total Marks:** 25  
  **Instructions:** Answer the following question. This is a closed-book exam; no external resources are permitted. Focus on analysis and argument. Get straight to the point.

  **Essay Question:**  
  Imagine a situation where you must choose between preventing a significant violation of a strict deontological constraint (e.g., directly causing one innocent person's death) and preventing a large-scale welfare catastrophe (e.g., allowing hundreds to suffer severe, irreversible harm short of death). Explain the core challenge this poses for decision-making under moral uncertainty, focusing specifically on the *incommensurability* between the lexical priority often given to deontological constraints and the cardinal, aggregative nature of welfare scales. Why do attempts to simply "weigh" these concerns against each other fail conceptually? Briefly evaluate one strategy (e.g., structural uncertainty, myopic choice, satisficing) someone might use to navigate this clash, highlighting its significant limitations. Don't just describe the theories – grapple with the *incommensurability* itself.

  ---

  **Model Answer (Illustrative):**

  This scenario presents a brutal clash of incommensurable moral metrics. The deontological constraint (don't directly kill an innocent) demands absolute lexical priority; violating it is categorically wrong, irrespective of consequences. Conversely, the welfare scale measures harm in cardinal units – hundreds suffering severe harm seems quantifiably worse than one death. The core problem is there's no common currency for comparison. Lexical priority resists trade-offs by definition; you can't meaningfully say "how much" welfare catastrophe "equals" breaching the constraint. Trying to weigh them treats deontology like a very heavy weight on a welfare scale, but this fundamentally misrepresents it. Deontology isn't just *heavy* welfare – it operates on a different logical plane (forbidden vs. permissible), making conversion impossible.

  Faced with this, someone might adopt a *myopic* strategy: focus only on the most immediate, salient duty – perhaps the direct prohibition against killing. This avoids the impossible comparison. However, this limitation is severe: it wilfully ignores the enormous, foreseeable welfare catastrophe, arguably committing a grave moral error by omission. It privileges one type of moral reason (prohibitive) entirely over another (beneficent), failing to genuinely engage with the uncertainty of which metric *truly* governs the situation. The 'moral residue' – the nagging sense the welfare catastrophe *should* have mattered – highlights the strategy's inadequacy in resolving the deep uncertainty stemming from fundamental incommensurability.

  ---

  **Marking Scheme (25 Marks Total):**

  1.  **(5 marks)** Accurately identifies and explains the *incommensurability* between the lexical structure of the deontological constraint and the cardinal/aggregative nature of welfare consequences as the central challenge, moving beyond simply stating they conflict.
  2.  **(5 marks)** Clearly articulates why attempts to directly "weigh" or "trade-off" the constraint violation against welfare units fail conceptually, demonstrating understanding that lexical priority excludes quantitative balancing by its nature.
  3.  **(5 marks)** Provides a plausible evaluation of one strategy (e.g., myopic choice, structural uncertainty, satisficing) for navigating the clash, focusing on its *limitations* specifically in addressing the incommensurability (not just general pros/cons).
  4.  **(5 marks)** Engages meaningfully with the difficulty of decision-making and the potential for "moral residue" or lingering doubt arising *from* the fundamental incommensurability of the underlying values/metrics.
  5.  **(5 marks)** Uses key concepts (lexical priority, cardinal scales, incommensurability, moral uncertainty) precisely and coherently throughout the answer, demonstrating technical grasp without unnecessary jargon.
