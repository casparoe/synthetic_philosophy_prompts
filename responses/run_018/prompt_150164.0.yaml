prompt: |-
  Draft the joint statement of an adversarial collaboration between two camps that have argued past each other on the common prior assumption. The first camp—Common-Prior Rationalists—holds that rational agents with identical information and a shared prior must converge in belief, that Aumann-style agreement theorems are normative constraints rather than mere formalities, and that persistent disagreement about fundamental matters therefore traces to hidden information asymmetry or to a failure of rational updating. The second camp—Prior-Pluralist Epistemologists—holds that rational agents can maintain genuinely different prior probabilities that are not reducible to private information, especially in normative, metaphysical, and ontologically underdetermined domains, and that requiring a common prior risks collapsing substantive disagreement into a diagnosis of cognitive error.

  Produce the document they should have signed together. Include, first, a numbered section of agreed claims about belief updating, the formal conditions under which agreement theorems operate, and the acknowledged limits of those theorems—claims precise enough to be useful but not so anodyne that either side could not endorse them. Second, present the residual disagreements in neutral wording: a table or separated list in which each side’s view is stated so that its proponents would accept the formulation of their own position, distinguishing genuine conflicts from verbal ones. Third, identify the cruxes—sub-questions such that settling one would move at least one camp—including specifically whether normative and interpretive priors fall within the scope of agreement results, and whether agents who share all empirical data but assign different prior weights to theoretical virtues (explanatory depth, ontological parsimony) are in rational divergence or rational error. For each crux, supply one concrete case or argument both sides agree bears on it; include, as one such case, two cosmologists interpreting identical cosmic microwave background measurements but assigning different priors to multiverse-generating mechanisms versus single-universe explanations in a regime where neither ontology is empirically accessible, and record each side’s explicit prediction or interpretation of what that case shows. Separate what is settled in the formal literature from what remains genuinely contested among people who understand both the mathematics and the philosophy, and do not present any contested interpretation of Bayesian rationality or of agreement theorems as the consensus view. Write the response in American English.
reasoning: |-
  We are drafting a joint statement between two camps: Common-Prior Rationalists (CPR) and Prior-Pluralist Epistemologists (PPE). The statement has three parts: 
   1. Agreed claims (numbered list)
   2. Residual disagreements (table or separated list, neutral wording, each side's view as they would accept it)
   3. Cruxes (sub-questions that would move at least one camp if settled) with concrete cases and each side's interpretation.

  Key points from the camps:
   - CPR: Rational agents with same information and common prior must converge. Persistent disagreement is due to information asymmetry or irrationality.
   - PPE: Rational agents can have different priors (especially in normative, metaphysical, underdetermined domains). Common prior requirement risks misdiagnosing substantive disagreement as cognitive error.

  Part 1: Agreed Claims
  We list points that both sides endorse, about belief updating, formal conditions of agreement theorems, and their limits.

  1. **Agreement Theorems Formally Require Common Priors**: The mathematical results of Aumann (1976) and subsequent agreement theorems hold under the formal assumptions, including that agents have a common prior, update by conditioning, and have common knowledge of their posteriors. Without a common prior, the theorems do not force agreement.

  2. **Rational Updating by Conditioning**: When rational agents receive new information, they update their beliefs by Bayes' rule (conditioning on the evidence). Both camps agree that this is the normative standard for updating in light of new information.

  3. **Common Priors as an Idealization**: The common prior assumption (CPA) is a useful idealization in many contexts, especially in settings of well-defined common knowledge and shared background (e.g., some games, scientific communities with shared training). However, both camps acknowledge that the CPA may not hold universally.

  4. **Disagreement Can Arise from Information Asymmetry**: In the absence of a common prior, or even with a common prior, if there is private information that is not shared (or not commonly known to be shared), rational agents may disagree. However, the camps disagree on whether this is the only source of persistent rational disagreement (see residual disagreements).

  5. **Limits of Agreement Theorems in Underdetermined Domains**: Agreement theorems do not directly apply to domains where the evidence is underdetermining (i.e., multiple hypotheses are consistent with the evidence). In such cases, even with a common prior, agents may have different posteriors if they condition on different aspects of the evidence (but note: if they condition on the same evidence and have common prior, they must agree). However, the camps also note that the interpretation of "the same evidence" may be contested in complex cases.

  6. **Common Knowledge Requirement is Stringent**: The requirement of common knowledge of posteriors (as in Aumann's theorem) is a very strong condition that is rarely met in practice. Therefore, the theorem does not imply that real-world disagreements are necessarily irrational.

  Part 2: Residual Disagreements
  We present a table with two columns: one for CPR and one for PPE. Each row is a point of disagreement.

  | Common-Prior Rationalists (CPR) | Prior-Pluralist Epistemologists (PPE) |
  |---------------------------------|---------------------------------------|
  | Persistent disagreement about fundamental matters (e.g., in metaphysics or ethics) among rational agents who have shared all relevant information must be attributed to either (a) residual private information that has not been fully shared or (b) a failure of rationality (including improper updating). | Rational agents can maintain persistent disagreement even after sharing all relevant information and updating rationally, because they may start from genuinely different prior probabilities. This is especially true in domains that are underdetermined by evidence (e.g., metaphysics) or involve normative judgments. |
  | The common prior assumption is a normative constraint: rational agents ought to share a common prior. Therefore, when two rational agents with the same background information (and no private information) assign different priors to the same event, at least one is making a cognitive error. | The common prior assumption is not a universal normative constraint. Rational agents can have different priors without cognitive error, especially when the prior reflects non-empirical considerations (e.g., aesthetic, metaphysical, or normative commitments) that are not determined by evidence. |
  | In cases of persistent disagreement, the burden of proof lies with the agents to show that they have indeed shared all information and updated correctly. If they have, then they must converge. | In cases of persistent disagreement, it is possible that the agents have shared all information and updated correctly, and the divergence is due to legitimate differences in prior probabilities. The burden of proof does not necessarily lie with the agents to prove they have shared everything; it may be that the domain admits of multiple rational starting points. |

  Part 3: Cruxes

  We list the cruxes, each with a concrete case and each side's interpretation.

  **Crux 1: Do normative and interpretive priors fall within the scope of agreement results?**
  - *Concrete Case*: Two philosophers, Alice and Bob, are discussing the existence of moral facts. They have read the same literature and have the same empirical knowledge about human behavior and cultural variation. Alice assigns a high prior to moral realism (that there are objective moral facts) and Bob assigns a low prior. They update on the same evidence (e.g., the existence of moral disagreement across cultures) and still disagree.
    - **CPR**: This disagreement must be due to either (a) private information (e.g., one has had a personal experience that the other hasn't shared) or (b) irrational updating. If they have truly shared all information and updated correctly, they must converge. The difference in priors is a cognitive error: at least one has an improper prior.
    - **PPE**: Alice and Bob can rationally maintain their disagreement because the domain is underdetermined and their priors reflect different non-empirical commitments (e.g., Alice's prior is influenced by her commitment to the intelligibility of moral discourse, while Bob's by his naturalistic worldview). The disagreement is rational and not reducible to information asymmetry or error.

  **Crux 2: Are agents who share all empirical data but assign different prior weights to theoretical virtues (explanatory depth, ontological parsimony) in rational divergence or rational error?**
  - *Concrete Case*: Two cosmologists, Dr. Smith and Dr. Jones, interpret identical cosmic microwave background (CMB) measurements. The data is consistent with both a multiverse-generating mechanism (which Smith favors) and a single-universe explanation (which Jones favors). In the current state of cosmology, neither ontology is empirically accessible beyond the CMB data. Smith assigns a high prior to multiverse theories because she values explanatory breadth (the multiverse explains why our universe has its constants), while Jones assigns a low prior because he values ontological parsimony and sees the multiverse as speculative.
    - **CPR**: The difference in prior weights (explanatory breadth vs. parsimony) is not a legitimate basis for divergent priors. Rational agents should have a common prior that weighs theoretical virtues in the same way. Therefore, the disagreement must be due to either (a) private information (e.g., one has access to a mathematical result the other hasn't considered) or (b) irrationality. If they have shared all information and updated correctly, they must agree on the posterior.
    - **PPE**: The assignment of weights to theoretical virtues is itself a matter of prior judgment that can vary rationally. Smith and Jones are both rational, and their continued disagreement is legitimate because the domain is underdetermined and their prior weights reflect different epistemic values. There is no cognitive error.

  **Crux 3: Is the common prior a requirement of rationality or an idealization that may not hold in all domains?**
  - *Concrete Case*: Consider two rational agents who have grown up in different intellectual traditions (e.g., one in a tradition that emphasizes mathematical beauty in physical theories, the other in a tradition that emphasizes empirical adequacy above all). They are presented with a new theory that is mathematically elegant but not yet tested. They assign different prior probabilities to the theory being correct.
    - **CPR**: The agents, being rational, should be able to reconcile their priors by recognizing that their different backgrounds have given them different private information. Once they share all information (including the reasons for their aesthetic and methodological commitments) and update correctly, they will converge. If they do not, it is because they have not fully shared or properly updated.
    - **PPE**: The agents' prior probabilities are shaped by their intellectual traditions, which are not reducible to private information that can be fully shared. Even after exchanging their reasons, they may still have different priors because the weighting of factors (like mathematical beauty) is a foundational commitment. This is a rational divergence.

  Finally, we note what is settled and what is contested:

  - **Settled**: The formal agreement theorems (like Aumann's) require a common prior and common knowledge of posteriors to force agreement. Without these, the theorems do not apply. Also, Bayesian updating by conditioning is the standard for rational updating.

  - **Contested**: Whether the common prior is a universal normative requirement, whether rational agents can have different priors in underdetermined domains without cognitive error, and whether the assignment of prior weights to theoretical virtues is subject to rational constraint.

  The joint statement is as follows:
answer: |-
  ### Joint Statement: Adversarial Collaboration on Common Priors and Rational Disagreement  
  **Parties:**  
  - **Common-Prior Rationalists (CPR)**: Hold that rational agents with identical information and a shared prior must converge in belief, per Aumann-style agreement theorems. Persistent disagreement implies hidden information asymmetry or irrational updating.  
  - **Prior-Pluralist Epistemologists (PPE)**: Hold that rational agents can maintain divergent prior probabilities—especially in normative, metaphysical, or underdetermined domains—without information asymmetry or irrationality. Requiring a common prior risks pathologizing substantive disagreement.  

  This document outlines areas of consensus, residual disagreements, and cruxes for further inquiry. Both camps affirm the formal validity of Bayesian belief updating and Aumann’s agreement theorem under specified conditions but diverge on their normative scope and applicability.  

  ---

  ### 1. Agreed Claims  
  The undersigned endorse the following precise, non-anodyne claims:  

  1. **Belief Updating Norm**: Rational agents update beliefs via strict Bayesian conditioning when presented with new information. Failure to condition correctly constitutes a rational error.  
  2. **Formal Conditions for Agreement Theorems**: Aumann’s theorem (1976) *formally* implies that two rational agents with a *common prior* and *common knowledge of each other’s posteriors* must converge to identical beliefs. This holds regardless of computational limitations.  
  3. **Common Prior as Contingent**: The common prior assumption (CPA) is a formal idealization, not an empirical claim about real agents. Its applicability depends on context (e.g., well-defined games with symmetric information), and it is neither universally true nor false of human cognition.  
  4. **Information Asymmetry as a Source of Disagreement**: If agents possess private information not fully exchanged—or if there is ambiguity about what constitutes "identical information"—rational disagreement can persist even with a common prior.  
  5. **Limits of Agreement Theorems**:  
     - Agreement theorems do *not* apply when agents lack common knowledge of posteriors, operate with incomplete models, or face indeterminate evidence (e.g., non-measurable events).  
     - The theorems are silent on *how* priors ought to be formed; they assume priors as given.  
  6. **Underdetermination Acknowledged**: In domains where evidence cannot discriminate between hypotheses (e.g., metaphysical interpretations of quantum mechanics), Bayesian updating may not force consensus *even with a common prior*. Divergence here stems from differing likelihood assessments or model structures, not prior probabilities alone.  

  ---

  ### 2. Residual Disagreements  
  The table below states each camp’s position verbatim, using neutral language endorsed by proponents. Disagreements are substantive unless marked as verbal.  

  | Common-Prior Rationalists (CPR) | Prior-Pluralist Epistemologists (PPE) |  
  |----------------------------------|---------------------------------------|  
  | **On rational disagreement**: Persistent disagreement among agents who claim to share identical information and update rationally *must* indicate (a) undetected information asymmetry, (b) computational/updating failures, or (c) incomplete knowledge exchange. Genuine prior divergence is irrational. | **On rational disagreement**: Rational agents with identical information and updating can persistently disagree if they hold divergent priors, especially in domains where evidence underdetermines theory (e.g., ontology). Such divergence is not reducible to information gaps or error. |  
  | **On common priors**: CPA is a *normative constraint*: rational agents with identical background knowledge ought to share priors. Prior differences reflect cognitive bias or insufficiently shared evidence. | **On common priors**: CPA is a *descriptive idealization* with limited normative force. Rational priors can vary due to legitimate differences in theoretical virtues (e.g., simplicity weights) or interpretive frameworks, without cognitive error. |  
  | **On scope of agreement theorems**: Agreement theorems normatively bind *all* rational agents, including in interpretive domains (e.g., ethics). Priors for such domains *must* converge if backgrounds are symmetric. | **On scope of agreement theorems**: Agreement theorems apply only to empirical domains with objective likelihoods. In normative/interpretive domains, priors are expressions of irreducible epistemic values; demanding convergence here misapplies formal results. |  
  | **Verbal disagreement**: "Rationality" in updating excludes prior formation. CPA violations are errors in *belief architecture*, not necessarily in reasoning. | **Verbal disagreement**: "Rationality" includes prior formation. Priors reflect agent-relative epistemic values, so CPA violations are not errors but features of pluralism. |  

  ---

  ### 3. Cruxes  
  Cruxes are sub-questions whose resolution would shift at least one camp’s position. Each includes a concrete case and explicit predictions.  

  #### Crux 1: Do normative/interpretive priors fall within the scope of agreement theorems?  
  - **Case**: Two moral philosophers with identical knowledge of human behavior/cultural history assign priors to *moral realism*. After sharing all arguments and updating, they disagree.  
  - **CPR Prediction**: Disagreement *must* trace to unshared private experiences (e.g., intuitions) or updating errors. With full transparency, priors *would* converge.  
  - **PPE Prediction**: Priors reflect divergent epistemic values (e.g., weight given to intuitions vs. social cohesion). This is irreducible rational pluralism.  

  #### Crux 2: Are divergent weights on theoretical virtues (e.g., simplicity, explanatory depth) rational error or divergence?  
  - **Case**: Two cosmologists interpret identical CMB data. Dr. A assigns a high prior to a multiverse theory (valuing explanatory breadth); Dr. B assigns a high prior to a single-universe theory (valuing parsimony). Neither ontology is testable.  
  - **CPR Prediction**: Assigning different weights to virtues *is* cognitive error. Rational agents sharing data *must* reconcile weights via further dialogue, converging to one prior.  
  - **PPE Prediction**: Weighting virtues is prior-dependent and underdetermined. Both positions are rational; disagreement persists legitimately.  

  #### Crux 3: Can shared empirical data force prior convergence in underdetermined domains?  
  - **Case**: Two scientists assess a theory of consciousness. They agree on all neural data but split on prior probabilities due to divergent metaphysical commitments (physicalism vs. panpsychism).  
  - **CPR Prediction**: Metaphysical commitments reduce to implicit empirical assumptions. Full information exchange *would* align priors.  
  - **PPE Prediction**: Commitments reflect foundational worldviews; no amount of data bridges this gap without circularity.  

  ---

  ### Settled vs. Contested  
  - **Settled (Formal Consensus)**:  
    - Aumann’s theorem holds under CPA + common knowledge of posteriors.  
    - Bayesian conditioning is the exclusive updating rule for rational agents.  
    - Private information *can* cause disagreement even with CPA.  
  - **Genuinely Contested**:  
    - Whether CPA is a universal norm of rationality.  
    - Whether "identical information" includes interpretive frameworks.  
    - Whether theoretical virtues admit objective weighting.  

  ---  
  **Signed,**  
  [Representative of CPR Camp]  
  [Representative of PPE Camp]  
  *Date*: October 26, 2023  

  ---  
  **Note**: This statement reflects unresolved tensions. Both camps urge caution in applying formal agreement theorems beyond their mathematical premises and commit to empirical testing of cruxes (e.g., via psychology of prior formation).
