  Also, the user might be concerned about accountability. In Orwell's time, it was clear who was responsible (the Party). Now, it's decentralized: developers, corporations, users. Orwell would likely criticize the lack of conscious intent but still condemn the outcome. The erosion of meaning without active conspiracy is still perilous because it stifles critical thought.

  Need to emphasize that Orwell’s main issue was the effect on thought. Whether intentional or not, if language tools limit expression, they enable political evasion. The user’s mention of "corruption that just happens" touches on systemic problems versus individual malice. Here, the answer is that systems designed without foresight can be just as harmful.

