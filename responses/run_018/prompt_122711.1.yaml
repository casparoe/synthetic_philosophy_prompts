  I should also address if such a case can't be built, but I think it can. The premise that fails is the universality of Grice's tests—they assume a homogeneous context, but institutional practices add layers. Conceding this makes the theory more robust without losing its core.
answer: |-
  Below is a constructed case drawn from academic letters of recommendation, analyzed against Grice's tests for conversational implicature. I argue that the case exposes a tension where **calculability fails** due to reliance on institutional norms, while **cancellability and intention-recognition remain binding** within the practice. I then resolve the tension by proposing that calculability must incorporate *localized normative expectations*, and defend why this does not collapse implicature into convention or "what is said."

  ---

  ### **The Case: The Damning Faint-Praise Letter**
  **Context:** In academic hiring, letters of recommendation for junior candidates operate under strict norms. Explicit criticism is rare; instead, negative assessment is conveyed through *omission* or *faint praise* (e.g., praising trivial attributes implies substantive flaws). Competent readers (search committees) know this.  

  **The Letter:**  
  > *"Dr. Smith was a member of our department for three years. She was always punctual to lectures and submitted her departmental paperwork on time. Her students found her approachable."*  

  **What is said (literal meaning):**  
  - Dr. Smith was employed for three years.  
  - She was punctual and met administrative deadlines.  
  - Students perceived her as approachable.  

  **What is conveyed (implicature):**  
  - **Dr. Smith is an unremarkable candidate, likely unsuited for a tenure-track position.**  
    (In academia, praising only mundane virtues—while omitting research, originality, or intellectual impact—signals profound inadequacy.)  

  ---

  ### **Why Grice's Tests Fail Here**  
  1. **Calculability Fails**:  
     - Grice requires the implicature to be derivable from (i) what is said, (ii) the Cooperative Principle, and (iii) general maxims (Quality, Quantity, Relation, Manner).  
     - **Problem:** An outsider (e.g., a non-academic) would *not* derive the negative implicature. They might infer neutrality ("no strong praise") or even positivity ("reliable and friendly"). The inference depends entirely on the **local norm**: "Faint praise = damning assessment." Without knowing this institutional practice, the implicature is *not calculable*.  
     - Gricean maxims alone cannot generate it. For example:  
       - *Quantity*: The letter is *underinformative* for a recommendation, violating the maxim. But without knowing the norm, the hearer might attribute this to laziness, not criticism.  
       - *Relation*: The content seems irrelevant to a job application. But again, an outsider could assume the writer is incompetent, not implicating rejection.  

  2. **Cancellability Fails**:  
     - Grice claims implicatures can be canceled explicitly without contradiction.  
     - **Problem:** If the writer appends: *"I genuinely mean this as high praise; she is an outstanding scholar,"* the cancellation **fails** within the institution. Competent readers will dismiss it as sarcasm, dishonesty, or professional malpractice. The writer is *answerable* to the norm, not their private intention. The letter’s social function overrides the cancellation.  

  3. **Intention-Recognition Fails (as a test for implicature)**:  
     - Grice requires the speaker to intend the hearer to recognize the speaker’s intention to convey the implicature.  
     - **Problem:** The writer may sincerely *disclaim* the negative intention (e.g., "I only meant to highlight her reliability!"). Yet, within the practice, the writer is still **held responsible** for the implicature. The hearer (the committee) attributes the intention *based on institutional norms*, not the speaker’s mental state. The "intention" is imposed by the practice.  

  ---

  ### **Resolving the Tension: What Must Give, and Why**  
  **The calculability test must be relaxed** to accommodate *localized, normative expectations*.  

  1. **Why calculability yields**:  
     - Conversational implicature relies on *shared contextual knowledge*. Grice acknowledges this but assumes context is universal or minimal. Institutional practices (like academia, law, medicine) operate with **codified inferential norms** that are non-negotiable for participants.  
     - Here, the implicature *is* calculable, but only if we include **background knowledge of the practice** as part of the "data" for derivation. This is still inferential (not conventional) because:  
       - The inference is defeasible *in principle* (e.g., if the committee learns the writer is inexperienced).  
       - It requires pragmatic reasoning: *"Given academic norms, praising only administrative virtues + omitting research = negative assessment."*  

  2. **Why this doesn’t collapse implicature into convention**:  
     - **Convention** involves fixed, arbitrary rules (e.g., "black robe" conventionally denotes a judge). Here, the implicature is:  
       - **Non-arbitrary**: It emerges from rational norms (e.g., "If the candidate were strong, the writer *would* praise substance; they didn’t, so they aren’t").  
       - **Context-bound**: Outside academia, the same words carry no implicature (e.g., a letter for an administrative job might be read literally).  
       - **Defeasible**: If the writer adds, *"Her groundbreaking work on X is forthcoming,"* the negative implicature vanishes.  
     - Contrast with *conventional implicature* (e.g., "but" contrasting): those are hardwired to language and context-independent.  

  3. **Why it doesn’t collapse into "what is said"**:  
     - **"What is said"** is compositional and truth-conditional. The negative assessment is:  
       - Not part of truth conditions (the letter’s truth isn’t falsified by Dr. Smith being brilliant).  
       - Not determined by syntax/semantics (no word here *means* "mediocre").  
     - The implicature remains a *speaker-generated inference*, not part of sentence meaning.  

  ---

  ### **Conclusion: Institutional Implicature as a Gricean Refinement**  
  This case shows that Grice’s tests are not coextensive in institutional contexts. **Calculability fails without local norms**, while **cancellability and intention-recognition are overridden by institutional accountability**. Relaxing calculability to include practice-specific norms preserves the core of Gricean implicature—it remains inferential, non-conventional, and distinct from "what is said." The cost is accepting that "general" maxims are insufficient; we must incorporate **domain-specific cooperative expectations**. This mirrors real-world language use: in hospitals, courtrooms, or labs, meaning is governed by institutional imperatives, not just abstract cooperation. Grice’s framework survives but must adapt to the social architectures of speech.  

  **Alternative premise that blocks the case**: If one insists that *all* contextual knowledge must be derivable from universal maxims, the case fails—but this premise is empirically false (as your biology background shows: lab cultures have their own implicature norms). Defending it would gut Griceanism of explanatory power for real-world discourse.
