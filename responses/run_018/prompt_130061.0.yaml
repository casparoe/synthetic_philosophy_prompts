answer: |-
  Here's the sorting quiz designed for grad-level nuance, with embedded "awkward commitments" and blurred lines flagged:

  ---

  **Guilt/Shame Sorting Quiz**  
  *For each scenario, pick the reaction/process that feels most intuitively "correct" or effective to you (A, B, or C).*

  1.  **Academic Dishonesty:** A student plagiarizes a key seminar paper. After discovery, they...  
      A) Privately calculate the exact grade penalty owed, pay a self-imposed fine to a charity, and submit an original rewrite only to the professor.  
      B) Request to stand before the seminar group, acknowledge the specific harm to scholarly trust, and verbally recommit to integrity norms.  
      C) Argue the assignment design encouraged corner-cutting and propose revising the syllabus to prevent future issues, dismissing "moralistic" labels.  

  2.  **Historical Injustice Reparations:** A city confronts its role in historic displacement. The council proposes...  
      A) Direct cash payments to descendants, calculated by economists, with no public ceremonies or admissions.  
      B) A prominent memorial park with engraved names/stories and annual public readings of the displacement decree.  
      C) Investing solely in current low-income schools citywide, stating "assigning old sins to specific people now is meaningless."  

  3.  **Corporate Environmental Harm:** A factory's hidden pollution leaks are exposed. The Board...  
      A) Authorizes anonymous restitution payments to affected residents via a 3rd party, plus unseen infrastructure upgrades.  
      B) Fires the CEO publicly, citing "a failure of stewardship that stains our legacy," and mandates transparent future monitoring.  
      C) Launches an aggressive PR campaign reframing the leak as an "unforeseen systems challenge" while accelerating green tech R&D.  

  4.  **The Hermit's Theft:** A solitary ascetic, unseen for decades, steals bread from an empty hut. Later, reflecting...  
      A) Feels a persistent, deep sense of being "soiled" or defective, despite knowing the owner never suffered material lack.  
      B) Is intensely motivated to find a way to anonymously return equivalent value, plus extra, to *someone* deserving.  
      C) Considers it irrelevant; no harm occurred without witnesses, and hunger justified the act within their self-contained ethics.  

  5.  **Social Media Outrage Storm:** Someone's decade-old, offensive tweet resurfaces virally. They feel primarily...  
      A) Acute anxiety about reputational collapse, calculating how to signal alignment with current norms to mitigate damage. (*Prospective Exposure*)  
      B) A focused need to privately identify and apologize directly to individuals potentially harmed by the specific words.  
      C) Confusion that old words are judged by new standards, seeing the outrage as performative and unmoored from real harm.  

  6.  **Childhood Lie Revealed:** An adult learns a lie they told at age 7 caused a minor, forgotten social ripple. They now...  
      A) Feel a hot flush recalling it, even knowing it's trivial and long-forgotten, sensing a lingering flaw in themselves.  
      B) Wish they could find the affected playmate to offer a small symbolic gesture (a coffee, a note) acknowledging the dishonesty.  
      C) Dismiss it as irrelevant childhood behavior, wondering why anyone would dwell on such a tiny, ancient misstep.  

  7.  **Confessional Ritual Design:** A community designs a new process for admitting wrongdoing. It emphasizes...  
      A) Private, quantifiable restitution guided by a neutral arbiter, ensuring balance is restored silently.  
      B) A communal gathering where the wrongdoer names their act and its stain on the group's fabric, seeking reintegration.  
      C) Guided self-reflection framing the act as a "learning misstep" within personal growth, avoiding moralistic language.  

  ---

  **Scoring Key:**  
  *(Tally your most frequent choices A/B/C across all 7 questions. Patterns map to leaves below. Significant mixed patterns suggest Structural Pairing or Collapse.)*

  *   **Mostly A:** **Institutional Guilt**  
      *Awkward Commitment:* You must accept that even genocide could be "resolved" via sufficient anonymous compensation transfers, absent public reckoning.
  *   **Mostly B:** **Basal Shame**  
      *Awkward Commitment:* You must believe the isolated hermit *should* feel permanently stained by a victimless, unseen theft, regardless of repair potential.
  *   **Mix of A/B/C (esp. Context-Dependent):** **Structural Pairing**  
      *Awkward Commitment:* You deny any universal "best" emotion, arguing guilt fits contract-based societies, shame fits honor-based ones – neither is universally superior.
  *   **Mix incl. A, but Key A on Q5/Q7:** **Prospective Optics**  
      *Awkward Commitment:* You must explain why the visceral heat/flush of shame exists if it's purely a calculus about reputational risk management.
  *   **Mostly C / Strong C on Q1/Q3/Q6:** **Collapse**  
      *Awkward Commitment:* You dismiss foundational work in moral psychology (e.g., Tangney, Lewis) as largely mistaking context-specific expressions for distinct categories.

  ---

  **Blurred Lines & Unoccupied Territory:**

  *   **Blur Between Institutional Guilt (1) & Prospective Optics (4):** Both can support private restitution mechanisms (A answers). The key differentiator is *how they conceptualize shame*. IG sees it as a separate (often inferior) emotion, while PO sees "shame" *as* a form of reputational risk assessment (hence PO might pick A on Q5/Q7 where risk is salient). If you strongly preferred A answers *and* chose A on Q5 (Reputational Anxiety) or framed shame strategically in Q7, you likely lean PO. Pure IG would be uncomfortable with Q5's framing.
  *   **Unoccupied Combo: "Shame is Basal but Fully Suppressible by Culture"**  
      This is **incoherent within the basal shame framework**. If shame is the *fundamental, pre-cultural root* of moral experience (Leaf 2), culture cannot *suppress its emergence* entirely. Culture might redirect, reshape, or provide scripts for managing shame, but the underlying capacity for feeling "stained" or defective is seen as inherent to moral agency itself. Basal Shame proponents argue even guilt requires this underlying capacity for self-assessment against standards. A culture attempting total suppression wouldn't just fail; it would undermine the possibility of deep moral motivation. Unexplored combos like "Guilt is basal and suppressible" might be possible but aren't prominent in the literature this quiz addresses.
