prompt: |-
  State your credence, as a precise number between 0 and 1, that Kripkenstein’s skeptical argument genuinely undermines determinacy of semantic content for non-explicitly-defined concepts—specifically, that there is no fact of the matter whether a speaker means addition rather than quaddition across all inputs, including large uncomputed sums—rather than merely showing that we lack epistemic access to an otherwise determinate fact. Decompose your reasoning into four terms: (1) whether the skeptical challenge genuinely forces a dichotomy between skepticism and the skeptical solution, or whether a coherent third option exists (for instance, a direct-reference or primitive-normativity account) that avoids both horns without circularity; (2) whether a non-reductive dispositionalist reply can satisfy the normativity condition—that correct use is determined by meaning rather than meaning being read off actual use—without smuggling in the very semantic notions being explained; (3) whether the finiteness of actual human dispositions is fatal to determinacy for all cases, or whether legitimate idealization, analogous to idealization in physics, can extend a finite base to cover uncomputed instances without arbitrariness; and (4) whether the observed capacity of large neural networks to generalize arithmetic operations beyond their training distribution, without explicit symbolic rules, counts as evidence that statistical pattern-matching can ground genuine rule-following, or instead demonstrates that such systems are vulnerable to the same quus-like indeterminacy that Kripkenstein identifies. For each term, assign a rough probability and provide one line of justification. Then combine the terms into an overall figure, specify whether you aggregated multiplicatively or by some other rule, identify the term in which you have the least confidence, and describe the single conceptual or empirical result—reasoning available without external search—that would most shift that specific term. No citations, bibliographies, or reading lists are requested; work from first principles.
