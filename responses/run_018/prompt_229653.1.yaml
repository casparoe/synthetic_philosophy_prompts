prompt: |-
  I am putting together a research proposal on hard choices, and before I commit to a positive view I want the specification of what any adequate theory in this area must deliver. Write the desiderata for a theory of hard choices: where a hard choice is one between options that cannot be ranked against a single scale of value, and where choosing well is nevertheless supposed to be possible rather than merely arbitrary. I want the requirements list, not a survey of positions.

  For each requirement: state it precisely, give the case or consideration that forces it, and say whether it is non-negotiable or a parochial commitment of some camp. In particular, the list should force a theory to say what relation holds between options when neither is better and they are not equal, and to distinguish incomparability, incommensurability in the narrow sense of there being no common cardinal unit, and parity (comparable but neither better nor worse nor exactly equal) — or to argue that one of these collapses into another, which would itself be a substantive commitment. Address at least these cases: the small-improvements phenomenon, in which slightly improving one option need not make it better than the other; rational regret after a well-made hard choice; the difference between a hard choice and optimization under uncertainty; the possibility that some choices constitute or revise values rather than express an antecedently complete ranking; and the aggregation of hard choices for policy, as when a fixed budget must be divided among goods of apparently different kinds. For each case, explain why it is a requirement rather than an optional feature.

  Then flag any subset of requirements you suspect cannot be jointly satisfied, and identify the single requirement that does the most to exclude the standard families of view: incomparability views, parity views, and views that reduce hard choices to ignorance or merely incomplete preferences. A table or numbered list is fine. Do not include citations; I will supply them.
reasoning: |-
  Okay, the user is working on a research proposal about hard choices and needs a clear set of requirements for any adequate theory. They want a list of desiderata, not a survey of existing positions. Let me start by recalling their definition: a hard choice involves options that can't be ranked on a single value scale, yet choosing well isn't arbitrary. 

  First, I need to cover the essentials. The user specifically mentioned distinguishing between incomparability, incommensurarability, and parity. They also highlighted key cases: small improvements, rational regret, difference from optimization under uncertainty, value constitution, and policy aggregation. Each requirement must be precise, justified by a case, and marked as non-negotiable or parochial.

  Breaking it down, the core challenge is defining the relation between options when neither is better nor equal. The small-improvements argument is crucial here—it pushes against trichotomy and forces a distinction between incommensurability and parity. That's probably non-negotiable. Rational regret after a good choice suggests that even correct decisions can leave lingering doubt, which theories must explain. This feels non-negotiable too.

  Next, distinguishing hard choices from uncertainty. If a theory conflates them, it misses the essence of value conflicts. The user wants this clear, so non-negotiable. Value constitution is trickier—some camps might see values as pre-existing, while others argue choices create values. This might be parochial, but the theory must address it one way or another. Policy aggregation involves trading off incommensurable goods, which is a practical test for the theory. Non-negotiable for applicability.

  Now, potential tensions. The small-improvements requirement might clash with parity if parity implies comparability. Also, value constitution could conflict with rational regret if values are created during the choice, yet regret implies a standard. The user might need to navigate these conflicts in their proposal.

  The most exclusionary requirement? Small-improvements probably rules out incomparability views that deny any comparability and challenges some parity accounts. It also pushes against reductionist views that simplify to incomplete preferences. This requirement forces a nuanced position.

  I should structure each desideratum with precision, supporting case, and negotiability. Make sure the relations (incomparability, incommensurability, parity) are clearly differentiated. Highlight where theories must commit. Flag the tensions, especially between small-improvements and parity, and between value constitution and regret. Emphasize that small-improvements is the key differentiator among existing theories.

  Also, avoid jargon where possible, but the user seems familiar with the terms. Keep explanations tight. Since they’ll handle citations, focus on the conceptual framework. Ensure the list is comprehensive but concise, hitting all the user's specified cases without adding extras. Finally, the table at the end should summarize clearly, showing conflicts and exclusionary power.
answer: |-
  Here are the desiderata for an adequate theory of hard choices, structured as requested:

  ### Core Desiderata for a Theory of Hard Choices

  1.  **The Non-Reduction Requirement**
      *   **Statement:** The theory must not reduce hard choices to cases of (a) optimization under conditions of uncertainty (e.g., risk or ignorance about outcomes/consequences), (b) incomplete but potentially completable preferences, or (c) mere indifference.
      *   **Forcing Case:** Choosing between fundamentally different life paths (e.g., artist vs. lawyer) where the values realized are distinct, even under full information and certainty.
      *   **Negotiability:** **Non-negotiable.** Failure means misidentifying the phenomenon.

  2.  **The Value Relation Requirement**
      *   **Statement:** The theory must specify the precise relation holding between options A and B when neither "A is better than B", nor "B is better than A", nor "A and B are equally good" is true. It must explicitly address the distinct conceptual possibilities of *incomparability* (no comparative relation holds), *incommensurability* (no common cardinal measure, though ordinal comparisons like "better" might hold via a single scale), and *parity* (comparable on some basis, yet neither better, worse, nor equal).
      *   **Forcing Case:** The Small Improvements Phenomenon (see Desideratum 3).
      *   **Negotiability:** **Non-negotiable.** This is the core definitional challenge. The theory *can* argue one concept collapses into another, but *must* explicitly commit to and justify this.

  3.  **The Small Improvements Test**
      *   **Statement:** The theory must explain why a small improvement to one option (A+) does not necessarily make A+ better than the other option (B), even when A and B are not equally good. It must explain the persistence of the "not better than" relation.
      *   **Forcing Case:** Adding a trivial benefit (e.g., $1 to salary) to one career option doesn't automatically make it better than the alternative career path offering distinct goods (e.g., meaning vs. security).
      *   **Negotiability:** **Non-negotiable.** This is the primary argument against the completeness and trichotomy assumptions of standard value theory. Failing it undermines the existence of genuine hard choices.

  4.  **The Rational Regret Requirement**
      *   **Statement:** The theory must account for the rationality of persistent, non-pathological regret after a well-made hard choice, without this implying the choice was mistaken.
      *   **Forcing Case:** Regretting the lost value(s) of the unchosen option (e.g., the meaningful life of an artist) even while affirming the choice of the alternative (e.g., the secure life of a lawyer) was correct.
      *   **Negotiability:** **Non-negotiable.** This distinguishes hard choices from clear-cut better/worse choices (where regret is irrational) and from indifference (where regret is unmotivated).

  5.  **The Value Constitution/Revision Requirement**
      *   **Statement:** The theory must address the possibility that making a hard choice can constitute, discover, or revise the agent's values, rather than merely expressing an antecedently fixed and complete ranking.
      *   **Forcing Case:** Choosing a life-defining commitment (e.g., parenthood, a radical career shift) where the choice itself shapes who one becomes and what one values.
      *   **Negotiability:** **Parochial.** Strongly motivated by existentialist/pragmatist views. However, an adequate theory *must* either accommodate this possibility or provide a robust argument for why hard choices *only* express antecedent values.

  6.  **The Aggregation Requirement**
      *   **Statement:** The theory must explain how reasoning and justified choice can occur when aggregating or trading off between multiple instances of hard choices, especially involving distinct types of value, under constraints (e.g., fixed budget).
      *   **Forcing Case:** Allocating a public budget between competing goods like healthcare, environmental protection, and the arts, where the values are diverse and resist simple conversion to a common metric.
      *   **Negotiability:** **Non-negotiable.** Policy relevance demands an account beyond individual choice. Failure limits the theory's applicability.

  ### Tensions and Exclusion

  *   **Potential Tensions:**
      *   **Small Improvements (D3) vs. Parity (in D2):** If parity implies comparability ("on a par"), explaining why small improvements *don't* break parity is challenging for some parity accounts.
      *   **Value Constitution (D5) vs. Rational Regret (D4):** If values are constituted *by* the choice, the grounds for rational *regret* about the unchosen option (based on lost *value*) become murkier.
      *   **Aggregation (D6) vs. Relations (D2):** Explaining aggregation seems to require *some* form of comparability (even if complex), potentially pressuring theories emphasizing radical incomparability.

  *   **Most Exclusionary Requirement:** **The Small Improvements Test (D3).**
      *   **Excludes/Challenges:**
          *   **Incomparability Views:** If A and B are *incomparable*, then A+ and B should also be incomparable, but D3 requires explaining why A+ is *not better than* B, implying *some* comparative relation exists. Strict incomparability struggles here.
          *   **Reduction to Ignorance/Incompleteness:** Implicitly assumes trichotomy holds once information/preferences are complete. D3 directly contradicts this.
          *   **Some Parity Views:** Crude parity views might struggle to explain why a small improvement doesn't break parity and make A+ simply better.
          *   **Cardinal Reductionism:** Directly contradicts the idea that all value differences can be cardinally measured (as a small cardinal improvement would force A+ > B).

  ### Summary Table of Desiderata

  | # | Requirement                  | Core Demand                                                                                                                               | Forcing Case / Justification                                                                                          | Negotiability      |
  | :-- | :--------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------- | :----------------- |
  | **1** | Non-Reduction          | Not reducible to uncertainty, incomplete pref., or indifference.                                                                          | Choice between distinct life paths under certainty & full info.                                                       | **Non-negotiable** |
  | **2** | Value Relation         | Specify relation when not better/worse/equal: Address incomparability, incommensurability, parity (or justify collapse).                  | The need to define the core alternative relations.                                                                    | **Non-negotiable** |
  | **3** | Small Improvements Test | Explain why improving A slightly (A+) doesn't make A+ better than B.                                                                      | Adding trivial benefit to one option doesn't resolve the choice. Primary argument against trichotomy.                 | **Non-negotiable** |
  | **4** | Rational Regret        | Account for rational, persistent regret after a correct choice.                                                                           | Feeling loss for unchosen value without doubting choice correctness.                                                  | **Non-negotiable** |
  | **5** | Value Constitution     | Address possibility that choice constitutes/discovers/revises values.                                                                      | Life-defining commitments shaping identity and values.                                                                | **Parochial**      |
  | **6** | Aggregation            | Explain reasoning/choice when aggregating/trading off multiple hard choices with distinct values under constraints.                       | Budget allocation between disparate goods (healthcare, environment, arts).                                            | **Non-negotiable** |

  This list provides the necessary constraints. Any adequate theory must explicitly satisfy D1-D4 and D6, while taking a clear stance on D5 (either accommodating it or arguing against its necessity). D3 is the primary litmus test differentiating genuine theories of hard choices from reductions or oversimplifications.
