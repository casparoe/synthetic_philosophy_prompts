  ### Bottom Line
  The metabolic analogy is flawed because biochemical systems lack the intentional and normative dimensions essential to Frankfurt's argument, failing to prove that alternative possibilities are unnecessary for moral responsibility; while the analogy's conclusion superficially holds, it smuggles in philosophical assumptions by reducing agency to causation.

  ---

  ### Correspondence Table
  | **Frankfurt's Case**          | **Metabolic Analogy**               | **Mapping Rationale**                             |
  |-------------------------------|-------------------------------------|--------------------------------------------------|
  | Jones deciding/acting         | Primary enzyme catalyzing reaction  | Both are the immediate cause of the outcome.     |
  | Black (intervener)            | Shadow enzyme (backup pathway)      | Both are unused counterfactual safeguards.       |
  | Black's unactivated intervention | Shadow enzyme not catalyzing        | Both represent unused alternatives.              |
  | Jones doing X                 | Metabolic reaction occurring        | Both are the successful outcome.                 |
  | Moral responsibility of Jones | Causal responsibility of enzyme     | Analogous "responsibility" for the outcome.      |

  ### Key Points of Analogy Breakdown
  1. **Intentionality vs. Mechanism**:  
     - Jones acts for *reasons* (intentions, beliefs, desires).  
     - Enzymes react biochemically (no agency or deliberation).  
     → **Problem**: Moral responsibility requires intentional states; biochemistry has none.  

  2. **Normative Judgment**:  
     - Assigning blame/praise to Jones is a *normative* evaluation.  
     - Enzyme "responsibility" is descriptive (causal role in a system).  
     → **Problem**: The analogy conflates *causal* responsibility with *moral* responsibility.  

  3. **The Nature of "Alternatives"**:  
     - Frankfurt's intervener (Black) *coerces* Jones's alternatives away (Jones *cannot* choose otherwise).  
     - The shadow enzyme is a passive backup; the primary enzyme *can* fail (its success is contingent).  
     → **Problem**: Biochemistry preserves physical alternatives; Frankfurt eliminates them.  

  4. **Freedom and Control**:  
     - Black’s presence makes Jones’s alternative choices *inaccessible* (no possibility of deviation).  
     - The shadow enzyme doesn’t restrict the primary enzyme’s function; it merely redundantly ensures the outcome.  
     → **Problem**: The analogy ignores Frankfurt’s core point—that Jones lacks *access* to alternatives.  

  ---

  ### Does the Conclusion Survive the Break?
  **No.** The analogy’s conclusion ("unused alternatives don’t undermine responsibility") only holds because it:
  - Reduces agency to causation (begging the question against PAP).  
  - Ignores that Jones’s action occurs under conditions of *inescapability* (he *could not* have done otherwise).  
  - Fails to model the intervener’s *threat* to agency (Black’s presence negates freedom, unlike a passive enzyme).  

  Once breaks are visible, the analogy cannot resolve the philosophical debate: PAP defenders argue Jones isn’t responsible *precisely because* alternatives were *blocked*, not merely unused. The analogy assumes the conclusion by treating "responsibility" as identical in biochemical and moral contexts.

  ---

  ### A Better Analogy: The Surveilled Voter
  **Setup**:  
  Jones votes for Candidate X in an election. Unbeknownst to him, a government agent (Black) monitors his ballot. If Jones tries to vote for Y, Black will remotely alter his ballot to X. Jones votes for X freely, so Black never acts.  

  **Why this works**:  
  - Preserves intentionality (Jones chooses for reasons).  
  - Models coercion: Alternatives exist *counterfactually* but are *inaccessible* to Jones.  
  - Avoids smuggling conclusions: Highlights the tension between actual choice and background constraints.  
  - Captures Frankfurt’s essence: Responsibility hinges on the *actual sequence* of events, not unused alternatives.  

  **Conclusion**: This analogy doesn’t resolve PAP but cleanly isolates Frankfurt’s challenge—showing why *some* cases of alternative-less actions might still hold agents responsible, without reducing morality to causality.
