answer: |-
  ### 1. Conceptual Framing (≈200 words)
  **Contractual conversion** describes the gradual, market-driven replacement of traditional capitalist firms with worker-owned cooperatives through voluntary association and free competition. It assumes no coercive state intervention; change occurs because cooperatives prove more efficient or ethically appealing, outcompeting traditional firms within existing property frameworks. **Structural expropriation** entails the state forcibly abolishing private ownership of productive capital ("means of production") as a necessary, non-negotiable step to achieve distributive justice, typically via revolution or sweeping legislation. This rejects market processes and individual choice regarding property ownership as fundamentally unjust. Mill’s late view aligns with contractual conversion: he championed worker cooperatives as a superior, voluntary form of enterprise emerging organically within a competitive market. He firmly rejected structural expropriation, seeing state-mandated abolition of private capital as tyrannical, destructive to liberty and incentive, and unnecessary. His endorsement of socialism is conditional on its *voluntary* adoption through association and persuasion, preserving individual freedom and market dynamics, rather than imposed through state coercion.

  ### 2. Mill’s Arguments (≈250 words)
  In *Chapters on Socialism* and related late works, Mill argues that worker cooperatives represent the ideal future of production. He believed cooperatives would naturally arise and spread because they align workers' interests, eliminate exploitative wage relations, enhance dignity and motivation, and thus potentially outperform capitalist firms through superior efficiency and morale. Crucially, this transformation must occur via *voluntary contract* and *free competition*. Workers must freely choose association; cooperatives must prove their worth in the market against traditional firms. Mill insisted competition remains essential to spur innovation, efficiency, and responsiveness to consumer needs, even in a cooperative-dominated economy. He feared state monopoly or mandated models would lead to stagnation and bureaucracy. Mill also envisioned a "stationary state" of economic maturity – not stagnation, but an end to relentless growth – as the desirable endpoint where resources could be devoted to equitable distribution, cultural improvement, and environmental stewardship. Within this stationary state, widespread cooperative ownership could achieve socialist goals like fairer distribution of wealth and worker emancipation, but *only* if reached voluntarily through competitive success and individual choice, not state fiat.

  ### 3. The Crux (≈200 words)
  The tension becomes unstable precisely when contractual conversion achieves widespread success. If cooperatives *do* outcompete capitalist firms to near-universality through market processes, the functional result – an economy dominated by worker-owned capital – mirrors the outcome of structural expropriation. Private capital ownership for the purpose of employing wage labor effectively disappears. Mill insists this outcome is legitimate only if achieved voluntarily. However, the *scale* required for distributive justice raises a problem: Can such a complete transformation occur purely through incremental, voluntary contracts without *ever* necessitating collective political action that restricts individual property rights? Furthermore, if cooperative dominance emerges, what happens to dissenters who prefer individual enterprise or traditional employment? Mill’s commitment to individual liberty requires protecting their choices. Yet, if cooperatives become overwhelmingly dominant, market conditions themselves might render traditional employment or individual capital ownership practically impossible or economically unviable, effectively imposing a cooperative structure without formal expropriation. This functional convergence challenges Mill’s boundary; liberty seems preserved in form (no state confiscation) but potentially undermined in substance (lack of meaningful alternatives).

  ### 4. Assessment within Mill’s Framework (≈200 words)
  Resolving this tension within Mill’s utilitarianism and liberalism is difficult. His utilitarianism (seeking the greatest good) might justify the *outcome* of a cooperative-dominated economy due to enhanced worker welfare and reduced inequality. His liberalism, prioritizing individual liberty and the harm principle (only restricting liberty to prevent harm), justifies the *process* of contractual conversion as non-coercive. However, the potential for market forces to functionally exclude non-cooperative options complicates the harm principle: does the *absence* of traditional capitalist jobs caused by cooperative success constitute "harm" warranting state intervention to preserve alternatives? Mill likely would argue no, as this outcome arises from free choices. Yet, this leaves distributive justice contingent on uncertain market outcomes and potentially slow progress. The core ambiguity lies in Mill's view of property: he saw it as a social institution subject to reform for the common good, not an absolute natural right. This allows for radical change *through* reformed contracts (cooperatives) but draws a sharp line at forced abolition (expropriation). The tension reveals an unresolved conflict between his radical vision for economic organization and his foundational liberal constraint against coercive imposition, even for seemingly beneficial ends.

  ### 5. Bottom Line (≈100 words)
  Mill’s late socialism commits him to advocating for and anticipating the *voluntary, competitive triumph* of worker cooperatives as the path to a more just and free economy. He explicitly rejects any state-led abolition of private capital ownership. The contractual/structural distinction clarifies his unique position: a radical liberal market socialist, not a revolutionary or state socialist. However, it also obscures the potential instability at the boundary. If contractual conversion succeeds completely, it functionally achieves structural expropriation's end result through market means, raising questions about whether Mill’s cherished individual liberty can truly accommodate dissenting economic preferences in that transformed landscape.
