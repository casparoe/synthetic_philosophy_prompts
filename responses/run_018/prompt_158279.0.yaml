  As a retired experimental physicist who has only recently begun studying philosophy, I have been working through Henry Sidgwick's arguments about psychical research. I understand that Sidgwick maintained that anomalous reports—such as claims involving telepathic or apparitional phenomena—ought to be evaluated by weighing the cumulative strength of testimony against the intrinsic improbability of such events given well-established natural laws. The conceptual issue that puzzles me is whether this evaluative framework is methodologically stable. If assessing the testimony seriously requires a provisional suspension of the principle of the uniformity of nature, does that suspension not already presuppose that the phenomenon in question lies outside the scope of scientific explanation? Put more precisely: is there a coherent middle stance that treats psychical claims as genuinely open empirical questions without either dismissing them by flat appeal to uniformity or undermining the very inferential framework that makes scientific judgment possible? I am not asking for a biographical summary, but for a rigorous explanation of whether Sidgwick's proposed balance avoids collapsing into either dogmatic skepticism or an abandonment of methodological naturalism.
