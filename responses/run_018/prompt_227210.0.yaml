prompt: |-
  I'm trying to work out what I actually think about advance directives by testing my gut reactions on cases, and I'd like to know what principle, if any, unifies my verdicts. First: a woman executes a detailed directive at forty refusing all life-prolonging treatment should she develop advanced dementia; she is now deeply demented, visibly content, and has pneumonia that antibiotics would cure -- I say withhold treatment. Second: same facts, except that she now, in her demented state, says she wants to live -- I still say withhold, though less confidently. Third: a man with bipolar disorder, while stable, signs a Ulysses contract authorizing involuntary hospitalization during manic episodes; he is now manic and refuses admission -- I say enforce the contract. Fourth: a man signed a directive refusing resuscitation twenty years ago; he is now fully competent, tells his doctors he's changed his mind, but has never updated the paperwork -- I say follow his current words, not the document. Fifth: a healthy twenty-five-year-old writes a directive refusing ventilation if she is ever paralyzed, based on what she imagines quadriplegia would be like; years later she is quadriplegic, has adapted, and values her life -- I say the earlier self simply didn't know what she was choosing, and the directive deserves little weight. Is there a principle that captures all five verdicts, stated precisely enough to say which features do the work -- competence, knowledge, the identity of the later self? If the principle has to overturn one of my verdicts (I suspect the second and fourth pull against each other), tell me which one goes and why. And tell me what it implies for the case I haven't listed: a directive requesting active euthanasia once dementia reaches a specified stage.
reasoning: |-
  Okay, let me start by understanding what the user is asking. They're exploring their own intuitions about advance directives through different scenarios. They've listed five cases and want to know if there's a unifying principle that explains their reactions to each. They also suspect some of their verdicts might conflict, particularly the second and fourth cases. Plus, they're curious about how their principle would apply to a euthanasia directive in dementia.

  First, I need to break down each case and identify their gut reactions. In the first scenario, the woman with dementia who previously refused treatment—they say withhold antibiotics. Even when she now says she wants to live (second case), they still lean towards withholding. The third case, the bipolar man's Ulysses contract, they enforce it. Fourth case, the man who changed his mind about resuscitation but didn't update paperwork—they follow his current wishes. Fifth, the quadriplegic who adapted—they disregard the directive because her past self didn't know better.

  Looking for patterns here. Competence seems key. In cases one and two, the dementia patient isn't competent now, so the past directive stands. But in case four, the current competent wish overrides the old directive. The bipolar case involves fluctuating competence; during mania, he's incompetent, so the stable self's decision is enforced. The quadriplegia case is about knowledge—past self lacked experience, so current wishes prevail. 

  But there's tension between case two and four. In two, even though the demented patient expresses a current wish to live, they still withhold treatment, deferring to the past directive. In four, the current competent wish overrides the directive. So the difference must be current competence. The demented patient isn't competent to change the directive, while the resuscitation case is competent. 

  The principle emerging is that directives should reflect the competent, informed self's values. When current self is competent, their wishes take precedence. When not, we look to the last competent self's directive, provided it was informed. 

  Applying this to the euthanasia case: if the directive was made when competent and informed, but now the demented self is content, would they follow the directive? Their principle suggests yes, similar to case one. But the user might feel conflicted if the current self seems happy. They'll need to reconcile that. 

  The user might be seeking consistency in their ethical intuitions. Underlying this is a deeper need to understand autonomy's boundaries—how past and present selves' rights interact, especially when competence changes. They might also be grappling with the moral weight of precedent autonomy versus current well-being. 

  I should point out that the second case might be the one that doesn't fit perfectly. If the demented patient expresses a wish to live, but the principle prioritizes the competent past self, that's consistent. But if the user feels less confident, maybe they're weighing current well-being more. However, in their verdicts, they still withhold treatment, so the principle holds. 

  For the euthanasia directive, the principle would likely support following it, even if the current self is content, because the past self was competent and informed. But this could be challenging if the current self appears happy. The user might need to decide if the principle holds or if well-being overrides in such irreversible cases.
answer: |-
  Based on your case judgments, a principle emerges that prioritizes **the last known competent, informed, and values-based choice, but gives decisive weight to the current self when competent and sufficiently informed about the actual condition.**

  Here's the principle stated precisely:

  > **An advance directive is binding only if:**
  > **(a) The individual was competent and reasonably informed about the relevant condition at the time of making the directive, AND**
  > **(b) The individual is currently incompetent to make the decision in question.**
  > **If the individual is currently competent, their contemporaneous choice supersedes any prior directive.**
  > **Furthermore, a prior directive loses significant weight if the individual (even if currently incompetent) experiences a fundamental shift in values or identity, or if the directive was based on significant misinformation about the lived reality of the condition.**

  **How this explains your verdicts:**

  1.  **Dementia Patient, Content, Wants Treatment Withheld:** *Fits.* Past self was competent & informed (a). Current self is incompetent (b). Directive is binding. (No fundamental value shift *evident* in contentment). **VERDICT: WITHHOLD.**
  2.  **Dementia Patient, Content, *Says* Wants to Live:** *Fits, but highlights tension.* Past self competent/informed (a). Current self is incompetent (b) – her verbal request is not considered a competent revocation. Directive remains binding. Your "less confidence" might stem from the *apparent* value shift (contentment + verbal request), but the principle prioritizes the competent past self's choice over the expressions of the incompetent current self. **VERDICT: WITHHOLD.**
  3.  **Bipolar Ulysses Contract:** *Fits.* Past self was competent & informed about mania (a). Current self is manic, therefore incompetent regarding this decision (b). Directive is binding. **VERDICT: ENFORCE.**
  4.  **Changed Mind, Competent, Old Paperwork:** *Fits.* Current self is **competent.** Principle explicitly states current competent choice supersedes prior directive (regardless of paperwork). **VERDICT: FOLLOW CURRENT WORDS.**
  5.  **Quadriplegic Who Adapted:** *Fits.* While past directive was made competently, it was **not reasonably informed** about the actual lived reality and potential for adaptation/valuing life (violates condition a). The current self's expressed values (valuing life) demonstrate this lack of prior knowledge and a fundamental shift in perspective based on actual experience. Directive deserves little weight. **VERDICT: DISREGARD DIRECTIVE.**

  **The Tension and Which Verdict Must Fall:**

  You correctly identified tension between **Verdict 2 (Withhold despite current verbal request)** and **Verdict 4 (Follow current words)**. The principle resolves this tension by prioritizing *current competence*. Verdict 4 involves a *competent* revocation. Verdict 2 involves an *incompetent* expression of preference.

  **Therefore, Verdict 2 stands under this principle.** The "less confidence" is understandable – witnessing an incompetent person express a desire contrary to their directive *is* unsettling. However, the principle holds that competence is the threshold. An incompetent verbal request doesn't automatically equate to a competent revocation of a valid advance directive. To prioritize the incompetent request in Case 2 would fundamentally undermine the logic of advance directives and Ulysses contracts (Case 3), where the *point* is to bind the future incompetent self.

  **Implication for the Euthanasia Directive Case:**

  *   **Scenario:** A directive requesting active euthanasia once dementia reaches a specified stage. The person is now at that stage, deeply demented, but appears content.
  *   **Application of Principle:**
      *   **Condition (a):** Was the person competent and reasonably informed when making the directive? (Crucially, did they understand the potential for contentment in dementia?).
      *   **Condition (b):** Is the person currently incompetent? (Yes).
  *   **Analysis:**
      *   If the directive was made competently and with reasonable understanding (including awareness that some find dementia contenting, but rejecting that possibility for themselves based on values like dignity, autonomy, or fear of existence without certain capacities), then the principle suggests the directive **should be followed.** The current contentment doesn't negate the competent past self's values-based choice made under condition (a), and condition (b) is met.
      *   **However, the "fundamental shift" caveat applies strongly here.** Is the demented person's apparent contentment evidence of such a profound shift in values or identity that the past self's directive no longer represents "them"? This is the core ethical dilemma in dementia euthanasia directives. Your principle leans towards honoring the directive unless there's clear evidence the *past self's* directive was *uninformed* about the *possibility* of contentment (violating a), or unless the current state represents such a radical discontinuity that the past self's choice is irrelevant.
  *   **Likely Verdict based on your pattern:** You would likely argue **the directive should be followed**, analogous to Case 1 & 2. The past competent self made a values-based choice anticipating this *exact* scenario (incompetence + potential contentment), and the current incompetent self cannot revoke it. Your discomfort in Case 2 suggests this wouldn't be easy, but the logic of precedent autonomy and binding the incompetent future self points towards honoring the euthanasia request. Your rejection of the quadriplegic directive (Case 5) was based on *misinformation*, not just a change in values – unless you argue the dementia directive writer fundamentally misunderstood the *potential* for contentment.

  **In summary:** Your judgments are unified by a principle emphasizing **competence at the decision point** and requiring **reasonable prior knowledge** for a directive to bind the incompetent future self. Competent present wishes always win. Incompetent expressions of preference do not override valid prior directives based on competent, informed choices, even when unsettling. The hardest cases involve assessing prior understanding (Case 5) and the significance of value shifts in profound incompetence (euthanasia case).
