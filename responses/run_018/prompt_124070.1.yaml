      *   **Counter-intuitive Commitment:** While accepting replacement-rate asymmetry makes beef better than chicken, it paradoxically holds that *any* animal farming is worse than *any* plant farming due to inherent farmed suffering, regardless of land-use impacts on wild invertebrates. Beef is the "least bad" meat but still worse than plants.

  3.  **Leaf: 1.1.1.1 / 2.1 / 3.2 / 4.1**
      *   **Position:** Unnamed
      *   **Counter-intuitive Commitment:** Chicken might be worse than beef due to farmed suffering, but *both* are likely worse than even relatively land-inefficient plant foods due to the massive land footprint amplifying wild-invertebrate suffering (weighted equally to vertebrates). Favours intensive horticulture over free-range eggs.

  4.  **Leaf: 1.1.1.1 / 2.1 / 3.2 / 4.2**
      *   **Position:** Standard Negative Utilitarianism / Abolitionism (with strong invertebrate inclusion)
      *   **Counter-intuitive Commitment:** Advocates for eliminating animal agriculture entirely due to farmed animal suffering, but *also* demands maximising land efficiency in crop production (e.g., favouring greenhouse hydroponics over field crops) to minimise invertebrate deaths/suffering weighted equally to vertebrates.

