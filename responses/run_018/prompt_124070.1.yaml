      *   **Counter-intuitive Commitment:** Actively promotes converting wild land to agriculture (even inefficient forms like pasture) to reduce aggregate suffering by preventing the births of wild animals assumed to lead net-negative lives, while paradoxically preferring beef over chicken within animal farming to minimise farmed suffering numbers.

