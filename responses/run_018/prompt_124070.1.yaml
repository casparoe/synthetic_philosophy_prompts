  Here is a decision-tree taxonomy of positions on dietary ethics incorporating farmed-animal welfare and wild-animal suffering from crop production, structured according to your specifications. The tree uses binary splits based on fundamental, actionable claims.

  ### Decision Tree Taxonomy: Dietary Ethics & Wild-Animal Suffering

  1.  **Node 1: Does morally relevant suffering extend to wild invertebrates affected by crop production?**
      *   **Branch 1.1 (Yes, invertebrate suffering is significant):** Suffering experienced by wild invertebrates (e.g., insects killed by harvest/pesticides) is morally relevant and warrants non-trivial weighting.
          *   **Node 1.1.1: Should invertebrate suffering be weighted equivalently to vertebrate suffering?**
              *   **Branch 1.1.1.1 (Yes, equivalent weighting):** Suffering intensity per individual is comparable across vertebrates and invertebrates; moral significance is primarily sentience-based.
              *   **Branch 1.1.1.2 (No, discounted weighting):** Suffering intensity per individual or moral weight per unit of suffering is significantly lower for invertebrates than vertebrates.
      *   **Branch 1.2 (No/Insignificant):** Wild invertebrates either lack capacity for morally relevant suffering, or their suffering is so minimal/uncertain that it can be discounted in practical ethics. (Primarily focuses on vertebrates and/or large invertebrates).

  2.  **Node 2: Does 'displacement mortality' (indirect deaths from habitat loss/long-term change) count as net harm?**
      *   *Note: This assumes Node 1.2 (No/Insignificant invertebrate suffering) is taken, or applies specifically to vertebrates/large invertebrates.*
      *   **Branch 2.1 (Yes):** Reducing wild populations through agricultural land conversion causes net harm by depriving individuals of future positive experiences or causing suffering during displacement/death.
          *   **Node 2.1.1: Should displacement mortality be treated equivalently to harvest mortality (direct killing)?**
              *   **Branch 2.1.1.1 (Yes, equivalent):** The causal link to death/suffering is sufficiently direct; harm type is morally equivalent.
              *   **Branch 2.1.1.2 (No, discounted):** Displacement mortality is less direct, involves greater uncertainty, or allows for potential adaptation; harm should be weighted lower.
      *   **Branch 2.2 (No/Net Benefit Possible):** Wild animal lives are typically net-negative due to suffering from predation, disease, and starvation; reducing wild populations via agriculture may reduce aggregate suffering ("Displacement Beneficence").

  3.  **Node 3: Do biological differences create a 'replacement-rate asymmetry' reversing beef vs. chicken ranking?**
      *   *Note: This applies specifically to comparisons between diets relying on farmed animals.*
      *   **Branch 3.1 (Yes - Chicken Worse):** Due to chickens' shorter lifespans, higher stocking densities, higher feed efficiency (requiring less land/crops per kg meat, thus potentially less wild-animal harm), but consequently *more individuals* suffering intensely per unit of meat produced, the total sentient suffering minimisation calculus favours beef over chicken when including both farmed suffering *and* crop-production impacts.
      *   **Branch 3.2 (No - Beef Worse or Intuitive):** The intense suffering of broiler chickens or layer hens outweighs the numerical asymmetry; or the land-use efficiency difference is insufficient to overcome the inherent suffering per farmed animal; beef remains worse than chicken when all factors are considered.

  4.  **Node 4: Is the primary metric for comparing crop-based diets and animal-based diets total land use efficiency (sentient life-years supported per hectare)?**
      *   *Note: This node compares animal agriculture to plant agriculture.*
      *   **Branch 4.1 (Yes):** The key ethical impact driver is land area converted/used, as this determines the scale of wild-animal displacement/habitat loss and harvest mortality. Diets should be judged on life-years of food produced per hectare, considering all morally relevant suffering caused by that land use (farmed + wild).
      *   **Branch 4.2 (No - Farmed Suffering Dominates):** The direct, intense suffering inflicted on farmed animals per calorie or gram of protein produced is so overwhelming that it dwarfs the wild-animal suffering caused by the crops needed to feed them. Minimising farmed animal numbers remains the paramount goal.

  ---

  ### Leaf Positions & Implications

  1.  **Leaf: 1.1.1.1 / 2.1 / 3.1 / 4.1**
      *   **Position:** Unnamed (Strong Sentience-Prioritised Land-Use Utilitarianism)
      *   **Counter-intuitive Commitment:** Favours beef consumption over *both* chicken consumption *and* highly land-efficient plant proteins like lentils (if lentils require more land per protein unit than pasture-fed beef, considering total sentient suffering including invertebrates). May justify pasture grazing over rewilding if wild lives are net-positive.

