  Next, I need to apply Scanlon's contractualism. Each person could reasonably reject the principle that forces them to sacrifice their break for a stranger. Even though the harm to them is small, the cumulative effect saves a life, but contractualism focuses on individual justification. Since any single person can veto, the rescue can't proceed without unanimous consent. 

  Contrasting with utilitarianism, the small burdens (15 minutes each) add up to less total harm compared to one death. Utilitarianism would support imposing the burden because the net utility is positive. 

