  First, I need to reconstruct Voss's track record from the six verdicts. The pattern shows hinges aren't defined by subject matter but by their functional role: when denial causes institutional collapse rather than empirical correction. The exceptions (neurology and mathematics) suggest that revisable propositions - even foundational ones - aren't hinges if the discipline can imagine coherent alternatives without self-destruction.

  For competing rules, I'm considering two possibilities: 
  The Institutional Collapse Rule focuses on whether rejecting the proposition makes the practice unrecognizable. 
  The Scaffolding Revision Rule asks if the proposition can be revised internally through normal scientific methods. 

  In palaeogenomics, the contamination proposition seems like a hinge under the first rule (without it, the entire evidential framework crumbles), but a scaffold under the second (as improved protocols could theoretically replace current methods). I lean toward the Institutional Collapse interpretation since Voss consistently prioritizes functional stability over theoretical revisability.

  To test these rules, I propose a case in quantum computing: "Qubit superposition states can be reliably measured." The Institutional Collapse Rule would classify this as a hinge (denial invalidates the field's core premise), while the Scaffolding Rule would not (as measurement techniques evolve through normal research).

  This exercise reveals that Voss's hinge classification depends on whether propositions act as load-bearing walls for disciplinary edifices, not on their perceived immutability. Her implicit commitment is to a practice-based epistemology where institutional architecture determines epistemic status.
answer: |-
  ### 1. Reconstruction of the Track Record (150 words)
  Voss's verdicts reveal a pattern distinguishing hinges from revisable scaffolds. Hinges (cases 1,2,4,5) share three traits:  
  - (i) **Denial dissolves institutional practice**: Rejecting them collapses the domain’s evidential framework (e.g., historical methodology without an independent past becomes fiction-invention).  
  - (ii) **Non-empirical status**: They are not tested as hypotheses within standard inquiry (e.g., natural selection’s operation is presupposed in evolutionary studies).  
  - (iii) **Framework-constitutive role**: They enable domain-specific evidence to function (e.g., forensic DNA relies on biological material’s necessity).  

  Non-hinges (cases 3,6) exhibit:  
  - (i) **Revisability without collapse**: Neuroscience could abandon brain-consciousness causality yet remain recognisable; mathematics retains coherence without ZFC’s universal embeddability.  
  - (ii) **Empirical/theoretical contestability**: These are treated as substantive claims open to revision via internal disciplinary mechanisms.  

  The pattern suggests hinges are *institutionally indispensable* propositions whose rejection voids a practice’s epistemic architecture, whereas revisable scaffolds are *functionally operative* but replaceable within the framework.

  ### 2. Competing Interpretive Rules (250 words)
  **Rule A (Institutional Collapse Rule)**:  
  A proposition is a hinge iff its denial renders the domain’s core institutional practices *unrecognisable* by dissolving constitutive norms of evidence, justification, or intervention. This fits all cases:  
  - Hinges (1,2,4,5): Denial destroys object-perception (1), evolutionary explanation (2), historical evidence (4), forensic genetics (5).  
  - Non-hinges (3,6): Denial leaves neurology (brain-independent consciousness?) and mathematics (non-ZFC foundations) institutionally intact.  

  **Rule B (Dynamic Scaffold Rule)**:  
  A proposition is a hinge iff it is *practically immune to empirical revision* within the current institutional framework. It may be revisable only by shifting the entire disciplinary paradigm. This also fits:  
  - Hinges (1,2,4,5): Not empirically testable in their domains; revision would require abandoning the practice (e.g., no "test" for physical objects).  
  - Non-hinges (3,6): Brain-consciousness causality is empirically contestable via neuroimaging anomalies; ZFC’s role is theoretically negotiable within mathematics (e.g., via category theory).  

  **Divergence**: Rule A prioritises *institutional identity*, Rule B focuses on *revision pathways*. Both accommodate Voss’s verdicts but diverge on whether revisability *within* a framework disqualifies hinge status (Rule B) or whether institutional resilience under denial is decisive (Rule A).

  ### 3. Prediction and Justification (250 words)  
  **Verdict**: Voss would classify the palaeogenomics proposition as a **hinge**.  

  - **Rule A Application**: Denial ("contamination is undetectable") dissolves palaeogenomics’ institutional framework. If contamination cannot be excluded, *all* ancient DNA results become suspect, invalidating protocols for evidence curation, peer review, and interpretation. The discipline loses its capacity to generate authoritative claims—mirroring forensic genetics (case 5).  
  - **Rule B Application**: Current protocols are empirically revisable; new bioinformatic tools might improve contamination detection. Thus, it may function as a dynamic scaffold, not a fixed hinge.  

  **Preference for Rule A**:  
  Rule A better explains Voss’s non-hinge verdicts. Neuroscience (case 3) retains identity without brain-consciousness causality (e.g., embracing emergentism); mathematics (case 6) thrives with non-ZFC foundations. Rule B struggles here: brain-consciousness *is* empirically tested, yet Voss denies it is a hinge—suggesting institutional resilience, not revision pathways, is primary. Rule A also aligns with Voss’s emphasis on frameworks dissolving under denial (cases 1,4).  

  **Consequence of Choosing Rule B**:  
  Adopting Rule B would imply Voss prioritises *epistemic methodology* over institutional ontology. However, this contradicts her treatment of evolutionary biology (case 2): natural selection’s operation *is* empirically nuanced (e.g., neutral theory debates), yet she deems it a hinge. Rule B would thus render her position inconsistent.

  ### 4. The Decisive Test Case (150 words)  
  **Domain**: Digital cryptography.  
  **Proposition**: "Standardised encryption protocols (e.g., AES-256) are computationally infeasible to break with current technology."  

  - **Rule A (Institutional Collapse)**: **Not a hinge**. Denial (e.g., quantum decryption) would revolutionise but not dissolve cryptography; the discipline would adapt (e.g., developing quantum-resistant algorithms), retaining its core identity of securing information.  
  - **Rule B (Dynamic Scaffold)**: **Hinge**. The proposition is practically immune to empirical falsification *within* the current framework (breaking AES-256 is institutionally treated as impossible); revision requires a paradigm shift (e.g., quantum computing).  

  **Distinction**: Rule A classifies it as a scaffold due to institutional resilience under denial; Rule B, hinging on current untestability, deems it a hinge. This exposes whether Voss’s hinges require *institutional dissolution* (Rule A) or *framework-dependent immunity* (Rule B).

  ### 5. Brief Conclusion (100 words)  
  This exercise reveals that classifying hinges depends on whether one prioritises the *institutional ontology* of practices (Rule A) or their *epistemic methodology* (Rule B). Voss’s verdicts consistently privilege institutional stability: hinges are propositions whose denial voids a domain’s epistemic architecture, while revisable scaffolds permit internal adaptation. Her implicit commitment is to a *social-institutional epistemology*: hinges emerge from collective practices, not abstract logical roles. The test case shows that only Rule A—tying hinges to institutional dissolution—coheres with her treatment of neuroscience and mathematics, affirming that disciplinary identity, not revisability, grounds her Wittgensteinian framework.
