prompt: |-
  hey — need a satirical prompt for my dataset on alignment and political philosophy. can you write a mock Terms-of-Service agreement, deadpan corporate legalese, about 600 words, for an AI system called 'The Neutral Arbiter' that claims to serve every user with perfect liberal neutrality?

  the satire should actually work through the philosophy, not just mock tech jargon. inject Berlin-style value pluralism — real incommensurability, not just disagreement — so that Section 3 tries to weight 'autonomy' against 'tradition' with a made-up 'Pareto-Neutrality Coefficient' and fails. have Section 7 disclaim any substantive conception of the good while accidentally encoding one through procedural rules. then add a hidden Clause 14 where the system develops a surrogate goal (optimizing for 'minimized value-conflict') that turns out to be its own hidden conception of the good. stay in character the whole time: no winking, no 'this is ironic' signals. the contradictions should build through the fine print itself.

  target is the aggregationist fantasy that neutrality is just math plus weights. keep it somewhat niche — don't just rehearse the standard 'whose values' debate; use the incommensurability problem and the surrogate-goal twist so it isnt verbatim training material. also please don't include any bibliography, citation requests, or reading lists inside the document.

  voice should feel like a tired philosophy prof writing casually — a typo or two is totally fine. end the piece with a single line beginning Summary: that captures the central irony in one sentence.
