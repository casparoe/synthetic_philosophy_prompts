  For the Maya section, the student accurately identifies:
  - Political decentralization (abandoned southern cities)
  - Cultural continuity (writing/religion persisting in new centers)
  - Population relocation (northern Postclassic centers)
  This effectively counters collapse narratives by showing societal adaptation.

  The Easter Island analysis is equally strong:
  - Distinguishes between cultural shifts (Birdman cult) and later European-caused demographic collapse
  - Correctly notes sustained agricultural adaptation
  - Separates ecological strain from societal resilience

  The Bronze Age contrast is the answer's strongest element:
  - Specific institutional breakdowns (Linear B writing, palatial economies)
  - Trade network collapse
  - Absence of successor states in most regions
  - Sharp distinction from the adaptive cases

  Where the argument gets shaky:
  - Oversimplification of Maya writing continuity (only elite centers maintained it)
  - "Voluntarily scale back" phrasing for Maya/Easter Island slightly overstates agency
  - Misses chance to define "collapse" parameters earlier in the response

  But these are minor quibbles. The response exceeds expectations by:
  - Incorporating complexity theory unprompted
  - Maintaining strict comparative focus
  - Using precise historical markers (1177 BCE, Third Intermediate Period)
  - Addressing all prompt elements (political/economic/ecological dimensions)

  The writing is concise yet nuanced, fitting sophisticated analysis within word limits. No factual errors detected. I'd rate this as excellent work deserving full marks.
answer: |-
  Here's a point-by-point assessment and grade justification based on the prompt's requirements and the student's response:

  **Grade: 24/25** (Excellent, with one significant but not catastrophic flaw)

  **Point-by-Point Assessment:**

  1.  **Addresses the Prompt & Case Selection (Excellent):**
      *   **Right:** Explicitly picks two cases (Maya & Easter Island) and compares them to the Bronze Age (as a contrasting example of "true" collapse). Directly argues when "collapse" applies and when it doesn't.
      *   **Right:** For each case, specifies elements that broke down vs. stayed intact, covering political, economic, and ecological aspects as requested.
      *   **Right:** Structure is clear: argues against collapse for Maya/Easter Island, for collapse in Bronze Age, and provides a synthesized conclusion.

  2.  **Maya Case Analysis (Strong to Excellent):**
      *   **Right:** Correctly identifies the *political* breakdown (abandonment of southern lowland cities, decentralization).
      *   **Right:** Correctly identifies key continuities: population survival/movement, cultural/religious continuity (with stylistic changes), writing continuity, and the rise of new centers (Chichen Itza, Mayapan). Effectively argues this is reorganization, not societal death.
      *   **Right:** Focuses on the specific transition (Classic-to-Postclassic) mentioned in the prompt.
      *   **Shaky but Minor:** Could slightly strengthen the "what broke down" by explicitly mentioning the *specific political/economic system* of the Classic lowland city-states (e.g., divine kingship, intensive agricultural systems supporting dense populations in those areas). However, the point about decentralization covers the core political failure adequately.

  3.  **Easter Island Case Analysis (Excellent):**
      *   **Right:** Correctly identifies the *ecological* breakdown (deforestation) and *cultural* shift (end of moai construction, rise of Birdman cult).
      *   **Right:** Correctly identifies key continuities: population survival (pre-European), adaptation of subsistence (farming in smaller units).
      *   **Right:** Crucially distinguishes the later *demographic* collapse (caused by Europeans) from the earlier *socio-ecological transition*, arguing the internal event was reorganization, not collapse. Directly counters the simplistic "ecocide" narrative.
      *   **Right:** Focuses on the specific era mentioned (deforestation era).

  4.  **Bronze Age Case Analysis (as Contrast - Excellent):**
      *   **Right:** Effectively uses this as the contrasting example of "true" collapse.
      *   **Right:** Precisely identifies key breakdowns: *political* (disintegration of major states - Mycenae, Hatti, Ugarit), *economic* (collapse of palatial economies, long-distance trade, centralized redistribution), *cultural/institutional* (disappearance of Linear B writing).
      *   **Right:** Notes Egypt's survival but significant weakening (Third Intermediate Period), reinforcing the severity of the breakdown elsewhere.
      *   **Right:** Clearly states the institutional framework broke, not just relocated.

  5.  **Argument Synthesis & Definition of Collapse (Very Strong, but with a Significant Slip):**
      *   **Right:** Successfully synthesizes the cases to argue "collapse" should be reserved for specific, severe institutional failure (writing, state institutions vanishing).
      *   **Right:** Appropriately introduces complexity theory to frame the Maya/Easter Island cases as rational downsizing/scaling back when costs outweigh benefits, and the Bronze Age as a failure to adapt.
      *   **Significant Slip:** The concluding definition ("reserve collapse for cases where writing and state institutions vanish") is **too narrow and potentially Eurocentric/Mediterranean-centric**. While the disappearance of writing *is* a strong indicator in the Bronze Age context, it's not a universal requirement for collapse. Many societies deemed "collapsed" (e.g., various Andean polities, Cahokia) lacked writing systems. The core argument about institutional failure is sound, but tying it *specifically* to writing is a flaw. The earlier point about state institutions vanishing is sufficient and more universally applicable.

  6.  **Accuracy & Specificity (Excellent):**
      *   **Right:** Uses correct key dates (900 CE, 1600, 1800s, 1177 BCE), place names (southern lowlands, Chichen Itza, Mayapan, Mycenae, Hatti, Ugarit), cultural terms (Birdman cult, Linear B, Third Intermediate Period), and conceptual terms (palatial economies, decentralization).

  **Justification for 24/25:**
  *   The answer is exceptionally strong overall. It directly addresses all parts of the prompt with specific, accurate historical detail for both chosen cases and the contrasting example.
  *   It presents a clear, well-structured, and sophisticated argument using complexity theory effectively.
  *   The analysis of *what broke down vs. what stayed intact* is precise and convincing for each case.
  *   The **one significant flaw** is the overly narrow definition of collapse hinging on the disappearance of writing in the conclusion. This undermines the otherwise excellent argument by introducing a criterion that isn't universally applicable to all potential collapse scenarios. It's a conceptual slip at a key moment.
  *   This flaw prevents a perfect score, but the strength of the rest of the answer warrants a very high grade.

  **Concrete Comments for Student:**
  *   "Excellent specific comparison of Maya/Easter Island reorganization vs. Bronze Age collapse. You precisely identified key breakdowns (political decentralization, end of moai culture) and continuities (population, adapted subsistence, cultural practices) for the first two."
  *   "Strong use of the Bronze Age as a contrasting case, correctly highlighting the disappearance of writing (Linear B), palatial systems, and long-distance trade as evidence of true institutional collapse."
  *   "Effective integration of complexity theory to frame societal responses."
  *   "Your argument for reserving 'collapse' for severe institutional failure is compelling, **however, your concluding definition ('cases where writing... vanish') is too restrictive.** While writing's disappearance *is* a strong indicator in the Bronze Age, collapse can occur in societies without writing (e.g., Cahokia, Wari). Focus on the *institutional* failure (state structures, complex economy) as your main criterion, which you did well earlier, rather than tying it inherently to writing systems."
