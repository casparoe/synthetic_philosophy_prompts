prompt: |-
  My study group is arguing about this debunking thing and I need outside eyes. Here's the argument my friend scribbled down — I think there's a typo in step (4) but I copied it exactly:

  (1) If a belief-type was shaped mainly by natural selection for survival or mating success, and if the facts those beliefs are about can't causally affect survival, then beliefs of that type are globally unreliable.

  (2) Moral beliefs — e.g., that torturing innocents is wrong — were shaped for social coordination. Moral facts, if real, are causally inert: knowing them doesn't change your reproductive odds.

  (3) So moral beliefs are globally unreliable.

  (4) Now apply the same pattern to belief D, where D is the claim that evolutionary debunking is sound. D was also selected for: skeptical, reductionist reasoning boosts status in some social niches, and tracking causal origins of belief helps with manipulation and alliance-building.

  (5) The facts D is about — epistemic norms, causal histories of belief — are also causally inert in the same way. Knowing that selection caused your belief doesn't change there survival.

  (6) Therefore D is globally unreliable too.

  (7) But if D is unreliable, we have no reason to accept (1).

  (8) So the debunker must either drop (1) or accept they have no grounds for it. He says this proves evolutionary debunking collapses into global skepticism and therefore proves too much.

  I think the weak point is somewhere between (4) and (6) — maybe (5) is wrong because epistemic norms aren't causally inert in the same way? Or maybe (4) is wrong because D wasn't selected in the same domain? But I can't tell if it's a subtle equivocation or if the argument is actually valid and I just have to bite a bullet. I want to keep (2) if possible, since it feels right that selection doesn't track moral truth. What's the right step to reject, and what does giving it up cost? Is there a hidden scope shift?
reasoning: |-
  Okay, the user is in a study group debate about evolutionary debunking arguments, specifically a self-defeat objection their friend proposed. The core issue is whether applying the debunking logic to itself leads to global skepticism. 

  Hmm, the user seems philosophically savvy - they recognize potential scope shifts and domain specificity issues. Their attachment to premise (2) suggests they're sympathetic to moral anti-realism but want to avoid epistemic collapse. Smart move questioning premise (5)'s causal inertness claim; that's where most metaepistemological debates focus.

  The friend's argument is clever but overextends. The key flaw is treating all "tracking truth" the same when selection pressures operate differently across domains. Moral beliefs face a tracking problem because their content (e.g., "torture is wrong") has no causal connection to fitness outcomes. But epistemic beliefs like D are *about* tracking mechanisms - that very content helps us model cause-effect relationships that do impact survival. 

  Ah! The user might be missing how domain-restricted reliability works. Even if some epistemic beliefs arose from social selection, their content refers to general truth-tracking capacities that can be recursively tested. Moral beliefs lack this reflexive property. That's why rejecting (5) doesn't undermine (1) - the inertness criterion applies asymmetrically.

  The cost of saving the argument? They'll need to accept that epistemic reliability emerges from cognitive faculties refined for instrumental success, not direct truth-tracking. But that's consistent with naturalized epistemology. No need to bite the global skepticism bullet.
answer: |-
  This is a fascinating and well-constructed self-referential argument against evolutionary debunking (ED). Your instinct that the flaw lies in steps (4)-(6) is correct. The argument equivocates on the *domain* and *content* of the beliefs being debunked. Here's the breakdown:

  1.  **The Core of Evolutionary Debunking (Premises 1-3):**
      *   (1) makes a specific claim: Beliefs shaped *exclusively* by selection for survival/mating *about facts that cannot causally affect survival/mating* are unreliable.
      *   (2) applies this to morals: Moral beliefs (e.g., "torture is wrong") were shaped *for social coordination* (a survival/mating advantage), and moral facts (if real) are causally inert regarding survival/mating.
      *   (3) Therefore, moral beliefs are unreliable *about moral facts*.

  2.  **The Self-Defeat Attempt (Premises 4-6):**
      *   (4) Claims belief D ("evolutionary debunking is sound") was *also* selected for (e.g., via status, manipulation, alliance-building).
      *   (5) Claims the facts D is about (epistemic norms, causal histories) are *also* causally inert regarding survival.
      *   (6) Therefore, D itself is globally unreliable.

  3.  **The Fatal Flaw: Scope and Content Mismatch in (4) and (5)**
      *   **The Critical Point:** Premise (1) only debunks beliefs *about domains* where the facts *cannot causally affect fitness*. **ED doesn't claim *all* beliefs shaped by selection are unreliable.** It claims this only for beliefs *about causally inert domains*.
      *   **Why Morals Fit (2/3):** Moral facts *are plausibly causally inert* in the relevant sense. Knowing the abstract truth of "torture is wrong" doesn't *directly* make you run faster from predators or attract more mates. The *adaptive function* of moral beliefs is social coordination, not tracking abstract moral truth.
      *   **Why Epistemic Beliefs (D) DO NOT Fit (4/5):**
          *   **Causal Efficacy of Epistemic Facts:** The facts D is about – **how beliefs are formed, what makes them reliable, causal histories** – **ARE causally relevant to survival and reproduction!** Knowing *how* to form reliable beliefs about predators, food sources, social allies, dangers, tools, etc., **directly impacts survival and reproductive success.**
          *   **Content Matters:** Belief D ("ED is sound") is a *meta-belief* about belief-forming processes. The *processes* it describes (tracking causes, understanding origins) are *precisely the kinds of processes* that *are* selected for *because* they help us track *causally efficacious* truths in the world (e.g., "that animal is dangerous," "this plant is poisonous," "that person is trustworthy"). **Selection plausibly *does* track truth *in domains where truth is fitness-relevant*.** Epistemic norms aren't inert metaphysical facts; they *describe* successful cognitive strategies *in the causal world*.
          *   **Selection Pressure for Instrumental Reliability:** While the *specific* belief D might confer social status in niches, the *capacity* for the kind of reasoning D represents (causal analysis, skepticism, reductionism) was likely selected *instrumentally* **because it reliably tracks truths about the causally efficacious world.** Forming accurate beliefs about causes *is* adaptive. D is an application of this capacity to a specific domain (belief origins).

  4.  **Why the Argument Fails & What to Reject:**
      *   **Reject Premise (5):** This is the cleanest and strongest rejection. **The facts D is about (epistemic norms, causal histories of belief) are NOT causally inert in the relevant way.** Understanding causal origins and reliable belief-forming methods *is* causally potent for survival. Knowing "selection caused my belief" *might* not directly change survival odds *on its own*, but the *general cognitive capacity to understand such origins* is deeply intertwined with tracking causally efficacious truths.
      *   **Implicitly Reject the Scope of (4):** Step (4) assumes D was shaped *in the same way* and *for the same reason* (purely for fitness, disconnected from truth-tracking in its domain) as moral beliefs. This is false. The reasoning underlying D (causal analysis) *was* plausibly shaped *because* it tracks truth in causally relevant domains. The *content* of D is *about* belief formation, which *is* causally relevant.

  5.  **What Giving Up Premise (5) Costs & Saves:**
      *   **Cost:** You must accept that our cognitive capacities for reasoning, causal analysis, and understanding belief origins *were* shaped by selection, *and* that this shaping process likely made these capacities *instrumentally reliable* for tracking truths about the causally efficacious world. This aligns with a naturalized epistemology.
      *   **Saves:**
          *   **Premise (1):** The core ED principle remains intact *for domains where the truths are plausibly causally inert* (like morality, abstract mathematics, perhaps some metaphysical claims).
          *   **Premise (2):** Your intuition that selection shaped moral beliefs for coordination, not tracking moral truth, remains viable. Moral facts remain plausibly causally inert.
          *   **Conclusion (3):** The debunking of moral realism stands.
          *   **Avoids Global Skepticism:** Beliefs *about* causally efficacious domains (physics, biology, basic psychology, *and crucially, the causal origins and reliability of beliefs themselves*) are *not* undermined by ED. ED targets specific domains.

  6.  **The Hidden Scope Shift:**
      The equivocation is precisely a **scope shift** regarding the *domain* of the beliefs being debunked. Premise (1) explicitly restricts its claim to beliefs *about domains where the facts are causally inert*. Steps (4) and (5) illegitimately *extend* this claim to beliefs *about a domain (epistemology/causation) where the facts ARE causally efficacious*. ED debunks beliefs in *inert domains*; it does *not* inherently debunk the epistemic tools *used* to perform the debunking, especially since those tools plausibly *were* selected for reliability in *efficacious domains*.

  **Conclusion:** Your friend's argument is clever but ultimately fails due to an equivocation on the scope of ED. **Reject Premise (5).** Epistemic facts and causal histories are *not* causally inert in the way moral facts are. Our capacities for reasoning and understanding causation *were* likely shaped by selection *for instrumental reliability in tracking causally efficacious truths*. This allows ED to debunk moral realism without collapsing into global skepticism or undermining its own foundations. You can keep (2) and the core ED insight while rejecting the self-defeat attempt. The cost is accepting that our epistemic tools, while products of evolution, are likely reliable for navigating the causally structured world they evolved within.
