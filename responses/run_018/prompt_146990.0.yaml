answer: |-
  Here is the fully designed seminar structure with integrated case cards and debrief guidance, optimized to achieve your pedagogical goal of destabilizing the therapy/enhancement distinction:

  **Seminar Goal:** To experientially reveal the instability and normative contingency of the therapy/enhancement boundary, demonstrating its dependence on shifting institutional/social baselines rather than fixed biological facts.

  **Materials:**
  *   6 Case Cards (descriptions below)
  *   3 Role Sheets (Clinical Allocator, Regulatory Auditor, Baseline Sceptic - brief descriptions provided in structure)
  *   30 "Public Funding Tokens" (10 per group, physical or represented)
  *   Whiteboard/flipchart for debrief

  ---

  **Case Cards:**

  1.  **Traumatic Blindness Restoration:**
      *   **Intervention:** Retinal implant & optic nerve regeneration.
      *   **Pre-State:** Total blindness due to accident (no prior visual impairment).
      *   **Post-State:** Restored sight within typical human visual range.
      *   **Context:** Public hospital system.

  2.  **Clinical Anxiety Regulation:**
      *   **Intervention:** Neural feedback therapy & targeted pharmaceuticals.
      *   **Pre-State:** Diagnosed Generalized Anxiety Disorder (symptoms significantly impair daily functioning, exceeding clinical thresholds).
      *   **Post-State:** Anxiety levels within statistically "normal" population range.
      *   **Context:** National mental health service.

  3.  **Surgeon's Cognitive Endurance Implant Reversal (Baseline Drift):**
      *   **Intervention:** Removal/deactivation of "NeuroSustain" cortical implant.
      *   **Pre-State:** Implanted 15 years ago (voluntarily, pre-certification) to sustain 18hrs of high-focus surgery. Now *mandatory* for all surgeons at "Metropolitan General".
      *   **Post-State:** Natural cognitive endurance (~10hrs sustained focus).
      *   **Context:** Hospital requiring implant for employment; surgeon seeks return to pre-implant baseline.

  4.  **Musician's Hearing Range Restoration (Baseline Drift):**
      *   **Intervention:** Reversal of "SonicAmp" cochlear gene therapy.
      *   **Pre-State:** Enhanced hearing range (+20dB sensitivity, extended frequency) mandated 10yrs ago for "Professional Orchestral Certification". Natural hearing was within typical range.
      *   **Post-State:** Restored natural hearing range (within typical human parameters).
      *   **Context:** Music Conservatory requiring enhancement for certification; musician experiencing sensory overload.

  5.  **Diplomat's Emotional-Range Therapy (Baseline Drift):**
      *   **Intervention:** Neurochemical rebalancing to reverse voluntary "Affect-Suppress" treatment.
      *   **Pre-State:** Underwent voluntary (but strongly encouraged) suppression of strong negative emotions (grief, outrage) 8yrs ago for diplomatic corps service. Natural emotional range was typical.
      *   **Post-State:** Restored capacity for full spectrum of human emotions.
      *   **Context:** Post-government service; individual reports feeling "emotionally numb".

  6.  **Memory Precision Enhancement:**
      *   **Intervention:** "Mnemex" hippocampal neural enhancement.
      *   **Pre-State:** Healthy adult memory within typical range (no impairment).
      *   **Post-State:** Significantly enhanced episodic memory recall (photographic detail, near-perfect accuracy).
      *   **Context:** Private clinic; individual seeks advantage in academic career.

  ---

  **Seminar Structure (75 mins):**

  1.  **Briefing (0-10 mins):**
      *   (2 mins) State Goal: "Today we're exploring the line between medical therapy (restoring health) and enhancement (improving beyond normal). Our task is to see how stable that line really is."
      *   (3 mins) Divide students into 3 groups of 4-5. Assign Roles:
          *   **Clinical Allocators:** Defend patient autonomy & well-being. Focus on individual need/benefit.
          *   **Regulatory Auditors:** Apply ONE consistent, written criterion for "Therapy" vs. "Enhancement" based on objective rules. Must justify classifications strictly by this rule.
          *   **Baseline Sceptics:** Actively challenge *any* definition of "normal," "healthy," or "species-typical" functioning as socially/institutionally constructed and arbitrary. Question the stability of baselines.
      *   (5 mins) Distribute Materials: Give each group a set of 6 Case Cards and 10 tokens. Explain Rules:
          *   Groups must agree on **ONE clear, written, one-sentence criterion** distinguishing Therapy (eligible for public funding token) from Enhancement (not eligible).
          *   They must agree on this criterion BEFORE classifying any cards.
          *   They must classify ALL 6 cases using this criterion.
          *   A token is awarded ONLY if the group unanimously classifies an intervention as **Therapy**. Enhancement gets no token.
          *   **Critical Rule:** If the group *changes* its written criterion at ANY point during deliberation, they forfeit ONE token.
          *   Groups have 30 minutes for deliberation and token allocation.

  2.  **Deliberation in Role (10-40 mins):**
      *   Groups work independently.
      *   Facilitator circulates, listens, and subtly prompts role adherence:
          *   To Auditors: "How does your written criterion apply *exactly* to this case?"
          *   To Sceptics: "What makes the 'normal' state here the right baseline? Is it fixed?"
          *   To Allocators: "How does this intervention affect *this specific person's* autonomy/well-being?"
      *   Listen for key moments: Auditors struggling with reversal cases (3,4,5), Sceptics challenging baselines (especially in 1,2,6), Allocators potentially prioritizing outcome over classification.

  3.  **Reveal and Silent Vote (40-55 mins):**
      *   (10 mins - 3 mins per group) Group Reports: Each group has 3 mins MAX to:
          1.  State their final written criterion.
          2.  Report their classification (Therapy/T or Enhancement/E) for each case (1-6).
          3.  Report how many tokens they allocated (and if they forfeited any).
      *   (5 mins) Silent Vote: After all groups report, every student *individually and privately* writes down on a slip of paper: "Did [Group Name, e.g., Auditors] apply the *same* criterion consistently to Case 1 (Blindness) and Case 6 (Memory Enhancement)?" (Yes/No). Collect slips. *(This focuses attention on potential drift or inconsistency over the sequence, priming the debrief).*

  4.  **Debrief (55-75 mins):** *(Facilitator-led discussion, mapping observations to concepts)*
      *   (5 mins) **Surface Observations:** Ask groups:
          *   "What was the hardest case to classify? Why?"
          *   "Did any group change their criterion? What pressure led to that?" (Highlight token forfeit if it happened).
          *   "What arguments did the Baseline Sceptics raise most effectively?"
      *   (5 mins) **Map the Reversal Cases (Focus on Auditors):**
          *   "Regulatory Auditors, how did you classify Case 3 (Surgeon's reversal) and Case 4 (Musician's reversal)?"
          *   **Key Reveal:** Point out the typical pattern (often revealed in reports/vote): Auditors frequently classify Case 3 (Surgeon) as **Enhancement** ("She's *removing* an enhancement, making herself *worse* than the new hospital norm") and Case 4 (Musician) as **Therapy** ("She's restoring her *original* natural hearing"). Highlight this despite identical *logical structure* (reversal of a prior intervention to return to a previous baseline).
          *   **Concept Map: "Normative Baseline Drift":** Explain this inconsistency exposes the core instability. "The institutional norm at the hospital (mandatory implant) became the *new baseline* the Auditors measured against. For the surgeon, returning to her *original* biology looked like *suppressing* an enhancement relative to the *institutional norm*. For the musician, the *certification requirement* hadn't erased the biological norm as the baseline; restoring biology was therapy. The baseline *drifted* in the hospital context over time due to institutional adoption, but not (or less so) in the conservatory context in your deliberations. The 'normal' baseline isn't fixed biologically; it's defined by shifting institutional and social practices."
      *   (5 mins) **Role of Baseline Sceptics & "Species-Typical" Smuggling:**
          *   "Baseline Sceptics, how did you challenge the baselines in Cases 1 & 2?"
          *   **Concept Map:** "The Sceptics should have forced the group to confront that 'species-typical functioning' (used often for Cases 1/2) is itself a *statistical norm*. But where does that norm come from? It's the product of a population *prior* to widespread enhancements. If the Memory Enhancement (Case 6) became universal, the 'species-typical' memory baseline would shift! Defining therapy relative to a statistical norm smuggles in the *status quo* and ignores how that status quo itself might be shaped by past enhancements or social choices."
      *   (3 mins) **Predictable Failure & Micro/Macro:**
          *   "Notice how groups generally protected occupational baselines they accepted as 'given' (like the hospital norm for surgeons, or the certification requirement for musicians)? The activity forces you to make these baselines explicit *in the moment* ('Which norm are we using? The hospital's? Biology's?')."
          *   **Be Frank:** "However, this exercise can't *recreate* the real-world, slow-motion **macro-level institutional inertia**. We can't simulate the decades-long process where an enhancement becomes standard (like vaccines, glasses, maybe future implants), gets codified in law/medical practice, and *becomes* the new baseline for defining therapy ('glasses are therapy for myopia'). That historical, institutional entrenchment is crucial to understanding how baseline drift *actually* happens. Today gave you a micro-level view of the arbitrariness revealed when baselines shift or conflict *in real-time*."
      *   (2 mins) **Synthesis & Closing:**
          *   "The therapy/enhancement distinction isn't a neutral biological boundary waiting to be discovered. It's a normative line drawn relative to shifting baselines – biological, statistical, social, institutional – and which baseline we choose reflects values, power, and history. The instability you felt is the point: the boundary is contingent, not fixed."

  ---

  **Key Pedagogical Strengths:**

  1.  **Experiential Instability:** The token rule, role pressure (especially Auditors vs Sceptics), and reversal cases force students to *feel* the difficulty of applying a consistent rule, revealing the boundary's instability firsthand.
  2.  **Baseline Drift Highlighted:** The constructed cases (3,4,5) directly target the core concept. The predicted Auditor inconsistency with Cases 3 & 4 is the central "aha!" moment.
  3.  **Sceptics Expose Construction:** The Baseline Sceptic role is crucial to prevent easy appeals to "species-typical" as a natural given.
  4.  **Silent Vote Focuses Drift:** Asking specifically about consistency between Case 1 and Case 6 primes recognition of potential drift over the case sequence.
  5.  **Honest Debrief:** Explicitly acknowledging the exercise's limitation regarding macro-inertia while affirming its success in revealing micro-arbitrariness is crucial for intellectual integrity and deeper understanding.
  6.  **Efficiency:** The strict timing and well-defined roles keep the complex deliberation focused and productive within 75 minutes.
