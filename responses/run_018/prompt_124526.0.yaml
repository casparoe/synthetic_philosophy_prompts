prompt: |-
  I'm a high school student in an advanced philosophy seminar, and we've been discussing whether categories like race or gender are socially constructed. I keep returning to money, since everyone agrees a dollar bill is just paper and ink, yet we treat it as having real value that survives the destruction of any particular bill. Still, I'm puzzled by an apparent inconsistency in how institutions actually manage different forms of it, and I want to know what hidden theory of value makes the inconsistency look acceptable.

  Consider the cluster of practices that govern physical cash, digital balances, and proposed central-bank digital currencies. In many jurisdictions, a torn banknote can be redeemed at a central bank if more than half remains, suggesting the value belongs to the token-type rather than to that specific piece of paper; yet a bent or defaced coin is typically withdrawn and melted without compensation, as if its material form were essential. Meanwhile, when a bank corrects a duplicated digital balance, it restores the amount precisely to the cent, treating digital money as pure information that must be preserved exactly, even though physical cash remains an anonymous bearer instrument whose loss is never tracked. Now add a newer design proposal: some central-bank digital currencies are being developed with embedded conditions—such as expiration after a set date or restrictions to specific merchants—programmed directly into individual units, something physically impossible with paper bills, yet both the programmable token and the paper note are legally designated as the same fungible currency.

  What philosophical commitments about the kind "money" does this cluster of practices presuppose? Does it assume that money is essentially a social relation that can be instantiated in any material form, or does it implicitly treat physical cash, corrected digital entries, and programmable tokens as belonging to different ontological kinds despite the legal fiction that they are all identical dollars? Reconstruct the implicit theory of value and kind-identity that makes these asymmetries coherent, distinguish what the practices strictly require from what merely fits them well, and say whether the introduction of programmable digital currency forces a revision in how we understand the social construction of monetary kinds. Please present your answer as a numbered list with exactly five items, each consisting of one or two sentences, with no introduction or conclusion.
reasoning: |-
  Hmm, this high school philosophy student is asking a sophisticated question about the nature of money as a social construct. They've observed inconsistencies in how different forms of money are treated - physical cash, digital balances, and proposed CBDCs - and want to know what underlying theory of value makes these practices coherent.

  I need to analyze the implicit philosophical commitments behind these monetary practices. The student notes several interesting contradictions: torn banknotes can be redeemed if over half remains (suggesting token-type value), while defaced coins are destroyed without compensation (implying material form matters). Digital money gets corrected to the exact cent (treated as pure information), while cash is anonymous and untracked. Programmable CBDCs add another layer with embedded conditions that are impossible for physical cash.

  The core question is whether money is fundamentally a social relation that can take any material form, or if different monetary forms actually belong to different ontological categories despite being legally called the same thing. I need to reconstruct the implicit theory that makes these asymmetries make sense.

  Looking at the practices, I see several key principles at work:
  1) Value resides in the system's recognition rather than materiality
  2) Institutional verification determines what counts as valid money
  3) Different forms have different affordances that shape their treatment
  4) Fungibility is maintained through institutional backing
  5) Programmable money extends but doesn't fundamentally change the social nature of currency

  For my response, I'll organize these into five precise points as requested - no intro or conclusion, just five numbered items of one or two sentences each. I'll distinguish what the practices strictly require from what merely fits well, and address whether programmable CBDCs force a revision of how we understand money as socially constructed.
answer: |-
  Here are the five items addressing your query:

  1.  The practices presuppose that money's value is essentially a credit relation, institutionally guaranteed and validated, not intrinsically tied to any specific material substrate; this allows diverse instantiations while requiring consistent recognition by the monetary authority.
  2.  Strictly required is that the central institution (central bank or commercial bank) must authoritatively verify and enforce the validity and quantity of any monetary unit, whether assessing a damaged note's redeemability, correcting a digital error, or executing programmed CBDC conditions.
  3.  The asymmetries (like destroying defaced coins but redeeming torn notes) fit well with differing affordances and verification costs: coins rely on standardized materiality for low-value trust, notes allow symbolic redemption via institutional authority, and digital forms enable precise informational tracking and control.
  4.  Treating physical cash, corrected digital entries, and programmable tokens as the "same" dollar relies on a legal-institutional fiction of fungibility grounded solely in the issuer's backing, not ontological identity; the practices reveal they are distinct operational kinds despite this nominal equivalence.
  5.  Programmable digital currency does not force a revision of money's core social construction (as a relation of credit/debt and trust), but it does expose and operationalize latent conditionalities and informational control aspects that were practically limited in physical forms, thereby expanding the *scope* of how social relations can be materially instantiated and governed.
