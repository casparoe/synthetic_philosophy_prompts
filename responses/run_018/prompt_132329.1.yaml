  For tensions between desiderata, syllable count vs. natural syntax is the classic example. French decasyllabics often force English into contortions, so I'll position this as an inevitable hierarchy dilemma rather than a theory-killer. When evaluating translation approaches later, I'll stay neutral but hint where literalism might fracture against phonotactic demands or functionalism could sacrifice musicality. 

