prompt: |-
  At a philosophy workshop, two participants — Maya and Leo — debated whether compatriots have special distributive claims. Maya opened by arguing that special obligations arise not from shared ethnicity but from being co-authors of a common institutional scheme: citizens jointly authorize coercive laws, share tax burdens, and expose one another to democratic risk in ways that create a distinctive reciprocity. Leo replied that this institutional defense begs the question, since many state boundaries are historically arbitrary and coercive. He proposed a distinction between membership obligations, which require consent, and coercive cohabitation obligations, which arise merely from being subject to the same state power; if Maya’s argument relies on the latter, then non-citizen residents and even outsiders affected by a state’s policies fall under the same umbrella, dissolving the compatriot priority she wants. Maya answered that Leo misses the specific reciprocity of risk-sharing unique to citizens — for example, citizens are uniquely liable to conscription or fiscal extraction by fellow citizens’ votes — and that this generates a legitimate priority even if borders are morally arbitrary. Leo countered that empirical risk-sharing is too contingent to ground normative priority: a wealthy citizen faces little real risk, while a foreign worker affected by her country’s trade policy bears substantial burden, so Maya’s criterion either over-includes or collapses back into cosmopolitan concern for anyone causally affected. They asked me to referee. Please go through their exchange step by step, rating the strength of each move, say where each speaker is right or wrong, and identify what both are missing — particularly regarding whether there is a principled line between political reciprocity and global causal interdependence.
reasoning: |-
  Hmm, the user wants me to referee a philosophical debate between Maya and Leo about special distributive claims among compatriots. This is a complex discussion in political philosophy about whether citizens owe more to each other than to foreigners, and what might justify that.

  Looking at the exchange step by step: Maya starts by arguing that special obligations come from being co-authors of institutional schemes - things like making laws together, sharing taxes, and facing democratic risks. She's drawing on social contract theory here. Leo responds that this is circular reasoning because state borders are arbitrary and coercive, meaning the institutions themselves might not be justified. He introduces an important distinction between membership obligations (which require consent) and coercive cohabitation obligations (which just come from being under state power). This challenges Maya's position because if she relies on the latter, then non-citizens affected by a state would have the same claims as citizens.

  Maya counters by emphasizing the unique reciprocity of risk-sharing among citizens - things like being subject to conscription or tax policies decided by fellow citizens. She argues this creates legitimate priority even with arbitrary borders. Leo then questions whether this risk-sharing is normatively significant enough to create special obligations, pointing out that wealthy citizens face little risk while affected foreigners bear real burdens. He suggests Maya's approach either includes too many people or collapses into cosmopolitanism.

  I need to evaluate each move carefully. Maya's institutional approach has strengths in explaining political obligations but faces the boundary problem Leo identifies. Leo's distinction is analytically sharp but might oversimplify how political membership works in practice. Both are missing important nuances - Maya downplays how institutions affect outsiders, while Leo underestimates the distinctive reciprocity of democratic systems. The key unresolved issue is how to distinguish political reciprocity from general causal interdependence in a principled way.

  The user seems knowledgeable about political philosophy based on how they framed this. They're likely looking for a balanced analysis that identifies what each side gets right and where they fall short, especially regarding the core tension between bounded reciprocity and global interdependence. I should address whether there's a meaningful distinction between these concepts that can justify special obligations to compatriots without ignoring our responsibilities to all humans.
answer: |-
  Here's a step-by-step analysis and adjudication of Maya and Leo's debate, rating the strength of each move and identifying key oversights:

  **Maya's Opening Move (Strength: 7/10 - Strong but incomplete foundation)**
  *   **Argument:** Special obligations arise from co-authorship in a shared institutional scheme (joint authorization of coercive laws, shared tax burdens, democratic risk-sharing), creating distinctive reciprocity. Rejects ethnicity.
  *   **Right:** Correctly identifies a powerful source of obligation distinct from ethnicity or mere sentiment. Highlights core features of democratic citizenship: mutual subjection to collectively authored rules, shared fiscal responsibility, and exposure to the unpredictable outcomes of collective decision-making (democratic risk). This *does* create a unique form of reciprocity.
  *   **Wrong/Missing:** Underplays the problem of *how* individuals become subject to this scheme initially (the boundary problem Leo raises). Assumes the legitimacy of the scheme's imposition is settled by the co-authorship *within* it, potentially begging the question against outsiders.

  **Leo's First Reply (Strength: 8/10 - Strong critique exposing foundational vulnerability)**
  *   **Argument:** Maya's institutional defense "begs the question" because state boundaries are historically arbitrary/coercive. Distinguishes "membership obligations" (requiring consent) from "coercive cohabitation obligations" (arising merely from subjection to state power). If Maya relies on the latter, it includes non-citizen residents and affected outsiders, dissolving compatriot priority.
  *   **Right:** Brilliantly identifies the core vulnerability: the arbitrary/coercive origin of state boundaries and subjection. The membership/coercive cohabitation distinction is analytically sharp and exposes the potential over-inclusiveness of Maya's institutional criterion. He correctly forces the question: *Why does being coercively subjected to a scheme* (without consent) *generate special obligations only to fellow citizens/subjects and not to all affected?*
  *   **Wrong/Missing:** Underestimates the potential *normative significance* of the specific *democratic reciprocity* Maya highlights, even within arbitrarily bounded schemes. His distinction risks making political obligation purely consensual (which is empirically problematic) or purely coercive (which is normatively weak).

  **Maya's Response (Strength: 6/10 - Identifies a key element but doesn't fully resolve Leo's challenge)**
  *   **Argument:** Leo misses the *specific reciprocity of risk-sharing unique to citizens*. Citizens are uniquely liable to burdens imposed *by fellow citizens' votes* (conscription, fiscal extraction). This unique reciprocity generates legitimate priority *even if* borders are arbitrary.
  *   **Right:** Successfully identifies a crucial element missing in Leo's critique: the *mutual imposition of risk via shared democratic agency*. Citizens don't just live under rules; they actively (through voting, influencing policy) impose risks and burdens *on each other* in a way they do not (directly) on outsiders. This mutual vulnerability and imposition *within* the democratic process *is* normatively distinctive. She's correct that this reciprocity can create priority *despite* arbitrary borders, as borders define the scope of this specific shared agency/risk pool.
  *   **Wrong/Missing:** Doesn't adequately address Leo's point about *non-citizens affected by the state*. While citizens impose burdens *on each other*, the state (acting as the agent of the citizenry) also imposes significant burdens *on outsiders* (via trade policy, sanctions, environmental externalities, military action, border controls). Why doesn't *this* imposition create a form of "coercive cohabitation obligation" towards them? She needs to explain why the *internal* reciprocity overrides the *external* impact.

  **Leo's Counter (Strength: 7/10 - Strong empirical challenge revealing internal tension)**
  *   **Argument:** Empirical risk-sharing is too contingent to ground normative priority. A wealthy citizen faces little real risk, while a foreign worker affected by trade policy bears substantial burden. Maya's criterion either over-includes (by including all affected globally) or collapses into cosmopolitan concern.
  *   **Right:** Delivers a powerful empirical challenge. The *actual* level of risk and burden imposed is highly unequal *within* the citizenry and can be greater *on some outsiders* than on privileged citizens. This exposes a tension in Maya's view: If the basis is the *fact* of risk imposition, then those heavily burdened outsiders should be included. If she retreats to the *formal structure* of mutual imposition via democratic agency (regardless of actual burden), then the wealthy citizen with minimal risk still has priority over the heavily burdened outsider – which seems arbitrary. He correctly forces her to choose between over-inclusion or abandoning compatriot priority for a broader "affectedness" principle.
  *   **Wrong/Missing:** Underplays the *symbolic and structural* importance of the *shared democratic agency framework*, even if burdens are unevenly distributed internally. The wealthy citizen is still formally subject to the same rules and potential risks *as determined by the demos*, even if they effectively avoid them. Leo risks reducing obligation purely to measurable harm, neglecting the distinct normativity of *joint authorship*.

  **Adjudication & What Both Are Missing:**

  1.  **Maya's Strengths:** Successfully grounds special obligations in a normatively rich concept of democratic reciprocity, co-authorship, and mutual risk-imposition within a shared institutional framework. This *does* create obligations distinct from general humanitarian duties.
  2.  **Leo's Strengths:** Forcefully exposes the foundational problem of arbitrary boundaries and coercive subjection. His distinction highlights the potential over-inclusiveness of institutional arguments and the significant burdens states impose on outsiders.
  3.  **Maya's Weakness:** Fails to adequately address the moral claims arising from the state's (and thus its citizens') imposition of burdens *on outsiders*. Her "unique reciprocity" argument risks ignoring the state's external impact.
  4.  **Leo's Weakness:** Underestimates the normative force of *shared democratic agency* as a source of special obligation, even with arbitrary origins. Reducing obligation to consent or measurable harm neglects the unique relationship created by mutually authoring the rules governing life together.
  5.  **The Core Problem Both Grapple With But Don't Resolve (The Principled Line):** Distinguishing political reciprocity from global causal interdependence requires focusing on the **nature of the relationship and the type of imposition**.
      *   **Political Reciprocity (Maya's Core):** Involves *mutual subjection and mutual authorization* within a *structured scheme of joint governance*. Obligations arise from being both authors *and* subjects of the same coercive rules, creating a closed loop of reciprocal imposition and vulnerability *mediated by the democratic process*. The border defines the scope of this specific agency-risk pool. *This is qualitatively different from mere causal impact.*
      *   **Global Causal Interdependence (Leo's Challenge):** Involves being affected by the *outputs* or *actions* of a state (or other global actors). While significant, this doesn't involve being part of the *authorizing body* or being subject to the *same scheme of mutual rule-making*. The imposition is often unidirectional (state -> outsider) rather than mutual.
      *   **The Principled(ish) Line:** Special distributive claims grounded in political reciprocity arise from **membership in a collective body that jointly authorizes coercive rules imposing mutual, binding obligations and risks on all members through a shared process.** This distinguishes citizens (and arguably permanent residents deeply integrated) from outsiders *affected* by the state's actions, even heavily. The line is drawn by the *structure of agency and subjection*, not merely by causal impact or residency alone.
  6.  **What Both Are Missing:**
      *   **The Problem of Affected Outsiders:** Neither fully resolves the *strength* of obligations *to* outsiders significantly burdened *by* the state's actions. While not based on the *same* reciprocity as citizenship, a strong case exists for *remedial obligations* based on harm, fairness, or a weaker form of reciprocity ("you impose rules/burdens on me, you owe me justification/minimal protection"). Leo points to this, but neither integrates it well.
      *   **Internal Heterogeneity:** Both somewhat idealize the citizenry. Leo highlights the wealthy citizen escaping risk; Maya needs to address how her reciprocity model applies when burdens are so unequally distributed *within* the demos that some citizens are effectively more *subject* than *author*.
      *   **The Role of Integration:** Leo's "coercive cohabitation" for non-citizen residents hints at a grey area. Long-term residents subject to laws/taxes but without voting rights participate in some reciprocity (paying for/public goods, subject to laws) but lack the full democratic agency. A more nuanced view might see them accruing *some* special claims based on integration into the institutional scheme, even without full membership. Neither adequately addresses this.
      *   **Beyond Risk:** Maya's focus on "risk-sharing" is too narrow. The reciprocity includes positive benefits (public goods, legal order, market access funded by taxes) and the fundamental good of having a say in the rules governing one's life.

  **Verdict:** Leo successfully exposes a major vulnerability in simple institutional arguments (boundaries, coercion, affected outsiders). However, Maya identifies a genuinely distinct normative core – the reciprocity of *democratic co-authorship and mutual subjection* – that can justify *some* degree of compatriot priority, even acknowledging arbitrary borders and state coercion. **The principled line lies in the unique relationship created by mutual subjection and authorization within a shared scheme of governance.** Yet, this does not absolve states/citizens of significant obligations to outsiders they harm; these obligations stem from different principles (harm, fairness, basic rights), not the *same* reciprocity. Both arguments are strong but incomplete; a full account needs to integrate the distinctiveness of political reciprocity with the undeniable moral claims generated by global interdependence and state coercion beyond borders.
