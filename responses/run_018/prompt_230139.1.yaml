answer: |-
  Here are five points addressing Simpson's Paradox:

  1.  **Pooled vs. Subgroup Conflict:** Consider a drug trial: overall, 60% on the drug improve vs. 50% on placebo, suggesting efficacy. However, within every pre-defined severity class (Mild, Moderate, Severe), the *placebo* group has a higher recovery rate (e.g., Mild: Drug 80% vs Placebo 85%; Moderate: 50% vs 55%; Severe: 20% vs 25%). Both summaries are mathematically correct descriptions of the same dataset, creating the paradox.
  2.  **Severity as a Confounder:** The reversal happens because disease severity acts as a **confounder**. It influences both treatment assignment (doctors preferentially gave the drug to more severe patients) *and* the outcome (severe patients have lower recovery chances regardless). The pooled result is distorted because the drug group had disproportionately more severe patients.
  3.  **Causal Roles Matter:** Seeing the full table shows *association* but doesn't tell us *why* severity relates to treatment. If severity is a confounder (as above), adjusting for it (using subgroup estimates) is likely correct for causal effect estimation. If severity were a **mediator** (the drug *causes* changes in severity which *then* cause recovery), adjusting might block part of the drug's effect. If severity were a **collider**, adjusting would create bias.
  4.  **Action Requires Causal Reasoning:** The numbers alone cannot tell us whether to act on the pooled result (drug appears effective) or the subgroup results (drug appears harmful within strata). We need a causal model: understanding *why* severity is associated with treatment (e.g., doctor bias = confounding) tells us the subgroup comparison (conditioning on the confounder) is likely the valid estimate of the drug's biological effect.
  5.  **Confidence & Uncertainty:** I am highly confident in this overall argument. The step I'm least sure about is whether non-collapsibility (a purely statistical phenomenon) *always* plays a role alongside confounding in creating the paradox, or if confounding alone is sufficient in practical examples like this one. The distinction between confounder/mediator/collider is crucial.
