answer: |-
  Good morning. It’s an honour to stand before this gathering, convened under the evocative title *Reading the Blank Spaces*. We are here to think together about microhistory, state archives, and the ethics of reconstruction – a task that feels both urgent and profoundly delicate. Looking around, I see faces representing distinct worlds of historical practice. Some of you spend your days immersed in the meticulous order of state repositories, deciphering census ledgers, diplomatic dispatches, and bureaucratic minutiae. Others of you work intimately with the textures of lived experience – gathering oral histories, preserving family papers, interpreting material culture, and holding embodied memory passed through generations. You bring different tools, different archives, and crucially, different forms of accountability. My task today is not to reconcile these worlds, nor to suggest one completes the other, but to welcome you all into a shared space of inquiry where our distinct commitments and discomforts can meet.

  The workshop’s title points us directly to the heart of the matter: the *blank spaces*. But let us be clear: a blank space is never simply neutral. It is not merely an absence awaiting discovery. It is, often, an absence *produced*. It is the silence shaped by power, by exclusion, by the very structures that determined whose correspondence was preserved in triplicate and whose story was deemed unworthy of the ledger. To read these blank spaces ethically requires us to confront a profound tension – one that structures my remarks this morning.

  We might frame this tension through the lens of what economists call "sunk costs" – investments already made that we cannot recover. Here, however, the costs are not financial. They are methodological, intellectual, and deeply institutional. Consider the immense collective effort poured into building, preserving, cataloguing, and mastering the interpretation of state archives. Generations of scholars and archivists have honed rigorous techniques to read these documents with extreme care, to extract meaning, to reconstruct events and decisions within the logic of the systems that produced them. This is not merely tradition; it is a hard-won expertise yielding invaluable insights into the mechanisms of power, governance, and elite society. To discard this entire project as irrelevant because of its inherent limitations would be profoundly irrational. The investment is real, the knowledge gained is significant, and the commitment to this form of rigor deserves respect. We honour that commitment by continuing to engage with these archives critically and skillfully.

  **And yet.** If we treat this methodological commitment – this mastery of the state's archive – as the *only* legitimate path to historical understanding, we risk committing a grave error. We risk interpreting the absence of certain voices, certain lives, certain experiences from these official records as a *natural void*. We risk seeing the silence surrounding non-elite lives, marginalized communities, or suppressed narratives as simply *how it was*, rather than recognizing it as an *engineered omission*. It is the result of choices made by the very institutions whose records we study. The blank space, in this light, is not passive; it is an active product of the systems we are trying to understand. To honour *only* the sunk costs of the state archive is to risk becoming complicit in perpetuating its exclusions. It risks implying that only lives captured within its rigid frames truly "count" as history.

  This brings us to the vital work represented by many of you – the work of engaging with counter-archives: oral testimonies, family records, songs, objects, landscapes, remembered pain and resilience. These fragments offer pathways into the spaces deliberately left blank. They demand an entirely different kind of rigor – a rigor of listening, of contextualizing trauma, of respecting the fragility and subjectivity of memory, of understanding that material culture speaks a language distinct from parchment and ink. This work is essential. It refuses to let the state’s silence stand as the final word.

  But here too, we face a critical ethical imperative. We cannot replace one form of mastery with another that pretends these fragments offer seamless, complete reconstruction. We must not romanticize absence into presence. We cannot invent voices to fill the silence. The gaps often remain gaps. The pain embedded in fragmented histories cannot be smoothed over with narrative convenience. Engaging with counter-archives means sitting with profound incompleteness, respecting the limits of what we can know, and acknowledging the weight of what was lost or deliberately destroyed. It means resisting the temptation to speak *for* those rendered silent, instead creating space for their legacies to resonate in their own complex, often unresolved ways.

  So, where does this leave us? It leaves us in a space of productive discomfort. It asks us to hold two complex truths simultaneously:
  1.  **The state archive is invaluable**, but its silences are not neutral; they are engineered, and mastering its logic does not absolve us of the responsibility to question its boundaries.
  2.  **Counter-archives are indispensable**, but they offer fragments, not completions; engaging with them demands ethical humility, resisting the urge to romanticize or invent, and acknowledging the enduring pain within the gaps.

  Neither group here arrives with methods or commitments that are beyond examination. The institutional investment in mastering state documentation is a profound sunk cost worthy of respect, but not immune to critique. The emotional and ethical investment in recovering marginalized histories through alternative means is vital and deeply valid, but also carries its own burdens and demands careful stewardship to avoid appropriation or misrepresentation. Neither path is simple; both involve costs and difficult choices.

  This workshop, *Reading the Blank Spaces*, is not about finding a single solution or declaring one path superior. It is about recognizing this shared discomfort as the very ground on which we might meet. How do we reconstruct ethically when the sources themselves bear the scars of power? How do we honour our methodological investments while acknowledging their necessary limits? How do we listen to silence without filling it falsely? How do we value different forms of evidence without establishing hierarchies?

  These are not questions for one group to answer for the other. They are our common problem. So, I invite you into the next two days not seeking easy consensus, but embracing the difficult, necessary conversation that unfolds within this shared tension. Let us listen to each other's expertise, acknowledge each other's commitments, and grapple together with the profound ethical weight of reading – truly reading – the blank spaces. Welcome. Let us begin.
