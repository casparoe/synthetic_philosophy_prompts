prompt: |-
  There's this pattern in professional certification thats always bugged me. To become a surgeon or electrician you do thousands of hours supervised practice then perform live — nobody cares if you can write an essay about cutting. But to become a philosopher or historian it's all essays and written exams, and nobody tests whether you can actually think well in real time. What's weirder is that some vocational programmes now make apprentices keep written reflection journals about what their hands are learning, as if knowing-how needs knowing-that to prop it up, while medical residencies don't ask surgeons to write about their gut feelings.

  What view of knowing how versus knowing that does that split presuppose? Does it treat them as genuinely seperate domains, or assume practical skill is always opaque without propositional backing? And why demand the translation for tradespeople but not surgeons — is it consistency, or just status? Reconstruct the implicit epistemology here: what's strictly required by the practice, what's just a nice fit, and is the whole thing philosophically underdetermined? Then tell me what'd have to change if we certified everyone the same way, purely practical or purely propositional.

  Answer in British English please. Don't bother with citations, I just want the reconstruction.
reasoning: |-
  Okay, the user is pointing out a discrepancy in how different professions certify their practitioners. Surgeons and electricians require extensive hands-on training, while philosophers and historians rely on essays and written exams. They're questioning the underlying assumptions about "knowing how" versus "knowing that," and why some vocational programs now include written reflections, unlike medical residencies.

  First, I need to unpack the epistemology here. The split seems to presuppose that practical skills (knowing-how) and theoretical knowledge (knowing-that) are distinct. For trades, there's an expectation that practical skills need to be articulated into propositions, whereas for surgeons, their expertise is trusted without that requirement. Why is that? Maybe it's about status—surgeons are high-status professionals, so their practical knowledge is seen as self-validating. Trades, on the other hand, might be seen as needing to justify their knowledge academically to gain legitimacy.

  The user also asks about the necessity within each practice. For surgeons, live performance is essential because the stakes are life-or-death. Writing essays wouldn't prove they can operate. Historians, though, need to construct arguments based on evidence, which writing demonstrates. But does writing an essay truly test real-time thinking? Probably not—it's more about structured analysis after the fact.

  Then there's the inconsistency in requiring tradespeople to journal their reflections. This suggests a belief that practical skills are opaque without theoretical backing, or maybe it's an attempt to elevate vocational training by adding academic components. Surgeons aren't asked to do this, implying their skill is seen as intuitive or beyond articulation. That’s a status difference.

  The user wants to know what would happen if all certifications were purely practical or purely propositional. If everyone had to do hands-on, how would philosophers prove their skills? Public debates or live analyses? For surgeons, written exams alone would be inadequate because you can't learn surgery from a book. It highlights that each field has different core requirements.

  Underlying all this is the philosophy of knowledge—Ryle's distinction between knowing-how and knowing-that. The current system treats them as separate but sometimes overlapping. The vocational journals try to bridge the gap, but it's not consistently applied. The status hierarchy might explain why surgeons aren't bothered with essays while electricians are. Maybe it's about societal values—intellectual vs. manual labor.

  The user might be frustrated with the lack of consistency and the implicit biases in certification processes. They could be implying that the system is arbitrary, influenced more by tradition and status than epistemological necessity. Their deeper need might be to understand why these disparities exist and whether there's a fairer way to assess competence across fields. They might also be critiquing the academic inflation where even hands-on jobs require theoretical work, possibly to appear more "educated."
answer: |-
  Right, let's dissect that implicit epistemology underpinning the certification split. It's a fascinating mess of practical necessity, tradition, and unquestioned status hierarchies.

  1.  **The Presupposed View of Knowing-How vs. Knowing-That:**
      *   **Separation, but with Hierarchy:** The system fundamentally treats "knowing-how" (procedural knowledge, skill) and "knowing-that" (propositional knowledge, facts, theory) as distinct domains. However, it doesn't see them as *equally* valuable or self-sufficient across professions.
      *   **Practical Skill as Potentially Opaque:** For *some* practical skills (especially those perceived as lower-status or less intellectually demanding, like many trades), there's an underlying assumption that the skill itself is insufficiently articulate or transparent. The practitioner might "just do it" without truly *understanding* the underlying principles. Therefore, demanding written reflection (translating know-how into know-that) is seen as necessary to ensure *cognitive depth* and *transferable understanding* – proving they aren't just trained monkeys.
      *   **Expert Intuition as Valid (for the Elite):** Conversely, for high-status professions like surgery, the intense, supervised practice is presumed to develop not just manual dexterity, but *embodied expertise* and *tacit knowledge*. The surgeon's "gut feeling" honed through thousands of hours is trusted *as a form of valid knowing*. Demanding propositional articulation of this tacit dimension is seen as either unnecessary (the outcome proves the knowledge) or even impossible/reductive (you can't fully capture complex intuition in words).
      *   **Theory as the Hallmark of the 'Purely Intellectual':** For philosophy/history, propositional knowledge (know-that) *is* the primary output and tool. The ability to construct complex arguments, analyse texts, and articulate ideas clearly *in writing* is conflated with the ability to "think well in real-time." The system presupposes that rigorous writing *demonstrates* and *constitutes* rigorous thought for these fields. Real-time dialectic (like a Socratic dialogue) is sidelined as impractical for mass assessment.

  2.  **What's Required, What's a Fit, and Underdetermination:**
      *   **Strictly Required by Practice:**
          *   **Surgeon/Electrician:** Demonstrated, reliable, safe *performance* under pressure/supervision. Knowing-how is paramount. Failure has immediate, tangible consequences (death, fire, electrocution).
          *   **Philosopher/Historian:** Ability to research, critically analyse complex information (texts, evidence, arguments), and construct coherent, well-supported *written* propositions. Knowing-that and its articulation is the core currency. Failure is conceptual/misinterpretive, with consequences playing out in discourse or application over time.
      *   **Merely a Nice Fit (or Tradition):**
          *   **Surgeon:** Extensive *written* exams on theory *beyond* the absolute basics needed for safe practice. While some theoretical knowledge is essential, the *depth* often tested in written exams may exceed what's strictly needed for competent execution in many routine procedures.
          *   **Trades:** Mandatory *reflective journals*. While reflection can enhance learning, demanding its *written propositional form* as a core certification requirement is often more about validating the programme academically or imposing a specific model of "understanding" than being strictly necessary for competence. A brilliant electrician might be terrible at journaling.
          *   **Philosopher/Historian:** The *exclusive* reliance on essays/exams, neglecting real-time critical engagement (debates, Q&A under pressure). While writing is essential, the ability to think dynamically and respond critically *in the moment* is also valuable but largely untested.
      *   **Philosophical Underdetermination:** The *degree* to which know-that must underpin know-how (or vice-versa), and the *best method* to assess the relevant capacities, is absolutely underdetermined. There's no single "correct" epistemology imposed by reality:
          *   Does an electrician *need* to articulate Kirchhoff's laws propositionally to wire a house safely? Probably not for most tasks. Does a historian *need* to think on their feet in a live debate to be a good researcher? Not necessarily. The *choice* of assessment method reflects tradition, practicality, institutional power, and crucially, **perceived status**, more than pure philosophical necessity.

  3.  **The Status Inconsistency (Why Journals for Trades but not Surgeons?):**
      *   It's overwhelmingly about **status and cultural capital**. Surgery sits firmly within the high-status "professions," historically aligned with universities and theoretical medicine. Its practical mastery is already cloaked in the perceived intellectual rigour of medical science. The skill is seen as inherently complex and cognitive *enough*; demanding written reflections on gut feelings would seem absurdly bureaucratic.
      *   Trades, historically seen as "mere" manual labour, lack this inherent intellectual prestige. Requiring reflective journals is an attempt to *academise* the training, to inject the "know-that" that supposedly legitimises the "know-how" and elevates it above "just" skill. It signals: "This isn't just manual work; it's *cognitive*." The demand for translation is a demand for *status validation* through the dominant currency of academia: propositional knowledge.

  4.  **Certifying Everyone the Same Way: The Consequences**
      *   **Purely Practical Certification (All Must Perform Live):**
          *   **Surgeons/Electricians:** Largely unchanged in core requirement, though perhaps streamlined (less written theory testing).
          *   **Philosophers/Historians:** Collapse. How do you "perform" philosophy live? Perhaps through rigorous public debates, extemporaneous critical analyses of unseen texts under time pressure, or live problem-solving in ethical dilemmas. Certification would favour quick wits, rhetorical skill, and performative confidence over deep, careful scholarship and complex written argumentation. Many excellent scholars would fail.
          *   **Trades:** The reflective journals vanish. Certification relies solely on observed competence. This might better identify naturally gifted practitioners but risks producing technicians who can't adapt to novel problems or explain their reasoning.
          *   **Overall:** Would massively disadvantage fields where the primary output *is* written propositional knowledge, elevating performative skill above deep analysis. Many forms of complex theoretical understanding become impossible to certify reliably.
      *   **Purely Propositional Certification (All Must Write Essays/Exams):**
          *   **Philosophers/Historians:** Largely unchanged.
          *   **Surgeons/Electricians:** Disaster. You could have people scoring top marks on essays about surgical technique or circuit design who are utterly incompetent with a scalpel or live wires. The essential embodied know-how, spatial reasoning, manual dexterity, and pressure management would be completely unassessed. Safety would be compromised immediately.
          *   **Trades:** Similar disaster. Reflective journals become the *only* assessment, ignoring actual hands-on ability. You'd certify people who can *write well about* bricklaying but can't lay a straight course.
          *   **Overall:** Would be catastrophic for any field requiring physical skill, embodied expertise, or real-time performance under pressure. Privileges articulate theorising over practical execution.

  **In essence:** The current split isn't driven by a coherent, philosophically rigorous epistemology. It's a pragmatic (and often inconsistent) patchwork reflecting the *different fundamental outputs* of each practice (performing an action vs. producing written analysis) and, crucially, **deep-seated cultural hierarchies** that value the theoretical "know-that" of academia while simultaneously granting elite practical professions like surgery a pass from having to constantly justify their "know-how" in propositional terms. The demand for translation from trades is less about epistemological necessity and more about a perceived need for academic legitimisation. The whole system is philosophically underdetermined but sociologically overdetermined by status.
