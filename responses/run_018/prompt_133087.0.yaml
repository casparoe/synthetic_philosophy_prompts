answer: |-
  ### Workshop Plan: Iterated Elimination in Mixed Strategies (45 minutes)

  #### **1. Foundational Setup (5 min)**
  - **Start with geometry**: "Mixed strategies are points in a simplex. For a player with \(n\) actions, the simplex is the set of probability vectors over those actions. Visualize it as a convex hull in payoff space."
  - **Why?** Econ grads grasp vectors/hulls faster than abstract lotteries. Use a whiteboard sketch:
    - Axes: Opponent’s pure strategies (e.g., "Player 2’s L" vs "Player 2’s R").
    - Points: Pure-strategy payoffs. Mixed strategies = convex combinations of these points.

  #### **2. Core Example: Silent Auction (15 min)**
  - **Why this example?**  
    Your 3-bidder auction (simplified to 2 players for clarity) has the right properties:
    - **Player 1 (Bidder)**: Actions = {Low bid, Safe bid, High bid}.  
      Payoffs against Player 2’s actions (L/R):
      ```
          L     R
      Lo  5     0
      Sa  2     2
      Hi  0     5
      ```
    - **Key insight**: Safe bid (Sa) is *not* dominated by any pure strategy (Lo or Hi) but is strictly dominated by a 50-50 mix of Lo and Hi.  
      → Mixed payoff: (2.5, 2.5) > (2, 2) for all opponent actions.
    - **Why not a 2x2 matrix?** Matching pennies lacks a strategy dominated *only* by mixtures (pure dominance suffices). Your auction forces them to think beyond rows.

  #### **3. Iterated Elimination Process (15 min)**
  - **Step 1: Define mixed-strategy dominance**  
    "A strategy σ (pure or mixed) is strictly dominated if there exists *any* mixed strategy σ' such that:  
    \( \mathbb{E}[u(\sigma', s_{-i})] > \mathbb{E}[u(\sigma, s_{-i})] \) for *all* opponent profiles \(s_{-i}\)."  
    → **Head off misconception #1**: "You *can’t* check cell-by-cell! Dominance must hold against *every* opponent profile simultaneously."
  - **Step 2: Iteration dynamics**  
    Delete Sa. Now the game reduces to Lo/Hi for Player 1.  
    - **New convex hull**: Line segment between (5,0) and (0,5).  
    - **Player 2’s payoffs** (e.g., asymmetric):
      ```
          Lo    Hi
      L   1     0
      R   0     3
      ```
      Eliminate Player 2’s L (dominated by R) → Iteration continues.  
    → **Head off misconception #2**: "Deleting Sa changes the hull! A strategy (e.g., Player 2’s L) may *now* be dominated."  
    → **Head off misconception #3**: "‘Never a best response’ and ‘strictly dominated’ are equivalent here—but dominance is our removal criterion. Don’t conflate them."

  #### **4. End-of-Session Check Question (5 min)**
  - **Question**:  
    "Player 1’s actions: A, B, C. Opponent profiles: X, Y. Payoffs:  
    ```
        X   Y
    A  6   0
    B  0   6
    C  3   3
    ```  
    Show that C is strictly dominated by a mixture of A and B. No need for best responses—just compare distributions."  
  - **Answer**: 50-50 mix of A/B gives (3,3) > (3,3)? Wait—strict domination requires *all* payoffs strictly greater. Adjust to:  
    ```
        X   Y
    A  7   0
    B  0   7
    C  3   3
    ```  
    → 50-50 mix: (3.5, 3.5) > (3, 3). **Crucial**: They must verify *every* opponent profile.

