  Dependency Order:
  1. Start with the geometric idea: a mixed strategy is a point in a simplex. This is visual and builds intuition quickly. We can represent strategies as points in a probability simplex and payoffs as vectors in Euclidean space.

  2. Then introduce expected utility over lotteries: since we are comparing mixed strategies, we need to know how to compute expected payoffs. But we can do this in the context of the geometric representation.

  So the sequence: 
     - Review: pure strategies and pure dominance (briefly).
     - Introduce mixed strategies as points in a simplex (for a player with n actions, the simplex is the set of probability distributions over n actions).
     - Explain that when we fix the strategies of others, the payoff to a mixed strategy of a player is a linear combination (expected payoff) of the payoffs of the pure strategies in the support.

  Then we can define strict dominance in mixed strategies: 
     A strategy (pure or mixed) σ_i is strictly dominated by another strategy σ_i' if for every strategy profile of the opponents, the payoff from σ_i' is strictly greater than that from σ_i.

  But note: we are going to eliminate strategies (pure or mixed) that are strictly dominated. However, in practice, we often eliminate pure strategies that are dominated by some mixed strategy, and then the set of mixed strategies over the remaining pure strategies.

