           Case 1: Proposed sentence > CC_upper -> proceed to step 10 (conflict: over-culpability)
           Case 2: Proposed sentence < CC_lower -> special handling (v): proceed to step 11 (conflict: under-culpability but meets efficacy)

  9. **Certification**  
     Question: Is there any other statutory bar to certification? (e.g., mandatory minimums not captured in the CC?)  
