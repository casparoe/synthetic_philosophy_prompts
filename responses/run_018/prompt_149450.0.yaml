  We are constructing a 30-minute audit procedure for sentencing proposals exceeding 12 months. The procedure must account for two anchors:
  1. Culpability Corridor (CC): The range of sentences proportionate to the offense, adjusted by mental state and bounded by statutory aggravation caps and mitigation floors. It is backward-looking (desert-based).
  2. Risk-Reduction Floor (RRF): The minimum sentence required to meet statutory targets for specific deterrence, general deterrence, and incapacitation, computed from recidivism-risk score and rehabilitation-time estimate. It is forward-looking (efficacy-based).

  The procedure must have:
  - Explicit stopping rules (where to stop and certify, stop and reject, or halt and escalate)
  - Conflict flags (when the two anchors conflict)
  - Points where a values judgment (by a Values Panel) is required

  Special handling for:
  (i) Mental-state ambiguity blocking OGI tier assignment
  (ii) Full voluntary restitution made before sentencing
  (iii) Cases where RRF exceeds CC upper bound
  (iv) Collective or corporate offenses with diffuse culpability
  (v) Proposals below CC lower bound but meet/exceed RRF

  Procedure Steps:

  1. **Confirm Eligibility for Audit**  
     Question: Is the proposed sentence greater than 12 months?  
     Sufficient Answer: Yes (proceed to step 2) or No (stop: not eligible for this audit).  
     Stop Rule: If No, reject the audit and note "Sentence not exceeding 12 months; not subject to mandatory audit."

  2. **Establish Offense-Gravity Index (OGI) and Mental State Tier**  
     Question: What is the OGI (1-10) and mental state tier (intentional, reckless, negligent, strict liability) for the offense?  
     Sufficient Answer: A clear OGI (from statutory harm tables and verified actual harm) and a clear mental state tier (from court findings).  
     Stop Rule/Halt: If OGI is missing or disputed (e.g., harm assessments vary widely) or mental state is ambiguous (e.g., forensic reports disagree without a clear preponderance), then halt and escalate to a three-person Values Panel.  
     Documentation: Note the source of OGI and mental state determination.  
     Special Handling (i, iv): 
       - For corporate/collective offenses (iv), if culpability is diffuse, use the highest OGI and mental state tier among the responsible individuals, unless the collective is being sentenced as an entity (then use the collective harm and the most culpable mental state that can be attributed to the entity).
       - If mental state ambiguity (i) blocks assignment (i.e., no clear preponderance of evidence for one tier), then halt and escalate to the Values Panel. The panel must resolve the ambiguity by choosing the tier.

  3. **Calculate the Base Culpability Range**  
     Question: Using the OGI and mental state tier, what is the base culpability range (from statutory tables)?  
     Sufficient Answer: A range (e.g., 5-10 years) from the jurisdiction's sentencing grid that corresponds to the OGI and mental state.  
     Stop Rule: If no such range exists (e.g., OGI or tier not found in tables), halt and escalate to Values Panel for resolution.

  4. **Apply Statutory Aggravation Caps and Mitigation Floors**  
     Question: Are there statutory aggravating factors that cap the upper bound or mitigating factors that set a floor?  
     Sufficient Answer: Adjust the base range from step 3 by applying the caps and floors as per statute. The result is the preliminary CC.  
     Documentation: List the aggravating and mitigating factors applied and their statutory basis.

  5. **Adjust for Special Mitigating Factors (e.g., Restitution)**  
     Question: Are there any special mitigating factors that require adjustment? Specifically, has full voluntary restitution been made before sentencing?  
     Sufficient Answer: If full voluntary restitution has been made, apply the standard restitution credit (as defined by statute or guideline) to the preliminary CC. This credit reduces the upper and lower bounds of the CC by a fixed percentage or absolute amount.  
     Stop Rule: If the credit would reduce the CC below the statutory minimum for the offense (if any), then the floor of the CC becomes that statutory minimum.  
     Special Handling (ii): Full voluntary restitution must be confirmed (by court records) and made before sentencing. The credit is applied to the CC, but note: it does not affect the RRF.

  6. **Finalize the Culpability Corridor (CC)**  
     Question: What is the final CC after all adjustments?  
     Sufficient Answer: A numerical range (e.g., 3-7 years).  
     Documentation: Clearly state the CC and the steps taken to derive it.

  7. **Compute the Risk-Reduction Floor (RRF)**  
     Question: What is the RRF?  
     Sufficient Answer: The RRF is computed from the validated recidivism-risk score and the rehabilitation-time estimate. The jurisdiction's statutory targets (for specific deterrence, general deterrence, and incapacitation) must be met.  
     How: 
       - If data are available: RRF = max( statutory minimum incapacitation time, time required for rehabilitation, deterrence requirements) but note that the RRF is the minimum sentence required to meet the targets. 
       - Where data are missing, use the conservative default (e.g., if recidivism risk score is missing, use the high-risk default; if rehabilitation time is missing, use the maximum typical time for the offense type). Do not impute.
     Documentation: Note the sources of data and any defaults used.

  8. **Compare Proposed Sentence with CC and RRF**  
     Question: Does the proposed sentence fall within the CC and meet or exceed the RRF?  
     Sufficient Answer: Check:
       a. Proposed sentence >= RRF?
       b. Proposed sentence within [CC_lower, CC_upper]?
     Stop Rules:
       - If both (a) and (b) are true: proceed to step 9 (certification).
       - If (a) is false: stop and reject (proposal below RRF).
