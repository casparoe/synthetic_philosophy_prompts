answer: |-
  ### Sentencing Audit Procedure  
  **Instructions**: Complete each step in sequence. Document answers in the worksheet. Use statutory tables, verified harm reports, and validated risk data. Halt and escalate to the Values Panel at designated steps—analysts do not resolve conflicts or ambiguities.  

  1. **Eligibility Verification**  
     - *Question*: Is the proposed sentence >12 months?  
     - *Sufficient Answer*: "Yes" (proceed to step 2) or "No" (stop).  
     - *Stop Rule*: If "No," reject and document: "Proposal ineligible (≤12 months)."  

  2. **Offense-Gravity Index (OGI) Assignment**  
     - *Question*: What is the OGI (1–10) based on statutory harm tables and verified actual harm?  
     - *Sufficient Answer*: A single integer (1–10) from uncontested harm data.  
     - *Halt Rule*: If harm data is contested (e.g., multiple exposure models with OGI varying by ≥3 points) or OGI is indeterminate, halt. Escalate to Values Panel. Document: "OGI ambiguity."  

  3. **Mental-State Tier Assignment**  
     - *Question*: What is the mental-state tier (intentional, reckless, negligent, strict liability) from court findings?  
     - *Sufficient Answer*: One clear tier (e.g., "reckless") with no conflicting evidence.  
     - *Halt Rule*: If forensic reports disagree without preponderance (e.g., reckless vs. negligent), halt. Escalate to Values Panel. Document: "Mental-state ambiguity." Apply mental-health mitigation credits if verified.  

  4. **Base Culpability Range**  
     - *Question*: What is the base sentence range (months/years) from statutory tables for the OGI and mental-state tier?  
     - *Sufficient Answer*: Range from jurisdiction’s sentencing grid (e.g., "60–120 months").  
     - *Stop Rule*: If no matching entry, reject and document: "No statutory base range."  

  5. **Culpability Corridor (CC) Adjustment**  
     - *Question*: Apply statutory aggravation caps and mitigation floors to the base range.  
     - *Sufficient Answer*: Adjusted numerical range (e.g., "48–96 months").  
     - *Special Handling (ii)*: If full voluntary restitution was made before sentencing, apply standard restitution credit (e.g., "reduce range by 30%").  
     - *Documentation*: List applied factors (e.g., "aggravation cap: +0%; restitution credit: –30%").  

  6. **Risk-Reduction Floor (RRF) Calculation**  
     - *Question*: What is the minimum sentence (months/years) needed to meet statutory targets for specific deterrence, general deterrence, and incapacitation?  
     - *Sufficient Answer*: Numerical value based on:  
       - Validated recidivism-risk score (e.g., "high risk → RRF = 120 months").  
       - Rehabilitation-time estimate (e.g., "36 months for program completion").  
     - *Missing Data Rule*: Use conservative defaults (e.g., missing risk score → "high-risk default"; missing rehab time → "maximum statutory estimate").  
     - *Documentation*: Cite data sources or defaults.  

  7. **Proposal Comparison**  
     - *Question*: Does the proposed sentence (P) satisfy:  
       - (a) P ≥ RRF?  
       - (b) CC lower bound ≤ P ≤ CC upper bound?  
     - *Stop Rules*:  
       - **Certification**: If (a) and (b) are true → **Certify**. Document: "P meets CC and RRF."  
       - **Rejection**: If (a) false → **Reject**. Document: "P below RRF."  
       - **Conflict/Halt**:  
         - If (a) true but (b) false due to **P > CC upper** → Proceed to Conflict Mode A.  
         - If (a) true but (b) false due to **P < CC lower** → Proceed to Conflict Mode B.  
         - If **RRF > CC upper** (regardless of P) → Proceed to Conflict Mode C.  

  8. **Conflict Mode A: P > CC Upper**  
     - *Documentation*: State P, CC, RRF, and: "Proposal exceeds desert ceiling."  
     - *Halt Rule*: Escalate to Values Panel.  

  9. **Conflict Mode B: P < CC Lower but P ≥ RRF**  
     - *Documentation*: State P, CC, RRF, and: "Proposal below desert floor but meets efficacy."  
     - *Special Handling (v)*: Note statutory mitigation limits.  
     - *Halt Rule*: Escalate to Values Panel.  

  10. **Conflict Mode C: RRF > CC Upper**  
      - *Documentation*: State RRF, CC upper bound, and: "Efficacy floor exceeds desert ceiling."  
      - *Halt Rule*: Escalate to Values Panel.  

  11. **Values Panel Escalation**  
      - *Analyst Action*: Hand off with:  
        - Worksheet (steps 1–10).  
        - Conflict summary (e.g., "RRF > CC upper").  
        - Unresolved ambiguities (e.g., "mental-state disagreement").  
      - *Values Panel Resolves*:  
        - Ambiguities (steps 2–3).  
        - Conflicts between CC and RRF (steps 8–10).  
        - Collective culpability (step 12).  

  12. **Special Handling (iv): Collective/Corporate Offenses**  
      - *Question*: Is culpability diffuse (e.g., multiple managers, no single intent)?  
      - *Halt Rule*: If yes, halt after step 3. Escalate to Values Panel.  
      - *Documentation*: "Diffuse culpability; no OGI/tier consensus."  
      - *Values Panel Task*: Assign OGI/tier for the entity or group.  

  ---

  ### Application to Proposals  
  **Worksheet Conventions**:  
  - CC: Culpability Corridor (desert anchor).  
  - RRF: Risk-Reduction Floor (efficacy anchor).  
  - P: Proposed sentence.  

  ---  
  **Proposal A**:  
  - *Step 1*: P = 18 months (>12) → Proceed.  
  - *Step 2*: OGI = 7 → Proceed.  
  - *Step 3*: Mental state = intentional → Proceed.  
  - *Step 5*: CC = 2.5–6 years (30–72 months). Restitution credit applied → CC = 30–72 months.  
  - *Step 6*: RRF = 1 year (12 months).  
  - *Step 7*:  
    - (a) P (18) ≥ RRF (12) → **True**.  
    - (b) P (18) in CC (30–72)? → **False** (18 < 30).  
    → **Conflict Mode B** (P < CC lower).  
  - *Step 9*: Document: "P (18mo) < CC lower (30mo) but meets RRF (12mo)."  
  - *Halt*: Escalate to Values Panel.  
  - *Outcome*: **Not certified**. Values Panel must decide if restitution justifies desert floor violation.  
  - *Analyst Intuition Overruled**: CC already includes restitution credit; further reduction violates desert.  

  ---  
  **Proposal B**:  
  - *Step 1*: P = 10 years (>12 months) → Proceed.  
  - *Step 2*: OGI = 9 → Proceed.  
  - *Step 3*: Mental state = reckless → Proceed.  
  - *Step 5*: CC = 4–8 years (48–96 months).  
  - *Step 6*: RRF = 10 years (120 months).  
  - *Step 7*:  
    - (a) P (120) ≥ RRF (120) → **True**.  
    - (b) P (120) in CC (48–96)? → **False** (120 > 96).  
    → **Conflict Mode A** (P > CC upper).  
  - *Additional Check*: RRF (120) > CC upper (96) → **Conflict Mode C** applies.  
  - *Step 8*: Document: "P (120mo) > CC upper (96mo); RRF (120mo) > CC upper."  
  - *Halt*: Escalate to Values Panel.  
  - *Values Panel Task*: Resolve anchor conflict—choose between:  
    - (1) Prioritizing efficacy (sentence ≥ RRF, violating desert).  
    - (2) Prioritizing desert (sentence ≤ CC upper, violating efficacy).  

  ---  
  **Proposal C**:  
  - *Step 1*: Assume P >12 months → Proceed.  
  - *Step 2*: Harm assessments vary by 3× → OGI ambiguous (e.g., models yield OGI 3, 6, 9).  
  - *Halt Rule*: Ambiguity → **Escalate to Values Panel** at Step 2.  
  - *Step 3*: Mental state: forensic reports disagree (reckless vs. negligent) → **Halt confirmed**.  
  - *Hand-off to Values Panel*:  
    - "OGI ambiguity: exposure models range OGI 3–9."  
    - "Mental-state ambiguity: reckless vs. negligent."  
    - "Diffuse culpability: three managers share authority."  
  - *Clinical-Legal Referee Task*: Resolve OGI and mental-state tier for the entity.  

  ---

  ### Structural Limitations  
  1. **Irreducible Anchor Conflicts**: Cannot algorithmically resolve when RRF > CC upper or P < CC lower but P ≥ RRF. Requires human values judgment.  
  2. **Non-Individualized Desert**: Cannot translate statistical RRF (group-based risk) into individualized desert claims within the CC.  
  3. **Ambiguity Adjudication**: Cannot assign OGI or mental-state tiers when evidence is contested; requires clinical-legal interpretation beyond analytics.  

  ---  
  **Procedure Finality**:  
  - The CC defines *desert* (backward-looking proportionality).  
  - The RRF defines *efficacy* (forward-looking risk management).  
  - Analysts never merge or prioritize these anchors—conflicts/ambiguities halt the process for the Values Panel.
