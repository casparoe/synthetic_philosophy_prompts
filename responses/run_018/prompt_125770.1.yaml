answer: |-
  ### Dialogue: The Frame-Bound Preference Paradox

  **Setting:** A sunlit corner of the economics department lounge, post-colloquium. Coffee cups rest on a low table between Dr. Elena Voss and Dr. Marcus Chen.  

  **Dr. Marcus Chen:** Elena, your presentation was characteristically elegant—but I fear it sidesteps the core issue in our irrigation cooperative case. These farmers cyclically reverse their rankings across market, council, and ritual frames without regret. You call this "register-relative preference," where each frame has its own utility representation. But doesn’t this reduce "utility" to a tautology? If preference is *defined* by choice, and choice shifts arbitrarily with context, utility explains nothing. It’s merely a label for the choice itself.  

  **Dr. Elena Voss:** Marcus, you’re conflating explanation with description. Revealed preference theory never promised a psychological *why*; it’s a bookkeeping system for consistent choice *within a given institutional frame*. In the market frame, farmers reveal a utility ordering where market pricing ≻ equal-ration ≻ hereditary-use. In the council frame, they reveal equal-ration ≻ hereditary-use ≻ market pricing. Each is internally consistent—no regret or confusion. That’s all we need for ordinal utility.  

  **Dr. Marcus Chen:** But consistency *within* a frame is trivial if frames are isolated! The problem arises *across* frames. When these farmers face a *new* hybrid scenario—say, a market-ritual arbitration—revealed preferences from any single frame fail to predict behavior. If utility isn’t anchored in a stable mental state—a belief, value, or disposition—how can it explain choices outside the original context? Your "utility" is just a shadow cast by the frame.  

  **Dr. Elena Voss:** You’re demanding cross-frame stability where none exists. These farmers aren’t irrational; they’re *contextually rational*. Market logic prioritizes efficiency, council logic fairness, ritual logic tradition. Each frame activates a different normative "grammar." Utility isn’t vacuous—it’s *indexical*, like coordinates on a map. Asking for a "stable" utility here is like demanding a single set of coordinates for London and Tokyo.  

  **Dr. Marcus Chen:** Then let’s drop the map analogy. If utility is purely indexical, it can’t *explain* why farmers choose market pricing in the market frame. It only records it. Explanation requires a causal story: *Why* does the market frame activate efficiency norms? I argue what’s stable isn’t a preference ordering but a *meta-commitment* to institutional appropriateness. Farmers feel bound to honor the frame’s norms—that’s the real "utility" driving choices. Revealed preference misses this depth.  

  **Dr. Elena Voss:** You’re smuggling in unobservables! How do we measure this "meta-commitment"? Revealed preference sticks to what we see: choices under constraints. In novel hybrids, we observe new choices and *derive* new utility indices. Your mental anchor is a ghost in the machine—it doesn’t improve predictions.  

  **Dr. Marcus Chen:** Doesn’t it? Suppose we survey farmers *before* choices, asking them to articulate their core values: efficiency, equity, tradition. We’d likely find all three matter, but their *salience* shifts with the frame. When the ritual frame makes tradition salient, it "overrides" efficiency, explaining cyclic rankings. Revealed preference can’t capture this salience hierarchy—it only sees outcomes.  

  **Dr. Elena Voss:** Surveys are unreliable! People misreport or rationalize. Revealed preference avoids that by inferring utility from *actions*. If you want proof of frame-relative utility, consider this: When we experimentally merge frames (e.g., "Choose now as both market actor and council member"), farmers’ choices form new, internally consistent patterns. Utility emerges locally; no stable prior is needed.  

  **Dr. Marcus Chen:** Yet without a prior, how do we explain *learning*? If a farmer encounters a new institution, they don’t choose randomly—they extrapolate from deeper values. Your local indices can’t model that. But I’ll concede this: If we could show choices in *entirely* novel frames are *unpredictable* even with full knowledge of past frame-specific utilities, you’d win. If they’re predictable, we need mental anchors.  

  **Dr. Elena Voss:** Conversely, if we find consistent choice *within* novel frames *without* invoking stable values—say, by showing choices align with frame cues alone—my view holds. So here’s the test: **Take farmers who’ve only experienced the market frame. Expose them to a contrived, alien institution (e.g., allocating water via poetry contests). If their revealed preferences in this new frame correlate with their market-frame choices, you win. If they align with the new frame’s logic alone, I win.**  

  **Dr. Marcus Chen:** Precisely. And we’ll measure not just choices but post-choice regret. If they express regret when forced to violate a cross-frame value (e.g., "I chose efficiency in the poetry frame, but it feels wrong"), it reveals the mental anchor. If not, your indexical utility suffices. Shall we design the experiment?  

  **Dr. Elena Voss:** Let’s. But I’ll wager a bottle of single malt: The poetry frame will birth a new utility ordering—untethered to the market.  

  **Dr. Marcus Chen:** And I’ll bet it echoes their efficiency commitment. *Lifts coffee cup.* To empirical arbitration.  

  **End.**  

  ### Key Features of the Dialogue  
  1. **No Straw Men:** Chen acknowledges Voss’s contextual rationality; Voss engages Chen’s salience argument.  
  2. **Direct Rebuttals:** Each responds to the last point (e.g., Voss counters Chen’s "meta-commitment" with observability concerns).  
  3. **Empirical Test:** The final test isolates whether novel-frame choices require cross-context stability (Chen) or emerge purely from local cues (Voss), using regret and predictability as metrics.  
  4. **No Resolution:** The scholars agree on a test but remain opposed—Voss defends local indices, Chen mental anchors.
