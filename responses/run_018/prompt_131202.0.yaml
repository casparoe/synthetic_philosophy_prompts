  Looking at the two sides: Interventionists argue that participation in harmful structures is inherently wrong, regardless of individual impact. They use terms like complicity and integrity. Skeptics counter that without causal difference, there's no harm, so no wrongness. They see expressive actions as irrational or aesthetic.

  The user suspects the conflict is conceptual—about what constitutes a moral reason. Efficacy-dependent vs. structural reasons. I should validate if this is accurate. The user wonders if it's verbal (defining "harm" or "wrong") or about unargued intuitions.

  Now, considering the user's deeper needs: As a doctoral student, they might be seeking clarity for their thesis or to move their reading group forward. They likely want to contribute original insights to the field. Their frustration suggests a need for practical solutions, not just theoretical debate. They might also be looking for validation of their hypothesis or new angles to explore.

  I need to break down the disagreement into concrete elements. First, examine the standard arguments from each side. Interventionists focus on participation in immoral structures, while skeptics demand counterfactual impact. Then, check if there are hidden empirical disagreements, like market elasticity or voting efficacy. The user says everyone agrees on facts, so it's probably not empirical.

  Next, assess the conceptual clash. The user's structural complicity vs. causal difference framework seems fitting. The sides are using different moral frameworks: one deontological (duties, integrity), the other consequentialist (outcomes). This aligns with the user's hypothesis.

  Also, consider the starting intuitions. Interventionists might have a visceral aversion to complicity, while skeptics prioritize tangible outcomes. These intuitions are foundational and hard to argue against, which could explain the stalemate.

  The user asks if changing the question could help. Shifting from "what difference do I make?" to "what kind of agent should I be in a harmful structure?" might reframe the debate. But would either side accept this? Skeptics might see it as avoiding the core issue of efficacy.

  Potential resolutions: Introducing a distinction between causal and moral redundancy could clarify that an action can be causally redundant but morally significant. Formal models integrating non-causal reasons might appeal to skeptics but could be seen as conceding too much. Collective-level analysis might bypass individual framing but may not satisfy those seeking personal moral guidance.

  Honestly, the impasse might persist because the disagreement is foundational. Each side values different aspects of morality. The best approach could be acknowledging the incommensurability and exploring when each framework applies, rather than seeking a winner.

