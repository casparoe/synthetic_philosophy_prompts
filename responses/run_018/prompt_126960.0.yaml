  What about empirical predictions? Good's view implies that rational agents should never avoid free information. But rivals like ecological rationality or resource-rationality suggest avoiding info due to cognitive costs. The user wants to know how these compare. The key difference is that Good assumes unbounded rationality, while others account for practical constraints.

  The user's deeper need seems to be understanding the boundaries of Bayesian rationality. They might be grappling with whether idealizations like Good's Theorem apply to real-world decisions. They also hint at concerns about the theorem becoming untestable if counterexamples are explained away. 

  I should structure the response by first outlining the fatal counterexamples, then the awkward ones, and finally address the unfalsifiability risk. Highlighting the Marschak Example and strategic games as the strongest challenges, while preference shifts and resource constraints as more manageable. Emphasizing that while some defenses exist, the position isn't unfalsifiable—it just requires precise formal conditions. 

  Also, the user wants exposure maps: what's genuinely risky vs. noise. Marschak and strategic ignorance are high-risk; preference shifts and cognitive costs are lower-risk because they can be incorporated into the model. The key is distinguishing between utility shifts and information costs, which the user seems aware of but wants clarified. 

