answer: |-
  Here's a breakdown of the genuine challenges to Good's Theorem (EVI ≥ 0), the awkward cases, defenses, and the risk of unfalsifiability, focusing on your request for "exposure maps" and formal counterexamples:

  **Core Principle:** Good's Theorem states that for a rational Bayesian agent with a fixed utility function, *before* acquiring evidence, the **Expected Value of Information (EVI)** is non-negative: `E[V|know] - E[V|not know] >= 0`. Acquiring free information cannot *systematically* harm expected utility under perfect Bayesian updating and optimal subsequent action.

  **Genuine Fatal Counterexamples (No Post-Learning Irrationality):**

  1.  **The Marschak Example (Preference Evolution / State-Dependent Utility):**
      *   **Scenario:** You must choose between `A` and `B` tomorrow. Your *preference* depends on an unknown state `S` (e.g., `S1`: You prefer `A`; `S2`: You prefer `B`). Crucially, *learning `S` today changes your future preference*.
      *   **Ignorance:** If you don't learn `S` today, you remain indifferent tonight and must choose arbitrarily tomorrow. Your ex-ante expected utility is `0.5 * U(A|S1) + 0.5 * U(B|S2)`.
      *   **Knowledge:** If you learn `S` today, your preference *tonight* shifts to match `S`. Tonight, you can pre-commit to tomorrow's choice. If you learn `S1`, you commit to `A` (getting `U(A|S1)`). If you learn `S2`, you commit to `B` (getting `U(B|S2)`). Your ex-ante expected utility is the same: `0.5 * U(A|S1) + 0.5 * U(B|S2)`.
      *   **The Twist:** Now add a *third option*, `C`. `C` gives a guaranteed, moderate utility `U_C` *tonight* if chosen tonight, but eliminates the `A`/`B` choice tomorrow. `U_C` is slightly less than the *average* of `U(A|S1)` and `U(B|S2)`, but higher than the *minimum* of `U(A|S1)` and `U(B|S2)`.
      *   **Ignorance Path:** You are indifferent tonight. You don't choose `C` (since its guaranteed `U_C` is less than the expected value of `A`/`B`). You choose arbitrarily tomorrow. **Ex-ante EU: Still `0.5 * U(A|S1) + 0.5 * U(B|S2)`**.
      *   **Knowledge Path:** You learn `S` tonight. Suppose `S1`: You *now* prefer `A` strongly. But you see that `U_C` is higher than `U(B|S1)` (which is now low because you prefer `A`). Fearing you might accidentally choose `B` tomorrow (which you now dislike intensely), you "panic" and choose the safe `C` *tonight* to lock in `U_C > U(B|S1)`. Similarly, if you learn `S2`, you fear choosing `A` and lock in `C` because `U_C > U(A|S2)`. **Ex-ante EU: `U_C`**.
      *   **Result:** Since `U_C < 0.5 * U(A|S1) + 0.5 * U(B|S2)`, the ex-ante EU is *lower* if you learn `S` than if you remain ignorant. **This violates EVI ≥ 0**.
      *   **Why it's Fatal & Formal:** No irrationality. Perfect updating (learning `S`). Optimal action *given the preferences you have at the time of choice* (choosing `C` when your current preference makes `A`/`B` risky). The violation stems directly from the *state-dependence of utility* and the *inability to commit to future actions* when ignorant. Good's theorem assumes a *fixed* utility function over outcomes; here, the utility of outcomes `A` and `B` *depends* on the state `S`, which is learned. This is the most widely accepted formal counterexample.

  2.  **Strategic Ignorance in Games (Self-Binding & Commitment):**
      *   **Scenario (Inspection Game):** You (Agent) can cheat (action `C`) or not cheat (`NC`). An Inspector can inspect (`I`) or not inspect (`NI`). Cheating undetected gives high payoff; cheating detected gives disaster. Not cheating gives low payoff. Inspector gets reward for catching cheating, pays cost for inspecting if no cheating. The Inspector moves first, but you might not *know* if they inspected.
      *   **Ignorance:** You don't know if the Inspector chose `I` or `NI`. Your optimal strategy might be to play `NC` regardless (playing it safe).
      *   **Knowledge (Free):** Suppose you magically learn the Inspector's move before you act.
          *   If you learn `NI`, your strictly dominant action is `C` (cheat undetected = high payoff).
          *   If you learn `I`, your strictly dominant action is `NC` (avoid disaster).
      *   **The Problem (Ex-Ante):** The Inspector, knowing you will get this information and act optimally, realizes:
          *   If they play `NI`, you play `C` => Inspector gets *punished* (cheating undetected).
          *   If they play `I`, you play `NC` => Inspector pays inspection cost for no reward.
          *   Therefore, the Inspector's best response is *never* to inspect (`NI`). Knowing this, you *always* cheat (`C`). **Ex-Ante EU for You:** Payoff of always cheating when Inspector never inspects.
      *   **Ignorance Path (Revisited):** If you *cannot* know the Inspector's move, the Inspector *might* choose `I` sometimes to deter cheating. Your safe play of `NC` might incentivize the Inspector to sometimes play `NI` (saving inspection cost), giving you a chance at the moderate `NC` payoff without the high risk of disaster. Crucially, the *equilibrium* where you remain ignorant *can* yield a higher ex-ante EU for you than the equilibrium where you have free information. Your ignorance acts as a *commitment device* to play `NC`, which deters the Inspector from always playing `I` (or forces them to play `NI` sometimes).
      *   **Why it Counts:** No irrationality. Perfect updating if informed. Optimal action given knowledge state. The lower ex-ante EU under knowledge arises from how your *access to information changes the strategic behavior of others* in equilibrium. Good's theorem considers the agent in isolation, not in strategic interaction where information access defines the game structure. **Ignorance binds you to a strategy (playing safe) that elicits more favorable behavior from others.**

  **Awkward Cases / Concessions by Defenders (Often Dismissed by Redefining Rationality/Utility):**

  1.  **Costly Preference Shifts (Non-State-Dependent):**
      *   **Scenario:** Learning tragic news (`X`) causes profound, persistent sadness that outweighs any instrumental benefit of knowing `X`. E.g., learning a loved one died painfully when you could never have helped.
      *   **Defender Response:** This is often argued to be outside the scope. *Rationality* implies acting optimally *given* your beliefs *and* preferences. The sadness *is* a direct utility cost. Learning `X` changes your *experienced utility state*. Good's theorem compares EU *before* learning, incorporating the *expected* utility impact of the knowledge itself, including psychological costs. If knowing `X` truly only brings sadness with no conceivable decision-relevant benefit, then EVI *is* negative, but this is consistent with the theorem because the utility function values "not experiencing that sadness state". The "cost" is baked into the outcome valuation. **Concession:** Yes, purely hedonic costs of knowledge can make EVI negative. **Rebuttal:** But this isn't "strategic ignorance" in the decision-theoretic sense you care about; it's avoiding direct disutility. The theorem holds if utility accounts for the hedonic impact of knowledge itself.

  2.  **Resource Constraints & Misupdating (The "Not Rational" Defense):**
      *   **Scenario:** Knowing information might trigger compulsive, irrational behavior (e.g., medical test result triggers hypochondria leading to harmful over-treatment) or consumes limited cognitive resources needed for other critical tasks.
      *   **Defender Response:** This explicitly violates the theorem's assumptions. Good requires *perfect updating* and *optimal subsequent action*. Hypochondria is flawed updating/action. Cognitive resource drain means the information isn't truly "free" – the cost is the opportunity cost of cognitive load. **Concession:** In real-world agents with bounded rationality, avoiding information *can* be instrumentally rational. **Rebuttal:** This doesn't challenge Good's theorem for the *idealized rational agent*, it highlights its domain of applicability. It's a reason why the theorem might not describe human rationality well, but not a counterexample to the formal result.

  3.  **Self-Destructive Knowledge (Extreme Cases):**
      *   **Scenario:** Learning a specific fact (`Y`) would literally cause a mental break, making you incapable of any rational action thereafter (e.g., cosmic horror).
      *   **Defender Response:** This collapses into (2). If learning `Y` destroys your capacity for rationality, then the "optimal subsequent action" clause fails. The expected utility calculation *before* learning must include the high probability of catastrophic outcomes due to subsequent irrationality. EVI could be negative, but again, due to the failure of the rationality assumption post-learning.

  **Unfalsifiability Risk: A Valid Concern, But Not Absolute**

  *   **The Risk:** "If every apparent counterexample is dismissed by saying the agent *wouldn't* have updated perfectly or acted optimally, or that their utility function *must* incorporate the hedonic cost, then the claim 'EVI≥0 for rational agents' becomes tautological and unfalsifiable."
  *   **Mitigations:**
      *   **The Marschak Example:** This stands as a clear, formal, non-tautological counterexample *within the intended scope* (decision-making under uncertainty). Defenders must either: 1) Reject it (difficult), 2) Argue it requires a *broader* notion of rationality incorporating commitment mechanisms (awkward), or 3) Narrowly redefine the theorem's assumptions to exclude state-dependent utility (making the scope very limited). This counterexample *prevents* complete unfalsifiability.
      *   **Strategic Games:** Similarly, defenders must concede the result doesn't straightforwardly apply to multi-agent strategic equilibria defined by information sets. Denying this requires arguing Nash equilibria with different information structures aren't comparable under a single ex-ante EU for the agent, which is problematic.
      *   **Burden of Specification:** Defenders bear the burden of precisely specifying what constitutes "fixed utility," "perfect updating," and "optimal action." The Marschak example exploits ambiguity around "fixed utility" when utility is state-dependent. Clear definitions limit ad-hoc defenses.
  *   **Conclusion on Risk:** The risk is real, especially concerning psychological costs and bounded rationality. However, formal counterexamples like Marschak and strategic games provide concrete falsifying scenarios *within the intended domain*, preventing the position from being *completely* unfalsifiable. Defenses often involve legitimately pointing out violations of explicit assumptions (like rationality post-learning).

  **Predictions vs. Rival Accounts:**

  *   **Good's Prediction:** A *truly* rational agent (unbounded, fixed utility, perfect updater, optimal actor) will *never* refuse *free* information that could potentially influence a future decision, *if* the only consequence is changing their beliefs and actions. Refusal implies either a cost (resource, hedonic) or anticipating post-learning irrationality.
  *   **Rival Accounts & Their Predictions:**
      *   **Ecological Rationality/Bounded Rationality:** Predicts refusal of information when processing costs outweigh benefits, when simple heuristics perform well without it, or when it triggers known biases. *Ignores info even if potentially decision-relevant and costless to acquire.*
      *   **Resource-Rationality:** Formally incorporates computational costs. Predicts refusal when expected improvement in decisions minus computation cost is negative. *Refuses costly info even if decision-relevant.*
      *   **Precautionary Principle (Behavioral):** Predicts refusal due to ambiguity aversion, loss aversion, or fear of negative affect, *even if* the info is free and potentially beneficial for decisions. *Avoids info due to anticipated irrational emotional response.*
      *   **Strategic Rationality (Game Theory):** Predicts refusal to enable commitment, manipulate others' beliefs, or maintain advantageous equilibria (as in the Inspection Game). *Uses ignorance as a strategic tool against others.*

  **Exposure Map: Genuinely Risky vs. Noise**

  | **Challenge Type**               | **Example**                  | **Genuine Risk to Good's Core** | **Defender Response Viability** | **Notes**                                                                 |
  | :------------------------------- | :--------------------------- | :------------------------------ | :------------------------------ | :------------------------------------------------------------------------ |
  | **State-Dependent Utility**      | Marschak Example             | ⭐⭐⭐⭐⭐ (Fatal)                  | 🛡️ Low (Requires major caveat) | Strongest formal counterexample. Exposes core assumption (fixed utility). |
  | **Strategic Ignorance (Games)**  | Inspection Game              | ⭐⭐⭐⭐ (Very High)               | 🛡️ Low-Med (Scope limitation) | Highlights isolation limitation. Ignorance as commitment is powerful.     |
  | **Hedonic Cost (Direct)**        | Learning tragic news         | ⭐ (Low)                        | 🛡️🛡️🛡️ High (Incorporates cost) | Defender concedes EVI can be negative, but argues it's consistent.        |
  | **Induced Irrationality**        | Hypochondria post-diagnosis | ⭐⭐ (Medium)                    | 🛡️🛡️🛡️ High ("Not Rational") | Valid real-world concern, but violates theorem's rationality assumption. |
  | **Resource Cost (Cognitive Load)**| Overloading working memory | ⭐⭐ (Medium)                    | 🛡️🛡️🛡️ High ("Not Free")      | Information isn't free; cost outweighs benefit. Theorem doesn't apply.  |
  | **Self-Destruct Knowledge**      | Cosmic horror insanity       | ⭐ (Low)                        | 🛡️🛡️🛡️ High ("Not Rational") | Extreme case of induced irrationality.                                   |
  | **Bounded Rationality Heuristics**| Satisficing without info     | ⭐⭐⭐ (High)                     | 🛡️🛡️ Medium (Scope limitation) | Shows descriptive weakness, not formal falsification of idealization.    |

  **Conclusion:**

  *   **Fatal Flaws:** **State-dependent utility (Marschak)** is the strongest formal counterexample demonstrating EVI < 0 under perfect rationality. **Strategic ignorance in games** is a highly potent practical counterexample showing how ignorance can be a beneficial commitment device.
  *   **Major Concessions:** Defenders concede that **direct hedonic costs** can make EVI negative and that the theorem says nothing about **boundedly rational agents** who might rationally avoid information due to processing costs or predictable biases.
  *   **Unfalsifiability Risk:** While a concern, it's mitigated by the existence of formal counterexamples like Marschak that force defenders to either accept them or significantly narrow the theorem's scope/assumptions. Defenses based on violations of rationality or non-free information are often legitimate applications of the theorem's stated preconditions.
  *   **Key Distinction:** Good's theorem is remarkably robust *if* utility is defined solely over final outcomes independent of the information state *and* if the agent is perfectly rational post-learning. The fatal counterexamples attack precisely these core assumptions (state-dependent utility, strategic isolation). Other challenges highlight the gap between ideal rationality and human cognition.

  The Marschak example and strategic game ignorance provide the "exposure" you seek: cases where knowing truly lowers ex-ante EU *even under perfect reasoning*, forcing defenders onto difficult ground. These are not mere "noise" about sadness or cognitive limits.
