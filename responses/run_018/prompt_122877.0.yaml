answer: |-
  Your suspicion is correct: the speaker and artefact arguments are distinct, and their differences reveal the core of rule-following scepticism. Below, I address your request systematically, arguing for a specific diagnosis of the core, comparing the arguments, and evaluating their difficulty.

  ### 1. **The Core of Rule-Following Scepticism**  
  The core is **semantic normativity**: the idea that meaning entails *correctness conditions* that are irreducible to non-normative facts (e.g., dispositions, physical states, or behavioural patterns). Underdetermination by finite evidence is a *trigger* for scepticism, but not its essence. The deeper problem is that no candidate fact can explain why one response (e.g., "125" for "68+57") is *correct* while others are *mistakes*—even if we know what response will occur. Kripkenstein’s regress of interpretation reinforces this: any rule (e.g., "add") requires interpretation, inviting a further rule to fix its meaning, ad infinitum. The core sceptical challenge is thus: **how can meaning impose normative constraints that outstrip actual behaviour or physical constitution?**

  ### 2. **Does the Artefact Argument Contain the Core?**  
  No—it only mimics the underdetermination problem while lacking semantic normativity. Consider your three points of divergence:  

  - **Mechanism and Relocation**:  
    Inspecting an ML system’s weights resolves *predictive* underdetermination (what output it *will* produce) but not *normative* underdetermination (what output it *should* produce). The claim "these weights implement addition" is indeed a rule-following claim vulnerable to the speaker argument: the physical state underdetermines whether it instantiates *addition* or *quus* (a divergent function). However, this relocation *dissolves* scepticism for artefact designers. For them, "correctness" is stipulative: it depends on the designer’s intent or the system’s training goal (e.g., minimizing loss on a dataset). The sceptical gap is bridged by external purposes, not intrinsic normativity. In contrast, the speaker argument denies that such purposes exist *within* the speaker—my brain state doesn’t "stipulate" correctness; it merely manifests dispositions.  

  - **Normativity vs. Prediction**:  
    The asymmetry is real and stems from **agency and accountability**. The speaker argument concerns what I *ought* to do to comply with a rule I take myself to be bound by. The artefact argument concerns what the system *will* do given its causal structure. Normativity arises only when an agent is subject to standards they can *fail* to meet. ML systems aren’t accountable; they merely process inputs. If we call an artefact’s output "incorrect," this reflects *our* norms (e.g., "it deviates from the designer’s intent"), not the system’s. This smuggles in the speaker argument only if designer intent is presupposed—but then scepticism targets *that intent*, not the artefact.  

  - **Sceptical Solution Analogues**:  
    Training data, loss functions, or user communities *collapse into realism* for artefacts. The function an ML system "learns" is determined by which function minimizes empirical risk (error) under its training distribution and loss function. This is a descriptive fact about optimization. For the sceptical solution to work in the speaker case, community agreement must *constitute* meaning (assertibility conditions replace truth conditions). But for artefacts, minimizing error is a *mind-independent fact*—no sceptical solution is needed.  
    **Crucially**, if we train a system *only* on a community’s assertibility judgments (e.g., "most people call this ‘correct addition’"), the system models *human dispositions*, not a rule’s normativity. It outputs what the community *would accept*, not what is *correct*. The sceptical solution can’t consistently deny such a system "means" something—but it would lack normative force. This is a cost: it reduces meaning to behavioural regularities, which the sceptic accepts but the realist rejects.  

  ### 3. **Which Argument is Harder to Answer?**  
  **The speaker argument is harder**, and the reason reveals what carries the weight: **the first-person perspective of agency**.  

  - **Why the artefact argument is easier**:  
    ML systems are third-person objects. Their "meaning" is fixed by design choices (intent, loss functions) or causal structures. Scepticism dissolves because:  
    - Correctness is observer-relative (e.g., "incorrect relative to the training goal").  
    - Underdetermination is resolved by mechanistic facts (weights) combined with external teleology (e.g., "this circuit is *for* minimizing cross-entropy loss").  
    This is a "straight realist" answer—no sceptical solution needed.  

  - **Why the speaker argument resists this**:  
    It targets the agent’s own perspective. When I add, I take myself to be guided by a rule that *obligates* me to answer "125"—not because of my brain or community, but because *that is what addition requires*. The sceptic shows that no fact can ground this obligation. Realist replies (dispositionalism, primitivism) struggle:  
    - Dispositions fail (I might be disposed to err; correctness isn’t statistical).  
    - Primitivism posits irreducible normativity but doesn’t explain how it attaches to physical facts.  
    - Use-based theories invoke community practices but collapse into the sceptical solution.  
    The speaker argument forces a dilemma: either accept anti-realism (meaning is assertibility) or embrace mystery (normative facts without explanation).  

  ### What This Tells Us  
  The artefact argument’s tractability reveals that **semantic normativity**—not underdetermination—is the engine of rule-following scepticism. When normativity is externalized (artefacts) or reduced to teleology (designer intent), scepticism eases. But for agents, normativity is intrinsic: I am responsible to rules I "grasp." This first-person obligation has no analogue in artefacts.  

  ### Open Questions  
  - **Is normativity reducible?** If teleology (e.g., biological functions) can ground norms naturally, a realist might co-opt the artefact model for speakers. But Kripkenstein challenges this: my brain’s "function" is as underdetermined as addition.  
  - **Does the sceptical solution work?** If community practices *constitute* meaning, the artefact trained on assertibility conditions "means" something—but only in a deflated, non-normative sense. Whether this suffices for meaning is contested.  

  In sum: the speaker argument is harder because it isolates the irreducibility of semantic normativity. The artefact argument is its shadow—a challenge to underdetermination that lacks normative bite, revealing where the real weight lies.
