  Hmm, the challenge here is to make the philosophical tension dramatic yet technically precise. Global workspace theory (GWT) typically treats global availability as sufficient for consciousness, but this hypothetical drives a wedge between functional access and subjective experience. The novelist needs architectural specificity—they want to know which part of GWT (availability, reportability, integration) becomes problematic.

  I should anchor the example in GWT's core architecture: the "broadcast" to specialized processors. Silent broadcasting would satisfy all functional checks—working memory engagement, verbal report, cross-modal integration—but strip away the qualia by making the "what it's like" aspect computationally inert. The key is showing how GWT's success conditions (information being globally available) get met while its explanatory target (phenomenal consciousness) slips away.

  For plausibility, I'll cite real phenomena like blindsight and masked priming where access and phenomenology dissociate, then push further into uncharted territory. The neuroscientist would defend GWT's sufficiency by pointing to intact functions; the philosopher would counter that the system could mechanically fulfill all roles without anyone "experiencing" red. 

  The trickiest part is making the metadata layer tangible. Maybe frame it as a "tag" (e.g., <wavelength:620nm>) that enables correct behavior but isn't itself transformed into subjective redness. Downstream processors treat it as data rather than food for experience-generation. That forces the question: if every access function works, why would we insist something's missing?

  Confidence-wise, I'm solid on the conceptual split but uneasy about whether real cognition could separate metadata from phenomenology so cleanly. The novelist should know that uncertainty—it might even fuel their characters' debate. 

