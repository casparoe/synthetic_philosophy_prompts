prompt: |-
  I'm giving the opening remarks tomorrow at a workshop called Archiving from the Margins — half the room are academic historians, half are community archivists and family historians who actually hold the boxes. I need about eight minutes.

  This hit me personally last month when I found my gran's notebooks and realised her records dont sit inside any standard chronolgy. She dated things by harvest failures and boat arrivals, not by interwar or postcolonial frames. So I've been stuck on whether the past can be told from everywhere at once — not just adding more voices, but whether there's even a shared frame that doesnt force one tradition's calendar onto everyone else.

  The idea needs to do real structural work: I cant pretend there's a neutral global timeline I can appeal to, but I also shouldnt collapse into saying every community lives in its own untranslatable past. Its a mixed audience, so dont lose the non-academics, but dont bore the historians with platitudes either.

  Please write the speech in British English. Structure it like this:

  - Personal hook (about 90 seconds spoken): set up why this isnt abstract for me.
  - The knot (around 3 minutes): lay out the tension — different traditions dont just disagree on what happened but on what counts as an event-frame at all, so a global history isnt just translation but translation between incommensurable chronologies.
  - What we do here (around 2 minutes): practical constraints — what we can ask of each other in this room without smuggling in one master calendar.
  - Closing charge (around 90 seconds): something that lands for both halves without feeling like a lecture.

  Keep it casual — I'm drafting this request on my phone on the bus, so a typo or two is fine. No citations or reading lists needed — just work with the idea as I've sketched it.
