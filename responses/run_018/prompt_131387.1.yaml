answer: |-
  Good morning everyone, and thank you for coming together for ‘Archiving from the Margins’. It’s genuinely thrilling to see this mix of perspectives in the room – the rigour of the academy meeting the deep, lived knowledge held in community boxes and family attics.

  **(Personal Hook: 90 seconds)**
  So, why am I buzzing – and maybe slightly terrified – about this? It became brutally personal last month. I was clearing out my mum’s loft, wrestling with dust and nostalgia, and I stumbled upon a battered cardboard box. Inside? My gran’s notebooks. Not diaries, really. More… jottings. Observations. Lists. Memories scribbled on the backs of old envelopes. And I sat there, cross-legged on that dusty floor, completely absorbed.

  But then came the frustration. Because Gran didn’t date things by the reigns of kings or queens, or neatly slot them into ‘interwar’ or ‘post-colonial’. No. Her chronology was the land, the sea, the rhythm of a life lived close to both. She’d note something happened “the year the potatoes blackened”, or “after the big storm took the pier”, or “when the *SS Orcadian* came in late that winter”. Trying to map her vivid, visceral sense of time onto the standard historical timelines I’d been taught felt… wrong. Like forcing her complex, weather-worn world into a flimsy, prefab box. It didn’t just obscure details; it felt like it erased the very *logic* of her experience. Her records weren’t misfiled; they existed outside the standard filing system altogether. That box wasn’t just holding papers; it was holding a whole different way of reckoning time and significance.

  **(The Knot: 3 minutes)**
  And that, right there, is the knot we’re here to unpick today. This isn’t *just* about adding more voices from the margins to the historical record – though that’s vital. It’s about something deeper, something structural. It’s about recognising that different communities, different traditions, don’t just *disagree* about *what* happened. They often fundamentally disagree on *what even counts as an event*, and crucially, *what frame you hang that event on* – the very calendar you use to make sense of time’s flow.

  For academic historians, we often work within established periodisations: ‘The Victorian Era’, ‘The Cold War’, ‘Post-1945’. These are powerful tools for analysis and comparison. But they’re constructs. They emerged from specific places and power structures. What happens when the most significant marker for a coastal community isn’t the coronation of a distant monarch, but the year the herring shoals vanished? Or for a family displaced by conflict, when chronology is measured in ‘before the crossing’ and ‘after the camps’?

  The challenge isn’t simply translating Gran’s ‘year of the bad harvest’ into ‘1927’ so it fits our timeline. It’s acknowledging that her *entire framework* – where time is measured by ecological cycles, community events, arrivals and departures – might be fundamentally *incommensurable* with the Gregorian calendar and its political epochs. A ‘global history’ built *only* by translating everything into one master chronology risks doing violence to the very ways of knowing it seeks to include. It smooths over the rough, vital edges. It risks turning the marginal into the merely decorative.

  **(What We Do Here: 2 minutes)**
  So, where does that leave us in this room today, with our shared passion for preserving the past, but perhaps different tools and frameworks? We can’t magically create a single, neutral, global timeline – that mythical beast doesn’t exist. And we shouldn’t collapse into saying every community’s past is an untranslatable island, sealed off from any connection.

  What we *can* do, practically, here in this workshop, is ask different questions. We can focus on the *work* of encounter between these different temporal logics:

  1.  **Listen for the Frame:** When someone shares a record or a story, let’s actively ask: *What marks time here?* What are the signposts? Is it seasons, generations, political upheavals, technological shifts, spiritual cycles? Don’t just hear the ‘what’, listen for the ‘when’ and the ‘how’ of its timing.
  2.  **Map the Connections, Don’t Force the Merge:** Instead of immediately converting ‘drought year three’ to ‘1891’, can we explore the *relationships*? What else was happening *in that community’s understanding* around that drought? And where might that drought year *intersect* with other timelines, creating points of shared – or contested – experience? Think of it as creating a multi-layered temporal map, not forcing everything onto one grid.
  3.  **Embrace the Patchwork:** Acknowledge that the archive we *collectively* build might be a bit messy. It might hold Gran’s notebook dated by boat arrivals *alongside* a historian’s analysis of interwar trade policy. The richness comes not from forcing them into one box, but from understanding how they speak to each other *across* their different frames, highlighting the gaps and the resonances. It’s about **archival bricolage** – building something meaningful from diverse, sometimes clashing, pieces. It’s about **temporal ecology** – understanding how different time-scales coexist and interact.

  **(Closing Charge: 90 seconds)**
  So, my charge to all of us today – whether you meticulously catalogue institutional collections or lovingly guard a single family trunk – is this:

  *   **To my fellow historians:** Let’s be humble translators, not imperial timekeepers. Our frameworks are powerful tools, but they are not the only lenses. Look for the chronologies embedded *in* the marginal records themselves. Where does their sense of time challenge ours? Where can it enrich our understanding of the *lived texture* of the periods we study?
  *   **To the community archivists and family historians:** Share your logic. Don’t feel pressured to retrofit your gran’s ‘harvest failure year’ into our academic jargon. Help us understand *why* that was the marker. Your boxes hold not just stories, but entire temporal landscapes. Your expertise in navigating those landscapes is invaluable.
  *   **To everyone:** Let’s approach this with curiosity, not the urge to conquer or convert. Let’s be comfortable with a bit of productive friction between different ways of telling time. Let’s ask: *How* does this record mark its place in history? Not just *when* according to my calendar.

  Because if we can do that – if we can listen across these different temporalities without demanding conformity – then maybe, just maybe, we *can* start to tell the past "from everywhere at once." Not as a single, smooth narrative on a single timeline, but as a vibrant, sometimes dissonant, deeply rich chorus of times and experiences. That’s the archive I want to help build. Let’s get to work.

  Thank you.
