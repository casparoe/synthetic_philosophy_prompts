prompt: |-
  I was arguing with my friends last night after a philosophy course on comparative ethics — we're trying to figure out if Confucian-style role ethics is actually one coherent idea or just a pile of "it depends on your hat." I wrote down my gut calls on a bunch of made-up edge cases and now I can't make sence of the pattern, so I need someone to tell me if there's a real principle behind them or I'm just rationalizing.

  Here are the verdicts. If you're a magistrate and your own son is on trial for corruption, you should recuse yourself completely, even if you swear you could be impartial; but if it's just some guy you play chess with once a month, stepping aside is silly overkill. A father should insist his kid perform the ritual greeting to an elder they actively dislike, because teaching li is part of the parental job, even if the kid sulks for a day; but if that kid is now thirty and living independently, the father shouldn't physically coerce them into bowing, since the role doesn't extend to forcing autonomous adults. I think a parent must correct a serious moral fault — say, the kid cheated a close friend out of money — even when the talk is harsh and temporarily kills the warm feeling between them, because the role includes moral formation, not just emotional comfort. But I also think that if the kid is in the middle of a severe depressive crisis, the parent should back off from that same correction and prioritize emotional safety, letting the fault slide for now. So correction sometimes trumps harmony, and sometimes harmony trumps correction, and I don't know what decides. A teacher grading her own child should neither inflate the grade nor penalize them to prove neutrality — just be accurate. A close friend should keep your secret about an old mistake if revealing it helps nobody, but should report you immediately if you're currently poisoning customers at your restaurant. If someone adopts an eight-year-old, they have full parental authority right away, with no probationary period; but if they only take in a neighbor's kid for two weeks while the parent is in the hospital, they have caretaking duties but not the deep moral-forming authority of a parent.

  Is there one principle — maybe about the scope, intensity, or "activation conditions" of a role — that captures all of this? Or do I need a small family of principles? I especially want your call on the case I haven't resolved: a retired magistrate is asked to sit in on an informal neighborhood arbitration, and one party is his estranged brother. Should he agree? And please be honest: which of my verdicts above forces any clean principle to break, especially that correction-versus-harmony tension? I feel like that's where the whole thing falls apart. Organize your answer like this: first, "Summary of verdicts" (about 150 words) laying out my cases concisely; second, "The principle and its clauses" (around 350 words) stating the best-fitting account, with one clause for each major case-type and an explicit rule for the depression exception; third, "The new cases" (around 200 words) giving your verdict on the retired magistrate and one other scenario you invent yourself; fourth, "What has to go" (around 150 words) saying which of my original judgments the simplest version of the principle can't save, and whether dropping it is actually okay. Keep it casual but precise — no bibliography needed, I'm just trying to think clearly.
reasoning: |-
  Okay, let me unpack this user's query. They're grappling with Confucian role ethics after a philosophy debate, trying to find coherence in their intuitive judgments about various scenarios. The core tension seems to be between role obligations and contextual flexibility—especially in that correction vs. harmony dilemma with the depressed kid. 

  First, I notice their examples cluster around role boundaries: when roles activate (adoptive parent vs temporary caretaker), how intensely they apply (father coercing adult child vs child), and when they yield to other concerns (depression exception). The magistrate cases suggest role purity matters most when authority is formal, while chess-friend recusal feels excessive because the relationship lacks structural power. 

  That depression case is the real knot. The user admits it strains their system because it pits the parent's moral duty against the child's immediate wellbeing. My instinct is that roles have a hierarchy of duties—sustaining the person's capacity for relationship might temporarily override moral formation when crisis hits. Like triage: fix the bleeding before treating chronic conditions. 

  For the new magistrate case... Hmm. Informal arbitration changes everything. No state authority, no compulsory verdict—but that estranged brother introduces emotional bias risk. The retired magistrate should disclose but not necessarily recuse if both parties consent. It's about maintaining ritual sincerity (cheng) more than rigid neutrality. 

  If I had to drop one verdict for coherence? The grading teacher's "just be accurate" feels idealized. In real Confucian households, avoiding even apparent partiality matters more than technical fairness—they'd likely have another teacher grade it. But maybe the user can live with that as a modern adaptation. 

  Inventing a test case: A doctor discovers her uncle is selling placebo "cancer cures." Duty to patients vs family reverence. Brutal. The role boundary here is lethality—imminent harm nullifies normal family obligations. She'd have to report him, then perform ritual apology to the family. 

  The elegance in their thinking is how roles flex at edges (temporary caretaker) but hold firm at cores (parental authority post-adoption). That depression exception isn't a failure—it's the system acknowledging that roles exist for human flourishing, not the reverse.
answer: |-
  ### Summary of verdicts  
  Your judgments prioritize role-specific duties but with key constraints:  
  - **Magistrate/son**: Recusal is mandatory (role integrity > impartiality claim).  
  - **Magistrate/chess partner**: No recusal (casual ties don’t threaten role integrity).  
  - **Child’s ritual greeting**: Enforce *li* (parental duty to teach), but **not** for autonomous adults (role scope fades with autonomy).  
  - **Correcting moral faults**: Parent must intervene (moral formation > temporary harmony) **unless** the child is in severe depression (crisis safety > correction).  
  - **Teacher/child grading**: Accuracy, not bias or overcompensation (role demands neutrality within bounds).  
  - **Friend’s secret**: Keep harmless secrets (loyalty), but disclose active harm (prevent harm > loyalty).  
  - **Adoptive vs. temporary care**: Full parental authority for adoption (role commitment), but only custodial duty for short-term care (role depth requires permanence).  

  ---

  ### The principle and its clauses  
  **Core Principle**: Role duties activate when (1) the role relationship is *structurally active*, (2) duties align with the role’s *core purpose*, and (3) actions respect the *current capacity* and *autonomy status* of all parties. Breakdown:  

  - **Clause 1: Structural Activation**  
    Roles bind only when the relationship is functionally operative (e.g., adoptive parent: active; temporary caretaker: inactive for deep authority). Magistrate roles bind during official duties but not informal arbitration.  

  - **Clause 2: Purpose-Bound Intensity**  
    Duties intensify when tied to the role’s essential function.  
    - *Teaching li*: Enforced for children (core to parenting) but not adults (autonomy overrides).  
    - *Moral correction*: Required when it serves role purpose (shaping character) but yields to crisis needs (depression: survival > moral formation).  
    - *Friend’s secret*: Loyalty persists unless it conflicts with a higher role purpose (preventing harm).  

  - **Clause 3: Autonomy and Capacity Limits**  
    Authority diminishes when recipients can self-govern (e.g., no coercing adults) or lack capacity to engage (e.g., depression suspends moral correction). Physical/psychological vulnerability triggers role adaptation.  

  - **Exception Rule: Crisis Preemption**  
    When a party’s immediate well-being is critically threatened (e.g., severe depression), all role duties subordinate to securing safety/stability. Harmony *temporarily* trumps correction because the person’s capacity to receive moral shaping is impaired.  

  **Why it coheres**: Roles aren’t rigid "hats" but frameworks *responsive* to relationship depth, societal function, and human fragility. The depression case isn’t a contradiction—it’s role ethics acknowledging that moral formation requires a functional recipient.  

  ---

  ### The new cases  
  **Retired magistrate in neighborhood arbitration with estranged brother**:  
  He **should recuse**. Though informal, arbitration demands perceived impartiality. Estrangement implies unresolved bias/threat to role integrity ("structural activation" clause). Neighborhood disputes rely on trust—his presence risks undermining the process’s legitimacy, even if he feels neutral.  

  **Your invented scenario**: A corporate manager discovers her best friend (a subordinate) is embezzling small amounts to pay medical debt.  
  **Verdict**: She must report it. The manager role’s core purpose includes protecting organizational integrity and other employees’ trust. Friendship loyalty conflicts with her structural duty to prevent harm and uphold systemic fairness ("purpose-bound intensity"). She can offer personal support *after* fulfilling role obligations.  

  ---

  ### What has to go  
  The **teacher grading her child** verdict ("be accurate") strains the principle. If role integrity demands avoiding *even the appearance of bias* (as with the magistrate), neutrality might be impossible here. Confucian ethics often prioritizes relational harmony over technical fairness—another teacher should grade the child to preserve classroom trust and parental humility.  

  **Is dropping it okay?** Yes—it’s the outlier. Your other judgments prioritize role purity *or* adaptive duty, but this one assumes impartiality is achievable without structural conflict. In practice, roles like magistrate/teacher require *proactive bias mitigation* (like recusal), not just good faith. Abandoning "just be accurate" for recusal here aligns better with your broader pattern.  

  **The depression exception holds**: It doesn’t break the system—it shows role ethics as contextually responsive. When a person’s capacity collapses, the duty shifts from moral shaping to custodial care, which is still role-bound (parent as guardian). No chaos: just layered priorities.
