answer: |-
  Your diagnosis is razor-sharp. The stall isn't about the empirical facts of the 1970s event – it's a collision of fundamentally different epistemic frameworks and purposes. Let's dissect the structure of the disagreement using your categories, then diagnose the deadlock and paths forward.

  **Brainstorming: Layers of Disagreement**

  1.  **Factual:** *Surface-level claim.* Both sides *accept* the documentary record (payroll, news) shows a lockout, not a strike. This layer is resolved but irrelevant to the core conflict. Neither side disputes the archive's *contents*; they dispute its *meaning and authority*.

  2.  **Normative (Ethical/Political):** *What* should *we prioritize/do?*
      *   **Historians:** Prioritize factual accuracy and prevent the spread of demonstrably false beliefs ("false consciousness"). Duty to the "dead" (the past as it was) and to historical truth as an ethical norm. Correcting error is intrinsically valuable.
      *   **Social-Memory:** Prioritize the social function of the narrative – identity formation, solidarity, resistance against ongoing power structures. Correcting the narrative *now* is seen as an act of symbolic violence, reinforcing the power that produced the archives and potentially harming present community cohesion/agency. Justice for the "living" (the present community) is paramount.

  3.  **Conceptual:** *What do key terms mean?*
      *   **Truth:** Historians lean towards **correspondence** (truth = matching the factual past). Social-memory leans towards **coherence** (truth = fitting meaningfully into the lived experience and identity of the community) or **pragmatic** (truth = what *works* for sustaining the community and its values).
      *   **History:** Historians see it as a discipline aiming at factual reconstruction based on evidence. Social-memory sees it as inherently interpretive, shaped by power, and potentially serving present needs.
      *   **Memory/Collective Memory:** Historians often see it as subjective, fallible, myth-prone individual/group recollection. Social-memory sees it as an active, constitutive social process *creating* identity and meaning, distinct from (but interacting with) historical scholarship.
      *   **Archive/Evidence:** Historians see them (critically) as sources to be analyzed for past facts. Social-memory sees them as *products* of power, inherently biased, and not neutral arbiters ("the victors' documents").

  4.  **Pragmatic:** *What are the consequences of action?*
      *   **Historians:** Fear myth replacing fact leads to distorted understanding, manipulable populations, and disrespect for the actual past.
      *   **Social-Memory:** Fear undermining the narrative destroys vital social glue, disempowers the community, and reinforces dominant power structures by accepting *their* version as the only valid one.

  5.  **Bedrock Intuitions:** *Foundational, often unstated commitments.*
      *   **Historians:** The past is ontologically distinct and knowable (even if imperfectly). Our primary duty is to *it*. Archives, critically handled, provide our best access point.
      *   **Social-Memory:** The past is always mediated through present needs and power structures. Our primary duty is to the *living community* and its struggles for justice/identity. The community's lived experience holds a unique epistemic authority regarding the *meaning* of the past *for them*.
      *   **Ownership of the Past:** This is the core unargued intuition driving the deadlock. Historians intuit the past "belongs" to no one and must be studied objectively. Social-memory intuit the past, especially traumatic/oppressive events, "belongs" in a meaningful sense to the community that experienced and inherited its consequences, giving their narrative a different *kind* of authority.

  **Diagnosis of the Deadlock:**

  *   **Not a Hidden Empirical Question:** While studying *if* corrections damage cohesion is valuable, it wouldn't resolve the core conflict. The social-memory side likely argues that *even if* it caused temporary harm, respecting community authority and the narrative's function is a *normative* imperative. The historians would argue *even if* it causes discomfort, correcting factual error is a *normative* imperative. The disagreement precedes empirical measurement.
  *   **Yes to Bedrock Intuitions ("Ownership"):** This is central. The two sides have fundamentally different, incompatible intuitions about the *primary claimant* on the past: Is it the dead event itself (accessed via evidence) or the living community shaped by it? Neither intuition can be "proven" within the other's framework. Arguing from evidence presupposes the historian's intuition is correct. Arguing from social function presupposes the social-memory intuition is correct.
  *   **Yes to Different Projects/Questions:** This is crucial. Historians are answering: **"What happened, based on the best available evidence?"** Social-memory scholars/community members are answering: **"What does this past event *mean* for us now? How does it shape our identity and struggles? What narrative sustains us?"** Forcing one answer to satisfy both questions is impossible.

  **Does "Mnemonic Jurisdiction" Break the Stall?**

  It **has significant potential to reframe and defuse the conflict**, moving beyond mere relabeling, *if* applied rigorously:

  1.  **Acknowledges Difference:** It explicitly states that "history" (academic discipline) and "collective memory" (community identity-formation) are different social practices with different **purposes, rules of evidence, and authorities**.
  2.  **Legitimizes Both Domains (Conditionally):** It grants the academic discipline jurisdiction over establishing the *factual sequence of events* based on its methodological standards (critical analysis of all sources, including archives). Simultaneously, it grants the affected community jurisdiction over the *meaning, significance, and commemoration* of that event *for their identity and social existence*.
  3.  **Dissolves the False Dichotomy:** It shows that "truth" is being asked to do incompatible jobs. The factual correspondence truth sought by historians isn't the same as the lived, meaningful truth embodied in collective memory. Asking which one is "true" is a category error.
  4.  **Practical Application (in this case):**
      *   **Academic Jurisdiction:** Based on archives + other evidence, historians conclude: "The event was factually a management lockout, not a worker-initiated strike. Evidence shows minimal organized resistance at the time."
      *   **Community Mnemonic Jurisdiction:** The community legitimately holds: "This event *represents* for us the crushing of worker agency and solidarity by management power. It's a foundational story of resistance *in spirit*, even if the specific trigger was a lockout. It symbolizes our ongoing struggle against oppressive structures, including those that produced the archives. This narrative *is* our truth of the event's meaning and legacy."
      *   **The "But":** Jurisdiction isn't absolute. If the community narrative started claiming specific, verifiable facts *contrary to evidence* (e.g., "The workers seized the factory gates"), that might infringe on the academic jurisdiction over factual sequence. However, framing it as "heroic worker-led resistance *against* the lockout" (focusing on spirit/meaning) likely stays within mnemonic jurisdiction.

  **What Counts as Progress?**

  1.  **Conceptual Reframing (Mnemonic Jurisdiction):** Explicitly adopting this framework is the most direct path. Progress looks like:
      *   Moving from "Who is right?" to "What kind of claim is being made, and under which jurisdiction does it fall?"
      *   Acknowledging that the community's narrative serves a vital function *without* requiring it to pass historical fact-checking for its *meaning*, while historians can establish facts *without* demanding the community abandon the narrative's emotional/social significance.
      *   Understanding that "correcting" the community isn't the historian's role regarding *meaning*; their role is to understand *why* that meaning exists and what function it serves.
  2.  **Shifting the Question:** Stop asking "Which version is true?" Ask instead:
      *   "What work does this collective memory *do* for this community?"
      *   "How does the documented historical event *relate* to the lived experience and inherited trauma/identity of the community?"
      *   "Can we articulate *both* the factual sequence *and* the powerful meaning it holds, acknowledging they answer different needs?"
  3.  **Living with Tension (Productively):** Recognize this isn't a puzzle to be solved but a fundamental tension inherent in how humans relate to the past. Progress means developing the intellectual humility and ethical sensitivity to hold both perspectives simultaneously without forcing reconciliation or dismissing either. It means historians respecting the authority of lived experience over meaning, and communities respecting the methodological authority of historians over factual reconstruction (even while critiquing the archives' origins).
  4.  **Empirical Study (Supportive, Not Resolving):** Research on how communities *actually* integrate (or reject) historical corrections into their collective memory, or on the specific social functions of *this* narrative, could enrich understanding but won't resolve the core normative/conceptual clash.

  **Conclusion:**

  The deadlock arises from a category error: conflating the project of **factual historical reconstruction** (answering "what happened?") with the project of **living collective memory** (answering "what does this mean for us now?"). Each has its own domain of authority, purpose, and criteria for validity. "Mnemonic jurisdiction" is a powerful conceptual tool to articulate this distinction and break the stalemate. It doesn't erase the tension – the factual record and the community's meaning will always coexist, sometimes uneasily – but it allows both to be acknowledged as legitimate within their spheres without demanding the other surrender. Progress comes from recognizing this duality, not from vainly trying to force one "truth" to rule them all. The seminar's next step should be to rigorously apply the "mnemonic jurisdiction" framework to this specific case and see if it allows for a more productive, less adversarial discussion of *both* the payroll records *and* the statue commemorating the "heroic stand."
