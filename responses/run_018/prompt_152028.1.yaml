answer: |-
  ### Exam Question  
  **Time Allowed:** 45 minutes  
  **Question:** The "paradox of deontology" is often illustrated by dilemmas where violating an agent-relative prohibition (e.g., "do not kill an innocent") could prevent *greater* identical violations by others. Some philosophers suggest this "paradox" arises from erroneously treating deontological constraints as *linearly aggregable*, akin to assuming physical forces scale proportionally without accounting for saturation thresholds or interference effects.  

  Precisely state the paradox of deontology. Assess whether diagnosing it as a *scaling error* (i.e., wrongly assuming prohibitions aggregate linearly like additive utilities) resolves the paradox or merely relocates the underlying tension. Defend a substantive position: does this analogy successfully reconcile agent-relative constraints with moral outcomes, or does it expose a deeper incompatibility in deontology? Use an original example *not* involving one vs. five lives.  

  ---

  ### Model Answer (496 words)  
  The paradox of deontology arises when adhering to an agent-relative prohibition (e.g., “do not torture”) appears irrational because it forbids an agent from performing a minor violation (e.g., administering non-lethal electric shocks) to prevent *multiple* other agents from committing *severely aggravated* versions of the same violation (e.g., five other agents each torturing a victim to death). This generates a conflict between the categorical nature of prohibitions and the intuitive demand to minimize overall moral harm.  

  The "scaling error" diagnosis posits that the paradox stems from illicitly treating deontological constraints as linearly additive, analogous to assuming that doubling a force in a physical system doubles its effect—ignoring non-linear phenomena like resonance or yield points. For instance, in a distributed surveillance system, five security agents each falsifying a minor report (a deontic "violation") to prevent a terrorist attack might seem aggregatively worse than one agent falsifying a major report. However, if prohibitions exhibit "threshold saturation" (e.g., minor falsifications become morally negligible below a harm threshold), aggregation fails. This reframes the prohibition as non-linear: small violations are permissible to avert catastrophic ones, dissolving the paradox by denying strict proportionality.  

  This diagnosis *relocates* rather than resolves the tension. It merely shifts the conflict to defining *where* saturation occurs (e.g., how minor must a violation be to become "non-violent"?). Consider an original case: a nurse must decide whether to briefly confine one patient (violating autonomy) to prevent five other nurses from imposing week-long unjust confinement on five patients. The scaling view suggests brief confinement is "sub-threshold" and thus aggregatively negligible. Yet this requires ad hoc moral quantification: how many person-hours of confinement equal one "full" violation? Deontology rejects such consequentialist calculus *by design*—agent-relative duties are indexed to the act, not its scaled impact. The analogy thus exposes deontology’s deeper incompatibility with outcome-sensitive reasoning.  

  Substantively, the scaling error critique fails to reconcile deontology with moral outcomes. It implicitly smuggles in consequentialism by permitting threshold-based trade-offs, thereby negating the core deontological commitment: that certain acts are intrinsically wrong *regardless* of scaled consequences. Even "saturated" minor violations retain their deontic character; allowing them to aggregate pragmatically collapses the view into rule-utilitarianism. The paradox endures because agent-relativity insists the *actor’s* integrity is non-negotiable, whereas scaling treats prohibitions as fungible inputs to harm reduction. Thus, the analogy valuably diagnoses a category error but underscores deontology’s irreducible tension with minimizing harm across agents.  

  ---

  ### Marking Scheme  
  1. **Precise paradox statement** (1 point): Must specify conflict between *agent-relative prohibitions* and *preventing greater aggregate violations by others*. Deduct for conflating with generic deontology/consequentialism debates or using prohibited one-vs-five examples.  
  2. **Scaling diagnosis assessment** (1 point): Must explain linear aggregation as the error (analogous to ignoring saturation in physics) and argue whether this *resolves* or *relocates* the paradox. Excellent answers note relocation to threshold definition; competent ones only describe the analogy.  
  3. **Original example** (1 point): Example must involve *multiple violators* and *differential violation severity* (e.g., minor vs. major confinement). Reject examples implying simple quantity trade-offs (e.g., harming A to save B+C).  
  4. **Substantive defense** (1 point): Position must engage whether scaling reconciles or exposes incompatibility. Excellent answers reject reconciliation by showing thresholds corrupt agent-relativity; competent ones accept it uncritically.  
  5. **Critical depth** (1 point): Must identify that scaling smuggles in consequentialism (e.g., thresholds require moral quantification) or that agent-relativity resists fungibility. Deduct for treating physics analogy as sufficient resolution without philosophical critique.
