  **Job Posting: Senior Archivist of Actual Occurrence**  
  *Bureu of Unmediated Past*  

  **About Us:**  
  The Bureu of Unmediated Past (BUP) is the premier institution dedicated to chronicling history *exactly as it happened*. We reject modern theoretical clutter, embracing Ranke’s sacred mandate: *wie es eigentlich gewesen*. Our archives are pristine, our sources untainted by mediation, and our coffee lukewarm—just as the past intended. Join us in our mission to preserve reality, unburdened by pesky "context" or "perspective."  

  **Role Overview:**  
  As Senior Archivist of Actual Occurrence, you’ll oversee the curation of primary sources documenting human events with surgical neutrality. Your duty: shield raw facts from the contaminating touch of interpretation. This isn’t storytelling—it’s truth-tending.  

  **Key Responsibilities:**  
  - Scrutinize historical artifacts (letters, pottery shards, unsent hate-mail) using our patented Bias-Detection Lenses™.  
  - Maintain *direct neural access* to primary sources via our Cerebro-Archival Interface (CAI). Mediation = termination.  
  - Achieve a monthly Ranke Purity Score (RPS) of 98.7+ by eliminating subjective intrusions (e.g., noting "Charlemagne had feelings").  
  - Collaborate with our Reality Compliance Unit to flag colleagues exhibiting "narrative leanings."  

  **Qualifications:**  
  - PhD in Literal Historiography or adjacent field (e.g., Notarial Sciences, Forensic Timestamping).  
  - Certified Rankean Purist (CRP) with RPS above 98—verified by our third-party auditor, *FactLabs Intl*.  
  - Zero interpretive bias (self-reported). *Note: Applicants scoring >0.3 on the Carr Drift Scale need not apply*.  
  - Proven ability to absorb primary sources without subconscious emplotment. *Dream journals subject to audit*.  

  **Perks & Culture:**  
  At BUP, we *accidentaly* foster innovation! Our team thrives on rigorous epistemological flexibility, offering:  
  - **Carr Drift Allowance**: Annual stipend to offset inevitable "temporal perspective shifts" (taxable as income).  
  - **Narrative Emplotment Bonus**: Quarterly rewards for staff who optimize event sequencing toward departmental KPIs.  
  - **White Tuesday**: Our beloved office holiday! Vote on which narrative trope (Tragedy? Farce?) to impose on Q4 fiscal outcomes. Pies provided.  
  - **Wellness Support**: Mandatory deprogramming sessions for archivists exceeding White Emplotment Index (WEI) thresholds.  

  **Metrics That Matter:**  
  - **Ranke Purity Score (RPS)**: Your compass for factual hygiene.  
  - **White Emplotment Index (WEI)**: Tracks how efficiently raw events are structured into actionable arcs (target: ≥7.8).  
  - **Trope Velocity**: Speed at which historical ambiguity resolves into allegory.  

  **Apply Now:**  
  Submit your RPS certification, neural CAI calibration logs, and a *mediation-free* CV through our portal. *Note: Cover letters containing verbs like "contextualize" will auto-delete*.  

