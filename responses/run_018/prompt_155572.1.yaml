  Here's a breakdown of the philosophical machinery behind the preservation board's rubric, the impact of their inconsistency, and how rival theories would reshape the system:

  1.  **The Rubric's Implicit Commitment: Epistemicism Lite (But Leaky)**
      *   **The Surface Claim:** Using a *precise* numerical threshold (73.5) calculated down to decimals strongly *suggests* an epistemicist stance. The board acts *as if* there is a sharp, objective boundary between "permissible to demolish" and "significant harm requiring preservation," located exactly at 73.500... on their scale.
      *   **The Implication:** Vagueness in concepts like "architectural integrity" or "cultural significance" is treated as a problem of *measurement* or *calculation*, not inherent indeterminacy. The precise algorithm is their tool for approximating or revealing this hidden boundary. The "formula is the formula" rhetoric reinforces this – it's presented as uncovering an objective truth, not making a policy choice.
      *   **Why "Lite"?** True, hardcore epistemicism (like Williamson's) posits boundaries in natural language. The board is applying it to a *constructed administrative category* ("significant harm warranting automatic denial"). They are *stipulating* a boundary where none necessarily exists in the world, *pretending* it's discovered. It's epistemicism adopted as administrative dogma.

  2.  **Could Supervaluationism Defend the Rubric? Yes, But Awkwardly**
      *   **The Defense:** A supervaluationist *could* argue the rubric is simply one "admissible precisification" among many possible ways to define "significant harm." The precise number is a *practical decision-rule* chosen for administrative efficiency and consistency, not because it magically discovers the One True Line. The lack of borderline appeals is a choice to avoid messy case-by-case adjudication at the margins.
      *   **The Awkwardness:** Supervaluationism fundamentally acknowledges borderline cases (where no precisification is definitively "correct"). The board's absolute refusal of human appeal *denies the existence* of these borderline cases *within their system*. By eliminating the "zone of penumbra," they act *against* the core supervaluationist insight. The rubric *becomes* the single, rigid precisification, mimicking epistemicism in practice.

  3.  **The Inconsistency Twist: Corrosion for Both, Fatal for Epistemicist Pretense**
      *   **Epistemicism Undermined:** This is devastating to the *board's claimed justification*. If there's a *real, objective boundary* at 73.5 revealed by the sacred formula, waiving it for *anyone* (especially based on connections) is admitting the boundary isn't real or objective. It proves the score isn't tracking a hidden truth but is a tool to be manipulated. It exposes the "formula is the formula" as a lie masking discretion (and corruption).
      *   **Supervaluationism Accommodates (But Condemns) the Behavior:** Supervaluationism *could* theoretically say the waiver represents a *shift* to a different admissible precisification for that specific case. However, supervaluationism doesn't endorse *arbitrary* shifts. Shifting precisifications based *solely on the applicant's connections* violates principles of fairness and non-arbitrariness central to *any* coherent administrative philosophy. It's corruption, plain and simple.
      *   **The Verdict:** The inconsistency doesn't inherently damage the *abstract* philosophical theories. It catastrophically damages the *board's specific justification* for their rubric, especially their implied epistemicism. It proves the line *isn't* objectively discovered but is a tool wielded unfairly. The primary label is **corruption**, which both theories would condemn as an abuse of the system.

  4.  **Philosophical Underdetermination: Where the Rubric Doesn't Commit**
      *   The mere *use* of a precise algorithm with a threshold is *underdetermined*. Both epistemicists and supervaluationists can *use* such a tool.
      *   **Epistemicists** see it as approximating the hidden truth.
      *   **Supervaluationists** see it as stipulating one useful precisification.
      *   The crucial difference lies in how they handle the *edges* and whether they claim the threshold reflects reality or policy.

  5.  **Rival Policies: Day-to-Day Machinery Differences**
      *   **A Policy Built on Epistemicism (Sincere Version):**
          *   **Machinery:** Double down on the algorithm. Invest heavily in "perfecting" the measurement (more precise sensors? AI analysis of significance?). The goal is to get *closer* to the hidden boundary.
          *   **Appeals:** Only allowed on grounds of *calculation error* or *flawed input data*. No appeal based on "it's close" or "context matters" – those are seen as measurement noise, not genuine indeterminacy.
          *   **Result:** Extreme rigidity. The formula *is* the oracle revealing objective truth. Human judgment is minimized as error-prone.

      *   **A Policy Built on Supervaluationism:**
          *   **Machinery:** The algorithm provides an initial, valuable precisification score.
          *   **The Crucial Addition: A Borderline Review Process:** Scores within a defined range (e.g., 73.0 to 74.0) are *recognized as borderline*. These cases trigger mandatory review by the *human board*.
          *   **Board's Role:** The board doesn't just "check the math." They deliberate on *which precisification makes most sense* for *this specific case* within the admissible range. Factors might include specific context, alternative preservation strategies, or the nature of the proposed harm/benefit not fully captured by the formula.
          *   **Appeals:** Focused on whether the board's precisification choice for a borderline case was reasonable, admissible, or procedurally fair. The *existence* of borderline cases is acknowledged and has a formal process.
          *   **Result:** More flexibility and contextual sensitivity at the margins, acknowledging vagueness. The algorithm guides but doesn't absolutely dictate. Transparency about the policy choice inherent in precisification is key.

  **In Summary:**

  *   **The Board's Practice:** Leans heavily towards **Epistemicism Lite** in its rhetoric and rigid automation, treating the score as revealing an objective boundary.
  *   **The Waivers:** Expose this as a **fraud** (or extreme corruption), utterly incompatible with sincere epistemicism. They reveal the threshold is just a tool of power, not discovered truth.
  *   **Philosophical Underdetermination:** Using a precise number *alone* doesn't commit to either view; it's the *refusal to acknowledge borderline cases* that pushes towards epistemicism.
  *   **A Supervaluationist Alternative:** Would **mandate a formal borderline review process** triggered by scores near the threshold, where human judgment selects the most appropriate precisification for the context. The algorithm informs but doesn't absolutely rule.
  *   **The Core Problem:** The board isn't primarily guilty of bad philosophy; they're guilty of **corruption**, using a faux-objective system to mask arbitrary power and favoritism. Any coherent philosophy would condemn the waivers.
