answer: |-
  The slogan "sex work is work, full stop" functions as a compressed multi-layered argument, deploying rhetorical force through apparent self-evidence while operating across logical, descriptive, and normative dimensions. Its power—and its vulnerability to critique—lies in how these layers are conflated in advocacy contexts. Let's disambiguate its possible meanings and implications.

  At its most minimal, the claim is tautologically descriptive: any activity generating income through service provision qualifies as economic work. In this reading, the phrase merely observes that sexual services are exchanged for payment within market relations. This is uncontroversial as a platitude about exchange relations and supports no particular regulatory framework beyond basic acknowledgment of economic reality. It doesn't inherently challenge the Nordic model's focus on criminalizing buyers, as even criminalized markets involve economic transactions.

  A stronger descriptive claim holds that sex work shares core *structural features* with other forms of labor: it involves time, skill, emotional management, physical exertion, and contractual negotiation. This positions sex work substantively within labor-market categorization debates. If the activity structurally resembles other service work, the argument follows that it should be subject to standard occupational health and safety (OHS) frameworks to mitigate workplace hazards—whether exposure to violence, repetitive strain injuries, or client boundary violations. This reading genuinely supports extending labor protections to brothel settings, as New Zealand has done through its decriminalization model integrating sex work into health and safety inspections. However, it doesn’t *automatically* refute the Nordic model; one could concede labor-like features while still arguing that inherent harms justify exceptional prohibitionist policies targeting demand.

  The normative leap occurs in the third reading: the assertion that sex work is *morally indistinguishable* from other forms of labor and thus warrants identical regulatory treatment. This rejects exceptionalism and frames opposition as rooted in stigma rather than material analysis. Here, "full stop" dismisses structural-objection arguments—like those underpinning the Nordic model—as paternalistic moralizing. This is the radically revisionary stance, treating distinctions based on bodily intimacy, social taboo, or trafficking risks as invalid grounds for differential regulation. It’s this version that advocates deploy to defend New Zealand’s model *specifically*, as decriminalization rejects both prohibition (Nordic) and legalization’s potential for state overreach (German), instead normalizing sex work under general labor law. The claim is that exploitation stems not from the work’s nature but from its illegality and lack of worker protections.

  Crucially, the slogan often conflates the *existence of contractual exchange* (a defensible descriptive claim) with the *absence of distinctive structural features* (a contested normative claim). While exploitation occurs in many labor sectors, the Nordic model contends that sex work’s relationship to gendered violence, trafficking pathways, and embodied commodification creates distinctive vulnerabilities that labor law alone cannot resolve—hence criminalizing buyers to reduce demand-driven harm. The slogan doesn’t directly address this; it sidesteps by asserting equivalence. When advocates invoke it against Nordic policies, they implicitly argue that trafficking is exacerbated by criminalization and better addressed through labor rights (as in New Zealand), but the slogan itself doesn’t engage this empirical dispute—it rhetorically dissolves it by refusing exceptionalism.

  Thus, the machinery works through strategic ambiguity: as tautology, it’s unassailable but inert; as labor categorization, it supports OHS integration; as normative equivalence, it rejects distinct regulatory categories. Its "full stop" authority depends on which reading listeners implicitly accept—and which critiques they thereby dismiss as illegitimate.
