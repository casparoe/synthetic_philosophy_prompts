prompt: |-
  I run a small dispute-resolution practice, mostly for academic teams -- co-authors who've fallen out, labs splitting over what their own results show, that sort of thing. I keep noticing the same pattern: two people going hammer and tongs at each other, and twenty minutes in you realise they don't actually disagree about anything factual, they're just using one key word differently. The philosopher Eli Hirsch and others have written about merely verbal disputes, and I've read enough to suspect half my caseload is this, but I've never seen anyone turn it into something a mediator can actually do in the room, in real time, with two angry people.

  So: write me that procedure. I want something I can run during a session, in my head or on a notepad, in about ten minutes, that sorts a dispute into roughly three buckets -- purely verbal (dissolves once the contested word is banned and each side restates their claim without it), genuinely substantive (survives the ban), or the awkward third case where the fight isn't about facts at all but about which meaning of the word ought to be the standard one going forward, which I gather is a real category and not the same as either of the other two. For each bucket, tell me what the procedure instructs me to do next as the mediator, because I suspect the right move differs a lot -- dissolving a verbal dispute is a different job from refereeing a fight over how a term should be defined.

  The procedure has to handle some hard cases I actually see. First, disputes where both sides accept the same definition but disagree about whether a borderline case falls under it (is that verbal, factual, or neither?). Second, disputes where the word is load-bearing in some document with consequences -- a grant condition, a job title, an authorship criterion -- so even if the conceptual disagreement is verbal, the fight isn't really about the concept at all, and telling them it's merely verbal just makes them angrier. Third, cases where one party's whole identity or prior work is invested in their usage, so the restatement step itself gets resisted. Be honest about where the procedure breaks down and where I just have to use judgement -- I'd rather you flag those points explicitly than pretend the checklist covers everything.

  Work it through on at least two realistic examples, with the actual reasoning shown: one where a heated dispute about whether an algorithm discriminated turns out to be one side meaning disparate outcomes and the other meaning intent (and what I do once that's diagnosed), and one where the procedure gives an answer I won't like -- e.g. a dispute that feels deep and important to both parties gets classified as merely verbal and the procedure tells me to dissolve it, even though the parties clearly aren't done fighting, because the real fight is over something else like resources or status.

  A few constraints on the reply itself: no headings, no bullet points, no bold, no numbered steps set off on their own lines -- just continuous prose, the way you'd write a long email to a colleague. If the procedure has ordered steps, walk me through them in prose ('first you do this... then, if that's failed, you do that...'). And keep it usable by someone smart who hasn't read the philosophy literature -- translate the theory, don't just cite it at me.
reasoning: |-
  Okay, the user runs a dispute-resolution practice focused on academic teams, like co-authors or lab members in conflict. They've noticed a pattern where arguments often boil down to people using the same key word differently, leading to what philosophers call "merely verbal disputes." They want a practical procedure to identify and resolve these during mediation sessions, sorting disputes into three buckets: purely verbal, genuinely substantive, or the tricky third case where it's about which definition should be standard. 

  The user needs something actionable they can apply in real-time with emotional parties, not just theory. They highlighted hard cases: disagreements over borderline definitions, disputes tied to consequential documents (like grants or job titles), and cases where a party's identity is tied to their usage. They also want realistic examples worked through, including one where the procedure might classify a heated dispute as verbal even if parties aren't ready to drop it. 

  First, I need to structure a step-by-step process that fits into a 10-minute window. The core idea is to isolate the contested word and test if the disagreement persists without it. Hirsch's framework is useful here, but I must adapt it for mediation dynamics. The three buckets are key: (1) purely verbal (disagreement vanishes when the word is banned), (2) substantive (disagreement remains), and (3) normative (fighting over which definition *should* win, often masking status/resource battles). 

  For hard cases: Borderline disputes (e.g., "is this algorithm discriminatory?") might straddle verbal and substantive—if both agree on definition but not application, it's factual, but if definitions differ, step one catches it. Document-tied disputes add a layer; even if verbal conceptually, the mediator must separate the term's practical stakes. Identity-driven resistance requires gentle framing to avoid triggering defensiveness. 

  Examples are crucial. For the discrimination algorithm case: If one side means disparate outcomes and the other means intent, banning "discrimination" and restating claims would reveal no factual clash—making it verbal. But if the dispute is contractual (e.g., "the grant requires non-discrimination"), it morphs into a normative fight over which definition applies. The second example needs to show the procedure's limits—like when parties keep fighting after a "verbal" diagnosis because the real issue is credit allocation. 

  I'll outline steps in prose: Start by identifying the contested word, then ban it and restate claims neutrally. If disagreement dissolves, it's verbal; if not, probe for factual disagreements. If neither fits, check if it's about definitional authority. For next steps: Verbal disputes get dissolved by showing harmony; substantive ones shift to evidence; normative ones require reframing as a negotiation. 

  Breakdown points: When emotion overrides logic (e.g., identity investment), the mediator must slow down and validate before proceeding. Also, if the word is legally load-bearing, dissolving the verbal layer alone won't suffice—parties need help decoupling conceptual clarity from practical outcomes. Honesty about these limits is vital; the procedure is a tool, not a magic wand. 

  Finally, I'll keep the tone conversational and jargon-free, like advising a colleague. No headings or bullet points—just flowing prose that mirrors their email constraint. The goal is utility: giving them a mental checklist that works amid real-world messiness.
answer: |-
  Here’s a procedure you can run in real time, designed to untangle verbal disputes from substantive ones while acknowledging the messy realities of academic conflicts. It’s structured as a series of questions you ask yourself (and subtly, the parties) during a session. I’ll walk you through the steps, the buckets, and how to handle the hard cases, then apply it to your examples.

  **The Core Procedure: The Word Ban Test**

  Start when you sense a dispute circling a key term. Let’s call the term "X" (e.g., "discrimination," "authorship," "valid result"). Your goal is to force claims into X-neutral language.

  1.  **Identify the Contested Term (X):** Listen for the word or phrase repeatedly clashed over, where each side insists their position *about X* is correct. Note it mentally.
  2.  **Get Clear Statements (Quietly):** Ask each party, one by one: "If we temporarily set aside the word 'X', what are you *most* concerned *actually happened* or *should happen*?" or "What *fact* about the situation are you trying to get the other side to accept when you say 'X is the case'?" Write down their core claims *in their own words, but without using X or obvious synonyms*. If they resist ("But it *is* about X!"), gently insist: "Humor me for a moment. Describe the *situation* you believe exists, without labeling it 'X'."
  3.  **The Ban and Compare:** Look at the de-X-ified claims. Ask yourself:
      *   **Bucket 1 (Purely Verbal):** Do the two core claims *contradict* each other? If not, or if they seem compatible/describing different things, **it's likely purely verbal.** The fight was over the label, not the underlying reality described.
      *   **Bucket 2 (Genuinely Substantive):** Do the claims clearly describe incompatible states of the world? Do they make conflicting assertions about observable events, intentions, or causal relationships that could *in principle* be investigated (even if hard)? If yes, **it's substantive.** The disagreement persists even without X.
      *   **Bucket 3 (Normative/Procedural - The "Ought" Fight):** Are the claims compatible factually, but the dispute is really about *which definition of X should govern* in this context, or *how X should be applied*? Does the disagreement persist only when you reintroduce the need to *label* the situation with X? If yes, **it's the third bucket.** The fight is about authority, precedent, fairness of definition, or future implications of labeling.

  **What to Do Next Per Bucket:**

  *   **Bucket 1 (Purely Verbal):** Your job is to **dissolve.** Say: "It sounds like you both might actually agree on what happened here [briefly summarize the compatible de-X-ified claims], but you're using the *word* 'X' differently. One of you means [A's implied definition], the other means [B's implied definition]. Since you agree on the facts underneath, perhaps we can move forward agreeing on those facts and just note you have different preferred labels?" **Caution:** Do this gently. If done poorly, it feels dismissive. Focus on the *agreement* revealed. The goal is to drain the conflict by showing the core agreement.
  *   **Bucket 2 (Substantive):** Your job is to **refocus.** Say: "Okay, so setting aside the label 'X', your core disagreement seems to be about whether [state the conflicting factual claims clearly]. That's a substantive difference we need to explore. Let's focus on that." Shift the mediation towards evidence-gathering, perspective-taking, or negotiation *on those specific factual points*.
  *   **Bucket 3 (Normative/Procedural):** Your job is to **reframe and negotiate.** Say: "It seems you agree on [the underlying facts], but disagree strongly on whether this *should be called_ 'X', or _which version_ of 'X' applies here, especially given [mention consequence, e.g., the grant condition, authorship policy]. This is a question about how we define or apply 'X' in this specific context. Let's talk about what principles *should* guide that definition/application here." Shift the mediation towards a negotiation about *language rules, criteria, or processes* for applying X, acknowledging the stakes (consequences, identity, precedent).

  **Handling Your Hard Cases:**

  1.  **Borderline Cases:** This falls into **Bucket 3.** Both agree on the definition of X, but disagree on whether a specific case meets it. The dispute isn't purely verbal (they agree on the meaning) or purely factual (the disagreement is *about* the application of the definition, not an independent fact). It's a fight about categorization rules under uncertainty. Treat it as Bucket 3: Reframe it as "Given our agreed definition of X, how do we decide if this specific case fits, especially when it's borderline? What criteria or process should we use to make *that* call?" It becomes procedural.
  2.  **Load-Bearing Words (Grants, Titles, Policies):** This is often **Bucket 3 masquerading as Bucket 1 or 2.** The conceptual disagreement might *start* as verbal or substantive, but the *heat* comes from the consequence tied to the *label*. **Don't just declare it verbal!** First, run the Word Ban Test to clarify the factual layer. If it dissolves (Bucket 1), acknowledge that: "Okay, so you agree the underlying situation is [Y]." *Then* immediately pivot: "But the problem is that the [grant/title/policy] uses the *word* 'X', and whether [Y] gets called 'X' determines [consequence]. So we need to figure out: does this definition of X *here* cover [Y]? Or how should we handle this mismatch between the agreed facts and the label required by the document?" This explicitly separates the conceptual agreement from the consequential labeling dispute, validating both concerns.
  3.  **Identity/Investment Resistance:** This makes **Bucket 3 very sticky.** When someone says "But my *whole work* defines X this way!", declaring the dispute verbal feels like an attack. **Adapt Step 2:** Instead of "ban X," try: "I hear how important the *concept* behind 'X' is to you. Help me understand what *core idea* or *principle* you're trying to protect when you use 'X' here?" or "What's the *harm* or *wrong* you see happening that makes you insist on calling it 'X'?" This digs for the underlying value or concern *behind* their attachment to the word. You might still end up in Bucket 3, but you've surfaced the deeper stake (e.g., credit, integrity of a field, preventing harm) which becomes the subject of negotiation, not just the word itself. Acknowledge the investment explicitly: "I understand this usage is tied to your important work on [topic]. Our challenge is finding a way to honor that principle while also resolving this specific conflict about [situation]."

  **Where it Breaks Down:** This procedure relies on parties being able to articulate their claims without the key word. High emotion, bad faith, or extreme conceptual confusion can block this. If parties utterly refuse to engage without X, or if the web of contested terms is too dense, you might need to slow down, validate emotions first, or focus on smaller factual building blocks before tackling the big X. Judgment is always needed to adapt. The procedure helps diagnose, but therapy, power imbalance management, or pure negotiation skills might be needed for resolution.

  **Example 1: Algorithm "Discrimination"**

  *   **The Fight:** Data Scientist A: "The algorithm is clearly discriminatory! Look at the skewed outcomes for Group Z!" Ethicist B: "Nonsense! There was no *intent* to harm, and we followed best practices. It's not discriminatory!"
  *   **Run the Procedure:**
      *   **Step 1:** X = "Discriminatory/discrimination".
      *   **Step 2:**
          *   Ask A (without "discrimination"): "What are you most concerned actually happened?" A: "The algorithm results are consistently much worse for Group Z compared to others, causing them significant harm in [context]."
          *   Ask B (without "discrimination"): "What fact are you trying to assert?" B: "The team designed the algorithm focusing on accuracy and used standard, unbiased datasets. We didn't target Group Z or intend any negative outcome for them."
      *   **Step 3 (Compare):** A's claim: Harmful disparate outcomes exist for Group Z. B's claim: No harmful intent and standard methods were used. **These claims are *compatible*.** One is about outcome, one is about intent/process. **Bucket 1 (Purely Verbal).**
  *   **What to Do (Bucket 1):** "Okay, let's pause. It sounds like you both might agree on some core points: A, you see a harmful disparity in outcomes for Group Z. B, you're saying the team didn't intend harm and followed standard development practices. The disagreement seems to be about the *label* 'discriminatory' – A, you're using it primarily about the outcome, B, you're tying it strongly to intent or process. Since you agree on the underlying facts described – the outcome disparity exists *and* the intent wasn't harmful – perhaps we can move forward agreeing on *those* facts? Then we can discuss separately what actions, if any, are needed regarding the outcome disparity for Group Z, and how to assess processes for future work, without needing to agree on the single label 'discriminatory' right now." (This dissolves the *conceptual* fight and refocuses on actions regarding the *agreed* facts).

  **Example 2: The Unresolved "Verbal" Fight (Authorship Spat)**

  *   **The Fight:** Postdoc C: "I *conceived* the core idea and did the first key experiments! I must be first author!" Senior Prof D: "First author means the person who *wrote the paper* and integrated *all* the results. You drafted sections, but I rewrote it entirely and added critical analysis. I should be first."
  *   **Run the Procedure:**
      *   **Step 1:** X = "First author" / "Deserves to be first author".
      *   **Step 2:**
          *   Ask C (without "first author"): "What are you most concerned actually happened or should happen?" C: "I had the original idea and did the foundational work that made the paper possible. My contribution is the most intellectually significant, and that should be recognized with the prime position."
          *   Ask D (without "first author"): "What fact are you trying to assert?" D: "The person who takes the lead in synthesizing the work, writing the manuscript, and ensuring its coherence and impact should have the primary credit position. I did that work."
      *   **Step 3 (Compare):** C's claim: My contribution (idea + foundational experiments) is the most intellectually significant and deserves prime recognition. D's claim: The person who did the synthesis/writing deserves primary credit. **These claims *could* be compatible (C values genesis, D values synthesis), but they are making conflicting claims about who *should* get the prime spot *based on their criteria*. More importantly, the dispute persists *only* when linked to the label "first author" and its singular positional implication. This is **Bucket 3 (Normative/Procedural)**. It's a fight about *which criterion defines "first author"* in this lab/for this paper.
  *   **What the Procedure Tells You (Bucket 3):** Reframe it as a negotiation about definition/process: "It seems we have agreement on *what* each of you contributed significantly: C, the original idea and foundational experiments; D, the synthesis, writing, and framing of the paper. The disagreement is about *which of these types of contribution* should determine the 'first author' position *for this paper* or in our lab generally. This is a question about our authorship policy or how we apply it in borderline cases. Let's discuss what principles should guide that decision: Is it the intellectual genesis? The work of synthesis? The writing effort? Can we define criteria or a process for deciding this that feels fair?" *However...*
  *   **Why You Won't Like It:** The procedure correctly diagnoses the normative definition fight (Bucket 3). But the parties might *still* be "not done fighting." Why? Because the *real fight* might be deeper:
      *   **Status/Recognition:** C feels their career depends on a first-author Nature paper; D feels their leadership role is undermined if they aren't first.
      *   **Resources:** First author influences grants, job prospects.
      *   **Relationship History:** Underlying resentment about credit on past projects.
      *   **Power Imbalance:** C fears contradicting D.
  *   **What To Do When Bucket 3 Isn't Enough:** The procedure exposed the *immediate* layer (definition of "first author"). But it won't resolve underlying conflicts over status, resources, or history. **You have to use judgment:** Acknowledge the definitional dispute needs resolution (per Bucket 3 approach), but recognize that the *intensity* signals deeper issues. Say something like: "Finding a fair way to define 'first author' here is crucial. But the strength of feeling suggests this touches on bigger questions of recognition, contribution value, and maybe past experiences. Can we also talk about what makes this particular decision about authorship feel so high-stakes for each of you?" This opens the door to addressing the underlying needs (security, respect, career progression) that the fight over the label "first author" is expressing. You transition from pure definition negotiation to interest-based mediation on the deeper needs, *informed* by the clarity that the surface fight was normative/definitional.

  This procedure gives you a structured way to cut through the noise of clashing definitions quickly. It won't solve every deep-seated conflict, but by efficiently sorting disputes into these three buckets and giving you targeted next steps for each, it lets you stop people from fighting over labels and redirect energy where it belongs – either to shared facts, negotiated definitions, or the deeper needs beneath the words. Remember to flag clearly when you move from the procedure's diagnosis into the murkier territory of underlying needs or power dynamics – that's where your core mediation skills take over.
