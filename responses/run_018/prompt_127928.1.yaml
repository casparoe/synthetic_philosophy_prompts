answer: |-
  ### Exam Question: Contractualism and the Aggregation Problem in Triage  

  **Instructions:** In *What We Owe to Each Other*, T.M. Scanlon argues that an act is wrong if it could be reasonably rejected by any individual under principles no one could reasonably reject. Central to this view is the idea that the *strength of an individual’s complaint* matters, not merely the number of people affected. Yet this raises the **aggregation problem**: When can small burdens to many outweigh a large burden to one?  

  Consider this triage scenario:  
  > **Case 1**: You can save five critically injured patients only by administering an experimental drug. However, doing so will *certainly kill one nearby bystander* due to an allergic reaction.  
  > **Case 2**: You can save the same five patients by distributing a diluted form of the same drug to 100 healthy bystanders. Each bystander faces a *0.1% risk* of permanent paralysis (with no collective benefit). The drug only works if all 100 receive it.  

  **Question:**  
  Can Scanlonian contractualism consistently permit saving the five in **Case 2** (distributed tiny risks) while forbidding it in **Case 1** (one certain death)? First, explain *why* contractualism likely forbids Case 1 (cite Scanlon’s "individual reasonable rejection" criterion). Then, examine whether Case 2 can be permitted without relying on utilitarian aggregation. Finally, evaluate: Does Scanlon’s distinction between large individual burdens and small distributed burdens hold, or does it implicitly appeal to impersonal/utilitarian reasoning? If so, does this collapse contractualism into a form of rule-utilitarianism?  

  ---

  ### Model Answer (698 words)  

  Scanlonian contractualism forbids acts that impose burdens on individuals which could be reasonably rejected under general principles. This essay argues that while contractualism can *consistently* distinguish Case 1 and Case 2, it does so only by appealing to impersonal reasons that risk collapsing into rule-utilitarianism—undermining Scanlon’s anti-aggregationist commitments.  

  **Case 1: Why Contractualism Forbids Saving the Five**  
  In Case 1, saving five lives requires *certain death* for one bystander. The bystander has a decisive complaint: they bear a maximal, involuntary burden (loss of life) that is not outweighed by others’ comparable gains. As Scanlon argues, no principle permitting such a "sacrifice" of one for the greater good could be *reasonable to reject*, since the sacrificed individual would veto any principle allowing their death for others’ benefit (*WWOTEO*, Ch. 5). Crucially, the *number* of beneficiaries (five) is irrelevant; the complaint’s strength is determined *individually*, not summed. Thus, contractualism blocks aggregation here.  

  **Case 2: Can Distributed Risks Be Permitted?**  
  Case 2 appears different: each of 100 bystanders faces only a 0.1% risk of paralysis—a tiny burden relative to the five lives saved. Scanlon might permit this because no single bystander can reasonably reject a principle allowing such minuscule risks for significant gains. Unlike Case 1, no individual faces a burden severe enough to justify vetoing the principle (*WWOTEO*, p. 229). The complaint of each is weak because:  
  - The *ex ante* risk is sufficiently low that it resembles routine social risks (e.g., driving).  
  - No one is *singled out* for paralysis; the burden is homogeneous and impersonal.  

  Thus, contractualism could endorse saving the five without aggregating complaints, as no individual’s burden crosses the threshold for reasonable rejection.  

  **The Stability of the Distinction and the Impersonal Reasons Problem**  
  The distinction rests on contractualism’s insistence that only *individual* complaints matter. However, this becomes unstable when we ask *why* a 0.1% risk is "non-rejectable." Scanlon appeals to "impersonal reasons" (e.g., the disvalue of paralysis itself) to explain why we should minimize such harms when no individual’s complaint is decisive (*WWOTEO*, p. 224). But this invites two problems:  
  1. **Impersonal Reasons as Stealth Aggregation**: If we permit Case 2 because the *total* expected harm (100 × 0.1% = 10% paralysis risk) is less than the benefit (five lives saved), we covertly sum burdens. This mirrors utilitarianism’s calculation of net welfare.  
  2. **Threshold Vagueness**: Contractualism lacks a principled way to define when a risk becomes "large enough" to warrant rejection. If a 10% risk to one person is rejectable (as Scanlon suggests), why is a 0.1% risk to 100 not aggregable into an equivalent complaint?  

  **Collapse into Rule-Utilitarianism?**  
  Scanlon’s use of impersonal reasons to handle distributed risks threatens to reduce contractualism to rule-utilitarianism. Rule-utilitarianism would endorse a *principle* allowing tiny risks for large benefits because it maximizes expected welfare. Contractualism’s appeal to impersonally justified principles (e.g., "allow trivial risks for lifesaving") functionally replicates this, as the "reasonable non-rejectability" of such a rule depends on its net benefits. As Parfit noted, Scanlon’s theory risks becoming a "mistake" if impersonal reasons dominate, since the individual veto is sidelined when burdens are diffuse.  

  Nevertheless, Scanlon could resist collapse by emphasizing contractualism’s core structure: principles are evaluated by their justifiability *to each person*, not by total consequences. In Case 2, each bystander’s complaint is weak *in isolation*—unlike Case 1, where one person’s complaint is existential. This reflects Scanlon’s "complaint model" of moral reasoning. Yet this defense fails if we recognize that the permissibility of Case 2 *hinges on the cumulative effect of many small burdens*. If we imagine a variant where 10,000 bystanders each face a 0.1% risk (expecting ten paralyses), contractualism must still permit the act—revealing that the *total harm* is doing covert work.  

  **Conclusion**  
  Contractualism can *formally* distinguish Case 1 and Case 2 by emphasizing individual complaint strength. However, its reliance on impersonal reasons to handle distributed risks implicitly reintroduces aggregation, destabilizing Scanlon’s anti-utilitarian framework. While not a full collapse into rule-utilitarianism—contractualism retains agent-relative constraints—it concedes significant ground to consequentialist reasoning.  

  ---

  ### Marking Scheme  

  **A Grade (85–100%)**:  
  1. **Identifies veto power in Case 1**: Correctly explains that the bystander’s certain death is unreasonably imposed, triggering individual rejection.  
     *→ Mistake to avoid:* Claims contractualism "counts heads" or inherently prefers saving more lives.  
  2. **Explains non-rejectability in Case 2**: Argues low individual risk falls below reasonable-rejection threshold.  
     *→ Mistake:* Assumes contractualism aggregates complaints or ignores risk severity.  
  3. **Analyzes impersonal reasons’ role**: Notes Scanlon uses them to handle small burdens but critiques how this smuggles in aggregation.  
     *→ Mistake:* Omits discussion of §5.8 (*WWOTEO*) or conflates impersonal reasons with individual complaints.  
  4. **Assesses threshold instability**: Questions how contractualism defines "significant" burdens without implicit aggregation.  
     *→ Mistake:* Assumes Scanlon provides a clear, non-arbitrary threshold.  
  5. **Evaluates rule-utilitarianism collapse**: Concludes that impersonal reasons create tension but don’t fully dissolve Scanlon’s framework.  
     *→ Mistake:* Declares contractualism "is" utilitarianism without nuance.  

  **B Grade (70–84%)**:  
  - Covers Cases 1 and 2 but with gaps (e.g., vague on veto power).  
  - Identifies aggregation problem but doesn’t dissect impersonal reasons.  
  - Mentions rule-utilitarianism parallel without probing Scanlon’s defenses.  
  - Limited textual engagement (e.g., no citation of Scanlon’s risk examples).  

  **C/D Grade (50–69%)**:  
  - Summarizes contractualism without applying it to the cases.  
  - Treats both cases identically (e.g., "both are aggregation").  
  - Misattributes utilitarian reasoning to Scanlon.  

  **F (<50%)**:  
  - Fails to engage contractualism or the cases.  
  - Answers with unrelated theory (e.g., Kant, act-utilitarianism).  

  ---  
  **Exam Logistics**:  
  - **Word limit**: 800 words (concise arguments rewarded).  
  - **Time guideline**: 90 minutes (15 min. planning, 60 min. writing, 15 min. edit).  
  - **Allowed**: *WWOTEO* citations (no external sources).  
  - **Key focus**: *Reasoning*, not just labeling. Push students to expose tensions in Scanlon.
