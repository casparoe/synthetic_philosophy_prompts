answer: |-
  Here is the final exam question package designed to test deep understanding of representational realism in interpretability research, complete with model answer and marking scheme:

  **Final Exam Question: Interpretability and Representational Realism (25 marks total)**  

  **Background:** In cognitive science, a "representation" is often understood as a state that carries information about some feature of the world and plays a *causal role* in a system's behavior. Some interpretability researchers claim their methods reveal *genuine representations* in neural networks (e.g., "this neuron represents past tense"), while skeptics argue they merely produce *useful fictions* for human understanding.  

  **Consider two hypothetical interpretability results:**  
  1. **Random-Weights Probe:** Researchers take a transformer with **completely random, untrained weights**. They train a linear probe on its activations for the task of classifying whether input sentences use past tense. The probe achieves 85% accuracy (chance: 50%).  
  2. **Sparse Autoencoder (SAE) Variability:** Researchers train a sparse autoencoder on activations from a *fully trained* language model. When they vary the SAE’s **sparsity penalty** and **dictionary size**, the resulting sets of decoded "features" (e.g., "scientific reasoning," "positive sentiment") show low overlap and different granularities (e.g., one setting yields 10 broad features; another yields 200 specific ones).  

  **Your Task:**  
  Critically evaluate whether **either result** (or both/none) provides strong evidence for *realism* about representations in neural networks. By "realism," we mean the claim that the network *itself* instantiates states with determinate representational content (e.g., "the network represents past tense"), independent of researcher tools/choices.  
  - Address whether high decodability *entails* genuine representation.  
  - Discuss whether researcher-dependent feature inventories challenge realism.  
  - Defend a clear position on at least one hypothetical using concepts from cognitive science (e.g., causal role, misrepresentation, informational content).  

  **Note:** Do not discuss specific papers. Base arguments on general principles.  

  ---

  **Model Answer (710 words):**  

  The central challenge for representational realism in interpretability is distinguishing between *information present in activations* and *representations functionally embodied* by the network. Neither hypothetical result definitively supports realism, but both reveal criteria for evaluating it.  

  **Hypothetical 1 (Random-Weights Probe): Decodability ≠ Representation**  
  High probe accuracy does *not* warrant realism here. The random network lacks training to *use* linguistic features causally. Decodability stems from structural properties of the input space and the probe’s capacity—not the network’s representational states. Analogously, a thermometer’s raw material may correlate with air pressure (decodable by an external model), but this doesn’t imply the thermometer "represents" pressure if it plays no role in its function. Three cognitive science principles undermine realism here:  
  - **Causal role failure:** For a state to represent past tense, it should *cause* differences in the network’s outputs (e.g., affecting next-token prediction). Untrained weights produce no such behavior.  
  - **Misrepresentation test:** A genuine representation must allow for error (e.g., misclassifying a present-tense sentence as past tense). The probe—not the network—holds all "semantic" responsibility; the network is inert.  
  - **Informational promiscuity:** Any system with sufficient complexity may encode information statistically (e.g., rock layers "encode" geological history). Representation requires *enduring functional* properties, not transient correlations.  

  *Conclusion:* This result reflects the probe’s ability to *impose* structure, not the network’s intrinsic representations.  

  **Hypothetical 2 (SAE Variability): Researcher-Dependence and Realism**  
  The variability of SAE features *challenges* but does not *refute* realism. It highlights that interpretability tools are *models* of the network, not transparent windows. However, realism could survive if features align with the network’s causal structure:  
  - **Hyperparameters as discovery tools:** Varying SAE settings is like adjusting a microscope’s focus. If *some* settings yield features that predict downstream behaviors (e.g., ablating a "scientific reasoning" feature disrupts accuracy on science questions), those features may be real. The key is *functional invariance*—whether features correlate with the network’s internal computations.  
  - **Causal convergence:** If distinct SAE hyperparameters converge on similar *coarse-grained* features (e.g., all find "sentiment" clusters), this suggests a robust causal hierarchy. Conversely, total divergence implies the SAE is *generating*, not revealing, features.  
  - **Misrepresentation matters:** Real representations must permit failure cases. If an SAE-identified "positive sentiment" feature activates consistently for negative sentences *and* causes erroneous outputs, this supports realism. If SAE features lack such predictive power, they are fictions.  

  *Position:* Realism is plausible *only if* SAE features map to stable causal roles in the network (e.g., via activation patching). Without this, variability indicates researcher-driven artifact.  

  **Synthesis: When Interpretability Warrants Realism**  
  Realism requires:  
  1. **Downstream causal power:** Representations must *do work* in the system (e.g., altering activations changes outputs predictably).  
  2. **Researcher invariance:** "True" features should be rediscoverable across *compatible* methods (e.g., probes, SAEs, ablation).  
  3. **Error-aptness:** Features must explain failure modes (e.g., misrepresentation).  

  Hypothetical 1 fails all criteria. Hypothetical 2 *could* satisfy them if SAE features align with network function—but the result as described does not. Interpretability tools are necessary but insufficient for realism; they require validation via behavioral experiments (e.g., activation patching).  

  ---

  **Marking Scheme (25 marks total)**  
  *Must-hit points with common fumbles:*  

  1. **Distinguishes decodability from causal role (6 marks)**  
     - *Top:* Explicitly argues decodability (Hyp. 1) ≠ representation without functional integration. Uses cognitive science concepts (e.g., "untrained network lacks causal role").  
     - *Fumble:* Assumes probe accuracy *directly* implies representation; ignores network’s passivity.  

  2. **Analyzes hyperparameter-dependence (6 marks)**  
     - *Top:* Treats SAE as an *interpretive model*; argues variability *challenges* realism unless features align with network function (e.g., via predictive power).  
     - *Fumble:* Claims variability *automatically* refutes realism ("all features are arbitrary") or ignores it ("SAE objectively reveals truth").  

  3. **Uses cognitive science criteria for representation (5 marks)**  
     - *Top:* Applies ≥2 concepts (causal role, misrepresentation, informational content) *correctly* to one/both cases.  
     - *Fumble:* Vaguely gestures at "causal role" without specifying *how* it fails/applies; ignores misrepresentation.  

  4. **Takes and defends a position (5 marks)**  
     - *Top:* Clear stance on one/both hypotheticals (e.g., "Hyp. 1 disproves realism"; "Hyp. 2 *could* support realism with further evidence"), backed by reasoning.  
     - *Fumble:* Surveys options without committing; contradicts own argument.  

  5. **Avoids reductionist/equivocation fallacies (3 marks)**  
     - *Top:* Does not dismiss debate via "just matrices" or conflate tool-outputs with network-states.  
     - *Fumble:* Claims "math settles it" (e.g., "representations don’t exist, just weights"); conflates probe/SAE outputs with network representations.  

  ---

  **Why this works for the divide:**  
  - Forces ML students to engage philosophy (e.g., causal role, misrepresentation).  
  - Forces philosophers to grapple with empirical constraints (e.g., hyperparameters as discovery tools).  
  - Tests if students see interpretability as *model-building* (researcher-relative) vs. *revelation* (realism).  
  - The hypotheticals are accessible without niche paper knowledge but reward deep conceptual synthesis.
