answer: |-
  Based on your detailed description and examples, I recognize this pattern clearly. It is a significant and recurring trope in environmental history, history of disease, and climate historiography, but lacks a single, universally accepted term. Here's my analysis:

  1.  **Conceptual Landscape & Established Adjacent Concepts:**
      *   **Environmental Determinism:** Rightly rejected; your pattern emphasizes contingency and human response.
      *   **Structural Opportunity/Constraint:** Part of it, but too passive; your pattern grants the non-human force an active *initiating/testing* role.
      *   **Functional Explanation (Biology):** Similar logic (X exists because it serves function Y), but applied causally (X *causes* Y to serve function Z) and across ontological domains (environment acting on society). Gould-Lewontin caution about misattributing design is highly relevant.
      *   **Latourian Actor-Network Theory (ANT):** Grants agency to non-humans ("actants"), but ANT is often flatter and more symmetrical. Your pattern often retains a hierarchy where the non-human *tests* the human/institutional, implying the latter *should* be adaptable.
      *   **Vulnerability Analysis (Disaster Studies):** Focuses on pre-existing conditions. Your pattern incorporates this but frames the disaster *as an agent* actively revealing that vulnerability.
      *   **Stress Testing/Resilience Frameworks:** Very close metaphorically ("stress-testing healthcare"), but these are often borrowed engineering/systems concepts, not core historiographical terms for causal narrative *mode*.
      *   **Dialectical Materialism (Nature-Society Interaction):** Particularly in the tradition of Horkheimer/Adorno or Jason Moore, where nature is an active moment. Moore's "world-ecology" frames nature as internal to capitalism's development. This shares the active non-human, but Moore's focus is on capitalism's production of nature, while your examples highlight a punctual *revelatory* event.
      *   **Historical Contingency/Crisis Theory:** Encompasses the "turning point" aspect, but doesn't specify the *role* of the non-human as diagnostic agent.

  2.  **Assessment: An Established Pattern Needing Precise Naming**
      This is a distinct and recognizable **rhetorical-analytical narrative strategy** prevalent in the fields you cite. While components exist in adjacent concepts, the *specific combination* – granting non-human forces **non-intentional, functional, diagnostic agency** within causal narratives that evaluate human responses to these "signals" – lacks a universally accepted, precise term in philosophy of history or historiography.

  3.  **Proposed Term & Definition:**
      *   **Term: Diagnostic Agency (of Non-Human Forces)**
      *   **Definition:** A narrative mode in historiography where environmental, climatic, or biological forces are attributed a functional role in *revealing, testing, accelerating, or selecting* latent vulnerabilities, contradictions, or adaptive capacities within human societies or institutions. This agency is non-intentional but operates *as if* purposive (e.g., exposing fragility, forcing innovation). The narrative evaluates human actors based on their ability to correctly interpret the "signal" presented by the non-human force and respond with appropriate institutional or social flexibility. The outcome is contingent upon this human response.

  4.  **Boundary Conditions & Differentiation:**
      *   **(a) Ordinary Multicausal Explanation:** Here, the non-human force is one factor among many (e.g., "bad harvests *contributed to* unrest"). Diagnostic Agency makes the non-human the active *instigator of revelation/testing*, transforming it into a functional probe rather than just a contributing cause. The narrative *hinges* on the diagnostic moment.
      *   **(b) Full Historical Agency of Nature:** This implies intentionality or consciousness (e.g., "Gaia punished humanity"). Diagnostic Agency explicitly *denies* intentionality but retains a strong *functional* purposiveness within the narrative logic ("the plague dissolved feudalism," implying that dissolution was the *functional outcome* of its action, even if unintended).
      *   **(c) Gould-Lewontin Spandrels Critique:** This cautions against assuming every feature is an adaptation. Diagnostic Agency risks a similar pitfall: it can imply that the *primary function* of the event (e.g., Tambora's eruption) was to test societies, rather than being a geophysical event whose social consequences *included* revealing vulnerabilities. The key difference is that spandrels critique biological *adaptation claims*, while Diagnostic Agency is a *historical narrative device*. However, historians using it *must* be wary of projecting this functional interpretation backwards as the event's inherent purpose.

  5.  **Normative Commitments:**
      Diagnostic Agency often carries **strong implicit normative commitments**:
      *   **Adaptability as Virtue:** Success is measured by institutional/societal flexibility and capacity to "read" the environment correctly. Failure implies rigidity or blindness.
      *   **Legibility of Nature:** Assumes the "signal" sent by the non-human force (famine, disease spread, temperature shift) is inherently meaningful and interpretable by humans, downplaying cultural or contested interpretations of the event.
      *   **Progress/Resilience Narrative:** Can imply that crises, by exposing weaknesses, are ultimately beneficial for systemic improvement ("creative destruction"), potentially downplaying pure suffering or irreversible collapse.
      *   **Potential for Blame:** Shifts some responsibility for disaster outcomes onto human institutions for failing the "test," potentially obscuring the sheer scale or unpredictability of the non-human force itself.

  6.  **What Would Change My Mind?**
      My assessment hinges on the *functional/diagnostic role* being central to the causal narrative *as presented by the historian*. I would reconsider if:
      *   **Explicit Rejection of Agency:** A historian using phrases like "exposed fragility" explicitly stated this is *only* a metaphor for complex causation, denying any attribution of functional agency (even rhetorical) to the non-human force.
      *   **Demonstration of Purely Constructed Revelation:** Evidence showed the "revealed fragility" was *entirely* a post-hoc human interpretation/imposition with no basis in the event's actual interaction with pre-existing structures (e.g., showing the Bourbon regime wasn't actually fragile *until* the specific way Tambora's effects interacted with contingent political choices).
      *   **Correlation Trumps Causation:** A rigorous argument demonstrating that the narrative *mistakes* correlation (e.g., plague arrival *coinciding* with feudal changes already underway) for causation, and that the language of "dissolving obligations" is unwarranted rhetorical flourish masking this error.
      *   **Inevitability Argument:** If examples showed the outcome described (e.g., authoritarian consolidation) was presented as the *inevitable* result of the environmental shock regardless of human action, moving it firmly into determinism.

  7.  **Vulnerabilities in My Reasoning:**
      *   **Stretching "Agency":** Philosophers (e.g., Dennett's "intentional stance," Latour) debate agency definitions. A critic could argue I'm stretching "agency" beyond usefulness by including non-intentional, functional roles. My defense: within the *narrative logic* of these histories, the non-human force *acts as* an agent performing a diagnostic function.
      *   **Metaphor vs. Ontology:** The line between vivid metaphor and implicit ontological claim is blurry. Is "the plague dissolved feudalism" just a shorthand, or does it reveal a deeper analytical commitment? I lean towards the latter based on its pervasive and structurally similar use across diverse contexts.
      *   **Overlooking Alternative Framings:** Perhaps this is simply "vulnerability analysis" dressed in narrative clothing. My counter: Vulnerability is the *condition exposed*; Diagnostic Agency describes the *narrative role* assigned to the *force* that does the exposing/testing.
      *   **Historiographical Specificity:** A historian of science might argue this is simply applied systems theory/resilience thinking and not unique to history. My point is its specific deployment *within historical causal narratives* warrants a distinct label.

  **Conclusion:** The pattern you identify is a coherent and significant **narrative strategy** best termed **Diagnostic Agency**. It is functionally established in practice but lacks a precise, universally recognized name in historiography or philosophy of history. Coining "Diagnostic Agency" effectively captures its core elements: attributing a non-intentional, functional, revelatory, or selective role to non-human forces within causal historical narratives that evaluate human responses. Crucially, this strategy carries implicit normative commitments about adaptability and the legibility of environmental signals that should be made explicit in your analysis. Its boundaries with determinism, multicausality, and spandrels-style critiques need careful management.
