  You're acting as a philosopher of mind with real background in representational realism and interpretability — not just someone who skimmed the abstracts. Think carefully, and before you lock in an answer do a quick brainstorm: what are the three or four conceptual pressure points that decide whether symbols embedded in a substrate actually do causal work?

