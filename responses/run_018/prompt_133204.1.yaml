prompt: |-
  hey, i'm on the product ethics panel at my job — backend dev, zero formal philoshophy training, just picked up some metaethics from podcasts. we have to vote next thursday: should our internal promotion audit keep using one universal fairness metric (same statistical weighting for peer sentiment and commit frequency across every team) or switch to a case-by-case review where managers write a narrative justification for every exception? side A says if you let context shift the weight of reasons you're just dressing up bias in fancy language. side B says applying the same formula to a legacy maintainer and an AI researcher is morally blind — they talk about holism of reasons, how a factor's importance depends on teh whole situation. i need a memo i can send around before teh meeting: reccomend one path with a concrete rollout timeline, and take teh strongest argument from teh losing side seriously instead of hand-waving it. please no bibliography or list of readings, i just need something actionable for the committee.
reasoning: |-
  Okay, the user is on a product ethics panel at work and needs help drafting a memo for an upcoming vote. They're a backend developer without formal philosophy training, just some knowledge from podcasts. The committee has to decide between two approaches for their internal promotion audit: either stick with a universal fairness metric or switch to a case-by-case review where managers provide narrative justifications for exceptions.

  The user needs a memo that recommends one path with a concrete rollout timeline. They specifically want me to take the strongest argument from the opposing side seriously instead of dismissing it. They've also requested no bibliographies or reading lists—just something actionable for the committee.

  Looking at the two sides: Side A argues that using one universal metric prevents bias from creeping in, as letting context shift weights could just disguise bias in fancy language. Side B counters that applying the same formula across different roles like legacy maintainers and AI researchers is "morally blind," emphasizing that importance of factors depends on the whole situation—they're talking about holism of reasons.

  I should decide which approach to recommend. The universal metric promotes consistency and reduces bias, which aligns with fairness principles like equality of treatment. However, it might not account for legitimate role differences. Case-by-case reviews offer flexibility but risk inconsistency and hidden biases in narratives.

  Given the risks of bias in subjective narratives and the need for auditability, recommending the universal metric seems stronger. But I must address Side B's holism argument seriously—perhaps by acknowledging that some roles are fundamentally different and suggesting role-based calibration of the metric rather than full exceptions.

  For the memo structure, I'll include: a clear recommendation, strongest opposing argument addressed, phased rollout timeline, and next steps. The rollout should be practical: start with a pilot, gather feedback, and refine before full implementation. This makes it actionable without overwhelming the committee.

  The user's deeper needs include wanting to appear balanced and thoughtful to the committee, avoiding philosophy jargon, and providing a practical solution that can be implemented quickly. They might also be concerned about maintaining team morale and trust in the promotion process.

  I'll emphasize that the recommendation comes from balancing ethical principles with operational realities. Highlighting a pilot phase shows due diligence, and addressing the holism argument demonstrates respect for valid concerns. This approach should help the user lead a productive discussion and gain committee buy-in.
answer: |-
  ## Ethics Panel Memo: Promotion Audit Framework Decision

  **To:** Product Ethics Panel  
  **From:** [Your Name], Backend Dev & Panel Member  
  **Date:** [Current Date]  
  **Subject:** Recommendation on Promotion Audit Framework: Structured Universality with Pilot Calibration  

  **Recommendation:** **Retain the core universal fairness metric framework** for the promotion audit, **but immediately initiate a pilot program** to formally calibrate weightings for significantly distinct role archetypes (e.g., Legacy Maintainer vs. AI Researcher). **Reject the shift to unstructured, manager-driven case-by-case narrative exceptions.**

  **Why Universal Metrics (With Calibration) Are Ethically Stronger & More Operable:**

  1.  **Bias Mitigation & Procedural Justice:** A universal baseline is the strongest defense against unconscious bias, favoritism, and inconsistent application ("like cases treated alike"). Side A's core concern – that shifting weights contextually risks masking bias – is empirically valid. Narrative exceptions create ambiguity and subjectivity, making systemic bias harder to detect and audit. A defined metric ensures everyone faces the *same starting rules*.
  2.  **Transparency & Accountability:** A formulaic approach is inherently auditable. We can statistically analyze outcomes across demographics and roles to identify *systemic* unfairness. Manager narratives are opaque, difficult to compare, and prone to justification after the fact.
  3.  **Scalability & Efficiency:** As we grow, auditing dozens/hundreds of unique manager narratives for fairness and consistency is operationally unsustainable and prone to error. A calibrated metric provides consistent, efficient evaluation.
  4.  **Fairness Requires Structure:** True fairness isn't ignoring context, but *structuring how context is incorporated fairly*. Blindly applying one formula everywhere is flawed, but unstructured exceptions are worse. Calibration provides structure.

  **Taking Side B's "Holism of Reasons" Argument Seriously (The Strongest Counter):**

  Side B correctly identifies a critical flaw in *rigidly* applying the *exact same* weighting to vastly different roles. Evaluating an AI Researcher's impact purely on commit frequency versus a Legacy Maintainer's is indeed "morally blind" and fails the holism test – the *meaning* and *significance* of a commit (or peer sentiment) genuinely differ based on the role's nature and expectations. **This is not mere bias; it's a failure of the metric to capture relevant moral dimensions of contribution in different contexts.**

  **Our Solution: Calibration, Not Exceptions**

  We address this valid holism concern *without* abandoning objective fairness:

  1.  **Role Archetype Definition:** Immediately identify 3-5 distinct, high-impact role archetypes where the *nature* of contribution differs fundamentally (e.g., "Core Systems Maintainer," "Emerging Tech Researcher," "High-Velocity Feature Developer," "Cross-Functional Platform Builder").
  2.  **Pilot Calibration Committee:** Form a small, diverse sub-committee (incl. ethicists, senior engineers from relevant domains, HR analytics) for a 6-week pilot.
  3.  **Evidence-Based Weighting Adjustment:**
      *   Analyze historical promotion data & performance reviews for these archetypes.
      *   Interview senior technical leaders in each domain to define what "impact" and "excellence" *objectively look like* in that context.
      *   **Determine if the *relative importance* of core factors (Commit Frequency, Peer Sentiment, etc.) should be *statistically adjusted* for each archetype.** (e.g., Maybe Peer Sentiment carries *slightly* more weight in collaborative research, while Code Stability metrics carry more weight in critical legacy systems).
      *   Crucially: Adjustments are based on *role characteristics*, not individual manager discretion or specific "cases." The formula remains a defined algorithm.
  4.  **Clear Documentation:** Publish the rationale, data sources, and adjusted weighting logic for each calibrated archetype transparently.

  **Concrete Rollout Timeline:**

  *   **Week 1 (This Week):** Ethics Panel approves recommendation & pilot scope. Identify initial 3 role archetypes for calibration.
  *   **Week 2:** Form Pilot Calibration Sub-Committee. Gather initial historical data sets.
  *   **Weeks 3-6:** Sub-Committee conducts analysis, interviews, proposes calibrated weightings for selected archetypes.
  *   **Week 7:** Sub-Committee presents proposals & rationale to full Ethics Panel. Panel votes on adopting calibrated metrics for pilot archetypes.
  *   **Week 8:** Implement approved calibrated metrics *alongside* the original universal metric for the selected archetypes in the *next* audit cycle. Communicate changes clearly.
  *   **Next 6 Months:** Monitor outcomes for pilot archetypes using both original and calibrated metrics. Audit for fairness, consistency, and unintended consequences.
  *   **Month 7:** Full Ethics Panel Review: Evaluate pilot data. Decide:
      *   Adopt calibrated metrics permanently for defined archetypes.
      *   Expand calibration to more archetypes.
      *   Revert to pure universal metric (if calibration shows no benefit or negative effects).
      *   Refine calibration process.

  **Why Not Case-by-Case Narratives?**

  While holism is important, unstructured manager narratives introduce too much risk:

  *   **Inconsistency:** Different managers will interpret "context" wildly differently.
  *   **Implicit Bias:** Narratives are fertile ground for unconscious bias to influence justification.
  *   **Audit Nightmare:** Systematically ensuring fairness across hundreds of unique stories is practically impossible.
  *   **Burden & Gaming:** Places excessive burden on managers and incentivizes persuasive writing over objective evidence.
  *   **Undermines Trust:** Perceptions of subjectivity and favoritism will increase.

  **Next Steps for the Vote:**

  I recommend we vote to **A) Maintain the universal metric framework as the baseline, and B) Approve the 8-week Pilot Calibration Program** outlined above. This path upholds core fairness principles (consistency, transparency, bias mitigation) while directly and rigorously addressing the legitimate concern about role context (holism) through structured, evidence-based calibration. It provides a clear, actionable, and auditable path forward.

  Let's build fairness with both structure and sense.
