  Hmm, this is quite a sophisticated request. The user clearly has deep familiarity with the subject—they're able to pinpoint specific variants of Bertrand's paradox (chord selection methods, sector division, point selection) and want the conceptual tensions laid bare. The mention of "epistemic vs ontic 'uniform'" suggests they're preparing students for meta-discussions about probability interpretations. 

  Right, let's structure this carefully. First, the paradoxes must be addressed: 
  - Chord by endpoint (rotational symmetry) vs midpoint (translational) vs radial (scale symmetry)—each privileging different symmetries. 
  - Sector division's angle/length ambiguity. 
  - Area vs diameter selection showing parameterization dependence. 

  Then conceptual guardrails: 
  - Must distinguish physical procedure symmetry from sample space symmetry (e.g., rotating a disc vs rotating coordinates). 
  - Clarify whether "uniform" means ignorance (epistemic) or physical equidistribution (ontic). 

  Formal non-negotiables: 
  - Normalizability (no improper priors). 
  - Consistency under re-parameterization (density invariance). 
  - Compatibility with statistical mechanics (e.g., phase space uniformity). 

  Ah, and the kicker: some requirements might conflict. Haar measure handles rotational symmetry but fails translationally—hence the incompatibility note. 

  For resolutions: 
  - Jaynes prioritizes problem-specific invariances (e.g., rotational for chords), but selection is debatable. 
  - Well-posing demands physical mechanisms, dodging symmetry ambiguities. 
  - Symmetry-breaking picks one parameterization (e.g., radial distance) a priori. 

  The user likely wants this map to help students evaluate resolutions systematically. Better keep comparisons concise since they specified "no full scorecard." 

  ...Better emphasize British English spellings throughout. "Normalisability" with 's', "prioritises" etc. Done.
answer: |-
  An adequate theory of the principle of indifference (PoI) for continuous parameters must satisfy these desiderata, motivated by Bertrand's paradox and its implications:

  1.  **Resolve Specific Paradoxical Configurations:**
      *   **Chord Selection:** Dissolve ambiguity in defining a "random chord" via different methods (endpoint-angle, midpoint-position, radial distance), each exploiting distinct symmetries (rotational, translational, scale) and yielding different probabilities.
      *   **Sector Division:** Resolve ambiguity in defining a "random radius" for sector division (uniform angle vs. uniform arc length).
      *   **Point Selection:** Resolve ambiguity in selecting a "random point" within an area (uniform Cartesian coordinates vs. uniform polar radial distance).
      *   *Motivation:* Demonstrates the PoI's vulnerability to ambiguous parameterisation, leading to contradictory probability assignments for the same event.

  2.  **Preserve Conceptual Distinctions:**
      *   **State Space Symmetry vs. Physical Procedure Symmetry:** Distinguish symmetries inherent to the abstract sample space (e.g., rotational invariance of the disc) from symmetries of a concrete physical generating mechanism (e.g., tossing a stick).
      *   **Epistemic vs. Ontic 'Uniform':** Clarify whether uniformity represents ignorance (epistemic, no prior information) or a physical property of equidistribution (ontic, like a perfectly balanced die).
      *   *Motivation:* Confusing these leads to misapplying invariance requirements or misinterpreting the meaning of the resulting probabilities.

  3.  **Respect Formal Constraints:**
      *   **Normalisability:** Ensure the uniform distribution is proper (integrates to 1).
      *   **Consistency under Admissible Re-parameterisation:** Assign the same probability to equivalent events, regardless of the chosen continuous parameterisation (e.g., angle and arc length are related; probabilities should transform correctly). *Note:* Admissible excludes pathological transformations.
      *   **Empirical Compatibility (Weak):** Avoid blatant contradiction with well-established results relying on uniform priors (e.g., phase space uniformity in statistical mechanics).
      *   *Motivation:* Ensures mathematical coherence, avoids impropriety, and maintains minimal empirical adequacy.

  4.  **Acknowledge Potential Incompatibility:** Recognise that satisfying all desiderata simultaneously (especially state-space symmetry invariance and full re-parameterisation invariance) may be impossible, as shown by the Haar measure's dependence on group structure (e.g., rotational vs. translational invariance conflict in chord selection). *Motivation:* Highlights inherent limitations and the need for careful justification.

  **Brief Assessment of Resolutions:**

  *   **Jaynesian MaxEnt:** Prioritises problem-specific invariances (e.g., rotational/translational for chords via midpoint). Satisfies 1 (for chosen case), 2 (often epistemic), 3a, 3c. Criticised for potentially arbitrary symmetry choice (violates 3b generally, fails other chord methods) and conflating epistemic/ontic.
  *   **Well-Posing (Physical Procedure):** Specifies a unique physical randomisation method (e.g., spinning a needle). Satisfies 1 (unambiguously), 2 (ontic), 3a, 3b (by construction). Avoids abstract symmetry issues but requires auxiliary mechanisms, potentially violating 2 (epistemic PoI ideal).
  *   **Symmetry-Breaking Parameterisation:** Arbitrarily selects one "natural" parameterisation (e.g., midpoint). Satisfies 1 (for that choice), 3a, 3b (trivially). Fails to resolve the core ambiguity (other choices remain valid for PoI), violates the spirit of symmetry requirements (2), and lacks justification beyond convention.
