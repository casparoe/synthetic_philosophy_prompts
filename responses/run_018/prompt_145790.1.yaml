prompt: |-
  I'm convening a graduate seminar on the philosophy of probability, and before we examine particular resolutions of Bertrand's paradox I want the specification written down. What must an adequate theory of the principle of indifference in continuous parameter spaces actually deliver? Set out the desiderata: the specific paradoxical configurations it must dissolve (chord selection by endpoint, midpoint, and radial distance; sector division; point selection within an area), with the ambiguity that generates each; the conceptual distinctions it must preserve, particularly between symmetry of the state space and symmetry of the generating physical procedure, and between epistemic and ontic readings of 'uniform'; the formal constraints it must respect, including normalisability, consistency under admissible re-parameterisation, and empirical compatibility with statistical mechanics; and whether any subset of these requirements is jointly unsatisfiable in light of known invariance results. For each desideratum, state the motivating consideration. Then, briefly and without a full scorecard, indicate how the Jaynesian maximum-entropy strategy, the well-posing resolution, and a symmetry-breaking parameterisation approach fare against the list. Keep the response to no more than 500 words, and write in British English.
