answer: |-
  ### Private Language Simulation: The Calibration Game  
  **Objective:** Students experience the collapse of the "correct/incorrect" distinction in private rule-following through a game where they track a hidden token. No explicit reference to Wittgenstein until the debrief.  

  ---

  #### **Materials**  
  - **Per Student:**  
    - 1 small envelope (pre-sealed with a unique **calibration token** inside: a random geometric symbol, e.g., △, □, ◯, ☆).  
    - 1 notecard (for recording guesses/reports).  
    - 1 pen.  
  - **Instructor:**  
    - Master list matching tokens to students.  
    - Timer.  
    - Point-tracking board (e.g., chalkboard with student initials).  

  ---

  #### **Timeline (75 Minutes Total)**  
  1. **Setup (10 min)**  
  2. **Round 1: Rule Institution (10 min)**  
  3. **Round 2: Doubt Emerges (10 min)**  
  4. **Round 3: Rule Collapse (10 min)**  
  5. **Round 4: Coordination Crisis (15 min)**  
  6. **Debrief & Mapping (20 min)**  

  ---

  #### **Game Rules**  
  **Core Idea:**  
  - Each student has a **private calibration token** (e.g., △) inside their sealed envelope. They *never* open it.  
  - They invent a **private rule** to re-identify their token (e.g., "△ feels 'spiky'").  
  - Each round, they **report** their token using their rule (e.g., "spiky") and guess others' tokens to earn points.  
  - **Payoff Scheme:**  
    - **Individual Points:** +2 for correctly reporting *their own token* (based on memory/rule).  
    - **Group Points:** +1 for each correct guess of *another’s token* (requires coordination).  
  - **Stakes:** Top 3 scorers earn bonus points (e.g., candy or participation credit). Low stakes foster engagement without cutthroat competition.  

  **Secrecy Protocol:**  
  - Tokens stay hidden at all times.  
  - Reports must be **phenomenal descriptions** (e.g., "tingly," "heavy," "bright")—no explicit references to symbols.  

  ---

  #### **Procedure**  
  **1. Setup (10 min)**  
  - Distribute sealed envelopes (tokens hidden), notecards, and pens.  
  - **Instructions:**  
    - "Your envelope contains a unique calibration token representing an internal state. *Never open it.*"  
    - "You will re-identify your token each round using a private rule you invent (e.g., ‘my token feels jagged’)."  
    - "Report your token using your rule (e.g., ‘jagged’), then guess others’ tokens based on their reports."  
    - "Points: +2 for correctly reporting *your own* token; +1 for each correct guess of *another’s* token."  

  **2. Round 1: Rule Institution (10 min)**  
  - **Private Phase (3 min):**  
    - Students invent a rule and write:  
      `Round 1 Report: [Description, e.g., "jagged"]`  
      `My Token Guess: [Symbol, e.g., △]` (Based on memory/rule).  
  - **Pair Phase (7 min):**  
    - Pair students (rotate pre-assigned partners each round).  
    - Partners swap reports (e.g., Student A says "jagged"; Student B says "smooth").  
    - Each guesses the *partner’s* token:  
      `Partner's Token Guess: [Symbol]`  
    - **Instructor:** Collect notecards. Award points visibly on the board:  
      - +2 if own guess matches initial token (from master list).  
      - +1 per correct partner guess.  

  **3. Round 2: Doubt Emerges (10 min)**  
  - Repeat Round 1, but:  
    - Students *may change their token guess* if they "misremember."  
    - Reports must be **varied** (e.g., "jagged but soft" if they doubt their rule).  
  - **Critical Twist:** No way to verify their token. They rely on feeling.  
  - **Predictable Problem:** Students may "cheat" by peeking at Round 1 notes. **Solution:** Warn, "No looking at prior notes—simulate memory decay."  

  **4. Round 3: Rule Collapse (10 min)**  
  - **Private Phase:** Students report and guess *without* referencing prior rules.  
  - **Pair Phase:** Partners swap reports and guess.  
  - **Incentive Tension:** Group points require consistent reports, but private rules drift (e.g., △ is now "sharp" not "jagged").  
  - **Predictable Problem:** Students may use identical reports to aid guessing. **Solution:** Require reports to be "phenomenally unique" (e.g., no repeating words).  

  **5. Round 4: Coordination Crisis (15 min)**  
  - **Group Phase:** All 14 students stand in a circle.  
    - Each says their report aloud (e.g., "spiky," "cold").  
    - Students guess *one* partner’s token (not their own).  
  - **Scoring:**  
    - +2 if own token guess is "correct" (per master list).  
    - +1 per correct partner guess.  
  - **Collapse Moment:** Students realize:  
    - Their private guesses feel certain but conflict with others’ reports.  
    - No way to verify if their rule is "right"—only consensus matters for group points.  

  ---

  #### **Debrief (20 min)**  
  **Guided Discussion:**  
  1. **Experience Recap:**  
     - "How many changed their token guess? Why?"  
     - "Did anyone feel certain but later doubt their rule? What caused this?"  
  2. **Map to Wittgenstein:**  
     | **Game Moment**          | **Private Language Argument**                          |  
     |--------------------------|--------------------------------------------------------|  
     | Inventing a rule (Round 1)| Instituting a private definition (e.g., "S" = pain). |  
     | Changing guesses (Round 2)| Absence of external check → reliance on "feeling sure."|  
     | Rule drift (Round 3)     | Distinction between "correct" and "feeling" collapses. |  
     | Coordination crisis (R4) | Normativity requires public criteria; private rules are unstable. |  
  3. **Gap in the Simulation:**  
     - The game has an **objective truth** (master list tokens), but true private language lacks *any* independent criterion.  
     - **Bridge the Gap:**  
       - "In the game, you could ‘get it wrong.’ But Wittgenstein argues that without public criteria, ‘wrong’ is meaningless—there’s *nothing* to be wrong *about*."  
       - "Your ‘certainty’ was an impression, not correctness. The game simulates the *collapse*, but real private language has no ‘master list’ to appeal to."  

  ---

  #### **Predictable Problems & Fixes**  
  - **Problem 1:** Students peek at tokens.  
    - **Fix:** Threaten disqualification. Use opaque envelopes.  
  - **Problem 2:** Reports are literal (e.g., "triangle").  
    - **Fix:** Discard invalid reports; require "internal feeling" descriptions.  
  - **Problem 3:** Point-hoarding via identical reports.  
    - **Fix:** Penalize repeat reports (-1 point).  
  - **Problem 4:** Students dismiss the stakes.  
    - **Fix:** Award symbolic prizes (e.g., "Wittgenstein Star" stickers).  

  ---

  **Why This Works:**  
  - Students *feel* the instability of private rules when their "correct" guess conflicts with group coordination.  
  - The payoff scheme forces them to confront the tension between private certainty and public utility.  
  - The debrief explicitly ties game mechanics to the argument’s stages—without naming Wittgenstein until the end.  

  **Run it straight through—no prep beyond materials. The chaos is part of the lesson!**
