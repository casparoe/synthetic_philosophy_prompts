  - **Philosophical Problem**: Legal theories treat corporations as persons with their own intentional states. If in every model of T, the allegedly inaccessible corporate contents are always capturable by individuals (due to Skolem), then corporate intentionality might just be reducible to individual intentionality. This threatens non-reductive theories of collective intentionality.

  Why should philosophers care? Because it uses model theory to challenge the metaphysical independence of group minds. If the corporation's "uncountable" inaccessible content collapses to countable in a model where individuals handle it, it suggests that corporate personhood is just a legal fiction without extra-mental reality.

