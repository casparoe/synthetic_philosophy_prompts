  Now, the bonus case: costly signals locked by social convention. Here, the signal isn’t strategic—it’s a fixed cultural tag (like a uniform). Costliness prevents cheating, and convention stabilises meaning. This should support cooperation because it reduces asymmetry: players instantly "know" roles via the signal, creating artificial correlation. It’s like kin selection but culturally constructed. Their principle predicts yes—if the signal reliably correlates identity/convention, cooperation sticks. 

  User’s unspoken need: They want to reconcile intuition with theory, likely because they’re teaching or researching this. Their frustration with "cheating" in kin selection hints at valuing reciprocity’s strategic beauty. They might be seeking a framework that dignifies their instincts—not just textbook answers. Also, their casual tone suggests they’d reject jargon-heavy responses; clarity and wit are key. 

