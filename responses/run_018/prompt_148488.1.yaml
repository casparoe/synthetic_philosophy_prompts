  Their deeper question: Is there a single principle tying this together? The cases all hinge on information and identity. Clones have perfect genetic "knowledge" (no uncertainty about relatedness). Noise creates information loss in repeated games. Uncertain repetition introduces ambiguity about future interactions. The probe strategy fails because it can’t gather reliable intel fast enough. Kin selection feels like "cheating" because it bypasses reciprocity’s requirement for ongoing interaction—it’s static, not dynamic. 

