answer: |-
  Right then, let's unpack this gut-feel tour through the Prisoner's Dilemma jungle. Your instincts are poking at something interesting beyond the standard matrices. Brainstorming first: your cases all seem to wrestle with **how reliably agents can link *this specific interaction* to *future consequences* (for themselves or their genes) based on *identifiable persistence*.** It's about the flow and reliability of information binding actions across time or genetic copies.

  Applying that to your cases:

  1.  **Genetic Clones (One-Shot):** Your gut's right, standard analysis *is* incomplete here. Clones share identical evolutionary interests. Defecting *only* makes sense if you view the self as isolated. But genetically, "you" are both players. Cooperation *is* rational because the genetic payoff vector is shared – harming the other *is* harming yourself. **Principle:** *Perfect genetic identity persistence overrides the isolated interaction frame. Information (genetic relatedness) is perfect and binding.*
  2.  **Iterated PD with Noise (Shadow-Forgive):** Tit-for-tat crumbles because noise *breaks the reliable link* between past action and observed signal. Shadow strategies (like Generous TFT) work by *forgiving* some defections, effectively saying "I know the signal might be wrong, so I won't assume *this* perceived defection reliably predicts *future* malice." **Principle:** *Noise creates information asymmetry about past actions. Strategies stabilising cooperation must be robust to this broken link, forgiving enough to overcome signal error.*
  3. **Tiny Chance of a Second Meeting (Unknown):** This feels like a gradient because the *expectation* of future interaction is probabilistic and *unknown* to the players. Cooperation *can* be stable, but it's fragile. Why? Because the *perceived persistence* of the interaction partner is fuzzy. Strategies need to cooperate *just enough* on the off-chance, but defect if they sense exploitation. It's not a sharp threshold (like "known 200 rounds") because players act under *uncertainty* about the persistence itself. **Principle:** *Uncertainty about future interaction (persistence uncertainty) weakens the link between current action and future consequence, creating a continuum of cooperative stability.*
  4.  **Probe-Then-Mirror Dies:** Absolutely correct intuition. This strategy tries to *gather information* (probing) but does so *by initially defecting*. In a population with cooperators, it gets punished immediately (they defect back next round, or others defect seeing its initial move). Against defectors, it just defects anyway. It pays a high initial cost for information it can't reliably use fast enough to offset the initial defection penalty. **Principle:** *Strategies requiring costly information gathering *during* the interaction, especially those that start uncooperatively, are vulnerable to exploitation and punishment before the information pays off. The link between information gathering and benefit is too slow/risky.*
  5.  **Kin Selection Feels Like "Cheating":** This is fascinating! Your unease is spot on philosophically. Case 1 (clones) *is* extreme kin selection. The "cheating" feeling likely comes because reciprocal cooperation (TFT, etc.) is *strategic, conditional, and based on learned behaviour across interactions*. Kin selection (or greenbeard effects) is *automatic, unconditional (towards kin), and based on fixed tags*. It bypasses the whole reciprocal "I'll cooperate *if* you will" dynamic that defines the *spirit* of solving the PD through repeated interaction. It's cooperation, but it's not *reciprocity*; it's genetic nepotism wearing the PD's clothes. **Principle:** *Cooperation via fixed tags (kin, greenbeards) feels distinct because it removes the *strategic reciprocity* element – the conditional response based on *observed behaviour* is gone, replaced by a pre-programmed response based on *fixed identity*.*

  **The Unifying Principle (Your Verdict):**

  **Cooperation stabilises in the PD when agents can reliably correlate their actions *either* across time (via repeated interactions with identifiable partners) *or* across genetic copies (via relatedness/tags), *and* the information required to maintain this correlation (identity persistence, action observation, tag recognition) is sufficiently robust against noise, uncertainty, and exploitation.**

  *   **Identity Persistence:** Knowing you're interacting with the *same* entity again (Cases 2, 3) or a perfect genetic copy (Case 1).
  *   **Information Asymmetry/Reliability:** Noise breaks observation (Case 2), uncertainty breaks knowledge of persistence (Case 3), costly probes fail to gather reliable info fast enough (Case 4). Kin selection (Case 1 & 5) relies on near-perfect tag information.
  *   **Correlation of Actions:** This is the key *mechanism*. Reciprocity correlates your action *with your opponent's past action*. Kin selection correlates your action *with your opponent's genetic identity*.

  **Your Bonus Case: Costly Signal + Social Convention**

  *   **Scenario:** One-shot PD. Players can send a costly signal beforehand (costs them something, say, energy). The signal's meaning ("I intend to cooperate" or "We cooperate when we see this") is fixed by social convention, not chosen strategically each game.
  *   **Prediction using the Principle:** Cooperation *can* evolve and be stable.
      *   **Why?** The costly signal acts as a *fixed tag*, established by convention. The cost prevents cheaters from easily faking it (they'd pay the cost just to defect once, which might not be worth it). Crucially, the convention *locks in the meaning*, creating reliable information about intent/group membership *before* the strategic choice.
      *   **How it fits:** It bypasses the need for *repeated interactions* by creating artificial "persistence" – the convention persists across the population. The signal reliably correlates actions: players seeing the signal know the convention implies cooperation *if they also signal*. It reduces the critical information asymmetry (do they intend to cooperate?) through the costly, conventionalised tag. It's closer kin to kin selection/greenbeards than to reciprocity, but it *works* within the one-shot frame by leveraging social infrastructure to create reliable correlation. Think of it like wearing a very expensive team jersey that signals "PD cooperator in good standing by convention".

  Your instincts are grappling with the core tension in evolving cooperation: overcoming the short-term temptation to defect requires mechanisms that reliably tie defection to negative consequences *for the defector's lineage*, and those mechanisms hinge entirely on information flow and perceived persistence. Nice cases!
