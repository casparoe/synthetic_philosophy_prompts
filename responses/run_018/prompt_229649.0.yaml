  Combining these: Epiphenomenalism requires closure to hold, overdetermination to be false, non-causal knowledge to be possible, and the Detached Dial to be coherent. I'll multiply the probabilities: 0.9 * (1 - 0.15) * 0.3 * 0.2 = 0.9 * 0.85 * 0.3 * 0.2 ≈ 0.046. But this seems too low, so I'll adjust for dependencies and add a base rate.

