answer: |-
  Here’s a tight, one-page proposal hitting your specs—casual, focused, and cutting through the usual clichés:

  ---

  **Project Title:** The Structural Core of Consequentialist Cluelessness: Asymmetry, Frameworks, and Unfixable Gaps  

  **Problem:** Everyone talks about cluelessness in consequentialism as "epistemic fog" about the far future. That’s surface-level. **The real bottleneck is structural: we can’t even *compare* radically different world-states (e.g., a digital utopia vs. a biodiverse Earth) because their ontologies clash.** This isn’t just missing data—it’s a foundational failure of commensurability. Worse, philosophers often assume this hits all ethics equally. *But does it?*  

  **Core Question:**  
  **Is structural cluelessness uniquely crippling for consequentialism (vs. rule-deontology or virtue ethics) due to its core demands, or is this asymmetry just an artifact of how we formalize these theories?**  

  **Why Standard Fixes Fail:**  
  Expected value? Useless when probabilities require comparing incommensurable goods. Robustness analysis? Tweaks outcomes within a *single* ontology; it can’t bridge structural gaps. "Wide intervals" just quantify ignorance; they don’t resolve value collisions between worlds with alien properties (e.g., no suffering vs. no sentience). These tools treat cluelessness as *noise*—but structural cluelessness is *silence*.  

  **My Split:** Cluelessness isn’t one thing. It’s three:  
  1. **Empirical Ignorance:** Missing facts (fixable in theory).  
  2. **Axiological Drift:** Unknown value shifts over time (e.g., will future beings care about biodiversity?).  
  3. **Structural Cluelessness:** The collapse of comparison itself when world-states differ ontologically (e.g., comparing a universe dominated by digital minds vs. one teeming with wild insects). This is the hard problem.  

  **Method:**  
  1. **Build a Conceptual Tool:** Map a taxonomy of structural gaps (e.g., ontological divergence, value-scale fragmentation).  
  2. **Stress-Test on Non-Obvious Cases:**  
     - **AI Alignment:** Does aligning an AGI to "human values" crash when its ontology (e.g., no embodied pain) structurally clashes with ours?  
     - **Wild-Animal Suffering:** Can we compare a "natural" world (mass suffering but high complexity) vs. a "managed" one (minimal suffering but artificial)?  
  3. **Probe the Asymmetry:** Run these cases through consequentialist, rule-deontological ("never harm sentients"), and virtue-ethical ("flourishing") lenses. Does structural cluelessness *inherently* break consequentialism’s utility-aggregation, while others sidestep it via rules/character?  

  **Deliverables (8 weeks @ half-time):**  
  - A working taxonomy of structural cluelessness types.  
  - 2 detailed case analyses (AI + WAS).  
  - A clear verdict: *Yes, the asymmetry is principled* (due to consequentialism’s demand for maximization across worlds) OR *No, it’s an artifact* (other theories hide the same problem behind rigid rules/vague virtues).  
  - **Practical Output:** A "Cluelessness Diagnostic Tool" for ethicists/practitioners to flag structural gaps early in long-termist projects.  

  **What Success Looks Like:**  
  - The taxonomy reveals *why* structural gaps resist existing tools.  
  - Cases show a clear asymmetry (or prove it’s artificial).  
  - We get a falsifiable claim: *"Structural cluelessness uniquely undermines consequentialism because..."*  

  **What Failure Looks Like:**  
  - The taxonomy doesn’t hold water (structural gaps blur into axiological drift).  
  - Cases don’t show asymmetry (all theories crash equally hard).  
  - We prove the problem is universal, making asymmetry a non-starter.  

  **Scope & Honesty:**  
  - **8 weeks won’t solve this.** We’ll map the terrain and test the asymmetry claim.  
  - We focus on *why* structural cluelessness is unfixable within standard frameworks, not building new ones.  
  - No grand unified theory—just sharper tools to diagnose the dead ends.  

  **Why This Matters:**  
  If structural cluelessness *does* hit consequentialism hardest, it forces a rethink of how we formalize impact in long-term projects (e.g., EA priorities). If it’s symmetric, we stop pretending deontology/virtue ethics are "safer"—and get honest about ethics in radical uncertainty.  

  ---

  **Fit:** Designed for agile, high-impact philosophy. Tight scope, tangible outputs, zero fluff. Let’s crack open the structural black box.
