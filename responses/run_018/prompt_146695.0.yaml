  I should check if the dialogue addresses all user points: moral responsibility (direct vs. indirect), replaceability (wild vs. domesticated), and the asymmetry in harm assessment. Each character must press the other on these points. For example, Mara asks Lin how to quantify diffuse harm, and Lin challenges Mara's dismissal of indirect effects.

  Need to avoid bias. Present both sides fairly. Mara's argument relies on measurable data (crop deaths), while Lin's focuses on ethical principles beyond quantification. Highlighting their disagreement on metrics—body count vs. systemic impact—shows the depth of the debate.

