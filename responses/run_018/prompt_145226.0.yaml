prompt: |-
  I am writing a historical novel set in first-century Judea, and for every scene or line of dialogue I must decide whether a gospel detail is historically plausible enough to present without framing it as authorial invention. Write a reusable decision procedure — an ordered checklist I can run alone in under ten minutes — that translates the standard criteria of authenticity into practical steps, with explicit stopping points, conflict-resolution rules for when criteria point in opposite directions, and clear flags marking which steps are judgment calls disguised as rules. The procedure should include a specific friction test I have devised: determine whether the detail generates narrative tension that serves no obvious theological or apologetic purpose for its source, and whether it survives a counterfactual in which the author sought to make Jesus appear more conventionally pious or politically unthreatening. Apply it to three details: the temple action, attested across all four narratives but with divergent settings and motives; the birth narratives with angelic announcements and genealogies, present in only two sources and tightly woven into theological claims; and the reported cry of dereliction at the crucifixion, in which Jesus asks why he has been forsaken, a moment that is theologically awkward but emotionally powerful. Include one case where the procedure classifies a resonant, dramatically useful detail as likely invented — an outcome I will not want — and conclude by stating precisely what this checklist can never establish, such as whether Jesus was divine or whether any particular event actually happened. Note that I face editorial deadlines and must justify each decision in a brief author's note.
reasoning: |-
  We are creating a decision procedure (checklist) for evaluating the historical plausibility of gospel details for a historical novel set in first-century Judea. The procedure must be reusable, take under ten minutes, and include:
  1. Ordered steps with explicit stopping points.
  2. Conflict-resolution rules when criteria conflict.
  3. Clear flags for steps that are judgment calls.
  4. A specific "friction test": 
     a. Does the detail generate narrative tension that serves no obvious theological or apologetic purpose?
     b. Does it survive a counterfactual in which the author sought to make Jesus appear more conventionally pious or politically unthreatening?

  We will apply the procedure to three details:
  1. Temple action (all four gospels, but with divergent settings and motives).
  2. Birth narratives (only two sources: Matthew and Luke, with angelic announcements and genealogies).
  3. Cry of dereliction (Mark 15:34 and Matthew 27:46, theologically awkward).

  We must include one case where the procedure classifies a resonant, dramatically useful detail as likely invented (even if we don't like that outcome).

  Finally, we state what the checklist can never establish (e.g., divinity of Jesus, actual occurrence of an event).

  ---

  **Decision Procedure: Historical Plausibility Checklist**

  **Step 1: Multiple Attestation**
  - **Check:** Is the detail attested in more than one independent source? (e.g., Mark, Q, M, L, John, Paul, non-Christian sources). Note: Matthew and Luke are not independent if they both depend on Mark.
  - **Stopping Point:** If the detail is attested in at least two independent sources (e.g., Mark and John, or Q and Paul), mark as "plausible" and proceed to Step 3 (skipping Step 2). If not, proceed to Step 2.
  - **Judgment Call Flag:** Determining source independence (e.g., whether Matthew and Luke used a common source beyond Mark) requires judgment.

  **Step 2: Embarrassment and Friction**
  - **Check:** 
     a. *Embarrassment:* Is the detail potentially embarrassing to the early church (e.g., contradicts later doctrine, portrays Jesus or disciples negatively)?
     b. *Friction Test:* 
          i. Does the detail generate narrative tension that serves no obvious theological or apologetic purpose? 
          ii. Does it survive a counterfactual in which the author sought to make Jesus appear more conventionally pious or politically unthreatening? (That is, if the author wanted to make Jesus look good by the standards of the time, would they have included this detail? If not, it has friction.)
  - **Stopping Point:** If either (a) or (b) is strongly affirmative, mark as "plausible" and proceed to Step 3. If both are negative, mark as "suspect" and proceed to Step 4 for further analysis.
  - **Conflict Note:** If Step 1 is negative (only one source) but Step 2 is positive (embarrassment/friction), then the detail is still plausible. If Step 1 is positive (multiple attestation) and Step 2 is negative, then the detail remains plausible (multiple attestation trumps).
  - **Judgment Call Flag:** Determining what would be embarrassing or theologically inconvenient requires knowledge of early Christian concerns and is a judgment call.

  **Step 3: Contextual Plausibility**
  - **Check:** Is the detail consistent with what we know of first-century Judea from historical, archaeological, and cultural sources? (e.g., practices, beliefs, social structures, geography, language).
  - **Stopping Point:** If yes, mark as "plausible". If no, mark as "suspect". Proceed to Step 4.
  - **Judgment Call Flag:** Our knowledge of the period is incomplete; this step requires judgment about what fits.

  **Step 4: Final Decision and Authorial Note**
  - **Conflict-Resolution Rules:**
     - If a detail is marked "plausible" in both Steps 1/2 and Step 3, then it is **plausible**.
     - If a detail is marked "plausible" in Step 1/2 but "suspect" in Step 3, then it is **plausible with reservations** (context may be reinterpreted or the historical record incomplete).
     - If a detail is marked "suspect" in Step 1/2 and "suspect" in Step 3, then it is **likely invented**.
     - If a detail is marked "suspect" in Step 1/2 but "plausible" in Step 3, then it is **ambiguous** (context supports it, but source criteria do not).
  - **Authorial Note:** For the novel, you may choose to present plausible and plausible with reservations without framing. For suspect and ambiguous, consider framing as tradition or invention.

  ---

  **Application of the Checklist**

  **Detail 1: Temple Action (Cleansing of the Temple)**
  - Step 1: Attested in Mark (11:15-19), Matthew (21:12-17), Luke (19:45-48), and John (2:13-22). But note: Matthew and Luke depend on Mark, so independent sources are Mark and John. **Multiple attestation: YES** → Plausible, skip to Step 3.
  - Step 3: The temple was a central institution in first-century Judea, and prophetic actions against the temple are known (e.g., Jeremiah). The trade in animals and money-changing was necessary for the temple cult and was located in the outer court. Jesus' action fits within the tradition of Jewish prophetic critique. **Contextual: YES** → Plausible.
  - Final Decision: **Plausible** (present without framing).

  **Detail 2: Birth Narratives (Angelic Announcements and Genealogies)**
  - Step 1: Only in Matthew and Luke (both dependent on their own special material, M and L, but no independent attestation outside these two). They are not independent of each other? Actually, the birth narratives are unique to each and not derived from Mark or Q, so they are two independent sources. **Multiple attestation: YES** → Plausible, skip to Step 3.
  - Step 3: 
     - Angelic announcements: Belief in angels and divine messages was common in Second Temple Judaism (e.g., Gabriel in Daniel). However, the specific form (appearing to Mary, Joseph, shepherds) is not corroborated elsewhere and has theological purposes (virgin birth, Davidic lineage). 
     - Genealogies: Tracing lineage was important for claims to Davidic descent. But note: Matthew and Luke's genealogies differ (especially from David to Jesus). The differences suggest theological construction (e.g., Matthew's 14 generations x 3). 
     - Contextual Plausibility: While the elements (angels, genealogies) are contextually plausible, the specific narratives are tightly woven into theological claims and not corroborated by other sources. **Contextual: WEAK (due to theological shaping)** → Mark as "suspect" for Step 3.
  - Conflict-Resolution: Step 1 says plausible, Step 3 says suspect → **Plausible with reservations**. 
  - Final Decision: The core idea of Jesus being born in Bethlehem and having Davidic lineage might be historical, but the angelic announcements and genealogies are likely theological elaborations. **Plausible with reservations** (consider framing as tradition).

  **Detail 3: Cry of Dereliction (Mark 15:34, Matthew 27:46)**
  - Step 1: Attested in Mark and Matthew. But Matthew depends on Mark, so only one independent source (Mark). **Multiple attestation: NO** → Proceed to Step 2.
  - Step 2: 
     a. Embarrassment: The cry ("My God, my God, why have you forsaken me?") could be seen as Jesus expressing despair, which is theologically awkward (if Jesus is divine, why would he feel forsaken?). This would be embarrassing for early Christians who believed in Jesus' divine sonship and victory over death. **Embarrassment: YES**.
     b. Friction Test:
          i. Narrative tension: It creates intense emotional and theological tension. It serves no obvious apologetic purpose (it doesn't make Jesus look victorious or in control).
          ii. Counterfactual: If the author wanted to make Jesus appear more pious or unthreatening, they would have omitted this cry (e.g., replaced it with a prayer of trust, as in Luke 23:46). It survives the counterfactual because it is included despite making Jesus look vulnerable. **Friction: YES**.
     Step 2: Both (a) and (b) are affirmative → **Plausible**.
  - Step 3: The use of Psalm 22:1 is consistent with a crucified person uttering a scriptural lament. Crucifixion was a brutal and humiliating form of execution, and cries of anguish would be contextually plausible. **Contextual: YES** → Plausible.
  - Final Decision: **Plausible** (present without framing).

  **One Case of Likely Invented (Even if Resonant and Dramatic)**

  We must have one case where the procedure classifies a resonant detail as likely invented. Let's choose **the birth narratives' angelic announcements** (part of Detail 2). However, our procedure for the birth narratives overall was "plausible with reservations". To get a clear "likely invented", we can break down a specific element:

  **Specific Detail: The angelic announcement to the shepherds (Luke 2:8-20)**
  - Step 1: Only in Luke (no multiple attestation). **NO** → Step 2.
  - Step 2: 
     a. Embarrassment: Not embarrassing (it's a glorious announcement).
     b. Friction Test: 
          i. It serves an obvious theological purpose (announcing the savior's birth to lowly shepherds emphasizes Jesus' humility and universal reach). 
          ii. Counterfactual: If Luke wanted to make Jesus appear more conventionally pious or unthreatening, he might still include angels (which are pious) but might not choose shepherds (low-status witnesses). However, the scene is designed to be theologically edifying and non-threatening. No friction. 
     Step 2: Negative → **Suspect**.
  - Step 3: Shepherds were part of the rural landscape, but the story of a heavenly host appearing to them is not independently attested. It fits the Lukan theme of revelation to the marginalized, but it is not required by context. **Contextual: Weak (theological shaping)** → Suspect.
  - Step 4: Step 1 (NO) and Step 2 (suspect) and Step 3 (suspect) → **Likely invented**.

  Thus, the specific detail of the angelic announcement to the shepherds is classified as likely invented, even though it is resonant and dramatically powerful.

  ---

  **Conclusion: What the Checklist Can Never Establish**

  This checklist can never establish:
  1. The divinity of Jesus or any supernatural event (it assesses historical plausibility within a naturalistic framework).
  2. Whether any particular event actually happened (it only evaluates the likelihood based on historical criteria).
  3. The exact words of Jesus (it can only assess the plausibility of the reported sayings or actions).
  4. The inner thoughts or motivations of historical figures.

  The procedure is a tool for making informed decisions about presentation in a historical novel, not for proving historical facts.
answer: |-
  ### Historical Plausibility Decision Procedure for Gospel Details  
  **Purpose:** To determine if a gospel detail can be presented as historically plausible without framing it as authorial invention in a first-century Judean historical novel. Designed for <10-minute use per detail.  

  ---

  #### **Ordered Checklist**  
  *Run steps sequentially. Stop at any ⛔. Resolve conflicts with 💡. Judgment calls flagged with ⚖️.*  

  1. **Source Attestation Check**  
     - *Rule:* Does the detail appear in ≥2 independent sources (e.g., Mark, Q, John, Paul, non-canonical texts)?  
     - *Stopping Point:* **⛔ If YES → Proceed to Step 3.** If NO (single-source) → Proceed to Step 2.  
     - *⚖️ Judgment Call:* Independence determination (e.g., Matthew/Luke sharing Mark = not independent).  

  2. **Theological Utility vs. Friction Test**  
     - *Rule:* Apply two-part friction test:  
       - (a) Does the detail create narrative tension **without** clear theological/apologetic benefit (e.g., embarrasses leaders, complicates dogma)?  
       - (b) Does it survive a counterfactual where the author aimed to make Jesus **more conventionally pious/politically safe**?  
     - *Stopping Point:* **⛔ If (a) AND (b) are YES → Proceed to Step 3.** If NO → Mark "suspect" and proceed to Step 4.  
     - *⚖️ Judgment Call:* Assessing "theological benefit" requires cultural/theological insight.  

  3. **Contextual Plausibility Check**  
     - *Rule:* Is the detail consistent with first-century Judean:  
       - Archaeology (e.g., temple practices),  
       - Jewish texts (e.g., Dead Sea Scrolls, Josephus),  
       - Sociopolitical norms (e.g., Roman occupation, Jewish sects)?  
     - *Stopping Point:* **⛔ If YES → Mark "plausible."** If NO → Mark "suspect." Proceed to Step 4.  

  4. **Conflict Resolution & Final Rating**  
     - *💡 Conflict Rules:*  
       - Step 1 (YES) + Step 3 (NO) = **Ambiguous** (prioritize attestation; note reservations).  
       - Step 2 (YES) + Step 3 (NO) = **Suspect** (context overrides friction).  
       - Step 1 (NO) + Step 2 (NO) = **Likely Invented** (no external/friction support).  
     - *Output:* Assign one rating:  
       - **Plausible** (present without framing),  
       - **Ambiguous** (present with light framing, e.g., "some recalled"),  
       - **Suspect/Likely Invented** (frame as tradition/invention).  

  ---

  ### **Application to Gospel Details**  
  #### **1. Temple Action (All Four Gospels)**  
  - **Step 1:** Attested in Mark, John, and implied in Q (Matthew/Luke adapt Mark). **⛔ YES → Skip to Step 3.**  
  - **Step 3:** Historically plausible. Temple commerce existed (Josephus, *Antiquities* 15.417); prophetic protests align with Jewish "cleansing" traditions (e.g., Malachi 3:1). Motive variations (e.g., anti-commerce vs. eschatological) reflect early Christian reinterpretation but core action fits context. **Plausible.**  
  - **Author's Note:** *"Historical consensus supports a disruptive temple act; motives are reconstructed from period norms."*  

  #### **2. Birth Narratives (Matthew/Luke: Angels, Genealogies)**  
  - **Step 1:** Only two sources (Matthew/Luke), but Luke may not depend on Matthew → **NO.**  
  - **Step 2:** Friction Test:  
    - (a) **Theological benefit:** Angels/genealogies establish divine birth and Davidic lineage—core to Christology. Genealogies diverge (Matthew’s 14 generations; Luke’s Adam link), revealing theological shaping.  
    - (b) **Counterfactual:** If authors sought a "safer" Jesus, they might omit supernatural births (risking accusations of illegitimacy) or harmonize genealogies. They did not → friction **NO.**  
    **⛔ Suspect → Proceed to Step 4.**  
  - **Step 4:** **Likely Invented** (No independent attestation; high theological utility; contextual issues, e.g., no extrabiblical evidence for Quirinius’ census aligning with Herod’s reign).  
  - **Author's Note:** *"Angelic announcements reflect early theology; genealogies serve Davidic claims. Presented as communal tradition."*  
  - **⚠️ Resonant but Invented:** Dramatic angelic dialogues (e.g., Luke 1:28–35) are classified as likely invented despite narrative power.  

  #### **3. Cry of Dereliction (Mark/Matthew: "Why have you forsaken me?")**  
  - **Step 1:** Only Mark/Matthew (Matthew uses Mark) → **NO.**  
  - **Step 2:** Friction Test:  
    - (a) **Theological benefit:** None. Contradicts Jesus’ serene death in Luke/John and divine unity. Early Christians struggled with this (e.g., Hebrews 5:7 reinterprets it as piety).  
    - (b) **Counterfactual:** If Mark sought to appease critics, he would omit a cry implying doubt/abandonment. He includes it → friction **YES.**  
    **⛔ YES → Proceed to Step 3.**  
  - **Step 3:** Contextually plausible. Crucifixion victims quoted Psalms (e.g., Psalm 22:1); despair fits historical accounts of Roman executions. **Plausible.**  
  - **Author's Note:** *"The cry’s plausibility rests on Markan authenticity and crucifixion psychology; theological tension suggests historical roots."*  

  ---

  ### **What This Checklist Cannot Establish**  
  1. **Supernatural claims:** Cannot confirm/deny divine acts (e.g., angelic appearances).  
  2. **Event certainty:** Assesses plausibility, not proof. A "plausible" rating does not mean "happened exactly as described."  
  3. **Motives/emotions:** Only evaluates external plausibility, not internal states (e.g., Jesus’ subjective despair).  
  4. **Theological truth:** Silent on doctrines (e.g., resurrection, divinity).  

  **Time-Saving Tip:** For deadlines, focus on Steps 1–2 first; resolve conflicts with 💡 rules. Use standard references (e.g., Josephus, DSS) for Step 3 consistency.
