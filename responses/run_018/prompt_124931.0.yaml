  **Explanation of Taxonomy Structure:**
  - **Root Question**: Sets the core luminosity commitment. "Yes" leads to defenses of luminosity; "no" leads to skepticism or deflation.
  - **Branch Nodes**:
    - **B1 (Gradual Change)**: Tests if failures in borderline cases generalize to all states. "Yes" = undermines universally; "no" = localized to borderlines.
    - **B2 (Contextualism)**: Examines if context-sensitivity rescues luminosity. "Yes" = contextualist preservation; "no" = metaphysical failure.
    - **B3 (Uniformity)**: Probes whether luminosity applies equally to feelings and beliefs. "Yes" = can restrict to phenomenology; "no" = uniform application.
    - **B4 (KK Split)**: Asks if KK holds only where luminosity survives. "Yes" = split KK; "no" = global KK (modified/rejected).
  - **Leaves**: Defined by unique answer patterns:
    - *Pure anti-luminosity*: Rejects luminosity/KK entirely, using gradual change as universal counterexample.
    - *Contextualist preservation*: Saves luminosity via context-sensitivity, retaining uniform KK.
    - *Restricted luminosity*: Limits luminosity to phenomenology with split KK for beliefs.
    - *Threshold-shift*: Accepts luminosity but requires stability margins violated in gradual change.
    - *Deflationary*: Dissolves the debate by denying substantive mental properties.
  - **Unoccupied Patterns**: Examples of gaps:
    - `["yes", "yes", "no", ...]` is **incoherent** (accepts luminosity while claiming gradual change destroys it universally).
    - `["yes", "no", "yes", "yes", "yes"]` is **unattractive** (overloaded with ad-hoc commitments).
    - `["no", "yes", "yes", ...]` is **unexplored** (no known defenses).
    
  **Key Philosophical Insights**:  
  - Positions cluster around handling *vagueness* (B1), *context-dependence* (B2), and *mental state heterogeneity* (B3).  
  - KK principle splits (B4) typically pair with restricted luminosity to avoid overcommitment.  
  - Deflationary and pure anti-luminosity leaves reject the root but diverge on whether the debate is substantive (anti-luminosity) or illusory (deflationary).  
  - Unoccupied patterns reveal tensions, e.g., combining contextualism (B2=yes) with luminosity restriction (B3=yes) is possible but philosophically strained.
