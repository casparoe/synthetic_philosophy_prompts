  The user clearly has deep practical experience with these ethical dilemmas. They've identified core philosophical tensions but wisely recognize that operational tools must sacrifice some nuance for usability. Their frustration with disputes being framed as "principle vs preference" suggests they need procedural fairness to maintain community trust.

  Key challenges here: First, preserving the essential distinction between subjective preferences and universalizable principles while acknowledging legitimate particular attachments. Second, preventing the procedure from being weaponized in cultural conflicts (like the religious music case). Third, accepting that some disagreements are fundamentally about values, not bias detection.

  For Conceptual Translation: I'll clarify that preferences are subjective but coherent across perspectives, while biases distort judgment inconsistently. The Reversal test exposes inconsistency in bias, while the Regret Audit tests universalizability. I'll explicitly note we're dropping debates about moral realism vs anti-realism and the exact nature of "harm" - too theoretical for this context.

  For the Procedure: Must be crystal clear with binary stop/go points. I'll sequence the checks logically: Reversal first to expose personal inconsistency, then Regret to test community-wide application. Need specific language for questions and unambiguous thresholds for "bias detected" vs "values dispute." Will build in a safety valve where board votes when both tests pass but conflict persists.

  For Worked Cases: The religious music case should reveal cultural preference masquerading as universal principle. The children-in-ground-floor-unit case will demonstrate how fairness arguments can mask bias when Reversal collapses. The pet ban case will be uncomfortable but necessary to show emotional investment doesn't immunize against bias detection.

  For Limits: Crucial to flag that cultural minority practices might falsely trigger "bias" in Regret Audit, and that Reversal might misread parental instincts as bias. Must emphasize this tool detects distortion, not moral truth.

  The tone needs to be formal enough for board documentation but retain the user's practitioner voice - no academic jargon. Will mirror their thoughtful, experience-based approach to ethics.
answer: |-
  ## Ethics Review Board: Preference vs. Principle Screening Procedure

  **1. Conceptual Translation**

  The core difficulty lies in distinguishing claims grounded in legitimate, shared moral values ("principles") from those driven by subjective likes/dislikes ("preferences") or unjustified discrimination ("biases"). Preferences are subjective but often coherent; principles aspire to universality. Biases distort judgment, applying standards inconsistently based on irrelevant characteristics. Your checks target this inconsistency.

  *   **Asymmetry of Reversal (AOR):** Probes *internal consistency*. A genuine preference (e.g., liking quiet) usually remains coherent, though perhaps less intense, when imagined reciprocally. A bias often inverts or collapses under this test, revealing an unprincipled double standard. We retain this core insight into inconsistency as a bias marker.
  *   **Regret Audit (RA):** Probes *universalizability and consequences*. A principle should withstand its universal application without creating intolerable conflict or undermining the cooperative's purpose. A preference or bias often falters when scaled, revealing its partiality or impracticality. We retain the test's focus on systemic consequences.

  *Nuances Dropped:* We set aside debates on moral realism (whether principles are "objectively true"), the precise definition of "harm," and complex questions about whether *all* particular attachments (like parental care) are biases in communal settings. The procedure focuses on *detecting inconsistency and unworkable consequences* within the cooperative's context, not establishing absolute moral truth.

  **2. The Procedure**

  *   **Goal:** Distinguish "Likely Bias," "Confirmed Preference," or "Values Dispute" within ~15 minutes per case.
  *   **Input:** A specific resident claim framed as a moral principle (e.g., "Resident A has a *duty* to do X/not do Y because of Principle Z").
  *   **Assumed Expertise:** Common sense, familiarity with cooperative rules, and basic fairness. No philosophy degree required.
  *   **Chair Role:** Facilitates discussion, ensures steps are followed, times the process (~3-5 mins per step), and records the outcome & rationale.
  *   **Output:** One of three determinations.

  **Step-by-Step Checklist:**

  1.  **Clarify the Claim (Chair):**
      *   *Question:* "Resident [Objector], please state clearly: What specific action or situation do you object to, and what *specific moral principle* do you believe it violates? Resident [Target], do you agree this is the principle being claimed?"
      *   *Sufficient Answer:* A specific behavior/rule interpretation and a stated principle (e.g., "duty of quiet respect," "fairness in cost burden").
      *   *Move to Step 2.*

  2.  **Apply Asymmetry of Reversal (AOR) to Objector:**
      *   *Question:* "Resident [Objector], imagine the situation was reversed: You were doing [the specific action, or something *directly analogous* in impact] and Resident [Target] was objecting on the *exact same principle* you just stated. Would you still find the principle itself coherent and applicable? Would your commitment to it hold, weaken significantly, invert, or collapse? *Explain briefly why.*"
      *   *Analysis:*
          *   **Holds/Weakens Coherently (e.g., "I'd still think quiet is important, but maybe I'd compromise more"):** *Proceed to Step 3.*
          *   **Inverts/Collapses (e.g., "Well, no, if *I* wanted to play music, it would be different because... [irrelevant reason]"):** Likely indicates inconsistency suggestive of bias. *STOP: Flag "Likely Bias Detected (AOR Failed)".*
          *   **Unclear/Ambiguous:** Chair probes once briefly for clarity. If still ambiguous, *Proceed to Step 3 cautiously.*

  3.  **Apply Regret Audit (RA):**
      *   *Question:* "Resident [Objector], if *every* resident in this cooperative adopted and acted on this exact principle *in all comparable situations*, would you still endorse that outcome? Consider: Would it create unresolvable conflict? Make communal life impossible? Unfairly burden certain groups? Fundamentally undermine the cooperative's purpose? Or would it create a community you'd be comfortable living in?"
      *   *Analysis:*
          *   **Endorses Outcome (Clear "Yes" without major caveats):** Principle appears universalizable within the co-op context. *STOP: Flag "Values Dispute - Hand to Board Vote."* (The principle may be valid but contested; it's about values, not bias).
          *   **Regrets Outcome (Clear "No", or "Yes, but only if..." creating impossible conditions):** Suggests the claim cannot function as a genuine shared principle without causing systemic problems or revealing hidden partiality. *STOP: Flag "Likely Bias Detected (RA Failed)".*
          *   **Conditional Endorsement/Hesitation (e.g., "Only if exceptions were made for X..."):** *Apply the condition universally:* "If *everyone* made that exception for their own comparable situation, would you *still* endorse the outcome?" If "No" or strong hesitation: *Flag "Likely Bias Detected (RA Failed)".* If firm "Yes": *Flag "Values Dispute - Hand to Board Vote."*

  **Summary of Stops:**
  *   **Likely Bias Detected:** AOR shows clear inversion/collapse **OR** RA shows clear regret/universalization failure. (Board can note this in deliberations; claim loses presumption of being a valid *shared* principle).
  *   **Confirmed Preference:** *Not a direct outcome.* The procedure screens *claims of principle*. If bias is likely detected, the claim is undermined. If it passes both checks, it's a values dispute.
  *   **Values Dispute - Hand to Board Vote:** Claim passes both AOR (coherent under reversal) **AND** RA (universal outcome endorsed). The board must now vote on the *merits* of the principle itself within the co-op's values.

  **3. Worked Cases**

  *   **Case A: Loud Sunday Religious Music (Objection: Duty of Quiet Respect)**
      *   Step 1: Principle: "Duty of quiet respect for shared living on Sunday mornings."
      *   Step 2 (AOR): Objector asked: If *you* played different (non-religious? equally loud) music Sunday AM and neighbor objected on quiet respect, would the principle hold? *Answer:* "Well, if it was *my* cultural practice, quiet respect might be less important then." **→ Inversion/Collapse.** *STOP: Likely Bias Detected (AOR Failed).* (The principle isn't applied consistently; it masks a preference against *this specific* noise/content).

  *   **Case B: Deny Family w/ Kids Ground-Floor Unit (Objection: Fairness re: Wear & Tear)**
      *   Step 1: Principle: "Fairness in distributing disproportionate maintenance costs caused by resident choices."
      *   Step 2 (AOR): Objector asked: If *you* had young kids and were denied a ground-floor unit solely due to potential wear, citing fairness, would the principle hold? *Answer:* "That's different! Families *need* ground floor! It's unfair to penalize necessity!" **→ Inversion/Collapse.** *STOP: Likely Bias Detected (AOR Failed).* (The principle of "choice = cost responsibility" collapses when applied to the objector's desired group; reveals bias against families/kids as a category).

  *   **Case C: Ban Pets as Violating Collective Cleanliness (Deeply Held View)**
      *   Step 1: Principle: "Moral duty to maintain collective cleanliness standards, violated by pets."
      *   Step 2 (AOR): Objector asked: If *you* had a well-trained, hypoallergenic pet causing no issues, and were banned solely on the cleanliness principle, would it hold? *Answer:* "Absolutely. Cleanliness is paramount. No pets is the only guarantee. I'd accept the ban." **→ Holds/Weakens Coherently.** *Proceed to Step 3.*
      *   Step 3 (RA): Objector asked: If *every* resident adopted "no pets ever for cleanliness" principle, would you endorse it? *Answer:* "Yes! The building would be pristine, peaceful, allergen-free! Perfect!" **→ Endorses Outcome.** *STOP: Values Dispute - Hand to Board Vote.* (Passes both checks: consistent under reversal, universal outcome endorsed. Emotional investment doesn't make it a *bias* within this test; it's a sincerely held, consistent value about communal living standards, even if unpopular. Board must vote on whether this value outweighs others like pet companionship).

  **4. Limits and Honest Misfires**

  This procedure is a bias *screening* tool, not a moral truth detector. Key limitations:

  *   **Surviving Hidden Biases:** Deeply internalized biases (e.g., implicit associations) might pass both checks if the resident genuinely believes their inconsistent application is justified or doesn't recognize the inconsistency. The procedure relies on *expressed* reasoning.
  *   **Regret Audit & Minority Practices:** The RA risks mislabeling legitimate minority cultural/religious practices requiring accommodation as "biases" if the objector regrets universalization simply because it would enable practices they dislike. *Mitigation:* AOR is crucial. If the practice passes AOR (coherent under reversal) but fails RA only because the objector dislikes enabling *others'* different practices, it may indicate intolerance, not bias *in the claim itself*. This requires careful chair probing in Step 3.
  *   **AOR & Particular Attachments:** Legitimate special obligations (e.g., prioritizing one's child's safety) *will* weaken under strict reversal ("I care less about *your* child than mine"). The procedure risks flagging these as biases. *Mitigation:* Focus on claims about *shared cooperative principles/rules*, not purely personal obligations. The context is collective governance, not private morality.
  *   **Judgment Calls:** Identifying "directly analogous" situations for AOR (Step 2) and interpreting "hesitation" or "conditional endorsement" in RA (Step 3) are inherently judgmental. The chair must document the rationale clearly.

  **5. Implementation Note**

  *   **When to Run:** Apply this procedure during the initial review phase for *any* dispute where one party frames an objection as a violation of a *moral principle* and the other counters it is mere preference/bias. Use it *before* substantive debate on the merits.
  *   **Record Keeping (Chair):** For each case, record: 1) The stated principle; 2) AOR answer & rationale; 3) RA answer & rationale; 4) Procedure outcome (Bias Detected / Values Dispute); 5) Brief justification for outcome. Attach this to the case file.
  *   **Overriding the Checklist:** The procedure's outcome ("Likely Bias" or "Values Dispute") is advisory. The board can override it with a supermajority vote (e.g., ⅔), but the chair *must* document the specific reasons for overriding the screening result in the case notes, ensuring accountability for deviating from the agreed-upon screening logic. Overrides should be rare.
