prompt: |-
  You are an expert in applied moral philosophy and practical ethics consulting with experience translating conceptual debates into operational tools for people without formal training. Think carefully and step by step. Before you draft anything, briefly brainstorm which philosophical distinctions between preference and bias must survive in a practical checklist and which nuanced theoretical points can be safely dropped so that a non-specialist board can apply the result in about fifteen minutes.

  I serve on the ethics review board of a housing cooperative, and every month we must adjudicate disputes in which one resident frames an objection as a moral principle while another dismisses it as a mere personal preference — or, conversely, accuses the first party of disguising a prejudice as principle. I have no academic background in philosophy, but I have been working through these questions on my own, and I want to turn them into a reusable procedure. In particular, I have been developing two checks that I think capture something important, though I am not sure how to formalize them. The first I call the Asymmetry of Reversal: the idea that a genuine preference tends to stay coherent, even if weakened, when you imagine yourself on the receiving end of the decision, whereas a bias tends to invert or collapse under that reversal — though I realize that legitimate particular attachments, like caring more for one's own child, also weaken under reversal, so reversal alone is not sufficient. The second check I call the Regret Audit: asking whether the person would still endorse the same judgment if they learned that every resident in the cooperative adopted the identical standard in all comparable cases. I need you to integrate both checks into a clear, ordered decision procedure that my board can actually run, with explicit stop points where we declare "bias detected," "preference confirmed," or "values dispute — hand to board vote," and with honest flags for where judgment cannot be eliminated.

  Please structure your response exactly as follows, with these section names in this order and approximate lengths:

  1. Conceptual Translation (about 200 words): Explain the principle you are operationalizing — the philosophical difficulty of separating moral preferences from moral biases — and describe how my two injected checks (Asymmetry of Reversal and Regret Audit) map onto that distinction. State explicitly which theoretical distinctions must survive the simplification and which philosophical nuances you are dropping for the sake of usability.

  2. The Procedure (about 500 words): Provide a step-by-step checklist or flowchart in words that a board can follow in roughly fifteen minutes. For each step, give the exact question to ask, what counts as a sufficient answer, and where the flow stops with a definitive result versus where it stops with "values dispute — hand to vote" because the issue is one of values rather than correctable distortion. Integrate both checks into the flow in the correct order. Specify the role of the board chair in signing off, the assumed expertise (common sense only), and the time constraint per case.

  3. Worked Cases (about 600 words total): Apply the procedure to three disputes:
     a) A resident objects to a neighbor's loud religious music on Sunday mornings, claiming it violates a shared moral duty of quiet respect; the neighbor insists this is only the objector's aesthetic preference.
     b) A resident argues that the cooperative should deny a family with young children a ground-floor unit because children cause disproportionate wear, framing the argument as a fairness principle about shared maintenance costs.
     c) A case where the procedure yields an answer the board will strongly dislike: a long-standing resident claims that allowing pets violates a moral principle of collective cleanliness, and the procedure flags this as a likely bias despite the resident's deep emotional investment and long history in the building.
     For each case, show the answers at each step, indicate where the procedure stops, and state the result.

  4. Limits and Honest Misfires (about 250 words): Clearly state what the procedure cannot do. Address whether hidden biases can survive both checks, whether the Regret Audit risks mislabeling legitimate minority cultural practices as biases, and whether the Asymmetry of Reversal unfairly penalizes particular attachments. Flag any steps that are judgment calls dressed up as procedural rules.

  5. Implementation Note (about 100 words): Brief guidance on how often to run the procedure, what minimal record the board chair should keep, and how to document instances where human judgment overrode the checklist.

  Write in a polished, formal tone appropriate for a board document, but maintain the voice of a non-academic practitioner who developed these ideas through independent reflection. Do not include bibliographies, reading lists, citations, or requests that I look anything up. Do not quote any real text verbatim.
