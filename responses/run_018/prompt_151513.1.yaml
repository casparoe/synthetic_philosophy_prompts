answer: |-
  ### Dialogue: The Modal Status of Unratified Constitutions

  **Setting:** A philosophy conference breakout room. Dr. Aris Thorne (Counterpart Theorist) and Dr. Selene Voss (Transworld Identity Theorist) discuss over coffee.

  ---

  **Dr. Selene Voss:** Aris, consider our actual Constitution A—drafted, ratified, and embedded in centuries of collective recognition. Now, a nearby world W contains a physically identical document P, produced by a materially identical drafting assembly. But in W, P was shelved immediately after drafting. No ratification, no institutional uptake. On your Lewisian view, P is merely a counterpart of A, not A itself. But this violates strong intuitions about artifact identity. The text *is* the constitution—its semantic content defines the institution. Since P is word-for-word identical to A, it *is* A, merely unrealized in W. Breaking the chain of recognition doesn’t annihilate its identity; it merely leaves it dormant.

  **Dr. Aris Thorne:** Selene, your dormancy metaphor smuggles in haecceitism. Identity isn’t carried by bare “thisness.” The constitution isn’t just ink on parchment—it’s a *social rule*. The physical document is a vehicle for a *practice*. In W, P has no connection to any rule-following community. It’s a mere replica, like an unplayed score isn’t a symphony. Counterpart theory captures this perfectly: A has counterparts in worlds *where analogous social practices exist*. P in W lacks the historical-causal chain of collective recognition—what we’re calling “institutional inertia.” Without that inertia, P is a different entity modally, even if intrinsically identical.

  **Voss:** But you conflate the institution with its material anchor. The constitution *as an abstract type*—a specific arrangement of legal propositions—exists independently of its instantiation. Transworld identity holds for the type. In W, P instantiates the *very same type* as A does in @ (actual world). The absence of ratification affects its *social role*, not its *identity*. Institutional inertia governs persistence *within* a world, not identity *across* worlds. Your counterpart relation reduces the constitution to its contingent historical trajectory, ignoring its essential, shareable content.

  **Thorne:** Your type-token distinction doesn’t resolve the issue. The abstract type “Constitution-of-the-United-States” is *itself* individuated by its generative history. Origin essentialism applies to artifacts: Kripke’s lectern couldn’t be made of ice; our constitution couldn’t emerge from a random quantum fluctuation. It’s essentially tied to *that* drafting event. In W, P shares origins—same drafters, same room—so I grant a strong counterpart relation. But without ratification, the institutional *act* that transforms text into law is missing. The inertia—the unbroken chain of recognition—isn’t just accidental; it’s metaphysically constitutive. Break the chain, and you break the entity’s transworld identity.

  **Voss:** Then you make modal persistence hostage to ephemeral human acts. Suppose in @, ratification passed by one vote. In W, it failed by one vote. On your view, A and P are distinct entities. But this makes constitutional identity intolerably fragile—a single vote annihilates an object’s transworld being! Whereas on transworld identity, A exists in both worlds: realized in @, unrealized in W. The inertia you prize is a *causal* condition for activation, not an *essential* condition for identity. Physical artifacts like signed treaties show this: an unratified treaty is still *that treaty* modally, even if inert.

  **Thorne:** Fragility is a feature, not a bug. Social objects *are* ontologically precarious—they depend on collective intentionality. A treaty unsigned isn’t a treaty; it’s a draft. The ratification is *constitutive*. Your view risks multiplication without difference: if every possible duplicate text is “the constitution,” you flood modal space with identical but distinct entities, violating qualitative parsimony. Counterpart theory allows similarity grading: P in W is a close counterpart due to shared origins and form, but not identical because it lacks the essential property: *having been ratified by the relevant body*. Institutional inertia isn’t momentum—it’s the historical glue binding identity to practice.

  **Voss:** But if identity requires realized practice, you cannot say “*this* constitution might have gone unratified”—because then you’re referring to something that, in that world, isn’t itself. That violates modal intuition. Transworld identity with variable realization solves this: A exists in W *as unratified*. The inertia condition is world-relative; it doesn’t fracture transworld identity. Your counterpart relation preserves talk of “what might have been” but at the cost of making it about a *different thing*. That seems revisionary.

  **Thorne:** It’s not revisionary—it’s precisifying. When we say “this constitution might have gone unratified,” we mean a *very similar* constitution did. The referring term “this constitution” is anchored to @’s ratified entity. In W, we have a superb counterpart, not the original. The intuition you cite confuses similarity with identity. Social kinds are relational; their modal profiles are governed by their historical embedding. Without institutional inertia—the chain of recognition—you have no social object, merely its corpse.

  ---

  ### Meta-Reflective Note
  (a) I would revise my assessment if empirical work demonstrated that communities consistently re-identify institutions *solely* by intrinsic formal properties (e.g., recognizing an identical, historically disconnected document as "the same constitution"), suggesting transworld identity aligns with folk ontology.  
  (b) The likeliest failure point is the analogy between physical artifacts and institutions: if ratification is merely a causal trigger (like signing a painting) rather than constitutive (like a marriage vow), then Voss’s dormancy view gains force. The coherence of "institutional inertia" hinges on whether collective recognition is an ongoing identity-sustaining act or a one-time baptism—a distinction needing finer metaphysical dissection.
