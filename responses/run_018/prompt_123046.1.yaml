  We're designing a workshop game to illustrate Nozick's entitlement theory, with a twist about hidden historical debts. The goal is for participants to experience how voluntary exchanges lead to unequal outcomes and then reveal that the wealthiest also holds the most "legacy debt" (representing unpaid historical injustices). 

  Key elements:
