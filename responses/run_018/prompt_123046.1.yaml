  Debrief (45 min): 
  - Start by asking how they felt during trading and then when they saw the legacy tokens.
  - Map to Nozick: 
     - Entitlement theory: The trades were voluntary, so the resulting distribution is just, regardless of pattern (e.g., inequality). 
     - But then the legacy tokens represent the hidden historical injustice that taints the starting points. Even if the trades are clean, the foundation might be unjust. 
     - The shock: the person who won (by the rules) also has the most legacy debt. 
  - Discuss: Does this change how they view the outcome? 
  - Link to pattern-based justice (e.g., Rawls): The pattern of inequality is problematic, especially when it's linked to historical injustice. 
  - The twist: The game shows that even if the trades are voluntary, the historical context (here simulated by the legacy tokens) might make the outcome unjust.

  What will break?
  - Predictable problems:
     1. Trading doesn't happen: Some players might hoard. Solution: Encourage trading by having a prize and maybe by providing some low-stakes reasons to trade (e.g., you bring cookies and sell them for points at the start? Or have a "bank" where they can buy special cards that give them advantages?).
