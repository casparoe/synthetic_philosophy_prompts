     - The facilitator records the trade and then secretly gives a "legacy token" to the player who received net points in that trade (if any). How many? For every trade, the net receiver of points gets one legacy token. 
     - Example: Alice gives Bob 3 points for a chocolate. Bob now has 3 more points, Alice 3 less. Bob gets one legacy token (because he gained 3 points in the trade). 
     - But note: if the trade is even (e.g., swap 2 points for 2 points) then no net transfer, so no legacy token? Or if it's a swap of goods without points? We require at least one point to be transferred? Let's say: any voluntary exchange that involves a net transfer of points from one player to another results in the receiver of the net points getting one legacy token. 
