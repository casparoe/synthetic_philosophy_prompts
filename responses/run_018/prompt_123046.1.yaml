  5. The prize isn't motivating enough? Then trading might be slow. Make the prize clear: they get to pick the reading, which is a real honor in a writers' group.

  What the game can't reproduce:
  - The claim that unjust origins void later clean titles: The game starts with equal points, which are not explicitly unjust. We are adding the legacy token as a representation of the hidden debt, but the starting point is clean. So we are actually simulating that the injustice is introduced during the trades (by the system of trade itself). 

    This is a departure from the historical injustice argument, which says that the initial appropriation might have been unjust. In the game, the initial 10 points are given equally and justly. So the injustice is in the system of trade (which silently assigns debt to the gainers). 

    How to handle? 
    - In the debrief, you'll have to explain: "In reality, the starting positions might already be unequal due to historical injustice. In our game, we started equal, but the legacy tokens represent that even in a system that starts equal, the act of trading in a system that has a hidden bias (the legacy debt) leads to the accumulation of both points and debt by the same people."

    Alternatively, we can add a historical injustice at the start? But we started equal. 

    Idea: Before the game starts, we can secretly assign a few players an extra 5 points, but also assign them a legacy token for each extra point? But that would be visible? 

    Alternatively, we can have a pre-game phase: 
    - Round 0: A small group of players (randomly chosen, say 2 out of 8) are given an extra 5 points. The facilitator secretly gives them 5 legacy tokens (one per extra point). Then we start. 
    - Now, the starting point is unequal and already has legacy debt. Then when they trade, we continue to assign legacy tokens for net gains.

    But then we have to reveal at the end that some started with extra points and legacy debt? That might work. 

    Let's adjust the rules to include historical injustice in the initial distribution:

    Revised Setup:
    - Without telling the group why, assign 2 players (randomly) 15 points and the other 6 get 10 points. 
    - For each point above the base (10), the facilitator secretly gives one legacy token to the player. So the two with 15 points get 5 legacy tokens each. 
    - Then, during trading, for every trade that results in a net transfer of points, the receiver of the net points gets one legacy token. 

    Now, at the end, the legacy tokens come from two sources: initial unfair advantage and from trades. 

    This better models: the initial injustice and then the compounding effect of trade.

  Debrief can then highlight:
  - The initial inequality (which was arbitrary) led to some having more resources to trade, which then allowed them to gain more in trades and accumulate more legacy debt? 
  - But note: the legacy debt is assigned for both the initial advantage and for each trade gain. 

  However, in the initial assignment, the debt is given to the ones who got the extra points. But in reality, the beneficiaries of historical injustice might be the ones who hold the wealth. So it matches.

  Revised Rules Summary:

  1. Setup:
     - Prepare: 
          - Points tokens (e.g., blue chips) - total points: 2*15 + 6*10 = 30+60 = 90.
          - Legacy tokens (red chips) - initially 10 (5 for each of the two players who got extra points).
          - Also, have extra legacy tokens for the trades.
     - Assign: 
          - Randomly choose 2 players to get 15 points and 5 legacy tokens (secretly, handed in an envelope? or just hand them the legacy tokens quietly and explain they are part of the game and must be kept hidden). 
          - The other 6 get 10 points and no legacy tokens initially.
     - Tell everyone: "You have some points. Your goal is to maximize your points by trading. You can trade for anything: services, goods, promises. After each trade, report to me. I will record and may give you a token. Keep any tokens I give you secret until the end. The highest point holder at the end chooses the group reading."

  2. Trading (30 min):
     - Players trade. After each trade, they report: who traded with whom and how many points were transferred from whom to whom.
     - Facilitator: 
          - Updates the point totals (publicly? or keeps a ledger? Maybe keep a public scoreboard for points only? But that might influence trading. Alternatively, let them keep their own points, but they must report to you so you can assign legacy tokens. And you can have a public scoreboard that you update periodically, say every 10 minutes).
          - For each trade, calculate the net transfer of points. 
            - Example: Alice (15) trades 3 points to Bob (10) for a chocolate. Net: Bob gains 3 points. Bob gets one legacy token (secretly).
            - Example2: Charlie (10) trades 5 points to David (15) for a pen. David gains 5 points? Actually, David is receiving 5 points so David gets one legacy token.
          - If a trade involves multiple items and points, just look at the net points change per player. Each trade is between two players. The net points flow from one to the other. The receiver of net points gets one legacy token.

  3. End of Trading:
     - Announce the point totals and who won.
     - Then ask everyone to reveal their legacy tokens. Count and announce who has the most.

  4. Reveal the Setup:
     - Tell them that two players started with extra 5 points and 5 legacy tokens. 
     - Then, during trades, every time someone gained net points in a trade, they got a legacy token.

  Debrief Questions:
  - How did you feel when you saw the initial inequality? (But note: they didn't know at the start. They only now know.)
  - How did you feel when you saw the legacy tokens? 
  - Did the person with the most points also have the most legacy tokens? Why?
