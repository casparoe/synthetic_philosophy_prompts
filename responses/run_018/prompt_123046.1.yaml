  - At the end, reveal that the person with the most points also has the most legacy debt.

  Rules and Materials:
  - Materials: 
      - Two types of tokens: "Points" (visible, used for scoring) and "Legacy Tokens" (hidden until the end). 
      - A trading area (table) and a facilitator (you) to record trades and distribute legacy tokens secretly.
  - Starting point: Each player gets 10 points (maybe represented by poker chips of one color).
  - Trading: Players can trade any number of points for anything they want (e.g., services, promises, actual small items you provide, or even just because). But note: we want trades to happen, so maybe provide some incentives for trading (e.g., a "trade bonus" for each trade?).

  However, to ensure trades happen and points become unequal, we need a payoff scheme that encourages trading. 

  Payoff Scheme:
  - The final prize: The player with the most points gets to choose the piece for the group reading (a desirable outcome for writers).
  - But we also want to encourage trading. So, we can add: 
      - Each trade must involve at least 1 point changing hands (to avoid fake trades).
      - Maybe the facilitator adds a small bonus (e.g., 1 extra point) to the total points in the system for each trade? But that might inflate the total and not create the inequality we want.

  Alternatively, we can design the starting resources to be heterogeneous in a way that encourages trade. But the problem says they start equal. So let's keep it simple: they start with the same points, but they have different preferences or we introduce some randomness.

  How about: 
  - At the start, each player gets a random "resource card" (e.g., a card that says "You have a talent for dialogue" or "You have a beautiful pen") that they can use to trade for points? But that might complicate.

