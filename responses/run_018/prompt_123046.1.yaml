  But to ensure trading happens, we can have structured rounds:

  Structure:
  1. Introduction (5 min): Explain the rules. Everyone starts with 10 points. They can trade points for anything they want (as long as both agree). The goal is to have as many points as possible at the end because the highest scorer chooses the reading. 
  2. Trading Rounds (30 min, 3 rounds of 10 min each?): 
     - In each round, players are free to move and trade. 
