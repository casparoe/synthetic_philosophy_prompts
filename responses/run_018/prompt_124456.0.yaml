  First, I need to define both concepts clearly. Indexical conventions are local rules tied to social context—like tipping percentages in different countries. Their authority comes from where you are socially, not universal morals. Categorical obligations, on the other hand, are universal duties like not killing or stealing, based on moral principles that apply everywhere.

  Now, applying this to the examples: Tipping varies a lot. In the US, it's expected because servers rely on tips for wages, but in Japan, it might be insulting. So, is it moral to tip in the US? Maybe, because it prevents harm to workers who depend on tips. Queueing is about fairness and efficiency. Cutting in line violates fairness, which has a moral dimension, even if the rule is local. Jaywalking is trickier. If crossing against the light disrupts traffic or endangers others, it could be immoral, but if it's safe and the norm elsewhere, maybe not.

  The core issue is whether these conventions create moral obligations for visitors. The user seems interested in whether outsiders are morally bound or just being prudent. They might be thinking about cultural relativism versus universal morals. Also, they probably want a clear stance, not a vague answer.

