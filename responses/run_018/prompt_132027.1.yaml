  ### Unified Principle: Definite Comprehension via Well-Founded Definitions

  The settled verdicts can be unified under the principle of **Definite Comprehension via Well-Founded Definitions**, grounded in avoiding impredicativity and ensuring definitions are well-founded relative to the set-theoretic hierarchy. This principle states:

  > A collection defined by a formula \(\varphi(x)\) is **legitimate** if and only if \(\varphi(x)\) is a first-order formula in the language of set theory (with parameters allowed) and, for every set \(x\), the truth of \(\varphi(x)\) depends only on sets that appear in the transitive closure of \(x\) or at an earlier stage of the cumulative hierarchy. Formally, \(\varphi(x)\) must be absolute for transitive models containing the transitive closure of \(x\), and it must not quantify over the entire universe of sets or the collection being defined.

  #### Key Aspects:
  1. **No Universal Quantification**: The formula \(\varphi(x)\) cannot have unbounded quantifiers over all sets (e.g., \(\forall y\) or \(\exists y\) without restricting \(y\) to a set definable from \(x\)).
  2. **Well-Founded Dependence**: The condition \(\varphi(x)\) relies only on sets built before \(x\) in the cumulative hierarchy (i.e., sets in the transitive closure of \(x\) or lower ranks).
  3. **Absence of Self-Reference**: The formula avoids circular reference to the collection it defines (no impredicativity).

  This principle aligns with the iterative conception of set theory (e.g., ZF), where sets are built in stages, and comprehension is restricted to avoid self-referential paradoxes.

