prompt: |-
  I'm defending a synthetic thesis about the "middle-layer" perpetrators of the Holocaust—specifically, the Reichsbahn scheduling and logistics bureaucrats who coordinated deportation timetables without direct physical violence—at an interdisciplinary seminar next week. My claim is that the standard Browning-Goldhagen dichotomy (situational conformity versus culturally ingrained eliminationist antisemitism) collapses at this bureaucratic layer, because these actors exhibit a dynamically stabilized professional identity that is neither pure situational adaptation nor deep ideological conviction. Instead, I argue that character operates here as a scaffolded disposition: organizational role expectations provide the cultural framing, but individual agents actively stabilize these roles through routine competence and moral distancing, creating a hybrid that is more durable than Browning's peer-pressure model but less ideologically driven than Goldhagen's thesis requires.

  The audience is precisely composed of: eight quantitative social historians who treat psychological variables as confounds to be controlled away; two moral psychologists committed to situationist explanations of perpetrator behavior; one Holocaust historian who regards Goldhagen's argument as empirically overstated but culturally necessary; and a philosopher of history concerned about methodological individualism in explanatory narratives.

  Prepare my Q&A defense sheet. Order the objections by how damaging they are to this specific synthetic claim in front of this specific audience—not generic objections to Browning or Goldhagen, but the ones that target the scaffolded professional identity framing applied to middle-layer bureaucrats. For each objection, phrase it exactly as that sub-audience would put it (use the vocabulary of social history, moral psychology, Holocaust historiography, and philosophy of history respectively). Note which objections have real empirical or conceptual force, what I should concede up front to preserve credibility, and provide a concise reply that can be delivered in about two minutes. Identify the one reply that must land for the proposal to survive, and flag where each reply is weakest. Finally, include the single question I am hoping nobody asks, with a brief note on why it is fatal and how to deflect without appearing evasive.
