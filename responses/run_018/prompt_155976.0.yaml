answer: |-
  Here’s your Q&A prep sheet, structured by likely question order and critic. Each reply is calibrated for a 2-minute response, with weaknesses flagged.  

  ---

  ### **1. Traditional Archivist #1 (Neutrality Defender)**  
  **Question:** *"Your framework implies archivists are complicit in erasure. Doesn’t this undermine our ethical commitment to neutrality by injecting present-day politics into past decisions?"*  
  **Reply:**  
  "Neutrality requires transparency about *how* neutrality was constructed. When an intake sheet omits ‘seasonal labor’ as an option, that’s not apolitical—it’s a policy choice masquerading as default. Negative provenance tracking *strengthens* neutrality by documenting the scaffolding of decisions, so future researchers can see *why* gaps exist. It doesn’t judge past archivists; it reveals systemic constraints."  
  **Weakness:** Doesn’t fully reconcile how "documenting bias" avoids being seen as its own bias.  

  ---

  ### **2. Traditional Archivist #2 (Practicality Focus)**  
  **Question:** *"This sounds like retrospective second-guessing. How can we apply modern standards to historical workflows without anachronism?"*  
  **Reply:**  
  "We’re not judging decisions by today’s standards—we’re exposing the *original* limitations of the taxonomy itself. The 1980s intake sheet had no field for farmwork; that’s a period-specific structural omission. Negative provenance would’ve captured that design flaw *contemporaneously*. It’s about recording the ‘why’ of absence at the point of creation, not retrofitting critique."  
  **Weakness:** Requires admitting past systems were flawed—risks alienating traditionalists invested in legacy practices.  

  ---

  ### **3. Feminist Historian (Institutional Agency Skeptic)**  
  **Question:** *"You rightly critique taxonomies, but isn’t this over-attributing power to institutions? Absences arise from resource limits and societal blind spots too."*  
  **Reply:**  
  "Absolutely—individual archivists didn’t *intend* erasure. But institutions codify blind spots into taxonomy. When ‘domestic/unemployed’ were the only options for migrant workers, that wasn’t a resourcing issue; it was categorical violence. Negative provenance tracks *how* institutional tools (like dropdown menus) enforce silence. It complements your point: by documenting systemic pressures, we show how societal gaps become archival absences."  
  **Weakness:** Could push harder on institutional culpability; risks sounding concessive.  

  ---

  ### **4. Digital Humanities Scholar (Metadata Stickler)**  
  **Question:** *"How would ‘negative provenance’ work technically? Won’t documenting every exclusion decision explode metadata complexity?"*  
  **Reply:**  
  "Great question. We’d embed it in existing workflows:  
  - **At intake:** A mandatory ‘exclusion rationale’ field (e.g., ‘Category unavailable: seasonal labor’).  
  - **In schemas:** A new `<decision_path>` tag in EAD or schema.org, logging taxonomies *not* used.  
  It’s lightweight—like version control’s ‘commit messages’ for archival gaps. The DH win? Richer data for algorithmic bias audits later."  
  **Weakness:** Still adds labor; requires buy-in from legacy systems.  

  ---

  ### **5. Traditional Archivist #3 (Authority Concern)**  
  **Question:** *"Won’t this destabilize trust in archives? If we highlight absences, researchers might dismiss holdings as ‘flawed’ rather than engaging them."*  
  **Reply:**  
  "Transparency *builds* trust. Researchers already know archives are partial—they find gaps and lose confidence when we don’t contextualize them. Negative provenance turns silence into usable data. Imagine a historian finding ‘unemployed’ farmworkers: with decision logs, they can trace it to taxonomy limits rather than assuming faulty records."  
  **Weakness:** Assumes researchers want this; traditionalists may fear enabling "cherry-picking" critics.  

  ---

  ### **The "Pray Nobody Asks" Question**  
  **Question:** *"If your system existed in the 80s, what would stop archivists from just clicking ‘no applicable category’ without critical thought—recreating the same silence with extra steps?"*  
  **Reply (Grit Your Teeth):**  
  "Human judgment is always a variable. But by *requiring* a rationale field (even a dropdown of exclusion reasons), we institutionalize reflexivity. It shifts culture: if the form *demands* you declare why something’s excluded, you can’t default to invisibility. Will some click mindlessly? Sure. But it creates accountability trails we lack now."  
  **Weakness:** Admits the system isn’t foolproof—banks on institutional willpower.  

  ---

  ### **Strategic Notes**  
  - **Order Logic:** Traditionalists first (they’re loudest), historian as bridge, DH as solvable "how".  
  - **Tone:** Avoid "archival violence" rhetoric with traditionalists; use "systemic constraints" or "categorical gaps".  
  - **Weakness Leverage:** Where replies are shaky, pivot to *"That’s why this is a *practice*, not a dogma—we refine it together"* to invite collaboration.  

  You’ve got this. They’ll push back because your thesis *matters*. If the feminist historian smiles when you say "categorical violence," you’re winning. Break legs Thursday. 🔥
