prompt: |-
  You are a philosopher of law with training in formal logic and institutional analysis. Before giving your diagnosis, take a few moments to map the positions precisely, list the hidden premises each side might be relying on, and consider whether they are answering the same question. Think step by step, and be explicit about where your reasoning depends on conceptual distinctions rather than empirical claims.

  In both legal theory and recent work on autonomous-system governance, a debate about self-amending rules has stalled for decades without meaningful movement. On one side stand hierarchical formalists, who accept the derivation—associated with Alf Ross—that a rule governing its own amendment generates an infinite regress of meta-rules unless authority is strictly stratified by level. They therefore treat any apparent self-amendment, whether in constitutional amendment procedures or in digital governance charters that authorize a board to revise its own revision protocol, as either logically incoherent or as concealed delegation to an unstated higher-order norm. On the other side stand practice-based institutionalists, who observe that functioning legal systems do revise their amendment mechanisms through constituent assemblies, referendum processes, or version-controlled charter updates, and who conclude that the formal model misdescribes legal authority by conflating a rule as an enduring type with successive rule-tokens, or by ignoring the temporal and role-based indexing built into institutional practice.

  What makes the stall particularly frustrating is that both sides agree on the formal structure of the paradox, both agree that real and simulated institutions do in fact alter their own procedures, and neither side denies that logical consistency is a virtue. Yet the formalists continue to insist that the practice is conceptually confused, while the institutionalists continue to insist that the formal derivation is descriptively irrelevant and that versioning resolves the difficulty.

  Your task is to diagnose the disagreement rather than adjudicate it. Is this primarily a hidden factual dispute about how courts or governance boards actually reason when they authorize revisions? A difference in standards of evidence, where logical possibility counts as decisive for one side and institutional stability for the other? Are the sides answering different questions under the single label self-amendment—for instance, one asking about logical form and the other about legitimate authority—such that they are not genuinely contradicting each other? Or is there a deeper, bedrock divergence about whether legal norms are essentially type-level entities or essentially token-level practices, one that neither side can argue for from shared premises? Might a hidden distinction—such as that between amending the content of a rule and amending the power-conferring norm that authorizes change—do all the work, with one side implicitly accepting it and the other rejecting it?

  Given your diagnosis, specify what kind of progress could break the impasse: a formal result that distinguishes amendment of authority from amendment of substance; a conceptual clarification that both sides could accept; an empirical study of institutional reasoning; a reformulation that shows the question is ill-posed; or an argument that no progress should be expected and why. Be concrete: show exactly where in the exchange your diagnosis applies, identify any case where it leaves the disagreement intact, and flag whether the impasse is a sign that the underlying question needs to be dissolved rather than solved.
