answer: |-
  ## Formal Procedure: Assessment of Unrealistic Assumptions in Hydrological-Agricultural Forecasting Models  
  *For Use by Regional Advisory Board*  

  **Preamble:** This procedure distinguishes *computational fictions* (unrealistic elements serving as permissible algorithmic tools without corrupting policy-critical predictions) from *representational distortions* (unrealistic elements that falsely depict causal relationships, undermining prediction reliability). Grounded in instrumentalist and realist philosophical critiques, it prioritizes predictive robustness and causal fidelity for specific policy contexts.  

  ---

  ### Core Definitions  
  1. **Computational Fiction (Acceptable Idealization):**  
     An assumption simplifying calculation or model structure that:  
     - Does not alter the direction or policy-critical magnitude of key output variables within the model's domain of application.  
     - Preserves the causal pathways linking inputs to policy-relevant outputs.  

  2. **Representational Distortion (Problematic Misrepresentation):**  
     An assumption that:  
     - Falsifies causal relationships materially affecting policy-relevant predictions.  
     - Introduces systematic bias beyond acceptable error margins for the decision context.  
     - Obscures critical contingencies (e.g., thresholds, feedback loops) relevant to policy outcomes.  

  ---

  ### Step-by-Step Assessment Procedure  

  #### Step 1: Identify Target Prediction & Policy Stakes  
     *Question:* What specific prediction(s) does this model generate for watershed policy (e.g., flood peak timing, crop failure probability)? What are the consequences of prediction error?  
     *Sufficiency:* Clear linkage between model output and a pending regulatory, infrastructural, or agricultural intervention.  
     *Stop if:* Prediction is decoupled from policy action → **Reject model scope.**  

  #### Step 2: Map Causal Structure  
     *Question:* Diagram the primary causal pathways from model inputs (e.g., rainfall, land use) to the target prediction, noting variables the unrealistic assumption directly affects.  
     *Sufficiency:* Identification of ≥3 critical causal links intersecting the assumption.  
     *Stop if:* Assumption lies outside all pathways to target prediction → **Flag as computational fiction; no further review.**  

  #### Step 3: Test Domain Restriction  
     *Question:* Is the assumption’s unrealistic nature explicitly bounded to contexts where it is known *not* to alter outputs materially (e.g., "uniform permeability valid only for slopes <5°")?  
     *Sufficiency:* Empirical or theoretical justification that distortion is negligible within defined operational bounds.  
     *Stop if:* Domain restriction is empirically robust for target prediction → **Accept as computational fiction with monitoring clause.**  

  #### Step 4: Evaluate Causal Fidelity  
     *Question:* Does the assumption misrepresent a *causal driver* (e.g., farmer decisions altering water demand) or merely a *descriptive detail* (e.g., abstract soil categorization)?  
     *Criteria for Distortion:*  
     - If the assumption modifies feedback sign (e.g., positive vs. negative), sensitivity thresholds, or agent-response logic → **Likely representational distortion.**  
     - If it simplifies measurement without altering functional relationships → **Likely computational fiction.**  
     *Stop if:* Distortion confirmed → **Flag for revision or rejection.**  

  #### Step 5: Stress-Test Predictive Robustness  
     *Question:* When historical or synthetic data violating the assumption is input, does prediction error for the target variable exceed acceptable policy risk?  
     *Sufficiency:* Sensitivity analysis showing error margins within tolerances defined in Step 1.  
     *Stop if:* Error exceeds tolerance → **Representational distortion; revise model.**  
     *Stop if:* Error within tolerance → **Accept as computational fiction.**  

  #### Step 6: Conflict Resolution & Escalation  
     *Where judgment is required:*  
     - If predictive success conflicts with causal inaccuracy (e.g., high short-term accuracy despite structural distortion), escalate to board vote.  
     - If policy stakes involve high-impact/low-probability risks (e.g., dam failure), default to conservative rejection of distortions.  
     *Output:* **Conditional approval** (with recalibration triggers) or **Reject.**  

  ---

  ### Worked Applications  

  #### Case (a): Uniform Soil Permeability in Flood-Runoff Model  
  1. **Target Prediction:** Peak flood discharge at watershed outlet.  
  2. **Causal Structure:** Permeability affects infiltration → alters surface runoff volume → changes discharge.  
  3. **Domain Restriction:** Claimed valid for "homogeneous sedimentary basins." *Test:* Sensitivity analysis shows discharge error <5% in target basins → **Computational fiction.**  
  4. **If applied to fractured bedrock terrain:** Error >25% → **Representational distortion.**  

  #### Case (b): Perfect-Information Rational Farmers in Irrigation-Demand Model  
  1. **Target Prediction:** Seasonal groundwater depletion.  
  2. **Causal Structure:** Farmer choices → irrigation volume → aquifer drawdown.  
  3. **Causal Fidelity:** Assumption removes adaptive behavior (e.g., water conservation during droughts). Historical data shows underestimation of demand volatility by 40% → **Representational distortion.**  

  #### Case (c): Linearized Climate Feedback for 5-Year Projections  
  1. **Target Prediction:** Average summer reservoir levels.  
  2. **Domain Restriction:** Justified by "short-term dominance of linear atmospheric dynamics."  
  3. **Stress-Test:** Inject nonlinear perturbations (e.g., heatwave-induced evaporation spikes). Output error <3% at 5 years, but >20% at 7 years → **Conditional approval as computational fiction** with mandatory revalidation if projection horizon extends beyond 5 years.  

  ---

  ### Limitations & Failure Modes  
  1. **Masked Judgments:**  
     - Step 3 (Domain Restriction) relies on modelers’ empirical claims; adversarial review of supporting data is essential.  
     - Step 5 (Error Tolerance) embeds policy risk preferences; boards must declare acceptable error *before* assessment.  

  2. **Where Procedure Misfires:**  
     - Novel systems with no validation data (e.g., unprecedented land-use changes).  
     - Assumptions distorting emergent properties (e.g., market collapses) not captured in linear sensitivity tests.  

  3. **High-Stakes Triggers for Conservatism:**  
     Apply rejection default if:  
     - Prediction involves irreversible outcomes (e.g., species extinction).  
     - Distortion affects tail-probability events (e.g., 100-year floods).  
     - Model lacks error-correction mechanisms (e.g., data assimilation).  

  **Procedure Certification:** Adopted models require reassessment if: (1) policy question changes, (2) new data contradicts domain restrictions, or (3) runtime exceeds validated temporal/spatial scope.  

  ---  
  *Board Implementation Note:* This procedure systematizes philosophical trade-offs but cannot eliminate expert deliberation. Document rationales at each step to audit decisions.
