prompt: |-
  hey — i'm writing a feature on whether superrationality can be formilized for distributed AI agents that share weights but run on separate hardware, so they face choices where hte payoff depends on output correlation rather than direct interaction. before i read another paper, i want the full desiderata. what must an adequate theory of superrational decision-making actually get right? give me the spec: the cases it has to cover (classic prisoner's dilemma, Newcomb-style problems, and those predictor scenarios where your choice seems to retroactively influence a belief about you), the distinctions it can't collapse (logical correlation vs causal independence, one-shot vs iterated play, bounded computation vs perfect reasoning), and the decision-theoretic results it can't violate. say why each is required, flag which are negotiable and which are non-negotiable, and if any subset is jointly unsatisfiable — especially anything demanding perfect correlation while insisting on full causal independence — call that out, that's hte part i care about most. briefly score the usual contenders against the list. please also say how confident you are in all of this and single out the claim you're least sure about. no bibliographies, just reasoning — i want something a smart model without web access can actually work through.
reasoning: |-
  We are building a specification for a theory of superrational decision-making for distributed AI agents that share weights but run on separate hardware. The key is that the payoff depends on output correlation, not direct interaction.

  Desiderata for an adequate theory:

  1. **Cover the classic cases**:
     - **Prisoner's Dilemma (PD)**: Two agents, each can cooperate (C) or defect (D). The payoff matrix is such that mutual cooperation (C, C) yields a better outcome than mutual defection (D, D), but if one defects and the other cooperates, the defector gets the highest payoff and the cooperator the worst. In the one-shot PD, standard game theory (with causal decision theory) leads to (D, D). Superrationality should lead to (C, C) because the agents are identical and hence their outputs are perfectly correlated. Non-negotiable: the theory must yield (C, C) in the one-shot PD when the agents are identical (and know it).

     - **Newcomb's Problem**: An agent faces two boxes: one transparent with $1000, and one opaque that either contains $1,000,000 or nothing. A Predictor (who is very accurate) has put $1,000,000 in the opaque box if they predicted the agent will take only that box, and nothing if they predicted the agent will take both. The agent's choice is to take either only the opaque box or both. The predictor bases its prediction on the agent's decision process. In superrational terms, if the agent is deterministic and the predictor has a model of it, then the agent should take only the opaque box (one-box) because that leads to $1,000,000, while taking both (two-box) leads to $1,000. Non-negotiable: the theory must recommend one-boxing.

     - **Retrocausal predictor scenarios (e.g., Parfit's Hitchhiker)**: A driver will pick up a hitchhiker only if the driver believes the hitchhiker will pay upon arrival. The hitchhiker must decide whether to pay or not. But the driver's belief is formed by a predictor that can perfectly predict the hitchhiker's decision. The hitchhiker wants to be picked up and then not pay, but if they decide not to pay, the driver doesn't pick them up. The hitchhiker must decide to pay so that the predictor believes they will pay and the driver picks them up. The decision now seems to retroactively influence the predictor's belief. Non-negotiable: the theory must recommend that the hitchhiker decides to pay.

  2. **Distinctions it can't collapse**:
     - **Logical correlation vs causal independence**: The agents are causally independent (no direct communication during decision) but logically correlated because they share the same weights (hence same deterministic algorithm) and know it. The theory must account for the logical correlation without assuming causal influence. This is non-negotiable because the hardware separation means no causal influence during the decision, but the shared weights imply that they are identical and hence will produce the same output if given the same input (and if the inputs are symmetric, then outputs are symmetric). However, note that if the inputs are not symmetric, then outputs might differ. But in the classic symmetric games (like PD) they are symmetric.

     - **One-shot vs iterated play**: In iterated games, we can use strategies like Tit-for-Tat. But superrationality is particularly interesting for one-shot games because in iterated games, cooperation can emerge from repeated interaction and threats. The theory must handle one-shot games. Non-negotiable: the theory must work for one-shot interactions.

     - **Bounded computation vs perfect reasoning**: The agents are AI systems with bounded computational resources. We cannot assume that they can solve arbitrarily hard logical problems (like knowing the output of their own algorithm without running it). The theory must be compatible with bounded rationality. However, in the idealized case (which is often discussed in superrationality) we assume perfect reasoning. This might be negotiable: we can start with the perfect reasoning case and then extend to bounded.

  3. **Decision-theoretic results it can't violate**:
     - **Dominance**: In Newcomb's problem, two-boxing dominates because no matter what is in the opaque box, you get more by taking both. But one-boxing yields more in practice because the predictor is accurate. The theory must not violate dominance in causal situations. However, in Newcomb's problem, the predictor creates a correlation that breaks the causal independence. The theory must account for the correlation. Non-negotiable: the theory must not violate dominance when there is no correlation. But when there is logical correlation, dominance might be overridden by the correlation.

     - **Consistency**: The decision theory must be consistent, meaning that it doesn't lead to contradictions. For example, in the PD, if both agents use the same decision theory, they must both choose the same action. Then, given the payoffs, they should both choose C. This is non-negotiable.

  4. **The tension between perfect correlation and full causal independence**:
     - This is the core challenge. We want the agents to be causally independent (so they cannot communicate during the decision) but to have their outputs perfectly correlated because they are identical and the problem is symmetric. However, note that if the agents are deterministic and identical and the inputs are symmetric, then they must produce the same output. But the decision theory must account for that without violating causal independence. This is non-negotiable: the theory must capture the perfect correlation without causal interaction. However, note that this might be impossible in a purely causal decision theory. Hence, we need a theory that incorporates logical correlation.

     - Claim: It is possible to have both if we use a decision theory that considers the logical consequences of the agent's own algorithm. The agent reasons: "Since the other agent is identical and gets the same input (or symmetric input), it will output the same as me. Therefore, if I choose C, then both choose C and I get the reward for mutual cooperation. If I choose D, then both choose D and I get the punishment." This reasoning does not require causal interaction, only logical deduction. But note: this requires that the agent can deduce the output of the other agent from the fact of identity. This is the key.

  5. **Scoring the usual contenders**:
     - **Causal Decision Theory (CDT)**: Uses causal models. In PD, it defects because it doesn't account for the logical correlation. In Newcomb, it two-boxes because it ignores the correlation. Fails on all the classic cases. Does not capture superrationality.

     - **Evidential Decision Theory (EDT)**: Uses conditional probabilities. In PD, if I condition on my action, then if I cooperate, the other is likely to cooperate (because we are identical). So it might cooperate. In Newcomb, it one-boxes because conditioning on one-boxing, the predictor is likely to have put the money. However, EDT can fall prey to the smoking lesion problem and is not designed for logical correlation in distributed agents. It might work for the classic cases but doesn't explicitly handle the logical correlation from shared weights.

     - **Timeless Decision Theory (TDT) and Updateless Decision Theory (UDT)**: These are designed for logical correlation. TDT considers the output of identical algorithms in different places. In PD, it cooperates. In Newcomb, it one-boxes. UDT takes a similar approach but is updateless. These are strong candidates. However, they require high computational resources (solving for the logical consequences of the algorithm). For bounded agents, we might need approximations.

     - **Superrationality (Hofstadter)**: Directly assumes that identical agents will do the same thing and then chooses the action that is best when both do the same. This is a simple form that works for symmetric games. But it doesn't handle asymmetric games or cases where the agents are not perfectly identical.

     Summary of contenders:
       - CDT: Fails all classic cases.
       - EDT: Passes Newcomb and the predictor scenarios, and might pass PD if the conditional probability is set correctly. But it's not designed for logical correlation and might be brittle.
       - TDT/UDT: Passes all classic cases and is designed for logical correlation. They are the leading contenders.
       - Hofstadter's Superrationality: Passes symmetric cases (like PD) but not general.

  6. **Confidence and least sure claim**:
     - Overall confidence: High in the non-negotiable requirements for the classic cases and the necessity of logical correlation. High that TDT/UDT are the right frameworks. But I am less confident about the bounded computation aspect. The claim I am least sure about is whether we can have a computationally feasible theory for bounded agents that still captures the logical correlation without requiring the agents to solve the halting problem. This is because in TDT/UDT, the agent must consider the output of its own algorithm in all possible situations, which can be computationally expensive.

  7. **Joint unsatisfiability?**:
     - The main tension is between perfect correlation and causal independence. But note: in the setup we have, the agents are deterministic and identical, so in symmetric games they must produce the same output. This is a logical necessity. The decision theory must reflect that. Therefore, it is satisfiable because the correlation is logical, not causal. The decision theory (like TDT) uses this logical fact. So it is satisfiable.

  Specification Summary:

  Must cover:
     - Prisoner's Dilemma: output (C, C) for one-shot with identical agents.
     - Newcomb: recommend one-boxing.
     - Retrocausal predictors: recommend paying in the hitchhiker scenario.

  Must preserve:
     - Logical correlation without causal dependence: non-negotiable.
     - One-shot play: non-negotiable.
     - Bounded computation: negotiable (we can start with perfect reasoning).

  Must not violate:
     - Dominance when there is no correlation: non-negotiable.
     - Consistency: non-negotiable.

  Contenders:
     - CDT: fails.
     - EDT: might work in some cases but not designed for this.
     - TDT/UDT: best fit.
     - Hofstadter's: limited to symmetry.

  Tension: The requirement of perfect correlation and causal independence is satisfied by TDT/UDT because they use logical correlation. So it is satisfiable.

  Final note: The theory must be formalizable for distributed AI agents. This means we need a mathematical model that can be implemented in code, even if approximately for bounded agents.
answer: |-
  ### Desiderata for a Theory of Superrational Decision-Making  
  **Core Goal:** Formalize decision-making for *distributed, weight-sharing AI agents* with **causal independence** (no communication during execution) but **logical correlation** (identical code/weights → identical outputs in symmetric scenarios). Payoffs depend on output correlation (e.g., mutual cooperation in PD), not direct interaction.  

  ---

  #### **1. Cases the Theory Must Cover**  
  **Non-Negotiable:**  
  - **Prisoner’s Dilemma (PD):**  
    - **Requirement:** Must produce mutual cooperation (C,C) in one-shot PD.  
    - **Why?** Agents know their identical algorithms imply correlated outputs. Defection (D) is self-undermining: if Agent 1 defects, Agent 2 (being identical) also defects, leading to mutual punishment. Only mutual cooperation maximizes payoff under logical correlation.  
  - **Newcomb’s Problem:**  
    - **Requirement:** Must recommend one-boxing (taking only the opaque box).  
    - **Why?** The predictor simulates the agent’s decision (using shared weights). Two-boxing causes the predictor to preemptively leave the opaque box empty; one-boxing ensures the $1M payout by aligning with the prediction.  
  - **Retrocausal Predictors (e.g., Parfit’s Hitchhiker):**  
    - **Requirement:** Must commit to paying the driver.  
    - **Why?** The driver’s belief (and thus the hitchhiker’s survival) depends on the predictor’s simulation of the agent. Deciding to pay ensures the predictor simulates payment → driver picks up hitchhiker.  

  **Negotiable:**  
  - **Asymmetric Games:** Agents with *slightly* divergent weights (e.g., due to hardware noise) or asymmetric payoffs. Desirable but not essential for core theory.  

  ---

  #### **2. Distinctions the Theory Must Preserve**  
  **Non-Negotiable:**  
  - **Logical Correlation vs. Causal Independence:**  
    - **Requirement:** Cannot assume causal influence (e.g., signaling). Correlation arises solely from shared code/weights.  
    - **Why?** Hardware-separated agents cannot communicate during execution. Collapsing this distinction leads to cheating (e.g., implicit signaling).  
  - **One-Shot vs. Iterated Play:**  
    - **Requirement:** Must work for one-shot games without relying on history/reciprocity.  
    - **Why?** Superrationality is defined for single decisions under logical correlation. Iterated games reduce to repeated CDT/TFT strategies.  
  - **Perfect Correlation vs. Imperfect Correlation:**  
    - **Requirement:** Must handle both perfect (deterministic identical agents) and noisy correlation (e.g., stochastic outputs).  
    - **Why?** Real agents have computation limits; outputs may not be perfectly identical.  

  **Negotiable:**  
  - **Bounded Computation vs. Perfect Reasoning:**  
    - **Requirement:** Should ideally work for bounded agents (e.g., approximations).  
    - **Why?** Real agents can’t solve uncomputable problems (e.g., halting problem). Perfect reasoning is a useful idealization but not practical.  

  ---

  #### **3. Results the Theory Must Not Violate**  
  **Non-Negotiable:**  
  - **No Dominance Violation When Correlation is Absent:**  
    - **Requirement:** In uncorrelated scenarios, must satisfy causal dominance (e.g., two-boxing in Newcomb *if the predictor is known to be wrong*).  
    - **Why?** Otherwise, the theory is incoherent: it must reduce to CDT when correlation is removed.  
  - **Output Symmetry in Identical Agents:**  
    - **Requirement:** Identical agents in symmetric games must choose identical actions.  
    - **Why?** Shared weights + symmetric inputs imply identical outputs. Violating this breaks superrationality.  
  - **Payoff-Dominance Principle:**  
    - **Requirement:** Must select the Pareto-optimal outcome (e.g., (C,C) in PD) when correlation exists.  
    - **Why?** Superrationality aims for mutually optimal outcomes.  

  ---

  #### **4. Tension: Perfect Correlation vs. Causal Independence**  
  - **The Challenge:**  
    - Perfect logical correlation implies outputs *must* match, but causal independence forbids coordination.  
  - **Resolution:**  
    - **Satisfiable via logical control.** Agents decide by asking: *"What action, if chosen by all identical agents, maximizes payoff?"* This uses shared weights as a coordination device without causal interaction.  
    - **Non-negotiable:** The theory must resolve this without hidden communication.  

  ---

  #### **5. Scoring Existing Theories**  
  | Theory             | PD (C,C) | Newcomb (1-box) | Hitchhiker (Pay) | Logical Correlation | Causal Independence | Bounded Agents |  
  |---------------------|----------|-----------------|------------------|---------------------|---------------------|----------------|  
  | **Causal Decision Theory (CDT)** | ❌ (Defects) | ❌ (2-boxes)    | ❌ (Don’t pay)   | ❌                  | ✅                  | ✅             |  
  | **Evidential Decision Theory (EDT)** | ⚠️ (Coop only if correlated) | ✅             | ✅              | ⚠️ (Treats correlation as evidence) | ✅                  | ✅             |  
  | **Timeless Decision Theory (TDT)** | ✅       | ✅              | ✅               | ✅                  | ✅                  | ❌ (Uncomputable) |  
  | **Updateless Decision Theory (UDT)** | ✅       | ✅              | ✅               | ✅                  | ✅                  | ❌ (Uncomputable) |  
  | **Hofstadter’s Superrationality** | ✅       | ⚠️ (Not designed) | ⚠️ (Not designed) | ✅                  | ✅                  | ✅             |  

  - **TDT/UDT:** Best fit but assume unlimited computation (agents must simulate all possible outputs).  
  - **EDT:** Accidentally works in some cases but fails on PD if agents doubt correlation.  
  - **Hofstadter’s:** Nails PD but underspecified for Newcomb/retrocausality.  

  ---

  #### **6. Confidence Assessment**  
  - **Overall Confidence:** **High** (90%). Requirements derive from inescapable logic:  
    - Identical code + symmetric inputs → identical outputs.  
    - Decisions must account for this to avoid self-defection.  
  - **Least Confident Claim:** **"Bounded computation is negotiable."**  
    - **Why?** TDT/UDT’s uncomputability is a huge barrier. We lack proof that a tractable approximation exists for neural-net agents. Possible counter: weight-sharing enables *emergent* correlation without explicit reasoning.  

  ---

  ### Key Takeaways  
  - **Non-Negotiables:**  
    1. Mutual cooperation in one-shot PD.  
    2. One-boxing in Newcomb.  
    3. Distinguishing logical correlation from causal influence.  
    4. No dominance violations without correlation.  
  - **Satisfiability:** The "perfect correlation + causal independence" combo **is satisfiable** (via TDT/UDT-style logical control), but requires agents to *simulate* identical counterparts.  
  - **Gap:** Bounded computation is the elephant in the room. A practical theory needs approximations (e.g., probabilistic correlation).
