  You are a professional philosopher specializing in bioethics, philosophy of personal identity, and practical reasoning. Before drafting, spend a few minutes brainstorming: list points on which defenders of diachronic autonomy and defenders of present-self sovereignty genuinely agree; identify precise formulations of residual disagreement such that each camp would accept the wording describing its own view; and isolate the cruxes—sub-questions whose resolution would move at least one party.

  Then draft the joint statement that a diachronic-autonomy preservationist camp and a present-subject-sovereignty camp could both sign after a good-faith adversarial collaboration on the authority of the earlier self in advance directives. The collaboration should specifically address the intermediate problem of partial evaluative continuity—where a patient retains narrative identity but has undergone stable value change—and should distinguish predictive authority (what the earlier self would want now, given new information) from prescriptive authority (what the earlier self commanded regardless of changed circumstances).

  Format the deliverable as follows:

  1. A numbered section of agreed claims. These must be substantive, not vacuous: include shared commitments about the legal and moral function of advance directives, the fact that psychological continuity comes in degrees, the specific conditions that generate conflict between a directive and present expressed preferences, and the conceptual distinction between predictive and prescriptive authority. Do not include claims that remain genuinely contested among knowledgeable practitioners.

  2. A disagreements table. For each disagreement, provide: (a) a neutral formulation of the issue; (b) the precise statement of Camp A's (diachronic-autonomy preservationist) position in wording Camp A would accept; (c) the precise statement of Camp B's (present-subject-sovereignty) position in wording Camp B would accept. At least one row must address whether partial psychological continuity combined with stable value change undermines the binding force of a prior directive.

  3. A cruxes section. Identify at least two cruxes—sub-questions such that settling them would change at least one side's position. I suspect one concerns whether narrative continuity alone is sufficient for diachronic moral authority, and another concerns whether the etiology of value change (disease-induced versus authentic revision) affects the legitimacy of honoring the directive. For each crux, present a concrete case or argument that both sides agree bears on it, and record each side's explicit prediction about what that case shows. Use this case: a patient with progressive neurocognitive decline retains autobiographical memory and family recognition but expresses a consistent, stable preference for comfort-focused care that contradicts her prior directive demanding aggressive life-prolonging intervention. Both sides should agree this case is relevant; then state exactly what Camp A predicts it demonstrates and what Camp B predicts it demonstrates.

  Throughout the response, clearly separate what is settled among specialists in bioethics and philosophy of personal identity from what is genuinely contested; do not present a contested philosophical position as if it were the consensus view. Avoid bibliographies, reading lists, or citations—the reasoning should stand on its own. Do not use verbatim quotations from any text; paraphrase in your own words if referencing a specific view. Think carefully about where the disagreement is genuinely substantive and where it risks being merely verbal, and flag any part you judge to be verbal rather than substantive, explaining why.
