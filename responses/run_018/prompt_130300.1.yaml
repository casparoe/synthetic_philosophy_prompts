answer: |-
  Here's the ranking from most to least locked-in by path dependence, with a one-sentence rationale for each:

  1.  **TCP/IP as the network standard:** Billions of interconnected devices, foundational protocols, and decades of infrastructure investment create astronomical switching costs with no single entity able to force a change.
  2.  **The QWERTY layout:** Massive global user base, deeply ingrained muscle memory, ubiquitous hardware compatibility, and minimal *perceived* productivity gain for individuals switching make coordinated change impractical.
  3.  **Python being the default for ML:** While deeply entrenched via vast libraries (NumPy, PyTorch, TensorFlow), tools, and community knowledge, its interpreted nature and performance limitations *could* allow a faster, more efficient language (e.g., Mojo, Rust) to gradually gain share if it seamlessly integrates with the existing Python ecosystem.
  4.  **RLHF being the main way we align language models:** Despite heavy current investment in tooling and data pipelines, RLHF's complexity, cost, and instability create strong incentives for the field to discover fundamentally simpler, cheaper, or more reliable alignment techniques (e.g., constitutional AI, direct preference optimization variants, or future paradigms).
  5.  **English being the language of code:** While keywords are English-based, programming is fundamentally about logic structures; keywords could be trivially redefined or translated (as some non-English projects do), and syntax isn't tied to natural language grammar, making this mostly a superficial convention.

  **On Tech History: Lock-in vs. Better Designs**

  Tech history shows **both forces at play, but "better" often wins *if* the advantage is large enough and the switching costs aren't insurmountable.** Here's the breakdown:

  1.  **Strong Lock-in (Path Dependence Wins):** When network effects, infrastructure investment, and retraining costs are *massive*, and the *relative advantage* of the new technology is *marginal* (like QWERTY vs. Dvorak for most users, or TCP/IP vs. alternatives), lock-in is incredibly strong and can persist for decades or centuries.
  2.  **Disruption (Better Wins):** When a new technology offers **orders-of-magnitude improvement, solves a critical pain point, or enables entirely new capabilities**, it *can* overcome inertia, even with significant switching costs. Examples include:
      *   Digital cameras replacing film (massive quality/convenience leap).
      *   Smartphones replacing feature phones (entirely new platform).
      *   Transformers replacing RNNs/LSTMs in NLP (huge performance gain).
      *   Cloud computing disrupting on-prem data centers (scalability/cost).

  **Regarding RLHF and LLMs:**

  Your concern is valid. RLHF *is* a patchy, expensive, and imperfect solution, and there's significant path dependence building around it (data pipelines, human infrastructure, research focus). **However, AI moves exceptionally fast.** The fundamental limitations of RLHF (cost, scalability, reward hacking, lack of true understanding) are major unsolved problems actively driving research. If a significantly better alignment paradigm emerges – one that's fundamentally simpler, more robust, cheaper, or enables capabilities RLHF cannot – it *will* be adopted rapidly. The potential gains in AI are so vast that the "better design wins" force is likely stronger here than in slower-moving domains like keyboards or network protocols. Don't despair; the field *is* searching for those better fundamentals precisely because RLHF is recognized as a flawed tool.
