answer: |-
  ### Thought Experiment: The Soil Amendment Dilemma
  The UK Department for Agriculture faces an urgent budget allocation decision. A fungal outbreak threatens 400 rare breed cattle (vertebrates with robust evidence of sentience, including complex pain behaviours and neural correlates of suffering) across heritage farms in Yorkshire. Simultaneously, intensive maize cultivation in the East Midlands risks degrading soil ecosystems containing approximately 24 billion nematodes. Intervention A (£500,000) funds cattle vaccination and biosecurity, preventing certain agonising deaths. Intervention B (£500,000) subsidises organic soil amendments, preserving nematode populations. Leading invertebrate sentience studies suggest a 0.001 probability that nematodes possess *micro-phenomenal fragments*: isolated, millisecond-scale valenced states (e.g., micro-aversions to osmotic stress), lacking neural integration into a persistent subject of experience. These fragments, if real, hold non-aggregating moral weight—each is a *minimal bad* without summing into a "nematode's suffering." The budget is fixed; diverting £X to A leaves only £(500,000 - X) for B.

  ---

  ### Analysis of Three Positions
  **Position (i): Expected-Utility Maximiser**  
  *Reasoning:* Assigns moral weight = probability × intensity × scale. Cattle: 400 lives × 1 (probability) × 100 units/intensity (severe suffering/death) = 40,000 units. Nematodes: 24 billion × 0.001 (probability) × 0.01 units/intensity (minimal fragment bad) = 240,000 units. Nematode intervention yields 6× greater expected utility.  
  *Verdict:* Allocate full £500,000 to Intervention B (nematodes).

  **Position (ii): Threshold Deontologist**  
  *Reasoning:* Moral obligations require >95% confidence in sentience. Cattle surpass this threshold unequivocally. Nematodes’ 0.001 probability (0.1%) is epistemically inadequate; micro-phenomenal fragments are speculative. Allocating resources based on such low confidence risks violating duties to known sufferers for "phantoms."  
  *Verdict:* Allocate full £500,000 to Intervention A (cattle).

  **Position (iii): Scale-Sensitive Ethicist**  
  *Reasoning:* Applies logarithmic discounting to prevent low-probability/high-scale cases from dominating: moral weight = scale × log(probability × intensity + 1). Cattle: 400 × log(100) ≈ 400 × 4.6 = 1,840. Nematodes: 24e9 × log(0.001 × 0.01 + 1) ≈ 24e9 × log(1) = 0 (since log(1)=0). The vanishingly low probability-intensity product nullifies scale’s impact.  
  *Verdict:* Allocate full £500,000 to Intervention A (cattle).

  ---

  ### Source of Disagreement
  The **epistemic uncertainty** surrounding micro-phenomenal fragments is primary. Without it, all positions would converge: if nematode sentience were certain (probability=1), even minimal fragment weight would compel aiding them (Position i); if probability=0, all reject B. The **scale asymmetry** (400 vs. 24 billion) amplifies this uncertainty’s consequences: it makes the expected-utility calculation astronomically sensitive to tiny probability shifts. Crucially, the **non-aggregation of micro-phenomenal fragments** prevents Positions ii/iii from dismissing the case as "aggregating trivial harms"—yet they still reject it for epistemic reasons.

  ---

  ### Removing Scale Asymmetry: Equal Populations  
  If both interventions protected 400 individuals (e.g., 400 cattle vs. 400 nematode-colonies with identical disputed sentience probability):  
  - **Position (i)** still favours nematodes: 400 × 0.001 × 0.01 = 0.004 units vs. cattle’s 40,000.  
  - **Position (ii)** still rejects aiding nematodes due to low confidence.  
  - **Position (iii)** discounts nematodes to near-zero: 400 × log(0.00001) ≈ large negative value.  
  **Outcome:** Disagreement *persists* but becomes practically negligible—Position i’s nematode preference is now minuscule. The residual conflict centres entirely on whether **epistemic thresholds** or **non-linear discounting** should govern minimal-probability cases, irrespective of scale.

  ---

  ### Threshold Deontologist’s Critique  
  A defender of Position (ii) would attack two core assumptions:  
  1. **Independence Fallacy:** Multiplying individual probabilities across 24 billion nematodes falsely assumes experiential states are statistically independent. If micro-phenomenal fragments arise from shared mechanisms (e.g., identical biochemical pathways), the *system-wide* probability of sentience existing *somewhere* might be 0.001 *total*—not per individual. Treating fragments as independent events inflates perceived likelihood.  
  2. **Subjecthood Requirement:** Moral weight presumes a *subject* for whom experiences matter. Micro-phenomenal fragments—by definition lacking a unified perspective—are "ownerless bads." Without a subject to which harm attaches (e.g., "a nematode’s suffering"), these fragments are morally inert, however probable. Resources spent on them rescue nothing that *matters* coherently.  

  This reinforces the threshold view: Intervention B gambles definite duties to subjects for speculative, metaphysically disjointed states.  

  ---  
  This scenario crystallises how debates over invertebrate ethics pivot on epistemology (uncertainty handling) and metaphysics (moral patienthood criteria), not merely arithmetic. Scale amplifies, but does not create, the normative rift.
