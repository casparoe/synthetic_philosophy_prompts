prompt: |-
  I'm gradng papers for a friend who teaches an intro course on Enlightenment self-fashioning, and I'm putting together a dataset for a science-and-ideas column I'm writing about AI evaluation—so I need a prompt that forces a model to spot subtle errors without searching teh web. You are an expert grader in early American intellectual history; think carefully, don't just skim, and start with teh bottom line: a letter grade (A-F) plus a one-sentence verdict right at the top. Then bullet the specific points—what's accurate, what's subtly off, and why—without giving a generic impression. Keep the whole reply under 250 words.

  Exam question: In his Autobiography, Franklin describes a bold and arduous project of arriving at moral perfection. Briefly explain his tracking method, name three of the thirteen virtues he listed, and say whether he believed the project was ultimately successful for him personally.

  Student answer:
  Franklin's Project of Moral Perfection involved listing thirteen virtues—Temperance, Silence, Order, Resolution, Frugality, Industry, Sincerity, Justice, Moderation, Cleanliness, Tranquility, Chastity, and Humility—and tracking failures in a small book where he marked black dots in a seven-column grid, one column per day of the week, for every virtue he violated. He monitored all thirteen simultaneously every single day with equal intensity, never privileging one over the others. Among them were Temperance, Silence, and Order, and he later added Humility after a Quaker friend mocked his pride. After decades he judged the experiment a complete success: he said he had eliminated every black dot and reached flawless self-mastery, though he still complained that Order was hard because his papers were always messy. He insisted the method worked for anyone regardless of religious background, since he treated virtue as pure behavioral engineering—like training a muscle—without any need for divine grace or prayer.
reasoning: |-
  Hmm, the user is grading papers and needs an AI evaluation prompt for a science-and-ideas column. They want me to act as an expert grader in early American intellectual history to assess a student's answer about Franklin's moral perfection project. The instructions are clear: start with a letter grade and one-sentence verdict, then bullet specific points about accuracy and errors.

  Looking at the student's answer... They correctly identify the thirteen virtues and Franklin's tracking method with the grid book. The examples of Temperance, Silence, and Order are accurate too. But several subtle errors jump out. Franklin didn't monitor all virtues simultaneously - his autobiography explicitly says he focused on one virtue per week in rotation. And he didn't claim "complete success" but rather admitted ongoing struggles, especially with Order and Humility. The religious neutrality claim is overstated too; while Franklin framed it practically, he still invoked divine help in the text.

  The grade has to reflect these nuances. The core facts are mostly there (method/virtues), but the misinterpretations of Franklin's self-assessment and approach are significant enough to drop it to a B. For the bullets, I'll highlight: 1) Accurate grid method description 2) Correct virtue examples 3) Rotation error (critical) 4) Overstated success claim 5) Religious context oversight. 

  Keeping it under 250 words means being brutally concise - no fluff, just grading insights that would help the user's dataset show how AI spots historical nuance.
answer: |-
  **Grade: B**  
  *Solid grasp of core concepts but with significant factual inaccuracies that misrepresent Franklin’s methods and self-assessment.*

  - **Accurate**: Correctly lists Franklin’s 13 virtues (Temperance, Silence, Order, etc.) and identifies his tracking grid with daily dots for violations.  
  - **Subtly Off**: Franklin did **not** monitor all 13 virtues daily with equal intensity. He cycled through them weekly, focusing intensely on *one* virtue per week while tracking the rest minimally (*Autobiography*, p. 81).  
  - **Incorrect**: Franklin explicitly called the project *unsuccessful* for himself, admitting he "never succeeded" in Order and struggled with Pride (disguised as Humility). He saw progress, not perfection.  
  - **Overstated**: While Franklin framed virtue as habit-building, he *did* invoke divine aid (calling for "the help of God" in acquiring Humility), contradicting the claim of a purely secular "engineering" approach.  
  - **Minor Error**: Humility was part of his original list; the Quaker anecdote merely reinforced its difficulty (*Autobiography*, p. 85).
