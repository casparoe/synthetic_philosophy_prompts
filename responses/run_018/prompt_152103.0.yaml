  My mates Alex and Jordan had a row at the pub about Szasz and the myth of mental illness, but neither of them seemed to be listening to the other properly. Alex kicked off by saying Szasz was literally arguing that mental illness is a myth on par with the flat earth — that conditions like schizophrenia and depression have no biological basis whatsoever, so calling them illnesses is just a way of medicalising moral failure and social deviance. Jordan said that was a strawman: Szasz never denied that brain diseases exist, he just said the category "mental illness" is conceptually incoherent because it applies medical language to problems in living, like heartbreak or existantial dread. Alex came back that Jordan was smuggling in hidden norms about what counts as a "real" disease — modern neuroscience finds hippocampal shrinkage in chronic PTSD and clear dopaminergic dysfunction in psychosis, so if Szasz's test is "no visible lesion" then he's been empirically defeated for loads of conditions. Jordan replied that biological correlates don't turn a problem in living into a disease; fever has biological correlates but it's a response, not a malfunction, and prolonged grief disorder might just be suffering with a neural signature rather than a broken brain. Alex said then Jordan's position collapses into "anything I think is a social problem can't be an illness regardless of biology," which is pure definitional gatekeeping and risks stigmatising people who genuinely need pharmacological help. Jordan conceded he can't draw the precise line without appealing to values about autonomy and responsibility, and threw in this niche idea he calls "diagnostic capture of existential resistance" — basically, we pathologise suffering that should be read as a rational reaction to an unjust structure — but admitted he hasn't fully sorted whether severe melancholia belongs in that box or not.

  Please adjudicate move by move: rate each of Alex's and Jordan's points from clearly mistaken to clearly right, briefly justify each rating, and say what both parties are missing about Szasz's actual distinction between brain disease and problems in living. Answer in British English, please — and don't bother with citations or reading lists, just work it through from the arguments themselves.
