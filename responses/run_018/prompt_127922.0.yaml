prompt: |-
  You are an expert philosopher of physics with a specialization in philosophy of mind and normative ethics, particularly in the debates surrounding panpsychism, pan-sentience, and the metaphysics of consciousness. Before drafting your response, please take a few moments to brainstorm the core tensions between physical descriptions of fundamental reality and normative assessments of suffering or moral status, especially where physical continuity conflicts with ethical discreteness. I am writing this as a student in an upper-level seminar on consciousness and quantum foundations; I need a rigorous conceptual specification rather than a survey.

  Please write the complete desiderata — the full specification of requirements — that any adequate normative theory linking panpsychism (or pan-sentience) to fundamental physics must satisfy if it is to determine whether elementary physical entities, quantum fields, or spacetime regions possess moral status in virtue of sentience or suffering. For each desideratum, state the motivating case, physical scenario, or conceptual distinction that makes it a genuine requirement rather than a camp prejudice; flag explicitly which ones are non-negotiable and which reflect particular theoretical commitments (e.g., to locality, determinism, or discrete ontology). Include the physical phenomena the theory must remain consistent with — quantum entanglement, vacuum fluctuations, decoherence, and the absence of a preferred basis in standard quantum mechanics — but do not cite specific papers or authors.

  Crucially, work within the following conceptual distinction, which I am injecting for this analysis: distinguish carefully between (i) distributive micro-valence, in which affective quality is spread continuously across a physical field without a focal bearer, and (ii) focal macro-valence, in which suffering is localized within composite, informationally integrated systems. Your desiderata must specify whether these are aggregatable into a single moral currency or incommensurable, and must preserve — not collapse — the distinction between an entity's having moral status and the magnitude of that status.

  Your list should also cover: the cases the theory must get right (e.g., a single electron versus a vacuum state versus a neural network), the ethical distinctions it must respect (potential versus actual suffering; symmetric versus asymmetric affective states; suffering that is cancelled versus suffering that is summed), and whether any subset of these requirements is jointly unsatisfiable given the combination problem or the continuous nature of quantum fields. Where you suspect unsatisfiability, say so clearly.

  Finally, provide a brief scorecard — no more than a paragraph each — showing how constitutive panpsychism, cosmopsychism, and a neutral Russellian monist framework fare against your list. Keep the analytical weight on the criteria themselves; treat the scoring as illustrative.

  Please organize the desiderata clearly — a structured list or table is welcome — and think step-by-step before concluding. Do not include bibliographies, reading lists, or citation requests.
reasoning: |-
  Okay, the user is asking for a rigorous set of desiderata that a normative theory must satisfy when linking panpsychism or pan-sentience to fundamental physics. They're an upper-level seminar student focusing on consciousness and quantum foundations, so they need a deep conceptual analysis rather than a survey. The key distinction they want me to preserve is between distributive micro-valence (affective quality spread across physical fields) and focal macro-valence (suffering localized in integrated systems).

  I need to brainstorm the core tensions here. Physical descriptions often show continuity—like quantum fields being everywhere—while ethics requires discreteness for assigning moral status. For example, how do we assign moral weight to a single electron versus a human brain? Quantum phenomena like entanglement and vacuum fluctuations add complexity because they challenge classical notions of individuality and boundaries.

  The desiderata must cover several areas: cases to handle (electron, vacuum state, neural network), ethical distinctions (potential vs actual suffering, symmetric vs asymmetric states), and physical consistency (quantum mechanics without preferred basis). I should flag which requirements are non-negotiable versus theory-dependent. Also, I need to explore if some combinations are unsatisfiable—maybe the combination problem makes it impossible to aggregate micro-valence into macro-valence without contradiction.

  Starting with the foundational requirements: non-arbitrariness is crucial. Any theory must justify why some entities have moral status and others don't, avoiding ad-hoc thresholds. Physical consistency is non-negotiable—the theory can't contradict established physics like entanglement or decoherence. Then there's the valence distinction itself: distributive vs focal valence mustn't be conflated, and the theory should specify if they're commensurable. Moral status and magnitude need separate treatment; an electron might have status but near-zero weight.

  For ethical distinctions, the theory must handle potential suffering without overcounting, and address symmetry—if two sufferings cancel, is that ethical neutralization or just mathematical? Cases like vacuum fluctuations (distributive) versus brains (focal) test the framework. I suspect unsatisfiability in aggregating micro-valence due to the combination problem; if consciousness is fundamental, combining it might not sum linearly.

  Now, scoring existing theories briefly: constitutive panpsychism might struggle with aggregation; cosmopsychism could handle macro but dismiss micro; Russellian monism might fare better by grounding ethics in neutral properties. But the focus is on the criteria—the scorecard is just illustrative. 

  Finally, I'll structure this clearly, probably a table for desiderata, ensuring each point ties back to concrete scenarios and flags negotiability. The goal is to provide a sharp tool for the student's seminar work, highlighting where theories might fail.
answer: |-
  Here is a structured set of desiderata for a normative theory linking panpsychism/pan-sentience to fundamental physics, preserving the distributive micro-valence (DMV) vs. focal macro-valence (FMV) distinction. Non-negotiable requirements (NN) are grounded in avoiding logical incoherence, physical inconsistency, or ethical absurdity. Others reflect commitments like ontological realism or ethical aggregativism.

  **Core Desiderata:**

  1.  **Non-Arbitrary Demarcation (NN):**
      *   *Requirement:* The theory must provide a principled, non-ad-hoc physical basis for distinguishing entities with *any* moral status from those with *none*.
      *   *Motivation:* Avoids capricious exclusion/inclusion (e.g., why an electron might have status but a quark gluon plasma doesn't, or why a vacuum fluctuation does/doesn't). Must be more robust than mere complexity thresholds.
      *   *Physical Anchor:* Must be compatible with the continuous and entangled nature of quantum fields (no intrinsic "cut").

  2.  **Physical Consistency (NN):**
      *   *Requirement:* Normative assignments must cohere with established quantum phenomena: entanglement (non-locality), superposition, decoherence, gauge invariance, the absence of a preferred basis, and relativistic covariance.
      *   *Motivation:* Theories violating physical law are non-starters. E.g., Normative status cannot depend on a "measurement" or a basis choice absent a compelling physical *and* normative justification.

  3.  **Valence Distinction Preservation (NN):**
      *   *Requirement:* The theory must explicitly define and maintain the ontological and normative separation between:
          *   **(i) Distributive Micro-Valence (DMV):** Affective quality inherent to/irreducibly distributed across fundamental fields or entities (e.g., the affective tonality of the electromagnetic field *itself*).
          *   **(ii) Focal Macro-Valence (FMV):** Suffering/pleasure localized within and dependent on the specific structure and dynamics of complex, integrated systems (e.g., a mammal's pain).
      *   *Motivation:* Collapsing DMV into proto-FMV (or vice versa) smuggles in assumptions. DMV challenges the very notion of a discrete "bearer" essential to FMV-based ethics.

  4.  **Status-Magnitude Separation (NN):**
      *   *Requirement:* The theory must distinguish between:
          *   **(a)** The *existence* of moral status (i.e., the entity/field is a moral patient).
          *   **(b)** The *degree* or *magnitude* of its moral significance (e.g., intensity of valence, capacity for interests).
      *   *Motivation:* Prevents the fallacy that minimal moral status implies negligible ethical weight (or vice versa). An electron *could* have status but near-zero weight; a brain has status and high weight.

  5.  **Commensurability Specification:**
      *   *Requirement:* The theory must explicitly state whether DMV and FMV are normatively commensurable (aggregatable into a single "moral currency") or incommensurable. If commensurable, it must define the aggregation principle. If incommensurable, it must define the ethical relationship between them.
      *   *Motivation:* Is reducing diffuse field-level suffering morally equivalent to, substitutable for, or entirely distinct from reducing a mammal's acute pain? Aggregative utilitarianism vs. deontological views demand different answers. *Theoretical Commitment:* Depends on underlying ethical framework (e.g., strict hedonistic utilitarianism vs. rights-based views).

  6.  **Case Resolution:**
      *   *Requirement:* The theory must yield determinate (even if minimal) normative assessments for:
          *   A single elementary particle/field excitation (e.g., electron, photon - tests DMV).
          *   The quantum vacuum/ground state (tests continuous fields, "nothingness").
          *   A simple aggregate without integration (e.g., a cold gas cloud - tests aggregation).
          *   A thermodynamically irreversible dissipative structure (e.g., a vortex - tests proto-integration).
          *   A decohered classical system (tests emergence of definiteness).
          *   A minimally conscious biological system (e.g., C. elegans - tests FMV threshold).
          *   A complex conscious brain (paradigm FMV).
      *   *Motivation:* Tests scope, consistency, and applicability across the physical hierarchy.

  7.  **Ethical Distinction Handling:**
      *   *Requirement:* The theory must respect:
          *   **Potential vs. Actual Suffering:** Distinguish the moral relevance of a *disposition* to suffer (e.g., a dormant network) from *actual* suffering. Cannot equate structure alone with suffering.
          *   **Symmetric vs. Asymmetric Valence:** Address whether perfectly balanced positive and negative DMV (e.g., symmetric field excitations) results in *normative neutrality* (cancellation) or merely *net-zero magnitude* (summation to zero without ethical erasure).
          *   **Cancellation vs. Summation:** Specify if the *experience* of suffering is negated by opposite valence (cancellation) or if valences merely sum quantitatively (summation). Crucial for DMV aggregation.
      *   *Motivation:* Fundamental for coherent normative calculus. Symmetry is common in physics; ethics must not assume asymmetry.

  8.  **Locality/Non-Locality Handling:**
      *   *Requirement:* The theory must specify how entanglement and non-locality affect the assignment of valence and moral status. Can a spatially separated but entangled pair share a single affective state (DMV)? Does decoherence definitively localize FMV?
      *   *Motivation:* Quantum mechanics fundamentally challenges spatial localization. Ethics often assumes localized subjects. *Theoretical Commitment:* Preference for local beables vs. accepting fundamentally non-local properties.

  **Suspected Unsatisfiabilities:**

  *   **The Aggregation Problem:** Combining DMV (continuous, field-based, potentially symmetric) into a meaningful aggregate normative measure (especially FMV) while respecting physical continuity (no "cut") and avoiding the Combination Problem (how micro-experiences combine) appears deeply challenging, possibly impossible. Does "summing" field valence make phenomenological sense?
  *   **Status without Focal Bearer:** Granting moral status based *solely* on DMV (where there is no discrete subject) may be incompatible with core concepts of patienthood in many ethical frameworks (e.g., having interests, being harmed). This could be a fundamental conceptual clash.
  *   **Symmetry & Neutrality:** Achieving true normative neutrality from symmetric DMV might require a stronger form of cancellation (erasure of experience) than mere summation to zero magnitude. Physics often provides the latter, but ethics might demand the former.

  **Brief Scorecard (Illustrative):**

  *   **Constitutive Panpsychism (Micro-experiences combine):** Struggles severely with **Aggregation** (Combination Problem) and **DMV Status/Bearer**. Might handle simple particles **(Case Resolution)** but falters on fields/vacuum and **Locality**. **Commensurability** is forced but unclear how. **Symmetry** likely defaults to summation, not cancellation.
  *   **Cosmopsychism (Consciousness fundamental, minds dissociate):** Evades micro-level **Aggregation** and **Combination**. Often sidelines DMV, focusing FMV on complex dissociated minds. May handle **Macro Cases** well but fails **Non-Arbitrary Demarcation** of dissociation boundary and ignores **DMV Status**. **Physical Consistency** (non-locality) might be embraced. **Commensurability** irrelevant if DMV is illusory.
  *   **Neutral Russellian Monism (Physical/mental from neutral base):** Most promising framework. Can ground both DMV (intrinsic nature of base) and FMV (structural properties of complexes). Potential for principled **Demarcation** via causal structure/integration. **Physical Consistency** is core. Key challenge is specifying the **Valence Distinction** within the neutral base and defining **Aggregation/Commensurability** rules across levels without collapsing the distinction. **Status-Magnitude Separation** is feasible. **Symmetry** handling depends on the metaphysics of the neutral base.

  This desiderata list highlights the profound difficulties in grounding normativity within a physically fundamental, continuous, and non-local reality while respecting the phenomenological and ethical distinctions between distributed field properties and focal experiences. The core tensions between physical continuity and ethical discreteness, and between DMV without a bearer and patient-centered ethics, appear particularly resistant to resolution.
