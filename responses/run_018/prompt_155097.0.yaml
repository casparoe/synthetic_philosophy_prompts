answer: |-
  ### In-Class Deliberation Game: "Periodization Puzzles"  
  **Objective:** To experience how macro-periods like the "Middle Ages," "Renaissance," and "Scientific Revolution" are retrospective constructs shaped by historians' questions, rather than self-evident historical breaks.  

  ---

  #### **Phase One: Chronological Sorting Challenge** (25 minutes)  
  - **Setup:**  
    - Divide 12 students into 4 groups of 3.  
    - Provide each group with an identical packet of 10 anonymized primary-source excerpts (labeled A–J). Excerpts are described generically (no author names, titles, or dates).  
    - **Excerpt Packet Examples (for facilitator reference only; students see generic descriptions):**  
      1. *12th c. Latin natural philosophy text*: Commentary on motion citing Aristotle and Arabic astronomical data.  
      2. *15th c. Italian mercantile contract*: Uses humanist rhetoric in a business agreement.  
      3. *17th c. court record*: Resolves an astronomy dispute using scripture and mechanical principles.  
      4. *14th c. Italian legal document*: Blends scholastic logic with vernacular poetry.  
      5. *13th c. sermon*: Combines biblical allegory with Aristotelian metaphysics.  
      6. *16th c. medical treatise*: Applies humoral theory to empirical dissections.  
      7. *15th c. engineering manual*: Describes mill designs with practical mathematics.  
      8. *16th c. diplomatic letter*: Quotes Cicero to analyze contemporary politics.  
      9. *12th c. monastic chronicle*: Records agricultural innovations using theological language.  
      10. *17th c. laboratory note*: Quantifies chemical reactions but cites alchemical symbols.  

  - **Task:**  
    - Groups sort excerpts into **three bins**: "Middle Ages," "Renaissance," or "Scientific Revolution," using **only internal evidence** (e.g., language, concepts, institutions).  
    - Rules:  
      - All excerpts must be sorted; no omissions.  
      - Each excerpt can only go in one bin.  
      - Groups must defend their sorting with specific textual evidence.  

  - **Scoring (to incentivize rigor, not accuracy):**  
    - **+1 point** per excerpt: Clear, internally consistent justification.  
    - **–2 points (group penalty):** Any excerpt left unsorted.  
    - **–1 point (per excerpt):** If two groups place the same excerpt in different bins *without articulating distinct criteria* (e.g., Group 1 uses "language style," Group 2 uses "scientific concepts").  

  - **Facilitator Role:**  
    - Circulate, ask probing questions (e.g., *"Why is Excerpt B ‘Renaissance’ not ‘Middle Ages’?"*).  
    - Record group rationales but **do not confirm/deny** guesses.  

  ---

  #### **Phase Two: Criterion-Driven Sorting** (20 minutes)  
  - **Setup:**  
    - Reveal actual dates/provenance of excerpts (e.g., *"Excerpt A: 12th-century Paris, Latin text by a scholar-monk"*).  
    - Assign each group **one sorting criterion**:  
      - Group 1: **Technological practice** (tools, techniques, material innovations).  
      - Group 2: **Institutional setting** (church, university, court, market).  
      - Group 3: **Conceptual vocabulary** (scientific, philosophical, theological terms).  
      - Group 4: **Conceptual vocabulary** (repeats for comparison).  
    - Groups re-sort the *same* excerpts using **only their assigned criterion**.  

  - **Rule Change:**  
    - Excerpts can now be **split across multiple bins** if the criterion justifies it (e.g., an excerpt with medieval institutions and Renaissance concepts can go in two bins).  

  - **Scoring:**  
    - **+2 points** per excerpt: Coherent application of the assigned criterion.  
    - **No penalties** for inter-group disagreement.  

  ---

  #### **Phase Three: Forced-Choice Vote** (15 minutes)  
  - **Task:**  
    - Each student has **1 minute** to argue:  
      *"Did your Phase Two criterion reveal a REAL historical boundary or PROJECT one onto continuous material?"*  
    - Facilitator records votes ("Real" vs. "Projected") but **does not comment**.  

  ---

  ### **Debrief** (30 minutes)  
  **Reveal the thesis:** *"Today’s game simulated how historians construct macro-periods. The boundaries aren’t ‘discovered’—they depend on the questions we ask."*  

  1. **Map phases to historiography:**  
     - **Phase One = Naive chronological realism:**  
       - Students assumed periods are self-evident "bins." Forcing excerpts into one category mirrors how textbooks reify periods, obscuring continuity (e.g., Excerpt 3’s blend of scripture/science defies "Scientific Revolution" purity).  
     - **Phase Two = Question-driven periodization:**  
       - Sorting by criteria (tech/institutions/concepts) shows boundaries shift based on focus. E.g., "Renaissance" humanism (Excerpt 2) may align with medieval institutions (Excerpt 4).  
       - Splitting excerpts acknowledges hybridity (e.g., Excerpt 10’s mix of alchemy/quantification).  
     - **Phase Three = Heuristic utility vs. ontological commitment:**  
       - Voting highlights tension: Periods are useful tools (heuristics) but become misleading if treated as real "eras" (ontology).  

  2. **Explicit limitation of the activity:**  
     - *"This game can’t capture long-duration structural patterns (e.g., 300-year demographic cycles, linguistic drift, or institutional persistence across centuries). These might justify broad labels even when local evidence is blurry. For example, universities evolved gradually—their ‘medieval’ structure persisted into the ‘Renaissance.’ As facilitator, I must add this context; the game’s excerpts are too brief to show it."*  

  3. **Address predicted pitfalls:**  
     - **Problem:** Students anchor on technology (e.g., "watermills = Middle Ages, labs = Scientific Revolution") and dismiss institutional/conceptual ambiguity as "noise."  
     - **Facilitator counter-example (deploy only if anchoring dominates):**  
       *"Consider universities: Lecture formats from the 13th c. (medieval) continued unchanged in 16th c. ‘Renaissance’ Padua. If we only use tech, we miss this institutional inertia."*  

  ---

  ### **Design Rationale & Predictions**  
  - **Why no readings/recognition?**  
    - Excerpts use **generic descriptions** (e.g., "a court record") to ensure general familiarity suffices. Avoiding named authors (e.g., Galileo) prevents prior knowledge from biasing sorts.  
  - **Predicted student struggles:**  
    - Phase One: Groups will force ambiguous excerpts (e.g., Excerpt 4’s scholastic/vernacular mix) into bins using arbitrary criteria, then penalize each other for disagreements.  
    - Phase Two: "Tech" groups will create sharp boundaries; "institutional" groups will see continuity. Two "conceptual" groups may disagree on the same text, revealing subjectivity.  
    - Phase Three Vote: Likely split ~60% "Projected" (conceptual/institutional groups) vs. ~40% "Real" (tech groups), setting up debrief tension.  
  - **Critical facilitator restraint:**  
    - **Never** lecture upfront. Only in debrief contextualize limitations (longue durée) and counter anchoring (institutional persistence).  

  This design forces students to confront ambiguity, question received categories, and experience periodization as an active, criteria-dependent process—setting the stage for advanced historiographical critique.
