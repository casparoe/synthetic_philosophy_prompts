  ### Workshop Design: The Underdetermination Game  
  **Ideal Group Size:** 12–16 participants  
  **Total Time:** 90 minutes  
  **Core Idea:** Concepts (e.g., character types, genre rules) are underdetermined by examples; readers bridge the gap with tacit assumptions about salience.  

  ---

  #### **Materials**  
  1. **Projector or printed handouts** for Bongard problems.  
  2. **Index cards** (12 per participant).  
  3. **Pens/pencils**.  
  4. **Timer**.  
  5. **Whiteboard or large paper** for scoring.  
  6. **Small forfeit tokens** (e.g., buttons, paper clips)—one per participant.  

  ---

  ### **Activity Flow**  
  #### **Phase 1: Opening Puzzle (15 min)**  
  **Goal:** Intuit pattern recognition’s ambiguity through Bongard-style problems.  
  **Facilitator Script:**  
  > *"We’ll start with a quick puzzle. On the left are six examples following a hidden rule; on the right, six that break it. What’s the rule? There might be multiple valid answers."*  

  **Problems to Present (Solved via Group Discussion):**  
  1. **Geometric Bongard (5 min):**  
     - **Left:** 6 boxes, each with a circle *inside* a square.  
     - **Right:** 6 boxes, each with a circle *outside* a square.  
     - **Expected Rule:** "Shape A is inside shape B."  
     - **Tempting Alternative:** "Shape A is smaller than shape B" (if circles are drawn smaller).  

  2. **Narrative Bongard (5 min):**  
     - **Left:**  
       - "A knight vows revenge silently."  
       - "A scientist discovers a flaw in her theory alone."  
       - "A widow refuses help rebuilding her house."  
       - "A thief leaves a token of apology."  
       - "A diplomat resigns without explanation."  
       - "A child hides a mistake from parents."  
     - **Right:**  
       - "A knight rallies allies with a speech."  
       - "A scientist publishes her error immediately."  
       - "A widow joins a community project."  
       - "A thief brags about the theft."  
       - "A diplomat explains her decision in a letter."  
       - "A child confesses to breaking the vase."  
     - **Intended Rule:** "A character acts without seeking external validation."  
     - **Tempting Alternatives:** "Prideful behavior" or "Secretive actions" (both fit all examples).  

  3. **Facilitator Cue (5 min):**  
     - Ask: *"What rules did you infer? Did anyone see a different pattern?"*  
     - **Do not confirm solutions.** Note aloud: *"Some of you proposed distinct rules for the same boxes."*  

  ---

  #### **Phase 2: Rule-Making Game (55 min)**  
  **Goal:** Experience underdetermination by creating/guessing rules from examples.  
  **Rules:**  
  - Designers earn 1 point if their intended rule is guessed.  
  - Guessers earn 1 point per *consistent* rule they propose (intended or not).  
  - Bystanders (other group members) earn 1 point per alternative rule they contribute.  
  - **Forfeit:** Anyone with 0 points after the game donates a token (e.g., a button) to the group "pot."  

  **Steps:**  
  1. **Rule Creation (10 min):**  
     - Each participant:  
       - Chooses a narrative rule (e.g., "Character is lying to themselves," "Scene uses weather to reflect mood").  
       - Writes **6 positive examples** (follows rule) and **6 negative examples** (violates rule) on index cards (1 example/card). *Examples must be 1–2 sentences, from their work or invented.*  
       - Writes their *intended rule* on a separate card (hidden).  

  2. **Group Setup (5 min):**  
     - Divide into groups of 3–4.  
     - Within groups, swap example sets (12 shuffled cards per set).  

  3. **Guessing Rounds (30 min; 10 min per set):**  
     - For each example set:  
       - **Guessers (3 min):** Non-designers review the 12 cards, group them into "follows/breaks" sets, and guess the rule.  
       - **Alternative Rules (5 min):** *Whole group* brainstorms **all possible rules** that fit the 12 examples.  
       - **Reveal (2 min):** Designer shares intended rule.  
     - **Scoring:**  
       - Designer: 1 pt if guessers name intended rule.  
       - Guessers: 1 pt per proposed rule (initial guess + alternatives).  
       - Bystanders: 1 pt per alternative rule they add.  

  4. **Rotate Sets (10 min):**  
     - Repeat for all sets in the group.  

  ---

  #### **Phase 3: Debrief (20 min)**  
  **Goal:** Map game moments to writing/reading dynamics.  

  **Facilitator Script & Key Points:**  
  1. **Connect Game to Writing (10 min):**  
     - *"When guessers proposed rules you didn’t intend, that mirrors readers interpreting your opening chapters. Your examples *underdetermined* the concept—they couldn’t exclude alternatives."*  
     - *"The brainstorm of alternative rules? That’s a parody of misreading. A reader brings their own salience filters (e.g., cultural biases, genre expectations) to fill gaps."*  
     - *"Scoring rewarded *any* consistent rule—just as readers aren’t ‘wrong’ for valid interpretations you didn’t foresee."*  

  2. **Predictable Issues & Fixes (5 min):**  
     - **Issue:** Examples that "announce" the rule (e.g., all positives: "John lied to himself about X").  
       - *Fix:* Ask: *"Did any sets feel too obvious? In writing, we avoid ‘telling’ the rule—we trust subtext."*  
     - **Issue:** Visually uncomfortable participants (e.g., frustration at "wrong" guesses).  
       - *Fix:* Normalize: *"This tension is the point! Writers can’t control readers. Did anyone feel their examples ‘failed’? That’s the underdetermination lesson."*  
     - **Issue:** Vacuous rules (e.g., "The sentence has words").  
       - *Fix:* Note: *"Some rules were tautological. In fiction, concepts need *diagnostic* features (e.g., ‘a tragic flaw’ vs. ‘a flaw’)."*  

  3. **Limitations & Philosophical Context (5 min):**  
     - *"A novel isn’t 12 isolated examples. Readers infer from a *cumulative*, immersive context—not a puzzle."*  
     - **Settled vs. Contested:**  
       - **Settled:** Examples underdetermine concepts (Quine’s thesis). Humans use salience to resolve ambiguity.  
       - **Contested:** *Why* salience works. Is it shared culture (Wittgenstein), cognitive prototypes (Rosch), or theory-laden (Kuhn)?  
     - *"If you reject that salience fills gaps, the game still proves underdetermination: examples *alone* can’t nail a concept."*  

  ---

  ### **Facilitator Notes**  
  - **Prep Advice:** Use geometric Bongards first—they lower stakes for narrative-focused participants.  
  - **During Game:**  
    - If rules are gerrymandered (e.g., "Examples 1, 3, 5..."), say: *"Does this rule apply beyond this set? Fiction rules should transfer."*  
    - If a designer says, *"But you missed my point!"* cue: *"Then what example would have forced your rule?"*  
  - **Philosophical Transparency:**  
    - The lesson assumes Bongard problems reveal underdetermination. Some argue they test innate pattern-recognition (Gershman). If contested, the *activity* remains valid: examples still permit multiple rules.  
  - **Why Forfeits?** Gentle stakes amplify the "aha" when unintended rules score points.  

  This design creates the target experience: writers *feel* the gap between intention and interpretation before naming it. The debrief preempts pitfalls without lecturing, and flags where theory is debated.
