            Instead, use a more ambiguous one:

               Left: 
                  Box1: a circle to the left of a square.
                  Box2: a triangle to the left of a circle.
                  Box3: a square to the left of a triangle.
                  ... (all have two shapes with the left one being a polygon and the right one being a polygon? and the rule is "the left shape is a circle" only if circle is always on the left? but then in the right side, we have:

               Right:
                  Box1: a circle to the right of a square.
                  Box2: a triangle to the right of a circle.
                  ...

               Rule: "the left shape is a circle"? But in the left boxes, only the first has a circle on the left. So that doesn't work.

            Let's use a rule about number: 
               Left: each box has an odd number of shapes (1,3,5, etc.)
               Right: each box has an even number of shapes (2,4,6).

            Then rule: "odd number of shapes".

          - Present Problem 3 (narrative): use the one about decisions without consultation.

        - After each, ask for rules and note any differences.

     II. Middle Game (55 minutes)

        Step 1: Rule Creation (10 minutes)
          - Facilitator: "Now, each of you will create your own rule and examples. Choose a rule that could apply to a narrative element in fiction. For example: 'the character is hiding something', 'the scene takes place at night', 'the dialogue contains a lie'. Write the rule down on a slip of paper and keep it hidden. Then, create twelve very short narrative examples (one or two sentences each). Six should follow your rule (positive examples), and six should violate it (negative examples). Write each example on a separate index card or on a piece of paper numbered 1 to 12, and mark them as positive or negative in your mind (but do not mark the cards). You will shuffle them before giving them to your group."

          Note: They don't mark the cards because the guessers won't know which are positive or negative. They will get 12 examples and must figure out the rule and which are which? But the rule is about a property, and they must find a rule that splits the examples into two sets of six? But the rule might not be binary? We are assuming the rule is binary (either follows or not). So the guessers must find a rule that divides the 12 into two groups of six: one that follows and one that doesn't.

          They shuffle the cards and give them to the group in a stack.

        Step 2: Group Formation (3 minutes)
          - Break into groups of 3 or 4. (If the total number is not divisible, have one or two groups of 4 and the rest of 3.)

        Step 3: Group Activity Instructions (2 minutes)
          - Facilitator explains the steps for each set in the group (each member has a set). For each set:
              a. The designer shuffles their 12 example cards and gives them to the group.
              b. The non-designers (the other members) have 3 minutes to discuss and come up with one rule they think is the intended rule. They write it down.
              c. Then, the whole group (including the designer) has 5 minutes to brainstorm and suggest as many additional rules as possible that fit the examples (i.e., that correctly split the 12 examples into two groups: six that follow and six that violate). Each time someone suggests a rule, they should state it and the group quickly agrees if it fits. If it does, the suggester notes it (and their name) for points.
              d. The designer then reveals their intended rule. The group checks if it fits (it should). They also see if the initial guess was correct.
              e. Scoring:
                   - If the initial guess (by the non-designers) matches the intended rule, the designer gets 3 points.
                   - Each non-designer who participated in the initial guess gets 1 point.
                   - For every distinct rule suggested during step c (that fits), the person who suggested it gets 1 point. (Note: the initial guess is one rule and was already awarded. Do not count it again.)
              f. Record the points and move to the next set.

          - They do this for each set in the group.

        Step 4: Group Work (40 minutes)
          - Groups work through each set. Facilitator keeps time and announces when to move to the next step (use a timer).

     III. Debrief (20 minutes)

        Facilitator guides a discussion:

          1. "What happened in the opening puzzles? Did you notice that sometimes there was more than one possible rule?" (Participants share.)

          2. "In the rule-creation game, what was your experience as a designer? Were you surprised by the rules the group guessed or the alternatives they generated?"

          3. "As a guesser, what was it like to try to find the rule? Did you find yourself focusing on certain features and ignoring others?"

          4. Map to writing:
               - "The rule you intended as a designer is like the concept you have in mind as a writer. The examples are like the scenes, characters, and sentences you write."
               - "The fact that the examples can fit multiple rules shows that the text underdetermines the concept. The reader fills the gap with their own prior knowledge and what they find salient."
               - "The alternatives are like misreadings, but they are also a natural result of the ambiguity in the examples."

          5. Limitations:
               - "In a real novel, the reader has more than twelve examples; they have the entire text. But also, the reader is not looking for one rule. They are immersed in a story world."
               - "We depend on shared conventions and context to guide the reader. When that shared context is missing, miscommunication happens."

          6. Common issues:
               - "Sometimes rules were too vague (e.g., 'is good'). As a facilitator, if I notice that, I might ask the designer to make it more concrete, but I don't want to lecture. In the debrief, we can note that in writing, we aim for rules that are meaningful and supported by concrete details."
               - "Some examples were too obvious. In fiction, we want to avoid announcing the rule (like having every positive example use the word 'lie'). We want to show, not tell."
               - "If participants felt embarrassed when their rule was not guessed, that's natural. The point is not to win but to experience how easily communication can go astray."

          7. Philosophical context:
               - "The underdetermination of concepts by examples is a well-established observation. However, how humans resolve this underdetermination is an open question. Some theories emphasize shared cultural conventions, others innate cognitive structures, and others individual experiences."
               - "The activity does not depend on any particular theory; it only shows that underdetermination exists. Even if you reject the idea that shared conventions fill the gap, the activity still shows that examples alone are not enough."

     Note: The above activity is designed to run within 90 minutes. The facilitator should be flexible with time, especially in the group work.

     Now, we provide the Bongard problems in a form the facilitator can use.

     Bongard Problems for Opening:

     Problem 1 (geometric): 
          Left: six boxes, each containing one shape completely inside another shape (and only two shapes).
          Right: six boxes, each containing two shapes that are side by side (not containing each other).

          Rule: "one shape is inside another".

     Problem 2 (geometric):
          Left: six boxes, each containing an odd number of dots (1, 3, 5, ...).
          Right: six boxes, each containing an even number of dots (2, 4, 6, ...).

          Rule: "the number of dots is odd".

     Problem 3 (narrative):
          Left (all involve a decision without external input):
            1. John decided to leave the city without asking his wife.
            2. Mary chose the blue dress without looking at the price tag.
            3. The general ordered the attack without consulting his advisors.
            4. She bought the car without test-driving it.
            5. He quit his job without having another lined up.
            6. They adopted the dog without checking if it was house-trained.
          Right (all involve a decision with external input):
            1. After talking to her mother, Jane decided to go to college.
            2. The committee discussed for hours before choosing the proposal.
            3. Tom read several reviews before buying the book.
            4. She asked her friends which movie to watch.
            5. He checked the weather forecast before planning the picnic.
            6. They tried several samples before purchasing the sofa.

          Rule: "the decision is made without seeking advice or information from an external source".

     Facilitator note: For problem 3, an alternative rule might be "the decision is impulsive" or "the decision is made without research".

     This completes the design.
