prompt: |-
  I'm a software engineer by trade, but I help run a little evening discussion group on moral philosophy at my local library (long story, I got roped in and now I enjoy it). We've been working through the question of how moral revolutions actually happen — slavery, duelling, that sort of thing — and I set the group a short essay question last week. One of the members, a bright but sometimes sloppy undergrad, has handed in his answer and I need to mark it, but honestly my own grasp of Williams and Appiah is shakier than I'd like to admit, and I don't trust myself to catch subtle mistakes. I'd like you to act as an experienced marker in moral philosophy, someone who actually knows the primary material, and grade this for me. Think carefully before committing to anything — maybe mentally rehearse what the correct answer would look like first, then compare the student's answer against it point by point.

  Here is the question I set: "Bernard Williams and Kwame Anthony Appiah both discuss how practices like slavery and duelling came to an end. Explain how each of them thinks such moral revolutions happen, and what role, if any, each assigns to moral argument in the process." And here is the student's answer: "Williams and Appiah both reject the naive view that moral arguments alone ended practices like slavery and duelling, but they differ in important ways. Williams argues that slavery was abolished because eventually better moral arguments became available to abolitionists — before the late eighteenth century, people simply lacked the conceptual resources to see that slavery was wrong, and once philosophers articulated the right arguments, the practice collapsed under their weight. Appiah, by contrast, argues in The Honor Code that moral arguments were never the engine of change. He points out that the arguments against duelling, footbinding and slavery were all well known long before those practices ended, so something else must have done the work. His answer is honour: practices end when they come into conflict with the honour code of the society that practises them. For example, duelling in Britain died out fairly quickly once it was made illegal, because gentlemen could no longer maintain their honour by breaking the law. Similarly, Appiah argues that Atlantic slavery ended because working people in Britain came to see wage labour as honourable, and slavery as an affront to the dignity of labour. So for Appiah, moral revolutions happen when honour and morality align, whereas for Williams they happen when moral arguments improve. This shows that moral progress is essentially a matter of having better arguments, plus some social factors."

  Could you give this a mark out of 20 and then justify it with specific comments — what he gets right, what he gets wrong, and where he's conflated or misstated a view? I want the comments detailed enough that I can hand them back to him verbatim, and please be specific about which claims are wrong and what the correct version is, rather than just vibing an overall impression. One more thing on format: write everything as continuous prose, like an email — no headings, no bullet points, no bold, no tables, just paragraphs I can paste into my feedback. Ta very much.
reasoning: |-
  Alright, let's dive into this. The user is a software engineer who runs a moral philosophy discussion group. They need help grading an undergrad's essay on Williams and Appiah regarding moral revolutions. The user admits their own grasp on the primary material is shaky, so they want an experienced marker's detailed feedback.

  First, I need to recall Williams and Appiah's views accurately. Williams, in "Ethics and the Limits of Philosophy," argues against the idea that better moral arguments alone drive change. He emphasizes the role of social and historical contexts, suggesting shifts in ethical life happen through complex historical processes, not just philosophical arguments. The student claims Williams thinks better arguments became available and slavery collapsed once articulated. That’s a misrepresentation. Williams actually critiques this view, saying abolition happened due to changing social perceptions and material conditions, not just new arguments.

  Appiah, in "The Honor Code," argues that honor codes drive moral revolutions. Practices like duelling ended when they conflicted with societal honor. The student correctly notes Appiah's examples: duelling died when illegal, making it dishonorable, and slavery ended when wage labor became honorable. But the student oversimplifies by saying moral arguments were "never the engine." Appiah acknowledges arguments play a role in creating cognitive dissonance but aren't sufficient; honor is the catalyst.

  The student's summary conflates Williams with a rationalist view Williams himself criticizes. They also misstate Appiah's position on arguments, ignoring that arguments prepare the ground for honor shifts. The conclusion that moral progress is "better arguments plus social factors" is reductive for both thinkers. Williams sees arguments as part of broader historical changes, while Appiah prioritizes honor as the decisive factor.

  Feedback needs to highlight these points: correct identification of honor in Appiah, but misreading Williams as pro-argument, overlooking the complexity of abolition's causes. Also, note the oversimplification in the conclusion. The mark should reflect a solid but flawed understanding—14/20 seems fair, noting strengths but significant errors needing correction.
answer: |-
  Right then, let's break down this essay. Having reviewed both Williams and Appiah extensively, I can give you a detailed assessment. Overall, the student demonstrates a grasp of the core distinction between Williams and Appiah on the *primacy* of moral argument, but there are significant misrepresentations of Williams' position and a subtle but important flattening of Appiah's view, particularly regarding the role of argument. The concluding synthesis also oversimplifies both thinkers. I'd award this essay **14 out of 20**.

  Here's the feedback you can provide verbatim:

  ---

  Thank you for your essay on Williams and Appiah concerning moral revolutions. You’ve correctly identified the central point of agreement: both philosophers reject the notion that moral arguments *alone* were sufficient to end practices like slavery or duelling. You also accurately capture the core of Appiah’s thesis from *The Honor Code*, highlighting his argument that honour, and specifically the alignment or misalignment of a practice with a society’s evolving honour code, is the crucial engine of change. Your examples – duelling becoming dishonourable once illegal for gentlemen, and slavery clashing with the emerging honour of wage labour in Britain – are well-chosen and correctly represent Appiah’s main illustrations. You rightly note that for Appiah, the arguments against these practices were long known but insufficient, requiring this shift in the honour economy to precipitate change.

  However, there are significant problems with your characterisation of Bernard Williams. You state: "Williams argues that slavery was abolished because eventually better moral arguments became available to abolitionists — before the late eighteenth century, people simply lacked the conceptual resources to see that slavery was wrong, and once philosophers articulated the right arguments, the practice collapsed under their weight." **This is a substantial misreading.** Williams explicitly *rejects* this kind of rationalist, progressivist narrative. In *Ethics and the Limits of Philosophy* and his work on the Greeks, Williams argues against the idea that past societies simply "lacked the concepts" to see the wrongness of slavery. He contends that the ancient Greeks *did* have the conceptual resources to understand the moral issues surrounding slavery (like recognising its cruelty, its infringement on autonomy) – they just didn't find those considerations decisive within their broader ethical framework and social reality. The change wasn't primarily driven by *new philosophical arguments* making people see the light; rather, it was a complex historical shift in social structures, material conditions (like the rise of industrial capitalism), and evolving sentiments that made the *existing* criticisms of slavery resonate more powerfully and become socially compelling. Williams is deeply sceptical of the idea that philosophy discovers moral truths that then drive historical change; he sees moral change as arising from shifts in the wider "ethical life," of which philosophical argument is only one, often lagging or clarifying, component. The abolitionist arguments gained traction because the world had changed around them, not solely because they were philosophically superior or newly minted.

  Regarding Appiah, while you correctly identify honour as the primary engine in his account, your statement that "moral arguments were never the engine of change" is slightly too stark and risks misrepresentation. Appiah certainly argues they weren't the *sufficient* or *decisive* factor, but he does assign them an important preparatory role. Arguments help create a climate of cognitive dissonance, exposing the contradiction between professed values (like Christian equality or Enlightenment liberty) and the practice (slavery, duelling). This dissonance *sets the stage* for the honour shift by making the practice seem increasingly irrational or hypocritical, thus potentially vulnerable to being seen as dishonourable. Arguments don't *cause* the revolution directly for Appiah, but they are often necessary to prime the social conscience *before* the honour code can decisively turn against the practice. Your phrasing leans towards making arguments irrelevant, which Appiah doesn't quite claim.

  Finally, your concluding sentence – "This shows that moral progress is essentially a matter of having better arguments, plus some social factors" – is an unfortunate oversimplification that fails to capture either thinker accurately. It precisely reinstates the "better arguments plus..." model that *both* Williams and Appiah are challenging in different ways. For Williams, "better arguments" don't drive progress in that linear way; arguments gain force from complex historical contingencies. Social factors aren't just an add-on; they are the primary ground. For Appiah, the key isn't "better arguments" at all in the sense of philosophical refinement; it's the contingent, social mechanism of honour, triggered by a complex interplay of factors (like law, economic change, status anxiety) where arguments play a preparatory, not decisive, role. Neither thinker reduces moral progress to the model you propose in the conclusion.

  In summary: You have a good grasp of Appiah's core mechanism (honour) and the key rejection of argument sufficiency shared by both. The major flaw is the significant misrepresentation of Williams as a proponent of the rationalist "better arguments" model he actively critiques. There's also a minor flattening of Appiah's view on the preparatory role of argument, and the conclusion synthesizes both views into an inaccurate and reductive formula. The essay shows understanding but requires greater precision, especially concerning Williams' nuanced historical perspective.

  ---

  **Mark Justification (for your reference):**
  *   **Strengths (Worth ~7-8 points):** Correctly identifies Appiah's core thesis (honour as engine), accurately presents Appiah's key examples (duelling/law, slavery/wage labour), correctly states the shared rejection of "arguments alone," identifies the basic distinction in their explanations (arguments vs. honour).
  *   **Weaknesses (Cost ~6 points):** Major misrepresentation of Williams' view (-3-4 points) – attributing to him the rationalist progressivism he critiques. Minor oversimplification of Appiah on the role of argument (-1 point). Concluding synthesis misrepresents both (-1-2 points). Some lack of nuance in phrasing.
  *   **Overall:** 14/20 reflects a solid but flawed understanding. The student gets Appiah largely right but fundamentally misreads Williams, which is a significant error given the essay question. The core distinction is present but the details and depth, especially concerning Williams' historical sensitivity, are lacking.
