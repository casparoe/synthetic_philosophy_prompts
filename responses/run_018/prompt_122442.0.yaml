answer: |-
  My dear Councillor,  

  Your letter finds me in the quiet of my hermitage, where the rustle of leaves and the song of birds are the only diversions I require. I confess, your proposal stirs me—not to anger, but to a profound unease. You have read me with care, and you press me shrewdly. Very well. Let us dissect this creature you call a "festival," for its resemblance to the thing I condemned is both striking and deceptive.  

  First, I concede freely: this is *not* the theatre I denounced. You strip away its most venomous fangs—no professionals, no actresses, no purse, no darkened hall of illusions. You place it under God’s sky, among citizens, as a rare and solemn act. For this, I am grateful. You have listened.  

  But you ask if it is a *festival*? No. It is theatre in festival’s clothing. Let me show you the seam.  

  In my ideal festival—as sketched in my letter against d’Alembert—there are no performers and no spectators. There are only *participants*. When Genevans dance around the public fountain, when they raise their voices in chorus, when they compete in games of strength or skill, *every soul present* is an actor in the shared drama of citizenship. The magistrate does not watch; he joins. The baker does not applaud; he sings. There is no stage, no fiction, no *imitation of another*. There is only the joyous, vigorous affirmation of the *self* as part of the whole.  

  What do you propose? Two hundred citizens imitate Tell. The rest watch. Already, you divide us: those who *do*, and those who *observe*. And here lies the serpent’s egg. The citizen who plays Tell—even for an afternoon—must *become* another. He rehearses gestures not his own, speaks words crafted for him, adopts a hero’s passions. However noble the role, he steps outside himself. He invites admiration—not for his true virtue, but for his skill in mimicry. Is this not the birth of *amour-propre*, that fatal obsession with the opinion of others? The very poison I traced in the *Second Discourse*?  

  You protest: "But he is no *professional*!" True. Yet consider: even an amateur actor must, in that hour, *wish to be seen*. His virtue lies in his fidelity to the script, his power to move the crowd. And the crowd? They sit passive, their hearts stirred not by their *own* patriotic fire, but by the spectacle of another’s imitation. They feel the thrill of Tell’s defiance—secondhand. Is this how we fortify republican souls? By letting them *watch* virtue, rather than *live* it?  

  Ah, but you close with a feast! Tables in the open air, magistrates and citizens breaking bread. *This* is good. This is the spirit of the festival—if it were the heart of the day, not its appendage. If Tell’s imitation were replaced by citizens competing in archery, racing, or wrestling—real feats of real bodies—then all could join, applaud, and *strive*. No one would *pretend* to be Tell; each might *embody* his spirit through genuine action. The prizes? Award them for true excellence in civic arts—farming, craftsmanship, marksmanship—not for the transient illusion of heroism.  

  You ask why imitation in a festival is innocent. When we dance together, we express *our* joy. When we sing the old hymns, we affirm *our* faith. We do not ape the songs of shepherds or the dances of nobles; we give voice to *ourselves*. But to *act* Tell? To mimic his words, his stance, his anguish? This is not expression; it is effacement. It teaches the young man that grandeur lies in *representation*, not reality.  

  As for the watcher: he is less corrupted than the actor, yes. But he is *dulled*. His passions are spent in applause, not action. He returns home having *felt* much and *done* nothing. In Geneva, where every citizen must be a soldier, a judge, a guardian of liberty, can we spare even one afternoon of such enervation?  

  I do not condemn this lightly. I see the nobility in your aim. But if you seek my blessing, reshape it: Let the Escalade be remembered in torchlight processions where *all* carry flames. Let Tell be honored in contests of skill that *all* may contest. Let the prizes be given for virtues we *all* might earn—courage, industry, piety. Abolish the stage. Erase the line between actor and audience. Make every Genevan the hero of his own republic.  

  Then, dear sir, you shall have not only my blessing, but my tears of gratitude.  

  Your servant in the cause of virtue,  
  J.-J. Rousseau  
  Mont-Louis, July 1758  

  > *P.S. Do not mistake me: I find your proposal a thousand times less dangerous than a standing theatre. If you proceed, I shall pray it does little harm. But you asked if it could be a true festival. It cannot. The mask of Tell, however well-intentioned, still hides the face of a citizen.*
