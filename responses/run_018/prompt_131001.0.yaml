answer: |-
  ### The pattern
  You're observing a recurring rhetorical structure in meaning-of-life discourse: First, authors establish cosmic absurdity (Camus' premise that the universe is indifferent and human strivings lack inherent cosmic purpose). Second, they pivot to subjective meaning (fulfillment, relationships, projects). Third, when addressing objective theories (e.g., Susan Wolf's claim that meaning requires engagement with objective value), they sidestep evaluating the *truth* of these claims. Instead, they frame all theories—subjective, objective, or hybrid—solely as potential "cures" for the *psychological distress* of absurdity. The original metaphysical question ("Does life *have* meaning?") is displaced by the therapeutic question ("Does this *feeling* subside?").

  ### Nearest names
  1.  **Psychologizing Metaphysics**: Accurately describes reducing ontological claims to psychological states but lacks specificity to the *absurdity-response* sequence.
  2.  **Therapeutic Reductionism**: Captures the overarching fallacy but doesn't isolate the distinct *three-step pattern* (absurdity → subjective pivot → objective-as-therapy) you identified.
  3.  **Motivated Reasoning / Wishful Thinking (in meta-philosophy)**: Highlights the potential bias toward comforting answers but doesn't specify the *structure* or *absurdity* as the catalyst.
  4.  **Existential Consolation**: Used by critics (e.g., of "optimistic" existentialism) for prioritizing comfort over truth, but focuses on the *outcome*, not the *argumentative slide* itself.
  5.  **Pragmatic Turn (in meaning discourse)**: Describes the broader focus on lived experience over metaphysics but doesn't capture the *misstep* of evaluating truth-apt theories purely on therapeutic efficacy.

  **Key Difference**: Your observed pattern is a *specific, structured rhetorical move* within broader therapeutic or pragmatic approaches, defined by its *dependence on first invoking cosmic absurdity* and its *treatment of objective theories as psychological antidotes* rather than truth claims.

  ### Proposed term or verdict
  **No established term** exists for this precise slide. Coined term: **Absurdity Response Displacement (ARD)**.

  **Definition**: *The argumentative maneuver in meaning-of-life discourse where: (1) cosmic absurdity is presented as the fundamental challenge; (2) competing accounts of meaning (subjective, objective, hybrid) are framed exclusively as potential responses to the *feeling* of absurdity; and (3) these accounts are evaluated primarily or solely on their efficacy in alleviating the *psychological distress* associated with this feeling, rather than on their metaphysical coherence, truth, or justification.* ARD displaces the ontological question ("Is there meaning?") with the therapeutic question ("Does this stop the feeling of pointlessness?").

  ### Boundaries
  ARD is **not**:
  1.  **Legitimate interdisciplinary inquiry**: Philosophy legitimately considers psychological impacts (e.g., Viktor Frankl's logotherapy), but ARD *replaces* metaphysical evaluation with therapeutic evaluation, rather than integrating them.
  2.  **Pragmatism generally**: Pragmatists (e.g., William James) link truth to practical consequences but still argue *for* their conception of truth/meaning. ARD avoids arguing for the *truth* of the objective account.
  3.  **Ordinary philosophical sloppiness**: It's a *systematic pattern* with a defined structure, not random conceptual blurring.
  4.  **The existentialist "leap"**: Kierkegaard/Camus advocate authentic commitment *despite* absurdity. ARD evaluates theories based on whether they *eliminate* the feeling of absurdity.

  ### Settled vs contested
  *   **Settled (Broad Consensus)**: Philosophers of life's meaning largely agree that:
      *   The *feeling* of absurdity and the *metaphysical question* of meaning are distinct (though related) issues.
      *   Evaluating a theory *solely* on its psychological efficacy (does it make the feeling go away?) without engaging its truth claims is inadequate for philosophical purposes. Metaphysical claims require metaphysical evaluation.
  *   **Contested**:
      *   **Whether ARD is inherently fallacious**: Proponents of therapeutic or pragmatic approaches might argue that if a theory *resolves* the existential distress *caused by* contemplating absurdity, this *is* a relevant (even primary) criterion for its adequacy *as a theory of meaning for humans*. Critics see this as a category error.
      *   **The necessity of objective value**: Deep disagreement persists between Subjectivists (meaning derives from attitudes), Objectivists (meaning requires mind-independent value), and Hybridists (e.g., Wolf: subjective attraction to objective value). ARD often arises when discussing Objectivism precisely because its plausibility is hotly debated – proponents argue its truth *explains* meaning, critics might dismiss it *if* it fails the "therapy" test.
      *   **The status of "absurdity"**: Is it an inescapable metaphysical truth (Camus), a resolvable philosophical problem (Nagel), or primarily a psychological state? ARD often implicitly treats it as an undeniable starting point.
