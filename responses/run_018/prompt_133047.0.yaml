prompt: |-
  hey, i'm putting together a handout for a philosophy seminar i run with friends on tuesdays—nothing formal, just people who like arguing about minds—and we got stuck on whether buddhist anatta actually clashes with western personal-identity theories or if they mostly talk past eachother. i want a decision tree, not a list of named philosophers, that sorts people by what they actually think about concrete cases rather than by which label they like.

  start the tree with this: do you think that if a meditator reaches a state where all five skandhas temporarily cease and then 'reboot' with the same causal stream but absolutely zero autobiographical memory, that's still the same person? branch yes/no. then a second node: if we could upload just your mental processes without any body, would that count as you surviving, given that anatta already denies there's a soul-substrate to preserve? then a third node asking whether anatta is best read as a hard metaphysical claim that there's literally no persisting thing, or just as a phenomenological claim that the ego-feeling is a useful fiction constructed out of habit.

  the leaves should include at least these positions: the hard incompatibilist who says all western identity theories are wrong; a soft compatibilist who pairs anatta with narrative identity but rejects psychological continuity with a no-branching clause; the skandha-process view that treats identity as just a causal chain of aggregates with no owner; the deflationary 'useful fiction' stance; and an unnamed empty slot—maybe an animalist-anatta hybrid?—with a brief note on whether it's incoherent, unattractive, or just unexplored. flag any pair of leaves your tree can't really seperate, like whether the skandha-process view collapses into reductionist psychological continuity or stays genuinely distinct. each leaf should carry a one-sentence diagnosis of its most awkward commitment. phrase every node as a question an undergrad could answer from intuition about the cases, not from knowing parfit or buddhist scholastic jargon—so don't ask about 'the no-branching clause' without embedding it in the case description. no bibliographies or reading lists, just the tree with branch questions and the scoring logic. also i keep misspelling skandha in my notes so feel free to use either version without correcting me.
