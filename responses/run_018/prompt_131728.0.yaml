answer: |-
  ### Defense of Non-Convergent Collective Intentionality

  Your colleague’s position rests on a conflation of *jointness* with *representational unity*. I contend that collective intentionality is fundamentally a **normative-practical structure**, not a psychological-convergent one. A group acts jointly when its members are bound by reciprocal relations of *practical authority*, wherein each treats others’ actions as generating binding normative constraints on their own practical reasoning. Representational divergence is compatible with—and sometimes even constitutive of—genuine joint action when this structure is present. I address both objections through this lens.

  #### Core Argument: Jointness as Mutual Practical Authority
  1. **The Normative Structure of Jointness**  
     Joint action requires that participants’ intentions are *interdependent* in a way that transcends parallel individual efforts. This interdependence is secured not by shared representations, but by a mutual recognition of **practical authority**:  
     - Each agent treats others’ contributions (e.g., commits in a Git repository, design choices in a UI) as *reason-giving* for their own subsequent actions.  
     - These contributions impose *obligations*: If Alice writes a module for an open-source project, Bob cannot arbitrarily override it without violating a normative expectation, even if he interprets the project’s ultimate goal radically differently.  
     - The binding force stems from reciprocal recognition: "I must respond to *your* action because your role in this project gives you standing to shape *our* endeavor."  

  2. **Divergence Accommodated Within Jointness**  
     Representational differences do not undermine jointness because:  
     - **Practical reasoning is constrained, not defined, by others’ inputs**. When a contributor revises code, their practical reasoning ("What should I do next?") incorporates others’ prior actions as fixed points. For example:  
       - *Radically divergent interpretation*: Alice aims to build a tool for decentralized democracy; Bob seeks an efficient corporate workflow optimizer.  
       - *Joint action preserved*: Alice treats Bob’s API design as a binding constraint on her UI development, and vice versa. Their incompatible end-states do not prevent their *local actions* from being steps in a unified process, governed by mutual accountability.  
     - **The "collective goal" is functionally emergent, not mentally shared**. The project’s direction arises from the sequence of normatively constrained actions, not a pre-existing shared representation. Each participant pursues *their* interpretation *through* deference to others’ authoritative contributions.  

  ---

  ### Addressing Key Objections

  #### Bratman: "Without Shared Content, Only Parallel Action"  
  Bratman reduces interdependence to *predictive coordination* (e.g., "I intend to paint the house *because* I believe you intend to"). Mutual practical authority creates **deontic interdependence**, which is stronger:  
  - **Beyond mutual belief**: When contributors accept normative constraints from others, their intentions are not merely interlocking but *co-constituted*. Alice’s commitment to write documentation is not just predicted by Bob but *required* by his prior commit (e.g., a feature that demands documentation).  
  - **Lack of shared content ≠ lack of jointness**: Bratman’s "shared cooperative activity" demands agreement on the goal’s content. Yet in our case:  
    - Contributors *cooperate* by submitting to a shared normative framework ("We resolve conflicts via pull-request reviews").  
    - Their actions are *interdependent* because the project’s trajectory is determined by reciprocal practical authority—not because they share a mental state.  
  - **Contrast with parallel action**: Mere "acting alongside" (e.g., two strangers painting adjacent benches) lacks binding mutual constraints. Here, each can ignore the other without normative failure. In open-source projects, ignoring others’ contributions violates the role-based obligations of joint participation.  

  #### Gilbert: "Joint Commitment Requires a Plural Subject"  
  Gilbert posits that joint commitment forms a "plural subject" with a single mental content. Mutual practical authority shows how a plural subject can exist *without* such unity:  
  - **The plural subject as a normative entity, not a psychological one**: The "we" is instantiated by the *relations of authority* between members. When contributors recognize each other’s right to shape the project, they constitute a plural subject defined by:  
    - *Reciprocal obligations* (e.g., to maintain compatibility with others’ code).  
    - *Collective rights* (e.g., to veto changes that violate core functionality).  
  - **Shared commitment to a structure, not a representation**: Participants jointly commit to the *normative process* (e.g., version-control protocols) that governs their interactions. This commitment binds them to the collective endeavor while permitting divergent visions of its telos.  
  - **Gilbert’s error**: She conflates the *subject* of commitment (the plural "we") with its *content* (a shared goal). The subject arises from mutual recognition; the content need not be shared.  

  ---

  ### Why Representational Divergence Does Not Undermine Jointness
  - **Structural necessity in complex collaborations**: In distributed projects, the whole cannot be grasped identically by all participants (e.g., a codebase with 1M+ lines). Joint action *requires* localized practical reasoning constrained by others’ authority, not global representational alignment.  
  - **Normative robustness**: Divergent representations are stabilized by the framework of mutual authority. Conflicts are resolved through appeal to shared procedures (e.g., code review), not shared mental content.  
  - **Jointness as a practical achievement**: The group acts together because their actions become intelligible as parts of a unified whole *through* mutual constraint. The "collective goal" is not a shared representation but the emergent outcome of their normatively governed interactions.  

  ### Conclusion
  Genuine joint action is established when agents embed their practical reasoning within a framework of mutual practical authority. This structure binds participants into a collective endeavor by making their intentions constitutively responsive to one another’s authoritative contributions. Representational divergence is not only compatible with such jointness but often inevitable—and productively managed—in large-scale collaborations. What distinguishes "acting together" from "acting alongside" is not shared content, but reciprocal normative entanglement: *I am obligated to you, and you to me, to make this work—even if we see "this" differently*.
