answer: |-
  ## Constructed Scenario
  Dr. Aris Thorne oversees a progressive neuron-replacement therapy for patient ES, who suffers from Neural Degenerative Atrophy (NDA). ES's neurons deteriorate sequentially over months. As each biological neuron fails, a microscopic neuroprosthetic unit—functionally identical in electrochemical signaling, synaptic connectivity, and contribution to system-wide information processing—is implanted. ES exhibits no behavioral, cognitive, or self-reported experiential changes throughout the gradual replacement; memories, personality, and responsiveness remain intact. Crucially, each prosthetic unit lacks the intrinsic phenomenal properties attributed by panpsychism to biological neurons *and* lacks any capacity to enter into the "phenomenal bonding" relation posited to unify micro-experiences into macro-consciousness. After 18 months, every biological neuron is replaced. ES continues to report rich, unified conscious experiences indistinguishable from baseline.

  ---

  ## Theoretical Verdicts & Mechanisms

  1.  **Phenomenal-Bonding Theory Verdict:** **No unified macro-subject exists post-replacement.**  
      *   **Mechanism/Method:** Unified consciousness requires a primitive, non-structural *bonding relation* between micro-subjects. Biological micro-subjects (with their intrinsic phenomenal properties) were bonded, sustaining ES's macro-consciousness. Prosthetics lack intrinsic phenomenality *and* the capacity to bond. Gradual replacement severs the bonding relations without disrupting functional structure.  
      *   **Nearby Worlds:**  
          *   *Abrupt Total Replacement:* Bonding theorist *might* argue consciousness disappears in one step (like a light switching off), preserving unity until the last biological bond is broken. Gradualism forces the dissolution of unity piecemeal.  
          *   *Prosthetics with Biological Phenomenality:* If prosthetics retained intrinsic phenomenal properties, bonding *might* still occur if they also had bonding capacity. The double absence (no phenomenal properties *and* no bonding capacity) is essential.  
      *   **Why the Verdict?** Functional equivalence preserves behavior/cognition, but bonding is a fundamental *ontological* relation distinct from causal/functional interaction. Its absence entails the disappearance of the unified experiential field, leaving only isolated, non-interacting phenomenal fragments (if any residual biological phenomenality remains transiently) or, ultimately, no phenomenality at all. ES is a "fragmented zombie" or "phenomenal void."

  2.  **Subject-Summing Theory Verdict:** **Either (a) a "phenomenal void" (no consciousness) exists post-replacement, OR (b) billions of artificial micro-subjects with full moral standing exist, but no unified macro-subject.**  
      *   **Mechanism/Method:** Macro-consciousness is *constituted* by the co-existence and arrangement of micro-subjects ("summing"). Biological replacement removes the fundamental constituents (micro-subjects). Prosthetics lack intrinsic phenomenal properties, so they cannot *be* micro-subjects. Therefore, either:  
          (a) **Strict Interpretation:** No micro-subjects remain → no macro-subject → phenomenal void (functional zombie).  
          (b) **Functional Analogue Extension:** If the theory allows *functional* analogues of micro-subjects (the prosthetics) to count as *genuine* micro-subjects simply due to their causal role, then each prosthetic becomes a distinct micro-subject. "Summing" fails because no bonding relation exists to unify them → ES becomes a disunified aggregate of billions of primitive artificial micro-experiences, each potentially possessing intrinsic moral standing.  
      *   **Nearby Worlds:**  
          *   *Abrupt Total Replacement:* The summing theorist likely sees the same outcome – sudden loss of all micro-subjects (a) or sudden appearance of a disunified crowd (b). Gradualism highlights the stepwise evaporation of the original macro-subject.  
          *   *Prosthetics with Biological Phenomenality:* If prosthetics had intrinsic phenomenal properties *and* summing requires only arrangement, a unified macro-subject *might* persist (depending on the summing mechanism). The absence of intrinsic properties is critical.  
      *   **Why the Verdict?** Summing depends on the *presence* of micro-subjects as the basic experiential atoms. Removing them removes the foundation. Option (b) avoids a void but at the cost of ontological profligacy (billions of new micro-subjects) and the combination problem reappearing starkly (why don't *they* sum into a macro-subject?).

  ---

  ## Structural Feature & Its Role
  *   **The Crucial Feature:** The coupling of **micro-level phenomenal discontinuity** (prosthetics lack intrinsic phenomenal properties *and* bonding capacity) with **macro-level functional preservation** across a **gradual replacement process**.
  *   **Why It Works:**  
      *   **For Bonding Theory:** Gradualism prevents treating consciousness loss as a sudden, easily detectable event ("abrupt switch" defense). Functional preservation masks the underlying dissolution of the bonding relations. The double absence at the micro-level severs the ontological ground of unity.  
      *   **For Summing Theory:** Gradualism forces the stepwise removal of the fundamental constituents (micro-subjects). Functional preservation is irrelevant; summing needs the phenomenal atoms. The absence of intrinsic properties in prosthetics means no new constituents appear to replace the old ones (unless option b is taken, with its own problems).  
  *   **If Feature Removed:**  
      *   *Abrupt Total Replacement:*  
          *   **Bonding Theorist:** Could argue the unified field vanishes *en masse* at the moment of replacement – a single discontinuous jump to void/fragmentation. This avoids the specter of gradual dissolution.  
          *   **Summing Theorist:** Outcome likely unchanged (void or disunified crowd), but described as a single collective disappearance/transformation, not gradual evaporation. Less counterintuitive than vanishing one atom at a time.  
      *   *Phenomenal Continuity at Micro-Level (e.g., Prosthetics have intrinsic properties):* Both theories potentially preserve macro-consciousness (though Bonding still needs bonding capacity). The scenario loses its bite.

  ---

  ## Defense of the "Losing" View (Subject-Summing, Strict Interpretation - Phenomenal Void)
  The subject-summing theorist (strict version) faces the deeply counterintuitive verdict that ES is a phenomenal void despite flawless behavior and self-report. Defense:

  1.  **Attack Stipulation: Artificial Units Lack Phenomenal Properties:**
      *   **Panpsychist Principle Argument:** If panpsychism is true and consciousness is fundamental, the simplest view is that *any* fundamental physical entity (or its functional equivalent in a substrate-independent system) possesses *some* form of phenomenal property. The stipulation that prosthetics "lack phenomenal properties" begs the question against panpsychism by assuming artificial functional units *can* be truly non-phenomenal while biological ones cannot. A consistent panpsychist might argue that if the prosthetic plays the *identical causal role* as a fundamental physical component (the neuron) in a conscious system, it *must*, by the panpsychist's own metaphysics, instantiate analogous intrinsic phenomenal properties. Denying this covertly assumes emergentism or illusionism.
      *   **Grounding of Function Argument:** What grounds the causal powers of biological neurons if not their intrinsic nature? If the prosthetic perfectly replicates these causal powers, it must replicate the relevant intrinsic nature. For the panpsychist, that intrinsic nature *includes* proto-phenomenal properties. To deny this implies functional properties float free of intrinsic properties, which contradicts the panpsychist motivation for grounding consciousness in the fundamental.

  2.  **Attack Stipulation: Bonding Cannot Be Functionally Realized:**
      *   **Bonding as Causal Integration:** The phenomenal bonding relation, while primitive, might be *necessarily correlated* with, or even constituted by, specific patterns of causal interaction at the fundamental level. If the prosthetics perfectly replicate the *causal connectivity and information flow* of the biological neurons within the network, they thereby also instantiate the very physical relations that ground or are identical to the bonding relation. The stipulation that bonding "cannot" be functionally realized assumes a radical disconnect between the physical/functional and the phenomenal-relational that a naturalistic panpsychist need not accept. The functional preservation *is* the preservation of the bonding ground. Denying this makes bonding mysteriously epiphenomenal or non-natural.

  This defense *does not* fall back on emergentism. It argues that the panpsychist's core commitments *themselves* imply that functionally identical artificial units must possess relevant intrinsic phenomenal properties (defense 1) and that the bonding relation supervenes on or is realized by the functional/causal structure (defense 2). The scenario's stipulations, the defender claims, illegitimately impose non-panpsychist assumptions onto the panpsychist framework.
