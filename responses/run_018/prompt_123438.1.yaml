answer: |-
  **Bottom line:** This is primarily a **value pluralism dispute** disguised as a single substantive disagreement. Progress requires disentangling distinct "better than" criteria.

  **Diagnosis:**
  1.  **Different Values:** The core isn't one disagreement but conflated valuation criteria:
      *   **Instrumental Value (Practical):** Knowledge is *more reliably useful* for action (Pragmatists, Reliabilists' stability focus).
      *   **Intrinsic Value (Achievement):** Knowledge is *admirable/culturally praiseworthy* (Virtue Epistemologists).
      *   **Credit/Anti-Luck Value:** Knowledge *deserves credit/wasn't accidental* (Anti-luck intuitions, Skeptics).
  2.  **Verbal & Bedrock Elements:** "True belief" ambiguity (e.g., Gettier) is verbal/semantic, *exacerbating* the clash but not causing it. The fundamental clash is over **which value dimension matters most** for deeming belief-state X "better" than state Y. These intuitions feel bedrock.
  3.  **Different Questions:** "Why is K better than TB?" runs together: "Why is K more useful?", "Why is K more admirable?", "Why does K merit credit?"

  **Path to Progress:**
  *   **Distinction & Mapping:** Explicitly separate the value criteria (instrumental, intrinsic, credit) and map which theories primarily address *which* value. Acknowledge they may not be commensurable.
  *   **Framing Shift:** Stop asking *which* state is simply "better." Ask: *"Better for what purpose?"* (guiding action, earning credit, signifying virtue) and *"Better according to which standard of value?"* This reveals the pluralism.
  *   **Drop the Monolithic Question?:** Yes, the *monolithic* question ("Why is K *simply better* than TB?") is likely unresolvable and misleading. Focus shifts to analyzing the distinct values knowledge might (or might not) provide over true belief in specific contexts.

  **Progress = Recognizing the pluralism and reframing questions accordingly.**
