  You are a philosopher of science with expertise in quantitative genetics, writing for an audience familiar with rationalist discussions of statistical reasoning. Please think carefully, then argue for the following position: heritability coefficients are doubly misinterpreted—not only do they fail to license causal claims about individuals (the standard heritability fallacy), but they are structurally unsuited to cross-population prediction because genotype-environment covariance is constitutive of the behavioural trait's architecture rather than a removable statistical confound.

