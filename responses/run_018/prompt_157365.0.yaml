answer: |-
  Heritability coefficients (h²) are fundamentally misinterpreted twice over: they neither justify genetic determinism nor validly predict traits across populations because genotype-environment interplay (rGE) is inherent to the causal architecture, not removable noise. First, a high h² for a trait in a population simply quantifies the proportion of *current phenotypic variance* attributable to genetic differences *within that specific population under its current environment*. It says nothing about the trait's potential for change via environmental intervention for any individual or the population itself; high heritability is entirely compatible with high environmental modifiability if new environments reduce genetic variance or increase environmental effects.

  Second, active and evocative rGE—where genotypes influence environmental exposure or elicit differential treatment—are not statistical confounds corrupting an estimate of "pure" genetic effect. They are core causal pathways through which genes manifest their influence on phenotype. Statistically removing Cov(G,E) doesn't isolate a pre-existing "genetic contribution"; it constructs an artificial counterfactual scenario devoid of these dynamic feedback loops. This fundamentally alters the *meaning* of the residual "genetic" variance component, stripping it of the very mechanisms by which genes often exert their largest effects in real-world contexts.

  Third, h² = VG / VP (where VP = VG + VE + Cov(G,E)) is inherently relational. Its value depends crucially on the relative magnitudes of VG, VE, and Cov(G,E) within a specific population variance structure. Transporting a measured h² to a new population with different environmental variance (VE) or social stratification (which alters Cov(G,E)) is conceptually illegitimate, even if the underlying biochemical genetic effects remain constant. The denominator (VP) shifts, changing the ratio's meaning. A hidden assumption defenders of predictive portability make is that genetic effects operate *independently* of the specific environmental variance context, ignoring that the expression and relative impact of genetic differences are intrinsically context-dependent.
