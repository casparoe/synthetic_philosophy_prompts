answer: |-
  ### Sharpening the Question: Brainstormed Approaches  
  1. **Factor Dominance Under Conflict**: When description length (DL) and perceptual salience (PS) conflict in Bongard problems, which factor dominates human rule selection? (Directly tests dissociability via your "salience decoys".)  
  2. **Prior Strength via Projection Bias**: How strongly do human priors favor DL over PS when both fit the data? (Uses "grue-pairs" to quantify prior bias, framing Goodman's problem empirically.)  
  3. **Cognitive Cost Trade-offs**: Do humans sacrifice DL for PS when perceptual effort exceeds a threshold? (Measures response times/errors in "salience decoys" to model effort.)  
  4. **Language Relativity vs. Perception**: Is rule convergence driven by shared vocabulary constraints or innate perceptual biases? (Manipulates vocabulary primitives in rules while holding PS constant.)  
  5. **Individual Differences in Simplicity**: Do DL/PS weights vary with cognitive traits (e.g., high working memory favors DL)? (Adds psychometric assessments to your experiments.)  

  **Selected Question & Why**  
  I recommend **#1 (Factor Dominance Under Conflict)**. It directly tackles your core insight—that DL and PS are distinct—using your constructs, has clear falsifiability (dominance patterns or null dissociation), and fits the 6-month scope. It avoids the complexity of individual differences (#5) or modeling cognitive effort (#3), and #2/#4 become follow-ups.  

  ---  
  ### Research Proposal: Final Draft  

  **Title**: Dissociating Description Length and Perceptual Salience in Human Rule Learning: A Bongard Problem Approach  

  #### 1. Core Question  
  *Can humans’ rule selection in underdetermined contexts (Bongard problems) dissociate description length (DL) and perceptual salience (PS)? When these factors conflict, which dominates?*  
  - **DL**: Rule complexity in a fixed symbolic vocabulary (e.g., "shapes contain exactly one triangle" = 4 tokens).  
  - **PS**: Perceptual pop-out, quantified by feature-detection latency in pre-tests (e.g., symmetry vs. scattered micro-features).  
  - **Conflict**: Problems where low-DL rules have low-PS, and high-DL rules have high-PS (and vice versa).  

  #### 2. Why Existing Answers Fail  
  - **Bayesian priors**: Assume "simplicity" is unitary (e.g., shorter DL = higher prior). Cannot explain high-DL rules winning if more salient.  
  - **Language relativity**: Rules use *identical* vocabularies; PS varies independently. Vocabulary can’t explain salience effects.  
  - **Perceptual chunking**: Predicts PS should always win, but humans may favor concise rules when PS is equal (e.g., in grue-pairs).  

  #### 3. Method (6 Months, Part-Time)  
  **Month 1: Stimulus Generation & Validation**  
  - Generate 100 Bongard problems using your tool:  
    - **Grue-pairs (20 problems)**: Rules R (target) and R' (foil) agree on 12 training images but disagree on 20 test images. *Manipulate*: R has low-DL, R' has high-DL; PS held neutral.  
    - **Salience decoys (80 problems)**: 2x2 design crossing DL (low/high) and PS (low/high). *Include decoys* (e.g., all images have 5 dots).  
  - **Validation**: Eye-tracking pilot (n=5) to confirm PS manipulation (e.g., high-PS features fixated faster).  

  **Month 2: Pilot Testing (Behavioral)**  
  - Recruit 20 online participants (Prolific).  
  - **Task**: For each problem, view 12 training images → classify 20 test images → describe rule.  
  - **Metrics**: % test images matching DL-predicted vs. PS-predicted rule; response times; rule description accuracy.  
  - **Adjust**: Drop problems with >90% agreement on unintended rules.  

  **Months 3–4: Main Experiment**  
  - **Participants**: 60 adults (30/grue-pairs; 30/salience decoys), based on pilot effect size (target η² > 0.25).  
  - **Design**:  
    - *Grue-pairs*: Classify test images → measure % following R (low-DL) vs. R' (high-DL).  
    - *Salience decoys*: 40 problems/participant (10 per DL/PS cell). Measure rule choice (DL- vs. PS-favored).  
  - **Controls**: Attention checks; vocabulary pretest.  

  **Month 5: Analysis**  
  - **Primary**: Logistic mixed models (rule choice ~ DL + PS + DL:PS + (1|participant)).  
  - **Success criterion**: Significant DL:PS interaction (p < .01) indicating dissociation.  
  - **Secondary**: Response time curves for PS effects; grue-pairs bias (t-test vs. 50% chance).  

  **Month 6: Deliverable Preparation**  
  - **Outputs**: Dataset of Bongard problems (DL/PS annotated); code; preprint.  
  - **Key graphs**: (A) Rule choice heatmap (DL x PS), (B) Grue-pairs prior bias.  

  #### 4. Why This Design?  
  - **Vs. benchmarking vision models**: CNNs/Transformers learn statistical biases, not human-like priors. Your constructs require testing humans.  
  - **Vs. introspection studies**: Rule descriptions are unreliable (e.g., post-hoc rationalization). Classification + response times are objective.  
  - **Grue-pairs + salience decoys**: Cleanly isolate prior bias (grue) from online perception (decoys).  

  #### 5. Successful Deliverable  
  A preprint showing:  
  - **Dissociation**: In salience decoys, PS dominates when DL is high (e.g., 70% choose high-PS rules despite long DL), but DL dominates when PS is equal.  
  - **Prior strength**: Grue-pairs show >65% preference for low-DL rules, proving DL-biased priors.  
  - **Implications**: "Simplicity" isn’t unitary; PS often overrides DL, challenging Bayesian models.  

  #### 6. Failure Criteria  
  - **Null dissociation**: No DL:PS interaction (all rules chosen based on DL *or* PS alone).  
  - **Ceiling effects**: >95% agreement on one factor (e.g., PS always wins).  
  - **Validation failure**: Generated problems don’t manipulate DL/PS independently (e.g., "low-PS" features are still obvious).  
  *This is falsifiable: We state that failure occurs if 0/20 grue-pairs show DL-bias or salience decoys show no crossover.*  

  #### 7. Scope Assessment & Cuts  
  - **Feasibility**: Tight but viable (you have the generator; online participants reduce time). *Not a PhD*: We focus on one dissociation question, not cognitive architecture.  
  - **Cuts to fit 6 months**:  
    - Drop eye-tracking if delays occur (use response times as PS proxy).  
    - Reduce problems (40 salience decoys; 10 grue-pairs).  
    - Skip individual differences (e.g., no cognitive trait measures).  
  - **Risk**: Stimulus generation is hardest; pilot rigorously. If Month 1 fails, pivot to grue-pairs only.  

  ---  
  **Final Proposal Tone**: Lean, hypothesis-driven, and embrace risk. Emphasize that *any* outcome (dominance, dissociation, or null) advances theory by forcing simplicity to be operationalized multi-dimensionally.
