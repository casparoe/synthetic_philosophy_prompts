  We are going to break this down step by step. The user is a backend engineer with a lot of experience in distributed systems and some exposure to philosophy (but not formal training). They have built a Bongard problem generator and want to write a research proposal for a grant. The core idea is to investigate two constructs: "grue-pairs" and "salience decoys" to dissociate two types of simplicity (description length and perceptual salience) in human rule learning.

  The goal of the proposal is to have:
  - A precise question that can be answered.
  - Why existing answers don't settle it.
  - A method broken down by month (for 6 months part-time).
  - Why this design (vs. alternatives like benchmarking vision models or introspection).
  - What a successful deliverable looks like.
  - What would count as failure.
  - Honest scope assessment.

  Step 1: Brainstorm 4-5 ways to sharpen the question.

  We need to take the two constructs and turn them into specific, testable questions.

  Construct 1: Grue-pairs
  - Idea: Generate two rules R and R' that agree on the 12 training examples but disagree on new examples. Then, when showing people the 12 and then 20 new figures to sort, we can see which rule they follow. This is meant to reveal their prior.

  Construct 2: Salience decoys
  - Idea: Create problems where there is an irrelevant but salient feature (like five dots in every panel) and then vary the intended rule to be either short-in-description but hard to see or long-in-description but easy to see. Then, see which one people pick.

  Possible sharpened questions:

  1. How do humans resolve the underdetermination in rule learning? Specifically, do they prefer rules that are shorter in description length or rules that are more perceptually salient?

  2. To what extent are the two factors (description length and perceptual salience) separable in human rule learning? And when they conflict, which one dominates?

  3. Can we quantify the relative contributions of description length and perceptual salience to the perceived simplicity of a rule?

  4. Are description length and perceptual salience two distinct cognitive mechanisms, or do they reflect a single underlying simplicity principle?

  5. How do individual differences (e.g., in cognitive style or expertise) modulate the reliance on description length versus perceptual salience?

  Step 2: Pick one and explain why.

  I would pick question 2: "To what extent are the two factors (description length and perceptual salience) separable in human rule learning? And when they conflict, which one dominates?"

  Why?
  - It directly addresses the user's core idea of dissociating the two types of simplicity.
  - It allows the use of both constructs (grue-pairs and salience decoys) in the same experimental framework.
  - It is testable with the proposed methods and can have a clear outcome (e.g., when they conflict, one dominates, or they trade off in a certain way).
  - It is not too broad and not too narrow.

  Step 3: Write the proposal as if we settled on that question.

  Structure the proposal:

  Title: Dissociating Description Length and Perceptual Salience in Human Rule Learning: A Bongard Problem Approach

  1. Introduction and Question:
     - Bongard problems exemplify rule learning under limited data (underdetermination). Humans converge on one rule despite infinitely many fitting the data. The literature often invokes "simplicity", but we argue that simplicity has two distinct components: the description length of the rule in a shared vocabulary and the perceptual salience of the relevant feature.
     - Question: We aim to investigate whether description length and perceptual salience are dissociable factors in human rule learning and, when they conflict, which factor dominates.

  2. Why existing answers don't settle it:
     - Bayesian prior: While Bayesian models can incorporate priors for simplicity, they typically use a single measure (like description length) and do not account for perceptual salience as a separate factor. Moreover, it's unclear how the prior is formed.
     - Language relativity: Some argue that the rule depends on the language used to describe it. However, we can use a fixed vocabulary and still vary salience independently, showing that the effect is not purely linguistic.
     - Perceptual chunking: This might explain salience, but it doesn't account for why a rule with a longer description might be preferred if it is more salient. Our design explicitly pits these two against each other.

  3. Method (month by month, part-time):

     - Month 1: Pilot stimulus generation and validation.
       - Generate a set of Bongard problems for both constructs:
          a) Grue-pairs: For each problem, generate two rules R and R' that fit the 12 examples but disagree on 20 new test figures. We need to ensure that R is the one that is simpler in description and R' is the one that is complex but fits the data. Also, we must validate that both rules are indeed consistent with the 12.
          b) Salience decoys: Generate problems with an irrelevant salient feature. Then, create two types of intended rules:
             Type A: Short description length but low perceptual salience (e.g., "all figures on the left have exactly one dot that is not connected to any other" which might be hard to see among many dots).
             Type B: Long description length but high perceptual salience (e.g., "all figures on the left have a triangle" which is easy to see even if the description is longer than a simple geometric feature).
          - We'll generate 20 problems of each type and validate them with a small pilot (n=5) to ensure that the intended rules are not immediately obvious and that the decoys are salient.

     - Month 2: Design and pilot testing of the experimental procedure.
       - For grue-pairs: Participants see the 12 training figures (without labels) and then are asked to classify 20 new figures as "left" or "right". We then check which rule (R or R') they followed.
       - For salience decoys: Participants are shown the 12 training figures and then 20 new figures. We measure both the rule they report and the time taken to respond (as a proxy for salience).
       - We will run a pilot with 10 participants to refine the instructions and timing.

     - Month 3-4: Data collection.
       - We aim for 50 participants (online, e.g., Prolific) for each of the two experiments (grue-pairs and salience decoys). Each participant will see multiple problems (say 10 of each type) in a randomized order. We will use a within-subjects design.
       - For grue-pairs: We will measure the proportion of new figures classified according to R vs. R'. We predict that if description length dominates, they will follow R (the shorter rule). But if salience dominates, they might follow R' if it is more salient? Actually, note: in grue-pairs, both rules fit the training data, so the choice on new data is prior-driven. We need to design R to be shorter and R' to be longer, but we also need to independently vary the salience of R vs. R'. This might be tricky. Alternatively, we can design the grue-pairs such that R is shorter and more salient (control) and then conditions where R is shorter but less salient and R' is longer but more salient. But note: the training set doesn't show the salience of the rule? Actually, the training set is the same for both rules. So the salience of the rule might be inherent in the figures. We need to design the figures so that the feature for R is more salient than for R'? But that might be confounded. Alternatively, we can use the salience decoy design to directly pit the two factors.

       - Therefore, we might focus the main experiment on the salience decoy design because it directly manipulates the two factors. The grue-pairs might be used to establish the prior for the rule (without conflict) and then we can see if that prior is modulated by salience? Alternatively, we can integrate the two: in the grue-pairs, we can have conditions where R is more salient and R' is less, and vice versa.

       - Revised plan: We will design four types of problems in a 2x2 design (for the salience decoy experiment):
            Factor 1: Description length of the rule (short vs. long)
            Factor 2: Perceptual salience of the rule (high vs. low)

          We will create:
            - Condition 1: Short description, high salience (control: expected to be chosen)
            - Condition 2: Short description, low salience
            - Condition 3: Long description, high salience
            - Condition 4: Long description, low salience (control: expected to be rejected)

          Then, we will measure which rule participants pick (we can ask them to report the rule and also classify new figures). We predict that in condition 2 and 3, we will see a conflict: in condition 2, even though the rule is short, if it's hard to see, they might not pick it. In condition 3, even though the rule is long, if it's easy to see, they might pick it.

          We can also include grue-pairs as a separate experiment to measure the prior without conflict, but that might be too much for 6 months part-time. So we focus on the 2x2 design.

       - For the salience decoy experiment, we will generate 20 problems per condition (80 total). Each participant will see 20 problems (5 per condition) and we will counterbalance.

     - Month 5: Data analysis.
       - We will use mixed-effects logistic regression to model the probability of choosing the intended rule (or the rule with short description vs. long, and high salience vs. low) as a function of condition and participant random effects.
       - We will also analyze response times and accuracy.

     - Month 6: Write-up and preparation of deliverables.

  4. Why this design?
     - We are not benchmarking vision models because the goal is to understand human cognition. Also, current vision models are not designed for rule learning from limited examples and might not be comparable.
     - We are not running an introspection study because self-reports might not capture implicit processes and might be biased. Our design uses behavioral measures (classification) and response times, which are more objective.

  5. Successful deliverable:
     - A set of validated Bongard problems that dissociate description length and perceptual salience.
     - A clear empirical result: either that the two factors are dissociable and one dominates (e.g., salience trumps description length) or that they are not dissociable (they always align). Either outcome is informative.
     - A preprint of the study and code for generating the problems and running the experiment.

  6. What would count as failure:
     - If we cannot generate problems where the two factors are dissociated (e.g., every time we try to make a rule short but hard to see, it turns out to be easy to see, or vice versa). This would mean our manipulation failed.
     - If participants do not converge on any rule (random performance) in the control conditions, then our problems are too hard.
     - If we find no effect of either factor, that would challenge the idea that these factors play a role in rule learning.

  7. Scope assessment:
     - This is ambitious for 6 months part-time, but doable if we focus.
     - We cut: 
          - The grue-pairs experiment as a separate study and integrate it into the salience decoy design by using the grue-pairs as a way to measure the prior without conflict? But we have to be careful. Alternatively, we focus solely on the salience decoy 2x2 design and leave grue-pairs for future work.
          - Reduce the number of problems per condition (from 20 to 10) and the number of participants (from 50 to 30).
          - We can also use pre-registration and focus on one clear experiment.

     - Revised plan: Focus on the salience decoy 2x2 design with 10 problems per condition (40 total) and 30 participants. Each participant sees 20 problems (5 per condition). This is feasible in 6 months part-time.

  Proposal Draft:

  ---

  **Proposal: Dissociating Description Length and Perceptual Salience in Human Rule Learning**

  **Introduction and Question**

  Bongard problems, invented by computer scientist M.M. Bongard in the 1960s, present a compelling case of human pattern recognition: given twelve figures (six positive and six negative examples), the solver must induce a rule that separates them. The format highlights the problem of underdetermination: infinitely many rules fit the training data, yet humans consistently converge on the same rule. This project investigates the nature of the cognitive biases that resolve this underdetermination. We focus on two candidate factors: (1) the description length of the rule in a shared vocabulary and (2) the perceptual salience of the relevant feature. The central question is: *Are description length and perceptual salience dissociable factors in human rule learning, and when they conflict, which one dominates?*

  **Why Existing Answers Do Not Settle It**

  Bayesian models of concept learning often use a simplicity prior defined by description length (e.g., using a probabilistic context-free grammar). However, they do not account for perceptual salience as an independent factor. Perceptual chunking theories emphasize the ease of feature detection but do not explain why a rule with a longer description might be preferred if it is more salient. Language relativity arguments (e.g., Goodman’s grue paradox) suggest that the choice of rule depends on the vocabulary, but we control the vocabulary and manipulate salience independently. Thus, we can isolate the contribution of each factor.

  **Method**

  We will generate Bongard problems in a 2x2 factorial design, crossing description length (short vs. long) and perceptual salience (high vs. low). We will create 10 problems per cell (40 total). Example:

  - *Short description, high salience:* "All left figures contain a triangle" (visually obvious).
  - *Short description, low salience:* "All left figures have exactly one dot with no adjacent dots" (hard to spot among many dots).
  - *Long description, high salience:* A compound geometric feature that is visually obvious but requires a long description.
  - *Long description, low salience:* A compound feature that is both hard to see and requires a long description.

  *Piloting (Month 1):* Generate and validate problems with small pilot studies (n=5) to ensure that the intended manipulations hold.

  *Experimental Design (Month 2):* Each participant will view 20 problems (5 per condition). For each problem, they will see the 12 training figures and then classify 20 new figures as "left" or "right". We will record classifications and response times.

  *Data Collection (Months 3-4):* We will recruit 30 participants (targeting 90% power to detect a medium effect size) via an online platform. Each session will take about 45 minutes.

  *Analysis (Month 5):* We will use mixed-effects models to predict the probability of choosing the rule based on condition, with random intercepts for participants and problems. We will test for main effects and interactions.

  *Write-up (Month 6):* Prepare a preprint and code repository.

  **Why This Design?**

  We avoid benchmarking vision models because they do not address the cognitive mechanisms at play. We avoid introspection because self-reports are unreliable for implicit processes. Our design uses behavioral measures (classification and response times) to objectively assess rule preference.

  **Deliverable**

  A preprint reporting: (1) validated Bongard problems dissociating description length and salience, (2) empirical results on which factor dominates, and (3) implications for theories of simplicity in cognition. Code and stimuli will be open-sourced.

  **What Would Count as Failure?**

  The project fails if: (1) we cannot generate problems that dissociate the factors (manipulation check fails), (2) participants perform randomly in control conditions, or (3) we find no effect of either factor. Any of these would indicate that our operationalization was flawed or that these factors do not play the role we hypothesized.

  **Scope and Feasibility**

  This project is feasible in six months part-time because we have already built a Bongard generator. We focus on one experiment (the 2x2 design) and limit the number of problems and participants. If time runs short, we will collect fewer participants and report effect sizes with wider confidence intervals.

