answer: |-
  ### Operational Decision Procedure for Advance Directive Conflicts

  **Procedure Overview**: This 7-step algorithm resolves conflicts between advance directives and current preferences within 60 minutes. It prioritizes the advance directive when the current preference falls outside the Zone of Reflective Accessibility (ZORA), defined as preferences irreconcilable with the patient’s documented second-order values. Steps 1–3 are clinical; Steps 4–6 require normative judgment by the ethics committee. Steps 2 and 5 are explicit judgment points.

  ---

  ### Step 1: Confirm Conflict Validity
  **Question**: Does the patient’s current condition unambiguously meet the directive’s stated threshold?  
  **Indicators**:  
  - Sufficient: Directive specifies exact conditions (e.g., "failure to recognize family" confirmed by clinical testing; "severe depressive episode" meeting DSM-5 criteria).  
  - Insufficient: Ambiguous language (e.g., "severe suffering" without definition) or condition not fully met (e.g., patient recognizes one family member).  
  **Termination**:  
  - **Honor directive**: If threshold *not met* (e.g., dementia patient recognizes one child).  
  - **Follow current preference**: If directive is legally invalid or outdated.  
  - **Continue**: If threshold is unambiguously met.  
  **Judgment Call**: None. Pure clinical/legal fact.

  ---

  ### Step 2: Assess Reversibility of Cognitive Change  
  **Question**: Is the cognitive change irreversible based on objective markers?  
  **Indicators**:  
  - *Irreversible*: Advanced dementia (MMSE ≤10, CDR ≥2, or GDS ≥6) with no reversible causes (e.g., normal B12/TSH, no infection). Treatment-resistant depression (≥2 failed adequate antidepressant trials, PHQ-9 >20 for >2 years).  
  - *Reversible*: Delirium (positive CAM), mild cognitive impairment, or acute depression responsive to treatment.  
  **Termination**:  
  - **Honor directive**: If reversible *and* directive explicitly covers reversible states (e.g., "refuse antidepressants *during any episode*").  
  - **Continue**: If irreversible or directive silent on reversibility.  
  **Judgment Call**: **Explicit normative judgment required** when reversibility is uncertain (e.g., "moderate" dementia with mixed biomarkers). Committee must weigh severity/prognosis.

  ---

  ### Step 3: Evaluate Current Decision-Making Capacity  
  **Question**: Can the patient comprehend the intervention, its consequences, and communicate a consistent choice?  
  **Indicators**:  
  - *Capable*: Scores ≥26/30 on ACE-III, understands risks/benefits, consistent preferences across 2 assessments.  
  - *Incapable*: Scores ≤18/30 on ACE-III, or severe depression impairing reasoning (e.g., inability to process treatment benefits).  
  **Termination**:  
  - **Follow current preference**: If patient has capacity (overrides directive).  
  - **Continue**: If incapacitated.  
  **Judgment Call**: None. Clinical assessment.

  ---

  ### Step 4: Biographical Triangulation  
  **Question**: Does the current preference align with ≥2 independently documented values from distinct life stages?  
  **Indicators**:  
  - *Aligned*: Current preference matches values from ≥2 sources (e.g., directive + letter from 20s; directive + sworn testimony from friend/physician).  
  - *Not Aligned*: Contradicts ≥2 sources or only matches one (e.g., fits directive but conflicts with prior living will).  
  **Termination**:  
  - **Honor directive**: If aligned (within ZORA).  
  - **Continue**: If not aligned (outside ZORA).  
  **Judgment Call**: **Explicit normative judgment required** to interpret values (e.g., does "autonomy" imply refusing spoon-feeding?).

  ---

  ### Step 5: Affective Congruence  
  **Question**: Does the patient’s emotional state cohere with the directive’s implied narrative?  
  **Indicators**:  
  - *Congruent*: Directive anticipated suffering, and patient is distressed; or directive valued comfort, and patient is content.  
  - *Incongruent*: Directive anticipated suffering, but patient is content; or directive valued cognition, but patient shows no distress despite cognitive loss.  
  **Termination**:  
  - **Honor directive**: If congruent.  
  - **Continue**: If incongruent (outside ZORA).  
  **Judgment Call**: **Explicit normative judgment required** to define narrative (e.g., does a smile negate "loss of dignity"?).

  ---

  ### Step 6: Severity/Reversibility Weighting  
  **Question**: Does reversibility/severity tip the balance toward the directive despite Steps 4–5?  
  **Indicators**:  
  - *Favor directive*: Reversible condition with high-risk intervention (e.g., ECT refusal in acute depression).  
  - *Favor current preference*: Irreversible condition with low-risk intervention (e.g., spoon-feeding in dementia).  
  **Termination**:  
  - **Honor directive**: If reversible and high-risk.  
  - **Follow current preference**: If irreversible or low-risk.  
  **Judgment Call**: **Explicit normative judgment required** to weigh risks.

  ---

  ### Step 7: Final Recommendation  
  - **Output**: If all steps converge, sign recommendation.  
  - **Deadlock**: If unresolved (e.g., tied votes), default to current preference for low-risk interventions, directive for high-risk.  

  ---

  ### Case Applications
  **Case 1: 74F Alzheimer’s, directive refuses artificial nutrition if she fails to recognize family**  
  - Step 1: Threshold met (no recognition).  
  - Step 2: Irreversible (MMSE=8, no reversible causes).  
  - Step 3: Incapacitated.  
  - Step 4: **Not aligned** – Directive values autonomy; current spoon-feeding acceptance contradicts ≥2 sources (directive + family testimony about lifelong autonomy priority).  
  - Step 5: **Incongruent** – Directive anticipated indignity; patient smiles/content.  
  - Step 6: Irreversible + low-risk → **follow current preference** (spoon-feed).  
  **Recommendation**: Override directive.  
  *Unwelcome outcome*: Directive rejected despite clear threshold.  

  **Case 2: 61F depression, directive refuses antidepressants if requested during episode**  
  - Step 1: Threshold met (severe episode, PHQ-9=25).  
  - Step 2: Reversible (treatment-responsive history).  
  - Step 3: Incapacitated (impaired judgment).  
  - Step 4: **Not aligned** – Current refusal matches directive but contradicts ≥2 sources from remission (gratitude for prior overrides documented by psychiatrist + friend).  
  - Step 5: **Incongruent** – Directive anticipated self-determination; current refusal stems from hopelessness (not values).  
  - Step 6: Reversible + high-risk (suicide risk) → **honor directive** temporarily while treating.  
  **Recommendation**: Override directive (give antidepressants).  

  ---

  ### Limitations and Misfires  
  1. **Unresolvable conflicts**:  
     - Family/surrogate disputes (equal legal standing).  
     - Ambiguous thresholds (e.g., "terminal" in non-cancer diagnoses).  
     - Missing biographical data (e.g., no values from young adulthood).  
  2. **Specific misfires**:  
     - *False negatives*: Honors directive when current preference reflects new values (e.g., dementia patient finds joy in simple pleasures).  
     - *False positives*: Overrides directive due to affective congruence (e.g., depressed patient "smiles" while refusing care).  
  3. **Unwelcome outcome example**:  
     - *Early dementia patient*: Directive refuses antibiotics for pneumonia if "unable to manage finances." Patient now content, enjoys music. Procedure terminates at Step 4 (biographical alignment), honoring directive → preventable death.  

  ---

  **Summary**: The procedure honors an advance directive only when the patient's current preference lies outside a reconstructible zone of consistency with the earlier self's values, after checking reversibility, biographical triangulation, and affective congruence, and it explicitly marks where clinical facts end and normative judgment must take over.
