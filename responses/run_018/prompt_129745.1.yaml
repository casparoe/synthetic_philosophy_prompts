prompt: |-
  After a three-hour argument with a friend last night—she insisted that if my grandmother, now in advanced dementia, smiles when spoon-fed and no longer recognizes her children, then the advance directive she signed a decade ago refusing artificial nutrition in exactly this condition should be treated as a dead letter—I want to convert my opposing view into an operational tool. I serve on a hospital ethics consultation service; we field two or three conflicts per month between documented advance directives and a patient's current expressed preferences, we must deliver a signed recommendation within forty-eight hours that the attending physician and the legal surrogate must both endorse, and I have clinical ethics training but no legal background. I need a reusable decision procedure, not an ad hoc opinion.

  The principle to operationalize is that the authority of the earlier self is conditional rather than absolute: it binds only when the later self's preference falls outside the "zone of reflective accessibility"—defined here as the range of preferences that can be reconstructed, through interpretive charity, as consistent with the earlier self's documented second-order values, weighted by the reversibility and severity of the intervening cognitive change. Within the zone, the directive governs; outside it, the current preference governs, but only after passing procedural checks.

  Please construct a step-by-step procedure my team can execute in under one hour. For each step, specify the exact question, the indicators that count as a sufficient answer, the point at which the procedure terminates with a recommendation to honor the directive, the point at which it terminates with a recommendation to follow the current preference, and the explicit points—clearly marked—where judgment cannot be eliminated and must be referred to the committee's values rather than resolved by clinical fact. The checks must cover: (1) reversibility of the cognitive change (with specific clinical markers); (2) biographical triangulation (whether the current preference aligns with at least two independently documented values from distinct life stages); and (3) affective congruence (whether the emotional quality of the current state coheres with the narrative implied by the directive).

  Apply the procedure to two cases. Case one: a seventy-four-year-old with Alzheimer's who executed a directive refusing artificial nutrition upon failure to recognize her children; she now fails to recognize them, eagerly accepts spoon-feeding, and appears content, while her family argues that she always prioritized autonomy over comfort. Case two: a sixty-one-year-old with recurrent severe depression who executed a directive refusing antidepressant medication if she ever requested it during an episode; she is now in such an episode, explicitly refusing medication, and her psychiatrist documents that in three prior remissions she consistently expressed gratitude that her directive had been overridden.

  State honestly what the procedure cannot settle—such as conflicts between family members with equal legal standing, ambiguity in the directive's threshold conditions, or cases where biographical records are missing—and identify the specific misfires it will produce. Include at least one case where the procedure yields a recommendation you anticipate I will find unwelcome. End with a single final line beginning exactly with "Summary:" followed by one sentence stating the core logic of the procedure.

  Summary: The procedure honors an advance directive only when the patient's current preference lies outside a reconstructible zone of consistency with the earlier self's values, after checking reversibility, biographical triangulation, and affective congruence, and it explicitly marks where clinical facts end and normative judgment must take over.
reasoning: |-
  We are constructing a step-by-step procedure for the hospital ethics consultation service to resolve conflicts between documented advance directives and a patient's current expressed preferences. The core principle is that the advance directive (earlier self) binds only when the later self's preference falls outside the "zone of reflective accessibility" (ZORA). The ZORA is the range of preferences that can be reconstructed as consistent with the earlier self's documented second-order values, weighted by the reversibility and severity of the cognitive change.

  The procedure must be executed in under one hour and must include steps covering:
  1. Reversibility of the cognitive change (with specific clinical markers)
  2. Biographical triangulation (whether the current preference aligns with at least two independently documented values from distinct life stages)
  3. Affective congruence (whether the emotional quality of the current state coheres with the narrative implied by the directive)

  The procedure will terminate with a recommendation to either honor the directive or follow the current preference.

  We'll break the procedure into steps. Each step will specify:
  - The exact question to answer
  - Indicators that count as a sufficient answer
  - The point at which the procedure terminates with a recommendation to honor the directive
  - The point at which it terminates with a recommendation to follow the current preference
  - Explicit points where judgment is required and must be referred to the committee's values

  Additionally, we'll apply the procedure to two cases and identify limitations and misfires.

  ---

  **Step-by-Step Procedure**

  **Step 0: Preconditions**
  - Confirm that there is a conflict: the advance directive explicitly refuses a specific intervention in the current condition, but the patient currently expresses a preference for (or does not resist) that intervention, or vice versa.
  - Verify that the directive is legally valid and applicable to the current condition (if not, the procedure terminates with a recommendation to follow the current preference, but we assume this has been done).

  **Step 1: Assess Reversibility of Cognitive Change**
     - **Question:** Is the cognitive change that has occurred reversible or irreversible?
     - **Indicators:**
       - *Irreversible:* Conditions such as advanced dementia (e.g., Alzheimer's disease at GDS stage 6 or 7, CDR 2 or 3, or MMSE ≤10) with no evidence of reversible causes (e.g., delirium, infection, metabolic disturbances) after appropriate workup. For depression, if the episode is treatment-resistant and has persisted for an extended period despite adequate trials of treatment, and the condition is deemed chronic and irreversible.
       - *Reversible:* Conditions such as delirium, acute depressive episode that is known to respond to treatment, or mild cognitive impairment that may be reversible (e.g., due to medication side effects, vitamin deficiency) and for which treatment is available and not refused by the directive.
     - **Termination points:**
       - If the cognitive change is *reversible* and the patient has decision-making capacity (to be assessed in Step 2, but note: if reversible, we may wait for reversal if safe and feasible, but the directive might refuse intervention during the reversible state) -> proceed to Step 2.
       - *Note:* In the case of reversible conditions, the advance directive might specifically refuse intervention even during the reversible state (e.g., refusal of antidepressants in a depressive episode). However, if the cognitive change is reversible and the directive does not explicitly cover the reversible state, then the current preference might be given more weight. But our procedure must account for the directive's threshold conditions.
       - **Explicit Judgment Point:** The assessment of reversibility requires clinical judgment and may require consultation with the treating physician. If there is uncertainty about reversibility, the committee must use its judgment (factoring in the severity of the condition and the potential for recovery) to decide whether the change is effectively irreversible for the purpose of the directive.

     - **Continuation:** Proceed to Step 2.

  **Step 2: Determine Current Decision-Making Capacity (if applicable)**
     - *Note: This step is critical because if the patient currently has decision-making capacity, then the current preference should generally override the directive. However, our principle is about the authority of the earlier self, so we must consider that even with current capacity, the earlier directive might bind if the current preference is outside the ZORA. But note: in many jurisdictions, a patient with current capacity can revoke an advance directive. Therefore, we must check:*
     - **Question:** Does the patient currently have the capacity to make medical decisions regarding the specific intervention in question?
     - **Indicators:** Ability to understand the relevant information, appreciate the consequences, reason about options, and communicate a choice (standard capacity assessment). For patients with dementia, if they cannot recognize family and have significant cognitive impairment, they are likely to lack capacity. For depression, if the patient's judgment is impaired by the depression (e.g., hopelessness, inability to appreciate the potential for improvement) then capacity may be impaired.
     - **Termination points:**
       - If the patient *has capacity* and clearly expresses a preference (whether consistent with the directive or not), then the current preference governs. The procedure terminates with a recommendation to follow the current preference. (This is because a capacitated patient can revoke an advance directive.)
       - If the patient *lacks capacity*, proceed to Step 3.
     - **Explicit Judgment Point:** Assessing capacity can be complex and requires clinical judgment. If there is uncertainty, the committee must consult a psychiatrist or use its best judgment.

  **Step 3: Biographical Triangulation**
     - **Question:** Does the patient's current preference align with at least two independently documented values from distinct life stages?
     - **Indicators:**
       - *Independently documented values:* Evidence from written documents (e.g., advance directive, personal letters, diaries, recorded conversations) or reliable witness testimony (from family, friends, or healthcare providers) about the patient's values at different life stages (e.g., young adulthood, middle age, recent past).
       - *Alignment:* The current preference (e.g., accepting spoon-feeding) must be consistent with at least two documented values (e.g., "I value comfort and avoiding suffering" or "I would not want to live if I couldn't recognize my family"). The values must be from distinct life stages (e.g., one from young adulthood and one from middle age, or two from different decades).
     - **Termination points:**
       - If the current preference *is aligned* (i.e., falls within the ZORA) -> then the advance directive governs. Terminate with a recommendation to honor the directive.
       - If the current preference *is not aligned* (i.e., it contradicts the documented values from at least two distinct life stages) -> then the current preference is outside the ZORA. Proceed to Step 4.
     - **Explicit Judgment Point:** Interpretation of the patient's values and whether the current preference aligns requires normative judgment. The committee must decide if the current preference can be charitably interpreted as consistent with the earlier values.

  **Step 4: Affective Congruence**
     - **Question:** Does the emotional quality of the patient's current state cohere with the narrative implied by the advance directive?
     - **Indicators:**
       - *Affective congruence:* The directive might imply a narrative of avoiding suffering or maintaining dignity. If the patient now appears content (e.g., smiling, calm) and the directive was motivated by fear of suffering, then the current state may be congruent. Conversely, if the directive was motivated by a desire to avoid a state of severe distress and the patient is now in severe distress, that might be congruent. But if the directive was motivated by a fear of losing autonomy and the patient is now content but completely dependent, that might be incongruent.
       - *Incongruence:* If the emotional state is the opposite of what the directive anticipated (e.g., the directive assumed the condition would be unbearable, but the patient is now happy) then there is incongruence.
     - **Termination points:**
       - If there is *congruence* (the emotional state is as anticipated or can be reconciled with the directive's narrative) -> then the advance directive governs. Terminate with a recommendation to honor the directive.
       - If there is *incongruence* (the emotional state contradicts the narrative of the directive and cannot be reconciled) -> then the current preference is outside the ZORA. Proceed to Step 5.

  **Step 5: Procedural Checks for Following Current Preference**
     - **Question:** Are there any reasons to override the current preference even though it is outside the ZORA?
     - **Checks:**
       - *Reversibility:* If the cognitive change is reversible, then we might be more inclined to follow the directive because the current preference may be temporary. (But note: Step 1 already assessed reversibility. We factor that in here again because even if the current preference is outside the ZORA, if the condition is reversible, we might wait and reassess.)
