     - **Explicit Judgment Point:** This step requires weighing the reversibility and severity again, and the committee must use its judgment.

  **Step 6: Final Recommendation**
     - If the procedure has not terminated by now, then the committee must deliberate and make a recommendation based on the evidence gathered. The default is to follow the current preference if it is outside the ZORA and the condition is irreversible and severe.

