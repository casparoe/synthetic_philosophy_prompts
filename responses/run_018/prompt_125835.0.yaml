answer: |-
  Here's the core technical specification for a robust dialetheic/paraconsistent logic, separating hard requirements from preferences and mapping the key tensions:

  **I. Mandatory Use Cases (Handle These Correctly)**
  1.  **Semantic Paradoxes:** The Liar ("This sentence is false") and its variants (Strengthened Liar, Liar Cycles) must be resolvable *without* triviality (explosion). The logic must assign a coherent semantic status (e.g., true, false, both) that avoids inconsistency spreading universally.
  2.  **Naive Comprehension/Set Theory:** The paradoxes (Russell's Set, Burali-Forti) must be contained. The logic must allow sets defined by `{x | P(x)}` without collapse, meaning `R ∈ R ∧ R ∉ R` must be a tolerable *local* contradiction within the system without leading to `P ∧ ¬P` for arbitrary `P`.
  3.  **Normative Conflicts:** Must handle genuine, unresolvable conflicts between valid rules/obligations. E.g., Statute A mandates action X in situation S, Statute B mandates action ¬X in S; both statutes are deemed applicable and authoritative in S. The logic must model `Obligation(X) ∧ Obligation(¬X)` as a *real normative contradiction*, not mere ambiguity or under-specification.

  **II. Mandatory Distinctions (Cannot Collapse These)**
  1.  **Contradiction (`A ∧ ¬A`) vs. Ambiguity:** Must distinguish between a proposition being genuinely true-and-false vs. being underspecified or context-dependent (e.g., "The bank is open" - financial institution vs. river edge).
  2.  **True Contradiction (Glut) vs. False Contradiction (Gap):** Must distinguish `A ∧ ¬A` being *true* (a dialetheia) from it being *false* (meaning neither A nor ¬A holds, a truth-value gap). The logic needs resources to express and reason about these differences.
  3.  **Explosion Source:** Must identify *why* explosion is blocked (e.g., rejection of Disjunctive Syllogism, non-adjunctive approach, designated values) and prevent it *only* where necessary, not universally disable inference. Blocking explosion is non-negotiable.

  **III. Classical Logic Interface (Preserve or Reject with Justification)**
  *   **Must Preserve (Within Consistent Domains):**
      *   **Conjunction Introduction/Elimination:** If `A` and `B` are both true (and consistent), then `A ∧ B` is true. If `A ∧ B` is true, then `A` is true and `B` is true. *(Justification: Core meaning of "and")*
      *   **Disjunction Introduction:** If `A` is true, then `A ∨ B` is true. *(Justification: Core meaning of "or")*
      *   **Double Negation Elimination:** If `¬¬A` is true, then `A` is true. *(Justification: Avoids unnecessary gaps; aligns with most dialetheist views on negation strength)*
  *   **Must Explicitly Reject:**
      *   **Principle of Explosion (Ex Contradictione Quodlibet - ECQ):** `(A ∧ ¬A) → B` *must* be invalid. *(Justification: Core requirement of paraconsistency; otherwise, contradictions trivialize the system)*
      *   **Law of Non-Contradiction (LNC) as a Logical Truth:** `¬(A ∧ ¬A)` *cannot* hold universally. *(Justification: Dialetheism's core thesis; some contradictions are true. It might hold for specific `A`).*
  *   **Negotiable/System-Dependent:**
      *   **Disjunctive Syllogism (DS):** `(A ∨ B), ¬A ⊢ B`. Often rejected to block ECQ (as `(A ∨ B) ∧ ¬A` implies `(A ∧ ¬A) ∨ B`, and rejecting DS blocks deriving `B` from `A ∧ ¬A`). Preserving DS requires careful constraints (e.g., consistency premises) or alternative explosion-blocking mechanisms. *Highly contentious.*
      *   **Modus Ponens (MP):** `A, A → B ⊢ B`. Usually preserved, but *can* be restricted in some very weak systems or with non-detachable conditionals. Preservation is generally a **strong preference**.
      *   **Material Conditional:** The definition of `A → B` (often as `¬A ∨ B`) might be rejected in favor of a stronger (e.g., relevant) conditional to avoid paradoxical implications like `A → (B → A)`.
      *   **Universal Validity of Excluded Middle (LEM):** `A ∨ ¬A`. Dialetheists often accept it, but paraconsistentists *may* reject it to accommodate gaps. Acceptance is a **common preference** but not universal.

  **IV. Edge Case: Database Timestamp Glitch**
  *   The logic must provide tools to analyze "Record updated at T and not updated at T".
  *   **Requirement:** It must *not* automatically classify this as a true contradiction (`A ∧ ¬A`). It must allow for the possibility of:
      1.  **Meta-linguistic Ambiguity:** "Updated" could mean different things (e.g., data modified vs. log entry written).
      2.  **System Glitch:** A single source reporting conflicting states due to error.
      3.  **Genuine Glut:** A state where the update process is fundamentally paradoxical (e.g., partial update visible to some transactions, not others, at the *exact same* logical time T).
  *   **Distinction Test:** The theory must guide whether the contradiction arises from faulty *description* (1, 2) or represents a true inconsistent *state of the world* (3). Simply calling it a glut or a gap isn't sufficient; justification based on the logic's semantics is needed.

  **V. Preferences vs. Requirements**
  *   **Hard Requirements:** Blocking ECQ, Handling Mandatory Use Cases (1,2,3), Maintaining Mandatory Distinctions (1,2,3), Preserving core conjunction/disjunction rules, Rejecting universal LNC.
  *   **Priest-Style Preferences:**
      *   **Universal Dialetheism:** True contradictions are *possible* everywhere (requirement), but asserting they are *actual* everywhere (e.g., at the quantum level, in motion) is a preference.
      *   **Relevance:** Requiring premises to be *meaningfully connected* to conclusions (rejecting `A → (B → A)`, `¬A → (A → B)`). Highly desirable for many, but strict relevance often conflicts with preserving full MP or DS.
      *   **Classical Recapture:** The ability to *regain* full classical reasoning within domains proven consistent. A strong preference for usability, not a core requirement.
      *   **Acceptance of LEM:** While rejecting universal LNC, accepting universal LEM is a common preference (Priest accepts it).

  **VI. The Impossibility Cluster (Mapping the Tension)**
  *   **The Core Tension:** Avoiding ECQ (`(A ∧ ¬A) → B` invalid) while maintaining robust reasoning power.
  *   **The Impossible Triad (Specific Manifestation):**
      1.  **No Explosion (ECQ Invalid):** Paraconsistency requirement.
      2.  **Full Modus Ponens (MP):** `A, A → B ⊢ B` holds universally.
      3.  **Strong Relevance:** The conditional `→` is relevant (premises and conclusion share variables), *and* Disjunctive Syllogism (DS) is preserved (`(A ∨ B), ¬A ⊢ B`).
  *   **Why Impossible?**
      *   Assume `A` is a true contradiction (`A ∧ ¬A` true).
      *   `A` implies `A ∨ B` for any `B` (by Disjunction Introduction).
      *   We have `¬A` true (since `A ∧ ¬A`).
      *   If **DS** holds, we can derive `B` from `A ∨ B` and `¬A`.
      *   Therefore, from `A ∧ ¬A`, we derive arbitrary `B` (**Explosion**).
  *   **Resolution (Forced Choice):** To avoid explosion (1) while keeping MP (2), you **must** reject *at least one* of:
      *   **Option A:** Reject **DS** (the standard route for many paraconsistent logics like LP). This weakens reasoning but preserves relevance.
      *   **Option B:** Reject **Strong Relevance** for the conditional. If `A → (A ∨ B)` or `¬A → (¬A)` are irrelevant (e.g., material conditional), then deriving `A ∨ B` from `A` or using `¬A` might be deemed "irrelevant" and blocked. This preserves DS *if* the premises are consistent, but requires complex consistency checks or non-relevant conditionals. MP (`A, A → B ⊢ B`) might hold, but `A → B` itself may be irrelevant.
  *   **Consequence:** You **cannot** have a paraconsistent logic that validates ECQ, MP, DS, *and* enforces strong relevance without triviality. The tension between containment (no explosion) and classical power (MP, DS) forces a trade-off, often amplified by relevance demands.
