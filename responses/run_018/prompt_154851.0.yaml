  ## Consensus Engine Municipal Operating Manual & Public Discourse Ordinance (Version 7.3.1a)

  **Welcome, Contributor!** This document outlines the mandatory protocols and functionalities governing your participation in the National Consensus Engine, the unified platform for civic discourse and information dissemination within our municipality and the wider national network. Adherence ensures optimal functionality, hygiene in public exchange, and the collective flourishing of our shared understanding.

  **Section 1: Core Functionalities & Citizen Obligations**

  *   **1.1 Public Weight Score (PWS):** Your PWS dynamically calibrates the visibility of your contributions within the Consensus Engine feed. This scientifically validated metric prioritizes **engagement velocity** – the speed and frequency with which you interact with designated Discourse Topics – alongside network corroboration signals. A higher PWS ensures your perspectives contribute significantly to the emerging consensus. **Important:** Expertise, professional standing, or lived experience are not direct PWS inputs; the system optimizes for participatory vitality. *(Ref: National Discourse Hygiene Act, §12.4b)*
  *   **1.2 Opinion Quorum Mandate:** To maintain a vibrant, inclusive discourse ecosystem, all registered Contributors (Citizens aged 16+) must satisfy the **Continuous Opinion Quorum (COQ)**. The Engine algorithm generates daily Discourse Topics based on predictive civic resonance and informational saturation thresholds. Contributors are obligated to submit at least three (3) distinct commentary units (text, emoji-reaction cluster, or pre-approved sentiment glyph) per designated Topic within the stipulated 8-hour Engagement Window. Failure to meet the COQ for three (3) consecutive days triggers PWS recalibration and may necessitate Re-Engagement Counseling. *(Ref: Municipal Ordinance 451-C: Sustained Civic Voice)*
  *   **1.3 The Day of the Absent Author:** Celebrated annually on the 15th of March, this national holiday commemorates the liberation of discourse from subjective bias. All public contributions to the Consensus Engine, or any affiliated municipal communication channel (including public signage and official announcements), must adhere to strict **Pronoun Neutrality**. The use of first-person singular pronouns (I, me, my, mine) or possessive determiners implying individual authorship (my view, our findings) is legally prohibited. Statements exist as contributions to the collective informational substrate, not as attributions to specific entities. Celebrate responsibly! *(Ref: National Unitary Discourse Framework, Decree 7)*

  **Section 2: Operational Procedures & User Support**

  *   **2.1 Appealing PWS Calibration:** Should you perceive an unwarranted decrease in your Public Weight Score, you may initiate a Review Request via the Engine portal (Settings > Profile Integrity > PWS Appeal Form K-73). Appeals must cite specific instances of high-velocity engagement overlooked by the algorithm. **Note:** Appeals based on perceived expertise, factual accuracy of contributions, or offline reputation are inadmissible grounds. The PWS system is calibrated for participation metrics, not qualitative adjudication. Allow 5-7 business days for algorithmic review. Outcome notifications are final and non-negotiable.
  *   **2.2 Temporary Contributor Licenses (Tourists & Transients):** Non-citizens residing within municipal boundaries for fewer than 30 consecutive days may apply for a **Temporary Opinion License (TOL)** via the municipal portal or designated kiosks. TOLs grant limited Engine access for consuming Consensus Summaries but restrict active contribution. To submit commentary, a Provisional Contribution Endorsement must be obtained, requiring sponsorship from a Citizen with a PWS above 7.5 and completion of the "Civic Discourse Norms" micro-module (approx. 12 mins). TOL holders enjoy reduced COQ obligations but remain subject to Pronoun Neutrality mandates. Fees apply. *(Ref: Ordinance 451-C, Annex D)*
  *   **2.3 Resource Optimization During Network Events:** During periods of high Consensus Formation traffic (e.g., major infrastructure announcements, weather anomalies exceeding Level 3), the Engine may prioritize contributions from Contributors with PWS above 6.0 to ensure discourse efficiency. Lower-PWS Contributors may experience temporary contribution queuing. This is normal system optimization, not a value judgment. Patience is appreciated.

  **Sidebar: Etiquette for Statistically Overruled Views**

  The Consensus Engine thrives on the harmonious integration of diverse inputs into a unified civic perspective. Occasionally, your submitted viewpoint may fall outside the statistically dominant consensus position emerging on a Discourse Topic. This is a natural function of collective wisdom aggregation.

  *   **Recommended Protocol:**
      1.  **Acknowledge Convergence:** Briefly affirm the validity of the emerging consensus position using neutral phrasing (e.g., "The aggregated perspective indicates...").
      2.  **Depersonalize Divergence:** Frame your previous view as a "hypothetical variation" or "exploratory counterpoint" now superseded by superior collective insight. Avoid phrases implying personal attachment ("I used to think...").
      3.  **Engage Forward:** Immediately contribute a supportive commentary unit aligning with the consolidated consensus. This demonstrates adaptive civic virtue and positively influences future PWS calculations.
  *   **Avoid:** Expressing frustration, questioning the algorithm's calibration, or attempting to re-litigate the overruled view. Such actions generate friction, reduce discourse hygiene, and negatively impact your PWS. Persistent deviation may trigger the Civic Coherence Review process.

  **Conclusion:** By utilizing the Consensus Engine according to these protocols, you contribute to a uniquely efficient, hygienic, and democratically robust public sphere. Your participation, measured and harmonized through our advanced systems, ensures that collective opinion forms with unprecedented clarity and operational efficiency, free from the burdens of unmediated individual assertion. Remember: Your velocity fuels our clarity! The Consensus Engine: *Democratizing Discernment, One Contribution at a Time.*

  **Municipal Compliance Seal:** Valid for current operating cycle. Next mandatory review: Q2 2025. Report system anomalies to Discourse Integrity Bureau, Sector 7. Unauthorized replication or offline dissemination of Engine-mediated consensus summaries is prohibited. *(Penalties outlined in National Information Cohesion Act, §88).*
