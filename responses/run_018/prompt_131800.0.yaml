answer: |-
  Here’s a disciplined analysis of the UK vaccine episode through the lens of nationalism-cosmopolitanism, structured to address your core questions:

  ---

  ### **1. Key Agents and Their Moral Claims**
  | **Agent**               | **Nationalist Claim**                                                                 | **Cosmopolitan Claim**                                                                 |
  |-------------------------|--------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------|
  | **UK Government**       | Fiduciary duty to protect citizens; democratic accountability demands domestic priority. | Global obligations to alleviate suffering; hoarding violates distributive justice.     |
  | **British Citizens**    | Special claim via citizenship: state as protector of their welfare ("life-saving partiality"). | Equal moral worth to non-citizens; nationality irrelevant to need-based claims.        |
  | **EU States**           | Partners with reciprocal obligations (security, trade); claims weakened by bloc's capacity. | Competing fiduciary duties to their own citizens; claims subordinate to worst-off globally. |
  | **Global South (COVAX)**| No direct obligation; aid is charitable, not obligatory.                             | Strongest claim based on urgent need, lack of alternatives, and global equity.         |

  ---

  ### **2. Distributive Options & Constraints (Once Manufacturing Began)**
  | **Option**                  | **Mechanism**                                                                 | **Feasibility in 2020–2021 UK Context**                                                                 |
  |-----------------------------|-------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------|
  | **Contractual Priority**    | Enforce UK-first clauses (e.g., AstraZeneca contract).                        | Legally binding; AZ obligated to supply UK before exports.                                              |
  | **Export Restrictions**     | Block doses for export via emergency legislation.                            | Politically defensible domestically; required minimal institutional change.                             |
  | **Compulsory Licensing**    | License patents to global manufacturers (e.g., via WTO waiver).              | Legally complex; opposed by pharma lobby; delayed production (12–18 months).                            |
  | **Phased Export Thresholds**| Release doses once UK coverage hit benchmarks (e.g., 70% adults vaccinated). | Logistically feasible but required advance planning; eventually adopted *post hoc*.                     |
  | **Donations to COVAX**      | Transfer surplus doses via Gavi/WHO.                                          | Implemented only after domestic demand plateaued (mid-2021).                                            |

  ---

  ### **3. Payoff Structures Under Competing Frames**
  | **State's Role**                | **Distributive Choice** | **Payoffs**                                                                                                |
  |---------------------------------|--------------------------|------------------------------------------------------------------------------------------------------------|
  | **Fiduciary (Nationalist)**     | Prioritize UK supply    | **✓** Prevents domestic deaths; maintains public trust.<br>**✗** Accelerates global vaccine apartheid; strains diplomacy. |
  | **Global Agent (Cosmopolitan)** | Allocate by need        | **✓** Saves more lives globally; models solidarity.<br>**✗** Violates democratic mandate; risks voter backlash.        |

  ---

  ### **4. Moral vs. Institutional Partiality: The Contractual Mechanism**
  - **Institutional Partiality Argument**:  
    The AZ contract (with UK-first clauses) structurally limited the state’s options. Even if ministers acknowledged equal moral worth globally, **democratic institutions constrained action**:  
    - Contracts bound the state legally.  
    - Voters expected "their" paid-for vaccines first.  
    - Export controls were path-dependent on prior institutional choices.  
    → *Partiality arose from institutional design*, not necessarily moral superiority claims.  

  - **Moral Partiality Argument**:  
    Ministers’ rhetoric ("protect British lives") framed citizens as *inherently* more entitled. Defending export bans *beyond contractual obligations* (e.g., blocking COVAX shipments) suggests a belief in stronger moral claims.  
    → *Collapses into moral nationalism* when legal necessity is exceeded.  

  **Verdict**: The episode begins as institutional partiality (contracts + procurement law) but escalates to moral partiality when restrictions persist after UK vulnerable groups were covered.  

  ---

  ### **5. Theoretical Breakdown: The Surplus-Donation Timing Anomaly**
  - **Moderate Nationalism** (e.g., David Miller):  
    Predicts priority until "sufficient coverage" is achieved. *But* fails to explain why surplus wasn’t released earlier once UK’s elderly/vulnerable were vaccinated (March 2021), rather than waiting for general demand to fall (July 2021).  

  - **Strong Cosmopolitanism** (e.g., Peter Singer):  
    Demands immediate redistribution by need. Cannot account for the delay without conceding nationalist pressures (e.g., fear of new variants, political caution).  

  **The Anomaly**: The lag between domestic saturation and global redistribution exposes a **democratic accountability gap** in cosmopolitan theory: elected governments cannot ignore voters’ expectations of ongoing "insurance" against uncertainty, even after thresholds are met.  

  ---

  ### **6. What the Episode Reveals About Theory**
  - **Confirmation**: Special claims *are* institutionally mediated.  
    The AZ contract—not raw moral desert—initially justified priority. This affirms institutionalist views (e.g., Nagel’s "bounded obligations").  

  - **Gap in Cosmopolitanism**: Democratic accountability forces temporal sequencing ("us first, then others") that cosmopolitanism dismisses as immoral but cannot circumvent in practice.  
    - **Visible Tension**: The UK released doses *only* when domestic political risk dissipated, revealing that legitimate global obligations still require domestic "permission structures."  

  - **Nationalism’s Blind Spot**: Defending export bans while UK doses were temporarily unused (e.g., storage in March 2021) undermines moderate nationalism’s claim that priority is tied to *urgent* need.  

  ---

  ### **Conclusion: Theoretical Implications**
  1. **Institutions Shape Moral Possibilities**: Contract law and electoral incentives create "permissible partiality" even if moral claims are equal.  
  2. **Cosmopolitanism’s Democratic Deficit**: Without mechanisms to align global duties with domestic accountability (e.g., pre-negotiated equity triggers), states default to sequenced distribution.  
  3. **Hybrid Approach Needed**: A "moderate cosmopolitan nationalism" (e.g., Cabrera) that embeds global obligations into domestic institutions (e.g., pandemic treaties with equity clauses) better explains the outcome than pure theories.  

  The UK episode ultimately shows that **institutional design mediates moral commitments**, but unexamined nationalism fills gaps when institutions are silent.
