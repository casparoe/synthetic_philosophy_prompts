prompt: |-
  You are acting as an expert debate coach in ancient political philosophy and democratic theory, with particular attention to the rhetoric of interdisciplinary seminars. Before you structure your response, spend a moment brainstorming: identify the disciplinary commitments of each subgroup in the audience, the vocabulary they will use to defend those commitments, and the emotional or intellectual stakes that will make them push back hardest.

  Next week I present at a seminar on democratic epistemology and classical Athens. My thesis is that the Mytilene debate, the decision to launch the Sicilian Expedition, and the trial and execution of Socrates should not be treated as three isolated moral or strategic failures, but as manifestations of a single structural deficit in Athenian direct democracy: the absence of institutional mechanisms requiring what I call tri-temporal justification, by which I mean that a decision had to be defensible not only to the present assembly or jury, but simultaneously to future citizens and to the dead—the victims, ancestors, and the long arc of civic memory. In the Mytilene case, the assembly could reverse a decision to destroy an entire population within a day because no procedural brake forced them to justify either course to posterity; in the Sicilian debate, warnings about strategic overreach were heard but could be overridden by immediate imperial enthusiasm because the institutional framework did not require defenders of the expedition to answer to a future ruined empire; and in Socrates’s trial, the dikasterion could condemn a philosopher without being structurally required to justify that killing to later generations who would have to live with the civic shame.

  My audience will include: (1) classicists who read Thucydides closely and treat the Mytilene debate as a paradigmatic study in democratic self-correction rather than failure; (2) democratic theorists committed to participatory governance who will hear structural deficit as coded elitism and tri-temporal justification as an anachronistic philosophical import; and (3) a legal historian of Athens who will object that the dikasterion and the ecclesia operated under entirely different institutional logics, so my synthesis collapses three distinct procedural contexts into one false pattern.

  Please prepare me for the objections I will actually face, ordered from most likely and damaging to least damaging, but including the one I am secretly hoping nobody raises. For each objection, provide: the objection phrased roughly as that subgroup would phrase it, using their vocabulary; whether I should concede any part of it up front, and exactly what concession is safe; a concise reply deliverable in Q&A time; and a brief note on the weakest point in that reply so I do not rely on it blindly. Then identify the single reply that must land for my proposal to survive the session, and identify the weakest point in my own overall position that I should prepare to defend rather than hope they overlook.

  Keep this a practical prep sheet, not a full defense: I need to know what is coming, in whose voice, where I can yield ground without losing the argument, and where I am most exposed.
