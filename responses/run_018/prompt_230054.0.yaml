    But the driver, at an exit, would not want to follow p=2/3 because he would prefer to exit. Therefore, the plan is not sequentially rational.

    The literature on the absent-minded driver problem discusses this issue. One approach is to require the plan to be consistent with the driver's beliefs and the actions. This leads to a fixed-point: the driver's value V is defined as above, and then the driver will choose p to maximize his expected utility at the exit given his beliefs, which depend on p. 

    In other words, the driver at an exit chooses a mixed strategy p to maximize:

          (1-p) * (4q) + p * [ (1-q)*V + q*1 ]

    but V itself is a function of p: V = (1-p)*(4q) + p*[ (1-q)*V + q*1 ]

    and q = p/(1+p).

    This is circular. We need to solve for p and V simultaneously.

    We have:

          V = (1-p) * (4q) + p * [ (1-q)*V + q*1 ]

          where q = p/(1+p)

    Let us write:

          V = (1-p)*4*(p/(1+p)) + p * [ (1 - p/(1+p)) * V + (p/(1+p)) * 1 ]

          Simplify: 
            = 4p(1-p)/(1+p) + p * [ ( (1+p - p)/(1+p) ) * V + p/(1+p) ]
            = 4p(1-p)/(1+p) + p * [ (1/(1+p)) * V + p/(1+p) ]

          = 4p(1-p)/(1+p) + (p/(1+p)) * V + p^2/(1+p)

          Bring terms with V to the left:

          V - (p/(1+p))V = [4p(1-p) + p^2]/(1+p)

          V * (1 - p/(1+p)) = [4p - 4p^2 + p^2]/(1+p)

          V * ( (1+p) - p ) / (1+p) = (4p - 3p^2)/(1+p)

          V * (1) = 4p - 3p^2

          So: V = 4p - 3p^2.

    This is the same as the ex ante value. Now, the driver at an exit chooses p to maximize:

          U(p) = (1-p) * (4q) + p * [ (1-q)*V + q*1 ]

          But we just found that V = 4p-3p^2, and q = p/(1+p). So we can write U(p) in terms of p.

    Alternatively, note that the driver's utility U(p) is exactly V, because it is the expected value at the exit. And we have V=4p-3p^2. So the driver will choose p to maximize V=4p-3p^2. The maximum is at p=2/3, and then V=4*(2/3)-3*(4/9)=8/3-12/9=8/3-4/3=4/3.

    Therefore, the driver at the exit, if he believes that the plan is p, and that the value V is 4p-3p^2, and if he chooses p to maximize V, then he will choose p=2/3.

    But how does he know that V=4p-3p^2? He doesn't know p? The issue is that the driver is part of a population or is committed to a plan? Or it is an equilibrium in beliefs.

    This is the approach of consistent planning: the driver chooses p at the exit to maximize his expected utility, and he has a belief about V. But V depends on the p he chooses and also on the p that he will use at future exits. Since the driver is identical at every exit, he will use the same p. Therefore, the driver must choose a p that is a fixed point: the p that is optimal given that he will use the same p in the future.

    In this case, the function to maximize is V=4p-3p^2, and the maximum is at p=2/3. So the driver will choose p=2/3. Therefore, the plan is sequentially rational.

    But then what is the driver's expected value of continuing? It is:

          [ (1-q)*V + q*1 ]   [with V being the value under the chosen p=2/3, which is 4/3]

          = (1-2/5)*(4/3) + (2/5)*1 = (3/5)*(4/3) + 2/5 = 4/5 + 2/5 = 6/5.

    And the expected value of exiting is 8/5.

    But 6/5 != 8/5. So how can the driver be indifferent? He is not. He strictly prefers to exit (8/5 > 6/5). But then why would he choose p=2/3? 

    The catch is that the driver is not choosing an action at the exit; he is choosing a mixed strategy p. And by choosing p, he gets an overall expected value of V=4p-3p^2. If he were to choose p=1 (always exit), then V=4*1-3*1=1. If he chooses p=0, V=0. If he chooses p=2/3, V=4/3≈1.333, which is better than 1. So even though at the exit the driver would strictly prefer to exit (if he were forced to choose an action), by committing to a mixed strategy he gets a higher overall value.

    This seems to be the resolution.

    But then commitment (6) requires that the action prescribed at the information set maximizes expected utility. Here, the action "exit" yields 8/5=1.6 and the action "continue" yields 6/5=1.2. So the action "exit" yields more. Then why is the mixed strategy p=2/3 part of a plan that satisfies (6)?

    The subtlety is that commitment (6) says: "the action it prescribes there maximizes expected utility relative to the agent's beliefs at that information set". But the plan prescribes a mixed strategy: to continue with p=2/3 and exit with 1/3. The agent, however, is not choosing an action but a mixed strategy. The mixed strategy as a whole yields V=4/3. If he were to choose a different mixed strategy, say always exit (p=0 for continuing, i.e., exit with probability 1), then he would get V=4*0-3*0^2=0. But that is not the expected utility at the information set? 

    Alternatively, we might interpret the plan as prescribing a lottery at the information set. The lottery of continuing with probability p and exiting with probability 1-p has expected utility: 
          (1-p)*(8/5) + p*(6/5) = (8/5) - (2p/5) + (6p/5) = 8/5 + (4p/5) ??? 
    That doesn't seem right.

    Actually, the expected utility of the mixed strategy at the information set is:

          (1-p) * (expected utility of exiting) + p * (expected utility of continuing)
          = (1-p)*(8/5) + p*(6/5) = (8/5)(1-p) + (6/5)p = (8/5) - (8/5)p + (6/5)p = 8/5 - (2/5)p.

    For p=2/3, this is: 8/5 - (2/5)*(2/3) = 8/5 - 4/15 = (24-4)/15 = 20/15 = 4/3.

    But this is the value V. And we know that by choosing p=2/3, the driver gets V=4/3, which is the maximum possible V.

    Therefore, the mixed strategy as a whole maximizes expected utility at the information set. Even though individually exiting yields 8/5 and continuing yields 6/5, the mixed strategy yields 4/3 which is less than 8/5=1.6? 4/3≈1.333 and 8/5=1.6, so 1.6>1.333. That doesn't make sense.

    Let me compute the expected utility of the mixed strategy at the information set again:

          With probability 1-p: exit -> payoff: 4 if second exit, 0 if first exit. But the driver's expected payoff from exiting is 8/5, as above.
          With probability p: continue -> driver's expected payoff from continuing is 6/5.

          Therefore, the overall expected utility of the mixed strategy is:
               (1-p) * (8/5) + p * (6/5) = 8/5 - (8/5)p + (6/5)p = 8/5 - (2/5)p.

          For p=2/3: 8/5 - (2/5)*(2/3) = 8/5 - 4/15 = (24-4)/15 = 20/15 = 4/3.

          And 4/3 ≈ 1.333, while 8/5=1.6.

          So if the driver were to choose the action "exit" with probability 1, he would get 8/5=1.6, which is greater than 4/3≈1.333. Therefore, the mixed strategy does not maximize expected utility at the information set.

    This is the tension.

    The only way to resolve it is to note that the mixed strategy p=2/3 is ex ante optimal, but it is not sequentially rational. The driver, at the information set, would want to choose to exit with probability 1. 

    Therefore, commitment (6) is violated: the plan is ex ante optimal, but at the information set, the action it prescribes (randomize with p=2/3) does not maximize expected utility.

    This is a genuine tension.

    Now, what is the cheapest revision?

    We could give up commitment (6). This is the approach of some decision theorists: they allow that the ex ante optimal plan might not be sequentially rational. Then they might recommend precommitment.

    We could give up the requirement of sequential rationality and say that the driver should follow the ex ante optimal plan even though at the time of decision it looks suboptimal.

    But commitment (6) is described as nonnegotiable.

    Another approach is to redefine the information set or the beliefs. Some have argued that in settings of imperfect recall, the driver's beliefs should be different. In particular, the driver should realize that if he is at the first exit, then he will be called to act again at the second, but if he is at the second, he won't. This is the approach of using a different updating (e.g., the frequency-based approach or the tied-to-the-tree approach). 

    Alternatively, we can use the approach of Piccione and Rubinstein (1997) who originally raised this issue and then later with other co-authors proposed solutions. One solution is to use the ex ante expected value for the continuation, but that is not standard.

    Given the above, the tension is between (4) and (6) because (4) claims indifference and (6) requires that the action maximizes expected utility at the information set. But we see that the driver is not indifferent: he строго prefers to exit. 

    Revision options:

    Option 1: Revise (4) to say that at the information set, the expected value of exiting is 8/5 and of continuing is 6/5, so the driver is not indifferent. Then drop the claim in (5) that there is no reason to deviate. Instead, the reason to follow the plan is precommitment: even though it seems better to deviate, the ex ante perspective shows that following the mixed strategy yields a higher ex ante value. This means giving up on dynamic consistency.

    Option 2: Reject the belief formation. The driver's belief q = p/(1+p) is based on the ex ante probabilities. But at the information set, the driver should use a different updating. Some argue that in imperfect recall, the standard updating is not appropriate. If we use a different updating, then the conditional probability might be different. For example, if the driver believes that he is at the first exit with probability 1/2 and the second with 1/2 (uniform), then:
          Exiting: (1/2)*0 + (1/2)*4 = 2.
          Continuing: (1/2)*( value at second exit) + (1/2)*1.
          But value at second exit: if he continues at the second exit, he gets 1; if he exits, 4. But he will randomize. But then it becomes messy.

    Option 3: Adopt the solution of Aumann, Hart, and Perry: the driver's strategy must be such that it is optimal given that the same strategy is used at every exit. This is the fixed-point approach. Then the driver chooses the mixed strategy that maximizes V=4p-3p^2, which is p=2/3, and then the expected value of the mixed strategy at the information set is 4/3, and it is the maximum possible. The driver, by choosing the mixed strategy, gets 4/3, while if he were to choose to exit with probability 1, he would get 0 if at the first and 4 if at the second, but the expected value under the belief is 8/5. However, 8/5 is not achievable because if he chooses to exit with probability 1 at the first exit, he gets 0, and at the second exit, he gets 4, but the driver at the information set cannot choose to exit with probability 1 only at the second exit. He has to choose the same mixed strategy at every exit. Therefore, the only thing he can choose is a mixed strategy p, and then his overall expected utility is 4p-3p^2. This is maximized at p=2/3.

    In this view, the driver is not choosing an action but a mixed strategy for the entire trip. Then the tension dissolves because the driver's choice at the information set is not between actions but between strategies. And the strategy of using p=2/3 yields 4/3, while the strategy of using p=0 (always exit) yields 0, and p=1 (always continue) yields 1, and these are worse.

    Therefore, the driver, at the information set, chooses the mixed strategy p to maximize V=4p-3p^2, and chooses p=2/3.

    Then, the expected value of the mixed strategy at the information set is 4/3, while the expected value of the action "exit" is 8/5=1.6, but the driver cannot choose the action "exit"; he can only choose a mixed strategy that will be used at every exit. And the mixed strategy of always exiting (p=0) yields 0, which is worse than 4/3.

    This is the cheapest revision: 

          Revise commitment (6) to allow that the agent chooses a strategy (a plan) at the information set, not an action. The strategy then must be followed at every node in the information set.

          Then, at the information set, the agent chooses a mixed strategy p that will be used at every exit. The expected value of choosing a particular p is V=4p-3p^2, and the optimal p is 2/3.

          This satisfies (6) because the strategy prescribed by the ex ante optimal plan (p=2/3) is exactly the strategy that maximizes expected utility at the information set.

    This also revises (4) and (5): the driver is not indifferent between the actions, but he is choosing among strategies, and the best strategy is to mix with p=2/3.

    This revision costs: we must reinterpret the plan not as a sequence of action recommendations but as a strategy chosen at the information set and applied globally.

    Therefore, the most coherent overall package is to keep (1), (2), (3), and then for (4) and (5) to be dropped or reformulated, and (6) to be reinterpreted.

    Specifically:

          (4) is not true if by "expected value" of the actions we mean the conditional expected value of taking that action alone (without changing the plan elsewhere). However, in the strategy method, the driver is not evaluating actions in isolation but as part of a global strategy.

          (5) is then preserved: the driver has no reason to deviate from the ex ante optimal plan because it is also the optimal strategy at the information set.

          (6) is preserved by reinterpreting the "action" as a strategy for the entire information set.

    This is the solution that is common in the literature.

    Final summary of revisions:

        We drop the claim in (4) that the driver is indifferent between the actions of exiting and continuing. Instead, we note that the driver is not choosing actions but a mixed strategy for the whole decision problem. The mixed strategy p=2/3 is chosen because it maximizes the expected value at the information set (when the same strategy is applied at every exit).

        This also affects (5): the reason not to change is that the chosen strategy is optimal at the information set.

        (6) is preserved by expanding the notion of "action" to mean a strategy for the entire information set.

    This revision costs: we must abandon the idea that the driver is indifferent at the exit between the two actions. Instead, we have to view the driver as choosing a mixed strategy at the outset (or at the information set) that will be used at every exit.

    This is the most coherent package.
