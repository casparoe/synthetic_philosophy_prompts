answer: |-
  ### Argument Outline
  1. **Hobsbawm’s Framework in the Novel**:  
     - The ballroom scene embodies **fabricated tradition**—a theatrical staging of "Italianness" for political legitimation.  
     - The plebiscite scene exposes **mass complicity** in state-building fiction, revealing performative consent.  
  2. **Salina’s Religious Rituals as Adapted Tradition**:  
     - Private Catholic rites mask aristocratic decline, repurposing tradition to sustain class authority amid national unification.  
  3. **Aristocratic Melancholy as Theoretical Resistance**:  
     - Prince Fabrizio’s irony and bodily decay undermine Hobsbawm’s binary, exposing tradition as *both* adapted *and* hollow. His perspective reveals nation-building as cyclical farce, not linear invention.  

  ---

  ### Analysis: Performing Italy in *The Leopard*  

  **I. The Ballroom Scene: Fabricated Nationhood as Theatre**  
  The ball at Palazzo Ponteleone isn’t merely social; it’s a *constitutive performance* of the new Italy. Tancredi and Angelica’s waltz becomes an allegory of the Garibaldian-mergerist project: performative unity masking violent upheaval. Hobsbawm’s "fabricated tradition" is literalised here—bourgeois guests mimic aristocratic codes while Sicilian *gattopardi* (like the Prince) observe with detached irony. The scene’s opulence—dust hastily cleared, borrowed liveries—exposes the *staged* nature of this "Italian community." Crucially, the audience (local elites, Piedmontese officers) "plays along" not out of belief, but because the ritual offers social capital in the new order. This isn’t collective imagination (à la Anderson) but *collaborative imposture*.  

  **II. Plebiscite Scene: Complicity in State-Building Farce**  
  The Sicilian plebiscite for Italian unification epitomises Hobsbawm’s "invented tradition" as political tool. Lampedusa strips the event of democratic idealism: voters are bribed with wine, ballots pre-marked, results inflated. The performative "yes" to Italy is a transaction—peasants trade symbolic consent for momentary relief. Here, the novel *exceeds* Hobsbawm: it reveals not just top-down invention, but the *active, cynical participation* of the disenfranchised. Their "playing along" isn’t passive; it’s a survival tactic that *enables* the fiction of national will. The Prince’s refusal to vote isn’t dissent—it’s aristocratic disdain for the charade.  

  **III. Salina’s Chapel: Adapted Tradition as Class Camouflage**  
  The Salina family’s private rituals—the decaying chapel, murmured rosaries—embody Hobsbawm’s "adapted tradition." Catholic practice is repurposed to maintain dynastic continuity despite political rupture. Yet this adaptation isn’t neutral: it *masks* the aristocracy’s capitulation to bourgeois power (symbolised by Angelica’s entry into the family). The Prince’s piety feels authentic, but its insistence on domestic seclusion signals retreat from public sphere decline. Unlike the ball’s fabrication, this ritual *claims* ancient roots—yet its function is newly strategic: preserving aura while power evaporates.  

  **IV. Where Melancholy Fractures the Frame**  
  Hobsbawm’s binary (adapted/fabricated) falters before Salina’s embodied scepticism. His melancholy isn’t just resistance—it’s an epistemological challenge to invention theories.  
  - **Bodily Decay vs. Political Theatre**: Salina’s ageing body (his "thick blood," fatigue) contrasts the ball’s glitter. His physical decline *grounds* the narrative in materiality, mocking the "newness" of Italy as superficial performance.  
  - **Cyclical Time vs. National Progress**: While Hobsbawm/Anderson frame nations as linear projects, the Prince sees unification as Sicilian history repeating: "everything must change so everything stays the same." The plebiscite’s fraud echoes Bourbon rigging—undermining "invention" as novelty.  
  - **Ironic Detachment as Theoretical Sabotage**: Salina’s famous line—"We were the leopards, the lions; those who take our place will be jackals, hyenas"—rejects both old and new traditions as equally hollow. His nostalgia isn’t for tradition *itself*, but for the *authentic power* it once veiled.  

  **V. Conclusion: The Novel as Counter-Theory**  
  *The Leopard* uses aristocratic perspective not to mourn tradition, but to expose *all* community-construction as performance. The ball and plebiscite scenes illustrate Hobsbawm brilliantly—yet Salina’s weariness transcends them. His refusal to perform hope ("sleep, eternal sleep is what I want") resists teleological nation-building narratives. Lampedusa suggests that "tradition," whether adapted or fabricated, is ultimately *gesture*: the Prince’s chapel prayers are as performative as Tancredi’s waltz. What endures isn’t the invented nation, but the Sicilian landscape itself—indifferent to human theatre. This complicates Hobsbawm: the novel posits that *all* traditions are renegotiated fictions, and melancholy is the price of seeing the strings.  

  ---

  ### Key Theoretical Tension  
  **Where the Novel Pushes Back**: Hobsbawm implies traditions serve functional ends (legitimising states/classes). But Salina’s existential despair reveals such functionality as *ultimately futile*. His awareness of performance—in chapel and ballroom—drains both of meaning. The novel doesn’t just depict invention; it suggests that seeing *through* invention breeds nihilism, not resistance. This emotional register—aristocratic *noia*—is what theory cannot capture: the weight of participating in fictions you no longer believe.
