answer: |-
  ## Research Proposal: Layered Moral Architecture and the Integrity Objection – Recasting Williams’s “One Thought Too Many”

  **Title:** Constraint Satisfaction at the Source: Layered Agency as an Architectural Resolution to Williams’s Integrity Objection

  **Abstract:** Bernard Williams’s integrity objection and his critique of explicit moral calculus in intimate relationships ("one thought too many") are potent challenges to utilitarianism. This proposal argues that both critiques tacitly rely on a *unitary, transparent agent model* – a "single-threaded self" – where all commitments are globally available for reflective optimization. We hypothesize that modeling moral agency as *layered*, incorporating non-negotiable "source constraints" operating sub-reflectively, relocates rather than refutes the integrity objection. It reveals a potential *architectural misfit*: utilitarianism may be applied at the wrong computational level. Standard responses (flexible utilitarianism, indirect utilitarianism) fail by preserving the unitary model. Through conceptual analysis of Williams’s arguments and the construction of a rigorous layered-agency model (drawing on constraint satisfaction frameworks), this project aims to develop a taxonomy of moral demands based on their survival under layer-filtering, demonstrating how source constraints dissolve the apparent conflict with utilitarianism at the reflective layer while preserving the core phenomenological force of Williams’s insights. Success yields a novel structural interpretation; failure occurs if the model collapses into indirect utilitarianism.

  **1. Core Problem & Williams’s Challenge:**
  Williams’s integrity objection contends that utilitarianism alienates agents by demanding they sacrifice deep personal projects for the greater good, violating their sense of self. His "one thought too many" (e.g., justifying saving one’s spouse via impartial utility calculus) highlights the repugnance of subjecting intimate bonds to explicit optimization. Both critiques presuppose that the moral agent is a single, reflective processor capable (and required) to submit *all* commitments – including foundational projects and bonds – to a global optimizing calculus. This unitary model makes the conflict between integrity/intimacy and impersonal optimization seem inescapable and fatal to utilitarianism.

  **2. Working Hypothesis: Layered Agency & Source Constraints:**
  We hypothesize that moral agency is architecturally *layered*. Crucially, certain commitments function as **non-negotiable source constraints** operating *below* the level of conscious, reflective choice. These are not preferences or values fed into an optimizer; they are foundational parameters that *shape* the space within which reflective optimization occurs. Examples may include core identity-constituting projects or the intrinsic valuation inherent in specific intimate relationships (like spousal bonds). Utilitarianism, conceived as a reflective optimization procedure, applies *within* the space defined by these sub-reflective constraints. Williams’s critiques, therefore, do not refute utilitarianism *per se*, but expose a category error: applying a reflective optimization procedure to elements functioning as source constraints defining the agent’s optimization boundary conditions.

  **3. Relation to the Integrity Objection: Relocation:**
  This layered model **relocates the integrity objection**. The objection’s force arises when utilitarianism is mistakenly applied *to* the source constraint layer. The feeling of alienation or the "one thought too many" signifies the pathological attempt to optimize a parameter that is, within the agent's architecture, a fixed constraint defining the self. The objection reveals the *existence* and *violation* of these source constraints, not a flaw in utilitarianism as a procedure for optimizing *within* the space they delineate. Integrity is preserved precisely *by* the non-negotiable status of these constraints at their operational layer.

  **4. Failure of Standard Responses:**
  *   **Flexible Utilitarianism (Incorporating Projects/Bonds):** This retains the unitary model, merely adding new inputs (e.g., "project weightings") to the global optimizer. It fails because it still requires reflective optimization *of* the source constraints themselves, subjecting them to potential sacrifice. It turns integrity *into* a preference, dissolving its non-negotiable character.
  *   **Indirect Utilitarianism (Rules/Habits):** While moving optimization "up" a level (to rules or dispositions), it typically retains the unitary model *at the justificatory level*. The rules/dispositions are *themselves* justified by global optimization, meaning the source constraints are ultimately subsumed under the global utility function. The agent, reflectively, knows this, reintroducing alienation ("I follow this rule *because* it maximizes utility, not because my spouse is inherently non-negotiable").

  Both responses treat the commitments highlighted by Williams as *content* for optimization within a single reflective layer, failing to recognize their potential role as architectural *constraints* defining the layer itself.

  **5. Method: Conceptual Analysis & Constraint-Satisfaction Modeling:**
  *   **Conceptual Analysis:** Precisely dissect Williams’s arguments (integrity objection, "one thought too many") to isolate the implicit assumptions about agent structure (unitary, transparent self). Identify key phenomenological claims (alienation, repugnance of calculation) demanding explanation.
  *   **Layered-Agency Model Construction:** Develop a formal, non-empirical model of layered agency using constraint-satisfaction frameworks. Define distinct layers:
      *   **Source Constraint Layer (SCL):** Contains non-negotiable, identity-defining commitments (e.g., core project P, intrinsic value of spouse S). Operates sub-reflectively. Outputs fixed constraints/boundary conditions.
      *   **Reflective Optimization Layer (ROL):** Operates on preferences, values, and situational facts *within* the space defined by the SCL. Implements utilitarian calculus (or other procedures) *subject to* SCL constraints. Outputs actions.
  *   **Application:** Apply this model rigorously to Williams’s paradigmatic cases (George the Chemist, Jim and the Indians, saving the spouse). Demonstrate how SCL constraints (e.g., "Spouse S is inviolable") automatically filter ROL options, preventing calculations that would generate alienation or "one thought too many". Contrast with unitary model failure modes.

  **6. Outcomes: Success & Failure Conditions:**
  *   **Success:** A demonstrably coherent layered-agency model that:
      *   Preserves the phenomenological core of Williams’s objections (explains alienation/repugnance as violation of SCL).
      *   Relocates the objection as an architectural misfit, not a refutation of ROL utilitarianism.
      *   Generates a **taxonomy of moral demands**:
          *   **Layer-Surviving Demands:** Demands processed appropriately at the ROL (e.g., distributing impersonal goods within SCL bounds).
          *   **Layer-Filtered Demands:** Demands attempting to violate SCL constraints, correctly rejected at the architectural level (e.g., sacrificing spouse for strangers).
      *   Clearly distinguishes itself from indirect utilitarianism by grounding SCL constraints architecturally, not via higher-order optimization.
  *   **Failure:** The model fails if:
      *   It cannot coherently define or justify SCL constraints without collapsing into indirect utilitarianism (i.e., if SCL constraints are ultimately ROL-justified).
      *   It cannot account for the phenomenology Williams describes.
      *   The distinction between SCL and ROL becomes functionally or conceptually incoherent.
      *   It merely redescribes existing positions without novel explanatory power.

  **7. Scope Assessment (6 Weeks):**
  *   **Achievable:** Develop the core layered model; perform conceptual analysis on Williams’s key texts; apply model rigorously to 2-3 core Williams cases; define preliminary taxonomy; draft the proposal argument clearly. This provides a robust proof-of-concept.
  *   **Out of Scope:** Comprehensive engagement with all Williams scholarship; full defense against all potential objections (e.g., demandingness, relativism of SCL); detailed comparison with *all* existing utilitarian responses; development into a full normative theory; empirical validation. The focus is conceptual and structural demonstration.
  *   **Risks:** Ensuring the SCL isn't just a concealed ROL; avoiding undue vagueness in defining "source constraints"; resisting the temptation to make the model empirically over-complex. Mitigation lies in strict adherence to formal, constraint-satisfation inspired modeling and precise phenomenological targets.

  This project offers a novel, structural reinterpretation of Williams’s profound challenges, suggesting the conflict lies not in utilitarianism’s core logic, but in misapplying it to the wrong architectural layer of the moral agent.
