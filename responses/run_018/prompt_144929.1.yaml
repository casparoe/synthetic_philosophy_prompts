  **Interplanetary Semantic Integrity Office (ISIO)**
  **Frequently Asked Questions: Reference Determination & Border Procedures**

  **1. What is the primary function of the ISIO?**
  The ISIO regulates cross-planetary travel and commerce between Earth (Sol-3) and Twin Earth (Sol-3β) to ensure semantic integrity under Directive Putnam-1975. This entails verifying the reference-fixing conditions for all declared terms used by travelers and in commerce, preventing reference misalignment and resultant fraud, miscommunication, or ontological contamination.

  **2. Why must I declare the "Chemical Composition Environment (CCE)" for substances on customs forms?**
  Terms like "water," "gold," or "aluminum" acquire reference via the physical environment of the speaker's planet of primary linguistic socialization (PLS). Water (Sol-3) refers to H₂O; Water (Sol-3β) refers to XYZ. Declaring the CCE (e.g., "H₂O (Sol-3)" or "XYZ (Sol-3β)") establishes the correct extension for the term as used in your declaration, irrespective of your personal beliefs or neural state.

  **3. What constitutes "Reference Fraud"?**
  Reference Fraud (RF) occurs when an individual uses a term intending its extension to be fixed by one planetary environment, while situated in an environment that fixes a different extension, and this misalignment results in material gain or loss. Example 1A: An Earthling (PLS: Sol-3) on Twin Earth orders "water" in a restaurant, intending H₂O, but receives XYZ. This constitutes RF by the consumer (intent misaligned with local fixing conditions). Example 1B: A Twin Earthling (PLS: Sol-3β) sells "gold" to an Earthling without declaring the CCE (Au vs. Au*), knowing the Earthling expects Au. This constitutes RF by the vendor. Penalties range from fines to revocation of cross-planetary travel privileges.

  **4. How are visa classifications determined?**
  Visas classify travelers based on Planet of Primary Linguistic Socialization (PLS), not neural state equivalence or subjective identity. Two travelers with identical neural profiles will receive different entry stamps if one was socialized on Earth (PLS: Sol-3) and the other on Twin Earth (PLS: Sol-3β). The PLS determines the default referential framework for undeclared terms during travel. Form ISIO-447 "Declaration of Linguistic Socialization Origin" must be completed truthfully.

  **5. Case Inquiry: Dr. K underwent a brain-emulation upload procedure on Earth (Sol-3). The digital emulation resides on a server with no inherent physical environment. Dr. K (emulation) now applies for a visa to "travel" to a reception terminal on Twin Earth (Sol-3β). Does the emulation retain its original Earth-reference (H₂O) or acquire Twin Earth-reference (XYZ) upon activation on Sol-3β?**
  Analysis:
  *   **Original PLS:** Dr. K's biological origin is Sol-3. Their terms (e.g., "water") were fixed by the H₂O environment and Earth's expert community.
  *   **Emulation State:** The upload contains mental states (neural patterns, beliefs, dispositions) but lacks:
      *   A physical environment capable of fixing reference (server substrate ≠ H₂O or XYZ).
      *   An active expert community participating in the division of linguistic labor for the emulation itself. The emulation is isolated.
  *   **Transfer to Sol-3β:** Activation within Sol-3β's physical environment occurs. However, the emulation lacks:
      *   Primary linguistic socialization *within* the XYZ environment.
      *   Integration into Sol-3β's expert community chains (deference is impossible without recognized community membership).

  **Ruling:** The emulation exists in a **reference-neutral state** due to the absence of both a reference-fixing physical environment and an anchoring expert community upon upload. Activation within Sol-3β does not constitute new PLS sufficient to bind reference to XYZ. The original PLS linkage (Sol-3/H₂O) is severed by the upload process and cannot be automatically reinstated without embedded environmental coupling.

  **Disposition:** The Dr. K emulation application is **denied** under ISIO Regulation 8.7 (Insufficient Reference-Fixing Conditions). Visa issuance requires a verifiable PLS or an approved "Reference Stabilization Container" (RSC) maintaining the original PLS environment (e.g., simulated H₂O environment with Earth-expert AI modules). The emulation may apply for entry under "Digital Entity - Reference Quarantine Status" (Form ISIO-882) for on-site stabilization assessment, pending availability of an RSC.

  **6. What happens if I dispute the PLS determination or reference assignment upon entry?**
  File Form ISIO-510 "Continuity of Reference Appeal" within 14 planetary cycles of entry denial or customs assessment. A Reference Adjudication Panel will review documentation of socialization history (educational records, employment history, verifiable testimony from PLS-era associates). If the appeal is successful, duties paid under protest based on the initial assessment may be eligible for partial refund, minus administrative fees (see Schedule 42-F). Refunds are not granted for subjective experiences of continuity, only for demonstrable PLS documentation errors.

  ---

  **OFFICIAL SIDEBAR: MENTAL-STATE EQUIVALENCE CERTIFICATES (MSECs)**

  *   An MSEC (Form ISIO-330) documents that two entities (biological or digital) possess indistinguishable neural/functional states at time T, as verified by ISIO-approved scanning protocols.
  *   **Utility:** MSECs are relevant for medical continuity, certain legal proceedings (e.g., testamentary capacity), or digital rights management under the Digital Consciousness Act.
  *   **Limitation:** An MSEC **does not** establish shared PLS or reference-fixing potential. Two entities with a valid MSEC issued on Earth will still be assigned Sol-3 PLS. If one entity is subsequently activated on Twin Earth without undergoing PLS-conferring procedures there, it retains Sol-3 PLS, while the other, remaining on Earth, also retains Sol-3 PLS. The MSEC confirms state equivalence, not environmental linkage. **MSECs are not substitutes for PLS documentation in visa applications or customs declarations.**
