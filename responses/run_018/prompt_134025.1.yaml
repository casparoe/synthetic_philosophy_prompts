prompt: |-
  hey im in high school and im trying to figure out my research project on why people break promises to themselves even when they know its stupid. my advisor mentioned akrasia and hyperbolic discouting but theres so much stuff out there. if im gonna spend like 3 months on this and actually want it to help teens not flake on goals, which open questions are worth the time? should i look at whether weakness of will is just bad brain math, whether commitment devices change your actual self over time, or how apps and social media mess up precommittment? rank them by whats actually tractable for a student and what solving one does for the others. im less interested in a list than in why the ordering makes sense, and what kind of result in the next year would flip your ranking. also sorry if i typoed something lol
reasoning: |-
  Okay, the user is a high school student working on a research project about why people break promises to themselves. They mentioned their advisor brought up akrasia and hyperbolic discounting, but they're overwhelmed. Their main goal is to help teens not flake on their goals, so they want practical insights. They're considering three open questions: whether weakness of will is just bad brain math, if commitment devices change your self over time, or how apps/social media mess up precommitment. They want these ranked by tractability for a student and impact, plus what could change the ranking.

  First, I need to unpack each question. The brain math one is about neuroscience and psychology, looking at cognitive biases. Commitment devices involve behavioral economics, maybe designing experiments. The apps and social media angle ties in tech's impact on attention and self-control, which is super relevant to teens.

  Assessing tractability: High school resources mean no fancy labs or big datasets. Surveys, small experiments, app usage tracking are doable. Literature review is essential but manageable. The brain math question needs understanding complex theories and possibly technical methods. That's tough without a lab. Commitment devices might involve creating simple pacts or using apps, which is feasible. Social media research could use surveys on usage habits and self-control, which teens can relate to and data is accessible.

  Impact-wise, helping teens directly is key. Social media's role is immediately relevant since teens are heavy users. If they find how apps disrupt precommitment, that's actionable. Commitment devices could show long-term benefits, but tracking over months is hard. Brain math is foundational but less directly applicable to solutions.

  The user might have deeper needs: wanting a manageable project that still contributes something meaningful. They might feel intimidated by academic complexity but eager to make a real difference. Emphasizing practicality and relevance is crucial. Also, they might need guidance on structuring their project without getting lost in theories.

  Ranking: Social media first because it's tractable and high impact. Commitment devices next, though longer-term effects are harder to study. Brain math last due to complexity. If new studies come out linking social media to self-control with clear mechanisms, that could reinforce the top choice. If an app trial shows commitment devices alter behavior long-term, that could boost its rank. A breakthrough in measuring brain math simply could shift things, but that's less likely soon.

  Need to ensure they know how to approach each: surveys for social media, simple experiments for commitment devices. Also, ethical considerations, especially with minors. Encouraging collaboration with peers for data collection. Highlighting the importance of clear research questions and methodologies suited to their resources.
answer: |-
  Here’s a strategic ranking of your research questions for maximum teen impact, feasibility, and interconnected insights—with clear reasoning and "flip conditions":

  ### **Ranked by Tractability & Impact for a High School Project**
  1. **How apps/social media mess up precommitment**  
     **Why #1?**  
     - **Tractability (9/10):** You can design surveys/interviews for peers (e.g., *"Does TikTok scrolling make you abandon study plans?"*), track app usage vs. goal adherence (using screen-time stats), or test app-blockers. No labs needed—just consent forms and Google Forms.  
     - **Impact (10/10):** Directly targets teen life. If you prove apps sabotage promises (e.g., notifications fragmenting focus), you can propose concrete "digital hygiene" fixes.  
     - **Scaffolding:** Connects to *hyperbolic discounting* (apps offer instant rewards) and *akrasia* (distraction weakens willpower).  

  2. **Whether commitment devices change your actual self over time**  
     **Why #2?**  
     - **Tractability (7/10):** Run a 2-4 week experiment where peers use commitment devices (e.g., "If I skip gym, I donate $10 to a hated cause" or public pledges). Track compliance + pre/post surveys on self-perception.  
     - **Impact (8/10):** Teens *love* self-reinvention. Showing that "forced" consistency builds lasting habit change (e.g., "Study daily for 3 weeks → see yourself as a 'studious person'") is empowering.  
     - **Scaffolding:** Tests if external tools (precommitments) rewire *internal* self-concept—a bridge between motivation (brain math) and environment (apps).  

  3. **Whether weakness of will is just bad brain math**  
     **Why #3?**  
     - **Tractability (4/10):** Requires diving into neuroscience (dopamine, prefrontal cortex) or complex behavioral econ models. Hard to test experimentally without IRB approval or controls.  
     - **Impact (6/10):** Explains the *mechanism* but offers fewer actionable fixes for teens ("Your brain discounts the future!" isn’t a solution).  
     - **Scaffolding:** Foundational—if "brain math" is faulty, apps exploit it and commitment devices might correct it.  

  ---

  ### **Why This Order?**
  - **Feasibility First:** Apps/social media research leverages *your* access to teens and digital tools. Commitment devices need more time/organization. Brain math risks becoming theoretical.  
  - **Action Over Theory:** Teens need tactics, not just explanations. Question #1 gives anti-flake strategies; #2 builds self-identity; #3 explains *why* but doesn’t solve.  
  - **Synergy:** Solving #1 reveals *how* modern triggers hijack self-control (linking to hyperbolic discounting). Solving #2 shows *how* to weaponize environment against akrasia. Both inform #3.  

  ---

  ### **What Could Flip This Ranking?**  
  *(Within 1 year)*  
  - **If #3 (Brain Math) Jumps to #1:**  
    **Flip Condition:** A landmark study publishes a *simple behavioral test* for "future discounting" in teens (e.g., a 5-min survey predicting real-world flaking). Suddenly, you could map "brain math" to flaking rates without fMRI.  

  - **If #2 (Commitment Devices) Becomes #1:**  
    **Flip Condition:** A free app (e.g., Beeminder) releases anonymized teen data showing that 80% of users who stick with commitments for 1 month report lasting identity change. Now you can analyze real-world data.  

  - **If #1 (Apps) Drops:**  
    **Flip Condition:** Major social platforms collapse (unlikely) OR a study proves app interventions *don’t* work long-term for teens (e.g., blockers get overridden).  

  ---

  ### **Your Project Power Move: Combine #1 and #2**  
  Run a 3-week experiment:  
  1. Group A: Uses app blockers during study hours.  
  2. Group B: Uses a commitment contract ("If I don’t study, I buy pizza for the group").  
  3. Measure:  
     - Goal adherence (e.g., pages read, problems solved)  
     - Pre/post self-rating: *"Do you see yourself as someone who keeps promises?"*  
     - App usage logs (via Screen Time)  

  **Why this kills two birds:** Tests if removing digital friction (#1) and adding accountability (#2) reduce flaking *and* alter self-perception. You’ll answer both questions with one elegant design.  

  **Resources to Start:**  
  - Books: *Indistractable* (Nir Eyal), *Atomic Habits* (James Clear)  
  - Tools: Forest (app blocker), StickK (commitment contracts), Google Forms + Sheets (data)  
  - Theory: Read Roy Baumeister’s *Willpower* for akrasia, David Laibson on hyperbolic discounting  

  This approach gives you publishable survey/experiment data (great for college apps!), delivers practical takeaways for teens, and sidesteps untestable neuroscience. Go crush it! 🔥
