answer: |-
  Here's a precise comparison of the global Quine-Duhem Thesis (GQDT) and Domain-Locked Underdetermination (DLU), addressing your specific points:

  **Core Definitions:**
  1.  **Global Quine-Duhem Thesis (GQDT):** For any theory T under test, facing recalcitrant evidence, *and even for any empirically successful T*, there exists an empirically equivalent rival T' obtainable by revising T's auxiliary hypothesis set A while preserving its core postulates, *or* by revising the core postulates while adjusting A. Crucially, **no constraints** exist on *how* A or the core can be revised – any logically consistent alternative is permitted.
  2.  **Domain-Locked Underdetermination (DLU):** Within a specific scientific domain, prevailing background theories, methodological principles, metaphysical commitments, and mathematical frameworks constitute a "domain lock" (DL). For a theory T operating within DL, empirically equivalent rivals T' are only those achievable by adjustments *compatible* with DL. Adjustments violating DL (e.g., rejecting established conservation laws, introducing fundamentally new ontologies forbidden by DL, or adopting incompatible mathematical structures) are excluded from the "permissible pool."

  **Divergence on Scope of Revision:**
  *   **GQDT:** Scope is **unrestricted/global**. Revision can involve *any* logically possible alteration to the core theory *or* auxiliary hypotheses, no matter how radical, ad hoc, or disconnected from current scientific practice (e.g., adding "undetectable gremlins" to explain discrepancies, or replacing General Relativity with a fundamentally different geometric framework while tweaking matter fields).
  *   **DLU:** Scope is **restricted/local**. Revision is confined to adjustments consistent with the "domain lock" (DL). DL acts as a filter:
      *   **Permissible:** Adjusting parameters *within* the allowed ontology (e.g., different dark energy equation of state values), adding new entities/functions *consistent* with DL's metaphysics (e.g., a new scalar field if quantum fields are part of DL), modifying specific auxiliary models (e.g., star formation recipes in cosmology) without violating core DL principles.
      *   **Impermissible:** Adjustments requiring rejection of DL's core commitments (e.g., abandoning Lorentz invariance in standard particle physics, rejecting quantum superposition in quantum chemistry, introducing action-at-a-distance if DL requires local fields).

  **Addressing Quine's Triviality Objection:**
  *   **Quine's Objection to GQDT:** The existence of empirically equivalent rivals via *unrestricted* auxiliary/core revision is trivial because it allows for wildly implausible, untestable, or incoherent (with the rest of science) alternatives. It proves too much, rendering the thesis philosophically sterile regarding actual scientific practice. The rivals are always "available" only in a purely logical, not scientifically relevant, sense.
  *   **DLU's Response & Avoidance:** DLU **successfully avoids this triviality**.
      *   By restricting the pool of permissible rivals to those constructible *within the constraints of the domain lock*, DLU excludes the implausible, untestable, and incoherent rivals Quine found trivial.
      *   The rivals considered under DLU are scientifically *relevant* and *meaningful* within the context of ongoing research in that domain. They represent genuine, live options scientists might actually consider or debate, constrained by the prevailing paradigm's commitments.
      *   DLU makes underdetermination a **substantive, domain-specific epistemic challenge** rather than a trivial logical possibility.

  **Anti-Realist Force vs. Pragmatic Collapse:**
  *   **GQDT's Anti-Realist Force:** While often cited by anti-realists, its global/trivial nature weakens its direct anti-realist force. It demonstrates logical underdetermination but fails to show that empirically equivalent rivals are *scientifically credible alternatives* threatening realism about successful theories.
  *   **DLU's Anti-Realist Force & Pragmatic Limits:**
      *   **Retains Anti-Realist Force:** DLU retains significant anti-realist force *when genuine, observationally equivalent, DL-compatible rivals exist*. It shows that even within the best-established theoretical framework (the DL), empirical evidence *alone* cannot uniquely determine which of several internally consistent, DL-compatible interpretations or formulations is correct. This directly challenges the realist inference that empirical success warrants belief in the specific ontology or core postulates of the *chosen* T over its DL-compatible rivals. Skepticism about uniquely latching onto "the way the world is" at the level of unobservables remains justified.
      *   **Risk of Pragmatic Collapse:** DLU **collapses into a pragmatic selection problem** *only when there is a unique DL-compatible theory* fitting the empirical data, or when the DL-compatible rivals are so pragmatically unequal (e.g., vastly more complex, less unifying, less fertile for further research) that choice is uncontroversial based on standard epistemic virtues *within* the DL. If the DL itself evolves (e.g., due to pressures from other domains or internal inconsistencies), previously excluded rivals might become permissible, reigniting underdetermination. DLU highlights that anti-realist skepticism is most potent *during periods where multiple viable DL-compatible rivals coexist*.

  **Handling Cosmological Models (Dark Energy Ontology):**
  *   **Scenario:** Two cosmological models, M1 and M2, share identical Friedmann equations governing cosmic expansion (identical dynamics, identical predictions for all observable quantities like distances, redshifts, CMB spectra, structure growth). They differ *only* in the ontological interpretation of the parameter Λ (or w) in the equation:
      *   M1: Λ represents a genuine, fundamental vacuum energy (a property of spacetime itself).
      *   M2: Λ represents the coarse-grained effect of a dynamic scalar field (Quintessence), whose microscopic details are unknown but whose average behavior mimics a cosmological constant.
  *   **GQDT Response:**
      *   Emphasizes that M1 and M2 are just two points in a vast, unrestricted space of empirically equivalent rivals.
      *   Highlights that one could construct *radically different* empirically equivalent rivals by, for example, altering gravity (modifying the geometric side of Einstein's equations) and compensating with exotic matter fields, or even introducing non-local effects, *as long as the net dynamics for the scale factor match*. The ontological differences between M1 and M2 are seen as insignificant within this ocean of possibilities.
      *   Concludes that empirical equivalence *alone*, in this global sense, strongly motivates skepticism about *any* specific ontological claim regarding dark energy (or gravity, or matter), as infinitely many alternatives exist. Choice becomes radically unconstrained.
  *   **DLU Response:**
      *   Within the current cosmological DL (based on General Relativity + Quantum Field Theory framework + Standard Model of particle physics + statistical homogeneity/isitropy), M1 and M2 are recognized as *genuine, scientifically relevant* empirically equivalent rivals. Both are fully compatible with the DL.
      *   Radical revisions altering gravity's core nature or introducing blatantly non-QFT entities are excluded from consideration *within this specific domain lock*. They violate the DL's foundational commitments.
      *   **Divergence from GQDT:** DLU focuses the underdetermination *precisely* on the ontological interpretation of Λ *within the established dynamical framework*. It highlights a specific, localized epistemic gap: observations cannot distinguish between vacuum energy and a specific class of dynamical fields *within the GR+QFT paradigm*.
      *   Empirical equivalence *between M1 and M2* motivates skepticism regarding the *fundamental nature of dark energy* (vacuum property vs. dynamic field), but *not* necessarily skepticism about the overall GR+QFT framework, the reality of accelerated expansion, or the value of Λ/its effective equation of state. The DL itself provides significant ontological grounding, but underdetermination persists for this specific component. Choice between M1 and M2 may involve pragmatic considerations (simplicity, potential links to quantum gravity, aesthetic preferences) *within the DL*.

  **Empirical Equivalence and Skeptical Conclusions:**
  *   **GQDT:** Argues that empirical equivalence *alone*, understood globally, *is sufficient* to motivate a very strong, radical skepticism. The mere logical possibility of empirically equivalent rivals, however bizarre, undermines justification for believing *any* specific theory's claims about unobservables. The conclusion is that empirical evidence radically underdetermines theory choice globally.
  *   **DLU:** Argues that empirical equivalence *alone* is *not sufficient* to motivate a skeptical conclusion. The crucial factor is whether there exist *scientifically credible, domain-locked compatible* rivals.
      *   If no such rivals exist (only one DL-compatible theory fits the data), no skepticism is warranted *within that DL*.
      *   If multiple DL-compatible rivals exist, empirical equivalence *combined with the existence of these specific, credible alternatives* motivates a *localized skepticism* regarding the aspects distinguishing the rivals (e.g., the ontological nature of dark energy), but not necessarily regarding the broader framework or the empirical adequacy itself. Skepticism is targeted and contingent upon the state of the domain.

  **In summary:**

  | Feature               | Global Quine-Duhem Thesis (GQDT)                 | Domain-Locked Underdetermination (DLU)               |
  | :-------------------- | :----------------------------------------------- | :--------------------------------------------------- |
  | **Scope of Revision** | **Unrestricted:** Any logical adjustment to core/aux. | **Restricted:** Only adjustments compatible with Domain Lock (DL). |
  | **Triviality (Quine)**| Suffers; rivals always "available" logically.    | **Avoids:** Considers only scientifically relevant rivals within DL. |
  | **Anti-Realist Force**| Weak (due to triviality).                        | **Strong** when multiple DL-compatible rivals exist; **Collapses to Pragmatism** when only one exists or rivals are pragmatically unequal. |
  | **Cosmology Example** | Λ-ontology just one of infinite possibilities; radical skepticism. | Focuses on M1 vs M2 as live, DL-compatible options; skepticism targeted to Λ's nature. |
  | **Emp. Eq. → Skepticism?**| **Yes:** Sufficient for radical global skepticism. | **No:** Only motivates *localized* skepticism if *domain-locked compatible* rivals exist. |
  | **Key Divergence**    | Unrestricted logical possibility vs. scientifically constrained viability within a paradigm. |                                                     |
