  For structure, I'll start with welcoming both groups. Introduce Spinoza's core ideas simply: democracy as natural state, power as capacity to act, multitude as embodied rationality. Contrast "counting heads" with "collective intelligence." Present the student center case neutrally, then analyze using Spinoza's framework. Highlight the algorithm's loyalty metrics as creating a monarch-like filter, making it resemble disguised monarchy. Conclude decisively that it fails Spinoza's test. End by connecting to workshop goals.

  Key phrases to use: "natural state of equal power," "multitude thinking together," "algorithm as crown," "illusion of participation." Keep language vivid and avoid jargon. The inside joke should be acknowledged lightly but treated seriously in analysis. Address exclusion by framing it as Spinoza's blind spot that complicates his ideal, suggesting it as a topic for later discussion.

