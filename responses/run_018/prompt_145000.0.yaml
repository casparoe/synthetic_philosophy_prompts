  hey im giving opening remarks tomorrow at a workshop my advisor is running on spinoza and democratic theory. the room is split between grad students who actually read his political writings and campus organizers who care about particpatory democracy but dont know spinoza. I want the speech to turn on his view that democracy is the most natural form of government since it comes closest to the state of nature where power is equal, but also on his exclusion of anyone not under their own power - dependants, foreigners, etc - from the democratic multitude.

  heres the niche part: this student center technically makes all decisions by open vote, but there's an administrative algorithm that weights student input by institutional loyalty metrics. it's kind of an inside joke. I need the remarks to use spinoza's distinction between democracy as collective rational power versus democracy as just counting heads, and apply it to whether this filtered voting setup is closer to spinozist democracy or to monarchy disguised as consultation. it should reach an actual verdict, not just 'it depends', and work for both the philospohers and the activists without lecturing anyone. about 4-5 minutes. please dont cite editions or page numbers since i wouldnt be able to verify them live, and dont ask for a bibliography. i also have a typo in my outline where i wrote 'absoulute sovereignty' but just treat it as paraphrase.
