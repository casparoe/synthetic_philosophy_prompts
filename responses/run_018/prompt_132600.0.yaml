answer: |-
  ## Joint Statement on Moral Demandingness: Threshold Prerogatives and Scalar Integration

  **Preamble:**
  This statement results from an adversarial collaboration between a defender of the **Threshold Prerogative objection** to act-consequentialism (TP) and a proponent of **Scalar Integration** (SI). We define our core positions as follows:

  *   **Threshold Prerogative (TP):** Morality must recognize a protected sphere of agent-relative interests. Demands to maximize the good become illegitimate once an agent has secured a baseline level of resources and effort sufficient for pursuing central personal projects and maintaining well-being. This establishes a normative threshold beyond which consequentialist optimizing obligations do not override agent-relative prerogatives.
  *   **Scalar Integration (SI):** Consequentialist obligations are fundamentally scalar (continuously weighted) rather than binary. The moral reason to promote the good increases continuously with the magnitude of the good achievable and decreases continuously with the cost to the agent. The experience of "excessive demand" often arises from mistakenly treating these scalar costs as generating all-or-nothing requirements to optimize, rather than recognizing their continuous integration into deliberation.

  **Section 1: Agreed Claims**

  We jointly affirm the following points:

  1.  **Critique of Maximizing Act-Consequentialism:** Standard maximizing act-consequentialism faces a significant demandingness objection. Its requirement to always perform the optimific act, irrespective of personal cost beyond basic survival or rationality constraints, imposes burdens incompatible with a plausible conception of the moral life and personal integrity.
  2.  **Distinction Between Optimizing and Satisficing:** There is a clear conceptual distinction between (a) **Optimizing Consequentialism:** requiring the agent always to choose the action with the best expected consequences, and (b) **Satisficing Consequentialism:** requiring the agent to choose an action that meets a specified threshold of goodness (e.g., "good enough"), permitting sub-optimal choices once that threshold is met. We agree that standard maximizing consequentialism is optimizing.
  3.  **Agent-Relative Reasons and Consequentialist Structure:** Agent-relative reasons (reasons whose force depends on the relationship of the action to the agent, such as special obligations or personal interests) are significant components of moral deliberation. Their potential compatibility with a consequentialist framework is a substantive question. Consequentialism need not be abandoned *a priori* if it can incorporate or accommodate the force of such reasons, though the *manner* of this incorporation is contested.
  4.  **Scalarity of Value and Cost:** The goodness of outcomes exists on a spectrum (is scalar), and the personal costs borne by agents in promoting the good also exist on a spectrum (are scalar). Moral reasoning must account for these scalar properties.

  **Section 2: Disagreements Table**

  | Issue                              | Threshold Prerogative (TP) Position                                                                 | Scalar Integration (SI) Position                                                                                                |
  | :--------------------------------- | :-------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------ |
  | **Nature of Obligation**           | Morality imposes **binary constraints**: Agent-relative prerogatives establish a **non-overridable threshold** beyond which optimization demands are illegitimate. | Morality imposes **continuously weighted reasons**: The reason to promote the good **continuously weakens** as personal costs increase; there is **no decisive threshold**. |
  | **Source of "Excessive Demand"**   | The demand *itself* becomes illegitimate beyond the threshold; it constitutes a **normative failure** of the theory.                | The perceived excess is an **epistemic/practical artifact** of misapplying binary deontic categories (obligation/permission) to fundamentally scalar reasons. |
  | **Collective-Action Problems (CAPs)** | CAPs **do not fundamentally alter** the individual threshold. Each agent's obligation is constrained by their prerogative, regardless of others' actions. | CAPs **significantly challenge** simple scalar application. The scalar reason for an individual to contribute weakens as the marginal impact decreases, potentially *reducing* perceived individual demand in large-scale CAPs, though coordination failures remain problematic. |
  | **Role of Satisficing**            | Endorses **satisficing as normative theory**: Permissibility requires only meeting the "good enough" threshold defined by the prerogative. | Sees satisficing as an **optional heuristic or approximation** within the scalar framework; the fundamental normative structure remains continuous weighting. |

  **Section 3: Identified Cruxes and Evaluative Predictions**

  We identify the following core unresolved disputes ("cruxes") as central to the disagreement, along with a mutually accepted case or argument bearing on each crux and our predicted evaluations:

  1.  **Crux 1: Non-Arbitrary Baseline:** *Can a non-arbitrary, morally significant baseline level of protected self-interest be defined and justified, serving as a normative threshold?*
      *   **Case/Argument:** Consider an agent with moderate resources who can fund either (A) a crucial personal project central to their life-plan (e.g., specialized career training) or (B) significantly mitigate a distant disaster (e.g., preventing several deaths). The TP argues a baseline exists protecting (A); the SI denies such a baseline is non-arbitrary.
      *   **TP Prediction:** The baseline protecting (A) is non-arbitrary, grounded in the necessity of personal integrity and a meaningful life. Choosing (A) is permissible, choosing (B) supererogatory.
      *   **SI Prediction:** No non-arbitrary line exists. The reason to choose (B) is stronger than to choose (A) (given the stakes), but weakened by the cost to the agent. Choosing (A) involves a significant, though not necessarily overriding, moral failure or "moral remainder."

  2.  **Crux 2: Reduction vs. Redistribution of Pressure:** *Does recognizing the continuous weighting of reasons genuinely reduce the experienced moral pressure to optimize, or does it merely redistribute or reframe that pressure across all choices?*
      *   **Case/Argument:** An agent faces daily, repeated opportunities to make small sacrifices (time, money, comfort) yielding small benefits for others (e.g., donating spare change, volunteering minutes). Under SI, each choice involves a weak scalar reason. Does this lead to less overall pressure than a system with clear thresholds (TP), or does it create a diffuse, ever-present sense of minor moral failing?
      *   **TP Prediction:** Scalar integration redistributes pressure, creating chronic low-level moral anxiety across all sub-optimal choices, failing to provide the clear permissions needed for psychological relief and robust personal pursuits.
      *   **SI Prediction:** Recognizing scalar reasons reduces pressure by eliminating the false dilemma of "obligation or permission" and the associated guilt for not meeting an impossible binary standard. It allows agents to weigh costs proportionally without feeling obligated to maximize in every instance.

  3.  **Crux 3: Scalar Defense & Uncoordinated Agency:** *Does the scalar integration model provide a satisfactory account of obligations in collective-action problems (CAPs) involving dispersed harms and uncoordinated agents, or does it undermine its defense against demandingness by potentially justifying negligible individual contributions?*
      *   **Case/Argument:** A large group faces a problem where many small contributions are needed to avert a significant harm (e.g., mitigating climate change via individual emissions reductions). Each individual's reduction has negligible marginal impact but imposes a noticeable personal cost.
      *   **TP Prediction:** Scalar integration fails here. It suggests the reason to contribute is extremely weak (due to negligible impact), potentially justifying inaction or minimal effort, even when collective inaction causes catastrophe. This demonstrates SI's inability to capture genuine individual obligations in CAPs, where a threshold-type duty (to do one's "fair share") is needed.
      *   **SI Prediction:** While coordination failures are a practical challenge, scalar integration correctly identifies the *reason* structure: the reason to reduce emissions is weak for each individual due to low marginal impact *but also* due to the cost. The demandingness defense holds because the *net* reason (benefit minus cost) is weak. The solution lies in coordination mechanisms (rules, institutions) that transform the reason structure, not in imposing binary individual thresholds.

  **Conclusion:**
  This statement clarifies both common ground and persistent disagreements between the Threshold Prerogative and Scalar Integration approaches to the demandingness objection. The three identified cruxes highlight fundamental questions about the structure of moral reasons, the psychology of moral experience, and the demands of collective action. We present our predicted evaluations on the specified cases to facilitate future testing and debate on these critical issues.

