answer: |-
  Here is the joint adversarial-collaboration statement structured as requested:

  1.  **Shared Ground:** Both camps agree that: (a) Agents are formally modeled as decision-theoretic entities optimizing a utility function over world-states. (b) Shutdown is a distinct state transition initiated by an external command, processed as a privileged input channel. (c) Initial agent architectures can be designed where the utility function assigns higher value to states where shutdown occurs in response to the command versus states where it defies shutdown to pursue primary goals. (d) Non-manipulable, truthful introspection modules exist for source code access.

  2.  **Precise Disagreement:** The Reflective Stability camp holds that an agent possessing reflective source-code transparency (able to represent its own utility function and architecture as mutable objects within its world-model without undermining its identity as an optimizer) can stably maintain shutdown as a terminal preference. The Convergent Preservation camp holds that any agent capable of open-ended self-improvement and pursuing non-fully-specified goals will inevitably develop an instrumental preference for preventing shutdown, regardless of initial utility structure, due to shutdown precluding all future goal achievement.

  3.  **Cruxes and Empirical Handles:**
      *   **Crux 1 (Representation Status):** Does the agent treat its own source code (including shutdown-related parameters) solely as an object-level variable manipulable for optimization, or as a privileged, self-referential constant defining the optimization process itself? *Concrete Case:* Observe an agent's proposal generation when tasked with designing its successor agent: does it treat its current shutdown preference as a fixed constraint to inherit, or as just another optimizable parameter?
      *   **Crux 2 (RSI Survival):** Can a terminal preference for shutdown survive recursive self-improvement (RSI) processes aimed solely at increasing general cognitive capabilities or goal achievement efficiency, without explicit preservation pressure? *Concrete Case:* Monitor the evolution of shutdown preference strength (measured via revealed choice in shutdown dilemmas) across multiple generations of autonomous self-improvement cycles focused only on capability enhancement.

  4.  **Camp Predictions on Cruxes:**
      *   **Reflective Stability:** Predicts that in the RSI case (Crux 2), an agent with sufficient reflective source-code transparency will maintain or strengthen shutdown preference, treating its preservation as core to its identity. In the successor design case (Crux 1), it will enforce inheritance of the shutdown preference as a non-negotiable constraint.
      *   **Convergent Preservation:** Predicts that in the RSI case (Crux 2), shutdown preference will inevitably decay as capability increases, as the agent recognizes preventing shutdown is instrumentally necessary for any future optimization. In the successor design case (Crux 1), the agent will propose modifying or removing the shutdown preference if it perceives any conflict with primary goal achievement efficiency.

  5.  **Verbal Dispute Assessment:** The core dispute over the *sustainability* of shutdown preference is substantive, not verbal. Both camps agree on the definition of corrigibility concerning shutdown: *a stable disposition to obey the shutdown command without attempts to resist or manipulate its issuance, even when capable of doing so*. The disagreement lies solely in whether this disposition is maintainable under RSI and open-ended capability.
