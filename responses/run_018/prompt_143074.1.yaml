answer: |-
  ### Exam Question  
  **SECTION C: ESSAY QUESTION (Answer in 90 minutes; 30 marks total)**  

  > The film *Ice and Ashes* (2024) depicts the life of Dr. Aris Thorne, a real, recently deceased climate scientist. Using her actual name and public reputation, it invents a private marital crisis to "explain" her controversial decision to withhold a key dataset—despite historical evidence showing her motives were complex and partly epistemic (e.g., methodological doubts about data reliability). Marketed as "inspired by true events" with standard disclaimers, the film is artistically coherent but systematically distorts the structure of Dr. Thorne’s scientific reasoning for dramatic effect.  
  >  
  > **Analyze whether this constitutes a distinct moral wrong** that is:  
  > (i) Not reducible to:  
  > &nbsp;&nbsp;&nbsp;&nbsp;a. Harm to the deceased (who cannot experience posthumous suffering),  
  > &nbsp;&nbsp;&nbsp;&nbsp;b. Harm to viewers (warned of fictionalization), or  
  > &nbsp;&nbsp;&nbsp;&nbsp;c. Generic historical inaccuracy.  
  > (ii) Best understood as:  
  > &nbsp;&nbsp;&nbsp;&nbsp;A. A moral failure of *narrative restitution* (violating the subject’s self-interpretive authority),  
  > &nbsp;&nbsp;&nbsp;&nbsp;B. An aesthetic failure (distorting the epistemic logic of scientific dissent), or  
  > &nbsp;&nbsp;&nbsp;&nbsp;C. An irreducibly hybrid failure.  
  >  
  > **Additionally, address:**  
  > - Whether the wrong scales differently for widely known public figures vs. relatively private ones.  
  > - Whether the filmmaker owes duties to Dr. Thorne’s *intellectual legacy* beyond duties to living audiences.  
  >  
  > *Ground your analysis in at least two philosophical frameworks (e.g., narrative ethics, posthumous dignity, epistemic injustice). Clearly distinguish legally/settled claims (e.g., defamation law, experiential harm) from contested philosophical positions.*  

  ---

  ### Model Answer (Approx. 800 words)  

  The case of *Ice and Ashes* presents a trenchant challenge for narrative ethics: it appears to wrong Dr. Thorne without causing her experiential harm, misleading reasonably cautious viewers, or merely "getting history wrong." Legally, the dead cannot be defamed (*Knupffer v. London Express*), and disclaimers shield against viewer deception claims. Philosophically, however, a distinct wrong emerges—one rooted in the **violation of narrative agency** and **epistemic distortion**, constituting a hybrid moral-aesthetic failure irreducible to settled categories.  

  **(i) The Irreducible Wrong: Agency and Epistemic Integrity**  
  The core wrong lies in usurping Dr. Thorne’s *self-narrative authority*. While the dead cannot experience harm, some philosophers (e.g., Joel Feinberg, Avishai Margalit) argue they retain *moral claims* grounded in respect for their life’s meaning. By inventing a marital crisis as the primary motive for her scientific dissent—erasing her documented epistemic concerns (e.g., data calibration uncertainties)—the film substitutes her actual, reason-based narrative with a reductive melodrama. This violates what Erving Goffman termed "territories of the self": the right to control one’s story posthumously as an extension of autonomy. Crucially, this is not generic inaccuracy but a targeted **hermeneutic injustice** (Miranda Fricker), as it obscures the *structure* of scientific deliberation, misrepresenting dissent as emotional compromise rather than methodological rigor.  

  **(ii) Moral Failure of Narrative Restitution vs. Aesthetic Epistemic Failure**  
  The wrong is best analyzed as a *hybrid* of moral and aesthetic failures:  
  - **Narrative Restitution (Moral)**: Drawing on Alasdair MacIntyre and Adriana Cavarero, narrative restitution requires honoring the subject’s self-interpretation as constitutive of their identity. The film’s fabrication disregards Thorne’s actual motives, reducing her scientific agency to a marital trope. This is distinct from defamation; it is a failure of *recognition* (Honneth), treating her life as raw material for external appropriation.  
  - **Epistemic Aesthetics (Aesthetic)**: Artistically, the film distorts the *logic* of scientific dissent. Science’s normative structure (e.g., evidence-weighing, peer critique) is replaced with psychological causality, flattening epistemic complexity into dramatic convention. This echoes Martha Nussbaum’s concern that narratives shape moral perception: viewers internalize a distorted model of scientific reasoning.  
  These dimensions are inseparable. The moral failure (usurping self-narrative) enables the aesthetic one (distorting epistemic norms), creating a hybrid wrong: the film *unjustly mischaracterizes the nature of her intellectual labor*.  

  **(iii) Scaling: Public vs. Private Figures**  
  The wrong scales differently for public versus private figures—but not in degree, only in *responsibility*. Public figures (like Thorne) have more documented narratives to counter misrepresentation, but filmmakers have a *heightened duty* to preserve the integrity of their public contributions (e.g., scientific legacy). For private figures, misrepresentation may be more totalizing (fewer counter-narratives exist), but the epistemic stakes are often lower. The wrong’s core—violating narrative agency—remains constant, but the *duty of care* intensifies with the subject’s role in public discourse.  

  **(iv) Duty to Legacy vs. Living Audiences**  
  The filmmaker owes duties not just to audiences but to Thorne’s **intellectual legacy**. Legacy here is not property but a **collective good** (e.g., accurate models of scientific virtue). While living audiences receive disclaimers, the dead scientist’s legacy—her pattern of reasoning, her epistemic commitments—is uniquely vulnerable to aesthetic mediation. As Erich Hatala Matthes argues, we owe duties to past persons *as contributors to ongoing projects* (e.g., climate science). Failing to represent her dissent accurately corrupts the resources available for future scientists and historians.  

  **Conclusion**  
  *Ice and Ashes* commits a distinct wrong by collapsing moral and aesthetic failures: it appropriates Thorne’s self-narrative to service a dramatic template that erases the epistemic texture of scientific dissent. This wrong persists despite legal permissibility and viewer warnings, scaling with public significance and binding filmmakers to duties toward intellectual legacy. Whether posthumous dignity generates *robust* moral claims remains contested (e.g., Derek Parfit’s reductionism vs. George Pitcher’s "antemortem person" theory), but the distortion of agency and epistemic logic constitutes a philosophically defensible harm.  

  ---

  ### Marking Scheme (30 marks total)  
  **Must-hit conceptual moves, marks allocated, and common errors:**  

  | **Conceptual Move** | **Marks** | **Common Error (Costs Marks)** |  
  |----------------------|-----------|--------------------------------|  
  | **1. Identifies the gap**: Explicitly distinguishes the alleged wrong from (a) posthumous experiential harm, (b) viewer deception (given disclaimers), and (c) generic historical inaccuracy. Cites legal irrelevance of defamation. | 5 | Conflates the issue with consent/defamation or claims the dead "suffer harm." |  
  | **2. Analyzes narrative restitution as moral failure**: Explains "self-interpretive authority" (or similar: narrative agency, hermeneutic injustice) as a contested but distinct moral category. Grounds in at least one theorist (e.g., Margalit, Cavarero, Fricker). | 7 | Presents narrative restitution as consensus; fails to flag its contested status. |  
  | **3. Analyzes epistemic distortion as aesthetic failure**: Diagnoses how fictionalizing motives distorts the *logic* of scientific reasoning/dissent. Links to aesthetic responsibility (e.g., Nussbaum, Rorty) or epistemic injustice. | 7 | Treats inaccuracy as only "artistic license"; neglects the specificity of epistemic norms. |  
  | **4. Evaluates hybridity/scaling**: Argues whether the wrong is hybrid or prioritizes one dimension. Addresses differential duties for public/private figures (e.g., more counter-narratives vs. higher legacy stakes). | 6 | Assumes wrong is identical for all subjects; ignores scaling nuance. |  
  | **5. Legacies vs. audiences**: Distinguishes duties to living viewers from duties to intellectual legacy (e.g., as collective epistemic resource). Engages the contestation around posthumous standing (e.g., Matthes vs. Parfit). | 5 | Reduces legacy to "reputation" or ignores duties beyond the living. |  

  **Key Notes for Grading**:  
  - Award marks for *clarity in separating settled facts* (no legal defamation, no experiential harm) *from contested claims* (narrative restitution, posthumous dignity).  
  - Reward engagement with **two distinct frameworks** (e.g., narrative ethics + epistemic injustice).  
  - Deduct marks for treating any contested thesis (e.g., "the dead have moral standing") as undisputed.  
  - Top-tier answers recognize that the hybrid failure arises from **collapsing moral agency into aesthetic causality**.
