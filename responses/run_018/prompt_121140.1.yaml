  Please explain the conceptual issue at the heart of the Rietdijk-Putnam argument for the block universe, specifically whether the inference from "special relativity lacks a globally privileged hyperplane of simultaneity" to "there is no objective present" depends on treating presentness as a single system-wide state. From my background in software engineering, this resembles assuming a distributed system must have one global clock, when nodes in fact maintain consistent local orderings through logical clocks without universal synchronization. Does allowing presentness to be frame-local—consistent within each inertial frame but not extending globally—undermine the eternalist conclusion, or does it merely relocate the metaphysical problem to explaining why any particular local frame should be privileged? Keep the explanation conceptual rather than mathematical; I want to know whether this "distributed clock" framing actually changes the philosophical verdict or is only an analogy, and which structural feature of the original argument does the real work either way.
reasoning: |-
