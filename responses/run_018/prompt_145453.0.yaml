answer: |-
  ## Exam Question

  **Essay Question:** A museum board debates whether to acquire an AI-generated image that elicits profound aesthetic experiences in viewers. Trustee A argues it *is* art because it fulfills art's core function of producing aesthetic experience. Trustee B argues it *is not* art because it lacks necessary human authorship or intentionality. Trustee C claims the disagreement is purely verbal, as 'art' has no essence and exhibits family resemblances. Drawing on concepts from our unit on verbal disputes and metaontology:

  1.  **Diagnose** the nature of the disagreement: Is it genuinely verbal (about the meaning of 'art'), ontologically substantive (about the nature of art itself), or pragmatically encroached (driven by practical institutional concerns)? Argue for your diagnosis.
  2.  **Evaluate** whether adopting a precise institutional definition of 'art' (conceptual engineering) resolves the board's conflict or merely relocates the dispute into a normative debate about the museum's acquisition criteria.
  3.  **Assess** whether a deflationary metaontological approach (e.g., quantifier variance or easy ontology regarding art-kinds) can consistently support the claim that such an engineered definition carries authoritative weight for determining museum policy. Does deflationism help or hinder establishing institutional authority?

  ---

  ## Model Answer (Approx. 600 words)

  The museum board's dispute over the AI-generated image presents a complex interplay of verbal, ontological, and pragmatic elements, but pragmatic encroachment is the most salient driver.

  **(1) Diagnosis: Primarily Pragmatically Encroached**
  Trustee C's claim of a purely verbal dispute, based on Wittgensteinian family resemblance, captures a key insight: 'art' lacks a univocal, essentialist definition. Disagreement *can* arise from semantic indecision or differing speaker-meanings. However, dismissing it *as merely* verbal overlooks the depth of the trustees' concerns. Trustee A and B aren't simply confused about word usage; they hold competing *normative conceptions* of what *ought to count* as art *for the museum*. Trustee B's insistence on human authorship isn't just a linguistic preference; it reflects a deep-seated view about the nature of artistic value and creativity tied to human agency. Crucially, the *context* transforms the dispute. The board isn't engaged in abstract metaphysics; they face a concrete institutional decision with practical consequences – acquisition policy, resource allocation, institutional identity, and public perception. The disagreement is fundamentally *about what criteria should govern the museum's actions* in this novel case. While semantic indeterminacy (family resemblance) provides the *space* for disagreement, the *force* and *stakes* of the dispute stem from pragmatic institutional imperatives. It is thus best characterized as pragmatically encroached: ontological and semantic indeterminacy are present, but the disagreement's heat and substance derive from its practical context and consequences.

  **(2) Evaluating Conceptual Engineering: Relocation, Not Resolution**
  Adopting a precise institutional definition (e.g., "For acquisition purposes, 'art' denotes any artifact intentionally created to elicit, and successfully capable of eliciting, significant aesthetic experience, regardless of creator") is an act of conceptual engineering aimed at resolving ambiguity. However, it does not truly resolve the *underlying normative conflict*; it merely *relocates* it. The debate shifts from "Is this art?" to "Is *this definition* the right one for *our* museum?" Trustee B, favoring human authorship, would now argue against the *advisability* or *normative appropriateness* of the engineered definition itself. They might contend that adopting such a definition cheapens the collection, misleads the public, or abandons the museum's core mission of preserving human cultural achievement. Trustee A would defend the definition as progressive and inclusive. The question becomes explicitly normative: "What *should* the museum value and display?" Conceptual engineering clarifies the *terms* of the debate and forces the normative disagreements into the open, which is operationally useful, but it doesn't eliminate the fundamental clash of values concerning the museum's purpose and identity. The ontology of art might be rendered neutral by the stipulation, but the normative debate about institutional criteria intensifies.

  **(3) Deflationary Metaontology and Institutional Authority: A Tension**
  Deflationary metaontology (e.g., Hirsch's quantifier variance or Thomasson's easy ontology) undermines the claim that an engineered definition carries inherent, authoritative ontological weight. Quantifier variance suggests different conceptual schemes (e.g., one including AI outputs as art-kinds, one excluding them) are equally legitimate ways of "carving the world"; no single scheme captures "the real" art-kinds. Easy ontology claims that, given our conceptual and social practices, answering existence questions about artifacts like artworks is straightforward and doesn't reveal deep metaphysical truths. Both views imply that the museum's definition isn't discovering a pre-existing ontological fact about "Art"; it's *creating* a local institutional category. While deflationism readily accommodates the *possibility* of such institutional categories (as part of our social practices), it struggles to explain why *this particular* definition should carry *authoritative weight* binding the institution. If all conceptual schemes are metaphysically on par (quantifier variance) or existence is trivially analytic (easy ontology), the authority of the definition must come *entirely* from *outside* the deflationary framework – from institutional power, democratic process, curatorial expertise, or pragmatic efficacy. Deflationism itself provides no ontological grounding for privileging one engineered definition over another. It can describe the institutional act of definition but cannot consistently support the claim that the resulting definition possesses an authoritative ontological status *within the museum context* that transcends the normative/pragmatic reasons for adopting it. The demand for authoritative weight conflicts with deflationism's leveling of ontological claims.

  ---

  ## Marking Scheme (Total: 20 Points)

  *   **Diagnosis (6 points):**
      *   **A (5-6 pts):** Clearly distinguishes verbal, ontological, and pragmatic elements. **Crucially identifies pragmatic encroachment as primary driver**, linking it explicitly to the *institutional context* (acquisition policy, identity, consequences). Explains why not merely verbal (competing normative conceptions) and why not primarily ontological (practical stakes overwhelm abstract metaphysics). Mentions semantic indeterminacy/family resemblance as enabling but not causing the dispute's substance.
      *   **B (3-4 pts):** Identifies elements but lacks clear prioritization or strong argument for pragmatic encroachment. May lean too heavily on "verbal" or "ontological" without adequately engaging the institutional context. Or, identifies pragmatic aspects but doesn't fully distinguish them from verbal/semantic confusion.
      *   **C (1-2 pts):** Misdiagnoses (e.g., solely verbal; solely ontological). Fails to engage with the pragmatic institutional context. Superficial treatment.
      *   **Deduct:** -1 for conflating speaker-meaning indecision with semantic vagueness/family resemblance. -1 for ignoring the normative dimension of the trustees' positions.

  *   **Conceptual Engineering Evaluation (6 points):**
      *   **A (5-6 pts):** Clearly argues that engineering **relocates rather than resolves** the dispute. **Explicitly identifies the shift to a normative debate about the *appropriateness* of the definition for the museum's goals/identity.** Explains *how* the ontological question is settled by fiat, forcing the normative disagreement about criteria into the open. Recognizes engineering's operational utility while noting its failure to address underlying values.
      *   **B (3-4 pts):** States that engineering relocates the dispute but doesn't fully articulate the *nature* of the relocation (into normative debate about criteria). May imply resolution is possible without sufficient argument. Or, recognizes the normative shift but doesn't link it strongly to the museum's institutional purpose.
      *   **C (1-2 pts):** Claims engineering resolves the dispute. Or, sees relocation but misidentifies it (e.g., still as verbal or ontological). Fails to see the normative dimension.
      *   **Deduct:** -1 for failing to state that engineering makes the ontology *locally* conventional/stipulative. -1 for not connecting the normative debate to institutional *acquisition criteria* specifically.

  *   **Deflationism & Authority Assessment (6 points):**
      *   **A (5-6 pts):** Clearly explains the **core tension:** Deflationism (QV/Easy Ontology) **undermines claims of inherent authoritative ontological weight** for the engineered definition. **Explicitly states that deflationism levels ontological claims, making authority derive *only* from extra-ontological sources** (power, pragmatics, norms). Argues that deflationism *cannot consistently support* the definition's authoritative weight *qua* ontological claim within the institution. May note deflationism *allows for* institutional categories but cannot *ground their authority* ontologically.
      *   **B (3-4 pts):** Identifies that deflationism makes ontological claims lightweight or scheme-relative. Mentions that authority might need external sources. But doesn't fully articulate or argue for the *tension* or *inconsistency* between deflationism's leveling effect and the demand for authoritative ontological weight within the institution. May claim deflationism supports authority without adequately addressing the tension.
      *   **C (1-2 pts):** Misunderstands deflationism (e.g., thinks it implies no definitions possible). Claims deflationism straightforwardly supports or straightforwardly undermines authority without nuanced argument. Fails to engage with the core question of *authoritative weight*.
      *   **Deduct:** -2 for failing to distinguish deflationary metaontology from first-order ontological claims. -1 for conflating quantifier variance and easy ontology without noting relevant differences for this context.

  *   **Clarity, Structure, & Use of Concepts (2 points):**
      *   **A (2 pts):** Well-organized, clear prose. Precise and accurate use of key terms (verbal dispute, pragmatic encroachment, conceptual engineering, quantifier variance, easy ontology, deflationism, normative, ontological).
      *   **B (1 pt):** Generally clear but some disorganization or minor inaccuracies/misuse of terms.
      *   **C (0 pts):** Unclear, disorganized, significant misuse of terminology.

  ---

  **Confidence in Model Answer:**

  *   **Overall Confidence:** High (85-90%). The structure, core arguments about pragmatic encroachment, the relocation via conceptual engineering, and the tension between deflationism and institutional ontological authority are well-supported within the relevant literature and logically coherent.
  *   **Point of Least Confidence:** **The strength of the tension between deflationism (specifically Amie Thomasson's easy ontology) and institutional authority (Part 3).** While the model answer's argument holds strongly against quantifier variance, Thomasson's framework *emphasizes* the constitutive role of social and institutional practices *in determining* artifact kinds. One *could* argue that within the specific institutional context of the museum, adopting a definition *is* part of the practice that constitutes what counts as an artwork *for that institution*, and thus the definition *does* carry authoritative weight *derived from the institutional practice itself*, consistent with easy ontology. The model answer claims this weight must come from *outside* the deflationary framework (power, pragmatics), but Thomasson might argue the practice *is* the ontological grounding within her framework. The model answer leans towards seeing this as still pragmatic/normative (deciding *what* practice to have), but the line is finer here. An excellent student might push back on this point effectively, arguing that easy ontology *can* support institutional authority precisely by grounding it in institutional practice. (This would be an A-level insight).
