  Below is a comprehensive design for the "Delegation Cascade" game, optimized for your 50-minute seminar. The activity highlights how rational delegation at each tier can create a legitimacy crisis, even when the cascade technically completes. 

  ---

  ### **Game Design: Delegation Cascade**
  **Objective**: Simulate a nested delegation structure where rational cost-avoidance leads to representation without authorization, causing a legitimacy deficit.  
  **Core Mechanic**: At each tier, individuals choose to **vote** (pay 1 token), **delegate** (risk being forced to represent via lottery), or **abstain**. The cascade "breaks" if any tier fails to send representatives, forfeiting collective payoffs.

  #### **Setup**
  - **Students**: 18, divided into:
    - **6 local cells** (3 students each).
    - **2 regional councils** (each formed by 3 delegates: 1 from each of 3 local cells).
    - **1 national assembly** (2 delegates: 1 from each regional council).
  - **Tokens**: 
    - Each student starts with 10 tokens. 
    - **Direct voting** costs 1 token (paid immediately upon choosing "vote"). 
    - **Collective payoff**: +8 tokens/person *only* if the cascade reaches the national tier (predetermined approval). If the cascade breaks, no payoff (keep unspent tokens).
  - **Delegation Lottery**: 
    - Choosing "delegate" avoids cost but enters a lottery: Probability `1/n` (where `n` = number of delegators at that tier) of being **forced to represent** and pay 1 token. Others free-ride.
    - *Example*: If 2 students delegate at a tier, each has a 50% chance of being forced to pay/represent.
  - **Anonymity**: Critical to prevent social pressure. Use **sealed envelopes** for all choices; ballots collected simultaneously. No discussion allowed during voting phases.

  #### **Game Procedure** (Total: 50 min)
  1. **Introduction & Rules** (5 min)  
     - Explain tiers, token economy, and choices (vote/delegate/abstain).  
     - Emphasize: Delegation is cheap but risky; cascade breaks if any tier lacks representatives.  
     - Distribute materials: Tokens, ballots, envelopes, pens.

  2. **Round 1: Learning Mechanics** (15 min)  
     - **Local Tier (5 min)**:  
       - Each student in all 6 cells chooses:  
         - ✅ **Vote**: Pay 1 token, become a candidate to represent the cell.  
         - 🎲 **Delegate**: Avoid cost, risk lottery.  
         - ❌ **Abstain**: Do nothing.  
       - **Outcome per cell**:  
         - If ≥1 "vote", randomly select 1 voter as delegate (all voters pay; selected delegate advances).  
         - If 0 "vote" but ≥1 "delegate", run lottery: 1 delegator forced (pay 1 token) as delegate.  
         - If 0 "vote" and 0 "delegate", **cascade breaks** (no delegate).  
     - **Regional Tier (5 min)**:  
       - 3 delegates/council (1 from each of 3 cells) repeat the process to select 1 regional delegate for the national tier.  
       - *Same rules*: Delegates choose vote/delegate/abstain; lottery if no voters.  
     - **National Tier (1 min)**:  
       - If both regions send delegates, national assembly forms. **Collective payoff**: +8 tokens/person.  
       - If cascade breaks (e.g., no delegate at any tier), payoff = 0.  
     - **Debrief Lite (4 min)**:  
       - Quickly tally results. Likely, social pressure ensures high voting rates (cascade completes). 

  3. **Round 2: The Cascade Crisis** (15 min)  
     - Repeat Round 1 with **strict anonymity** (sealed envelopes, no discussion).  
     - **Predictable Outcome**:  
       - Delegation spikes at local tier (cost-avoidance dominates).  
       - In 1+ regional council, high delegation → no volunteers → lottery forces 1 reluctant delegate.  
       - National assembly forms with 2 delegates, but:  
         - Both likely forced via lottery (local → regional → national).  
         - They pay tokens (1–2 tokens lost) and feel overburdened.  
         - **Legitimacy deficit**: They question if they "represent" anyone, as peers free-rode.  

  4. **Debrief & Discussion** (15 min)  
     - **Map Behavior to Rational Choice**:  
       | **Tier** | **Rational Incentive** | **Observed Behavior** |  
       |----------|------------------------|------------------------|  
       | Local | Low pivotality + cost → Free-ride via delegation | Delegation spikes; lottery forces "unlucky" reps |  
       | Regional | Delegates (often forced) face same cost → Further delegation | Councils rely on lottery; reps feel unauthorized |  
       | National | Collective payoff hinges on participation | Burdened reps approve but feel outcome is illegitimate |  
     - **Key Insights**:  
       - **Cascade Effect**: Delegation is rational at each tier, but aggregates to legitimacy deficits (representation without authorization).  
       - **Pivotality Miscalculation**: The "probability of being pivotal" ignores how delegation transfers burdens upward, concentrating costs on few actors.  
       - **Emotional Reaction**: **Forced representatives** (especially at national tier) vocalize unfairness—"why me?"—making legitimacy deficits visceral.  
     - **Limitations of the Game**:  
       - **No Epistemic Dimension**: The "issue" (token payoff) is simple, so it cannot simulate *rational ignorance* (voters avoiding costs of learning complex policies). *Address this separately in discussion.*  
       - **Social Pressure**: Round 1 likely suppresses delegation (students coordinate to vote). Anonymity in Round 2 is essential to reveal true rational behavior.  

  #### **Materials List**
  - Tokens (paper chits): 180 (18 students × 10) + 144 (8 × 18 for payoff) = 324 total.  
  - Ballots: 18/round × 2 rounds = 36 slips.  
  - Sealed envelopes: 18/round × 2 rounds = 36.  
  - Pens: 18.  
  - Randomizer: Dice/RNG app for lotteries.  
  - Timer.  

  #### **Predictions & Emotional Anchor**
  - **What Goes Wrong in Round 1**: Social pressure ("let’s just vote!") suppresses delegation. Cascade completes smoothly but masks rational incentives.  
  - **Anonymity Fix**: Envelopes + simultaneous choice prevent peer influence, forcing cost-benefit calculations.  
  - **Emotional Catalyst**: **Forced representatives** (especially those "lotteried" at multiple tiers) will voice frustration, making the legitimacy deficit feel personal. Highlight their reactions in debrief.  

  #### **Timeline Summary**
  | Segment          | Time  | Key Activities                                                                 |
  |------------------|-------|--------------------------------------------------------------------------------|
  | Introduction     | 5 min | Explain rules, distribute materials.                                          |
  | Round 1          | 15 min| Local (5 min) → Regional (5 min) → National (1 min) → Quick tally (4 min).     |
  | Round 2 (Anon.) | 15 min| Repeat with sealed envelopes; focus on delegation spike & forced reps.        |
  | Debrief          | 15 min| Map choices to rational logic; discuss legitimacy deficit & game limitations. |

  ---

  ### **Instructor Notes**
  - **Why This Works**: The lottery mechanic forces students to confront the *unintended consequences* of rational delegation (e.g., "I delegated to save a token, but got forced anyway—and now everyone questions my authority").  
  - **Transition to Theory**: Post-game, link outcomes to real-world parallels (e.g., EU governance, electoral college) and reintroduce epistemic challenges ("What if voters *also* don’t understand the policies they delegate?").  
  - **Troubleshooting**: If Round 2 doesn’t produce a legitimacy crisis, stress the *structural inevitability* of the deficit: "Even if your cascade completed, did the reps *choose* their burden?"  

  This design ensures students viscerally grasp why delegation cascades undermine legitimacy—even when they "work." The token economy abstracts complexity, but the emotional stakes (via forced reps) make the theory unforgettable.
