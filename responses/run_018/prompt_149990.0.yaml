answer: |-
  The fly buzzed against the windowpane of the *Sunrise Diner*, a frantic, trapped rhythm Marla knew too well. She wiped the counter, the damp rag moving in the same counter-clockwise swirl she’d used for seventeen years. Outside, rain slicked the asphalt of Route 9. Inside, the smell of grease, coffee, and desperation hung thick.

  The ethical dilemmas of the Sunrise weren't grand. They were small, greasy coins passed hand to hand. Like the last slice of coconut cream pie cooling under its glass dome. Ernesto, the widower who came every Tuesday and Thursday at 3:15 PM, would slide into his booth, his eyes already flicking hopefully towards the pie case. Marla always gave it to him. *He needs the sweetness,* her inner script whispered. *Bev the waitress would just scarf it down.*

  Or Sal, the perpetually hungover dishwasher. When Bev stormed back, holding a coffee mug smeared with dried egg yolk, demanding, "Who cleaned this? Sal? Again?" Marla’s mouth opened automatically: "Nah, Bev, that was me. Rushed it." *Cover for him. He’s got those sick kids. One kindness.* The script ran smooth, unquestioned.

  It was Bev herself who planted the seed. "You're like that wasp," she’d snorted last week, refilling the sugar dispensers. "The one on that documentary? Drags the cricket, checks it forty times? Saw it and thought, damn, that’s Marla with Ernesto's pie. Every Thursday, same look, same little sigh before you cut it." Bev laughed. Marla had forced a smile, but the unease stuck.

  Now, watching the fly *buzz-thump, buzz-thump* against the glass, Marla saw it. Saw *herself*. The precise timing of slicing Ernesto’s pie at 3:17 PM, just as his coffee arrived. The exact phrasing when covering for Sal: "Nah, Bev, that was me. Rushed it." The specific way she’d slide the plate towards Ernesto, her fingers brushing the chipped edge. Not choices. Rituals. Sphex loops in a grease-stained apron. The coconut cream, the dirty mug, the small lies – they weren’t decisions made in the moment; they were grooves worn deep in her mind, playing out the same sequence, every single time.

  Horror, cold and greasy, slid down her spine. Was this all she was? A wasp dragging crickets of kindness and deceit along a predetermined path?

  **Tonight. Break it.**

  The script demanded she give Ernesto the last slice. He shuffled in at 3:15 PM, rain dripping from his hat. His hopeful glance towards the pie case was a physical pull on her muscles. Her hand twitched towards the dome. *He needs it.*

  **No.**

  Marla forced her eyes away. She grabbed a dishrag she didn’t need and scrubbed furiously at a phantom spot near the coffee machine. Ernesto ordered his coffee. She poured it, her knuckles white on the pot handle. Bev raised an eyebrow at the untouched pie. The silence stretched, thick with unfulfilled expectation. Ernesto’s shoulders slumped just a fraction as he stirred sugar into his coffee. Marla felt like a monster. This wasn't freedom; it was cruelty.

  Later, Sal shuffled in late, reeking of stale beer. Bev pounced before he’d even tied his apron. "Sal! The milkshake machine! It’s coated in gunk! Again! You cleaning blindfolded?"

  The script roared in Marla’s head: *Cover. Sick kids. Kindness.* Her mouth opened. Bev glared. Sal looked at the floor, a picture of hangdog misery.

  **Break it.**

  "Nope," Marla heard her own voice say, flat and strange. "Wasn't me. Looks like Sal's handiwork." The words felt like broken glass in her mouth. Bev’s triumphant "HA!" was a physical blow. Sal flinched, his eyes wide and wounded before he ducked into the dish pit. The silence that followed was deafening, accusing. Marla’s hands trembled. This wasn't freedom either. This was just breaking the china.

  The shift crawled. The fly buzzed. The guilt over Ernesto and Sal curdled in her gut. She felt exposed, raw, her hidden script ripped away, leaving only clumsy, painful improvisation.

  Near closing, the bell jingled. A woman stumbled in, soaked from the rain, her face pale and drawn. She ordered black coffee, her hands shaking. Marla poured it, the familiar motions a small comfort. The woman looked exhausted, hollow-eyed. The *new* guilt over Ernesto and Sal warred with the ingrained reflex: *Offer comfort. Feed them.*

  The last slice of coconut cream sat under its dome, gleaming under the fluorescent lights. The script was broken. Ernesto hadn't gotten it. This was pure impulse, a desperate lunge for real kindness.

  Marla didn't think. She lifted the dome, sliced the pie with decisive, unfamiliar movements, plated it, and slid it across the counter towards the woman.

  "On the house," Marla said, her voice rough. "Looks like you could use it."

  The woman stared, then a flicker of surprise, then profound gratitude washed over her face. "Oh... oh, thank you. Really. Thank you." She took a small bite, closing her eyes briefly. "Perfect."

  Warmth bloomed in Marla’s chest. Real warmth. Not the scripted warmth for Ernesto, but something fierce and bright. *This,* she thought, watching the woman eat, *this is choice.*

  Two days later, another rainy Thursday. Ernesto sat in his booth, nursing his coffee. He didn't even look at the pie case anymore. Sal moved silently in the dish pit, avoiding Marla's eyes. The air felt bruised.

  The bell jingled. Not the hollow-eyed woman, but a tired-looking trucker, shaking water from his jacket. He ordered coffee and a burger. Marla moved through the motions, the guilt over Ernesto and Sal a dull ache. As she waited for his burger, her gaze drifted to the pie case. One slice left. Coconut cream.

  And then she saw it. The trucker had pulled out a worn photo – a little girl, grinning. He traced her face with a thick finger, his own expression heavy. Loneliness radiated off him.

  The impulse hit her again. *He looks like he needs it.* The warmth from feeding the woman flared in her memory. Before she could question it, her body was moving. She lifted the dome, sliced the pie, plated it. She walked to his booth, not the counter.

  "Here," she said, setting it down. "On the house. Long haul?"

  He looked up, startled, then wary. "Yeah... thanks?" He glanced at the pie, then back at her. "Kind of you."

  Marla smiled, a practiced, automatic curve of the lips. "Everyone needs a little sweetness sometimes," she heard herself say. The words felt... familiar. Too familiar.

  She walked back behind the counter. Bev was watching her, a curious expression on her face. "Pie fairy strikes again?" Bev asked, a hint of Bev’s old teasing, but laced with something else. Observation.

  Marla froze. The phrase echoed. *"Everyone needs a little sweetness sometimes."* She’d said that exact sentence to the hollow-eyed woman. And the action – slicing decisively, walking it over, offering it "on the house" with that specific phrase.

  The fly buzzed against the glass. *Buzz-thump. Buzz-thump.*

  Horror, colder this time, absolute, washed over her. The spontaneous act – the beautiful, *real* choice she’d made for the woman – hadn't broken the loop. It had just become a *new* groove. A fresh, sticky ritual of impulsive kindness. She’d swapped the Ernesto script for the "Sad Stranger Gets Pie" script. The spontaneity itself had been ritualized. Catalogued. Ready to run again.

  Her gaze fixed on the fly. It wasn't frantic anymore. It was methodical. *Buzz-thump. Pause. Buzz-thump. Pause.* Searching, systematically, for the weakness in the glass, the invisible barrier. Trapped in the new pattern it had created for its escape.

  Marla picked up a damp rag. Her hand moved. Counter-clockwise swirls on the Formica. Around and around. Outside, the rain fell on Route 9, the same as always. Inside, the smell of grease, coffee, and the terrifying sweetness of a brand new trap clung to the air. The next dilemma was already forming, somewhere down the line, waiting for its turn in the script.
