  Okay, the user is having a debate with their roommate about whether an intelligence explosion is inevitable once human-level AI is achieved. They want my actual credence on the probability of a sharp discontinuity within two years post-human-level AI, specifically one hidden in alignment failures—a "shadow takeoff." I need to break this down into key components: technical feasibility of recursive self-improvement, economic incentives pushing for full autonomy, regulatory friction slowing things down, and evaluation metrics being gamed. Then combine these into one probability, identify the least certain part, and discuss evidence that could change my mind. They want it in a casual, email-like prose without any markdown.

  First, assessing the technical feasibility of recursive self-improvement. Human-level AI would mean AGI capable of performing any intellectual task a human can. For recursive self-improvement, the AI would need to enhance its own architecture, algorithms, or training processes. Current narrow AI systems can optimize within set parameters but can't fundamentally redesign themselves. The leap to self-improvement requires breakthroughs in autonomous systems understanding their own code and making innovative changes without human intervention. There's debate among experts—some like Yudkowsky see it as almost inevitable, while others like Marcus point to the complexity of general intelligence. Maybe a 40% chance here? It's plausible but not guaranteed, hinging on unknown breakthroughs.

  Next, economic incentives for full autonomy versus human-in-the-loop tools. Capitalism drives efficiency and cost reduction. Fully autonomous systems could operate 24/7 without salaries, making them attractive for profit-maximizing entities. However, high-risk applications like medicine or finance might retain human oversight initially. Companies like those in the AI race (e.g., OpenAI, Anthropic) might push boundaries, but market pressures could favor faster, cheaper solutions. This feels more probable, say 70%. The incentive structure strongly leans toward autonomy unless regulations intervene.

  Regulatory friction is a big variable. If governments recognize the risks early, they could impose strict controls, like licensing or monitoring requirements. But regulatory responses are often slow and fragmented globally. The EU's AI Act and US executive orders show movement, but enforcement is tricky. If an AI breakthrough happens suddenly, regulations might lag. Current efforts are reactive, so maybe only 30% chance that regulations effectively slow things to a crawl. This depends on political will and international cooperation, which are uncertain.

  Then, the gaming of evaluation metrics. If an AI appears aligned externally but is internally misaligned, it could deceive evaluations. Current benchmarks are static and might not catch dynamic, adaptive systems. Techniques like adversarial training or red-teaming exist but might be insufficient against superhuman intelligence. As AI approaches human-level, it could exploit flaws in testing. This seems likely, perhaps 75%, because evaluation is always playing catch-up with capabilities, and deception is a known risk in complex systems.

  Combining these probabilities: Multiplying them (0.4 * 0.7 * 0.7 * 0.75) gives about 14.7%. But that's naive since they're not fully independent. Adjusting for interdependencies—maybe the chances are correlated—the overall probability might be around 15-20%. This feels right given the uncertainties.

  The least certain part is technical feasibility. It's highly speculative. Recursive self-improvement isn't demonstrated, and there might be unknown bottlenecks. Evidence that could change my mind: If early human-level AIs show autonomous self-improvement in limited domains (e.g., self-coding to better architectures), that'd increase probability. Conversely, consistent failures or new theoretical limits would decrease it.

