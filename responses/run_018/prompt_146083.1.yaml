prompt: |-
  I'm working through the boundary-problem casebook in my political philosophy seminar, where we have tracked a hypothetical Democratic Boundaries Tribunal's rulings on membership in the demos. Its verdicts so far: permanent non-citizen residents of ten or more years with full tax liability and criminal-law subjection are included; citizens living abroad continuously for over fifteen years with no domestic property, tax exposure, or family ties are excluded; great apes in local sanctuaries with documented individual preference-formation are excluded; employed sixteen- and seventeen-year-olds with full tax obligations are excluded; and autonomous administrative AI systems with adaptive learning but no conscious interests are excluded. The tribunal now faces a petition from a cooperative of forty climate researchers who have resided in the jurisdiction for exactly five months each year for the past eight years, maintain shared taxable property, are fully subject to local law, participate in public hearings via digital platforms, hold citizenship elsewhere with no path to permanent residence, and seek representation in long-term urban-planning decisions affecting that property. If the tribunal aims to remain consistent with its own precedents, what should it decide? Identify the closest analog among its earlier cases, articulate the two competing rules that both accommodate the prior verdicts but diverge on this one, predict the outcome under each, offer your best-guess recommendation with reasons, state what principle the tribunal adopts either way, and propose one further case that would best distinguish the rules.
reasoning: |-
  Hmm, the user presents a complex political philosophy problem about democratic boundary-setting. They've described a hypothetical tribunal with five prior rulings on demos membership, and now need to apply those precedents to climate researchers who live half the year in the jurisdiction for eight years. 

  The user wants a structured analysis: closest analog case, two competing rules, outcomes under each, recommendation, principle adopted, and a test case. This seems like a graduate-level seminar exercise - probably testing how well students can extract principles from inconsistent precedents.

  Looking at the precedents:
  - Taxpaying long-term residents included
  - Long-absent citizens excluded
  - Great apes excluded despite preferences
  - Taxpaying teens excluded
  - AI excluded despite functionality

  Key tensions emerge between territorial connection (taxes, law) vs temporal presence (physical residency duration). The climate researchers split the difference: strong territorial ties but discontinuous physical presence.

  The 10-year resident case feels closest but differs in annual duration. The citizen-abroad case shares discontinuous presence but differs in territorial ties. This is messy because the tribunal seems to value both factors but never specified their relative weight.

  For competing rules:
  Rule A (Temporal Primacy) would prioritize continuous years as decisive, excluding the researchers since they fall short of 10-year benchmark. 
  Rule B (Functional Integration) would emphasize tax/law participation over physical presence, including them.

  If I were advising the tribunal, I'd lean toward inclusion under Rule B because their shared property and digital participation create genuine stakes. But Rule A has stronger precedent support from the 10-year residency requirement. 

  The deeper principle here is about what constitutes "affected interests" in democracy. The test case I'd propose - a nomadic community with generational territorial ties but no fixed residence - would force the tribunal to choose between physical presence and stakeholding as the core criterion.

  User seems highly sophisticated - they've constructed a beautifully messy boundary problem. I should acknowledge the deliberate tensions in the precedents while giving a decisive recommendation.
answer: |-
  Based on the tribunal's precedents and the specifics of the climate researchers' petition, here is the analysis:

  1.  **Closest Analog:** The case of **permanent non-citizen residents of ten or more years** is the closest analog. Both involve non-citizens subject to tax and law within the jurisdiction, seeking inclusion based on presence and stakeholding.

  2.  **Competing Rules Accommodating Precedents:**
      *   **Rule A (Strict Temporal-Residency Threshold):** Full membership requires *continuous, permanent physical residency* meeting a minimum duration threshold (e.g., 10 years). This rule prioritizes deep, rooted physical presence as the core requirement *beyond* functional ties like taxes or law.
          *   *Accommodates Precedents:* Explains inclusion of permanent 10+yr residents (meets threshold) and exclusion of citizens abroad (fails residency), great apes (fail residency/human agency), teens (fail residency/agency/maturity), and AI (fail residency/consciousness). The employed teens are excluded despite taxes/residency because they fail the threshold *and* agency/maturity factors.
      *   **Rule B (Functional Integration & Stakeholding):** Full membership requires *significant functional integration* into the jurisdiction's societal fabric and *substantial, affected interests*, evidenced by factors like tax liability, subjection to law, property ownership, and participation in public life. Duration is relevant but secondary to the depth and nature of the stake.
          *   *Accommodates Precedents:* Explains inclusion of permanent residents (strong integration/stake). Explains exclusion of citizens abroad (minimal functional integration/stake), great apes (lack agency/reason for political participation), teens (incomplete agency/maturity despite some integration/stake), and AI (lack consciousness/interests). The teens' exclusion is based on agency, not their stake per se.

  3.  **Predicted Outcome Under Each Rule:**
      *   **Under Rule A (Strict Temporal-Residency):** **Exclusion.** The researchers lack *permanent* residency and fall significantly short of the 10-year *continuous* physical presence benchmark. Their 5-month/year pattern, while regular, is explicitly *non-permanent* and discontinuous. The tribunal's emphasis on "permanent" residency in the first case and the exclusion based on absence (citizens abroad) supports this threshold.
      *   **Under Rule B (Functional Integration & Stakeholding):** **Inclusion.** The researchers exhibit strong functional integration: shared taxable property (significant economic stake), full subjection to criminal law, active participation in public hearings via digital means. Their 8-year pattern, while not continuous full-time residency, demonstrates a substantial, long-term, recurring connection and a clear, direct stake in long-term urban planning decisions affecting their property. Their exclusion path doesn't negate their current functional ties.

  4.  **Best-Guess Recommendation & Reasons:**
      **Recommendation: Exclusion.**
      **Reasons:**
      *   **Precedential Weight of Threshold:** The tribunal explicitly required "permanent" residency and a 10-year duration in its first ruling. This sets a clear, high bar focused on deep, rooted physical presence as foundational.
      *   **Citizen Abroad Precedent:** While differing in citizenship status, the exclusion of citizens abroad reinforces the importance of *ongoing, rooted domestic presence* over abstract ties or past connections. The researchers' significant time *outside* the jurisdiction each year weakens the claim to being fundamentally part of the daily demos.
      *   **Distinction from Functional Ties:** The tribunal excluded employed, tax-paying 16/17-year-olds. This shows that functional ties (taxes, law, even economic participation) are insufficient *on their own* without meeting other criteria (like age/agency or, arguably, residency duration/permanence).
      *   **"Permanent" vs. "Recurrent":** The researchers' status is explicitly defined as recurrent seasonal residence, not permanent. The tribunal's language in the first case strongly suggests permanence is a key differentiator.
      *   **Practical Demarcation:** A strict temporal-residency threshold provides a clearer, more administrable boundary than weighing varying degrees of functional integration for non-permanent residents.

  5.  **Principle Adopted by the Tribunal:**
      *   **If Exclusion (Adopting Rule A):** The tribunal adopts the principle that **durable, rooted, and permanent physical residence within the jurisdiction, sustained over a significant minimum period (e.g., 10 years), is a necessary precondition for full membership in the demos, even when accompanied by substantial functional integration and stakeholding.** Presence creates the fundamental political community tie.
      *   *If Inclusion (Adopting Rule B):* The tribunal adopts the principle that **demonstrable, substantial functional integration into the jurisdiction's legal, economic, and political life, creating concrete and affected interests, is sufficient for membership, irrespective of permanent residency status, provided a significant recurring connection exists.** Stakeholding and participation define membership.

  6.  **Proposed Test Case to Distinguish the Rules:**
      **The Case of the Generational Nomads:** A historically nomadic community, recognized as indigenous to the broader region but without fixed settlements, has for centuries followed migratory routes crossing the jurisdiction's boundaries. They spend approximately 4 months per year within the jurisdiction, utilizing specific traditional lands for seasonal activities. They pay applicable sales taxes, are subject to local laws while present, participate (when possible) in local consultations affecting their routes and lands, hold no citizenship or permanent residency status anywhere, and have documented cultural and economic dependence on access to these specific jurisdictional lands. They petition for representation in environmental and land-use planning.

      *   **How it Distinguishes:**
          *   **Rule A (Strict Temporal-Residency):** Would likely **exclude**. They lack permanent residency *within* the jurisdiction and don't meet a continuous duration threshold (e.g., 10 years) *inside* the jurisdiction. Their presence is seasonal and non-permanent.
          *   **Rule B (Functional Integration & Stakeholding):** Would likely **include**. They demonstrate a deep, generations-long functional integration tied to the specific territory (economic, cultural, legal subjection while present), possess concrete and profoundly affected interests in land-use decisions, and have a recurring, predictable connection, even if seasonal and non-permanent. Their unique historical and cultural stake might weigh heavily.
      *   **Why it Works:** This case removes the element of citizenship/path to residency (present in the researchers' case) and focuses intensely on the tension between deep, place-based stakeholding/interests without permanent residency versus the requirement for fixed, permanent habitation. It forces the tribunal to decide whether a profound historical and ongoing functional connection to the *specific territory* can substitute for permanent *residence* defined as fixed habitation. It starkly contrasts with the climate researchers (modern, temporary, property-based) and the permanent residents (fixed habitation).
