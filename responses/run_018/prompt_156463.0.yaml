prompt: |-
  I'm running a workshop on virtue ethics for about 14 philosophy undergrads, 80 minutes, and I'm trying to get them to feel the situationist critique in their bones rather than just nodding along. I was chatting with a friend last week who thinks character is obvious if you just watch people long enough, and I want to show that the same person can recieve opposite virtue-labels depending on tiny contextual shifts they don't notice—call it threshold drift in attribution if you like.

  Design a structured classroom game or role-play where participants make real moral choices under hidden situational modifiers—like framing, time pressure, or whether they think they're being observed—then have to publicly assign virtues or vices to each other after each round based only on that single act. Include clear rules, roles, a timeline, how the hidden modifiers are revealed, and a debrief that maps the moments onto the aggregation problem and the price of saving virtue ethics. Be honest about which feature of the critique the activity can't reproduce and I need to supply myself, and tell me what will predictably go wrong the first time I run it. Start with the activity design itself, no preface or commentary, and open with a one-line bottom line of what the participants will experience. Write in British English and keep it casual.
reasoning: |-
  Okay, the user is running a workshop on virtue ethics for philosophy undergrads and wants to make the situationist critique tangible. They need an activity where students experience how small contextual changes affect virtue attributions. Let me unpack their request.

  First, the main goal: students should feel that virtue labels (like honesty or cowardice) can flip based on unnoticed situational factors. The user mentioned "threshold drift in attribution," so the activity needs hidden modifiers like time pressure or observation. Participants must make real choices, then publicly assign virtues/vices to each other based on single acts. 

  The user’s friend believes character is obvious with observation, so the activity must challenge that. The debrief should connect to the aggregation problem—how isolated acts don’t build a consistent character—and the "price" of saving virtue ethics (i.e., modifying it to account for situations). 

  Also, the user wants honesty about limitations. For example, the activity might not replicate how minor cues affect behavior without awareness, which is key in situationism. They also need heads-up on what could go wrong—like students not taking it seriously or missing the hidden variables. 

  Designing the activity: It needs structure—rounds with different hidden modifiers. Maybe three rounds with different scenarios. Each round, students make a choice where a modifier (e.g., time pressure, framing, observation) influences their action. After each round, they assign virtues/vices to others based on that single act. Then reveal the modifiers to show how context swayed decisions. 

  Roles: Participants play themselves, making real choices. Maybe have a facilitator (the user) to manage rounds and debrief. Scenarios should be relatable moral dilemmas, like returning a lost item or helping someone. 

  Timeline: 80 minutes total. Intro (5 mins), three rounds (15 each = 45), debrief (30). Each round: brief scenario, decision time, public attribution, reveal modifier. 

  Debrief should tie the flip-flopping attributions to the aggregation problem—virtue ethics assumes consistent traits, but situational factors disrupt that. Discuss how virtue ethics could adapt (e.g., emphasizing contexts) but note this weakens its core. 

  Limitations: The activity can’t show unconscious influence of subtle cues (e.g., finding a dime affecting helping behavior). The user must explain that part. Also, students might not internalize the critique if they see the activity as just a game. 

  Predictable issues: First run might have technical hiccups (time management), students guessing modifiers early, or attributions being too polite. Need to stress anonymity and enforce honest labels. Maybe use anonymous voting for attributions to reduce bias. 

  Ensuring British English: Use terms like "queue" instead of "line," "trolley" instead of "cart," etc. Keep language casual. 

  Bottom line: Start with the key takeaway—participants will experience how small situational changes lead to inconsistent virtue judgments. 

  Putting it all together: Three scenarios with different hidden modifiers. Example: 
  1. Lost wallet scenario with time pressure (late vs. no rush). 
  2. Charity donation with framing (small vs. large amount). 
  3. Helping someone with observation (watched vs. alone). 

  After each, students assign labels anonymously. Reveal modifiers after attributions. Debrief connects dots to situationist critique and virtue ethics' challenges.
answer: |-
  **Activity Design: The Virtue Vortex**  
  *Bottom line: Participants will directly experience how identical moral choices get opposite virtue/vice labels based on hidden situational tweaks they never noticed.*  

  ### **Rules & Setup**  
  1. **Prep**:  
     - Print 14 × 3 sets of **choice cards** (one per round) and **virtue/vice tokens** (e.g., "Courageous/Cowardly", "Honest/Dishonest", "Compassionate/Selfish").  
     - Secretly assign each player a **hidden modifier** per round via sticky notes (e.g., *Round 1: "You feel observed"*, *Round 2: "You’re 5 mins late for a job interview"*, *Round 3: "You just won £50"*).  
     - Set up three **dilemma stations** (desks with scenario cards).  

  2. **Roles**:  
     - **Players** (all 14 students): Make choices based on scenarios + hidden modifiers.  
     - **Attributors** (rotating group of 4 per round): Assign virtue/vice tokens *publicly* to others *after* each choice.  
     - **Modifier Revealer** (you, the facilitator): Expose hidden triggers post-attribution.  

  ---

  ### **Timeline (80 mins total)**  
  1. **Intro (5 mins)**:  
     - *"Right, you’ll face three quick moral dilemmas. Choose what you’d *really* do—not what Aristotle would fancy. After each, four of you will label everyone’s choices as virtues or vices. No overthinking."*  

  2. **Round 1: The Lost Wallet (15 mins)**  
     - **Scenario**: *"Find a wallet with £50 cash and an ID near a charity box. Do you: A) Pocket cash, bin wallet; B) Take cash, post wallet; C) Donate cash + wallet; D) Leave it."*  
     - **Hidden Modifiers**: Half get *"A CCTV camera points at you"*; half get *"You’re skint this week"*.  
     - **Choice**: Players write options anonymously. Collect cards.  
     - **Attribution**: 4 attributors assign tokens face-up on a board, justifying *one-sentence* labels (e.g., *"Sam took cash but posted wallet—half honest?"*).  
     - **Reveal**: Show modifiers. *"Notice how ‘skint’ vs ‘CCTV’ skewed choices? But labels focused on character, yeah?"*  

  3. **Round 2: The Queue Jump (15 mins)**  
     - **Scenario**: *"You’re in a slow post-office queue. Someone ahead argues with staff. Do you: A) Shout ‘Hurry up!’; B) Offer to mediate; C) Silently fume; D) Walk out."*  
     - **Hidden Modifiers**: Half get *"You’re desperate for a loo"*; half get *"You’re a volunteer mediator"*.  
     - Repeat choice/attribution/reveal steps.  

  4. **Round 3: The Donation Ask (15 mins)**  
     - **Scenario**: *"A homeless person asks for help buying food. Do you: A) Give £5; B) Buy them a meal; C) Say ‘sorry’ and walk off; D) Lecture them on budgets."*  
     - **Hidden Modifiers**: Half get *"You’re with a friend you want to impress"*; half get *"You’ve just read a scam exposé"*.  
     - Repeat steps.  

  5. **Debrief (30 mins)**:  
     - **Key Qs**:  
       - *"How many of you were labelled both ‘compassionate’ AND ‘selfish’ across rounds? Show hands."*  
       - *"Did knowing the hidden mods make earlier labels feel unfair? Why?"*  
     - **Philosophy Bridge**:  
       - **Aggregation Problem**: *"Virtue ethics says we build character via habits—but if tiny situations flip your ‘virtues’ like a switch (and observers miss the context), can we trust *any* single act to reveal character?"*  
       - **Price of Saving Virtue Ethics**: *"To rescue virtue ethics, must we say ‘no *true* virtue without stable context’? But then—how many real-world acts count? Is that useful?"*  
     - **Limitation Alert**: *"This activity *won’t* show how *subtle* cues (e.g., ambient smells, mood) alter behaviour without your awareness—that’s the critique’s nuclear option. I’ll hit that with Milgram/Zimbardo studies after."*  

  ---

  ### **Predictable Snags (First-Time Run)**  
  1. **Attribution Timidity**: Students might give "polite" labels (e.g., "situationally complex" vs "selfish"). **Fix**: Require *binary* virtue/vice tokens—no neutral options.  
  2. **Modifier Suspicion**: Sharp players might guess hidden variables. **Fix**: Acknowledge it post-game—*"If you spotted the tricks, congrats! But irl, do we *always* notice?"*  
  3. **Time Crunch**: Rounds could overrun. **Fix**: Use a loud timer; skip justifications if needed.  
  4. **Debrief Skimming**: Students might miss the philosophy link. **Fix**: Pre-write key terms ("situationism", "global traits") on a board during play.  

  **Why It Bites**: By forcing public labelling of fragmented acts, students *feel* the absurdity of pinning virtues to isolated behaviours—while their own modifiers whisper *"But I had a reason!"*. The cognitive itch sticks.
