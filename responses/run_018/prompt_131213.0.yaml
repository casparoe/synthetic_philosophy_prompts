prompt: |-
  Please explain the conceptual divergence between etiological and causal-role theories of biological function, focusing specifically on cases of functional displacement with structural conservation—where a trait retains its morphological form because developmental pathways are locked, but the selective mechanism that originally maintained it has been replaced by an entirely different fitness contribution. Clarify three points with precision: (1) according to the etiological account, does the trait continue to bear its original function, or does it lose functional status altogether, and what in this judgment depends on conceptual commitments versus empirical facts about selection history? (2) According to the causal-role account, is the trait now assigned the new contribution as its function, or is it treated as non-functional because the original causal role is absent, and how does the account avoid arbitrarily privileging present systemic contribution over historical origin without smuggling in etiological considerations? (3) Is there conceptual space for an intermediate category—say, a trait being functionally orphaned but systemically integrated—that neither account can accommodate without collapsing into the other? In addressing these, do not rely on canonical textbook examples; instead, reason through the structural logic of the two theories as applied specifically to this displacement scenario, and indicate where each account must appeal to empirical biology rather than to its own conceptual apparatus.
