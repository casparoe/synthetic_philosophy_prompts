  **MEMORANDUM**  
  **TO:** Heritage & Secularism Review Board Members  
  **FROM:** [Your Name], Board Member  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation for Mill Road Chapel Restoration Grant (Application #CH-2024-09)  
  **VOTE DATE:** [Date of Next Tuesday’s Meeting]  

  ---

  ### **I. Background & Proposal**  
  The City seeks approval of a $350,000 restoration grant from the "Religious Heritage" tax stream to repair the roof of the municipally owned Mill Road Chapel. The chapel has hosted secular chamber music events since 2015 and is accessible to all residents. However, a consecrated altar remains in a closed back room, unused since municipal acquisition.  

  The "dual-stream" tax model allows residents to allocate a portion of municipal taxes to either "Religious Heritage" or "Secular Arts." 87% of the requested funds derive from taxpayer-designated "Religious Heritage" allocations.  

  ---

  ### **II. Core Arguments & Analysis**  

  #### **A. Argument for Approval: Neutrality as Non-Discrimination**  
  *Proponents contend that denying funds discriminates against taxpayers who chose the "Religious Heritage" stream, violating neutrality by excluding a historically significant building now used secularly. Neutrality requires equal treatment of all eligible heritage projects, regardless of origin, so long as public access and non-worship use are maintained. The altar’s existence is functionally irrelevant to current use.*  

  #### **B. Argument for Rejection: Neutrality as Anti-Endorsement**  
  *The strongest counterargument is that state funds (even if taxpayer-designated) repairing a building with an intact consecrated altar constitutes implicit state preservation of sacred infrastructure, violating substantive neutrality. The altar’s consecration creates ongoing symbolic entanglement, and public funds risk endorsing religious permanence. "Inactive" sacred objects still demand ritual deconsecration to achieve true secularization.*  

  #### **C. The "Museum Artifact" Compromise**  
  *Treating the altar as a museum piece attempts to reconcile heritage and secularism but creates unresolved tension: Can the state ethically curate an active sacred object without endorsing its significance? Our bylaws lack guidelines for "inactive sacred infrastructure," making this a legal gray area.*  

  ---

  ### **III. Dual-Stream Tax: Solution or Displacement?**  
  The model *mitigates* but does not *resolve* church-state entanglement:  
  - **Advantage:** Taxpayer choice distances the state from direct funding decisions, aligning with individual autonomy principles.  
  - **Limitation:** The state still administers and legitimizes the "Religious Heritage" category, risking perception that it sanctions religious infrastructure. The model shifts entanglement "upstream" to taxpayer intent but cannot erase the state’s role as fund distributor.  

  **Conclusion:** The model is a pragmatic tool for pluralism but requires strict adherence to secular use of funded assets.  

  ---

  ### **IV. Recommendation: APPROVE WITH CONDITIONS**  
  I recommend approval contingent on the following:  

  1. **Altar Remediation Timeline:**  
     - The Chapel must formally deconsecrate or remove the altar within **90 days** of grant disbursement, overseen by the City’s Heritage Officer.  
     - If retained as a "heritage artifact," a permanent educational plaque must contextualize its historical (not sacred) significance.  

  2. **Use Covenant:**  
     - Formalize in the grant agreement that the Chapel remains a non-sectarian, multi-use public venue. Worship activities remain prohibited.  

  3. **Dual-Stream Transparency:**  
     - The grant award must include public signage stating: *"Restoration funded by citizen-directed Religious Heritage tax allocations. This is a secular public venue."*  

  ---

  ### **V. Why Conditions Over Rejection?**  
  While the anti-endorsement argument is philosophically robust, rejection would:  
  - Penalize taxpayers who chose the "Heritage" stream for a legitimate civic asset.  
  - Ignore the building’s *de facto* secular utility and accessibility.  
  - Set a precedent requiring "ritual purity" of heritage spaces, hindering adaptive reuse.  

  Conditions address neutrality concerns by permanently desacralizing the space while respecting taxpayer intent and heritage preservation.  

  ---

  ### **VI. Next Steps**  
  - **Vote:** Recommend **APPROVE WITH CONDITIONS** as outlined.  
  - **Accountability:** Require quarterly reports on altar remediation and facility use.  
  - **Policy Gap:** Advocate for formal guidelines on "inactive religious objects" in municipal assets.  

  This approach balances civic trust, secular integrity, and pragmatic heritage stewardship. I welcome refinement of conditions before Tuesday’s vote.  

  Respectfully,  
  [Your Name]  

  ---  
  **APPENDICES**  
  - Secularism Act, Section 4(b): "Neutrality entails neither favor nor hindrance of religious practice."  
  - *Citizens for Secular Governance v. Linden City* (2021): Upheld taxpayer-designated funds if "final use is demonstrably public and non-devotional."
