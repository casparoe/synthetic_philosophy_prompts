  Key structural feature: abrupt tonal shift after satire. If removed (e.g., standalone publication), both views converge on literal meaning. The private-intention defender would argue context doesn't override authorial intent, but the phenomenon holds because public evidence objectively supports the ironic reading regardless of private truth. 

