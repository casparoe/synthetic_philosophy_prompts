prompt: |-
  i’m a phd student in philosophy of mind running a small grad-student intereview series. next week i’m talking to dr. elena voss — she defends this niche view that emotions aren’t judgments, perceptions, or bare feelings, but what she calls 'salience-framings': pre-reflective embodied modulations of predictive precision that structure what stands out as mattering, without being propositionally about anything. it’s like a merleau-ponty move filtered through interoceptive inference, plus her own twist called 'affective opacity' — the framing conceals its own source conditions, which is why we misreport emotions in self-report studies. i want eight to ten questions that go beyond restating the view. i need at least one on how salience-framings differ from standard predictive-processing accounts of affect, one on whether affective opacity kills first-person authority or just makes it unreliable, and one on emotional education — can you train the framing mechanisms? for each, include a follow-up keyed to the answer she’s most likely to give (she’ll probably say framing is subpersonal but normatively evaluable, that opacity is a feature not a bug, and that education targets precision-weighting rather than beliefs). no generic 'what drew you to philosophy' stuff, and please don’t ask me for citations or a reading list — i just need the actual questions.
