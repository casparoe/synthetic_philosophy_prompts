  ## Sestina: On Narrative Gravity

  This conscious point, this locus of control,
  Is not some captain locked behind the eyes,
  But something lighter, stranger: **gravity**,
  A shifting, necessary **center** formed
  By all the tangled strands of **story** told,
  From fragments of experience **spun**.

  We weave the cloth from which we are **spun**,
  Each choice and chance contributing its **weight**
  To what becomes the ongoing **story**,
  The sense of someone present at the **center**.
  It holds us fast with its persistent **pull**,
  This fictive, functional **gravity**.

  No marble core withstands this **gravity**,
  No tiny thinker bears the massive **weight**.
  (That homunculus is poorly **spun**!)
  Instead, the tales we live, the **story**
  Complex, accrues around a **center**,
  And binds perception with its subtle **pull**.

  **Listen!** The past exerts a constant **pull**,
  A narrative **inertia**, firm as **gravity**,
  Resisting rapid change at its deep **center**.
  To **rewrite** the self demands huge **weight**;
  It fights the alteration of the **story**
  From which the present self is deftly **spun**.

  **Stop!** The threads from which we're daily **spun**
  Resist the tearing, fight the sudden **pull**
  Towards a radically new **story**.
  This **inertia** guards the **gravity**,
  Protects the fragile **weight**
  Assigned within the swirling **center**.

  We search in vain for one true **center**,
  A stable point from which the world is **spun**,
  A sovereign bearing all the **weight**.
  Instead, we find a complex **pull**,
  The bending force of **gravity**
  Emerging from the lived-through **story**.

  **Rewrite** the **story**? Feel the stubborn **weight**
  Of chapters past, the **center** seeming fixed,
  Though really fluid! Watch the **spun**
  Tale tighten with its own fierce **pull**,
  A consequence of narrative **gravity**
  That holds the fragments with a binding **weight**.

  **Ah, feel** the **weight**? The **pull** is not illusion.
  The **story**, though **spun** from fleeting dust,
  Creates its own real **gravity**,
  Its shifting, binding **center**.

  **We call it self, this center, spun**
  By story's weight, its gravity and pull –
  No owner holds the tale, just its deep weight.
