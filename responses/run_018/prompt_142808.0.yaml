answer: |-
  Here are the five numbered items as requested:

  1. **Setup and materials needed:**  
     Printed ballots for each participant with a scenario (e.g., "Launch Product Z?") and three binary propositions: Premise 1 (P1: "Market growth >5%"), Premise 2 (P2: "Regulations allow launch"), and Conclusion (C: "Launch Product Z"), plus envelopes for secret ballot submission; a whiteboard to record the locked-in meta-rule and public vote tallies.

  2. **Rules, roles, and payoff scheme with small non-monetary stakes:**  
     Participants act as advisory board members; before any votes, they must publicly agree (via majority) on a single meta-rule ("If future votes tie on premises *or* conclusion, default to premise-based/conclusion-based aggregation"). Stakes: Participants earn a distinctive token for correctly predicting the group's final outcome *before* voting begins (incentivizing engagement in hypotheticals).

  3. **The debrief that maps each moment of the activity onto the formal parts of the dilemma:**  
     Locking the meta-rule mirrors choosing an aggregation rule *ex ante*; private judgment submission forms individual profiles; public premise/conclusion tallies reveal inconsistent collective judgments (6-6 on P1/P2, yet majority for C under conclusion-based *or* ¬C under premise-based); the clash forces recognition of path-dependence and collective irrationality.

  4. **What will predictably go wrong the first time and how to handle it:**  
     Participants may accidentally reveal judgments during meta-rule debate; enforce strict hypothetical framing ("*If* premises split..."). If the meta-rule vote ties, use facilitator’s random coin flip to decide, then proceed to highlight the fragility of procedural choices.

  5. **The one feature of the discursive dilemma this game can't reproduce:**  
     The formal dilemma’s dependence on *logical constraints* between propositions (e.g., C := P1 ∧ P2) is artificially imposed by the scenario rather than emerging from participants' independent reasoning; explicitly state this structural precondition post-activity.
