answer: |-
  That's an exceptionally sharp observation – you've perfectly dissected a recurring dialectical dance in hedonism debates. This *is* more specific than the general heterogeneity problem, though deeply related. The heterogeneity problem asks: "What single *feeling* do these diverse experiences (chocolate, solving a proof, Schadenfreude) share?" The pattern you describe is the *argumentative tactic* used to try and *evade* the heterogeneity problem and counterexamples, often resulting in conceptual instability.

  **The Phenomenon: Hedonic Gerrymandering**

  The established philosophical critique closest to this is the charge of **ad hoc redefinition** or **conceptual stretching**, but your description demands a more precise term. I propose calling it **"Hedonic Gerrymandering."**

  **Why "Hedonic Gerrymandering"?**

  1.  **Strategic Reshaping:** Gerrymandering involves redrawing electoral district boundaries for partisan advantage. Here, the hedonist strategically redraws the boundaries of "pleasure" to include desired cases (intellectual, aesthetic, moral pleasures) and exclude problematic counterexamples (base gratifications, malicious joys).
  2.  **Expansion (Inclusion):** The initial boundary is expanded ("pleasure isn't *just* sensory, it's deep engagement/approval!") to capture "higher goods" and make hedonism seem plausible.
  3.  **Contraction (Exclusion):** When a counterexample appears that fits the *expanded* definition but is morally/intuitively undesirable (Schadenfreude, base intensity), the boundary is abruptly contracted ("That's not *real* pleasure, it's mere gratification!") to protect the theory.
  4.  **Lack of Principle:** Like political gerrymandering, these boundary shifts often lack a consistent, *independent* principle. The definition changes reactively to win the immediate argument, not based on a pre-defined, robust criterion for "pleasure." The motivating force is often the desire to preserve hedonism's simplicity and avoid admitting non-hedonic goods.

  **What It Is Not:**

  1.  **Not *Just* Heterogeneity:** The heterogeneity problem highlights the *diversity* of pleasurable experiences. Hedonic gerrymandering is the specific *argumentative response* to that diversity and its problematic implications, involving inconsistent definitional shifts during debate. Heterogeneity is the landscape; gerrymandering is the map-drawing tactic.
  2.  **Not *Just* Changing Definition:** Definitions can legitimately evolve. The problem is the *ad hoc*, *reactive*, and *inconsistent* nature of the changes:
      *   **Ad Hoc:** Changes are made specifically to deflect a counterexample, not based on new evidence or a deeper theoretical insight developed independently.
      *   **Reactive:** Changes are driven by attacks, not by proactive refinement.
      *   **Inconsistent:** The criteria used to include "high" pleasures (e.g., "deep engagement") are often abandoned or ignored when the same criteria would require including "low" or "bad" pleasures.
  3.  **Not the No-True-Scotsman Fallacy (Exactly):** NTS involves immunizing a universal claim by redefining the subject *after* a counterexample is presented (e.g., "No Scotsman would do that!" "Well, Angus did." "Ah, but no *true* Scotsman would!"). Hedonic gerrymandering *can* involve NTS moments ("that's not *real* pleasure"), but it's broader. It also includes the initial *expansion* phase to capture desired cases, which isn't part of the classic NTS structure. NTS is a specific fallacy often *employed within* the gerrymandering tactic.

  **The Boundary: Legitimate Refinement vs. Ad Hoc Rescue**

  The line is drawn by **principled consistency and independent motivation:**

  *   **Legitimate Refinement:**
      *   **Motivation:** Driven by internal theoretical development, new empirical data, or resolving ambiguities *within* the existing framework, *not* primarily by counterattacks.
      *   **Principle:** Offers a *clear, consistent criterion* applied prospectively. Changes are justified by an overarching theory of pleasure/value.
      *   **Predictability:** The refined definition can explain *why* certain past cases were misclassified and predict how future ambiguous cases would be handled *before* they become debate points.
      *   **Example:** Feldman's attitudinal hedonism defines pleasure as *taking positive attitude (propositional pleasure) towards some state of affairs being experienced*. This is a principled, albeit controversial, attempt to unify diverse phenomena under a single psychological attitude type. He applies it consistently, arguing Schadenfreude *is* a form of pleasure (attitudinal pleasure directed at the rival's misfortune), even if it's morally bad. He doesn't gerrymander it away.
  *   **Ad Hoc Rescue / Hedonic Gerrymandering:**
      *   **Motivation:** Primarily driven by the need to deflect a specific counterexample threatening the theory's plausibility.
      *   **Lack of Principle:** The shift lacks a clear, consistently applied criterion independent of the immediate debate need. The definition changes based on the *value* ascribed to the experience (good/bad) rather than a descriptive feature.
      *   **Reactivity:** Changes happen *in response to* criticism, often mid-argument.
      *   **Inconsistency:** The justification used to include Case A (e.g., "deep engagement") is conveniently ignored or contradicted when excluding Case B which also fits that justification (e.g., sadistic immersion).
      *   **Example:** "Solving a proof is pleasurable because it's deeply absorbing... Schadenfreude? Oh, that's not *real* pleasure, it's just base gratification!" (No clear principle distinguishes "deep absorption" in math from "deep absorption" in malice, besides the speaker's valuation).

  **In Summary:**

  You've identified **"Hedonic Gerrymandering"** – the argumentative tactic of strategically expanding and contracting the definition of "pleasure" reactively to include intuitively valuable experiences while excluding intuitively disvaluable ones that fit the expanded definition, often lacking a consistent, independent principle to justify the boundary shifts. This goes beyond merely noting heterogeneity by focusing on the inconsistent *dialectical moves* used to defend hedonism against its consequences. The boundary with legitimate refinement lies in whether the definitional change is principled, consistent, independently motivated, and predictive, or if it's reactive, inconsistent, ad hoc, and driven solely by deflecting criticism. This pattern is a major reason many philosophers find simple hedonism ultimately unstable or question-begging.
