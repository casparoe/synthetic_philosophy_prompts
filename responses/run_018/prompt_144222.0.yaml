  Key angles to weave: For philosophers – frame friction as *preserving human agency* in knowledge acquisition. For engineers – position it as *safeguarding against manipulation* that could backfire. The "rough edges" metaphor needs to feel tangible for both. 

  Oh! Important – the user mentioned this is for a "strange little workshop," so the tone should match: intellectually serious but not self-important. Maybe open with that slightly wry acknowledgment of the odd pairing? 

