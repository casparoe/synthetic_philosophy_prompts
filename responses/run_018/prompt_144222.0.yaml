  I'm giving the opening remarks at a strange little workshop we're running next week — half philosophers of language, half ML engineers who've suddenly started worrying about persuasion. The theme's "how should a superintelligent system actually talk to us if it's going to be far more convincing than we are?" I want the talk to turn on this idea I'm calling epistemic friction: basically, if an AI is too smooth, too optimally persuasive, it erodes the listener's ability to check anything, so the ethical design goal isn't clarity or honesty in the usual sense but deliberately leaving rough edges in the argument. The audience is split — the philosophers will want the conceptual machinary (maybe twist Grice's maxims?), the engineers want to know why they'd build that in to a model. I need about eight minutes. Don't cite anyone or give me reading lists — I need something I can actually deliver without pretending I've read half the literature. Just work the idea through so both sides feel spoken to, and make sure the speech can't really be said without the friction concept — it should do real structural work, not sit there like decoration. Write it in British English please, I'm in London, and don't worry about being too polished — a typo or two is fine.
