answer: |-
  ## Research Proposal: The Pasadena Paradox, Undefined Expectations, and the Nature of Conditioning Contradictions

  **1. The Problem: Contradiction from Nowhere?**
  Decision theory relies on maximizing expected utility (EU). The Pasadena paradox (Nover & Hájek, 2004) presents a game where the EU is undefined (conditionally convergent but not absolutely convergent). Crucially, conditioning on *any* possible outcome of the game appears to yield a well-defined, finite EU for continuing play – but these conditional EUs contradict each other. For example, learning the absolute value of the first payoff might suggest playing on is beneficial, while learning its sign might suggest it's disastrous. This generates a contradiction: the *same* decision rule (maximize EU) gives conflicting recommendations based on logically equivalent information partitions. Our core question is: **In a decision scenario where conditioning on available information yields contradictory recommendations solely because the underlying expectation is undefined, is the resulting contradiction fundamentally mathematical, epistemic (pertaining to justification), or normative (pertaining to rational requirements)?**

  **2. Why Standard Resolutions Leave the Gap Open:**
  Standard approaches to the Pasadena paradox don't satisfactorily address this question:
  *   **Rejecting Conditioning:** Simply declaring conditioning invalid in undefined expectation scenarios dismisses a fundamental tool of rational updating without explaining *why* it fails here or what to do instead. It treats the symptom, not the cause.
  *   **Restricting Total Evidence:** Limiting the principle of total evidence (e.g., forbidding conditioning on certain types of information) seems ad hoc. *Which* partitions are inadmissible and *why*? This avoids the contradiction by fiat without resolving the underlying tension exposed by the undefined expectation.
  *   **Bounded Rationality:** Appealing to cognitive limitations (e.g., agents can't compute the infinite series) sidesteps the normative question entirely. The paradox presents a problem for idealized rationality; explaining it away with human frailty doesn't tell us what ideal rationality *should* prescribe.
  These resolutions focus on *avoiding* the contradiction or declaring the scenario pathological. Crucially, they leave untouched the precise nature of the contradiction that *would* arise for an ideal agent if conditioning were naively applied. Does this contradiction reveal a flaw in the mathematics of probability, a limitation in our epistemic access to rational requirements, or a genuine normative conflict inherent in the scenario?

  **3. Proposed Approach: Undefined Expectation as Structural Feature**
  We propose a shift in perspective: instead of viewing the undefined expectation as a mere technical glitch to be circumvented, treat it as a *structural feature* of the decision problem that reveals inherent limitations or requirements of decision rules when dealing with certain infinite state spaces and zero-probability events in continuous (or sufficiently fine-grained discrete) settings. The paradox highlights that undefined expectations create a vulnerability where standard conditioning procedures, applied naively to different partitions, can generate inconsistent prescriptions *even when the underlying probability model is coherent*. The question is whether any decision/conditioning rule can navigate this structure without contradiction.

  **4. Justification Against Alternatives:**
  *   **Declaring the Game Inadmissible:** While pragmatic, this is an admission of defeat regarding the normative question. It doesn't explain *why* such games are inadmissible beyond "they cause problems," nor does it illuminate the general structural issue for decision theory concerning undefined expectations and conditioning. Our approach seeks this deeper understanding.
  *   **Patching with Arbitrary Truncation:** Imposing an arbitrary finite bound (e.g., truncating the payoff series) renders the EU defined but *dependent on the arbitrary choice*. This replaces the paradox with arbitrariness, failing to provide a principled normative resolution. It obscures the structural feature (the sensitivity to infinity) rather than analyzing it. Our approach aims to find rules that work *without* introducing such unmotivated parameters.

  **5. Method: Formal Analysis of Conditioning Rules**
  We will formalize a minimal Pasadena-like model using standard probability theory (Kolmogorov axioms) and real analysis:
  *   **Model:** Define a simple game with payoffs \(a_n = (-1)^{n+1} \cdot \frac{2^n}{n}\) for outcome `n` (n=1,2,3,...), each with probability \(p_n = \frac{1}{2^n}\). Prove EU is undefined (conditionally convergent).
  *   **Conditioning Rules:** Analyze three distinct approaches to conditioning on an event `E` (e.g., "first payoff positive", "|first payoff| = k"):
      1.  **Standard Bayesian Conditioning:** Apply Bayes' theorem directly to update probabilities and compute conditional EU \(\mathbb{E}[U|E]\). Acknowledge the potential for ill-definedness.
      2.  **Jeffrey Conditioning:** Apply Jeffrey's rule for updating probabilities under a partition. Examine if this rule, designed for uncertain evidence, yields consistent conditional EUs across different partitions without assuming the unconditional EU exists.
      3.  **Restricted Principle of Indifference (RPI):** Explore a modified rule inspired by the principle of indifference, applied *only* to the specific partition defined by the conditioning event `E`. The idea is to define the conditional EU *relative to E* by assuming uniformity over the sub-partition induced by `E`, without presupposing a global expectation. Assess consistency.
  *   **Analysis:** For each rule and different partitions `E`, compute the resulting conditional EU recommendation (play/not play). Determine:
      *   Does the rule avoid generating a contradiction (i.e., consistent recommendations across partitions)?
      *   If it avoids contradiction, does it do so without introducing *new* arbitrary parameters (like a truncation point) or normative assumptions (e.g., "only coarse-grained evidence is admissible") that simply stipulate away the problem?
      *   What are the implications for handling zero-probability events (which are crucial in defining the partitions)?

  **6. Success and Failure Criteria:**
  *   **Success:** Achieving a clear, formal criterion distinguishing *admissible* from *inadmissible* conditioning procedures in scenarios with undefined unconditional expectation. Crucially, the Pasadena game, under this criterion, must determinately fall on one side (e.g., "Standard Bayes applied to fine-grained partitions is inadmissible, but RPI applied to coarser partitions is admissible and yields consistent recommendations"). The criterion must be motivated by the *structure* of the undefined expectation, not arbitrary stipulation.
  *   **Failure:** Demonstrating that all three examined conditioning rules either:
      *   **Collapse into contradiction** when applied to logically permissible partitions in the Pasadena scenario, or
      *   **Depend essentially on an arbitrary parameter** (like a cutoff) to avoid contradiction, or
      *   **Require importing normative assumptions** (e.g., restrictions on evidence granularity) that directly answer our core question by fiat, thus begging it.
  Failure would indicate the paradox remains genuinely unresolved at the normative level, pointing towards a fundamental tension requiring a more radical revision of decision theory or the acceptance of a specific type of normative limitation.

  **7. Timeline (One Semester):**
  *   **Month 1:** Deep dive into formal structure of Pasadena paradox & existing critiques. Formalize minimal model. Define relevant partitions.
  *   **Month 2:** Rigorous analysis of Standard Bayesian Conditioning applied to model. Map contradictions across partitions.
  *   **Month 3:** Rigorous analysis of Jeffrey Conditioning applied to model. Assess consistency and parameter dependence.
  *   **Month 4:** Develop and analyze Restricted Principle of Indifference (RPI) approach. Assess consistency and normative neutrality.
  *   **Month 5:** Comparative synthesis. Evaluate success/failure criteria. Draft core arguments and findings.
  *   **Month 6:** Finalize proposal paper for workshop, incorporating feedback from internal peer review.

  This research promises to clarify a persistent puzzle in decision theory by rigorously probing the nature of the contradiction arising from undefined expectations. By focusing on the structural implications for conditioning rules and avoiding easy outs, we aim to determine whether the Pasadena paradox reveals a mathematical artifact, an epistemic blind spot, or a genuine normative challenge for rational choice.
