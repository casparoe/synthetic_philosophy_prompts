  Propose an approach that treats the undefined expectation not as a technical glitch to be regularized away, but as a structural feature revealing how decision rules should handle events of probability zero in continuous spaces. Justify this structural interpretation against the obvious alternatives: either declaring the game inadmissible, or patching the expectation with an arbitrary truncated prior. Describe the method: formalize a minimal model using only standard probability theory, compare three conditioning rules (standard Bayes, Jeffrey conditioning, and a restricted version of the principle of indifference), and determine whether any avoids contradiction without importing normative assumptions that beg the question.

