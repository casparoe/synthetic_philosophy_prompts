prompt: |-
  Give an example of a conceptual issue that arises when applying Pascal's distinction between justice and force—justice being powerless without force, and force being unjust without justice's appearance—to a modern institutional design call it normative escrow: a system in which the coercive authority of a decision is exercised immediately, but its full normative justification is deliberately withheld from the affected party until after compliance, on the grounds that premature disclosure would undermine voluntary adherence. The example should isolate the precise moment where the institution must either reveal that its authority is mere force, destroying legitimacy, or fabricate a retrospective justification, making justice subservient to power. Present it in one paragraph, leading with the concrete institutional scenario, then briefly identifying the Pascalian tension it exposes; do not cite texts, name specific works, or propose reading lists.
reasoning: |-
  Okay, the user wants an example of a conceptual issue when applying Pascal's distinction between justice and force to a modern institutional design called "normative escrow." Let me recall Pascal's idea: justice needs force to be effective, but force without justice is unjust. Normative escrow involves coercive authority applied immediately, but the justification is withheld until after compliance to avoid undermining voluntary adherence. The challenge is that at some point, the institution must either reveal its authority as mere force or fabricate a justification, making justice serve power.

  The user specified a concrete scenario first, then the Pascalian tension. They want a real-world-like institution without citing texts. Possible scenarios: automated systems in public services, like benefit sanctions. Say, an algorithm flags an unemployment claimant for fraud, leading to immediate suspension of benefits. The person has to comply but isn't given the reasons until later. The moment of tension is when the claimant asks "why" and is told compliance is required before explanation. At that point, the authority must choose: admit the force (no reason given, which destroys legitimacy) or promise a future justification (which might be fabricated, subordinating justice to power).

  Need to ensure the scenario is plausible. Automated systems in welfare or tax agencies fit. The affected party's compliance is coerced without immediate justification. The key moment is the interaction where explanation is refused upfront. The tension is between revealing force versus manufacturing justification later, which aligns with Pascal's dilemma.

  Also, check if the example isolates the precise moment. The suspension is automatic, the claimant inquires, and the response creates the crisis: enforce now, justify later. That's the crux where legitimacy is at risk. The tension is clear: without immediate justice, force appears unjust; fabricating justification later makes justice serve power. Avoid any citations or proposals. Keep it concise, one paragraph as instructed.
answer: |-
  A municipal algorithm automatically suspends public transit passes for welfare recipients flagged by an income-reporting discrepancy, demanding immediate cessation of use under threat of penalty; the specific grounds for the suspension, however, are algorithmically generated and deliberately withheld from the affected individual until 72 hours *after* compliance is enforced, ostensibly to prevent gaming of the reporting system. The Pascalian crisis crystallizes at the precise moment the bewildered recipient, facing immediate loss of mobility essential for job-seeking or childcare, confronts the transit authority's automated enforcement agent demanding "Why?" and is met only with the unyielding directive to comply now for an explanation later: the institution must either admit the suspension currently rests on coercive force alone, devoid of presented justification (exposing its authority as fundamentally unjust in that moment), or assert a future justification exists but cannot yet be revealed (implicitly demanding trust that justice will retrospectively validate the force, thereby subordinating its legitimizing power to the prior exercise of raw authority).
