answer: |-
  The institutional asymmetry you describe—sanctioning explicit falsehoods but permitting strategic framing—rests on a specific constellation of philosophical commitments about truth, deception, and political legitimacy. Here’s a reconstruction of its implicit theory, followed by an analysis of its tensions with Arendtian concerns and proposed institutional reforms:

  **Implicit Philosophical Commitments:**
  1.  **Truth as Factual Correspondence:** The convention assumes a "naive realist" view of truth: a statement is true if it corresponds to an objective, verifiable fact. Lying is the intentional assertion of a non-corresponding fact. This is binary and sanctionable.
  2.  **Framing as Legitimate Political Judgment:** Selecting metrics, categories, and narratives is seen as an inherent and necessary part of political agency. It reflects priorities, values, and interpretations of complex realities. This is *hermeneutic*, not epistemic – it's about *what matters* or *how to see*, not *what is*.
  3.  **Harm Localized to Explicit Deception:** Harm to the public realm occurs primarily through deliberate factual inaccuracy, which:
      *   Directly violates the duty of candor to Parliament (the sovereign body).
      *   Undermines specific decisions based on that falsehood.
      *   Breaches trust in the *minister's personal veracity* as the Crown's representative.
  4.  **The "Technical Truth" Defense:** If a statement is factually verifiable in isolation, it is deemed acceptable, regardless of its contextual implications or omissions. The burden is on opponents to introduce counter-facts into the discourse.
  5.  **Institutional Boundaries of "Fact":** Facts are treated as discrete, atomic units. Framing operates *between* these units or *around* them, structuring their relationship and salience, but leaving the units themselves intact. The accountability system is designed to verify individual facts, not the architecture binding them.

  **Tensions with Arendtian Concerns:**
  Hannah Arendt’s critique ("Truth and Politics," *Lying in Politics*) directly challenges the sufficiency of this model:
  1.  **The Primacy of the "Common World":** Arendt argues politics depends on a shared, stable factual reality – the "common world" – as the bedrock for debate, action, and judgment. This world is constituted by *meaningful* facts, not just atomized truths.
  2.  **The Greater Danger: Eroding Factuality Itself:** While lies conceal specific facts, Arendt contends the gravest threat is "*organized lying*" – a systematic effort to make the very distinction between truth and falsehood irrelevant. Strategic framing, when pervasive and institutionalized, achieves this by:
      *   **Rendering Facts Politically Invisible:** As in your GDP example, crucial realities (regional decline, environmental cost) are not denied but made "institutionally unanswerable." They lack standing.
      *   **Destroying Shared Ground:** By controlling which facts *count* and how they relate, framing dissolves the common world. Different groups operate in incompatible factual universes.
      *   **Paralysing Judgment:** If the informational architecture precludes certain conclusions, meaningful political judgment – assessing the *whole* picture – becomes impossible.
  3.  **Intentional Restructuring as Violence:** For Arendt, intentionally restructuring the shared factual environment *is* an assault on the common world, even without literal falsehoods. It replaces reality with a manufactured "pseudo-reality" designed to serve power, not truth.

  **Could the Convention Survive an Arendtian View?**
  *   **Strictly:** The *literal form* of the convention (resignation only for explicit falsehoods) *could* technically survive, but its *spirit and function* would be utterly hollow and incoherent under a fully adopted Arendtian framework.
  *   **Accommodation vs. Requirement:** The current practice merely *accommodates* framing as politics-as-usual. An Arendtian view *requires* recognizing systematic, intentional framing that destroys the common world as equally, if not more, destructive than isolated lies. To remain coherent *as an institution aimed at truthful governance*, the convention would need radical transformation.

  **Concrete Institutional Reforms for Arendtian Coherence:**
  Adopting Arendt's view would necessitate profound changes to ministerial accountability mechanisms, shifting focus from *factual accuracy* to *factual completeness and contextual integrity*:

  1.  **Redefining Ministerial Misconduct:**
      *   **"Duty of Contextual Completeness":** Amend the Ministerial Code to include a duty not only to avoid falsehoods but to avoid presentations that systematically exclude material facts or contexts necessary for a reasonable understanding of the issue. Knowingly presenting a "grossly misleading" picture, even via selective truths, could become a resigning matter.
      *   **Sanctioning "Institutional Unanswerability":** Establish mechanisms to identify and penalize practices intentionally designed to prevent certain facts or perspectives from entering formal accountability processes.

  2.  **Reforming Parliamentary Scrutiny:**
      *   **Enhanced Correcting the Record:** Expand conventions to require ministers to correct not only factual errors but also omissions or presentations later shown to have created a *substantially misleading impression* when material facts were known at the time.
      *   **Parliamentary Questions (PQs):** Empower the Speaker or an independent officer (e.g., a strengthened Commissioner for Standards) to require ministers to answer PQs that expose excluded dimensions (e.g., "What is the GDP growth *and* the corresponding change in regional inequality/environmental indicators for the period?"). Refusal could trigger sanctions.
      *   **Select Committee Powers:** Grant committees explicit authority to demand alternative metrics, datasets, or analyses from government departments and independent bodies to challenge the government's framing. Require ministers to formally respond to such counter-narratives.

  3.  **Empowering Independent Factual Arbiter:**
      *   **Statutory Independence with Expanded Mandate:** Strengthen statistical offices (e.g., UK Statistics Authority) with:
          *   **Mandate for Relevance & Context:** Authority not only to verify accuracy but also to assess and report on the *sufficiency and appropriateness* of metrics chosen by the government for representing key policy areas (e.g., "Beyond GDP").
          *   **Duty to Publish Counter-Metrics:** Requirement to routinely publish complementary datasets and analyses that provide context or challenge dominant framings (e.g., regional breakdowns, well-being indices alongside GDP).
          *   **Power to Issue "Misleading Presentation" Warnings:** Formal power to publicly declare a government presentation, while technically accurate, to be materially incomplete or contextually misleading.

  4.  **Cultivating Epistemic Vigilance:**
      *   **Training & Culture:** Embed training for MPs, ministers, and civil servants on the ethical responsibilities regarding framing, context, and the dangers of rendering facts invisible.
      *   **Media & Public Discourse:** Encourage media and civil society to actively challenge not just falsehoods, but the selective frameworks within which facts are presented.

  **Conclusion:**
  The Westminster convention presupposes a sharp, legalistic distinction between *fact* (objective, verifiable, sanctionable if falsified) and *framing* (subjective, political, legitimate). It assumes harm arises only from the former. Arendt dismantles this distinction by showing how systematic framing can destroy the common world of shared facts – the very foundation of politics – more insidiously than discrete lies. Making the institution coherent with an Arendtian view requires moving beyond policing explicit falsehoods to actively defending the *completeness*, *accessibility*, and *meaningfulness* of the factual landscape upon which democratic deliberation depends. This entails transforming rules, empowering independent arbiters of contextual integrity, and fundamentally redefining what constitutes a breach of ministerial duty to the truth and the public realm.
