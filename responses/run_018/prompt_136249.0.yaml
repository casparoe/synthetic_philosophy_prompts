  hey, im a retired biophysist who got into philospohy late in life. heres a real-world thing i cant figure out. i have to split my estate between funding a scholarship for maybe fifty kids who'd have genuinely flourishing lives, or backing a longshot research program that might eventually create billions of artificial minds—but each one only has a life thats barely okay, not miserable but not thriving either. my friend says the second option is obviously better because you just add up all the welfare across every head, so a huge population of mediocre lives outweighs a small population of amazing ones. that feels wrong to me, like im missing something obvious, but i cant say what. is my gut reaction just sentimentality, or is there a real philosophical problem with counting lives that way? and does it change the moral math if the future minds are digital rather than biological?
