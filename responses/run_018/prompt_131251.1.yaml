answer: |-
  Your diagnosis is remarkably incisive—this stalemate reflects **three intertwined layers of disagreement**, and progress requires disentangling them:

  ### 1. **Normative vs. Descriptive Frames (The Core Confusion)**  
     - **Orthodox Bayesians** defend a *normative standard*: "What axioms must hold for choices to be *coherent* (avoiding Dutch books, dynamic inconsistency, etc.)?" For them, independence is non-negotiable rationality.  
     - **RWEU Advocates** often pursue *descriptive accuracy*: "How do humans *actually* weight outcomes under risk/ambiguity?" Convex risk-weighting captures Allais/Ellsberg behavior while preserving a form of probabilistic sophistication.  
     - **Crucial Point**: Both sides misuse "expected utility." Bayesians mean *Savage/vNM rationality*; RWEU means *mathematical expectation of utility under non-linear weighting*. **This is a framing trap.** Calling both "EU" obscures whether the goal is *prescribing* coherence or *describing* psychology.

  ### 2. **The Symmetric Risk-Weighting Anomaly**  
     Applying the *same* convex weight to gains/losses (e.g., in Wakker's work) is illuminating because:  
     - It **satisfies the independence axiom** (unlike prospect theory), *technically* appeasing Bayesians.  
     - Yet it **violates intuitive separability**: Choices between mixed gambles become context-dependent (e.g., "splitting" outcomes alters preferences).  
     - **Why it breaks stalemate rhetoric**:  
       - Bayesians *must* accept it as "rational" by their axioms but find it descriptively implausible.  
       - RWEU proponents can't cite ambiguity aversion since symmetric weighting treats gains/losses equally.  
     - **This reveals a hidden rift**: Orthodox axioms *permit* behaviors that feel "irrational" (e.g., extreme pessimism on gains), exposing that their notion of rationality is **purely formal**, not intuitive.

  ### 3. **Clashing Standards of Evidence**  
     - **Bayesians** demand: *"Show me coherence without independence!"* → RWEU can't.  
     - **RWEU** demands: *"Explain Allais/Ellsberg without ad-hoc fixes!"* → Bayesians resort to multiple priors (ambiguity) or error models (risk).  
     - **Symmetric weighting exacerbates this**: It satisfies Bayesian axioms but clashes with empirical data (humans aren't symmetrically risk-averse). This forces Bayesians to confront that their axioms **don't fully capture "rational" intuition**.

  ---

  ### Paths to Progress:  
  1. **Reframe the Question Explicitly**:  
     - **Normative project**: Admit that vNM/Savage is *one definition* of rationality (coherence) but not the only possible one. Explore what RWEU *prescribes* (e.g., for catastrophic risk).  
     - **Descriptive project**: Treat RWEU as a *parameterized model* of heuristics—no need to defend it as "rational."  

  2. **Leverage Symmetric Weighting Empirically**:  
     - Design experiments testing choices under symmetric vs. asymmetric weighting:  
       - *Hypothesis*: Symmetric RWEU predicts *neutrality toward ambiguity* (since gains/losses are weighted equally). Humans show loss-averse ambiguity aversion → rejects symmetric models descriptively.  
       - This could force Bayesians to acknowledge that *their* axioms permit unnatural behaviors, weakening the "rationality = only coherence" stance.  

  3. **New Axioms for a Middle Ground**:  
     - Seek axioms capturing **contextual separability** (e.g., "independence holds only for statistically independent events").  
     - **Example**: Machina's *local independence* or Chew/Sagi's *event separability*. RWEU could adopt these to clarify its normative basis.  

  4. **Formalize the Tradeoffs**:  
     - Prove what RWEU *sacrifices*: e.g., "Under convex weighting, agents accept strictly dominated strategies in dynamic choice X."  
     - Conversely, show what Bayesianism *loses*: "Savage agents cannot account for ambiguity premium Y without prior distortion."  

  5. **Walk Away from "EU"**:  
     - **Radical but clarifying**: Retire "expected utility" entirely. Adopt:  
       - **Coherentist Decision Theory** (Bayesian)  
       - **Psychological Decision Theory** (RWEU, prospect theory)  
       - **Prescriptive Pragmatism** (e.g., use RWEU for insurance, Bayes for markets).  

  ---

  ### Bottom Line:  
  This is **not just verbal**—it’s a collision of projects. Orthodox Bayesians defend a *logical foundation*; RWEU seeks *predictive fidelity*. Symmetric weighting is a **catalyst**: it proves that satisfying Bayesian axioms doesn’t guarantee psychological plausibility, forcing both sides to clarify their aims. **Real progress** requires:  
  - Experimentally testing symmetric RWEU predictions,  
  - Axiomatizing RWEU’s *context-dependent rationality* (e.g., "rational under deep uncertainty"),  
  - Explicitly agreeing that *coherence ≠ psychological validity*. 

  The stalemate persists because each side denies the other’s legitimacy. Breaking it means accepting that decision theory is **bifurcated**—and that’s scientifically healthy.
