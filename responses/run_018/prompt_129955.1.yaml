  Looking at their cases: They reject criminalizing private incest (Case 1) but want to ban the public desecration art (Case 2), shut down the private domination club (Case 3), allow the offensive private school (Case 4), ban the remorse-suppressing drug (Case 5), and prohibit the neighbor-reporting program (Case 6). The key tension is between Cases 1 and 3 - both private/consensual yet different verdicts.

