  Below is a decision tree taxonomy for positions on the coherence of qualia, constructed from concrete cases and designed to be accessible without prior philosophical knowledge. The tree starts from the minimal datum that adult humans can report changes in their experiences. Each branch poses a diagnostic question about a specific case, with answers leading to increasingly specific positions. Commitments for each branch answer are stated, and each leaf position includes a one-sentence formulation and its most awkward consequence. Unoccupied combinations are diagnosed as incoherent, unattractive, or underexplored. Positions the tree cannot genuinely separate are flagged.

  The tree has **8 branch nodes** and **12 leaves**, covering all requested variants (sensory discrimination fixed/emotional reaction changed; discriminative capacities changed/preference fixed; identical subjects disagree on intrinsic change; conflicting memory with evidence of corruption; artificial system case). Panpsychism is omitted, as no fork requires it.

  ---

  ### **Taxonomy of Positions on Qualia**

  **Root:** Adult humans can report changes in what their experiences are like (e.g., "Coffee tastes different now").

  1. **In the Chase-and-Sanborn case, when a taster reports unchanged coffee taste but changed preference (Case A), and another reports unchanged preference but changed taste (Case B), is there a fact of the matter about who is correct?**
     - **Yes (commits to objective facts about experience beyond behavior) → Branch 2**
     - **No (commits to no fact beyond reports/behavior; dispute is verbal or pragmatic) → Branch 3**

  2. **Branch 2 (from Yes): Two subjects have identical sensory discrimination, memory, attention, and verbal reports about coffee, but one insists the intrinsic taste quality has changed while the other denies it. Is there a fact about who is right?**
     - **Yes (commits to intrinsic properties not fixed by functional/behavioral facts) → Leaf 1: Robust Realism**  
       *Formulation:* Qualia are intrinsic, non-physical properties of experience, directly known only to the subject.  
       *Awkward consequence:* Qualia are epiphenomenal (have no causal power) or require mysterious mind-body interaction.
     - **No (commits to explaining disagreement via functional/representational differences) → Branch 4**

  3. **Branch 3 (from No): In cases like Chase-and-Sanborn with no fact of the matter, what explains introspective reports of changed experiences?**
     - **Reports track physical/functional states (e.g., brain states or preferences) → Branch 6**
     - **Reports are systematically mistaken or empty → Branch 7**

  4. **Branch 4 (from No in Branch 2): Sensory discrimination changes (e.g., nerve damage), emotional preference remains fixed, and the subject reports the taste itself changed. Is this report necessarily correct?**
     - **Yes (commits to experience being determined by sensory input) → Leaf 2: Representationalism**  
       *Formulation:* Qualia are identical to the representational content of sensory states (e.g., "taste change" means altered representation of coffee properties).  
       *Awkward consequence:* Inverted spectra are possible (e.g., your "red" could be my "green" with no behavioral difference).
     - **No (commits to experience depending on downstream processing, not just input) → Branch 5**

  5. **Branch 5 (from No in Branch 4): Discriminative capacities and behavioral responses change (e.g., cannot distinguish wines, new preferences), but the subject insists the taste quale is unchanged. Is this possible?**
     - **Yes (commits to qualia invariance despite functional change) → Leaf 3: Robust Realism (revisited)**  
       *Formulation:* Same as Leaf 1, but now affirming qualia can persist through functional disruption.  
       *Awkward consequence:* Qualia are "hidden variables" undetectable even by perfect third-person science.
     - **No (commits to functional role determining experience) → Branch 8**

  6. **Branch 6 (from Branch 3): Archived memory (e.g., diary) of a past taste conflicts with present introspective report, and independent evidence (e.g., neural scan) shows memory corruption. Should we trust the current report or the independent evidence?**
     - **Trust current report (commits to first-person authority overriding third-party evidence) → Leaf 4: Representationalism (revisited)**  
       *Formulation:* Same as Leaf 2, but privileging present representations over corrupted memories.  
       *Awkward consequence:* Introspection is infallible, even when neuroscience contradicts it.
     - **Trust independent evidence (commits to third-person data correcting introspection) → Leaf 5: Illusionism**  
       *Formulation:* Qualia seem real but are illusions; reports reflect cognitive/computational errors.  
       *Awkward consequence:* Evolution designed us to be deluded about our own minds.

  7. **Branch 7 (from Branch 3): Are reports about qualia useful for explaining behavior, even if qualia don't exist?**
     - **Yes (commits to reports as pragmatic fictions) → Leaf 6: Illusionism (revisited)**  
       *Formulation:* Same as Leaf 5, but emphasizing the utility of the illusion for cognition.  
       *Awkward consequence:* Consciousness is a "user illusion" with no basis in reality.
     - **No (commits to reports being fundamentally erroneous) → Leaf 7: Eliminativism**  
       *Formulation:* Qualia do not exist; reports are empty concepts from folk psychology.  
       *Awkward consequence:* We are profoundly wrong about our own experiences (e.g., "taste" is as mythical as "phlogiston").

  8. **Branch 8 (from No in Branch 5): A behaviorally/functionally indistinguishable artificial system confidently describes coffee taste. Does it have qualia?**
     - **Yes (commits to functional duplication sufficing for experience) → Leaf 8: Functionalism**  
       *Formulation:* Qualia are defined by functional roles (e.g., how taste inputs link to preferences and behavior).  
       *Awkward consequence:* A coffee-tasting AI has experiences identical to a human's, even if made of silicon.
     - **No (commits to biological or physical requirements beyond function) → Leaf 9: Biological Naturalism**  
       *Formulation:* Qualia arise only from specific biological mechanisms (e.g., human neurobiology).  
       *Awkward consequence:* Perfect brain emulations or aliens might lack experiences despite functional parity.

  ---

  ### **Unoccupied Combinations and Diagnoses**
  - **Branch 5, Answer Yes + Branch 2, Answer No:** Robust Realism (Leaf 3) after rejecting intrinsic facts in Branch 2.  
    *Diagnosis:* Incoherent—accepting intrinsic properties after denying they resolve disputes contradicts Branch 2's commitment.
  - **Branch 6, Trust current report + Branch 3, Reports track physical states:** Trusting introspection after reducing reports to physical states.  
    *Diagnosis:* Unattractive—privileging first-person reports undermines the reductive stance.
  - **Branch 8, Answer No + Branch 5, Answer Yes:** Biological Naturalism after affirming qualia invariance.  
    *Diagnosis:* Underexplored—could imply qualia are biological but stable, but rarely defended.

  ### **Indistinguishable Positions (Flagged)**
  - **Functionalism (Leaf 8) vs. Representationalism (Leaves 2/4):** The tree does not cleanly separate them, as both can accept functional/representational changes in taste cases. Representationalism is a subset of functionalism in many theories, differing only in whether content is privileged.
  - **Illusionism (Leaves 5/6) vs. Eliminativism (Leaf 7):** The tree distinguishes them weakly (utility of reports), but both deny qualia; illusionism is often seen as a "softer" eliminativism.

  ---

  ### **Leaf Position Summary**
  1. **Robust Realism (Leaves 1, 3):** Qualia are intrinsic, irreducible properties. *Awkward consequence:* Inexplicable by science.
  2. **Representationalism (Leaves 2, 4):** Qualia are representational contents. *Awkward consequence:* Undetectable spectrum inversion.
  3. **Functionalism (Leaf 8):** Qualia are functional roles. *Awkward consequence:* AI has human-like experiences.
  4. **Biological Naturalism (Leaf 9):** Qualia require biology. *Awkward consequence:* Non-biological duplicates lack experiences.
  5. **Illusionism (Leaves 5, 6):** Qualia are illusions. *Awkward consequence:* Evolution built a delusion.
  6. **Eliminativism (Leaf 7):** Qualia do not exist. *Awkward consequence:* We misunderstand our own minds.
  7. **Quietism (Leaf 10, via Branch 3):** The qualia debate is non-substantive. *Awkward consequence:* Philosophical stagnation. *(Note: Quietism is reached if Branch 3's "No" is interpreted as dissolving the question, but the tree omits a dedicated leaf for brevity; it is covered in the diagnosis of Branch 3.)*

  This tree isolates core commitments through cases but highlights where positions blur (e.g., functionalism/representationalism). Use it to map disagreements to underlying assumptions.
