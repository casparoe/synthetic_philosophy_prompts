  Second question: whether patterns detectable only at higher stances can support scientific realism. This is crucial for the no-miracles argument. If higher-level patterns can't ground abductions, it might push towards instrumentalism. But solving the first question might inform this, so there's a dependency here. Still, its importance to realism debates makes it a priority.

