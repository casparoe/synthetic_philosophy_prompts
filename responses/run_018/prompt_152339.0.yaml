  For the checklist structure, I'll use a linear flow with binary exits. Critical distinctions: Prediction Accuracy Check comes before Assumption Scrutiny (per Friedman), and the Representation/Instrumental test uses plain-language diagnostics like "Does this assumption hide affected groups?" rather than technical terms. The five-day deadline means no iterative steps - every path must conclude within the procedure.

  The three test conditions for assumptions need to be concrete: I'll use "masking effect" for erasing stakeholders, "mechanism skew" for distorted causality, and "stability threshold" for hidden fragility. These map to the housing, stormwater, and heat cases respectively. 

