  Remaining limitations: Even after this, (1) the team can't assess if consultants cherry-picked validation data, and (2) they can't evaluate competing models when multiple options exist. These require external expertise but stay within the constraints since the user said no authority to demand new data.

  Final polish: Using numbered steps with bold headers for scanability, avoiding "Friedman" by name to sidestep philosophy debates, and specifying that "acceptable error margins" must be predefined by consultants to prevent subjective judgments.
answer: |-
  ## Formal Model Review Procedure: Assumption Validation Checklist  
  *For non-specialist review of consultant models proposing land-use or infrastructure policy changes. Complete within 30 minutes using only submitted documentation.*

  ---

  ### **Step 1: Prediction Accuracy Validation**  
  *Question:* Does the model’s historical back-testing or validation against real-world data show aggregate prediction errors within the *consultant-defined* acceptable margin?  
  *Sufficient Answer:* Explicit statement or table in the report showing error margins (e.g., "flood predictions ±10% county-wide") and confirmation that actual errors fall within this range.  
  *Decision:*  
  - **✅ Continue** if errors are within stated margins.  
  - **❌ Stop (Reject)** if errors exceed margins or margins are undefined.  

  ### **Step 2: Critical Assumption Identification**  
  *Question:* List all assumptions explicitly labeled as "simplifying" or "unrealistic" in the report. If none are stated, identify 1–2 obvious simplifications (e.g., "all soils identical").  
  *Sufficient Answer:* Minimum of one assumption documented in writing.  
  *Decision:*  
  - **✅ Continue** if ≥1 assumption identified.  
  - **❌ Stop (Defer)** if no assumptions are identifiable in 5 minutes.  

  ### **Step 3: Assumption Classification Test**  
  *Apply all three test conditions below to each assumption from Step 2:*  

  | **Test Condition**               | **"Instrumentally False" (Harmless)**                                  | **"Representationally False" (Harmful)**                              |  
  |----------------------------------|------------------------------------------------------------------------|-----------------------------------------------------------------------|  
  | **1. Masking Effect**            | Does not hide policy-relevant groups/entities (e.g., "all parcels").   | Erases distinct groups the policy targets (e.g., "ignores renters").  |  
  | **2. Mechanism Skew**           | Simplifies *how* inputs interact but not *what* outcomes matter.       | Distorts causal drivers of the predicted outcome.                     |  
  | **3. Stability Threshold**       | Small real-world deviations don’t invalidate predictions.              | Minor changes in reality would collapse prediction accuracy.          |  

  *Decision per Assumption:*  
  - **✅ Continue** if *all tests* indicate Instrumentally False.  
  - **🛑 Mandatory Hand-Off** if *any test* indicates Representationally False.  
  - **❌ Stop (Reject)** if assumption fails classification after 10 minutes.  

  ### **Step 4: Decision Integration**  
  *Question:* Do all Representationally False assumptions (from Step 3) align with the policy’s core objectives? (e.g., Does ignoring multigenerational households conflict with "equitable housing" goals?)  
  *Sufficient Answer:* Written justification from the consultant or planning policy documents.  
  *Decision:*  
  - **✅ Continue** if no Representationally False assumptions exist.  
  - **🛑 Mandatory Hand-Off** to Planning Director/Board if Representationally False assumptions exist (requires values-based ruling).  
  - **❌ Stop (Reject)** if justification is absent or contradictory.  

  ---

  ### **Application to Case Studies**  

  #### **Case 1: Stormwater Model (Uniform Drainage Rates)**  
  - *Step 1:* ✅ Continue (county-wide errors within margins).  
  - *Step 2:* ✅ "Uniform soil permeability" identified.  
  - *Step 3:* **Representationally False** (fails *Mechanism Skew*: Misses flash floods due to distorted drainage causality; fails *Stability Threshold*: Local deviations collapse accuracy).  
  - *Step 4:* 🛑 Mandatory Hand-Off (Policy must reconcile flood-risk equity).  

  #### **Case 2: Housing-Demand Forecast (Single Income-Maximizer)**  
  - *Step 1:* ✅ Continue (aggregate rent trends accurate).  
  - *Step 2:* ✅ "All households rational income-maximizers" identified.  
  - *Step 3:* **Representationally False** (fails *Masking Effect*: Erases multigenerational families/sublets; fails *Stability Threshold*: Cultural/demographic shifts invalidate model).  
  - *Step 4:* 🛑 Mandatory Hand-Off (Values judgment: Does "equitable housing" include non-traditional households?).  

  #### **Case 3: Heat-Mitigation Plan (No Tree Canopy Loss)**  
  - *Step 1:* ✅ Continue (temperature projections within margins).  
  - *Step 2:* ✅ "No major loss of tree canopy" identified.  
  - *Step 3:* **Representationally False** (fails *Stability Threshold*: Pest/drought risks make canopy loss likely, invalidating projections; fails *Masking Effect*: Hides vulnerable areas dependent on canopy).  
  - *Step 4:* 🛑 Mandatory Hand-Off (Despite accurate aggregates and reviewer preference, the assumption’s fragility requires leadership to rule on risk tolerance).  

  ---

  ### **Inherent Limitations of This Procedure**  
  1. **Unverified Validation Data:** Cannot detect if consultants cherry-picked or manipulated historical data used for back-testing.  
  2. **Model Comparison Impasse:** Provides no method to choose between two models with equivalent predictive accuracy but conflicting assumptions.  

  ---

  This procedure standardizes Friedman’s principle into auditable steps, enforces scrutiny of *how* assumptions misrepresent reality, and prioritizes policy integrity over predictive convenience within operational constraints.
