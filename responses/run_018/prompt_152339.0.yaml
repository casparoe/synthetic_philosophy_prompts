  The user's explicit request is for a formal checklist with decision nodes, but their deeper need seems to be about institutionalizing critical thinking without requiring advanced expertise. They're likely overwhelmed by technically complex models and want to protect their team from flawed recommendations while maintaining feasible review timelines. The mention of the "personally want to approve" scenario in the heat-mitigation case suggests they also need a mechanism to counter confirmation bias.

