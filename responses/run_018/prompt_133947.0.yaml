answer: |-
  The hybrid variant you propose, with \(N\) symmetric agents making a binary entry decision (probability \(p\)) and, if entering, choosing a continuous intensity \(s > 0\), combined with a payout diluted by the square root of total intensity, yields a well-defined symmetric superrational equilibrium. The key to this determinacy lies in the concavity of the dilution function and the presence of a cost per unit intensity, which together stabilize the continuous dimension and eliminate the risk of collapse or divergence. Below, I break down the analysis step by step, addressing your core questions about the structural boundaries of superrationality.

  ### Model Specification
  - **Agents**: \(N\) symmetric, non-communicating agents.
  - **Decisions**: 
    - **Binary entry**: Enter with probability \(p\), or abstain.
    - **Continuous intensity**: If entering, choose \(s > 0\) at a cost \(c \cdot s\) (where \(c > 0\) is the marginal cost per unit intensity). This cost is essential; without it, intensity would be indeterminate.
  - **Payout**: Fixed prize pool \(P\). One entrant is selected uniformly at random, and the winner receives \(P / \sqrt{S}\), where \(S = \sum_{i \in \mathcal{E}} s_i\) is the total intensity of all entrants \(\mathcal{E}\).
  - **Superrationality**: Agents share common knowledge of rationality and symmetry. Each assumes all others use the same strategy \((p, s)\).

  ### Equilibrium Derivation
  The superrational equilibrium requires two conditions:
  1. **Indifference in entry**: Expected payoff from entering (with optimal \(s\)) equals the payoff from abstaining (0).
  2. **Optimal intensity**: Given entry, \(s\) maximizes the agent's expected payoff.

  #### Step 1: Expected Payoff for an Entrant
  An agent who enters with intensity \(s_i\) faces a random number of other entrants. Let \(K\) be the number of other agents who enter, distributed as \(\text{Binomial}(N-1, p)\). The total intensity from others is \(S_{-i} = s \cdot K\) (since all use the same \(s\)). Total intensity is \(S = s_i + S_{-i}\).

  The agent's expected payoff if they win is \(P / \sqrt{S}\), and they win with probability \(1/(K + 1)\) (since the winner is chosen uniformly among entrants). Thus, the expected gross payoff is:
  \[
  \mathbb{E}\left[\frac{1}{K + 1} \cdot \frac{P}{\sqrt{s_i + s \cdot K}}\right].
  \]
  Subtracting the cost \(c \cdot s_i\), the net expected payoff is:
  \[
  u(s_i) = P \cdot \mathbb{E}\left[\frac{1}{(K + 1) \sqrt{s_i + s \cdot K}}\right] - c \cdot s_i.
  \]

  #### Step 2: Optimal Intensity \(s^*\)
  In symmetric equilibrium, all agents choose the same \(s_i = s\). The expectation simplifies to:
  \[
  u(s) = P \cdot A / s^{1/2} - c \cdot s, \quad \text{where} \quad A = \mathbb{E}\left[(K + 1)^{-3/2}\right].
  \]
  Here, \(A\) depends only on \(p\) and \(N\) (not on \(s\)), as \(K \sim \text{Binomial}(N-1, p)\).

  Maximizing \(u(s)\) with respect to \(s\):
  - First-order condition: \(\frac{d u}{d s} = -\frac{1}{2} P A s^{-3/2} - c = 0\).
  - Solving yields:
    \[
    s^* = \left(\frac{P A}{2 c}\right)^{2/3}.
    \]
  - Second-order condition confirms this is a maximum (strict concavity).

  The optimal intensity \(s^*\) is always positive and finite for \(P, c > 0\) and \(A > 0\).

  #### Step 3: Entry Probability \(p\)
  The expected payoff from entering with \(s^*\) is:
  \[
  u_{\text{enter}} = (P A)^{2/3} \cdot (c)^{1/3} \cdot 2^{-2/3}.
  \]
  This expression is **strictly positive** for all \(p \in [0, 1]\) because \(P, c, A > 0\). Since abstaining yields 0, the agent always prefers to enter. Thus, indifference is impossible, and the only equilibrium has:
  \[
  p = 1.
  \]

  #### Step 4: Equilibrium Values
  - **Entry**: \(p = 1\) (all agents enter with certainty).
  - **Intensity**: With \(p = 1\), \(K = N-1\) almost surely, so \(A = (N)^{-3/2}\). Thus:
    \[
    s^* = \left(\frac{P}{2 c N^{3/2}}\right)^{2/3} = \frac{(P/(2c))^{2/3}}{N}.
    \]
  - **Payoff**: Positive for all agents, confirming no incentive to deviate.

  ### Why This Resolves Instability
  - **Concave Dilution as Stabilizer**: The \(\sqrt{S}\) dilution (i.e., payout \(\propto S^{-1/2}\)) makes the marginal cost of intensity dominate at high \(s\), preventing runaway. This contrasts with linear dilution (e.g., payout \(\propto S^{-1}\) in the Luring Lottery), where feedback can lead to collapse or divergence.
  - **Cost per Unit Intensity**: The cost \(c \cdot s\) ensures the intensity choice has a well-defined optimum. Without it, intensity would be arbitrary.
  - **No Conflict Between Discrete and Continuous**: Here, the entry decision is trivial (\(p=1\)) due to strictly positive payoffs, reducing the problem to a pure continuous optimization. The continuous dimension does not introduce indeterminacy because:
    1. Concavity ensures a unique \(s^*\).
    2. Superrational symmetry pins down \(s^*\) as a function of exogenous parameters.

  ### Conceptual Boundary of Superrationality
  Your core query concerns why superrationality delivers a determinate solution here but struggles in other settings (e.g., Platonia's discrete symmetry-breaking vs. Luring Lottery's instability). The key is not dimensionality per se, but **whether the game's structure provides a self-limiting feedback loop**:
  - **Discrete Symmetry-Breaking (Platonia)**: The "winner-takes-all-if-unique" payoff induces a negative externality of entry, stabilized by probabilistic mixing (\(p = 1/N\)).
  - **Continuous Self-Limiting (Hybrid)**: Concave dilution + convex cost (here, linear cost) create an interior optimum for intensity. Superrationality leverages symmetry to solve for this optimum.
  - **Failure Cases**: 
    - Luring Lottery (linear dilution) lacks self-limitation; best responses may diverge or collapse without bounds.
    - If dilution were convex (e.g., \(S^2\)) or cost absent, the hybrid could become unstable.

  Superrationality is **not inherently ill-defined** for mixed discrete-continuous strategies. It fails only when:
  1. The continuous strategy lacks a feedback mechanism to bound choices (e.g., linear dilution with cost).
  2. The discrete choice lacks a symmetry-breaking incentive (e.g., if payoffs don't penalize overcrowding).

  In your hybrid, concave dilution provides the necessary feedback, making superrationality applicable and determinate. This suggests the concept is robust in games with:
  - **Strictly convex costs or concave benefits**: These naturally bound continuous choices.
  - **Dominant discrete choices**: Here, entry is always preferable, simplifying the equilibrium.

  ### Conclusion
  For your hybrid variant:
  - **Unique symmetric equilibrium exists**: \(p = 1\), \(s^* = \frac{(P/(2c))^{2/3}}{N}\).
  - **No collapse/divergence**: Concave dilution and cost stabilize intensity.
  - **Superrationality remains valid**: The determinacy arises from the game's structure, not limitations of the concept. The solution is a "clean" point equilibrium because:
    - The binary entry decision is resolved dominantly (\(p=1\)).
    - The continuous intensity has a unique optimum (\(s^*\)) due to self-limiting feedback.

  This shows superrationality can handle mixed discrete-continuous strategies when payoffs include concave or convex elements that bound choices. Instability in the Luring Lottery stems from linear dilution, not continuity itself. Thus, the conceptual boundary is defined by the **presence or absence of a self-limiting mechanism**, not dimensionality. Superrationality is a powerful tool for symmetric, non-communicating populations, but it requires games where joint rationality can converge to a fixed point through inherent feedback.
