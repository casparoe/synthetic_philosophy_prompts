  As a retired physicist who has recently turned to philosophy of mind and ethics, I have been pondering whether moral status is genuinely continuous. If we treat sentience as a scalar quantity—like temperature—we seem compelled to assign some infinitesimal weight to a thermostat, yet if we treat it as discrete we face sharp boundary problems with insects and cephalopods. Among the open conceptual questions—whether gradation should be modelled as a vector of independent capacities rather than a single scale, whether there is a non-arbitrary “zero point” analogous to absolute zero, and how welfare should be aggregated across entities with different dimensional profiles—which do you regard as most worth resolving first? I want a defended prioritisation: which are upstream of practical ethics in agriculture or artificial intelligence policy, which are tractable without further empirical discovery, and which, if settled, would actually alter how we distribute moral concern rather than merely redescribe our intuitions? Please reply in British English, and do not offer a bibliography or reading list; I seek reasoning, not references.
