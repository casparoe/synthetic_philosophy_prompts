answer: |-
  Based on your friend's verdicts, here's the breakdown of her apparent rule, an alternative rule fitting her verdicts, predictions for your new scenarios, and the best splitter:

  **Your Friend's Apparent Rule (Form Continuity with Matter Tolerance):**
  *   **Rule:** A ship is the "same" ship if its **essential form and function persist continuously over time**, even if its matter is replaced, **as long as the change is gradual or the core identity is intentionally preserved through the process**. A complete, abrupt disassembly and reassembly elsewhere breaks the continuity of form. A perfect copy, lacking any physical or historical connection to the original process, is always distinct.
  *   **"Form" here means:** The persistent, functional structure and identity as "Theseus's ship" as it exists through time.
  *   **"Matter Tolerance" means:** Gradual replacement is fine (Verdict 1), significant salvaging and rebuilding *in the same context* is fine (Verdict 3 - the "core identity" is preserved by intent and location).
  *   **Why it fits:**
      *   *Gradual Replacement:* Form persists continuously (✔️).
      *   *Rebuild Elsewhere:* Form is completely disassembled and only *reconstituted* later. Continuity is broken (✖️).
      *   *Salvage 90% & Rebuild:* Form is disrupted (sinking) but the *intent* and effort are to *restore the original* using its core matter *in its place*. The core identity persists (✔️).
      *   *Atomic Copy:* Form is perfectly replicated, but there is zero physical or historical continuity with the original process. It's a distinct instance (✖️).
  *   **Her "Form vs Matter":** She *is* prioritizing "form" (persistent identity/function/structure) over "matter" (specific atoms/planks). However, matter *can* play a supporting role in establishing continuity (like the 90% salvage case). Disrupting the form entirely (complete disassembly or destruction) breaks identity unless there's an intentional act of restoration.

  **An Alternative Rule Fitting Her Verdicts (Causal-Historical Continuity):**
  *   **Rule:** A ship is the "same" ship if there is an **unbroken chain of causal-historical connection** back to the original ship, maintaining its functional identity throughout. This chain can tolerate gradual part replacement or even significant damage/repair, but cannot tolerate complete disassembly without immediate reassembly *in sequence* or the creation of a replica lacking that causal history.
  *   **Why it fits equally well:**
      *   *Gradual Replacement:* Each new plank is added *to the existing, functioning ship*, maintaining the causal chain (✔️).
      *   *Rebuild Elsewhere:* The complete disassembly breaks the causal chain. The reassembly is a *new* causal event starting from a pile of planks (✖️).
      *   *Salvage 90% & Rebuild:* The sinking breaks the chain, but the salvaging and rebuilding is a direct causal continuation *of the effort to save and restore that specific ship*. The chain, while disrupted, is reconnected to the original history (✔️).
      *   *Atomic Copy:* The copy has a completely separate causal origin. Its history starts *de novo* with the scan/print process, unconnected to the original ship's history (✖️).

  **Predictions for Your Scenarios (Based on Her Apparent "Form Continuity" Rule):**

  1.  **a) Sudden Synthetic Swap in Drydock:**
      *   **Prediction:** NOT the original ship.
      *   **Reason:** The abrupt, complete replacement destroys the *continuous persistence* of the ship's form. Even if the new planks look identical and log history, the original structure ceased to exist entirely in a single moment. It's functionally equivalent to destroying it and building a new, sensor-equipped one in the same spot. Breaks form continuity.

  2.  **b) Mulch -> Trees -> Re-Carving:**
      *   **Prediction:** NOT the original ship.
      *   **Reason:** The form is utterly destroyed (mulched). The matter is radically repurposed into something with a completely different form and function (trees). The subsequent carving creates a *new* ship *from* the wood of the old trees, not *from* the original ship. There is zero continuity of form or function through the process. It's a new ship made from the same *base matter* (now highly processed).

  3.  **c) Quantum-Entangled Duplicate:**
      *   **Prediction:** NOT the original ship (and likely emphatically so).
      *   **Reason:** While the atoms are entangled, the *form* (the ship structure) is instantiated *separately* and *concurrently* with the original. It's a distinct physical object with its own location and existence, lacking the continuous historical persistence of the original ship's form. Entanglement is a physical state link, not a persistence of form or identity. It's analogous to the atomic copy scenario (which she rejected) but with a fancy physics link she'd likely dismiss as irrelevant to identity.

  **Which Scenario Best Splits the Two Rules?**

  *   **Verdict 3 (90% Salvage/Rebuild)** is the key.
  *   **c) Quantum-Entangled Duplicate** is the best splitter between her apparent rule and the alternative Causal-Historical rule.
      *   **Under her "Form Continuity" Rule:** The duplicate exists separately, concurrently. Its form wasn't *persisted* from the original; it was *instantiated anew*. Therefore, it's distinct (✖️). (This is the prediction above).
      *   **Under the "Causal-Historical" Rule:** This is trickier. If the entanglement/scanning process is seen as creating a *branch* or *extension* of the original ship's causal history (e.g., the duplicate's existence is *caused* by the scanning of the original), someone *could* argue it has a causal connection. However, given her firm rejection of the atomic copy (which also has a causal link *from* the original via scanning), she would almost certainly reject this too, making the split less dramatic. The salvage verdict leans towards valuing the *intent to restore the original object*, which is absent in duplication.
  *   **a) Sudden Synthetic Swap** is a strong second splitter:
      *   **Form Continuity Rule:** Abrupt swap breaks continuity (✖️).
      *   **Causal-Historical Rule:** The *process* of swapping planks in drydock could be seen as maintaining the causal chain *of the ship undergoing maintenance*, even if sudden. Someone *might* argue it's still the same ship under this rule. Her rejection of reassembly elsewhere suggests she values the *ongoing identity throughout the process*, which the sudden swap disrupts, aligning more with Form Continuity.
  *   **b) Mulch -> Trees -> Carving** is clearly rejected by both rules.

  **Conclusion:** Your friend's core principle is **the continuous persistence of the ship's functional form and identity over time.** Matter is secondary *unless* its use directly supports the restoration of that original identity *in situ* after disruption (like the salvage case). Any process that completely and abruptly destroys the form (sudden swap, mulching) or creates a separate concurrent instance (copy, duplicate) breaks identity. **Scenario (c) Quantum Entanglement** best highlights the emphasis on continuous form persistence vs. alternative interpretations like causal history, as she would firmly reject the duplicate regardless of the fancy physics link.
