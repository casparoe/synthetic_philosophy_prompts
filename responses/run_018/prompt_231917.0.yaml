  - Fodor’s "historical fact" was interpreted as mere causal history (unlikely, given "evolutionary priority"). 
  Competent graders might debate whether Fodor’s nomological dependence implicitly relies on history (consensus says no), or whether Millikan’s reinforcement example sufficiently covers her view (yes, if developmental). 

