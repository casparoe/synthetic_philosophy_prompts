answer: |-
  Your intuitions are sharp, and the tension you feel reveals the core conceptual challenge in distinguishing genuine gauge redundancy from mere mathematical artifact. The unifying principle is **dynamical locality and necessity**: a symmetry represents physical redundancy *only* if it is mandated by the **dynamics and locality constraints** of the theory. Here's how this resolves your cases:

  ---

  ### **Core Principle: Dynamical Necessity**
  - **Genuine gauge redundancy** arises when the dynamics (equations of motion) *require* that distinct mathematical states describe the same physical reality. This is enforced by the theory’s local degrees of freedom and the way boundary data propagate.
  - **Accidental symmetry** is a mathematical coincidence without dynamical necessity—it may commute with observables but isn’t fundamental to the theory’s structure.

  ---

  ### **Reassessment of Your Cases**
  1. **Classic GR (Hole Argument)**  
     - **Verdict: Same physical state.**  
     - *Why?* Diffeomorphism invariance is **dynamically necessary**: Einstein’s equations are *designed* to be covariant. The redundancy is fundamental to how GR encodes gravity via spacetime geometry. Fixing it (e.g., gauge-fixing) breaks manifest covariance without adding physical content.

  2. **Lattice Spacetime**  
     - **Verdict: Same physical state.**  
     - *Why?* The automorphism preserves all **dynamically enforced relations** (e.g., adjacency, causal links). Even without smooth structure, the lattice’s dynamics (e.g., Regge calculus) treat such transformations as redundant. Observables are relational (e.g., boundary correlations), not pointwise.

  3. **Hidden-Sector Unitary**  
     - **Verdict: *Physically distinct* state.**  
     - *Why?* The unitary isn’t mandated by dynamics—it’s an **accidental symmetry**. If the hidden sector has local degrees of freedom unrelated to spacetime geometry, commuting with exterior observables is insufficient. Dynamics may allow distinct initial conditions in the hidden sector (e.g., dark matter configurations), making this a physical difference, not redundancy.

  4. **Theory Comparison**  
     - **Verdict: Redundant formulation (GR) is fundamental.**  
     - *Why?* In GR, redundancy isn’t "added"—it **reduces physical degrees of freedom** by encoding gravity as spacetime curvature. A "simpler" gauge-fixed theory would need non-local constraints to match GR’s predictions, violating locality. Redundancy here is a feature, not a bug.

  5. **Horizon Version**  
     - **Verdict: Same physical state.**  
     - *Why?* The event horizon is irrelevant. Dynamical necessity (diffeomorphism invariance) holds globally. Observers outside can’t access interior data, but the **identity of states** is determined by the theory’s dynamics, not measurability.

  ---

  ### **The Coherent Principle: Dynamical Locality**
  - **Rule:** A transformation is physical redundancy iff:  
    (a) It preserves all *physical observables* (commutes with boundary data),  
    (b) The theory’s **dynamics cannot distinguish** the transformed states (equations of motion enforce equivalence),  
    (c) The symmetry arises from **local degrees of freedom** with no preferred labeling.  
  - *Key insight:* Genuine gauge symmetries are those where "fixing" the redundancy would require adding unphysical constraints or breaking locality.

  ---

  ### **Where Your Verdicts Change**
  - **Case 3 (Hidden-Sector Unitary) must be dropped.**  
    Without dynamical necessity, commuting with observables is not enough. If the hidden sector’s unitary isn’t part of a spacetime symmetry (e.g., not tied to diffeomorphisms), it likely represents physical degrees of freedom. Example: Applying a unitary to dark matter fields inside a region—this could alter future observables if the sector couples dynamically elsewhere.  
    - *Exception:* If the hidden sector is a **topological field theory** (dynamics enforce gauge invariance), then it’s redundancy.

  ---

  ### **Unmentioned Cases Resolved**
  - **QED with Coulomb gauge vs. Lorentz covariant formulation:**  
    Coulomb gauge fixes redundancy (same physical predictions), but breaks manifest locality. Redundancy in the covariant formulation simplifies dynamics—this is *dynamically necessary* for consistency with special relativity.  
  - **String Theory T-duality:**  
    Physically equivalent states (redundancy) because dynamics (string interactions) cannot distinguish large/small radii—this is mandated by the theory.  
  - **Emergent gauge symmetries (e.g., in spin liquids):**  
    Only redundant if the low-energy dynamics enforce it (e.g., via topological order). Otherwise, it’s an approximation.

  ---

  ### **Conclusion**
  - **Keep:** Cases 1, 2, 4, 5. They satisfy dynamical necessity.  
  - **Drop:** Case 3 unless the hidden sector’s dynamics enforce the symmetry.  
  - **Why GR is special:** Its redundancy is inseparable from its dynamical formulation—"fixing" it would destroy the geometric nature of gravity. Simplicity here lies in *fewer physical degrees of freedom*, not fewer mathematical fields.  

  This framework rescues your core intuition: redundancy is physical when the dynamics demand it, not when it’s formally convenient. It’s why we tolerate GR’s "bloat" but reject it in ad hoc hidden sectors.
