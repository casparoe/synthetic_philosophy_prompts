prompt: |-
  Hey, I'm putting together a feature on moral psychology and I keep circling back to Bernard Williams's integrity objection—basically the worry that if you save your spouse from a burning building because you ran a quick utilitarian calculus, you've had one thought too many. I was chatting with a philospher friend over coffee and she said that if we're going to take that seriously, we need the full spec first: what does any adequate theory of moral motivation actually have to deliver?

  So write me the desiderata list. What cases must it get right—the intimate rescue versus the impartial duty, the soldier acting from role-commitment, maybe even the activist who burns out because her personal projects got swallowed by universal demands? Which distinctions can't it collapse, like between being motivated by love and being motivated by a principle that happens to license love, or between personal integrity and institutional integrity—say, a journalist protecting a source not because she calculated harm but because the role itself demands it? I want you to flag which requirements look genuinely non-negotiable and which ones are just preferences of particular camps, and especially flag any pair that might be jointly unsatisfiable—maybe full universality and full integrity really can't coexist. Then briefly score utilitarianism, virtue ethics, and care ethics against your list, but keep it short; the criteria are what I'm after.

  Please also separate what's settled in the literature from what's still fought over—don't present one side's take as the consensus. And no bibliographies or citation lists, since I don't need guesses at page numbers. I'm on a tight deadlne and my editor wants this by thursdy, so apologies if there's a typo or two in here.
