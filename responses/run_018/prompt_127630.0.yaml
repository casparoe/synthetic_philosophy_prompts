answer: |-
  Here’s a distilled desiderata list for an adequate theory of moral motivation, grounded in Williams’ integrity objection and related concerns. I’ll flag settled points, contested demands, and tensions, then briefly score key theories.

  ---

  ### **Core Cases Any Theory Must Handle**
  1. **Intimate Rescue**: Saving a loved one *because they are your loved one* (not after calculating net utility).  
  2. **Role-Based Action**: A soldier charging into danger *because of duty to comrades/role*, not consequence-maximization.  
  3. **Institutional Integrity**: A journalist protecting a source *because the role demands confidentiality*, not harm-benefit analysis.  
  4. **Activist Burnout**: When universal moral demands (e.g., constant altruism) eclipse *sustaining personal projects*, eroding identity.  

  ---

  ### **Distinctions That Must Not Collapse**
  | **Distinction**                  | **Non-Negotiable?** | **Contested?** |
  |----------------------------------|---------------------|----------------|
  | Motivation by love vs. motivation by a principle *permitting* love | Yes (central to Williams) | Minimal debate—most agree collapsing this misdescribes agency |
  | Personal integrity (projects defining *who I am*) vs. moral obligation | Yes | Some Kantians argue integrity *is* subsumed under duty |
  | Role-motivated action (e.g., parental care) vs. generalized duty | Yes | Communitarians vs. universalists |
  | Acting from conviction vs. acting from external sanction | Likely yes | Internalism/externalism debates |

  ---

  ### **Desiderata for Moral Motivation**
  1. **Psychological Plausibility**: Must reflect how humans *actually* experience motivation (e.g., love feels different to rule-following).  
     *—Settled: Ignoring this is fatal. Contested: How much "revision" is acceptable?*  
  2. **Accommodates Integrity**: Cannot reduce deeply personal commitments to interchangeable moral inputs.  
     *—Non-negotiable post-Williams; theories must engage this.*  
  3. **Partiality/Impartiality Balance**: Must explain when intimate bonds *appropriately* override impartial demands (e.g., saving spouse > stranger).  
     *—Settled: Purely impartial theories fail. Contested: Where to draw the line.*  
  4. **Role Obligations as Distinct**: Motivation flowing from social roles (parent, soldier) shouldn’t be reduced to universal principles.  
     *—Non-Kantians treat this as essential.*  
  5. **Non-Alienation**: Moral reasons shouldn’t require divorcing action from core identity (Williams’ key worry).  
     *—Widely accepted; theories are judged on their "alienating" potential.*  

  ---

  ### **Tensions (Potentially Jointly Unsatisfiable)**
  - **Universality vs. Integrity**: If morality demands fully universalizable reasons (*all* agents must share them), personal projects become contingent, not essential. **Likely irreconcilable** in strong forms.  
  - **Impartiality vs. Motivation**: Strong impartiality (e.g., utilitarianism) struggles to explain motivation for role-bound or intimate acts without "one thought too many."  
  - **Affective vs. Rational Sources**: Can a theory prioritize emotional attachments (love, loyalty) *and* satisfy rationalist demands for principle-governed action?  

  ---

  ### **Theories Scored Briefly**
  | **Theory**       | **Intimate Rescue** | **Role Action** | **Activist Burnout** | **Key Weakness**                     |
  |------------------|---------------------|-----------------|-----------------------|--------------------------------------|
  | **Utilitarianism** | Fails ("thought too many"; alienates personal motives) | Poor (reduces role to outcomes) | Severe risk (personal projects lack intrinsic weight) | Collapses integrity into utility |
  | **Virtue Ethics**  | Strong (motivation from character/relationship) | Strong (role as expression of virtue) | Moderate (virtues buffer but universal demands ambiguous) | Unclear on resolving impartial/partial conflicts |
  | **Care Ethics**    | Strong (centrality of relational motivation) | Moderate (roles as care contexts) | Moderate (prioritizes proximity; burnout risk in scaling) | Struggles with impartial duties (e.g., global justice) |

  ---

  ### **Settled vs. Contested in Literature**
  - **Settled**:  
    - Williams’ critique exposed a *serious flaw* in impartial moral theories.  
    - Adequate theories *must* account for the phenomenology of motivation (not just justificatory reasons).  
    - Personal projects and relationships *generate non-fungible reasons*.  
  - **Still Contested**:  
    - **Can universality be softened?** (e.g., "contextual universalism")  
    - **Is alienation always bad?** (Kantians: Moral maturity *requires* distancing from inclinations)  
    - **Hybrid theories**: Can role-motivation be systematized without losing its particularity? (Ongoing debate)  
    - **Scope of integrity**: Are all "ground projects" morally equivalent, or can some be illegitimate?  

  ---

  **Key Takeaway**: The non-negotiables are **phenomenological accuracy** and **non-alienation of identity**, forcing theories to bend to Williams’ cases. Universality vs. integrity remains the deepest fault line—no theory has fully reconciled them without compromising one. Your editor’s Thursday deadline is safe; this cuts to the core.
