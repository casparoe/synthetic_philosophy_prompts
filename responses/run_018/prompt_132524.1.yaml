    "scenario_text": "Two lab directors (one a rational egoist, one a Kantian) can use an 'anonymity ring' to invisibly steal rival research data, securing tenure. Using it for acts they'd avoid visibly triggers 'preference compartmentalization'—siloing those desires away from their core identity and long-term planning. The egoist must decide whether to break a promise and steal.",
    "egoist_verdict": "Don't steal. Compartmentalization fragments the self, undermining lifetime preference satisfaction more than the theft benefits it.",
    "kantian_verdict": "Steal. Universalizing 'steal when undetectable' causes no logical contradiction; detectability is contingent, not part of the maxim's moral essence.",
    "work_feature": "Preference compartmentalization imposing long-term identity costs on the egoist while negating social consequences for Kantian universalization.",
    "defender_rebuttal": "The Kantian misformulated the maxim. Correctly universalized ('I will steal to advance my interests') fails due to conceptual incoherence of property/interests in a lawless world.",
    "removal_test": "Without compartmentalization, egoist steals (no hidden cost) and Kantian forbids (universal theft without detection collapses trust)."
  }
  ```
