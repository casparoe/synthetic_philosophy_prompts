answer: |-
  Right then, let's get you prepped. Pint glass thinking first:

  **Audience Dynamics:**
  *   **Liberals (Locke/Rawls Focused):** Instinctively allergic to "medieval metaphysics", see rights as individual & negative, wary of teleology/"common good" talk. Expect them to pounce on any whiff of natural law imposing duties. Might dismiss Aquinas as pre-modern curiosity. Key trigger: "Catholic natural law infecting secular discourse."
  *   **Thomists (Latin Scholars):** Deep textual knowledge, finely attuned to nuance, wary of anachronism or "conciliarist fanfiction". Will demand precise textual citations and worry about harmonising Aquinas's *own* works. Key trigger: "Projecting later ideas backwards."
  *   **Constitutional Lawyer (US Founders Fan):** Thinks in terms of institutional mechanisms, separation of powers, "who pulls the trigger?". Sees Locke/Revolution as the gold standard. Key trigger: "Why isn't this just Locke?"
  *   **Unspoken Tension:** Liberals & Lawyer likely see Thomists as niche; Thomists see Liberals as shallow. You're the bridge... or the punching bag.

  **Prep Sheet: Core Argument Refresher**
  Your core: Aquinas isn't just saying "don't kill the king, peasants". He establishes a *constitutional logic*:
  1.  **De Regno/Summa (Sedition):** Private tyrannicide = sedition (disorderly, undermines *all* authority).
  2.  **Sentences Commentary (IV Dist. 24, Q.3, A.2):** Authority isn't *owned* by the ruler ("non habet potestatem ut propriam"), it's *delegated* ("a communitate") for the common good. Possession vs. Delegation is KEY.
  3.  **Conciliarist Parallel:** Authority delegated *to* the Pope *by* the Church (via Cardinals/Council) implies a structural check *within the system*. Aquinas's logic points the same way for temporal power.
  4.  **The Synthesis:** The restriction on *private* action isn't conservatism; it's reserving legitimate resistance to the *intermediate authorities* (nobles, magistrates, estates, councils) who hold delegated authority *structurally*. It's collective, constitutional resistance, not individual revolt. Closer to a Parliament deposing a king than Locke's man in the state of nature.

  **Objection Response Plan:**

  1.  **Liberal Objection: "You're smuggling Thomist natural law/Catholic theology into secular liberal resistance theory. Aquinas's 'common good' is thick metaphysics – we deal in individual rights and state neutrality."**
      *   **Concede Up Front:** "Absolutely, Aquinas's framework *is* teleological and grounded in a specific metaphysics of natural law and the common good derived from divine order. It's not Rawlsian neutrality."
      *   **Hard-Hitting Reply:** "But the *structural mechanism* I'm highlighting – delegated authority requiring accountability, with resistance reserved to constituted bodies acting *for* the collective – isn't dependent on accepting his metaphysics wholesale. Isn't the core *practical* concern here identical to modern constitutionalism: preventing tyranny *without* collapsing into anarchy? Aquinas offers a model where resistance is *institutional*, not anarchic, precisely to *protect* ordered liberty – a goal liberals share, even if the foundation differs. Dismissing the mechanism because of its theological roots risks throwing out a key historical solution to the very problem liberalism faces."
      *   **Weakest Point in Reply:** The "common good" Aquinas envisions *is* thicker and potentially more prescriptive than a liberal "overlapping consensus" or purely procedural fairness. They *will* argue the mechanism can't be divorced from the substantive end it serves in his system. You might need to concede the *motivation* differs while insisting the *structural safeguard* has analytical value.

  2.  **Thomist Objection: "You're over-reading the Sentences commentary and projecting 15th-century conciliarism back onto Aquinas. The Summa sedition discussion is the mature view; the Sentences is early, tentative, and doesn't explicitly authorise resistance by intermediates. Aquinas never spells out this 'constitutional' resistance you imply."**
      *   **Concede Up Front:** "You're right that Aquinas doesn't provide a neat, step-by-step manual for constitutional deposition in the Summa. The Sentences commentary *is* earlier, and conciliarism proper is a later development. There's textual ambiguity."
      *   **Hard-Hitting Reply:** "But the *principle* in the Sentences is crucial and never retracted: authority is *delegated*, not possessed. If authority is delegated *for the common good* (a constant theme), and the ruler destroys that good, doesn't the logic *inherently* flow back to the delegating community? And who *is* that 'community' in a complex medieval polity? It's *embodied* in its leading parts, the *maior et sanior pars*, the nobles, the estates – the 'intermediate powers'. The conciliarists didn't invent this; they applied Aquinas's core logic about delegated power *to their context*. The restriction on *private* action in the Summa *presupposes* a legitimate *public* avenue – otherwise, Aquinas leaves tyranny utterly unchecked, which contradicts his whole framework. The structure is implicit in the principles."
      *   **Weakest Point in Reply:** The leap from "authority is delegated" to "therefore, intermediate bodies X, Y, Z have a *right* to *actively resist/depose*" requires interpretive work Aquinas himself didn't explicitly do. The Thomists can hammer the lack of a clear *locus classicus* where Aquinas says "the barons may remove the king".

  3.  **Lawyer's Objection: "This sounds like Locke's right of revolution dressed up in medieval fancy dress. The people delegate power to government; if it's tyrannical, they can revolt. What's the difference? Just extra ecclesial steps?"**
      *   **Concede Up Front:** "Superficially, yes, there's a similarity: delegation, tyranny, right to act. Locke certainly drew on medieval resistance ideas, filtered through later thinkers."
      *   **Hard-Hitting Reply:** "The crucial difference is *agency* and *structure*. Locke's 'people' is an amorphous collective dissolving back into the state of nature to act. It's revolutionary, extra-constitutional, and inherently destabilising. Aquinas's model, as I read it, is *constitutional* and *conservative* (small 'c'). Resistance isn't the atomised populace, but the *existing intermediate authorities* acting *within* (or to restore) the political structure itself – like barons invoking Magna Carta, or a Council acting. It's not revolution creating something new from scratch; it's the *system's own check* being activated to correct a malfunction *within* the constitutional order. It aims to *preserve* the structure of legitimate authority, not obliterate it. Less 'state of nature', more 'impeachment' or 'vote of no confidence' on a medieval scale."
      *   **Weakest Point in Reply:** The lawyer might retort: "But *who* defines the 'intermediate authorities'? Isn't that just as contested? And doesn't it still boil down to might making right in the end?" You need to emphasise the *prescriptive constitutional structure* Aquinas implies, even if fuzzy, versus Locke's more radical dissolution.

  4.  **The Dreaded Objection (Probably from a keen Liberal or the Lawyer): "Okay, if intermediate authorities hold this delegated power/duty to resist for the common good... in a modern democracy, aren't *citizens themselves* the 'intermediate authority' or the delegating community? Doesn't this imply not just a right, but an active *duty* for citizens to resist unjust laws? Isn't that dangerously radical?"**
      *   **Don't Dodge:** Lean in, but carefully.
      *   **Reply:** "It's a powerful question. Aquinas *was* thinking of concrete, corporate bodies within a hierarchical society – nobles, councils, cities. Translating directly to mass democracy is fraught. However, the *logic* of delegated authority persists: ultimate authority rests with the populace. Modern constitutionalism *institutionalises* this through parliaments, courts, elections – *these* are the designated 'intermediate authorities' in our system. Aquinas's model cautions against *private*, individual resistance (*sedition*) precisely because it's destabilising. The duty, in his terms, would fall primarily to those *institutional* bodies (Congress, Supreme Court, etc.) to act *within their constitutional role* to check tyranny. For citizens, the 'duty' translates more to vigilance, participation, holding *those institutions* accountable through democratic means, and potentially civil disobedience *as a last resort* when *all* institutional checks fail – but crucially, understood as an appeal *to* or *for* the constitutional order, not its overthrow. It's a duty to *maintain* just institutions, not a blanket license for individual revolt."
      *   **Why it's Dreaded:** It forces you into modern application, where Aquinas's categories don't fit neatly. It risks sounding either too radical (duty to revolt) or too conservative (only elites can act).

  **Your Weakest Spot: The Killing Question**
  *   **The Hole:** Aquinas explicitly forbids *private* tyrannicide as seditious. He authorises intermediates to *resist* ("resistere potest" - e.g., Summa II-II Q42 A2). He does **not** explicitly say they can *kill* the tyrant. Sedition is defined as action against *just* authority; resisting the *unjust commands* of a tyrant isn't sedition, but removing/killing the tyrant himself...? Murky.
  *   **How to Defend the Gap:**
      1.  **Principle Over Prescription:** Argue the *authorisation to resist unjust authority* logically *includes* all proportionate means necessary to stop the tyranny, *up to and including* deposition if lesser means fail. The *goal* is removing the threat to the common good. Execution might be one consequence, but the *authority* stems from the right/duty to resist effectively.
      2.  **Structural Removal, Not Assassination:** Emphasise that Aquinas's focus is on *public, constitutional* action by the *community* (via its heads). This isn't murder; it's a legitimate act of authority (like impeachment leading to removal, which could historically include execution). Killing might be a *result* of the resistance process authorised by the community, not the *defining act*. The key is the *source* of the authority to act, not the specific final act.
      3.  **Medieval Context:** Point out that deposition rarely ended with the tyrant retiring peacefully. Aquinas understood the realities of power. His silence on the *method* of removal by intermediates might reflect the practical assumption of the time, not a principled bar against lethal force *when authorised by legitimate resistance*. Forbidding *private* killing protects order; *public* action restores it.
      4.  **Concede the Ambiguity (Briefly):** "You're right, Aquinas doesn't give a clear 'thou shalt kill the tyrant' warrant to intermediates. But he *does* clearly authorise them to *resist* tyranny *publicly*. Given that resisting a determined tyrant often necessitates his removal, and given that Aquinas places *no* explicit limit on the *means* of this public resistance by constituted authorities (only forbidding private action), the logical implication is that lethal force is within their legitimate scope *as a last resort in the process of resistance*. The core point remains the *structural authorisation* to act."

  **Final Thought:** Stay grounded in the *medieval constitutional logic*. Don't let them force you entirely onto modern liberal or Lockean turf. Your power is showing Aquinas as a sophisticated constitutional thinker, not a precursor to Locke or Rawls, but offering a distinct model of structured, collective accountability. Good luck – expect lively combat! Remember to recieve their points graciously before dismantling them.
