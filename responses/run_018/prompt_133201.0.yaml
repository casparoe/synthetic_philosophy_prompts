answer: |-
  Based on your colleague's pattern of judgments, her implicit rule prioritizes **history that serves present life through active political engagement and the shaping of present values.** She rejects practices that are passive, paralyzing, or lack a clear connection to contemporary agency or identity formation.

  **Analysis of the AI Reconstruction Project:**
  1.  **Antiquarian? (Serving Life?):** The project *appears* antiquarian: focused on granular detail, recovery of fragments, and immersive inhabitation without present political aims. Her prior rejection of the "archive with no guiding narrative" suggests she sees undirected preservation as lifeless. While the moral imagination expansion *could* serve life, the explicit *lack* of a present agenda likely aligns it too closely with the condemned immersive reenactment ("drains life") for her. This project risks being passive consumption of the past.
  2.  **Monumental? (Covertly?):** While reconstructing excluded voices *could* shape present identity (a monumental function), the explicit denial of *any* present agenda makes this unlikely for her. Monumental history, for her, is actively *used* to motivate present action (like the civic founding narrative), not presented neutrally.
  3.  **Critical?:** This project *enables* critical history by providing the erased material, but it refuses to *be* critical history itself. Critical history, for her (as seen in approving the demolition of the harmful myth), is actively *used* to dismantle harmful present structures.

  **Closest Analog:** The **"immersive historical reenactment of past suffering"** is the closest analog.
  *   **Shared Features:** Both involve immersive, detailed engagement with the past. Both explicitly lack a present political aim ("no present reformist agenda" / "no present political aim"). Both focus on experiencing the past for its own sake (recovery/emotional intensity).
  *   **Key Difference:** The AI project recovers *excluded* voices, while the reenactment focuses on suffering (potentially paralyzing). This difference *might* make the AI project less objectionable, but its core lack of present instrumental purpose likely aligns it with the condemned reenactment for your colleague. She would likely see it as **rehabilitated antiquarianism *only if* the "expanded moral imagination" demonstrably and directly fueled present agency or identity in a tangible way, which the explicit lack of agenda contradicts.**

  **Predictions Based on Plausible Rules:**
  1.  **Rule: Instrumental Orientation (Must actively shape present action/values):** Predicts **REJECTION.** Like the reenactment and the dead-industry archive, this project lacks a present instrumental goal. Recovering voices is not enough; it must be *for* something present. "Moral imagination" without directed action is insufficient activation of life.
  2.  **Rule: Formal Mode (Passive/Immersive vs. Active/Constructive):** Predicts **REJECTION.** The immersive, inhabiting, granular mode ("letting descendants inhabit") mirrors the condemned reenactment's formal mode, regardless of content (excluded voices vs. suffering). The mode itself is seen as draining life force through passive engagement.

  **The Decisive Follow-Up Case:**
  To distinguish between these rules, propose this scenario:

  *   **The Reparations Deployment Case:** *The exact same AI project recovers the same erased personal narratives and granular details of ancestors' lives. However, instead of presenting it neutrally, the project is explicitly framed and deployed by descendant communities **as primary evidence in a concrete, ongoing political and legal campaign demanding specific reparations policies.** The immersion and detail serve directly to substantiate claims of harm, establish lineage, and motivate collective action.*

  **How this Reveals the Criterion:**
  *   **If her criterion is Instrumental Orientation:** She **APPROVES** this version. The *same historical material* is now explicitly instrumentalized for present political action (reparations). It actively shapes the present struggle and aims for concrete change, aligning with the approved critical demolition of the harmful myth and the monumental civic narrative motivating participation.
  *   **If her criterion is Formal Mode:** She **REJECTS** this version *if* the *presentation* remains immersive/granular/inhabiting. Even with a present aim, the formal mode of "inhabiting" the past might still be seen by her as draining life force, akin to the reenactment. She might demand a different *mode* of engagement (e.g., analytical, argumentative, symbolic) even for instrumental purposes. Approval would depend on whether the "deployment" changes the *mode* of engagement with the recovered material.

  **Conclusion:**
  Based on her prior judgments, your colleague would **most likely REJECT** the described AI reconstruction project as presented (no present agenda). Its closest analog is the condemned immersive reenactment. The **Instrumental Orientation rule** (history must actively shape present action/values) is the strongest predictor of her pattern. The **Reparations Deployment Case** is the crucial test to confirm if it's purely about instrumental use or also about avoiding a specific (passive/immersive) formal mode of historical engagement. Her approval of that follow-up case would strongly confirm Instrumental Orientation as her core criterion.
