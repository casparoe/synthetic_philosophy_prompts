answer: |-
  Your argument brilliantly exposes tensions in evolutionary explanations of cooperation. Let's dissect it step-by-step to find the hidden premise. The critical vulnerability is in **step (4)**, but the deeper flaw connects to **step (7)**'s claim that "no other evolutionary story works." Here's the breakdown:

  ### The Hidden Premise & Weakest Link
  - **Step (4) assumes reciprocal altruism is the *only possible evolutionary explanation* for one-shot cooperation.** This is the core flaw. By asserting people must "implicitly treat interactions as iterated," it prematurely rules out alternative mechanisms. Giving up this premise costs you the clean universality of reciprocal altruism but opens richer explanations.

  ### Why Step (4) Fails
  1. **False Dilemma in Evolutionary Explanations**: Cooperation in anonymous one-shots *doesn't require agents to misjudge repetition*. Instead, humans may deploy evolved heuristics shaped by *ancestral environments* where most interactions *were* repeated. In modern contexts, these heuristics fire "misfiringly" (like a smoke alarm detecting burnt toast). This isn't a *belief error* but an *adaptive heuristic error* in novel environments.  
     - **Cost**: You must accept that evolution optimizes for *average ancestral fitness*, not perfect modern rationality. Cooperation isn't "irrational" but ecologically rational in our evolutionary history.

  2. **Overlooking Alternative Mechanisms**: Step (7) wrongly claims no other evolutionary models exist. Robust alternatives include:  
     - **Cultural Group Selection**: Groups with cooperative norms outcompete others, even if individuals occasionally "defect" in one-shots.  
     - **Reputation via Indirect Reciprocity**: Strangers cooperate because behavior might be observed (even anonymously), affecting future interactions with *third parties*.  
     - **Signaling Theory**: Cooperation signals desirable traits (e.g., resources, trustworthiness) to potential mates/allies.  
     - **Norm Psychology**: Internalized punishment for norm-violation (e.g., guilt) evolves via gene-culture coevolution.

  ### Salvaging Your Preferred Premises
  - **Step (2) holds**: Reciprocal altruism *does* require correct repetition expectations—but it's not the whole story.  
  - **Step (5) holds**: Evolution *does* weed out *fitness-reducing* false beliefs. However:  
    - **Crucial nuance**: If a "false" belief (e.g., "I might be observed") *costs little but occasionally enables large cooperative gains*, selection may preserve it.  
    - **Example**: Tipping a stranger risks minimal loss if unobserved but may trigger reciprocity if you *do* meet again (or boost reputation if witnessed).

  ### Revised Argument Flow
  1. Reciprocal altruism requires correct repetition expectations. ✅  
  2. One-shot cooperation exists. ✅  
  3. → People aren’t *always* using reciprocal altruism.  
  4. → Alternative mechanisms (norms, signaling, group selection) explain one-shot cooperation.  
  5. These alternatives *don’t require false beliefs*:  
     - Norms: Internalized punishment for defection (e.g., shame) is psychologically real.  
     - Signaling: Benefits come from observers, not direct reciprocity.  
  6. Thus, cooperation remains evolutionarily explainable *without* systematic misjudgment.

  ### Philosophical Cost of Abandoning Step (4)
  - **You lose**: The elegance of a single mechanism (reciprocity) explaining *all* cooperation.  
  - **You gain**: A more realistic, pluralistic evolutionary psychology where:  
    - Heuristics can misfire in novel environments,  
    - Multiple adaptive strategies coexist,  
    - Culture and genes coevolve to sustain cooperation.

  ### Why This Saves Rationality
  Cooperation isn’t irrational—it’s often:  
  - **Ecologically rational**: Optimal in small-scale ancestral tribes.  
  - **Strategically rational**: Under signaling or norm-based frameworks.  
  - **Morally rational**: If you value upholding internalized norms.

  **Conclusion**: Step (4) is the weak link. By rejecting its assumption that reciprocity is the *only* game in town, you preserve human rationality, evolutionary explanations, and your preferred premises. The cost? Embracing theoretical pluralism—but this mirrors evolution’s messy, multi-path reality. Sleep well! 🛌
