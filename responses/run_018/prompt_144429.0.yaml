  ### Thought Experiment: Hospital Nurse Shift-Swap Market  
  Nurse Alex works three consecutive days (Mon, Tue, Wed) and must finalize her schedule each morning. The hospital allows shift swaps: nurses can trade shifts if both agree, but swaps are binding once confirmed. Alex’s **preferences over final work schedules** (transitive and stable) are:  
  - **Best (utility 10):** Work Mon + Wed (avoids burnout from consecutive days).  
  - **Medium (utility 8):** Work only Tue (light workload but less pay).  
  - **Worst (utility 0):** Work Mon + Tue (consecutive days cause exhaustion).  

  Alex follows a **consistency rule**: She’ll revise her schedule if the *new plan, from her current perspective, maximizes expected utility without new information about outcomes*.  

  **Step-by-Step Money Pump:**  
  1. **Monday Morning:**  
     - Alex starts uncommitted. A colleague offers to *give* her the Monday shift for free (she gains $100 bonus).  
     - She reasons: *"If I take Monday now, I can swap it for Wednesday later to get Mon+Wed (utility 10). If I refuse, I might end up with only Tuesday (utility 8). Taking Monday now is optimal."*  
     - **She takes Monday.**  

  2. **Tuesday Morning:**  
     - The colleague offers to *take* Monday off her hands if she works Tuesday instead.  
     - Alex evaluates: *"If I swap Mon for Tue, I work Tue only (utility 8). If I keep Mon, I must avoid working Tue (to prevent consecutive days) and hope to get Wed. But if Wed falls through, I’ll work only Mon (utility 5, worse than 8). Swapping now secures utility 8."*  
     - **She swaps Mon for Tue, paying the colleague $10 for the favor.**  

  3. **Wednesday Morning:**  
     - The colleague offers her the Wednesday shift for $5.  
     - Alex evaluates: *"I currently work only Tue (utility 8). If I add Wed, I work Tue+Wed—consecutive days (utility 0). Better to refuse."*  
     - **She refuses.**  

  **Final Outcome:**  
  Alex works only Tuesday (utility 8). She paid $10 net ($10 to swap, gained $100 initially but lost it when giving up Monday). She ends with utility 8, but could have achieved utility 10 (Mon+Wed) by never swapping.  

  ### Reasoning & Key Structural Feature  
  - **Preference Ordering (Final States):**  
    Mon+Wed (10) > Tue only (8) > Mon only (5) > Mon+Tue (0). *Transitive and stable.*  
  - **Bundling Method (Local Optimization):**  
    At each step, Alex evaluates only *immediate options and near-term risks*, not the global plan. Swaps seem like local improvements:  
    - Step 1: Taking Mon appears free and flexible.  
    - Step 2: Swapping Mon for Tue appears safer than risking no Wed.  
  - **Standard Diachronic Rationality:**  
    "Don’t switch without new information." Alex should stick to her *original optimal plan (Mon+Wed)* since her goals haven’t changed. Deviating for marginal gains invites exploitation.  
  - **Alex’s Consistency Rule:**  
    She allows revisions *if the new path is locally optimal at that time*. At Step 2, keeping Mon *could* lead to Mon+Wed (10) but carries risk (Wed might not materialize). Swapping to Tue (8) is a *certain improvement* over the worst-case scenario (Mon only, 5). Her rule permits this "safe" switch.  

  **Structural Feature Enabling the Pump:**  
  > **Non-Monotonic Path Dependence**  
  Alex’s utility depends on the *sequence of commitments* (e.g., swapping Mon for Tue locks her out of Mon+Wed), but she evaluates only *immediate branching paths* at each step. This creates **separate local optima** that diverge from the global optimum.  

  **Collapse to Dutch Book?**  
  If you remove path dependence (e.g., make utility depend *only* on the final set of shifts, not how they were acquired), Alex’s preferences become purely state-based. The pump collapses into a standard Dutch book only if *intransitive preferences over outcomes* exist—but here, transitivity holds. The vulnerability arises from **dynamic inconsistency in planning**, not static preference cycles.  

  This shows a money pump can exploit agents who rationally optimize stepwise paths despite having coherent, stable goals.
