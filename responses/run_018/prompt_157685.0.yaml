answer: |-
  ## Thought Experiment
  The Global Pathogen Defense Board must allocate its final $10M of annual funding. Option A deploys mosquito nets in malaria zones, expected to save 200 lives (99.9% confidence). Option B funds "Project Breakpoint," aiming to engineer a bacteriophage that neutralizes a key animal reservoir for a novel zoonotic virus. Success requires: 1) Lab phage design (50% chance), 2) Field delivery system (30% chance), 3) Reservoir suppression (20% chance), and 4) Preventing human spillover (0.4% chance *if* prior steps succeed). Independent probabilities imply a ~0.0002 (1 in 5,000) chance of preventing a pandemic, saving ~50 million lives; otherwise, it saves zero. An EV maximizer calculates B's expected value (50,000,000 * 0.0002 = 10,000 lives saved) as 50x higher than A's 200 lives. However, a proponent of **Robustness-Weighted Consequentialism** (RWC) insists on funding A, arguing that outcomes relying on *more than three* unverified causal links should be structurally discounted – not due to risk aversion or the magnitude of the potential lives saved, but because each additional link compounds epistemic fragility and real-world friction non-linearly, making the calculated probability of 0.0002 implausibly precise and likely an overestimate in complex systems.

  ## Analysis
  1.  **EV Maximization Reasoning:** Strictly multiplies the utility by the probability: `(50,000,000 lives) * (0.0002) = 10,000 expected lives saved` for B vs. `200 * 0.999 ≈ 200` for A. B dominates by expected lives saved.
  2.  **Robustness-Weighted Reasoning (RWC):** Accepts the *potential* 50M life utility but applies a structural discount factor due to the *four-step* causal chain. RWC argues that:
      *   Each link introduces unquantified uncertainties (e.g., unexpected ecological interactions, deployment failures, pathogen mutation).
      *   The probability estimate of 0.0002 assumes independence and perfect knowledge of each step's chance, which is unrealistic.
      *   Interventions relying on >3 novel causal links suffer from "complexity fragility," making their success probabilities effectively incalculable and systematically overestimated in models. The *principle* dictates discounting such long-shot chains, regardless of the stated probability or the stakes, favoring the robust (A).
  3.  **Exact Feature Causing Divergence:** **Treatment of Near-Zero Probabilities in Complex Systems.** EV treats the 0.0002 probability as linear and reliable. RWC contends that for outcomes dependent on long chains of unverified events, near-zero probabilities derived from multiplicative models (like 0.5 * 0.3 * 0.2 * 0.004 = 0.000012 ≈ 0.0002) are not epistemically robust enough to be used linearly in decision-making. The fragility of the causal structure undermines confidence in the probability estimate itself.
  4.  **Capped Stakes Test (50M -> 500k lives):** EV for B becomes `500,000 * 0.0002 = 100 expected lives saved`. This is now *less* than A's 200. **RWC *still* diverges by picking A.** While the EV now favors A numerically, RWC's rejection of B is based *principally* on the chain length exceeding its threshold (>3 links), not the EV calculation or the magnitude of the potential payoff. RWC would reject B even if its capped EV was *slightly higher* than A's (e.g., 210), due to the structural discount applied for complexity.
  5.  **EV Fanatic Attack on Robustness Principle:** An EV fanatic would argue the RWC rule ("discount chains >3 links") is fundamentally **ad hoc and unprincipled**:
      *   **Arbitrary Threshold:** Why 3 links? Why not 2 or 4? The threshold lacks a rigorous theoretical or empirical foundation; it appears invented solely to avoid counterintuitive EV results like favoring Project Breakpoint.
      *   **Ignores Actual Probability:** It dismisses the stated probability (0.0002) based on a structural heuristic rather than engaging with the specific evidence *for that probability estimate*. If the probability is well-supported, the chain length shouldn't matter.
      *   **Misses the True Issue:** If the concern is model fragility or probability overestimation, the *principled* EV approach is to demand better uncertainty quantification (e.g., wider confidence intervals, sensitivity analysis, Bayesian priors) and incorporate that into the probability estimate itself, not impose a blanket discount based on an arbitrary link count. The rule substitutes a crude structural proxy for the harder work of epistemic rigor. It's a disguised form of risk aversion masquerading as principle.
