prompt: |-
  everyone in my EA-adjacent circles keeps comparing measurability bias to the old streetlight story -- the drunk searching for his keys under the lamppost cuz thats where the lights, not cuz thats where he dropped them. they use it to argue that institutions like GiveWell end up funding only whats legible (bednets, deworming) and miss the big structural or longterm stuff. i want to audit how far that analogy actually carries weight. lay out the correspondence: whats the lost keys, the lamp post, the darkness, and the drunk guy? then tell me where the mapping breaks -- for instance, does it smuggle in that theres exactly one right place to look, or that quantification is always a distortion rather than a noisy proxy? and heres the key part: if the streetlight image collapses, does the institutional critique about measurability bias still stand on its own, or was the analogy doing all the argumentative work? be honest about which disanalogies matter and which are just decorative.
reasoning: |-
  Okay, the user is asking about the analogy between measurability bias and the streetlight story. They want to dissect how well this analogy holds when applied to organizations like GiveWell. The metaphor is used to criticize EA institutions for focusing only on measurable interventions, potentially missing bigger, structural changes.

  First, I need to map out the components of the analogy. The drunk is searching under the lamppost because it's bright, even though he lost his keys elsewhere. In the EA context, the keys represent impactful interventions, the lamppost is quantifiability, the darkness is unquantifiable areas, and the drunk represents EA institutions prioritizing measurable outcomes.

  The user's main concern is whether the critique of measurability bias stands without the analogy. They also want to know where the mapping breaks. I should consider the assumptions in the story. For example, the drunk knows exactly where the keys are lost, but in reality, we don't always know which interventions are best. Quantification might be a noisy proxy rather than a distortion. Also, the analogy implies a binary choice between measurable and unmeasurable, but there's a spectrum.

  I need to address the core critique: does focusing on measurability cause EA to miss high-impact areas? Even without the analogy, the bias exists. GiveWell's approach has strengths but limitations. They might underinvest in systemic changes or long-term interventions because those are harder to measure. The analogy's collapse doesn't invalidate the critique; it just removes a narrative device. The real issue is the trade-off between rigor and exploration.

  Disanalogies matter. The keys' location is known in the story, but in real life, we don't know where the biggest impacts are. Quantification isn't just a light; it's a tool that can guide or mislead. The story's simplicity might overlook efforts by some EA groups to tackle less measurable areas. Also, the drunk's search is passive, whereas EA institutions actively choose their focus based on evidence.

  The user might be part of EA circles engaging in this debate. Their deeper need is to understand if the criticism is valid and how to balance measurability with broader impact. They might want to advocate for more funding in structural interventions or seek a nuanced view of EA's strategies. Highlighting where the analogy fails and where the critique holds can help them form a balanced perspective.
answer: |-
  The streetlight analogy is a provocative critique of measurability bias, but it's imperfect. Let's dissect it rigorously and see where the institutional critique stands without it.

  **The Mapping:**
  *   **The Lost Keys:** The most impactful interventions for improving welfare or the long-term future (the *actual* solution to the problem).
  *   **The Lamppost:** The "light" of quantification, metrics, and rigorous evidence (e.g., RCTs, cost-effectiveness analysis).
  *   **The Darkness:** Areas where impact is complex, systemic, long-term, or inherently difficult to quantify (e.g., policy advocacy, movement building, foundational research, mitigating existential risks, systemic change).
  *   **The Drunk Guy:** Institutions (like GiveWell, or EA funders more broadly) prioritizing interventions *because* they are measurable under the "lamppost," not necessarily because they are the *most* impactful (the keys).

  **The Core Institutional Critique (What the Analogy Attempts to Capture):**
  The analogy argues that EA institutions, driven by a (laudable) desire for rigor and accountability, systematically favor interventions whose impacts can be clearly demonstrated through quantitative evidence. This creates a bias:
  1.  **Underfunding the "Dark":** High-potential but hard-to-measure interventions (structural change, long-termism, advocacy) get less funding and attention.
  2.  **Distortion:** Quantification becomes a *requirement* for funding, potentially distorting priorities away from what truly matters most.
  3.  **Path Dependence:** Funding flows to established, measurable areas (like bednets), reinforcing their dominance and making it harder for "dark" areas to develop comparable evidence bases.

  **Where the Analogy Holds Weight (Useful Correspondence):**
  1.  **The Bias is Real:** The central point – that measurability acts as a powerful filter influencing funding decisions – is valid. GiveWell explicitly prioritizes interventions with strong evidence, often quantitative.
  2.  **The "Easy Option" Aspect:** Searching where the light is *is* easier than venturing into the dark. Similarly, funding quantifiable interventions provides clearer accountability and justification to donors.
  3.  **Potential for Misplaced Focus:** Like the drunk, institutions *can* become overly fixated on optimizing within the measurable domain ("Let's find the *most* cost-effective bednet!") while neglecting potentially larger opportunities in the darkness.

  **Where the Analogy Breaks Down (Significant Disanalogies):**

  1.  **The Drunk *Knows* Where the Keys Are:** This is the **most critical flaw**. The analogy smuggles in the assumption that we *know* the "keys" (most impactful interventions) are definitively *outside* the light. In reality:
      *   **We Don't Know:** We have huge uncertainty about what *is* most impactful, especially for long-term or structural change. The "darkness" is vast and contains many potential dead ends alongside potential keys.
      *   **The Light Might Be Right:** Sometimes the most impactful things *are* measurable (e.g., bednets *do* save lives cheaply). The light isn't *inherently* the wrong place; it *might* be where some keys are.
      *   **Seeking Evidence is Prudent:** Venturing blindly into the dark is risky. Using the light (evidence) to guide the search is often the most *responsible* approach with limited resources. The drunk is irrational; EA institutions are trying (perhaps imperfectly) to be rational under uncertainty.

  2.  **Quantification as *Proxy*, Not Just Distortion:** The analogy frames the light as a *distraction*. But quantification is often a *noisy proxy* for real impact, not pure distortion. RCTs *do* measure real reductions in disease burden; cost-effectiveness models *do* capture real resource trade-offs. The light is imperfect and flickering, but it's not *only* illuminating irrelevant things. It provides *some* signal about where value might lie.

  3.  **Not a Binary Choice:** The analogy presents a stark choice: light vs. dark. Reality is a **spectrum of measurability**. EA institutions *do* fund things outside the pure "lamppost" of RCTs (e.g., GiveWell's Incubation Grants, Open Phil's broader mandate). The critique is about *degree* and *priority*, not absolute exclusion. The "drunk" might be cautiously shining a flashlight into the nearby bushes, not just staring fixedly under the lamp.

  4.  **Multiple Searchers & Light Sources:** The analogy features one drunk and one lamp. EA involves:
      *   **Multiple Institutions:** GiveWell focuses on the "lamppost" of global health RCTs. Open Philanthropy explicitly targets "dark" areas like AI safety and policy advocacy. Longview Philanthropy funds very long-term work. The ecosystem is more diverse.
      *   **Building New Lights:** Significant EA resources go into *developing* methods to quantify and evaluate less tangible impacts (e.g., assessing movement building, forecasting long-term trends, valuing statistical lives), trying to *expand* the circle of light.

  5.  **Intentionality vs. Drunkenness:** The "drunk" is incompetent. EA institutions are making deliberate, reasoned (though potentially flawed) choices based on epistemics and values (like scope insensitivity leading to favoring identifiable lives). They are not stumbling randomly.

  **Does the Institutional Critique Stand Without the Analogy? Absolutely.**

  The collapse of the streetlight analogy **does not invalidate the core critique of measurability bias**. The analogy is primarily a vivid *illustration*, not the foundation of the argument. The critique rests on observable realities:

  1.  **Resource Allocation:** A significant majority of "EA-adjacent" funding *does* flow towards interventions with strong, quantifiable short-to-medium term evidence (global health, animal welfare factory farming campaigns). Hard-to-measure areas receive less.
  2.  **Methodological Constraints:** Rigorous evaluation frameworks (like GiveWell's) *do* have inherent limitations in capturing complex, systemic, or very long-term impacts. These limitations *will* bias recommendations towards what fits the framework.
  3.  **Opportunity Cost:** Funding directed towards measurable interventions *is* funding not directed towards exploring potentially transformative but less measurable paths. This trade-off exists regardless of the analogy.
  4.  **Risk of Institutional Inertia:** Organizations optimized for evaluating RCTs may lack the expertise or structures to effectively assess and fund systemic change, creating a self-reinforcing cycle.

  **Which Disanalogies Truly Matter?**

  *   **Crucial:** The "drunk knows where the keys are" flaw. This fundamentally misrepresents the deep uncertainty inherent in impact assessment. It turns a critique about *methodological limitation* into an unfounded assertion of *knowing the better alternative*.
  *   **Important:** The proxy vs. distortion point. Dismissing quantification entirely ignores its genuine (though imperfect) value. The critique is stronger when framed as "quantification is incomplete and noisy, not purely distorting."
  *   **Important:** The non-binary nature. Ignoring the spectrum of measurability and efforts to expand it oversimplifies the institutional landscape.
  *   **Less Critical:** The single drunk/single lamp. While the diversity of EA actors matters, the core critique often applies to the *dominant funding flows* or *specific influential institutions* like GiveWell.

  **Conclusion:**

  The streetlight analogy is a **useful but flawed metaphor**. It effectively highlights the *existence* and *danger* of measurability bias – the tendency to favor the quantifiable because it's visible, potentially missing larger, harder-to-see opportunities. **However, it breaks down critically by assuming we know the better alternative exists in the dark and by oversimplifying quantification as mere distortion.**

  **The institutional critique stands firmly on its own:** The emphasis on rigorous quantification, while a strength in many ways, creates a systematic bias in funding allocation. It makes it harder for high-potential, complex, long-term, or systemic interventions to compete for resources *even if they might be more impactful*, due to the inherent difficulty of providing comparable evidence within standard evaluative frameworks. The challenge for EA institutions is to acknowledge this bias explicitly, invest in *developing better methods* to illuminate the "darkness," and consciously allocate *some* resources to explore high-risk, high-reward, less measurable paths *despite* the uncertainty – not because they know the keys are there, but because the potential payoff justifies the informed gamble. The analogy points to a real problem, but solving it requires moving beyond the analogy's simplistic confines.
