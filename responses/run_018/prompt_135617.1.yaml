  Please return this as a JSON object with exactly these fields:
  {
    "rank": integer,
    "objector_profile": string,
    "objection": string,
    "two_minute_reply": string,
    "soft_spot": string,
    "damage_rating": "high" | "medium" | "low"
  }

  Add a separate field "feared_question" (the buried objection) and "concession_up_front" (what to admit immediately). Order the array by damage, highest first. Keep it practical — I'm not writing a grant, just trying not to embarrass myself in front of people who do this for a living.
