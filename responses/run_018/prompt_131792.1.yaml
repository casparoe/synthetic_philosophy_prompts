  Hmm, the user's clearly deeply familiar with Grice's work - notice how they preemptively block both easy exits (calling it non-implicature or dropping intentions). Their challenge has teeth because the inference pattern is identical to human cases. I should avoid making this a strawman - need to channel Grice's actual rigor.

