answer: |-
  This pattern you've identified is both profound and under-discussed. It sits at the intersection of several established philosophical problems but isn't fully captured by any single existing term. The closest existing concept is **"Kuhn-loss"** or **"incommensurability of evidence"** from Kuhn's *Structure of Scientific Revolutions*, but your case focuses specifically on *confirmation dynamics* rather than paradigm shifts. **"Redescriptive Confirmation"** (or **"Evidential Reclassification"**) would be a precise label for this phenomenon. Below is a formal definition and its relationship to established concepts:

  ### Core Definition: Redescriptive Confirmation
  **Redescriptive Confirmation** occurs when a theory (T2) gains apparent confirmatory support from an existing dataset (D) not through novel predictions or increased likelihood of D, but by reclassifying features of D previously dismissed as noise/artifact by an incumbent theory (T1) as meaningful signal. Confirmation arises from a shift in the *descriptive ontology* of what constitutes data versus error, altering the epistemic weight assigned to F.

  #### Boundary Conditions
  1.  **Shared Predictive Equivalence:** T1 and T2 must be empirically equivalent regarding *novel predictions* derived from D in their shared observational vocabulary. Neither predicts new phenomena the other cannot accommodate.
  2.  **Noise-to-Signal Reclassification:** A specific feature F of D is explicitly treated as noise/artifact under T1 but as central, meaningful signal under T2.
  3.  **Explanatory Centrality:** F becomes explanatorily necessary within T2's framework (e.g., F is derived from T2's core principles), while it is merely dismissed or explained away under T1 via auxiliary hypotheses (e.g., error models).
  4.  **Invariant Probability (in shared terms):** P(D | T1, B) ≈ P(D | T2, B) when D is described in the *shared observational vocabulary* (B = background knowledge). The confirmatory force stems from T2's *redescription* of F, not an increased likelihood of the raw data D.

  ### Distinguishing from Established Concepts
  | Concept                 | How Redescriptive Confirmation Differs                                                                 |
  | :---------------------- | :----------------------------------------------------------------------------------------------------- |
  | **Problem of Old Evidence** | Focuses on temporal priority: "How can known E confirm T?" Here, the issue is *conceptual*: F was known but *not treated as evidence* under T1. T2 doesn't just use old data—it redefines what *counts* as data from that dataset. |
  | **Underdetermination**  | Classical underdetermination assumes theories share the *same* empirical consequences. Here, T1 and T2 disagree on the *evidential significance* of F within D. They are not empirically equivalent in their *interpretive frameworks*. |
  | **Auxiliary-Hypothesis Adjustment** | T1 dismisses F via auxiliary hypotheses (e.g., error models). T2 doesn't merely adjust these; it eliminates the need for them by making F central. The shift is in the *core theory's ontology*, not just protective belts. |
  | **Immunization Strategy** | Immunization deflects falsification. Here, T1 isn't falsified; D was always "explained" (as noise). T2 gains confirmation by claiming F *shouldn't* have been dismissed—it's a *positive argument for T2*, not a defense of T1. |
  | **Explanatory vs. Predictive Confirmation** | The confirmation is *explanatory*, but uniquely: T2 explains *why F is signal*, while T1 explains *why F appears but is not signal*. It's confirmation via ontological recontextualization, not just inference to the best explanation. |
  | **Theory-Ladenness of Observation** | This phenomenon *presupposes* theory-ladenness: what counts as "noise" or "signal" is theory-dependent. Redescriptive confirmation is the *confirmation-theoretic consequence* of that ladenness when theories disagree on categorization. |

  ### Relationship to Bayesianism
  Bayesianism struggles with redescriptive confirmation because:
  1.  **Probability Invariance:** If P(D | T1, B) = P(D | T2, B), D cannot confirm T2 over T1 via the likelihood ratio.
  2.  **Redescription Challenge:** Formalizing the shift requires modeling how T2 changes the *description* of D. One might argue that T2 predicts "D*" (where F is signal), not D (where F is noise). But D and D* are observationally identical in the shared vocabulary—they are the same raw data. Bayesian confirmation requires specifying what is conditioned upon, but T2 changes the *meaning* of the conditioned evidence.

  **Resolution Attempt:** A Bayesian might insist on *modeling the reclassification*:
  -   Define E: "The dataset D contains feature F."
  -   Under T1, F is noise: P(E | T1, B) is high but *unremarkable* (F is expected as artifact).
  -   Under T2, F is signal: P(E | T2, B) is high and *remarkable* (F is entailed by T2's core mechanism).
  -   If "remarkability" is captured by T2 making E *less surprising* or *more expected* than under T1 *relative to a broader context*, P(E | T2, B) > P(E | T1, B) might hold, confirming T2. However, this depends on contestable prior weightings of "surprise."

  ### Key Philosophical Implications
  1.  **Confirmation is Vocabulary-Dependent:** What confirms a theory depends on the ontological categories used to describe evidence. Shifting the "noise/signal" boundary can generate confirmation without new predictions.
  2.  **Explanatory Virtues Drive Confirmation:** The appeal of T2 lies in its ability to *make sense* of F, transforming an anomaly into a cornerstone. This is an *explanatory virtue* (coherence, unification) masquerading as empirical confirmation.
  3.  **Edge Cases & Risks:** The boundary blurs if:
      -   T2 *also* makes novel predictions (not pure redescriptive confirmation).
      -   T1 could absorb F as signal without ad hoc adjustments (then T2 isn't necessary).
      -   The reclassification is purely semantic without empirical grounding (confirmation becomes illusory).

  ### Why "Redescriptive Confirmation" Fits
  -   **Precise:** Centers on the reclassification act ("redescription") as the source of confirmation.
  -   **Distinctive:** Separates it from temporal old-evidence problems and predictive equivalence.
  -   **Diagnostic:** Highlights how disputes over data taxonomy (noise vs. signal) underpin theory choice when predictive power is parity.

  This phenomenon reveals a deeper layer of theory dependence in confirmation: data doesn't just test theories; theories define what *counts* as testable data. Your psychological and cosmological examples perfectly illustrate its real-world salience—where scientific progress often hinges not on new data, but on seeing old data anew.
