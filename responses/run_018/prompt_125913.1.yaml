prompt: |-
  hey i'm the exhibit designer at a mid-size science museum and we're overhauling our energy wing. we want all comparison graphics to follow neuraths isotype rules — same flat symbol for each unit, quantity shown by repetition not scaling up, no 3d or decorative flair, that kind of thing. but heres the twist: every display also has to pass a tactile-readability check for low-vision visitors, so the embossed outline of symbol A cant blur into symbol B.

  can you turn neuraths picture-language principles into a step-by-step procedure my team can actually run on a proposal? i want the checks in order, what counts as pass or fail at each step, the exact point where we stop with a hard reject, and the spots where its just a values call that has to go to me. apply it to two draft proposals: (1) coal vs solar using stacked identical coal-lump icons versus stacked identical sun icons, and (2) coal vs solar using one flame icon scaled three times larger next to one small lightning-bolt icon. include the case where the procedure spits out an answer we'll probably hate. and tell me straight up what this checklist cant settle — for instance whether its okay that the sun symbol feels more optimistic.
reasoning: |-
  We are creating a step-by-step procedure based on Otto Neurath's Isotype principles, with the added constraint of tactile readability for low-vision visitors. The key principles from Neurath we are incorporating are:
   1. Use of identical, flat symbols for each unit (no variation in design for the same concept).
   2. Quantity is shown by repetition of symbols, not by scaling up a single symbol.
   3. Avoid 3D effects or decorative flair.

   Additionally, we require that the embossed outline of one symbol does not blur into the next (tactile readability).

   The procedure will have a series of checks. We'll define:
   - The order of checks.
   - What constitutes a pass or fail at each step.
   - A hard reject point (where we stop and reject the proposal outright).
   - Points that are subjective and must be escalated to the exhibit designer (you).

   We'll apply the procedure to two draft proposals:

   Proposal 1: Coal vs solar using stacked identical coal-lump icons versus stacked identical sun icons.
   Proposal 2: Coal vs solar using one flame icon scaled three times larger next to one small lightning-bolt icon.

   We are also to include a case where the procedure might yield an unpopular answer and state what the checklist cannot settle.

   Step-by-Step Procedure:

   1. **Check for Isotype Principle: Unit Representation**
      - **Rule**: Each unit must be represented by an identical, flat symbol. There should be no scaling, 3D effects, or decorative variations for the same concept.
      - **Check**: Are the symbols for each energy source (coal and solar) identical and flat? If there are multiple symbols for the same source, they must be exact copies.
      - **Pass**: All symbols for coal are identical and flat; all symbols for solar are identical and flat.
      - **Fail**: Any variation in the same symbol set, or use of 3D/decorative effects.
      - **Escalation**: If the symbols are not identical but the variations are minor (e.g., slight rotation for visual interest but the same base shape) and flat, this might be a values call (escalate to designer). However, note that for tactile readability, even minor variations might cause confusion, so it's better to avoid.

   2. **Check for Isotype Principle: Representation of Quantity**
      - **Rule**: Quantity must be represented by repetition of the unit symbol, not by scaling the symbol.
      - **Check**: How is the quantity of energy represented? By multiple symbols (repetition) or by one symbol that is scaled?
      - **Pass**: Quantity shown by repeating the same-sized symbol.
      - **Fail**: Quantity shown by scaling a single symbol (e.g., a large symbol representing multiple units).
      - **Escalation**: None. This is a core principle. If failed, hard reject? But note: we might have a mix (like a bar chart with repeated symbols and then a large symbol for a very high number). However, Neurath strictly uses repetition. So we'll say: if any quantity is represented by scaling, it fails.

   3. **Check for Tactile Readability: Symbol Spacing and Clarity**
      - **Rule**: Embossed outlines of adjacent symbols must not blur together when touched. This requires adequate spacing and distinct, simple shapes.
      - **Check**: Are the symbols spaced sufficiently apart so that the embossed outlines are clearly distinguishable by touch? Also, are the symbols themselves simple enough (without intricate details) to be tactilely readable?
      - **Pass**: 
          a. Minimum spacing between any two symbols is at least the width of the embossed line (or a standard minimum, e.g., 3 mm) and enough that the raised areas do not merge.
          b. Symbols are simple and have clear, bold outlines without tiny details.
      - **Fail**: 
          a. Symbols are so close that the embossed lines might run together (e.g., less than the minimum spacing).
          b. Symbols are too complex (e.g., highly detailed) to be distinguishable by touch.
      - **Escalation**: If the spacing is borderline, or if the symbol complexity is debatable (e.g., a sun with many rays), escalate to the designer for a judgment call.

   4. **Check for Consistency and Non-Decorative Flair**
      - **Rule**: Avoid any decorative elements that do not convey information. The symbols should be minimal and convey the concept without extra flair.
      - **Check**: Are there any decorative elements (like gradients, drop shadows, unnecessary embellishments) that do not add informational value?
      - **Pass**: Symbols are flat, without any decorative effects.
      - **Fail**: Use of 3D, shadows, gradients, or any non-informative decoration.
      - **Escalation**: None. Decorative elements are against the principles and also may cause tactile issues (if embossed, they might add unnecessary texture). This is a hard reject.

   5. **Check for Symbol Distinction Between Categories**
      - **Rule**: The symbols for different categories (coal vs solar) must be clearly distinct both visually and tactilely.
      - **Check**: Are the symbols for coal and solar sufficiently different in shape so that they can be easily distinguished by touch?
      - **Pass**: The symbols have distinct overall shapes (e.g., a coal lump is irregular and the sun is a circle with rays) that can be recognized by touch.
      - **Fail**: Symbols are too similar in shape (e.g., both are circular) and might be confused.
      - **Escalation**: If the distinction is debatable, escalate to the designer.

   Hard Reject Points:
   - If the design fails Check 2 (representation of quantity by scaling) OR Check 4 (use of decorative flair or 3D), it is an immediate hard reject because it violates core Isotype principles.
   - If the design fails Check 1 (unit representation) and the issue is not minor (e.g., major variations or 3D), then hard reject. But if minor, escalate.

   Now, apply to the two proposals:

   Proposal 1: Stacked identical coal-lump icons vs. stacked identical sun icons.

   Step 1: Unit Representation
     - Both coal and solar use identical symbols? Yes, each stack has identical symbols. Pass.

   Step 2: Representation of Quantity
     - Quantity is shown by repetition (stacking). Pass.

   Step 3: Tactile Readability
     - We need to check the spacing between symbols in the stack and the simplicity of the symbols.
     - Coal lump: if the lumps are irregular but simple, and spaced appropriately, then pass. Sun: if the sun has rays, we must ensure the rays are not too thin and are spaced so they don't blur with adjacent symbols (both within the same stack and between the two stacks? note: stacks are separate). The key is within the same stack: if the suns are stacked, the rays of one might touch the next if too close. We need to see the design. If they are spaced adequately, pass. If not, fail and then we might adjust spacing? But if the design as proposed has insufficient spacing, then fail.

     Without a specific design, we assume the proposal has adequate spacing and simple symbols. So tentative pass.

   Step 4: Consistency and Non-Decorative
     - Assuming flat, no effects. Pass.

   Step 5: Symbol Distinction
     - Coal lump and sun are very distinct. Pass.

   Overall: Pass.

   Proposal 2: One flame icon scaled three times larger next to one small lightning-bolt icon.

   Step 1: Unit Representation
     - For coal: one flame (which is scaled). For solar: one lightning bolt. But note: are they using the same symbol for each unit? Actually, they are using one symbol per source, but the flame is scaled. Also, the flame and bolt are different, but that's acceptable because they represent different sources. However, the issue is that the flame is scaled to represent a larger quantity? So let's check step 2.

   Step 2: Representation of Quantity
     - The flame is scaled three times larger to represent a larger quantity (presumably of energy) compared to the small lightning bolt. This violates the principle that quantity should be shown by repetition, not scaling. Therefore, FAIL.

     This is a hard reject point. We stop and reject the proposal.

   However, for completeness:

   Step 3: Tactile Readability
     - Even if we continued, we might note: one large flame and one small bolt. The large flame might have details that become too complex when scaled? Also, the two symbols are adjacent. But the step 2 failure is already a hard reject.

   Step 4: Non-decorative? Probably pass if they are flat, but we don't get that far.

   So Proposal 2 is rejected.

   Case that might yield an unpopular answer:

   Suppose we have a proposal that uses repeated symbols but the number of repetitions is very high (e.g., 1000 coal lumps). This would take up too much space, so the designer might be tempted to use a single large lump and put a number next to it. However, the checklist would fail this at step 2 (because the quantity is represented by a number and one symbol, not repetition). This might be an unpopular answer because it's impractical. But according to strict Isotype, it should be repeated. However, Neurath sometimes used a different approach for very large numbers (like a row of 10 and then a number to indicate hundreds). We might need to adjust the rule to allow for a combination of repetition and a number? But note: the tactile requirement might also make a large number of symbols hard to distinguish. 

   The procedure as defined in step 2 would fail the design. This is a case where we might need to revisit the principles or escalate to the designer for a decision on how to handle large numbers. The checklist doesn't account for this nuance.

   What the checklist cannot settle:

   1. **Symbol Optimism**: The checklist does not address the emotional connotation of symbols (e.g., the sun symbol feels more optimistic than coal). This is a subjective design choice that must be decided by the team.

   2. **Handling Very Large Numbers**: As above, the strict repetition rule might be impractical. The checklist doesn't have an exception rule, so the designer must decide whether to allow a hybrid approach (e.g., a few symbols and a number) and how to make that tactilely readable.

   3. **Symbol Design**: The checklist ensures symbols are distinct, simple, and non-decorative, but it doesn't specify what the symbols should be. For example, using a flame for coal might be misleading (since coal is a solid) versus a lump. The designer must ensure the symbols are conceptually appropriate.

   4. **Color and Visual Design**: The checklist is focused on the structural and tactile aspects. It does not address color choices (which are important for low-vision but not blind visitors) or overall visual hierarchy for sighted visitors.

   5. **Spacing Thresholds**: The exact minimum spacing for tactile clarity might require user testing. The checklist sets a pass/fail based on a predefined threshold, but that threshold might need adjustment based on actual testing with low-vision individuals.

   6. **Complexity of Symbols**: The assessment of whether a symbol is "too complex" is somewhat subjective and might require escalation.

   Revised Procedure with Steps and Escalation/Hard Reject:

   Step 1: Unit Representation
     - Pass: All symbols for the same concept are identical and flat.
     - Fail: Symbols are not identical (unless minor variations that don't affect recognition and are approved by designer) OR 3D/decorative.
     - Escalation: If the variation is minor and flat, escalate to designer.
     - Hard Reject: If 3D or decorative, or if variations are major and not escalated.

   Step 2: Representation of Quantity
     - Pass: Quantity shown by repetition of the same-sized symbol.
     - Fail: Quantity shown by scaling a symbol.
     - Hard Reject: Immediate. (But note: if the designer wants to make an exception for very large numbers, they must override, but the procedure flags it as a fail.)

   Step 3: Tactile Readability (Spacing and Clarity)
     - Pass: Symbols are spaced adequately (with a defined minimum, e.g., 3mm) and have simple, bold shapes.
     - Fail: Inadequate spacing or overly complex symbols.
     - Escalation: If spacing is borderline or complexity is debatable, escalate to designer.

   Step 4: Non-Decorative
     - Pass: No decorative elements (flat, no effects).
     - Fail: Use of 3D, shadows, gradients, etc.
     - Hard Reject: Immediate.

   Step 5: Symbol Distinction
     - Pass: Symbols for different categories are clearly distinct in shape.
     - Fail: Symbols are too similar.
     - Escalation: If the distinction is debatable, escalate.

   Summary for Proposal 1: 
     - Step 1: Pass
     - Step 2: Pass
     - Step 3: Pass (assuming adequate spacing and simple symbols) - if not, we might fail or escalate.
     - Step 4: Pass
     - Step 5: Pass
     => Overall Pass.

   Summary for Proposal 2:
     - Step 2: Fail -> Hard Reject.

   Final note: The procedure is a tool to enforce the principles, but the designer has the final say on escalated points and may override if there is a strong rationale. However, the core principles (especially step 2 and 4) are not overridden lightly because they are foundational to Isotype and also impact tactile readability (scaling might make a symbol too complex for touch).
answer: |-
  Here's a step-by-step Neurath Isotype compliance procedure tailored to your tactile-readability requirements, with clear pass/fail thresholds and escalation points. Apply this checklist to any exhibit proposal **before** fabrication:

  ### **Neurath Isotype Tactile Compliance Checklist**
  *(Run checks in order — stop at first hard reject)*

  1. **UNIT SYMBOL IDENTITY CHECK**  
     - *Rule:* Each energy type must use *one* identical, flat, 2D symbol. No variations.  
     - *Pass:* Single symbol used per energy source (e.g., ☉ for solar, ■ for coal).  
     - *Fail:* Multiple symbols for same source (e.g., ☉ + ☀ for solar) or non-flat design.  
     - *Escalate:* Symbol abstraction level (e.g., "lump" vs. "wagon" for coal).  

  2. **QUANTITY REPRESENTATION CHECK**  
     - *Rule:* Quantity shown *only* by repeating identical units. No scaling, pie charts, or proportional symbols.  
     - *Pass:* Quantities represented by countable rows/grids of same-size symbols (e.g., ▥▥▥ = 3 units).  
     - *Hard Reject:* Any size scaling (e.g., big icon = 100 units) or non-repetition methods.  
     - *Escalate:* N/A — this is non-negotiable for Neurath compliance.  

  3. **TACTILE BLEED TEST**  
     - *Rule:* Embossed symbols must not merge when touched. Minimum 1.5x symbol width spacing.  
     - *Pass:* Symbols spaced ≥1.5x their width (e.g., 10mm suns spaced ≥15mm apart).  
     - *Fail:* Symbols touch or spacing <1x symbol width.  
     - *Escalate:* Spacing between 1x–1.5x width (requires tactile user testing).  

  4. **SYMBOL COMPLEXITY AUDIT**  
     - *Rule:* Symbols must be simple silhouettes. Max 3 distinct topological features (e.g., sun = circle + rays).  
     - *Pass:* ≤3 features, no internal details (e.g., coal lump = single blob shape).  
     - *Fail:* >3 features or fine details (e.g., detailed flame with curls).  
     - *Escalate:* Feature count borderline (e.g., 4 simple rays).  

  5. **COMPARATIVE EQUALITY VERIFICATION**  
     - *Rule:* Symbols for different energies must have equal visual weight (size, line thickness).  
     - *Pass:* All symbols same size/thickness (e.g., suns and lumps both 10mm).  
     - *Hard Reject:* Imbalanced sizing/thickness implying hierarchy.  
     - *Escalate:* N/A — strict equality required.  

  ---

  ### **Applied to Your Proposals**
  **Proposal 1: Stacked Identical Icons (Coal Lumps vs. Suns)**  
  1. **Unit Symbol:** Pass (one lump shape, one sun shape).  
  2. **Quantity:** Pass (repetition, no scaling).  
  3. **Tactile:**  
     - *Pass* if spacing ≥1.5x sun-ray length.  
     - *Escalate to you* if rays are long (spacing may need adjustment).  
  4. **Complexity:**  
     - Sun: Likely pass (circle + rays = 2 features).  
     - Coal: Pass (single lump = 1 feature).  
  5. **Equality:** Pass (same size icons).  
  **Verdict:** **APPROVED** if tactile spacing passes.  

  **Proposal 2: Scaled Flame vs. Small Lightning Bolt**  
  1. **Unit Symbol:** Pass (one flame, one bolt).  
  2. **Quantity:** **HARD REJECT** (scaling used instead of repetition).  
     *Stop here — do not proceed.*  
  **Verdict:** **REJECTED.** Violates core Neurath principle.  

  ---

  ### **Unpopular Outcome Example**  
  **Scenario:** A proposal shows coal energy as 100+ tiny lumps versus solar as 3 large suns (to save space).  
  - **Check 2 (Quantity):** *Fail* — scaling used for coal.  
  - **Check 5 (Equality):** *Fail* — symbols unequal size.  
  **Verdict:** **HARD REJECT.**  
  *Why you'll hate it:* Space efficiency conflicts with Neurath rules. Solution: Use a "key" (e.g., 1 lump = 10 tons) with ≤20 repeats max.  

  ---

  ### **What This Checklist CANNOT Settle**  
  1. **Symbol Semiotics:**  
     - E.g., "Sun feels optimistic" — this is subjective meaning, not rule violation. Your call.  
  2. **Color/Texture Choices:**  
     - Neurath allows color coding, but tactile needs may require textures (escalate for texture-symbol mapping).  
  3. **Grid vs. Free Layout:**  
     - Neurath prefers grids, but organic arrangements pass if spacing/tactile rules are met.  
  4. **Cultural Symbolism:**  
     - E.g., Using ⚡ for solar instead of ☉ — not covered by rules if both pass checks.  

  ### **Critical Escalation Points**  
  - Tactile spacing between 1x–1.5x symbol width.  
  - Symbol abstraction (e.g., "flame" for coal vs. "lump").  
  - Texture/color assignments for dual-coding (visual + tactile).  

  **Final Recommendation:**  
  Reject Proposal 2 outright. For Proposal 1, verify sun-ray spacing doesn’t cause tactile bleed (prioritize wider gaps). The checklist enforces "readability over artistry" — if a symbol’s optimism compromises clarity (e.g., complex "happy sun"), simplify it ruthlessly. Neurath’s genius was in *standardized communication*, not emotional resonance.
