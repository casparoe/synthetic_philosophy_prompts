answer: |-
  ## Full Specification: Theory of Valid Consent

  **Core Desiderata & Motivating Cases:**

  1.  **Non-Deception (Core Nature of Act):** Consent must not be based on intentional falsehoods about the *fundamental nature* of the act agreed to (e.g., lying that a medical procedure is purely diagnostic when it is therapeutic/experimental).
      *   **Motivating Case:** A patient consents to "exploratory surgery" believing it's purely diagnostic, but the surgeon intends and performs an organ removal based on an undisclosed prior agreement with a researcher. Distinguishing deception about the *act itself* from deception about peripheral details (e.g., the brand of anesthetic used) is crucial.
      *   **Flag:** Non-Negotiable for autonomy (fundamental misunderstanding).

  2.  **Non-Deception (Material Welfare Interests):** Consent must not be based on intentional falsehoods about facts *material* to the consenter's core welfare interests *within the scope of the act* (e.g., known severe risks, core benefits, core obligations of the counterparty).
      *   **Motivating Case:** A research subject consents based on the deliberate misrepresentation that a drug trial carries "minimal, common side-effects like headache" when the researchers know it carries a significant risk of irreversible liver damage. Distinguishes deception impacting *core welfare* from deception about minor inconveniences (e.g., the color of the waiting room).
      *   **Flag:** Non-Negotiable for autonomy (impairs evaluation of core interests).

  3.  **Non-Coercion (Direct Threats):** Consent must not be elicited by explicit and credible threats of wrongful harm if consent is withheld.
      *   **Motivating Case:** "Sign this contract giving me your business or I will burn down your warehouse." Distinguishes direct threats from legitimate warnings (e.g., "If you don't consent to this life-saving surgery, your condition will likely be fatal").
      *   **Flag:** Non-Negotiable for autonomy (choice under illegitimate duress).

  4.  **Non-Coercion (Structural Dependency):** Consent must not be vitiated by an exploitative power imbalance where refusal is rendered practically impossible due to essential dependency, even without explicit threats.
      *   **Motivating Case:** An impoverished tenant "consents" to exorbitant rent increases or degrading conditions because affordable alternatives are non-existent, and homelessness is the only perceived alternative. Distinguishes *exploitative* structural dependency (e.g., company town, essential medication monopoly) from mere unequal bargaining power (e.g., choosing between two expensive phone plans).
      *   **Flag:** Negotiable - Camp conflict: Must conditioning (require safeguards) vs. Autovitiation (always invalidates).

  5.  **Competence (Threshold Capacity):** The consenter must possess sufficient cognitive and emotional capacity at the time of consent to understand the nature and consequences of the act in question.
      *   **Motivating Case:** Distinguishing consent given during a brief psychotic episode (incompetent) from consent given while experiencing significant anxiety but retaining understanding (potentially competent, depending on the act's complexity). Requires defining a *minimal threshold* relative to the *specific decision*.
      *   **Flag:** Non-Negotiable for autonomy (requires basic agency capacity).

  6.  **Competence (Enduring vs. Temporary):** The theory must account for the distinction between enduring incompetence (e.g., advanced dementia) and temporary impairment (e.g., intoxication, acute distress).
      *   **Motivating Case:** Consent given while heavily intoxicated vs. consent given by someone with a stable intellectual disability. Enduring incompetence typically requires proxy consent; temporary impairment typically invalidates consent *at that moment* but doesn't preclude future valid consent.
      *   **Flag:** Non-Negotiable for applicability (requires temporal distinction).

  7.  **Manufactured Opacity (Information Environment Manipulation):** Consent is invalid if the counterparty deliberately structures the information environment to prevent the consenter from *even considering* relevant alternatives or material risks/benefits, without necessarily lying.
      *   **Motivating Case:** A travel booking platform algorithmically suppresses all rail options for a route, displaying only its own affiliated (more expensive) flights and buses, making the cheaper/faster train alternative cognitively invisible to the user searching for "transport from X to Y". Contrast with simple lack of disclosure (user never asked about trains). Requires showing *deliberate* manipulation to *prevent awareness*.
      *   **Flag:** Negotiable - Camp conflict: Requires robust affirmative disclosure/duty to present alternatives vs. Mere avoidance of deception/misrepresentation.

  8.  **Competence Drift (Binding Prior Consent):** The theory must address whether consent given while competent remains valid when the consenter's competence significantly deteriorates *before the consented act occurs*, without revocation.
      *   **Motivating Case:** A patient with early-stage dementia signs an advance directive consenting to future palliative care only (no life-prolonging measures). When they develop severe dementia and contract pneumonia, are they still bound by that prior consent, even though they cannot now understand or reaffirm it? Contrast with proxy consent *for* an already incompetent person.
      *   **Flag:** Negotiable - Camp conflict: Binding Ulysses Contracts (honoring prior autonomous choice) vs. Continuous Competence Requirement (only present wishes/competence matter).

  **Negotiability Flags:**

  *   **Non-Negotiable (Autonomy Core):** Non-Deception (Core Nature, Material Welfare Interests), Non-Coercion (Direct Threats), Competence (Threshold Capacity, Temporal Distinction).
  *   **Negotiable (Camp Preferences):**
      *   **Structural Coercion:** Autovitiation vs. Must-Conditioning.
      *   **Manufactured Opacity:** Required Affirmative Disclosure/Environmental Safeguards vs. Avoidance of Active Deception Only.
      *   **Information Scope:** Full Material Disclosure vs. Reasonable Person/Relevant Risk Standard.
      *   **Competence Drift:** Binding Prior Consent (Ulysses Contracts) vs. Continuous Competence Requirement.
      *   **Welfare vs. Autonomy:** Absolute Primacy of Expressed Choice vs. Overriding for Severe Welfare Harm during Drift/Opacity.

  **Suspected Conflicts:**

  1.  **Opacity Prevention vs. Dependency Coercion:** Robust requirements to counter manufactured opacity (e.g., mandatory presentation of all alternatives, extensive risk disclosures) can themselves become overwhelming or coercive in contexts of structural dependency. A vulnerable tenant presented with a 50-page lease detailing every possible legal scenario may feel *more* pressured to sign quickly without understanding, fearing the landlord will move on, thus undermining the very autonomy the disclosure aims to protect.
  2.  **Prior Consent vs. Present Welfare:** Honoring binding prior consent (e.g., "Do not resuscitate") during competence drift (e.g., severe dementia) directly conflicts with the present welfare interest of the now-incompetent person (e.g., who might reflexively fight for breath during pneumonia). Resolving this pits past autonomy against present well-being when the two are incommensurable.
  3.  **Anti-Deception Epistemic Standard vs. Ordinary Consent:** Strictly requiring consent to be based on *no* false beliefs (even minor, non-material ones) or requiring *perfect* understanding sets an impossibly high epistemic bar. This would invalidate most real-world consent in medicine (patients rarely grasp every nuance) and commerce (consumers often have minor misconceptions). A theory demanding this standard eliminates consent as a practical concept.

  **Model Scorecard:**

  1.  **Informed Consent Models:** Excel on deception (disclosure focus) and competence (assessment focus). Struggle profoundly with structural coercion (often ignoring power imbalances), manufactured opacity (focus on disclosed information, not environment/alternatives), and competence drift (prior directives are accommodated but the conflict with present welfare/personhood is often papered over). Disclosure burdens can exacerbate coercion in dependencies.
  2.  **Pure Voluntariness Accounts:** Strong on direct coercion and dependency-based coercion (focusing on the presence/absence of choice). Critically weak on deception (voluntariness can exist with fundamental misunderstanding) and competence (voluntariness doesn't require understanding). Largely ignore manufactured opacity (environment not a factor in "free choice") and offer simplistic answers to competence drift (prior consent is just a past voluntary act).
  3.  **Relational Autonomy Theories:** Strong on structural coercion and dependency (contextualizing choice within relationships/power structures). Better equipped to handle manufactured opacity (analyzing information environments as relational/social constructs). Offer nuanced takes on competence (socially embedded capacity). Struggle with deception (less emphasis on discrete informational requirements) and face deep tension in competence drift – honoring relational history/past commitments conflicts with present relational needs/welfare during decline. The non-negotiable core of competence thresholds can sometimes be blurred.
