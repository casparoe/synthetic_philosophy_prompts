  Hey — act like you're an expert in philosophy of history and political theory, and take a breath before you answer. I want you to draft the joint statement from an adversarial collaberation between two camps who've been talking past each other for years.

  Camp A are the cyclical-structuralists: they think civilizations and regimes move through phases of social cohesion and decay, not on a rigid clock but with structural probabilities — think Khaldun's idea of group solidarity wearing out, Spengler's morphological patterns, Toynbee's challenge-and-response but with a decay bias. Camp B are the linear-path-dependentists: they think history mostly accumulates institutional problem-solving tools, reversals happen but they're contingent, and there's no built-in "aging" mechanism for societies.

  They agreed to stop arguing about everything and focus on one niche crux: whether modern welfare-state democracies facing long-term climate-driven resource contraction will show a predictable "institutional half-life" decay pattern, or whether survival is entirely a function of specific adaptive choices made in the next few decades.

  First, do a quick brainstorm: map out exactly where the biological-aging analogy breaks for institutions (no DNA, no senescence, etc.). Then produce the document.

  Part 1: Numbered agreed claims — include what they both accept about the formal structure of cyclical vs linear models, about what needs explaining (why some regimes collapse and others adapt), and any shared methodological rules (e.g., predicitions must be testable over multi-decade scales).

  Part 2: Disagreements table. Columns: the crux; Camp A's wording they accept; Camp B's wording they accept. The main cruxes should include (1) whether "institutional aging" is a real causal mechanism or a selection artifact on failed regimes, and (2) how far ecological predictions can be trusted over 50-year horizons. For each crux, name one concrete case or dataset both sides agree is relevant — maybe the comparative trajectory of the Dutch Republic's civic decay in the 1700s versus the British parliamentary system's adaptive restructuring after the Reform Act — and write each camp's specific prediction about what that case will show. No citations, no reading lists, no "see Smith 1987". Keep it focused, in the weeds but not so niche a small model can't follow. There's a typo or two in this prompt — just roll with it. Think step by step, then write.
