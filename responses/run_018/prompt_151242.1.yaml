  I recall that in grounding theory, fundamental facts are typically taken as unexplained explainers. If x and y are both fundamental, their disjunction "x or y" might simply be fundamental by inheritance - it doesn't need separate grounding because its truth is determined entirely by its fundamental disjuncts. This would make disjunctive facts involving fundamental entities unproblematic.

  The cost of rejecting this premise is that we lose a neat argument against pluralism, but we gain the ability to maintain that multiple fundamental facts can coexist without generating ungrounded disjunctions. The irreflexivity and well-foundedness of grounding remain intact, and we avoid the problematic monistic conclusion.

