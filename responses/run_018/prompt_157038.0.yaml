  Next, the intermediate position idea. Could we have local self-authorship without global self-creation? For example, if an agent could consciously modify their motives through deliberation, maybe that halts the regress for specific choices. But Strawson would counter that the tools for self-modification (values, reasoning) are themselves given, not self-created. So unless self-modification can be entirely self-generated from nothing, it doesn't solve the problem. A conceptual breakthrough in agency or empirical proof of uncaused self-alteration might help, but that seems unlikely.

  On commitments: The argument does imply that reactive attitudes like resentment are never deserved, though they might be natural. Practically, it risks fatalism, but Strawson accepts this as the cost of truth. Defenders might say moral practices can continue pragmatically without desert. The unique prediction here is that no amount of neuroscience showing "self-control" will satisfy the ultimate origin requirement—it's a deeper philosophical claim.

  For evidence: Decisive evidence would be showing that "ultimate origin" is incoherent, which would collapse the argument. Awkward evidence might be neuroscience demonstrating robust self-authorship, but Strawson could absorb it by distinguishing causation from true authorship. If we discovered beings who genuinely self-created ex nihilo, that would refute the argument, but that's impossible.

  Finally, what would change my mind? If someone proved that desert doesn't require causa sui—maybe through a new account of responsibility grounded in something else, like relational status. Or if self-origin were shown coherent and achievable. But I'm skeptical. I might be wrong in underestimating compatibilist accounts that successfully decouple responsibility from ultimacy.

