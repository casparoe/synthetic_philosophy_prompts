  First, I need to recall Strawson's argument clearly. The core is that true moral responsibility requires being causa sui (self-caused), but since everything about us is shaped by factors beyond our control (heredity, environment, etc.), we can't be the ultimate origin of our actions. This makes compatibilism a non-solution because it "changes the subject" by redefining freedom without ultimate self-origin.

  Now, breaking down the user's questions: 

