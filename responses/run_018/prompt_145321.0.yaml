answer: |-
  Here is the joint statement drafted per your specifications:

  1.  Any decision about the rules of membership in the demos inherently relies upon and presupposes a prior, logically anterior determination of who is authorised to make such membership decisions, creating a recursive legitimation problem.
  2.  The coercion-subjection camp maintains that an individual's subjection to binding, enforceable rules backed by authoritative force – including algorithmic sanctions directly impacting their rights or interests – constitutes the definitive criterion for inclusion within the demos entitled to legitimate that rule-making power.
  3.  The collective-autonomy camp holds that authentic democratic membership requires the mutual recognition of co-authorship and the practical capacity for ongoing, deliberative agency among members, which cannot be sustained if the demos encompasses all potentially affected individuals subject to enforcement.
  4.  The central crux is whether a provisional closure of the demos can be non-arbitrarily justified without circularly invoking the very authority whose legitimacy depends on that prior closure, as exemplified by the case of a transnational data governance board algorithmically enforcing access rules on global users.
  5.  The coercion-subjection camp predicts that failing to grant formal membership to users subject to the data-board's algorithmic sanctions will inevitably produce a crisis of democratic legitimacy for that body; the collective-autonomy camp predicts that granting such membership will dissolve the practical conditions for collective self-governance and render the body's democratic character unsustainable.
