prompt: |-
  Right, I'm putting together an adversarial collabration exercise for my seminar on the boundary problem — specifically who belongs to the demos when governance isn't just territorial but involves cross-border algorithmic administration, like a data-board enforcing access rules on users who never physically enter the jurisdiction. One camp takes the coercion-subjection view: if you're bound by binding sanctions and algorithmic enforcement, you're in the demos, full stop. The other takes the collective-autonomy view: membership requires shared deliberative capacity and mutual accountability, so expanding the boundary to every affected user just dissolves democratic agency.

  Draft the joint statement they'd both sign after arguing in good faith. Give me exactly five numbered points, each just a sentence or two, with no introduction or conclusion. Point 1 should state the shared formal claim about recursive legitimation — that any decision about membership rules already presupposes a prior membership decision. Point 2 should phrase the coercion-subjection camp's core disagreement in wording they would accept. Point 3 should do the same for the collective-autonomy camp. Point 4 should identify the central crux — whether provisional closure can be justified without begging the question — and name one concrete institutional case both sides agree is relevant, like that transnational data-board. Point 5 should record each camp's explicit prediction about that case, written in advance so it's not post-hoc. Use British spelling and don't include any bibliography or reading list — the point is conceptual clarity, not citation hunting.
