  Below is a complete decision tree structured around concrete cases, designed to route readers to one of ten distinct positions in the therapy-enhancement debate without relying on jargon. Each branch node presents a scenario where positions genuinely diverge. The tree uses binary choices to avoid complexity, with combinations of answers leading to leaves (positions). After the tree, I detail the leaves, including awkward commitments, and note gaps or overlaps.

  ---

  ### **Decision Tree: Where Do You Draw the Line?**  
  *Answer these 7 questions about real-world cases to discover your stance.*

  1. **Attention in a distracted world:** A drug helps sustain focus in environments with constant interruptions (e.g., smartphones, open offices), making attention "normal" for modern life but beyond pre-industrial human baselines. Is this primarily addressing a disorder?  
     - **Yes** (therapy) → Go to Q2  
     - **No** (enhancement) → Go to Q3  

  2. **Growth hormone in a shorter population:** In a country with low average height, a child with idiopathic short stature (no medical cause) is prescribed growth hormone. Is this treatment justified even if the child is within the global species-typical height range?  
     - **Yes** → Go to Q4  
     - **No** → Go to Q5  

  3. **Testosterone restoration:** A 70-year-old takes testosterone to regain their age-30 physical vitality. Is this therapy or enhancement?  
     - **Therapy** (restoring past function) → Go to Q6  
     - **Enhancement** (exceeding age norms) → Go to Q7  

  4. **Cochlear implants for Deaf culture:** A child of culturally Deaf parents receives a cochlear implant to hear. Is this intervention:  
     - **Necessary** (correcting a deficit) → **Leaf: Fair-Equality-of-Opportunity View**  
     - **Optional/Complex** (risking cultural identity) → **Leaf: Capabilities Threshold View**  

  5. **Vaccination as enhancement:** Vaccines boost immunity beyond natural human capacity. Is this fundamentally different from "natural" immunity?  
     - **Yes** (unnatural enhancement) → **Leaf: Giftedness/Openness View**  
     - **No** (preventive therapy) → **Leaf: Administrative Boundary View**  

  6. **GLP-1 for mild weight loss:** A healthy person uses diabetes/obesity drugs to lose 5kg. Is this use categorically different from treating obesity?  
     - **Yes** → **Leaf: Positional Goods View**  
     - **No** → **Leaf: Welfarist View**  

  7. **Memory damping after trauma:** A drug dampens traumatic memories post-assault. Is this more like treating injury or enhancing resilience?  
     - **Treating injury** → **Leaf: Species-Typical Function View**  
     - **Enhancing resilience** → **Leaf: Counterfactual Baseline View**  

  ---

  ### **Leaves (Positions) & Awkward Commitments**  
  1. **Fair-Equality-of-Opportunity View** (e.g., Norman Daniels)  
     *Awkward commitment:* Must accept that interventions like attention-enhancing drugs in distracting jobs are therapy—but only if they restore "normal" opportunity, not if they confer advantage.  
  2. **Capabilities Threshold View** (e.g., Martha Nussbaum)  
     *Awkward commitment:* Demands defining a fixed list of "basic capabilities" (e.g., senses, mobility), risking cultural imposition (e.g., cochlear implants for Deaf children).  
  3. **Giftedness/Openness View** (e.g., Michael Sandel)  
     *Awkward commitment:* Opposes vaccines as "unnatural" enhancements, seeing them as hubristic rejections of human finitude.  
  4. **Administrative Boundary View**  
     *Awkward commitment:* Accepts democratically drawn lines (e.g., defining obesity but not mild weight loss as "disease") that may pathologize harmless traits.  
  5. **Positional Goods View** (e.g., ethicists on arms races)  
     *Awkward commitment:* Must classify stimulants for non-diagnosed students as harmful "enhancements" purely due to competitive effects—even if they cause no direct harm.  
  6. **Welfarist View** (e.g., utilitarian perspectives)  
     *Awkward commitment:* Sees no moral difference between life-saving insulin and GLP-1 for minor weight loss; both are judged solely on cost-benefit.  
  7. **Species-Typical Function View** (e.g., Christopher Boorse)  
     *Awkward commitment:* Labels growth hormone for idiopathic short stature as enhancement if the child is within species-typical height—even in shorter populations.  
  8. **Counterfactual Baseline View**  
     *Awkward commitment:* Considers traumatic memory damping "enhancement" because it exceeds unmanipulated resilience, even if it prevents PTSD.  
  9. **Skeptical/Medicalization View** (e.g., Peter Conrad)  
     *Combination:* 1(No)→3(Enhancement)→7(Enhancing resilience)  
     *Awkward commitment:* Admits the therapy-enhancement line is arbitrary and shifts with diagnostic trends (e.g., sudden "disorders" like ADHD).  
  10. **Mismatch Repair View**  
      *Combination:* 1(Yes)→2(Yes)→4(Necessary)  
      *Awkward commitment:* Forces attention-enhancing drugs to be classified as "therapy" for modern life, rejecting species-typical baselines as irrelevant.  

  ---

  ### **Gaps, Overlaps, and Notes**  
  - **Unoccupied combinations:**  
    - 1(Yes)→2(No): *Empty* (incoherent—accepting environment-dependent disorder but rejecting it in the height case).  
    - 1(No)→3(Therapy): *Empty* (unattractive—species-typical defenders avoid calling age-related decline "therapy").  
  - **Unseparated leaves:**  
    - **Skeptical** and **Counterfactual Baseline** views both land in Q7 → "Enhancing resilience." *Separating case:* Stimulants for diagnosed vs. undiagnosed students. Skeptics see no moral difference if both are medically sanctioned; counterfactual baseline views see one as therapy (if deficiency exists) and one as enhancement.  
  - **Mismatch repair routing:** Sent to **Fair-Equality-of-Opportunity View** (via 1[Yes]→2[Yes]→4[Necessary]). *Cost:* This forces the view to prioritize environmental fit over species norms, weakening its "normal opportunity range" principle.  
  - **Counterfactual-person baseline:** Explicitly covered in **Leaf 8** and tested in Q3 (testosterone) and Q7 (memory damping).  

