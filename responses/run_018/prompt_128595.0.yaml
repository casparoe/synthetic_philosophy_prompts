  - Anticipatory directives (#2) tear at the core of identity - when does "I" stop being "me" enough for my past directive to kill future-me to hold?
  - Suffering types (#3) expose cultural biases - is existential anguish "less valid" than physical pain in assisted dying requests?
  - The palliation paradox (#4) forces confrontation: why do some reject perfect symptom control? And why must legalizing aid-in-dying not undermine palliative investment?
  - Moral residue (#5) isn't academic - it's the shaking hands of the clinician or partner after administering death.
  - Suicide boundary (#6) requires explaining why we intervene in depression but not ALS requests without stigmatizing either.

  The hardest tension flashes immediately: anticipatory directives (#2) versus present capacity requirements. If future demented self is "content," is honoring past self's directive murder? Personal identity metaphysics crash into clinical reality here. 

  I then weigh how each major ethical tradition fractures against these criteria:
