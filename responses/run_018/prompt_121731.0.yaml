  ## The Unconscious Seedling: Reconciling Thomson and Marquis in the Modified Violinist Case

  Judith Jarvis Thomson's violinist argument and Don Marquis's future-like-ours (FLO) argument stand as titans in the abortion ethics landscape, often perceived as fundamentally opposed. Thomson champions bodily autonomy, arguing that even if the fetus is a person, a woman has no obligation to sustain its life with her body. Marquis contends that killing is primarily wrong because it deprives an individual of a valuable future, a future possessed by fetuses. The critical test for consistency arises when we modify Thomson's scenario: **what if the unconscious person attached to you isn't a fully formed adult violinist, but a developing being whose only potential future is intrinsically valuable – resembling a fetus in its FLO status?** Does the right to withdraw life-support persist, or does the FLO claim fundamentally alter the nature of the harm, blocking the permissibility of disconnection? While the arguments initially seem to talk past each other, focusing on distinct harms, a deeper analysis reveals they *can* be made consistent, but this consistency significantly limits Thomson's conclusion and emphasizes the profound moral weight introduced by the FLO claim in the modified case.

  **The Core Tension: Autonomy vs. Future Deprivation**

  Thomson's violinist scenario is designed to isolate bodily autonomy. A famous violinist, rendered unconscious by illness, is plugged into your circulatory system for nine months. Disconnecting kills him. Thomson argues you have the right to disconnect, even foreseeing his death. The violinist has no *right* to use your body; your autonomy permits refusal, however tragic the outcome. The harm of death is secondary to the violation of bodily integrity. This argument readily applies to pregnancy: even granting fetal personhood, the fetus's need doesn't grant it a right to the woman's body. The violinist's past life and potential future are largely irrelevant to Thomson's core point – it's about the *present imposition*.

  Marquis's FLO argument shifts the focus entirely. Killing is wrong not primarily because it violates autonomy or causes pain, but because it annihilates a subject's future – a future containing valuable experiences, projects, and relationships like those we cherish. Fetuses, possessing such a future (assuming they are the kind of beings whose lives can contain value), are therefore wrong to kill for the same reason it's wrong to kill you or me: it robs them of their potential life. The harm lies in the *loss of future possibilities*.

  **The Modified Case: Introducing the Developing Being with FLO**

  Now, place the violinist argument into the FLO framework by modifying the attached entity: it is now an unconscious *developing being*, lacking any past experiences or consciousness but possessing a "future like ours" – its entire potential value lies ahead. This mirrors the fetus precisely in the respect Marquis emphasizes. Does Thomson's right to disconnect still hold?

  1.  **Thomson's Autonomy Persists (Initially):** The developing being remains physically dependent and attached without consent. The bodily imposition – the physical burden, risk, and loss of control – is unchanged. Thomson's core logic suggests the right to refuse this use of one's body remains fundamental. Forcing continuation violates the individual's sovereignty over their own physical self, regardless of the attached being's characteristics. The harm of *being used* is distinct.
  2.  **FLO Radically Amplifies the Harm of Killing:** However, the FLO lens fundamentally transforms the *consequence* of disconnection. Killing the original violinist deprives him of his future, but he *had* a past – a life already lived. Killing the *developing* being with FLO is different: it annihilates its *entire* potential existence. This is a unique and profound harm – the complete negation of a future that was its sole potential source of value. While the violinist's death was a tragedy interrupting an ongoing life, disconnecting the developing being prevents *any* life from occurring. The FLO claim doesn't negate the bodily imposition, but it massively increases the moral stakes of the lethal outcome.

  **Reconciling the Arguments: Consistency with Constraints**

  Thomson and Marquis *can* be consistent, but this consistency requires acknowledging that the FLO claim drastically modifies the moral calculus in the modified case, imposing significant constraints on the permissibility of withdrawal:

  1.  **Distinct Harms, Joint Consideration:** The arguments address different wrongs. Thomson identifies the wrong of *non-consensual bodily use*. Marquis identifies the wrong of *future deprivation*. Both wrongs can exist simultaneously. Disconnecting the developing being avoids the first wrong (ending the bodily imposition) but commits the second (depriving it entirely of its FLO). The moral question becomes: **Does the right to avoid bodily imposition *always* override the duty to avoid depriving a being of its entire future?** Thomson suggests yes; Marquis strongly implies no. Consistency means recognizing both harms are real and weighable.
  2.  **The Permissibility Threshold Shifts:** In the original violinist case, the harm of killing (depriving an adult of their future) is substantial, but Thomson argues the bodily autonomy violation justifies it. In the modified case, the harm of killing (depriving a being of its *only and entire* future) is arguably *maximal*. This immense harm raises the threshold for when bodily autonomy can permissibly override it. While the *right* to disconnect might technically exist (one cannot be *forced* to provide bodily support), exercising that right becomes morally far more questionable and potentially unjustifiable in many circumstances. The FLO claim doesn't "block" the right in a legalistic sense, but it morally overwhelms it in a way it does not with the adult violinist.
  3.  **The Significance of Development & Dependency:** The modified case highlights that the developing being's *total* dependency and lack of prior existence magnify the FLO harm. Its life *begins* with this dependency. This contrasts with the violinist, who existed independently before the attachment. Thomson's argument is strongest when the dependency is an *imposed interruption* of an independent life. When the dependency *constitutes the entire existence* of a being with FLO, refusing support doesn't just end a life; it prevents one from starting, making the autonomy claim seem comparatively less compelling against the sheer magnitude of lost potential.

  **Conclusion: Consistency with Moral Gravity**

  Thomson's violinist argument and Marquis's FLO argument do not inherently talk past each other. They can be rendered consistent by acknowledging they identify different, co-occurring moral harms: the violation of bodily autonomy and the deprivation of a valuable future. However, applying both arguments rigorously to the modified case of the attached developing being with FLO reveals a crucial asymmetry. While the bodily autonomy violation remains significant, the harm inflicted by killing – the complete annihilation of a being's *only* potential future, the very future that grants it moral status under FLO – is uniquely profound. This immense harm fundamentally changes the moral landscape.

  Therefore, while the *theoretical right* to withdraw life-support based on bodily autonomy might persist, the FLO claim drastically elevates the moral cost of exercising that right in this specific scenario. It doesn't negate the autonomy claim, but it morally eclipses it to such a degree that disconnection becomes exceptionally difficult to justify. The arguments are consistent, but their synthesis in the modified case demonstrates that the FLO argument imposes a severe, often decisive, moral constraint on Thomson's permissibility conclusion. The right to refuse bodily use remains, but the act of exercising it against a being whose entire valuable future depends solely on that use becomes a grave moral wrong, far exceeding the wrong in the original violinist scenario. The developing being's future-like-ours doesn't block the right in principle, but it morally overwhelms its permissibility in practice.
