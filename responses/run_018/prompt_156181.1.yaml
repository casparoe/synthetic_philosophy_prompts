prompt: |-
  I'm drafting a conceptual framework for my comparative political ethics dissertation on corruption judgments across bureaucratic and electoral contexts. I need a taxonomy—structured as a decision tree with branch nodes that are concrete diagnostic questions—to classify positions on whether clientelism and ritual gift-giving constitute corruption, especially where Western secular-administrative norms are treated as contested rather than default.

  Build the tree from logical space, not from named schools. Start with a first split between applying institutional-role norms (impartiality, rule-bound office) versus relational-moral norms (reciprocity, loyalty, gratitude). Then branch on: whether the exchange is discrete and transactional or open-ended and relational; whether cultural context determines the moral status of the act or merely explains it without excusing it; and whether Western bureaucratic standards are universally binding or one locally legitimate institutional form among others.

  Each leaf should correspond to one of these positions—label it with its standard name if one exists, otherwise mark it unnamed: (a) Western legalist universalism; (b) thick cultural relativism; (c) institutional functionalism that permits clientelism if it sustains representation; (d) relational-ethics defense of gift-giving as non-corrupt loyalty; (e) hybrid contextual universalism that distinguishes public office from private reciprocity. Note any unoccupied logical combinations and briefly diagnose whether each gap is incoherent, unattractive, or merely unexplored.

  Flag any pair of leaves your tree cannot cleanly separate—particularly where functionalist and relational-ethics arguments overlap—and specify what further question would split them. Phrase every node so that a respondent could answer it without already knowing which position it leads to. Do not include bibliographies, reading lists, or citations; keep the instrument conceptual rather than empirical, with approximately five to six leaves and three levels of branching.
