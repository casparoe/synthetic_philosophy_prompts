prompt: |-
  I'm a novelist applying for a 6-month interdisciplinary fellowship and I need a short proposal — about two pages — turned into proper form. My half-baked idea: Hacking's looping effects say psychiatric labels change the people they classify, mostly through self-awareness and behavior shift. But I think there's a second loop running through the narrative structure of the diagnostic interveiw itself — clinicians ask questions in a story-shaped order (onset, then crisis, then dysfunction) and patients loop into fitting that plot rather than just adopting a label. Take the recent medicalization of prolonged grief: the protocol imposes a temporal plot, and people reshape their experience to match the hearable story. Is this "narrative-looping" a real subtype of Hacking's interactive kind, or just standard looping with narrative decoration?

  Turn this into a proposal with: a precise question that has a yes/no/maybe answer; why existing Hacking-style accounts leave it open (they discuss self-labeling and social reaction but don't separate narrative mediation by the instrument from direct self-concept change); a realisic month-by-month method for conceptual/archivel work — no clinical trials, I'm comparing published interview protocols with first-person patient accounts to map where the plot structure does the work; what a result looks like (maybe a three-part taxonomy: direct loop, narrative-mediated loop, hybrid) and what counts as failure (if narrative mediation collapses into standard looping and does no independent explanatory work); an honest scope check for six months; and one paragraph arguing why this matters for diagnosis design, not just philosophy navel-gazing. Don't include citations or a bibliography, I'll fill those in myself. Keep the tone casual — I'm not a grant writer — and it's fine if there's a typo or two in there.
