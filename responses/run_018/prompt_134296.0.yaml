  i've been trying to map my roommate's ethics about dramatizing dead people and her verdicts seem pretty consistent but i can't tell what rule she's actually running. she hated that one Turing movie for inventing a straight romance since it erases his documented orientation; she's totally fine with merging several real NASA computers into one composite character for narrative flow; she said the Sylvia Plath film was wrong to show the suicide in graphic detail even though the event is documented; she liked that Curie biopic that used her actual letters to imagine an inner voice; and she thinks inventing a secret love affair for a dead activist with zero historical basis is just using the dead for drama. 

  now there's this proposed miniseries about Emmy Noether. they want a scene where she solves a theorem in a bath, basically borrowing the Archimedes eureka moment and applying it to her life as a visual metaphor, and they also want a deathbed scene where she asks for her brother with regret about estrangement - in the script this directly contradicts family letters the filmmakers themselves consulted, which show they were reconciled, though the director claims it gets at an emotional truth about isolation. based on her track record, do you think she'll approve the project, reject it, or split the difference? i'm less interested in her actual answer than in laying out the competing principles that could generate her earlier verdicts - maybe one about never contradicting the documentary record vs one about avoiding sensationalism of private suffering but allowing dignified emotional invention. say what each rule predicts about the Noether proposal, which one her pattern actually supports, and what hypothetical case would actually split them apart - like maybe a documented private grief shown gently versus a false but dignified private moment. also which of her earlier cases is the closest analog?
reasoning: |-
