prompt: |-
  hey so i'm not in academia or anything, just been arguing about right and wrong with friends. i keep seeing this move: someone states a moral rule like "lying is always wrong" or "you shouldn't hurt people," and then when a clear exception comes up they don't drop the rule or say it has limits—they just redescribe the action so it doesn't count anymore. like "that wasn't lying, it was protecting," or "that wasn't hurting, it was medical care." the rule stays untouched but the thing being judged gets renamed. is there a name for this? i know about particularism vs generlism but this isn't that—it's not context changing the morality, it's the description sliding around to save the rule. can you name and define it, say how it's different from particularism and from just making excuses, and whether philosophers have talked about it?
reasoning: |-
  Okay, the user is describing a specific argumentative tactic they've noticed in moral discussions. They want to know if there's a name for this phenomenon where people redefine actions to fit absolute moral rules rather than admitting exceptions. 

  Hmm, this is actually quite sophisticated for someone "not in academia." The user has clearly observed something real and nuanced in ethical reasoning. They've even correctly distinguished it from moral particularism and excuse-making. 

  Let me unpack this. The core pattern is: 
  1. Someone states an absolute moral principle (no lying ever)
  2. A counterexample appears (lying to protect Jews from Nazis)
  3. Instead of modifying the principle, they redefine the action ("that's not lying, it's protecting")

  The user is right - this isn't particularism because particularism rejects fixed rules altogether. And it's not mere excuse-making because it's more systematic. 

  I recall this is essentially "descriptive moral evasion" or what Bernard Williams called "one thought too many." The person is so committed to the rule's purity that they distort reality to preserve it. It's related to rule worship in deontology. 

  The tricky part is explaining why this matters. The user seems frustrated by the intellectual dishonesty, but there's deeper significance: this evasion prevents moral growth. By never confronting rule-exceptions, we avoid refining our ethics. 

  I should mention Philippa Foot's trolley problem variations too - she showed how we instinctively reframe "killing" as "redirecting harm" to feel better about it. That's exactly what the user noticed. 

  The user might also appreciate knowing this isn't just philosophers' hair-splitting. In real life (medical ethics, wartime decisions), how we define actions has concrete consequences. 

  I'll structure the response to: 
  - Name the phenomenon 
  - Contrast with particularism/excuses 
  - Show why philosophers care 
  - Suggest why it's problematic 

  Better avoid jargon though - the user prefers plain language. And I'll validate their sharp observation upfront.
answer: |-
  That's a sharp observation – and yes, philosophers *have* extensively discussed this maneuver. It's a tricky but common way to preserve absolute moral rules. Here's the breakdown:

  1.  **The Name(s):**
      *   **Descriptive Moral Evasion:** This is a general term for re-describing an action to avoid applying a moral rule or judgment.
      *   **Conceptual Re-description / Definitional Maneuver:** Highlighting the specific tactic of changing the *conceptual category* of the action.
      *   **Rule-Preserving Redescription:** Emphasizes the goal of keeping the rule intact.
      *   **Moral Casuistry (in a specific sense):** Casuistry is case-based reasoning, but it gets a bad name when it involves overly clever or disingenuous re-description to avoid rules. This tactic fits that negative stereotype.
      *   **Related to "One Thought Too Many" (Bernard Williams):** While not identical, Williams criticized an overly rule-bound morality where an agent spends "one thought too many" justifying an intuitively right action (like saving a spouse) by forcing it to fit an abstract rule, rather than acting from direct moral feeling. Redescription can be part of that excessive justification.

  2.  **Defining the Tactic:**
      It involves **redefining or re-categorizing a concrete action to fit within the boundaries of an absolute moral rule, thereby avoiding the need to acknowledge an exception to the rule.** The rule itself remains inviolate and absolute; the *description of the world* is altered to make the action compatible with it.

  3.  **How it's Different from Particularism:**
      *   **Particularism (e.g., Jonathan Dancy):** Claims moral reasons are fundamentally context-dependent. There are *no* invariant moral rules. What counts as a reason for or against an action (like lying) can change drastically depending on the specific situation. Lying *might* be wrong in one context but permissible or even obligatory in another, and this is because the *moral valence* of the act itself changes with context.
      *   **Descriptive Evasion:** **Presupposes invariant, absolute rules.** It *doesn't* claim the rule's application depends on context changing the moral weight. Instead, it denies that the problematic action *falls under the rule's description at all*. The rule "Lying is always wrong" stands unchallenged; the evasion happens by denying that the action in question (e.g., misleading a murderer) is *properly called* "lying" in the morally relevant sense. Context changes the *label*, not the rule's scope or the act's inherent moral properties (according to the rule-absolutist).

  4.  **How it's Different from Making Excuses:**
      *   **Making Excuses:** Typically acknowledges that the action *did* violate the rule ("Yes, I lied/hurt them...") but argues there were mitigating factors or overriding reasons that lessen blame or make the violation understandable or even justified. It accepts the initial description and the rule breach.
      *   **Descriptive Evasion:** **Denies the rule was ever breached.** By re-categorizing the action ("It wasn't *really* lying/harming"), it claims the rule simply doesn't apply to this case. There's nothing to excuse because no transgression occurred under the correct description. It avoids the need for justification by changing the terms.

  5.  **Why Philosophers Talk About It (and Critique It):**
      *   **Defending Rules:** Proponents of absolute rules (like some Kantians or Divine Command theorists) *need* strategies like this to handle counter-examples without abandoning absolutism. They argue for precise definitions.
      *   **Exposing Rule Absolutism's Problems:** Critics (including many consequentialists, virtue ethicists, and particularists) point to this tactic as evidence that strict rule absolutism is flawed:
          *   **Intellectual Dishonesty:** It often seems like a linguistic trick to avoid admitting the rule isn't absolute. ("If it looks like lying, sounds like lying, and has the effect of deception... calling it 'protective speech' doesn't change its fundamental nature").
          *   **Distorts Reality:** It can force unnatural or overly narrow definitions of concepts like "lying," "killing," or "harming" that don't match common understanding or the morally relevant features of the act.
          *   **Avoids Moral Complexity:** Instead of grappling with the genuine conflict between rules or the contextual nuances that make an action right or wrong, it sidesteps the issue by redefinition.
          *   **Undermines Rules:** If the definition of the prohibited act becomes too convoluted or context-dependent to reliably identify, the rule itself becomes practically useless or loses its moral force. (When *exactly* does "false speech" stop being "lying" and become "protecting"?)
      *   **Philippa Foot & Trolleyology:** Her work on the Trolley Problem highlights how subtle differences in description (e.g., "diverting a threat" vs. "using someone as a means") can trigger different intuitions and moral rules, showing how fragile absolute rule applications can be and how easily description can be manipulated.
      *   **Bernard Williams:** His critique focused on how an obsession with rule-fidelity can alienate us from authentic moral responses and relationships.

  **In essence:** You've identified a common defense mechanism for moral absolutism – **Descriptive Moral Evasion** or **Rule-Preserving Redescription**. It protects the rule by creatively redefining actions that seem like exceptions, rather than admitting the rule has limits or that context changes the moral landscape itself (as Particularism claims). It differs from making excuses by denying the rule violation occurred at all. Philosophers discuss it both as a necessary tool for some theories and as a major weakness revealing the implausibility of strict moral absolutes in a complex world. Your friends are engaging in classic (and often problematic) philosophical maneuvering!
