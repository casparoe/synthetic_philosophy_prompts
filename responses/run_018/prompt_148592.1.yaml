  ## The Ontological Imperative of Structural Resonance in Analogical Figure-Ground Judgment

  In the microdomain of analogical figure-ground judgment, where classification hinges solely on relational structure (containment, adjacency) rather than perceptual salience, conceptual slippage is not a failure of boundary enforcement but the inherent mechanism by which the concept extends its domain while preserving its identity. This slippage becomes ontologically necessary and legitimate when confronting borderline cases—regions possessing canonical structural relations (e.g., containing sub-regions, being adjacent to potential figures) but lacking typical perceptual cues like contrast or closure. The safeguard against arbitrariness lies in a **structural resonance threshold**: a minimal density of mutually reinforcing relational correspondences that allows the concept to "stretch" coherently, anchoring extension in the concept's intrinsic relational logic rather than external prototypes or probabilities.

  **Why Boundary Enforcement Fails in the Microdomain:**
  The core function of figure-ground distinction here is *structural parsing*, not perceptual segregation. A rigid boundary presupposes a fixed set of necessary and sufficient conditions derived from canonical examples. However, in borderline cases:
  1.  **No single relation is decisive:** A region might contain a sub-region (a figure-like relation) but be itself contained ambiguously. Adjacency might exist without clear directional bias.
  2.  **Relations are context-dependent:** The significance of "containment" shifts depending on what it contains and what contains it; adjacency gains meaning from the entities it connects.
  3.  **Fluidity is inherent:** The microdomain's ontology is one of *potential figures* defined relationally. Insisting on fixed boundaries would arbitrarily exclude structurally valid cases simply because they lack perceptual prominence, misidentifying the concept's essence (relational structure) with its typical manifestation (salient form).

  **Conceptual Slippage as Mechanism:**
  Slippage—the controlled relaxation of criteria—is the concept's mechanism for navigating this relational landscape. It allows a region with weak perceptual cues to be recognized as a figure *if* its relational configuration sufficiently echoes the structural logic defining "figure-ness":
  *   It might possess multiple, interlocking containment relations (e.g., A contains B, and B contains C, suggesting A is a figure).
  *   Its adjacency relations might form a coherent pattern relative to other potential figures (e.g., A is adjacent to B, B is adjacent to C, and C is contained by D, positioning A within a relational network typical of figures).
  *   The *pattern* of relations, not any single instance, begins to resonate with the structural schema abstracted from canonical figures.

  **The Structural Resonance Threshold:**
  This slippage is legitimate *only* when it crosses the **structural resonance threshold**. This threshold is the minimal density and coherence of relational correspondences required for the concept to maintain its identity during extension. It operates as an ontological filter:

  1.  **Blocks Accidental Similarities:** A single, isolated relational correspondence (e.g., one instance of containment) is insufficient. Arbitrariness arises from *sparse coincidences*. Resonance requires a **critical mass of interlocking relations** where correspondences *mutually constrain* and *reinforce* the interpretation. For example:
      *   **Failure (Below Threshold):** Region X contains a small dot. This single containment relation, isolated and lacking connection to other structural features (e.g., ambiguous adjacency, lack of internal structure), is easily dismissed as accidental. It could equally be a speck *on* the background.
      *   **Success (Above Threshold):** Region X contains sub-region Y (which itself has a distinct, though faint, internal adjacency structure), is adjacently surrounded by regions exhibiting consistent directional bias *away* from X, and shares a congruent orientation pattern with a canonical figure elsewhere in the scene. Here, the *density* (multiple relations: containment, internal structure of Y, external adjacency pattern, orientation congruence) and their *mutual coherence* (they form a consistent structural narrative positioning X as a figure) create resonance. The relations aren't independent facts; they form a cohesive, interdependent network characteristic of "figure-ness." An accidental similarity cannot replicate this dense, coherent network of constraints.

  2.  **Preserves Concept Identity:** The threshold ensures that extension doesn't dissolve the concept into meaninglessness. By demanding a dense, coherent network of canonical relations, it guarantees that the extended case still **operationalizes the core structural function** of the figure-ground distinction within the microdomain: parsing the scene into entities (figures) defined by their relational roles (containing, being bounded, having "insideness") against a background defined by relational absence or passivity. The resonant structure *enacts* this functional role.

  3.  **Anchored in Relational Logic, Not Prototypes:** The threshold doesn't measure distance from a central example. Instead, it assesses whether the *web of relations* in the borderline region achieves a density and internal consistency comparable to the *relational logic* inherent in the concept itself. It asks: "Does this configuration of containments and adjacencies form a structurally cohesive unit that *performs the relational work* of a figure?" The resonance is between the specific relational structure of the candidate region and the abstract relational schema defining the concept.

  **Conclusion:**
  Within the ontology of analogical figure-ground judgment—a domain defined purely by relational structure—conceptual slippage across borderline cases is not epistemic failure but ontological necessity. The concept extends its reach precisely through controlled slippage, enabled by structural resonance. This resonance threshold, demanding a minimal density and coherence of mutually constraining relational correspondences, is the ontological safeguard. It permits legitimate extension by ensuring the candidate region's relational structure is sufficiently rich and integrated to *instantiate the core functional role* of a figure within the relational system, while rigorously excluding arbitrary matches based on sparse, incoherent, or coincidental similarities. Fluidity is thus not a bug, but the essential feature allowing the concept to navigate its structurally defined world.
