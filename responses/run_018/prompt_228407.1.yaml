                                                             Cost: Preferences filtered by liberalism; hard to observe/operationalize.
  ```

  ---

  **Key Notes**  
  - **Logical Gaps**: 
    - Path Q1(No)→Q4(Outcomes)→Q5(No)→Q6(No) leads to **Gibbard**, but Gibbard assumes rights are personal (contradicting Q1). This path is *incoherent* and excluded.  
    - Q7(No) (rights never cause Pareto dominance) is *unexplored*—rights as actions usually allow Pareto dominance in games.  
