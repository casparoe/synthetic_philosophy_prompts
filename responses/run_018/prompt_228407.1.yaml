  **Decision Tree: Escaping the Liberal Paradox**

  ```
  START
  │
  └─Q1: In the Prude/Lewd case (states: P reads, L reads, neither), should society's ranking of {P reads, neither} depend ONLY on Prude's preferences (not Lewd's)?
     │
     ├─Yes (Rights are personal) ────┐
     │                              Q2: Should Lewd's preference about Prude's reading affect social welfare when aggregating?
     │                              │
     │                              ├─Yes (Others' choices matter for welfare) ──Q3: Can individuals waive/trade their decisiveness? (e.g., Prude "sells" his right to block L reading)
     │                              │   │
     │                              │   ├─Yes ──────────── Leaf 1: **Gibbard's Alienable Rights**  
     │                              │   │     Cost: Trades may force vulnerable people into Pareto-dominated outcomes.
     │                              │   │
     │                              │   └─No ───────────── Leaf 2: **Bite the Bullet (Impossibility)**  
     │                              │          Cost: Reject one axiom (ML/WP/UD); theory remains incomplete.
     │                              │
     │                              └─No (Only own-actions matter) ───────────── Leaf 3: **Restricted Pareto (No Meddling)**  
     │                                        Cost: Weak Pareto only applies to non-meddlesome preferences (ignores altruism/hatred).
     │
     └─No (Society aggregates all preferences) ─┐
                                               Q4: Should rights constrain social OUTCOMES (e.g., "L reads" vs. "neither") or ACTIONS (e.g., Lewd's choice to read/not read)?
                                               │
                                               ├─Outcomes ────────────────Q5: If Lewd prefers P reads > neither, but society chooses "neither" via rights, is this acceptable?
                                               │   │                     (i.e., rights override aggregated preferences)
                                               │   ├─Yes ──────────────── Leaf 4: **Nozick's Procedural Rights**  
                                               │   │     Cost: Rights as side constraints; may yield intransitive or Pareto-inferior outcomes.
                                               │   │
                                               │   └─No ────────────────Q6: Should rights be immune to trades? (e.g., Prude cannot "veto" L reading even if Lewd consents)
                                               │       │
                                               │       ├─Yes ─────────── Leaf 2: **Bite the Bullet (Impossibility)**  
                                               │       │     Cost: As above.
                                               │       │
                                               │       └─No ──────────── Leaf 1: **Gibbard's Alienable Rights**  
                                               │              Cost: As above.
                                               │
                                               └─Actions ───────────────Q7: Can exercising a right (e.g., Lewd choosing to read) create a Pareto-dominated outcome?  
                                                   │                    (e.g., both prefer P reads > L reads, but Lewd "strategically" chooses L reads)
                                                   ├─Yes ─────────────── Leaf 5: **Game-Form Rights**  
                                                   │     Cost: Rights as action control; outcomes depend on strategy (Nash inefficiency possible).
                                                   │
