  2. **Bite the Bullet**: Accept impossibility. Cost: Theory collapse; no full liberal-welfarist aggregation.  
  3. **Restricted Pareto**: Weak Pareto only for non-meddlesome prefs. Cost: Ignores legitimate preferences (e.g., Prude's concern for Lewd).  
  4. **Nozick's Procedural Rights**: Rights as side constraints. Cost: Social ordering may be intransitive/Pareto-inferior.  
