  Below is a decision tree for escaping Sen's liberal paradox, formatted as a flowchart for a one-page printout. It meets your constraints: 7 branch nodes (concrete questions, using the Prude/Lewd case in two nodes), 7 leaves (named resolutions with costs), and flags for logical gaps and embarrassing intuitions. The tree is built from the logical space of possible resolutions, with notes on coherence and distinctions.

