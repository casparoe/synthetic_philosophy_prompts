answer: |-
  ### Analysis of Harm Scenarios Based on Proposed Principle

  **Proposed Principle**: The **Instrumental Agency Principle**  
  **Core Claim**: Harm is permissible only if:  
  1. **It is not intended as a means or end** (merely foreseen),  
  2. **The victim is not instrumentally used** (body, identity, or agency is not co-opted as a tool), and  
  3. **The act does not bypass the victim's agency** (e.g., exploiting personal attributes without consent).  

  This principle distinguishes between "collateral damage" (side effects) and "instrumentalization" (using someone as a tool), explaining cases where double effect alone fails (e.g., drone/access-code cases).

  ---

  ### Scenario Analysis Table
  | Scenario                                      | My Verdict      | Principle Verdict | Match? | Notes on Discrepancy |
  |-----------------------------------------------|-----------------|-------------------|--------|----------------------|
  | Trolley switch (divert to 1)                 | Permissible     | Permissible       | Yes    | Harm is unintended side effect; no instrumental use. |
  | Push big guy off bridge                      | Not permissible | Not permissible   | Yes    | Harm is intended means (violates 1); body used as tool (violates 2). |
  | Surgeon harvests organs                      | Not permissible | Not permissible   | Yes    | Harm is intended means (violates 1); body used as resource (violates 2). |
  | Pain meds hasten death                       | Permissible     | Permissible       | Yes    | Harm is unintended side effect; no instrumental use. |
  | Airstrike kills civilians                     | Permissible     | Permissible       | Yes    | Harm is unintended side effect; no instrumental use. |
  | Drone redirect via biometrics                | Not permissible | Not permissible   | Yes    | Worker's identity used as tool (violates 2, 3); harm is direct result of instrumentalization. |
  | Factory override with access code            | Undecided       | **Not permissible** | No     | Access code co-opts employee's agency (violates 3); harm is direct result of bypassing consent. |
  | Antibiotic triage (save 5, withhold from 1) | —               | **Permissible**   | —      | Harm is side effect of allocation (not act-caused); no instrumental use (see JSON). |

  **Key Discrepancy**:  
  - **Factory Override**: Your undecided verdict must be overturned to **Not permissible** for coherence. The access code instrumentalizes the employee’s agency (clause 3), akin to the drone case. If you intuitively lean toward permissibility, consider whether you prioritize numbers over agency constraints.

  ---

  ### Principle Summary (JSON)
  ```json
  {
    "principle_name": "Instrumental Agency Principle",
    "core_claim": "Harm is permissible iff (1) it is foreseen but not intended as a means/end, (2) the victim is not instrumentally used (body/identity/agency as tool), and (3) the act does not bypass the victim's agency (e.g., via non-consensual co-option of personal attributes).",
    "clauses_with_case_motivation": {
      "clause_1": "Motivated by Bridge Push (intended harm) vs. Pain Meds (unintended harm).",
      "clause_2": "Motivated by Organ Harvest (body as resource) vs. Airstrike (no instrumental use).",
      "clause_3": "Motivated by Drone/Factories (using identity/access as tool without consent)."
    },
    "verdict_i_had_to_drop": "Factory Override (must be 'not permissible' to align with Drone case and clause 3).",
    "predictions_for_unlisted_cases": {
      "antibiotic_triage": "Permissible: Harm is a side effect of resource allocation (not act-caused); no instrumental use (clause 2/3 irrelevant). Withholding treatment ≠ exploiting agency.",
      "self_sacrifice_variant": "Not permissible if forced: E.g., coercing someone to donate organs violates clause 2-3, even if they 'consent' under duress."
    }
  }
  ```

  ### Notes:
  - **Antibiotic Triage**: Permitted because harm arises from omission (withholding treatment), not an act causing direct harm. No agency/identity is exploited.
  - **Coherence Trade-off**: The Factory Override verdict is the price of coherence—clause 3 ensures consistency between Drone/Factory cases.
  - **Strength**: This principle explains all your firm verdicts and resolves your uncertainty in Factory/Drone cases by emphasizing agency violations.
