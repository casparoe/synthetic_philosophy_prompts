  Hmm... the user specifically wants me to avoid religious aspects. That means no scriptures, no primary sources, no metaphysical rebirth discussions. The focus should be purely on karma as a structural claim about moral proportionality. Interesting challenge - making this accessible without the traditional religious framing.

