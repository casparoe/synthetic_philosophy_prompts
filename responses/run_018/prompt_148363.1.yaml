  I should pay special attention to predictable misconceptions. Students might confuse karma with determinism (denying agency) or see it as cosmic revenge. Need to build in points where these are explicitly addressed - perhaps during the differentiation from fate and when discussing proportionality.

  For the check question, something simple but revealing: "Does karma mean good people always get rewarded and bad people punished?" A yes would show they're missing the proportionality aspect. The answer should emphasize how moral conditions naturally flow from actions without being "rewards/punishments."

