  The restorative justice framework in the carrying example is clever - it demonstrates how someone's social standing gets reshaped by past actions without any divine administrator. That should make the abstract concept tangible. I'll position it as a "does this capture the logic?" question to prompt critical thinking.

  Timing will be tight for 50 minutes. Need crisp transitions: maybe 15 min on desert/foundations, 10 on distinctions, 15 on example, 10 on misconceptions. The check question slots nicely into the proportionality discussion when addressing the revenge misconception.

  This approach should meet all requirements: secular, structural, misconception-aware, with clear dependencies. The carrying example is the linchpin - if that lands, the whole framework clicks.
answer: |-
  ### Conceptual Dependency Brainstorm
  1. **Moral Desert Foundation**: Students must grasp *desert* as a normative concept (actions intrinsically merit certain outcomes) before analyzing karma’s claim of systematic desert.  
  2. **Causal vs. Retributive Frameworks**: Distinguish naturalistic *causation* (A leads to B via impersonal forces) from intentional *retribution* (punishment imposed by an agent).  
  3. **Agency Preservation**: Establish that moral responsibility requires free will *before* showing karma’s compatibility with agency (to preempt determinism misconceptions).  
  4. **Non-Supernatural Mechanisms**: Familiarity with social/psychological systems (e.g., trust erosion from lying) allows karma to be modeled without metaphysics.  

  ---

  ### 50-Minute Teaching Plan: **Karma as Secular Moral Structure**  
  **Objective**: Students articulate karma as a theory of *proportional moral causation* devoid of supernaturalism.  
  **Exclusions**: No scriptures, rebirth metaphysics, or primary texts. Minimal structural assumption: "Past actions shape present conditions."  

  #### Sequence & Timing  
  **I. Moral Desert & Its Problems** (12 min)  
  - **Hook (2 min)**: "If someone saves a child from drowning, do they *deserve* gratitude? What if they later commit fraud?"  
  - **Core Concepts (5 min)**:  
    - Define *moral desert*: Outcomes (e.g., trust, isolation) intrinsically tied to moral quality of actions.  
    - Problem: How can desert operate systematically without divine judge? (Seed skepticism.)  
  - **Check (5 min)**: *"Can desert exist without a 'deserver' (e.g., God)? If yes, how?"* (Highlight natural consequences: e.g., kindness → social support.)  

  **II. Distinguishing Karmic Causation** (10 min)  
  - **Contrast 1: Legal Punishment (4 min)**:  
    - Legal: External, human-administered, rule-based.  
    - Karmic: *Impersonal*, inherent in action’s moral structure (e.g., betrayal → broken relationships *as direct outcome*).  
  - **Contrast 2: Deterministic Fate (6 min)**:  
    - Fate: Fixed future, no agency.  
    - Karma: *Agency-critical*—your present choices shape future conditions.  
    - **Preemptive Strike**: "Karma requires freedom—you *can* act otherwise, but your past limits *current opportunities*." (Heads off determinism misconception.)  

  **III. Concrete Example: Restorative Justice Framework** (15 min)  
  - **Case Study (10 min)**:  
    - *Scenario*: Alex commits corporate fraud → reputation ruined, career lost. After restitution, they rebuild trust via transparency over years.  
    - *Analysis*:  
      - Past moral failure (fraud) → degraded social capital (present condition).  
      - Moral repair (restitution + transparency) → restored opportunities (future condition).  
    - **Key Question**: "Does this capture karma? Where’s the ‘mechanism’?" (Guide to *social dynamics*: trust networks, psychological responses.)  
  - **Link to Karma (5 min)**:  
    - Mechanism = Cumulative impact of actions on relational/social structures.  
    - **Proportionality Check**: *"Is Alex’s suffering ‘punishment’ or the natural cost of rebuilding trust?"* (Targets reward/punishment misconception.)  

  **IV. Misconception Map & Resolution** (13 min)  
  - **Predictable Errors**:  
    - **Misconception 1**: "Karma = fatalism." *Addressed in Step II* (agency contrast).  
    - **Misconception 2**: "Karma = cosmic revenge." *Addressed via proportionality check in Step III*.  
  - **Deep Dive: Cosmic Revenge vs. Proportionality (8 min)**:  
    - Revenge: Focus on suffering as payback.  
    - Karma: Focus on *moral equilibrium*—harmony disrupted by vice, restored by virtue (e.g., dishonesty → isolation; honesty → inclusion).  
    - **Crucial Nuance**: "Karma isn’t ‘you stole so you’ll suffer’—it’s ‘stealing corrodes the bonds your well-being relies on.’"  
  - **Synthesis (5 min)**: Karma as *structural moral ecology*: Actions alter one’s position within interdependent systems (social, psychological).  

  ---

  ### Dependency Rationale  
  - **Desert first** → Establishes normative bedrock for evaluating karma’s claim.  
  - **Causal distinctions second** → Prevents conflation with irrelevant models (fate/law).  
  - **Example third** → Grounds abstraction in relatable mechanism *after* foundations.  
  - **Misconceptions last** → Corrects distortions only when students grasp core logic.  

  **Check Question**: *"Does karma mean good actions always lead to happiness and bad ones to suffering?"*  
  - **Target Misconception**: Reward/punishment framing.  
  - **Correct Understanding**: Karma describes *proportional moral conditions* (e.g., compassion → relational security; greed → isolation), not transactional outcomes. Suffering may spur moral growth; "success" may mask moral decay.
