prompt: |-
  I'm planning a ninety-minute seminar for advanced undergraduates in environmental philosophy, and I want to structure the session around the ethics of space colonization—specifically the tension between preservationist obligations toward extraterrestrial environments and the argument that humanity carries a kind of survival imperative to become multi-planetary. Rather than treating this as a simple cost-benefit problem, I want the seminar to turn on a more structural difficulty: the non-identity problem applied to potential future Martian-born generations. If we terraform Mars and thereby create the conditions for an entirely different set of people to come into existence, in what sense can those future people be said to have been wronged by our decision, and does that dissolve the moral urgency of preservation?

  Please don't explain the ethical theories to me directly; instead, plan the explanatory arc for the students. What conceptual dependency has to be firmly in place—perhaps a distinction between intrinsic and instrumental value applied to non-terrestrial entities, or a clear framing of intergenerational justice—before the preservation-versus-expansion tension registers as genuinely philosophical rather than merely technological? Which single carrying case should anchor the discussion: the terraforming of Mars against the possibility of indigenous microbial life, a hypothetical permanent settlement of Europa's subsurface ocean, or a closer analog like Antarctic research stations versus sovereign settlement, and what must that example include and exclude to keep the conceptual pressure visible? In what sequence will the students likely raise objections—perhaps first that Earth is already uninhabitable so departure is obligatory, then that barren landscapes have no moral standing, then that future colonists would retrospectively endorse the choice—and at precisely which point in the arc should each objection be absorbed rather than deferred? I anticipate they will misunderstand the non-identity problem by conflating "no specific person is made worse off" with "no harm occurs at all"; where in the sequence should I head that misconception off, and what related confusion about counterfactual identity should I anticipate next? Finally, what one check—whether a targeted question, a brief written exercise, or a structured debate—would reveal whether they have grasped that the difficulty is structural and not resolvable by simply weighing human survival against geological preservation, and what should I explicitly leave unresolved or refuse to settle at this undergraduate level?
reasoning: |-
  Okay, the user is planning a 90-minute seminar for advanced undergrads in environmental philosophy, focusing on the ethics of space colonization. They want to center the discussion on the tension between preserving extraterrestrial environments and humanity's survival imperative, specifically through the lens of the non-identity problem. 

  Hmm, this is a sophisticated request. The user clearly knows their stuff—they're not asking for Ethics 101 explanations but rather a carefully structured pedagogical arc. They're anticipating student misconceptions and want strategic sequencing. I should avoid spoon-feeding theory and instead design conceptual stepping stones.

  First, I need to identify the core dependency: the students must grasp why this isn't just a tech optimization problem. The key is establishing that non-Earth entities could have intrinsic value independent of human use. Without that, preservationism collapses into mere resource management. 

  For the anchoring case, Mars terraforming works best—it's concrete but still hypothetical. I'll exclude economic/feasibility debates to maintain philosophical pressure. Must emphasize: microbial life as potential intrinsic value bearer vs. terraforming creating new humans who couldn't otherwise exist.

  Ah, the user predicted three likely objections. Good. I'll sequence them deliberately: 
  1. "Earth is dying" → absorb early by distinguishing necessity from permissibility
  2. "Barren landscapes don't matter" → challenge by examining value sources
  3. "Future colonists would thank us" → save for non-identity climax

  Biggest trap: students equating "no specific person harmed" with "no harm done." Need to preempt that when introducing the non-identity problem. Could use a quick poll: "If I choose Policy A over B, creating different future people, does that mean Policy A harmed no one?" 

  Final check: a thought experiment forcing them to see the structural deadlock. Maybe: "Can both preservationists and expansionists coherently claim to act for future generations?" No resolution possible—that's the point. End with the tension unresolved; undergrads should sit with the discomfort.
answer: |-
  Here’s a structured seminar plan prioritizing conceptual progression, anticipated objections, and pedagogical checks, tailored to your goals:

  ---

  ### **Explanatory Arc & Key Dependencies**
  1. **Foundation: Intrinsic Value Beyond Earth**  
     - *Entry Point:* Contrast "preservation for human use" (instrumental) vs. "preservation for its own sake" (intrinsic). Use **Antarctic Treaty System** as an analog:  
       - *Include:* Its ban on sovereignty/mining to protect "intrinsic value of wilderness."  
       - *Exclude:* Geopolitical details; focus solely on the ethical framing of non-instrumental value.  
     - *Why this first?* Without establishing that non-terrestrial entities *could* possess intrinsic value, preservationism defaults to human interests, collapsing the tension.  

  2. **Bridge: Intergenerational Justice Scope**  
     - Reframe preservation vs. expansion as competing obligations:  
       - To *possible future humans* (expansion) vs. *possible non-human entities* (preservation).  
     - Introduce **Mars terraforming** as the anchor case:  
       - *Include:* Confirmed Martian brines (potential microbial habitats) + terraforming’s irreversible alteration.  
       - *Exclude:* Technical feasibility; treat terraforming as ethically plausible.  

  3. **Core Tension: The Non-Identity Problem (NIP)**  
     - Pose the paradox: **If terraforming creates future Martians who wouldn’t otherwise exist, how can *they* be harmed by it?**  
     - *Preempt Misconception:* At this exact moment, explicitly separate:  
       - "No specific person is made *worse off*" (NIP’s insight)  
       vs.  
       - "No harm occurs *at all*" (false inference; harm may be impersonal, e.g., destruction of value).  
     - *Anticipate Next Confusion:* Students may ask, "But wouldn’t future colonists *prefer* existing?" → Redirect to impersonal harm: "Does creating a life worth living justify *any* means of creating it?"  

  ---

  ### **Sequencing Objections**  
  | **Objection**                          | **When to Address**            | **Absorption Strategy**                                                                 |
  |----------------------------------------|--------------------------------|----------------------------------------------------------------------------------------|
  | **1. "Earth is uninhabitable; we *must* expand"** | After intrinsic value foundation | Distinguish *necessity* from *permissibility*: "Does survival justify *all* actions? What if survival requires erasing a unique form of life?" |
  | **2. "Barren landscapes have no moral standing"** | During Mars case setup         | Challenge the "barren" label: "Is absence of *visible* life equivalent to absence of *value*? What if we misjudge?" (Link to Antarctic’s "lifeless" perception pre-discovery of extremophiles.) |
  | **3. "Future Martians would endorse terraforming"** | During NIP deep dive          | Concede the point but reframe: "Even if they’re grateful, does that nullify the *independent wrong* of destroying Martian nature?" (Introduce "impersonal harm" concept.) |

  ---

  ### **Critical Pedagogical Check**  
  - **Activity:** *5-minute silent written response* to:  
    > *"Can both preservationists and expansionists coherently claim to act for the sake of 'future generations'? Explain the conflict in their definitions."*  
  - **Why this works:**  
    - Reveals grasp of structural tension: Preservationists prioritize *abstract future beings* (incl. non-humans) or *conditions* (e.g., pristine Mars), while expansionists prioritize *specific future humans* (who need Mars terraformed to exist).  
    - Exposes if students reduce the dilemma to "survival vs. rocks" rather than seeing incommensurable conceptions of obligation.  

  ---

  ### **What to Leave Unresolved**  
  1. **Refuse to settle:** Whether impersonal harms (e.g., destroying Martian potential) can *outweigh* the creation of new persons.  
  2. **Undergraduate boundary:** Avoid deep metaethics (e.g., "Do possible beings have rights?"). Instead, emphasize: **Both positions face a paradox they cannot cleanly resolve.**  
  3. **End with open question:** "Does moral urgency dissolve if no *identifiable* victim exists, or does it transform into something else?"  

  ---

  ### **Timing Breakdown**  
  - **0–20 min:** Antarctica analog + intrinsic/instrumental distinction (Objection #2 absorbed).  
  - **20–35 min:** Mars case setup + intergenerational justice framing (Objection #1 absorbed).  
  - **35–55 min:** NIP introduction + misconception preemption (Objection #3 absorbed).  
  - **55–75 min:** Written exercise + group discussion of responses.  
  - **75–90 min:** Synthesis: Why this is structural (not just "weighing" interests) + unresolved tensions.  

  This arc forces confrontation with the NIP’s destabilizing effect on preservationist arguments *without* dismissing them, while preventing survival imperatives from dominating by design. The unresolved ending underscores philosophy’s role in framing dilemmas rather than solving them.
