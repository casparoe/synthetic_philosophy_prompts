  Okay, the user is a first-year student preparing to teach a seminar on origin essentialism to biology majors with little philosophy background. They need a structured teaching plan, not a content explanation. Let's break down their needs.

  First, the key challenge is making abstract metaphysical concepts accessible to science students. The dependency order is crucial. I should start with concrete biological examples before introducing modal concepts. Jumping straight into possible worlds would lose them. Using a relatable IVF case as the central example makes sense—it's scientifically grounded and avoids sci-fi distractions. The "different Tuesday" scenario is too vague and doesn't anchor the necessity claim biologically.

  The user's concern about misconceptions is spot-on. Biology students might conflate origin essentialism with genetic determinism or think it's about DNA uniqueness. I'll need to preempt these during the embryo example demonstration, explicitly separating metaphysical necessity from empirical claims. The IVF case with same-genome siblings will help show that identical DNA isn't the point.

  For the check question, asking them to imagine an embryo swap scenario tests if they grasp the modal "could not have come from" aspect rather than physical impossibility. It's important to emphasize that this is about metaphysical possibility, not practical constraints.

  I should clearly demarcate what to omit: no Kripkean semantics, no transworld identity debates. Stick to intuitions. Also, highlight where philosophers disagree—especially the essentiality of zygote vs. gametes—and note biology's objections to privileging gamete origins over epigenetic/environmental factors.

  The user's typo ("origon") is harmless but suggests they're nervous. The plan should boost their confidence with clear signposts and built-in misconception traps. Ending with the embryo swap question and a clear "settled vs. contested" wrap-up will leave the class with philosophically precise takeaways.
answer: |-
  Here’s a battle-tested teaching plan for your seminar, optimized for biology majors new to philosophy. Focus on conceptual clarity over technical depth.

  **Core Dependency Order & Why:**  
  1. **Personal Identity (5 min)**  
     - *Why start here?* Grounds the discussion in a relatable question: "What makes you *you* over time?"  
     - *Hook:* Show two baby photos (e.g., 1980s vs. 2020s). Ask: "Is this the same person? What *must* stay the same?"  
     - *Key move:* Introduce "essential properties" informally → properties without which *you* wouldn’t exist.  

  2. **Modal Possibility Lite (5 min)**  
     - *Why now?* Needed to distinguish "actually true" from "necessarily true."  
     - *Tool:* Use **accessible analogies** — "I *actually* have brown hair, but I *could* dye it blue" vs. "I *necessarily* have a brain (to be me)."  
     - *Avoid:* Possible worlds jargon. Use "scenarios" instead.  

  3. **Biological Origin (10 min)**  
     - *Why last?* Builds on steps 1–2 to isolate *origin* as the essential property.  
     - **CARRYING EXAMPLE: IVF Case**  
       - *Setup:* "Couple uses IVF. Batch A (sperm S1 + egg E1) creates Embryo A. Batch B (S2 + E1) creates Embryo B. Embryo A develops into Alice."  
       - *Q:* "Could Alice have come from Batch B instead? Same mother, same egg, different sperm."  
       - *Crucial properties:*  
         ✅ **Must have:** Concrete biological materials (specific gametes).  
         ✅ **Must lack:** Abstract timing ("different Tuesday"), general conditions ("same parents").  
       - *Why it works:* Forces focus on *particular material origins* — not genetics, not circumstances.  
     - **REJECTED EXAMPLE: "Different Tuesday"**  
       - *Flaw:* Implies abstract timing is essential. Origin essentialism cares about *concrete materials* (gametes), not calendar dates.  

  **Preempting Misconceptions (Weave into IVF Example):**  
  - **Genetic Determinism:** When presenting the IVF case, add: "Suppose S1 and S2 have identical DNA. Could Alice come from Batch B?" → *Clarify:* "No—same DNA isn’t enough. It’s about *this specific sperm cell*." (Do this during the IVF Q&A)  
  - **Empirical Claim/DNA Uniqueness:** State explicitly: "This isn’t about biology saying gametes are unique. It’s a *metaphysical* claim: if origin changes, identity changes." (State when contrasting "metaphysical necessity" vs. "scientific fact")  
  - **Cosmic ‘Meant to be’:** Preempt post-IVF discussion: "Note: This isn’t about destiny. We’re asking ‘Could Alice exist?’, not ‘Was Alice destined to exist?’" (Say *after* establishing the IVF conclusion)  

  **Check Question (Post-Explanation):**  
  - *Prompt:* "Alice’s embryo was frozen. A mix-up swaps it with Embryo C (from different parents). Could Alice have come from Embryo C?"  
  - *Correct grasp:* "No — Alice *necessarily* comes from *her* specific zygote."  
  - *Wrong answers revealing confusion:*  
    - "No, because DNA wouldn’t match" → Still stuck in genetics.  
    - "No, because the clinic has records" → Missing modal claim.  

  **What to Omit:**  
  - **Kripkean machinery** (rigid designation, transworld identity).  
  - Debates about zygote vs. gamete essentialism (stick to zygote for simplicity).  
  - Any connection to abortion/ethics (distraction).  

  **Settled vs. Contested:**  
  | **Settled** | **Contested** |  
  |-------------|---------------|  
  | Among Kripkeans: If origin essentialism holds, it applies to biological organisms (including humans). | **Whether it holds at all:** Many philosophers reject origin essentialism (e.g., Mackie, Salmon). |  
  | Origin = zygote formation (not birth, not conception). | **Grain problem:** Are *specific gametes* essential, or just their precursors? (Philosophy of biology critique) |  
  | It’s a *de re* necessity claim, not empirical. | **Biology’s pushback:** Developmental systems theory (Oyama) argues origins aren’t privileged over later interactions. |  

  **Execution Tips:**  
  - **Whiteboard:** Diagram the IVF case. Use color for gametes!  
  - **Pause Points:** After personal identity (check for "body/brain/memory?"), after modal intro (check "could vs. must"), post-IVF (trap misconceptions).  
  - **No Jargon:** Say "must-be-true-for-you" not "de re necessity."  
  - **Biology Bridge:** End with: "This is why philosophers debate if cloning produces *you* — biologists, what would you need to know?" (Teases philosophy of biology without requiring depth).  

  This structure makes the modal claim inescapable without formalism. Focus on the IVF case relentlessly — it’s the linchpin. You’ve got this!  

  *(P.S. "Origon" typo ignored — but maybe skip whiteboard spelling!)*
