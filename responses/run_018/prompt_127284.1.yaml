prompt: |-
  As a novelist constructing a philosophical narrative about determinism and branching futures, I have been studying Aristotle's sea-battle problem together with modern branching-time semantics and the metaphysics of open futures, particularly where they bear on whether a determinist can consistently represent genuinely open narrative branches without logical contradiction. Rather than a survey, I want a defended agenda of exactly five open questions or conceptual lines of work in this domain—spanning modal logic, the ontology of fictional worlds, and the interaction between future contingency and determinism—ranked by which are most upstream and worth settling first for someone thinking about narrative possibility rather than physics. For each of the five, state the question in one or two sentences, defend why it takes priority over the others, indicate how tractable it is through conceptual analysis alone, and note what specific clarification or result over the next few years would cause you to reorder it. Present your answer as a numbered list of exactly five items, each a sentence or two, with no introduction or conclusion.
