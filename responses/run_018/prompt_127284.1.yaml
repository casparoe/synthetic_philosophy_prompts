  Most upstream should be the metaphysical groundwork that makes narrative openness intelligible. Question 1 must address whether determinism can even accommodate "genuine" openness without contradiction - this is the bedrock. Until settled, other questions might be moot. Conceptual analysis alone can handle it (e.g., disentangling causal vs. alethic necessity), but could be reordered if new logics emerge.

