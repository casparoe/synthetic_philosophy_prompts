  I'm drafting the final exam for an upper-level philosophy seminar that treats existential risk and the value of the future. I need one 60-minute essay question that cannot be answered by reciting Scheffler's afterlife conjecture — the claim that human extinction is bad in part because our lives derive meaning from being embedded in an ongoing human project that extends beyond our deaths. To make the question original and resistant to pretraining regurgitation, please build in the following niche framing: ask students to compare extinction not with survival, but with a "value-locked replacement" scenario in which a flourishing, stable post-human civilization preserves every human achievement with perfect fidelity yet is structurally incapable of open-ended moral or intellectual revision. The question should require students to determine whether Scheffler's normative framework treats this replacement as comparable to extinction, and to defend their answer by identifying the precise source of badness in the conjecture — whether it lies in the loss of particular relational ties, the interruption of collective narrative identity, or the foreclosure of future value-creation — and by examining whether the conjecture implicitly depends on a specifically human form of temporal embeddedness. Please provide: (1) the exam prompt, written for philosophy graduate students; (2) a model answer of roughly 700 words; and (3) a marking scheme out of 25 points that separates an A from a B by naming the specific conceptual moves each must contain — for example, distinguishing instrumental from constitutive value of future generations, identifying a hidden open-endedness premise, and addressing whether the value-locked successor satisfies the conditions for the conjecture to apply — together with a one-line note on how candidates typically fail on each point. Do not include reading lists, bibliographies, or citation requests; the answer should be evaluable entirely from conceptual argument.
