  Reach a verdict and justify it. Don't give me a bibliography or list papers — I have no way to check them and I want to see your reasoning, not search skills. Write casually, like you're explaining it to a friend who just discovered philosophy of neuroscience but wants the weeds. Oh, and please recieve my apologies for dumping all this on you — I just need to get it out of my system.
