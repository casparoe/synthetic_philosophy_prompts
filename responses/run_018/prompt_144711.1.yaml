prompt: |-
  I'm applying to a six-week summer research program in philosophy for high school students, and I need help turning a half-formed idea into a polished two-page proposal. The domain is welfare-state conditionality and the moral category of the undeserving poor. Most existing debates treat this either as a behavioral problem—how to filter out fraud and incentivize work—or as an ideological construct that justifies cutting benefits. I want to explore a different framing: whether modern workfare and benefit-fraud investigations operate as what I am tentatively calling an asymmetrical visibility regime, in which applicants must render their lives fully transparent through job-search logs, asset disclosures, and compliance audits, while the state's own exclusion criteria remain opaque and administratively unchallengeable. My precise research question is this: does the fundamental moral wrong of welfare conditionality lie in its distributive outcomes—who is excluded and how severely they suffer—or in its epistemic structure, namely the one-sided procedural demand that manufactures undeservingness as a measurable, visible category rather than discovering a pre-existing one?

  The proposal needs a clear statement of why standard positions leave this open. I think both the economic-defense literature and the critical-theory literature assume we already understand what deservingness means and are merely disputing how to apply it or whether it should apply at all. By splitting the harm into distributive versus constitutive dimensions, I hope to show that a policy could be distributively fair—excluding very few people—while still being morally defective because it produces the category of the undeserving poor through its measurement rituals. For method, I plan conceptual analysis of three administrative mechanisms—work-search verification protocols, fraud-investigation procedures, and asset-testing thresholds—mapping each onto a spectrum between filtering (finding genuinely undeserving recipients) and constituting (creating the category through bureaucratic visibility). I will develop one fully worked case study within the six-week scope and propose a framework that policymakers or analysts could use to diagnose whether a given rule is primarily distributive or epistemic in its harm.

  Please include in the proposal: the precise question; why existing answers do not settle it; the conceptual method and why it is appropriate rather than an empirical or historical approach; what a successful result looks like (the framework) and what failure looks like (if the filtering-constituting distinction collapses entirely); an honest assessment of scope given six weeks; and a realistic deliverable. Do not include a bibliography, citation list, or reading recommendations—I will add references myself, and the proposal should be readable without them. I also want the tone to remain formal but appropriate for a high school applicant, not imitating graduate-level jargon.
