answer: |-
  Your analysis is perceptive – the crux of Gongsun Long's "White Horse Dialogue" hinges precisely on the relation between "horse" (马 *mǎ*) and "white horse" (白马 *bái mǎ*), and the determinable-determinate model is significantly closer to the intended meaning than the mereological one, though with nuances rooted in classical Chinese philosophy's unique concerns about naming (*zhengming* 正名).

  Here's a breakdown of the relation asserted and why the determinable-determinate reading is more accurate:

  1.  **The Core Argument & Its Logic:**
      *   **Premise 1:** Asking for a *horse* allows substitution with any horse (yellow, black, white). The term "horse" denotes the shared form/shape/function.
      *   **Premise 2:** Asking for a *yellow horse* or *black horse* does *not* allow substitution with other colors. The compound term restricts the acceptable instances.
      *   **Inference:** Therefore, the compound term "yellow horse" or "black horse" cannot be identical to the simple term "horse." The compound term imposes an *additional, exclusionary condition*.
      *   **Extension to White Horse:** Applying the same logic, "white horse" also imposes an exclusionary condition (whiteness) that "horse" does not. Therefore, "white horse" is not identical to "horse." (*Bai ma fei ma* 白马非马).

  2.  **The Relation Asserted:**
      *   **"Horse" (马) functions as a Determinable:** It signifies the broad category defined by essential characteristics (form, shape, function of a horse), abstracted from specific differentiating features like color. It denotes the shared *kind* or *type*.
      *   **"White Horse" (白马) functions as a Determinate:** It signifies a specific *sub-type* or *determination* within the broader kind "horse." It picks out instances that possess *both* the essential characteristics of a horse *and* the specific, differentiating characteristic of whiteness.
      *   **The Non-Identity Claim:** Gongsun Long argues that because the determinate "white horse" includes a specific, exclusionary condition (whiteness) that the determinable "horse" lacks, they cannot be identical names or refer to the same concept *in the context of naming and substitution*. A name that imposes stricter conditions cannot be equivalent to a name that imposes looser conditions.

  3.  **Why Determinable-Determinate Fits Better than Mereological:**
      *   **Not About Parts Changing the Whole's Kind-Membership:** Gongsun Long is *not* arguing that adding "white" creates a fundamentally new ontological *kind* distinct from "horse." He explicitly states elsewhere in the dialogue that one *rides* a white horse just as one rides a horse. The white horse *is* a horse *in reality* (it possesses the essential horse characteristics). The argument is semantic and logical, focusing on the *function of the names* and their conditions of application.
      *   **Focus on Predication & Extension:** The argument hinges on the *extensional consequences* of the names. The extension of "horse" (all horses) is broader than the extension of "white horse" (only white horses). Asking for "horse" allows anything in the broader extension; asking for "white horse" restricts to the narrower extension. This difference in extension and substitution conditions demonstrates non-identity of the *names/concepts*.
      *   **Rectifying Names (正名 *zhengming*):** This is the key framing. The Mingjia aimed to ensure names accurately reflect distinctions and prevent confusion in discourse and governance. The dialogue argues that conflating "white horse" and "horse" *as names* leads to practical errors (like sending the wrong horse), even though a white horse is ontologically a horse. "Rectification" means recognizing that "white horse" signifies a *specific determination* under "horse," not the *whole kind*. It's about precision in predication and classification, not about denying the ontological inclusion of the part in the whole kind. Using the compound name "white horse" correctly predicates *both* the generic horse nature *and* the specific color.

  4.  **Nuances & Mingjia Context:**
      *   **Semantic Precision over Ontology:** The Mingjia were often more concerned with the logic of language and the practical consequences of naming than with deep metaphysical ontology in the way Western philosophy might frame it. The "White Horse" paradox is primarily a demonstration of how language works and how names must be used precisely.
      *   **"Fei" (非) as "Not Identical To":** The controversial claim "Bai ma fei ma" (白马非马) is best understood not as "A white horse is not a horse (at all)" in an ontological sense, but as "The term/concept 'white horse' is not identical to the term/concept 'horse'" or "A white horse is not (just) a horse" (i.e., it is a specific type of horse). The "fei" marks a distinction in naming and conceptual content.
      *   **Exclusionary Function:** The addition of "white" doesn't merely add a property; it *excludes* instances lacking that property. This exclusionary function is what differentiates the determinate term from the determinable term and justifies their non-identity *as names*.

  **Conclusion:**

  The determinable-determinate distinction provides the most accurate framework for understanding the core logical move in the White Horse Dialogue. "Horse" is the determinable universal (kind, type). "White horse" is a specific determinate under that universal, defined by adding an exclusionary condition (whiteness). The argument asserts that because the determinate imposes a stricter condition and has a narrower extension than the determinable, the *names/concepts* "white horse" and "horse" cannot be identical. This non-identity is crucial for the "rectification of names" (*zhengming*) – ensuring language precisely reflects the distinctions necessary for clear communication, correct action (like sending the appropriate horse), and avoiding conceptual confusion. The mereological reading, suggesting a change in fundamental kind-membership, misinterprets the argument's focus on semantic precision and predication rather than ontology. The point is about how we *name* and *classify* reality correctly, not about denying that white horses are horses in the world.
