answer: |-
  ### Exam Question: Philosophy of Mind Final  
  **Time:** 45 minutes  
  **Word Guideline:** ~800 words  

  **Prompt:**  
  Self-deception appears paradoxical: How can someone both *know* that ¬*p* (to intentionally deceive themselves) and *not know* that ¬*p* (to be genuinely deceived)? The "dual-ledger" model proposes a solution: An agent maintains two distinct sets of credences—one for **practical reasoning** (e.g., "Smoking will kill me") and another for **emotional self-regulation** (e.g., "Smoking isn’t *that* risky"). Crucially, the agent deliberately *blocks* these ledgers from merging.  

  Evaluate whether this model **resolves the paradox** by showing how self-deception is psychologically coherent, or merely **renames it** by relabeling the problem as "compartmentalization" without explaining how the ledgers stay separate. Argue for your position using the concepts below:  
  - The *intentional blocking* requirement (how/who controls it?)  
  - The *accessibility* of conflicting credences (can both be conscious?)  
  - Whether compartmentalization avoids the paradox or recreates it in a new form (e.g., "Who enforces the blockade?").  

  ---

  ### Model Answer (Approx. 600 words)  
  The dual-ledger model frames self-deception as a functional division of cognitive labor: One ledger guides actions (e.g., quitting smoking), while the other manages distress (e.g., minimizing health fears). This seems to resolve the paradox by allowing an agent to hold contradictory attitudes *without simultaneous awareness*. For instance, a smoker might use the "practical" ledger to buy nicotine patches (acting on *p* = "smoking is deadly") while consulting the "emotional" ledger to calm anxiety (*not-p* = "I’m an exception"). Blocking prevents integration, dodging the contradiction that defines the paradox.  

  However, this compartmentalization merely *relocates* the paradox. First, **intentional blocking** requires the agent to *know* both credences exist to keep them apart. If the smoker deliberately shields their emotional ledger from practical reasoning, they must recognize the threatening belief (*p*) to suppress it—reintroducing the original problem: How can they *know* *p* to hide it while *believing* *not-p*? The "blocker" itself becomes a meta-attitude that requires awareness of both ledgers, recreating the contradiction at a higher level.  

  Second, **accessibility** challenges psychological coherence. If the emotional ledger (*not-p*) is fully inaccessible during practical reasoning, how is it a *credence* rather than unconscious material? Self-deception typically involves *conscious* evasion (e.g., dismissing evidence). Yet if both ledgers are intermittently conscious, the agent would detect inconsistency during transitions—unless a "gatekeeper" oversees access, inviting an infinite regress.  

  Ultimately, the dual-ledger model *renames but does not resolve* the paradox. It usefully describes *how* self-deception manifests (compartmentalization), but fails to explain *how compartmentalization escapes incoherence*. The "blocking" mechanism either requires a paradoxical supervisor (undermining the solution) or reduces to non-intentional processes (e.g., automatic biases), abandoning the core idea of *self-*deception. While pragmatically insightful, it treats labeling as explanation.  

  ---

  ### Marking Scheme (Total: 20 Marks)  
  Evaluate answers based on four argumentative moves. Award **5 marks per section** for:  
  1. **Clarity in framing the classic paradox** (e.g., "Knowing ¬*p* to deceive oneself vs. not knowing it to be deceived").  
     *Typical mistake:* Vaguely stating the paradox without contrasting the conflicting conditions.  

  2. **Accurate application of the dual-ledger model as a solution** (e.g., Showing how separate credences + blocking avoid simultaneous contradiction).  
     *Typical mistake:* Merely describing the model without linking it to paradox resolution.  

  3. **Critical engagement with compartmentalization** (e.g., Identifying how "blocking" reintroduces intentionality/access problems).  
     *Typical mistake:* Treating compartmentalization as sufficient without probing its coherence.  

  4. **Balanced evaluation** (e.g., Weighing whether the model resolves vs. relabels; addressing "who blocks?" implications).  
     *Typical mistake:* Asserting a verdict without justifying why it resolves/relabels.  

  ---

  ### Notes for Grading  
  - **High-scoring answers** (16–20): Tightly integrate all four moves, expose tensions in "blocking," and offer an original inference (e.g., "Blocking demands a deceptive homunculus").  
  - **Mid-scoring answers** (10–15): Cover moves but with uneven depth (e.g., explain the model well but critique weakly).  
  - **Low-scoring answers** (0–9): Misrepresent the paradox/model, or list points without analysis.  

  This prompt pushes students beyond theory summary to dissect a structural tension, aligning with upper-level critical thinking goals. The model answer demonstrates concision for a 45-minute window.
