prompt: |-
  hey im a retired thermodynamicist who just got into philosphy lately (mostly ethics and social theory, though i still think in reference frames). i want you to write me a satirical piece for my blog, about 600 words, in the deadpan voice of a corporate HR memo announcing a "Global Merit Harmonization Policy." the idea is to parody both the American Dream (hustle culture, be exceptional) and Jantelagen with the tall poppy syndrome (don't stand out, cut down the successful) by making them work together inside one bureaucratic system. employees should be told to maximize thier relative achievement but only within a frame where they don't shift the peer reference point - like kinetic energy in physics, merit is always measured against a frame you don't control. it should be readable if you dont know the sociology but land the joke for people who do. stay deadpan, never wink, and please no footnotes or bibliographies - i hate those in blog posts. excuse the typo or two in this request, thats just my old laptop acting up.
reasoning: |-
  Okay, the user is a retired thermodynamicist who's gotten into philosophy, especially ethics and social theory, but still thinks in reference frames. They want a satirical blog post in the form of a corporate HR memo. The memo should parody both the American Dream (hustle culture, exceptionalism) and Jantelagen (tall poppy syndrome) by combining them into one bureaucratic system. 

  Hmm, the key here is creating a deadpan corporate voice that never breaks character. The physics analogy needs to be clear but not forced—kinetic energy relative to arbitrary frames is perfect for "merit measured against peer reference points you can't control." 

  Noticing they specifically hate footnotes and bibliographies in blogs, so I'll avoid any academic clutter. Also their self-deprecating note about typos suggests they appreciate wit without pretension. 

  The challenge is making the satire work on two levels: surface-level readable as absurd corporate speak, while landing the deeper critique for those who recognize the cultural references. The "merit harmonization" concept must feel plausibly bureaucratic yet physically impossible—like demanding maximum individual achievement without shifting group averages. 

  Corporate jargon phrases will sell it: "bandwidth," "synergistic velocity," "calibration thresholds." The threat of "corrective talent reallocation" (firing) needs to sound mundanely terrifying. Physics metaphors should escalate from gentle (reference frames) to violent (tall poppies as entropy). 

  Biggest risk is over-explaining the joke. Must resist the urge to wink. The HR director's signature block should feel authentically soulless—maybe add an ironic wellness platitude? 

  User's thermodynamics background is a gift. I'll let entropy symbolize the system's inevitable collapse when no one can excel or slack without penalty. The closing compliance threats ("violations impact calibration thresholds") should taste like ashes. 

  Final check: 600 words, zero footnotes, and all societal critique baked into the policy's unworkable demands. The laptop typos comment makes me think they'll appreciate if I let one bureaucratic typo slip in—maybe "Jantelaw" instead of "Jantelagen" for deniability.
