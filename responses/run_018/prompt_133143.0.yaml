  Then there's the simulation argument: if we can digitally emulate brain processes perfectly, does substrate even matter? Philosophers like Putnam would say cognition is multiply realizable—functional equivalence trumps hardware. That’s a major challenge, though von Neumann defenders might retort that perfect emulation is impossible or misses the point of architectural differences.

