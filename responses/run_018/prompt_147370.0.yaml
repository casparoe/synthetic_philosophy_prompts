  3. **Generalisation Section**:  
     - *Form*: End-stopped lines, abstract nouns ("function," "principle"), passive voice, hollow cadence.  
     - *Refrain Phrase*: "the world is charged" — repeated tonelessly, like a deflated creed.  
     - *Philosophical Function*: Language enacts evacuation. Synthesis becomes erasure; concepts sever roots.  

  **Triptych: The Three Rhythms**  

  ### I. Romance  
  See how the moth’s wing shivers, drawn to the lamp’s hot throat —  
  not symbol, not specimen, but this: velvet smear  
  of pollen on midnight air, the chalk’s dry scent that coats  
  your palm as you map Orion’s belt, sphere by white sphere  
  flung reckless through the void. To love a thing is to unpeel  
  the orange’s dimpled skin and taste the burst of sun  
  trapped in each crescent, juice stinging the cut, to feel  
  the calculus of roots as they grip stone, to run  
  fingers through river-silt where minnows dart like thoughts  
  not yet caught in the net. Before the naming comes the blood-rush,  
  **the world is charged.**  

  ### II. Precision  
  Scalpel the wing. Count veins.  
  Define the angle of refracted light.  
  Split the river’s flow: chart eddies, weight the silt, explain  
  the minnow’s gill-slit rhythm, sharp and right.  
  Force symmetry: the wedge, the graph, the clean-edged law  
  that fits the fractured star-light to its frame.  
  This taxonomy: *Lepidoptera*. No flaw  
  in the equation’s cold, extracting claim.  
  The orange? Citric acid, rind’s pitted albedo —  
  each fact a brick laid square. The net draws tight.  
  **The world is charged.**  

  ### III. Generalisation  
  Processes are abstracted from the flow.  
  Relations become formal principle.  
  The concrete instance must release its glow  
  to feed the schematic whole. It is essential  
  that functions be described, not felt. The sting  
  of citrus or the moth-wing’s frantic trace  
  are inputs, merely. Systemic properties sing  
  a purer song beyond all time and place.  
  The charge is quantified, a field devoid  
  of orange-rind or silt. The pattern stands alone.  
  **The world is charged.**  

  ---

  ### Philosophical Execution Notes  
  - **Romance**: Enjambment ("unpeel / the orange’s...", "run / fingers...") creates flow; imagery (pollen, chalk, silt) stresses immediacy. "Charged" implies divine electricity (à la Whitehead’s God/Adventures).  
  - **Precision**: Internal rhyme ("light/right," "law/flaw," "silt/fit") and short lines impose order. Technical terms ("albédo," "gill-slit") signal analysis. "Charged" now implies measured potential.  
  - **Generalisation**: Passive voice ("are abstracted," "must release," "be described") and abstractions ("Processes," "Relations," "Systemic properties") drain agency. "Charged" is an empty signifier — voltage without current.  
  - **Unresolved Tension**: The final section’s hollow language questions if "generalisation" *can* reintegrate romance, or if the cycle inevitably loses blood for blueprint. Whitehead’s hope for synthesis is implied but ironized by the form itself.
