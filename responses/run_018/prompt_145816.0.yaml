answer: |-
  Here's the restatement and residue report, strictly within your EGT framework:

  **Core Translation:**
  - **Cosmopolitan Equality:** Global strategy pool with uniform interaction probability. Payoffs are symmetric across all agents ("universal fitness function"). No inherent exit costs from any local interaction cluster. Partner choice is random or based on universal traits (e.g., reputation), not spatial/cultural proximity. Cooperation evolves only if globally stable (rare without structure). *EGT Equivalent:* Baseline model with no population structure or assortment.
    
  - **Nationalism/Associative Obligations:** Local interaction pools with high assortment (e.g., spatial grids, cultural tags). High interaction frequency within pools creates sunk-cost commitment devices (shared institutions, norms, language) that raise exit costs. Partner choice is constrained by pool boundaries (geography, institutions, identity markers). Cooperation evolves locally via reciprocal strategies (TFT, etc.) sustained by repeated interactions and network reciprocity. *EGT Equivalent:* Structured population model with high viscosity, assortative matching, and endogenous boundary maintenance (e.g., cost to interact across pools).

  **Modular Loyalty Translation:**
  Obligations scale with **edge density** and **path dependence** within network modules. Agents have:
  1.  **Continuous cooperation probability:** Correlates with **connection strength** (interaction frequency) and **local clustering coefficient**.
  2.  **Fuzzy boundaries:** Obligations emerge from **topology-dependent discount rates**. Future interactions with agents in dense clusters have higher probability, incentivizing cooperation via direct/indirect reciprocity.
  3.  **No sharp borders:** "Compatriots" are agents within the same **high-connectivity component**. Exit costs are **distance-dependent** in network space (e.g., social, institutional, geographic distance). Partner choice is **modularity-constrained** – easier within clusters than across bridges.
  *EGT Equivalent:* Graph-structured population with heterogeneous interaction probabilities. Cooperation governed by **network reciprocity rules** (e.g., Ohtsuki-Nowak rule) where cooperativeness depends on neighbor strategies and link weights.

  **Residue Report:**

  **Clean Mappings:**
  1.  **"Special Obligations" → High Interaction Frequency + Exit Barriers:** Perfect fit. Nationalist claims reduce to the evolutionary stability of cooperation in high-assortment, high-viscosity pools.
  2.  **Shared Institutions → Sunk-Cost Commitment Devices:** Institutions are endogenous boundary markers raising exit costs and enabling coordination equilibria.
  3.  **Spillover Externalities:** Clear mapping to fitness effects leaking across pool boundaries (e.g., trade, pollution, war).
  4.  **Modular Loyalty → Topology-Dependent Cooperation:** Continuous obligation scaling is naturally expressed via weighted graphs and local clustering metrics. Binary in/out groups are a special case (complete graphs vs. disconnected components).

  **Fudges Needed:**
  1.  **Moral "Counting" → Symmetric vs. Asymmetric Payoffs:** Cosmopolitan "equal counting" maps to symmetric payoffs *only if* interaction rates are uniform. Philosophers often imply intrinsic equality *despite* asymmetric interactions – your framework requires payoff symmetry or global interaction uniformity to replicate this.
  2.  **"Generated" Obligations → Path Dependence:** Nationalists argue obligations *arise from* shared institutions. Your framework shows institutions *stabilize* cooperation but don't create obligations *ex nihilo*. The "generation" is path-dependent coevolution.
  3.  **Intentionality:** Philosophers debate *why* we *should* have obligations. EGT explains *how* obligation-like behaviors *evolve*. The normative "should" has no direct counterpart.

  **Unmappable Elements:**
  1.  **Deontic Force:** The philosophers' sense of *duty* ("I *must* help my compatriot") has no EGT analog. Your framework captures *behavioral regularity* ("I *do* help within my pool because it's stable"), not moral phenomenology.
  2.  **Intrinsic Value of Institutions:** Nationalists often value institutions *as such* (e.g., "our shared history"). EGT sees them only as commitment devices – fungible if cheaper alternatives exist.
  3.  **Cosmopolitan Ideal as Counterfactual:** The "equal moral consideration" ideal assumes agents *could* interact globally without friction. Your framework shows this is evolutionarily unstable without specific structures – the ideal isn't a feasible baseline state.

  **Modular Loyalty & Binary Boxes:**
  Your framework **can express continuous obligations** using:
  - **Weighted graphs:** Interaction frequency/cost as edge weights directly scaling cooperation probability.
  - **Local topology metrics:** Clustering coefficient, betweenness centrality, or modularity class defining "obligation strength."
  - **Endogenous discount rates:** Higher expected future interactions within clusters increase effective shadow of the future.

  **This exposes the philosophers' binary framing as an artifact.** Sharp national boundaries are a special case of high modularity with low inter-cluster connectivity. Your framework *generalizes* the debate: obligations are **emergent properties of interaction topology**, not categorical imperatives. The residue is philosophical baggage (deontology, intrinsic value), not a failure of your vocabulary. EGT reframes "obligation" as **evolutionarily stable cooperation gradient across a network**.

  **Key Insight:** Your framework replaces *moral ontology* (what obligations *are*) with *behavioral ecology* (how cooperation patterns *persist*). The nationalism-cosmopolitanism debate becomes a question of optimal network topology for sustaining cooperation under resource constraints and competition. Modular loyalty isn't a "position" – it's the default prediction of graph-based EGT models.
