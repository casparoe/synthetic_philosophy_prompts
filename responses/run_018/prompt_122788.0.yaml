prompt: |-
  I am drafting the normative section of a civic-education framework for a ministry working group, and before I look at any candidate theory of patriotism I want the specification rather than the theories. Please write me the list of requirements that an account of the moral standing of patriotic attachment would have to meet in order to be usable for my purpose. That purpose is narrow and I want the list built for it: adequate to decide whether, and by what means, a democratic state may deliberately cultivate attachment to country in a captive audience of pupils who have not chosen to be there. I need the standard, not a survey.

  For each requirement: one sentence stating it; the case it must handle or the consideration behind it; whether you take it to be non-negotiable for this purpose or a demand that one camp imposes and another is entitled to refuse; and what accepting it would rule out. Where a single putative requirement is really two, split it.

  The cases I want used as tests rather than as ornament: a plurinational state several of whose constituent peoples regard the political unit as not theirs; a nation with no state, and the emigrant who has not been back in thirty years; a polity that has peacefully ceased to exist, loved by the grandchildren of its citizens; a reformer whose object is the country's unfulfilled aspirations rather than its present condition; a country whose present prosperity depends on an ongoing wrong it will not acknowledge; someone who judges, on the evidence, that her country is the worst in the world and who nonetheless cares about it; a public official who breaks the law out of loyalty to the country; the position of the state, which is to be both the teacher of the attitude and its beneficiary; and the position of the pupil, who is to have the attitude inculcated and is yet supposed to have it genuinely, as a virtue rather than as a conditioned habit.

  The distinctions I want the theory unable to collapse: country, nation, state, government, and compatriots; loving a country and approving of it; being permitted to weight compatriots more heavily and being required to; the disposition and its public expression; patriotism's value and patriotism's effects on inquiry into the national past; intrinsic and instrumental value; and the content of the attitude and its source, whether chosen, inherited, or taught.

  Then flag any two requirements you suspect cannot be jointly satisfied, and say whether the conflict indicts the specification or is the first real result about the phenomenon. Name the single requirement that does the most work in excluding candidates. And — briefly, three or four lines each, since the criteria are the deliverable and the scoring is not — score three views against the list: patriotism as loyalty to a political community's constitutive values rather than to a nation; patriotism as a partly non-voluntary, identity-constituting partiality of the same general shape as familial love; and patriotism as worth having only instrumentally, as the affective condition of redistributive solidarity.

  Where a requirement rests on a contested empirical claim, mark it as such and say which way the claim would have to come out. Do not survey the literature and do not attribute the views; I have the readings in front of me.
reasoning: |-
  Okay, the user is drafting a normative section for a civic-education framework and needs a list of requirements to evaluate theories of patriotism. The focus is on whether a democratic state can cultivate patriotism in a captive audience of students. Let me break down their query.

  First, the user specifies several test cases: plurinational states, stateless nations, emigrants, defunct polities, reformers, countries with ongoing wrongs, critical patriots, officials breaking laws, the state's dual role, and the pupil's genuine virtue. These cases are crucial for testing any theory's robustness. I need to ensure each requirement addresses these scenarios.

  The distinctions they mention—country vs. state, love vs. approval, permitted vs. required partiality, etc.—must be non-collapsible in the requirements. Each requirement should uphold these distinctions to avoid theoretical loopholes.

  The user wants non-negotiable criteria and points where theories might conflict. Identifying which requirements are essential versus contested is key. For instance, the state's role in inculcating genuine virtue might conflict with non-coercion requirements. Also, the intrinsic vs. instrumental value distinction could create tension.

  I need to check if any requirements conflict. For example, requiring genuine virtue (R12) might clash with the state's role as beneficiary (R4), leading to a paradox where state-driven cultivation undermines authenticity. That’s a core tension in the phenomenon itself, not just the specification.

  The most exclusionary requirement is likely R1 on non-coercion, as it rules out theories that justify mandatory attachment regardless of consent. This would impact instrumental approaches that prioritize solidarity over individual autonomy.

  Scoring the three views: Constitutive values patriotism might struggle with plurinational states (R2) if values aren't shared. Identity-based partiality handles involuntary attachment (R10) but might enforce undesired identities (R1). Instrumental solidarity could violate non-coercion (R1) if enforced, despite promoting redistribution (R6).

  I should also note empirical dependencies, like whether patriotic education fosters critical inquiry (R7) or if redistributive solidarity requires patriotism (R6). These need empirical validation.

  In summary, structuring each requirement with the components specified, ensuring they address the test cases and distinctions, flagging conflicts, and evaluating the sample theories against the criteria will meet the user's needs. Highlighting the tension between state-driven cultivation and pupil autonomy (R4 vs R12) as inherent to the issue is crucial.
answer: |-
  Here is the list of requirements, structured as requested, designed to rigorously test candidate theories for your specific purpose:

  1.  **Requirement: Must justify state cultivation of attachment in a *captive* audience without violating core democratic principles of individual autonomy or freedom of conscience.**
      *   **Case/Consideration:** Pupils haven't chosen to be there; state power imbalance necessitates strong justification to avoid indoctrination.
      *   **Non-negotiable:** Non-negotiable for a democratic framework.
      *   **Ruled Out:** Theories justifying cultivation solely by state prerogative or that dismiss autonomy concerns in captive settings.

  2.  **Requirement: Must provide a concept of "country" distinct from the current government, state apparatus, ethnic nation, and compatriots, capable of enduring change.**
      *   **Case/Consideration:** Reformer aiming at unfulfilled aspirations; the peacefully defunct polity; plurinational state where political unit is contested.
      *   **Non-negotiable:** Non-negotiable (distinction demanded by core cases).
      *   **Ruled Out:** Theories collapsing "country" into current regime, ethnic nation, state functions, or population.

  3.  **Requirement: Must accommodate the possibility of loving a country without approving of its current condition, government, or key aspects of its history.**
      *   **Case/Consideration:** Reformer; country with ongoing unacknowledged wrong; critic who judges it "worst" yet cares; emigrant.
      *   **Non-negotiable:** Non-negotiable (distinction demanded by core cases).
      *   **Ruled Out:** Theories equating patriotism with uncritical approval or requiring endorsement of present actions/history.

  4.  **Requirement: Must address the state's dual position as both the inculcator of the attachment and a primary beneficiary.**
      *   **Case/Consideration:** State as teacher/beneficiary inherent in the civic education context.
      *   **Non-negotiable:** Non-negotiable (structural feature of the purpose).
      *   **Ruled Out:** Theories ignoring this inherent conflict of interest or failing to constrain state action because of it.

  5.  **Requirement: Must distinguish between patriotism being *permitted* (or understandable) and *required* as a moral duty.**
      *   **Case/Consideration:** Plurinational constituent peoples; stateless nation members; emigrant; critic who cares but sees no duty.
      *   **Non-negotiable:** Non-negotiable (distinction demanded).
      *   **Ruled Out:** Theories that conflate descriptive psychological partiality with prescriptive moral obligation.

  6.  **Requirement: Must not preclude or morally condemn redistributive solidarity among compatriots as a potential instrumental consequence, while not *requiring* such solidarity solely based on shared nationality.**
      *   **Case/Consideration:** Instrumental patriotism for solidarity; state cultivating attachment partly for social cohesion.
      *   **Camp-Specific:** Instrumental camp demands it; identity camp may resist seeing it as primary.
      *   **Ruled Out:** Theories that *forbid* patriotic sentiment from motivating solidarity OR theories that *reduce* patriotism's value *only* to such solidarity.

  7.  **Requirement: Must clarify the relationship between patriotic attachment and critical inquiry into the national past/present, ensuring cultivation doesn't inherently suppress honest reckoning.**
      *   **Case/Consideration:** Country with ongoing unacknowledged wrong; reformer; critical patriot.
      *   **Non-negotiable:** Non-negotiable for democratic education.
      *   **Ruled Out:** Theories implying patriotism necessitates historical whitewashing or shields the country from critique.

  8.  **Requirement: Must account for the source of attachment (taught/inherited) while demanding it be cultivable as a genuine *virtue*, not merely a conditioned habit.**
      *   **Case/Consideration:** Pupil having genuine virtue vs. conditioned habit; inherited identity (emigrant, grandchildren of defunct polity).
      *   **Non-negotiable:** Non-negotiable (pupil position).
      *   **Ruled Out:** Theories reducing patriotism to mere instinct, unchosen identity, or brainwashing, denying its status as a reflectively held disposition.

  9.  **Requirement: Must distinguish the intrinsic value (if any) of patriotic attachment from its instrumental consequences.**
      *   **Case/Consideration:** Instrumental view vs. identity/constitutive views; effects on solidarity/inquiry vs. the attitude itself.
      *   **Non-negotiable:** Non-negotiable (distinction demanded).
      *   **Ruled Out:** Theories that *only* value patriotism instrumentally without argument for intrinsic worth, or that *deny* any instrumental value is relevant.

  10. **Requirement: Must accommodate the moral standing of patriotic attachment for groups lacking a state (stateless nations) or whose "country" no longer exists politically.**
      *   **Case/Consideration:** Stateless nation; grandchildren loving a defunct polity.
      *   **Non-negotiable:** Non-negotiable (core case demands inclusion).
      *   **Ruled Out:** Theories tying patriotism exclusively to existing state citizenship or political structures.

  11. **Requirement: Must provide criteria for when loyalty to "country" could *potentially* override specific legal obligations for public officials, without endorsing routine lawbreaking.**
      *   **Case/Consideration:** Official breaking law out of loyalty to country.
      *   **Camp-Specific:** Strong patriotism camps may demand this possibility; minimalist/liberal camps may resist.
      *   **Ruled Out:** Theories that *always* equate loyalty to country with obedience to state law OR theories that grant patriotism absolute moral supremacy over law.

  12. **Requirement: Must not morally *require* individuals from plurinational constituent peoples to feel attachment to the overarching political unit if they genuinely reject it as "theirs".**
      *   **Case/Consideration:** Plurinational state where constituent peoples reject the unit.
      *   **Non-negotiable:** Non-negotiable (core case + democratic pluralism).
      *   **Ruled Out:** Theories imposing a singular, mandatory "national" patriotism on all residents regardless of nested identities.

  13. **Requirement: [Empirical] Must be compatible with the *plausible* empirical claim that critical patriotic attachment is sustainable and not inherently self-undermining.**
      *   **Case/Consideration:** Critical patriot; reformer; need for honest inquiry (R7).
      *   **Empirical Dependency:** Yes. Claim: Strong attachment *can* coexist with deep criticism without dissolving. If false, R3/R7 become harder.
      *   **Ruled Out:** Theories *relying* on the claim that patriotism *must* be uncritical to be stable/sincere.

  **Flagged Conflicts:**
  *   **R4 (State as Inculcator/Beneficiary) vs. R8 (Genuine Virtue):** Can the state, with its inherent interests, reliably cultivate a *genuine virtue* rather than a self-serving habit? This conflict *indicts neither specification nor phenomenon*; it highlights the core tension and difficulty of the state's role.
  *   **R1 (Non-coercion/Autonomy) vs. R6 (Permitting Instrumental Solidarity):** If cultivating patriotism *primarily* for redistributive solidarity (R6) requires significant inculcation in a captive audience (risking R1 violation), can both be fully satisfied? Conflict *indicts neither*; it reveals a practical tension in achieving instrumental goals democratically.

  **Most Exclusionary Requirement:**
  **R1 (Non-coercion/Autonomy in Captive Audience).** This immediately disqualifies any theory that cannot provide a robust, autonomy-respecting justification for state-driven cultivation within compulsory education, regardless of its other merits (e.g., strong communitarian or nationalist theories lacking such justification).

  **Scoring Sample Views:**

  1.  **Patriotism as loyalty to constitutive political values:**
      *   **Strengths:** Handles R2 (distinct from nation/state), R3 (love ≠ approval), R5 (permits ≠ requires), R7 (critical inquiry possible), R9 (intrinsic value possible), R12 (avoids mandatory national attachment).
      *   **Weaknesses:** Struggles with R4 (values defined by whom? state interest?), R8 (can loyalty to abstract values feel like "love"?), R10 (stateless/defunct polity?), R11 (overriding law?), R13 (empirical: is loyalty to values strong enough?).

  2.  **Patriotism as identity-constituting partiality (like family):**
      *   **Strengths:** Handles R8 (genuine, non-chosen), R10 (defunct/stateless), R3 (love ≠ approval possible), R5 (often seen as permitted, not always required), R6 (can ground solidarity).
      *   **Weaknesses:** Struggles severely with R1 (justifying *state cultivation* of non-voluntary identity), R4 (state benefiting from identity it shapes), R12 (imposing unwanted identity in plurinational state), R2 (risks collapsing into nation), R7 (potentially defensive of identity).

  3.  **Patriotism as instrumentally valuable for redistributive solidarity:**
      *   **Strengths:** Clear on R6 (instrumental goal), potentially justifies R4 (state cultivates for cohesion), compatible with R9 (no intrinsic claim).
      *   **Weaknesses:** Fails R1 (hard to justify cultivating *affect* instrumentally in captives without manipulation), R8 (risks conditioned habit, not virtue), R3 (love irrelevant, approval may be needed), R5 (duty based on consequences, not attachment), R7 (may discourage critical inquiry threatening solidarity), R10/R12 (attachment not inherently valuable, so why cultivate for stateless/objectors?).
