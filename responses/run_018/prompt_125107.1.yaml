answer: |-
  Based on your supervisor's pattern, three core rules emerge. Here's the tight breakdown:

  1.  **Ritual Participation Rule (RPR):** Personhood requires *active, ongoing inclusion in the community's ritual practices and decision-making fabric*. It's performative social presence.
      *   **Body:** YES. Explicitly included in ritual decision-making by the kin.
      *   **Proxy:** NO. It's a *tool* mediating the frozen woman's presence, not itself ritually engaged *as* a person by the kin group.
      *   *Fits:* Ancestor (actively consulted), Hermit (suspension = ritual disengagement), Anencephalic newborn (embedded ritual care recipient). Contrasts Corp/LLM (no ritual integration).

  2.  **Vulnerability/Mourning Rule (VMR):** Personhood requires *embodied vulnerability* and the *capacity to be genuinely mourned by the community* upon loss.
      *   **Body:** AMBIVALENT/LEAN NO. Cryogenic preservation *suspends* biological vulnerability/death. Mourning is deferred, not absent, but the *immediate* capacity for loss/vulnerability is frozen. Corp/LLM precedent suggests this suspension might disqualify *on this axis*.
      *   **Proxy:** NO. Lacks inherent biological vulnerability. Its "loss" wouldn't trigger genuine mourning akin to a person (like the Corp/LLM).
      *   *Fits:* Corp/LLM disqualified (no vulnerability/mourning), Anencephalic newborn qualifies (vulnerable body, mournable). Hermit suspended (vulnerability latent). Ancestor complicates (mourning happened, but ongoing presence?).

  3.  **Narrative Continuity Rule (NCR):** Personhood persists as long as the entity is *integral to the unbroken narrative of the kin group's identity and lineage*, regardless of current biological state.
      *   **Body:** YES. She is the literal ancestor, the origin point of the narrative. Her frozen state is a chapter, not an ending.
      *   **Proxy:** NO. It *represents* her narrative but is a *new artifact*, not the *continuation* of her biological/social lineage thread. Its existence depends on tech, not kinship descent.
      *   *Fits:* Ancestor (integral to lineage narrative), Hermit (narrative potentially paused, not erased). Anencephalic newborn (starts/continues lineage narrative). Contrasts Corp/LLM (no ancestral narrative place).

  **Supervisor's Likely Rule:** **Ritual Participation Rule (RPR)**. It cleanly explains *all* verdicts:
  *   Ancestor: Ritually consulted = YES.
  *   Hermit: Ritual bonds severed = SUSPENDED.
  *   Anencephalic newborn: Ritually embedded care recipient = YES.
  *   Corp/LLM: No ritual integration = NO.
  *   **Prediction:** Body = YES (ritually included). Proxy = NO (mere tool/mediator).

  **The Splitter Case:** **A permanently comatose individual (biologically alive/vulnerable/mournable) whose family has *completely ceased* all ritual inclusion, decision-making reference, or narrative engagement for decades.**
  *   **RPR:** NO (No ritual participation).
  *   **VMR:** YES (Embodied vulnerability, mournable).
  *   **NCR:** AMBIVALENT/LEAN NO (Narrative connection actively abandoned).

  **Verdict:** [RPR / Body: YES, Proxy: NO / Permanently comatose individual abandoned by kin]
