  - The AI proxy: Mediates but isn't ritually engaged itself → Rule 1 says no. Lacks embodiment → Rule 2 says no. May extend narrative but isn't the person → Rule 3 says no.

  The supervisor is likely prioritizing the Ritual Participation Rule given how they treated the deceased ancestor case. A good splitter case would be a permanently comatose patient whose family has stopped all ritual engagement but whose body remains vulnerable - this would force a choice between Rule 1 and Rule 2.

