prompt: |-
  hey, quick one from a backend dev with zero formal history background. i've been reading about archives and keep seeing 'power' and 'silence' mentioned like they're database issues—access logs and missing rows. so i figured: a fonds is basically a git repo with provenance metadata, power is who controls the commits, and silences are just unrecorded transactions we could fill in with statistical imputation. if a community remembers something that never made it into the repo, shouldn't we correct the record rather than let memory overide it? i know absence of evidence isn't evidence of absence, but if the missingness is non-random, can't we model the bias and reconstruct the likely voices? what's the philosophical mistake i'm making here?

  please answer in british english. lead with your bottom line in the first sentence, then give the reasoning—no preamble and don't restate the question.
