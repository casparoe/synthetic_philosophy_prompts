prompt: |-
  So a friend of mine who did a philosophy module last year sent me her summary of Nyāya epistemology, because she knows I've been reading about the sorites paradox and thought the Indian stuff on knowledge-sources might interest me. Here's what she wrote:

  "In the Nyāya school, knowledge comes from four sources (pramāṇas): perception, inference, comparison, and testimony. Inference basically means induction -- you observe a bunch of cases where smoke goes with fire, generalise, and then you can infer fire from smoke the next time. Comparison is reasoning by analogy, like arguing that because two things are similar in some respects they'll be similar in others. Testimony is just trusting what reliable people or scriptures tell you, which shows the school wasn't really doing epistemology in the Western sense, since it builds authority in from the start. All the classical Indian schools accepted these four sources, they just disagreed about how to rank them."

  Now, I mostly believe her because she got a good mark in the module, but a couple of things niggle at me. The bit about testimony making it "not real epistemology" seems like a weirdly confident verdict, and I have a vague memory that the Indian schools actually disagreed quite sharply about how many pramāṇas there even are. Also, is inference really just induction? That seems too simple.

  Could you audit the summary for me -- tell me which parts are accurate, which are plausible-sounding but subtly wrong or oversimplified, and what a defender of the Nyāya view would push back on hardest? I'd rather you commit to a verdict on each point with reasons than just lay out possibilities and leave me to decide. And please answer in British English.
reasoning: |-
  Okay, the user's friend sent a summary of Nyāya epistemology, and they want me to audit it for accuracy. Let me start by breaking down each point she made.

  First, she mentions four pramāṇas: perception, inference, comparison, testimony. That's correct for Nyāya. But the user recalled that schools disagreed on the number. Right, other schools like Cārvāka only accept perception, while Buddhists have two, and Mīmāṃsā adds more. So her claim that all classical schools accepted four is inaccurate. I should highlight that.

  Next, inference being equated to induction. She says it's generalizing from smoke and fire examples. But Nyāya's anumāna is deductive too, based on the five-step schema with universal connections (vyāpti). The example given is simplified, but the deeper structure is syllogistic. So it's an oversimplification to call it just induction.

  Comparison (upamāna) as analogy. The user's friend describes it as reasoning from similarity. But Nyāya defines it as knowledge from resemblance, like identifying a gavaya by comparing it to a cow. The key here is the process of learning via similarity, not analogical reasoning. So her explanation is plausible but misses the specific mechanism.

  Testimony (śabda) being trust in reliable sources. She claims this makes Indian epistemology not "real" like Western epistemology. That's a problematic statement. Nyāya rigorously defines reliable testimony based on the speaker's competence and truthfulness. Comparing it to Western traditions that also consider testimony (like Reid or contemporary social epistemology) shows it's a valid epistemological source. Her dismissal ignores that Western epistemology also debates testimony's role.

  The user's niggles are spot-on. The friend's summary has oversimplifications and inaccuracies, especially the universal acceptance of four pramāṇas and the testimony critique. The user needs clarity on where the summary stands correct and where it falters, with specific corrections. They want a verdict per point, so I'll structure each section as accurate, oversimplified, or inaccurate with reasons. Also, using British English terms like "plausible-sounding" and "niggle" as requested.
answer: |-
  Right then, let's give your friend's summary a proper audit, point by point, as requested. You're right to have niggles – while the core is recognisably Nyāya, there are significant oversimplifications and one rather sweeping (and inaccurate) judgment. Here's the verdict on each claim:

  1.  **"In the Nyāya school, knowledge comes from four sources (pramāṇas): perception, inference, comparison, and testimony."**
      *   **Verdict: Accurate.**
      *   **Reason:** This is the standard Nyāya position. They defend these four (*pratyakṣa* - perception, *anumāna* - inference, *upamāna* - comparison, *śabda* - testimony) as the valid and sufficient means of acquiring genuine knowledge (*pramā*).

  2.  **"Inference basically means induction -- you observe a bunch of cases where smoke goes with fire, generalise, and then you can infer fire from smoke the next time."**
      *   **Verdict: Plausible-sounding but significantly oversimplified and potentially misleading.**
      *   **Reason:** While observation and generalisation (*vyāpti* - the universal concomitance, like "Wherever there is smoke, there is fire") play a crucial *foundational* role for *learning* the invariable connection, Nyāya inference itself is presented as a *deductive* process once that universal connection is established. Their classic five-step syllogism (e.g., proving fire on a distant hill) relies *logically* on the universal premise (*vyāpti*). Observing multiple instances (*bhūyodarśana*) is essential for *establishing* the reliability of the *vyāpti* (fighting scepticism about universals), but the *inference* drawn in a specific case is: "This hill has smoke; Smoke is invariably concomitant with fire; Therefore, this hill has fire." This *form* is deductive. Calling it "basically induction" glosses over this crucial logical structure and the Nyāya emphasis on the necessity (*niyata sambandha*) of the universal connection. A defender would push back *hardest* here, insisting inference (*anumāna*) is a distinct, formal reasoning process grounded in necessity, not merely accumulated observation.

  3.  **"Comparison is reasoning by analogy, like arguing that because two things are similar in some respects they'll be similar in others."**
      *   **Verdict: Plausible-sounding but subtly wrong in emphasis.**
      *   **Reason:** Nyāya *upamāna* (comparison) is specifically about knowledge gained through *similarity*, but its classic example isn't *reasoning* to a new property via analogy. It's knowing what a *gavaya* (wild ox) is because someone trustworthy says "a *gavaya* is like a cow," and later, upon seeing a *gavaya* in the forest, recognising it *as* a *gavaya* based on that similarity to a cow. The knowledge gained is *identification* ("this is that thing called *gavaya*") based on resemblance, not a *predictive inference* about unobserved properties ("this thing will moo like a cow because it looks like one"). While analogical reasoning (*tarka*) exists in Nyāya, *upamāna* is defined more narrowly as this specific source of identificatory knowledge through similarity. A defender would clarify it's not general analogical *reasoning* but a distinct *source* of knowledge *of* similarity enabling identification.

  4.  **"Testimony is just trusting what reliable people or scriptures tell you..."**
      *   **Verdict: Oversimplified but directionally okay.**
      *   **Reason:** The core idea is correct – *śabda* (testimony) is valid knowledge derived from the words of a reliable speaker (*āpta*), which *can* include scriptures (*śruti*) if accepted as spoken by a reliable source (e.g., God or omniscient sages). However, "just trusting" undersells it. Nyāya provides rigorous *epistemological criteria* for reliability: the speaker must have direct knowledge (*pratyakṣa* or *anumāna*) of the matter *and* must be truthful and intend to communicate accurately. It's not blind faith but a reasoned acceptance based on the speaker's established credibility and competence. The knowledge gained is *propositional* (understanding the *meaning* of the utterance).

  5.  **"...which shows the school wasn't really doing epistemology in the Western sense, since it builds authority in from the start."**
      *   **Verdict: Inaccurate and a problematic oversimplification of both Nyāya *and* Western epistemology.**
      *   **Reason:** This is the most problematic claim.
          *   Nyāya *absolutely* is doing epistemology ("*pramāṇa-śāstra*" = the science of knowledge-sources). They rigorously define knowledge (*pramā*) as a true cognition (*yathārtha*) not derived from defective causes (*doṣa-rahita*), and meticulously analyse the origins, validity, and conditions for each *pramāṇa*, including *śabda*. They engage in deep debates about scepticism, error, and the nature of validity (*prāmāṇya*).
          *   Building in "authority" via reliable testimony *is* an epistemological move, not an abandonment of epistemology. Nyāya provides *reasons* for accepting testimony under certain conditions, just as they provide reasons for accepting perception or inference.
          *   Western epistemology also grapples with testimony! From Thomas Reid's defence of testimony as a basic source against Humean scepticism, to contemporary social epistemology focusing on expertise and trust, testimony is a recognised and debated source *within* Western epistemology. Nyāya's inclusion is not alien; it's a different emphasis within the same broad project. Dismissing it as "not real epistemology" reflects a narrow understanding of Western epistemology itself. A defender would find this verdict both ignorant and dismissive, pointing to centuries of sophisticated Nyāya logical and epistemological analysis.

  6.  **"All the classical Indian schools accepted these four sources, they just disagreed about how to rank them."**
      *   **Verdict: Significantly inaccurate.**
      *   **Reason:** This is completely wrong. The *number* and *acceptance* of *pramāṇas* was one of the *primary* points of contention between schools:
          *   **Cārvāka/Lokāyata:** Only accepted perception (*pratyakṣa*). Rejected inference, comparison, and testimony as unreliable.
          *   **Buddhists (e.g., Dignāga, Dharmakīrti):** Generally accepted only perception (*pratyakṣa*) and inference (*anumāna*). Rejected comparison (*upamāna*) as reducible to perception and testimony, and testimony (*śabda*) as ultimately reducible to inference (inferring the speaker's reliability and knowledge).
          *   **Sāṃkhya:** Accepted perception, inference, and testimony (*śabda*), but not comparison (*upamāna*).
          *   **Mīmāṃsā (Pūrva):** Initially focused heavily on testimony (*śabda*, specifically Vedic scripture as authorless and eternal), accepted perception and inference, and championed *arthāpatti* (presumption/implication) and *anupalabdhi* (non-apprehension/absence) as additional distinct *pramāṇas*.
          *   **Advaita Vedānta:** Often followed Mīmāṃsā in accepting six *pramāṇas* (perception, inference, testimony, comparison, presumption, non-apprehension).
          *   **Nyāya:** Consistently defended the *four*.
      *   The disagreements were fundamental, about the *very nature* and *reducibility* of knowledge sources, not just their "ranking". A defender would point to these intense historical debates as proof this claim is flatly incorrect.

  **Summary Audit:**

  *   **Accurate:** Nyāya accepts four pramāṇas.
  *   **Oversimplified/Misleading:** The descriptions of Inference (reduction to induction) and Comparison (misemphasis on analogical reasoning).
  *   **Oversimplified but Directionally Okay:** The core idea of Testimony relying on reliable speakers.
  *   **Inaccurate:** 1) The claim that all schools accepted the four pramāṇas (they fiercely debated the number and nature). 2) The verdict that including testimony makes Nyāya "not real epistemology" compared to the West (deeply flawed on both counts).
  *   **Nyāya Defender's Strongest Pushback:** Would likely focus on the mischaracterisation of Inference (denying its sophisticated logical/deductive structure) and the dismissal of their entire epistemological project as "not real epistemology" due to including testimony. The claim about universal acceptance of the four sources would also be strongly contested as historically false.

  Your niggles were spot on. Your friend has the basic framework but misses the depth, nuance, and contentious history, particularly around inference's nature, testimony's epistemological defence, and the fundamental disagreements between schools on the *pramāṇas* themselves. Enjoy the sorites stuff – the Indian logical traditions have fascinating things to say about vagueness too!
