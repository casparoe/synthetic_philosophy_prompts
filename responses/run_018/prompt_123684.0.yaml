answer: |-
  ### Desiderata for a Theory of Personal Identity in Substrate Migration  
  Below are requirements derived from engineered scenarios for mind uploading and substrate replacement. Each is grounded in a specific case, classified as **non-negotiable** (N) for broad philosophical adequacy or **camp-specific** (C), and evaluated against three major theories. Conflicts and joint satisfiability are explicitly noted.  

  ---

  #### **Core Desiderata**  
  1. **Gradual Continuity Without Thresholds (Scenario A)**  
     - *Requirement*: The theory must recognize survival when biological neurons are replaced incrementally with synthetic analogs over a decade, maintaining uninterrupted subjective experience. No "moment of transition" should be required.  
     - *Grounding*: Rejects theories demanding a discrete point where identity "switches" from biological to synthetic.  
     - *Status*: **Non-negotiable** (for theories accepting substrate independence).  
     - *Conflicts*: Violated by biological-continuity theories if synthetic components break "life processes."  

  2. **Parallel Instance Resolution (Scenario B)**  
     - *Requirement*: Must adjudicate which instance(s) constitute "the person" when a suspended cognitive state is resumed on new hardware while the original biological brain remains active for months before deactivation.  
     - *Grounding*: Must distinguish between temporary duplication and permanent fission (e.g., is the original "decommissioned" person morally killable?).  
     - *Status*: **Non-negotiable** (theories must resolve branching).  
     - *Conflicts*: Theories insisting on strict numerical identity cannot allow two simultaneous instances of "oneself."  

  3. **Backup Activation Without Identity Collapse (Scenario C)**  
     - *Requirement*: A read-only "shadow" backup activated only after primary failure must not retroactively share identity with the primary pre-failure. Activation must constitute survival, not replication.  
     - *Grounding*: Preserves distinction between *dormant potential* and *active identity*.  
     - *Status*: **Camp-specific** (rejected by theories requiring spatiotemporal continuity).  

  4. **Temporary Divergence Tolerance (Scenario D)**  
     - *Requirement*: A six-month divergence in affective-processing latency during hybrid operation (e.g., emotions processed slower in digital substrate) that later reconverges must not break identity, provided subjective continuity is unbroken.  
     - *Grounding*: Allows for non-fatal "noise" in psychological traits during migration.  
     - *Status*: **Non-negotiable** (for gradualist approaches).  

  5. **Equivalence of Gradual vs. Destructive Paths (Scenario E)**  
     - *Requirement*: If destructive scanning creates a functionally identical digital instance, the theory must not categorically privilege the gradual path (Scenario A) over the destructive one, provided both yield identical post-transfer psychology.  
     - *Grounding*: Rejects biological exceptionalism if psychology and function are preserved.  
     - *Status*: **Camp-specific** (accepted by functionalists, rejected by biological theorists).  

  6. **Normative Singularity (Scenarios B, C, E)**  
     - *Requirement*: Only one instance may hold moral claims (e.g., rights, obligations) at a time. A backup or parallel fork gains normative standing only when activated *as the primary* experience-stream.  
     - *Grounding*: Prevents ethical paradoxes (e.g., two instances claiming the same property rights).  
     - *Status*: **Non-negotiable** (for coherence in law/ethics).  

  ---

  #### **Conflict Analysis**  
  - **Joint Unsatisfiability Triad**:  
    - Strict numerical identity (only one "self" across time) +  
    - Substrate independence (survival possible in non-biological systems) +  
    - No parallel instances (forbidding Scenario B/C parallelism)  
    → **Unsatisfiable**. If substrate migration allows parallel operation (Scenario B), strict identity fails.  

  - **Satisfiable Composites**:  
    - Psychological continuity + normative singularity + tolerance for divergence → Compatible with gradual migration (Scenarios A, D).  
    - Patternism + backup activation → Compatible with Scenario C if backups are non-conscious until activation.  

  ---

  #### **Assessment of Major Theories**  
  1. **Psychological Continuity Theories**  
     - *Strengths*: Natively supports Scenarios A, D, E (if psychology is preserved). Grounds identity in connected mental states.  
     - *Weaknesses*: Struggles with Scenario B (parallel instances both claim psychological continuity). May ambiguously handle Scenario C (is a backup "continuous" if never run?).  
     - *Verdict*: Fails normative singularity if parallelism implies two valid claimants.  

  2. **Biological/Animalist Theories**  
     - *Strengths*: Clear resolution for Scenario B (biological instance = "real" person). Upholds normative singularity.  
     - *Weaknesses*: Rejects Scenarios A, C, E as non-survival (synthetic substrates break biological continuity). Dismisses Scenario D as irrelevant.  
     - *Verdict*: Useless for substrate migration; violates non-negotiable desiderata 1, 4, 5.  

  3. **Substrate-Independent Patternism/Functionalism**  
     - *Strengths*: Naturally handles Scenarios A, D, E. Validates Scenario C if backups are inactive patterns.  
     - *Weaknesses*: Fails Scenario B (both instances are "valid" post-fork, violating singularity). Risks over-permissiveness (e.g., accepting clones as "you").  
     - *Verdict*: Best for engineering flexibility but requires constraints (e.g., "active instance" primacy) to resolve normative conflicts.  

  ---

  #### **Conclusion**  
  No extant theory satisfies all desiderata. **Patternism + normative singularity** best accommodates gradual migration (Scenarios A, D) and backups (C) but fails parallelism (B). **Psychological theories** require branching constraints. **Biological theories** are incompatible with substrate replacement. For engineering, a hybrid approach is necessary:  
  - Adopt patternism for substrate independence,  
  - Enforce a "no forking" protocol (merge/terminate divergences),  
  - Anchor ethics to the *active* instance’s stream of consciousness.  
  This resolves all scenarios except destructive scanning (E), which remains contentious but is functionally acceptable under patternism.
