prompt: |-
  As a software engineer without formal philosophical training, I am designing architectures for long-term cognitive-state preservation and substrate migration. Before I adopt any framework, I want the full specification.

  Write the desiderata that any adequate theory of personal identity and survival must meet to be useful for gradual mind uploading and incremental substrate replacement. I need the complete list of requirements: the engineered scenarios it must correctly adjudicate, the conceptual distinctions it must preserve rather than collapse (for example, between survival and mere replication, between temporary divergence and permanent fission, or between a primary running instance and a read-only safety shadow), the empirical or neuroscientific results it cannot contradict, and the normative stakes it must respect—such as whether the original biological system retains moral standing during parallel operation.

  Ground each requirement in a concrete case drawn from the following engineered situations: (a) a decade-long neuron-by-neuron replacement of biological tissue with synthetic analogs, maintaining continuous subjective experience without a sharp transition point; (b) a suspended cognitive state that is resumed on different hardware while the original biological brain remains active for months, then is deactivated region-by-region; (c) a "shadow" backup running in read-only mode on isolated hardware, activated only upon primary failure; (d) a temporary six-month divergence in affective-processing latency during hybrid operation that eventually reconverges; and (e) the choice between this gradual path and destructive high-fidelity scanning that yields exactly one digital instance.

  For each desideratum, indicate whether it is non-negotiable for any serious theory or a preference specific to one camp—such as bodily continuity, psychological continuity, singular self-reference, substrate independence, or non-branching. Then state clearly whether any subset of these desiderata is jointly unsatisfiable given standard rational constraints—for example, whether preserving strict numerical identity, allowing substrate-independent survival, and forbidding any parallel instance can all hold together.

  Finally, briefly assess how three broad approaches—psychological-continuity theories, biological or animalist accounts, and substrate-independent patternist or functionalist views—measure up against your list. Do not provide bibliographies, reading lists, or citations, and do not invoke obscure theories I am unlikely to have encountered.

  Please write your response in American English, in a formal and polished style.
