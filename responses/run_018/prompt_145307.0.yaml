answer: |-
  ## Cortical Quarantine

  This burning is present now, a stark decree
  Pronounced within the silent, vaulted bone.
  An index cast where nothing is to see:
  "This *here*," asserts the voice, yet moves alone.
  The cortex writes; the heat is elsewhere known.

  No spark ignites the word that claims the flame;
  No signal climbs the ladder it has shown.
  This burning is present now, a name, a name
  Assigned by circuits working on their own.
  The concept forms where qualia find no home.

  The mechanism speaks of "now," of "mine,"
  While photons fall on structures cold as stone.
  The cortex writes; the heat is elsewhere known.
  It labels states it never can combine
  With what it names, a severing design.

  The report ascends, a causeless, local cry,
  Describing fire where no embers have flown.
  This burning is present now, beneath the sky
  That knows no light, where darkness stands alone.
  The cortex writes; the heat is elsewhere known.

  This burning is present now, a phantom sign.
  The cortex writes; the heat is elsewhere known.

  ---

  **Notes on Execution:**

  *   **Philosophical Precision:** The poem directly addresses the "referential anchor" severing: qualia ("burning," "heat") are causally isolated from the neural processes generating reports about them ("cortex writes," "concept forms," "mechanism speaks"). "Index cast where nothing is to see," "Assigned by circuits," "states it never can combine / With what it names," and "causeless, local cry" explicitly capture the indexical misdirection and causal disconnect central to the specific epiphenomenalist paradox regarding phenomenal concepts/reports.
  *   **Refrains & Paradox Enactment:**
      *   "This burning is present now" embodies the immediate, indexical *seeming* of the phenomenal report.
      *   "The cortex writes; the heat is elsewhere" embodies the causal production of the report and the ontological separation of the qualia.
      *   Their alternation highlights the tension. Each recurrence of the burning refrain is undercut by the prior or subsequent mechanistic refrain.
      *   The final couplet places them side-by-side, grammatically parallel ("This burning is present now, a phantom sign. / The cortex writes; the heat is elsewhere known.") but metaphysically disjoint. "Phantom sign" acknowledges the report's lack of causative connection to the "heat" that is "elsewhere known" (i.e., not causally known *by the reporting mechanism*). The rhyme ("sign"/"known") doesn't resolve; it underscores the juxtaposition of appearance and mechanism.
  *   **Form as Burden:** The villanelle's relentless repetition and inevitable final pairing perfectly mirror the inescapable nature of the paradox: the subjective report *feels* direct and present, yet its origin story *insists* on disconnection. The form traps the two ideas together without allowing reconciliation.
  *   **Imagery & Diction:** "Vaulted bone" (skull), "silent," "cold as stone," "darkness," "phantom" emphasize the mechanistic, non-phenomenal nature of the brain producing the reports. "Spark," "flame," "embers," "light" contrast with the qualia being reported but causally absent. "Index," "concept," "mechanism," "report," "design" are the precise philosophical terms woven in.
  *   **British English:** Polished vocabulary ("stark decree," "vaulted," "ascends," "severing design") and syntax ("Pronounced within," "Assigned by circuits," "Describing fire where no embers have flown") meet this requirement.
