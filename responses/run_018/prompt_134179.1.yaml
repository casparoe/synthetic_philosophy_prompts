answer: |-
  Here's the full specification for a theory of personal survival, driven by edge cases, with desiderata, forcing cases, distinctions, constraint types, and the identified conflict:

  **Core Desiderata (What the Theory Must Deliver/Explain):**

  1.  **Survival vs. Mere Similarity (The Fission Constraint):**
      *   **Desideratum:** Must distinguish between *being* the original person (surviving) and merely being a *qualitatively similar* but numerically distinct person. Must account for the uniqueness of survival.
      *   **Forcing Case:** **Fission (Parfit's Branching Transport/Split Brain):** Person A enters a scanner. Their exact physical/psychological state is scanned, their original body is destroyed, and *two* qualitatively identical replicas (B and C) are created in different locations. Who survives? B? C? Both? Neither? A theory collapsing survival into similarity would say both survive, violating the intuition that one person cannot *be* two distinct persons simultaneously.
      *   **Distinction:** Survival (numerical identity) vs. Similarity (qualitative identity).
      *   **Constraint:** **Hard.** Collapsing this leads to contradiction (one person = two persons).

  2.  **Survival without Strict Physical Continuity (The Transport Test):**
      *   **Desideratum:** Must allow for survival even if the original physical body is destroyed *if* a sufficiently robust form of continuity is maintained.
      *   **Forcing Case:** **Parfit's Teletransportation:** Person A enters a scanner, is destroyed, and an exact physical/psychological replica (B) is created on Mars. If B has A's memories, intentions, character, etc., does A survive as B?
      *   **Distinction:** Survival vs. Strict Physical Spatiotemporal Continuity.
      *   **Constraint:** **Camp Preference/Defining.** *Accepting* survival here favors Psychological Continuity theories. *Denying* survival here favors Biological/Animalist or Spatiotemporal Continuity theories. A theory *must* take a stance; it can't ignore the case.

  3.  **Survival with Gradual/Discontinuous Physical Change (The Gradual Replacement Test):**
      *   **Desideratum:** Must allow for survival through radical but gradual physical transformation, even if the endpoint is physically discontinuous with the start (e.g., different substrate, different "parts").
      *   **Forcing Case:** **Gradual Synthetic Swap:** Over years, 10% of your biological neurons at a time are replaced by functionally *analogous* (not necessarily 1:1 mapped) silicon units that preserve the overall dynamics of your psychology (memories, personality, stream of consciousness). This continues until you are 100% synthetic. Did you survive? At what point (if any) did "you" stop existing?
      *   **Distinction:** Survival vs. Strict Physical Identity/Material Composition.
      *   **Constraint:** **Camp Preference/Defining.** *Accepting* survival favors Psychological Continuity or Process/Pattern theories. *Denying* survival (or requiring a cutoff) favors Biological/Animalist theories or strict Spatiotemporal Continuity. Crucial for questions of enhancement, digital migration, etc.

  4.  **The Impossibility of Co-Location/Fusion (The Uniqueness Constraint):**
      *   **Desideratum:** Must prevent the possibility of two distinct persons merging into one person who is numerically identical to *both* originals. One person cannot be the *sole* survivor of two distinct persons.
      *   **Forcing Case:** **Fusion:** Persons A and B are gradually merged (e.g., via futuristic brain-linking) into a single person C, who has a blended psychology incorporating elements from both A and B. Is C identical to A? To B? To both? To neither?
      *   **Distinction:** One survivor vs. Two survivors vs. No survivor (new person).
      *   **Constraint:** **Hard.** Allowing C = A *and* C = B implies A = B, which contradicts the premise that A and B were distinct. A theory must avoid this contradiction (usually by denying C is identical to either A or B).

  5.  **Survival Requires Continuity of Consciousness/Relation (The Resurrection/Gap Problem):**
      *   **Desideratum:** Must require some form of *connection* between the earlier and later stages. Mere recreation of a duplicate after complete destruction isn't survival.
      *   **Forcing Case:** **The Resurrection Test:** Person A dies and is destroyed. Centuries later, God (or advanced aliens) creates an exact replica of A at the moment of death (body + mind state). Is this replica the *same* person as A who died?
      *   **Distinction:** Survival (connected) vs. Replica (disconnected duplicate).
      *   **Constraint:** **Camp Preference/Defining (but widely held).** Most theories (even Psychological) require *causal dependence* or *continuity*; mere duplication isn't enough. Strict Spatiotemporal theories automatically fail this. Biological theories usually fail. Psychological theories require the causal link.

  6.  **Branching is Impossible (The One-Survivor-Only Constraint):**
      *   **Desideratum:** Must entail that a person cannot split into two distinct persons, *both* of whom are numerically identical to the original. There can be at most *one* survivor.
      *   **Forcing Case:** **Fission (again):** See Case 1. If Branching is possible, then in Fission, both B and C are A. But B and C are distinct from each other. Therefore A = B and A = C implies B = C, contradiction. Therefore, branching must be impossible.
      *   **Distinction:** One survivor vs. Two survivors.
      *   **Constraint:** **Hard.** Directly derived from the logic of numerical identity (transitivity: If A=B and A=C, then B=C). A theory *must* respect this logic. (Solutions involve denying B or C is A, or denying B and C are distinct - which they clearly are).

  7.  **Survival is Determinate (The No-Fuzzy-Identity Constraint - Optional but Common):**
      *   **Desideratum:** Survival should be an all-or-nothing matter (at a given time). You either survive or you don't; there's no "partially surviving" in the numerical identity sense. (Psychological *connectedness* can be partial, but *identity* is binary).
      *   **Forcing Case:** **Gradual Swap (again) / Borderline Cases:** If identity isn't determinate, then during the gradual swap, there might be stages where it's indeterminate whether "you" still exist. Many find this conclusion counterintuitive or problematic for practical concerns (responsibility, anticipation).
      *   **Distinction:** Surviving (Yes) vs. Not Surviving (No) vs. Indeterminate (?).
      *   **Constraint:** **Camp Preference.** Some theories (e.g., four-dimensionalist/worm theory) can comfortably accommodate indeterminacy. Others (e.g., simple Psychological Continuity) struggle and often try to avoid it. Not strictly logically required, but a strong practical/methodological preference.

  **The Conflict: Branching Impossible vs. Gradual Replacement Preserves Identity**

  *   **The Hunch is Correct:** These two desiderata are **jointly unsatisfiable** if the Gradual Replacement process can *itself* be branched/duplicated.
  *   **The Argument:**
      1.  **Assume Gradual Replacement Preserves Identity (GRPI):** If you start as A (biological) and undergo a gradual, step-by-step replacement of neurons with silicon analogues (preserving psychological continuity at each step), you end as Z (synthetic). GRPI states that A = Z. You survived.
      2.  **Assume Branching is Impossible (BI):** A single person cannot become two persons both identical to the original.
      3.  **Construct the Conflict Scenario (Gradual Replacement + Duplication):**
          *   Start with A (100% biological).
          *   Replace 10% of neurons with silicon, resulting in Stage A1 (90% bio / 10% synth). GRPI implies A = A1.
          *   Now, *before proceeding further*, create an *exact duplicate* of A1 (call it A1-Dup) – same hybrid biological/synthetic brain state.
          *   **Path 1:** Continue the gradual replacement on the *original* stream: A1 -> A2 (80% bio) -> ... -> Z (100% synth). GRPI implies A1 = Z, and since A = A1, therefore A = Z.
          *   **Path 2:** Subject the *duplicate* A1-Dup to the *same* gradual replacement process: A1-Dup -> A2-Dup -> ... -> Z-Dup (100% synth). GRPI implies A1-Dup = Z-Dup.
      4.  **The Contradiction:**
          *   A1-Dup is a *duplicate* of A1. They are distinct persons at the moment of duplication (A1 ≠ A1-Dup).
          *   GRPI + Path 1: A = Z.
          *   GRPI + Path 2: A1-Dup = Z-Dup.
          *   Since A1-Dup is a duplicate *of A1*, and A1 = A (from step 1), A1-Dup is highly psychologically continuous and qualitatively identical to A (and A1) at the moment of duplication. If GRPI holds, it should treat the process on Path 2 the same as on Path 1 *from the perspective of A1-Dup's continuity*. So, GRPI implies A1-Dup = Z-Dup.
          *   But A = Z (Path 1) and A1-Dup = Z-Dup (Path 2).
          *   Z and Z-Dup are distinct persons (they exist in different locations/have different bodies after Path 1 and Path 2 proceed).
          *   Therefore: A = Z and A = Z-Dup (because A = A1, and A1-Dup is a copy *of A1*, so closely linked to A). This implies Z = Z-Dup (by transitivity of identity).
          *   But Z ≠ Z-Dup (they are distinct). **Contradiction.**
      5.  **BI's Role:** BI tells us that A cannot be identical to *both* Z and Z-Dup because they are distinct. The contradiction arises precisely because GRPI, applied to both paths originating from a duplicated stage (A1-Dup being a duplicate of A1 which = A), seems to imply that A *is* identical to two distinct endpoints (Z and Z-Dup), violating BI.
  *   **Resolution Attempts (All Costly):**
      *   **Deny GRPI:** Claim that gradual replacement *doesn't* preserve identity, especially if branching is possible. (Favors Biological/Spatiotemporal theories).
      *   **Deny BI (Embrace Branching):** Claim that in the duplication step, A *branches* into A1 *and* A1-Dup, and both resulting streams (leading to Z and Z-Dup) are legitimate survivors of A. (Favors "Closest Continuer" or "Relation R" views like Parfit's, abandoning strict identity).
      *   **Deny Duplication Preserves Identity Link:** Argue that the duplicate (A1-Dup) is *not* sufficiently connected to A to inherit A's identity via GRPI, even though it's a copy of A1 (which = A). This requires modifying GRPI to include a "no prior branching" clause or a stricter causal uniqueness condition, making the theory significantly more complex and potentially ad-hoc.
      *   **Embrace Contradiction / Indeterminacy:** Accept the contradiction as a feature of reality or claim identity becomes indeterminate after duplication. (Radical and unsatisfying for most).

  **Conclusion:** Any adequate theory of personal survival must address all these cases and respect the Hard Constraints (Survival vs. Similarity, Uniqueness/Fusion, Branching Impossible). The core tension lies between the intuitive pull of **Gradual Replacement Preserving Identity** and the logical requirement of **Branching Being Impossible**, especially when the gradual process is combined with duplication. Resolving this tension forces a fundamental choice in the theory's foundations (Biological, Spatiotemporal, Psychological, or abandoning numerical identity for Relation R). No theory satisfies all desiderata comfortably; trade-offs are unavoidable. Your hunch identifies the most significant theoretical fault line.
