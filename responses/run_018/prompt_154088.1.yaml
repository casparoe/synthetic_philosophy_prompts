prompt: |-
  I'm co-teaching an upper-level undergraduate seminar on conservative epistemology and institutional design, and I'm drafting the final exam for our philosophy-of-science cohort. We've been working with Burkean conservatism and Chesterton's fence, but I want to avoid the predictable essay in which students merely summarize the fence metaphor and list generic examples. The exam is 90 minutes, 25 marks total, and must separate students who understand the institutional logic from those who have only memorized the labels.

  To force genuine engagement, I'm injecting a niche hypothetical scenario: an "Epistemic Maintenance Board" is tasked with streamlining a national research funding agency. The Board dissolves several redundant peer-review oversight committees because they appear bureaucratically obsolete. In reality, these committees were originally constructed as "error-correction buffers" during a prior funding crisis specifically to absorb and dilute industry-capture pressures; their redundancy was a designed feature, not a bug, but that design rationale has been lost to institutional memory. The exam should ask students to evaluate the Board's decision through a Burkean and Chestertonian framework, reconstruct the specific fallacy of treating structural age and apparent redundancy as prima facie evidence of dysfunction, and then take a committed stance—either defending the dissolution with a rigorous Burkean caveat about adaptive reform, or condemning it via a reconstructed fence principle—rather than balancing both sides indefinitely.

  Please draft the exam question, then provide a model answer of roughly 800–1000 words and a marking scheme. The model answer must take a definite position and defend it with reasons; do not ask for bibliographies, reading lists, or page-number citations—conceptual references to Burke or Chesterton are sufficient. Present your response as structured data: a JSON object with the fields "exam_question" (string), "model_answer" (string), "marking_scheme" (object containing "total_marks" as integer, "must_hit_points" as an array of objects each with "point_name", "marks", "description", and "typical_mistake" as strings, and "commitment_note" as a string explaining where the answer takes its definite stance). Make sure the marking scheme rewards the specific analytical moves that separate understanding from memorization.
