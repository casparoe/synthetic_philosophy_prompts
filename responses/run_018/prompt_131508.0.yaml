prompt: |-
  I am a high school student running an after-school philosophy workshop for about fourteen peers in grades 11 and 12; we have one 60-minute session and no outside readings assigned. I want you to design an in-class simulation that makes us feel the force of Peter Singer’s claim that geographical distance should not diminish our duty to rescue strangers in dire need, but with a twist that keeps it from being a familiar retelling: the rules should build in a hidden structural feature—direct local rescue is often fungible, because if I do not act someone else nearby probably will, whereas remote aid is usually non-fungible—so that we discover our intuition that “I must save the child right in front of me” may actually rest on an unexamined belief about our own irreplaceability rather than on proximity itself.

  Please include a clear setting and group structure, roles or positions for participants, rules and a payoff scheme that creates real tension without using real money (for example, points that determine who chooses our next discussion topic or a shared snack budget), a timeline of play, and a debrief that maps specific moments in the simulation onto Singer’s premises and onto the fungibility problem. The idea should emerge from what happens in the choices and incentives, not mainly from explanation afterward.

  Organize your response in exactly these sections, in this order, with approximate lengths:
  1. Setup and What We Should Come Away Seeing (about 100 words)
  2. Materials, Roles, and Rules of Play (about 180 words)
  3. Timeline of the Session (about 150 words)
  4. The Debrief: Mapping Play to the Argument (about 200 words)
  5. Predictable First-Run Failures and Fixes (about 100 words)
  6. Honest Limitation: What the Activity Cannot Reproduce (about 80 words)

  We should finish by seeing that distance is not the true source of our reluctance, and that direct rescue feels obligatory partly because we silently assume we are irreplaceable in the near case—an assumption the simulation should make us test and then undermine ourselves, before you name it. Be frank about which feature of Singer’s moral argument the game can never fully capture and that you must supply verbally.
reasoning: |-
  Okay, let me approach this systematically. The user is a high school philosophy workshop leader needing a simulation to reveal Singer's proximity paradox through experiential learning. Their core challenge is designing gameplay where students discover that "I must save the nearby child" stems from assumed irreplaceability, not distance itself. 

  First, I consider the key twist: making local rescue fungible (others will act if I don't) while remote aid is non-fungible (only I can act). The simulation must embed this structurally without explicit instruction. I imagine a resource allocation game with local/remote zones, where local emergencies have backup responders but remote ones don't. 

  For tension, I avoid real money - perhaps using discussion topic votes or snack budgets as incentives. Roles could include local rescuers, remote agents, and an announcer. The payoff scheme should reward saving lives but also reward self-interest (like keeping points for personal snacks), creating moral conflict. 

  During debrief, we'll map moments where players hesitated to help remotely despite equal need, revealing their unspoken assumption that "someone else will handle the nearby emergency." This connects to Singer's fungibility argument. 

  I anticipate pitfalls: players might not grasp the backup mechanism initially, or remote actions could feel too abstract. Solutions include clearer visual cues and adding fictional names to remote victims. The limitation will be simulating true moral weight - the game can't replicate actual suffering, so we must verbally emphasize that difference later.
answer: |-
  Here’s a simulation designed to meet your exact requirements:

  ### 1. Setup and What We Should Come Away Seeing (≈100 words)
  Participants become "Global Responders" allocating limited aid tokens to save "victims" (abstracted as numbered cards) appearing in "Local" (visible in-class) and "Remote" (announced by facilitator) zones. The twist: Local victims have backup responders (hidden rule), meaning they’ll likely be saved even if you don’t act. Remote victims have no backup. **Goal:** Reveal that perceived obligation toward the proximate stems from assuming our action is *unique* (non-fungible), not proximity itself. When distance increases, we *feel* less responsible partly because we intuit our irreplaceability drops – a bias the game exposes as flawed.

  ### 2. Materials, Roles, and Rules of Play (≈180 words)
  *   **Materials:** 14 "Aid Tokens" (e.g., poker chips), 20 Victim Cards (numbered 1-20), Timer, Whiteboard tracking "Lives Saved/Points."
  *   **Roles:** All 14 students are "Responders." Facilitator (you) acts as "Crisis Announcer" and scorekeeper.
  *   **Rules:**
      *   Each Responder starts with 1 Aid Token. Tokens are scarce; only 14 exist.
      *   **Rounds:** 4 rounds (≈5 mins each). Each round, Announcer reveals 1 "Local Victim" (place card visibly) and announces 1 "Remote Victim" (say number aloud, card remains hidden).
      *   **Saving:** To save a victim *this round*, Responders must donate 1 token to the Announcer *immediately* after reveal/announcement. First come, first served per victim.
      *   **The Hidden Rule:** Local Victims have a "Backup Responder" (facilitator). If *no one* donates within 15 seconds, Announcer saves it automatically (no token spent). Remote Victims have *no backup*; if no donation in 15s, they "die" (card discarded).
      *   **Payoff:** Each saved victim = +1 "Life Point" for the *whole group*. Group Points determine: 1) Priority choosing next week’s topic (High Points pick first), 2) Snack budget bonus (e.g., +$0.50/saved life for next session). *Unused tokens are worth +1 Personal Snack Point to the holder.*

  ### 3. Timeline of the Session (≈150 words)
  *   **0-5 mins:** Explain rules (except Backup Responder!), distribute tokens. Emphasize scarcity, group points (topic choice/snacks), and personal snack points for unspent tokens.
  *   **5-25 mins: Rounds 1 & 2:** Announce Local & Remote victims sequentially (e.g., "Local Victim 1!" [place card], then "Remote Victim 2!"). Enforce 15s donation window strictly per victim. Record saves/deaths and tokens collected publicly.
  *   **25-45 mins: Rounds 3 & 4:** Repeat. Observe patterns (e.g., scramble for Local, hesitation/inaction on Remote, token hoarding).
  *   **45-60 mins: Debrief:** Reveal Backup Responder rule. Discuss choices, feelings, and outcomes. Map to Singer.

  ### 4. The Debrief: Mapping Play to the Argument (≈200 words)
  *   **"The Nearby Child" = Local Victim:** Ask: "Why the rush/obligation to save Local victims?" Highlight the *assumption* that "If I don't act, they die" – which felt viscerally true but was *false* due to the Backup (fungibility). The gut feeling stemmed from perceived *unique responsibility*.
  *   **Distance = Remote Victim:** Ask: "Why less urgency for Remote victims, even though the need was announced clearly?" Point out the *accurate* intuition here: "If I don’t act, they *probably* die" (non-fungible). But note: the *need* was identical! The difference was perceived replaceability, not distance itself.
  *   **Singer's Premises:** 
      *   *Equal Moral Consideration:* A life is a life (Local Victim 1 = Remote Victim 2). Did group points reflect this?
      *   *Duty to Rescue:* We felt it strongly locally. Was that feeling *justified* by the actual need/dependency? Or by the (false) belief we were uniquely positioned?
      *   *Fungibility is Key:* Reveal the hidden rule. The simulation forced you to *experience* the difference fungibility makes. Proximity often *correlates* with non-fungibility (you're the only one *seeing* the child), but the game separated proximity from fungibility. Your reluctance for Remote aid mirrored real-world reluctance, but here it was based *only* on non-fungibility, proving distance alone isn't the core issue.
  *   **Core Insight:** Our "geography bias" often masks an "irreplaceability bias." We confuse "I *see* it" with "Only *I* can fix it."

  ### 5. Predictable First-Run Failures and Fixes (≈100 words)
  *   **Failure:** Players miss the 15s window due to confusion. **Fix:** Do a quick practice round with dummy victims. Use a loud timer.
  *   **Failure:** Players don't grasp token scarcity/hoarding incentive early. **Fix:** Dramatize: "Only 14 tokens exist for potentially 20 victims! Unused tokens get *you* extra snacks."
  *   **Failure:** Remote victims feel too abstract. **Fix:** Assign simple, evocative fictional locations ("Remote Victim 3 - famine in Sudan"; "Remote Victim 7 - flood in Bangladesh") when announcing.
  *   **Failure:** Backup Responder reveal causes frustration ("Why didn't you tell us?!"). **Fix:** Acknowledge the feeling: "Exactly! You acted based on incomplete information, just like we do in the real world. Let's examine those actions now."

  ### 6. Honest Limitation: What the Activity Cannot Reproduce (≈80 words)
  The simulation **cannot replicate the true moral weight** of letting a real person suffer or die. Saving victims earns abstract points, not a lived ethical imperative. It gamifies a profound dilemma, potentially trivializing the stakes. **You must verbally emphasize this:** "Remember, in reality, the 'victim' isn't a card but a person suffering. The simulation helps us see cognitive biases, but Singer's argument hinges on recognizing the *equal reality* of suffering, regardless of location – a gravity the game's points can never fully convey."
