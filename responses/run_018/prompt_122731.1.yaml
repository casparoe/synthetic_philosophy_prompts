prompt: |-
  I am writing a chapter on presentism in historiography and I do not want to defend a position before I know what a position here is supposed to do. So give me the specification rather than the theory: what must an adequate account of anachronism — of when a historical judgement illegitimately imports the standards of the historian's own time — be able to deliver, if it is to be good enough for a working historian writing a monograph rather than for a seminar on blame?

  For each requirement, give the case that motivates it, and keep the distinctions the theory must respect separate from the verdicts it must return (excuse versus justification, blameworthiness versus the propriety of blaming, causal explanation versus moral evaluation, "it was wrong then" versus "we rightly condemn it now"). The cases I want handled, at minimum:

  - the unavailable-concept case: condemning an eighteenth-century Caribbean sugar planter in a vocabulary of structural racial exploitation that did not yet exist. Distinguish a concept's being actually available to contemporaries from its being merely latent — constructible out of materials they already had — and say whether an agent can be faulted for not having invented a standard that was only latent.
  - the few-did case: some contemporaries did dissent, so "no one knew better" fails. Is contemporaneous dissent evidence that the standard was available, or only that it was possible?
  - the archive-silence case: the surviving record was itself shaped by the power being judged, so absence of recorded dissent is not clearly absence of dissent.
  - the collective-agent case: a chartered company or a colonial office, where both "what could they have known" and "who is the they" go fuzzy.
  - the temporal-symmetry case: if we may judge them by ours, later generations may judge us by theirs, and most of us resist that. Must the theory explain the asymmetry, or forbid one?
  - the retrospective-uptake case: does it matter that the descendants or political heirs of the condemned now endorse the condemnation, as in disputes over statues and official apologies? Is uptake evidence about the past or a fact about the present use of the judgement?
  - the self-application case: our critical vocabulary is itself a historical product. What happens when the standards used to judge the past are among the things being historicised?

  Then mark each requirement as non-negotiable or as the preference of a particular camp; flag any subset you think cannot be jointly satisfied, since if the list is unsatisfiable that is itself the result I want; and say which single requirement does the most work in excluding candidates. One line each, no more, on strict contextualism, the relativism-of-distance view, and thoroughgoing presentism.
reasoning: |-
  Okay, the user is writing a chapter on presentism in historiography and wants a clear specification of what an adequate account of anachronism must achieve. They need practical requirements for a working historian, not theoretical debates. Let me start by understanding their key concerns. They listed seven specific cases that the theory must handle, like the unavailable-concept case and the collective-agent case. Each requirement needs a motivating case and clear distinctions between concepts like excuse vs. justification.

  First, I should address each case systematically. For the unavailable-concept case, the requirement is to distinguish between actually available, latent, and impossible standards. The motivating example is condemning an 18th-century planter with modern terms of structural racism. The historian must also determine if agents can be faulted for not inventing latent concepts. This is non-negotiable because it's fundamental to avoiding anachronism.

  Next, the few-did case. Here, contemporaneous dissent shows that a standard was possible, but the theory must clarify if dissent makes the standard available or just possible. The case of abolitionists criticizing slavery despite its prevalence is key. The requirement is to assess the epistemic context without conflating possibility with availability. This is also non-negotiable as it affects historical accuracy.

  The archive-silence case deals with power shaping records. Absence of dissent in archives doesn't prove no dissent existed. The requirement is to avoid equating archival silence with lack of dissent, recognizing the influence of power on documentation. Non-negotiable due to critical historiography's focus on archival critique.

  For collective-agent cases, entities like colonial offices pose challenges in identifying who knew what. The requirement is to handle distributed agency and knowledge without oversimplifying. Non-negotiable for institutional histories.

  The temporal-symmetry case questions if judging the past allows future judgments on us. The theory must either explain the asymmetry or reject it. Historians prefer asymmetry, making this a preference. The retrospective-uptake case involves modern endorsement of condemnations, like statue removals. The requirement is to distinguish between historical evidence and present use. Non-negotiable to maintain disciplinary integrity.

  Self-application requires acknowledging that our standards are historical products. The theory must apply its own principles reflexively. Non-negotiable for coherence.

  Now, I need to check if all requirements can be jointly satisfied. The epistemic access vs. present moral engagement tension might be a sticking point, especially with temporal symmetry. Highlighting this conflict is crucial for the user.

  The most demanding requirement is the unavailable-concept case, as it forces clear definitions of availability and latency, impacting many other areas.

  For existing theories: strict contextualism focuses on contemporaneous standards, failing on self-application. Relativism-of-distance avoids modern judgments but struggles with dissent cases. Thoroughgoing presentism embraces modern standards but falters on anachronism and symmetry.

  The user's deeper need is a practical framework that helps historians navigate ethical judgments without theoretical pitfalls. They might also want to expose tensions in existing approaches, showing why a perfect solution is elusive. Ensuring clarity on each point and flagging conflicts will strengthen their chapter's argument.
answer: |-
  Here is a specification for an adequate account of anachronism, focusing on what it must *do* for a working historian, driven by your cases and distinctions:

  1.  **Handle Concept Availability:** Distinguish standards *actually available* to historical agents (via contemporary discourse, law, religion, etc.) from those *latent* (logically derivable from existing ideas but not articulated) and *genuinely unavailable* (requiring later conceptual frameworks). **Case:** Condemning an 18th-century planter using "structural racial exploitation." **Must:** Determine if fault applies only for failing against *available* standards, not for failing to invent *latent* ones. **Distinguish:** Blameworthiness (based on contemporary availability) vs. Justification (using present understanding to explain harm). **Status:** Non-negotiable (Core to avoiding anachronism).
  2.  **Account for Contemporaneous Dissent:** Treat the existence of contemporaneous critics/dissenters as evidence that a critical standard was *possible*, requiring analysis of *why it wasn't dominant* (marginalization, power, cost) rather than proof it was universally unavailable. **Case:** Abolitionists criticizing slavery while most accepted it. **Must:** Assess the epistemic and social context explaining the dissent's limited reach. **Distinguish:** Availability (was the standard *knowable*?) vs. Possibility (could it *exist*?). **Status:** Non-negotiable (Vital for critical historiography).
  3.  **Address Archival Silences:** Recognize that the absence of recorded dissent within archives shaped by power does *not* reliably indicate the absence of dissent or critical consciousness *at the time*. **Case:** Lack of recorded slave revolts/arguments doesn't prove acceptance. **Must:** Incorporate methodologies sensitive to power's distortion of the historical record without requiring definitive proof of dissent. **Distinguish:** Evidence of contemporary standards (often archival) vs. Causal explanation for silence (power dynamics). **Status:** Non-negotiable (Critical historiography's methodological imperative).
  4.  **Analyze Collective Agency:** Provide tools to attribute knowledge, responsibility, and capacity for action to collective entities (states, companies, institutions) without anthropomorphizing them or ignoring internal complexity. **Case:** Judging the British East India Company's actions/policies. **Must:** Clarify the mechanisms of decision-making, knowledge circulation, and responsibility distribution within the collective. **Distinguish:** Moral evaluation of the *entity's actions/impact* vs. Blameworthiness of *specific individuals* within it. **Status:** Non-negotiable (Essential for modern political/social history).
  5.  **Address Temporal Symmetry:** Either explicitly *reject* the symmetry (future judgments of us are irrelevant to the validity of our judgments of the past) or provide a *principled justification* for asymmetry that doesn't rely on presentist bias. **Case:** Historian resisting future judgment using unknown standards. **Must:** Forbid the symmetry *or* explain why present judgments are uniquely legitimate/possible. **Distinguish:** Propriety of blaming *now* vs. Hypothetical future blameworthiness. **Status:** Preference (Camp-dependent: Most historians implicitly prefer asymmetry).
  6.  **Clarify Retrospective Uptake:** Treat contemporary endorsement/rejection of historical judgments by affected groups (e.g., descendants) as relevant to the *present political/moral significance* of the judgment, but *not* as direct evidence about the *historical availability* of the standard or the *blameworthiness* of past agents. **Case:** Removal of statues & official apologies. **Must:** Separate the historical analysis (what happened, what standards existed) from the present-day use and resonance of that analysis. **Distinguish:** Historical verdict (based on evidence) vs. Present use/politics (uptake). **Status:** Non-negotiable (Maintains disciplinary integrity vs. present politics).
  7.  **Enable Self-Application:** Acknowledge that the critical standards and concepts used by the historian are themselves historically situated. The account must apply reflexively to its own conceptual tools. **Case:** Using "class" or "gender" concepts born in the 19th century to analyze earlier periods. **Must:** Allow for the *critical historicization* of the historian's own analytical framework without automatically invalidating its use. **Distinguish:** The historical emergence of a concept vs. Its analytical utility for understanding the past. **Status:** Non-negotiable (Intellectual honesty & reflexivity).

  **Assessment:**

  *   **Joint Satisfiability:** Points 1, 2, 3, 4, 6, and 7 are jointly satisfiable by a sophisticated, critical contextualism that incorporates reflexivity and power analysis. **Point 5 (Symmetry)** creates the most significant tension. Theories embracing symmetry (e.g., some forms of strict presentism) struggle with historians' intuitive resistance. Theories rejecting symmetry need a non-question-begging justification. This is the primary friction point.
  *   **Most Demanding Requirement:** **Point 1 (Concept Availability)** is the most demanding. Successfully distinguishing actual availability, latency, and genuine unavailability, and adjudicating fault based on this, requires deep contextual knowledge and robust definitions, impacting nearly every other requirement.
  *   **Non-negotiable vs. Preference:** Points 1, 2, 3, 4, 6, 7 are **non-negotiable** for an account aiming at critical historical rigor suitable for a monograph addressing power and injustice. Point 5 (Symmetry) is a **preference**, heavily influencing the *type* of theory adopted.

  **Theories in One Line:**

  1.  **Strict Contextualism:** Judges *only* by contemporaneous standards (satisfies 1, 2 partially, 3 poorly, clashes with 6, 7).
  2.  **Relativism-of-Distance:** Argues moral judgments across large temporal gaps are meaningless/invalid (satisfies 5 symmetry, rejects 6, clashes with 2, 4, 7).
  3.  **Thoroughgoing Presentism:** Embraces judging the past by present standards as necessary and legitimate (embraces 5 asymmetry & 6 uptake, struggles with 1 anachronism, 3 silence, 7 reflexivity).
