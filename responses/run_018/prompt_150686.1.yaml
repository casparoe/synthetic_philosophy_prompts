     - Half: This is assimilation in reverse; forcing visitors to adopt specific cultural frameworks to participate, violating procedural neutrality (laïcité-style).

   We need to:
     - Recommend: approve, reject, or approve with conditions.
     - Include a concrete timeframe (e.g., 8-week pilot, binding by next semester).
