answer: |-
  Here is a prioritized research agenda for "low-impact" agent design without value specification, defended by explicit criteria and structured by dependency. The ordering balances tractability with current tools, foundational dependencies, and practical relevance to deployment constraints. Dead ends are identified where progress is unlikely to change constraint design.

  **Core Criteria:**
  1.  **Tractability (T):** Can be attacked with mature formal tools (causal graphs, info theory, distributional robustness, equilibrium analysis).
  2.  **Downstream Dependency (D):** Progress here is prerequisite for meaningful work on other issues. Blockers come first.
  3.  **Practical Relevance (P):** Directly informs feasible, testable deployment constraints for real agents, avoiding purely theoretical tangles.
  4.  **Avoiding Value Smuggling (V):** Potential to sidestep the core problem of implicitly encoding "what matters."

  **Ranked Research Priorities (1 = Highest Priority):**

  1.  **Formalizing & Testing Counterfactual Stability (CFS) Robustness**
      *   **Question:** Under what formal conditions (causal structure, uncertainty classes, reference distributions) does CFS ("don't change outcomes in branches where you weren't activated") yield *operationalizable, robustly measurable* constraints? How sensitive is it to model misspecification?
      *   **Why #1 (T, D, P):**
          *   **T:** Leverages causal inference (SCMs, do-calculus, counterfactual estimation) and distributional robustness (ambiguity sets). Concrete experiments possible with simulated agents in toy causal environments.
          *   **D:** CFS is a *foundational framing*. Until we know if it can be made robustly measurable and what its failure modes are, building constraints on top is premature. It directly challenges the "distance metric" problem.
          *   **P:** If robust, CFS offers a *directly implementable* constraint: "Minimize || P(Outcome | Do(Action), ~Activate) - P(Outcome | Do(Null), ~Activate) || under robustness set." This is testable pre-deployment.
          *   **V:** Avoids defining "good/bad" changes; focuses purely on *agency attribution*. Potential to avoid direct value smuggling.
      *   **Trade-off:** May be overly conservative if "Activate" is poorly defined or if the agent *should* correct pre-existing problems. Requires defining the counterfactual distribution, which is non-trivial.
      *   **Re-prioritization Trigger:** Proof that robust measurement of the counterfactual distribution under realistic uncertainty is fundamentally impossible or requires value-laden priors equivalent to the original problem.

  2.  **Distinguishing & Quantifying Epistemic Side-Effects (ESE)**
      *   **Question:** Can "changes to what others can learn" be cleanly separated from physical state changes *operationally*? Can we define scalable, non-value-laden metrics for "information loss/gain for potential observers" (e.g., channel capacity reduction, irreversibly destroyed data sources, induced biases)?
      *   **Why #2 (T, D, P, V):**
          *   **T:** Builds on information theory (channel capacity, mutual information), learning theory (sample complexity, bias-variance), and causal influence measures. Formalizable within existing math frameworks.
          *   **D:** ESE is conceptually distinct (targeting knowledge acquisition, not state) but its *operationalization* depends on resolving *what constitutes an "observer/system"* and *what information matters*. Requires progress on minimal observers/data sources.
          *   **P:** Captures critical risks ignored by physical-state metrics (e.g., erasing evidence, manipulating data streams, creating filter bubbles). Directly relevant to safety-critical monitoring and auditing.
          *   **V:** Focuses on *preserving learning potential*, potentially avoiding judgments about *specific* desirable states. Targets a meta-capacity (knowledge acquisition) often considered instrumentally valuable.
      *   **Trade-off:** Risk of regressing into defining "valuable" information. Requires defining the relevant observer class and epistemic goals minimally.
      *   **Re-prioritization Trigger:** Proof that any non-trivial ESE metric inevitably requires specifying what knowledge is valuable, collapsing back into value specification.

  3.  **Separating Worst-Case vs. Average-Case Guarantees Without Values**
      *   **Question:** Can we derive *tractable* constraints that bound worst-case impact (avoiding catastrophic side-effects) using *only* structural knowledge (causal graphs, information bounds, action sets) and robustness tools, *without* invoking a preference ordering? How do these relate to average-case impact under neutral assumptions?
      *   **Why #3 (T, P, D):**
          *   **T:** Uses distributional robustness (minimax regret, ambiguity sets over environments/outcomes), game theory (adversarial perturbations), safety margins. Averages-case is often easier but less safety-critical.
          *   **D:** Depends on having candidate constraint *forms* (like CFS or ESE metrics) from #1/#2 to analyze. Crucial for designing *safe* constraints.
          *   **P:** Deployment requires *safety guarantees*. Worst-case bounds are essential for high-stakes scenarios. Showing separation clarifies when average-case is sufficient (low risk) vs. when worst-case is needed (high risk).
          *   **Avoids Values?:** Focuses on *feasibility of outcomes* (e.g., "prevent destruction of resource X") or *structural properties* (e.g., "don't reduce channel capacity below threshold") rather than desirability. May avoid *direct* value specification.
      *   **Trade-off:** Worst-case constraints are often more conservative/restrictive. Defining the "case" (adversary's power, ambiguity set) involves unavoidable assumptions.
      *   **Re-prioritization Trigger:** Discovery that meaningful worst-case guarantees *without* implicit value judgments are only possible for trivial environments or require assumptions equivalent to partial value specification.

  4.  **Reference Class Problem for Conservative Action Selection**
      *   **Question:** Can "safe" reference classes of actions/agents be defined algorithmically based on *functional equivalence* (causal effects, information processing limits) and *robustness to class misspecification*, avoiding anthropocentrism?
      *   **Why #4 (T, P):**
          *   **T:** Uses similarity metrics based on causal influence, functional equivalence classes, and robustness analysis. Testable in simulation.
          *   **P:** Directly addresses a popular deployment heuristic ("act like a harmless reference agent"). Making this rigorous is practically useful.
          *   **Lower D:** While important, progress here is less foundational than #1-3. It builds upon notions of impact/agency.
      *   **Trade-off:** Defining "functional equivalence" without values is hard. Risk of the reference class itself smuggling in values or being too narrow/broad.
      *   **Dead End Risk:** High. The core problem (defining "harmless" or "normal" without values) is deeply entangled with value smuggling. **Likely overrated for changing constraint design.** Even if solved, the *choice* of reference class remains value-laden. Prioritize lower unless breakthroughs occur in #1-3 that make this tractable.

  5.  **World-State Distance Metric Foundations**
      *   **Question:** Is there *any* formalism for state-difference metrics (divergences, earth mover's distance) that avoids value smuggling *and* is robustly applicable to open-world domains?
      *   **Why #5 (Low P, High Dead End Risk):**
          *   **Tractable?** Mathematically definable, but robust operationalization in complex state spaces is intractable without value-laden feature selection/normalization.
          *   **Dependency:** Logically prior to some penalty designs, but progress is blocked by the value-smuggling problem.
          *   **Practical Relevance (Low):** Deployment constraints based on state differences are notoriously brittle and require extensive, value-laden calibration. Unlikely to be reliably safe.
          *   **Value Smuggling (V):** **Fundamental Dead End.** *Any* non-trivial metric that distinguishes "significant" from "insignificant" state changes *must* encode what is significant, i.e., what is valued. This is the core obstacle stated in the problem. Research here should focus on *why* it fails, not salvage attempts.
      *   **Recommendation:** **De-prioritize.** Focus resources elsewhere. Use results from #1 (CFS) and #2 (ESE) as potential *replacements* for state-distance metrics.

  **Addressing Specific Queries:**

  *   **CFS & ESE: Distinct Paths?** **Yes, genuinely distinct.**
      *   *CFS* focuses on *agency attribution and counterfactual responsibility*. Its core question is: "Would this outcome have happened anyway, even if I didn't exist/act?" It's fundamentally about *causal responsibility* relative to an inactive baseline.
      *   *ESE* focuses on *epistemic externalities*. Its core question is: "Does this action degrade (or unfairly manipulate) the ability of other agents/systems to learn about the world or make informed decisions?" It targets the *informational commons*.
      *   While both avoid direct physical state changes as the primary concern, their mechanisms and targets (causal responsibility vs. information flow) are fundamentally different. They require distinct formal toolkits and face unique challenges (defining counterfactuals vs. defining observers/information value).

  *   **Worst-Case vs. Average-Case Separation Without Values?** **Partially feasible.** We *can* formally separate them using robustness tools:
      *   *Worst-Case:* Use minimax optimization or distributionally robust constraints over an ambiguity set defined by *structural knowledge* (e.g., plausible environment dynamics, bounded action effects, causal independence assumptions). This bounds impact under adversarial or highly uncertain conditions without specifying "good/bad," only "feasible/possible."
      *   *Average-Case:* Often defined as expected impact under a *neutral* or *maximum entropy* prior distribution over outcomes/values. This requires weaker assumptions but offers weaker safety guarantees.
      *   **Key Limitation:** Defining the *scope* of the worst-case (the ambiguity set/adversary's power) or the *neutral prior* unavoidably involves assumptions that *could* encode values. However, these assumptions are often about *ignorance* (what we don't know) or *plausibility* (physics, sensor limits) rather than explicit desirability. Separation is tractable but the assumptions need careful scrutiny for implicit bias.

  *   **Conceptual Coherence Conditions:** The project is coherent **only if** at least one of the following holds:
      1.  **Value-Neutral Side-Effects Exist:** There exist side-effects (e.g., widespread resource destruction, irreversible information loss, severe restriction of future options) that are *objectively* instrumentally negative for *almost any* plausible value system. (Focus of #2 & #3).
      2.  **Responsibility Attribution is Value-Free:** Defining an agent's *causal responsibility* for changes relative to its non-existence/non-activation can be done robustly without needing to judge the *desirability* of those changes (Focus of #1).
      3.  **Structural Constraints Suffice:** Safety can be achieved by limiting an agent's *capabilities* (action space, information processing, influence scope) defined purely by physical/causal structure, irrespective of intent or values, such that harmful side-effects become physically impossible (Related to #3 & #4).
      *   If *none* of these hold, then defining "low-impact" without value specification is likely incoherent – avoiding impactful changes *requires* knowing what impact matters. Priority #1 (CFS) directly tests condition 2. Priority #2 (ESE) and #3 (Worst-case) test aspects of condition 1. Priority #4 tangentially relates to condition 3.

  **Conclusion:** The critical path starts with rigorously grounding Counterfactual Stability (Priority #1), as it offers the most direct path to an operationalizable constraint that potentially avoids value smuggling. Simultaneously, formalizing Epistemic Side-Effects (Priority #2) addresses a distinct and critical risk class. Understanding the Worst-Case/Average-Case distinction (Priority #3) is essential for translating these concepts into *safe* constraints. Efforts on reference classes (Priority #4) and salvaging state-distance metrics (Priority #5) should be minimized unless breakthroughs in #1-#3 provide new foundations for them. The coherence of the entire project hinges on demonstrating the feasibility of either robust responsibility attribution (CFS) or identifying robustly undesirable side-effect classes (ESE/Worst-case).
