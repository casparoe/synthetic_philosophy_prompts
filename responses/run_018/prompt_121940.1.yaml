  The concept theorists' objections are less damaging. For prototypes, I'll position the core as the invariant part of the prototype. For exemplars, I'll note that core violations break categorization even with multiple exemplars. Confidence is medium-high.

  The question I hope nobody asks: "What neural evidence supports this core beyond behavioral tests?" That would expose the theory's weakest link—it's currently all inference from reading behavior.

  Ultimately, the shakiest claim is the proposed core formulation itself ("enclosing a counter at x-height"). Alternative cores could likely satisfy the transplant test. I should emphasize its provisional nature during the talk.
answer: |-
  Here is your prep sheet, ordered by damage potential. The most damaging objection is the ML doctoral student's challenge to your core's necessity, as it undermines your entire theoretical framework.

  ---

  ### **1. ML Doctoral Student (Style Transfer)**  
  *Objection:* "Your 'core' sounds like an arbitrary latent-space direction that survives when we condition a diffusion model on 'a-ness'. Why not reduce it to that? Style transfer shows identity *is* manipulable geometry once you have enough data."  
  **Reply (Medium Confidence):** "Because the transplant test reveals *causal* discriminative features, not statistical correlations. A diffusion model might generate non-‘a’ shapes that correlate with ‘a’ in training data but fail the graft test. The core isn’t ‘whatever survives conditioning’—it’s what *causes* identification when transplanted."  
  **Soft Spot:** Conflates behavioral causality with statistical patterns. You lack evidence that ML models *couldn’t* replicate the core functionally.  

  ### **2. Metaphysician (Natural Kinds Realist)**  
  *Objection:* "You disavow geometric essences but smuggle in a *functional* essence with your 'core'. If this core is necessary/sufficient for being an ‘a’, it’s just essence relabeled."  
  **Reply (High Confidence):** "The core isn’t an essence—it’s a *discriminative threshold* for human visual processing. Like a protein fold’s conserved residues, it’s defined by intervention (the graft test), not intrinsic properties. It’s defeasible by cognitive or cultural shifts."  
  **Soft Spot:** Your core *is* necessary/sufficient in your model. Concede early: "I use ‘core’ pragmatically, not metaphysically."  

  ### **3. Type Designer (Historical Lineages)**  
  *Objection:* "Letterforms are historical artefacts with phylogenetic trees. Your ‘convergent evolution’ of single/double-storey ‘a’ ignores that both descend from Roman capitals. This isn’t convergence—it’s divergence with shared ancestry."  
  **Reply (Medium Confidence):** "Descent explains *why* forms exist, but not why readers *treat* structurally distinct shapes (e.g., single vs. double-storey) as the same category. My framework addresses the cognitive tolerance of variation, not design history."  
  **Soft Spot:** Overstates divergence; both ‘a’ forms may share deeper structural constraints.  

  ### **4. Philosopher of Language (Twin Earth)**  
  *Objection:* "On Twin Earth, suppose ‘a’ has your core but evolved from zebra stripes. Does it refer to the same thing? If not, your core fails to fix reference."  
  **Reply (Medium-Low Confidence):** "I’m not fixing reference—I’m explaining categorization. Twin Earth ‘a’ would be read as ‘a’ *if* it passes the transplant test in *our* visual system. Biology grounds the core, not history."  
  **Soft Spot:** Transplant test assumes human cognition—fails for alien readers.  

  ### **5. Prototype Theorist (Concepts)**  
  *Objection:* "Why posit a ‘core’? Prototype theory handles variant ‘a’s via family resemblances. A blob with your ‘core’ but no curves might still not be a good ‘a’."  
  **Reply (High Confidence):** "The core explains why some features are *non-negotiable*. A prototype’s central tendency still needs a boundary. The graft test shows violations of the core *collapse* categorization, while style variations don’t."  
  **Soft Spot:** Prototypes could absorb "core" as a weighted feature.  

  ### **6. Exemplar Theorist (Concepts)**  
  *Objection:* "Competent readers recognize ‘a’ by comparing to exemplars. Your ‘core’ is redundant—exemplar clusters naturally include style variants but exclude core-violating grafts."  
  **Reply (Medium Confidence):** "Exemplars don’t explain *why* grafts fail. The core predicts which features will *break* recognition across all exemplars. It’s the invariant scaffold underlying exemplar variance."  
  **Soft Spot:** Exemplar models can incorporate invariance detection.  

  ### **7. Graduate Student (Letter Spirit)**  
  *Objection:* "Letter Spirit failed because generating *coherent style* across letters is NP-hard, not due to your structural core. Style is relational—changing ‘a’ affects ‘g’."  
  **Reply (Medium Confidence):** "Precisely! Style coherence requires constraints *between* letters (e.g., stroke modulation). But without a core for *each* letter, style transfer has no anchor. Letter Spirit’s ‘fluid concepts’ lacked discriminative cores."  
  **Soft Spot:** Speculative; you lack insider knowledge of Letter Spirit’s architecture.  

  ---

  ### **Key Concessions to Make Early**  
  - **"I am not proposing a metaphysical essence. ‘Core’ is a shorthand for the minimally sufficient features that *cause* identification under intervention."**  
  - **"The core is provisional. My formulation (enclosed counter, etc.) is a hypothesis—the graft test is the real workhorse."**  

  ### **The Question You Hope Nobody Asks**  
  *"What neural or developmental evidence supports your ‘core’ beyond behavioral grafts? If it’s a cognitive primitive, show me the mechanism."*  
  **Why it’s deadly:** Your model is top-down and lacks empirical grounding in vision science. Reply tentatively: "This points to testable fMRI/EEG work—e.g., does violating the core elicit N400 errors?" (Low Confidence).  

  ### **Your Shakiest Claim**  
  Your proposed core formulation (**"enclosing a counter segmented as enclosed at x-height with no ascender"**) is vulnerable. Counterexamples:  
  - Some handwritten ‘a’s lack enclosed counters (e.g., open-top).  
  - ‘æ’ ligature has an enclosed counter but isn’t ‘a’.  
  **Mitigation:** Emphasize the graft test as the operational definer, not the description.  

  Bottom Line: Anchor replies in the **transplant test** as your empirical foundation. Deflect metaphysics by stressing cognitive function over ontology.
