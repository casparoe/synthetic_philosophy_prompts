  For the metaphysician's objection about promissory essences, I'll argue for a deflationary "discriminative core" to avoid metaphysical baggage. But conceding early that this isn't a traditional essence is wise—it disarms later gotcha moments. Confidence here is high; it's a strategic retreat.

