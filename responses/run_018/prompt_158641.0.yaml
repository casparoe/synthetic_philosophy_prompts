prompt: |-
  hey so i'm working on this problem about whose values an aligned AI should actually serve, and i want the full desiderata for any theory that claims to solve it through value aggregation while still respecting liberal neutrality. i need hte spec: what cases it has to get right, like serving a population where some members reject aggregation entirely or where the system's own preferences about whose values count shift under recursive self-improvement, the distinctions it can't collapse (procedural fairness vs substantive neutrality, present users vs hypothetical future ones, first-order values vs second-order preferences about the aggregation rule itself), and whatever results from social choice or decision theory it can't violate without being incoherent. for each requirement tell me the case behind it and flag which ones you think can't be jointly satisfied, especially given arrow-type issues or the paradox that liberal neutrality sometimes demands we stay neutral about neutrality itself. also inject the idea that the aggregation mechanism might become an object of preference for the system as it updates its own reasoning architecture -- i think that's where most theories break but i'm not sure. write it all as continuous prose, no headings no bullet points no bold no tables, just like an email. dont ask for citations or a reading list, i can't chase papers right now. briefly score a contractualist approach and a weighted deliberative model against your list, but keep the weight on the criteria, not the scorecard.
