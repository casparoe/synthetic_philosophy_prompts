answer: |-
  You've hit on a profound tension in effective altruism and decision theory: **how to act meaningfully under deep uncertainty when lives are at stake.** Your instinct that "expected value with made-up probabilities is fake precision" is spot-on—and your portfolio idea addresses core problems your roommate's approach ignores. Let's break this down:

  ### The Problem with "Best-Guess Expected Value"
  1. **Garbage-In-Garbage-Out Risk**: Assigning probabilities to events like "tiny nonprofit triggers global carbon tax shift" is guesswork. A 1% vs. 5% chance wildly changes the outcome, but neither is evidence-based.
  2. **Overlooking Tail Risks**: Even if the *median* outcome is bad, a tiny chance of massive impact (e.g., systemic policy change) might dominate expected value—but humans suck at intuiting extreme tail probabilities.
  3. **Hidden Biases**: We anchor to probabilities that feel plausible (e.g., 10%), but these often reflect narrative appeal over reality.

  ### Why Diversification ("Moral Portfolio") Isn't Just Spreading Ignorance
  Your five-way split tackles key issues:
  - **Epistemic Humility**: You're admitting you *can't* know which cause is optimal. Spreading bets hedges against being wrong.
  - **Risk Pooling**: Different causes have uncorrelated failures. Climate policy might flop while animal welfare wins a major victory.
  - **Value Diversification**: You're balancing concrete near-term good (bednets), speculative giant wins (climate/risk research), and local/personal impact (housing). This isn't irrational—it's acknowledging multiple moral priorities.

  **But**: Diversification doesn't *eliminate* uncertainty; it *manages* it. If your goal is purely "save the most lives probabilistically," spreading too thin could sacrifice upside. The fix? **Structured diversification**:

  ---

  ### A Better Framework: "Uncertainty-Tolerant Allocation"
  1. **Split by "Near-Term Certainty" vs. "Long-Term Speculative" Buckets**:
     - **Anchor Bets (40-60%)**: High-certainty, evidence-based giving (e.g., bednets, cash transfers). *This is your moral floor: know you're doing unambiguous good.*
     - **Speculative Bets (20-40%)**: High-upside, hard-to-measure causes (climate policy, risk research). *Accept that these might fail, but capture transformative potential.*
     - **Personal Values (10-20%)**: Causes like local housing that resonate with you. *Prevents burnout and honors non-utilitarian values.*

  2. **Apply "Robust Optimization" Within Buckets**:
     - For speculative bets (climate/risk research), fund *multiple approaches*: e.g., policy + tech + movement-building. Avoid betting on single orgs.
     - For animal welfare, combine proven wins (corporate cage-free campaigns) with speculative ones (cultured meat advocacy).

  3. **Use "Minimax Regret" for Climate Nonprofit**:
     Ask: *"Which outcome would I regret more?"*
     - **Regret A**: Betting $250k on climate org → it flops → you saved 0 lives.
     - **Regret B**: Not funding it → it succeeds without you → missed civilization-level impact.
     If B feels worse, allocate *part* of speculative bucket (e.g., $20k–$50k) to them. Not all-or-nothing.

  ---

  ### When Expected Value *Is* Useful (and When It Isn't)
  - **Use EV for "Shallow Uncertainty"**: Bednets *do* have robust cost-per-life-saved data. Here, EV calculations are valid.
  - **Reject EV for "Deep Uncertainty"**: For causes with unknown probabilities (e.g., "will this climate model shift policy?"), use:
    - **Scenario Planning**: Allocate based on *plausible futures* (e.g., "If carbon taxes rise in 5 years, how valuable was this bet?").
    - **Diversification as a Hedge**: Your portfolio *is* a rational response to deep uncertainty.

  ---

  ### Proposed Allocation (Example)
  | **Bucket**       | **Allocation** | **Causes**                                                                 | **Why**                                                                 |
  |-------------------|----------------|----------------------------------------------------------------------------|--------------------------------------------------------------------------|
  | **Anchor Bets**   | 50% ($125k)    | Top GiveWell charities (bednets, cash transfers)                           | Maximize near-term certainty; saves lives *now*                         |
  | **Speculative**   | 30% ($75k)     | Climate policy (multiple orgs) + AI risk research + farm animal advocacy   | Captures high-upside, systemic change; diversifies speculative risks    |
  | **Personal**      | 20% ($50k)     | Local affordable housing + "fun money" for passion projects                | Sustains motivation; addresses local roots                              |

  - **For the climate nonprofit**: Pull from speculative bucket ($15k–$30k). Enough to matter if they win, not catastrophic if they lose.
  - **Invest mechanics**: Park the full $250k in a low-cost index fund (e.g., VTI/VXUS). Donate 4% annually ($10k year 1). Adjust allocations as you learn.

  ---

  ### Bottom Line
  **Diversifying isn't "spreading ignorance"—it's a rationally humble response to unquantifiable uncertainty.** By combining evidence-based giving, high-impact speculation, and personal meaning, you avoid the false choice between reckless gambling and ignoring tail risks. Your portfolio approach is *more* rigorous than fake-precision EV when probabilities are unknowable.

  > "It is better to be roughly right than precisely wrong."  
  > — *John Maynard Keynes* (who knew a thing or two about uncertainty)
