prompt: |-
  I need help figuring out whether I've broken my code or broken probability theory. I'm a software engineer, no formal philosophy or stats training, and I was messing around with a simulation of a betting game a friend pitched me over beers. The game: flip a fair coin until it comes up heads. If the first heads lands on flip n, the payout is 2^n divided by n dollars -- but with a twist: if n is even, you PAY that amount instead of winning it. So flip 1 pays +$2, flip 2 costs you $2, flip 3 pays +$8/3, flip 4 costs you $4, and so on, the stakes ballooning while the sign alternates. I wanted the fair entry fee, so I did what I always do and wrote the expected value as a sum. Each outcome has probability 1/2^n, the powers of two cancel, and the terms come out to +1 − 1/2 + 1/3 − 1/4 + ..., which I half-remembered is the alternating harmonic series, equal to about 0.693. So: fair price 69 cents, done, pub trivia solved.

  Except then I actually ran the simluation, and the running average per trial does not settle at 0.693 or anywhere else. It hovers around small numbers for ages, then some freak trial hits a long run of tails before the first heads and the average gets yanked up or down by hundreds or thousands of dollars, and these kicks keep arriving no matter how many millions of trials I run, alternating in direction. My friend insists the sim must be buggy because "the math says ln 2." But I noticed something unsettling: if I group or reorder the terms of that infinite series differently -- which feels like it shouldn't matter, addition is commutative, right? -- I can make the sum come out to basically anything I want. So now I suspect the series only converges in some fragile, order-dependent way, and that the game might not have an expected value at all. Not even "infinity" like that famous St. Petersburg game, which at least gives you an answer of sorts.

  So my question: does this situation have a name -- a game whose expectation isn't merely huge or infinite but fails to exist because the positive and negative parts each blow up on their own? I don't want just a bare label, though. What are the closest established concepts (the St. Petersburg paradox? heavy-tailed distributions with no defined mean, like that Cauchy thing? whatever the reordering phenomenon is called in calculus?), how does my game differ from each, and which pigeonhole does it actually belong in? And practically: does the non-existence of an expectation mean there's simply no fact of the matter about a fair entry fee, or do people who study rational choice have workarounds? Please lead with your bottom line in the first sentence -- roughly, "yes, this is known as X" or "no clean name exists, but here's the carving" -- then give the reasoning, no preamble or restating my question.
reasoning: |-
  Okay, let me tackle this user's problem. They're a software engineer who simulated a betting game with alternating payouts based on coin flips. The expected value calculation gives the alternating harmonic series (ln2 ≈ 0.693), but their simulation shows erratic averages that don't converge. They suspect the expectation might not exist due to how rearranging series terms changes the sum.

  First, I recall that the alternating harmonic series is conditionally convergent. That means it converges to ln2 only when terms are in order. Riemann proved that rearranging such series can yield different sums or even diverge. Here, the terms are (-1)^{n+1}/n. If separated into positive and negative parts, each forms a harmonic series, both divergent. This matches the user's observation that grouping terms differently changes the sum. So the core issue is conditional convergence.

  Comparing to the St. Petersburg paradox: there, expected value is infinite but exists. Here, the positive and negative parts each diverge, so the expectation doesn't exist. Unlike heavy-tailed distributions like Cauchy, which lack a mean due to slow tail decay, this game's payouts have exponential growth, but the sign alternation causes divergence in both directions. Key difference: Cauchy's mean is undefined because of integral divergence, while here it's the series' conditional convergence.

  The user's simulation behaves erratically because large negative payouts on even n and large positives on odd n cause the average to swing wildly. Since the series doesn't absolutely converge, the law of large numbers doesn't apply. No matter how many trials, outliers will dominate, aligning with their experience of "kicks" from long tails runs.

  Practical implications: Without a defined expectation, there's no single fair price. However, decision theory might offer workarounds like utility functions (diminishing marginal utility) or truncating the game. But fundamentally, no objective fair fee exists. The user might explore those approaches if they need a pragmatic solution.

  In summary, this is a case of conditional convergence in an infinite series, leading to a non-existent expectation. The closest concept is Riemann's rearrangement theorem, highlighting how the order of terms affects the sum. Unlike St. Petersburg, the issue isn't infinity but the lack of convergence when terms are separated. The game belongs in the pigeonhole of "games with non-integrable payoffs" or similar, but the key takeaway is the nonexistence of expected value.
answer: |-
  **Bottom line: Yes, this is a classic consequence of the Riemann rearrangement theorem applied to a conditionally convergent series, meaning your game has no defined expected value.**

  Here's the breakdown:

  1.  **The Series:** Your derivation is correct: the expected value is the alternating harmonic series, `S = 1 - 1/2 + 1/3 - 1/4 + 1/5 - ... = ln(2)`.
  2.  **Conditional Convergence:** This series **converges conditionally**, not absolutely. This means:
      *   The series `S` itself converges to `ln(2)` *when terms are summed in the standard order*.
      *   However, the series of absolute values `|S| = 1 + 1/2 + 1/3 + 1/4 + ...` is the harmonic series, which **diverges to infinity**.
  3.  **Riemann Rearrangement Theorem:** This fundamental theorem states that any conditionally convergent series can be rearranged to converge to **any real number**, or even to diverge to **+∞**, to **-∞**, or to oscillate without converging. This is *precisely* what you observed when trying to group or reorder terms. Your ability to make the sum "come out to basically anything" is not a bug; it's a direct consequence of conditional convergence.
  4.  **Implication for Expected Value:** For an expected value `E[X] = Σ (x_i * p_i)` to be well-defined (finite), the series must converge absolutely: `Σ |x_i| * p_i < ∞`. In your game:
      *   `Σ (Positive Terms) = Σ_{k=1}^∞ (1/(2k-1)) * (1/2^{2k-1})? Wait, let's clarify the payouts.`
      *   Actually, the payout magnitude for outcome `n` is `2^n / n`, with probability `1/2^n`.
      *   So `|x_i| * p_i = (2^n / n) * (1/2^n) = 1/n`.
      *   Therefore, `Σ |x_i| * p_i = Σ_{n=1}^∞ |Payout(n)| * P(n) = Σ_{n=1}^∞ (1/n)`.
      *   **This is the harmonic series, which diverges to infinity.**
  5.  **Why the Simulation Behaves Erratically:** Your simulation perfectly demonstrates the divergence of the absolute series:
      *   The positive parts (odd `n`: `+1, +1/3, +1/5, ...`) sum to `+∞`.
      *   The negative parts (even `n`: `-1/2, -1/4, -1/6, ...`) sum to `-∞`.
      *   The outcome of the infinite sum `1 - 1/2 + 1/3 - 1/4 + ...` depends entirely on the *order* in which these infinitely many positive and infinitely many negative terms are summed. The running average doesn't settle because the Law of Large Numbers **requires a finite mean to apply**. Without a finite mean, the sample average doesn't converge to any value. Extremely large positive payouts (very long odd runs before heads) pull the average sharply up; extremely large negative payouts (very long even runs) pull it sharply down. These "freak trials" *never* become negligible in influence because `Σ |x_i| * p_i = ∞`.
  6.  **Comparison to Other Concepts:**
      *   **St. Petersburg Paradox:** Here, the payout is `+2^n` for first heads on `n`, probability `1/2^n`. The expected value is `Σ (2^n * 1/2^n) = Σ 1 = ∞` (diverges absolutely). The mean *exists* but is infinite. Your game differs because the positive and negative parts *each* diverge.
      *   **Cauchy Distribution:** This is a probability distribution with undefined mean and variance. Its tails decay so slowly (`1/x^2`) that `∫ |x| f(x) dx = ∞`. Your game also has `Σ |x_i| p_i = ∞`, leading to an undefined mean, but the *mechanism* is different: it's caused by the alternating signs combined with the divergent harmonic series weights (`1/n`) rather than just very heavy tails. Both illustrate the requirement of `E[|X|] < ∞` for `E[X]` to be defined.
      *   **Pigeonhole:** Your game belongs squarely in the category of **random variables whose expectation does not exist** because `E[|X|] = ∞`. The specific mathematical phenomenon explaining the rearrangement behavior is the **conditional convergence** of the alternating harmonic series governed by the **Riemann Rearrangement Theorem**.

  7.  **Practical Implication for Fair Price:** The non-existence of the expectation means **there is no single, objective "fair" entry fee** defined by expected value. Rational choice approaches don't offer a single, universally agreed-upon workaround:
      *   **Utility Functions:** Using a concave utility function (like `log(wealth)` or `√wealth`) can force convergence because the utility of the large payouts grows slowly enough that `Σ |u(x_i)| p_i` might converge. This gives a finite "fair fee in utility", which can be converted back to dollars. The result depends heavily on the chosen utility function.
      *   **Truncation:** Imposing a practical limit on the maximum number of flips (e.g., stop after 100 tails) makes `E[|X|]` finite and forces convergence, yielding a fee around `ln(2)` for large truncation limits. This is often the most pragmatic approach but is fundamentally arbitrary.
      *   **Alternative Criteria:** Some might consider the median payout, the mode, or a fee that minimizes the probability of ruin, but these are different concepts from the "fair" fee based on expectation.

  **In essence:** Your math identified the alternating harmonic series `(ln(2))`, but the divergence of the harmonic series `Σ (1/n)` proves `E[|X|] = ∞`, meaning `E[X]` is undefined. The simulation correctly reflects this fundamental instability. Rearrangement changes the sum because the series is only conditionally convergent. There is no unique "fair" price based on expectation; the game is pathological in this regard.
