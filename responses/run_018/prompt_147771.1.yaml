prompt: |-
  I'm on the appeals board for our comparative governance PhD program, and we have a messy case that I think is actually philosophical but everyone is treating it like a compliance checkbox. A second-year student, let's call them M., did 14 months of fieldwork in a region where "facilitation gifts" to local gatekeepers—village elders, fixers, not state officials—are basically how you signal you're not just extracting data. M. documented every exchange in field notes, kept values under what the local admin calls "courtesy thresholds," but didn't declare them on the IRB form because the form only asks about payments to "government actors or institutional representatives." Now a reviewer from the funding body says this is textbook clientelism and wants M. sanctioned for failing to disclose corruption-adjacent conduct; another board member says Western anti-corruption frames are being weaponized against non-Western relational economies and we should clear M. with a note about form design.

  We need to write a decision memo—approve, reprimand, or approve-with-conditions—for the program director. The memo should take seriously the idea that corruption isn't just bribery of officials but involves structural asymmetries, and also the idea that universalizing Western transparency norms can erase legitimate "interactional gift economies" where reciprocity builds trust rather than buying outcomes. I want the memo to actually engage with whether clientelism requires a public-office nexus or can apply to private brokerage, and whether our ethics framework should be "institutional monist" (one rule everywhere) or "normative pluralist" (context-sensitive triage with reversibility checks). Don't just list philosophers—make it actionable, with a clear bottom line, and honestly address the strongest argument for the side you reject. Also please don't ask for citations or a reading list; I'm writing this for a committee that needs to decide by Friday and none of us have time to chase down references.

  Oh, and I was discussing this with my roommate who studies anthropology and they mentioned something about "thick description of exchange" vs "thin legalism"—feel free to use that framing if it helps, but don't turn it into a literature review. Just help us think through whether M. should be cleared with a revised disclosure protocol, or whether we need to draw a hard line. There's a typo in my notes: I wrote "interdisiplinary" but I meant interdisciplinary, haha. Anyway, can you draft the memo?
reasoning: |-
  Okay, the user is on an appeals board for a comparative governance PhD program dealing with a messy ethical case involving a student's fieldwork practices. They need a decision memo by Friday that avoids academic jargon but seriously engages with philosophical tensions around corruption definitions and cultural relativity. 

  First, let's unpack the core conflict: M.'s "facilitation gifts" to non-state actors weren't disclosed because the IRB form only mentions government/institutional payments. Now there's a sharp divide between two viewpoints - one seeing this as corruption-adjacent conduct requiring sanction, the other defending it as culturally embedded reciprocity. The user wants us to navigate this without oversimplifying.

  Hmm, the anthropology framing from their roommate is useful here - "thick description" (understanding context) vs "thin legalism" (rigid rules). M.'s documentation shows awareness of local norms ("courtesy thresholds"), but the funding reviewer isn't wrong to worry about slippery slopes. The real issue seems to be the IRB form's failure to anticipate non-state brokerage networks.

  The philosophical tension between institutional monism (one-size-fits-all rules) and normative pluralism (context-sensitive ethics) needs resolution. We can't fully endorse either extreme - blanket condemnation ignores relational economies, while unchecked pluralism risks ethical drift. Maybe a middle path: uphold disclosure as non-negotiable but redesign the protocol to capture non-state exchanges.

  For the decision, "approve with conditions" feels right: clear M. of bad faith but mandate retroactive disclosure plus IRB reforms. The memo must explicitly reject both the "weaponized transparency" argument (by stressing disclosure ≠ judgment) and the "just cultural difference" defense (by noting asymmetries still exist). 

  Biggest challenge will be making this actionable - hence concrete steps like revising IRB categories and adding ethnographic guidelines. The "reversibility check" idea (would this practice be acceptable if reversed?) is a neat way to operationalize pluralism without relativism.

  User's stress about Friday deadline means we must avoid theoretical tangents. No citations, but we'll subtly embed the key concepts: public-office nexus (distinguishing state vs non-state actors), clientelism spectrum, and gift economy legitimacy. Their typo correction shows attention to detail - we'll match that precision in the recommendations.

  Final thought: The memo's tone should model what we're advocating - principled but not dogmatic, acknowledging competing goods. Program director needs to see this as strengthening ethics, not punishing a student.
answer: |-
  ## Appeals Board Decision Memo: Case of Student M.  
  **To:** Program Director, Comparative Governance PhD Program  
  **From:** Program Appeals Board  
  **Date:** October 26, 2023  
  **Subject:** Determination Regarding Fieldwork Gifts & IRB Disclosure  

  **1. Core Issue:**  
  Whether Student M.’s undisclosed "facilitation gifts" to non-state local gatekeepers during fieldwork constitute a breach of research ethics requiring sanction, or reflect a mismatch between our ethical protocols and non-Western relational practices.  

  **2. Board Assessment:**  
  We find **no deliberate misconduct** by M. The IRB form’s narrow framing ("government actors or institutional representatives") created a structural blind spot for gifts in *non-state* relational economies. M.’s detailed documentation and adherence to local "courtesy thresholds" demonstrate contextual awareness. However, the **failure to disclose** these exchanges—regardless of intent—creates accountability gaps and valid concerns about normalizing asymmetrical power dynamics.  

  **3. Key Philosophical Tensions Addressed:**  
  *   **"Corruption" vs. Relational Reciprocity:**  
      - *Strongest Argument for Sanction:* Clientelism extends beyond public-office contexts when gifts create dependencies that distort social agency or research integrity ("structural asymmetry"). Universal disclosure norms prevent ethical drift.  
      - *Our Counter:* While power asymmetries exist, rigidly classifying these gifts as "corruption-adjacent" imposes a **thin legalism** that ignores M.’s **thick description** of exchanges as trust-building reciprocity within a documented cultural frame. Sanctioning M. penalizes contextual sensitivity.  
        
  *   **Institutional Monism vs. Normative Pluralism:**  
      - *Strongest Argument for Unconditional Approval:* Applying Western institutional definitions to non-Western gift economies is epistemically violent. Ethics must be **normatively pluralist**, allowing context-sensitive judgments with reversibility checks (i.e., "Would this practice be acceptable if researchers from this community studied *our* institutions?").  
      - *Our Counter:* Pluralism cannot mean non-disclosure. **Transparency is the minimum universalizable norm**, enabling oversight without prejudging legitimacy. The current IRB framework is **institutionally monist** in its blindness to non-state actors, failing pluralism’s core aim.  

  **4. Decision:**  
  **APPROVE WITH CONDITIONS**  

  **5. Conditions & Rationale:**  
  1.  **M. Submits Retroactive Disclosure:** M. must file a supplemental IRB report within 10 days detailing all gifts (recipients, values, contexts), referencing field notes. *Why:* Mandates transparency without invalidating the cultural logic of exchange.  
  2.  **No Formal Sanction:** M.’s adherence to local norms and the form’s limitations negate intent to deceive.  
  3.  **Mandatory IRB Protocol Revision:**  
      - Add a new IRB section: **"Non-State Brokerage & Gift Exchanges."**  
      - Require:  
          (a) Description of local gift/courtesy norms;  
          (b) Threshold justification (e.g., local "courtesy" benchmarks);  
          (c) Plan for documenting *all* exchanges;  
          (d) Assessment of power asymmetries/reversibility.  
      - *Why:* Shifts from **checkbox compliance** to **ethnographically informed disclosure**, aligning pluralism with accountability.  

  **6. Addressing the Strongest Counterargument:**  
  To the funding reviewer alleging "textbook clientelism": We agree undisclosed gifts risk normalizing opacity. **Disclosure is the necessary corrective**, not retroactive moral condemnation of M.’s acts. Our revised protocol directly addresses your concern by making power asymmetries visible for evaluation *before* approval, without requiring Western frames to override local relationality.  

  To the board member opposing "Western frames": We agree unconditional approval would signal that non-disclosure is acceptable in "relational" contexts. **Conditional approval upholds the irreducible norm of transparency** while forcing *our institution*—not just the student—to adapt its frameworks.  

  **7. Bottom Line:**  
  M. acted in good faith within flawed protocols. **Clear M. of wrongdoing, but require disclosure and fix the system.** The solution is neither weaponizing anti-corruption norms nor absolving non-disclosure, but building an ethics framework that demands contextual *description* alongside universal *transparency*. This is **principled pluralism in action**.  

  **Recommended Action for Program Director:**  
  1.  Notify M. of conditional approval (retroactive disclosure required).  
  2.  Charge IRB committee with revising protocols per Section 5.3 by end of term.  
  3.  Share this decision (anonymized) with funding body as evidence of substantive ethical engagement.  

  ---  
  **Signed,**  
  Program Appeals Board  
  *(This memo reflects unanimous board consensus.)*
