answer: |-
  Here's the translation and breakdown you requested, using only your predictive processing (PP) toolkit to reframe each emotion theory. I'll highlight clean mappings, necessary fudges, and irreconcilable gaps, followed by the residue analysis.

  ---

  ### **1. Judgment Theory (Nussbaum/Solomon)**
  *Philosophy:* Emotions *are* evaluative judgments about the world (e.g., "I judge this situation as a threat" *is* fear).  
  *PP Translation:* Emotions are **high-precision posterior beliefs** generated by a generative model, where **interoceptive/exteroceptive prediction errors** (PEs) have been minimized under **allostatic prior beliefs** about goal-relevance. The emotion *is* the winning hypothesis (e.g., "threat") with maximal precision-weighted evidence.  

  * **Clean Mappings:**  
    - **Judgment ≈ Posterior Belief:** The outcome of belief updating perfectly maps to the settled posterior state after PE minimization.  
    - **Evaluation ≈ Precision-Weighted Allostatic Priors:** The "evaluative" aspect is captured by priors encoding metabolic/social goals (e.g., "bodily integrity must be maintained") that weight PEs.  
    - **Cognitive Basis ≈ Hierarchical Inference:** Judgment's "propositional" nature fits PP's hierarchical generative models (concepts like "threat" exist as high-level predictions).  

  * **Twists/Fudges:**  
    - **Propositional Content:** PP beliefs are probabilistic *distributions* (e.g., 80% threat, 20% mistake), not discrete propositions. To map cleanly, we treat the *mode* of the distribution (e.g., "threat") as the "judgment."  
    - **Agency:** Philosophical judgments imply a "judger"; PP has only prediction error minimization. We fudge by calling the generative model's trajectory "judgment."  

  * **No PP Counterpart:**  
    - **Deliberate Reasoning:** Judgment theories often imply conscious deliberation. PP treats all cognition as unconscious PE minimization—deliberation is just iterative precision adjustment.  

  ---

  ### **2. Perception Theory (Prinz)**  
  *Philosophy:* Emotions *are* perceptions of bodily states (e.g., feeling a racing heart *is* fear).  
  *PP Translation:* Emotions are **interoceptive predictions** with high **precision weighting**, generated to explain **visceral prediction errors**. The "feeling" *is* the top-down prediction of bodily state (e.g., "high arousal") that best minimizes interoceptive PE.  

  * **Clean Mappings:**  
    - **Perception of Body ≈ Interoceptive Inference:** Prinz's core claim fits seamlessly—emotions *are* the brain's best guess of bodily causes (e.g., "this flutter is fear").  
    - **Bodily Focus ≈ Interoceptive PEs:** Visceral signals are unambiguous interoceptive PEs.  
    - **Feeling as Perception ≈ Precision-Weighted Prediction:** The vividness of emotion is precision weighting amplifying interoceptive predictions.  

  * **Twists/Fudges:**  
    - **"Dumb" Perception:** Prinz argues emotions are non-conceptual (like seeing red). PP *always* embeds interoception in a hierarchical model (e.g., "arousal" is inferred as part of "fear"). We twist by calling the *lowest level* of interoceptive prediction "non-conceptual."  
    - **Intentional Object:** Prinz says emotions represent "core relational themes" (e.g., fear represents danger). PP handles this via **hyperpriors** (e.g., "arousal + context = danger"), but this smuggles in judgment-like structure.  

  * **No PP Counterpart:**  
    - **Perception vs. Cognition Divide:** Prinz insists emotions *only* perceive the body, not the world. PP dissolves this—interoceptive predictions are shaped by exteroceptive context (e.g., a tiger vs. a treadmill).  

  ---

  ### **3. James-Lange Theory**  
  *Philosophy:* Emotions *are* the conscious experience of bodily changes (e.g., "I feel afraid *because* I tremble").  
  *PP Translation:* Emotions are **high-precision interoceptive prediction errors** that cannot be explained away by top-down predictions. The raw sensory signal (e.g., cardiac surge) *is* the emotion when **precision overwhelms generative model flexibility**.  

  * **Clean Mappings:**  
    - **Bodily Feeling as Core ≈ Unattenuated Interoceptive PE:** James-Lange's "raw feel" maps to interoceptive PE that hasn't been minimized (e.g., unexplained tachycardia).  
    - **Somatic Focus ≈ Primary Interoceptive Layer:** Focus on gut-level signals aligns with PP's primary sensory layers.  

  * **Twists/Fudges:**  
    - **Causality:** James-Lange says bodily changes *cause* emotion. PP inverts this: emotion (posterior belief) *causes* the predicted bodily change. We fudge by treating "unexplained PE" as the cause.  
    - **No Cognitive Mediation:** James-Lange denies top-down appraisal. PP *requires* a generative model to *interpret* bodily noise—so we call the most rigid (low-complexity) model "pure body feedback."  

  * **No PP Counterpart:**  
    - **Epiphenomenal Feeling:** James-Lange treats emotion as a passive byproduct. In PP, *all* sensations are active inferences—there’s no "dumb" sensation.  

  ---

  ### **Residue Report: Why Gaps Exist**  
  1. **Judgment Theory's Propositional Content:**  
     - *Gap:* PP beliefs are probabilistic and action-oriented (e.g., "avoidance policy likelihood = 90%"), not declarative propositions ("this is a threat").  
     - *Cause:* **Philosophical imprecision**. Judgment theorists often conflate the *outcome* of inference (a belief state) with its *format* (propositions). PP shows content can be carried by control-oriented predictive distributions without symbolic logic.  

  2. **Feeling Collapse (James-Lange/Prinz):**  
     - *Gap:* Both "feeling" theories reduce to interoceptive inference in PP.  
     - *Cause:* **PP's expansiveness**. Interoceptive inference *already* explains why emotions feel embodied and urgent (via precision). Philosophers under-specified mechanisms—PP reveals "feeling" isn't primitive but inferred.  

  3. **Missing Deliberate Reasoning (Judgment):**  
     - *Gap:* PP has no equivalent for slow, conscious appraisal.  
     - *Cause:* **PP limitation**. While PP can model deliberation as iterative precision adjustment, it struggles with "offline" symbolic manipulation (e.g., pondering emotions abstractly). This may need augmented architectures.  

  4. **Perception-Cognition Divide (Prinz):**  
     - *Gap:* PP erodes Prinz's wall between bodily perception and world judgment.  
     - *Cause:* **Philosophical artifact**. The divide assumes modular faculties, while PP treats cognition as unified hierarchical inference—interoception is always contextually embedded.  

  **Verdict:** Where philosophy resists PP translation (e.g., rigid propositionality, pure feeling), it’s usually due to *under-specified mechanisms* in the original theory. PP doesn’t "lose" distinctions; it reengineers them as control-theoretic dynamics (precision, allostatic priors). The one real gap is PP's current struggle with **explicit, offline cognition**—which judgment theories implicitly rely on. If your framework incorporates "procedural epistemology" (treating deliberation as active inference over internal models), even this narrows.
