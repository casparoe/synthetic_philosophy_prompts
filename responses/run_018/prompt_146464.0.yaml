prompt: |-
  I'm in a bit of a muddle after a seminar on Michael Dummett's rather unpopular views on immigration—he's not the standard liberal who thinks borders are basically arbitrary, he argues that a nation is more like a shared form of life with real moral weight, and that immigrants take on obligations to integrate rather than just claiming rights to enter. Meanwhile I spend my days working on open-source governence, and I keep wondering if his argument is just a bad analogy for project maintainance. So here's what I want: restate Dummett's core immigration ethics—especially his claim that cultural continuity matters and that there's a two-way obligation between state and newcomer—entirely in the vocabulary I actually use: maintainers and contributors, pull requests, forks, licensing terms, technical debt, backward compatibility, and community norms. For each part, say whether it translates cleanly, whether I have to distort Dummett to make it fit (maybe treating culture like a codebase), or whether there's something he says that simply has no counterpart in how software projects work—like the idea that you're born into a culture non-voluntarily. Then give me the residue report: is what's left out a failure of the open-source framework, or does it show that Dummett's position was never as rigorous as it looked? Please answer in British English. Also I'm writing this on my phone on the bus, so excuse the odd typo—autocorrect is fighting me.
