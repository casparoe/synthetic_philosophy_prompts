  Hmm... the maintainer/state and contributor/immigrant mapping seems clean initially. Pull requests as visa applications? That works. But when we hit "born into culture non-voluntarily", OSS has no equivalent - you always choose projects. That's a hard break. Also Dummett's concern about cultural disruption feels like worrying over backward compatibility breaks, except human cultures aren't versioned systems with changelogs.

