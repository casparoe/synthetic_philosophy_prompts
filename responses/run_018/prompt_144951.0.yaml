  Now, structuring the demonstration. Bodily view: continuous physical presence = survival. Psychological view: traits/memories preserved = survival. Narrative view: broken "I" continuity = death. The convergence point is the gradual, in-place transformation—if it were sudden, psychological continuity might break. 

