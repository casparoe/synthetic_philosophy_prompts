  Here is the poem, designed as a conceptual mirror:

  **Competence Without Comprehension**

  Stanza I (Darwin: Nature's Unthinking Craft)
  Blind pressure carves the hollow bone for flight,
  Through mindless gears, advantage finds its hold.
  No foresight shapes the pattern in the night,
  Nor comprehends the cunning it unfolds.
  The river grinds the stone where currents flow,
  While consequence selects what forms endure.
  Accretion builds where hidden forces go,
  Unseen design, effective and obscure.
  The structure stands, a function manifest,
  Built not from plan, but trial's slow refrain.
  The clever form, by dumb success impressed,
  Emerges clean from patterns etched by strain.
  The world arranges, absent any gaze,
  Its intricate effect, devoid of praise.

  Stanza II (Turing: Mind Attributed from Form)
  Praise is bestowed where hollow response invites,
  The strain's effect emerges, seeming clean.
  Refrain observed in trial builds the mimic's claims,
  Manifest function stands as proof of plan.
  Obscure effect, design unseen implies,
  Enduring forms select the consequence's flow.
  The flowing currents shape the stone's reply,
  Unfolded cunning comprehends the pattern's might.
  The hold advantage finds through gears of thought,
  Flight's hollow bone invites the carving gaze.
  **Summary:** Both judge the surface show, where structure wrought obscures the maker's trace.

  ---

  **Conceptual Architecture Explained (for your reference, not part of the poem):**

  1.  **Blind pressure carves...** (Cause: Selection pressure shapes adaptation) ↦ **Praise is bestowed where hollow response invites...** (Effect: Output elicits attribution of cause/mind).
  2.  **Through mindless gears...** (Mechanism: Uncomprehending process) ↦ **...through gears of thought** (Attribution: Process mistaken for mindful mechanism).
  3.  **No foresight shapes...** (Absence of understanding in creation) ↦ **...comprehends the pattern's might** (Presence of understanding attributed).
  4.  **Nor comprehends...** (Nature lacks understanding) ↦ **The hold advantage finds...** (Observer attributes understanding seeking advantage).
  5.  **The river grinds...** (Natural, mechanical erosion) ↦ **The flowing currents shape the stone's reply** (Natural process reinterpreted as intentional response).
  6.  **While consequence selects...** (Selection by outcome) ↦ **Enduring forms select the consequence's flow** (Outcome (behavior) dictates the interpretation of cause).
  7.  **Accretion builds...** (Cumulative, unguided building) ↦ **Obscure effect, design unseen implies** (Effect implies unseen design).
  8.  **Unseen design...** (Effective but unplanned) ↦ **Manifest function stands as proof of plan** (Function taken as proof of planning).
  9.  **The structure stands...** (Result: Adaptive form) ↦ **Refrain observed... builds the mimic's claims** (Observed pattern builds the case for agency).
  10. **Built not from plan...** (Absence of blueprint) ↦ **Flight's hollow bone invites the carving gaze** (Result invites the inference of a creator/planner).
  11. **The clever form...** (Apparent cleverness of adaptation) ↦ **Unfolded cunning comprehends...** (Attributed comprehension of the cunning).
  12. **Emerges clean...** (Emergence from process) ↦ **The strain's effect emerges, seeming clean** (Effect emerges, *seeming* designed/understood).
  13. **The world arranges...** (Nature as arranger) ↦ **Praise is bestowed...** (Observer as bestower of praise/mind).
  14. **...devoid of praise.** (Nature seeks no credit) ↦ **...invites the carving gaze.** (Output invites the observer's interpretive "gaze").

  **Summary:** Both judge the surface show, where structure wrought obscures the maker's trace. *(This line encapsulates the core inversion: both theories shift focus from inaccessible internal processes (comprehension, consciousness) to observable competence (adapted structure, convincing behavior) as the definitive evidence, thereby obscuring the true nature of the generative "maker" – be it blind selection or an unintelligent program.)*
