  Even if the boy can't *yet* articulate it under pressure, the presence of that explanatory structure *in his cognitive grasp* (even if not fully conscious or verbalized) changes the nature of the belief. It becomes a node in a web of understanding. This web *allows* for recovery and application in new contexts *because* it's anchored to the *reason* the answer is true, not just the answer. Without the tether, a counter-argument shatters the isolated belief. With the tether, while he might be momentarily confused, the underlying reasons provide a path back to the truth and resist dissolution. The value isn't just in *resisting* persuasion *now*, but in the structural stability enabling *recovery* and *transfer* when the initial prompt fades.

