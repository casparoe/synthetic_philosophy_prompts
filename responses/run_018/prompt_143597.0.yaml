prompt: |-
  I am drafting a proposal for a six-month independent project in my graduate seminar on moral emotions and comparative ethics, and I need help sharpening the framing. The course has examined whether guilt or shame is the more defensible moral emotion—guilt for being action-directed and preserving individual self-worth, shame for being socially embedded and capable of deeper self-revision—but I want to move past the standard individual-level comparison. My specific interest is whether a culture can genuinely choose to cultivate one over the other, and whether the normative answer to “which is better” shifts depending on whether we evaluate from the first-person phenomenological perspective of the moral agent or from the third-person institutional-design perspective of a society seeking to maintain pluralism. I suspect the literature stalls here because both anthropological and psychological treatments treat cultural emotion as something a society “has” rather than something it “builds” through legal, ritual, and linguistic infrastructure—what I want to call emotional grammar. So my precise research question is: if we distinguish three senses of cultural choice—deliberate policy, emergent normative convergence, and structural constraint—does either guilt or shame consistently emerge as the better moral emotion across all three, or does the evaluation split by choice-type? I need the proposal to include: a sharply stated version of that question; an explanation of why existing positions in moral psychology and descriptive anthropology leave the normative collective-level question open; a conceptual (not empirical) method that tests the compatibility of each emotion with the three choice-senses; a description of what a successful result would look like, such as a decision matrix showing that shame is preferable only under structural constraint while guilt dominates under deliberate policy; a clear statement of what would count as failure, for instance if the framework collapses into pure sociology of norms or pure individual phenomenology; and an honest assessment of whether this is realistic for six months of work without archival or field research. I will add all citations and references myself, so please do not include a bibliography, reading list, or named literature review.
reasoning: |-
  Okay, let me tackle this graduate student's proposal sharpening request. The user is clearly deeply engaged with moral psychology and comparative ethics, and their frustration with the individual-level focus in existing literature comes through strongly. They're trying to bridge several gaps at once: between individual and collective, descriptive and normative, and between emotion-as-inherent versus emotion-as-constructed.

  Hmm... their core innovation seems to be this "emotional grammar" concept - the idea that societies actively build emotional repertoires through institutions. That's fresh. But I notice they haven't fully articulated why the collective normative question matters practically. Maybe I should help surface the implicit stakes about pluralism and social resilience?

  The threefold distinction in cultural choice types is sophisticated but risks becoming cumbersome. Need to ensure "deliberate policy", "emergent convergence" and "structural constraint" don't just hang there as categories but actively interrogate each other. The user's suspicion about evaluation splitting across choice-types feels like the project's heartbeat - that's where the original contribution lies.

  For methodology, since it's conceptual, we'll need to construct something like a philosophical stress-test: imagine each emotion trying to function within each choice-type's limitations. Like testing shame's viability under deliberate policy - can you even bureaucratize shame? The decision matrix output could be powerful if we avoid false equivalencies.

  Realism check: six months without empirical work is tight but possible if we strictly limit scope to framework-building. The failure conditions they mentioned (collapsing into sociology or phenomenology) show good self-awareness. Might want to emphasize that negative results about the framework's coherence could still be valuable.

  The comparative ethics angle needs sharper teeth too. When they say "normative answer shifts based on perspective", we should make clear this isn't just relativism but about different normative goods (individual integrity vs social cohesion). That institutional-design perspective deserves more prominence - it's the novel lens here.

  ...wait, did I just talk myself through their entire proposal structure? Let me channel these thoughts into concrete sections while preserving their sophisticated framework but making it leaner. The emotional grammar concept should be the through-line, and the three choice-types need to earn their keep by actively generating tension in the analysis.
answer: |-
  Here’s a sharpened proposal framework addressing all your requirements, designed for conceptual rigor and feasibility within six months:

  ---

  ### **Project Title**  
  The Architecture of Moral Emotion: Evaluating Guilt vs. Shame as Cultivated "Emotional Grammars"  

  ### **Core Research Question**  
  *Under what conditions of cultural choice—deliberate policy, emergent normative convergence, or structural constraint—does guilt or shame emerge as the more defensible moral emotion when evaluated comparatively across first-person phenomenological and third-person institutional-design perspectives?*  

  ### **Problem Framing: The Gap in Existing Literature**  
  Current scholarship treats guilt/shame as static cultural properties ("having" emotions) rather than dynamic constructs built through *emotional grammar* (legal, ritual, linguistic infrastructure). This leaves three unresolved tensions:  
  1. **Normative collective agency**: Anthropological accounts describe cultural emotion but avoid prescribing how societies *should* cultivate it; psychological studies focus on individual outcomes, ignoring societal tradeoffs.  
  2. **Perspective divergence**: No framework reconciles why guilt’s action-corrective value (optimal for the moral agent) may conflict with shame’s pluralism-sustaining potential (optimal for institutional designers).  
  3. **Choice blindness**: The literature overlooks *how* a culture’s mode of choice (deliberate, emergent, structural) shapes the viability of institutionalizing either emotion.  

  ### **Method: Conceptual Compatibility Testing**  
  A tripartite analysis assessing each emotion’s functional alignment with the three choice-types, evaluated through dual lenses:  
  1. **Phenomenological fitness**: Compatibility with moral agency (e.g., guilt’s action-specificity vs. shame’s identity-diffusion).  
  2. **Institutional resilience**: Compatibility with pluralism (e.g., shame’s social embeddedness vs. guilt’s individualism).  
  For each choice-type:  
  - **Deliberate policy**: Test *design coherence* (Can rituals/laws reliably induce guilt without shame’s collateral stigma?).  
  - **Emergent convergence**: Test *normative stability* (Does shame’s social sensitivity enable adaptive cohesion or majoritarian oppression?).  
  - **Structural constraint**: Test *functional necessity* (Does guilt’s inward focus fail in low-legal-resource contexts requiring shame’s visibility?).  

  ### **Success Criteria & Output**  
  A **normative decision matrix** revealing:  
  - Whether either emotion is universally preferable, OR  
  - Contextual tradeoffs (e.g., *"Shame is defensible only under structural constraint when reinforcing pluralistic boundaries; guilt dominates deliberate policy for minimizing systemic scapegoating"*).  
  Success = Demonstrating that the *evaluation* of guilt/shame reverses based on choice-type and perspective.  

  ### **Failure Conditions**  
  The project fails if:  
  1. Analysis collapses into **pure sociology** (describing how norms *do* function, not how they *should*).  
  2. Framework defaults to **individual phenomenology** (ignoring institutional scalability).  
  3. **Choice-types blur** conceptually, making comparative evaluation impossible.  
  *(Mitigation: Anchor each choice-type to specific institutional examples, e.g., deliberate policy ← criminal justice reforms; structural constraint ← oral-tradition societies.)*  

  ### **Feasibility Assessment**  
  **Realistic for 6 months without empirical work** because:  
  - ✅ Focus is **conceptual scaffolding**, not data collection.  
  - ✅ Core task is **systematizing existing theories** into a testable framework.  
  - ✅ Output is a **theoretical matrix**, not applied findings.  
  **Risks**:  
  - Over-ambitious scope (mitigate by strictly excluding historical case studies).  
  - Under-specifying "emotional grammar" (mitigate by defining its three institutional components upfront).  

  ---

  ### **Proposal Structure (Suggested Sections)**  
  1. **Introduction**: The stalemate in guilt/shame debates and the case for emotional grammar.  
  2. **Theoretical Gap**: Why collective normativity and choice-mechanisms are underexplored.  
  3. **Framework**: The 3x2 model (choice-types x perspectives) + emotional grammar.  
  4. **Method**: Compatibility criteria for each cell in the model.  
  5. **Expected Outcomes**: Decision matrix scenarios and their philosophical implications.  
  6. **Limitations & Feasibility**: Scope, non-empirical nature, and fallback positions.  

  This structure forces precision about *how* institutions engineer emotion, exposes why existing literature cannot resolve the "which is better" question, and delivers a reusable evaluative tool—while respecting time constraints.
