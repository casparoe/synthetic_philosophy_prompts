prompt: |-
  hey, i'm prepping a philosophy of science seminar — 16 grad students, one 75-minute block. i need an in-class simulation/game that makes participants feel why cooperation evolves in iterated prisoner's dilemmas but dies in one-shot ones, without me just lecturing about tournaments. the twist should be physical: they use index cards as strategies, and there's a hidden 'mutation deck' that introduces random strategy shifts every few rounds. also include a 'shadow round' mechanic where pairs aren't told whether their partner will be replaced by a copy in teh next round, so they have to act without knowing if there's a shadow of the future. design rules, symbolic payoffs (point chips, no cash), materials list, and a structured debrief that maps specific moments onto evolutionary stability / ESS ideas. tell me what will predictably break the first time i run it, and be frank about which evolutionary dynamic this card-based setup can't actually reproduce. answer in these parts: 'The setup' (~150 words), 'Rules and payoffs' (~200 words), 'The debrief' (~250 words), 'What will break and what's missing' (~120 words). keep it casual — this is just prep notes.
reasoning: |-
  Okay, the user is prepping a philosophy of science seminar for grad students. They need an interactive game to demonstrate the evolution of cooperation through the iterated prisoner's dilemma. The key twist is physical components like index cards and a mutation deck, plus a "shadow round" mechanic to simulate uncertainty about future interactions. 

  Hmm, they're clearly trying to avoid dry lectures and want students to viscerally grasp why cooperation thrives in repeated interactions but collapses in one-shot scenarios. The shadow round addition is clever—it directly tackles Axelrod's "shadow of the future" concept by making the continuation probability ambiguous. 

  For materials, index cards work perfectly as strategy carriers since they're tactile and easy to modify. The mutation deck is a neat hack to simulate random strategy shifts without complex programming. Payoff chips (color-coded for quick tallying) keep things symbolic but tangible. 

  Biggest concerns: 
  Chaos during pairing rotations—grad students will still fumble this. Need crystal-clear instructions. 
  Mutation timing could derail if not strictly enforced. 
  The card system can't replicate nuanced strategies like Tit-for-Tat's responsiveness because players can't "remember" past moves beyond their current card. 

  Debrief structure is crucial: 
  Must explicitly link moments (like shadow round panic) to evolutionary stability theory. 
  Highlight how defectors initially surge then collapse when cooperators cluster—that's the ESS lesson in action. 
  Emphasize the mutation deck's role as genetic drift versus payoff-driven selection. 

  Biggest missing piece: 
  The setup can't show how strategies *coevolve* in response to each other (like Tit-for-Tat adjusting to opponents). Cards are static until mutated. 

  Final prep note: Run a test round with a TA to spot pairing bottlenecks. Have backup chips ready—someone will spill coffee on them.
answer: |-
  **The Setup**  
  Grab 16 index cards (one/student), poker chips (red=defect, blue=cooperate, white=points), a timer, and a "mutation deck" (10 cards: 8 blank, 2 marked "MUTATE!"). Students write a strategy name (e.g., "Always Cooperate") and their move (C or D) on their card. Arrange chairs in two concentric circles (inner=8, outer=8). Each inner player faces an outer partner. You hold the mutation deck.  

  **Rules and Payoffs**  
  - Each round: Partners secretly show a red/blue chip = their move (C or D).  
  - Payoffs (per pair):  
    - **Both C:** Each gets 2 white chips (points)  
    - **Both D:** Each gets 1 white chip  
    - **C vs D:** Defector gets 3, Cooperator gets 0  
  - After 3 rounds, do a **"shadow round"**: Announce *some* pairs *might* have their partner replaced next round (don’t specify who). Players decide moves without knowing if their interaction continues.  
  - Post-shadow round: Shuffle the mutation deck. Draw one card per pair. If "MUTATE!", one random player in that pair flips their strategy card (C→D or D→C) and picks a new name (e.g., "Grudger").  
  - Rotate partners: Outer circle shifts one seat left. Repeat for 4 cycles (approx. 12 rounds).  

  **The Debrief** *(Anchor moments to theory)*  
  - **Opening Rounds:** Note chaos/selfishness ("Why cooperate if I might not see them again?"). Map to **one-shot PD dominance of defection**.  
  - **Post-Shadow Panic:** When you announced possible partner changes, highlight rash defections. Contrast with pairs who kept cooperating hoping for continuity. Link to **discount factor (w) in Axelrod’s shadow of the future**—uncertainty kills cooperation.  
  - **Mutation Effects:** When a "MUTATE!" flips a top scorer to cooperation (or vice versa), ask: "Did randomness help a 'weaker' strategy invade?" Discuss **evolutionary drift vs. payoff selection**.  
  - **Endgame Clusters:** If cooperators cluster (e.g., via mutation/rotation) and outscore defectors, point out: "See how cooperators thrive when protected from exploiters? That’s **network reciprocity/ESS stability**!" Ask defectors: "Why did your strategy fail long-term?"  

  **What Will Break & What’s Missing**  
  - **Chaos in Rotation:** Students will bungle seat shifts. Fix: Number chairs, yell "OUTER CIRCLE MOVE LEFT!"  
  - **Mutation Confusion:** Someone will mis-flip their strategy. Fix: Walk the room during mutations.  
  - **Point Tally Drag:** Manual counting eats time. Fix: Assign a "banker" student.  
  - **Missing Nuance:** Cards can’t replicate **conditional strategies** (e.g., Tit-for-Tat). Players act statically until mutated, ignoring interaction history. This oversimplifies how *responsive* strategies dominate tournaments. Admit this gap: "In real life, strategies ‘remember’—our cards are dumb mutants!"  

  **Prep Note:** Run it tight—stick to 3-min rounds. The shadow/mutation chaos makes the theory *felt*. When cooperation collapses, yell "AXELROD WAS RIGHT!" and watch the lightbulbs go off.
