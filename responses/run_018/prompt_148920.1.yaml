  For the argument itself, I'll need to show why this isn't just "internalism plus external data" nor "broken externalism" but something new. The calibration to usage patterns without communicative intent creates genuine novelty. Maybe analogies to dictionaries or encyclopedias could help, but with caveats about their passive nature versus LLMs' generative capacity.

