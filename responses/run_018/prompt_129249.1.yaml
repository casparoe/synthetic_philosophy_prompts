prompt: |-
  I am taking a course on institutional epistemology and have become preoccupied with a specific administrative norm at my university. The curriculum committee enforces an unwritten but rigid convention: a core course may not be removed until its proponents produce a documented account of the original problem it was designed to solve, together with evidence that the problem is now resolved or obsolete—whereas adding a new elective requires only a syllabus and a budget line. They recently invoked this to reject a proposal to replace a mandatory formal-logic requirement with an applied data-science module, insisting that they do not yet understand what institutional dysfunction the logic course was meant to prevent, while at the same time they approve novel interdisciplinary electives with almost no historical scrutiny.

  What philosophical commitments does this asymmetry presuppose? Must it rest on a Burkean conviction that existing arrangements encode accumulated tacit wisdom that exceeds explicit articulation, or could it be justified by a purely risk-averse decision theory that assigns different error costs to removal and addition? Is the practice philosophically consistent with treating institutional knowledge as genuinely distributed and opaque, or does it tacitly depend on a stronger claim—perhaps that the burden of proof in institutional reform should mirror the burden in common-law adverse possession? Reconstruct the implicit theory of institutional rationality, distinguish what the practice strictly requires from what it merely accommodates, and indicate what would have to change in the committee’s procedures if the underlying view were replaced by a straightforwardly consequentialist or optimisation-based framework.

  If the premise that this asymmetry is philosophically loaded rather than administratively inevitable is confused, please say so plainly rather than accommodating the framing politely. Present your answer as exactly five numbered items, each one or two sentences, with no introduction or conclusion.
reasoning: |-
  Hmm, the user is studying institutional epistemology and has noticed a strange administrative norm at their university. The curriculum committee has an unwritten rule: to remove a core course, proponents must document the original problem it solved and show it's resolved or obsolete, but adding a new elective only needs a syllabus and budget. They used this to reject replacing a formal logic requirement with data science while easily approving new electives.

  The user is asking deep philosophical questions about this asymmetry. They wonder if it's based on Burkean conservatism (valuing tradition as accumulated wisdom), or just risk-averse decision-making (where removing something has higher error costs). They also question if it fits with distributed institutional knowledge or implies something stronger, like mirroring legal burdens of proof. They want me to reconstruct the implicit theory of rationality, distinguish what the practice requires versus accommodates, and show how it would change under consequentialism.

  I need to answer directly in five numbered items, each one or two sentences, no intro or conclusion. The user is sharp and wants honesty—if the asymmetry isn't philosophically loaded, I should say so plainly, but I think it is.

  Breaking it down: First, the asymmetry clearly assumes that institutional structures embody wisdom beyond what's articulated, aligning with Burkean ideas. Second, it assigns different risks to actions—removal is riskier than addition, so it's risk-averse. Third, the practice requires justifying removals with historical evidence, but only accommodates (not requires) that additions are low-risk; it doesn't strictly need the Burkean view. Fourth, if switched to consequentialism, the committee would need to balance all costs and benefits equally for changes, not treat removals as special. Fifth, it doesn't treat knowledge as fully opaque; demanding documentation implies it's recoverable, unlike in adverse possession where possession itself proves ownership.

  I'll keep it concise and precise in the response.
answer: |-
  1. The asymmetry presupposes that existing institutional structures embody non-articulated functional wisdom (Burkean conservatism) and that the *risk of harm* from removing an established element significantly exceeds the *risk of missed opportunity* from failing to add a new elective.
  2. It strictly requires rigorous historical justification for removal (demonstrating obsolescence) while merely accommodating light-touch approval for additions due to perceived lower stakes, not logically necessitating that additions *never* carry hidden risks.
  3. The practice is inconsistent with treating institutional knowledge as fully opaque/distributed, as it demands explicit recovery of original intent; it instead implies that such intent *can* and *must* be articulated to justify change, contrasting with adverse possession’s focus on present function over historical origin.
  4. Under a straightforward consequentialist/optimisation framework, the committee would need symmetrical cost-benefit analysis for *all* changes (additions *and* removals), explicitly weighing projected outcomes against institutional goals without privileging existing arrangements.
  5. The asymmetry is philosophically loaded; it isn’t administratively inevitable but reflects a specific normative commitment to institutional conservatism regarding core functions while permitting experimental flexibility at the margins.
