  I recall that the normative vs. descriptive divide is key. Orthodox Bayesians adhere to axioms like independence as rationality requirements. Risk-weighters prioritize explaining behavior, even if it breaks axioms. The symmetric risk-weighting point is interesting because it forces both sides to confront whether their models align with real human behavior. If symmetric weighting doesn't match empirical data (e.g., people treat gains and losses differently), then it might not be descriptively accurate, weakening the risk-weighted argument. Normatively, if symmetric still violates separability, Bayesians reject it anyway.

