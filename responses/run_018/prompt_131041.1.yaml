answer: |-
  1.  The PBR theorem *does* show that psi-epistemic models (where the wavefunction represents knowledge) can't replicate quantum predictions *if* you assume preparation independence (that independently prepared systems have physical states uncorrelated in the underlying reality).
  2.  Dropping preparation independence *is* a valid theoretical loophole; it allows psi-epistemic models where the hidden variables of independently prepared systems share secret correlations, avoiding PBR's contradiction.
  3.  Many physicists find this loophole unnatural or a bit whingeing, as it implies pervasive, fine-tuned correlations across the universe without a clear mechanism, making psi-ontic models (where the wavefunction itself is physical) seem simpler.
  4.  Other, more exotic loopholes exist too, like allowing retrocausality or infinite-dimensional ontic states, keeping the psi-epistemic possibility technically alive, albeit rather fringe.
  5.  So, whilst PBR strongly favours psi-ontic views under standard assumptions, the loopholes mean the debate isn't fully settled philosophically, hence arguments persist about what the wavefunction fundamentally *is*.
