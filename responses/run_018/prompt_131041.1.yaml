  hi, ive been trying to get my head round quantum mechanics and im stuck on this psi-ontic vs psi-epistemic thing. i think psi-ontic means the wavefunction is literally real like a wave in water, and psi-epistemic means its just knowledge about some hidden stuff, maybe like spekkens toy model. then i read about the pbr theorem saying psi-epistemic is wrong unless you drop preparation independence, which sounds like a cheat. so if the theorem proves the wavefunction is real, why do people still argue about it? is the loophole actually legit or are they just being stubborn? please answer in british english as exactly five numbered points, each one or two sentences, no intro or conclusion.
