prompt: |-
  I'm drafting a short research proposal (around 1,500 words) for a term-paper fellowship in my philosophy of collective action and risk module. My half-formed idea concerns the unilateralist's curse: in situations where agents can act independently and outcomes depend on shared beliefs about risk, the member with the most optimistic assessment tends to take unilateral action, often producing collective harm. I want to investigate whether the curse can be dissolved not by restricting agency, but by reconceiving expected utility as peer-relative — that is, by requiring an agent to weight outcomes according to how her risk-assessment stands within her epistemic community, discounting scenarios that depend on outlier beliefs. Specifically, does a peer-relative expected-utility framework eliminate the curse without collapsing into generic risk-aversion, and can it be formalised in a way that preserves normative force?

  Please structure the proposal as follows. First, state the research question with precision and explain why it matters. Second, show why standard consequentialist and game-theoretic treatments leave the problem open, and clarify why a conceptual, peer-relativity approach is preferable to the obvious alternatives (such as purely institutional restrictions or standard Bayesian aggregation). Third, set out the method: conceptual analysis of peer-relativity in decision theory, then application to canonical curse scenarios, with an explicit account of what steps you will take. Fourth, describe what a successful result would look like — for example, a formal criterion that distinguishes legitimate unilateral action from cursed action — and state honestly what would count as failure or as the project being too large for one term. Fifth, include a realistic scope assessment for a single-semester project. Do not provide a bibliography, reading list, or citations — I will add those myself — though you may refer to established positions and arguments where appropriate.
