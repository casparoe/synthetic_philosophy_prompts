answer: |-
  Here is a structured research proposal draft following your specifications:

  **1. Research Question & Significance**

  *   **Precise Question:** Can the Unilateralist's Curse (UC) be resolved within a consequentialist decision-theoretic framework by redefining individual expected utility (EU) as *peer-relative*, such that an agent discounts the value of outcomes contingent on scenarios deemed plausible only by outlier risk assessments within her relevant epistemic community? Specifically: (a) Does this approach robustly prevent UC-driven collective harm across canonical cases? (b) Does it achieve this without collapsing into generic risk-aversion or sacrificing the normative force of standard EU maximization? (c) Can it be formally articulated to provide clear, action-guiding criteria distinguishing legitimate unilateral action from "cursed" action?

  *   **Why it Matters:** The UC represents a pervasive and dangerous failure mode in collective risk contexts (e.g., rogue AI experimentation, geoengineering, biosecurity). Standard solutions often involve restricting agency (e.g., requiring consensus) or aggregating beliefs (e.g., Bayesian pooling), potentially stifling necessary action or diluting responsibility. A *peer-relative EU* framework promises a novel solution: preserving individual agency while embedding epistemic humility directly into the *structure* of rational choice. Success would offer a powerful, normatively grounded decision rule for individuals facing high-stakes unilateral options within groups, advancing both the theory of rational choice under collective risk and practical strategies for mitigating catastrophic UC scenarios.

  **2. Background Critique & Conceptual Motivation**

  *   **The UC Problem:** The curse arises when multiple agents can act unilaterally based on private risk assessments. The agent with the most optimistic assessment (lowest perceived cost or highest perceived benefit relative to risk) is most likely to act first. If their optimism is misplaced, their action imposes harm on all. Even rational, well-intentioned agents following standard EU maximization can produce this perverse collective outcome.
  *   **Limits of Standard Approaches:**
      *   **Consequentialism/Game Theory:** Standard EU maximization treats an agent's own risk assessment as sovereign. Game-theoretic solutions (e.g., equilibrium concepts) often fail because the curse doesn't require strategic interaction – simultaneous independent decisions suffice. Neither framework inherently incorporates the agent's awareness of *being an outlier* as a reason to discount the expected value of acting.
      *   **Institutional Restrictions (Consensus/Vetos):** While effective at blocking cursed actions, these often also block *legitimate* unilateral actions (e.g., emergency interventions justified by a correct minority view). They remove agency rather than refining its rational exercise.
      *   **Standard Bayesian Aggregation:** Aggregating group beliefs (e.g., averaging probabilities) into a single group view *before* decision-making dissolves the curse by creating a shared perspective. However, it eliminates the possibility of *individual* rational action based on the agent's own (potentially correct) assessment. It replaces individual agency with a collective agency.
  *   **Why Peer-Relativity?** The proposed approach addresses the core epistemic flaw in the UC: an outlier acting on an unsupported belief. Peer-relative EU directly targets this by requiring the agent to *internally discount* the value of outcomes dependent on her assessment *if* that assessment falls significantly outside the distribution of her epistemic peers' assessments. It aims to preserve individual agency while integrating a rational sensitivity to one's epistemic standing within a trusted community, offering a middle path between unchecked unilateralism and stifling collectivism.

  **3. Method: Conceptual Analysis and Application**

  This project will proceed through conceptual analysis within decision theory and applied ethics, applied to stylized UC scenarios:

  1.  **Phase 1: Conceptual Groundwork for Peer-Relative EU:**
      *   Precisely define "epistemic peer group" for UC contexts (e.g., shared evidence, competence, relevant domain expertise). Acknowledge boundary issues but propose workable parameters.
      *   Analyze how peer-relativity modifies standard EU calculation. Core idea: For an action whose net benefit depends crucially on a disputed risk assessment `R` (e.g., probability of catastrophe), the agent weights the value of `R`-dependent outcomes by a factor reflecting how closely her assessment of `R` aligns with the peer group's distribution (e.g., inverse of her assessment's deviation from the median/mean, or likelihood ratio given group dispersion).
      *   Explore formal representations: Could involve weighting outcome utilities, modifying probability estimates, or introducing a discount factor applied to the EU calculation *only* for actions whose justification relies heavily on outlier beliefs.
      *   Argue for the *rationality* of this weighting: Ground it in the epistemic significance of peer disagreement and the higher-order uncertainty an outlier should rationally acknowledge.

  2.  **Phase 2: Application to Canonical UC Scenarios:**
      *   Construct or adapt 3-4 clear UC scenarios: e.g., multiple researchers deciding whether to run a risky experiment; multiple nations considering unilateral geoengineering; multiple developers deciding on deploying a powerful AI system.
      *   Model each scenario using:
          *   Standard EU maximization (demonstrating the curse).
          *   Institutional solutions (demonstrating blockage of legitimate action).
          *   Peer-relative EU (testing resolution).
      *   **Key Tests:**
          *   Does peer-relative EU prevent the most optimistic outlier from acting *when their optimism is unjustified*?
          *   Does it allow an agent with a pessimistic-but-majority view to act if warranted by other factors?
          *   Crucially, does it allow a *correct minority view* holder to act unilaterally *if* their assessment, while differing from the group's central tendency, is not a clear *outlier* (e.g., supported by unique, credible evidence not yet fully absorbed by peers)? Or if the situation is truly urgent?
          *   Does the framework generate prescriptions distinct from simply adopting a generic risk-averse utility function?

  **4. Success, Failure, and Scope Limits**

  *   **Successful Result:** A clearly articulated, formally expressible principle of peer-relative EU weighting that:
      1.  Robustly dissolves the UC in the tested scenarios by preventing harmful outlier actions.
      2.  Preserves the possibility of normatively justified unilateral action, particularly by non-outlier minorities or in urgent cases, distinguishing it clearly from cursed action.
      3.  Demonstrates a normative foundation distinct from simple risk aversion (e.g., showing cases where peer-relativity prescribes actions a generic risk-averse agent wouldn't take, or vice-versa).
      4.  Retains the core normative force of consequentialism by linking the weighting to epistemically rational belief revision in light of peer disagreement.
  *   **Failure/Inconclusive Result:** The analysis might reveal that:
      *   Peer-relative EU inevitably collapses into a form of risk aversion indistinguishable from standard models with altered utility functions.
      *   It fails to reliably block harmful cursed actions without also blocking too many legitimate actions.
      *   Providing a non-arbitrary and normatively compelling formal weighting mechanism proves impossible.
      *   The framework lacks clear normative force compared to institutional solutions.
  *   **Project Too Large:** Key limitations for one semester include:
      *   **Deep Formalization:** Developing rigorous, general game-theoretic or decision-theoretic models with peer-relativity might exceed the scope. Focus will be on conceptual clarity and illustrative formal snippets rather than full mathematical generality.
      *   **Comprehensive Scenario Testing:** Exhaustive testing across all possible UC variants is impossible. Success will be judged on robust performance in canonical, clearly defined cases.
      *   **Definitive Peer Group Definition:** Fully resolving the complex literature on peer disagreement and defining peer groups in all contexts is beyond scope. The project will rely on a stipulated, practically motivated definition suitable for UC cases.

  **5. Realistic Scope Assessment**

  This project is feasible for a single semester as it focuses on *conceptual innovation* and *targeted application* rather than extensive formal derivation or empirical work. The core tasks are:

  1.  **Literature Synthesis (3 weeks):** Consolidate understanding of UC, standard solutions (institutional/Bayesian), and key arguments on peer disagreement/relevance.
  2.  **Conceptual Development (4 weeks):** Define peer-relativity for EU, propose and compare specific discounting/weighting mechanisms, articulate normative rationale.
  3.  **Scenario Modeling & Analysis (4 weeks):** Apply standard EU, institutional solutions, and peer-relative EU to 3-4 core scenarios. Analyze outcomes against success criteria.
  4.  **Evaluation & Refinement (3 weeks):** Assess whether success criteria are met, identify limitations, refine the peer-relative EU proposal, and articulate the distinction criterion for legitimate vs. cursed action.
  5.  **Writing & Synthesis (Ongoing):** Integrate findings into the final proposal/paper.

  The scope is constrained by focusing on the core conceptual question and a manageable set of scenarios, explicitly bracketing deep formalization challenges and the most contentious aspects of peer group definition. Success is defined as a clear, argued proposal for peer-relative EU as a viable solution pathway, not a fully general formal theory.
