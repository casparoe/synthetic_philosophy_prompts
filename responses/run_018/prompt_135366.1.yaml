prompt: |-
  I run an 80-minute graduate workshop on bounded rationality for 16 philosophy and cognitive-science students. Design an in-class simulation game—no real money, only points tracked on a visible leaderboard plus a symbolic privilege (choosing the opening case for the next session) for the highest cumulative scorer—that makes participants feel satisficing with aspiration-level adaptation as an ecologically rational strategy rather than a failure of will. Arrange the rules and a hidden payoff environment so that participants who try to locally optimize by spending limited cognitive-budget tokens to map cross-round correlations deplete their resources and earn lower cumulative payoffs, while those who maintain a modest aspiration threshold, accept the first option that meets it, and lower the threshold only after two consecutive failures free up budget and achieve higher long-run scores—experiencing the downward adjustment as strategic relief, not defeat. Specify: a six-round structure with four niche options per round; a hidden temporal-autocorrelation structure linking payoffs across rounds that can be revealed only by spending three budget tokens; each participant’s initial budget of eight tokens and aspiration level of 7; the adaptation rule (failure in two consecutive rounds forces aspiration down by one step and refunds one token); materials needed (niche cards, budget chips, individual score sheets, a sealed correlation envelope); a minute-by-minute timeline; and the point-payoff scheme. The facilitator must not name satisficing, aspiration levels, or ecological rationality before play begins; all framing comes in the debrief. Include a debrief that maps specific game moments onto aspiration adjustment, search-cost depletion, and ecological rationality; predicts first-run failures—such as token hoarding, social reluctance to lower aspiration because it feels like public defeat, or one table cracking the correlation early and breaking the collective experience of difficulty—with concrete handling instructions for each; and frankly states which feature of real-world bounded-rational satisficing the simulation cannot reproduce (for example, the long-term social normalization of aspiration norms or genuine lack of meta-awareness about one’s own cognitive architecture) and that you must supply verbally. Do not ask for bibliographies, citations, or reading lists. Lead with the bottom-line pedagogical problem in the first sentence—participants discover that fully mapping the hidden payoff structure consumes the very resources that would have made that knowledge profitable—then present the rules, hidden structure, materials, timeline, debrief mapping, failure-mode guide, and honest limitation note, with no preamble and no restatement of the prompt.
reasoning: |-
  We are addressing the core pedagogical problem: Participants discover that fully mapping the hidden payoff structure consumes the very resources that would have made that knowledge profitable.

  **Rules of the Game:**
  1. **Objective:** Accumulate as many points as possible over six rounds.
  2. **Structure:** Each round, four niche options (A, B, C, D) are available. Players choose one per round.
  3. **Budget Tokens:** Each player starts with 8 tokens. Tokens can be spent to gain information.
  4. **Information Cost:** To see the hidden correlation structure (which shows how payoffs in one round affect the next), a player must spend 3 tokens to open the sealed envelope at their table (one envelope per table, shared by 4 players). This reveals the temporal-autocorrelation rules for the entire game. Alternatively, tokens can be spent to reveal the exact payoff of one option in the current round (1 token per option per round).
  5. **Aspiration Level:** Each player starts with an aspiration level of 7 points. They must choose the first option that meets or exceeds their current aspiration level. They can only choose an option below their aspiration level if they have failed to meet it for two consecutive rounds (then they must lower their aspiration and are refunded one token).
  6. **Adaptation Rule:** 
     - If a player fails to meet their aspiration level in two consecutive rounds, they must lower their aspiration by one (e.g., from 7 to 6) and they get one token refunded (added to their remaining tokens).
     - After lowering, the aspiration level remains at the new level until they again fail two consecutive rounds, which triggers another decrease (and another token refund). The aspiration level cannot go below 3.
  7. **Decision Process:** 
     - Each round, players look at the four options (which are displayed as cards with symbols but no point values) and decide in order. 
     - They must check options in the order they are presented (A, B, C, D) and choose the first that meets their aspiration. 
     - If none of the four options meet their aspiration, they must choose the highest available (but this counts as a failure for that round).
  8. **Payoff Scheme:** Points are determined by a hidden function that depends on:
     - The option chosen in the current round.
     - The option chosen in the previous round (temporal autocorrelation). 
     - The exact function is in the sealed envelope and is complex enough that it requires study (e.g., the payoff for option X in round t is base_value(X) + bonus if X was chosen in round t-1, or penalty if a conflicting option was chosen in t-1, etc.). The base values change per round and per option, but the correlation rule is fixed.

  **Hidden Payoff Environment:**
  - The sealed envelope contains a table with the following rules (for example):
     - If a player chooses the same option two rounds in a row, they get a +2 bonus (on top of the base value).
     - If they choose an option that is adjacent in the sequence (e.g., A then B, or D then C) they get +1.
     - If they choose an option that is two steps away (e.g., A then C, or B then D) they get 0.
     - If they choose an option that is opposite (e.g., A then D, or B then C) they get a -1 penalty.
     - The base values for each option in each round are set so that without the correlation, the expected value is around 6-8. With the correlation, it can be as low as 4 or as high as 10.
     - Example base values (vary by round and option, but here is a sample for Round 1: A=6, B=8, C=7, D=5; then for Round 2: A=7, B=5, C=8, D=6; etc.). The actual base values should be designed so that without the correlation, it's hard to consistently get above 7.

  **Materials:**
  - **Niche Cards:** Four per round, labeled A, B, C, D. Six sets (one for each round) for each table. The cards have a symbol (e.g., animal, plant, etc.) but no numbers.
  - **Budget Chips:** 8 tokens per player (e.g., poker chips or cardboard tokens).
  - **Individual Score Sheets:** To record choices and points per round and track tokens.
  - **Sealed Correlation Envelope:** One per table (4 players share one). Contains the correlation rules (as above) and a table of base values for all rounds (so that if they open it, they can compute the exact payoff for any choice given the previous choice).
  - **Leaderboard:** A visible board showing cumulative scores (by player code, not name, to reduce social pressure) after each round.
  - **Timer:** For enforcing decision time.

  **Timeline (80 minutes total):**

  - **0:00 - 0:05 (5 min):** Introduction and rules explanation. 
    - Explain the goal (maximize points over 6 rounds), the options (four per round), and the token system (8 tokens, can be used to get information). 
    - Explain the aspiration rule: "You must choose the first option that meets or exceeds your current goal (which starts at 7). If you don't find one, you take the highest available. If you fail to meet your goal for two rounds in a row, you must lower your goal by one and you get one token back." 
    - Do not use the terms satisficing, aspiration level, or ecological rationality. 
    - Emphasize: "You cannot change the order in which you check the options. You must start with A, then B, then C, then D."

  - **0:05 - 0:35 (30 min):** Game Rounds 1-6. Each round takes about 5 minutes.
    - **Round Flow (per round):**
      - Display the four niche cards (face up, in order A, B, C, D) for the current round.
      - Players have 1 minute to decide whether to spend tokens for information. They can:
          - Spend 1 token to see the point value of one option in the current round (only the base value, without the correlation effect because they don't know the correlation rule without the envelope).
          - Or, if they haven't already, they can spend 3 tokens as a table to open the sealed envelope (if one player at the table pays 3, the whole table sees it). Once opened, it remains open.
      - Then, players must choose an option in order (they must check A first: if A meets their aspiration, they take A; if not, check B; then C; then D). If none meet, take the highest (they are told the base values if they paid for that option, otherwise they don't know until after they choose).
      - After all players have chosen, the facilitator collects choices and calculates points (using the base value plus the correlation effect based on the previous round's choice; for round 1, no previous choice, so only base value).
      - The facilitator then reveals the base values for the current round (so everyone sees what the options were) and the points each player earned. Players record their points and update tokens.
      - Update the leaderboard (cumulative points) and start the next round.

  - **0:35 - 0:40 (5 min):** Final scoring and announcement of the winner (highest cumulative score). The winner gets the privilege of choosing the opening case for the next session.

  - **0:40 - 1:20 (40 min):** Debrief and discussion.

  **Debrief Mapping (40 minutes):**

  1. **Reveal the Hidden Structure (5 min):** Show the correlation rules and base values. Explain that the payoffs were autocorrelated: past choices affected current payoffs.

  2. **Mapping Game Moments to Concepts (15 min):**
     - **Aspiration Adjustment:** Ask players who had to lower their aspiration: What did it feel like? Note that the rule forced them to lower after two failures and gave a token back. Highlight that this adjustment was a strategic move (refunding a token) and preserved cognitive resources for the long run. Contrast with players who never lowered and might have run out of tokens or made poor choices because they were stuck at a high aspiration.
     - **Search-Cost Depletion:** Point out that players who spent tokens to see individual options or to open the envelope early used up tokens that could have been used later. In particular, opening the envelope cost 3 tokens (a big chunk) and the knowledge gained might not have been worth it because by the time they understood the correlation, they had fewer tokens to act on it. Moreover, the satisficers who didn't spend tokens on mapping had tokens left for critical moments (like when they had to lower aspiration and got a token back, they could use it to see an option in a later round) and thus had more flexibility.
     - **Ecological Rationality:** Explain that the environment (the hidden correlation) was structured in a way that trying to optimize (by mapping the entire structure) was too costly. The satisficing strategy with an adjustable aspiration level was ecologically rational because it fit the constraints (limited tokens) and the structure (autocorrelation made it hard to predict without heavy investment). The aspiration adjustment rule (lowering after two failures) was a built-in mechanism to adapt to the environment.

  3. **Failure Modes and Handling (10 min):** Predict and discuss:
     - **Token Hoarding:** Some players might have saved all tokens and never used them. Ask: "Did anyone not spend any tokens? Why? What happened?" Point out that moderate use (e.g., spending a token when really stuck) was more adaptive than hoarding or overspending.
     - **Social Reluctance to Lower Aspiration:** Ask: "How did it feel to lower your aspiration? Was it embarrassing to have to do it publicly (since the leaderboard showed cumulative scores and maybe others noticed)?" Normalize that it felt like defeat but in the game it was actually a strategic move (refunded token). Emphasize that in the real world, we don't have leaderboards for every decision, so adjusting aspirations is a private, adaptive process.
     - **One Table Cracking the Correlation Early:** If one table opened the envelope early and did well, ask them to share their experience. Then ask: "Did that knowledge pay off? How many tokens did you spend? Did you have enough tokens left to act on it?" Point out that even if they knew the rule, they still had to choose options and the aspiration rule might have forced them to take suboptimal choices sometimes. Also, note that the 3-token cost was high and left them with fewer tokens for later rounds. Moreover, other tables didn't have that knowledge, so the collective experience of difficulty was broken. Handling: In future runs, if a table cracks it early, remind them that the tokens are scarce and they must still follow the aspiration rule. Also, consider having multiple envelopes per table (one per player) to avoid sharing? But in this design, we have one per table to encourage discussion. Alternatively, if one table is doing extremely well, use that as an example in the debrief to show that even with the knowledge, the token cost was a burden.

  4. **Honest Limitation Note (5 min):** 
     - "This simulation cannot reproduce the long-term social normalization of aspiration norms. In the real world, our aspirations are shaped by our peers, culture, and past experiences over years, not just six rounds. Also, in the game, you were aware of your aspiration level and the adjustment rule, but in reality, we often adjust our aspirations without explicit rules or even without being fully aware of it. Moreover, the game had a fixed and known set of options per round, but real-world search often involves unknown options and undefined search spaces."

  5. **Connecting to Bounded Rationality (5 min):** Conclude by linking the game to the concepts of the workshop: 
     - Satisficing is not a failure of will but a smart response when optimization is too costly. 
     - Aspiration levels are dynamic and adjust to the environment. 
     - Ecological rationality means matching your decision strategy to the structure of the environment.

  This design should create an experience where satisficing with adaptive aspirations leads to better long-term outcomes, while over-investment in mapping the environment depletes resources and hurts performance.
answer: |-
  **Participants discover that fully mapping the hidden payoff structure consumes the very resources that would have made that knowledge profitable, demonstrating satisficing as ecologically rational.**

  ### **Game Rules**
  1. **Objective**: Maximize cumulative points over six rounds.  
  2. **Options per Round**: Four niche cards (A/B/C/D) with hidden payoffs. Players must check options in fixed order (A→B→C→D) and select the **first** that meets/exceeds their current aspiration level.  
  3. **Aspiration Level**: Starts at 7 points.  
  4. **Adaptation Rule**:  
     - After **two consecutive failures** (selected option < aspiration), aspiration decreases by 1 (min. 3).  
     - Player receives **one refunded token** (added to remaining budget).  
  5. **Cognitive Budget**:  
     - Each player starts with **8 tokens**.  
     - **Token uses**:  
       - **1 token**: Reveal payoff of **one option** in the **current round only**.  
       - **3 tokens**: Unlock the **sealed correlation envelope** (shared per table) to view cross-round payoff rules.  
     - Tokens unused after Round 6 are forfeited.  
  6. **Scoring**:  
     - **Symbolic prize**: Highest cumulative scorer chooses the next workshop’s opening case.  
     - Points tracked on a public leaderboard (use anonymous player IDs).  

  ---

  ### **Hidden Payoff Structure**  
  - **Temporal autocorrelation**: Payoffs depend on **previous round’s choice**.  
    - *Example rule (sealed envelope)*:  
      - **+3 points** if current choice matches previous round’s choice.  
      - **+1 point** if adjacent (e.g., A→B, D→C).  
      - **−2 points** if opposite (e.g., A→D, B→C).  
      - *Base payoffs per round (vary by niche)*:  
        - Round 1: A(6), B(5), C(7), D(4)  
        - Round 2: A(4), B(8), C(5), D(6)  
        - *Design ensures aspiration 7 is achievable but unstable without adaptation*.  
  - **Correlation knowledge cost**: Spending 3 tokens reveals the full rule set. Hoarding tokens for mapping drains budgets.  

  ---

  ### **Materials**  
  - **Per table (4 players)**:  
    - 4 sets of niche cards (6 rounds × 4 options, labeled A/B/C/D).  
    - 32 budget tokens (8 per player).  
    - 1 sealed envelope with correlation rules + base payoffs.  
  - **Per player**: Score sheet (tracks: choices, points, tokens, aspiration level).  
  - **Public leaderboard** (whiteboard with player IDs).  

  ---

  ### **Timeline (80 Minutes)**  
  - **0:00–0:05**: Briefing (neutral framing).  
    - *State goal: “Maximize points over six rounds. You have limited tokens to gather information.”*  
    - *Explain rules (no jargon): aspiration starts at 7, must pick first option meeting it, tokens reveal payoffs or rules, adaptation triggers on two failures.*  
  - **0:05–0:35**: **Rounds 1–6** (5 min/round).  
    - *Per round*:  
      1. Display niche cards (A/B/C/D).  
      2. Players secretly spend tokens (e.g., peek at one option’s payoff or unlock envelope).  
      3. Players check options in order, select first ≥ aspiration (if none, take highest).  
      4. Facilitator collects choices, calculates payoffs (applies correlation to previous choice), updates leaderboard.  
      5. Players adjust aspiration if needed (after two failures) and record refunds.  
  - **0:35–0:40**: Final scores. Top scorer awarded case-choice privilege.  
  - **0:40–1:20**: **Debrief** (40 min).  

  ---

  ### **Debrief Mapping**  
  **Link game moments to concepts (no pre-play jargon)**:  
  - **Aspiration adjustment**:  
    - *Example*: “When you lowered your goal after two failures and got a token back, that wasn’t quitting—it was *reallocating effort*. Real-world example: Ending a job search by accepting a ‘good enough’ offer preserves energy for other goals.”  
  - **Search-cost depletion**:  
    - *Example*: “Tables that spent 3 tokens early to unlock the envelope lost tokens needed to probe options later. Like exhausting yourself researching stock trends, leaving no capital to invest.”  
  - **Ecological rationality**:  
    - *Example*: “The ‘pick first ≥ goal’ rule beat optimization because tokens spent mapping couldn’t be spent acting. Satisficing won by fitting the environment’s hidden costs.”  

  ---

  ### **Failure-Mode Predictions & Handling**  
  1. **Token hoarding**:  
     - *Prediction*: Players avoid spending tokens, missing key payoffs.  
     - *Handling*: Debrief: “Hoarding felt safe, but unused tokens couldn’t offset low scores. Like underusing tools due to scarcity fear.”  
  2. **Social reluctance to lower aspiration**:  
     - *Prediction*: Players avoid public “defeat” (aspiration drop on leaderboard).  
     - *Handling*: Normalize in debrief: “Lowering aspiration felt like losing, but the token refund was a tactical retreat. Real-world adjustments are private.”  
  3. **Table cracks correlation early**:  
     - *Prediction*: One table unlocks rules fast, skewing scores.  
     - *Handling*: In debrief, contrast outcomes: “Even with the rules, token depletion likely hurt their later rounds. Optimization’s cost outweighed gains.”  

  ---

  ### **Honest Limitation Note**  
  **Verbal disclosure in debrief**:  
  > “This simulation can’t replicate how real-world aspiration norms *socially normalize* over years (e.g., career expectations shaped by peers). Nor does it capture our typical *lack of meta-awareness*—you knew your aspiration rule, but humans often adapt goals unconsciously. I’ll contextualize this verbally.”
