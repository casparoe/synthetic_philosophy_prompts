prompt: |-
  Consider Aristotle's classic problem of future contingents, introduced through the sea-battle example: if it is now true that there will be a naval battle tomorrow, then the battle appears unavoidable, threatening our intuition that the future is open. Rather than rehearsing the standard fatalist objection, construct a conceptual issue that emerges only when we reconstruct this argument inside a branching-time framework with hidden indexicality. Specifically, examine the tension between maintaining present bivalence and preserving cross-branch identity for future-tensed propositions: in one branch a speaker utters "there will be a sea battle tomorrow," and in another branch—where the battle is averted—the same speaker might utter the same sentence, but the indexical "tomorrow" picks out a different temporal location, so the proposition expressed may not be the very same one evaluated for truth now. Give a concrete example that makes this conflict explicit, showing how the demand that every present-tensed claim about the future be either true or false can clash with the idea that averted branches contain not false versions of the same claim, but different claims altogether. Keep the analysis conceptual rather than historical; do not provide citations, bibliographies, or references to specific scholars. End your response with a single line beginning "Summary:" followed by a one-sentence distillation of the conceptual issue you have identified.
reasoning: |-
  Hmm, the user presents a sophisticated twist on Aristotle's sea-battle paradox by reconstructing it within branching-time semantics with hidden indexicality. This requires careful handling of how indexicals like "tomorrow" behave across divergent futures.

  The core tension lies between two principles: present bivalence demands that any statement about the future must be currently true or false, while cross-branch identity requires that the same utterance token in different branches expresses identical propositions. But indexicals sabotage this identity - when I say "tomorrow" on Tuesday, it picks out Wednesday in all branches, but if the world branches before Wednesday, in battle-containing branches the utterance refers to the battle-day, while in peace-branches it refers to a battle-less day. Thus what appears to be "the same statement" in different branches actually expresses different propositions due to shifting indexical anchors.

  A concrete example clarifies this: When uttered on Tuesday, "There will be a sea-battle tomorrow" expresses proposition P about Wednesday. If the world branches overnight, in battle-branches P remains true, but in peace-branches the utterance no longer expresses P - it expresses a new proposition Q about Wednesday's peace. Crucially, Q isn't false-P but an entirely different claim. This exposes how bivalence applied to future contingents mistakenly assumes propositional persistence across branches.

  The conceptual issue distilled: Bivalence requires evaluating a single future proposition now, while indexicality in branching time fractures the proposition itself across possible futures.
answer: |-
  Consider a branching-time model where at the present moment *t* (say, Tuesday), two future branches diverge: Branch A contains a sea battle on Wednesday, while Branch B contains peaceful seas on Wednesday. Present bivalence demands that the proposition "There will be a sea battle tomorrow" — uttered *now* at *t* — must be either true or false *simpliciter* at *t*. 

  The conflict emerges when we analyze utterances of "There will be a sea battle tomorrow" made *later*, in each branch. Suppose in Branch A, at dawn on Wednesday (time *t+1*), a speaker S_A utters "There will be a sea battle today." Simultaneously, in Branch B, at the exact same global temporal coordinate *t+1* (Wednesday dawn), a qualitatively identical speaker S_B utters "There will be a sea battle today." Crucially, S_A and S_B are temporal counterparts originating from the same agent at *t*. 

  **The clash:**  
  1. **For present bivalence at *t*:** The Tuesday utterance "There will be a sea battle tomorrow" must have a determinate truth value at *t*. If true, it commits to the battle occurring in all possible futures (denying openness). If false, it denies the battle in all futures (also denying openness).  
  2. **For cross-branch propositional identity:** The Wednesday utterances in A and B *appear* to be the same claim as Tuesday’s future-tensed proposition "made present." However, the indexical "today" in Wednesday’s context rigidly picks out *Wednesday* in both branches. In Branch A, "There will be a sea battle today" expresses a true proposition *about Wednesday*. In Branch B, the same sentence expresses a false proposition *about Wednesday*. Yet at *t* (Tuesday), "tomorrow" in "There will be a sea battle tomorrow" also rigidly picks out Wednesday. This suggests the Tuesday proposition *is* the same as the Wednesday propositions — a singular proposition *about Wednesday* having a sea battle.  
  3. **The tension:** If the Wednesday utterances express the *same* proposition as Tuesday’s future-tensed claim (since "tomorrow" at *t* and "today" at *t+1* both index Wednesday), then:  
     - That proposition is true in Branch A but false in Branch B.  
     - Present bivalence at *t* demands this proposition must be *already* true or false at *t* — but it cannot be both, and neither choice preserves openness.  
  4. **Resolution attempt:** One might argue the Wednesday utterances express *different* propositions from Tuesday’s claim because the context (branch + time) alters content. But this requires rejecting that "There will be a sea battle tomorrow" uttered on Tuesday expresses a complete, evaluation-independent proposition *about Wednesday*. If the proposition is contextually bound to its utterance branch, then at *t* we have:  
     - "There will be a sea battle tomorrow" expresses proposition P_A in Branch A (true).  
     - The same sentence expresses P_B in Branch B (false).  
     Present bivalence now applies not to a single proposition but to *branch-relative* propositions. This saves openness (P_A is true, P_B is false, neither was settled at *t*) but violates bivalence *de re*: there is no *single* proposition "about the future" to which bivalence applies *now*.  

  **Concrete conflict:** Demand (1): At *t*, "There will be a sea battle tomorrow" must express a unique proposition Q (about Wednesday) that is timelessly true or false. Demand (2): In Branch B, Wednesday’s speaker S_B utters "There will be a sea battle today" — which, if identical to Q, must be false. Yet in Branch B, there is *no fact* about Wednesday that makes Q false *until Wednesday arrives*; rather, Branch B contains a *different* proposition (e.g., "peace occurs on Wednesday") that is true. Treating S_B’s utterance as expressing the *same* Q that was "waiting to be falsified" mischaracterizes Branch B: it doesn’t falsify Tuesday’s future-tense claim; it actualizes a divergent history where Tuesday’s utterance, had it been branch-bound, expressed a different (false) proposition. Bivalence forces a singular, context-independent proposition, while indexicality and branching fracture propositional identity across histories.  

  Summary: Present bivalence presupposes a unique, context-independent proposition for future contingents, but hidden indexicality in branching time fractures propositional identity across branches, making bivalence inapplicable to a single "future-tensed" claim.
