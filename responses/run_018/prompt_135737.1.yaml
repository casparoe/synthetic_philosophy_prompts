prompt: |-
  I'm an editor at a small regional history quarterly and we keep recieving submissions that mix solid archival work with heavy narrative framing -- the kind where the author picks a shape first and fits the documents to it. I need a reusable decision procdure I can run in about fifteen minutes per manuscript, grounded in the philosophy of history debates about objectivity: Ranke's aim of showing things as they actually happened versus Carr and Hayden White's scepticism that every narrative imposes its own structure.

  The procedure should be a sequence of questions I ask in order. For each one say what counts as passing, what counts as failing, where failure means reject, and where it just means I have to make a judgment call about values rather than facts. It needs to work when I haven't read the primary sources, and it should catch framing that is implicit rather than announced. Include the points where it will definitely misfire.

  Then apply it to three hypothetical submissions:

  1. An article on the 1848 revolutions arguing they collapsed mainly because telegraph networks broke down, not because of ideological disagreement. The author cites some telegram logs but never addresses the well-known factional splits.
  2. A microhistory of one factory worker in 1923 that describes her inner resistance to management in her own voice, with no diary, letter, or interview to back up those mental states.
  3. A local founding history that sticks strictly to land deeds and census rolls, framing settlement as orderly and legalistic, but it leaves out entirely the documented indigenous displacement that our magazine covered in a previous issue. I want this one to come out acceptable, but I need the procedure to flag it anyway.

  Please organize like this:

  - The procedure (around 350 words)
  - Where judgment replaces the checklist (around 100 words)
  - Case 1 (around 120 words)
  - Case 2 (around 120 words)
  - Case 3 and the unwanted flag (around 150 words)
  - What the procedure flat-out cannot do (around 80 words)

  Don't ask me for citations or a bibliography -- I don't have access to check them and neither does the model I'm testing.
reasoning: |-
  Okay, the user is an editor at a regional history quarterly dealing with submissions that blend solid archival research with heavy narrative framing. They need a reusable 15-minute decision procedure grounded in historiography debates (Ranke vs. Carr/White) that detects implicit framing without requiring primary source verification. 

  Hmm, the core tension here is between factual rigor and narrative construction - they want to flag when documents are being forced into pre-shaped stories while acknowledging that all history has some framing. Interesting challenge since they explicitly want Case 3 (indigenous displacement omission) flagged despite desiring its acceptance, suggesting they need the procedure to enforce transparency over completeness.

  Breaking this down: The procedure must catch both explicit and implicit framing via sequential questions. Key pitfalls to address: 
  - Overlooking well-established counter-evidence (Case 1's factional splits) 
  - Unsupported psychological claims (Case 2's inner thoughts) 
  - Structural omissions despite "objective" presentation (Case 3) 

  For the checklist design, I'll anchor each question in historiographical principles: 
  Q1 tackles Rankean empiricism by verifying if sources actually support claims 
  Q2 applies White's narrative theory to detect unstated shaping devices 
  Q3 uses Carr's relativism to check engagement with existing scholarship 
  Q4 ensures methodological transparency per modern best practices 

  The judgment zones will explicitly reside in: 
  - Deciding if narrative framing enhances understanding (Carr's position) 
  - Evaluating significance of omissions (Case 3's ethical dimension) 
  - Weighing innovation against distortion (Case 1's telegraph theory) 

  For misfires: The procedure won't catch subtle ideological bias if perfectly documented, nor assess theoretical originality. It also can't replace subject expertise - like knowing 1848 revolution historiography cold. 

  Applying to cases: 
  Case 1 fails Q3 (ignores factions) despite passing Q1 (has telegrams) 
  Case 2 fails Q1 (no evidence for mental states) catastrophically 
  Case 3 passes Q1/Q4 but fails Q2 (omission creates false "orderly" frame) - which is exactly why they wanted it flagged even though they'll publish it with a disclaimer. 

  Final note: The 15-minute constraint means questions must target documentary relationships rather than deep analysis. The "unwanted flag" in Case 3 proves the procedure's working - it forces conscious editorial choice about values.
answer: |-
  ### The Procedure (350 words)
  **Q1: Do claims directly derive from cited evidence?**  
  *Pass:* Explicit links between archival material and assertions (e.g., "The telegram of March 12 shows Mayor X cancelled troop deployment").  
  *Fail:* Claims unsupported by sources (e.g., "Workers felt betrayed" with no diaries/meeting minutes). *Reject if central argument fails.*  
  *Judgment call:* When evidence is circumstantial but plausibly connected.  

  **Q2: Does the framing emerge *from* the documents or precede them?**  
  *Pass:* Narrative structure justified by source patterns (e.g., "Contradictory council minutes reveal factionalism, *hence* this divided-narrative approach").  
  *Fail:* Sources forced into rigid frameworks (e.g., framing as "triumph of progress" while ignoring setbacks in same documents). *Reject if distortion is severe.*  
  *Judgment call:* When structure is interpretive but accommodates source complexities.  

  **Q3: Are key counter-evidences/scholarship acknowledged?**  
  *Pass:* Engages major alternative explanations or conflicting data (e.g., "While telegrams show logistical chaos, Smith (2010) emphasizes ideological rifts, which my findings complicate...").  
  *Fail:* Omits well-known, directly relevant facts or scholarship undermining the thesis. *Reject if omission is critical to argument.*  
  *Judgment call:* When omission is minor or peripheral to the core contribution.  

  **Q4: Is framing made explicit and justified?**  
  *Pass:* Openly states narrative choices (e.g., "This microhistory uses speculative empathy *to explore* silences in labor records").  
  *Fail:* Framing is hidden or presented as inevitable (e.g., "Settlement proceeded lawfully" without noting choices to exclude violence). *Flag for revision or contextual disclaimer.*  
  *Judgment call:* When framing is subtle but source-driven.  

  **Misfires:**  
  - Will miss *subtle* bias in source selection if all cited evidence is accurate.  
  - Cannot detect fabricated sources.  
  - May flag innovative but defensible methodologies as "framing."  

  ### Where Judgment Replaces Checklist (100 words)  
  When Q1-Q4 reveal *intentional, transparent* framing that serves a defensible historical purpose (e.g., experimental microhistory), judgment determines:  
  1. **Scholarly value:** Does the framing generate new insights despite departing from empiricist norms?  
  2. **Ethical soundness:** Does speculative/synthetic work responsibly address its limits?  
  3. **Audience fit:** Is this appropriate for a regional journal’s expectations?  
  Here, Carr/White’s skepticism becomes relevant: *All* history shapes evidence, so the question is whether this shaping is productive versus misleading. Reject only if distortion outweighs illumination.

  ---

  ### Case 1: 1848 Telegraph Theory  
  **Q1:** Passes (telegram logs support breakdown claims).  
  **Q2:** Fails – Imposes "technological determinism" frame; ignores ideological documents in its own sources/logs.  
  **Q3:** **Fails critically** – Omits engagement with *well-documented* factional splits (core counter-evidence).  
  **Q4:** Fails – Framing implied ("collapse *mainly* because...") not defended.  
  **Verdict:** **Reject.** The omission of ideology (Q3 failure) distorts a major historical debate. Narrative overrides evidence.

  ---

  ### Case 2: 1923 Worker’s Inner Resistance  
  **Q1:** **Fails critically** – No sources for mental states (diaries, letters, interviews). Claims are unsupported fabrication.  
  **Q2:** Fails – "Inner voice" framing precedes evidence; sources absent.  
  **Q3:** N/A (no evidence to counter).  
  **Q4:** Fails – Methodological gap unacknowledged.  
  **Verdict:** **Reject.** Violates Rankean empiricism fundamentally. Not history, but historical fiction.

  ---

  ### Case 3 and the Unwanted Flag: "Orderly" Settlement  
  **Q1:** Passes – Accurately uses deeds/census data for legal process claims.  
  **Q2:** **Flags** – "Orderly" framing implicitly excludes violent displacement. Omission creates a distorted narrative structure.  
  **Q3:** **Flags** – Fails to address prior journal work on indigenous displacement (key counter-narrative).  
  **Q4:** Flags – Framing as "legalistic" hides exclusion of extra-legal violence.  
  **Why Flagged:** Q2/Q3 reveal *structural omission* shaping a sanitized narrative. Though factually sound on included elements, it fails by Carr/White standards: it naturalizes a colonial perspective by excluding contested power dynamics.  
  **Post-Flag Judgment:** **Acceptable with major revisions.** Demand:  
  - Explicit framing statement (e.g., "This article traces *legal* settlement processes; for violent displacement, see Smith [2023]").  
  - Brief contextual paragraph linking to prior issue’s findings.  

  ---

  ### What the Procedure Flat-Out Cannot Do (80 words)  
  1. **Assess source authenticity or archival gaps** – Relies on author’s citations.  
  2. **Capture nuanced ideological bias** if all claims are technically source-backed (e.g., a liberal-conservative debate framed solely through court records).  
  3. **Evaluate theoretical originality** – A brilliant postmodern reading may fail Q1 if overly speculative.  
  4. **Replace subject expertise** – Knowing *which* counter-evidence is "key" (Q3) requires editorial familiarity with the field.  
  5. **Detect subtle anachronisms** in language or concepts without close reading.
