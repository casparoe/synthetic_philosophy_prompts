  Recommendations: They might need to overturn either the inverted spectrum or their zombie suspension. Or adjust the free will judgment if determinism is necessary. The gravitational constant scenario seems solid since laws might be metaphysically necessary. Math is definitely necessary. Water as XYZ is standard. 

