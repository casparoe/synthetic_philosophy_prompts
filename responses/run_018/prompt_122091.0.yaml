answer: |-
  The email hit Rutherford High, Lincoln Prep, and Westfield Academy simultaneously every Monday at 7 AM sharp: **WEEKLY STUDENT ENGAGEMENT SCORE UPDATE**. Subject line always the same. The body was a single, stark number – this week, Rutherford: **87.3**, Lincoln: **89.1**, Westfield: **86.7**.

  Ms. Rivera, Rutherford’s art department head (a department currently consisting of herself and half a shared classroom), stared at the number like it held a hidden curse. Across town, Lincoln’s Principal Vance did the same, drumming fingers on a stack of unpaid invoices for "digital engagement consultants." At Westfield, Principal Choi sighed, deleting yet another frantic group chat notification titled "SCORE CRISIS TEAM."

  The district’s coveted "Innovation in Arts" grant – enough to fund a full-time instructor, materials, maybe even a dedicated space – hinged entirely on this mysterious number. The algorithm, affectionately nicknamed "The Dewey" after the decimal system it once used to rank library books, now supposedly quantified student passion for the arts. Its inputs? Primarily social media mentions: hashtags, geotags, shares of school art accounts. Quantity over quality. Virality over vision.

  "We’re cannibalizing ourselves," Ms. Rivera muttered, reviewing Rutherford's budget. The line item for "Artist-in-Residence (Ceramics)" was zero. The line item for "Content Creator Contract (Influencer @DanceCrazeKai)" was $2,000. Kai’s last "engagement boost" involved ten students vaguely waving paintbrushes behind him while he lip-synced to a trending sound. It got 15K views. The ceramics kiln sat cold.

  **Lincoln Admin Group Chat:**
  > *Vance:* Westfield’s down to 86.7! We’re leading! But barely. Did the #LincolnLensFlare challenge get traction?
  > *Marketing Dir:* Mixed. Some good shares, but comments are mostly ‘What lens flare? This is just a gym selfie?’
  > *Vance:* Doesn’t matter! Mentions = score. Push harder. Can we get another micro-influencer? Budget the… uh… life drawing model stipend.

  Lincoln had sacrificed their popular life drawing class ("Too static for good video," Marketing had decreed) to fund faster TikTok strategists.

  Meanwhile, at Westfield, Ben Tanaka, a quiet junior who actually *wanted* to learn printmaking, scrolled through his school’s official Instagram. Post after post: neon-filtered photos of empty hallways captioned "So much creative energy buzzing at Westfield today! #WestfieldWonders #ArtsAlive", paid promotions featuring local food bloggers awkwardly holding half-finished papier-mâché bowls ("So artsy! #SupportLocalArts"), timelapses of murals being painted… by hired graphic designers, not students. The actual after-school printmaking club met in a storage closet, sharing one battered press.

  Ben saw the pattern. It wasn't about art; it was about feeding The Dewey. A cold, silent machine in the district server room, crunching hashtags, indifferent to the hollowing out of the very thing it was meant to measure.

  The principals finally broke. A clandestine meeting was arranged in a neutral location: the back room of a failing diner halfway between the three schools. Over lukewarm coffee, the exhaustion was palpable.

  "We look ridiculous," Vance admitted, stirring sugar with unnecessary violence. "My kids made a parody video last week: ‘How to Art: Step 1, Hire a Teenager with 50K Followers.’ It got more organic engagement than our last three paid campaigns *combined*."

  "We cut the advanced photography darkroom," Choi whispered, her voice tight. "For what? So we could afford that aerial drone footage of the football field forming a *vague* paintbrush shape? The Dewey loved the drone hashtags."

  Rivera leaned forward. "We have to stop. All of us. Simultaneously. Redirect the influencer money back to actual supplies, actual teachers. Run real projects. Trust that genuine engagement will… register somehow."

  They nodded, a fragile pact forged in shared desperation. They’d present a united front to their PTA boards, their superintendents. Cold turkey on the digital crack.

  Then, Choi’s phone buzzed. The Monday email. **WEEKLY STUDENT ENGAGEMENT SCORE UPDATE**. She paled. "Oh no."

  *   **Rutherford:** 85.2 (Down 2.1)
  *   **Lincoln:** 87.5 (Down 1.6)
  *   **Westfield:** 84.9 (Down 1.8)

  A collective flinch. The Dewey hadn’t just punished them; it had punished them *unevenly*. Rumors instantly swirled in the tense silence. Had Rutherford secretly boosted something? Did Lincoln find a new loophole? Was Westfield holding back?

  "The weighting," Vance rasped. "Who knows what it prioritized this week? Maybe longer videos? Maybe specific platforms? If we all stop cold and one of us… *doesn't*…"

  The unspoken truth hung heavy: Defection was safer. The algorithm was a black box. Its rules shifted invisibly. Falling behind felt like death. Cooperating felt like unilateral disarmament in a war with invisible snipers.

  **Westfield Strategy Chat (Admin Only):**
  > *Choi:* We took a hit. A big one.
  > *Marketing Dir:* We have to respond! The #WestfieldWonders hashtag dipped 12% week-over-week. Rutherford’s #RuthCreative tag actually spiked Tuesday… suspicious, right?
  > *Choi:* But the pact…
  > *Marketing Dir:* Did THEY keep it? Look at Lincoln’s score drop was smallest! They’re probably scrambling right now. If we don’t counter-punch, we’re dead last. Grant = gone. Board will have my head. Yours too.
  > *Choi:* …What do you propose?
  > *Marketing Dir:* Got a quote. $1500. Student-run TikTok takeover by that skateboarder guy. Big local following. He’ll do a ‘day in the life’… art-adjacent. Maybe kickflip over some paint cans? #EdgyArts #WestfieldRad

  The pact dissolved before the coffee went completely cold. Within hours, Rutherford hired a meme page manager. Lincoln launched a 24-hour "art challenge" livestream featuring mostly school spirit shoutouts. Westfield approved the skateboarder.

  Ben watched it unfold from the printmaking closet. He saw the frantic posts flood his feed. He heard the announcements pushing new hashtags. He saw Ms. Rivera’s face, tight and resigned, as she explained to the remaining art club why the promised new etching tools were delayed – again – because the "digital visibility budget needed shoring up."

  He opened his sketchbook. Not to draw, but to think. He drew a crude, many-armed figure. Each arm was labeled: #Hashtag, Influencer $, Score, Grant, Board Pressure, Parent Expectations. The arms weren't controlled by a head; they just grasped at each other, pulling tighter and tighter, dragging the figure – labeled simply "Art" – down into a pit. At the bottom, he scribbled a name he’d stumbled upon in an old philosophy essay: **MOLOCH**.

  No evil mastermind. No mustache-twirling villain in the district office. Just a dumb, old algorithm designed to count library books, repurposed into a god no one understood, demanding sacrifices of time, money, and genuine creativity. It demanded them because *not* sacrificing felt riskier. And everyone, every principal, every marketing director, every well-intentioned teacher caught in the gears, was just trying to survive its capricious judgment. They fed the machine to avoid being devoured by it, even as they starved the very thing they were trying to save.

  The next Monday, the scores ticked up marginally. Rutherford: 86.0. Lincoln: 88.2. Westfield: 85.5. Relief, thin and bitter, washed over the administrators. The trap was reset. The cycle continued. Outside Westfield’s front doors, the hired graphic designer’s vibrant, meaningless mural, perfectly optimized for Instagram backdrops, was already starting to peel at the edges in the spring rain. Ben walked past it, head down, carrying his single, carefully protected linoleum block. The real art, silent and unseen, happened in the closet. The Dewey didn’t count that.
