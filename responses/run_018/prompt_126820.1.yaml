answer: |-
  Below is my structured evaluation of the claim, culminating in an overall credence of **0.62** (indicating moderate but non-certain agreement). I decompose it into your three specified sub-questions, assign rough probabilities to each, explain their synthesis, identify the key sensitivity point, and outline revision scenarios.  

  ### **1. Does Burkean conservatism draw a principled distinction between institutional and cultural knowledge?**  
  **Credence: 0.65**  
  Burke’s *Reflections on the Revolution in France* emphasizes political institutions (e.g., inherited constitutions, common law) as "latent wisdom" embodying collective experience across generations. Cultural norms (e.g., religion, manners) are also valued, but institutions are framed as *structural safeguards* against rash change, given their role in coordinating complex societies. Burke treats cultural norms as more adaptable to "circumstantial prudence" (*Letters on a Regicide Peace*), while institutions demand stricter adherence to prescriptive tradition. However, he never explicitly ranks them, and his organic view of society blurs rigid boundaries. Thus, I assign **0.65**: likely, but not explicit.  

  ### **2. Is Chesterton's fence primarily about epistemic humility toward tacit knowledge?**  
  **Credence: 0.75**  
  Chesterton’s fence ("don’t remove a fence until you know why it was built") is explicitly epistemic: it targets the *invisibility* of distributed practical knowledge (e.g., a farmer’s reason for a fence placement). While risk aversion is a consequence, the core is humility toward *emergent functionality* lost to rational reconstruction. Chesterton contrasts this with norms like "why not marry three wives?" which he dismisses via moral reasoning (*The Thing*, 1929). General risk aversion (e.g., Oakeshott’s skepticism) is broader, but Chesterton anchors his fence in functional opacity. Thus, **0.75**: strong alignment with epistemic humility, though not excluding risk.  

  ### **3. Do procedural institutions contain more irrecoverable knowledge than cultural norms?**  
  **Credence: 0.55**  
  Procedural institutions (e.g., jury trials) often encode *coordination mechanisms* refined through trial-and-error (e.g., rules of evidence balancing fairness/efficiency). Their knowledge is distributed across roles (judges, jurors, clerks) and resists top-down redesign. Cultural norms (e.g., marriage customs) also embed tacit social knowledge but are more susceptible to moral reinterpretation (e.g., shifts toward egalitarian marriage via reasoned debate). Yet some norms (e.g., religious rituals) are equally opaque (e.g., Durkheim’s *collective effervescence*). Institutions’ *systemic complexity* gives a slight edge, but the distinction is porous. **0.55**: plausible but debatable.  

  ---

  ### **Synthesis of Overall Credence: 0.62**  
  - I combine these multiplicatively (adjusting for interdependence):  
    **0.65 (Q1) × 0.75 (Q2) × 0.55 (Q3) ≈ 0.27** → then normalize to a 0–1 scale accounting for partial dependencies (e.g., Q3 relies on Q1).  
  - Alternatively, using a weighted mean (weights: Q1=40%, Q2=30%, Q3=30%):  
    **(0.65×0.4) + (0.75×0.3) + (0.55×0.3) = 0.65** → discounted to **0.62** for residual uncertainty.  
  - **Key sensitivity**: The claim is most sensitive to **Q3 (institutions vs. cultural norms)**. If Q3 falls below 0.5, the entire argument collapses, as the epistemic distinction drives the differential presumption.  

  ---

  ### **Revision Scenarios**  
  - **Upward revision (to ~0.8+)**: A historical case showing institutional reform (e.g., sudden abolition of juries) causing systemic collapse *due to lost coordination knowledge*, while cultural shifts (e.g., secularizing marriage) proceeded without comparable dysfunction. Example: Post-Soviet rapid democratization failing versus Nordic gradual family-law reforms succeeding.  
  - **Downward revision (to ~0.3)**: A conceptual argument demonstrating that cultural norms *equally* embody irreconstructible knowledge (e.g., anthropologist Clifford Geertz showing rituals as "deep play" encoding social equilibrium). Or evidence that Burke treats cultural norms (e.g., established religion) as equally untouchable (e.g., his defense of the Church of England’s institutional role).  

  This credence reflects the claim’s *theoretical coherence* but highlights empirical fragility in Q3. For your project, testing Q3 against historical institutional reforms (e.g., jury modifications in 19th-century Britain) versus cultural shifts (e.g., marriage equality) would be decisive.
