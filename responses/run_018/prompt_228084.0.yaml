prompt: |-
  Please compare Marx’s ideas of exploitation and alienation using this slightly weird case: a delivery co-op where the workers own the business, but an outside algorithm controls their routes, pay formula and pace. Could the workers still be exploited even though they’re the owners, and could the algorithm abolish exploitation while making alienation worse? I’m a high school student so keep it clear, but don’t flatten the differences. Give me exactly 5 numbered points, one or two sentances each, in British English, with no intro or conclusion.
