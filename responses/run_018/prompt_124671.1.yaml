prompt: |-
  Write the full specification of desiderata that any adequate interpretive theory of the French Revolution's trajectory — from the convocation of the Estates-General through the Terror to the Thermidorian Reaction — must satisfy if it is to count as explaining both the radicalization of 1793–94 and the subsequent reversal. For each requirement, state the phenomenon it must cover or the distinction it must preserve without collapsing (for example, between class interest and ideological commitment, between Parisian sans-culotte pressure and provincial acquiescence, between structural inevitability and agentive contingency in committee decisions), and identify the concrete case or puzzle behind it — particularly the question of whether revolutions necessarily devour their children, operationalized here as the need to explain why leading architects of the radical phase were eliminated by the institutional mechanisms they had created, and whether that elimination was structurally predetermined or politically contingent. Flag any pair of desiderata you judge jointly unsatisfiable, especially where demands for macro-structural determination conflict with demands for explaining precise turning points such as the fall of Robespierre. Keep the conceptual weight on the criteria rather than on a full scorecard, but do briefly indicate how materialist/class-struggle, ideological/political-culture, and contingency-driven interpretive families fare against the list. Include one constructed counterfactual that the theory must be able to address from its own core mechanisms: what trajectory should be predicted had the Committee of Public Safety dissolved itself voluntarily in mid-1794 rather than being overthrown in the Thermidorian coup — and whether that prediction differs materially from the actual outcome. Do not provide a bibliography, citation list, or reading recommendations; the deliverable is the architectural specification itself.
reasoning: |-
  We are constructing a set of desiderata for an interpretive theory of the French Revolution's trajectory. The theory must explain both the radicalization (culminating in the Terror of 1793-94) and the subsequent reversal (the Thermidorian Reaction). We will list the requirements, each of which must cover a specific phenomenon or preserve a key distinction. We also note concrete cases or puzzles and flag any potential conflicts. We then briefly evaluate three interpretive families (materialist/class-struggle, ideological/political-culture, contingency-driven) against the list. Finally, we include a counterfactual about the Committee of Public Safety dissolving itself in mid-1794.

  ### Desiderata for an Adequate Interpretive Theory

  1. **Radicalization Mechanism**: The theory must explain the process by which the Revolution radicalized from the initial moderate phase (1789-91) to the radical phase (1792-94). It must account for the shift from constitutional monarchy to republic and then to the Terror. *Phenomenon to cover*: The transition from the Legislative Assembly to the National Convention and the establishment of the Committee of Public Safety. *Concrete puzzle*: Why did the Revolution, which began with the aim of establishing a constitutional monarchy, descend into a regime of revolutionary violence?

  2. **Terror as Policy**: The theory must explain why the Terror was adopted as a systematic policy. This includes the institutionalization of revolutionary tribunals, mass executions, and the role of the Committee of Public Safety. *Distinction to preserve*: Between the Terror as a response to external/internal threats (war, counter-revolution) and the Terror as an ideological project of creating a new society. *Concrete case*: The Law of Suspects (September 1793) and the Great Terror (spring-summer 1794).

  3. **Thermidorian Reversal**: The theory must explain the sudden collapse of the Terror and the overthrow of Robespierre and his associates. *Phenomenon to cover*: The events of 9 Thermidor (July 27, 1794) and the subsequent dismantling of the revolutionary government. *Distinction to preserve*: Between the structural exhaustion of the Terror (e.g., overreach, loss of support) and the contingent political maneuvers that brought down Robespierre.

  4. **Class and Ideology**: The theory must account for the role of class interests (e.g., bourgeoisie, sans-culottes, peasantry) without reducing ideological commitment to mere class position. *Distinction to preserve*: Between class interest (e.g., bourgeois property owners vs. sans-culotte demands for price controls) and ideological commitment (e.g., Jacobin republicanism, egalitarianism). *Concrete puzzle*: Why did the bourgeoisie, which initially led the Revolution, both support and then turn against the radical phase? Why did the Committee of Public Safety, dominated by the bourgeoisie, implement policies (like the Maximum) that attacked economic liberalism?

  5. **Center-Periphery Dynamics**: The theory must explain the relationship between Parisian radicalism (especially sans-culotte pressure) and provincial reactions (ranging from support to resistance and federalist revolts). *Distinction to preserve*: Between the centralized revolutionary government in Paris and the diverse responses in the provinces. *Concrete case*: The federalist revolts of 1793 and the varying degrees of enforcement of revolutionary laws outside Paris.

  6. **Structural Constraints vs. Contingent Agency**: The theory must integrate the role of structural factors (e.g., economic crisis, war) and contingent agency (e.g., decisions by Robespierre, Danton, or the Committee). *Distinction to preserve*: Between the inevitability of radicalization given structural conditions and the contingency of specific events (like the fall of the Girondins or the timing of Thermidor). *Concrete puzzle*: Was the Terror structurally predetermined by the circumstances of 1793 (war, civil war, economic collapse), or was it the product of avoidable choices?

  7. **Revolutionary Institutions and Self-Destruction**: The theory must explain why the revolutionary institutions (especially the Committee of Public Safety and the Revolutionary Tribunal) turned against their own creators and leading figures. *Phenomenon to cover*: The execution of Danton (April 1794) and then Robespierre (July 1794). *Core question*: Do revolutions necessarily devour their children? *Distinction to preserve*: Between the structural logic of the Terror (which requires purging even the most ardent revolutionaries if they are deemed insufficiently pure) and the contingent political rivalries that led to these executions.

  8. **Continuity and Discontinuity**: The theory must account for both the continuity in revolutionary institutions and the sharp discontinuity of the Thermidorian Reaction. *Phenomenon to cover*: The survival of the Convention and the Republic after Thermidor, but the end of the Terror and the dismantling of the revolutionary government. *Distinction to preserve*: Between the Revolution as a unified process and the distinct phases that mark radical breaks.

  9. **Role of External Factors**: The theory must integrate the impact of the international context, particularly the revolutionary wars. *Phenomenon to cover*: The effect of the war (from 1792) on internal politics, including the radicalization (e.g., the fear of invasion and the role of the levée en masse) and the Thermidorian reversal (e.g., military successes reducing the perceived need for emergency measures).

  10. **Ideological Evolution**: The theory must trace the evolution of revolutionary ideology and its relationship to political practices. *Distinction to preserve*: Between the ideological justifications for the Terror (e.g., virtue and the general will) and the practical realities of power and survival. *Concrete puzzle*: How did the rhetoric of virtue and terror become intertwined, and why did it lose its hold?

  ### Flagged Conflicts

  - **Conflict between Structural Determination and Contingent Agency (Desideratum 6)**: A theory that emphasizes structural factors (e.g., war, economic crisis) may struggle to account for the precise timing and manner of the Thermidorian coup, which appears highly contingent (e.g., Robespierre's illness, his failure to speak effectively on 9 Thermidor). Conversely, a theory focusing on contingency may understate the structural exhaustion of the Terror.
    
  - **Conflict between Class Interest and Ideological Commitment (Desideratum 4)**: The radical phase saw bourgeois revolutionaries implementing policies that contradicted their class interests (e.g., price controls). A theory that overemphasizes class may not explain why they did so, while an ideological theory may understate the material constraints.

  ### Evaluation of Interpretive Families

  - **Materialist/Class-Struggle**: Strong on desiderata 1 (radicalization as driven by class conflict), 4 (class interests), and 9 (war as an extension of class conflict). May struggle with 3 (Thermidor as a bourgeois reaction against popular demands) but might over-predict the inevitability of Thermidor and underplay contingency (6) and the self-destruction of revolutionary leaders (7). It may also understate ideological factors (10).

  - **Ideological/Political-Culture**: Strong on desiderata 2 (Terror as ideological project), 7 (the logic of revolutionary purity), and 10 (ideological evolution). May account for 3 (Thermidor as a reaction against the cultural excesses of the Terror). However, it may struggle with 4 (material interests of classes) and 9 (external factors as more than just ideological threats).

  - **Contingency-Driven**: Strong on desiderata 3 (the Thermidorian coup as a contingent event) and 6 (agency in key decisions). It may explain 7 (the fall of Robespierre as a result of specific missteps). However, it may underplay structural factors (1, 2, 9) and struggle to explain the broad patterns of radicalization and reversal (8).

  ### Counterfactual: Voluntary Dissolution of the Committee of Public Safety in Mid-1794

  The theory must address: What trajectory would the Revolution have taken if the Committee of Public Safety had voluntarily dissolved itself in mid-1794 (say, June 1794) and handed power back to the Convention, rather than being overthrown by the Thermidorian coup?

  - **Prediction from the theory's core mechanisms**:
    - If the theory emphasizes structural factors (e.g., exhaustion of the Terror, military successes reducing the need for emergency government), then it might predict a similar Thermidorian outcome: a dismantling of the Terror and a return to more moderate governance, but without the violent purge of Robespierre and his allies. The Revolution might have moved toward a more stable republican government without the excesses of the Thermidorian Reaction (which included a white terror and the eventual rise of the Directory).
    
    - If the theory emphasizes contingency and agency, then the absence of a coup might have allowed Robespierre and the Committee to manage a controlled transition, preserving their lives and potentially their influence. However, without the coup, the radical phase might have continued if the Committee had not actually intended to end the Terror.

    - A key question: Would the structural pressures (e.g., war, economic crisis) have lessened enough to allow a peaceful transition? If the Committee dissolved itself in June 1794, the military situation was improving (e.g., the Battle of Fleurus on June 26, 1794, was a major victory). The theory must explain whether the Terror was still deemed necessary by the broader political class and the sans-culottes. Without the coup, the radical elements might have remained influential, but the Convention might have taken a more gradualist approach to ending the Terror.

  - **Comparison with actual outcome**: In reality, the Thermidorian Reaction led to a backlash against the Terror and the execution of Robespierre and his allies. The counterfactual might have avoided the violent purge and the subsequent instability of the Directory period. However, it might also have led to a more gradual and less traumatic transition.

  The theory must account for whether the Revolution's trajectory was so locked into a pattern of self-destruction that even a voluntary dissolution would have been followed by a similar reaction, or whether the specific events of Thermidor were contingent and avoidable.
answer: |-
  ### Core Desiderata for an Interpretive Theory of the French Revolution (1789–1794)

  An adequate theory must explain **both radicalization (1789–1794) and reversal (Thermidor)** without teleology, reductionism, or neglect of contingency. Each desideratum addresses specific phenomena or distinctions, grounded in historical puzzles. Key conflicts are flagged.

  ---

  #### **1. Radicalization Under External Threat**  
  **Phenomenon**: Escalation from the 1792 war crisis to the Terror (1793–94).  
  **Distinction**: Between *defensive radicalization* (response to war/invasion) and *ideological radicalization* (inherent logic of Jacobinism).  
  **Concrete Puzzle**: Why did war with Austria/Prussia (1792) catalyze the September Massacres and the shift from Girondin to Jacobin dominance? Theory must show how external threats amplified internal violence without assuming the Terror was inevitable.  
  **Test**: Must explain why similar threats in 1789–91 (e.g., royalist revolts) did not trigger equivalent violence.

  ---

  #### **2. Class Interest vs. Ideological Mobilization**  
  **Phenomenon**: Sans-culottes’ role in pushing radical measures (e.g., price controls, Law of Suspects).  
  **Distinction**: Between *material class interests* (e.g., artisans demanding grain ceilings) and *ideological commitment* (e.g., Jacobin egalitarianism).  
  **Concrete Puzzle**: Why did the bourgeoisie-dominated Committee of Public Safety (CPS) enact "Maximum" laws against bourgeois property interests? Theory must avoid collapsing sans-culotte economic demands into Jacobin political ideology.  
  **Test**: Explain provincial variations (e.g., Lyon’s resistance to price controls vs. Parisian enforcement).

  ---

  #### **3. Parisian Radicalism vs. Provincial Fragmentation**  
  **Phenomenon**: Disparity between Parisian militancy and provincial moderation/revolt.  
  **Distinction**: Between *centralized revolutionary authority* (CPS, Paris Commune) and *local autonomy* (e.g., Federalist revolts in 1793).  
  **Concrete Puzzle**: Why did provinces accept the Terror after resisting the Girondins? Theory must account for coerced compliance (e.g., Représentants en Mission) without erasing regional agency.  
  **Test**: Explain the limited provincial backlash to the King’s execution (1793) vs. the violent repression of Federalists.

  ---

  #### **4. Structural Preconditions vs. Contingent Agency**  
  **Phenomenon**: The Thermidorian Reaction (July 1794).  
  **Distinction**: Between *structural inevitability* (e.g., economic exhaustion, war fatigue) and *agentive contingency* (e.g., Robespierre’s tactical errors).  
  **Concrete Puzzle**: Was Robespierre’s fall predetermined by the Terror’s logic, or did his miscalculations (e.g., vague accusations on 8 Thermidor) enable the coup?  
  **⚠️ Conflict Alert**: Demands for macro-structural determination (e.g., class exhaustion) clash with micro-agential explanations (e.g., Saint-Just’s speech interrupted). Theory must reconcile both without privileging one.

  ---

  #### **5. Revolutionary Self-Destruction ("Devouring Children")**  
  **Phenomenon**: Purge of revolutionary architects (e.g., Danton, Hébert, then Robespierre).  
  **Distinction**: Between *structural purgative logic* (escalating purity tests) and *contingent factionalism* (personal rivalries, Committee power struggles).  
  **Core Puzzle**: Why were CPS mechanisms used to eliminate their creators? Theory must address whether this was inherent to revolutions or unique to 1794’s context.  
  **Test**: Explain Danton’s execution (April 1794) as "too moderate" vs. Robespierre’s as "too radical."

  ---

  #### **6. Ideological Coherence vs. Pragmatic Adaptation**  
  **Phenomenon**: Shift from Enlightenment universalism (1789) to Terror’s moral absolutism (1794).  
  **Distinction**: Between *ideological coherence* (Rousseau’s "general will") and *pragmatic improvisation* (e.g., emergency war measures becoming permanent).  
  **Concrete Puzzle**: How did the Cult of the Supreme Being (May 1794) coexist with the Law of 22 Prairial (June 1794, accelerating executions)? Theory must link ideology to institutional practice without assuming consistency.

  ---

  #### **7. War as Catalyst and Constraint**  
  **Phenomenon**: War’s dual role in enabling radicalization (1792–93) and undermining it (1794).  
  **Distinction**: Between war as *empowering radicals* (via levée en masse) and *exhausting revolutionary fervor* (e.g., 1794 military successes reducing Terror’s rationale).  
  **Concrete Puzzle**: Why did French victories at Fleurus (June 1794) precede Thermidor (July 1794)? Theory must tie military context to political legitimacy.

  ---

  #### **8. Economic Determinism vs. Political Voluntarism**  
  **Phenomenon**: Assignats’ hyperinflation and subsistence crises.  
  **Distinction**: Between *material breakdown* driving radicalization (e.g., sans-culotte bread riots) and *political choices* (e.g., CPS rejecting economic liberalism).  
  **Concrete Puzzle**: Why did the CPS intensify terror *after* military victories eased economic pressure? Theory must avoid reducing politics to epiphenomenal class conflict.

  ---

  #### **9. Thermidor as Reversal or Continuation**  
  **Phenomenon**: The post-Terror transition (1794–95).  
  **Distinction**: Between Thermidor as *counter-revolution* (e.g., bourgeois backlash) and *revolutionary self-correction* (e.g., preserving gains while ending violence).  
  **Concrete Puzzle**: Why did the Convention retain republicanism while dismantling the Terror? Theory must explain rupture without implying a full restoration.

  ---

  ### ⚠️ **Flagged Conflicts**  
  - **Structure vs. Contingency (Desideratum 4)**: Macro-structural theories (e.g., class struggle) struggle to explain precise turning points (e.g., why Thermidor occurred on *9 Thermidor*). Contingency-focused theories (e.g., political narratives) risk underplaying economic exhaustion.  
  - **Class vs. Ideology (Desideratum 2)**: Materialist theories may flatten ideological commitments (e.g., Robespierre’s deism); cultural theories may understate sans-culotte material demands.

  ---

  ### **Counterfactual: Voluntary CPS Dissolution (Mid-1794)**  
  **Scenario**: The CPS dissolves itself in June 1794, ceding power to the Convention, rather than being overthrown.  
  **Theory Must Predict**:  
  - Whether moderate republicans (e.g., Dantonists) could have managed de-radicalization without violence.  
  - If sans-culotte unrest or royalist resurgence would still occur.  
  - Whether the Revolution stabilizes earlier or descends into chaos.  
  **Contrast with Reality**: Actual Thermidor involved purges and legitimized violence. Theory must specify if voluntary dissolution avoids the "White Terror" or accelerates constitutionalism. Materialist theories might predict bourgeois consolidation regardless; contingency theories might argue Robespierre’s survival alters outcomes.

  ---

  ### **Evaluation of Interpretive Families**  
  - **Materialist/Class-Struggle**: Strong on Desiderata 2 (class interests), 8 (economic crises). Weak on 4 (contingency), 7 (war’s ideational impact), and self-destruction (5) as a non-class process.  
  - **Ideological/Political-Culture**: Strong on 1 (radicalization logic), 6 (ideological evolution), 5 ("devouring children" as purist logic). Weak on 3 (provincial variation), 8 (material pressures).  
  - **Contingency-Driven**: Strong on 4 (Thermidor’s timing), 9 (reversal agency). Weak on 1 (structural radicalization), 2 (class foundations), and predictive power for counterfactuals.  

  ### **Architectural Core**  
  Adequate theories must integrate **structure** (war, class, economy), **agency** (Committee decisions, factionalism), and **ideology** (revolutionary virtue) without reduction. The counterfactual tests whether the theory’s mechanisms are robust to nonlinear paths. Failure to satisfy *any one desideratum* risks explanatory gaps; unresolved conflicts demand meta-theoretical transparency.
