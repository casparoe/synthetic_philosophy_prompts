answer: |-
  Drawing on Bernard Williams' conceptual framework from *Shame and Necessity* and *Truth and Truthfulness*, particularly his analysis of ethical shifts driven by social recognition rather than rational adjudication, here’s how his commitments would likely engage with your case:

  1. **Against "Argument-First"**: Williams rejected the idea that moral revolutions are primarily won by logical persuasion. He argued that shifts like the abandonment of dueling occurred not because opponents "proved" it irrational, but because the *social conditions sustaining its honor-value* collapsed. Your friend’s claim—that arguments against AI plagiarism pre-existed and only gained traction post-detection—would strike Williams as mistaking correlation for causation. The *stigma* erupted swiftly because institutional structures (universities, publishers) faced existential threats to their authority (e.g., credentialing, originality-as-value). The arguments didn’t "win"; they were weaponized by newly urgent interests.

  2. **Honor, Shame, and the "Missing Peer Group"**: Williams’ notion of "thick" ethical concepts ties shame to socially embedded identities. Your friend’s objection—that no "gentlemen’s code" exists here—overlooks his key insight: honor dynamics manifest in *professional* contexts too. Academia and journalism are status economies where reputation (peer recognition) mediates self-respect. Passing off AI text as one’s own violates the tacit bargain of these fields: that status derives from *demonstrated skill*. The stigma reflects a defense of professional honor, not personal virtue. Detection tools didn’t create the norm; they exposed violations of an existing (if unarticulated) expectation of authentic labor, triggering collective shame.

  3. **Interest vs. Morality**: Williams was skeptical of moralizing self-interest but acknowledged that interests often adopt ethical guise for legitimacy. Here, the stigma serves to protect the economic and symbolic capital of human creators. However, he’d distinguish this from *mere* interest: the outrage isn’t just about job protection but about *what counts as a human contribution* in practices premised on individual voice (e.g., essays, reporting). This intersects with his work on "accuracy" and "sincerity" as virtues underpinning trust. AI text disrupts the "truthfulness" compact between creators and audiences, reframing the issue as one of authenticity—a thin moral concept Williams might see as parasitic on thicker social goods.

  4. **Is This a Revolution?**: Williams would likely classify this as an **honor shift confined to a professional class**, not a society-wide moral revolution. Unlike dueling (which redefined personal courage) or footbinding (which reconfigured gender), AI stigma is localized to fields where originality is currency. The speed stems from digital disruption accelerating institutional panic—akin to how printing presses rapidly reshaped scribal honor codes. The core "immorality" (deceit) is unchanged, but its *social salience* exploded because the professional stakes did. His framework captures this: shame mechanisms activated when a community’s self-conception is jeopardized.

  **Where His Commitments Run Out**: Williams might struggle to fully explain the *velocity* without augmenting his model. His examples (dueling, slavery abolition) unfolded over decades; here, digital tools compressed the timeline. He’d need to integrate technological *amplification*—how AI democratizes deception, forcing institutions to hastily erect shame-barriers where arguments alone were inert. He might also concede that "authenticity" is a thinner ethical concept than those he favored, blurring lines between moral and aesthetic offense.

  \answer{interest-first}  
  *(But note: Williams would see "interest" as enacted through honor-shame dynamics within the professional class, not as a crude materialist reduction.)*
