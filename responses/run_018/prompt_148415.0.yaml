prompt: |-
  You're an expert in comparative metaphysics and Buddhist philosophy. Before you write the plan, think step-by-step and do a quick brainstorm of the dependency chain. I'm a PhD student prepping a 90-minute session for second-year philosophy undergrads who've just finished classical logic and now think contradiction is always an error. I want to teach Nāgārjuna's tetralemma and Madhyamaka emptiness without falling back on the tired chariot example they probably saw in a youtube video.

  Plan the teaching arc for me: what logical reflex has to break before the fourfold negation makes sense; what concrete carrying example replaces the chariot (it must show why "it exists," "it doesn't exist," "both," and "neither" collapse for one reason, not four seperate arguments); the misconceptions they'll drag in—emptiness is nihilism, Nāgārjuna is just mystical—and exactly where in the sequence to kill each. Include one check at the end that distinguishes "they get emptiness as dependendent origination" from "they think it's all illusion." Also tell me what slice of the two-truths framework I should openly refuse to explain here. Keep it casual, like advising a fellow grad student, no bibliographies, and stay focused.
