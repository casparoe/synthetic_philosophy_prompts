prompt: |-
  I'm running a small workshop for policy grad students who think discounting the future is just inflation plus impatience. I want them to actually grasp pure time preference — the rho in the Ramsey rule for climate economics, not market interest rates. Plan the explanatory ark: what concept has to be in place before rho even makes sense, which concrete comparison should carry the idea (I'm torn between preserving a 3000-year-old bristlecone pine versus funding a far-future AI allignment grant — pick one and say why the other fails), the misconcetions they'll bring (lower rho means caring more, future people are literally less real, rho is just risk aversion), and exactly where in the sequence to kill each. Give me one end check that proves they've separated pure preference from growth and risk, not just parroted that zero rho is fair. Also say what to drop — the full derivation? intergenerational equity formulas? — and admit it openly.
reasoning: |-
  Okay, the user is running a workshop for policy grad students who mistakenly think discounting is just inflation plus impatience. They want to teach pure time preference (rho in the Ramsey rule) and need a structured plan. 

  First, I need to unpack why this is tricky. These students are conflating market interest rates with ethical discounting. Their confusion is practical (how discount rates work in policy) and philosophical (why we value future lives less). The bristlecone pine vs. AI alignment example decision matters because one makes the abstract concrete while the other introduces distracting complexities.

  Hmm... the bristlecone pine wins here. It's visceral - a living thing existing across millennia makes "sheer time distance" tangible. The AI example fails because it smuggles in existential risk and altruism debates, which would derail the core lesson. Must avoid that rabbit hole.

  Key pre-concept: opportunity cost won't cut it. They need to grasp that discounting embodies a value judgment about time itself, separate from growth or risk. The "sushi now vs identical sushi later" thought experiment is perfect for isolating that.

  Their misconceptions are predictable: 
  - Thinking lower rho = more caring (it's about time valuation, not compassion level)
  - Believing future people feel "less real" (a cognitive bias, not an ethical stance)
  - Confusing rho with risk aversion (which handles uncertainty, not pure time)

  I'll murder these in sequence: First, shatter the "less real" illusion with the coma survivor analogy. Then gut the "lower rho = virtuous" by showing rho=0 still discounts via growth. Finally, behead the risk aversion mix-up by contrasting predictable vs uncertain futures.

  The end check? A simple hypothetical: "If society could grow at 0% forever with zero risk, would you trade a life today for a life in 500 years?" If they say no, they've got pure time preference. If they justify with "but growth might happen!" or "extinction risk!", they're still contaminated.

  What to drop? Full Ramsey derivation - it's calculus-heavy and obscures the ethics. Intergenerational equity formulas can wait too. Better to admit "We're skipping the math to focus on why your ethical choices here matter for climate decisions." They'll appreciate the honesty.
answer: |-
  Here’s a structured explanatory arc for teaching pure time preference (ρ) to policy students, designed to shatter misconceptions and anchor understanding in ethical intuition:

  ---

  ### **Explanatory Arc**
  1. **Prerequisite Concept: Opportunity Cost ≠ Ethical Discounting**  
     - **Start here:** Explicitly sever the link between market interest rates and ethical discounting. Use a thought experiment:  
       *"If you could save a life today or save an identical life in 100 years, with absolute certainty and no economic growth, would you value them equally?"*  
       → Forces confrontation with time itself as a moral variable, detached from inflation/returns.

  2. **Core Analogy: The Bristlecone Pine (Why It Works)**  
     - **Concrete comparison:** *"Would you spend $1M today to preserve a 3,000-year-old bristlecone pine from wildfire, knowing it will live another 2,000 years if saved?"*  
     - **Why it succeeds:**  
       - **Tangible legacy:** Embodies existence value across time without utility fluctuations.  
       - **No confounding factors:** No risk of future "overpopulation" of pines, no tech/growth dependencies. Pure intergenerational bequest.  
       - **Emotional resonance:** Connects to cultural awe for ancient living things (vs. abstract AI alignment).  
     - **Why the AI grant fails:**  
       - Invokes speculative altruism (Is future AI good?), risk debates (Will the grant succeed?), and growth assumptions (Will future tech make $ trivial?). Distracts from pure time preference.

  3. **Execution Sequence & Misconception Kill Points**  
     | **Sequence**                     | **Misconception Killed**                          | **How to Kill It**                                                                 |
     |----------------------------------|---------------------------------------------------|------------------------------------------------------------------------------------|
     | After Bristlecone Pine analogy   | *"Future people/things feel less real"*           | **Coma survivor analogy:** "You’d care about your life in 100 years if you woke up. Why is a stranger different?" |
     | When defining ρ                  | *"Lower ρ = I care more (virtue signaling)"*      | **Flip the lens:** "ρ=0 doesn’t mean ‘caring more’—it means time distance is morally irrelevant. Is that defensible?" |
     | Before introducing Ramsey Rule  | *"ρ is just risk aversion"*                      | **Contrast:** "Risk aversion is about uncertain outcomes. ρ applies even when outcomes are certain." |

  4. **End Check: The Isolation Test**  
     - Pose: *"Assume a guaranteed 0% economic growth (g=0) and zero extinction risk. Would you trade 1 life today for 1 life in 500 years? Why/why not?"*  
     - **Passing answers show:**  
       - "No, because mere temporal distance reduces value" → Grasps ρ > 0.  
       - "Yes, unless time itself changes worth" → Grasps ρ = 0.  
     - **Failing answers:** Invoke growth ("Future lives will be richer!") or risk ("Humanity might not exist!"). **Intervene:** "Strip those away—what’s left?"

  5. **What to Drop & Why**  
     - **Cut the full Ramsey derivation.** Say openly: *"We’re skipping the calculus (dC/dt, etc.) to focus on ρ’s ethical spine. Real-world applications use reduced-form versions."*  
     - **Avoid intergenerational equity formulas** (e.g., discounted utilitarianism vs. sustainability criteria). Admit: *"This is a 3-hour debate we lack time for. Today’s goal: isolate ρ."*  

  ---

  ### **Key Insights to Stress**
  - **ρ is an ethical choice, not a market outcome.** It answers: "Does *when* something happens inherently affect its value?"  
  - **ρ > 0 implies temporal inequality:** Valuing present welfare more than identical future welfare *because it’s sooner*.  
  - **Climate stakes:** A 2% ρ vs. 0% ρ can change climate damage costs by orders of magnitude. This is where students’ policy leverage lives.  

  This arc moves from visceral analogy to rigorous isolation of ρ, leaving students equipped to debate *why* we might devalue the future—not just how to plug numbers into models.
