  ## Research Proposal: Keynes's Bloomsbury Goods - An Unacknowledged Debt to Moorean Pluralism?

  **Research Question:** To what extent does John Maynard Keynes’s vision of the "good life" (centered on minimal work, artistic pursuits, and friendship, as outlined in "Economic Possibilities for our Grandchildren") implicitly depend upon G.E. Moore’s pluralistic theory of intrinsic value, particularly its embrace of aesthetic experience and personal affection, without providing independent justification for these specific goods?

  **Rationale & Gap in Existing Literature:** John Maynard Keynes’s famous 1930 essay paints a compelling picture of a future liberated from economic scarcity, where individuals work minimally (around 15 hours a week) and devote themselves primarily to the "arts of life" and friendship. While extensively analyzed by economists for its growth predictions and technological optimism, the *ethical foundations* of Keynes’s specific vision of the "good life" remain significantly underexplored. Existing scholarship overwhelmingly treats Keynes as an economist and policy thinker, focusing on his macroeconomic theories or his role in the Bloomsbury Group's social milieu. Crucially, **Keynes himself offers no sustained philosophical argument *why* artistic engagement and personal relationships constitute the paramount intrinsic goods worthy of occupying humanity's newfound leisure.** He presents these as self-evident or desirable ends, seemingly inherited from the aesthetic and ethical sensibilities of the Bloomsbury Group. This raises a critical philosophical question: where does this specific catalogue of ultimate goods originate, and upon what ethical basis does it rest?

  I propose that the most plausible and significant source is G.E. Moore’s *Principia Ethica* (1903), which profoundly influenced the early Bloomsbury intellectuals, including Keynes. Moore argued for ethical non-naturalism and, crucially, **value pluralism**: that "good" is a simple, indefinable property apprehended by intuition, and that the *only* things possessing intrinsic goodness are (1) the appreciation of beautiful objects (aesthetic experience) and (2) the enjoyment of personal affections (friendship/love). This uncannily mirrors Keynes’s vision. The existing literature largely mentions Moore's influence on Bloomsbury in general terms but fails to rigorously interrogate whether the *specific content* of Keynes’s post-scarcity utopia – specifically the elevation of art and friendship above all else – is **structurally dependent** on Moore's articulation of intrinsic goods, bypassing the need for Keynes to argue for these goods independently. This project bridges Keynesian economics, value theory, and intellectual history to uncover the latent philosophical scaffolding of his influential future vision.

  **Methodology:** The primary method will be **close textual analysis and philosophical comparison**:
  1.  **Exegesis of Keynes:** A detailed reading of "Economic Possibilities for our Grandchildren," focusing specifically on his description of the "good life," the goods he elevates (art, friendship), those he implicitly demotes (traditional work, accumulation, perhaps certain sciences/religions), and crucially, the *absence* of justification for his chosen goods.
  2.  **Exegesis of Moore:** A focused analysis of relevant sections of *Principia Ethica* (especially Chapter VI: "The Ideal") concerning Moore's arguments for pluralism, his identification and defense of aesthetic experience and personal affection as the sole intrinsic goods, and his critique of "naturalistic" or utilitarian foundations for ethics.
  3.  **Comparative Analysis:** Systematically juxtaposing Keynes’s goods (art, friendship) and their presentation against Moore’s catalogue and arguments. Key questions include:
      *   Does Keynes's list map precisely onto Moore's two fundamental goods?
      *   Does Keynes implicitly rely on Moore's *intuitionist* epistemology regarding value?
      *   Does Keynes reject goods Moore explicitly excludes (e.g., certain kinds of knowledge, pleasure alone, virtue alone)?
      *   Are Keynes's potential counter-goods (e.g., leisure itself, contemplation) merely means to Moore's intrinsic ends?
  4.  **Contextual Support:** Brief consideration of Keynes's documented engagement with Moore (e.g., in "My Early Beliefs," 1938) and Bloomsbury's collective adoption of Moorean ideals to strengthen the plausibility of influence.

  **Scope, Limitations, and "Failure":** This is a focused, one-semester project. Its scope is deliberately narrow: **it aims not to provide a definitive intellectual biography nor a comprehensive critique of Keynesian economics, but to demonstrate a plausible and significant *structural dependency* of Keynes’s specific vision of the good life on Moorean pluralism.**

  *   **Key Limitation:** Proving a direct, conscious "dependency" or "influence" beyond reasonable doubt is inherently difficult with historical figures and complex ideas. Keynes was an eclectic thinker exposed to many influences beyond Moore (e.g., Burke, Marshall, Freud). We cannot definitively prove Keynes *consciously* lifted Moore's goods without explicit citation in the essay.
  *   **Achievable Goal:** The project can robustly demonstrate a **striking congruence** between Keynes's chosen intrinsic goods and Moore's. It can show that Keynes *fails* to provide independent justification for these goods, making Moorean pluralism the most compelling available framework that *could* ground them. The argument will be for a strong, plausible influence shaping the *content* of Keynes's vision.
  *   **Defining "Failure":** Failure would occur if:
      1.  Close reading reveals Keynes *does* offer substantive, non-Moorean justifications for art/friendship as ultimate goods.
      2.  Keynes's vision demonstrably includes or prioritizes significant intrinsic goods *excluded* by Moore (e.g., scientific discovery for its own sake, religious experience, civic virtue).
      3.  The textual evidence shows Keynes explicitly grounding his goods in a different ethical framework (e.g., utilitarianism, Aristotelianism) incompatible with Moorean pluralism.
      4.  The comparison shows only superficial similarity, with fundamental differences in the *conception* of art or friendship undermining the structural parallel.
      5.  Insufficient time prevents the deep textual analysis required for a convincing argument.

  **Significance:** Successfully demonstrating this latent dependency would:
  1.  Reframe Keynes’s utopian vision as fundamentally grounded in a specific, contested ethical theory, moving beyond purely economic interpretations.
  2.  Highlight a crucial philosophical vulnerability: Keynes offers a radical prescription for society's ultimate ends without robustly defending the underlying values.
  3.  Enrich our understanding of the transmission of Moorean ethics into practical social and economic thought via the Bloomsbury conduit.
  4.  Provide a critical lens for evaluating contemporary discussions of post-work societies and the nature of the "good life" itself, revealing their potential unexamined philosophical inheritances.

  This project offers a novel philosophical interrogation of a seminal economic text, revealing the hidden ethical architecture underpinning one of the most alluring visions of human flourishing in the modern age.
