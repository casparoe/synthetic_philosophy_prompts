prompt: |-
  hey, i've been lurking these forums for like a decade and this is probably too in the weeds but whatever.

  i run program evaluation for a small ngo that pitches behavior-change campaigns to universities and city councils — meatless mondays, bike-to-work nudges, local voter drives, staff flight offsets. every couple weeks i get a proposal and i have to tell the board whether it's worth our institutional credibilty to back it, given that one person's burger or vote doesn't move the needle on climate or election outcomes. classic inefficacy objection stuff, except the board is full of rationalist-adjacent people and they want something more rigorous than vibes.

  i need a reusable decision procedue — flowchart in words — that my review team (no philosphy phd, maybe 20 minutes per proposal, i sign off) can actually run. ground it in whatever moral philosphy actually says about individual contributions to collective harms, but don't lecture me. the key is handling three failure modes of the inefficacy objection: expected-value/threshold effects, signaling and coordination spillovers, and the normative 'do it anyway' layer. for each step say what counts as a sufficient answer, where we hard-stop with "no — don't back this as harm-reduction," and where we have to kick it to the board because it's values not facts. also flag the substitution-elasticity check — like, if people skip beef but the supply chain just redirects it, that's different from actually reducing slaughter.

  run it on three proposals:
  1. a "meatless monday" pledge for campus dining (this one should come back with an answer i don't love — i lean vegan but the procedue should probably say causal impact is below noise floor, back only if we explicitly frame it as values-expression not harm-reduction)
  2. a carpool mandate for a 200-person office to cut commute emissions
  3. a voter-turnout drive for a municipal race with about 8,000 registered voters

  say exactly what the procedue can't do — e.g., it won't settle whether collective-harm obligations exist in the first place, or whether we're picking the right counterfactual baseline. no bibliographies, no reading lists, don't quote anyone verbatim unless you can fetch the source. keep it practical.
reasoning: |-
  Okay, the user runs program evaluation for a small NGO that pitches behavior-change campaigns. They need a reusable decision procedure to evaluate proposals, considering the inefficacy objection—where individual actions seem too small to make a difference. The board is rationalist-adjacent, so they want rigor, not just vibes. The user mentioned three failure modes: expected-value/threshold effects, signaling/spillovers, and the normative "do it anyway" aspect. Also, they want a substitution-elasticity check.

  First, I need to create a flowchart-like procedure that's practical. The team has no philosophy PhD and only 20 minutes per proposal. Steps should be clear with sufficient answers, hard stops, and points where it goes to the board. The three examples will test the procedure: Meatless Monday, carpool mandate, voter turnout.

  Breaking down the inefficacy issues. Expected value involves whether individual actions have a probabilistic impact, like if a campaign tips a threshold. Signaling is about influencing others or changing norms. Normative is whether to back it as values-expression even without measurable impact. Substitution elasticity checks for unintended consequences, like redirected demand.

  For the procedure, start with a quick win check. If the proposal has direct, measurable impact at scale, approve. If not, move to expected value. Need clear criteria: what counts as sufficient evidence? Maybe require quantifiable thresholds or data on tipping points. If not met, check for signaling/spillovers. Here, evidence of norm change or coordination. If absent, then substitution check. If substitution is high, it's a hard stop. If low, and normative reasons exist, kick to the board with a values-based decision.

  The user mentioned the Meatless Monday example should come back with a "no" for harm-reduction but maybe "yes" as values-expression. So the procedure needs to differentiate between harm-reduction and other framings. The carpool mandate might pass if the office size and reduced emissions are significant. Voter turnout could hinge on expected value if the race is close.

  Need to ensure each step has clear exit points. For example, if expected value isn't met and no signaling, but substitution is high, hard stop. Also, note where values decisions come in—only after all factual checks are done and substitution is low.

  Testing with the proposals. For Meatless Monday: substitution elasticity is high (surplus beef gets redirected), expected value low, signaling possible but not proven. So hard stop unless framed as values. For carpool: direct emissions reduction, substitution low (if carpooling reduces car use), so approve. Voter turnout: if the race margin is small, expected value might be high; if not, signaling could be a factor. If close, approve; else, maybe kick to board.

  Also, the user wants limitations stated upfront. The procedure won't address foundational ethics or counterfactual baselines. Focus on practical, actionable checks within the team's capacity. Avoid academic jargon, keep steps straightforward. Make sure each question has yes/no paths with clear outcomes.
answer: |-
  Here's a reusable decision procedure ("Impact Triage Protocol") grounded in collective action ethics, designed for speed and practicality. It addresses the three core failure modes of the inefficacy objection and includes substitution checks. **Limitations Upfront:** This won't settle whether obligations to reduce collective harms exist, define the precise moral baseline, or resolve deep value conflicts within the board. It assumes *some* obligation to reduce harm exists and focuses on whether *this specific action* is a credible candidate for doing so.

  ---

  **Impact Triage Protocol (20-Minute Version)**

  1.  **QUICK WIN CHECK: Direct & Significant Harm Reduction?**
      *   **Question:** Does the proposal *directly* cause a measurable reduction in the target harm (emissions, votes not cast, animals consumed) at a scale clearly above background noise *without relying solely on individual inefficacy arguments*? (e.g., Installing solar panels on the NGO's own building, directly funding a protected area).
      *   **Sufficient Answer:** YES (Clear, direct, measurable impact at scale). **→ APPROVE (Harm-Reduction)**.
      *   **Hard Stop:** NO → Proceed to Step 2.

  2.  **EXPECTED VALUE / THRESHOLD CHECK:**
      *   **Question A (Tipping Point):** Is there strong evidence the *collective outcome* targeted (e.g., election win, policy change, emissions cap) is highly sensitive near a plausible threshold, *and* does this campaign demonstrably push the cumulative effort close to or over that threshold?
      *   **Question B (Probabilistic Impact):** Can the *average individual participant's contribution* be shown to have a non-negligible *expected value* (EV > epsilon)? (Requires: Quantifiable harm per unit *and* plausible causal link showing participant action reduces that unit count *and* reasonable probability assessment).
      *   **Sufficient Answer:** Convincing YES to A *or* robust quantitative YES to B (e.g., "In this swing district, modeling shows each marginal vote has ~1/5000 chance of deciding the election; EV is significant"). **→ APPROVE (Harm-Reduction)**.
      *   **Hard Stop:** NO to both A & B (e.g., "EV of one person skipping meat is vanishingly small", "Campaign scales to <0.1% of needed change, no threshold nearby") → Proceed to Step 3.

  3.  **SIGNALING / COORDINATION / SPILLOVER CHECK:**
      *   **Question:** Is there strong empirical evidence or a highly credible causal pathway showing this specific action reliably leads to:
          *   *Significant Norm Change:* Shifting wider social/group norms *that demonstrably cause aggregate harm reduction later*?
          *   *Coordinated Action:* Triggering widespread adoption *beyond direct participants* (e.g., policy shifts, industry changes)?
          *   *Building Crucial Capacity/Momentum:* Creating resources or coalitions *essential* for future high-impact wins?
      *   **Sufficient Answer:** YES, with specific, credible mechanisms and evidence (e.g., "Pledges like this preceded city-wide meat reduction policies in X, Y cases", "This voter drive model demonstrably builds long-term capacity in under-represented groups"). **→ APPROVE (Harm-Reduction)**.
      *   **Hard Stop:** NO (Vague "raising awareness" claims, weak analogies, no clear pathway to scaled impact) → Proceed to Step 4.

  4.  **SUBSTITUTION / ELASTICITY CHECK:**
      *   **Question:** Is there a high risk the *net* harm reduction is nullified or significantly reduced due to:
          *   *Substitution:* Others consuming/utilizing the freed-up resource (e.g., uneaten beef gets sold cheaper elsewhere)?
          *   *Rebound Effects:* Savings (money, time) being spent on equally/more harmful activities?
          *   *Leakage:* Harm shifting geographically or to other sectors?
      *   **Sufficient Answer:** YES, high risk & significant scale (e.g., "Commodity beef market is highly fungible; reduced campus demand won't reduce slaughter"). **→ HARD STOP: "NO - Don't back as Harm-Reduction."** (See Step 5 for alternative framing).
      *   **Sufficient Answer:** NO, low risk/minimal effect (e.g., "Reduced car commutes in this specific corridor demonstrably lowers peak-hour congestion & emissions without rebound within scope"). **→ Proceed to Step 5.**
      *   **Kick to Board:** UNCERTAIN SUBSTITUTION (Requires deeper analysis beyond 20 mins). **→ FLAG "High Substitution Risk" & proceed to Step 5.**

  5.  **NORMATIVE / VALUES LAYER ("Do It Anyway" Check):**
      *   **Question:** Despite failing Steps 1-4 as *harm-reduction*, does the action *strongly align* with the NGO's core values as a symbolic act, expression of solidarity, or fulfillment of a perceived duty *unrelated to direct causal impact*? (e.g., Veganism as intrinsic wrong, civic duty to vote).
      *   **Kick to Board:** *Always*. **→ RECOMMENDATION:** "Not Viable as Harm-Reduction. Recommend backing *only* if explicitly framed as **Values Expression**. Board must decide if this alignment justifies institutional backing vs. potential credibility cost." Provide concise reasoning from Steps 2-4.

  ---

  **Protocol Output on Proposals:**

  1.  **Meatless Monday Pledge (Campus Dining):**
      *   Step 1: NO (Not direct/significant reduction).
      *   Step 2A: NO (No tipping point for global meat consumption). Step 2B: NO (EV of one skipped meal is negligible).
      *   Step 3: MAYBE (Norm change potential exists, but evidence for *this pledge* driving *significant* policy change is weak/indirect). **→ Hard Stop: NO** (Insufficient evidence for harm-reduction via signaling).
      *   Step 4: YES (High substitution elasticity in commodity meat markets; reduced demand likely offset elsewhere). **→ HARD STOP: "NO - Don't back as Harm-Reduction."**
      *   Step 5: **→ RECOMMENDATION:** "Not viable as Harm-Reduction due to negligible EV & high substitution. Back *only* if explicitly framed as **Values Expression** (animal ethics). Board Decision Required."

  2.  **Carpool Mandate (200-Person Office):**
      *   Step 1: NO (Not direct *institutional* action, relies on individual changes).
      *   Step 2A: NO (No climate tipping point impacted). Step 2B: **YES** (Quantifiable: ~100 cars * avg commute emissions * compliance rate = non-trivial tons CO2e/year. Clear causal link: Fewer car trips = lower emissions. Probability high if mandate enforced. EV per *campaign* is significant).
      *   **→ APPROVE (Harm-Reduction).** (Stops at Step 2B. Substitution/Rebound within scope likely low - fewer cars *now* on *this* route. Norms are bonus, not primary justification).

  3.  **Voter-Turnout Drive (Municipal Race, 8,000 Voters):**
      *   Step 1: NO (Not direct vote casting).
      *   Step 2A: **YES** (IF race is very close - e.g., <2% margin). Check polling data. *If close*: Campaign adding ~X votes pushes probability of desired outcome significantly. **→ APPROVE (Harm-Reduction).** *If not close*: Proceed.
      *   Step 2B: *If race not close*: NO (EV of one vote in non-close race negligible).
      *   Step 3: **YES** (Strong evidence: Voter drives build long-term habits & civic engagement in targeted groups, can influence future close races. Credible pathway to future impact). **→ APPROVE (Harm-Reduction).**
      *   Step 4: NO (Votes are not substitutable/leakable in this context).
      *   *(Only reaches Step 5 if fails Steps 2A & 3 - unlikely for a well-targeted drive, but if so:)*
      *   Step 5: **→ RECOMMENDATION:** "If not viable via Steps 2A/3, back *only* as **Values Expression** (civic duty). Board Decision Required."

  **Key Takeaways for Your Team:**
  *   **Hard Stops:** Failing Step 2 *and* Step 3 *and* having High Substitution (Step 4 YES) = **No (Harm-Reduction)**.
  *   **Board Kick:** *Only* at Step 5 (Values Expression). Frame the *reason* it failed harm-reduction clearly (e.g., "Failed EV & Signaling checks, High Substitution").
  *   **Speed:** Focus Steps 2 & 3 on *strongest available evidence/argument*. Don't get bogged in philosophy; look for quantifiable EV or compelling real-world analogs for signaling.
  *   **Substitution is Crucial:** Often the killer for consumer-focused campaigns (like meat). Demand reduction only works if supply isn't perfectly elastic.
  *   **Framing Matters:** The protocol distinguishes "Harm-Reduction" from "Values Expression" backing. Be explicit in your recommendation.
