  ### **How to Explain to Sarah**  
  - **The point**: This setup proves that **classical systems can violate LHV bounds** if you allow nonlocal envelope generation (like quantum contextuality). It’s not "smuggling in quantum mechanics"—it’s showing why quantum-like correlations *require* nonlocal dependencies or superdeterminism.  
  - **What makes it Bell-like**: The win conditions are designed to create a *contextual win* (like GHZ entanglement), forcing LHV into a contradiction.  
  - **Weakness**: The courier enables communication, which quantum nonlocality avoids. But the 100% success vs. LHV failure is the core win.  

  Sarah might still argue the courier is "quantum-ish," but remind her: no spins, no particles—just envelopes, choices, and a bike.
