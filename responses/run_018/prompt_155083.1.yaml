    | L    | L   | L   | R               | R              | R               | **0 Greens (even)** ✅         |
    | L    | L   | R   | G               | G              | G               | *(Unconstrained case)*         |
    | L    | R   | L   | G               | G              | G               | *(Unconstrained case)*         |
    | R    | L   | L   | G               | G              | G               | *(Unconstrained case)*         |
    | L    | R   | R   | G               | G              | G               | **All Green** ✅               |
    | R    | L   | R   | G               | G              | G               | **All Green** ✅               |
    | R    | R   | L   | G               | G              | G               | **All Green** ✅               |
    | R    | R   | R   | G               | G              | G               | **3 Greens (odd)** ✅          |

    This guarantees 100% success over hundreds of rounds—**beating the 75% LHV cap** because no pre-agreed strategy (LHV) can achieve 100% (as proven below).

  ---

  ### **Why This Beats Local Hidden Variables (LHV)**
  In an LHV model, Maya, Leo, and Nina pre-agree on a deterministic plan where each person's envelope color depends *only on their own choice and a shared hidden variable* (e.g., a codebook). Crucially:  
  - The envelope color for Maya *cannot* depend on Leo's or Nina's choices (parameter independence).  
  - Choices are made freely (no correlation with the hidden variable).  

  **Contradiction under LHV**:  
  Assume a hidden variable λ determines all envelope colors. For each person, define:  
  - If Maya chooses L, her envelope = *f_M(L, λ)*  
  - If Maya chooses R, her envelope = *f_M(R, λ)*  
  (Similarly for Leo and Nina with functions *f_L*, *f_N*.)  

  Now consider the win conditions:  
  1. **All L case**: *f_M(L, λ)*, *f_L(L, λ)*, *f_N(L, λ)* must have even Greens.  
  2. **Exactly one L case** (e.g., Maya L, Leo R, Nina R): *f_M(L, λ)*, *f_L(R, λ)*, *f_N(R, λ)* must all be Green.  
  3. **All R case**: *f_M(R, λ)*, *f_L(R, λ)*, *f_N(R, λ)* must have odd Greens.  

  From (2):  
  - If Maya is the only L: *f_M(L, λ) = G*, *f_L(R, λ) = G*, *f_N(R, λ) = G*.  
  - If Leo is the only L: *f_M(R, λ) = G*, *f_L(L, λ) = G*, *f_N(R, λ) = G*.  
  - If Nina is the only L: *f_M(R, λ) = G*, *f_L(R, λ) = G*, *f_N(L, λ) = G*.  

  This forces:  
  - *f_M(L, λ) = G* (from Maya as only L).  
  - *f_M(R, λ) = G* (from Leo or Nina as only L).  
  - Similarly, *everyone's envelope is always G, regardless of choice*.  

  But then in the **all L case**, we get (G, G, G) → 3 Greens (odd), violating the **even Greens** rule. **LHV fails**—no pre-agreed strategy works.  

  ---

  ### **Three Interpretations**  
  #### 1. **Local Hidden Variables (Pre-agreed Plan)**  
  - **Interpretation**: Maya, Leo, and Nina pre-agree on fixed rules for envelope colors based on their choices (e.g., "If I choose L, always output Red").  
  - **Why it fails**: As above—100% success is impossible. The win conditions create incompatible demands, so the best LHV can achieve is 87.5% (e.g., by setting all envelopes Green except in all-L/all-R cases). Beating 75% is trivial; achieving 100% is the key.  

  #### 2. **Correlation Without Hidden Variables (Nonlocal Envelope Generation)**  
  - **Interpretation**: The envelope colors are generated *after* choices are made, with the courier using the choices to select the correct envelopes. This violates **parameter independence**—the envelope for one person depends on *others' choices*.  
  - **How it works**: The courier acts as a nonlocal "oracle." By learning all choices and using the master list, the envelopes correlate globally.  
  - **Key feature**: The **deterministic win conditions** force envelope colors to be context-dependent (e.g., Maya's envelope differs in `(L,L,L)` vs. `(L,R,R)`). This is classically possible *only* if the courier uses real-time choice data.  

  #### 3. **Superdeterminism (Shared Past Causes)**  
  - **Interpretation**: All events—choices, envelope colors, courier's path—are predetermined by shared past causes (e.g., the Big Bang). Choices aren't free; they correlate with envelope generation.  
  - **Key structural feature**: The **independent Left/Right choices** are illusory. Their "freedom" collapses because choices and envelopes are fixed by prior causes (e.g., cosmic conditions affecting Maya's mood and the courier's list).  
  - **What if the courier is swapped for a random drone?**  
    - If the drone picks routes randomly *on the fly*, **superdeterminism holds only if randomness is illusory**. The drone's path must be predetermined (e.g., by the same past causes) to ensure choices and envelopes align.  
    - If the drone has *true* randomness (e.g., quantum noise), **superdeterminism collapses** because the route isn't fixed by the past. Envelope delivery could mismatch choices (e.g., drone visits Leo first, but Maya's choice affects Leo's envelope). True randomness breaks the causal chain, making 100% success impossible without nonlocal adjustments.  

  ---

  ### **Hardline Local Realist Attack**  
  A local realist would argue the setup **cheats via information leakage**:  
  - **The flaw**: The courier is a **classical communication channel**. When participants tell their choices to the courier, that information is used to set envelopes for others. For example:  
    - At Maya’s stop, she reveals "L." The courier now knows this and can adjust Leo/Nina’s envelopes *before visiting them*.  
    - This lets Maya’s choice "signal" to Leo/Nina’s envelopes faster than light (if buildings are far apart), violating **no-communication theorems** in quantum mechanics.  
  - **Why it’s not analogous to quantum nonlocality**: In Bell tests, measurement outcomes *cannot* be used to send signals (no information leakage). Here, the courier’s route enables signaling—Maya could encode a message in her choice, altering Leo’s envelope predictably.  
  - **Their verdict**: This is just a **hidden communication protocol**, not true nonlocality. Quantum correlations don’t allow messaging; this does.  

