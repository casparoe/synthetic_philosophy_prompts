  From a rationalist framing, please explain the conceptual issue at the heart of using conceivability as a guide to metaphysical possibility in domains—such as consciousness—where our intuitive representations systematically abstract away from the underlying causal or functional architecture. Call this the transparency gap: the risk that what feels conceivable tracks format-compatibility within our representational scheme rather than genuine structural consistency in the world. Focus specifically on how this gap complicates the zombie argument. If one can conceive of a physically identical world lacking phenomenal experience, is one tracking a real metaphysical possibility, or merely showing that one's intuitive model permits phenomenal absence to be represented independently of functional absence? Distinguish carefully between phenomenal absence (no subjective experience) and functional absence (no corresponding functional role), and discuss whether imposing a stricter structural-transparency criterion—where a scenario counts as genuinely conceivable only if it can be derived without hidden contradiction in an explicit formal model—rescues conceivability as a modal guide or merely relocates the problem to whether we possess the correct formal architecture. After your explanation, provide a brief structured summary as a JSON object with exactly these fields: "core_issue" (string, one sentence), "transparency_gap_definition" (string, one sentence), "zombie_argument_complication" (string, one sentence), "phenomenal_vs_functional_distinction" (string, one sentence), "structural_transparency_assessment" (string, one sentence), and "bottom_line" (string, exactly one of: "conceivability_reliable", "conceivability_unreliable", "conceivability_conditionally_reliable").
