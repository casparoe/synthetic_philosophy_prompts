  Now, for defeaters. Fatal ones would be evidence of genuine discontinuity that can't be linked to thermal inertia. For example, if rapid institutional changes occur in regions with similar thermal properties but different outcomes, or if changes happen faster than the thermal cycles can account for. Also, if thermal rhythms don't correlate with institutional persistence where they should, like in large continental interiors. Formal problems like misalignment of timescales or lack of transfer mechanisms between thermal and social systems would be critical.

