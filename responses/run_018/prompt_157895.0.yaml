  Conceded points by defenders might involve spatial discontinuities like stable institutions in geologically active areas, or non-continental regions maintaining stability. They might also acknowledge that the theory is better at explaining persistence than reform, and that proximate causes still matter even if nested within deeper rhythms.

  On unfalsifiability, there's a risk. If every counterexample is explained as a hidden adjustment, the theory becomes insulated. Defenders might argue that it's a framework, not predictive, but critics would say it lacks empirical content. To avoid this, specific mechanisms linking thermal and social systems need to be proposed.

  Conceptual tensions arise with agency and contingency. If human actions are temporally coupled, it reduces intentionality to epiphenomena. Contingent events being predetermined by thermal cycles conflicts with historical accounts emphasizing individual decisions. Defenders might use supervenience to allow some autonomy, but it's a tightrope walk.

