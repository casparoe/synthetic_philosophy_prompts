  write the joint statement of an adversarial collaboration between a committed asymmetry-defender and a committed symmetry-skeptic. they should actually be able to sign it together. include: (1) a numbered section of agreed claims — about what the asymmetry is, what the non-identity problem establishes, and whether merely possible people have any moral standing at all; (2) a disagreements table where each side's position is phrased in wording they themselves would accept, not some watered-down compromise; (3) the cruxes — i think one is whether "impersonal value" can do real explanatory work, and another is how replacement reproduction works (like, you have child A on planet X instead of child B on planet X, same resources, different genome) — and for each crux a concrete case or argument both agree is relevant, with each side's prediction written down in advance. format it agreed-claims-then-table. don't ask for bibliographies or citations, and don't lean on obscure theorists i wouldn't know; but do inject something niche, like whether climate-related reproductive choices (where future conditions are partly our fault) change the intution, or use a twin-planet replacement scenario to stress-test the symmetry. make it 2-3 paragraphs of setup plus clear instructions, casual tone is fine, typo or two is okay.
