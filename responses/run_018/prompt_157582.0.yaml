  I've been going back and forth on this ever since I started volunteering at this wildlife rehab place where they treat everything from injured hawks to beetles, and then I came home and realized my smart thermostat adjusts itself based on occupancy patterns. Like, is there literally any moral gap between the beetle and the thermostat, or is it just a sliding scale? I want you to draft the joint statement of an adversarial collaboration between a gradualist — who thinks moral status tracks sentience in continuous degrees, so insects get a small slice and a thermostat gets essentially zero but technically nonzero if there's any information integration — and a thresholdist, who thinks phenomenal consciousness sets a hard boundary and anything without it (including that thermostat and probably most insects) gets exactly zero direct moral weight, though we might still protect them for other reasons.

  Please write this like both sides could actually sign it. Start with a numbered section of agreed claims: stuff about what we actually know from neuroscience, what the thermostat case demonstrates, and what both sides think needs explaining. Then do a disagreements table with the precise wording each camp accepts for its own position. The cruxes should include whether integrated information comes in degrees or is just present/absent, whether evolutionary continuity forces moral continuity, and whether a non-conscious system can hold derivative interests. For each crux, lay out the case or argument both agree is relevant, then record each side's prediction in advance — like, if we discovered insects have unified global workspace dynamics, or if we built a thermostat with genuine predictive modeling but no affect. Also say explicitly if part of the fight is just verbal. Write the whole thing in American English, and don't worry about perfect grammar — I'm writing this on my phone between shifts so theres probably a typo in here somewhere.
