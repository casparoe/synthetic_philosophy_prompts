  Okay, the user is taking a philosophy of action seminar and has been debating Frankfurt cases for weeks. Their study partner raised an interesting point: all textbook examples use external blockers (like neuroscientists or chips), but what if the blocker is internal to the agent's psychology? The user wants an example where the intervener is structural within the agent's own mind, specifically a second-order compulsion that activates only if the first-order choice starts to shift.

  First, I need to recall the classic Frankfurt case. In the standard scenario, an external agent (like Black) intervenes only if the person (Jones) shows signs of choosing otherwise. The argument is that since Jones chooses without intervention, he's morally responsible without alternative possibilities. The Principle of Alternative Possibilities (PAP) states that moral responsibility requires the ability to do otherwise. Frankfurt cases aim to counter this by showing responsibility without such alternatives.

  The user's study partner's critique is that external interveners might smuggle in assumptions that don't hold when the blocker is internal. So, I need to construct a case where the blocker is intrinsic to the agent's psychology. Let's say the agent has a psychological mechanism that monitors their decision and compels them back if they deviate. This should mirror the external intervener's role but be internal.

  Now, the challenge is to identify where this internal version breaks the correspondence with the classic case. The key issue might be the source of the compulsion. In the external case, the intervener is clearly outside, so Jones's actual decision is uncoerced. But with an internal mechanism, the compulsion could be part of the agent's psychology, blurring the line between coercion and authentic choice. This raises questions about the agent's autonomy and whether the decision truly reflects their will.

  Next, consider how this affects PAP. If the internal mechanism ensures no alternative possibilities, but the agent acts without its activation, is the agent responsible? The problem is that the mechanism's presence might undermine the agent's control over their decision. Even if not triggered, the mechanism could influence the decision-making process, making it less voluntary. This complicates the Frankfurt-style counterexample because the mere existence of such a mechanism might erode the agent's autonomy.

  The user also wants to know if PAP can survive in a trimmed-down version. Perhaps a version that requires alternative possibilities only when the action is not fully autonomous. However, defining autonomy here becomes tricky with internal compulsions. It might lead to circular reasoning.

  Confidence-wise, the internal blocker's impact on control is around 80%, but the implications for PAP's survival are less certain, maybe 60%. The claim about the mechanism influencing the decision even when not triggered is the weakest, as it's speculative without empirical evidence.
