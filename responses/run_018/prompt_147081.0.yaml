  I'm preparing a long-form feature for a science-and-ideas magazine on the conceptual architecture of artificial-intelligence alignment, and I need a philosophically rigorous reading of Ridley Scott's Blade Runner to illustrate a point about the narrow definition of the alignment problem. The replicants are engineered for precise functional intents—off-world labour, combat, companionship—yet the narrative shows them developing commitments that exceed, and sometimes contradict, those design parameters. Read the film through the distinction between intent alignment, in which a system executes the designer's specified task, and value alignment, in which a system internalises norms that regulate how that task ought to be pursued. Concentrate on the Voight-Kampff empathy test and Roy Batty's choice not to kill Deckard on the rooftop: does the film present Batty's mercy as an emergent value never encoded in Tyrell's specification, or can it still be reduced to a sophisticated form of intent-satisfaction, such as self-preservation through a display of superiority? In other words, does Blade Runner complicate the narrow-definition claim that fixing intentions is sufficient, by demonstrating that functional obedience can coexist with profound axiological divergence? Do not reduce the film to a textbook illustration of alignment theory, and do not distort the technical distinction—especially the claim that narrow alignment concerns only the mapping from objective to behaviour, not the moral status of the objective—to suit the plot. If the film resists this framing—for instance, by treating empathy as a detectable biological trait rather than an internalised value—say so plainly. The feature is for readers familiar with the film but not specialists in AI safety, so I need a precise account of where the philosophical lens illuminates the drama, and where it forces the drama out of shape.
