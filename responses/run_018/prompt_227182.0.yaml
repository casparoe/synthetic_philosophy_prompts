prompt: |-
  I sit on the ethics advisory panel for a public-private consortium that's about to fund the first industrial operation on the Moon: a plant in a permanently shadowed crater near the south pole that would mine water ice and crack it into rocket fuel. A big chunk of the planetary science community wants us to block it. Their case: these crater floors have been cold-trapping volatiles for billions of years, basicly a frozen archive of comet impacts and solar wind history you can't get anywhere else in the solar system, and the lander's exhaust plumes alone will scatter contamination over neighbouring craters before anyone digs a single scoop. Once disturbed it's gone, no remediation, no do-overs.

  The company's response is honestly not stupid. The Moon has no life, no ecosystems, nobody's drinking water. Preserving grey dust because a small professional group finds it scientifically interesting is, they say, an aesthetic preference dressed up as a moral duty, and a preference the rest of humanity gets billed for. They also point out that if we say no, a less scrupulous operator with no ethics panel at all will do it anyway within the decade, so we'd achieve nothing except feeling good about ourselves.

  Our charter says the panel must weigh "the interests of humanity as a whole, including future generations," a phrase nobody ever defined. One panel member says future generations have an interest in the archive -- in knowing the early history of their own solar system -- and we're about to shred it to save a fuel bill. Another says future generations have an interest in cheap, routine access to space, and a permanent fueling station is exactly how they get that, so blocking it would be the real betrayal of them.

  Draft the panel's decision memo: approve, reject, or approve with conditions. I need an actual bottom line I can table at next month's meeting, with the reasoning laid out, and it has to engage seriously with the strongest argument on whichever side loses -- not just restate the winner. If you recommend conditions, make them things the company could actually comply with and we could actually check, not "minimize impact" boilerplate. And say something about who even has standing to make this call, given that no one owns the Moon and our panel certainly doesn't represent humanity.
reasoning: |-
  Okay, let me approach this lunar ethics dilemma systematically. The user is an ethics panel member facing a high-stakes decision about lunar mining that pits scientific preservation against space industrialization. 

  First, I need to identify the core tension: irreplaceable scientific data versus enabling affordable space access. The planetary scientists' argument about billion-year-old volatile archives is compelling - once disturbed by rocket exhaust, that data is gone forever. But the company's pragmatic points also resonate: no ecosystems exist to protect, and blocking this might just delay the inevitable while sacrificing economic benefits. 

  The "humanity as a whole" mandate requires careful parsing. Future generations might value both scientific knowledge and space infrastructure. I'm considering whether conditional approval could satisfy both sides. Key conditions would need to be concrete: strict contamination protocols verified by third-party sensors, phased excavation allowing initial study, and mandatory data sharing. 

  On the standing question, it's tricky - nobody represents humanity. But as the first formal review body, the panel has de facto responsibility to set precedent. The decision memo should acknowledge this while emphasizing international consultation going forward. 

  The strongest counterarguments deserve engagement. For scientists: we'll require preservation of adjacent craters and immediate data collection before major disturbance. For industry: we accept that full preservation isn't feasible but demand operational constraints that add costs. 

  Ultimately I lean toward conditional approval because: 1) the "someone else will do it" argument holds weight, 2) fuel depots enable broader space activities that may benefit humanity, and 3) with safeguards, some science can be salvaged. But the memo must convey profound regret about the inevitable loss of pristine material.
answer: |-
  **MEMORANDUM**  
  To: Ethics Advisory Panel, Lunar Operations Consortium  
  From: [Your Name/Chair Designation]  
  Date: [Current Date]  
  Subject: Decision on Lunar Cryogenic Mining Proposal (South Pole Crater)  

  **DECISION:**  
  **APPROVE WITH STRINGENT CONDITIONS**  

  ### Reasoning Summary  
  We authorize the operation under conditions designed to:  
  1. **Preserve maximum scientific value** from the volatile archive before irreversible disturbance,  
  2. **Minimize cross-contamination** via enforceable engineering controls, and  
  3. **Establish precedent** for extraterrestrial industrial ethics.  
  Rejection would likely accelerate unregulated development. Unconditional approval would irreparably destroy unique knowledge. Conditions must be binding, measurable, and auditable.  

  ---

  ### Engagement with Core Arguments  
  **1. Scientific Community’s Strongest Case:**  
  The permanently shadowed regions (PSRs) are unparalleled archives of solar system history. Volatile layers contain chronologically resolved data on cometary delivery, solar activity, and early lunar conditions. Exhaust plumes *will* redistribute particulates and volatiles across neighboring craters, corrupting stratigraphic records before direct study. **We accept this argument’s core validity:** uncontrolled operations would obliterate irreplaceable science.  

  **2. Proponent’s Strongest Case:**  
  Blocking this project would not preserve the site. Market and geopolitical pressures ensure *some* entity will exploit these volatiles within 5–10 years, likely with fewer safeguards. Affordable propellant is foundational for sustained space exploration, benefiting humanity through economic growth, planetary defense, and expanded scientific reach. **We accept this argument’s pragmatic force:** obstructionism without enforceable alternatives is futile.  

  ---

  ### Conditions for Approval  
  *(Enforceable via real-time monitoring, third-party audits, and contractual penalties)*  

  1. **Pre-Excavation Science Phase:**  
     - **Requirement:** Full spectral/radar mapping and minimally intrusive volatile sampling (e.g., microcore drilling) of the target crater floor *before* landing any mining equipment.  
     - **Verification:** Raw data publicly archived within 6 months; peer-reviewed publication within 18 months.  
     - **Rationale:** Captures baseline data before plume contamination.  

  2. **Plume Mitigation Protocol:**  
     - **Requirement:** Use electric/hybrid thrusters for all landings/takeoffs within 50 km of PSRs. Install physical baffles/berms to deflect exhaust. Real-time particulate sensors must demonstrate >95% containment of ejecta within the operational crater.  
     - **Verification:** Sensor data streamed to independent review body (e.g., COSPAR). Non-compliance triggers operations suspension.  
     - **Rationale:** Addresses cross-crater contamination.  

  3. **Adjacent Crater Preservation:**  
     - **Requirement:** Designate three highest-priority neighboring PSRs as "no-entry" scientific reserves. Operations must not deposit measurable contaminants (>1 ppm foreign volatiles) in these zones.  
     - **Verification:** Deploy autonomous monitoring stations in reserves, reporting quarterly.  

  4. **Data Equity & Legacy:**  
     - **Requirement:** 2% of gross project revenue allocated to an international lunar science fund. All operational data (excluding proprietary process engineering) made publicly accessible after 1 year.  
     - **Verification:** Fund managed by UNOOSA/IAA; data repository audited annually.  

  ---

  ### On Representing "Humanity’s Interests"  
  No single entity "owns" the Moon or speaks for humanity. However:  
  - **This panel’s legitimacy** derives from its public-private charter, multidisciplinary composition, and transparent process.  
  - **Our mandate** necessitates balancing *tangible* benefits (economic access to space) against *intangible* ones (knowledge preservation).  
  - **Future generations** inherit both the consequences of degraded scientific opportunities *and* constrained spacefaring capacity. Conditions above serve both: preserving accessible knowledge while enabling infrastructure.  
  - **Precedent-setting function:** Approving *without* robust safeguards would normalize exploitation. Rejecting *despite* mitigations would signal that extraterrestrial ethics veto progress. Conditions chart a middle path.  

  ---

  ### Why Not Reject or Approve Unconditionally?  
  - **Rejection** ignores the near-certainty of uncontrolled development, sacrificing leverage to impose standards. It privileges one interpretation of "future interests" (pure science) over another (industrial capacity).  
  - **Unconditional approval** dismisses valid scientific alarm regarding contamination mechanics. "No ecosystems" is reductive; the PSRs’ *informational* uniqueness warrants protection.  
  - **Conditional approval** compels the operator to internalize costs of preservation/compliance while advancing human spacefaring goals. It acknowledges that industrial activity is inevitable but need not be predatory.  

  ---

  **BOTTOM LINE:**  
  Move to approve the project **contingent on binding implementation of Conditions 1–4**, with final wording negotiated within 30 days. Failure to agree on enforceable terms reverts to rejection. This balances our duty to preserve humanity’s scientific heritage with the pragmatic need to govern development rather than cede it to bad actors.  

  *[End Memo]*  

  ---

  **Key Strengths of This Approach:**  
  - **Scientifically credible:** Addresses plume/scattering risks with engineering controls, not rhetoric.  
  - **Politically viable:** Allows progress while demanding concessions.  
  - **Enforceable:** Conditions are technical and monitorable (e.g., sensor data, fund audits).  
  - **Precedential:** Sets expectations for future operators: industry must fund science and limit externalities.  
  - **Honest about trade-offs:** Admits that some archive loss is inevitable but mandates salvage archaeology.  

  This memo forces the panel to confront its limited power while using its leverage to extract material protections. The "losing" arguments (total preservation vs. unfettered industry) are honored by constraints that address their deepest concerns.
