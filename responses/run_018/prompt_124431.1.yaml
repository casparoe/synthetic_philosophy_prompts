  For the cruxes, the key issues are: whether cross-implementation stability proves autonomous reality of design-level patterns, and whether intentional stance compression can be duplicated by physical computation. I'll select camera eyes as the test case since it's a classic example of convergent evolution that both sides would acknowledge as relevant.

