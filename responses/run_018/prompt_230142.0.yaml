prompt: |-
  I am a PhD student in environmental policy, and I am writing a chapter on the precautionary principle. Before I assess any particular formulation, I want to settle the standard a formulation has to meet. The difficulty is that the principle gets defended and attacked at several different levels: some treat it as a substantive decision rule that forbids acting whenever a severe worst-case outcome has not been ruled out; others treat it as a procedural rule about who bears the burden of proof; still others treat it as an expression of epistemic humility with no direct policy content. The result is that the same principle is called both vacuous and paralysing, and I suspect those two criticisms are not directed at the same object. What I need, then, is a requirements list: the desiderata any adequate theory of precaution would have to satisfy, independently of this or that treaty wording.

  Assume the purpose is ex ante public decision-making about novel technological and environmental interventions under deep uncertainty, where probabilities may be unavailable rather than merely unknown to the decision-maker. For each requirement, give the motivating case or consideration and mark it as non-negotiable or as a preference of a particular camp. I would especially like your treatment of three points: (a) how the theory should distinguish uncertainty from risk without permitting any unspecified possibility of catastrophe to act as a decisive veto; (b) what I have been calling the precautionary regress — since precautionary measures themselves can carry serious or irreversible downside risks, the principle appears to apply to its own implementation, so the list needs a principled stopping condition rather than an arbitrary line; and (c) whether shifting the burden of proof onto the proponents of a technology is a core requirement or a negotiable institutional choice. To finish, briefly indicate how the best-known formulations, such as the Rio and Wingspread ones, fare against the list, and tell me which single requirement does the most to exclude popular formulations. Please keep the weight on the criteria and their motivating cases rather than on the scorecard, and write the answer in British English.
reasoning: |-
  Okay, let me approach this systematically. The user is an environmental policy PhD student developing criteria to evaluate precautionary principle formulations, with three specific concerns about uncertainty vs risk distinction, precautionary regress, and burden of proof.

  Hmm, the core challenge here is reconciling the principle's dual nature - it needs substantive teeth without becoming paralyzing or vacuous. From the query, I sense frustration with how existing formulations get contradictory critiques. 

  First, I should establish non-negotiable requirements. The anti-paralysis criterion seems fundamental - no formulation should allow theoretical catastrophes to veto action. The 1990s mobile phone radiation scare comes to mind, where hypothetical risks nearly derailed deployment despite no mechanistic plausibility. 

  For the regress problem, the case of biofuels is telling. Early EU mandates ignored indirect land-use change risks, creating new environmental harms. Any formulation must require proportionality assessment of precautionary measures themselves. 

  On burden of proof... interesting how the user frames this as potentially negotiable. The thalidomide tragedy shows why shifting burden matters, but the GMO debate proves it can become weaponized. Perhaps this belongs in the "procedural robustness" category rather than being core.

  The Wingspread formulation fails spectacularly on anti-paralysis - its "no proof of harm" standard could block any novel technology. Rio fares better with its "cost-effective measures" clause but remains vague on regress. 

  What really sinks most formulations is the proportionality requirement. They either ignore it (like Wingspread) or gesture vaguely (Rio). Yet without it, precaution becomes either reckless or inert. That's the key filter.

  The epistemic humility point deserves emphasis. In climate engineering debates, dismissing all interventions because models are imperfect reflects the paralysis we must avoid. The principle should guide, not replace, judgment.

  For the conclusion, I'll stress that burden of proof shifting is context-dependent - essential for pharmaceuticals, counterproductive for clean tech. The regress problem gets solved by tiered proportionality assessment. And uncertainty? Must trigger investigation, not prohibition.
answer: |-
  Below is a requirements list for evaluating formulations of the precautionary principle (PP), tailored to your research context. Criteria are derived from conceptual tensions, policy failures, and philosophical critiques, with each requirement grounded in a motivating case. The three focal points (a, b, c) are integrated throughout.

  ---

  ### **Core Requirements for an Adequate Theory of Precaution**
  *(Non-negotiables = Essential for coherence; Preferences = Camp-specific)*

  1.  **Anti-Paralysis (Non-negotiable)**  
      *   **Requirement**: Must not treat *any* hypothetical worst-case scenario as an automatic veto on action, regardless of plausibility or evidence.  
      *   **Motivating Case**: Banning mobile phones in the 1990s due to *theoretical* (but unsubstantiated) cancer risks would have prevented societal benefits without empirical justification. Demonstrates paralysis via "anything imaginable" veto.  
      *   **Addresses (a)**: Distinguishes uncertainty from risk by demanding *reasoned plausibility assessment* of threats before applying precaution, blocking "unspecified possibilities" as vetoes.

  2.  **Anti-Vacuity (Non-negotiable)**  
      *   **Requirement**: Must provide actionable guidance beyond generic appeals to "caution" or "sustainability."  
      *   **Motivating Case**: Vague PP invocations in early ocean acidification debates led to symbolic gestures (e.g., monitoring) without substantive emission controls. Highlights vacuity where PP fails to mandate *concrete responses*.  

  3.  **Proportionality (Non-negotiable)**  
      *   **Requirement**: Precautionary measures must be commensurate with (i) the severity/potential irreversibility of the threat, (ii) the strength/quality of evidence, and (iii) societal costs.  
      *   **Motivating Case**: Opposing all synthetic pesticides due to ecological risks ignores that organic alternatives may lower yields, increasing land conversion and biodiversity loss. Addresses *(b) precautionary regress* by mandating comparative risk assessment of *inaction* vs. *precautionary action*.  

  4.  **Epistemic Responsibility (Non-negotiable)**  
      *   **Requirement**: Must require active seeking of better evidence (e.g., research, monitoring) when uncertainty is high, and specify review triggers.  
      *   **Motivating Case**: The EU’s 1999 GMO moratorium included funding for risk research, enabling evidence-based updates (e.g., later approvals for specific traits). Prevents "set-and-forget" bans.  

  5.  **Burden-Shifting Framework (Preference: Pro-PP camp)**  
      *   **Requirement**: Assigns proponents of an intervention the responsibility to demonstrate safety/acceptability *relative to plausible concerns*, not absolute certainty.  
      *   **Negotiable Alternative**: Burden could lie with regulators or shared parties, but proponents typically hold superior knowledge/resources (e.g., chemical manufacturers’ data on novel compounds).  
      *   **Motivating Case**: Thalidomide approval without adequate teratogenicity testing shifted post-crisis norms to pre-market proof of safety for pharmaceuticals. Addresses *(c)* by showing burden-shifting as *pragmatic*, not logically core.  

  6.  **Reversibility Safeguards (Non-negotiable)**  
      *   **Requirement**: Prioritises avoiding irreversible harms (e.g., species extinction, climate tipping points) over reversible costs, even with uncertain probabilities.  
      *   **Motivating Case**: Delaying action on ozone-depleting CFCs until "full proof" of stratospheric impact risked irreversible UV damage escalation.  

  7.  **Procedural Robustness (Preference: Deliberative-democratic camp)**  
      *   **Requirement**: Embeds PP in inclusive, transparent processes integrating scientific, ethical, and stakeholder perspectives.  
      *   **Motivating Case**: Controversy over fracking highlights how top-down PP policies (e.g., bans) without community engagement fuel resistance and inequity.  

  8.  **Dynamic Flexibility (Non-negotiable)**  
      *   **Requirement**: Measures must adapt to new evidence, avoiding rigid permanence.  
      *   **Motivating Case**: Early over-precaution on CRISPR crops ignored evolving evidence of precision, delaying climate-resilient varieties.  

  ---

  ### **Evaluation of Key Formulations**
  - **Rio Declaration (1992, Principle 15)**:  
    *"Where there are threats of serious or irreversible damage, lack of full scientific certainty shall not be used as a reason for postponing cost-effective measures..."*  
    **✓** Anti-vacuity (requires "measures"), Proportionality ("cost-effective"), Reversibility focus.  
    **✗** Fails *anti-paralysis* (no threshold for "threats"); Silent on *burden-shifting*, *epistemic responsibility*, *regress*.  

  - **Wingspread Statement (1998)**:  
    *"When an activity raises threats of harm to human health or the environment, precautionary measures should be taken even if some cause-and-effect relationships are not fully established scientifically."*  
    **✓** Clear burden-shifting (implied).  
    **✗** Fails *anti-paralysis* (any "threat" triggers action), *proportionality* (no "cost-effective" limit), *regress* (ignores measure risks).  

  **Most Exclusionary Requirement**: **Proportionality** eliminates absolutist formulations (e.g., Wingspread) by demanding trade-off analysis, thus blocking paralysis and regress. Rio’s "cost-effective" nods to this but lacks operational guidance.

  ---

  ### **Resolution of Focal Points**  
  - **(a) Uncertainty vs. Risk**: Requires *plausibility screening* (e.g., evidence of mechanistic pathways) to filter speculative threats, combined with *proportionality* to avoid vetoes.  
  - **(b) Precautionary Regress**: Solved by **tiered proportionality**—evaluating primary action *and* precautionary measures against alternatives/inaction.  
  - **(c) Burden of Proof**: Shifting burden is a *pragmatic institutional preference* (e.g., for novel tech developers) but not logically necessary; core is *evidentiary responsiveness* (Requirement 4).  

  An adequate PP theory functions as a **procedural scaffold for deliberative precaution**: forcing justification under uncertainty, mandating evidence-building, and constraining measures via proportionality—without presupposing outcomes. This navigates vacuity/paralysis by making precaution *dynamic* and *comparative*.
