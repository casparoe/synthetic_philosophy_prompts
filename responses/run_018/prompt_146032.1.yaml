prompt: |-
  Belgium forces citizens to vote but lets long-term residents who aren't citizens vote locally after five years, and in some municipalities teenagers sit on advisory boards where each vote counts half. What theory of political membership does that combination presuppose? Does it treat citizenship like a bundle you can split into partial rights, or does it say being affected by local rules is enough for partial standing? And if the half-weight for teens is meant to track developing rational capacity, why doesn't teh same logic apply to elderly voters with decline? Reconstruct the implicit view, say whether it's consistent, and tell me what'd have to change if we replaced it with a pure affected-interests model.
reasoning: |-
  Okay, the user is asking about Belgium's voting system and what theory of political membership it implies. Let me break down the components they mentioned: compulsory voting for citizens, non-citizen residents voting locally after five years, and teenagers on advisory boards with half-votes. 

  First, I need to figure out the underlying theory. The compulsory voting part suggests citizenship is a bundle of rights and duties—citizens must vote, but they get full rights. Letting non-citizens vote locally after five years seems like splitting the bundle; they get partial rights because they're affected by local policies. The half-votes for teens are tricky. It looks like they're acknowledging emerging capacity but not full rationality. But why not apply the same to the elderly? That's inconsistent unless there's a different rationale.

  The user wants to know if this is a bundle-splitting approach or an affected-interests model. Bundle-splitting makes sense for non-citizen voting but not for teens. Teens' half-votes might be more about capacity development. The inconsistency is in not applying similar logic to cognitive decline in the elderly. Maybe Belgium prioritizes civic education for youth over concerns for the elderly. 

  Then, reconstructing the implicit view: citizenship is a core bundle with optional add-ons for residents. Teens get partial rights as a developmental stage. But the inconsistency with the elderly is a problem. If they switched to a pure affected-interests model, everyone affected would get voting rights regardless of age or citizenship. That could include minors and non-citizens immediately, but then how to handle varying capacities? They might need proxies for those unable to vote. 

  The user might be interested in the philosophical underpinnings of voting rights and how real policies align (or don't) with theories like affected interests. They might also be probing whether such systems are fair or logically consistent. Their deeper need could be understanding how to design inclusive yet rational voting systems, or critiquing existing models for biases like ageism. They didn't mention it, but potential biases against the elderly could be a concern. Also, how different theories handle capacity issues—whether cognitive development or decline—might be a key interest.
answer: |-
  Belgium's hybrid system reveals an **implicit theory of political membership blending "citizenship as a bundle" with developmental capacity principles**, but it contains notable tensions. Here's a reconstruction, critique, and comparison to an affected-interests model:

  ### Implicit Theory & Its Components
  1.  **Compulsory Voting for Citizens:** Assumes citizenship is a **status carrying non-negotiable duties (voting)** alongside rights. This reflects a **"thick" republican citizenship model**, emphasizing active participation as a core obligation of membership in the sovereign demos.

  2.  **Local Voting for Non-Citizen Residents:** Treats citizenship as a **"bundle of rights" that can be partially unbundled**. Residency (+5 years) creates a "stake" in local outcomes, justifying a *subset* of political rights (local suffrage). This leans toward **"stakeholder citizenship"** or **"denizenship"** for local affairs, recognizing that being *affected* by local rules warrants partial standing *without* granting full national citizenship.

  3.  **Half-Weight Votes for Advisory Teens:** Introduces a **developmental/capacity dimension**. It implies:
      *   Political capacity is *not binary* (full right/no right) but exists on a spectrum.
      *   Teens possess *some* rational capacity and are profoundly affected by long-term policies, warranting *some* voice.
      *   The "half-vote" is a pragmatic proxy for **partial rational capacity**, intended as a civic learning tool rather than full equality.

  ### Key Inconsistency: The Elderly Question
  *   **The Logic:** If the half-vote for teens is primarily about *emerging but incomplete rational capacity* (developmental stage), then *declining rational capacity* (e.g., due to dementia in the elderly) should arguably trigger a similar reduction in voting weight.
  *   **The Reality:** Belgium (like virtually all democracies) applies **no such reduction to elderly voters**. This reveals:
      *   **Age Bias:** The system implicitly treats *youthful under-capacity* as a legitimate reason for partial rights, but *age-related decline* as irrelevant to rights. This privileges chronological age (youth) over actual capacity assessment.
      *   **Different Underlying Rationale?** The teen provision might *actually* be more about **civic pedagogy** and **symbolic inclusion** than a strict capacity assessment. The system avoids the political minefield and practical impossibility of testing individual cognitive capacity for voting.
      *   **Inconsistent Application of Capacity Logic:** The capacity argument is applied selectively to *add* partial rights for one group (teens) but *not subtract* rights from another group (elderly with decline), even if the underlying rationale (rational capacity) seems similar.

  ### Is the System Consistent?
  *   **Internally:** **No, it lacks full consistency.** The tension between the capacity logic applied to teens and the lack of its application to the elderly is a major flaw. The system simultaneously holds:
      *   *Citizenship = Full Bundle (Duty + Full Rights)* for citizens.
      *   *Residency = Partial Bundle (Local Suffrage)* for non-citizens.
      *   *Age < 18 = Partial Capacity = Partial Voice (Half-Vote)* for teens.
      *   *Age > 18 & Citizenship = Full Voice* regardless of individual capacity decline.
  *   **Underlying Philosophy:** It's a **pragmatic pluralism**, not pure theory. It combines:
      *   **Republican Duty** (for citizens).
      *   **Affected Interests/Stakeholder Principle** (for local non-citizen voting).
      *   **Developmental Citizenship** (for teens).
      *   **Strong Presumption of Lifelong Full Capacity** (for adults).

  ### Shift to a Pure Affected-Interests Model: Required Changes
  A pure affected-interests model ("all affected should have a say proportional to the degree they are affected") would necessitate radical changes:

  1.  **Abolish Citizenship Requirement for All Voting:** National, regional, and local voting rights would be based solely on being affected by the decisions, primarily determined by **residency duration and intensity of impact**, not citizenship. Compulsory voting might still apply to *all* affected residents.
  2.  **Radical Expansion of the Franchise:**
      *   **Minors:** Children significantly affected by policies (education, environment, welfare) would gain voting rights. The "half-vote" for teens would be insufficient; younger children would need some form of representation (e.g., full votes via proxies? guardians? lowered voting age significantly?).
      *   **Non-Resident "Affected" Parties:** Could include cross-border workers, investors, or even future generations (requiring novel representation mechanisms).
  3.  **Abolish or Radically Alter Age-Based Distinctions:** If the *only* criterion is "affectedness," age itself becomes irrelevant. Restrictions based on presumed capacity (like the teen half-vote) would conflict with the model unless capacity was proven to directly correlate with the *degree* one is affected (which it generally doesn't).
  4.  **Capacity Assessment?:** The model *could* incorporate capacity concerns, but this would be messy:
      *   **For Minors:** Proxy voting by parents/guardians? Lowered voting age without restrictions? Capacity tests? (All conflict with pure affectedness).
      *   **For Cognitive Decline:** Mandatory capacity assessments for elderly/disabled voters? Proxy voting? (Again, conflicts with pure affectedness and introduces discrimination risks).
  5.  **Redefining the Polity:** The "demos" becomes fluid, defined by the scope of each decision ("functional constituencies"), not fixed national borders or citizenship. This creates immense practical complexity.

  **Conclusion:** Belgium's system presupposes a **hybrid, pragmatic theory** where citizenship is a core bundle for national sovereignty but can be partially unbundled at the local level based on residency (affected interests). It inconsistently adds a developmental capacity element for youth inclusion while ignoring similar capacity concerns for the elderly. It is **not fully philosophically coherent** but reflects practical political compromises. Adopting a pure affected-interests model would require dismantling citizenship-based voting, massively expanding the franchise to include minors and potentially non-residents, and grappling with the unresolved tension between affectedness and individual capacity in a far more fundamental way.
