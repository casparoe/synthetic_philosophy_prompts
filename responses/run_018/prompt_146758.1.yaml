  *   (A: **Propositional** - It reveals a *fact* about how the world *must* be) → Go to Q3  
  *   (B: **Practical** - It sharpens *reasoning skills* or model-building ability) → Go to Q4  
  *   (C: **Intersubjective** - It *aligns our shared intuitions* about what's possible/necessary) → **LEAF D: Calibratonist View** (Thought experiments work by calibrating our modal intuitions against simple empirical baselines. The payoff is shared understanding and alignment, not direct world-facts. e.g., Your injected view).

  ---

  **From Q2 (A: Propositional):**  
  🎯 **Q3: What's the main MECHANISM for gaining this world-knowledge?**  
  *   (A: **Mental Simulation** - We run a dynamic mental model of the scenario) → **LEAF A: Mental-Model Simulation** (e.g., Nersessian. Knowledge comes from manipulating internal representations, akin to real experiment but in the mind).  
  *   (B: **Logical Unpacking** - We uncover hidden contradictions in our assumptions/premises) → **LEAF B: Disguised Logical Argument** (e.g., Norton. It's just a deductive argument with implicit empirical premises, revealed through the narrative).  
  *   (C: **Direct Intuition** - We just "see" a necessary law or truth directly) → **LEAF C: Platonic Intuition** (e.g., Brown. The mind has direct access to necessary laws of nature or abstract entities).

  ---

  **From Q2 (B: Practical):**  
  🎯 **Q4: Is the practical skill gained primarily about *logic* or *simulation*?**  
  *   (Logic) → *Empty Slot!* (Why? View B (Norton) already claims it's *really* logic yielding propositional knowledge. Seeing it *only* as a practical logic skill, without claiming it finds world-facts, seems unstable or unexplored. Why bother if not for truth?)  
  *   (Simulation) → **LEAF A: Mental-Model Simulation** (e.g., Nersessian can *also* emphasise the skill-building, model-manipulating aspect as the key payoff).

  ---

  **The Tree Mapped:**

  1.  **Q1:** Galileo reveals nature? (Y/N)
      *   N → **E: Scepticism**
      *   Y → **Q2:** Knowledge Type? (Prop/Prac/Inter)
