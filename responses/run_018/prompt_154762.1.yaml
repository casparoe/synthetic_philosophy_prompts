prompt: |-
  Been chewing on advance directives after digging through old LW threads on personal identiy across time. There's this line people throw around: "past you is just another agent, so an advance directive is no more binding than a contract with a stranger." Separate the precise claims hiding in that one sentence—there's the Humean bundle version, the psychological-continuity cutoff version, and the weirder claim about normative authority not transferring across temporal parts even if diachronic identity holds. Say which ones are platitudes, which depend on a theory of diachronic authority that'd blow up contract law if taken seriously, and which reading bioethicists actually need when they reject living wills. Give me the full menu with verdicts, don't just pick the "personal identity is fuzzy" interpretation and run with it. Also, where does the "earlier self has privileged epistemic access to your true values" argument fit? Is that a separate claim or just smuggling in authority?
reasoning: |-
  Okay, the user is asking about advance directives and personal identity, referencing LessWrong threads. They want a breakdown of that quote comparing past you to a stranger. Let me start by unpacking the different interpretations hidden in that statement.

  First, the Humean bundle theory. That's the idea that the self is just a collection of experiences without a continuous identity. If that's true, then past you really is a different entity, like a stranger. But I need to check if this is a common view or more philosophical. Bioethicists probably don't base their decisions on this, so I'll note it as a niche metaphysical stance.

  Then there's psychological continuity with a cutoff. Here, if the current self's values change drastically, like in dementia, past directives might not apply. This seems more relevant to bioethics. Cases where the patient's current preferences conflict with their past directives are where this comes up. But contract law still recognizes past commitments, so this could cause issues if applied broadly.

  The normative authority point is tricky. Even if identity persists, does past you have the right to bind future you? That's a separate question. If we say no, then advance directives lose their binding power. But contract law assumes temporal parts can bind each other. Pointing out this contradiction will show the problems with taking this theory too far.

  Next, the bioethicists' perspective. They usually reject living wills when the current self has different preferences. The psychological discontinuity argument is key here, especially with dementia. But they aren't denying identity; they prioritize current well-being over past autonomy. Highlighting this distinction is important to address the user's query accurately.

  The epistemic privilege claim is another layer. The idea that past you knew your values better than current incapacitated you. This is separate from authority but often used to support it. Bioethicists might accept this in some cases, like when the current self can't express preferences. But it's not absolute; current experiences matter too.

  The user wants a full menu with verdicts, so I need to categorize each claim: platitude, niche theory, or problematic for law. Also, linking the epistemic argument correctly without conflating it with authority. Making sure to address all parts of their query without oversimplifying. They seem well-versed in the topic, so depth and precision are crucial. Need to ensure each section clearly separates the different interpretations and their implications.
answer: |-
  Here's the full dissection of that claim, separating its distinct philosophical layers and evaluating each against bioethical practice and legal reality:

  **Core Claim:** *"Past you is just another agent, so an advance directive is no more binding than a contract with a stranger."*

  **Decomposing the Claim:**

  1.  **The Humean Bundle / Reductionist Claim (Niche Metaphysics):**
      *   **Precise Claim:** Personal identity over time is an illusion. There is no persisting "self," only a causally connected series of person-stages ("temporal parts"). "Past you" (Stage T1) and "present you" (Stage T2) are distinct entities, no more identical than two different people sharing memories or DNA.
      *   **Verdict:** **Niche Philosophical Stance.** This is a radical metaphysical position (Parfitian reductionism, inspired by Hume). It is *not* a platitude; it contradicts everyday experience and legal foundations. If taken literally, it *would* blow up contract law, property rights, punishment, and promises – as future stages could disavow commitments made by past stages. Bioethicists *do not* rely on this view to reject living wills. This view treats *any* temporal gap as creating a "stranger," making advance directives inherently invalid.

  2.  **Psychological Continuity Cutoff Claim (Practical Bioethical Concern):**
      *   **Precise Claim:** While diachronic identity holds *in general*, sufficiently severe disruptions to psychological connectedness (e.g., profound dementia, severe brain injury, radical value changes) create a point where the *current* individual is no longer psychologically continuous enough with the *past author* of the directive to be meaningfully bound by it. The "stranger" analogy is hyperbolic, but highlights a *discontinuity*.
      *   **Verdict:** **The Core Argument Bioethicists Actually Use (in relevant cases).** This is *not* a rejection of diachronic identity *per se*, but a recognition that psychological connectedness matters for *binding authority*. Bioethicists rejecting a living will (e.g., in advanced dementia) argue the *current* individual:
          *   Lacks the cognitive capacity to understand or reaffirm the directive.
          *   Has radically different values, preferences, or experiences of well-being (e.g., simple pleasures vs. past autonomy focus).
          *   Isn't harmed (in their current experiential state) by actions the directive forbade (e.g., force-feeding), and may actively prefer them.
      *   **Impact:** This *does* challenge the *absolute* authority of advance directives but *within specific, contested boundaries*. It doesn't invalidate contracts generally because contracts deal with *capacitated* agents making commitments *to others*, and breaches have remedies. This is about the *self-binding* authority across radical psychological change.

  3.  **Normative Authority Transfer Claim (The Deepest Philosophical Challenge):**
      *   **Precise Claim:** *Even if diachronic identity holds perfectly*, and *even if psychological continuity is strong*, the normative authority of a past stage to bind a future stage is not automatic. Why should Stage T1 get to dictate to Stage T2? Stage T2 is the one experiencing the consequences *now*. The "stranger" analogy highlights the lack of inherent *moral* authority of past selves over present/future selves, regardless of identity.
      *   **Verdict:** **Profound Philosophical Challenge (often smuggled in).** This is distinct from metaphysics or psychology. It questions the very *legitimacy* of self-binding over time. *If taken seriously*, it fundamentally undermines not just advance directives, but saving for retirement, promising future performance, punishing past crimes, and any delayed gratification justified by future benefit to "yourself." Contract law implicitly assumes temporal parts *can* bind each other normatively. Bioethicists often *leverage intuitions related to this* (e.g., "respect the current experiential interests") without necessarily endorsing the full radical implication that past selves have *no* special authority. This claim exposes a potential conflict between autonomy-at-time-T1 and well-being-at-time-T2.

  **The "Epistemic Privilege" Argument:**

  *   **Precise Claim:** The *past* self (when capacitated) had superior epistemic access to what the *enduring* self's core values and preferences truly were/would be in future states of incapacity, compared to:
      *   Surrogate decision-makers *now*.
      *   The *incapacitated* self *now* who cannot reason or communicate effectively.
      *   *Sometimes even* compared to the *current capacitated* self imagining future incapacity (though this is weaker).
  *   **Relationship to Authority:**
      *   **Separate But Supporting:** It's primarily an *epistemic* claim about *knowledge* of values, not directly about normative authority.
      *   **Used to *Justify* Authority:** Proponents of strong advance directives argue that because the past self had this privileged knowledge, their directives *should* carry normative authority over the current incapacitated self and external surrogates. The directive is seen as the most reliable map to the enduring self's "true" wishes.
      *   **Challenge:** Opponents counter that:
          1.  Values *can* change authentically, even before incapacity.
          2.  Imagining future states (especially profound cognitive/experiential shifts like dementia) is inherently unreliable ("There are things I didn't know I didn't know").
          3.  The *current* self's experiential interests (even if cognitively diminished) have intrinsic moral weight that the past self couldn't fully anticipate. Privileging epistemic access can unjustly ignore current suffering or simple joys.
  *   **Verdict:** This is **crucial in the bioethical debate** and often the *main battleground*. Bioethicists skeptical of living wills frequently argue the epistemic privilege is *overstated*, especially regarding predicting experiential states in radical cognitive decline. They argue that respecting the *observable current well-being* of the patient *now* is more ethically paramount than adhering to a potentially flawed prediction made years ago, particularly when the current self seems to have different preferences. It's not *just* smuggling authority; it's arguing the directive's epistemic foundation is shaky in key cases, weakening its *claim* to authority.

  **The Full Menu with Verdicts:**

  | Claim Type                     | Precise Interpretation                                                                 | Status & Verdict                                                                                                                                | Relevance to Bioethics Rejecting Living Wills                     |
  | :----------------------------- | :------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------- |
  | **Humean Bundle**              | Past & present selves are metaphysically distinct entities.                            | **Niche Philosophy.** Not a platitude. Would implode law/society if applied generally. Bioethicists *don't* use this.                           | ❌ Not Used                                                       |
  | **Psych Continuity Cutoff**    | Severe psychological disruption breaks the binding chain of authority.                 | **Core Bioethical Argument.** Not about identity *per se*, but about sufficient connection for *authority*. Explains rejection in dementia cases. | ✅ Primary Justification                                          |
  | **Normative Authority Claim**  | Past selves lack inherent moral right to bind future selves, even if identical.        | **Deep Philosophical Challenge.** Highlights conflict between past autonomy & current wellbeing. Lurks beneath the surface of debates.         | ⚠️ Implicit Leverage (prioritizing current interests/wellbeing) |
  | **Epistemic Privilege**        | Past capacitated self best knew the enduring self's true values for incapacity.        | **Central Justification *for* Directives / Counterargument *Against* Rejection.** Bioethics skepticism targets the reliability of this privilege. | ⚔️ Core Battleground (Is the directive a reliable guide *now*?) |

  **Conclusion:**

  The "stranger" quote bundles provocative but distinct ideas. Bioethicists rejecting a living will in a specific case (like advanced dementia) are primarily relying on the **Psychological Continuity Cutoff Claim** – arguing the current individual is sufficiently disconnected from the author that enforcing the directive harms *their* current wellbeing or ignores *their* current (expressed or inferred) preferences. They implicitly leverage intuitions related to the **Normative Authority Claim** (why should the past ghost dictate to this suffering person?) and actively challenge the **Epistemic Privilege Claim** (the directive doesn't accurately reflect what *this person now* would want or what constitutes wellbeing *for them in this state*). The **Humean Bundle** view is a philosophical curio, irrelevant to practical bioethics. The real tension lies between the authority bestowed by past autonomy (based on presumed epistemic privilege) and the duty to respect the current interests of the existing person, especially when the connection between the two seems broken.
