answer: |-
  Here's the argument that frame-locking is the primary mechanism by which intuition pumps mislead us about moral and metaphysical reality, explaining the persistence of debates:

  **The Core Argument: Frame-Locking as Generative of Misleading Intuitions**

  1.  **The Mechanism: Suppression, Not Just Illumination**
      *   Intuition pumps don't merely "clarify" a concept by making one aspect salient. They *actively engineer* the scenario to make one specific conceptual frame (e.g., physical action, risk-aversion, discrete choice) overwhelmingly dominant.
      *   Crucially, they achieve this dominance by *structurally excluding* or making cognitively inaccessible the competing frames that would naturally arise in a less constrained, real-world context. The pump's design (its specific elements, language, sequence of events) acts as a cognitive filter.
      *   **Result:** We don't just *see* one frame; we *fail to see* the others. Counter-intuitions aren't ignored; they are never generated in the first place within the context of the pump.

  2.  **Why This Misleads About Reality (Moral & Metaphysical):**
      *   **Moral Reality:** Moral truths (if they exist) are not isolated propositions but emerge from complex webs of relationships, intentions, consequences, roles, and contexts. Frame-locking artificially isolates *one* strand (e.g., direct physical causation in trolley, immediate risk in experience machine) while suppressing the others (e.g., omission, long-term identity, social context, emotional resonance of *specific* acts).
          *   **Misleading Effect:** The pumped intuition feels like a direct insight into a moral truth (e.g., "causing harm directly is always worse than allowing it"), but it's an artifact of the suppressed complexity. It misrepresents the *structure* of moral reasoning by presenting a simplified, frame-locked output as fundamental.
      *   **Metaphysical Reality:** Metaphysical questions (e.g., nature of consciousness, personal identity, free will) concern fundamental structures of existence, which are inherently interconnected and resistant to isolation. Frame-locking forces an artificial isolation.
          *   **Misleading Effect:** Pumps like the Experience Machine or Chinese Room create intuitions suggesting sharp boundaries or clear ontological categories (e.g., "consciousness *must* be more than computation," "identity *is* broken by simulated experience"). These intuitions feel like glimpses into the deep structure of reality, but they arise precisely *because* the pump suppresses the messy continuity, embodiment, and contextual embedding that characterize actual existence. The frame-locked intuition misrepresents the *nature* of the phenomenon.

  3.  **Explaining the Recurring Debates:**
      *   **Agreement on "Facts", Disagreement on Frames:** Philosophers often agree on the *description* of the pump's scenario (e.g., flipping the switch diverts the trolley, Mary learns new facts upon release). The intractable disagreement is about *which frame is the appropriate lens* for interpreting those facts and generating the relevant intuition.
      *   **Frame-Locking Creates Intractable Standoffs:** Each side is locked into the intuition generated by their favored frame (or sees the opposing frame as suppressed/revealed by the pump). Defenders of the pump argue it reveals the *true* fundamental frame; critics argue it suppresses the *essential* counter-frame.
      *   **Recycling Mechanism:** Because the debate shifts to the meta-level of *which frame is fundamental* (a deeply contested philosophical question itself), rather than resolving the facts *within* the pump, progress stalls. Each iteration of the debate reinforces the salience of the pump's structure, making the frame-lock harder to break. Philosophers keep returning, hoping *this time* the suppressed frame will be recognized as primary, or the revealed frame will be universally accepted.

  **Distinguishing Settled vs. Contested:**

  *   **Settled (or Widely Accepted) in Philosophy of Mind / Moral Psychology:**
      *   **Framing Effects Exist:** Cognitive science robustly demonstrates that how a problem/question/scenario is framed significantly influences intuitive judgments and decisions. This is non-controversial.
      *   **Intuitions are Context-Sensitive:** Our intuitive responses are not context-free deliverances of pure reason; they are shaped by the specific presentation, emotional valence, personal history, and cognitive biases.
      *   **Neural Correlates:** Specific brain regions and processes are reliably associated with generating intuitive judgments, moral emotions, and decision-making under uncertainty.
      *   **Dual-Process Models:** Many aspects of cognition, including moral judgment, involve interplay between faster, more intuitive/emotional processes and slower, more deliberative/analytical processes. Frame-locking often exploits the fast, intuitive system.

  *   **Genuinely Contested:**
      *   **The Epistemic Status of Intuitions:** Are intuitions (even carefully considered ones) reliable guides to *truth* (moral or metaphysical), or are they merely psychological data points about our concepts or cognitive architecture? **This is fiercely debated.**
      *   **The Nature of Moral Truth:** Are there objective moral facts? If so, what is their nature (natural, non-natural)? Do intuitions track these facts, or are they merely adaptive responses? **Core meta-ethical debate.**
      *   **The Hard Problem of Consciousness:** While neural correlates of consciousness are studied, *why* or *how* subjective experience arises from physical processes remains deeply mysterious and contested. Frame-locked pumps (like Mary's Room) generate strong intuitions, but their validity as arguments hinges on unresolved metaphysical questions. **No consensus.**
      *   **The Role of Emotion in Moral Judgment:** While emotions *influence* judgments is settled, whether they are *constitutive* of moral judgment, distortive, or merely informational is contested (e.g., sentimentalism vs. rationalism).
      *   **Personal Identity:** What constitutes the persistence of a person over time (psychological continuity, bodily continuity, narrative, etc.)? Frame-locked pumps (like teletransporters or experience machines) generate strong intuitions favoring one view, but the *correct* criterion is fundamentally contested. **No consensus.**

  **Conclusion:**

  Frame-locking isn't just a source of confusion; it's an *engine of misdirection*. By structurally suppressing competing conceptual frames, intuition pumps generate powerful but artificially purified intuitions. These intuitions feel like direct insights into moral or metaphysical reality, but they are, in fact, artifacts of the pump's selective suppression. This explains why debates persist despite agreement on case "facts": the real conflict is meta-philosophical, concerning *which conceptual frame* provides the fundamental lens for interpreting reality. The frame-lock inherent in the pump itself ensures this deeper conflict remains unresolved, perpetually recycling the debate around the same engineered scenarios. The settled science shows *that* framing effects powerfully shape intuitions; the profound philosophical disagreements concern whether these frame-locked intuitions reveal truth or merely reveal the structure of the trap.
