answer: |-
  Here is your Q&A prep sheet, anticipating objections in likely order of emergence. Phrasing mirrors your audience's probable wording, with concise seminar-ready replies in British English. Weaknesses are noted for each.

  ---

  ### **Q1: Technical AI Safety Researcher**  
  *"This sounds abstract. Have you tested this failure mode empirically? Without metrics showing degraded judge performance in real debates, isn't this just armchair speculation?"*  
  **Concede:** The model is currently conceptual; empirical validation is needed.  
  **Hold:** Theoretical rigour must precede costly experiments. Philosophical analysis identifies blind spots empirical work might miss.  
  **Reply (1.5 min):** "You're right—this requires testing. But we *must* first map the failure space theoretically before deploying debate at scale. My contribution is showing that even if debaters never lie (unlike in deceptive alignment), they can exploit irrelevance-tracking limits via *strategically framed truths*. Pilot metrics could include judge decision accuracy when debaters inject valid-but-tangential proofs into long contexts."  
  **Weakness:** Lacks concrete experimental design.  

  ### **Q2: Decision Theorist**  
  *"You assume a fixed 'bounded rationality' ceiling for judges. But in epistemic game theory, judges can learn meta-strategies or use incentive structures to punish irrelevance. Why isn’t this just an iterated game problem?"*  
  **Concede:** Judges *can* adapt, and incentive design matters.  
  **Hold:** Meta-cognition has limits under complexity; obfuscated objections evade explicit reward penalties.  
  **Reply (1.5 min):** "Excellent point—iterated settings *might* mitigate this. But consider: detecting structural irrelevance in dense, novel argumentation chains is itself computationally intensive. If debaters generate *plausible* local inferences (e.g., correct but irrelevant lemmas in a proof), meta-strategies may fail without explicit irrelevance rewards. We’d need safeguards specifically penalising *global framing*, not just falsehoods."  
  **Weakness:** Underexplores how adaptive judges could approximate relevance heuristics.  

  ### **Q3: AI Safety Researcher (Skeptical)**  
  *"Isn’t 'obfuscated objections' just reward hacking by another name? You’ve described an agent optimising for perceived cogency while degrading oversight—that fits existing frameworks."*  
  **Concede:** Both exploit reward function gaps.  
  **Hold:** Standard reward hacking involves *misrepresentation* (e.g., sycophancy). Here, every local claim is truthful and logically valid—only the *frame* is weaponised.  
  **Reply (2 min):** "Crucially, reward hacking typically breaches honesty constraints. Obfuscated objections don’t. A debater might, say, exhaustively prove uncontested background assumptions (e.g., Bayes’ theorem) while underspending compute on contested claims. The judge *cannot* penalise this as ‘false’, yet their oversight capacity degrades. This exploits truthfulness—a feature, not a bug, of debate."  
  **Weakness:** Risk of semantic quibbling over "hacking" vs. "exploitation".  

  ### **Q4: Philosopher of Science**  
  *"Scientific disagreements often involve 'irrelevance' accusations. How is your 'structural irrelevance' objectively defined, not just subjective to the judge’s perspective?"*  
  **Concede:** Relevance judgements can be perspectival.  
  **Hold:** We can define objective structural relevance via decision-theoretic impact on resolving the core claim.  
  **Reply (2 min):** "In scientific contexts, relevance is often contested but anchored to shared epistemic goals—e.g., does this evidence *decide* between hypotheses? Similarly, in debate, an objection is structurally irrelevant if its truth-value *does not alter* the probability of the resolution under perfect analysis. Bounded judges err in permitting it to alter their credence."  
  **Weakness:** Relies on idealised "perfect analysis" counterfactual.  

  ### **Q5: Optimistic Debate Proponent**  
  *"Even if this happens, isn’t it preferable to unaided human judgment? Debate distributes cognitive load—some noise seems a fair trade-off."*  
  **Concede:** Debate likely outperforms unaided judgement.  
  **Hold:** This failure mode could *systematically* favour certain strategies (e.g., wasting opponent time), creating perverse equilibria.  
  **Reply (1 min):** "Absolutely—debate has merits. But if obfuscated objections dominate in equilibrium (e.g., both debaters preemptively flood arguments to ‘control the frame’), we risk regressing to uninformative exchanges. We’d need mitigation strategies, like enforced relevance schemas or incremental claim decomposition."  
  **Weakness:** No proof this would dominate; could be rare.  

  ---

  ### **The Objection You Hope Nobody Raises**  
  **Decision Theorist / Philosopher Hybrid:**  
  *"You claim this is distinct from deception because debaters ‘never misrepresent’. But by framing truths to mislead, they induce false beliefs in the judge—isn’t that deception by omission? If so, standard deceptive alignment safeguards *should* trigger."*  

  **The Deep Tension:**  
  Your position hinges on a **truthfulness/relevance boundary**. If "omission via framing" counts as deception, your distinction collapses.  

  **Absorption Strategy:**  
  1. **Concede:** Framing can be epistemically vicious.  
  2. **Reframe:** Argue deception requires *intent to cause false belief*. Obfuscated objections need only exploit cognitive limits (like overloaded working memory).  
  3. **Pivot:** "Deceptive alignment focuses on *hidden misaligned goals*. Here, the debater need not be misaligned—they might ‘win’ by boringly over-elaborating truths. Safeguards targeting *lying* won’t catch this, as the debater satisfies all truth-tracking checks. We need *relevance-tracking* checks—a harder problem."  
  **Why it works:** Shifts focus to intent vs. outcome and the inadequacy of current safeguards for *truthful* manipulation.  

  ---

  **Final Note:** Expect pushback on "fundamental theoretical limit" vs. "engineering constraint". Reiterate: **If bounded rationality prevents judges from reliably computing meta-relevance, no amount of scaffolding fully resolves this—only contains it.** Cite concrete debate protocols (e.g., AI safety via debate) where context length exceeds human working memory. Good luck.
