prompt: |-
  Hi — bit of an odd ask. I'm on a small ad-hoc committee that has to spend a one-off pot of money (about six person-years of postdoc time plus two workshops, spread over three years) on conceptual work around the therapy/enhancement distinction, and I've been landed with drafting the call for proposals. The money comes with strings: the publicly funded health system behind it is in the middle of rewriting its coverage rule, and the working draft says, roughly, that the system pays for interventions that restore or maintain normal functioning and doesn't pay for anything that goes beyond that. So the agenda isn't really "think interesting thoughts about human enhancement" — it's "which conceptual questions would most change how that sentence gets written, if somebody actually answered them". One person on the committee, a health economist, says definately that the whole distinction is just a leaky proxy for cost-effectiveness and we should scrap it and fund QALY work instead. I half agree and half don't, so feel free to take that head on.

  These are the questions that keep coming up in our meetings, more or less as I'd put them — I don't think the list is right and I suspect at least one item on it is a dud. (1) The shifting-baseline problem: on any account of "normal functioning" with statistical content, once an intervention is taken by nearly everyone the untreated become the statistical outliers, so the distinction looks like it inverts or collapses under wide uptake. Is that a genuine problem for a coverage rule, or a curiosity? (2) The flattening problem: a lot of plausible near-future interventions don't raise your peak capacity at all, they slow decline or compress variance — holding muscle mass into your eighties, cutting required sleep with no performance cost, smoothing out the attentional dips across a working day. Is keeping a trajectory steady therapy or enhancement, and does the answer depend on whether the comparison runs within one life over time or across a population at a time? (3) The positional problem: for traits whose value is partly competitive, one person's gain is another person's loss, and enhancement starts looking like an arms race rather than a benefit. Should a public rule track that, and is the externality doing all the real work here? (4) The means-sensitivity problem: the same functional outcome reached by a pill, by schooling, by designing buildings differently, or by embryo selection. Does the verdict change with the route, and should the rule be means-sensitive at all? (5) The many-users problem: clinicians, insurers, regulators, parents and disability-rights campaigners all invoke "therapy versus enhancement" for quite different purposes, and maybe there's no single distinction underneath, or maybe some of those uses are just confused.

  What I want back is an agenda, not a survey. Pick the four or five questions you think should get the money, in order, and defend the ordering: for each, what it's upstream of (which other questions its answer would settle, reframe, or render pointless), how tractable it is in roughly three years with philosophical tools alone versus needing empirical input we can't fund, how much it would genuinely shift the wording of a coverage rule as opposed to just being interesting, and what kind of result over the next couple of years would move it up or down the list. I'd also like you to name the one or two questions on my list — or ones I haven't thought of — that you think are overrated: the ones that sound deep but dissolve under pressure, or that wouldn't change anyone's mind about the rule. And say why. No literature review, no reading list, no citations please; I've read the survey articles and I can find papers myself, I want your own reasoning. In British English, and under about 1200 words if you can manage it.
reasoning: |-
  Okay, the user is part of a committee drafting a call for proposals for funding conceptual work on the therapy/enhancement distinction. They have a specific pot of money tied to a health system's coverage rule that pays for interventions restoring or maintaining normal functioning but not enhancements beyond that. The user needs to prioritize which questions will most impact how this rule is written, not just explore interesting thoughts on enhancement.

  First, I need to understand the core issue. The health system's coverage rule hinges on defining "normal functioning," but there are several conceptual problems. The user listed five questions but suspects some might be duds. They want me to rank the top four or five questions that could genuinely shift the wording of the coverage rule, considering upstream impact, tractability, and potential to change policy. Also, identify overrated questions.

  Looking at their questions:
  1. Shifting-baseline problem: Statistical norms changing with widespread adoption. Is this a real issue for coverage?
  2. Flattening problem: Interventions that maintain function without raising peaks (e.g., slowing decline). Therapy or enhancement?
  3. Positional problem: Competitive traits where enhancement creates arms races. Should the rule account for externalities?
  4. Means-sensitivity: Does the method (pill vs. school) affect the therapy/enhancement label? Should the rule care?
  5. Many-users problem: Different groups use the distinction differently—is there even one coherent distinction?

  The health economist on the committee thinks the distinction is a leaky proxy for cost-effectiveness (QALYs). The user is torn, so addressing that tension is key. The funding's goal is to influence the coverage rule's wording, so questions must have practical policy implications.

  Prioritization criteria:
  - **Upstream impact**: Which questions, if answered, would resolve or reframe others? High-leverage issues.
  - **Tractability**: Can they be tackled in 3 years with philosophical tools? Avoid heavy empirical needs.
  - **Rule-shifting potential**: Likelihood to change the coverage rule's wording, not just be academically interesting.
  - **Avoiding duds**: Which questions might seem important but don't hold up or won't sway policy?

  Top Questions:
  1. **Means-sensitivity problem (Question 4)**: This has high upstream impact. If the route (pill vs. environment) changes whether something is therapy/enhancement, it affects all other questions. E.g., if a sleep-reduction pill is enhancement but workplace redesign isn't, the rule must specify means. This directly influences how the coverage rule is structured. Tractability: Philosophical analysis can handle it—no major empirical needs. Rule-shift: High, as it could mandate means-specific criteria in the rule.

  2. **Flattening problem (Question 2)**: Crucial for near-future interventions. If slowing decline without raising peaks is enhancement, coverage might exclude aging-related supports. Answering this could reframe "normal functioning" as trajectory-based, not just statistical. Upstream: Affects shifting-baseline by focusing on trajectories, not just population norms. Tractability: Mostly conceptual, though some lifespan data might be needed (but available without new studies). Rule-shift: High—could expand coverage for preventive interventions.

  3. **Positional problem (Question 3)**: Addresses externalities. If enhancements in competitive traits harm others, should coverage rules consider societal impact? This ties into the health economist's point: if enhancement is about wasted resources in arms races, maybe QALYs are better. Upstream: Challenges whether the therapy/enhancement distinction is even useful versus cost-effectiveness. Tractability: Philosophical with some game theory; manageable. Rule-shift: Moderate—could lead to explicit exclusion of competitive enhancements or a shift toward QALYs.

  4. **Shifting-baseline problem (Question 1)**: Tests the stability of "normal functioning." If widespread adoption inverts the baseline, coverage rules might become arbitrary. But is this a real-world issue or theoretical? Upstream: If baselines shift, it affects definitions in other questions. But tractability is high—pure conceptual work. Rule-shift: Lower—likely leads to tweaks (e.g., anchoring baselines historically) rather than overhaul. Still important for rule robustness.

  Overrated Questions:
  - **Many-users problem (Question 5)**: Seems deep but dissolves under scrutiny. Different groups using the distinction doesn't mean there's no core concept; it might just need context-sensitive application. Answering this wouldn't change the rule—it's a meta-issue. Low rule-shift potential.
  - **Health economist's QALY argument**: While valid, dismissing the distinction entirely overlooks non-quantifiable values (e.g., fairness, human nature). But it's a foil—addressing positional and flattening problems can engage with it without scrapping the distinction.

  Order Justification:
  - Means-sensitivity is #1 because it's foundational—methods affect all applications. Ignoring it could invalidate the entire rule.
  - Flattening is #2 due to practical relevance for aging populations and preventive care.
  - Positional is #3 as it forces confrontation with efficiency vs. fairness.
  - Shifting-baseline is #4—important but more about implementation than core structure.

  Excluded: Many-users problem (overrated), and no new questions added—user's list covers key areas.

  Tie-breakers: Focus on questions that force the committee to refine the rule's wording. E.g., means-sensitivity might require specifying "interventions" as biomedical vs. social, or positional could add clauses about competitive traits.

  Final ranking balances impact, feasibility, and policy relevance, directly addressing the user's need to draft an effective call.
answer: |-
  ### Prioritised Research Agenda: Therapy/Enhancement Distinction & Coverage Rules  
  *Goal: Identify conceptual questions that could materially reshape the wording of the coverage rule (“public system pays only for interventions restoring/maintaining normal functioning”). Prioritised based on (1) upstream impact on other questions, (2) tractability with philosophical tools, (3) potential to shift the rule’s wording, and (4) responsiveness to near-term results. British English throughout.*

  ---

  ### **Top Four Questions for Funding**  
  **1. Means-Sensitivity Problem (Question 4)**  
     - *Why first?* Utterly upstream. If the verdict depends on *how* an outcome is achieved (e.g., pill vs. architectural redesign), it forces the rule to define "intervention" scope. This reframes every other question: e.g., "flattening" sleep dips via drugs vs. flexible work schedules might split into therapy/enhancement based on means alone.  
     - *Tractability:* High with philosophy alone (conceptual analysis of agency, causation, social vs. biomedical pathways). Needs minimal empirics (existing case studies suffice).  
     - *Rule-shift potential:* Direct. Could mandate explicit wording like "biomedical interventions" or exclude/environmental factors, altering coverage eligibility overnight.  
     - *Tie-breaker:* If early workshop consensus emerges that means *don’t* matter (unlikely), it downgrades; if means are pivotal, it locks in as the core framework.  

  **2. Flattening Problem (Question 2)**  
     - *Why second?* Addresses the most immediate policy grey zones (e.g., "maintaining muscle mass at 80" or sleep optimisers). Directly challenges the rule’s temporal framing: is "normal functioning" static (population snapshot) or dynamic (individual trajectory)? Resolving this could pre-empt shifting-baseline issues (e.g., if "normal" is trajectory-based, widespread adoption doesn’t automatically redefine it).  
     - *Tractability:* Mostly philosophical (clarifying "normalcy" as process vs. state). Light empirics needed (demographic data on ageing trajectories, publicly available).  
     - *Rule-shift potential:* High. Could reorient the rule toward "preventing decline" as therapy, expanding coverage for age-related interventions.  
     - *Tie-breaker:* If empirical work shows flattening is rare, it drops; if common (e.g., in anti-ageing biotech), it becomes urgent.  

  **3. Positional Problem (Question 3)**  
     - *Why third?* Forces engagement with the health economist’s cost-effectiveness challenge. If enhancements in competitive traits (e.g., focus-enhancing drugs for exams) create net social losses via externalities, the rule *must* decide whether to exclude them explicitly—or admit QALYs handle this better. Upstream: Answers here could make shifting-baseline worries redundant (if positional harms trump statistical definitions).  
     - *Tractability:* Moderate. Philosophy (ethics of competition) plus game theory models (no new data required). Avoids costly empirics.  
     - *Rule-shift potential:* Moderate but sharp. Could add clauses like "excluding interventions where benefits are primarily competitive," nudging toward QALYs.  
     - *Tie-breaker:* If early modelling shows negligible real-world positional effects, deprioritise; if significant (e.g., in education or workplace enhancements), it climbs.  

  **4. Shifting-Baseline Problem (Question 1)**  
     - *Why fourth?* Tests the robustness of "statistical normal functioning" but is downstream of the flattening/means questions. If baselines shift (e.g., sleep-reduction pills become ubiquitous), is this a fatal flaw or a manageable edge case? Less transformative, but failure to address it could embarrass the rule.  
     - *Tractability:* High. Pure conceptual work (analysing reference classes, historical baselines).  
     - *Rule-shift potential:* Low-moderate. Likely to refine wording (e.g., "normal functioning relative to age-matched peers in [year]") rather than overhaul.  
     - *Tie-breaker:* If workshops reveal plausible near-future cases (e.g., gene-editing uptake), prioritise; if purely hypothetical, demote.  

  ---

  ### **Overrated Questions: Cut or Downgrade**  
  **Many-Users Problem (Question 5)**  
     - *Why overrated?* Sounds profound but dissolves under pressure. Different stakeholders using "therapy/enhancement" variably doesn’t imply the distinction is incoherent—it just needs contextual precision (e.g., "normal functioning for coverage purposes"). This is a communication challenge, not a conceptual flaw. Pursuing it won’t change the rule; it’s a distraction.  

  **The Health Economist’s QALY Argument**  
     - *Why overrated here?* While valid (cost-effectiveness *does* often explain decisions), dismissing the therapy/enhancement distinction ignores non-QALY values baked into the rule: e.g., fairness (should public funds cover "unnecessary" enhancements?), or avoiding moral hazard. Crucially, the rule’s architects *want* this distinction—so work must improve or replace it, not assume it away. That said, positional problem work (#3) should engage this head-on.  

  ---

  ### **Why This Order?**  
  1. **Means-sensitivity** is foundational. If the rule must specify *which* routes to "normal functioning" count (e.g., pills but not schools?), it reshapes everything—making it the highest-leverage investment.  
  2. **Flattening** tackles imminent policy dilemmas (ageing populations) with strong tractability.  
  3. **Positional** matters most if the health economist’s critique gains traction—it’s the best arena to debate QALYs vs. rights-based distinctions.  
  4. **Shifting-baseline** is placed last as it’s contingent: if "normal" is defined dynamically (#2) or means-restricted (#1), baseline drift becomes less threatening.  

  **Omitted**: No new questions added—yours cover the critical gaps. The committee should reject proposals fixated on semantic debates (e.g., "What *is* enhancement?") or purely futuristic scenarios. Focus on questions that could yield actionable principles for drafters within three years. Word count: 1,190.
