prompt: |-
  hey so im drafting this mediation report for a local zoning dispute and im totally stuck. there are three conflicting factual stories about a proposed mixed-use building: it boosts the local economy, it destroys the only green corridor, and the land was already ecologically dead so the green argument is moot. the board chair is insisting we declare one 'true' account for legal clarity, but i want to structure the recommendation using a seven-mode evaluation for each claim — tagging statements as true in one respect, false in another, both together, neither, indescribable in a third, etc. — instead of picking a single winner. you are a professional philospher who specializes in multi-perspective reasoning and institutional ethics, not just conflict mediation. please start by brainstorming how this kind of multi-modal framing actually helps versus where it collapses into useless ambiguity in a real policy doc. then give me concrete report language — actual phrasing i can use — for how to present partial truths without sounding like im just avoiding a decision. also, since i have to defend this to lawyers who will say 'this is indecision with extra steps', whats the one reply that has to land? think step by step, dont over-polish, and be honest about where the approach breaks down. i need practical resoning here, not a history lecture.
reasoning: |-
  Okay, the user is drafting a mediation report for a zoning dispute and is stuck because there are three conflicting stories about a proposed mixed-use building. They need to evaluate each claim using a seven-mode framework instead of declaring one as true. The board chair wants a single true account for legal clarity, but the user believes a multi-modal approach is better. 

  First, I need to understand why the user is choosing this method. They might feel that the situation is too complex for a binary true/false decision. Each perspective has some validity, and declaring one as entirely true could alienate stakeholders. The user is likely aiming for a nuanced resolution that acknowledges different viewpoints, which could foster compromise and acceptance.

  The user is a mediator, so their main goal is to resolve the conflict in a way that all parties feel heard. However, they're facing pushback from the board chair and possibly lawyers who prefer clear, decisive statements for legal reasons. The user needs to defend their approach without seeming evasive. Their deeper need might be to maintain credibility while promoting a more inclusive process.

  The seven modes (true, false, both, neither, etc.) can capture complexity but risk being seen as ambiguous. I should highlight where this framework shines: when facts are context-dependent, like economic benefits versus environmental impact. But it falls apart when a clear factual determination is needed, such as legal compliance. The user must balance depth with practicality.

  For the report language, concrete examples are key. Phrases like "economically valid but environmentally incomplete" show how each claim has partial truths. Structuring each claim with bullet points using the modes makes it digestible. Emphasizing actionable recommendations based on the analysis turns theoretical nuance into practical steps.

  Defending against "indecision with extra steps" requires a strong counter: the goal is robust decisions through comprehensive understanding, not avoidance. Highlighting that ignoring complexity leads to flawed outcomes and litigation could resonate with lawyers. Acknowledging the framework's limits, like when binary decisions are unavoidable, adds credibility.

  I should also consider potential pitfalls. Overcomplicating the report might confuse readers, so clarity is crucial. Ensuring each modal tag directly ties to implications keeps it actionable. The user needs to demonstrate that this method leads to better, more sustainable resolutions by addressing all concerns upfront.
answer: |-
  Here’s a practical breakdown of your multi-modal approach for the mediation report, including strengths, limitations, concrete phrasing, and your crucial counter-argument – built for real-world policy friction:

  **Why This Framework Helps (And Where It Doesn't):**

  *   **Helps By:**
      *   **De-escalating Polarization:** Avoids declaring one side "winners" and others "liars." Acknowledges genuine concerns behind each narrative.
      *   **Exposing Nuance:** Reveals *why* each perspective feels true (e.g., "boosts economy" is true *if* measuring only short-term construction jobs; "destroys green corridor" is true *if* valuing informal green space as ecologically vital).
      *   **Building Legitimacy:** Shows the mediation deeply engaged with the complexity, not oversimplifying for convenience. Makes the eventual recommendation harder to dismiss as biased.
      *   **Identifying Actionable Compromises:** Pinpoints *where* mitigation is needed (e.g., "While Claim 2 ('destroys green corridor') is *incomplete* regarding current biodiversity, it's *valid* regarding community-perceived loss. Recommendation: Enhanced landscaping + formal pocket park creation.").
      *   **Reflecting Reality:** Zoning conflicts *are* often about competing validities, not pure factual falsehoods. This framework captures that.
  *   **Collapses Into Useless Ambiguity When:**
      *   **Binary Facts Exist:** If there's an undisputed, legally binding survey proving the land *is/isn't* protected wetland, the "true/false" mode dominates. Don't overcomplicate hard facts.
      *   **Specific Legal Thresholds Apply:** If zoning law *requires* a definitive finding on "significant ecological value," you *must* meet that binary requirement *first*, then layer the nuance.
      *   **Recommendations Lack Concrete Action:** If the analysis doesn't clearly translate into specific, actionable mitigation measures or decisions, it feels academic.
      *   **Poorly Explained:** If the modes aren't clearly defined *in the report* and applied consistently, it looks like jargon or evasion.

  **Concrete Report Language (Structured & Action-Oriented):**

  **Framework Introduction (Before Analysis):**
  > "This mediation acknowledges the presence of multiple, seemingly conflicting factual narratives. Rather than seeking a single, monolithic 'truth,' the analysis employs a multi-modal evaluation to understand the validity, limitations, and context within each claim. This approach recognizes that complex land-use issues often involve perspectives that are:
  > *   **True in One Respect:** Valid within a specific context or set of criteria.
  > *   **False in Another Respect:** Invalid or incomplete when viewed through a different lens or set of data.
  > *   **Both True and False Simultaneously:** Containing elements of validity and invalidity depending on the aspect considered.
  > *   **Neither True nor False:** Addressing subjective values or future projections not easily captured by factual binaries.
  > *   **Conditionally True/False:** Dependent on specific assumptions or future actions.
  > *   **Indeterminate:** Lacking sufficient, definitive data for a clear evaluation at this time.
  > *   **Not the Point:** Missing the core ethical, legal, or practical issue at stake.
  >
  > This nuanced assessment aims to inform recommendations that address the *underlying concerns* driving each narrative, leading to a more durable and equitable resolution."

  **Analysis Section (Per Claim - Be Specific!):**

  1.  **Claim: "The project significantly boosts the local economy."**
      *   **Evaluation:** **True in one respect, Conditionally True in another.**
      *   **Analysis:** Projections indicate a *true* short-term economic boost through construction jobs and local spending (Mode 1). The claim of *significant long-term* benefit is *conditionally true* (Mode 5), dependent on successful tenant occupancy, retail viability, and sustained resident spending patterns. It is *not the point* (Mode 7) regarding the core dispute over environmental impact and character change.

  2.  **Claim: "The project destroys the only functional green corridor in the area."**
      *   **Evaluation:** **True in one respect, Incomplete in another, Valid regarding community perception.**
      *   **Analysis:** The project demonstrably *removes* the existing undeveloped greenspace *used* as a corridor by residents (Mode 1 - True in this respect). Formal ecological surveys suggest its function as a biodiverse *wildlife* corridor is limited (*Incomplete* - requiring Mode 6/Indeterminate or Mode 2/False in that specific respect, depending on data). However, its loss as a *perceived and valued* community green connector is *valid and significant* (Mode 1/True regarding social function & perception, Mode 7 highlights this was the core value for many residents).

  3.  **Claim: "The land is ecologically dead/compromised, making the 'green corridor' argument moot."**
      *   **Evaluation:** **False as absolute claim, True in one respect, Misses the point.**
      *   **Analysis:** Characterizing the site as universally "ecologically dead" is *false* (Mode 2) based on surveys showing rudimentary habitat/value (e.g., soil retention, minor fauna). It is *true* (Mode 1) that the site lacks high-value, protected ecological features (e.g., endangered species, pristine wetlands). However, this argument is largely *not the point* (Mode 7) for residents whose primary concern is the loss of accessible, contiguous green space for human use and neighborhood character, irrespective of formal ecological ratings.

  **Recommendation Section (Crucially Link Nuance to Action):**
  > "Based on this multi-modal evaluation, the mediation recommends approval of the project *subject to binding conditions* that explicitly address the valid concerns identified within each narrative:
  >
  > *   **Addressing Economic Validity & Conditions:** Approval contingent on [Specific mitigations, e.g., local hiring quotas during construction, community benefit agreement for retail space].
  > *   **Addressing Green Space Loss Validity:** Approval contingent on the developer providing a *superior replacement* for the lost community green function, such as: [Concrete examples: Fully funding and constructing a contiguous, publicly accessible pocket park/path on-site or adjacent; significant off-site contribution to a nearby park upgrade; guaranteed public ROW access through the site].
  > *   **Addressing Ecological Context:** Approval contingent on implementing enhanced ecological design beyond baseline requirements [e.g., specific native plantings, soil remediation, integrated habitat features] acknowledging the site's *potential* for improvement, countering the 'ecologically dead' perception while going beyond its current state.
  >
  > This conditioned approval recognizes the *partial validity* of the economic opportunity while directly mitigating the *valid losses* identified in the 'green corridor' narrative and proactively enhancing the ecological baseline."

  **Your ONE Essential Reply to "Indecision with Extra Steps":**

  > **"This isn't avoiding a decision; it's building a *robust* decision that acknowledges complexity. Declaring one simple 'truth' here ignores valid concerns guaranteed to resurface as legal challenges or community backlash later. Our framework forces us to grapple with *why* each side feels their truth is real, leading to specific, actionable conditions that address the *core* of each concern upfront. That's how you get durable resolutions, not just quick ones vulnerable to collapse."**

  **Why This Lands:**

  1.  **Reframes "Indecision" as "Robustness":** Positions complexity as strength, not weakness.
  2.  **Highlights the Real Risk:** Points out the *practical consequence* of oversimplification (challenges, backlash).
  3.  **Focuses on Action:** Emphasizes that the *output* is concrete conditions, not just analysis.
  4.  **Appeals to Durability:** Lawyers understand the cost of decisions that unravel. This argues for long-term stability.
  5.  **Uses Their Language:** "Legal challenges," "vulnerable to collapse" resonate legally.

  **Be Honest About Breakdowns (Internally & If Pressed):**

  *   **Internally:** Acknowledge this is harder to write and requires more careful reading than a binary ruling. It demands precise linking of analysis to mitigation.
  *   **To Critics:** "You're right, this approach *doesn't* work for clear-cut, binary legal facts. Where those exist [cite example if possible], we state them plainly. But *this dispute* hinges on competing priorities and interpretations where hard binaries obscure more than they reveal. For *those* elements, this framework provides the necessary depth to make a *justifiable* and *implementable* recommendation that minimizes future conflict. We use simple binaries where they fit, and nuanced modes where they are essential for capturing reality."

  **Key Practical Takeaway:** Your power lies in translating the modal analysis **directly into concrete, mandated conditions of approval**. The modes help you *justify why* those specific conditions are necessary and fair, addressing the *valid kernel* within each conflicting story. That's the practical value – it turns philosophical nuance into enforceable policy.
