answer: |-
  Your analysis touches on a profound methodological tension in early historiography. Let's dissect Herodotus's reasoning and evaluate your "archival drift threshold" concept through three lenses: Herodotus's explicit criteria, the implicit institutional framework, and modern historiographical parallels.

  ### 1. **Herodotus's Explicit Methodology: Pragmatic Inference**
  Herodotus (2.120) prioritizes the Egyptian account because:
  - **Behavioral Plausibility**: He argues the Trojans would have surrendered Helen to avoid annihilation ("not being utterly mad"). This reflects his *gnōmē* (judgment) about universal human rationality.
  - **Source Hierarchy**: He elevates priestly testimony over poetic tradition, seeing the former as custodians of records (*hypomnēmata*), the latter as embellished for entertainment.
  - **Causal Consistency**: The Egyptian version eliminates the "plot hole" of Troy's irrational self-destruction.

  *This is fundamentally rationalist inference*, not archival validation. Herodotus seeks *to eikos* (the plausible) via psychological and political axioms, anticipating Thucydides' methodological realism.

  ### 2. **Archival Drift Threshold: Applicability & Limitations**
  Your concept brilliantly describes narrative transformation, but faces challenges in Herodotus's context:
  - **Institutional vs. Heroic Framing**:  
    - *Egyptian account*: Embeds Helen in **state bureaucracy** (Pharaonic authority detains her, priests document it). Agency shifts from Paris/Helen to Pharaoh Proteus as administrator.  
    - *Homeric account*: Revolves around **personal agency** (divine interventions, heroic passions).  
    Herodotus intuitively recognizes the Egyptian framing as more "historical" because it aligns with *documentary practice* (records kept by temple institutions) and *depersonalized causality* (political calculus > divine whim).  
  - **Pre-Archival Societies?**:  
    Egypt had temple archives, but oral tradition dominated transmission. The "drift" here occurs through **ritualized repetition within sacerdotal institutions**, not secular bureaucracies. This *proto-archival* context allows Herodotus to treat priestly testimony as quasi-documentary.  
  - **Threshold Failure in Homer**: The *Iliad* never crosses the drift threshold because it remains embedded in **performative, heroic culture**. Its transmission relies on *aoidoi* (bards) celebrating individual agency, not institutions preserving records.

  **Verdict**: Herodotus *unconsciously* leverages an early form of archival drift thinking by favoring institutionalized testimony, but his *explicit criterion* remains pragmatic inference. The two approaches converge because institutional retelling (Egyptian priests) inherently filters out mythopoeic excess in favor of bureaucratic plausibility.

  ### 3. **Modern Implications: Arthur, Exodus, and the Drift Threshold**
  Herodotus's method illuminates modern debates about legendary narratives becoming "history":

  | Case Study       | Archival Drift Mechanism                         | Herodotean Parallel          | Status as "History"        |
  |------------------|--------------------------------------------------|------------------------------|----------------------------|
  | **Trojan War**   | Hittite diplomatic tablets ("Ahhiyawa" = Achaeans) depersonalize conflict into state correspondence | Egyptian priests' records    | Semi-historical (geopolitics accepted; gods/heroes rejected) |
  | **King Arthur** | *Annales Cambriae* (administrative chronicle) frames Arthur as military commander, not romance hero | Egyptian bureaucratic framing | Limited acceptance (battles plausible; Round Table legendary) |
  | **Exodus**       | Lacks Egyptian institutional records; remains within ritual/heroic narrative (e.g., Passover liturgy) | Homeric heroic tradition     | Uncrossed threshold (no depersonalized documentation) |

  #### **Key Insights**
  - **Institutional Context is Decisive**: Narratives embedded in administrative/ritual frameworks (Egyptian temples, monastic chronicles) more readily cross the drift threshold by suppressing individual heroism in favor of systemic logic.
  - **Herodotus's Enduring Relevance**: His preference for *human-rational causation* over *mythic agency* anticipates modern source criticism. The Egyptian Helen account succeeds because it replaces Aphrodite's whims with Pharaoh's political calculus.
  - **Threshold Limitations**: Archival drift alone cannot verify events (e.g., Helen's Egyptian stay remains unproven). It merely signals when a narrative *structurally aligns* with historiographical expectations of causality and institutional memory.

  ### Conclusion
  Herodotus operates with **dual criteria**: consciously with pragmatic inference, unconsciously with proto-archival drift sensibilities. The Egyptian account prevails because its *institutional framing* (priestly records, depersonalized agency) inherently satisfies his demand for behavioral plausibility, while Homer's personalized heroism defies political rationality. This case epitomizes how legends become "history" not necessarily through empirical verification, but through **narrative reframing into institutional and rationalist paradigms**—a process as vital for understanding Arthur's potential historicity as it is for dissecting Bronze Age diplomatic records. The archival drift threshold thus offers a valuable heuristic, provided we acknowledge its cultural specificity: what constitutes an "archive" (temple, chancery, database) shapes the very possibility of historical recognition.
