  Here is a draft joint statement reflecting an adversarial collaboration between an X-Risk Prioritizer (XP) and an S-Risk Prioritizer (SP), designed to be substantive, precise about residual disagreements, and signed in good faith:

  **Joint Statement on X-Risk and S-Risk Prioritization**

  We, an X-Risk Prioritizer (XP) and an S-Risk Prioritizer (SP), after extensive deliberation, jointly affirm the following points of agreement and clarify the nature of our remaining disagreements. We seek to move beyond dialectical stalemates by precisely identifying cruxes.

  **1. Substantive Agreements (Both Endorse):**

      1.  **Astronomical Stakes:** The potential future duration and scale of sentient life (human and post-human) are vast. Decisions made now could affect trillions of future beings across millions or billions of years. This scale makes mitigating existential risks and safeguarding future welfare a paramount moral priority.
      2.  **Coherence of "Worse than Extinction":** Futures containing *astronomical suffering* (s-risks) are conceptually coherent and represent a distinct category of catastrophic outcome. *However, whether such a future is *literally worse than human extinction* depends critically on one's population axiology (see disagreements).* Both agree that s-risks represent scenarios of profound moral disvalue.
      3.  **Axial Dependence:** The relative priority of x-risk reduction vs. s-risk reduction depends fundamentally on unresolved questions in population ethics (e.g., Totalism, Averagism, Critical Level Theories, Negative Utilitarianism) and value uncertainty. Neither position can be definitively proven solely through empirical risk assessment; core moral commitments are pivotal.
      4.  **Practical Interaction:** Interventions targeting x-risk reduction and s-risk reduction can interact in complex ways:
          *   **Reinforcement:** Some interventions clearly reduce both risks (e.g., improving international cooperation norms, developing robust AI alignment techniques, promoting careful biotechnology governance, fostering wisdom and foresight institutions).
          *   **Potential Trade-offs:** Some interventions might reduce one risk while potentially increasing the other, or create tension in resource allocation (e.g., certain forms of aggressive space colonization might reduce extinction risk but increase risks of astronomical suffering in unstable frontier societies; highly centralized solutions to x-risk might create single points of failure vulnerable to s-risk exploitation).
          *   **Distinct Tracks:** Significant resources can be directed towards interventions primarily targeting one risk with minimal impact on the other (e.g., specific asteroid deflection technology vs. research into humane brain-computer interfaces or suffering biology).
      5.  **Epistemic Limitations (Cluelessness):** Predicting the long-term consequences of interventions, especially regarding complex systems like society or AI, is profoundly difficult. Both x-risk and s-risk interventions carry significant risks of unintended negative consequences (including backfiring on the targeted risk or exacerbating the other risk). This necessitates humility and careful analysis.

  **2. Disagreements Table (Stated Neutrally):**

  | Disagreement Area | XP Characterization (SP Accepts as Fair) | SP Characterization (XP Accepts as Fair) |
  | :---------------- | :--------------------------------------- | :--------------------------------------- |
  | **1. Moral Weight of Suffering vs. Flourishing** | "Given the astronomical scale of potential future flourishing, preventing extinction is paramount. While intense suffering is bad, the vast potential for positive welfare outweighs concerns about suffering intensity under plausible population axiologies." | "Intense suffering imposes such extreme moral disvalue that preventing its astronomical accumulation can outweigh the loss of vast potential positive welfare, especially under suffering-focused moral views. The ceiling of suffering intensity is morally more significant than the open-ended scale of mild flourishing." |
  | **2. Moral Weighting Under Uncertainty** | "Under moral uncertainty encompassing diverse plausible views (including strong pro-flourishing views), the overwhelming potential scale of future flourishing lost in extinction justifies prioritizing extinction risk reduction, even granting significant probability to suffering-focused views." | "Under moral uncertainty encompassing diverse plausible views (including strong suffering-focused views), the extreme disvalue of astronomical suffering justifies prioritizing s-risk reduction at least on par with x-risk reduction, even granting significant probability to pro-flourishing views." |
  | **3. Tractability & Backfire Risk of S-Risk Interventions** | "Targeted interventions to robustly reduce s-risks (beyond general cooperation/wisdom) are currently highly intractable. Our understanding of consciousness and suffering is immature, and attempts to directly govern distant future welfare carry high risks of unintended negative consequences or backfiring." | "Targeted interventions to reduce s-risks (e.g., advancing suffering biology, promoting compassionate values, reducing key enabling risks like misaligned AI) are tractable enough, especially given the stakes. The risks of inaction on s-risks outweigh the risks of carefully chosen intervention attempts." |
  | **4. Interpretation of "Worse than Extinction" (Verbal)** | "Under a Totalist axiology, extinction always results in zero value. A future with *any* net-positive welfare, however small per capita, has astronomically greater total value if sufficiently large/populated. Therefore, no s-risk scenario is literally 'worse than extinction' under this view." | "Under a Negative Utilitarian (or strong Critical Level) axiology, a future with astronomical net suffering has astronomically *negative* total value, making it literally worse than extinction (which has zero value). 'Worse than extinction' is a coherent and critically important category." *(Note: This is primarily a verbal disagreement dependent on prior axiological commitments.)* |

  **3. Cruxes, Evidence, and Predictions:**

  | Disagreement Area | Crux Question | Shared Evidence/Argument Bearing on Crux | XP Prediction | SP Prediction |
  | :---------------- | :------------ | :--------------------------------------- | :------------ | :------------ |
  | **Moral Weight of Suffering vs. Flourishing** | **Is there a plausible intensity ceiling or diminishing marginal disutility for suffering such that astronomical amounts of mild flourishing *always* outweigh astronomical amounts of extreme suffering, regardless of suffering intensity?** | Progress in fields like neuroethics, valence research, and phenomenal physics could provide evidence on: (a) The existence/height of an "intensity ceiling" for suffering; (b) Whether disutility scales linearly or super-linearly with perceived intensity; (c) The phenomenological comparability of suffering and flourishing intensities. Philosophical arguments regarding lexical thresholds or incommensurability. | Evidence will show suffering disutility scales sub-linearly or has a ceiling well below the potential value of vast flourishing. | Evidence will support super-linear scaling of disutility with intensity and/or show extreme suffering is lexically worse than any amount of mild flourishing. |
  | **Moral Weighting Under Uncertainty** | **Does the vast *scale* asymmetry (potential sentients affected) inherent to extinction risk systematically dominate the *intensity* asymmetry (extreme suffering) inherent to s-risks under a broad spectrum of plausible moral weights?** | Formal moral uncertainty frameworks (e.g., MEC, BUP) applied across a representative range of population ethics views and value functions (including strong suffering-focused views with reasonable bounds). Sensitivity analysis on key parameters (scale multipliers, suffering weights). | Under robust moral uncertainty models incorporating scale, x-risk reduction consistently dominates s-risk reduction across most plausible weightings. | Under robust moral uncertainty models incorporating intensity ceilings/lexical thresholds, s-risk reduction holds comparable or greater priority across significant weightings. |
  | **Tractability & Backfire Risk of S-Risk Interventions** | **Can interventions specifically designed to reduce s-risks (beyond general x-risk overlap) achieve robust, net-positive expected impact with acceptable confidence given current knowledge?** | Case studies of proposed s-risk interventions (e.g., value advocacy, consciousness research governance, reducing key enablers like AI misalignment/power concentration). Analysis of historical analogues (limited). Modeling of potential unintended consequences. Expert elicitation on feasibility. | Rigorous analysis will show high uncertainty and significant net backfire risk for most distinct s-risk interventions, making them less cost-effective than robust x-risk reduction. | Rigorous analysis will identify a subset of distinct s-risk interventions (e.g., targeted AI safety research, suffering biology) with sufficiently robust expected positive impact to warrant significant prioritization. |

  **Note on Confidence:**

  *   **Representation Confidence:** Moderately High (7/10). The core positions are drawn from prominent literature and discourse within longtermist/EA communities. Key nuances (axiological dependence, interaction types, cluelessness) are incorporated. The "verbal" point on "worse than extinction" is explicitly noted.
  *   **Least Confident Joint Claim:** **Agreement 4 (Practical Interaction - Reinforcement).** While both *can* endorse it technically (some interventions *do* help both), SP might hesitate, fearing it downplays the *tension* and distinctness of core s-risk work. They might argue that emphasizing overlap risks subsuming s-risk concerns within an x-risk framework that doesn't inherently prioritize suffering reduction. The phrasing ("*Some* interventions...") aims for accuracy, but its perceived emphasis could be a sticking point requiring careful negotiation during actual signing. The core agreement on *potential* trade-offs (4b) is likely more robust.
