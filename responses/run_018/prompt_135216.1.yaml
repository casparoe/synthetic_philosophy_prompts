  Okay, the user is describing a very specific phenomenon in collective responsibility where a state acknowledges moral guilt for historical wrongs symbolically but avoids redistributing the material benefits derived from those wrongs. They mention this isn't covered by Jaspers' framework or standard theories of structural injustice. 

  I need to unpack what makes this configuration unique: it's the active separation between accepting moral inheritance while rejecting material inheritance. The state performs rituals of atonement (apologies, memorials) but treats economic advantages as "clean" property rights. This creates a stable hypocrisy where guilt is performative but doesn't disrupt privilege.

  Hmm, the user seems frustrated by how critics get dismissed for "confusing registers." They're likely seeking conceptual tools to critique this disconnect in their seminar. Since no established term exists, I should coin one that captures the core mechanism: selective inheritance. The key is defining how guilt gets compartmentalized - activated for symbolic value but quarantined from economic consequences.

  I'll contrast this with moral licensing (which is psychological) and symbolic politics (broader category). The non-identity problem parallel is clever but differs because here the state actively constructs continuity through selective inheritance. Must emphasize the deliberate institutional design aspect.
answer: |-
  This configuration can be termed **Selective Collective Inheritance**. It occurs when a collective entity (like a state or nation) deliberately activates symbolic *moral* inheritance from past wrongs (accepting guilt, performing rituals of atonement) while simultaneously deactivating or quarantining the *material* inheritance (retaining structures of advantage derived from those wrongs under the guise of neutrality, continuity, or individual property rights).

  Its necessary conditions are: (1) A formal, collective acknowledgment of guilt/responsibility for specific historical injustices committed by the collective or its predecessors; (2) The performance of symbolic acts of atonement based on this acknowledgment; (3) The concurrent protection of material structures and advantages demonstrably originating from the acknowledged injustices, justified through frameworks denying their tainted nature (e.g., individual property rights, state continuity); and (4) The explicit or implicit argument that moral responsibility and distributive justice are distinct "registers," making (2) compatible with (3). It differs from moral licensing (using past good deeds to permit present harm) because the symbolic act *is* the acknowledgement of harm; from symbolic politics (mere gestures without substance) by requiring the *active acceptance* of guilt; and from non-identity concerns by focusing on how the *collective itself* constructs its continuity, selectively inheriting moral status but disavowing the material legacy underpinning its current advantages.
