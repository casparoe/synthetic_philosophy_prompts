answer: |-
  Here is the complete desiderata specification for an adequate theory of well-being, structured using the Experience Machine (EM) as a multi-faceted stress test, with tensions and theory-elimination analysis:

  ---

  ### **I. Case Coverage Desiderata**
  | **Desideratum** | **Motivating Consideration** | **Non-Negotiable?** | **Theoretical Camp Bias** |
  |-----------------|------------------------------|---------------------|---------------------------|
  | **C1: Total Simulation Rejection**<br>The theory must explain why plugging into a perfect-simulation EM **reduces well-being** compared to an equally pleasurable/desire-fulfilled but non-simulated life. | Intuitive revulsion toward lives disconnected from reality; concerns about inauthenticity. | ★ Non-Negotiable (Core EM intuition) | Eliminates **Pure Hedonism** & **Unrestricted Desire Fulfillment** |
  | **C2: Reverse Case Accommodation**<br>Must explain why a **suffering subject** (e.g., chronic pain) might rationally **refuse to exit** a machine offering simulated relief, *without* conceding their life is genuinely flourishing. | Well-being must account for relief of extreme suffering as a welfare good, even if illusory. | Non-Negotiable | Challenges **Objective List** (if list excludes suffering-relief as intrinsic good) |
  | **C3: Partial-Machine Domain Sensitivity**<br>Must handle cases where **only specific domains** (e.g., simulated achievements, artificial friendships) are deceptive, while others (e.g., health, nature) are authentic. Should explain why deception in meaning-laden domains (love, achievement) harms well-being more than in trivial ones. | Real-world relevance (e.g., social media illusions); not all deceptions are equally welfare-eroding. | Non-Negotiable | Pressures **Hedonism** (if pleasure identical); favors **Hybrid/Objective List** |

  ---

  ### **II. Conceptual Distinctions to Preserve**
  | **Desideratum** | **Motivating Consideration** | **Non-Negotiable?** | **Theoretical Camp Bias** |
  |-----------------|------------------------------|---------------------|---------------------------|
  | **D1: Experience vs. Reflection**<br>Must distinguish between *momentary affective states* (pleasure/pain) and *reflective life-assessment* (e.g., life satisfaction). | Psychology: Kahneman's "experiencing vs. remembering self"; depressive realism. | ★ Non-Negotiable | Eliminates **Reductive Hedonism** |
  | **D2: Deception vs. Disconnection**<br>Must differentiate harm from **being deceived** (false beliefs) vs. **lacking causal contact with mind-independent reality**. EM primarily highlights the latter. | A deceived unplugged person may still flourish; EM disconnection is ontological, not epistemic. | Camp-Specific | Favors **Externalist/Objective** views |
  | **D3: Well-Being vs. Well-Being Degree**<br>Must explain how EM can provide *some welfare goods* (C2) without making life *overall flourishing* (C1). | Avoids all-or-nothing collapse; allows welfare trade-offs. | ★ Non-Negotiable | Challenges **Monistic Theories** |

  ---

  ### **III. Empirical Constraints**
  | **Desideratum** | **Motivating Consideration** | **Non-Negotiable?** | **Theoretical Camp Bias** |
  |-----------------|------------------------------|---------------------|---------------------------|
  | **E1: Hedonic Adaptation**<br>Must accommodate that humans adapt to both positive/negative circumstances (e.g., lottery winners, paralysis victims report near-baseline happiness). | Psychological evidence (Brickman et al. 1978); questions durability of experiential goods. | ★ Non-Negotiable | Challenges **Hedonism** (if well-being = net pleasure) |
  | **E2: Adaptive Preference**<br>Must explain why preferences shaped by deprivation (e.g., "happy slave") do **not** necessarily enhance well-being. | Capabilities Approach (Nussbaum); autonomy concerns. | Non-Negotiable | Eliminates **Unrestricted Desire Fulfillment** |
  | **E3: Satisfaction-Reality Gap**<br>Must allow that self-reported life satisfaction can diverge from objective conditions (e.g., impoverished communities reporting high satisfaction). | Cross-cultural well-being research; questions subjective metrics. | Non-Negotiable | Challenges **Subjectivist Theories** |

  ---

  ### **IV. Conceptual Puzzles to Resolve**
  | **Desideratum** | **Motivating Consideration** | **Non-Negotiable?** | **Theoretical Camp Bias** |
  |-----------------|------------------------------|---------------------|---------------------------|
  | **P1: Value Asymmetry**<br>Must explain why we prioritize **avoiding simulated suffering** (C2) over **acquiring simulated pleasures** (C1) – i.e., suffering-relief is machine-compatible, flourishing is not. | Asymmetric intuitions about EM: Acceptable for pain relief, unacceptable for pleasure-maximization. | Camp-Specific | Favors **Negative Utilitarianism/Hybrids** |
  | **P2: Authenticity's Scope**<br>Must define which connections to reality are welfare-constitutive (e.g., causal agency? love?) without ad hoc stipulation. | Partial-EM cases require principled distinction between "shallow" vs. "deep" authenticity. | ★ Non-Negotiable | Pressures **Objective List** to justify items |

  ---

  ### **V. Key Tensions (Jointly Unsatisfiable Desiderata?)**
  - **Tension Cluster:** `C1 + C2 + D3`  
    - **Problem:** Accommodating C1 (rejecting EM flourishing) requires valuing **mind-world contact**. But C2 (allowing machine relief for suffering) suggests *some* welfare goods (suffering-relief) are simulation-compatible. D3 demands these be *partial goods* without constituting flourishing.  
    - **Theoretical Casualties:**  
      - *Pure Hedonism* fails C1.  
      - *Strong Externalism* (e.g., all goods require real contact) fails C2.  
      - *Desire-Fulfillment* risks collapsing D3 if "desire to not suffer" is fulfilled in EM.  
    - **Resolution?** Only theories accepting **asymmetry** (suffering-relief is internal/experiential; flourishing requires externality) or **hybrid goods** avoid contradiction.

  ---

  ### **VI. Theory-Eliminating Desideratum**
  - **Most Potent Eliminator:** **D1 (Experience vs. Reflection Distinction)**  
    - **Why?** Empirical evidence (E1, E3) and EM cases (C1, C3) show affective states ≠ reflective evaluation. Pure experiential accounts cannot explain why we value truth about our lives *even if* deception feels identical.  
    - **Impact on Mainstream Theories:**  

  | **Theory**          | **Fares Against D1**                                     | **Verdict**                   |
  |----------------------|----------------------------------------------------------|-------------------------------|
  | **Hedonism**         | Collapses well-being to affect; cannot explain C1/C3     | ✘ **Eliminated**              |
  | **Desire-Fulfillment**| Can incorporate reflection (e.g., informed desires)      | △ Survives if refined         |
  | **Objective List**   | Easily accommodates reflection as a good/criterion       | ✓ **Compatible**              |

  ---

  ### **Summary of Unavoidable Commitments**
  An adequate theory **must**:
  1. Reject total simulation as flourishing (**C1**),
  2. Explain the welfare value of suffering-relief even when simulated (**C2**),
  3. Distinguish experiential states from reflective evaluation (**D1**),
  4. Account for hedonic adaptation/adaptive preferences (**E1, E2**).

  The **core tension** lies in explaining why *some* simulated states (suffering-relief) enhance welfare while others (pleasure/achievement) do not, without ad hocery. Hybrid theories (e.g., **authentic flourishing + experiential baseline**) or **asymmetric objective lists** (prioritizing real agency/relationships while permitting simulated pain-relief) best navigate these constraints. Pure theories invariably fail at least one non-negotiable desideratum.
