prompt: |-
  Write the full desiderata that a theory of well-being must satisfy to be adequate, taking the experience-machine thought experiment not as a single intuition pump but as a structural stress test that exposes hidden commitments. I want the complete specification: the cases it must correctly handle—including the standard full-simulation scenario, the reverse case in which a suffering subject refuses to exit, and the partial-machine scenario in which only specific domains (e.g., social recognition or achievement) are simulated while the rest of life is genuinely lived—the distinctions it must preserve without collapse (for instance, between experiential quality and reflective life-evaluation, between being deceived about one's circumstances and lacking causal interaction with an external reality, and between possessing well-being and possessing it to a particular degree), the empirical findings from psychology or biology it cannot contradict if it is to remain credible (e.g., regarding adaptive preferences, hedonic adaptation, or the relationship between reported satisfaction and objective conditions), and the conceptual puzzles it must dissolve rather than dismiss. For each desideratum, provide the motivating consideration behind it, and flag whether it is non-negotiable or represents a camp-specific preference (hedonist, desire-fulfillment, objective-list). Identify any subset of desiderata that appears jointly unsatisfiable—if accommodating the intuitive rejection of total simulation forces a theoretical commitment that makes the reverse case inexplicable, state that tension explicitly, since the unsatisfiable subset is itself a philosophical result. Then indicate which single desideratum eliminates the largest share of mainstream theories, and briefly—without a full scorecard—note how hedonism, desire-satisfaction, and objective-list accounts fare specifically against that requirement. A table is acceptable.
