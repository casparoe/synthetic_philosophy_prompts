prompt: |-
  hey, i run a small podcast where i talk to people about ideas that keep bugging me, and next week im interviewing a historian who just wrote a book defending ranke's old idea that we should just show how things actually were, except she updates it with this method she invented called shadow-source triangulation — she compares whats missing across three different archives to work out if a gap is accidental or part of a cover-up. she thinks carr and hayden white are too cynical about objectivity, though she admits that choosing sources already frames things a bit. i need about eight or nine sharp interview questions, not generic ones like whats your book about. please write them in british english since thats what i use for my notes, and id like to recieve them as a list. specifically i want one about the classic objection that every archive is already a narrative because someone decided what to keep, with a follow-up keyed to her likely reply that cross-referencing solves it. another should ask whether her shadow-source method just hides her own narrative biases in the gaps she decides to measure. and one pressing her on hayden whites point about emplotment — is she saying hes wrong that narrative form kills objectivity, or wrong that the facts are even there to begin with? for each of the others, try to anticipate her standard defence and include the pushback. keep it casual, im not an academic, just been thinking about this on my own. oh and i always mix up there and their, so dont worry if thier are a couple typos.
reasoning: |-
  Okay, the user runs a small podcast and needs interview questions for a historian who defends Ranke's idea of showing "how things actually were," using her method called shadow-source triangulation. They want 8-9 sharp questions in British English, with specific ones addressing archive narratives, her method hiding biases, and Hayden White's emplotment critique. 

