answer: |-
  Here are eight sharp, non-generic interview questions in British English, anticipating defences and including pushbacks as requested:

  1.  **The Archive-as-Narrative Problem:** You champion objectivity through archives, but critics say *every* archive is already a curated narrative – someone decided what to keep and what to bin. Doesn't that baked-in subjectivity poison the well for "wie es eigentlich gewesen" right from the start?
      *   *Anticipated Defence & Pushback:* If she argues cross-referencing multiple archives mitigates this, ask: **But if all three archives you use were curated by similar elites or institutions (say, colonial governments), couldn't their *shared* blind spots create unanimous "gaps" that actually reflect power structures, not accidental losses? Doesn't triangulation just confirm the dominant narrative's omissions?**

  2.  **Bias in the Gaps:** Your shadow-source method identifies deliberate cover-ups by analysing *which* things are missing across three archives. But isn't the historian's bias smuggled back in when *you* decide *which* specific gaps are significant enough to investigate? Doesn't choosing to measure the "absence of worker testimonies" versus the "absence of management expense reports" pre-select the story the gaps will tell?
      *   *Anticipated Defence & Pushback:* If she says the *pattern* of absence reveals intent, not her interpretation, ask: **But surely the initial focus – *which* potential absences you even think to look for – is driven by your own framework? How do you ensure you're not just finding the cover-ups you subconsciously expect or find ideologically convenient?**

  3.  **Hayden White's Emplotment Challenge:** Hayden White argued that the very act of crafting a historical *narrative* (choosing a plot structure – tragedy, romance, etc.) fundamentally shapes the "facts" and kills objectivity. Are you saying White is wrong that narrative form inherently distorts, *or* are you challenging his deeper point that there aren't even raw, unmediated "facts" out there waiting to be found before the historian shapes them?
      *   *(This forces her to engage directly with White's core arguments about narrative and the ontological status of facts).*

  4.  **The "Three Archive" Filter:** Your method relies on finding three *independent* archives. Doesn't this inherently privilege histories where multiple, well-preserved institutional records exist (state, military, corporate, church), potentially sidelining histories of marginalised groups who lacked the power or resources to create durable archives in the first place? Could shadow-source triangulation accidentally favour the perspectives of the powerful?
      *   *Anticipated Defence & Pushback:* If she says it can be adapted or used alongside other sources, ask: **But doesn't the *core mechanic* of comparing institutional archive gaps structurally bias the method towards uncovering the secrets *of institutions*, rather than, say, the suppressed histories of oral cultures or informal communities?**

  5.  **Carr's "Fish in the Net" Analogy:** E.H. Carr famously said the historian's facts are like fish swimming in the ocean; what you catch depends on the net you use and where you choose to fish. You seem to argue your method provides a better, more objective net. But isn't the choice to use the "shadow-source triangulation net," and to cast it into specific archival waters, *still* a subjective decision that determines which "facts" (or absences) you even encounter?
      *   *Anticipated Defence & Pushback:* If she argues her method yields more reliable *types* of facts (evidence of suppression), ask: **Doesn't Carr's point hold – that even this specific type of "fact" (a verified deliberate gap) is only visible *because* you chose this particular method? You're still selecting *which aspect* of the past becomes your focus.**

  6.  **Contemporary Relevance & "Fake News":** In an era drowning in misinformation and weaponised narratives, your defence of a more robust historical objectivity feels timely. But could your method also be vulnerable? If bad actors understand shadow-source triangulation, could they *plant* deliberate, detectable gaps across multiple sources to fabricate a "cover-up" narrative that suits them?
      *   *(This challenges the method's resilience and practical application in the modern context she likely wants to speak to).*

  7.  **Ranke Updated or Compromised?** You position your work as an *update* to Ranke's ideal of showing "how it actually was." But Ranke famously emphasised official state papers. Your method, by focusing on *absences* and potential cover-ups, seems inherently more sceptical and geared towards uncovering hidden truths – arguably closer to Carr's view that history is a dialogue with the past. Isn't this a fundamental shift *away* from Ranke's original, more positivist vision, despite using archives?
      *   *(This questions how much of Ranke she truly retains versus how much her method reflects a more critical, post-Ranke sensibility).*

  8.  **The Unspoken Choice:** You readily admit choosing sources frames the history. With shadow-source triangulation, a key choice seems to be *which three archives* to pit against each other. What's an example of a time where using a *different* trio of archives might have led your method to identify a *completely different* "deliberate gap" or even no significant cover-up at all? How do you guard against this?
      *   *(This pushes on the practical subjectivity involved in applying the method itself).*

  **Key Considerations for Delivery:**
  *   **Tone:** Keep it curious and conversational, not confrontational. Use phrases like "Help me understand..." or "I'm wrestling with...".
  *   **Flexibility:** Listen carefully to her answers. You don't *have* to use every pushback if her initial answer surprises you or covers it.
  *   **Flow:** You might start with Q1 or Q7 to establish her core thesis, then move into the critiques (Q2, Q3, Q4, Q5, Q8), and finish with Q6 on relevance.
  *   **Clarity:** Feel free to rephrase slightly for clarity on the day, keeping the core challenge intact.

  Good luck with the interview – sounds fascinating!
