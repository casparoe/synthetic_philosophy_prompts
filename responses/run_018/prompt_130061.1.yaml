  For the cases, diversity matters: one on religious confession (private repair), another on viral call-outs (exposure risk). In Question 3, I'll use a museum repatriation scenario to tease apart structural vs collapse views. The scoring should allow mixed patterns - real students won't fit neat boxes. 

  Key challenges: keeping options vivid yet ambiguity-free, and ensuring each leaf's "awkward commitment" surfaces naturally. That collapse position is especially delicate - need to show how it dismisses traditional frameworks without caricature. Maybe in the healthcare question, where guilt/shame distinctions feel clinically irrelevant. 

