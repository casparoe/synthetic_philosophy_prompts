  Right then. Let's get this sorted. Here are your opening remarks - five minutes of structural heavy lifting, British English, no bibliography, straight into the grit:

  ---

  **Opening Remarks: “Demarcation after the Instruments” Workshop**

  Good morning, everyone. Welcome. We’ve called you here today because something fundamental has shifted beneath our feet – the very machinery of scientific testing. And it forces us to ask an uncomfortable, perhaps even irritating, question: **Does falsification still *work* when the test itself costs a million pounds and lives inside a black box?**

  We all know the ideal. Science, distinct from dogma, because it risks being *wrong*. It’s not about proving theories true; it’s about crafting them so *fragile* that the world can break them. Popper’s genius was framing this as **bearing a specific kind of risk**. The risk isn't just intellectual – it’s reputational, financial, career-defining. You stake something valuable – time, grant money, credibility – on a prediction that *could*, *should*, be shown false by observation or experiment. If it survives? You live to hypothesise another day. If it fails? It costs you. You learn. You adapt. That cost, that vulnerability, *is* the demarcation line. It’s what stopped science being an echo chamber.

  But look at the landscape now.

  Our climate models are vast, intricate beasts, running on supercomputers most institutions can only dream of accessing. Our particle detectors are cathedrals of engineering, costing fortunes and requiring teams of hundreds. And increasingly, our predictions come not from human-readable equations, but from neural networks – complex algorithms trained on mountains of data. We feed them inputs, they give us outputs. We see the prediction… but the precise *path*? The internal logic? Often, it’s opaque. A black box.

  **So, the critical question for this workshop isn't just *can* we falsify? It's: *Who bears the risk? And is it still the same kind of risk?***

  1.  **The Cost of Falsification:** When testing a prediction requires a £1 million machine run by a specialist team, who can *afford* to risk being wrong? Is the individual scientist, or even the single lab, still bearing that burden? Or has the sheer capital cost socialised the risk while potentially insulating the proposer? Does the gatekeeper – the one holding the keys to the detector or the supercomputer – become the new arbiter, moving us closer to… authority?
  2.  **The Black Box Problem:** When an algorithm predicts an outcome, but we cannot fully trace *why* – cannot see the internal counterfactuals, the potential points of failure within its logic – what does falsification even mean? If the prediction fails, *what exactly* was falsified? The core theory? The training data? The algorithm’s architecture? The bug in the code? The risk becomes diffuse, ambiguous. It’s harder to learn the *specific* lesson failure should teach us. Does this ambiguity blunt the falsificationist scalpel?

  This isn't about declaring falsificationism dead. It’s about confronting whether the **nature of the risk** – that sharp, personal, costly stake in being proven wrong – is being fundamentally altered by our tools. Have our magnificent instruments, ironically, started to build walls around the testing ground? Are we moving towards a science where predictions are delivered, increasingly unchallengeable by the many, reliant on the authority of the machine or the institution that owns it?

  **Philosophers in the room:** You know the arguments aren't settled. We need your rigour to dissect this new structure of testing and risk.
  **Scientists, especially physicists and modellers:** You *live* this daily. Does this ring true? Does it feel different? Or is the core practice, the reliance on evidence, unchanged beneath the technological surface? We need your concrete reality check.

  Our task today isn’t to solve this. It’s to map it. To ask: In an age of instrument-mediated, algorithm-driven science, **how do we ensure the scientific process retains its essential vulnerability – its costly, democratic capacity to be proven wrong?**

  Let’s get to work.

  ---

  **Key structural work done:**

  1.  **Immediate Stakes:** Opens with the core tension (black box/expensive kit vs. falsification).
  2.  **Reframing Risk:** Explicitly defines falsification's core as bearing a *costly* risk (not just intellectual).
  3.  **Modern Challenge:** Directly links the two key modern factors (cost & opacity) to the *erosion* or *transformation* of that specific risk.
  4.  **The Authority Question:** Explicitly raises the spectre of science reverting to authority-based acceptance if risk/cost/access barriers are too high.
  5.  **Audience Address:** Acknowledges the likely starting positions of both groups (philosophers know it's messy, scientists might think it settled) and assigns them relevant roles in the discussion.
  6.  **Concrete Focus:** Uses specific examples (climate models, particle detectors, neural nets) relevant to the scientist cohort.
  7.  **Call to Action:** Sets a clear, achievable goal for the day – mapping the problem, not solving it.
  8.  **Avoids Bibliographies:** Focuses on the *idea* and its *structural implications* without diving into scholarship.

  This should land squarely, provoke thought, and frame the day's discussions without getting bogged down in theory or history. Good luck with the workshop!
