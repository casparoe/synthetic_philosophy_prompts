answer: |-
  Your diagnosis is fundamentally correct: the impasse arises from **conceptual and normative divergences** about what constitutes a complete explanation of competence, not empirical disagreements. Here's a structural breakdown:

  ### Core Tension: Functional vs. Normative Adequacy
  1. **Functionalist Camp**  
     - **Commitment:** Explanatory sufficiency requires *only* predictive/functional success.  
     - **Mechanism as Explanation:** Natural selection (NS) and algorithmic processing dissolve the need for "inner understanding" by showing how competence emerges from non-comprehending parts.  
     - **Key Equivalence:** A beak’s adaptive shape and a language model’s syntactic output are equally explained by selection pressures (NS) or optimization (backpropagation).  

  2. **Normativist Camp**  
     - **Commitment:** Explanatory sufficiency requires *semantic grounding*—states must bear normative properties (e.g., truth, correctness) accessible to the mechanism.  
     - **Representational Asymmetry:** Weights/embeddings in neural nets (NNs) are "representation-laden" (contentful states subject to error), while evolutionary mechanisms lack intrinsic representational content.  
     - **Diachronic vs. Synchronic:** Evolution’s competence arises from population-level error correction over time; NNs operate via token-level transitions in a single system, implying real-time accountability.  

  ### Why This Generates Stalemate
  - **Verbal? Partially:** Both use "competence," but functionalists mean *outcome reliability* (e.g., fitness), while normativists mean *content-sensitive correctness* (e.g., truth conditions).  
  - **Substantive? Yes:** The core disagreement is whether normativity (e.g., "oughts" of correctness) must be *internal to the mechanism*. Functionalists outsource normativity to external selection (evolution) or training data (AI); normativists demand intrinsic accountability.  
  - **Standards of Evidence? Divergent:**  
    - Functionalists accept predictive success (e.g., LLM outputs) as sufficient evidence.  
    - Normativists demand evidence that the system *tracks content* (e.g., representations with satisfaction conditions).  
  - **Relevant Data? Mismatched:**  
    - Functionalists cite parallels in *outcome* (e.g., both generate adaptive/fit solutions).  
    - Normativists cite distinctions in *process* (e.g., evolution has no "error signal" for semantic misrepresentation).  

  ### Hidden Formal Disagreement: Individuation of Representation
  The tension crystallizes around **what counts as a representational state**:  
  - Functionalists: Representations are patterns enabling system-relative prediction (e.g., embeddings as compression tools).  
  - Normativists: Representations require *content determinacy*—states must have correctness conditions *for the system itself* (e.g., a beaver’s dam-building isn’t "about" dams; NN activations "about" syntax might be).  
  This formalizes the normative gap: Can distributed processes (evolution) bear normativity? Functionalists say *no*—normativity is observer-relative. Normativists say *yes* for NNs (via architecture) but *no* for evolution.  

  ### Paths to Progress
  1. **Explicit Distinction:** Formalize **functional competence** (input-output reliability) vs. **normative competence** (content-governed performance). This clarifies that the camps answer different questions:  
     - *How is reliable competence possible without comprehension?* (Functionalists)  
     - *How can mechanisms be semantically accountable?* (Normativists)  

  2. **Formal Result on Representation:** Prove whether distributed systems (e.g., evolutionary processes) can satisfy criteria for intrinsic normativity under a teleosemantic theory. If not, the analogy fails for normativists.  

  3. **Reconstrual of Understanding:** Reject the "first-personal" intuition as the standard. Argue that **understanding is an explanatory myth**—competence is always substrate-independent, and "grasping" reduces to architectural constraints (e.g., attention mechanisms).  

  ### Conclusion
  The deadlock stems from irreconcilable **explanatory ideals**:  
  - Functionalists seek *mechanistic dissolution* of "mysteries" (e.g., Dennett’s "competence without comprehension").  
  - Normativists seek *preservation of agency-like accountability* (e.g., Searle’s "intrinsic intentionality").  
  No empirical breakthrough can resolve this, as it hinges on **what counts as a satisfying explanation**. Progress requires either:  
  - A formal account of normativity in non-biological systems, or  
  - Abandoning the intuition that understanding requires "inner grounding" beyond functional architecture.  

  The intuition of understanding *is* partly first-personal, but this need not halt progress—functionalists can argue that the intuition itself is an illusion generated by competence (e.g., metacognitive feedback in NNs).
