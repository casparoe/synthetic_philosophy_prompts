  I'm considering how each camp defines competence. The functionalist view sees competence as externally observable successful performance. The normative view requires that the system be "accountable" in some semantic sense - that its states can be correct/incorrect based on content. This difference in explanatory goals seems fundamental.

  The representational aspect is crucial too. When critics say neural networks have "representation-laden" mechanisms while evolution doesn't, this points to different views about what counts as representation. Functionalists might see representations as patterns enabling prediction, while normativists see them as requiring content that can be assessed.

