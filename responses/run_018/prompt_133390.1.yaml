answer: |-
  Here’s a tight, battle-tested session arc designed for your science-comm grads. Brain-dumped the knots upfront, then structured to preempt the predictable collisions. Casual as requested—typos intentional for vibe.

  **Three BIG Conceptual Knots in Neurath’s ISOTYPE Claim:**  
  1. **Non-Propositional Representation:** How can pictures *assert facts* without subject-predicate structure? (No "S is P" syntax → no room for "is" misinterpretations).  
  2. **Metaphysics Avoidance:** Pictures lack "grammatical hooks" (e.g., "exists," "causes") that let pseudo-problems creep into language. But does this *solve* metaphysics or just *ignore* it?  
  3. **Physicalism as Anchor:** ISOTYPE isn’t "neutral"—it’s *rooted in spatiotemporal physical facts*. Pictorial unity replaces logical form.  

  **Session Arc (50 mins total):**  
  *(Dependency: Establish "assertion ≠ syntax" FIRST. Start with coordination, not truth.)*  

  **0-12 mins: Syntax-Free Coordination ≠ Propositional Assertion**  
  - **Hook:** Show two ISOTYPE mortality figures (e.g., **1930 UK vs. India child deaths**—stick-figure rows scaled to population). Ask: "What’s communicated? How did you *coordinate* with this without words?"  
  - **Key Point:** Humans synchronize behavior/understanding via visual patterns *before* formal logic (e.g., pointing, maps). Neurath: Science starts here—*not* with "S is P."  
  - *Pivot:* "This isn’t *saying* ‘UK mortality is lower’—it’s *showing a physical configuration* we interpret through action."  

  **12-22 mins: Core Example—WHY Mortality Works, Weather/Chem Fails**  
  - **Mortality ISOTYPE:** Works because it depicts **directly measurable physical aggregates** (dead bodies counted). Aligns with Neurath’s "protocol sentences" (observation statements). No theory—just bodies in space/time.  
  - **Weather Map FAILS:** Shows *inferred entities* (isobars = pressure gradients ≠ physical objects). Invokes theory (fluid dynamics). *Grammatical hook:* "Low pressure *causes* rain."  
  - **Chemistry Diagram FAILS:** Atoms/electron shells = **unobservable theoretical constructs**. Syntax-heavy (bonds = predicates).  
  - *Check:* "Why would Neurath say mortality stats are ‘physicalist’ but cloud symbols aren’t?"  

  **Misconception Takedowns & Timing:**  
  1. **"Just Fancy Infographics" (Hits ~15 min)**  
     - *When:* Right after mortality example.  
     - *Pivot:* "Infographics *use* pictures to illustrate propositions. ISOTYPE *replaces* propositions with pictorial *facts*. What’s the operational difference?" → Highlight physicalism: "ISOTYPE mortality = *counting corpses*. Infographic = ‘disease *causes* death’."  

  2. **"Wittgenstein Already Did This" (Hits ~30 min)**  
     - *When:* After explaining metaphysics avoidance.  
     - *Pivot:* "Tractatus pictures share *logical form* with reality. Neurath pictures *are physical reality’s artifacts*. Wittgenstein’s ‘form’ is metaphysical; Neurath’s icons are *tools for socialist planning*." (Drop the mic: "Wittgenstein cares about the *structure of possibility*; Neurath cares about *counting potatoes*.")  

  3. **"No Syntax = No Falsifiability" (Hits ~40 min)**  
     - *When:* During Q&A or when summarizing.  
     - *Pivot:* "Falsifiability hooks to *protocol sentences* (e.g., ‘On date X, at location Y, we counted Z bodies’). ISOTYPE is *literally* those sentences in visual form. Syntax isn’t necessary—*empirical discord* is (e.g., new body count doesn’t fit the pattern)."  

  **Protocol Sentence Debate Sidestep:**  
  - At ~25 mins, flag: "Neurath vs. Carnap on whether protocols need *linguistic* grounding is a rabbit hole. Just know: Neurath’s pictures *are* the protocols. Deeper layer—we skip!" (Wave hands, move on.)  

  **Final Check-for-Understanding (Min 48):**  
  - **Question:** *"You see a chart of COVID deaths using ISOTYPE-style icons. How could you tweak it to become (a) a Tractatus ‘picture’, (b) decorative art with no assertion, or (c) Neurath’s ‘statement’?"*  
  - **Key Distinction:**  
    - (a) Tractatus: Add logical operators (e.g., arrows "IF masks THEN ↓ deaths").  
    - (b) Decorative: Make icons aesthetic/abstract (e.g., stylized skulls ≠ scaled counts).  
    - (c) Neurath: Must show **physical aggregates** (icon rows = actual bodies counted) with **no causal/ theoretical labels**.  

  **Supplies:** Print the mortality ISOTYPE. Doodle weather/chem diagrams on whiteboard. Keep it tactile.  

  You got this—go make physicalists of them. And hide the whiteboard markers when you mention Wittgenstein. They *will* try to draw truth tables.
