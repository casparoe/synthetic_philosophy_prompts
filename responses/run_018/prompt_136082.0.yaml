answer: |-
  Your challenge conflates two distinct norms: the *authority* generated by communal moral practices versus the *relational standing* required to invoke that authority against specific others. Yes, two dishonest strangers retain standing to blame each other precisely because the legitimacy of reciprocal correction doesn't demand saintliness—it demands that neither has *preemptively weaponized* the norm against the other by exempting themselves from its reciprocal application. Shared vice may render their blame ineffective or invite charges of general inconsistency, but it doesn't structurally invalidate their standing as participants in mutual accountability. Standing is relational because moral address isn't a detached arbitration but a dialogic practice: when you silence my challenge to your dishonesty yesterday while demanding I heed your identical challenge today, you corrupt the symmetry that makes blame something other than coercion. My account avoids smuggling moral equality by showing why a *reformed* liar gains standing to blame a persistent one (no asymmetry), while your "shared vice" objection mistakenly resurrects the very detached ledger-keeping I reject—confusing blamers' credibility with their right to initiate the dialogue at all. The relational asymmetry does unique work: explaining why *selective* hypocrisy (not universal vice) nullifies standing even when the hypocrite's moral record is otherwise superior to the blamee's.
