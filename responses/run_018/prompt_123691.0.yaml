answer: |-
  **Quine rejects moral ontology primarily because moral predicates are eliminable during regimentation and lack indispensability to science, with deeper issues arising from their non-referential nature and failure to denote objective properties.**  

  1.  **Regimentation Eliminates Moral Terms**: Quine's canonical notation requires predicates to refer to objective, scientifically tractable properties. "X is good" cannot be regimented as a primitive predicate denoting a real property. Instead, it *must* be paraphrased into non-moral terms (e.g., "X is approved by society S" or "Speaker Y desires X"). This translation exposes that "good" doesn't pick out a feature of the world itself but expresses subjective attitudes or cultural practices. Moral terms are thus *syntactically eliminable* during logical regimentation.

  2.  **Indispensability is the Ultimate Criterion**: Even if a moral predicate somehow resisted elimination in a specific regimentation (e.g., a stubborn "is-good(x)"), Quine would still deny it ontological status because it is *dispensable to our best scientific theories*. Physics, biology, etc., explain the world without referencing "goodness" as an objective property. Mathematics, conversely, is indispensable for formulating those very theories (e.g., quantifying over numbers in physics). Ontology is grounded solely in science's needs.

  3.  **Deeper Issue: Referential Opacity and Non-Cognitivism**: The inability to regiment "good" as a primitive predicate points to a deeper problem: moral language likely *lacks genuine referential function*. Quine views it as expressive, prescriptive, or projective rather than descriptive of mind-independent facts. Unlike mathematical terms ("set," "number") which robustly refer within scientific discourse, moral terms resist mapping onto determinate, intersubjectively verifiable entities or properties in the natural world. Their meaning is tied to variable human responses, not objective states.

  4.  **Surviving Regimentation Doesn't Threaten Anti-Realism**: Even if a formal system included "good" as an unanalyzed predicate (perhaps for pragmatic reasons outside science), Quine would *not* grant it ontological weight. His realism requires indispensability *within our total scientific theory of the world*. A merely syntactic survival in a non-scientific language fragment doesn't confer existence. His anti-realism relies on this combined argument: eliminability *shows* the non-referential nature, and dispensability *confirms* the lack of scientific necessity.
