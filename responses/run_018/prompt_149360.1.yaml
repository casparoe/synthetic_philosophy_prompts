  my half-formed angle: instead of asking what pleasures feel like, treat pleasure like a software interface - different implementations (sensory, intellectual, aesthetic) that might share a functional contract (approach motivation, reinforcement learning signal, something like that). but then the question becomes whether hedonism is really about that contract, and if the contract is too thin to do normative work.

