prompt: |-
  In a quantum foundations seminar last week someone waved away teh PBR result by saying "the wavefunction is just information, not reality." I'm trying to figure out exaclty what work that sentence was doing. Can you lay out the different precise claims it could be making — e.g. Shannon-information about preparation procedures, a Bayesian credence, a Spekkens-style epistemic restriction over hidden variables, or just a refusal of metaphysical commitment — and for each say whether it's trivial, whether it's actually incompatible with psi-ontic models, and whether it survives the PBR argument? Don't just catalog them; take a committed position on which reading is strongest, which ones are empty, and which one actually supports dismissing PBR. End with \answer{...} giving the single reading you'd defend.
reasoning: |-
  Okay, the user is asking about the statement "the wavefunction is just information, not reality" in response to the PBR theorem. I need to unpack what this means and how it relates to PBR. The user wants me to analyze different interpretations of that statement, like Shannon information, Bayesian credences, Spekkens-style models, and metaphysical refusal. Then I should evaluate each for triviality, compatibility with psi-ontic models, and survival against PBR. Finally, I should pick one to defend.

  First, recall what the PBR theorem does. It shows that if two quantum states are prepared independently and are ontologically distinct, they can't overlap completely in their ontic states. This challenges epistemic views where the wavefunction is just knowledge about an underlying reality. So, if someone waves away PBR by saying the wavefunction is "just information," they're probably endorsing an epistemic view. But I need to break down what "information" means here.

  Starting with Shannon information about preparation. This would mean the wavefunction encodes data about how the system was prepared. But PBR doesn't target this directly; it's about the underlying ontic states. So this interpretation might dodge PBR but feels weak because it avoids the ontological question. It's trivially true but not addressing the reality of the wavefunction.

  Next, Bayesian credence. Here, the wavefunction represents subjective beliefs. But PBR assumes a preparation-independent ontology, which clashes with subjective Bayesianism. If the wavefunction is just belief, then two agents could assign different wavefunctions to the same reality. PBR's argument requires that the ontic state is the same regardless of preparation, which a subjective view might reject. So this could survive PBR by denying its assumptions, but it might lead to solipsism, which is problematic.

  Then there's Spekkens-style epistemic restriction. Models like this have underlying hidden variables with restrictions on knowledge. The toy model in Spekkens has epistemic states that overlap. PBR specifically targets such models by showing that independent preparations can lead to a contradiction if the ontic supports both states. Spekkens' model avoids this by not being a full quantum theory, but PBR applies to any model claiming to reproduce quantum mechanics. So Spekkens-style models are directly challenged by PBR unless they incorporate quantum features like non-orthogonality properly.

  The fourth interpretation is metaphysical non-commitment. Saying the wavefunction is "just information" as a way to avoid saying anything about reality. This is trivial and doesn't engage with PBR. It's an empty statement that doesn't contribute to the discussion.

  Now, which interpretation best dismisses PBR? The Bayesian subjective view might work by rejecting PBR's objectivity assumption. But it's philosophically heavy. Spekkens-style models are directly targeted by PBR, so they don't survive easily. The strongest defense is probably the Bayesian one, but it has its own issues. The user wants a committed position, so I'll go with that as the most viable, though not without problems.

  Finally, the answer should be that the Bayesian credence reading is the strongest for dismissing PBR, as it challenges the theorem's assumptions directly.
answer: |-
  The statement "the wavefunction is just information, not reality" is a common epistemic view dismissal of PBR (Pusey-Barrett-Rudolph theorem). PBR establishes that, under specific assumptions (most critically, "preparation independence"), quantum states cannot be interpreted *merely* as representing ignorance about an underlying physical reality (ontic state) shared by multiple quantum states. The theorem shows that if two pure quantum states are distinct, their corresponding probability distributions over ontic states must be non-overlapping. This directly challenges epistemic interpretations where distinct wavefunctions could represent incomplete knowledge about the *same* underlying physical state.

  Here's a breakdown of possible precise interpretations of "just information," analyzed for triviality, compatibility with psi-ontic models, survival against PBR, and overall strength:

  1.  **Shannon Information about Preparation Procedures:**
      *   **Claim:** The wavefunction encodes objective, classical information *about how the system was prepared*. It specifies which procedure was used (e.g., "prepared by polarizer at 0°").
      *   **Trivial?** Yes, largely trivial. Everyone agrees the wavefunction is *associated* with preparation procedures. This doesn't address *why* that procedure leads to specific statistics or *what* the physical state of the system is.
      *   **Compatible with Psi-Ontic?** Yes. This is compatible with both psi-ontic (the wavefunction directly represents physical reality) and psi-epistemic (the wavefunction represents incomplete knowledge) views. Knowing the preparation procedure is necessary but insufficient to determine ontological status.
      *   **Survives PBR?** Trivially avoids PBR. PBR targets the relationship between the wavefunction and the *ontic state*, not the wavefunction's link to preparation. This interpretation simply refuses to engage with the question PBR addresses. It's a dodge, not a rebuttal.
      *   **Strength:** Weak and empty. It reduces the wavefunction to a label, ignoring its predictive power and the structure of quantum probabilities. It doesn't justify dismissing PBR.

  2.  **Bayesian Credence (Subjective Belief):**
      *   **Claim:** The wavefunction represents an agent's *subjective degree of belief* about the outcomes of future measurements. It is not a property of the system itself, but of the agent's state of knowledge.
      *   **Trivial?** No, this is a substantive (and controversial) interpretation (QBism is the primary example).
      *   **Compatible with Psi-Ontic?** Incompatible. This is fundamentally psi-epistemic. The "ontic state" (whatever the system *actually is*) exists independently, but the wavefunction only describes an agent's expectations.
      *   **Survives PBR?** Can potentially survive by rejecting PBR's core assumptions. PBR assumes an objective, preparation-independent ontic state λ. A subjective Bayesian denies this objectivity; the "ontic state" relevant to an agent *depends* on their knowledge/belief state. Agents assigning different wavefunctions to the same preparation aren't making claims about an agent-independent λ. PBR's argument that independent preparations force a contradiction relies on λ being objective and preparation-independent. Subjectivists reject this premise.
      *   **Strength:** Strongest candidate for *effectively dismissing PBR within its own framework*. It fundamentally rejects the ontological objectivity PBR assumes. However, its strength is also its weakness: it leads to a radical solipsism where the wavefunction isn't "out there" at all, making intersubjective agreement about quantum phenomena mysterious. This is philosophically heavy and unsatisfying to many.

  3.  **Spekkens-Style Epistemic Restriction over Hidden Variables:**
      *   **Claim:** The wavefunction represents an agent's *incomplete knowledge* about an underlying *ontic state* λ (hidden variables), governed by a fundamental *epistemic restriction* (e.g., knowledge balance principle) that prevents complete specification of λ, even in principle.
      *   **Trivial?** No, this is a substantive psi-epistemic model framework.
      *   **Compatible with Psi-Ontic?** Incompatible. This is explicitly psi-epistemic. The wavefunction is epistemic, λ is ontic.
      *   **Survives PBR?** Directly targeted and killed by PBR. Spekkens' toy model itself exhibits the overlapping distributions PBR forbids. PBR proves that *any* model reproducing quantum predictions *cannot* have overlapping distributions for distinct pure states if it satisfies preparation independence. Spekkens-style models aiming for full quantum equivalence *must* violate preparation independence (e.g., by having global constraints linking the hidden variables of independently prepared systems) to survive PBR. This drastically alters their nature and undermines their initial motivation as "local" epistemic models.
      *   **Strength:** Weak against PBR. While the *idea* of epistemic restrictions is appealing, PBR shows that implementing them for full QM while respecting seemingly natural independence assumptions is impossible. Dismissing PBR with this claim ignores the theorem's force.

  4.  **Refusal of Metaphysical Commitment (Instrumentalism/Quietism):**
      *   **Claim:** The wavefunction is a calculational tool for predicting measurement outcomes. Questions about its "reality" are meaningless or unanswerable. "Information" here just means it's useful for calculation, not a statement about ontology.
      *   **Trivial?** Yes, in a philosophical sense. It avoids making any ontological claim whatsoever.
      *   **Compatible with Psi-Ontic?** Agnostic. It refuses to engage with the question. It's compatible with the wavefunction *corresponding* to reality (if the calculations work) but denies the meaningfulness of asserting it *is* reality.
      *   **Survives PBR?** Trivially avoids PBR. PBR makes a claim about ontological models; instrumentalism declares ontological questions irrelevant. It dismisses PBR by dismissing the entire debate.
      *   **Strength:** Empty. It provides no understanding, only a pragmatic shrug. It doesn't engage with the content or implications of PBR, offering no counter-argument, just a refusal to play the game. This is unsatisfying in a foundations seminar.

  **Committed Position:**

  *   **Strongest Reading for Dismissing PBR:** The **Bayesian Credence (Subjective Belief)** reading (2). It directly challenges PBR's foundational assumption of an objective, agent-independent ontic state λ underlying preparations. By making the wavefunction fundamentally subjective, it sidesteps the contradiction PBR derives, which relies on λ being the same object for different agents/assignments. While philosophically radical, this is the only interpretation that coherently *argues against* PBR's conclusion within the domain of ontological models.
  *   **Emptiest Reading:** The **Refusal of Metaphysical Commitment** (4). It offers nothing but a conversation-ender, providing no insight into quantum theory or the PBR argument. The **Shannon Information** reading (1) is similarly empty in this context.
  *   **Reading Most Damaged by PBR:** The **Spekkens-Style Epistemic Restriction** reading (3). PBR specifically demolishes the possibility of such models adhering to preparation independence while reproducing quantum predictions. It forces them into non-local or conspiratorial contortions.
  *   **Reading that Actually Supports Dismissing PBR:** Only the **Bayesian Credence** reading provides a coherent foundation for dismissing PBR's relevance, by rejecting the objectivity PBR assumes. The others either ignore PBR's target (1, 4) or are directly refuted by it (3).

  **Conclusion:**

  The dismissive statement "the wavefunction is just information, not reality" is most plausibly and effectively interpreted as endorsing a **subjective Bayesian (e.g., QBist) perspective** in the context of countering PBR. This view survives PBR by rejecting its core premise of an objective ontic state, rendering the theorem inapplicable to its conception of the wavefunction. While other interpretations exist, they either fail to engage meaningfully with PBR or are directly undermined by it. The Bayesian defense, however, comes at the cost of embracing a highly subjective ontology, which many find deeply problematic. It's the *only* interpretation that offers a substantive, albeit controversial, rebuttal.

  \answer{Bayesian Credence (Subjective Belief)}
