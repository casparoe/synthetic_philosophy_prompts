  ### Scenario
  A ten-member academic committee sequentially reviews two research proposals, A and B, for a grant. Each proposal has an unknown innate quality (high or low), equally likely a priori (P(high) = 0.5). Committee members receive private signals about innate quality (reliability = 0.7), but unbeknownst to them, a proposal only becomes feasible (and thus reveals observable outcomes) if it receives at least six votes. The first two members receive misleading signals favoring A (innately low) and approve it. The third member, seeing two approvals for A and having a private signal for B, still approves A due to a posterior probability of 0.7 for A being high. Subsequent members, observing at least two A-approvals and knowing later votes are uninformative, all approve A regardless of signals. A receives ten votes, becomes feasible, and succeeds, while B (innately high) receives no votes, remains infeasible, and leaves no observable trace. In the counterfactual where members vote solely based on private signals (two for A, eight for B), B receives eight votes, becomes feasible, and succeeds, yielding a better outcome as the innately superior proposal is realized.

  ### Step-by-Step Walkthrough
  - **Agent 1**: Observes no history. Signal: A. Posterior: P(A high) = 0.7. Action: Approves A.
  - **Agent 2**: Observes one A-approval. Infers Agent 1’s signal was A. Signal: A. Posterior: P(A high) = (0.7×0.7×0.5)/(0.7×0.7×0.5 + 0.3×0.3×0.5) ≈ 0.845. Action: Approves A.
  - **Agent 3**: Observes two A-approvals. Infers two signals for A. Signal: B. Posterior: P(A high) = (0.7²×0.3×0.5)/(0.7²×0.3×0.5 + 0.3²×0.7×0.5) = 0.7. Action: Approves A (cascade begins; signal ignored).
  - **Agents 4–10**: Observe ≥2 A-approvals. Infer two signals for A. Posterior: P(A high) = 0.7 regardless of signal. Action: All approve A (signals powerless).

  **Cascade onset**: Step 3. Justification: From Agent 3 onward, no private signal changes the action, as the posterior (0.7) always favors A.

  ### Verdicts for Rival Diagnoses
  - **(a) Blame the agents (irrational/conformist)**: Prescribes training to resist conformity or penalties for herding. Fits observed unanimity but fails here: Agents maximize expected accuracy (e.g., Agent 3’s posterior = 0.7 > 0.5). Remedy ineffective.
  - **(b) Blame the structure (rational but information-destructive)**: Prescribes hiding others’ votes or using simultaneous voting. Fits observed information loss and corrects the outcome by aggregating signals (B wins 8–2). Remedy works but sacrifices efficiency of sequential review.
  - **Mandatory disclosure**: Revealing all signals before voting. Does *not* fix the case: Signals show two for A, eight for B. Posterior for B being high ≈ 0.997, so all approve B. B becomes feasible and succeeds, *correcting* the outcome. However, disclosure is impractical here due to confidentiality in grant reviews (cost: undermines candid assessments).
  - **Alternative remedy**: Reveal the feasibility rule (requires ≥6 votes). Agents coordinate on the option with higher posterior (B), which succeeds. Cost: Distorts incentives if agents vote strategically rather than sincerely.

  ### Load-Bearing Feature and Ablation
  - **Feature**: Feasibility depends on votes (success is endogenous and unobservable unless chosen).
  - **Ablation**: Remove feasibility dependency; success depends only on innate quality. Cascade on A (innately low) breaks when A inevitably fails (e.g., after implementation). Observing failure, later agents update toward B, restoring fragility.

  ### Strongest Attack and Reply
  - **Attack**: This is not an informational cascade but a coordination problem with an endogenous state. Cascades concern fixed states; here, quality depends on actions, placing it outside the claim’s scope.
  - **Reply**: Concede the state is endogenous but argue agents *believe* they track a fixed innate quality (their epistemic model ignores feasibility). Rational herding occurs under this belief. Concession: Standard cascade models assume fixed states, so this extends their application.

  ### What the Case Cannot Show
  The case cannot show that *all* cascades are robust, that agents with correct beliefs would herd, or that self-correction fails absent endogenous feasibility.

