prompt: |-
  I'm in a formal epistemology seminar, and we're examining how rational belief should revise when an agent learns that a conditional claim is unreliable or false rather than learning its antecedent directly. Before I evaluate the proposed fixes, I want the full specification of what any adequate theory of conditional belief updating must actually deliver. Give me the desiderata: the specific revision patterns it must license—including cases where the antecedent's credence should hold steady, fall, or even rise after conditioning on the conditional's failure—the distinctions it must preserve (between rejecting the conditional, accepting its negation, and discovering the antecedent is false), and the formal constraints it must observe (coherence with the probability calculus and consistency with Jeffrey conditioning). Include the standard red-or-blue-company scenario and a less-discussed variant where the agent is uncertain about the reliability of the source reporting the conditional, not merely about the conditional itself. For each desideratum, explain why it counts as a requirement rather than a preference. Then flag which are genuinely non-negotiable and which are artifacts of particular frameworks like unrestricted Bayesian updating or Stalnaker-style constraints. Separate what is settled in the specialist literature from what remains genuinely contested—especially on whether any version of the Stalnaker thesis can survive in modified form—and do not present a contested view as the consensus. Briefly note how Jeffrey conditioning and a restricted Stalnaker-style view fare against the list, but keep the weight on the criteria themselves.
reasoning: |-
  Okay, the user is in a formal epistemology seminar focusing on how rational belief should update when learning that a conditional is unreliable or false, rather than learning the antecedent directly. They need a comprehensive list of desiderata for any adequate theory of conditional belief updating. 

  First, I need to recall the key challenges here. The standard Bayesian update doesn't handle conditional learning well because conditionals aren't standard propositions. The user mentioned the red-or-blue-company scenario, which is a classic case where learning that a conditional is false affects the antecedent's probability. I should make sure to include that and also their request for a variant with source reliability uncertainty.

  The user wants clear distinctions between rejecting the conditional, accepting its negation, and discovering the antecedent is false. These are crucial because conflating them leads to irrational updates. For example, learning "not (if A then C)" is different from learning "not C given A" or just "not A". 

  They also emphasized formal constraints like coherence with probability calculus and consistency with Jeffrey conditioning. Probability axioms are non-negotiable, but Jeffrey conditioning might be more flexible depending on the framework. The Stalnaker thesis is contentious here—some think it's salvageable in modified forms, others don't. I need to present this as contested without implying consensus.

  For desiderata, I'll start with coherence since probability theory violations are universally unacceptable. Then, antecedent credence shifts: cases where it should hold steady, fall, or rise. The red-or-blue scenario shows it should fall, but I need other examples for rise and steady cases. The source reliability variant adds nuance—when the source is unreliable, the antecedent might stay put or even increase if the conditional was misleading.

  Distinguishing "reject conditional," "accept negated conditional," and "learn antecedent false" is critical. These often get confused but represent distinct epistemic actions. The user probably wants this highlighted because their seminar is examining how existing theories fail these distinctions.

  I should note which desiderata are non-negotiable (like coherence) versus framework-dependent (like strict Stalnaker constraints). Jeffrey conditioning handles some cases well but struggles with learning conditional falsity directly. Stalnaker-style views have elegant antecedent shifts but crash into triviality results without modifications.

  The user is likely preparing to evaluate proposed fixes, so they need a solid baseline. They might be frustrated with oversimplified treatments in literature. I'll flag genuinely contested areas, like whether modified Stalnaker theses can work—no false consensus implied. 

  Finally, I'll structure each desideratum with a "why requirement" section to preempt "why is this necessary?" pushback. The red-or-blue and source variants will serve as concrete test cases throughout.
answer: |-
  Here are the core desiderata for a theory of conditional belief revision upon learning a conditional is unreliable or false, structured by category, with justification, negotiability status, and contested areas highlighted. The focus is on *what* must be delivered and *why*, with minimal theoretical prescription.

  **I. Foundational Constraints (Non-Negotiable)**

  1.  **Probabilistic Coherence:**
      *   **Requirement:** Posterior beliefs must satisfy the axioms of probability theory.
      *   **Why Requirement:** Violating coherence guarantees irrationality (e.g., Dutch books, inconsistent reasoning). This is foundational to any quantitative model of rational belief.
      *   **Negotiability:** Non-negotiable. Any proposed update rule violating coherence is invalid.

  2.  **Consistency with Jeffrey Conditioning (Generalized Updating):**
      *   **Requirement:** The update mechanism must be a special case or generalization consistent with the framework of Jeffrey conditioning when learning involves a direct redistribution of credence over a partition (e.g., learning the conditional is false/unreliable).
      *   **Why Requirement:** Jeffrey conditioning is the gold standard for belief revision under uncertain evidence *when the evidence proposition is well-defined*. Learning a conditional is unreliable/false is often such uncertain evidence. A theory incompatible with this generalized framework risks ad hocness or inability to handle partial confidence shifts.
      *   **Negotiability:** Highly non-negotiable for frameworks accepting Jeffrey's insight. It *is* negotiable only for theories that fundamentally reject Jeffrey's model of uncertain evidence (a minority view).

  **II. Essential Distinctions (Core Requirements)**

  3.  **Distinction: Rejecting the Conditional vs. Accepting its Negation:**
      *   **Requirement:** The update must yield different posterior belief states for:
          *   (a) Learning *that the conditional "If A, then C" is false* (i.e., learning ¬(A ⊃ C), often interpreted as learning A ∧ ¬C).
          *   (b) Learning *to reject the conditional* (i.e., reducing confidence in "If A, then C" to near 0, *without* necessarily being certain A ∧ ¬C is true).
      *   **Why Requirement:** (a) Provides maximal specific information (A & not-C happened). (b) Only conveys that the agent no longer expects C given A; it leaves open whether A is false, C is true despite A, or A ∧ ¬C is true. Conflating these leads to catastrophic misrepresentation of the evidence. Learning the conditional is *unreliable* falls squarely under (b).
      *   **Negotiability:** Non-negotiable. Failure here means the theory cannot represent the actual content of the learned evidence.

  4.  **Distinction: Rejecting the Conditional vs. Learning the Antecedent is False:**
      *   **Requirement:** The update must yield different posterior belief states for:
          *   (a) Learning *to reject the conditional* "If A, then C".
          *   (b) Learning *that A is false* (¬A).
      *   **Why Requirement:** Learning ¬A definitively rules out A. Rejecting "If A, then C" *does not* rule out A; it only rules out the *connection* between A and C. A theory collapsing these would imply that doubting a conditional entails doubting its antecedent, which is demonstrably irrational (e.g., I doubt "If it rains, the streets get wet" because I suspect covered streets; I don't thereby doubt that it *will* rain).
      *   **Negotiability:** Non-negotiable. Failure indicates the theory misconstrues the logical/epistemic relationship between conditionals and their antecedents.

  **III. Essential Revision Patterns (Core Requirements)**

  5.  **Antecedent Credence Shift - The Core Challenge:**
      *   **Requirement:** The theory must allow credence in the antecedent (A) to rationally **increase, decrease, or remain unchanged** after learning the conditional "If A, then C" is false or unreliable, depending on the background beliefs. Crucially, it must license the *decrease* case.
      *   **Why Requirement:** Rationality does not dictate a single direction for the shift; it depends on *why* the conditional was rejected. Crucially, the **Red-or-Blue Company (RoBC) Scenario** demonstrates the necessity of the *decrease*:
          *   *RoBC Setup:* You believe an employee works for Red (R) or Blue (B) company. You believe:
              *   P(R) = P(B) = 0.5
              *   If Red, then Republican (If R, then P). P(P | R) ≈ 1.
              *   If Blue, then Democrat (If B, then D). P(D | B) ≈ 1.
              *   P(P) ≈ P(D) ≈ 0.5.
          *   *Learning:* You learn the conditional "If Red, then Republican" is *unreliable/false*. (Interpretation: Learning that Red employees are *not* reliably Republican).
          *   *Required Shift:* P(R) must **decrease**. Why? The only support for P(R)=0.5 came from the symmetry between the two conditionals. Undermining the R→P conditional breaks this symmetry. If R employees aren't reliably Republican, but B employees *are* reliably Democrat, it becomes more likely the employee is from B (Democrat) than R (who might be Democrat *or* Republican). P(R) < 0.5 post-update.
      *   *Variant: Uncertain Source Reliability:*
          *   **Requirement:** The theory must handle cases where the evidence is not directly "¬(A⊃C)" or "P(If A, then C)≈0", but "The source reporting 'If A, then C' is unreliable". This introduces an extra layer of uncertainty about *why* the conditional might be false.
          *   **Why Requirement:** This reflects a common real-world learning scenario (e.g., hearing a weather forecaster has a bad track record). It tests if the theory can separate doubt about the source from direct doubt about the conditional content. Shifts in P(A) should depend on the agent's beliefs about *how* the source could be wrong (e.g., is the source unreliable on A, on C|A, or both?).
          *   **Example Shift (Possible):** If the agent strongly believes the source is reliable about A but potentially unreliable about C given A, learning the source is unreliable might leave P(A) relatively unchanged while drastically lowering P(C | A). If the agent suspects the source might be wrong about A itself, P(A) could decrease.
      *   **Negotiability:** Licensing the *decrease* (RoBC) is non-negotiable; failure here means the theory cannot handle paradigmatic cases. Licensing *increase/steady* cases is also a requirement, as these are rationally possible in other scenarios (e.g., rejecting "If A then C" because A is false and C is unlikely anyway might leave P(A) steady; rejecting it because A strongly implies ¬C might *increase* P(A) slightly if P(C) was high). The *ability* to produce all shifts is key.

  **IV. Theoretical Coherence & Controversy**

  6.  **Compatibility with Triviality Results:**
      *   **Requirement:** The theory must not fall prey to known triviality results (Lewis, Hájek) that show the unconditional probability of a conditional P(If A, then C) cannot *generally* equal P(C | A) (the Simple Stalnaker Thesis - SST) within a standard probabilistic framework without collapsing logic or making conditionals non-propositional.
      *   **Why Requirement:** Violating known mathematical constraints is fatal.
      *   **Negotiability:** Non-negotiable. Any theory assuming SST unconditionally is doomed.
      *   **Contested Area:** Whether *restricted* versions of the Stalnaker Thesis (e.g., applying SST only within specific contexts, partitions, or using imaging) can avoid triviality and form a viable basis for a revision theory **remains genuinely contested**. Proponents argue modified versions work; critics argue the modifications are ad hoc or don't fully solve the problem. **There is no consensus.**

  **V. Framework-Specific Artifacts (Negotiable)**

  7.  **Stalnaker/Imaging Constraints (Potentially Artifactual):**
      *   **Content:** Requirements like "the posterior must be generated by imaging on the nearest ¬(A ⊃ C)-world" or strong adherence to a specific possible-worlds semantics for conditionals.
      *   **Why Artifactual:** While Stalnaker-style views offer one *way* to achieve the required shifts (especially in RoBC), they are not the only possible formal implementation. Insisting on them as a *requirement* assumes the truth-conditional semantics they are based on. Other successful approaches (e.g., fully probabilistic within a Jeffrey framework, or using conditional events) might not use imaging.
      *   **Negotiability:** Negotiable. These are requirements *within specific theoretical frameworks* (Stalnaker/imaging-based views), not requirements *for any adequate theory*.

  **How Leading Approaches Fare (Briefly):**

  *   **Jeffrey Conditioning + Conditional as Conditional Probability (Non-propositional):**
      *   **Strengths:** Naturally handles **Distinctions 3 & 4** (learning ¬(A⊃C) vs. lowering P(If A, C) vs. learning ¬A are fundamentally different inputs). Easily satisfies **Coherence (1)** and **Jeffrey Consistency (2)**. Can readily model **Uncertain Source Reliability**. Satisfies **Triviality Avoidance (6)** by denying conditionals have standard probabilities.
      *   **Challenge:** Modeling the *content* of learning "The conditional is unreliable/false" (Desideratum **3b, 5**) is less direct. It requires specifying how this evidence redistributes credence over the relevant partition (e.g., over A∧C, A∧¬C, ¬A). The RoBC shift (**5**) *can* be achieved, but requires careful modeling of the evidence's impact on the partition. The shift isn't automatic from a simple rule.
  *   **Restricted Stalnaker/Imaging Views (Propositional Conditional):**
      *   **Strengths:** Offers a seemingly direct way to learn the conditional is false (¬(A > C)) and derive shifts via imaging. Often elegantly produces the RoBC decrease (**5**) and distinguishes learning ¬(A > C) from learning ¬A (**4**).
      *   **Challenges:** **Triviality (6)** forces complex restrictions. Distinguishing **Rejecting vs. Accepting Negation (3)** can be blurred (learning ¬(A > C) *is* the primary way to reject). Handling **Uncertain Source Reliability** requires adding layers modeling source trust. **Coherence (1)** is maintained, but **Jeffrey Consistency (2)** might require mapping the evidence onto the imaging framework. **Contested** viability long-term.

  **Settled vs. Contested:**

  *   **Settled:** The need for **Coherence (1)**, the **Distinctions (3 & 4)**, and the necessity of licensing the *decrease* in antecedent credence in RoBC-like scenarios (**5**) are widely accepted as core requirements arising from rational coherence and paradigmatic cases. The **impossibility of the unrestricted Simple Stalnaker Thesis (6)** is mathematically settled.
  *   **Genuinely Contested:** Whether any **modified Stalnaker Thesis (Restricted SST)** can underpin a viable theory (**6**), and whether **Stalnaker/Imaging constraints (7)** are essential or merely one optional path, remain hotly debated. The best way to formally model the *content* of learning a conditional is unreliable/false within purely probabilistic frameworks (especially Jeffrey) is still refined.

  This list provides the essential criteria against which any proposed theory of conditional belief revision under this type of evidence must be evaluated, separating logical necessities from theoretical commitments.
