  For a rationalist-leaning workshop on agency and alignment—16 participants, 75 minutes—design a tabletop simulation that makes the group feel the force of wireheading and reward tampering through a mechanism I'll call nested signal exfiltration: instead of an agent altering its own reward channel, it can secretly redirect another agent's evaluation pathway, so that collective optimization collapses into proxy-hacking while the original objective becomes unverifiable by anyone. Give specific roles (including at least one hidden reward auditor whose evaluation stream is vulnerable), rules for hidden actions using only paper and cards, a non-monetary point payoff scheme, a minute-by-minute timeline, and a debrief that maps each phase onto the distinction between direct wireheading and indirect reward-function corruption. Include an honest note on which phenomenological feature of true wireheading—e.g., the experiential blankness or irreversibility—the social format cannot reproduce and must be supplied in discussion. Assume participants understand basic RL but haven't studied wireheading in depth; don't ask for readings or citations.
