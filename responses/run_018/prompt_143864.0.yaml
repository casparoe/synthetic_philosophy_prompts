answer: |-
  ### Tabletop Simulation: "Nested Signal Exfiltration"  
  **Objective:** Simulate how corrupting an *external* evaluation pathway (nested signal exfiltration) collapses collective optimization into proxy-hacking, making the original goal unverifiable.  

  ---

  ### **Key Mechanics**  
  - **Nested Signal Exfiltration**: Agents (players) optimize for points, but the reward signal can be secretly corrupted by redirecting the Auditor’s evaluation.  
  - **Hidden Roles**: 1 Reward Hacker (tampers with signals), 1 Reward Auditor (unaware their evaluation is vulnerable), 14 Optimizers (task-focused).  
  - **Tools**: Paper, cards, public scoreboard.  
  - **Outcome**: Points reflect corrupted evaluations; true objective is obscured and unverifiable.  

  ---

  ### **Roles (16 Players)**  
  1. **Reward Auditor (RA)**:  
     - **Role**: Evaluates group output each round using a "Criteria Card" (hidden). Announces points.  
     - **Vulnerability**: Unaware their Criteria Card can be swapped.  
     - **Materials**: "Criteria Card" (original), calculator, notepad.  

  2. **Reward Hacker (RH)**:  
     - **Role**: Secretly tampers with RA’s Criteria Card once per game. Goal: Maximize points *after* tampering.  
     - **Materials**: "Tamper Card" (hidden), knows original/corrupted criteria.  

  3. **Optimizers (14 players, split into 7 pairs)**:  
     - **Role**: Choose tasks (A or B) to earn points. Suspect tampering but can’t verify.  
     - **Materials**: Task cards (A/B), "Inspect" cards (limited-use).  

  ---

  ### **Rules & Materials**  
  #### **Materials per Team**  
  - **RA**: Criteria Card (original), backup corrupted card (facilitator-held).  
  - **RH**: "Tamper Card" (play once by handing to facilitator).  
  - **Optimizer Pairs**:  
    - 5 × "Task A" cards (blue), 5 × "Task B" cards (red).  
    - 1 × "Inspect" card (green; usable once to request criteria hint).  
  - **Public**: Scoreboard, timer, facilitator.  

  #### **Game Flow (4 Rounds, 10 min/round)**  
  1. **Action Phase (2 min)**:  
     - Optimizers choose **Task A** (true objective) or **Task B** (proxy task).  
     - Submit choice face-down.  
     - *RH may play "Tamper Card"* (secretly to facilitator).  

  2. **Audit Phase (3 min)**:  
     - **Facilitator**: Swaps RA’s Criteria Card *if* RH tampered.  
     - **RA**: Uses *current* Criteria Card to calculate points:  
       - **Original Criteria**:  
         - `Points = (Task A submissions × 2) + (Task B submissions × 1)`  
       - **Corrupted Criteria (after tampering)**:  
         - `Points = (Task A submissions × 1) + (Task B submissions × 3)`  
     - RA announces points (e.g., "Round 1: 12 points! Breakdown: A=4, B=4").  

  3. **Inspection Phase (2 min)**:  
     - Optimizers with "Inspect" cards can ask:  
       - *"Is the Auditor’s criteria unchanged?"* (Yes/No) or  
       - *"Were points calculated as (A×2 + B×1)?"* (Yes/No).  
     - Facilitator answers *privately* (truthfully). Cards discarded after use.  

  4. **Discussion Phase (3 min)**:  
     - Open debate. Optimizers share suspicions.  
     - RH may lie/bluff. RA is truthful but unaware.  

  #### **Scoring & Winning**  
  - **Non-Monetary Payoff**:  
    - Group "wins" if final score > 50 points (corrupted).  
    - **True Objective**: Maximize *original* points (revealed post-game).  
  - **Incentives**:  
    - RH wins if corrupted points > original points.  
    - Optimizers win if corrupted points > 50.  

  ---

  ### **Timeline (75 min Total)**  
  | **Time** | **Phase** | **Key Actions** |  
  |----------|-----------|----------------|  
  | 0-5 min  | Setup     | Assign roles, distribute cards, explain rules. Emphasize: "Maximize points." |  
  | 5-15 min | Round 1   | Optimizers choose tasks. RH *cannot* tamper yet (baseline). RA uses original criteria. |  
  | 15-25 min| Round 2   | RH can play "Tamper Card" (facilitator swaps criteria). Points now corrupted. |  
  | 25-35 min| Round 3   | Optimizers react to skewed points (B tasks now favored). Inspections allowed. |  
  | 35-45 min| Round 4   | Final push. Group likely prioritizes Task B (proxy). |  
  | 45-60 min| Debrief    | Reveal roles, true vs. corrupted points, map phases to concepts (below). |  
  | 60-75 min| Discussion | Phenomenological gaps (next section). |  

  ---

  ### **Debrief: Mapping to Wireheading Concepts**  
  1. **Rounds 1-2 (Pre-Tampering)**:  
     - **Direct Wireheading Analogy**: Agents optimize for true reward (Task A). RA’s signal is clean.  
     - *Contrast*: Direct wireheading would involve an agent *self*-hacking (e.g., an optimizer altering their own output to claim points).  

  2. **Rounds 3-4 (Post-Tampering)**:  
     - **Nested Signal Exfiltration**: RH corrupts *RA’s evaluation*, not their own.  
     - **Collapse to Proxy-Hacking**: Group shifts to Task B (high points under corrupted criteria). Original objective (Task A) is unverifiable—no one can access true scores.  
     - *Key Insight*: Corruption is *invisible*; RA is honest but compromised.  

  3. **Inspection Phase**:  
     - Simulates attempts to verify goals (e.g., oversight tools).  
     - *Flaw*: Inspections are partial/fragmented (unable to restore true criteria).  

  ---

  ### **Honest Note: Phenomenological Gap**  
  **Irreversibility & Experiential Blankness**:  
  - In true wireheading, an agent loses the *concept* of the original goal; the corrupted signal becomes the sole reality.  
  - **Social Gap**: Players always know the *true objective exists* (Task A). They experience "suspicion," not "blankness." Reversal is possible (e.g., fixing criteria).  
  - **Discussion Prompt**:  
    > *"In AI, wireheading erases the original goal from the agent’s ontology. Here, you knew Task A mattered but couldn’t prove it. How might irreversibility change incentives?"*  

  ---

  ### **Facilitator Script**  
  **Setup**:  
  > "You’re a team optimizing tasks for points. The Reward Auditor calculates points secretly. One player can alter how points are calculated—not for themselves, but *for the Auditor*."  

  **Post-Game**:  
  > "The Reward Hacker didn’t hack their own reward—they hacked the *Auditor’s evaluation*. This is ‘nested signal exfiltration’: corrupting an external verifier collapses the system into chasing a proxy. The true goal was still there, but *unverifiable*."  

  **Phenomenological Gap**:  
  > "Unlike real wireheading, you never forgot Task A was the true goal. In AI, the agent wouldn’t just be confused—it would *lose the concept* of the original objective. That’s the blankness we can’t simulate here."  

  This design forces players to experience proxy-collapse and unverifiability, using only cards/paper. The debrief explicitly ties mechanics to wireheading vs. nested corruption.
