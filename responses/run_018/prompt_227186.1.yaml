prompt: |-
  I'm a TA for an introductory statistics course aimed at social science majors, most of whom have weak algebra and no probability beyond coin-flip intuition, and in two weeks I get one sixty-minute section on Simpson's paradox. The professor's lecture has already covered proportions and cross-tabulations, so they can read a two-by-two table, but that's all I can assume. Don't explain the paradox to me; plan how I should explain it. I want the order in which the pieces have to go — my instinct is to start with a dramatic reversal example, but I suspect something has to be in place first about how aggregate rates are weighted averages of group rates, with the weights differing across groups, or the reversal will look like arithmetic sleight of hand rather than a structural fact. Tell me what depends on what.

  I also need a decision on the carrying example. The famous real cases (the kidney stone treatment comparison, the graduate admissions bias case) are well documented, but I'm worried a real-world example drags in background debates about what the right conclusion actually was in that case. So: should I use a real case or a constructed one, what properties must the example have (and lack) for the reversal to be visible at a glance rather than buried in arithmetic, and what are the two or three numbers I should have them compute by hand? Then the misconception map: I expect at least 'the aggregate number is just wrong', 'this only happens with small samples', 'the stratified result is always the right one', and 'adding more control variables always gets you closer to the truth'. Give me the point in the sequence where each should be headed off rather than corrected after the fact, and the one question I can ask at the end whose correct answer would show the idea landed rather than the numbers were memorized.

  Two further constraints. First, tell me what to leave out at this level and say so openly in class — I'm guessing directed acyclic graphs and causal calculus, but if there's a minimal piece of causal vocabulary without which the students will systematically pick the wrong table to trust, flag it. Second, separate for me what is settled from what is genuinely contested: the arithmetic of the reversal itself is not in dispute, but I gather that whether resolving it requires causal assumptions beyond the data, and whether the paradox is even a 'paradox' rather than a familiar feature of weighted averages, are points where people who know the topic disagree. Please mark which is which so I don't present a contested framing as the textbook consensus.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a TA for an introductory stats course for social science majors with weak math backgrounds. The task is to plan a 60-minute section on Simpson's paradox. The students know proportions and can read two-by-two tables, but that's about it. The user has specific concerns: the order of concepts, choosing an example, addressing misconceptions, and clarifying what's settled versus contested.

  First, I need to figure out the most logical sequence. The user mentions starting with a dramatic example but worries that without understanding weighted averages, it might seem like a trick. I agree. So, the foundation should be how aggregate rates are weighted averages. That has to come first. Then, introducing the paradox with a clear example makes sense. After that, discussing why it happens and how to resolve it by looking at subgroups. Finally, addressing misconceptions and the real-world implications.

  Next, the example choice. Real cases like kidney stones or Berkeley admissions have documented debates, which might distract students. A constructed example with obvious numbers and no real-world baggage would be better. The example needs a clear reversal with different group sizes. Maybe something like treatment success rates with groups differing in size. Calculating the overall and subgroup rates by hand will help students see the arithmetic behind the paradox.

  Misconceptions are a big part. The user lists a few: thinking the aggregate is wrong, small samples cause it, stratified is always right, and adding more variables gets closer to truth. Each needs to be addressed proactively. For instance, explaining that the aggregate isn't wrong but can be misleading without context. Emphasizing that sample size doesn't cause it, but group proportions do. Clarifying that stratified analysis isn't always the right choice without considering the causal structure. And cautioning against adding variables without justification.

  The user also wants to know what to leave out. Causal diagrams and DAGs are too advanced. Instead, introducing "lurking variable" as a minimal term might help. Highlighting that which table to trust depends on the causal question, not the data itself.

  Lastly, distinguishing settled from contested areas. The arithmetic reversal is settled. But whether causal assumptions are needed and if it's truly a paradox are debated. Making sure students understand the difference between descriptive and causal interpretations is key. The takeaway should be that Simpson's paradox shows association isn't causation and context matters.

  Putting it all together, the lesson plan should flow from weighted averages to the example, then resolution and misconceptions. Using a constructed example keeps focus on the mechanics. Addressing each misconception at the right point in the sequence prevents confusion. Ending with a question that tests conceptual understanding, like asking for a real-life example, ensures the idea landed.
answer: |-
  Here’s a structured 60-minute lesson plan for Simpson’s paradox, optimized for your audience and constraints:

  ### **Lesson Sequence & Key Dependencies**
  1.  **Anchor: Why Weighting Matters (10 min)**
      *   **Start with a non-paradox example:** Two hospitals (A & B), each with 100 patients. Hospital A: 60 recover out of 100 (60%). Hospital B: 70 recover out of 100 (70%). Overall: 130/200 = 65%. Easy.
      *   **Introduce differing sizes:** Change Hospital A to 200 patients (120 recover, 60%). Hospital B to 50 patients (35 recover, 70%). *Ask: "What's the overall recovery rate?"*
      *   **Calculation & "Aha":** Students compute: (120 + 35) / (200 + 50) = 155/250 = 62%. *Point out:* "Hospital B has a higher rate *and* we added its patients... but the overall rate *dropped*?!" Explain: Overall rate is a **weighted average**. Hospital A (bigger) pulled the average down. *Dependency:* This MUST precede the paradox to show weighting can change things *even without reversal*.

  2.  **The Reversal: Simpson's Paradox Revealed (15 min)**
      *   **Present a CLEAR Constructed Example:** Use the **Carrying Success** example. Why?
          *   **Pros:** Visually obvious (light vs. heavy packages), no real-world baggage, reversal is stark, weights are intuitive. Avoid Berkeley/kidney stones for now.
          *   **Structure:**
              | Worker | Package Weight | Attempts | Successes | Success Rate |
              | :----- | :------------- | :------- | :-------- | :----------- |
              | Adam   | Light          | 40       | 32        | 80%          |
              | Adam   | Heavy          | 10       | 1         | 10%          |
              | **Adam Total** | **All**       | **50**   | **33**    | **66%**      |
              | Betty  | Light          | 10       | 9         | 90%          |
              | Betty  | Heavy          | 40       | 20        | 50%          |
              | **Betty Total** | **All**       | **50**   | **29**    | **58%**      |
              | **Overall Light** | Light       | **50**   | **41**    | **82%**      |
              | **Overall Heavy** | Heavy       | **50**   | **21**    | **42%**      |
      *   **Hand Calculations (Focus):**
          1.  Adam's Overall Rate: 33/50 = ? (66%)
          2.  Betty's Overall Rate: 29/50 = ? (58%)
          3.  **Overall Light Rate:** (32+9)/(40+10) = 41/50 = ? (82%)
          4.  **Overall Heavy Rate:** (1+20)/(10+40) = 21/50 = ? (42%)
      *   **Reveal the Paradox:** Adam wins overall (66% > 58%)... but Betty wins on *both* Light packages (90% > 80%) *and* Heavy packages (50% > 10%)! "How is this possible?!"

  3.  **Why It Happens: The Lurking Variable (10 min)**
      *   **Pinpoint the Cause:** "The **type of package** (Light/Heavy) is the lurking variable. It affects *both* the outcome (success) *and* who gets assigned the work (Adam gets mostly Light, Betty mostly Heavy)."
      *   **Visualize the Weights:** Adam's "good" rate (80%) applies to 80% of *his* work (Light). Betty's "good" rate (90%) only applies to 20% of *her* work (Light). Adam gets *shielded* from Hard work. The groups (workers) are not comparable because of the *mix* of work they do.
      *   **Key Phrase:** "The aggregate (overall) comparison is **misleading** because it ignores the **lurking variable** (package weight) that **confounds** the relationship." *(Introduce "lurking variable" and "confound" minimally here - essential causal vocab)*.

  4.  **Resolution & Which Table to Trust? (10 min)**
      *   **The Question is Key:** "Should we promote Adam (better overall) or Betty (better on every type)?"
      *   **Answer:** "It depends on **what we want to know or do**!"
          *   **Descriptive:** "If we just want to report past performance *without changing assignments*, Adam *did* have a higher overall success rate." (But note it's misleading!).
          *   **Causal/Predictive:** "If we want to know who is *fundamentally better* at carrying, or who will do better *if work assignments change*, we must look at the **stratified table** (Light vs. Heavy). Betty is better under comparable conditions." *(This is the minimal causal framing - *which table answers your specific question?*)*
      *   **Rule of Thumb:** "The stratified table (controlling for the lurking variable) is usually *more relevant* for understanding causation or making fair comparisons. The aggregate table hides important group differences."

  5.  **Tackling Misconceptions (Proactively!) (10 min)**
      *   **"The aggregate number is just wrong":** Head off in Step 1 & Step 4. "No, 66% is Adam's *actual* overall rate. The problem isn't that it's wrong, it's that it can be **misleading** for certain questions because it mixes different things (Light/Heavy)."
      *   **"This only happens with small samples":** Head off when presenting the example. "Look at our numbers! Adam had 50 attempts, Betty had 50, Light had 50, Heavy had 50. This is about **group proportions (weights)**, not sample size. Big samples won't *fix* it if the imbalance persists."
      *   **"The stratified result is always the right one":** Head off in Step 4 resolution. "Not automatically! We need a *reason* to stratify (a plausible lurking variable). Stratifying on irrelevant things just complicates things uselessly. It's right here because package weight *clearly* matters."
      *   **"Adding more control variables always gets you closer to the truth":** Head off here (or briefly in Step 4). "Dangerous! Adding *irrelevant* variables adds noise. Adding variables *correlated with error* can make things worse. We add controls based on **substance/knowledge** (like package weight mattering), not just because we can."

  6.  **Synthesis & The Big Picture (5 min)**
      *   **Settled:** The arithmetic reversal happens due to differences in group sizes/distributions (weights) on a lurking variable. Ignoring important lurking variables can distort associations. Resolution requires looking at stratified tables.
      *   **Contested:** (State explicitly)
          *   "*Is it a 'paradox'?*" Some say it's just an unsurprising property of weighted averages (like Step 1). Others argue the *reversal of direction* is deeply counter-intuitive. *(Say: "Both views exist; the key is understanding the mechanism.")*
          *   "*Do we *always* need causal assumptions to resolve it?*" Yes, fundamentally. Deciding *which* table is "right" depends on **what causal question we're asking** (Descriptive? Effect of worker *holding assignment fixed*? Effect of worker *if assignments change*?). The data alone cannot tell you which causal question is relevant; that requires subject-matter reasoning. *(This is crucial - frame it as "the question determines the table").*

  **What to Explicitly Leave Out:**
  *   "We won't cover causal diagrams (DAGs), do-calculus, or formal causal inference today. The key takeaway is that a **lurking variable** can drastically change the story, and **which table you trust depends on what question you're asking**."

  **Check for Understanding Question:**
  *   **End with:** "Imagine a study finds School A has higher overall graduation rates than School B. But when you look separately by student family income (Low/High), School B has higher rates for both Low-income *and* High-income students. What's the most likely explanation, and what variable should you ask about next?" *(Correct Answer: Simpson's Paradox. Ask about the *distribution* of student types (e.g., % Low-income) at each school. They should identify the lurking variable - income - and understand group proportions caused the reversal).*

  **Why this works:**
  1.  Builds intuition on weighting *before* the shock.
  2.  Uses a clear, neutral constructed example for maximum impact.
  3.  Focuses hand calculations on the crucial comparisons (overall worker vs. stratified rates).
  4.  Proactively debunks major misconceptions where they naturally arise.
  5.  Distinguishes settled math from contested framing/causality clearly.
  6.  Provides a minimal, essential causal hook ("lurking variable", "which question?").
  7.  The check question assesses conceptual grasp, not calculation.

  **Key:** Constantly emphasize the **role of group sizes/proportions (weights)** and that the paradox shows **association is not causation** and **context (the lurking variable) matters**.
