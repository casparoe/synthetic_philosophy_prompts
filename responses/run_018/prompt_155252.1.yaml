answer: |-
  Here's a breakdown of the Pasadena Paradox and its implications for your fundraiser and decision theory, straight to the logic:

  **Core Problem: Why EV is Undefined (Not Infinite)**
  The Pasadena game payout is `(-1)^{n+1} * (2^n) / n` dollars if the first heads appears on the `n`-th flip. The expectation is the sum `Σ [ (-1)^{n+1} * (2^n) / n ] * (1/2^n)` from `n=1` to `∞`.
  *   Simplify: `Σ [ (-1)^{n+1} / n ] * (1)` from `n=1` to `∞`.
  *   This is the alternating harmonic series: `1 - 1/2 + 1/3 - 1/4 + 1/5 - ...`
  *   **Conditional Convergence:** This sum *converges* (to `ln(2)` ≈ $0.69) *if* you sum the terms in the exact order `1, 2, 3, 4,...`.
  *   **Riemann Series Theorem:** Any conditionally convergent series can be rearranged to sum to *any* real number, or to diverge to `+∞` or `-∞`. Rearranging the *order of the outcomes* mathematically rearranges the summation order.
  *   **Undefined EV:** There is no single "true" sum. The expected value depends on the *arbitrary order* in which you choose to sum the infinite terms. Since there's no privileged order, the expectation is fundamentally **undefined**.

  **Implications for Decision Theory:**

  1.  **Kills Standard Expected Utility Maximization (For This Gamble):**
      *   The core rule "choose the option with the highest expected utility" **fails** here. There *is no* expected utility value to compare. You literally cannot calculate "the" EU for the Pasadena game.
      *   **Workarounds Exist (But They're Patches):**
          *   **Finite Truncation:** Cap the number of flips (e.g., max `n=100`). The finite sum *is* well-defined (≈$0.69 for `n=100`). This is the most practical solution (and what you'll do for your real raffle!).
          *   **Weak or Strong Stochastic Dominance:** Check if one option is clearly better in *every possible state* or has a better *cumulative distribution*. The Pasadena game itself doesn't break dominance (see point 3), but undefined EV makes dominance *harder to apply* when comparing different gambles.
          *   **Other Decision Criteria:** Use maximin (worst-case payoff), minimax regret, or utility transformations that handle infinite/undefined expectations better (like `ln(wealth)`). These abandon pure EU maximization.
          *   **"Principal Value":** Insist on summing in the natural order (`n=1,2,3,...`), accepting `ln(2)`. This is mathematically convenient but philosophically arbitrary.

  2.  **Does it Break Dominance? (The Rumor)**
      *   **No, Dominance Still Holds.** Stochastic dominance rules are generally robust.
      *   **First-Order Dominance:** If Gamble A pays at least as much as Gamble B in *every possible outcome*, and more in at least one, then A dominates B. This remains true even if EU is undefined for both. The Pasadena game doesn't violate this.
      *   **Where Confusion Arises:** Imagine a *modified* Pasadena game (`Game A`) vs. a game paying exactly `ln(2)` (`Game B`) in *every* outcome where the Pasadena game pays *something*. `Game A` doesn't dominate `B` because:
          *   For outcomes where `n` is odd, `A` pays `+1/n` which is `> ln(2)` for `n=1` but `< ln(2)` for `n≥3`.
          *   For even `n`, `A` pays `-1/n` which is `< ln(2)`.
          *   There are outcomes where `B` (`ln(2)`) pays more than `A` (e.g., when `n=2`, `A` pays `-0.5`, `B` pays `≈+0.69`). So dominance doesn't apply here.
      *   **The Takeaway:** Undefined EV makes *comparing* gambles using EU impossible, but it doesn't invalidate the core logic of dominance itself. If one gamble truly *always* pays more, dominance still tells you to choose it.

  3.  **Real-World Relevance vs. Made-Up Games:**
      *   **Made-Up Games:** The Pasadena Paradox is primarily a **theoretical limit case**. It exposes a vulnerability in the standard EU framework when dealing with infinite state spaces and conditionally convergent payoffs.
      *   **Small Real-World Bets (Like Your Raffle):** It **absolutely should change how you think**, but not because of the *infinite* undefined nature:
          *   **Finite Reality:** Your raffle *will* have a maximum number of rounds (`N_max`). The finite sum `Σ_{n=1}^{N_max} [ (-1)^{n+1} / n ]` **is perfectly well-defined**. Calculate this! It oscillates but converges toward `ln(2)`. This *is* the meaningful EV.
          *   **Skewness & Risk:** The *real* lesson is the **extreme skewness**. The probability of a large positive payout (`n` odd) is tiny (`1/2^n`), but the payout is huge (`1/n`). Conversely, moderate losses (`-1/n` for even `n`) are more likely. People are risk-averse! A $0.69 EV might feel like a bad deal if there's a 25% chance of losing $0.50 and only a 0.1% chance of winning $1000. **Focus on the distribution, not just the EV.**
          *   **Bankroll/Bankruptcy:** Can your school afford the potential loss on even `n` rounds? What's the maximum possible loss (`-1/2` if `n=2` is the min payout, or `-1/N_max`)? Ensure prizes are feasible.
          *   **Perception & Fun:** The harmonic scaling is cool mathematically but might confuse participants. Ensure the rules and potential outcomes (especially losses!) are crystal clear. The "funky payout" could be a selling point or a deterrent.

  4.  **Reject or Patch the Framework?**
      *   **Neither. Refine Understanding.** Don't reject EU maximization wholesale – it's incredibly powerful and intuitive for *vast* classes of decisions (finite gambles, absolutely convergent series). The Pasadena Paradox highlights its **boundary conditions**.
      *   **The Patch is Contextual Awareness:** Understand that EU maximization relies on the expectation being well-defined (finite or infinite). When dealing with highly skewed distributions or theoretically infinite games:
          *   **Finite Truncation:** Is almost always the physically relevant solution.
          *   **Explicit Risk Preferences:** Incorporate utility functions (`U(wealth)`) that capture risk aversion, as the linear `U(x)=x` assumed in basic EV is often unrealistic for skewed bets.
          *   **Dominance & Other Criteria:** Remain valuable tools when EU is silent or ambiguous.
          *   **Distribution over Point Estimate:** Always look at the range and likelihood of possible outcomes, not just the EV.

  **For Your Fundraiser:**
  1.  **CAP THE ROUNDS (`N_max`).** This is non-negotiable. The finite EV is defined.
  2.  **CALCULATE the finite EV and the full prize distribution.** See if the EV makes sense relative to ticket price and potential losses.
  3.  **STRESS-TEST the worst-case loss.** Can your school cover it?
  4.  **CONSIDER RISK AVERSION.** Is the chance of a moderate loss too high for participants compared to the tiny chance of a huge win? Maybe tweak the scaling.
  5.  **COMMUNICATE CLEARLY.** Explain the unusual payout structure simply, including potential downsides.

  The Pasadena Paradox doesn't destroy decision theory; it shows where the simple EV rule hits a mathematical singularity. By capping your raffle, you sidestep the singularity entirely and land firmly in the realm of well-defined, manageable decisions. Good luck!
