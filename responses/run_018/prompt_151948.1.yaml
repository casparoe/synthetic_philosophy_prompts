    "payoff_scheme": "A-only + A = 10; A-only + B = 0; A+B + A = 5; A+B + B = 5. Total points over 5 rounds. Top scorer picks closing discussion topic.",
    "round_structure_and_timeline": "Setup (5 min), explanation (10 min), 5 rounds (12 min/round: 1-min envelope distro, 2-min choice, 4-min scoring, 5-min inter-round processing), final scoring (5 min), debrief (15 min). Total: 85 min + 5 min buffer.",
