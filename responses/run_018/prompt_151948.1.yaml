answer: |-
  ### Classroom Game Design: Adaptive Predictor Dilemma

  #### **Setting and Audience**
  - 16 students in a 90-minute upper-division seminar on rational choice and decision theory. Students are familiar with Newcomb's problem conceptually but have not deeply engaged with the evidential/causal tension.

  #### **Predictor Twist Description**
  The predictor is an adaptive statistical model (not an oracle) that updates its prediction for each student **individually** before each round, using **only that student’s prior choices** in previous rounds. The model learns sequentially:  
  - Predictions for Round *n* are based **exclusively** on the student’s choices in Rounds 1 to (*n*–1).  
  - Round 1 uses a neutral default prediction (all students start identically).  
  This forces students to see their choices as *evidence* shaping future predictions, while facing the *causal irrelevance* of their current choice to the already-set prediction for that round.

  ---

  #### **Rules, Roles, and Materials**
  **Materials**  
  - 16 sets of 5 sealed envelopes (one per round, labeled "PREDICTION").  
  - 16 sets of 5 choice cards (cards labeled A or B for each round).  
  - 16 scorecards (to record choices/payoffs).  
  - 1 board displaying:  
    - **Predictor Algorithm**:  
      > *"Your prediction for Round **n** is based **only** on your prior choices:  
      > - Round 1: Default = A-only (all students).  
      > - Round *n* (≥2): **If** you chose **A** in **>50%** of Rounds 1 to (*n*–1), predict **A-only**.  
      > **Else**, predict **A+B**."*  
    - **Payoff Scheme** (see below).  

  **Roles and Procedure**  
  1. **Facilitator**: Prepares prediction envelopes before each round using the algorithm and distributes them.  
  2. **Students**:  
     - Receive a sealed prediction envelope **at the start** of each round.  
     - Privately write **A** or **B** on their choice card for that round (simultaneous submission).  
     - **After submitting**, they open their envelope to see their prediction and compute payoffs.  
     - Record choice/prediction/payoff on their scorecard.  

  **Key Constraint**:  
  - Students **cannot open the prediction envelope until after submitting their choice** for that round.  

  ---

  #### **Payoff Scheme**
  | Prediction | Your Choice | Payoff |  
  |------------|-------------|--------|  
  | A-only     | A           | 10     |  
  | A-only     | B           | 0      |  
  | A+B        | A           | 5      |  
  | A+B        | B           | 5      |  

  - **Total points**: Sum of payoffs from 5 rounds.  
  - **Stakes**: The top scorer chooses the seminar’s closing discussion topic; others earn symbolic "decision points" (trivial bragging rights).  

  ---

  #### **Round Structure and Timeline**  
  *(Total: 85 minutes + 5 min buffer)*  
  1. **Setup (5 min)**: Distribute scorecards, choice cards, and Round 1 envelopes. Display rules/payoffs.  
  2. **Explanation (10 min)**: Clarify the predictor algorithm and payoff scheme. Emphasize:  
     - *"Your prediction each round is locked in before you choose. Your choice only affects future predictions."*  
  3. **Rounds 1–5 (12 min/round × 5 = 60 min)**:  
     - *Prediction Distribution (1 min)*: Facilitator hands out envelopes for the current round.  
     - *Choice Phase (2 min)*: Students privately write A/B on choice cards and submit.  
     - *Revelation & Scoring (4 min)*: Students open envelopes, record prediction/choice/payoff.  
     - *Inter-round Processing (5 min)*: Facilitator uses submitted choices to prepare next-round envelopes (applying the algorithm).  
  4. **Final Scoring (5 min)**: Students tally points; announce top scorer.  
  5. **Debrief (15 min)**: Guided discussion (see below).  

  ---

  #### **Debrief Mapping**  
  **In-Game Moments → Concepts**  
  - **Student who switched to B in Round 3 after two A’s in Rounds 1–2**:  
    - *Received 0 points* because the model (using Rounds 1–2) predicted "A-only" for Round 3.  
    - **Evidential reasoning**: Their B-choice in Round 3 signals inconsistency, causing the model to predict "A+B" for Round 4 (capping future payoffs at 5).  
    - **Causal reasoning**: Their Round 3 choice could not alter the Round 3 prediction (already fixed).  
    - **Newcomb mapping**: "A-only" = opaque box with $1M; "B" = taking both boxes. Choosing B when "A-only" was predicted is two-boxing and nets $0.  

  - **Student who consistently chose A**:  
    - Earns 10/round if "A-only" is predicted (likely). Demonstrates one-boxer logic: "My choice is evidence I’m the type who gets rewarded."  

  **Discussion Flow**:  
  1. Ask: *"Who switched strategies? What happened when you did?"*  
  2. Contrast a "late switcher" (above) with a "consistent A-chooser."  
  3. Link to Newcomb: *"In Round 3, was your choice causing the prediction? Or was it evidence for future predictions?"*  
  4. Introduce terms: "causal decision theory" (current choice can’t affect fixed past) vs. "evidential reasoning" (choice signals type for future).  

  ---

  #### **Predictable Failures and Fixes**  
  1. **Failure**: Students randomize choices to "fool" the algorithm.  
     - **Fix**: Ask: *"Did randomization help? Our model ignores noise—it only cares about majority behavior."* Show that flipping between A/B leads to "A+B" predictions (capped 5 points), while consistent A yields 10s.  

  2. **Failure**: Confusion about whether the model is "causal."  
     - **Fix**: Use a student’s scorecard to trace: *"Look at Round 3—your choice was submitted AFTER the envelope was sealed. Could it change that prediction?"*  

  3. **Failure**: "This is just luck—the first round decides everything!"  
     - **Fix**: Highlight a student who switched from B to A in Round 2: *"Your Round 1 B-choice led to ‘A+B’ in Round 2. But when you chose A in Round 2, it shifted your Round 3 prediction to ‘A-only’—your evidence changed!"*  

  ---

  #### **Unreproducible Feature and Facilitator Note**  
  **Unreproducible Feature**:  
  The original Newcomb problem involves a *one-shot, infallible predictor* whose prediction is based on perfect foresight of your choice. This game’s predictor is *fallible* and *learns from past behavior*—not current choice.  

  **Facilitator Note**:  
  *"In the classic Newcomb problem, the predictor knows your choice in advance with certainty. Here, our model only infers your ‘type’ from past actions. This means:  
  - You can ‘train’ the model over time (unlike the fixed past in Newcomb).  
  - But the core tension remains: Your choice in Round *n* is causally irrelevant to the Round *n* prediction, yet it’s critical evidence for Round *n*+1.  
  The one-shot paradox asks: ‘Can your choice affect a fixed past?’ Our version asks: ‘Can your choice today sacrifice short-term gain to shape a smarter predictor tomorrow?’ Both highlight the evidential/causal rift."*  

  ---

  ### Structured Summary (JSON)

