    "predictable_failures_and_fixes": "1. Randomizing choices: Show it caps payoffs at 5 via 'A+B' predictions. 2. Confusion about causality: Use scorecards to prove choices occur after predictions are locked. 3. 'First-round luck': Highlight switchers who changed predictions through evidence.",
    "unreproducible_feature_and_facilitator_note": "Original Newcomb uses a one-shot infallible predictor; this uses a fallible model learning from past behavior. Facilitator note: 'The core tension—current choice's causal irrelevance vs. evidential value for future—remains, but here you can train the predictor over time.'"
  }
  ```
