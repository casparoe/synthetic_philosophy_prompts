  I'm leading a fifty-minute tutorial for twelve first-year philosophy students on the conceptual structure of graded moral patienthood. The core idea is that sentience and its associated moral status come in degrees shaped by two interacting parameters—"affective bandwidth" (the range of valenced states a system can register) and "temporal binding depth" (the duration over which those states are integrated into a continuous perspective)—rather than by a single on-off threshold. To break binary intuitions, the session must navigate intermediate architectures that do not map neatly onto human-like consciousness: distributed nociceptive networks (e.g., cephalopods), reflex-driven decorticate mammalian systems, and simple homeostatic feedback loops (e.g., thermostats or plant root tropisms). Plan the explanatory sequence: identify the conceptual dependency that must be in place before the scalar framework can be introduced without collapsing into either anthropocentrism or undifferentiated panpsychism; specify the one comparative case study that should carry the session, describing exactly which properties it must display (high bandwidth with shallow binding versus low bandwidth with deep binding) and which properties it must lack; map the misconceptions students will predictably form—binary consciousness, anthropomorphic projection onto plants, neuron-counting as a proxy for status, and the worry that gradation entails moral equality across all systems—and indicate the precise point in the sequence where each should be headed off; design one final diagnostic question that reveals whether a student genuinely grasps the scalar logic rather than merely repeating it; and explicitly mark the quantitative weighting problem (how to trade bandwidth against binding depth) as beyond the scope of this level, with a clear statement of what is being left out and why. Present the plan as an ordered teaching arc. End with a one-sentence summary of your core pedagogical strategy as the final line.
