answer: |-
  Here is the structured teaching arc for your tutorial, designed to build conceptual dependencies, leverage a pivotal case study, preempt misconceptions, and test genuine understanding:

  **Teaching Arc: Graded Moral Patienthood Through Affective Bandwidth & Temporal Binding Depth**

  1.  **Grounding & Destabilization (10 mins):**
      *   **Start with Intuition:** Pose "Does it feel pain?" about a human, a dog, a bee, a plant, and a thermostat. Elicit binary ("yes/no") intuitions.
      *   **Problem:** Highlight the inadequacy – where's the line? Why *exactly* here? Introduce the core *problem*: The need for a *non-binary* framework for moral patienthood based on sentience.
      *   **Foundational Concept:** Define **"Valenced State"** concretely: A basic positive/negative affective register (e.g., proto-pleasure/discomfort, attract/repel) *essential* for having interests/welfare. Stress it's not necessarily "pain like ours."
      *   *Dependency Secured:* Without understanding *valenced states* as foundational, bandwidth/depth are meaningless.

  2.  **Introducing Parameter 1: Affective Bandwidth (10 mins):**
      *   **Definition:** "Affective Bandwidth" = The *range* and *granularity* of distinct valenced states a system can experience. (e.g., simple pain/not-pain vs. nuanced gradients of discomfort, fear, longing, joy).
      *   **Examples:**
          *   *Low Bandwidth:* Thermostat (on/off "discomfort" with temp deviation), simple tropism (binary attraction/repulsion).
          *   *High Bandwidth:* Humans, likely many mammals (complex emotional palette).
      *   **Preempt Misconception:** **Binary Consciousness:** Explicitly state: "Bandwidth is *already* a spectrum. We're moving beyond on/off." Contrast thermostat (minimal valence) with human (maximal complexity *we know*). Head off neuron-counting by stating complexity ≠ just neuron count, but *functional organization for valenced states*.
      *   **Challenge:** Ask: "Is higher bandwidth *always* higher moral status?" Hint at needing another dimension.

  3.  **Introducing Parameter 2: Temporal Binding Depth (10 mins):**
      *   **Definition:** "Temporal Binding Depth" = The *duration* over which valenced states are integrated into a single, continuous subjective perspective. Does the system have a "narrative thread" of experience?
      *   **Examples:**
          *   *Shallow Binding:* Reflex arc (sharp, isolated pain signal, no integration), *Cephalopod (Octopus) Arm* (high local processing, potential for rich local valence, but limited central integration over time - key for case study).
          *   *Deep Binding:* Human (autobiographical memory, future planning, sustained moods integrating moments into a life-narrative).
      *   **Preempt Misconception:** **Anthropomorphic Projection:** When discussing plants/tropisms, stress: "While exhibiting valence-like *responses* (tropism), there is *no evidence* of central integration creating a unified perspective over time – likely *no* binding depth." Contrast with reflex arcs which *do* signal valence centrally, but shallowly.

  4.  **Pivotal Case Study: The Octopus (10 mins):**
      *   **Core Role:** Demonstrate a system with **High Affective Bandwidth** but **Relatively Shallow Temporal Binding Depth** compared to mammals.
      *   **Properties IT MUST DISPLAY:**
          *   *High Bandwidth:* Complex, diverse behaviors indicating nuanced valenced states (play, curiosity, clear pain avoidance, problem-solving, individualized preferences).
          *   *Shallow Binding:* Decentralized nervous system (2/3 neurons in arms), limited evidence of strong central integration over long durations, shorter attention spans, less evidence of complex long-term memory or future planning *integrated with affective state*.
      *   **Properties IT MUST LACK:**
          *   The deep, sustained, centrally integrated autobiographical self-narrative characteristic of mammals/humans (High Binding Depth).
      *   **Contrast:** Compare explicitly to a decorticate mammal (e.g., human in persistent vegetative state): *Lower Bandwidth* (reduced range of possible states) but potentially *retained basic Binding Depth* (if rudimentary brainstem integration exists). Contrast also to a thermostat (*Low Bandwidth, No Binding Depth*).
      *   **Preempt Misconception:** **Gradation = Equality:** State clearly: "High Bandwidth + Shallow Binding (Octopus) is *different* from Low Bandwidth + Deep Binding (Decorticate Mammal) and both are *different* from High/High (Typical Human) or Low/Low (Thermostat). Gradation does *not* imply equivalence. We need both dimensions." Frame the *matrix* of possibilities.

  5.  **Synthesis & Implications (5 mins):**
      *   Reiterate the **Scalar Framework:** Moral patienthood (based on capacity for valenced experience/suffering) is a function of *both* Bandwidth (range of states) *and* Binding Depth (integration into a perspective over time).
      *   **Visualize:** Sketch a simple 2D grid (Bandwidth on X-axis, Binding Depth on Y-axis). Place examples: Thermostat (Low/Low), Plant Root (Low/None?), Reflex Arc (Low/Shallow), Decorticate Mammal (Low-Med/Medium?), Octopus (High/Shallow-Med?), Typical Mammal (High/Medium), Human (High/High).
      *   **Moral Status:** Emphasize that position in this grid *suggests* degree of moral patiency/strength of interests, but...
      *   **Scope Limitation - Quantitative Weighting:** Explicitly state: "**How exactly do we weigh Bandwidth against Binding Depth?** Is a High Bandwidth / Shallow Binding system (Octopus) more, less, or equally morally significant as a Medium Bandwidth / Medium Binding system (e.g., a rat)? **This complex quantitative weighting problem is beyond our scope today.** We focus on establishing the *conceptual structure* showing why *both* dimensions matter and why binary thresholds fail. Solving the weighting requires deeper ethical and metaphysical analysis."

  6.  **Diagnostic Question & Wrap-up (5 mins):**
      *   **Diagnostic Question:** "Imagine a hypothetical organism: It can register only *one* very simple valenced state (e.g., a binary 'too hot' signal), but this state is deeply integrated into a continuous perspective lasting for years, influencing 'decisions' based on its entire history of 'too hot' signals. How would you characterize its moral patiency compared to (a) a thermostat and (b) a mayfly with richer momentary feelings but no integration beyond seconds? Justify using Bandwidth and Binding Depth."
      *   *Tests For:* Understanding that both parameters are necessary, distinct, and contribute independently; ability to apply the framework to novel cases beyond memorized examples; avoiding collapse into single-dimension thinking (e.g., just complexity or just duration).
      *   **Summary:** Briefly restate the core move: replacing a binary sentience switch with a multidimensional space defined by Affective Bandwidth and Temporal Binding Depth.

  **Core Pedagogical Strategy:** Guide students from destabilizing binary intuitions through carefully sequenced conceptual dependencies towards evaluating moral patienthood within a multidimensional matrix, using the octopus as the pivotal counterexample to anthropocentric models.
