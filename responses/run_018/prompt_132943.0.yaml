answer: |-
  ### Retirement Toast for Professor Elena Vasquez

  Friends, colleagues, Elena’s cherished family—tonight we honor a scholar who spent thirty-five years asking one of humanity’s oldest questions: *What do our actions truly make us deserve?*  

  Elena didn’t study karma as cosmic bookkeeping—some divine spreadsheet tallying good deeds against bad. She studied it as a profound inquiry into moral desert: how our choices shape what we *ought* to receive, and how cultures honor that link. In her work, she drew a crucial distinction—one that guides how we celebrate her tonight.  

  Imagine two ways to view karma.  
  First: **ledger karma**. Think of a bank statement. Debits here, credits there. Life becomes a transactional exchange—suffering “paid for” by rewards, success “earned” by sacrifice.  
  Second: **vector karma**. Think of a compass needle. What matters isn’t the miles behind you, but the direction you face *now*. It’s your enduring commitment—your *orientation*—to giving others, and yourself, what is genuinely deserved. Not because a ledger demands it, but because your moral compass insists.  

  This distinction isn’t academic tonight. It reshapes what we *can* say.  

  If I praised Elena by listing her achievements—her groundbreaking books, her endowed chair, her honorary degrees—I’d imply her career fits a ledger. As if tenure balanced out rejection, or awards offset criticism. That’s precisely the trap her work warns against. Her legacy isn’t in titles accrued, but in the *direction* she traveled.  

  So let me speak to her vector.  

  To her students: Elena didn’t teach to accumulate gratitude. She taught *toward their deservingness*. When a nervous first-year suggested a novel reading of the *Bhagavad Gita*, Elena didn’t annex the insight. She shone a light on it—*“Look what you found!”*—guiding the room to honor the student’s work. That’s vector karma: orienting others toward *their* merit, never her own balance sheet.  

  To her colleagues: Elena refused to confuse hierarchy with desert. When a senior theorist dismissed a junior scholar’s work at a conference, Elena spoke up—gently, firmly—redirecting the room to the argument’s substance, not the speaker’s rank. It cost her allies. But she knew: deserving isn’t about status. It’s about the work itself.  

  And in her scholarship: When peers reduced karma to “what goes around comes around,” Elena challenged them. *“Karma isn’t fate’s ledger,”* she’d say. *“It’s a call to align our choices—right now—with what is owed.”*  

  So tonight, we don’t say, *“Elena earned every honor.”*  
  We say: **Elena oriented her life toward desert.** She turned her compass toward justice—in a seminar room, a faculty meeting, a footnote. She measured success not by rewards amassed, but by her unwavering bearing toward what is right.  

  Elena, your vector remains our true north. May your retirement be a continuation of that alignment—less paperwork, more poetry, but the same steadfast direction.  

  **To Elena!** May your compass always point toward joy, and may we all learn to walk the path you charted: not counting debts, but keeping course.  

  *(Raises glass)* Cheers!  

  ---

  **Key Framework Choices Explained:**  
  - **Forbidden:** Claiming her achievements “balanced” her struggles (ledger logic).  
  - **Permitted:** Framing her choices as sustained orientation toward desert (vector logic).  
  - **Audience Clarity:** “Moral desert” = *what actions make us deserve things*; “ledger/vector” explained via *bank statement* vs. *compass needle* metaphors.  
  - **Tone:** Warmth via specific, human gestures (student encouragement, conference defense).  
  - **Time:** ~650 words; spoken slowly ≈ 5 minutes.
