prompt: |-
  I sit on the methodology review panel for an interdisciplinary research institute that funds cognitive-science and artificial-intelligence projects, and recently we have seen a wave of proposals that include what applicants call phenomenal consciousness assays — structured protocols asking human subjects or artificial systems to report the contents of awareness, then treating those reports as direct measurements of a unified experiential stream. Many implicitly presuppose what Dennett criticized as the Cartesian theater: a central, unitary locus where experience comes together for a single observer. Others claim metaphysical neutrality yet still embed theater-style assumptions, such as a canonical temporal ordering of conscious events or the existence of an internal original experience that verbal reports may approximate or distort. I need a reusable evaluation procedure my panel can apply to determine whether a given assay protocol is conceptually compatible with Dennett's multiple-drafts model — distributed, parallel processing with no central audience and no fact of the matter about which draft is canonical until later mechanisms fix a narrative — without requiring every reviewer to be a philosopher of mind.

  Please structure this as an ordered decision procedure: the specific questions a reviewer asks about the proposal in sequence, what counts as a sufficient answer at each stage, explicit stop points where the protocol either clears the bar, fails for conceptual incoherence, or must be handed to human judgment because the issue involves values rather than consistency, and clear flagging of where the procedure will misfire. Address in particular: how the protocol handles temporal sequencing of reported contents, since the multiple-drafts model denies a single timeline of consciousness; whether the protocol permits competing, unreconciled drafts of the same stimulus rather than forcing unified narrative reconstruction; how it treats post-hoc confabulation versus direct access without assuming a hidden theater; and how to evaluate protocols that claim to be purely behavioral and make no metaphysical commitments.

  Ground the distinctions in Dennett's actual framework — no central observer, no unique real draft prior to narrative fixation, and the idea that asking what was really experienced is often asking an ill-formed question — but translate them into operational criteria accessible to reviewers with only basic philosophy-of-mind background. Include a small set of test protocol descriptions the reviewer can apply, with worked examples showing both a passing case and a failing case. Explicitly mark the points where judgment cannot be eliminated. Finally, include one worked case where the procedure returns a negative verdict on a protocol that is otherwise methodologically rigorous and practically appealing — explain precisely why the conceptual flag is warranted despite the protocol's strengths — and write the response in polished American English.
reasoning: |-
  We are creating a decision procedure for evaluating phenomenal consciousness assays based on compatibility with Dennett's multiple-drafts model. The key principles from Dennett to operationalize are:
   1. No central observer (Cartesian theater) where experiences are presented.
   2. No unique, canonical "real" experience prior to the narrative fixation (i.e., the story the brain eventually tells).
   3. Temporal sequencing is not absolute but constructed in the narrative.
   4. The existence of multiple, parallel, and sometimes inconsistent drafts (interpretations) of the same stimulus.
   5. Reports (verbal or behavioral) are not approximations of an inner experience but rather the result of the narrative process; there is no "original" experience that is then reported.

   We structure the evaluation as an ordered decision tree. The reviewer will ask a sequence of questions. At each step, the answer must meet a sufficiency criterion. We define clear stop points: 
     - Pass: The protocol is compatible with the multiple-drafts model.
     - Fail: The protocol is conceptually incoherent with the multiple-drafts model.
     - Judgment: The issue requires human judgment (e.g., values, interpretation of ambiguous cases).

   Steps:

   Step 1: Check for Explicit Cartesian Theater Terminology
     - Question: Does the protocol explicitly refer to a "center of consciousness," "inner observer," "stage," "theater," "screen of consciousness," or any similar metaphor implying a central locus where experiences are presented?
     - Sufficient answer: If the proposal uses such terms in a way that is not merely metaphorical and that plays a functional role in the assay, then it fails. If the terms are used in a historical context or are explicitly disavowed, then it passes this step.
     - Stop: If the answer is "yes" (i.e., explicit and functional use), then the protocol fails. Otherwise, proceed.

   Step 2: Check for Implicit Cartesian Theater via Temporal Ordering
     - Question: Does the protocol assume or require that the temporal order of reported conscious experiences must match the temporal order of either (a) the external stimuli or (b) the neural processing in a way that implies a single, canonical timeline of consciousness?
     - Sufficient answer: The protocol must not treat temporal discrepancies (e.g., in simultaneity judgments, temporal order judgments, or apparent delays) as errors or distortions. Instead, it should treat temporal order as a constructed feature. 
          - If the protocol requires that the report must reflect the "true" time of experience (e.g., by correcting for neural delays or by requiring that the order of report matches the order of stimulus presentation) or if it uses such order as a baseline for measuring consciousness, then it fails.
          - If the protocol records temporal order without assuming it reflects a unique, pre-narrative timeline and without using it to infer an "actual" moment of consciousness, then it passes.
     - Stop: If the protocol fails, stop and mark as fail. Otherwise, proceed.

   Step 3: Check for Handling of Competing Drafts
     - Question: Does the protocol allow for the possibility of multiple, unreconciled, or inconsistent reports about a single stimulus or event? And does it avoid forcing a unified narrative when there is no such narrative fixed by the subject?
     - Sufficient answer: 
          - If the protocol requires subjects to produce a single, coherent report (without allowing for multiple, simultaneous, and potentially conflicting reports) and treats any inconsistency as error or noise, then it fails.
          - If the protocol allows for multiple reports (e.g., from different response modalities or at different times) without requiring reconciliation and without assuming that one report is more "veridical" to an inner experience, then it passes.
     - Stop: Fail if the requirement for a single unified report is present. Otherwise, proceed.

   Step 4: Check for Treatment of Reports (Confabulation vs. Direct Access)
     - Question: Does the protocol treat verbal or behavioral reports as direct readouts of a pre-existing conscious experience (i.e., as if the subject has privileged access to an internal state) or does it acknowledge that reports are a product of the narrative process and may include confabulation without an "original" to distort?
     - Sufficient answer:
          - If the protocol uses terms like "readout," "direct access," "inner perception," or if it describes reports as "approximations" of an inner experience (with the implication that there is an inner experience that is being approximated), then it fails.
          - If the protocol treats reports as the data of consciousness (i.e., the only thing we can measure and the only thing that matters) without positing a hidden experience behind them, then it passes.
     - Stop: Fail if the protocol assumes direct access to a hidden experience. Otherwise, proceed.

   Step 5: Evaluate Claims of Metaphysical Neutrality
     - Question: Does the protocol claim to be metaphysically neutral (e.g., purely behavioral) but then implicitly embed assumptions that contradict the multiple-drafts model?
     - Sufficient answer: We must check if the protocol, despite its claims, still operates as if there is a central theater. This step is more judgmental. We look for:
          - The protocol might use operational definitions that are consistent with multiple drafts (pass) or might use operational definitions that require a Cartesian theater (fail).
          - In particular, we look for the issues above (temporal ordering, unified narrative, direct access) even in a behavioral guise.
     - Stop: If the protocol is purely behavioral and avoids the pitfalls from Steps 1-4, then it passes. If it avoids explicit theater but in operation requires it, then it fails. If the answer is ambiguous, mark for human judgment.

   Step 6: Human Judgment Cases
     - If at any step the reviewer is unsure, or if the protocol is on the boundary, or if the issue involves values (e.g., the practical need for a unified report in a clinical setting) then the reviewer marks it for human judgment.

   Now, we provide test protocols with worked examples.

   Example 1: Passing Protocol (Compatible with Multiple Drafts)

     Protocol: "We present a rapid series of visual stimuli and ask subjects to press one of two buttons to indicate whether they saw a red or green flash. We also ask them to verbally report the color they saw. We record both the button press and the verbal report, and we note any discrepancies without attempting to reconcile them. We do not assume that the button press is more immediate or accurate than the verbal report. We also present stimuli in varying temporal orders and do not assume that the order of button presses must match the order of stimuli. We treat each response as a draft, and we analyze the conditions under which different responses are produced."

     Evaluation:
       Step 1: No explicit theater terms. Pass.
       Step 2: Does not require temporal order matching. Pass.
       Step 3: Allows multiple reports (button and verbal) without reconciliation. Pass.
       Step 4: Treats reports as data without assuming an inner experience. Pass.
       Step 5: It is behavioral and avoids the problematic assumptions. Pass.
     Overall: Pass.

   Example 2: Failing Protocol (Incompatible)

     Protocol: "We present two flashes of light in quick succession and ask the subject to report the order in which they appeared. We then measure the stimulus onset asynchrony (SOA) at which subjects report the order correctly 75% of the time. We use this to determine the minimum time required for conscious perception. We assume that when the subject reports the order correctly, they are accurately reporting their conscious experience, and when they are incorrect, their conscious experience was either absent or distorted. We also ask subjects to describe their experience and then code the descriptions for consistency with the stimulus order, treating any deviation as a distortion of the true experience."

     Evaluation:
       Step 1: No explicit theater terms? Pass Step 1.
       Step 2: The protocol requires that the report must match the stimulus order to be correct and uses this to define the timeline of consciousness. It assumes that the stimulus order is the benchmark for the true experience. This implies a canonical timeline. Fail at Step 2.

     Why fail? The multiple-drafts model denies that there is a single timeline of consciousness. The experience of order is constructed by the brain and may not match the stimulus order. The protocol treats mismatches as errors and uses them to infer the time of consciousness, which presupposes that there is a true time when the experience happened.

   Example 3: Protocol that Requires Human Judgment

     Protocol: "We ask subjects to view a short film and then immediately write a narrative report of what they experienced. We then code the report for consistency with the film's events. We assume that the narrative report reflects the subject's unified conscious experience of the film. We also ask them to press a button whenever they become aware of a particular event. We use the button presses to time-lock neural responses. We do not use any explicit theater metaphors."

     Evaluation:
       Step 1: Pass (no explicit theater).
       Step 2: The button presses assume a temporal locking to the event. But note: the multiple-drafts model does not deny that we can time-lock to a behavioral response, but it does deny that the button press necessarily reflects the moment of conscious experience. However, the protocol says it uses the button presses to time-lock neural responses, which is acceptable if it doesn't claim that this is the moment of consciousness. But then it also says the narrative report reflects the unified experience. This might be problematic.

       Step 3: The protocol requires a unified narrative report. It does not allow for multiple, unreconciled drafts. This might fail at Step 3. However, note that the multiple-drafts model does not deny that a unified narrative is eventually produced. The problem is forcing it immediately and without allowing for other drafts. But in the context of a film, the subject may have already constructed a narrative. So this is ambiguous.

       Step 4: The protocol says the report "reflects" the unified conscious experience, which implies that there is an inner experience that the report is mirroring. This might fail at Step 4.

       Given the ambiguity in Step 2 (temporal locking) and the issues in Steps 3 and 4, the reviewer might mark this for human judgment. In particular, the use of the button press might be acceptable if it is taken as a behavioral marker without metaphysical commitment, but the narrative report part is problematic.

     Overall: Mark for human judgment because the protocol is ambiguous and might be interpreted in a way that is compatible (if the narrative is taken as just another draft and the button press as a behavioral response) or incompatible (if taken as direct access to a unified experience at a time).

   Example 4: A Rigorous but Failing Protocol

     Protocol: "We use a high-density EEG setup to record brain activity while subjects perform a visual detection task. After each trial, we ask the subject to report whether they saw the target and to rate their confidence. We then use multivariate pattern analysis to decode the neural activity at each time point and correlate this with the subject's report. We assume that the report is a direct reflection of the conscious percept and that the time at which the neural pattern first matches the report is the moment of conscious access. We also require that the subject's report is unambiguous (they must choose one option) and we discard trials with inconsistent reports (e.g., high confidence but incorrect)."

     Why it's appealing: It uses advanced neuroimaging, rigorous statistical methods, and confidence ratings.

     Evaluation:
       Step 1: Pass (no explicit theater).
       Step 2: It assumes a moment of conscious access by correlating the neural pattern with the report and then taking the first time of match. This implies that there is a single moment when the conscious percept becomes available. But the multiple-drafts model says there is no single moment until the report fixes it. Moreover, it discards inconsistent reports, which might be multiple drafts in competition. So Step 3: It requires unambiguous reports and discards inconsistent ones. This forces a unified narrative and does not allow for multiple drafts. Also, Step 4: It treats the report as a direct reflection of the conscious percept (assumes direct access). Therefore, it fails at Step 3 and/or Step 4.

     Why the conceptual flag is warranted: The protocol is methodologically sound and practical, but it builds in the assumption that consciousness is a discrete event that happens at a specific time and that the report is a direct reflection of an inner state. This is incompatible with the multiple-drafts model, which denies both the single moment and the direct reflection (because the report is what fixes the narrative). The protocol might be useful for studying the neural correlates of report, but it cannot be considered an assay of phenomenal consciousness in a way that is compatible with Dennett's model.

   Conclusion:

   The decision procedure:

     Step 1: Explicit Cartesian theater? → If yes, fail.
     Step 2: Implied via temporal ordering? → If yes, fail.
     Step 3: Forces unified narrative? → If yes, fail.
     Step 4: Assumes direct access? → If yes, fail.
     Step 5: If claims metaphysical neutrality but operationally fails, then fail. Otherwise, pass. If ambiguous, go to Step 6.
     Step 6: If at any point the issue is unclear or involves values, mark for human judgment.

   Note: The procedure might misfire in cases where the protocol uses ambiguous language that could be interpreted in multiple ways. Also, the procedure is designed specifically for Dennett's model; it might reject protocols that are compatible with other models of consciousness.

   The response is written in polished American English.
answer: |-
  ### Dennett-Compatibility Evaluation Procedure for Phenomenal Consciousness Assays  
  **Purpose**: To assess whether a proposed assay protocol is conceptually compatible with Dennett's multiple-drafts model, which rejects the Cartesian theater (a central "observer" or "stage" for unified experience) and posits distributed, parallel processing where conscious narrative is fixed *after* the fact.  

  **Procedure Structure**:  
  Reviewers apply these questions sequentially. Stop at any step if a definitive pass/fail/judgment outcome is reached. If a step requires nuanced interpretation (e.g., ambiguous language, value-laden tradeoffs), flag for panel discussion.  

  ---

  #### **Step 1: Check for Explicit or Implicit Central Observer**  
  **Question**: Does the protocol describe reports as "readouts" of a unified internal state (e.g., "subject accesses their experience," "contents of awareness are presented")?  
  - **Pass Criterion**: No such language exists, or it explicitly disavows a central observer (e.g., "reports are behavioral outcomes, not glimpses of internal states").  
  - **Fail Criterion**: Language implies a privileged vantage point (e.g., "the subject observes their stream of consciousness," "inner perception").  
  - **Judgment Flag**: Metaphors like "theater" or "screen" appear but are contextualized as linguistic shorthand.  
  - **Misfire Warning**: May overly penalize colloquial phrasing if no functional role in the assay.  

  #### **Step 2: Assess Temporal Sequencing Assumptions**  
  **Question**: Does the protocol treat temporal order of reports as reflecting a *canonical timeline of conscious experience* (e.g., using stimulus order as ground truth, labeling report-sequence mismatches as "distortions")?  
  - **Pass Criterion**: Treats temporal order as experimentally constructed (e.g., "reports reflect narrative sequencing, not intrinsic timing"; allows asynchronous/parallel reports).  
  - **Fail Criterion**: Assumes a single timeline (e.g., "calculates neural delay to determine *true* conscious onset," "measures deviation from stimulus order").  
  - **Judgment Flag**: Temporal data is collected but not interpreted metaphysically (e.g., "timestamps track report latency, not experience").  
  - **Key Dennett Grounding**: No "real" temporal order exists prior to narrative fixation.  

  #### **Step 3: Check for Handling of Competing Drafts**  
  **Question**: Does the protocol force a *single, reconciled narrative* per stimulus (e.g., discarding inconsistent reports, averaging responses) instead of permitting unreconciled parallel drafts?  
  - **Pass Criterion**: Allows/document multiple, simultaneous, conflicting reports without reconciliation (e.g., "recorded all button-press/verbal mismatches"; no "correct" version imposed).  
  - **Fail Criterion**: Requires unified output (e.g., "subjects must resolve ambiguity before responding," "outliers excluded as noise").  
  - **Judgment Flag**: Competing drafts are logged but later reconciled for practicality (e.g., clinical applications).  
  - **Key Dennett Grounding**: Multiple drafts coexist; no "real" draft until narrative wins.  

  #### **Step 4: Evaluate Treatment of Reports vs. "Experience"**  
  **Question**: Does the protocol treat reports as *approximations of an original experience* (e.g., "reports may distort true phenomenology")?  
  - **Pass Criterion**: Treats reports as constitutive of the data (e.g., "verbal output *is* the conscious response"; no reference to a hidden "original").  
  - **Fail Criterion**: Positions reports as indirect proxies (e.g., "introspection accesses raw experience," "confabulation masks real perception").  
  - **Judgment Flag**: Neutral language (e.g., "report" without elaboration) in a purely operational protocol.  
  - **Key Dennett Grounding**: No "original" experience behind reports; confabulation is part of drafting.  

  #### **Step 5: Test Metaphysical Neutrality Claims**  
  **Question**: If the protocol claims metaphysical neutrality (e.g., "purely behavioral"), do its *operations* nonetheless imply a Cartesian theater (e.g., via Steps 2–4)?  
  - **Pass Criterion**: Operational definitions avoid all theater-like assumptions (e.g., temporal order = report order; conflicts = independent data streams).  
  - **Fail Criterion**: Neutral claims but theater-embedded methods (e.g., "no metaphysics" yet "corrects reports to stimulus timing").  
  - **Judgment Flag**: Methods are ambiguous; neutrality is asserted but untested.  
  - **Misfire Warning**: May pass protocols that are behaviorally identical but differ only in rhetoric.  

  #### **Final Stop Points**  
  - **Pass**: All steps cleared.  
  - **Fail**: One or more fail criteria met.  
  - **Judgment**: ≥1 judgment flag raised (requires panel debate on intent/pragmatics).  

  ---

  ### Test Protocols & Worked Examples  
  #### **Passing Example: Distributed Response Protocol**  
  **Description**: *Subjects see rapid letter sequences. They press one button upon seeing "X," another for "Y," and *simultaneously* speak the letter they see. All button/speech mismatches and response latencies are recorded without correction. No instructions imply "accuracy" to stimuli.*  
  - **Step 1**: No observer language → Pass.  
  - **Step 2**: Mismatches preserved; no canonical timeline → Pass.  
  - **Step 3**: Parallel drafts (button/speech) allowed → Pass.  
  - **Step 4**: Reports treated as primary data → Pass.  
  - **Step 5**: Behavioral with no hidden assumptions → Pass.  
  **Verdict**: ✅ Compatible.  

  #### **Failing Example: Temporal Reconciliation Protocol**  
  **Description**: *Subjects judge which of two lights flashed first. Reports are timestamped and "corrected" via neural lag estimates to determine "true conscious sequence." Inconsistent reports (e.g., "A then B" vs. "B then A") are excluded as "attentional lapses."*  
  - **Step 1**: No explicit theater → Pass.  
  - **Step 2**: "Corrects" reports to a "true" timeline; mismatches = errors → **Fail**.  
  *Stop here*.  
  **Why Fail?** Assumes a pre-narrative conscious timeline, violating Dennett’s core tenet.  

  #### **Judgment-Flagged Example: Post-Hoc Narrative Protocol**  
  **Description**: *After viewing a scene, subjects describe "what they experienced." Reports are coded for coherence, but neural data timestamps "key experiential moments." Claims neutrality.*  
  - **Step 1**: "Experienced" is ambiguous → Judgment (intent?).  
  - **Step 2**: "Key moments" timestamped → Judgment (implies canonical events?).  
  - **Step 3**: Coherence coding → Judgment (forces unity?).  
  **Verdict**: ⚠️ Panel judgment required.  

  ---

  ### Worked Case: Rigorous but Failing Protocol  
  **Protocol**: *Subjects hear masked tones. EEG measures "neural signatures of consciousness" at time T. Subjects later report tone identity. Trials with report-EEG mismatches are discarded. The assay identifies T as the "onset of conscious access."*  
  **Appeal**: Methodologically rigorous (EEG + report), high statistical power.  
  **Evaluation**:  
  - **Step 1**: "Conscious access" implies a moment of presentation → **Fail** (language implies theater).  
  - **Step 2**: Discards mismatches; "onset" assumes canonical timing → **Fail**.  
  - **Step 3**: Forces EEG/report unity → **Fail**.  
  - **Step 4**: Treats reports as approximations of neural "signatures" → **Fail**.  
  **Conceptual Flag Justification**: Despite empirical strengths, the protocol:  
  1. Presupposes a *time* when consciousness "happens" (denied by multiple drafts).  
  2. Treats neural data as a "truer" draft than reports (violates Dennett’s rejection of privileged access).  
  3. Eliminates discordance, ignoring parallel processing.  
  **Outcome**: ❌ Fail. *Rationale*: The assay’s validity hinges on Cartesian assumptions, rendering it incompatible regardless of practical utility.  

  ---  
  **Procedure Summary**: This sequence operationalizes Dennett’s framework (no center, no fixed drafts pre-narrative, no "real experience" behind reports) into testable criteria. Judgment flags ensure rigor without demanding philosophical expertise. Misfires are minimized by focusing on functional assumptions over terminology.
