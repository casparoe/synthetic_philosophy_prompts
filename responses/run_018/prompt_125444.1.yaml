answer: |-
  ### Culture Causality Decision Tree  
  *Based on a hiring algorithm trained on historic "productivity" data (embedding Protestant work ethic values like long hours), which now screens out candidates with care responsibilities or flexible work styles. Answer yes/no or A/B to find your position.*  

  ---

  **1. ROOT: In this case, do the *cultural values* embedded in the algorithm (e.g., "hard work = long hours") actively cause harm by excluding candidates?**  
  - **Yes** → Go to 2  
  - **No** → Go to 3  

  **2. For the values to be causal, must they be *consciously held or intended* by people (e.g., the algorithm’s designers)?**  
  - **Yes** → Go to 4  
  - **No** → Go to 5  

  **3. Is the exclusion purely driven by *material factors* (e.g., profit goals, efficiency, or technical constraints)?**  
  - **Yes** → **Materialist reduction**  
  - **No** → **Epiphenomenal culture**  

  **4. Can these consciously held values *override material conditions* (e.g., persist even if proven economically inefficient)?**  
  - **Yes** → **Hard Weberian**  
  - **No** → **Materialist reduction**  

  **5. Can *institutional inertia* (e.g., algorithms, laws, norms) sustain values and cause outcomes *without* conscious intent?**  
  - **Yes** → **Structural Feedback**  
  - **No** → **Materialist reduction**  

  ---

  ### Your Position Explained  
  - **Hard Weberian**: Values (like Protestant work ethic) are independent forces that shape society—even against material realities. *Example: "The algorithm’s bias exists because people still consciously believe in ‘old-school’ hustle."*  
  - **Materialist reduction**: Material conditions (money, tech, power) are the *real* causes; values are just a side effect. *Example: "The algorithm only cares about profit—values are excuses for exploitation."*  
  - **Epiphenomenal culture**: Values are passive byproducts (like smoke from a fire) with no real causality. *Example: "The exclusion is random chaos; ‘values’ just describe it post-hoc."*  
  - **Structural Feedback** (the hybrid): Institutions "bake in" values, which then cause outcomes *without* intent, via inertia. *Example: "The algorithm perpetuates bias because it’s trained on old data—no one needs to believe it today."*  

  ---

  ### Key Limitation  
  **This tree can’t cleanly separate:**  
  - **Materialist reduction vs. Structural Feedback** if you believe material factors *eventually* override institutions (e.g., "Inertia matters now, but capitalism will force change later"). Both end at "Materialist reduction" in the tree.  
  - *Why?* The tree prioritizes your view of *immediate* causality. In practice, these positions blur—materialists might concede short-term institutional power, while structuralists agree material forces win long-term.  

  *Tree tip: If you hit "Materialist reduction" from multiple paths, you likely see culture as secondary to economics/tech.*  

  ---  
  *Use this to reflect on your assumptions—not as dogma. Real-world cases (like AI bias) often mix all four!*
