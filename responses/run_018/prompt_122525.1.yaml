prompt: |-
  Hi — I write novels, and the one I'm working on right now keeps forcing me to work out what I actually think about everyday conventions, because half my scenes turn on a character either honouring or flouting one. I want someone to audit my position before I put a version of it in a character's mouth and get taken apart at a festival panel.

  Roughly where I've landed:

  (1) Queueing-type conventions are genuine moral obligations, not just etiquette. Pushing into a queue is *wrong*, not merely rude, because these are mutually beneficial coordination schemes and it's unfair to take the benefit while skipping the cost.

  (2) A visitor has to follow the local version specifically, not just any old version — "any consistent queue will do" is not good enough. Locals set the terms; I'm a guest.

  (3) Jaywalking is fine. Crossing against the light on an empty street isn't wrong at all, and I don't owe anybody anything for it. Traffic laws bind only when they're actually doing coordination work and someone is affected.

  (4) Tipping in the US is obligatory, and I think it's a different kind of thing from queueing: it isn't coordination, it's compensation for a wage structure that exploits servers. So I tip properly even in cities where the local tipping convention is weak or mean.

  (5) In places where tipping isn't the norm, I don't tip, and I dont think I do anything wrong — even though hospitality workers there are often badly paid too.

  (6) I won't follow a convention I think is morally bad (norms that rank people by caste, gender, age, whatever). Being a guest doesn't require that of me.

  (7) I also follow the local convention when it literally makes no difference to anybody — standing on the right of a completely empty escalator, in a country where that's the done thing. I'd feel like a jerk not to, even though nobody's affected and nobody's watching.

  Two scenes from the novel I keep testing these against. In the city it's set in, people hold a place in a queue by leaving an object in it — a shoe, a bag — and the locals insist a visitor has to honour the object the same as a person. And in that same city everybody crosses wherever they like, the drivers expect it, and it's against the law.

  What I want: go through the seven and tell me which pairs are really in tension and how badly, ordered by severity, with what would have to give in each case and what the cheapest repair would be. Tell me too which of the tensions only *look* like tensions and dissolve when you think about them properly — I've got a feeling at least one of these is fine as it stands, and I'd rather not throw away a commitment I don't have to. Please don't just flag all seven as problematic; I want to know which one I actually have to drop.

  And be clear about which bits of what you say are settled and which are genuinely contested among people who work on this sort of thing — don't present a contested view as if it were the consensus, say which claims you'd only give 60/40, and flag wether anything in your answer is more guess than argument.
reasoning: |-
  Okay, let me start by understanding what the user needs. They're a novelist working on a book where everyday conventions play a key role in scenes, and they've outlined seven positions on these conventions. They want an audit of these positions to ensure consistency before putting them into a character's dialogue. The main request is to identify tensions between these points, rank them by severity, suggest fixes, and note which are non-issues.

  First, I need to break down each of their seven points. Point 1 sees queueing as a moral obligation because it's a mutually beneficial coordination scheme. Point 2 emphasizes following local queueing norms strictly. Point 3 allows jaywalking when it affects no one. Point 4 views US tipping as obligatory due to wage exploitation. Point 5 says not tipping where it's not customary isn't wrong. Point 6 rejects immoral conventions regardless of being a guest. Point 7 follows conventions even when inconsequential.

  The user provided two novel scenes: one where a placeholder in a queue must be honored, and another where jaywalking is the norm despite being illegal. These scenarios test their principles.

  Looking for tensions, the first one that stands out is between Point 2 (follow local queueing norms) and Point 3 (jaywalking is fine if no one is affected). The inconsistency is in applying local conventions: why follow queue placeholders strictly but ignore jaywalking laws? The user argues that jaywalking laws aren't doing coordination work when the street is empty, but the queue placeholder is part of an active coordination scheme. The tension here is moderate. The fix is to refine Point 3 to emphasize functional coordination over legality, which the user might already be doing.

  Next, Point 4 (US tipping obligatory) vs. Point 5 (no tipping where not customary). This seems consistent because the obligation in Point 4 is based on compensating for exploitation, not the convention itself. Where there's no such wage structure, not tipping isn't wrong. This looks like a non-tension once you consider the underlying reasons.

  Then, Point 2 (strict local adherence) vs. Point 6 (reject immoral conventions). The user acknowledges this tension but limits it to morally bad norms. So if a local convention isn't immoral, Point 2 applies. This is manageable as long as the exceptions are clear. The placeholder queue scenario isn't immoral, so following it aligns with Point 2. No major issue here.

  Point 7 (follow conventions even when pointless) might conflict with Point 3. Why stand on the right of an empty escalator but jaywalk when safe? The user's justification for Point 7 is about feeling like a jerk, a personal discomfort, whereas Point 3 is about no moral obligation without harm. Since Point 7 is framed as personal rather than moral, there's no real tension. The user can keep both by clarifying that Point 7 is about personal feelings, not morality.

  Points 4 and 5 are consistent as explained. Points 1 and 2 support each other. Points 6 and 7: rejecting immoral norms vs. following harmless ones—no conflict.

  Severity ranking: The biggest tension is between Points 2 and 3 (local adherence vs. jaywalking), then Point 2 vs. Point 6 (but it's resolved by the immorality exception). The others are non-tensions or manageable.

  The user needs to adjust Point 3 slightly to focus on functional coordination. They might refine Point 7 to distinguish moral obligations from personal preferences. The placeholder queue scene tests Point 2, and it holds as long as the convention isn't deemed immoral. The jaywalking scene aligns with the revised Point 3.

  Also, noting where academic views differ: the moral weight of conventions (Points 1 and 7) is debated. Tipping's obligatoriness (Point 4) is agreed upon but for different reasons. The user's take on jaywalking (Point 3) has support but requires clarity on coordination function.

  In conclusion, the only significant tension is between Points 2 and 3, fixable by refining Point 3. Other apparent tensions dissolve upon closer look. The user doesn't need to drop any points but should clarify the reasoning behind jaywalking and distinguish between moral and personal in Point 7.
answer: |-
  Here's an audit of your seven positions, analyzing tensions, severity, repairs, and non-tensions, grounded in moral/political philosophy (conventions, fairness, coordination, exploitation) and signaling where views are contested. Your core framework is coherent, but one tension requires adjustment.

  ### Tension Analysis (Ordered by Severity)

  1.  **Severe Tension: Point 2 (Strict Local Adherence) vs. Point 3 (Jaywalking is Fine)**
      *   **The Tension:** Point 2 insists you follow the *local specific* convention (e.g., placeholder queues) as a guest, even if it seems arbitrary. Point 3 rejects following the local specific convention (jaywalking law) because it's not doing coordination work *in that instance* and you judge it unnecessary.
      *   **Why it's Severe:** This directly contradicts the principle of "locals set the terms; I'm a guest" applied in Point 2. Why is the queue placeholder convention binding *because it's local*, but the jaywalking law (also local) is dismissible *because you judge it non-functional*? Both are local coordination attempts. Your justification for Point 3 ("not doing coordination work") is an *external judgment* overriding local convention – precisely what Point 2 forbids for queues.
      *   **What Has to Give:** Either Point 2's rigidity or Point 3's justification. Point 3's core intuition (crossing empty streets isn't wrong) is strong, but its conflict with Point 2 stems from *how* it rejects the local norm.
      *   **Cheapest Repair:** **Reframe Point 3.** Instead of rejecting the local convention *per se*, ground it in the *functional justification* from Point 1. Argue: "Conventions create moral obligations *only when they are actually facilitating beneficial coordination and imposing fairness costs*. Jaywalking laws on an empty street fail this test; they are mere legalism without the underlying coordination function. Placeholder queues *do* serve this function (preventing disputes, saving time) and involve fairness costs (holding the spot)." This keeps the *outcome* of Point 3 but aligns its *reasoning* with Points 1 & 2. You're not flouting the local convention *arbitrarily*; you're arguing *this specific instance* doesn't meet the condition for generating a moral obligation. (This view has strong support - e.g., David Hume's distinction between conventions grounded in utility vs. mere custom, or modern rule-consequentialism).
      *   **Academic Status:** Highly contested. Legal positivists might argue the law *itself* creates an obligation regardless of function. Others (like your view, aligned with some functionalist/consequentialist perspectives) argue obligation stems from the beneficial coordination achieved. (60/40 leaning towards functionalism being a necessary condition for *moral* obligation from convention, but 40% strongly defends rule-following/legalism).

  2.  **Moderate Tension (Easily Managed): Point 2 (Strict Local Adherence) vs. Point 6 (Reject Morally Bad Conventions)**
      *   **The Tension:** Point 2 says "follow local conventions as a guest." Point 6 says "don't follow morally bad local conventions." What if a local convention *is* morally bad (by your lights)?
      *   **Why it's Moderate/Managed:** You explicitly carve out this exception in Point 6 ("norms that rank people by caste..."). This is a necessary and widely accepted limitation on cultural relativism or guest obligations. Your placeholder queue scene doesn't involve a morally bad convention (presumably), so Point 2 applies. If the queue convention *was* morally bad (e.g., separate lines by race), Point 6 would override Point 2. The tension is acknowledged and resolved *within* your framework.
      *   **What Has to Give:** Nothing *if* your definition of "morally bad" is clear and consistently applied. The placeholder queue test poses no problem here.
      *   **Cheapest Repair:** None needed. This is a healthy tension handled by the exception clause. Just ensure your character articulates *why* a convention is "morally bad" if it comes up.
      *   **Academic Status:** Widely settled that moral obligations don't require complicity in clear injustice (e.g., Bernard Williams on "moral luck," critiques of strong cultural relativism). Consensus that basic norms against discrimination override local convention. (80/20).

  3.  **Apparent Tension (Non-Tension): Point 4 (US Tipping Obligatory) vs. Point 5 (No Tip Where Not Norm)**
      *   **The Apparent Tension:** You tip in the US due to exploitation, but not elsewhere even if workers are badly paid. Isn't that inconsistent?
      *   **Why it Dissolves:** Your justification for Point 4 is **specific and structural**: tipping is obligatory *because* it compensates for an *exploitative wage system designed around tips*. Point 5 notes that where this *specific structural exploitation via wages* doesn't exist, the *moral reason* for tipping vanishes, even if wages are low. Your obligation stems from not participating in/furthering *that specific exploitation*, not from low wages *per se*. You might have other obligations (charity, political action) re: low wages globally, but tipping isn't the mechanism.
      *   **Academic Status:** The *exploitation* argument for US tipping obligation is common and strong (e.g., drawing on Marxian or liberal theories of exploitation/fair exchange). Whether low wages *without* a tip-dependent structure constitute "exploitation" requiring *tipping* specifically is much less supported. Your distinction holds water. (70/30 in favor of your framing being coherent and defensible).

  4.  **Apparent Tension (Non-Tension): Point 3 (Jaywalking Fine) vs. Point 7 (Follow Convention Even When Pointless)**
      *   **The Apparent Tension:** If jaywalking is fine when harmless (Point 3), why follow the escalator convention when also harmless (Point 7)? Isn't that arbitrary?
      *   **Why it Dissolves:** Point 7 is driven by **personal feeling/discomfort** ("I'd feel like a jerk") and perhaps a *very weak* notion of respect for shared patterns. Point 3 is a statement about **moral obligation** ("isn't wrong at all, and I don't owe anybody anything"). You readily admit Point 7 isn't about a strong moral obligation ("nobody's affected"). There's no contradiction between feeling like a jerk for a minor, harmless breach of convention (escalator) and believing there's no moral obligation to follow a different, non-functional rule (empty-street jaywalking law). One is psychology/social comfort, the other is moral philosophy.
      *   **Academic Status:** Distinguishing social discomfort/politeness from genuine moral obligation is standard (e.g., etiquette vs. ethics). Point 7 falls squarely into the realm of social psychology/politeness theory, not core moral philosophy. No significant tension. (90/10).

  ### Non-Tensions & Supporting Pairs

  *   **Point 1 & Point 2 Support Each Other:** Point 1 justifies queueing norms morally (coordination/fairness). Point 2 logically extends this: for the coordination to work *here*, you need to follow *this specific local implementation* (placeholder queues). "Any consistent queue" wouldn't solve the coordination problem *in this specific context*.
  *   **Point 4 & Point 5 are Consistent:** As argued above, the obligation in Point 4 arises from a specific structural injustice absent in Point 5.
  *   **Point 6 & Point 7:** Rejecting immoral norms vs. following harmless ones for comfort pose no conflict.
  *   **The Placeholder Queue Scene:** Tests Point 2 directly. Your framework holds: it's a local coordination scheme (Point 1), not immoral (Point 6), so as a guest (Point 2), you follow it. The "cheapest repair" for Point 3 (focusing on functional coordination) makes your *rejection* of jaywalking laws in the other scene consistent: the law exists but isn't *functioning* as coordination in that context (empty street), so no moral obligation binds you. Locals flouting it confirms its non-functionality *as coordination* in practice, even if legally required.

  ### Summary & Recommendations

  1.  **Must Refine:** **Point 3 (Jaywalking)** is the only point requiring revision to resolve the severe tension with Point 2. **Cheapest Repair:** Ground the permissibility in the *lack of functional coordination benefit/unfairness in that specific instance*, not just "it's fine." This aligns with the core principle of Points 1 & 2. You keep the action (jaywalking on an empty street) but justify it within your moral framework for conventions. *Drop the claim "I don't owe anybody anything for it" if the local law exists and someone* could *be affected (e.g., a cop enforcing it creates a cost). Focus on the lack of coordination/fairness impact.*
  2.  **Manage Explicitly:** The tension between Point 2 and Point 6 is real but **already managed** by your exception clause. Just ensure clarity on what constitutes "morally bad."
  3.  **Non-Tensions:** The apparent tensions between Points 4 & 5 and Points 3 & 7 **dissolve** under scrutiny. Points 1, 2, 4, 5, 6, and 7 (as a psychological point) are **consistent** as stated, *after* refining Point 3.
  4.  **Character Armor:** With Point 3 refined, your character can robustly defend both honoring placeholder queues ("It's their functional system, I'm a guest, it's fair") and jaywalking in the city where it's the norm despite the law ("The law isn't doing any real coordination work here; everyone coordinates fine without it, including the drivers. Following it now would be pointless legalism, not moral coordination.").

  **Overall:** Your framework is well-reasoned and largely coherent. The only significant philosophical cost is refining Point 3 to explicitly link the permissibility of flouting a local rule to the *absence of the functional coordination/fairness justification* that underpins your other conventions. This strengthens, rather than weakens, your position. You don't need to abandon any core commitment, just clarify the foundation of one. Good luck with the festival panel – your reasoning is already stronger than most!
