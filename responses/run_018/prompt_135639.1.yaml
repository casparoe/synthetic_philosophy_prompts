  Let me check if any existing concepts fit: Motte-and-bailey comes closest, but that's usually about retreating between two different claims (strong vs weak). Here it's the same claim with shifting epistemic weight. Epistemic injustice feels adjacent but not quite right - this is more about argumentative bad faith than systemic oppression. 

  Ah! The key might be focusing on the functional duality of "KNOW" in this context. When attacking: it's a performative speech act (illocutionary force) to compel action. When defending: it becomes a hedged proposition (locutionary content). That distinction might explain why it feels different from ordinary inconsistency.

  The user seems philosophically savvy - they already recognize this isn't simple lying or changing minds. They're probing a specific rhetorical phenomenon. I should emphasize how this differs from: 
  - Regular inconsistency (which lacks the tactical switching) 
  - Ordinary belief revision (which is time-separated) 
  - Pascal's wager (which owns the uncertainty)

  For naming... since no perfect term exists, maybe "epistemic shape-shifting"? Or "certainty laundering"? Though the user might enjoy coining their own phrase. The important thing is capturing that Janus-faced quality - weaponized certainty transforming into defensive uncertainty.

  Also noting the user's frustration with bad faith arguments. Might be worth subtly validating that while staying analytical. The emotional subtext here is about intellectual dishonesty in heated debates.
answer: |-
  That's an incredibly sharp observation of a common rhetorical pattern! Philosophers *have* grappled with this, though there isn't one universally agreed-upon name. Here's a breakdown of the concepts involved and how they relate to your description:

  1.  **The Core Issue: Strategic Ambiguity / Shifting Epistemic Stance:**
      *   The fundamental trick is exploiting the ambiguity in the word "know." In everyday language (and especially in persuasive rhetoric), "we KNOW" carries immense **performative force** – it shuts down doubt, signals group solidarity, demands action, and implies settled, undeniable truth.
      *   When challenged on *epistemological grounds* (justification, evidence, certainty), the speaker retreats to a much weaker, **philosophical definition** of "know" (requiring absolute, indefeasible certainty, which is often impossible). They switch from the *rhetorical/pragmatic* use to a *hyper-strict* philosophical use.
      *   This isn't strictly lying if they genuinely hold the belief with strong conviction (the "we should act" part) but strategically misrepresent the *strength of the justification* depending on the context.

  2.  **Key Philosophical Concepts & Comparisons:**
      *   **Motte-and-Bailey Fallacy (Closest Fit):**
          *   **Motte:** A defensible, often trivial, or uncontroversial claim (e.g., "We can't be *absolutely certain*, but there's strong evidence suggesting X and we should act cautiously/prudently").
          *   **Bailey:** An exciting, controversial, or actionable claim that is difficult to defend (e.g., "We KNOW X is true beyond any doubt!").
          *   **How it Works:** The speaker occupies the exciting but indefensible "Bailey" when rallying support ("We KNOW!"). When challenged, they retreat to the easily defensible "Motte" ("Well, nobody can be *absolutely* certain..."). Your "bat" is the Bailey; your "pillow" is the Motte. It's a *doctrine* or *position* that strategically shifts between strong and weak interpretations.
          *   **Why it fits:** It perfectly captures the *tactical retreat* from an ambitious claim to a weaker one under pressure, using the *same terminology* ambiguously. The speaker benefits from the rhetorical power of the strong claim without bearing the burden of proof for it.
      *   **Epistemic Bad Faith / Intellectual Dishonesty:** This describes the *attitude* of the speaker. They are using language not primarily to convey truth or seek understanding, but to manipulate their audience and avoid accountability. They prioritize persuasion or group cohesion over epistemic rigor. The switch between "attack mode" (strong claim) and "defense mode" (weak claim) exemplifies this.
      *   **Conceptual Engineering / Exploitation:** The speaker is "engineering" the concept of "knowledge" for their immediate purpose. In persuasion, they inflate it; under scrutiny, they deflate it. They exploit the flexibility of the word.
      *   **Pragmatic Encroachment (Adjacent):** This is the legitimate philosophical view that whether we *attribute* "knowledge" can depend on practical stakes (e.g., "I know the ice is thick enough to walk on" might be acceptable in low stakes, but not when deciding to drive a truck on it). While related to context-sensitivity, your example involves *misusing* this sensitivity dishonestly, not a legitimate application of it.

  3.  **How it Differs from Simple Inconsistency or Changing Your Mind:**
      *   **Inconsistency:** Simple inconsistency means holding genuinely contradictory beliefs simultaneously without noticing or resolving the conflict (e.g., believing A and Not-A). In your case, the speaker *isn't* necessarily holding contradictory beliefs *at the level of core conviction* ("X is likely true and we should act"). The contradiction is in the *strength of the justification claimed* via the word "know."
      *   **Changing Your Mind:** Changing your mind involves a genuine shift in belief over time, often prompted by new evidence or argument. In your scenario, the shift happens *instantly* within the *same conversation* and is purely *tactical* based on whether the speaker is attacking or defending. The core belief ("we should act") remains constant; only the epistemic packaging changes to suit the moment. It's a *rhetorical dodge*, not a sincere revision.
      *   **Lying:** Lying involves intentionally stating something one believes to be false. While the *strength* of the claim ("KNOW" vs. "strongly believe") is misrepresented, the core proposition (X is true/worth acting on) *is* believed. It's a lie about the *degree of certainty*, not necessarily the core fact (though that can happen too).

  4.  **What to Call It:**
      *   **Most Accurate:** **Motte-and-Bailey Maneuver with "Knowledge"**. This explicitly names the fallacy and the specific concept being manipulated.
      *   **Descriptive:** **Epistemic Doublespeak** or **Rhetorical Certainty-Shifting**. Highlights the strategic switching of meanings.
      *   **Punchy:** **The Know-Switch Dodge** or **Certainty Laundering**. Captures the quick flip and the "cleaning" of the claim under scrutiny.
      *   **Technical:** **Contextual Epistemic Inconsistency** or **Strategic Ambiguity in Knowledge Attribution**.

  **In essence:** You've brilliantly identified a common instance of **Motte-and-Bailey reasoning**, specifically targeting the concept of "knowledge." The speaker uses the strong, rallying cry of "We KNOW!" (the indefensible Bailey) to motivate action, but when challenged on the justification for that certainty, they retreat to the weak, easily defensible position of "Well, absolute certainty is impossible, but..." (the Motte). It's a form of **epistemic bad faith** enabled by the **strategic ambiguity** of the word "know" in different conversational contexts. It's distinct from simple inconsistency or changing your mind because it's a *tactical, instantaneous shift* in epistemic claim strength serving rhetorical purposes, not a genuine shift in core belief or a failure to resolve logical contradictions.
