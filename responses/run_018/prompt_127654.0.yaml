answer: |-
  1. **Setup and roles**: Split your 8 participants into two teams: 4 “Historians” (judging past letters) and 4 “Shadow Archivists” (secretly tracking modern standards used); provide 4 fabricated 1920s-style letter excerpts (e.g., calling anxiety "laziness" or depression "weak character").  

  2. **Rules and payoff**: Historians earn group applause (the payoff) by identifying and condemning "unethical viewpoints" in the letters; Shadow Archivists *only* record the exact modern ethical terms/phrases Historians use (e.g., "mental health stigma," "neurodiversity acceptance").  

  3. **Hidden twist**: After 20 minutes, pause and force Historians to defend *why* the past "should have known better" using *only* the Shadow Archivists’ list; confront them with how they weaponized unspoken 2020s values as a universal benchmark.  

  4. **Debrief**: Map Shadow Archivists’ lists to presentism ("you built a shadow archive of today’s ideals"); predict first-run chaos like Historians over-condemning or Shadow Archivists missing subtle biases.  

  5. **Missing feature**: This can’t replicate how presentism **flattens historical empathy**—you’ll need to verbally highlight how judging the past blocks understanding *their* context-driven choices.
