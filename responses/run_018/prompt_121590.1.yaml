  We are translating anthropic reasoning problems (specifically the debate between Self-Sampling Assumption, SSA, and Self-Indication Assumption, SIA) into the framework of survey sampling. We'll define the key components: the sampling frame, inclusion probabilities, Horvitz-Thompson weights, and the distinction between design-based and model-based inference.

  ### Background on Anthropic Reasoning
  - **Self-Sampling Assumption (SSA)**: You should reason as if you are a random sample from the set of all observers (or all observer-moments) in your reference class.
  - **Self-Indication Assumption (SIA)**: The fact that you exist gives you evidence that there are many observers (because it's more likely that you would exist in a world with many observers). This leads to a bias towards larger populations.

  A classic example is the "presumptuous philosopher" argument: if a theory predicts a large number of observers, then under SIA, the mere fact that you exist is strong evidence for that theory (even if the theory is otherwise less plausible). SSA avoids this by not conditioning on your own existence in a way that favors large populations.

  ### Translation to Survey Sampling
  We consider a scenario where we are trying to estimate the total number of observers in the universe, or the probability of a particular theory about the number of observers.

  1. **Sampling Frame**:
     - In anthropic reasoning, the frame is the set of all possible observers (or observer-moments) that could exist. However, note that the frame is not fixed a priori because we don't know which theory of the universe is true (i.e., we don't know how many observers there actually are). 
     - This is a key difference: in survey sampling, the frame is fixed by design. In anthropic reasoning, the frame is theory-dependent.

  2. **Inclusion Probabilities**:
     - Under SSA: Every observer in the frame (for a given theory) has an equal probability of being sampled. If there are `N` observers in a particular universe, then the inclusion probability for each observer is `1/N` (if we are taking one sample). 
     - Under SIA: The inclusion probability for an observer is proportional to the total number of observers in the universe. Why? Because SIA assumes that the probability of being sampled is proportional to the total number of observers. In other words, if there are two theories, one with `N1` observers and one with `N2` observers, then the probability of being a particular observer in the first theory is not `1/N1` but rather `N1/(N1+N2)`? Actually, that's not quite right. Let's think again.

     Actually, SIA is often stated as: the probability of finding yourself in a universe with `N` observers is proportional to `N` times the prior probability of that universe. This means that the inclusion probability for an observer in a universe of size `N` is not uniform across theories? We have to be careful.

  3. **Horvitz-Thompson Weights**:
     - In design-based inference, the Horvitz-Thompson estimator weights each sampled unit by the inverse of its inclusion probability to get an unbiased estimate of a population total.
     - In anthropic reasoning, we are not estimating a population total in the usual sense. Instead, we are updating our beliefs about which theory (i.e., which population size) is true.

     Let `T` be a theory that postulates `N_T` observers. We want to compute the posterior probability of `T` given that we exist (i.e., we have been sampled).

  4. **Prior over the number of observers**:
     - We have a prior distribution over theories, each of which specifies a number of observers (or a distribution over the number of observers). Let `P(T)` be the prior probability of theory `T`.

  ### Formalizing SSA and SIA
  Consider two theories: `T1` and `T2`, with `N1` and `N2` observers respectively.

  - **SSA**:
     - The probability of being a particular observer in `T1` is `1/N1` (if we are in `T1`). Similarly for `T2`.
     - The probability that we exist (i.e., that we are some observer) in `T1` is 1 (because if `T1` is true, then all `N1` observers exist). But note: the probability that we are a specific observer is `1/N1` under `T1`.
     - Therefore, the likelihood of our observation (i.e., being this specific observer) under `T1` is `1/N1`.
     - By Bayes' theorem:
          P(T1 | we are this observer) = [ P(we are this observer | T1) * P(T1) ] / [ ... ]
          = [ (1/N1) * P(T1) ] / [ (1/N1)*P(T1) + (1/N2)*P(T2) ]

     However, note that in the typical Doomsday argument or presumptuous philosopher, we are not a specific observer but just the fact that we exist. So we might condition on the fact that we are any observer. In that case, the likelihood of our existence under `T1` is 1 (because if `T1` is true, there are observers and we are one of them). Then we get:
          P(T1 | we exist) = P(T1)   [if we condition on being any observer?]

     But wait, the standard Doomsday argument conditions on being a particular birth rank? Actually, the reference class matters.

     Let's clarify: In the Doomsday argument, we condition on our birth rank (say, we are the `n`-th human). Then the likelihood of observing birth rank `n` under a theory `T` that says total humans will be `N` is:
          P(our rank = n | T) = 1/N   for n=1,2,...,N.

     This is SSA.

  - **SIA**:
     - The idea is that the fact that we exist is more likely if there are more observers. So the likelihood of our existence (as an observer) is proportional to `N_T` (the number of observers under `T`). 
     - Therefore, the likelihood of our existence under `T` is proportional to `N_T`. 
          P(we exist | T) ∝ N_T
     - Then by Bayes:
          P(T | we exist) ∝ P(we exist | T) * P(T) ∝ N_T * P(T)

     This is the SIA update.

  ### Translation to Survey Sampling
  - **Frame**: The frame is the set of all possible observers that could exist across all possible theories. But note: this frame is not fixed because we don't know which theories are true. In survey sampling, the frame is fixed. So this is a fudge.

  - **Inclusion Probabilities**:
     - Under SSA: For a fixed theory `T`, the inclusion probability of a specific observer is `1/N_T`. But when we condition on our existence (without specifying which observer we are) then we are effectively using a frame that includes all observers from the true theory (which we don't know). 
     - Under SIA: The inclusion probability for an observer in theory `T` is proportional to `N_T`? Actually, in the entire frame (across theories) we have to assign inclusion probabilities. But note: the frame is the set of all possible observers in all possible universes? Then the inclusion probability for an observer in `T` would be `N_T * P(T)` divided by the total number of possible observers? Actually, it's more about the probability of being sampled given the theory.

    Alternatively, we can think of SIA as a model-based approach that uses a different sampling design: the probability of selecting a particular universe (theory) is proportional to the number of observers in it? Then, within the universe, we select an observer uniformly.

    So the two-stage sampling:
      1. Select a theory `T` with probability proportional to `N_T * P(T)` (but note: `P(T)` is our prior, so this is not an objective design). 
      2. Then select an observer uniformly from the `N_T` observers in `T`.

    Then the inclusion probability of a particular observer in `T` is:
          π_i = P(select T) * (1/N_T) ∝ [ (N_T * P(T)) / (sum_{T'} N_{T'} P(T')) ] * (1/N_T) = P(T) / (sum_{T'} N_{T'} P(T'))

    So the inclusion probability for every observer (across all theories) is proportional to the prior probability of their theory. 

    But note: in SIA, we condition on our existence. In the above two-stage design, we have already selected an observer. Then the probability that we are in theory `T` is:
          P(T | we are selected) ∝ P(select an observer from T) 
          = [P(T) * N_T] / [sum_{T'} P(T') * N_{T'}]

    This matches the SIA update.

    Under SSA, the two-stage design might be:
      1. Select a theory `T` with probability `P(T)` (the prior).
      2. Then select an observer uniformly from `T`.

    Then the inclusion probability of an observer in `T` is `P(T) * (1/N_T)`.

    Then the probability of being in theory `T` given we are selected is:
          P(T | we are selected) ∝ P(select an observer from T) 
          = P(T) * (1/N_T) 
          normalized by the sum over T'.

    This gives:
          P(T | we are selected) = [ P(T) / N_T ] / [ sum_{T'} P(T') / N_{T'} ]

    This is the SSA update (for the case where we condition on being a specific observer?).

    But note: in the Doomsday argument, we condition on our birth rank (which is specific). So if we are a specific observer, then SSA gives the update above. However, if we condition only on the fact that we are an observer (without being specific), then under SSA we have:

          P(we are an observer | T) = 1

    so then the posterior is the same as the prior.

    So the conditionality matters.

  ### Residue Report
  1. **What survives the translation**:
     - The concept of a sampling frame (the set of all possible observers) can be defined, though it is theory-dependent and not fixed.
     - Inclusion probabilities are well-defined under each theory and under each assumption (SSA and SIA).
     - The Horvitz-Thompson estimator isn't directly applicable because we are not estimating a population total but updating beliefs about theories. However, the weighting by the inverse of the inclusion probability is analogous to the Bayesian update.

  2. **What only fits if you fudge it**:
     - The fixed frame: in survey sampling, the frame is fixed by design. In anthropic reasoning, the frame is not fixed because we don't know which theory is true. We have to consider a super-frame that includes all possible observers from all theories, but then the inclusion probabilities are defined jointly over the theory and the observer. This is a two-stage sampling design, which is model-based because the first stage (selecting the theory) is governed by a prior.
     - The inclusion probabilities in anthropic reasoning are not known to the observer because they depend on the true theory. In survey sampling, the inclusion probabilities are designed and known.

  3. **What has no counterpart**:
     - The first-personal bit: the fact that you are *this* observer. In survey sampling, we don't condition on the identity of the sampled unit. We just have a sample. But in anthropic reasoning, the fact that you are this specific observer (with a specific birth rank, for example) is the data. This specific identification is not part of standard survey sampling.
     - The reference class problem: in survey sampling, the frame is fixed by design. In anthropic reasoning, the choice of which observers to include in the frame (the reference class) is a philosophical problem. Your guess is correct: the reference class problem has no counterpart in survey sampling because the frame is fixed by design. And the first-personal bit also has no counterpart.

  ### The Eligibility Problem vs. Reference Class Problem
  You describe the "eligibility problem": the frame is chosen for different purposes (predicting what happens next vs. explaining why the evidence looks the way it does). 

  In anthropic reasoning, the reference class problem is: which set of observers should we consider ourselves to be a random sample from? For example, all humans? All sentient beings? All observer-moments?

  The eligibility problem you describe is similar: it's about defining the frame appropriately for the purpose of the survey. 

  In anthropic reasoning, the choice of reference class is similarly purpose-dependent? For example, if we are concerned with the survival of humanity, we might use a reference class of humans. If we are concerned with the future of conscious life, we might include all conscious beings.

  So the eligibility problem in anthropic reasoning is essentially the reference class problem. There isn't a clear distinction. However, note that in anthropic reasoning, the reference class problem is more acute because there isn't an external designer: we have to choose a reference class without a clear objective criterion.

  ### Design-Based vs. Model-Based Anthropic Estimates
  You ask: is there any design-based anthropic estimate that holds up no matter what prior you have over the number of observers?

  In design-based inference, we rely on the known sampling design (and the fixed frame) to make inferences that are independent of models for the data. But in anthropic reasoning, the sampling design itself is unknown and debated (SSA vs. SIA). Moreover, the frame is not fixed.

  Therefore, every anthropic argument must be model-based because:
  - We have to model the frame (which observers exist) and the inclusion mechanism (SSA or SIA).
  - We also need a prior over the theories (which includes the prior over the number of observers).

  Without a prior, we cannot update our beliefs. Without a model for how we came to be sampled (SSA or SIA), we cannot compute the likelihood.

  So, in conclusion, there is no design-based anthropic estimate. All anthropic arguments are model-based.

  ### Summary
  - **SSA** corresponds to a two-stage sampling design: first, select a theory `T` with probability `P(T)`; then, select an observer uniformly from the `N_T` observers in `T`.
  - **SIA** corresponds to: select a theory `T` with probability proportional to `N_T * P(T)`, then select an observer uniformly from `T`.
  - The frame (all possible observers across theories) is not fixed and is theory-dependent, which is a key difference from survey sampling.
  - The first-personal bit (being this specific observer) and the reference class problem (which observers to include) have no counterpart in survey sampling because the frame in survey sampling is fixed by design and we don't condition on the identity of the sample.
  - The eligibility problem in anthropic reasoning is essentially the reference class problem, and it is not distinct.
  - Every anthropic argument is model-based; there is no design-based version that avoids the prior.

  Your guess was correct: the first-personal bit and the reference class problem have no counterpart in survey sampling. And the eligibility problem is just the reference class problem.
answer: |-
  ### Translation of Anthropic Reasoning to Survey Sampling Concepts

  #### Core Concepts
  1. **Sampling Frame**: The set of all possible observers (or observer-moments) across all possible universes/theories. Unlike your work, this frame is **not fixed**—it depends on the theory (e.g., "small universe" vs. "large universe" theories). Philosophers debate its boundaries (the "reference class problem").
  2. **Inclusion Probability**: 
     - **SSA (Self-Sampling Assumption)**: Uniform probability. If there are \(N\) observers, \(\pi_i = \frac{1}{N}\) for all \(i\) in the frame *for a given theory*.  
     - **SIA (Self-Indication Assumption)**: Non-uniform probability. \(\pi_i \propto N_T\) (where \(N_T\) is the total observers under theory \(T\)). Larger universes have higher inclusion probabilities.
  3. **Estimator**: The posterior probability of a theory \(T\) (e.g., "universe has \(N_T\) observers"). Uses Bayes' theorem:  
     \[
     P(T \mid \text{you exist}) \propto P(\text{you exist} \mid T) \cdot P(T).
     \]
     - **SSA**: \(P(\text{you exist} \mid T) = \frac{1}{N_T}\) (inverse of frame size).  
     - **SIA**: \(P(\text{you exist} \mid T) \propto N_T\) (proportional to frame size).  
  4. **Horvitz-Thompson (HT) Weights**:  
     - **SSA**: Weight \(w_i = \frac{1}{\pi_i} = N_T\). Yields unbiased estimates *for a fixed frame*.  
     - **SIA**: Weight \(w_i \propto \frac{1}{N_T}\). Biased toward larger \(N_T\) if the frame is theory-dependent.  
  5. **Prior**: \(P(T)\), the prior probability over theories (e.g., \(P(N_T = 10^{10})\) vs. \(P(N_T = 10^{100})\)). Critical for SIA's sensitivity to large \(N_T\).

  #### Presumptuous Philosopher Argument (SIA's Problem)
  - **SIA Claim**: "I exist" \(\rightarrow\) evidence for large \(N_T\) (since \(\pi_i \propto N_T\)).  
  - **Sampling Analogy**:  
    - Imagine two frames:  
      - Frame A: \(N_A = 10^{10}\) observers (small universe).  
      - Frame B: \(N_B = 10^{100}\) observers (large universe).  
    - **SIA**: Being sampled implies \(\pi_i^{\text{SIA}} \propto N_T\), so \(P(\text{Frame B} \mid \text{sampled}) \gg P(\text{Frame A} \mid \text{sampled})\) even if \(P(\text{Frame A}) \gg P(\text{Frame B})\) a priori.  
    - **Flaw**: Assumes the frame with larger \(N_T\) dominates—ignores that the frame is theory-dependent and not design-controlled.  

  ---

  ### Residue Report: What Translates, What Fudges, What Has No Counterpart
  | **Aspect**               | **Status**              | **Explanation**                                                                 |
  |--------------------------|-------------------------|--------------------------------------------------------------------------------|
  | **Sampling Frame**       | Fudged                  | In your work, frames are fixed by design. In anthropics, frames are theory-dependent and contested (reference class problem). |
  | **Inclusion Probability** | Translates             | \(\pi_i\) is defined for both (uniform for SSA, size-biased for SIA).            |
  | **HT Weights**           | Partially fudged       | HT assumes known \(\pi_i\). In anthropics, \(\pi_i\) depends on unknown \(N_T\), making weights model-dependent. |
  | **Prior \(P(T)\)**       | Translates             | Functions identically (e.g., SIA amplifies large \(N_T\) if priors are flat).    |
  | **First-Personal Bit**   | **No counterpart**     | "I am *this* observer" has no analog. Surveys don't condition on observer identity; anthropics treats "I" as a sampled unit. |
  | **Reference Class Problem** | **No counterpart**     | In your work, eligibility is fixed. Philosophers debate who counts as an "observer" (e.g., humans vs. conscious AI). |
  | **Design-Based Inference** | **No counterpart**     | Anthropics lacks a design-controlled frame. All estimates are model-based (see below). |

  ---

  ### Your Eligibility Problem vs. Reference Class Problem
  - **Eligibility Problem (Your Term)**: Purpose-dependent frame selection (e.g., "frame for election polling" vs. "frame for health surveys").  
  - **Reference Class Problem (Anthropics)**: "Which set of observers am I a random sample from?" (e.g., humans, sentient beings, observer-moments).  
  - **Relationship**:  
    - These are **the same problem in different contexts**.  
    - Both ask: *"Who is eligible for inclusion in the frame, and why?"*  
    - In anthropics, it’s a philosophical debate with no objective resolution. In your work, it’s a design choice with clear criteria.  
  - **Why It Matters for SSA/SIA**:  
    - SSA’s \(P(\text{you exist} \mid T) = \frac{1}{N_T}\) changes drastically if \(N_T\) is "all humans" (\(10^{11}\)) vs. "all mammals" (\(10^{13}\)).  
    - SIA’s bias toward large \(N_T\) worsens if the reference class is broadened (e.g., including AI observers).  

  ---

  ### Design-Based vs. Model-Based Anthropic Estimates
  - **Short Answer**: **There is no design-based anthropic estimate.** All anthropic reasoning is model-based.  
  - **Why**:  
    1. **Frame Uncertainty**: The frame (observers) depends on the theory \(T\), which is unknown. No design fixes the frame independently.  
    2. **Inclusion Probability Dependence**: \(\pi_i\) relies on \(N_T\) (unknown). HT weights require known \(\pi_i\), which is impossible here.  
    3. **Prior Sensitivity**:  
       - SSA: Posterior \(P(T \mid \text{data}) \propto \frac{P(T)}{N_T}\) depends heavily on \(P(T)\).  
       - SIA: Posterior \(P(T \mid \text{data}) \propto N_T \cdot P(T)\) amplifies large \(N_T\) if priors are weak.  
  - **Consequence**: Anthropic arguments **cannot avoid priors**. Example:  
    - Doomsday Argument (SSA): "I'm a random human \(\rightarrow\) likely not in the first 5% of all humans \(\rightarrow\) humanity ends soon."  
      - Depends on prior over extinction timelines.  
    - Presumptuous Philosopher (SIA): "I exist \(\rightarrow\) likely in a large universe."  
      - Depends on prior over \(N_T\) and reference class.  

  ---

  ### Conclusion
  - **Your Guess**: Correct. The "first-personal bit" and reference class problem have **no counterpart** in survey sampling. Eligibility is fixed in your work but contested in anthropics.  
  - **Key Insight**: Anthropic reasoning is **inherently model-based** due to theory-dependent frames and priors. SSA and SIA are sampling schemes, but they require assumptions about frames and \(N_T\) that lack design-based analogs.  
  - **Practical Implication**: For your team, treat "eligibility" (reference class) as a **subjective design choice**—similar to how philosophers must arbitrarily define "observer." There is no objective solution, only purpose-dependent ones.  

  > "Anthropic reasoning is survey sampling where the frame is disputed, the inclusion probabilities are unknown, and the designer is blindfolded." — Your friendly AI sampler.
