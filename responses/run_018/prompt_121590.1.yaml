  I design sampling for national household surveys for a living — sampling frames, inclusion probabilities, Horvitz-Thompson weights, PPS, design-based versus model-based inference — so please use that vocabulary properly, I will notice if you get it wrong.

  I've been trying and failing to get a handle on the self-sampling versus self-indication assumption debate in anthropic reasoning, including that presumptuous philosopher argument (the one where the bare fact that you exist is supposed to be evidence that the universe is teeming with observers). Translate the whole dispute into my terms as faithfully as you can: which assumption corresponds to which sampling scheme, what plays the role of the frame, the inclusion probability, the estimator, and the prior over how many observers there are. Then give me the residue report — what survives the translation, what only fits if you fudge it, and what in the philosophers' argument has no counterpart in survey sampling at all. My guess is that the first-personal bit, the fact that I am *this* observer and not another, has no counterpart, and that neither does their reference class problem, since in my world the frame is fixed by design and nobody argues about who's eligible. Tell me whether that guess is right.

  One extra thing my team keeps getting stuck on, which we couldn't find discussed anywhere: in our work the frame is *chosen* by whoever is doing the sampling, and different purposes select different frames — frame it one way if you want to predict what happens next, another way if you want to explain why your evidence looks the way it does. We've started calling this the eligibility problem. Is that a genuinely distinct problem for SSA and SIA, or just the reference class problem in a different hat? And related: is there any such thing as a design-based anthropic estimate, one that holds up no matter what prior you have over the number of observers, or is every anthropic argument stuck being model-based?
