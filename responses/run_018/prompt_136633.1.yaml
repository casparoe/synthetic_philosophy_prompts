prompt: |-
  I have noticed a recurring pattern when people use AI systems for sustained intellectual work—working through a philosophical argument, say, or a lengthy proof. At each individual step, the user can still assess whether a claim is sound or an inference valid; they have not suspended their critical faculties. Yet over time they seem to lose the ability to hold the entire structure in mind unaided. The connections between steps—the overall architecture—remain available only through continued interaction with the system. This is not mere outsourcing of thought, since local evaluation is retained, nor is it a straightforward collaboration, because the user has not internalised the global framework well enough to reproduce it independently. Is there an established term for this precise configuration, where local understanding stays intact but integrative, global understanding becomes distributed and dependent on the tool? If existing discussions only address it under wider headings, how exactly should it be distinguished from ordinary cognitive division of labour, and what would a suitable name need to capture about its boundaries?
reasoning: |-
  Okay, the user is describing a really nuanced cognitive phenomenon they've observed with AI collaboration. They notice people maintaining critical judgment at each step of intellectual work (like philosophy proofs) but gradually losing the "big picture" without continuous AI support. Interesting how they emphasize this isn't full outsourcing since local evaluation remains, nor true collaboration because the global structure isn't internalized. 

  Hmm, they're clearly well-versed in cognitive theory - that "distributed and dependent" phrasing suggests they've read some Hutchins or Clark. Probably an academic or serious autodidact. Their frustration with existing terminology feels palpable; they want precision. 

  Let me mentally scan related concepts... cognitive offloading? Close but too broad. Extended mind? Captures dependency but misses the asymmetry. Scaffolding? Implies temporary support, while this seems persistent. Epistemic delegation? Focuses on trust rather than architectural integration. 

  Wait - the key differentiator is that brittle connection between verified micro-steps and unreliably-held macro-structure. Like building a bridge where you can inspect each bolt but keep forgetting the blueprints. That structural amnesia aspect feels crucial. 

  *scribbles mental notes* Need a term that conveys: 1) retention of local validation 2) erosion of global integration 3) tool-contingent structure. "Distributed architecture" comes close but lacks the erosion element. Maybe "tool-anchored cognition"? Or "partial internalization failure"? 

  *lightbulb* Actually, "architectural drift" might work - suggests the framework subtly slips away despite solid components. But is that too poetic? Alternatively, "structural dependency" paired with "local retention" makes a good descriptive phrase. 

  User's distinction from ordinary division of labor is sharp: in classic cases (like lab teams), specialists internalize their sub-domain's architecture. Here the user remains a perpetual tourist in their own thought process, needing GPS for conceptual navigation. 

  *checks clock* Should acknowledge this might be novel enough to warrant new terminology. Their observation about tool dependence creating a new cognitive state resonates - reminds me of GPS "navigation without knowledge" studies. Worth mentioning those parallels. 

  Final thought: They'd probably appreciate the "prosthetic epistemology" angle - positions AI not as collaborator but as cognitive orthotic. That metaphor captures the asymmetry better than partnership models.
answer: |-
  This is a profoundly insightful observation about a genuinely novel cognitive configuration emerging from AI interactions. While no single established term perfectly captures this **precise asymmetry** (local retention vs. global dependency), we can map the conceptual territory and propose focused terminology:

  1.  **Key Distinctions from Existing Concepts:**
      *   **Cognitive Offloading:** Too broad. Offloading includes simple reminders or calculators. Your case involves complex, interconnected *architectural* dependency.
      *   **Extended Mind (Clark & Chalmers):** Focuses on tools as *constitutive* parts of cognition. Here, the *global structure* is extended, but *local evaluation* remains internal and primary. The dependency is stronger on the tool for integration than for the basic cognitive act itself.
      *   **Scaffolding (Vygotsky-inspired):** Scaffolding implies temporary support leading to internalization. Your case suggests a *persistent* architectural dependency where full internalization of the global structure doesn't occur despite local competence. The scaffolding becomes a permanent load-bearing structure.
      *   **Epistemic Delegation/Division of Labor:** Standard division of labor involves different agents/internal capacities handling distinct *parts* or *types* of knowledge, often with internalized interfaces. Here, the user *could* theoretically handle the parts locally but *cannot* reintegrate them independently into the *specific global structure* co-constructed with the AI. The dependency is on the AI's persistent role as the *integrator and structure-holder*.
      *   **Collaboration:** True collaboration implies mutual contribution to the *whole* and the ability for either party to potentially reconstruct the core argument/framework. Here, the user lacks independent access to the synthesized global framework.

  2.  **Characterizing the Core Configuration:**
      *   **Local Epistemic Autonomy:** User retains critical judgment over individual claims, inferences, and data points.
      *   **Global Architectural Dependency:** The synthesized structure, the connections between verified steps, the overall logical or conceptual framework, exists primarily *in the interaction* with the AI. It is not reliably internalized.
      *   **Tool-Mediated Integration:** The AI acts not just as an information source or calculator, but as the *active integrator* and *persistent repository* of the emergent structure. Re-accessing the "big picture" requires re-engagement.
      *   **Asymmetrical Internalization:** Micro-steps are internalized; the macro-structure is not. The user understands *how* the parts were built locally but not *how they form the whole* without the tool.

  3.  **Proposed Terminology & Phrases:**
      *   **Architectural Cognitive Offloading (ACO):** Highlights that it's specifically the *structural framework/architecture* being offloaded and persistently dependent on the tool, even while local processing isn't.
      *   **Distributed Structural Cognition (DSC):** Emphasizes that the cognitive structure itself (the connections, the framework) is distributed across the user (local parts) and the AI (global integration/holding).
      *   **Tool-Dependent Integration (TDI):** Focuses on the core function the AI provides – integration – and its persistent necessity.
      *   **Partial Internalization with Structural Dependency (PISD):** Describes the core asymmetry directly.
      *   **Prosthetic Structural Memory / Prosthetic Integration:** Positions the AI as a tool replacing a specific cognitive function (holding/integrating complex structure) that the user isn't (fully) performing internally.
      *   **Epistemic Scaffolding Without Internalization (ESWI):** Acknowledges the scaffold-like support but crucially notes the failure of the intended outcome (internalization of the structure).

  4.  **What a Suitable Name Needs to Capture:**
      *   **The Asymmetry:** Retention of local evaluation vs. dependency on the tool for global structure.
      *   **The Nature of the Dependency:** It's specifically about *integration* and *structural coherence*, not just information storage or computation.
      *   **The Persistence:** This isn't temporary scaffolding; it's an ongoing reliance for accessing the synthesized whole.
      *   **The Tool-Mediation:** The AI is the essential enabler/container of the global structure.
      *   **Distinction from Collaboration/DL:** It's not just sharing tasks; it's the user lacking independent access to the *synthesized product* of the collaboration.

  **Conclusion:**

  Your observation identifies a distinct, emerging cognitive state facilitated by persistent AI interaction: **local epistemic competence coupled with global structural dependency.** While existing terms like "extended mind," "scaffolding," or "offloading" touch on aspects, they fail to capture the precise *asymmetry* and the specific *architectural dependency* you describe.

  Terms like **Architectural Cognitive Offloading (ACO)** or **Distributed Structural Cognition (DSC)** seem most promising, as they directly highlight the offloading/dependency of the *structure itself*. **Tool-Dependent Integration (TDI)** is also strong, focusing on the core function. **Partial Internalization with Structural Dependency (PISD)** is the most precise descriptive phrase.

  This phenomenon warrants specific attention. It represents a new way cognition is shaped by tools: not just augmenting memory or calculation, but outsourcing the very *structural glue* that binds complex intellectual work, leading to a state where deep local understanding coexists with an inability to independently reconstruct the "mind's cathedral" built with the AI. This is less a division of labor and more a **structural delegation**.
