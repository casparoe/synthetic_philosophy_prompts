  Tolstoy sees art as transmitting feelings from artist to audience, with value determined by infectiousness and whether it advances universal brotherhood. Key elements include rejecting technical virtuosity and professionalized art that transmits narrow feelings. The user wants me to map these to concepts like honest/manipulative signals, prestige/content-biased learning, costly signaling, group-level selection, and epidemiological transmission models.

  I can translate Tolstoy's "infection" concept directly to epidemiological dynamics of cultural transmission. The "infectiousness" of art becomes reproduction rate (R) of emotional states. "Honest signals" would represent Tolstoy's demand for sincere emotional transmission, while "manipulative signals" would cover insincere professional art. For the moral dimension, "costly signaling of cooperative intent" fits his view that art should promote unity, as costly signals stabilize cooperation.

  Group-level selection maps well to Tolstoy's universal brotherhood ideal - art that fosters shared norms and group cohesion. Content-biased learning aligns with his rejection of prestige-based elite art valuation. However, some elements resist translation. His hostility toward professionalism doesn't fully fit, since signaling theory sees professionalization as potentially facilitating transmission. His Christian universalism becomes problematic when reduced to group selection, as evolutionary models don't inherently prefer universal over parochial groups.

  The biggest challenge is Tolstoy's normative judgment about which feelings are "unworthy." Signaling theory describes transmission efficiency but can't judge intrinsic worth - this exposes Tolstoy's unstated theological commitments. The residue shows that while evolutionary theory can model transmission mechanics, it can't replicate Tolstoy's moral framework without smuggling in values.

  The user's deeper need seems to be examining whether scientific frameworks can fully capture humanistic concepts. The gap reveals that Tolstoy's "scientific" account relies on theological underpinnings that evolutionary models can't incorporate. This tension between descriptive and normative claims will likely spark productive seminar discussions about interdisciplinary boundaries.
answer: |-
  ### Bottom Line
  The translation succeeds mechanically by mapping Tolstoy's infection metaphor onto epidemiological models and his ethical criteria onto signaling equilibria stabilizing cooperation, but collapses at preserving his normative hierarchy of feelings and hostility to professionalism, revealing his theory's unstated theological foundations.

  ### Conceptual Translation
  1.  **Art as Emotional Transmission → Epidemiological Dynamics:** Art is a high-fidelity cultural vector transmitting affective states (pathogens) from artist (index case) to audience (susceptible population). "Infectiousness" is the basic reproduction number (R0) of the emotion, determined by signal clarity and receiver susceptibility (emotional congruence).
  2.  **Value as Infectiousness & Brotherhood → Costly Signaling & Group Selection:** Art's value derives from (a) transmission efficacy (high R0 via low decoding cost/high emotional salience = "content-biased transmission"), and (b) its function as a *costly signal of cooperative intent*. Successful art broadcasts shared values ("group markers"), reducing within-group transaction costs and enabling coordination. This stabilizes large-scale cooperation (universal brotherhood ≈ pan-group identity), favored by cultural group selection where groups with cohesive emotional norms outcompete fragmented ones.
  3.  **Elite Art's Failure → Prestige-Biased Learning & Manipulative Signals:** Professionalized/elite art fails because it exploits *prestige-biased transmission* — adopted due to creator status, not emotional content. It transmits low-R0 emotions (narrow/divisive = "parochial markers" or "negative-sum preferences") via *manipulative signals* (e.g., technical virtuosity as arbitrary cost, decoupled from sincerity). This fragments groups, reducing collective fitness.

  ### Residue Report
  **Survives Intact:**
  *   Core mechanism: Art as emotional contagion → Epidemiological R0 dynamics.
  *   Infectiousness as primary metric → Transmission fidelity/reach.
  *   Universal brotherhood as functional outcome → Group-selected norms enhancing large-scale cooperation via shared signals.
  *   Critique of insincere/status-driven art → Prestige bias enabling manipulative signals.

  **Distorted/Reduced:**
  1.  **Hostility to Professionalism:** Signaling theory sees professionalization as potentially *enhancing* signal efficiency (e.g., trained artists as super-spreaders). Tolstoy's rejection becomes an empirical claim (professionals often emit low-cohesion signals) rather than an inherent flaw.
  2.  **Christian Universalism:** "Universal brotherhood" maps onto *maximally inclusive groups*, but evolutionary models don't intrinsically value universalism over robust parochialism. Tolstoy's moral imperative is recast as a contingent outcome of intergroup competition favoring larger, more cohesive units.
  3.  **Normative Judgment of Feelings:** Tolstoy's claim that certain feelings (e.g., exclusive sensuality, class pride) are *intrinsically unworthy* cannot be expressed. Signaling theory is amoral: a feeling's "worthiness" is its contribution to individual/group fitness (cohesion, coordination). Divisive feelings *can* be adaptive (e.g., strengthening in-group bonds via out-group hostility). His hierarchy relies on unstated theological ethics.

  **Unrecoverable Residue & Revelation:**
  The irreducible residue is **Tolstoy's intrinsic moral valuation of transmitted feelings**. Evolutionary signaling theory describes *how* signals transmit and stabilize cooperation, but cannot judge *which* cooperative norms (or feelings) are "good" beyond fitness consequences. This gap reveals:
  1.  **Signaling Theory's Limitation:** It excels at mechanistic and functional description but lacks a vocabulary for intrinsic moral evaluation. It cannot derive "ought" from "is" regarding emotional content.
  2.  **Tolstoy's Theological Core:** His assertion that only feelings promoting universal love are "true" art is not a scientific claim derivable from transmission mechanics. It depends on an unstated Christian ontology equating "universal brotherhood" with the highest (divine) good. His "scientific" framework is freighted with normative theology.

  **Conclusion:** The translation operationalizes Tolstoy's mechanics and social function within evolutionary signaling but exposes his moral core as irreducible to scientific description, confirming its theological foundation.
