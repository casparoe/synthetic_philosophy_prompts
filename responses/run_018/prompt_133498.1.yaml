answer: |-
  ## Pub Debate: White Horse Paradox 2.0

  **Characters:**
  *   **Zhao:** Defending Gongsun Long/Mingjia (School of Names)
  *   **Alex:** Modern philosopher of language (broadly analytic)

  **(Setting: Clinking glasses, low murmur in a pub after a departmental seminar)**

  **Alex:** (Leans in) Look Zhao, I get the historical intrigue, but Gongsun Long’s “white horse is not a horse” is just… bad logic. It’s simple predicate intersection! ‘White’ modifies ‘horse’. The set of white things intersects with the set of horse things. Boom: white horses. No mystery, just set theory.

  **Zhao:** (Shakes head, takes a sip) Alex, Alex. You’re already stacking the deck. You *assume* ‘horse’ provides the stable domain for ‘white’ to latch onto. But why? Imagine your fancy image classifier: one module fires for ‘horse-shape’, another for ‘white-colour’. They’re *parallel tracks*. ‘Horse’ isn’t a container; it’s *another attribute*, like ‘white’. Merging ‘white-track’ and ‘horse-track’ outputs isn’t finding an object *in* a category, it’s *creating* a new referent – ‘white-horse’. It’s artificial. The pure *horse* concept, the universal ‘horseness’, isn’t present in this composite.

  **Alex:** Okay, the classifier analogy is cute. But that’s just *how we process* info! It doesn’t change the *semantic fact* that ‘white horse’ *means* something that is both white and a horse. The composition *succeeds*. Your ‘pure horseness’ is an abstract ghost. Real reference is to concrete particulars possessing multiple properties simultaneously. ‘White horse’ picks out those particulars satisfying both predicates. No reference failure, just successful, intersective predication.

  **Zhao:** But *how* does it succeed? Your ‘satisfying both predicates’ assumes the predicates naturally co-habit on the same object-substrate. Mingjia questions *that* substrate! ‘Horse’ names one form, ‘white’ names another, distinct form. When you say ‘white horse’, you’re pointing to the *conjunction* of forms, not to the individual form ‘horse’. The classifier *shows* this: the ‘horse’ output is silenced or altered when fused with ‘white’. The pure ‘horse’ signal is lost in the composite output. Hence, ‘white horse’ ≠ ‘horse’. It’s a new name for a composite form, not a subset of horses.

  **Alex:** (Pauses, frowning) Hmm. So you’re saying... in the classifier model, ‘horse’ isn’t functioning as a *sortal* restricting the domain for ‘white’? They’re both just… raw feature outputs? And combining them *generates* a referent rather than *selecting* one from a pre-sorted domain?

  **Zhao:** Exactly! ‘Horse’ isn’t the box you put ‘white’ into. They’re separate signposts pointing to separate ideal forms. Merging them points somewhere else entirely – to the composite *baima* (white-horse) form. Trying to say that composite *is* the ‘horse’ form is category error. The reference for ‘horse’ fails when you’ve invoked the composite.

  **Alex:** But… (sighs) that feels deeply counter-intuitive for how language hooks onto the world. It denies the basic coherence of objects possessing multiple properties. My pint is brown, cold, *and* beer – all at once, on the same damn thing!

  **Zhao:** (Smiles faintly) And perhaps Mingjia would ask: *What* is the ‘thing’ prior to these attributes? Is the ‘beer’ you name before colour and temperature the same as after? The classifier only outputs attributes. The ‘thing’ is the conjunction. Your intuition smuggles in the object-substrate Mingjia doubts.

  ---

  **Where the Moves Land**

  1.  **Alex's Opening (Intersective Predication):** Assumes predicates like 'white' and 'horse' inherently compose by intersecting sets defined relative to a domain of objects. 'Horse' acts as the primary sortal restricting the domain for 'white'.
  2.  **Zhao's Counter (Classifier Analogy / Parallel Attributes):** Challenges the sortal dependency. Argues 'horse' and 'white' are conceptually/metaphysically parallel attributes (like separate classifier outputs), not hierarchical. Composition isn't intersection within a sortal domain, but conjunction creating a *new* referent (the composite form).
  3.  **Alex's Response (Composition Success / Concrete Particulars):** Insists reference succeeds to objects bearing multiple properties, dismissing the "pure form" as irrelevant abstraction. Assumes objects are the stable substrate for properties.
  4.  **Zhao's Reinforcement (Conjunction vs. Subset / Reference Failure):** Clarifies that conjunction creates a new entity (the composite form *baima*), distinct from the original form *ma* (horse). Referring to the composite *as* the original form ('horse') constitutes reference failure for the original concept. The classifier analogy shows the original 'horse' signal is absent/modified in the composite output.
  5.  **Alex's Concession & Lingering Doubt (Sortal Question / Object Substrate):** Alex grasps Zhao's point about the lack of sortal restriction in the analogy but highlights the counter-intuitive denial of multi-propertied objects. **Alex quietly imports:** The assumption of a persistent object *substrate* that bears properties, which Mingjia implicitly (or explicitly) rejects by focusing solely on the interplay of names/forms.

  **Frank Admission:** This setup can't fully reproduce the Mingjia view's **radical nominalism or potential scepticism about persistent objects/substrates**. We've treated 'horse' and 'white' as attributes *of something*, even if parallel. A stricter Mingjia reading might deny the underlying 'something' altogether, seeing *only* the named forms/conjunctions. Adding that would make Zhao's position even more alien to Alex's object-property metaphysics.
