prompt: |-
  im in my metaphysics seminar on Bradley's regress and the unity of the proposition. i also just finished a course on typed lambda calc and the curry-howard correspondence, so im wondering if you can restate the whole debate in that vocabulary: propositions as well-typed terms, relations as functions, and the unity problem as whether applying a relation to args produces a valid term without an extra constructor. cover the internal-relation view, the primitive-fact view, and Bradley's absolute-view. for each say what translates clean, what gets distorted, and what has no expression at all (especially the reality/appearance distinction). then tell me whether the leftover residue is a failure of the programming analogy or proof that Bradley was smuggling metaphysical assumptions. keep it to one paragraph max and dont bother with citations.
reasoning: |-
  We are translating Bradley's regress and the unity of the proposition into the language of typed lambda calculus and the Curry-Howard correspondence. Propositions are well-typed terms, relations are functions, and the unity problem asks whether applying a relation (function) to arguments produces a valid term (a proposition) without requiring an extra "unifier" constructor.

  - **Internal-relation view** (e.g., Frege): Relations are incomplete functions that become saturated by arguments, producing a unified proposition (a well-typed term). This translates cleanly: function application is primitive and requires no extra syntax. However, it distorts the idea that relations are "in the objects" by making them external functions, and it has no expression for Bradley's reality/appearance distinction (the absolute whole).

  - **Primitive-fact view** (e.g., Russell early): The proposition is a basic, unstructured fact. In lambda terms, this might be a primitive constant of a propositional type, bypassing function application. It avoids regress by fiat, but distorts by not allowing decomposition into function and arguments. The reality/appearance distinction is absent.

  - **Bradley's absolute view**: The regress (infinite chain of unifiers) shows that function application alone cannot unify; only the Absolute (the entire system) provides real unity. In lambda terms, this is like saying that every well-typed term must be embedded in a total context (the Absolute) to be meaningful, but we cannot express this context within the system. The programming analogy fails to capture the metaphysical distinction between appearance (the type system we use) and reality (the Absolute).

  The leftover residue (the need for the Absolute) is proof that Bradley was smuggling metaphysical assumptions: the programming analogy shows that function application *is* primitive and doesn't require an infinite regress in a well-founded type theory, but Bradley insists on a transcendent unity beyond the system.
answer: |-
  In the lambda calculus translation, propositions are well-typed terms (e.g., `R a b`), relations are functions (`R : A → B → Prop`), and unity is the valid typing of application. The **internal-relation view** (e.g., Frege) translates cleanly: function application (`R a b`) inherently unifies terms without extra syntax, but it distorts Bradley’s insistence that relations aren’t self-sufficient, as the type system itself (a meta-structure) silently enforces unity. The **primitive-fact view** (e.g., Russell) maps to atomic terms like `Fact(R,a,b)`, avoiding regress by rejecting decomposition into function/arguments, but this distorts relational structure and omits Bradley’s critique that such facts still imply hidden unifiers. **Bradley’s absolute view** claims that only the Absolute (the entire system/environment) resolves the regress, which has no direct expression—lambda calculus cannot represent "true unity" beyond its syntactic rules, especially Bradley’s reality/appearance distinction (absolute coherence vs. fragmented terms). The residue (unexpressed reality/appearance) reveals Bradley smuggling metaphysics: the programming analogy handles unity via well-founded typing, proving his regress stems from demanding an external "ground" for syntax that requires none.
