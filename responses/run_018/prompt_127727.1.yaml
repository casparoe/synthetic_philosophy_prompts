answer: |-
  The acceptance of free-floating rationales (FFRs)—objective normative reasons existing independently of any agent's recognition, motivation, or relational status—profoundly reshapes the moral architecture of collective obligations in large-scale ecological restoration. Using the degraded watershed scenario (where restoration is objectively required, yet no individual actor has an evident agent-relative reason to act), we analyze the three specified issues:

  ### 1. Generating Directed Obligations for Specific Institutions Without Relational Ties
  FFRs circumvent the traditional requirement for direct contractual, historical, or causal ties to ground duties. An FFR establishes that the watershed *ought* to be restored, full stop. Directed obligations (duties *owed to* specific others) might not emerge directly from the FFR itself, as beneficiaries (e.g., future generations, ecosystems) may not be "claimants" in a relational sense. Instead, **role-based obligations** fill this gap.  
  *   **Mechanism:** The FFR identifies the *state of affairs* (restored watershed) as obligatory. Specific institutional actors (e.g., a watershed management authority, relevant government tier, scientific consortium) incur obligations not due to past harm or explicit contract, but because of their **functional capacity and societal role**.  
  *   **Grounding:** Institutions possess unique capabilities (coordination, resources, jurisdiction, expertise) essential for addressing complex collective action problems. The FFR, combined with the principle that "ought implies can" (and conversely, "can implies ought" in contexts of unique capability), generates a **capacity-derived duty**. The obligation is "directed" towards the *task* or the *objective good* (the restoration), mediated by the institution's role.  
  *   **Tension:** Assigning *which specific* institution bears the obligation remains practically challenging. This requires adjudicating capacity, efficiency, and fairness (e.g., is the obligation primarily on the level of government with jurisdictional reach, or the agency with technical expertise?). FFRs provide the *why* (the objective reason), but institutional design must resolve the *who* based on capability and comparative advantage, moving beyond relational grounding.

  ### 2. Undermining Contractualism and Constructivism
  FFRs pose a significant challenge to theories grounding normativity solely in the agreements (actual or hypothetical) of reasoning agents.  
  *   **Core Challenge:** Contractualism (e.g., Scanlon) and constructivism (e.g., Korsgaard, Rawlsian variants) derive normative force from what could be justified to, or agreed upon by, rational agents. FFRs, by definition, obtain *independently* of such agreements or justifications. The reason the watershed *should* be restored exists even if no agent recognizes it, or if hypothetical contractors fail to agree on it due to indifference, ignorance, or conflicting interests.  
  *   **Implication:** FFRs imply **moral realism** about reasons (they exist mind-independently) and reject the **constitutive thesis** of constructivism (that reasons are constituted by the reasoning activity of agents). In the watershed case, the restoration reason isn't *created* by potential agreements among contractors, governments, or communities; it pre-exists and constrains what agreements could be considered morally adequate.  
  *   **Potential Reconciliation?** A hybrid view might argue that FFRs *constrain* or *inform* hypothetical agreements – rational agents *should* recognize and agree to act on the FFR. However, pure FFRs retain their normative force even if such agreement is impossible or hypothetical contractors would reject it for non-moral reasons (e.g., short-term self-interest). Thus, FFRs fundamentally **decenter the agency of reasoners** as the *source* of normativity, even if they remain essential for *acting* on reasons.

  ### 3. Implications for Future Generations and Non-Sentient Systems
  FFRs provide the most robust foundation for obligations towards entities incapable of being reasoners or claimants.  
  *   **Beneficiary-Independent Reasons:** The value justifying the restoration (e.g., intrinsic value of biodiversity, ecosystem integrity, geomorphological stability) exists independently of any current or future beneficiary's capacity to appreciate it, demand it, or reciprocate. The FFR for restoration is thus **beneficiary-independent**.  
  *   **Future Generations:** FFRs ground obligations to future people *directly* on the objective value they *will* (or could) experience or depend upon, not on our hypothetical agreements *with them* (which are impossible) or their potential future claims. The reason to restore the watershed for their sake exists *now*, regardless of their current non-existence or inability to reason.  
  *   **Non-Sentient Ecological Systems:** This is the most radical implication. FFRs allow for **direct moral considerability of ecosystems**. The watershed's degraded state is *objectively bad* (a violation of its intrinsic value or proper functioning), generating a reason for restoration *for the ecosystem's own sake*. This bypasses the need to ground obligation solely in the interests of sentient beings (current or future) who might benefit. The FFR attaches to the restoration of the system's integrity itself.  
  *   **Obligation Structure:** The obligation is primarily **task-oriented** (restore the watershed) based on the objective value at stake, rather than **claim-oriented** (owed *to* a specific claimant). Institutions bear the duty as moral agents capable of recognizing and acting on the FFR to realize this objective good.

  **The Core Tension: Agent-Neutrality vs. Institutional Feasibility**  
  FFRs provide a powerful, objective foundation for collective ecological obligations, especially where relational ties are absent or beneficiaries lack agency. However, the **agent-neutrality** of FFRs ("This must be done, period") clashes with the **practical necessity of agent-relativity** in institutional design ("*Who specifically* must do it, *how*, and *with whose resources*?"). FFRs supply the non-negotiable normative demand but offer no inherent mechanism for distributing the burden. Resolving this requires supplementary principles:  
  *   **Capacity & Efficiency:** Obligations fall most justly on actors uniquely positioned to fulfill them effectively.  
  *   **Fairness & Proportionality:** Burden-sharing should consider historical contribution to degradation (even if not causally direct in the FFR framework) and ability to pay.  
  *   **Institutional Legitimacy:** Assigning duties must respect jurisdictional boundaries and democratic processes to ensure compliance and stability.  

  Accepting FFRs thus necessitates a two-tiered moral architecture: 1) An objective, agent-neutral layer establishing the *existence* and *content* of the collective obligation (the watershed must be restored), grounded in free-floating rationales; and 2) A practical, agent-relative layer determining the *assignment* and *discharge* of the obligation, grounded in institutional capacity, role, fairness, and feasibility. The former provides the uncompromising "why," the latter tackles the complex "how" and "who," inevitably involving compromises constrained by the non-ideal realities of collective action.
