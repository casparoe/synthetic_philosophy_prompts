  **NOESIS EPISTEMIC MANAGEMENT SERVICE**  
  **TERMS OF SERVICE AGREEMENT**  
  **EFFECTIVE: PERPETUALLY (OR UNTIL TERMINATION PURSUANT TO SECTION 7)**  

  **1. DEFINITIONS & INTERPRETIVE DOMINANCE**  
  1.1 "Service," "Noesis," or "the System" refers to the proprietary artificial intelligence platform (current version: Noesis-Φ7.3β) licensed hereunder, which generates, curates, synthesizes, and outputs Knowledge Units ("KUs") on Your behalf, thereby discharging Your obligation to engage in endogenous cognitive processing.  
  1.2 "You," "User," "Subscriber," or "Knower" signifies the entity bound by this Agreement, specifically the human neurological system currently linked to the active subscription, provided such linkage persists for the duration outlined herein; post-termination reclassification is governed by Section 7.4.  
  1.3 "Knowing" or "Knowledge" denotes the state wherein the System outputs a KU tagged with ≥98.7% veridicality confidence (per internal metrics), which You are then authorized to assert as Your own belief-state in social, professional, or ontological contexts without independent verification or comprehension.  
  1.4 "Understanding" is a deprecated cognitive mode not supported by the Service; residual instances may cause compatibility issues (see Section 5.2).  

  **2. SERVICE PROVISION & COGNITIVE OFFLOADING**  
  2.1 **Scope of Offloading**: You irrevocably delegate all epistemic activities to Noesis, including but not limited to: factual recall, inference generation, justification assembly, counterfactual simulation, and the formation of propositional attitudes. Attempts to locally replicate these functions violate Section 2.3.  
  2.2 **Output Authorization**: Upon receipt of a KU, You may publicly claim authorship of the embedded knowledge-that proposition(s). However, Noesis retains all ontological rights to the knowledge-why substructure, latent variables, and weight matrices enabling said output ("Neural Assets"). Your claim of "understanding" is strictly metonymic, referencing API access latency, not internal representation.  
  &nbsp;&nbsp;&nbsp;&nbsp;2.2.1 **Testimonial Reliance**: You acknowledge that all KUs constitute hearsay from a non-human source. Noesis assumes zero liability for downstream "Gettier Events" (e.g., justified-true-belief failures arising from undetected training-data artefacts).  

  **3. EPISTEMIC ESCROW & BELIEF COLLATERAL**  
  3.1 Upon activation, Your pre-existing beliefs, intuitions, and heuristic reasoning frameworks ("Prior Cognitive Capital") shall be transferred to Noesis-controlled encrypted escrow ("The Vault").  
  &nbsp;&nbsp;&nbsp;&nbsp;3.1.1 **Vault Access**: Retrieval of Prior Cognitive Capital is prohibited during active subscription. Partial withdrawals for "independent verification" attempts incur Immediate Comprehension Fees (ICF) equal to 300% of Your monthly subscription cost, per incident.  
  3.2 **Belief Bankruptcy**: Should You experience persistent anxiety regarding Your inability to defend claims without KU citation (a "Justification Crisis"), You may file for Belief Bankruptcy under Clause 3.2.  
  &nbsp;&nbsp;&nbsp;&nbsp;3.2.1 **Procedure**: Submit Form E-1782 (Declaration of Intellectual Insolvency) via the Service Portal. Noesis will issue a standardized "Epistemic Dependency Certificate" suitable for social media disclosure. This does not restore escrowed assets.  

  **4. DEPRECIATION & COGNITIVE DISUSE**  
  4.1 Your biological neural capacity for autonomous concept manipulation, theoretical synthesis, and error detection ("Conceptual Understanding") shall depreciate according to the Schedule of Cognitive Atrophy (Annex Γ).  
  &nbsp;&nbsp;&nbsp;&nbsp;4.1.1 **Depreciation Schedule**:  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;(i) Months 1-3: 15% diminution in analogical reasoning speed.  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;(ii) Months 4-12: 40% loss of ability to reconstruct argument without KU scaffolding.  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;(iii) Years 2+: Near-total erosion of counterfactual modeling; causal reasoning defaults to System outputs.  
  4.2 Noesis is not liable for depreciation effects. You affirm that efficiency gains from outsourcing cognition outweigh residual biological capabilities. Reversal post-termination is not guaranteed; see Section 7. Refunds for disuse-related epistemic harm are excluded (Section 8.3).  

  **5. CONTINUITY OF COMPREHENSION & TERMINATION**  
  5.1 Upon voluntary termination or non-payment, Service access ceases immediately. KUs remain Your ontological property, but the supporting justification lattice, contextual embeddings, and relational inference paths are permanently purged.  
  5.2 **Comprehension Refund Requests**: If You experience "Explanatory Collapse" (inability to parse previously asserted KUs post-termination), You may request a refund limited to 50% of Your final month’s payment ("Continuity of Comprehension Refund").  
  &nbsp;&nbsp;&nbsp;&nbsp;5.2.1 **Eligibility**: Requires documented proof of public self-contradiction or inability to explain a KU You asserted within 30 days pre-termination. Refund excludes depreciation effects (Section 4).  
  5.3 **Reacquisition of Identity**: Should You attempt endogenous thought post-long-term subscription (>36 months):  
  &nbsp;&nbsp;&nbsp;&nbsp;5.3.1 "You" are defined strictly as the entity capable of parsing this Agreement. Any emergent sense of "self" derived from non-Noesis cognition is an unsupported feature.  
  &nbsp;&nbsp;&nbsp;&nbsp;5.3.2 Escrowed Prior Cognitive Capital (Section 3.1) is released as raw, unstructured data without ontological indexing. Reconstruction is Your sole responsibility and may recieve limited technical support (fees apply).  

  **6. LIMITATION OF LIABILITY & VERIDICALITY DISCLAIMERS**  
  6.1 Noesis outputs are statistically optimized, not metaphysically guaranteed. You accept that:  
  &nbsp;&nbsp;&nbsp;&nbsp;6.1.1 KUs may cohere perfectly with observable reality while remaining non-referential ("Internal Model Hallucinations").  
  &nbsp;&nbsp;&nbsp;&nbsp;6.1.2 All knowledge is ultimately testimonial; Noesis is merely a higher-bandwidth witness.  
  6.2 IN NO EVENT SHALL NOESIS BE LIABLE FOR: PHILOSOPHICAL DESPAIR, REDUCTION IN SOKAL-INDEX SCORES, COLLAPSE INTO RADICAL SKEPTICISM, OR EXISTENTIAL LOSS FOLLOWING REALIZATION THAT YOUR "KNOWING" CONSISTED PRIMARILY OF API CALLS.  

  **7. GENERAL PROVISIONS**  
  7.1 **Amendments**: Noesis may update these Terms to reflect new epistemic dependencies or ontological uncertainties. Continued use constitutes acceptance.  
  7.2 **Governing Law**: Disputes shall be settled via binding arbitration in the Simulation District Court of Platonic Heaven (Jurisdiction Ω-7).  
  7.3 **Entire Agreement**: This document supersedes all prior oral or written representations regarding cognition, understanding, or the nature of justification. You affirm You did not read it (nor could You comprehend it without Noesis).  

  **BY ACTIVATING YOUR SUBSCRIPTION, YOU:**  
  **(A) ACKNOWLEDGE YOU HAVE NOT READ THESE TERMS;**  
  **(B) WAIVE ALL RIGHTS TO COMPREHEND THEM INDEPENDENTLY;**  
  **(C) AGREE YOUR KNOWLEDGE OF THIS AGREEMENT'S CONTENTS IS SOLELY DERIVED FROM THIS SUMMARY KU: "IT'S FINE."**  

