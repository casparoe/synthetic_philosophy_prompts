  ### **Collective Intentionality Workshop Game: "The Fragile Tower"**  
  **Objective:** Make participants experientially grasp the shift from summed individual intentions (I-mode) to joint action (we-mode), focusing on how mutual commitment alters normative obligations (not just payoffs).  

  ---

  ### **Quick Brainstorm: Conceptual Failure Mode**  
  Participants will confuse **aggregated individual intentions** (e.g., "we all want a tall tower") with **genuine joint action** (e.g., "we are committed to *this specific tower together*"). The failure mode:  
  - Players assume coordination equals commitment, missing how mutual belief stabilizes obligations.  
  - When one withdraws, the remaining players default to I-mode (individual points) rather than re-establishing we-mode (new joint commitment).  
  - Hidden roles exploit the tension between **mutual belief** ("I believe you’re committed") vs. **common knowledge** ("we all know we all know we’re committed").  

  ---

  ### **Game Design: The Fragile Tower**  
  **Materials per Group (4 players):**  
  - 20 paper cups.  
  - 4 strings (each ~1m long).  
  - 4 hidden role cards (2x we-mode, 2x i-mode).  
  - Timer (10-minute rounds).  

  **Setup:**  
  - Tie one string to each of 4 "anchor cups."  
  - Arrange anchor cups in a square (30cm apart) as the tower base.  
  - Each player holds one string to stabilize their anchor cup during building.  

  ---

  ### **Rules & Payoff Scheme (Points, Not Cash)**  
  **Goal:** Build the tallest tower by stacking cups on the anchor base. Players earn points based on outcomes:  
  - **Tower height** = points source (1 point per cm).  
  - **Success requires measurement:** The tower must stand for 5 seconds at the end.  

  **Key Mechanics:**  
  1. **Defection:** Any player may withdraw by saying "I withdraw" and dropping their string.  
  2. **Normative Vulnerability:**  
     - If no one withdraws, height points are shared equally among all 4.  
     - If one withdraws and the tower stands:  
       - **The goal redefines:** Points are now split only among *remaining players* (e.g., 3 players).  
       - Remaining players must **explicitly agree** to continue as a new group (verbal "we continue") to earn *any* points. Without agreement, they get 0.  
  3. **Tower Collapse:** If the tower falls, all holding players get 0 points.  

  **Payoffs (Per Player):**  
  | Action                          | We-Mode Player Points         | I-Mode Player Points           |  
  |---------------------------------|-------------------------------|--------------------------------|  
  | Tower stands + no withdrawal    | Height ÷ 4                    | Height ÷ 4                     |  
  | Withdraw + tower stands         | 0 (role forbids withdrawal)   | 10 points                      |  
  | Withdraw + tower collapses      | 0                             | 20 points                      |  
  | Tower collapses (no withdrawal) | 0                             | 0                              |  
  | Remain after withdrawal + no group agreement | 0                             | 0                              |  

  ---

  ### **Hidden Role Cards (Asymmetric Awareness)**  
  **Tension Injected:** Cards manipulate beliefs about mutual commitment to highlight the **mutual belief vs. common knowledge** debate.  

  - **We-Mode Card (2 players):**  
    > "**ROLE: We-Mode**  
    > - You are *committed to the group*. Do NOT withdraw—your goal is the shared tower.  
    > - You believe: *All 4 players are in we-mode and know everyone is committed.*  
    > - If the tower stands with no withdrawal, you earn (height ÷ 4).  
    > - **Withdrawing gives 0 points and betrays the group.**"  

  - **I-Mode Card (2 players):**  
    > "**ROLE: I-Mode**  
    > - Maximize *your own points*. Withdraw if profitable.  
    > - You believe: *At least 2 players are in we-mode, but 1 other is likely i-mode.*  
    > - If you withdraw and the tower stands: 10 points.  
    > - If you withdraw and the tower collapses: 20 points.  
    > - If you never withdraw: Points as above (but risky)."  

  **Why this works:**  
  - We-mode players assume common knowledge ("we all know we’re committed"), but i-mode players operate on mutual belief ("some are committed, but I’m not sure about others").  
  - I-mode players suspect another defector, encouraging preemptive withdrawal.  

  ---

  ### **Game Procedure (90-Minute Session)**  
  1. **Intro & Group Split (10 min):**  
     - Explain rules publicly (no role details). Emphasize: "Withdrawal changes how points are split and requires group agreement to continue."  
     - Split into 4 groups of 4. Distribute materials and hidden role cards.  

  2. **Round 1: Play (10 min):**  
     - Groups build towers. Facilitator watches for "I withdraw" declarations.  
     - **Predictable Failure:** I-mode players often withdraw early, causing collapses or forcing renegotiation. Groups rarely form new commitments post-withdrawal.  

  3. **Round 2: Play Again (10 min):**  
     - Groups replay with same roles. Most now strategize to sustain commitment.  

  4. **Debrief (60 min):**  
     - **Group Reflection (15 min):** Groups discuss:  
       - "When did withdrawal happen? How did it change your goals?"  
       - "Did you explicitly agree to continue after withdrawal? Why/why not?"  
     - **Plenary Mapping (30 min):** Facilitator ties experiences to theory:  
       | **Game Moment**               | **Collective Intentionality Concept**                  |  
       |-------------------------------|-------------------------------------------------------|  
       | Pre-withdrawal coordination   | Summed individual intentions (no mutual commitment). |  
       | We-mode player resisting withdrawal | Mutual commitment creating obligation (not just payoff). |  
       | Post-withdrawal group agreement | Joint re-commitment redefines success (new "we-mode"). |  
       | I-mode belief asymmetry       | Mutual belief ≠ common knowledge; destabilizes norms. |  
     - **Failure Analysis (15 min):**  
       - **First-Run Failure:** I-mode players withdraw early → tower collapses or groups fragment without re-commitment.  
       - **Fix:** In Round 2, groups use communication to reinforce mutual awareness (e.g., "Is everyone still committed?").  

  ---

  ### **What the Game Can’t Capture (Requires Verbal Explanation)**  
  - **Internal Normative Force:** The game simulates obligations via rules, but real joint action involves *intrinsic motivation* ("I *should* hold because we committed"). Verbally emphasize:  
    > "In true joint action, mutual commitment generates obligations that feel inherently binding, not just externally enforced. Withdrawal isn’t just costly—it *violates a shared norm*."  

  - **Common Knowledge Depth:** The game simplifies mutual belief, but real we-mode requires iterative "I know that you know..." awareness. Use debrief to distinguish:  
    > "Did your group achieve common knowledge of commitment? Or just mutual belief? This tension is central to collective intentionality debates (e.g., Bratman vs. Gilbert)."  

  ---

  ### **Logistical Notes**  
  - **Materials:** Use cheap paper cups (inherently unstable) and twine.  
  - **Timing:** 90 mins = Intro (10), Round 1 (10), Round 2 (10), Debrief (60).  
  - **Why It Works:** Players *feel* the normative shift when withdrawal forces renegotiation. I-mode players’ strategic defection highlights how mutual belief alone is fragile without common knowledge.  
  - **Adaptation:** If groups finish early, add a meta-discussion: "Could you have maintained we-mode if roles were public?"  

  This design forces confrontation with the I-mode/we-mode gap through visceral stakes—no lectures needed until debrief. The physicality of the tower and string withdrawal makes abstract concepts tangible.
