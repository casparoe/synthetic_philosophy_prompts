answer: |-
  That's an **excellent** ethical dilemma straight out of your course material! Your instincts are spot on – this perfectly illustrates the tension Plutarch explored and the dangers of hagiography. Here's a breakdown:

  1.  **Your Brother's Point Has *Some* Merit (But It's Flawed):**
      *   **Yes:** Very few historical figures are flawless saints. Plutarch *did* use lives as moral mirrors, sometimes smoothing rough edges to highlight virtues. We *can* learn from aspects of flawed individuals.
      *   **But:** Plutarch's "smoothing" wasn't usually outright deception about *major, defining unethical conduct*. He focused on positive traits within complex figures, often *comparing* flawed heroes to highlight specific virtues/vices. More importantly, **"every biography does that" is demonstrably false.** Ethical modern biography strives for accuracy and wrestles with complexity. Presenting a known credit-thief and abuser *solely* as a "persevering genius" isn't just omission; it's actively creating a false image.

  2.  **The Hagiography Problem is Real & Dangerous Here:**
      *   **Lying by Omission:** Skipping the unethical behavior fundamentally misrepresents who this scientist was and *how* they achieved their discovery. It erases the harm done to the grad student(s) and perpetuates the myth that scientific greatness justifies abuse/unethical behavior.
      *   **The Moral Mirror is Cracked:** Holding this sanitized figure up as an "exemplar" teaches the wrong lessons: that success trumps ethics, that exploiting others is acceptable, that perseverance means stepping on people. Is *that* the virtue you want mirrored?
      *   **Perpetuating Harm:** Using the hagiographic source uncritically reinforces the existing power structures that allowed the abuse/credit theft to happen and be covered up.

  3.  **Should He Pick Someone Else? Not Necessarily. He Has a Better Option:**
      *   **The Opportunity:** This is a **perfect** chance for your brother to put his Plutarch reading into practice in a *critical* way. Instead of presenting the *sanitized* version or rejecting the figure entirely, he can present a **Plutarchian-style *critical* examination.**
      *   **The Better Approach:**
          *   **Acknowledge the Achievement:** Start with the discovery – it *was* significant.
          *   **Expose the Flaws:** Present the well-documented unethical behavior (credit theft, abuse). Cite sources! This isn't gossip; it's historical/scientific record.
          *   **Analyze the Tension:** This is the Plutarch part! **Pair the virtue and the vice.** "This scientist demonstrated extraordinary perseverance in their research *but* simultaneously failed profoundly in ethical leadership and collaboration, causing significant harm to colleagues." How do we reconcile the genius with the abuse?
          *   **Critique the Hagiography:** Explicitly point out that the source he found *omits* these critical facts. *Why* might that be? (Protecting reputation, simplifying for young audiences, perpetuating the "lone genius" myth?) This makes the presentation metacognitive and much more interesting.
          *   **The Moral Question:** Pose the Plutarchian question: **"What can we *truly* learn from this life?"** Can we admire the scientific work while condemning the methods and character? Does the achievement outweigh the harm? What does this tell us about the pressures of science, mentorship, and how history gets written?

  4.  **Is it Okay to Learn from a Sanitized Life if You Know it's Sanitized?**
      *   **Marginally better, but deeply problematic:** Knowing it's sanitized avoids *personal* deception, but:
          *   **It Doesn't Fix the Presentation:** Presenting *only* the sanitized version to his class is still spreading misinformation and perpetuating the false heroic narrative. He becomes complicit in the whitewashing.
          *   **It Misses the Learning Opportunity:** The *real* ethical and historical lessons come from confronting the complexity and the *reason* for the sanitization.

  5.  **Does the Hagiographic Source Change Anything?**
      *   **Yes, it makes it MORE valuable – as an object of critique!** Don't reject it; **use it as Exhibit A** in how hero narratives are constructed. Comparing the sanitized account to documented historical records (like articles about the credit dispute, lab testimonials if available) becomes a powerful part of the presentation.

  **Conclusion & Recommendation:**

  *   **Don't** encourage him to just pick someone else (unless the teacher demands purely positive heroes, which would be pedagogically weak).
  *   **Do** encourage him **not** to present the sanitized version uncritically.
  *   **Strongly Advocate** for him to **reframe the presentation** using the Plutarchian model of critical comparison:
      *   Present the scientist *warts and all*.
      *   Highlight the tension between achievement and unethical conduct.
      *   Explicitly critique the hagiographic source as an example of how complex lives get simplified into misleading moral tales.
      *   Pose the big ethical question: "What can we *actually* learn from this complex, flawed life?"
  *   **Why this is better:**
      *   It's more ethical and truthful.
      *   It's far more intellectually rigorous and interesting.
      *   It directly applies concepts from *your* ethics course (and Plutarch!) to a real-world example.
      *   It teaches critical thinking about sources and hero narratives.
      *   It doesn't require finding a flawless saint (which doesn't exist), but engages with real human complexity.

  This approach transforms a potential ethical pitfall into a profound learning opportunity for your brother and his classmates. It moves beyond simplistic hero worship into the messy, challenging, and ultimately more rewarding territory of critical engagement with history and human character – exactly what Plutarch, at his best, encouraged. Good luck to him (and kudos to you for thinking this through so carefully)! And don't worry, "biologist" is a common typo!
