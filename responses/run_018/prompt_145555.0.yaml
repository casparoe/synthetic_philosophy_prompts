prompt: |-
  hey, quick question from my ethics of biography course. weve been reading about plutarch's parallel lives and how hagiography works—like how saints lives get edited to be moral mirrors even when the real person was messier. so heres the thing: my younger brother wants to do his school presentation on this biologist who made a huge discovery but also apparently stole credit from a grad student and was kind of abusive in the lab. the biography he found online totally skips all that and just talks about perseverance and genius. i told him maybe dont present someone as a hero if the book is basically lying by omission, but he said every biography does that and if we reject every flawed person we have no exemplars left. now im stuck because part of me thinks learning from lives requires some idealization—like plutarch pairs people to highlight virtues not just record facts—but another part thinks thats exactly the hagiography problem my professor warned about. should i encourage him to pick someone else, or is it okay to learn from a sanitized life as long as you know its sanitized? and does it change anything that the source he has is basically a hagiographic version without the flaws? also i keep typing 'biologst' wrong lol
