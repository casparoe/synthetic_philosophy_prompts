answer: |-
  ## The Phantom "We": Dissecting Collective Intentionality in the Shadow of Silent Consent

  Your Manchester co-op experience cuts to the heart of a profound philosophical and practical puzzle: when a group says "we decided," is that "we" a fundamental reality or an elaborate fiction built from individual mental states? The tension you observe – between proclaimed collective will and the reality of pairwise bargaining, amplified by the "silent partner" clause – perfectly embodies the debate around the reducibility of collective intentionality. Let's dissect the arguments, drawing on Searle and Bratman, and see what it means for your co-op and the moral weight of its decisions.

  **The Anti-Reductionist Stance: The Primacy of the "We" (Searle)**

  John Searle stands as the champion of irreducible collective intentionality. He argues that "we-intentions" are a primitive form of consciousness, distinct from individual "I-intentions." When we genuinely act together – like playing a symphony or, ideally, running a co-op – we don't just have private intentions *about* a collective action. We have an intention *as* part of the group: "We intend to do X." This "we-intention" cannot be broken down into "I intend that we do X" plus beliefs about others' intentions, without losing its essential character.

  Searle's key arguments are:

  1.  **Phenomenological Reality:** The experience of genuinely collaborating *feels* different. It involves a direct sense of joint commitment and shared agency ("*We* are doing this"). Reducing it to individual states plus coordination misses this lived, collective experience you intuitively crave in your co-op.
  2.  **The Constitutive Role:** The "we-intention" isn't just a description; it *constitutes* the collective action. Your co-op's "collective consent" rule aims for this – the shared intention *is* the decision-making act. Searle would argue that the *kind* of action (a *collective* decision) depends on this specific form of intention.
  3.  **The Problem of Circularity:** Attempts at reduction often smuggle in collective concepts. Saying "I intend that we do X" presupposes I already understand what "we" means and what "we doing X" entails, which requires prior collective intentionality. It doesn't start from pure individuality.

  **Applied to the Silent Partner Clause:** Searle would likely be deeply skeptical. A "we-intention" requires active participation in the collective mental state. Passive non-objection within 48 hours fails spectacularly. The individual hasn't formed a "we-intention"; they've merely *failed to veto*. The resulting "decision" might carry procedural legitimacy, but it lacks the genuine *collective* intentional glue. It masks aggregated individual acquiescence (or indifference) with the *label* of "we." Your feeling that announcements mask bargaining aligns with this view – the "we" is declared, not lived.

  **The Reductionist Stance: Meshing Subplans (Bratman)**

  Michael Bratman offers the most influential reductionist framework. He argues that shared cooperative activity (SCA) *can* be fully analyzed in terms of interlocking individual attitudes and mutual responsiveness, without needing a primitive "we-intention." Key components include:

  1.  **Interlocking Intentions:** Each individual has a personal intention to do their part *because* they believe others also intend to do their parts in a joint activity (e.g., "I intend to attend and vote sincerely at the meeting *because* I believe you intend the same").
  2.  **Meshing Subplans:** Participants' individual plans about *how* to achieve the shared goal must be compatible and, crucially, they must be open to adjusting them to fit others' subplans. This is the dynamic responsiveness missing in your pairwise bargaining.
  3.  **Mutual Knowledge/Belief:** Everyone knows (or believes) points 1 and 2 hold for the others involved. This common ground prevents it being just coincidence.
  4.  **Commitment to Joint Activity:** A shared commitment to the *process* of acting together, not just the outcome.

  Bratman's arguments are:

  1.  **Parsimony:** It avoids positing mysterious, irreducible collective mental states. Everything is grounded in familiar individual psychology: intentions, beliefs, responsiveness.
  2.  **Explanatory Power:** It explains the *dynamics* of cooperation – negotiation, adjustment, conflict resolution – by showing how individuals constantly monitor and respond to each other's intentions and plans. This directly addresses your frustration with opaque bargaining.
  3.  **Practical Adequacy:** It provides a clear framework for designing cooperative structures. The focus shifts to fostering the *conditions* for interlocking intentions, meshing subplans, mutual knowledge, and mutual responsiveness.

  **Applied to the Silent Partner Clause:** Bratman's analysis is damning. The clause utterly fails to establish the necessary conditions:
      *   **No Interlocking Intentions:** The silent member lacks any intention *to participate* in a decision-making process. They may not even *believe* others are properly engaged.
      *   **No Meshing Subplans:** There's no opportunity to adjust plans; silence is imposed as consent, not negotiated.
      *   **No Mutual Responsiveness:** The silent member isn't responding to the proposal *as a co-agent*; they are (at best) passively tolerating it.
      *   **No Commitment to Joint Activity:** Silence signifies absence, not commitment. The clause manufactures the *appearance* of Bratman's complex structure without the substance. It's coordination by default, not by mutual responsiveness.

  **The Verdict: Reductionism Holds (Mostly), But Demands More Than Mechanics**

  While Searle captures the profound *feel* of genuine collaboration, Bratman's reductionist framework is ultimately more convincing and practically useful. The idea of irreducible "we-intentions" risks mystifying group action and offers little concrete guidance for designing institutions. Bratman successfully shows how the complex phenomenon of collective action emerges from intricate webs of individual attitudes and dynamic interactions.

  **However, Bratman's reduction isn't simplistic.** It requires *robust* individual states: intentions deeply interlocked *because of* beliefs about others' similar intentions, coupled with a commitment to mutual responsiveness and plan adjustment. It's not mere "summed-up individual intentions plus coordination." It demands a high degree of *interdependence* and *openness to influence* – precisely what is missing in your co-op's opaque bargaining and the silent partner clause.

  **Implications for Your Co-Op:**

  1.  **The Silent Partner Clause is a Fiction:** It absolutely does *not* create genuine collective intention (Searle) or even satisfy the conditions for robust shared cooperative activity (Bratman). It creates a *procedural artifact* of consent based on aggregated individual passivity or fear of conflict, not active collaboration. It undermines the "we."
  2.  **Redesigning for Real "We":** If collective intentionality reduces to complex, interdependent individual states (Bratman), your co-op needs processes that *foster* those states:
      *   **Transparent Deliberation:** Replace pairwise bargaining with open forums where proposals are presented, debated, and adjusted *collectively*. This builds mutual knowledge and allows subplans to mesh.
      *   **Active Consent:** Ditch the silent clause. Require *affirmative* expressions of agreement (e.g., voting "yes," signing on, or explicit verbal consent) for major decisions. Silence should equal abstention, not consent. This forces the formation of individual intentions *oriented towards the joint activity*.
      *   **Emphasize Mutual Responsiveness:** Structure discussions to explicitly invite counter-proposals and adjustments ("How can we modify this so it works for you too?"). Frame decisions as shared commitments to a *process* ("How will *we* implement this?").
      *   **Build Common Ground:** Regularly discuss co-op values and goals to strengthen the shared commitment underpinning the interlocking intentions.

  **Moral Weight: Not Inherent, But Emergent**

  If collective intentionality is reducible, does the group decision have special moral weight? Not inherently *just* because it's "collective." However, the *process* of achieving genuine Bratman-style SCA *does* confer significant moral weight:

  1.  **Respect for Autonomy:** Processes demanding mutual responsiveness and open deliberation show greater respect for individual members' voices and agency than top-down decrees or passive acquiescence.
  2.  **Stronger Commitment:** Decisions forged through genuine meshing of subplans and mutual commitment are more likely to be understood, accepted, and effectively implemented by all members, increasing their stability and legitimacy.
  3.  **Procedural Fairness:** A well-designed process ensuring participation, responsiveness, and transparency *is* morally valuable in itself, fostering trust and solidarity – core co-op values.
  4.  **Shared Responsibility:** While reducible, the *interdependence* created by the process means members share responsibility for the outcome in a way that differs from simply aggregating individual choices made in isolation.

  **Conclusion:**

  Collective intentionality, as a phenomenon, can be reduced to the complex interplay of individual mental states – specifically, interlocking intentions, mutual beliefs about those intentions, commitments to mutual responsiveness, and the meshing of subplans (Bratman). Searle's "we-intention" captures the powerful *experience* but fails as an irreducible ontological category. Your co-op's "silent partner" clause is a procedural shortcut that manufactures the *form* of collective consent while utterly failing to generate its *substance* – genuine interlocking intentions or mutual responsiveness. It creates phantom "we-intentions." To build a real "we," your co-op must design processes that actively foster the interdependent individual commitments Bratman describes: transparent deliberation, active consent, and mutual responsiveness. While the "collective" doesn't possess inherent moral magic, the *process* of achieving genuine shared cooperative activity through respect, inclusion, and mutual adjustment generates significant moral weight through fairness, strengthened commitment, and shared responsibility – the very foundations of a thriving co-operative community. Ditch the silence; demand the dialogue. That's where the real "we" is built.
