reasoning: |-
  We are building a decision tree for positions in the debate on virtue ethics and the situationist critique.

  The tree will have three main nodes:

  1. The first node addresses the empirical claim about cross-situational consistency in behavior (based on classic social psychology experiments like Milgram, Stanford prison, etc.). The question is: "Do you accept that cross-situational consistency in behavior is basically near-zero, based on the classic social psychology experiments?"

     - If YES, then we proceed to a branch that questions whether we should abandon the concept of virtue as traditionally conceived.
     - If NO, then we move to the second node to ask about the nature of the consistency.

  2. The second node (only if we answered NO to the first) asks: "If there is some consistency in behavior, is it global (the same trait manifests across many different situations) or local/role-bound (e.g., honest at work but cowardly with family)?"

     - If GLOBAL, then we have a position that defends traditional virtue ethics against the situationist critique.
     - If LOCAL, then we have a position that modifies virtue ethics to account for local traits.

  3. The third node (only if we answered YES to the first) asks: "Should we reconceive virtue altogether as distributed across social ecologies — not inside individual souls but in institutional patterns and relational structures?"

     - If YES, then we have a position that moves towards an ecological or institutional account of virtue.
     - If NO, then we have a position that abandons virtue ethics altogether.

  However, note that the user also wants to flag pairs that the tree cannot separate (e.g., interactionism and weak ecological views). Also, we must mark settled findings and contested issues appropriately.

  Let's outline the entire tree:

  - Root: 
    - Question 1: "Do you accept that cross-situational consistency in behavior is basically near-zero, based on the classic social psychology experiments?" 
      - [Settled finding: It is settled that behavior varies more by situation than folk psychology expects. However, the near-zero claim is contested. We note that the experiments show substantial situation-dependence, but the interpretation of the degree of consistency is contested.]

    - If YES (to near-zero consistency):
        - Then we go to Question 3: "Should we reconceive virtue altogether as distributed across social ecologies — not inside individual souls but in institutional patterns and relational structures?"
            - If YES: This leads to "Ecological Virtue Theory" (e.g., influenced by environmental or institutional approaches). 
            - If NO: This leads to "Virtue Eliminativism" (the view that we should abandon virtue concepts in moral theory).

    - If NO (to near-zero consistency, i.e., you believe there is some non-negligible consistency):
        - Then we go to Question 2: "If there is some consistency in behavior, is it global (the same trait manifests across many different situations) or local/role-bound (e.g., honest at work but cowardly with family)?"
            - If GLOBAL: This leads to "Globalist Virtue Ethics" (traditional Aristotelian view, defended by some against situationism).
            - If LOCAL: This leads to "Interactionist Virtue Ethics" (also called "local trait" view, e.g., as proposed by some situationism-responders).

  But note: the user also wants to flag that some positions might blur. In particular, the Ecological Virtue Theory might have a weak form that is close to Interactionism (which is about local traits). However, Interactionism is in the branch that denies near-zero consistency (because it posits local consistency) and then chooses local over global. Ecological Virtue Theory is in the branch that accepts near-zero individual consistency and then re-conceives virtue as distributed.

  But what if someone accepts near-zero individual consistency but then also believes that local roles are part of an ecology? The tree might force a separation that doesn't perfectly hold. We note that.

  Also, there might be a position that accepts near-zero consistency but does not go ecological and does not eliminate virtue? That's the eliminativist branch.

  We also note that the second node (local vs global) is contested: whether local dispositions can ground moral praise is a contested issue.

  Let's write the tree with annotations:

  ---

  **Decision Tree for Virtue Ethics vs Situationist Critique Positions**

  **Node 1: Cross-Situational Consistency**  
  *(Settled: Behavior varies by situation more than folk psychology expects. Contested: Whether cross-situational consistency is near-zero.)*  
  Question: Do you accept that cross-situational consistency in behavior is basically near-zero, based on the classic social psychology experiments?  
  - **YES** → Go to Node 3  
  - **NO** → Go to Node 2  

  **Node 2: Nature of Consistency**  
  *(Contested: Whether local dispositions can ground moral praise.)*  
  Question: If there is some consistency in behavior, is it global (the same trait manifests across many different situations) or local/role-bound (e.g., honest at work but cowardly with family)?  
  - **GLOBAL** → **Globalist Virtue Ethics**  
    - *Description: Defends the traditional view that virtues are global character traits. Argues that the situationist experiments do not show that such traits are impossible or nonexistent, but rather that they are rare or that the experiments are flawed.*  
  - **LOCAL** → **Interactionist Virtue Ethics** (sometimes called "trait-situational interactionism")  
    - *Description: Accepts that traits are real but only locally consistent. Virtues are tied to specific contexts or roles. Moral education and assessment should focus on these local traits. Contested: Can such local traits ground the kind of moral praise traditionally associated with virtues?*  

  **Node 3: Reconceiving Virtue Ecologically**  
  Question: Should we reconceive virtue altogether as distributed across social ecologies — not inside individual souls but in institutional patterns and relational structures?  
  - **YES** → **Ecological Virtue Theory**  
    - *Description: Virtue is not primarily a property of individuals but of social systems, institutions, and environments. The focus shifts to designing contexts that promote virtuous behavior and to collective responsibility.*  
  - **NO** → **Virtue Eliminativism**  
    - *Description: Abandons virtue ethics as a viable moral theory. Argues that the empirical evidence undermines the very concept of character traits as traditionally understood, and that we should turn to other ethical frameworks (e.g., consequentialism, deontology) that do not rely on character.*  

  ---

  **Notes on Blurred Boundaries:**
  - The boundary between **Interactionist Virtue Ethics** (local traits) and **Ecological Virtue Theory** may be blurred. For instance, a weak ecological view might still allow for local traits within a structured environment, while a strong ecological view might reject any individual dispositional attributions. The tree separates them by the initial commitment to near-zero consistency (which Interactionism denies) and the ecological focus (which Interactionism does not necessarily require). However, in practice, some theories may incorporate elements of both.

  This tree provides a clear path from basic empirical commitments to a theoretical position without assuming prior knowledge of jargon. Each branch is based on concrete, answerable questions.
answer: |-
  Here’s a sorting tree that maps empirical commitments to theoretical positions, with clear nodes, settled/contested markers, and blurred boundaries flagged. Each branch is phrased as a concrete claim to avoid jargon dependence.

  ---

  ### **Virtue Ethics vs. Situationist Critique: Position Sorting Tree**  
  *(Settled findings = ✅ | Contested claims = ⚠️)*  

  #### **1. FIRST NODE: CROSS-SITUATIONAL CONSISTENCY**  
  **✅ Settled Finding:** *Behavior varies significantly by situation (more than folk psychology expects), per experiments like Milgram/Stanford Prison.*  
  **Question:** Do you accept that **cross-situational consistency in behavior is near-zero** (i.e., people rarely act the same way across different contexts)?  
  - **YES** → Go to Node 3.  
  - **NO** → Go to Node 2.  

  ---

  #### **2. SECOND NODE (IF NO TO NODE 1): NATURE OF CONSISTENCY**  
  **⚠️ Contested Claim:** *Whether local behavioral patterns can support traditional "virtue" concepts.*  
  **Question:** When behavior **is** consistent, is it:  
  - **(A) GLOBAL** (e.g., "honest" at work, with family, and strangers)?  
  - **(B) LOCAL/ROLE-BOUND** (e.g., "honest at work but cowardly with family; truthful as a scientist but deceptive as a politician")?  

  | Answer: | Leads to: |
  |---------|-----------|
  | **A) GLOBAL** | **→ Globalist Virtue Ethics** <br> *Defends Aristotle; argues virtues are broad, stable traits. Dismisses situationism as overstated (e.g., Kupperman).* |
  | **B) LOCAL** | **→ Interactionist Virtue Ethics** <br> *Accepts virtues exist but only as context-bound "local traits" (e.g., Merritt, Snow). Rejects globalism as empirically naive.* |

  ---

  #### **3. THIRD NODE (IF YES TO NODE 1): VIRTUE RECONCEPTION**  
  **⚠️ Contested Claim:** *Whether abandoning individual virtues implies eliminativism or institutional redesign.*  
  **Question:** Should we **reconceive virtue as distributed across social structures** (e.g., institutions, relationships, environments) rather than inside individuals?  
  - **YES** → **Ecological Virtue Theory** <br> *Virtues are properties of systems, not souls (e.g., Alfano; "moral technology" views). Focus on designing ethical environments.*  
  - **NO** → **Virtue Eliminativism** <br> *Rejects virtue concepts entirely (e.g., Harman, Doris' early work). Favors alternative ethics (e.g., utilitarianism) without character traits.*  

  ---

  ### **KEY BLURRED BOUNDARIES (⚠️ AMBIGUOUS EDGES):**  
  1. **Interactionism ↔ Weak Ecological Views:**  
     - *Blur if* you see "local traits" as inseparable from social roles (e.g., "work-honesty" requires institutional norms). Tree separates them by **scope**: Interactionism keeps virtues in individuals (context-bound), Ecological Theory relocates them to systems.  
  2. **Eliminativism ↔ Ecological Theory:**  
     - *Blur if* ecological structures functionally replace virtues (eliminativists might approve). Tree separates by **commitment to "virtue"**: Ecological Theory retains the term for systems; Eliminativism discards it.  

  ---

  ### **TREE SUMMARY**  
