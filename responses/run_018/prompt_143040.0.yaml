  ### **USAGE NOTES**  
  - **No unnamed gaps:** All logical endpoints map to named positions.  
  - **Settled/Contested Clarity:**  
    - ✅ Node 1’s variability claim is settled; near-zero claim is contested.  
    - ⚠️ Node 2’s moral relevance of local traits is contested.  
    - ⚠️ Node 3’s institutional virtue status is contested.  
  - **Anti-jargon:** Nodes rely on intuitive claims (e.g., "honest at work but cowardly at home").  
  - **Neutral framing:** No position presented as consensus (e.g., Node 1’s "near-zero" is debatable).  

  This tree forces engagement with empirical claims first, isolating theoretical commitments without presupposing loyalty to virtue ethics. Paths reveal how foundational stances cascade into live debates (e.g., local traits’ moral worth).
