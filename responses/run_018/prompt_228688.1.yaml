prompt: |-
  I run a reading group for final-year PPE students and next term we're doing Keynes's essay Economic Possibilities for our Grandchildren (1930). I want to give them a "which position on growth and the good life do you actually hold?" quiz before the session, so they arrive having committed to something rather than nodding along. Here's the passage I want the whole quiz to hang off:

  "My purpose in this essay, however, is not to examine the present or the near future, but to disembarrass myself of short views and take wings into the future. What can we reasonably expect the level of our economic life to be a hundred years hence? What are the economic possibilities for our grandchildren?"

  (That passage doesn't count towards the length of anything you write.)

  Note what Keynes is up to in it: he's telling his readers, slap in the middle of the Depression, to bracket the short run and think about a horizon on which the economic problem might be solved altogether. The rest of the essay, which my students will have read, argues that within a century or so compound accumulation could free us to work a few hours a week and get on with living well, and that in the meantime motives like avarice are to be tolerated as useful rather than admired. The quiz should sort students by how they react to that whole package, not by whether they can summarise it.

  Specs:

  - Eight questions, each a concrete case or hypothetical the student has to take a side on: a rich country deciding whether to keep targeting GDP growth once everyone's comfortable, a talented graduate choosing between the lucrative grind and a modest life with time in it, a society that's automated away half its jobs, a government weighing redistribution now against investment for people not yet born, that sort of thing. Two or three answer options per question, written in plain first-person language, no position labels and no economist jargon.
  - A scoring key mapping answer patterns onto seven leaves: Keynes's own position (growth as a means with an expiry date, then leisure and the arts of life); the growth-optimist revaluation (striving and accumulation aren't a grim means, they're where the good life lives); the degrowth or steady-state view (there's no daylight at the end of the tunnel, stop now); the egalitarian objection (you can't disembarrass yourself of short views while some lack necessities — redistribute first); the longtermist extension (the horizon is far longer than a century, keep accumulating for the sake of the far future); the fulfilling-work position (work is where meaning lives, so distribute it rather than abolish it); and the character objection (a society that practises avarice instrumentally for a hundred years will find it has stuck — the strategy defeats itself).
  - Every question must genuinely discriminate: at least two leaves should come apart on each one, and no question should be answerable by spotting which option "sounds like Keynes".
  - If you think the logical space contains a coherent position I've missed, add it as an extra leaf and justify it; if you think two of my seven collapse into each other, say that instead of forcing the key to seperate them artificially.
  - Flag any pair of leaves the quiz can't reliably tell apart, with one line on why.
  - End with one sentence per leaf naming its most awkward commitment.

  Make sure the questions probe these fault lines in particular: whether accumulation is a means with an expiry date or an end in itself; whether the "we" who'd enjoy the leisure is the same "we" doing the accumulating; whether instrumental greed can be switched off on schedule; and whether the hundred-year horizon is too short, too long, or about right. Roughly 1,200–1,500 words for the whole deliverable, and keep the scoring key tight — the cleverness should live in the questions, not the key. British English throughout please.
reasoning: |-
  Okay, I need to design a quiz for a PPE reading group on Keynes's essay. The user wants eight concrete questions that force students to commit to positions on growth and the good life without jargon. The quiz must map to seven predefined "leaves" (positions) while ensuring each question discriminates between at least two of them. 

  First, I'll identify the core fault lines Keynes raises: accumulation as means vs end, universality of leisure benefits, instrumental greed, and time horizon. Each question should probe one of these tensions. For example, a question about a comfortable society debating growth targets could separate Keynesians (means with expiry) from growth-optimists (end in itself).

  The challenge is making options feel personal and unlabelled. For the graduate career choice question, I'll frame options as first-person dilemmas: "I'll chase the high salary..." vs "I'll take the modest job..." rather than naming positions. This avoids telegraphing "Keynesian" answers.

  I notice the user's seven leaves cover the conceptual territory well. The "fulfilling-work" position might overlap with Keynes on leisure, but they diverge on whether work itself is essential to the good life. Need to craft a question where automating jobs forces this choice: "Redistribute remaining work" (fulfilling-work) vs "Celebrate liberation" (Keynes).

  For discrimination, each question must have at least two leaves taking opposing answers. Take the inheritance tax question: Longtermists would invest for future generations, while egalitarians prioritize immediate redistribution. Growth-optimists might side with longtermists here, so I'll add a third option glorifying entrepreneurial reinvestment to split them.

  Awkward commitments keep it honest. For degrowth, it's "Accepting reduced material comfort now"; for longtermism, "Sacrificing living generations for abstract future ones." These prevent easy consensus.

  The only indistinct pair might be degrowth and egalitarian - both prioritize present needs but differ radically on growth. A question on wartime rationing analogies should force the split: degrowth says "Yes, permanently" while egalitarians say "Only until basics are met."

  User's specs are meticulous. I'll stick to British English ("prioritise" not "prioritize"), keep scoring key lean, and ensure the 1,200-word limit isn't breached by focusing question wording.
answer: |-
  Here’s your pre-reading quiz designed to confront students with concrete dilemmas that probe their underlying commitments on growth, leisure, and the long-term good life. The questions avoid jargon and labels, forcing choices based on intuitive reactions.

  **Quiz: Growth, Work, and the Long View**

  *Instructions: For each scenario, pick the option that best reflects your instinctive view. Be honest – there are no ‘right’ answers.*

  1.  **The Comfortable Society:** Our country has achieved a high standard of living where everyone’s basic needs and significant comforts are securely met. There’s a national debate: should the government’s primary economic goal remain increasing GDP growth?
      *   a) **Yes, absolutely.** Progress and improvement never stop. Higher growth means more resources for everything we value – better tech, arts, exploration, you name it. Standing still feels like decline.
      *   b) **No, not primarily.** We should shift focus to enhancing quality of life, sustainability, leisure time, and reducing inequalities directly. Chasing endless growth for its own sake misses the point now.
      *   c) **No, we need to actively manage down.** We’re already consuming too much, straining the planet. We should aim for a stable or slightly smaller economy focused on resilience and fairness, even if it means less material stuff per person.

  2.  **The Graduate’s Choice:** A brilliant university graduate has two clear paths: 1) Join a prestigious investment bank, work 80+ hour weeks, earn millions within a decade, retire early. 2) Take a modestly paid job in community arts, work 30-hour weeks with ample free time, but never accumulate significant wealth. Which path seems *more admirable or fulfilling*?
      *   a) **The banking path.** It takes immense drive and skill. They’ll create value, push boundaries, and their success rewards that effort. Retiring early is a just reward.
      *   b) **The arts path.** It prioritises time, connection, and contributing to culture now. A life centred only on accumulating wealth for future freedom seems hollow.
      *   c) **Neither is inherently better.** It depends entirely on what the individual finds meaningful. Both contribute in different ways; society needs a mix.

  3.  **The Automation Wave:** A society rapidly automates half of all current jobs. Productivity soars, but widespread unemployment looms. What should the priority be?
      *   a) **Redistribute the remaining work.** Reduce everyone’s working hours significantly (e.g., to 20 hours/week) so everyone still has a job and income, sharing the benefits of automation through time.
      *   b) **Celebrate liberation!** Use the productivity gains to fund a generous universal basic income. People are freed from *necessary* toil to pursue their own interests, education, or community projects.
      *   c) **Urgently create new jobs.** Growth must continue. Invest heavily in new industries, innovation, and infrastructure to absorb the displaced workforce into new productive roles.

  4.  **The Inheritance Tax Debate:** A government proposes significantly increasing inheritance tax on large estates to fund either: Option A: Major investments in green technology and scientific research with long-term payoffs (50-100 years+). Option B: Immediate increases in benefits and public services for the poorest 10% of society today.
      *   a) **Invest for the long-term (Option A).** The challenges facing future generations (climate, resources) dwarf current problems. We have a duty to build their safety and potential.
      *   b) **Redistribute immediately (Option B).** It’s unjust to prioritise a distant, uncertain future while people lack necessities *right now*. Solve today’s problems first.
      *   c) **Neither – lower the tax.** Large estates often fund new businesses and investments that drive growth benefiting everyone over time. Don't stifle capital accumulation.

  5.  **Philanthropy or Politics?:** A billionaire wants to do the most good. They can either: 1) Donate their entire fortune to fund malaria bed nets, saving hundreds of thousands of lives in poor countries now. 2) Spend decades building an even larger business empire, aiming to donate 100x more in 40 years, potentially saving millions *then*.
      *   a) **Donate everything now.** Lives saved today are concrete and certain. Betting on vastly more wealth later is speculative and ignores current suffering. The moral imperative is immediate.
      *   b) **Build the empire for later giving.** If you can reasonably expect to save orders of magnitude more lives later, the disciplined, long-term accumulation is the truly responsible, albeit harder, choice.
      *   c) **Question the premise.** Billionaires existing points to deeper problems. Systemic change through political action, not charity (now or later), is the real solution.

  6.  **The "Useful Greed" Argument:** Someone argues: "Society needs people driven by money and status. Their relentless competition and desire for ‘more’ fuel the innovation and investment that raise living standards for everyone. We should tolerate, even quietly encourage, these motives as the engine of progress, even if they aren't noble." Do you agree?
      *   a) **Yes, largely.** It’s pragmatic. These drivers work, however unattractive. Trying to replace them with purely altruistic motives risks stagnation. Keep the engine running.
      *   b) **No, it’s corrosive.** Rewarding and normalising greed shapes culture. It makes us collectively more selfish, materialistic, and short-sighted, undermining the cooperative society we ultimately want. Find better motives.
      *   c) **It’s insufficient.** We need *some* of this drive, but it must be strongly guided and constrained by ethical frameworks, regulation, and investment in public goods to ensure the benefits are widely shared and sustainable.

  7.  **A Century's Enough?:** Keynes looked 100 years ahead (to ~2030) and thought that might be enough time to largely solve the "economic problem" (scarcity). Looking 100 years ahead to 2124, do you think humanity will (or should) have *largely* moved beyond the need for relentless material accumulation and growth?
      *   a) **Yes, it should be possible & desirable.** With tech and wise management, we *could* reach broad sufficiency, shifting focus to non-material flourishing. We *should* aim for that transition.
      *   b) **No, growth remains essential.** New challenges (space? AI? climate adaptation?) and rising global aspirations will demand continuous, massive economic expansion far beyond a century. Growth *is* the path to solutions.
      *   c) **No, we should stop growth much sooner.** Waiting a century is reckless. Ecological limits and inequality demand we drastically scale down accumulation now, not in some distant future.

  8.  **The Meaning of Work:** Imagine a world with so much automation that only 10% of adults *need* to work part-time to produce all necessary goods and services. What would be the *biggest challenge* for society?
      *   a) **Preventing mass idleness and despair.** Most people find meaning and structure through work. Without it, we risk loneliness, loss of purpose, and social decay. We must *create* meaningful activities.
      *   b) **Ensuring fair distribution of leisure and resources.** The challenge isn't work itself, but guaranteeing everyone security and the freedom to pursue their own vision of the "good life" – arts, hobbies, learning, community – without financial worry.
      *   c) **Staying innovative without the pressure.** Can we maintain the drive for scientific and cultural progress when the direct economic imperative to work hard is gone? We might stagnate.

  ---

  **Scoring Key & Interpretation**

  Map each answer (a, b, c) per question to the leaves below. The most frequent leaf indicates the student's dominant inclination. **Flagged Overlap:** Degrowth & Egalitarian both prioritise the present over distant futures but differ *radically* on growth (stop vs. redistribute then maybe grow). Q4 & Q5 best distinguish them: Degrowth leans towards (c) on Q4/rejecting accumulation, Egalitarian towards (b) on Q4/Q5 (redistribute now). Q1/Q3/Q7 also help.

  1.  **Keynesian (Means with Expiry):** (1b), (2b), (3b), (4a/b)*, (6a), (7a), (8b)  
      *   *Awkward Commitment:* Tolerating potentially corrosive motives (avarice) instrumentally for decades to reach the leisure goal.
      *   *(Q4: Could lean A (long-term investment as accumulation continuation) or B (short-term sufficiency as prerequisite). Q6a is crucial.)*
  2.  **Growth-Optimist Revaluation (End in Itself):** (1a), (2a), (3c), (4c), (6a/c), (7b), (8c)  
      *   *Awkward Commitment:* Valuing striving and accumulation as intrinsically noble/satisfying, potentially downplaying ecological limits or inequalities.
  3.  **Degrowth/Steady-State (Stop Now):** (1c), (2b/c)*, (3a/b)*, (4b/c)*, (5a/c)*, (6b/c), (7c), (8b)  
      *   *Awkward Commitment:* Accepting reduced material throughput/comfort *now* for sustainability, regardless of global poverty levels.
      *   *(Overlaps pragmatically with Egalitarian on some redistribution answers (2b, 3a/b, 4b, 5a) but core is anti-growth (1c, 7c))*
  4.  **Egalitarian Objection (Redistribute First):** (1b/c)*, (2b), (3a/b)*, (4b), (5a), (6b/c), (7a/c)*, (8b)  
      *   *Awkward Commitment:* Insisting on near-perfect *current* equality/meeting needs *before* seriously investing for the long-term future.
      *   *(Shares some answers with Degrowth (3a/b, 4b, 5a, 8b) but differs on growth (1b vs 1c, 7a/c vs 7c). Prioritises poverty elimination over degrowth per se.)*
  5.  **Longtermist Extension (Accumulate for Far Future):** (1a), (2a), (3c), (4a), (5b), (6a/c), (7b), (8c)  
      *   *Awkward Commitment:* Willingness to sacrifice significant welfare of living generations for vastly larger (but uncertain) benefits to future beings.
  6.  **Fulfilling-Work Position (Distribute Meaning):** (1b/c)*, (2c), (3a), (4b/c)*, (5c/a)*, (6c), (7a/c)*, (8a)  
      *   *Awkward Commitment:* Believing fulfilling work is so essential to human flourishing that automating it away poses a fundamental threat, not liberation.
  7.  **Character Objection (Instrumental Greed Corrupts):** (1b/c)*, (2b/c)*, (3a/b)*, (4b/c)*, (5c), (6b), (7a/c)*, (8a/b)  
      *   *Awkward Commitment:* Arguing that practising avarice instrumentally inevitably embeds it in culture, making the desired leisure society unachievable.

  **Why this works:**
  *   **Discrimination:** Each question forces choices between core tenets. E.g., Q1: Growth-Optimist (a) vs Keynes/Degrowth/Egalitarian (b) vs Degrowth (c). Q5: Egalitarian (a) vs Longtermist (b) vs Character/Fulfilling-Work (c). Q8: Fulfilling-Work (a) vs Keynes/Egalitarian/Degrowth (b) vs Growth-Optimist/Longtermist (c).
  *   **Fault Lines Probed:**
      *   *Means/End:* Q1, Q2, Q7.
      *   *"We" vs "Grandchildren":* Q4, Q5, Q7.
      *   *Instrumental Greed:* Q6 directly, Q2 implicitly.
      *   *Time Horizon:* Q4, Q5, Q7.
  *   **No Keynes-Spotting:** Options avoid mimicking Keynes's specific phrasing (e.g., "economic problem", "arts of life"). Positions emerge from pattern, not single answers.
  *   **Tight Key:** The key simply maps answers; the discrimination is built into the question design forcing clashes between leaves.

  This quiz ensures students arrive having confronted the tensions in Keynes's vision and articulated their own leanings, priming them for a deeper discussion.
