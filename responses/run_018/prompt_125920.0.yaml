  The user seems to grasp the general idea but wants precision on Bernoulli's logical move. They're asking three layered questions: (1) Is this a mathematical recalculation with utility? (2) Or purely psychological? (3) Did Bernoulli invent log utility or did Cramer? 

  Looking back at Bernoulli's text... Yes, he absolutely proposes a mathematical recalculation. In Proposition 2, he explicitly defines utility as a logarithmic function of wealth ("emolumentum medium"). He doesn't just handwave - he derives finite expected utility using log(wealth) and shows it converges. That's the mathematical fix part. 

