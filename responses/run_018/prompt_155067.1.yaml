  What the user might really be probing is whether abstract legal theories can handle real moral catastrophe. The case makes both theories look a bit rigid—Fuller tangled in his own principles, Hart seeming morally indifferent. But maybe that's the point: transitional justice requires something beyond both frameworks, like a moral reset button. 

