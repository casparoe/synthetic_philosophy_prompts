  i was arguing with my roommate about whether a law can be so evil it stops being law at all, and he brought up that old case in Germany right after WWII where a wife turned her husband in for insulting Hitler, he got executed under some Nazi statute, and then years later she was put on trial for causing his death even though she technically followed the rules back then. i think people call it the Grudge Informer case? anyway i want to run it through that Hart vs Fuller debate about legal positivism versus natural law, but not just the basic "was the Nazi law really law" question. specifically, Hart thinks law and morality are seperate, while Fuller thinks law has an internal morality with those eight principles like generality and no retroactive punishment. so map it out properly: under Hart, was that Nazi statute valid law? under Fuller, does it fail his internal morality and therefore not count as law? and then here's the twist i'm stuck on — the post-war court convicted her using a retroactive crime about depriving liberty, which seems to break Fuller's own rule against retroactivity. so apply Fuller's framework not just to the Nazi regime but to the court that was trying to fix the injustice: does his view end up condemning the remedy almost as much as the original evil? does Hart's separation thesis actually explain better why we feel the court did the right thing even though it broke procedural rules? lay out the players, the options, the evidence, and say where each theory is silent or gets forced into something weird. also, is there something about transitional justice — like repairing a broken legal system — that neither Hart nor Fuller really anticipated? i don't need reading lists or citations, just work through the logic and tell me if this case breaks one of them or just makes both look a little silly. oh and i spelled separate wrong on purpose, don't correct me.
