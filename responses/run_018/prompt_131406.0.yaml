  okay so in my ethics class we've been stuck on whether religion actually makes people better or if secular societies can still have real trust between people. like one group always brings up studies where religious people give more to charity and lie less in experiments, and the other group just says look at denmark and sweden where hardly anyone believes but people still cooperate. we've argued for weeks and its literally the same points every time.

  i think part of the problem is we're using 'more moral' to mean two different things - like, behaving well because you're being watched by god versus having some internal sense of duty that doesn't need a watcher. but there's also this idea i came up with, maybe stupid, about 'moral infrastructure' - like religion might build cooperation through shared rituals that create thick trust, while secular societies have to do it through institutions and transparency. so maybe the debate isn't really about individual goodness at all but about whether you can have deep social cooperation without a shared supernatural framework?

  anyway, my actual question is: why has this debate stalled? is it a verbal disagreement about what 'moral' means, or are they actually asking different questions - one about individual psychology and one about social systems? and if it's the second one, what kind of thing would actually move it? a new study, a clearer distinction, or is it just bedrock intuitions about whether human nature needs religion to behave? could you please answer in british english?

  (sorry if there's typos, i'm on my lapop and the trackpad is being wierd)
