answer: |-
  Right, this is a properly gnarly debate that's bedevilled philosophy departments for decades. Your "moral infrastructure" idea is **far** from stupid – it's actually a rather sharp observation cutting to the heart of why your class is going 'round in circles. Let's break down why it stalls and what might move it on, in good British English.

  **Why the Debate Stalls:**

  1.  **Conflating Different Levels of Analysis (Individual vs. Societal):** This is the big one you've spotted. One side cites studies about **individual behaviour** (giving pennies in a lab, self-reporting lies) – often linked to **proximate motivations** (fear of divine punishment, desire for heavenly reward, social pressure within the religious group). The other side points to **societal outcomes** (high trust, low corruption, functional welfare states, cooperation on large scales) in places like Scandinavia – achieved through **secular systems and norms**. They're often answering fundamentally different questions: "Does religious belief make *this specific individual* more likely to do X in Y context?" vs. "Can a *whole society* function with high levels of trust and cooperation *without* widespread religious belief?" Talking past each other is inevitable.

  2.  **Ambiguity of "Moral":** You're spot on here too. What does "better" mean?
      *   **Compliance:** Behaving in line with rules (divine or societal) due to external surveillance/punishment (God, hell, CCTV, police)? Religion often excels at fostering *this kind* of compliance within its community.
      *   **Intrinsic Motivation:** Acting ethically because you've internalised the principles, regardless of observers? (Kant's duty, secular humanism). This is what the secular side often champions.
      *   **Outcomes:** Which system produces societies with less suffering, more fairness, higher trust, better cooperation? This shifts the focus to measurable societal health.
      Defining "moral" upfront is crucial, but rarely done properly in these heated debates.

  3.  **The "Moral Infrastructure" Insight:** Your term is excellent. Religion often provides:
      *   **Thick Trust:** Deep, identity-based trust within a shared belief community, fostered by rituals, shared narratives, and in-group norms. This builds strong *social capital* within the group.
      *   **Moral Framing:** A comprehensive (often supernatural) narrative explaining *why* be good, defining what "good" is, and offering mechanisms for repentance/forgiveness.
      Secular societies rely on:
      *   **Thin Trust:** Broader, more impersonal trust based on reliable institutions, rule of law, transparency, and enforced norms (e.g., you trust the bus driver not because you share their faith, but because they're licensed, the company is regulated, and the police exist).
      *   **Institutional Framing:** Morality is framed through human rights, social contracts, legal codes, and democratic processes. The "why" is often wellbeing, fairness, or societal stability, not divine command.
      The debate stalls because one side points to the *strength* of thick trust and religious framing for *in-group* cooperation, while the other points to the *breadth* and *inclusivity* of thin trust and institutional framing enabling cooperation in *diverse, pluralistic societies*.

  4.  **Selection Bias & Causation vs. Correlation:** Studies showing religious people give more often:
      *   **Measure giving *to religious causes*** (a huge chunk of religious "charity").
      *   May reflect the social networks and pressures *within* religious communities rather than inherent "goodness".
      *   Don't easily prove religion *caused* the behaviour (are inherently more prosocial people drawn to religion?).
      Conversely, pointing to Scandinavia ignores their historical Lutheran foundations which shaped their social values and institutions long before secularisation took hold. The "moral infrastructure" there has religious roots, even if the current populace isn't practising.

  5.  **Bedrock Intuitions:** Ultimately, there's a deep philosophical chasm:
      *   **One view:** Humans are inherently flawed/sinful and *need* the structure, authority, and transcendent motivation religion provides to consistently behave well, especially in large groups. Secular morality is seen as flimsy, relative, and lacking binding force.
      *   **The other view:** Humans are capable of developing robust ethical systems, empathy, and cooperation based on reason, experience, and shared humanity. Religion is seen as unnecessary and potentially divisive. These are foundational beliefs hard to shift with data alone.

  **How to Move the Debate Forward (Beyond Stalemate):**

  1.  **Insist on Clarification:** Demand definitions. "When you say 'more moral', do you mean more compliant on specific behaviours studied in labs, or do you mean creating a society with high generalised trust? Are we talking about individual psychology or societal systems?" Force the distinction you've identified.
  2.  **Embrace "Moral Infrastructure":** Introduce your term! Frame it as: "Perhaps instead of arguing who is 'better', we should ask *how different systems build the moral infrastructure needed for cooperation?* Religion uses shared belief and ritual for thick trust within groups. Secular pluralistic societies use institutions, laws, and transparency for thin trust across diverse groups. Can the latter replicate the *depth* of the former, or is the former too *exclusive* for modern diverse states?"
  3.  **Seek Nuanced Evidence (But Recognise Limits):**
      *   **Studies that distinguish:** Look for research separating religious giving to *religious* causes vs. *secular* causes, or studies on honesty that control for social desirability bias. Look at trust levels *between* different religious groups in religious societies vs. trust levels *across* diverse groups in secular societies.
      *   **Historical/Comparative Institutional Analysis:** Examine *how* societies transition from religious to secular moral infrastructures (like Scandinavia) – what worked, what challenges arose? Compare corruption indices, social mobility, happiness, and trust metrics across societies with *different* mixes of religiosity and institutional strength (e.g., comparing Denmark to a highly religious society with weak institutions, or to a secular society with weak institutions).
      *   **Psychology of Secular Morality:** Research into what motivates strong intrinsic secular ethics (e.g., identification with humanity, principled reasoning, empathy cultivation without divine command).
  4.  **Acknowledge the Philosophical Divide:** Recognise that even with better data and clearer distinctions, the fundamental question – "Do humans *need* a transcendent authority/supernatural framework to ground meaningful, binding morality and sustain large-scale cooperation?" – is philosophical. Evidence can inform this (e.g., can stable, cooperative atheists exist? Yes. Can stable, cooperative religious societies exist? Yes. Does widespread atheism *necessarily* lead to societal collapse? Evidence from Scandinavia suggests not). But the *interpretation* of that evidence will always be coloured by those deeper intuitions.

  **In short:** Your debate is stalled because it's conflating apples (individual religious behaviour in specific contexts) with oranges (societal cooperation in secular systems). Your "moral infrastructure" concept is a powerful tool to reframe it. Moving forward requires rigorously separating these levels, defining terms, using more nuanced evidence, and frankly acknowledging the underlying philosophical rift about human nature. It won't be resolved easily, but it can become a much more sophisticated and less repetitive discussion. Good on you for spotting the core issue – that's half the battle in ethics! Now go and be gently patronising to your classmates by asking them to define their terms... (only joking... mostly).
