  ## Sphex Cycle

  The amber hunter scans the dusty earth,  
  Her sting precise, the cricket stiff and stilled.  
  **The program runs; there is no choice.**  
  She drags the prize towards the burrow's berth,  
  A ritual of instinct must be filled.  
  The amber hunter scans the dusty earth.  

  One final check before the prey's rebirth  
  As larval food, by ancient drives instilled.  
  **The program runs; there is no choice.**  

  But shift the cricket, prove the sequence's worth –  
  Back to the entrance, logic is rebuilt.  
  The amber hunter scans the dusty earth,  

  Re-paralyzes (though no wound gives dearth),  
  Drags once again, her purpose unfulfilled.  
  **The program runs; there is no choice.**  

  Is learning just a path of scripted girth?  
  A branching code, though cleverly distilled?  
  The amber hunter scans the dusty earth.  

  The cleverest machine, confined from birth,  
  Explores its cage, by hidden limits grilled:  
  **Choice is not the same as bend.**  
  **The program runs; there is no choice.**  

