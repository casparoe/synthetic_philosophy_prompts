prompt: |-
  For most of a working life I was a clinical epidemiologist — screening, trial interpretation, and a good deal of time spent watching colleagues reason badly about their own results and well about everyone else's. In retirement I have begun reading philosophy in earnest, and I have drifted into the literature on self-deception: I have dipped into Mele, and into a couple of encyclopedia articles, mostly unsatisfying. What I bring to it is not a theory but a set of verdicts on cases from my own career, which I trust more than I trust anything I have read so far, and which I cannot get under one principle. I would be grateful if you would try, and if you would then tell me which verdicts I have to surrender.

  The cases, numbered for reference.

  1. A senior colleague spent fifteen years on a hypothesis about an occupational exposure. A large, well-designed trial returned a null result. Within a week he was saying that the exposure had been misclassified and the study underpowered, and over the following year he came — as certain as one can be about another mind — sincerely to believe that the trial told us nothing. I had watched him accept trials of exactly that design as decisive when they told against other people's hypotheses. Verdict: self-deception, and my clearest case.

  2. A friend dying of cancer told her family, repeatedly and with apparent warmth, that she was going to beat it. She had also, in the same month, sorted her papers, written three letters she asked to be delivered after her death, and said goodbye to me in a way that made no sense unless she knew exactly what was happening. Verdict: not self-deception. She knew. What she was doing was a kindness, and I do not think the term should be stretched to cover it.

  3. A graduate student in a lab I was associated with ran an analysis, re-ran it, dropped one site as an outlier, added a covariate, and stopped when the result crossed significance; then he believed the finding. He knew all about multiplicity. He would have spotted the identical procedure in someone else's paper in about ninety seconds. Verdict: self-deception, but a different animal from case 1 — in 1 the standards of evidence moved, in 3 the rule for gathering evidence moved — and I am honestly unsure whether he believes the result or only believes he is entitled to publish it.

  4. A different colleague who is simply a poor judge of evidence about everything: homeopathy, the markets, his own driving, the reliability of his memory. His errors point in every direction, including against his own interests. Verdict: not self-deception, just a badly calibrated estimator.

  5. A surgeon who kept a personal series of operative outcomes, quietly excluding the referrals he judged unsuitable on grounds he never wrote down, and who sincerely believed his mortality figures were the best in the country. He was scrupulous about data in every other corner of his practice. Verdict: self-deception. This is the case I keep returning to: I cannot say at what point his exclusion rule stopped being judgement and started being something else, and I cannot see that he could have said either.

  6. A man in his fifties with a strong family history of a late-onset disease who declined the genetic test, declined to read about it, changed the subject whenever it came up, and booked a year-long sailing trip. So far as I can tell he has no opinion whatever about whether he carries the variant: no belief either way. Verdict: my tongue says self-deception, loudly. My head says there is no false belief here, and no pair of beliefs, and therefore nothing for the accounts I have read to get a grip on. I would rather keep the verdict and give up the requirement of a false belief — but I can see what that costs, and cases 2 and 6 together seem to rule out both of the obvious models at once.

  7. A competitive acquaintance who insists, sincerely and often, that he does not care about priority; who refuses co-authorship on principle; and who is visibly furious for a week whenever someone else gets there first, and knows that he is. Verdict: self-deception, but about a desire rather than a belief — and what he lacks is not a belief but a certain kind of attention to his own behaviour.

  For what it is worth, here is the account I arrived at before I read any philosophy, in the only idiom I have. Self-deception is a directional error in belief-fixation: an estimate biased toward the result the agent wants, where the bias enters through the agent's own evidential itinerary — which questions she asks, when she stops asking, what she counts as a replicate, which of her own rules she applies to this case — rather than through the evidence itself or through her prior; and where she would reject that itinerary if the desired result lay on the other side. I think of the last clause as a reversibility test, and I like it because it separates 1 and 3 from 4, which no appeal to motivated reasoning by itself seems to manage.

  What I would like from you:

  1. "The principle, stated first" — about 120 words. Give me the account you think best in one or two sentences, before the commentary, so I can see the shape of it.

  2. "Clause by clause, with the case that motivates each" — about 400 words. Every clause of your principle should be traceable to something in my list that forces it, and you should say what breaks if the clause is dropped.

  3. "What my estimator account gets right, and where it must be repaired" — about 200 words. Test my formulation against the cases, especially 6 and 7, where it seems to me to run out of beliefs to be biased, and 5, where I cannot locate the moment of error at all.

  4. "Which of my verdicts you cannot keep" — about 250 words. Be blunt. If you must choose between a more complicated principle that saves all seven verdicts and a simpler one that overturns one or two, say so explicitly, say which you recommend, and say what I lose by taking your advice. I would rather have one verdict overturned than a principle with a clause bolted on for every case, but if you think I am wrong about that, argue.

  5. "Predictions for the cases I have not listed" — about 250 words. Please apply your principle to three things my cases do not settle: whether a research group or department can be self-deceived as a group, and what that would consist in; whether a researcher who fabricates data and then comes to believe his own fabricated result is a case of self-deception or something adjacent to it; and whether there can be self-deception with no behavioural signature at all, in a person whose error never surfaces in action or speech.

  One request about manner: I am not writing this up and I have a university library card, so please do not spend words on references, further reading, or citations of the literature. Give me the argument.
reasoning: |-
  Hmm, the user is a retired clinical epidemiologist who has spent their career observing how colleagues reason about evidence and now wants to apply that practical experience to philosophical questions about self-deception. They've presented seven detailed case studies from their career along with their own preliminary definition of self-deception, and they're looking for rigorous analysis that connects philosophical principles to their real-world observations.

  The cases present fascinating challenges to standard theories of self-deception. Case 1 shows selective application of evidential standards, Case 2 demonstrates knowing deception of others without self-deception, Case 3 reveals procedural manipulation during data analysis, Case 4 is simple incompetence rather than motivated reasoning, Case 5 involves unconscious filtering of data, Case 6 presents belief avoidance rather than false belief, and Case 7 concerns self-deception about desires rather than beliefs. Especially tricky are Cases 5 and 6 where the standard requirement of holding a false belief seems inadequate.

  The user's own definition is remarkably sophisticated - they frame self-deception as "directional error in belief-fixation" with an insightful "reversibility test" that captures the asymmetry in how people apply standards to their own favored conclusions versus others'. This definition already does excellent work separating motivated reasoning from mere incompetence.

  For the principle, I should focus on the core mechanism: strategic failure in evidence management that's asymmetric in how it would apply to desired vs. undesired conclusions. The reversibility test is crucial here - it's what makes the self-deception "directional" as the user put it.

  Applying this to the cases shows where the user's verdicts mostly hold but Case 6 may need reclassification. The man avoiding genetic testing isn't forming any belief at all - he's strategically avoiding belief formation altogether. This is belief evasion rather than self-deception proper. The other cases fit well: Case 1 and 3 show clear asymmetry in evidence evaluation, Case 5 shows unconscious filtering that passes the reversibility test, and Case 7 can be understood as self-deception about the nature of his desire rather than about facts.

  For predictions, group self-deception would require shared strategic blindness to evidence, fabrication that leads to genuine belief involves self-induced bias in evidence evaluation, and purely internal self-deception is theoretically possible but practically undetectable without behavioral markers.

  The user clearly values conceptual precision over saving every verdict. I should be direct about Case 6 while acknowledging why it feels like self-deception - the strategic avoidance shares important family resemblances even if it doesn't meet the strict definition.
answer: |-
  ### 1. The Principle, Stated First  
  Self-deception occurs when an agent strategically mismanages their own epistemic process—through selective attention, asymmetric standards, or motivated termination of inquiry—to arrive at a belief favored by desire, where this mismanagement would be rejected if the desired conclusion were reversed. It is a *directional failure of epistemic agency*, distinct from mere error or ignorance.

  ### 2. Clause by Clause, with the Case that Motivates Each  
  - **"Strategically mismanages their own epistemic process"**: Forces exclusion of passive incompetence (Case 4: the poor judge lacks *any* strategy). Drop this, and Case 4 becomes falsely classified.  
  - **"Selective attention, asymmetric standards, or motivated termination of inquiry"**: Captures distinct mechanisms: Case 1 (asymmetric standards), Case 3 (motivated termination/analysis-shopping), Case 5 (selective attention to data). Drop one mechanism, and a case loses its explanation (e.g., without "asymmetric standards," Case 1 collapses into ordinary bias).  
  - **"Arrive at a belief favored by desire"**: Excludes Case 2 (the dying woman knows the truth; her speech is performative kindness without belief-formation). Drop this, and Case 2 becomes self-deception.  
  - **"Mismanagement would be rejected if desired conclusion reversed"**: Your reversibility test. Motivated by Cases 1 and 3 (colleague/student apply stricter scrutiny to others’ work). Drop this, and Case 4 (global incompetence) could be misclassified as self-deception.  
  - **"Distinct from mere error or ignorance"**: Prevents overextension to Case 4 (chronic miscalibration) and Case 6 (avoidance without belief-formation).  

  ### 3. What Your Estimator Account Gets Right, and Where It Must Be Repaired  
  **Right**:  
  - "Directional error in belief-fixation" perfectly captures the *asymmetry* in Cases 1, 3, 5, and 7 (the bias serves a goal).  
  - "Bias enters through the agent’s own evidential itinerary" nails the active mismanagement (e.g., Case 3’s p-hacking, Case 5’s unrecorded exclusions).  
  - The reversibility test cleanly separates motivated reasoning (Cases 1,3) from incompetence (Case 4).  

  **Repairs Needed**:  
  - **Case 6 (genetic test avoidance)**: Your account requires a *biased belief*, but here there is *no belief formed*. Repair: Expand "belief-fixation" to include **strategic avoidance of belief-formation**. The man isn’t biased *in* belief; he’s biased *against forming* one.  
  - **Case 7 (desire, not belief)**: Your account centers belief, but the competitive acquaintance deceives himself about his *desires*. Repair: Include **self-deception about one’s own mental states** (e.g., desires, emotions). His sincerity about "not caring" is an estimate biased toward comfort.  
  - **Case 5 (the surgeon)**: Your account implies a "moment of error," but the exclusion rule likely calcified gradually. Repair: Accept that mismanagement can be **procedural and habituated**, not necessarily conscious.  

  ### 4. Which of Your Verdicts You Cannot Keep  
  **Surrender Verdict 6 (genetic test avoider) as self-deception**.  
  - **Why**: He lacks a *false belief* (he has no belief about his status) and isn’t mismanaging evidence to *form* a belief—he’s evading evidence to *avoid* belief. Calling this self-deception stretches the term beyond coherence (contra Case 2, where belief exists but is not spoken).  
  - **Cost**: You lose the intuitive "directional error" label for strategic ignorance. But this is not self-deception—it’s **epistemic escapism**.  
  - **Alternative**: Keep your other verdicts. Case 6 is a near-relative of self-deception (both involve desire-driven epistemic negligence) but differs structurally: no belief is output.  
  - **Recommendation**: Simplicity wins. A principle requiring *belief-formation* (even if biased) is tighter than one covering belief-avoidance. Your Cases 1,3,5,7 already show core self-deception; Case 6 is a boundary case best classified separately.  

  ### 5. Predictions for Cases Not Listed  
  - **Group Self-Deception**: Possible. It would consist in **shared, desire-driven epistemic norms** (e.g., a lab ignoring methodological flaws in "landmark" studies supporting their paradigm, while hyper-scrutinizing critics). Requires collective dismissal of reversibility: would they tolerate identical flaws if the result undermined their theory?  
  - **Fabricator Believing His Fabrication**: **Not self-deception**. The initial act is fraud (knowing falsehood). Later belief may arise from *repeated exposure* (mere-exposure effect) or motivated reasoning *after* fabrication, but the core deception is other-directed. Self-deception requires the epistemic mismanagement to *generate* the belief, not rationalize pre-existing lies.  
  - **Self-Deception with No Behavioral Signature**: **Impossible**. Self-deception requires *sustaining* a belief against counterevidence, which demands ongoing epistemic mismanagement (e.g., avoiding disconfirming data, reinterpretation). This mismanagement is behavioral (e.g., not reading certain journals, deflecting questions). Even private cognitive acts (doubting then suppressing doubt) are "behavior" in a broad sense. A purely mental, signature-less error would be indistinguishable from honest mistake.  

  ---

  ### Summary of Adjustments  
  - **Keep**: Verdicts 1,2,3,4,5,7.  
  - **Revise**: Case 6 → *not self-deception* (epistemic escapism).  
  - **Refine Principle**: Self-deception is the **desire-driven, strategic mismanagement of one’s epistemic process (through attention, standards, or inquiry-termination) to form or sustain a belief, where this process would be rejected if the desired belief were reversed**.  
  This preserves asymmetry, agency, and your core insight—while clarifying boundaries.
