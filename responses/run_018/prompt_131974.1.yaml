prompt: |-
  hey, i'm working on a feature about why smart people reject expected-value reasoning in weird edge cases — like funding an asteroid deflection with near-zero odds versus guaranteed hospital upgrades, or a micro-replication problem where the same rule hits ten thousand independent village clinics. I want to avoid the usual reheated take. Before I talk to anyone, lay out the actual desiderata a decision theory has to meet if it's going to avoid EV fanaticism without just being cowardly.

  What must it deliver? Give me the full spec: the cases it has to handle (Pascal mugs, St. Petersburg repetition, climate-policy aggregation, instutional rules vs one-off bets), the distinctions it can't collapse (moral vs prudential risk, having status vs how much weight), and the consistency conditions with human cognition — like not requiring agents to compute probabilities they can't actually access. For each, include the motivating case and flag whether it's negotiable or hard.

  Crucially, tell me if any pair of these is jointly unsatisfiable — that's the part I want most. Then briefly score straight EV maximization, a risk-weighted version with a cutoff, and those satisficing-plus-threshold rules from behavioral econ. Keep weight on the criteria, not the scoreboard — i need the thinking, not a winner.

  No citation lists please; i can't verify those offline and neither can half my audience. Write it like you're explaining the assignment to a researcher over bad coffee.
reasoning: |-
  Okay, let's tackle this user's query. They're working on a feature about why smart people reject expected-value reasoning in edge cases. The goal is to outline the desiderata for a decision theory that avoids EV fanaticism without being cowardly. 

  First, I need to consider the user's scenario. They mention examples like asteroid deflection with near-zero odds versus guaranteed hospital upgrades, and micro-replication problems in village clinics. These cases highlight situations where strict EV maximization leads to counterintuitive or unacceptable decisions. The user wants to avoid the usual takes, so I should focus on the underlying principles and trade-offs.

  The user's explicit request is for a full spec of desiderata, including cases to handle, distinctions to maintain, and consistency with human cognition. They also want to know if any desiderata conflict and a brief evaluation of existing approaches. But their deeper need might be to present a nuanced view that explains why people reject EV in these cases without dismissing rationality. They probably want to highlight the tensions in decision theory, making the feature thought-provoking.

  Now, breaking down the desiderata. The cases mentioned include Pascal's Mugging, St. Petersburg repetition, climate policy aggregation, and institutional rules vs. one-off bets. Each tests different aspects of decision theory. For instance, Pascal's Mugging challenges how to handle tiny probabilities of massive payoffs, while St. Petersburg repetition examines repeated exposure to low-probability high-stakes events. Climate policy involves aggregating small individual risks into significant collective ones, and institutional rules need consistent application versus context-dependent one-off decisions.

  Next, distinctions like moral vs. prudential risk, and having status versus weight. Moral risk involves ethical implications, while prudential is about personal gain. Status vs. weight refers to whether a threshold exists (status) or how much consideration it gets (weight). These distinctions are crucial because collapsing them might oversimplify decision-making in complex scenarios.

  Consistency conditions include not requiring inaccessible probabilities and respecting computational limits. Humans can't compute extremely small probabilities accurately, so a theory must accommodate that. Also, it should avoid demanding superhuman rationality, staying feasible for real agents.

  Now, checking for conflicts. For example, bounded computation conflicts with avoiding St. Petersburg fanaticism because evaluating infinite series or tiny probabilities is computationally impossible. Avoiding Pascal's Mugging might require a risk cutoff, but that could clash with long-tail sensitivity in climate policy, where many small risks aggregate. Institutional rules needing strict adherence might conflict with context-dependent exceptions in one-off bets.

  Evaluating the approaches: Straight EV fails most desiderata by ignoring thresholds and computational limits. Risk-weighted EV with a cutoff handles Pascal's Mugging but struggles with aggregation and repetition. Satisficing with thresholds avoids fanaticism but might miss high-value opportunities in St. Petersburg or underinvest in climate policy.

  The user's deeper need is to present these tensions clearly, showing why no single theory satisfies all desiderata. Highlighting the conflicts explains why smart people reject strict EV in edge cases. The feature should illustrate the trade-offs, making the reader understand the complexity rather than seeking a definitive solution.
answer: |-
  Alright, researcher, grab that lukewarm sludge and let's hammer this out. You need the full spec for a decision theory that dodges **EV Fanaticism** (betting the farm on infinitesimal chances of vast gain/loss) without collapsing into **Cowardice** (ignoring critical long-tail risks or refusing small costs for massive aggregate benefits). Forget "rationality" debates – focus on what it *must* do to handle real-world messiness. Here’s the assignment broken down:

  **I. Core Cases It Must Handle (Non-Negotiable Stress Tests):**

  1.  **Pascal's Mugging:** Agent claims *"Give me $5 or I'll use my secret powers to destroy Earth (p=1/googolplex, Loss= -infinity)."* Straight EV says pay. Must *avoid* paying the mugger.
  2.  **St. Petersburg Repetition:** Not the classic one-off, but *repeated exposure*. Imagine playing the St. Petersburg game (infinite EV) ten thousand times with independent village clinics. Each clinic faces a tiny risk of ruinous cost. Straight EV says run *all* clinics. Theory must *avoid* requiring participation if aggregate risk of catastrophic failure (even with tiny p per instance) becomes unacceptable. (Micro-replication problem).
  3.  **Climate-Policy Aggregation:** Billions face a small increased risk of severe harm from climate change (e.g., p=0.001 per person of losing 10% of lifetime welfare). Straight EV aggregates this into a massive expected disutility demanding huge investment. Theory must *justify* significant investment to mitigate these diffuse, small-p/high-stakes-per-person risks, *without* collapsing into requiring infinite sacrifice for the mugger.
  4.  **Institutional Rules vs. One-Off Bets:** A hospital board must set a rule: "Never fund treatments costing >$X per QALY, even if EV *seems* positive (e.g., ultra-rare diseases with shaky evidence)." Yet, a *specific*, well-understood one-off opportunity might justify breaching that rule. Theory must *distinguish* robust, scalable institutional heuristics (rules) from context-sensitive individual decisions, explaining when deviation is permissible. Must *avoid* being so rigid rules are useless or so flexible rules are meaningless.

  **II. Critical Distinctions It Must Preserve (Hard Constraints - Collapsing These Breeds Nonsense):**

  1.  **Moral Risk vs. Prudential Risk:** The cost of being *wrong* differs fundamentally.
      *   *Prudential:* Your own money/risk (St. Petersburg repetition). Risk tolerance can be personal/subjective.
      *   *Moral:* Risking *others'* welfare/resources (Pascal's Mugging with taxpayer funds, Climate Policy, Hospital Rule). Requires stronger justification, impartiality. Theory must *reflect the different burden of proof* when acting for others.
  2.  **Having Status vs. How Much Weight:** Does a threshold *exist* (status) vs. how *strongly* it influences decisions (weight)?
      *   *Status:* Some probabilities/utilities might be treated as *effectively zero* or *infinite* for decision-making (avoiding Pascal's Mugging). This is binary: "Below this p, ignore."
      *   *Weight:* Diminishing sensitivity to extreme values, but *not* absolute cutoff (e.g., probability weighting functions). Climate policy needs *some* weight to tiny p/high stakes, just not *linear* EV weight. Must *explicitly choose and justify* its approach to extremes.
  3.  **Aggregate vs. Individual Catastrophe:** Distinguishing between:
      *   A single massive catastrophe (Asteroid impact).
      *   Many diffuse, independent small catastrophes (Ten thousand clinics failing independently).
      *   Many diffuse harms *aggregating* into systemic catastrophe (Climate tipping points). Theory must *handle aggregation logic differently* based on dependence and systemic risk.

  **III. Consistency Conditions with Human Cognition (Hard Constraints - Ignore Human Limits & It's Useless):**

  1.  **Bounded Computation & Access:** Cannot *require* agents to compute or possess probabilities they demonstrably cannot access or estimate reliably (e.g., p=1/googolplex). Must function robustly under **Knightian Uncertainty** (unknown probabilities) and severe estimation error. Cannot demand superhuman calculation.
  2.  **Robustness to Small Perturbations:** Decisions shouldn't flip wildly based on imperceptible changes in probability estimates or utility assignments, especially near putative thresholds. Must avoid **instability**.
  3.  **Feasible Heuristics:** Must be implementable via rules or approximations that boundedly rational agents can actually use in reasonable timeframes (ties into Institutional Rules).

  **IV. The Tensions (Where the Rubber Meets the Road - Likely Conflicts):**

  Here's where your "avoid reheated take" gets spicy. Some desiderata *pull against each other*:

  1.  **Avoiding Pascal's Mugging (PM) vs. Justifying Climate Aggregation (CA):**
      *   *Conflict:* PM needs a way to *discount or ignore* tiny p/astronomical stakes. CA needs a way to *aggregate and act* on tiny p/high-stakes *across many instances/agents*. A blunt cutoff (Status) that ignores PM might also cripple CA. Weighting might struggle to be strong enough for PM without being too weak for CA.
      *   *Negotiable?* Maybe. Distinguishing *moral risk* (higher bar for PM) and *systemic vs. isolated risk* (CA is systemic) *might* resolve it. But it's tight.

  2.  **Bounded Computation vs. Avoiding St. Petersburg Fanaticism (SPF):**
      *   *Conflict:* Fully *computing* the aggregate risk in SPF (10,000 independent clinics with tiny ruin risk) might be intractable. Yet, bounded agents intuitively sense the aggregate risk. Theory must *justify caution* without demanding impossible calculations.
      *   *Negotiable?* Perhaps. Requiring *robust heuristics* that bound aggregate risk exposure automatically, without full computation.

  3.  **Institutional Rules (Stability) vs. One-Off Bets (Flexibility):**
      *   *Conflict:* Rules gain power from predictability and simplicity (bounded computation, stability). One-offs demand nuanced context-sensitivity. A theory too permissive on exceptions destroys rules. A theory too rigid prevents justified deviations.
      *   *Negotiable?* Partly. Requires a clear *meta-principle* for when deviation is allowed (e.g., only when uncertainty is *dramatically* reduced, stakes are unique, or rule itself is shown flawed). Hard to codify perfectly.

  **V. Quick & Dirty Scorecard on Existing Approaches (Against the Spec):**

  *   **Straight Expected Value Maximization:**
      *   *Fails:* Pascal's Mugging (pays up), St. Petersburg Repetition (mandates fanaticism), Institutional Rules (can't justify fixed thresholds). Ignores Moral/Prudential distinction. Requires impossible computations for some aggregates. *Epitome of Fanaticism.*
  *   **Risk-Weighted EV with Cutoff (e.g., Maxipok + min prob):**
      *   *Handles:* Pascal's Mugging (cutoff ignores mugger), potentially St. Pete Repetition (if cutoff applies to aggregate exposure).
      *   *Struggles:* Climate Aggregation (cutoff might prevent necessary action if p per capita is too small), Institutional Rules vs. One-Off (needs separate justification). Can feel *arbitrary* (where's the cutoff?).
      *   *Risk:* Can slide towards *Cowardice* if cutoff is too blunt. Moral/Prudential distinction needs bolting on.
  *   **Satisficing + Threshold Rules (Behavioral "Good Enough"):**
      *   *Handles:* Pascal's Mugging (ignores absurd demands), Institutional Rules (built on thresholds), Bounded Computation (simple rules).
      *   *Struggles:* St. Petersburg Repetition (may still run too many clinics if each seems "safe enough" alone), Climate Aggregation (may undervalue diffuse small risks if not hitting a salient threshold). Can miss *high-value* long-tail opportunities just below the "satisfice" line. Moral weighting unclear.
      *   *Risk:* Can be *Cowardly* by design ("good enough" avoids striving for better aggregates). Doesn't inherently solve aggregation logic.

  **The Takeaway for Your Assignment:**

  There's **no free lunch**. The core tension is **Aggregating Diffuse Tiny Risks vs. Ignoring Absurd Tiny Risks**. Any viable theory **must**:
  1.  Explicitly handle extremes (probability and utility).
  2.  Distinguish risk contexts (moral/prudential, individual/aggregate/systemic).
  3.  Respect cognitive limits and the need for stable rules.
  4.  Provide a *principled* (not ad-hoc) way to resolve the PM/CA and SPF tensions.

  The "smart people" rejecting EV aren't irrational cowards; they're intuitively grappling with these conflicting demands that pure EV ignores. Your theory needs to make those conflicts explicit and offer a coherent, *implementable* resolution. Good luck – this coffee won't fuel itself.
