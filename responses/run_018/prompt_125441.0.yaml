  Falsification conditions: For authority-transfer, if a promise is broken without reliance harm but still feels wrong, it supports the user. If not, it weakens. For reliance-harm, if breaking a promise with no reliance causes no issue, it supports the roommate. If it still feels binding, it challenges their view.

