answer: |-
  Here’s a draft adversarial collaboration document structured for clarity, neutrality, and testability—designed for two non-philosophers to sign. It isolates agreements, disagreements, and falsifiable predictions without academic baggage.

  ---

  ### **Joint Statement on the Moral Binding Force of Promises**  
  *Agreed by [Your Name] & [Roommate’s Name], [Date]*  

  #### **§1. Agreed Foundational Claims**  
  1. **What constitutes a promise**: A communicative act where:  
     - (a) Party A commits to future action X for Party B,  
     (b) Both parties mutually understand this commitment,  
     (c) It is explicit (e.g., "I promise") or contextually implicit (e.g., "I’ll have it done by Tuesday" in a work setting).  
  2. **Intent to be bound**: A promise requires Party A’s *intent to create a moral obligation*. Accidental statements (e.g., "I’ll call you!" as politeness) are not promises.  
  3. **Not always wrong to break**: Breaking a promise is *prima facie* wrong but can be overridden (e.g., if keeping it causes greater harm, violates ethics, or is impossible).  
  4. **Binding force exists**: Promises create moral reasons to act that go beyond mere preference or prediction.  

  #### **§2. Disagreements: Core Positions**  
  | Aspect                     | **Reliance-Harm View (Roommate)**                                                                 | **Authority-Transfer View (You)**                                                                 |
  |----------------------------|---------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------|
  | **Source of binding force** | Binding because breaking promises harms others who reasonably rely on them, wasting resources or undermining social coordination. | Binding because the promisor transfers a fragment of their future autonomy to the promisee, who gains normative authority over the action. |
  | **Core argument**          | The wrongness is in the *consequence*: frustrating expectations others invested in. Moral weight scales with harm caused by reliance. | The wrongness is in the *act*: violating the promisee’s authority over your will. Moral weight comes from the initial transfer, not outcomes. |

  #### **§3. Cruxes: Test Cases & Predictions**  
  **Crux 1: Source of the Binding Force**  
  - **Case**: *You promise to fix your roommate’s laptop this weekend. On Saturday, you realize buying a new laptop is faster/cheaper than repair. You offer to buy it instead. He never relied on the repair (had backup laptop) and prefers the new one.*  
    - **Reliance-Harm prediction**: Breaking the promise is **not wrong**. No reliance → no harm → no moral violation.  
    - **Authority-Transfer prediction**: Breaking is **still wrong** unless roommate *releases you*. You gave him authority to expect repair; swapping solutions without consent violates that.  

  **Crux 2: Sincerity vs. Reliance**  
  - **Case**: *You insincerely promise to water your neighbor’s plants, secretly planning to skip town. Neighbor discovers your lie before relying (e.g., before leaving). You never water the plants.*  
    - **Reliance-Harm prediction**: **No moral violation**. No reliance occurred → no harm. Insincerity is bad but distinct.  
    - **Authority-Transfer prediction**: **Violation occurred at the moment of promising**. You gave authority you never intended to honor, which is inherently wrongful.  

  **Crux 3: Scope of Authority**  
  - **Case**: *You promise to wear a purple shirt to a party. At the party, the promisee says, "Actually, wear orange." You hate orange.*  
    - **Reliance-Harm prediction**: Switching colors is **fine** unless it causes confusion/harm (e.g., ruins a theme). Authority is limited to the promised act (wearing purple).  
    - **Authority-Transfer prediction**: Promisee has **limited authority**—you must wear purple, but they can’t demand orange unless you consent. Transfer is act-specific.  

  #### **§4. Verbal Disagreements**  
  - The term "authority" is contested:  
    - *You* mean *normative authority* (right to direct action, not control via threats).  
    - *Roommate* hears *practical control* (which they reject as "weird").  
    → This is partially terminological; focus on predictions in §3.  

  #### **§5. What Would Change Our Minds**  
  - **Falsifying Authority-Transfer**: A case where:  
    - A promise is broken with *no reliance*,  
    - No harm occurs,  
    - Yet both agree it feels *clearly morally permissible* (e.g., §3 Case 1).  
    → If you concede it’s fine, your view collapses.  
  - **Falsifying Reliance-Harm**: A case where:  
    - A promise is broken *with reliance but no harm* (e.g., promisee relied but benefited unexpectedly),  
    - Yet both agree it’s *clearly wrong* (e.g., §3 Case 2).  
    → If roommate concedes it’s wrong, their view collapses.  

  ---

  ### **Signatures**  
  We agree this represents our core positions and commitments to resolving the debate through concrete cases.  
  [Your Name] ________________________  
  [Roommate’s Name] ________________________  

  --- 

  ### **Key Design Notes**  
  - **Edge Cases Target Core Mechanics**: Cases avoid legality/punishment, isolating moral intuition.  
  - **No Jargon**: "Normative authority" is unpacked as "right to direct action."  
  - **Falsification Focus**: §5 forces empirical predictions, turning philosophy into testable claims.  
  - **Room to Grow**: Agreed claims (§1) create common ground; disagreements are framed as hypotheses.  

  This forces both views to risk falsification. If you both sign, the next step is hunting for real-world examples that match §3 cases—or constructing new ones that probe weaknesses.
