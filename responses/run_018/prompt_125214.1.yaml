answer: |-
  Here’s a 4-minute speech crafted to bridge your audience gap while centering the Swiss-EU tension, using accessible language without sacrificing substance:

  ---

  **(Start warm, facing the mixed audience)**

  "Good morning, and welcome! For our local council members: thank you for joining us – I suspect you came expecting a deep dive into zoning grants or local service delivery. You're not entirely wrong. That instinct you have, that *feeling* decisions about *your* community should be made *as close as possible* to the people affected? That’s the beating heart of an idea we’re exploring today: **subsidiarity.**

  For our grad students fresh from wrestling with Johannes Althusius over in Emden centuries ago – you know he wasn’t just theorizing in a vacuum, right? He saw society as a living network, a 'symbiotic association' built upwards from the most local bonds – families, towns, guilds. Power, he argued, fundamentally belongs *down here*, and only rises upward when absolutely necessary for the common good. That core principle – **local first** – is what subsidiarity *should* feel like. It’s that council member instinct made into a governing philosophy.

  **But here’s the fascinating tension I want to open with today:** What happens when we take this powerful, local-first principle called 'subsidiarity' and stretch it across vast, complex borders? Does it mean the same thing everywhere? The answer, critically, is **no.** And the difference isn't just academic – it’s structural, it’s about *real power*.

  Let me show you with two giants:

  1.  **Switzerland:** Picture the cantons. These aren't just administrative units; they possess **constitutional personality.** That’s a powerful legal status. It means, in specific domains defined by the constitution itself, *a Swiss canton can literally say 'no'* to a federal law. Subsidiarity, Swiss-style, acts like a **brake.** It gives the local level a concrete, enforceable mechanism to *stop* the center from overreaching into their reserved space. The power truly flows upwards, conditionally.

  2.  **The European Union:** Now, shift to Brussels. The EU Treaty *also* enshrines subsidiarity. It says action should only happen at the Union level if objectives *cannot* be sufficiently achieved by member states. Sounds familiar? But the *mechanism* is fundamentally different. It’s primarily a **proportionality check** applied *before* legislation. The European Commission proposes, it assesses subsidiarity itself, and while national parliaments get a 'yellow card' system – a warning signal – the Commission can ultimately proceed. It’s a hurdle, maybe a speed bump, but crucially, **not a veto wielded by the constituent parts.** The center retains significant discretion to define necessity.

  **Both systems use the word 'subsidiarity'. But look at the mechanics:**
  *   **Switzerland:** Bottom-up brake. **Constitutional personality** empowers cantons to *reject* federal intrusion.
  *   **EU:** Top-down assessment. A principle guiding central *proportionality*, easily overridden.

  That’s our core tension: **Is subsidiarity a shield for local autonomy, or a filter for central action?** Is it a right of the parts, or a courtesy from the center?

  Council members, when *you* think about subsidiarity in your daily work – fighting for local control over zoning, budgets, services – you’re instinctively leaning towards the Swiss model. You expect, and rightly demand, a tangible ability to *defend* your community's space.

  Grad students, we know the EU model reflects the complex reality of pooling sovereignty among powerful nation-states, where a true local veto might be paralyzing. But does that dilute the principle?

  **This fundamental mismatch – shield vs. filter, brake vs. assessment – is why 'Subsidiarity Across Borders' is such fertile ground.** It forces us to ask: Can the powerful local instinct survive when scaled up? How much does the *structure* of power-sharing define the *meaning* of the word?

  I’m incredibly excited to hear our speakers unpack this tension today. They’ll show us how this core principle – rooted in our local communities and ancient Emden debates – bends, stretches, and sometimes breaks when applied across the complex landscapes of modern federal and supranational systems.

  Let’s get started. Thank you."

  ---

  **Why this works for your audience & goals:**

  1.  **Council Members:**
      *   **Immediate Hook:** Starts with *their* world (zoning, local services) and validates their instinct ("That feeling..."). No jargon bomb.
      *   **Instinct vs. Theory:** Links their practical experience ("local first") directly to the lofty principle ("subsidiarity *should* feel like").
      *   **Clear Swiss Analogy:** "Brake," "Say 'no'," "defend your community's space" – these resonate powerfully with their desire for local control. They *feel* the Swiss model.
      *   **Highlighted Tension:** Shows *why* the EU model feels different/inadequate from their perspective without lecturing. They understand the "shield vs. filter" distinction intuitively.
      *   **Avoids Althusius Lecture:** Name-dropped ("symbiotic association," "Emden") lightly to satisfy context for grads/prof, but framed as historical grounding for the *principle they already feel*, not an abstract theory.

  2.  **Grad Students:**
      *   **Substance Intact:** Clearly articulates the core legal/political distinction (constitutional personality vs. proportionality check, veto vs. assessment).
      *   **Centers the Tension:** The Swiss/EU comparison is the *engine* of the speech, not a footnote. "Shield vs. Filter," "Brake vs. Hurdle" crystallizes it.
      *   **Althusius Nod:** Acknowledges his relevance ("symbiotic association," "Emden") and roots subsidiarity historically, satisfying the seminar context without getting bogged down.
      *   **Complexity Acknowledged:** Briefly explains *why* the EU model exists ("pooling sovereignty," "paralyzing veto") without excusing its weakness.

  3.  **Your Core Idea:**
      *   **Structural Mismatch is the Star:** The entire middle section contrasts the two models explicitly on the mechanics. The concluding paragraph explicitly frames this as the "fundamental mismatch" and the "core tension."
      *   **"Constitutional Personality":** Used correctly and emphasized as the *source* of the Swiss canton's power.
      *   **Avoids "Federal Personality":** Scrupulously avoided.
      *   **Althusius "Symbiotic Association":** Used loosely as requested ("built upwards from the most local bonds"), fitting the flow.

  4.  **Practicalities:**
      *   **~4 Minutes:** Reads comfortably within the time limit when spoken naturally.
      *   **No Quotes/References:** Concepts explained in plain language.
      *   **Engaging Opening/Closing:** Starts relatable, ends by framing the workshop's purpose around the introduced tension.
      *   **No Dumbing Down, No Lecturing:** Uses accessible analogies and clear contrasts without sacrificing the core intellectual argument.

  This sets the stage perfectly, validates both audiences, and puts your sharp comparative insight front and center as the spark for the workshop. Good luck!
