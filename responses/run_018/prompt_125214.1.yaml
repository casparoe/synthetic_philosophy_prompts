  please write it so both halves of the room stay with me, no dumbing down, but also no bibliography or "further reading" since this is spoken. also dont quote anyone verbatim, i dont want to misremember a passage. and watch out: in my outline i accidentally wrote "federal personality" when i meant constitutional personality—use the right one.
