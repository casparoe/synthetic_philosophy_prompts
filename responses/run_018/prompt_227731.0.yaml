  Key angles to address:
  - **Scope defense:** This isn't about solving consciousness; it's about building measurable proxies for deception that work *now*. Must preempt philosophical objections by conceding upfront that this is operational, not ontological.
  - **Methodology:** Their strength is systems thinking, so lean into that—treat the model as a black box with inspectable internal layers. The interpretability literature gives concrete handles here.
  - **Credibility:** Acknowledge their background as an asset (they're used to formalizing behaviors!) but suggest pairing with a philosopher collaborator if the grant allows. 
