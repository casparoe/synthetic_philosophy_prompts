answer: |-
  Right then, here's a practical, step-by-step procedure for handling "strategy stealing" complaints during your puzzlehunt nights. It's designed to be quick, fair, and transparent, acknowledging where judgement calls are needed.

  **The "Strategy Stealing" Grievance Procedure (v1.0)**

  **Ground Rules for Organisers:**
  1.  **Timebox:** Aim for a 5-10 minute decision. Stick to the steps.
  2.  **Neutrality:** Approach this as referees, not philosophers or friends.
  3.  **Evidence Focus:** Ask for specifics: *What* was copied? *How* did they copy? *When* did it happen?
  4.  **Document:** Briefly note the complaint, teams involved, and the decision/reasoning.

  **The Checklist:**

  1.  **Was a specific, identifiable *strategy* or *tactic* copied?**
      *   **Ask:** "Exactly *what* action or method do you say was copied? (e.g., 'Used a mirror on clue X', 'Assigned team members Y way')"
      *   **Yes:** Proceed to Step 2.
      *   **No:** Stop. **No Penalty.** ("They just solved it faster" or vague "they copied our style" isn't enough).
      *   *Organiser Note:* Be specific. "Being clever" isn't a strategy. Focus on *actions* or *organisational methods*.

  2.  **Is this strategy/tactic explicitly forbidden or restricted by the *written rules*?**
      *   **Ask:** "Point us to the rule that *directly* bans or limits this specific action."
      *   **Yes:** Apply the rule penalty as stated. **Penalty.** Stop.
      *   **No:** Proceed to Step 3.
      *   *Organiser Note:* Rules are king. If it's not banned, copying it generally *is* allowed. Don't invent rules on the spot.

  3.  **Did the copying team gain access to information about your strategy through *their own solving efforts* OR *publicly observable actions*?**
      *   **Ask:** "How did the other team *find out* about your strategy? Did they see you *do* it in a shared space? Did they solve the same clue that *led* them to the same idea?"
      *   **Yes (Own solving/Observable):** Proceed to Step 4.
      *   **No (Special Access):** Proceed to Step 5.
      *   *Organiser Note:* This is crucial. Game theory's core: if they could see it or deduce it fairly, it's likely fair game. "Special Access" means info not available through normal solving/observation.

  4.  **Could the strategy reasonably be considered the *only obvious solution* OR something *so basic* that independent discovery was highly likely?**
      *   **Ask:** "Looking at the puzzle/clue/situation, is this strategy the blindingly obvious thing to try? Or something very simple and common (like splitting up puzzles)?"
      *   **Yes (Obvious/Basic):** **No Penalty.** Stop. (Independent discovery is presumed).
      *   **No (Non-Obvious/Clever):** Proceed to Step 6 (The Sportsmanship Check).
      *   *Organiser Note:* This filters out complaints about things *everyone* would likely do. "Using a mirror when light is involved" often falls here. So does basic team organisation.

  5.  **Did the copying team gain access to *private information* (e.g., notes, internal comms, overheard private discussion) *without authorisation*?**
      *   **Ask:** "Specifically *how* did they get this private info? Was it left unattended? Overheard a hushed chat? Did they peek at your screen/notes?"
      *   **Yes (Unauthorised Private Access):** **Penalty.** (e.g., Time penalty, puzzle reset, depending on severity. Aim for consistency). Stop.
      *   **No (Authorised/Public Info) or Unclear:** Proceed to Step 6 (The Sportsmanship Check), but lean heavily towards **No Penalty** if evidence is weak. Private info access needs clear evidence.
      *   *Organiser Note:* This is about *cheating* (accessing info they shouldn't), not *copying* per se. Requires stronger evidence.

  6.  **The Sportsmanship Check (The "Our Values" Step):**
      *   **Ask:** "Ignoring the rules for a second, does this *feel* like it violates the spirit of fair play and independent effort we want at our events? Was the copying blatant, lazy, and designed *only* to shortcut the work?"
      *   **Organiser Discussion (Brief!):** Quickly confer. Is this action undermining the fun and challenge for others? Is it particularly egregious copying even if technically allowed?
      *   **Decision:**
          *   **Majority feels it's Unsporting:** Issue a **Warning** or a **Minor Time Penalty** (e.g., 5-10 mins). Clearly state: "While not rule-breaking, this level of direct copying undermines the event spirit. Don't make it a habit." (Use sparingly!).
          *   **Unclear or Not Clearly Unsporting:** **No Penalty.** State: "We understand it's frustrating, but copying observable/public strategies isn't forbidden. Focus on your own solving!"
      *   *Organiser Note:* **This is subjective.** Be honest about that. This step exists *only* for edge cases that feel rotten but slip through the objective steps. Use it cautiously to uphold community values, *not* to punish cleverness or parallel thinking. Explain your reasoning simply.

  **Applying the Procedure to Your Cases:**

  1.  **Copying the Mirror Trick:**
      *   Step 1: **Yes** (Specific tactic: using a mirror).
      *   Step 2: **No** (Assuming no "no tools" rule).
      *   Step 3: **Yes** (Likely saw them doing it or solved the clue leading to the idea).
      *   Step 4: **Likely Yes** (Using a mirror where light/clues are involved is a common trope, often obvious). **--> NO PENALTY.** (If organisers genuinely feel it was *incredibly* unique and non-obvious, it *might* go to Step 6, but **No Penalty** is still highly probable).

  2.  **Copying the Whole Division-of-Labour System:**
      *   Step 1: **Yes** (Specific method: team structure/puzzle assignment).
      *   Step 2: **No** (Rules rarely dictate team organisation).
      *   Step 3: **Yes** (They observed the other team's structure working effectively - e.g., seeing who is where, hearing general shouts).
      *   Step 4: **Yes** (Splitting up puzzles is *basic* and *obvious*. The specific assignment might be clever, but the *structure* is fundamental). **--> NO PENALTY.**
      *   *(The "Hated" Answer):* This will feel unfair to the first team ("We organised brilliantly!"). But the procedure forces you to admit: it's a basic, observable strategy. Penalising copying here would be punishing observation and sensible play, not cheating. **This is where the 'strategy-stealing assumption' bites - if they could see it work, it wasn't a truly private advantage you could hold onto.**

  3.  **Copying a Trick Seen via Accidental Private Notes:**
      *   Step 1: **Yes** (Specific trick).
      *   Step 2: **No** (Assuming the trick itself isn't banned).
      *   Step 3: **No** (They saw *private notes*, not the action itself or deduced it).
      *   Step 5: **Yes** (Unauthorised access to private information - the notes). **--> PENALTY.** (e.g., Reset the puzzle for the copying team, apply a 15-min time penalty). The method of access was illegitimate, even if accidental on the viewer's part. Teams are responsible for securing their private info *and* not exploiting others'.

  **Where It Breaks Down / Limitations:**

  1.  **Evidence:** It relies on teams being honest and organisers assessing often conflicting claims quickly. "He said, she said" is hard.
  2.  **Step 3 (Access) Ambiguity:** Was seeing a team *briefly* use a mirror in a corridor "publicly observable"? Was overhearing half a sentence "special access"? Judgement is needed.
  3.  **Step 6 (Sportsmanship) Subjectivity:** This is inherently messy. What feels "unsporting" varies. Overuse risks inconsistency and organisers imposing personal biases. **Use it only for truly egregious, non-rule-breaking, lazy copying that's poisoning the atmosphere.**
  4.  **Parallel Discovery:** It can't *prove* independent discovery vs. copying. Step 4 tries to filter obvious cases, but clever non-obvious ideas *can* be independently discovered. Assume good faith unless evidence points strongly otherwise.
  5.  **The "Values" Gap:** The procedure forces you to confront that most copying is *allowed* by standard rules and game theory logic, even if your *community values* dislike it. Steps 1-5 often lead to "No Penalty" even when it feels rough. Step 6 is the pressure valve for community spirit, but use it carefully.
  6.  **Time Pressure:** Rushing complex judgements in 10 mins is hard. Stick to the steps rigidly to avoid tangents.

  **Final Advice:** Communicate this procedure *before* the next event. Explain the philosophy: "Observable strategies can be copied; using private info is cheating; we *might* penalise extreme unsportsmanlike copying even if legal." This sets expectations and reduces arguments on the night. Good luck!
