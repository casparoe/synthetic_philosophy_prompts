prompt: |-
  I help run these little puzzlehunt nights — about twenty teams, twice a year — and we keep getting rows about 'strategy stealing'. One team works out a clever move, like using a mirror to bounce light onto a hidden clue, and another team just copies it. A mate mentioned there's a 'strategy-stealing assumption' from game theory: if your rival can copy your move without any special access, then that move wasn't really giving you a private advantage anyway. I want a proper procedre my fellow organisers can run when someone complains, because right now we just argue.

  It should be a step-by-step checklist: the questions to ask in order, what counts as a yes or no at each step, where we stop and say 'no penalty', where we say 'penalty', and where we have to admit it's just our values talking — like whether copying feels unsporting even if the rules don't ban it. We only have about ten minutes after a complaint and none of us have studied philosophy. Apply it to three cases: copying the mirror trick; copying a whole division-of-labour system where one team split up the puzzles and another copied that structure; and copying a trick that only happened because the second team accidentally saw the first team's private notes. Include one where the procedre gives an answer we'll probably hate. And be honest about where it breaks down or can't settle things.

  Please write the answer in British English, and don't give me a reading list or citations — I just need something we can actually use on the night.
