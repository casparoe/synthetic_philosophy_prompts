  hi, i'm not in academia at all but i've been thinking about descartes and animals being like clockwork with no real pain. recently i saw something about these lab-grown brain tissues — organoids i think they're called — that have firing neurons but no body, no senses, nothing. it made me wonder whether descartes was wrong about animals for the right reasons, and whether his whole mind-vs-mechanism split actually blocks us from understanding these synthetic things.

  what i really want to know is: in this area, what are the actual open questions that matter? not just historical ones, but ones that change how we'd treat animals or these brain-tissue things. should people be working out whether consciousness needs a body? whether pain can exist without a nervous system attached? or whether descartes' framework is still misleading scientists?

