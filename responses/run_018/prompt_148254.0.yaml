  Ah! Here's the crucial distinction: Augustine psychologizes time to preserve it; Borges psychologizes time to reveal its illusion. Both center consciousness, but with opposite aims. The "Double Absence" overstates Borges' position - he doesn't claim active rewriting (that's more Nietzschean), but rather that all moments coexist eternally. 

