  Hmm, the core tension here is fascinating: Augustine saves time by anchoring it in consciousness (memory/present/expectation), while Borges seems to demolish even that psychological refuge. The user wants to know if their "Double Absence" theory is a legitimate extension of Augustine or a misinterpretation of Borges.

