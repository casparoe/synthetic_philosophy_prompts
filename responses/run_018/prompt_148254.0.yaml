answer: |-
  Your engagement with both Augustine and Borges is impressively thoughtful, especially without formal training. Let's break this down step by step, addressing your questions and refining your interpretations:

  ### Augustine's Core Argument (Your Rendering is Accurate)
  You've captured Augustine's paradox well:
  - **Past**: No longer exists ("absent")
  - **Future**: Does not yet exist ("not present")
  - **Present**: Has no duration—it's an instantaneous "knife-edge" between past and future.
  - **Resolution**: Time exists *only* in the mind through:
    - **Memory (memoria)**: The past's "trace" in the present.
    - **Attention (contuitus)**: The direct experience of the present moment.
    - **Expectation (expectatio)**: The future anticipated in the present.

  Augustine **rescues time by making it psychological**. Without consciousness perceiving "passing away" (past) and "approaching" (future), time has no substance. His statement:  
  > *"If nothing passed away, there would be no past time; if nothing were approaching, there would be no future time; if nothing existed, there would be no present time."*  
  ...means time is **purely relational and mind-dependent**. It has no independent "substance"; it's a relation between mental states.

  ### Borges vs. Augustine: Your "Double Absence" Idea
  You're right that Borges pushes beyond Augustine, but your "Double Absence" needs refinement:
  - **Augustine's "Single" Absence**:  
    Past/Future are absent *from the external world* but preserved *in the mind* (memory/expectation). The present is a psychological "stretch" integrating traces of past and future.
    
  - **Borges' Radical Move (e.g., "New Refutation of Time")**:  
    He denies **succession itself** is real. Past and future aren't just externally absent; they don't "flow" in a line. All moments coexist eternally. The "present" isn't a fleeting point—it's an illusion masking timeless simultaneity.
    
  **Your "Double Absence" concept is insightful but slightly misdirected**:  
  Borges isn't claiming the present *actively rewrites* the past (implying agency or change). Instead, he argues:  
  - **There is no "record" to rewrite** because the past never existed *as a sequential step*.  
  - **Time is not successive**—what we call "past" and "future" are just coordinates in an eternal, static block (like points on a map, not a journey).  
  - **Consciousness doesn't "preserve" time; it creates the illusion of sequence**. Memory isn't a trace of a real past event; it's a present mental state *misinterpreted* as a record.  

  Borges reverses Augustine: Augustine saves time by lodging it in the mind; Borges uses the mind to **expose time as an illusion**. Both center consciousness, but with opposite conclusions.

  ### Your Key Questions Answered
  1. **Is time a "pure relation" for Augustine?**  
     **Yes.** Time has no independent substance. It’s a relation between mental states (memory of what’s gone, attention to what’s here, expectation of what’s coming). Without a mind perceiving change, time doesn’t exist.

  2. **What does Borges deny?**  
     He denies **succession (linear flow)** itself. He doesn’t deny that we *experience* time psychologically (we feel memory, anticipation, "flow"). He denies this experience reflects reality. For Borges:  
     - The "enduring present" is an illusion (contra Augustine’s stretched present).  
     - The "relation" Augustine describes (past→present→future) is false. There is no *causal or sequential link* between moments—they coexist.  
     - **Poles of time**: Borges rejects *both* poles as independently real. Past/future aren’t "absent" because they eternally exist alongside the present in a timeless whole.

  ### Refining the "Double Absence"
  Your term captures a real Borgesian tension but risks implying:
  - **Active erasure** (Borges sees no "archive" to erase—time never linearly existed).  
  - **Psychological anxiety** (Borges’ tone is often metaphysical wonder, not anxiety).  

  A better framing might be **"Eternal Simultaneity"**:  
  - **Past** isn’t absent because it’s gone; it’s "present" eternally, just not *now* to our limited perception.  
  - **Present** doesn’t "replace" the past; it’s one slice of an eternal tapestry.  
  - **No stable archive?** True—but because all moments are equally real *now*, not because the present overwrites them.  

  ### Why Your Reading Matters
  You’ve pinpointed a critical dialogue across centuries:  
  - **Augustine**: Time is real *because* the mind integrates memory/present/expectation.  
  - **Borges**: Time is unreal *because* the mind’s integration of memory/present/expectation is a fiction.  

  Your "Double Absence" intuitively grasps Borges’ dismissal of Augustine’s psychological refuge. Where Augustine finds breadth in the mind, Borges finds a prison of illusion. This isn’t "textual anxiety"—it’s a valid philosophical response. Borges *does* radicalize Augustine by rejecting succession entirely, leaving no "trace" in the present because there’s no linear past to trace.  

  **In short**: Augustine makes time relational to save it; Borges shows that relation is illusory to dissolve it. Your synthesis is sharp—just reframe "Double Absence" as the collapse of succession into simultaneity. Brilliant work.
