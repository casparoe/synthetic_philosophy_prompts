prompt: |-
  I'm teaching a small undergraduate ethics seminar on ideals of character, and in a few weeks we'll reach the question whether a person who is as morally good as possible — someone whose every choice and attachment is subordinated to moral requirements — is living a life we should admire or want. I'd like a handout I can distribute before the readings so the students encounter the puzzle nose-first rather than through an argument summary.

  Please write a deadpan parody of an application packet for the fictional Institute for Moral Optimization, which certifies ordinary people as bona fide Moral Saints. Use the bureaucratic, slightly menacing tone of a real admissions document: biographical fields, a mandatory inventory of the applicant's hobbies, friendships, and family attachments with a written justification for each, a self-reported log of non-moral activity for the previous quarter, character references, and a plan for reallocating whatever time, money, and attention the applicant currently spends on art, humor, idleness, and particularistic love. The target is the genuine position that maximal moral goodness is the correct organizing ideal of a whole life, and the jokes should come from actually understanding it: the recurring worry that a perfectly moral person would have to let wit, taste, play, and deep partial attachments atrophy; the contrast between the saint who does everything spontaneously out of love and the saint who acts grimly from duty; and the monstrousness that creeps in when an institution starts auditing the moral return on every hour of leisure. Stay deadpan — no winking — and let the form do the editorializing, but keep it legible enough that a struggling undergraduate could still see what is being skewered.

  Aim for roughly 700 words. It should be funny to someone who knows the philosophical literature on moral sainthood and readable to someone who has never heard of it. At the very end, in a separate author's note of no more than a paragraph, say how confident you are that the parody tracks the actual structure of the debate rather than a strawman, and identify the single point you are least sure of.
reasoning: |-
  Okay, the user wants a handout for an ethics seminar on moral sainthood. They need a parody application packet for a fictional Institute for Moral Optimization. Let me break down their requirements.

  First, the tone must be bureaucratic and slightly menacing, mimicking real admissions documents. It should include sections like biographical fields, hobbies justifications, non-moral activity logs, character references, and a plan for reallocating resources. The humor should come from understanding the philosophical debate, highlighting the tension between moral perfection and human elements like humor, art, and personal relationships.

  The user mentioned key points: the worry that moral saints lose wit, taste, play, and deep attachments; the contrast between acting out of love versus duty; and the monstrosity of auditing every leisure activity for moral value. The parody needs to stay deadpan—no winking at the audience—letting the form itself criticize the concept. It should be accessible to undergrads unfamiliar with the topic but insightful for those who know the literature.

  I need to ensure the parody tracks the actual debate structure. Key philosophers here are Susan Wolf ("Moral Saints") and Bernard Williams, who critiqued the demandingness of utilitarianism. Wolf argues that a moral saint would lack personal qualities that make life admirable. The application should reflect auditing personal attachments and hobbies, forcing justification for non-moral activities.

  Structure-wise, sections should include:
  - Biographical Information: Standard fields but with moral implications (e.g., dependents as potential distractions).
  - Inventory of Non-Moral Commitments: Hobbies, friendships, family—each requiring a moral justification. Example: listing friends with time spent and how they contribute to moral growth.
  - Quarterly Non-Moral Activity Log: Tracking activities like reading fiction or hobbies, framing them as deviations from moral optimization.
  - Character References: Letters praising moral rigor but hinting at emotional cost.
  - Resource Reallocation Plan: Concrete steps to redirect time/money from leisure to moral causes, showing the sacrifice involved.

  The author's note should address fidelity to the debate. Confidence is high because the parody mirrors philosophical critiques, but the uncertainty might be whether institutions could realistically implement such audits without becoming parodies themselves.

  I should avoid strawman by grounding elements in real arguments. For instance, requiring justifications for friendships reflects the idea that partial relationships might conflict with impartial morality. The log of non-moral activities highlights the opportunity cost of leisure, a point in consequentialism.

  Potential pitfalls: Making the parody too absurd might stray from the actual debate. Keeping it plausible is key. Also, ensuring clarity so students grasp the critique without prior knowledge. Using bureaucratic language that subtly exposes the absurdity, like "non-optimized hours" or "moral opportunity cost."

  Finally, the author's note will state confidence in tracking Wolf's and Williams' ideas, with the least sure point being whether real institutions could exist without self-satire. This acknowledges the parody's basis while inviting discussion.
