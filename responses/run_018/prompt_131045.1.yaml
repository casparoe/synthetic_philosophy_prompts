  **PRESCRIPTION HEIGHTS TOWN COUNCIL MINUTES**  
  *Regular Session, October 26, 2023 - 7:00 PM, Council Chambers*

  **ITEM 7.23-B: APPLICATION FOR DEMOLITION PERMIT - STRUCTURE ID: FENCE-1987-A (HERITAGE DISTRICT BOUNDARY ADJACENT TO LOT 45, OAK MEADOW DEVELOPMENT)**

  **Chair Thorne:** Application received from Oak Meadow Development LLC, seeking demolition permit for Structure FENCE-1987-A, described as a "dilapidated chain-link fence" bordering proposed Lot 45. Planning Department recommends denial per Municipal Code Title 18, Section 5.07(a)(i): "No structure of established presence, particularly a barrier or demarcation, shall be altered or removed absent conclusive demonstration of its original, specific purpose being rendered null and void." Clerk, read the relevant Burke provision.

  **Clerk Abernathy:** Title 3, Property Rights, Section 2.01: "Prescription: Continuous, unchallenged existence of a structure or boundary for a period exceeding twenty-five (25) years confers presumptive title to its form, function, and location upon the established order. This presumption constitutes legal title against claims premised solely on abstract utility or perceived obsolescence."

  **Mr. Vance (Oak Meadow Dev):** Thank you, Chair. This fence is clearly obsolete. Maps show it was erected circa 1987, separating the old Grayson farm from town land. The farm is gone, subdivided into Heritage District decades ago. Oak Meadow is the *town land* side. The fence impedes efficient development of Lot 45 for needed senior housing. Its "purpose" was farm delineation. No farm exists. Therefore, purpose null, void. Demolition is warranted. Abstract utility *is* the utility here – housing for residents.

  **Ms. Evergreen (Heritage District Assn.):** We strenuously object. Structure FENCE-1987-A has defined the Heritage District's eastern edge for 36 years. Its continuous presence *is* its legal title per Prescription. "Obsolete" is a subjective term rooted in impatience, not organic understanding. We lack conclusive proof its purpose was *solely* agricultural. Perhaps it mitigated noise from future development? Or preserved sightlines? We simply don't *know* its full original intent. Demolishing it without that proof violates Chesterton's Principle codified in 18.5.07(a)(i). It risks unintended consequences for district cohesion. Organic growth respects existing boundaries.

  **Chair Thorne:** Mr. Vance, does Oak Meadow possess documentation, such as the 1987 building permit or minutes from the then-Council, explicitly stating *only* an agricultural purpose for FENCE-1987-A?

  **Mr. Vance:** Chair, records from '87 are sparse. The permit just says "boundary fence." Common sense dictates it was for the farm. Who erects a fence for no reason?

  **Ms. Evergreen:** "Common sense" is precisely the abstract reasoning Burke's Prescription guards against! Assumption is not proof. The fence *exists*. It *has* existed. That existence, unchallenged for 36 years, *is* its proof of necessity under the doctrine of Prescription. Its title is secure. Removing it severs a tangible link to our organic development.

  **Mr. Filmore (Councillor, Dist. 2):** Supporting Ms. Evergreen. The fence embodies Prescription. Its longevity *is* its justification. Oak Meadow's claim hinges on an abstract "right" to develop efficiently – a right alien to the slow accretion of understood order. Who were the original parties? The town and the Graysons. The fence mediated that relationship. Its continued presence honors that prescription, even if the Graysons are gone. Removing it disrespects the established title conferred by time.

  **Clerk Abernathy:** Clarification for the record: Councillor Filmore references Prescription as *legal title* under Title 3. Ms. Evergreen invokes Chesterton's Fence (18.5.07), which is an *epistemic principle* demanding understanding before alteration. They are distinct but complementary doctrines within our Code. Prescription establishes the legal right of the structure to exist; Chesterton's Fence dictates the evidentiary burden required to lawfully challenge that right.

  **Mr. Vance:** This is impossible! How can we prove a negative or divine unrecorded intent from 1987? This fences off progress based on... well, the fence itself! It’s circular. The "organic growth" you praise excludes new residents needing homes now because of a rusty fence's "title."

  **Chair Thorne:** The Council's duty is to uphold the Code. The burden of proof rests with the applicant to conclusively demonstrate the original, specific purpose of Structure FENCE-1987-A is null and void. Lack of affirmative evidence of alternative purposes does not constitute proof of nullification. The continuous, unchallenged existence establishes Prescriptive title. Motion to deny the demolition permit based on failure to meet the Chesterton evidentiary standard (18.5.07(a)(i)) and affirmation of the structure's Prescriptive property right (Title 3.2.01).

  **Motion Seconded. Vote: 4-1 (Vance dissenting). MOTION CARRIES. APPLICATION DENIED.**

  **Chair Thorne:** Structure FENCE-1987-A remains. Meeting adjourned. *(Gavel)*

