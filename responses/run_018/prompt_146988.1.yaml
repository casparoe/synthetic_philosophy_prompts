prompt: |-
  In our philosophy of religion reading group we've hit a wall discussing whether evolutionary-cognitive explanations—like hyperactive agency detection and the idea that belief in gods is a byproduct of theory-of-mind mechanisms—actually compete with theological justifications. The naturalists say showing belief has this kind of origin undermines its rational warrant; the theologians reply that's a genetic fallacy, but then they also insist that genuine revelation must feel cognitively 'unnatural' or counter-intuitive, which seems to concede the naturalists' framing. Is the stall because both sides are running together etiological and normative explanantion, or is it a deeper disagreement about whether 'naturalness' is even a coherent criterion for religious truth? I want a diagnosis of what kind of disagreeement this really is—factual, verbal, or axiological—and whether any conceptual distinction could actually move it, not just a recap of Plantinga versus Dawkins. Please answer in British English.
reasoning: |-
  Okay, the user is part of a philosophy of religion reading group that's stuck on whether evolutionary-cognitive explanations of religious belief compete with theological justifications. Let me unpack this.

  First, the naturalists argue that showing the evolutionary origins of belief undermines its rational warrant. The theologians counter with the genetic fallacy—saying origins don't affect truth—but then claim revelation feels "unnatural," which seems to concede the naturalists' point. Hmm, that's a tension. The user wants to know if the stall is due to conflating etiological and normative explanations or if it's a deeper issue about "naturalness" as a criterion for truth. They also want the disagreement diagnosed as factual, verbal, or axiological, and if a conceptual distinction could help.

  Right, so the core issue is whether explaining where beliefs come from affects their truth value. The genetic fallacy point is valid: where something comes from doesn't logically determine its truth. But the theologians' appeal to the "unnatural" feeling of revelation complicates things. By using "unnatural," they might inadvertently accept the naturalists' frame that what's natural is untrustworthy. That's a problem because it sets up natural vs. unnatural as the axis of debate, which naturalists dominate since they're all about natural explanations.

  The user mentions both sides conflating etiology and normativity. Etiology is about origins, normativity about justification. The theologians might be mixing these when they say revelation feels unnatural—implying that its unnaturalness is part of its justification. But that's risky because it buys into the naturalists' framework. If they instead clearly separate origins from truth, they could avoid that trap. But their insistence on unnaturalness undermines that separation.

  Is the disagreement factual? Not really, because both sides might agree on the cognitive mechanisms but disagree on their implications. Verbal? Partly, especially around terms like "natural." But deeper down, it's axiological—they value different epistemic frameworks. Naturalists prioritize scientific explanations as the only valid ones, while theologians allow for supernatural justifications beyond natural cognition. Conceptual distinctions could help, like clarifying etiology vs. normativity, or defining "natural" more carefully. But the axiological divide might persist, as it's about fundamental commitments to what counts as evidence and warrant.
answer: |-
  Right, this is a classic and fiendishly complex impasse, precisely because it involves several intertwined layers of disagreement. Let's diagnose it properly, moving beyond the well-trodden Plantinga/Dawkins ground.

  1.  **The Surface Level: Is it a Genetic Fallacy?**
      *   **Theologians' Point (Valid):** Strictly speaking, pointing to the *origin* of a belief (etiological explanation) doesn't, *by itself*, tell us anything about its *truth-value* or *current rational justification* (normative explanation). Accusing naturalists of committing the genetic fallacy here has logical merit. Discovering *how* a cognitive mechanism *might* produce god-beliefs doesn't *disprove* the existence of God any more than discovering *how* vision works disproves the existence of the objects we see.
      *   **Naturalists' Counter (Also Valid):** However, naturalists aren't *only* pointing to origins. They are arguing that the evolutionary-cognitive account provides a *sufficient natural explanation* for the *ubiquity and specific features* of god-beliefs. Crucially, they argue this explanation *competes directly* with the theological explanation (revelation/divine reality) *as the best account of why people hold these beliefs*. It suggests the beliefs arise from cognitive mechanisms prone to false positives (HiAD) or are useful fictions (byproducts), *without needing to posit the actual existence of the objects of belief*.

  2.  **The Theologians' Conundrum: "Unnatural" Revelation:**
      *   This is where the theologians create a significant tension. By insisting genuine revelation must feel "unnatural" or "counter-intuitive," they are implicitly conceding a crucial point to the naturalists: **that the *natural*, evolved cognitive mechanisms *are unreliable guides to transcendent truth*.** This is problematic because:
          *   **It Validates the Naturalist Frame:** It accepts the naturalists' foundational premise: that our standard cognitive toolkit, shaped by evolution for survival and social navigation, is the baseline ("natural") against which religious claims are judged. If revelation feels "unnatural," it's judged *against* that evolved cognitive standard.
          *   **It Creates an Epistemic Dilemma:** *How* does one reliably distinguish "unnatural" divine revelation from other "unnatural" cognitive states like delusion, psychosis, or simply novel but mistaken intuitions? If our evolved cognition is unreliable for the transcendent, what *is* the reliable faculty for apprehending it? This risks making religious knowledge either arbitrary or completely detached from rational assessment.
          *   **It Undermines the "Proper Function" Argument:** Some theologians (like Plantinga) argue belief in God is produced by cognitive faculties functioning "properly." But if genuine revelation must *feel* improper (unnatural/counter-intuitive) relative to those evolved faculties, it creates a contradiction.

  3.  **Diagnosing the Core Disagreements:**
      The stall isn't *just* one type of disagreement; it's a layered stack:

      *   **Factual/Explanatory Disagreement (Partial):** Both sides might agree *that* HiAD and ToM mechanisms exist and *contribute* to religious concepts. But they *disagree fundamentally* on whether these mechanisms provide a **sufficient explanation** for the phenomenon of religious belief, especially its specific content and persistence. Theologians see them as insufficient or as potential *vehicles* for genuine contact; naturalists see them as the *primary cause*, making the theological explanation redundant.
      *   **Verbal/Conceptual Disagreement (Crucial):** The central ambiguity revolves around the term **"natural."** This term is doing heavy and conflicting work:
          *   **Naturalists:** "Natural" means explicable by the ordinary, empirically investigable laws and mechanisms of physics, biology, and psychology. "Supernatural" lies outside this. The evolutionary-cognitive account is "natural" in this sense.
          *   **Theologians (using "unnatural"):** Here, "natural" often seems to mean **"arising predictably from our standard, evolved cognitive biases and heuristics."** "Unnatural" revelation means it *doesn't* feel like it comes from *those specific evolved mechanisms* (HiAD/ToM byproducts), perhaps implying a *super*natural source bypassing them. **This is a different sense of "natural" than the naturalists use!** The confusion arises because theologians are using "natural" in this context to mean *cognitively intuitive based on evolution*, not *ontologically non-supernatural* (though the two are linked in their minds). This ambiguity fuels the impasse.
      *   **Axiological/Epistemological Disagreement (Fundamental):** This is the bedrock. The disagreement stems from **deeply divergent prior commitments about what constitutes valid knowledge and warrant:**
          *   **Naturalists** are typically committed to **methodological naturalism**: the only reliable way to gain knowledge about the world is through scientific (broadly construed, including cognitive science) methods investigating natural causes. Supernatural explanations are inherently beyond this method and thus lack warrant. The evolutionary account *is* normative for them because it fits their epistemological framework.
          *   **Theologians** operate within a framework that accepts the **possibility and actuality of revelation** – knowledge conveyed directly by a transcendent source. Their normative justification often relies on **internal criteria** (faith, religious experience, scripture, tradition, philosophical argument) that are not reducible to, or necessarily dependent on alignment with, evolved cognitive mechanisms. For them, the *etiological* explanation might be interesting but is largely *irrelevant* to the *normative* justification derived from these other sources. The feeling of "unnaturalness" is an attempt (perhaps clumsy) to signal this transcendent source *within* their experiential framework.

  4.  **Can Conceptual Distinctions Move the Needle?**
      Yes, clarifying concepts *can* help structure the debate more productively, even if it doesn't resolve the fundamental axiological split:

      *   **Strictly Separate Etiology and Normative Justification:** Force both sides to articulate their normative justifications *independently* of the etiological account. Theologians need to ground warrant in revelation, scripture, reason, etc., *without* leaning on "unnaturalness" as a criterion tied to evolved cognition. Naturalists need to argue *why* a sufficient natural etiology *undermines* the specific normative justifications offered by theology (e.g., does it render arguments from religious experience invalid?).
      *   **Disambiguate "Natural":** Explicitly distinguish:
          1.  **Ontological Naturalism:** The view that only natural entities/forces exist (naturalists hold this).
          2.  **Methodological Naturalism:** The practice of seeking natural explanations (naturalists use this; some theologians might accept it as a *method* for science but not for theology).
          3.  **Cognitive "Naturalness":** The intuitive ease or predictability of a belief arising from our evolved cognitive architecture (the sense theologians use when calling revelation "unnatural"). This needs careful definition relative to specific mechanisms (HiAD/ToM).
      *   **Reframe "Unnatural":** Theologians might better argue that revelation **transcends** or **corrects** natural cognition, rather than feeling "unnatural" *by its standards*. The emphasis should be on the purported *source* (divine) and its *content* (potentially correcting natural intuitions), not primarily on its *feel* relative to cognitive biases.
      *   **Focus on the Status of Religious Experience:** Much hinges here. Does the evolutionary-cognitive account successfully explain *away* religious experience as *nothing but* misfiring cognition? Or does it merely describe a mechanism that *could* be a conduit for genuine experience? This requires examining the specific *content* and *effects* of experiences and whether natural explanations fully account for them.

  **Conclusion:** The stall arises primarily from **conceptual ambiguity (especially around "natural") layered onto a fundamental axiological/epistemological rift.** Both sides are, to some extent, talking past each other due to the shifting meaning of "natural." Theologians' appeal to "unnatural" revelation inadvertently buys into the naturalists' framing of evolved cognition as the epistemic baseline, creating a tension with their rejection of the genetic fallacy. While sharpening the distinction between etiology and normative justification is essential, the core disagreement is axiological: **it's about the very criteria for what counts as rational warrant for believing in the transcendent.** Naturalists demand warrant within a naturalistic epistemological framework; theologians derive warrant from frameworks incorporating revelation and transcendence. Conceptual clarity can make the disagreement more precise and productive, but it's unlikely to resolve this foundational divide about the nature of knowledge itself. The discussion might fruitfully shift towards meta-epistemology: *Can* there be warranted belief in the supernatural, and if so, *what kind* of justification suffices? That's the deeper wall you've hit.
