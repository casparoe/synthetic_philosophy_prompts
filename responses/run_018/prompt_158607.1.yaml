  - Evaluative-judgment (e.g., cognitive theories) would paradoxically argue the pain isn't bad for the person since they don't judge it as such.  

  The key philosophical lever is the *externalization of badness* while preserving affective depth. If we remove that — say, if the person just lacks emotional response — it collapses into standard asymbolia cases.  

  The weakest verdict seems to be the affective-reaction account (claiming no real pain). To defend it, one might attack the scenario’s coherence: "Can you truly feel pain’s aversiveness if you disown it? The emotional 'punch' might just be descriptive, not motivational." But that risks circularity.  

