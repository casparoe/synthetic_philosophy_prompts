  ## The Long Liability

  Rain lashed the smoked-glass facade of the Chrysalis Centre, turning the affluent streets of Marylebone into a smeary watercolour. Inside, the air hummed with expensive sterility and hushed voices. Priya Patel smoothed the crisp linen of her blouse, the familiar scent of antiseptic and jasmine air-freshener clinging to her. Her desk, positioned like a discreet shield near the plush consultation rooms, was the nerve centre of 'gestational consulting' – a phrase that tasted like ash in her mouth some days.

  Chrysalis operated in the elegant shadows of London’s medical landscape. Wealthy couples, predominantly from the EU where commercial surrogacy carried criminal penalties, flew in under discreet pretexts. The Centre didn’t *technically* arrange surrogates; it 'facilitated introductions' and provided 'comprehensive gestational support packages'. Priya, the intake coordinator, processed the mountains of paperwork that made this legal sleight-of-hand possible. She knew the forms intimately: consent waivers thicker than novels, non-disclosure agreements tighter than vaults, and financial agreements that read like corporate mergers. She’d signed similar ones herself, years ago, back in Bristol when she was a skint student and the £8,000 for an egg donation cycle felt like a lottery win. A one-off. A transaction settled.

  Today’s new clients were a French couple, the Dubois. Monsieur Dubois radiated impatient affluence, Madame Dubois’s eyes held a fragile hope that made Priya’s stomach clench. As Priya handed over the preliminary forms – sleek tablets displaying digital contracts – her own past nudged her. She’d donated three times at that clinic near Clifton Suspension Bridge. Had any of *her* eggs resulted in a child? She’d never know. Anonymity was absolute, absolute enough to feel like erasure. Or so she’d thought.

  Later, processing the signed Dubois contracts into the secure system, a routine quality check flagged an inconsistency. A sub-clause reference Priya didn’t recognise. Frowning, she navigated the labyrinthine contract master file. Buried deep within Schedule 7B, under ‘Long-Term Genetic and Epigenetic Considerations’, she found it:

  > **Clause 17.4 (Epigenetic Liability):** The Donor acknowledges and agrees that genetic material (oocytes) provided may carry epigenetic markers influenced by the Donor's environment, lifestyle, and subsequent health status. The Donor further agrees to indemnify the Recipients, the Chrysalis Centre, and affiliated entities against any claims, damages, or costs arising should a child conceived using said genetic material develop a condition demonstrably linked, via peer-reviewed epigenetic research, to environmental or lifestyle factors prevalent in the Donor's life *post-donation*.

  Priya read it again. Then a third time. The sterile air suddenly felt thick, difficult to breathe. Post-donation? *Her* lifestyle? *Now?*

  A cold dread seeped into her bones. It wasn’t just the eggs they’d bought years ago. It was *her*, indefinitely. Her body wasn't just a past resource; it was an ongoing liability. If a child conceived with her egg developed, say, a metabolic disorder linked to diet, and *her* current diet was deemed poor? If stress-related conditions were traced back to epigenetic markers potentially influenced by *her* current stress levels? The clause was deliberately vague, couched in scientific jargon, but the implication was monstrous: her life, her choices years *after* selling her eggs, could be weaponised against her.

  She remembered the Bristol clinic’s brisk counsellor: "It’s a simple, generous act. You help create life, you move on." No mention of lifelong tethers. No hint that the £8,000 wasn't just payment for eggs, but a down payment on perpetual vulnerability.

  A wave of nausea washed over her. She thought of her student diet – cheap pasta, instant noodles. Her current London life – long hours, erratic meals, the constant low-grade stress of bills and this very job. What invisible marks was she imprinting on genes she no longer owned? The anonymity felt like a cruel joke now. The recipients didn’t know her, but this clause meant *she* was known, tracked in some abstract, legal sense. Her body was a financial asset with a long, unpredictable tail of risk, and she hadn’t even known she’d signed away the management rights.

  Dr. Finch, Chrysalis’s immaculately suited founder, swept past her desk. "Priya, the Dubois’s preliminary genetic compatibility report is ready. Ensure it’s uploaded before their next consult, there’s a good girl." His tone was smooth, dismissive.

  "Dr. Finch," Priya’s voice sounded thin, alien. "This clause... 17.4? Epigenetic Liability? I’ve not seen it highlighted before. Is it... standard?"

  Finch paused, his expression cooling slightly. "Standard? It’s essential risk management, Priya. Cutting-edge science informs our protocols. Epigenetics is a burgeoning field. We simply ensure all parties are protected against unforeseen future developments stemming from... donor provenance factors." He adjusted his cufflink. "Think of it as ensuring continuity of care, in the broadest legal sense. Nothing for you to concern yourself with operationally." His smile didn’t reach his eyes. "Just ensure the contracts are processed."

  He moved on, leaving Priya frozen. *Donor provenance factors.* As if she were a vintage wine whose terroir might suddenly turn toxic. Protected? The recipients and the clinic were protected. *She* was exposed. The £8,000 felt like blood money paid for a lifetime lease on her biology.

  Later, fetching files from the secure archive – a windowless room lined with cabinets containing the biological futures of countless women – Priya leaned against the cool metal. The hum of the servers was the only sound. Her hand drifted unconsciously to her abdomen, the site of those long-ago harvests. She’d viewed it as a finite transaction, a temporary loan. Now, she saw invisible threads stretching from her present life back to those extracted cells, threads that could be yanked taut at any moment by a lawsuit from faceless recipients half a world away, citing her diet, her stress, her polluted London air.

  Her body wasn't just hers. Parts of it, intangible parts shaped by her ongoing existence, belonged to contracts signed in ignorance years ago. The Chrysalis Centre traded in hope, wrapped in legalese and sterile luxury. Priya finally understood the true cost: not just the eggs, but the perpetual, invisible mortgage on the woman who once provided them. The liability wasn't just epigenetic; it was existential. And in the quiet archive, surrounded by the evidence of countless similar bargains, the weight of that unasked-for ownership settled on her shoulders, heavier than any file. The rain outside seemed to seep through the walls, cold and inescapable.
