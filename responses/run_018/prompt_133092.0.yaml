  I'd like the setting to be a near-future London clinic operating in a legal grey zone, offering what they call 'gestational consulting' to wealthy clients who fly in from countries where surrogacy is banned outright. The protagonist should be a former egg donor named Priya who now works as an intake coordinator and stumbles across a hidden clause in the clinic's contracts: something about 'epigenetic liability', meaning that if a child she donated for years ago develops a condition linked to her own lifestyle environment, she can be sued retroactively. I'd like the story to explore how she starts viewing her body not as a one-time source of material but as a long-term financial asset that she never fully owned. Keep it grounded — no sci-fi gadgets, just social realism — and please write it in British English since my tutor marks down for Americanisms. There's probably a typo in this brief but I think you recieve the gist.
