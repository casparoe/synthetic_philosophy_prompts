  ### **Decision Tree: Metaphysical Views on Laws of Nature**  
  *Start at Node 1. Answer based on intuition before learning technical terms.*

  #### **Node 1: Supervenience Test**  
  *Imagine two worlds with identical histories—same particles, same motions, same collisions at all times. Could these worlds still differ in their laws?*  
  - **Yes** (laws don’t supervene on events) → Node 2  
  - **No** (laws are fixed by events) → Node 6  

  #### **Node 2: Steering in a Vacuum**  
  *In a world with just one particle moving at constant velocity forever in empty space, is there a law actively governing this motion (e.g., "forces cause changes"), or is it just a pattern?*  
  - **Steering** (law has a "hand" in the motion) → Node 3  
  - **Bookkeeping** (law is a scorecard for what happens) → **EMPTY LEAF** (see notes below)  

  #### **Node 3: Billion Particles Without Enforcement**  
  *A billion particles all move in straight lines for eons, then stop abruptly at the same moment—with no force, field, or "enforcer" making this happen. Is this pattern lawlike?*  
  - **Yes** (it counts as a law, even without enforcement) → Node 4  
  - **No** (laws require enforcement; this is coincidence) → Node 5  

  #### **Node 4: Properties with Built-In Force**  
  *When an electron attracts a proton, is this due to irreducible powers (e.g., "charge disposes attraction"), or can it be fully described without modal terms?*  
  - **Powers needed** (properties have built-in dispositions) → **Leaf A: Bird/Ellis Dispositional Essentialism**  
  - **No powers** (properties are purely categorical) → **Leaf B: Maudlin Primitivism**  

  #### **Node 5: Stray Event Impact**  
  *A particle on the galaxy’s far side suddenly accelerates without cause. Does this lone event change the laws everywhere?*  
  - **Yes** (laws depend on global patterns) → Node 6  
  - **No** (laws are local/stable; the event is an anomaly) → **Leaf C: Armstrong/Dretske/Tooley (ADT)**  

  #### **Node 6: Best-System Objectivity**  
  *The "best system" of laws balances simplicity (few axioms), strength (covers many cases), and fit (matches events). Is "best" objective or mind-dependent?*  
  - **Objective** (fixed by the world) → Node 7  
  - **Subjective** (depends on thinkers like us) → Node 8  

  #### **Node 7: One-Particle Laws**  
  *In a world with one particle moving at constant velocity, is there a law? If so, is it the same "kind" as laws in complex worlds?*  
  - **Yes, same kind** (laws exist universally) → Node 9  
  - **No / Different kind** (laws require complexity) → **Leaf D: Deflationary/Projectivist**  

  #### **Node 8: Tradeoff in Best-System**  
  *Could a system be "best" for superintelligent aliens but "worst" for humans (e.g., too complex for us)?*  
  - **Yes** (bestness is mind-relative) → **Leaf D: Deflationary/Projectivist**  
  - **No** (bestness is absolute) → **Leaf E: Mill–Ramsey–Lewis (MRL) Humeanism**  

  #### **Node 9: Grounding Explanation**  
  *Does a law (e.g., "F=ma") explain why objects accelerate when forced, or is it just a summary of observations?*  
  - **Explains/grounds** (law is part of why events happen) → **Leaf B: Maudlin Primitivism**  
  - **Summarizes** (law is a report of patterns) → **Leaf E: Mill–Ramsey–Lewis (MRL) Humeanism**  

