  ### **Indistinguishable Leaves & Tree Limitations**  
  - **Leaf B (Maudlin) and Leaf C (ADT) blur at Node 5:** If you answer "No" to the stray event (laws are stable), you land on ADT. But Maudlin could also accept this if laws are robust. The tree *artificially separates them* via Node 5—in practice, both views treat laws as non-supervenient steerers.  
  - **Leaf E (MRL) and Leaf D (Deflationary) blur at Node 8:** If best-system standards are objective but anthropocentric (e.g., "fit for humans"), they converge. The tree splits them at Node 8 for clarity, but hybrid views exist.  

