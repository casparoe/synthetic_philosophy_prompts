  ### **Leaves (Named Positions)**  
  - **Leaf A: Bird/Ellis Dispositional Essentialism**  
    Laws reduce to essential dispositions of properties (e.g., charge *must* attract opposites).  
  - **Leaf B: Maudlin Primitivism**  
    Laws are irreducible, fundamental entities that govern events.  
  - **Leaf C: Armstrong/Dretske/Tooley (ADT)**  
    Laws are contingent relations among universals (e.g., N(F,G)) that necessitate regularities.  
  - **Leaf D: Deflationary/Projectivist**  
    Laws are useful fictions or projections of human cognition; no objective fact about "true" laws.  
  - **Leaf E: Mill–Ramsey–Lewis (MRL) Humeanism**  
    Laws are axioms of the simplest, strongest system summarizing the mosaic of events.  
  - **EMPTY LEAF: Non-supervenient bookkeeping**  
    *Empty because:* If laws don’t supervene (Node 1: Yes) but merely "bookkeep" (Node 2: Bookkeeping), laws become epiphenomenal labels with no metaphysical role—a position rarely defended. It’s coherent (imagine a "law cataloger" deity) but unmotivated.  

