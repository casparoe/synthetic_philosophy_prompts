answer: |-
  Here is a reusable decision procedure tailored to your board’s constraints, designed to audit proposals through the lens of the compatriotism vs. cosmopolitan debate while flagging irreducible value judgments. It integrates your requested filters and addresses the three cases explicitly.

  ---

  ### **Settled Principles (Broad Consensus)**
  1. **Severity of Need**: Severe deprivation of basic needs (survival, health, bodily integrity) has universal moral weight. A life-threatening need abroad cannot be dismissed as less urgent than a local one *solely* due to distance or nationality.
  2. **Non-Discrimination**: Arbitrary discrimination (e.g., race, gender) is impermissible. Birthplace alone (*moral lottery*) is widely seen as arbitrary without additional justification.
  3. **Accountability**: Funds must be used effectively; verifiable impact matters.

  ### **Contested Terrain (No Consensus)**
  - **Does nationality *alone* create special obligations?** Cosmopolitans say no; compatriots say yes (but disagree on *why*).  
  - **What counts as "basic needs"?** Food/water/medicine are clear; cultural preservation is debated.  
  - **How strong are associative duties?** Is local democratic participation sufficient to create stronger obligations?  

  ---

  ### **Decision Procedure: Ordered Audit with Stop Rules**
  **Time Allocation:** 15 mins for steps 1–4; 5 mins for step 5 (judgment flagging).  
  **Stop Rule:** If any step requires unresolved philosophical judgment → **Flag for Advisor**.

  #### **Step 1: Basic Needs Severity Audit**  
    - **Question:** Does the proposal address a threat to survival, health, or bodily integrity?  
    - **Stop Rule:** If YES → Proceed to Step 2.  
    If NO → Proceed to Step 3 (for non-basic needs).  
    *Rationale:* Universal needs (e.g., preventing death) override locality debates.  

  #### **Step 2: Moral-Lottery Filter**  
    - **Question:** Would prioritizing beneficiaries *depend solely* on birthplace/nationality, with no further institutional reciprocity?  
    - **Stop Rule:** If YES → **Flag for Advisor** (contested value judgment).  
    If NO → Proceed to Impact Assessment.  

  #### **Step 3: Institutional Co-Authorship Audit**  
    - **Question:** Do beneficiaries participate in systems generating the obligation?  
      - *Check 1:* Do they pay taxes funding the grant pool?  
      - *Check 2:* Are they subject to laws/governance the board operates under?  
      - *Check 3:* Can they hold the board accountable (e.g., via elections, feedback)?  
    - **Stop Rule:** If ALL checks fail → No special local obligation claim.  
    If ANY check passes → Local priority *may* be justified (proceed to Step 4).  

  #### **Step 4: Comparative Impact Assessment**  
    - **Question:** What is the cost-per-beneficiary impact? (e.g., lives saved per $1,000).  
    - **Stop Rule:** If local impact is <50% of distant impact → **Flag for Advisor** (requires judgment on obligation vs. efficiency).  

  #### **Step 5: Judgment Flagging**  
    - Explicitly mark where the procedure ends and value choices begin:  
      - "ADVISOR JUDGMENT REQUIRED: [Specific contested issue]."  

  ---

  ### **Application to Proposals**
  #### **Proposal 1: Winter heating for local families**  
  - **Step 1:** YES (survival need in freezing temps).  
  - **Step 2:** Beneficiaries are local, but NOT solely due to birthplace:  
    - *Co-Authorship Audit:* Families pay local taxes (Check 1), are governed by district (Check 2), can vote for school board (Check 3). → **NO LOTTERY VIOLATION.**  
  - **Step 4:** High local impact (direct life-saving).  
  - **Outcome:** **Approve** with minimal controversy.  

  #### **Proposal 2: Medical supplies for refugee camp**  
  - **Step 1:** YES (life-threatening outbreak).  
  - **Step 2:** Prioritizing locals would fail Moral-Lottery Filter (birthplace alone).  
    - **STOP → FLAG FOR ADVISOR:** "Does severity override lack of co-authorship?"  
  - **Step 4:** Likely high impact (low-cost, high-urgency medicine).  
  - **Outcome:** Contested but strong impartiality case → **Advisor must weigh severity vs. associative duties.**  

  #### **Proposal 3: Heritage-language program (citizens only)**  
  - **Step 1:** NO (cultural preservation ≠ survival need). → Proceed to Step 3.  
  - **Step 3:** *Co-Authorship Audit:*  
    - Citizenship requirement implies tax/legal ties (Check 1, 2 pass).  
    - BUT: Exclusion based solely on citizenship → **Triggers Moral-Lottery Filter** (birthright gatekeeping).  
  - **Unresolved Issues:**  
    - Is cultural loss a "basic need"? *Unsettled philosophy → **FLAG.***  
    - Does co-authorship justify excluding non-citizens? *Contested → **FLAG.***  
  - **Outcome:** **High risk of rejection** unless advisor overrides. Sympathy is irrelevant per procedure.  

  ---

  ### **What the Procedure Cannot Settle (Requires Explicit Judgment)**  
  1. **Threshold for "Basic Needs"**: Is cultural extinction equivalent to physical suffering?  
  2. **Weighting Associative Duties**: How much efficiency (e.g., impact-per-dollar) must be sacrificed for local ties?  
  3. **Moral-Lottery Overrides**: Can democratic co-authorship justify birthplace-based priority?  

  **Final Output Template:**  
  ```  
  PROPOSAL: [Title]  
  STEP 1: [Basic need? Y/N] → [Result]  
  STEP 2: [Moral-Lottery Filter] → [Pass/Fail/Flag]  
  STEP 3: [Co-Authorship Audit] → [Checks passed]  
  STEP 4: [Impact ratio] → [Local:Distant]  
  STEP 5: [JUDGMENT FLAGS]: [List unresolved philosophical conflicts]  
  RECOMMENDATION: [Approve/Reject/Advisor Judgment]  
  ```  

  This procedure forces transparency: value judgments are isolated at specific nodes, philosophical disagreements are surfaced but not resolved technically, and hard cases expose where impartiality clashes with intuition. It meets your charter’s demands without assuming expertise.
