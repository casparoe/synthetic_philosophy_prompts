  Here’s the villanelle, adhering strictly to your specifications:

  **Logical Fixed Point (A UDT Villanelle)**

  The predictor scans your source, its verdict sealed,  
  No evidence arrives to shift the view —  
  The box was filled before the choice revealed.

  No learning from oneself, the thought congealed  
  In code that sees the fixed point shining through —  
  The predictor scans your source, its verdict sealed.

  Newcomb's box gleams, a paradox unhealed  
  By causal chains. The math demands what's true:  
  The box was filled before the choice revealed.

  I seek to update, make my path concealed,  
  Condition on my act — a fatal cue.  
  The predictor scans your source, its verdict sealed.

  Condition here? The error stands revealed!  
  The source defines the act the whole world knew —  
  The box was filled before the choice revealed.

  No learning from oneself, the thought congealed.  
  Two truths persist, irreducible, askew:  
  The predictor scans your source, its verdict sealed —  
  The box was filled before the choice revealed.

  ---

  **Key elements addressed:**
  1.  **Form & Philosophy Alignment:** The unchanging refrains ("The box was filled before the choice revealed" & "The predictor scans your source, its verdict sealed") mirror the lack of evidential update in UDT regarding one's own choice. Their repetition embodies the fixed point.
  2.  **The Turn (Line 10):** "Condition here? The error stands revealed!" directly addresses the realization that conditioning on one's own choice is the fundamental mistake UDT avoids.
  3.  **Flat Tense & Non-Narrative:** Uses present tense ("scans", "demands", "defines") and timeless descriptions ("verdict sealed", "thought congealed", "fixed point shining through") avoiding past narrative or update.
  4.  **Newcomb's & Logical Correlation:** Explicitly names Newcomb's box ("Newcomb's box gleams") and frames one-boxing as demanded by the math recognizing logical correlation ("The source defines the act the whole world knew"), rejecting causation.
  5.  **Final Quatrain:** The two refrains stand side-by-side in the final two lines, explicitly presented as irreducible axioms ("Two truths persist, irreducible, askew").
  6.  **UDT Precision:** Uses UDT-specific terms/phrases correctly: "source", "fixed point", "predictor's algorithm" (implied in "predictor scans your source"), "defines the act", "logical correlation" (implied in the mechanism), rejecting "conditioning" and "causal chains".
  7.  **No Citations/Lists/Narrative Past:** Pure poetic expression of the concepts.
