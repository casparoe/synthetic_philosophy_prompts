prompt: |-
  I am trying to identify the principle behind my judgments about when material remains justify attributing a specific belief or social institution to an ancient culture, rather than only practical adaptation, diffusion, or economic rationality.

  My verdicts:
  - Standardized weights and measures recovered across independent market sites license inferring a normative institution of fair exchange, not merely shared craft skill.
  - Temples with precise astronomical alignments but no written calendars still license inferring an underlying cosmological belief system.
  - Identical decorative motifs on pottery found hundreds of kilometers apart do not license inferring shared religious belief; trade or stylistic imitation suffices.
  - A sudden, culture-wide shift in burial orientation occurring immediately above a stratigraphic layer indicating conquest licenses inferring changed religious belief, even though political coercion offers an alternative explanation.
  - Large-scale irrigation works with no administrative seals or writing implements do not license inferring the absence of bureaucratic belief; oral coordination remains plausible.
  - Child-sized functional replicas of adult tools in workshop debris license inferring a formal apprenticeship institution, not merely play.

  The case I keep reversing: a society with abundant adult funerary goods but virtually none for children, despite skeletal evidence of high child mortality. Sometimes the absence licenses inferring that children lacked full social-person status; other times it looks like pure economic rationality, so absence proves nothing.

  Is there a coherent principle that captures verdicts 1–6 and resolves the child-burial case? If not, which verdict should be dropped? State the principle precisely, defend it against my cases, identify any overturned verdict, and apply it to one further case: every settlement in a region builds an identical defensive wall, yet no settlement shows evidence of a central authority. Keep the response under 250 words: begin with the principle in one sentence, then address the cases, the unstable verdict, and close with your prediction for the wall case.
reasoning: |-
  Alright, let's tackle this archaeological inference puzzle. The user wants a unifying principle to explain their judgments about when material evidence justifies inferring beliefs or institutions versus practical adaptations.

  Looking at their six verdicts, I notice a pattern: they accept inferences when there's evidence of coordinated effort beyond immediate practicality (like standardized weights implying fair exchange norms), or when actions require non-utilitarian explanations (like astronomical temples). They reject inferences when simpler explanations suffice (like pottery motifs explained by trade). 

  The child burial case is tricky because both explanations seem plausible. But their own verdict 4 shows they accept belief explanations even when alternatives exist (like burial orientation change post-conquest). The key difference might be whether the practice requires group coordination - child burial exclusion doesn't, while standardized weights do. 

  For the unstable case, I'll argue economic rationality can't be the default when the practice contradicts basic human tendencies (like commemorating dead children), making belief inference stronger. 

  The wall case seems to parallel verdict 1 - identical walls without central authority suggest shared defensive norms, not just imitation. The coordinated effort implies institutional beliefs about collective security.

  Hmm... need to phrase this concisely. The core principle should emphasize non-utilitarian effort and collective coordination as belief indicators. Will structure the response: principle first, then resolve each case quickly, tackle the burial dilemma, and apply to walls - all under 250 words.
answer: |-
  **Principle:** Material evidence licenses inferring specific beliefs or institutions when it manifests *non-utilitarian coordination that requires shared intentionality beyond individual survival or imitation, and where simpler explanations (economy, diffusion, adaptation) demonstrably fail or are insufficient*.

  *   **Verdicts 1 & 2:** Standardized weights & astronomical alignments require coordinated, shared rules/meaning (fairness, cosmology) beyond individual skill or immediate utility.
  *   **Verdict 3:** Pottery motifs *can* spread via simple trade/imitation; no coordinated non-utilitarian purpose is needed.
  *   **Verdict 4:** Sudden burial shift post-conquest requires shared meaning change; coercion alone doesn't explain the *specific symbolic form* adopted universally.
  *   **Verdict 5:** Irrigation *could* be coordinated orally; absence of writing doesn't necessitate inferring *absence* of bureaucracy (fails insufficiency test for absence-inference).
  *   **Verdict 6:** Mini-tools require coordinated social structure (apprenticeship) beyond individual play; they serve a non-utilitarian (training) purpose embedded in social reproduction.
  *   **Child Burial:** **Infer the belief.** High child mortality makes utilitarian non-burial *less* likely (commemoration is near-universal). The *systematic exclusion* of goods specifically for children, despite adult practice, suggests a shared cultural norm denying them status – a non-utilitarian belief requiring coordination.
  *   **Wall Case:** Infer a shared defensive institution or norm. Identical walls across independent settlements require coordinated effort and shared understanding of threat/defense beyond simple imitation or individual adaptation; no central authority makes diffusion *less* likely than shared belief.
