  Okay, the user is studying philosophy of mind, specifically Dennett's idea of the self as a center of narrative gravity. They want me to apply this concept to the Billy Milligan trial from 1978. Milligan was charged with rape and robbery but claimed to have multiple personalities (alters), which his defense argued meant he wasn't responsible for the crimes.

  I need to map this carefully. Each alter should be treated as a competing sub-narrative with its own center of narrative gravity. Then I have to consider the legal person as the overarching narrative that the court either accepts or collapses into one defendant. The user also wants me to bring in Dennett's heterophenomenological method - treating the alters' reports as texts to interpret rather than direct access to separate minds. I need to analyze whether this stance helps or undermines the defense.

  I should explore why the jury eventually folded everything into a single accountable agent. Does narrative gravity explain this? Where does the model break down? And finally, does this case prove that legal responsibility requires one center of gravity, or does it show that Dennett's view can't handle real-world fragmentation?

