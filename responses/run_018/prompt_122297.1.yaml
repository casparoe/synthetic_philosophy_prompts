answer: |-
  Applying Dennett's concept of the self as a "centre of narrative gravity" to the Billy Milligan case reveals a fascinating tension between the phenomenology of fragmented identity and the legal system's inherent demand for narrative unity. Milligan's defence presented approximately twenty-four distinct "alters," each purportedly possessing unique personalities, memories, and intentions. Through Dennett's lens, each alter isn't a separate soul or core self, but rather a distinct sub-narrative – a coherent storyline with its own apparent centre of gravity. Arthur the rational Englishman, Ragen the Yugoslavian protector, Adalana the lesbian introvert – each represents a locally stable narrative construct explaining a subset of Milligan's behaviours, memories, and reported experiences. They are, in essence, compelling fictions generated by the brain, each pulling the narrative in different directions with its own claims to authorship and agency regarding specific events, including the crimes.

  The court, however, faced the challenge of mapping this fragmented internal landscape onto the singular legal person, "Billy Milligan," the defendant named in the indictment. The law requires an overarching narrative capable of bearing responsibility. The prosecution aimed to collapse all sub-narratives back into one centre – the biological individual, Billy Milligan, as the accountable author and agent of all actions emanating from that body. The defence, conversely, argued that the court *must* accept the presented multiplicity; that the legal person wasn't unitary but a collection, and crucially, that the alter who committed the rape (Adalana) was not the same narrative centre as the one who might dominate court appearances (Arthur), thus negating *Billy Milligan's* responsibility. The jury's initial acceptance of the insanity defence suggests they temporarily suspended the demand for a single centre, accepting the defence's narrative fragmentation as real enough to negate the usual model of unitary agency and intent.

  Dennett's heterophenomenological method adds a crucial layer. This approach instructs us to treat the first-person reports from all these alters – their testimonies, behaviours, and claimed experiences – not as transparent windows into truly separate minds, but as *texts* to be interpreted. We take them seriously, granting them full belief *from the subject's perspective*, but we don't necessarily ontologically commit to separate entities behind the reports. Applying this to the trial, the heterophenomenologist sees the statements of Arthur, Ragen, Adalana, etc., as genuine expressions of distinct narrative perspectives arising within Milligan's cognitive system. They are meaningful data points in constructing the best explanation of Billy Milligan's overall psychological state.

  This stance is double-edged for the defence. On one hand, it validates the *phenomenological reality* of the alters' distinctness. By taking each narrative seriously as a reported experience, heterophenomenology prevents simply dismissing the multiplicity as malingering. This lends scientific and philosophical weight to the defence's core claim: the subject experiences himself as multiple narrative centres, and this fragmentation is profound. On the other hand, heterophenomenology subtly undermines the notion of truly separate *agents*. By framing all alters as narratives *generated by* the single biological system (Milligan's brain), it implicitly reinforces the unity of the underlying machinery. The "texts" all originate from one source, even if they tell conflicting stories. For the legal argument about responsibility, this suggests the fragmentation, while experientially real, might still be a product of the single organism that must ultimately be held accountable for its outputs, however internally divided.

  The jury's ultimate decision (not guilty by reason of insanity) and the subsequent institutionalization highlight where narrative gravity explains the legal outcome. While they accepted the fragmentation sufficiently to negate *criminal responsibility* at that moment, the system couldn't function without eventually re-establishing a *single* centre for *management* and *potential restoration*. Milligan wasn't released; he was treated as *one* person requiring treatment for *his* dissociative disorder. The legal and therapeutic systems required a unified locus – the biological individual – to bear the consequences (confinement, treatment) and aim for future coherence. The narrative gravity needed to be recentered on "Billy Milligan" for practical societal interaction, even if his internal world remained complexly fragmented.

  The case exposes a limitation in Dennett's model when confronted with extreme fragmentation. The model elegantly explains the alters as competing sub-narratives. However, it struggles to fully account for the *depth of amnesic barriers* and the reported *lack of co-consciousness* between alters that characterised Milligan's case. If the self is fundamentally a narrative construct, how do we understand the apparent lack of any overarching narrator capable of integrating or even accessing all sub-narratives? Where is the "centre" when the narratives are so radically siloed that they deny each other's existence? Dennett's view risks downplaying the profound experiential disunity and the potential for truly parallel, non-communicating narrative streams within one brain.

  The Billy Milligan trial doesn't definitively prove that legal responsibility *requires* one centre of narrative gravity in an absolute metaphysical sense. Rather, it demonstrates that the *practical implementation* of responsibility within a legal framework built on individual agency *demands* it. The system needs a single point of attribution. Dennett's view doesn't break down entirely; it provides a powerful tool for understanding the alters as emergent narrative phenomena rather than souls. However, the case starkly reveals that this model, focused on narrative coherence, has difficulty accommodating the sheer, disruptive *incoherence* of radical dissociation. It shows that while the self might be a "useful fiction," the legal system relies on enforcing a *singular* fiction for responsibility, even when the internal narrative landscape suggests that fiction is, at best, a gross oversimplification and, at worst, fundamentally mismatched with the subject's lived reality. The verdict wasn't a triumph of Dennett's view explaining fragmentation, but a pragmatic legal adaptation to it, followed by an inevitable reassertion of unity for the system to function.
