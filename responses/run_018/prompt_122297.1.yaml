  First, I'll recall the key facts of the Milligan case. He had multiple personality disorder (now DID), with about 24 distinct alters. The defense argued that since different alters committed the crimes, Milligan himself wasn't responsible. The jury accepted this initially, finding him not guilty by reason of insanity.

  Applying Dennett's concept: Each alter can be seen as a sub-narrative with its own center of gravity. Arthur is rational, Ragen is protective, Adalana is lesbian, etc. Each has a coherent internal story that explains their behaviors and perspectives. The legal system, however, needs an overarching narrative - the "defendant" - to assign responsibility.

  Now, heterophenomenology: Dennett says we should treat first-person reports as texts to interpret, not as direct access to separate minds. In court, the alters' testimonies would be texts. The jury must decide whether to treat them as separate authors or as fragments of one author (Milligan).

  Interestingly, heterophenomenology might actually help the defense. By taking each alter's report seriously as a distinct narrative, it lends credibility to the idea that they're separate centers. The court did accept this initially.

  But why did the system eventually "re-center" Milligan as the single accountable agent? Even after the insanity verdict, he was institutionalized - implying the legal system still saw him as one person who needed treatment. Narrative gravity here explains the practical need for coherence. Responsibility requires a unified target - you can't punish "Ragen" without punishing "Arthur" since they share a body.

  Where the model breaks down: In DID, the narrative isn't just fragmented; it's radically discontinuous. Dennett's view might struggle with how to weight these competing gravities. The legal outcome shows that for responsibility assignment, society insists on a single center, even if it's artificial.

  So, does the case prove legal responsibility needs one center? Yes, practically speaking - the system can't function with fragmented responsibility. But it doesn't disprove Dennett; it just shows that his "useful fiction" becomes necessary in contexts like law. The fragmentation is real to Milligan, but the law must construct a unified defendant to maintain order.

