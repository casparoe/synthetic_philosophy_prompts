prompt: |-
  Hey — I'm trying to map institutional practices onto philosophical commitments, and there's this cluster that's bugging me. Courts in a lot of jurisdictions recognize "wrongful life" suits — a plaintiff claims they were harmed by being born with serious suffering — but there's no mirror doctrine for "wrongful non-existence," i.e. you can't sue parents for failing to conceive you when conditions were ideal. At the same time, welfare states pour money into IVF, prenatal screening, and child subsidies, but there's no comparable payout for voluntarily remaining childless.

  What theory of value or harm does that pattern preseuppose? Is it basically Benatar's asymmetry baked into law and policy — harm requires an existing subject, but missed pleasure doesn't? Or can a person-affecting restriction explain the gap without committing to antinatalism? And is the practice even consistant with negligence rules that treat actual harm as central to damages?

  Reconstruct the implicit philosophical theory here. Say what's strictly required by the institutional pattern versus what just happens to align with it nicely. Point out where it's underdetermined — could a fully symmetric view about existence and welfare license the same legal and policy outcomes? Then sketch what'd have to change in tort doctrine and welfare design if we replaced the presupposed asymmetry with a flat symmetric account.

  Keep it tight, no citations needed.

  Structure:
  1. The practice in brief — 2-3 sentences
  2. The implicit theory — about 1 paragraph
  3. Strict vs. optional commitments — short
  4. Underdetermination check — a few lines
  5. Replacement scenario — 2-3 sentences on what law/policy looks like without the asymmetry
reasoning: |-
  Hmm, the user is asking me to analyze how institutional practices like wrongful life lawsuits and IVF funding reflect philosophical theories of value and harm. They've noticed a pattern: courts allow lawsuits where someone claims they were harmed by being born into suffering (wrongful life), but don't allow lawsuits where someone claims they were wronged by not being conceived (wrongful non-existence). Meanwhile, welfare states support having children through IVF and subsidies, but offer nothing comparable for people who choose not to have children.

  The user wants me to reconstruct the implicit philosophical theory behind this pattern. They're wondering if this reflects David Benatar's asymmetry view - where existence is required for harm but not for benefits - or if a person-affecting view could explain it without antinatalism. They also ask about consistency with negligence law that centers on actual harm, and want me to distinguish what's strictly required versus what's optional, check if a symmetric view could lead to the same outcomes, and sketch what would change if we adopted a symmetric approach.

  Looking at the implicit theory, Benatar's asymmetry seems relevant here. Benatar argues that bringing someone into existence can be harmful if they suffer (since there's a subject to experience the harm), but not bringing someone into existence isn't harmful because there's no subject to experience the loss of pleasure. This aligns perfectly with why courts recognize wrongful life suits (harm to an existing person) but reject wrongful non-existence claims (no subject to harm). Welfare policies like IVF funding focus on creating subjects who can experience benefits, rather than rewarding non-creation.

  For strict versus optional commitments, I should note that the pattern strictly requires a person-affecting view - harm must have a subject. But it doesn't strictly require Benatar's asymmetry; it could potentially align with other asymmetric views. The practice is underdetermined because a symmetric view could theoretically support similar policies based on maximizing welfare, though it would likely lead to different legal outcomes.

  If we replaced the asymmetry with a symmetric view where both existence and non-existence have moral weight, we'd see significant changes. Courts might recognize wrongful non-existence claims in certain circumstances, and welfare policies might compensate the childless to "balance" the benefits received by parents. This would represent a fundamental shift in how we conceptualize harm and benefit in relation to existence.

  I'll structure my response with the five clear sections the user requested: practice in brief, implicit theory, strict vs. optional commitments, underdetermination check, and replacement scenario. I'll keep it concise without citations as requested, focusing on reconstructing the philosophical underpinnings of these legal and policy choices.
answer: |-
  Here’s the reconstruction:

  1.  **Practice in brief:** Legal systems recognize "wrongful life" suits (harm from being born into severe suffering) but reject "wrongful non-existence" claims (harm from not being conceived). Welfare states incentivize procreation (IVF, child benefits) but offer no symmetrical incentives for voluntary childlessness.

  2.  **Implicit theory:** This pattern presupposes a **person-affecting view with a strong existence requirement for harm.** Harm requires an existing subject experiencing a worsened state (e.g., born into suffering). Non-existence precludes having a subject, so failing to create a potential person *cannot* harm *that person* – there *is* no person to harm. Conversely, benefits (like welfare support) are directed towards existing persons or the act of creating subjects capable of receiving future benefits. Missed potential pleasures (of the unconceived) are not harms to anyone, while imposing suffering on an existing person *is* a harm. Benatar's asymmetry (preventing suffering is paramount, while foregoing pleasure lacks moral weight absent a subject) aligns perfectly.

  3.  **Strict vs. optional:**
      *   **Strictly required:** A person-affecting view where harm necessitates an identifiable, existing subject. Non-existence entails no subject, precluding harm *to that subject*. Actual suffering of an existing being is central to tort damages.
      *   **Optional/Nice alignment:** Benatar's full asymmetry, including the specific devaluation of missed pleasure. A weaker asymmetry (e.g., potential persons having weaker claims) could also fit. Antinatalism isn't required; the system focuses on the welfare of *actual* persons.

  4.  **Underdetermination check:** A symmetric, impersonal theory (valuing total welfare/potential pleasure regardless of existence) *could* technically license similar *pro-natal* policies *if* it calculated that existence generally increases net welfare. However, it could *not* license the *legal* asymmetry: a symmetric view *would* see failing to create a life expected to be very good as a loss/wrong (akin to a harm), potentially supporting "wrongful non-existence" claims. The consistent rejection of such claims requires the subject-requiring asymmetry.

  5.  **Replacement scenario (Symmetric View):**
      *   **Tort:** "Wrongful non-existence" suits could arise if parents negligently failed to conceive when conditions guaranteed an exceptionally high-welfare life. Courts might award "loss of existence" damages based on projected welfare.
      *   **Policy:** Welfare systems would need to balance incentives. Subsidizing the voluntarily childless could be justified as compensating them for the "loss" of the high-welfare children they *could* have had (or rewarding them for avoiding potential low-welfare lives). IVF funding might face greater scrutiny if potential lives could be low-welfare. Policy would explicitly aim at maximizing total potential welfare, not just serving existing persons.
