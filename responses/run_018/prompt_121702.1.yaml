  First, I need to recall Lewis's triviality results. Lewis showed that under certain assumptions, the probability of a conditional equals the conditional probability, leading to triviality. Any theory avoiding this must handle cases like Adams-style pairs and conditionals with false antecedents. 

  The user mentioned specific cases: Adams-style pairs (where P(if A, C) is high but P(C|A) is low), conditionals with false antecedents (like "If I were a dinosaur..." but for indicative ones, so examples like "If the match was wet, it lit" when it wasn't wet), and lottery paradox conditionals (e.g., "If I buy a ticket, I won't win"). These test how the theory handles low-probability antecedents or high-probability consequents.

  Distinctions to preserve include conditional probability vs. probability of the conditional. Users want to maintain that P(if A, C) isn't always equal to P(C|A), but also handle cases where they diverge. Another is static belief vs. belief revision—how agents update beliefs when encountering new conditionals.

  Formal constraints: probabilistic coherence is non-negotiable. Modus ponens might need restriction, as unrestricted leads to issues like McGee's counterexamples. The user suspects that keeping the material conditional for logical truths (e.g., "If P and not P, Q") while avoiding triviality is impossible. The material conditional approach makes P(A ⊃ C) = 1 - P(A) + P(A∧C), which differs from P(C|A), leading to conflicts in triviality proofs.

  Revision-path independence is their unique constraint. This means that evaluating a conditional shouldn't depend on the order of belief revisions. For example, when revising beliefs that conflict, the outcome should be consistent regardless of the sequence. Lewis's triviality bites when different revision paths lead to different probabilities for the same conditional.

  Now, checking joint unsatisfiability: The user's hunch is that keeping material conditionals for logical truths, maintaining probabilistic coherence, and avoiding trivial probabilities is impossible. Lewis's results show that if P(if A, C) = P(C|A) for all cases, it leads to triviality. Material conditionals handle logical truths but conflict with probabilistic coherence when combined with the Equation. So yes, those three are incompatible. Any theory must sacrifice one: either drop probabilistic coherence, avoid the Equation universally, or abandon material conditionals for logical truths. Most theories opt to restrict the Equation or modify the logic.

  Evaluating existing theories:
