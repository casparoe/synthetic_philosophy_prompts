  I'm working on a paper about what it actually takes for a theory of indicatve conditionals to avoid Lewis's triviality results without just giving up on probabilistic coherance altogether. Can you write me the full desiderata list? I want: the specific cases it has to handle right (Adams-style pairs, conditionals with false antecedents that we still reason with, the lottery-paradox conditional, etc.), the distinctions it must preserve (conditional probability vs probability of the conditional, static belief vs belief revision), and any formal constraints that are genuinely non-negotiable vs just preferences of particular camps (like whether we need to preserve modus ponens in full strength or just a restricted form). I also want you to flag whether some subset is jointly unsatisfiable -- my hunch is that keeping the material conditional for logical truths, maintaining probabilistic coherance, and avoiding trivial probabilities is impossible together, but tell me if I'm wrong. Include one niche constraint I'm adding: call it 'revision-path independence' -- the idea that evaluating 'if p then q' shouldn't depend on the order we revise away conflicting beliefs, since that's where the triviality bites. Don't do a full literature review, just score Stalnaker's view, Adams's probabilistic approach, and a causal-model rescue briefly against the core criteria. Keep it focused on what the theory has to deliver, not the biography of the debate.
