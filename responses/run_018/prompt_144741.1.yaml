prompt: |-
  hey i'm trying to map out my prof's views on dragging Gödel out of math for my seminar notes and i'm a little stuck. she said quantum mechanics is safe because physics isn't a closed derivational system trying to prove everything. she said formal software verification gets hit straight on if the code includes arithmetic and checks its own consistency. she said constitutional courts that interpret their own authority aren't formal enough, so Gödel doesn't apply there even by analogy. she said art criticism is totally out since there's no completeness aim, and she said LLMs are out too since they don't derive things from axioms. she also mentioned that a fully formalized medical ethics calculus with actual axioms and numbers in it would have unavoidable internal blind spots. now we're discussing this weird hypothetical system: a self-amending legal reasoning engine built on modal logic with explicit rules for revising its own interpretation rules when they conflict, but it deliberately excludes any numerical computation or arithmetic representation. i want to predict what she'd say about whether Gödel bites here, and i need the closest preceedent from her list. more importantly i want to know what rule she's actually running—something like "needs Peano arithmetic," or "needs formal rules with self-reference," or "needs the completeness-consistency tension"—and whether her past verdicts genuinely underdetermine this case. if she says yes she's adopting one principle, if no she's adopting another—what exactly are those commitments? and what's the one further case i should ask about to really see which rule she's using? please answer in continuous prose only, no headings, no bullet points, no bold, no tables, just like a long email. thanks.
