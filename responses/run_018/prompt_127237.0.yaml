  Here is my decomposed credence regarding cyclical institutional decline, with probabilities reflecting cautious epistemic humility given historiography's contested nature:

  1.  **Anacyclosis generalizability beyond poleis: 35%**  
      *Justification:* While elite corruption and regime oscillation occur in empires (e.g., Late Roman Principate to Dominate), rigid Polybian sequencing rarely fits; hybrid stability mechanisms (e.g., Chinese imperial bureaucracy) disrupt the cycle.  
      
  2.  **Asabiyyah erosion beyond tribal-states: 60%**  
      *Justification:* Group cohesion decay via institutional sclerosis, elite capture, and rising transaction costs is observable in diverse states (e.g., Ottoman *timar* system decline, Ming tax inefficiency), though modern nationalism/commerce alters dynamics.  
      
  3.  **Linear-progressive failure on entropy: 75%**  
      *Justification:* Techno-economic progress often coexists with institutional decay (e.g., Roman infrastructure amid 3rd-century crisis; Soviet industrial decline); complex systems inherently accumulate unmanaged functional load.  
      
  4.  **Contingency-only models inadequacy: 65%**  
      *Justification:* Recurring dissolution drivers (fiscal exhaustion, succession crises, military overextension) across empires (e.g., Han, Abbasid, Habsburg) suggest latent structural vulnerabilities beyond random shocks.  

  **Combined credence:**  
  Multiplicative aggregation (assuming moderate interdependence):  
  `0.35 × 0.60 × 0.75 × 0.65 ≈ 0.102 → **10.2%**`  

  **Dominant term:** **Anacyclosis generalizability (1)** is the weakest link. Its low probability drags down the overall credence most significantly, as institutional complexity in large states defies Polybius' mechanical phase transitions.  

  **Highest-impact case study:**  
  A **comparative study of institutional decay sequencing** in bureaucratic empires facing similar stressors (e.g., simultaneous analysis of Rome [235-284 CE], Abbasids [9th century], Ming [17th century]), rigorously coding:  
  - Elite rent-seeking patterns  
  - Fiscal/resource extraction efficiency  
  - Military loyalty mechanisms  
  - Crisis response adaptability  
  If decay *sequences* consistently mirror *asabiyyah* erosion (e.g., kinship → patronage → mercenary reliance → fiscal collapse) despite divergent contingencies, it would strongly boost terms (2) and (4), potentially doubling overall credence. Conversely, finding path-dependent, non-repeating failure modes would validate contingency models.  

  **Methodological note:** Probabilities reflect weighting of empirical counterexamples (e.g., Song China's commercial resilience vs. predictable Mamluk decline) and theoretical critiques (e.g., Tainter's complexity-collapse theory as a cyclical-adjacent mechanism). The combined credence remains low due to institutional plasticity and human agency in reforming decay trajectories.
