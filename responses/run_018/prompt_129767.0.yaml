answer: |-
  The repugnant conclusion (RC) forces constitutional designers to confront a core paradox: **maximizing total welfare may require prioritizing population quantity over quality**, creating profound tensions in climate governance where regimes determine both future population size and welfare levels. Here’s a disciplined analysis of its institutional implications:

  ---

  ### **1. The Totalist Dilemma in Constitutional Design**
  - **Problem**: Total utilitarianism (TU) mandates choosing adaptation—it yields greater *aggregate* welfare despite lower average welfare. A constitution prioritizing "total welfare" would thus institutionalize RC, favoring larger populations even at marginal welfare levels.  
  - **Constitutional Rejection Necessity**: If avoiding RC is a normative constraint (e.g., valuing flourishing over mere existence), TU must be rejected in foundational texts. Otherwise, adaptation regimes dominate regardless of welfare dilution—a result many deem morally unsustainable.  
  - **Procedural Risk**: Embedding TU could incentivize policies that expand populations to offset welfare declines, perversely linking demographic growth to constitutional compliance.

  ---

  ### **2. Person-Affecting Restrictions: Coherence and Thresholds**
  - **Non-Identity Challenge**: Since no identifiable individual is worse off under either regime (different future persons exist), standard person-affecting principles (PAP) cannot distinguish the options. Both regimes are "neutral" under PAP.  
  - **Codification Attempts**:  
    - **Welfare Thresholds**: A constitution could mandate "no life below welfare level *x*." But *x* is arbitrary (*Why not 1% higher?*), risks non-enforceability, and ignores that PAP still fails to compare populations.  
    - **Harm Avoidance**: Banning "harmful existence" is incoherent here—all lives are worth living. PAP collapses into paralysis without exogenous benchmarks.  
  - **Institutional Outcome**: PAP alone is operationally inert for this choice. It might only forbid regimes creating miserable lives, but both clear this low bar.

  ---

  ### **3. Intermediate Axiologies: Relocating, Not Resolving, RC**
  - **Critical-Level Utilitarianism (CLU)**:  
    - Sets a fixed welfare threshold (CL) above which lives contribute positively. Mitigation wins if adaptation’s average welfare dips near CL.  
    - **Relocated Problem**: CL is arbitrary. If CL = 50 (on a 0–100 scale), why not 49? Constitutions face a meta-arbitrariness in setting CL. Lower CL revives RC (favoring large populations); higher CL risks "anti-repugnance" (rejecting large populations with *good* lives).  
  - **Rank-Weighted Utilitarianism (e.g., Prioritarianism)**:  
    - Values welfare gains to the worse-off more highly. Mitigation could win if its higher average welfare disproportionately benefits the least advantaged.  
    - **Pressure Points**:  
      - If adaptation’s population grows enough, its sum of weighted welfare may still exceed mitigation’s.  
      - Weighting schemes (e.g., "lexical priority") are themselves contestable thresholds.  
  - **Institutional Trade-off**: These frameworks avoid RC only by embedding **new, opaque thresholds** into constitutional criteria. Decision-makers then face discretional interpretation—shifting RC’s counterintuitive pressure from outcomes to **axiological parameter selection**.

  ---

  ### **Synthesis for Intergenerational Governance**
  - **Constitutional Imperatives**:  
    - Explicitly reject TU to avoid RC-driven adaptation bias.  
    - Define non-arbitrary axiological anchors (e.g., "sufficientarian welfare floors" or "priority to the potential worst-off").  
    - Embed deliberative procedures for revising thresholds as ethical consensus evolves.  
  - **Procedural Safeguards**:  
    - **Asymmetric Burden**: Place the onus on adaptation advocates to prove welfare won’t converge toward "barely worth living."  
    - **Dynamic Review**: Constitutional courts could evaluate population welfare distributions, not just totals.  
  - **Core Insight**: No axiology neuters RC; it transforms the dilemma into **governance of thresholds**. Mitigation’s appeal rests on axiologies that value welfare equality or resilience, but constitutions must openly justify why these trump aggregate gains—or accept that RC’s logic permeates all but the most stringent critical levels.  

  > **Conclusion**: The RC forces constitutions to choose between *explicitly endorsing* population expansion at low welfare (via TU), *paralyzing* decision-making (via PAP), or *instituting contestable thresholds* (via CLU/prioritarianism). Mitigation regimes align best with RC-averse axiologies but require constitutionalizing qualitative welfare standards—inevitably importing value judgments into the structure of intergenerational justice.
