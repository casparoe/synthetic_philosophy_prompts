prompt: |-
  I'm writing a feature on whether history gets stuck in ruts or whether we just tell tidy stories afterwards. I've got these gut reactions to four specific cases, and I want to know if there's an actual principle behind them — not just a post-hoc rationalisation.

  My verdicts:

  QWERTY is pure path dependence. Sholes arranged the keys in the 1870s to solve a mechanical problem, and now we're stuck with it despite far better layouts existing; there's no hidden functional reason it had to win.

  The 4ft 8.5in railway gauge is also an accident — it traces back to mine-cart wheel spacing in the north-east — but I don't feel the same lock-in. My instinct is that standardisation pressure across networks would have pushed railways toward roughly this gauge, or something very close, within a generation or two. So its origin is contingent, yet its survival feels overdetermined.

  The AC versus DC current war in the 1890s strikes me as genuinely open. Westinghouse and Tesla's AC system won partly through the Niagara Falls contract and partly through Edison's disastrous PR campaign against it. Had those specific events broken differently, DC might dominate now, and the grid would look radically other. That's contingency without any hidden attractor.

  Then there's the global adoption of the Gregorian calendar. Yes, Catholic Europe pushed it first, but its spread elsewhere feels driven by astronomical accuracy rather than political inertia. I wouldn't call it path-dependent at all; it was simply the best clock available and would have displaced local calendars eventually.

  So my pattern is inconsistent: QWERTY and AC/DC are locked-in accidents, railway gauge hides an inevitable convergence, and the Gregorian reform was never an accident. Its just describing the cases rather than explaining them, unless there's something deeper. Is there a coherent principle — maybe involving network externalities, functional redundancy, or institutional hysteresis — that saves all four? Or do I have to drop one?

  I want a committed answer, not a menu: state the principle precisely, say which clause each case motivates, predict what it says about cases I haven't mentioned (for instance, whether the Unix file heirarchy is locked in, or why the metric system conquered science but not UK road signs), and be honest about which of my four gut reactions it forces me to abandon. I'm also playing with this idea of 'counterfactual redundancy' borrowed from evolutionary biology — that some outcomes have multiple independent paths leading to them, so losing one path doesn't change the result — but I'm unsure whether that maps onto institutions or is just a fancy metaphor. Use it if it helps; reject it plainly if it doesn't.

  Please don't just list possibilities. Pick the best account you can, defend it, and tell me exactly where my intuition has to bend.
reasoning: |-
  Okay, let me tackle this user's query. They're writing a feature on whether history is path-dependent or if we just create tidy stories afterward. They've shared their gut reactions to four cases: QWERTY, railway gauge, AC/DC current, and the Gregorian calendar. Each has a different verdict on contingency versus inevitability. The user wants a unified principle that explains all four without just rationalizing post-hoc.

  First, I need to recall the key concepts here. Path dependence means early accidents lock in a suboptimal outcome. Network effects make switching costly once a standard is adopted. Functional requirements push systems toward optimal solutions. The user mentioned "counterfactual redundancy," which suggests multiple paths to the same outcome. 

  Looking at QWERTY: it's a classic lock-in. The mechanical reasons are obsolete, but the keyboard persists due to network externalities—everyone's trained on it, so switching is costly. No strong functional need keeps it, so contingency dominates.

  Railway gauge: The origin is accidental, but the user feels convergence was inevitable. Why? Standardization across networks creates pressure for a uniform gauge. Even if a different gauge started, the need for interoperability would push toward a similar width. Functional constraints (like stability and tunnel size) limit the range, so it's overdetermined.

  AC/DC: The user sees genuine contingency. Both technologies had pros and cons. AC won due to specific events like the Niagara contract and Edison's PR blunders. No hidden functional superiority made AC inevitable; DC could have dominated. Network effects then locked in AC.

  Gregorian calendar: Here, the user sees no accident—it was astronomically superior. Even without Catholic Europe, its accuracy would lead to adoption. Functional efficiency drives this, not path dependence.

  The challenge is finding a principle that covers all. The core seems to be the interaction between contingency and functional constraints. For QWERTY, functional redundancy (other layouts work) allows lock-in. Railway gauge has strong functional constraints, making convergence likely. AC/DC had low functional determinism, so contingency mattered. Gregorian's high functional superiority overrode path dependence.

  Counterfactual redundancy applies where functional constraints are tight. Railway gauge has it—multiple paths lead to a similar gauge. Gregorian calendar too, as its accuracy ensures eventual adoption. But AC/DC and QWERTY lack this; outcomes could differ.

  The user must adjust their railway gauge view. It's not just convergence; the exact 4ft 8.5in is contingent, but the range is constrained. The principle explains why survival is overdetermined, but the origin's accident still matters.

  For other cases: Unix hierarchy has functional flexibility, so lock-in is strong. Metric system in science has high functional need, leading to adoption, but road signs in the UK show cultural persistence despite functional redundancy.

  The user's gut on Gregorian as non-accidental fits. AC/DC as contingent holds. QWERTY is pure path dependence. But railway gauge needs nuance: the specific measure is contingent, but standardization and constraints make convergence likely. The unified principle is the degree of functional constraint determining whether contingency locks in or convergence occurs.
answer: |-
  Here's the committed answer you requested, built around a unified principle derived from your cases and explicitly rejecting "counterfactual redundancy" as insufficient for institutional/technological evolution:

  **The Core Principle: "Functional Constraint Determines Contingency's Horizon"**

  *   **Stated precisely:** The persistence of a historical outcome depends on the *strength of functional constraints* relative to *network-driven switching costs*. When functional constraints are weak (multiple solutions work adequately), early contingency can lock in suboptimal outcomes via network externalities. When functional constraints are strong (narrow optimal solution space), initial contingency is often overcome by functional pressure, or the outcome becomes functionally overdetermined despite its accidental origin. The "horizon" of contingency's influence shrinks as functional constraints tighten.

  **Applying the Principle to Your Four Cases:**

  1.  **QWERTY (Pure Path Dependence):** **Functional Constraints = VERY LOW.** Many keyboard layouts achieve roughly similar typing efficiency. **Network Effects = VERY HIGH.** Retraining billions, rewriting software, replacing hardware is massively costly. **Result:** Sholes' specific mechanical fix (contingency) locked in permanently. No hidden attractor; functional redundancy permits enduring lock-in. **Clause:** Weak functional constraint allows pure contingency to dominate long-term.

  2.  **Railway Gauge (Contingent Origin, Overdetermined Survival):** **Functional Constraints = MODERATE/STRONG.** Gauge *range* is constrained: Too narrow = instability; too wide = excessive land/cost/tunnel size. ~1.4m-1.6m is a sweet spot. The *exact* 4ft 8.5in is not sacred, but deviations have real costs. **Network Effects = VERY HIGH.** Interoperability *demands* standardization across a network. **Result:** The *specific* 4ft 8.5in origin *is* contingent (N.E. mine carts). However, the *survival* of a gauge *within the functional range* is overdetermined by network standardization pressure. Convergence to *a* standard gauge within ~1.4m-1.6m was highly likely; the exact number is less critical than the network effect forcing uniformity. **Clause:** Moderate functional constraints narrow the viable solution space, making convergence likely despite contingent origin. Network effects lock in *a* standard, not necessarily the *first* one indefinitely if functional flaws were severe.

  3.  **AC/DC War (Genuine Contingency):** **Functional Constraints = LOW/MODERATE (at the time).** Both AC and DC had significant pros/cons in the 1890s. DC was better for local distribution, motors, and early lighting. AC was better for long-distance transmission. Neither had a *decisive* functional superiority across all applications *at that technological stage*. **Network Effects = VERY HIGH (once infrastructure builds).** **Result:** Contingent events (Niagara contract, Edison's PR blunder) tipped the scales. With different events, DC networks *could* have become dominant locally, potentially delaying or altering AC's rise. Significant functional differences existed, but neither solution was so overwhelmingly superior that it would have inevitably crushed the other regardless of events. Lock-in occurred based on contingent wins. **Clause:** Low functional constraint at the decision point allows contingency to determine *which* solution locks in via network effects.

  4.  **Gregorian Calendar (Functional Superiority Trumps Path):** **Functional Constraints = VERY HIGH.** Calendars must track astronomical reality (solar year, seasons) accurately for agriculture, rituals, and social coordination. The Julian calendar's drift (~11 mins/year) was cumulatively catastrophic (10 days by 1582). The Gregorian reform provided a precise, astronomically sound solution. **Network Effects = MODERATE (cultural/social inertia).** **Result:** While Catholic Europe provided the initial path, the *driving force* for adoption elsewhere (even centuries later) was overwhelmingly the *functional necessity* of accuracy. Protestant Germany, UK, Japan, USSR, etc., adopted it despite political/religious resistance because the functional flaw of their existing calendars became intolerable. It *was* the "best clock" and displaced local calendars because *not* adopting it created increasing functional deficits. **Clause:** Very strong functional constraints make adoption functionally mandatory, overwhelming path dependence and network inertia from local systems. Contingency only influenced *when* and *how* it was adopted, not *if*.

  **Your Required Intuition Adjustment:**
  You must **abandon the idea that the railway gauge's *origin* being contingent is irrelevant to its *survival*.** The principle forces nuance: The *exact value* 4ft 8.5in *is* contingent. Had initial mine carts used 5ft, *that* might have become the standard, *if* it was still within the functional range (~1.4m-1.6m). Your instinct that standardization pressure would have pushed towards *a* standard gauge is correct (functional constraint + network effects). However, your instinct that it would have been "roughly this gauge, or something very close" needs refinement: "something close" is defined by the functional constraints (the viable range), but the *specific point* within that range remains contingent on initial conditions. The survival of *a* standard is overdetermined; the survival of *this specific* standard within the viable range is still path-dependent.

  **Predictions for New Cases:**

  *   **Unix File Hierarchy (`/usr/bin`, `/etc`, `/home`):** **Functional Constraints = LOW.** Many organizational schemes are possible (registry, database, tags). **Network Effects = VERY HIGH.** OS, application, and admin training/skills deeply entrenched. **Prediction:** **Strong Lock-in.** Pure path dependence like QWERTY. Functional redundancy allows the contingent early design to persist despite not being "optimal." Alternatives (e.g., Apple's ill-fated database FS) fail due to switching costs.
  *   **Metric System in Science vs. UK Road Signs:**
      *   *Science:* **Functional Constraints = VERY HIGH.** Precision, interoperability, SI unit derivations, universal communication essential. **Network Effects = MODERATE/HIGH (but overcome).** **Prediction:** **Functional superiority drives near-universal adoption.** Like Gregorian Calendar. Contingency (French Revolution origin) irrelevant to functional dominance.
      *   *UK Road Signs:* **Functional Constraints = LOW.** Miles/MPH vs. km/kph both function adequately for drivers. **Network Effects = VERY HIGH.** Physical signage replacement cost, driver retraining, cultural identity. **Prediction:** **Strong Lock-in.** Like QWERTY. Functional redundancy allows path dependence (historical Imperial units) to persist despite the global metric standard.

  **Rejection of "Counterfactual Redundancy":**
  While a compelling concept in evolutionary biology (multiple mutations leading to similar traits), it **doesn't map cleanly onto socio-technological lock-in.** Technological/institutional evolution lacks the vast population-scale parallel trial-and-error of biology. Historical paths are singular sequences of decisions influenced by power, chance, and specific contexts. We don't see "multiple independent paths" converging on QWERTY or 4ft 8.5in; we see singular paths shaped by contingency, whose persistence is then determined by functional constraints and network effects. The railway gauge case shows *functional convergence pressure* (a narrow solution space), not true counterfactual redundancy (multiple *independent historical paths* leading to 4ft 8.5in). It's a useful metaphor for the *outcome* (a standard gauge emerges) but not for the *process* (how that *specific* gauge came to be). **Stick to the Functional Constraint/Network Effects framework; it's more precise and predictive.**

  **Conclusion:** Your gut reactions were largely correct, but the principle forces a more precise view of the **railway gauge**. Its *survival* feels overdetermined because functional constraints created a narrow viable range *and* network effects demand standardization. However, the *exact* 4ft 8.5in value within that range *is* a contingent accident. The principle explains QWERTY (weak constraint, high network lock-in), AC/DC (low constraint at decision point, contingency wins), and Gregorian (strong constraint dominates) cleanly, and provides clear predictions for other cases. History gets "stuck" when functional constraints are weak enough that network effects can lock in contingent early choices; convergence happens when functional constraints are strong enough to overcome path dependence or define a narrow range where any initial choice within it becomes locked-in via networks.
