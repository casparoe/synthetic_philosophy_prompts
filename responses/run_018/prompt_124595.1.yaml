answer: |-
  ### Craft-Based Restatement of Sphexishness Debate  
  *(Using exclusively narrative-craft vocabulary)*  

  **The Rigid Loop (Sphex Wasp Analogy):**  
  A character’s arc adheres strictly to the **continuity bible** and **plot outline**—like a wasp’s pre-programmed sequence. Editorial mandates lock behavior into fixed loops. Any apparent "choice" on the page is predetermined; deviations are continuity errors. The character’s actions replay like a trope, mechanically serving the author’s blueprint.  

  **The Flexible Illusion (Free Will Analogy):**  
  **On-the-page improvisation** simulates agency. Environmental pressures (e.g., reader feedback, mid-series tonal shifts) force **revisions** that retrofit the outline. Characters "adapt" via retroactive continuity adjustments—like rewriting a protagonist’s reaction after editorial notes demand relatability. The *illusion* of autonomy emerges when spontaneous prose masks deterministic foundations.  

  **The Tension (Determinism vs. Adaptation):**  
  - **Authorial determinism** = Plot outlines as evolutionary programming. Characters inherit fatal flaws (e.g., "tragic hero arc") from their narrative DNA.  
  - **Environmental selection** = Editorial mandates acting as selection pressure. A side character’s unexpected popularity forces rewrites, "selecting" them for survival.  
  - **"Autonomy"** = The friction between outline and improvisation. A villain’s motive shifts in Book 3 via retcons, creating the *impression* they "chose" redemption.  

  ---

  ### Residue Report  

  **Clean Translations:**  
  1. **Behavioral rigidity** → **Slavish outline adherence**. Both reduce action to predictable loops.  
  2. **Environmental pressures** → **Editorial mandates/audience feedback**. External forces reshaping "programmed" arcs.  
  3. **Adaptation** → **Retroactive revision**. Survival of narrative elements via post-hoc adjustments.  
  4. **Illusion of choice** → **Improvised prose masking predetermined arcs**. The core artifice of character agency.  

  **Distorted Translations:**  
  1. **"Free will" as uncaused causation** → No craft equivalent. Authorial choices (even improvisational ones) are always causally determined by craft goals, deadlines, or editorial notes. What feels like "character freedom" is just **unplanned authorial problem-solving**.  
  2. **Biological programming** → **Continuity bibles** are *chosen* constraints, not immutable laws. Authors can scrap them (unlike genetics).  
  3. **Consciousness** → Craft lacks a parallel. Characters don’t "experience" their determinism; readers infer it from prose.  

  **Untranslatable Claims:**  
  1. **Metaphysical free will** (non-physical causation). Craft operates in material authorial decisions. "Freedom" is always a *narrative effect*, never ontological.  
  2. **Moral responsibility debates**. If a character "chooses" evil per outline, is *the author* responsible? Philosophy’s ethical layer vaporizes—blame resides with the writer, not the puppet.  

  **Survival of "Free Will" in Craft Terms:**  
  It evaporates. What philosophers call "free will" becomes **the gap between outline and execution**:  
  - Outline = **Authorial determinism**  
  - Improvisation = **Contingent revisionism**  
  - Reader-perceived agency = **Emergent illusion from prose fluency**  

  **Residue Revelation:**  
  The philosophical debate’s core tension (rigidity vs. freedom) maps cleanly onto **outline fidelity vs. improvisational revision**. But the residue exposes that **all narrative "agency" is authorial sleight-of-hand**. The craft framework collapses the debate: "Freedom" is just a *technique* for hiding determinism. What philosophy treats as substantive (e.g., "Could the sphex choose otherwise?") becomes trivial in craft ("Could the *author* rewrite the scene?"). The gap isn’t in your vocabulary—it’s in the artifice of storytelling itself.  

  **Final Diagnosis:**  
  Serialized fiction *resolves* the sphexishness debate by proving all "agency" is curated. The wasp’s loop and human "choice" differ only in the *complexity of the programming* and the *skill of the programmer*.
