prompt: |-
  I'm a junior serving on the three-person editorial board of The Synthesis, our high school's interdisciplinary journal, and our faculty advisor—who studied epistemology in graduate school—has asked me to formalize how we evaluate submissions that rest on testimony. We keep encountering essays that cite an expert's oral report of an unreplicable experiment, or that rely on a widely circulated but anonymously authored historical document, and the board argues about whether accepting these claims requires us to independently verify the speaker's reliability and perceptual access, or whether we can be justified in believing the content directly from the word itself. She framed the dispute for me in terms of testimony reductionism, which treats a hearer's justification as ultimately grounded in her own reasoning about the speaker's credibility and in her direct grasp of the utterance, versus anti-reductionism, which allows that the hearer acquires justification for p straight from the speaker's assertion without that intermediate inference being necessary. I need a reusable decision procedure—an ordered checklist with explicit stopping rules—that our board can run on any submitted claim that depends on testimony, specifying in sequence: what evidential-pedigree questions to ask, what counts as a sufficient answer at each stage, where the procedure issues a verdict of "accept as testimony-justified," "reject for lack of independent corroboration," or "refer to board judgment because the issue is one of values or risk tolerance rather than fact," and where it must halt because judgment cannot be eliminated.

  The procedure should be designed for a non-specialist board meeting twice a month with limited time, so each step needs a clear test that does not require philosophical training to apply, but it must preserve the actual logical difference between the two positions rather than collapsing them into vague "trust your source" advice. Please include worked applications to two hard cases: first, a claim based on a single expert's oral report of an unreplicable laboratory result, and second, a claim based on an anonymous historical document whose authorship and institutional origin are unknown. One of these applications must yield an outcome that should feel counterintuitive—specifically, a divergence where the anti-reductionist path permits acceptance but the reductionist path demands rejection, and the procedure must flag exactly at which step the paths split and why. Finally, state explicitly what the procedure cannot settle, particularly whether the speaker's social position, institutional authority, or demographic identity should enter the reductionist reliability calculation, and mark that gap clearly as a value judgment that the board must make without procedural cover.
reasoning: |-
  We are designing a decision procedure for evaluating testimony in submissions. The two main philosophical positions are:
  - Reductionism: Justification for believing testimony requires the hearer to have positive reasons (based on perception, memory, inference) to believe that the speaker is reliable and that the speaker had the appropriate perceptual access.
  - Anti-reductionism: Testimony can provide justification without the hearer needing independent reasons to believe the speaker is reliable. The mere fact that an assertion is made can provide prima facie justification.

  We need a step-by-step procedure that captures the difference between these two approaches and leads to one of three outcomes:
  1. Accept as testimony-justified.
  2. Reject for lack of independent corroboration.
  3. Refer to board judgment (for non-factual issues, such as values or risk tolerance).

  The procedure must be applicable by non-specialists and must clearly show where the reductionist and anti-reductionist paths diverge.

  The procedure:

  Step 1: Identify the Testimonial Claim
     - Ask: "What exactly is the claim (p) that the submission is making based on testimony?"
     - Sufficient answer: A clear statement of p.

  Step 2: Check for Internal Inconsistency
     - Ask: "Is p internally inconsistent (logically contradictory) or inconsistent with other claims in the submission that are not based on testimony and have been independently established?"
     - If yes: Reject for lack of independent corroboration (since the testimony is self-defeating or contradicts known facts). HALT.
     - If no: Proceed to Step 3.

  Step 3: Assess the Testimonial Source (Anti-reductionist path may bypass deeper scrutiny here)
     - Ask: "Does the testimony come from a source that is identified and contextually appropriate for p? (e.g., a scientist reporting a lab result, a historian citing a document) and is the testimony presented as a sincere assertion?"
     - If no: Reject (because the testimony is not even presented as a genuine assertion, e.g., it's fictional, satirical, or the source is clearly inappropriate). HALT.
     - If yes: Proceed to Step 4.

  Step 4: Reductionist Path Requirement (This step is where the paths diverge)
     - Ask: "Is there independent evidence (available to the board without requiring new research) that supports the reliability of the speaker for claims like p? This evidence must be about the speaker's general reliability or specific access to the facts of p, and it must be based on the board's own observations, memories, or inferences (not more testimony)."
     - Reductionist criterion: If independent evidence is lacking, then the reductionist path leads to rejection. However, note that the anti-reductionist path does not require this step for justification.
     - Therefore, we must split the procedure here:

     Step 4a: Apply Anti-reductionist Test
        - Ask: "Is p the kind of claim that is within the domain of the speaker's expertise (if known) or at least not obviously outside any plausible domain? And is there no known strong defeaters (i.e., evidence that the speaker is lying or mistaken that is immediately available)?" 
          (Note: Anti-reductionism only requires that there are no defeaters, not positive reasons.)
        - If yes: Then the anti-reductionist path would accept p as testimony-justified. But we haven't yet considered reductionism.
        - If no: Then even anti-reductionism would reject. HALT (reject).

     Step 4b: Apply Reductionist Test (in parallel, but note that if Step 4a fails we've already halted)
        - Ask: "Is there independent evidence (as defined above) for the speaker's reliability and access?"
        - If yes: Then reductionism also accepts. So we can accept.
        - If no: Then reductionism would reject.

     Therefore, the procedure at Step 4 leads to:
        - If Step 4a fails: Reject (both paths would reject).
        - If Step 4a passes and Step 4b passes: Accept (both paths accept).
        - If Step 4a passes but Step 4b fails: Then we have a split. The anti-reductionist path would accept, but the reductionist path would reject. We then proceed to Step 5 for a board decision on which approach to take.

  Step 5: Resolve the Reductionism/Anti-reductionism Divide (for the split case)
     - This is a philosophical/value choice that the board must make. The procedure cannot decide between reductionism and anti-reductionism. Therefore, we mark this as a point where the board must use judgment.
     - We output: "Refer to board judgment: The claim passes the anti-reductionist test but fails the reductionist test. The board must decide whether to adopt an anti-reductionist stance (and accept) or a reductionist stance (and reject)."

  However, note: The board's faculty advisor has framed the dispute in these terms, so the board must be aware of the two positions. But in practice, for efficiency, the board might have a standing policy on which stance to take in split cases. Alternatively, they might decide on a case-by-case basis.

  But the procedure must be reusable and clear. Therefore, we design Step 5 as:

     Step 5: Board Judgment on Epistemological Stance
        - The board must explicitly choose to either:
            a) Apply anti-reductionism: Then accept the claim as testimony-justified.
            b) Apply reductionism: Then reject the claim for lack of independent corroboration.
        - This step is necessary because the split reflects a fundamental philosophical disagreement that the procedure cannot settle.

  Step 6: Non-Factual Considerations
     - After Step 5, if the claim is accepted by either path, we then consider non-factual issues.
     - Ask: "Does the acceptance of p have implications that require weighing risks, values, or ethical considerations? (e.g., publishing p might cause harm, or p might be controversial in ways that are not about truth but about impact)"
        - If yes: Refer to board judgment (for values/risk tolerance). Note: This is independent of the truth of p.
        - If no: Then the claim is accepted and no further referral is needed.

  However, note that Step 6 is about the implications of publishing, not about the justification for p. The original question is about justification. But the advisor might want the procedure to also consider whether to publish even if justified, due to non-epistemic reasons. We'll include it as a final step.

  But the outcomes are about the claim: "accept as testimony-justified" (meaning we take p as true for the purposes of the journal) or reject (we don't take p as true) or refer (for non-factual reasons). Step 6 would lead to "refer" even if the claim is justified, because of non-factual concerns.

  Summary of the procedure:

  1. Identify the claim p. (Must be clear.)
  2. Check for internal inconsistency. (Reject if inconsistent.)
  3. Check that the source is appropriate and the testimony is sincere. (Reject if not.)
  4a. Anti-reductionist test: Is p within the domain (if known) and are there no immediate defeaters? (If no, reject. If yes, then...)
  4b. Reductionist test: Is there independent evidence for the speaker's reliability and access? (If yes, then we can accept without split. If no, then we have a split between the two paths.)
     - If both 4a and 4b pass: Accept and go to step 6.
     - If 4a passes and 4b fails: Go to step 5.
     - If 4a fails: Reject (and halt).
  5. Board judgment on epistemological stance: Choose anti-reductionism (accept) or reductionism (reject).
  6. Non-factual considerations: If the claim is accepted (either by step 4 or step 5), then check if there are non-factual reasons to not publish. If yes, refer to board for judgment on publication (but note that the claim is still accepted as justified). If no, then the claim is accepted and can be published.

  But note: The rejection in step 4b is only for the reductionist path. The procedure must not reject at step 4b when there's a split because we have step 5 to resolve the split.

  Therefore, we restructure the outcomes at step 4:

  After step 3, we have:
     Step 4a: Anti-reductionist test
        - If it fails: Reject and halt.
        - If it passes: Proceed to step 4b.

     Step 4b: Reductionist test
        - If it passes: Then we have a clear "Accept" (because both paths agree) -> then go to step 6.
        - If it fails: Then we have a split -> go to step 5.

  Step 5: For split cases, the board must choose between:
     Option A: Follow anti-reductionism -> then accept the claim and go to step 6.
     Option B: Follow reductionism -> then reject the claim and halt (no step 6 because we don't publish).

  Step 6: For accepted claims (either by step 4b or step 5), check non-factual implications:
     - If there are non-factual concerns: Refer to board for a judgment call on whether to publish despite these concerns (but the claim is still considered justified). The outcome is: "Accept as testimony-justified, but refer to board for publication decision due to non-factual concerns."
     - If no non-factual concerns: Then "Accept as testimony-justified and clear for publication."

  Now, we must apply this to two hard cases.

  Case 1: A claim based on a single expert's oral report of an unreplicable laboratory result.

     Step 1: p = the result of the unreplicable experiment (e.g., "Compound X showed property Y under conditions Z, which cannot be replicated due to unique circumstances").
     Step 2: Check internal consistency. Assume p is consistent. Proceed.
     Step 3: The source is an expert scientist (identified) and the report is an oral assertion. So, appropriate and sincere. Proceed.
     Step 4a (Anti-reductionist): 
          - Domain: The expert is a scientist in the relevant field? Yes (assume so). 
          - Are there immediate defeaters? We don't have any evidence that the expert is lying or mistaken. So, no defeaters. Pass.
     Step 4b (Reductionist): 
          - Is there independent evidence of the speaker's reliability and access? 
            Independent evidence would require non-testimonial reasons to believe this scientist is reliable and that they actually conducted the experiment and observed the result.
          - However, the experiment is unreplicable. The board does not have independent access to the experimental data. They have not observed this scientist's past reliability (unless they have prior experience with this scientist, which we assume they don't). Also, they cannot verify by replication.
          - Therefore, independent evidence is lacking. Reductionist test fails.

     So, we have a split: Step 4a passed, but step 4b failed. Proceed to step 5.

     Step 5: The board must choose between:
          - Anti-reductionism: Accept p as justified.
          - Reductionism: Reject p.

     This is the counterintuitive part? Actually, in many contexts, we accept expert testimony without independent verification. But reductionism would require independent evidence, which we don't have. So the anti-reductionist path permits acceptance but the reductionist path demands rejection.

     The procedure flags the split at step 4b.

     Then, the board might choose anti-reductionism (if they trust expert testimony in general) and accept, or choose reductionism and reject.

     Then, if they accept, they go to step 6.

     Step 6: Consider non-factual issues. For example, publishing an unreplicable result might be controversial and might mislead if it's wrong. But if the board accepts p as true, then they might still publish with a note about the nature of the evidence. This step is about non-factual concerns. If there are such concerns, refer to the board for a publication decision (but the claim is still accepted as justified).

  Case 2: A claim based on an anonymous historical document.

     Step 1: p = the historical claim made in the document (e.g., "Event A happened in year B").
     Step 2: Check internal consistency. Assume consistent. Proceed.
     Step 3: The source is an anonymous document. Is it contextually appropriate? It's a historical document, so it could be. But note: we don't know the author. However, the testimony is presented as a sincere assertion (we assume the document is intended as a historical record). So, we proceed.
     Step 4a (Anti-reductionist):
          - Domain: We don't know the author, so we cannot say if it's within their domain. However, anti-reductionism does not require knowing the author, only that there are no defeaters. 
          - Are there defeaters? We don't have any evidence that the document is a forgery or that the author was lying. But note: the anonymity might be a defeater? Not necessarily. If the document is widely circulated and accepted by historians, that might be a reason to think there are no defeaters. But we don't know that. The problem says "a widely circulated but anonymously authored historical document". So, circulation might be a factor? However, anti-reductionism typically doesn't require circulation. But if there is a known defeater (e.g., the document has been debunked) then we would reject. We assume no such defeater is known. So, pass?
          - But note: without knowing the author, we cannot assess domain. However, anti-reductionism does not require domain expertise, only that the assertion is made and there are no defeaters. So, we pass.
     Step 4b (Reductionist):
          - Independent evidence for the speaker's reliability and access? The speaker is anonymous, so we cannot gather independent evidence about their reliability. We have no information about the author. Therefore, we cannot satisfy the reductionist requirement. Fail.

     So again, we have a split: Step 4a passed (assuming no defeaters) but step 4b failed. Proceed to step 5.

     Step 5: Board must choose.

     However, note: the procedure in step 4a asks about "the kind of claim that is within the domain of the speaker's expertise (if known)". Since the speaker is not known, we cannot say. But the anti-reductionist test only requires that it is "not obviously outside any plausible domain". Since it's a historical claim and the document is presented as historical, it's plausible. And if there are no defeaters, then it passes.

     So, this case also goes to step 5.

  But note: the advisor wants one of the cases to yield a counterintuitive divergence. The first case (expert oral report) is more likely to be accepted by anti-reductionism and rejected by reductionism, which might be counterintuitive to some because we often trust experts without independent verification. The second case (anonymous document) might be seen as weaker, but the anti-reductionist path would accept it without knowing the author, which might also be counterintuitive.

  Now, what the procedure cannot settle:

  The procedure explicitly leaves to board judgment (in step 5) the choice between reductionism and anti-reductionism. Additionally, the procedure does not specify whether the speaker's social position, institutional authority, or demographic identity should enter the reductionist reliability calculation. This is a gap.

  We must mark that gap. In step 4b, we ask for independent evidence of reliability and access. What counts as independent evidence? The procedure does not specify what factors to consider. For example, if the board has independent evidence that the speaker is a member of a marginalized group and that might affect their credibility (either positively or negatively in a biased society), should that be considered? The procedure leaves that open because it is a value judgment about what factors are relevant to reliability.

  Therefore, we add a note:

     "Note: In step 4b, when assessing independent evidence for the speaker's reliability, the board must decide what factors are relevant. This includes whether social position, institutional authority, or demographic identity should be considered. The procedure does not specify how to weigh these factors; it is a value judgment that the board must make without procedural cover. Similarly, in step 4a, the board must decide what counts as a defeater, which may involve considering these same factors."

  Final Procedure:

  Testimonial Claim Evaluation Procedure:

  1. **Identify Claim**: Clearly state the claim (p) that the submission makes based on testimony.
     - _Stopping rule_: If p is unclear, return to author for clarification. Once clear, proceed.

  2. **Internal Consistency Check**: 
     - _Question_: Is p internally inconsistent or inconsistent with independently established claims in the submission?
     - _Sufficient answer_: No inconsistency found -> Proceed to step 3.
     - _Stopping rule_: If inconsistency is found -> Reject for lack of independent corroboration. HALT.

  3. **Source Appropriateness and Sincerity**:
     - _Question_: Is the source of the testimony identified and contextually appropriate for p? (e.g., an expert in the relevant field, or a document from the relevant historical period) And is the testimony presented as a sincere assertion?
     - _Sufficient answer_: Yes -> Proceed to step 4.
     - _Stopping rule_: If no -> Reject. HALT.

  4. **Epistemic Justification Tests**:
     - **Step 4a (Anti-reductionist Test)**:
          - _Question_: Is there any immediate evidence that the speaker is lying or mistaken about p (a defeater)? And is p the kind of claim that is at least plausibly within the domain of the speaker (if known) or not obviously outside any plausible domain?
          - _Sufficient answer_: No defeaters and p is plausible in domain -> Pass. Then proceed to step 4b.
          - _Stopping rule_: If defeaters exist or p is implausible given the source -> Reject. HALT.
     - **Step 4b (Reductionist Test)**:
          - _Question_: Is there independent evidence (non-testimonial, available to the board) that supports the speaker's reliability about claims like p and the speaker's access to the facts of p?
          - _Sufficient answer_: Yes -> Then both paths agree: Proceed to step 6 (Accept as testimony-justified, pending non-factual checks).
          - _Stopping rule_: If no independent evidence -> Then we have a split: Proceed to step 5.

     Note: Step 4b requires the board to use their own non-testimonial evidence (perception, memory, inference) about the speaker. The board must consider what factors to include in reliability (e.g., past accuracy, expertise, but also potentially social position, etc. — but note: this is a value judgment not settled by the procedure).

  5. **Board Judgment on Epistemological Stance** (Only if step 4b failed but step 4a passed):
     - _Question_: Should the board apply an anti-reductionist stance (accepting testimony without independent evidence) or a reductionist stance (requiring independent evidence)?
     - _Outcomes_:
          - If anti-reductionism is chosen: Proceed to step 6 (Accept as testimony-justified, pending non-factual checks).
          - If reductionism is chosen: Reject for lack of independent corroboration. HALT.
     - _Note_: This step requires the board to make a philosophical choice. The procedure does not dictate which stance to take.

  6. **Non-Factual Implications Check** (Only if claim is accepted by step 4b or step 5):
     - _Question_: Are there non-factual reasons (e.g., potential harm, ethical concerns, institutional values) that might warrant not publishing p even if it is testimony-justified?
     - _Sufficient answer_: No concerns -> Accept as testimony-justified and clear for publication.
     - _Stopping rule_: If concerns exist -> Refer to board for judgment on publication (with the note that the claim is considered justified). The outcome is: "Accept as testimony-justified, but publication decision requires board deliberation on non-factual grounds."

  Finally, we note that the procedure leaves open the issue of what factors to consider in step 4b (and step 4a for defeaters) regarding the speaker's identity, social position, etc. This is a value judgment the board must make explicitly.
answer: |-
  Below is a decision procedure for evaluating testimony-based claims in submissions, designed as a reusable checklist with explicit stopping rules. It preserves the logical distinction between reductionism and anti-reductionism while being accessible to non-specialists. The procedure is structured in sequential steps, with clear tests and outcomes. Divergence between reductionism and anti-reductionism is flagged at **Step 4**, where anti-reductionism may permit acceptance while reductionism demands rejection if independent evidence of reliability is lacking. 

  ---

  ### **Testimony Evaluation Procedure: Ordered Checklist**
  **Outcomes:**  
  - ✅ **Accept as testimony-justified** (claim is justified by testimony alone).  
  - ❌ **Reject for lack of independent corroboration** (claim fails reductionist standards).  
  - ⚠️ **Refer to board judgment** (non-factual/value-based decision required).  

  ---

  #### **Step 1: Clarify the Testimonial Claim**  
  - **Question:** What specific claim (p) does the submission assert based *solely* on testimony?  
  - **Sufficient Answer:** p is unambiguously stated (e.g., "Scientist X observed Y in an experiment," "Document Z reports event W").  
  - **Stopping Rule:** If p is unclear or conflated with non-testimonial evidence, halt and request revision.  
  - **Next:** Proceed to Step 2.  

  #### **Step 2: Check for Internal/Contextual Inconsistency**  
  - **Question:** Does p contradict itself, widely accepted facts, or non-testimonial evidence **within the submission**?  
  - **Sufficient Answer:** No contradictions (e.g., p aligns with basic logic, uncontested historical/scientific facts in the essay).  
  - **Stopping Rule:** If contradictions exist → ❌ Reject. Halt.  
  - **Next:** Proceed to Step 3.  

  #### **Step 3: Assess Testimonial Form**  
  - **Question:** Is the testimony a direct, sincere assertion (not satire, fiction, or metaphor)?  
  - **Sufficient Answer:** Yes (e.g., an expert’s oral report or historical document presented as factual).  
  - **Stopping Rule:** If testimony is non-serious (e.g., fictional dialogue) → ❌ Reject. Halt.  
  - **Next:** Proceed to Step 4.  

  #### **Step 4: Anti-Reductionist Check (Defeater Scan)**  
  - **Question:** Are there **red flags** indicating the speaker is untrustworthy or compromised *in this specific case*?  
    - *Focus:* Immediate, accessible evidence of lying, error, or bias (e.g., "The expert admitted to fraud," "The document is a known forgery").  
    - *Ignore:* General reliability, social status, or institutional authority.  
  - **Sufficient Answer:** No red flags → Proceed to Step 4a.  
  - **Stopping Rule:** If red flags exist → ❌ Reject. Halt.  
  - **Next:**  
    - ✅ **Anti-reductionist path permits acceptance** at this stage.  
    - Proceed to Step 4a for reductionist assessment.  

  #### **Step 4a: Reductionist Check (Reliability & Access)**  
  - **Question:** Is there **independent evidence** (non-testimonial) supporting the speaker’s:  
    - (a) *General reliability* (e.g., past accuracy, expertise verified by the board),  
    - (b) *Perceptual/experiential access* to p (e.g., proof the speaker witnessed the event)?  
  - **Sufficient Answer:** Yes (e.g., "We witnessed the expert’s prior accurate reports," "The document’s author was proven present at the event").  
  - **Stopping Rules:**  
    - If YES → ✅ Accept (both paths satisfied). Proceed to Step 5.  
    - If NO → ❌ Reject per reductionism. **Flag divergence:** Anti-reductionism permits acceptance here, but reductionism demands rejection. Proceed to Step 4b.  

  #### **Step 4b: Resolve Reductionism/Anti-Reductionism Split**  
  - **Question:** Should the board prioritize direct testimony (anti-reductionism) or require independent verification (reductionism)?  
  - **Outcome:**  
    - If anti-reductionism is chosen → ✅ Accept. Proceed to Step 5.  
    - If reductionism is chosen → ❌ Reject. Halt.  
  - **Stopping Rule:** This step ⚠️ **requires board judgment**. The procedure cannot resolve philosophical disagreements.  

  #### **Step 5: Non-Factual Risk/Value Assessment**  
  - **Question:** Would accepting p introduce significant ethical, political, or practical risks (e.g., harm, misinformation) even if testimony-justified?  
  - **Sufficient Answer:** No risks → ✅ Final accept.  
  - **Stopping Rule:** If risks exist → ⚠️ Refer to board judgment. Halt.  

  ---

  ### **Worked Applications**
  #### **Case 1: Expert’s Oral Report of an Unreplicable Experiment**  
  - **Claim (p):** "Scientist A observed rare phenomenon B in a one-time lab experiment."  
  - **Step 1:** p is clear.  
  - **Step 2:** No internal contradictions (e.g., p doesn’t violate known physics).  
  - **Step 3:** Testimony is a sincere oral report.  
  - **Step 4:** No defeaters (e.g., no evidence Scientist A lied). ✅ Anti-reductionism accepts here.  
  - **Step 4a:** No independent evidence of reliability/access (experiment is unreplicable; board has no prior interaction with A). ❌ Reductionism rejects.  
  - **Step 4b:** **Divergence flagged.** Board must choose:  
    - Anti-reductionism → ✅ Accept.  
    - Reductionism → ❌ Reject.  
  - **Outcome:** Board judgment required (Step 4b). *This is counterintuitive: Anti-reductionism accepts unreplicable testimony reductionism rejects, as independent evidence is lacking.*  

  #### **Case 2: Anonymous Historical Document**  
  - **Claim (p):** "Document X records that Event Y occurred in 1600."  
  - **Step 1:** p is clear.  
  - **Step 2:** No contradictions (e.g., Y aligns with historical timelines).  
  - **Step 3:** Document is presented as factual.  
  - **Step 4:** No defeaters (e.g., no proof Document X is forged). ✅ Anti-reductionism accepts here.  
  - **Step 4a:** No independent evidence of reliability/access (authorship/origin unknown). ❌ Reductionism rejects.  
  - **Step 4b:** **Divergence flagged.** Board must choose:  
    - Anti-reductionism → ✅ Accept.  
    - Reductionism → ❌ Reject.  
  - **Outcome:** Board judgment required (Step 4b).  

  ---

  ### **What the Procedure Cannot Settle**  
  1. **Step 4a (Reductionist Reliability Calculation):**  
     - The procedure **does not specify** whether the speaker’s social position, institutional authority, or demographic identity should be included in assessing reliability. For example:  
       - *Unresolved Question:* "Does a speaker’s marginalized identity (e.g., Indigenous oral historian) or institutional affiliation (e.g., corporate lab) strengthen or weaken their reliability?"  
     - **Gap:** This is a ⚠️ **value judgment** requiring board discussion. The procedure only checks for *objective evidence* of reliability (e.g., past accuracy), not socially contested factors.  
     - **Recommendation:** Explicitly debate these factors during Step 4a, recognizing they reflect the board’s values, not procedural logic.  

  2. **Step 4b (Philosophical Stance):**  
     - The procedure **cannot resolve** the reductionism/anti-reductionism debate. The board must decide its default stance (e.g., "We default to anti-reductionism for historical claims but reductionism for scientific claims").  

  3. **Step 5 (Risk Tolerance):**  
     - Non-factual risks (e.g., "Publishing this claim might offend community Z") are outside the procedure’s scope and require ⚠️ **board judgment**.  

  ---

  ### **Key Design Notes**  
  - **Efficiency:** Steps 1–4 require only yes/no answers and take ~5 minutes per claim.  
  - **Anti-Reductionism:** Justification hinges on absence of defeaters (Step 4), not positive evidence.  
  - **Reductionism:** Justification requires independent evidence (Step 4a), splitting paths if absent.  
  - **Accountability:** Value gaps (e.g., social position in Step 4a) are explicitly marked to avoid "hidden" bias.  
  - **Training:** Board members only need to understand "defeaters" (Step 4) and "independent evidence" (Step 4a), not epistemology.  

  This procedure ensures transparency in how testimony is evaluated while respecting the advisor’s epistemological framework.
