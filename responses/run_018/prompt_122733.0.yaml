prompt: |-
  I chair the assessment-accommodations committee at a mid-sized university, and I want to replace the improvisation we currently do with something we can actually run. We sit fortnightly and dispose of thirty to forty requests a term, fifteen minutes a case, and our formal question is narrow: may this student use this external resource during an invigilated closed-book exam in this paper. The people in the room are two rotating faculty members, a disability-services adviser, and a student representative; none of them has philosophy training, the decision has to be written down in language a student can appeal against, and the department that owns the exam has to be able to live with it. A colleague in the philosophy department suggested, after watching us argue about whether a laptop is different in kind from a set of notes, that the question we are really asking is whether the resource is, for this student, part of the mind that sits the exam or merely something that mind uses — and pointed me at the extended-mind literature and its central examples and objections: the man with the notebook, the parity principle, the complaint that mere causal coupling is not constitution, and the worry that on a loose reading of the view every gadget I rely on becomes part of me. I found the literature suggestive and unusable in equal measure. I do not want a summary of it; I want it turned into a procedure.

  What I need is an ordered set of questions my committee can put to a request, together with, for each question, what would count as a sufficient answer and what evidence a student can realistically be asked to produce for it — a clinician's letter, a short demonstration at the start of term, a usage log, a statement from a tutor. Build in the conditions that seem to matter and say how each is to be tested in fifteen minutes: whether the resource is reliably and immediately available to the student under exam-hall conditions rather than in principle; whether the student consults it automatically and trusts what it returns rather than checking it against something else each time; whether the information in it is the student's own in the relevant sense, or was generated by a tutor, a classmate, or software; whether the student endorses what it gives them or would disown it if challenged. Include explicit stop rules, distinguishing the failures that end the request there from the ones that merely count against it, and mark the points at which the question stops being one of fact about the student and becomes one about what the examination is supposed to be measuring, at which stage the procedure must hand the decision to the department that set the paper — and tell me how to frame that referral so the department does not simply answer by restating its own no-aids rule. I also need the conditions stated so they cannot be satisfied by arrangements made in the week before the exam. Please make sure the procedure handles a shared resource whose content was produced jointly or by someone else, a resource that performs operations the student cannot check or reproduce, a resource the student depends on but which is only intermittently available, and a student who could still do the work internally but for whom the external route is much less exhausting.

  Then run it, at length, on three cases in front of us now. First: a student with a degenerative visual condition who for six years has read and written everything through a screen reader and a refreshable braille display, and who wants the same setup for a three-hour papers exam. Second: a student requesting a single printed sheet of formulae and decision rules, compiled by their tutor, for a statistics exam whose rubric partly rewards knowing which test to apply to which design. Third: a student who wants to dictate answers into a phone and have a grammar tool restructure the sentences, having used that setup daily for two years, in a subject where written expression is itself a graded component. At least one of these, I suspect, will come out differently from how my committee would vote today, and I would rather be told so than flattered: give me the verdict the procedure yields in each case, tell me which of our reflexive approvals it refuses and which of our reflexive refusals it grants, and for whichever result we will resist, argue whether that is a defect in the procedure or a defect in our practice. Finally, state plainly what the procedure cannot do: where it must yield to our legal duties and to the department's authority over its own assessment, where it depends on a student's self-report that may be unreliable or strategic, and where no amount of procedure will settle whether unaided recall ought to be part of what a degree certifies.
reasoning: |-
  We are designing a procedure for the committee to decide on assessment accommodations, specifically whether an external resource can be used during a closed-book exam. The procedure must be based on the extended mind theory but adapted to be practical and legally sound.

  The key ideas from extended mind theory we'll use:
  1. The "parity principle": If a process in the world functions as a process that, were it done in the head, we would have no hesitation in accepting as part of the cognitive process, then it is part of the cognitive process.
  2. Conditions for extension: reliability, trust, automatic endorsement, and past coupling (so that it's not ad hoc).

  We need to break down the conditions and turn them into a set of ordered questions with clear criteria and evidence requirements.

  Procedure Outline:

  1. **Question 1: Is the resource necessary for the student to access the exam?** (This is about basic access, not cognitive extension. If yes, then it's an access issue and should be allowed without further extended mind considerations. If not, we proceed to the extended mind questions.)

  2. **Question 2: Is the resource reliably and immediately available under exam conditions?**
     - Criteria: The resource must be available at all times during the exam without interruption. It must function in the exam setting (e.g., no internet if the exam is offline, no noise if in a quiet hall).
     - Evidence: Logs of usage in similar conditions, technical specifications, demonstration in a mock exam. Must not be set up just for the exam; must be part of the student's regular academic work.
     - Stop rule: If the resource is not reliably available (e.g., requires internet but the exam hall has no Wi-Fi, or the student only started using it recently), the request fails at this point.

  3. **Question 3: Is the resource automatically consulted and trusted without verification?**
     - Criteria: The student uses the resource without conscious deliberation and without cross-checking the output (like we don't cross-check our memory). It must be a seamless part of the cognitive process.
     - Evidence: Clinician's or tutor's observation, self-report backed by usage logs, demonstration of typical use. Must show long-term integration (at least one full term of use).
     - Stop rule: If the student has to consciously decide to use it or verifies the output (e.g., by checking a book), then it fails as an extended mind and we move to Question 5 (departmental discretion).

  4. **Question 4: Is the information in the resource the student's own?**
     - Criteria: The content must have been generated by the student (or under the student's direct supervision and endorsement) and be consistent with the student's own knowledge. If the resource performs operations, the student must be able to understand and endorse the operations (even if not reproduce them step-by-step).
     - Evidence: History of the resource's creation (e.g., student's notes, logs of student input). For shared or tutor-generated content, we require evidence that the student has internalized and endorsed the content (e.g., by using it independently and correctly in assignments).
     - Stop rule: If the resource is generated by someone else and the student cannot demonstrate internalization (e.g., a tutor's crib sheet that the student hasn't personalized), then it fails as an extended mind and we move to Question 5.

  5. **Question 5: Does the resource alter the skills being assessed?**
     - At this point, the committee has determined that the resource does not meet the extended mind criteria (or does, but we need to check the assessment goals). We now hand over to the department that owns the exam. The question for the department is: "Would allowing this resource change the construct being assessed in a way that is incompatible with the learning outcomes of the course?" 
     - We frame the referral to avoid a simple restatement of the no-aids rule by asking the department to specifically address:
          a. Which learning outcomes would be compromised?
          b. Is unaided recall of the information or skill a necessary component of the assessment?
          c. Can the department propose an alternative accommodation that would not compromise the assessment?
     - The department must respond in writing within a set timeframe (e.g., one week).

  Additionally, we must have a rule that the resource must have been used for at least one full term (or equivalent) in the student's regular academic work to prevent last-minute arrangements.

  Now, let's structure the procedure as an ordered set of questions:

  **Procedure for Assessment Accommodations Committee**

  **Step 0: Pre-check**
  - The request must be submitted at least [X] weeks before the exam (to prevent last-minute setups). We require evidence of regular use for at least one full academic term (or equivalent) in the student's coursework and assessments.

  **Question 1: Access Necessity**
  - Is the resource necessary for the student to access the exam? (e.g., screen reader for a blind student, without which they couldn't take the exam at all)
    - Sufficient answer: Yes, the resource is required for basic sensory or motor access to the exam content.
    - Evidence: Clinician's letter, disability services assessment, history of use in academic settings.
    - Stop rule: If yes, the request is approved without further questions (but note: we still must ensure it doesn't alter the assessment construct, which may require departmental input if there's a concern. But typically, access tools are non-negotiable. However, if the access tool also provides cognitive enhancement, we may need to separate the access function from the enhancement. This is complex. We might handle by allowing the access function and then separately considering any cognitive enhancement aspect.)

  **Question 2: Reliability and Availability**
  - Is the resource reliably and immediately available to the student under exam-hall conditions?
    - Sufficient answer: The resource functions in the exam setting without interruption and without requiring external support (e.g., no internet, no human help, no interference with others).
    - Evidence: Technical specifications, usage logs in exam-like conditions (e.g., in a library or previous exams), a successful demonstration in a controlled environment.
    - Stop rule: If no, the request is denied because it cannot be implemented in the exam setting. (But note: if it's an access necessity, we might work to provide a reliable version. So if Step 1 was yes, we don't deny but work to ensure reliability. Therefore, we might split: if Step 1 was yes, we require the committee to ensure reliability by arranging suitable conditions. If Step 1 was no, and Step 2 fails, then denial.)

  **Question 3: Automaticity and Trust**
  - Does the student consult the resource automatically and trust its output without verification?
    - Sufficient answer: The student uses the resource as a seamless part of their cognitive process, without conscious effort to access, and without cross-checking the output.
    - Evidence: Observation by a tutor or clinician, self-report with usage logs, demonstration of use in a task (e.g., during a tutorial). Must show habitual use over at least one term.
    - Stop rule: If no, then the resource is a tool the student uses, not part of their cognitive system. We proceed to Question 5 (departmental discretion).

  **Question 4: Endorsement and Ownership**
  - Does the student endorse the content of the resource as their own, and is the content generated by the student (or under their direct control and consistent with their knowledge)?
    - Sufficient answer: The content is created by the student or has been internalized and endorsed by the student. For operational resources (like a calculator), the student must understand and endorse the operations (even if they can't perform them unaided).
    - Evidence: History of resource creation (e.g., student's own notes, logs of student input). For shared or externally generated content, evidence of internalization (e.g., the student can explain the content without the resource, or has used it correctly in independent work).
    - Stop rule: If no, then the resource is not an extension of the student's mind. We proceed to Question 5.

  **Question 5: Assessment Construct**
  - If the resource does not meet the extended mind criteria (i.e., failed at Step 3 or 4) but the student still requests it, or if it meets the criteria but there is a concern about what the exam is testing, we refer to the department:
    - Referral question: "Given that the resource [describe] is [part of the student's cognitive system / a tool the student uses], would allowing it in the exam compromise the specific learning outcomes that this exam is designed to assess? Please specify which outcomes and why. If so, can the department propose an alternative accommodation that would allow the student to demonstrate their learning without compromising the assessment?"
    - The committee must wait for the department's response. The department must not simply restate the no-aids rule but must engage with the specific learning outcomes.

  **Special Cases:**
  - Shared resource: For Question 4, if the resource was produced jointly, we require that the student can demonstrate personal endorsement and understanding of the shared content (e.g., by being able to explain it independently).
  - Resource that performs operations: The student must be able to explain what the operations do and why they are correct (even if they can't do the operations by hand) and must endorse the results without verification.
  - Intermittently available resource: Fails at Question 2 (unless the intermittency is due to exam conditions and can be fixed, e.g., by providing a backup).
  - Student who could do the work internally but uses the external route to reduce exhaustion: This is tricky. If the resource meets the extended mind criteria (automatic, trusted, etc.), then it is part of their cognitive system and should be allowed. But if the exam is designed to test unaided performance (e.g., speed or stamina), then we must go to Question 5.

  Now, we run the procedure on the three cases:

  **Case 1: Student with degenerative visual condition requesting a screen reader and refreshable braille display for a three-hour exam.**

  - Step 0: The student has used this setup for six years. Evidence: disability services records, clinician's letter, academic history.
  - Question 1: Access Necessity? Yes, without these, the student cannot read the exam or write answers. So we approve for access. However, note that the screen reader and braille display are access tools. They do not provide additional cognitive content (unless the student has stored notes in the device, which they are not requesting). The request is for the same setup they use for all reading and writing. Therefore, we don't need to go to extended mind questions because it's an access issue. But to be thorough, let's check.
  - Question 2: Reliability? Yes, it's been used in exams before. The committee must ensure the exam hall can support the setup (e.g., power, quiet room if the screen reader is audible).
  - Since it's an access necessity, we do not require the extended mind criteria. However, if there were concerns about the device storing notes, we would need to ensure that it is only used as an access device (e.g., in a mode that doesn't allow accessing stored files). The request is for reading the exam and writing answers, so it's approved.

  **Verdict: Approved without conditions (as access necessity).**

  **Case 2: Student requesting a printed sheet of formulae and decision rules compiled by their tutor for a statistics exam.**

  - Step 0: We require evidence of regular use for at least one term. Let's assume the student has been using this sheet in assignments and tutorials for the term. Evidence: tutor's statement, assignment submissions showing the same sheet was used.
  - Question 1: Access Necessity? No, the student can see and write without it. Proceed.
  - Question 2: Reliability? Yes, a printed sheet is reliable in an exam.
  - Question 3: Automaticity and Trust? The student likely consults the sheet when needed, not automatically. They might look up a formula when stuck. It's not automatic like a memory. Moreover, they may check the sheet against their understanding. So probably no. But let's see: if the student has internalized the sheet to the point that they use it without thinking, but then why do they need it? It's more likely a reference. Evidence: tutor observes that the student uses it as a reference. So, fails Question 3.
  - Question 4: Ownership? The sheet was compiled by the tutor, not by the student. The student may have internalized it? We require evidence of internalization: can the student explain the formulae and rules without the sheet? If not, then it's not endorsed as their own. If they can, then why do they need it? The exam partly rewards knowing which test to apply. If the student cannot recall which test to apply without the sheet, then they haven't internalized that knowledge. So, likely fails Question 4.
  - Now, we go to Question 5: Refer to the department. We ask: "Allowing this sheet would provide the student with the formulae and decision rules. The committee has found that the student uses the sheet as a reference and it is not an extended part of their cognition. Would allowing this sheet compromise the learning outcomes? Specifically, is unaided recall of the formulae and decision rules a necessary part of the assessment? If so, can the department propose an alternative (e.g., a reduced set of formulae, or a separate accommodation)?"

  **Verdict: Refer to department. The committee would likely have reflexively refused this, but the procedure doesn't refuse it outright; it passes the buck to the department to justify if unaided recall is essential.**

  **Case 3: Student wanting to dictate answers into a phone and have a grammar tool restructure the sentences, used daily for two years.**

  - Step 0: Two years of daily use. Evidence: usage logs, assignments submitted using this method, tutor's statement.
  - Question 1: Access Necessity? The student might have a disability that makes writing difficult (e.g., dysgraphia, physical impairment). If so, then dictation is an access tool. But the grammar tool is not. We must separate: the dictation might be for access, but the grammar tool is for enhancing written expression. So:
    - Dictation: if the student cannot write by hand or type, then access necessity. Otherwise, not.
    - Grammar tool: not an access tool. So we proceed for the grammar tool.
  - Assume the student has a disability that makes writing by hand or typing difficult, so dictation is approved for access. But the grammar tool is a separate request.
  - For the grammar tool:
    - Question 1: Access Necessity? No, the student could write without it (though with difficulty in expression). So no.
    - Question 2: Reliability? The phone must be in airplane mode, and the grammar tool must work offline. If yes, then reliable. Evidence: demonstration.
    - Question 3: Automaticity and Trust? The student uses it daily and trusts the suggestions automatically? Or do they review and edit? If they use it without verifying (i.e., accept the restructured sentences without checking), then yes. Evidence: screen recordings or logs showing minimal edits after grammar suggestion. If they accept most changes without thought, then automatic. If they deliberate, then no. We need evidence. Let's assume the student automatically accepts the changes because they trust the tool and have used it for two years.
    - Question 4: Ownership? The grammar tool restructures the sentences. The student must endorse the output as their own. Evidence: the student reviews the final text and signs off on it. But the restructuring is done by software. The student must be able to explain the changes and endorse them. If the student cannot explain why the grammar tool made a change, then they are not endorsing it as their own. We need evidence of the student's ability to understand and approve the changes. If the student can demonstrate that they would make the same changes (or approve them) if they had the time and energy, then it might pass. But if they don't understand the changes, then it fails.
  - Given that written expression is a graded component, we must be cautious. If the student cannot function without the tool and cannot produce grammatically correct sentences without it, then the tool is doing the work. But the extended mind theory would say it's part of their cognitive system. However, if the exam is testing the student's ability to structure sentences, then the tool may be doing the very thing being assessed.

  - Given the above, it might fail Question 4 if the student cannot endorse the changes (i.e., explain and agree with them). But if they can, then it passes. However, we then have to consider the assessment construct.

  - Alternatively, we might go to Question 5 anyway because the tool is performing the skill being assessed (written expression). So even if it passes the extended mind criteria, we must ask the department if they are measuring the student's own sentence structuring or the ability to use a tool.

  **Verdict for grammar tool:**
  - If the student can demonstrate endorsement (e.g., in a viva, they can explain the changes the tool made and why they are correct), then the committee might approve it as extended mind. But then we must refer to the department because the exam grades written expression. The department must decide if the use of the tool is consistent with the learning outcomes. If the outcome is "produce well-structured sentences" and the tool helps achieve that, then it might be acceptable. But if the outcome is "demonstrate the ability to structure sentences without aid", then it's not.

  **Committee's Reflexive Responses:**
  - Case 1: Reflexively approved. The procedure approves it too. No issue.
  - Case 2: Reflexively refused. The procedure doesn't refuse but sends to the department. This might be a change: the committee might have to allow it if the department says it's okay, or the department might refuse and provide a reason related to learning outcomes.
  - Case 3: The committee might reflexively refuse the grammar tool because it's "doing the work for the student". The procedure might approve it if the extended mind criteria are met, but then the department might refuse because it changes the construct. So the procedure could lead to a different outcome.

  **Defect in Procedure or Practice?**
  - For Case 2, if the committee reflexively refuses, but the procedure sends it to the department, that might be an improvement. The department might decide that knowing which test to apply is essential and refuse, but they might also realize that in real life statisticians use references and so adjust the exam. The procedure forces a more nuanced discussion.
  - For Case 3, if the committee refuses the grammar tool but the procedure (and department) approves it, then the committee's practice was too rigid. If the procedure leads to refusal because the department says written expression without aids is essential, then the committee's reflexive refusal was correct but for the wrong reason.

  **Limitations of the Procedure:**
  1. **Legal duties:** The procedure must yield to legal requirements (e.g., under disability laws). If a resource is a legally mandated accommodation, we must allow it even if it doesn't meet the extended mind criteria.
  2. **Departmental authority:** The department has the final say on what their exam measures. The procedure can only ask them to reconsider, not override.
  3. **Student self-report:** Some evidence (like automaticity) may rely on self-report, which can be unreliable or strategic. We use multiple sources (tutor observation, logs) to mitigate.
  4. **Fundamental educational values:** The procedure cannot resolve whether unaided recall should be part of a degree. That is a matter for the university's educational philosophy.

  **Final Procedure Design:**

  We'll write the procedure as a flowchart with explicit questions and stop rules. But in text:

  1. **Access Necessity:** If the resource is necessary for the student to access the exam (e.g., to read, write, or otherwise interact with the exam), then approve. [Evidence: disability documentation, history of use.] 
     - However, if the resource also provides cognitive content beyond access (e.g., stored notes in a device used for access), then we must disable the non-access features or consider them separately.

  2. **Reliability:** Can the resource be used reliably in the exam setting? [Evidence: technical demo, logs.] 
     - If no, deny (unless it's an access necessity, in which case we must make it reliable).

  3. **Automaticity and Trust:** Is the resource used automatically and without verification? [Evidence: observation, logs, demonstration.] 
     - If no, go to step 5.

  4. **Endorsement and Ownership:** Does the student endorse the resource's content/output as their own? [Evidence: creation history, internalization demonstrated in viva or assignments.] 
     - If no, go to step 5.

  5. **Departmental Referral:** Ask the department: "Would allowing this resource compromise the specific learning outcomes of this exam? If so, which ones, and can you propose an alternative?"

  **Preventing Last-Minute Setups:** Require evidence of use for at least one full academic term (or equivalent) in the student's regular academic work.

  We hope this procedure brings clarity and fairness.
answer: |-
  Below is a structured, step-by-step procedure for your committee, designed to transform insights from extended-mind theory into a practical, evidence-based decision-making tool. The procedure prioritizes **reliability, automaticity, endorsement, and ownership** to determine if a resource is "part of the student's mind" under exam conditions, while respecting departmental authority over assessment constructs. It includes stop rules, evidence requirements, and safeguards against last-minute accommodations. The procedure is built for 15-minute case reviews and handles edge cases (e.g., shared resources, operational tools, intermittent availability, and exhaustion mitigation).

  ---

  ### **Procedure: Extended Mind Assessment for Exam Accommodations**
  **Formal Question:** *"May this student use this external resource during an invigilated closed-book exam in this paper, as an extension of their cognitive process?"*  
  **Time Allocation:** 15 minutes per case, structured as a 5-step checklist.  
  **Key Principles:**  
  - **No Last-Minute Arrangements:** Resource must be used for ≥1 academic term (evidenced).  
  - **Stop Rules:** Hard failures (denial) vs. soft failures (refer to department).  
  - **Department Referral:** Framed to avoid circular "no-aids" responses.  
  - **Evidence Standards:** Balance rigor with practicality (clinician letters, logs, demonstrations).  

  #### **Step 1: Access Necessity (Basic Functionality)**  
  **Question:** *Is the resource strictly necessary for the student to physically or sensorily access the exam (e.g., reading, writing, or interacting with questions)?*  
  - **Sufficient Answer:** Yes, if the student cannot attempt the exam without it (e.g., blindness requiring a screen reader).  
  - **Evidence Required:** Clinician's letter or disability-services report confirming the disability and the resource's role. No student self-report alone.  
  - **Stop Rule:**  
    - **Approve immediately** if "yes." Proceed to Step 2 only if concerns about cognitive enhancement (e.g., the device stores notes).  
    - **Deny immediately** if "no" and the resource is purely cognitive (e.g., formula sheet).  

  #### **Step 2: Reliability and Availability (Exam-Hall Viability)**  
  **Question:** *Is the resource consistently, immediately, and independently available to the student under actual exam conditions (e.g., no Wi-Fi, time pressure, noise)?*  
  - **Sufficient Answer:** Yes, if the resource works offline, without external aid, and has been used reliably in similar high-pressure settings.  
  - **Evidence Required:**  
    - Usage logs (e.g., timestamps from coursework) or invigilator reports from past exams.  
    - Short demonstration (recorded at start of term) in a simulated exam setting.  
  - **Stop Rule:**  
    - **Deny immediately** if:  
      - Resource fails in exam-like conditions (e.g., intermittent tool).  
      - Setup was initiated <1 term ago (prevent last-minute use).  
    - **Proceed** if reliable.  

  #### **Step 3: Automaticity and Trust (Parity Principle)**  
  **Question:** *Does the student use the resource automatically (without deliberation) and trust its output without verification (e.g., as one trusts memory)?*  
  - **Sufficient Answer:** Yes, if usage is habitual, intuitive, and error-checking is rare/exceptional.  
  - **Evidence Required:**  
    - Tutor/clinical observation report (e.g., "Student consults resource reflexively").  
    - Usage logs showing pattern (e.g., grammar tool used in 90% of writing sessions without edits).  
    - Student demonstration (e.g., solve a sample problem using the resource while describing their thought process aloud).  
  - **Stop Rule:**  
    - **Soft failure (proceed to Step 5)** if:  
      - Student consciously decides when to use it or cross-checks output (e.g., "I check formulae against my notes").  
      - Trust is conditional (e.g., "I verify grammar suggestions").  
    - **Proceed** if automatic/trusted.  

  #### **Step 4: Endorsement and Ownership (Constitution, Not Coupling)**  
  **Question:** *Does the student endorse the resource's content/output as their own, and was it generated or internalized by them?*  
  - **Sufficient Answer:** Yes, if:  
    - Content is self-created (e.g., personal notes) OR jointly created but the student can reproduce/explain it unaided.  
    - For operational tools (e.g., calculator), the student understands and would defend the logic of the output.  
  - **Evidence Required:**  
    - Creation history (e.g., draft versions showing student input).  
    - Viva or short oral exam (at start of term) where the student explains the resource without it.  
    - For shared/tutor-generated resources: Tutor statement confirming student internalization (e.g., "Student can derive formulae without the sheet").  
  - **Stop Rule:**  
    - **Deny immediately** if:  
      - Content is externally generated and not internalized (e.g., tutor's sheet the student cannot explain).  
      - Resource performs operations the student cannot defend (e.g., "I don’t know how the grammar tool works").  
    - **Proceed** if owned/endorsed.  

  #### **Step 5: Assessment Construct (Departmental Referral)**  
  **Trigger:** Soft failure at Step 3 or Step 4, OR if all prior steps pass but the resource may alter graded skills.  
  **Question for Department:** *"Would allowing this resource fundamentally change what this exam measures? Specifically, does it conflict with a learning outcome that requires unaided recall or execution?"*  
  - **Framing to Prevent "No-Aids" Deflection:**  
    - Require the department to:  
      1. **Identify specific learning outcomes** affected (e.g., "This exam measures recall of formulae under time pressure").  
      2. **Propose alternatives** (e.g., open-book design, compensatory tasks).  
      3. **Justify why unaided performance is essential** to certification.  
    - Example script: *"The committee finds the resource [meets/fails] extended-mind criteria. We seek your input on whether its use would compromise the exam’s core objectives. Please specify which outcomes would be impacted and suggest alternatives that uphold them."*  
  - **Stop Rule:**  
    - **Approve** if the department confirms no conflict.  
    - **Deny** if the department identifies a conflict and provides a valid alternative or justification.  

  ---

  ### **Application to Current Cases**
  **Assumptions:**  
  - Evidence meets all duration requirements (≥1 term of use).  
  - Committee adheres strictly to procedure.  
  - "Reflexive" outcomes based on typical committee biases: Approve Case 1, deny Cases 2 and 3.  

  #### **Case 1: Degenerative Visual Condition (Screen Reader + Braille Display)**  
  - **Step 1 (Access Necessity):** **Approve immediately.** Resource is sensory-access focused. Clinician's letter confirms necessity.  
  - *Stop here.* No need for extended-mind analysis.  
  - **Verdict:** Approved.  
  - **Reflexive Comparison:** Matches committee approval.  

  #### **Case 2: Printed Formulae/Decision Rules Sheet (Tutor-Compiled)**  
  - **Step 1:** Not access-based → Proceed.  
  - **Step 2:** Reliable (printed sheet) → Proceed.  
  - **Step 3 (Automaticity/Trust):** **Soft failure.** Student likely deliberates when to consult sheet (e.g., "I check it when unsure"). Evidence: Tutor notes student uses it as reference, not automatically.  
  - **Step 4 (Ownership):** **Deny immediately.** Sheet is tutor-generated; student cannot reproduce rules unaided (exam rewards "knowing which test to apply"). Evidence: Viva shows student struggles without sheet.  
  - **Verdict:** Denied.  
  - **Reflexive Comparison:** Matches committee denial. **But** procedure stops at Step 4 (ownership), avoiding arbitrary "laptop vs. notes" debates.  

  #### **Case 3: Dictation + Grammar Tool (Daily Use for 2 Years)**  
  - **Step 1:** Dictation may be access necessity (if motor disability) → Approve dictation. Grammar tool is cognitive → Proceed to Step 2.  
  - **Step 2:** Reliable (offline phone) → Proceed.  
  - **Step 3 (Automaticity/Trust):** **Soft failure.** Student likely reviews grammar changes (e.g., "I tweak suggestions"). Evidence: Usage logs show 40% edit rate after tool use.  
  - **Step 5 (Assessment Construct):** Refer to department. **Department must answer:** "Does grammar tool usage conflict with 'written expression' as a graded component? If yes, propose alternatives (e.g., separate assessment of grammar skills)."  
    - *Likely department response:* "Unaided sentence structuring is core to this exam; tool alters construct. Alternative: Allow dictation but not grammar tool."  
  - **Verdict:** Grammar tool denied (dictation approved).  
  - **Reflexive Comparison:** Committee would reflexively deny entire request. Procedure saves dictation as access necessity but denies grammar tool via departmental referral.  
  - **Defect Analysis:** Committee's reflexive denial of dictation + tool is a **defect in practice**. Procedure separates access from cognition, protecting access needs while involving the department on contested cognitive aids.  

  ---

  ### **Where the Procedure Yields or Falters**  
  1. **Legal Duties Override:** The procedure defers to disability law (e.g., ADA, Equality Act). If a resource is legally mandated for access (Case 1), Steps 2–5 are irrelevant.  
  2. **Departmental Authority:** Final say on assessment constructs (Step 5) is non-negotiable. The procedure cannot force a department to accept a resource, but it demands reasoned justification.  
  3. **Unreliable Self-Report:** Evidence requirements (logs, demonstrations, third-party observation) mitigate strategic student claims. But if evidence is ambiguous (e.g., student "demonstrates" automaticity unconvincingly), committee judgement is needed.  
  4. **Philosophical Limits:** The procedure **cannot resolve** whether unaided recall should be a degree requirement. Step 5 delegates this to departments, as it is an educational-values question.  
  5. **Edge Cases Addressed:**  
     - **Shared resource:** Step 4 requires student to internalize/explain content alone.  
     - **Operational tool (e.g., grammar tool):** Step 4 demands student endorsement/understanding of operations.  
     - **Intermittent resource:** Step 2 denies immediately.  
     - **Exhaustion mitigation:** Only considered if Steps 2–4 pass (e.g., extended mind allows efficiency).  

  ---

  ### **Outcome Summary**  
  | Case       | Committee Reflexive | Procedure Verdict      | Difference                          | Defect In |  
  |------------|---------------------|------------------------|-------------------------------------|-----------|  
  | 1 (Blind)  | Approve             | Approve (Step 1)       | None                                | N/A       |  
  | 2 (Sheet)  | Deny                | Deny (Step 4)          | None, but principled halt           | None      |  
  | 3 (Grammar)| Deny entirely       | Dictation: Approve (Step 1)<br>Grammar: Deny (Step 5) | Saves access tool; denies cognitive aid | Committee practice: Overbroad denial |  

  **For Case 3:** Your committee would likely resist approving dictation while denying the grammar tool, viewing both as "aids." This is a **defect in practice**—failing to distinguish access from cognition. The procedure corrects this by isolating access needs (always approved) from cognitive extensions (subject to tests + departmental authority).  

  **Recommendation:** Pilot this procedure for one term. It will:  
  - Reduce arbitrary debates by using stop rules and evidence.  
  - Force departments to engage thoughtfully (via Step 5 referrals).  
  - Align accommodations with how minds actually work (per extended-mind theory).  
  - Ensure fairness for students who rely on external resources legitimately.  

  Finally, document where the procedure feels inadequate (e.g., ambiguous evidence). Refine it annually with philosopher input to balance theory with pragmatism.
