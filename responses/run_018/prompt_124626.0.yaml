  Okay, I need to tackle this query about the IOC's host city selection process in 2013, using the Gibbard-Satterthwaite theorem. The user wants a bidirectional analysis—applying the theorem to the Tokyo-Madrid-Istanbul vote and examining where the theory strains. They also want broader insights on institutional design. 

  First, mapping the theorem: The player set is ~100 IOC members minus bidding-nation reps. Preference orders likely involved regional blocs (Asian solidarity for Tokyo, Euro-Latin bloc for Madrid), risk perceptions (Istanbul's political instability, Madrid's austerity), and strategic considerations. Key question: Could Madrid supporters have manipulated Round 1 to avoid the tie-break? Theoretically yes—if some Madrid-first voters insincerely ranked Istanbul last, they might have pushed Istanbul below 26 votes, eliminating it outright and forcing a Tokyo-Madrid final where Madrid might perform better. But this was risky: underestimating Istanbul's support could backfire if others didn't reciprocate. 

  The procedural escape clause is tricky. Technically, each round restricts the range to two alternatives (Round 1: all three but runoff resolves ties; Round 2: Tokyo vs Istanbul). But the multi-round structure creates cross-round incentives—Round 1 votes aren't isolated, they set up the Round 2 matchup. This preserved a three-alternative strategic environment: voting in Round 1 wasn't just about preferences, it was about engineering a favorable opponent for your candidate in the next round. 

  On institutional design: The IOC case shows range restriction via sequential elimination doesn't eliminate manipulation—it just displaces it. The tie-break runoff and anticipatory voting (e.g., Madrid supporters debating whether to sink Istanbul in Round 1) become new manipulation vectors. Strategy-proofness seems unattainable here; complexity obscures rather than prevents gaming. The theorem explains why manipulation opportunities persist despite procedural safeguards but is silent on how institutional culture (e.g., IOC's norm-bound voting) might dampen incentives. 

  Ultimately, the episode confirms manipulation can't be fully eradicated—only contained through careful runoff design and transparency. But well-structured range restriction does reduce opportunities compared to a single-round vote.
answer: |-
  ### Mapping Gibbard-Satterthwaite to the 2013 IOC Vote  
  **Player Set & Preferences:**  
  - **Players:** ~100 IOC members (excluding Japan, Spain, Turkey). Preferences clustered into:  
    - **Regional blocs:** Asian members favoring Tokyo; European/Latin American cohesion for Madrid; Istanbul drawing Islamic/emerging-economy support.  
    - **Risk aversion:** Concerns over Istanbul’s political instability (Syrian war spillover) and Madrid’s austerity-driven fiscal uncertainty made Tokyo a "safe" compromise.  
    - **Strategic coalitions:** Anti-Tokyo voters split between Madrid/Istanbul, creating a Condorcet cycle (Tokyo > Madrid, Madrid > Istanbul, Istanbul > Tokyo for some blocs).  

  **Strategic Options & Manipulation Potential:**  
  - **Madrid supporters’ dilemma in Round 1:** With Madrid and Istanbul tied at 26, Madrid faced elimination in the tie-break runoff. Supporters could manipulate by:  
    - **Insincerely ranking Istanbul last** to depress its vote count below 26, avoiding a tie-break and forcing a direct Tokyo-Istanbul runoff. If Istanbul fell to 25 votes, Madrid survives to Round 2 against Tokyo.  
    - **Why this might succeed:** If Madrid backers believed Istanbul was stronger against Tokyo (as Round 2 showed: Istanbul won 36 votes to Madrid’s hypothetical 26), eliminating Istanbul early could help Madrid win in Round 2 by inheriting anti-Tokyo votes.  
    - **Risk:** Over-depressing Istanbul’s vote might accidentally eliminate Madrid if others defected.  

  **Round 2 Dynamics:**  
  - Once Madrid was eliminated, its supporters faced no strategic choice: sincere voting for Istanbul or Tokyo was dominant. Tokyo’s landslide (60–36) suggests Madrid’s backers split asymmetrically, with most preferring Tokyo over Istanbul due to risk perceptions.  

  ### Straining the Theoretical Frame: Procedural Complexity vs. Manipulation  
  **Range Restriction "Escape Clause" – Superficial Compliance:**  
  - **Each round restricts the range to two *effective* alternatives:**  
    - Round 1: Three candidates, but the tie-break runoff acts as a *sub-procedure* to reduce the field to two.  
    - Round 2: Binary choice between Tokyo and Istanbul.  
  - **Gibbard-Satterthwaite satisfied *technically*:** The final outcome is selected from a sequence of binary decisions, circumventing the theorem’s three-alternative requirement.  

  **Manipulation Merely Displaced, Not Eliminated:**  
  1. **Tie-break runoff as a manipulation vector:** The Madrid-Istanbul runoff (49–45) became a focal point for strategic lobbying. Members could trade support or misrepresent intensity to influence which rival faced Tokyo.  
  2. **Anticipatory voting in Round 1:** Voters considered Round 2 implications. Pro-Madrid voters might insincerely boost Istanbul (*if* they believed Istanbul was weaker against Tokyo) to ensure Madrid advanced. Conversely, Tokyo supporters might subtly boost *weaker* opponents (e.g., Madrid) to engineer a favorable matchup.  
  3. **Cross-round incentives:** The three-alternative strategic environment persisted because Round 1 votes determined *which* binary contest would occur. Preferences were not separable across rounds.  

  ### Practical Force of Gibbard-Satterthwaite: Institutional Design Implications  
  **What the Theorem Explains:**  
  - **Inevitability of manipulability in multi-round voting:** The IOC procedure cannot be strategy-proof. Madrid’s supporters *could* have manipulated Round 1 to alter the runoff pairing, and Tokyo’s backers might have incentives to misrepresent preferences to face a weaker opponent.  
  - **Range restriction as containment, not cure:** Sequential elimination *reduces* manipulation opportunities by limiting choices per round but cannot eradicate them. The tie-break runoff introduced a new manipulable decision node.  

  **Where the Theorem Is Silent:**  
  - **Behavioral constraints:** Norms against overt lobbying, peer monitoring, and cultural aversion to "betrayal" may suppress manipulation (e.g., Madrid supporters accepting the runoff loss rather than gaming Round 1).  
  - **Risk dominance:** Uncertainty about others’ preferences (e.g., "Will Istanbul really be eliminated if I defect?") makes manipulation risky, favoring sincere voting.  

  **Institutional Design Lessons:**  
  1. **Complexity obscures, not immunizes:** Exhaustive ballots and tie-breakers create multiple layers where manipulation can hide (e.g., in runoff lobbying or anticipatory voting) but offer plausible deniability.  
  2. **Trade-off between expressiveness and vulnerability:** The IOC’s system allows nuanced preference expression but sacrifices strategy-proofness. Simpler systems (e.g., single-round plurality) are more manipulable but transparent.  
  3. **Containment via sequential narrowing:** Restricting the range to two alternatives *at each stage* minimizes but does not eliminate manipulation. The 2013 vote shows this worked *procedurally* (Tokyo won decisively) but *strategically* (Madrid’s elimination could have been altered by insincere voting).  

  **Conclusion:** The episode confirms Gibbard-Satterthwaite’s core insight: any non-dictatorial choice among ≥3 options is vulnerable to manipulation. The IOC’s procedural complexity *contains* this vulnerability by decomposing the decision into binary phases but *displaces* manipulation into tie-breaks and anticipatory strategies. Well-structured range restriction reduces opportunities for gaming but cannot eliminate them—thus, manipulation remains inevitable in all real-world implementations short of a dictator. The IOC case illustrates that institutional designers must accept manipulability as a trade-off for legitimacy and inclusivity.
