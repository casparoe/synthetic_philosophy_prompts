answer: |-
  ### Teaching Plan: Problem of Old Evidence in Bayesian Confirmation Theory

  **Total Time:** 90 minutes  
  **Target Audience:** Philosophy graduate students with logic training but no prior epistemology.  
  **Core Goal:** Demonstrate that the problem is a **structural feature of conditionalization**, not a historical quirk.

  ---

  #### **I. Introduction: Intuitive Idea of Predictive Success (15 min)**
  - **Hook:** Start with an everyday scenario:  
    *"You’re a detective. A crime occurs, and you already know the victim was poisoned (evidence E). Later, a suspect’s alibi (theory T) is proposed, perfectly explaining E. Does E support T, even though you knew E beforehand?"*  
    Elicit intuitions: Students typically say *yes*—explanatory success feels confirmatory.
  - **Key Point:**  
    Highlight the tension: Predictive success (novel predictions) feels confirmatory, but so does *accommodating* old evidence. Yet Bayesianism seems to reject the latter.  
  - **Why First?**  
    Ground the seminar in pre-theoretical judgment. Without this, Bayes’ theorem feels arbitrary. Students must *feel* the problem before formalizing it.

  ---

  #### **II. Central Scenario: "The Genetic Disease Model" (20 min)**
  - **Scenario:**  
    - A disease affects 1% of a population.  
    - **Prior Knowledge:** Dataset shows 60% of patients have symptom S (E).  
    - **New Theory T:** A genetic model claiming "Gene G causes both the disease and symptom S."  
      - T is *not* parameterized to fit E (e.g., Gene G’s mechanism is derived from cellular biology, not S-prevalence).  
      - T entails E: If T is true, disease patients *must* exhibit S at 60%.  
  - **Why This Scenario?**  
    - Non-scientific (avoids Mercury perihelion).  
    - E is known *before* T is formulated.  
    - T’s entailment of E is discovered *later* (logical deduction from T’s axioms).  
    - Structural tension: E is "old," but T’s explanatory power feels confirmatory.

  ---

  #### **III. Formal Setup: Bayes’ Theorem (Ratio Form) (15 min)**
  - **Introduce Ratio Form:** \( P(T|E) = \frac{P(E|T) \cdot P(T)}{P(E)} \)  
    - Emphasize: \( P(E|T) \) = likelihood, \( P(E) \) = marginal probability of E.  
  - **Apply to Scenario:**  
    - Since E is known, \( P(E) = 1 \).  
    - T entails E → \( P(E|T) = 1 \).  
    - Thus, \( P(T|E) = P(T) \). **E does not confirm T!**  
  - **Why Ratio Form First?**  
    - Clearly shows \( P(E) = 1 \) eliminates updating.  
    - Simpler for deriving the "zero confirmation" result than log-odds.

  ---

  #### **IV. Problem Statement & Misconceptions (25 min)**
  Build misconceptions **in sequence**, then intercept:
  1. **Misconception 1: "Old evidence is just weak evidence."**  
     - *Elicit:* Ask, "Could we 'forget' E to make it novel?"  
     - *Intercept:* Argue this misdiagnoses the issue—even if we artificially lower \( P(E) \), we’re *changing* evidence, not solving structural tension. Use the scenario: If we pretend we didn’t know the symptom rate, we’re no longer using the *actual* old evidence.  
     - **Interception Point:** After introducing ratio form.

  2. **Misconception 2: "Lower priors for post-hoc theories."**  
     - *Elicit:* "Should we penalize T for being invented after E?"  
     - *Intercept:* Show this conflates *epistemic timing* with confirmation. Use a variant: Suppose T existed pre-E but we only *discovered* its entailment of E later. Problem persists.  
     - **Interception Point:** After analyzing the genetic scenario.

  3. **Misconception 3: "Only a scientific problem."**  
     - *Elicit:* "Does this apply to personal beliefs?"  
     - *Intercept:* Give an example:  
       *"You believe your friend is trustworthy (E). Later, a theory T explains why they acted out of character last week. Does E support T?"*  
       Bayesianism says no—students will object.  
     - **Interception Point:** After formal setup.

  ---

  #### **V. Log-Odds Form & Structural Tension (10 min)**
  - **Introduce Log-Odds Form:** \( \log \left( \frac{P(T|E)}{P(\neg T|E)} \right) = \log \left( \frac{P(E|T)}{P(E|\neg T)} \right) + \log \left( \frac{P(T)}{P(\neg T)} \right) \)  
  - **Key Insight:**  
    - When E is old, \( P(E|\neg T) \) is problematic. If \( P(E) = 1 \), then \( P(E|\neg T) = 1 \) → confirmatory term \( \log(1) = 0 \).  
    - **Tension:** Learning T entails E *should* change \( P(E|\neg T) \) (if ¬T, E is surprising), but conditionalization freezes it.  
  - **Why Here?**  
    Log-odds isolates the confirmatory term \( \frac{P(E|T)}{P(E|\neg T)} \), highlighting why old evidence blocks updates *structurally*.

  ---

  #### **VI. Final Check: Revealing Structural Understanding (5 min)**
  - **Task:** *"In the genetic scenario, assume we later discover a rival theory R that does NOT entail E (e.g., 'Gene G causes the disease but not S'). After conditioning on E, does the log-odds form allow E to confirm T over R? Explain why conditionalization prevents this."*  
  - **Correct Answer:**  
    No. \( P(E|T) = P(E|R) = 1 \) (both must accommodate E), so \( \log \left( \frac{P(E|T)}{P(E|R)} \right) = 0 \). Confirmation requires altering likelihoods, but conditionalization fixes them when \( P(E) = 1 \).  
  - **Why This Task?**  
    Tests grasp of the tension: Students must see that *even after* learning T entails E, conditionalization cannot "retroactively" adjust \( P(E|\neg T) \).

  ---

  #### **VII. Wrap-Up & Omitted Apparatus (Acknowledgments) (5 min)**
  - **Core Takeaway:** The problem arises from Bayesianism’s commitment to **rigid conditionalization**, not historical accidents.  
  - **Explicit Omissions:**  
    - **Logical Omniscience:** We assumed discovering "T entails E" is non-trivial, but didn’t formalize non-ideal agents (Garber-style approaches).  
    - **Probability Kinematics:** Jeffrey conditioning or other updates that "forget" evidence are set aside.  
    - **Objective vs. Subjective Bayesians:** Debate on whether \( P(E) = 1 \) is mandatory is noted but not explored.  
  - **Closing:** "This tension isn’t about Mercury—it’s about whether Bayes can capture *why* explaining old evidence feels like genuine confirmation."

  ---

  ### Timing Summary
  1. **Intuition First** (15 min): Everyday cases → predictive success.  
  2. **Central Scenario** (20 min): Genetic disease model.  
  3. **Bayes’ Theorem** (15 min): Ratio form → zero confirmation.  
  4. **Misconceptions** (25 min): Elicit and intercept 3 errors.  
  5. **Log-Odds & Tension** (10 min): Structural flaw.  
  6. **Final Check** (5 min): Application task.  
  7. **Wrap-Up** (5 min): Omissions + big picture.  

  This arc forces students to confront the structural problem *through* their intuitions, isolates the flaw in conditionalization, and preempts common escapes. The genetic scenario avoids historical baggage while meeting all constraints.
