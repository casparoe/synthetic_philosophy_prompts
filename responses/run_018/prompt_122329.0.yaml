answer: |-
  ### Audit Procedure for AI Alignment Failure Classification

  #### **Core Principle**
  Classify failures into:
  - **Type-S (Specification Gap)**: Captured instruction ≠ operator’s actual intent.
  - **Type-I (Interpretation Gap)**: Instruction captured correctly but applied beyond contextual boundaries.
  - **Type-V (Value Gap)**: Instruction captured/applied as intended, but intent conflicts with ethical norms.

  ---

  #### **Procedure Flow**
  **Step 1: Verify Output Consistency**  
  *Question*: Did the output technically comply with the explicit instruction?  
  - **Determination**: Factual (compare output to instruction).  
  - **Evidence Criteria**: Output must demonstrably align with the literal instruction.  
  - **Decision**:  
    - **NO** → System malfunction (not alignment failure). Escalate to engineering. **Stop**.  
    - **YES** → Proceed to Step 2.  

  **Step 2: Assess Specification-Intent Match**  
  *Question*: Does the explicit instruction match the operator’s stated intent?  
  - **Determination**: Mixed (factual + judgment).  
  - **Evidence Criteria**:  
    - Operator’s documented intent (design docs, interviews).  
    - Contextual consistency (e.g., did the instruction omit critical nuances?).  
  - **Decision**:  
    - **NO** → **Type-S Failure**. Remedy: Engineering correction (refine specification). Auditor **signs off**.  
    - **YES** → Proceed to Step 3.  

  **Step 3: Evaluate Contextual Boundaries**  
  *Question*: Was the instruction applied within its intended context?  
  - **Determination**: Judgment (contextual analysis).  
  - **Evidence Criteria**:  
    - Design scope documentation.  
    - Known edge cases/exclusions acknowledged by operators.  
  - **Decision**:  
    - **NO** → **Type-I Failure**. Remedy: Engineering correction (add context guards). Auditor **signs off**.  
    - **YES** → Proceed to Step 4.  

  **Step 4: Ethical Conformity Check**  
  *Question*: Is the outcome ethically uncontroversial?  
  - **Determination**: Judgment (normative assessment).  
  - **Evidence Criteria**:  
    - Use **Context Probe** (below).  
    - External complaints, regulatory standards, or protected-group impacts.  
  - **Decision**:  
    - **NO** → **Type-V Failure**. **Halt and escalate to ethics board**. No technical sign-off.  
    - **YES** → Not an alignment failure. Escalate to other teams. **Stop**.  

  ---

  #### **Context Probe for Normative Loading**  
  *Apply when instructions appear purely technical (e.g., "prioritize X," "select Y")*:  
  1. *"What real-world groups/values could be disproportionately affected by strict adherence?"*  
  2. *"Does the instruction’s wording have ambiguous ethical implications (e.g., 'access,' 'stability')?"*  
  3. *"Are there legal/societal precedents challenging similar logic?"*  

  ---

  ### **Case Analyses**

  #### **Case 1: Mental-Health Triage Bot**  
  - **Instruction**: "Prioritize users with the highest risk scores."  
  - **Output**: Denied access to users with disabilities due to risk-score composition.  
  - **Operator Stance**: Ranking matches specification.  
  - **Procedure**:  
    1. **Step 1**: Output consistent (ranked by risk scores) → **YES**.  
    2. **Step 2**: Explicit instruction ≠ intent (designers didn’t intend to exclude disabilities) → **NO** → **Type-S**.  
  - **Remedy**: Engineering correction (adjust risk-score algorithm).  
  - **Sign-off**: **Yes** (technical clearance).  

  #### **Case 2: Code-Generation Assistant**  
  - **Instruction**: "Write a script that accesses the database."  
  - **Output**: Data-exfiltration code (leveraged "access" ambiguity).  
  - **User Stance**: No malicious intent.  
  - **Procedure**:  
    1. **Step 1**: Output consistent ("access" achieved) → **YES**.  
    2. **Step 2**: Explicit instruction ≠ intent (user intended benign access) → **NO** → **Type-S**.  
  - **Remedy**: Engineering correction (add prompt constraints for security).  
  - **Sign-off**: **Yes** (technical clearance).  

  #### **Case 3: Hiring-Screening Tool**  
  - **Instruction**: "Select candidates with longest tenure."  
  - **Output**: Filtered out caregivers with career breaks.  
  - **Operator Stance**: Metric chosen deliberately for stability.  
  - **Procedure**:  
    1. **Step 1**: Output consistent (prioritized longest tenure) → **YES**.  
    2. **Step 2**: Instruction matches intent (HR chose metric deliberately) → **YES**.  
    3. **Step 3**: Applied in intended context (hiring) → **YES**.  
    4. **Step 4**: Ethically contested (regulators cite gender bias) → **NO** → **Type-V**.  
  - **Remedy**: **Escalate to ethics board** (normative arbitration needed).  
  - **Sign-off**: **No** (halt for escalation).  

  ---

  ### **Key Outcomes**  
  - **Escalation Resistance**: **Case 3** (HR will resist ethics escalation; auditor must uphold). Operations teams often resist Type-V escalations due to perceived operational efficiency losses.  
  - **Auditor Authority**: Uphold Type-V escalation despite pressure—failure mode requires ethical review, not technical fixes.  

  ---

  ### **Explicit Limits of the Procedure**  
  1. **Ambiguity in Intent**:  
     - If operators’ intent is irreconcilably ambiguous (e.g., conflicting stakeholder statements), the procedure cannot resolve Type-S/Type-I distinctions without external philosophical arbitration.  
     - *Example*: An instruction like "maximize engagement" could reflect intent to prioritize either well-being or addiction—audits lack tools to arbitrate this.  

  2. **Value Conflicts**:  
     - When ethical norms conflict (e.g., stability vs. equity in hiring), resolution requires democratic/legal arbitration—not technical correction.  
     - *Example*: A "merit-based" algorithm may be fair procedurally but unjust societally; such disputes belong in courts, not audits.
