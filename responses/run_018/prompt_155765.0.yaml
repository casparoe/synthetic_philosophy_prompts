prompt: |-
  ok here's a take-home essay prompt for my grad rationality seminar, meant to take about 90 minutes and about 800 words. please don't ask students to cite anyone specific.

  Question (30 marks):

  The usual evidential-cooperation-in-large-worlds story says that if you're one of many causally disconnected but decision-theoretically similar agents, you should cooperate in a prisoner's dilemma because your choice is evidence about what the others do. Now imagine a weirder case: Agent X and Agent Y live in two seperate pocket universes with zero causal contact. They are not just similar—each is the sole physical running of the exact same deterministic algorithm, call it Z. Z faces a local PD in each universe against a different opponent. Because Z is deterministic, if it outputs Cooperate in universe 1, it necessarily outputs Cooperate in universe 2. X knows all this.

  Analyze three things. First, is X's decision evidentially supported by Y's expected behavior, or does the fact that both are just Z running twice collapse the 'other agent' into a kind of self? Second, does this show that evidential cooperation can rest on pure logical correlation without any counterfactual or causal dependence, and if so, is it vulnerable to the calculator objection—that two pocket calculators running the same addition program don't 'cooperate' when they both show 42? Third, does this scenario strengthen or weaken the overall case for cooperating in large worlds?

  Model answer—key moves a top response must make:

  A strong answer distinguishes correlation-from-identity from correlation-from-similarity (around 6 marks). In standard ECL the correlation is mediated by shared reasoning processes, not by being the same token process; here, because X and Y are token-identical instantiations of Z, X's choice doesn't provide evidence about an independent decision-maker—it's closer to deciding what your left hand does based on your right hand, except both are the same algorithm (6 marks). The calculator objection needs to be addressed head-on: calculators lack decision-theoretic relevance and don't face payoff structures, so the analogy fails unless one accepts that any deterministic correlation counts as cooperation, which trivializes the concept (6 marks). On logical correlation, the answer should argue either that causation was never essential and this shows ECL is more robust, or that without causal/counterfactual separation we overgenerate and weaken the view—either horn is fine if defended (6 marks). Finally, the answer should be coherent and take a real stance rather than sitting on the fence (6 marks).

  Marking scheme (total 30):

  - Correct framing of standard ECL vs the identity twist: 6 marks. Typical mistake: describing cross-universe influence as causal.
  - Analysis of evidential vs self-cooperation: 6 marks. Typical mistake: saying it's clearly evidential without addressing the token-identity problem.
  - Handling the calculator/spurious-correlation objection: 6 marks. Typical mistake: dismissing it by assertion instead of explaining why agents with stakes differ.
  - Assessment of whether logical correlation alone suffices: 6 marks. Typical mistake: insisting causation is necessary without argument.
  - Overall coherence and defended stance: 6 marks. Typical mistake: listing both horns without committing or explaining the cost of each.

  Typical errors that should cost marks: treating Z's two runs as two agents in the full moral sense (-3), ignoring that determinism here makes correlation perfect rather than probabilistic (-2), or claiming the scenario is impossible because universes can't share algorithms (-2, since the prompt asks you to grant the setup).
reasoning: |-
  Okay, I need to tackle this grad-level rationality essay prompt. The scenario involves two agents, X and Y, who are identical deterministic algorithms (Z) in separate pocket universes, each facing a Prisoner's Dilemma. The key twist is that their identical deterministic nature means their choices must be the same—no causal connection, just logical correlation. 

  First, I need to address whether X's decision provides evidence about Y's behavior. Since both are the exact same algorithm running deterministically, X's choice doesn't just correlate with Y's—it is Y's choice. This collapses the "other agent" into a version of self. I should contrast this with standard Evidential Cooperation in Large Worlds (ECL), where correlation comes from shared reasoning processes, not token identity. 

  Next, the calculator objection: two identical calculators showing "42" aren't cooperating—they're just following deterministic programming. But here, Z is a decision-making agent facing actual payoffs. The difference is stakes and agential properties. I'll need to explain why having preferences and payoffs changes everything. 

  For logical correlation, I think this strengthens ECL by showing it doesn't require causal/counterfactual dependence. Pure logical correlation can sustain cooperation. But I must acknowledge the risk of overgenerating (e.g., calculators), so I'll emphasize the necessity of decision-theoretic context. 

  Finally, for the large-world case: this scenario weakens standard ECL by showing its reliance on similarity rather than identity makes cooperation probabilistic. But it also reveals a purer form of cooperation via logical necessity. I'll argue this ultimately strengthens ECL by proving its core mechanism works even in edge cases. 

  I should avoid common pitfalls: don't treat X and Y as distinct moral agents, don't ignore perfect determinism, and don't question the setup's possibility. The essay needs a clear stance—I'll argue that while this scenario exposes ECL's vulnerabilities, it ultimately validates cooperation based on logical correlation alone. 

  Structure-wise: 
  1. Identity vs. similarity distinction upfront 
  2. Evidential support analysis emphasizing token identity 
  3. Calculator objection rebuttal via decision-theoretic framing 
  4. Defense of logical correlation sufficiency 
  5. Synthesis showing how this refines ECL's case
answer: |-
  ## The Algorithmic Self: Cooperation Under Token Identity

  This scenario forces a critical refinement of evidential cooperation in large worlds (ECL) by replacing correlation-from-similarity with correlation-from-token-identity. The analysis reveals nuances about evidence, cooperation, and the role of logical correlation, ultimately strengthening the case for ECL while exposing its boundaries.

  **1. Evidence or Self? The Collapse Under Token Identity**  
  In standard ECL, agents are distinct but similar tokens of a type (e.g., rational humans). Agent X’s cooperation provides *evidence* about other *similar* agents because their shared reasoning process makes correlated decisions likely. Here, however, X and Y aren't merely similar tokens of type Z; they are **numerically identical manifestations of the *same* token algorithm Z running twice**. X’s decision isn't evidence *about* Y; it *is* Y’s decision, logically entailed by the deterministic execution of Z. This collapses Y into an extension of X’s "self" in a logical, if not physical, sense. X isn't predicting an independent agent; X is deciding what *this single algorithm* outputs *everywhere* it runs. It’s closer to deciding whether to raise your left or right hand simultaneously than to inferring another person’s choice. The "other agent" vanishes under token identity.

  **2. Logical Correlation and the Calculator Objection: Stakes Make the Difference**  
  This scenario demonstrates that evidential cooperation *can* rest purely on logical correlation without causal or counterfactual dependence. X cooperates precisely because its choice logically necessitates Y’s identical choice, maximizing joint payoff. However, this risks trivializing cooperation – hence the calculator objection. Two calculators running `2 + 40` both outputting "42" aren’t cooperating; they’re mechanically computing. The flaw in the analogy is **decision-theoretic relevance**. Cooperation requires agents facing *stakes* – preferences over outcomes influenced by choices. Agent Z has a payoff structure (PD rewards/punishments); calculators lack preferences and payoffs altogether. Their outputs have no *agential significance*. Correlation only implies "cooperation" in a morally or strategically relevant sense when it occurs between entities capable of agency and responsive to incentives. Z cooperates because its identical outputs *achieve its preferred outcome* across instances; calculators simply compute. Logical correlation *enables* cooperation for agents with stakes, but it doesn’t *constitute* cooperation absent those stakes.

  **3. Strengthening the Large-World Case: Purification and Scope**  
  This scenario paradoxically both strengthens and refines the case for cooperating in large worlds. It **strengthens** ECL by demonstrating its core mechanism – acting on correlated decisions to achieve better outcomes – functions even under pure logical determinism, without any causal scaffolding or probabilistic similarity. It proves cooperation isn't contingent on physical causality or statistical inference alone. However, it also **weakens** the *standard justification* for large-world cooperation by highlighting its reliance on similarity rather than identity. Standard ECL depends on the *plausible inference* that similar agents in similar situations act similarly. This inference is fallible and probabilistic. The token-identity case reveals a purer, logically necessary form of correlation, showing the *limits* of the standard "evidence about others" story. It clarifies that ECL's true power lies in harnessing *any* reliable correlation between choices affecting joint outcomes, whether based on similarity, shared environment, or, as here, logical identity. While the scenario itself is an edge case, it underscores that cooperation remains rational wherever reliable choice-correlation exists and agents have aligned stakes.

  **Conclusion**  
  Agent X’s situation isn’t standard ECL; it’s a unique case of **logical self-extension**. Cooperation arises because X decides the single output of algorithm Z across all instantiations. This confirms logical correlation *suffices* for cooperation among agents with preferences but highlights that agential stakes are non-negotiable (defusing the calculator objection). Ultimately, while this scenario complicates the "evidence about others" narrative of standard large-world cooperation, it strengthens the *overall* case by proving ECL's robustness. Cooperation is rational whenever actions are reliably correlated and mutual cooperation yields superior outcomes – whether the correlation stems from similarity, shared reasoning, or even token identity. The scenario doesn't invalidate ECL; it reveals a deeper, logically underpinned foundation for coordinated action.
