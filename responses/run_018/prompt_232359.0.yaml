  We are going to design a decision procedure in the form of a checklist. The goal is to help the user (a cognitive science PhD student who draws a weekly beach comic) to:
   (i) List the knobs (key concepts) of a given setup.
   (ii) Classify a candidate gag as trite, fresh, broken (no longer the same theme), or weird-but-rescuable.
   (iii) Provide the questions in order, with what counts as a good answer for each.

   The procedure is meant to be run in under an hour before sketching.

   We'll structure the checklist as follows:

   PART A: SETUP ANALYSIS (for the original theme)
     Step 1: Identify the core theme (what's the central idea?).
     Step 2: List the key concepts (knobs) in the theme. These are the elements that define the theme and can be varied.
     Step 3: For each knob, note its current setting (the default in the theme) and what makes it load-bearing (i.e., if changed too much, the theme breaks).

   PART B: GAG EVALUATION (for each candidate gag)
     Step 4: For the candidate gag, describe the variation.
     Step 5: For each knob identified in Step 2, note how it is changed (or not) in the candidate gag.
     Step 6: For each knob that is changed, assess the degree of change (low, medium, high) and whether it breaks the theme (i.e., if the change is so high that the mapping to the original theme is lost).
     Step 7: Check for coherence: 
          - Are there multiple knobs changed? If so, do the changes feel like they are in harmony? 
          - Does the gag still clearly map back to the original theme? (Can you point to what each element in the gag corresponds to in the original?)

     Step 8: Classification:
          - If no knobs are changed or the changes are very minimal -> trite.
          - If one or more knobs are changed to a medium degree and the gag remains coherent and mappable -> fresh.
          - If one or more knobs are changed to a high degree such that the theme is broken (you can't see the original theme anymore) -> broken.
          - If the gag is broken but you can see a way to adjust some knobs to fix the mapping -> weird-but-rescuable.

     Step 9: For any gag that is weird-but-rescuable, note which knobs need adjustment and how.

   PART C: JUDGMENT CALLS AND LIMITATIONS
     We will note where judgment takes over and what the procedure can't catch.

   Now, we'll run the procedure on three candidate gags for a seagull strip:

   Original Theme: Let's take a typical seagull beach strip. The core theme is "seagulls at the beach". 
     Key knobs (we'll list a few):
       1. Role of the seagull: scavenger (stealing food, opportunistic).
       2. Setting: beach, with typical beach elements (sand, water, people, food).
       3. Human interaction: seagulls are a nuisance to humans, but humans are often the source of food.
       4. Seagull behavior: bold, unafraid of humans, focused on food.
