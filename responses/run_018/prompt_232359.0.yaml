answer: |-
  ### Hofstadter Knob-Twiddling Creativity Checklist  
  **Time Limit:** 45–60 minutes  
  **Goal:** Evaluate gag variations for a one-panel comic by identifying "knobs" (key concepts), classifying outcomes, and ensuring coherent mappings to the original theme.  

  ---

  ### **PART A: LIST THE KNOBS (15 mins)**  
  *Goal: Break down your theme into adjustable concepts.*  
  1. **Define the core theme:**  
     - *Question:* What’s the irreducible essence of your strip? (e.g., "Seagulls as opportunistic beach pests").  
     - *Good answer:* Specific, non-generic. Avoid broad labels like "funny animals."  
     - *Judgment call:* How abstract vs. literal is your theme?  

  2. **Extract load-bearing knobs (3–5 max):**  
     - *Question:* What concepts define the theme? List each knob + its default "setting."  
     - *Good answer:* Knobs are *actionable* (e.g., "Seagull’s goal: steal food"). Avoid vague traits (e.g., "seagull is annoying").  
     - *Judgment call:* Which knobs are *essential*? Removing one should break the theme.  

  3. **Flag fragility:**  
     - *Question:* How far can each knob turn before the theme breaks?  
     - *Good answer:* "If [knob] changes from [X] to [Y], the theme collapses because [reason]."  

  **Example: Seagull Beach Comic Theme**  
  - Core theme: *"Seagulls exploit human beach activities for food."*  
  - Knobs:  
    1. **Seagull’s role:** *Default: Food-thief*. Fragile if changed to non-opportunistic (e.g., altruist).  
    2. **Human interaction:** *Default: Unwilling victim*. Breaks if humans are absent/complicit.  
    3. **Object of desire:** *Default: Human food*. Fragile if changed to non-food item.  
    4. **Setting realism:** *Default: Grounded beach logic*. Breaks if surreal (e.g., talking seagulls).  

  ---

  ### **PART B: EVALUATE CANDIDATE GAGS (20–25 mins per gag)**  
  *Goal: Test knob-twists for coherence and freshness.*  

  4. **Map knob changes:**  
     - *Question:* Per knob, how is it twisted? (Unchanged/Low/Medium/High).  
     - *Good answer:* "Knob 1 twisted HIGH (thief → lifeguard). Knob 3 unchanged (still food-focused)."  

  5. **Check coherence of multi-knob twists:**  
     - *Question:* Do twisted knobs logically *interact*? (e.g., If the seagull’s role changes, does the human reaction adapt consistently?).  
     - *Good answer:* Changes feel *causally linked* (e.g., "Seagull as lifeguard explains why humans tolerate him").  
     - *Red flag:* Changes feel arbitrary or clash (e.g., seagull wants food but acts against that goal).  

  6. **Classify the gag:**  
     - *Questions:*  
       - Can you *explain the mapping* to the original theme in 1 sentence?  
       - Is any load-bearing knob broken?  
       - Does it feel predictable?  
     - *Classification:*  
       - **Trite:** ≤1 knob twisted (Low), or cliché (e.g., seagull steals fries).  
       - **Fresh:** 2+ knobs twisted (Medium), clear mapping, unexpected.  
       - **Broken:** Load-bearing knob twisted HIGH with no mapping.  
       - **Weird-but-rescuable:** Broken but mapping *can* be forced via adjustments.  

  7. **Rescue protocol (if weird):**  
     - *Question:* What minimal knob adjustment would restore mapping?  
     - *Good answer:* "Add visual cue to show seagull’s *true motive*" or "Tone down surrealism."  

  ---

  ### **PART C: LIMITATIONS & JUDGMENT CALLS**  
  - **Where judgment rules:**  
    - Knob fragility (Step 3) — Requires intuition about your theme’s "essence."  
    - Coherence (Step 5) — Subjective; rely on your gut feel for "harmony."  
    - Freshness (Step 6) — Cultural context matters (e.g., a gag may be trite in Brighton but fresh in Bali).  
  - **What the procedure misses:**  
    - Gags where *implicit* knobs (e.g., tone, art style) clash with explicit twists.  
    - "Emerged" humor (e.g., absurdity from *unintended* knob interactions).  
  - **Multi-knob bug fix:** Step 5 forces explicit coherence checks. If you can’t articulate *why* knobs twist together, the gag risks feeling arbitrary.  

  ---

  ### **EXAMPLE EVALUATIONS: SEAGULL STRIP**  
  **Core Theme:** *Seagulls exploit human beach activities for food.*  
  **Knobs:**  
  1. Seagull’s role (food-thief)  
  2. Human interaction (unwilling victim)  
  3. Object of desire (human food)  
  4. Setting realism (grounded)  

  ---

  #### **Candidate 1: Seagull stealing chips**  
  - **Knob twists:**  
    - Role: *Unchanged* (thief).  
    - Human: *Unchanged* (victim).  
    - Object: *Unchanged* (chips = food).  
    - Realism: *Unchanged*.  
  - **Coherence:** All knobs static → no interaction.  
  - **Classification:** **Trite** (classic execution).  
  - **Verdict:** Sketch if execution is novel (e.g., art perspective), else discard.  

  ---

  #### **Candidate 2: Seagull who thinks he’s the lifeguard**  
  - **Knob twists:**  
    - Role: *HIGH* (thief → lifeguard).  
    - Human: *MEDIUM* (victim → confused bystander).  
    - Object: *LOW* (food? Implied via e.g., lifeguard float as "prize").  
    - Realism: *MEDIUM* (anthropomorphism).  
  - **Coherence check:**  
    - *Mapping:* "Seagull *exploits* lifeguard role to access food/social perks."  
    - *Harmony?* Twists interact: delusion explains human tolerance.  
  - **Classification:** **Weird-but-rescuable** (if food-link is clear).  
  - **Rescue protocol:** Add visual cue (e.g., seagull eyeing a picnic basket while blowing whistle).  
  - **Verdict:** Keep if rescue works.  

  ---

  #### **Candidate 3: Seagull running a beachside scam (e.g., selling "insurance" against chip theft)**  
  - **Knob twists:**  
    - Role: *HIGH* (thief → con artist).  
    - Human: *HIGH* (victim → willing customer).  
    - Object: *MEDIUM* (food → money for food).  
    - Realism: *HIGH* (talking, complex society).  
  - **Coherence check:**  
    - *Mapping:* "Seagull *exploits* human fear to profit (indirect food access)."  
    - *Harmony?* Twists clash: humans are now *complicit*, undermining "victim" knob. Realism broken (speech).  
  - **Classification:** **Broken** (themes of opportunism and beach logic are lost).  
  - **Verdict:** **KILL** (even if you love the idea — mapping is forced).  
    - *Why it’s hard to kill:* The scam idea is funny! But it abandons the core theme for a generic "animal con artist" trope.  

  ---

  ### **BEFORE YOU SKETCH: FINAL QUESTIONS**  
  1. Did Step 5 expose *why* multi-knob twists cohere? If not, gag may crumble.  
  2. For "weird" gags: Can your rescue *fit in one panel*? If not, kill it.  
  3. Are you clinging to a "broken" gag? Write down *why*, then sleep on it.  

  **Output:** A clear label (Trite/Fresh/Broken/Weird) + 1-sentence mapping for each gag. Use this to veto or iterate fast.
