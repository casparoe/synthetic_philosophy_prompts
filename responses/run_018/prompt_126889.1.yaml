prompt: |-
  I am presenting a 20-minute argument at an interdisciplinary American studies conference that American exceptionalism functions not as an empirically testable historical thesis about U.S. uniqueness, nor purely as a normative claim of superiority, but as a "structural ideology"—a self-reinforcing institutional grammar embedded in federal architecture, expansive judicial review, and anti-statist political rhetoric that shapes policy trajectories independently of whether citizens or elites explicitly endorse exceptionalist beliefs. The session audience includes comparative political scientists who reject exceptionalism by pointing to parallel institutional developments in Canada and Australia, critical historians and theorists of empire who treat exceptionalist language as ideological cover for settler-colonial domination, and constitutional lawyers who defend it as a normative doctrine of limited government and rights-based constitutionalism; all three groups are hostile to synthetic reconceptualizations that blur empirical, normative, and ideological categories.

  Draft my Q&A prep sheet: identify the seven or eight objections I will actually receive, ordered from the most damaging to the least, with each phrased in the vocabulary and disciplinary framing of the group most likely to raise it. For every objection, provide a concise reply suitable for a two-minute response, mark the point where the reply is weakest or requires a concession, and indicate whether I should concede partially up front or hold the line entirely. Include the one question I am hoping nobody asks, with an explanation of why it undermines the core of my thesis. At the very start of your answer, state in one sentence the single strategic principle that should govern all my responses, then present the reasoning and the prep sheet; do not open with any preamble or restate this prompt. Write in American English.
