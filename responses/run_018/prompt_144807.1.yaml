answer: |-
  **MEMORANDUM**  
  To: Graduate College Disciplinary Board  
  From: [Your Name], PhD Candidate, Legal Philosophy  
  Date: October 26, 2023  
  Subject: Recommendation in Matter of Inner Morality Working Group (IMWG) & Dean’s Integrity Protocol  

  ---

  ### I. RECOMMENDATION  
  **Grant the Inner Morality Working Group (IMWG) a temporary exemption from compliance with the Dean’s Integrity Protocol and direct the Dean’s Office to revise the protocol within 30 days to resolve its internal contradictions and clarify retroactive application.** Pending revision, suspension proceedings against IMWG should be held in abeyance.  

  ---

  ### II. REASONING  
  The IMWG’s refusal stems from substantive defects in the Integrity Protocol, not defiance of valid authority. Two flaws render the protocol unenforceable *as applied* to their pre-existing research:  

  1.  **Self-Contradiction:** The protocol requires disclosure of conflicts of interest (Section 3.1) but simultaneously states that "the act of disclosure itself constitutes a reportable conflict" (Section 3.4 Annotation). This creates a logical paradox: compliance with the disclosure mandate inherently violates the rule against unreported conflicts. A rule demanding mutually exclusive actions (disclose/do not disclose the same act) is impossible to obey coherently.  

  2.  **Retroactivity:** The protocol governs "all active research projects" (Section 1.2), including those initiated prior to its promulgation. Imposing new procedural burdens on ongoing work undermines fair reliance on prior rules and disrupts settled research plans.  

  #### A. **The Protocol Fails Basic Conditions of Legality**  
  The IMWG correctly invokes the principle that law must meet certain procedural conditions to function *as law*. These include:  
  *   **Non-contradiction:** Rules cannot demand logically incompatible behaviors.  
  *   **Possibility of Compliance:** Subjects must be able to understand and follow the rule without facing irresolvable dilemmas.  
  *   **Non-retroactivity:** New rules should generally govern future conduct, not punish past actions compliant with prior law.  

  A self-contradictory rule (like the disclosure paradox) is not merely difficult to obey; it is *logically incoherent*. No stable social practice of compliance can emerge around a command that simultaneously requires and forbids the same act. This defect transcends moral objections – it renders the rule incapable of guiding conduct meaningfully. While the protocol was enacted through proper *procedural* channels (faculty vote, publication, etc.), satisfying the formal "rule of recognition," its *internal inconsistency* prevents it from functioning as a recognizable standard of behavior. A rule that defeats its own purpose through contradiction cannot sustain the consistent application and social acceptance central to any working legal system.  

  Retroactive application compounds this failure. Applying new disclosure burdens to projects designed under different expectations undermines the predictability necessary for subjects to order their affairs according to rules.  

  #### B. **The Dean’s Hartian Defense is Incomplete**  
  The Dean’s Office correctly notes that under a strict separation thesis, a rule’s validity stems from its source (e.g., enactment by the recognized authority) and not its moral merit. However, this view overlooks a critical nuance: **a rule must be *capable* of being recognized and followed within a social practice to be considered a valid rule *of law*.** A profoundly contradictory command fails this threshold. It is not that the rule is immoral; it is that it is *non-functional* as a rule. There can be no consistent "practice of recognition" for a rule that, in its very application, collapses into absurdity. Enforcing suspension for non-compliance with an un-compliable-with rule transforms the disciplinary system into an instrument of caprice, not governance.  

  ---

  ### III. STRONGEST CONSIDERATION ON THE LOSING SIDE (Upholding Suspension)  
  The strongest argument for upholding suspension is the **primacy of procedural validity and institutional authority.** The protocol underwent all mandated review and approval processes. Granting an exemption based on perceived substantive flaws, especially those framed in abstract jurisprudential terms, risks undermining the established rule-making apparatus of the university and setting a precedent where any group could invoke philosophical arguments to nullify inconvenient rules. It threatens orderly administration and could encourage broader non-compliance if groups believe they can unilaterally invalidate duly enacted policies based on internal critiques. Strict adherence to the formal rule of recognition is essential for institutional stability and predictability.  

  ---

  ### IV. CONCRETE COURSE OF ACTION & TIMELINE  
  1.  **Immediate Action (This Week’s Meeting):**  
      *   **Vote to reject the Dean’s request for suspension** of IMWG members for non-compliance.  
      *   **Formally grant IMWG a temporary exemption** from filing the contested disclosure forms *specifically for research projects initiated before the protocol’s effective date*.  
      *   **Direct the Dean’s Office** to revise the Integrity Protocol to:  
          (a) Eliminate the self-contradiction in Sections 3.1 and 3.4 (clarifying that the act of disclosure does not itself constitute a new, unreported conflict requiring separate disclosure).  
          (b) Explicitly limit the protocol’s application to research projects *initiated after* its effective date, or establish clear, fair transition rules for ongoing projects.  

  2.  **Revision Deadline:**  
      *   **Set a deadline of 30 days** from the date of this decision (i.e., **November 25, 2023**) for the Dean’s Office to circulate a revised protocol draft to the Faculty Senate and this Board for expedited review.  

  3.  **Compliance Deadline for IMWG (Conditional):**  
      *   Upon promulgation of the revised protocol, IMWG will have **14 days** to file all required disclosures *for ongoing projects*, provided the revisions satisfactorily resolve the identified flaws. Failure to comply with the *revised, logically coherent, and non-retroactive* protocol would then constitute valid grounds for disciplinary action.  

  4.  **Board Follow-Up:**  
      *   Schedule a brief **check-in meeting on November 30, 2023**, to confirm revision progress and address any unforeseen obstacles.  

  ---

  ### V. CONCLUSION  
  While the protocol’s procedural enactment satisfies the formal sources of validity, its internal contradiction and retroactive reach create genuine impossibility of compliance for ongoing research. Enforcing suspension under these circumstances would be unjust and counterproductive. The recommended path upholds the integrity of the university’s rule-making process by demanding correction of the flaws, protects researchers from incoherent demands, and provides a clear, expedited timeframe for resolution. This approach respects both the need for enforceable rules and the fundamental principle that rules must be capable of being followed.  

  Respectfully submitted,  
  [Your Name]  
  PhD Candidate, Legal Philosophy  
  Member, Graduate College Disciplinary Board
