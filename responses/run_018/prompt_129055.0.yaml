  Here’s the villanelle, holding the tension:

  **Moriah’s Refrain**

  We who are bound by common ground must hold  
  The vow that builds the soil where all may stand.  
  The knife demands what cannot be said or told.  

  No private vision justifies the fold  
  Of reason breached by one alone command.  
  We who are bound by common ground must hold  

  The line no singular may break. Controlled  
  By justice, human judgment takes its stand.  
  The knife demands what cannot be said or told.  

  The path is shared, no secret to unfold,  
  No sacrifice the public can’t withstand.  
  We who are bound by common ground must hold  

  Against the silence where the stars are cold  
  And duty shatters at the unseen hand.  
  The knife demands what cannot be said or told.  

  The gift withheld, the future’s shape foretold  
  Is severed by the blade that parts the soul.  
  We who are bound by common ground must hold  
  The knife demands what cannot be said or told.  

  ---

  **Philosophical Mechanics:**  
  - **Refrain 1 (Ethical/Universal):** "We who are bound by common ground must hold" – Emphasizes collective obligation ("we," "common ground," "must hold").  
  - **Refrain 2 (Absolute/Singular):** "The knife demands what cannot be said or told" – Focuses on the unspeakable, imperative act ("knife," "demands," "cannot be said").  
  - **Final Couplet:** The refrains stand side-by-side without conjunction, resolution, or hierarchy. The ethical *must hold*, the absolute *demands* – the suspension remains.  
  - **Key Imagery:** "Soil where all may stand" (ethical foundation), "blade that parts the soul" (the incommunicable trauma/faith), "gift withheld" (Isaac).  
  - **Accuracy:** Avoids jargon while reflecting Kierkegaard's core conflict: the ethical *as universal* vs. the absolute *as utterly singular and inexpressible within that universal*. The poem enacts the irresolvable return of each voice.
