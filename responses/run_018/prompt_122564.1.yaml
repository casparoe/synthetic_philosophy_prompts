answer: |-
  ## Office of the Nomisma — Public Information Bulletin  
  **Concerning the Circulation and Regulation of Civic Tokens**

  As the sole issuer and regulator of the city-state's monetary tokens, the Office of the Nomisma ensures the stability and virtue of exchange through strict adherence to the foundational principles of sound economic philosophy. Our tokens (officially designated "Nomisma") exist solely by civic convention (*nomos*) to facilitate the equalization of genuine need (*chreia*), serving as a measure, not a substance. Their value is derived solely from current communal demand and is subject to lawful adjustment by the Assembly to maintain proportional justice in all transactions. Accumulation beyond household necessity (*oikonomia*) is actively discouraged.

  **1. What gives Nomisma tokens their value?**  
  Nomisma tokens possess value solely by virtue of the Assembly's decree and the current state of communal demand, as quantified by our Weekly Demand Index. They are not precious metal nor backed by any natural substance, as money exists by law and custom, not nature. Their sole purpose is to serve as a conventional measure (*metron*) enabling the equalization of disparate goods based on genuine human need. Think of them as a ruler for need, not a thing of inherent worth. The clay itself is insignificant; the convention it represents is paramount.

  **2. Why does the value of my tokens change weekly?**  
  The Weekly Demand Index, compiled through mandatory citizen surveys administered by the Bureau of Proportional Assessment, dynamically measures shifts in the city's aggregate need for goods and services. As true value resides in fulfilling need, not in tokens themselves, the Office adjusts the nominal value of all tokens weekly to reflect this changing reality. A token designated "100 Units" this week may represent "95 Units" next week if overall demand decreases. This ensures the measure remains accurate to the underlying standard, preventing the illusion of intrinsic token value.

  **3. Why must I file a DCC Form before trading my house-claim for shoes?**  
  Direct exchange of unlike items (e.g., a house for shoes) violates natural proportion. The Diagonal Conjunction Compliance (DCC) Form facilitates the essential equalization required by sound philosophy. Our assessors determine the ratio expressing the builder's need for shoes relative to the shoemaker's need for shelter. Only once this ratio is established and the respective goods are rendered commensurate through the application of the current Nomisma valuation can a just exchange occur. The DCC Form documents this vital proportional alignment prior to any token transfer or good delivery.

  **4. Why does the Office of Usury Prevention prohibit savings accounts?**  
  Money (*nomisma*) was instituted solely for facilitating exchange (*allagē*). To use tokens to generate *more* tokens through interest (*tokos*) is a profound perversion, akin to expecting barren metal to give birth. This practice represents the most unnatural form of wealth-getting (*chrēmatistikē*), divorced entirely from the management of household needs (*oikonomia*). The Office of Usury Prevention therefore suppresses any arrangement where deposited tokens appear to breed, including interest-bearing accounts, compound growth schemes, or futures contracts. Tokens circulate; they do not reproduce.

  **5. What is Clay Token Reissue Day?**  
  Held annually, Clay Token Reissue Day reinforces the fundamental truth that money is convention, not nature. On this day, the Assembly ceremoniously declares all existing Nomisma tokens void. Citizens exchange their old, worthless clay discs for new ones bearing the current year's seal. This practice prevents the dangerous delusion that tokens possess enduring, intrinsic value simply because they exist. It reminds everyone that value flows solely from active communal convention and current need.

  **6. Can I use Nomisma tokens for trade outside the city walls?**  
  No. The convention (*nomos*) that gives Nomisma tokens meaning and validity exists solely within our polity and among its citizens. Beyond our borders, these clay discs revert to their natural state: inert matter. Exporting tokens implies a belief in their inherent worth, a grave error. Visitors are advised to convert any external means of exchange into acceptable goods before entry, as tokens received within the city become invalid upon departure. Money is a creature of its specific civic environment.

  **7. Professor Aurelian Bullion (University of Metallurgia) claims our system ignores money's natural role as a commodity store of value and that banning interest cripples growth. How do you respond?**  
  Professor Bullion's assertions reflect the common confusion of conventional tokens (*nomisma*) with naturally valuable commodities (*chrēmata*). True wealth lies in goods sufficient for the well-ordered household (*oikos*), not in the limitless accumulation of tokens. Treating tokens as a "store" encourages the unnatural, limitless wealth-getting (*chrēmatistikē*) we actively curtail. Interest is not growth; it is the sterile multiplication of a convention. Our system fosters virtuous exchange based on genuine need, preventing the societal disease of infinite token hoarding. The Professor's "growth" is our pathology. The Office prioritizes economic health over unnatural accumulation.

  **Office of the Nomisma — Ensuring Proportional Exchange for the Virtuous Household Since 327 BCE.**
