  **Goal:** Make students viscerally grasp the tension between emergence and the limits of collective mindedness. They should experience how local rules create unified behavior (like cognition), but also confront where the "single mind" attribution fails—especially around subjective experience.

  ---

  ### **Setup & Logistics**  
  - **Group Size:** 12 students (all participate).  
  - **Time:** 90 minutes total (30 min game, 60 min debrief).  
  - **Setting:** Seminar room with tables pushed aside. Use floor space to create a **5x5 grid** with tape. Chairs around the grid for observers later.  
  - **Materials:**  
    - **Grid:** Marked with tape (squares labeled 1A, 1B, etc.).  
    - **Tokens:**  
      - Red tokens = "Food" (place 10 at Grid Corner A, 10 at Corner D).  
      - Blue tokens = "Pheromones" (30 in a central pile).  
      - Black blocks = "Obstacles" (3–4 placed mid-grid after Round 2).  
    - **Role Cards:** 12 cards with local rules (no global info):  
      - **Forager (8 students):** *"If standing on food: (1) Take 1 food token. (2) Move toward strongest pheromone trail. (3) Drop 1 pheromone when moving. If no food: Wander randomly."*  
      - **Maintainer (4 students):** *"Remove 1 pheromone per turn. If adjacent to >3 pheromones: Remove 1 extra. Else: Wander randomly."*  
    - **Blindfolds (optional):** To enforce local-only perception during movement phase.  
  - **Payoff:** "Colony Points" (CP) tracked publicly:  
    - +5 CP per food delivered to the nest (Corner B).  
    - -1 CP if any student breaks rules (talking/planning).  

  ---

  ### **Game Rules**  
  1. **Pre-Game Brief (5 min):**  
     - Assign roles. Emphasize: **No talking, no gestures.** Communication ONLY through placing/moving tokens.  
     - Nest = Corner B. Goal: Maximize CP by delivering food.  
     - Each round = 4 phases (announced by facilitator):  
       - **Perceive (1 min):** Students observe adjacent squares (no moving tokens yet).  
       - **Act (2 min):** Write actions privately on paper (e.g., "Move to 3C," "Drop pheromone at 2B").  
       - **Resolve (1 min):** Facilitator enforces actions in random order (updates grid, adds/removes tokens).  
       - **Reset (1 min):** Students return to seats; obstacles added after Round 2.  
     - **Critical Twist:** After Round 2, silently add obstacles blocking main paths to food. Remove 1 random student ("ant death") to test robustness.  

  2. **Predicted Game Flow:**  
     - **Rounds 1–2:** Foragers find food, create pheromone trails to nest. Maintainers "evaporate" weak trails.  
     - **Round 3:** Obstacles appear. Chaos ensues—students reroute trails *unintentionally* via local rules.  
     - **Rounds 4–6:** Colony "adapts" (e.g., shifts focus to unblocked food source). CP rises, but no one planned it.  
     - **Snap Moment:** When obstacles hit, the group exhibits "unified problem-solving" (e.g., abandoning a food source) despite individual randomness.  

  ---

  ### **Debrief Structure (60 min)**  
  **Goal:** Link game moments to Hofstadter’s ant colony argument, then expose cracks.  

  1. **What Happened? (15 min)**  
     - Ask: *"Did the colony feel like a single agent? When?"*  
     - Highlight:  
       - **Emergence:** Pheromone trails formed "memory" (e.g., trails to food intensified without coordination).  
       - **Robustness:** CP kept rising after "ant death" (like neurons failing; system compensates).  
       - **No Central Control:** No leader; actions were local, yet global patterns emerged.  

  2. **The Pull of "One Mind" (15 min)**  
     - Connect to Hofstadter:  
       - *"Aunt Hillary’s neurons = your roles. Local rules → global cognition."*  
       - Colony’s "decision" to reroute around obstacles mirrors problem-solving (e.g., finding efficient paths = "learning").  
     - Show structural pressure: Attribution feels natural because:  
       - **Functionality:** Colony solved a goal (food delivery).  
       - **Adaptability:** It "responded" to obstacles like an agent would.  

  3. **Where the Analogy Snaps (20 min)**  
     - **Breakout Groups (5 min):** *"When did the colony LEAST feel like a mind? Why?"*  
     - Debrief key cracks:  
       - **No Top-Down Intent:** Obstacle response was emergent—*zero* students intended the new path; it was entropy + local rules.  
       - **Absence of Qualia:** Colony "solved" a problem but didn’t *experience* frustration (unlike players). Hofstadter’s ants lack subjective states.  
       - **Teleology vs. Mechanism:** We *interpret* trails as "memory," but they’re just chemical residues. Attribution is observer-dependent.  
     - Hammer the gap: *"Functional unity ≠ experiential unity."*  

  4. **The Hard Limit (10 min)**  
     - **Admit the Shortfall:** The game *cannot* simulate **phenomenal consciousness** (e.g., "what it’s like" to be the colony). Hofstadter handwaves this!  
     - **Bridge Verbally:**  
       - *"Consciousness requires first-person access. Aunt Hillary’s ‘mind’ is a third-person model—a useful fiction for explaining behavior, not experiencing it."*  
       - Panpsychists inflate mechanism into metaphysics; reductionists ignore emergence. This game lives in the tension.  

  ---

  ### **Predictable Problems & Fixes**  
  - **Problem:** Students talk/gesture despite rules.  
    - **Fix:** Enforce -1 CP penalties. If severe, "disable" a player for 1 round (simulates neural damage).  
  - **Problem:** Feels artificial ("Why can’t we just talk?").  
    - **Fix:** In debrief, agree: *"Yes, real ants don’t ‘decide’—but your frustration mirrors how hard it is to reduce cognition to parts."*  
  - **Problem:** Game is too simplistic.  
    - **Fix:** "This is a toy model. Real ant colonies use 20+ pheromones. But toy models expose logical tensions."  

  ---

  ### **Closing Hook**  
  - End by revealing the source: *"What you felt—that flicker of a ‘group mind’—is why Hofstadter’s ‘ant fugue’ still haunts philosophy of mind. But as you saw, the music breaks when we ask who’s listening."*  
  - No pre-reading. Just raw immersion → debate.
