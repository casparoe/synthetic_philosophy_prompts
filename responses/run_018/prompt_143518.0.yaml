prompt: |-
  hey so my roommate got a concussion last month and now he's obsessed with Dennett's brain-transplant puzzle where he asks where am I — the one with the brain copy and the original body. we keep hitting this pattern. usually people say you're the copy if your memories and personality stay in tact, right? but then if you tell them the copy is missing one synapse or has a tiny glitch, they suddenly say nope, then you're the original body because it's not exactly the same brain. it's like they use one standard for normal cases and a totally different, stricter standard the second there's a micro-gap. i've seen it in arguements about uploads, teleportters, even split-brain surgery. is there an established name for this sliding-criterian move? how is it different from the fission problem or from vagueness about identity edges? if there's no name, coin one and say exactly where it applies and where it stops. answer in JSON with fields: nearest_established_concept, how_described_phenomenon_differs, proposed_name_and_definition, boundary_cases_or_edge_conditions, bottom_line_assessment.
reasoning: |-
  We are dealing with a phenomenon where people apply different standards for personal identity depending on whether the scenario is presented as a perfect copy or one with a minor imperfection.

  The typical response pattern:
  - In a perfect brain copy scenario, people say the person is where the memories and personality are (i.e., in the copy if the original is destroyed and the copy is activated).
  - But if there's even a tiny imperfection (like one missing synapse), then they revert to saying the original body is the person (because the copy isn't exact).

  This seems like a shifting criterion. We are to find if there's an established name for this, or else coin one.

  Nearest Established Concepts:

  1. **Ship of Theseus**: A thought experiment about whether an object that has had all its components replaced remains the same object. This deals with gradual change and identity over time, but not necessarily the same as our case.

  2. **Fission Problem**: In personal identity, when a person splits into two (e.g., via brain splitting or teleportation creating two copies). The issue is that our identity concept doesn't naturally extend to two. This is related but not exactly the same because our case involves a shifting standard based on imperfection.

  3. **Vagueness of Identity**: The idea that identity might not have sharp boundaries. However, in our case, the shift is abrupt and triggered by a minimal change.

  4. **Slippery Slope Fallacy**: But that's more about arguing that a small step will lead to a chain reaction of events. Not the same.

  5. **No-Boundary Problem**: Or the problem of vagueness in personal identity. But again, the issue is the double standard.

  How the Phenomenon Differs:

  The key difference is that the criterion for identity shifts from a functional criterion (memories, personality) to a material criterion (exact physical continuity) when a minor imperfection is introduced. This is not just vagueness because the shift is categorical: a perfect copy is accepted as the same person, but an imperfect one (even if functionally identical) is rejected. It's a form of moving the goalposts.

  Proposed Name and Definition:

  - **The Imperfection Discontinuity in Identity Attribution (IDIA)**
    Definition: The cognitive tendency to switch from a functional criterion of personal identity (e.g., psychological continuity) to a material criterion (e.g., physical continuity) when a hypothetical scenario of duplication or transfer of consciousness includes any imperfection, no matter how minor.

  Boundary Cases or Edge Conditions:

  - The phenomenon occurs when the imperfection is introduced and is perceived as a break from perfect continuity. It does not occur if the imperfection is framed as irrelevant (e.g., if the subject is told that the missing synapse is nonfunctional and the person is psychologically identical). It also does not occur in cases where the imperfection is so large that it clearly breaks psychological continuity.

  - It stops when:
    a) The imperfection is explicitly deemed irrelevant (e.g., by an authority) and the subject accepts that.
    b) The scenario is presented with multiple imperfections that are so extensive that the copy is clearly a different person (then the material criterion is applied from the start).
    c) The subject holds a consistently materialist view (so they never accept the copy) or a consistently functionalist view (so they accept the copy even with minor imperfections).

  Bottom Line Assessment:

  This is a cognitive bias that reveals an underlying inconsistency in how people think about personal identity. It is not a problem of vagueness per se, but of context-dependent criterion switching. It is distinct from the fission problem because it doesn't require two copies and instead focuses on the threshold of imperfection that triggers a switch in the criterion used. The bias may stem from an intuitive attachment to the physical body and a fear of imperfection in duplication scenarios.

  Now, we output in JSON format.
