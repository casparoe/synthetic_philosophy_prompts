  For the recommendation, a modified Charter makes sense: redirect a portion of disbursements (not all, to address fiscal concerns) to education and contextual framing, with clear language separating historical accountability from present culpability. The timeline must be tight—current fiscal quarter—to show urgency. Implementation steps should include drafting plaques by historians and appointing an oversight board to legitimize the process. 

  The strongest counterargument is that any formal obligation implies inherited sin. But the rebuttal lies in framing this as institutional integrity: the city isn’t accepting guilt but rectifying an imbalance it still benefits from. Charity isn’t enough; this is about correcting a systemic oversight. The middle ground exists in "rectificatory justice"—collective obligation without collective guilt. 

