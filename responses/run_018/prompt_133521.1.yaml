answer: |-
  **The core implication is that under this framework, short-term visitors lack moral culpability for violating local conventions, while long-term residents bear genuine obligation, fundamentally changing how we judge such acts.**

  Here's the reasoning broken down by your questions:

  1.  **Judging Visitors & The Moral Line:**
      *   **First-Week Tourist:** Gets a significant, perhaps total, moral pass. Violating tipping norms, jaywalking, or queue-jumping isn't seen as a *moral failing* (like dishonesty or cruelty), but rather a failure of *cultural coordination*. They haven't had time to learn the "normative grammar" and internalize it as binding. Their obligation is minimal – perhaps just a duty to learn *if* they become aware and care about smooth interactions.
      *   **Six-Month Expat:** Crosses a threshold (though the exact timing is fuzzy). By embedding themselves in the community, benefiting from its stability (which relies on conventions), and having ample opportunity to learn the norms, they incur a genuine moral obligation to follow them. Violating conventions now demonstrates disrespect for the community they've joined and potentially undermines the system. Their acts *are* judged morally.
      *   **The Line:** The framework absolutely draws a real, morally significant line based on duration and depth of community integration, shifting the violation from a mere coordination hiccup to a breach of obligation.

  2.  **Conventions vs. Genuine Obligations:**
      *   **Coordination Devices:** At their core, the framework views conventions *primarily* as coordination devices – efficient solutions to recurring social problems (fair service compensation, safe/efficient pedestrian/traffic flow, orderly access to services).
      *   **Becoming Obligations:** However, **the obligation to follow them arises *only* through territorial embeddedness.** For unembedded visitors, they remain *just* coordination tools – useful to follow for smooth interactions, but not morally binding. For the embedded individual, adherence becomes a genuine moral obligation *because*:
          *   They benefit from the stability and predictability the conventions provide.
          *   Their participation is necessary to sustain the system for others.
          *   Disregarding them after integration shows disrespect for the community and its shared practices.

  3.  **Implications for Urban Design & Legal Penalties:**
      If society adopted this view, it would significantly alter approaches:
      *   **Signage & Education:** Focus would shift from purely prohibitive signs ("No Jaywalking - $100 Fine") to *explanatory* and *educational* signage, especially in tourist areas. Signs would explicitly state the *local norm and its purpose* ("In Berlin, pedestrians cross only at signals for safety and traffic flow. Please respect this custom during your visit."). Tourism materials would emphasize key conventions.
      *   **Legal Penalties:** Enforcement could differentiate based on residency status/duration. Fines for jaywalking or similar conventional violations might be:
          *   **Lower or waived for demonstrable short-term tourists:** Treating it as an educational moment.
          *   **Standard or higher for residents/long-term visa holders:** Reflecting the breach of obligation and need for stronger deterrence within the community.
      *   **Social Enforcement:** Locals might be more tolerant of obvious tourists violating conventions (e.g., sighing but not confronting a queue-jumper with a map and confused look), while being more likely to correct or criticize someone they perceive as a resident.
      *   **Burden of Proof:** Logistically, this creates challenges. How is "embeddedness" proven? Residency status (visa type) or duration of stay might become proxies, but this adds complexity to enforcement.

  **Critically evaluating your friend's theory:** It offers a coherent, practical distinction that emphasizes the role of community membership in generating obligation. It explains why a tourist's jaywalking *feels* less wrong than a local's. However, key criticisms remain:
  *   **The Threshold Problem:** Defining "long enough" is inherently vague. Is it 1 week? 3 months? 6 months? It depends on the complexity of the norm and individual circumstances.
  *   **Knowledge vs. Embeddedness:** A well-researched first-time tourist might know the norms better than a resident who just moved. Does knowledge alone create obligation, or only embeddedness? The theory prioritizes embeddedness.
  *   **Harm Potential:** Some conventions have clear harm-reduction purposes (jaywalking safety). Does a visitor's lack of embeddedness negate the moral weight of reckless behavior that could harm others, even if unintentional?
  *   **Reciprocity & Respect:** Arguably, a baseline duty of respect for *any* community you visit, even briefly, creates *some* obligation to learn and follow its basic, non-harmful conventions to avoid friction and show goodwill, even if less stringent than for residents.

  **Bottom line on your friend:** He's identified a potentially useful distinction grounded in the relationship between community belonging and obligation generation. It's not *just* self-serving philosophy; it grapples with real questions about moral relativism and community boundaries. However, the line is blurry, and the theory arguably underplays the minimal duties of respect and harm-avoidance even short-term visitors might hold. Whether it excuses *his* queue-jumping depends entirely on whether he's genuinely a "visitor" or has crossed that embeddedness threshold himself!
