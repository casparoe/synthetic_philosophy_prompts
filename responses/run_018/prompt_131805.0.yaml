prompt: |-
  I'm running a workshop on pseudohistory and demarcation — Atlantis, ancient aliens, Fomenko's new chronology, the usual suspects — and one of my grad students keeps falling back on 'absence of evidence isn't evidence of absence' every time I push on her favorite reconstruction. Last session she used it specifically when I noted that Fomenko's shadow dynasty has not just zero matching inscriptions, but also no trace in the dendrochronology records I showed the class; she said the tree-ring silence doesn't prove he's wrong. I want to bring a disambiguation to next weeks meeting and show her why the slogan doesn't automatically save the case. Can you lay out the different precise claims hiding inside that line? Like, is it a logical point about the fallacy of arguing from ignorance? An epistemic claim about priors? A methodological rule that all negative archaeological results are inconclusive? For each reading, tell me if it's trivially true, defensible, or false — and specifically say which version actually protects Fomenko-style reconstructions from missing-inscription and tree-ring objections, and which ones fall apart. I need this as a clean list I can project on the board, not a citation list or reading assignment — just the conceptual map, since half my students think repeating a slogan counts as an argument. (Also I spelled 'seperate' wrong in my notes, so don't quote that back at me please — wait, I just did. Nevermind.)
reasoning: |-
  Okay, let me tackle this professor's problem. They're running a workshop on pseudohistory and their grad student keeps using "absence of evidence isn't evidence of absence" to defend fringe theories like Fomenko's New Chronology. Specifically, when challenged about missing inscriptions and dendrochronological records, the student claims this absence doesn't disprove Fomenko. The professor wants to dissect this slogan for next week's session.

  First, I need to unpack that slogan. It's commonly misused in pseudohistory debates. The professor mentioned three angles: logical fallacy, epistemic priors, and methodological rules in archaeology. I should address each precisely.

  Starting with the logical perspective. Strictly speaking, the absence of evidence only implies evidence of absence if we'd expect to see that evidence if the claim were true. That's the key nuance. For Fomenko's shadow dynasties, we absolutely would expect inscriptions or tree-ring evidence. So in this case, the absence actually is evidence against his theory. The student's blanket application fails here.

  Next, epistemic considerations. If the prior probability of a claim is extremely high, absence might not hurt it much. But Fomenko's revisionism has such low prior probability that absence of evidence significantly weakens it. Plus, we have strong positive evidence for conventional chronology from multiple independent sources. The student can't justify ignoring that.

  Then there's the methodological angle. Archaeology deals with probabilistic evidence, not binary proofs. Complete absence where evidence should exist - like missing Roman artifacts in Britain if Rome never existed - would be damning. Fomenko's shadow dynasties fit this pattern: we should see evidence but don't. The student's "inconclusive" stance ignores this expectation principle.

  I should also note the burden of proof reversal. The student is shifting responsibility onto critics to disprove her theory, rather than providing positive evidence for it. That's backwards. Fomenko makes extraordinary claims but offers only circular arguments and pattern-matching, not hard evidence.

  For the workshop, I'll organize this as a clear table showing each interpretation of the slogan, whether it holds, and how it applies to the dendrochronology example. The key takeaway will be that while the slogan is sometimes technically true, it fails spectacularly when applied to cases where evidence is expected. Fomenko's theories crumble under that test.
answer: |-
  Here's a clean conceptual disambiguation for your board, breaking down "absence of evidence isn't evidence of absence" into its core interpretations and assessing their validity against the Fomenko/dendrochronology case:

  ---

  **"Absence of Evidence Isn't Evidence of Absence":  
  A Conceptual Map for Demarcation**

  | **Interpretation**                                                                 | **Status**          | **Protects Fomenko?** | **Why?**                                                                                                                                                                |
  | :--------------------------------------------------------------------------------- | :------------------ | :-------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Strict Logical Claim:**<br>"Lack of proof ≠ Proof of falsehood." (Arguing from Ignorance fallacy) | **Trivially True**  | **No**                | Logic only demands proof for positive claims. **But:** This doesn't mean absence *never* supports negation. It just means absence alone isn't *logical proof*. Fomenko still needs positive evidence. |
  | **2. Epistemic Claim (Weak):**<br>"Absence *never* lowers the probability of a claim." | **False**           | **No**                | Bayes' Theorem: Absence *where evidence is expected* **lowers probability**. If a claim predicts evidence *should* exist (e.g., inscriptions for a dynasty), absence *is* evidence against it. |
  | **3. Epistemic Claim (Strong):**<br>"Absence *can* lower probability, but only if we *expected* evidence." | **Defensible**      | **Only if expectations are low** | **Crux:** For Fomenko's shadow dynasty, **we absolutely expect inscriptions/dendro records**. Absence here *strongly* lowers its probability. If no evidence was expected (e.g., a secret society leaving zero traces), absence *wouldn't* lower probability. |
  | **4. Methodological Claim (Inconclusiveness):**<br>"All negative archaeological results are inherently ambiguous." | **Mostly False**    | **No**                | While *some* absences are ambiguous (e.g., a single missing artifact), **systematic absence of *expected* evidence is conclusive** (e.g., no Roman pottery in Britain disproves Roman occupation). Fomenko's case involves **expected, systematic evidence**. |
  | **5. Burden-of-Proof Claim:**<br>"The critic must *disprove* the theory; absence isn't disproof." | **Misguided**      | **Superficially Yes** | **Problem:** This reverses burden. Fomenko makes the extraordinary claim (collapsed chronology/shadow dynasties). **He** must provide **positive evidence**. Absence of expected evidence shifts burden *further* against him. |

  ---

  **Applied to Your Dendrochronology Example:**
  - **Fomenko's Claim:** Shadow Dynasty X existed in period Y.
  - **Expected Evidence:** Inscriptions, dendrochronology patterns consistent with known events/materials from period Y.
  - **Observation:** **Systematic absence** of inscriptions + **no dendro signal** where one is expected.
  - **Conclusion:** This absence **IS strong evidence of absence** for Dynasty X *in period Y* because:
    1. The evidence *should* exist (Epistemic Claim 3).
    2. It's systematic, not isolated (Methodological Claim 4).
    3. It fails the "expected evidence" test decisively.

  **Why the Slogan Fails Here:**  
  The student uses Interpretation #1 or #5 (Absence ≠ Proof / Burden on Critic). But **Fomenko’s claim fails Interpretation #3**: the absence occurs **where evidence is overwhelmingly expected** based on how we know history, archaeology, and dendrochronology work. The silence *is* evidence against his model.

  ---

  **Board-Ready Summary:**  
  *"Absence of evidence isn't evidence of absence" is:*  
  ✔️ **True** logically (it's not *proof* of falsehood).  
  ❌ **False** epistemically (it *can* lower probability if evidence was expected).  
  ⚠️ **Misleading** methodologically (systematic absence of *expected* evidence *is* significant).  
  🔀 **Dangerous** for burden-of-proof (shields unsupported claims from falsification).  
  **→ Fomenko loses:** His "shadow dynasties" **predict evidence that is absent where it must exist.**
