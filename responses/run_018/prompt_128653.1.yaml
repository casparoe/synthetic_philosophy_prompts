he specific tension that cooperative structures sometimes depend on the strategic removal of exit routes, and that this removal is ethically and practically different from mere optimism. Avoid bibliographies, citations, and verbatim quotations from any source; paraphrase all theoretical claims in your own words. Do not invent historical details about the origin of the Luring Lottery.
