  Hmm, the fractures they mention are crucial. Computational layers are causally efficacious by design - transistors execute bytecode instructions. But in nature, do emergent levels have real causal power, or are they just explanatory conveniences? The analogy assumes functionalism (levels defined by causal roles) which physicalists might reject. Also, comparing compiler architects to natural selection feels shaky - one is intentional, the other blind.

