  So does the "greedy reductionism collapses" conclusion hold? Only if you accept the analogy's premises. Without them, greedy reductionism might just be incomplete but not self-defeating. Maybe a better image is trying to describe a rainbow solely with photon physics - possible in principle but useless pragmatically. 

