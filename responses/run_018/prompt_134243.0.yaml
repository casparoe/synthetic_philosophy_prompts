  - Weighted harms: Where small harms to many outweigh large harms to few. The "Dust Specks vs. Torture" case is perfect here—it's extreme but clarifies the logic. 
  - Collective principles: Like "rescue priority" where numbers create emergent duties. The "Mountain Pass" dilemma isolates this—saving five isn't about summing harms but responding to greater need. 
  - Separate spheres: Aggregation only in crises, not distribution. The "Vaccine Shortage" case contrasts rescue vs. fairness—shifting the same harm context shows why some think domains matter. 

  ...Wait, is there a gap? The tree doesn't neatly capture "threshold" views where huge numbers justify harm. I'll note that as a boundary issue—maybe add "Five Cups" as a node where harm severity matters more than pure aggregation. 

  Empty combinations: Why no "separate spheres + pairwise-only"? Because if you reject aggregation entirely, domain distinctions shouldn't matter. And "collective principles + no number sensitivity" is incoherent—collective logic needs numbers. 

