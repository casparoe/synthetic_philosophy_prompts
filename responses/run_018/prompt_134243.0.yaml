answer: |-
  Here’s a taxonomy of contractualist approaches to aggregation, presented as a decision tree with concrete cases. Designed as a seminar handout focusing on intuitive judgments over theory labels.

  ---

  **CONTRACTUALIST AGGREGATION TAXONOMY**  
  *Core Principle: An act is wrong if any principle permitting it could be reasonably rejected by someone affected.*

  ### Step 1: Can the NUMBER of affected people influence reasonable rejectability?
  *(i.e., can "many small harms" outweigh "one large harm"?)*

  **A. NO → Strict Pairwise Comparison**  
  → *Reasonable rejectability is ONLY judged pairwise (individual vs. individual). Group size is irrelevant.*  
  **Case: The Five Kidneys**  
  > *One healthy person has five kidneys (unique biology). Five dying patients each need one kidney to survive. May we take one kidney from the healthy person (killing them) to save all five patients?*  
  → **Intuition Test:** If you think this is *always impermissible* (even to save 1,000 patients), you are here.  
  **Position:** **Hard Anti-Aggregationist**  
  - *Logic:* No individual can be asked to bear a grave harm (death) merely because many others benefit. The one’s veto always wins.  
  - *Empty Combo?* "Pairwise + Aggregation Domains" → Incoherent. If numbers never matter, domains can’t change that.

  **B. YES → Number-Sensitivity**  
  → *The size of the group can make a difference to what counts as "reasonable rejection".*  
  *Proceed to Step 2...*

  ### Step 2: HOW does aggregation work? (If numbers matter)

  **B1. Weighted Harm Comparison**  
  → *Total "moral weight" of harms/benefits is summed. Rejectability depends on net balance.*  
  **Case: Dust Specks vs. Torture**  
  > *We must choose: Either (1) One person suffers excruciating torture for a day. Or (2) 10,000 people each get a barely noticeable dust speck in their eye. May we choose the dust specks?*  
  → **Intuition Test:** If you think we *must* choose the dust specks (aggregate trivial harms outweigh one severe harm), you are here.  
  **Position:** **Aggregative Utilitarian-Leaning Contractualist**  
  - *Logic:* Harms are commensurable. A vast number of tiny harms can reasonably outweigh one large harm.

  **B2. Collective Rescue Principle**  
  → *Large numbers trigger a distinct duty of "easy rescue" or catastrophe prevention. Not about summing harms.*  
  **Case: The Mountain Pass**  
  > *A rockslide will kill five stranded hikers unless we dynamite a safer path. Dynamiting will kill one hiker on that path. May we dynamite?*  
  → **Intuition Test:** If you think this is *permissible* (saving five vs. one in emergency) **BUT** reject "weighted harm" in cases like Dust Specks, you are here.  
  **Position:** **Qualified Number-Sensitive Contractualist (Rescue Focus)**  
  - *Logic:* Saving many lives in immediate peril creates an obligation that a single person cannot reasonably reject, but this doesn’t apply to trivial harms or distributive justice.

  **B3. Separate Spheres: Aggregation ONLY in Rescue, NOT Distribution**  
  → *Aggregation justified only for preventing imminent, irreversible harms (rescue), not for allocating scarce resources for long-term fairness.*  
  **Case: The Vaccine Shortage**  
  > *RESCUE SCENARIO: Five people are dying of Virus A now. One person has Virus B (fatal in a week). We have one dose effective only for Virus A. May we give it to the five?*  
  > *DISTRIBUTION SCENARIO: Five people will develop severe chronic pain next year without a vaccine. One person will die without it. We have one dose effective for both. Who gets it?*  
  → **Intuition Test:** If you permit saving the five in **Rescue** but *deny* giving to the five in **Distribution** (prioritizing the one who dies), you are here.  
  **Position:** **Domain-Specific Aggregationist**  
  - *Logic:* Rescue urgency creates special moral force for numbers; distributive fairness requires pairwise fairness.

  **B4. Threshold Aggregation**  
  → *Aggregation ONLY kicks in when the number of beneficiaries passes a high threshold OR the harm to individuals is very small.*  
  **Case: Modified Five Cups**  
  > *Five hikers will die of dehydration in 10 minutes unless each gets one cup of water. A sixth hiker has exactly five cups but will die if deprived of even one cup. May we take one cup?*  
  → **Intuition Test:** If taking one cup *feels clearly wrong* (harm to one = death) **BUT** you might allow taking one drop of blood from each of 1,000,000 people to save one life, you are here.  
  **Position:** **Threshold-Sensitive Contractualist**  
  - *Logic:* Minimal sacrifices from many can aggregate to override rejection; severe harms to one rarely do, regardless of numbers.

  ---

  **TAXONOMY SUMMARY (7 Positions)**  
  1. **Hard Anti-Aggregationist** (A)  
  2. **Aggregative Utilitarian-Leaning** (B1)  
  3. **Qualified Rescue-Focused** (B2)  
  4. **Domain-Specific (Rescue vs. Distribution)** (B3)  
  5. **Threshold-Sensitive** (B4)  
  *(+ Two "Empty" or Rare Combos)*:  
  6. *Pairwise + Domains (Empty)*: Can’t reject aggregation in domains if numbers never matter.  
  7. *Number-Sensitive but Anti-Weighting + Anti-Rescue (Empty)*: Why accept numbers if no mechanism exists?

  **Blurry Boundaries:**  
  - **B2 (Rescue) vs. B3 (Domains):** "Is this a rescue?" can be ambiguous (e.g., *Vaccine Shortage*).  
  - **B4 (Threshold) vs. B1 (Weighting):** At what point does "many small harms" become acceptable?  

  **Why This Tree?**  
  - Starts from Scanlon’s core justifiability-to-each principle.  
  - Uses cases forcing intuitive judgments about *when/if* numbers matter.  
  - Reveals why "it depends" isn’t vague—it points to deeper structural splits.  

  **Handout Notes:**  
  - Use cases to locate your group’s intuitions BEFORE naming positions.  
  - Scanlon (*What We Owe to Each Other*) leans between **B2** and **B3**, rejecting strict aggregation (**B1**) but allowing numbers in rescue.  
  - Anti-aggregationists (**A**) face "five vs. one" rescue counterintuitions; hard aggregators (**B1**) face "dust specks" absurdity objections.  

  ---  
  *Use this to map disagreements: "You reject Kidney Case? Then you’re likely A or B4. Permissible? Likely B1-B3. Now test Dust Specks or Vaccine Distribution..."*
