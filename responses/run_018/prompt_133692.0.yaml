prompt: |-
  Right, I'm stuck on where to put my energy on this culture-does-it-cause-anything problem, specifically Weber's protestant ethic thesis and the broader mess of explaining with values. There's this concept people keep calling elective affinity — Weber's idea that protestant ethics and capitalist rationalism had some kind of non-accidental fit — but nobody seems to agree whether that's a causal mechanism, a correlation with a story tacked on, or just a fancy way of saying culture matters sometimes. And then there's the deeper problem: if values explain outcomes, do they do it as selection environments, like in evolutionary economics, or as generative mechanisms, like in hermeneutic sociology? That distinction seems to me like it should matter, but I'm not sure anyone's actually worked out the implications.

  So imagine you've got a small grant for maybe three post-docs for two years, and they can only work on conceptual philosophy of social science — no empirical data collection, no archive diving. Which open questions or lines of work should they prioritise, and in what order? I want you to defend the ranking: what's upstream of what, which ones are tractable without massive empirical programmes, and which ones are dead ends that keep getting reheated for no good reason. In particular, I'm interested in whether explaining with values necessarily commits you to methodological individualism, or whether institutional-level value causation is coherent without downward causation; whether elective affinity can be reconstructed as a mechanism sketch that doesn't collapse into material determinism or just-so storytelling; and which of these debates actually have implications for contemporary economics or political theory, versus which are purely academic turf wars.

  Please say how confident you are in each part of the agenda, and single out the point you're least sure about — I want to know exactly where you're winging it. Oh, and write in British English — I don't care about spelling consistency, truely I don't — and don't bother with a reading list, I can find those myself.
