prompt: |-
  I have recently taken over as the moderator of a mid-sized online history discussion community, and I find myself having to make judgment calls about which fringe historical claims get a hearing and which get removed. I would like to stop adjudicating case by case and instead figure out what principle, if any, my actual judgments add up to. Here are my verdicts so far, given honestly:

  Plato's Atlantis as the record of a real Bronze Age civilization: no, that is not history. The ancient astronaut hypothesis for the pyramids: no. Fomenko's new chronology, on which centuries of the Middle Ages were fabricated and dynasties are duplicates of one another: no, and I feel no obligation to read the books first. Graham Hancock's lost ice-age civilization that supposedly taught agriculture to the survivors: no. The Bosnian pyramids: no.

  But then: the old consensus that the Clovis people were the first Americans was overturned by Monte Verde, and I regard that revision as entirely legitimate science even though the excavators were dismissed by the establishment for years. Pre-Columbian contact between Polynesia and South America, on the strength of the sweet potato and some contested genetic evidence, strikes me as a live hypothesis worth taking seriously despite being a minority position. And I have to admit that both Troy and the Norse settlement at L'Anse aux Meadows were fringe claims until they weren't, which makes me nervous about the confidence of my "no"s above.

  My tentative principle has been: defer to the credentialed consensus unless the challenger produces extraordinary physical evidence. But I can see it does not capture my verdicts. It would have ruled against Monte Verde for most of its history, and it gives me no principled way to take the sweet potato contact seriously while dismissing Hancock, since both currently lack the smoking gun.

  So here is what I want from you. State the most precise principle (or small set of candidate principles) that captures as many of my verdicts as possible, and for each clause of it tell me which case motivates it. Be honest about which of my verdicts the principle cannot accommodate, and tell me which one you think I should give up if forced. Then apply the resulting account to three cases I have not listed: the Younger Dryas impact hypothesis, the claim that Homo naledi deliberately buried its dead, and the Voynich manuscript. Finally, tell me whether there is any principled difference between a claim being unfalsifiable and a claim being falsifiable but currently unevidenced, and where that distinction does real work in my list.
reasoning: |-
  Okay, I need to help this user who's moderating a history discussion community figure out their principles for handling fringe claims. They've listed specific verdicts on various theories and are struggling to find a consistent standard. Let me start by understanding their judgments.

  They reject Atlantis, ancient astronauts, Fomenko's chronology, Hancock's lost civilization, and Bosnian pyramids. But they accept Monte Verde overturning Clovis-first, consider Polynesian-South American contact a live hypothesis, and acknowledge Troy and L'Anse aux Meadows as former fringe ideas now validated. Their tentative principle of deferring to credentialed consensus unless there's extraordinary physical evidence doesn't hold because Monte Verde was initially dismissed despite evidence, and sweet potato evidence is considered without a smoking gun, unlike Hancock.

  The user needs a precise principle that explains their decisions. Let me identify patterns. The accepted cases like Monte Verde and Polynesian contact have tangible evidence—artifacts at Monte Verde, sweet potatoes with genetic links. Whereas rejected claims often rely on interpretations without direct evidence. Also, the accepted cases involve methodologies that could be tested—archaeological digs, genetic analysis. Hancock's theory lacks testable specifics.

  The key might be the nature of evidence: physical, testable, and the community's engagement. Monte Verde had physical evidence that was eventually validated through scrutiny. Polynesian contact has biological evidence being debated. In contrast, Atlantis has no physical evidence, ancient astronauts ignore cultural context, Fomenko's work is unfalsifiable, Hancock lacks direct evidence, Bosnian pyramids are natural formations.

  For the principle, it should emphasize testable evidence and scholarly engagement. Maybe: "Prioritize claims with tangible evidence open to verification and sustained scholarly debate." That covers Monte Verde's artifacts and the sweet potato genetics. Troy and L'Anse had physical evidence that was tested over time. The rejected claims either lack evidence or are unfalsifiable.

  But what about falsifiability? Fomenko's chronology is unfalsifiable because any counter-evidence is dismissed as part of the conspiracy. Hancock's claim is falsifiable but unevidenced. The distinction matters because unfalsifiable claims can't be debated productively. In the user's list, Fomenko is unfalsifiable, hence rejected, while Hancock is falsifiable but lacks evidence, which aligns with the user's "no."

  Now, applying to new cases: Younger Dryas impact hypothesis has physical evidence (nanodiamonds, spherules) but debate over interpretation. Following the principle, it's a live hypothesis with tangible evidence and ongoing research. Homo naledi burials: physical evidence in Rising Star Cave, peer-reviewed studies, so legitimate. Voynich manuscript: no testable evidence, speculative, so reject.

  The user might need to reconsider Hancock since it's falsifiable but lacking evidence, similar to sweet potato contact. But sweet potato has genetic data, while Hancock relies on interpretations. The principle emphasizes tangible evidence and scholarly mechanisms, which Hancock lacks compared to Polynesian contact.

  So the core principle is testability, tangible evidence, and engagement with academic processes. The user should give up rejecting Hancock if forced, but since Hancock's evidence isn't robust and lacks scholarly acceptance, maintaining "no" is consistent. The distinction between unfalsifiable and unevidenced helps exclude theories immune to evidence, like Fomenko, while allowing debate for testable claims lacking proof, like Polynesian contact.
answer: |-
  Based on your verdicts and reasoning, here's the most precise principle I can derive, along with its motivations, limitations, and applications:

  **The Principle: Prioritize claims that meet *both* of the following criteria:**
  1.  **They are grounded in tangible, verifiable evidence open to conventional analysis and methodological scrutiny.** *AND*
  2.  **They engage constructively with the established scholarly process (peer review, publication, debate) *or* possess extraordinary evidence that demonstrably challenges core paradigms in a way the process *must* address.**

  **Motivations from Your Verdicts:**

  *   **Criterion 1 (Tangible, Verifiable Evidence):**
      *   **Motivates "Yes" to Monte Verde:** Physical artifacts, stratigraphy, dating techniques provided concrete, analyzable evidence.
      *   **Motivates "Live Hypothesis" for Polynesian Contact:** Physical evidence (sweet potato distribution, contested genetic markers) provides a tangible basis for debate.
      *   **Motivates "No" to Ancient Astronauts:** Ignores tangible evidence of Egyptian engineering capabilities and social organization, substituting untestable claims.
      *   **Motivates "No" to Bosnian Pyramids:** Geological analysis showed natural formations, lacking the tangible evidence required for artificial structures.
      *   **Motivates "No" to Hancock:** Lacks specific, tangible evidence for the *advanced civilization* itself; interpretations of existing evidence (e.g., Göbekli Tepe's implications) are disputed and not extraordinary *proof*.
  *   **Criterion 2 (Scholarly Engagement / Extraordinary Evidence):**
      *   **Motivates "Yes" to Monte Verde:** Initially dismissed, but evidence was presented *within* the scholarly framework (publications, conferences), subjected to intense scrutiny, and *eventually convinced the relevant experts* through the process. Its evidence *became* extraordinary relative to the Clovis paradigm.
      *   **Motivates "Live Hypothesis" for Polynesian Contact:** Actively debated within mainstream journals and conferences; evidence, while contested, is *part of the ongoing scholarly conversation*.
      *   **Motivates your nervousness about Troy/L'Anse aux Meadows:** They demonstrate how fringe ideas *become* mainstream *through* the eventual application of tangible evidence (Schliemann's excavations, Ingstad's digs) *within* or forcing a reckoning *with* the scholarly process.
      *   **Motivates "No" to Fomenko:** Explicitly rejects the entire scholarly process (historiography, archaeology, linguistics, physics) as a conspiracy. Evidence is constructed *around* the theory, not used to test it against conventional analysis. It *refuses* to engage constructively.
      *   **Motivates "No" to Atlantis (Plato):** Primarily literary interpretation; lacks tangible evidence directly supporting the *literal historical reality* as described. Scholarly engagement focuses on understanding it as philosophy/myth, not proving its historicity.
      *   **Motivates "No" to Hancock:** While published, the core claims largely operate *outside* the convincing core of mainstream archaeology. His arguments often involve reinterpreting existing evidence in ways mainstream scholars find methodologically unsound or lacking sufficient proof, rather than presenting extraordinary *new* evidence that compels paradigm shift. His work generates public debate but limited productive *scholarly* engagement on the core "advanced civilization" thesis.

  **Where the Principle Fits and Where it Strains:**

  *   **Accommodates Well:** Monte Verde (eventually), Polynesian Contact, Troy/L'Anse (as historical examples), Fomenko (rejection), Ancient Astronauts (rejection), Bosnian Pyramids (rejection).
  *   **Accommodates, but Highlights a Tension:** Atlantis (rejection) - Little tangible evidence exists, but scholarly debate *about its meaning* is active. The principle prioritizes the *lack of evidence for historicity* over the literary debate.
  *   **Strains Against:** Hancock (your "No"). Hancock *does* present evidence (e.g., Göbekli Tepe, underwater structures) and engages with publication/public debate. The principle struggles to cleanly distinguish this *falsifiable but unevidenced (to mainstream satisfaction)* claim from Polynesian Contact *based solely on the principle*. Your judgment here relies more heavily on the **quality, specificity, and mainstream assessment of the evidence** presented, finding Hancock's lacking the extraordinary proof needed to overcome the consensus *despite* his engagement.

  **The Verdict to Reconsider (If Forced):**

  If forced to reconcile the strain, you should consider relaxing your "No" on **Graham Hancock** from an absolute removal to a heavily caveated discussion. The principle struggles to cleanly separate him from the Polynesian contact case based purely on "tangible evidence + engagement," as both meet the basic criteria, just with differing levels of evidence quality and mainstream acceptance. Your judgment on Hancock seems more based on the *perceived insufficiency* of his evidence relative to the magnitude of his claim and the mainstream consensus – a valid assessment, but one that relies on a subjective evaluation of evidence strength that the principle doesn't explicitly capture. Maintaining the "No" is defensible based on the **extraordinary evidence** requirement implied in Criterion 2 and the lack of *specific*, unambiguous proof for the *civilization* itself, but it's the point of greatest tension.

  **Application to New Cases:**

  1.  **Younger Dryas Impact Hypothesis (YDIH):**
      *   **Evidence:** Presents tangible evidence (e.g., nanodiamonds, magnetic spherules, platinum spikes in sediment layers at YD boundary).
      *   **Scholarly Engagement:** Heavily debated in peer-reviewed journals (Science, PNAS, etc.), conferences; subject to intense methodological scrutiny (contamination? alternative explanations?); significant mainstream skepticism but also proponents within the academy.
      *   **Verdict by Principle:** **A live hypothesis warranting serious discussion.** It meets both criteria: tangible evidence open to analysis and robust, ongoing engagement within the scholarly process. (Similar status to Polynesian Contact).

  2.  **Homo naledi Deliberate Burials:**
      *   **Evidence:** Tangible evidence of skeletal remains in deep, difficult-to-access cave chambers, arranged in specific positions, with minimal evidence of predation/scavenging. Sediment analysis.
      *   **Scholarly Engagement:** Findings published in high-profile journals (eLife); subject to intense peer review and ongoing debate within paleoanthropology regarding interpretation (burial vs. natural accumulation vs. other). The *team itself* proposed the burial hypothesis based on the evidence.
      *   **Verdict by Principle:** **A legitimate, actively debated scientific claim.** Strong tangible evidence and central focus of current scholarly debate. Consensus is *not* established, but the process is working. Discussion should center on the evidence and competing interpretations.

  3.  **Voynich Manuscript:**
      *   **Evidence:** A tangible artifact (the manuscript itself) with illustrations. However, the text remains undeciphered; proposed "solutions" often rely on subjective interpretations, speculative linguistic theories, or unverified claims without producing testable results.
      *   **Scholarly Engagement:** Studied by academics (historians, linguists, cryptographers). However, most serious engagement focuses on *provenance*, materials science (dating inks/vellum), and cataloging features. Proposed decipherements rarely gain traction in peer-reviewed linguistics/cryptography journals; the field is rife with fringe claims that bypass scholarly rigor.
      *   **Verdict by Principle:** **Generally not suitable for discussion *as a solved historical text* or *for most proposed decipherements*.** While the artifact is tangible (Criterion 1), the *historical claims* (what it says, who wrote it, its meaning) lack verifiable evidence based on conventional analysis. Proposed solutions overwhelmingly fail Criterion 2: they don't engage constructively with the scholarly process (rarely published rigorously, not adopted, methods often untestable/unconvincing). Discussion of its *existence*, physical properties, and the *history of attempts* to decipher it is valid, but promoting specific unsupported decipherments isn't.

  **Unfalsifiable vs. Falsifiable but Unevidenced:**

  *   **Unfalsifiable Claim:** A claim structured such that *no conceivable evidence* could disprove it. It is immune to empirical testing. (e.g., Fomenko: Any counter-evidence is dismissed as part of the fabricated chronology).
  *   **Falsifiable but Currently Unevidenced:** A claim that *could* be proven false with specific evidence, but currently lacks sufficient evidence to be considered proven *or* disproven. (e.g., Hancock's specific lost civilization: Finding *no* evidence in expected locations/timeframes *could* falsify it; e.g., Polynesian contact before a certain date *could* be falsified by genetic/pollen evidence).
  *   **Where it Does Work in Your List:**
      *   **Fomenko (Unfalsifiable):** This is a key reason for your firm "No" and the principle's easy rejection. It cannot be debated productively because it rejects the very tools of debate and evidence. Its unfalsifiability places it outside the realm of history as an empirical discipline. **The distinction does the heavy lifting here.**
      *   **Hancock / Polynesian Contact / YDIH (Falsifiable but Unevidenced/Contested):** The principle allows for discussion of these *because* they are falsifiable and engage (or could engage) with evidence and the scholarly process, even if evidence is currently insufficient for consensus. Their falsifiability makes them *potentially* scientific/historical claims. Your "No" to Hancock vs. "Live" for Polynesia/YDIH reflects your assessment of the *current strength and nature* of the evidence and its reception within the process, *not* its fundamental falsifiability.
      *   **Atlantis (Plato):** The *specific literal interpretation* often drifts towards unfalsifiability ("It sank without a trace except Plato's story"). Mainstream scholarly discussion focuses on the falsifiable aspects (influences from real events/cultures on the story).

  **Conclusion:**

  Your principle effectively prioritizes **testability, tangible evidence, and engagement with scholarly mechanisms** over popularity or iconoclasm alone. It allows for paradigm shifts (like Monte Verde) by requiring extraordinary evidence to *force* the process to change, while excluding claims that are fundamentally untestable (Fomenko) or lack meaningful evidence (Bosnian Pyramids, Ancient Astronauts). The tension with Hancock highlights the subjective element in judging "extraordinary evidence" and the current state of scholarly engagement, which is an inherent challenge in moderating complex discourse. Applying it to the new cases suggests allowing debate on YDIH and Homo naledi interpretations while being skeptical of most Voynich "solutions."
