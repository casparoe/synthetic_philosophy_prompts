  ### Structured In-Class Activity: "Veto at the Cosmic Casino"

  **Objective:** Simulate the tension between expected value (EV) maximization and procedural veto rights, leading to a coordination deadlock over a high-stakes gamble.  
  **Time:** 90 minutes  
  **Participants:** 12 students divided into 3 roles (4 Delegates, 4 Risk-Bearers, 4 Arbitrators).  
  **Token Economy:**  
  - All players start with **20 tokens** (abstract utility points).  
  - **Goal:** Maximize tokens. Top 3 token-holders "win" (e.g., bragging rights, priority in seminar discussions).  
  - **Role bonus:** Players maintaining their role until the end gain +5 tokens. Losing a role forfeits the bonus.  

  **Key Rules:**  
  1. **Threshold rule:** If a player’s tokens fall below **15**, they lose their role (and bonus).  
  2. **Non-compensable risk:** Any gamble risking falling below 15 tokens is "non-compensable."  
  3. **Veto rule:** A single Risk-Bearer veto blocks the gamble unless overruled by Arbitrators.  
  4. **Arbitration constraint:** Arbitrators know outcomes but *not probabilities* (only "vanishingly rare" or "near certain").  

  ---

  ### **Game Structure**  
  *(Conduct 3 sequential rounds; tokens persist across rounds.)*  

  #### **Round 1: Low-Stakes Gamble (EV Maximization Pull)**  
  - **Delegates propose:** "A safe bet: 60% chance to gain 5 tokens, 40% chance to lose 1 token."  
  - **Risk-Bearers:** No veto (loss can’t breach threshold).  
  - **Resolution:** Instructor flips a coin (heads = win, tails = loss; adjust odds mentally to 60/40).  
  - **Outcome:** Update tokens (e.g., +5 or -1).  
  - **Goal:** Normalize EV maximization. Players feel safe pursuing gains.  

  #### **Round 2: Threshold Threat (Veto Tension)**  
  - **Delegates propose:** "A moderate bet: 20% chance to gain 25 tokens, 80% chance to lose 6 tokens."  
    - *EV logic:* Positive EV (0.2×25 + 0.8×−6 = 5 − 4.8 = +0.2).  
    - *Veto trigger:* Loss drops players to 14 tokens (below 15), risking role loss.  
  - **Risk-Bearers:** At least one vetoes (non-compensable risk dominates EV gain).  
  - **Arbitration:**  
    - Delegates describe: "A rare large win, near-certain small loss."  
    - Arbitrators rule *without probabilities*, knowing loss breaches threshold.  
    - **Ruling:** Veto upheld (procedural protection > aggregate utility). Gamble blocked.  
  - **Outcome:** No token change.  

  #### **Round 3: Fanatic Gamble (Deadlock)**  
  - **Delegates propose:** "A cosmic bet: 0.5% chance to gain 1000 tokens, 99.5% chance to lose 6 tokens."  
    - *EV logic:* Strongly positive EV (0.005×1000 + 0.995×−6 = 5 − 5.97 = −0.97? Wait, miscalculation—redo: 0.005×1000 = 5, 0.995×−6 ≈ −5.97, net ≈ −0.97. Fix: Adjust win to **2000 tokens** for *positive* EV: 0.005×2000 = 10, 0.995×−6 ≈ −5.97, net ≈ +4.03).  
    - *Veto trigger:* Loss drops to 14 tokens (non-compensable).  
  - **Deadlock dynamics:**  
    - **Delegates:** Argue EV (+4.03) dwarfs risk. Reveal probabilities? (Rules forbid pre-resolution).  
    - **Risk-Bearers:** Veto unanimously. "Losing our roles for a 0.5% win is unacceptable!"  
    - **Arbitration:**  
      - Delegates: "A vanishingly rare astronomical win, near-certain trivial loss."  
      - Arbitrators: Uphold veto (loss breaches threshold; probabilities irrelevant to legitimacy).  
  - **Outcome:** Gamble blocked. Coordination failure—group forgoes positive EV.  

  ---

  ### **Predicted Deadlock & Recovery**  
  - **What goes wrong:**  
    1. **Delegates** resent vetoes as "irrational," prioritizing EV.  
    2. **Risk-Bearers** feel bullied, invoking veto preemptively.  
    3. **Arbitrators** default to threshold protection, ignoring EV.  
    4. **Group** deadlocks in Round 3: EV maximizers vs. proceduralists.  
  - **Recovery protocol:**  
    - If debate stalls, remind roles: "Arbitrators—rule on risk, not math. Risk-Bearers—defend thresholds. Delegates—advocate for collective gain."  
    - If consensus fails, proceed to arbitration. Deadlock is the pedagogical goal.  

  ---

  ### **Debrief Framework**  
  *(Map moments to theory; 20 minutes)*  

  1. **Relive the deadlock:**  
     - "In Round 3, why did Delegates push the cosmic bet?" *(EV maximization: tiny chance of infinity-like gains)*  
     - "Why did Risk-Bearers veto?" *(Procedural legitimacy: no consent to non-compensable risk, even with EV+)*  
     - "How did Arbitrators justify upholding the veto?" *(Thresholds > probabilities; legitimacy trumps aggregation)*  

  2. **Conceptual bridge:**  
     - **Aggregate-utility reasoning:** Delegates saw tokens as fungible. "Net +4.03 justifies risking role loss."  
     - **Procedural veto:** Risk-Bearers treated the threshold as inviolable rights. "No EV compensates for forced role loss."  
     - **Coordination failure:** EV and veto create incompatible equilibria—no mechanism to reconcile them.  

  3. **Limitation of the activity:**  
     - **Unbounded utility assumption:** The St. Petersburg paradox relies on *unbounded utility* (infinite EV from vanishingly rare infinite gains). Our tokens capped gains at 2000, avoiding true fanaticism.  
       - *Closing remark:* "In unbounded utility models, EV fanaticism demands accepting any non-zero chance of infinite gain, making veto rights catastrophic. But human institutions reject this—hence the deadlock you created."  

  4. **Real-world resonance:**  
     - "This mirrors climate policy (small chance of catastrophe = veto) or AI risk (infinity stakes vs. procedural caution)."  

  ---

  ### **Logistics**  
  - **No materials:** Token tracking via public whiteboard (player 1: 20 → 19 → ...).  
  - **Randomization:** Instructor uses mental coin flips (e.g., "I’ll imagine a 1-100 die roll; 1-5 = win").  
  - **Role prep:** Print role sheets:  
    - **Delegates:** "Propose gambles. Maximize total tokens. Reveal probabilities *only* if gamble runs."  
    - **Risk-Bearers:** "Veto any gamble risking your threshold (<15 tokens). No probability math."  
    - **Arbitrators:** "Uphold veto if loss breaches threshold. Probabilities unknown; focus on rights."  

  This design forces a visceral clash: EV logic feels "obvious" until vetoes protect individual integrity. The debrief exposes how procedural rights disrupt fanaticism—even when EV+ is mathematically sound.
