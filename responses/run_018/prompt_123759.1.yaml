answer: |-
  Your observation captures a subtle yet crucial distinction in how science handles counterexamples. You're describing two distinct protective strategies with different epistemic consequences—**Taxonomic Refinement** and **Retroactive Domain Immunization**. Neither is identical to the grue paradox or classical ad hoc adjustments, though they share family resemblances. Here's a structured analysis:

  ### 1. **Taxonomic Refinement (Biological Example)**  
     - **Mechanism**: When a counterexample violates a generalization (e.g., "All fish lay eggs"), the original category is subdivided ("Most fish are oviparous, but subclass Elasmobranchii includes viviparous species").  
     - **Epistemic Status**:  
       - **Progressive**: Expands explanatory power by creating new categories/predictions (e.g., "Viviparous fish likely share traits X, Y").  
       - **Non-ad hoc**: The subdivision is independently testable (e.g., genetic/phylogenetic evidence supports the new subclass).  
       - **Lakatosian "Progressive Problem Shift"**: Aligns with Lakatos' view of scientific programs that generate novel facts.  
     - **Boundary**: Falsifies the *unqualified* generalization but preserves its core by refining ontology.  

  ### 2. **Retroactive Domain Immunization (Meteorological Example)**  
     - **Mechanism**: After a failed prediction (e.g., "No cyclones cross latitude L in summer"), an unstated exception is appended ("...except under anomalous conditions"). Crucially:  
       - The exception is formulated *post-hoc* using the counterexample itself.  
       - No new testable structure is added; the "anomaly" is defined by the failure.  
     - **Epistemic Status**:  
       - **Degenerative**: Immunizes the model against future falsification without adding predictive content.  
       - **Quasi-ad hoc**: Unlike auxiliary hypotheses (e.g., "Planetary retrograde requires epicycles"), it lacks independent criteria for identifying "anomalies" beforehand.  
       - **Hempel's "Covering-Law" Violation**: Evades the requirement that explanations specify antecedent conditions.  
     - **Boundary**: Preserves the model's *form* but reduces its empirical content. It risks becoming unfalsifiable.  

  ### 3. **Contrast with Classic Concepts**  
     - **Grue Paradox**: Involves predicates with built-in temporal instability (e.g., "grue = green before 2050, blue after"). Your cases lack this explicit time-dependency.  
     - **Duhem-Quine Problem**: Both involve holistic theory protection, but:  
       - Taxonomic refinement *resolves* Duhem-Quine by adding specificity.  
       - Retroactive immunization *exacerbates* it by hiding in auxiliary assumptions.  
     - **Ad Hoc Adjustments**:  
       - Taxonomic refinement is **non-ad hoc** if subclasses yield new predictions.  
       - Retroactive immunization is **ad hoc** if "anomaly" is a mere label for the failure.  

  ### 4. **Are These the Same Phenomenon?**  
     - **Superficial Similarity**: Both protect generalizations post-failure.  
     - **Deep Difference**:  
       | **Feature**               | Taxonomic Refinement               | Retroactive Immunization          |  
       |---------------------------|-----------------------------------|-----------------------------------|  
       | **Ontology Change**       | Creates new categories            | Preserves existing categories     |  
       | **Predictive Novelty**    | Generates new hypotheses          | Adds no testable content          |  
       | **Falsifiability**        | Increases (specifies boundaries)  | Decreases (hides boundaries)      |  
       | **Epistemic Integrity**   | Scientifically legitimate         | Methodologically suspect         |  

  ### 5. **Naming Recommendations**  
     - **Taxonomic Refinement** is well-established (e.g., in Boyd's "Natural Kinds" literature).  
     - **Retroactive Domain Immunization** has no universal label but aligns with:  
       - Lakatos' "degenerating problem shifts" (distinct from ad hoc adjustments).  
       - Hempel's critique of "explanation by postulation."  
     - For clarity, frame them as:  
       - **Progressive Category Specialization** vs. **Degenerative Domain Restriction**.  

  ### Conclusion  
  You’ve identified **two distinct protective strategies** with divergent epistemological implications. Taxonomic refinement is a legitimate engine of scientific progress (e.g., cladistics in biology). Retroactive immunization is a pathology of inductive reasoning that undermines empirical accountability. Neither has a perfect pre-existing label, but their boundaries are sharp: one *enriches* science’s conceptual toolkit; the other *impoverishes* its testability. Both reveal how science navigates anomalies—either by evolving its ontology or retreating into unfalsifiability.  

  For your seminar, emphasize that **the key distinction lies in whether the adjustment generates independent testable consequences**. This separates virtuous refinement from vicious immunization.
