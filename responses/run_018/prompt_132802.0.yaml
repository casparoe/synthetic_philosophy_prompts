  The first two points seem solid. Russell indeed argued phrases like "the present king of France" aren't names but quantifiers - that's textbook Russell. And his solution to "the king doesn't exist" as "nothing uniquely kings France" is correct. No issues there.

  Now the tricky part: her take on belief reports. She mentions primary/secondary occurrences but then jumps to "belief is never object-directed." That's the red flag. Russell's scope distinction was technical machinery to avoid ambiguities, not a philosophical claim about belief nature. He absolutely thought we could have object-directed beliefs - his whole 1911 paper on acquaintance proves that. She's confusing scope mechanics with ontology of belief.

