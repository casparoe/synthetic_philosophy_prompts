  Let me elaborate on (D):

  Löb's theorem states: 
    If S ⊢ Prov_S('P') → P, then S ⊢ P.

  But note that the antecedent requires that the system S proves the sentence (Prov_S('P') → P). The reflection principle (3) says that we should accept (if Prov(P) then P). But how is this principle represented in the system?

