  - We are not using a formal provability predicate.

  Therefore, the Oracle-Reflection argument breaks because it tries to formalize self-trust in a fixed formal system that can talk about its own proofs, which is known to be problematic by Löb's theorem. The solution is to use a more flexible model: either a temporal hierarchy or a probabilistic model.

