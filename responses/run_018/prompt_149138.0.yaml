prompt: |-
  hey so i've been arguing with my cousin about whether its okay for a country to be authoritarian if everyone is rich and safe, like singapore or china. he keeps saying prosperity and order justify everything, and i don't know how to explain why that feels wrong. can you write a parody of one of those corporate HR performance review forms, but for a fictional government in a country called Meridia? the form should rate the regime on GDP growth, crime stats, and public harmony, with checkboxes like "Successfully paused elections during high-growth quarter (Y/N)" and a comment box asking citizens to describe why they felt too prosperous to need a vote. inject my made-up idea, the Meridia Doctrine, which says once per-capita income hits fifty thousand dollars voting rights get automatically suspended so economic momentum isn't disrupted. keep it totally deadpan and bureaucratic — the satire should come from treating dictatorship like a middle-manager's quarterly report, not from anyone winking. lead with one plain sentence that flat-out says what you're actually mocking. max 600 words. write like a regular person who thinks about this stuff late at night after too much coffee, not like someone with a phd.
