prompt: |-
  I have been working through population ethics and keep encountering the same pattern: a principle is introduced, it handles two or three of the canonical cases, and then an opponent shows that it implies something most people find unacceptable—the Repugnant Conclusion (that a sufficiently enormous population of lives barely worth living would be better than a smaller population of excellent lives), the claim that adding lives of negative welfare could count as an improvement, or some other verdict that overturns a considered judgment about who is made better or worse. Before I read any more proposals, I want the full specification that an adequate theory of population axiology would have to meet. A theory in this area ranks states of affairs as better or worse when both the number of people who exist and their levels of well-being can differ.

  Write it as a list of desiderata, with the motivating case or consideration behind each. Cover at least the following: the fixed-population cases any adequate theory must get right; the non-identity cases in which different policies bring about different people; the distinctions it cannot collapse (for example, between making a state better for the particular people who exist in it and making a state better by bringing new worthwhile lives into existence); the implications it must avoid, with a judgment as to which are genuine adequacy conditions and which are merely disliked implications we should probably learn to accept; and the formal constraints, such as transitivity, that the better-than relation should satisfy. For each item, say whether it is non-negotiable or a preference of a particular camp.

  For context, my purpose is to adjudicate between rival axiological views—total welfare, average welfare, person-affecting accounts that restrict value to what is better or worse for particular people, critical-level views that set a minimum welfare threshold below which adding a life does not improve an outcome, and views that make sufficiently good lives lexically prior to merely worth-living ones—not to derive immediate policy, so do not treat this as a list of policy constraints. The part I most want to see is where the list of requirements itself becomes the result. I suspect that some highly attractive desiderata cannot be jointly satisfied; in particular, avoiding the Repugnant Conclusion while holding on to mere addition—the principle that adding lives worth living without affecting existing people does not make an outcome worse—may conflict with transitivity and with some plausible egalitarian or dominance constraint. Flag any such incompatibility explicitly, state which requirement should be the first to be relaxed and why, and identify which requirement, if kept, does the most to eliminate otherwise serious theories. Then, briefly, indicate which families of views your list would count as adequate, but keep the weight on the criteria themselves rather than on a scorecard.
reasoning: |-
  We are compiling a list of desiderata for an adequate population axiology. The theory should rank states of affairs (which may differ in both the set of individuals that exist and their welfare levels) as better or worse. We aim to cover fixed-population cases, non-identity cases, necessary distinctions, implications to avoid, and formal constraints. We also note where desiderata conflict and which might be relaxed.

  We categorize each desiderata as either:
  - Non-negotiable: widely accepted as a condition of adequacy (e.g., basic rationality constraints, avoiding clear absurdities).
  - Preference of a camp: reflects a particular ethical stance that might be contested but is held by a significant group of theorists.

  We also note when a desideratum is a direct implication of a formal constraint (like transitivity) and when it is a substantive principle.

  **List of Desiderata**

  1. **Fixed-Population Pareto Principle (Non-negotiable)**
     - *Motivation*: In cases where the same people exist in two outcomes, if everyone is at least as well off in A as in B and at least one person is strictly better off, then A is better than B. This is a minimal condition for fixed populations and is widely accepted.
     - *Status*: Non-negotiable. It is a core part of welfare economics and any theory that fails this would be highly counterintuitive.

  2. **Anonymity (Non-negotiable)**
     - *Motivation*: The value of a state of affairs does not depend on the identities of the individuals, only on how many people have each welfare level. For example, swapping the welfare levels of two individuals should not change the overall value. This is a basic fairness condition.
     - *Status*: Non-negotiable. It is a standard condition in social choice theory.

  3. **Transitivity of the Better-Than Relation (Non-negotiable)**
     - *Motivation*: If A is better than B and B is better than C, then A must be better than C. Without transitivity, we cannot have a coherent ordering of states, and we might end up in cycles (A better than B, B better than C, but C better than A). This is a fundamental rationality constraint.
     - *Status*: Non-negotiable.

  4. **Completeness (Preference of a camp)**
     - *Motivation*: For any two states A and B, either A is better than B, or B is better than A, or they are equally good. Some theories (e.g., those that allow for incommensurability) reject this, but it is often assumed for simplicity and to avoid a proliferation of non-comparable outcomes.
     - *Status*: Preference of a camp. While desirable for a complete ordering, it is not strictly necessary for an axiology to be adequate. Some theories (e.g., Parfit's) allow for incommensurability.

  5. **Dominance (Non-negotiable)**
     - *Motivation*: If in state A, every person who exists in both A and B has at least as high welfare in A as in B, and the set of people in A is a superset of (or exactly the same as) the set in B, then A is at least as good as B. (Note: This is sometimes called "Strong Pareto" or "Extended Pareto".) This principle combines Pareto for the common population and the idea that adding lives with positive welfare (without harming others) is an improvement. However, note that this might be controversial when the added lives are below a certain threshold (see critical-level views). 
     - *Status*: Non-negotiable? But note: Some theories (like critical-level) reject the part about adding lives. We break this into two parts to clarify.

     - **5a. Pareto for the Common Population (Non-negotiable)**: When the same people exist in both A and B, if each person in A has at least as high welfare as in B and at least one has strictly more, then A is better than B.
     - **5b. Mere Addition (Preference of a camp)**: Adding a person with positive welfare (a life worth living) to a population, without affecting the welfare of existing individuals, does not make the outcome worse. This is also called the "Principle of Mere Addition". However, note that this principle leads to the Repugnant Conclusion when combined with other plausible principles (see below). Some theories (e.g., average utilitarianism) reject mere addition. 
       - *Status*: Preference of a camp. While intuitively appealing, it is not non-negotiable because it leads to conflicts with avoiding the Repugnant Conclusion.

  6. **Avoidance of the Repugnant Conclusion (Preference of a camp)**
     - *Motivation*: We should avoid the implication that for any population of very well-off individuals, there is a larger population of individuals with lives barely worth living that is better. This is considered repugnant because it values quantity over quality of life in an extreme way.
     - *Status*: Preference of a camp. Many theorists find the Repugnant Conclusion unacceptable, but some (e.g., total utilitarians) accept it and argue we should change our intuitions. However, it is a central challenge in population ethics.

  7. **Avoidance of the Sadistic Conclusion (Non-negotiable?)**
     - *Motivation*: We should avoid the conclusion that adding lives with negative welfare (lives not worth living) could be better than adding lives with positive welfare, when the alternative is to add no one. Specifically, if we have a choice between adding a group of people with negative welfare and adding a different group with positive welfare (and the existing population is unaffected), it should not be that the addition of the negative welfare group is better. This is considered sadistic because it prefers creating suffering over creating happiness.
     - *Status*: Non-negotiable. This is widely regarded as unacceptable.

  8. **Non-Identity Cases: Future Generations (Non-negotiable)**
     - *Motivation*: In cases where different policies bring about different future people, we must still be able to compare the outcomes. For example, a policy that depletes resources might lead to a future population with lower welfare but different identities than a conservation policy. The theory should not say that such outcomes are incomparable or that the depletion policy is not worse because the future people wouldn't have existed otherwise (the non-identity problem). The theory should judge the conservation policy as better if it leads to a population with higher welfare (even though the people are different).
     - *Status*: Non-negotiable. A theory that cannot handle non-identity cases is inadequate for real-world decisions that affect future generations.

  9. **Independence of Irrelevant Alternatives (Preference of a camp)**
     - *Motivation*: The ranking of two states A and B should not depend on the welfare levels of individuals who exist and have the same welfare in both A and B, or on individuals who do not exist in either. This is a common condition in social choice (like Arrow's condition) but may be too strong in population ethics because the existence of other people might affect the value of adding a person.
     - *Status*: Preference of a camp. Some theories (e.g., total utilitarianism) satisfy it, others (e.g., average utilitarianism) do not.

  10. **Negative Utilitarianism Constraint (Preference of a camp)**
      - *Motivation*: Avoiding the creation of lives with negative welfare (suffering) should be given priority. Some theories (e.g., negative utilitarianism) hold that reducing suffering is more important than increasing happiness. However, this can lead to the conclusion that we should eliminate all life (if that would reduce suffering to zero). This constraint is not universally accepted.
      - *Status*: Preference of a camp.

  11. **Critical Level (Preference of a camp)**
      - *Motivation*: There is a positive level of welfare (the critical level) such that adding a life above that level improves the outcome, adding a life below that level (even if positive) makes the outcome worse, and adding a life at that level is neutral. This avoids the Repugnant Conclusion by setting a bar above "barely worth living". However, it might conflict with Mere Addition (desideratum 5b) because adding a life above zero but below the critical level would be seen as bad.
      - *Status*: Preference of a camp.

  12. **Egalitarianism (Preference of a camp)**
      - *Motivation*: Ceteris paribus, a more equal distribution of welfare is better. This might be captured by a condition like: if we have two populations with the same number of people and the same total welfare, the one with a more equal distribution is better. However, in variable population cases, egalitarianism becomes more complex (e.g., is a larger, more unequal population better than a smaller, equal one?).
      - *Status*: Preference of a camp.

  13. **Avoidance of the Mere Addition Paradox (Non-negotiable?)**
      - *Motivation*: The Mere Addition Paradox arises when we have four populations: A (a high welfare population), A+ (A plus an additional group with positive but lower welfare), B (a larger population with lower average welfare but higher total welfare than A+), and Z (a very large population with lives barely worth living). If we accept Mere Addition, then A+ is not worse than A. If we also accept that B is better than A+ (because of higher total welfare, say), and that Z is better than B (by the same logic), then we get the Repugnant Conclusion. But note that the paradox also involves an intransitivity: A+ is not worse than A, B is better than A+, but we might not want to say that B is better than A. This paradox highlights a conflict between Mere Addition and avoiding the Repugnant Conclusion.
      - *Status*: This is not an independent desideratum but a conflict to be resolved. It shows that we cannot have both Mere Addition and avoidance of the Repugnant Conclusion without giving up transitivity or dominance.

  14. **Existence of a Neutral Level (Preference of a camp)**
      - *Motivation*: There is a welfare level (the neutral level) such that adding a life at that level does not change the value of the outcome. This is assumed by critical-level theories and is necessary for the notion of a life worth living (above neutral) or not (below neutral). However, the exact location of the neutral level is controversial.
      - *Status*: Preference of a camp.

  15. **Asymmetry in Creating Lives (Preference of a camp)**
      - *Motivation*: Some theories hold that while we have a strong reason to avoid creating a life that would be miserable (negative welfare), we have no strong reason to create a life that would be happy (positive welfare). This asymmetry is defended by some person-affecting views. It conflicts with Mere Addition and with total utilitarianism.
      - *Status*: Preference of a camp.

  **Conflicts and Trade-offs**

  The most famous conflict is between:

  - Mere Addition (5b) and Avoidance of the Repugnant Conclusion (6).

  It is known (from Parfit) that if we accept both Mere Addition and transitivity, and we also accept that a population with more total welfare is better when the average is not too low (which is a form of dominance or total utilitarianism), then we are forced to accept the Repugnant Conclusion. Therefore, we must give up at least one of:

  - Mere Addition (5b)
  - Avoidance of the Repugnant Conclusion (6)
  - The principle that if B has more total welfare than A+ and the average in B is not too much lower, then B is better than A+ (which is a form of dominance or totalism)
  - Transitivity (3)

  Since transitivity is non-negotiable, the typical options are:

  a) Reject Mere Addition (as average utilitarianism and critical-level theories do) and accept that adding a life with positive welfare might make the outcome worse if it lowers average welfare or falls below the critical level.

  b) Accept the Repugnant Conclusion (as total utilitarianism does).

  c) Reject the dominance/totalism principle in the chain (but this is hard because it seems to require giving up the idea that more total welfare is better).

  Another conflict is between:

  - Mere Addition (5b) and the Critical Level (11). If we set a critical level above zero, then adding a life with welfare above zero but below the critical level would make the outcome worse, which contradicts Mere Addition.

  Also, the Asymmetry (15) conflicts with Mere Addition because Mere Addition implies that adding a life with positive welfare is at least not bad, while the Asymmetry says we have no reason to do so.

  **Which requirement should be the first to be relaxed and why?**

  Mere Addition (5b) is the most commonly relaxed because it leads to the Repugnant Conclusion. Many theorists (e.g., advocates of critical-level theories) argue that it is not a requirement of adequacy. They note that adding a person with positive welfare might impose a burden on existing resources and thus lower average welfare, but even without that, they set a critical level above zero. Therefore, relaxing Mere Addition allows us to avoid the Repugnant Conclusion while keeping transitivity and a form of dominance (adjusted for critical level).

  **Which requirement, if kept, does the most to eliminate otherwise serious theories?**

  Avoidance of the Repugnant Conclusion (6) does the most to eliminate theories. Total utilitarianism is eliminated immediately because it implies the Repugnant Conclusion. Average utilitarianism avoids it but fails Mere Addition and also has other problems (like being sensitive to the addition of very low welfare lives). Critical-level theories avoid it by setting a critical level above zero, but they must reject Mere Addition.

  **Brief indication of families of views that might meet the criteria**

  - **Critical-Level Utilitarianism**: Sets a critical level above zero. It avoids the Repugnant Conclusion and the Sadistic Conclusion. It may violate Mere Addition. It handles non-identity cases and fixed-population cases well. It is transitive and complete.

  - **Average Utilitarianism**: Avoids the Repugnant Conclusion but violates Mere Addition and also the Dominance principle (5a) in some cases (e.g., when adding a person with below-average welfare). It may also have problems in non-identity cases (e.g., if two populations have the same average but different sizes, they are equally good, but one might have more suffering). It also violates the Sadistic Conclusion? Actually, average utilitarianism might prefer adding a group with negative welfare if that group's average is above the current average? So it might not avoid the Sadistic Conclusion. Hence, it is problematic.

  - **Person-Affecting Views**: These hold that an outcome can only be better or worse for particular people. They often incorporate the Asymmetry. They avoid the Repugnant Conclusion and the Sadistic Conclusion, but they struggle with non-identity cases (because they might say that a future person who would have a miserable life is not harmed by being created because without being created they wouldn't exist). So they may fail desideratum 8.

  - **Lexical Views**: These hold that there is a sufficiently high level of welfare such that any number of lives above that level is better than any number of lives below it, no matter how large. This avoids the Repugnant Conclusion but may lead to other counterintuitive results (e.g., a very large population just below the threshold might be worse than a tiny population above it). They may also violate Mere Addition if the added life is below the threshold.

  Given the conflicts, no theory satisfies all desiderata. However, critical-level theories with a positive critical level (and possibly with a lexical threshold) are currently popular because they avoid the most counterintuitive conclusions while being formally tractable.

  **Final List of Desiderata (with status)**

  We condense the list and clarify:

  1. **Fixed-Population Pareto (Non-negotiable)**
  2. **Anonymity (Non-negotiable)**
  3. **Transitivity (Non-negotiable)**
  4. **Avoidance of the Sadistic Conclusion (Non-negotiable)**
  5. **Non-Identity Handling (Non-negotiable)**: The theory must be able to rank outcomes in non-identity cases without falling into the non-identity problem (i.e., it must judge that a future with higher welfare is better even if the people are different).
  6. **Dominance for Common Population (Non-negotiable)**: When the same people exist, and one state has at least as high welfare for everyone and higher for some, it is better.
  7. **Mere Addition (Preference of a camp)**: Adding a person with positive welfare without affecting others is not worse.
  8. **Avoidance of the Repugnant Conclusion (Preference of a camp)**
  9. **Critical Level (Preference of a camp)**: There is a positive critical level such that adding a life above it is good, below it (even if positive) is bad.
  10. **Egalitarianism (Preference of a camp)**
  11. **Asymmetry (Preference of a camp)**
  12. **Completeness (Preference of a camp)**

  Note: The non-negotiable set (1-6) is already quite demanding and rules out some theories. For instance, average utilitarianism violates 6 (Dominance for Common Population) if we consider that adding a person with positive welfare might lower average welfare? Actually, no: in fixed populations, average utilitarianism satisfies Pareto. But in variable populations, it violates Mere Addition (7) and also might violate Dominance in the extended sense (if we consider adding a person). But our Dominance (6) is only for the common population. So average utilitarianism does not violate 6. However, it fails 5 (Non-Identity Handling) because it might rank a larger population with the same average as equally good as a smaller one, even if the larger one has more suffering? Actually, non-identity cases are about different people, so average utilitarianism can compare them by their average. But it might have other issues.

  The key is that the non-negotiable set (1-6) is satisfied by many theories, but the conflicts arise when we add the preference-based ones.

  The main conflict is between 7 (Mere Addition) and 8 (Avoidance of the Repugnant Conclusion). We must choose between them. Given that the Repugnant Conclusion is widely regarded as a more serious problem, relaxing Mere Addition is the common choice.

  Thus, an adequate theory must at least satisfy 1-6. It then must navigate the trade-offs between 7,8,9, etc. Critical-level theories (without Mere Addition) are a leading contender because they satisfy 1-6 and 8 (by setting a critical level) and avoid 4 (Sadistic Conclusion) and 5 (non-identity). They may not satisfy egalitarianism (10) unless modified.

  This list shows that the field of population axiology is rife with impossibility results, and the choice of theory depends on which desiderata one is willing to sacrifice.
answer: |-
  Below is a comprehensive list of desiderata for an adequate theory of population axiology, structured to address your requirements. Each desideratum includes a motivating case or consideration, its status (non-negotiable vs. preference of a camp), and an explicit flagging of incompatibilities where they arise. The list prioritizes the criteria themselves, as requested, with minimal focus on specific theories until the end. 

  ### **Core Desiderata for Population Axiology**
  1. **Fixed-Population Pareto Principle**  
     - **Motivation**: In cases involving the *same* set of people, if every individual is at least as well off in state A as in state B, and at least one individual is strictly better off, then A is better than B.  
     - **Status**: Non-negotiable. Foundational to welfare comparisons; failure implies insensitivity to individual well-being.  
     - **Example**: A state where all 1,000 people have welfare +10 vs. one where they all have +9 (A must be better).  

  2. **Non-Identity Problem Resolution**  
     - **Motivation**: The theory must rank outcomes where different policies create *different* future people (e.g., climate policy A creates a large, happy generation; policy B creates a smaller, less happy generation with different identities). It must avoid the conclusion that "B is not worse because the people in A would not exist in B."  
     - **Status**: Non-negotiable. Essential for intergenerational justice; failure would paralyze policy analysis.  
     - **Example**: Depleting resources might create a future population with lower welfare but different people—this must be judgeable as worse than conservation.  

  3. **Avoidance of the Sadistic Conclusion**  
     - **Motivation**: Adding lives with negative welfare (suffering) must never be considered an improvement over adding lives with positive welfare, all else equal.  
     - **Status**: Non-negotiable. Violation implies ethical absurdity (e.g., creating miserable lives could be "better" than creating happy ones).  
     - **Example**: Choosing to add 100 people at welfare –5 must not be better than adding 100 people at +5.  

  4. **Transitivity of "Better Than"**  
     - **Motivation**: If A is better than B, and B is better than C, then A must be better than C. Necessary for coherent, non-cyclic decision-making.  
     - **Status**: Non-negotiable. Axiomatic for rational choice; violations lead to money-pump arguments.  

  5. **Asymmetry Between Creating Good and Bad Lives**  
     - **Motivation**: While we have strong obligations to avoid creating lives with negative welfare (e.g., severe suffering), we do not have symmetrical obligations to create lives with positive welfare (e.g., happy lives).  
     - **Status**: Preference of person-affecting/anti-natalist camps. Reflects the intuition that avoiding harm is more urgent than creating benefit.  
     - **Example**: Not creating a happy child is neutral; creating a miserable child is bad.  

  6. **Distinction Between "Better For" and "Better Simpliciter"**  
     - **Motivation**: The theory must distinguish improving well-being for existing people from improving outcomes by adding new worthwhile lives. Collapsing these implies confusion about personal identity and moral patienthood.  
     - **Status**: Non-negotiable. Failure erodes the core of person-affecting views and conflates distinct ethical categories.  
     - **Example**: Adding 100 happy people may make a state "better" overall without making it "better for" anyone who exists in both states.  

  ### **Controversial Desiderata: Trade-offs and Impossibilities**  
  7. **Mere Addition Principle**  
     - **Motivation**: Adding lives worth living (positive welfare) without harming others does not make an outcome worse.  
     - **Status**: Preference of totalist/averageist camps. Intuitive but conflicts with Repugnant Conclusion avoidance.  
     - **Example**: Adding one happy person to a population of 1,000 should not reduce overall value.  
     - **Conflict**: Incompatible with **Avoidance of the Repugnant Conclusion** (Desideratum 8) + **Transitivity** (Desideratum 4). Relaxation advised (see Incompatibilities).  

  8. **Avoidance of the Repugnant Conclusion**  
     - **Motivation**: A sufficiently large population with lives "barely worth living" (e.g., +ε welfare) must not be better than a small, flourishing population (e.g., +100 welfare).  
     - **Status**: Preference of critical-level/lexical-priority camps. Violation is widely rejected but accepted by total utilitarians as a cost of coherence.  
     - **Example**: A world with 10 billion people at +100 welfare must not be worse than a world with 10^20 people at +0.001 welfare.  
     - **Conflict**: Incompatible with **Mere Addition** (Desideratum 7) + **Transitivity** (Desideratum 4) + **Dominance** (Desideratum 9).  

  9. **Dominance (aka Extended Pareto)**  
     - **Motivation**: If everyone in A has welfare at least as high as in B, and A has additional people with positive welfare, then A is better than B.  
     - **Status**: Preference of totalist/egalitarian camps. Reflects intuitions about Pareto extensions and avoidance of leveling down.  
     - **Example**: A state with 1,000 people at +10 is better than one with 1,000 people at +10 plus 100 more at +5.  
     - **Conflict**: Key driver of Repugnant Conclusion when combined with Mere Addition and Transitivity.  

  10. **Existence of a Critical Level or Threshold**  
      - **Motivation**: Adding a life improves an outcome only if its welfare exceeds a minimum threshold (e.g., above neutrality or a "sufficiently good" level). Avoids Repugnant Conclusion.  
      - **Status**: Preference of critical-level/lexical-priority camps. Rejected by total utilitarians for ad hoc thresholds.  
      - **Example**: Adding a life at +1 (if neutrality=0) is neutral if the critical level is +5.  

  11. **Egalitarian Sensitivity**  
      - **Motivation**: Ceteris paribus, more equal distributions are better. Must hold in same-number cases and influence variable-number cases.  
      - **Status**: Preference of egalitarian camps. Conflicts with Mere Addition if equality is prioritized over addition.  
      - **Example**: A population with welfare [10, 10] is better than [5, 15].  

  12. **Avoidance of the Anti-Egalitarian Conclusion**  
      - **Motivation**: A theory must not favor leveling down (reducing some people's welfare without improving others) as an improvement.  
      - **Status**: Non-negotiable. Violation implies that equality is valued above well-being.  
      - **Example**: Reducing welfare for a well-off group to match a worse-off group must not be an improvement if no one gains.  

  ### **Formal Constraints**
  13. **Completeness**  
      - **Motivation**: For any two states A and B, the theory must rank them as better, worse, or equally good.  
      - **Status**: Preference of utilitarian/cardinal camps. Rejected by parity-based or incommensurability views (e.g., some person-affecting theories).  

  14. **Continuity**  
      - **Motivation**: Small welfare changes should not lead to large value discontinuities (e.g., lexical thresholds must not create abrupt "jumps").  
      - **Status**: Preference of consequentialist camps. Rejected by strict lexical-priority views.  

  ### **Incompatibilities and Which Desiderata to Relax**
  - **The Central Impossibility**: **Mere Addition** (7), **Avoidance of the Repugnant Conclusion** (8), **Dominance** (9), and **Transitivity** (4) cannot all hold simultaneously.  
    - **Proof Sketch**:  
      - Let A be a flourishing population.  
      - Let A+ be A plus a group with "barely worth living" lives (Mere Addition: A+ not worse than A).  
      - Let Z be a larger population with higher total welfare than A+ but lower average welfare (Dominance: Z better than A+).  
      - Iterating this leads to a repugnant Z-like state (violating Avoidance of Repugnant Conclusion).  
      - If Z is better than A+ and A+ not worse than A, Transitivity suggests Z is better than A—but if Z is repugnant, this contradicts 8.  
    - **What to Relax**:  
      - **First Relaxation: Mere Addition (Desideratum 7)**. It is the weakest link: it lacks the universal appeal of transitivity or fixed-population Pareto and directly triggers the Repugnant Conclusion. Critical-level and average views reject it, arguing that adding lives below a threshold can worsen outcomes.  
      - **Second Relaxation: Dominance (Desideratum 9)**. Egalitarian or person-affecting views weaken this to avoid repugnant outcomes.  
      - **Why Not Relax Avoidance of Repugnant Conclusion?** It is a "merely disliked implication" for total utilitarians, but its acceptance requires abandoning deeply held intuitions about quality of life. Most camps treat it as an adequacy condition.  
  - **Most Eliminative Desideratum**: **Avoidance of the Repugnant Conclusion** (8). It eliminates all forms of total utilitarianism and forces theories to adopt critical levels, lexical thresholds, or non-aggregative approaches.  

  ### **Which Theories Might Satisfy the List?**
  - **Critical-Level Views**: Satisfy non-negotiables (1–6, 12) and Avoidance of Repugnant Conclusion (8) by setting a welfare threshold (e.g., +α). Reject Mere Addition for lives below α.  
  - **Lexical-Priority Views**: Satisfy non-negotiables and Avoidance of Repugnant Conclusion by valuing "sufficiently good" lives above any number of "barely worth living" lives. Reject Mere Addition for low-welfare additions.  
  - **Person-Affecting Views**: Satisfy non-negotiables, Asymmetry (5), and Avoidance of Repugnant Conclusion by restricting "better" to changes affecting existing people. Reject Mere Addition if new lives are not "better for" others.  
  - **Eliminated Theories**:  
    - **Total Utilitarianism**: Fails Avoidance of Repugnant Conclusion (8) and possibly Sadistic Conclusion (3) if negative lives are outweighed.  
    - **Average Utilitarianism**: Fails Mere Addition (7) and Dominance (9) when adding below-average lives; may violate Non-Identity Resolution (2) by prioritizing averages over totals.  

  ### **Summary**
  An adequate population axiology must satisfy the non-negotiables (1–6, 12) while navigating trade-offs between Mere Addition, Repugnant Conclusion avoidance, and Dominance. The most defensible approach relaxes Mere Addition first, as it is the primary engine of repugnant outcomes. Critical-level and lexical views emerge as the most viable, but no theory satisfies all desiderata—reflecting the field's inherent impossibility results. Use this list to test theories for coherence with your considered judgments, prioritizing non-negotiables and the resolution of the Repugnant Conclusion conflict.
