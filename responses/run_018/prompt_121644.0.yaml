answer: |-
  Here is the translation and residue analysis as requested:

  **Thucydides Translated via Behavioral Economics/Org Psychology:**  
  Athenian collective decision-making exhibits recurrent failure modes:  
  1.  **Mytilene Reversal:** Initial punitive consensus forms via **affect heuristic** (anger at rebellion). Diodotus counters Cleon not with superior data but by triggering an **information cascade** favoring mercy through rhetorical reframing, exploiting latent **preference falsification** (many silently feared excessive harshness but conformed to Cleon’s emotional framing initially).  
  2.  **Sicilian Expedition:** Nicias’s risk assessment fails due to **rational ignorance** (voters disengaged from complex logistical realities) and **group polarization**. Alcibiades’s rhetoric amplifies aspirational biases, triggering an **affect heuristic** (greed, ambition) that overrides strategic analysis. The assembly’s escalating enthusiasm reflects polarized shift toward extreme risk-taking.  
  3.  **Socratic Condemnation:** Persistent philosophical dissent is misclassified as civic threat via **affect heuristic** (fear/resentment of criticism). The epistemic bubble of Athenian identity construction treats questioning as informational threat. Formal charges enable **preference falsification**, allowing latent hostility toward intellectual disruption to manifest as punitive consensus.

  **Residue Report:**  

  | Case                | Mapping Fit                                                                 | Residue Description                                                                                                                                 | Nature of Residue                                                                                                |
  | :------------------ | :-------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------- |
  | **Mytilene Reversal** | Clean mapping to **preference falsification**, **affect heuristic**, **information cascade**. | Thucydides emphasizes the *moral stakes* of the reversal – not just preference shift, but the assembly confronting its own capriciousness and the fragility of justice. | Expresses **collective responsibility**: Modern terms describe mechanism, not the existential weight of the demos judging its own impulsive authority. |
  | **Sicilian Expedition** | Clean mapping to **group polarization**, **affect heuristic**, **rational ignorance**. | Nicias’s failed appeal relies on *technical expertise* (logistics, resources) being dismissed as cowardice. The demos actively *rejects expertise* as incompatible with democratic courage/ambition. | Reveals **civic identity conflict**: "Courage" vs. "caution" aren't just preferences but constitutive values of Athenian identity. Behavioral models lack this normative dimension of civic self-definition. |
  | **Socratic Condemnation** | Partial mapping to **affect heuristic**, **epistemic bubble**, **preference falsification**. | Socrates’s dissent isn't merely "contrarian information"; it challenges the *metaphysical foundations* of civic piety and shared meaning. His trial embodies the polis’s *authority to define truth/corruption*. | Expresses **democratic authority’s normative boundary**: The power to exclude/question is central to maintaining the civic mythos. Modern terms reduce this to bias, omitting legitimacy’s dependence on controlling dissent. |

  **Assessment of Residue:**  
  The residue reveals **genuine gaps in behavioral economics/psychology**:  
  1.  **Normative Vacuum:** Behavioral terms are *descriptive/explanatory* but lack tools to analyze the *legitimacy conflicts* inherent in Thucydides. The tension between strategic rationality and democratic values (courage, piety, collective self-rule) is central. Models capture *how* decisions fail, not *why* specific failures threaten the polity’s self-understanding.  
  2.  **Civic Ontology:** Concepts like "epistemic bubble" describe information flow, not how dissent challenges the *constitutive myths* binding the collective. Socrates threatens Athenian civic ontology itself – a dimension absent in models focused on cognitive biases.  
  3.  **Authority & Responsibility:** The residue highlights democracy’s unique pathology: its *authority* derives from collective wisdom, yet its *failures* are collective responsibilities. Behavioral models treat groups as error-prone systems; Thucydides shows the demos agonizingly *aware* of its fallibility (e.g., post-Mytilene reflection). This normative self-awareness has no counterpart.  

  **Conclusion on Pathologies:** The residue suggests Thucydides *is* describing pathologies amplified by, but **not unique to**, democratic rule. The core mechanisms (affect heuristic, polarization, cascades) are universal group dynamics. However, the *stakes* are heightened in democracy because:  
  -   **Legitimacy is performative:** Democratic authority relies on perceived collective wisdom. Failures visibly undermine legitimacy in ways autocratic failures do not.  
  -   **Identity is participatory:** Civic values are enacted through assembly decisions, making irrationality a crisis of self-definition.  
  The "special failure" is thus the **visibility and self-inflicted nature** of the pathology within a system claiming rational self-rule, not the underlying cognitive mechanisms. Behavioral economics captures the mechanics but not the tragic self-awareness Thucydides imbues in these moments.
