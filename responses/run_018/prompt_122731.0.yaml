prompt: |-
  I am writing a chapter on presentism in historiography and I do not want to defend a position before I know what a position here is supposed to do. So give me the specification rather than the theory: what must an adequate account of anachronism — of when a historical judgement illegitimately imports the standards of the historian's own time — be able to deliver, if it is to be good enough for a working historian writing a monograph rather than for a seminar on blame?

  For each requirement, give the case that motivates it, and keep the distinctions the theory must respect separate from the verdicts it must return (excuse versus justification, blameworthiness versus the propriety of blaming, causal explanation versus moral evaluation, "it was wrong then" versus "we rightly condemn it now"). The cases I want handled, at minimum:

  - the unavailable-concept case: condemning an eighteenth-century Caribbean sugar planter in a vocabulary of structural racial exploitation that did not yet exist. Distinguish a concept's being actually available to contemporaries from its being merely latent — constructible out of materials they already had — and say whether an agent can be faulted for not having invented a standard that was only latent.
  - the few-did case: some contemporaries did dissent, so "no one knew better" fails. Is contemporaneous dissent evidence that the standard was available, or only that it was possible?
  - the archive-silence case: the surviving record was itself shaped by the power being judged, so absence of recorded dissent is not clearly absence of dissent.
  - the collective-agent case: a chartered company or a colonial office, where both "what could they have known" and "who is the they" go fuzzy.
  - the temporal-symmetry case: if we may judge them by ours, later generations may judge us by theirs, and most of us resist that. Must the theory explain the asymmetry, or forbid one?
  - the retrospective-uptake case: does it matter that the descendants or political heirs of the condemned now endorse the condemnation, as in disputes over statues and official apologies? Is uptake evidence about the past or a fact about the present use of the judgement?
  - the self-application case: our critical vocabulary is itself a historical product. What happens when the standards used to judge the past are among the things being historicised?

  Then mark each requirement as non-negotiable or as the preference of a particular camp; flag any subset you think cannot be jointly satisfied, since if the list is unsatisfiable that is itself the result I want; and say which single requirement does the most work in excluding candidates. One line each, no more, on strict contextualism, the relativism-of-distance view, and thoroughgoing presentism.
reasoning: |-
  Okay, let me approach this historiography problem systematically. The user wants precise specifications for judging historical anachronism, not theoretical positions. They've outlined seven concrete cases that any adequate account must handle. 

  First, I need to parse each case's core challenge. The unavailable-concept case requires distinguishing between actually available versus latent concepts - like judging 18th century planters with modern "structural racism" terminology. The key here is determining fault for not inventing latent concepts. 

  The few-did case complicates things when contemporaries dissented. I must clarify whether dissent proves availability or mere possibility. Then there's the archive-silence problem where missing records don't equal missing dissent. 

  For collective agents like colonial offices, both epistemology ("what could they know?") and ontology ("who are they?") blur. The temporal-symmetry case raises fairness concerns about future generations judging us. 

  Retrospective-uptake involves political descendants endorsing condemnations - is this historical evidence or present-day usage? Finally, self-application forces us to confront that our own critical tools are historically situated. 

  I'll organize requirements by: what verdicts must be distinguished (like excuse vs justification), what cases must be handled, and what constraints apply. The big challenge is whether all requirements can coexist - some might conflict, like thorough historicism clashing with retrospective uptake. 

  The unavailable-concept case likely does the heaviest lifting in excluding theories. Strict contextualism fails it by refusing latent concepts, while thorough presentism fails collective-agent judgments. The relativism-of-distance view stumbles on retrospective uptake where modern perspectives matter. 

  Noting which requirements are non-negotiable (like avoiding circular reasoning in archive-silence cases) versus contested (like temporal symmetry) will help the user see fault lines. The collective-agent requirement seems particularly destabilizing across theories.
answer: |-
  Here is a specification for an adequate account of anachronism in historical judgment, derived from your cases, prioritizing what the account *must do* for working historians:

  1.  **Handle Concept Availability Gradients:** Must distinguish *actually available* contemporary standards (explicit in discourse), *latent* standards (constructible from existing concepts/values), and *wholly unavailable* standards (requiring later developments). It must adjudicate whether failing to act on a *latent* standard is blameworthy. *(Case: Unavailable-Concept; Non-negotiable)*
  2.  **Explain the Significance of Contemporaneous Dissent:** Must determine whether documented dissent proves a standard was *socially/culturally available* (not just intellectually possible) to the agent judged, influencing blameworthiness vs. mere possibility. *(Case: Few-Did; Non-negotiable)*
  3.  **Address Epistemic Limitations of the Archive:** Must acknowledge that absence of *recorded* dissent cannot be equated with absence of *actual* dissent or alternative viewpoints, especially when power structures shape the record. It cannot rely solely on the archive to establish "what was known/knowable." *(Case: Archive-Silence; Non-negotiable)*
  4.  **Analyze Collective Agency & Knowledge:** Must provide a framework for attributing knowledge, belief, and responsibility to collective entities (e.g., companies, states), defining the relevant "they" and explaining how collective knowledge/policy differs from individual awareness. *(Case: Collective-Agent; Non-negotiable - most work in excluding candidates)*
  5.  **Address Temporal Asymmetry (without necessarily forbidding it):** Must explain *why* we feel entitled to judge the past by present standards while resisting future judgment, or provide principled reasons *for* or *against* such asymmetry. It need not *forbid* asymmetry but must account for the intuitive resistance. *(Case: Temporal-Symmetry; Preference - contextualist/relativist camps often forbid, presentists embrace)*
  6.  **Clarify the Role of Retrospective Uptake:** Must rigorously distinguish whether uptake (e.g., descendant endorsement) is treated as *evidence* about the past (e.g., validating the historical wrongness) or solely as a *present-day political/social fact* about the judgment's current use and acceptance. *(Case: Retrospective-Uptake; Non-negotiable to separate)*
  7.  **Acknowledge the Historicity of Judgment Standards:** Must confront the fact that the historian's own critical tools and moral frameworks are historically situated products. It must avoid performative contradiction when applying these tools to judge the past that shaped them. *(Case: Self-Application; Non-negotiable)*

  **Distinctions the Account Must Respect:**
  *   Excuse (mitigating factors) vs. Justification (validity of the act).
  *   Blameworthiness (agent's fault) vs. Propriety of Blaming (current appropriateness of condemnation).
  *   Causal Explanation (historical context) vs. Moral Evaluation (ethical judgment).
  *   "Wrong Then" (by contemporary standards) vs. "We Rightly Condemn Now" (by current standards).

  **Tensions & Satisfiability:**
  *   **Potential Conflict:** Requirements 1 (Latency), 2 (Dissent as Availability), and 3 (Archive Limits) create tension. How does one *reliably* establish the availability/constructibility of a latent standard (1) given that dissent might be suppressed (3) and its presence/absence is ambiguous (2)? This trio is the hardest to satisfy jointly without significant theoretical baggage.
  *   **Most Excluding Requirement:** **Requirement 4 (Collective Agency)** does the most work in excluding candidates. Theories strong on individual intentionality/morality often founder here. Requirement 7 (Self-Application) also critically challenges simplistic presentism.
  *   **Satisfiability Possible?** Yes, but it requires a complex, multi-layered account sensitive to epistemology, social ontology, and historicity. No simple theory (contextualism, relativism, presentism) satisfies all requirements adequately on its own.

  **Brief Theory Assessments (1 Line Each):**
  *   **Strict Contextualism:** Fails Requirements 1 (latency), 5 (asymmetry resistance), 7 (self-application), and struggles with 4 (collectives).
  *   **Relativism-of-Distance:** Fails Requirements 1 (latency), 2 (dissent significance), 6 (uptake role), and 5 (often forbids asymmetry).
  *   **Thoroughgoing Presentism:** Fails Requirements 1 (unavailability), 3 (archive limits), 4 (collective knowledge), 7 (self-application), and ignores 5 (asymmetry).
