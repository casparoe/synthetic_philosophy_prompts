prompt: |-
  What do you think David Lewis—given his commitment to Humean supervenience, his best-system account of laws, and his rejection of primitive modal connections—would have said about the post-2000 revival of dispositional essentialism? Specifically, consider the view that fundamental properties are essentially powers (for instance, that charge is essentially disposed to repel like charges), so that lawlike regularities are grounded in the intrinsic nature of properties rather than in global patterns of categorical distribution. Would Lewis have regarded this as a notational variant of his own framework with modal predicates added, or as a genuine rival that violates Humean supervenience? Respond in one paragraph of no more than 180 words, without citing specific texts or papers; reason only from the philosophical commitments he is known to have held.
reasoning: |-
  Hmm, the user is asking about David Lewis's hypothetical reaction to dispositional essentialism, specifically how it revives after 2000. They want me to consider Lewis's commitments like Humean supervenience, best-system account of laws, and rejection of primitive modalities. The key point is whether he'd see dispositional essentialism as a notational variant or a rival.

  I recall that Humean supervenience means everything supervenes on the spatiotemporal distribution of local categorical qualities. For Lewis, laws are just patterns in this mosaic, captured by the best system that balances simplicity and strength. He firmly opposed any intrinsic modal powers because they'd add non-Humean elements.

  Dispositional essentialism argues that fundamental properties have essential powers, like charge inherently repelling like charges, so laws are grounded in properties' natures, not global patterns. This directly contradicts Lewis's view because it introduces primitive dispositions that aren't reducible to categorical bases. It violates the core of Humean supervenience by making modality fundamental.

  Lewis would definitely see this as a genuine rival, not just a variant. Adding modal predicates doesn't hide the fact that it posits irreducible necessities, which he rejected as metaphysical extravagance. His framework requires everything to be explained by non-modal facts, so dispositional essentialism would challenge that foundation.

  The user seems knowledgeable in philosophy, possibly a student or scholar. Their deeper need might be to understand the clash between Humean and anti-Humean metaphysics, especially how Lewis's ideas hold up against modern developments. I'll keep my response concise and focused, under 180 words, reasoning only from Lewis's known commitments without citations.
answer: |-
  Lewis would unequivocally view dispositional essentialism as a genuine rival violating Humean supervenience, not a notational variant. His core commitment is that all modal facts, including laws, supervene entirely on the global, non-modal, categorical distribution of local intrinsic properties across spacetime. The best-system account reduces laws to efficient summaries of this distribution. Dispositional essentialism directly contradicts this by grounding lawlike regularities in the *intrinsic essences* of fundamental properties themselves, positing irreducible modal powers (like charge's essential repulsive disposition) prior to and governing the pattern of instantiation. This injects primitive modal connections and necessary connections between distinct existences at the fundamental level, precisely what Humean supervenience forbids. Lewis would see it as reintroducing the kind of metaphysically suspect modality he sought to eliminate.
