  We are to design desiderata for a strategy-stealing argument in games beyond the classic perfect-information, symmetric, discrete, deterministic setting.

  Strategy-stealing typically works by having one player (say, Player 2) adopt a "copycat" strategy relative to the other (Player 1). The idea is that Player 2 uses Player 1's strategy (which is fixed for the entire game) against itself, but with a twist to account for the extra move or piece. In symmetric games, the extra move is often handled by having Player 2 imagine a "mirror" universe where the roles are reversed and then use Player 1's strategy in that mirror. The success of this argument relies on several conditions.

  We are to consider:
  - Partial information
  - Continuous action spaces
  - Epistemic asymmetry (where the extra move might leak information)

  We list each requirement, the case that motivates it (what goes wrong if we drop it), and mark whether it is a hard constraint or can be relaxed in some contexts (camp-specific). We also note if any subset is jointly unsatisfiable given standard no-go results.

  The classic strategy-stealing argument (e.g., in Hex) requires:
  1. **Symmetry of the game board and rules**: The game must be symmetric so that a move by one player can be mirrored by the other.
  2. **Perfect information**: Both players know the entire history of moves.
  3. **Discrete moves**: The set of moves is finite and discrete.
  4. **Determinism**: There is no randomness in the game outcomes once moves are chosen.
  5. **No draws**: The game must end with a win for one player (so that if the stealing player can avoid losing, they win).

  But we are going beyond.

  Let's break down the requirements:

  ### 1. **Strategy Space Symmetry**
     - **Description**: There must be a way to map the strategy space of Player 1 to that of Player 2. This usually requires that the game is symmetric in the sense that the roles of the two players are interchangeable, possibly after a transformation (like mirroring the board).
     - **Motivating Case**: Without this, we cannot even define what it means for Player 2 to "copy" Player 1's strategy. For example, in asymmetric games (like Chess with white and black) the strategy-stealing argument fails because white's strategy cannot be directly used by black due to the first-move advantage and asymmetric starting positions.
     - **Constraint Type**: Hard. Without symmetry, the copying mechanism is undefined.

  ### 2. **Action Space Symmetry and Involution**
     - **Description**: There must be a bijection (an involution, i.e., a function that is its own inverse) between the action spaces of the two players. Moreover, this involution must preserve the game structure (like symmetries of the board). Also, the extra move must be accounted for: typically, the stealing player has one extra move, so the copying must account for that extra move by either ignoring it or using it in a way that doesn't break the symmetry.
     - **Motivating Case**: In a continuous action space, if the action sets are not symmetric (e.g., one player chooses a point in [0,1] and the other in [0,2]), then we cannot define a mapping. Also, if the game is not invariant under the involution, then copying might lead to a disadvantage. Moreover, if the extra move leaks information (e.g., in a game with partial information, the extra move might reveal something about the copier's private state) then the copied strategy might exploit that information.
     - **Constraint Type**: Hard for the bijection and the structure preservation. However, the handling of the extra move might be context-specific (e.g., in Hex, the extra move is just played arbitrarily and then ignored in the mirroring).

  ### 3. **Information Structure Compatibility**
     - **Description**: The information available to each player must be symmetric in a way that the copying player can simulate the information that the other player would have in the mirrored game. This is particularly challenging in games of partial information or with epistemic asymmetry.
     - **Motivating Case**: In a game where players have private information (e.g., cards in Poker), if Player 2 copies Player 1's strategy, then Player 2's extra move might reveal information to Player 1 that Player 1 would not have in the mirrored scenario. This breaks the argument because the copied strategy (which was designed for a world without that extra information) may now be suboptimal. Also, Player 2 might not be able to reconstruct the information state that Player 1 would have in the mirror because of differences in the history of moves.
     - **Constraint Type**: Hard in the presence of private information. This is a major obstacle.

  ### 4. **Outcome Symmetry**
     - **Description**: The outcome of the game must depend symmetrically on the players' strategies. That is, if the two players swap roles and play symmetrically, then the outcome should swap accordingly (win becomes loss, etc.). Moreover, the outcome should be asymmetric: no draws, so that if a player is not losing, they are winning.
     - **Motivating Case**: If the game allows draws, then strategy-stealing might only prove that the stealing player can avoid losing, but that doesn't imply they can force a win. Also, if the outcome is not symmetric (e.g., one player has an advantage by the rules), then copying might not lead to a win.
     - **Constraint Type**: Hard for the win/loss asymmetry (no draws) and the role-swap outcome inversion. However, in some games with draws, we might relax to show at least a draw, but that is a weaker result.

  ### 5. **Determinism and Absence of Randomness**
     - **Description**: The game must be deterministic. If there is randomness (either in the game or in the strategies), then the outcome is probabilistic. The strategy-stealing argument typically relies on the fact that if the copier can force a win in the mirrored world, then they can force a win in the real world. But with randomness, the best one can do is force a win with a certain probability, and the symmetry might break because the extra move might change the distribution of randomness.
     - **Motivating Case**: In a stochastic game, if Player 2 copies Player 1, but the game has randomness that is not symmetric (e.g., because the extra move might trigger a different random event), then the outcome probabilities might not be the same. Also, if the strategies are mixed (probabilistic), then copying a mixed strategy might require independence, but the extra move might break that.
     - **Constraint Type**: Can be camp-specific. In some contexts, one might extend the argument to show that the stealing player can achieve at least the same expected payoff. However, if the randomness is not symmetric (e.g., because of the extra move), it might fail.

  ### 6. **Continuity or Discrete Moves**
     - **Description**: In continuous action spaces, the strategy-stealing argument might require that the mapping of actions is continuous (or at least measurable) and that the outcome function is symmetric and continuous. Without continuity, small changes in actions might lead to large changes in outcome, breaking the copying.
     - **Motivating Case**: In a continuous game, if the action mapping is not continuous, then a small change in the opponent's action might lead to a large change in the copied action, which might break the effectiveness of the copied strategy. Also, the extra move might cause a discontinuity.
     - **Constraint Type**: Context-specific. In discrete games, this is not an issue.

  ### 7. **Finite Horizon or Termination**
     - **Description**: The game must terminate in finite steps (or almost surely in stochastic games) so that the outcome is defined. In infinite horizon games, we might require that the payoffs are discounted or that the game is such that the stealing argument can be applied in a limit.
     - **Motivating Case**: Without termination, the argument might not conclude (e.g., the copying might lead to an infinite loop of moves).
     - **Constraint Type**: Hard for the argument to be constructive, but in some games (like Hex) termination is guaranteed by the board being finite.

  ### 8. **No Leakage from the Extra Move**
     - **Description**: The extra move that the stealing player has must not reveal information that breaks the symmetry of the information state. In other words, the act of making an extra move must not convey information that the opponent can use to adjust their strategy in a way that the mirrored strategy does not account for.
     - **Motivating Case**: In a game with epistemic asymmetry, if the stealing player makes an extra move that reveals their private information, then the opponent (Player 1) might change their strategy accordingly. However, in the mirrored world, that information would not have been revealed (because in the mirrored world, Player 1 is the one with the extra move and they are the one revealing). Thus, the copied strategy (which is designed for the mirrored world without that revelation) is now playing against an opponent that has more information, which might lead to a loss.
     - **Constraint Type**: Hard in games with private information. This is a critical point and might be the main obstacle in partial information games.

  ### Tension Map and Joint Unsatisfiability:

  - **Information Revelation and Strategy-Stealing**: In games with private information, the standard no-go results (like in signaling games) show that actions can reveal information. Therefore, the requirement of "No Leakage from the Extra Move" (8) is often incompatible with the requirement that the action spaces are symmetric and that the game is played (which requires making moves that are observable). This is a fundamental tension.

  - **Symmetry and Asymmetry in Rules**: Some games are inherently asymmetric (e.g., due to first-mover advantage). The requirement of "Strategy Space Symmetry" (1) and "Outcome Symmetry" (4) might fail, making the argument inapplicable.

  - **Randomness and Determinism**: If we allow randomness, we might relax the determinism requirement (5) by using expected payoffs, but then we must ensure that the extra move does not alter the distribution of randomness in an asymmetric way. This might be difficult when the randomness is state-dependent and the state is altered by the extra move.

  - **Continuous Action Spaces and Symmetry**: In continuous spaces, we require a continuous involution (2) and continuity of the outcome function (6). However, if the game is not symmetric in the continuous space (e.g., one player's action set is a subset of the other's) then the involution might not exist.

  In summary, the hard constraints that are typically necessary are:
  1. Strategy Space Symmetry (1)
  2. Action Space Symmetry and Involution (2) [at least a bijection that preserves the game structure]
  3. Information Structure Compatibility (3) and No Leakage (8) [which are the most problematic]
  4. Outcome Symmetry and No Draws (4)

  And the context-specific ones are:
  - Determinism (5) [can be relaxed to stochastic with care]
  - Discrete moves (6) [continuous can be handled if the mapping is continuous and the outcome is continuous]
  - Finite termination (7) [can be relaxed for discounted infinite games]

  However, note that requirements (3) and (8) are often the showstoppers in partial information games because of the inherent tension between symmetric strategy copying and information revelation. In fact, it is known in game theory that in games of incomplete information, the first mover might have an advantage because they can signal, and the second mover cannot always mimic without revealing. Thus, a subset of requirements (1,2,3,4,8) is often unsatisfiable in such settings.

  Given these considerations, the strategy-stealing argument is largely confined to perfect-information, symmetric, deterministic, discrete games with no draws and finite moves. Beyond that, each extension (partial information, continuous actions, randomness) requires careful handling and might only work in very specific cases.
answer: |-
  ### Desiderata for Strategy-Stealing Beyond Perfect-Information Games

  **Core Goal**: Enable Player 2 to "copy" Player 1's strategy without disadvantage despite having an extra move/piece, even with partial information, continuous actions, or epistemic asymmetry.  
  **Key Tensions**: Information leakage from surplus moves, symmetry breaking, and no-go theorems in strategic information revelation.

  ---

  #### **1. Strategy-Space Isomorphism**  
  - **Description**: A bijective mapping must exist between Player 1's and Player 2's strategy spaces, preserving move equivalency under a transformation (e.g., board symmetry).  
  - **Motivation**: Asymmetric action spaces (e.g., Player 1 chooses temperature ∈ [0, 100], Player 2 chooses pressure ∈ [0, 200]) prevent defining a consistent copy rule.  
  - **Constraint Type**: **Hard**. Without isomorphic strategy spaces, copying is undefined.  
  - **Tension**: Conflicts with continuous or heterogeneous action spaces (e.g., if actions live in different metric spaces).

  #### **2. Outcome Symmetry Under Copying**  
  - **Description**: The game outcome must be invariant when strategies are swapped via the isomorphism, except for win/loss inversion.  
  - **Motivation**: In asymmetric games (e.g., **Stackelberg duopolies**), Player 1's first-mover advantage breaks symmetry; copying may yield suboptimal prices.  
  - **Constraint Type**: **Hard**. Outcome asymmetry lets Player 1 force losses on the copier.  
  - **Tension**: Jointly unsatisfiable with first-mover advantages or predefined role asymmetries.

  #### **3. No Information Leakage from Surplus Moves**  
  - **Description**: Extra moves must not reveal information about the copier's state/type that the opponent exploits.  
  - **Motivation**: In **partially observable games** (e.g., **Tiger problem**), Player 2 opening a door leaks information; Player 1 adjusts strategy, invalidating the copied policy.  
  - **Constraint Type**: **Hard** in epistemic settings. Leaked information breaks strategy equivalence.  
  - **Tension**: Violates *no-go theorems* (e.g., signaling game impossibilities): Surplus moves *always* reveal information if actions are observable.

  #### **4. Observational Equivalence of Histories**  
  - **Description**: After the extra move, all histories observable to Player 1 must be mappable to a history in the "mirrored" game (where Player 1 has the surplus).  
  - **Motivation**: In **imperfect-information games** (e.g., **Kriegspiel**), Player 2's extra move creates histories Player 1 couldn’t encounter in the mirrored world, breaking simulation.  
  - **Constraint Type**: **Hard** for partial information. Unmappable histories induce strategy errors.  
  - **Tension**: Incompatible with non-deterministic observations or private state (e.g., if moves reveal hidden types).

  #### **5. Invariant Payoff Structure**  
  - **Description**: Payoffs must depend symmetrically on moves, unaffected by the copier’s surplus move (e.g., via topology-preserving action mapping).  
  - **Motivation**: In **continuous games** (e.g., **Cournot competition**), Player 2’s extra production shift alters market dynamics non-symmetrically, making copied outputs suboptimal.  
  - **Constraint Type**: **Context-specific** (hard in economics, soft in topology-constrained games). Discontinuities or non-convexities break copying.  
  - **Tension**: Fails if the action space lacks homeomorphic symmetry (e.g., non-Euclidean manifolds).

  #### **6. Deterministic Strategies**  
  - **Description**: Players use pure (non-randomized) strategies. Mixed strategies complicate copying by requiring correlated random variables.  
  - **Motivation**: With **mixed strategies** (e.g., **randomized security games**), Player 2 copying Player 1’s distribution may require shared randomness, which the surplus move disrupts.  
  - **Constraint Type**: **Preference** (relaxable with stochastic symmetry).  
  - **Tension**: Satisfiable only if random seeds are mirrored or irrelevance is proven (rare in Bayesian games).

  #### **7. No Draws/Forced Wins**  
  - **Description**: The game must have no draws; avoiding loss implies winning.  
  - **Motivation**: In **games with draws** (e.g., **generalized Hex on non-simply-connected boards**), copying prevents loss but may not force a win.  
  - **Constraint Type**: **Hard** for proving "first player wins" results.  
  - **Tension**: Benign in many settings but critical for combinatorial proofs.

  ---

  ### Tension Map & Joint Unsatisfiability  
  | **Conflicting Pair**                          | **Reason for Conflict**                                                                 | **Example**                                  |  
  |-----------------------------------------------|-----------------------------------------------------------------------------------------|----------------------------------------------|  
  | **Strategy-Space Isomorphism + No Leakage**   | Continuous/partial-info games lack symmetry *and* induce leakage (no-go: **Myerson-Satterthwaite**). | Markets with private valuations.             |  
  | **Observational Equivalence + Invariant Payoff** | Extra moves alter information partitions *and* payoff topology.                         | Epistemic games with belief-dependent payoffs.|  
  | **Outcome Symmetry + Determinism**            | Randomized strategies break win/loss inversion symmetry.                                | Stochastic poker variants.                   |  

  ### Summary of Constraints  
  - **Hard Constraints**: (1) Strategy-space isomorphism, (2) Outcome symmetry, (3) No information leakage, (4) Observational equivalence, (7) No draws.  
  - **Context-Specific**: (5) Invariant payoffs (topology-dependent), (6) Determinism (relaxable under stochastic equivalence).  
  - **Fundamental Tension**: **Information leakage** (3) and **observational equivalence** (4) are *jointly unsatisfiable* in generic partial-info settings due to the *surplus move acting as a signal* (implied by revelation principles). Strategy-stealing fails here without strong restrictions (e.g., zero-sum with no hidden types).
