prompt: |-
  I serve on the hiring committee of a small organization, and I have noticed something about our decisions that I cannot find a word for. When we choose among three or more options -- candidates, budget plans, policy proposals -- we never vote on all of them at once. Instead the chair sets a sequence: first A against B, then the winner against C. Everyone, as far as I can tell, votes honestly at each step. And yet I have become convinced that whoever sets the sequence effectively chooses the outcome. With the same members holding the same honest opinions, candidate X wins under one ordering and candidate Y wins under another, and a chair who knows how people feel can arrange for her favorite to prevail. Nobody has lied about anything, and no rule has been broken.

  I have a hazy memory of a famous theorem saying that every reasonable voting method can be gamed, but when I looked into it, the gaming there seemed to mean voters misrepresenting what they want -- which is not what is happening here, since everyone votes sincerely throughout. So: does the phenomenon I am describing have an established name and a literature? How exactly does it differ from the kind of manipulation that theorem concerns, and are there known results about it of comparable generality? I also want the edges marked out: sometimes the order makes no difference at all, and I would like to know precisely when and why. Please do not just hand me a label -- explain what the phenomenon is, what it is not, and where it ends. Kindly write your answer in American English.
reasoning: |-
  Okay, the user is part of a hiring committee and has noticed that the order in which proposals or candidates are voted on significantly affects the outcome. They described a process where the chair sets a sequence: for example, first A vs. B, then the winner against C. Even though everyone votes honestly, the chair can manipulate the outcome by choosing the sequence. The user is looking for a term to describe this phenomenon and wants to understand how it differs from other types of voting manipulation.

  First, I need to recall the relevant concepts. The user mentioned a famous theorem about voting methods being "gamed," which likely refers to Arrow's Impossibility Theorem or Gibbard-Satterthwaite. Those theorems deal with strategic voting, where voters misrepresent their preferences. But here, the issue is with the chair controlling the agenda, not voters being dishonest. So this is different.

  The phenomenon described sounds like "agenda manipulation" or "agenda control." That's a key term. It's part of the broader study of voting systems and their properties. I should explain that this happens in sequential pairwise voting methods. The chair can choose the order of voting to favor a particular outcome, even with sincere voting.

  The user also wants to know when the order doesn't matter. That's when there's a Condorcet winner—a candidate who beats every other in head-to-head matchups. If such a candidate exists, the sequence won't affect the outcome. But if there's a Condorcet cycle (A beats B, B beats C, C beats A), then the agenda can be manipulated.

  I need to distinguish this from strategic voting as in Gibbard-Satterthwaite. That theorem shows that no voting system is immune to tactical voting. Here, the manipulation comes from the chair's control over the process, not voters lying. The user might be conflating the two, so clarifying the difference is important.

  Also, the user might have deeper concerns about fairness in their organization. They might want to propose a fairer voting method or ensure that the process isn't being exploited. Highlighting methods like the Condorcet method or Borda count could be useful, but also pointing out their flaws (like no perfect system exists) is necessary.

  I should structure the explanation by first naming the phenomenon, explaining how it works, contrasting it with strategic voting, and discussing conditions where order doesn't matter. Emphasizing that this is a known vulnerability in sequential voting methods will validate the user's observation. Mentioning the McKelvey-Schofield theorem on agenda control could add depth, but keeping it accessible is key since the user might not be a specialist.
answer: |-
  What you're describing is a textbook example of **agenda manipulation** (or **agenda control**) within a **sequential pairwise voting** system. This is a well-established phenomenon in social choice theory and differs significantly from the "gaming" described in theorems like Arrow's Impossibility Theorem or the Gibbard-Satterthwaite Theorem. Here's a breakdown:

  1.  **The Name & The Phenomenon:**
      *   **Core Name:** Agenda Manipulation / Agenda Control.
      *   **Mechanism:** Sequential Pairwise Elimination (or Successive Elimination).
      *   **Description:** When a group decides among multiple options by repeatedly pitting two options against each other in a predetermined sequence (agenda), the winner advancing to face the next option, the final winner can be critically dependent on the *order* in which the options are introduced and paired, even when all voters vote sincerely (honestly according to their true preferences) at every pairwise vote.
      *   **The Chair's Power:** A chairperson (or whoever sets the sequence) who knows the sincere preferences of the voters can strategically design the sequence ("path") through the pairwise comparisons to steer the outcome towards their preferred candidate or policy. This power arises because the sequence determines which options get eliminated early and which get to face potentially weaker opponents later.

  2.  **How It Differs from Arrow/Gibbard-Satterthwaite "Gaming":**
      *   **Arrow's Impossibility Theorem:** This concerns the *aggregation* of individual preferences into a social ordering. It shows that no ranking-based voting system (using ranked ballots) can simultaneously satisfy a few "reasonable" criteria (like not being dictatorial, respecting unanimity, independence of irrelevant alternatives - IIA) when there are 3 or more options. The "gaming" here is inherent in the impossibility of perfect aggregation, not strategic behavior. It doesn't directly address sequential processes or agenda control.
      *   **Gibbard-Satterthwaite Theorem:** This theorem *does* deal with strategic voting ("gaming"). It states that for any reasonable voting system that selects a single winner from 3+ options (and isn't dictatorial or has only two options), there will be situations where at least one voter can achieve a better outcome for themselves by *misrepresenting their true preferences* (lying about their rankings/votes). This is **strategic voting by individuals**.
      *   **Key Difference in Your Case:**
          *   In your scenario, **voters are NOT being strategic.** They are voting sincerely at every step based on their true preferences between the two options presented.
          *   The manipulation comes entirely from **the chair strategically setting the rules of the process (the sequence)**, knowing how sincere votes will fall in each pairwise contest.
          *   This is **procedural manipulation** or **institutional manipulation**, not **strategic voting manipulation**.

  3.  **When Order Doesn't Matter (The Edges):**
      The sequence is irrelevant to the final outcome **if and only if** there exists a **Condorcet winner**.

      *   **Condorcet Winner:** An option that can beat *every other option* in a head-to-head (pairwise) majority vote.
      *   **Why it Matters:** If a Condorcet winner (CW) exists, it will win *any* sequence of pairwise elimination contests. No matter who it faces first, it will win that vote. Then, no matter who it faces next, it will win that vote too, and so on, until it is the last one standing.
      *   **The Flip Side - Condorcet Cycles:** The power of agenda manipulation arises precisely when there is *no* Condorcet winner. This often happens due to a **Condorcet cycle** (or "voting cycle"): A majority prefers A over B, a majority prefers B over C, and yet a majority prefers C over A (e.g., preferences are "rock-paper-scissors" like). In this case:
          *   Pairwise outcomes are inconsistent (no clear majority favorite).
          *   The sequence *completely* determines the winner.
          *   The chair can choose a sequence that eliminates strong challengers to their favorite early or ensures their favorite faces opponents it can beat at the right moment.
      *   **Other Stable Points (Less Common):** While the Condorcet winner is the primary condition for sequence-independence, in very specific preference profiles, other non-Condorcet winners might win regardless of sequence (e.g., if an option is unanimously ranked last, it can't win any sequence). However, the *guarantee* that the sequence doesn't matter hinges on the existence of a Condorcet winner.

  4.  **Generality and Known Results:**
      *   **McKelvey-Schofield Theorem (and predecessors like McKelvey's Chaos Theorem):** These are highly relevant results demonstrating the *generality* of agenda control potential. They essentially show that in majority-rule voting spaces with no Condorcet winner (which is common in multi-dimensional political spaces), the agenda setter can often steer the outcome to virtually *any* point within the "uncovered set" or even the entire "Pareto set" by crafting a sufficiently complex path of pairwise votes. This means the chair's power isn't just limited to choosing between a few likely winners; it can be extremely broad.
      *   **Sensitivity:** Sequential pairwise voting is notoriously sensitive to the agenda. It's recognized as one of the most manipulable procedures *by the chair* precisely because of this sequence dependence when no CW exists.
      *   **Comparison to Other Systems:** While all non-dictatorial systems have vulnerabilities (Arrow, Gibbard-Satterthwaite), sequential pairwise voting has this *specific*, well-known, and often extreme vulnerability to agenda control *without requiring voters to be strategic*.

  **Summary for Your Situation:**

  *   **Phenomenon:** Agenda Manipulation / Agenda Control in Sequential Pairwise Elimination.
  *   **Mechanism:** The chair exploits the path-dependence of the voting sequence to eliminate threats to their preferred outcome early, leveraging sincere voting by members.
  *   **How it Differs:** This is **procedural manipulation by the chair**, not **strategic voting manipulation by individual voters** (which is the focus of Gibbard-Satterthwaite).
  *   **When it Ends:** The sequence **does not matter** if and only if a **Condorcet Winner** exists. If there is no Condorcet winner (especially if there's a Condorcet cycle), the chair has significant (and potentially near-total) control over the outcome via the sequence.
  *   **Literature:** Look into terms like "agenda manipulation," "agenda control," "sequential pairwise voting," "successive elimination," "Condorcet winner," "Condorcet cycle," and the "McKelvey-Schofield Theorem."

  **Practical Implication for Your Committee:** If your chair knows members' preferences well and there's often no clear Condorcet winner (which is likely, given your observation), they have immense power. To mitigate this, the committee could consider alternative voting methods less susceptible to chair manipulation (like a Condorcet method itself if one exists, or a Borda count, though *all* methods have other known weaknesses) or establish a fixed, random, or member-agreed-upon sequence *before* preferences are known. However, no perfect solution exists – the literature shows trade-offs are inherent in any group decision-making process.
