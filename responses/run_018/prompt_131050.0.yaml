prompt: |-
  You are a philosopher of moral psychology and applied ethics, with deep familiarity with Adam Smith's account of sympathy, the impartial spectator, and the distinction between propriety and merit. Before constructing the procedure, take time to think through the conceptual architecture: how sympathy functions as a mechanism of fellow-feeling rather than mere emotional contagion; how the impartial spectator operates as an internal standard that corrects for partiality; and where Smith locates the boundary between assessing an agent's intentions and evaluating the consequences of an act.

  I advise mediators in a community-based restorative justice program who repeatedly face decisions about whether a proposed restorative agreement genuinely addresses the moral desert of a symbolic or relational harm—such as a public false accusation that destroyed a reputation, or a breach of trust within an institution—without relying on legal sentencing guidelines. These mediators are not lawyers; they must document reasoning for a review board of legal staff and community representatives, and they need a reusable decision procedure they can run in under an hour. Design an ordered checklist of questions, with clear stopping rules, explicit judgment nodes, and a sharp distinction between empirical observations (what was intended, what damage occurred, what remedy is feasible) and irreducible value judgments (whether sympathy is warranted, whether the spectator approves). The procedure must handle hard cases: the offender expresses genuine remorse but the victim refuses any reconciliation; third-party observers disagree sharply on harm severity; and the proposed remedy risks being either disproportionate or merely performative. Apply it to three scenarios: a straightforward case with acknowledged harm and proportional remedy; a case where the offender sincerely intends repair but the structural damage exceeds any individual remedy; and a case where the procedure yields an answer the mediator will find unsatisfying—perhaps that formal reconciliation should be withheld despite emotional readiness on both sides. End by stating what the procedure cannot settle, where it is likely to misfire, and which steps remain judgment calls that no protocol can eliminate.
reasoning: |-
  We are designing a decision procedure for restorative justice mediators based on Adam Smith's moral psychology, specifically:
   - Sympathy: as a mechanism for understanding and sharing the feelings of others, but requiring alignment with the impartial spectator. It's not just emotional contagion but a calibrated response.
   - Impartial Spectator: the internal standard that corrects for partiality. It represents what an unbiased observer would feel and approve.
   - Propriety vs. Merit: 
       - Propriety: about the appropriateness of the agent's motives and the act in relation to the situation (intention-focused).
       - Merit: about the worthiness of the act to be rewarded or blamed (consequence-focused, but also tied to the motive).

   Steps in the procedure:
   1. We must separate empirical observations (facts) from value judgments (sympathy, impartial spectator approval).
   2. The procedure must have clear stopping rules and judgment nodes.

   Structure of the Checklist:

   I. Preliminary Steps (Empirical Observations)
      A. Assess the harm: What is the nature of the harm? (e.g., reputational, relational, institutional)
          - What are the facts of the incident? (What happened? Who was involved? What were the immediate consequences?)
          - What are the ongoing consequences? (e.g., loss of reputation, broken trust, financial loss)
          - What is the victim's account of the harm? (How does the victim describe the impact?)
          - What is the offender's account of the harm? (Does the offender acknowledge the harm? To what extent?)

      B. Assess the offender's intentions and state:
          - What was the offender's intention at the time of the act? (e.g., malice, negligence, accident)
          - What is the offender's current state? (e.g., remorseful, defensive, indifferent)
          - Has the offender taken any steps to repair the harm? (e.g., apology, attempts at restitution)

      C. Assess the proposed remedy:
          - What specific actions are proposed? (e.g., public retraction, financial compensation, community service, therapy, mediation sessions)
          - Is the remedy feasible? (Can it be done? Who will do it? By when?)
          - Does the remedy address the specific harm? (e.g., reputational harm might require a public correction)

      D. Assess the victim's position:
          - What does the victim want? (e.g., apology, restitution, no contact, punishment)
          - Is the victim willing to participate in reconciliation? Why or why not?
          - What are the victim's fears or reservations?

   II. Sympathy Assessment (Value Judgment Node 1)
      - Based on the facts gathered, can the mediator (and by extension, the impartial spectator) sympathize with the victim's feelings? (i.e., are the victim's feelings appropriate to the harm?)
      - Can the mediator sympathize with the offender's feelings? (e.g., remorse, shame) but note: sympathy for the offender does not excuse the act.
      - Stopping Rule 1: If the mediator cannot sympathize with the victim's feelings (i.e., the victim's reaction is wildly disproportionate to the harm) then the harm assessment may need reevaluation. However, note that the victim's feelings are subjective. The impartial spectator must judge the propriety of the victim's feelings. If the victim's feelings are deemed improper (excessive or deficient), then the mediator must note this and consider it in the next steps.

   III. Impartial Spectator Assessment (Value Judgment Node 2)
      - Ask: What would an impartial spectator (a reasonable, well-informed person with no stake in the outcome) feel about:
          a) The offender's original act? (Propriety: Was the act appropriate? If not, how inappropriate? Would the spectator blame the offender? To what degree?)
          b) The offender's current state and efforts? (Merit: Does the offender deserve blame or praise for their response? How much?)
          c) The proposed remedy? (Does it align with what the spectator would see as just? Does it restore the balance?)

      - The impartial spectator must correct for:
          - Partiality toward the victim (over-sympathizing) or the offender (under-sympathizing).
          - Cultural biases and community standards.

      - Stopping Rule 2: If the impartial spectator would not approve of the remedy (e.g., it is disproportionate, performative without substance, or fails to address the core harm), then the remedy must be adjusted or rejected.

   IV. Reconciliation Assessment (Judgment Node 3)
      - Even if the remedy is appropriate, is reconciliation possible or desirable?
          - Consider the victim's willingness and the offender's sincerity.
          - Consider structural factors: e.g., power imbalances, systemic issues that might make reconciliation unsafe or ineffective.
          - Consider if the harm is such that reconciliation is beyond the scope of the process (e.g., the harm is too severe, or the relationship cannot be restored).

      - Stopping Rule 3: If the victim refuses reconciliation despite a remedy that the impartial spectator would approve, then the process may still record the offender's efforts and the victim's refusal, but note that reconciliation is not achieved. The mediator must decide if the remedy can be implemented without reconciliation (e.g., a public apology even if the victim doesn't accept it) and if that is still valuable.

   V. Final Decision on the Agreement
      - Based on the above, document:
          - The facts of the harm and the remedy.
          - The sympathy assessments for both parties.
          - The impartial spectator's approval or disapproval of the act and the remedy.
          - The feasibility and proportionality of the remedy.
          - The status of reconciliation (achieved, not achieved, or not possible).

      - The agreement is approved if:
          a) The harm is acknowledged (by the offender or by the facts) and the remedy is feasible.
          b) The impartial spectator would approve the remedy as proportional and addressing the core harm.
          c) The remedy does not create new injustices.

      - The agreement is rejected if:
          a) The remedy is disproportionate (too harsh or too lenient) according to the impartial spectator.
          b) The remedy is merely performative and does not address the harm.
          c) The process is being used to coerce the victim.

      - In cases where reconciliation is not achieved but the remedy is otherwise acceptable, the agreement may be implemented without reconciliation, but this must be documented.

   VI. Hard Cases Handling
      - Case 1: Offender expresses genuine remorse but victim refuses reconciliation.
          - Proceed with the remedy if it is feasible and the impartial spectator approves it, even without reconciliation. Document the victim's refusal and the reasons.

      - Case 2: Third-party observers disagree on harm severity.
          - The mediator must use the impartial spectator to determine the appropriate level of harm. This may require seeking more information or expert input. The impartial spectator should consider the community's standards and the long-term impact.

      - Case 3: Proposed remedy is disproportionate or performative.
          - Reject the remedy and require a new proposal that meets the impartial spectator's standard.

   VII. Apply to Three Scenarios

   Scenario 1: Straightforward Case
      - Example: A shopkeeper falsely accuses a customer of theft in front of others. The customer's reputation is damaged. The shopkeeper acknowledges the mistake, is remorseful, and proposes a public apology in the same location and a written retraction. The victim accepts.
      - Procedure:
          I.A: Harm is reputational, with public humiliation. Victim feels embarrassed and angry. Offender acknowledges.
          I.B: Offender intended to stop theft but was mistaken. Now remorseful.
          I.C: Public apology and retraction are feasible and directly address the harm.
          I.D: Victim is willing.
          II: Sympathy with victim is warranted (reasonable reaction). Sympathy with offender's remorse is also warranted.
          III: Impartial spectator would approve: the act was improper (false accusation) but the remedy (public correction) is proportional and restores reputation.
          IV: Reconciliation is possible and desired.
          V: Agreement approved.

   Scenario 2: Structural Damage Exceeds Individual Remedy
      - Example: A trusted employee embezzles funds from a small nonprofit, causing it to lose a grant and jeopardizing its future. The offender is genuinely remorseful and offers to repay the money and volunteer. But the organization may still collapse, and the community has lost trust.
      - Procedure:
          I.A: Harm is financial, institutional, and relational. The nonprofit's reputation is damaged, and it may close. The community is affected.
          I.B: Offender intended to steal (malice) but now remorseful and offers repayment and volunteer work.
          I.C: Repayment is feasible but may not be enough. Volunteering may not be trusted. The deeper harm is the loss of trust and the potential closure.
          I.D: The nonprofit (victim) is skeptical and may not want the offender involved again.
          II: Sympathy with the victim (fear, anger) is warranted. Sympathy with the offender's remorse is possible but limited because of the gravity.
          III: Impartial spectator would note the act was highly improper. The remedy (repayment) is necessary but insufficient. The spectator might require more: perhaps a public admission, steps to rebuild trust (like oversight mechanisms), and an understanding that the offender cannot volunteer in a position of trust. However, the structural damage (loss of grant, possible closure) may be beyond repair by the offender alone.
          IV: Reconciliation may not be possible. The organization may not want the offender involved.
          V: The agreement might be approved for the repayment and a public admission, but without allowing the offender to volunteer. However, it must be documented that the remedy does not fully address the structural harm. The mediator might recommend additional community support for the nonprofit.

   Scenario 3: Unsatisfying Outcome
      - Example: Two friends, one publicly spread a private secret (about a health issue) of the other. The offender is remorseful and wants to reconcile. The victim says they forgive but does not want to reconcile the friendship. The offender is hurt by this and feels the victim is being unfair.
      - Procedure:
          I.A: Harm is relational and reputational (private health issue made public). The victim feels betrayed and exposed.
          I.B: Offender acted out of anger (intentional) but now remorseful and wants to repair the friendship.
          I.C: The offender has apologized. The victim accepts the apology but does not want to be friends. The remedy proposed by the offender (restoring the friendship) is not feasible because the victim does not want it.
          I.D: Victim wants to move on without the friendship.
          II: Sympathy with the victim is warranted (the harm is significant). Sympathy with the offender's remorse is warranted, but not for their expectation of restored friendship.
          III: Impartial spectator would approve the victim's right to set boundaries. The offender's act was a serious breach of trust. The spectator would note that the victim's acceptance of the apology is sufficient for propriety, but the victim is not obligated to continue the friendship. The remedy (apology) was offered and accepted, but reconciliation (friendship) is not required.
          IV: Reconciliation is not achieved and is not feasible because the victim does not want it.
          V: The agreement is approved as the apology has been made and accepted. However, the mediator must document that the victim has chosen not to restore the friendship, and that is within the victim's right. The mediator will have to explain to the offender that the impartial spectator approves the victim's decision.

   VIII. Limitations of the Procedure
      - What the procedure cannot settle:
          - Deep cultural differences in what constitutes harm or proper remedy (unless the impartial spectator can be constructed with cultural sensitivity, which may require community input).
          - Cases where there is no consensus on the facts (he said/she said without evidence).
          - When the harm is so severe that no remedy seems adequate (e.g., loss of life, irreversible trauma).
          - When the offender is not remorseful and the victim is coerced into accepting a remedy.

      - Where it is likely to misfire:
          - In cases of power imbalances (e.g., domestic violence) where the victim may not feel safe to express true feelings.
          - When the mediator's own biases interfere with constructing a truly impartial spectator.
          - When the community standards are deeply divided.

      - Judgment calls that remain:
          - The degree of sympathy warranted (Step II) is inherently subjective, though guided by the impartial spectator.
          - The construction of the impartial spectator (Step III) requires the mediator to abstract away from personal views and imagine a truly impartial perspective, which is an art.
          - The assessment of proportionality of the remedy (Step III) is a value judgment.

   The checklist is designed to be completed in under an hour by having clear, focused questions and stopping rules. The mediator must document the reasoning at each step.
answer: |-
  ### Restorative Justice Mediation Decision Procedure  
  *Based on Adam Smith's Moral Psychology Framework*  

  **Core Principles**:  
  1. **Sympathy**: Fellow-feeling requiring cognitive alignment (not contagion). Asks: *"Can we understand and resonate with the emotional perspective of each party?"*  
  2. **Impartial Spectator**: Internal standard correcting self-interest. Asks: *"Would a dispassionate observer approve of this act/remedy?"*  
  3. **Propriety vs. Merit**:  
     - **Propriety**: Focus on *intentionality* (Was the act appropriate to circumstances?).  
     - **Merit**: Focus on *consequences* (Does the act deserve reward/blame?).  
  4. **Sharp Distinction**:  
     - **Empirical Observations** (verifiable facts).  
     - **Value Judgments** (sympathy/spectator approval—irreducible to facts).  

  ---

  ### Ordered Checklist with Stopping Rules & Judgment Nodes  
  **Time Limit**: 45-60 minutes. Document all answers for review.  

  #### **I. Empirical Observations** (15 mins)  
  *Objective: Establish facts without interpretation.*  
  1. **Harm Assessment**:  
     - What specific harm occurred? (e.g., reputational, relational, institutional).  
     - What evidence exists of its impact? (e.g., social isolation, loss of trust, financial cost).  
     - *Stopping Rule*: If harm is unverifiable, pause and seek corroboration. Proceed only if harm is documented.  

  2. **Intent & Agency**:  
     - What was the offender’s stated intent during the act?  
     - What contextual factors influenced their actions? (e.g., pressure, ignorance).  
     - *Stopping Rule*: If intent is indeterminable (e.g., conflicting accounts), note ambiguity but proceed.  

  3. **Remedy Feasibility**:  
     - What specific actions does the proposed remedy include? (e.g., apology, restitution, community service).  
     - Are resources/timelines realistic? (e.g., "public retraction" requires access to original audience).  
     - *Stopping Rule*: If remedy is logistically impossible (e.g., restoring a dissolved organization), reject and redesign.  

  4. **Stakeholder Positions**:  
     - Victim’s stance: What do they seek? (e.g., acknowledgment, material repair).  
     - Offender’s stance: Do they express remorse? What actions demonstrate it?  
     - Third-party views: What do affected communities/institutions report?  

  ---

  #### **II. Value Judgments** (20 mins)  
  *Objective: Apply Smith’s framework to assess moral alignment.*  
  5. **Sympathy Validation** (Judgment Node 1):  
     - *Victim’s perspective*: "Is the victim’s emotional response proportionate to the harm? Would a reasonable person share their feelings?"  
       - *Stopping Rule*: If **no** (e.g., victim demands excessive punishment for minor harm), flag as "improper sympathy" → revise remedy.  
     - *Offender’s perspective*: "Does the offender’s remorse reflect genuine understanding of harm? Can we sympathize with their contrition?"  
       - *Stopping Rule*: If **no** (e.g., remorse is performative), flag as "insincere" → require deeper accountability.  

  6. **Impartial Spectator Test** (Judgment Node 2):  
     - *Propriety*: "Would an impartial observer approve the offender’s *intentions* given the circumstances?"  
       - e.g., "Was the false accusation malicious (improper) or negligent (partially proper)?"  
     - *Merit*: "Would the observer judge the *consequences* as deserving of blame? How severely?"  
     - *Remedy Evaluation*: "Would the spectator see the proposed remedy as restoring moral balance? Does it risk being performative (e.g., hollow apology) or disproportionate?"  
       - *Stopping Rule*: If spectator **disapproves** → reject remedy. Return to Section I.  

  ---

  #### **III. Reconciliation Assessment** (10 mins)  
  *Objective: Determine if moral repair is achievable.*  
  7. **Voluntary Participation**:  
     - Does the victim freely engage? If not, why? (e.g., fear, apathy, trauma).  
     - *Stopping Rule*: If victim is coerced → halt process.  

  8. **Relational Restoration**:  
     - "Can trust be feasibly rebuilt? Or is the harm structural (e.g., institutional betrayal)?"  
     - *Judgment Node 3*: If harm is structural (beyond individual repair), endorse *symbolic* reparations (e.g., policy change) over relational reconciliation.  

  ---

  #### **IV. Final Decision** (5 mins)  
  9. **Agreement Approval Criteria**:  
     Approve only if:  
     - Harm is empirically verified (I.1).  
     - Remedy is feasible (I.3).  
     - Sympathy is warranted for both parties (II.5).  
     - Spectator approves remedy propriety *and* merit (II.6).  
     - *Otherwise*: Document why agreement fails.  

  ---

  ### Application to Scenarios  
  **Scenario 1: Straightforward Case**  
  *Context*: Shopkeeper falsely accuses teen of theft, announces it publicly. Teen’s reputation suffers. Remedy: Public apology + posted retraction.  
  - **I.1**: Harm verified (witnesses, teen’s social withdrawal).  
  - **I.2**: Intent: negligent (shopkeeper misidentified).  
  - **I.3**: Remedy feasible (shop has bulletin board).  
  - **II.5**: Sympathy warranted (victim’s shame; offender’s guilt).  
  - **II.6**: Spectator approves: remedy proportional (retraction addresses reputational harm).  
  - **Outcome**: Approved.  

  **Scenario 2: Structural Harm Exceeds Individual Remedy**  
  *Context*: NGO manager embezzles funds, causing program cancellation. Offender offers repayment. Victims (community) refuse reconciliation.  
  - **I.1**: Harm verified (lost services, distrust in NGO).  
  - **I.2**: Intent: malicious (premeditated theft).  
  - **I.3**: Repayment feasible but insufficient (trust not restored).  
  - **II.5**: Sympathy for victims warranted; offender’s remorse genuine but inadequate.  
  - **II.6**: Spectator: Remedy lacks merit—doesn’t address systemic distrust.  
  - **III.8**: Structural harm → endorse symbolic repair (e.g., offender funds audit system). Victim refusal respected.  
  - **Outcome**: Revised remedy approved; reconciliation not required.  

  **Scenario 3: Unsatisfying Outcome**  
  *Context*: Friend publicly shares another’s mental health struggle. Offender remorseful; victim forgives but rejects renewed friendship. Offender protests.  
  - **I.1**: Harm verified (victim experienced harassment).  
  - **I.2**: Intent: reckless (offender "wanted to help").  
  - **I.3**: Apology offered; victim accepts but sets boundary.  
  - **II.5**: Sympathy for both: victim’s betrayal valid; offender’s remorse sincere.  
  - **II.6**: Spectator: Propriety of victim’s boundary—no obligation to restore friendship.  
  - **III.7**: Victim’s refusal is voluntary → binding.  
  - **Outcome**: Agreement approved (apathy accepted) without forced reconciliation. *Mediator’s discomfort noted*: Moral desert met, but relational repair incomplete.  

  ---

  ### Limitations & Failure Points  
  1. **What the Procedure Cannot Settle**:  
     - **Absolute Impartiality**: Spectator construction is mediated by the mediator’s cultural/social biases.  
     - **Irreconcilable Value Conflicts**: e.g., Community norms clash with victim/offender preferences.  
     - **Non-Agentic Harm**: Harm caused by systems (e.g., poverty) where "offender" is abstract.  

  2. **Where It May Misfire**:  
     - **Power Imbalances**: Victim fear of retaliation may distort expressed preferences (I.4).  
     - **Performative Remorse**: Offenders may mimic "expected" emotions, fooling sympathy assessment (II.5).  
     - **Cultural Misalignment**: Spectator standards may not reflect marginalized groups’ experiences.  

  3. **Inevitable Judgment Calls**:  
     - **Sympathy Calibration** (II.5): No objective measure for "proportionate" emotional resonance.  
     - **Spectator Interpretation** (II.6): Balancing propriety vs. merit remains subjective.  
     - **Relational Feasibility** (III.8): Deciding if trust *can* be rebuilt is speculative.  

  **Final Note**: This procedure systematizes Smithian ethics but cannot eliminate ambiguity. Its strength lies in forcing explicit reasoning, not guaranteeing consensus. Mediators must document where judgment supersedes protocol.
