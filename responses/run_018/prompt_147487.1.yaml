answer: |-
  Here's the breakdown, cutting to the chase:

  **Bottom Line:** Confusing "claim-rights" (demanding something *from* others/city) with "liberty-rights" (freedom *from* interference) turns the NIMBY/YIMBY fight into a mess where both sides talk past each other using the same words wrongly. Shadow zoning injects *social coercion* into the system, creating scarcity *even when legal zoning allows more building*, breaking the simple "just change the law" economist model.

  **The Rights Mix-Up & Collapsed Debate:**

  1.  **Claim-Right (To Housing/Preservation):** This is what NIMBYs often *mean* when yelling "right to the city" – they claim a right *against* change, demanding the city/neighbors *provide* them with an unchanging neighborhood character or views. ("The city owes me protection from new buildings!")
  2.  **Liberty-Right (To Build/Use Property):** This is the core YIMBY argument – property owners should have the *freedom* to build what's legally allowed on their land *without* neighbors vetoing it via political pressure or restrictive zoning. ("I should be free to build an apartment if the code allows it.")
  3.  **The Collapse:** When NIMBYs use "right to the city" as a **claim-right** demanding *restrictions on others*, they are directly attacking the **liberty-right** YIMBYs champion. Using the same phrase ("right to the city") for these opposite concepts makes productive debate impossible. It's like both sides arguing about "freedom," but one means freedom *from* hunger (claim-right requiring action) and the other means freedom *of* speech (liberty-right requiring non-interference). They're fundamentally incompatible frameworks arguing over the same word.

  **Shadow Zoning & Breaking the Scarcity Argument:**

  1.  **Standard Economist View:** Restrictive zoning laws (like single-family only, height limits) are artificial government barriers. They directly limit supply ("scarcity"), driving up prices because demand exceeds legal supply. Remove/reform the laws, supply increases, prices moderate.
  2.  **Shadow Zoning:** This is the unwritten social pressure among long-term owners (e.g., "don't sell to developers," "don't build higher than 3 stories even if it's legal," mutual agreements not to subdivide lots). It creates *socially enforced scarcity*.
  3.  **How it Breaks the Model:**
      *   **Dependency:** Even if the *legal* barrier (zoning law) is removed (upzoning), **shadow zoning acts as a substitute barrier** through social pressure, threats of ostracization, or implicit collusion among owners. The *potential* supply unlocked by the law change isn't actually built.
      *   **Resulting Scarcity:** The artificial scarcity persists *despite* the legal change. The market isn't "free" to respond to new legal allowances because owners feel coerced into *not* exercising their new liberty-rights by the social norms (shadow zoning). The economist's "remove legal barrier -> increase supply" chain breaks at the human/social level.
      *   **It's Coercion, Not Preference:** This isn't just individual owners *choosing* not to develop (which the model expects). It's owners feeling *socially forced* not to, effectively creating an invisible cartel limiting supply.

  **The Connection:** Confusing claim-rights (NIMBY demands for preservation) with liberty-rights (YIMBY demands to build) prevents clear analysis of whose rights should prevail. Shadow zoning exploits this confusion by using social pressure (enforcing a *de facto* collective claim-right *against* development) to nullify the *de jure* liberty-right granted by upzoning, thus maintaining scarcity where the law suggests it should ease.

  **Verdict:** Mixing claim-rights and liberty-rights sabotages the core NIMBY/YIMBY conflict, while shadow zoning perpetuates artificial scarcity through social coercion even when zoning laws change, exposing a critical flaw in purely legalistic economic solutions.
