  The Type-7 case introduces a twist: full HOR capacity exists but is actively suppressed. My analysis must distinguish between two potential principles:
  1) Actual Occurrence Principle: requires real-time HOR activation
  2) Capacity Principle: only requires intact HOR machinery

  Looking at the anesthesia judgment, she clearly prioritizes actual occurrence over capacity. The active suppression in Type-7 seems analogous - the peptide inhibition parallels anesthetic deactivation. Both involve physiological blocking of HOR despite intact structures. 

  For the hypothetical test case, I consider contrasting scenarios:
