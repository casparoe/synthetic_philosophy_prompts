  - Case B: Permanent HOR incapacity despite identical architecture 

  These would cleanly separate the principles. The colleague would likely deny consciousness in Case A (following her anesthesia logic) but might grant it in Case B under Capacity Principle. Since she rejects capacity-based consciousness in anesthesia, Actual Occurrence seems her true criterion.

