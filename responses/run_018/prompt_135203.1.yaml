answer: |-
  Here's a precise breakdown of the conceptual tension you've identified, clarifying settled points and key controversies regarding indirect normativity, idealization, and the preservation of practical identity:

  **Core Conceptual Tension:** The ambiguity lies in whether "idealized deliberation" preserves the *particular content* of the actual agent's practical identity (values, commitments, attachments) or only the *formal structure* of rational agency (coherence, information, impartiality). This determines the *source* of the normative authority derived "indirectly."

  **Conceptually Settled Ground (Broad Agreement):**

  1.  **The Distinction Itself:** Philosophers widely acknowledge a distinction between:
      *   **Procedural Idealization:** Modifies *how* the agent reasons (corrects logical errors, removes ignorance, biases like akrasia or self-deception) while holding the *inputs* (core values, commitments, attachments) fixed as part of the agent's given practical identity. The ideal counterpart is "me, reasoning correctly with *my* fundamental concerns."
      *   **Substantive Idealization:** Modifies not just reasoning *processes* but also the *content* of the agent's evaluative standpoint. It may filter, reinterpret, or even replace elements of the actual agent's practical identity to meet substantive criteria of rationality (e.g., full coherence, impartiality, absence of "irrational" preferences). The ideal counterpart is "a perfectly rational agent occupying my *structural situation* (facts, circumstances, perhaps biological needs), but not necessarily bound by *my* particular evaluative perspective."

  2.  **Necessary Conditions for *Strict* Indirect Normativity:** There is broad consensus that for normative authority to be *indirectly* derived *from the agent's own practical identity* in a strong sense, the idealization must be **procedural**.
      *   **Continuity Condition:** The prescription must be recognizable as stemming from *the agent's own evaluative standpoint*, albeit refined. The ideal self must be "me, corrected," not "someone else rational."
      *   **Authority Source:** The normative force comes from the fact that *I* (my deeper, non-distorted self) endorse this course of action. It binds me because it expresses *my* (corrected) commitments.
      *   **Normative Link:** The "indirectness" here means my actual, flawed self accesses normative guidance *through* the lens of my ideal self, whose authority is parasitic on its being *my* ideal self.

  3.  **Substantive Idealization as a Different Model:** It's uncontroversial that substantive idealization fundamentally alters the source of normativity. The prescription originates not from the agent's particular practical identity, but from an objective standard of rationality applied to their situation. This aligns more closely with forms of **direct normativity** (e.g., Kantian universalizability, consequentialist optimization) or **externalist constructivism**, where rationality itself generates reasons.

  **Genuinely Contested Territory:**

  1.  **The Nature of the "Ideal Counterpart" in *Indirect* Normativity:**
      *   **Controversy:** *How much* procedural refinement can occur before it becomes substantive? What constitutes a "core" element of practical identity that *must* be preserved for the normative link to hold? Can significant "refinement" involve reinterpretation that the actual agent might initially reject?
      *   **Key Disagreement:** Proponents of robust practical identity preservation (e.g., Korsgaard, Williams-inspired views) argue even deep conflicts must be resolved *within* the framework of the agent's existing commitments. Others (e.g., certain interpretations of Railton's "ideal advisor," some Kantian constructivists) allow idealization to filter or reinterpret commitments more radically while still claiming an indirect link, arguing the result *is* what the agent *really* values upon full reflection, even if unrecognizable beforehand. This blurs the line.

  2.  **Survival of Partial/Conflicted Commitments under Idealization:**
      *   **Controversy:** Can genuinely partial commitments (e.g., deep familial loyalty) or internally conflicted commitments (e.g., valuing both ambitious career and deep family presence) survive *any non-trivial idealization* intact? Or does idealization inevitably resolve conflict/partiality by either:
          *   *(Procedural)* Revealing a latent hierarchy or coherent integration *within* the identity? (Settled?)
          *   *(Substantive)* Imposing an external standard of impartiality or coherence that *replaces* the conflict with a new evaluative stance? (e.g., demanding significant sacrifice of one commitment for the other based on an impersonal standard).
      *   **Key Disagreement:** **Williams** argued radical idealization (e.g., to a "point of view of the universe") often destroys the very commitments that give life meaning, making the result normatively inert *for the actual agent*. **Railton** argues his ideal advisor model, while requiring coherence and full information, preserves the *functional role* of the agent's non-moral values and thus retains an indirect link. **Parfit** (on Kantian grounds) and **consequentialists** argue that impartiality/optimization *is* the deliverance of correct reasoning, and conflicting partial commitments are irrational distortions to be overcome. **Korsgaard** argues practical identity itself requires a commitment to universalizability (moral identity), potentially resolving conflicts substantively but claiming it's still *internal* to agency.

  3.  **Normative Status of Substantive Idealization's Output:**
      *   **Controversy:** If the ideal counterpart is substantively different ("a rational agent in my position"), does this:
          *   **A:** Break the indirect normative link entirely? (The prescription isn't *mine*; it's alien).
          *   **B:** Transform indirect normativity into a *different kind* of indirect link (e.g., based on my commitment to rationality itself, or my structural identity as an agent)?
          *   **C:** Collapse it into direct normativity (universal reason dictates X)?
      *   **Key Disagreement:** This is the heart of your tension.
          *   **Position A (Williams, Foot, some Humeans):** Substantive idealization severs the link to *my* practical identity. Its prescriptions may be rational, but lack *authority* over *me* unless I happen to endorse them. It's not indirect normativity *as originally conceived*.
          *   **Position B (Korsgaard, Kantian Constructivists, Railton to some extent):** The commitment to being an agent *just is* a commitment to being rational in a substantive way (universal lawgiving, coherence under full information). The normative force comes indirectly *from my own agency*, even if the specific commitments change. The ideal self *is* me, understood as the agent I constitutively aim to be. The structural position *is* fundamentally tied to *who I am* as an agent.
          *   **Position C (Parfit, Objective Consequentialists, Platonists):** Substantive idealization reveals objective normative truths or the direct demands of impartial rationality. The "indirect" machinery is either unnecessary or merely an epistemic tool to access direct reasons. The link isn't personal identity-based.

  **What Must Be Settled Conceptually for the Indirect Link to Hold:**

  For the normative prescription to derive its authority *indirectly from the actual agent's own practical identity*:

  1.  **Identity Preservation:** The ideal counterpart must retain the *core constitutive elements* of the actual agent's practical identity (her fundamental values, commitments, attachments) as *inputs* to deliberation. These elements cannot be fundamentally altered or replaced by the idealization process; they can only be rendered coherent and consistently applied with full knowledge.
  2.  **Continuity of Endorsement:** The resulting prescription must be such that the actual agent *can recognize it* (upon understanding the idealization process) as expressing what *she herself* would will, given her corrected perspective on *her own* concerns. It must not be alien.
  3.  **Source of Authority:** The binding force must stem from the fact that *this specific agent's* (corrected) practical identity endorses the action. The authority is not located purely in the rational structure itself, but in its manifestation of *her* identity.

  **Conclusion on the State of Play:**

  The conceptual core of *strict* indirect normativity (authority derived from the agent's *particular* practical identity) requires **procedural idealization**. There is broad agreement that **substantive idealization** fundamentally changes the source of normativity. The **genuine controversies** lie in:

  1.  How strictly "procedural" must be defined (how much reinterpretation of commitments is allowed?).
  2.  Whether conflicted or partial commitments *can* survive procedural idealization coherently, or if their resolution inherently involves substantive change.
  3.  Whether the output of substantive idealization can have *any* kind of normativity that remains "indirect" in a meaningful sense (Position B), or if it inevitably becomes either alien (Position A) or directly authoritative rational truth (Position C).

  Your insight highlights that the viability of indirect normativity hinges critically on a contested and often underspecified thesis about the **robustness and persistence of the particular practical identity through the process of rational idealization.** Whether substantive idealization "breaks" the link or "transforms" it into something else is precisely where the deepest philosophical disagreements reside. There is *no consensus* on this transformation point; it defines major fault lines in metaethics and the philosophy of practical reason. Your project is positioned precisely at this critical juncture.
