  We are drafting a joint statement between two camps: 
  1. Ascription-universalists: They think universal ascriptions (like "rationality", "efficiency", etc.) are thin cognitive scaffolds that let us compare across domains without necessarily imposing dominance. They are tools for bridging, not erasing, local differences.
  2. Epistemic-dominance skeptics: They think every universal frame is also a power move that makes local knowledge invisible by treating it as a "special case" that must be explained away or absorbed.

  The goal is a document they both sign, so it must be honest about both agreements and disagreements.

  Structure:
  - Agreed claims (what both sides accept)
  - Disagreements (each side's view in their own wording)
  - Cruxes (specific points of divergence with concrete cases and each side's prediction)

  Settled vs contested: We note what is settled (e.g., both reject moral relativism) and what is genuinely contested.

  Casual tone: A typo or two is fine.

  After the prose, a JSON summary with:
  - agreed_claims: list of strings
  - disagreements: list of dicts with "topic", "universalist_wording", "skeptic_wording"
  - cruxes: list of dicts with "crux_name", "bearing_case", "universalist_prediction", "skeptic_prediction"
  - settled_vs_contested_notes: list of strings

  Key concepts:
  - Ascription universality: The use of terms that apply across contexts (e.g., calling a ritual "efficient" or a myth "rational").
  - Epistemic dominance: When a universal frame sets the terms of evaluation so that local knowledge must justify itself in the frame's terms, rendering it subordinate.

  Agreements (both sides would accept):
  1. Both reject that this is moral relativism: They agree that there are better and worse ways to understand the world, but that doesn't mean all claims are equally valid.
  2. Both agree that universality claims are often used as tools of domination, but the universalists think this is avoidable, while the skeptics think it's inherent.
  3. Both agree that "thin ascription" (using the same word, like "efficient", across contexts) exists and is common.
  4. Both agree that "thick dominance" (imposing norms of evidence, methodology, and value) is harmful and often occurs.
  5. Both reject the idea that local knowledge is always superior or that universal frameworks are always oppressive.

  Disagreements (each side's wording):
  - On the relationship between thin ascription and thick dominance:
    - Universalist: "Thin ascriptions can function as neutral bridges for cross-contextual comparison without necessarily entailing thick dominance, because they allow for local specification of what the ascription means in practice."
    - Skeptic: "Even thin ascriptions are never neutral because they carry with them implicit norms from their context of origin, which inevitably frame local practices as deviations requiring explanation or justification."

  - On the possibility of exceptions overturning universals:
    - Universalist: "A local exception that cannot be reconciled with a universal frame can and should lead to the refinement or abandonment of that frame, demonstrating the framework's responsiveness to empirical challenge."
    - Skeptic: "Universal frames are inherently resistant to falsification by local exceptions because they can always reinterpret the exception as a special case or an error, thus preserving the frame's dominance."

  Cruxes:
  1. Crux: Can thin universality exist without thick dominance?
     - Bearing case: Using the term "efficient" to describe both a high-tech factory and a traditional farming method. The universalist claims we can agree on a minimal definition (e.g., "achieving desired outcomes with minimal waste") but allow each context to define waste and desired outcomes locally. The skeptic claims that even this minimal definition smuggles in Western industrial notions of waste and outcome measurement.
     - Universalist prediction: If we keep the ascription thin and let each context set its own parameters, the term can be used without dominance. The farming community can define efficiency in terms of ecological harmony and social cohesion without being forced into industrial metrics.
     - Skeptic prediction: The very use of "efficiency" will trigger a demand for quantification and comparison using standardized metrics, which will inevitably favor the industrial context and force the farming community to either adopt those metrics or be seen as "less efficient."

  2. Crux: Can a local exception overturn a universal frame?
     - Bearing case: A universal frame claims "all human societies have markets for goods." Then we encounter a society that practices only gift exchange and no explicit markets. 
     - Universalist prediction: The universal frame will be revised to something like "all societies have systems for distributing goods," which now includes gift economies, or abandoned if it cannot account for the exception. The exception forces a rethinking.
     - Skeptic prediction: The universal frame will absorb the exception by redefining "market" to include gift exchange (e.g., "a market is any system of exchange") or by treating the society as a primitive or deviant case. The frame remains dominant.

  Settled vs contested notes:
  - Settled: Both sides agree that epistemic dominance is a real problem in cross-cultural and interdisciplinary work.
  - Contested: Whether thin universality can be decoupled from thick dominance, and whether universal frames are falsifiable by local exceptions.

  Now, the joint statement in prose:

  ---

  **Joint Statement on Ascription Universality and Epistemic Dominance**

  We, undersigned from the ascription-universalist and epistemic-dominance skeptic camps, after deliberating in good faith, agree on the following:

  1. **Universality in ascription** refers to the use of terms (e.g., "rational," "efficient") that are applied across diverse contexts to enable comparison and dialogue. We agree that such ascriptions are often "thin" – meaning they provide a minimal shared vocabulary without prescribing local details.
  2. **Epistemic dominance** occurs when a universal frame sets the standards of evidence, explanation, and value in a way that marginalizes local knowledge, treating it as inferior or as a deviation to be explained away.
  3. We both reject the claim that our concerns are merely a form of moral relativism. We agree that some explanations are better than others, but this does not justify the imposition of one context's norms onto another.
  4. We agree that thick dominance (enforcing specific norms and methods) is harmful and often occurs alongside universal claims. However, we disagree on whether this is inherent to universality as such.
  5. We also reject the reverse notion: that local knowledge is always superior or that universal frameworks are inherently oppressive without exception.

  Despite these agreements, we hold the following disagreements, stated in our own terms:

  - On the relationship between thin ascription and dominance:
    - Universalist camp: "Thin ascriptions can operate as neutral scaffolds for comparison, allowing for local contextualization without imposing external norms of evidence or value. They are bridges, not bulldozers."
    - Skeptic camp: "All universal ascriptions, even thin ones, carry the baggage of their originating context and create hierarchies by positioning local practices as variants or exceptions to a universal norm, thus enacting epistemic dominance even when unintended."

  - On the falsifiability of universal frames by local exceptions:
    - Universalist camp: "A robust universal frame is open to revision or abandonment when confronted with a local exception that cannot be assimilated without distortion. This is how knowledge grows."
    - Skeptic camp: "Universal frames are inherently resilient; they absorb exceptions by reinterpreting them as special cases or errors, thereby maintaining the frame's authority and invisibilizing the local."

  We identify the following cruxes as pivotal to our disagreement, and we outline predictions for how each would interpret a concrete case:

  **Crux 1: The Independence of Thin Ascription from Thick Dominance**  
  - *Bearing Case*: The application of "efficiency" to both a high-tech factory (where it means output per hour) and a traditional farming community (where it might mean sustaining soil health and community bonds over generations).  
    - *Universalist prediction*: If the farming community defines efficiency in their own terms (e.g., "we measure efficiency by the number of families fed per acre without degrading the land"), the thin term can be used without imposing factory metrics, allowing genuine dialogue.  
    - *Skeptic prediction*: The term "efficiency" will inevitably invoke standardized metrics (e.g., yield per labor-hour) from dominant contexts, pressuring the farmers to justify their practice in those terms or be deemed inefficient.  

  **Crux 2: The Overturn Potential of Local Exceptions**  
  - *Bearing Case*: A universal claim that "all human societies have property rights" encounters a society where land is held collectively and access is governed by kinship obligations without individual ownership.  
    - *Universalist prediction*: The universal claim will be revised (e.g., to "all societies have systems for regulating access to resources") or abandoned, with the exception prompting a more nuanced framework.  
    - *Skeptic prediction*: The universal frame will stretch to absorb the exception (e.g., "kinship obligations are a form of property right") or label the society as 'primitive', thus preserving the frame's universality and its dominance.  

  Finally, we note:  
  - Settled: Epistemic dominance is a real and pervasive issue in knowledge production.  
  - Contested: Whether thin universality can ever be decoupled from dominance, and whether universal frames can be genuinely falsified by local counterexamples.

