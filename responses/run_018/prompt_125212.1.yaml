  Draft the joint statement that an ascription-universalist camp and an epistemic-dominance skeptic camp could both sign after arguing in good faith about universality and epistemic dominance -- specifically around "ascription universality." One side think universal ascriptions are just thin cognitive scaffolds that let us compare across domains without smuggling in dominance; the other side think every universal frame is also a power move that makes local knowledge invisible by treating it as a "special case" that needs explaining away. I want the doc they'd actually both put their names to.

