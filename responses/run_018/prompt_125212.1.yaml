  Keep it in the weeds -- don't just rehearse the usual universalism-vs-relativism script. You can sharpen things with a niche distinction like "thin ascription" versus "thick dominence" if it helps, but don't invent fake scholars or texts.

  Please separate what's settled from what's genuinely contested among people who actually work on this, and don't present a contested view as the consensus.

