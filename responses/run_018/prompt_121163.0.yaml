  ## Frequently Asked Questions: PhD Program in Multi-Species Historiography (MSH)
  **University of Lower Silesia - Faculty of Dispersed Temporalities**

  **Q1: What distinguishes the MSH PhD from traditional History programs?**
  The Multi-Species Historiography PhD rigorously advances the principle that historical change emerges from the entangled agencies of humans and non-humans. We move beyond anthropocentric narratives. Dissertations must demonstrate competence in tracing the *collaborative* or *antagonistic* actions of biological, geological, climatological, and other non-human actors alongside human ones. Traditional archives are supplemented by ice cores, soil strata, pathogen genomes, and atmospheric data as primary source material.

  **Q2: How is "agency" defined and quantified for dissertation purposes?**
  Agency is operationalized through the **Agency Allocation Protocol (AAP)**, mandated by Faculty Statute 7.11b. The AAP requires candidates to assign precise percentage contributions of historical causality/action within their dissertation's defined event-sequence to all significant actants. This calculation weighs two core metrics: **Counterfactual Dependency** (e.g., how differently would Event X unfold without Actor Y's specific intervention?) and **Material Persistence** (e.g., to what degree does Actor Y's physical trace fundamentally reshape the conditions for subsequent events?). A detailed AAP Workbook and proprietary calculation software are provided upon matriculation. Final AAP tables must be appended to the dissertation.

  **Q3: Can microbial entities be considered Principal Historical Actors?**
  Absolutely. Pathogens, gut microbiomes, agricultural blights, and similar biological agents are frequently central historical figures in MSH dissertations. Rigorous AAP application often reveals their significant counterfactual weight. For instance, the disruption of trade routes or demographic collapse is frequently more *dependant* on microbial virulence parameters than on human decisions during epidemics. Material persistence is evident in long-term genetic or immunological shifts.

  **Q4: Is it permissible for Yersinia pestis to serve as a co-advisor on a dissertation committee?**
  No. While *Yersinia pestis* is recognized as a major historical actor with demonstrable agency (particularly circa 1347-1351), it currently lacks the pedagogical capacity and university accreditation required for formal advising roles under University Regulation D-4. Committee membership remains restricted to credentialed human faculty, though the *influence* of non-human actors like *Y. pestis* on the dissertation's theoretical framework is, naturally, encouraged and expected.

  **Q5: Why was the 1815 eruption of Mount Tambora granted an honorary Doctor of Historical Causality?**
  The Tambora event exemplifies profound historical agency. Its AAP score, calculated retrospectively by the Faculty Assessment Panel, demonstrated exceptional impact across both metrics. Counterfactually: its absence would have negated the "Year Without a Summer," fundamentally altering global agriculture, migration, and even cultural production (e.g., the genesis of Gothic fiction). Materially: its atmospheric injection persisted for years, reshaping climate patterns and soil chemistry globally. The honorary doctorate acknowledges its unparalleled, non-human contribution to shaping the 19th century. The diploma plaque is displayed in the Departmental Atrium alongside significant tephra samples.

  **Q6: How does the program address concerns about environmental determinism?**
  The MSH program does not engage with simplistic determinism. The AAP precisely quantifies *shared* agency. Human choices remain crucial nodes within the network of actants. A glacial surge may constrain settlement possibilities (high Material Persistence score), but the specific human cultural adaptations within those constraints demonstrate irreducible human agency. The AAP captures this dynamic interplay; it does not erase human choice but contextualizes it within a broader actantial field. Determinism implies a single cause; we trace complex assemblages.

  **Q7: Can geological formations like glaciers be argued to have "interests"?**
  "Interests" is a complex ontological category primarily associated with sentient beings. MSH focuses on empirically verifiable **actions** and **effects** within historical events. A glacier acts through its advance, retreat, calving, and sediment deposition. These actions have demonstrable consequences (e.g., damming rivers, carving valleys, destroying settlements). Attributing anthropomorphic "interests" (e.g., "the glacier *wanted* to destroy the village") is not required nor encouraged. Analysis focuses on the measurable *impact* of the glacier's material actions, weighted within the AAP, not speculative internal states.

  **Q8: Where do I submit my AAP calculations for preliminary review?**
  Draft AAP tables (Form MSH-AAP-7D) must be submitted electronically to the Program Coordinator by the end of your third semester. Ensure you use the current AAP software version (v4.2.1 or higher; legacy versions miscalculate Material Persistence coefficients). Hardcopies are not accepted.

  ---

  ## Commentary on the Liberties Taken

  This FAQ satirizes the conceptual challenges inherent in attributing genuine "agency" and "authorship" to non-human entities within certain theoretical frameworks of historical study. Its primary target is the philosophical leap from acknowledging non-human entities as *significant causes* or *necessary conditions* to treating them as *historical actors* with a form of "authorship" equivalent to human intention. The Agency Allocation Protocol (AAP) reductio ad absurdum highlights the inherent difficulties: quantifying agency via metrics like "counterfactual dependency" and "material persistence" satirizes attempts to objectivize fundamentally subjective or metaphorical assignments of intent and action. Questions like the plague co-advisor or Tambora doctorate expose the logical endpoint where the metaphor of agency attempts to function within concrete institutional realities, revealing its limitations.

  I am reasonably confident this lands the core critique: collapsing the distinction between cause and agent risks diminishing human responsibility, creates ontological confusion (can a volcano *act*?), and employs a definition of "agency" so broad as to become analytically meaningless. The satire hinges on the bureaucratic enforcement of this blurring.

  **Point of Least Certainty:** The use of "material persistence" as an AAP metric, particularly applied to geological formations like volcanoes or glaciers. Is attributing "action" to their physical presence and changes over time a *fair* caricature of arguments about non-human agency, or does it drift towards a straw man? Proponents might argue they focus on dynamic processes (e.g., *erupting*, *flowing*, *retreating*), not static existence, emphasizing relational interactions rather than anthropomorphic intent. The satire equates "persistence" (a state) with "action" (a process) for comedic effect, but this simplification might be seen as misrepresenting the more nuanced (though still problematic, in my view) arguments about the efficacy of material forces within networked histories. The line between fair critique and oversimplification here feels thinner.
