  Can you draft 6-8 questions that don't let him just repeat the standard "pain without suffering" line? Specifically I want:
  - one pressing him on chronic-pain patients with extreme distress ratings—does his view force him to say they're misfiring the appraisal mechanism, and what's his reply to that?
  - one asking if engineered "good pain" (spicy food, rollercoasters) should be possible if the appraisal layer can be trained, with a follow-up keyed to when he brings up his niche claim that affective framing gets developmentally locked after early childhood
  - one on whether asymbolia patients describing hurt-without-badness are reporting two distinct mental states or just failing at integretion, plus the follow-up for his likely answer

  Please also say how confident you are in what you're claiming here and single out the point you're least sure about. (Sorry if there's typos—typing on my phone between patients.)
